source:
  edition: WLC
  text: שְׁמָ֨ר לְ/ךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּ/ךָ֣ הַ/יּ֑וֹם הִנְ/נִ֧י גֹרֵ֣שׁ מִ/פָּנֶ֗י/ךָ אֶת הָ/אֱמֹרִי֙ וְ/הַֽ/כְּנַעֲנִ֔י וְ/הַ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: pt
  text: Guarde o que hoje lhe ordeno.[a] Eis que expulsarei de diante de você[b] os amorreus, os cananeus, os hititas, os ferezeus, os heveus e os jebuseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Observe o que hoje lhe ordeno” ou “Tenha cuidado com o que hoje lhe ordeno”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de diante de você”; a expressão indica a remoção da presença ou do caminho de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Guarde
  rationale: O imperativo de שׁמר pode significar guardar, observar ou cumprir. “Guarde” conserva a imagem lexical e, com o objeto seguinte, comunica que a ordem deve ser atentamente observada; o dativo לְךָ não precisa ser traduzido de forma isolada e pouco natural.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: o que hoje lhe ordeno
  rationale: A oração relativa é direta. A posição de “hoje” junto ao verbo é natural em português e mantém sua ligação mais provável com o ato de ordenar.
- source_word: הִנְנִי
  choice: Eis que
  rationale: A expressão chama a atenção para a ação divina enfática e iminente. “Eis que” preserva essa função em registro bíblico digno, ainda compreensível no português moderno.
- source_word: גֹרֵשׁ
  choice: expulsarei
  rationale: גרש significa expulsar ou fazer sair. A construção הִנְנִי com particípio apresenta uma ação iminente ou firmemente determinada; o futuro português exprime isso com maior naturalidade do que uma forma progressiva.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: A tradução conserva de modo natural a preposição מִן e a imagem de remoção da presença ou do caminho do destinatário.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: os amorreus, os cananeus, os hititas, os ferezeus, os heveus e os jebuseus
  rationale: Os gentílicos hebraicos estão no singular coletivo; o plural é a forma natural em português. Empregam-se as formas portuguesas tradicionais e amplamente reconhecidas.
theological_decisions:
- issue: Nuance do imperativo שׁמר no contexto da aliança
  choice: Traduzir como ordem para guardar e observar aquilo que Deus ordena
  alternative: Tenha cuidado com o que hoje lhe ordeno / Cumpra o que hoje lhe ordeno
  rationale: “Guarde” mantém a amplitude de שׁמר sem reduzi-lo apenas a uma advertência nem acrescentar explicitamente o verbo “cumprir”, embora a obediência esteja implicada.
- issue: Valor temporal da construção הִנְנִי גֹרֵשׁ
  choice: Eis que expulsarei
  alternative: Eis que estou expulsando
  rationale: O particípio pode apresentar ação em curso, iminente ou certa. No contexto da promessa, o futuro natural em português preserva a iminência e a certeza sem afirmar que a expulsão já estava materialmente em andamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para o singular hebraico. “Eis que” conserva a solenidade e a função enfática da expressão hebraica. A sintaxe evita tanto literalismo pouco natural quanto paráfrase interpretativa excessiva.
