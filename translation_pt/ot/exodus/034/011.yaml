  terminology: Os etnônimos tradicionais — amorreus, cananeus, hititas, ferezeus, heveus e jebuseus — estão corretos e reconhecíveis. “Expulsarei” é adequado para גרש e evita suavizar a ação descrita. As notas preservam alternativas lexicais reais e a nota b está corretamente ancorada na expressão “de diante de você”.
