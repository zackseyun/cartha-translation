base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: pt
  text: Ele ficou ali com Yahweh durante quarenta dias e quarenta noites; não comeu pão nem bebeu água. E escreveu[a] nas tábuas as palavras da aliança, as dez palavras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Yahweh escreveu”, pois em outros textos a escrita nas tábuas é atribuída a Yahweh (ver Êxodo 34:1; Deuteronômio 10:4).'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “as dez palavras”; tradicionalmente, “os Dez Mandamentos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em conformidade com a opção do projeto, em vez de substituí-lo por um título.
- source_word: וַיְהִי שָׁם עִם
  choice: Ele ficou ali com
  rationale: Expressa de modo natural a permanência e a presença de Moisés junto de Yahweh, sem acrescentar uma nuance ausente do hebraico.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: quarenta dias e quarenta noites
  rationale: Tradução direta e idiomática da expressão de duração.
- source_word: לֶחֶם לֹא אָכַל
  choice: não comeu pão
  rationale: Mantém o substantivo concreto “pão”, explicitamente presente no hebraico, sem generalizá-lo para “alimento”.
- source_word: וּמַיִם לֹא שָׁתָה
  choice: nem bebeu água
  rationale: Preserva o paralelismo negativo da frase em português natural.
- source_word: וַיִּכְתֹּב
  choice: E escreveu
  rationale: Conserva o verbo simples “escrever” e deixa o sujeito implícito, como no hebraico; no fluxo imediato, ele é naturalmente entendido como Moisés.
- source_word: עַל הַלֻּחֹת
  choice: nas tábuas
  rationale: Equivalente corrente para as tábuas de pedra da aliança; “nas” é mais natural em português do que “sobre as” neste contexto.
- source_word: דִּבְרֵי הַבְּרִית
  choice: as palavras da aliança
  rationale: Preserva a relação sintática e o sentido pactual da construção hebraica.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: as dez palavras
  rationale: Reproduz de forma transparente a expressão hebraica literal, deixando a designação tradicional para a nota.
theological_decisions:
- issue: Sujeito de “E escreveu”
  choice: Manter o sujeito implícito, naturalmente entendido como Moisés no encadeamento imediato.
  alternative: “E Yahweh escreveu”
  rationale: O verbo hebraico está na terceira pessoa masculina singular, sem sujeito expresso. A sequência imediata favorece Moisés como sujeito contínuo, mas Êxodo 34:1 e Deuteronômio 10:4 atribuem a escrita a Yahweh. A nota preserva essa tensão textual em vez de harmonizá-la silenciosamente.
- issue: Tradução de עֲשֶׂרֶת הַדְּבָרִים
  choice: as dez palavras
  alternative: os Dez Mandamentos
  rationale: A tradução principal segue de perto a expressão hebraica; a forma tradicional e interpretativa é registrada em nota para reconhecimento do leitor.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção concisa conserva o paralelismo hebraico e evita explicitar indevidamente o sujeito do último verbo.
