  naturalness: A redação revisada permanece clara e natural em português moderno. “Animais de criação” evita que “gado” seja entendido apenas como bovinos, e “animal do rebanho miúdo” preserva com precisão o contraste com “boi”.
  terminology: “Primogênito”, “é meu” e “macho primogênito” refletem adequadamente os termos e a construção jurídica hebraicos. “Boi” corresponde diretamente a שׁוֹר; “animal do rebanho miúdo” conserva a abrangência de שֶׂה, que pode referir-se a ovelha ou cabra conforme o contexto.
