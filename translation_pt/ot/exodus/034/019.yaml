  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: pt
  text: Todo primogênito[a] é meu[b], e todo macho primogênito[c] entre os seus animais de criação — de boi ou de animal do rebanho miúdo — também é meu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo o que abre o ventre”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pertence a mim”.'
    reason: lexical_alternative
  - marker: c
    text: A construção hebraica, bastante compacta, especifica os machos primogênitos entre os animais. “Animal do rebanho miúdo” pode referir-se a uma ovelha ou a uma cabra.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: Todo primogênito
  rationale: A expressão hebraica designa, literalmente, todo aquele que primeiro abre o ventre. “Todo primogênito” comunica de modo natural o sentido do idioma, enquanto a nota preserva sua forma concreta.
- source_word: לִי
  choice: é meu
  rationale: A preposição marca posse ou reivindicação. “É meu” expressa de forma direta e concisa a declaração divina.
- source_word: מִקְנְךָ
  choice: seus animais
  rationale: O termo coletivo abrange os animais domésticos possuídos, especialmente rebanhos e gado. “Seus animais” é claro no contexto e evita restringi-lo apenas ao gado bovino.
- source_word: תִּזָּכָר
  choice: macho primogênito
  rationale: Neste contexto legal, a forma de זכר especifica que estão em vista os machos. A formulação portuguesa explicita a relação elíptica com o primogênito mencionado na primeira oração.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: seja do gado bovino, seja das ovelhas ou das cabras
  rationale: שׁוֹר indica o gado bovino, e שֶׂה pode designar um animal do rebanho miúdo, tanto ovelha quanto cabra. A tradução torna claras em português as duas classes abrangidas.
theological_decisions:
- issue: Reivindicação divina sobre os primogênitos
  choice: O versículo afirma que o primogênito é do SENHOR, sem acrescentar uma explicação sobre consagração ou sacrifício.
  alternative: Explicitar que todo primogênito deve ser consagrado ou oferecido ao SENHOR.
  rationale: O hebraico declara diretamente a posse divina e especifica os machos primogênitos dos animais. Explicações cultuais mais amplas pertencem ao contexto, não devem ser inseridas nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “é meu” supre em português o predicado elíptico da segunda oração. “Ovelhas ou cabras” explicita a extensão lexical de שֶׂה sem restringi-la indevidamente.
