  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: pt
  text: Yahweh desceu na nuvem, pôs-se ali junto dele e proclamou o nome de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “invocou o nome de Yahweh”; ou: “proclamou em nome de Yahweh”. No hebraico, a expressão inclui literalmente a preposição “em/por” antes de “nome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título, e mantém a distinção presente no hebraico.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Expressa de modo natural e direto o movimento descendente indicado por ירד.
- source_word: בֶּעָנָן
  choice: na nuvem
  rationale: O בְּ marca aqui localização, e o artigo incorporado aponta para a nuvem teofânica conhecida no contexto de Êxodo.
- source_word: וַיִּתְיַצֵּב
  choice: ficou
  rationale: No contexto, o hitpael de יצב comunica que Yahweh tomou posição ou permaneceu ali; “ficou” é natural em português e se combina com “ali junto dele” sem rigidez excessiva.
- source_word: עִמּוֹ שָׁם
  choice: ali junto dele
  rationale: Preserva tanto a localização indicada por שָׁם quanto a relação de proximidade expressa por עִמּוֹ. O pronome mantém a referência contextual a Moisés sem explicitação desnecessária.
- source_word: וַיִּקְרָא
  choice: proclamou
  rationale: Embora קרא também possa significar “chamar” ou “invocar”, a continuação no versículo seguinte favorece aqui o sentido declarativo de proclamar.
- source_word: בְשֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Depois de “proclamou”, esta formulação é clara e idiomática em português. A preposição בְ e as alternativas legítimas da construção são registradas em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal revelado a Israel sem substituí-lo por um título.
- issue: Sujeito e sentido de וַיִּקְרָא
  choice: Yahweh continua sendo o sujeito, e o verbo é traduzido por “proclamou”
  alternative: Moisés como sujeito; ou “invocou/chamou”
  rationale: 'A sequência narrativa mantém naturalmente Yahweh como sujeito: ele desceu, ficou e proclamou. O conteúdo que segue em Êxodo 34:6 também favorece uma autoproclamação divina, embora a construção preposicional admita outras nuances, preservadas em nota.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe concisa acompanha a sequência narrativa hebraica; o pronome “dele” preserva a forma do original, cujo referente contextual é Moisés.
