  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: pt
  text: Esteja pronto para a manhã e, pela manhã, suba ao monte Sinai e apresente-se ali diante de mim, no topo do monte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: Esteja pronto
  rationale: A combinação do imperativo de היה com נָכוֹן expressa uma ordem para estar preparado; “esteja pronto” é natural, atual e fiel ao sentido.
- source_word: לַבֹּקֶר
  choice: para a manhã
  rationale: A preposição ל relaciona a preparação com a manhã seguinte. “Para a manhã” preserva essa referência sem confundi-la com בַבֹּקֶר na oração seguinte.
- source_word: וְעָלִיתָ
  choice: suba
  rationale: עלה denota subir. Em português, “suba ao monte Sinai” é idiomático; o contexto da fala divina permite entendê-lo como movimento em direção ao lugar da presença de Deus sem precisar explicitar “venha”.
- source_word: בַבֹּקֶר
  choice: pela manhã
  rationale: A expressão temporal indica quando Moisés deve subir e é distinguida da preparação “para a manhã” mencionada antes.
- source_word: אֶל הַר סִינַי
  choice: ao monte Sinai
  rationale: Forma portuguesa corrente e clara para o nome geográfico.
- source_word: וְנִצַּבְתָּ לִי
  choice: apresente-se ... diante de mim
  rationale: O nifal de נצב pode significar pôr-se de pé, tomar posição ou apresentar-se. Com לִי e neste contexto formal, “apresente-se diante de mim” comunica naturalmente a comparecência perante Deus.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que remete ao lugar indicado no monte Sinai.
- source_word: עַל רֹאשׁ הָהָר
  choice: no topo do monte
  rationale: רֹאשׁ, literalmente “cabeça”, tem aqui o sentido topográfico de topo ou cume; “no topo do monte” é claro e natural.
theological_decisions:
- issue: Orientação dêitica de עלה na fala divina
  choice: suba
  alternative: venha para cima / vá para cima
  rationale: O hebraico expressa o movimento ascendente, mas não obriga a explicitar em português a orientação como “vir” ou “ir”. “Suba” preserva a ambiguidade e evita acrescentar uma localização específica do falante além do que o contexto fornece.
- issue: Sentido de וְנִצַּבְתָּ לִי
  choice: apresente-se diante de mim
  alternative: fique ali de pé para mim
  rationale: A formulação escolhida expressa comparecimento formal perante Deus, enquanto a alternativa preserva mais diretamente a postura física. O contexto favorece “apresente-se”, sem excluir a ideia de permanecer de pé.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “manhã” foi mantida para refletir a sequência do hebraico: preparação para a manhã e subida pela manhã. Não foram necessárias notas de rodapé.'
