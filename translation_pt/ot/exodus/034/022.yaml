review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente as duas festas, as primícias da colheita de trigo e a referência ao ciclo anual. Contudo, «com as primícias» pode sugerir que as primícias são apenas um acompanhamento ritual da festa, enquanto o hebraico identifica a Festa das Semanas como a festa ligada às primícias da colheita de trigo. «Festa da Colheita» também generaliza הָאָסִיף, que se refere mais especificamente ao recolhimento dos produtos.
  naturalness: O texto é claro e tem registro apropriado. «Festa do Recolhimento» é uma designação compreensível e mais específica no contexto agrícola-ritual; a construção «Festa das Semanas, das primícias da colheita do trigo» preserva de modo conciso a aposição hebraica.
  terminology: «Festa das Semanas», «primícias» e «colheita do trigo» são escolhas precisas. «Festa do Recolhimento» traduz melhor אָסִיף do que a designação mais ampla «Festa da Colheita». A nota temporal está corretamente ancorada e preserva a alternativa «no fim do ano».
  issues:
  - severity: medium
    issue: «com as primícias da colheita do trigo» enfraquece a relação apositiva entre a Festa das Semanas e as primícias.
    rationale: O hebraico apresenta «as primícias da colheita do trigo» como especificação da Festa das Semanas, não explicitamente como algo que se celebra “com” ela.
  - severity: medium
    issue: «Festa da Colheita» é mais genérico que «Festa do Recolhimento».
    rationale: אָסִיף designa o ajuntamento/recolhimento da produção, e a formulação revista conserva essa nuance sem recorrer a linguagem obscura.
  revised_text: Celebre a Festa das Semanas, das primícias da colheita do trigo, e a Festa do Recolhimento, na virada do ano.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “no fim do ano”. A expressão hebraica se refere literalmente à virada ou ao ciclo do ano.'
    reason: lexical_alternative
