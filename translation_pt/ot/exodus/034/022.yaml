base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: pt
  text: Celebre a Festa das Semanas, das primícias da colheita do trigo, e a Festa do Recolhimento, na virada do ano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no fim do ano”. A expressão hebraica se refere literalmente à virada ou ao ciclo do ano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג שָׁבֻעֹת
  choice: Festa das Semanas
  rationale: Preserva o nome hebraico transparente do festival, literalmente ligado às “semanas”, sem substituí-lo pelo nome posterior “Pentecostes”.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Celebre
  rationale: Neste contexto, o verbo “fazer” com “festa” significa celebrá-la ou observá-la. O imperativo em português comunica naturalmente a obrigação da formulação hebraica; o dativo לְךָ não exige uma expressão separada e pouco natural como “para você”.
- source_word: בִּכּוּרֵי
  choice: primícias
  rationale: Termo português preciso para os primeiros produtos da colheita, especialmente em contexto ritual.
- source_word: קְצִיר חִטִּים
  choice: colheita do trigo
  rationale: Tradução natural da construção hebraica que designa a ceifa ou colheita de trigo.
- source_word: חַג הָאָסִיף
  choice: Festa da Colheita
  rationale: Nome natural em português para a festa associada ao recolhimento dos produtos agrícolas; evita a expressão menos idiomática “Festa do Recolhimento”.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: na virada do ano
  rationale: Reflete a ideia hebraica do giro ou ciclo do ano sem restringir a expressão ao último dia do calendário.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário reconhecível em âmbito lusófono. “Celebre” evita uma reprodução mecânica de “faça”, enquanto “primícias” mantém a precisão ritual. O marcador foi colocado junto à expressão temporal que a nota explica.
