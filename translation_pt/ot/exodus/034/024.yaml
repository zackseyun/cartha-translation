base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: pt
  text: Pois expulsarei nações de diante de você e ampliarei as suas fronteiras. Ninguém[c] cobiçará a sua terra quando você subir para comparecer diante de Yahweh, seu Deus,[a] três vezes por ano.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “para ver a face de Yahweh, seu Deus”; neste contexto de culto, a expressão significa comparecer diante dele.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “três vezes no ano”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega um substantivo masculino singular, literalmente “homem algum”, com sentido representativo: ninguém cobiçaria a terra enquanto os homens israelitas subissem para as festas de peregrinação.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a ordem anterior sobre as peregrinações, preservando a função explicativa da conjunção.
- source_word: אוֹרִישׁ
  choice: expulsarei
  rationale: O hifil de ירשׁ, neste contexto, indica retirar ou desalojar as nações da terra; “expulsarei” é claro e mantém a força da ação.
- source_word: גּוֹיִם
  choice: nações
  rationale: Designa os povos estabelecidos na terra, considerados também como grupos coletivos; “nações” é natural neste contexto territorial.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Preserva de modo inteligível a expressão hebraica que indica remoção da presença ou do caminho de Israel.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: e ampliarei as suas fronteiras
  rationale: O verbo significa alargar, e גְּבוּל pode designar limite ou território. O plural “fronteiras” expressa naturalmente em português a expansão territorial sem alterar o sentido.
- source_word: לֹא יַחְמֹד
  choice: ninguém cobiçará
  rationale: חמד indica desejo indevido e corresponde ao verbo usado na proibição de cobiçar; “cobiçará” preserva essa ligação lexical e moral.
- source_word: אִישׁ
  choice: ninguém
  rationale: Embora o substantivo seja masculino singular, aqui tem força representativa. “Ninguém” transmite com naturalidade a negação universal em português; a forma hebraica é indicada em nota.
- source_word: אַרְצְךָ
  choice: a sua terra
  rationale: “Terra” conserva o sentido territorial e pactual do termo neste contexto.
- source_word: בַּעֲלֹתְךָ
  choice: quando você subir
  rationale: עלה é o verbo convencional da peregrinação ao santuário e pode ser traduzido literalmente e com naturalidade por “subir”.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: para comparecer diante de
  rationale: A expressão é literalmente “para ver a face de”, mas funciona como linguagem de audiência e culto. “Comparecer diante de” comunica o valor idiomático sem apagar a formulação literal, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: três vezes por ano
  rationale: Expressa de maneira corrente em português a frequência anual indicada pelo hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Expressão cultual לֵרָאוֹת אֶת־פְּנֵי
  choice: comparecer diante de Yahweh
  alternative: ver a face de Yahweh
  rationale: A construção pode ser formalmente entendida como “ver a face de”, mas neste contexto descreve a apresentação do adorador perante Deus nas festas de peregrinação. A tradução principal comunica a função idiomática, e a nota conserva a imagem hebraica.
- issue: Masculino singular representativo אִישׁ
  choice: ninguém
  alternative: homem algum
  rationale: 'A referência é universal: nenhuma pessoa cobiçará a terra durante a peregrinação. “Ninguém” é a forma portuguesa natural, enquanto a nota registra que o hebraico emprega um substantivo masculino singular representativo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se “subir” como linguagem de peregrinação, “cobiçar” por sua relevância lexical no contexto da aliança e “Yahweh” como nome próprio. A pontuação em duas frases evita uma coordenação excessivamente longa sem romper a relação lógica introduzida por “Pois”.
