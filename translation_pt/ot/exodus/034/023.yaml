  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: pt
  text: Três vezes por ano, todos os homens do seu povo comparecerão diante do Senhor Yahweh[a], o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz um título e o nome divino: “o Senhor Yahweh”. Traduções tradicionais muitas vezes vertem a expressão como “o Senhor DEUS” ou “o Soberano SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Três vezes por ano
  rationale: Expressa com naturalidade em português a frequência dentro do ciclo anual, sem alterar o sentido do hebraico.
- source_word: יֵרָאֶה
  choice: comparecerão
  rationale: Neste contexto cultual, o nifal de ראה indica apresentar-se ou comparecer diante de Deus; “comparecerão” comunica bem a obrigação de peregrinação.
- source_word: כָּל זְכוּרְךָ
  choice: todos os homens do seu povo
  rationale: זָכוּר designa especificamente os indivíduos do sexo masculino. A expansão “do seu povo” torna natural o sufixo singular coletivo sem neutralizar a referência masculina.
- source_word: אֶת פְּנֵי
  choice: diante de
  rationale: Equivalente português natural do idiomatismo hebraico literalmente relacionado à face/presença de alguém.
- source_word: הָאָדֹן
  choice: o Senhor
  rationale: Preserva o título divino definido e o distingue do nome próprio que vem em seguida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por outro título, preservando a distinção lexical presente no hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução transparente e consagrada da cadeia construta que identifica Yahweh como o Deus de Israel.
theological_decisions:
- issue: Tradução de יְהוָה após o título הָאָדֹן
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS; o Soberano SENHOR
  rationale: O hebraico apresenta um título seguido do nome divino. “O Senhor Yahweh” mantém ambos distintos, sem transformar o nome próprio em um segundo título.
- issue: Referência masculina na obrigação festiva
  choice: todos os homens do seu povo
  alternative: todos; todo o povo
  rationale: O substantivo hebraico é explicitamente masculino; a tradução conserva essa delimitação em vez de ampliar a obrigação por meio de linguagem neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comparecerão diante de” preserva o caráter formal e cultual do mandamento sem reproduzir de modo artificial o idiomatismo hebraico “ver a face de”.
