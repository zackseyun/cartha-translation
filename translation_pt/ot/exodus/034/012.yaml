base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: pt
  text: Tenham cuidado[a] para não fazer uma aliança[b] com os habitantes da terra em que vocês estão entrando[c], para que ela não se torne uma armadilha[d] entre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Fiquem atentos” ou “Cuidem-se”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cortar uma aliança”, expressão idiomática que significa “fazer uma aliança”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “para a qual vocês estão indo”.
    reason: lexical_alternative
  - marker: d
    text: Ou “um laço”. A advertência provavelmente indica que a aliança se tornaria fonte de envolvimento e infidelidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: A fórmula de advertência com imperativo nifal e לְךָ tem sentido reflexivo. “Tenha cuidado” é natural em português e preserva a força da exortação sem a estranheza de “cuide de si mesmo” neste contexto.
- source_word: פֶּן
  choice: para não / para que ... não
  rationale: פֶּן introduz uma precaução negativa. A variação exigida pela sintaxe portuguesa expressa naturalmente as duas advertências paralelas do hebraico.
- source_word: תִּכְרֹת בְּרִית
  choice: fazer uma aliança
  rationale: Literalmente, “cortar uma aliança”; trata-se de um idiomatismo hebraico. “Fazer uma aliança” comunica o sentido com clareza em português atual.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: com os habitantes da terra
  rationale: O particípio singular tem valor coletivo; o plural “habitantes” torna esse sentido explícito e idiomático.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: em que você está entrando
  rationale: A expressão descreve a terra que Israel está prestes a adentrar. Esta formulação é natural e conserva a ideia de movimento para dentro dela.
- source_word: יִהְיֶה
  choice: ela se torne
  rationale: O verbo singular remete de modo mais natural à aliança, substantivo feminino em português. “Torne” expressa a passagem a uma condição perigosa implícita na advertência.
- source_word: לְמוֹקֵשׁ
  choice: uma armadilha
  rationale: מוֹקֵשׁ designa laço ou armadilha, também metaforicamente. “Armadilha” é corrente, clara e preserva a imagem de perigo e envolvimento.
- source_word: בְּקִרְבֶּךָ
  choice: no meio de vocês
  rationale: Embora o hebraico se dirija a Israel no singular coletivo, “vocês” deixa claro em português que a advertência concerne à comunidade, sem psicologizar a expressão como “dentro de você”.
theological_decisions:
- issue: Referente do verbo singular final e de “armadilha”
  choice: A aliança com os habitantes da terra é aquilo que se tornaria uma armadilha.
  alternative: Os próprios habitantes, ou a situação em geral, tornar-se-iam uma armadilha.
  rationale: “Aliança” é o antecedente singular mais próximo e coerente. Essa leitura preserva a advertência contextual contra vínculos que levariam Israel à infidelidade, embora o hebraico permita alguma abertura referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular hebraico dirigido coletivamente a Israel foi vertido por “você” na oração principal e por “vocês” em “no meio de vocês” para evitar a leitura individualizante; essa alternância é natural no contexto e explicita a dimensão comunitária. Todos os marcadores aparecem junto aos termos correspondentes.
