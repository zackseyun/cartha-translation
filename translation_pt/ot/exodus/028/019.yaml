lexical_decisions:
- source_word: וְהַטּוּר
  choice: e a ... fileira
  rationale: Neste contexto das pedras do peitoral, טוּר designa uma fileira ou série de pedras; וְ mantém a continuidade da lista iniciada no versículo anterior.
- source_word: הַשְּׁלִישִׁי
  choice: terceira
  rationale: O ordinal identifica diretamente a terceira fileira da sequência.
- source_word: לֶשֶׁם
  choice: jacinto
  rationale: A identificação exata da pedra é incerta. “Jacinto” é uma equivalência tradicional reconhecível em português, mas a incerteza lexical é indicada em nota.
- source_word: שְׁבוֹ
  choice: ágata
  rationale: “Ágata” é a equivalência tradicional e plausível, embora os antigos nomes de gemas não correspondam com precisão segura à mineralogia moderna.
- source_word: וְאַחְלָמָה
  choice: e ametista
  rationale: אַחְלָמָה é comumente identificada como ametista; a tradução é clara, tradicional e provavelmente representa a pedra pretendida.
