base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: pt
  text: Colocarás no peitoral do julgamento[b] o Urim e o Tumim[a], e eles estarão sobre o coração de Arão quando ele entrar perante Yahweh. E Arão levará o julgamento dos filhos de Israel[c] sobre o coração, perante Yahweh, continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urim e Tumim são os nomes hebraicos de objetos sagrados ligados ao julgamento sacerdotal; sua forma e seu modo exato de funcionamento são incertos. Possíveis traduções etimológicas são “luzes” e “perfeições”.
    reason: lexical_alternative
  - marker: b
    text: Ou “peitoral para decisões” ou “peitoral da justiça”. A palavra hebraica מִשְׁפָּט pode indicar julgamento, decisão ou justiça, conforme o contexto.
    reason: alternative_reading
  - marker: c
    text: “Filhos de Israel” é a expressão hebraica e, neste contexto, refere-se coletivamente ao povo da aliança de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: peitoral do julgamento
  rationale: חֹשֶׁן designa a peça sacerdotal usada sobre o peito, provavelmente também com função de receptáculo. “Julgamento” mantém a repetição de מִשְׁפָּט no versículo e não restringe seu sentido a mera decisão nem o amplia para justiça em geral.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: o Urim e o Tumim
  rationale: Os termos técnicos são transliterados porque a forma, a operação e até a etimologia exata desses objetos sagrados permanecem incertas. Traduzi-los como “luzes” e “perfeições” apresentaria hipóteses como certezas.
- source_word: אֶל
  choice: 'no'
  rationale: Com o verbo נתן e o peitoral entendido como peça que continha esses objetos, “no peitoral” expressa em português natural a ideia de colocação dentro ou na parte própria da peça.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: e eles estarão sobre o coração de Arão
  rationale: Mantém tanto a localização física da peça sobre o peito quanto a possível dimensão representativa da imagem, sem explicá-la além do texto.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: quando ele entrar diante de Yahweh
  rationale: A formulação preserva a nuance temporal e o movimento de entrada na presença divina associado ao serviço no santuário.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome pessoal divino em vez de substituí-lo por um título.
- source_word: וְנָשָׂא
  choice: E Arão levará
  rationale: “Levar” conserva o sentido concreto de carregar e permite também a ideia de responsabilidade representativa, sem escolher exclusivamente uma das duas.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: o julgamento dos filhos de Israel
  rationale: “Julgamento” conserva o vínculo lexical com “peitoral do julgamento” e a amplitude de מִשְׁפָּט, que pode envolver julgamento, decisão ou justiça.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica convencional e sua forma masculina, enquanto a nota esclarece seu referente coletivo.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa a regularidade permanente do dever sacerdotal sem exigir a ideia de uma ação física ininterrupta a cada instante.
theological_decisions:
- issue: Se אוּרִים e תֻּמִּים devem ser traduzidos semanticamente ou transliterados
  choice: Transliterar como “Urim” e “Tumim”
  alternative: Traduzir como “luzes” e “perfeições”
  rationale: A natureza dos objetos e as etimologias dos nomes são incertas; a transliteração evita transformar uma interpretação debatida em significado estabelecido.
- issue: Sentido de מִשְׁפָּט nas duas ocorrências
  choice: Usar “julgamento” em ambas
  alternative: Usar “decisão” ou “justiça”
  rationale: “Julgamento” preserva a repetição e a tensão semântica do hebraico, incluindo a possibilidade de decisão autorizada, sem definir indevidamente o mecanismo do Urim e do Tumim.
- issue: Como representar בְּנֵי יִשְׂרָאֵל
  choice: “os filhos de Israel” no texto principal
  alternative: “os israelitas” ou “o povo de Israel”
  rationale: A tradução mantém a forma da designação hebraica, e a nota esclarece que ela se refere coletivamente ao povo da aliança.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva as duas orações coordenadas do hebraico, a repetição de “julgamento” e a imagem concreta de algo levado sobre o coração.
