lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  choice: Faça também
  rationale: O וְ coordena esta instrução com as anteriores; em português, o imperativo expressa com naturalidade a força prescritiva da forma verbal hebraica, e “também” mantém a continuidade sem tornar a frase pesada.
- source_word: מִשְׁבְּצֹת
  choice: engastes
  rationale: O termo designa peças ornamentais de montagem ou encaixe, relacionadas no contexto às pedras e correntes. “Engastes” é claro no contexto da ourivesaria e evita especificar uma técnica não expressa pelo vocábulo isoladamente.
- source_word: זָהָב
  choice: de ouro
  rationale: Reproduz de modo direto e idiomático a indicação hebraica do material de que os engastes devem ser feitos.
