  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: pt
  text: Você a prenderá a um cordão azul[a], e ela ficará sobre o turbante; ficará na parte da frente do turbante.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fio azul” ou “linha azul”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em direção à frente do turbante”, indicando sua posição no lado frontal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: Você a prenderá
  rationale: Embora שׂים signifique normalmente “pôr, colocar”, o contexto do cordão indica a ação concreta de fixar a lâmina ao turbante; “prenderá” comunica essa relação com naturalidade sem acrescentar um mecanismo específico.
- source_word: פְּתִיל
  choice: cordão
  rationale: פְּתִיל pode designar cordão, fio ou linha. “Cordão” é natural em português e condiz com a função de fixação neste contexto.
- source_word: תְּכֵלֶת
  choice: azul
  rationale: תְּכֵלֶת designa a valiosa cor azul usada nos tecidos do santuário. O matiz exato é incerto, e “azul” evita precisão indevida.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: e ela ficará sobre o turbante
  rationale: מִצְנֶפֶת é o adorno de cabeça enrolado do sumo sacerdote; “turbante” é claro e estabelecido. “Ficará” expressa aqui a posição prescrita de modo idiomático.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: na parte da frente do turbante
  rationale: A expressão indica orientação ou posição diante da face frontal do turbante. A formulação portuguesa transmite a localização visível pretendida.
- source_word: יִהְיֶה
  choice: ficará
  rationale: Mantém a repetição hebraica da determinação de posição, embora em português a concordância feminina retome a lâmina mencionada no contexto.
