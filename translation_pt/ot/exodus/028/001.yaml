review_pass:
  verdict: revise
  source_fidelity: 'É necessária uma correção: לְכַהֲנוֹ לִי contém sufixo de terceira pessoa masculina singular e significa, de modo mais direto, “para que ele me sirva como sacerdote”. A versão no plural (“para que sirvam”) harmoniza antecipadamente os filhos com Arão, mas perde a referência singular expressa no hebraico. “Traga para perto de você” também representa com clareza הַקְרֵב אֵלֶיךָ, sem a discordância de pessoa em “mande vir para junto de si”.'
  naturalness: O texto revisto mantém registro digno e moderno. “Traga para perto de você” é natural em português internacional e brasileiro, e “seus filhos com ele” conserva o acompanhamento indicado por אִתּוֹ.
  terminology: Arão, Nadabe, Abiú, Eleazar e Itamar são formas portuguesas estabelecidas. “Filhos de Israel” preserva a designação hebraica; a nota oferece corretamente a alternativa coletiva “israelitas”. “Servir como sacerdote” comunica adequadamente o sentido cultual de כהן sem introduzir linguagem denominacional.
  issues:
  - severity: medium
    issue: O serviço sacerdotal foi vertido no plural.
    rationale: O hebraico לְכַהֲנוֹ inclui sufixo masculino singular (“para que ele exerça o sacerdócio/ sirva como sacerdote para mim”). Embora os filhos acompanhem Arão e venham a exercer o sacerdócio no contexto mais amplo, este versículo formula a finalidade no singular.
  - severity: low
    issue: “Mande vir para junto de si” não acompanha de modo consistente a interlocução “você”.
    rationale: “Si” normalmente retoma um referente de terceira pessoa e pode enfraquecer ou confundir a direção explícita a Moisés em אֵלֶיךָ. “Para perto de você” a preserva diretamente.
