  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: pt
  text: 'E você, traga para perto de você Arão, seu irmão, e seus filhos com ele, dentre os filhos de Israel[a], para que ele me sirva como sacerdote: Arão, Nadabe e Abiú, Eleazar e Itamar, filhos de Arão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre os israelitas”. O hebraico diz literalmente “dentre os filhos de Israel”, uma designação habitual do povo da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: E você
  rationale: O pronome explícito é enfático e marca uma mudança no discurso; “E você” conserva tanto a ligação com o contexto quanto a ênfase dirigida a Moisés.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: mande vir para junto de si
  rationale: O hifil de קרב expressa fazer alguém se aproximar. A formulação preserva o sentido causativo e a direção pessoal a Moisés, sem antecipar toda a ideia de ordenação sacerdotal.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém explicitamente a relação familiar destacada no hebraico.
- source_word: בָּנָיו אִתּוֹ
  choice: com ele seus filhos
  rationale: Conserva o marcador de acompanhamento אִתּוֹ, indicando que os filhos são chamados juntamente com Arão.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dentre os filhos de Israel
  rationale: Preserva a forma da designação coletiva e pactual hebraica, ao mesmo tempo que “dentre” comunica claramente a escolha feita no interior do povo.
- source_word: לְכַהֲנוֹ לִי
  choice: para que sirvam como sacerdotes para mim
  rationale: O verbo כהן denota o exercício do sacerdócio. A tradução comunica a função e o serviço sacerdotal, preservando também o complemento לִי, “para mim”.
- source_word: בְּנֵי אַהֲרֹן
  choice: filhos de Arão
  rationale: A construção identifica os homens nomeados como filhos de Arão; a expressão é clara e idiomática em português.
theological_decisions:
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: dentre os filhos de Israel
  alternative: dentre os israelitas
  rationale: O hebraico usa literalmente “filhos de Israel” como designação do povo da aliança. O texto principal conserva essa forma tradicional e semanticamente transparente, enquanto a nota oferece a equivalência coletiva mais corrente em português.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Mande vir para junto de si” evita a ambiguidade de uma ordem para que o próprio Moisés se aproxime e mantém o valor causativo do hebraico. Os nomes seguem as formas portuguesas consagradas: Arão, Nadabe, Abiú, Eleazar e Itamar.'
