  language: pt
  text: Faça a veste do éfode inteiramente de azul.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda de azul”, isto é, feita inteiramente de material azul.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “azul” pode indicar um material valioso tingido numa tonalidade entre o azul e o azul-arroxeado.
