lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O qatal de עשה com וְ na sequência de instruções tem força prescritiva. O imperativo português é natural, direto e preserva o tom de ordem.
- source_word: מְעִיל
  choice: manto
  rationale: Designa uma veste sacerdotal ampla associada ao éfode. “Manto” é claro, corrente e digno em português.
- source_word: הָאֵפוֹד
  choice: o éfode
  rationale: É termo técnico para a veste sacerdotal; a transliteração tradicional evita uma paráfrase descritiva incerta. A construção indica o manto associado ao éfode.
- source_word: כְּלִיל
  choice: inteiramente
  rationale: Expressa totalidade ou integralidade e modifica de modo natural, em português, a composição do manto.
- source_word: תְּכֵלֶת
  choice: tecido azul
  rationale: No contexto de vestes e do santuário, o termo pode designar não só a cor, mas material tingido de alto valor. “Tecido azul” torna explícita a referência material sugerida pela construção, sem fixar além do necessário o matiz exato.
