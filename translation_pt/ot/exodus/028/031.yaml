translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Usa-se o imperativo “Faça” para a instrução e conserva-se “éfode” como termo técnico tradicional. A formulação mantém a possível nuance material e registra em nota a incerteza quanto ao matiz.
