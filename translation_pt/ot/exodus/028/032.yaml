  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: pt
  text: A abertura para a cabeça ficará no meio dela; ao redor da abertura haverá uma borda tecida[a], como a abertura de uma cota de malha, para que não se rasgue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como a abertura de uma armadura”. O termo hebraico תַּחְרָא é raro; a comparação parece ser com a abertura reforçada de uma peça de proteção, resistente a rasgos.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: a abertura para a cabeça
  rationale: פֶּה significa literalmente “boca”, mas, no contexto de uma peça de roupa, designa sua abertura; רֹאשׁוֹ especifica que ela serve para a cabeça.
- source_word: בְּתוֹכוֹ
  choice: no meio dela
  rationale: Indica que a abertura deve ficar na parte central da peça; a formulação é clara e natural em português.
- source_word: שָׂפָה
  choice: borda
  rationale: Embora o sentido básico seja “lábio” ou “beirada”, aqui o termo designa o acabamento reforçado que circunda a abertura.
- source_word: לְפִיו סָבִיב
  choice: ao redor da abertura
  rationale: A repetição de פֶּה refere-se novamente à abertura da peça, e סָבִיב indica que a borda a circunda.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: borda tecida
  rationale: A expressão descreve trabalho de tecelão; ligada a שָׂפָה, indica uma borda confeccionada por tecelagem.
- source_word: כְּפִי תַחְרָא
  choice: como a abertura de uma couraça
  rationale: תַּחְרָא é um termo raro, tradicionalmente entendido como uma peça de proteção corporal. “Couraça” mantém a imagem de uma abertura reforçada, sem afirmar precisão lexical inexistente.
- source_word: לֹא יִקָּרֵעַ
  choice: para que não se rasgue
  rationale: O nifal apresenta sentido passivo; no contexto, a oração exprime o resultado ou propósito do reforço da abertura.
