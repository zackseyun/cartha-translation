base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: pt
  text: Para os filhos de Arão, faça túnicas, faixas e coberturas para a cabeça[a], para honra e esplendor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gorros”, “turbantes” ou “toucas”; o formato exato dessa cobertura sacerdotal é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: para os filhos de Arão
  rationale: Preserva a referência filial direta e corresponde naturalmente à expressão hebraica, sem ampliá-la para “descendentes”.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: faça
  rationale: O contexto instrutivo dá às formas verbais força de ordem; o imperativo é claro, natural e digno em português.
- source_word: כֻתֳּנֹת
  choice: túnicas
  rationale: Designa vestes básicas usadas sobre o corpo; “túnicas” é preciso e corrente no contexto antigo.
- source_word: אַבְנֵטִים
  choice: faixas
  rationale: Refere-se a faixas de tecido enroladas à cintura, e não necessariamente a cintos rígidos.
- source_word: מִגְבָּעוֹת
  choice: coberturas para a cabeça
  rationale: Tradução cautelosa que comunica a função da peça sacerdotal sem definir de modo incerto sua forma exata.
- source_word: לְכָבוֹד
  choice: para honra
  rationale: כָּבוֹד pode indicar glória, honra ou dignidade; aqui “honra” expressa naturalmente a dignidade conferida pelas vestes.
- source_word: וּלְתִפְאָרֶת
  choice: e esplendor
  rationale: תִּפְאֶרֶת denota beleza, magnificência ou esplendor; “esplendor” conserva o registro elevado e forma um par natural com “honra”.
theological_decisions:
- issue: Finalidade das vestes sacerdotais
  choice: para honra e esplendor
  alternative: para glória e beleza
  rationale: A formulação preserva as dimensões de dignidade e beleza estética expressas pelo hebraico, sem acrescentar simbolismo teológico posterior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição verbal hebraica foi condensada numa enumeração natural, sem perda do conteúdo ou da força imperativa.
