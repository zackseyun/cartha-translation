  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: pt
  text: seis dos seus nomes numa pedra, e os nomes dos seis restantes na segunda pedra, segundo a ordem em que nasceram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «segundo as suas gerações». A expressão hebraica pode referir-se à descendência genealógica ou à ordem de nascimento decorrente dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: seis dos seus nomes
  rationale: O מִן partitivo indica seis nomes dentre o conjunto total; a formulação é direta e natural em português.
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: numa pedra
  rationale: עַל indica a posição da inscrição sobre a pedra, enquanto הָאֶחָת contrapõe uma pedra à segunda. Em português corrente, «numa pedra» expressa essa distribuição sem impor desnecessariamente o ordinal «primeira».
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: os seis restantes
  rationale: נוֹתָרִים designa os que ficaram ou restaram; «os seis restantes» preserva o sentido com concisão.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: na segunda pedra
  rationale: הַשֵּׁנִית é o ordinal feminino «segunda», e «na» é idiomático para indicar onde os nomes seriam gravados.
- source_word: כְּתוֹלְדֹתָם
  choice: segundo a ordem em que nasceram
  rationale: Neste contexto, תּוֹלְדוֹת provavelmente indica a ordem derivada dos nascimentos dos filhos de Israel. A nota preserva o sentido genealógico mais amplo do termo.
