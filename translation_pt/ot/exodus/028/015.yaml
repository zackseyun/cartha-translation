source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: pt
  text: 'Faça o peitoral do julgamento[a], trabalho de artesão habilidoso; faça-o como a obra do éfode: de ouro, fios azuis, púrpura e escarlate, e linho fino retorcido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peitoral para decisões” ou “peitoral da decisão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: peitoral
  rationale: Designa a peça ornamental e sacerdotal usada sobre o peito do sumo sacerdote. “Peitoral” é o termo técnico corrente em português e evita a ideia de armadura sugerida por alternativas como “couraça”.
- source_word: מִשְׁפָּט
  choice: do julgamento
  rationale: Mantém a relação construta e a ressonância judicial ou decisória do hebraico, sem definir neste versículo o mecanismo ou a finalidade exata.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: trabalho de artesão habilidoso
  rationale: Expressa uma obra artesanal concebida e executada com perícia, sem restringir indevidamente a técnica a bordado ou tecelagem.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: como o éfode
  rationale: Em português natural, comunica que o peitoral deve ser feito com o mesmo tipo de trabalho empregado no éfode; o verbo “faça” fornece o sentido artesanal no contexto imediato.
- source_word: אֵפֹד
  choice: éfode
  rationale: Preserva o termo técnico referente a uma peça específica da vestimenta sacerdotal, para a qual não há equivalente português breve e exato.
- source_word: זָהָב
  choice: ouro
  rationale: Correspondência direta ao material mencionado.
- source_word: תְּכֵלֶת
  choice: fios azuis
  rationale: Representa o material têxtil tingido de azul no contexto da lista; “fios” é explicitado para clareza em português.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Termo tradicional e preciso para a valiosa cor ou matéria tingida; depende de “fios” no conjunto coordenado.
- source_word: תוֹלַעַת שָׁנִי
  choice: escarlate
  rationale: Expressa a cor ou matéria têxtil escarlate; depende de “fios” no conjunto coordenado.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto a qualidade do linho quanto o modo de preparação dos fios.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: Faça-o ...
  rationale: A instrução de fazer é expressa diretamente; a segunda ocorrência hebraica é acomodada à sintaxe portuguesa na enumeração dos materiais para evitar uma repetição final pesada.
theological_decisions:
- issue: Função de חֹשֶׁן מִשְׁפָּט
  choice: peitoral do julgamento
  alternative: peitoral para decisões; peitoral da justiça
  rationale: A formulação conserva a associação cultual e judicial sem especificar além do que o versículo declara. A nota registra alternativas legítimas e preserva a ambiguidade funcional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “Faça” é natural para a instrução divina dirigida a Moisés. Mantêm-se os termos técnicos “peitoral” e “éfode”; a enumeração usa “fios” uma única vez com alcance sobre as três cores.
