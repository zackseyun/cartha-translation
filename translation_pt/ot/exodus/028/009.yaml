lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pegue
  rationale: O perfeito qal com waw, nesta sequência de instruções, tem força diretiva. O imperativo é natural e claro em português; a sequência não exige que o waw seja representado por uma conjunção.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: duas pedras de ônix
  rationale: שֹׁהַם designa uma pedra preciosa cuja identificação exata é incerta. “Ônix” é a tradução tradicional e mais reconhecível neste contexto, com a incerteza preservada em nota.
- source_word: וּפִתַּחְתָּ
  choice: e grave
  rationale: No contexto de nomes incisos em pedras preciosas, “gravar” expressa com precisão o ato de talhar uma inscrição.
- source_word: עֲלֵיהֶם
  choice: nelas
  rationale: Retoma naturalmente, em português, as duas pedras e preserva o sentido espacial de inscrição sobre elas.
- source_word: שְׁמוֹת
  choice: os nomes
  rationale: O artigo definido é natural em português, pois se trata dos nomes específicos pertencentes aos filhos de Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Neste contexto, a expressão se refere especificamente aos filhos de Jacó/Israel, antepassados das tribos, e não genericamente ao povo israelita.
