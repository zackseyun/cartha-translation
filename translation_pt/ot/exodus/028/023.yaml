translation:
  language: pt
  text: Faça duas argolas de ouro no peitoral e coloque as duas argolas nas duas extremidades do peitoral.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força diretiva; o imperativo em português é natural e claro.
- source_word: עַל הַחֹשֶׁן
  choice: no peitoral
  rationale: A preposição עַל tem sentido espacial neste contexto de fixação; “no peitoral” expressa de modo idiomático que as argolas devem ser presas à peça.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: Em Êxodo 28, o termo designa a peça sacerdotal usada sobre o peito. “Peitoral” é a forma tradicional, clara e concisa em português.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: duas argolas de ouro
  rationale: A expressão especifica tanto o objeto como seu material; “argolas de ouro” é natural em português e adequado a peças usadas para ligação.
- source_word: וְנָתַתָּ
  choice: e coloque
  rationale: Neste contexto, o verbo significa pôr ou fixar fisicamente; “coloque” mantém a força instrutiva e soa natural.
- source_word: אֶת שְׁתֵּי הַטַּבָּעוֹת
  choice: as duas argolas
  rationale: Tradução direta do sintagma nominal definido marcado como objeto.
- source_word: עַל שְׁנֵי קְצ֥וֹת הַחֹשֶׁן
  choice: nas duas extremidades do peitoral
  rationale: קָצֶה indica extremidade ou ponta. “Nas duas extremidades” preserva a referência espacial e a repetição numérica do hebraico.
