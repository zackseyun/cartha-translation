  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: pt
  text: Faça sobre o peitoral correntes[a] de ouro puro, trançadas como cordões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correntes torcidas” ou “correntes em forma de cordão”; o hebraico descreve correntes feitas num padrão trançado ou semelhante a corda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força prescritiva. O imperativo em português moderno expressa a ordem com clareza e naturalidade.
- source_word: עַל הַחֹשֶׁן
  choice: sobre o peitoral
  rationale: עַל indica aqui posição ou fixação sobre o objeto. “Sobre o peitoral” preserva esse sentido espacial sem excluir a ideia de que as correntes seriam presas a ele.
- source_word: שַׁרְשֹׁת
  choice: correntes
  rationale: O substantivo plural designa correntes, termo claro e convencional neste contexto de ourivesaria.
- source_word: גַּבְלֻת
  choice: trançadas
  rationale: O termo raro descreve provavelmente uma forma entrelaçada, torcida ou semelhante a cordão. “Trançadas” comunica de modo natural a técnica ou aparência, enquanto a nota preserva as alternativas.
- source_word: מַעֲשֵׂה עֲבֹת
  choice: como cordões
  rationale: A expressão caracteriza o trabalho como semelhante a cordas ou cordões. “Como cordões” conserva a imagem concreta e evita um tecnicismo pouco transparente.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: É a tradução direta e corrente da descrição do material nas instruções do santuário.
