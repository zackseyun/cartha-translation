  text: 'e a segunda fileira: turquesa[a], safira e diamante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de várias pedras preciosas da Antiguidade é incerta. נֹפֶךְ pode ser “esmeralda” ou “carbúnculo”; סַפִּיר pode se referir a “lápis-lazúli”; e יָהֲלֹם pode ser “jacinto” ou “jaspe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: e a fileira
  rationale: Neste contexto das pedras do peitoral, טוּר designa uma fileira ou série; a conjunção וְ foi preservada como “e”.
- source_word: הַ/שֵּׁנִי
  choice: a segunda
  rationale: O ordinal modifica “fileira” e concorda naturalmente com o substantivo feminino em português.
- source_word: נֹפֶךְ
  choice: turquesa
  rationale: A identificação exata é incerta. “Turquesa” é um equivalente moderno plausível, enquanto outras possibilidades relevantes são registradas em nota.
- source_word: סַפִּיר
  choice: safira
  rationale: A tradução tradicional e facilmente reconhecível é “safira”, embora o termo antigo possa indicar lápis-lazúli; a alternativa é preservada em nota.
- source_word: וְ/יָהֲלֹם
  choice: e diamante
  rationale: “Diamante” é uma tradução tradicional comum, mas a identificação mineralógica permanece incerta; outras possibilidades são indicadas em nota.
