base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: pt
  text: Fixe as duas pontas dos dois cordões[a] nos dois engastes e coloque-os sobre as peças dos ombros do éfode, na parte frontal do éfode.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correntes”. O termo hebraico pode indicar cordões entrelaçados ou correntes; o contexto do trabalho em ouro favorece uma construção semelhante a correntes.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: pontas
  rationale: Designa as extremidades dos cordões; “pontas” é natural e preciso neste contexto de confecção.
- source_word: הָעֲבֹתֹת
  choice: cordões
  rationale: O termo pode indicar cordões entrelaçados ou correntes. “Cordões” preserva a imagem básica, enquanto a nota registra a alternativa favorecida pelo contexto de trabalho em ouro.
- source_word: הַמִּשְׁבְּצֹת
  choice: engastes
  rationale: Refere-se às peças de ouro nas quais os elementos são fixados. “Engastes” comunica a função sem definir excessivamente a forma ornamental.
- source_word: כִתְפֹת
  choice: peças dos ombros
  rationale: No contexto de vestuário, refere-se às partes do éfode situadas sobre os ombros, não diretamente aos ombros anatômicos.
- source_word: אֵפֹד
  choice: éfode
  rationale: Transliteração portuguesa tradicional e inteligível para esta veste sacerdotal especializada, sem equivalente exato.
- source_word: אֶל מוּל פָּנָיו
  choice: na parte da frente
  rationale: Expressa de modo natural que a colocação deve ocorrer no lado frontal do éfode.
- source_word: וְנָתַתָּה
  choice: coloque-os
  rationale: Mantém o sentido de נתן e toma o pronome como referência aos elementos já fixados, conforme o contexto imediato.
