source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: pt
  text: 'Estas são as vestes que farão: um peitoral[a], um éfode[b], um manto, uma túnica de tecido trabalhado[c], um turbante e uma faixa. Farão vestes santas[d] para Arão, seu irmão, e para os filhos dele, a fim de que ele me sirva como sacerdote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a peça sacerdotal usada sobre o peito; não se trata necessariamente de uma peça de armadura.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “éfode”, uma veste sacerdotal específica, sem equivalente exato em português.
    reason: cultural_note
  - marker: c
    text: Também pode ser traduzido como “túnica quadriculada” ou “túnica de padrão quadriculado”; o hebraico provavelmente indica algum tipo de tecido trabalhado ou padronizado.
    reason: lexical_alternative
  - marker: d
    text: Ou “vestes sagradas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: vestes
  rationale: “Vestes” é natural em português para roupas cerimoniais e mantém a dignidade do contexto sem recorrer ao termo mais eclesiástico “paramentos”.
- source_word: יַעֲשׂוּ
  choice: farão
  rationale: O imperfeito tem força instrutiva no contexto. O futuro simples preserva a formulação diretiva e soa natural em português.
- source_word: חֹשֶׁן
  choice: peitoral
  rationale: É o termo português corrente para a peça sacerdotal usada sobre o peito. A nota evita que seja entendida necessariamente como parte de uma armadura.
- source_word: אֵפוֹד
  choice: éfode
  rationale: Trata-se de uma veste sacerdotal específica, sem equivalente português exato; por isso, preserva-se o termo técnico por transliteração adaptada.
- source_word: מְעִיל
  choice: manto
  rationale: Expressa com clareza a veste exterior longa do traje sacerdotal.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: túnica de tecido trabalhado
  rationale: כְתֹנֶת designa uma túnica, enquanto תַּשְׁבֵּץ indica um trabalho ou padrão têxtil cuja forma precisa é discutida. A formulação comunica a confecção elaborada sem impor o sentido específico de “quadriculada”.
- source_word: מִצְנֶפֶת
  choice: turbante
  rationale: É o equivalente claro e convencional para a cobertura sacerdotal enrolada na cabeça.
- source_word: אַבְנֵט
  choice: faixa
  rationale: Designa adequadamente uma faixa de tecido usada ao redor do corpo e convém melhor ao traje cerimonial do que o termo genérico “cinto”.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: vestes santas
  rationale: Mantém de modo direto a linguagem de santidade central ao contexto sacerdotal.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: para Arão, seu irmão
  rationale: Reproduz a identificação familiar dirigida a Moisés, com pontuação natural em português.
- source_word: וּלְבָנָיו
  choice: e para os filhos dele
  rationale: O hebraico especifica os filhos homens de Arão. “Dele” evita uma possível leitura momentânea de que sejam filhos de Moisés.
- source_word: לְכַהֲנוֹ לִי
  choice: a fim de que ele me sirva como sacerdote
  rationale: A construção expressa finalidade e atividade sacerdotal. A formulação preserva o pronome singular do hebraico e a ideia verbal de exercer o sacerdócio.
theological_decisions:
- issue: Terminologia das vestes sacerdotais sem importar tradições eclesiásticas posteriores
  choice: Empregar termos portugueses claros — “peitoral”, “manto”, “túnica”, “turbante” e “faixa” — e transliterar “éfode”.
  alternative: Usar “paramentos”, “couraça”, “gibão” ou traduzir o éfode de forma descritiva.
  rationale: A combinação mantém a especificidade cultual do texto do Êxodo e a compreensão moderna, sem associar as peças a armadura ou a vestes de tradições religiosas posteriores.
- issue: Possível forma do trabalho indicado por תַּשְׁבֵּץ
  choice: “túnica de tecido trabalhado”, com nota sobre a alternativa “túnica quadriculada”.
  alternative: “túnica quadriculada” ou “túnica de trabalho em quadrícula”.
  rationale: O termo aponta para trabalho têxtil elaborado ou padronizado, mas o padrão exato não é seguro. A tradução preserva essa incerteza em vez de defini-la silenciosamente.
- issue: Referência singular em לְכַהֲנוֹ após a menção de Arão e seus filhos
  choice: 'Conservar o singular: “a fim de que ele me sirva como sacerdote”.'
  alternative: Pluralizar para “a fim de que me sirvam como sacerdotes”.
  rationale: Embora as vestes também sejam feitas para os filhos de Arão, o texto massorético traz um sufixo singular, cujo referente imediato e principal é Arão. A tradução não elimina essa tensão gramatical.
- issue: Identificação dos descendentes sacerdotais
  choice: Traduzir בָנָיו por “os filhos dele”.
  alternative: “seus filhos”, “seus descendentes” ou “seus filhos e filhas”.
  rationale: O substantivo hebraico é masculino e, neste contexto, refere-se especificamente aos filhos de Arão que exerceriam o sacerdócio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura enumerativa e o tom instrutivo do hebraico foram preservados. Evitaram-se tanto arcaísmos quanto terminologia eclesiástica posterior; as notas registram alternativas lexicais reais e a incerteza do padrão têxtil.
