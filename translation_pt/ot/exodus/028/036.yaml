  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: pt
  text: 'Faça também uma lâmina de ouro puro e grave nela, à maneira da gravação de um selo: “Santo para Yahweh”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Santidade para Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O qatal com waw, nesta sequência de instruções, tem força diretiva. “Faça” é natural em português, e “também” conecta a ordem às peças anteriores sem impor uma sequência temporal rígida.
- source_word: צִּיץ
  choice: lâmina
  rationale: Neste contexto, designa o ornamento de ouro usado na parte frontal do turbante sacerdotal. “Lâmina” comunica uma peça fina de metal com mais precisão e naturalidade do que o sentido comum de “flor” ou “roseta”.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: Expressa de modo idiomático tanto o material quanto sua qualidade.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: e grave nela
  rationale: O verbo, neste contexto de trabalho em metal, indica entalhar ou gravar uma inscrição; o pronome feminino concorda naturalmente com “lâmina”.
- source_word: פִּתּוּחֵי חֹתָם
  choice: como se grava um selo
  rationale: 'Reproduz de modo claro o sentido modal da expressão: a inscrição deve ser feita segundo o tipo de gravação usado em selos, sem forçar o plural formal do hebraico em português pouco natural.'
- source_word: קֹדֶשׁ לַיהוָה
  choice: Santo para Yahweh
  rationale: Mantém a concisão solene da inscrição e sua força dedicatória. O substantivo hebraico também permite “Santidade para Yahweh”, preservado em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido da inscrição קֹדֶשׁ לַיהוָה
  choice: Santo para Yahweh
  alternative: Santidade para Yahweh
  rationale: A fórmula hebraica é compacta e admite leitura adjetiva ou substantiva. A tradução principal conserva o caráter de inscrição dedicatória, enquanto a nota registra a alternativa lexical genuína.
translation_notes:
  register: Português moderno, claro e solene, com imperativo natural para a instrução divina. “Lâmina” é acessível no Brasil e amplamente compreensível em outras variedades do português; a formulação da inscrição permanece deliberadamente breve.
