translation:
  language: pt
  text: Faça duas correntes de ouro puro, trançadas como cordões, em trabalho de cordoaria[a]; e coloque as correntes trançadas sobre os engastes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega duas expressões relacionadas a trabalho torcido, entrançado ou semelhante a cordões. Outra tradução possível é: “faça-as retorcidas, como obra de cordoaria”.'
    reason: lexical_alternative
  - marker: b
    text: “Engastes” também pode ser traduzido por “armações” ou “molduras de filigrana”; trata-se das peças de ouro presas à veste sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת זָהָב טָהוֹר
  choice: duas correntes de ouro puro
  rationale: Mantém o número, o objeto e o material de maneira direta e natural; “correntes” é adequado ao trabalho de ourivesaria descrito no contexto.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: em forma de cordões, como obra trançada
  rationale: Preserva as duas expressões hebraicas relacionadas à aparência torcida ou entrançada, sem ocultar a dificuldade lexical nem tornar a frase excessivamente técnica.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Faça
  rationale: Expressa com clareza a instrução dirigida a Moisés; o pronome objeto é dispensável em português porque o referente já está explícito.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: as correntes trançadas
  rationale: Reproduz a retomada das correntes e sua característica de trabalho torcido ou entrançado.
- source_word: וְנָתַתָּ ... עַל הַמִּשְׁבְּצֹת
  choice: e prenda ... aos engastes
  rationale: No contexto de peças de ourivesaria fixadas à veste sacerdotal, “prenda aos” comunica melhor a relação funcional do que o literal “coloque sobre”; “engastes” designa de modo conciso as armações de ouro.
