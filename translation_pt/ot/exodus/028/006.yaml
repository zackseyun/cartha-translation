  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: pt
  text: Farão o éfode de ouro[a], azul, púrpura, fio escarlate e linho fino retorcido, obra de artista habilidoso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fio de ouro”. O texto hebraico diz apenas “ouro”, embora, neste contexto de confecção têxtil, possa se referir a ouro trabalhado e incorporado ao tecido.
    reason: lexical_alternative
  - marker: b
    text: Ou “obra de desenhista” ou “obra de artífice habilidoso”. A expressão hebraica se refere a uma obra especializada, artisticamente planejada e com padrões.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Farão
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força diretiva. O futuro em português expressa de modo natural e digno o que os artesãos deverão fazer.
- source_word: הָאֵפֹד
  choice: o éfode
  rationale: É um termo técnico para uma veste cultual sem equivalente português exato; a transliteração consagrada evita definir indevidamente sua forma.
- source_word: זָהָב
  choice: ouro
  rationale: O hebraico diz simplesmente “ouro”. Embora o contexto indique ouro incorporado ao tecido, “fio” não está explícito neste versículo.
- source_word: תְּכֵלֶת
  choice: tecido azul
  rationale: O termo designa a matéria tingida de azul. “Tecido azul” torna explícito o sentido material exigido pela lista, sem tentar precisar uma tonalidade incerta.
- source_word: וְאַרְגָּמָן
  choice: púrpura
  rationale: Tradução tradicional e adequada do material ou cor púrpura usado nos tecidos do santuário; o substantivo material fica subentendido na enumeração.
- source_word: תּוֹלַעַת שָׁנִי
  choice: fio escarlate
  rationale: A expressão designa material tingido de escarlate; “fio” comunica claramente o contexto têxtil sem reproduzir literalmente a referência à fonte do corante.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: שֵׁשׁ indica linho fino, e מָשְׁזָר, sua condição torcida ou retorcida.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: trabalho de artesão habilidoso
  rationale: A expressão indica trabalho artístico planejado e especializado. Esta formulação preserva a habilidade envolvida sem restringir a técnica a bordado.
