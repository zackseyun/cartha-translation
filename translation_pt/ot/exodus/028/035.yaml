  text: וְ/הָיָ֥ה עַֽל אַהֲרֹ֖ן לְ/שָׁרֵ֑ת וְ/נִשְׁמַ֣ע ק֠וֹל/וֹ בְּ/בֹא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ לִ/פְנֵ֧י יְהוָ֛ה וּ/בְ/צֵאת֖/וֹ וְ/לֹ֥א יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: pt
  text: Estará sobre Arão quando ele ministrar, e o som do manto será ouvido quando ele entrar no Lugar Santo[a], diante de Yahweh, e quando sair, para que não morra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no santuário”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “e não morrerá”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Estará sobre Arão
  rationale: A construção tem força prescritiva no contexto das instruções e se refere ao manto anteriormente descrito. A omissão do pronome evita uma repetição artificial em português.
- source_word: לְשָׁרֵת
  choice: quando ele ministrar
  rationale: O infinitivo com לְ pode indicar propósito ou circunstância. Aqui, a formulação temporal é natural e preserva o contexto do serviço sacerdotal.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: e o som dela será ouvido
  rationale: O sufixo masculino hebraico retoma naturalmente o manto, substantivo masculino em hebraico, e, pelo contexto dos versículos 33–34, designa o som dos sinos presos a ele. Em português, “dela” concorda com a peça de roupa subentendida e evita atribuir o som à voz de Arão.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: quando ele entrar no Lugar Santo
  rationale: O infinitivo com בְּ tem valor temporal. “Entrar” exprime naturalmente o movimento indicado por בוא seguido de אֶל, e “Lugar Santo” conserva o caráter cultual de הַקֹּדֶשׁ.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão indica presença diante de Deus; o nome divino é transliterado como “Yahweh”, conforme a política do projeto.
- source_word: וּבְצֵאתוֹ
  choice: e quando sair
  rationale: Mantém o paralelismo temporal com a entrada, em português natural.
- source_word: וְלֹא יָמוּת
  choice: para que não morra
  rationale: No contexto ritual, a coordenação expressa resultado ou prevenção. Esta formulação comunica essa relação sem recorrer ao arcaísmo “para que não venha a morrer”.
theological_decisions:
- issue: Referente do som ouvido
  choice: O som é o do manto, especificamente o de seus sinos.
  alternative: O som poderia ser entendido de modo geral como o ruído produzido pela presença ou pelo movimento de Arão.
  rationale: Os versículos imediatamente anteriores descrevem sinos presos à borda do manto, tornando esse o antecedente contextual mais provável.
- issue: Sentido da cláusula final
  choice: A audição do som é apresentada como medida para que Arão não morra.
  alternative: 'A cláusula pode ser vertida mais formalmente como uma consequência coordenada: “e ele não morrerá”.'
  rationale: A sintaxe hebraica permite uma relação de consequência ou prevenção neste contexto legal-ritual; a tradução escolhida a torna clara sem definir além do texto o mecanismo dessa preservação.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” preserva o nome próprio no texto e segue a política terminológica indicada para o projeto.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Ministrar” preserva o vocabulário sacerdotal sem ampliar o sentido. A ordem das ações e a tensão entre prescrição, som audível e preservação da vida foram mantidas.
