base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: pt
  text: 'A faixa habilmente tecida do seu éfode, que fica sobre ele, será feita do mesmo modo e formará uma só peça com ele[a]: de ouro, fios de cor azul, púrpura e escarlate[b], e linho fino retorcido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “será como o trabalho dele; dele será”. O hebraico enfatiza que a faixa devia corresponder à confecção do éfode e provavelmente ser integrada a ele, em vez de constituir um componente separado.
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “azul, púrpura e escarlate” designa materiais têxteis tingidos usados no santuário e nas vestes sacerdotais.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  choice: faixa habilmente tecida
  rationale: No contexto das vestes sacerdotais, designa um componente tecido do éfode, provavelmente usado para ajustá-lo; a formulação preserva tanto sua natureza têxtil quanto o trabalho especializado.
- source_word: אֲפֻדָּתוֹ
  choice: seu éfode
  rationale: Mantém o termo tradicional da veste sacerdotal e preserva o sufixo possessivo.
- source_word: אֲשֶׁר עָלָיו
  choice: que fica sobre ele
  rationale: O antecedente mais natural é o éfode. A redação conserva a relação espacial sem explicitar de modo indevido se a faixa estava apenas sobreposta ou estruturalmente presa.
- source_word: כְּמַעֲשֵׂהוּ
  choice: será feita do mesmo modo
  rationale: Expressa a correspondência entre a confecção da faixa e a do éfode, sem omitir o elemento מַעֲשֶׂה.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: formará uma só peça com ele
  rationale: Comunica o hebraico literal 'dele será' como unidade integral entre a faixa e o éfode, em português natural.
- source_word: זָהָב
  choice: ouro
  rationale: Correspondência direta do material mencionado.
- source_word: תְּכֵלֶת
  choice: fios azuis
  rationale: O termo indica material têxtil tingido de azul; 'fios' torna explícita a natureza do item dentro da lista de materiais.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Tradução corrente do corante ou material têxtil de cor púrpura nas descrições do santuário.
- source_word: תוֹלַעַת שָׁנִי
  choice: escarlate
  rationale: Designa material tingido de escarlate. A coordenação com 'fios' permite que esse substantivo se aplique naturalmente às três cores.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto a qualidade fina do linho quanto o fato de seus fios serem retorcidos.
