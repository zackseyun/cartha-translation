base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: pt
  text: Faça duas argolas de ouro e coloque-as nas duas ombreiras do éfode, na parte de baixo, na parte da frente, em frente ao ponto de união[a], acima da faixa habilmente tecida do éfode.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em correspondência com sua junção” ou “em frente ao lugar onde ele se une”. O hebraico se refere de modo amplo ao lugar onde o éfode é unido.
    reason: lexical_alternative
  - marker: b
    text: Ou “faixa tecida do éfode” ou “cinturão tecido do éfode”. O termo hebraico חֵשֶׁב designa a faixa especialmente confeccionada que fazia parte do éfode.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹות
  choice: argolas
  rationale: No contexto de peças metálicas usadas para prender a veste sacerdotal, o termo designa argolas; esta é a forma mais natural em português.
- source_word: כִתְפוֹת
  choice: ombreiras
  rationale: O termo se refere às partes da veste que ficam sobre os ombros, não diretamente aos ombros anatômicos.
- source_word: הָאֵפוֹד
  choice: o éfode
  rationale: Mantém o nome técnico tradicional da veste sacerdotal, pois não há equivalente português breve que expresse com precisão esse objeto cultual.
- source_word: מִלְּמַטָּה
  choice: na parte de baixo
  rationale: Expressa claramente a posição inferior das argolas na estrutura da veste.
- source_word: מִמּוּל פָּנָיו
  choice: na parte da frente
  rationale: Traduz de modo idiomático a expressão hebraica referente à face ou frente de um objeto.
- source_word: לְעֻמַּת
  choice: junto a
  rationale: Neste contexto de montagem da veste, indica a posição correspondente ao local de união; evita sugerir necessariamente que as peças estejam em lados contrários.
- source_word: מֶחְבַּרְתּוֹ
  choice: seu ponto de união
  rationale: Preserva o sentido amplo de lugar de junção ou conexão, sem restringi-lo a uma costura feita com linha.
- source_word: מִמַּעַל
  choice: acima
  rationale: Indica diretamente a posição superior em relação à faixa do éfode.
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: a faixa habilmente tecida do éfode
  rationale: Apresenta a peça especial de ligação ou cintura do éfode e conserva a ideia artesanal sugerida pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia concreta de confecção. “Éfode” preserva o termo técnico bíblico; “ombreiras”, “argolas” e “ponto de união” tornam inteligível a construção da veste. Os marcadores foram posicionados imediatamente após as expressões às quais as notas se referem.
