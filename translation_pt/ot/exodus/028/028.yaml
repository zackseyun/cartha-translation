  text: וְ/יִרְכְּס֣וּ אֶת הַ֠/חֹשֶׁן מ/טבעת/ו אֶל טַבְּעֹ֤ת הָ/אֵפֹד֙ בִּ/פְתִ֣יל תְּכֵ֔לֶת לִֽ/הְי֖וֹת עַל חֵ֣שֶׁב הָ/אֵפ֑וֹד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: pt
  text: Prenderão o peitoral[a], pelas suas argolas, às argolas do éfode com um cordão de fio azul[b], para que fique sobre a faixa tecida do éfode; e o peitoral não se soltará do éfode.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peça do peito”. O termo hebraico designa aqui a peça sacerdotal presa ao éfode, não uma parte de armadura.
    reason: lexical_alternative
  - marker: b
    text: Ou “com um cordão azul”. O termo hebraico תְּכֵלֶת refere-se ao material tingido de azul usado nos tecidos do tabernáculo e nas vestes sacerdotais.
    reason: lexical_alternative
  - marker: c
    text: Ou “não se deslocará de cima do éfode”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: Prenderão
  rationale: O verbo indica unir ou firmar peças entre si. “Prenderão” é natural no contexto de argolas e cordão sem especificar além do hebraico o modo exato de amarração.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: Neste contexto, o termo designa a peça sacerdotal usada sobre o peito, não uma armadura. “Peitoral” é corrente, conciso e adequado ao objeto ritual.
- source_word: מִטַּבְּעֹתָיו
  choice: pelas suas argolas
  rationale: A preposição marca o ponto ou meio de fixação. “Pelas suas argolas” expressa de modo idiomático que o peitoral era preso por meio delas.
- source_word: טַבְּעֹת הָאֵפֹד
  choice: às argolas do éfode
  rationale: Reproduz com clareza a relação construta e o destino da fixação.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: com um cordão de fio azul
  rationale: פְּתִיל designa fio ou cordão, e תְּכֵלֶת é o material tingido de azul usado nos tecidos do santuário. A formulação mantém tanto o objeto quanto sua composição têxtil.
- source_word: לִהְיוֹת עַל
  choice: para que fique sobre
  rationale: O infinitivo exprime finalidade ou resultado. “Para que fique sobre” conserva a relação espacial sem acrescentar a ideia interpretativa de repousar.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: a faixa tecida do éfode
  rationale: No contexto das vestes sacerdotais, חֵשֶׁב refere-se à faixa integrada ao éfode. “Faixa tecida” identifica a peça de maneira clara sem sobrecarregar o texto.
- source_word: וְלֹא יִזַּח
  choice: e ... não se soltará
  rationale: A forma verbal comunica que o peitoral não deveria sair de sua posição nem desprender-se. “Não se soltará” é natural no contexto de uma peça presa por argolas e cordão.
- source_word: מֵעַל הָאֵפֹד
  choice: do éfode
  rationale: A expressão indica afastamento da posição ocupada sobre o éfode. Em português, “soltar-se do éfode” transmite essa separação com naturalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos tradicionais “peitoral” e “éfode”, enquanto a sintaxe explicita de forma natural os pontos de fixação. Os marcadores de nota foram posicionados junto às expressões a que efetivamente se referem.
