  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: pt
  text: Prenda as duas correntes de ouro trançadas[a] às duas argolas que estão nas extremidades do peitoral[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correntes de ouro torcidas” ou “cordões de ouro trançados”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico חֹשֶׁן designa a peça sacerdotal usada sobre o peito; tradicionalmente, “peitoral”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Prenda
  rationale: O perfeito qal com waw, nesta sequência de instruções, expressa uma ordem. “Prenda” comunica naturalmente que as correntes devem ser fixadas às argolas, ação indicada pelo contexto.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: as duas correntes de ouro trançadas
  rationale: עֲבֹתֹת designa aqui correntes ou cordões trabalhados por torção ou entrelaçamento. “Correntes de ouro trançadas” preserva tanto o material quanto a forma ornamental.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: às duas argolas
  rationale: Embora עַל tenha sentido básico de “sobre”, neste contexto indica o ponto de fixação. A contração “às” é a formulação idiomática em português para prender correntes a argolas.
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: nas extremidades do peitoral
  rationale: קְצֹוֹת indica as pontas ou extremidades. “Nas extremidades” expressa em português natural a localização pretendida por אֶל neste contexto.
- source_word: הַחֹשֶׁן
  choice: peitoral
  rationale: No contexto das vestes sacerdotais, חֹשֶׁן designa a peça ornamental usada sobre o peito. “Peitoral” é claro e tradicional em português sem sugerir necessariamente uma placa de armadura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa adequada a uma instrução artesanal. “Prenda” evita uma tradução excessivamente literal de וְנָתַתָּה e explicita apenas a relação de fixação já presente no contexto. Todos os marcadores de nota aparecem junto às expressões pertinentes.
