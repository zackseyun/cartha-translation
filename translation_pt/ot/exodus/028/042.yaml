translation:
  language: pt
  text: Faça para eles calções de linho[a], para cobrir a carne nua; devem estender-se da cintura até as coxas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “roupas de baixo de linho”. O hebraico se refere a uma peça para a parte inferior do corpo, usada sob as vestes sacerdotais.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dos lombos até as coxas”. Aqui, “cintura” indica, em linguagem corrente, o ponto superior da peça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Faça também
  rationale: O imperativo preserva o tom de instrução, e “também” expressa naturalmente a ligação sequencial do waw com as ordens anteriores.
- source_word: לָהֶם
  choice: para eles
  rationale: Mantém o sentido benefactivo e a referência aos sacerdotes mencionados no contexto.
- source_word: מִכְנְסֵי בָד
  choice: calções de linho
  rationale: Designa com clareza uma peça que cobre a parte inferior do corpo e era usada sob as vestes sacerdotais; “linho” traduz בָד neste contexto.
- source_word: לְכַסּוֹת
  choice: para cobrir
  rationale: Reproduz diretamente o infinitivo de finalidade.
- source_word: בְּשַׂר עֶרְוָה
  choice: a nudez do corpo
  rationale: Expressa a construção concreta hebraica, literalmente “carne de nudez”, em português natural e digno, sem a reduzir especificamente a “partes íntimas”.
- source_word: מִמָּתְנַיִם
  choice: da cintura
  rationale: מָתְנַיִם pode indicar lombos, cintura ou quadris; “cintura” é natural em português para o ponto superior de uma peça de roupa.
- source_word: וְעַד יְרֵכַיִם
  choice: até as coxas
  rationale: יְרֵכַיִם designa aqui as coxas e indica o limite inferior da peça.
- source_word: יִהְיוּ
  choice: irão
  rationale: Embora o verbo seja literalmente “serão/estarão”, “irão de... até...” comunica de modo idiomático a extensão da peça sem acrescentar uma ação material indevida.
