  naturalness: “Calções de linho” é compreensível e apropriado em português moderno. “Devem estender-se da cintura até as coxas” é natural em uma descrição de vestimenta e evita a impressão de deslocamento produzida por “irão”.
  terminology: “Calções de linho” mantém uma designação clara para a peça inferior usada sob as vestes sacerdotais. “Cintura” é uma opção moderna defensável para מָתְנַיִם; a nota preserva “lombos” como alternativa mais literal. “Carne nua” mantém o referente corporal sem especificá-lo indevidamente como órgãos genitais.
