    text: Em hebraico, literalmente, “escarlate do verme”, expressão referente a material escarlate tingido com corante produzido a partir de insetos.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Eles
  rationale: O pronome independente explicita e destaca levemente o sujeito já identificado no contexto, sem exigir uma forma enfática como “eles mesmos” em português.
- source_word: יִקְחוּ
  choice: pegarão
  rationale: O imperfeito tem força instrutiva no contexto das ordens para a confecção das vestes. O futuro português expressa de modo natural essa determinação.
- source_word: הַזָּהָב
  choice: o ouro
  rationale: Preserva o artigo hebraico e apresenta o ouro como um dos materiais designados.
- source_word: הַתְּכֵלֶת
  choice: o material azul
  rationale: O termo designa material têxtil tingido de azul, não apenas a cor abstrata. “Material azul” mantém essa referência sem especificar indevidamente se era fio ou tecido.
- source_word: הָאַרְגָּמָן
  choice: a púrpura
  rationale: Designa material tingido de púrpura; a forma tradicional e concisa funciona naturalmente dentro da lista, enquanto a nota esclarece que os termos cromáticos podem indicar materiais têxteis.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: o fio escarlate
  rationale: A expressão idiomática refere-se a material escarlate, tingido com corante de origem animal. “Fio escarlate” explicita adequadamente o uso têxtil no contexto das vestes.
- source_word: הַשֵּׁשׁ
  choice: o linho fino
  rationale: Nos contextos do santuário, o termo se refere a linho de qualidade fina, distinção relevante para os materiais das vestes sacerdotais.
