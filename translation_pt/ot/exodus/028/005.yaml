translation:
  language: pt
  text: Eles tomarão o ouro, o material azul[a], a púrpura, o fio escarlate[b] e o linho fino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “fio azul”; os termos hebraicos para azul e púrpura podem designar materiais têxteis tingidos, e não apenas as cores em sentido abstrato.
    reason: lexical_alternative
