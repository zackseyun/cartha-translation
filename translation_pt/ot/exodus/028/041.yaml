base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: pt
  text: Você os vestirá — Arão, seu irmão, e seus filhos com ele —; você os ungirá, os ordenará[a] e os consagrará, e eles me servirão como sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “encherá as mãos deles”, expressão hebraica usada para a investidura de alguém no serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Você vestirá
  rationale: O hifil de לבשׁ, com objeto, expressa fazer alguém vestir-se ou pôr-lhe as roupas; no contexto, são as vestes sacerdotais descritas anteriormente. “Vestirá” é natural e preserva o sentido causativo.
- source_word: אֹתָם ... אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: Arão, seu irmão, e os filhos dele com ele
  rationale: O pronome antecipador hebraico é esclarecido pela expressão nominal seguinte. Em português, omiti-lo evita uma construção pesada, sem perder nenhum referente; “com ele” conserva אִתּוֹ.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: você os ungirá
  rationale: משׁח é o termo ritual apropriado para ungir na consagração sacerdotal.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: os ordenará
  rationale: A expressão literalmente ligada a “encher a mão” é um idioma hebraico para investir ou instalar alguém no ofício sacerdotal. “Ordenará” comunica a função no contexto, enquanto a forma literal fica registrada em nota.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: os consagrará
  rationale: קדשׁ aqui significa separar como santo para o serviço sagrado; “consagrará” é claro e adequado ao contexto ritual.
- source_word: וְכִהֲנוּ לִי
  choice: para que me sirvam como sacerdotes
  rationale: O piel de כהן indica exercer o sacerdócio. A construção final em português exprime naturalmente o resultado ou propósito da sequência de ações e mantém לִי em “me sirvam”.
theological_decisions:
- issue: Tradução do idioma sacerdotal מִלֵּא אֶת־יָד
  choice: Traduzir no texto principal como “ordenará”
  alternative: “encherá as mãos deles” ou “os investirá”
  rationale: A expressão designa a instalação formal no serviço sacerdotal, não o ato literal de encher mãos. “Ordenará” torna a função compreensível, sem especificar um rito denominacional posterior; a imagem hebraica é preservada em nota.
- issue: Relação entre a consagração e o serviço sacerdotal em וְכִהֲנוּ לִי
  choice: “para que me sirvam como sacerdotes”
  alternative: “e eles me servirão como sacerdotes”
  rationale: O hebraico permite ler a última forma como consequência ou finalidade das ações precedentes. A formulação escolhida é natural em português e não acrescenta uma definição teológica do sacerdócio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “você” preserva a referência direta ao interlocutor e evita formas regionais; “os filhos dele” elimina a possível ambiguidade de “seus filhos”.
