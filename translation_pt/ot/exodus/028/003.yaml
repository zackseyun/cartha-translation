  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: pt
  text: Quanto a você, fale a todos os sábios de coração[a], a quem enchi de um espírito de sabedoria[b]. Eles farão as vestes de Arão a fim de consagrá-lo, para que me sirva como sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sábios de coração”, expressão que se refere a pessoas dotadas de discernimento, capacidade e habilidade artesanal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do Espírito de sabedoria”. O hebraico pode indicar um espírito ou uma disposição de sabedoria concedida por Deus, sem exigir aqui uma identificação mais específica.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה תְּדַבֵּר
  choice: Quanto a você, fale
  rationale: A construção destaca o destinatário da ordem. “Quanto a você” preserva a ênfase de וְאַתָּה, enquanto o imperativo “fale” comunica naturalmente em português a força diretiva do imperfeito no contexto de instruções.
- source_word: חַכְמֵי לֵב
  choice: sábios de coração
  rationale: Mantém a metáfora hebraica do coração como sede do discernimento e da capacidade. No contexto, a expressão inclui habilidade artesanal, esclarecida em nota.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: a quem enchi de um espírito de sabedoria
  rationale: Preserva a imagem verbal de “encher” e a ausência de artigo em רוּחַ. “Sabedoria” mantém o sentido básico do substantivo, que neste contexto abrange aptidão prática.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: as vestes de Arão
  rationale: Reproduz diretamente a construção hebraica sem acrescentar “sacerdotais”, embora isso esteja implícito no contexto.
- source_word: לְקַדְּשׁוֹ
  choice: a fim de consagrá-lo
  rationale: No contexto sacerdotal, קדשׁ indica separar e dedicar alguém ao serviço sagrado; “consagrar” é preciso e corrente.
- source_word: לְכַהֲנוֹ לִי
  choice: para que me sirva como sacerdote
  rationale: O verbo כהן significa exercer a função sacerdotal. A formulação preserva לִי como serviço prestado a Deus e é natural em português.
- source_word: וְעָשׂוּ
  choice: Eles farão
  rationale: O perfeito com וְ dá continuidade à sequência de instruções. O futuro em português conserva o tom prescritivo e distingue esta ordem da ordem dirigida a Moisés.
theological_decisions:
- issue: Se רוּחַ חָכְמָה é uma referência explícita ao Espírito Santo
  choice: um espírito de sabedoria
  alternative: o Espírito de sabedoria
  rationale: A expressão hebraica não tem artigo e pode designar uma disposição ou capacidade de sabedoria concedida por Deus. A tradução principal não torna a referência mais específica do que o hebraico, e a possibilidade alternativa é preservada em nota.
- issue: Relação entre a consagração e o serviço sacerdotal nos dois infinitivos finais
  choice: a fim de consagrá-lo, para que me sirva como sacerdote
  alternative: para consagrá-lo para me servir como sacerdote
  rationale: A redação conserva tanto o propósito da confecção das vestes quanto o serviço sacerdotal como finalidade da consagração, sem fundir completamente os dois infinitivos hebraicos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A abertura mantém a ênfase hebraica sobre o destinatário sem recorrer ao pronome “tu”; “vestes”, “consagrar” e “sacerdote” preservam o registro cultual sem arcaísmo excessivo.
