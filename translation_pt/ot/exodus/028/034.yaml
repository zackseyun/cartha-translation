lexical_decisions:
- source_word: פַּעֲמֹן
  choice: campainha
  rationale: Designa um pequeno sino preso à veste; “campainha” comunica de modo natural em português o tamanho e a função do objeto.
- source_word: זָהָב
  choice: de ouro
  rationale: Expressa diretamente o material da campainha e reproduz com naturalidade a construção hebraica.
- source_word: רִמּוֹן
  choice: romã
  rationale: É o sentido comum do termo hebraico. O contexto indica um ornamento em forma de romã, mas a tradução literal preserva a concisão do texto.
- source_word: עַל ... סָבִיב
  choice: ao longo de toda
  rationale: A combinação da preposição com o advérbio de circundamento descreve a disposição dos objetos por toda a extensão da barra; esta formulação evita uma repetição pouco natural em português.
- source_word: שׁוּלֵי
  choice: barra
  rationale: No contexto de uma veste, refere-se à extremidade inferior ou barra. “Barra” é clara e corrente em português.
- source_word: מְעִיל
  choice: manto
  rationale: No contexto das vestes sacerdotais, “manto” é uma designação natural e digna para a peça indicada pelo hebraico.
