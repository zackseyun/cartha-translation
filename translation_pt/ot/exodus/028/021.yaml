base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: pt
  text: 'E as pedras corresponderão aos nomes dos filhos de Israel[a]: serão doze, segundo os nomes deles. Terão gravações de sinete[b], cada uma com o nome de um deles, para as doze tribos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de Israel”; a expressão também pode ser entendida como “descendentes de Israel” ou “israelitas”. O hebraico diz, de forma bastante literal, que as pedras “serão sobre/segundo os nomes” deles.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serão gravadas como um sinete” ou “com a gravação de um selo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: E as pedras
  rationale: Preserva a conjunção hebraica e a referência definida às pedras já descritas no contexto.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: corresponderão aos nomes dos filhos de Israel
  rationale: O verbo é literalmente 'serão', mas עַל com 'nomes' expressa aqui relação ou correspondência. A formulação é natural em português sem transformar a relação em posição física.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: serão doze, segundo os nomes deles
  rationale: Mantém o número cardinal e a correspondência reiterada pelo hebraico, com clareza sintática em português.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: gravadas como um sinete
  rationale: Expressa a ideia de gravações próprias de um selo ou sinete em linguagem corrente e digna; o particípio feminino plural concorda com 'pedras'.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: cada uma com o nome de um deles
  rationale: אִישׁ tem força distributiva. A redação esclarece que cada pedra recebe um nome, evitando sugerir que a pedra tenha gênero masculino ou um nome próprio independente.
- source_word: לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: para as doze tribos
  rationale: Reproduz de modo conciso a referência ou finalidade indicada por לְ.
theological_decisions:
- issue: Expressão pactual בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: descendentes de Israel / israelitas
  rationale: Mantém a expressão masculina e genealógica do hebraico sem neutralizá-la; uma nota explica o alcance coletivo da expressão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção foi levemente explicitada para conservar a relação entre as doze pedras, os nomes e as tribos sem reproduzir a aspereza da sintaxe hebraica.
