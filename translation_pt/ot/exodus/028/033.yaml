base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: pt
  text: Faça romãs de fios azuis, roxos e escarlates[a] ao redor de toda a barra do manto, com sinos de ouro entre elas, por toda a volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ornamentos em forma de romã”. O hebraico diz literalmente “romãs”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com conjunção, neste contexto de instruções, expressa uma ordem. O imperativo é natural e claro em português.
- source_word: שׁוּלָיו
  choice: a barra do manto
  rationale: O termo indica a borda inferior da roupa. 'Barra' é corrente em português; 'do manto' explicita o referente contextual do sufixo pronominal.
- source_word: רִמֹּנֵי
  choice: romãs
  rationale: Preserva o substantivo concreto empregado pelo hebraico, sem decidir no texto principal se eram frutos figurados ou ornamentos em forma de romã.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: de fios azul, roxo e escarlate
  rationale: As palavras designam materiais têxteis tingidos usados nas vestes sacerdotais. 'Fios' torna explícito o sentido material sugerido pelo contexto, e os adjetivos no singular concordam distributivamente com 'fios'.
- source_word: סָבִיב
  choice: ao redor de toda / por toda a volta
  rationale: As duas ocorrências indicam que os elementos circundavam completamente a barra; a leve variação evita repetição rígida sem perder o sentido.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: com sinos de ouro
  rationale: Mantém o elemento adicional e a matéria dos sinos em formulação idiomática portuguesa.
- source_word: בְּתוֹכָם
  choice: entre elas
  rationale: No contexto, os sinos ficam no meio das romãs, provavelmente intercalados. 'Entre elas' expressa a relação espacial sem acrescentar um padrão mais específico que o texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O referente 'manto' foi explicitado para evitar a forma pouco natural 'sua barra' fora do contexto imediato. A ordem dos elementos e a repetição da ideia de circundar a barra foram preservadas.
