  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: pt
  text: Será quadrado e dobrado[a], com um palmo de comprimento e um palmo de largura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «duplo» ou «dobrado em dois». O hebraico descreve o peitoral como feito em duas partes ou camadas, provavelmente dobrado sobre si mesmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: quadrado
  rationale: O adjetivo descreve uma forma de quatro lados iguais; «quadrado» é claro e natural em português atual.
- source_word: יִהְיֶה
  choice: será
  rationale: O imperfeito apresenta uma especificação para a confecção do peitoral; o futuro transmite adequadamente esse valor prescritivo no contexto.
- source_word: כָּפוּל
  choice: dobrado
  rationale: O particípio passivo indica que o objeto deve ter forma dupla, provavelmente por ser dobrado sobre si mesmo; «dobrado» mantém a concisão e não explicita além do hebraico.
- source_word: זֶרֶת
  choice: palmo
  rationale: Designa a medida correspondente à distância entre as extremidades da mão aberta; «palmo» é o equivalente tradicional e inteligível em português.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: Na fórmula de medidas, «com um palmo de comprimento» soa natural e comunica a dimensão longitudinal do objeto.
- source_word: וְזֶרֶת
  choice: e um palmo
  rationale: A conjunção liga a segunda medida, com repetição natural da unidade em português.
- source_word: רָחְבּוֹ
  choice: de largura
  rationale: Expressa a dimensão transversal e forma um par idiomático com «comprimento».
