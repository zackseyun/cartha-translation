  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: pt
  text: Faça também duas argolas de ouro e coloque-as nas duas extremidades do peitoral, na borda voltada para o lado interno do éfode[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na sua borda voltada para dentro, em direção ao éfode».'
    reason: Alternativa lexical para a relação espacial expressa por אֶל עֵבֶר הָאֵפֹד בָּיְתָה.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito qal com conjunção, dentro da sequência de instruções, tem força diretiva. O imperativo em português é natural, e «também» expressa a continuidade da sequência.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: duas argolas de ouro
  rationale: «Argolas» descreve com clareza os elementos de fixação; «de ouro» preserva explicitamente o material.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: e coloque-as
  rationale: שׂים significa pôr, colocar ou fixar. «Coloque-as» é claro e apropriado para instruções artesanais.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: nas duas extremidades do peitoral
  rationale: קָצֶה indica extremidade ou ponta. «Peitoral» é uma designação tradicional, clara e concisa para חֹשֶׁן neste contexto sacerdotal.
- source_word: עַל שְׂפָתוֹ
  choice: na borda
  rationale: שָׂפָה pode significar lábio, beira ou borda; para uma peça têxtil, «borda» é a opção portuguesa mais natural.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: que fica voltada para o lado de dentro do colete sacerdotal
  rationale: A expressão combina a ideia do lado voltado para o éfode com o advérbio «para dentro». A formulação preserva a relação espacial sem recorrer a uma tradução literal obscura; «colete sacerdotal» comunica a função do אֵפוֹד ao leitor comum.
