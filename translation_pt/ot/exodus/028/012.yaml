  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: pt
  text: Ponha as duas pedras nas ombreiras do éfode como pedras memoriais para os filhos de Israel[a]. Arão levará os nomes deles diante de Yahweh, sobre os seus dois ombros, para lembrança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras de lembrança”. A expressão “filhos de Israel” é uma designação familiar e pactual que aqui se refere ao povo de Israel como um todo.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Ponha
  rationale: O verbo שׂים significa pôr, colocar ou fixar. O imperativo português comunica naturalmente a força injuntiva da forma hebraica dirigida a uma pessoa no singular.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: as duas pedras
  rationale: Tradução direta do numeral com o substantivo definido; a identificação do material pertence ao contexto anterior e não deve ser acrescentada neste versículo.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: nas ombreiras do éfode
  rationale: No contexto de vestuário, כָּתֵף designa as partes do éfode que ficam sobre os ombros. “Ombreiras” distingue essas peças dos ombros físicos de Arão mencionados depois.
- source_word: אַבְנֵי זִכָּרֹן
  choice: pedras memoriais
  rationale: A construção significa literalmente pedras de lembrança ou memorial. “Pedras memoriais” é clara e digna em português.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico, que neste contexto representa coletivamente o povo descendente de Israel.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: Arão levará os nomes deles
  rationale: נשׂא pode significar carregar ou levar. “Levar” conserva a imagem concreta da representação sacerdotal e soa natural em português.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica presença ou comparecimento diante de alguém; o nome divino é transliterado como Yahweh.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: sobre os seus dois ombros
  rationale: Refere-se aos ombros físicos de Arão e preserva tanto o numeral quanto a repetição concreta do hebraico.
- source_word: לְזִכָּרֹן
  choice: para lembrança
  rationale: Mantém o vínculo lexical com זִכָּרֹן na primeira metade do versículo sem determinar explicitamente quem se lembra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel; israelitas
  rationale: A formulação mantém a linguagem familiar do original. No contexto, ela se refere coletivamente ao povo de Israel, não apenas aos homens.
- issue: Agente ou beneficiário da lembrança
  choice: para lembrança
  alternative: para que Yahweh se lembre; como memorial diante de Yahweh
  rationale: O hebraico não explicita quem realiza o ato de lembrar. A tradução conserva essa ambiguidade em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Éfode” conserva o termo técnico tradicional da vestimenta sacerdotal; “ombreiras” esclarece que a primeira ocorrência de כָּתֵף se refere às partes da veste. A repetição de זִכָּרֹן foi refletida por “memoriais” e “lembrança”.
