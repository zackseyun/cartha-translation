source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: pt
  text: Arão levará[a] os nomes dos filhos de Israel[c] no peitoral do julgamento[b], sobre o seu coração, quando entrar no Lugar Santo, como memorial diante de Yahweh continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregará”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “peitoral para decisão”. O título hebraico associa essa peça sacerdotal ao julgamento ou à decisão diante de Deus.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “os filhos de Israel”; expressão genealógica que aqui se refere às tribos descendentes de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: levará
  rationale: נשא pode significar “levar” ou “carregar”. “Levará” é natural em português e preserva a imagem concreta de Arão portando os nomes sobre si.
- source_word: שְׁמוֹת
  choice: os nomes
  rationale: Tradução direta do plural, referindo-se aos nomes gravados, e não apenas às tribos em sentido abstrato.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Preserva a expressão genealógica masculina do hebraico, que aqui representa corporativamente as tribos descendentes de Israel.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: no peitoral do julgamento
  rationale: “Peitoral” designa a peça sacerdotal; “do julgamento” mantém a amplitude de מִשְׁפָּט sem determinar se o título aponta especificamente para julgamento, decisão ou justiça.
- source_word: עַל לִבּוֹ
  choice: sobre o coração
  rationale: Mantém tanto a posição física da peça quanto sua força simbólica; o possessivo é dispensável em português porque o referente é claro.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: quando entrar no Lugar Santo
  rationale: A construção com infinitivo indica tempo. No contexto do tabernáculo, הַקֹּדֶשׁ designa o espaço sagrado no qual Arão entra.
- source_word: לְזִכָּרוֹן
  choice: como memorial
  rationale: Expressa de modo natural a função memorial indicada pela preposição לְ e pelo substantivo זִכָּרוֹן.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Tradução idiomática de “perante/na presença de”, preservando o nome divino como Yahweh conforme a política do projeto.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Preserva a ideia de continuidade regular própria do serviço cultual.
theological_decisions:
- issue: Sentido do título cultual חֹשֶׁן הַמִּשְׁפָּט
  choice: peitoral do julgamento
  alternative: peitoral das decisões
  rationale: A formulação escolhida mantém a ligação da peça sacerdotal com julgamento ou decisão divina sem restringir uma expressão hebraica de sentido amplo.
- issue: Forma genealógica בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A forma literal conserva a imagem genealógica e a referência às tribos, sem neutralizar o masculino gramatical do texto.
- issue: Referente de הַקֹּדֶשׁ
  choice: Lugar Santo
  alternative: santuário
  rationale: O contexto sacerdotal favorece a identificação do espaço sagrado do tabernáculo; a capitalização indica seu uso como designação cultual.
- issue: Função de לְזִכָּרוֹן לִפְנֵי יְהוָה
  choice: como memorial diante de Yahweh
  alternative: para lembrança diante de Yahweh
  rationale: “Como memorial” comunica a função representativa dos nomes na presença divina sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos cultuais “peitoral do julgamento” e “Lugar Santo”, bem como o nome divino “Yahweh”. Os marcadores foram colocados ao fim do versículo para não interromper excessivamente a leitura, e todos correspondem às notas fornecidas.
