  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: pt
  text: Como o trabalho de um gravador de pedras, à maneira das gravações de um sinete[a], grave as duas pedras com os nomes dos filhos de Israel[b]; faça-as com engastes de ouro ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “selo”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”; aqui, os nomes representam as tribos descendentes de Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: Como o trabalho de um gravador de pedras
  rationale: A expressão indica o tipo ou padrão de trabalho artesanal. “Gravador de pedras” é preciso no contexto de inscrever nomes em pedras e soa natural em português.
- source_word: פִּתּוּחֵי חֹתָם
  choice: à maneira das gravações de um sinete
  rationale: A construção descreve incisões características de um selo pessoal. “À maneira de” explicita naturalmente o valor comparativo, e “sinete” preserva o contexto de gravação em joalheria.
- source_word: תְּפַתַּח
  choice: grave
  rationale: No contexto de inscrever nomes em pedras, “gravar” é o equivalente português mais preciso e idiomático.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: as duas pedras
  rationale: Mantém o termo genérico do hebraico sem especificá-las além do que o versículo afirma.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: com os nomes dos filhos de Israel
  rationale: “Com os nomes” expressa de modo natural o conteúdo gravado. “Filhos de Israel” conserva a designação genealógica masculina do texto.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב תַּעֲשֶׂה אֹתָם
  choice: faça para elas engastes de ouro ao redor
  rationale: A formulação comunica que as pedras devem ficar circundadas por suportes ornamentais de ouro, preservando tanto a ideia de engaste quanto a de algo disposto ao redor.
theological_decisions:
- issue: Designação familiar בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: filhos e descendentes de Israel; povo de Israel
  rationale: O contexto imediato remete aos filhos patriarcais de Israel, cujos nomes identificam as tribos. A tradução conserva essa referência genealógica sem ampliá-la no corpo do texto; a nota esclarece sua relação com os descendentes tribais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos diretos. “Sinete” preserva a precisão histórica, apoiado por nota lexical; “engastes de ouro ao redor” evita linguagem excessivamente técnica sem apagar a disposição física descrita pelo hebraico.
