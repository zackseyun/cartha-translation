  source_fidelity: 'O sentido central está bem preservado: túnica de linho fino com padronagem, turbante de linho fino e faixa/cinturão de trabalho ornamental. Contudo, a coordenação hebraica apresenta três ordens explícitas, e a última deve conservar o imperativo verbal: «farás um cinturão».'
