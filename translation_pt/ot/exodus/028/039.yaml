  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: pt
  text: Faça a túnica de linho fino com um padrão quadriculado[a]. Faça também o turbante de linho fino e farás um cinturão, obra de bordador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teça a túnica de linho fino em padrão quadriculado”. O verbo hebraico provavelmente se refere à produção de um tecido padronizado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ הַכְּתֹנֶת שֵׁשׁ
  choice: Faça a túnica de linho fino com um padrão quadriculado
  rationale: שׁבץ, neste contexto de vestes sacerdotais, provavelmente indica a produção de um tecido padronizado, possivelmente em forma de quadrícula. A formulação comunica o resultado têxtil em português natural sem transformar a hipótese lexical em certeza absoluta; a nota registra a alternativa técnica.
- source_word: הַכְּתֹנֶת
  choice: a túnica
  rationale: כְּתֹנֶת designa uma veste semelhante a uma túnica; “túnica” é claro, tradicional e adequado ao vestuário sacerdotal.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: Nos contextos do tabernáculo e das vestes sacerdotais, שֵׁשׁ designa linho de alta qualidade; “linho fino” preserva tanto o material quanto sua qualidade.
- source_word: מִצְנֶפֶת
  choice: turbante
  rationale: מִצְנֶפֶת é uma cobertura sacerdotal enrolada em torno da cabeça; “turbante” é a equivalência portuguesa mais direta e reconhecível.
- source_word: אַבְנֵט
  choice: cinturão
  rationale: אַבְנֵט designa uma faixa longa usada na cintura. “Cinturão” é corrente no português bíblico moderno e evita sugerir apenas uma faixa decorativa transversal, embora “faixa” também seja possível.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: como trabalho de bordador
  rationale: A expressão indica trabalho ornamental executado por um artesão especializado. A tradução mantém o foco no tipo de trabalho e no bordador, sem especificar uma técnica além do que o hebraico permite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais. “Padrão quadriculado” torna acessível o provável sentido têxtil de שׁבץ, enquanto a nota preserva a incerteza quanto ao processo exato. O paralelismo das três ordens foi mantido de modo fluido.
