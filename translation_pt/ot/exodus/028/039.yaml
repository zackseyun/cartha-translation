  terminology: «Túnica», «linho fino», «turbante» e «cinturão» são escolhas adequadas. «Padrão quadriculado» transmite prudentemente o provável sentido de שׁבץ; a nota lexical preserva a incerteza técnica. «Bordador» é aceitável para רֹקֵם neste contexto.
