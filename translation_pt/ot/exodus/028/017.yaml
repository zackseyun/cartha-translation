  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: pt
  text: 'E nele colocarás engastes de pedras[a], em quatro fileiras: na primeira fileira haverá um rubi, um topázio e uma esmeralda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata dessas pedras preciosas é incerta. “Rubi” também pode ser “cornalina”; “topázio”, “crisólito” ou “peridoto”; e “esmeralda”, “berilo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: E nele colocarás engastes de pedras
  rationale: O verbo מלא significa literalmente “encher”, mas, neste contexto de ourivesaria, descreve o ato de prover o peitoral com pedras engastadas. “Colocarás engastes de pedras” mantém a imagem técnica sem sugerir mero preenchimento.
- source_word: אַרְבָּעָה טוּרִים
  choice: em quatro fileiras
  rationale: טוּר designa aqui uma fileira ordenada de pedras; “fileiras” é claro e natural em português.
- source_word: טוּר ... הָאֶחָד
  choice: na primeira fileira
  rationale: A expressão identifica a primeira de uma sequência de quatro fileiras; a forma ordinal é idiomática em português.
- source_word: אֹדֶם
  choice: rubi
  rationale: A identificação mineralógica exata é incerta. “Rubi” conserva a tradução tradicional e comunica uma pedra vermelha reconhecível; a alternativa “cornalina” é registrada em nota.
- source_word: פִּטְדָה
  choice: topázio
  rationale: A pedra não pode ser identificada com segurança. “Topázio” segue a tradição de tradução, enquanto “crisólito” e “peridoto” são preservados como alternativas em nota.
- source_word: בָרֶקֶת
  choice: esmeralda
  rationale: O termo parece associar-se a brilho ou fulgor, mas a espécie mineral é incerta. “Esmeralda” é a equivalência convencional; “berilo” é registrado em nota.
