  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
translation:
  language: pt
  text: 'E a quarta fileira: berilo[a], ônix e jaspe; as pedras serão engastadas em ouro, nos seus encaixes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de várias pedras preciosas do peitoral do sumo sacerdote é incerta. Traduções tradicionais incluem «berilo» para תַּרְשִׁישׁ e «ônix» para שֹׁהַם, mas outras identificações têm sido propostas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: E a quarta fileira
  rationale: טוּר designa aqui uma fileira de pedras no peitoral, em sequência com as fileiras dos versículos anteriores; o ordinal é direto.
- source_word: תַּרְשִׁישׁ
  choice: berilo
  rationale: A identificação mineralógica exata é incerta; «berilo» é uma equivalência tradicional e reconhecível, sem eliminar a necessidade de nota.
- source_word: וְשֹׁהַם
  choice: ônix
  rationale: Embora a identificação seja discutida, «ônix» é a equivalência tradicional mais difundida para שֹׁהַם neste contexto.
- source_word: וְיָשְׁפֵה
  choice: e jaspe
  rationale: «Jaspe» é a identificação convencional e corresponde naturalmente ao nome português da pedra.
- source_word: מְשֻׁבָּצִים זָהָב
  choice: as pedras serão engastadas em ouro
  rationale: O particípio passivo descreve pedras fixadas em trabalho de joalheria. Explicitar «as pedras» evita uma referência pronominal pouco natural em português, e «engastadas» é o termo idiomático preciso.
- source_word: יִהְיוּ בְּמִלּוּאֹתָם
  choice: nos seus encaixes
  rationale: Neste contexto artesanal, מִלּוּאֹת refere-se aos encaixes ou suportes nos quais as pedras são assentadas. A construção conserva a especificação prescritiva do hebraico.
