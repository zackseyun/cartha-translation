  text: וְ/עָשִׂ֥יתָ בִגְדֵי קֹ֖דֶשׁ לְ/אַהֲרֹ֣ן אָחִ֑י/ךָ לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: pt
  text: Faça vestes sagradas para Arão, seu irmão, para glória e beleza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para honra e beleza” ou “para glória e esplendor”.
    reason: Alternativas lexicais legítimas para כָּבוֹד e תִּפְאֶרֶת.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O qatal qal na segunda pessoa masculina singular, ligado pela conjunção e inserido em uma sequência de instruções, tem força diretiva. O imperativo português expressa essa função com naturalidade.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: vestes sagradas
  rationale: בִגְדֵי é o plural construto de בגד, e קֹדֶשׁ indica que as vestes são separadas para uso santo. “Vestes sagradas” mantém o registro solene sem recorrer a terminologia eclesiástica posterior.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: para Arão, seu irmão
  rationale: Mantém tanto a relação de finalidade ou beneficiário indicada por לְ quanto a identificação familiar explícita de Arão em relação a Moisés.
- source_word: לְכָבוֹד
  choice: para glória
  rationale: כָּבוֹד pode designar glória, honra ou dignidade. “Glória” preserva o tom elevado e deixa aberto se a ênfase recai na dignidade, na magnificência visível ou em ambas.
- source_word: וּלְתִפְאָרֶת
  choice: e beleza
  rationale: תִּפְאֶרֶת pode significar beleza, esplendor ou magnificência. “Beleza” é clara em português atual e conserva a dimensão estética em paralelo com “glória”.
theological_decisions:
- issue: Sentido das expressões de finalidade referentes às vestes sacerdotais
  choice: para glória e beleza
  alternative: para honra e beleza; para glória e esplendor
  rationale: As expressões hebraicas לְכָבוֹד וּלְתִפְאָרֶת possuem amplitude semântica e associam dignidade e esplendor às vestes. A redação principal evita restringir “glória” apenas à honra humana ou apenas à glória divina.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O imperativo “Faça” comunica diretamente a instrução divina; “vestes sagradas” conserva o caráter cultual sem anacronismo.
