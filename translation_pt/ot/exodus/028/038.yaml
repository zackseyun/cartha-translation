  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: pt
  text: Ela estará sobre a testa de Arão, e Arão levará a culpa associada às coisas sagradas[a], isto é, a todas as dádivas sagradas que os filhos de Israel consagrarem. Ela estará sempre sobre a testa dele, para que eles sejam aceitos[b] diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «carregará a culpa das coisas sagradas». A expressão hebraica pode indicar assumir a culpa ou a responsabilidade associada às ofertas sagradas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «para obter favor para eles». A expressão pode envolver a aceitação dos israelitas e, no contexto, também a de suas dádivas diante de Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: testa / testa dele
  rationale: Expressa de modo claro e natural a parte frontal da cabeça e preserva a repetição do hebraico.
- source_word: נָשָׂא ... עֲוֺן
  choice: levará a culpa ligada a
  rationale: Preserva o idioma sacerdotal de assumir ou carregar culpa/responsabilidade, enquanto «ligada a» evita a impressão de que as próprias coisas sagradas cometem pecado.
- source_word: הַקֳּדָשִׁים
  choice: coisas sagradas
  rationale: Mantém a categoria cultual ampla, que pode abranger ofertas e objetos consagrados, sem restringir indevidamente o referente.
- source_word: יַקְדִּישׁוּ
  choice: consagrarem
  rationale: Verbo natural em português para dedicar algo a Deus e torná-lo sagrado no contexto do culto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Conserva a designação pactual formal do hebraico; no contexto, refere-se coletivamente ao povo de Israel.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: como todas as suas dádivas sagradas
  rationale: Entende o לְ como ligado à condição em que as coisas são consagradas, isto é, como dádivas; oferece português inteligível sem eliminar a dificuldade sintática do hebraico.
- source_word: תָּמִיד
  choice: sempre
  rationale: Comunica com naturalidade a presença contínua exigida pelo texto.
- source_word: לְרָצוֹן לָהֶם
  choice: para que eles sejam aceitos
  rationale: Torna idiomática em português a construção de finalidade ou resultado, preservando os israelitas como referente mais provável sem excluir a relação com suas ofertas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de Arão levar a culpa das coisas sagradas
  choice: Arão assume a culpa ou responsabilidade ligada às coisas sagradas em seu papel sacerdotal.
  alternative: Arão remove diretamente o pecado das coisas sagradas, ou apenas representa simbolicamente a memória dos pecados de Israel.
  rationale: O idioma נָשָׂא עָוֺן pode indicar carregar culpa ou responsabilidade. A tradução mantém essa tensão e não especifica um mecanismo de expiação que o versículo não explica.
- issue: Referente de «para que eles sejam aceitos»
  choice: A aceitação diz respeito aos israelitas em conexão com suas dádivas consagradas.
  alternative: A expressão se refere exclusivamente à aceitação das dádivas.
  rationale: O pronome plural aponta mais naturalmente para os ofertantes, mas o contexto inclui inseparavelmente suas ofertas; a nota preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém termos cultuais necessários sem arcaísmo excessivo. Os marcadores [a] e [b] aparecem no texto na ordem correspondente às notas.
