revisions:
- from: Ela ficará sobre a testa de Arão, e Arão levará a culpa ligada às coisas sagradas[a] que os filhos de Israel consagrarem como todas as suas dádivas sagradas. Ela estará sempre sobre a testa dele, para que eles sejam aceitos[b] diante de Yahweh.
  to: Ela estará sobre a testa de Arão, e Arão levará a culpa associada às coisas sagradas[a], isto é, a todas as dádivas sagradas que os filhos de Israel consagrarem. Ela estará sempre sobre a testa dele, para que eles sejam aceitos[b] diante de Yahweh.
  rationale: A revisão substitui a construção ambígua «como todas» por uma aposição que identifica as coisas sagradas no contexto como as dádivas sagradas consagradas pelos filhos de Israel. Mantêm-se a ambiguidade sacerdotal de «levar a culpa», o referente humano mais provável de «eles» e os dois marcadores de nota nas posições pertinentes.
