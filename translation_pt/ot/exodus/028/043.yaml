  text: וְ/הָיוּ֩ עַל אַהֲרֹ֨ן וְ/עַל בָּנָ֜י/ו בְּ/בֹאָ֣/ם אֶל אֹ֣הֶל מוֹעֵ֗ד א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ וְ/לֹא יִשְׂא֥וּ עָוֺ֖ן וָ/מֵ֑תוּ חֻקַּ֥ת עוֹלָ֛ם ל֖/וֹ וּ/לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: pt
  text: Arão e seus filhos deverão usá-los quando entrarem na tenda do encontro ou quando se aproximarem do altar para servir no lugar santo, para que não levem sobre si culpa[a] e morram. Este será um estatuto permanente[b] para ele e para a sua descendência depois dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “incorram em culpa”; em hebraico, “levar culpa” é uma expressão jurídica e cultual.
    reason: lexical_alternative
  - marker: b
    text: Ou “um estatuto perpétuo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: deverão usá-los
  rationale: A expressão indica que as peças mencionadas no contexto devem estar sobre Arão e seus filhos. A formulação verbal é natural em português e mantém a força prescritiva da instrução.
- source_word: בְּבֹאָם
  choice: quando entrarem
  rationale: O infinitivo construto com בְּ e sufixo pronominal expressa uma circunstância temporal.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente do nome da tenda associada à presença divina e ao encontro cultual.
- source_word: בְגִשְׁתָּם
  choice: quando se aproximarem
  rationale: No contexto sacerdotal, נגשׁ descreve a aproximação para o serviço sagrado.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente corrente e preciso para o altar sacrificial.
- source_word: לְשָׁרֵת
  choice: para servir
  rationale: Expressa de modo claro o serviço sacerdotal, sem acrescentar uma distinção ministerial ausente do termo hebraico.
- source_word: בַּקֹּדֶשׁ
  choice: no lugar santo
  rationale: Preserva a linguagem de santidade e a referência ao espaço sagrado, sem identificar de forma excessivamente específica qual área está em vista.
- source_word: וְלֹא יִשְׂאוּ עָוֹן
  choice: para que não levem sobre si culpa
  rationale: Mantém a imagem e a força jurídico-cultual do idioma hebraico נשׂא עון, ao mesmo tempo que explicita em português a relação preventiva no contexto.
- source_word: וָמֵתוּ
  choice: e morram
  rationale: Conserva diretamente a consequência fatal ligada à culpa cultual.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Comunica uma prescrição duradoura em linguagem jurídica atual, preservando a amplitude temporal de עוֹלָם.
- source_word: זַרְעוֹ
  choice: sua descendência
  rationale: Mantém o sentido coletivo do singular hebraico e soa natural em português moderno.
theological_decisions:
- issue: Natureza da cláusula penal ligada à aproximação sacerdotal imprópria
  choice: A roupa prescrita deve ser usada para que os sacerdotes não levem sobre si culpa e morram.
  alternative: “Para que não incorram em culpa e morram.”
  rationale: A tradução conserva tanto o idioma jurídico-cultual de carregar culpa quanto a morte como consequência real, sem reduzir a passagem a uma simples irregularidade ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi levemente reestruturada para evitar o pouco natural “estarão sobre Arão”, sem alterar a obrigação de vestir as peças mencionadas no contexto. A expressão “levem sobre si culpa” preserva deliberadamente o idioma hebraico e sua tensão cultual.
