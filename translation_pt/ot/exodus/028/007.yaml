  - severity: low
    issue: «E assim ficará unido» apresenta a leitura resultativa como principal.
    rationale: O waw antes do passivo pode ser vertido coordenativamente («e será unido»). Como o valor resultativo é possível, mas não obrigatório, a coordenação simples é mais neutra no texto principal.
