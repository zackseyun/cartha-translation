  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: pt
  text: Terá duas peças para os ombros, unidas às duas extremidades do colete, e ele será unido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que fique unido”. A última expressão também pode indicar o resultado da união das peças aos dois extremos do colete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: duas peças para os ombros
  rationale: No contexto da confecção do colete sacerdotal, כְתֵפֹת designa partes da vestimenta que passam sobre os ombros, não os ombros anatômicos. A expressão é clara e evita especificar indevidamente que sejam tiras.
- source_word: חֹבְרֹת
  choice: unidas
  rationale: O particípio de חבר descreve as peças para os ombros como ligadas às extremidades da vestimenta; “unidas” preserva a ideia básica do verbo e combina naturalmente com a construção de uma peça de roupa.
- source_word: יִהְיֶה לּוֹ
  choice: terá
  rationale: A construção existencial hebraica com ל e sufixo pronominal expressa posse; em português, “terá” é a formulação idiomática e concisa.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: suas duas extremidades
  rationale: קָצֶה indica ponta, limite ou extremidade. “Extremidades” é apropriado à descrição da vestimenta sem impor a ideia mais específica de bordas.
- source_word: וְחֻבָּר
  choice: e assim ficará unido
  rationale: O passivo de חבר indica que o colete será unido. “Assim” comunica naturalmente o possível valor resultativo da conjunção, enquanto “ficará unido” mantém a voz passiva e a repetição lexical da raiz.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Peças para os ombros” mantém a referência funcional da vestimenta sem recorrer ao tecnicismo “ombreiras”, que poderia sugerir enchimento ou proteção moderna. O antecedente implícito de “terá” e “ficará unido” é o colete sacerdotal mencionado no contexto imediato.
