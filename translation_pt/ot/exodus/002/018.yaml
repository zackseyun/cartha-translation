  text: וַ/תָּבֹ֕אנָה אֶל רְעוּאֵ֖ל אֲבִי/הֶ֑ן וַ/יֹּ֕אמֶר מַדּ֛וּעַ מִהַרְתֶּ֥ן בֹּ֖א הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: pt
  text: 'Quando elas chegaram a Reuel, pai delas, ele perguntou: “Por que vocês voltaram tão depressa hoje?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Por que vocês se apressaram em vir hoje?” O hebraico emprega o verbo “apressar-se” com “vir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Quando elas chegaram
  rationale: O wayyiqtol na terceira pessoa do feminino plural retoma as filhas e introduz a circunstância temporal de modo natural em português.
- source_word: אֶל רְעוּאֵל
  choice: a Reuel
  rationale: A preposição direcional אֶל é expressa naturalmente por “a”, e o nome רְעוּאֵל é transliterado como “Reuel”, próximo da forma hebraica.
- source_word: אֲבִיהֶן
  choice: pai delas
  rationale: A forma significa literalmente “pai delas”. Esta opção evita a possível ambiguidade de “seu pai” em português.
- source_word: וַיֹּאמֶר
  choice: ele perguntou
  rationale: Embora o verbo hebraico seja literalmente “disse”, a fala introduzida é uma pergunta direta; “perguntou” transmite naturalmente sua função no contexto.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente direto e corrente do advérbio interrogativo que pede a razão.
- source_word: מִהַרְתֶּן בֹּא
  choice: vocês voltaram tão depressa
  rationale: A construção combina o verbo “apressar-se” com o infinitivo “vir”. Como as filhas chegam de volta à casa do pai, “voltaram tão depressa” comunica o sentido contextual em português natural, sem perder a ideia de rapidez.
- source_word: הַיּוֹם
  choice: hoje
  rationale: A expressão hebraica “o dia” tem aqui o valor idiomático de “hoje”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Pai delas” foi preferido a “seu pai” para maior clareza referencial; “vocês” reproduz de modo corrente a segunda pessoa do plural dirigida às filhas.
