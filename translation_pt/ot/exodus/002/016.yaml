base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: pt
  text: O sacerdote de Midiã[a] tinha sete filhas. Elas vieram, tiraram água[b] e encheram os bebedouros para dar de beber ao rebanho de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sacerdote de Midiã”. O hebraico permite entendê-lo como o sacerdote em questão ou simplesmente como um sacerdote ligado a Midiã.'
    reason: lexical_alternative
  - marker: b
    text: “Tiraram água” traduz um verbo que indica puxar ou fazer subir água de um poço.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: O sacerdote de Midiã
  rationale: A construção hebraica apresenta o homem por sua função e associação com Midiã. O waw introduz um novo participante sem exigir um advérbio temporal em português. O artigo pode ser definido ou, segundo o contexto sintático, entendido de modo indefinido; a alternativa é preservada em nota.
- source_word: שֶׁבַע בָּנוֹת
  choice: tinha sete filhas
  rationale: A cláusula nominal possessiva hebraica, literalmente 'ao sacerdote... sete filhas', é expressa naturalmente em português com o verbo 'ter'.
- source_word: וַתָּבֹאנָה
  choice: Elas vieram
  rationale: Tradução direta da forma narrativa de בוא; o pronome retoma claramente as sete filhas.
- source_word: וַתִּדְלֶנָה
  choice: tiraram água
  rationale: דלה descreve tirar ou erguer água de um poço; o objeto implícito é explicitado para produzir português natural.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: encheram os bebedouros
  rationale: רְהָטִים designa recipientes ou canais em que os animais bebem. 'Bebedouros' comunica com clareza sua função no contexto pastoril.
- source_word: לְהַשְׁקוֹת
  choice: para dar de beber
  rationale: O infinitivo causativo de שקה significa fazer beber. 'Dar de beber' conserva esse valor com naturalidade e evita a possível leitura agrícola de 'regar'.
- source_word: צֹאן אֲבִיהֶן
  choice: o rebanho de seu pai
  rationale: צֹאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras; 'rebanho' é o equivalente português mais natural. O possessivo plural hebraico é naturalmente expresso por 'seu pai', pai comum às filhas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência narrativa foi dividida em duas frases para evitar coordenação excessiva. 'Bebedouros' e 'dar de beber' tornam explícita a cena pastoril sem acrescentar conteúdo não presente no hebraico.
