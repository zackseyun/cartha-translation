base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: pt
  text: Deus ouviu o gemido deles[a] e se lembrou da sua aliança com Abraão, com Isaque e com Jacó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o grito angustiado deles”. O substantivo hebraico pode designar um gemido ou clamor produzido pela opressão.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto de aliança, “se lembrou” não implica que Deus tivesse esquecido, mas que se voltou em fidelidade para as obrigações da sua aliança.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O verbo שׁמע, nesta forma narrativa, indica de modo mais natural que Deus recebeu auditivamente o clamor de Israel. “Escutou” seria possível, mas poderia sugerir atenção prolongada ou deliberada além do que a forma exige.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, os verbos estão no singular e o referente é o único Deus de Israel.
- source_word: נַאֲקָתָם
  choice: o gemido deles
  rationale: נַאֲקָה designa gemido ou grito angustiado sob opressão. O singular coletivo “o gemido deles” preserva o número do substantivo hebraico e soa natural em português.
- source_word: וַיִּזְכֹּר
  choice: se lembrou
  rationale: Preserva o sentido lexical direto de זכר e a linguagem antropomórfica da aliança, sem transformar na tradução a ação que o contexto subsequente implica.
- source_word: בְּרִיתוֹ
  choice: sua aliança
  rationale: בְּרִית é o termo habitual para “aliança”, e o sufixo indica que se trata da aliança de Deus.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: com Abraão, com Isaque e com Jacó
  rationale: A preposição “com”, naturalmente exigida em português depois de “aliança”, explicita a relação indicada pelo contexto. Sua repetição acompanha a ênfase e a cadência dos marcadores hebraicos.
theological_decisions:
- issue: Linguagem antropomórfica em “Deus se lembrou”
  choice: Manter “se lembrou” no texto principal, sem expansão interpretativa.
  alternative: “Deus voltou sua atenção para a sua aliança” ou “Deus agiu em fidelidade à sua aliança”.
  rationale: O hebraico emprega linguagem comum de memória no contexto da aliança. Ela aponta para a fidelidade de Deus e para a ação que seguirá, sem necessariamente implicar esquecimento anterior. Parafrasear a ação resolveria uma tensão que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a repetição de “Deus” implícita apenas na continuidade natural do sujeito em português, conserva “se lembrou” e repete “com” diante dos patriarcas para refletir a cadência hebraica.
