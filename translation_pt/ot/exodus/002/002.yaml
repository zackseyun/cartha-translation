base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: pt
  text: A mulher ficou grávida e deu à luz um filho. Quando viu que ele era bom[a], escondeu-o durante três meses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bonito” ou “belo”. O hebraico diz “bom”, palavra que, neste contexto, também pode ter o sentido de agradável ou de bela aparência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ficou grávida
  rationale: O verbo הרה indica engravidar ou conceber. “Ficou grávida” é claro e natural em português moderno, preservando a sequência narrativa.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: O hebraico diz explicitamente “a mulher”; esta tradução evita acrescentar “sua esposa” a partir do contexto.
- source_word: וַתֵּלֶד בֵּן
  choice: deu à luz um filho
  rationale: A expressão é o modo comum de descrever o parto e tem equivalente natural e digno em português.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: Quando viu que ele era bom
  rationale: A formulação temporal comunica com naturalidade o encadeamento narrativo. “Bom” mantém o sentido lexical mais direto de טוֹב e sua possível ressonância literária com Gênesis.
- source_word: וַתִּצְפְּנֵהוּ
  choice: escondeu-o
  rationale: צפן significa esconder ou ocultar. “Escondeu-o” é direto, preciso e apropriado ao registro narrativo.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: durante três meses
  rationale: Embora יֶרַח possa designar um mês lunar, “três meses” expressa corretamente o sentido no português corrente; “durante” torna explícita a duração.
theological_decisions:
- issue: Descrição do bebê pelo adjetivo טוֹב
  choice: bom
  alternative: bonito; belo
  rationale: “Bom” é o sentido lexical básico e preserva uma possível alusão à linguagem de Gênesis 1. “Bonito” ou “belo” é uma interpretação contextual antiga e legítima, mas mais específica; por isso aparece em nota, sem eliminar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é natural e digna, sem ampliar relações implícitas nem resolver a abrangência semântica de טוֹב.
