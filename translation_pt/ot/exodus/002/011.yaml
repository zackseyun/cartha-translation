base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: pt
  text: Aconteceu que, naqueles dias, quando Moisés já tinha crescido, ele foi até seus irmãos[a] e viu as cargas que suportavam. Viu um egípcio golpeando um hebreu, um dos irmãos de Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «parentes» ou «membros de seu povo», tanto aqui como no fim do versículo; o hebraico usa linguagem familiar para expressar a solidariedade de Moisés com os hebreus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Aconteceu que, naqueles dias
  rationale: Preserva a fórmula hebraica de transição narrativa em português atual, sem recorrer ao arcaico «e aconteceu que» nem acrescentar um marcador temporal ausente no original.
- source_word: וַיִּגְדַּל
  choice: depois que Moisés cresceu
  rationale: No contexto, o verbo indica que Moisés chegou à idade adulta; «cresceu» mantém a expressão simples do hebraico, e «depois que» esclarece a sequência narrativa.
- source_word: אֶל־אֶחָיו
  choice: até seus irmãos
  rationale: Mantém a linguagem familiar literal e a identificação solidária de Moisés com os hebreus, sem substituir o termo por uma explicação como «seu povo».
- source_word: בְּסִבְלֹתָם
  choice: as cargas que suportavam
  rationale: Conserva tanto a imagem concreta das cargas quanto sua referência contextual ao trabalho opressivo, sem limitar o sentido a uma única forma de sofrimento.
- source_word: אִישׁ מִצְרִי
  choice: um egípcio
  rationale: Em português, o substantivo gentílico já designa naturalmente um homem; repetir «homem» seria possível, mas menos fluente.
- source_word: מַכֶּה
  choice: golpeando
  rationale: Expressa a ação física em andamento indicada pelo particípio hebraico, sem intensificá-la necessariamente para «espancando».
- source_word: אִישׁ עִבְרִי
  choice: um hebreu
  rationale: É a forma natural em português e corresponde ao gentílico substantivado, embora o hebraico empregue literalmente «homem hebreu».
- source_word: מֵאֶחָיו
  choice: um de seus irmãos
  rationale: Preserva a repetição intencional da linguagem de parentesco e reforça a solidariedade de Moisés com o hebreu agredido.
theological_decisions:
- issue: Linguagem de parentesco em אֶחָיו / מֵאֶחָיו
  choice: irmãos
  alternative: parentes; membros de seu povo
  rationale: O masculino plural do hebraico descreve aqui os hebreus como irmãos de Moisés. A tradução mantém essa metáfora familiar e não a resolve silenciosamente como mera pertença étnica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluência brasileira. A formulação mantém a cadência narrativa, evita arcaísmos e conserva a linguagem familiar e a imagem das cargas do texto hebraico.
