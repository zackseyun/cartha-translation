review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a progressão narrativa, a maturidade de Moisés, sua ida aos «irmãos», a observação de seus fardos e a agressão de um hebreu por um egípcio. «Cargas que suportavam» é uma expansão moderada e natural de בְּסִבְלֹתָם, sem especificar indevidamente o tipo de opressão.
  naturalness: O português é moderno e fluente. Contudo, no encerramento, «um de seus irmãos» pode, por proximidade, ser entendido como irmão do egípcio, e não de Moisés. A explicitação do referente elimina essa ambiguidade não pretendida.
  terminology: «Irmãos» preserva corretamente a linguagem familiar repetida do hebraico e sua função de solidariedade. «Hebreu» e «egípcio» são termos naturais e fiéis. A nota oferece alternativas interpretativas de modo apropriado.
  issues:
  - severity: medium
    issue: Ambiguidade do possessivo em «um de seus irmãos».
    rationale: Em português, «seus» pode retomar tanto Moisés quanto o egípcio mencionado imediatamente antes. O hebraico identifica o hebreu agredido como um dos irmãos de Moisés; «um dos irmãos de Moisés» torna essa relação inequívoca sem alterar o sentido.
  - severity: low
    issue: «Depois que Moisés cresceu» é menos preciso para a anterioridade narrativa.
    rationale: וַיִּגְדַּל introduz a maturidade de Moisés como situação anterior à saída. «Quando Moisés já tinha crescido» reproduz essa relação de modo mais idiomático em português.
  revised_text: Aconteceu que, naqueles dias, quando Moisés já tinha crescido, ele foi até seus irmãos[a] e viu as cargas que suportavam. Viu um egípcio golpeando um hebreu, um dos irmãos de Moisés.
  revised_footnotes:
