  yaml_path: translation/ot/exodus/002/008.yaml
  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: pt
  text: 'A filha do faraó lhe disse: “Vá.” Então a jovem foi e chamou a mãe da criança.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: a filha do faraó
  rationale: Reproduz naturalmente em português a relação construta hebraica, sem perder a referência ao governante egípcio.
- source_word: לֵכִי
  choice: Vá
  rationale: Imperativo qal feminino singular de הלך. “Vá” conserva a brevidade e a força da ordem e é adequado ao português moderno.
- source_word: הָעַלְמָה
  choice: a jovem
  rationale: עַלְמָה designa uma jovem; “a jovem” é claro, atual e evita tanto o tom arcaico de “donzela” quanto uma especificação etária excessiva.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: chamou a mãe da criança
  rationale: קרא com objeto direto pode significar chamar ou convocar. “Chamou” preserva a simplicidade narrativa e soa natural no contexto.
- source_word: הַיָּלֶד
  choice: a criança
  rationale: יֶלֶד pode indicar criança ou menino; no contexto, “criança” é natural e não acrescenta uma especificação desnecessária à expressão.
