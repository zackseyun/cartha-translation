  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: pt
  text: 'E ele disse às suas filhas: “Então, onde está ele? Por que deixaram o homem? Chamem-no, para que coma pão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Então, onde está ele?
  rationale: A forma interrogativa pergunta pela localização do homem; “então” expressa naturalmente a reação do pai ao relato anterior.
- source_word: לָמָּה זֶּה עֲזַבְתֶּן
  choice: Por que deixaram o homem lá?
  rationale: Reproduz a censura da pergunta em português corrente. “Lá” explicita de modo idiomático a ideia contextual de tê-lo deixado no local, sem acrescentar uma ação nova.
- source_word: קִרְאֶן לוֹ
  choice: Chamem-no
  rationale: O imperativo feminino plural é dirigido às filhas e significa mandar chamá-lo ou convidá-lo a vir.
- source_word: וְיֹאכַל לָחֶם
  choice: para que coma conosco
  rationale: “Comer pão” é uma expressão comum para tomar uma refeição. “Conosco” torna explícito o convite implícito no contexto, em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento plural natural (“deixaram”, “chamem”). A formulação preserva o tom direto de surpresa e repreensão do pai.
