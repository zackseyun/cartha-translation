base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/001.yaml
  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: pt
  text: Um homem da casa de Levi foi e tomou por mulher uma filha de Levi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma mulher levita». O hebraico diz literalmente «uma filha de Levi», isto é, uma descendente de Levi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Traduz o sentido normal de הלך no wayyiqtol e preserva a sequência narrativa sem acrescentar um marcador temporal ausente no hebraico.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém a referência inicial anônima a um indivíduo do sexo masculino, sem antecipar sua condição de marido.
- source_word: מִבֵּית לֵוִי
  choice: da casa de Levi
  rationale: Preserva a expressão genealógica hebraica e seu vínculo com a linhagem de Levi; «família» seria possível, mas menos formalmente transparente.
- source_word: וַיִּקַּח
  choice: tomou por mulher
  rationale: Conserva o núcleo lexical de לקח e expressa naturalmente em português seu sentido matrimonial neste contexto, evitando a impressão de mera posse.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Marca o objeto direto definido em hebraico e não exige uma palavra correspondente em português.
- source_word: בַּת לֵוִי
  choice: uma filha de Levi
  rationale: Preserva a formulação genealógica literal e o paralelismo com «casa de Levi»; refere-se a uma descendente de Levi.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «tomou por mulher» comunica o casamento de modo natural sem abandonar a forma concreta do hebraico; a nota esclarece a expressão genealógica.
