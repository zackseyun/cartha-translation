base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: pt
  text: 'Então a irmã dele perguntou à filha do faraó: “Quer que eu vá chamar para você uma mulher que esteja amamentando, dentre as hebreias[a], para que ela amamente a criança para você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma ama de leite dentre as hebreias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... perguntou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência. Como a fala tem forma interrogativa, “perguntou” é mais natural em português do que o literal “disse”.
- source_word: אֲחֹתוֹ
  choice: a irmã dele
  rationale: Preserva o sufixo masculino singular e deixa seu referente implícito, como no hebraico, evitando a possível leitura equivocada de “sua irmã” como irmã da filha do faraó.
- source_word: בַּת פַּרְעֹה
  choice: a filha do faraó
  rationale: Reproduz de modo natural em português a relação expressa pela cadeia construta hebraica.
- source_word: הַאֵלֵךְ וְקָרָאתִי
  choice: Quer que eu vá chamar
  rationale: A interrogativa com o imperfeito na primeira pessoa expressa uma proposta ou oferta cortês. Esta formulação é atual e idiomática, sem transformar a pergunta em ordem.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: uma mulher que esteja amamentando
  rationale: Expressa claramente uma mulher com capacidade de amamentar, mantendo a forma descritiva do hebraico; “ama de leite” fica registrada como alternativa idiomática.
- source_word: מִן הָעִבְרִיֹּת
  choice: dentre as hebreias
  rationale: A preposição indica seleção a partir do grupo das mulheres hebreias. “Dentre” comunica isso de modo conciso.
- source_word: וְתֵינִק
  choice: para que ela amamente
  rationale: O hifil de ינק significa fazer mamar, isto é, amamentar. No contexto da proposta, a oração expressa naturalmente finalidade.
- source_word: הַיָּלֶד
  choice: a criança
  rationale: ילד designa aqui a criança encontrada. A escolha preserva a referência sem acrescentar uma especificação etária além do contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “para você” foi mantida porque corresponde ao duplo לָךְ do hebraico e enfatiza que a mulher cuidaria da criança em benefício da filha do faraó.
