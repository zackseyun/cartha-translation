base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: pt
  text: 'Elas disseram: “Um homem egípcio nos livrou das mãos dos pastores[a]; ele até tirou água para nós e deu de beber ao rebanho[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da mão dos pastores”, expressão que também pode significar “do poder dos pastores”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico intensifica o verbo: literalmente, algo como “tirar, tirou água para nós” ou “certamente tirou água para nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Elas disseram
  rationale: O wayyiqtol na terceira pessoa feminina plural introduz a resposta das filhas; a conjunção pode ser omitida em português para dar naturalidade ao relato.
- source_word: אִישׁ מִצְרִי
  choice: Um homem egípcio
  rationale: Preserva tanto אִישׁ, “homem”, quanto o qualificativo מִצְרִי, “egípcio”, em formulação natural.
- source_word: הִצִּילָנוּ
  choice: nos livrou
  rationale: O hifil de נצל indica retirar de perigo ou domínio. “Livrou” é claro e digno no contexto de uma intervenção física.
- source_word: מִיַּד הָרֹעִים
  choice: das mãos dos pastores
  rationale: Mantém a imagem hebraica da “mão” como poder ou domínio, ajustando o número para a expressão portuguesa idiomática “das mãos de”.
- source_word: וְגַם
  choice: ele até
  rationale: 'Expressa a adição enfática: além de livrá-las, o homem fez mais do que se esperava.'
- source_word: דָּלֹה דָלָה
  choice: tirou água
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. A ênfase é comunicada no contexto por “até”, enquanto “tirou água” é natural para retirar água de um poço.
- source_word: לָנוּ
  choice: para nós
  rationale: Conserva o dativo de benefício, indicando que ele realizou a ação em favor delas.
- source_word: וַיַּשְׁקְ
  choice: deu de beber
  rationale: O hifil de שקה significa fazer beber ou dar água. “Deu de beber” é natural e claro com rebanho como objeto.
- source_word: אֶת־הַצֹּאן
  choice: ao rebanho
  rationale: צאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” preserva essa abrangência sem especificar indevidamente a espécie.
