base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: pt
  text: Olhou de um lado para o outro e, ao ver que não havia ninguém[a], golpeou o egípcio e o escondeu na areia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não havia homem”; a expressão pode indicar genericamente que não havia pessoa alguma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: Olhou para um lado e para o outro
  rationale: Embora פנה signifique basicamente “virar-se”, a combinação com כֹּה וָכֹה descreve o ato de dirigir o olhar em direções opostas. A formulação comunica o idioma hebraico com naturalidade em português.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: ao ver que não havia ninguém
  rationale: 'אִישׁ significa literalmente “homem”, mas nesta construção pode ter sentido genérico: não havia pessoa alguma presente. “Ninguém” é a expressão mais natural em português; a forma literal é preservada em nota.'
- source_word: וַיַּךְ אֶת הַמִּצְרִי
  choice: matou o egípcio
  rationale: נכה significa fundamentalmente “golpear” ou “ferir”, mas aqui o ato é letal, como indicam a ocultação do homem na areia e Êxodo 2:14. “Matou” expressa com clareza o resultado contextual sem criar ambiguidade artificial em português.
- source_word: וַיִּטְמְנֵהוּ
  choice: o escondeu
  rationale: טמן significa “esconder” ou “ocultar”. O contexto da areia sugere cobrir o cadáver, mas “escondeu” preserva o sentido lexical sem explicitar além do texto a maneira exata.
- source_word: בַּחוֹל
  choice: na areia
  rationale: חוֹל designa “areia”; a forma definida hebraica é representada naturalmente por “na areia”.
