base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: pt
  text: Quando o faraó soube do que havia acontecido[a], procurou matar Moisés. Moisés, porém, fugiu do faraó, morou na terra de Midiã[b] e sentou-se junto ao poço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ouviu esta coisa”; também pode ser traduzido por “soube deste caso”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega duas vezes o mesmo verbo, primeiro com o sentido de morar ou permanecer em Midiã e depois com o sentido concreto de sentar-se junto ao poço.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: soube
  rationale: Neste contexto, שׁמע indica que o faraó tomou conhecimento do ocorrido. “Soube” comunica isso naturalmente em português, enquanto a nota preserva a formulação mais literal “ouviu”.
- source_word: הַדָּבָר הַזֶּה
  choice: do que havia acontecido
  rationale: דבר refere-se aqui ao caso narrado anteriormente, isto é, ao episódio envolvendo Moisés e o egípcio. A expressão portuguesa é clara sem explicitar mais do que o texto.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: procurou matar
  rationale: Preserva a construção בקשׁ + infinitivo e sua possível combinação de intenção e tentativa, sem reduzi-la apenas a desejo.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: fugiu do faraó
  rationale: Equivalente português natural para fugir da presença ou do alcance de alguém.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: foi morar na terra de Midiã
  rationale: O primeiro emprego de ישׁב indica permanência ou residência em Midiã. “Foi morar” é atual e não pressupõe necessariamente uma fixação definitiva.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: sentou-se junto ao poço
  rationale: O segundo emprego de ישׁב tem o sentido concreto de sentar-se; עַל, neste contexto, é expresso naturalmente por “junto a”.
- source_word: הַבְּאֵר
  choice: o poço
  rationale: Mantém o artigo definido do hebraico.
- source_word: פַּרְעֹה
  choice: faraó
  rationale: Forma tradicional e corrente em português para o título real egípcio.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
