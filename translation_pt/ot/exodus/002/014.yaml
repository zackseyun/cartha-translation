base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: pt
  text: 'Mas ele respondeu: “Quem nomeou você governante e juiz sobre nós? Você pretende me matar[a] como matou o egípcio?” Então Moisés ficou com medo e disse: “Sem dúvida, o caso ficou conhecido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você está dizendo que vai me matar como matou o egípcio?”'
    reason: A construção hebraica pode destacar tanto a intenção de Moisés quanto aquilo que ele estaria dizendo.
lexical_decisions:
- source_word: מִי שָׂמְךָ לְאִישׁ שַׂר וְשֹׁפֵט עָלֵינוּ
  choice: Quem nomeou você chefe e juiz sobre nós?
  rationale: שׂים, com esta construção, expressa nomeação ou estabelecimento numa função. “Nomeou” comunica naturalmente o desafio à autoridade de Moisés. אִישׁ integra a expressão appositiva e não exige a forma pouco natural “como homem, chefe e juiz” em português; שַׂר e שֹׁפֵט são vertidos pelos papéis complementares “chefe e juiz”, e עָלֵינוּ conserva a ideia de autoridade “sobre nós”.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Você pretende me matar
  rationale: A construção interrogativa com o infinitivo “matar-me” e אֹמֵר pode expressar o que Moisés diz ou pretende fazer. “Você pretende me matar” é português corrente e adequado ao desafio, sem acrescentar certeza sobre a ação.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: como matou o egípcio
  rationale: Mantém diretamente a comparação com o homicídio narrado no versículo anterior e preserva a referência definida ao egípcio.
- source_word: וַיִּירָא מֹשֶׁה
  choice: Então Moisés ficou com medo
  rationale: A forma narrativa de ירא descreve a reação de medo de Moisés; “ficou com medo” é clara e natural em português moderno.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: Sem dúvida, o caso ficou conhecido
  rationale: אָכֵן marca a conclusão enfática de Moisés. O nifal de ידע indica que o assunto veio a ser conhecido, e “o caso” transmite idiomaticamente הַדָּבָר neste contexto.
theological_decisions:
- issue: A expressão masculina לְאִישׁ diante de שַׂר וְשֹׁפֵט
  choice: chefe e juiz
  alternative: um homem, chefe e juiz
  rationale: Embora אִישׁ seja formalmente masculino, aqui ele introduz ou reforça as funções em aposição. O referente, Moisés, continua explicitamente masculino, e omitir “um homem” evita uma formulação artificial sem neutralizar pessoa alguma nem alterar o desafio à sua autoridade.
- issue: Valor de אֹמֵר na ameaça interrogativa
  choice: Você pretende me matar
  alternative: Você está dizendo que vai me matar
  rationale: O hebraico admite tensão entre fala e intenção. A tradução principal apresenta o sentido idiomático de intenção, enquanto a nota conserva a leitura mais diretamente ligada ao verbo “dizer”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “você” para a fala direta e colocação pronominal natural ao leitor brasileiro. A formulação evita literalismo áspero, mas mantém o desafio, a acusação e a percepção súbita de Moisés.
