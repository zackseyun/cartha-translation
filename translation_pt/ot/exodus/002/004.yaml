source:
  edition: WLC
  text: וַ/תֵּתַצַּ֥ב אֲחֹת֖/וֹ מֵ/רָחֹ֑ק לְ/דֵעָ֕ה מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: pt
  text: E a irmã dele ficou a certa distância[a], para saber o que seria feito com ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de longe” ou “ao longe”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “para descobrir o que aconteceria com ele”. O hebraico diz mais literalmente: “para saber o que seria feito com ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: ficou
  rationale: O hitpael de יצב indica que ela tomou ou manteve uma posição. “Ficou” é natural no contexto e, com a expressão de distância, comunica que permaneceu observando sem tornar explícita uma reflexividade pouco idiomática em português.
- source_word: אֲחֹתוֹ
  choice: a irmã dele
  rationale: Representa com precisão o substantivo com sufixo de terceira pessoa masculina singular e é claro no português moderno.
- source_word: מֵרָחֹק
  choice: a certa distância
  rationale: Expressa a separação espacial de modo idiomático. A nota preserva as alternativas mais formais “de longe” e “ao longe”.
- source_word: לְדֵעָה
  choice: para saber
  rationale: O infinitivo de ידע com ל indica finalidade. “Para saber” mantém proximidade formal com o hebraico, embora o contexto também permita “para descobrir”.
- source_word: מַה
  choice: o que
  rationale: É a forma portuguesa natural para o pronome interrogativo que introduz o conteúdo daquilo que ela queria saber.
- source_word: יֵּעָשֶׂה
  choice: seria feito
  rationale: Preserva a voz passiva do nifal imperfeito de עשה e corresponde à perspectiva futura dentro da narrativa.
- source_word: לוֹ
  choice: com ele
  rationale: Com o passivo de עשה, o hebraico pode indicar aquilo que seria feito a ele. “O que seria feito com ele” é idiomático em português e mantém a vulnerabilidade e a incerteza da situação sem especificar o resultado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem segue de perto o hebraico, enquanto “ficou a certa distância” e “feito com ele” evitam rigidez não natural. Os marcadores aparecem no texto em ordem alfabética.
