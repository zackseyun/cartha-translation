  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: pt
  text: 'Então a filha do faraó lhe disse: “Leve este menino e amamente-o para mim, e eu lhe darei o seu pagamento.” A mulher pegou o menino e o amamentou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: a filha do faraó
  rationale: Reproduz naturalmente em português a relação expressa pela cadeia construta hebraica.
- source_word: הֵילִיכִי
  choice: Leve
  rationale: O imperativo hifil de הלך funciona aqui como ordem para levar consigo a criança; “Leve” é claro, idiomático e adequado ao contexto.
- source_word: הַיֶּלֶד הַזֶּה
  choice: este menino
  rationale: יֶלֶד pode designar criança ou menino; o contexto já identifica o sexo da criança, e “menino” é natural em português.
- source_word: וְהֵינִקִהוּ לִי
  choice: e amamente-o para mim
  rationale: O verbo ינק no hifil indica dar de mamar ou amamentar; “amamente-o” expressa precisamente a ação, enquanto “para mim” preserva לִי como serviço prestado em favor da filha do faraó.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: e eu lhe darei o seu pagamento
  rationale: שָׂכָר designa remuneração por um serviço. A formulação permanece próxima da construção hebraica e soa natural em português amplo.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Mantém a designação explícita do hebraico, sem substituí-la por “a mãe”, embora sua identidade seja conhecida pelo contexto.
- source_word: וַתִּקַּח ... הַיֶּלֶד
  choice: pegou o menino
  rationale: לקח significa tomar ou pegar. Neste contexto, “pegou” descreve naturalmente a mulher recebendo a criança, sem sugerir necessariamente deslocamento.
- source_word: וַתְּנִיקֵהוּ
  choice: e o amamentou
  rationale: Mantém consistência lexical com a ordem anterior e comunica de modo atual e inequívoco que a mulher deu de mamar à criança.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais tanto para leitores brasileiros quanto internacionais. Emprega “faraó” em minúscula como título e preserva “a mulher” em vez de explicitar “a mãe”. Não se incluiu nota lexical porque “amamentar” transmite diretamente o sentido do hebraico, sem perda relevante de ambiguidade.
