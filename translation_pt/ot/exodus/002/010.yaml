  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: pt
  text: 'Quando o menino cresceu, ela o levou à filha do faraó, e ele se tornou filho dela.[a] Ela lhe deu o nome de Moisés[b], pois disse: “Eu o tirei da água.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele veio a ser um filho para ela”; possivelmente, “ele foi para ela como um filho”.'
    reason: lexical_alternative
  - marker: b
    text: O nome Moisés soa parecido com a expressão hebraica traduzida por “eu o tirei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: cresceu
  rationale: O verbo גדל indica aqui o crescimento e amadurecimento da criança, não grandeza de posição. “Cresceu” é natural e mantém a progressão narrativa.
- source_word: הַיֶּלֶד
  choice: o menino
  rationale: יֶלֶד pode significar “criança” ou “menino”. Como o sexo da criança já está claro no contexto, “menino” é natural em português sem acrescentar informação.
- source_word: וַתְּבִאֵהוּ
  choice: ela o levou
  rationale: O hifil de בוא significa normalmente “levar” ou “trazer”. Em português, do ponto de vista narrativo, “levou à filha do faraó” expressa com naturalidade o movimento indicado.
- source_word: לְבַת פַּרְעֹה
  choice: à filha do faraó
  rationale: Reproduz claramente a relação do construto hebraico e usa a forma consagrada e legível “faraó”.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: ele se tornou filho dela
  rationale: A construção apresenta uma nova relação filial real, sem especificar os procedimentos jurídicos. A formulação evita introduzir explicitamente a noção institucional de adoção, embora ela esteja implícita na narrativa.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Ela lhe deu o nome de
  rationale: A fórmula hebraica de nomeação é vertida por uma expressão portuguesa natural e digna.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação dada pela filha do faraó para o nome, preservando a relação causal do hebraico.
- source_word: מִן הַמַּיִם
  choice: da água
  rationale: Embora מַיִם tenha forma plural em hebraico, “da água” é a expressão coletiva natural em português neste contexto.
- source_word: מְשִׁיתִהוּ
  choice: Eu o tirei
  rationale: O verbo משה significa tirar ou puxar para fora. “Eu o tirei” comunica o resgate com clareza e permite explicar em nota a aproximação sonora com “Moisés”.
theological_decisions:
- issue: Natureza da relação de Moisés com a filha do faraó em וַיְהִי לָהּ לְבֵן
  choice: “ele se tornou filho dela”, indicando plena condição filial na narrativa
  alternative: “ele foi para ela como um filho”, entendendo a relação apenas por comparação
  rationale: A construção hebraica afirma que ele veio a ser filho dela, mas não descreve formalidades legais. A tradução conserva a força relacional do texto sem importar um procedimento institucional específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações acompanha de perto a narrativa hebraica, enquanto as fórmulas idiomáticas de movimento e nomeação são vertidas naturalmente. O marcador [a] foi colocado junto à afirmação sobre a condição filial, à qual sua nota de fato se refere; [b] aparece junto ao nome Moisés, onde a explicação do jogo sonoro é mais clara.
