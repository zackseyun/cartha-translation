base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: pt
  text: 'No dia seguinte, ele saiu e eis que dois homens hebreus estavam brigando. Então disse ao que estava errado[a]: “Por que você está batendo no seu companheiro[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao culpado” ou “ao perverso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu semelhante” ou “seu próximo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ele saiu
  rationale: O qal wayyiqtol de יצא dá continuidade direta à narrativa; o sujeito, Moisés, vem do contexto.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: No dia seguinte
  rationale: A expressão significa literalmente “no segundo dia”, mas, nesta sequência narrativa, o português natural expressa seu sentido temporal como “no dia seguinte”.
- source_word: וְהִנֵּה
  choice: e viu
  rationale: הִנֵּה apresenta vividamente aquilo que Moisés encontrou. Em português atual, “viu” comunica de modo natural a percepção súbita sem recorrer ao arcaizante “eis”.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: dois hebreus
  rationale: “Dois hebreus” preserva o número, o gênero masculino e a identificação étnica de forma concisa e idiomática.
- source_word: נִצִּים
  choice: brigando
  rationale: O particípio nifal descreve um conflito em andamento; “brigando” abrange a altercação e combina com o golpe mencionado em seguida.
- source_word: לָרָשָׁע
  choice: ao que estava agindo mal
  rationale: Neste contexto, רָשָׁע identifica quem estava errado na disputa. A formulação evita transformar necessariamente uma avaliação situacional em descrição permanente do caráter.
- source_word: לָמָּה תַכֶּה
  choice: Por que você está batendo
  rationale: O imperfeito após לָמָּה pode indicar a ação em curso; “está batendo” é corrente e claro em português.
- source_word: רֵעֶךָ
  choice: seu companheiro
  rationale: רֵעַ pode significar companheiro, semelhante ou próximo. “Companheiro” mantém a relação interpessoal sem introduzir indevidamente a conotação jurídica que “próximo” pode adquirir.
theological_decisions:
- issue: O alcance moral de רָשָׁע
  choice: ao que estava agindo mal
  alternative: ao perverso / ao culpado
  rationale: A tradução escolhida conserva o juízo moral presente no hebraico, mas o vincula à conduta observada nesta disputa, sem decidir que o termo descreve todo o caráter do homem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se “eis” por soar marcadamente arcaico; a vivacidade de וְהִנֵּה foi transmitida por “viu”. Todos os marcadores de nota aparecem no texto principal.
