    issue: A função de וְהִנֵּה foi alterada em «e viu».
    rationale: O hebraico não contém o verbo «ver», mas uma partícula de apresentação vívida («e eis que»). A versão atual introduz uma ação perceptiva de Moisés e atenua essa marca discursiva.
  - severity: low
    issue: «Dois hebreus» omite «homens».
    rationale: Embora o masculino plural possa designar homens, o original diz explicitamente «dois homens hebreus» (שְׁנֵי אֲנָשִׁים עִבְרִים). A tradução pode preservar essa explicitude sem perder naturalidade.
  - severity: low
    issue: «Perguntou» é menos direto que o verbo hebraico de fala.
    rationale: וַיֹּאמֶר significa «disse»; a forma interrogativa da fala já deixa claro que se trata de uma pergunta.
  revised_text: 'No dia seguinte, ele saiu e eis que dois homens hebreus estavam brigando. Então disse ao que estava errado[a]: “Por que você está batendo no seu companheiro[b]?”'
