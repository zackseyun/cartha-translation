  to: 'No dia seguinte, ele saiu e eis que dois homens hebreus estavam brigando. Então disse ao que estava errado[a]: “Por que você está batendo no seu companheiro[b]?”'
  rationale: A revisão restitui a apresentação enfática de וְהִנֵּה com «e eis que», explicita «homens» conforme אֲנָשִׁים e traduz וַיֹּאמֶר por «disse». Mantém-se a avaliação contextual de רָשָׁע em «ao que estava errado», assinalando em nota as alternativas lexicais mais fortes. Os marcadores de nota permanecem corretamente ancorados.
