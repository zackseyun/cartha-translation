source:
  edition: WLC
  text: וְ/לֹא יָכְלָ֣ה עוֹד֮ הַצְּפִינ/וֹ֒ וַ/תִּֽקַּֽח ל/וֹ֙ תֵּ֣בַת גֹּ֔מֶא וַ/תַּחְמְרָ֥/ה בַ/חֵמָ֖ר וּ/בַ/זָּ֑פֶת וַ/תָּ֤שֶׂם בָּ/הּ֙ אֶת הַ/יֶּ֔לֶד וַ/תָּ֥שֶׂם בַּ/סּ֖וּף עַל שְׂפַ֥ת הַ/יְאֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: pt
  text: Mas, quando já não podia escondê-lo, ela pegou para ele um cesto de papiro[a] e o revestiu de betume e piche. Depois, colocou o menino dentro dele e o pôs entre os juncos, à margem do Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma arca de papiro”. A palavra hebraica tevah é a mesma usada para a arca de Noé em Gênesis, preservando um eco literário de livramento através das águas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: escondê-lo
  rationale: O infinitivo no hifil de צפן com sufixo de 3ª pessoa masculina singular significa esconder ou manter oculto; “escondê-lo” é direto e natural em português.
- source_word: תֵּבַת
  choice: cesto
  rationale: תֵּבָה designa um recipiente ou caixa; neste contexto, um pequeno receptáculo para o bebê. “Cesto” comunica naturalmente a forma e a função, enquanto a ligação lexical com a arca de Noé é preservada em nota.
- source_word: גֹּמֶא
  choice: papiro
  rationale: O termo se refere especificamente à planta do papiro, adequada ao contexto egípcio, e não apenas a juncos em sentido genérico.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: o revestiu de betume
  rationale: O verbo indica cobrir ou untar, e חֵמָר é betume/asfalto; “revestiu de betume” expressa com clareza a impermeabilização.
- source_word: וּבַזָּפֶת
  choice: e piche
  rationale: זֶפֶת denota piche, material usado para vedação; a escolha mantém a distinção entre os dois materiais mencionados.
- source_word: הַיֶּלֶד
  choice: o menino
  rationale: יֶלֶד pode significar criança ou menino; como o sexo da criança está estabelecido no contexto imediato, “o menino” é natural e fiel sem acrescentar uma idade não expressa pelo termo.
- source_word: בַּסּוּף
  choice: entre os juncos
  rationale: סוּף se refere a juncos ou vegetação ribeirinha; “entre os juncos” transmite que o recipiente foi posto no meio dessa vegetação.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: à margem do Nilo
  rationale: יְאֹר, no contexto do Êxodo, designa o Nilo; a expressão portuguesa é concisa e geograficamente clara.
- source_word: לֹא יָכְלָה עוֹד
  choice: já não podia
  rationale: A combinação idiomática expressa que ela atingiu o limite de sua capacidade de continuar escondendo a criança; “já não podia” é corrente e conciso.
- source_word: לּוֹ
  choice: para ele
  rationale: O pronome dativo é mantido explicitamente, mostrando que o cesto foi preparado para a criança.
theological_decisions:
- issue: Eco literário entre o recipiente de Moisés e a arca de Noé
  choice: Traduzir תֵּבָה como “cesto” no texto e registrar “arca” em nota
  alternative: Traduzir diretamente como “arca de papiro”
  rationale: “Cesto” oferece melhor compreensão imediata do objeto neste contexto, mas a nota preserva a importante repetição do raro termo hebraico usado para a arca de Noé e, assim, não elimina o possível eco de livramento através das águas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a progressão narrativa hebraica sem soar rígida; termos concretos como “papiro”, “betume”, “piche” e “juncos” preservam a ambientação e os materiais do texto-fonte.
