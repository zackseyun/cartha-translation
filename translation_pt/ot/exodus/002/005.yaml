  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: pt
  text: Então a filha do faraó desceu para se banhar no Nilo, enquanto suas jovens acompanhantes caminhavam pela margem do rio. Ela viu o cesto[a] entre os juncos e mandou sua serva buscá-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida por “cesto” é a mesma usada para a “arca” de Noé em Gênesis 6–9.
    reason: cross_reference
  - marker: b
    text: 'Hebraico: “mandou sua serva, e ela o tomou”. Uma interpretação tradicional entende: “estendeu o braço e o tomou”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: desceu
  rationale: Preserva o sentido direcional comum de ירד e soa natural no contexto.
- source_word: בַּת פַּרְעֹה
  choice: a filha do faraó
  rationale: Reproduz naturalmente em português a construção hebraica, tratando faraó como título.
- source_word: לִרְחֹץ
  choice: para se banhar
  rationale: No contexto de descer ao Nilo, רחץ indica mais naturalmente tomar banho do que apenas lavar-se.
- source_word: עַל הַיְאֹר
  choice: no Nilo
  rationale: על tem aqui valor locativo; a formulação é idiomática em português e não sugere que ela estivesse sobre as águas.
- source_word: וְנַעֲרֹתֶיהָ
  choice: suas jovens acompanhantes
  rationale: Conserva a indicação de jovens mulheres e torna explícita, sem excessiva especificação, a função sugerida pelo contexto cortesão.
- source_word: הֹלְכֹת
  choice: caminhavam
  rationale: O imperfeito português expressa a ação contínua de fundo indicada pelo particípio hebraico.
- source_word: עַל יַד הַיְאֹר
  choice: pela margem do rio
  rationale: Traduz idiomaticamente a expressão espacial 'ao lado de' e evita repetição pesada de 'Nilo'.
- source_word: הַתֵּבָה
  choice: o cesto
  rationale: Designa com naturalidade o pequeno recipiente de Moisés, enquanto a nota preserva a ligação lexical com a arca de Noé.
- source_word: בְּתוֹךְ הַסּוּף
  choice: entre os juncos
  rationale: Expressa de modo claro e natural a localização no meio da vegetação ribeirinha.
- source_word: וַתִּשְׁלַח אֶת אֲמָתָהּ
  choice: mandou sua serva buscá-lo
  rationale: A construção favorece 'enviar a serva'; 'buscá-lo' explicita de maneira natural em português a finalidade imediata, confirmada pelo verbo seguinte.
- source_word: וַתִּקָּחֶהָ
  choice: buscá-lo
  rationale: Integra o resultado 'tomou-o/recolheu-o' à expressão idiomática portuguesa, sem mudar o referente, que é o cesto.
theological_decisions:
- issue: Tradução de תֵּבָה na narrativa de Moisés
  choice: cesto
  alternative: arca
  rationale: O objeto imediato é um pequeno recipiente entre os juncos. A tradução principal comunica a cena com clareza, e a nota mantém a ligação literária com a arca de Noé.
- issue: Leitura de אֲמָתָהּ
  choice: sua serva
  alternative: seu braço
  rationale: A vocalização massorética e a sintaxe com שלח favorecem o envio de uma serva. A leitura tradicional alternativa é genuína o bastante para ser registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Evita arcaísmos como “donzelas” e “serva”, sem apagar o gênero feminino ou a ligação lexical entre o cesto de Moisés e a arca de Noé.
