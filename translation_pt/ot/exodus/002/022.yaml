base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: pt
  text: 'Ela deu à luz um filho, e ele lhe deu o nome de Gérson[a], pois disse: “Tenho vivido como estrangeiro em terra estrangeira.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, Gérson soa como a expressão que significa “estrangeiro ali”, refletindo a explicação de Moisés para o nome.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Fui estrangeiro em terra estrangeira.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Ela deu à luz um filho
  rationale: A construção hebraica indica que ela deu à luz uma criança do sexo masculino. A formulação é natural no português atual e conserva a referência explícita ao filho.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: ele lhe deu o nome de
  rationale: Equivale de modo idiomático à fórmula hebraica literalmente traduzida por “chamou o nome dele”, mantendo claro que Moisés é quem dá o nome à criança.
- source_word: גֵּרְשֹׁם
  choice: Gérson
  rationale: Emprega a forma tradicional e reconhecível do nome de Moisés em português; a nota registra o jogo sonoro hebraico ligado à explicação do nome.
- source_word: כִּי אָמַר
  choice: pois disse
  rationale: כִּי introduz a explicação dada por Moisés para o nome. “Pois” preserva de maneira concisa essa relação explicativa.
- source_word: גֵּר
  choice: como estrangeiro
  rationale: גֵּר designa alguém que vive fora de sua terra e entre outro povo. “Como estrangeiro” comunica essa condição sem recorrer ao tom arcaico de “forasteiro” nem ao sentido moderno mais específico de “imigrante”.
- source_word: הָיִיתִי
  choice: Tenho vivido
  rationale: O perfeito hebraico descreve a experiência de Moisés até o momento em que dá o nome ao filho. A forma portuguesa expressa essa continuidade de maneira natural, sem excluir a tradução simples no passado.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: em terra estrangeira
  rationale: A expressão traduz diretamente a ideia de uma terra alheia ou estrangeira e conserva a repetição semântica entre a condição de Moisés e o lugar onde vive.
