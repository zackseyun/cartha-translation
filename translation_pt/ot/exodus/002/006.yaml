  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A tradução prioriza equivalência ótima: explicita o objeto contextual de “abriu”, conserva a vivacidade de הִנֵּה e registra em nota a ordem incomum do pronome e da aposição hebraica.'
