base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: pt
  text: 'Ela abriu a cesta e viu a criança[a], e eis[b] que um menino chorava. Ela teve compaixão dele[c] e disse: “Este é um dos filhos dos hebreus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente “viu-o, a criança”: emprega primeiro um sufixo masculino singular e depois identifica o referente como “a criança”.'
    reason: lexical_alternative
  - marker: b
    text: “Eis” traduz uma partícula hebraica que chama vividamente a atenção para o que ela viu.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “teve pena dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Ela abriu a cesta
  rationale: O verbo significa “abriu”; o objeto, omitido em hebraico, é recuperado do contexto imediato. “A cesta” torna a referência clara em português sem acrescentar uma nova ação.
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: e viu a criança
  rationale: O sufixo masculino singular de וַתִּרְאֵהוּ é esclarecido pela expressão seguinte, “a criança”. A formulação portuguesa evita uma aposição artificial, enquanto a nota registra a estrutura hebraica.
- source_word: הַיֶּלֶד
  choice: a criança
  rationale: יֶלֶד é um termo geral para criança. Esta escolha evita restringir antecipadamente o sentido antes de נַעַר, que explicita tratar-se de um menino.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama vividamente a atenção para o que ela percebeu. “E eis que” conserva essa função discursiva em registro digno e reconhecível.
- source_word: נַעַר
  choice: o menino
  rationale: Embora נַעַר possa abranger várias idades, aqui descreve o bebê Moisés e assinala seu sexo. “Menino” é natural no contexto e não sugere adolescência.
- source_word: בֹּכֶה
  choice: chorava
  rationale: O particípio expressa uma ação em curso no momento em que ela o vê. O imperfeito português transmite naturalmente esse aspecto durativo.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Ela teve compaixão dele
  rationale: חמל com עַל expressa compaixão ou piedade. A escolha preserva a reação emocional sem antecipar explicitamente a ação de poupar.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: um dos filhos dos hebreus
  rationale: 'A construção com מִן é partitiva: ele pertence ao grupo das crianças dos hebreus. “Um dos filhos dos hebreus” é clara e idiomática, mantendo a identificação étnica e o referente masculino.'
- source_word: הָעִבְרִים
  choice: os hebreus
  rationale: É a designação étnica direta do texto e sua forma tradicional permanece clara no português moderno.
- source_word: זֶה
  choice: Este é
  rationale: O demonstrativo aponta para a criança diante dela; “Este é” reproduz naturalmente essa identificação na fala direta.
theological_decisions: []
