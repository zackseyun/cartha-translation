  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: pt
  text: Moisés concordou[a] em morar com aquele homem, e ele deu a Moisés sua filha Zípora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Moisés se dispôs a morar com aquele homem.” O verbo hebraico pode expressar disposição, consentimento ou satisfação.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, deu Zípora a Moisés em casamento.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: concordou
  rationale: O verbo יאל neste contexto expressa disposição ou consentimento. “Concordou” é natural em português e se encaixa bem com o infinitivo seguinte, sem excluir a nuance de estar disposto, preservada em nota.
- source_word: לָשֶׁבֶת
  choice: em morar
  rationale: Embora ישב possa significar literalmente “sentar-se”, aqui o infinitivo indica residir ou passar a viver com alguém. “Morar” é claro, corrente e adequado ao contexto.
- source_word: אֶת הָאִישׁ
  choice: com aquele homem
  rationale: A construção com ישב e אֶת tem sentido associativo, “morar com”. “Aquele homem” mantém o substantivo comum do hebraico e identifica naturalmente a pessoa já mencionada no contexto, sem inserir um nome próprio.
- source_word: וַיִּתֵּן
  choice: deu
  rationale: נתן significa literalmente “dar”. O contexto indica entrega em casamento, mas a tradução principal conserva a formulação simples do hebraico, explicando a implicação cultural em nota.
- source_word: צִפֹּרָה
  choice: Zípora
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: בִתּוֹ
  choice: sua filha
  rationale: O sufixo possessivo se refere ao sujeito de “deu”; a expressão portuguesa reproduz diretamente essa relação.
- source_word: לְמֹשֶׁה
  choice: a Moisés
  rationale: A preposição לְ marca o destinatário. A colocação antes do objeto torna clara e natural em português a relação entre o verbo e o destinatário.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da segunda oração foi ajustada para evitar a ambiguidade de “sua filha” e soar natural, sem acrescentar ao texto principal a expressão interpretativa “em casamento”.
