  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: pt
  text: Então vieram os pastores e expulsaram as mulheres dali, mas Moisés se levantou, salvou-as[a] e deu água ao rebanho delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livrou-as”. O verbo hebraico pode indicar salvar, livrar ou resgatar; aqui se refere a Moisés libertando as mulheres da hostilidade dos pastores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ הָרֹעִים
  choice: Então vieram os pastores
  rationale: O wayyiqtol dá continuidade à narrativa, expresso naturalmente por “Então”; הָרֹעִים designa os que cuidavam dos rebanhos, portanto “pastores”.
- source_word: וַיְגָרְשׁוּם
  choice: expulsaram as mulheres dali
  rationale: גרש indica expulsar ou afugentar. O sufixo se refere às filhas mencionadas no contexto; explicitar “as mulheres” evita a ambiguidade do pronome em português e preserva a hostilidade da ação.
- source_word: וַיָּקָם
  choice: se levantou
  rationale: קום descreve Moisés levantando-se para agir; “se levantou” é corrente e mantém o caráter decidido da resposta.
- source_word: וַיּוֹשִׁעָן
  choice: salvou-as
  rationale: O hifil de ישׁע tem o sentido forte de salvar ou livrar. “Salvou-as” preserva esse valor lexical sem reduzi-lo a mera ajuda; o contexto esclarece que se trata do resgate diante da hostilidade dos pastores.
- source_word: וַיַּשְׁקְ
  choice: deu água
  rationale: שקה significa dar de beber ou água. “Deu água ao rebanho” é claro e natural em português contemporâneo.
- source_word: צֹאנָם
  choice: rebanho delas
  rationale: צאן é um coletivo para animais de pequeno porte, especialmente ovelhas e cabras. “Rebanho” mantém o sentido coletivo sem especificar indevidamente a espécie; “delas” identifica as mulheres como o referente contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “as mulheres” explicita o referente feminino antes do pronome enclítico, e “mas” expressa naturalmente o contraste entre a expulsão e a intervenção de Moisés.
