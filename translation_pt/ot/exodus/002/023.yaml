  naturalness: A divisão em duas frases é aceitável, mas «gemiam ... clamavam; e» soa menos fluente e enfraquece a progressão narrativa. A revisão conserva registro digno, moderno e de fácil leitura.
  terminology: «Filhos de Israel», «escravidão», «clamaram» e «grito de socorro» são escolhas adequadas. «Escravidão» comunica, neste contexto, o caráter opressivo de עֲבֹדָה sem apagar a repetição do original.
