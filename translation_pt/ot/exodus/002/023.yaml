- from: Aconteceu, durante aqueles muitos dias, que o rei do Egito morreu[a]. Os filhos de Israel gemiam por causa da escravidão e clamavam; e seu grito por socorro subiu até Deus por causa da escravidão.[b]
  to: Aconteceu, durante aqueles muitos dias, que o rei do Egito morreu[a]. Os filhos de Israel gemeram por causa da escravidão e clamaram, e seu grito de socorro subiu a Deus por causa da escravidão.[b]
  rationale: A revisão limita-se a ajustar o aspecto narrativo dos verbos, tornar mais direta a expressão do destino do clamor e suavizar a pontuação. Mantêm-se a formulação temporal cautelosa, a referência coletiva «filhos de Israel», a ausência de destinatário explícito para «clamaram» e a repetição enfática de «por causa da escravidão».
