base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: pt
  text: Aconteceu, durante aqueles muitos dias, que o rei do Egito morreu[a]. Os filhos de Israel gemeram por causa da escravidão e clamaram, e seu grito de socorro subiu a Deus por causa da escravidão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de muitos dias”. O hebraico diz literalmente “durante aqueles muitos dias” e indica um período prolongado.'
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Israel” refere-se coletivamente ao povo de Israel. “Escravidão” também pode ser traduzido por “trabalho forçado” ou “servidão” neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu
  rationale: Reproduz a fórmula narrativa sem recorrer ao arcaísmo «sucedeu» nem acrescentar um marcador temporal inexistente.
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: durante aqueles muitos dias
  rationale: Mantém a ideia de um período extenso; «durante» expressa em português corrente o valor da preposição hebraica sem impor a leitura mais interpretativa «depois de muitos dias».
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: o rei do Egito morreu
  rationale: Tradução direta e natural da declaração narrativa.
- source_word: וַיֵּאָנְחוּ
  choice: gemiam
  rationale: Comunica a manifestação audível de sofrimento causada pela opressão.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma do hebraico, embora a expressão designe coletivamente o povo de Israel.
- source_word: מִן הָעֲבֹדָה
  choice: por causa da escravidão
  rationale: Neste contexto, עֲבֹדָה é o trabalho compulsório e opressivo imposto aos israelitas; «escravidão» comunica essa realidade melhor que o termo neutro «trabalho».
- source_word: וַיִּזְעָקוּ
  choice: clamavam
  rationale: Expressa um forte clamor nascido da aflição, mantendo implícito o destinatário como no hebraico.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: seu grito por socorro subiu
  rationale: Distingue שַׁוְעָה como pedido de auxílio e preserva a metáfora vertical do original.
- source_word: אֶל הָאֱלֹהִים
  choice: até Deus
  rationale: Em conexão com «subiu», «até Deus» é idiomático e preserva o destino do clamor sem ampliação interpretativa.
- source_word: מִן הָעֲבֹדָה (segunda ocorrência)
  choice: por causa da escravidão
  rationale: A repetição conserva a moldura retórica e a ênfase causal do hebraico.
theological_decisions:
- issue: Sentido de עֲבֹדָה na opressão de Israel
  choice: escravidão
  alternative: trabalho; serviço; trabalho forçado
  rationale: O contexto descreve labor compulsório sob opressão egípcia. «Escravidão» evita suavizar essa condição social, sem acrescentar uma afirmação doutrinária.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A escolha conserva a expressão hebraica tradicional e sua forma masculina plural, entendida coletivamente, sem excluir as mulheres do povo.
- issue: Destinatário do primeiro clamor
  choice: não explicitado
  alternative: clamavam a Deus
  rationale: O hebraico não fornece objeto a וַיִּזְעָקוּ; somente a oração seguinte afirma que o grito por socorro subiu até Deus. A tradução preserva essa progressão e não resolve além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide a longa coordenação hebraica em duas frases sem alterar sua sequência. A repetição de «por causa da escravidão» é intencional e reproduz a ênfase do original.
