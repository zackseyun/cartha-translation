base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: pt
  text: Então Moisés subiu ao monte[a], e a nuvem cobriu o monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Moisés subiu para o monte”. A conjunção narrativa hebraica também pode ser traduzida simplesmente por “e”, e a preposição pode indicar movimento “para” o monte ou, neste contexto, subida “ao” monte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Então ... subiu
  rationale: O verbo עלה indica subir, e o waw consecutivo faz a narrativa avançar. “Então ... subiu” expressa naturalmente em português tanto a sequência quanto o movimento ascendente.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל
  choice: ao
  rationale: Com o verbo “subir” e o contexto do monte, “ao” comunica movimento em direção ao monte sem determinar além do hebraico se Moisés chegou ao topo ou apenas entrou na área elevada.
- source_word: הָהָר
  choice: o monte
  rationale: הַר pode designar monte ou montanha; “monte” é natural, digno e convencional no contexto do Sinai.
- source_word: וַיְכַס
  choice: cobriu
  rationale: כסה significa cobrir. “Cobriu” é a correspondência direta e evita a interpretação adicional sugerida por opções como “envolveu” ou “ocultou”.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: Tradução direta do substantivo definido, mantendo a descrição sóbria do texto sem explicitar uma identificação teológica não expressa neste versículo.
- source_word: אֶת
  choice: '[marcador de objeto direto não traduzido]'
  rationale: O marcador hebraico do objeto direto definido não possui equivalente lexical necessário em português; sua função é expressa pela sintaxe.
- source_word: וַ
  choice: Então / e
  rationale: O primeiro waw é vertido por “Então” para marcar a progressão narrativa; o segundo, por “e”, para coordenar as ações com fluidez natural.
theological_decisions:
- issue: Natureza da nuvem
  choice: “a nuvem”, sem qualificá-la no texto principal
  alternative: “a nuvem da glória” ou “a nuvem do SENHOR”
  rationale: Embora o contexto mais amplo associe a nuvem à presença divina, o hebraico deste versículo diz apenas “a nuvem”. A tradução preserva essa contenção e não acrescenta uma identificação teológica explícita.
- issue: Extensão da subida de Moisés
  choice: “subiu ao monte”
  alternative: “subiu para o monte” ou “subiu o monte”
  rationale: A preposição אֶל marca direção e, com עלה, pode contextualmente indicar movimento para o monte ou sobre ele. “Ao monte” mantém essa abertura sem afirmar que Moisés escalou todo o monte ou chegou ao cume.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Monte” preserva o uso bíblico corrente sem arcaísmo excessivo. A repetição de “monte” reproduz a estrutura enfática e simples do hebraico.
