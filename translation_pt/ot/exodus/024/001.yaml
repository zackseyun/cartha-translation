  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: pt
  text: 'Então ele disse a Moisés[a]: “Suba até Yahweh, você, Arão, Nadabe, Abiú e setenta dos anciãos de Israel, e prostrem-se de longe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Suba até Yahweh”. O texto conserva essa formulação, embora o falante seja aparentemente Yahweh; algumas traduções a tornam mais explícita como “Suba até mim” ou “Suba à presença de Yahweh”.'
    reason: A nota explica a construção incomum sem alterar nem resolver a ambiguidade do texto-fonte.
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: Então ele disse a Moisés
  rationale: A ordem hebraica é literalmente “E a Moisés disse”. Em português, a formulação escolhida introduz naturalmente a nova fala, preserva a progressão narrativa de וְ e explicita com “ele” o sujeito masculino singular implícito no verbo.
- source_word: עֲלֵה
  choice: Suba
  rationale: O imperativo singular de עלה indica movimento para um lugar elevado. “Suba” é natural e compatível com a subida ao monte, sem impor em português a distinção contextual entre “venha” e “vá” que o hebraico não codifica da mesma maneira.
- source_word: אֶל יְהוָה
  choice: até Yahweh
  rationale: אֶל expressa movimento em direção a alguém ou algum lugar; “até” soa natural com “subir” e mantém Yahweh como destino da aproximação. O nome divino é transliterado, preservando o nome próprio do texto hebraico.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: você, Arão, Nadabe, Abiú
  rationale: O pronome explícito אַתָּה abre enfaticamente a lista dos convocados. Os nomes seguem formas portuguesas correntes; a coordenação é mantida de modo claro e natural.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: e setenta dos anciãos de Israel
  rationale: 'A preposição מִן tem sentido partitivo: são setenta dentre os anciãos de Israel. “Setenta dos anciãos” conserva essa nuance.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: e prostrem-se
  rationale: O verbo השתחוה descreve inclinar-se profundamente ou prostrar-se em reverência. “Prostrem-se” preserva o gesto físico e sua carga reverencial sem reduzi-lo apenas ao conceito mais amplo de “adorar”.
- source_word: מֵ/רָחֹק
  choice: de longe
  rationale: A expressão assinala distância espacial. “De longe” é breve, atual e corresponde diretamente ao hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Formulação incomum em que o falante aparentemente diz “Suba até Yahweh”
  choice: Manter “até Yahweh” no texto principal
  alternative: Suba até mim; suba à presença de Yahweh
  rationale: O hebraico diz explicitamente אֶל יְהוָה. A tradução conserva essa formulação e a tensão decorrente, em vez de identificar ou reformular silenciosamente a referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no singular e o imperativo “prostrem-se” no plural para refletir a mudança do destinatário individual para todo o grupo. A pontuação deixa claro que “você” inicia a enumeração dos convocados.
