source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: pt
  text: A glória de Yahweh repousou sobre o monte Sinai, e a nuvem o cobriu durante seis dias.[a] No sétimo dia, ele chamou Moisés do meio da nuvem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a nuvem cobriu a glória”, caso o sufixo seja entendido como referência à glória de Yahweh, e não ao monte Sinai.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “de dentro da nuvem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: repousou
  rationale: Expressa a ideia de estabelecer presença ou vir a repousar sobre o monte, em linguagem natural e digna, sem o tom arcaico de alternativas como “habitou” neste contexto.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Mantém o substantivo כבוד como “glória”, aqui ligado à manifestação majestosa e perceptível da presença divina, e preserva a relação construta com o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título, preservando a distinção lexical do texto hebraico.
- source_word: עַל הַר סִינַי
  choice: sobre o monte Sinai
  rationale: É uma formulação idiomática em português para a localização indicada por עַל, mantendo claramente a imagem espacial.
- source_word: וַיְכַסֵּהוּ
  choice: o cobriu
  rationale: Toma o sufixo masculino singular como referência ao monte Sinai, a leitura contextual mais provável. A nota registra a referência alternativa à glória de Yahweh.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: Reproduz o substantivo definido que designa a nuvem teofânica já identificável no contexto do Sinai.
- source_word: שֵׁשֶׁת יָמִים
  choice: durante seis dias
  rationale: Torna explícita, de forma idiomática, a duração expressa pelo acusativo temporal hebraico.
- source_word: וַיִּקְרָא
  choice: ele chamou
  rationale: “Chamou” conserva o sentido amplo do verbo קרא; o pronome retoma Yahweh sem acrescentar a nuance mais interpretativa de “convocou”.
- source_word: אֶל מֹשֶׁה
  choice: Moisés
  rationale: Em português, o verbo “chamar” admite naturalmente objeto direto nesta construção, sem necessidade de reproduzir mecanicamente a preposição hebraica.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: Equivalente temporal direto, natural e fiel ao ordinal definido do hebraico.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: do meio da nuvem
  rationale: Preserva a imagem de uma voz proveniente do interior da nuvem; “de dentro da nuvem” é uma alternativa igualmente possível e mais coloquial.
theological_decisions:
- issue: Referente do sujeito de “ele chamou”
  choice: Yahweh
  alternative: A glória de Yahweh, entendida metonimicamente
  rationale: A sequência narrativa da teofania do Sinai indica que Yahweh é quem chama Moisés. O pronome preserva o fluxo do hebraico sem inserir uma repetição explicativa no texto.
- issue: Referente do sufixo em וַיְכַסֵּהוּ
  choice: O monte Sinai
  alternative: A glória de Yahweh
  rationale: O quadro narrativo favorece o monte como objeto coberto pela nuvem, mas a morfologia hebraica permite que o sufixo masculino singular retome כבוד, “glória”; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Evitaram-se construções arcaicas; “Yahweh” preserva o nome divino, e as ambiguidades reais do hebraico são registradas sem impor uma interpretação denominacional.
