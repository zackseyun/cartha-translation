  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: pt
  text: 'Então ele pegou o Livro da Aliança e o leu perante o povo. E eles disseram: “Faremos tudo o que Yahweh falou e ouviremos[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e obedeceremos”. O verbo hebraico pode significar “ouvir/escutar” e, no contexto da aliança, “obedecer”.'
    reason: Alternativa lexical que preserva a dupla força de שׁמע.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ele pegou
  rationale: O wayyiqtol dá prosseguimento à narrativa; “Então” expressa naturalmente a sequência, e “pegou” é corrente e concreto.
- source_word: סֵפֶר הַבְּרִית
  choice: o Livro da Aliança
  rationale: Mantém a imagem concreta de um documento escrito e reconhece que, no contexto, se trata do documento específico da aliança.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: o leu perante o povo
  rationale: Com um documento escrito como objeto, קרא significa naturalmente “ler”; “perante o povo” comunica de modo idiomático que a leitura foi pública e audível.
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: Reproduz sem intensificação indevida a introdução simples da fala coletiva.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: tudo o que Yahweh falou
  rationale: Preserva a abrangência de כֹּל אֲשֶׁר e verte דִּבֶּר de maneira natural, sem acrescentar conteúdo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: נַעֲשֶׂה
  choice: Faremos
  rationale: Mantém o sentido amplo e concreto de עשה, sem reduzi-lo antecipadamente a “obedecer”.
- source_word: וְנִשְׁמָע
  choice: e ouviremos
  rationale: Preserva o sentido auditivo de שׁמע e sua relação verbal com a leitura pública, enquanto a nota registra a extensão pactual “obedeceremos”.
theological_decisions:
- issue: Sentido da resposta pactual וְנִשְׁמָע
  choice: e ouviremos
  alternative: e obedeceremos
  rationale: שׁמע pode significar ouvir/escutar e, por extensão, obedecer. A leitura pública torna saliente o sentido auditivo, enquanto o contexto da aliança implica obediência; o texto e a nota preservam ambos sem eliminar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Perante o povo” evita o literalismo pouco natural “aos ouvidos do povo”. A forma “ouviremos” conserva deliberadamente a formulação hebraica, esclarecida por nota.
