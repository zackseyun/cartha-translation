source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: pt
  text: Moisés escreveu todas as palavras de Yahweh. Levantou-se cedo pela manhã e construiu um altar ao pé do monte[a] e doze colunas[b] para as doze tribos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “debaixo do monte”, isto é, na base ou ao pé dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pedras erguidas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: Traduz diretamente כתב. O contexto já deixa claro que as palavras foram registradas por escrito, sem necessidade de explicitar “anotou”.
- source_word: דִּבְרֵי
  choice: palavras
  rationale: Preserva o sentido lexical direto de דבר e evita restringir o referente a “mandamentos”, embora o contexto inclua estipulações da aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Levantou-se cedo pela manhã
  rationale: Expressa o sentido idiomático do hifil de שׁכם e representa explicitamente בַּבֹּקֶר.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: construiu um altar
  rationale: Equivalente português direto e natural para בנה com מִזְבֵּחַ.
- source_word: תַּחַת הָהָר
  choice: ao pé do monte
  rationale: Embora literalmente indique uma posição “debaixo do monte”, neste contexto espacial refere-se naturalmente à base ou parte inferior do monte.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: e doze colunas
  rationale: מַצֵּבָה designa uma pedra colocada em posição vertical, isto é, uma coluna ou pedra erguida. “Colunas” é conciso e natural; o plural é exigido pelo numeral, apesar da forma singular coletiva após o número no hebraico.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: para as doze tribos de Israel
  rationale: A preposição ל indica aqui correspondência ou representação; a formulação preserva essa relação sem tornar explícita mais informação do que o texto fornece.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva uma transliteração reconhecível do nome, sem substituí-lo pelo título “SENHOR”; “Javé” seria uma adaptação portuguesa possível.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com sintaxe próxima do hebraico sem rigidez artificial. Os marcadores foram associados aos termos efetivamente explicados: [a] a “ao pé do monte” e [b] a “colunas”.'
