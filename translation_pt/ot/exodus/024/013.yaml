  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: pt
  text: Então Moisés se levantou com Josué, seu auxiliar[a], e Moisés subiu ao monte de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu servo”. O termo hebraico pode designar alguém que serve acompanhando outra pessoa; aqui, provavelmente se refere a Josué como auxiliar pessoal de Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal narrativo de קום indica que Moisés se levantou para agir; a expressão é natural em português e preserva a sequência narrativa sem reduzi-la apenas à ideia de partir.
- source_word: וִיהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: מְשָׁרְתוֹ
  choice: seu auxiliar
  rationale: O termo derivado de שׁרת designa alguém que serve ou presta assistência pessoal. “Auxiliar” comunica a função de Josué sem sugerir escravidão nem conferir ao termo um sentido eclesiástico posterior.
- source_word: וַיַּעַל
  choice: subiu
  rationale: עלה descreve aqui o movimento ascendente em direção ao monte; “subiu” é direto e idiomático em português.
- source_word: הַר הָאֱלֹהִים
  choice: o monte de Deus
  rationale: A tradução conserva a formulação hebraica e sua significação sagrada sem explicitar além do texto a identificação do monte.
theological_decisions:
- issue: Relação entre Moisés e Josué em מְשָׁרְתוֹ
  choice: Josué é descrito como auxiliar pessoal de Moisés.
  alternative: “seu servo” ou “seu ministro”
  rationale: O contexto aponta para serviço e assistência pessoal. “Auxiliar” evita tanto a possível conotação de escravidão de “servo” quanto as associações eclesiásticas modernas de “ministro”, preservando em nota a alternativa lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “Moisés” foi mantida por corresponder à estrutura enfática do hebraico.
