  naturalness: «Eis o sangue da aliança» é solene, claro e natural no registro bíblico contemporâneo. «Fez uma aliança» é idiomático em português e evita a falsa impressão de que Yahweh rompeu a aliança.
  terminology: «Yahweh» corresponde ao Tetragrama, e «sangue da aliança» mantém a construção e a ressonância bíblica. Uma nota deve registrar que «fez uma aliança» traduz o idiomatismo hebraico literal «cortou uma aliança».
