  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: pt
  text: 'Então Moisés pegou o sangue e o lançou sobre o povo[a], dizendo: “Eis o sangue da aliança que Yahweh fez com vocês[b] a respeito de todas estas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aspergiu sobre o povo». O verbo hebraico significa mais literalmente «lançou» ou «arremessou», mas, em contextos sacrificiais, pode descrever a aplicação ritual do sangue.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, «cortou uma aliança com vocês», uma expressão idiomática que significa «fez uma aliança com vocês».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: Verbo narrativo comum de tomar ou pegar; “pegou” é natural e claro no português moderno.
- source_word: הַדָּם
  choice: o sangue
  rationale: Mantém o artigo definido e remete ao sangue sacrificial já mencionado no contexto.
- source_word: וַיִּזְרֹק
  choice: o lançou
  rationale: Preserva a força concreta de זרק, “lançar/arremessar”, sem restringir o gesto à interpretação ritual de aspergir.
- source_word: עַל הָעָם
  choice: sobre o povo
  rationale: Reproduz diretamente a relação espacial expressa por עַל em português natural.
- source_word: הִנֵּה
  choice: Este é
  rationale: No ato solene de apresentar e identificar o sangue, “Este é” comunica de modo idiomático a função dêitica de הִנֵּה.
- source_word: דַם הַבְּרִית
  choice: o sangue da aliança
  rationale: Mantém a construção nominal e sua importante ressonância bíblica.
- source_word: כָּרַת
  choice: fez
  rationale: O hebraico diz literalmente “cortou”, mas em português “fazer uma aliança” transmite naturalmente o sentido do idioma sem produzir uma formulação enganosa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִמָּכֶם
  choice: com vocês
  rationale: Representa a preposição e o sufixo de segunda pessoa masculina plural em português de ampla legibilidade.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: com base em todas estas palavras
  rationale: Expressa a relação da aliança com as palavras ou estipulações anteriores, preservando דְּבָרִים como “palavras” e a possível ideia de fundamento.
theological_decisions:
- issue: Expressão idiomática כָּרַת ... בְּרִית para a celebração da aliança
  choice: a aliança que Yahweh fez com vocês
  alternative: a aliança que Yahweh cortou com vocês
  rationale: “Cortar uma aliança” espelha a forma hebraica, mas não é uma expressão portuguesa corrente e pode sugerir romper a aliança. “Fez” preserva o sentido reconhecido do idioma; a literalidade é registrada em nota.
- issue: Relação expressa por עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: com base em todas estas palavras
  alternative: a respeito de todas estas palavras
  rationale: O contexto permite entender as palavras como conteúdo, estipulações ou fundamento da aliança. “Com base em” conserva a ligação normativa sem trocar “palavras” por “termos”.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome divino; sua transliteração preserva essa distinção textual e pactual.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem narrativa é fluente; “Yahweh” preserva o nome pessoal, “sangue da aliança” mantém a formulação teologicamente significativa e a nota retém a alternativa ritual de “aspergir”.
