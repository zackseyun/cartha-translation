  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: pt
  text: Somente Moisés se aproximará de Yahweh[a]. Eles, porém, não se aproximarão, e o povo não subirá com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH (יהוה), o nome divino, aqui transliterado como “Yahweh”.'
    reason: Esclarecer a forma do nome divino no texto-fonte e a opção de transliteração.
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: se aproximará
  rationale: O verbo נגשׁ indica aproximar-se ou chegar perto. O futuro em português preserva aqui a força diretiva do contexto e mantém um tom solene e natural.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְבַדּוֹ
  choice: Somente
  rationale: 'Expressa com clareza a exclusividade: Moisés, e ninguém mais, poderá aproximar-se. A posição inicial reproduz a ênfase do hebraico de modo natural em português.'
- source_word: אֶל יְהוָה
  choice: de Yahweh
  rationale: Com o verbo pronominal português 'aproximar-se', a regência natural é 'aproximar-se de'. O nome divino יְהוָה é transliterado como 'Yahweh', preservando o nome da aliança presente no texto hebraico.
- source_word: וְהֵם
  choice: Eles, porém
  rationale: O pronome remete ao grupo mencionado no contexto anterior. 'Porém' torna explícito o contraste já marcado pela estrutura hebraica sem identificar além do que o texto diz.
- source_word: לֹא יִגָּשׁוּ
  choice: não se aproximarão
  rationale: Repete a mesma tradução de נגשׁ usada na primeira oração, preservando a correspondência lexical e o contraste com Moisés.
- source_word: וְהָעָם
  choice: e o povo
  rationale: Traduz diretamente הָעָם sem acrescentar 'de Israel', expressão não explícita neste versículo.
- source_word: לֹא יַעֲלוּ
  choice: não subirá
  rationale: עלה descreve a subida ao monte. O singular concorda naturalmente com o substantivo coletivo 'o povo' em português.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Expressão preposicional direta cujo referente é Moisés.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome próprio da aliança e evita substituí-lo por um título; a nota informa a forma hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem inicial 'Somente Moisés' conserva a ênfase na exclusividade. Os futuros têm força diretiva no contexto. A repetição de 'se aproximará/não se aproximarão' preserva a repetição do verbo hebraico.
