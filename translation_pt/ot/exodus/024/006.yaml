  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: pt
  text: Moisés pegou metade do sangue e a colocou em bacias, e lançou a outra metade contra o altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “salpicou sobre o altar” ou “aspergiu sobre o altar”. Nesse contexto sacrificial, o verbo hebraico pode ser traduzido de mais de uma maneira; o texto principal procura refletir uma ação física mais vigorosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: O verbo לקח, nesta sequência narrativa, indica o ato comum de tomar ou pegar algo; “pegou” é claro e natural em português moderno.
- source_word: חֲצִי הַדָּם
  choice: metade do sangue
  rationale: A construção hebraica tem sentido partitivo, expresso diretamente por “metade do sangue”.
- source_word: וַיָּשֶׂם
  choice: colocou
  rationale: שׂים é um verbo amplo de colocação; “colocou” transmite o sentido com naturalidade e dignidade.
- source_word: בָּאַגָּנֹת
  choice: em bacias
  rationale: אַגָּנֹת designa recipientes capazes de conter líquido. “Bacias” se ajusta ao contexto sacrificial e é compreensível em português amplo.
- source_word: זָרַק
  choice: lançou contra
  rationale: Em contextos sacrificiais, זרק pode descrever o sangue sendo lançado sobre uma superfície, e não apenas uma aspersão delicada. “Lançou contra” conserva a força provável do gesto.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contra o altar
  rationale: Embora עַל frequentemente signifique “sobre”, em combinação com זרק a expressão “contra o altar” comunica com clareza que o sangue foi lançado em sua superfície.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico מֹשֶׁה.
theological_decisions:
- issue: Aplicação ritual do sangue
  choice: “lançou contra o altar”, preservando a força física possível de זָרַק
  alternative: “aspergiu sobre o altar” ou “salpicou sobre o altar”
  rationale: O contexto é o rito sacrificial da aliança, e o verbo hebraico admite uma ação mais vigorosa do que “aspergir” pode sugerir. A escolha é lexical e contextual, sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A retomada “a outra metade” evita repetição pesada sem alterar a divisão explícita do sangue. O ponto e vírgula preserva o paralelismo das duas ações.
