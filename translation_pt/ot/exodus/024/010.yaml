  text: וַ/יִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/תַ֣חַת רַגְלָ֗י/ו כְּ/מַעֲשֵׂה֙ לִבְנַ֣ת הַ/סַּפִּ֔יר וּ/כְ/עֶ֥צֶם הַ/שָּׁמַ֖יִם לָ/טֹֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: pt
  text: Eles viram o Deus de Israel, e debaixo dos seus pés havia algo semelhante a um pavimento[b] de safira[a], como o próprio céu em sua limpidez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “lápis-lazúli”; não é possível identificar com certeza a pedra chamada סַפִּיר no mundo antigo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como a obra de um pavimento de safira”, imagem de uma superfície trabalhada, semelhante a tijolos ou lajotas, debaixo dos seus pés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Eles viram
  rationale: O qal narrativo de ראה expressa diretamente percepção visual. “Viram” preserva a afirmação explícita do hebraico sem atenuá-la.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: A expressão em estado construto identifica diretamente aquele que foi visto; o artigo é natural em português.
- source_word: וְתַחַת רַגְלָיו
  choice: e debaixo dos seus pés havia
  rationale: תַּחַת significa “debaixo de, sob”. A oração hebraica não tem verbo expresso; “havia” é acrescentado para produzir uma frase natural em português, mantendo a linguagem antropomórfica.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: algo semelhante a um pavimento
  rationale: מַעֲשֶׂה denota obra ou trabalho, e לִבְנָה pode indicar tijolo ou lajota. No contexto visual de uma superfície sob os pés, “algo semelhante a um pavimento” comunica de modo natural a ideia de uma superfície trabalhada, semelhante a tijolos ou lajotas.
- source_word: הַסַּפִּיר
  choice: safira
  rationale: “Safira” conserva a identificação tradicional de סַפִּיר, enquanto a nota registra a possibilidade de lápis-lazúli.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: como o próprio céu
  rationale: עֶצֶם funciona aqui como intensificador. “O próprio céu” reproduz essa força de modo idiomático, sem traduzir literalmente “osso” ou “substância”.
- source_word: לָטֹהַר
  choice: em sua limpidez
  rationale: טֹהַר pode indicar pureza ou clareza. Neste quadro visual, “limpidez” expressa adequadamente a qualidade límpida e luminosa do céu.
theological_decisions:
- issue: Visão antropomórfica de Deus
  choice: Manter “Eles viram o Deus de Israel” e “debaixo dos seus pés” sem qualificações interpretativas.
  alternative: “Eles viram uma manifestação do Deus de Israel” ou “viram o lugar onde o Deus de Israel estava”.
  rationale: O hebraico afirma diretamente que eles viram o Deus de Israel e emprega a linguagem corporal de seus pés. A tradução preserva a tensão teológica do texto em vez de resolvê-la pela inserção de uma explicação não expressa.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com boa legibilidade no Brasil. A ordem dos marcadores foi ajustada no texto para que cada nota acompanhe o termo que de fato explica: [b] qualifica “pavimento” e [a] qualifica “safira”. Mantiveram-se a afirmação direta da visão e a linguagem antropomórfica do original.'
