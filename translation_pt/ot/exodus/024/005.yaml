revisions:
- from: Então ele enviou os jovens israelitas[a], e eles ofereceram holocaustos e sacrificaram novilhos como ofertas de comunhão[b] a Yahweh.
  to: Então ele enviou os jovens israelitas[a], e eles ofereceram holocaustos e sacrificaram a Yahweh ofertas de comunhão de touros[b].
  rationale: A revisão substitui “novilhos” por “touros”, equivalente não restritivo de פָּרִים, e ajusta a sintaxe para vincular “de touros” às “ofertas de comunhão”, como no hebraico. As notas mantêm os marcadores e alternativas lexicais pertinentes.
