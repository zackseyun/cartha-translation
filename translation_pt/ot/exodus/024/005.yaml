  - severity: low
    issue: A relação entre as ofertas de comunhão e os touros pode ser expressa mais diretamente.
    rationale: O hebraico apresenta זְבָחִים שְׁלָמִים seguido de פָּרִים, isto é, ofertas de comunhão de touros. Reordenar a frase evita tratar “touros” apenas como objeto de “sacrificaram”.
