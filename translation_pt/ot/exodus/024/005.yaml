  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: pt
  text: Então ele enviou os jovens israelitas[a], e eles ofereceram holocaustos e sacrificaram a Yahweh ofertas de comunhão de touros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os jovens dos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “ofertas pacíficas” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ele enviou
  rationale: O wayyiqtol dá continuidade à narrativa e tem Moisés como sujeito retomado do contexto; “enviou” traduz naturalmente שׁלח.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: os jovens israelitas
  rationale: נַעֲרֵי indica jovens do sexo masculino, e בְּנֵי יִשְׂרָאֵל funciona aqui naturalmente como designação do povo; a formulação evita o pouco idiomático “jovens dos filhos de Israel” sem apagar o referente masculino.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: ofereceram holocaustos
  rationale: A combinação עלה + עֹלָה é uma expressão sacrificial; “oferecer holocaustos” é corrente, clara e preserva a categoria cultual.
- source_word: וַיִּזְבְּחוּ
  choice: sacrificaram
  rationale: Em contexto cultual, זבח designa o ato de abater/oferecer um animal em sacrifício; “sacrificaram” é conciso e exato.
- source_word: זְבָחִים שְׁלָמִים
  choice: ofertas de comunhão
  rationale: שְׁלָמִים nomeia uma categoria sacrificial associada à integridade, ao bem-estar e à refeição compartilhada; “ofertas de comunhão” comunica uma dimensão central sem fingir que o termo possui equivalente único.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, conforme o texto hebraico.
- source_word: פָּרִים
  choice: novilhos
  rationale: פָּרִים designa bovinos machos usados nos sacrifícios; em português bíblico corrente, “novilhos” é natural e mais específico que o genérico “gado”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” procura representar o nome pessoal, em vez de substituí-lo por um título; “Javé” é uma forma tradicional em português, mas menos próxima da transliteração adotada.
- issue: Sentido de זְבָחִים שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo admite nuances de paz, integridade, bem-estar e participação comunitária. A escolha principal é inteligível e a nota conserva alternativas legítimas, sem reduzir a categoria a uma única interpretação teológica.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: israelitas
  alternative: filhos de Israel
  rationale: Neste constructo, a expressão identifica os membros do povo de Israel. A tradução idiomática não altera o fato de נַעֲרֵי se referir especificamente a jovens homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para deixar claro que os novilhos eram as vítimas das ofertas de comunhão. Todos os marcadores de nota aparecem no texto principal.
