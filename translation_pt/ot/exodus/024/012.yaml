  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Suba até mim, no monte, e permaneça ali. Eu lhe darei as tábuas de pedra, a lei[a] e o mandamento[b], que escrevi para instruí-los.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a instrução” ou “o ensino”. A palavra hebraica torá frequentemente designa instrução ou ensino, e não apenas legislação.
    reason: lexical_alternative
  - marker: b
    text: A expressão “a lei e o mandamento” pode indicar instruções da aliança dadas junto com as tábuas de pedra ou explicar mais precisamente o que estava escrito nelas.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Suba até mim, no monte
  rationale: O imperativo עֲלֵה com אֵלַי expressa movimento em direção a quem fala; הָהָרָה indica a subida em direção ao monte. A formulação é natural em português e situa o encontro no monte.
- source_word: וֶהְיֵה שָׁם
  choice: e permaneça ali
  rationale: Embora היה signifique literalmente “estar”, neste contexto o imperativo pede presença continuada; “permaneça” comunica isso com naturalidade.
- source_word: וְאֶתְּנָה לְךָ
  choice: Eu lhe darei
  rationale: A forma volitiva de primeira pessoa expressa aqui a intenção ou promessa divina após a ordem.
- source_word: לֻחֹת הָאֶבֶן
  choice: as tábuas de pedra
  rationale: Reproduz claramente a construção hebraica e sua referência material.
- source_word: וְהַתּוֹרָה
  choice: a lei
  rationale: No contexto da aliança no Sinai, “lei” é uma tradução reconhecível e natural, enquanto a nota preserva o sentido mais amplo de instrução ou ensino.
- source_word: וְהַמִּצְוָה
  choice: o mandamento
  rationale: Mantém o substantivo hebraico no singular sem transformá-lo em plural ou em paráfrase coletiva.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: que escrevi
  rationale: O perfeito hebraico apresenta a escrita como ação concluída; o pretérito perfeito é idiomático em português.
- source_word: לְהוֹרֹתָם
  choice: para instruí-los
  rationale: 'O infinitivo causativo de ירה expressa finalidade: ensinar ou instruir. O sufixo masculino plural refere-se ao povo de Israel.'
theological_decisions:
- issue: Relação entre “a lei e o mandamento” e “as tábuas de pedra”
  choice: 'Manter os três elementos coordenados: “as tábuas de pedra, a lei e o mandamento”.'
  alternative: Entender “a lei e o mandamento” como explicação em aposição às tábuas, ou considerar os três termos uma referência única ao Decálogo.
  rationale: A sintaxe hebraica coordena os substantivos e não determina inequivocamente se a lei e o mandamento são conteúdos das tábuas ou instruções adicionais. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lhe darei” evita repetição pesada, e “para instruí-los” explicita naturalmente a finalidade sem resolver a ambiguidade sobre o alcance dos elementos dados.
