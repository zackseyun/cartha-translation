  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: pt
  text: E a aparência da glória de Yahweh era como fogo consumidor no topo do monte, aos olhos dos filhos de Israel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fogo devorador”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os israelitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: aparência
  rationale: Designa aquilo que se mostra visivelmente. “Aparência” preserva o caráter visual da cena sem sugerir uma visão profética.
- source_word: כְּבוֹד
  choice: glória
  rationale: No contexto da presença visível e majestosa de Deus, “glória” é a tradução consagrada e semanticamente adequada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: como fogo consumidor
  rationale: A preposição כְּ marca comparação, e o particípio de אכל descreve o fogo que consome. A formulação é clara, digna e próxima do hebraico.
- source_word: בְּרֹאשׁ הָהָר
  choice: no topo do monte
  rationale: Expressa diretamente a posição na parte mais alta do monte.
- source_word: לְעֵינֵי
  choice: aos olhos de
  rationale: Conserva a imagem visual do idioma hebraico e indica que o fenômeno estava plenamente visível.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém de forma transparente o substantivo masculino plural e a designação pactual do texto hebraico; alternativas coletivas mais idiomáticas são registradas em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva sua forma transliterada e evita substituí-lo por “SENHOR”.
- issue: Designação בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A escolha conserva o gênero e a forma relacional do hebraico, sem excluir a possibilidade de uma expressão coletiva mais idiomática, indicada em nota.
- issue: Natureza da comparação com o fogo
  choice: como fogo consumidor
  alternative: como fogo devorador
  rationale: 'A partícula comparativa deve ser mantida: o texto descreve a aparência da glória de Yahweh por meio de uma comparação, sem identificá-la simplesmente com o fogo.'
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A coordenação inicial “E” reproduz o וּ hebraico. “Monte” mantém o referente contextual sem inserir explicitamente “Sinai”, que não aparece neste versículo.
