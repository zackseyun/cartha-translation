  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: pt
  text: Mas ele não estendeu a mão contra os nobres dos filhos de Israel; eles viram Deus[a] e comeram e beberam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contemplaram Deus”; o verbo pode transmitir a ideia de olhar atentamente ou contemplar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: contra
  rationale: Com שָׁלַח יָד, a preposição tem sentido direcional hostil; “contra” comunica que Deus não os feriu.
- source_word: אֲצִילֵי
  choice: nobres
  rationale: Designa homens proeminentes ou escolhidos da comunidade e preserva de modo conciso sua posição representativa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão familiar hebraica e identifica de forma transparente o povo descendente de Israel.
- source_word: שָׁלַח יָדוֹ
  choice: estendeu a mão
  rationale: Mantém a metáfora do idioma hebraico, que neste contexto indica agir em juízo ou violência.
- source_word: וַיֶּחֱזוּ
  choice: viram
  rationale: É claro e natural em português; a possível nuance de contemplação intensa é registrada em nota.
- source_word: אֶת הָאֱלֹהִים
  choice: Deus
  rationale: A expressão definida refere-se ao Deus de Israel; em português, o nome é usado naturalmente sem artigo aqui.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: e comeram e beberam
  rationale: Reproduz diretamente a sequência verbal e preserva a normalidade marcante da refeição após a visão divina.
theological_decisions:
- issue: Sujeito de “não estendeu a mão”
  choice: O sujeito implícito é Deus, expresso por “ele”.
  alternative: Manter uma construção impessoal ou deixar o sujeito sem referente explícito.
  rationale: Embora o hebraico deixe o sujeito implícito, o contexto aponta de forma coerente para Deus. O pronome esclarece a sintaxe sem acrescentar uma afirmação teológica nova.
- issue: Descrição do encontro divino
  choice: “eles viram Deus”
  alternative: “eles viram uma manifestação de Deus” ou “eles contemplaram Deus”
  rationale: O hebraico afirma diretamente que eles viram Deus. A tradução preserva essa tensão teológica, sem enfraquecê-la por meio de uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a metáfora hebraica e a declaração direta do encontro com Deus.
