    issue: «Então Moisés foi» traduz וַיָּבֹא como deslocamento para longe do ponto narrativo.
    rationale: O verbo בוא significa normalmente «vir» ou «chegar». Neste versículo, «Então Moisés veio» preserva o sentido do texto-fonte, enquanto «foi» introduz uma mudança direcional não indicada.
  - severity: low
    issue: A fórmula «respondeu a uma só voz:» absorve a oração coordenada «e disseram».
    rationale: Embora a fala direta torne o sentido compreensível, o hebraico traz explicitamente tanto «respondeu» como «disseram». Incluir «e disseram» conserva melhor a estrutura e a ênfase coletiva sem prejudicar a fluência.
