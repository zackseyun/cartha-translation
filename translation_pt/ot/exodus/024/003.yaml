  rationale: A revisão corrige «foi» para «veio», refletindo o sentido lexical de וַיָּבֹא, e explicita «e disse» para representar a sequência וַיַּעַן ... וַיֹּאמְרוּ. Também se removeu o «E» inicial da segunda oração, pois a ligação narrativa já é suficientemente expressa pela sequência em português e não há perda de sentido.
