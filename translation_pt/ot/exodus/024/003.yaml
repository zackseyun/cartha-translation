base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: pt
  text: 'Então Moisés veio e relatou ao povo todas as palavras de Yahweh e todas as ordenanças[a]. Todo o povo respondeu a uma só voz e disse: “Faremos tudo o que Yahweh falou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “decisões judiciais” ou “estatutos”. O hebraico mishpatim se refere aqui a determinações legais da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então Moisés foi
  rationale: O waw consecutivo faz a narrativa avançar. Embora בוא normalmente signifique “vir/chegar”, neste contexto o português idiomático adota o ponto de vista narrativo e expressa naturalmente o deslocamento de Moisés até o povo com “foi”.
- source_word: וַיְסַפֵּר
  choice: relatou
  rationale: O piel de ספר significa contar ou relatar. “Relatou” comunica que Moisés transmitiu detalhadamente ao povo o conteúdo recebido.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: todas as palavras de Yahweh
  rationale: Mantém דְּבָרִים como “palavras”, preservando sua repetição e a ligação verbal com a resposta do povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַמִּשְׁפָּטִים
  choice: as ordenanças
  rationale: No contexto da aliança, מִשְׁפָּטִים designa decisões, normas ou determinações legais. “Ordenanças” é claro e digno em português, enquanto a nota registra a alternativa lexical mais literal.
- source_word: וַיַּעַן כָּל הָעָם קוֹל אֶחָד
  choice: todo o povo respondeu a uma só voz
  rationale: Reproduz o sentido idiomático de uma resposta coletiva e unânime, sem enfraquecer a imagem hebraica de “uma voz”.
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: tudo o que Yahweh falou
  rationale: Em português corrente, “tudo o que” retoma naturalmente a totalidade das palavras mencionadas; “falou” preserva a referência ao ato de falar.
- source_word: נַעֲשֶׂה
  choice: faremos
  rationale: Traduz diretamente o verbo עשה, “fazer”, conservando a força do compromisso assumido sem explicitar interpretativamente “obedecer”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Natureza do compromisso expresso por נַעֲשֶׂה
  choice: faremos
  alternative: obedeceremos; cumpriremos
  rationale: “Faremos” mantém a formulação concreta e ampla do hebraico. A obediência está implicada pelo contexto, mas não é acrescentada como explicitação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “A uma só voz” conserva a imagem hebraica e soa idiomático; a fala direta foi condensada sem perder nenhum elemento semântico essencial.
