base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: pt
  text: Moisés entrou no meio da nuvem e subiu o monte.[a] E Moisés esteve no monte quarenta dias e quarenta noites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entrou na nuvem”. O hebraico enfatiza que Moisés entrou na própria nuvem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entrou
  rationale: Neste contexto, בוא descreve o movimento de Moisés para o interior da nuvem; “entrou” expressa isso com naturalidade e precisão.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: תּוֹךְ indica o interior ou meio de algo. A expressão preserva a ênfase de que Moisés entrou na própria nuvem.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: Tradução direta de עָנָן com o artigo definido, referindo-se à nuvem da presença divina já apresentada no contexto.
- source_word: וַיַּעַל
  choice: subiu
  rationale: עלה indica movimento ascendente; “subiu” é corrente e preserva essa direção sem elevar desnecessariamente o registro.
- source_word: אֶל הָהָר
  choice: o monte
  rationale: Com o verbo “subiu”, o complemento direto “o monte” é idiomático em português e comunica tanto o destino quanto a subida.
- source_word: וַיְהִי
  choice: ficou
  rationale: Aqui היה descreve a permanência de Moisés em determinado local ao longo de uma duração. “Ficou” é natural em português e não sugere mais do que o contexto temporal já explicita.
- source_word: בָּהָר
  choice: no monte
  rationale: A preposição ב com הַר indica a localização de Moisés no monte; “no monte” é a formulação portuguesa natural.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: quarenta dias e quarenta noites
  rationale: Forma portuguesa padrão e exata para a expressão hebraica de duração.
theological_decisions:
- issue: A imagem da nuvem associada à presença divina
  choice: a nuvem
  alternative: a nuvem espessa
  rationale: O hebraico usa עָנָן sem adjetivo equivalente a “espessa”. A tradução mantém a imagem teofânica da narrativa sem acrescentar uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Monte” mantém a formulação bíblica natural; “no meio da nuvem” conserva a ênfase do hebraico sem soar excessivamente formal.
