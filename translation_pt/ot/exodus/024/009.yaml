  text: וַ/יַּ֥עַל מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן נָדָב֙ וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/009.yaml
  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: pt
  text: Então Moisés subiu, com Arão, Nadabe, Abiú e setenta dos anciãos de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Então Moisés subiu
  rationale: O verbo עלה expressa movimento para cima. “Subiu” é natural em português e preserva a direção sem acrescentar “ao monte”, que está implícito no contexto, mas não aparece neste versículo.
- source_word: וְאַהֲרֹן ... נָדָב וַאֲבִיהוּא וְשִׁבְעִים
  choice: com Arão, Nadabe, Abiú e setenta
  rationale: Embora o hebraico coordene os participantes com conjunções, “com” expressa naturalmente em português que todos acompanharam Moisés na subida, evitando a impressão de uma oração incompleta.
- source_word: מִזִּקְנֵי
  choice: dos anciãos
  rationale: 'A preposição מן tem sentido partitivo: eram setenta dentre os anciãos de Israel. “Setenta dos anciãos” transmite isso de modo claro e idiomático.'
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada em português para o nome nacional, aqui qualificando os anciãos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecidas dos nomes próprios. A coordenação hebraica foi ajustada com “com” para produzir uma frase portuguesa completa e natural, sem alterar a composição do grupo.
