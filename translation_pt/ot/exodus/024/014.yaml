  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: pt
  text: 'Aos anciãos ele disse: “Esperem aqui por nós até voltarmos para vocês. Vejam, Arão e Hur estão com vocês. Quem tiver uma disputa[a] deve recorrer a eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma causa”.'
    reason: A expressão hebraica pode designar uma disputa ou um caso apresentado para decisão.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: O termo designa os líderes reconhecidos da comunidade, não apenas homens idosos; “anciãos” é a forma bíblica corrente e precisa em português.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: Esperem aqui por nós
  rationale: Embora ישׁב possa significar literalmente “sentar-se” ou “permanecer”, neste contexto a ordem é ficar no local à espera do retorno de Moisés e Josué. A formulação escolhida comunica naturalmente esse sentido.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: até voltarmos para vocês
  rationale: Expressa diretamente a oração temporal e o sentido de retorno de שוב, em português moderno e amplamente compreensível.
- source_word: וְהִנֵּה
  choice: Vejam
  rationale: Mantém a função de chamar a atenção para a presença de Arão e Hur sem recorrer ao arcaizante “eis” ou “eis que”.
- source_word: עִמָּכֶם
  choice: estão com vocês
  rationale: Representa de modo direto a presença e associação indicadas por עִם.
- source_word: מִי בַעַל דְּבָרִים
  choice: Quem tiver uma disputa
  rationale: A expressão idiomática refere-se a alguém envolvido em questão, demanda ou controvérsia de caráter judicial. “Disputa” torna claro esse contexto sem estreitar indevidamente o sentido.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: deve recorrer a eles
  rationale: O imperfeito tem força instrutiva. No contexto de levar uma controvérsia às autoridades disponíveis, “recorrer a eles” é mais natural em português do que o espacial e rígido “aproximar-se deles”.
theological_decisions:
- issue: Sujeito genérico singular na instrução judicial
  choice: Quem tiver uma disputa deve recorrer a eles
  alternative: Aquele que tiver uma disputa, que se aproxime deles
  rationale: O pronome “quem” preserva a referência singular e genérica de מִי sem introduzir gênero não explicitado pelo sentido da instrução. “Deve” comunica a força diretiva de יִגַּשׁ.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira. “Vocês” evita a formalidade regional de “vós”; “Vejam” conserva o marcador de atenção sem arcaísmo. O referente de “ele” permanece implícito como no hebraico e é identificado pelo contexto como Moisés.
