base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: pt
  text: E tornaram amarga a vida deles com trabalho pesado, com barro e tijolos e com todo tipo de trabalho no campo — todo o trabalho que lhes impunham com crueldade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com dureza”. O termo hebraico indica opressão severa e implacável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ
  choice: tornaram amarga
  rationale: Preserva a metáfora causativa de מרר e sua ligação direta com “a vida deles”, em português natural e solene.
- source_word: חַיֵּיהֶם
  choice: a vida deles
  rationale: Embora a forma hebraica seja plural, “a vida deles” é idiomático em português e expressa a experiência de vida do grupo sem perder o sentido distributivo.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: com trabalho pesado
  rationale: Traduz de modo natural עֲבֹדָה קָשָׁה, conservando tanto a ideia de labor quanto seu caráter penoso.
- source_word: בְּחֹמֶר
  choice: com argamassa
  rationale: No contexto da fabricação e construção com tijolos, “argamassa” comunica adequadamente o material designado por חֹמֶר.
- source_word: וּבִלְבֵנִים
  choice: e tijolos
  rationale: Mantém o substantivo concreto no plural, como no hebraico לְבֵנִים.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: e com todo tipo de trabalho no campo
  rationale: Expressa em português corrente a abrangência de כָל עֲבֹדָה e preserva a referência explícita ao campo.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: todo o trabalho que lhes impunham
  rationale: Reproduz de forma fluente a retomada enfática hebraica e comunica o sentido opressivo de fazer os israelitas executar o trabalho.
- source_word: בְּפָרֶךְ
  choice: com crueldade
  rationale: Comunica a severidade opressiva e implacável de פָרֶךְ; a nota preserva uma alternativa mais diretamente ligada à dureza.
