base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: pt
  text: Mas os filhos de Israel[a] foram fecundos, proliferaram[b], multiplicaram-se e tornaram-se extremamente fortes, e a terra ficou cheia deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E os filhos de Israel». A conjunção hebraica também pode ser traduzida simplesmente por «e»; «mas» destaca o contraste com o versículo anterior.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «pulularam» ou «fervilharam». O verbo hebraico evoca uma abundância numerosa, como a de seres que pululam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Mas os filhos de Israel
  rationale: Preserva a expressão familiar e nacional hebraica. «Mas» explicita o contraste narrativo com a morte da geração de José no versículo anterior; «e» também é possível e consta na nota.
- source_word: פָּרוּ
  choice: foram fecundos
  rationale: Expressa fecundidade de modo natural e digno, preservando a provável ressonância da linguagem de criação e bênção em Gênesis.
- source_word: וַיִּשְׁרְצוּ
  choice: proliferaram
  rationale: Comunica reprodução e crescimento abundantes. O verbo hebraico traz a imagem vívida de seres que pululam ou fervilham, explicitada na nota lexical.
- source_word: וַיִּרְבּוּ
  choice: multiplicaram-se
  rationale: Representa diretamente a ideia de se tornarem numerosos e mantém a sequência enfática de crescimento populacional.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: tornaram-se extremamente fortes
  rationale: Mantém o sentido central de força de עצם e traduz a intensa duplicação de מְאֹד sem reduzi-la apenas à quantidade.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: de modo que a terra ficou cheia deles
  rationale: Conserva «a terra» como sujeito da construção e apresenta naturalmente a cláusula como resultado do crescimento anterior.
theological_decisions:
- issue: Possível ressonância da criação e da bênção na linguagem de fecundidade
  choice: Conservar a sequência «foram fecundos ... multiplicaram-se» sem tornar a alusão explícita no texto principal
  alternative: Acrescentar linguagem interpretativa para destacar uma alusão à bênção de Gênesis
  rationale: A escolha lexical permite perceber a provável ressonância sem inserir no texto uma afirmação que o hebraico não formula explicitamente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível. «Filhos de Israel» preserva a forma hebraica; «foram fecundos» mantém o campo semântico de fecundidade sem soar excessivamente arcaico. A nota reúne as duas ambiguidades reais do versículo, com um único marcador no texto.
