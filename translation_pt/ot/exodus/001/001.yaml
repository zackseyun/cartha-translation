source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל הַ/בָּאִ֖ים מִצְרָ֑יְמָ/ה אֵ֣ת יַעֲקֹ֔ב אִ֥ישׁ וּ/בֵית֖/וֹ בָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: pt
  text: Estes[a] são os nomes dos filhos de Israel que foram para o Egito com Jacó; cada homem foi com sua família.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E estes são os nomes”. O hebraico começa com uma conjunção que liga Êxodo à narrativa anterior, em Gênesis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Estes
  rationale: O demonstrativo introduz a lista; a conjunção hebraica também liga a abertura de Êxodo à narrativa anterior, possibilidade registrada em nota.
- source_word: שְׁמוֹת
  choice: nomes
  rationale: Equivalente direto, que também preserva o vínculo com o título hebraico do livro.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Refere-se aqui especificamente aos filhos homens de Jacó, enumerados nos versículos seguintes; evita ampliar indevidamente para todos os descendentes.
- source_word: הַבָּאִים מִצְרָיְמָה
  choice: que foram para o Egito
  rationale: O particípio identifica historicamente o grupo, e a terminação direcional indica movimento rumo ao Egito. Em português narrativo, “foram para” é mais natural que “vieram para” quando o narrador não se situa no destino.
- source_word: אֵת יַעֲקֹב
  choice: com Jacó
  rationale: אֵת expressa acompanhamento neste contexto, não objeto direto.
- source_word: אִישׁ וּבֵיתוֹ
  choice: cada um ... com a sua família
  rationale: אִישׁ tem sentido distributivo, e בַּיִת designa aqui a unidade familiar, não apenas o edifício.
- source_word: בָּאוּ
  choice: cada um foi
  rationale: A oração final retoma o verbo de movimento depois da expressão distributiva. A repetição foi mantida de modo natural para refletir a estrutura e a ênfase do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva “filhos de Israel” por precisão referencial e mantém a retomada verbal do hebraico sem recorrer ao arcaísmo “casa” no sentido de família.
