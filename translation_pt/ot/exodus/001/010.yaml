  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: pt
  text: “Vamos, ajamos com astúcia[b] em relação a ele[a], para que não se multiplique. Caso haja guerra, ele também se junte aos nossos inimigos, lute contra nós e suba da terra[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “em relação a ele”; o pronome singular se refere coletivamente a Israel como povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “ajamos com sabedoria em relação a ele”. Neste contexto, a expressão hebraica sugere uma ação hábil e calculada.
    reason: lexical_alternative
  - marker: c
    text: Hebraico, literalmente, “subir da terra”; também pode ser traduzido por “deixar a terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Vamos
  rationale: Interjeição exortativa que convoca à ação conjunta imediata; “Vamos” é natural e preserva a força do hebraico.
- source_word: נִתְחַכְּמָה
  choice: ajamos com astúcia
  rationale: O hitpael de חכם pode indicar agir com sabedoria ou habilidade; neste contexto de política opressiva, “com astúcia” comunica melhor o cálculo estratégico sem tornar a formulação excessivamente interpretativa.
- source_word: לוֹ
  choice: em relação a ele
  rationale: Mantém o pronome singular do hebraico, cujo referente é Israel entendido coletivamente, e evita substituir de modo silencioso essa forma por um plural.
- source_word: פֶּן יִרְבֶּה
  choice: para que não se multiplique
  rationale: Expressa o resultado temido e conserva o verbo no singular, em concordância com Israel como povo coletivo.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: Se houver uma guerra
  rationale: Formulação portuguesa idiomática para a contingência introduzida pela expressão hebraica, sem converter a possibilidade em certeza temporal.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: ele poderá se juntar aos nossos inimigos
  rationale: O verbo com עַל descreve acrescentar-se ou aliar-se a um grupo; “poderá” deixa explícito o caráter temido e possível da sequência.
- source_word: וְנִלְחַם בָּנוּ
  choice: lutar contra nós
  rationale: Tradução direta e natural da ação hostil expressa pelo verbo e pela preposição.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: sair da terra
  rationale: Comunica em português corrente o provável sentido contextual, enquanto a nota preserva a imagem literal de “subir” e a possível nuance de deixar o território.
theological_decisions:
- issue: Sentido de וְעָלָה מִן הָאָרֶץ
  choice: sair da terra
  alternative: subir da terra
  rationale: A expressão pode referir-se simplesmente a deixar o país, mas o verbo עלה traz literalmente a imagem de subir. A tradução principal oferece o sentido idiomático e a nota mantém a forma e a ambiguidade do hebraico, sem decidir se o temor é fuga, êxodo ou outra saída.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conservou-se o singular coletivo (“ele”) para refletir a forma hebraica e a referência a Israel como povo. As notas registram as principais alternativas lexicais e a imagem literal da cláusula final.
