base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: pt
  text: 'Então Faraó ordenou a todo o seu povo: “Todo filho que nascer, vocês deverão lançá-lo no Nilo[a]; mas[b] toda filha vocês deverão deixar viver.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ao rio”. Em Êxodo, esse termo normalmente se refere especificamente ao Nilo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e toda filha”. Aqui, “mas” explicita o contraste presente no decreto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa a emissão de uma ordem; “ordenou” é natural e adequado ao contexto de um decreto real.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma consagrada em português para o título do soberano egípcio.
- source_word: לְכָל עַמּוֹ
  choice: a todo o seu povo
  rationale: Traduz diretamente עַם sem restringi-lo a oficiais ou soldados; no contexto, refere-se ao povo sob a autoridade do faraó.
- source_word: לֵאמֹר
  choice: introdução por dois-pontos
  rationale: O infinitivo quotativo hebraico introduz a fala direta; em português atual, os dois-pontos cumprem essa função com naturalidade, sem o pouco idiomático “dizendo”.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: Todo filho que nascer
  rationale: Preserva בֵּן como “filho” e apresenta o particípio passivo de ילד de modo claro. O texto do versículo não explicita “hebreu”, por isso essa identificação não foi acrescentada.
- source_word: הַיְאֹרָה
  choice: no Nilo
  rationale: Em Êxodo, יְאֹר designa normalmente o Nilo. A preposição “em” com verbo de movimento (“lançar no Nilo”) expressa em português o destino indicado pelo -ָה direcional.
- source_word: תַּשְׁלִיכֻהוּ
  choice: vocês deverão lançá-lo
  rationale: A forma verbal está na segunda pessoa masculina plural e traz o pronome objeto “o”. “Deverão” comunica a força da ordem, e “lançá-lo” preserva explicitamente o objeto masculino.
- source_word: וְכָל הַבַּת
  choice: mas toda filha
  rationale: Embora וְ seja literalmente “e”, aqui a coordenação estabelece forte contraste com o destino dos filhos; “mas” torna essa relação natural em português, preservando בַּת como “filha”.
- source_word: תְּחַיּוּן
  choice: vocês deverão deixar viver
  rationale: O Piel de חיה significa aqui conservar com vida ou permitir que viva. “Deixar viver” é claro e mantém o contraste com a ordem de lançar os filhos no Nilo.
theological_decisions:
- issue: Identidade dos filhos abrangidos pela ordem
  choice: Não acrescentar “hebreu” ou “dos hebreus” ao texto
  alternative: “Todo filho hebreu que nascer”
  rationale: O contexto narrativo relaciona o decreto aos israelitas, mas este versículo não contém um qualificativo étnico explícito. Acrescentá-lo resolveria uma ausência significativa do texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “vocês deverão” comunica o plural da ordem e evita o caráter regional ou excessivamente solene de “vós”. “Filho” e “filha” mantêm a formulação familiar e contundente do hebraico; “menino” e “menina” seriam alternativas contextualmente possíveis.
