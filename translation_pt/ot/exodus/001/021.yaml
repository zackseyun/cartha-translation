  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: pt
  text: E, como as parteiras temeram a Deus, ele lhes deu famílias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «fez casas para elas». Em hebraico, «casas» pode referir-se a famílias ou linhagens, e não necessariamente a edifícios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: E, porque
  rationale: A expressão introduz a circunstância causal ligada ao contexto anterior. «E, porque» preserva a ligação narrativa e soa natural em português.
- source_word: יָרְאוּ
  choice: temeram
  rationale: O verbo ירא pode expressar medo ou reverência diante de Deus. «Temeram» conserva o peso e a amplitude do idioma bíblico sem reduzir o sentido a mera veneração.
- source_word: הַמְיַלְּדֹת
  choice: as parteiras
  rationale: O particípio com artigo funciona como substantivo e retoma as mulheres já apresentadas no contexto.
- source_word: הָאֱלֹהִים
  choice: a Deus
  rationale: Embora o hebraico use o artigo, a referência é ao Deus verdadeiro; em português, a forma idiomática é «Deus», sem artigo.
- source_word: וַיַּעַשׂ
  choice: deu
  rationale: Embora עשה signifique literalmente «fazer», com בָּתִּים neste contexto pode indicar conceder ou estabelecer famílias. «Deu» comunica naturalmente a ação benéfica, enquanto a nota preserva a formulação literal.
- source_word: לָהֶם
  choice: lhes
  rationale: O sufixo pronominal masculino plural pode retomar um grupo feminino em hebraico. Pelo contexto, refere-se claramente às parteiras.
- source_word: בָּתִּים
  choice: famílias
  rationale: O plural de «casa» pode designar casas familiares, famílias ou linhagens. «Famílias» expressa o sentido contextual provável em português corrente.
theological_decisions:
- issue: Sentido de Deus fazer «casas» para as parteiras
  choice: Deus concedeu famílias às parteiras.
  alternative: Deus construiu casas para elas ou estabeleceu casas familiares para elas.
  rationale: A expressão hebraica pode referir-se ao estabelecimento de famílias ou linhagens, entendido no contexto como bênção divina. Como «casas» também admite leitura física, a alternativa literal é mantida em nota, sem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação preserva o idioma bíblico «temer a Deus» e apresenta no texto o sentido contextual provável de בָּתִּים, mantendo a tradução mais literal em nota.
