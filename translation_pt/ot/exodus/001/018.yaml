base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: pt
  text: 'Então o rei do Egito mandou chamar as parteiras e lhes perguntou: “Por que vocês fizeram isso e deixaram as crianças viver[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mantiveram os meninos vivos”. Nesse contexto, o verbo hebraico pode significar fazer viver, conservar com vida ou deixar viver; as crianças em questão são os meninos mencionados nos versículos anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: mandou chamar
  rationale: Com a preposição ל e pessoas como objeto, קרא expressa chamar ou convocar. “Mandou chamar” comunica naturalmente que o rei ordenou que as parteiras fossem trazidas à sua presença.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: o rei do Egito
  rationale: Reproduz com clareza e naturalidade a relação construta do hebraico.
- source_word: לַמְיַלְּדֹת
  choice: as parteiras
  rationale: É o equivalente preciso e corrente para o particípio feminino plural que designa mulheres que auxiliam no parto.
- source_word: וַיֹּאמֶר לָהֶן
  choice: e lhes perguntou
  rationale: Embora אמר signifique literalmente “disse”, a fala introduzida é uma pergunta direta; “perguntou” é português natural e preserva a função discursiva sem alterar o conteúdo.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente direto e idiomático do interrogativo de causa.
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: vocês fizeram isso
  rationale: O pronome “vocês” preserva o plural dirigido às parteiras; “fizeram isso” traduz naturalmente a expressão hebraica sem o peso artificial de “fizeram esta coisa”.
- source_word: וַתְּחַיֶּיןָ
  choice: deixaram ... viver
  rationale: A forma de חיה pode indicar fazer viver, conservar com vida ou permitir que viva. “Deixaram ... viver” é conciso e adequado à acusação do rei, enquanto a nota registra a alternativa lexical.
- source_word: הַיְלָדִים
  choice: as crianças
  rationale: O substantivo pode designar crianças e, no contexto imediato, refere-se especificamente aos meninos hebreus. A tradução principal mantém o sentido lexical mais amplo, e a nota explicita a leitura contextual possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mandou chamar” e “vocês fizeram isso” evitam rigidez desnecessária; a nota preserva tanto a amplitude lexical de “crianças” quanto a referência contextual aos meninos.
