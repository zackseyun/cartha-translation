  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: pt
  text: 'Então, puseram sobre ele encarregados dos trabalhos forçados, a fim de oprimi-lo com seus trabalhos pesados; e ele construiu[a] para o faraó cidades-armazém[b]: Pitom e Ramessés.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir “sobre eles”, “oprimi-los” e “eles construíram”; o hebraico emprega formas no singular para se referir coletivamente a Israel.
    reason: alternative_reading
  - marker: b
    text: Ou “cidades de armazenamento” ou “cidades de provisões”.
    reason: lexical_alternative
  - marker: c
    text: O nome também pode ser transliterado “Raamsés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: puseram
  rationale: O verbo שׂים significa aqui pôr ou estabelecer autoridades sobre alguém; “puseram” mantém a forma narrativa e é natural em português.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O sufixo hebraico é masculino singular e retoma Israel como povo coletivo. A tradução conserva essa forma, explicando-a em nota.
- source_word: שָׂרֵי מִסִּים
  choice: encarregados dos trabalhos forçados
  rationale: A expressão designa oficiais responsáveis pela corveia ou pelo recrutamento laboral. Esta formulação explicita a função sem recorrer ao termo menos corrente “feitores”.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: a fim de oprimi-lo
  rationale: No piel, ענה pode significar afligir, humilhar ou oprimir. “Oprimir” expressa com clareza o propósito coercivo no contexto.
- source_word: בְּסִבְלֹתָם
  choice: com seus trabalhos pesados
  rationale: סִבְלֹת pode indicar cargas, fardos ou trabalho penoso. “Trabalhos pesados” comunica o labor opressivo, enquanto “seus” preserva a concisão e a possível ambiguidade do sufixo plural.
- source_word: וַיִּבֶן
  choice: ele construiu
  rationale: A forma verbal é masculina singular e trata Israel coletivamente; a tradução preserva esse traço formal, com esclarecimento em nota.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: cidades-armazém
  rationale: A expressão se refere a cidades destinadas ao armazenamento de provisões ou bens. “Cidades-armazém” é conciso, compreensível e próximo do sentido hebraico.
- source_word: לְפַרְעֹה
  choice: para o faraó
  rationale: Tradução natural do título real com artigo, conforme o uso corrente em português.
- source_word: פִּתֹם
  choice: Pitom
  rationale: Transliteração portuguesa clara do nome de lugar.
- source_word: רַעַמְסֵס
  choice: Ramessés
  rationale: Forma portuguesa corrente do nome de lugar; uma transliteração mais estrita é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conservou-se o singular coletivo incomum do hebraico no texto principal, sem ocultar em nota a alternativa plural mais natural em português. Evitou-se “feitores” por ser menos transparente para muitos leitores atuais.
