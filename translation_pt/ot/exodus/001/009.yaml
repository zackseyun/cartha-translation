  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: pt
  text: 'E disse ao seu povo: “Vejam! O povo dos filhos de Israel[a] é mais numeroso e mais forte do que nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “o povo israelita”. O hebraico diz literalmente “o povo dos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; “E disse” preserva esse fluxo de modo natural e digno em português.
- source_word: אֶל עַמּוֹ
  choice: ao seu povo
  rationale: עַם designa aqui o povo de Faraó em sentido coletivo; “ao seu povo” mantém a referência sem restringi-la indevidamente à corte ou aos súditos.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: A partícula chama enfaticamente a atenção dos ouvintes. O plural concorda naturalmente com o destinatário coletivo “seu povo” e evita o arcaísmo “Eis”.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: O povo dos filhos de Israel
  rationale: Preserva a cadeia construta hebraica e a designação familiar e étnica בְּנֵי יִשְׂרָאֵל. Uma forma mais idiomática é indicada em nota.
- source_word: רַב
  choice: mais numeroso
  rationale: O adjetivo, em combinação com מִמֶּנּוּ, tem força comparativa e destaca a superioridade numérica alegada por Faraó.
- source_word: וְעָצוּם
  choice: e mais forte
  rationale: עָצוּם expressa força ou poder; “mais forte” conserva o paralelismo comparativo com “mais numeroso”.
- source_word: מִמֶּנּוּ
  choice: do que nós
  rationale: 'A preposição מן com o sufixo de primeira pessoa do plural marca a comparação: “do que nós”.'
