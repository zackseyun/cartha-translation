- from: Mas, quanto mais os oprimiam[a], mais eles se multiplicavam e mais se espalhavam. Por isso, os egípcios ficaram apavorados[b] com os filhos de Israel[c].
  to: Mas, quanto mais os oprimiam[a], mais eles se multiplicavam e mais se espalhavam; e os egípcios passaram a temer[b] os filhos de Israel[c].
