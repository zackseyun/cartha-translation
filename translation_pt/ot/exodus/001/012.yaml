  naturalness: O texto é claro e moderno. A ligação por “e” é mais natural e mais próxima da sequência narrativa do que iniciar uma nova frase com “Por isso”. “Passaram a temer” é idiomático, mantém o sentido contextual de temor e evita a intensidade excessiva de “ficaram apavorados”.
  terminology: “Oprimiam”, “se multiplicavam”, “se espalhavam” e “filhos de Israel” são escolhas aceitáveis e transparentes. A nota sobre o coletivo hebraico é útil. A nota para וַיָּקֻצוּ deve conservar tanto a possibilidade de aversão quanto a de temor intenso.
