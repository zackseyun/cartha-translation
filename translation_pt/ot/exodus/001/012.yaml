  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: pt
  text: Mas, quanto mais os oprimiam[a], mais eles se multiplicavam e mais se espalhavam; e os egípcios passaram a temer[b] os filhos de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o oprimiam” e, em seguida, “ele se multiplicava” e “ele se espalhava”, tratando Israel como um povo coletivo.
    reason: lexical_alternative
  - marker: b
    text: Ou “sentiram aversão” ou “ficaram em grande temor”. O verbo hebraico pode expressar forte temor ou repulsa.
    reason: lexical_alternative
  - marker: c
    text: Ou “os israelitas” ou “o povo de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: Mas, quanto mais... mais... e mais
  rationale: A construção correlativa expressa progressão proporcional. “Mas” explicita o contraste narrativo entre a opressão egípcia e o crescimento de Israel.
- source_word: יְעַנּוּ
  choice: oprimiam
  rationale: No piel, ענה denota afligir, humilhar ou oprimir. “Oprimiam” é natural no contexto do trabalho forçado e não restringe a ação a uma forma específica de sofrimento.
- source_word: אֹתוֹ / יִרְבֶּה / יִפְרֹץ
  choice: os / eles se multiplicavam / se espalhavam
  rationale: O hebraico emprega formas masculinas singulares para Israel como entidade coletiva. O plural em português transmite naturalmente a referência ao povo, sem alterar o sentido coletivo.
- source_word: יִרְבֶּה
  choice: se multiplicavam
  rationale: רבה descreve o aumento numérico do povo; a forma pronominal é idiomática em português e mantém a ênfase demográfica.
- source_word: יִפְרֹץ
  choice: se espalhavam
  rationale: פרץ sugere irromper, expandir-se ou alastrar-se vigorosamente. “Espalhavam” comunica a expansão do povo de maneira clara e atual.
- source_word: וַיָּקֻצוּ
  choice: ficaram apavorados
  rationale: קוץ pode indicar forte pavor ou aversão. O contexto favorece o medo diante do crescimento de Israel, enquanto a nota preserva a possibilidade de aversão.
- source_word: מִפְּנֵי
  choice: com
  rationale: Na construção com קוץ, a preposição indica a causa ou o objeto da reação. “Com” é idiomático em português depois de “apavorados”; “por causa de” é uma alternativa mais explícita.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a forma do etnônimo hebraico e continua compreensível em português. “Os israelitas” seria uma formulação mais fluente, registrada em nota.
theological_decisions:
- issue: Número gramatical de Israel como referente coletivo
  choice: 'Plural idiomático: “os... eles”'
  alternative: 'Singular coletivo: “o... ele”'
  rationale: O original trata Israel como uma unidade coletiva mediante formas singulares, mas o contexto se refere aos membros do povo. O plural português evita uma construção obscura e a nota registra a forma hebraica.
- issue: Sentido de קוץ
  choice: 'Pavor: “ficaram apavorados”'
  alternative: 'Aversão: “sentiram aversão” ou “ficaram enojados”'
  rationale: O temor causado pelo rápido crescimento de Israel se ajusta ao contexto imediato, mas o campo semântico também inclui repulsa; essa tensão lexical não é resolvida silenciosamente.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas / o povo de Israel
  rationale: A formulação escolhida conserva a expressão hebraica tradicional sem acrescentar uma interpretação denominacional; a alternativa idiomática é fornecida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “quanto mais... mais... e mais” reproduz a progressão enfática do hebraico. “Os egípcios” torna explícito o sujeito recuperado do contexto anterior, sem mudar o referente.
