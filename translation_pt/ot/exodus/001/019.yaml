base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: pt
  text: 'As parteiras disseram ao Faraó: “É que as mulheres hebreias não são como as egípcias, pois são cheias de vigor[a]; antes que a parteira chegue até elas, já deram à luz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ativas” ou “robustas”. O termo hebraico pode destacar a força e a rapidez delas no parto. Alguns o entendem mais literalmente como “semelhantes a animais”, mas esse sentido é menos claro no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: disseram
  rationale: O wayyiqtol de אמר introduz fala direta; “disseram” é a forma narrativa natural em português.
- source_word: הַמְיַלְּדֹת
  choice: as parteiras
  rationale: O particípio substantivado de ילד designa aqui as mulheres que assistem o parto; “parteiras” é preciso e corrente.
- source_word: אֶל־פַּרְעֹה
  choice: ao faraó
  rationale: אֶל indica o destinatário da fala; “faraó” é a forma portuguesa consagrada.
- source_word: כִּי
  choice: É que
  rationale: O primeiro כִּי introduz a explicação dada pelas parteiras. “É que” preserva essa função causal e soa natural como início de resposta em português.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: as mulheres hebreias não são como as egípcias
  rationale: A comparação nominal é expressa com clareza e naturalidade, mantendo o contraste entre hebreias e egípcias.
- source_word: כִּי
  choice: pois
  rationale: O segundo כִּי explica a diferença afirmada; “pois” mantém a força explicativa sem repetir a mesma construção causal.
- source_word: חָיוֹת
  choice: cheias de vigor
  rationale: No contexto, o termo provavelmente descreve vitalidade, robustez ou rapidez no parto. A expressão é idiomática e evita uma leitura pejorativa indevidamente definida.
- source_word: הֵנָּה
  choice: são
  rationale: O pronome independente feminino plural reforça o sujeito; em português, a ênfase é suficientemente transmitida pelo sujeito contextual e pela construção predicativa.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: antes que a parteira chegue até elas
  rationale: בְּטֶרֶם marca anterioridade, e o singular definido “a parteira” tem valor genérico.
- source_word: וְיָלָדוּ
  choice: já deram à luz
  rationale: A forma perfeita apresenta o parto como concluído antes da chegada da parteira; “já deram à luz” torna clara essa sequência temporal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “É que” conserva a resposta explicativa, e “cheias de vigor” mantém a ambiguidade lexical relevante sem impor a interpretação mais literal e potencialmente depreciativa.
