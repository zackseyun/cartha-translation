  text: וַ/יֵּ֥יטֶב אֱלֹהִ֖ים לַֽ/מְיַלְּדֹ֑ת וַ/יִּ֧רֶב הָ/עָ֛ם וַ/יַּֽעַצְמ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: pt
  text: Assim, Deus tratou bem as parteiras[a], e o povo se multiplicou e se tornou muito forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi bondoso com as parteiras” ou “abençoou as parteiras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: tratou bem
  rationale: O hifil de יטב com ל expressa fazer o bem a alguém ou tratá-lo bem. “Tratou bem” é natural em português e preserva o sentido benefativo sem explicitar demais como “abençoou”.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto narrativo, אֱלֹהִים se refere a Deus e rege o verbo no singular.
- source_word: לַמְיַלְּדֹת
  choice: as parteiras
  rationale: Com “tratou bem”, o objeto beneficiado é expresso naturalmente em português como objeto direto, embora o hebraico use a preposição ל.
- source_word: וַיִּרֶב
  choice: se multiplicou
  rationale: רבה descreve aqui o crescimento numérico do povo; “se multiplicou” conserva essa ideia e a linguagem recorrente do contexto de Êxodo.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém a formulação simples do hebraico sem acrescentar “de Israel”, pois o referente está claro no contexto.
- source_word: וַיַּעַצְמוּ
  choice: se tornou muito forte
  rationale: עצם indica tornar-se forte ou poderoso. A formulação é clara e atual, preservando a ideia de desenvolvimento.
- source_word: מְאֹד
  choice: muito
  rationale: מְאֹד intensifica o predicado; “muito” é seu equivalente moderno e natural neste contexto.
theological_decisions:
- issue: Se a ação de Deus deve ser traduzida como “abençoou” ou de modo mais lexicalmente neutro
  choice: Deus tratou bem as parteiras
  alternative: Deus abençoou as parteiras; Deus foi bondoso com as parteiras
  rationale: O verbo יטב comunica que Deus lhes fez bem, mas não especifica por si só a forma desse favor. “Tratou bem” preserva a amplitude do hebraico e evita antecipar a explicação do versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a sequência narrativa e evita linguagem arcaica.
