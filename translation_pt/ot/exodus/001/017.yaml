id: EXO.1.17
reference: Exodus 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: pt
  text: Mas as parteiras temeram a Deus e não fizeram como lhes havia dito o rei do Egito; pelo contrário, deixaram as crianças viver[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantiveram as crianças vivas”.'
    reason: Alternativa lexical para וַתְּחַיֶּיןָ, cuja forma causativa pode expressar tanto deixar viver quanto conservar com vida.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: temeram
  rationale: O verbo ירא expressa temor que, quando dirigido a Deus, inclui reverência. “Temeram” preserva a conhecida linguagem bíblica sem reduzi-la a mero respeito.
- source_word: הַמְיַלְּדֹת
  choice: as parteiras
  rationale: O particípio substantivado de ילד designa mulheres que auxiliam no parto; “parteiras” é o equivalente português preciso e natural.
- source_word: אֶת הָאֱלֹהִים
  choice: a Deus
  rationale: Na construção com “temer”, a expressão se refere a Deus. Embora אֱלֹהִים tenha artigo em hebraico, “a Deus” é a forma idiomática em português.
- source_word: וְלֹא עָשׂוּ
  choice: não fizeram
  rationale: Tradução direta da negação de עשׂה, mantendo a ligação natural com a oração comparativa seguinte.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: como lhes havia dito
  rationale: Embora דבר signifique literalmente “falou”, neste contexto de uma ordem “havia dito” comunica com naturalidade a ação anterior do rei.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: o rei do Egito
  rationale: Reprodução clara e idiomática da construção hebraica.
- source_word: וַתְּחַיֶּיןָ
  choice: deixaram ... viver
  rationale: A forma piel de חיה pode indicar fazer viver, conservar com vida ou deixar viver. A escolha expressa naturalmente o contraste com a ordem de matar, enquanto a nota registra a alternativa lexical.
- source_word: הַיְלָדִים
  choice: as crianças
  rationale: O substantivo é lexicalmente mais amplo que “meninos”, embora o contexto anterior mostre que estão em vista os recém-nascidos do sexo masculino. “As crianças” preserva a formulação do versículo sem apagar o contexto.
theological_decisions:
- issue: Sentido de ירא na relação das parteiras com Deus
  choice: temeram a Deus
  alternative: reverenciaram a Deus
  rationale: “Temeram” mantém tanto a força do termo hebraico quanto sua nuance reverencial, sem resolver a tensão em favor de uma ideia mais branda de mero respeito.
- issue: Identificação de אֱלֹהִים
  choice: Deus
  alternative: o Deus
  rationale: O contexto narrativo aponta para Deus como referente, e o português idiomático dispensa o artigo nessa construção, sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pelo contrário” explicita de modo natural o contraste marcado pela sequência hebraica, e a colocação pronominal “lhes havia dito” mantém fluidez sem arcaísmo. O marcador [a] foi colocado junto à expressão à qual a nota lexical se refere.
