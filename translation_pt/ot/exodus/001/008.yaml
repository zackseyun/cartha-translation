base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: pt
  text: Levantou-se um novo rei[a] sobre o Egito, que não conhecia José[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outro rei”; o adjetivo hebraico significa literalmente “novo”, mas alguns o entendem como indicação de outra dinastia ou outro regime.
    reason: lexical_alternative
  - marker: b
    text: Ou “não reconhecia José”; aqui, “conhecer” pode incluir a ideia de reconhecer ou levar alguém em conta, e não apenas a falta de informação a seu respeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O wayyiqtol de קום faz a narrativa avançar. “Levantou-se” conserva a imagem verbal hebraica e pode designar naturalmente a ascensão de um governante ao poder, sem acrescentar um marcador temporal ausente do texto.
- source_word: מֶלֶךְ
  choice: rei
  rationale: O substantivo designa especificamente um rei; “governante” seria mais amplo e menos preciso.
- source_word: חָדָשׁ
  choice: novo
  rationale: Este é o sentido lexical direto do adjetivo. A possibilidade de se tratar de outro rei, outra dinastia ou outro regime fica registrada em nota, sem ser imposta ao texto principal.
- source_word: עַל מִצְרָיִם
  choice: sobre o Egito
  rationale: Com um governante, עַל expressa autoridade sobre um território. “Sobre o Egito” preserva essa relação melhor do que o mais genérico “no Egito”.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: o qual não conhecia
  rationale: ידע significa comumente “conhecer”. No contexto, pode envolver não reconhecer ou não levar em conta José e sua importância, mas a formulação principal preserva a abertura semântica do hebraico.
- source_word: יוֹסֵף
  choice: José
  rationale: “José” é a forma portuguesa tradicional, corrente e imediatamente inteligível do nome hebraico יוֹסֵף, apropriada ao registro bíblico moderno em português.
theological_decisions:
- issue: Se a expressão deve implicar mudança de dinastia ou hostilidade política deliberada
  choice: Manter a formulação simples “um novo rei ... o qual não conhecia José”
  alternative: “outro rei/outra dinastia” e “que não reconhecia José”
  rationale: O versículo afirma apenas que surgiu um rei novo e que ele não conhecia José. Mudança dinástica e desconsideração deliberada são interpretações possíveis, mas não exigidas pelo hebraico; a tradução conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “se levantou sobre o Egito” mantém a imagem e a relação de domínio do hebraico; “o qual” evita a leitura momentaneamente ambígua que “que” poderia produzir após “Egito”. Os marcadores foram posicionados junto às expressões que explicam.
