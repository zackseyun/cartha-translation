  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: pt
  text: 'Então o rei do Egito disse às parteiras hebreias[a], uma das quais se chamava Sifrá, e a outra, Puá:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às parteiras das hebreias”. A expressão hebraica pode indicar tanto que as parteiras eram hebreias quanto que atendiam as mulheres hebreias.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então ... disse” expressa com naturalidade a sequência em português.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: o rei do Egito
  rationale: Reproduz a construção hebraica sem introduzir o título “faraó”, ausente neste versículo.
- source_word: לַמְיַלְּדֹת
  choice: às parteiras
  rationale: O particípio feminino do verbo ילד designa mulheres que auxiliam no parto; “parteiras” é o equivalente português claro e convencional.
- source_word: הָעִבְרִיֹּת
  choice: hebreias
  rationale: A leitura atributiva, “parteiras hebreias”, é natural e sintaticamente plausível, enquanto a possível leitura “parteiras das hebreias” é preservada em nota.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: uma das quais se chamava ... e a outra ...
  rationale: Formulação portuguesa idiomática que conserva a identificação distributiva das duas mulheres.
- source_word: שִׁפְרָה
  choice: Sifrá
  rationale: Transliteração adaptada à ortografia e à pronúncia naturais do português.
- source_word: פּוּעָה
  choice: Puá
  rationale: Transliteração adaptada ao português, com acento para indicar a tonicidade final.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se a ambiguidade do hebraico em nota; os nomes são aportuguesados como Sifrá e Puá. Os dois-pontos preparam a fala direta que começa no versículo seguinte.
