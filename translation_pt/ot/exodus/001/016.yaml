  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: pt
  text: 'E disse: “Quando ajudarem as mulheres hebreias a dar à luz e as virem sobre o assento de parto[a], se for um filho, matem-no; mas, se for uma filha, deixem-na viver.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sobre as duas pedras”; provavelmente uma referência a um assento usado para dar à luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: Quando ajudarem ... a dar à luz
  rationale: O Piel de ילד, dirigido às parteiras no feminino plural, descreve a assistência no parto. A formulação é natural em português e preserva o sentido obstétrico sem substituir o verbo por um título profissional.
- source_word: הָעִבְרִיּוֹת
  choice: as mulheres hebreias
  rationale: O feminino plural substantivado designa as mulheres hebreias; o contexto verbal já indica que estão em trabalho de parto.
- source_word: וּרְאִיתֶן
  choice: e as virem
  rationale: Representa diretamente a instrução sequencial e explicita o objeto feminino plural exigido naturalmente em português.
- source_word: עַל הָאָבְנָיִם
  choice: sobre o assento de parto
  rationale: No contexto do parto, a expressão provavelmente designa o assento usado para dar à luz. A tradução literal e a incerteza lexical são preservadas em nota.
- source_word: אִם בֵּן הוּא
  choice: se for um filho
  rationale: Mantém a correspondência lexical de בֵּן e o paralelismo formal com 'filha', referindo-se ao recém-nascido do sexo masculino.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: matem-no
  rationale: O Hifil de מות ordena que o menino seja morto. O imperativo direto em português reproduz com clareza a força da ordem dada às parteiras.
- source_word: וְאִם בַּת הִיא
  choice: mas, se for uma filha
  rationale: Preserva o par filho/filha, enquanto 'mas' expressa naturalmente o contraste contextual da conjunção.
- source_word: וָחָיָה
  choice: deixem-na viver
  rationale: No contexto da ordem, a forma indica que a menina deve permanecer viva ou ser poupada. 'Deixem-na viver' torna explícita essa força permissiva sem acrescentar uma justificativa.
