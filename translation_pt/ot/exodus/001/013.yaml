base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/013.yaml
  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: pt
  text: E os egípcios obrigaram os filhos de Israel[a] a trabalhar com brutalidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com crueldade”, “com dureza” ou “implacavelmente”. O hebraico indica dureza severa e esmagadora no trabalho forçado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: obrigaram ... a trabalhar
  rationale: 'O hifil de עבד tem aqui força causativa: fazer alguém servir ou trabalhar. “Obrigaram ... a trabalhar” comunica naturalmente o trabalho imposto sem reduzir o verbo, por si só, a uma formulação explícita de escravização.'
- source_word: מִצְרַיִם
  choice: os egípcios
  rationale: Embora מִצְרַיִם possa designar o Egito, neste contexto funciona como sujeito coletivo e se refere aos opressores egípcios.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma familiar e corporativa do hebraico e sua ressonância genealógica; em português bíblico atual, continua compreensível como designação do povo, não apenas de indivíduos do sexo masculino.
- source_word: בְּפָרֶךְ
  choice: com brutalidade
  rationale: A expressão indica dureza severa e esmagadora no trabalho forçado. “Com brutalidade” é corrente e forte, sem perder o valor modal da preposição בְּ.
theological_decisions:
- issue: Tradução da designação corporativa בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A opção principal conserva a forma genealógica e corporativa do texto hebraico, sem resolver essa designação simplesmente como um etnônimo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “obrigaram ... a trabalhar” torna explícita a causatividade do verbo, enquanto “com brutalidade” conserva a intensidade do termo hebraico.
