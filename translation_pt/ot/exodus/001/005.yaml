base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: pt
  text: Ao todo, os descendentes diretos de Jacó eram setenta pessoas[a]. José já estava no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «os que saíram da coxa de Jacó». É uma expressão idiomática para seus descendentes diretos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל נֶפֶשׁ
  choice: Ao todo ... eram ... pessoas
  rationale: Expressa de modo natural em português a introdução narrativa e o total indicado pelo hebraico, sem recorrer à fórmula arcaica «e aconteceu que». נֶפֶשׁ funciona aqui como termo de contagem para seres humanos, portanto «pessoas» evita o sentido antropológico indevido de «almas».
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: os descendentes diretos de Jacó
  rationale: Traduz o sentido do idioma hebraico — literalmente, os que saíram da coxa de Jacó — como referência à sua descendência física direta. A nota conserva a imagem concreta do original.
- source_word: שִׁבְעִים נָפֶשׁ
  choice: setenta pessoas
  rationale: Mantém diretamente o número cardinal e emprega «pessoas» como classificador humano natural no contexto.
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  choice: José já estava no Egito
  rationale: A oração acrescenta que José se encontrava no Egito antes da chegada da família. «Já estava» comunica essa relação temporal com naturalidade, sem transformar José em parte sintática da expressão numérica.
