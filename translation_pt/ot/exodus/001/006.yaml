  yaml_path: translation/ot/exodus/001/006.yaml
  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: pt
  text: Então José morreu, bem como todos os seus irmãos e toda aquela geração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Então ... morreu
  rationale: O wayyiqtol de מוּת faz a narrativa avançar com um acontecimento passado; “Então ... morreu” expressa com naturalidade essa progressão em português.
- source_word: יוֹסֵף
  choice: José
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְכָל אֶחָיו
  choice: bem como todos os seus irmãos
  rationale: כֹּל tem sentido coletivo, e אֶחָיו designa os irmãos de José. “Bem como” coordena naturalmente os participantes que morreram, sem alterar a abrangência de “todos”.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: e toda aquela geração
  rationale: דּוֹר refere-se à geração de pessoas daquele tempo; a repetição de כֹּל é preservada por “toda”, mantendo a abrangência enfática do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação evita a sequência menos fluida “e todos... e toda...” sem perder nenhum elemento semântico do hebraico.
