base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: pt
  text: Moisés e Arão realizaram todos estes sinais[a] diante do faraó, e Yahweh endureceu o coração do faraó[b], e ele não deixou os filhos de Israel[c] saírem da terra do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas estas maravilhas”. O termo hebraico pode designar sinais milagrosos ou maravilhas.
    reason: lexical_alternative
  - marker: b
    text: Ou “fortaleceu o coração do faraó” ou “tornou firme o coração do faraó”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os israelitas” ou “os descendentes de Israel”. Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: עָשׂוּ
  choice: realizaram
  rationale: O verbo עשה é amplo, com o sentido de fazer; diante de sinais milagrosos, “realizaram” é natural em português sem acrescentar uma ideia ausente do contexto.
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: todos estes sinais
  rationale: מוֹפֵת pode designar um sinal milagroso ou uma maravilha. “Sinais” preserva aqui a função demonstrativa dos atos, enquanto a alternativa é registrada em nota.
- source_word: לִפְנֵי פַרְעֹה
  choice: diante do faraó
  rationale: Equivalente direto e idiomático de לִפְנֵי neste contexto de atos realizados na presença do faraó.
- source_word: וַיְחַזֵּק
  choice: endureceu
  rationale: Embora חזק expresse literalmente força ou firmeza, na fórmula recorrente sobre o coração do faraó indica sua resistência obstinada; “endureceu” comunica esse sentido contextual e mantém a tensão do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לֵב פַּרְעֹה
  choice: o coração do faraó
  rationale: Reproduz de modo natural em português a relação construta hebraica.
- source_word: שִׁלַּח
  choice: não deixou ... saírem
  rationale: No contexto do êxodo, שלח descreve a recusa do faraó em liberar Israel; esta formulação é clara e idiomática, e o verbo “saírem” explicita a partida indicada pelo contexto e pela expressão seguinte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma concreta do hebraico, literalmente “filhos de Israel”, embora a expressão designe coletivamente o povo israelita.
- source_word: מֵאַרְצוֹ
  choice: da sua terra
  rationale: Representa diretamente a origem da partida e conserva o possessivo masculino do texto, cujo referente contextual é o faraó.
theological_decisions:
- issue: A ação divina sobre o coração do faraó
  choice: Yahweh endureceu o coração do faraó
  alternative: Yahweh fortaleceu o coração do faraó; Yahweh tornou firme o coração do faraó
  rationale: “Endureceu” expressa o efeito contextual de חזק na narrativa sem atenuar nem explicar a tensão entre a ação divina e a responsabilidade do faraó. As imagens lexicais mais literais são preservadas em nota.
- issue: A designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A tradução conserva a expressão masculina e genealógica do original, ao mesmo tempo que a nota esclarece seu uso coletivo.
translation_notes:
  register: Português moderno, digno e acessível, com construções naturais para leitores brasileiros e compreensão internacional. Mantém o nome divino “Yahweh”, a coordenação narrativa repetida por “e” e a formulação concreta “filhos de Israel”. Todos os marcadores aparecem no texto em ordem alfabética.
