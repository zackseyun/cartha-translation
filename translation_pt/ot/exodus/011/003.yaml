  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: pt
  text: Yahweh fez com que o povo encontrasse favor aos olhos dos egípcios[a]. Além disso, o homem Moisés[b] era muito grande na terra do Egito, aos olhos dos servos do faraó[c] e aos olhos do povo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos olhos dos egípcios”; a expressão indica que eles viam o povo com bons olhos.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “o homem Moisés”, uma formulação que dá destaque a Moisés.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por “oficiais do faraó”; o hebraico diz literalmente “servos do faraó”.
    reason: lexical_alternative
  - marker: d
    text: Aqui, “o povo” provavelmente se refere à população mais ampla do Egito, em contraste com os servos do faraó.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, seguindo a forma pessoal presente no texto hebraico.
- source_word: וַיִּתֵּן ... חֵן
  choice: fez com que ... encontrasse favor
  rationale: Expressa em português natural a construção hebraica que diz literalmente que Yahweh “deu favor” ao povo, isto é, fez com que recebesse uma disposição favorável.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém a designação não especificada do hebraico; no contexto, refere-se ao povo de Israel, sem inserir explicitamente “israelitas” no texto.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: aos olhos dos egípcios
  rationale: Preserva a imagem do idioma hebraico e comunica de modo claro a avaliação ou atitude favorável dos egípcios.
- source_word: גַּם
  choice: Além disso
  rationale: Reproduz a função aditiva e enfática da partícula ao introduzir a afirmação sobre Moisés.
- source_word: הָאִישׁ מֹשֶׁה
  choice: Moisés
  rationale: O português corrente não emprega naturalmente “o homem Moisés”; o nome é usado no texto principal, e a formulação marcada do hebraico é preservada em nota.
- source_word: גָּדוֹל מְאֹד
  choice: muito importante
  rationale: No contexto, descreve a elevada posição, influência ou reputação de Moisés, não seu tamanho físico. A escolha é natural em português, embora mantenha aberta a natureza precisa de sua grandeza.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Conserva a expressão geográfica completa do hebraico.
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: aos olhos dos servos do faraó
  rationale: Mantém tanto o idioma “aos olhos de” quanto o sentido lexical direto de עֲבָדִים; no ambiente da corte, esses servos também podem ser entendidos como oficiais.
- source_word: וּבְעֵינֵי הָעָם
  choice: e aos olhos do povo
  rationale: Preserva a formulação não especificada do hebraico, sem decidir no texto principal se a referência é à população egípcia em geral.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” preserva o nome pessoal no texto e segue a orientação do projeto sem acrescentar uma interpretação doutrinária.
- issue: Natureza da grandeza de Moisés
  choice: muito importante
  alternative: muito grande
  rationale: A expressão hebraica é ampla, mas neste contexto social descreve destaque ou posição. “Muito importante” evita a leitura física que “muito grande” poderia sugerir em português, sem especificar se o destaque consistia em poder, prestígio ou estima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva “Yahweh”, “terra do Egito” e o idioma “aos olhos de”, mas evita o pouco natural “o homem Moisés” e a possível leitura física de “muito grande”. As notas registram as formas mais literais e a ambiguidade da referência final a “o povo”.
