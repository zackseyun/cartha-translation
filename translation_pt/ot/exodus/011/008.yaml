translation_notes:
  register: Português atual, digno e de leitura clara. Conserva-se a segunda pessoa (“teus”, “tu”, “te”) para manter a força do discurso direto e evitar a ambiguidade possessiva de “seus”. As notas foram colocadas junto às expressões que efetivamente explicam.
