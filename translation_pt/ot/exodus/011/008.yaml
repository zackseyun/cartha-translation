    issue: Aspas e delimitação da fala direta inconsistentes.
    rationale: No hebraico, «Sai, tu ...; e depois disso sairei» integra a fala introduzida por לֵאמֹר. No rascunho, a aspa é fechada após «segue», mas há outra aspa de fechamento após «sairei». A fala deve permanecer entre as mesmas aspas, com pontuação interna apropriada.
