base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: pt
  text: 'Então todos estes teus servos[a] descerão até mim e se curvarão diante de mim, dizendo: “Sai, tu e todo o povo que te segue[b]; depois disso, eu sairei.” Então ele saiu da presença do faraó ardendo de ira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teus oficiais”; neste contexto, o termo hebraico pode designar os servidores ou oficiais da corte do faraó.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que está aos teus pés”, expressão que indica aqueles que acompanham ou seguem alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: descerão até mim
  rationale: Preserva a imagem direcional de ירד e expressa naturalmente o movimento em direção a Moisés.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: עבד pode designar servos, súditos ou oficiais da corte. “Servos” mantém a amplitude do termo, enquanto a nota registra a alternativa contextual.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: se curvarão diante de mim
  rationale: Comunica o gesto físico de prostração ou reverência no contexto da corte, sem sugerir necessariamente adoração.
- source_word: צֵא אַתָּה
  choice: Sai, tu
  rationale: Mantém o imperativo de יצא e o pronome enfático אַתָּה, além de conservar a linguagem recorrente da saída no relato do êxodo.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: e todo o povo que te segue
  rationale: Traduz de modo claro o sentido idiomático da expressão literalmente relacionada aos pés, sem impor a ideia de sujeição.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: Depois disso, eu sairei
  rationale: Reproduz a sequência temporal e mantém a correspondência lexical de יצא com “sair”.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Então ele saiu da presença do faraó
  rationale: Mantém o sujeito implícito como no hebraico e representa מֵעִם por “da presença de”, apropriado à cena de audiência.
- source_word: בָּחֳרִי אָף
  choice: ardendo de ira
  rationale: Expressa de maneira idiomática e intensa a metáfora hebraica do calor da ira.
