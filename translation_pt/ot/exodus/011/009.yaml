  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: pt
  text: 'E Yahweh disse[c] a Moisés: “O faraó não dará ouvidos a vocês[a], para que os meus prodígios se multipliquem[b] na terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não ouvirá vocês” ou “não dará atenção a vocês”.
    reason: lexical_alternative
  - marker: b
    text: Ou “meus sinais”. O termo hebraico pode designar prodígios, sinais ou portentos.
    reason: lexical_alternative
  - marker: c
    text: Algumas traduções trazem “Yahweh tinha dito a Moisés”, relacionando esta declaração à narrativa anterior; a forma verbal hebraica em si é o passado narrativo padrão.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol é a forma narrativa comum e aqui se traduz naturalmente pelo pretérito perfeito, sem impor valor mais-que-perfeito.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: não dará ouvidos a vocês
  rationale: A expressão שׁמע אֶל indica escutar ou atender. A formulação portuguesa comunica a recusa em acolher o que é dito sem especificar excessivamente a ideia de obedecer; “vocês” preserva o sufixo plural, que abrange Moisés e Arão.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa de modo natural a força de propósito, sem excluir a associação contextual com resultado.
- source_word: רְבוֹת
  choice: se multipliquem
  rationale: O infinitivo de רבה comunica aumento em número; a forma pronominal é corrente em português e combina naturalmente com “prodígios”.
- source_word: מוֹפְתַי
  choice: meus prodígios
  rationale: מוֹפֵת pode designar prodígio, sinal ou portento. “Prodígios” ressalta os atos extraordinários no contexto das pragas sem perder a possibilidade semântica indicada em nota.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Conserva o elemento אֶרֶץ e permanece claro e idiomático em português.
theological_decisions:
- issue: Finalidade divina relacionada à recusa do faraó
  choice: “para que os meus prodígios se multipliquem”
  alternative: “de modo que os meus prodígios se multipliquem”, com sentido predominantemente consecutivo
  rationale: לְמַעַן tem aqui força naturalmente final. A tradução mantém lado a lado a recusa do faraó e o propósito declarado por Deus, sem explicar além do que o versículo afirma.
- issue: Relação temporal da fala com a narrativa anterior
  choice: “disse”
  alternative: “tinha dito”
  rationale: A forma verbal hebraica é o passado narrativo padrão. O mais-que-perfeito pode ser adotado para harmonizar explicitamente a cronologia, mas não é exigido pela morfologia e por isso fica registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dar ouvidos a vocês” é natural e preserva tanto o plural hebraico quanto a nuance de ouvir com disposição para atender. Os marcadores foram colocados junto aos elementos a que se referem; a nota temporal aparece ao fim da frase para não interromper a abertura narrativa.
