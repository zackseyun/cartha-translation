revisions:
- from: Mas, contra nenhum dos filhos de Israel, nem sequer um cão moverá a língua, seja contra uma pessoa, seja contra um animal.[a] Assim vocês saberão que Yahweh faz distinção entre o Egito e Israel.
  to: Mas, contra nenhum dos israelitas — nem pessoa nem animal — cão algum latirá,[a] para que vocês saibam que Yahweh faz distinção entre o Egito e Israel.
  rationale: A revisão substitui uma imagem portuguesa opaca e lexicalmente imprecisa por “cão algum latirá”, o sentido idiomático contextual, e preserva “aguçará a sua língua” em nota. Também torna mais natural o escopo que abrange pessoas e animais e restitui explicitamente a finalidade de לְמַעַן.
