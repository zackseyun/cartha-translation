  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: pt
  text: Mas, contra nenhum dos israelitas — nem pessoa nem animal — cão algum latirá,[a] para que vocês saibam que Yahweh faz distinção entre o Egito e Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “nenhum cão aguçará a sua língua”. A expressão idiomática comunica paz e segurança completas: nenhum cão latirá ou rosnará contra eles.'
    reason: A nota preserva a imagem literal do hebraico e esclarece o sentido idiomático expresso naturalmente no texto principal.
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Mas, contra nenhum dos filhos de Israel
  rationale: A conjunção introduz o contraste com o juízo sobre o Egito; a negação ligada à expressão abrangente é vertida naturalmente como “contra nenhum”. “Filhos de Israel” preserva a forma hebraica e continua compreensível em português.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: nem sequer um cão moverá a língua
  rationale: A expressão hebraica descreve literalmente o cão aguçando ou movendo a língua e, no contexto, comunica que não latirá nem rosnará. A tradução mantém a imagem corporal sem impor exclusivamente “latir” ou “rosnar”; a nota esclarece o sentido idiomático.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: seja contra uma pessoa, seja contra um animal
  rationale: A construção indica alcance total, dos seres humanos aos animais. Esta formulação explicita com naturalidade em português que nenhum deles sofrerá sequer a hostilidade de um cão.
- source_word: לְמַעַן תֵּדְעוּן
  choice: Assim vocês saberão
  rationale: Expressa de modo corrente a finalidade ou o resultado pretendido da distinção manifesta, preservando a segunda pessoa do plural.
- source_word: יַפְלֶה
  choice: faz distinção
  rationale: Neste contexto, o hifil de פלא indica separar ou tratar diferentemente dois grupos, não apenas realizar algo maravilhoso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: entre o Egito e Israel
  rationale: Mantém os nomes nacionais e o contraste direto formulado no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente, sem convertê-lo em título.
- issue: Natureza da distinção entre Egito e Israel
  choice: faz distinção
  alternative: realiza maravilhas
  rationale: O contexto contrasta o juízo que atinge o Egito com a segurança de Israel. A tradução conserva essa diferenciação sem explicar além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e mantém “filhos de Israel” por transparência ao hebraico. A formulação principal conserva a imagem do cão, enquanto a nota explica o idioma sem reduzir indevidamente sua nuance.
