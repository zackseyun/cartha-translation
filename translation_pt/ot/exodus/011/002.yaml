base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: pt
  text: Fale agora ao povo, e que cada homem peça ao seu vizinho, e cada mulher à sua vizinha, objetos de prata e objetos de ouro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “peça emprestados”. O verbo hebraico significa “pedir” ou “solicitar” e, por si só, não especifica que os objetos deveriam ser devolvidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Fale agora
  rationale: O imperativo intensivo de דבר ordena uma comunicação verbal direta; נָא acrescenta urgência ou imediatidade. “Fale agora” conserva ambos os elementos sem introduzir uma deferência excessiva.
- source_word: בְּאָזְנֵי הָעָם
  choice: aos ouvidos do povo
  rationale: Mantém a imagem idiomática hebraica, compreensível em português, indicando que Moisés deveria falar de modo audível ao povo.
- source_word: וְיִשְׁאֲלוּ
  choice: e que ... peça
  rationale: A forma volitiva depois do imperativo comunica uma ordem indireta. “Peça” traduz שאל sem acrescentar a ideia de devolução inerente a “tomar emprestado”.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: cada homem ... ao seu vizinho
  rationale: “Cada homem” preserva o singular distributivo e o paralelismo de gênero; “vizinho” representa o sentido amplo de רֵעַ neste contexto.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: e cada mulher à sua vizinha
  rationale: Preserva o singular feminino distributivo e a forma feminina de רְעוּתָהּ, em paralelo com a cláusula anterior.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: objetos de prata e objetos de ouro
  rationale: כְּלִי é abrangente e pode designar utensílios, recipientes ou outros artigos; “objetos” evita especificar indevidamente joias ou vasos.
theological_decisions:
- issue: Sentido de שאל no recebimento de bens dos egípcios
  choice: peça
  alternative: tome emprestado
  rationale: O verbo hebraico significa pedir ou solicitar e, por si só, não afirma que os objetos seriam devolvidos. A tradução principal evita importar essa obrigação, enquanto a leitura tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão “aos ouvidos do povo” conserva deliberadamente a imagem hebraica; a flexão “vizinho/vizinha” mantém o paralelismo explícito do original.
