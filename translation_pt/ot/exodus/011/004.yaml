  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: pt
  text: 'Então Moisés disse: “Assim diz Yahweh: Por volta da meia-noite[a], eu sairei pelo meio do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “À meia-noite”. A expressão hebraica traz uma partícula prefixada que pode indicar aproximação; daí “Por volta da meia-noite”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula hebraica de mensageiro profético em linguagem digna e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: Por volta da meia-noite
  rationale: O כ prefixado admite valor aproximativo; a formulação conserva essa nuance sem impor uma precisão ausente do hebraico.
- source_word: אֲנִי
  choice: eu
  rationale: Mantém o pronome explícito e sua ênfase no agente da ação anunciada.
- source_word: יוֹצֵא
  choice: sairei
  rationale: O particípio tem aqui sentido iminente ou futuro; “sairei” transmite com clareza a ação prestes a ocorrer.
- source_word: בְּתוֹךְ
  choice: pelo meio de
  rationale: Mantém a ideia de movimento no interior do Egito sem substituir o verbo hebraico por “entrar” ou “passar”.
- source_word: מִצְרָיִם
  choice: Egito
  rationale: Forma padrão do nome geográfico em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de trocá-lo por um título.
- issue: Nuance temporal de כַּחֲצֹת הַלַּיְלָה
  choice: Por volta da meia-noite
  alternative: À meia-noite
  rationale: O כ prefixado pode assinalar aproximação. A tradução preserva essa possibilidade e evita afirmar uma precisão temporal maior que a do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação “sairei pelo meio do Egito” conserva de perto o verbo e a construção espacial hebraicos, apesar de seu tom ligeiramente mais bíblico em português.
