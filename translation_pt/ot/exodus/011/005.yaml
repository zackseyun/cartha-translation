id: EXO.11.5
reference: Exodus 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the slave woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: pt
  text: E morrerá todo primogênito na terra do Egito, desde o primogênito do faraó, que está sentado em seu trono, até o primogênito da escrava[a] que está atrás das pedras de moinho, e todo primogênito dos animais domésticos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “serva”. O hebraico se refere a uma mulher em condição servil; a expressão “atrás das pedras de moinho” retrata o trabalho humilde de moer grãos.
    reason: Alternativa lexical e esclarecimento da imagem social e laboral.
lexical_decisions:
- source_word: וּמֵת
  choice: E morrerá
  rationale: O perfeito qal com conjunção aparece numa declaração profética e anuncia um acontecimento futuro como certo; “morrerá” preserva tanto a referência futura quanto a força solene.
- source_word: כָּל בְּכוֹר
  choice: todo primogênito
  rationale: A construção distributiva com o substantivo singular é expressa naturalmente em português por “todo primogênito”, sem acrescentar “filho”, ausente do hebraico.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém a expressão geográfica explícita do texto hebraico em formulação tradicional, clara e natural.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: desde o primogênito ... até o primogênito
  rationale: “Desde ... até ...” comunica a extensão completa entre os extremos sociais mencionados.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: do faraó, que está sentado em seu trono
  rationale: A oração relativa preserva o valor descritivo do particípio e apresenta o faraó em sua posição régia.
- source_word: הַשִּׁפְחָה
  choice: da escrava
  rationale: O termo designa uma mulher em condição servil; “escrava” explicita essa condição e conserva o forte contraste social com o faraó.
- source_word: אַחַר הָרֵחָיִם
  choice: atrás das pedras de moinho
  rationale: Preserva a imagem concreta da posição ocupada no trabalho de moagem, em vez de generalizá-la como simples presença no moinho.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: e todo primogênito dos animais domésticos
  rationale: בְּהֵמָה abrange aqui os animais domesticados, não apenas o gado bovino; a escolha mantém essa amplitude.
theological_decisions:
- issue: Tradução do termo de condição social שִׁפְחָה
  choice: escrava
  alternative: serva; criada; escrava do sexo feminino
  rationale: O versículo traça um contraste entre o mais alto nível da realeza e uma mulher escravizada encarregada de trabalho humilde. “Escrava” preserva esse contraste sem suavizar sua condição social.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a cadência solene da declaração, evita arcaísmos e mantém a imagem concreta do hebraico. O marcador da nota foi colocado junto de “escrava”, termo ao qual a nota efetivamente se refere.
