  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Trarei ainda mais uma praga[a] sobre o faraó e sobre o Egito. Depois disso, ele deixará vocês partir daqui. Quando os deixar partir, certamente os expulsará daqui por completo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “golpe”, “ferida” ou “aflição”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é enfática; literalmente, “expulsando, expulsará vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עוֹד נֶגַע אֶחָד
  choice: ainda mais uma praga
  rationale: עוֹד tem sentido aditivo, e נֶגַע, no contexto dos juízos contra o Egito, é comunicado com clareza por “praga”.
- source_word: אָבִיא עַל־פַּרְעֹה וְעַל־מִצְרַיִם
  choice: Trarei ... sobre o faraó e sobre o Egito
  rationale: O hifil de בוא significa “trazer”, e a repetição de “sobre” conserva o paralelismo e o sentido de juízo que sobrevém a ambos.
- source_word: אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Conector temporal corrente que preserva a sequência indicada pelo hebraico.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: ele deixará vocês partir daqui
  rationale: שׁלח pode significar mandar embora ou deixar partir. Aqui, “deixar partir” contrasta naturalmente com a expulsão enfática da oração seguinte.
- source_word: כְּשַׁלְּחוֹ
  choice: Quando os deixar partir
  rationale: A preposição כְּ tem valor temporal neste contexto; a retomada do verbo mantém a ligação deliberada entre as duas orações.
- source_word: כָּלָה
  choice: por completo
  rationale: O termo funciona adverbialmente e comunica a totalidade ou caráter completo da expulsão.
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: certamente os expulsará
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a afirmação; “certamente” reproduz essa ênfase em português natural.
- source_word: מִזֶּה
  choice: daqui
  rationale: Equivalente deítico direto e idiomático para a referência ao lugar em que se encontram.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Agente e certeza do juízo final
  choice: Deus anuncia que o faraó certamente expulsará o povo
  alternative: Atenuar a construção para uma simples permissão de saída
  rationale: A progressão entre “deixar partir” e “expulsar” e a construção enfática גָּרֵשׁ יְגָרֵשׁ devem ser mantidas sem reduzir a força da predição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” evita formas regionais ou arcaizantes; “faraó” aparece como título comum. A redação conserva a repetição e a intensificação do hebraico sem se tornar mecânica.
