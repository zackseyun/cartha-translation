  text: וְ/הָֽיְתָ֛ה צְעָקָ֥ה גְדֹלָ֖ה בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֤ר כָּמֹ֨/הוּ֙ לֹ֣א נִהְיָ֔תָה וְ/כָמֹ֖/הוּ לֹ֥א תֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: pt
  text: E haverá um grande clamor por toda a terra do Egito[a], como nunca houve antes nem jamais haverá de novo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande grito” ou “uma grande lamentação”. O hebraico צְעָקָה pode indicar um grito alto de aflição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: E haverá
  rationale: O perfeito qal com a conjunção, neste anúncio profético, tem sentido futuro. “E haverá” é natural em português e preserva a força preditiva.
- source_word: צְעָקָה
  choice: clamor
  rationale: O substantivo indica um grito alto de aflição. “Clamor” preserva tanto a intensidade quanto o caráter coletivo do lamento, sem especificar além do hebraico.
- source_word: גְדֹלָה
  choice: grande
  rationale: O adjetivo qualifica a magnitude do clamor. “Grande” mantém de perto o idioma hebraico, sem reduzi-lo apenas ao volume sonoro.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: por toda a terra do Egito
  rationale: A expressão comunica extensão por todo o território egípcio em português corrente e solene.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: como nunca houve antes
  rationale: A oração compara esse clamor com todos os anteriores. “Nunca houve antes” conserva o verbo de existência e soa natural em português.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: nem jamais haverá de novo
  rationale: A construção com יסף negado expressa que algo semelhante não voltará a ocorrer. “Jamais” explicita a força absoluta, e “de novo” preserva a ideia de repetição.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil; tom digno e narrativo. A formulação preserva a amplitude territorial, a intensidade do clamor e a comparação absoluta do hebraico.
