  text: You shall not bear false witness against your neighbor[a].
translation:
  language: pt
  text: Não dê falso testemunho contra o seu próximo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não testemunhe falsamente contra o seu próximo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Partícula de negação que introduz a proibição; em português, o imperativo negativo comunica naturalmente a força normativa da forma hebraica.
- source_word: תַעֲנֶה
  choice: dê testemunho
  rationale: Embora o verbo possa significar “responder”, neste contexto jurídico, junto de עֵד שָׁקֶר, tem o sentido de prestar ou dar testemunho.
- source_word: בְרֵעֲךָ
  choice: contra o seu próximo
  rationale: רֵעַ designa o próximo ou semelhante, e a preposição ב, no contexto forense, indica a pessoa contra quem se dirige o testemunho.
- source_word: עֵד
  choice: testemunho
  rationale: Neste contexto, refere-se ao ato ou conteúdo do depoimento judicial; “dar testemunho” é uma formulação natural e reconhecível em português.
- source_word: שָׁקֶר
  choice: falso
  rationale: Expressa falsidade ou engano e, com “testemunho”, forma a expressão jurídica corrente “falso testemunho”.
