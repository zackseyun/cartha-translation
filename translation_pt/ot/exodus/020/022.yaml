  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Assim você dirá aos filhos de Israel[a]: ‘Vocês mesmos viram que falei com vocês dos céus[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “ao povo de Israel”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do céu”. O hebraico emprega a forma plural, “dos céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, sem substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica essa sequência em português natural.
- source_word: כֹּה תֹאמַר
  choice: Assim você dirá
  rationale: Preserva a fórmula de mensageiro e seu tom declarativo sem recorrer a linguagem arcaica.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto a expressão hebraica e sua designação coletiva tradicional, com alternativa idiomática indicada em nota.
- source_word: אַתֶּם רְאִיתֶם
  choice: Vocês mesmos viram
  rationale: O pronome independente אַתֶּם acrescenta ênfase; “vocês mesmos” a torna explícita.
- source_word: כִּי
  choice: que
  rationale: Introduz aqui o conteúdo daquilo que Israel viu, e não uma explicação causal.
- source_word: מִן הַשָּׁמַיִם
  choice: desde os céus
  rationale: Mantém o plural morfológico hebraico e expressa a origem espacial da fala; “do céu” seria uma alternativa mais idiomática.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: falei com vocês
  rationale: A preposição עִם significa literalmente “com” e ressalta o encontro direto, embora a expressão também possa ser vertida naturalmente como “falei a vocês”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva em vez de substituí-lo por um título.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A escolha conserva a forma lexical hebraica sem negar que, no contexto, ela designa coletivamente todo o povo.
- issue: Valor relacional de עִמָּכֶם
  choice: com vocês
  alternative: a vocês
  rationale: “Com” preserva a preposição hebraica e a ideia de encontro direto, sem afirmar além do texto uma reciprocidade verbal plena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você/vocês” para distinguir naturalmente o singular dirigido a Moisés do plural dirigido ao povo. Mantém “Yahweh”, a fórmula solene “Assim você dirá” e o plural hebraico “os céus”, sem arcaísmos.
