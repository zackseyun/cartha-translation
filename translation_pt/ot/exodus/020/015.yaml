  text: לֹ֖א תִּגְנֹֽב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/015.yaml
  text: You shall not steal[a].
translation:
  language: pt
  text: Não roube[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em formulação tradicional: “Não furtarás”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Negação hebraica padrão que, com o imperfeito, expressa aqui uma proibição direta. Em português moderno, a forma natural é “não” com o imperativo.
- source_word: תִּגְנֹב
  choice: roube
  rationale: Forma qal imperfeita, segunda pessoa masculina singular, de גנב. Sem objeto expresso que restrinja o sentido a sequestro, “roubar” preserva o alcance geral do verbo e a concisão do Decálogo.
theological_decisions:
- issue: Forma da proibição no Decálogo
  choice: Não roube.
  alternative: Não furtarás.
  rationale: O hebraico usa לֹא com o imperfeito para uma proibição direta. “Não roube” comunica essa força em português atual, claro e digno, enquanto “Não furtarás” conserva uma cadência tradicional, mas soa menos natural hoje e pode sugerir uma distinção jurídica moderna entre furto e roubo que não está especificada no hebraico.
translation_notes:
  register: Formulação concisa, solene e compreensível em português moderno, com legibilidade brasileira. Evita a ambiguidade jurídica contemporânea de “furto” e “roubo” no texto principal, usando “roubar” em seu sentido comum e abrangente.
