  text: וְ/לֹֽא תַעֲלֶ֥ה בְ/מַעֲלֹ֖ת עַֽל מִזְבְּחִ֑/י אֲשֶׁ֛ר לֹֽא תִגָּלֶ֥ה עֶרְוָתְ/ךָ֖ עָלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: pt
  text: Também não suba ao meu altar por degraus, para que a sua nudez não fique exposta sobre ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que a sua nudez não seja descoberta sobre ele».'
    reason: Alternativa lexical que reflete de modo mais literal o sentido passivo de תִּגָּלֶה.
lexical_decisions:
- source_word: תַעֲלֶה
  choice: suba
  rationale: O verbo עלה significa subir. A forma «não suba» transmite naturalmente em português moderno a proibição dirigida a uma pessoa no singular.
- source_word: בְמַעֲלֹת
  choice: por degraus
  rationale: מַעֲלוֹת designa degraus ou escadas; com a preposição ב, «por degraus» expressa o meio pelo qual alguém subiria.
- source_word: מִזְבְּחִי
  choice: meu altar
  rationale: Tradução direta de מִזְבֵּחַ com o sufixo de primeira pessoa do singular.
- source_word: אֲשֶׁר לֹא
  choice: para que ... não
  rationale: No contexto, introduz a finalidade ou o resultado que a proibição pretende evitar. A formulação mantém essa relação sem recorrer a linguagem arcaica.
- source_word: תִּגָּלֶה
  choice: fique exposta
  rationale: O nifal de גלה tem sentido passivo, «ser descoberta/exposta». «Fique exposta» é claro e idiomático no contexto de exposição corporal.
- source_word: עֶרְוָתְךָ
  choice: a sua nudez
  rationale: עֶרְוָה denota nudez, com implicações de pudor corporal. A tradução preserva a expressão hebraica sem especificar mais do que o texto.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O pronome masculino retoma o altar. «Sobre ele» preserva a relação espacial expressa pelo hebraico.
- source_word: וְלֹא
  choice: Também não
  rationale: A conjunção liga esta proibição à instrução anterior; «também» torna essa continuidade explícita e natural em português.
theological_decisions:
- issue: Razão da proibição de degraus no altar
  choice: Preservar como razão explícita a prevenção da exposição da nudez no altar.
  alternative: Interpretar a proibição como símbolo de humildade ou vinculá-la especificamente às vestes sacerdotais.
  rationale: O hebraico menciona diretamente a exposição da nudez, mas não explica um simbolismo mais amplo nem especifica quais vestes estariam em vista.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular do hebraico é mantido por meio de «não suba» e «sua». «Também» preserva a ligação do וְ inicial com a instrução anterior.
