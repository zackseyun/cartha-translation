lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: Traduz naturalmente a forma narrativa do verbo דָּבַר e preserva a introdução solene ao discurso divino.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Equivalente português direto e tradicional para o referente divino neste contexto.
- source_word: כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: Mantém o sentido abrangente de כָּל, o demonstrativo הָאֵלֶּה e a formulação concreta 'palavras', importante para a designação subsequente do Decálogo.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo formulaico introduz o conteúdo da fala; em português atual, os dois-pontos expressam essa função com mais naturalidade do que o literal 'dizendo'.
