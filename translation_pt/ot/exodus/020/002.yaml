source:
  edition: WLC
  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of slaves.
translation:
  language: pt
  text: Eu sou Yahweh[a], teu Deus, que te tirei da terra do Egito, da casa de escravos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por «SENHOR».
    reason: alternative_reading
  - marker: b
    text: Ou, de modo mais idiomático, «da casa da escravidão». O hebraico diz literalmente «da casa de escravos».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Eu sou
  rationale: O pronome independente é enfático; em português, a cópula precisa ser expressa para formar a declaração solene de identidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: teu Deus
  rationale: Neste contexto, אֱלֹהִים tem referência singular, e o sufixo de segunda pessoa também é singular. A forma «teu» preserva essa relação direta e combina naturalmente com «te» na oração seguinte.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que identifica Yahweh por seu ato libertador.
- source_word: הוֹצֵאתִיךָ
  choice: te tirei
  rationale: O Hifil de יצא significa fazer sair ou tirar para fora. «Te tirei» é claro, natural e preserva a primeira pessoa do verbo e o destinatário singular.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém a expressão geográfica formal e a ideia de procedência indicada por מן.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Preserva a imagem concreta do hebraico, literalmente «casa de escravos», e mantém o paralelismo da repetição de מן com «da».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; transliterá-lo preserva a autodesignação, enquanto «SENHOR» a substitui por um título tradicional.
- issue: Sentido de עֲבָדִים no contexto do Egito
  choice: escravos
  alternative: servos
  rationale: O contexto é de sujeição e trabalho forçado; «escravos» comunica a condição de cativeiro sem atenuá-la.
- issue: Imagem de בֵּית עֲבָדִים
  choice: casa de escravos
  alternative: casa da escravidão
  rationale: A opção escolhida conserva o substantivo plural concreto do hebraico. A alternativa é mais idiomática e explicita a condição abstrata, por isso é registrada em nota.
translation_notes:
  register: Português atual, claro e solene. Empregam-se «teu» e «te» para conservar a segunda pessoa singular do hebraico e evitar a ambiguidade de «seu», sem recorrer ao coloquial «você». Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
