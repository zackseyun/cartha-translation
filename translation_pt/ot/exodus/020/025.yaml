  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: pt
  text: E, se você fizer para mim um altar de pedras, não o construa com pedras lavradas[a], pois, se você levantar a sua espada sobre ele[b], você o profanará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pedras talhadas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sua espada”; neste contexto, provavelmente se refere a uma lâmina ou ferramenta metálica usada para trabalhar as pedras.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a ligação com a instrução anterior quanto o caráter condicional da frase.
- source_word: מִזְבַּח אֲבָנִים
  choice: um altar de pedras
  rationale: Reproduz com clareza a construção hebraica e soa natural em português.
- source_word: תַּעֲשֶׂה לִּי
  choice: você fizer para mim
  rationale: Mantém a relação dativa expressa por לִי sem acrescentar uma interpretação teológica.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: não o construa com pedras lavradas
  rationale: Em português, o pronome singular retoma naturalmente “altar”, enquanto “com pedras lavradas” comunica que as pedras não devem ser trabalhadas.
- source_word: כִּי
  choice: pois, se
  rationale: Apresenta a razão da proibição e torna explícito, de modo natural, o valor condicional da cláusula seguinte.
- source_word: חַרְבְּךָ
  choice: a sua espada
  rationale: Conserva o sentido lexical direto de חֶרֶב, embora no contexto possa designar ou representar o instrumento metálico empregado para trabalhar a pedra.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: manejar sobre ele
  rationale: Expressa a ação de levantar ou aplicar o instrumento sobre o altar sem substituir “espada” por uma interpretação contextual.
- source_word: וַתְּחַלְלֶהָ
  choice: você o profanará
  rationale: 'Preserva o sentido cultual de חלל: retirar ou violar a condição santa, não apenas danificar ou enfeiar.'
theological_decisions:
- issue: Natureza da profanação do altar
  choice: O trabalho das pedras com uma lâmina torna o altar profanado em sentido cultual.
  alternative: A proibição poderia enfatizar sobretudo a violência associada a armas ou a simplicidade do altar.
  rationale: O verbo חלל aponta diretamente para profanação, mas o versículo não explica por que o uso da lâmina tem esse efeito; por isso, a tradução mantém a afirmação sem desenvolver uma teoria adicional.
- issue: Identidade do objeto chamado “espada”
  choice: Manter “espada” no texto principal.
  alternative: Traduzir interpretativamente como “ferramenta” ou “instrumento de ferro”.
  rationale: חֶרֶב significa normalmente “espada”. O contexto sugere o uso de uma lâmina metálica nas pedras, informação apresentada em nota sem apagar a formulação concreta do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “você” para a segunda pessoa singular. “Pedras lavradas” mantém o vocabulário cultual e construtivo sem soar excessivamente arcaico; a alternativa “talhadas” é indicada em nota.
