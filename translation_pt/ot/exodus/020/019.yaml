  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: pt
  text: 'E disseram a Moisés: “Fale você conosco, e nós ouviremos[a]; mas que Deus não fale conosco, para que não morramos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escutaremos”. O verbo hebraico pode indicar ouvir no sentido de prestar atenção ou de responder com obediência.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol dá continuidade à narrativa; a coordenação com “E” preserva de modo natural a sequência hebraica.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: É o uso direcional normal de אֶל com o nome próprio.
- source_word: דַּבֵּר אַתָּה
  choice: Fale você
  rationale: O imperativo seguido do pronome explícito enfatiza que Moisés, e não Deus, deve falar; a ordem “Fale você” mantém essa ênfase em português natural.
- source_word: עִמָּנוּ
  choice: conosco
  rationale: Preserva o sentido básico e relacional da preposição עִם e é idiomático com “falar” em português.
- source_word: וְנִשְׁמָעָה
  choice: e nós ouviremos
  rationale: A forma volitiva em resposta ao imperativo pode ser expressa naturalmente pelo futuro; “ouviremos” conserva a amplitude entre ouvir atentamente e responder com obediência.
- source_word: וְאַל יְדַבֵּר
  choice: mas que ... não fale
  rationale: אַל com o imperfeito expressa proibição ou desejo negativo; esta construção é atual, clara e mantém o contraste com o pedido anterior.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto do Sinai e o verbo no singular identificam o Deus de Israel como referente singular.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz a consequência temida. Em português moderno, “para que não” expressa essa prevenção com clareza e solenidade sem recorrer ao mais literário “para não suceder que”.
- source_word: נָמוּת
  choice: morramos
  rationale: O subjuntivo após “para que não” comunica adequadamente o resultado temido expresso pelo imperfeito hebraico.
theological_decisions:
- issue: Referente e número de אֱלֹהִים
  choice: Deus, no singular
  alternative: deuses
  rationale: O contexto imediato do Sinai e a concordância verbal singular indicam o Deus de Israel; trata-se de uma decisão gramatical e contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fale você” preserva a ênfase contrastiva do pronome hebraico; “que Deus não fale” evita o arcaísmo de uma formulação como “não fale Deus”.
