source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: pt
  text: Pois em seis dias Yahweh fez os céus e a terra, o mar e tudo o que neles há, e descansou no sétimo dia.[a] Por isso, Yahweh abençoou o dia do sábado e o santificou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cessou”. O verbo hebraico pode destacar tanto o repouso quanto a cessação do trabalho.'
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta o mandamento do sábado no versículo anterior e preserva claramente a ligação argumentativa.
- source_word: שֵׁשֶׁת יָמִים
  choice: em seis dias
  rationale: Expressa de modo natural o período em que a obra criadora foi realizada, sem acrescentar interpretação.
- source_word: עָשָׂה
  choice: fez
  rationale: O verbo amplo עשה significa fazer ou realizar; com os objetos da criação, “fez” é direto e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: Preserva a fórmula cosmológica abrangente e o plural hebraico de “céus”.
- source_word: הַיָּם
  choice: o mar
  rationale: Mantém o singular do hebraico e identifica outro domínio da criação.
- source_word: כָּל אֲשֶׁר בָּם
  choice: tudo o que neles há
  rationale: Reproduz de maneira clara a abrangência da oração relativa, incluindo o conteúdo dos céus, da terra e do mar.
- source_word: וַיָּנַח
  choice: e descansou
  rationale: נוח pode descrever repouso ou cessação da atividade. “Descansou” é natural no contexto do sábado, enquanto a nota preserva a alternativa lexical sem sugerir necessariamente cansaço.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: É a forma temporal idiomática em português para indicar quando ocorreu o descanso.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Assinala de forma clara e corrente a conclusão derivada do padrão da criação.
- source_word: בֵּרַךְ
  choice: abençoou
  rationale: Equivalente direto de ברך, indicando que Deus conferiu bênção ao dia.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: e o santificou
  rationale: Preserva o pronome referente ao dia e traduz קדש como separar ou tornar santo, com formulação digna e concisa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
- issue: Descrição da ação divina no sétimo dia
  choice: descansou
  alternative: cessou
  rationale: O verbo נוח admite a ideia de repousar e, no contexto, também a de cessar o trabalho. O texto principal conserva a formulação natural ligada ao sábado, e a nota registra a alternativa sem resolver indevidamente a nuance nem implicar fadiga divina.
- issue: Santidade do dia do sábado
  choice: o santificou
  alternative: o tornou santo
  rationale: Ambas as formas comunicam que Yahweh separou o dia como santo. “Santificou” mantém concisão, dignidade e proximidade formal com o verbo hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe acompanha o encadeamento causal do hebraico sem rigidez excessiva. O marcador [a] foi colocado após a expressão a que a nota realmente se refere.
