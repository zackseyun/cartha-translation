  text: מִזְבַּ֣ח אֲדָמָה֮ תַּעֲשֶׂה לִּ/י֒ וְ/זָבַחְתָּ֣ עָלָ֗י/ו אֶת עֹלֹתֶ֨י/ךָ֙ וְ/אֶת שְׁלָמֶ֔י/ךָ אֶת צֹֽאנְ/ךָ֖ וְ/אֶת בְּקָרֶ֑/ךָ בְּ/כָל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אַזְכִּ֣יר אֶת שְׁמִ֔/י אָב֥וֹא אֵלֶ֖י/ךָ וּ/בֵרַכְתִּֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: pt
  text: Faça para mim um altar de terra e, sobre ele, sacrifique seus holocaustos e seus sacrifícios de comunhão, suas ovelhas e cabras e seu gado. Em todo lugar onde eu fizer que meu nome seja lembrado[a], virei até você e o abençoarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “onde eu proclamar meu nome”, “onde eu fizer menção do meu nome” ou “onde eu registrar meu nome”. O verbo hebraico está na forma causativa, e sua nuance exata pode envolver proclamação, memorialização ou invocação do nome de Deus.
    reason: Alternativas lexicais para a forma causativa de זכר, cuja nuance exata permanece aberta.
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: um altar de terra
  rationale: Preserva a expressão concreta do hebraico para um altar feito de terra ou solo e soa natural em português.
- source_word: תַּעֲשֶׂה לִּי
  choice: Faça para mim
  rationale: O imperfeito de segunda pessoa, em contexto instrutivo, tem força prescritiva; o imperativo é claro e natural em português, e “para mim” mantém a ideia de dedicação.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: e, sobre ele, sacrifique
  rationale: “Sacrifique” expressa adequadamente זבח no contexto ritual, enquanto “sobre ele” mantém o altar em foco.
- source_word: עֹלֹתֶיךָ
  choice: seus holocaustos
  rationale: “Holocausto” é o termo cultual estabelecido em português para a oferta totalmente queimada, sem depender do sentido moderno extrabíblico da palavra.
- source_word: שְׁלָמֶיךָ
  choice: suas ofertas de comunhão
  rationale: Comunica uma dimensão central das ofertas שְׁלָמִים sem reduzi-las simplesmente a “paz”; a nota não é necessária porque o contexto deixa claro que se trata de uma categoria sacrificial.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: seus rebanhos de ovelhas e cabras e seus rebanhos de gado
  rationale: צֹאן abrange pequenos animais de rebanho, sobretudo ovelhas e cabras, e בָּקָר designa gado bovino. A explicitação evita restringir צֹאן apenas a ovelhas.
- source_word: בְּכָל הַמָּקוֹם
  choice: Em todo lugar
  rationale: Mantém o valor distributivo da expressão hebraica em formulação corrente e digna.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: onde eu fizer meu nome ser lembrado
  rationale: Preserva a forma causativa do Hifil de זכר e a agência divina, sem limitar o sentido a proclamação, registro ou invocação.
- source_word: אָבֹא אֵלֶיךָ
  choice: virei até você
  rationale: Expressa o movimento ou aproximação divina indicado por אֶל; “até você” mantém essa nuance de modo natural.
- source_word: וּבֵרַכְתִּיךָ
  choice: e o abençoarei
  rationale: Torna explícitos o sujeito divino e o objeto masculino singular presentes na forma verbal hebraica.
theological_decisions:
- issue: Sentido da ação divina em אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: onde eu fizer meu nome ser lembrado
  alternative: onde eu proclamar meu nome; onde eu registrar meu nome; onde eu fizer menção do meu nome
  rationale: A formulação causativa conserva a ambiguidade entre memorialização, menção, proclamação e possível invocação do nome de Deus, sem definir além do que o hebraico permite.
- issue: Designação de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas pacíficas
  rationale: “Ofertas de comunhão” é compreensível no português moderno e representa uma dimensão do termo, embora “paz/bem-estar” também pertença ao seu campo semântico; não se atribui ao rito uma doutrina denominacional específica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e alcance internacional. O singular “você” representa o destinatário masculino singular do hebraico. A sequência “ovelhas e cabras” explicita o alcance de צֹאן; “gado” representa בָּקָר. O marcador [a] aparece imediatamente após a cláusula a que a nota se refere.
