  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: pt
  text: Não se curve diante delas nem as sirva[a], pois eu, Yahweh, seu Deus, sou Deus zeloso[b], que visito a iniquidade dos pais sobre os filhos, sobre a terceira e a quarta geração dos que me odeiam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem as adore”. O verbo traduzido por “sirva” pode indicar o serviço religioso prestado a ídolos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sou Deus ciumento”. Aqui, o termo hebraico expressa a exigência de devoção exclusiva da aliança.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “que visito a iniquidade dos pais sobre os filhos, sobre os terceiros e sobre os quartos, dos que me odeiam”. Compare Deuteronômio 24:16 e Ezequiel 18 quanto à responsabilidade individual.'
    reason: cross_reference
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: se curve diante delas
  rationale: Preserva a ação concreta de inclinar-se em reverência e mantém a distinção em relação ao verbo seguinte, que expressa serviço.
- source_word: תָעָבְדֵם
  choice: as sirva
  rationale: Traduz o sentido básico de עבד e, no contexto de ídolos, permite a conotação de serviço cúltico sem reduzi-lo simplesmente a 'adorar'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֵל קַנָּא
  choice: Deus zeloso
  rationale: Em português, 'zeloso' comunica a exigência de exclusividade da aliança com maior naturalidade; a nota preserva a alternativa tradicional 'ciumento' e sua tensão relacional.
- source_word: פֹּקֵד
  choice: faço recair
  rationale: Expressa de modo natural o idioma hebraico de intervenção e responsabilização divina sem restringi-lo explicitamente a 'punir'.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: Mantém o peso moral e a amplitude semântica, que pode abranger perversidade, culpa e suas consequências.
- source_word: אָבֹת
  choice: pais
  rationale: Conserva o plural masculino da fórmula hebraica e é natural em português.
- source_word: בָּנִים
  choice: filhos
  rationale: É a correspondência direta e idiomática; no contexto geracional, pode abranger os descendentes.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: até a terceira e a quarta geração
  rationale: Supre o substantivo elíptico 'geração' e comunica em português a extensão sucessiva indicada pelos ordinais hebraicos.
- source_word: לְשֹׂנְאָי
  choice: dos que me odeiam
  rationale: Preserva a qualificação relacional do aviso e evita apresentar a declaração como indiscriminada.
theological_decisions:
- issue: Como traduzir o zelo divino
  choice: Deus zeloso
  alternative: Deus ciumento
  rationale: O contexto trata da reivindicação legítima e exclusiva de Yahweh contra a idolatria. 'Zeloso' é digno e natural em português, enquanto a nota registra a tradução mais literal/tradicional sem apagar a tensão.
- issue: Como expressar o juízo entre gerações
  choice: faço recair a iniquidade dos pais sobre os filhos, até a terceira e a quarta geração dos que me odeiam
  alternative: castigo os filhos pela iniquidade dos pais até a terceira e a quarta geração daqueles que me odeiam
  rationale: A formulação preserva a amplitude do idioma hebraico פקד עון e evita resolver além do texto a relação entre iniquidade, consequências e punição. A expressão final continua limitando o aviso aos que odeiam a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa masculina singular hebraica foi vertida por 'você/seu' de forma implícita e natural no imperativo, evitando regionalismo marcado. A redação mantém a aspereza e a ambiguidade teológica da fórmula intergeracional, apoiando-a com nota literal e referências canônicas.
