  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽ֣א תַעֲשֶׂ֨ה כָל מְלָאכָ֜ה אַתָּ֣ה וּ/בִנְ/ךָֽ֣ וּ/בִתֶּ֗/ךָ עַבְדְּ/ךָ֤ וַ/אֲמָֽתְ/ךָ֙ וּ/בְהֶמְתֶּ֔/ךָ וְ/גֵרְ/ךָ֖ אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male slave, or your female slave, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: pt
  text: Mas[a] o sétimo dia é um sábado dedicado a Yahweh, seu Deus. Não faça trabalho algum — nem você, nem seu filho, nem sua filha, nem seu escravo, nem sua escrava[b], nem seus animais, nem o estrangeiro residente[c] que está dentro de suas portas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “E o sétimo dia”. A conjunção hebraica pode ser traduzida das duas maneiras; “mas” ressalta o contraste com os seis dias de trabalho mencionados no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz explicitamente “seu escravo” e “sua escrava”. Traduções tradicionais também empregam “servo” e “serva”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o imigrante residente”. O termo hebraico ger se refere a alguém não nativo que residia entre os israelitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: Mas o sétimo dia
  rationale: A conjunção ו pode ser traduzida por “e”, mas “mas” expressa naturalmente o contraste com os seis dias de trabalho do versículo anterior.
- source_word: שַׁבָּת לַיהוָה אֱלֹהֶיךָ
  choice: um sábado dedicado a Yahweh, seu Deus
  rationale: Mantém שַׁבָּת como substantivo e representa o ל de relação ou dedicação em português natural, sem reduzir o termo a mero descanso.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: Não faça trabalho algum
  rationale: Formulação imperativa atual e digna que preserva a força jurídica da proibição e o alcance abrangente de כָל.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: seu escravo, nem sua escrava
  rationale: O par designa pessoas em condição de escravidão no âmbito doméstico; “escravo” e “escrava” tornam essa realidade social explícita, sem o abrandamento de “servo” e “serva”.
- source_word: וּבְהֶמְתֶּךָ
  choice: seus animais
  rationale: Neste contexto, בְּהֵמָה designa coletivamente os animais domésticos pertencentes à casa. “Seus animais” é claro e abrangente em português corrente.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: o estrangeiro residente que vive em suas cidades
  rationale: גֵּר é o não israelita estabelecido entre o povo, e “dentro dos seus portões” é uma expressão territorial para os povoados sob a autoridade local; a tradução comunica ambos os sentidos sem sugerir mera presença física junto a um portão.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino da aliança expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Alcance doméstico e social da proibição sabática
  choice: Manter explicitamente filhos, pessoas escravizadas, animais e o estrangeiro residente
  alternative: Generalizar como “toda a sua casa” ou suavizar as categorias sociais
  rationale: A enumeração hebraica estende expressamente o descanso a cada grupo e deve permanecer visível, inclusive em sua tensão social histórica.
- issue: Relação do sábado com Yahweh indicada por ל
  choice: dedicado a Yahweh
  alternative: para Yahweh; pertencente a Yahweh
  rationale: “Dedicado a” comunica a consagração ou orientação do dia a Yahweh, sem afirmar de modo excessivamente estreito uma única nuance da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega o imperativo “não faça” em vez do futuro jurídico mais arcaizante “não farás”. A sequência com “nem” reproduz com clareza o alcance inclusivo da proibição. “Em suas cidades” traduz idiomaticamente a expressão hebraica “dentro dos seus portões”.
