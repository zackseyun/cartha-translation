base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: pt
  text: Todo o povo via os trovões[a], os clarões de fogo[b], o som da trombeta e o monte fumegando. Ao ver isso[c], o povo tremeu e ficou à distância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os sons” ou “as vozes”; neste contexto, provavelmente se refere a trovões.
    reason: lexical_alternative
  - marker: b
    text: Ou “as tochas”; neste contexto, o termo provavelmente se refere a clarões de fogo semelhantes a relâmpagos.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz que o povo “via” fenômenos que incluem som, preservando o caráter sensorialmente avassalador da cena.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: via
  rationale: O particípio hebraico apresenta a percepção como uma cena em curso. Em português, o pretérito imperfeito preserva naturalmente esse aspecto e mantém o verbo visual mesmo diante de fenômenos sonoros.
- source_word: הַקּוֹלֹת
  choice: os trovões
  rationale: Embora o substantivo signifique literalmente “sons” ou “vozes”, no contexto da manifestação no Sinai o plural provavelmente designa trovões.
- source_word: הַלַּפִּידִם
  choice: os clarões de fogo
  rationale: O termo significa literalmente “tochas”, mas aqui descreve manifestações ígneas semelhantes a relâmpagos; “clarões de fogo” preserva a imagem concreta sem identificá-las categoricamente como relâmpagos.
- source_word: קוֹל הַשֹּׁפָר
  choice: o som da trombeta
  rationale: A expressão reproduz de perto a construção hebraica. “Trombeta” é clara e corrente, embora שׁוֹפָר designe propriamente um instrumento de chifre.
- source_word: הָהָר עָשֵׁן
  choice: o monte soltando fumaça
  rationale: A formulação conserva o caráter vívido e predicativo da descrição hebraica em português natural.
- source_word: וַיַּרְא הָעָם
  choice: Ao ver isso, o povo
  rationale: A oração retoma coletivamente os fenômenos enumerados e introduz a reação do povo; “isso” torna a referência natural em português.
- source_word: וַיָּנֻעוּ
  choice: tremeu
  rationale: O verbo exprime movimento ou abalo, aqui associado à reação amedrontada do povo; “tremeu” é idiomático e adequado ao contexto.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: ficou à distância
  rationale: Expressa que o povo permaneceu afastado. A construção no singular concorda naturalmente com o coletivo “povo”.
- source_word: וְכָל הָעָם
  choice: Todo o povo
  rationale: Tradução direta e natural do coletivo hebraico, indicando a comunidade reunida como um todo.
theological_decisions:
- issue: A linguagem sensorial afirma que o povo “via” fenômenos que incluem sons.
  choice: Manter “via os trovões”, preservando a mistura sensorial do hebraico.
  alternative: Normalizar como “ouvia os trovões” ou generalizar como “percebia tudo isso”.
  rationale: A formulação hebraica contribui para o caráter avassalador da manifestação divina. Preservá-la evita resolver silenciosamente a tensão expressiva do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O pretérito imperfeito em “via” conserva o aspecto contínuo do particípio; “ficou” e “tremeu” seguem a concordância natural com o coletivo singular “povo”. Todos os marcadores aparecem no texto na ordem correspondente.
