  yaml_path: translation/ot/exodus/020/013.yaml
  text: You shall not murder[a].
translation:
  language: pt
  text: Não assassine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido mais amplo, “Não mate”. O verbo hebraico geralmente se refere a homicídio ilícito ou assassinato, e não a toda forma de tirar a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Partícula hebraica padrão de negação. Em português, o imperativo negativo expressa de modo natural e direto a força proibitiva da construção.
- source_word: תִּרְצָח
  choice: cometa assassinato
  rationale: O verbo רצח se refere normalmente à morte ilícita de uma pessoa, isto é, a assassinato, e não a todo e qualquer ato de matar. A formulação verbal “cometa assassinato” mantém essa precisão e soa natural como proibição em português.
theological_decisions:
- issue: Alcance da proibição no Decálogo
  choice: Traduzir רצח como “cometa assassinato”
  alternative: Não mate.
  rationale: A decisão é principalmente lexical, embora tenha implicações teológicas. “Não mate” poderia ser entendido como proibição absoluta de toda forma de tirar a vida, sentido mais amplo do que o verbo hebraico exige neste contexto jurídico. “Não cometa assassinato” preserva a força moral do mandamento sem ampliar indevidamente seu alcance.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O imperativo negativo é mais natural em português do que uma reprodução formal com futuro (“não matarás”), enquanto “cometa assassinato” comunica com precisão o sentido lexical do hebraico.
