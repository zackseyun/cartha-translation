  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: pt
  text: Seis dias você trabalhará e fará todo o seu trabalho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Durante seis dias você trabalhará.”'
    reason: Alternativa temporal que explicita em português a duração implícita na expressão hebraica, sem alterar o sentido básico.
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Seis dias
  rationale: A construção hebraica traz diretamente o numeral com o substantivo e funciona como expressão temporal. “Seis dias” é natural em português e evita acrescentar uma preposição não explícita.
- source_word: תַּעֲבֹד
  choice: você trabalhará
  rationale: O Qal de עבד pode significar trabalhar, servir ou labutar. Neste contexto, “trabalhará” é claro e corrente; o futuro assume valor diretivo na formulação legal.
- source_word: וְעָשִׂיתָ
  choice: e fará
  rationale: עשה tem sentido amplo de fazer ou realizar. Com מְלַאכְתֶּךָ, “fará todo o seu trabalho” conserva a estrutura do hebraico e soa digna em português.
- source_word: כָּל
  choice: todo
  rationale: כָּל significa “todo” ou “a totalidade de”; a concordância com “trabalho” exige o masculino singular.
- source_word: מְלַאכְתֶּךָ
  choice: o seu trabalho
  rationale: מְלָאכָה designa trabalho, ocupação ou tarefa, sobretudo no contexto do sábado. “O seu trabalho” é direto e mantém a distinção lexical em relação ao verbo עבד.
theological_decisions:
- issue: Força diretiva do imperfeito na legislação do sábado
  choice: “você trabalhará” como instrução pactual
  alternative: “você pode trabalhar” ou “você deve trabalhar”
  rationale: No Decálogo, a forma não é mera previsão. O futuro português preserva o tom solene e jurídico, sem transformar a frase apenas em permissão nem explicitar com “deve” uma modalidade que permanece incorporada à forma verbal hebraica.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A formulação mantém paralelismo solene e conciso, preservando a força diretiva e a repetição semântica entre trabalhar e trabalho.
