  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: pt
  text: Honre seu pai e sua mãe, para que os seus dias se prolonguem[a] na terra[b] que Yahweh, seu Deus, está dando a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “os seus dias se prolonguem” é uma maneira hebraica de falar de vida longa.
    reason: cultural_note
  - marker: b
    text: Literalmente, “sobre a terra”. Em português, a ideia também pode ser expressa como “na terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Honre
  rationale: O imperativo intensivo de כבד exige que pai e mãe sejam tratados como dignos de consideração e honra. “Honre” preserva melhor a força ética e pactual do que o mais fraco “respeite”.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: seu pai e sua mãe
  rationale: Tradução direta e natural dos substantivos singulares com sufixo de segunda pessoa, preservando a fórmula familiar do mandamento.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa adequadamente a relação de finalidade ou resultado entre o mandamento e a promessa.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: os seus dias se prolonguem
  rationale: Mantém a imagem hebraica dos “dias” e comunica de modo digno e compreensível a ideia de vida longa.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Neste contexto, אֲדָמָה designa a terra concedida a Israel. “Na terra” é a formulação idiomática em português, enquanto a nota registra o valor mais literal da preposição עַל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Equivalente direto da forma com sufixo de segunda pessoa, identificando Yahweh como o Deus do destinatário.
- source_word: נֹתֵן לָךְ
  choice: está dando a você
  rationale: Preserva o aspecto participial, que pode indicar uma ação em curso ou iminente, apropriada ao contexto do Sinai antes da posse da terra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o nome pactual de Deus. “Yahweh” o preserva como nome próprio, sem substituí-lo por um título.
- issue: Alcance de הָאֲדָמָה na promessa
  choice: a terra concedida a Israel
  alternative: o solo; a terra em sentido universal
  rationale: A oração “que Yahweh, seu Deus, está dando a você” aponta para a terra da aliança, sem exigir a expansão interpretativa “terra prometida” no corpo do versículo.
- issue: Relação entre o mandamento e a longevidade
  choice: manter a formulação de finalidade ou resultado sem explicar sua aplicação
  alternative: transformar a promessa em garantia individual absoluta ou em princípio geral
  rationale: “Para que” preserva a tensão do texto entre mandamento e promessa, sem acrescentar uma sistematização teológica ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação “a você” evita a possível ambiguidade regional de “lhe”, enquanto “os seus dias se prolonguem” conserva a imagem do hebraico sem soar excessivamente arcaica.
