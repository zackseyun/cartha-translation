  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male slave, or his female slave, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: pt
  text: Não cobice a casa do seu próximo[a]. Não cobice a esposa do seu próximo, nem o escravo dele, nem a escrava dele, nem o boi dele, nem o jumento dele, nem coisa alguma que pertença ao seu próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o conjunto doméstico do seu próximo”. A palavra hebraica traduzida como “casa” também pode referir-se ao conjunto doméstico; aqui, porém, “casa” se ajusta melhor à enumeração separada que vem em seguida.
    reason: alternativa lexical
lexical_decisions:
- source_word: תַחְמֹד
  choice: cobice
  rationale: No contexto deste mandamento, חמד indica desejar de modo indevido aquilo que pertence a outra pessoa. “Cobice” preserva essa força ética melhor que o termo mais amplo “deseje”.
- source_word: בֵּית רֵעֶךָ
  choice: a casa do seu próximo
  rationale: בַּיִת pode designar tanto a casa física quanto o conjunto doméstico. Como esposa, escravos e animais são enumerados em seguida, “casa” é o sentido primário mais natural aqui.
- source_word: רֵעֶךָ
  choice: seu próximo
  rationale: רֵעַ designa aqui outra pessoa da comunidade. “Próximo” é uma formulação consagrada e inteligível que conserva o caráter interpessoal do mandamento.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: a esposa do seu próximo
  rationale: A construção indica diretamente a mulher na relação conjugal. “Esposa” evita a possível leitura genérica de “mulher” no português atual.
- source_word: עַבְדּוֹ
  choice: o escravo dele
  rationale: Neste inventário jurídico, עֶבֶד ressalta uma condição de sujeição e posse. “Escravo” representa essa realidade social sem suavizá-la; o masculino é preservado em contraste com o termo feminino seguinte.
- source_word: אֲמָתוֹ
  choice: a escrava dele
  rationale: אָמָה designa uma escrava ou serva. Em paralelo com עֶבֶד e neste contexto de propriedade, “escrava” expressa melhor a condição social e mantém a distinção de gênero.
- source_word: שׁוֹרוֹ
  choice: o seu boi
  rationale: שׁוֹר designa um bovino, frequentemente um animal de trabalho. “Boi” é claro e natural neste contexto jurídico.
- source_word: חֲמֹרוֹ
  choice: o seu jumento
  rationale: חֲמוֹר designa o asno doméstico. “Jumento” é uma equivalência moderna, clara e digna em português.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: nem coisa alguma que pertença ao seu próximo
  rationale: A expressão funciona como uma cláusula abrangente. Esta formulação natural conserva tanto a totalidade quanto a ideia de pertencimento expressa por לְ.
- source_word: לֹא ... לֹא
  choice: Não cobice ... Não cobice
  rationale: A repetição da proibição é mantida para preservar a estrutura e a ênfase do hebraico.
theological_decisions:
- issue: Se בֵּית na primeira oração deve ser traduzido como “casa” ou ampliado para “família/casa e família”
  choice: casa
  alternative: família; casa e família; conjunto doméstico
  rationale: Embora בַּיִת possa indicar o conjunto doméstico, o versículo enumera depois esposa, escravos e animais. “Casa” evita redundância e respeita a progressão aparente do texto, sem ocultar a alternativa lexical, registrada em nota.
- issue: Tradução dos termos relativos à escravidão na legislação da aliança
  choice: escravo / escrava
  alternative: servo / serva
  rationale: A lista apresenta pessoas e animais sob a relação de pertencimento ao próximo, tornando saliente a condição de sujeição. “Escravo/escrava” evita amenizar a realidade social refletida pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega-se o imperativo negativo “Não cobice”, natural no português atual, mantendo-se a repetição enfática do hebraico. “Próximo” conserva a formulação ética tradicional sem recorrer a linguagem arcaica.
