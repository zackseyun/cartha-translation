  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: pt
  text: Não tenha outros deuses diante de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além de mim” ou “na minha presença”. O hebraico diz literalmente “diante da minha face”.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Não tenha
  rationale: A construção hebraica, literalmente próxima de “não haverá para você”, expressa posse ou relação e funciona aqui como proibição. “Não tenha” é natural em português, mantém o destinatário no singular e preserva a força imperativa.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: O substantivo plural, qualificado por “outros”, refere-se aqui a divindades rivais; “deuses” é a tradução direta e corrente.
- source_word: אֲחֵרִים
  choice: outros
  rationale: O adjetivo significa “outros” ou “diferentes”. “Outros deuses” é natural e evita especificar indevidamente “deuses estrangeiros”.
- source_word: עַל פָּנָי
  choice: diante de mim
  rationale: A expressão significa literalmente “diante da minha face”. “Diante de mim” conserva a imagem relacional e espacial do hebraico, enquanto as implicações de exclusividade são registradas na nota.
theological_decisions:
- issue: Sentido de עַל פָּנָי no primeiro mandamento
  choice: diante de mim
  alternative: além de mim; na minha presença
  rationale: O idioma hebraico pode indicar estar diante da face ou na presença de alguém e, neste contexto de aliança, implicar exclusividade. A tradução principal preserva a formulação concreta, sem reduzir a expressão a uma única interpretação; as alternativas aparecem na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. O singular “tenha” acompanha o destinatário singular do hebraico.
