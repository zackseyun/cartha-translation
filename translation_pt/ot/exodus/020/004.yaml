base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: pt
  text: Não faça para você uma imagem esculpida[a], nem qualquer representação[b] do que há nos céus acima, na terra abaixo ou nas águas debaixo da terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «imagem entalhada». O hebraico se refere especificamente a uma imagem feita por entalhe ou escultura; «ídolo» seria uma tradução mais interpretativa.
    reason: lexical_alternative
  - marker: b
    text: Ou «qualquer forma» ou «qualquer semelhança».
    reason: lexical_alternative
  - marker: c
    text: 'O versículo descreve os domínios da criação em termos cosmológicos antigos: os céus acima, a terra abaixo e as águas debaixo da terra.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: Não faça
  rationale: O imperfeito qal na segunda pessoa, com לֹא, expressa uma proibição direta. O imperativo negativo em português atual preserva a força normativa sem recorrer ao futuro solene e menos corrente «não farás».
- source_word: לְךָ
  choice: para você
  rationale: O dativo indica interesse pessoal e, neste contexto, tem sentido reflexivo. «Para você» é claro, natural e amplamente compreensível, especialmente para leitores brasileiros.
- source_word: פֶסֶל
  choice: imagem esculpida
  rationale: O substantivo designa uma imagem produzida por entalhe ou escultura. A escolha conserva essa especificidade material e evita «ídolo», que anteciparia uma interpretação cultual.
- source_word: וְכָל תְּמוּנָה
  choice: nem qualquer representação
  rationale: תְּמוּנָה pode indicar forma, semelhança ou representação. Depois de uma proibição, «nem qualquer» transmite naturalmente o valor inclusivo da conjunção e de כָּל.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: do que há nos céus acima
  rationale: Mantém o plural hebraico שָׁמַיִם e a orientação espacial do texto, em português natural.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: na terra abaixo
  rationale: A preposição בְּ é vertida de modo idiomático por «na», enquanto «abaixo» preserva o contraste vertical com «acima».
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: ou nas águas debaixo da terra
  rationale: A formulação conserva a imagem espacial das águas situadas sob a terra e completa a enumeração dos domínios da criação.
theological_decisions:
- issue: Alcance da proibição do segundo mandamento
  choice: Traduzir literalmente a proibição de produzir uma imagem esculpida ou qualquer representação, sem acrescentar no texto principal uma finalidade de culto.
  alternative: Verter פֶסֶל por «ídolo» ou acrescentar «para adoração»; ou formular o versículo como proibição explícita de toda arte visual.
  rationale: O versículo menciona imagens e representações dos domínios criados, enquanto o versículo seguinte explicita o ato de curvar-se e prestar culto. Não antecipar essa qualificação nem ampliar expressamente a proibição preserva a tensão e o alcance verbal do texto hebraico.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e compreensão internacional. Emprega o imperativo negativo corrente («Não faça») em vez do futuro solene («Não farás»), mantendo a cadência normativa do Decálogo. A enumeração é compacta e preserva a estrutura cosmológica do hebraico.
