  text: זָכ֛וֹר אֶת י֥וֹם הַ/שַּׁבָּ֖ת לְ/קַדְּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/008.yaml
  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: pt
  text: Lembre-se do dia de sábado, para santificá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para mantê-lo santo” ou “para separá-lo como santo”.
    reason: alternativa lexical
lexical_decisions:
- source_word: זָכוֹר
  choice: Lembre-se
  rationale: O imperativo qal masculino singular de זכר ordena uma recordação ativa. “Lembre-se” é direto, natural em português e conserva a força pactual do mandamento sem ampliá-lo para o mais interpretativo “observe”.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Marca o objeto direto definido em hebraico e não requer equivalente lexical em português.
- source_word: יוֹם
  choice: dia
  rationale: Equivalente corrente e preciso de יוֹם neste contexto.
- source_word: הַשַּׁבָּת
  choice: do sábado
  rationale: Designa o dia específico de cessação e descanso reconhecido pela aliança. “Sábado” é o termo bíblico estabelecido e amplamente inteligível em português.
- source_word: לְקַדְּשׁוֹ
  choice: para santificá-lo
  rationale: O infinitivo construto com sufixo masculino singular, da raiz קדשׁ, exprime a finalidade de tratar ou separar o dia como santo. “Santificá-lo” reproduz com concisão a linguagem de santidade do hebraico; a nota esclarece a formulação mais corrente.
theological_decisions:
- issue: Tradução da linguagem de קדשׁ no mandamento sobre o sábado
  choice: para santificá-lo
  alternative: para mantê-lo santo; para separá-lo como santo
  rationale: O hebraico pode indicar tornar, considerar ou tratar o dia como santo. A tradução conserva essa amplitude teológica sem reduzir o mandamento à simples observância ritual; a nota registra alternativas naturais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma pronominal “Lembre-se” soa natural, e “santificá-lo” preserva a força lexical e teológica do original; o referente masculino do pronome é “dia”.
