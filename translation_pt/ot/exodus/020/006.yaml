source:
  edition: WLC
  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/006.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: pt
  text: mas demonstro amor leal a milhares[a], aos que me amam e guardam os meus mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mil gerações” (compare Deuteronômio 5:10); aqui, o hebraico diz simplesmente “a milhares”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: mas demonstro
  rationale: O particípio dá continuidade à descrição da ação divina. No contexto, a conjunção introduz contraste com o juízo do versículo anterior; por isso, “mas” explicita naturalmente essa força, e o presente “demonstro” comunica a ação característica.
- source_word: חֶסֶד
  choice: amor leal
  rationale: חֶסֶד expressa amor, bondade e lealdade duradoura, especialmente no âmbito da aliança. “Amor leal” é atual e compreensível, preservando melhor essa amplitude do que apenas “misericórdia”.
- source_word: לַאֲלָפִים
  choice: a milhares
  rationale: O hebraico diz literalmente “aos milhares”, sem mencionar de forma explícita “gerações”. A formulação mantém a concisão e a ambiguidade do texto-fonte; a interpretação geracional é registrada em nota.
- source_word: לְאֹהֲבַי
  choice: aos que me amam
  rationale: O particípio com sufixo de primeira pessoa é vertido naturalmente como oração relativa, comunicando uma relação contínua de amor e lealdade.
- source_word: וּלְשֹׁמְרֵי
  choice: e guardam
  rationale: Com “mandamentos” como objeto, שׁמר significa observar, cumprir ou guardar. “Guardam” preserva a imagem lexical hebraica e é expressão corrente no registro bíblico em português.
- source_word: מִצְוֺתָי
  choice: os meus mandamentos
  rationale: “Mandamentos” mantém o teor jurídico e pactual do Decálogo. O artigo torna a frase natural em português sem alterar a referência.
theological_decisions:
- issue: Alcance de לַאֲלָפִים
  choice: a milhares
  alternative: a mil gerações; a milhares de gerações
  rationale: Êxodo 20:6 não contém a palavra “gerações”. O texto principal preserva o que está expresso no hebraico, enquanto a nota registra a interpretação geracional apoiada pelo paralelo de Deuteronômio 5:10.
- issue: Relação lógica com o versículo anterior
  choice: mas
  alternative: e
  rationale: A conjunção hebraica pode ser simplesmente aditiva, mas o contraste entre a punição anteriormente mencionada e o amor leal aqui descrito sustenta a tradução adversativa. A escolha esclarece a relação contextual sem alterar o conteúdo da oração.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Amor leal” preserva a densidade pactual de חֶסֶד sem recorrer a vocabulário arcaico. A formulação mantém a ambiguidade de “milhares” e evita inserir “gerações” no texto principal.
