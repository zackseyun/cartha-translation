  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: pt
  text: 'Moisés disse ao povo: “Não temam[a], pois Deus veio para pôr vocês à prova e para que o temor dele esteja diante de vocês[b][c], a fim de que não pequem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tenham medo”. O hebraico usa aqui a mesma raiz empregada depois em “o temor dele”, criando um contraste deliberado entre o pavor e o devido temor de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a reverência por ele”. O substantivo hebraico pode indicar tanto medo quanto temor reverente.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sobre o rosto de vocês”, expressão que indica algo mantido diante da pessoa ou continuamente presente à sua consciência.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: Preserva a raiz conceitual comum com יִרְאָתוֹ (“o temor dele”) e, em português natural, mantém o contraste deliberado entre o medo que paralisa e o temor adequado diante de Deus.
- source_word: לְבַעֲבוּר
  choice: para
  rationale: Introduz de modo claro e idiomático a finalidade da vinda de Deus.
- source_word: נַסּוֹת
  choice: pôr vocês à prova
  rationale: Expressa o sentido de testar ou comprovar sem sugerir indução ao mal; a locução é corrente e clara em português.
- source_word: בָּא
  choice: veio
  rationale: O perfeito hebraico descreve a vinda de Deus na cena imediata do Sinai; o pretérito perfeito é natural em português e conserva o evento como realizado.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O substantivo refere-se ao Deus de Israel e não emprega o nome divino YHWH; “Deus” é a correspondência direta.
- source_word: וּבַעֲבוּר
  choice: e para que
  rationale: Marca a segunda finalidade e introduz naturalmente uma oração finita em português.
- source_word: יִרְאָתוֹ
  choice: o temor dele
  rationale: Mantém a ligação lexical com “Não tenham medo” e preserva a amplitude semântica entre medo e reverência, sem resolver interpretativamente a tensão.
- source_word: עַל־פְּנֵיכֶם
  choice: diante de vocês
  rationale: Traduz de maneira idiomática a expressão literalmente associada ao rosto, comunicando algo mantido perante a pessoa ou presente à consciência.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: a fim de que não pequem
  rationale: Expressa com clareza a finalidade negativa da construção hebraica e evita uma repetição estilisticamente pesada de “para que”.
theological_decisions:
- issue: Tensão aparente entre “Não tenham medo” e “o temor dele”
  choice: Preservar no texto principal o campo lexical de medo/temor
  alternative: Traduzir “Não fiquem assustados” e “a reverência por ele”
  rationale: O hebraico usa a mesma raiz nas duas expressões, contrastando o pavor proibido com o temor apropriado de Deus. A tradução mantém essa tensão em vez de explicá-la no corpo do texto.
- issue: Natureza da prova divina
  choice: Traduzir נַסּוֹת como “pôr vocês à prova”
  alternative: “testar vocês” ou “comprovar vocês”
  rationale: A formulação comunica exame ou prova sem atribuir a Deus a intenção de induzir ao pecado, ideia que o versículo não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. “Não tenham medo” e “o temor dele” preservam a repetição significativa da raiz hebraica; “diante de vocês” verte o idioma hebraico sem rigidez literal.
