  text: וַ/יַּעֲמֹ֥ד הָ/עָ֖ם מֵ/רָחֹ֑ק וּ/מֹשֶׁה֙ נִגַּ֣שׁ אֶל הָֽ/עֲרָפֶ֔ל אֲשֶׁר שָׁ֖ם הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: pt
  text: O povo ficou à distância, e Moisés se aproximou da escuridão densa[a] onde Deus estava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nuvem escura” ou “trevas”. O termo hebraico pode indicar uma escuridão densa associada à manifestação de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: ficou
  rationale: O wayyiqtol de עמד descreve aqui a posição mantida pelo povo. “Ficou” é natural em português e, com o complemento locativo, comunica que o povo permaneceu afastado.
- source_word: הָעָם
  choice: o povo
  rationale: O substantivo definido se refere ao povo reunido no Sinai; não é necessário acrescentar “de Israel”.
- source_word: מֵרָחֹק
  choice: a distância
  rationale: Expressa separação espacial de modo claro e corrente. A locução pode ser escrita sem crase quando tomada em sentido indeterminado.
- source_word: נִגַּשׁ
  choice: se aproximou
  rationale: Reproduz o sentido de chegar perto ou aproximar-se, em linguagem portuguesa atual.
- source_word: הָעֲרָפֶל
  choice: a escuridão densa
  rationale: עֲרָפֶל designa escuridão espessa, trevas ou obscuridade associada à manifestação divina. “Escuridão densa” conserva a imagem concreta sem interpretá-la obrigatoriamente como uma nuvem.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: onde Deus estava
  rationale: A oração relativa identifica o lugar da presença divina. A formulação é natural e fiel, sem acrescentar explicitamente “presente”.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים se refere inequivocamente ao Deus de Israel e deve ser traduzido no singular.
theological_decisions:
- issue: A manifestação divina associada à obscuridade
  choice: escuridão densa onde Deus estava
  alternative: nuvem escura; trevas onde Deus estava
  rationale: A tradução mantém o paradoxo do Deus presente em uma obscuridade inacessível, sem reduzir a imagem a um fenômeno meteorológico nem explicar seu simbolismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e preserva a solenidade e a tensão da cena no Sinai.
