review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva corretamente a repetição de נשא («levar») e a advertência judicial de ינקה («não deixará impune»), bem como o nome Yahweh. Contudo, «para o que é falso e vazio» não corresponde bem à construção hebraica לַשָּׁוְא: em português, soa como uma finalidade dirigida a uma entidade («o que é...»), em vez de qualificar o modo/uso de levar o nome. «Em falsidade ou vazio» preserva melhor a amplitude semântica e funciona naturalmente nos dois membros.'
  naturalness: «Levar o nome» é compreensível e adequadamente literal. A formulação «para o que é falso e vazio», porém, é pouco idiomática e pesada, sobretudo em sua repetição. «Em falsidade ou vazio» é mais direta, formal e legível em português internacional.
  terminology: Yahweh, «seu Deus», «não deixará impune» e «quem levar o nome dele» são adequados. A nota deve acompanhar a correção da formulação principal e pode explicar que a expressão hebraica abrange falsidade e vacuidade, sem restringi-la a um só tipo de infração.
  issues:
