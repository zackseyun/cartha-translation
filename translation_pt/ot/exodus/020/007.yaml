  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: pt
  text: Não leve o nome de Yahweh, seu Deus, em falsidade ou vazio[a], pois Yahweh não deixará impune quem levar o nome dele em falsidade ou vazio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente: “Não tome o nome do SENHOR, seu Deus, em vão”. O hebraico diz literalmente “não leve/carregue o nome ... para o vazio/falsidade” e pode abranger juramentos falsos, invocação vazia e representação indevida de Yahweh.'
    reason: Explica a amplitude de לַשָּׁוְא, registra a tradução tradicional e evita limitar a proibição a um único tipo de uso do nome divino.
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: leve / levar
  rationale: O verbo נשא significa levantar, carregar ou levar. “Levar o nome” conserva a imagem concreta e a repetição entre a proibição e sua justificativa, sem restringir prematuramente o sentido ao uso verbal do nome.
- source_word: שֵׁם / שְׁמוֹ
  choice: nome / o nome dele
  rationale: Mantém o termo hebraico e expressa de modo claro a referência à identidade, reputação e reivindicação pactual de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva o tratamento direto no singular e sua força pessoal e pactual.
- source_word: לַשָּׁוְא
  choice: para o que é falso e vazio
  rationale: שָׁוְא abrange falsidade, vazio, inutilidade e falta de valor. A expressão portuguesa conserva essa amplitude melhor que uma formulação limitada apenas à blasfêmia ou ao juramento falso.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, a razão da proibição.
- source_word: יְנַקֶּה (נקה)
  choice: não deixará impune
  rationale: 'Comunica com clareza a força judicial do piel: Yahweh não livrará de culpa ou punição quem agir assim.'
- source_word: אֲשֶׁר
  choice: quem
  rationale: Expressa de forma corrente e inclusiva qualquer pessoa que corresponda à descrição.
theological_decisions:
- issue: Alcance da proibição relativa ao nome divino
  choice: Proibição ampla de levar o nome de Yahweh para o que é falso, vazio ou indigno.
  alternative: Limitar o mandamento a juramentos falsos, profanação verbal ou uso casual do nome.
  rationale: A combinação de נשא, שֵׁם e שָׁוְא permite referência a juramentos falsos, invocação vazia e representação indevida de Yahweh. O texto principal preserva essa amplitude.
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: “Yahweh” conserva no texto o nome pessoal representado pelo Tetragrama.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Levar o nome” preserva deliberadamente a metáfora hebraica; “para o que é falso e vazio” esclarece seu campo sem eliminar a tensão semântica.
