    issue: Formulação de לַשָּׁוְא como «para o que é falso e vazio»
    rationale: Embora procure transmitir os sentidos de falsidade e vazio, essa locução introduz em português uma relação final pouco natural e não espelha bem o valor adverbial/preposicional da expressão hebraica. Além disso, «falso e vazio» como coordenação pode sugerir que ambos os sentidos devem estar presentes simultaneamente. «Em falsidade ou vazio» mantém o campo semântico amplo e a repetição do original.
