  yaml_path: translation/ot/exodus/020/014.yaml
  text: You shall not commit adultery.
translation:
  language: pt
  text: Não cometa adultério.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: A negação hebraica לֹא, com o imperfeito na linguagem jurídica da aliança, expressa aqui uma proibição categórica. Em português moderno, “não” com o presente do subjuntivo transmite essa força com naturalidade.
- source_word: תִּנְאָף
  choice: cometa adultério
  rationale: O verbo נאף no qal significa cometer adultério. A expressão portuguesa “cometer adultério” é clara, consagrada e semanticamente precisa neste contexto legal.
theological_decisions:
- issue: Forma da proibição no Decálogo
  choice: Não cometa adultério.
  alternative: Não cometerás adultério.
  rationale: O hebraico usa לֹא com o imperfeito da segunda pessoa masculina singular em formulação proibitiva da aliança. “Não cometa” preserva o caráter direto e categórico do mandamento em português atual, enquanto “não cometerás” é mais tradicional, mas pode soar como simples futuro ou linguagem arcaizante.
- issue: Alcance da forma verbal masculina singular
  choice: Segunda pessoa singular sem marca explícita de gênero
  alternative: Formulação explicitamente dirigida a um homem
  rationale: Embora a forma hebraica seja masculina singular, ela se dirige representativamente ao membro da comunidade da aliança. A forma portuguesa escolhida mantém o singular e não acrescenta uma limitação masculina que a função jurídica do mandamento não exige.
translation_notes:
  register: Português moderno, claro e digno, com formulação direta própria de uma proibição solene. A redação evita arcaísmo desnecessário sem enfraquecer a força normativa do mandamento.
