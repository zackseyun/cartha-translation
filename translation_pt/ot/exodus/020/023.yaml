base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: pt
  text: Não façam deuses de prata ao meu lado[a], nem façam para vocês deuses de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comigo” ou “junto de mim”. O hebraico diz literalmente “comigo”; “ao meu lado” é uma tradução contextual que realça a proibição de deuses rivais.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: façam
  rationale: Neste contexto, עשה se refere à produção de objetos de culto. “Fazer” é direto, natural e não especifica além do texto o modo de fabricação.
- source_word: אִתִּי
  choice: para pôr ao meu lado
  rationale: A expressão é literalmente “comigo”. Em português, “para pôr ao meu lado” comunica com naturalidade a relação proibida entre esses deuses e o SENHOR, sem substituir o texto por uma formulação doutrinária mais explícita.
- source_word: אֱלֹהֵי כֶסֶף
  choice: deuses de prata
  rationale: Reproduz de modo direto a cadeia construta hebraica e identifica a matéria dos objetos cultuais.
- source_word: וֵאלֹהֵי זָהָב
  choice: nem façam para vocês deuses de ouro
  rationale: A repetição do verbo e da negação forma uma segunda proibição paralela, preservada em português por “nem façam”.
- source_word: לָכֶם
  choice: para vocês
  rationale: Representa o dativo plural de modo claro e corrente em português internacional com boa legibilidade brasileira, sem impor necessariamente um valor reflexivo.
- source_word: לֹא ... לֹא
  choice: Não façam ... nem façam
  rationale: Preserva as duas proibições coordenadas e sua força direta, usando um registro legal solene, mas atual.
theological_decisions:
- issue: Se אִתִּי deve ser vertido de forma mais interpretativa para explicitar a exclusividade do culto
  choice: para pôr ao meu lado
  alternative: comigo; junto de mim; ao lado de mim
  rationale: O hebraico diz literalmente “comigo”. A redação escolhida torna a sintaxe natural em português e sugere a colocação de divindades rivais junto ao SENHOR, enquanto a nota conserva a forma literal e reconhece a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e direto. Emprega-se “vocês” para o plural de segunda pessoa, com formas verbais de terceira pessoa, visando ampla inteligibilidade internacional e leitura natural no Brasil.
