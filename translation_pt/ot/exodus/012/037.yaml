  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מֵ/רַעְמְסֵ֖ס סֻכֹּ֑תָ/ה כְּ/שֵׁשׁ מֵא֨וֹת אֶ֧לֶף רַגְלִ֛י הַ/גְּבָרִ֖ים לְ/בַ֥ד מִ/טָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: pt
  text: 'Os israelitas[a] partiram[b] de Ramessés para Sucote: cerca de seiscentos mil homens a pé,[c] sem contar as crianças.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “levantaram acampamento”. O verbo hebraico pode indicar a partida de um acampamento e o início de uma jornada.
    reason: lexical_alternative
  - marker: c
    text: A cifra se refere aos homens que viajavam a pé; as crianças não estão incluídas nessa contagem.
    reason: cultural_note
  - marker: d
    text: Ou “os pequenos”. O termo hebraico pode designar crianças ou pequenos dependentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: O verbo נסע, neste contexto de deslocamento, indica levantar acampamento e iniciar uma jornada. “Partiram” é natural em português e preserva esse sentido.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a expressão hebraica signifique literalmente “os filhos de Israel”, “os israelitas” comunica naturalmente a identidade coletiva em português moderno; a forma literal é preservada em nota.
- source_word: מֵרַעְמְסֵס
  choice: de Ramessés
  rationale: A preposição מִן indica o ponto de origem. “Ramessés” é uma transliteração portuguesa corrente do topônimo.
- source_word: סֻכֹּתָה
  choice: para Sucote
  rationale: O hê direcional anexado ao nome do lugar expressa movimento em direção ao destino, representado naturalmente por “para”.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: cerca de seiscentos mil
  rationale: O prefixo כְּ diante do numeral assinala aproximação; “cerca de” evita apresentar a cifra como rigidamente exata.
- source_word: רַגְלִי הַגְּבָרִים
  choice: homens a pé
  rationale: A expressão identifica homens que viajavam a pé. A formulação é concisa, idiomática e mantém explícito que a contagem se refere aos homens.
- source_word: לְבַד מִטָּף
  choice: sem contar as crianças
  rationale: לְבַד מִן exclui um grupo da cifra anterior, e טַף designa crianças ou pequenos dependentes. “Sem contar as crianças” torna clara essa relação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “israelitas” no texto principal por naturalidade e registra a expressão hebraica literal em nota. Os dois-pontos introduzem a informação numérica sem alterar sua relação sintática com a partida.
