  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: pt
  text: O animal do rebanho[a] deverá ser sem defeito, macho e de um ano; vocês o tomarão dentre as ovelhas ou dentre as cabras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico שֶׂה designa um animal miúdo do rebanho e pode referir-se a um cordeiro ou a um cabrito; a cláusula seguinte explicita que ele pode ser tomado dentre as ovelhas ou dentre as cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: animal
  rationale: O termo hebraico designa genericamente um animal de pequeno porte do rebanho, que pode ser cordeiro ou cabrito. “Animal” evita restringir indevidamente o sentido, enquanto a cláusula final especifica as duas possibilidades.
- source_word: תָמִים
  choice: sem defeito
  rationale: No contexto sacrificial, indica um animal íntegro, sem falha física que o desqualifique; “sem defeito” é claro e natural em português.
- source_word: זָכָר
  choice: macho
  rationale: É a designação biológica direta e adequada para o animal.
- source_word: בֶּן שָׁנָה
  choice: de um ano
  rationale: Reproduz de modo idiomático a expressão hebraica, que se refere a um animal de um ano ou em seu primeiro ano de vida.
- source_word: יִהְיֶה לָכֶם
  choice: será
  rationale: Mantém o valor prescritivo da forma verbal no contexto das instruções, sem traduzir rigidamente o dativo לָכֶם.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: dentre os cordeiros ou dentre os cabritos
  rationale: A formulação identifica as duas categorias permitidas. O “ou” explicita corretamente a alternativa prática expressa pelo hebraico contextual.
- source_word: תִּקָּחוּ
  choice: vocês o escolherão
  rationale: A forma de segunda pessoa do plural tem força instrutiva. “Escolherão” é natural no contexto da seleção do animal e o pronome retoma o animal singular.
