  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: pt
  text: Foi uma noite de vigília para Yahweh[a], a fim de tirá-los da terra do Egito. Esta mesma noite é uma vigília para Yahweh, para todos os filhos de Israel ao longo de suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma noite de vigilância” ou “uma noite de observância”. O hebraico שִׁמֻּרִים envolve a ideia de vigiar ou guardar e pode também indicar uma observância comemorativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: noite de vigília
  rationale: Preserva a construção hebraica e a amplitude de שִׁמֻּרִים, que pode envolver tanto vigilância quanto observância comemorativa.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica relação ou dedicação; “para Yahweh” mantém essa abertura sem especificar além do texto.
- source_word: לְהוֹצִיאָם
  choice: a fim de tirá-los
  rationale: Expressa naturalmente o valor final do infinitivo com ל e mantém Yahweh como agente implícito da libertação.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Conserva o substantivo explícito אֶרֶץ, sem reduzi-lo simplesmente a “do Egito”.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: Essa mesma noite
  rationale: Transmite a identificação enfática produzida pelo pronome retomado e pelo demonstrativo.
- source_word: שִׁמֻּרִים לְכָל בְּנֵי יִשְׂרָאֵל
  choice: uma vigília ... a ser guardada por todos os filhos de Israel
  rationale: A formulação portuguesa torna explícita a participação de Israel sugerida pela relação com שִׁמֻּרִים, sem reduzi-la exclusivamente a ritual ou a vigilância física.
- source_word: לְדֹרֹתָם
  choice: ao longo de suas gerações
  rationale: Forma idiomática que comunica continuidade entre gerações sem acrescentar a ideia de perpetuidade absoluta.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Reproduz o nome pessoal da aliança presente no hebraico, em vez de substituí-lo por um título.
- issue: Sentido de שִׁמֻּרִים no contexto histórico e cultual
  choice: vigília
  alternative: vigilância; observância
  rationale: “Vigília” preserva a tensão entre o ato de velar e a comemoração sagrada, sem restringir o termo a apenas um desses sentidos.
- issue: Relação da segunda ocorrência de שִׁמֻּרִים com Israel
  choice: a ser guardada por todos os filhos de Israel
  alternative: uma vigília para todos os filhos de Israel
  rationale: Em português, “para Yahweh para todos” seria pouco claro. “A ser guardada” recupera a ideia lexical de שׁמר e comunica que a noite deve ser observada por Israel, mantendo a possível nuance de vigilância.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “Yahweh”, “terra do Egito” e “filhos de Israel”; a pontuação divide as duas metades do versículo para maior clareza.
