    rationale: O hebraico diz literalmente que esta noite é «vigílias para Yahweh, para todos os filhos de Israel, por suas gerações». Embora o substantivo possa comportar a noção de observância, o texto não traz aqui um particípio ou verbo que autorize explicitar «a ser guardada». A formulação resolve interpretativamente uma ambiguidade que deve ser preservada.
