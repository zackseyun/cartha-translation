  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: pt
  text: E todos os filhos de Israel fizeram conforme Yahweh[a] havia ordenado a Moisés e a Arão; assim fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: E ... fizeram
  rationale: O verbo עשה significa comumente “fazer”. Neste contexto, descreve o cumprimento de uma ordem e é repetido no fim do versículo; a mesma forma portuguesa preserva essa repetição.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: כָּל expressa a totalidade do grupo, e בְּנֵי יִשְׂרָאֵל é literalmente “filhos de Israel”. A formulação tradicional é inteligível em português e conserva a expressão etnofamiliar hebraica.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Introduz conformidade com a ordem recebida. “Conforme” é natural, conciso e comunica que a ação correspondeu ao mandamento.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto explicita naturalmente em português que a ordem precedeu seu cumprimento, sem atribuir ao perfeito hebraico uma distinção temporal rígida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: Os marcadores de objeto direto apresentam Moisés e Arão como aqueles a quem Yahweh ordenou. Em português, “ordenar algo a alguém” expressa essa relação sem introduzir a ideia interpretativa de mediação contida em “por meio de”.
- source_word: כֵּן עָשׂוּ
  choice: assim fizeram
  rationale: כֵּן retoma e enfatiza a correspondência exata com a ordem. A frase conserva a repetição enfática de עשה no encerramento.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal e evita substituí-lo silenciosamente pelo título tradicional.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A expressão hebraica é formalmente masculina e etnofamiliar. A tradução principal preserva essa forma, sem excluir o sentido coletivo convencional de todo o povo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se a repetição enfática do hebraico (“fizeram ... assim fizeram”) e a construção tradicional “filhos de Israel”. O artigo não é usado antes de “Yahweh”, tratando-o como nome próprio.
