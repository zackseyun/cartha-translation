source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: pt
  text: Pois Yahweh passará pelo Egito para feri-lo e, quando vir o sangue na verga e nas duas ombreiras, Yahweh passará por cima da entrada[a] e não permitirá que o destruidor[b] entre nas casas de vocês para ferir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poupará” ou “protegerá”. O verbo hebraico é o que está associado à Páscoa.
    reason: lexical_alternative
  - marker: b
    text: O hebraico não especifica a identidade do “destruidor”; alguns entendem que se trata de um agente angélico de juízo.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְעָבַר
  choice: passará
  rationale: Neste primeiro uso, עבר descreve o movimento de Yahweh para executar o juízo contra o Egito; não deve ser confundido com פסח, empregado mais adiante.
- source_word: לִנְגֹּף
  choice: para ferir
  rationale: נגף indica aqui um golpe de juízo mortal. “Ferir” é atual, claro e mantém a gravidade sem linguagem arcaica.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Forma portuguesa padrão para o nome do país; no contexto, abrange o Egito como alvo do juízo.
- source_word: וְרָאָה
  choice: quando vir
  rationale: A forma verbal dá continuidade à referência futura da sequência e tem valor temporal natural neste contexto.
- source_word: הַדָּם
  choice: o sangue
  rationale: Referência definida ao sangue anteriormente aplicado à casa.
- source_word: הַמַּשְׁקוֹף
  choice: a verga
  rationale: משקוף designa a peça horizontal superior do vão da porta; “verga” é o termo arquitetônico preciso e corrente.
- source_word: שְׁתֵּי הַמְּזוּזוֹת
  choice: as duas ombreiras
  rationale: מזוזות são os dois elementos verticais laterais do vão da porta; “ombreiras” é preciso e evita confusão com a própria porta.
- source_word: וּפָסַח
  choice: passará por cima
  rationale: Mantém a imagem espacial e a ligação lexical tradicional de פסח com a Páscoa, sem apagar as possibilidades contextuais de poupar ou proteger.
- source_word: עַל הַפֶּתַח
  choice: da entrada
  rationale: פתח refere-se ao vão ou entrada da casa. “Entrada” é natural em português e distingue o vão dos elementos estruturais mencionados antes.
- source_word: וְלֹא יִתֵּן
  choice: não permitirá
  rationale: נתן seguido de infinitivo tem aqui o sentido idiomático de permitir; esta formulação é clara e natural.
- source_word: הַמַּשְׁחִית
  choice: o destruidor
  rationale: Traduz o agente substantivado sem acrescentar uma identidade angélica que o hebraico não explicita.
theological_decisions:
- issue: Relação entre Yahweh e “o destruidor”
  choice: Manter Yahweh e o destruidor como referências distintas na construção da frase.
  alternative: Identificar o destruidor com o próprio Yahweh ou especificá-lo como um anjo destruidor.
  rationale: O hebraico menciona יְהוָה e הַמַּשְׁחִית distintamente e afirma que Yahweh impede a entrada do destruidor. A tradução preserva essa tensão sem definir além do texto a identidade do agente.
- issue: Sentido de פסח neste versículo
  choice: Traduzir por “passará por cima” no texto principal.
  alternative: “Poupará” ou “protegerá”.
  rationale: A opção conserva a identidade lexical do verbo central à narrativa da Páscoa, enquanto a nota registra sentidos contextualmente possíveis. A proteção já fica evidente no fato de Yahweh não permitir a entrada do destruidor.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “casas de vocês” em vez de uma forma regional de segunda pessoa. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem: [a] após a expressão que traduz פסח e [b] após “destruidor”.'
