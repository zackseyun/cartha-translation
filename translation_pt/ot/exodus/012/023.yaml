  naturalness: O português é moderno, claro e de registro apropriado. «Verga», «ombreiras» e «destruidor» são termos adequados no contexto. «Passará pelo Egito para feri-lo» é igualmente natural e torna explícito o movimento indicado pelo hebraico.
  terminology: «Yahweh», «verga», «ombreiras», «passará por cima», «entrada» e «o destruidor» são escolhas terminologicamente defensáveis. As notas mantêm corretamente a ambiguidade de פסח e a identidade não especificada do destruidor.
