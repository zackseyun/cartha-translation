  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: pt
  text: 'Yahweh disse a Moisés e a Arão: “Este é o estatuto da Páscoa: nenhum estrangeiro[a] poderá comer dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filho da condição estrangeira”. A expressão designa um estrangeiro.
    reason: Registra o idioma hebraico subjacente sem sobrecarregar o texto principal nem definir além do que a frase afirma.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: É a forma narrativa natural e direta de traduzir o verbo אמר neste contexto.
- source_word: חֻקַּת
  choice: estatuto
  rationale: Preserva o tom jurídico de uma determinação estabelecida, sem recorrer a linguagem excessivamente arcaica.
- source_word: הַפָּסַח
  choice: da Páscoa
  rationale: O termo pode designar a celebração e, neste contexto, aquilo de que se participa comendo; a formulação conserva essa amplitude.
- source_word: בֶּן נֵכָר
  choice: estrangeiro
  rationale: Traduz naturalmente a expressão idiomática hebraica, literalmente 'filho do estrangeiro/da condição estrangeira', sem acrescentar ao texto uma qualificação não expressa neste versículo.
- source_word: לֹא יֹאכַל בּוֹ
  choice: não poderá comer dela
  rationale: Expressa com clareza a proibição legal; 'dela' retoma naturalmente 'Páscoa' em português e representa a construção preposicional hebraica.
theological_decisions:
- issue: Identidade de quem é excluído da refeição pascal
  choice: estrangeiro
  alternative: estrangeiro de fora da comunidade da aliança; incircunciso
  rationale: A expressão hebraica deste versículo diz apenas 'filho da condição estrangeira', isto é, 'estrangeiro'. O contexto posterior esclarece os limites da participação, mas não convém inseri-los antecipadamente na tradução.
translation_notes:
  register: Português atual, claro e digno, com construção jurídica compreensível. O marcador foi colocado após “estrangeiro”, termo ao qual a nota lexical se refere.
