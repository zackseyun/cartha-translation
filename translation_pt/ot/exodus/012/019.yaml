  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: pt
  text: Durante sete dias, não se encontre fermento em suas casas, pois quem comer qualquer coisa fermentada será cortado da comunidade de Israel[a], seja estrangeiro residente[b] ou natural da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica «será cortado» pode indicar exclusão, morte ou juízo divino, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou «imigrante residente».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: Expressa naturalmente em português a duração indicada pelo acusativo temporal hebraico.
- source_word: שְׂאֹר
  choice: fermento
  rationale: Designa o agente fermentador, não os alimentos fermentados em geral; é claro no contexto ritual e mais abrangente que uma referência específica a pão.
- source_word: לֹא יִמָּצֵא
  choice: não se encontre
  rationale: 'Preserva a forma passiva e a força proibitiva: o fermento não deve estar presente nas casas.'
- source_word: בְּבָתֵּיכֶם
  choice: em suas casas
  rationale: Mantém o plural concreto do hebraico e é natural tanto no uso brasileiro quanto no português internacional.
- source_word: כָּל אֹכֵל מַחְמֶצֶת
  choice: quem comer qualquer coisa fermentada
  rationale: A construção participial com כָּל tem sentido genérico, e מַחְמֶצֶת é mais amplo que pão fermentado.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: será eliminado
  rationale: נפש refere-se aqui à pessoa; a formulação mantém a imagem da sanção de ser cortado do grupo sem definir seu modo preciso.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: da comunidade de Israel
  rationale: Comunidade comunica de modo atual e digno o grupo coletivo e pactual indicado por עֵדָה.
- source_word: בַּגֵּר
  choice: estrangeiro residente
  rationale: גֵּר designa um não nativo que vive entre Israel; a expressão evita tanto arcaísmo quanto categorias políticas modernas inadequadas.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: natural da terra
  rationale: Preserva o contraste social com o estrangeiro residente sem introduzir a noção moderna de cidadania.
theological_decisions:
- issue: Sentido da pena pactual expressa por כרת
  choice: será eliminado da comunidade
  alternative: será excluído da comunidade; será morto; aquela pessoa será cortada
  rationale: O idioma hebraico pode envolver exclusão, morte ou juízo divino conforme o contexto. A tradução conserva sua força pactual sem decidir além do que o versículo especifica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não se encontre” preserva o tom legal sem soar excessivamente arcaico; “comunidade” é mais corrente que “congregação” neste contexto social e pactual.
