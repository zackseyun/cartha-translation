  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: pt
  text: Levem tanto os seus rebanhos de ovelhas e cabras como o seu gado, como vocês disseram, e vão. E abençoem também a mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abençoem até mesmo a mim”. As palavras de Faraó podem enfatizar que ele próprio também pede uma bênção quando Israel parte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: também os seus rebanhos de ovelhas e cabras e o seu gado
  rationale: A correlação גַּם...גַּם inclui as duas categorias. A explicitação de צֹאן como rebanhos de ovelhas e cabras distingue com clareza o gado miúdo de בָּקָר, o gado bovino.
- source_word: קְחוּ
  choice: Levem
  rationale: O imperativo plural de לקח, neste contexto de partida, ordena que levem consigo os animais; em português, “levem” expressa isso mais naturalmente do que “tomem”.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: como vocês disseram
  rationale: Conserva a referência ao pedido anteriormente formulado por Moisés e Arão e a concessão de Faraó, em linguagem natural.
- source_word: וָלֵכוּ
  choice: e vão
  rationale: Mantém a forma direta do imperativo de הלך; no contexto, significa partir.
- source_word: וּבֵרַכְתֶּם
  choice: E abençoem
  rationale: O piel de ברך significa aqui “abençoar”. A tradução não especifica se isso envolve intercessão, favor divino ou uma despedida acompanhada de bênção.
- source_word: גַּם אֹתִי
  choice: também a mim
  rationale: Preserva o foco aditivo de גַּם sobre o próprio Faraó. A construção “a mim” é gramatical após o verbo transitivo e dá ênfase natural em português.
theological_decisions:
- issue: Natureza do pedido de Faraó por bênção
  choice: 'Traduzir como um pedido direto: “abençoem também a mim”'
  alternative: Entender especificamente como pedido de intercessão diante do Deus de Israel ou como simples despedida benevolente
  rationale: O verbo ברך é inequívoco quanto a “abençoar”, mas o texto não explica o meio nem o alcance da bênção solicitada. A formulação mantém essa tensão sem impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural. “Rebanhos de ovelhas e cabras” explicita o coletivo hebraico צֹאן, enquanto “gado” traduz בָּקָר de modo corrente. A divisão em duas frases preserva a força urgente das ordens e destaca o pedido final de Faraó.
