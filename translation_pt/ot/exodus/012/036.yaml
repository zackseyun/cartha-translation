  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: pt
  text: E Yahweh concedeu ao povo favor aos olhos dos egípcios, e estes lhes concederam o que pediram[a]. Assim, os israelitas despojaram o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo a tradução mais tradicional: “emprestaram-lhes”. O verbo hebraico pode ser entendido aqui como emprestar ou como conceder o que foi pedido.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico e acompanha a camada de consulta fornecida, sem substituí-lo por um título.
- source_word: נָתַן אֶת־חֵן
  choice: fez com que o povo encontrasse favor
  rationale: Expressa em português natural a construção hebraica literalmente equivalente a dar o favor do povo diante de alguém, preservando Yahweh como agente.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: aos olhos dos egípcios
  rationale: Conserva o conhecido idioma hebraico de avaliação e entende מִצְרַיִם aqui coletivamente como os egípcios.
- source_word: וַיַּשְׁאִלוּם
  choice: estes lhes deram o que pediram
  rationale: No contexto, o hifil de שאל indica uma resposta favorável às solicitações dos israelitas. A formulação evita impor a expectativa de devolução própria de um empréstimo, mantendo essa leitura possível em nota.
- source_word: וַיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: Assim, eles despojaram o Egito
  rationale: O piel de נצל comunica retirar bens ou despojar. “Assim” explicita naturalmente o resultado narrativo sem acrescentar uma causa alheia ao texto.
theological_decisions:
- issue: Se וַיַּשְׁאִלוּם descreve empréstimo ou concessão do que foi pedido
  choice: estes lhes deram o que pediram
  alternative: estes lhes emprestaram
  rationale: A forma verbal e o contexto admitem discussão. O texto principal comunica a resposta favorável dos egípcios sem sugerir indevidamente uma transação comercial com obrigação de restituição; a leitura tradicional é preservada em nota.
- issue: Identificação do referente de “eles” em וַיְנַצְּלוּ
  choice: eles, isto é, os israelitas, despojaram o Egito
  alternative: 'uma formulação passiva: o Egito foi despojado'
  rationale: A concordância e o fluxo narrativo favorecem os israelitas como sujeito implícito. Mantém-se o pronome no texto, sem inserir uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “aos olhos” preserva o colorido hebraico; “despojaram” mantém a força do verbo sem soar coloquial. O ponto antes de “Assim” evita um período excessivamente carregado e torna clara a consequência.
