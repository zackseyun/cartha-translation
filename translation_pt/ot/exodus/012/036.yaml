    rationale: Em português, o antecedente plural mais próximo é “os egípcios”, embora o sujeito de וַיְנַצְּלוּ no contexto seja o povo de Israel. A explicitação elimina uma ambiguidade introduzida pela tradução.
  revised_text: E Yahweh concedeu ao povo favor aos olhos dos egípcios, e estes lhes concederam o que pediram[a]. Assim, os israelitas despojaram o Egito.
