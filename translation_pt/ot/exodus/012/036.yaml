  source_fidelity: 'A revisão preserva a sequência e o sentido do hebraico: Yahweh concede favor ao povo perante os egípcios; estes atendem ao pedido; os israelitas despojam o Egito. A formulação principal para וַיַּשְׁאִלוּם mantém o sentido contextual de concessão, e a alternativa tradicional de empréstimo permanece assinalada em nota.'
  naturalness: “Concedeu ao povo favor aos olhos dos egípcios” é direto, digno e natural em português bíblico moderno. A explicitação de “os israelitas” evita que “eles” seja lido, em português, como retomando os egípcios, o sujeito imediatamente anterior.
