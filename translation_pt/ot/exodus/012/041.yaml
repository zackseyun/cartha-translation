review_pass:
  verdict: revise
  source_fidelity: O sentido temporal, a duração de 430 anos, a ênfase em «naquele mesmo dia», o nome Yahweh e «da terra do Egito» estão corretamente representados. Contudo, «contingentes» enfraquece a conotação militar-organizacional de צִבְאוֹת; «exércitos» é o equivalente português mais direto neste contexto e pode ser qualificado pela nota.
  naturalness: «E aconteceu que, ao fim de..., naquele mesmo dia...» soa pesado e sintaticamente pouco fluente em português moderno, além de fazer a fórmula narrativa parecer introduzir inadequadamente toda a oração. Uma coordenação narrativa simples preserva o ו inicial com maior naturalidade.
  terminology: «Yahweh» reproduz adequadamente o Tetragrama. Para צִבְאוֹת, «exércitos» é moderno, claro e semanticamente mais próximo do que «contingentes»; a nota pode registrar «tropas» e «hostes» como alternativas.
  issues:
  - severity: medium
    issue: «Contingentes» para צִבְאוֹת
    rationale: Embora possa indicar grupos organizados, o termo é excessivamente genérico e não comunica adequadamente o campo semântico de forças ou divisões militares presente em צָבָא/צִבְאוֹת.
  - severity: low
    issue: Construção «E aconteceu que, ao fim de...»
    rationale: A formulação é menos idiomática em português moderno e torna a progressão narrativa desnecessariamente pesada. O hebraico pode ser expresso com uma coordenação simples sem reproduzir mecanicamente cada ocorrência de וַיְהִי.
  revised_text: E, ao fim de quatrocentos e trinta anos, naquele mesmo dia, todos os exércitos[a] de Yahweh saíram da terra do Egito.
  revised_footnotes:
  - marker: a
    text: Ou “tropas” ou “hostes”. O termo hebraico pode designar tropas, exércitos ou grupos organizados.
    reason: lexical_alternative
  revision_rationale: A revisão torna a frase natural em português moderno, mantém a conjunção narrativa inicial e emprega «exércitos» como equivalente mais direto de צִבְאוֹת. A nota preserva alternativas lexicais sem decidir além do que o contexto exige.
