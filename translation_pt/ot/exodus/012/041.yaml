  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: pt
  text: E, ao fim de quatrocentos e trinta anos, naquele mesmo dia, todos os exércitos[a] de Yahweh saíram da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tropas” ou “hostes”. O termo hebraico pode designar tropas, exércitos ou grupos organizados.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: ao fim de
  rationale: A expressão assinala o término de um período; “ao fim de” é natural em português e conserva com precisão o valor temporal.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: quatrocentos e trinta anos
  rationale: A ordem numérica é ajustada ao uso corrente do português, sem alterar o total de 430 anos.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: naquele mesmo dia
  rationale: A expressão hebraica enfatiza a exatidão do dia; esta formulação preserva a ênfase de modo natural na narrativa portuguesa.
- source_word: יָצְאוּ
  choice: saíram
  rationale: O verbo simples expressa a saída da terra do Egito e corresponde diretamente ao sentido contextual de יצא.
- source_word: כָּל צִבְאוֹת
  choice: todos os contingentes
  rationale: צָבָא pode designar exércitos, tropas ou grupos organizados. “Contingentes” comunica a organização coletiva de Israel sem afirmar além do texto que todos atuavam como um exército combatente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém o substantivo אֶרֶץ e sua dimensão geográfica, em vez de abreviar a expressão para apenas “do Egito”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva sua função como nome e oferece uma transliteração amplamente reconhecida.
- issue: Sentido de צִבְאוֹת יְהוָה
  choice: os contingentes de Yahweh
  alternative: os exércitos de Yahweh; as hostes de Yahweh
  rationale: A escolha mantém a ideia de grupos organizados pertencentes a Yahweh, mas não resolve indevidamente a expressão como referência exclusiva a forças militares combatentes. A nota registra as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. “E aconteceu que” conserva o tom narrativo de וַיְהִי sem recorrer a formulações arcaicas; “contingentes” evita tanto o arcaísmo de “hostes” quanto uma militarização excessiva.
