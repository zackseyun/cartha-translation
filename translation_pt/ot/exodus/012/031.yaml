base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: pt
  text: 'Então ele chamou Moisés e Arão à noite e disse: “Levantem-se! Saiam do meio do meu povo, tanto vocês quanto os filhos de Israel. Vão e sirvam a Yahweh, como vocês disseram.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: mandou chamar
  rationale: No contexto, קרא com ל indica que ele convocou Moisés e Arão à sua presença. “Mandou chamar” é natural em português e comunica a convocação urgente sem explicitar o faraó, cujo sujeito está implícito no hebraico.
- source_word: לַיְלָה
  choice: durante a noite
  rationale: O termo funciona adverbialmente e marca quando ocorreu a convocação. “Durante a noite” é claro e natural, preservando a ênfase temporal.
- source_word: קוּמוּ צְּאוּ
  choice: Levantem-se! Saiam
  rationale: Os dois imperativos plurais expressam urgência. Frases separadas reproduzem a força abrupta da ordem em português atual.
- source_word: מִתּוֹךְ עַמִּי
  choice: do meio do meu povo
  rationale: Preserva a imagem espacial de retirada de dentro do povo egípcio e soa digna e compreensível em português.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: tanto vocês como os filhos de Israel
  rationale: A construção correlativa “tanto... como” representa a repetição inclusiva de גַּם...גַּם. “Filhos de Israel” conserva o idioma genealógico do hebraico.
- source_word: וּלְכוּ עִבְדוּ
  choice: Vão e sirvam
  rationale: Mantém a sequência de imperativos. “Sirvam” preserva a amplitude de עבד, que pode abranger serviço, culto e obediência, sem restringi-lo apenas a um ato litúrgico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כְּדַבֶּרְכֶם
  choice: como vocês disseram
  rationale: Expressa de modo natural a conformidade da permissão do faraó com o pedido anteriormente formulado por Moisés e Arão.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” conserva o nome pessoal divino, enquanto “SENHOR” o substituiria por um título tradicional.
- issue: Amplitude de עבד no serviço prestado a Deus
  choice: sirvam
  alternative: adorem
  rationale: “Sirvam” mantém a amplitude semântica do verbo, incluindo culto e serviço, sem resolver a expressão exclusivamente como adoração litúrgica.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais brasileiras amplamente compreensíveis. A ordem foi pontuada para transmitir a urgência dos imperativos hebraicos. O sujeito permaneceu como “ele”, conforme o texto hebraico, evitando inserir explicitamente “o faraó” dentro deste versículo.
