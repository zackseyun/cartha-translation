  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: pt
  text: Vocês guardarão isto como estatuto para vocês e para seus filhos, para sempre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta questão”, “esta coisa” ou “esta palavra”. O termo hebraico pode designar de modo amplo uma questão, coisa ou palavra falada.
    reason: lexical_alternative
  - marker: b
    text: Ou “para vocês e para seus descendentes”. O hebraico diz literalmente “para ti e para teus filhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vocês guardarão
  rationale: O verbo שׁמר pode significar guardar, observar ou cumprir. “Guardarão” preserva a forma verbal e, neste contexto legal e cultual, comunica a manutenção obediente da prescrição.
- source_word: הַדָּבָר הַזֶּה
  choice: esta prescrição
  rationale: דָּבָר tem sentido amplo, como palavra, coisa ou assunto. No contexto, aponta para a observância da Páscoa recém-ordenada; “prescrição” expressa naturalmente essa referência sem reduzi-la a uma simples palavra falada.
- source_word: לְחָק
  choice: como estatuto
  rationale: חֹק designa algo estabelecido ou prescrito, frequentemente uma norma duradoura. “Estatuto” conserva o caráter jurídico e pactual do termo.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: para vocês e para seus filhos
  rationale: O hebraico traz literalmente “para ti e para teus filhos”, com referência masculina. O português plural “vocês” corresponde ao público coletivo indicado pelo verbo, enquanto “seus filhos” mantém a forma lexical do original.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: A expressão עַד עוֹלָם indica duração permanente ou indefinidamente contínua. “Para sempre” é a equivalência portuguesa mais natural e forte.
theological_decisions:
- issue: Alcance da linguagem de sucessão pactual em “seus filhos”
  choice: Manter “seus filhos” no texto principal
  alternative: “seus filhos e filhas” ou “seus descendentes”
  rationale: O hebraico diz explicitamente “teus filhos”. Embora a expressão possa representar as gerações seguintes no âmbito familiar e pactual, ampliar isso no texto principal resolveria interpretativamente o alcance da formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” explicita o destinatário coletivo marcado por וּשְׁמַרְתֶּם, apesar das formas pronominais singulares que seguem. “Prescrição” evita a estranheza de “esta coisa” no texto principal e liga adequadamente דָּבָר à prática pascal precedente; as alternativas semânticas são preservadas em nota.
