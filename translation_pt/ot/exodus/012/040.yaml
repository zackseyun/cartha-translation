  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: pt
  text: A permanência dos filhos de Israel[a], que moraram no Egito, foi de quatrocentos e trinta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas testemunhas antigas trazem: “A permanência dos filhos de Israel e de seus pais, que moraram no Egito e em Canaã, foi de quatrocentos e trinta anos”.'
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: tempo de residência
  rationale: O substantivo pode indicar residência, habitação ou o período de permanência. Neste contexto, a duração expressa ao fim do versículo favorece a formulação natural «tempo de residência».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva de modo transparente a expressão hebraica tradicional e seu sentido coletivo, sem substituí-la pelo gentílico mais livre «israelitas».
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: que moraram
  rationale: Traduz diretamente a oração relativa e emprega um verbo corrente e natural para ישׁב neste contexto.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: Tradução locativa direta da preposição בְּ com o topônimo.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: quatrocentos e trinta anos
  rationale: Adapta a ordem do numeral composto ao uso idiomático do português e mantém exatamente a duração indicada.
theological_decisions:
- issue: Se os 430 anos abrangem apenas a permanência no Egito ou também a permanência patriarcal em Canaã
  choice: O texto principal segue o Texto Massorético fornecido e situa a residência dos filhos de Israel no Egito.
  alternative: Algumas testemunhas antigas acrescentam os antepassados e Canaã, fazendo o período abranger uma permanência mais ampla.
  rationale: A variante é cronologicamente relevante, mas não deve ser incorporada ao texto principal baseado no WLC; é registrada em nota para preservar a evidência e a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Tempo de residência» explicita naturalmente que מוֹשַׁב se refere aqui à duração da permanência; «filhos de Israel» mantém a forma tradicional e próxima do hebraico.
