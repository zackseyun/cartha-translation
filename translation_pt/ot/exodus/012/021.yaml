review_pass:
  verdict: revise
  source_fidelity: A tradução reconhece corretamente o caráter amplo de צֹאן e a metonímia de הַפָּסַח. Contudo, «um animal ... para cada família» introduz singularidade e uma distribuição individual que o hebraico não explicita, e «sacrifiquem a Páscoa» é menos preciso para o verbo específico «abater» e pode designar o rito em vez da vítima.
  naturalness: O texto é claro e de registro adequado, mas «sacrifiquem a Páscoa» soa semanticamente impreciso em português contemporâneo. «Animal da Páscoa» torna o referente explícito de forma natural, preservando em nota a formulação hebraica.
  terminology: «Anciãos de Israel» é apropriado. «Animais do rebanho» preserva a abrangência de צֹאן, que inclui ovinos e caprinos. «Abater» reproduz melhor שחט do que o termo mais amplo «sacrificar».
  issues:
  - severity: medium
    issue: «um animal do rebanho para cada família» restringe e explicita além do hebraico.
    rationale: צֹאן é coletivo e לְמִשְׁפְּחֹתֵיכֶם significa literalmente «segundo/conforme suas famílias». A redação no singular acrescenta a noção de um único animal para cada família, que não é declarada neste versículo.
  - severity: medium
    issue: «sacrifiquem a Páscoa» não identifica com clareza a vítima e enfraquece o verbo de abate.
    rationale: וְשַׁחֲטוּ denota abater um animal. הַפָּסַח é literalmente «a Páscoa», mas aqui funciona como designação da vítima pascal; «abatam o animal da Páscoa» comunica isso sem restringi-lo a cordeiro.
