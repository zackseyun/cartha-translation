- from: 'Então Moisés chamou todos os anciãos de Israel e lhes disse: “Escolham e peguem para vocês um animal do rebanho para cada família e sacrifiquem a Páscoa[a]”.'
  to: 'Então Moisés chamou todos os anciãos de Israel e lhes disse: “Retirem e tomem para vocês animais do rebanho, conforme suas famílias, e abatam o animal da Páscoa[a].”'
  rationale: A revisão elimina a restrição não expressa de «um ... para cada família», mantém a amplitude de צֹאן e traduz o verbo de abate com maior precisão. «Animal da Páscoa» explicita no texto português o referente metonímico de הַפָּסַח, enquanto a nota preserva a expressão literal hebraica e suas alternativas.
