  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: pt
  text: 'Então Moisés chamou todos os anciãos de Israel e lhes disse: “Retirem e tomem para vocês animais do rebanho, conforme suas famílias, e abatam o animal da Páscoa[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «a Páscoa»; isto é, o animal ou sacrifício da Páscoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: No contexto, o verbo apresenta Moisés convocando os anciãos para lhes transmitir instruções; “chamou” é natural e preserva o sentido básico.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Expressão corrente para os líderes e representantes reconhecidos do povo.
- source_word: מִשְׁכוּ
  choice: escolham
  rationale: O sentido concreto é “puxem” ou “retirem”; no contexto de tirar um animal dentre o rebanho, “escolham” comunica de modo natural a ação pretendida.
- source_word: וּקְחוּ
  choice: peguem
  rationale: Mantém o segundo imperativo distinto, em linguagem atual e direta.
- source_word: לָכֶם
  choice: para vocês
  rationale: Reproduz o valor dativo e reflexivo da expressão sem tornar a frase artificial.
- source_word: צֹאן
  choice: um animal do rebanho
  rationale: O termo coletivo abrange animais de pequeno porte, especialmente ovelhas e cabras; esta tradução evita restringi-lo indevidamente a “cordeiro”.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: para cada família
  rationale: Expressa de maneira natural a distribuição segundo os grupos familiares, adequada ao contexto das instruções pascais.
- source_word: וְשַׁחֲטוּ
  choice: sacrifiquem
  rationale: O verbo denota o abate de um animal e, aqui, ocorre em contexto ritual; “sacrifiquem” torna essa função clara sem recorrer a linguagem arcaica.
- source_word: הַפָּסַח
  choice: a Páscoa
  rationale: Preserva a forma metonímica e a concisão do hebraico, no qual “a Páscoa” designa aqui o animal ou sacrifício pascal.
theological_decisions:
- issue: Referente de הַפָּסַח
  choice: a Páscoa, com nota explicativa
  alternative: o cordeiro pascal; o sacrifício da Páscoa
  rationale: O hebraico emprega literalmente “a Páscoa” como designação metonímica do animal sacrificial. Mantê-la no texto preserva a formulação original e evita restringir o animal a um cordeiro, pois Êxodo 12:5 também permite um cabrito.
- issue: Espécie indicada por צֹאן
  choice: um animal do rebanho
  alternative: um cordeiro; uma ovelha
  rationale: O termo pode abranger ovelhas e cabras. A opção escolhida conserva essa amplitude e não resolve indevidamente uma distinção que o hebraico não faz neste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Escolham e peguem” traduz os dois imperativos sem a estranheza de “puxem e tomem”. A ordem foi levemente ajustada para clareza, e a ambiguidade quanto à espécie do animal foi preservada.
