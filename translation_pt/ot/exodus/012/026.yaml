  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: pt
  text: 'Quando seus filhos lhes disserem: “O que é este serviço para vocês?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a fórmula hebraica de contingência futura e o valor temporal de כִּי, mantendo em português uma construção digna e compreensível.
- source_word: יֹאמְרוּ
  choice: disserem
  rationale: Traduz diretamente o verbo אמר (‘dizer’), sem substituí-lo pelo interpretativo ‘perguntarem’, embora a fala tenha forma de pergunta.
- source_word: אֲלֵיכֶם
  choice: lhes
  rationale: Expressa naturalmente em português o destinatário plural da fala.
- source_word: בְּנֵיכֶם
  choice: seus filhos
  rationale: O hebraico usa o plural masculino de בֵּן. Em português, ‘filhos’ mantém essa forma e também é a expressão familiar natural neste contexto.
- source_word: מָה הָעֲבֹדָה הַזֹּאת לָכֶם
  choice: O que é este serviço para vocês?
  rationale: Mantém de perto a formulação hebraica e sua possível tensão sem explicitar interpretativamente ‘o que significa’. ‘Para vocês’ reproduz o valor do dativo לָכֶם.
- source_word: הָעֲבֹדָה
  choice: serviço
  rationale: Conserva a amplitude de עֲבֹדָה, que pode designar serviço, trabalho ou serviço ritual; o contexto pascal esclarece seu caráter religioso sem exigir ‘ritual’ ou ‘culto’ no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem mais formal ‘E acontecerá que, quando’ foi mantida para refletir a fórmula hebraica; o tratamento plural ‘vocês’ evita regionalismos e conserva a distinção do sufixo plural.
