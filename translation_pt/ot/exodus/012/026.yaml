  terminology: «Serviço» é uma boa escolha para עֲבֹדָה, pois preserva a abrangência do termo no contexto da Páscoa sem impor «ritual» ou «culto». «Filhos» mantém o masculino plural do hebraico, e «vocês» representa corretamente o plural de לָכֶם.
