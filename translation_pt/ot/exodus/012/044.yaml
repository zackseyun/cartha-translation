  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's slave[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: pt
  text: Mas todo escravo de um homem, comprado com prata[a] — depois que você o circuncidar[b], então ele poderá comer dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adquirido por dinheiro”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, ele só poderia participar da refeição da Páscoa depois de ser circuncidado.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: Mas todo
  rationale: A conjunção liga esta norma à exclusão anterior e, neste contexto, tem valor contrastivo; כָּל conserva a força distributiva.
- source_word: עֶבֶד
  choice: escravo
  rationale: A compra explícita torna central a condição de pessoa escravizada; “servo” atenuaria a realidade social expressa pelo texto.
- source_word: אִישׁ
  choice: de um homem
  rationale: Preserva o substantivo masculino singular e identifica o proprietário sem introduzir a noção interpretativa de chefe de família.
- source_word: מִקְנַת כָּסֶף
  choice: comprado com prata
  rationale: Mantém a imagem concreta do hebraico; “prata” também podia funcionar como meio de pagamento, como esclarece a nota.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: depois que você o circuncidar
  rationale: Expressa naturalmente a circuncisão como requisito anterior, preservando a interpelação direta na segunda pessoa do singular.
- source_word: אָז
  choice: então
  rationale: Marca de modo direto a consequência posterior ao cumprimento do requisito.
- source_word: יֹאכַל בּוֹ
  choice: ele poderá comer dela
  rationale: O imperfeito, neste contexto jurídico, concede permissão para participar da refeição; o pronome retoma a Páscoa, substantivo feminino em português.
theological_decisions:
- issue: Terminologia da escravidão no contexto jurídico da aliança
  choice: escravo
  alternative: servo
  rationale: A referência explícita à compra exige uma tradução que não suavize a condição de propriedade e dependência descrita.
- issue: Linguagem de gênero em אִישׁ
  choice: de um homem
  alternative: de uma pessoa
  rationale: A tradução preserva a forma masculina singular do texto hebraico, que apresenta o proprietário como sujeito jurídico representativo.
- issue: Valor modal de יֹאכַל
  choice: poderá comer
  alternative: comerá
  rationale: A sequência normativa estabelece elegibilidade ou permissão após a circuncisão, não apenas uma ação futura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Escravo” conserva o realismo histórico do texto; “comprado com prata” mantém a expressão concreta do hebraico, e a ordem da frase evidencia a circuncisão como condição prévia.
