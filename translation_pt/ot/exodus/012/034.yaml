  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: pt
  text: Então o povo levou a massa antes que ela levedasse, com suas vasilhas de amassar[a] embrulhadas em seus mantos, sobre os ombros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “masseiras”. O termo hebraico designa recipientes usados no preparo da massa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: levou
  rationale: Neste contexto de partida, o verbo נשׂא descreve o ato de transportar consigo. “Levou” é natural em português e mantém a ideia de carregar os objetos na viagem.
- source_word: הָעָם
  choice: o povo
  rationale: עָם designa coletivamente os israelitas; “o povo” é a forma corrente e clara em português.
- source_word: בְּצֵקוֹ
  choice: a massa
  rationale: O sufixo hebraico está no singular por concordar com o sujeito coletivo. Em português, “a massa” preserva o sentido sem exigir um possessivo coletivo pouco natural.
- source_word: טֶרֶם יֶחְמָץ
  choice: antes que ela levedasse
  rationale: A expressão indica que a massa ainda não havia passado pelo processo de levedação. “Levedasse” conserva a ligação lexical com o contexto dos pães sem fermento, e o pronome explicita naturalmente que o referente é a massa.
- source_word: מִשְׁאֲרֹתָם
  choice: suas vasilhas de amassar
  rationale: O substantivo se refere a recipientes usados no preparo e amassamento da massa. A formulação é clara para leitores modernos e evita sugerir, de modo excessivamente específico, o formato desses recipientes.
- source_word: צְרֻרֹת
  choice: embrulhadas
  rationale: O particípio passivo de צרר comunica que as vasilhas estavam reunidas e presas como trouxas para a viagem. “Embrulhadas” reproduz naturalmente a imagem no contexto dos mantos.
- source_word: בְּשִׂמְלֹתָם
  choice: nos mantos
  rationale: שִׂמְלָה costuma designar uma peça exterior de roupa. “Mantos” oferece uma imagem concreta e historicamente adequada, sem recorrer ao termo genérico “roupas”.
- source_word: עַל שִׁכְמָם
  choice: sobre os ombros
  rationale: A expressão indica onde as trouxas eram transportadas. O plural é idiomático em português com o sujeito coletivo “o povo”.
