  yaml_path: translation/ot/exodus/012/045.yaml
  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: pt
  text: O residente estrangeiro[a] e o trabalhador contratado não comerão dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morador temporário” ou “estrangeiro residente”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, da refeição da Páscoa; em sentido mais estrito, do cordeiro pascal.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: residente estrangeiro
  rationale: Designa alguém não israelita que reside no meio do povo sem estar plenamente incorporado à comunidade da aliança. A expressão comunica tanto residência quanto condição estrangeira.
- source_word: שָׂכִיר
  choice: trabalhador contratado
  rationale: Refere-se a uma pessoa que trabalha mediante pagamento; a formulação é clara, atual e evita o tom arcaico de alternativas como “servo assalariado”.
- source_word: לֹא יֹאכַל
  choice: não comerão
  rationale: O imperfeito negado, neste contexto legal, expressa proibição. Em português, o futuro preserva de modo conciso o tom normativo do texto.
- source_word: בּוֹ
  choice: dela
  rationale: A preposição com o verbo “comer” tem sentido partitivo. O pronome feminino retoma naturalmente a Páscoa/ceia pascal, sem explicitar no corpo do versículo o antecedente implícito no hebraico.
theological_decisions:
- issue: Referente de בּוֹ (“dela”) na legislação da Páscoa
  choice: A forma pronominal remete à Páscoa ou à refeição pascal estabelecida no contexto imediato.
  alternative: O referente é, mais estritamente, o cordeiro pascal.
  rationale: O hebraico deixa o antecedente implícito. Manter o pronome preserva a concisão e a amplitude contextual do original, enquanto a nota registra a leitura mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com tom jurídico conciso. “Residente estrangeiro” distingue esta categoria da de um visitante de passagem; “trabalhador contratado” é corrente e não pejorativo.
