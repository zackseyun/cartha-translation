  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: pt
  text: '“Falem a toda a comunidade de Israel, dizendo: ‘No décimo dia deste mês, cada homem tome para si um animal do rebanho[a], conforme a sua casa paterna, um animal do rebanho para cada casa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico שֶׂה pode referir-se a um animal do rebanho menor, seja uma ovelha, seja uma cabra.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Falem
  rationale: O imperativo piel plural dirige uma ordem direta a mais de um interlocutor. “Falem” é natural em português moderno e mantém o número plural.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: toda a comunidade de Israel
  rationale: עֵדָה designa Israel como corpo comunitário reunido. “Comunidade” comunica esse sentido coletivo com clareza atual, sem limitar a expressão a uma reunião formal.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo introduz o conteúdo da fala. Em português corrente, os dois-pontos cumprem essa função de modo mais natural do que “dizendo”.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: No dia dez deste mês
  rationale: Explicita “dia”, implícito no ordinal hebraico, e conserva a referência temporal com formulação portuguesa natural.
- source_word: וְיִקְחוּ לָהֶם
  choice: tome para si
  rationale: A forma verbal tem força diretiva neste contexto. O singular acompanha o sujeito distributivo אִישׁ, enquanto “para si” preserva o pronome reflexivo do hebraico.
- source_word: אִישׁ
  choice: cada homem
  rationale: Mantém tanto o valor distributivo quanto a forma masculina explícita do hebraico, que no contexto aponta para o responsável pela unidade doméstica.
- source_word: שֶׂה
  choice: cordeiro
  rationale: שֶׂה pode designar um animal jovem do rebanho menor, seja ovino ou caprino. “Cordeiro” é a forma tradicional e prontamente compreensível no contexto da Páscoa, enquanto a amplitude lexical é registrada em nota.
- source_word: לְבֵית אָבֹת
  choice: de acordo com a sua casa paterna
  rationale: A expressão se refere à unidade familiar patrilinear ou ancestral. “Casa paterna” preserva essa estrutura social melhor do que o termo genérico “família”.
- source_word: שֶׂה לַבָּיִת
  choice: um cordeiro para cada casa
  rationale: בַּיִת indica aqui a unidade doméstica, não apenas o edifício. “Cada casa” expressa naturalmente a distribuição de um animal por unidade familiar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva o plural do mandamento, a distribuição por responsável doméstico e a expressão social “casa paterna”; emprega pontuação direta em lugar da fórmula quotativa mais rígida.
