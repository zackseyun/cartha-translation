  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: pt
  text: Se um estrangeiro residente morar com você e celebrar a Páscoa em honra de Yahweh[a], todos os homens que lhe pertencem deverão ser circuncidados. Só então ele poderá se aproximar para celebrá-la e será como um nativo da terra. Mas nenhum incircunciso poderá comer dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino YHWH (יהוה), tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Indica um não israelita que vive de modo estável entre Israel, e não um viajante de passagem. A expressão comunica com clareza a condição jurídica e social do termo.
- source_word: יָגוּר אִתְּךָ
  choice: morar com você
  rationale: O verbo גור descreve a residência de quem vive como estrangeiro; esta formulação é natural em português e preserva o sentido durativo.
- source_word: וְעָשָׂה פֶסַח
  choice: celebrar a Páscoa
  rationale: Embora a expressão seja literalmente 'fazer a Páscoa', em português 'celebrar' é a formulação idiomática para observar esse rito, sem acrescentar ao texto a ideia explícita de desejo.
- source_word: לַיהוָה
  choice: em honra de Yahweh
  rationale: A preposição ל marca a orientação ou dedicação da celebração. 'Em honra de' soa natural em português e mantém Yahweh como nome divino.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: todos os homens que lhe pertencem deverão ser circuncidados
  rationale: A construção expressa uma exigência normativa abrangendo todos os indivíduos masculinos ligados à sua casa ou grupo.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: Só então ele poderá se aproximar para celebrá-la
  rationale: קרב indica aproximação autorizada para participar do rito; 'poderá' comunica a permissão resultante do cumprimento da condição.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: como o natural da terra
  rationale: אֶזְרַח designa o integrante nativo da terra ou comunidade. A formulação preserva a comparação jurídico-social sem ampliá-la.
- source_word: וְכָל עָרֵל לֹא יֹאכַל בּוֹ
  choice: nenhum incircunciso poderá comer dela
  rationale: A negação exprime proibição ou inelegibilidade. 'Comer dela' representa de modo natural a participação na refeição pascal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. A transliteração preserva o caráter de nome próprio da aliança sem substituí-lo por um título.
- issue: Participação do estrangeiro residente na Páscoa
  choice: Admissão condicionada à circuncisão de todos os homens ligados a ele
  alternative: Exclusão puramente étnica; eliminação de todos os limites da aliança
  rationale: O versículo inclui o estrangeiro residente sob uma condição de aliança e o equipara ao natural da terra quanto a essa observância. A tradução conserva essa tensão sem impor categorias teológicas posteriores.
- issue: Força de וְעָשָׂה no período condicional
  choice: celebrar, sem inserir explicitamente 'quiser'
  alternative: quiser celebrar
  rationale: A ideia prospectiva decorre do contexto condicional, mas o hebraico não contém um verbo de vontade. A formulação mais direta evita acrescentar motivação não expressa.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ''estrangeiro residente'' para explicitar o sentido legal de גֵּר e mantém o singular ''você'' do hebraico. A ordem das frases foi levemente ajustada com pontuação moderna, sem alterar a sequência lógica: residência, celebração, circuncisão, admissão e proibição.'
