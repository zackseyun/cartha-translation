  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: pt
  text: Os israelitas fizeram conforme a palavra de Moisés e pediram[a] aos egípcios objetos de prata, objetos de ouro e roupas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico significa normalmente “pedir” ou “solicitar”, não necessariamente “pedir emprestado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a expressão hebraica seja literalmente “os filhos de Israel”, “os israelitas” comunica de modo natural e claro a referência coletiva ao povo, sem perder o sentido.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: Preserva o sentido simples e comum do verbo עשה na construção “fizeram conforme”.
- source_word: כִּדְבַר מֹשֶׁה
  choice: conforme a palavra de Moisés
  rationale: Mantém o substantivo דָּבָר, “palavra”, sem restringi-lo indevidamente a “ordem” ou “instrução”.
- source_word: וַיִּשְׁאֲלוּ
  choice: pediram
  rationale: O verbo שאל significa normalmente “pedir” ou “solicitar”; “pediram” evita introduzir a ideia de empréstimo, que não é exigida pelo hebraico.
- source_word: מִמִּצְרַיִם
  choice: aos egípcios
  rationale: A forma diz literalmente “do Egito”, mas o contexto indica as pessoas egípcias a quem os israelitas fizeram os pedidos; a formulação explicita isso em português natural.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: objetos de prata, objetos de ouro
  rationale: כְּלִי é um termo amplo para objetos, utensílios ou recipientes. “Objetos” preserva essa amplitude sem limitar a referência a vasos.
- source_word: וּשְׂמָלֹת
  choice: roupas
  rationale: שִׂמְלָה designa vestimentas de modo amplo; “roupas” é claro, atual e abrangente.
theological_decisions:
- issue: Possível leitura moralmente carregada de וַיִּשְׁאֲלוּ no contexto da saída do Egito
  choice: pediram
  alternative: pediram emprestado
  rationale: A tradução mantém o sentido lexical básico do verbo sem sugerir uma obrigação de devolução que o hebraico não expressa. O resultado descrito no contexto mais amplo não deve ser inserido neste verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Os israelitas” e “roupas” favorecem naturalidade; “conforme a palavra de Moisés” preserva de modo transparente a formulação hebraica.
