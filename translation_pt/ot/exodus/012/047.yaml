  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: pt
  text: Toda a comunidade de Israel fará isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Toda a assembleia de Israel a celebrará».'
    reason: Alternativa lexical e contextual para עֲדַת e יַעֲשׂוּ; «celebrará» explicita que o verbo se refere à observância da Páscoa.
lexical_decisions:
- source_word: כָּל
  choice: Toda
  rationale: Expressa a totalidade do sujeito coletivo e concorda naturalmente com o singular feminino «comunidade».
- source_word: עֲדַת
  choice: a comunidade de
  rationale: Designa o corpo coletivo de Israel. «Comunidade» é corrente, clara e preserva a dimensão comunitária; «assembleia» também é possível.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome próprio em sua forma portuguesa convencional.
- source_word: יַעֲשׂוּ
  choice: fará
  rationale: O verbo עשה tem o sentido amplo de fazer ou realizar. O singular português concorda com o coletivo «comunidade», embora o hebraico use verbo plural. No contexto, refere-se à celebração da Páscoa.
- source_word: אֹתוֹ
  choice: isso
  rationale: Preserva a referência pronominal sem definir além do hebraico se o antecedente é a celebração, o rito ou outro elemento imediato do contexto.
theological_decisions:
- issue: Sujeito coletivo na ordem da Páscoa
  choice: A comunidade de Israel é tratada corporativamente como um todo.
  alternative: Entender a frase como exigência explícita dirigida isoladamente a cada israelita.
  rationale: עֵדָה designa a comunidade coletiva, e o verbo hebraico no plural acompanha esse sujeito de sentido plural. A tradução conserva a força corporativa sem impor uma individualização mais estrita do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Comunidade» evita o tom mais eclesiástico de «congregação», enquanto «fará isso» mantém a formulação ampla e a referência pronominal do hebraico.
