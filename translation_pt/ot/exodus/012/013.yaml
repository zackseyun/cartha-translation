base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: pt
  text: E o sangue será para vocês um sinal sobre as casas em que vocês estiverem. Quando eu vir o sangue, passarei por cima de vocês[a], e não haverá entre vocês praga que os destrua[b] quando eu ferir a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pouparei vocês” ou “protegerei vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, entendendo “destruidor” como substantivo: “e não haverá entre vocês praga para o destruidor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: E o sangue será um sinal para vocês
  rationale: O futuro expressa o resultado prometido da instrução; “sinal para vocês” preserva o valor de benefício e referência de לָכֶם.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: nas casas onde estiverem
  rationale: “Nas casas” é a forma natural em português para indicar tanto o lugar do sinal quanto as casas ocupadas pelos israelitas.
- source_word: וְרָאִיתִי אֶת הַדָּם
  choice: Quando eu vir o sangue
  rationale: A coordenação hebraica tem função temporal neste encadeamento; o futuro do subjuntivo é idiomático e preciso em português.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: passarei por cima de vocês
  rationale: Preserva a imagem espacial e a ligação lexical tradicional com a Páscoa, sem ocultar em nota as nuances possíveis de poupar ou proteger.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: e não haverá entre vocês praga
  rationale: “Entre vocês” representa naturalmente בָכֶם, enquanto “praga” comunica o sentido contextual de נֶגֶף.
- source_word: לְמַשְׁחִית
  choice: que os destrua
  rationale: Interpreta a expressão de modo resultativo ou final, ligada à praga, sem exigir a introdução de um agente pessoal.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: quando eu ferir a terra do Egito
  rationale: A construção infinitiva é temporal; “ferir a terra” mantém a formulação abrangente do hebraico e um registro bíblico ainda corrente.
theological_decisions:
- issue: Sentido de וּפָסַחְתִּי עֲלֵכֶם na instituição da Páscoa
  choice: passarei por cima de vocês
  alternative: pouparei vocês; protegerei vocês
  rationale: A redação principal mantém a imagem e a conexão lexical com a Páscoa; a nota preserva as nuances debatidas sem escolher silenciosamente uma delas.
- issue: Se לְמַשְׁחִית designa resultado destrutivo ou um destruidor pessoal
  choice: praga que os destrua
  alternative: praga entre vocês por causa do destruidor
  rationale: A construção admite uma leitura substantivada, mas não exige que um agente pessoal seja explicitado. A leitura alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural, evita arcaísmos como “vos” e conserva a imagem tradicional de “passar por cima”.
