  naturalness: O texto é moderno e fluente para leitores brasileiros e internacionais. «Passarei por cima de vocês» mantém a imagem tradicional e é compreensível. A colocação da nota b deve acompanhar «destrua», o elemento a que se refere, e não encerrar o versículo.
  terminology: «Sangue», «sinal», «praga», «destrua» e «terra do Egito» são adequados. A nota sobre «destruidor» deve evitar «por causa do», que introduz uma relação causal não explicitada pelo hebraico.
