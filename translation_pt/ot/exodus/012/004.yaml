base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: pt
  text: Se uma família for pequena demais para um cordeiro[a], ela e o vizinho mais próximo de sua casa deverão tomar um, conforme o número de pessoas. De acordo com o que cada pessoa puder comer, vocês calcularão quantas pessoas incluir para o cordeiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar mais amplamente um animal do rebanho miúdo, seja uma ovelha, seja uma cabra.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Cada pessoa conforme o que puder comer; vocês calcularão para o cordeiro.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: a família
  rationale: Embora o termo signifique literalmente “a casa”, neste contexto designa a unidade familiar que participará da refeição. “A família” comunica esse sentido com clareza em português moderno.
- source_word: יִמְעַט ... מִהְיֹת מִשֶּׂה
  choice: for pequena demais para um cordeiro
  rationale: A construção indica que a família tem poucas pessoas para consumir um animal inteiro. A formulação conserva a relação comparativa e soa natural em português.
- source_word: שֶׂה
  choice: cordeiro
  rationale: O substantivo pode designar um animal do rebanho miúdo, seja ovino ou caprino. “Cordeiro” é natural no contexto da Páscoa, enquanto a extensão lexical é registrada em nota.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: ela deverá tomá-lo junto com o vizinho mais próximo de sua casa
  rationale: O pronome hebraico retoma “casa” em gênero gramatical masculino; em português, “ela” retoma naturalmente “família”. “Junto com” expressa a participação conjunta, e “de sua casa” preserva a referência espacial do original.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: conforme o número de pessoas
  rationale: מִכְסָה indica contagem ou quantidade determinada, e נְפָשֹׁת refere-se aqui a pessoas, não a almas desencarnadas.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: de acordo com o que cada uma puder comer
  rationale: A expressão distributiva considera o consumo de cada pessoa. “Puder comer” comunica naturalmente a quantidade ou capacidade de consumo sem eliminar a formulação alternativa indicada em nota.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: Vocês calcularão quantas pessoas participarão do cordeiro
  rationale: O verbo raro tem aqui o sentido contextual de contar ou calcular em relação ao animal. A explicitação de “quantas pessoas participarão” torna inteligível a mudança para a segunda pessoa do plural e a ideia de dimensionar o grupo segundo o consumo.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e evita o literalismo pouco claro de “almas” e “contar sobre o cordeiro”. A mudança hebraica do singular para o plural é preservada funcionalmente.
