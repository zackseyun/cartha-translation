revisions:
- from: Se a família for pequena demais para um cordeiro[a], ela deverá tomá-lo junto com o vizinho mais próximo de sua casa, conforme o número de pessoas. Vocês calcularão quantas pessoas participarão do cordeiro de acordo com o que cada uma puder comer.[b]
  to: Se uma família for pequena demais para um cordeiro[a], ela e o vizinho mais próximo de sua casa deverão tomar um, conforme o número de pessoas. De acordo com o que cada pessoa puder comer, vocês calcularão quantas pessoas incluir para o cordeiro.[b]
  rationale: A revisão preserva a ação conjunta da família e do vizinho, mantém a transição hebraica para a segunda pessoa do plural e explicita apenas o objeto elíptico necessário para que o verbo “calcular” seja natural em português. A formulação “incluir para o cordeiro” representa a contagem de pessoas em relação ao animal sem introduzir uma interpretação teológica ou ritual adicional.
