review_pass:
  verdict: revise
  source_fidelity: A primeira oração transmite bem a insuficiência numérica do grupo e a nota a preserva adequadamente. Contudo, “ela deverá tomá-lo junto com o vizinho” enfraquece a construção coordenada hebraica, em que o chefe da casa e o vizinho tomam o animal conjuntamente. Além disso, “quantas pessoas participarão do cordeiro” acrescenta a ideia de participação e desloca o foco de calcular/contar pessoas em relação ao animal; a nota b, ao falar de “quantidade necessária”, também não corresponde com precisão ao objeto implícito da contagem.
  naturalness: O texto é moderno e compreensível, mas a reformulação final proposta torna explícito, de modo natural, o objeto elíptico de “calcular”, sem a expressão pouco idiomática “participarão do cordeiro”.
  terminology: “Família”, “cordeiro”, “número de pessoas” e “vizinho mais próximo” são adequados. A nota sobre שֶׂה deve explicitar que abrange ovinos ou caprinos; “animal do rebanho miúdo” é apropriado.
  issues:
  - severity: medium
    issue: A ação conjunta de tomar o animal está parcialmente obscurecida.
    rationale: וְלָקַח הוּא וּשְׁכֵנוֹ apresenta “ele e seu vizinho” como sujeitos coordenados. “Ela deverá tomá-lo junto com o vizinho” pode sugerir que apenas a família toma o animal, com o vizinho apenas acompanhando.
  - severity: medium
    issue: A última oração introduz “participarão” e a nota b fala em “quantidade necessária”.
    rationale: תָּכֹסּוּ עַל־הַשֶּׂה se refere a calcular/contar em relação ao animal, tendo como parâmetro o consumo individual. O hebraico não enuncia diretamente nem “participar” nem uma “quantidade necessária”.
  revised_text: Se uma família for pequena demais para um cordeiro[a], ela e o vizinho mais próximo de sua casa deverão tomar um, conforme o número de pessoas. De acordo com o que cada pessoa puder comer, vocês calcularão quantas pessoas incluir para o cordeiro.[b]
