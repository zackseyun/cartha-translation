  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: pt
  text: Não deixem nada dele até de manhã; o que dele restar até de manhã, queimem no fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: deixem
  rationale: O hifil de יתר significa aqui deixar sobrar ou deixar restante. Com a negação e «nada dele», «não deixem» é natural em português e expressa claramente a proibição.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: A preposição מן com sufixo pronominal indica aquilo de que não se deve deixar nenhuma porção; «dele» é conciso e idiomático no contexto.
- source_word: עַד בֹּקֶר
  choice: até de manhã
  rationale: A expressão marca o limite temporal. «Até de manhã» é uma formulação corrente e preserva esse limite sem acrescentar especificação.
- source_word: הַנֹּתָר
  choice: o que ... restar
  rationale: O particípio nifal de יתר designa aquilo que ficar ou sobrar. «O que restar» é claro, natural e distingue essa sobra do verbo causativo da primeira oração.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Com o verbo «queimar», «no fogo» traduz naturalmente o beth e comunica o meio de destruição, sem exigir uma distinção artificial entre «em» e «com».
- source_word: תִּשְׂרֹפוּ
  choice: queimem
  rationale: O imperfeito tem força diretiva neste contexto legal. O imperativo português transmite diretamente a ordem e mantém a concordância no plural.
theological_decisions:
- issue: Natureza da ordem sobre o alimento pascal que sobrasse
  choice: Uma proibição direta, seguida de uma ordem obrigatória de eliminação
  alternative: Uma orientação meramente prática, sem força normativa
  rationale: 'O hebraico apresenta duas instruções rituais vinculantes: não deixar nenhuma porção até de manhã e queimar qualquer porção restante. A tradução mantém ambas sem acrescentar interpretação simbólica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural «deixem/queimem» preserva os verbos hebraicos dirigidos a mais de uma pessoa. Não se acrescentou nota, pois as nuances de יתר são representadas naturalmente por «deixem» e «restar», sem ambiguidade relevante que exija alternativa editorial.
