  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: pt
  text: Pegarão um pouco do sangue e o colocarão nas duas ombreiras e na verga das casas onde comerão o animal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: «onde comem o animal». O verbo hebraico pode ter sentido presente ou futuro neste contexto de instrução.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Pegarão
  rationale: O perfeito com waw, nesta sequência de instruções, tem força diretiva e prospectiva. O futuro em português transmite naturalmente a prescrição sem recorrer a uma formulação excessivamente jurídica.
- source_word: מִן הַדָּם
  choice: um pouco do sangue
  rationale: 'A preposição מִן tem valor partitivo: toma-se uma porção do sangue, não todo ele.'
- source_word: וְנָתְנוּ
  choice: o colocarão
  rationale: נתן tem sentido amplo de dar, pôr ou colocar. Neste contexto ritual, «colocar» é claro e concreto, sem acrescentar o modo de aplicação.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: nas duas ombreiras
  rationale: מְזוּזוֹת designa os dois elementos verticais laterais da abertura da porta; «ombreiras» é o termo arquitetônico preciso e corrente em português.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: e na verga
  rationale: מַשְׁקוֹף designa a peça horizontal superior da abertura. «Verga» é o equivalente arquitetônico natural em português.
- source_word: עַל הַבָּתִּים
  choice: das casas
  rationale: Embora עַל normalmente signifique «sobre», aqui a expressão relaciona as ombreiras e a verga às casas em questão; «das casas» evita uma repetição enganosa e exprime a relação natural em português.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: onde comerão o animal
  rationale: A oração relativa identifica as casas como o lugar da refeição. O imperfeito יֹאכְלוּ admite nuance futura neste contexto instrucional. «O animal» explicita o referente masculino de אֹתוֹ, isto é, o cordeiro ou cabrito escolhido nos versículos anteriores, evitando em português a possível leitura de que comeriam o sangue.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com futuro de valor instrucional. «Ombreiras» e «verga» mantêm precisão arquitetônica; «o animal» torna inequívoco o antecedente do pronome hebraico sem restringi-lo indevidamente a «cordeiro», pois Êxodo 12:5 permite ovelhas ou cabras.
