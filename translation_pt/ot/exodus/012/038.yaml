base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: pt
  text: Também subiu com eles um grande grupo misto[a], bem como rebanhos e gado — uma quantidade muito grande de animais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande multidão mista” ou “uma multidão de diversas origens”. A expressão hebraica designa um grupo heterogêneo que acompanhava Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: Também
  rationale: Preserva de modo natural a força aditiva da conjunção com o advérbio.
- source_word: עֵרֶב רַב
  choice: uma grande multidão misturada
  rationale: Expressa tanto o caráter heterogêneo do grupo quanto sua dimensão, sem especificar indevidamente sua composição étnica.
- source_word: עָלָה אִתָּם
  choice: subiu com eles
  rationale: Mantém o verbo de movimento característico da narrativa do êxodo e traduz diretamente a relação comitativa.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: além de rebanhos de ovelhas e cabras e de gado
  rationale: צֹאן abrange o gado miúdo, sobretudo ovelhas e cabras, enquanto בָּקָר designa o gado bovino; a formulação torna a distinção clara em português corrente.
- source_word: מִקְנֶה
  choice: animais
  rationale: No contexto, retoma coletivamente os animais domésticos já enumerados e evita a repetição pouco natural de 'rebanhos' ou 'gado'.
- source_word: כָּבֵד מְאֹד
  choice: uma quantidade enorme
  rationale: Traduz idiomaticamente a ideia de grande abundância comunicada por 'muito pesado', em vez de reproduzir literalmente uma expressão pouco natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A tradução conserva o idioma narrativo “subiu” e explicita o alcance coletivo de צֹאן sem atribuir ao grupo humano uma composição étnica não declarada pelo hebraico.
