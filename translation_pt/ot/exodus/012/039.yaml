  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: And they baked the dough that they had brought out from Egypt into unleavened cakes[a], because it had not leavened; for they had been driven out from Egypt and could not delay[c][b], and they had not prepared provisions for themselves either.
translation:
  language: pt
  text: E assaram a massa que haviam levado do Egito em pães sem fermento[a], pois ela não havia fermentado[b], porque haviam sido expulsos do Egito e não puderam demorar-se[c]; também não haviam preparado provisões para si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pães achatados sem fermento”. A expressão hebraica se refere a pães feitos de massa não fermentada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois ela não estava fermentada” ou “pois ela não havia crescido”. O verbo hebraico indica que a massa não chegou a fermentar antes de ser assada.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não puderam ficar esperando”. A ideia é que não tiveram tempo para permanecer ali ou aguardar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: assaram
  rationale: O verbo אפה designa normalmente assar pão ou pães, sendo esta a equivalência natural no contexto.
- source_word: הַבָּצֵק
  choice: a massa
  rationale: בצק significa massa de pão; a forma simples é clara e natural em português.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: que haviam levado do Egito
  rationale: A oração modifica a massa e descreve o que transportaram ao sair; 'haviam levado' expressa naturalmente a anterioridade.
- source_word: עֻגֹת מַצּוֹת
  choice: fazendo pães sem fermento
  rationale: עֻגֹת indica pães ou bolos achatados, enquanto מַצּוֹת especifica que eram não fermentados. 'Pães sem fermento' evita que 'bolos' seja entendido como doce.
- source_word: כִּי לֹא חָמֵץ
  choice: pois ela não havia fermentado
  rationale: Preserva a força verbal de חמץ e deixa claro que o referente é a massa.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: Tinham sido expulsos do Egito
  rationale: O sentido passivo de גרשׁ comunica expulsão forçada e a urgência da saída.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: e não puderam demorar-se
  rationale: התמהמה significa demorar, deter-se ou permanecer esperando; 'demorar-se' é corrente e preserva essa amplitude.
- source_word: וְגַם
  choice: também não
  rationale: No contexto de uma segunda oração negativa, esta construção transmite naturalmente a ideia aditiva.
- source_word: צֵדָה
  choice: provisões
  rationale: צדה refere-se a mantimentos ou suprimentos para uma viagem; 'provisões' mantém essa abrangência.
- source_word: לָהֶם
  choice: para si
  rationale: Traduz diretamente o pronome reflexivo em referência às provisões destinadas ao próprio grupo.
