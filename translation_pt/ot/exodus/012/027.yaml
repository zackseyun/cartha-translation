source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: pt
  text: 'vocês dirão: “É o sacrifício da Páscoa a Yahweh[a], que passou por cima[b] das casas dos filhos de Israel no Egito, quando feriu o Egito e livrou as nossas casas”. Então o povo se inclinou e adorou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh é o nome pessoal de Deus representado pelas quatro consoantes hebraicas YHWH.
    reason: divine_name
  - marker: b
    text: O verbo traduzido por “passou por cima” está ligado à palavra “Páscoa” e também pode transmitir a ideia de poupar ou proteger.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: vocês responderão
  rationale: O verbo significa literalmente “vocês dirão”, mas, no contexto da pergunta dos filhos no versículo anterior, “responderão” expressa naturalmente a função discursiva sem alterar o sentido.
- source_word: זֶבַח פֶּסַח
  choice: o sacrifício da Páscoa
  rationale: Preserva tanto o caráter sacrificial de זֶבַח quanto a designação cultual פֶּסַח, em formulação portuguesa clara.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário ou a dedicação do sacrifício; “a Yahweh” mantém o nome divino presente no hebraico.
- source_word: פָּסַח עַל
  choice: passou por cima
  rationale: Mantém a ligação lexical com “Páscoa” e a imagem tradicional do verbo, enquanto a nota registra sua possível nuance de poupar ou proteger.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: as casas dos filhos de Israel
  rationale: Reproduz de modo transparente a expressão familiar e pactual do hebraico, sem a reduzir simplesmente a “israelitas”.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: quando feriu os egípcios
  rationale: A construção com infinitivo expressa circunstância temporal. Como מִצְרַיִם pode designar o Egito ou seus habitantes, “os egípcios” torna natural o contraste entre pessoas atingidas e casas preservadas.
- source_word: הִצִּיל
  choice: livrou
  rationale: O hifil de נצל comunica retirada do perigo, resgate ou livramento; “livrou” preserva esse sentido salvífico melhor que apenas “poupou”.
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: se inclinou e adorou
  rationale: 'Distingue os dois verbos sucessivos: primeiro a inclinação reverente, depois a adoração, evitando repetição artificial.'
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Expressão pactual בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A forma escolhida conserva a expressão genealógica do original e sua ressonância pactual, embora “israelitas” seja português mais idiomático.
- issue: Relação entre פֶּסַח e פָּסַח
  choice: Páscoa / passou por cima
  alternative: Páscoa / poupou ou protegeu
  rationale: A tradução conserva a relação verbal perceptível entre o nome da celebração e a ação divina, sem eliminar a nuance protetora, explicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e mantém a formulação solene da fala ritual. A adversativa “mas” explicita o contraste contextual entre ferir os egípcios e livrar as casas israelitas, sem introduzir uma conclusão teológica adicional.
