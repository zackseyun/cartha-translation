  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: pt
  text: Este mês será para vocês o primeiro dos meses[a]; será o primeiro mês do ano para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Esta lua nova”, pois a palavra hebraica pode estar associada ao ciclo da lua nova; aqui ela se refere ao mês do calendário.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Este mês
  rationale: Neste contexto de instituição do calendário, חֹדֶשׁ designa naturalmente o mês, embora também possa estar associado à lua nova.
- source_word: לָכֶם
  choice: para vocês
  rationale: A preposição marca referência aos israelitas como destinatários da determinação; “para vocês” é natural e preserva essa relação.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: o princípio dos meses
  rationale: רֹאשׁ significa literalmente “cabeça”, mas em ordenação temporal expressa começo ou primazia. “Princípio dos meses” conserva a imagem e soa dignamente em português.
- source_word: רִאשׁוֹן הוּא
  choice: será o primeiro mês
  rationale: רִאשׁוֹן indica prioridade ordinal; “mês” está implícito no hebraico e precisa ser explicitado em português. O futuro comunica a força instituidora do contexto.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: do ano
  rationale: A expressão situa esse mês em primeiro lugar entre os meses do ano; a formulação concisa é idiomática em português.
theological_decisions:
- issue: Força da oração nominal hebraica em contexto legislativo
  choice: 'Futuro com valor prescritivo: “será”'
  alternative: 'Presente descritivo: “é”'
  rationale: Embora não haja cópula expressa no hebraico, Deus está instituindo a contagem do calendário de Israel. “Será” transmite essa força sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Vocês” evita uma forma regional ou arcaizante; “princípio dos meses” preserva de modo inteligível a estrutura enfática do hebraico.
