  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: pt
  text: No primeiro mês, no décimo quarto dia do mês, ao anoitecer, vocês comerão pães sem fermento até o vigésimo primeiro dia do mês, ao anoitecer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: No primeiro mês
  rationale: O substantivo “mês” é recuperado naturalmente da fórmula de data completada por לַחֹדֶשׁ; explicitá-lo produz português claro sem acrescentar conteúdo estranho ao hebraico.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: no décimo quarto dia
  rationale: A expressão cardinal hebraica funciona como data ordinal; esta é a formulação calendárica natural em português.
- source_word: לַחֹדֶשׁ
  choice: do mês
  rationale: Embora חֹדֶשׁ também possa se relacionar à lua nova, em fórmulas de data designa normalmente o mês.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: ao anoitecer
  rationale: A expressão marca os limites temporais inicial e final. “Ao anoitecer” é natural e pontual em português, sem impor uma precisão técnica maior do que a do hebraico.
- source_word: תֹּאכְלוּ
  choice: vocês comerão
  rationale: O imperfeito tem força instrutiva no contexto legal. O futuro em português expressa adequadamente a determinação, com leitura mais corrente do que “comereis”.
- source_word: מַצֹּת
  choice: pão sem fermento
  rationale: Designa pão preparado sem fermento. A forma singular coletiva é idiomática e transparente em português.
- source_word: עַד
  choice: até
  rationale: Indica o limite final do período prescrito.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: o vigésimo primeiro dia
  rationale: É a forma ordinal idiomática em português para a expressão numérica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura amplamente acessível no Brasil. Mantém a repetição de “do mês” e de “ao anoitecer”, preservando os dois limites calendáricos do texto hebraico. O pronome “vocês” torna explícito o plural de תֹּאכְלוּ.
