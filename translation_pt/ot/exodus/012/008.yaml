  text: וְ/אָכְל֥וּ אֶת הַ/בָּשָׂ֖ר בַּ/לַּ֣יְלָה הַ/זֶּ֑ה צְלִי אֵ֣שׁ וּ/מַצּ֔וֹת עַל מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/008.yaml
  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: pt
  text: Naquela noite[a], comerão a carne assada ao fogo[b]; com pães sem fermento e ervas amargas a comerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nesta noite”. A expressão hebraica é literalmente “nesta noite” ou “durante esta noite” e aponta para a noite específica da refeição da Páscoa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “assada de fogo” ou “assada com fogo”; a expressão enfatiza que a carne devia ser assada, não preparada por outro método.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: comerão
  rationale: O qatal com conjunção, neste contexto ritual e prescritivo, tem força diretiva/futura. O futuro do indicativo comunica naturalmente a determinação em português.
- source_word: הַבָּשָׂר
  choice: a carne
  rationale: Em contexto alimentar, “carne” é o equivalente moderno e natural de בָּשָׂר.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: Naquela noite
  rationale: A expressão identifica a noite específica da refeição pascal. “Naquela noite” é idiomático em português; a alternativa mais literal é registrada em nota.
- source_word: צְלִי אֵשׁ
  choice: assada ao fogo
  rationale: A expressão indica preparo por assadura mediante fogo, em contraste com outros métodos de cozimento mencionados no versículo seguinte.
- source_word: וּמַצּוֹת
  choice: com pães sem fermento
  rationale: מַצּוֹת designa pães ou bolos não fermentados. O plural “pães sem fermento” preserva o número e é claro para leitores atuais.
- source_word: עַל
  choice: com
  rationale: Neste contexto culinário, a preposição expressa acompanhamento, não posição física.
- source_word: מְרֹרִים
  choice: ervas amargas
  rationale: A expressão tradicional e contextualmente precisa identifica os vegetais amargos que acompanhavam a refeição.
- source_word: יֹאכְלֻהוּ
  choice: a comerão
  rationale: A retomada final preserva a repetição enfática do hebraico e o sufixo objeto referente à carne.
