review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a sequência ritual, o sentido provável de סַף como recipiente, os elementos da porta e a proibição distributiva. A nota preserva de modo apropriado a alternativa lexical «limiar». Contudo, «até pela manhã» não verte naturalmente עַד בֹּקֶר e introduz uma construção temporal inadequada neste contexto.
  naturalness: «Peguem», «feixe de hissopo», «verga» e «ombreiras» são claros e apropriados ao registro. «Nenhum de vocês saia da entrada de sua casa» é compreensível, mas «sair da entrada» pode sugerir afastar-se do vão, não sair da casa por ele. «Não saia pela entrada de sua casa» exprime melhor a proibição.
  terminology: «Hissopo», «bacia», «verga» e «ombreiras» são escolhas precisas e naturais. A alternativa «limiar» deve permanecer em nota, pois corresponde a uma possibilidade lexical real para saf.
  issues:
  - severity: medium
    issue: «até pela manhã»
    rationale: A expressão não é idiomática como limite temporal para עַד בֹּקֶר («até o amanhecer» / «até de manhã»). «Até o amanhecer» é claro, natural e conserva o sentido temporal.
  - severity: low
    issue: «saia da entrada de sua casa»
    rationale: Embora formalmente próximo, «sair da entrada» é ambíguo em português. «Não saia pela entrada de sua casa» comunica naturalmente a ideia de não deixar a casa através de sua porta, sem alterar o sentido.
  revised_text: Peguem um feixe de hissopo e mergulhem-no no sangue que está na bacia[a]. Com um pouco do sangue que está na bacia, toquem a verga e as duas ombreiras. Nenhum de vocês saia pela entrada de sua casa até o amanhecer.
  revised_footnotes:
