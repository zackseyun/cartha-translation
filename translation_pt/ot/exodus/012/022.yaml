  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: pt
  text: Peguem um feixe de hissopo e mergulhem-no no sangue que está na bacia[a]. Com um pouco do sangue que está na bacia, toquem a verga e as duas ombreiras. Nenhum de vocês saia pela entrada de sua casa até o amanhecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limiar”. O hebraico saf pode ter esse sentido, mas aqui “bacia” é preferível porque o sangue está dentro dela e o hissopo é mergulhado nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: um feixe de hissopo
  rationale: אֲגֻדָּה designa um conjunto reunido ou atado; “feixe” expressa com naturalidade o instrumento ritual concreto. “Hissopo” mantém a designação tradicional, embora a identificação botânica exata seja discutida.
- source_word: בַּדָּם
  choice: no sangue
  rationale: Com טבל, a preposição ב indica aquilo em que o objeto é mergulhado; “no sangue” é direto e idiomático em português.
- source_word: הַסַּף
  choice: a bacia
  rationale: O sangue está dentro do objeto e o hissopo é mergulhado nele, o que favorece o sentido de recipiente. A alternativa lexical “limiar” é mantida em nota.
- source_word: וְהִגַּעְתֶּם
  choice: toquem
  rationale: O hifil de נגע indica fazer entrar em contato. “Toquem” preserva a ação concreta sem acrescentar a ideia mais interpretativa de aplicar ou aspergir.
- source_word: הַמַּשְׁקוֹף
  choice: a verga
  rationale: “Verga” é o termo arquitetônico corrente para a peça horizontal superior do vão da porta.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: as duas ombreiras
  rationale: מְזוּזוֹת são os dois elementos verticais laterais da entrada; “ombreiras” é preciso e natural em português.
- source_word: מִן הַדָּם
  choice: com um pouco do sangue
  rationale: מִן assinala que se toma parte do sangue contido na bacia; a formulação comunica de modo claro o valor partitivo e instrumental.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: Nenhum de vocês saia
  rationale: אִישׁ após a proibição no plural tem força distributiva. A construção portuguesa transmite naturalmente que a ordem se aplica a cada pessoa.
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: da entrada de sua casa
  rationale: פֶּתַח significa abertura ou entrada. O singular possessivo conserva a formulação distributiva do hebraico sem sugerir que a proibição se limite aos homens.
- source_word: עַד בֹּקֶר
  choice: até pela manhã
  rationale: Expressão temporal direta, vertida de forma natural e digna em português.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ ... בֵּיתוֹ
  choice: Nenhum de vocês saia da entrada de sua casa
  alternative: Nenhum de vocês saia da entrada de suas casas
  rationale: O singular “sua casa” preserva a força individual e distributiva do hebraico. Em português, “nenhum de vocês” inclui naturalmente todo o grupo e não restringe a ordem aos homens.
- issue: Sentido de הַסַּף neste versículo
  choice: bacia
  alternative: limiar
  rationale: A sintaxe imediata fala do sangue que está “em” הַסַּף e do hissopo mergulhado nele, favorecendo fortemente um recipiente. Como “limiar” é uma alternativa lexical genuína, ela é registrada em nota, sem eliminar a ambiguidade textual.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Empregam-se imperativos no plural (“peguem”, “mergulhem”, “toquem”) e termos arquitetônicos precisos, porém correntes (“verga”, “ombreiras”). A repetição de “sangue” e “bacia” acompanha a estrutura hebraica e favorece a clareza ritual.
