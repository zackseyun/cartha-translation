  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: pt
  text: Não comam nada fermentado[a]; em todos os lugares onde vocês moram[b], comam pão sem fermento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhuma coisa fermentada”. O termo hebraico é mais amplo que “pão” e inclui tudo o que tenha sido fermentado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em todos os seus povoados”. A expressão se refere a todo lugar onde vocês moram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: nada fermentado
  rationale: 'Na proibição, כָּל com o substantivo singular מַחְמֶצֶת tem força abrangente: nenhuma coisa fermentada deve ser comida. A formulação evita restringir o sentido apenas ao pão.'
- source_word: לֹא תֹאכֵלוּ
  choice: não comam
  rationale: O imperfeito com לֹא expressa uma proibição. O imperativo negativo é natural no português atual e preserva a força normativa.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: em todos os lugares onde vocês morarem
  rationale: מוֹשָׁב pode indicar lugar de habitação ou povoado. A tradução comunica a extensão da ordem a todo lugar em que o povo viesse a residir, sem limitá-la às casas.
- source_word: תֹּאכְלוּ
  choice: comam
  rationale: O imperfeito funciona aqui como ordem positiva, em paralelo com a proibição anterior. O imperativo é direto e natural.
- source_word: מַצּוֹת
  choice: pão sem fermento
  rationale: O plural hebraico designa pães feitos sem fermentação. A expressão é clara, corrente e acessível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas ao povo. A tradução usa “vocês” de modo implícito nos verbos e prefere formulações naturais sem perder a abrangência do hebraico.
