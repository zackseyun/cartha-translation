  source_fidelity: 'A estrutura temporal e de abrangência está bem representada: a ação ocorre à meia-noite e alcança os primogênitos desde a casa de Faraó até o cativo, incluindo os animais. «Cativo» e «calabouço» refletem adequadamente שְׁבִי e בֵּית הַבּוֹר. Contudo, «abateu» é um verbo normalmente associado, em português contemporâneo, ao abate de animais e cria uma associação imprópria ao aplicar-se indistintamente às pessoas e aos animais. «Feri[u] de morte» conserva a imagem de נכה e explicita o resultado letal exigido pelo contexto.'
  naturalness: A redação é clara e de registro digno. A substituição de «abateu» por «feriu de morte» produz uma formulação mais natural e apropriada para pessoas, sem perder a força narrativa. «Animais de criação» comunica melhor o coletivo בְּהֵמָה do que «animais domésticos», expressão que pode sugerir animais de estimação.
  terminology: «Yahweh» preserva corretamente o tetragrama. «Faraó», «primogênito», «cativo» e «calabouço» são escolhas adequadas. «Animais de criação» é preferível para o gado/livestock do hebraico, sem restringir o termo a bovinos.
