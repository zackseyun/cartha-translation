    issue: «Abateu» aplicado aos primogênitos humanos
    rationale: Embora possa denotar matar, no uso moderno «abater» se associa fortemente ao abate de animais. «Feri[u] de morte» traduz o verbo hebraico נכה com maior fidelidade imagética e registro mais adequado.
  - severity: low
    issue: «Animais domésticos» para בְּהֵמָה
    rationale: A expressão pode incluir animais de estimação. O contexto aponta para animais mantidos como criação/livestock; «animais de criação» é mais preciso e amplamente compreensível.
