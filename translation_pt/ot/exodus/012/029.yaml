revisions:
- from: À meia-noite, Yahweh abateu todo primogênito na terra do Egito, desde o primogênito do faraó, que estava sentado em seu trono, até o primogênito do cativo que estava no calabouço[a], e todo primogênito dos animais domésticos.
  to: À meia-noite, Yahweh feriu de morte todo primogênito na terra do Egito, desde o primogênito do faraó, que estava sentado em seu trono, até o primogênito do cativo que estava no calabouço[a], e todo primogênito dos animais de criação.
  rationale: A revisão elimina a conotação de abate animal aplicada a seres humanos, mantendo a noção de golpe letal de נכה mediante «feriu de morte». Também especifica que בְּהֵמָה se refere a animais de criação, não a animais domésticos em sentido de estimação. A construção «desde ... até ...», o nome Yahweh e a alternativa de nota permanecem preservados.
