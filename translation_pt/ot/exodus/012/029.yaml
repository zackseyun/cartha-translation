  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: pt
  text: À meia-noite, Yahweh feriu de morte todo primogênito na terra do Egito, desde o primogênito do faraó, que estava sentado em seu trono, até o primogênito do cativo que estava no calabouço[a], e todo primogênito dos animais de criação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do prisioneiro que estava na masmorra”.'
    reason: Alternativa lexical para הַשְּׁבִי e בֵּית הַבּוֹר, que podem ser expressos como “prisioneiro” e “masmorra”.
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: À meia-noite
  rationale: A construção narrativa introduz o acontecimento seguinte, e a expressão temporal significa literalmente o meio da noite. Em português atual, “À meia-noite” comunica ambos com naturalidade, sem a fórmula arcaica “E aconteceu que”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הִכָּה
  choice: abateu
  rationale: Neste contexto, נכה designa um golpe que causa a morte. “Abateu” mantém a imagem do golpe e deixa claro o resultado letal, sem recorrer ao arcaísmo “feriu de morte”.
- source_word: כָל בְּכוֹר
  choice: todo primogênito
  rationale: Preserva a força distributiva de כָל e o sentido de בכור como o primeiro nascido.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém a expressão geográfica formal do hebraico.
- source_word: מִבְּכֹר ... עַד בְּכוֹר
  choice: desde o primogênito ... até o primogênito
  rationale: Reproduz naturalmente em português a construção hebraica que indica toda a extensão social dos atingidos.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: que estava sentado em seu trono
  rationale: O particípio descreve o faraó em sua posição régia; a oração relativa se encaixa naturalmente na narrativa passada.
- source_word: בְּכוֹר הַשְּׁבִי
  choice: o primogênito do cativo
  rationale: שבי indica alguém levado cativo. “Cativo” conserva essa nuance e a oposição entre a posição mais elevada e a mais baixa.
- source_word: אֲשֶׁר בְּבֵית הַבּוֹר
  choice: que estava no calabouço
  rationale: A expressão literalmente relacionada à “casa do poço” designa, neste contexto, um local subterrâneo de encarceramento. “Calabouço” preserva essa imagem de modo compreensível.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: e todo primogênito dos animais domésticos
  rationale: בהמה abrange os animais mantidos pelas pessoas, não apenas bovinos; “animais domésticos” é amplo e claro em português internacional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “Jeová” reflete uma vocalização híbrida posterior.
- issue: Força letal de הִכָּה nesta praga
  choice: abateu
  alternative: feriu; matou
  rationale: O contexto exige um resultado mortal. “Abateu” conserva tanto a imagem verbal de golpear quanto a letalidade, sem reduzir o verbo simplesmente a “matou”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitam-se fórmulas narrativas arcaicas, preservando-se a estrutura “desde... até...” e a concretude do encarceramento subterrâneo.
