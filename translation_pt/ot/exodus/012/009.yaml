  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: pt
  text: Não comam nada dele cru nem cozido em água, mas somente assado no fogo, com a cabeça, as pernas e as vísceras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: cru
  rationale: Neste contexto culinário, indica carne não assada nem cozida; “cru” é a forma mais clara e natural em português.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: nem cozido em água
  rationale: A construção enfática com a menção explícita da água indica cocção em água. “Cozido em água” é natural e mantém a especificidade do hebraico.
- source_word: כִּי אִם
  choice: mas somente
  rationale: Expressa forte contraste e exclusividade entre os métodos proibidos e o método exigido.
- source_word: צְלִי אֵשׁ
  choice: assado no fogo
  rationale: Reproduz de modo corrente o sentido de carne assada por ação direta do fogo.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: com a cabeça, as pernas e as vísceras
  rationale: O עַל repetido introduz aqui as partes que devem acompanhar o animal assado. “Vísceras” traduz קֶרֶב com precisão e dignidade, enquanto “pernas” é mais compreensível que uma referência anatômica mais técnica.
- source_word: מִמֶּנּוּ
  choice: nada dele
  rationale: Preserva naturalmente o sentido partitivo dentro da proibição em português.
theological_decisions: []
