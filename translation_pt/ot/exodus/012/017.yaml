base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: pt
  text: Observem a Festa dos Pães sem Fermento[a], pois foi precisamente neste dia que tirei suas hostes[b] da terra do Egito. Guardem este dia por todas as suas gerações, como estatuto permanente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, literalmente, “os pães sem fermento” ou “as coisas sem fermento”. A expressão hebraica pode referir-se ao alimento ou, por extensão, à celebração.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus contingentes”, “suas divisões” ou “suas companhias”. O termo hebraico retrata Israel como um corpo organizado que sai do Egito.
    reason: lexical_alternative
  - marker: c
    text: Ou “como estatuto para sempre” ou “como estatuto perpétuo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Guardem
  rationale: O verbo שׁמר pode significar guardar, manter ou observar. “Guardem” preserva sua força pactual e permite reproduzir a repetição hebraica nas duas orações, sem perder o sentido de observância ritual.
- source_word: הַמַּצּוֹת
  choice: os pães sem fermento
  rationale: A expressão significa literalmente “os [alimentos/pães] não fermentados” e, no contexto, pode também designar metonimicamente a celebração. A tradução concreta evita acrescentar “festa” ao texto principal e mantém aberta essa extensão de sentido.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: precisamente neste dia
  rationale: A expressão idiomática enfatiza a exatidão do dia. “Precisamente neste dia” comunica essa ênfase de modo natural em português.
- source_word: הוֹצֵאתִי
  choice: tirei
  rationale: O hifil de יצא significa fazer sair ou tirar. “Tirei” é direto, idiomático e preserva a ação divina.
- source_word: צִבְאוֹתֵיכֶם
  choice: seus exércitos
  rationale: צָבָא denota exército, hoste ou contingente organizado. “Exércitos” conserva a imagem de Israel saindo do Egito como corpo organizado; uma nota registra alternativas menos militares.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão indica observância continuada através das gerações sucessivas e é transmitida de forma clara e corrente em português.
- source_word: חֻקַּת עוֹלָם
  choice: como estatuto permanente
  rationale: חֻקָּה é uma prescrição ou estatuto, e עוֹלָם indica duração contínua ou indefinida no contexto pactual. “Estatuto permanente” preserva essa força sem impor uma definição filosófica de eternidade absoluta.
theological_decisions:
- issue: Se הַמַּצּוֹת designa diretamente o alimento ou explicitamente a festa
  choice: “os pães sem fermento” no texto principal, com a possibilidade festiva em nota
  alternative: “a Festa dos Pães sem Fermento”
  rationale: O hebraico não contém o substantivo “festa”, embora a expressão possa designar a celebração por metonímia. O texto principal mantém a formulação concreta e a nota preserva a leitura contextual.
- issue: A duração expressa por חֻקַּת עוֹלָם
  choice: “como estatuto permanente”
  alternative: “como estatuto para sempre” ou “como estatuto perpétuo”
  rationale: A tradução comunica uma obrigação pactual duradoura e evita decidir além do contexto se עוֹלָם exige, neste caso, eternidade absoluta em sentido filosófico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Guardem” reproduz a estrutura do hebraico. “Pães sem fermento” é mais transparente ao leitor comum do que “pães ázimos”, enquanto a nota conserva o sentido possível de celebração.
