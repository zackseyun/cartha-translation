revisions:
- from: Guardem os pães sem fermento[a], porque foi precisamente neste dia que tirei seus exércitos[b] da terra do Egito. Guardem este dia por todas as suas gerações, como estatuto permanente[c].
  to: Observem a Festa dos Pães sem Fermento[a], pois foi precisamente neste dia que tirei suas hostes[b] da terra do Egito. Guardem este dia por todas as suas gerações, como estatuto permanente[c].
  rationale: A revisão torna explícito no texto português o sentido de observância ritual, que «Guardem os pães» não comunica naturalmente, sem ocultar em nota a formulação concreta do hebraico. Também substitui «exércitos» por «hostes», uma equivalência mais fiel ao retrato de Israel como corpo organizado. O restante é mantido, incluindo a distinção entre a ênfase de «precisamente neste dia» e o posterior «este dia».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:24Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a causalidade, a ênfase de «neste mesmo dia», a saída do Egito, a repetição do mandamento e a duração intergeracional. Contudo, «Guardem os pães sem fermento» em português tende a significar conservar ou preservar alimento, e não observar uma prática ritual; assim, não comunica de modo suficiente o uso contextual de שׁמר. «Seus exércitos» também sugere vários exércitos militares propriamente ditos e é menos apropriado que «suas hostes» para צִבְאוֹתֵיכֶם.
  naturalness: «Observem a Festa dos Pães sem Fermento» é claro, idiomático e adequado ao registro bíblico moderno. «Suas hostes» mantém o tom elevado sem ser obscuro, enquanto «Guardem este dia» conserva naturalmente a repetição hebraica no segundo mandamento.
  terminology: «Festa dos Pães sem Fermento» explicita a referência cultual que o contexto exige em português; a nota registra que o hebraico, literalmente, diz «os pães/as coisas sem fermento» e pode ser entendido metonimicamente. «Hostes» representa melhor a imagem de um povo organizado do que «exércitos». «Estatuto permanente» é uma boa equivalência moderna para חֻקַּת עוֹלָם.
  issues:
  - severity: medium
    issue: «Guardem os pães sem fermento» é semanticamente ambíguo em português de modo inadequado.
    rationale: Embora שׁמר possa ser «guardar», neste contexto ritual o objeto é observado/celebrado. A formulação atual pode ser lida como uma instrução para conservar pães, em vez de observar a celebração.
  - severity: medium
    issue: «Seus exércitos» é excessivamente concreto e militar para צִבְאוֹתֵיכֶם.
    rationale: O termo hebraico designa Israel em suas formações ou hostes ordenadas. «Hostes» preserva a imagem coletiva e organizada sem afirmar que se tratava de exércitos distintos.
