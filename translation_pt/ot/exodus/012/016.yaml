  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: pt
  text: No primeiro dia haverá para vocês uma assembleia santa[a], e no sétimo dia, outra assembleia santa. Nenhum trabalho será feito nesses dias, exceto o que for necessário para cada pessoa[b] comer; somente isso poderá ser preparado para vocês.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reunião sagrada”; tradicionalmente, “santa convocação”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico néfesh, que aqui significa uma pessoa, e não especificamente “alma” no sentido moderno.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “somente isso será feito para vocês”; no contexto, trata-se do preparo do alimento permitido nesses dias.
    reason: translation_clarity
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: assembleia santa
  rationale: A expressão designa uma reunião convocada e consagrada. “Assembleia santa” é clara, digna e atual, preservando tanto a ideia de reunião quanto seu caráter sagrado.
- source_word: יִהְיֶה לָכֶם
  choice: haverá para vocês
  rationale: Preserva o valor existencial de היה e a expressão dativa לָכֶם, com formulação natural em português.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: Nenhum trabalho será feito nesses dias
  rationale: Mantém a construção passiva e entende o sufixo plural como referência temporal aos dois dias mencionados, sem restringir indevidamente o sentido amplo de מְלָאכָה.
- source_word: אַךְ אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: exceto o que for necessário para cada pessoa comer
  rationale: אַךְ introduz a única exceção à proibição. נֶפֶשׁ significa aqui cada indivíduo, e a formulação portuguesa explicita de modo natural a necessidade prática de preparar alimento, sem sugerir o sentido metafísico moderno de “alma”.
- source_word: הוּא לְבַדּוֹ יֵעָשֶׂה לָכֶם
  choice: somente isso poderá ser preparado para vocês
  rationale: “Somente isso” conserva a ênfase exclusiva de הוּא לְבַדּוֹ. “Preparado” explicita a referência contextual ao alimento, enquanto “poderá” expressa a permissão criada pela exceção legal e “para vocês” preserva לָכֶם.
