base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: pt
  text: Será comido numa só casa; não levem nada da carne para fora da casa[a] e não quebrem nenhum osso dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “num só grupo familiar”. A palavra hebraica pode indicar tanto a casa física quanto o grupo familiar reunido nela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: numa só casa
  rationale: בַּיִת pode designar tanto a construção quanto o grupo doméstico. O contraste imediato com levar a carne para fora favorece aqui o sentido espacial concreto, expresso naturalmente por “numa só casa”.
- source_word: יֵאָכֵל
  choice: será comido
  rationale: O nifal imperfeito de אכל tem forma passiva e, neste contexto legal, estabelece como o animal da Páscoa deve ser consumido. “Será comido” preserva a voz e a força normativa.
- source_word: לֹא תוֹצִיא
  choice: não levem
  rationale: O hifil de יצא significa fazer sair ou levar para fora. “Não levem” é corrente em português e mantém a proibição dirigida ao grupo.
- source_word: מִן הַבַּיִת ... חוּצָה
  choice: para fora da casa
  rationale: A preposição com o advérbio direcional indica movimento do interior para o exterior, não apenas procedência.
- source_word: מִן הַבָּשָׂר
  choice: nada da carne
  rationale: Em contexto alimentar, בָּשָׂר corresponde naturalmente a “carne”; a construção partitiva com מִן comunica que nenhuma porção deve ser retirada.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: e não quebrem nenhum dos seus ossos
  rationale: O singular עֶצֶם tem valor distributivo. O plural idiomático “nenhum dos seus ossos” expressa claramente que os ossos do animal não devem ser quebrados, enquanto “seus” conserva a referência pronominal sem repetir um substantivo ausente do versículo.
theological_decisions:
- issue: Referente do pronome final בוֹ
  choice: o animal pascal como um todo (“seus ossos”)
  alternative: o cordeiro especificamente
  rationale: O pronome masculino singular retoma a vítima pascal em discussão. A tradução não introduz “cordeiro”, substantivo que não aparece neste versículo, mas permanece compatível com o contexto mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural verbal acompanha os destinatários coletivos do hebraico; a formulação preserva o caráter normativo sem recorrer a linguagem excessivamente arcaica.
