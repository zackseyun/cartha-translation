base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: pt
  text: 'Os egípcios pressionavam o povo, apressando-se para mandá-lo sair da terra, pois diziam: “Todos nós vamos morrer!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todos nós estamos morrendo!”; mais literalmente: “Todos nós [estamos] mortos.”'
    reason: Preserva a amplitude do particípio hebraico מֵתִים, que, no clamor de pânico, pode descrever morte já presente, em curso ou iminente.
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל הָעָם
  choice: Os egípcios pressionavam o povo
  rationale: O nome geográfico מִצְרַיִם funciona coletivamente, e חזק com עַל comunica forte pressão exercida sobre alguém. O imperfeito narrativo é expresso com naturalidade pelo pretérito imperfeito português, destacando a pressão em curso.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: para que saísse depressa
  rationale: Os dois infinitivos consecutivos exprimem propósito marcado por urgência. Em português, a oração final com 'depressa' comunica isso naturalmente; o singular coletivo 'povo' licencia 'saísse', enquanto o hebraico retoma seus integrantes no plural.
- source_word: מִן הָאָרֶץ
  choice: daquela terra
  rationale: Preserva a referência à 'terra', entendida no contexto como o Egito, e 'daquela' expressa adequadamente o afastamento indicado por מִן.
- source_word: כִּי אָמְרוּ
  choice: pois diziam
  rationale: כִּי introduz a razão da urgência, e a formulação portuguesa mantém a ligação causal e a fala coletiva recorrente.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Todos nós vamos morrer!
  rationale: A construção nominal com o particípio מֵתִים pode, neste contexto de pânico, exprimir morte iminente. A forma idiomática portuguesa comunica a percepção dos egípcios sem sugerir literalmente que todos já estavam mortos.
theological_decisions:
- issue: Valor temporal de מֵתִים
  choice: vamos morrer
  alternative: estamos todos mortos / estamos todos morrendo
  rationale: O contexto após a morte dos primogênitos favorece a exclamação de que a morte alcançaria a todos. A nota preserva as possibilidades mais formais da expressão hebraica, evitando transformar a interpretação contextual em certeza lexical.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A frase evita repetição artificial dos dois infinitivos hebraicos, mas conserva sua urgência por meio de 'pressionavam' e 'depressa'.
