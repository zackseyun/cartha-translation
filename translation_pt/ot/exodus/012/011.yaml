  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: pt
  text: 'E vocês o comerão assim: com a cintura cingida[a], as sandálias nos pés e o bastão na mão. Vocês o comerão às pressas; é a Páscoa de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com os lombos cingidos”, expressão que indica estar vestido e pronto para partir imediatamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָכָה
  choice: E vocês o comerão assim
  rationale: A expressão introduz o modo prescrito para comer; “assim” é natural e mantém a força instrutiva.
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: vocês o comerão
  rationale: O futuro em contexto legal comunica ordem com dignidade e clareza no português moderno.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: com a cintura cingida
  rationale: Preserva a imagem corporal de prender a roupa para estar pronto, sem recorrer à formulação arcaica “lombos cingidos”.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: as sandálias nos pés
  rationale: “Sandálias” corresponde ao calçado do contexto antigo, e a formulação reproduz de modo natural a construção hebraica.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: e o cajado na mão
  rationale: “Cajado” se ajusta ao contexto de viagem e conserva a imagem concreta do hebraico.
- source_word: בְּחִפָּזוֹן
  choice: às pressas
  rationale: Expressa urgência e prontidão para a partida em linguagem portuguesa corrente.
- source_word: פֶּסַח
  choice: Páscoa
  rationale: É o termo estabelecido em português para o rito aqui designado, embora neste contexto também possa envolver a oferta e a refeição pascal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Relação expressa por הוּא לַיהוָה
  choice: é a Páscoa de Yahweh
  alternative: é uma Páscoa para Yahweh
  rationale: A preposição ל pode indicar pertencimento, dedicação ou referência. “De Yahweh” identifica naturalmente a celebração como pertencente a ele sem eliminar por completo sua dimensão de dedicação.
- issue: Expressão מָתְנֵיכֶם חֲגֻרִים
  choice: com a cintura cingida
  alternative: com os lombos cingidos
  rationale: A escolha mantém a imagem concreta de prontidão para partir, mas evita uma expressão anatômica hoje pouco transparente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa masculina plural do hebraico sem regionalismo excessivo; “cingida” conserva solenidade e imagem concreta, esclarecida em nota.
