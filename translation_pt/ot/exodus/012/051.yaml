base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: pt
  text: E, naquele mesmo dia, Yahweh tirou os filhos de Israel da terra do Egito, segundo seus contingentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo as suas hostes” ou “segundo seus agrupamentos”. O hebraico pode destacar a organização do povo em grupos na ocasião da saída.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa hebraica de modo natural e digno em português, introduzindo a circunstância temporal.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: naquele mesmo dia
  rationale: Expressa a precisão enfática do idioma hebraico; “naquele” corresponde à perspectiva retrospectiva da narrativa.
- source_word: הוֹצִיא
  choice: tirou
  rationale: O hifil de יצא tem sentido causativo, “fazer sair/tirar”; “tirou ... da terra” é claro e idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e corporativa do hebraico, que abrange o povo de Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Retém explicitamente אֶרֶץ, “terra”, e a preposição portuguesa comunica naturalmente a saída de um lugar.
- source_word: עַל צִבְאֹתָם
  choice: segundo os seus contingentes
  rationale: צְבָאוֹת pode designar hostes, tropas ou agrupamentos organizados; “contingentes” conserva a ideia de grupos ordenados sem impor necessariamente atividade militar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Designação corporativa בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A escolha conserva a imagem hebraica de parentesco e descendência sem reduzi-la a um simples gentílico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a cadência narrativa bíblica sem recorrer a construções arcaicas. O marcador [a] está colocado após a expressão a que se refere.
