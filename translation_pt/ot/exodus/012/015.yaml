  terminology: “Pães sem fermento”, “fermento” e “qualquer coisa fermentada” são escolhas naturais e fiéis. “Será eliminada de Israel” mantém a gravidade e a indeterminação da fórmula hebraica, a qual a nota explica sem determinar indevidamente o modo da sanção.
