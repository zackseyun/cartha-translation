  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: pt
  text: Durante sete dias vocês comerão pães sem fermento. Mas, no primeiro dia, eliminarão o fermento[a] de suas casas, pois qualquer pessoa que comer alguma coisa fermentada será eliminada de Israel[b], do primeiro dia ao sétimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “farão cessar o fermento de suas casas”; isto é, deverão retirá-lo ou destruí-lo.'
    reason: lexical_alternative
  - marker: b
    text: “Será eliminada” traduz uma expressão jurídica hebraica. Ela pode indicar exclusão da comunidade, morte ou juízo divino; este versículo não especifica de que modo a sanção seria executada.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: pães sem fermento
  rationale: O substantivo designa pães preparados sem fermento. A expressão é clara e natural em português, além de conservar o sentido ritual do contexto.
- source_word: אַךְ
  choice: Mas, já
  rationale: A partícula introduz uma transição restritiva e enfática para a exigência relativa ao primeiro dia. “Mas, já” comunica tanto a mudança quanto a prioridade temporal sem tornar a frase artificial.
- source_word: תַּשְׁבִּיתוּ
  choice: eliminarão
  rationale: O hifil de שׁבת significa literalmente fazer cessar. Neste contexto, a ordem prática é retirar ou eliminar o fermento das casas; “eliminarão” preserva a força do mandamento.
- source_word: שְּׂאֹר
  choice: fermento
  rationale: O termo indica o agente fermentador, provavelmente massa fermentada usada como fermento. “Fermento” é a designação ampla e compreensível em português.
- source_word: חָמֵץ
  choice: qualquer coisa fermentada
  rationale: O termo abrange aquilo que foi fermentado, sem se limitar explicitamente ao pão. Esta formulação conserva a abrangência do hebraico.
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: O nifal de כרת é uma fórmula jurídica e pactual que indica que alguém é cortado ou eliminado de seu povo. A escolha conserva a gravidade da sanção sem determinar seu modo exato.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: toda pessoa
  rationale: נֶפֶשׁ, nesta fórmula legal, refere-se ao indivíduo, não especificamente a uma “alma” em sentido antropológico. “Pessoa” é idiomático e preciso.
- source_word: מִיִּשְׂרָאֵל
  choice: do meio de Israel
  rationale: A expressão indica separação de Israel como comunidade da aliança. “Do meio de Israel” explicita naturalmente em português a dimensão comunitária.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: desde o primeiro dia até o sétimo
  rationale: A formulação mantém a posição final e a extensão temporal do hebraico, indicando o período completo em que vigora a proibição.
theological_decisions:
- issue: Sentido da sanção expressa por וְנִכְרְתָה
  choice: Conservar a fórmula jurídica como “será eliminada do meio de Israel”, sem especificar o mecanismo da sanção.
  alternative: “será excluída da comunidade”, “será morta” ou “será removida por juízo divino”
  rationale: O hebraico expressa uma sanção pactual grave, mas o versículo não informa se ela ocorre por expulsão, morte ou ação judicial divina. A tradução não deve resolver essa tensão além do que o texto afirma.
- issue: Alcance da expressão temporal final
  choice: Manter “desde o primeiro dia até o sétimo” no fim da frase, como no hebraico.
  alternative: Antepor a expressão a “comer”, tornando explícito que a sanção se aplica a quem comer fermentado durante esse período.
  rationale: A posição final preserva a estrutura e uma possível ambiguidade sintática do texto, embora o sentido contextual seja que a proibição e sua sanção vigoram ao longo dos sete dias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “vocês” para a segunda pessoa plural e o futuro simples para preservar o tom prescritivo. “Pães sem fermento” evita o termo técnico menos difundido “ázimos”, enquanto “eliminada do meio de Israel” mantém a solenidade e a abertura semântica da fórmula legal.
