base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: pt
  text: O animal ficará sob os cuidados de vocês até o décimo quarto dia deste mês; então toda a assembleia da comunidade de Israel o abaterá entre as duas tardes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as duas tardes”, expressão geralmente entendida como o período ao redor do pôr do sol, no fim da tarde ou no crepúsculo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: O animal ficará sob os cuidados de vocês
  rationale: A construção indica que o animal selecionado deve permanecer sob a guarda dos israelitas. A explicitação de “o animal” retoma naturalmente o referente do contexto, e “sob os cuidados” comunica a ideia de custódia sem sugerir vigilância militar.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: até o décimo quarto dia deste mês
  rationale: Reproduz com clareza a data indicada pela expressão hebraica.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: então ... o abaterá
  rationale: שׁחט designa o abate de um animal. “Abater” é preciso e natural em português, enquanto “então” marca a progressão temporal sem alterar a relação entre as instruções.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: toda a assembleia da comunidade de Israel
  rationale: Mantém as duas expressões coletivas do hebraico e a apresentação corporativa de Israel, sem substituir o sujeito pelos lares que realizariam a ação na prática.
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre as duas tardes
  rationale: Conserva no texto principal a formulação incomum e potencialmente ambígua do hebraico, em vez de fixar uma interpretação temporal específica como “ao entardecer”.
theological_decisions:
- issue: Sujeito coletivo da ordem de abater
  choice: toda a assembleia da comunidade de Israel o abaterá
  alternative: cada família abaterá seu próprio animal
  rationale: O hebraico apresenta Israel corporativamente como sujeito. A tradução preserva essa formulação e não resolve a tensão com a execução da ordem por famílias no contexto.
- issue: Momento exato do abate
  choice: entre as duas tardes
  alternative: ao entardecer / no crepúsculo
  rationale: A expressão hebraica é idiomática e sua delimitação exata é discutida. A tradução mantém a ambiguidade no texto e esclarece seu sentido geral em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe evita arcaísmos, mas conserva o peso coletivo da expressão hebraica e sua ambiguidade temporal genuína.
