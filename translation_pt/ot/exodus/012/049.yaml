  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: pt
  text: Haverá uma só lei para o nativo e para o estrangeiro que reside entre vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma só instrução haverá para o nativo e para o estrangeiro residente no meio de vocês.”'
    reason: Alternativas lexicais para תּוֹרָה, גֵּר e בְּתוֹכְכֶם. “Instrução” é uma alternativa possível para תּוֹרָה; “estrangeiro residente” e “no meio de vocês” explicitam a ideia de residência comunitária.
lexical_decisions:
- source_word: תּוֹרָה
  choice: lei
  rationale: Neste contexto jurídico sobre a celebração da Páscoa, designa uma norma obrigatória; “lei” é clara e preserva o sentido legal.
- source_word: אַחַת
  choice: uma só
  rationale: Expressa a unidade do padrão jurídico aplicado aos dois grupos; “uma só lei” é natural em português.
- source_word: יִהְיֶה
  choice: haverá
  rationale: Reproduz de modo natural o valor de “será/haverá” na declaração normativa hebraica, sem explicitar além do texto a ideia de aplicação.
- source_word: אֶזְרָח
  choice: o natural da terra
  rationale: Designa o membro nativo da comunidade sem importar a categoria política moderna de cidadania.
- source_word: גֵּר
  choice: o estrangeiro residente
  rationale: Indica um não nativo estabelecido no meio de Israel; evita tanto a imprecisão de “estranho” quanto possíveis conotações atuais de “imigrante”.
- source_word: הַגָּר
  choice: que vive
  rationale: O particípio qualifica o estrangeiro como alguém que reside no meio da comunidade; em português, evita a repetição pouco natural de “residente que reside”.
- source_word: בְּתוֹכְכֶם
  choice: entre vocês
  rationale: Forma contemporânea, clara e amplamente compreensível para indicar a presença dentro da comunidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Natural da terra” conserva a distinção comunitária antiga sem recorrer a “cidadão”; “estrangeiro residente” comunica o estatuto social de גֵּר. A construção “haverá uma só lei” mantém proximidade formal com o hebraico e soa normativa em português.
