  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: pt
  text: Este dia será para vocês um memorial, e vocês o celebrarão como uma festa em honra de Yahweh. Ao longo das suas gerações, vocês o celebrarão como estatuto permanente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estatuto eterno” ou “estatuto perpétuo”. A expressão hebraica חֻקַּת עוֹלָם muitas vezes designa uma ordenança duradoura e continuamente vigente.
    reason: Alternativa lexical que preserva a amplitude temporal de עוֹלָם.
lexical_decisions:
- source_word: וְהָיָה
  choice: será
  rationale: O perfeito com waw, neste contexto legal e instrutivo, tem força futura e prescritiva.
- source_word: הַיּוֹם הַזֶּה
  choice: este dia
  rationale: Tradução direta e natural do sintagma demonstrativo, sem acrescentar ênfase ausente no hebraico.
- source_word: לָכֶם
  choice: para vocês
  rationale: Expressa de modo idiomático a relação do dia com a comunidade destinatária e mantém ampla legibilidade em português.
- source_word: לְזִכָּרוֹן
  choice: um memorial
  rationale: Preserva o sentido de algo instituído para lembrança ou comemoração no contexto cultual.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: vocês o celebrarão como festa
  rationale: Comunica tanto o verbo חגג, celebrar uma festa, quanto o substantivo cognato חַג, sem produzir repetição artificial em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino explícito e indica que a festa é celebrada em honra de Yahweh.
- source_word: לְדֹרֹתֵיכֶם
  choice: ao longo das suas gerações
  rationale: Expressa a continuidade da observância entre gerações sucessivas em português natural.
- source_word: חֻקַּת עוֹלָם
  choice: estatuto permanente
  rationale: חֻקָּה designa uma prescrição estabelecida, e עוֹלָם, neste contexto legal, ressalta sua duração contínua sem exigir que a tradução decida uma questão metafísica sobre duração absoluta.
- source_word: תְּחָגֻּהוּ
  choice: vocês o celebrarão
  rationale: Conserva a repetição enfática do verbo e a coerência lexical com a primeira ordem.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Alcance temporal de חֻקַּת עוֹלָם
  choice: estatuto permanente
  alternative: estatuto eterno; estatuto perpétuo
  rationale: “Permanente” preserva a força duradoura da legislação para as gerações de Israel, sem resolver além do texto se עוֹלָם implica duração metafisicamente infinita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural comunitário. A pontuação divide as duas determinações principais sem enfraquecer a repetição enfática do hebraico.
