  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: pt
  text: Pois, nesta noite, passarei pela terra do Egito[a] e ferirei todo primogênito na terra do Egito, desde o ser humano até o animal[b]; e executarei juízos contra todos os deuses do Egito. Eu sou Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “percorrerei”. O verbo indica passar através da terra, não “passar por cima” no sentido de poupar.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desde o homem até o animal”.'
    reason: lexical_alternative
  - marker: c
    text: Hebraico YHWH, tradicionalmente traduzido por “SENHOR”; também vertido “Jeová”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: passarei pela
  rationale: Com בְאֶרֶץ, o verbo descreve o movimento através da terra; não significa aqui “passar por cima” no sentido de poupar.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: pela terra do Egito / na terra do Egito
  rationale: Mantém a referência territorial explícita do hebraico, com preposições naturais em português conforme cada oração.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: nesta noite
  rationale: Formulação natural que preserva a ênfase demonstrativa de “esta noite”.
- source_word: וְהִכֵּיתִי
  choice: ferirei
  rationale: Equivalente atual e digno de נכה; preserva a força do verbo sem explicitar além do texto, nesta oração, o resultado mortal dado pelo contexto.
- source_word: כָּל בְּכוֹר
  choice: todo primogênito
  rationale: Reproduz o singular coletivo e não acrescenta “macho”, que não está expresso no hebraico.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: desde o ser humano até o animal
  rationale: Preserva o merismo entre humanidade e animais em português moderno e amplamente compreensível.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: contra todos os deuses do Egito
  rationale: A preposição no contexto da expressão judicial indica ação hostil dirigida às divindades do Egito; “deuses” mantém o sentido explícito sem o reduzir a “ídolos”.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: executarei juízos
  rationale: Conserva o caráter judicial da expressão hebraica em linguagem solene e inteligível.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, sem substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e a distinção entre nome e título; a nota registra a tradição portuguesa mais conhecida.
- issue: Natureza de אֱלֹהֵי מִצְרַיִם
  choice: os deuses do Egito
  alternative: os ídolos do Egito; os seres divinos do Egito
  rationale: A tradução mantém a designação teológica do próprio texto e a tensão de juízos dirigidos contra essas divindades, sem decidir se a expressão se refere apenas a imagens ou a realidades espirituais.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A ordem temporal foi antecipada para fluidez. “Ser humano” evita que “homem” seja entendido apenas como adulto masculino, enquanto a nota conserva a forma mais literal. A redação mantém a repetição de “terra do Egito” e o vocabulário judicial do original.
