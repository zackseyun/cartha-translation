  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: pt
  text: Então os filhos de Israel[a] foram e fizeram assim; como Yahweh havia ordenado a Moisés e Arão, assim fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: «os israelitas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foram
  rationale: O wayyiqtol de הלך faz a narrativa avançar. “Foram” preserva o sentido simples do verbo sem explicitar um destino ou propósito que o hebraico apenas deixa implícito.
- source_word: וַיַּעֲשׂוּ
  choice: fizeram assim
  rationale: עשה retoma as instruções anteriores; “fizeram assim” expressa naturalmente em português essa referência anafórica.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar masculina do hebraico. A alternativa idiomática “os israelitas” é registrada em nota.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Marca a correspondência entre a ordem e seu cumprimento. “Exatamente como” comunica com clareza a conformidade enfática indicada no contexto.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa natural em português a anterioridade da ordem de Yahweh em relação à ação dos israelitas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: a Moisés e Arão
  rationale: אֶת marca Moisés e Arão como as pessoas a quem Yahweh ordenou. Em português, “ordenar a alguém” é uma construção natural e fiel, sem introduzir a ideia distinta de mediação expressa por “por meio de”.
- source_word: כֵּן עָשׂוּ
  choice: assim fizeram
  rationale: Mantém a oração final resumitiva e sua ênfase na obediência exata, com cadência digna e natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em transliteração amplamente reconhecida, sem substituí-lo por “SENHOR”.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A expressão principal conserva a forma familiar masculina do hebraico; a forma coletiva e mais idiomática é oferecida em nota, sem apagar a estrutura do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva a repetição enfática do hebraico (“fizeram assim... assim fizeram”), o nome Yahweh e a expressão formal “filhos de Israel”, evitando tanto arcaísmos desnecessários quanto explicitações não presentes no original.
