translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem foi levemente ajustada com “junto com” para evitar uma coordenação rígida, enquanto a metonímia “todo o Egito” e a dupla negação final foram preservadas.
