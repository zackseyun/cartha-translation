  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: pt
  text: Naquela noite, o faraó se levantou, junto com todos os seus servos e todo o Egito[a]. Houve um grande clamor no Egito, pois não havia casa em que não houvesse um morto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Todo o Egito” emprega o nome do país coletivamente para se referir ao povo do Egito.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “não havia casa onde não houvesse ali um morto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O wayyiqtol de קום descreve uma ação passada simples. “Se levantou” é natural em português e comunica a reação noturna imediata sem acrescentar interpretação.
- source_word: לַיְלָה הוּא
  choice: naquela noite
  rationale: A combinação de “noite” com o pronome demonstrativo identifica a noite em questão. “Naquela noite” reproduz naturalmente esse valor temporal em português.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עֶבֶד pode significar servo ou escravo. Neste contexto da corte real, o termo designa as pessoas a serviço do faraó sem exigir que se especifique sua função como oficiais.
- source_word: וְכָל מִצְרַיִם
  choice: e todo o Egito
  rationale: O hebraico emprega o nome do país coletivamente para seus habitantes. A tradução conserva essa metonímia e a abrangência nacional da cena.
- source_word: צְעָקָה גְדֹלָה
  choice: um grande clamor
  rationale: צְעָקָה é um grito ou clamor, frequentemente de aflição. “Grande clamor” mantém a força emocional e o adjetivo do hebraico em registro digno e compreensível.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a causa do clamor. “Pois” expressa claramente a relação causal e combina com o registro narrativo.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: não havia casa em que não houvesse um morto
  rationale: A formulação conserva a dupla negação enfática do hebraico e mantém בַּיִת como “casa”, sem substituí-lo interpretativamente por “família” ou “lar”.
- source_word: מֵת
  choice: um morto
  rationale: O particípio funciona como substantivo indefinido, indicando uma pessoa morta. “Um morto” é conciso, natural e próximo da forma hebraica.
