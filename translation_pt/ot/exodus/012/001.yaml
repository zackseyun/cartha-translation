  text: The LORD said to Moses and to Aaron in the land of Egypt, saying,
translation:
  language: pt
  text: 'O SENHOR disse a Moisés e a Arão, na terra do Egito:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: O SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versalete, preservando a distinção editorial.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol introduz a fala na sequência narrativa; em português, o pretérito perfeito expressa isso naturalmente, sem acrescentar um advérbio como “então” ou “agora”.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: Mantém ambos os destinatários e reproduz de modo natural em português a coordenação das duas expressões preposicionais.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Tradução direta da indicação geográfica, conservando “terra” em vez de reduzi-la simplesmente a “Egito”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz o conteúdo da fala. Em português moderno, os dois-pontos cumprem essa função com mais naturalidade do que o calque “dizendo” no fim do versículo.
theological_decisions:
- issue: Representação do Tetragrama
  choice: O SENHOR
  alternative: Yahweh
  rationale: A forma escolhida segue a tradição bíblica portuguesa e permanece identificável como representação do nome divino, sem impor uma reconstrução vocal específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe evita o calque pouco idiomático “dizendo” e usa dois-pontos para introduzir a fala que continua no versículo seguinte.
