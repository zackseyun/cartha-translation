  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: pt
  text: E acontecerá que, quando vocês entrarem na terra que Yahweh lhes dará, conforme prometeu[a], deverão observar este rito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme disse”. O hebraico diz literalmente “conforme falou”; neste contexto, a fala anterior tem o sentido de promessa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “este serviço” ou “esta observância”. O termo hebraico se refere aqui ao serviço ritual da Páscoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a fórmula hebraica que introduz uma circunstância futura, mas de modo compreensível em português atual.
- source_word: תָבֹאוּ אֶל־הָאָרֶץ
  choice: vocês entrarem na terra
  rationale: בוא com אֶל admite naturalmente o sentido de entrar; “na terra” mantém a linguagem da promessa territorial.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: que Yahweh lhes dará
  rationale: O yiqtol de נתן tem referência futura no contexto, e o nome divino é transliterado como Yahweh.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: conforme prometeu
  rationale: Embora דִּבֵּר signifique literalmente “falou”, o contexto atribui à fala anterior força de promessa.
- source_word: וּשְׁמַרְתֶּם
  choice: deverão observar
  rationale: שׁמר, tendo por objeto uma prática ritual, significa guardá-la ou observá-la; “deverão” comunica a obrigação futura sem rigidez excessiva.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: este rito
  rationale: עֲבֹדָה pode significar serviço, trabalho ou prática cultual; no contexto da Páscoa, “rito” expressa com clareza a observância prescrita.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome pactual em forma reconhecível, sem substituí-lo por um título.
- issue: Força de כַּאֲשֶׁר דִּבֵּר
  choice: conforme prometeu
  alternative: conforme falou; conforme disse
  rationale: A referência é à palavra anterior de Yahweh sobre dar a terra. A tradução explicita sua força promissória, enquanto a nota preserva a formulação mais literal.
- issue: Natureza de הָעֲבֹדָה הַזֹּאת
  choice: este rito
  alternative: este serviço; esta observância
  rationale: No contexto imediato, o termo designa a prática ritual da Páscoa, não serviço em sentido genérico; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com tratamento por “vocês”. A construção inicial conserva algo da solenidade narrativa hebraica; “rito” evita que “serviço” seja entendido como trabalho comum. Todos os marcadores de nota aparecem no texto.
