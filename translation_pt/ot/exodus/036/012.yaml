base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: pt
  text: Fez cinquenta laçadas numa cortina e cinquenta laçadas na borda da cortina que fazia parte do segundo conjunto[a]; as laçadas correspondiam umas às outras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estava na segunda parte unida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: laçadas
  rationale: Designa alças de tecido usadas para unir as cortinas. “Laçadas” distingue essas peças dos colchetes metálicos mencionados no contexto.
- source_word: יְרִיעָה
  choice: cortina
  rationale: No contexto do tabernáculo, o termo designa uma grande peça de tecido; “cortina” é claro, natural e adequado ao cenário.
- source_word: בִּקְצֵה
  choice: na borda
  rationale: קָצֶה pode significar extremidade ou borda; aqui indica o limite da cortina onde eram feitas as laçadas.
- source_word: מַחְבֶּרֶת
  choice: conjunto
  rationale: Refere-se à unidade formada por várias cortinas unidas. “Conjunto” comunica com naturalidade o resultado dessa união, sem excluir o sentido mais literal de “parte unida”.
- source_word: מַקְבִּילֹת
  choice: ficavam alinhadas
  rationale: O particípio indica que as laçadas se correspondiam ou ficavam frente a frente, prontas para a união. “Ficavam alinhadas” expressa claramente essa disposição física.
- source_word: אַחַת אֶל אֶחָת
  choice: umas com as outras
  rationale: A expressão idiomática indica correspondência recíproca entre as laçadas.
- source_word: עָשָׂה
  choice: fez
  rationale: Equivalente direto e natural do verbo comum עשה neste relato de construção.
theological_decisions: []
