id: EXO.36.1
reference: Exodus 36:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: pt
  text: Bezalel, Aoliabe e todo homem habilidoso[a], em quem Yahweh pôs sabedoria e entendimento[b] para saber executar todo o trabalho destinado ao serviço do santuário[c], farão tudo conforme Yahweh ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo homem sábio de coração”; no contexto, a expressão pode designar genericamente todo trabalhador habilidoso.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aos quais Yahweh deu sabedoria e entendimento”. O hebraico diz literalmente “neles”, no plural, referindo-se em conjunto a Bezalel, Aoliabe e todo homem habilidoso.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “todo o trabalho do serviço do santuário”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: farão
  rationale: 'O perfeito com waw, neste contexto instrutivo, expressa o que os artesãos deverão fazer. O plural é exigido naturalmente em português pelo sujeito composto: Bezalel, Ooliabe e todo homem habilidoso.'
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: Bezalel, Ooliabe
  rationale: Transliteração clara dos nomes hebraicos, com a terminação de Ooliabe adaptada ao uso português.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: e todo homem habilidoso
  rationale: No contexto da construção do santuário, o idiomatismo hebraico literalmente relacionado a um coração sábio designa capacidade e perícia artesanal. Mantém-se 'homem' para representar אִישׁ sem apagar o caráter possivelmente genérico da expressão.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: em quem Yahweh pôs sabedoria e entendimento
  rationale: '''Pôs'' representa o uso de נתן com a preposição ''em''. O pronome português ''quem'' permite referência coletiva natural, enquanto a nota registra o plural explícito do hebraico.'
- source_word: חָכְמָה וּתְבוּנָה
  choice: sabedoria e entendimento
  rationale: Preserva os dois termos hebraicos e sua associação, sem reduzir 'sabedoria' apenas à habilidade técnica, embora essa dimensão esteja presente no contexto.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: para saber executar
  rationale: Expressa conhecimento prático e capacidade de realizar as tarefas; 'executar' evita a repetição pouco elegante de 'fazer' e se ajusta ao trabalho artesanal.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: todo o trabalho destinado ao serviço do santuário
  rationale: Distingue o trabalho ou ofício (מְלָאכָה) do serviço (עֲבֹדָה) e entende הַקֹּדֶשׁ, neste contexto, como o lugar santo ou santuário.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: tudo conforme Yahweh ordenou
  rationale: A preposição לְ indica conformidade com tudo o que foi ordenado; a formulação é natural e concisa em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino. 'Yahweh' o representa diretamente e evita substituí-lo silenciosamente por um título.
- issue: Linguagem de gênero em אִישׁ חֲכַם לֵב
  choice: todo homem habilidoso
  alternative: toda pessoa habilidosa; todo artesão habilidoso
  rationale: A tradução conserva אִישׁ como 'homem', ao mesmo tempo que a nota reconhece que a expressão pode funcionar genericamente para os trabalhadores capacitados.
- issue: Sentido de חָכְמָה no contexto artesanal
  choice: sabedoria
  alternative: habilidade; perícia
  rationale: Embora a sabedoria concedida se manifeste como perícia artesanal, o termo hebraico é mais amplo. Mantê-lo evita reduzir indevidamente seu alcance.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Evitou-se linguagem excessivamente técnica, mas foram preservados os termos teologicamente e lexicalmente relevantes, bem como as ambiguidades do hebraico por meio de notas.
