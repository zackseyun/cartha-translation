base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/031.yaml
  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: pt
  text: Fez cinco travessas de madeira de acácia para as armações de um dos lados do tabernáculo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”, em vez de “armações”, para as peças estruturais verticais do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à sequência narrativa. Em português, o sujeito pode ficar implícito e a conjunção pode ser omitida com naturalidade.
- source_word: בְּרִיחֵי
  choice: travessas
  rationale: No contexto da construção do tabernáculo, designa peças horizontais que ligavam e sustentavam as armações. “Travessas” expressa essa função com mais clareza do que “ferrolhos”.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A cadeia construta indica madeira proveniente de acácias; esta formulação é clara e corrente em português.
- source_word: חֲמִשָּׁה
  choice: cinco
  rationale: Número cardinal que quantifica as travessas.
- source_word: לְקַרְשֵׁי
  choice: para as armações
  rationale: קֶרֶשׁ designa as peças estruturais verticais do tabernáculo. “Armações” comunica sua função arquitetônica, embora “tábuas” também seja possível.
- source_word: צֶלַע
  choice: lado
  rationale: Neste contexto arquitetônico, significa um dos lados da estrutura, e não uma costela literal.
- source_word: הַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: “Tabernáculo” é o termo estabelecido e contextualmente preciso para a estrutura do santuário em Êxodo.
- source_word: הָאֶחָת
  choice: de um dos lados
  rationale: O feminino singular concorda com צֶלַע e distingue este lado do outro, sem necessariamente indicar ordem. “Um dos lados” torna essa relação natural em português.
theological_decisions: []
