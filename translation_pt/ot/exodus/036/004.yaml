  yaml_path: translation/ot/exodus/036/004.yaml
  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: pt
  text: Então todos os homens habilidosos que faziam todo o trabalho do santuário vieram, cada um deixando o trabalho que estava fazendo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: O wayyiqtol de בוא dá sequência à narrativa; “vieram” é a forma simples e natural em português.
- source_word: כָּל הַחֲכָמִים
  choice: todos os homens habilidosos
  rationale: Neste contexto, חכמים designa os homens dotados de habilidade para construir o tabernáculo, não apenas pessoas intelectualmente sábias.
- source_word: הָעֹשִׂים
  choice: que faziam
  rationale: O particípio indica uma atividade em andamento e retoma naturalmente o trabalho contínuo desses artesãos.
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: todo o trabalho do santuário
  rationale: מְלָאכָה denota trabalho ou tarefa especializada, e הַקֹּדֶשׁ, no contexto do tabernáculo, refere-se ao santuário.
- source_word: אִישׁ אִישׁ
  choice: cada um
  rationale: 'A repetição tem sentido distributivo: cada indivíduo entre os homens habilidosos.'
- source_word: מִמְּלַאכְתּוֹ
  choice: deixando o trabalho
  rationale: A preposição מן indica que cada um se afastou da tarefa em que trabalhava; “deixando” torna claro esse movimento em português natural.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: que estava fazendo
  rationale: 'Embora o pronome hebraico seja plural, a construção distributiva אִישׁ אִישׁ pede referência individual em português: cada um deixou aquilo que estava fazendo.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção distributiva hebraica foi expressa diretamente no texto, sem necessidade de nota; “homens habilidosos” conserva tanto a referência masculina do contexto quanto o sentido vocacional de חכמים.
