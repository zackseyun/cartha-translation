  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: pt
  text: Eles receberam de Moisés[a] toda a contribuição que os israelitas haviam trazido para o trabalho do serviço do santuário, a fim de executá-lo. E os israelitas continuavam trazendo a Moisés ofertas voluntárias, manhã após manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tomaram de diante de Moisés” ou “da presença de Moisés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ מִלִּפְנֵי מֹשֶׁה
  choice: receberam de Moisés
  rationale: O sentido básico é “tomaram de diante da presença de Moisés”, indicando que os responsáveis pela obra retiraram de sua guarda os materiais entregues. “Receberam de Moisés” comunica essa transferência com naturalidade em português; a imagem mais literal é preservada em nota.
- source_word: הַתְּרוּמָה
  choice: a contribuição
  rationale: No contexto, trata-se dos materiais doados e separados para a construção do santuário, não necessariamente de uma oferta sacrificial.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: É a designação coletiva idiomática correspondente a “filhos de Israel” e inclui o povo como um todo, conforme o contexto.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: para o trabalho do serviço do santuário
  rationale: Mantém os dois substantivos hebraicos, “trabalho” e “serviço”, e entende הַקֹּדֶשׁ como o lugar santo, isto é, o santuário em construção.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: a fim de executá-lo
  rationale: O sufixo retoma naturalmente o trabalho como tarefa a ser realizada. “Executá-lo” expressa o amplo verbo עשה sem sugerir apenas fabricação material.
- source_word: וְהֵם הֵבִיאוּ אֵלָיו עוֹד
  choice: E os israelitas continuavam trazendo a Moisés
  rationale: A construção com pronome independente e עוֹד indica continuidade. Os referentes mais naturais são os israelitas, e o antecedente de “a ele” é Moisés; explicitar ambos evita ambiguidade pronominal em português.
- source_word: נְדָבָה
  choice: ofertas voluntárias
  rationale: O substantivo designa dádivas apresentadas espontaneamente. O plural em português combina naturalmente com a ação repetida e com a multiplicidade das contribuições.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: A repetição hebraica tem sentido distributivo e recorrente; esta expressão preserva sua força iterativa em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação conserva a sequência narrativa e a repetição enfática do ato contínuo de contribuir, sem introduzir contraste adversativo que não está explícito na conjunção hebraica.
