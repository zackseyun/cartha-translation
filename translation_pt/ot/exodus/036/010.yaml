  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: pt
  text: Uniu cinco cortinas umas às outras, e uniu outras cinco cortinas umas às outras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e cinco cortinas” na segunda oração; “outras” foi acrescentado para esclarecer que se trata de um segundo conjunto de cinco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: uniu
  rationale: O verbo חבר significa unir ou ligar. “Uniu” é natural em português atual e não especifica além do texto o modo de conexão.
- source_word: יְרִיעֹת
  choice: cortinas
  rationale: No contexto da construção do tabernáculo, o termo designa grandes peças de tecido; “cortinas” é claro, tradicional e contextualmente adequado.
- source_word: חֲמֵשׁ
  choice: cinco
  rationale: Correspondência direta do numeral cardinal.
- source_word: אַחַת אֶל אֶחָת
  choice: umas às outras
  rationale: A expressão indica que as cortinas de cada conjunto foram unidas entre si; esta formulação é idiomática e preserva o sentido recíproco.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: as outras cinco cortinas
  rationale: O hebraico diz literalmente “e cinco cortinas”, mas o paralelismo mostra que se trata do segundo conjunto de cinco. “As outras” torna essa relação clara em português sem acrescentar uma nova distinção material.
