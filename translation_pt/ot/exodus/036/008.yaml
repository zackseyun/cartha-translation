base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: pt
  text: Todos os homens habilidosos[a] entre os que executavam o trabalho fizeram o tabernáculo com dez cortinas de linho fino retorcido e fios azuis, púrpuras e escarlates. Ele as fez[b] com querubins, obra de artista habilidoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sábios de coração”, expressão que indica artesãos habilidosos.
    reason: lexical_alternative
  - marker: b
    text: O hebraico termina com o singular “ele as fez”, embora o versículo comece com sujeito e verbo no plural; algumas traduções uniformizam a frase como “eles as fizeram”.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: homens habilidosos
  rationale: A expressão significa literalmente “sábio de coração”, idioma hebraico que, neste contexto, designa quem possui habilidade artesanal. O plural natural em português acompanha o verbo plural inicial e mantém a forma masculina genérica do texto.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: entre os que executavam o trabalho
  rationale: A preposição com o particípio indica que esses artesãos pertenciam ao grupo ocupado na execução da obra.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo consagrado e preciso para a estrutura sagrada descrita em Êxodo; “morada” seria possível etimologicamente, mas menos específico.
- source_word: יְרִיעֹת
  choice: cortinas
  rationale: No contexto do tabernáculo, refere-se às grandes peças de tecido que compunham sua cobertura.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto a qualidade do linho quanto o detalhe técnico dos fios retorcidos.
- source_word: תְכֵלֶת
  choice: fios azuis
  rationale: O termo designa material tingido de azul, provavelmente fio; a explicitação de “fios” torna claro o sentido têxtil em português.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Equivalente tradicional para o material de prestigiosa coloração púrpura.
- source_word: תוֹלַעַת שָׁנִי
  choice: escarlates
  rationale: Designa material tingido de escarlate. O adjetivo concorda com “fios”, explicitado anteriormente.
- source_word: כְּרֻבִים
  choice: querubins
  rationale: Forma bíblica tradicional em português, adequada ao registro cultual da passagem.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: em trabalho de artesão habilidoso
  rationale: Expressa uma obra têxtil artisticamente planejada e executada, sem recorrer a linguagem arcaica nem restringir indevidamente a técnica a bordado.
- source_word: עָשָׂה אֹתָם
  choice: Ele as fez
  rationale: Mantém o verbo singular que encerra o texto hebraico, apesar do sujeito e do verbo plurais no início do versículo.
theological_decisions:
- issue: Representação do masculino genérico em חֲכַם לֵב
  choice: homens habilidosos
  alternative: pessoas habilidosas; artesãos habilidosos
  rationale: A formulação conserva o gênero gramatical masculino do hebraico e comunica que se trata de trabalhadores dotados de habilidade artesanal, sem afirmar mais do que o texto.
- issue: Alternância entre plural e singular nos verbos do versículo
  choice: fizeram ... Ele as fez
  alternative: fizeram ... eles as fizeram
  rationale: O texto massorético começa com verbo plural e termina com verbo singular. A tradução preserva essa tensão textual em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com terminologia bíblica consolidada. A redação conserva a alternância incomum entre plural e singular no hebraico e posiciona cada marcador junto ao elemento que sua nota explica.
