  naturalness: A redação é em geral clara e de registro bíblico moderno. A revisão torna a enumeração dos materiais mais fluida e substitui a construção pouco idiomática “em trabalho de artesão habilidoso” por uma formulação natural, sem eliminar a tensão plural-singular do hebraico.
  terminology: “Tabernáculo”, “cortinas”, “querubins” e “linho fino retorcido” são escolhas apropriadas. “Obra de artista habilidoso” comunica bem o trabalho artisticamente concebido expresso por מַעֲשֵׂה חֹשֵׁב, sem restringi-lo indevidamente a uma técnica específica.
