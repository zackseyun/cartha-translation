  text: And he joined five curtains by themselves[a], and six curtains by themselves.
translation:
  language: pt
  text: E ele uniu cinco cortinas em um conjunto[a] e as seis cortinas em outro conjunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “separadamente” ou “à parte”; isto é, as cinco cortinas formavam um conjunto, e as seis, outro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: uniu
  rationale: O verbo חָבַר significa unir ou conectar. “Uniu” é natural em português e não especifica indevidamente o método de ligação.
- source_word: הַיְרִיעֹת
  choice: cortinas
  rationale: No contexto da construção do tabernáculo, יְרִיעָה designa as grandes peças de tecido; “cortinas” é uma tradução consagrada, clara e adequada.
- source_word: לְבָד
  choice: em um conjunto ... em outro conjunto
  rationale: Neste contexto, לְבָד indica que as cinco cortinas e as seis cortinas foram unidas como dois grupos distintos. A formulação explicita naturalmente em português a relação já indicada pelo hebraico.
- source_word: חֲמֵשׁ / שֵׁשׁ
  choice: cinco / seis
  rationale: Tradução direta dos numerais cardinais.
- source_word: אֶת ... וְאֶת
  choice: e as
  rationale: Os marcadores de objeto direto estruturam dois objetos coordenados. Em português, a coordenação e a repetição do artigo expressam essa estrutura sem traduzir as partículas separadamente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Em um conjunto ... em outro conjunto” evita a possível impressão de que cada cortina ficou isolada e comunica que havia dois agrupamentos separados.
