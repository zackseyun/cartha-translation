revisions:
- from: 'Então Moisés deu a ordem, e fizeram circular por todo o acampamento este anúncio[a]: “Que nenhum homem nem mulher faça mais trabalho algum para a oferta destinada ao santuário[b].” Assim, o povo foi impedido de continuar trazendo.'
  to: 'Então Moisés deu a ordem, e fizeram circular pelo acampamento este anúncio[a]: “Que nem homem nem mulher faça mais trabalho algum para a oferta destinada ao santuário[b].” Assim, o povo foi impedido de trazer mais.'
  rationale: A revisão corrige a coordenação negativa para uma construção idiomática e inequívoca em português, mantendo a inclusão explícita de ambos os sexos e a força proibitiva do hebraico. “Pelo acampamento” preserva a difusão do anúncio sem intensificação desnecessária. As notas e seus respectivos marcadores permanecem adequadamente ancorados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:52:04Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a sequência narrativa, a ordem de Moisés, a circulação pública do anúncio, a inclusão explícita de homem e mulher, a interrupção do trabalho para a contribuição sagrada e a voz passiva final. “Fizeram circular ... este anúncio” representa bem o idiomatismo causativo hebraico. Contudo, “Que nenhum homem nem mulher” não é uma formulação portuguesa bem formada para a coordenação inclusiva pretendida; “nem homem nem mulher” preserva o sentido com clareza.
  naturalness: O registro é moderno, claro e apropriado. “Pelo acampamento” é mais direto que “por todo o acampamento”, sem acrescentar uma ênfase distributiva além do necessário. “Trazer mais” expressa naturalmente o sentido contextual de cessar contribuições adicionais.
  terminology: “Oferta destinada ao santuário” é uma opção aceitável para תרומת הקודש e a nota registra alternativas relevantes. “Santuário” é contextual e não introduz interpretação doutrinária. A nota sobre o anúncio preserva apropriadamente o valor literal do idiomatismo.
  issues:
  - severity: medium
    issue: 'Construção negativa coordenada pouco natural: “Que nenhum homem nem mulher faça”.'
    rationale: Em português contemporâneo, a coordenação correspondente a איש ואשה sob proibição é mais naturalmente expressa por “Que nem homem nem mulher faça” (ou “Que nenhum homem ou mulher faça”). A redação proposta mistura “nenhum” com “nem” de modo gramaticalmente marcado e potencialmente confuso.
