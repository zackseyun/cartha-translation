base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: pt
  text: 'Então Moisés deu a ordem, e fizeram circular pelo acampamento este anúncio[a]: “Que nem homem nem mulher faça mais trabalho algum para a oferta destinada ao santuário[b].” Assim, o povo foi impedido de trazer mais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fizeram uma voz passar”. Também pode ser traduzido por “fizeram um anúncio no acampamento”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “para a contribuição sagrada” ou “para a oferta do santuário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: deu a ordem
  rationale: O verbo צוה expressa uma determinação com autoridade. “Deu a ordem” preserva essa força e soa natural em português narrativo.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: fizeram circular ... este anúncio
  rationale: A expressão causativa significa literalmente fazer uma voz passar e, no contexto, descreve a circulação pública de um anúncio. A tradução preserva tanto a causatividade quanto o caráter público da mensagem.
- source_word: בַּמַּחֲנֶה
  choice: por todo o acampamento
  rationale: Embora a preposição possa ser vertida literalmente por “no”, a ideia de fazer circular o anúncio favorece “por todo”, indicando sua difusão entre os que estavam no acampamento.
- source_word: אִישׁ וְאִשָּׁה
  choice: nenhum homem nem mulher
  rationale: A formulação mantém a inclusão explícita de homens e mulheres e se ajusta naturalmente à proibição em português.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: faça mais trabalho algum
  rationale: מְלָאכָה abrange trabalho e atividade artesanal. “Trabalho algum” conserva a abrangência sem restringir o sentido à fabricação de um objeto específico.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: para a oferta destinada ao santuário
  rationale: תְּרוּמָה designa uma contribuição ou oferta separada para uso sagrado; הַקֹּדֶשׁ, no contexto, aponta para o santuário. “Destinada ao” explicita a relação sem identificar a oferta com o próprio santuário.
- source_word: וַיִּכָּלֵא
  choice: foi impedido
  rationale: O nifal de כלא apresenta o povo como contido ou impedido. A forma passiva preserva essa nuance sem sugerir que as pessoas não quisessem contribuir.
- source_word: מֵהָבִיא
  choice: de continuar trazendo
  rationale: A preposição מן com o infinitivo indica impedimento da ação; “continuar” torna explícito, pelo contexto, que se tratava de cessar contribuições adicionais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto no Brasil quanto em outros contextos lusófonos. A expressão “fizeram circular” preserva o elemento causativo do idioma hebraico sem produzir uma formulação artificial; “santuário” mantém a referência contextual sem eliminar as alternativas registradas em nota.
