  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: pt
  text: 'Fez as armações para o tabernáculo: vinte armações para o lado sul[a], em direção ao sul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinte tábuas para o lado sul”. O hebraico emprega duas expressões referentes ao sul (“sul, em direção ao sul”), para dar ênfase ou especificar a orientação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה narra uma ação passada. Em português, o pretérito perfeito mantém com naturalidade a sequência narrativa; o sujeito singular permanece implícito pelo contexto.
- source_word: הַקְּרָשִׁים
  choice: as armações
  rationale: קֶרֶשׁ designa aqui os elementos estruturais verticais do tabernáculo. “Armações” comunica sua função arquitetônica em linguagem atual, sem reduzi-los necessariamente a simples tábuas.
- source_word: לַמִּשְׁכָּן
  choice: para o tabernáculo
  rationale: מִשְׁכָּן é o termo usual para a estrutura sagrada em Êxodo; “tabernáculo” é a designação portuguesa estabelecida e adequada neste contexto.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: vinte armações
  rationale: A repetição do substantivo preserva o estilo de inventário e construção do hebraico.
- source_word: לִפְאַת
  choice: para o lado
  rationale: פֵּאָה indica aqui um lado ou extremidade da estrutura; “lado” é arquitetonicamente claro e natural.
- source_word: נֶגֶב
  choice: sul
  rationale: Neste contexto, נֶגֶב tem sentido direcional, não o de nome próprio da região do Neguebe.
- source_word: תֵּימָנָה
  choice: voltado para o sul
  rationale: A expressão conserva a segunda indicação meridional do hebraico de modo inteligível em português, apresentando-a como especificação da orientação do lado.
