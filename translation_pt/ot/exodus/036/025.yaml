  text: וּ/לְ/צֶ֧לַע הַ/מִּשְׁכָּ֛ן הַ/שֵּׁנִ֖ית לִ/פְאַ֣ת צָפ֑וֹן עָשָׂ֖ה עֶשְׂרִ֥ים קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: pt
  text: Para o segundo lado do tabernáculo, no lado norte, fez vinte tábuas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinte armações”. O termo hebraico pode designar painéis ou armações estruturais, e a forma exata dessas peças do tabernáculo é discutida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Para o ... lado
  rationale: צֶלַע designa aqui um lado da estrutura, não uma costela em sentido anatômico. A conjunção e a preposição prefixadas são expressas naturalmente por “Para” neste relato de construção.
- source_word: הַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: מִשְׁכָּן é o termo usual para o santuário de Israel no deserto; “tabernáculo” é tradicional, preciso e amplamente reconhecível em português.
- source_word: הַשֵּׁנִית
  choice: segundo
  rationale: O adjetivo identifica o segundo lado na sequência da construção e é mais preciso do que “outro”.
- source_word: לִפְאַת צָפוֹן
  choice: o lado norte
  rationale: A expressão indica a orientação setentrional. A aposição “o lado norte” é clara e natural em português.
- source_word: עָשָׂה
  choice: fez
  rationale: O verbo עשה tem sentido amplo de fazer; “fez” preserva sua simplicidade e se ajusta ao relato de execução.
- source_word: עֶשְׂרִים
  choice: vinte
  rationale: Tradução direta do numeral cardinal.
- source_word: קְרָשִׁים
  choice: tábuas
  rationale: O termo refere-se aos elementos estruturais de madeira do tabernáculo. “Tábuas” é convencional e compreensível, enquanto a possível forma de armações é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem sacrificar a naturalidade. O marcador da nota foi colocado após “tábuas”, o termo ao qual a alternativa lexical se refere.
