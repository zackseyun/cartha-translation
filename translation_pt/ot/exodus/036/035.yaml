  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב עָשָׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: pt
  text: Fez a cortina[a] de fios azuis, roxos e escarlates[b] e de linho fino retorcido; fez nela querubins, trabalho de um artesão habilidoso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “véu”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida como “escarlates” designa literalmente material ou fio tingido de escarlate; “carmesins” é outra tradução possível.
    reason: lexical_alternative
  - marker: c
    text: Ou “trabalho de um artífice habilidoso” ou “trabalho artístico”. O hebraico se refere a uma execução artística com desenhos elaborados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: a cortina
  rationale: Designa a divisória interior do tabernáculo. “Cortina” é claro e natural em português moderno; “véu” é a alternativa tradicional preservada em nota.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: fios azuis, roxos e escarlates
  rationale: Os termos designam materiais tingidos usados na confecção têxtil. “Fios” explicita naturalmente o sentido material da série sem repetições pesadas.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto o material, linho fino, quanto a característica de sua preparação, retorcido.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: trabalho de um artesão habilidoso
  rationale: A expressão indica execução artística e elaborada, provavelmente com desenhos tecidos; esta formulação mantém o agente artesanal sem restringir indevidamente a técnica a bordado.
- source_word: כְּרֻבִים
  choice: querubins
  rationale: É o plural bíblico consagrado em português para os seres celestiais representados na cortina.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: fez nela querubins
  rationale: Comunica de modo natural que as figuras dos querubins foram incorporadas ao desenho da cortina.
