  text: וּֽ/לְ/יַרְכְּתֵ֥י הַ/מִּשְׁכָּ֖ן יָ֑מָּ/ה עָשָׂ֖ה שִׁשָּׁ֥ה קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/027.yaml
  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: pt
  text: E para a parte de trás do tabernáculo, no lado oeste, fez seis armações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tábuas». O termo hebraico pode designar tábuas ou armações estruturais; aqui se adotou «armações» por talvez corresponder melhor à construção do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: E para a parte de trás de
  rationale: A conjunção e a preposição introduzem outro detalhe da construção. O plural construto יַרְכְּתֵי designa as partes mais remotas ou posteriores; neste contexto arquitetônico, a expressão portuguesa natural «a parte de trás» comunica o referente sem sugerir indevidamente vários lados.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן é o termo habitual para a estrutura do santuário em Êxodo; «tabernáculo» é consagrado, preciso e amplamente compreensível em português.
- source_word: יָמָּה
  choice: no lado oeste
  rationale: O termo significa literalmente «em direção ao mar», mas funciona idiomaticamente como indicação do oeste. «No lado oeste» é natural no contexto de uma localização arquitetônica e preserva claramente a orientação.
- source_word: עָשָׂה
  choice: fez
  rationale: Tradução direta do verbo comum עשה, adequada ao estilo repetitivo do relato da construção.
- source_word: שִׁשָּׁה
  choice: seis
  rationale: Correspondência direta do numeral cardinal.
- source_word: קְרָשִׁים
  choice: armações
  rationale: O termo designa elementos estruturais verticais do tabernáculo. «Armações» representa sua possível função estrutural melhor que «tábuas», embora a forma exata permaneça incerta; por isso, a alternativa tradicional é registrada em nota.
