translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o movimento do hebraico sem produzir uma formulação artificial; «no lado oeste» expressa de modo idiomático a orientação arquitetônica.
