  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: pt
  text: Revestiu de ouro as armações[a], fez de ouro as suas argolas, para servirem de suportes para as travessas[b], e revestiu de ouro as travessas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábuas”. O termo hebraico se refere aos elementos estruturais de madeira do tabernáculo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “casas para as travessas”, expressão que indica suportes ou encaixes destinados a recebê-las.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: as armações
  rationale: No contexto do tabernáculo, o termo designa os elementos estruturais verticais de madeira. “Armações” comunica sua função arquitetônica sem limitar indevidamente a forma.
- source_word: צִפָּה / וַיְצַף
  choice: revestiu
  rationale: O verbo indica cobrir um objeto com uma camada de outro material; “revestiu de ouro” é natural e preciso em português.
- source_word: זָהָב
  choice: ouro
  rationale: Termo direto para o material; as três ocorrências foram preservadas para manter a repetição enfática do hebraico.
- source_word: טַבְּעֹתָם
  choice: as argolas delas
  rationale: טַבַּעַת significa “argola” ou “anel”; o sufixo plural refere-se às armações. “Argolas” é concreto e natural para peças de construção.
- source_word: עָשָׂה
  choice: fez
  rationale: Equivalente corrente e preciso do verbo comum “fazer” neste contexto artesanal.
- source_word: בָּתִּים
  choice: suportes
  rationale: Literalmente “casas”, mas aqui designa os lugares ou peças que recebem as travessas. “Suportes” expressa a função sem reproduzir um idiomatismo obscuro.
- source_word: לַבְּרִיחִם
  choice: para as travessas
  rationale: בְּרִיחִים são barras transversais que unem os elementos estruturais; “travessas” é o termo arquitetônico claro em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência coordenada e a repetição de “ouro” acompanham de perto o hebraico, enquanto “armações”, “suportes” e “travessas” comunicam naturalmente a função das peças.
