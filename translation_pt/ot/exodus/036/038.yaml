  yaml_path: translation/ot/exodus/036/038.yaml
  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
translation:
  language: pt
  text: e suas cinco colunas com seus ganchos. Revestiu de ouro a parte superior delas e suas faixas[a], e suas cinco bases[b] eram de bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aros” ou “elementos de ligação”. A forma exata dessas peças não é conhecida.
    reason: lexical_alternative
  - marker: b
    text: Ou “encaixes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: suas cinco colunas
  rationale: עַמּוּד designa uma coluna ou suporte vertical. “Colunas” é natural no contexto da construção do santuário e o pronome retoma a cortina da entrada mencionada no contexto.
- source_word: וָוֵיהֶם
  choice: seus ganchos
  rationale: וָו, nas descrições do tabernáculo, refere-se aos ganchos presos às colunas para sustentar a cortina.
- source_word: וְצִפָּה
  choice: revestiu
  rationale: O verbo צפה descreve a aplicação de uma camada de metal sobre uma peça; “revestiu de ouro” expressa isso com clareza em português atual.
- source_word: רָאשֵׁיהֶם
  choice: a parte superior delas
  rationale: Literalmente “as cabeças delas”; no contexto arquitetônico, indica a parte de cima das colunas sem pressupor o elemento técnico específico sugerido por “capitéis”.
- source_word: חֲשֻׁקֵיהֶם
  choice: suas faixas
  rationale: O termo designa elementos que circundavam ou ligavam as colunas, mas sua forma exata é incerta. “Faixas” preserva a ideia básica sem especificação indevida.
- source_word: אַדְנֵיהֶם
  choice: suas cinco bases
  rationale: אֶדֶן é a peça inferior que sustenta ou recebe uma coluna. “Bases” é claro e acessível; “encaixes” é uma alternativa possível.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת é convencionalmente traduzido por “bronze” no contexto dos metais usados no tabernáculo, embora possa designar cobre ou uma liga de cobre.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia consistente para a construção do tabernáculo. A redação mantém a coordenação do hebraico, mas usa “a parte superior delas” para evitar o literalismo pouco natural de “suas cabeças” e a precisão excessiva de “capitéis”.
