  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: pt
  text: E fez as tábuas para o tabernáculo, de madeira de acácia, em posição vertical.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: E fez
  rationale: O wayyiqtol de עשה dá sequência à narrativa; o pretérito perfeito com “E” preserva essa progressão de modo natural em português.
- source_word: הַקְּרָשִׁים
  choice: as tábuas
  rationale: קֶרֶשׁ designa aqui os elementos estruturais de madeira do tabernáculo. “Tábuas” é claro, tradicional e acessível, sem impor a ideia mais específica de armações.
- source_word: לַמִּשְׁכָּן
  choice: para o tabernáculo
  rationale: מִשְׁכָּן é a habitação sagrada descrita em Êxodo; “tabernáculo” é o termo português consolidado e contextualmente preciso.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A expressão construta refere-se à matéria de que eram feitas as tábuas. “Madeira de acácia” é a formulação idiomática e compreensível em português moderno.
- source_word: עֹמְדִים
  choice: colocadas em pé
  rationale: O particípio indica a orientação vertical das tábuas. “Colocadas em pé” comunica naturalmente a função arquitetônica, sem sugerir ação autônoma.
