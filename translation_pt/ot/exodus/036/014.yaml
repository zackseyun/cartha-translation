  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: pt
  text: Fez cortinas de pelo de cabra[a] para servirem de tenda sobre o tabernáculo; fez onze cortinas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «de cabras», deixando o material implícito; o contexto dos tecidos do tabernáculo favorece «de pelo de cabra».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: fez
  rationale: O verbo עשה significa normalmente «fazer». A repetição foi mantida para refletir a ênfase e a estrutura do hebraico.
- source_word: יְרִיעֹת
  choice: cortinas
  rationale: No contexto do tabernáculo, designa grandes peças de tecido usadas como cobertura; «cortinas» é claro, corrente e tradicional sem ser obscuro.
- source_word: עִזִּים
  choice: de pelos de cabra
  rationale: Embora o hebraico diga literalmente «de cabras», o contexto de tecidos indica material tecido com pelos de cabra, não peles.
- source_word: לְאֹהֶל
  choice: para servirem de tenda
  rationale: A preposição לְ indica finalidade ou função. Esta formulação deixa claro que as cortinas formavam a cobertura em forma de tenda, sem sugerir necessariamente uma estrutura distinta.
- source_word: עַל הַמִּשְׁכָּן
  choice: sobre o tabernáculo
  rationale: עַל indica posição acima ou por cima, e מִשְׁכָּן é o termo técnico para a estrutura sagrada, adequadamente traduzido por «tabernáculo».
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: onze
  rationale: Tradução direta do numeral hebraico.
- source_word: אֹתָם
  choice: incorporado em «fez onze cortinas»
  rationale: O pronome retoma as cortinas; em português, seu sentido já está expresso naturalmente pela repetição do substantivo.
theological_decisions: []
