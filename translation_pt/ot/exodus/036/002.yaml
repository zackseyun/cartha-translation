base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: pt
  text: Então Moisés chamou Bezalel, Aoliabe e todos os homens de coração sábio[a], em cujo coração Yahweh havia posto sabedoria, todos aqueles cujo coração os impelia[b] a se aproximarem da obra para realizá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sábios de coração”, expressão que aqui inclui sabedoria e habilidade para o trabalho artesanal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os movia” ou “os elevava”. O idioma hebraico descreve disposição ou impulso interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מֹשֶׁה אֶל
  choice: Então Moisés chamou
  rationale: קרא com אֶל indica chamar ou convocar pessoas. “Chamou” é natural e mantém a ligação narrativa do waw consecutivo com “Então”.
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: Bezalel, Aoliabe
  rationale: Os nomes próprios são transliterados em formas reconhecíveis em português; “Aoliabe” é a forma portuguesa consolidada de אָהֳלִיאָב.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: todos os homens de coração sábio
  rationale: Preserva a imagem hebraica de sabedoria no coração, que neste contexto inclui capacidade artesanal, sem reduzi-la apenas a habilidade técnica.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: em cujo coração Yahweh havia posto sabedoria
  rationale: Mantém tanto a atribuição divina da sabedoria quanto a linguagem hebraica do coração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: todos aqueles cujo coração os impelia
  rationale: Expressa o impulso interior e voluntário do idioma hebraico, preservando o coração como sede da disposição.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: a se aproximarem da obra
  rationale: Conserva a imagem de קרב, “aproximar-se”, ao mesmo tempo que “obra” abrange o projeto de construção do santuário.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: para realizá-la
  rationale: Retoma naturalmente “obra” no feminino e comunica o sentido de executar o trabalho.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico traz o nome pessoal, não o título אֲדֹנָי. “Yahweh” preserva essa distinção e segue uma transliteração amplamente reconhecida.
- issue: Natureza da sabedoria dada por Deus
  choice: “sabedoria” com a imagem de “coração sábio” preservada
  alternative: “habilidade” ou “artesãos habilidosos”
  rationale: No contexto, a sabedoria inclui perícia artesanal, mas o texto mantém uma formulação mais ampla e atribui a capacitação a Yahweh; a tradução não restringe indevidamente o conceito.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Preserva-se a imagem hebraica do coração, enquanto a concordância plural em “os impelia” torna clara a referência coletiva. Os marcadores aparecem junto às expressões explicadas.
