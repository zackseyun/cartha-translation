  terminology: “Yahweh” corresponde diretamente a יהוה e é usado de forma consistente. “Homens de coração sábio” preserva o idiomatismo, com nota que esclarece sua dimensão de perícia artesanal sem reduzir o termo a ela. “Obra” e “realizá-la” correspondem bem a המלאכה e לעשות אתה.
