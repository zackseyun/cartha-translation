  source_fidelity: 'A tradução preserva todos os elementos centrais do hebraico: Moisés chama Bezalel, Aoliabe e cada homem sábio de coração; Yahweh é quem pôs sabedoria em seu coração; e são incluídos todos os que foram interiormente movidos a aproximar-se da obra para executá-la. A repetição de “todos” reflete adequadamente a retomada por כֹּל no hebraico.'
