base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: pt
  text: E fez para a entrada da tenda uma cortina[a] de fios azuis, púrpura e escarlate e de linho fino retorcido, trabalho de bordador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cortina de entrada”. O termo hebraico designa uma peça suspensa que servia de fechamento ou resguardo numa entrada, distinta do “véu” interior (פָּרֹכֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: E fez
  rationale: O wayyiqtol dá continuidade à narrativa. A formulação concisa preserva essa progressão e o sujeito masculino implícito, retomado do contexto.
- source_word: מָסָךְ
  choice: cortina
  rationale: O termo designa uma peça suspensa que fecha ou resguarda uma entrada. “Cortina” é natural em português e, com a nota, mantém sua distinção em relação ao véu interior (פָּרֹכֶת).
- source_word: לְפֶתַח הָאֹהֶל
  choice: para a entrada da tenda
  rationale: Traduz diretamente a finalidade e a localização da peça sem ampliar אֹהֶל para “tabernáculo”.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: fios azuis, púrpura e escarlate
  rationale: Conserva as três cores tradicionais dos materiais têxteis; “fios” explicita naturalmente o sentido material sugerido pelo contexto.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Preserva tanto a qualidade do linho quanto seu modo de preparação, indicado por מָשְׁזָר.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: trabalho de bordador
  rationale: Reproduz a construção nominal hebraica e identifica a técnica artesanal especializada sem confundi-la com simples tecelagem.
