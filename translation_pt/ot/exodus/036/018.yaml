  yaml_path: translation/ot/exodus/036/018.yaml
  text: He made fifty bronze clasps to join the tent[a], so that it would be one.
translation:
  language: pt
  text: Fez cinquenta colchetes de bronze para unir a tenda[a], de modo que ela formasse uma só unidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tabernáculo”, pois aqui a “tenda” se refere à estrutura do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa e é expresso naturalmente em português pelo pretérito perfeito; o sujeito permanece claro pelo contexto.
- source_word: קַרְסֵי
  choice: colchetes
  rationale: Designa peças de conexão usadas para prender entre si as partes da cobertura. “Colchetes” é uma designação concreta e corrente nesse contexto de construção.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos materiais do santuário, נְחֹשֶׁת é tradicional e plausivelmente entendido como bronze, metal trabalhado empregado na estrutura.
- source_word: חֲמִשִּׁים
  choice: cinquenta
  rationale: Número cardinal que quantifica os colchetes.
- source_word: לְחַבֵּר
  choice: para unir
  rationale: O infinitivo com לְ expressa a finalidade dos colchetes; “unir” é natural e preserva a ideia concreta de juntar as partes.
- source_word: אֶת הָאֹהֶל
  choice: a tenda
  rationale: אֹהֶל significa literalmente “tenda”. Embora no contexto se refira à estrutura do tabernáculo, a tradução mantém o termo hebraico e registra a alternativa contextual em nota.
- source_word: לִהְיוֹת אֶחָד
  choice: de modo que ela formasse uma só unidade
  rationale: A construção expressa finalidade ou resultado. Esta formulação comunica naturalmente que a estrutura unida passaria a constituir um único conjunto, sem sugerir identidade numérica abstrata.
