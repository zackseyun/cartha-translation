  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: pt
  text: Eram emparelhadas embaixo e, juntas, eram completas até o topo, até a argola[a]. Assim fez com ambas[b], para os dois cantos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até uma argola”; também se entende “até a primeira argola”. O hebraico diz literalmente “até a argola uma”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para ambas” ou “com as duas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “para as duas peças dos cantos”. O hebraico diz literalmente “para os dois cantos” e provavelmente se refere às armações ou tábuas dos cantos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: emparelhadas
  rationale: Expressa a correspondência estrutural das duas peças como um par, em português atual e natural.
- source_word: מִלְּמַטָּה
  choice: na parte de baixo
  rationale: Indica claramente o ponto inferior em que as peças correspondiam entre si.
- source_word: יַחְדָּו
  choice: juntas
  rationale: Preserva o advérbio hebraico e sua ênfase na união das peças.
- source_word: תַמִּים
  choice: inteiras
  rationale: Mantém a ideia de peças completas ou plenamente unidas, sem confundi-la com o emparelhamento expresso anteriormente.
- source_word: אֶל רֹאשׁוֹ
  choice: até o alto
  rationale: Comunica a extensão vertical desde a parte de baixo até a extremidade superior; evita um possessivo de referente incerto em português.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: a única argola
  rationale: Representa naturalmente a expressão definida com o numeral 'uma', sem reinterpretá-la como 'a primeira argola'.
- source_word: כֵּן עָשָׂה
  choice: Assim fez
  rationale: Preserva a formulação resumitiva e o registro narrativo do hebraico.
- source_word: לִשְׁנֵיהֶם
  choice: com ambas
  rationale: Retoma de modo conciso as duas peças estruturais mencionadas.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: nos dois cantos
  rationale: Oferece uma construção idiomática em português e preserva a referência literal aos dois cantos; a possível referência às peças de canto fica registrada em nota.
