  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: pt
  text: Fez uma cobertura para a tenda de peles de carneiros tingidas de vermelho e, por cima, uma cobertura de couro fino[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תְּחָשִׁים é incerto. Entre as traduções propostas estão “peles de vacas-marinhas”, “peles de marsuínos”, “peles de dugongos” e, tradicionalmente, “peles de texugos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה narra uma ação passada em sequência. “Fez” é direto e natural em português; o sujeito continua implícito, como permite o idioma.
- source_word: מִכְסֶה לָאֹהֶל
  choice: para a tenda uma cobertura
  rationale: מִכְסֶה designa uma camada de cobertura, e אֹהֶל é o termo comum para “tenda”. A formulação preserva a relação expressa por ל sem substituir “tenda” por uma designação mais interpretativa.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: de peles de carneiros tingidas de vermelho
  rationale: עֹרֹת são peles, אֵלִים são carneiros, e מְאָדָּמִים descreve as peles como avermelhadas, provavelmente por tingimento. A tradução explicita isso de modo claro e idiomático.
- source_word: וּמִכְסֵה
  choice: e ... uma cobertura
  rationale: A conjunção introduz outra cobertura, enquanto a repetição de מִכְסֶה é mantida sem acrescentar “segunda”, que não aparece no hebraico.
- source_word: עֹרֹת תְּחָשִׁים
  choice: de couro fino[a]
  rationale: A identificação de תְּחָשִׁים é incerta. “Couro fino” evita escolher de maneira especulativa um animal específico e funciona naturalmente para o material da cobertura externa; a incerteza lexical é registrada em nota.
- source_word: מִלְמָעְלָה
  choice: por cima
  rationale: A expressão indica que essa cobertura ficava na parte superior. “Por cima” comunica de forma natural sua posição relativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a repetição de “cobertura” e usa “tenda” para o sentido direto de אֹהֶל. O marcador da nota foi colocado junto de “couro fino”, expressão correspondente ao termo hebraico incerto.
