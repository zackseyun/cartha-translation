  text: וְ/הַ/מְּלָאכָ֗ה הָיְתָ֥ה דַיָּ֛/ם לְ/כָל הַ/מְּלָאכָ֖ה לַ/עֲשׂ֣וֹת אֹתָ֑/הּ וְ/הוֹתֵֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/007.yaml
  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: pt
  text: E o material era suficiente para realizar todo o trabalho, e ainda sobrava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e havia mais do que o suficiente”. O verbo hebraico indica que havia um excedente além do necessário para o trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: E o material
  rationale: Embora מְלָאכָה normalmente signifique “trabalho”, neste primeiro uso o contexto aponta para aquilo que o povo havia trazido para a construção; “material” torna claro o referente em português.
- source_word: הָיְתָה דַיָּם
  choice: era suficiente
  rationale: דַּי expressa suficiência, e o sufixo pronominal remete ao material reunido. A formulação é natural e preserva o sentido da construção hebraica.
- source_word: לְכָל הַמְּלָאכָה
  choice: para realizar todo o trabalho
  rationale: Neste segundo uso, מְלָאכָה designa claramente a totalidade da obra ou tarefa; a combinação com לַעֲשׂוֹת é vertida de modo idiomático por “realizar todo o trabalho”.
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: realizar
  rationale: O infinitivo de עשה com o sufixo feminino refere-se à execução do trabalho mencionado. “Realizar” evita a repetição pouco natural de “fazer todo o trabalho para fazê-lo”.
- source_word: וְהוֹתֵר
  choice: e ainda sobrava
  rationale: O hifil de יתר indica excedente ou sobra. “Ainda sobrava” comunica de maneira clara que havia material além do necessário.
