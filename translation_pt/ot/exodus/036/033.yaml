  naturalness: «Fez a travessa central passar pelo meio das armações» é mais idiomático e torna clara a relação sintática entre a peça e seu percurso longitudinal.
  terminology: «Travessa central» e «armações» são escolhas adequadas e coerentes para os elementos estruturais do tabernáculo. A nota preserva uma alternativa legítima para o infinitivo לברח.
