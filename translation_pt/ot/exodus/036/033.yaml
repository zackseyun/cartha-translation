  yaml_path: translation/ot/exodus/036/033.yaml
  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: pt
  text: Fez a travessa central passar pelo meio das armações, de uma extremidade à outra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para se estender pelo meio das armações, de uma extremidade à outra».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa com o sentido simples de fazer; em português, o sujeito oculto e a ausência de «e» tornam a frase natural sem perder a sequência narrativa.
- source_word: הַבְּרִיחַ הַתִּיכֹן
  choice: a travessa central
  rationale: בְּרִיחַ designa aqui a peça horizontal que une as armações; «travessa» é corrente e tecnicamente adequada. הַתִּיכֹן indica sua posição no centro.
- source_word: לִבְרֹחַ
  choice: para atravessar
  rationale: Neste contexto arquitetônico, o infinitivo de ברח descreve a travessa passando ou estendendo-se pela estrutura, não uma fuga; «atravessar» expressa com clareza a função da peça.
- source_word: בְּתוֹךְ
  choice: o meio de
  rationale: A preposição indica o interior ou a parte central das armações; com «atravessar», «o meio de» é natural em português.
- source_word: הַקְּרָשִׁים
  choice: as armações
  rationale: קֶרֶשׁ refere-se aos elementos estruturais verticais do tabernáculo. «Armações» comunica melhor sua função que «tábuas», sem excluir sua natureza de peças de madeira.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: de uma extremidade à outra
  rationale: Reproduz naturalmente o idioma hebraico e deixa explícita a extensão completa da travessa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Travessa» e «armações» preservam o caráter construtivo da passagem; a nota mantém a alternativa semântica do verbo hebraico.
