  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: pt
  text: Duas espigas para cada tábua[a], correspondentes uma à outra[b]; assim ele fez todas as tábuas do tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mãos”, em tradução literal; o hebraico emprega a palavra comum para “mãos” como metáfora para as projeções de encaixe de cada tábua.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma diante da outra”, destacando o alinhamento correspondente das duas espigas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי
  choice: duas
  rationale: Número cardinal que indica quantas projeções havia em cada tábua.
- source_word: יָדֹת
  choice: espigas
  rationale: Literalmente, “mãos”; no contexto da carpintaria do tabernáculo, designa as projeções de encaixe das tábuas. “Espigas” é o termo técnico português adequado para peças salientes que entram em encaixes.
- source_word: קֶּרֶשׁ
  choice: tábua
  rationale: Designa cada elemento estrutural de madeira do tabernáculo; “tábua” é claro, tradicional e natural em português.
- source_word: מְשֻׁלָּבֹת
  choice: encaixadas
  rationale: O particípio descreve as espigas dispostas ou ajustadas em relação correspondente; “encaixadas” comunica naturalmente a função construtiva sem impor um mecanismo excessivamente específico.
- source_word: אַחַת אֶל אֶחָת
  choice: uma em correspondência com a outra
  rationale: Preserva a relação recíproca e o alinhamento correspondente das duas espigas, sem decidir de modo rígido entre “uma à outra” e “uma diante da outra”.
- source_word: כֵּן
  choice: assim
  rationale: Introduz a maneira pela qual todas as tábuas foram feitas.
- source_word: עָשָׂה
  choice: ele fez
  rationale: Tradução direta do verbo comum de fazer, mantendo o sujeito masculino implícito no contexto.
- source_word: מִּשְׁכָּן
  choice: tabernáculo
  rationale: Termo consagrado e amplamente compreendido para a estrutura sagrada móvel descrita em Êxodo.
