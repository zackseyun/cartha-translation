  text: וַ/יַּ֜עַשׂ לֻֽלָאֹ֣ת חֲמִשִּׁ֗ים עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/קִּיצֹנָ֖ה בַּ/מַּחְבָּ֑רֶת וַ/חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ עַל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: pt
  text: Fez cinquenta laçadas na borda da última cortina do primeiro conjunto[a] e fez cinquenta laçadas na borda da cortina do segundo conjunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na junção” ou “na primeira seção unida”; o termo hebraico se refere ao conjunto de cortinas unidas ou à sua junção.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: laçadas
  rationale: O substantivo designa laçadas de tecido usadas para unir as cortinas. “Laçadas” é claro e natural em português; o qualificativo “azuis” não aparece neste versículo e não foi acrescentado.
- source_word: שְׂפַת
  choice: borda
  rationale: Neste contexto de tecidos, o termo indica a extremidade ou margem da cortina; “borda” é a forma corrente em português.
- source_word: יְרִיעָה
  choice: cortina
  rationale: No contexto do tabernáculo, o termo se refere a uma grande peça de tecido; “cortina” mantém a terminologia tradicional e compreensível.
- source_word: הַקִּיצֹנָה
  choice: última
  rationale: O adjetivo indica a cortina situada na extremidade do conjunto. “Última” expressa com clareza sua posição final sem sugerir indevidamente que ficava no exterior de toda a estrutura.
- source_word: בַּמַּחְבָּרֶת
  choice: do primeiro conjunto
  rationale: מַחְבָּרֶת designa aqui uma seção ou conjunto de cortinas unidas. O hebraico não traz explicitamente “primeiro”, mas o contraste posterior com “segundo” o deixa implícito; a nota preserva as alternativas mais formais.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: do segundo conjunto
  rationale: A construção identifica a seção unida correspondente como a segunda. Em português, “do segundo conjunto” comunica de modo natural a relação entre a cortina e o grupo de cortinas unidas.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Fez ... fez
  rationale: A repetição de עשה foi mantida para refletir a estrutura enfática e paralela do hebraico.
