  text: 'and their forty silver bases: two bases under the one frame[a], and two bases under the one frame.'
translation:
  language: pt
  text: 'e as suas quarenta bases de prata: duas bases sob cada tábua e duas bases sob cada tábua.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: e ... quarenta
  rationale: A conjunção dá continuidade à lista de peças da construção, e o numeral é traduzido diretamente.
- source_word: אַדְנֵי/הֶם
  choice: suas ... bases
  rationale: No contexto do tabernáculo, אֲדָנִים designa os suportes inferiores nos quais se encaixavam as armações. “Bases” é claro e arquitetonicamente adequado.
- source_word: כָּסֶף
  choice: de prata
  rationale: O substantivo indica o material das bases; em português, “bases de prata” é a formulação natural.
- source_word: שְׁנֵי אֲדָנִים
  choice: duas bases
  rationale: A expressão repetida é vertida de modo uniforme, preservando o número e o termo arquitetônico.
- source_word: תַּחַת
  choice: debaixo de
  rationale: A preposição indica a posição das bases sob cada elemento vertical; “debaixo de” é corrente e claro.
- source_word: הַ/קֶּרֶשׁ
  choice: armação
  rationale: קֶרֶשׁ pode designar uma tábua ou prancha estrutural. “Armação” comunica sua função como elemento vertical da estrutura, sem excluir a alternativa lexical indicada em nota.
- source_word: הָ/אֶחָד
  choice: uma
  rationale: O hebraico repete literalmente “a uma” nas duas orações. Em português, “uma armação” preserva essa repetição incomum sem transformá-la silenciosamente em “a outra” ou em “cada”.
