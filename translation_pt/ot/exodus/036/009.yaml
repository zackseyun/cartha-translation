base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: pt
  text: O comprimento de cada cortina era de vinte e oito côvados[a], e a largura de cada cortina era de quatro côvados; todas as cortinas tinham uma só medida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um côvado correspondia a cerca de 45 centímetros.
    reason: measurement
lexical_decisions:
- source_word: אֹרֶךְ
  choice: comprimento
  rationale: Equivalente nominal natural para uma dimensão física.
- source_word: יְרִיעָה
  choice: cortina
  rationale: No contexto do tabernáculo, designa uma peça ou painel de tecido; “cortina” é claro e consagrado em português.
- source_word: הָאַחַת / הָאֶחָת
  choice: cada
  rationale: 'A expressão literalmente significa “a uma”, mas aqui tem sentido distributivo: as dimensões se aplicam individualmente a cada cortina.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: vinte e oito
  rationale: Forma numeral corrente em português.
- source_word: אַמָּה
  choice: côvados
  rationale: Preserva a antiga unidade hebraica em vez de impor uma conversão moderna aproximada.
- source_word: רֹחַב
  choice: largura
  rationale: Equivalente dimensional direto e natural de רֹחַב.
- source_word: אַרְבַּע
  choice: quatro
  rationale: Tradução direta do numeral.
- source_word: מִדָּה אַחַת
  choice: as mesmas medidas
  rationale: Embora literalmente seja “uma só medida”, o plural idiomático comunica que todas as cortinas tinham dimensões uniformes, tanto no comprimento como na largura.
- source_word: לְכָל הַיְרִיעֹת
  choice: todas as cortinas
  rationale: Expressa naturalmente o alcance coletivo da uniformidade indicada no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A elipse em “e a largura, de quatro côvados” evita repetição desnecessária sem perder o sentido. A unidade antiga foi mantida no texto e explicada de modo aproximado em nota.
