  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: pt
  text: Cada armação tinha dez côvados de comprimento e um côvado e meio de largura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tábua” ou “prancha”, em vez de “armação” (hebraico קֶרֶשׁ); o termo se refere às peças estruturais do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת אֹרֶךְ
  choice: dez côvados de comprimento
  rationale: Preserva a antiga unidade de medida e expressa naturalmente em português a dimensão indicada pelo substantivo אֹרֶךְ.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: armação
  rationale: No contexto do tabernáculo, קֶרֶשׁ designa uma peça estrutural vertical. “Armação” comunica sua função sem limitar indevidamente a forma a uma simples tábua.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: um côvado e meio
  rationale: Reproduz de modo idiomático a expressão hebraica que literalmente indica “um côvado e metade do côvado”.
- source_word: רֹחַב
  choice: largura
  rationale: Equivalente moderno e claro para a dimensão horizontal indicada pelo termo hebraico.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: cada armação
  rationale: O numeral “um” tem sentido distributivo neste contexto de medidas; “cada” evita a leitura sequencial de “a primeira”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A unidade antiga “côvado” foi preservada sem conversão. O marcador da nota foi colocado ao fim do versículo, abrangendo a ocorrência repetida de “armação”.
