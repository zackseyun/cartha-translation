base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: pt
  text: 'Fez também quarenta bases de prata para debaixo das vinte armações: duas bases debaixo de cada armação, para as suas duas espigas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי
  choice: bases
  rationale: No contexto da construção do tabernáculo, designa os suportes ou pedestais de prata colocados sob as armações; “bases” é claro e natural em português.
- source_word: הַקְּרָשִׁים
  choice: armações
  rationale: O termo designa os elementos verticais estruturais do tabernáculo. “Armações” comunica sua função melhor ao leitor comum do que o tradicional “tábuas”, sem impor precisão técnica ausente do texto.
- source_word: יְדֹתָיו
  choice: seus dois encaixes
  rationale: Literalmente “suas mãos”, mas aqui se refere às projeções ou espigas inferiores que se ajustavam às bases. “Encaixes” oferece uma descrição funcional inteligível, embora o elemento projetado também possa ser chamado de espiga.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: uma armação ... a outra armação
  rationale: A repetição hebraica distingue distributivamente as armações. Em português, “uma... a outra” expressa com naturalidade que cada armação recebia duas bases.
theological_decisions: []
