lexical_decisions:
- source_word: וְהָיוּ
  choice: Eram
  rationale: Emprega uma formulação portuguesa natural para היה neste contexto descritivo; a conjunção inicial fica absorvida na fluência do inventário.
- source_word: קְרָשִׁים
  choice: armações
  rationale: O termo designa as peças estruturais verticais do tabernáculo. “Armações” comunica sua função, enquanto a nota preserva as alternativas concretas “tábuas” e “pranchas”.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: bases
  rationale: No contexto da construção do tabernáculo, אֶדֶן é o suporte metálico inferior de cada armação; “bases” é claro e corrente em português.
- source_word: כֶּסֶף
  choice: prata
  rationale: Designação direta do material de que eram feitas as bases.
- source_word: שִׁשָּׁה עָשָׂר
  choice: dezesseis
  rationale: Forma cardinal padrão, com grafia de ampla legibilidade brasileira.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: duas bases debaixo de cada armação
  rationale: 'A repetição hebraica tem força distributiva no contexto: cada uma das oito armações possuía duas bases. A tradução expressa isso de modo natural e evita sugerir que apenas uma ou duas armações estejam em vista.'
- source_word: תַּחַת
  choice: debaixo de
  rationale: Preposição espacial natural e precisa para indicar a posição dos suportes.
