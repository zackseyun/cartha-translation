base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: pt
  text: Fez laçadas de fio azul na borda da primeira cortina, na extremidade, no ponto de união do primeiro conjunto[a]; fez o mesmo na borda da cortina mais externa, no ponto de união do segundo conjunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na junção”. O termo hebraico se refere ao lugar ou à disposição em que as cortinas eram unidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: laçadas
  rationale: Designa laços de tecido usados para unir as cortinas; “laçadas” é claro e natural no contexto de confecção.
- source_word: תְּכֵלֶת
  choice: fio azul
  rationale: No contexto do tabernáculo, refere-se ao material têxtil tingido de azul, não apenas à cor abstrata.
- source_word: שְׂפַת
  choice: borda
  rationale: Aqui indica a extremidade lateral da cortina; “borda” é a expressão idiomática adequada em português.
- source_word: הַיְרִיעָה
  choice: cortina
  rationale: Refere-se a cada painel têxtil da cobertura do tabernáculo; “cortina” é tradicional, claro e compreensível.
- source_word: הָאֶחָת
  choice: primeira
  rationale: Embora literalmente possa ser “uma”, funciona ordinalmente no contraste com o segundo conjunto mencionado depois.
- source_word: מִקָּצָה
  choice: na extremidade
  rationale: Localiza as laçadas no extremo da cortina em que ocorria a união.
- source_word: בַּמַּחְבָּרֶת
  choice: do primeiro conjunto unido
  rationale: O termo pode indicar a união ou o agrupamento das cortinas. A formulação expressa naturalmente o conjunto conectado; “primeiro” é explicitado pelo contraste contextual com o segundo.
- source_word: כֵּן עָשָׂה
  choice: fez o mesmo
  rationale: Reproduz de modo conciso e natural a ação correspondente realizada na outra cortina.
- source_word: הַקִּיצוֹנָה
  choice: mais externa
  rationale: Expressa a posição da cortina na extremidade do conjunto sem reduzir necessariamente o sentido a uma mera ordem numérica.
- source_word: הַשֵּׁנִית
  choice: segundo
  rationale: Identifica explicitamente o segundo conjunto em contraste com o primeiro.
