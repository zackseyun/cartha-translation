  yaml_path: translation/ot/exodus/036/032.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: pt
  text: e cinco travessas para as tábuas do segundo lado do tabernáculo, e cinco travessas para as tábuas do tabernáculo na parte mais ao fundo, a oeste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְרִיחִם
  choice: travessas
  rationale: No contexto da construção do tabernáculo, designa peças horizontais que ligavam e mantinham unidas as tábuas; “travessas” é claro e natural em português.
- source_word: קַרְשֵׁי
  choice: tábuas
  rationale: Designa as peças estruturais de madeira do tabernáculo. “Tábuas” mantém a terminologia tradicional e compreensível sem impor a interpretação mais específica de “armações”.
- source_word: צֶלַע
  choice: lado
  rationale: O termo indica um lado ou parte lateral da estrutura; “lado” preserva a formulação simples do hebraico.
- source_word: הַשֵּׁנִית
  choice: segundo
  rationale: A tradução literal “segundo” conserva a sequência em relação ao lado mencionado anteriormente, em vez de substituí-la pela expressão mais idiomática “outro”.
- source_word: הַמִּשְׁכָּן
  choice: tabernáculo
  rationale: Embora o termo se relacione etimologicamente com habitação, aqui é a designação estabelecida da estrutura sagrada em Êxodo.
- source_word: לַיַּרְכָתַיִם
  choice: na parte mais ao fundo
  rationale: A forma indica as partes extremas ou posteriores. “Na parte mais ao fundo” comunica tanto a posição traseira quanto a ideia de extremidade espacial.
- source_word: יָמָּה
  choice: a oeste
  rationale: O termo direcional significa “para o oeste” e, nesta descrição arquitetônica, situa a parte posterior do tabernáculo no lado oeste.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: e cinco ... e cinco
  rationale: A repetição de “e” preserva a coordenação e o estilo enumerativo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A construção “na parte mais ao fundo, a oeste” preserva a força espacial de יַרְכָתַיִם e distingue essa expressão do advérbio direcional יָמָּה.
