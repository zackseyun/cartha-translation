    issue: Relação entre a obra e a ordem divina
    rationale: Em “para executar o trabalho que Yahweh ordenou”, a oração relativa pode modificar “trabalho” de modo a apresentar a execução como o conteúdo diretamente ordenado. O hebraico se refere à obra/tarefa que Yahweh ordenou que fosse realizada. “Para a obra que Yahweh ordenou que fosse feita” mantém essa relação com maior precisão.
