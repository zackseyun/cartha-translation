base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: pt
  text: 'E disseram a Moisés: “O povo está trazendo muito mais do que o necessário para a obra que Yahweh ordenou que fosse feita.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O povo está trazendo demais para a obra”. A expressão hebraica enfatiza que as contribuições excedem o necessário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: E disseram a Moisés
  rationale: A fórmula narrativa introduz discurso direto. Em português natural, o infinitivo redundante לֵאמֹר não precisa ser reproduzido como “dizendo”.
- source_word: מַרְבִּים הָעָם לְהָבִיא מִדֵּי
  choice: O povo está trazendo muito mais do que o necessário
  rationale: A combinação do particípio causativo de רבה, do infinitivo להביא e de מִדֵּי expressa uma ação contínua que excede a quantidade suficiente. A formulação preserva tanto a continuidade quanto a ênfase no excesso.
- source_word: הָעָם
  choice: o povo
  rationale: Referência coletiva direta ao povo de Israel.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: para executar o trabalho
  rationale: Os dois substantivos hebraicos relacionados a serviço e tarefa descrevem aqui o trabalho concreto ligado ao santuário. Em português, uma reprodução mecânica como “para o serviço do trabalho” seria obscura; “executar o trabalho” comunica naturalmente a relação entre a atividade e a obra incumbida.
- source_word: אֲשֶׁר צִוָּה יְהוָה
  choice: que Yahweh ordenou
  rationale: A oração relativa identifica o trabalho como aquele determinado por Yahweh e mantém explicitamente o nome divino.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: executar
  rationale: O infinitivo com pronome objeto refere-se à realização da obra. Integrá-lo à expressão “para executar o trabalho” evita uma passiva pesada e mantém o sentido contextual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e o discurso direto foram preservados, enquanto a relação entre עֲבֹדָה e מְלָאכָה foi expressa de modo idiomático. O marcador de nota aparece após a fala a que se refere.
