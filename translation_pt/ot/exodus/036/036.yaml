base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: pt
  text: Fez para ela[a] quatro colunas de madeira de acácia e as revestiu de ouro. Seus ganchos eram de ouro, e fundiu para elas quatro bases[b] de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, para o véu mencionado no versículo anterior.
    reason: cross_reference
  - marker: b
    text: Ou “encaixes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: colunas
  rationale: Designa suportes estruturais verticais. “Colunas” é natural e preciso em português no contexto da construção do santuário.
- source_word: שִׁטִּים
  choice: madeira de acácia
  rationale: Refere-se à madeira de acácia usada nos componentes do tabernáculo; a expressão é clara e evita uma transliteração opaca.
- source_word: וַיְצַפֵּם
  choice: as revestiu
  rationale: O verbo descreve a aplicação de uma cobertura metálica sobre as colunas; “revestiu” é idiomático e tecnicamente adequado.
- source_word: וָוֵיהֶם
  choice: seus ganchos
  rationale: No contexto, o substantivo indica peças de fixação ligadas às colunas. “Ganchos” é a equivalência mais estabelecida, embora outras identificações da peça tenham sido propostas.
- source_word: אַדְנֵי
  choice: bases
  rationale: Designa as peças inferiores de metal em que as colunas eram encaixadas. “Bases” é claro em português; “encaixes” explicita melhor a função e é registrado em nota.
- source_word: כָסֶף
  choice: prata
  rationale: Termo direto para o metal do qual as bases foram feitas.
- source_word: לָהּ
  choice: para ela
  rationale: Preserva o pronome feminino singular do hebraico, cujo referente contextual é o véu do versículo anterior.
- source_word: וַיִּצֹק
  choice: fundiu
  rationale: No contexto da fabricação de peças metálicas, o verbo denota moldar por fundição; “fundiu” é conciso e natural em português.
