  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: pt
  text: Fez cinquenta colchetes de ouro e, com eles, uniu as cortinas umas às outras, de modo que o tabernáculo se tornou um só.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o tabernáculo era um só”. O hebraico pode ser traduzido dessa forma mais literal; “se tornou um só” ressalta o resultado da união das cortinas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez também
  rationale: O verbo עשה significa normalmente “fazer”. “Também” dá continuidade natural à sequência narrativa marcada por וַ, sem alterar o conteúdo.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: cinquenta colchetes de ouro
  rationale: קֶרֶס designa aqui uma peça de fixação usada para prender as cortinas. “Colchetes” é um termo claro e tradicional em português, sem definir indevidamente o formato da peça.
- source_word: וַיְחַבֵּר
  choice: uniu
  rationale: חבר expressa a ação de unir ou ligar. “Uniu” é direto e natural neste contexto material.
- source_word: אֶת הַיְרִעֹת
  choice: as cortinas
  rationale: יְרִיעוֹת são as grandes peças de tecido que compunham a cobertura do tabernáculo; “cortinas” é a designação convencional e compreensível.
- source_word: אַחַת אֶל אַחַת
  choice: umas às outras
  rationale: A repetição no feminino singular transmite uma relação recíproca entre as cortinas. A formulação portuguesa preserva esse sentido de modo idiomático.
- source_word: בַּקְּרָסִים
  choice: com eles
  rationale: 'A preposição בְּ tem valor instrumental: os colchetes são o meio pelo qual as cortinas foram unidas. O pronome evita repetição pesada e mantém o referente inequívoco.'
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: de modo que o tabernáculo se tornou uma só unidade
  rationale: A frase descreve o resultado da união das cortinas. “Se tornou uma só unidade” explicita naturalmente em português a unidade estrutural resultante, preservando em nota a formulação hebraica mais estrita.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן é o termo estabelecido para a estrutura sagrada descrita em Êxodo. “Tabernáculo” é convencional e amplamente reconhecido em português.
