  text: And he made two boards for the corners of the tabernacle at the rear[a].
translation:
  language: pt
  text: E fez duas tábuas para os cantos do tabernáculo, nas duas extremidades traseiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para as peças de canto do tabernáculo, nas duas extremidades traseiras”. Os termos hebraicos descrevem as extremidades ou os cantos posteriores da estrutura e podem destacar tanto a localização nos cantos como as tábuas especiais que formavam esses cantos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: E ... duas
  rationale: A conjunção coordena este item com a sequência anterior, e o numeral dual é expresso diretamente como “duas”.
- source_word: קְרָשִׁים
  choice: tábuas
  rationale: No contexto da construção do tabernáculo, קֶרֶשׁ designa as peças estruturais de madeira; “tábuas” é claro, tradicional e natural em português.
- source_word: עָשָׂה
  choice: fez
  rationale: Tradução direta e corrente do verbo עשה neste relato de construção.
- source_word: לִ/מְקֻצְעֹת
  choice: para os cantos
  rationale: O termo pode indicar os cantos ou peças/junções de canto; a tradução principal comunica com clareza a localização arquitetônica sem especificar além do hebraico.
- source_word: הַ/מִּשְׁכָּן
  choice: do tabernáculo
  rationale: “Tabernáculo” é a designação consagrada e reconhecível para a estrutura cultual de Êxodo, embora o substantivo se relacione literalmente à ideia de habitação.
- source_word: בַּ/יַּרְכָתָיִם
  choice: na parte de trás
  rationale: A forma dual aponta para as duas extremidades ou lados posteriores. “Na parte de trás” evita a repetição pouco natural de “cantos” e preserva no texto principal a localização posterior, enquanto a nota registra a alternativa mais explícita.
