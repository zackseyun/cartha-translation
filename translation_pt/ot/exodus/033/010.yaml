base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: pt
  text: Quando todo o povo via a coluna de nuvem parada à entrada da tenda, todo o povo se levantava e se prostrava[a], cada um à entrada da sua tenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se inclinava». O verbo hebraico indica um gesto corporal de reverência e muitas vezes descreve um ato de adoração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Quando ... via
  rationale: A construção narrativa liga a visão da coluna às ações seguintes. O imperfeito em português também se harmoniza com o caráter habitual da cena no contexto imediato.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Reproduz o sentido coletivo sem acrescentar “de Israel”, ausente do versículo.
- source_word: עַמּוּד הֶעָנָן
  choice: a coluna de nuvem
  rationale: Preserva de modo claro e tradicional a imagem concreta do hebraico.
- source_word: עֹמֵד
  choice: parada
  rationale: O particípio descreve a posição da coluna; “parada” é natural em português e concorda com “coluna”.
- source_word: פֶּתַח הָאֹהֶל
  choice: à entrada da tenda
  rationale: Traduz diretamente a abertura ou entrada da tenda, sem explicitar “tenda do encontro”, embora essa identificação seja dada pelo contexto.
- source_word: וְקָם
  choice: levantava-se
  rationale: Expressa o ato coletivo de se pôr de pé e mantém o aspecto habitual sugerido pelo contexto.
- source_word: וְהִשְׁתַּחֲווּ
  choice: adorava
  rationale: No contexto da presença manifesta do SENHOR, o gesto corporal de inclinação ou prostração funciona como ato de adoração. A alternativa física é preservada em nota.
- source_word: אִישׁ
  choice: cada um
  rationale: Conserva a força distributiva do singular hebraico em português natural, sem sugerir que somente homens adultos estejam necessariamente em vista.
- source_word: פֶּתַח אָהֳלוֹ
  choice: à entrada da sua própria tenda
  rationale: 'Mantém a imagem distributiva: cada pessoa permanece junto à entrada da tenda que lhe corresponde. “Própria” esclarece essa relação sem alterar o sentido.'
theological_decisions:
- issue: A resposta do povo ao sinal visível da presença divina
  choice: adorava
  alternative: inclinava-se ou prostrava-se
  rationale: O verbo hebraico designa literalmente um gesto corporal de reverência e, neste contexto, tem função cultual. “Adorava” comunica essa força religiosa, enquanto a nota conserva a dimensão física e a ambiguidade lexical.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. O uso de “via” e “levantava-se” apresenta a cena como habitual, em consonância com o contexto imediato. A repetição integral de “todo o povo” foi levemente reduzida para maior naturalidade, sem perda do sujeito coletivo.
