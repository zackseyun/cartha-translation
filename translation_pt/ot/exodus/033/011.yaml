source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: pt
  text: E Yahweh falava com Moisés face a face[a], como um homem fala com seu amigo. Depois, Moisés voltava ao acampamento, mas seu auxiliar Josué, filho de Num, um jovem, não saía do interior da tenda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diretamente” ou “pessoalmente”. A expressão hebraica “face a face” indica um encontro excepcionalmente direto.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a tenda do encontro.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: falava
  rationale: O imperfeito português expressa com naturalidade a ação habitual ou repetida descrita no contexto da tenda do encontro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פָּנִים אֶל־פָּנִים
  choice: face a face
  rationale: Mantém a expressão hebraica de encontro e comunicação excepcionalmente diretos sem transformá-la numa afirmação explícita sobre visão física.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: como um homem fala com seu amigo
  rationale: Reproduz o singular masculino de אִישׁ e traduz רֵעַ de modo natural para uma relação pessoal próxima.
- source_word: וְשָׁב
  choice: Depois, Moisés voltava
  rationale: O imperfeito mantém o aspecto habitual da cena. A explicitação de Moisés evita uma ambiguidade pronominal pouco natural em português e corresponde ao referente indicado pelo contexto.
- source_word: וּמְשָׁרְתוֹ
  choice: seu auxiliar
  rationale: Comunica a função de alguém que presta assistência sem sugerir necessariamente servidão doméstica.
- source_word: נַעַר
  choice: um jovem
  rationale: Preserva a caracterização de Josué como jovem sem duplicar a ideia de serviço já expressa por 'auxiliar'.
- source_word: לֹא יָמִישׁ
  choice: não saía
  rationale: Expressa de maneira corrente tanto a ideia de não se afastar quanto o caráter habitual da ação.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: do interior da tenda
  rationale: Conserva a noção espacial de estar dentro da tenda, com formulação natural em português.
theological_decisions:
- issue: A linguagem antropomórfica de Yahweh falando com Moisés 'face a face'
  choice: Manter 'face a face' no texto principal como expressão de encontro pessoal direto
  alternative: Traduzir interpretativamente como 'diretamente' ou 'pessoalmente'
  rationale: A formulação hebraica preserva a imediação e a intimidade singulares da comunicação sem resolver a tensão com outras passagens sobre a impossibilidade de ver Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Os verbos no imperfeito apresentam a cena como prática habitual. A ordem e as imagens centrais do hebraico foram preservadas sem rigidez sintática.
