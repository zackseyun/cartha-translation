source:
  edition: WLC
  text: וַ/הֲסִרֹתִי֙ אֶת כַּפִּ֔/י וְ/רָאִ֖יתָ אֶת אֲחֹרָ֑/י וּ/פָנַ֖/י לֹ֥א יֵרָאֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: pt
  text: Então retirarei a minha mão, e você verá as minhas costas[a], mas o meu rosto não será visto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que está atrás de mim” ou “a minha parte posterior”. O termo hebraico pode designar as costas ou o aspecto posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Então retirarei
  rationale: O hifil de סור expressa retirar ou remover; “então” comunica naturalmente a sequência em relação ao versículo anterior, e o futuro preserva a força do discurso.
- source_word: כַּפִּי
  choice: a minha mão
  rationale: כַּף pode designar a palma ou a mão. Neste contexto de cobertura protetora, “mão” é a expressão portuguesa mais natural e mantém a imagem antropomórfica.
- source_word: וְרָאִיתָ
  choice: e você verá
  rationale: A forma verbal em sequência dentro de um contexto futuro indica o resultado seguinte. “Você” favorece ampla compreensão contemporânea, especialmente no português brasileiro.
- source_word: אֲחֹרָי
  choice: as minhas costas
  rationale: O termo indica as costas ou o aspecto posterior. Em português, “as minhas costas” é a formulação idiomática mais clara, embora o hebraico também possa significar aquilo que fica atrás de Deus.
- source_word: וּפָנַי
  choice: mas o meu rosto
  rationale: Embora ו seja normalmente aditivo, aqui a relação entre o que Moisés verá e o que não verá é contrastiva; “mas” torna esse contraste explícito sem alterar o sentido. פָּנִים tem forma plural em hebraico, mas sentido singular coletivo, expresso naturalmente por “rosto”.
- source_word: לֹא יֵרָאוּ
  choice: não será visto
  rationale: 'O nifal de ראה é passivo: “ser visto”. A concordância portuguesa no singular acompanha “o meu rosto” e preserva a declaração futura sem acrescentar ideia de incapacidade ou proibição.'
theological_decisions:
- issue: Linguagem antropomórfica a respeito de Deus
  choice: Manter os termos concretos “mão”, “costas” e “rosto” no texto principal.
  alternative: Substituí-los por expressões abstratas como “presença”, “rastro” ou “resplendor”.
  rationale: O hebraico emprega deliberadamente imagens corporais. Conservá-las preserva a tensão teológica da autorrevelação divina sem impor ao texto uma explicação metafísica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se “você” para compreensão ampla. A ordem das orações e o contraste do hebraico são preservados, e a linguagem antropomórfica não é suavizada. O marcador foi colocado após “costas”, termo ao qual a alternativa lexical efetivamente se refere.
