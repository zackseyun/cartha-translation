  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: pt
  text: Agora, pois, se encontrei favor aos teus olhos, peço-te que me faças conhecer os teus caminhos, para que eu te conheça, a fim de que encontre favor aos teus olhos. E considera que esta nação é o teu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “esta nação é o teu povo”. A expressão preserva tanto a linguagem nacional (“nação”) como a relacional (“teu povo”).'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Expressa tanto a transição temporal como a inferência a partir do contexto anterior.
- source_word: נָא
  choice: peço-te
  rationale: Transmite a súplica cortês da partícula hebraica em linguagem portuguesa natural e digna.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: encontrei favor aos teus olhos
  rationale: Preserva a imagem idiomática hebraica e evita dar a 'graça' um sentido teológico mais técnico do que o contexto exige.
- source_word: הוֹדִעֵנִי נָא אֶת דְּרָכֶךָ
  choice: peço-te que me faças conhecer os teus caminhos
  rationale: O hifil de ידע significa fazer conhecer, e דְּרָכֶךָ é formalmente plural; a formulação conserva ambos os aspectos com naturalidade.
- source_word: וְאֵדָעֲךָ
  choice: para que eu te conheça
  rationale: Lê a oração como finalidade ou resultado da revelação pedida e preserva o caráter pessoal de conhecer Deus.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: e encontre favor aos teus olhos
  rationale: Mantém a relação de finalidade e a repetição retórica de 'favor aos teus olhos', sem sobrecarregar a frase com duas locuções finais consecutivas.
- source_word: וּרְאֵה
  choice: considera
  rationale: O imperativo de ראה funciona aqui idiomaticamente como um pedido para levar algo em conta, não apenas para vê-lo fisicamente.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: que esta nação é o teu povo
  rationale: Conserva a distinção lexical entre גּוֹי, 'nação', e עַם, 'povo', incluindo a força relacional da afirmação.
theological_decisions:
- issue: Nuance pactual na oração final
  choice: esta nação é o teu povo
  alternative: este povo é o teu povo
  rationale: A escolha preserva os dois substantivos hebraicos distintos, 'nação' e 'povo', sem ampliar nem reduzir a reivindicação relacional de Moisés.
- issue: Relação entre conhecer os caminhos de Deus e conhecer o próprio Deus
  choice: para que eu te conheça
  alternative: e eu te conhecerei
  rationale: A formulação de finalidade é adequada ao encadeamento do pedido, mas não define em termos doutrinários a natureza desse conhecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes ('teus', 'te', 'teu'). Conserva o plural hebraico 'caminhos', a repetição de 'favor aos teus olhos' e a distinção entre 'nação' e 'povo'.
