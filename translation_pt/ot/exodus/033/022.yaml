  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: pt
  text: E, quando a minha glória passar, eu colocarei você numa fenda[a] da rocha e o cobrirei com a minha mão até que eu tenha passado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na fenda da rocha”. A construção hebraica pode ser traduzida em português com artigo indefinido ou definido antes de “fenda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: E, quando ... passar
  rationale: A combinação de וְהָיָה com בַּעֲבֹר introduz a circunstância temporal da ação seguinte. A formulação finita é natural em português e conserva a ligação com o contexto.
- source_word: כְּבֹדִי
  choice: a minha glória
  rationale: No contexto da manifestação divina, כָּבוֹד designa a glória manifesta de Deus, não apenas honra ou reputação.
- source_word: וְשַׂמְתִּיךָ
  choice: eu colocarei você
  rationale: שׂים significa pôr ou colocar. “Colocarei você” é claro, atual e mantém a ação direta expressa no hebraico.
- source_word: בְּנִקְרַת הַצּוּר
  choice: numa fenda da rocha
  rationale: נִקְרָה denota uma fenda ou cavidade. A construção hebraica permite em português tanto “numa fenda da rocha” quanto “na fenda da rocha”; a forma indefinida soa natural sem eliminar a referência à rocha definida.
- source_word: וְשַׂכֹּתִי כַפִּי עָלֶיךָ
  choice: e o cobrirei com a minha mão
  rationale: סכך comunica cobrir ou resguardar, e כַּף conserva aqui a imagem concreta de “mão”. O pronome “o” retoma Moisés e evita a formulação menos natural “cobrirei sobre você”.
- source_word: עַד עָבְרִי
  choice: até que eu tenha passado
  rationale: עַד com o infinitivo e sufixo de primeira pessoa marca o limite temporal da cobertura. O pretérito composto do subjuntivo apresenta a passagem como concluída nesse ponto futuro.
theological_decisions:
- issue: Linguagem antropomórfica a respeito de Deus (“minha mão”)
  choice: Manter no texto a expressão concreta “minha mão”.
  alternative: minha proteção; meu poder
  rationale: O hebraico emprega diretamente uma imagem corporal. Preservá-la mantém a força narrativa da teofania sem transformá-la numa explicação teológica abstrata nem afirmar além do que o texto diz.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a coordenação inicial “E” e a imagem concreta da mão divina; usa-se “você” para clareza contemporânea.
