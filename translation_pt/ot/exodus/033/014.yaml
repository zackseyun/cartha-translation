  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: pt
  text: 'E ele disse: “Minha presença[a] irá com você, e eu lhe darei descanso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “minha face”. A expressão indica a presença pessoal de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: E ele disse
  rationale: Preserva o fluxo narrativo do wayyiqtol sem impor uma sequência temporal mais específica.
- source_word: פָּנַי
  choice: Minha presença
  rationale: Embora signifique literalmente “minha face”, aqui a expressão comunica a presença pessoal de Deus; “minha presença” é natural em português e mantém o sentido contextual.
- source_word: יֵלֵכוּ
  choice: irá com você
  rationale: O verbo concorda em hebraico com a forma plural de פָּנַי, mas a expressão tem sentido singular. “Irá com você” explicita de modo natural a ideia contextual de acompanhamento, sem reduzir a presença a algo impessoal.
- source_word: וַהֲנִחֹתִי
  choice: e eu lhe darei descanso
  rationale: 'O hifil de נוח tem sentido causativo: fazer descansar ou dar descanso. A formulação escolhida é idiomática e conserva esse valor.'
- source_word: לָךְ
  choice: lhe
  rationale: Representa o sufixo pronominal de segunda pessoa singular e se integra naturalmente à construção portuguesa “dar descanso a alguém”.
theological_decisions:
- issue: Expressão antropomórfica פָּנַי
  choice: Minha presença
  alternative: Minha face; eu mesmo
  rationale: A expressão hebraica usa “face” para comunicar a presença pessoal de Deus. O texto principal transmite o sentido idiomático, enquanto a nota preserva a imagem concreta do original.
- issue: Alcance da promessa de acompanhamento
  choice: irá com você
  alternative: irá
  rationale: O hebraico diz literalmente apenas “irá”, mas o contexto imediato apresenta a presença do SENHOR como aquilo que acompanha Moisés e o povo. “Com você” torna explícita essa relação sem definir além do texto se o singular representa apenas Moisés ou, por meio dele, Israel.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “você” torna explícito o destinatário singular indicado pelo hebraico; “lhe darei descanso” mantém um registro natural sem perder solenidade.
