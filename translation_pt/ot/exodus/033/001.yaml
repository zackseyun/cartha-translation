source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés[a]: “Vá, suba daqui, você e o povo que você tirou da terra do Egito, para a terra que jurei a Abraão, a Isaque e a Jacó, dizendo: ‘Eu a darei à sua descendência[b]’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “à sua semente”. O termo hebraico está no singular coletivo e pode designar a descendência ou os descendentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa essa progressão, e “disse” introduz a fala direta com naturalidade em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: Vá, suba daqui
  rationale: Mantém os dois imperativos hebraicos e o sentido tanto de partir quanto de subir, sem reduzir a expressão a um único verbo.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: que você tirou
  rationale: O hifil de עלה significa fazer subir ou trazer para fora; no contexto do êxodo, “tirou” é claro e natural, embora o vínculo lexical com “suba” fique menos explícito.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Equivalente direto e corrente da expressão hebraica de procedência.
- source_word: אֶל הָאָרֶץ
  choice: para a terra
  rationale: Preserva a direção indicada por אֶל e a referência à terra prometida.
- source_word: נִשְׁבַּעְתִּי לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: jurei dar a Abraão, a Isaque e a Jacó
  rationale: Em português, acrescentar “dar” antes dos beneficiários torna clara a construção do juramento e evita a leitura pouco natural “jurei a Abraão”; o conteúdo da dádiva é explicitado imediatamente na citação.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz de modo transparente o conteúdo verbal do juramento.
- source_word: לְזַרְעֲךָ
  choice: à sua descendência
  rationale: “Descendência” reproduz naturalmente em português o valor coletivo singular de זֶרַע e evita a literalidade potencialmente enganosa de “semente”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Valor coletivo singular de זֶרַע
  choice: descendência
  alternative: semente; descendentes
  rationale: “Descendência” conserva a forma coletiva e não força a decisão entre um referente singular e uma pluralidade de descendentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sequência incomum, mas significativa, dos dois imperativos foi preservada. “Isaque” segue a forma bíblica corrente no português brasileiro.
