  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: pt
  text: Pois como se saberá, então, que achei favor aos teus olhos, eu e o teu povo? Não será por ires conosco, e assim seremos distinguidos[a], eu e o teu povo, de todos os povos que há sobre a face da terra?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “separados” ou “postos à parte”. O verbo hebraico pode indicar que alguém é marcado como extraordinário ou distinto dos demais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה יִוָּדַע אֵפוֹא
  choice: Pois como se saberá, então
  rationale: Mantém a ligação argumentativa, a pergunta pelo meio de reconhecimento, a voz passiva de יִוָּדַע e a força inferencial de אֵפוֹא em português natural.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: que achei favor aos teus olhos
  rationale: Preserva de modo inteligível o idioma hebraico de receber a consideração favorável de alguém, sem transformar חֵן em um termo teológico mais específico.
- source_word: אֲנִי וְעַמֶּךָ
  choice: eu e o teu povo
  rationale: Conserva a associação explícita entre Moisés e o povo pelo qual ele intercede.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: Não será por ires conosco
  rationale: Reproduz a pergunta retórica que espera resposta afirmativa e apresenta a presença de Deus como o meio pelo qual seu favor se torna reconhecível.
- source_word: וְנִפְלֵינוּ
  choice: de modo que eu e o teu povo sejamos distinguidos
  rationale: Expressa o resultado de serem marcados como diferentes ou extraordinários, preservando a relação com a ida de Deus junto deles.
- source_word: מִכָּל הָעָם
  choice: de todos os povos
  rationale: O singular coletivo hebraico tem aqui sentido distributivo; o plural português evita a impressão de referência a um único grupo.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: que há sobre a face da terra
  rationale: Emprega a expressão portuguesa tradicional e clara para os povos que habitam toda a terra.
theological_decisions:
- issue: Natureza da distinção de Israel
  choice: A presença de Deus com Moisés e o povo é apresentada como aquilo que os distingue dos demais povos.
  alternative: Entender que a distinção decorre principalmente da lei, da terra ou da identidade étnica.
  rationale: O próprio versículo vincula explicitamente a distinção ao fato de Deus ir com eles; a tradução mantém essa relação sem acrescentar outra base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com a fala dirigida a Deus. A colocação do marcador após “distinguidos” vincula corretamente a nota ao verbo hebraico וְנִפְלֵינוּ.
