  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: pt
  text: 'E ele disse: “Eu mesmo farei passar toda a minha bondade diante de você e proclamarei diante de você o nome de Yahweh. Concederei graça a quem eu conceder graça e terei misericórdia de quem eu tiver misericórdia[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terei compaixão de quem eu tiver compaixão”.'
    reason: Alternativa lexical legítima para רחם, que pode expressar tanto misericórdia quanto compaixão.
lexical_decisions:
- source_word: אַעֲבִיר
  choice: farei passar
  rationale: O hifil de עבר tem sentido causativo. “Farei passar” preserva essa nuance e soa natural em português.
- source_word: כָּל טוּבִי
  choice: toda a minha bondade
  rationale: טוּב pode indicar bondade, caráter benéfico ou aquilo que é bom. Neste contexto de autorrevelação divina, “bondade” mantém a amplitude do termo sem limitá-lo à beleza ou aos dons.
- source_word: עַל־פָּנֶיךָ
  choice: diante de você
  rationale: A expressão hebraica tem sentido espacial, literalmente relacionado à face ou presença. “Diante de você” é idiomático e preserva a ideia da manifestação perante Moisés.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: proclamarei ... o nome de Yahweh
  rationale: Neste contexto, קרא בשם indica proclamar ou declarar o nome, e não invocá-lo. A formulação antecipa a revelação de Êxodo 34.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: A expressão indica presença ou localização perante Moisés. A repetição de “diante de você” conserva a concretude e a correspondência lexical do hebraico.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: Concederei graça a quem eu conceder graça
  rationale: A construção hebraica repete a mesma raiz para dar ênfase. “Concederei graça” comunica favor imerecido em português corrente e permite preservar a repetição sem a formulação pouco natural “serei gracioso”.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: terei misericórdia de quem eu tiver misericórdia
  rationale: רחם abrange misericórdia e compaixão. A escolha preserva a repetição enfática da raiz e emprega uma expressão natural e digna em português.
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome explícito acrescenta ênfase à forma verbal. “Eu mesmo” transmite essa ênfase sem introduzir a exclusividade mais forte de “somente eu”.
theological_decisions:
- issue: Declaração divina acerca da graça e da misericórdia
  choice: Manter as formulações repetidas na primeira pessoa, sem explicar a razão da escolha divina
  alternative: Parafrasear como um princípio geral de benevolência ou explicitar uma leitura determinista posterior
  rationale: O hebraico afirma a liberdade divina por meio de repetições enfáticas. A tradução conserva essa tensão sem resolver debates teológicos posteriores além do que o próprio versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” para a segunda pessoa singular, evita arcaísmos e preserva as repetições deliberadas do hebraico.
