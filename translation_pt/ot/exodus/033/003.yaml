  text: אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּ/קִרְבְּ/ךָ֗ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ אַ֔תָּה פֶּן אֲכֶלְ/ךָ֖ בַּ/דָּֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: pt
  text: para uma terra que mana leite e mel. Pois não subirei no meio de vocês, porque vocês são um povo de dura cerviz[a], para que eu não os consuma[b] pelo caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um povo obstinado”. A expressão hebraica é literalmente “um povo duro de cerviz”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que eu não os destrua durante a jornada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: para uma terra
  rationale: A preposição אֶל indica direção; a forma sem artigo permite a expressão natural “uma terra”, embora o contexto identifique a terra prometida.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: que mana leite e mel
  rationale: “Manar leite e mel” preserva a metáfora hebraica de abundância e é uma expressão bíblica clara e corrente em português.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Pois não subirei
  rationale: כִּי introduz aqui a explicação da declaração anterior; “subirei” conserva o verbo de subida em direção à terra.
- source_word: בְּקִרְבְּךָ
  choice: no meio de vocês
  rationale: Reproduz o sentido espacial e relacional da presença divina dentro do povo; o sufixo hebraico singular dirige-se coletivamente a Israel, expresso naturalmente pelo plural em português.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: povo de dura cerviz
  rationale: Mantém a imagem hebraica da resistência obstinada, sem reduzi-la simplesmente a “teimoso”; “cerviz” é digna e compreensível no registro bíblico.
- source_word: פֶּן אֲכֶלְךָ
  choice: para que eu não os consuma
  rationale: פֶּן apresenta uma consequência temida a evitar. A formulação portuguesa é natural e preserva a força de כלה, enquanto o plural explicita o referente coletivo do sufixo singular.
- source_word: בַּדָּרֶךְ
  choice: pelo caminho
  rationale: Expressa de modo idiomático a possibilidade de juízo durante a jornada.
theological_decisions:
- issue: Declaração sobre a presença divina
  choice: não subirei no meio de vocês
  alternative: não subirei com vocês
  rationale: “No meio de vocês” preserva a ênfase de בְּקִרְבְּךָ na presença santa de Deus dentro do povo, bem como a tensão de essa presença representar perigo para um povo rebelde.
- issue: Força do juízo em אֲכֶלְךָ
  choice: eu não os consuma
  alternative: eu não os destrua
  rationale: “Consuma” conserva a imagem e a severidade do verbo hebraico sem especificar um modo de destruição que o texto não declara.
- issue: Sentido de פֶּן
  choice: para que eu não
  alternative: do contrário, eu poderia
  rationale: A construção escolhida apresenta o consumo do povo como consequência que explica a ausência da presença divina, sem afirmar além do texto que tal juízo seja inevitável.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. Conserva-se a expressão imagética “dura cerviz”, esclarecida em nota, e usa-se “vocês” para representar naturalmente o destinatário coletivo. Os marcadores [a] e [b] aparecem no texto principal junto às expressões a que se referem.
