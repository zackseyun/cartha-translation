base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Também farei esta coisa[a] que você disse, porque você encontrou favor aos meus olhos[b], e eu o conheço pelo nome.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este assunto” ou “esta palavra”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “você encontrou favor aos meus olhos”, expressão que significa receber consideração favorável.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: גַּם
  choice: também
  rationale: Preserva o sentido aditivo em relação ao pedido anterior de Moisés.
- source_word: הַדָּבָר הַזֶּה
  choice: esta coisa
  rationale: Mantém a amplitude semântica de דָּבָר, que aqui pode designar coisa, assunto ou palavra; as alternativas são registradas em nota.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: da qual você falou
  rationale: Conserva a ligação explícita com aquilo que Moisés havia acabado de dizer, em português natural.
- source_word: אֶעֱשֶׂה
  choice: farei
  rationale: Traduz diretamente o verbo comum עשה e expressa a promessa de ação futura.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: você encontrou favor aos meus olhos
  rationale: Preserva a imagem do idioma hebraico e seu sentido de receber consideração favorável.
- source_word: וָאֵדָעֲךָ
  choice: eu o conheço
  rationale: Expressa conhecimento pessoal e reconhecimento, sem reduzir a frase a mera informação intelectual.
- source_word: בְּשֵׁם
  choice: pelo nome
  rationale: Mantém a expressão concisa de conhecimento pessoal e específico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Força relacional de וָאֵדָעֲךָ בְּשֵׁם
  choice: eu o conheço pelo nome
  alternative: eu o reconheço pessoalmente
  rationale: A tradução mantém tanto o verbo 'conhecer' quanto a expressão 'pelo nome', preservando sua força pessoal sem definir além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção preserva a ordem e as imagens centrais do hebraico, enquanto usa formas correntes como “você” e “eu o conheço”.
