translation:
  language: pt
  text: Quando o povo ouviu essa notícia ruim[a], pôs-se de luto, e ninguém colocou sobre si os seus adornos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «essa palavra má», «essa palavra dolorosa» ou «essa mensagem ruim». O hebraico usa um termo que pode significar palavra, assunto ou coisa.
    reason: lexical_alternative
  - marker: b
    text: Ou «suas joias» ou «seus enfeites». O termo hebraico abrange diferentes objetos ou peças usados como ornamentação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: Quando o povo ouviu
  rationale: O verbo no singular concorda com o substantivo coletivo הָעָם. Em português, «o povo ouviu» preserva naturalmente essa construção.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: essa notícia ruim
  rationale: דָּבָר pode significar palavra, assunto ou coisa; aqui retoma o anúncio anterior. «Notícia ruim» expressa de modo natural sua função no contexto, enquanto a nota preserva as alternativas mais literais.
- source_word: וַיִּתְאַבָּלוּ
  choice: pôs-se de luto
  rationale: O hitpael de אבל indica entrar em estado de luto, não apenas sentir tristeza. A expressão portuguesa comunica tanto a reação emocional quanto sua manifestação costumeira.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: e ninguém colocou
  rationale: 'אִישׁ tem força distributiva após a negação: literalmente, nenhum homem fez isso. «Ninguém» reproduz essa individualização de modo idiomático e inclusivo, sem alterar o referente coletivo.'
- source_word: עֶדְיוֹ עָלָיו
  choice: seus adornos
  rationale: עֲדִי designa de modo amplo objetos ou peças de ornamentação. «Adornos» evita restringir o sentido a joias; o possessivo mantém o valor distributivo do sufixo hebraico.
