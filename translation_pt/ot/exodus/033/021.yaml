  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: pt
  text: 'E o SENHOR disse: “Veja, há um lugar junto de mim; fique de pé sobre a rocha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém a conexão narrativa do וַ e traduz naturalmente o verbo de fala.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino, em continuidade com a camada de consulta auditada.
- source_word: הִנֵּה
  choice: Veja
  rationale: Reproduz a função de chamar a atenção para o lugar indicado, em português corrente.
- source_word: מָקוֹם אִתִּי
  choice: um lugar junto de mim
  rationale: אִתִּי expressa proximidade ou associação; “junto de mim” é natural e preserva essa relação espacial sem especificá-la além do hebraico.
- source_word: וְנִצַּבְתָּ
  choice: fique
  rationale: O perfeito consecutivo no contexto tem força instrutiva ou futura; “fique” comunica naturalmente a orientação dada a Moisés.
- source_word: עַל הַצּוּר
  choice: sobre a rocha
  rationale: Representa diretamente a preposição עַל e o substantivo definido צוּר.
theological_decisions:
- issue: Relação espacial em מָקוֹם אִתִּי
  choice: junto de mim
  alternative: perto de mim / comigo
  rationale: “Junto de mim” conserva a proximidade expressa no texto sem transformar a frase em uma afirmação abstrata sobre a presença divina.
- issue: Valor verbal de וְנִצַּבְתָּ
  choice: fique
  alternative: você ficará / você se colocará
  rationale: O contexto imediato apresenta uma instrução divina; o imperativo natural em português preserva esse valor sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação evita arcaísmos como “eis” e “por-te-ás”, mas mantém o tom solene da narrativa.
