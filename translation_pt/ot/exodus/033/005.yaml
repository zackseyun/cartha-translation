  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Diga aos filhos de Israel[a]: ‘Vocês são um povo de dura cerviz. Se eu subisse no meio de vocês por um só momento[b], eu os consumiria[c]. Agora, portanto, tirem de sobre vocês os seus adornos[d], e saberei o que devo fazer com vocês[e].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Se eu subisse por um só momento entre vocês”.
    reason: lexical_alternative
  - marker: c
    text: Ou “eu os destruiria”.
    reason: lexical_alternative
  - marker: d
    text: Ou “retirem suas joias” ou “deixem de lado seus enfeites”.
    reason: lexical_alternative
  - marker: e
    text: 'Hebraico: “e saberei o que farei com você”. A forma singular se dirige a Israel como um povo, e a tradução preserva a expressão antropomórfica do texto em vez de parafraseá-la como simples tomada de decisão.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar hebraica e seu sentido coletivo; em português, a formulação é clara e tradicional.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: um povo de dura cerviz
  rationale: Conserva a metáfora hebraica da resistência obstinada, sem reduzi-la simplesmente a 'teimoso'.
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: Se eu subisse no meio de vocês por um só momento
  rationale: Retém o verbo 'subir', a linguagem da presença no meio do povo e a força condicional exigida pelo contexto.
- source_word: וְכִלִּיתִיךָ
  choice: eu os consumiria
  rationale: Expressa a ideia de levar inteiramente ao fim em juízo e conserva a linguagem bíblica de consumição.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: tirem de sobre vocês os seus adornos
  rationale: Traduz עֶדִי de modo abrangente e preserva, sem excessiva rigidez, a imagem espacial do hebraico.
- source_word: וְאֵדְעָה
  choice: e saberei
  rationale: Mantém o verbo hebraico 'saber/conhecer' e a sequência da frase, sem parafraseá-lo como mera decisão.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: o que devo fazer com vocês
  rationale: Preserva a abertura da ação futura em relação a Israel, sem restringi-la antecipadamente a castigo, e representa o valor modal possível do imperfeito.
theological_decisions:
- issue: Linguagem antropomórfica do saber divino
  choice: e saberei o que devo fazer com vocês
  alternative: então decidirei o que fazer com vocês
  rationale: O texto hebraico emprega explicitamente o verbo 'saber/conhecer'. A tradução conserva essa tensão teológica e relacional, em vez de resolvê-la por uma paráfrase abstrata.
- issue: Sufixos singulares dirigidos coletivamente a Israel
  choice: vocês / os / seus
  alternative: tu / te / teu
  rationale: O hebraico trata Israel como uma unidade coletiva, embora a mensagem seja dirigida ao conjunto do povo. O plural em português torna o referente natural e inequívoco sem apagar o caráter corporativo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção tradicional “dura cerviz” foi mantida para preservar a metáfora hebraica; as demais escolhas evitam arcaísmos desnecessários. O discurso usa o plural corrente “vocês” para representar naturalmente o destinatário coletivo.
