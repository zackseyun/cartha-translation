  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: pt
  text: Enviarei um anjo adiante de você[a] e expulsarei os cananeus, os amorreus, os hititas, os perizeus, os heveus e os jebuseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um mensageiro”. O termo hebraico מַלְאָךְ pode designar um mensageiro celestial ou humano; neste contexto, “anjo” parece mais adequado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Enviarei
  rationale: O perfeito qal com conjunção, no contexto da fala divina, tem sentido futuro. O futuro simples comunica de modo natural a promessa.
- source_word: לְפָנֶיךָ
  choice: adiante de você
  rationale: A expressão idiomática significa literalmente “diante da sua face” e, neste contexto, indica alguém enviado à frente para conduzir ou preparar o caminho.
- source_word: מַלְאָךְ
  choice: um anjo
  rationale: O substantivo pode designar um mensageiro humano ou celestial. Neste contexto de orientação divina no deserto, “anjo” é a leitura mais provável, sem definir mais precisamente sua identidade.
- source_word: וְגֵרַשְׁתִּי
  choice: e expulsarei
  rationale: O verbo גרשׁ indica fazer sair, desalojar ou expulsar habitantes. “Expulsarei” é claro e apropriado ao contexto da ocupação da terra.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: os cananeus, os amorreus, os hititas, os perizeus, os heveus e os jebuseus
  rationale: Os gentílicos hebraicos estão no singular coletivo. Em português, o plural designa naturalmente cada povo e evita que a lista pareça referir-se a apenas seis indivíduos.
theological_decisions:
- issue: Identidade de מַלְאָךְ neste versículo
  choice: “um anjo”, sem identificá-lo mais especificamente
  alternative: “o Anjo do SENHOR”, “o anjo” ou “um mensageiro”
  rationale: O versículo usa o termo genérico e não identifica explicitamente esse enviado como o Anjo do SENHOR nem esclarece sua natureza. A tradução mantém essa tensão e a nota registra a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” representa o singular hebraico dirigido a Moisés. Os nomes dos povos seguem as formas bíblicas correntes em português, e os singulares coletivos do hebraico são expressos por plurais naturais.
