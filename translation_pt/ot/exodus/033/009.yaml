base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: pt
  text: E sempre que Moisés entrava na tenda, a coluna de nuvem descia e ficava à entrada da tenda, e ele[a] falava com Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: «e o SENHOR falava com Moisés». O hebraico deixa implícito o sujeito desta oração, embora o contexto o identifique como o SENHOR.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: E, sempre que ... entrava
  rationale: A construção introduz uma circunstância habitual e repetida no passado. “Sempre que ... entrava” expressa naturalmente esse valor iterativo em português.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: na tenda / da tenda
  rationale: O hebraico diz simplesmente “a tenda”; o contexto já a identifica. Não se acrescenta aqui o título mais longo “tenda do encontro”.
- source_word: יֵרֵד
  choice: descia
  rationale: O imperfeito português comunica de modo natural a ação habitual no contexto narrativo.
- source_word: עַמּוּד הֶעָנָן
  choice: a coluna de nuvem
  rationale: Preserva de forma clara e tradicional a imagem concreta da expressão construta hebraica.
- source_word: וְעָמַד פֶּתַח הָאֹהֶל
  choice: e parava à entrada da tenda
  rationale: “Parava” transmite aqui a ideia de tomar posição e permanecer no local; “à entrada” é uma formulação espacial idiomática e fiel.
- source_word: וְדִבֶּר
  choice: e ele falava
  rationale: O verbo tem sujeito masculino singular não expresso. O pronome mantém essa referência implícita, sem inserir no corpo do texto um nome ausente do hebraico.
- source_word: עִם מֹשֶׁה
  choice: com Moisés
  rationale: “Com” preserva o valor relacional de עִם e a ideia de comunicação pessoal.
theological_decisions:
- issue: Sujeito implícito de וְדִבֶּר (“e falava”)
  choice: Manter a referência masculina singular como “ele”, explicando em nota que o contexto a identifica com o SENHOR.
  alternative: 'Explicitar no texto: “e o SENHOR falava com Moisés”; menos provavelmente, entender como sujeito “a coluna de nuvem”.'
  rationale: O contexto aponta para o SENHOR como aquele que fala, mas a oração hebraica não nomeia o sujeito. A tradução conserva essa forma e evita resolver silenciosamente a ambiguidade gramatical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O imperfeito foi usado para a sequência habitual. A nota foi colocada junto de “ele”, precisamente no ponto da ambiguidade que explica.
