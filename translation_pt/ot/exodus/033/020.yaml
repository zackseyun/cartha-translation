id: EXO.33.20
reference: Exodus 33:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: pt
  text: 'Mas ele disse: “Você não pode ver o meu rosto[a], pois nenhum ser humano[b] pode me ver e continuar vivo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha presença”. O hebraico diz literalmente “o meu rosto”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “o ser humano”; a afirmação se aplica à humanidade em geral.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ele disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Mas” expressa naturalmente o contraste com o pedido de Moisés no versículo anterior.
- source_word: לֹא תוּכַל
  choice: Você não pode
  rationale: יכל indica capacidade ou possibilidade, não mera falta de permissão.
- source_word: לִרְאֹת
  choice: ver
  rationale: ראה designa aqui percepção visual; “ver” é o equivalente moderno mais claro.
- source_word: אֶת־פָּנַי
  choice: o meu rosto
  rationale: פָּנִים significa literalmente “rosto”. A formulação concreta do hebraico é preservada, sem substituí-la no texto principal pela interpretação “presença”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da impossibilidade declarada anteriormente e mantém um tom digno e corrente.
- source_word: לֹא יִרְאַנִי
  choice: pode me ver
  rationale: O imperfeito formula um princípio geral. Em português, “pode me ver” comunica com naturalidade a impossibilidade geral no contexto.
- source_word: הָאָדָם
  choice: nenhum ser humano
  rationale: O substantivo singular tem sentido genérico e se refere à humanidade. Esta formulação torna explícito o alcance universal sem restringi-lo ao sexo masculino.
- source_word: וָחָי
  choice: e continuar vivo
  rationale: 'A construção expressa o resultado: ver Deus dessa maneira e permanecer com vida. “Continuar vivo” é claro e idiomático.'
theological_decisions:
- issue: Linguagem antropomórfica em “o meu rosto”
  choice: Manter “o meu rosto” no texto principal
  alternative: minha presença
  rationale: O hebraico emprega a imagem concreta de “rosto”. A tradução preserva essa linguagem e registra “presença” apenas como possibilidade lexical, sem resolver a tensão interpretativa.
- issue: Sentido genérico de הָאָדָם
  choice: nenhum ser humano
  alternative: o homem; a humanidade
  rationale: O termo é singular na forma, mas genérico no sentido. “Nenhum ser humano” transmite de modo natural que a declaração se aplica a toda pessoa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “ver” foi mantida por refletir a estrutura e o foco do hebraico; “continuar vivo” explicita de modo natural a consequência expressa por וָחָי.
