  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: pt
  text: 'Então ele disse: “Por favor, mostra-me a tua glória[a]”.


    [a] Ou: “deixa-me ver o teu esplendor”. O verbo hebraico significa literalmente “faz-me ver”, e “glória” também pode indicar esplendor ou honra manifestos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixa-me ver o teu esplendor”. O verbo hebraico significa literalmente “faz-me ver”, e “glória” também pode indicar esplendor ou honra manifestos.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Então ele disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então ele disse” expressa naturalmente a sequência em português; o sujeito, implícito na forma hebraica, é recuperado do contexto.
- source_word: הַרְאֵנִי
  choice: mostra-me
  rationale: O imperativo hifil de ראה com sufixo de primeira pessoa significa literalmente “faz-me ver”. “Mostra-me” preserva de modo idiomático tanto o sentido causativo quanto o pedido dirigido ao interlocutor.
- source_word: נָא
  choice: Por favor
  rationale: A partícula נָא marca súplica ou cortesia. “Por favor” é seu equivalente claro e atual neste pedido.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: אֶת assinala o objeto direto definido e não requer uma palavra correspondente em português.
- source_word: כְּבֹדֶךָ
  choice: a tua glória
  rationale: כָּבוֹד pode designar glória, honra ou esplendor manifesto. Neste contexto, “a tua glória” conserva a amplitude do termo sem reduzi-lo apenas à luminosidade visível ou à honra abstrata.
theological_decisions:
- issue: Sentido de “a tua glória” no pedido de Moisés
  choice: Manter “a tua glória” sem definir em que consiste sua manifestação
  alternative: “o teu esplendor” ou “a plenitude da tua presença”
  rationale: O hebraico não especifica se Moisés pede para ver uma radiância visível, a majestade divina ou uma manifestação da presença de Deus. “Glória” preserva essa amplitude e tensão teológica, enquanto as alternativas estreitam ou explicam o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “tu” preserva a forma singular do hebraico e é natural no registro bíblico; a colocação “mostra-me” evita construções artificiais.
