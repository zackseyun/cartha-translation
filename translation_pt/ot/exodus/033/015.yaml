  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אִם אֵ֤ין פָּנֶ֨י/ךָ֙ הֹלְכִ֔ים אַֽל תַּעֲלֵ֖/נוּ מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: pt
  text: 'Então ele lhe disse: “Se a tua presença[a] não for conosco, não nos faças subir daqui.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a tua face”. Em hebraico, “face” muitas vezes indica a presença pessoal de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Então ele lhe disse
  rationale: O waw consecutivo dá continuidade à narrativa, e אֵלָיו indica que a fala é dirigida ao interlocutor anteriormente mencionado. A formulação é natural em português e preserva a sequência.
- source_word: אִם אֵין ... הֹלְכִים
  choice: Se ... não for conosco
  rationale: A construção condicional com o existencial negativo descreve a possibilidade de a presença divina não acompanhar o povo. “Não for conosco” expressa naturalmente em português o acompanhamento implícito no contexto, sem confundir o verbo com mera existência.
- source_word: פָּנֶיךָ
  choice: a tua presença
  rationale: Embora o hebraico diga literalmente “a tua face”, aqui “face” funciona como expressão da presença pessoal de Deus. A imagem literal é mantida em nota.
- source_word: אַל תַּעֲלֵנוּ
  choice: não nos faças subir
  rationale: O hifil de עלה tem sentido causativo, “fazer subir” ou “levar para cima”. A tradução preserva tanto a forma causativa quanto a linguagem de deslocamento do êxodo.
- source_word: מִזֶּה
  choice: daqui
  rationale: A preposição com o demonstrativo aponta para o lugar presente; “daqui” é a forma portuguesa mais direta e idiomática.
theological_decisions:
- issue: Sentido de פָּנֶיךָ quando se refere a Deus
  choice: a tua presença
  alternative: a tua face
  rationale: No contexto, Moisés fala da presença pessoal de Deus acompanhando Israel. “Presença” comunica o valor idiomático, enquanto a nota conserva a metáfora hebraica e sua força relacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “tua” em concordância com o tratamento reverente tradicional do singular divino, sem vocabulário arcaico além da forma causativa deliberadamente formal “faças subir”.
