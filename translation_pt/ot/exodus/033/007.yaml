source:
  edition: WLC
  text: וּ/מֹשֶׁה֩ יִקַּ֨ח אֶת הָ/אֹ֜הֶל וְ/נָֽטָה ל֣/וֹ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֗ה הַרְחֵק֙ מִן הַֽ/מַּחֲנֶ֔ה וְ/קָ֥רָא ל֖/וֹ אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֙ כָּל מְבַקֵּ֣שׁ יְהוָ֔ה יֵצֵא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֖ר מִ/ח֥וּץ לַֽ/מַּחֲנֶֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: pt
  text: Moisés costumava pegar a tenda e armá-la para si fora do acampamento,[a] bem longe do acampamento. Ele a chamava de Tenda do Encontro. E todo aquele que buscava Yahweh saía até a Tenda do Encontro, que ficava fora do acampamento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a tenda”. O texto não diz explicitamente “sua tenda”; alguns entendem que se tratava da própria tenda de Moisés, enquanto outros a consideram uma tenda específica usada para esse propósito.'
    reason: lexical_alternative
  - marker: b
    text: 'Os verbos hebraicos deste versículo provavelmente descrevem ações habituais: Moisés costumava armar a tenda, e quem buscava Yahweh costumava sair até ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: costumava pegar
  rationale: O yiqtol neste contexto narrativo provavelmente expressa uma ação habitual ou repetida; “costumava pegar” comunica isso de modo natural em português.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: Embora o hebraico tenha artigo definido (“a tenda”), a expressão não diz explicitamente “sua tenda”. A tradução mantém a referência definida sem identificar além do que o texto afirma.
- source_word: וְנָטָה לוֹ
  choice: e armá-la para si
  rationale: נטה, quando usado com uma tenda, significa armá-la ou montá-la. “Para si” preserva o pronome לוֹ e sugere uso ou finalidade sem especificá-los indevidamente.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Equivalente locativo direto e natural em português.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: bem longe do acampamento
  rationale: Preserva a ênfase na distância e na separação, reforçando a expressão anterior.
- source_word: וְקָרָא לוֹ אֹהֶל מוֹעֵד
  choice: Ele a chamava de Tenda do Encontro
  rationale: קרא לוֹ introduz o nome dado à tenda. O valor habitual do contexto é mantido por “chamava”.
- source_word: אֹהֶל מוֹעֵד
  choice: Tenda do Encontro
  rationale: מוֹעֵד pode designar tempo ou lugar determinado para encontro. “Tenda do Encontro” é claro, digno e estabelecido em português.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: todo aquele que buscava Yahweh
  rationale: “Buscava” preserva tanto a ideia devocional de procurar Deus quanto a possível nuance de consultá-lo, sem restringir o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: יֵצֵא
  choice: saía
  rationale: O imperfeito português expressa naturalmente a ação habitual indicada pelo yiqtol neste contexto.
- source_word: אֲשֶׁר מִחוּץ לַמַּחֲנֶה
  choice: que ficava fora do acampamento
  rationale: A oração relativa identifica de modo natural a localização habitual da tenda.
theological_decisions:
- issue: Identidade de הָאֹהֶל, “a tenda”
  choice: Manter “a tenda” sem defini-la como propriedade de Moisés
  alternative: “sua tenda” ou “uma tenda”
  rationale: O texto usa o artigo definido, mas não um pronome possessivo. A tradução preserva a ambiguidade quanto a ser a tenda pessoal de Moisés ou uma tenda específica destinada a esse uso.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Relação desta tenda com o santuário posterior
  choice: Não identificar nem distinguir explicitamente além do texto
  alternative: Explicar no corpo do versículo que se trata de uma tenda provisória e distinta do tabernáculo
  rationale: O versículo chama o local de אֹהֶל מוֹעֵד, mas não oferece aqui uma explicação cronológica ou cultual. A tradução evita resolver uma questão interpretativa no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito e a locução “costumava pegar” exprimem a habitualidade sem tornar a frase excessivamente técnica. A capitalização de “Tenda do Encontro” trata a expressão como a designação dada por Moisés, sem impor uma identificação teológica adicional.
