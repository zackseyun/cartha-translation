source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: pt
  text: 'Então Moisés disse a Yahweh: “Olha, tu me dizes: ‘Faz este povo subir’, mas não me fizeste saber quem enviarás comigo. Contudo, tu disseste: ‘Eu te conheço pelo nome[a], e também achaste favor a meus olhos[b]’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eu te conheço pelo nome” é uma expressão que indica conhecimento pessoal e favor.
    reason: cultural_note
  - marker: b
    text: 'Ou: “achaste graça a meus olhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: רְאֵה
  choice: Olha
  rationale: Como marcador discursivo imperativo, introduz diretamente a queixa de Moisés e soa natural em português atual.
- source_word: הַעַל אֶת הָעָם הַזֶּה
  choice: Faze este povo subir
  rationale: Preserva o valor causativo de עלה no hifil e a referência direcional da jornada, sem transformar o verbo em uma interpretação mais ampla como “conduzir”.
- source_word: לֹא הוֹדַעְתַּנִי
  choice: não me fizeste saber
  rationale: Mantém o sentido causativo do hifil de ידע, embora em português seja uma formulação mais formal que “não me disseste”.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: quem enviarás comigo
  rationale: O referente é naturalmente pessoal, e “comigo” expressa de modo direto o acompanhamento indicado por עִם.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Eu te conheço pelo nome
  rationale: Conserva o idioma hebraico e sua força relacional sem explicá-lo no corpo do texto como escolha, eleição ou intimidade.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: achaste favor aos meus olhos
  rationale: Preserva a imagem idiomática hebraica e traduz חֵן por “favor”, termo natural neste contexto.
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: mas ... Contudo, tu disseste
  rationale: Torna explícito em português o contraste enfático produzido pela repetição do pronome no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; a transliteração evita substituir o nome por um título.
- issue: Sentido de “Eu te conheço pelo nome”
  choice: Manter literalmente o idioma relacional
  alternative: Eu te conheço pessoalmente; Eu te escolhi pessoalmente
  rationale: A expressão comunica conhecimento pessoal e favor divinos, mas o hebraico não explicita aqui uma formulação doutrinária mais forte, como eleição.
- issue: Valor de חֵן
  choice: favor
  alternative: graça
  rationale: Ambas são possíveis, mas “favor” é mais natural na expressão contextual e evita impor ao termo uma carga teológica sistemática que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” para reproduzir com clareza os pronomes e verbos de segunda pessoa do hebraico. A construção “faze este povo subir” preserva deliberadamente a direção do verbo original, enquanto “Contudo” comunica a tensão do apelo de Moisés.
