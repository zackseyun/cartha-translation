  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: pt
  text: Assim, os israelitas tiraram seus enfeites desde o monte Horebe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas tiraram seus enfeites no monte Horebe”. A expressão hebraica pode indicar o lugar da ação ou o ponto a partir do qual deixaram de usar os enfeites.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: tiraram
  rationale: O hitpael de נצל indica aqui remover de si; em português, “tiraram seus enfeites” expressa naturalmente a ação reflexiva sem exigir uma construção pesada.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora literalmente seja “filhos de Israel”, “os israelitas” é a designação coletiva natural e plenamente equivalente em português moderno.
- source_word: עֶדְיָם
  choice: seus enfeites
  rationale: עֲדִי designa adornos ou objetos de ornamentação. “Enfeites” mantém o sentido amplo sem especificar indevidamente joias ou materiais.
- source_word: מֵהַר חוֹרֵב
  choice: desde o monte Horebe
  rationale: A preposição מִן pode assinalar o ponto a partir do qual deixaram de usar os enfeites. “Desde” preserva essa leitura temporal ou progressiva de modo conciso.
