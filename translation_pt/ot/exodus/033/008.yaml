  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: pt
  text: E sempre que Moisés saía para a tenda[a], todo o povo se levantava e se punha de pé, cada homem à entrada de sua tenda[b], e o acompanhava com o olhar até ele entrar na tenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à Tenda”; trata-se da tenda do encontro mencionada no contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cada homem”; a forma masculina singular é usada distributivamente para os membros do povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E sempre que
  rationale: A construção introduz uma circunstância habitual e repetida; “sempre que” expressa naturalmente esse valor iterativo.
- source_word: כְּצֵאת מֹשֶׁה אֶל הָאֹהֶל
  choice: Moisés saía para ir à tenda
  rationale: O infinitivo com כְּ marca a circunstância temporal, enquanto אֶל indica movimento em direção à tenda. A formulação evita sugerir que Moisés estivesse saindo de dentro dela.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: O hebraico diz literalmente “a tenda”. O contexto a identifica como a tenda do encontro, mas o texto deste versículo não repete a designação completa.
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: se levantava e ficava de pé
  rationale: As formas verbais descrevem ações costumeiras. A tradução preserva tanto o ato de levantar-se como o de permanecer em posição.
- source_word: אִישׁ
  choice: cada homem
  rationale: O substantivo masculino singular é usado distributivamente entre os membros do povo; a tradução conserva essa forma explícita.
- source_word: פֶּתַח אָהֳלוֹ
  choice: à entrada de sua própria tenda
  rationale: פֶּתַח designa a abertura ou entrada. “Própria” esclarece em português a oposição entre a tenda para a qual Moisés ia e a tenda pertencente a cada homem.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: e acompanhavam Moisés com o olhar
  rationale: A expressão descreve olhar na direção de alguém que se afasta, seguindo seus movimentos visualmente. Esta formulação é idiomática e preserva o sentido de אַחֲרֵי sem sugerir perseguição física.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: até ele entrar na tenda
  rationale: O verbo בוא e o ה direcional em “tenda” indicam movimento para dentro; “entrar” comunica isso de modo conciso e natural.
theological_decisions:
- issue: Identidade de הָאֹהֶל (“a tenda”)
  choice: Manter “a tenda” no texto e explicar a referência contextual em nota
  alternative: Traduzir diretamente como “a Tenda do Encontro”
  rationale: O contexto aponta para a tenda do encontro, mas este versículo usa apenas o substantivo definido. A tradução conserva a formulação do hebraico sem ocultar a identificação contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular coletivo “todo o povo” rege os verbos no singular; o sujeito plural implícito de “acompanhavam” retoma os integrantes do povo, em correspondência com o hebraico.
