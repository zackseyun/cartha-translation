  source_fidelity: 'A primeira proibição é bem vertida: «espalhe um relato falso» comunica adequadamente o idiomatismo נשא שמע שוא. A segunda preserva a cooperação com o perverso e o objetivo de tornar-se testemunha; porém «dê a mão a» em português normalmente sugere cumprimento, ajuda ou acordo genérico e não reproduz com suficiente precisão a colocação concreta «pôr a mão com».'
  naturalness: O texto é claro, conciso e de registro jurídico apropriado. «Não una a sua mão à de um perverso» é natural o bastante e explicita melhor a cumplicidade indicada pelo hebraico, sem introduzir a imagem potencialmente enganosa de um aperto de mãos.
  terminology: «Relato falso», «perverso» e «testemunha injusta» são escolhas defensáveis. Para עד חמס, «testemunha injusta» interpreta corretamente a expressão no contexto forense; a nota deve, porém, evitar apresentar «testemunha de violência» como se fosse uma tradução portuguesa natural e deve indicar que «violenta» é uma opção lexical mais próxima, embora contextualizada.
  issues:
