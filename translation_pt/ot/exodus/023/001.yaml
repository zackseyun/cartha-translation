  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: pt
  text: Não espalhe um relato falso[a]. Não una a sua mão à de um perverso para ser testemunha injusta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não carregue nem faça circular um relato falso”. O verbo hebraico significa literalmente “levantar, carregar” e, neste contexto, refere-se a levar adiante um relato.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não ponha a sua mão com um perverso para ser testemunha violenta”. A expressão pode indicar uma testemunha violenta, mal-intencionada ou injusta.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: espalhe
  rationale: נָשָׂא significa literalmente “levantar, carregar”, mas, com שֵׁמַע (“relato, notícia”), descreve levar adiante ou fazer circular um relato. “Espalhe” comunica naturalmente esse sentido em português.
- source_word: שֵׁמַע שָׁוְא
  choice: um relato falso
  rationale: שֵׁמַע é aquilo que se ouve, isto é, relato, notícia ou rumor; שָׁוְא pode indicar falsidade, vazio ou inutilidade. “Relato falso” é claro e adequado ao contexto jurídico.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: dê a mão a
  rationale: A expressão significa literalmente “ponha a sua mão com”. “Dê a mão a” conserva a imagem concreta e expressa cooperação ou cumplicidade.
- source_word: רָשָׁע
  choice: um perverso
  rationale: רָשָׁע designa alguém perverso, culpado ou que age injustamente. O substantivo masculino singular preserva a forma representativa do hebraico sem exigir a adição de “homem”.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: para ser testemunha injusta
  rationale: עֵד é “testemunha”, e חָמָס abrange violência, maldade e injustiça. No contexto judicial, “testemunha injusta” comunica alguém cujo testemunho agride a justiça, enquanto a nota preserva a formulação mais literal e sua força.
- source_word: לֹא / אַל
  choice: Não ... Não
  rationale: As duas partículas introduzem proibições. O imperativo negativo com “não” é atual, direto e preserva a força normativa do texto.
theological_decisions:
- issue: Formas masculinas singulares na instrução jurídica
  choice: Manter o destinatário no singular e traduzir רָשָׁע por “um perverso”
  alternative: Empregar uma formulação explicitamente inclusiva, como “uma pessoa perversa”
  rationale: O hebraico usa formas masculinas singulares. A tradução conserva o número e a forma gramatical sem acrescentar “homem”; o preceito continua tendo aplicação representativa.
- issue: Sentido de עֵד חָמָס
  choice: testemunha injusta
  alternative: testemunha violenta; testemunha mal-intencionada; testemunha falsa
  rationale: חָמָס tem força mais ampla que mera falsidade e pode denotar violência, dano ou injustiça. No ambiente judicial, “injusta” transmite a lesão causada à justiça sem limitar indevidamente a expressão a uma mentira verbal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa singular é expressa pelas formas verbais correntes com “você” implícito. A tradução mantém a imagem da mão e registra em nota a formulação mais literal de עֵד חָמָס.
