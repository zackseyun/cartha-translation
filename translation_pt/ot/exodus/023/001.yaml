  - severity: low
    issue: A nota b formula literalmente «testemunha de violência».
    rationale: A construção hebraica עד חמס é mais bem refletida em português por «testemunha violenta» (ou, no contexto, «testemunha injusta/mal-intencionada»), não por «testemunha de violência», que pode sugerir alguém que testemunha acerca de um ato violento.
