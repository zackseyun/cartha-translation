  text: לֹ֥א תִהְיֶ֛ה מְשַׁכֵּלָ֥ה וַ/עֲקָרָ֖ה בְּ/אַרְצֶ֑/ךָ אֶת מִסְפַּ֥ר יָמֶ֖י/ךָ אֲמַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: pt
  text: Não haverá em sua terra mulher que sofra um aborto espontâneo[a] nem mulher estéril; completarei o número dos seus dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulher privada de filhos”. O termo hebraico pode referir-se de modo mais amplo à perda de filhos, mas, neste contexto, em paralelo com “estéril”, provavelmente indica aborto espontâneo ou perda de um filho no parto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “encherei o número dos seus dias”, isto é, “levarei sua duração de vida à medida plena”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: mulher que sofra aborto
  rationale: O particípio feminino de שׁכל pode indicar alguém privada de filhos. Em paralelo com “estéril” e no contexto de fecundidade, refere-se provavelmente à perda da gestação ou do filho no parto; a formulação é clara e natural em português.
- source_word: עֲקָרָה
  choice: mulher estéril
  rationale: Equivalente corrente para a mulher incapaz de gerar filhos, adequado ao paralelismo e ao contexto da bênção sobre a fecundidade.
- source_word: בְּאַרְצֶךָ
  choice: em sua terra
  rationale: אֶרֶץ designa aqui a terra de Israel no contexto da promessa da aliança, não a terra em sentido genérico.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: o número dos seus dias
  rationale: Mantém a expressão hebraica para a duração de vida concedida, sem reduzi-la simplesmente a “vida” ou “longevidade”.
- source_word: אֲמַלֵּא
  choice: completarei
  rationale: O verbo מלא significa literalmente “encher, tornar pleno”. Com “o número dos dias”, “completarei” comunica em português natural que Deus levará essa medida à plenitude.
- source_word: לֹא תִהְיֶה
  choice: não haverá
  rationale: Reproduz de modo idiomático a construção existencial hebraica que nega a presença dessas condições na terra.
theological_decisions:
- issue: Alcance da promessa de fecundidade e longevidade
  choice: Apresentar a promessa como bênção da aliança para Israel em sua terra, sem explicitar no corpo do versículo uma aplicação universal e atemporal a cada indivíduo.
  alternative: Entender o versículo como garantia universal de que todo crente individual jamais sofrerá aborto, infertilidade ou morte prematura.
  rationale: O contexto imediato trata das promessas de YHWH a Israel relativas à vida na terra. A tradução conserva a afirmação do texto, mas não amplia seu alcance além do que o contexto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mulher que sofra aborto” evita o pouco natural “abortiva” e deixa explícito o referente feminino dos particípios hebraicos. “Completarei” preserva a ideia de plenitude de מלא em uma construção portuguesa idiomática; a imagem literal é registrada em nota.
