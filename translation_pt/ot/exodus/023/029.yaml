base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: pt
  text: Não os expulsarei da sua frente em um só ano[a], para que a terra não fique desolada nem os animais selvagens[b] se multipliquem contra você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em um único ano”. O objeto de “expulsarei” é singular em hebraico, provavelmente uma referência coletiva aos habitantes da terra.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os animais do campo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: Não os expulsarei
  rationale: גרש significa expulsar ou desalojar. Embora o sufixo hebraico seja singular, ele retoma coletivamente os povos mencionados no contexto; o plural em português torna essa referência natural e clara.
- source_word: מִפָּנֶיךָ
  choice: da sua frente
  rationale: Preserva a imagem espacial do idioma hebraico e é compreensível em português, sem recorrer à formulação mais abstrata 'da sua presença'.
- source_word: בְּשָׁנָה אֶחָת
  choice: em um só ano
  rationale: Expressa de modo natural o período delimitado e mantém a ênfase do numeral אֶחָת.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz naturalmente em português a consequência indesejada que fundamenta a ação gradual, correspondendo à força preventiva de פֶּן.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: a terra não fique desolada
  rationale: Mantém o sentido resultativo de tornar-se desabitada ou devastada, em formulação corrente e digna.
- source_word: וְרַבָּה
  choice: se multipliquem
  rationale: רבה indica aumentar ou tornar-se numeroso. 'Multipliquem-se' reproduz o crescimento dos animais sem explicitar além do texto a ideia de serem 'numerosos demais'.
- source_word: עָלֶיךָ
  choice: contra você
  rationale: No contexto de ameaça, עַל assume sentido adversativo; 'contra você' comunica claramente o perigo.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais selvagens
  rationale: A expressão designa os animais não domesticados do campo. Esta forma é clara e atual; a nota registra uma alternativa mais formalmente próxima.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'para que ... não' evita o arcaísmo de 'para que não suceda que', e 'você' representa com clareza o destinatário singular do hebraico.
