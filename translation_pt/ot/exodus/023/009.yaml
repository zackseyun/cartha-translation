  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: pt
  text: Não oprima o estrangeiro residente[a]; vocês mesmos conhecem a condição do estrangeiro residente[b], pois foram estrangeiros residentes na terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrangeiro”, “imigrante” ou “forasteiro”. O hebraico ger designa uma pessoa não nativa que vive no meio de um povo, muitas vezes em condição social vulnerável.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “vocês conhecem a nefesh do estrangeiro residente”. Aqui, nefesh se refere à vida interior ou à condição vivida por essa pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: estrangeiro residente
  rationale: Designa alguém não nativo que vive entre o povo, muitas vezes em situação social vulnerável, e não um simples viajante. A expressão comunica a condição estrangeira e a residência continuada sem recorrer ao tom burocrático de “alienígena residente”.
- source_word: תִלְחָץ
  choice: oprima
  rationale: Neste contexto jurídico, o verbo expressa pressão opressiva, exploração ou abuso contra uma pessoa vulnerável.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: pois vocês mesmos conhecem
  rationale: O pronome explícito dá ênfase a “vocês mesmos”, e o perfeito indica conhecimento adquirido pela experiência. “Pois” torna clara a relação explicativa com a proibição anterior.
- source_word: נֶפֶשׁ
  choice: condição
  rationale: Na expressão idiomática, נֶפֶשׁ aponta para a vida interior e a experiência concreta do estrangeiro. “Condição” comunica o sentido contextual sem impor uma leitura dualista de “alma”.
- source_word: אֶת נֶפֶשׁ הַגֵּר
  choice: a condição do estrangeiro residente
  rationale: A formulação expressa conhecimento empático, adquirido pela experiência, preservando em nota a imagem hebraica mais literal.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão histórica pela qual Israel conhece essa condição.
- source_word: גֵרִים הֱיִיתֶם
  choice: foram estrangeiros residentes
  rationale: Repete a mesma tradução de גֵר para preservar a ligação retórica entre a pessoa protegida e a experiência de Israel.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Reflete a forma hebraica e mantém a cadência solene da recordação histórica.
theological_decisions:
- issue: Sentido de גֵר na legislação da aliança
  choice: estrangeiro residente
  alternative: estrangeiro; imigrante; forasteiro
  rationale: O apelo ético se baseia na experiência de Israel como população estrangeira residente no Egito. A escolha preserva a dimensão social e jurídica sem reduzir o termo à etnia nem sugerir uma passagem meramente temporária.
- issue: Sentido de נֶפֶשׁ na expressão idiomática
  choice: condição
  alternative: alma; vida interior; experiência
  rationale: O texto apela ao conhecimento vivido da situação do estrangeiro. A tradução evita transformar נֶפֶשׁ numa afirmação antropológica técnica, ao mesmo tempo que a nota conserva a forma literal e sua amplitude.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O singular na proibição e o plural no apelo à experiência coletiva foram preservados. A repetição de “estrangeiro residente” reproduz deliberadamente a repetição de גֵר.
