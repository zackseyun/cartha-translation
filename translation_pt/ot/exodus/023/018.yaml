base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: pt
  text: Não ofereça o sangue do meu sacrifício junto com nada fermentado[a], e a gordura da minha festa[b] não ficará até de manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com fermento” ou, mais literalmente, “sobre fermento”. Neste contexto sacrificial, a expressão provavelmente proíbe oferecer o sangue em associação com qualquer coisa fermentada.
    reason: lexical_alternative
  - marker: b
    text: Ou “festival”. O termo hebraico se refere a uma celebração religiosa sagrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: ofereça
  rationale: No contexto sacrificial, o verbo זבח indica a apresentação ou imolação de um sacrifício. Como o objeto expresso é “o sangue”, “ofereça” evita a construção pouco natural “sacrificar o sangue” sem apagar o sentido cultual.
- source_word: עַל חָמֵץ
  choice: junto com nada fermentado
  rationale: A preposição עַל significa literalmente “sobre”, mas aqui provavelmente proíbe associar o sangue sacrificial a algo fermentado. “Junto com” comunica essa relação, enquanto “nada fermentado” preserva a abrangência de חָמֵץ.
- source_word: דַּם זִבְחִי
  choice: o sangue do meu sacrifício
  rationale: Mantém tanto a referência explícita ao sangue quanto o sufixo divino de primeira pessoa, sem substituir a expressão por uma paráfrase interpretativa.
- source_word: יָלִין
  choice: permanecer
  rationale: O verbo לין significa passar a noite ou permanecer durante a noite. Com “até de manhã”, “permanecer” é natural e evita redundância.
- source_word: חֵלֶב
  choice: a gordura
  rationale: Traduz diretamente o termo sacrificial, sem explicitar “porções de gordura”, embora esse seja provavelmente o referente concreto.
- source_word: חַגִּי
  choice: minha festa
  rationale: חַג designa uma celebração religiosa ou festa de peregrinação. “Festa” conserva a forma concisa e o sufixo de primeira pessoa; “festival” permanece como alternativa em nota.
- source_word: עַד בֹּקֶר
  choice: até de manhã
  rationale: Expressão temporal corrente e natural em português, correspondente a “até a manhã”.
theological_decisions:
- issue: Referência dos sufixos de primeira pessoa em “meu sacrifício” e “minha festa”
  choice: Manter a fala divina em primeira pessoa, sem expansão interpretativa.
  alternative: “o sacrifício oferecido a mim” e “a festa do SENHOR”
  rationale: Os sufixos hebraicos são explícitos. Conservá-los preserva a apresentação do sacrifício e da festa como pertencentes a Deus no culto da aliança.
- issue: Relação entre o fermento e o sangue sacrificial
  choice: Traduzir עַל de modo relacional como “junto com”, mantendo a proibição sem especificar o procedimento ritual.
  alternative: “sobre fermento”
  rationale: A preposição admite uma tradução mais literal, mas sua força exata no contexto é incerta. A redação principal comunica a associação proibida, e a nota preserva a alternativa formal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação legal foi mantida de forma concisa; evitou-se acrescentar “durante a noite”, pois “até de manhã” já expressa o limite temporal.
