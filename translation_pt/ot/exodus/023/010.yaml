lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: Durante seis anos
  rationale: A conjunção ligada à expressão numeral-temporal introduz o período em que a instrução deve ser cumprida; em português, “Durante seis anos” expressa esse valor de modo natural.
- source_word: תִּזְרַע
  choice: você semeará
  rationale: O imperfeito hebraico, neste contexto legal, tem força prescritiva. O futuro do indicativo preserva o tom de estipulação e continua claro para leitores modernos.
- source_word: אַרְצֶךָ
  choice: a sua terra
  rationale: Aqui אֶרֶץ designa a terra cultivada pertencente ao destinatário, não o planeta ou a terra em sentido universal.
- source_word: וְאָסַפְתָּ
  choice: e recolherá
  rationale: אָסַף significa reunir ou recolher. “Recolherá” comunica a ação de ajuntar a produção sem restringi-la indevidamente a uma técnica específica de colheita.
- source_word: תְּבוּאָתָהּ
  choice: a sua produção
  rationale: תְּבוּאָה designa a produção ou o rendimento agrícola. O possessivo retoma “terra”, preservando a relação expressa pelo sufixo feminino hebraico.
