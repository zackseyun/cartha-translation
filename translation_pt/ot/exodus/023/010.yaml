  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: pt
  text: Durante seis anos, você semeará a sua terra e recolherá a produção da terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rendimento da terra”.'
