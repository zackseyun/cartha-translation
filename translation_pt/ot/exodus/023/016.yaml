  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: pt
  text: e a Festa[a] da Colheita, as primícias do seu trabalho, daquilo que você semear no campo; e a Festa do Recolhimento[c], no fim do ano[b], quando você recolher do campo o produto do seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Festival”, nas duas ocorrências de חַג.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “na saída do ano”.
    reason: lexical_alternative
  - marker: c
    text: “Recolhimento” refere-se à festa que marcava a reunião dos produtos colhidos do campo.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: Festa
  rationale: Expressa uma celebração religiosa marcada e solene em linguagem corrente; a inicial maiúscula indica seu uso no nome das festas.
- source_word: הַקָּצִיר
  choice: Colheita
  rationale: É a forma portuguesa mais natural para o período e o ato de colher, adequando-se ao nome da festa.
- source_word: בִּכּוּרֵי
  choice: primícias
  rationale: Preserva o sentido agrícola e cultual dos primeiros produtos da colheita apresentados a Deus.
- source_word: מַעֲשֶׂיךָ
  choice: seus trabalhos / o fruto dos seus trabalhos
  rationale: O termo designa aquilo que resulta da atividade humana. A primeira ocorrência mantém a formulação mais formal; na segunda, 'o fruto dos seus trabalhos' torna natural a ideia de recolher do campo sem reduzir o trabalho apenas ao produto agrícola.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: daquilo que você semear no campo
  rationale: Conserva a referência direta ao destinatário e explicita naturalmente a relação das primícias com o que foi semeado.
- source_word: הָאָסִף
  choice: Recolhimento
  rationale: Conserva a ideia nominal de juntar e recolher os produtos do campo e distingue esta festa da Festa da Colheita mencionada antes.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: no fim do ano
  rationale: Comunica de modo idiomático o sentido temporal da expressão hebraica, cuja imagem literal é 'na saída do ano'.
- source_word: בְּאָסְפְּךָ
  choice: quando você recolher
  rationale: O infinitivo com preposição tem valor temporal; esta formulação é clara e natural em português.
- source_word: מִן הַשָּׂדֶה
  choice: do campo
  rationale: Indica de maneira direta a origem dos produtos recolhidos.
theological_decisions: []
