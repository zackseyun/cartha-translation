  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: pt
  text: Vocês servirão a Yahweh, seu Deus, e ele abençoará o pão de vocês[a] e a água de vocês; e eu tirarei a doença do meio de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pão” também pode representar alimento ou sustento em sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “enfermidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Vocês servirão
  rationale: O verbo עבד abrange serviço e culto prestados a Deus. “Servirão” conserva essa amplitude e, no contexto das instruções da aliança, comunica obrigação com consequência futura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: A referência singular a Yahweh e o contexto da aliança tornam inequívoco o sentido “Deus”; “seu” expressa a relação com o povo.
- source_word: וּבֵרַךְ
  choice: e ele abençoará
  rationale: A forma apresenta a bênção como consequência prometida. O pronome explicita naturalmente Yahweh como sujeito em português.
- source_word: לַחְמְךָ
  choice: o pão de vocês
  rationale: Mantém o sentido concreto de לֶחֶם, embora o termo também possa representar alimento ou sustento em sentido mais amplo.
- source_word: מֵימֶיךָ
  choice: a água de vocês
  rationale: Embora a forma hebraica seja morfologicamente plural/coletiva, “água” no singular é a expressão idiomática em português.
- source_word: וַהֲסִרֹתִי
  choice: e eu tirarei
  rationale: O hifil de סור significa remover ou afastar. “Tirarei” é direto e natural e preserva a mudança do sujeito da terceira para a primeira pessoa.
- source_word: מַחֲלָה
  choice: a doença
  rationale: O substantivo designa doença ou enfermidade. “Doença” é amplo, corrente e não excessivamente clínico.
- source_word: מִקִּרְבֶּךָ
  choice: do meio de vocês
  rationale: Preserva o sentido comunitário da expressão e evita restringi-la a uma enfermidade interna do indivíduo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome pessoal divino; sua transliteração preserva isso sem substituí-lo por um título.
- issue: Mudança das formas de segunda pessoa
  choice: Empregar “vocês” de modo coletivo em toda a frase e registrar a mudança hebraica em nota
  alternative: Imitar a passagem abrupta do plural para o singular em português
  rationale: O verbo inicial dirige-se ao povo no plural, mas os sufixos seguintes estão no singular coletivo. Uniformizar “vocês” produz português claro sem esconder a forma do original, que é indicada em nota.
- issue: Mudança do sujeito divino
  choice: Preservar “ele abençoará” seguido de “eu tirarei”
  alternative: Uniformizar tudo na primeira ou na terceira pessoa
  rationale: A alternância está no hebraico e deve permanecer, ainda que crie uma tensão discursiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para a referência coletiva. A pontuação com ponto e vírgula destaca, sem resolver, a mudança de “ele” para “eu” no discurso divino.
