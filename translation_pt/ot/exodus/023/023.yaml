  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: pt
  text: Pois o meu anjo[a] irá à sua frente e levará você até os amorreus, os hititas, os perizeus, os cananeus, os heveus e os jebuseus; e eu os eliminarei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu mensageiro”. A palavra hebraica מַלְאָךְ pode referir-se a um mensageiro humano ou celestial; neste contexto, “anjo” se ajusta à orientação divina.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente “eu o eliminarei”, com um sufixo singular empregado coletivamente em referência aos povos mencionados.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da ordem e da promessa anteriores, preservando de modo natural o valor causal-explicativo.
- source_word: יֵלֵךְ
  choice: irá
  rationale: O imperfeito tem sentido futuro no contexto da promessa divina.
- source_word: מַלְאָכִי
  choice: o meu anjo
  rationale: מַלְאָךְ pode designar mensageiro humano ou celestial; neste contexto de orientação divina sobrenatural, “anjo” é a opção mais adequada, sem identificar a figura além do texto.
- source_word: לְפָנֶיךָ
  choice: à sua frente
  rationale: Expressa de forma corrente a ideia de preceder Israel e guiá-lo.
- source_word: וֶהֱבִיאֲךָ
  choice: e levará você
  rationale: O hifil de בוא significa fazer vir ou trazer. Em português, “levará você até” soa natural considerando o movimento rumo aos povos mencionados.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: os amorreus, os hititas, os perizeus, os cananeus, os heveus e os jebuseus
  rationale: Emprega as formas tradicionais e amplamente reconhecidas em português para os gentílicos coletivos hebraicos.
- source_word: וְהִכְחַדְתִּיו
  choice: e eu os eliminarei
  rationale: O hifil de כחד comunica fazer desaparecer ou exterminar. “Eliminarei” preserva a força do verbo com dignidade de registro; o pronome plural traduz naturalmente o sufixo singular coletivo.
theological_decisions:
- issue: Identidade e natureza de מַלְאָכִי
  choice: “o meu anjo”, sem identificação adicional
  alternative: “o meu mensageiro”; uma manifestação teofânica do SENHOR; o Filho antes da encarnação
  rationale: O versículo chama a figura apenas de anjo ou mensageiro de Deus. A tradução não deve decidir interpretações teofânicas ou cristológicas posteriores.
- issue: Número do objeto em וְהִכְחַדְתִּיו
  choice: 'plural coletivo: “os”'
  alternative: 'singular formal: “o”; “eu o eliminarei”'
  rationale: Embora o sufixo hebraico seja singular, ele retoma coletivamente a série de povos. O plural comunica o referente com clareza em português.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. O tratamento “você” torna explícito o singular hebraico dirigido a Israel como entidade coletiva. A ordem dos povos e a tensão lexical de מַלְאָךְ foram preservadas.
