base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: pt
  text: Pouco a pouco os expulsarei da sua presença,[a] até que você se torne fecundo e tome posse da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o expulsarei”; o singular provavelmente se refere coletivamente aos habitantes ou povos da terra.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “herdar a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: Pouco a pouco
  rationale: Preserva a repetição hebraica e expressa de modo natural a progressão gradual.
- source_word: אֲגָרְשֶׁנּוּ
  choice: os expulsarei
  rationale: O verbo גרשׁ significa expulsar ou fazer sair. Embora o sufixo hebraico seja masculino singular, ele retoma coletivamente os povos ou habitantes mencionados no contexto; o plural é mais natural e claro em português, com a forma hebraica registrada em nota.
- source_word: מִפָּנֶיךָ
  choice: da sua presença
  rationale: Representa o idioma hebraico ligado a face/presença sem produzir a expressão pouco natural 'de diante de você'.
- source_word: עַד אֲשֶׁר
  choice: até que
  rationale: Introduz naturalmente o ponto até o qual prossegue a expulsão gradual.
- source_word: תִּפְרֶה
  choice: você se torne fecundo
  rationale: O verbo פרה denota ser fecundo e multiplicar-se; a formulação conserva a imagem bíblica e, no contexto, aponta para o crescimento populacional de Israel.
- source_word: וְנָחַלְתָּ
  choice: e tome posse
  rationale: נחל pode significar herdar ou receber/tomar como possessão. Aqui 'tomar posse' comunica com clareza a ocupação da terra, enquanto a alternativa 'herdar' é preservada em nota.
- source_word: אֶת־הָאָרֶץ
  choice: da terra
  rationale: Refere-se à terra prometida no contexto; 'a terra' é a equivalência portuguesa convencional e adequada.
theological_decisions:
- issue: Sufixo de objeto coletivo singular na promessa de expulsão
  choice: Usar o plural natural 'os', com nota sobre o singular hebraico.
  alternative: “Eu o expulsarei”, preservando diretamente o masculino singular gramatical.
  rationale: O singular hebraico tem referente coletivo, os habitantes ou povos da terra. O plural evita sugerir em português um único indivíduo, sem ocultar a forma da fonte, que é indicada na nota.
- issue: Sentido de נחל em relação à terra
  choice: “tomar posse” no texto principal.
  alternative: “herdar a terra”.
  rationale: Ambos os sentidos pertencem ao campo semântico do verbo. O contexto favorece a aquisição e ocupação concreta, mas a linguagem de herança continua legítima e é apresentada em nota, sem eliminar a tensão conceitual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição 'Pouco a pouco' preserva a cadência da fonte; 'se torne fecundo' mantém a imagem bíblica, e as notas documentam o singular coletivo e a alternativa 'herdar'.
