base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: pt
  text: Você levará à casa de Yahweh, seu Deus, a primeira porção dos primeiros frutos da sua terra.[a] Você não ferverá um cabrito no leite de sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do seu solo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: o primeiro dos primeiros frutos
  rationale: Preserva a construção enfática do hebraico, na qual רֵאשִׁית designa a primeira porção dos בִּכּוּרִים, sem convertê-la interpretativamente em “o melhor”.
- source_word: אַדְמָתְךָ
  choice: da sua terra
  rationale: No contexto agrícola, “terra” comunica de modo natural o solo cultivado e sua produção; a nota registra a alternativa mais concreta “solo”.
- source_word: תָּבִיא
  choice: você levará
  rationale: O imperfeito hebraico tem força de instrução legal. O futuro em português mantém o caráter prescritivo com linguagem digna e corrente.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: à casa de Yahweh, seu Deus
  rationale: “Casa” preserva a referência ampla ao santuário, sem antecipar especificamente o templo posterior; “Yahweh” representa diretamente o nome divino.
- source_word: לֹא תְבַשֵּׁל
  choice: não cozinhe
  rationale: בשל pode indicar cozinhar ou ferver. “Cozinhar” é natural em português e não restringe indevidamente o método, enquanto a nota registra a alternativa mais específica.
- source_word: גְּדִי
  choice: um cabrito
  rationale: “Cabrito” é o termo português claro e corrente para o filhote de cabra normalmente designado por גְּדִי.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: no leite da própria mãe
  rationale: Reproduz com naturalidade a imagem literal e deixa claro que se trata da mãe do cabrito.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” o preserva de forma explícita, sem substituí-lo por um título.
- issue: Sentido da proibição de cozinhar o cabrito no leite materno
  choice: Manter a proibição literal sem explicar sua finalidade
  alternative: Parafrasear como proibição de rito cananeu, crueldade ou mistura alimentar
  rationale: O hebraico não declara a razão da proibição. A tradução não deve inserir uma explicação histórica, ritual ou ética que o próprio versículo deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo em destaque a primeira porção dos primeiros frutos. Os marcadores aparecem no texto em ordem alfabética e as notas preservam alternativas lexicais genuínas.
