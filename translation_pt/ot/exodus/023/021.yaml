base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: pt
  text: Estejam atentos diante dele e escutem a sua voz. Não se rebelem contra ele, pois ele não perdoará a transgressão de vocês, porque o meu nome está nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu nome está dentro dele”, “o meu nome está sobre ele” ou, mais interpretativamente, “ele leva o meu nome”. A expressão pode indicar autoridade divina delegada, mas o versículo não define explicitamente a natureza exata do mensageiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Tenham cuidado na presença dele
  rationale: O imperativo nifal de שׁמר adverte os israelitas a agir com vigilância. מִפָּנָיו significa literalmente “diante de sua face”; “na presença dele” preserva o sentido relacional e evita que “cuidado com ele” sugira que o mensageiro seja uma ameaça hostil.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: e escutem a sua voz
  rationale: A expressão frequentemente implica obedecer, mas esta formulação conserva a imagem hebraica da voz e permite que o contexto comunique a exigência de obediência.
- source_word: אַל תַּמֵּר בּוֹ
  choice: Não se rebelem contra ele
  rationale: מרה indica rebeldia ou desafio contra uma autoridade, sentido especialmente apropriado ao contexto da aliança.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: ele não perdoará a transgressão de vocês
  rationale: נשא, quando usado com pecado ou transgressão, pode expressar a remoção ou o perdão da culpa. “Perdoará” comunica naturalmente esse sentido, e o singular coletivo de פשע foi mantido.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: o meu nome está nele
  rationale: בקרבו significa “em seu interior/no meio dele”. “Está nele” reproduz a afirmação compacta do hebraico sem definir de que maneira o nome divino se relaciona com o mensageiro.
theological_decisions:
- issue: A natureza do mensageiro e o sentido de o nome divino estar nele
  choice: Manter “o meu nome está nele” sem definir a natureza exata do mensageiro.
  alternative: Traduzir interpretativamente como “ele leva o meu nome” ou identificar o mensageiro como uma manifestação direta de Deus.
  rationale: O versículo atribui ao mensageiro autoridade divina singular, mas não esclarece aqui se ele é um representante criado ou uma manifestação mais direta da presença de Deus. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas no plural (“tenham”, “escutem”, “vocês”) para tornar explícito o destinatário coletivo indicado pelo hebraico. A redação evita tanto arcaísmos quanto uma interpretação denominacional da identidade do mensageiro.
