base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: pt
  text: Se você vir o jumento de alguém que odeia você caído sob a carga e pensar em deixar de ajudá-lo[b], não deixe de se juntar a ele para ajudar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “juntar-se a ele [ao jumento] para ajudar”. O pronome hebraico pode referir-se ao dono ou ao animal.
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico normalmente significa “deixar” ou “abandonar”, mas, neste contexto, a construção se refere a deixar de prestar auxílio.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz uma condição casuística no contexto jurídico; “Se” preserva com naturalidade esse valor condicional.
- source_word: תִרְאֶה
  choice: você vir
  rationale: Traduz diretamente o verbo ראה (“ver”), sem acrescentar a ideia de encontro casual.
- source_word: חֲמוֹר
  choice: jumento
  rationale: Equivalente moderno e claro em português, adequado ao registro bíblico sem ser arcaico.
- source_word: שֹׂנַאֲךָ
  choice: alguém que odeia você
  rationale: Preserva o sentido participial literal (“aquele que odeia você”) sem ampliar a expressão para a categoria mais abrangente de “inimigo”.
- source_word: רֹבֵץ
  choice: caído
  rationale: No contexto de um animal sob uma carga, comunica de modo natural que ele está prostrado, sem especificar indevidamente a causa ou seu estado físico.
- source_word: תַּחַת מַשָּׂאוֹ
  choice: sob a sua carga
  rationale: Expressa a posição do animal debaixo do peso que transporta; o possessivo permanece formalmente ambíguo em português e é esclarecido na nota.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: e pensar em deixar de ajudá-lo
  rationale: A construção hebraica é difícil; esta formulação comunica a inclinação ou possibilidade de se omitir, evitando tratá-la como simples afirmação factual.
- source_word: עָזֹב תַּעֲזֹב
  choice: ajude-o sem falta
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a ordem. Neste contexto, עזב tem o sentido contextual de prestar auxílio.
- source_word: עִמּוֹ
  choice: junto com ele
  rationale: O sufixo masculino singular é entendido no texto principal como referente ao dono; a expressão indica cooperação com ele, enquanto a referência possível ao animal é preservada em nota.
theological_decisions:
- issue: Referente do pronome final עִמּוֹ
  choice: junto com ele (o dono que odeia você)
  alternative: junto com o animal / em favor dele
  rationale: O masculino singular pode referir-se gramaticalmente tanto ao dono quanto ao jumento. O texto principal adota o dono como referente por realçar a obrigação de cooperar até com quem odeia a pessoa, mas a alternativa genuína é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Você” evita a ambiguidade regional de formas verbais sem pronome; “sem falta” transmite a ênfase da construção hebraica sem soar excessivamente arcaico.
