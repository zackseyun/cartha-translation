  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: pt
  text: Mas, se você obedecer atentamente à voz dele[a] e fizer tudo o que eu disser[b], então serei inimigo dos seus inimigos e adversário dos seus adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se você de fato ouvir a voz dele”. O hebraico emprega o infinitivo absoluto com o verbo finito para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: O texto passa de “a voz dele” para “eu disser”, preservando no contexto a estreita ligação entre o mensageiro e o SENHOR.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste enfático com a advertência anterior; esta formulação é natural em português.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: obedecer atentamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; com 'voz', o verbo שׁמע implica ouvir de modo obediente.
- source_word: בְּקֹלוֹ
  choice: à voz dele
  rationale: Preserva a expressão pessoal e mantém o pronome ligado ao mensageiro mencionado no contexto.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: e fizer tudo o que eu disser
  rationale: Conserva a mudança do pronome de terceira pessoa para a fala divina em primeira pessoa, com expressão corrente em português.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: serei inimigo dos seus inimigos
  rationale: Mantém a relação lexical entre o verbo איב e o substantivo אֹיֵב, bem como o paralelismo do hebraico.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: e adversário dos seus adversários
  rationale: Preserva a relação cognata e distingue este par do par anterior, refletindo a variação lexical hebraica.
theological_decisions:
- issue: Mudança de referente entre 'a voz dele' e 'eu disser'
  choice: Preservar a mudança textual da voz do mensageiro para a fala do SENHOR em primeira pessoa.
  alternative: Harmonizar as duas expressões como referentes apenas ao mensageiro ou apenas à fala divina direta.
  rationale: O hebraico mantém uma ligação estreita entre a voz do mensageiro e a palavra do próprio SENHOR; a tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela 'inimigo dos seus inimigos e adversário dos seus adversários' preserva o jogo lexical e a solenidade do original sem soar arcaica.
