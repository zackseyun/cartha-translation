  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: pt
  text: Não se curve diante dos deuses deles, nem os sirva, nem imite suas práticas. Pelo contrário, derrube-os por completo e despedace totalmente suas colunas sagradas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também “pedras erguidas para culto” ou “monumentos de pedra”. O hebraico se refere a pedras ou colunas erigidas e associadas ao culto.
    reason: alternativa lexical e esclarecimento cultural
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: se curve diante de
  rationale: Preserva o gesto concreto de inclinar-se ou prostrar-se em reverência, sem reduzi-lo desde o início ao termo mais amplo “adorar”.
- source_word: לֵאלֹהֵיהֶם
  choice: diante dos deuses deles
  rationale: A construção é natural em português após “curvar-se”; “deuses” em minúscula identifica as divindades das nações.
- source_word: תָעָבְדֵם
  choice: os sirva
  rationale: Mantém o sentido direto de עבד e sua abrangência entre serviço, lealdade e culto religioso.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: imite suas práticas
  rationale: Expressa em português corrente a ideia de agir segundo os atos deles; no contexto, trata-se especialmente de práticas religiosas.
- source_word: כִּי
  choice: Pelo contrário
  rationale: Neste contexto, introduz a ação oposta às proibições anteriores e comunica melhor a força adversativa.
- source_word: הָרֵס תְּהָרְסֵם
  choice: derrube-os por completo
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ordem; “por completo” comunica essa ênfase.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: despedace totalmente
  rationale: Reproduz a intensificação hebraica e emprega um verbo apropriado para monumentos de pedra.
- source_word: מַצֵּבֹתֵיהֶם
  choice: suas colunas sagradas
  rationale: מַצֵּבָה designa uma pedra ou coluna erguida com função cultual; “sagradas” explicita de modo conciso o sentido contextual.
theological_decisions:
- issue: Natureza dos atos proibidos diante das divindades estrangeiras
  choice: Manter separados o gesto de reverência (“se curve”) e o serviço cultual (“os sirva”).
  alternative: Reunir ambos sob linguagem genérica de adoração.
  rationale: Os dois verbos hebraicos são distintos e, juntos, proíbem tanto a homenagem exterior quanto o serviço religioso contínuo.
- issue: Referente do pronome nas ordens de destruição
  choice: Preservar o pronome masculino plural em “derrube-os”, seguido pela identificação explícita das colunas cultuais.
  alternative: Explicitar “derrube os ídolos/objetos de culto”.
  rationale: O hebraico deixa o referente do sufixo ligado ao plural anterior, embora o contexto e a cláusula seguinte apontem para as representações e estruturas cultuais. A tradução conserva essa tensão sem afirmar que divindades possam ser literalmente destruídas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição intensificadora do hebraico foi representada por “por completo” e “totalmente”; os dois verbos relativos à reverência e ao serviço foram mantidos distintos.
