  source_fidelity: 'A tradução preserva adequadamente as três proibições distintas: gesto de reverência, serviço cultual e imitação das ações/práticas. «Pelo contrário» comunica bem o valor contrastivo de כִּי neste contexto. As duas construções hebraicas de infinitivo absoluto mais verbo finito são representadas por intensificadores naturais («por completo», «totalmente»). «Derrube-os» mantém, de modo justificável, a referência pronominal não explicitada do hebraico, enquanto a oração seguinte identifica expressamente as colunas/monumentos cultuais.'
  naturalness: O texto é claro, fluente e de registro bíblico moderno, com boa legibilidade brasileira e aceitável em português internacional. «Não se curve diante» e «nem os sirva» soam naturais sem nivelar os dois verbos em uma única noção de adoração.
