base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: pt
  text: Estabelecerei as suas fronteiras desde o mar Vermelho[a] até o mar dos filisteus, e desde o deserto até o Rio[b], pois entregarei nas mãos de vocês os habitantes da terra, e vocês os expulsarão da frente de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mar de Juncos”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: Estabelecerei
  rationale: O perfeito com וְ neste contexto de promessa divina tem sentido futuro. “Estabelecerei” é natural em português para a fixação de fronteiras.
- source_word: גְּבֻלְךָ
  choice: as suas fronteiras
  rationale: גְּבוּל indica limite ou fronteira territorial. O plural idiomático em português expressa naturalmente a extensão delimitada pelos pontos geográficos seguintes.
- source_word: מִיַּם סוּף
  choice: desde o mar Vermelho
  rationale: “Mar Vermelho” é a designação tradicional e reconhecível de יַם־סוּף; a tradução lexical mais literal é preservada em nota.
- source_word: יָם פְּלִשְׁתִּים
  choice: o mar dos filisteus
  rationale: Mantém de forma transparente a designação étnico-geográfica hebraica, sem substituí-la interpretativamente por “mar Mediterrâneo”.
- source_word: וּמִמִּדְבָּר
  choice: e desde o deserto
  rationale: מִדְבָּר pode designar deserto ou região erma; “deserto” é claro, corrente e adequado ao contexto geográfico.
- source_word: הַנָּהָר
  choice: o Rio
  rationale: Preserva a forma definida e convencional do hebraico. A identificação provável com o Eufrates é explicitada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão ou fundamento da promessa precedente de modo conciso e natural.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: entregarei nas mãos de vocês
  rationale: Reproduz a imagem concreta da expressão hebraica נתן ביד e comunica domínio ou poder concedido.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: os habitantes da terra
  rationale: Representa diretamente o particípio substantivado, isto é, os que habitam naquela terra.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: e vocês os expulsarão
  rationale: גָּרַשׁ significa expulsar ou fazer sair à força. O futuro corresponde à sequência da promessa.
- source_word: מִפָּנֶיךָ
  choice: da sua presença
  rationale: Expressa de maneira natural o idioma hebraico literalmente relacionado ao que está “diante da face” de alguém.
theological_decisions:
- issue: Designação geográfica יַם סוּף
  choice: mar Vermelho
  alternative: mar de Juncos
  rationale: A decisão é lexical e geográfica, não doutrinária. A forma tradicional permanece no texto por sua reconhecibilidade, e a alternativa mais literal aparece em nota.
- issue: Identificação de הַנָּהָר
  choice: o Rio, com identificação em nota
  alternative: o rio Eufrates diretamente no texto
  rationale: O texto principal conserva a expressão definida, mas não nomeada, do hebraico; a nota fornece ao leitor a identificação geográfica convencional sem apagar a forma original.
- issue: Alternância entre singular e plural na referência ao destinatário
  choice: vocês
  alternative: você
  rationale: O hebraico alterna entre sufixos singulares em “suas fronteiras” e “sua presença” e o plural em “nas mãos de vocês”. Em português, “vocês” torna explícita a referência coletiva a Israel, sem exigir uma distinção artificial entre a nação no singular e seus integrantes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se as designações geográficas do hebraico e sua imagem idiomática principal, enquanto notas breves esclarecem alternativas lexicais e referentes convencionais.
