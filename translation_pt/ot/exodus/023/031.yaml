  terminology: «Mar Vermelho», «mar dos filisteus», «deserto», «o Rio» e «habitantes da terra» são escolhas adequadas. As notas preservam apropriadamente a alternativa «mar de Juncos» e identificam o referente convencional de «o Rio».
