base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: pt
  text: Enviarei vespões à sua frente[a], e eles expulsarão de diante de você os heveus, os cananeus e os hititas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, uma imagem figurada do pânico ou de algum outro meio de pressão divina enviado à frente de Israel; a palavra hebraica normalmente significa “vespão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Enviarei
  rationale: O perfeito qal na primeira pessoa do singular, ligado pelo waw e situado numa sequência de promessas, tem sentido futuro. A forma sintética é natural e preserva a agência divina.
- source_word: הַצִּרְעָה
  choice: vespões
  rationale: O substantivo designa normalmente um vespão ou inseto que ferroa. O singular hebraico com artigo pode ter valor coletivo; o plural português comunica naturalmente esse sentido sem transformar a imagem em uma interpretação abstrata.
- source_word: לְפָנֶיךָ
  choice: à sua frente
  rationale: A expressão significa literalmente 'diante do seu rosto' e aqui indica ação que precede o avanço de Israel. 'À sua frente' conserva de modo claro a dimensão espacial.
- source_word: וְגֵרְשָׁה
  choice: e eles expulsarão
  rationale: גרשׁ significa 'expulsar, pôr para fora'. Embora o verbo hebraico esteja no feminino singular, concordando com o substantivo coletivo, em português a concordância plural acompanha naturalmente 'vespões'.
- source_word: הַחִוִּי
  choice: os heveus
  rationale: Forma tradicional e amplamente reconhecida em português para o etnônimo hebraico.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Forma portuguesa corrente do etnônimo.
- source_word: הַחִתִּי
  choice: os hititas
  rationale: Forma portuguesa corrente e moderna do etnônimo.
- source_word: מִלְּפָנֶיךָ
  choice: de diante de você
  rationale: Preserva o paralelismo com לְפָנֶיךָ e a imagem espacial de remover esses povos do caminho ou da presença de Israel.
theological_decisions:
- issue: Se הַצִּרְעָה deve ser traduzido literalmente ou interpretado como metáfora
  choice: A imagem concreta de vespões é mantida no texto principal.
  alternative: Traduzir como 'terror', 'pânico' ou alguma outra forma de pressão divina.
  rationale: O sentido lexical normal é um inseto que ferroa. Como o texto não exige que a imagem seja entendida figuradamente, a tradução não resolve essa questão no corpo do versículo; a possibilidade figurada é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. O tratamento por 'você' torna explícito o singular hebraico e evita arcaísmo. 'Vespões' expressa o provável valor coletivo do singular hebraico; a nota preserva a possível leitura figurada.
