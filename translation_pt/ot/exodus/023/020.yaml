  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: pt
  text: Eis que envio um anjo[a] adiante de você, para guardá-lo no caminho e levá-lo ao lugar que preparei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um mensageiro”. A palavra hebraica מַלְאָךְ pode indicar um mensageiro humano ou celestial; neste contexto, “anjo” parece corresponder melhor ao sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força dêitica e solene da partícula hebraica como chamada de atenção, em registro bíblico ainda compreensível.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: envio
  rationale: A construção com pronome independente e particípio apresenta a ação divina como atual ou iminente. Em português, o presente simples é mais natural e mantém essa força sem exagerar a ênfase do pronome.
- source_word: מַלְאָךְ
  choice: um anjo
  rationale: O termo pode designar mensageiro humano ou celestial; neste contexto, as funções de proteção e condução atribuídas ao enviado de Deus favorecem 'anjo'. A alternativa lexical é preservada em nota.
- source_word: לְפָנֶיךָ
  choice: adiante de você
  rationale: Expressa naturalmente a ideia idiomática de ir à frente, sem sugerir mera posição estática.
- source_word: לִשְׁמָרְךָ
  choice: para guardá-lo
  rationale: Reproduz o sentido protetor de שׁמר no contexto da jornada.
- source_word: בַּדָּרֶךְ
  choice: no caminho
  rationale: Pode indicar tanto o percurso quanto a jornada e corresponde de forma clara e concisa à expressão hebraica.
- source_word: וְלַהֲבִיאֲךָ
  choice: e levá-lo
  rationale: O hiphil de בוא significa fazer chegar ou levar. 'Levá-lo' é natural em português quando o destino é mencionado e preserva a finalidade da ação.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: Equivalente direto, claro e idiomático de מָקוֹם.
- source_word: אֲשֶׁר הֲכִנֹתִי
  choice: que preparei
  rationale: Traduz o hiphil de כון como preparar ou deixar pronto, adequado ao destino determinado por Deus; o pretérito perfeito português comunica suficientemente a ação concluída.
theological_decisions:
- issue: Identidade de מַלְאָךְ neste contexto
  choice: Traduzir lexicalmente como 'um anjo', sem identificar no texto principal se é um ser angelical criado ou uma manifestação especial do SENHOR.
  alternative: Traduzir como 'um mensageiro' ou identificá-lo explicitamente como o Anjo do SENHOR.
  rationale: O versículo chama a figura apenas de מַלְאָךְ. O contexto posterior suscita questões sobre seu status, por isso a tradução não resolve essa tensão teológica além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Eis que' mantém a solenidade da fala divina; 'você' torna explícito o singular do hebraico. A colocação pronominal em 'guardá-lo' e 'levá-lo' conserva um registro escrito natural.
