base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: pt
  text: Mas, no sétimo ano, deixe-a descansar e deixe-a sem cultivo[a], para que os pobres do seu povo possam comer; e o que eles deixarem, os animais selvagens do campo poderão comer[b]. Faça o mesmo com a sua vinha e com o seu olival.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “libere-a e abandone-a”. Os verbos hebraicos enfatizam a interrupção do cultivo normal e o fato de deixar a terra sem cultivo no sétimo ano.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o animal do campo”; a expressão tem sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: Mas, no sétimo ano
  rationale: A conjunção introduz contraste com os seis anos do versículo anterior; a formulação temporal é natural em português.
- source_word: תִּשְׁמְטֶנָּה
  choice: deixe-a descansar
  rationale: O verbo שׁמט indica aqui liberar a terra do cultivo regular. O pronome feminino retoma a terra mencionada no versículo anterior.
- source_word: וּנְטַשְׁתָּהּ
  choice: e sem cultivo
  rationale: Expressa, neste contexto agrícola, que a terra deve ser deixada sem o uso habitual, evitando sugerir abandono permanente.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: os pobres do seu povo
  rationale: אֶבְיוֹן designa quem é pobre ou necessitado; a escolha preserva tanto a referência social quanto a relação possessiva.
- source_word: וְיִתְרָם
  choice: o que eles deixarem
  rationale: O substantivo com sufixo plural refere-se ao que restar depois de os pobres comerem.
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: os animais selvagens do campo comerão
  rationale: A expressão hebraica singular tem sentido coletivo e designa a fauna não domesticada; o plural é idiomático em português.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Faça o mesmo
  rationale: Reproduz com clareza a força diretiva da prescrição e aplica a mesma regra aos cultivos seguintes.
- source_word: לְכַרְמְךָ
  choice: com a sua vinha
  rationale: Vinha é equivalente corrente de כֶּרֶם e se encaixa naturalmente depois de 'Faça o mesmo'.
- source_word: לְזֵיתֶךָ
  choice: com o seu olival
  rationale: O singular coletivo זַיִת refere-se aqui à plantação de oliveiras; 'olival' mantém o paralelismo agrícola com 'vinha'.
