source:
  edition: WLC
  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: pt
  text: Se você encontrar o boi do seu inimigo ou o jumento dele andando perdido[a], não deixe de devolvê-lo a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vagando”.'
    reason: Alternativa lexical para תֹּעֶה, que pode descrever o animal andando sem rumo ou afastando-se do caminho devido.
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz a condição de uma lei casuística. “Se” reproduz com naturalidade a prótase, embora “quando” também seja possível.
- source_word: תִפְגַּע
  choice: você encontrar
  rationale: No contexto, פגע indica deparar-se ou encontrar casualmente; “encontrar” é claro e corrente em português.
- source_word: שׁוֹר
  choice: boi
  rationale: Designa um bovino no contexto agrário; “boi” é a equivalência tradicional, específica e compreensível.
- source_word: אֹיִבְךָ
  choice: do seu inimigo
  rationale: Preserva diretamente אֹיֵב, sem suavizar a tensão ética do mandamento.
- source_word: חֲמֹרוֹ
  choice: o jumento dele
  rationale: חֲמוֹר é o termo comum para esse animal. “Jumento” é claro e evita a possível ambiguidade referencial de repetir apenas o possessivo “seu”.
- source_word: תֹּעֶה
  choice: andando perdido
  rationale: O particípio descreve o animal que se desviou e está vagando. A expressão mantém o aspecto em curso sem afirmar que esteja irremediavelmente perdido.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: não deixe de devolvê-lo
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a obrigação. “Não deixe de” expressa em português natural o mandamento enfático.
- source_word: לוֹ
  choice: a ele
  rationale: Mantém a referência pronominal direta ao inimigo, proprietário do animal, sem substituir o pronome pela explicitação interpretativa “ao dono”.
theological_decisions:
- issue: Força ética em relação a um inimigo
  choice: Mantém “seu inimigo” e ordena a restituição do animal dele.
  alternative: Substituir por “próximo” ou “quem odeia você”.
  rationale: O hebraico diz explicitamente “seu inimigo”. A tradução conserva a tensão moral de agir com justiça e misericórdia prática para com um adversário.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Jumento dele” evita a ambiguidade que “seu jumento” pode produzir no português do Brasil. A formulação enfática “não deixe de devolvê-lo” comunica de modo idiomático a intensidade da construção hebraica.
