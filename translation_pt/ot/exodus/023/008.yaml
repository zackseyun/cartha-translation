id: EXO.23.8
reference: Exodus 23:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: pt
  text: Não aceite suborno, pois o suborno cega os que enxergam com clareza[a] e distorce as palavras dos justos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que discernem”. O hebraico conserva a imagem da visão, ao mesmo tempo que implica bom discernimento.
    reason: lexical_alternative
  - marker: b
    text: “As palavras dos justos” também pode ser entendido, em sentido jurídico, como “as declarações” ou “a causa” dos que têm razão.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: suborno
  rationale: Designa um pagamento corruptor destinado a influenciar uma decisão; “suborno” é o termo jurídico e moral mais claro em português moderno.
- source_word: לֹא תִקָּח
  choice: não aceite
  rationale: O imperfeito qal de segunda pessoa masculina singular funciona como proibição. “Não aceite” expressa naturalmente a proibição de receber suborno.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição de modo conciso e adequado ao discurso legal.
- source_word: יְעַוֵּר
  choice: cega
  rationale: Preserva tanto a ideia causativa do piel quanto a imagem visual aplicada à corrupção do discernimento.
- source_word: פִּקְחִים
  choice: os que enxergam com clareza
  rationale: Conserva a metáfora hebraica da visão e, no contexto, sugere capacidade de percepção e julgamento sem substituir a imagem por uma interpretação abstrata.
- source_word: וִיסַלֵּף
  choice: distorce
  rationale: Expressa a ideia de entortar ou perverter e soa natural no contexto de palavras, declarações ou causas judiciais.
- source_word: דִּבְרֵי
  choice: as palavras dos
  rationale: Mantém a amplitude de דָּבָר, que pode indicar palavras, declarações ou questões; o contexto permite a ressonância jurídica sem explicitá-la indevidamente.
- source_word: צַדִּיקִים
  choice: justos
  rationale: Preserva a amplitude entre pessoas moralmente justas e pessoas que têm razão numa causa judicial.
theological_decisions:
- issue: Sentido de צַדִּיקִים no contexto judicial
  choice: justos
  alternative: os que têm razão
  rationale: “Justos” mantém aberta a dimensão moral e a forense do hebraico, evitando restringir o texto a apenas uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva a concisão da lei, a metáfora visual hebraica e a ambiguidade moral-jurídica de “justos”.
