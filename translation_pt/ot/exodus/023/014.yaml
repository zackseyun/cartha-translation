  text: Três vezes por ano você celebrará uma festa para mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “três pés”. Esse idiomatismo hebraico se refere às três ocasiões anuais de festas de peregrinação.
