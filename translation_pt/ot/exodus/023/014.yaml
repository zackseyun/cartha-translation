lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: Três vezes
  rationale: A expressão hebraica, literalmente ligada a “três pés”, funciona aqui como um idiomatismo para três ocasiões festivas anuais, associadas à peregrinação. “Três vezes” comunica naturalmente a frequência em português.
- source_word: תָּחֹג
  choice: você celebrará uma festa
  rationale: O verbo חגג indica celebrar ou observar uma festa. A formulação preserva tanto o valor festivo e cultual quanto o caráter prescritivo da forma verbal.
- source_word: לִי
  choice: para mim
  rationale: A preposição indica que a celebração é dedicada a Deus. “Para mim” é natural em português e conserva o caráter pessoal da fala divina.
- source_word: בַּשָּׁנָה
  choice: por ano
  rationale: Embora literalmente seja “no ano”, a expressão idiomática portuguesa “três vezes por ano” transmite com clareza a recorrência anual sem alterar o sentido.
