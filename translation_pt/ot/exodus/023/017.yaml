base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: pt
  text: Três vezes por ano, todo homem entre vocês comparecerá diante do Senhor Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico combina o título “Senhor” com o nome divino “Yahweh”.
    reason: Esclarece a combinação incomum de um título divino com o nome próprio de Deus.
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Três vezes por ano
  rationale: Expressa de modo natural em português a frequência dentro do ciclo anual, sem alterar o sentido do hebraico.
- source_word: יֵרָאֶה
  choice: comparecerá
  rationale: O nifal de ראה é usado aqui idiomaticamente para apresentar-se ou aparecer diante de uma autoridade; “comparecerá” transmite esse sentido com clareza e dignidade.
- source_word: כָּל זְכוּרְךָ
  choice: todo homem entre vocês
  rationale: Mantém a referência específica aos indivíduos do sexo masculino e traduz o singular distributivo de forma natural.
- source_word: אֶל פְּנֵי
  choice: diante de
  rationale: Equivalente português corrente da expressão hebraica que indica estar na presença de alguém.
- source_word: הָאָדֹן
  choice: o Senhor
  rationale: Preserva אָדוֹן como título divino reconhecível e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por outro título, distinguindo-o de הָאָדֹן.
theological_decisions:
- issue: Tradução da combinação הָאָדֹן יְהוָה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O hebraico combina um título, הָאָדֹן, com o nome divino, יְהוָה. “O Senhor Yahweh” preserva essa distinção e evita transformar o nome próprio em título.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Comparecerá” conserva o tom normativo do contexto sem recorrer a uma formulação excessivamente literal.
