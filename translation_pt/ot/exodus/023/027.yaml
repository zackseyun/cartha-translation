  naturalness: «Enviarei o meu terror adiante de você» e «Farei todos os seus inimigos virarem as costas para você» são claros e adequados ao registro. «Farei entrar em pânico» exprime de modo mais idiomático o efeito causativo de וְהַמֹּתִי do que «lançarei em confusão».
  terminology: «Terror», «pavor» e «medo» são alternativas adequadas para אֵימָה. A nota sobre o idiomatismo de עורף deve conservar a formulação literal aproximada sem sugerir que «como» seja uma palavra expressa no hebraico.
