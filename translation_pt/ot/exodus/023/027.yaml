base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: pt
  text: Enviarei o meu terror adiante de você[a] e farei entrar em pânico[b] todo o povo em cujo meio você entrar. Farei todos os seus inimigos virarem as costas para você.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu pavor” ou “o medo que vem de mim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “lançarei em confusão”, “porei em tumulto” ou “causarei tumulto”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “darei todos os seus inimigos a você [como] costas/nuca”. Expressão hebraica que indica que eles darão as costas e fugirão.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵימָתִי
  choice: o meu terror
  rationale: אֵימָה expressa terror, pavor ou medo intenso. “O meu terror” mantém o possessivo e apresenta esse terror como algo enviado por Deus, sem enfraquecer a força do termo.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: Enviarei ... adiante de você
  rationale: A construção שׁלח com לִפְנֵי indica enviar algo à frente de alguém. “Adiante de você” é natural em português e conserva a ideia direcional.
- source_word: וְהַמֹּתִי
  choice: lançarei em confusão
  rationale: O verbo המם descreve causar confusão, pânico ou tumulto, especialmente em contexto de combate. A formulação conserva a ação causativa sem antecipar explicitamente a derrota militar.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: O hebraico emprega o substantivo singular coletivo עָם. “Todo o povo” preserva esse número e funciona naturalmente com a oração relativa seguinte.
- source_word: אֲשֶׁר תָּבֹא בָהֶם
  choice: em cujo meio você entrar
  rationale: A preposição ב com o pronome plural comunica entrada entre eles ou no meio deles. A tradução preserva essa nuance sem importar o sentido mais adversativo de “contra o qual”.
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: Farei todos os seus inimigos virarem as costas para você
  rationale: A expressão idiomática descreve inimigos dando as costas em retirada. A tradução mantém a imagem hebraica e continua inteligível em português atual.
theological_decisions:
- issue: Ação divina na confusão e na derrota dos inimigos
  choice: 'Manter Deus como agente direto: “Enviarei”, “lançarei” e “Farei”'
  alternative: Empregar construções indiretas que atenuem a causalidade divina
  rationale: Os verbos hebraicos estão na primeira pessoa e atribuem diretamente a Deus o terror, a confusão e a retirada dos inimigos. A tradução conserva essa afirmação sem suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” mantém clareza contemporânea. A redação preserva a ação divina direta, o singular coletivo de “povo” e a imagem concreta dos inimigos virando as costas.
