  source_fidelity: 'A cláusula principal transmite adequadamente a proibição jurídica: תַטֶּה é bem representado por “distorça”, מִשְׁפָּט por “direito”, e בְּרִיבוֹ por “em sua causa”. Contudo, “que está com você” não é o sentido do sufixo -ךָ em אֶבְיֹנְךָ. O hebraico diz literalmente “teu pobre”/“o pobre ligado a ti”, expressão idiomática que designa a pessoa pobre em questão; não afirma que ela esteja fisicamente com o destinatário. Em português, é preferível não introduzir essa relação espacial/comunitária específica.'
  naturalness: “Não distorça o direito do pobre em sua causa” é conciso, claro e tem registro jurídico moderno. “Sua causa” retoma naturalmente o pobre e preserva o enquadramento forense de רִיב.
  terminology: “Direito” é uma boa equivalência contextual para מִשְׁפָּט, e “causa” é apropriado para רִיב em contexto judicial. “Pobre” conserva a referência singular e genérica do hebraico sem impor uma formulação possessiva artificial em português.
