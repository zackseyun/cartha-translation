  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: pt
  text: Não distorça o direito do pobre em sua causa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não negue justiça ao pobre em seu processo.”'
    reason: Alternativa lexical que explicita o efeito jurídico de distorcer o direito e verte רִיב como “processo”.
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Negação que introduz uma proibição; o imperativo negativo é natural em português jurídico moderno.
- source_word: תַטֶּה
  choice: distorça
  rationale: O hifil de נטה tem aqui sentido judicial de desviar, torcer ou perverter; “distorcer” preserva a imagem e comunica corrupção do juízo.
- source_word: מִשְׁפַּט
  choice: o direito
  rationale: Neste contexto, designa a justiça ou decisão judicial devida à pessoa. “O direito” expressa de modo conciso aquilo que não deve ser torcido.
- source_word: אֶבְיֹנְךָ
  choice: do pobre que está com você
  rationale: אֶבְיוֹן é uma pessoa pobre ou necessitada. O sufixo de segunda pessoa é mantido sem sugerir posse sobre a pessoa; “que está com você” comunica sua relação com a comunidade ou jurisdição do destinatário.
- source_word: בְּרִיבוֹ
  choice: em sua causa
  rationale: רִיב pode indicar disputa, contenda ou processo judicial; “causa” preserva o foco forense e o sufixo pronominal.
theological_decisions:
- issue: Se a proibição trata especificamente de parcialidade judicial contra o pobre
  choice: A tradução proíbe distorcer o direito do pobre no contexto de sua causa judicial.
  alternative: Não negue justiça ao pobre em seu processo.
  rationale: A sintaxe faz de מִשְׁפַּט o objeto do verbo e situa o pobre em sua רִיב. Assim, mantém-se o foco na justiça imparcial em tribunal, sem transformar o texto apenas numa máxima social geral.
translation_notes:
  register: Português moderno, digno e acessível, com concisão própria de legislação. A expressão “pobre que está com você” retém o sufixo hebraico sem a formulação pouco natural e potencialmente possessiva “seu pobre”.
