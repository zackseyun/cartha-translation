base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: pt
  text: Em tudo o que lhes tenho dito, estejam atentos. Não mencionem[a] o nome de outros deuses, e que ele não seja ouvido em seus lábios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “não invoquem”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre a tua boca”; o texto passa do plural, “vocês”, para o singular, “tua”, provavelmente em sentido distributivo.'
    reason: textual_clarification
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: com tudo o que eu lhes disse
  rationale: A construção com בְּכֹל delimita o âmbito da exortação e remete às instruções anteriores. A formulação é direta e natural em português.
- source_word: תִּשָּׁמֵרוּ
  choice: Tenham cuidado
  rationale: 'O nifal de שׁמר tem aqui sentido exortativo e reflexivo: estar atento, acautelar-se. A escolha evita acrescentar um objeto como “cumprir”, que não aparece explicitamente no hebraico.'
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta da expressão, sem ampliar o versículo com uma afirmação sobre a natureza ou a existência dessas divindades.
- source_word: לֹא תַזְכִּירוּ
  choice: Não mencionem
  rationale: O hifil de זכר pode significar fazer lembrar, mencionar ou invocar. “Mencionar” preserva o sentido mais amplo, enquanto a nota registra a possibilidade contextual mais específica.
- source_word: לֹא יִשָּׁמַע
  choice: nem ele seja ouvido
  rationale: O nifal expressa que o nome não deve ser ouvido. A coordenação com “nem” mantém a força proibitiva da segunda oração.
- source_word: עַל פִּיךָ
  choice: nos lábios de nenhum de vocês
  rationale: A expressão é literalmente “sobre a tua boca”. “Nos lábios” conserva a imagem de fala em português natural; “de nenhum de vocês” procura refletir a passagem do plural anterior para o singular distributivo no sufixo hebraico.
theological_decisions:
- issue: Alcance da proibição relativa ao nome de outros deuses
  choice: Manter a proibição ampla de mencionar o nome, registrando em nota a possibilidade de “invocar”.
  alternative: Traduzir diretamente como “não invoquem o nome de outros deuses”.
  rationale: O verbo permite uma referência mais específica à invocação religiosa, mas o texto não determina de modo inequívoco se proíbe toda menção, a invocação cultual ou o reconhecimento pactual. A tradução não resolve essa tensão além do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. O plural “vocês” torna explícito o destinatário coletivo; a expressão “de nenhum de vocês” preserva, de modo inteligível, a mudança final para o singular distributivo.
