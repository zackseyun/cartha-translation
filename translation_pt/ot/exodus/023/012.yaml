  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: pt
  text: Durante seis dias você fará o seu trabalho, mas, no sétimo dia, cessará[a], para que o seu boi e o seu jumento descansem, e o filho da sua serva e o estrangeiro residente[b] recuperem as forças[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descansará”. O sentido fundamental do verbo hebraico é “cessar, parar”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o estrangeiro que vivia entre os israelitas sob sua ordem social e jurídica.
    reason: cultural_note
  - marker: c
    text: Literalmente, “recobrem o fôlego”. A expressão hebraica indica ser revigorado depois da interrupção do trabalho.
    reason: lexical_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Durante seis dias
  rationale: A expressão funciona como acusativo de duração. “Durante seis dias” é natural em português e preserva o período indicado.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: você fará o seu trabalho
  rationale: A forma verbal, em contexto jurídico, expressa instrução, e o substantivo abrange o trabalho ou as atividades da pessoa sem se limitar ao labor manual.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mas, no sétimo dia
  rationale: Embora a conjunção possa ser vertida por “e”, aqui ela introduz contraste entre os seis dias de trabalho e o sétimo dia.
- source_word: תִּשְׁבֹּת
  choice: cessará
  rationale: O verbo שׁבת tem como sentido fundamental parar ou cessar. “Cessará” mantém a ênfase na interrupção do trabalho, sem reduzir o termo à ideia de relaxamento.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade humanitária da cessação do trabalho.
- source_word: יָנוּחַ
  choice: descansem
  rationale: O verbo נוח indica repouso. O plural em português concorda naturalmente com os dois animais mencionados, embora o hebraico empregue o singular.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: o seu boi e o seu jumento
  rationale: Os termos designam animais de trabalho comuns no contexto agrário. “Jumento” é uma designação corrente e digna em português.
- source_word: וְיִנָּפֵשׁ
  choice: recuperem as forças
  rationale: O nifal de נפשׁ comunica a ideia de recobrar o fôlego ou ser revigorado. A formulação escolhida expressa esse sentido de modo claro e natural.
- source_word: בֶּן אֲמָתְךָ
  choice: o filho da sua serva
  rationale: Preserva a construção literal e a relação social indicada no hebraico, sem especificar além do texto se se trata de servidão doméstica ou escravidão.
- source_word: הַגֵּר
  choice: o estrangeiro residente
  rationale: גר designa um estrangeiro que vive de modo estabelecido entre Israel e está abrangido por sua ordem social e jurídica. A expressão evita a vagueza de “estranho” e a ideia de mera passagem.
theological_decisions:
- issue: Sentido de שׁבת na legislação do sétimo dia
  choice: cessará
  alternative: descansará
  rationale: A escolha conserva o sentido básico de interrupção da atividade; o descanso resultante é explicitado na oração de finalidade que vem em seguida.
- issue: Identidade social do גֵּר
  choice: estrangeiro residente
  alternative: forasteiro
  rationale: A expressão representa a categoria do não israelita que residia entre o povo, sem transformá-la em uma referência genérica a qualquer desconhecido ou viajante.
- issue: Condição do filho da אָמָה
  choice: filho da sua serva
  alternative: filho da sua escrava
  rationale: אָמָה pode designar uma serva ou mulher escravizada. Como o versículo não esclarece mais precisamente sua condição, a tradução mantém a formulação tradicional mais ampla e registra a ambiguidade em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Emprega-se “você” para representar o destinatário masculino singular do hebraico sem recorrer ao registro mais regional de “tu”. A sintaxe mantém o contraste legal e a finalidade humanitária do mandamento.
