  text: לֹֽא תִכְרֹ֥ת לָ/הֶ֛ם וְ/לֵ/אלֹֽהֵי/הֶ֖ם בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: pt
  text: Não faça aliança com eles nem com os seus deuses.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “corte uma aliança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “e com os seus deuses”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תִכְרֹת
  choice: Não faça
  rationale: A proibição hebraica com o verbo כרת é expressa de modo natural e direto em português. Com בְּרִית, כרת forma o idioma de estabelecer ou fazer uma aliança.
- source_word: לָהֶם
  choice: com eles
  rationale: Neste contexto de aliança, a preposição ל indica a parte com quem se estabelece a aliança.
- source_word: וְלֵאלֹהֵיהֶם
  choice: nem com os seus deuses
  rationale: Embora ו seja normalmente aditivo, numa proibição com dois objetos o português idiomático usa “nem” para deixar claro que ambos estão excluídos.
- source_word: בְּרִית
  choice: aliança
  rationale: “Aliança” é a tradução corrente de ברית e preserva as dimensões política, relacional e religiosa do termo.
theological_decisions:
- issue: Tradução do idioma כרת ברית
  choice: faça aliança
  alternative: corte uma aliança
  rationale: O hebraico diz literalmente “cortar uma aliança”, mas “fazer aliança” comunica em português moderno o sentido do idioma sem obscurecer a força jurídica e religiosa da proibição.
- issue: Valor da conjunção ו antes de “seus deuses”
  choice: nem com os seus deuses
  alternative: e com os seus deuses
  rationale: “Nem” reproduz naturalmente em português a abrangência distributiva da proibição. A nota conserva a forma mais literal da conjunção hebraica.
translation_notes:
  register: Português moderno, claro e digno, com imperativo negativo natural. O artigo em “os seus deuses” favorece a fluência e a legibilidade ampla, inclusive no Brasil. As notas preservam tanto o idioma hebraico literal quanto a alternativa formal para a conjunção.
