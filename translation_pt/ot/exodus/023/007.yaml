  text: מִ/דְּבַר שֶׁ֖קֶר תִּרְחָ֑ק וְ/נָקִ֤י וְ/צַדִּיק֙ אַֽל תַּהֲרֹ֔ג כִּ֥י לֹא אַצְדִּ֖יק רָשָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: pt
  text: Mantenha-se longe de questão falsa[a] e não mate o inocente nem o justo, pois não declararei justo o culpado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de uma acusação falsa” ou “de uma mentira”. O hebraico também pode significar “palavra”, “assunto” ou “caso” e, neste contexto, pode incluir falso testemunho ou um processo fraudulento.
    reason: lexical_alternative
  - marker: b
    text: Ou “pois não absolverei o culpado”. O verbo hebraico é forense e pode significar “declarar justo”, “justificar” ou “absolver”; “perverso” é outra possível tradução para “culpado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/דְּבַר שֶׁקֶר
  choice: de toda questão falsa
  rationale: דָּבָר é amplo e pode indicar palavra, questão, assunto ou caso. No contexto judicial, “questão falsa” preserva essa amplitude sem restringir o sentido a uma acusação formal; “toda” torna natural em português a expressão de afastamento.
- source_word: תִּרְחָק
  choice: Mantenha-se longe
  rationale: O Qal imperfeito de segunda pessoa masculina singular tem força instrutiva e expressa separação ativa e contínua.
- source_word: וְ/נָקִי
  choice: o inocente
  rationale: נָקִי designa quem está livre de culpa; “inocente” é claro e apropriado ao contexto jurídico.
- source_word: וְ/צַדִּיק
  choice: o justo
  rationale: צַדִּיק pode designar o justo ou aquele que tem razão em juízo. “Justo” mantém a ligação lexical com a raiz צדק.
- source_word: אַל תַּהֲרֹג
  choice: não mate
  rationale: הרג é o verbo geral para matar. A tradução evita restringir indevidamente o sentido a homicídio doloso, embora o contexto seja judicial.
- source_word: לֹא אַצְדִּיק
  choice: não declararei justo
  rationale: 'O Hifil de צדק tem aqui sentido forense: declarar justo, justificar ou absolver. “Declararei justo” explicita a declaração judicial e conserva a ligação com צַדִּיק.'
- source_word: רָשָׁע
  choice: o culpado
  rationale: רָשָׁע pode significar perverso ou culpado. Neste contexto de julgamento, “culpado” comunica com naturalidade o contraste forense com o inocente e o justo.
theological_decisions:
- issue: Sentido forense da declaração divina
  choice: pois não declararei justo o culpado
  alternative: pois não absolverei o perverso
  rationale: A formulação preserva tanto o caráter judicial da fala de Deus quanto a repetição da raiz צדק entre “justo” e “declararei justo”. A alternativa “absolverei” é idiomática no âmbito jurídico, mas perde essa ligação lexical.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A construção “mantenha-se longe” conserva a força da instrução; a linguagem jurídica permanece compreensível sem tecnicismo excessivo.
