  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: pt
  text: Observe a Festa dos Pães sem Fermento. Durante sete dias, coma pão sem fermento, conforme lhe ordenei, no tempo determinado do mês de Abibe, pois nesse mês você saiu do Egito. Ninguém comparecerá diante de mim[a] de mãos vazias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “diante da minha face”, expressão que significa “diante de mim” ou “na minha presença”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “E eles não comparecerão diante de mim de mãos vazias”. Nesta cláusula, o hebraico passa do tratamento na segunda pessoa do singular para um verbo na terceira pessoa do plural.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: a Festa dos Pães sem Fermento
  rationale: חַג designa uma festa ou celebração, frequentemente com caráter de peregrinação, e מַצּוֹת são pães sem fermento. A formulação é clara, solene e reconhecível em português.
- source_word: תִּשְׁמֹר
  choice: Observe
  rationale: Em contexto legal e cultual, שׁמר significa guardar ou observar. “Observe” comunica naturalmente o dever de cumprir a celebração.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Durante sete dias, coma pão sem fermento
  rationale: Preserva a duração e o alimento exigido. O singular coletivo “pão sem fermento” é idiomático em português, embora o hebraico use o plural מַצּוֹת.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: conforme lhe ordenei
  rationale: Mantém tanto a relação comparativa quanto a força direta da ordem divina dirigida à segunda pessoa do singular.
- source_word: לְמוֹעֵד
  choice: no tempo determinado
  rationale: מוֹעֵד indica aqui a ocasião fixada no calendário para a celebração; “tempo determinado” é preciso e natural.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: o mês de Abibe
  rationale: Trata אָבִיב como designação calendárica e usa a forma portuguesa bíblica consagrada “Abibe”, sem converter o nome em uma explicação agrícola.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: pois nesse mês você saiu do Egito
  rationale: Explicita de modo natural que o pronome בוֹ retoma o mês mencionado, sem alterar o sentido causal da frase.
- source_word: וְלֹא יֵרָאוּ פָנַי
  choice: Ninguém comparecerá diante de mim
  rationale: O nifal de ראה forma aqui o idioma “comparecer diante de”. “Ninguém” expressa naturalmente em português a proibição de comparecer vazio, enquanto uma nota registra a mudança do hebraico para a terceira pessoa do plural.
- source_word: רֵיקָם
  choice: de mãos vazias
  rationale: A expressão idiomática transmite que não se devia comparecer sem levar uma dádiva, sem especificar além do texto qual oferta seria exigida.
theological_decisions:
- issue: Referência à presença divina por meio de פָנַי
  choice: diante de mim
  alternative: diante da minha face
  rationale: O hebraico diz literalmente “minha face”, mas a expressão idiomática significa comparecer perante Deus. “Diante de mim” conserva a referência pessoal e evita literalismo pouco natural.
- issue: Mudança de pessoa gramatical na cláusula final
  choice: Ninguém comparecerá diante de mim de mãos vazias
  alternative: E eles não comparecerão diante de mim de mãos vazias
  rationale: Depois de ordens na segunda pessoa do singular, o hebraico emprega um verbo na terceira pessoa do plural. A tradução principal comunica o valor indefinido com naturalidade, e a alternativa formal é preservada em nota para não ocultar a mudança.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por “você” aparece apenas onde necessário para tornar explícito o sujeito singular; os imperativos mantêm a força jurídica do texto. As notas preservam o idioma hebraico relativo à presença divina e a mudança gramatical da cláusula final.
