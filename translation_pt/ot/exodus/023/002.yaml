  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: pt
  text: Não siga a maioria para fazer o mal, nem testemunhe numa disputa, inclinando-se com a maioria para perverter a justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem responda numa disputa para, seguindo a maioria, torcer o julgamento”.'
    reason: Alternativa lexical que preserva os sentidos mais literais de תַעֲנֶה e das formas de נטה, bem como a concisão do hebraico.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: siga a maioria
  rationale: A construção com היה e אַחֲרֵי expressa idiomaticamente seguir ou acompanhar; “a maioria” comunica de modo natural o sentido coletivo de רַבִּים neste contexto.
- source_word: לְרָעֹת
  choice: para fazer o mal
  rationale: O infinitivo com לְ indica propósito ou resultado, e a expressão preserva a força ética de רָעֹת.
- source_word: תַעֲנֶה
  choice: testemunhe
  rationale: No contexto jurídico de רִיב, ענה se refere naturalmente a falar ou prestar depoimento como testemunha.
- source_word: עַל רִיב
  choice: numa disputa
  rationale: רִיב pode designar disputa, controvérsia ou causa judicial; “numa disputa” mantém a amplitude do termo, enquanto “testemunhe” explicita o cenário forense.
- source_word: לִנְטֹת
  choice: de modo a se desviar
  rationale: נטה significa inclinar-se, virar-se ou desviar-se; aqui descreve o afastamento do que é justo sob pressão coletiva.
- source_word: אַחֲרֵי רַבִּים
  choice: seguindo a maioria
  rationale: A repetição conserva a ênfase hebraica na influência da maioria, com formulação natural em português.
- source_word: לְהַטֹּת
  choice: para perverter a justiça
  rationale: O hifil de נטה tem aqui sentido causativo de torcer ou desviar; o objeto “a justiça” é explicitado pelo contexto judicial imediato.
theological_decisions:
- issue: Força jurídico-ética da oração final
  choice: Explicitar o objeto contextual em “para perverter a justiça”
  alternative: para desviar; para torcer o julgamento
  rationale: O infinitivo hebraico é conciso e não declara o objeto, mas o contexto de testemunho e disputa judicial indica que se trata de desviar a justiça ou o julgamento. A explicitação oferece clareza sem acrescentar uma posição doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O imperativo negativo no singular preserva o destinatário individual do hebraico. “Maioria” é mais idiomático do que “os muitos”, e a repetição mantém a ênfase retórica do original.
