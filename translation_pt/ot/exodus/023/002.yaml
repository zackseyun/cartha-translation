- from: Não siga a maioria para fazer o mal, nem testemunhe numa disputa de modo a se desviar, seguindo a maioria, para perverter a justiça.[a]
  to: Não siga a maioria para fazer o mal, nem testemunhe numa disputa, inclinando-se com a maioria para perverter a justiça.[a]
  rationale: A revisão substitui a sequência menos natural «de modo a se desviar, seguindo a maioria, para» por «inclinando-se com a maioria para». Assim, conserva-se a repetição conceitual de seguir/inclinar-se após a maioria e se esclarece que a ação proibida é prestar testemunho alinhado à maioria com o efeito de perverter a justiça. A nota foi ajustada para refletir a mesma relação sintática.
