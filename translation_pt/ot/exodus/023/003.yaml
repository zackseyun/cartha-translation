  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: pt
  text: E não favoreça o pobre em sua causa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não honre o pobre em sua causa”. O verbo hebraico pode significar mais literalmente “honrar”, mas, neste contexto judicial, refere-se a favorecer alguém ou tratá-lo com parcialidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָל
  choice: o pobre
  rationale: O substantivo singular designa uma pessoa pobre, humilde ou socialmente vulnerável. Em português, “o pobre” expressa naturalmente o referente genérico individual sem restringi-lo desnecessariamente ao sexo masculino.
- source_word: תֶהְדַּר
  choice: favoreça
  rationale: Embora o verbo possa significar mais literalmente “honrar”, no contexto judicial indica conceder tratamento preferencial; “favorecer” comunica com clareza essa parcialidade indevida.
- source_word: בְּרִיבוֹ
  choice: em sua causa
  rationale: רִיב pode denotar disputa, litígio ou causa judicial. “Em sua causa” preserva o sentido forense e o sufixo de terceira pessoa masculina singular, com linguagem portuguesa natural.
- source_word: וְ
  choice: E
  rationale: A conjunção coordena esta proibição com as leis anteriores, sem exigir um contraste explícito.
- source_word: לֹא
  choice: não
  rationale: Com a forma verbal neste contexto legal, introduz uma proibição direta e normativa.
theological_decisions:
- issue: Compaixão pelo pobre e imparcialidade judicial
  choice: A ordem proíbe favorecer o pobre numa causa judicial.
  alternative: Entender o versículo como uma ordem geral para honrar o pobre.
  rationale: 'A expressão “em sua causa” situa a instrução no âmbito judicial. A tradução mantém a tensão do texto: a vulnerabilidade do pobre não justifica parcialidade no julgamento, sem negar o dever de compaixão ensinado em outros textos.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Favoreça” é mais idiomático que “mostre parcialidade” e mantém o sentido judicial; “causa” conserva o registro jurídico sem soar excessivamente técnico.
