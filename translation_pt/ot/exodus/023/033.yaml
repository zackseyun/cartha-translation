  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: pt
  text: Não habitarão na sua terra, para que não levem você a pecar contra mim[a]; pois, se você servir aos deuses deles[b], isso será uma armadilha[c] para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façam com que você peque contra mim”.'
    reason: Alternativa lexical para o causativo hebraico de חטא.
  - marker: b
    text: 'Ou: “pois você serviria aos deuses deles”. A conjunção hebraica também pode ser entendida como explicativa, e a oração pode indicar o resultado provável, não apenas uma condição.'
    reason: Leitura alternativa da relação sintática introduzida por כִּי.
  - marker: c
    text: “Armadilha” traduz o hebraico moqesh, uma imagem de laço ou cilada para algo que conduz à ruína ou à infidelidade.
    reason: Nota lexical e cultural sobre a metáfora hebraica.
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: habitarão
  rationale: O verbo ישׁב pode significar sentar-se, permanecer, estabelecer-se ou habitar. Neste contexto territorial, “habitar” expressa residência contínua sem acrescentar a ideia específica de colonização permanente.
- source_word: בְּאַרְצְךָ
  choice: na sua terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. “Terra” conserva a dimensão territorial e pactual do contexto de Êxodo.
- source_word: פֶּן
  choice: para que não
  rationale: פֶּן introduz uma consequência indesejada que a proibição pretende evitar. “Para que não” é natural em português e preserva essa força preventiva.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: levem você a pecar contra mim
  rationale: A forma causativa de חטא indica fazer alguém pecar ou levá-lo ao pecado. “Levem você a pecar” comunica a causalidade sem sugerir coerção irresistível, e לִי é entendido eticamente como “contra mim”.
- source_word: כִּי
  choice: pois
  rationale: A primeira ocorrência de כִּי introduz a razão da proibição. “Pois” estabelece essa ligação de modo claro e digno.
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: se você servir aos deuses deles
  rationale: עבד, tendo deuses como objeto, denota servi-los ou prestar-lhes culto. “Servir” preserva a linguagem de lealdade religiosa; a formulação condicional apresenta a cláusula como a eventualidade que conduz à armadilha, enquanto a nota registra outra leitura possível do כִּי hebraico.
- source_word: אֱלֹהֵיהֶם
  choice: os deuses deles
  rationale: “Deuses” é o equivalente direto e corrente do plural אֱלֹהִים neste contexto de oposição ao culto cananeu.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: isso será uma armadilha para você
  rationale: מוֹקֵשׁ designa uma armadilha ou laço e, metaforicamente, algo que conduz à ruína ou à infidelidade. “Armadilha” é imediatamente compreensível e mantém a metáfora. Não se acrescenta um advérbio enfático sem correspondência lexical explícita no hebraico.
theological_decisions:
- issue: Natureza do pecado advertido
  choice: A advertência se refere especificamente à infidelidade a Deus manifestada no serviço aos deuses daqueles povos.
  alternative: Uma advertência geral contra a corrupção moral provocada por vizinhos estrangeiros.
  rationale: A oração sobre servir aos deuses deles identifica o pecado em questão. A tradução mantém esse vínculo explícito com a idolatria, sem transformar o versículo numa proibição étnica geral.
- issue: Relação lógica de תַעֲבֹד com a advertência
  choice: 'A cláusula é apresentada como condição: “se você servir”.'
  alternative: 'A cláusula pode ser lida como explicação ou resultado provável: “pois você serviria aos deuses deles”.'
  rationale: כִּי possui amplitude semântica suficiente para ambas as relações no contexto. A leitura condicional produz português claro, enquanto a nota preserva a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O pronome “você” torna explícito o singular hebraico dirigido a Israel coletivamente. A redação mantém tom solene sem arcaísmos e conserva a metáfora concreta da armadilha.
