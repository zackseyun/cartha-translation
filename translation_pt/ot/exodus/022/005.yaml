  source_fidelity: 'A formulação «Se o fogo se alastrar» transmite a propagação, mas não expressa plenamente תֵצֵא אֵשׁ, que introduz o caso de um fogo que irrompe ou se inicia. «Irromper» preserva melhor esse ponto sem atribuir intenção ao responsável. O restante mantém adequadamente a sequência: o fogo alcança a vegetação espinhosa e consome cereal colhido, cereal em pé ou o campo.'
  naturalness: A redação é clara e de registro jurídico natural. «Um fogo irromper» é uma forma idiomática e precisa em português moderno. «Deverá, sem falta, reparar o dano» é compreensível, mas «deverá certamente fazer restituição» reproduz mais diretamente a terminologia e a ênfase da obrigação legal hebraica.
  terminology: «Espinheiros», «monte de cereal», «plantação ainda em pé» e «campo» são escolhas adequadas. «Fazer restituição» é preferível a «reparar o dano», pois conserva o caráter técnico-jurídico de שַׁלֵּם יְשַׁלֵּם sem especificar indevidamente a modalidade ou a extensão da compensação.
