base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: pt
  text: Se um fogo irromper e atingir espinheiros[a], de modo que sejam consumidos um monte de cereal, a plantação ainda em pé ou o campo, aquele que acendeu o fogo deverá certamente fazer restituição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e alcançar espinhos”; literalmente, “e encontrar espinhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “certamente deverá pagar”. O hebraico reforça a obrigação por meio da combinação de um infinitivo absoluto com um verbo conjugado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz uma situação hipotética típica da legislação casuística; “se” é natural e preserva o caráter condicional.
- source_word: תֵצֵא אֵשׁ
  choice: o fogo se alastrar
  rationale: A expressão descreve o fogo saindo de seu ponto inicial e ficando fora de controle; “se alastrar” comunica isso naturalmente sem sugerir que o fogo se apagou.
- source_word: וּמָצְאָה קֹצִים
  choice: e atingir espinheiros
  rationale: O sentido literal é “e encontrar espinhos”; no contexto, o fogo os alcança. “Atingir espinheiros” conserva a progressão concreta do incêndio.
- source_word: קֹצִים
  choice: espinheiros
  rationale: Representa vegetação espinhosa que pode propagar o fogo e soa mais concreta em português do que o abstrato “espinhos” neste contexto.
- source_word: וְנֶאֱכַל
  choice: sejam consumidos
  rationale: O verbo na voz passiva descreve aquilo que é consumido pelo fogo; a formulação mantém o tom jurídico e digno.
- source_word: גָּדִישׁ
  choice: um monte de cereal
  rationale: Designa cereal já colhido e reunido em monte ou pilha, em contraste com a plantação ainda em pé.
- source_word: הַקָּמָה
  choice: a plantação ainda em pé
  rationale: Expressa a lavoura não colhida, ainda de pé no campo, em linguagem acessível ao leitor moderno.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: Equivalente direto que preserva a amplitude do referente hebraico.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: deverá, sem falta, reparar o dano
  rationale: A construção com infinitivo absoluto intensifica a obrigação. “Deverá, sem falta” transmite essa ênfase, e “reparar o dano” expressa naturalmente a restituição legal.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: aquele que acendeu o fogo
  rationale: Identifica de modo claro e idiomático a pessoa responsável por iniciar o fogo.
