  yaml_path: translation/ot/exodus/022/018.yaml
  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: pt
  text: Quem tiver relações sexuais com um animal certamente será morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “certamente morrerá”. A fórmula jurídica hebraica indica de modo enfático a morte certa como pena judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: Quem tiver relações sexuais
  rationale: כָּל seguido do particípio forma uma expressão geral indefinida. Em português, «Quem» reproduz isso naturalmente. Como שׁכב com עִם é um eufemismo sexual convencional, «tiver relações sexuais» comunica o sentido com clareza e dignidade, evitando a possível ambiguidade de «deitar-se com».
- source_word: עִם
  choice: com
  rationale: A preposição liga diretamente a expressão sexual ao seu complemento.
- source_word: בְּהֵמָה
  choice: um animal
  rationale: O substantivo designa um animal ou besta; «um animal» é a formulação moderna mais ampla e natural, sem o tom arcaico ou carregado de «besta» nem a limitação de «gado».
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto מוֹת intensifica a forma passiva יוּמָת. A tradução preserva tanto a certeza enfática quanto o caráter passivo e judicial da pena.
theological_decisions:
- issue: Tradução da fórmula legal de pena de morte
  choice: certamente será morto
  alternative: certamente morrerá
  rationale: A construção hebraica expressa enfaticamente a aplicação judicial da pena capital. «Será morto» mantém a voz passiva e torna explícito o caráter penal sem acrescentar uma justificativa teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação direta preserva a gravidade jurídica do hebraico; «relações sexuais» prioriza clareza contemporânea em vez de reproduzir literalmente o eufemismo semítico.
