  yaml_path: translation/ot/exodus/022/025.yaml
  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: pt
  text: Se você tomar como penhor o manto[a] do seu próximo, deverá devolvê-lo antes do pôr do sol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veste” ou “veste exterior”. O termo hebraico se refere especificamente a uma cobertura externa que podia servir de proteção durante a noite.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “até a vinda do sol”; isto é, até o pôr do sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma lei casuística ou condicional. “Se” reproduz diretamente a forma hebraica, embora “quando” também fosse possível nesse gênero jurídico.
- source_word: חָבֹל תַּחְבֹּל
  choice: tomar como penhor
  rationale: O infinitivo absoluto seguido do verbo finito reforça a ação de receber algo em garantia. Em português, a construção natural “tomar como penhor” comunica com clareza o sentido jurídico sem reproduzir artificialmente a repetição hebraica.
- source_word: שַׂלְמַת
  choice: manto
  rationale: Designa uma veste exterior que também podia servir de proteção durante a noite. “Manto” é específico, corrente e adequado ao contexto.
- source_word: רֵעֶךָ
  choice: do seu próximo
  rationale: “Próximo” expressa naturalmente a relação social e ética indicada por רֵעַ no contexto da legislação comunitária.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: antes do pôr do sol
  rationale: A expressão hebraica, literalmente “até a vinda do sol”, indica o limite do entardecer. A formulação escolhida comunica naturalmente que a devolução deve ocorrer até o anoitecer.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: deverá devolvê-lo
  rationale: O hifil de שוב significa fazer voltar ou restituir. “Deverá devolvê-lo” preserva a força normativa da instrução e é idiomático em português.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário jurídico não excessivamente técnico. Os marcadores foram colocados junto às expressões que explicam: [a] após “manto do seu próximo” e [b] após “pôr do sol”.'
