revisions:
- from: Se alguém fizer um campo ou uma vinha ser devastado pelo pasto[a], soltando seu animal para que paste no campo de outra pessoa[b], deverá restituir com o melhor de seu próprio campo e o melhor de sua própria vinha.
  to: Se alguém deixar seu animal pastar em um campo ou numa vinha[a] e deixá-lo solto, de modo que ele paste no campo de outra pessoa[b], deverá restituir com o melhor de seu próprio campo e o melhor de sua própria vinha.
  rationale: A revisão substitui a expressão inadequada «devastado pelo pasto» por uma construção natural em que o animal é explicitamente o agente do pastejo. Ela conserva o caráter condicional e jurídico do hebraico, a ligação entre soltar o animal e o dano em campo alheio, a alternativa lexical «queimar» em nota e a obrigação de restituição com o melhor dos bens do responsável.
