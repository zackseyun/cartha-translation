base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: pt
  text: Se alguém deixar seu animal pastar em um campo ou numa vinha[a] e deixá-lo solto, de modo que ele paste no campo de outra pessoa[b], deverá restituir com o melhor de seu próprio campo e o melhor de sua própria vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “queimar um campo ou uma vinha”. Em certos contextos, o verbo hebraico בער pode referir-se a queimar; aqui, porém, a menção imediata de soltar o animal favorece fortemente o sentido de pastar ou consumir pela pastagem.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em outro campo”. A expressão “de outra pessoa” explicita o sentido de posse implícito no contexto jurídico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Neste contexto de lei casuística, introduz uma situação condicional.
- source_word: יַבְעֶר
  choice: fizer ... ser devastado pelo pasto
  rationale: O hifil expressa causação, e a menção imediata de soltar o animal favorece o sentido de consumo por pastagem, não de queima.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: um campo ou uma vinha
  rationale: Equivalentes agrícolas naturais, mantendo os substantivos no singular como no caso legal hebraico.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: soltando seu animal
  rationale: Expressa de modo natural a ideia de liberar ou deixar sair o animal.
- source_word: בְּעִירֹה
  choice: seu animal
  rationale: O singular com sufixo é genérico; 'animal' é claro e evita tratar o termo como coletivo.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: para que paste no campo de outra pessoa
  rationale: A repetição de בער mantém a imagem de pastagem ou consumo pelo animal; a construção explicita naturalmente o nexo entre soltá-lo e o dano.
- source_word: אַחֵר
  choice: de outra pessoa
  rationale: O hebraico diz literalmente 'outro'; o possuidor implícito é explicitado em português para tornar claro o sentido jurídico sem restringi-lo desnecessariamente ao sexo masculino.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: com o melhor de seu próprio campo e o melhor de sua própria vinha
  rationale: מֵיטַב indica a parte melhor ou mais valiosa; 'próprio' esclarece que a compensação virá dos bens do responsável.
- source_word: יְשַׁלֵּם
  choice: deverá restituir
  rationale: O piel de שׁלם neste texto legal indica pagamento compensatório; 'restituir' preserva essa força jurídica.
