base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: pt
  text: Mas, se o sol tiver nascido sobre ele[a], haverá culpa de sangue para ele[b]. O ladrão deverá fazer restituição integral. Se não tiver recursos, será vendido por seu furto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais interpretativa, “se isso acontecer depois do nascer do sol” ou “se for feito à luz do dia”. O hebraico diz literalmente: “se o sol tiver nascido sobre ele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, neste caso, a pessoa que matar o ladrão incorre em culpa de sangue. A expressão hebraica é concisa e diz literalmente: “há culpa de sangue para ele”.'
    reason: alternative_reading
  - marker: c
    text: Essa venda era uma medida para quitar a dívida decorrente do furto quando o ladrão não possuía meios para fazer restituição.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Mas, se
  rationale: A partícula é condicional, mas aqui introduz o caso contrastante em relação à situação noturna do versículo anterior; “Mas, se” torna essa oposição natural em português.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: o sol já tiver nascido sobre ele
  rationale: Mantém a imagem concreta e a construção hebraica, incluindo o pronome que se refere ao ladrão. O futuro composto ajusta a oração à condição legal em português, e “já” evidencia que o nascer do sol antecede a ação considerada.
- source_word: דָּמִים לוֹ
  choice: haverá culpa de sangue para ele
  rationale: דָּמִים, no contexto jurídico, indica responsabilidade por sangue derramado. A formulação conserva o pronome hebraico e sua concisão, sem substituir o texto por uma explicação inteiramente interpretativa.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: deverá fazer plena restituição
  rationale: A combinação do infinitivo absoluto com o verbo conjugado intensifica a obrigação. “Fazer plena restituição” comunica tanto o caráter obrigatório como a reparação integral exigida pelo furto.
- source_word: אִם אֵין לוֹ
  choice: Se não tiver recursos
  rationale: Expressa de modo natural a ideia idiomática de não possuir meios para pagar a restituição, sem sugerir necessariamente ausência absoluta de qualquer bem.
- source_word: וְנִמְכַּר
  choice: será vendido
  rationale: Reproduz diretamente a forma passiva e a consequência jurídica estabelecida pelo texto.
- source_word: בִּגְנֵבָתוֹ
  choice: por causa do seu furto
  rationale: Mantém o substantivo jurídico “furto” e indica que a venda decorre da dívida gerada pelo delito.
theological_decisions:
- issue: Consequência jurídica de matar o ladrão depois do nascer do sol
  choice: Conservar a distinção temporal concreta e declarar que há culpa de sangue, deixando a nota identificar o provável portador dessa culpa.
  alternative: 'Parafrasear diretamente: “quem o matar será culpado de derramamento de sangue”, ou entender a luz do dia como princípio geral sobre a clareza da ameaça.'
  rationale: O hebraico contrasta o caso posterior ao nascer do sol com o caso noturno anterior. A redação preserva essa distinção e o pronome do original, enquanto a nota esclarece a leitura contextual provável sem ampliar a regra para além do que o versículo afirma.
- issue: Mudança de sujeito entre a culpa de sangue e a restituição
  choice: Explicitar “O ladrão” na oração sobre restituição.
  alternative: Manter apenas “ele”, o que poderia fazer o leitor pensar que a pessoa culpada pelo homicídio é quem deve restituir o furto.
  rationale: O contexto jurídico mostra que a obrigação de restituir recai sobre o ladrão. A explicitação evita uma ambiguidade criada em português pela sequência de pronomes, sem alterar o conteúdo legal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção concreta “o sol... sobre ele” foi mantida por fidelidade à imagem hebraica e explicada em nota. “Culpa de sangue” conserva a linguagem jurídica e moral do original. “Recursos” evita a impressão indevida de que o ladrão precisaria não possuir absolutamente nada; “será vendido” preserva sem eufemismo a consequência legal antiga.
