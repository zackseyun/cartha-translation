base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: pt
  text: Pois ela é a sua única cobertura; é seu manto para cobrir a pele. Com que ele se deitará? E, se ele clamar a mim, eu o ouvirei, pois sou compassivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “misericordioso”.
    reason: Registra uma alternativa lexical legítima para חַנּוּן, termo que pode expressar misericórdia, favor gracioso e compaixão.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a ordem do versículo anterior e mantém com naturalidade a força explicativa da conjunção.
- source_word: כסות/ה לְבַדָּהּ
  choice: a sua única cobertura
  rationale: כְּסוּת designa aquilo que cobre, especialmente uma peça de roupa, e לְבַדָּהּ indica que não há outra disponível.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: o manto que lhe cobre a pele
  rationale: “Manto” expressa a veste externa que também servia de coberta, enquanto “pele” preserva a imagem concreta de עוֹר; a construção relativa evita uma formulação artificial em português.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: Com que se cobrirá para dormir?
  rationale: A pergunta retórica indaga o que lhe restará como coberta ao deitar-se. A formulação explicita em português a função contextual da veste sem perder a força da pergunta.
- source_word: יִצְעַק אֵלַי
  choice: clamar a mim
  rationale: “Clamar” transmite o pedido urgente de socorro ou justiça expresso por צעק e conserva o destinatário indicado por אֵלַי.
- source_word: וְשָׁמַעְתִּי
  choice: eu o ouvirei
  rationale: “Ouvirei” preserva o sentido direto de שׁמע; o pronome objeto, implícito no contexto hebraico, torna a frase natural em português.
- source_word: חַנּוּן
  choice: compassivo
  rationale: O adjetivo descreve Deus como inclinado a favorecer e socorrer quem sofre. “Compassivo” é claro no contexto, sem excluir as nuances de graça e misericórdia.
theological_decisions:
- issue: Tradução da autodescrição divina חַנּוּן
  choice: compassivo
  alternative: bondoso; misericordioso
  rationale: “Compassivo” destaca a disposição divina de atender ao vulnerável neste contexto jurídico. “Bondoso” e “misericordioso” continuam sendo possibilidades lexicais legítimas, registradas em nota, sem representar leituras teológicas incompatíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição explicativa e a pergunta retórica do hebraico foram preservadas, mas a imagem da veste usada como coberta noturna foi formulada de modo natural.
