revisions:
- from: Um juramento de Yahweh[a] haverá entre os dois, declarando que ele não pôs a mão nos bens do seu próximo[b]. O dono aceitará isso[c], e ele não fará restituição.
  to: Haverá um juramento de Yahweh[a] entre os dois, de que ele não pôs a mão nos bens do seu próximo[b]. O dono aceitará o juramento[c], e este não fará restituição.
  rationale: A revisão melhora a ordem frasal e resolve a ambiguidade portuguesa do pronome final. «Este» retoma o homem que jurou — o guardião ou depositário implícito no contexto imediato —, enquanto «o dono» aceita o juramento. As notas foram preservadas, com a nota c ajustada para explicitar o objeto elíptico no hebraico e agora expresso no texto.
