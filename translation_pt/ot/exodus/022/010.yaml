  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: pt
  text: Haverá um juramento de Yahweh[a] entre os dois, de que ele não pôs a mão nos bens do seu próximo[b]. O dono aceitará o juramento[c], e este não fará restituição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “juramento de Yahweh” pode indicar um juramento feito perante Yahweh ou invocando o seu nome.
    reason: lexical_alternative
  - marker: b
    text: “Pôr a mão nos bens” é uma expressão que significa apropriar-se indevidamente deles ou mexer neles.
    reason: cultural_note
  - marker: c
    text: Ou “o dono receberá o juramento”; isto é, aceitará o juramento como suficiente.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: um juramento de Yahweh
  rationale: Reproduz de perto a construção hebraica e preserva o nome divino. No contexto jurídico, trata-se de um juramento solene feito perante Yahweh ou invocando-o.
- source_word: בֵּין שְׁנֵיהֶם
  choice: entre os dois
  rationale: Mantém explícitas as duas partes envolvidas na controvérsia legal.
- source_word: אִם לֹא
  choice: declarando que ... não
  rationale: Nesta fórmula de juramento, a expressão introduz o conteúdo jurado, e não uma condição comum.
- source_word: שָׁלַח יָדוֹ
  choice: pôs a mão
  rationale: Conserva a imagem do idioma hebraico, cujo sentido contextual é apropriar-se indevidamente dos bens ou mexer neles.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: nos bens do seu próximo
  rationale: Neste contexto, מְלָאכָה designa aquilo que pertence ao próximo e foi confiado à guarda de outra pessoa, não trabalho em sentido abstrato.
- source_word: וְלָקַח בְּעָלָיו
  choice: O dono aceitará isso
  rationale: Expressa naturalmente a ideia jurídica de que o proprietário aceita o juramento como suficiente, sem eliminar a possibilidade lexical mais concreta de 'receber'.
- source_word: יְשַׁלֵּם
  choice: fará restituição
  rationale: No direito da aliança, o Piel de שׁלם indica pagamento compensatório ou restituição.
theological_decisions:
- issue: Sentido da expressão 'juramento de Yahweh'
  choice: Manter a construção 'de Yahweh' no texto
  alternative: juramento perante Yahweh
  rationale: A construção formal preserva a relação expressa no hebraico sem definir de modo excessivamente estreito se o juramento é descrito como feito perante Yahweh, em seu nome ou sob sua autoridade.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. A repetição pronominal do hebraico foi mantida sem identificar além do necessário o referente do último “ele”, preservando a concisão e a tensão referencial do texto-fonte.
