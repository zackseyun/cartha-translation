  source_fidelity: 'O texto transmite corretamente a fórmula jurídica: um juramento ligado a Yahweh entre as duas partes, afirmando que o depositário não se apropriou dos bens do próximo; o proprietário o aceita, e o depositário não deve indenizar. A revisão apenas torna explícito, no desfecho, o referente que o português poderia confundir.'
  naturalness: A ordem «Um juramento ... haverá» é compreensível, mas menos natural em português contemporâneo. «Haverá um juramento ...» mantém o tom jurídico e melhora a fluidez. A troca de «isso» por «o juramento» evita um referente demasiado vago.
  terminology: «Yahweh», «juramento», «bens», «próximo» e «restituição» são escolhas adequadas e coerentes com o hebraico e com o registro legal do contexto.
