base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: pt
  text: Se o ladrão for encontrado invadindo e for golpeado, e morrer[a], quem o golpeou não terá culpa de sangue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Se o ladrão for encontrado durante a invasão, for golpeado e morrer”. O termo hebraico se refere a uma invasão, possivelmente mediante a abertura de uma passagem numa parede ou entrando às escondidas.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, nesse caso, a pessoa que golpeou o ladrão não incorre em responsabilidade legal pela morte dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: arrombando
  rationale: O substantivo designa uma invasão feita às escondidas, possivelmente escavando ou abrindo passagem por uma parede. A forma verbal idiomática comunica com clareza a situação jurídica sem restringi-la indevidamente a um túnel.
- source_word: יִמָּצֵא
  choice: for encontrado
  rationale: O nifal de מצא tem sentido passivo natural nesta condição legal.
- source_word: הַגַּנָּב
  choice: o ladrão
  rationale: É o equivalente comum e lexicalmente direto de גנב; o contexto já esclarece que se trata de invasão para furto.
- source_word: וְהֻכָּה
  choice: for golpeado
  rationale: Preserva a voz passiva e não sugere necessariamente golpes repetidos.
- source_word: וָמֵת
  choice: e morrer
  rationale: Mantém a coordenação hebraica e deixa o contexto indicar que a morte resulta do golpe, sem explicitar mais do que o texto.
- source_word: אֵין לוֹ דָּמִים
  choice: quem o golpeou não terá culpa de sangue
  rationale: Expressa de modo claro o idioma jurídico דמים como responsabilidade pela morte. O referente pronominal é explicitado para evitar que, em português, pareça ser o ladrão quem não incorre em culpa.
theological_decisions:
- issue: Idioma legal relativo à morte do ladrão durante o arrombamento
  choice: culpa de sangue
  alternative: não será culpado de homicídio
  rationale: A formulação preserva a categoria jurídica e pactual do hebraico e evita converter o texto numa classificação específica do direito penal moderno ou numa aprovação geral de matar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Arrombando” é natural no contexto, enquanto “culpa de sangue” conserva a força jurídica e teológica do idioma hebraico; a nota esclarece ambos os pontos.
