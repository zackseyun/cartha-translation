- from: Se o ladrão for encontrado arrombando e for golpeado, e morrer[a], quem o golpeou não terá culpa de sangue[b].
  to: Se o ladrão for encontrado invadindo e for golpeado, e morrer[a], quem o golpeou não terá culpa de sangue[b].
  rationale: A revisão substitui uma expressão que pode limitar indevidamente o modo de entrada por «invadindo», que comunica o cenário de invasão clandestina sem especificar mais do que o hebraico. Mantêm-se o vocabulário jurídico «culpa de sangue», a relação resultativa entre o golpe e a morte e a explicitação prudente do agente a quem se aplica a ausência de culpa. A nota lexical é ajustada apenas para maior clareza sintática.
