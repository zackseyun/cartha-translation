  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: pt
  text: Se o que foi roubado for de fato encontrado vivo em seu poder[a] — seja boi, jumento ou ovelha —, ele pagará o dobro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “se for certamente encontrado em sua mão o que foi roubado”. O hebraico emprega uma construção verbal enfática (“for certamente/de fato encontrado”) e usa “em sua mão” no sentido de estar em sua posse.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Partícula condicional que introduz a hipótese jurídica.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: for de fato encontrado
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ideia verbal; “de fato” transmite essa ênfase em português natural.
- source_word: בְיָדוֹ
  choice: em seu poder
  rationale: Embora signifique literalmente “em sua mão”, neste contexto jurídico a expressão indica posse ou controle.
- source_word: הַגְּנֵבָה
  choice: o que foi roubado
  rationale: Designa o bem ou animal roubado, não o ato do roubo. A formulação é clara e permite que “vivo” concorde naturalmente com os animais enumerados.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: seja boi, jumento ou ovelha
  rationale: Expressa de modo idiomático as categorias de animais abrangidas pela disposição legal.
- source_word: חַיִּים
  choice: vivo
  rationale: Indica que o animal roubado foi recuperado com vida, em contraste com um animal abatido ou já alienado.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: ele pagará o dobro
  rationale: Formulação jurídica concisa que comunica a restituição em valor ou quantidade duplicada.
