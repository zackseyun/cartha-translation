  text: But if it is stolen from him[a], he shall make restitution to its owner.
translation:
  language: pt
  text: Mas, se de fato lhe for roubado[a], ele indenizará o dono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “se roubar, for roubado de junto dele”; o infinitivo absoluto seguido do verbo finito é uma construção enfática, que também pode ser entendida como “se realmente for roubado enquanto estiver sob seus cuidados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição contrastante na sequência de leis; “Mas, se” expressa naturalmente essa relação em português.
- source_word: גָּנֹב יִגָּנֵב
  choice: de fato ... for roubado
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “De fato” preserva essa ênfase, enquanto a construção passiva mantém a forma do hebraico.
- source_word: מֵעִמּוֹ
  choice: lhe
  rationale: Representa de modo conciso “dele” ou, literalmente, “de junto dele”; no contexto jurídico, indica que o bem foi roubado enquanto estava sob seus cuidados.
- source_word: יְשַׁלֵּם
  choice: indenizará
  rationale: No contexto legal, o piel de שלם indica pagar compensação ou fazer restituição; “indenizará” comunica com clareza a obrigação legal sem sugerir necessariamente a devolução do próprio bem.
- source_word: לִבְעָלָיו
  choice: o dono
  rationale: בעל designa aqui o proprietário do bem confiado. “O dono” é a forma corrente e inequívoca em português.
