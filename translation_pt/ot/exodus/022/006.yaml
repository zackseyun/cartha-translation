  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: pt
  text: Se alguém entregar ao seu próximo dinheiro ou objetos para guardar, e isso for roubado da casa desse homem, se o ladrão for encontrado, ele pagará o dobro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: No contexto de lei casuística, introduz a condição do caso jurídico.
- source_word: יִתֵּן אִישׁ
  choice: alguém entregar
  rationale: Embora o hebraico diga literalmente “um homem”, o masculino singular funciona aqui como formulação jurídica representativa; “alguém” é natural em português e não amplia nem restringe o alcance da norma.
- source_word: אֶל רֵעֵהוּ
  choice: ao seu próximo
  rationale: Em contexto jurídico comunitário, רֵעַ designa outra pessoa da comunidade; “próximo” preserva a formulação bíblica e é claro em português.
- source_word: כֶּסֶף
  choice: dinheiro
  rationale: O sentido literal é “prata”, mas aqui o termo tem função monetária; “dinheiro” comunica diretamente o sentido contextual.
- source_word: אוֹ כֵלִים
  choice: ou objetos
  rationale: כֵלִים é um termo amplo para utensílios, artigos ou outros bens móveis. “Objetos” mantém essa amplitude sem sugerir apenas mercadorias comerciais.
- source_word: לִשְׁמֹר
  choice: para guardar
  rationale: 'O infinitivo expressa a finalidade da entrega: a custódia segura dos bens.'
- source_word: וְגֻנַּב
  choice: e isso for roubado
  rationale: A forma passiva refere-se coletivamente ao dinheiro ou aos objetos entregues. “Isso” evita impor número ao referente e mantém fluidez.
- source_word: מִבֵּית הָאִישׁ
  choice: da casa desse homem
  rationale: O sintagma retoma o depositário mencionado na primeira oração; “desse homem” torna a referência explícita sem acrescentar conteúdo.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: se o ladrão for encontrado
  rationale: Preserva o sentido literal do nifal de מצא, sem substituí-lo pela interpretação mais específica “for pego”.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: ele pagará o dobro
  rationale: A expressão hebraica exige restituição em dobro; o pronome retoma naturalmente o ladrão, sujeito contextual da penalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação condicional própria de legislação. A tradução conserva “for encontrado” e explicita de modo natural que a casa pertence ao depositário. Não foram necessárias notas, pois as alternativas lexicais não afetam materialmente o sentido e podem ser representadas com clareza no texto principal.
