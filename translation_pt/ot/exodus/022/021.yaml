  text: כָּל אַלְמָנָ֥ה וְ/יָת֖וֹם לֹ֥א תְעַנּֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/021.yaml
  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: pt
  text: Não maltratem nenhuma viúva nem nenhum órfão.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhuma criança sem pai”, em vez de “nenhum órfão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “oprimam” ou “aflijam”, em vez de “maltratem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: nenhuma / nenhum
  rationale: Com substantivos singulares sob proibição, כָּל tem sentido distributivo e abrangente. Em português, a construção negativa “não... nenhuma/nem nenhum” expressa isso naturalmente.
- source_word: אַלְמָנָה
  choice: viúva
  rationale: É o sentido lexical direto e corrente do termo hebraico.
- source_word: יָתוֹם
  choice: órfão
  rationale: É a tradução portuguesa mais clara e natural; no contexto social e jurídico hebraico, o termo pode designar mais especificamente uma criança sem pai.
- source_word: לֹא
  choice: não
  rationale: Expressa a negação normal empregada nesta proibição.
- source_word: תְעַנּוּן
  choice: maltratem
  rationale: No piel de ענה, o verbo indica causar sofrimento ou tratar duramente. “Maltratar” mantém boa amplitude em português atual sem restringir o sentido à opressão econômica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural adequado ao discurso dirigido à comunidade. A coordenação “nenhuma viúva nem nenhum órfão” preserva a abrangência distributiva do hebraico.
