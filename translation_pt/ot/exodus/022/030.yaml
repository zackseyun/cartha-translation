base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: pt
  text: E vocês serão para mim homens santos.[a] Não comerão carne dilacerada no campo;[b] vocês a jogarão aos cães.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “homens santos”. A expressão pode representar a comunidade da aliança, mas a forma masculina é explícita no texto-fonte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “carne dilacerada por animais no campo”. O hebraico diz simplesmente “carne [...] dilacerada”, deixando implícito quem a dilacerou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: homens santos
  rationale: A construção hebraica significa literalmente “homens de santidade” ou, de modo natural, “homens santos”. A tradução conserva o masculino plural explícito do texto-fonte; “povo santo” seria possível em sentido representativo, mas tornaria a formulação mais inclusiva do que a expressão hebraica.
- source_word: תִּהְיוּן לִי
  choice: serão para mim
  rationale: A forma de היה com לִי expressa tanto obrigação quanto relação de pertença pactual. “Serão para mim” preserva essa força relacional em português natural.
- source_word: בָשָׂר
  choice: carne
  rationale: Embora “flesh” corresponda formalmente a “carne/corpo”, neste regulamento alimentar “carne” é o equivalente português claro e idiomático.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Reproduz de forma direta a indicação espacial concreta do hebraico, sem ampliar para “campo aberto” ou “descampado”.
- source_word: טְרֵפָה
  choice: dilacerada
  rationale: O termo designa algo rasgado ou dilacerado, em especial uma presa atacada por animais. “Dilacerada” comunica o estado da carne sem explicitar na frase principal um agente que o hebraico deixa implícito.
- source_word: לֹא תֹאכֵלוּ
  choice: não comerão
  rationale: O futuro com valor imperativo é uma formulação portuguesa digna e corrente para a proibição legal, mantendo a continuidade estilística com “serão”.
- source_word: לַכֶּלֶב
  choice: aos cães
  rationale: O substantivo hebraico está no singular genérico, mas o plural genérico “aos cães” é mais natural em português e expressa adequadamente a destinação a animais necrófagos.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: vocês a jogarão
  rationale: “Jogar” é uma tradução moderna e clara de שלך. O pronome feminino “a” retoma naturalmente “carne” em português.
theological_decisions:
- issue: Linguagem de santidade na lei da aliança
  choice: “serão para mim homens santos”
  alternative: “serão para mim um povo santo” ou “serão para mim homens consagrados”
  rationale: A formulação conserva a santidade e a pertença a Deus como fundamento da proibição alimentar. “Santos” corresponde diretamente a קֹדֶשׁ e mantém sua amplitude teológica; “consagrados” seria mais estreito. “Homens” preserva o masculino plural explícito, enquanto a nota reconhece que a expressão pode representar a comunidade da aliança.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O futuro com valor de mandamento preserva o tom jurídico sem recorrer a formas arcaicas. A ordem “serão para mim homens santos” mantém em destaque a relação de pertença a Deus.
