source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: pt
  text: 'Em todo caso de transgressão que envolva um boi, um jumento, um animal do rebanho[a], uma veste ou qualquer coisa perdida, a respeito da qual alguém diga: “É esta”, o caso de ambas as partes deverá ser levado diante de Deus[b]. Aquele a quem Deus declarar culpado pagará em dobro ao seu próximo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico שֶׂה designa um animal do rebanho menor, que pode ser uma ovelha ou uma cabra.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante dos juízes” ou “diante do tribunal”. O hebraico אֱלֹהִים pode referir-se diretamente a Deus ou, neste contexto jurídico, a juízes que atuam sob autoridade divina.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: caso de transgressão
  rationale: דָּבָר tem aqui sentido jurídico de questão ou caso, e פֶּשַׁע indica transgressão ou delito; a formulação preserva tanto o caráter legal quanto a gravidade moral sem especificar indevidamente fraude.
- source_word: שׁוֹר
  choice: boi
  rationale: Termo natural e tradicional em português para um bovino singular em listas legais de propriedade.
- source_word: חֲמוֹר
  choice: jumento
  rationale: Equivalente claro e corrente no português bíblico de ampla compreensão; evita ambiguidades regionais de outras opções.
- source_word: שֶׂה
  choice: animal do rebanho
  rationale: O hebraico pode designar uma ovelha ou uma cabra; esta expressão mantém a amplitude lexical, explicitada em nota.
- source_word: שַׂלְמָה
  choice: veste
  rationale: Designa de modo abrangente uma peça de roupa, sem restringir o referente a uma capa.
- source_word: אֲבֵדָה
  choice: qualquer coisa perdida
  rationale: Reproduz a amplitude do substantivo, que se refere a algo perdido ou a propriedade perdida.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: 'a respeito da qual alguém diga: “É esta”'
  rationale: Preserva a identificação enfática e algo elíptica do hebraico sem acrescentar uma explicação sobre propriedade ou posse.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Deus
  rationale: É o sentido lexical direto de אֱלֹהִים; a possível referência a juízes ou ao tribunal em contexto jurídico é mantida em nota.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: o caso de ambas as partes deverá ser levado
  rationale: Expressa naturalmente em português a apresentação da controvérsia dos dois envolvidos perante a autoridade julgadora.
- source_word: יַרְשִׁיעֻן
  choice: declarar culpado
  rationale: O hifil de רשע tem sentido forense de pronunciar alguém culpado, mais preciso aqui do que uma condenação em sentido amplo.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: pagará em dobro
  rationale: Comunica de forma concisa e corrente a restituição em valor duplo exigida pelo idiomatismo hebraico.
- source_word: לְרֵעֵהוּ
  choice: ao seu próximo
  rationale: Mantém o equivalente amplo e tradicional de רֵעַ; no contexto, refere-se à outra parte da disputa.
theological_decisions:
- issue: Sentido de אֱלֹהִים no contexto jurídico
  choice: Deus
  alternative: os juízes / o tribunal
  rationale: A forma hebraica significa diretamente “Deus”, mas neste contexto legal pode ter sido entendida como referência a juízes que exercem autoridade divina. O texto principal mantém a leitura lexical direta, enquanto a nota preserva a alternativa legítima sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe jurídica clara. “Animal do rebanho” conserva a abrangência do hebraico, e “É esta” mantém a concisão demonstrativa do original. Os marcadores [a] e [b] estão colocados junto aos termos a que suas respectivas notas se referem.
