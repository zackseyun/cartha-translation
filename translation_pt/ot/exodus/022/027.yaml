  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: pt
  text: Não insulte a Deus[a], nem amaldiçoe uma autoridade do seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não insulte os juízes». Em certos contextos, אֱלֹהִים pode referir-se a autoridades humanas; contudo, «Deus» parece ajustar-se melhor ao paralelismo aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora אֱלֹהִים possa designar deuses ou, em certos contextos, autoridades humanas ou juízes, aqui o sentido singular «Deus» se ajusta bem à proibição legal e ao paralelismo com o líder humano. A alternativa histórica «juízes» é preservada em nota.
- source_word: תְקַלֵּל
  choice: blasfeme contra
  rationale: No piel, קלל pode significar amaldiçoar, desprezar ou ultrajar. «Blasfemar contra» expressa de modo natural a fala ofensiva dirigida a Deus e mantém alguma distinção em relação a תָאֹר, traduzido por «amaldiçoar» na segunda oração.
- source_word: נָשִׂיא
  choice: um líder
  rationale: נָשִׂיא designa alguém elevado a uma posição de chefia ou autoridade. «Líder» é atual, abrangente e evita o sentido monárquico mais estreito que «príncipe» poderia sugerir.
- source_word: בְעַמְּךָ
  choice: do seu povo
  rationale: A expressão indica um líder pertencente à comunidade do destinatário. «Do seu povo» é idiomático em português e preserva essa relação; «entre o seu povo» também seria possível.
- source_word: תָאֹר
  choice: amaldiçoe
  rationale: ארר é o verbo hebraico habitual para proferir maldição; «amaldiçoar» é seu equivalente português claro e direto.
theological_decisions:
- issue: Referente de אֱלֹהִים
  choice: Deus
  alternative: juízes; deuses
  rationale: 'O paralelismo pode apresentar duas proibições complementares: ultrajar Deus e amaldiçoar uma autoridade humana. Contudo, como אֱלֹהִים pode referir-se em certos contextos a autoridades judiciais, essa ambiguidade relevante é mantida em nota, sem ser eliminada silenciosamente.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo negativo com subjuntivo («não blasfeme», «nem amaldiçoe») transmite naturalmente a proibição legal. A escolha de «blasfeme contra» evita repetir «amaldiçoe» e preserva a distinção retórica entre os dois verbos hebraicos.
