  yaml_path: translation/ot/exodus/022/012.yaml
  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: pt
  text: Mas, se o animal for de fato despedaçado por uma fera[a], deverá apresentá-lo como prova; não terá de fazer restituição pelo animal despedaçado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «se o animal for despedaçado, deverá apresentar o animal dilacerado como prova; não terá de fazer restituição por ele». Literalmente, o hebraico enfatiza que ele foi despedaçado e não identifica expressamente o agente.'
    reason: Preserva a alternativa mais literal para a construção enfática hebraica e assinala que «por uma fera» explicita o cenário sugerido pelo contexto, mas não é expresso no texto hebraico.
lexical_decisions:
- source_word: אִם
  choice: Mas, se
  rationale: Introduz uma nova hipótese jurídica em contraste com o caso anterior; «Mas, se» reproduz naturalmente essa progressão.
- source_word: טָרֹף יִטָּרֵף
  choice: for despedaçado por uma fera
  rationale: A construção intensiva descreve o animal como efetivamente dilacerado; no contexto, o verbo normalmente sugere ataque de animal. A formulação evita um advérbio artificial e explicita com naturalidade o agente implícito.
- source_word: יְבִאֵהוּ עֵד
  choice: deverá apresentar os restos como prova
  rationale: O verbo significa trazer ou apresentar, e עֵד tem aqui função probatória. «Os restos» torna compreensível o referente do pronome sem sugerir que se apresente o animal intacto.
- source_word: הַטְּרֵפָה
  choice: pelo animal despedaçado
  rationale: Designa aquilo que foi dilacerado. A tradução identifica o referente exigido pelo contexto, sem restringi-lo tecnicamente a «carcaça».
- source_word: לֹא יְשַׁלֵּם
  choice: não terá de pagar
  rationale: No contexto legal, o Piel de שלם indica compensar ou restituir. Esta formulação comunica de modo claro que não haverá obrigação de indenização.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. «Fera» é amplamente compreensível e «apresentar ... como prova» expressa naturalmente a função forense de עֵד.
