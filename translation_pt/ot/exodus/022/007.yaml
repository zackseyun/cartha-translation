  source_fidelity: 'A tradução preserva bem os elementos centrais: o ladrão não é encontrado, o responsável pela casa comparece diante de Deus, e é averiguado se ele estendeu a mão aos bens do próximo. A nota mantém adequadamente a alternativa interpretativa “juízes” para אֱלֹהִים. Contudo, “se ele pôs ou não a mão” substitui a formulação negativa explícita do hebraico (אִם לֹא) por uma alternativa binária; embora próxima no sentido, é desnecessário nivelar essa nuance.'
  naturalness: “Para se determinar” é pouco natural e impessoal de modo rígido em português contemporâneo. “Para que se determine” é mais fluente e conserva a abertura quanto ao agente que conduz o procedimento.
  terminology: “Dono da casa”, “Deus”, “bens” e “próximo” são claros, adequados ao registro e coerentes com o contexto jurídico. “Pôr a mão nos bens” preserva de modo compreensível a imagem hebraica sem antecipar a interpretação mais restrita de furto.
  issues:
