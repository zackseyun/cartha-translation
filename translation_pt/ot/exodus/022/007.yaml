    rationale: O hebraico formula a averiguação como “se não estendeu/pôs a mão”. Manter “se ele não pôs a mão” oferece maior correspondência formal e evita reformular a questão como alternativa binária.
  revised_text: Se o ladrão não for encontrado, o dono da casa se apresentará diante de Deus[a], para que se determine se ele não pôs a mão nos bens de seu próximo.
