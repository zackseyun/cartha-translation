  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: pt
  text: Se o ladrão não for encontrado, o dono da casa se apresentará diante de Deus[a], para que se determine se ele não pôs a mão nos bens de seu próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dos juízes”. O hebraico diz “diante de Deus”, mas, em alguns contextos jurídicos, o termo pode se referir a juízes que atuam sob autoridade divina.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: o ladrão não for encontrado
  rationale: Traduz diretamente o nifal de מצא em contexto jurídico, sem especificar se o ladrão não foi identificado ou capturado.
- source_word: וְנִקְרַב
  choice: se apresentará diante de
  rationale: O nifal de קרב pode significar aproximar-se ou ser levado para perto. Em português jurídico corrente, “se apresentará diante de” comunica naturalmente o comparecimento, sem definir uma agência externa.
- source_word: בַּעַל הַבַּיִת
  choice: o dono da casa
  rationale: Expressão clara e atual para a pessoa que possui ou responde pela casa.
- source_word: אֶל הָאֱלֹהִים
  choice: diante de Deus
  rationale: Mantém o valor lexical direto de אֱלֹהִים e expressa idiomaticamente o comparecimento em um procedimento realizado perante Deus; a possível referência a juízes fica registrada em nota.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: se ele pôs ou não a mão
  rationale: Preserva a imagem do idioma hebraico referente à apropriação ou ao uso indevido, enquanto a construção portuguesa “se... ou não” comunica com clareza a questão a ser determinada.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: nos bens do seu próximo
  rationale: Neste contexto de valores ou objetos confiados, מְלָאכָה designa aquilo que pertence ao outro ou está sob seus cuidados. “Bens” é natural e suficientemente amplo em português.
theological_decisions:
- issue: Sentido de אֱלֹהִים neste contexto jurídico
  choice: diante de Deus
  alternative: diante dos juízes
  rationale: O hebraico diz literalmente “Deus”, mas אֱלֹהִים pode, em certos textos legais, ser entendido como referência a juízes que exercem autoridade divina. A tradução principal conserva o sentido lexical direto e a nota preserva a alternativa sem resolver a ambiguidade silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem hebraica de “pôr a mão” e explicita apenas a função sintática da averiguação, sem reduzir o ato necessariamente a furto.
