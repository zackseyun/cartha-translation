  terminology: «Dono», «tomou emprestado», «indenizar» e «aluguel» são adequados ao registro jurídico acessível. A nota mantém a alternativa pessoal para שָׂכִיר e assinala a concisão do hebraico, sem tratar como certa uma leitura disputada.
