  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: pt
  text: Se o dono estiver com o animal, quem o tomou emprestado não terá de indenizar. Se o animal for alugado, a indenização está incluída no aluguel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “veio por seu aluguel”. A frase é concisa e também pode ser entendida assim: “Se ele for um trabalhador contratado, veio por seu salário”. Neste contexto de responsabilidade por um animal emprestado, o texto principal a entende como referência ao animal alugado e à indenização incluída no aluguel.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: o dono
  rationale: בעל, neste contexto jurídico de bens e animais confiados a outra pessoa, designa naturalmente o proprietário.
- source_word: עִמּוֹ
  choice: estiver presente com quem tomou o animal emprestado
  rationale: A expressão hebraica significa literalmente “estiver com ele”. O contexto aponta para a presença do proprietário junto ao tomador do empréstimo; a formulação explicita os participantes para evitar que o pronome português pareça referir-se ao animal.
- source_word: לֹא יְשַׁלֵּם
  choice: não fará restituição
  rationale: No piel, שלם tem aqui sentido jurídico de indenizar ou restituir por uma perda, não apenas de efetuar um pagamento qualquer.
- source_word: שָׂכִיר
  choice: o animal tiver sido alugado
  rationale: Embora שָׂכִיר normalmente possa designar um trabalhador contratado, o contexto imediato trata da responsabilidade por um animal tomado emprestado ou alugado. “Animal” retoma o bem em questão sem usar a pouco natural expressão “coisa alugada”.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: a perda estará coberta pelo valor do aluguel
  rationale: A frase hebraica é elíptica, literalmente próxima de “veio por/com seu aluguel”. No contexto legal, comunica que o risco da perda integra o acordo e o pagamento do aluguel; a tradução torna essa implicação compreensível em português.
