source:
  edition: WLC
  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: pt
  text: Não maltratem nem oprimam o estrangeiro[a], pois vocês foram estrangeiros na terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “residente estrangeiro”. O hebraico גֵר refere-se a uma pessoa não nativa que vivia no meio de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: estrangeiro
  rationale: Designa uma pessoa não israelita que vive no meio de Israel, e não apenas alguém de passagem. “Estrangeiro” é claro e natural em português; a nota explicita o sentido social mais específico do hebraico.
- source_word: תוֹנֶה
  choice: maltratem
  rationale: O hifil de ינה indica tratar alguém de maneira injusta ou lesiva. “Maltratar” preserva a amplitude do verbo sem o restringir à exploração econômica.
- source_word: תִלְחָצֶנּוּ
  choice: oprimam
  rationale: לחץ comunica pressão severa e opressão. “Oprimir” mantém o peso jurídico e social da proibição.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem e conserva de modo conciso o tom explicativo da lei.
- source_word: גֵרִים
  choice: estrangeiros
  rationale: Repete no plural o termo-chave גֵר; a tradução mantém essa correspondência lexical.
- source_word: הֱיִיתֶם
  choice: vocês foram
  rationale: Expressa a condição passada dos israelitas no Egito em português corrente.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Preserva a menção explícita à “terra” no hebraico sem prejudicar a naturalidade.
theological_decisions:
- issue: Referência masculina singular usada de modo genérico
  choice: Manter “o estrangeiro” no singular, mas deixar o objeto dos dois verbos implícito em português.
  alternative: Empregar “os estrangeiros” no plural ou repetir “não o maltratem nem o oprimam”.
  rationale: O hebraico apresenta גֵר no singular e um sufixo masculino singular, com função genérica na linguagem legal. Em português, “o estrangeiro” preserva o singular, enquanto a coordenação verbal permite evitar uma repetição pronominal pouco natural sem apagar a referência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural verbal acompanha o destinatário coletivo “vocês”, enquanto “o estrangeiro” conserva o singular genérico do texto hebraico.
