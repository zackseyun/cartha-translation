  text: כֵּֽן תַּעֲשֶׂ֥ה לְ/שֹׁרְ/ךָ֖ לְ/צֹאנֶ֑/ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם אִמּ֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י תִּתְּנ/וֹ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: pt
  text: 'Faça o mesmo com o seu boi e com o seu rebanho: durante sete dias, o filhote ficará com a mãe[a]; no oitavo dia, você o dará a mim.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “estará com a mãe”. “Ficará” ressalta o sentido de duração no contexto.'
    reason: lexical_alternative
  - marker: b
    text: A ordem dá continuidade ao contexto anterior sobre os primogênitos; neste versículo, o hebraico não repete a palavra “primogênito”.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  choice: Faça o mesmo
  rationale: Expressa naturalmente a força comparativa de כֵּן e o valor prescritivo de תַּעֲשֶׂה, ligando a ordem ao contexto imediatamente anterior.
- source_word: לְשֹׁרְךָ
  choice: com o seu boi
  rationale: O לְ marca aqui referência àquilo a que a regra se aplica. “Boi” é abrangente e adequado ao contexto jurídico.
- source_word: לְצֹאנֶךָ
  choice: com o seu rebanho
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” preserva essa coletividade sem especificação indevida.
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: durante sete dias, o filhote ficará com a mãe
  rationale: “Ficará” transmite o sentido durativo de יִהְיֶה no contexto. “O filhote” explicita em português o sujeito implícito, necessário para uma formulação natural e claramente relacionado ao animal recém-nascido.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: no oitavo dia
  rationale: Equivalente temporal direto, idiomático e tradicional em português.
- source_word: תִּתְּנוֹ לִי
  choice: você o dará a mim
  rationale: Reproduz diretamente נתן com o sufixo de objeto e לִי, mantendo a exigência pactual sem acrescentar linguagem sacrificial ausente do verso.
theological_decisions:
- issue: Relação da ordem com os animais primogênitos
  choice: Manter a continuidade com a instrução anterior sem inserir “primogênito” no corpo do versículo.
  alternative: Acrescentar “o primogênito” para tornar explícito o referente contextual.
  rationale: O hebraico não repete “primogênito” neste versículo; o referente é recuperado do contexto. A nota esclarece a relação sem expandir silenciosamente o texto.
- issue: Natureza de “dar” o animal a Deus
  choice: Traduzir simplesmente “você o dará a mim”.
  alternative: Traduzir “você o oferecerá a mim” ou “você o apresentará a mim”.
  rationale: תִּתְּנוֹ significa literalmente “você o dará”. Uma formulação cultual mais específica resolveria além do que esta oração isoladamente declara.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A forma “você” comunica diretamente a segunda pessoa singular sem regionalismo marcado. “O filhote” evita um sujeito pronominal ambíguo em português, enquanto as notas preservam a literalidade e a dependência contextual do hebraico.
