id: EXO.22.15
reference: Exodus 22:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: pt
  text: Se um homem seduzir uma virgem que não esteja prometida em casamento[a] e se deitar com ela, deverá pagar sem falta por ela o preço nupcial[b], para que seja sua mulher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que não esteja noiva”. O hebraico se refere a uma mulher que não foi formalmente comprometida em casamento.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa um termo ligado ao mohar, pagamento matrimonial feito pelo noivo ou por sua família. “Preço nupcial” é mais preciso aqui do que “dote”, que muitas vezes designa bens levados pela noiva ao casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: seduzir
  rationale: O piel de פתה indica persuadir ou atrair e, neste contexto sexual, é bem expresso por “seduzir”. A escolha não acrescenta a ideia de força, que o termo não explicita.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo masculino singular designa aqui um homem, preservando a referência específica do hebraico.
- source_word: בְּתוּלָה
  choice: uma virgem
  rationale: Em contexto jurídico e matrimonial, בְּתוּלָה designa normalmente uma mulher virgem; esse estado é relevante para o caso tratado.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: que não esteja prometida em casamento
  rationale: A forma passiva indica que ela não foi formalmente comprometida para casamento. A expressão é clara em português atual e mantém a dimensão jurídica e social do noivado antigo.
- source_word: וְשָׁכַב עִמָּהּ
  choice: e se deitar com ela
  rationale: שׁכב com עִם é um eufemismo hebraico comum para relação sexual. “Deitar-se com ela” conserva a forma digna e próxima do original.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: deverá pagar sem falta por ela o preço nupcial
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a obrigação. O verbo מהר refere-se ao pagamento do mohar ligado ao casamento; “preço nupcial” evita a direção patrimonial equivocada que “dote” pode sugerir.
- source_word: לּוֹ לְאִשָּׁה
  choice: para que seja sua mulher
  rationale: A frase apresenta o casamento como resultado jurídico pretendido do pagamento, em formulação natural e fiel à relação expressa no hebraico.
theological_decisions:
- issue: Natureza do ato sexual descrito por פתה
  choice: sedução, sem declarar uso de força
  alternative: estupro ou violação forçada
  rationale: O verbo פתה no piel favorece a ideia de persuadir ou seduzir. Traduzir por um termo que afirmasse violência importaria para este versículo algo que ele não declara e eliminaria a distinção em relação a leis que tratam explicitamente de agressão sexual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe preserva a estrutura condicional da lei e o eufemismo sexual do hebraico; “deverá pagar sem falta” comunica naturalmente a intensificação da obrigação.
