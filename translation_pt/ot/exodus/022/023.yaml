  text: וְ/חָרָ֣ה אַפִּ֔/י וְ/הָרַגְתִּ֥י אֶתְ/כֶ֖ם בֶּ/חָ֑רֶב וְ/הָי֤וּ נְשֵׁי/כֶם֙ אַלְמָנ֔וֹת וּ/בְנֵי/כֶ֖ם יְתֹמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: pt
  text: Então a minha ira arderá, e eu matarei vocês à espada[a]; suas esposas ficarão viúvas, e seus filhos ficarão sem pai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela espada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “órfãos”. O termo hebraico pode designar mais especificamente os que ficaram sem pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: a minha ira arderá
  rationale: A expressão hebraica combina o verbo חרה com אַף para descrever a ira que se inflama. A tradução preserva a metáfora de calor em português natural, sem reproduzir literalmente a referência idiomática ao nariz.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: eu matarei vocês
  rationale: הרג é o verbo comum para matar. “Vocês” expressa de modo claro o sufixo masculino plural sem recorrer a uma forma regionalmente restrita.
- source_word: בֶּחָרֶב
  choice: à espada
  rationale: A preposição בְּ indica aqui o meio ou instrumento. “À espada” mantém a imagem concreta e é uma formulação portuguesa natural e digna.
- source_word: נְשֵׁיכֶם
  choice: suas esposas
  rationale: Embora אִשָּׁה também possa significar “mulher”, o contexto familiar e possessivo indica especificamente as esposas dos homens ameaçados.
- source_word: וְהָיוּ
  choice: ficarão
  rationale: O verbo היה descreve o estado resultante do juízo; “ficarão” comunica naturalmente essa mudança de condição.
- source_word: וּבְנֵיכֶם
  choice: seus filhos
  rationale: בנים designa os descendentes ou filhos e, neste contexto, refere-se aos que perderão os pais. “Filhos” preserva a forma lexical do hebraico e permanece natural em português.
- source_word: יְתֹמִים
  choice: sem pai
  rationale: יָתוֹם designa especialmente alguém privado do pai e socialmente vulnerável. “Sem pai” explicita essa condição com precisão; “órfãos” é uma alternativa possível, mas pode sugerir em português a perda de ambos os pais.
theological_decisions:
- issue: Expressão antropomórfica da ira divina
  choice: a minha ira arderá
  alternative: o meu nariz arderá; a minha ira se acenderá
  rationale: A referência literal ao nariz pertence ao idioma hebraico da ira e seria obscura em português. A tradução comunica o sentido e conserva a metáfora do calor, sem suavizar a ameaça de juízo.
- issue: Condição dos filhos após a morte dos pais
  choice: ficarão sem pai
  alternative: ficarão órfãos
  rationale: 'A escolha preserva a dimensão social específica de יָתוֹם no contexto: os homens serão mortos, deixando seus filhos privados do pai. A alternativa mais ampla é registrada em nota.'
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A coordenação direta e o paralelismo preservam a contundência jurídica e poética do hebraico. Os dois marcadores de nota aparecem no texto principal junto às expressões correspondentes.
