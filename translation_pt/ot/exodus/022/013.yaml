source:
  edition: WLC
  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: pt
  text: Se um homem tomar algo emprestado de seu próximo, e isso for danificado ou morrer, se o dono não estiver com o bem, deverá fazer restituição plena[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “for quebrado”. O hebraico pode se referir tanto a dano a um objeto emprestado quanto ao ferimento de um animal emprestado.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “certamente pagará”; isto é, deverá fazer restituição plena.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Se
  rationale: Introduz um novo caso condicional na coleção legal. Em português, «Se» expressa naturalmente a condição; a força conectiva de ו pode ficar implícita na sequência das leis.
- source_word: יִשְׁאַל
  choice: tomar emprestado
  rationale: Neste contexto jurídico, o verbo significa pedir algo emprestado, e não simplesmente perguntar ou solicitar.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o masculino singular genérico da formulação casuística hebraica.
- source_word: מֵעִם רֵעֵהוּ
  choice: de seu próximo
  rationale: «Próximo» é uma tradução reconhecível de רֵעַ no contexto das leis da aliança e abrange o outro membro da comunidade.
- source_word: וְנִשְׁבַּר
  choice: sofrer dano
  rationale: O verbo significa literalmente «ser quebrado», mas pode descrever tanto dano a um objeto quanto ferimento a um animal; «sofrer dano» preserva essa amplitude.
- source_word: אוֹ מֵת
  choice: ou morrer
  rationale: Mantém de modo direto a segunda eventualidade legal, especialmente natural quando o bem emprestado é um animal.
- source_word: בְּעָלָיו
  choice: seu dono
  rationale: Embora a forma hebraica seja morfologicamente plural, funciona aqui de modo idiomático para o proprietário singular.
- source_word: אֵין עִמּוֹ
  choice: não estando seu dono presente
  rationale: Expressa a ausência do proprietário no momento do dano ou da morte sem forçar a referência ambígua do sufixo pronominal hebraico.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: terá de indenizá-lo integralmente
  rationale: A construção intensiva impõe obrigação certa e plena; «indenizar integralmente» comunica o sentido jurídico de ressarcimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. A explicitação «um animal ou objeto» torna natural o referente não expresso no hebraico e preserva a amplitude do caso legal; as notas registram a expressão literal e a intensificação hebraica.
