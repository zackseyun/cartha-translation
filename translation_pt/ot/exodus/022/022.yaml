  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: pt
  text: Se você de fato o afligir[a], e se ele de fato clamar a mim[b], certamente ouvirei seu clamor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega pronomes no masculino singular (“o”, “ele”, “seu”), que aqui se referem distributivamente a cada viúva ou órfão mencionado no versículo anterior.
    reason: cultural_note
  - marker: b
    text: Nas expressões traduzidas por “de fato [...] afligir”, “de fato clamar” e “certamente ouvirei”, o hebraico repete a raiz verbal por meio de um infinitivo absoluto junto de um verbo finito, dando ênfase a cada ação.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição expressa no hebraico, sem convertê-la em afirmação temporal.
- source_word: עַנֵּה תְעַנֶּה
  choice: de fato você o afligir
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação. “De fato” preserva a ênfase, enquanto “afligir” mantém a força ampla de ענה e a ligação com o sofrimento imposto.
- source_word: אֹתוֹ
  choice: o
  rationale: Reproduz o sufixo masculino singular hebraico, usado distributivamente para qualquer pessoa pertencente às categorias mencionadas no versículo anterior.
- source_word: כִּי אִם
  choice: e se
  rationale: No encadeamento da frase, introduz a condição subsequente sem exigir sentido adversativo.
- source_word: צָעֹק יִצְעַק
  choice: ele clamar insistentemente
  rationale: A repetição verbal hebraica intensifica o clamor. “Insistentemente” comunica essa força em português natural sem acrescentar uma causa ou emoção não expressa.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa de modo direto o destinatário do clamor.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: certamente ouvirei
  rationale: A construção enfática assegura a resposta divina; “certamente” expressa sua força idiomaticamente.
- source_word: צַעֲקָתוֹ
  choice: o seu clamor
  rationale: “Clamor” é natural, digno e mantém a relação lexical com o verbo “clamar”.
theological_decisions:
- issue: Pronome masculino singular referente à pessoa afligida
  choice: o / ele / seu
  alternative: a pessoa / ela / seu; os / eles / seu
  rationale: Os sufixos hebraicos estão no masculino singular e funcionam distributivamente no contexto, abrangendo qualquer viúva ou órfão mencionado no versículo anterior. A nota evita restringir indevidamente a referência a uma pessoa do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe condicional e as três ênfases do hebraico são preservadas sem reproduzir mecanicamente a repetição verbal. “Você” torna explícito o sujeito singular da forma verbal hebraica e mantém naturalidade contemporânea.
