  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: pt
  text: Se o pai dela se recusar terminantemente a dá-la a ele[a], o homem deverá pesar prata equivalente ao preço nupcial das virgens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a dá-la em casamento a ele”. A expressão hebraica “dá-la a ele” refere-se ao consentimento do pai para o casamento.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pesará prata”, em referência ao pagamento feito com prata pesada em balança, e não com moedas cunhadas.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Partícula condicional que introduz a condição deste caso jurídico.
- source_word: מָאֵן יְמָאֵן
  choice: se recusar terminantemente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a recusa; “terminantemente” expressa essa ênfase em português natural.
- source_word: אָבִיהָ
  choice: o pai dela
  rationale: Traduz explicitamente o substantivo com sufixo possessivo feminino singular.
- source_word: לְתִתָּהּ לוֹ
  choice: a dá-la a ele
  rationale: Preserva de perto a formulação hebraica; no contexto, trata-se de concedê-la em casamento, esclarecido em nota.
- source_word: כֶּסֶף יִשְׁקֹל
  choice: ele pesará prata
  rationale: Mantém a imagem concreta do pagamento em prata pesada, anterior ao uso de moeda cunhada.
- source_word: כְּמֹהַר
  choice: equivalente ao preço nupcial
  rationale: מֹהַר designa o pagamento matrimonial feito à família da noiva; “preço nupcial” é conciso e evita sugerir que se trata de dote levado pela noiva.
- source_word: הַבְּתוּלֹת
  choice: das virgens
  rationale: O plural com artigo aponta para o valor costumeiro aplicável à categoria das jovens virgens.
