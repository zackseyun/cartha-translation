  verdict: revise
  source_fidelity: A tradução preserva adequadamente a condição, a ênfase de מָאֵן יְמָאֵן, o sentido matrimonial idiomático de לְתִתָּהּ לוֹ e o pagamento em prata pesada expresso por יִשְׁקֹל. O sujeito de «pesará» é o homem do caso jurídico precedente, não o pai; explicitá-lo evita uma ambiguidade sintática indevida em português.
  naturalness: O registro é claro e jurídico. «O homem deverá pesar prata» conserva a imagem concreta hebraica e torna inequívoco quem tem a obrigação. A nota cultural deve evitar «metal pesado», expressão que em português normalmente designa uma categoria química, não metal pesado em balança.
  terminology: «Preço nupcial» é uma solução apropriada para מֹהַר e evita a ambiguidade de «dote». «Virgens» corresponde ao termo hebraico sem introduzir qualificações não expressas.
  issues:
