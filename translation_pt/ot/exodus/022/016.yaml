    issue: Ambiguidade do sujeito em «ele pesará prata»
    rationale: Após «o pai dela», o pronome masculino pode ser lido como retomando o pai. No contexto legal, porém, o responsável pelo pagamento é o homem mencionado no caso anterior. «O homem deverá» explicita essa referência contextual sem alterar o sentido.
  - severity: medium
    issue: A nota b usa «metal pesado»
    rationale: Em português moderno, «metal pesado» costuma referir-se a elementos químicos, não ao ato de pesar metal para pagamento. «Prata pesada em balança» comunica com precisão a prática antiga refletida pelo hebraico.
