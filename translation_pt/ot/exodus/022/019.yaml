  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: pt
  text: Quem sacrificar a qualquer deus, a não ser a Yahweh somente, será dedicado à destruição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será posto sob interdição” ou “será completamente destruído”. O verbo hebraico transmite a ideia de ser irrevogavelmente destinado à destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Quem sacrificar
  rationale: O particípio qal é usado substantivamente para designar qualquer pessoa que pratique o ato; a construção relativa indefinida é natural em português e preserva o sentido cultual de sacrificar.
- source_word: לָאֱלֹהִים
  choice: a qualquer deus
  rationale: 'Embora אֱלֹהִים tenha forma plural, o contexto exige sentido genérico e distributivo: qualquer divindade que não seja Yahweh.'
- source_word: יָחֳרָם
  choice: será dedicado à destruição
  rationale: O hofal de חרם indica ser colocado sob interdição, irrevogavelmente destinado à destruição; a formulação conserva tanto a dimensão de consagração quanto a penal.
- source_word: בִּלְתִּי
  choice: exceto
  rationale: Introduz aqui uma exceção e é vertido de modo direto e corrente.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém a preposição exigida pelo verbo sacrificar e translitera o nome divino do texto hebraico.
- source_word: לְבַדּוֹ
  choice: somente
  rationale: Expressa a exclusividade do destinatário legítimo do sacrifício; junto de 'exceto', torna explícito que Yahweh é a única exceção.
theological_decisions:
- issue: Sentido penal e cultual de חרם
  choice: será dedicado à destruição
  alternative: será completamente destruído; será posto sob interdição
  rationale: O hebraico não expressa apenas morte ou destruição, mas a colocação sob חֵרֶם, uma destinação irrevogável à destruição. A tradução retém essa tensão sem empregar jargão no texto principal.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio do Deus de Israel; 'Yahweh' o representa diretamente e o distingue do termo comum para 'Senhor'.
translation_notes:
  register: Português moderno, claro e digno, com construção jurídica concisa. 'Qualquer deus' preserva o valor genérico do hebraico; 'dedicado à destruição' mantém a linguagem técnica de חרם de forma compreensível.
