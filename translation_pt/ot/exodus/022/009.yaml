base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: pt
  text: Se um homem entregar ao seu próximo um jumento, um boi, um animal do rebanho ou qualquer animal para que o seu próximo o guarde, e o animal morrer, ficar ferido[a] ou for levado embora, sem que ninguém tenha visto[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “for quebrado”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, sem nenhuma testemunha ocular do que aconteceu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz a condição típica de uma lei casuística; “Se” é natural e preciso em português jurídico.
- source_word: יִתֵּן
  choice: entregar
  rationale: Neste contexto, נתן descreve a entrega de um bem aos cuidados de outra pessoa. “Entregar” comunica isso naturalmente sem acrescentar a ideia mais específica de transferência de propriedade.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o singular masculino explícito do hebraico, embora a formulação legal tenha valor representativo.
- source_word: אֶל רֵעֵהוּ
  choice: ao seu próximo
  rationale: רֵעַ designa outra pessoa da mesma comunidade ou esfera social; “próximo” é tradicional, claro e adequado ao registro legal.
- source_word: חֲמוֹר
  choice: jumento
  rationale: Equivalente corrente e inequívoco para o animal doméstico mencionado.
- source_word: שׁוֹר
  choice: boi
  rationale: Equivalente usual em leis sobre animais domésticos e propriedade.
- source_word: שֶׂה
  choice: animal do rebanho
  rationale: שֶׂה pode designar uma ovelha ou uma cabra individualmente. A expressão preserva essa abrangência lexical sem escolher arbitrariamente uma das espécies.
- source_word: וְכָל בְּהֵמָה
  choice: ou qualquer outro animal
  rationale: בְּהֵמָה refere-se aqui aos animais domésticos em geral. Em uma enumeração portuguesa, “ou” e “outro” tornam explícita a função inclusiva da categoria geral, sem alterar o sentido.
- source_word: לִשְׁמֹר
  choice: para que ele o guarde
  rationale: Expressa a finalidade da entrega e o dever de custódia indicado por שׁמר.
- source_word: וּמֵת
  choice: e o animal morrer
  rationale: A repetição de “o animal” evita ambiguidade de referente em português e reproduz com naturalidade a primeira eventualidade legal.
- source_word: נִשְׁבַּר
  choice: ficar ferido
  rationale: O sentido literal é “ser quebrado”, mas, aplicado a um animal, indica sofrer lesão. “Ficar ferido” é idiomático, e o teor literal fica registrado em nota.
- source_word: נִשְׁבָּה
  choice: for levado embora
  rationale: O Nifal de שׁבה indica ser capturado ou levado. A formulação mantém a ideia ampla de remoção por agente externo sem reduzi-la necessariamente a furto.
- source_word: אֵין רֹאֶה
  choice: sem que ninguém tenha visto
  rationale: Reproduz de modo natural a ausência de testemunha ocular indicada literalmente por “não há quem veja”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência de lei casuística. “Animal do rebanho” preserva a amplitude de שֶׂה, que pode ser ovelha ou cabra; “qualquer outro animal” mantém a progressão dos exemplos para a categoria geral. A vírgula final foi preservada porque o período legal continua no versículo seguinte.
