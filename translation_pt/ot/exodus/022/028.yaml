base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: pt
  text: Não atrase a entrega da abundância da sua colheita nem do líquido da sua prensa.[a] Você me dará o primogênito de seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua produção abundante nem o seu suco/vinho”. Os termos hebraicos provavelmente se referem à produção colhida e à produção líquida extraída. O par exato pode ser cereal e vinho ou, mais genericamente, produção sólida e líquida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: a abundância da sua colheita
  rationale: O substantivo מְלֵאָה denota literalmente plenitude ou produção abundante; neste contexto legal, refere-se à produção agrícola devida. A formulação mantém a ideia concreta sem tratar a palavra como uma abstração.
- source_word: וְדִמְעֲךָ
  choice: o líquido da sua prensa
  rationale: Embora דִּמְעָה possa significar literalmente “lágrima”, aqui designa, por extensão, a produção líquida extraída, provavelmente vinho ou azeite. A tradução conserva a imagem agrícola sem especificar além do hebraico.
- source_word: לֹא תְאַחֵר
  choice: Não atrase a entrega
  rationale: O piel de אחר significa atrasar ou adiar. A inclusão de “a entrega” torna natural em português a proibição de retardar aquilo que é devido, sem acrescentar um objeto estranho ao contexto.
- source_word: בְּכוֹר
  choice: o primogênito
  rationale: בכור designa o primeiro filho nascido e, junto de “seus filhos”, indica aqui o primogênito masculino. “Primogênito” é a forma tradicional, precisa e corrente em português.
- source_word: בָּנֶיךָ
  choice: de seus filhos
  rationale: O hebraico emprega especificamente o substantivo masculino “filhos”; a tradução preserva essa referência em vez de neutralizá-la como “crianças”.
- source_word: תִּתֶּן לִּי
  choice: Você me dará
  rationale: O imperfeito assume força normativa neste corpo legal. “Você me dará” preserva a forma direta e solene do mandamento, bem como Deus como destinatário.
theological_decisions:
- issue: Sentido do par agrícola מְלֵאָה / דִמְעָה numa lei sobre ofertas
  choice: A ordem abrange tanto a produção colhida quanto a produção líquida extraída, sem demora na entrega.
  alternative: Os termos poderiam designar especificamente cereal e vinho, ou, de modo mais geral, as primícias sem uma distinção rígida entre tipos de produção.
  rationale: O hebraico parece emparelhar produção sólida e líquida, mas não identifica explicitamente cada produto. A tradução preserva essa amplitude e evita restringir o segundo termo somente a vinho ou azeite.
- issue: Referente de בָּנֶיךָ
  choice: filhos
  alternative: crianças
  rationale: O termo hebraico é masculino e ocorre numa regra sobre o primogênito. Preservar “filhos” mantém a precisão textual sem introduzir uma leitura doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” reproduz o destinatário individual do hebraico. A construção “líquido da sua prensa” retém a imagem original e a nota registra as alternativas lexicais genuínas.
