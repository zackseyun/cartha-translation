  text: You shall not let a sorceress live[a].
translation:
  language: pt
  text: Não deixe uma feiticeira viver[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bruxa”. O substantivo hebraico está no feminino singular e se refere especificamente a uma mulher que pratica feitiçaria.
    reason: Alternativa lexical e esclarecimento da marca feminina presente no hebraico.
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: uma feiticeira
  rationale: O substantivo hebraico está no feminino singular e designa uma mulher que pratica feitiçaria ou magia. “Feiticeira” preserva essa marca de gênero e evita parte das associações culturais posteriores de “bruxa”.
- source_word: לֹא
  choice: não
  rationale: Partícula comum de negação, aqui empregada para formular uma proibição legal.
- source_word: תְחַיֶּה
  choice: deixe ... viver
  rationale: A forma piel imperfeita, na segunda pessoa masculina singular, tem aqui o sentido de “manter viva” ou “deixar viver”. A construção escolhida é natural em português e preserva a formulação hebraica sem explicitar um método de execução que o texto não menciona.
theological_decisions:
- issue: Gênero da pessoa que pratica feitiçaria
  choice: 'Preservar o feminino singular: “feiticeira”.'
  alternative: Generalizar como “feiticeiro” ou “quem pratica feitiçaria”.
  rationale: A forma hebraica é explicitamente feminina; neutralizá-la eliminaria uma característica real do texto-fonte.
- issue: Força da proibição legal
  choice: Traduzir como proibição de deixar a feiticeira viver.
  alternative: 'Explicitar interpretativamente: “deve ser morta”.'
  rationale: Embora o efeito jurídico seja uma pena de morte no contexto dessas leis, o hebraico diz literalmente que não se deve “deixar viver” ou “manter viva”. A tradução conserva essa formulação e não acrescenta um procedimento que o versículo não declara.
translation_notes:
  register: Português atual, conciso e solene, com boa legibilidade no Brasil e compreensão internacional. O imperativo de tratamento formal “deixe” representa naturalmente a proibição hebraica dirigida à segunda pessoa masculina singular, que funciona de modo corporativo no contexto da lei da aliança.
