base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: pt
  text: Se você emprestar dinheiro[b] ao meu povo[a], ao pobre que está em seu meio, não seja para ele como um credor[c]; não lhe imponham juros[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando você emprestar dinheiro ao meu povo”. O hebraico usa uma forma condicional comum na formulação de leis casuísticas.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “prata”; aqui, no sentido de dinheiro.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não o pressione como quem cobra uma dívida”. O termo hebraico pode destacar o credor que exige o pagamento.'
    reason: lexical_alternative
  - marker: d
    text: O hebraico passa aqui da segunda pessoa do singular (“você”) para a segunda pessoa do plural (“vocês”).
    reason: grammatical_clarification
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: A partícula é formalmente condicional. Em leis casuísticas também pode introduzir uma situação esperada, mas “se” preserva a forma hebraica sem impedir esse sentido jurídico.
- source_word: כֶּסֶף
  choice: dinheiro
  rationale: Embora o sentido literal seja “prata”, no contexto econômico o termo designa dinheiro; essa é a forma clara e corrente em português.
- source_word: תַּלְוֶה
  choice: emprestar
  rationale: O hifil de לוה significa conceder um empréstimo. “Emprestar” é natural e semanticamente preciso.
- source_word: עַמִּי
  choice: meu povo
  rationale: Preserva a primeira pessoa do sufixo e não acrescenta “Israel”, embora o contexto identifique o povo.
- source_word: הֶעָנִי
  choice: o pobre
  rationale: O hebraico traz um substantivo adjetival masculino singular, aqui vertido de modo direto e idiomático.
- source_word: עִמָּךְ
  choice: que está em seu meio
  rationale: A expressão significa literalmente “com você”; no contexto comunitário, “em seu meio” comunica de forma natural que o pobre pertence à comunidade próxima do destinatário.
- source_word: כְּנֹשֶׁה
  choice: como credor
  rationale: O particípio designa o credor, especialmente enquanto exige o pagamento. “Credor” conserva o termo econômico sem tornar explícito além do texto o grau de pressão exercida.
- source_word: תְשִׂימוּן עָלָיו נֶשֶׁךְ
  choice: não lhe imponham juros
  rationale: A construção idiomática é literalmente “não coloquem sobre ele juros”. “Impor juros” mantém a imagem de uma obrigação posta sobre o devedor e expressa claramente a proibição.
theological_decisions:
- issue: Força jurídica de אִם
  choice: Se você emprestar
  alternative: Quando você emprestar
  rationale: Em legislação casuística, “se” pode apresentar um caso regulado sem indicar que o empréstimo seja improvável. A tradução conserva a forma condicional e registra a leitura temporal na nota.
- issue: Referência masculina singular em הֶעָנִי
  choice: o pobre
  alternative: a pessoa pobre
  rationale: “O pobre” reproduz o singular masculino do hebraico e permanece natural em português, sem acrescentar a palavra “homem”.
- issue: Natureza dos juros proibidos
  choice: juros
  alternative: usura
  rationale: נֶשֶׁךְ designa juros cobrados sobre o empréstimo neste caso. “Usura” poderia restringir indevidamente a proibição a juros excessivos ou abusivos.
- issue: Mudança do singular para o plural na formulação da proibição
  choice: Se você... não aja... não lhe imponham
  alternative: Se vocês... não ajam... não lhe imponham
  rationale: O hebraico começa com formas de segunda pessoa singular e termina com uma forma plural. A tradução conserva essa mudança, embora ela soe incomum, e a explica em nota em vez de uniformizá-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação preserva o caráter jurídico do versículo, o singular de “o pobre” e a mudança incomum do destinatário singular para o plural, explicada em nota.
