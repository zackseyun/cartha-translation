base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: pt
  text: 'Fundiu quatro argolas de ouro para ela, nos seus quatro pés[a]: duas argolas de um lado e duas do outro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos seus quatro cantos” ou “nos seus quatro suportes”; o termo hebraico pode designar pés, extremidades inferiores ou pontos de apoio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Fundiu
  rationale: No contexto de trabalho com metal, יצק descreve a produção por fundição; “fundiu” é conciso e natural em português.
- source_word: לוֹ
  choice: para ela
  rationale: O sufixo retoma a arca; embora אָרוֹן seja masculino em hebraico, “arca” é feminino em português.
- source_word: טַבְּעֹת זָהָב
  choice: argolas de ouro
  rationale: “Argolas” designa naturalmente as peças destinadas à passagem dos varais, e “de ouro” reproduz com clareza a relação do hebraico.
- source_word: עַל אַרְבַּע פַּעֲמֹתָיו
  choice: nos seus quatro pés
  rationale: פַּעֲמוֹת pode indicar pés ou extremidades inferiores; “pés” é a equivalência direta mais provável neste contexto, sem ocultar as alternativas, registradas em nota.
- source_word: צַלְעוֹ
  choice: lado
  rationale: Em descrições de objetos, צֵלָע significa naturalmente “lado”.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: de um lado ... do outro
  rationale: Expressa em português corrente a oposição hebraica literal entre “o lado um” e “o segundo”, sem alterar a distribuição das argolas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente. O referente pronominal foi ajustado ao gênero de “arca” em português, e a ambiguidade de פַּעֲמֹתָיו foi preservada em nota.
