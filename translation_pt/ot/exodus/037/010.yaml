  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: pt
  text: Fez a mesa de madeira de acácia. Ela tinha dois côvados de comprimento, um côvado de largura e um côvado e meio de altura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol apresenta a ação seguinte da narrativa no passado. Em português, “Fez” é natural e não exige reproduzir mecanicamente o waw inicial com “E”.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O substantivo definido designa claramente a mesa do santuário.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A expressão construta refere-se à madeira da acácia; esta formulação é clara e corrente em português.
- source_word: אַמָּתַיִם
  choice: dois côvados
  rationale: Mantém a unidade histórica de medida e traduz exatamente a forma dual.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: Expressa de modo idiomático a dimensão indicada pelo substantivo com sufixo possessivo, retomando a mesa.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: um côvado de largura
  rationale: Preserva a medida e apresenta a dimensão em português natural.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: um côvado e meio de altura
  rationale: Reproduz exatamente a medida vertical e mantém a ordem conceitual do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. A primeira frase conserva o sujeito implícito do hebraico; a segunda explicita “Ela” para apresentar as três dimensões com fluidez. Não foi mantida a nota inglesa, pois ela afirma incorretamente que “um côvado e meio” corresponde ao hebraico ligado à medida de dois côvados; no texto hebraico, “dois côvados” é o comprimento, enquanto “um côvado e meio” é a altura.
