  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: pt
  text: Fez para ele duas argolas de ouro debaixo de sua borda[a], nas suas duas peças laterais, nos seus dois lados[b], como suportes para as varas, para carregá-lo com elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “debaixo de sua moldura”. O hebraico זֵר se refere à borda ou moldura decorativa ao redor da parte superior.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete duas expressões relacionadas: “nas suas duas peças laterais, nos seus dois lados”. A tradução conserva ambas em vez de eliminar a repetição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי טַבְּעֹת זָהָב
  choice: duas argolas de ouro
  rationale: A conjunção dá continuidade à descrição; טַבְּעֹת designa argolas metálicas usadas como acessórios para transportar o mobiliário sagrado.
- source_word: עָשָׂה ל/וֹ
  choice: Fez para ele
  rationale: O pronome retoma o altar no contexto. Em português, o referente masculino permite a formulação natural «para ele».
- source_word: מִ/תַּחַת לְ/זֵר/וֹ
  choice: debaixo de sua borda
  rationale: זֵר indica a borda ou moldura decorativa ao redor da parte superior. «Borda» é clara e evita a possível leitura régia de «coroa».
- source_word: עַל שְׁתֵּי צַלְעֹתָי/ו
  choice: sobre suas duas peças laterais
  rationale: צלע pode significar lado, costela ou peça lateral. Aqui, «peças laterais» expressa o provável sentido estrutural e o distingue da expressão seguinte.
- source_word: עַל שְׁנֵי צִדָּי/ו
  choice: em seus dois lados
  rationale: צד é o termo comum para «lado». A tradução conserva a repetição próxima do hebraico em vez de eliminá-la.
- source_word: לְ/בָתִּים לְ/בַדִּים
  choice: como suportes para as varas
  rationale: בָּתִּים significa literalmente «casas», mas aqui designa encaixes ou suportes; בַּדִּים são as varas usadas no transporte.
- source_word: לָ/שֵׂאת אֹת/וֹ בָּ/הֶם
  choice: com as quais seria carregado
  rationale: O infinitivo exprime finalidade e בָּהֶם, instrumento. A construção passiva é natural em português e mantém o altar como referente.
