    issue: «com as quais seria carregado»
    rationale: O hebraico לָשֵׂאת exprime finalidade («para carregar»), não uma condição ou futuro no passado. A formulação passiva com «seria» é menos fiel ao aspecto funcional da frase.
  - severity: low
    issue: Alternância «sobre suas duas peças laterais, em seus dois lados»
    rationale: As duas expressões hebraicas usam a mesma preposição עַל. Em português, «nas suas duas peças laterais, nos seus dois lados» preserva a distinção lexical e a repetição, com construção mais fluente.
