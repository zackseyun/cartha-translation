  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: pt
  text: Seus botões[a] e seus braços formavam uma só peça com ela[b]; toda ela era uma única obra de ouro puro, trabalhada a martelo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus ornamentos arredondados”; o termo hebraico designa uma peça ornamental arredondada, provavelmente concebida aqui como um botão floral.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dela”; isto é, os botões e os braços eram feitos da mesma peça que o próprio candelabro.
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “toda ela era uma só peça de ouro puro batido” ou “toda ela foi feita de uma única peça de ouro puro, batida a martelo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: seus botões
  rationale: No contexto do candelabro, o termo designa ornamentos arredondados ligados à decoração floral. “Botões” comunica essa imagem de modo concreto e natural, sem recorrer ao sentido arquitetônico de “capitéis”.
- source_word: וּקְנֹתָם
  choice: e seus braços
  rationale: Embora קָנֶה possa significar “cana” ou “haste”, aqui se refere às partes que se projetam do candelabro; “braços” é a designação portuguesa mais clara e corrente nesse contexto.
- source_word: מִמֶּנָּה
  choice: com ela
  rationale: Literalmente “dela”, a expressão indica que os ornamentos e os braços saíam da própria peça e não eram componentes acrescentados. “Formavam uma só peça com ela” transmite essa construção integral.
- source_word: הָיוּ
  choice: formavam
  rationale: O verbo copulativo expressa aqui o estado ou a constituição das partes. “Formavam” produz uma frase natural em português e explicita sem excesso a unidade material indicada pelo contexto.
- source_word: כֻּלָּהּ
  choice: toda ela
  rationale: Preserva a ênfase abrangente do feminino singular, que retoma o candelabro como um todo.
- source_word: מִקְשָׁה אַחַת
  choice: uma única obra [...] trabalhada a martelo
  rationale: מִקְשָׁה descreve metal moldado por martelamento, enquanto אַחַת ressalta a unidade da obra. A formulação conserva as duas ideias em português natural.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: É a tradução direta, clara e tradicional da descrição do material.
