  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: pt
  text: Fundiu para ela quatro argolas de ouro e colocou as argolas nos quatro cantos, junto aos seus quatro pés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos quatro cantos que ficam junto às suas quatro pernas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Fez ... de ouro fundido
  rationale: No contexto da fabricação de peças metálicas do tabernáculo, o verbo descreve a fundição do metal. Esta formulação é natural em português e deixa claro o processo.
- source_word: לוֹ
  choice: para ela
  rationale: O sufixo pronominal retoma a mesa, substantivo feminino em português.
- source_word: טַבְּעֹת
  choice: argolas
  rationale: Designa as peças circulares pelas quais passariam as varas de transporte; “argolas” é claro e corrente em português.
- source_word: זָהָב
  choice: ouro
  rationale: Tradução direta da indicação do material.
- source_word: וַיִּתֵּן
  choice: colocou
  rationale: Expressa de modo natural o posicionamento das argolas na mesa.
- source_word: עַל
  choice: nos
  rationale: A preposição indica a localização das argolas nos ou junto aos cantos; “nos quatro cantos” é idiomático em português.
- source_word: פֵּאֹת
  choice: cantos
  rationale: No contexto de mobiliário, refere-se às quatro extremidades ou aos cantos da mesa.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: junto aos seus quatro pés
  rationale: Preserva a relação espacial entre os cantos e os quatro pés da mesa sem tornar a frase excessivamente literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Pés” preserva a imagem lexical do hebraico, enquanto a nota registra a alternativa “pernas”. O feminino de “ela” retoma a mesa mencionada no contexto imediato.
