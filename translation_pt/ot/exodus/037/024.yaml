  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: pt
  text: Ele fez o candelabro e todos os seus utensílios com um talento de ouro puro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus objetos” ou “todos os seus instrumentos”. O termo hebraico כֵּלִים é amplo e se refere aos utensílios associados ao candelabro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: um talento
  rationale: No contexto da construção do santuário, designa a unidade de peso chamada talento. A expressão preserva a medida antiga sem introduzir uma conversão incerta.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Tradução natural e direta da expressão hebraica, adequada ao contexto dos materiais empregados na fabricação.
- source_word: עָשָׂה
  choice: fez
  rationale: Reproduz de modo simples o verbo hebraico comum para fazer ou fabricar.
- source_word: אֹתָהּ
  choice: o candelabro
  rationale: O sufixo feminino singular retoma a menorá mencionada no contexto anterior. A repetição do substantivo em português torna o referente inequívoco e evita a forma pronominal potencialmente pouco clara.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: e todos os seus utensílios
  rationale: כֵּלִים é um termo amplo para objetos, instrumentos ou recipientes associados a algo; “utensílios” é natural e abrangente neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Candelabro” explicita o antecedente contextual do pronome hebraico, e “talento” conserva a unidade antiga de peso.
