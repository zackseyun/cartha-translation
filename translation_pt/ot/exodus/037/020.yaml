translation:
  language: pt
  text: E no candelabro havia quatro cálices em forma de flores de amendoeira, com seus botões e suas flores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: E no candelabro havia
  rationale: A conjunção e a preposição indicam localização. “No candelabro” é natural em português e comunica que os ornamentos faziam parte dele.
- source_word: אַרְבָּעָה
  choice: quatro
  rationale: Número cardinal que modifica o substantivo masculino plural seguinte.
- source_word: גְבִעִים
  choice: cálices
  rationale: O termo designa elementos ornamentais em forma de taça; “cálices” preserva essa forma e se ajusta ao contexto do candelabro.
- source_word: מְשֻׁקָּדִים
  choice: em forma de flores de amendoeira
  rationale: O particípio descreve os cálices como trabalhados segundo o formato ou padrão da flor da amendoeira.
- source_word: כַּפְתֹּרֶיהָ
  choice: seus botões
  rationale: O substantivo designa saliências ornamentais arredondadas. “Botões” mantém tanto a forma projetada quanto a imagem vegetal do conjunto.
- source_word: וּפְרָחֶיהָ
  choice: e suas flores
  rationale: Tradução direta e clara do substantivo, em harmonia com a ornamentação vegetal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem sacrificar a naturalidade. A sequência final permanece em aposição, sem acrescentar “com”, preservando a estrutura concisa e a possível relação ornamental entre cálices, botões e flores.
