base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: pt
  text: 'Fez os utensílios que estavam sobre a mesa: seus pratos[a], suas taças, suas jarras e suas tigelas, com as quais se derramava a oferta de bebida, todos de ouro puro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas travessas, seus pequenos recipientes, seus jarros e suas tigelas”. Vários termos para recipientes neste versículo são raros ou próprios desse contexto, por isso sua identificação exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: Termo abrangente e natural para os objetos ou recipientes associados à mesa.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: que ficavam sobre a mesa
  rationale: Reproduz de modo natural a construção hebraica literalmente espacial, sem reduzi-la apenas à ideia de finalidade ou posse.
- source_word: קְעָרֹתָיו
  choice: seus pratos
  rationale: קְעָרָה designa um prato ou recipiente raso; 'pratos' é claro e adequado ao contexto da mesa.
- source_word: כַּפֹּתָיו
  choice: suas taças
  rationale: Neste contexto, o termo parece designar pequenos recipientes; 'taças' é acessível e evita a imagem inadequada de colheres comuns.
- source_word: מְנַקִּיֹּתָיו
  choice: suas jarras
  rationale: O termo é raro e provavelmente designa recipientes ligados ao serviço da mesa; 'jarras' comunica um vaso apropriado para conter ou verter líquido, sem arcaísmo.
- source_word: הַקְּשָׂוֹת
  choice: suas tigelas
  rationale: Designa outro tipo de recipiente associado às libações; 'tigelas' o distingue naturalmente das taças e jarras, embora a identificação exata seja incerta.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: com as quais se derramava a oferta de bebida
  rationale: Preserva a construção passiva/impessoal do Hofal e explicita o sentido cultual de נסך. O singular verbal é mantido na formulação genérica.
- source_word: זָהָב טָהוֹר
  choice: tudo de ouro puro
  rationale: Deixa claro em português que o material se aplica ao conjunto dos utensílios enumerados.
