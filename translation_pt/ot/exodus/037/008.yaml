  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: pt
  text: um querubim numa extremidade, de um lado, e outro querubim na outra extremidade, do outro lado; fez os querubins a partir do propiciatório[a], em suas duas extremidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tampa” ou “tampa da expiação”; em hebraico, kappóret, a cobertura de ouro da arca.
    reason: Registra alternativas lexicais e explica o referente físico do termo cultual.
lexical_decisions:
- source_word: כְּרוּב
  choice: querubim
  rationale: Mantém o termo estabelecido para os seres guardiões associados à arca, sem acrescentar uma descrição especulativa.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: numa extremidade, de um lado ... na outra extremidade, do outro lado
  rationale: Expressa com clareza e naturalidade a disposição dos querubins em extremidades opostas, preservando a repetição espacial do hebraico.
- source_word: הַכַּפֹּרֶת
  choice: o propiciatório
  rationale: Usa o termo cultual tradicional em português para a cobertura de ouro da arca e preserva suas associações rituais; uma nota apresenta alternativas mais transparentes.
- source_word: עָשָׂה
  choice: fez
  rationale: Equivalente direto e natural do verbo comum hebraico, sem ornamentação estilística desnecessária.
- source_word: מִן הַכַּפֹּרֶת
  choice: a partir do propiciatório
  rationale: Preserva a ideia de origem ou integração material expressa por מִן sem explicitar além do texto se os querubins formavam uma só peça com a cobertura.
- source_word: מִשְּׁנֵי קְצֹוֹתָיו
  choice: nas duas extremidades dele
  rationale: Indica a localização dos querubins em relação ao propiciatório e deixa inequívoco que o pronome retoma esse objeto.
theological_decisions:
- issue: Tradução de הַכַּפֹּרֶת no contexto da arca
  choice: propiciatório
  alternative: tampa; tampa da expiação
  rationale: “Propiciatório” conserva o valor cultual reconhecido do termo sem reduzir o objeto a uma tampa comum nem impor uma única explicação teológica. A nota esclarece sua realidade física e registra alternativas.
- issue: Relação material entre os querubins e o propiciatório
  choice: a partir do propiciatório
  alternative: formando uma só peça com o propiciatório
  rationale: A formulação escolhida mantém a imagem do hebraico e evita transformar em afirmação explícita a inferência de que os querubins eram uma peça contínua com a cobertura.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico estabelecido. A construção coordenada conserva o paralelismo espacial do hebraico. A inicial minúscula reflete que o versículo continua a construção iniciada no contexto anterior.
