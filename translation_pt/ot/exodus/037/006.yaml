  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: pt
  text: Fez o propiciatório[a] de ouro puro; seu comprimento era de dois côvados e meio, e sua largura, de um côvado e meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tampa da expiação”. O termo hebraico designa a cobertura de ouro da arca e tem associações com a expiação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à sequência narrativa passada; em português, o sujeito pode ficar implícito e a conjunção pode ser omitida com naturalidade.
- source_word: כַּפֹּרֶת
  choice: o propiciatório
  rationale: Termo bíblico consagrado em português para a cobertura de ouro da arca ligada ao rito de expiação; a nota oferece uma alternativa mais transparente.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: Expressa naturalmente em português o material de que o objeto foi feito.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dois côvados e meio
  rationale: Reproduz de modo idiomático a medida hebraica de dois côvados mais meio.
- source_word: אָרְכָּהּ
  choice: seu comprimento era
  rationale: O sufixo remete ao propiciatório; o verbo copulativo é suprido para formar uma oração natural em português.
- source_word: וְאַמָּה וָחֵצִי
  choice: e um côvado e meio
  rationale: Mantém com clareza a medida hebraica de um côvado mais meio.
- source_word: רָחְבָּהּ
  choice: sua largura
  rationale: Equivalente moderno e claro para a dimensão indicada pelo hebraico.
theological_decisions:
- issue: Tradução de כַּפֹּרֶת no contexto cultual
  choice: propiciatório
  alternative: tampa da expiação
  rationale: “Propiciatório” preserva a identidade cultual e as associações expiatórias do objeto sem reduzi-lo a uma simples tampa. Como o termo pode também designar concretamente a cobertura da arca, a alternativa explicativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia bíblica reconhecível. A elipse de “era” antes da segunda medida evita repetição sem perder clareza.
