  text: He made poles of acacia wood and overlaid them with gold.
translation:
  language: pt
  text: Fez varas de madeira de acácia e as revestiu de ouro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O qal wayyiqtol de עשה dá continuidade à narrativa com o sentido de “fez”. Em português, não é necessário reproduzir o וַ inicial com “e” para manter a sequência narrativa natural.
- source_word: בַּדֵּי
  choice: varas
  rationale: No contexto dos utensílios do santuário, בַּד designa as varas usadas para transportá-los. “Varas” é claro, corrente e tradicional sem ser arcaico.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A cadeia construta indica madeira proveniente da acácia. A formulação explicita naturalmente o material em português moderno.
- source_word: וַיְצַף
  choice: e as revestiu
  rationale: Neste contexto artesanal, צפה significa cobrir ou revestir uma peça com outro material. “Revestiu” expressa de modo natural a aplicação do ouro sobre as varas.
- source_word: אֹתָם
  choice: as
  rationale: O pronome de objeto plural retoma “varas”, substantivo feminino em português.
- source_word: זָהָב
  choice: de ouro
  rationale: O substantivo indica o material do revestimento; após “revestiu”, a construção idiomática em português é “de ouro”.
