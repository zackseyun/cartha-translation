translation:
  language: pt
  text: Fez as sete lâmpadas do candelabro, suas pinças[a] e seus recipientes[b], tudo de ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apagadores de pavio”; o termo hebraico designa um utensílio usado para cuidar das lâmpadas e manejar os pavios.
    reason: lexical_alternative
  - marker: b
    text: Ou “bandejas” ou “braseiros”; neste contexto, provavelmente eram pequenos receptáculos associados ao cuidado das lâmpadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa; em português, o pretérito perfeito expressa isso naturalmente sem exigir a conjunção.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: as sete lâmpadas do candelabro
  rationale: נֵרוֹת designa lâmpadas, e o sufixo feminino singular remete ao candelabro no contexto. Explicitar o referente evita o possessivo ambíguo e mantém a distinção entre as lâmpadas e o candelabro.
- source_word: מַלְקָחֶיהָ
  choice: suas pinças
  rationale: O termo indica um utensílio usado no cuidado das lâmpadas, provavelmente para manejar os pavios. “Pinças” é concreto e menos interpretativo que “apagadores”.
- source_word: מַחְתֹּתֶיהָ
  choice: seus recipientes
  rationale: O substantivo pode designar pequenos receptáculos, braseiros ou bandejas. No contexto do candelabro, “recipientes” preserva a função geral sem sugerir indevidamente um utensílio do altar.
- source_word: זָהָב טָהוֹר
  choice: tudo de ouro puro
  rationale: A expressão indica o material dos objetos enumerados. “Tudo de ouro puro” torna claro, em português natural, que a especificação se aplica ao conjunto.
