  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: pt
  text: Fez as varas de madeira de acácia e as revestiu de ouro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O qal wayyiqtol de עשה dá continuidade à narrativa com uma ação passada. Em português, a conjunção pode ser omitida aqui sem perda da sequência narrativa.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: No contexto dos utensílios do santuário, בַּדִּים designa as varas usadas para transportá-los. “Varas” é a forma tradicional e clara em português bíblico.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A construção hebraica indica o material de que as varas foram feitas; “madeira de acácia” é natural e precisa em português.
- source_word: וַיְצַף
  choice: e as revestiu
  rationale: Neste contexto artesanal, צפה significa cobrir ou revestir um objeto com outro material. “Revestiu” comunica claramente a aplicação do ouro.
- source_word: אֹתָם
  choice: as
  rationale: O pronome objeto retoma “as varas”; a forma feminina plural segue o gênero do substantivo escolhido em português.
- source_word: זָהָב
  choice: de ouro
  rationale: Após צפה, o hebraico nomeia o material do revestimento. Em português, “revestir de ouro” é a construção idiomática adequada.
