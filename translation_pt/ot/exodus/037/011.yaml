  text: וַ/יְצַ֥ף אֹת֖/וֹ זָהָ֣ב טָה֑וֹר וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/011.yaml
  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: pt
  text: Revestiu-a de ouro puro e fez para ela uma moldura[a] de ouro ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma borda”; tradicionalmente, “uma coroa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: Revestiu
  rationale: O verbo צפה, neste contexto de fabricação do mobiliário do tabernáculo, indica cobrir uma peça com uma camada de metal; “revestiu” é preciso e natural em português.
- source_word: אֹתוֹ
  choice: -a
  rationale: O pronome retoma a mesa do versículo anterior. Em português, a concordância natural é com o substantivo feminino “mesa”.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: A expressão designa ouro de alta pureza; “ouro puro” é a formulação corrente e tradicional sem arcaísmo.
- source_word: וַיַּעַשׂ לוֹ
  choice: fez para ela
  rationale: 'Mantém explícita a relação expressa pela preposição ל: a moldura foi feita para a mesa.'
- source_word: זֵר
  choice: moldura
  rationale: Neste contexto, o termo designa uma borda elevada ou faixa ornamental que contorna a mesa. “Moldura” comunica bem a peça trabalhada, enquanto “coroa” seria excessivamente literal e potencialmente enganosa.
- source_word: זָהָב
  choice: de ouro
  rationale: Tradução direta do material de que era feita a moldura.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa de modo natural em português que a moldura contornava a mesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A colocação do pronome feminino segue o antecedente português “mesa”. O marcador da nota foi posicionado junto a “moldura”, termo ao qual pertence a variante lexical.
