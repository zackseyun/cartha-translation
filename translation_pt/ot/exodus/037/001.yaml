  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: pt
  text: Bezalel fez a arca de madeira de acácia. Ela media dois côvados e meio de comprimento, um côvado e meio de largura e um côvado e meio de altura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um côvado correspondia aproximadamente à distância do cotovelo à ponta dos dedos, cerca de 45 centímetros. Assim, a arca media aproximadamente 1,1 metro de comprimento, 68 centímetros de largura e 68 centímetros de altura.
    reason: Explica a antiga unidade de medida preservada no texto e oferece equivalentes modernos aproximados.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה é o termo comum para fazer; “fez” reproduz seu sentido direto sem acrescentar uma nuance artesanal não expressa.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
- source_word: הָאָרֹן
  choice: a arca
  rationale: Embora אָרוֹן possa designar uma caixa ou baú, neste contexto do tabernáculo refere-se à conhecida arca sagrada; “arca” é preciso e tradicional em português.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A construção hebraica é expressa naturalmente em português como o material de que a arca foi feita.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dois côvados e meio
  rationale: Mantém a antiga unidade de medida e apresenta a quantidade em português natural.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: No enunciado português com “media”, esta formulação transmite de modo natural a dimensão indicada pelo substantivo hebraico com sufixo possessivo.
- source_word: וְאַמָּה וָחֵצִי
  choice: um côvado e meio
  rationale: Tradução direta e idiomática da medida repetida para a largura e a altura.
- source_word: רָחְבּוֹ
  choice: de largura
  rationale: Expressa claramente a dimensão transversal do objeto.
- source_word: קֹמָתוֹ
  choice: de altura
  rationale: Expressa o alcance vertical do objeto no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura foi levemente reorganizada com “ela media” para evitar uma sequência pesada de possessivos, sem alterar as três dimensões do hebraico. A unidade antiga “côvado” foi preservada, e a estimativa métrica ficou em nota.
