base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/021.yaml
  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: pt
  text: Um botão ornamental debaixo de dois braços que saíam dela[a], um botão debaixo de dois braços que saíam dela e um botão debaixo de dois braços que saíam dela, para os seis braços que saíam dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saliência arredondada”; o termo hebraico כפתר refere-se a um elemento ornamental arredondado do candelabro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: botão ornamental
  rationale: Designa o elemento arredondado e decorativo do candelabro. “Botão ornamental” é claro em português atual e evita a possível leitura botânica isolada de “botão”.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Expressa diretamente a posição inferior do ornamento em relação a cada par de braços.
- source_word: שְׁנֵי הַקָּנִים
  choice: cada par de braços
  rationale: קנה designa aqui os braços laterais do candelabro. O distributivo “cada par” torna explícita a relação indicada pelas três ocorrências de “dois braços” sem alterar a estrutura descrita.
- source_word: מִמֶּנָּה
  choice: dela
  rationale: Preserva o pronome feminino singular, cujo referente contextual é o candelabro, sem repetir desnecessariamente o substantivo.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: correspondendo aos seis braços
  rationale: A expressão resume a distribuição dos três ornamentos entre os seis braços laterais; “correspondendo a” comunica essa relação com naturalidade.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: que saíam dela
  rationale: Mantém a imagem verbal dos braços projetando-se do candelabro e concorda temporalmente com a narrativa da fabricação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição hebraica foi preservada em uma enumeração explícita dos três pares, evitando uma formulação excessivamente pesada. “Braços” é mais natural para as projeções laterais do candelabro, enquanto “botão ornamental” conserva a forma arredondada sugerida pelo termo técnico.
