  yaml_path: translation/ot/exodus/037/029.yaml
  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: pt
  text: Fez o óleo sagrado da unção e o incenso aromático puro[a], trabalho de perfumista[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o incenso de especiarias” ou “o incenso de substâncias aromáticas”. A expressão hebraica se refere literalmente a incenso preparado com substâncias aromáticas.
    reason: lexical_alternative
  - marker: b
    text: Ou “obra de perfumista” ou “preparado por um perfumista”. O hebraico ressalta o preparo especializado por um artesão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה descreve uma ação concluída na sequência narrativa. Em português, a omissão do pronome é natural, e o sujeito permanece claro pelo contexto.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: o óleo sagrado da unção
  rationale: A expressão designa óleo separado para uso sagrado na unção. Esta formulação mantém tanto a função cultual quanto a qualidade de santidade em português claro.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: o incenso aromático
  rationale: Literalmente, a expressão se refere a incenso feito de substâncias aromáticas. “Incenso aromático” comunica isso com naturalidade sem reduzir סַמִּים simplesmente a “perfume”.
- source_word: טָהוֹר
  choice: puro
  rationale: No contexto cultual e material, טָהוֹר indica pureza; “puro” é a correspondência portuguesa direta e adequada.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: trabalho de perfumista
  rationale: A frase nominal ressalta a fabricação habilidosa por um especialista em misturar substâncias aromáticas. A tradução preserva essa forma e a nuance artesanal.
