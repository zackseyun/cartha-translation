  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a disposição das asas, o ato de cobrir a tampa e as duas orientações dos querubins. Contudo, o hebraico emprega explicitamente o plural «rostos» (פניהם; פני הכרובים) nas duas ocorrências; o singular em português pode sugerir indevidamente um rosto coletivo.
  naturalness: O texto é claro e de registro apropriado. «Com elas» é compreensível, mas «com as asas» é mais direto e evita um referente pronominal menos nítido. O plural «rostos» também soa natural neste contexto descritivo.
  terminology: «Querubins» é o termo estabelecido e adequado. «Tampa da expiação» comunica o objeto cultual sem depender exclusivamente de «propiciatório»; a nota conserva tanto a alternativa literal quanto o termo tradicional.
  issues:
