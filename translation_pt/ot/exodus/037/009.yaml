base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: pt
  text: Os querubins tinham as asas estendidas para cima, cobrindo a tampa da expiação[a] com as asas. Seus rostos estavam voltados uns para os outros, e os rostos dos querubins estavam voltados para a tampa da expiação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a tampa”; tradicionalmente, “o propiciatório”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: os querubins
  rationale: Mantém o termo tradicional e reconhecível para essas figuras celestiais, usando o plural consagrado em português.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: tinham as asas estendidas para cima
  rationale: Expressa em português natural a postura indicada pela construção participial hebraica e preserva a direção ascendente das asas.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: com elas, cobriam
  rationale: 'Reproduz tanto a ação contínua de cobrir por cima quanto o valor instrumental da preposição: os querubins cobriam o objeto com as asas.'
- source_word: הַכַּפֹּרֶת
  choice: a tampa da expiação
  rationale: Identifica com clareza a peça que cobria a arca e conserva sua associação cultual com a expiação; a nota registra a tradução mais literal e o termo tradicional.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Tinham o rosto voltado um para o outro
  rationale: Traduz naturalmente a expressão recíproca hebraica, literalmente 'cada um para seu irmão', sem introduzir uma relação fraterna inexistente no contexto.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: o rosto dos querubins estava voltado para a tampa da expiação
  rationale: Preserva a repetição e a ênfase do hebraico no rosto dos querubins, sem comprimir a frase em uma simples afirmação de que eles olhavam para a tampa.
theological_decisions:
- issue: Sentido cultual de הַכַּפֹּרֶת
  choice: tampa da expiação
  alternative: tampa; propiciatório
  rationale: O substantivo designa a tampa da arca, mas seu uso cultual está ligado aos ritos de expiação. 'Tampa da expiação' conserva o referente concreto e sua função religiosa sem depender apenas do termo técnico tradicional 'propiciatório'. A nota mantém abertas as principais possibilidades lexicais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. A repetição de “rosto” e “tampa da expiação” foi mantida por refletir a estrutura enfática do hebraico. O plural “querubins” segue o uso português corrente.
