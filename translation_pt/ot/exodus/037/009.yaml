    issue: «Tinham o rosto voltado» / «o rosto dos querubins estava voltado» está no singular.
    rationale: O texto hebraico repete «rostos» no plural. Embora o singular distributivo possa ocorrer em português, na segunda expressão ele pode sugerir um rosto coletivo e enfraquece a repetição formal do plural no original.
  - severity: low
    issue: «com elas» tem antecedente pronominal menos explícito.
    rationale: A expressão se refere às asas, mas repetir «com as asas» é mais claro e preserva explicitamente o valor instrumental de בכנפיהם.
  revised_text: Os querubins tinham as asas estendidas para cima, cobrindo a tampa da expiação[a] com as asas. Seus rostos estavam voltados uns para os outros, e os rostos dos querubins estavam voltados para a tampa da expiação.
  revised_footnotes:
