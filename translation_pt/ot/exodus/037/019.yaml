base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: pt
  text: Cada um dos seis braços que saíam do candelabro tinha três taças em forma de flor de amendoeira, cada uma com botão e flor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Três taças em forma de flor de amendoeira em um braço, com botão e flor; e três taças em forma de flor de amendoeira em um braço, com botão e flor. Assim era nos seis braços que saíam do candelabro.”'
    reason: A tradução principal explicita de forma natural que o mesmo padrão se repetia em cada um dos seis braços; a nota preserva a estrutura repetitiva do hebraico sem acrescentar «outro».
lexical_decisions:
- source_word: גְבִעִים
  choice: taças
  rationale: O substantivo designa ornamentos semelhantes a pequenos recipientes; “taças” é claro, natural e preserva a imagem concreta.
- source_word: מְשֻׁקָּדִים
  choice: em forma de flor de amendoeira
  rationale: No contexto do candelabro, o termo descreve decoração inspirada na amendoeira; a formulação explicita de modo natural o desenho floral.
- source_word: קָנֶה
  choice: braço
  rationale: Aqui se refere a cada elemento lateral que se projeta do candelabro. “Braço” é corrente em português para essa peça e evita a ideia botânica mais forte de “ramo”.
- source_word: כַּפְתֹּר
  choice: botão
  rationale: Designa uma saliência ornamental arredondada. “Botão” conserva a possível associação vegetal e descreve bem a forma, embora “nódulo” também seja possível.
- source_word: פֶרַח
  choice: flor
  rationale: Tradução direta e comum para o ornamento floral indicado pelo substantivo.
- source_word: כֵּן
  choice: Em cada um dos seis braços
  rationale: A construção hebraica aplica o padrão descrito aos seis braços. A reorganização evita a repetição quase idêntica do texto-fonte e comunica de modo natural que a mesma disposição se repetia em todos eles.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: que saíam do candelabro
  rationale: Reproduz claramente a imagem dos braços projetando-se da estrutura central.
- source_word: מְנֹרָה
  choice: candelabro
  rationale: Termo tradicional e amplamente compreensível em português para este suporte de lâmpadas; traduz o objeto sem exigir transliteração.
