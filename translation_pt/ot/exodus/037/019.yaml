  naturalness: «Cada um dos seis braços que saíam do candelabro» é claro e natural em português moderno. «Taças em forma de flor de amendoeira» e «botão e flor» mantêm um registro descritivo apropriado para o mobiliário cultual.
  terminology: «Braços», «candelabro», «taças», «botão» e «flor» são escolhas adequadas. «Botão» pode descrever a saliência ornamental de כַּפְתֹּר sem impor uma identificação técnica excessiva.
