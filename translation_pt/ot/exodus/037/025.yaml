  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: pt
  text: Fez de madeira de acácia o altar do incenso[a]. Ele tinha um côvado de comprimento e um côvado de largura; era quadrado e tinha dois côvados de altura. Seus chifres formavam uma só peça com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “altar de incenso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O verbo com waw consecutivo dá continuidade à narrativa no passado. Em português, a sequência fica clara sem reproduzir mecanicamente a conjunção inicial.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: o altar do incenso
  rationale: A construção hebraica significa literalmente “altar do incenso”. A expressão é natural em português e identifica com clareza a função cultual do objeto.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: “Madeira de acácia” comunica o material de modo claro ao leitor moderno, evitando a transliteração pouco conhecida “madeira de sitim”.
- source_word: אַמָּה
  choice: côvado
  rationale: Mantém a unidade antiga do texto, sem introduzir uma conversão moderna de precisão discutível.
- source_word: אָרְכּוֹ ... רָחְבּוֹ ... קֹמָתוֹ
  choice: Ele tinha um côvado de comprimento e um côvado de largura ... e tinha dois côvados de altura
  rationale: Explicita em português natural as dimensões indicadas pelos sufixos possessivos hebraicos, sem alterar os valores.
- source_word: רָבוּעַ
  choice: era quadrado
  rationale: Traduz o adjetivo predicativo como uma oração completa e idiomática.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Seus chifres formavam uma só peça com ele
  rationale: A expressão indica que os chifres eram parte integrante do altar, e não peças fixadas separadamente. “Formavam uma só peça” transmite esse sentido construtivo com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor brasileiro e vocabulário amplamente compreensível. Conserva os termos concretos tradicionais “côvado” e “chifres”, além da sequência descritiva do hebraico.
