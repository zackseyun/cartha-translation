  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: pt
  text: E colocou as varas nas argolas, nas laterais da arca, para carregá-la.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: colocou
  rationale: Embora בוא tenha o sentido básico de “vir/trazer”, nesta construção descreve a introdução ou colocação das varas nas argolas; “colocou” é natural e não especifica além do hebraico.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: בַּדִּים designa as varas usadas para transportar o mobiliário sagrado; “varas” é claro, corrente e tradicional no contexto.
- source_word: בַּטַּבָּעֹת
  choice: nas argolas
  rationale: A preposição ב indica que as varas foram postas dentro das argolas; em português, “colocou ... nas argolas” comunica naturalmente essa inserção.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: nas laterais da arca
  rationale: צְלָעוֹת pode indicar lados ou estruturas laterais; aqui, “laterais” descreve com clareza a localização das argolas sem impor uma reconstrução técnica.
- source_word: הָאָרֹן
  choice: a arca
  rationale: אָרוֹן refere-se ao cofre sagrado do santuário; “arca” é o termo consagrado e contextualmente adequado em português.
- source_word: לָשֵׂאת
  choice: para carregá-la
  rationale: O infinitivo de נשׂא expressa finalidade. O pronome retoma naturalmente “a arca” e evita uma repetição pesada sem perder informação.
