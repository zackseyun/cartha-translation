lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: junto à moldura
  rationale: לְעֻמַּת indica posição correspondente ou próxima em relação a algo; no contexto da construção da mesa, “junto à moldura” comunica naturalmente a localização sem impor a ideia mais estreita de oposição frontal.
- source_word: בָּתִּים לַבַּדִּים
  choice: suportes para as varas
  rationale: בָּתִּים, literalmente “casas”, designa aqui encaixes ou receptáculos que sustentam as varas; “suportes” é claro e funcional em português.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: usadas para carregar a mesa
  rationale: Expressa a finalidade das varas de modo natural, preservando o sentido do infinitivo לָשֵׂאת.
