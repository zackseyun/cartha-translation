  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: pt
  text: Fez dois querubins de ouro; fez ambos de ouro batido, a partir das duas extremidades do propiciatório.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tampa da expiação”. O termo hebraico se refere à cobertura da arca, associada à expiação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O waw consecutivo dá sequência à narrativa. Em português moderno, “Fez” mantém o fluxo sem exigir a repetição de “E” em cada oração.
- source_word: שְׁנֵי כְרֻבִים
  choice: dois querubins
  rationale: “Querubins” é o plural consagrado e inteligível em português para o hebraico כְרֻבִים.
- source_word: זָהָב
  choice: de ouro
  rationale: O substantivo indica o material de que os querubins foram feitos; “de ouro” é a formulação natural em português.
- source_word: מִקְשָׁה
  choice: de ouro batido
  rationale: מִקְשָׁה descreve trabalho metálico produzido a martelo. “De ouro batido” comunica naturalmente o processo no contexto, retomando o material já expresso, sem impor como sentido lexical principal a ideia interpretativa de “uma só peça”.
- source_word: עָשָׂה אֹתָם
  choice: fez ambos
  rationale: Mantém a repetição do verbo עשה e expressa com clareza que a descrição se aplica aos dois querubins.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: a partir das duas extremidades
  rationale: 'A preposição מִן indica origem ou procedência: os querubins foram trabalhados a partir das extremidades da cobertura.'
- source_word: הַכַּפֹּרֶת
  choice: o propiciatório
  rationale: “Propiciatório” é o termo tradicional e amplamente reconhecido em português para a cobertura de ouro da arca ligada à expiação; uma alternativa mais descritiva é registrada em nota.
theological_decisions:
- issue: Tradução de הַכַּפֹּרֶת no contexto do santuário
  choice: o propiciatório
  alternative: a tampa da expiação; a cobertura
  rationale: “Propiciatório” preserva o termo cultual tradicional e sua conexão canônica, enquanto “tampa da expiação” explicita que se trata da cobertura da arca e sua associação com a expiação. A alternativa é mantida em nota sem decidir além do que o termo hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “fez” acompanha a ênfase do hebraico; “de ouro batido” evita o tecnicismo pouco natural “obra martelada” sem acrescentar a interpretação específica de que tudo formava necessariamente uma única peça.
