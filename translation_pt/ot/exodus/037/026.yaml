  text: וַ/יְצַ֨ף אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: pt
  text: Ele o revestiu de ouro puro — o tampo, as laterais ao redor e os chifres — e fez ao redor dele uma moldura de ouro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma coroa de ouro ao redor”. O termo hebraico se refere a uma borda ou faixa ornamental em torno do objeto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: revestiu
  rationale: No contexto da fabricação dos utensílios do santuário, o verbo indica cobrir o objeto de madeira com uma camada de metal; “revestiu” é natural e preciso em português.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Expressa diretamente a qualidade e pureza do material em linguagem corrente.
- source_word: גַּגּוֹ
  choice: o tampo
  rationale: Embora o substantivo possa significar “teto”, aqui designa a superfície superior de um pequeno altar; “tampo” é claro e adequado ao objeto.
- source_word: קִירֹתָיו
  choice: as laterais
  rationale: O sentido literal é “paredes”, mas, aplicado a esse utensílio, “laterais” comunica naturalmente suas superfícies verticais.
- source_word: סָבִיב
  choice: ao redor
  rationale: Preserva a ideia de extensão circundante de modo idiomático em português.
- source_word: קַרְנֹתָיו
  choice: os chifres
  rationale: Mantém o termo concreto tradicional para as projeções nos cantos do altar, sem dissolver a imagem cultual.
- source_word: זֵר
  choice: moldura
  rationale: O termo designa uma borda ou faixa ornamental em torno do objeto. “Moldura” é compreensível em português moderno, enquanto a tradução tradicional “coroa” pode sugerir indevidamente um adorno para a cabeça.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva a enumeração do hebraico, mas usa “tampo” e “laterais” para descrever naturalmente as partes do altar. O marcador da nota foi colocado junto de “moldura de ouro”, termo ao qual a alternativa lexical efetivamente se refere.
