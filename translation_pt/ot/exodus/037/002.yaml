  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: pt
  text: Revestiu-a de ouro puro, por dentro e por fora, e fez-lhe uma moldura de ouro ao redor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma borda de ouro ao redor dela”. O termo hebraico זֵר designa uma orla decorativa que circunda o objeto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: Revestiu-a
  rationale: O piel de צפה descreve a aplicação de uma camada de metal sobre o objeto. “Revestiu” é preciso e natural no contexto artesanal; o pronome feminino retoma “arca” em português.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: A expressão indica ouro sem impurezas; “ouro puro” é a formulação corrente e adequada ao contexto do santuário.
- source_word: מִבַּיִת וּמִחוּץ
  choice: por dentro e por fora
  rationale: A locução expressa de modo claro e idiomático o revestimento das superfícies interna e externa.
- source_word: וַיַּעַשׂ לוֹ
  choice: e fez-lhe
  rationale: Preserva a função de לֹו, indicando que a peça foi feita para a arca, sem tornar a frase pesada.
- source_word: זֵר זָהָב
  choice: uma moldura de ouro
  rationale: Neste contexto de mobiliário sagrado, זֵר designa uma orla decorativa que circunda o objeto. “Moldura” comunica melhor essa peça do que o sentido literal e potencialmente enganoso de “coroa”.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa de maneira natural que a moldura circundava o objeto.
