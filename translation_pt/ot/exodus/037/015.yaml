  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: pt
  text: Fez as varas de madeira de acácia e as revestiu de ouro, para carregar a mesa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol dá continuidade à sequência narrativa. Em português, a omissão de «e» produz uma narrativa mais natural sem perder a progressão.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: בַּדִּים designa as varas usadas para transportar o mobiliário sagrado. «Varas» é claro, corrente e coerente com o contexto do tabernáculo.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A construção hebraica indica o material. «Madeira de acácia» é a formulação portuguesa natural e identifica a madeira sem recorrer ao arcaico «madeira de sitim».
- source_word: וַיְצַף אֹתָם זָהָב
  choice: e as revestiu de ouro
  rationale: Neste contexto artesanal, צפה significa cobrir ou revestir com metal. «Revestiu de ouro» é natural e preserva a ideia de uma cobertura de ouro.
- source_word: לָשֵׂאת
  choice: para carregar
  rationale: 'O infinitivo com ל expressa finalidade: as varas serviam para carregar a mesa.'
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: Tradução direta de שֻׁלְחָן. Embora o contexto identifique a mesa do tabernáculo, o hebraico diz simplesmente «a mesa».
