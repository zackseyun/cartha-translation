  text: וַ/יַּ֨עַשׂ ל֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וַ/יַּ֧עַשׂ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: pt
  text: Fez ao redor dela uma moldura da largura de um palmo[a] e, ao redor da moldura, fez um friso de ouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma borda” ou “um rebordo” no lugar de “moldura”.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “uma coroa de ouro”; aqui, “friso” indica uma guarnição ornamental ao redor da moldura.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: moldura
  rationale: Designa a estrutura ou borda que circundava a mesa; “moldura” é natural em português e mantém o sentido construtivo.
- source_word: טֹפַח
  choice: da largura de um palmo
  rationale: O termo indica uma medida equivalente à largura da mão; a formulação explicita naturalmente a dimensão medida.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa que tanto a moldura quanto o friso se estendiam por todo o contorno.
- source_word: זֵר
  choice: friso
  rationale: Neste contexto, refere-se a uma guarnição ornamental elevada em torno do móvel; “friso” evita a imagem inadequada de uma coroa régia.
- source_word: זָהָב
  choice: de ouro
  rationale: Apresenta o ouro como o material do friso.
- source_word: לְמִסְגַּרְתּוֹ
  choice: ao redor da moldura
  rationale: No contexto, expressa a relação do friso com a moldura e sua disposição circundante, em português natural.
