  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: pt
  text: 'E seis ramos saíam dos seus lados: três ramos do candelabro de um lado[a] e três ramos do candelabro do outro lado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do seu lado um [...] do seu lado segundo”; também: “de um lado [...] do segundo lado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: braços
  rationale: No contexto do candelabro, o termo designa hastes laterais que se projetam da estrutura. “Braços” é natural e claro em português para as partes laterais de um candelabro, sem sugerir ramos vegetais literais.
- source_word: יֹצְאִים
  choice: saíam
  rationale: O particípio descreve os seis braços estendendo-se para fora do candelabro. “Saíam” conserva a força verbal e descritiva do hebraico.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: dos seus lados / de um lado
  rationale: צד significa “lado”. A formulação preserva a indicação inicial dos lados e depois distribui os braços entre ambos.
- source_word: מְנֹרָה
  choice: candelabro
  rationale: O substantivo comum designa o suporte de lâmpadas do santuário. “Candelabro” é a tradução tradicional e amplamente compreensível em português, embora o objeto sustentasse lâmpadas a óleo, não velas.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: de um lado ... do outro lado
  rationale: Embora o hebraico diga literalmente “do lado um ... do lado segundo”, esta expressão portuguesa comunica com naturalidade o contraste distributivo entre os dois lados, sem perda referencial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. “Braços” foi preferido a “ramos” por ser a designação corrente das extensões laterais de um candelabro. A repetição de “braços do candelabro” mantém o paralelismo enfático do hebraico.
