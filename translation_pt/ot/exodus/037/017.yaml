base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: pt
  text: Ele fez o candelabro de ouro puro. Fez o candelabro de trabalho martelado[a]; sua base e sua haste, seus cálices, seus botões[b] e suas flores formavam uma só peça com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de peça batida”. O termo hebraico se refere ao metal moldado a martelo.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas saliências”. O termo hebraico designa ornamentos arredondados; “botões” foi escolhido por combinar com o desenho vegetal do candelabro.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  choice: candelabro
  rationale: Designa o suporte cultual com vários braços, não apenas uma lâmpada. “Candelabro” é a designação portuguesa tradicional e clara para esse objeto.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Em descrições de materiais, טָהוֹר indica pureza ou refino; “ouro puro” é natural e preciso.
- source_word: מִקְשָׁה
  choice: trabalho martelado
  rationale: O termo descreve metal moldado por martelamento. A formulação conserva o processo de fabricação sem confundi-lo com simples ornamentação.
- source_word: יְרֵכָהּ
  choice: sua base
  rationale: Embora o sentido literal possa ser “coxa” ou “lado”, aqui indica a parte inferior que sustenta o candelabro.
- source_word: קָנָהּ
  choice: sua haste
  rationale: O singular se refere ao elemento estrutural central; “haste” é claro e também combina com o desenho vegetal do objeto.
- source_word: גְּבִיעֶיהָ
  choice: seus cálices
  rationale: Refere-se aos elementos ornamentais em forma de taça. “Cálices” preserva a forma e o registro do mobiliário sagrado.
- source_word: כַּפְתֹּרֶיהָ
  choice: seus botões
  rationale: O termo indica saliências ornamentais arredondadas; “botões” preserva tanto a forma quanto a possível imagem vegetal.
- source_word: פְרָחֶיהָ
  choice: suas flores
  rationale: Tradução direta e natural que mantém o motivo vegetal do candelabro.
- source_word: מִמֶּנָּה הָיוּ
  choice: formavam uma só peça com ele
  rationale: A expressão indica que os componentes eram integrais ao candelabro, e não peças acrescentadas separadamente.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ele fez ... Fez
  rationale: Mantém a repetição do verbo hebraico de modo natural em português, omitindo apenas o segundo pronome por fluidez.
