  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: pt
  text: 'E eu lhe disse: ‘Deixe meu filho ir, para que ele me sirva’; mas você se recusou a deixá-lo ir. Eis que estou para matar seu filho, seu primogênito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: Deixe ... sair
  rationale: O piel imperativo de שׁלח, neste contexto de libertação, pede que o faraó permita a saída de Israel; a formulação é natural em português e mantém a imagem de soltura/envio.
- source_word: וְיַעַבְדֵנִי
  choice: para que ele me sirva
  rationale: Preserva a finalidade expressa por וְ e o sentido amplo de עבד, que aqui inclui prestar serviço e culto a Deus.
- source_word: הִנֵּה
  choice: Pois bem
  rationale: Introduz com força a consequência solene da recusa, de modo idiomático no discurso direto em português.
- source_word: הֹרֵג
  choice: eu matarei
  rationale: O particípio com אָנֹכִי anuncia uma ação iminente e decidida; o futuro comunica naturalmente a ameaça profética sem acrescentar um aspecto progressivo inexistente em português.
- source_word: בְּכֹרֶךָ
  choice: seu primogênito
  rationale: Mantém a designação explícita do primeiro filho, em paralelo direto com Israel como filho primogênito no versículo anterior.
theological_decisions:
- issue: Referência de “meu filho”
  choice: Preservar o singular coletivo “meu filho”
  alternative: Explicitar “Israel, meu filho”
  rationale: O hebraico diz apenas בְּנִי neste versículo; o referente Israel vem do contexto imediato, e não deve ser inserido novamente no texto.
- issue: Agência divina na morte do primogênito
  choice: “eu matarei”
  alternative: Formulação indireta como “seu filho morrerá”
  rationale: O texto atribui explicitamente a ação a Deus na primeira pessoa; uma construção passiva ou indireta enfraqueceria a tensão teológica do original.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. O paralelismo “meu filho/seu filho” e a repetição de “deixar sair” foram preservados. A pontuação mantém toda a fala divina dentro da citação iniciada no contexto.
