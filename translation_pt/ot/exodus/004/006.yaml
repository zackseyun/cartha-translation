base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: pt
  text: 'Então Yahweh lhe disse mais: “Por favor, ponha a mão dentro da roupa, junto ao peito.” Ele pôs a mão dentro da roupa e, quando a tirou, eis que sua mão estava com uma doença de pele[a], branca como a neve.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico está relacionado a צָרַעַת (tsaráat), tradicionalmente traduzido como “lepra”. Essa condição bíblica pode não corresponder à hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עוֹד
  choice: ainda
  rationale: No encadeamento dos sinais, indica que Yahweh acrescentou outra instrução; “ainda” é natural em português e mantém essa ideia.
- source_word: הָבֵא נָא יָדְךָ
  choice: Por favor, ponha a mão
  rationale: O imperativo literalmente significa “traga”, mas “ponha a mão” comunica de modo idiomático o movimento para dentro; “por favor” representa a nuance suavizadora de נָא.
- source_word: חֵיק
  choice: dobra da roupa, junto ao peito
  rationale: Designa a região do peito ou o espaço formado pela veste onde se podia introduzir ou guardar algo. A formulação evita o sentido anatômico moderno que “seio” poderia sugerir.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a apresentação súbita e enfática do resultado do sinal em registro bíblico digno e compreensível.
- source_word: מְצֹרַעַת
  choice: afetada por uma doença de pele
  rationale: O termo indica que a mão foi atingida por צָרַעַת, categoria bíblica que não deve ser identificada automaticamente com a hanseníase moderna.
- source_word: כַּשָּׁלֶג
  choice: como a neve
  rationale: Mantém a comparação concisa do hebraico sem acrescentar explicitamente “branca”, embora a aparência seja inferida pelo contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o preserva de forma transparente, sem substituí-lo por um título.
- issue: Identificação de מְצֹרַעַת com uma enfermidade moderna
  choice: doença de pele, com nota explicativa
  alternative: leprosa
  rationale: A categoria ritual e dermatológica bíblica צָרַעַת não corresponde necessariamente à hanseníase. A tradução evita impor uma identificação médica que o texto não estabelece.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Dobra da roupa, junto ao peito” explicita de modo conciso a realidade cultural de חֵיק; “eis que” conserva a força dramática do hebraico.
