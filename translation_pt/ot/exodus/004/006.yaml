revisions:
- from: 'Então Yahweh lhe disse ainda: “Por favor, ponha a mão na dobra da roupa, junto ao peito.” Ele pôs a mão ali e, quando a tirou, eis que ela estava afetada por uma doença de pele[a], como a neve.'
  to: 'Então Yahweh lhe disse mais: “Por favor, ponha a mão dentro da roupa, junto ao peito.” Ele pôs a mão dentro da roupa e, quando a tirou, eis que sua mão estava com uma doença de pele[a], branca como a neve.'
  rationale: A revisão preserva o acréscimo de uma nova instrução, a polidez do imperativo e o referente espacial repetido. «Branca como a neve» torna explícito em português o sentido contextual da comparação, evitando que ela pareça descrever a enfermidade; a nota continua a impedir uma identificação indevida com a hanseníase moderna.
