source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: pt
  text: Arão falou todas as palavras que Yahweh havia falado a Moisés e realizou os sinais diante dos olhos do povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista do povo”.'
    reason: Alternativa lexical para לְעֵינֵי הָעָם, expressão que pode ser traduzida de modo menos literal sem alterar o sentido.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O piel de דבר significa normalmente “falar”; a escolha preserva a formulação narrativa e sua ligação com “todas as palavras”.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: todas as palavras
  rationale: Mantém a expressão concreta do hebraico, em vez de reduzi-la ao mais genérico “tudo”.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: que Yahweh havia falado a Moisés
  rationale: O mais-que-perfeito composto expressa naturalmente em português que a fala de Yahweh precedeu o relato de Arão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: וַיַּעַשׂ
  choice: realizou
  rationale: No contexto de sinais autenticadores, “realizou” transmite idiomaticamente a execução dos atos sem acrescentar explicitamente que eram milagrosos.
- source_word: הָאֹתֹת
  choice: os sinais
  rationale: Preserva o termo amplo אות; o caráter extraordinário dos sinais já é indicado pelo contexto.
- source_word: לְעֵינֵי הָעָם
  choice: diante dos olhos do povo
  rationale: Conserva a imagem concreta do idioma hebraico e permanece compreensível em português atual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” representa o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leve formalidade narrativa. A repetição de “falou” e “palavras” foi mantida para refletir a repetição de דבר no hebraico; “diante dos olhos do povo” conserva a vivacidade do original.
