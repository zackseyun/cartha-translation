base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés em Midiã: “Vá, volte para o Egito”[a], pois morreram todos os homens que procuravam tirar a sua vida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá de volta para o Egito”. O hebraico conserva dois imperativos, literalmente: “Vá, volte para o Egito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: É a forma narrativa usual do verbo אמר; a conjunção preserva a continuidade do relato.
- source_word: בְּמִדְיָן
  choice: em Midiã
  rationale: A preposição בְּ indica aqui o local em que Yahweh falou a Moisés.
- source_word: לֵךְ שֻׁב
  choice: Vá, volte
  rationale: Preserva os dois imperativos hebraicos, mantendo tanto o movimento ordenado quanto a ideia principal de retorno.
- source_word: מִצְרָיִם
  choice: para o Egito
  rationale: O destino é expresso de maneira idiomática em português com a preposição “para”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem; “pois” é claro e digno no registro narrativo.
- source_word: מֵתוּ
  choice: morreram
  rationale: O perfeito hebraico apresenta a morte como fato concluído; o contexto deixa evidente o estado resultante.
- source_word: כָּל הָאֲנָשִׁים
  choice: todos os homens
  rationale: Mantém a referência masculina específica de אֲנָשִׁים, sem generalizá-la para “pessoas”.
- source_word: הַמְבַקְשִׁים
  choice: que procuravam
  rationale: O particípio descreve uma ação contínua ou característica em contexto passado.
- source_word: אֶת נַפְשֶׁךָ
  choice: tirar a sua vida
  rationale: Neste contexto, נֶפֶשׁ significa a vida da pessoa; a expressão completa indica intenção de matar, não uma busca neutra.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” conserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido da busca pela נֶפֶשׁ de Moisés
  choice: procuravam tirar a sua vida
  alternative: procuravam a sua vida
  rationale: A expressão hebraica é idiomática para buscar matar alguém. A tradução explicita esse sentido sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se os dois imperativos do hebraico e o nome divino Yahweh. A formulação “tirar a sua vida” comunica naturalmente a força idiomática da expressão hebraica.
