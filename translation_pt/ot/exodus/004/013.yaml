  naturalness: '“Mas ele disse: ‘Por favor, meu Senhor, envia pela mão de quem enviares’” é compreensível em português moderno e mantém registro elevado apropriado ao discurso narrativo. A expressão “pela mão de” é levemente marcada, mas é inteligível e justificável por refletir a imagem e a evasividade do hebraico.'
