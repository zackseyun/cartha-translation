id: EXO.4.13
reference: Exodus 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: pt
  text: 'Mas ele disse[a]: “Por favor, meu Senhor, envia pela mão de quem enviares.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais interpretativa: “Por favor, meu Senhor, envia outra pessoa.”'
    reason: Leitura alternativa que explicita a relutância implícita de Moisés sem inseri-la no texto principal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ele disse
  rationale: Embora o waw consecutivo normalmente faça a narrativa avançar com “e disse”, o contexto pede valor adversativo, pois Moisés continua resistindo após as respostas de Deus.
- source_word: בִּי
  choice: Por favor
  rationale: Antes de uma forma respeitosa de tratamento, בִּי funciona como súplica cortês, e não com o sentido literal de “em mim”.
- source_word: אֲדֹנָי
  choice: meu Senhor
  rationale: É uma invocação reverente dirigida a Deus e preserva o sufixo de primeira pessoa. Não é o nome divino יהוה.
- source_word: שְׁלַח־נָא
  choice: envia
  rationale: O imperativo de שלח é suavizado pela partícula de súplica נָא. Como “Por favor” já expressa essa cortesia no início da fala, repeti-lo aqui seria pouco natural em português.
- source_word: בְּיַד
  choice: pela mão de
  rationale: Mantém a imagem hebraica de agência, que continua compreensível em português e contribui para preservar a formulação evasiva de Moisés.
- source_word: תִּשְׁלָח
  choice: quem enviares
  rationale: A construção portuguesa com futuro do subjuntivo reproduz naturalmente a referência indefinida à pessoa que Deus enviar, sem acrescentar de modo explícito “outra pessoa”.
theological_decisions:
- issue: Interpretação do pedido evasivo de Moisés
  choice: 'Preservar a ambiguidade do hebraico: Moisés pede que Deus envie por meio de quem ele enviar.'
  alternative: “Por favor, meu Senhor, envia outra pessoa.”
  rationale: O contexto deixa clara a relutância de Moisés, mas o hebraico não contém uma expressão explícita para “outra pessoa”. O texto principal conserva a tensão interpretativa, e a nota oferece a leitura contextual mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “pela mão de quem enviares” conserva deliberadamente o caráter semítico e evasivo do pedido, enquanto o futuro do subjuntivo soa natural em português. O marcador [a] aparece no texto principal.
