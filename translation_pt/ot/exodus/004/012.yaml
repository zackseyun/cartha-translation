  text: וְ/עַתָּ֖ה לֵ֑ךְ וְ/אָנֹכִי֙ אֶֽהְיֶ֣ה עִם פִּ֔י/ךָ וְ/הוֹרֵיתִ֖י/ךָ אֲשֶׁ֥ר תְּדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: pt
  text: Agora vá. Eu estarei com a sua boca[a] e ensinarei a você o que deverá dizer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Deus estaria presente com Moisés e capacitaria sua fala; o hebraico preserva a imagem concreta de estar “com a sua boca”.
    reason: esclarecimento_da_imagem
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição imediata da resposta de Deus para a ordem dirigida a Moisés; “Agora” é claro e natural em português.
- source_word: לֵךְ
  choice: vá
  rationale: O imperativo simples preserva a força direta da ordem hebraica sem expansão desnecessária.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: Eu estarei
  rationale: Expressa a promessa divina de presença. O pronome explícito conserva em português parte da ênfase do pronome independente hebraico.
- source_word: עִם־פִּיךָ
  choice: com a sua boca
  rationale: Mantém a imagem concreta do hebraico e sua ligação direta com a dificuldade de Moisés para falar, sem reduzir a promessa a uma mera paráfrase funcional.
- source_word: וְהוֹרֵיתִיךָ
  choice: e ensinarei a você
  rationale: O hifil de ירה significa aqui ensinar ou instruir; a formulação escolhida é corrente e claramente introduz o conteúdo da instrução.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: o que deverá dizer
  rationale: Comunica que Deus determinará e ensinará o conteúdo da fala futura de Moisés. “Dizer” é mais idiomático em português neste contexto, sem alterar o sentido de דבר.
theological_decisions:
- issue: Fórmula da presença divina no comissionamento
  choice: Eu estarei com a sua boca
  alternative: Eu ajudarei você a falar
  rationale: A tradução conserva a formulação concreta e incomum do texto, na qual o próprio Deus promete estar com a boca de Moisés. Assim, não reduz antecipadamente a presença divina à ideia funcional de ajuda para falar.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sintaxe foi dividida em duas frases para soar natural, enquanto a expressão deliberadamente concreta “com a sua boca” foi preservada por sua importância contextual e teológica.
