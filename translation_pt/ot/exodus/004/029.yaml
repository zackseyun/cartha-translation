  yaml_path: translation/ot/exodus/004/029.yaml
  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: pt
  text: Então Moisés e Arão foram e reuniram todos os anciãos dos filhos de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas” ou “dos descendentes de Israel”.
    reason: Alternativas lexicais para a expressão hebraica בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foram
  rationale: 'O wayyiqtol de הלך faz a narrativa avançar com o sentido simples de “ir”. Embora o verbo hebraico esteja no singular diante de dois sujeitos coordenados, o português exige naturalmente o plural: “Moisés e Arão foram”.'
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e corrente do nome em português.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e corrente do nome em português.
- source_word: וַיַּאַסְפוּ
  choice: reuniram
  rationale: Neste contexto, אסף significa juntar pessoas em assembleia; “reuniram” é natural em português e adequado ao objeto humano.
- source_word: אֵת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical independente em português.
- source_word: כָּל
  choice: todos
  rationale: Expressa totalidade e concorda naturalmente com “anciãos”.
- source_word: זִקְנֵי
  choice: anciãos
  rationale: Designa os líderes reconhecidos da comunidade, mantendo também a associação lexical com idade e respeitando o uso bíblico corrente em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Preserva a expressão hebraica explícita de filiação e sua nuance ancestral e pactual; “israelitas” é uma alternativa mais idiomática, porém menos formalmente correspondente.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  alternative: dos israelitas; dos descendentes de Israel
  rationale: A expressão identifica o povo por sua descendência de Israel/Jacó. A redação escolhida conserva a metáfora de parentesco sem transformar a expressão em mero gentílico; a nota registra alternativas naturais em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa foi mantida, e o plural “foram” segue a concordância natural do português apesar do verbo hebraico singular.
