base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: pt
  text: E o povo creu. Quando ouviu que Yahweh havia atentado para os filhos de Israel[a] e visto a aflição deles[b], inclinou-se e adorou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o sofrimento deles”, “a miséria deles” ou “a opressão deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: creu
  rationale: O hifil de אמן indica que o povo aceitou como verdadeira a mensagem confirmada pelos sinais. “Creu” preserva a ausência de objeto explícito no hebraico.
- source_word: הָעָם
  choice: o povo
  rationale: Representa naturalmente em português o coletivo singular hebraico.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: quando ouviram que
  rationale: Expressa com fluidez a relação temporal e explicativa entre a notícia recebida e a reação do povo.
- source_word: פָקַד יְהוָה
  choice: Yahweh havia atentado para
  rationale: פקד indica que Yahweh voltou sua atenção ao povo, com a implicação contextual de cuidado e intervenção. “Atentado para” preserva essa amplitude melhor que uma visita meramente física.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar literal do hebraico, corrente e compreensível em registro bíblico português.
- source_word: רָאָה אֶת עָנְיָם
  choice: visto a aflição deles
  rationale: Conserva o verbo concreto “ver” e traduz עֳנִי como “aflição”, termo que abrange sofrimento, miséria e opressão.
- source_word: וַיִּקְּדוּ
  choice: inclinaram-se
  rationale: Distingue o gesto corporal de curvar-se do ato de adoração expresso pelo verbo seguinte.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: adoraram
  rationale: No contexto da resposta a Yahweh, o verbo denota prostração reverente e culto; “adoraram” comunica sua função devocional sem repetir o gesto anterior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome divino, não um título. “Yahweh” o representa diretamente e evita substituí-lo por “SENHOR”.
- issue: Sentido de פקד aplicado à ação divina
  choice: havia atentado para
  alternative: havia visitado; havia cuidado de
  rationale: A escolha mantém a ideia de atenção divina que conduz à intervenção, sem reduzir o verbo a uma visita espacial nem explicitar além do texto a modalidade exata do cuidado.
- issue: Forma familiar בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: Preserva a metáfora genealógica do original sem excluir o sentido coletivo do povo de Israel.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém “creu” no singular por concordância com o coletivo “o povo”; passa ao plural em “ouviram” conforme o hebraico e o uso natural que focaliza os integrantes do povo. A ordem verbal conserva a progressão: fé, notícia da atenção divina, inclinação e adoração.'
