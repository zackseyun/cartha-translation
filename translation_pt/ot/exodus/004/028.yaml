base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: pt
  text: Moisés contou a Arão todas as palavras de Yahweh, que o havia enviado,[a] e todos os sinais que lhe havia ordenado realizar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as palavras de Yahweh com as quais ele o havia enviado”. A oração relativa hebraica também pode ser ligada diretamente a “palavras”; em ambos os casos, Yahweh é quem enviou Moisés.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O hifil de נגד significa aqui dar a conhecer ou contar; “contou” é natural no contexto narrativo e expressa que Moisés informou Arão.
- source_word: דִּבְרֵי יְהוָה
  choice: as palavras de Yahweh
  rationale: Mantém o plural concreto de דָּבָר e preserva a ideia de que Moisés transmitiu integralmente as palavras de sua comissão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: que o havia enviado
  rationale: Entende a oração relativa como referência a Yahweh, que enviara Moisés, sem apagar a possibilidade sintática alternativa indicada em nota.
- source_word: הָאֹתֹת
  choice: os sinais
  rationale: אוֹת designa um sinal e, neste contexto, pode ser miraculoso; “sinais” é direto e evita explicitação desnecessária.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: que lhe havia ordenado realizar
  rationale: O hebraico diz literalmente que Deus lhe ordenara os sinais; “realizar” explicita em português a ação naturalmente subentendida e evita a construção pouco idiomática “ordenado os sinais”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva como nome próprio o tetragrama apresentado pelo texto hebraico, sem o substituir por um título.
- issue: Referente da oração אֲשֶׁר שְׁלָחוֹ
  choice: Yahweh, que havia enviado Moisés
  alternative: as palavras com as quais Yahweh havia enviado Moisés
  rationale: A leitura adotada produz sentido claro e é sintaticamente possível, mas a ligação mais próxima com “palavras” também é genuína; por isso, ela é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém “palavras” e “sinais” por proximidade lexical ao hebraico; a vírgula antes da oração relativa favorece a leitura adotada e evita sugerir que se esteja distinguindo este Yahweh de outro.
