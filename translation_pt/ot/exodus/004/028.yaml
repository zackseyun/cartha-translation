  verdict: approve
  source_fidelity: 'A tradução preserva todos os elementos centrais do hebraico: Moisés como sujeito, Arão como destinatário, «todas as palavras de Yahweh», «todos os sinais» e as duas orações relativas. «Que o havia enviado» adota legitimamente Yahweh como antecedente de אֲשֶׁר שְׁלָחוֹ, enquanto a nota registra de modo adequado a possível ligação mais próxima com «palavras». «Que lhe havia ordenado realizar» exprime de forma idiomática a execução dos sinais, ação que o contexto e a construção hebraica deixam naturalmente implícita.'
