  terminology: «Yahweh» reproduz consistentemente o tetragrama como nome próprio. «Palavras» e «sinais» são escolhas lexicais diretas e adequadas para דִּבְרֵי e אֹתֹת. Os nomes Moisés e Arão seguem as formas portuguesas estabelecidas.
