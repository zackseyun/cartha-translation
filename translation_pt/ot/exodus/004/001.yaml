  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: pt
  text: 'Então Moisés respondeu: “Mas eis que eles não acreditarão em mim nem ouvirão a minha voz,[a] pois dirão: ‘Yahweh não apareceu a você’”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode significar “não me darão ouvidos” ou “não me atenderão”.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “Yahweh não se revelou a você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Então Moisés respondeu
  rationale: A combinação hebraica literalmente reúne ‘respondeu’ e ‘disse’, mas, em português atual, ‘respondeu’ expressa naturalmente a réplica sem a redundância pouco idiomática ‘respondeu e disse’.
- source_word: וְהֵן
  choice: Mas
  rationale: A partícula introduz a objeção de Moisés. Neste contexto, ‘Mas’ conserva sua força adversativa de modo natural; ‘eis que’ soaria marcado e ‘veja’ sugeriria uma interpelação mais concreta do que o necessário.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: eles não acreditarão em mim
  rationale: O hifil de אמן com לִי comunica que os israelitas não darão crédito a Moisés e à sua alegação. ‘Acreditarão em mim’ é claro e preserva a construção pessoal.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: nem ouvirão a minha voz
  rationale: Mantém a expressão hebraica e sua abertura semântica entre escutar, dar ouvidos e atender, sem antecipar o sentido mais forte de ‘obedecer’.
- source_word: כִּי יֹאמְרוּ
  choice: pois dirão
  rationale: כִּי introduz a razão da objeção de Moisés; ‘pois’ reproduz adequadamente essa relação explicativa.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: não apareceu a você
  rationale: O nifal de ראה significa aqui ‘aparecer’. O pretérito perfeito é natural em português para a alegação sobre o acontecimento passado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino. ‘Yahweh’ preserva essa distinção, enquanto ‘SENHOR’ substitui o nome por um título tradicional.
- issue: Amplitude de שׁמע בְּקוֹל
  choice: ouvir a minha voz
  alternative: obedecer-me
  rationale: Neste contexto, a expressão pode envolver escutar, dar crédito ou atender. A formulação escolhida conserva essa tensão e evita restringi-la antecipadamente à obediência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redundância semítica ‘respondeu e disse’ foi condensada; a expressão ‘ouvir a minha voz’ foi preservada para manter a ambiguidade lexical do original.
