  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: pt
  text: E leve este cajado na mão[a], com o qual você fará os sinais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vara”. O termo hebraico pode significar tanto “cajado” como “vara”; “cajado” combina melhor com o contexto de Moisés como pastor.
    reason: lexical_alternative
  - marker: b
    text: Ou “os sinais milagrosos”. O hebraico diz simplesmente “os sinais”, deixando que o contexto indique sua natureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: E
  rationale: A conjunção liga esta ordem às instruções anteriores; o marcador hebraico de objeto direto não recebe tradução independente.
- source_word: הַמַּטֶּה הַזֶּה
  choice: este cajado
  rationale: מַטֶּה pode designar cajado ou vara. “Cajado” é natural no contexto de Moisés como pastor, enquanto o demonstrativo identifica o objeto já apresentado.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: leve na mão
  rationale: O imperfeito qal tem força de ordem neste contexto. “Leve na mão” expressa com naturalidade tanto a instrução quanto a ideia de portar o cajado.
- source_word: אֲשֶׁר ... בּוֹ
  choice: com o qual
  rationale: A construção relativa e a preposição apresentam o cajado como instrumento; “com o qual” preserva essa relação sem repetição artificial.
- source_word: תַּעֲשֶׂה
  choice: você fará
  rationale: עָשָׂה significa amplamente fazer ou realizar. “Fará” é claro e natural com “os sinais”, sem acrescentar ao verbo uma especificação ausente no hebraico.
- source_word: הָאֹתֹת
  choice: os sinais
  rationale: A tradução mantém o artigo definido e o sentido básico de אוֹת, remetendo aos sinais apresentados no contexto sem inserir “milagrosos” no texto principal.
theological_decisions:
- issue: Natureza dos sinais
  choice: os sinais
  alternative: os sinais milagrosos
  rationale: Embora o contexto mostre que são atos extraordinários, o hebraico diz simplesmente “os sinais”. A formulação mais enxuta preserva a expressão do texto e deixa que o contexto esclareça sua natureza.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de “você” evita a rigidez de “tu” ou “vós” em grande parte do público contemporâneo; “cajado” preserva a imagem narrativa, e “fará os sinais” mantém a sobriedade lexical do hebraico.
