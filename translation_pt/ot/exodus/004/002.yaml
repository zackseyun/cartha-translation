  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: pt
  text: 'Então Yahweh lhe disse: “O que é isso na sua mão?” Ele respondeu: “Um cajado.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma vara”. O hebraico מַטֶּה pode designar um cajado, uma vara ou um bastão, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: disse ... respondeu
  rationale: אמר significa normalmente “dizer”. Na segunda ocorrência, “respondeu” expressa naturalmente em português a função contextual da fala de Moisés, sem alterar seu conteúdo.
- source_word: אֵלָיו
  choice: lhe
  rationale: O pronome oblíquo traduz de modo natural e direto o sentido de “a ele” em português moderno.
- source_word: מַה־זֶּה / מִזֶּה
  choice: O que é isso
  rationale: A pergunta busca identificar o objeto que está na mão de Moisés; “isso” é uma forma dêitica natural no diálogo.
- source_word: בְּיָדֶךָ
  choice: na sua mão
  rationale: Mantém a referência concreta ao objeto que Moisés segura e é idiomático em português.
- source_word: מַטֶּה
  choice: um cajado
  rationale: No contexto de Moisés, “cajado” é a designação portuguesa mais natural para מַטֶּה; “vara” continua sendo uma alternativa lexical possível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Mantém o nome pessoal no corpo do texto e segue a transliteração adotada pelo projeto, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência narrativa hebraica foi vertida por “Então”, e a segunda ocorrência de אמר foi traduzida funcionalmente por “respondeu” para produzir diálogo natural.
