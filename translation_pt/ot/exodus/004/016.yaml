revisions:
- from: Ele falará por você ao povo e será como sua boca; e você será como Deus para ele.[a]
  to: Ele falará por você ao povo; ele será sua boca, e você será para ele como Deus.[a]
  rationale: A revisão conserva a metáfora de “boca” de modo mais natural em português e corrige a explicação da construção hebraica na nota. “Como Deus” no texto principal mantém a forte imagem de autoridade representativa, sem impor uma leitura ontológica.
  reviewer_model: gpt-5.6-terra
