  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: pt
  text: Ele falará por você ao povo; ele será sua boca, e você será para ele como Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “você será para ele por Deus”. Isto é, Moisés transmitirá a Arão as instruções recebidas de Deus e exercerá perante ele uma autoridade representativa; também se pode traduzir: “você será Deus para ele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: Ele falará por você ao povo
  rationale: 'O piel de דבר significa aqui “falar”, e לְךָ tem sentido representativo: Arão falará em nome de Moisés. “Ao povo” expressa naturalmente אֶל־הָעָם.'
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: e será como sua boca
  rationale: Mantém a metáfora hebraica da boca, isto é, Arão como porta-voz de Moisés, sem substituí-la por uma explicação no texto principal. A formulação portuguesa evita reproduzir a ênfase verbal hebraica de modo artificial.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: e você será como Deus para ele
  rationale: 'Preserva a força da relação funcional e representativa: Moisés transmitirá a Arão a palavra recebida de Deus. “Como Deus” torna explícito em português que se trata de papel comparável, sem atribuir divindade ontológica a Moisés.'
theological_decisions:
- issue: Se לֵאלֹהִים deve ser traduzido de modo que possa sugerir que Moisés é literalmente Deus
  choice: como Deus para ele
  alternative: Deus para ele; por Deus para ele
  rationale: 'O contexto descreve autoridade e mediação representativas: Moisés recebe as palavras divinas e as comunica a Arão. A tradução conserva a forte imagem teológica, mas evita uma afirmação ontológica não pretendida pelo contexto.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Por você” comunica representação com naturalidade; “como sua boca” preserva a imagem concreta do hebraico. O pronome “você” mantém o tratamento direto e amplamente compreensível.
