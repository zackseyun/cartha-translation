base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: pt
  text: 'Então a ira de Yahweh se acendeu contra Moisés, e ele disse: “Não é Arão, seu irmão, o levita? Sei que ele sabe falar bem.[a] Além disso, veja: ele está saindo ao seu encontro e, quando o vir, se alegrará em seu coração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sei que ele fala fluentemente”; ou, de modo mais literal: “falando, ele falará”.'
    reason: Preserva alternativas para a construção enfática formada pelo infinitivo absoluto seguido do verbo finito.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira de Yahweh se acendeu
  rationale: Preserva a metáfora hebraica da ira que se acende, em formulação natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֲלֹא
  choice: Não está aí
  rationale: Expressa a pergunta retórica que espera resposta afirmativa e mantém fluidez no diálogo.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Representa diretamente o termo de parentesco com o sufixo de segunda pessoa masculina singular.
- source_word: הַלֵּוִי
  choice: o levita
  rationale: Designa naturalmente a afiliação tribal de Arão, sem pressupor aqui um cargo cultual.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Sei que ele sabe falar bem
  rationale: No contexto da alegada dificuldade de Moisés para falar, comunica naturalmente a aptidão de Arão; a nota preserva a forma intensiva e outras possibilidades.
- source_word: וְגַם הִנֵּה
  choice: Além disso, veja
  rationale: Conserva tanto a força aditiva quanto o chamado de atenção, usando linguagem moderna.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: ele está saindo ao seu encontro
  rationale: O particípio indica ação em curso ou iminente; a expressão mantém o movimento indicado no hebraico.
- source_word: וְרָאֲךָ
  choice: quando vir você
  rationale: Explicita de modo idiomático a relação temporal com a alegria subsequente.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: se alegrará de coração
  rationale: Mantém a dimensão interior da expressão hebraica sem produzir uma construção artificial em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; transliterá-lo como Yahweh preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força de דַבֵּר יְדַבֵּר
  choice: sabe falar bem
  alternative: certamente falará; fala fluentemente; literalmente, falando falará
  rationale: A construção intensiva admite mais de uma representação. O contexto favorece a aptidão de Arão para falar, mas a nota registra a ambiguidade lexical sem transformar a interpretação em única leitura possível.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O diálogo mantém dignidade sem arcaísmos; “veja” traduz o chamado de atenção de הִנֵּה, e “se alegrará de coração” conserva a interioridade da expressão hebraica.
