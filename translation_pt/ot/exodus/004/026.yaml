base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: pt
  text: 'O SENHOR o deixou em paz.[a] Então ela disse: “Noivo de sangue”, por causa das circuncisões.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deixou-o” ou “cessou de agir contra ele”. Pelo contexto, o sujeito é o SENHOR, e o referente mais provável de “o” é Moisés.'
    reason: referential_ambiguity
  - marker: b
    text: 'Hebraico no plural: “por causa das circuncisões”; a expressão também pode se referir ao rito da circuncisão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: o SENHOR o deixou em paz
  rationale: O verbo רפה com מִן indica aqui a interrupção da ação hostil. O sujeito, retomado do versículo 24, é naturalmente o SENHOR, e o objeto mais provável é Moisés. Explicitar o sujeito evita uma ambiguidade pronominal artificial em português, sem eliminar em nota a dificuldade do referente do objeto.
- source_word: אָז
  choice: Então / Foi então que
  rationale: O advérbio assinala a sequência temporal após a interrupção do ataque. A repetição idiomática em português liga primeiro o desfecho e depois a explicação da fala de Zípora.
- source_word: אָמְרָה
  choice: ela disse
  rationale: Tradução direta do verbo אמר; o sujeito feminino é Zípora, identificada pelo contexto imediato.
- source_word: חֲתַן דָּמִים
  choice: Noivo de sangue
  rationale: Mantém literalmente a expressão hebraica breve e obscura, sem decidir se expressa repulsa, uma designação ritual ou outra nuance cultural.
- source_word: לַמּוּלֹת
  choice: por causa das circuncisões
  rationale: A forma hebraica é plural e relaciona a expressão anterior ao ato ou rito de circuncisão. O plural incomum é preservado no texto, com nota que esclarece a possibilidade de sentido coletivo ou ritual.
theological_decisions:
- issue: Referentes em “retirou-se/deixou-o”
  choice: Explicitar o SENHOR como sujeito e deixar o objeto como pronome, entendido mais naturalmente como Moisés.
  alternative: Manter ambos os referentes apenas como pronomes, ou entender o objeto de modo mais geral a partir do contexto.
  rationale: O versículo 24 nomeia o SENHOR como agente do ataque; assim, o versículo 26 naturalmente informa que ele cessou a ação. Moisés é o referente dominante do objeto, mas a nota reconhece que o hebraico emprega somente o pronome.
- issue: Sentido de “Noivo de sangue”
  choice: Conservar o idioma literalmente, sem explicar sua força cultural ou emocional.
  alternative: Parafrasear como exclamação de repulsa, título ritual ligado à circuncisão ou fala dirigida especificamente a Moisés ou ao filho.
  rationale: A expressão hebraica é genuinamente difícil, e o texto não oferece elementos suficientes para escolher com segurança entre essas interpretações.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. “Noivo de sangue” conserva a concisão e a estranheza do hebraico. O plural “circuncisões” segue a forma massorética, enquanto as notas preservam as ambiguidades referencial e ritual.
