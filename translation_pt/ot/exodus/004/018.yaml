base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: pt
  text: 'Então Moisés foi e voltou para Jetro[a], seu sogro, e lhe disse: “Por favor, deixe-me ir e voltar para meus irmãos[b] que estão no Egito, para ver se ainda estão vivos.” Jetro respondeu a Moisés: “Vá em paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na primeira ocorrência, o hebraico traz a forma do nome “Jéter”; na segunda, “Jetro”. O texto usa “Jetro” nas duas ocorrências porque se trata claramente da mesma pessoa.
    reason: textual_variant
  - marker: b
    text: Ou “meus parentes”. O hebraico diz literalmente “meus irmãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então Moisés foi
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa de modo natural a progressão narrativa em português.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: שׁוּב significa aqui retornar ao chefe de sua família midianita; “voltou” é claro e idiomático.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Jetro
  rationale: O hebraico emprega יֶתֶר na primeira ocorrência e יִתְרוֹ na segunda. Como se trata claramente da mesma pessoa, usa-se a forma tradicional portuguesa “Jetro” no texto, registrando a diferença em nota.
- source_word: חֹתְנוֹ
  choice: seu sogro
  rationale: No contexto, designa especificamente o pai da esposa de Moisés; “sogro” é preciso e natural.
- source_word: אֵלֲכָה נָּא
  choice: Por favor, deixe-me ir
  rationale: O coortativo com נָא comunica um pedido cortês e respeitoso dirigido ao sogro.
- source_word: וְאָשׁוּבָה
  choice: e voltar
  rationale: O coortativo continua o pedido de Moisés e preserva a repetição lexical da raiz שׁוּב.
- source_word: אַחַי
  choice: meus irmãos
  rationale: É a tradução literal do hebraico; embora o termo possa abranger parentes ou membros do mesmo povo, essa amplitude é preservada em nota.
- source_word: וְאֶרְאֶה
  choice: para ver
  rationale: A construção indica a finalidade da volta de Moisés; “para ver” transmite esse valor de forma idiomática.
- source_word: הַעוֹדָם חַיִּים
  choice: se ainda estão vivos
  rationale: A formulação conserva tanto a ideia de continuidade de עוֹד quanto a incerteza introduzida pela partícula interrogativa.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Vá em paz
  rationale: Equivalente português estabelecido para a fórmula hebraica de despedida e bênção.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala respeitosa de Moisés é expressa por “Por favor, deixe-me ir”, sem arcaísmo; a fórmula “Vá em paz” preserva o caráter solene e convencional da despedida.
