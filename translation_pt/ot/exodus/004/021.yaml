base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Quando você voltar para o Egito, cuide de realizar diante do faraó todos os prodígios[a] que coloquei em sua mão. Mas eu endurecerei o coração dele[b], e ele não deixará o povo partir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “os sinais” ou “os milagres”. O termo hebraico se refere a atos extraordinários que funcionam como manifestações do poder divino.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “fortalecerei o coração dele” ou “tornarei firme o coração dele”. O verbo hebraico pode ter o sentido de fortalecer ou tornar firme; neste contexto, descreve o faraó sendo confirmado em sua recusa obstinada.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e preservando sua função no texto hebraico.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Quando você voltar para o Egito
  rationale: Expressa naturalmente em português a construção temporal e o sentido de retorno, incluindo a direção indicada pela terminação de מִצְרַיְמָה.
- source_word: רְאֵה
  choice: cuide de
  rationale: Neste contexto, o imperativo introduz uma incumbência e pede atenção ao cumprimento do que segue; “cuide de” comunica essa força sem uma tradução excessivamente literal.
- source_word: הַמֹּפְתִים
  choice: os prodígios
  rationale: “Prodígios” designa atos extraordinários que manifestam poder divino e conserva a possibilidade de eles também funcionarem como sinais.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: que coloquei em sua mão
  rationale: Mantém a imagem hebraica da mão, que aqui comunica que os prodígios foram confiados a Moisés e postos à sua disposição.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: realizar diante do faraó
  rationale: “Realizar” combina naturalmente com “prodígios”, enquanto “diante do faraó” preserva a ideia de executá-los na presença dele.
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção marca aqui um contraste discursivo entre a ação ordenada a Moisés e a ação divina que determinará a reação do faraó.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: eu endurecerei o coração dele
  rationale: O causativo de חזק pode significar fortalecer ou tornar firme; no contexto da recusa persistente do faraó, “endurecerei” comunica de modo idiomático a obstinação resultante.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: e ele não deixará o povo partir
  rationale: No contexto do êxodo, שׁלח descreve permitir ou liberar a partida do povo; esta formulação é clara e natural em português.
theological_decisions:
- issue: O endurecimento divino do coração do faraó
  choice: eu endurecerei o coração dele
  alternative: eu fortalecerei o coração dele; eu tornarei firme o coração dele
  rationale: A tradução conserva explicitamente a agência divina afirmada pelo hebraico e a tensão entre essa ação e a responsabilidade do faraó, sem suavizar nem explicar além do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna clara a referência singular a Moisés; “faraó” é usado como título em minúscula. A imagem concreta de algo colocado “em sua mão” foi preservada, e os marcadores das notas foram posicionados junto aos termos a que efetivamente se referem.
