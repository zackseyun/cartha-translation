source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: pt
  text: E, se não acreditarem nem mesmo nesses dois sinais e não derem ouvidos à sua voz[a], pegue um pouco da água do Nilo e derrame-a sobre a terra seca. A água que você tirar do Nilo se transformará em sangue sobre a terra seca.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedecerem ao que você diz”. A expressão hebraica significa literalmente “não escutarem a sua voz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se tornará sangue”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: E, se
  rationale: A construção introduz uma hipótese em continuação ao contexto; esta forma preserva o encadeamento hebraico sem o literalismo pouco natural de 'e acontecerá, se'.
- source_word: יַאֲמִינוּ גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: não acreditarem nem mesmo nesses dois sinais
  rationale: O verbo expressa aceitar a força comprobatória dos sinais, e גַּם acrescenta uma ideia de intensificação bem comunicada por 'nem mesmo' no contexto negativo.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: não derem ouvidos à sua voz
  rationale: A expressão portuguesa conserva a imagem hebraica da voz e comunica naturalmente o sentido idiomático de escutar com atenção ou obedecer.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: um pouco da água do Nilo
  rationale: Comunica o valor partitivo de מִן e identifica יְאֹר pelo nome geográfico convencional em português.
- source_word: וְשָׁפַכְתָּ
  choice: derrame-a
  rationale: Traduz diretamente a ação de verter e explicita, por meio do pronome, que o objeto é a água mencionada antes.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: a terra seca / sobre a terra seca
  rationale: Mantém a repetição lexical do hebraico e o contraste entre a água do rio e o solo seco.
- source_word: וְהָיוּ ... לְדָם
  choice: se transformará em sangue
  rationale: A construção היה + ל indica mudança ou resultado; 'se transformará em' é clara e natural em português.
- source_word: דָם
  choice: sangue
  rationale: É o sentido direto do substantivo, sem qualquer qualificação no texto-fonte.
theological_decisions:
- issue: Natureza do sinal em que a água do Nilo se torna sangue
  choice: se transformará em sangue
  alternative: ficará vermelha como sangue
  rationale: O hebraico afirma diretamente o resultado como sangue e não apresenta a transformação como mera aparência ou mudança de cor; a tradução não deve enfraquecer a afirmação miraculosa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por 'você' torna natural a referência a Moisés; 'dar ouvidos' preserva o idioma sem soar excessivamente arcaico. A repetição de 'terra seca' reproduz deliberadamente a ênfase do hebraico.
