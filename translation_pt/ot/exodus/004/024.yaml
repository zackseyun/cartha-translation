id: EXO.4.24
reference: Exodus 4:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: pt
  text: E aconteceu que, no caminho, no lugar de pernoite[b], Yahweh o encontrou e procurou matá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não identifica explicitamente a pessoa indicada por «o» e «-lo»; pode tratar-se de Moisés ou, segundo algumas interpretações, de seu filho.
    reason: alternative_reading
  - marker: b
    text: Ou «no acampamento noturno». O termo hebraico indica um lugar onde se passa a noite, não necessariamente uma hospedaria comercial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz um novo episódio na sequência narrativa, preservando a função do wayyiqtol sem recorrer à fórmula arcaica «e sucedeu».
- source_word: בַדֶּרֶךְ
  choice: no caminho
  rationale: Tradução locativa direta e idiomática, que mantém a concisão do hebraico.
- source_word: בַמָּלוֹן
  choice: no lugar de pernoite
  rationale: מָלוֹן designa um lugar onde se passa a noite, sem exigir a ideia moderna de uma hospedaria comercial.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: o encontrou
  rationale: פגע tem o sentido básico de encontrar ou deparar-se com alguém; a hostilidade fica clara na oração seguinte, sem precisar ser acrescentada ao verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְבַקֵּשׁ
  choice: procurou
  rationale: Preserva o sentido de buscar ou empenhar-se em fazer algo e mantém a tensão narrativa, sem definir de modo excessivo se se trata apenas de intenção ou de tentativa já iniciada.
- source_word: הֲמִיתוֹ
  choice: matá-lo
  rationale: Expressa com clareza e naturalidade o infinitivo causativo de מות com sufixo masculino singular.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em forma transliterada, sem substituí-lo pelo título «Senhor».
- issue: Referente dos sufixos pronominais masculinos singulares
  choice: Manter o referente implícito por meio de «o» e «-lo»
  alternative: Identificá-lo como Moisés ou como o filho de Moisés
  rationale: O hebraico não nomeia o homem que Yahweh encontra e procura matar. A tradução conserva essa ambiguidade em vez de resolver interpretativamente a tensão do relato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação concisa acompanha a estrutura narrativa hebraica; «lugar de pernoite» evita o anacronismo possível de «estalagem» ou «pousada».
