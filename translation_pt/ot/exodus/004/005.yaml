source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: pt
  text: para que creiam que Yahweh[a], o Deus de seus pais[b], o Deus de Abraão, o Deus de Isaque e o Deus de Jacó, apareceu a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”. Outras formas incluem “Yahweh” e “Jeová”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o Deus de seus antepassados”. O hebraico diz mais literalmente: “o Deus de seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade dos sinais e preserva de modo natural a força intencional da oração hebraica.
- source_word: יַאֲמִינוּ
  choice: creiam
  rationale: O hifil de אמן, neste contexto, indica aceitar como verdadeira a afirmação de Moisés com base nos sinais; “creiam” é claro e idiomático.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que eles devem crer, e não uma oração causal.
- source_word: נִרְאָה
  choice: apareceu
  rationale: O nifal de ראה significa aqui “aparecer” ou “ser visto”; o pretérito perfeito comunica naturalmente em português o acontecimento concluído.
- source_word: אֵלֶיךָ
  choice: a você
  rationale: Representa diretamente a preposição אֶל com o sufixo masculino singular, em português moderno e amplamente compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: o Deus de seus pais
  rationale: Preserva o masculino plural do hebraico e a linguagem pactual da linhagem patriarcal; “antepassados” continua sendo uma alternativa lexical possível.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: o Deus de Abraão, o Deus de Isaque e o Deus de Jacó
  rationale: Mantém a repetição de “o Deus de” antes de cada patriarca, reproduzindo a ênfase e a cadência solene do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” é a substituição tradicional por um título e “Jeová” é outra forma histórica.
- issue: Expressão ancestral אֲבֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: “Seus pais” conserva o gênero e a forma mais literal do hebraico no contexto da linhagem patriarcal, sem excluir a amplitude ancestral que a expressão pode assumir.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção “para que creiam” preserva a dependência sintática do contexto anterior. A repetição dos títulos patriarcais mantém a solenidade do original sem soar arcaica.
