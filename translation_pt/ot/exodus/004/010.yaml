base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: pt
  text: 'Então Moisés disse a Yahweh: “Por favor, Senhor, não sou homem de palavras[a], nem ontem nem anteontem, nem desde que falaste com o teu servo; pois tenho a boca pesada e a língua pesada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “não sou eloquente”. O hebraico diz literalmente “não sou homem de palavras”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “boca pesada e língua pesada”, metáfora para dificuldade em falar; pode indicar falta de eloquência ou algum impedimento de fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando a distinção no próprio versículo entre יְהוָה e אֲדֹנָי.
- source_word: בִּי אֲדֹנָי
  choice: Por favor, Senhor
  rationale: בִּי funciona como interjeição respeitosa de súplica, enquanto אֲדֹנָי é mantido como o título “Senhor”.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: não sou homem de palavras
  rationale: Preserva a expressão hebraica e a autodescrição de Moisés sem reduzi-la de imediato a “não sou eloquente”.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: nem desde ontem, nem desde anteontem
  rationale: Mantém a sequência temporal enfática do hebraico, com formulação compreensível em português.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: nem mesmo desde que começaste a falar com o teu servo
  rationale: Expressa o ponto inicial indicado por מֵאָז e o fato de que a fala divina em curso não alterou a alegada dificuldade de Moisés.
- source_word: עַבְדֶּךָ
  choice: teu servo
  rationale: No contexto, é uma autodesignação reverente diante de Deus; “servo” comunica esse valor melhor do que “escravo”.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão apresentada por Moisés.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: tenho a boca pesada e a língua pesada
  rationale: Conserva a metáfora e o paralelismo hebraicos, sem diagnosticar se se trata de pouca eloquência, insegurança ou impedimento físico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o tetragrama; a transliteração preserva o nome pessoal e também sua diferença em relação ao título אֲדֹנָי, usado logo depois.
- issue: Natureza da dificuldade de fala de Moisés
  choice: Preservar “boca pesada e língua pesada”
  alternative: Interpretar como “não sou eloquente”, “falo com dificuldade” ou “tenho um impedimento de fala”
  rationale: O hebraico emprega uma metáfora e não determina a causa exata da dificuldade; a tradução mantém essa ambiguidade genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento por “tu” coerente na fala dirigida a Deus. Os travessões ajudam a tornar clara a sequência temporal sem eliminar a forma enfática e incomum do hebraico.
