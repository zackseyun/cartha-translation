base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: pt
  text: Então Moisés tomou sua mulher e seus filhos, fez-os montar no jumento e voltou para a terra do Egito. E Moisés tomou o cajado de Deus em sua mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a vara de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então Moisés tomou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “tomou” preserva o sentido simples de לקח.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: Tradução direta de אִשָּׁה com sufixo possessivo; o contexto não exige substituir a expressão pelo nome Zípora.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico traz o plural masculino “filhos”, e não o termo geral “crianças”.
- source_word: וַיַּרְכִּבֵם
  choice: fez com que montassem
  rationale: 'O hifil de רכב é causativo: fazer alguém montar ou andar montado. A formulação é clara e natural em português.'
- source_word: הַחֲמֹר
  choice: no jumento
  rationale: O substantivo tem artigo definido; “jumento” é uma designação corrente e digna em português.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: שוב indica retorno neste contexto; “voltou” é conciso e natural.
- source_word: אַרְצָה מִצְרָיִם
  choice: para a terra do Egito
  rationale: Preserva tanto a terminação direcional quanto a expressão hebraica que inclui “terra”.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: o cajado de Deus
  rationale: מַטֶּה pode designar cajado ou vara. “Cajado” é natural no contexto de Moisés e mantém o complemento “de Deus”.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Mantém a imagem concreta do hebraico; com “levava”, o possessivo fica claro pelo contexto.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים em מַטֵּה הָאֱלֹהִים
  choice: Deus
  alternative: divino
  rationale: Aqui a expressão se refere ao cajado ligado à comissão e aos sinais dados por Deus; o referente pessoal “Deus” é o sentido contextual direto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação final foi vertida por “levava” para transmitir naturalmente a ação de portar o cajado, sem perder a imagem de tê-lo na mão.
