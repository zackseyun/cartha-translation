  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: pt
  text: 'E ele disse: “Jogue-o no chão.” Moisés o jogou no chão, e ele se tornou uma cobra[a]; então Moisés fugiu dela[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serpente”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “de diante dela” (ou “de diante dele”), expressão que significa “para longe dela” ou “da presença dela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a sequência narrativa do wayyiqtol sem acrescentar uma nuance temporal mais específica.
- source_word: הַשְׁלִיכֵהוּ
  choice: Jogue-o
  rationale: Imperativo natural em português; o pronome retoma o cajado mencionado no versículo anterior.
- source_word: אַרְצָה
  choice: no chão
  rationale: O substantivo com he direcional indica movimento para o chão; esta é a formulação corrente e clara em português.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: Moisés o jogou
  rationale: Explicita o sujeito já identificado pelo contexto e reproduz naturalmente o cumprimento imediato da ordem.
- source_word: וַיְהִי לְנָחָשׁ
  choice: ele se tornou uma cobra
  rationale: נָחָשׁ designa cobra ou serpente; “cobra” é a opção moderna mais comum, sem excluir a alternativa tradicional.
- source_word: וַיָּנָס
  choice: então Moisés fugiu
  rationale: “Fugiu” conserva a força do verbo, e “então” expressa de modo natural a progressão narrativa.
- source_word: מִפָּנָיו
  choice: dela
  rationale: O idioma hebraico significa literalmente afastar-se de diante dela; o referente mais natural do sufixo masculino singular é a cobra.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição do pronome masculino em “jogue-o” e “o jogou” retoma “cajado” do contexto anterior. As notas preservam tanto a alternativa lexical de נָחָשׁ quanto a ambiguidade formal do sufixo em מִפָּנָיו.
