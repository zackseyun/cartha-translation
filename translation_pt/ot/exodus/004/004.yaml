reference: Exodus 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Estenda a mão e agarre-a pela cauda[a]”. Ele estendeu a mão, segurou-a firmemente, e ela se tornou um cajado[b] em sua mão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segure-a pela cauda”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma vara”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁלַח יָדְךָ
  choice: Estenda a mão
  rationale: Expressa de modo natural e fiel o gesto físico ordenado; em português, o possessivo é desnecessário porque o referente está claro.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: agarre-a pela cauda
  rationale: אָחַז indica agarrar ou tomar posse; a preposição בְּ é naturalmente representada por “pela” neste contexto. O pronome feminino concorda com “serpente”, antecedente em português.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: segurou-a firmemente
  rationale: A construção com חזק comunica que Moisés a segurou com firmeza; a formulação também distingue levemente este verbo do אָחַז da ordem anterior.
- source_word: וַיְהִי לְמַטֶּה
  choice: ela se tornou um cajado
  rationale: היה com לְ, neste contexto de transformação, indica mudança de estado. “Cajado” é corrente e adequado ao objeto de Moisés, embora “vara” também seja possível.
- source_word: בְּכַפּוֹ
  choice: em sua mão
  rationale: כַּף pode designar a palma, mas “em sua mão” é a expressão portuguesa idiomática e preserva o sentido contextual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título e sem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e a repetição de “mão” foram preservadas. Os marcadores foram posicionados junto aos termos a que suas alternativas efetivamente se referem.
