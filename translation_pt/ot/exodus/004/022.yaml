  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: pt
  text: 'Então você dirá ao faraó: “Assim diz Yahweh: Israel é meu filho primogênito.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais de perto a ordem do hebraico: “Israel é meu filho, meu primogênito.”'
    reason: Alternativa formal que preserva a sequência בְּנִי בְכֹרִי e sua possível força apositiva.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Então você dirá
  rationale: O perfeito qal na segunda pessoa masculina singular, precedido de waw, tem aqui força sequencial e instrutiva. “Então” expressa a progressão do discurso, e o futuro “dirá” conserva o tom de ordem dirigida a Moisés.
- source_word: אֶל־פַּרְעֹה
  choice: ao faraó
  rationale: A preposição אֶל introduz o destinatário. “Faraó” é a forma portuguesa consagrada do título egípcio, empregado aqui com artigo e inicial minúscula segundo o uso corrente.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula solene de mensageiro, vertida de modo próximo ao hebraico e natural no registro bíblico português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּנִי
  choice: meu filho
  rationale: O substantivo com sufixo de primeira pessoa singular significa literalmente “meu filho”; a metáfora filial explícita não deve ser neutralizada.
- source_word: בְכֹרִי
  choice: primogênito
  rationale: Preserva a ideia de condição e prerrogativa do primeiro filho sem decidir se a ênfase é temporal, jurídica ou honorífica.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a forma tradicional portuguesa do nome próprio. Na oração nominal hebraica, Israel é identificado como filho primogênito de Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o caráter de nome pessoal e evita substituí-lo por um título.
- issue: Metáfora filial e condição de primogênito de Israel
  choice: Israel é meu filho primogênito
  alternative: Israel é meu filho, meu primogênito
  rationale: A redação principal é natural em português e conserva tanto a filiação metafórica quanto a primogenitura. A alternativa, registrada em nota, reproduz mais de perto a ordem e a aposição do hebraico, sem impor uma explicação específica à condição de primogênito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a fórmula solene “Assim diz” e evita-se linguagem arcaica. A nota foi colocada após a declaração a que se refere.
