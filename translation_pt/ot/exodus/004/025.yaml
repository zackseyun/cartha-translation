base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: pt
  text: 'Então, Zípora pegou uma pedra de pederneira, cortou o prepúcio de seu filho e, com ele, tocou-lhe os pés[a]. E disse: “Sem dúvida, tu és para mim um noivo de sangue.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “os pés dele”. “Pés” pode ser um eufemismo para os órgãos genitais, e o pronome pode se referir a Moisés ou ao filho dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: pedra de pederneira
  rationale: O substantivo designa pederneira ou uma pedra usada como instrumento cortante. A expressão é clara em português e preserva o material do objeto.
- source_word: עָרְלַת בְּנָהּ
  choice: o prepúcio de seu filho
  rationale: Tradução direta e anatomicamente precisa da construção hebraica, sem eufemismo desnecessário.
- source_word: וַתַּגַּע
  choice: tocou
  rationale: נגע significa normalmente “tocar, alcançar, atingir”. “Tocou” mantém a simplicidade verbal e não especifica o modo exato do contato.
- source_word: לְרַגְלָיו
  choice: os pés dele
  rationale: Mantém o sentido lexical direto de “pés” e também a ambiguidade do pronome masculino, que pode remeter a Moisés ou ao filho. A possível função eufemística é indicada em nota.
- source_word: כִּי
  choice: Sem dúvida
  rationale: Neste contexto, introduz uma exclamação enfática de Zípora; “Sem dúvida” comunica essa força de maneira natural.
- source_word: חֲתַן דָּמִים
  choice: um noivo de sangue
  rationale: A expressão hebraica é incomum e difícil. A formulação literal preserva sua imagem e sua ambiguidade, sem impor uma interpretação.
- source_word: לִי
  choice: para mim
  rationale: Expressa naturalmente a relação pessoal marcada pela preposição hebraica e combina bem com “noivo de sangue”.
theological_decisions:
- issue: Se “os pés dele” deve ser interpretado como eufemismo e se o pronome deve ser identificado como referência a Moisés ou ao filho
  choice: Manter “os pés dele” sem identificar o referente
  alternative: “os órgãos genitais dele”, “os pés/órgãos genitais de Moisés” ou “os pés/órgãos genitais do filho”
  rationale: O hebraico é genuinamente ambíguo. O texto principal conserva a expressão literal e o referente não especificado, enquanto a nota registra a principal possibilidade interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Pedra de pederneira” evita a possível impressão de que se tratava de um objeto metálico; “noivo de sangue” conserva deliberadamente a estranheza da expressão hebraica.
