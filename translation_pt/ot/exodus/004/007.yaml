base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: pt
  text: 'E ele disse: “Ponha a mão de volta dentro da roupa, junto ao peito[a]”. Ele pôs a mão de volta dentro da roupa, junto ao peito e, quando a tirou de lá, eis que ela havia voltado a ser como a sua carne[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na dobra da roupa, junto ao peito”.
    reason: cultural_note
  - marker: b
    text: Isto é, a mão havia voltado ao estado normal, como o restante de sua carne.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: Ponha ... de volta
  rationale: O imperativo hifil de שוב manda fazer a mão voltar ao lugar anterior. “Ponha ... de volta” é claro e natural em português.
- source_word: חֵיק
  choice: junto ao peito
  rationale: חֵיק designa o peito ou a dobra da roupa nessa região, onde a mão podia ser colocada. A formulação preserva a referência corporal sem impor no texto principal uma reconstrução específica da vestimenta.
- source_word: וַיָּשֶׁב
  choice: pôs ... de volta
  rationale: Mantém a repetição do verbo da ordem anterior e expressa naturalmente a ação realizada.
- source_word: וַיּוֹצִאָהּ
  choice: a tirou dali
  rationale: O hifil de יצא significa fazer sair ou tirar. O pronome feminino retoma “mão”, e “dali” evita uma repetição pesada sem perder o local de origem.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a função da partícula de chamar atenção para o resultado surpreendente, em registro bíblico digno e ainda compreensível.
- source_word: שָׁבָה
  choice: havia voltado a ser
  rationale: O verbo indica retorno ao estado anterior. A locução “voltado a ser” torna explícita em português a mudança de condição sem recorrer ao mais interpretativo “fora restaurada”.
- source_word: כִּבְשָׂרוֹ
  choice: como a sua carne
  rationale: Mantém de perto a comparação marcada por כ e conserva a formulação concisa do hebraico; o sentido de normalidade é esclarecido em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Evitou-se “seio”, que neste contexto pode soar arcaico ou ambíguo, e manteve-se “eis que” para reproduzir a ênfase narrativa de וְהִנֵּה.
