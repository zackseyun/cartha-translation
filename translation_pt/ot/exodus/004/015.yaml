  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: pt
  text: Fale com ele e ponha as palavras na boca dele. Eu estarei com a sua boca e com a boca dele[a] e ensinarei a vocês[b] o que deverão fazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Eu estarei com a sua boca e com a boca dele”. A expressão pode indicar que Deus ajudará você e Arão a falar.
    reason: lexical_alternative
  - marker: b
    text: O pronome e o verbo estão no plural e se referem a Moisés e Arão juntos.
    reason: grammatical_clarification
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Fale com ele
  rationale: O perfeito qal com waw, neste contexto instrutivo, tem força de ordem. O imperativo em português comunica essa função com naturalidade, sem transformar a ordem em mera previsão.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: e ponha as palavras na boca dele
  rationale: שׂים significa “pôr/colocar”, e a formulação conserva a imagem hebraica de fornecer a Arão aquilo que ele deve dizer.
- source_word: הַדְּבָרִים
  choice: as palavras
  rationale: Mantém o substantivo definido plural do hebraico. “A mensagem” seria mais interpretativo.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: Eu estarei com a sua boca e com a boca dele
  rationale: Preserva deliberadamente a expressão concreta do hebraico e sua imagem de presença e capacitação divina na fala.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: e ensinarei a vocês
  rationale: O hifil de ירה pode significar “ensinar” ou “instruir”. “Ensinarei” é claro e corrente; “a vocês” torna visível o plural hebraico.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: o que deverão fazer
  rationale: A construção relativa significa “o que”. A forma verbal está na segunda pessoa masculina plural e abrange Moisés e Arão; “deverão” conserva o sentido futuro e instrutivo.
theological_decisions:
- issue: Expressão antropomórfica da ajuda divina na fala
  choice: Manter “Eu estarei com a sua boca e com a boca dele” no texto principal.
  alternative: Eu ajudarei você e ele a falar.
  rationale: A redação hebraica apresenta a presença direta de Deus junto à boca de cada homem. Preservar a imagem evita reduzir a afirmação a uma paráfrase funcional.
- issue: Número dos pronomes e do verbo no fim do versículo
  choice: Explicitar o plural por meio de “a vocês” e “deverão fazer”.
  alternative: Usar formas que poderiam parecer dirigidas somente a Moisés.
  rationale: אֶתְכֶם e תַּעֲשׂוּן são inequivocamente plurais e se referem conjuntamente a Moisés e Arão. O português permite e favorece que essa distinção apareça no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você/vocês” em vez de “tu/vós”. Os imperativos “fale” e “ponha” exprimem naturalmente a força instrutiva do hebraico, enquanto a imagem concreta das “bocas” é preservada.
