base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: pt
  text: 'E o SENHOR lhe disse: “Quem deu boca ao ser humano? Ou quem torna alguém mudo, surdo, capaz de enxergar ou cego? Não sou eu, o SENHOR?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: deu boca ao ser humano
  rationale: Reproduz de modo natural a imagem hebraica de pôr ou conceder uma boca ao ser humano, sem restringir אָדָם ao sexo masculino.
- source_word: אִלֵּם
  choice: mudo
  rationale: Equivalente direto e corrente para a pessoa incapaz de falar.
- source_word: חֵרֵשׁ
  choice: surdo
  rationale: Equivalente direto do termo hebraico no contexto.
- source_word: פִּקֵּחַ
  choice: capaz de enxergar
  rationale: Aqui contrasta com “cego” e designa quem tem visão; esta formulação evita o sentido figurado predominante que “clarividente” ou “perspicaz” poderia sugerir.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino pelo título em versalete tipográfico, aqui indicado por maiúsculas.
theological_decisions:
- issue: Atribuição divina das capacidades e deficiências humanas
  choice: 'Preservar a afirmação direta: “Quem o faz mudo ou surdo, capaz de enxergar ou cego? Não sou eu, o SENHOR?”'
  alternative: Atenuar para linguagem de mera permissão divina
  rationale: O hebraico usa יָשׂוּם, “faz/estabelece”, e a pergunta retórica atribui explicitamente ao SENHOR essas condições; a tradução não deve resolver ou suavizar a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi condensada em “Quem o faz...” para fluidez, mantendo todos os contrastes do hebraico. Não há notas de rodapé.
