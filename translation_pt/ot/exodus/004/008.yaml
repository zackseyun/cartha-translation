source:
  edition: WLC
  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: pt
  text: E acontecerá que, se eles não acreditarem em você nem derem ouvidos à voz do primeiro sinal, acreditarão na voz do sinal seguinte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do último sinal”. O termo hebraico pode significar “seguinte”, “posterior” ou “último”; “seguinte” evita sugerir que nenhum outro sinal poderia vir depois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Preserva a fórmula hebraica que introduz uma condição futura, em português natural e digno.
- source_word: יַאֲמִינוּ לָךְ
  choice: acreditarem em você
  rationale: O hifil de אמן com ל indica acreditar ou confiar em alguém; esta formulação comunica a aceitação do testemunho de Moisés sem acrescentar uma nuance doutrinária.
- source_word: יִשְׁמְעוּ
  choice: derem ouvidos
  rationale: שׁמע aqui expressa escuta receptiva ou atenção. A expressão portuguesa preserva esse sentido sem tornar explícita a ideia mais forte de obedecer.
- source_word: לְקוֹל
  choice: à voz de
  rationale: Mantém a imagem hebraica na qual o sinal possui uma 'voz', isto é, dá testemunho por sua força evidencial.
- source_word: הָאֹת
  choice: sinal
  rationale: אוֹת designa um sinal e pode ser milagroso no contexto, mas o adjetivo 'milagroso' não está lexicalmente expresso.
- source_word: הָרִאשׁוֹן
  choice: primeiro
  rationale: Tradução direta de רִאשׁוֹן e contraste natural com o sinal seguinte.
- source_word: וְהֶאֱמִינוּ
  choice: acreditarão
  rationale: O contexto condicional deixa clara a consequência, sem necessidade de acrescentar 'então' à sintaxe portuguesa.
- source_word: הָאַחֲרוֹן
  choice: seguinte
  rationale: אַחֲרוֹן pode significar posterior ou último. 'Seguinte' identifica o segundo sinal em contraste com o primeiro sem sugerir que nenhum outro sinal virá.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A expressão 'dar ouvidos à voz do sinal' conserva a personificação hebraica, embora seja mais marcada do que uma paráfrase como 'aceitar o testemunho do sinal'.
