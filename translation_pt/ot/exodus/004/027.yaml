base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: pt
  text: 'Yahweh disse a Arão: “Vá ao deserto[a] para encontrar Moisés.” Arão foi e encontrou Moisés no monte de Deus e o beijou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá encontrar Moisés no deserto.” A construção hebraica pode destacar o movimento em direção ao deserto como o lugar do encontro.'
    reason: alternativa sintática e lexical
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título, conforme o valor do Tetragrama no texto hebraico.
- source_word: לֵךְ
  choice: Vá
  rationale: O imperativo de הלך pede uma ordem direta e concisa; “Vá” é natural em português.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: 'A expressão indica o propósito do deslocamento de Arão: ir para encontrar Moisés.'
- source_word: הַמִּדְבָּרָה
  choice: ao deserto
  rationale: A terminação direcional indica movimento rumo ao deserto; “ao deserto” conserva essa direção com naturalidade.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: encontrou Moisés
  rationale: פגשׁ significa encontrar ou deparar-se com alguém. A repetição do nome esclarece o referente do pronome hebraico sem acrescentar conteúdo.
- source_word: בְּהַר הָאֱלֹהִים
  choice: no monte de Deus
  rationale: Mantém de modo formal e idiomático a construção hebraica, sem decidir além do texto se o encontro ocorreu no cume ou na região do monte.
- source_word: וַיִּשַּׁק לוֹ
  choice: e o beijou
  rationale: Traduz diretamente o gesto de נשׁק, sem inserir no texto principal uma explicação cultural como “em saudação”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: “Yahweh” preserva o nome próprio revelado no texto hebraico; “o SENHOR” o substituiria por um título, e “Jeová” representa uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “ao deserto ao encontro de Moisés” preserva a direção expressa no hebraico; a nota registra a outra construção natural possível. Os nomes próprios são repetidos na segunda frase para evitar ambiguidade pronominal em português.
