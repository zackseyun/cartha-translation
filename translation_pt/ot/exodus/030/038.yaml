  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: pt
  text: Quem fizer incenso semelhante a esse para sentir seu aroma[a] será eliminado do meio do seu povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para desfrutar de sua fragrância” ou “para cheirar seu aroma”. O infinitivo hebraico indica que esse incenso é feito para ser cheirado ou apreciado pessoalmente.'
    reason: lexical_alternative
  - marker: b
    text: “Será eliminado do meio do seu povo” é uma fórmula jurídica tradicional. Conforme o contexto, pode indicar morte, expulsão ou remoção por ação divina.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Quem
  rationale: A expressão introduz genericamente qualquer pessoa que cumpra a condição; “Quem” é natural e preserva a estrutura jurídica.
- source_word: יַעֲשֶׂה
  choice: fizer
  rationale: O verbo עשה significa amplamente “fazer”; no contexto, refere-se à preparação do incenso.
- source_word: כָמֹהָ
  choice: incenso semelhante a esse
  rationale: O pronome retoma o incenso sagrado descrito anteriormente. A explicitação de “incenso” torna a referência clara em português sem exigir identidade absoluta da fórmula.
- source_word: לְהָרִיחַ בָּהּ
  choice: para sentir seu aroma
  rationale: A construção expressa a finalidade de cheirar ou desfrutar a fragrância. Esta formulação é natural em português e mantém a ideia de uso olfativo pessoal.
- source_word: וְנִכְרַת
  choice: será eliminado
  rationale: O nifal de כרת é uma fórmula jurídica de remoção severa. “Será eliminado” conserva sua força sem determinar o mecanismo da pena.
- source_word: מֵעַמָּיו
  choice: do meio do seu povo
  rationale: עם designa o povo ou a comunidade de pertença; a expressão escolhida reproduz de modo idiomático a fórmula de exclusão ou remoção.
theological_decisions:
- issue: Sentido da fórmula penal וְנִכְרַת מֵעַמָּיו
  choice: será eliminado do meio do seu povo
  alternative: será morto; será expulso da comunidade; será removido por juízo divino
  rationale: A fórmula jurídica hebraica não especifica inequivocamente, neste texto, se a sanção ocorre por morte, expulsão ou intervenção divina. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sentir seu aroma” evita a estranheza de “cheirá-lo”, enquanto “será eliminado do meio do seu povo” preserva a gravidade e a ambiguidade da fórmula legal.
