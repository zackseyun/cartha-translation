  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: pt
  text: Arão e seus filhos lavarão as mãos e os pés com a água dela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com água tirada dela», isto é, da bacia mencionada no contexto.'
    reason: alternativa lexical que torna explícita a origem da água indicada por מִמֶּנּוּ
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: lavarão
  rationale: O perfeito qal com waw, neste contexto de instruções, tem força prescritiva ou futura. «Lavarão» conserva o tom normativo e solene sem tornar a formulação desnecessariamente pesada.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּבָנָיו
  choice: e seus filhos
  rationale: Neste contexto sacerdotal, בָּנִים designa os filhos homens de Arão que serviriam como sacerdotes; «filhos» preserva essa especificidade.
- source_word: מִמֶּנּוּ
  choice: nele
  rationale: A preposição מִן com o sufixo remete à bacia mencionada no contexto. Em português, «lavar nele» é natural e mantém a referência ao recipiente, embora a ideia implícita seja lavar-se com água tirada dele.
- source_word: אֶת יְדֵיהֶם
  choice: as mãos
  rationale: Tradução direta do primeiro objeto da lavagem; o possuidor já está claro pelo sujeito plural.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: e os pés
  rationale: Tradução direta do segundo objeto coordenado; o possuidor já está claro pelo sujeito plural.
theological_decisions:
- issue: Referência sacerdotal específica quanto ao gênero
  choice: e seus filhos
  alternative: e seus descendentes / e seus filhos e filhas
  rationale: O contexto trata dos filhos homens de Arão que exerciam o sacerdócio. A tradução mantém a referência masculina do hebraico sem ampliá-la nem neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Lavarão» mantém o tom prescritivo das instruções cultuais; «nele» evita uma construção portuguesa pouco natural como «a partir dela», enquanto a nota registra a explicitação possível.
