base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH. O nome divino é tradicionalmente traduzido como “SENHOR”; sua pronúncia antiga não é conhecida com certeza, e “Yahweh” é uma transliteração possível.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: A forma narrativa com waw consecutivo introduz a etapa seguinte do relato; “então” expressa naturalmente essa progressão, e “falou” corresponde ao verbo דבר na fórmula de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino (YHWH), em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל marca o destinatário da fala; “falar a alguém” é uma construção natural e digna em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula, o infinitivo introduz o conteúdo da fala que vem em seguida. Em português atual, os dois-pontos desempenham essa função com mais naturalidade do que a tradução literal “dizendo”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva por transliteração e evita substituí-lo por um título; a nota registra a tradição portuguesa e a incerteza de pronúncia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula hebraica de introdução ao discurso foi vertida idiomaticamente com dois-pontos, sem perda de função.
