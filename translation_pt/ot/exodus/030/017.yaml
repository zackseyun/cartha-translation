lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O wayyiqtol de דבר faz avançar a narrativa. “E” mantém a conexão com o contexto, e “falou” distingue o verbo da fórmula seguinte, לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל marca o destinatário da fala; “a Moisés” é uma formulação natural e digna em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica convencional que introduz o discurso direto iniciado no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; a nota registra a tradição de vertê-lo como “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação inicial e a fórmula “falou... dizendo” preservam a estrutura narrativa hebraica e sua transição para a fala do versículo seguinte.
