  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: pt
  text: Faça as varas de madeira de acácia e revista-as de ouro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com וְ em uma sequência de instruções tem força diretiva. O imperativo em português comunica essa prescrição de modo natural e mantém a continuidade do contexto.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: No contexto do mobiliário sagrado, בַּדִּים designa as varas usadas para transportá-lo. “Varas” é a expressão corrente e clara em português.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A construção hebraica indica o material. “Madeira de acácia” identifica a madeira em linguagem moderna, sem recorrer à transliteração menos acessível “sitim”.
- source_word: וְצִפִּיתָ
  choice: e revista
  rationale: Neste contexto artesanal, צפה significa cobrir ou revestir uma peça com determinado material. “Revestir” expressa com precisão esse processo.
- source_word: אֹתָם
  choice: -as
  rationale: O pronome de objeto retoma הַבַּדִּים, “as varas”; a forma enclítica feminina plural produz uma referência clara e idiomática em português.
- source_word: זָהָב
  choice: de ouro
  rationale: Embora o hebraico apresente diretamente o material, “revestir de ouro” é uma construção natural em português e preserva o sentido.
