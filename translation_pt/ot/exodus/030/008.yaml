  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: pt
  text: E, quando Arão preparar as lâmpadas ao entardecer[a], queimará incenso regularmente[b] diante de Yahweh, por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as tardes”, expressão que designa o período do crepúsculo ou do entardecer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “incenso contínuo”. O termo hebraico pode enfatizar tanto a regularidade constante quanto a continuidade duradoura da oferta prescrita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: E, quando ... preparar
  rationale: A preposição com o infinitivo construto introduz uma oração temporal. O hifil de עלה, aplicado às lâmpadas, pode indicar fazer subir a chama, acender ou dispor para queimar; “preparar” preserva a nuance ritual sem limitar o sentido ao ato de acender.
- source_word: הַנֵּרֹת
  choice: as lâmpadas
  rationale: נֵרֹת é o termo comum para as lâmpadas no contexto dos utensílios do tabernáculo.
- source_word: בֵּין הָעַרְבַּיִם
  choice: ao entardecer
  rationale: A expressão hebraica significa literalmente “entre as tardes” e designa o período vespertino ou crepuscular. “Ao entardecer” é natural e claro em português; a forma literal é registrada em nota.
- source_word: יַקְטִירֶנָּה קְטֹרֶת
  choice: queimará o incenso
  rationale: O hifil de קטר, em contexto ritual, significa queimar ou fazer subir em fumaça como oferta. O sufixo feminino retoma קְטֹרֶת; em português, explicitar “o incenso” evita um pronome de referência pouco natural.
- source_word: תָּמִיד
  choice: regular
  rationale: תָּמִיד pode expressar continuidade ou recorrência constante. Como o rito é realizado em horários prescritos, “regular” comunica a repetição permanente sem sugerir combustão ininterrupta; “contínuo” permanece em nota como alternativa.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica presença no espaço cultual, e o nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão indica vigência ao longo das sucessivas gerações de Israel; esta formulação é clara e preserva o alcance temporal do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e pactual, sem substituí-lo por um título.
- issue: Sentido temporal de תָּמִיד no rito do incenso
  choice: regular
  alternative: contínuo; perpétuo
  rationale: O contexto descreve uma oferta repetida nos momentos prescritos, não necessariamente uma ação sem interrupção. A nota preserva a possível ênfase em continuidade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Preparar as lâmpadas” mantém a amplitude ritual do verbo; “ao entardecer” traduz o idioma hebraico no corpo do texto, preservando a forma literal em nota.
