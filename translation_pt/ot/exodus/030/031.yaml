- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: óleo sagrado da unção
  rationale: Expressa a relação construtiva do hebraico e evita a possível leitura de que o óleo unge a própria santidade; em português natural, designa o óleo separado para a unção sagrada.
- source_word: לִי
  choice: para mim
  rationale: Preserva a dedicação do óleo a Deus indicada pela preposição hebraica.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Comunica a continuidade através das sucessivas gerações de Israel.
theological_decisions:
- issue: A quem o óleo é consagrado
  choice: para mim
  alternative: meu
  rationale: A formulação mantém explícita a relação de consagração indicada por לִי sem transformar a frase apenas em declaração de posse.
