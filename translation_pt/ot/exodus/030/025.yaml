base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/025.yaml
  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: pt
  text: Faça dele um óleo sagrado para unção[a], uma mistura aromática preparada segundo a arte do perfumista; será um óleo sagrado para unção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um unguento composto” ou “uma mistura perfumada”; o hebraico enfatiza uma preparação aromática habilmente misturada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתוֹ
  choice: Faça dele
  rationale: O perfeito com waw, neste contexto de instruções, tem força de ordem. A construção portuguesa retoma naturalmente os ingredientes mencionados no versículo anterior e indica o produto resultante.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: óleo sagrado para unção
  rationale: Expressa de modo claro a cadeia construta hebraica e preserva tanto a finalidade ritual da unção quanto o caráter consagrado do óleo; a mesma formulação é mantida nas duas ocorrências.
- source_word: רֹקַח מִרְקַחַת
  choice: uma mistura aromática preparada
  rationale: Os termos cognatos ressaltam uma preparação aromática habilmente composta. A tradução comunica tanto a mistura quanto seu caráter perfumado sem recorrer a vocabulário arcaico.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: segundo a arte do perfumista
  rationale: A expressão designa o trabalho especializado de quem combina substâncias aromáticas. “Segundo a arte” salienta a perícia artesanal e soa natural em português.
- source_word: יִהְיֶה
  choice: será
  rationale: O imperfeito descreve o estado resultante da preparação; “será” preserva o tom prescritivo e solene sem artificialidade.
