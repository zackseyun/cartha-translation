  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Tome para si substâncias aromáticas: estoraque, ônica[a] e gálbano, substâncias aromáticas, e olíbano puro; sejam em partes iguais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As identificações exatas do estoraque e da ônica são incertas; os termos hebraicos provavelmente indicam ingredientes aromáticos específicos usados no incenso e são tradicionalmente traduzidos dessa forma.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: Expressa de modo natural o avanço narrativo marcado pelo waw consecutivo.
- source_word: קַח לְךָ
  choice: Tome para si
  rationale: Mantém a nuance pessoal de לְךָ sem perder a dignidade e a naturalidade em português.
- source_word: סַמִּים
  choice: substâncias aromáticas
  rationale: O termo é amplo e designa ingredientes aromáticos usados na preparação do incenso; esta escolha evita restringi-lo indevidamente a especiarias culinárias.
- source_word: נָטָף
  choice: estoraque
  rationale: É a designação tradicional em português para este ingrediente aromático, embora sua identificação exata permaneça incerta.
- source_word: שְׁחֵלֶת
  choice: ônica
  rationale: Mantém a designação tradicional deste ingrediente de identificação incerta, com a incerteza explicitada em nota.
- source_word: חֶלְבְּנָה
  choice: gálbano
  rationale: É a identificação habitual e lexicalmente bem sustentada dessa resina aromática.
- source_word: לְבֹנָה זַכָּה
  choice: olíbano puro
  rationale: Olíbano designa especificamente a resina aromática לְבֹנָה, e 'puro' traduz o qualificativo זַכָּה.
- source_word: בַּד בְּבַד
  choice: quantidades iguais de cada uma
  rationale: Comunica com clareza o sentido idiomático de partes ou proporções iguais.
- source_word: יִהְיֶה
  choice: use
  rationale: A formulação imperativa natural em português explicita a instrução implícita na cláusula hebraica, sem alterar a exigência de igualdade entre os ingredientes.
