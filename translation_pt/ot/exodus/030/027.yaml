  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: pt
  text: e a mesa e todos os seus utensílios, e o candelabro e seus utensílios, e o altar do incenso,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O substantivo significa simplesmente “mesa” neste contexto. Embora se refira à mesa sagrada do tabernáculo, o versículo não repete sua designação mais completa.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כְּלִי abrange utensílios, objetos e recipientes. “Utensílios” é claro, atual e apropriado para os acessórios da mesa.
- source_word: הַמְּנֹרָה
  choice: o candelabro
  rationale: Traduz o substantivo comum segundo sua função, em vez de transliterá-lo como “menorá”, e é uma designação bíblica amplamente compreensível em português.
- source_word: כֵּלֶיהָ
  choice: seus utensílios
  rationale: Mantém o mesmo sentido de כְּלִי; o sufixo feminino retoma o candelabro.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: o altar do incenso
  rationale: A construção hebraica designa o altar associado ao incenso. “Altar do incenso” é transparente, natural e preserva a relação nominal da expressão.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva a estrutura enumerativa do hebraico e a vírgula final, pois o versículo é parte de uma lista iniciada no contexto anterior e continuada no seguinte. A nota da camada inglesa não foi reproduzida: seu marcador aparece depois de “utensils”, mas o conteúdo trata de uma simples variante estilística para מִזְבַּח הַקְּטֹרֶת, sem ambiguidade lexical relevante no original.'
