  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: pt
  text: o altar do holocausto com todos os seus utensílios, e a bacia com seu suporte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: מִזְבַּח significa “altar”, e הָעֹלָה designa o sacrifício inteiramente queimado. “Altar do holocausto” preserva a terminologia sacrificial consagrada e continua clara no português moderno.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כְּלִי pode designar utensílio, recipiente ou instrumento. Neste contexto cultual, “utensílios” é abrangente e natural; o sufixo remete ao altar.
- source_word: הַכִּיֹּר
  choice: a bacia
  rationale: כִּיּוֹר designa a bacia usada nas lavagens do serviço do santuário. “Bacia” é atual e compreensível, ao contrário de termos tradicionais mais arcaicos.
- source_word: כַּנּוֹ
  choice: seu suporte
  rationale: כֵּן indica aqui a estrutura que sustenta a bacia. “Suporte” comunica sua função com naturalidade; “base” também seria possível.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção coordena os objetos da lista; o marcador hebraico de objeto direto não requer correspondência explícita em português.
