base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: pt
  text: Faça para ele duas argolas de ouro sob a sua moldura[a]. Faça-as nos seus dois painéis laterais, nos seus dois lados[b]. Elas servirão de suportes para as varas[c], para carregá-lo com elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “debaixo da sua borda” ou “abaixo do seu remate”; o termo hebraico זֵר indica a borda ornamental ao redor do altar.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nas suas duas estruturas laterais ... nos seus dois lados”, uma descrição repetitiva que enfatiza a colocação em ambos os lados.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “casas para as varas”, isto é, receptáculos ou suportes para as varas.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: argolas de ouro
  rationale: טַבַּעַת designa aqui argolas de fixação feitas de ouro. “Argolas de ouro” é claro e natural no contexto de uma peça de mobiliário transportável.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: debaixo da sua moldura
  rationale: זֵר refere-se à borda ornamental descrita no versículo anterior. “Moldura” expressa uma peça decorativa trabalhada sem restringir indevidamente sua forma.
- source_word: צַלְעֹתָיו
  choice: suas duas faces laterais
  rationale: צֵלָע pode indicar lado, estrutura lateral ou painel. “Faces laterais” preserva a ideia estrutural e evita a tradução literal inadequada “costelas”.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: uma de cada lado
  rationale: A expressão retoma a disposição bilateral das argolas. Esta formulação conserva a ênfase do hebraico e esclarece naturalmente que havia uma argola em cada lado.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: Elas servirão de suportes para as varas
  rationale: בָּתִּים, literalmente “casas”, é usado de modo funcional para receptáculos ou suportes. A tradução comunica essa função em português corrente.
- source_word: בַדִּים
  choice: varas
  rationale: בַּדִּים designa as varas usadas para transportar os utensílios do santuário. “Varas” é tradicional, atual e compreensível em português.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: com as quais ele será carregado
  rationale: A frase expressa finalidade e meio; o pronome feminino plural em português retoma “varas”. O pronome “ele” conserva o referente implícito do hebraico sem acrescentar “altar” ao texto.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: Faça ... Faça-as
  rationale: O imperfeito de instrução é vertido pelo imperativo formal em português. A repetição verbal do hebraico foi preservada, e o pronome retoma explicitamente as argolas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O imperativo “Faça” transmite diretamente o caráter instrutivo do hebraico. A repetição foi mantida sem produzir uma construção excessivamente rígida; o referente masculino permaneceu pronominal, como no texto-fonte.
