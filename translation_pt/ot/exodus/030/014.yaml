base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: pt
  text: Todo aquele que passar entre os recenseados[a], de vinte anos de idade para cima, dará a contribuição de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passar para os recenseados”. A expressão hebraica fala literalmente de alguém que “passa” em relação aos recenseados, provavelmente em referência ao procedimento do recenseamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר
  choice: Todo aquele que passar
  rationale: כֹּל rege o particípio seguinte e tem sentido distributivo. A formulação preserva tanto a abrangência de 'todo aquele' quanto a imagem verbal concreta de עבר, sem reduzi-la simplesmente a 'for recenseado'.
- source_word: עַל הַפְּקֻדִים
  choice: para o grupo dos recenseados
  rationale: פְּקֻדִים designa aqui os registrados ou contados no recenseamento. Com עבר, a preposição עַל forma uma expressão procedimental difícil; 'para o grupo dos recenseados' comunica a entrada entre os contados e mantém a ideia de movimento.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: de vinte anos de idade para cima
  rationale: Reproduz de modo natural em português a fórmula hebraica que estabelece o limite etário a partir dos vinte anos.
- source_word: יִתֵּן
  choice: dará
  rationale: O imperfeito tem força injuntiva no contexto legal. O futuro simples português expressa a determinação normativa com dignidade e naturalidade.
- source_word: תְּרוּמַת
  choice: a contribuição
  rationale: תְּרוּמָה é algo separado e entregue a Yahweh. Neste contexto de pagamento ligado ao recenseamento, 'contribuição' é mais preciso que o ritualizante 'oferta alçada' e evita interpretar o valor como tributo político.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal no texto sem substituí-lo por um título.
- issue: Grau de explicitação da expressão ligada ao recenseamento
  choice: passar para o grupo dos recenseados
  alternative: ser contado entre os recenseados; passar entre os contados
  rationale: A redação conserva a imagem de 'passar' presente no hebraico e, ao mesmo tempo, torna inteligível sua relação provável com o procedimento de recenseamento, sem eliminar a ambiguidade idiomática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção legal usa o futuro normativo 'dará'. A expressão incomum do hebraico sobre 'passar' foi mantida no texto e esclarecida pela nota, evitando tanto uma tradução obscura demais quanto a redução interpretativa a 'ser recenseado'.
