  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: pt
  text: 'Lavarão as mãos e os pés, para que não morram. Isso será para eles um estatuto permanente[a]: para ele[b] e para a sua descendência, por todas as suas gerações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estatuto perpétuo” ou “estatuto eterno”. A expressão hebraica חָק עוֹלָם é uma fórmula legal para uma ordenança duradoura.
    reason: lexical_alternative
  - marker: b
    text: “Ele” se refere a Arão no contexto imediato.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: Lavarão
  rationale: O perfeito qal com conjunção, neste contexto legal, tem força prescritiva. O futuro do indicativo é natural no estilo legislativo português e preserva essa força.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: as mãos e os pés
  rationale: Tradução direta das partes do corpo, com os artigos definidos usados naturalmente em português quando o possuidor já está indicado pelo sujeito.
- source_word: וְלֹא יָמֻתוּ
  choice: para que não morram
  rationale: Expressa com clareza a finalidade ou consequência ligada à lavagem ritual, sem reduzir a cláusula a mera previsão.
- source_word: וְהָיְתָה לָהֶם
  choice: Isso será para eles
  rationale: O pronome demonstrativo explicita em português o sujeito implícito, retomando a prescrição anterior.
- source_word: חָק עוֹלָם
  choice: estatuto permanente
  rationale: A fórmula legal designa uma ordenança duradoura. “Permanente” mantém sua força sem impor uma definição filosófica de duração infinita.
- source_word: לּוֹ
  choice: para ele
  rationale: Preserva o pronome singular hebraico; no contexto imediato, seu referente é Arão.
- source_word: וּלְזַרְעוֹ
  choice: e para a sua descendência
  rationale: זֶרַע designa aqui a linhagem ou posteridade. “Descendência” é corrente, coletiva e adequada ao registro.
- source_word: לְדֹרֹתָם
  choice: por todas as suas gerações
  rationale: Formulação idiomática que comunica a continuidade da obrigação ao longo das gerações sucessivas.
theological_decisions:
- issue: Duração do estatuto cultual em חָק עוֹלָם
  choice: estatuto permanente
  alternative: estatuto perpétuo; estatuto eterno
  rationale: A expressão hebraica é uma fórmula legal de obrigação duradoura no contexto da instituição cultual. “Permanente” preserva essa força sem resolver além do texto a questão do alcance temporal.
- issue: Referente do pronome singular לּוֹ
  choice: para ele, com nota identificando Arão
  alternative: para Arão
  rationale: Manter o pronome conserva a forma e a leve mudança de número do hebraico; a nota esclarece o referente contextual sem inseri-lo diretamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva o tom prescritivo da legislação, evitando arcaísmos como “para que não pereçam”.
