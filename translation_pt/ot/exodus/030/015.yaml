  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: pt
  text: O rico não dará mais, e o pobre não dará menos do que meio siclo, ao dar a contribuição a Yahweh, para fazer expiação por suas vidas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por suas almas”. O hebraico néfesh pode significar alma, ser, pessoa ou vida. Neste contexto de pagamento ligado ao censo, provavelmente se refere às vidas ou às pessoas contadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: o rico
  rationale: O adjetivo com artigo funciona como substantivo representativo de uma classe; “o rico” preserva a forma singular e o contraste jurídico com “o pobre”.
- source_word: יַרְבֶּה
  choice: não dará mais
  rationale: No contexto de uma contribuição de valor fixo, o verbo significa aumentar a quantia entregue; a formulação é clara e idiomática.
- source_word: הַדַּל
  choice: o pobre
  rationale: O termo indica quem dispõe de poucos recursos econômicos e forma o contraste direto com “o rico”.
- source_word: יַמְעִיט
  choice: não dará menos
  rationale: Expressa a redução da quantia devida e mantém o paralelismo equilibrado com “não dará mais”.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: do que meio siclo
  rationale: A preposição introduz o padrão de comparação depois das formas verbais negativas; “meio siclo” é natural em português e mantém a antiga unidade de peso e valor.
- source_word: לָתֵת
  choice: ao entregarem
  rationale: O infinitivo situa a determinação no ato de apresentar a contribuição; o plural retoma naturalmente tanto ricos como pobres.
- source_word: תְּרוּמַת יְהוָה
  choice: a contribuição a Yahweh
  rationale: תְּרוּמָה designa algo separado e entregue para uso sagrado; “contribuição” se ajusta ao pagamento censitário sem sugerir necessariamente um sacrifício.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְכַפֵּר
  choice: para fazer expiação
  rationale: Mantém a linguagem cultual e sua amplitude teológica, sem impor uma teoria específica sobre o mecanismo da expiação.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: por suas vidas
  rationale: Neste contexto de resgate ligado ao censo, נֶפֶשׁ se refere mais naturalmente às vidas ou pessoas contadas do que apenas a uma parte imaterial do ser humano.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o caráter de nome pessoal do tetragrama sem substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ no contexto de expiação e censo
  choice: por suas vidas
  alternative: por suas almas; por vocês mesmos
  rationale: “Vidas” comunica o sentido concreto das pessoas cuja vida está abrangida pelo pagamento, sem fazer uma afirmação antropológica mais estreita.
- issue: Sentido cultual de כפר
  choice: fazer expiação
  alternative: expiar; fazer propiciação; pagar resgate
  rationale: “Fazer expiação” é uma expressão acessível e tradicionalmente reconhecível, mas não resolve de modo indevido as nuances cultuais do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo jurídico entre rico e pobre foi preservado; “siclo” mantém a unidade histórica, e “Yahweh” conserva o nome divino.
