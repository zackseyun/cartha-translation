  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: pt
  text: Arão fará expiação sobre os chifres do altar uma vez por ano. Com o sangue da oferta pelo pecado para expiação[a], fará expiação pelo altar uma vez por ano, ao longo de suas gerações. O altar é santíssimo para Javé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “oferta pelo pecado das expiações”. O plural hebraico pode designar os ritos de expiação ou a expiação em sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: fará expiação
  rationale: Em contexto ritual sacerdotal, כפר designa a realização do rito expiatório. “Fazer expiação” conserva o sentido cultual sem reduzi-lo a uma ideia genérica de cobrir ou limpar.
- source_word: קַרְנֹתָיו
  choice: os chifres do altar
  rationale: O sufixo retoma o altar de incenso do contexto imediato. A repetição explícita de “altar” evita a forma pouco natural ou momentaneamente ambígua “seus chifres” em português.
- source_word: אַחַת בַּשָּׁנָה
  choice: uma vez por ano
  rationale: Equivalente português natural e exato da expressão distributiva hebraica.
- source_word: מִדַּם
  choice: com o sangue
  rationale: Embora מִן tenha valor básico de origem ou partição, aqui a construção indica o meio ritual empregado; “com o sangue” é idiomático e preserva essa função.
- source_word: חַטַּאת
  choice: oferta pelo pecado
  rationale: Neste contexto sacrificial, חטאת designa a oferta, não o pecado em sentido abstrato. A expressão mantém a terminologia bíblica tradicional e inteligível.
- source_word: הַכִּפֻּרִים
  choice: para expiação
  rationale: O plural hebraico é idiomaticamente expresso no singular abstrato em português. A nota registra a forma literal e evita uma construção artificial no texto principal.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Expressa a continuidade da prescrição entre as sucessivas gerações do povo.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssimo
  rationale: A construção hebraica intensiva indica o grau máximo de santidade. “Santíssimo” evita confusão com o nome do compartimento interno do santuário.
- source_word: לַיהוָה
  choice: para Javé
  rationale: A preposição indica relação ou consagração, e “para” é natural neste contexto. “Javé” representa o nome divino יהוה de modo explícito e reconhecível em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Javé
  alternative: o SENHOR
  rationale: O texto hebraico traz o nome pessoal da aliança. “Javé” o representa explicitamente em português, em vez de substituí-lo pelo título “SENHOR”, sem acrescentar interpretação doutrinária.
- issue: Referente de “ele” em קֹדֶשׁ קָדָשִׁים הוּא
  choice: Ele é santíssimo para Javé
  alternative: O altar é santíssimo para Javé
  rationale: O pronome hebraico retoma naturalmente o altar, mas a tradução conserva a forma pronominal do original e sua coesão com a frase precedente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação explicita “altar” onde o hebraico emprega sufixos pronominais, para evitar ambiguidade referencial, mas mantém o pronome na declaração final. A terminologia sacrificial permanece formal sem ser arcaica.
