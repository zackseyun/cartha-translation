id: EXO.30.2
reference: Exodus 30:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַמָּ֨ה אָרְכּ֜/וֹ וְ/אַמָּ֤ה רָחְבּ/וֹ֙ רָב֣וּעַ יִהְיֶ֔ה וְ/אַמָּתַ֖יִם קֹמָת֑/וֹ מִמֶּ֖/נּוּ קַרְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: pt
  text: Terá um côvado[a] de comprimento e um côvado de largura; será quadrado e terá dois côvados de altura. Seus chifres formarão com ele uma só peça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O côvado era uma antiga medida de comprimento baseada no antebraço. Seu valor exato variava; aqui, não se faz uma conversão moderna para evitar uma precisão indevida.
    reason: cultural_context
  - marker: b
    text: Literalmente, “dele” ou “a partir dele”; isto é, os chifres deveriam fazer parte do próprio altar, não ser fixados separadamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה / אַמָּתַיִם
  choice: um côvado / dois côvados
  rationale: Mantém a antiga unidade de medida sem impor uma conversão moderna de precisão enganosa; a forma dual אַמָּתַיִם indica explicitamente dois côvados.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: Expressa de modo natural em português a dimensão longitudinal do altar; o referente do sufixo masculino singular é recuperado pela construção com o verbo "terá".
- source_word: רָחְבּוֹ
  choice: de largura
  rationale: É a equivalência moderna e clara para a dimensão transversal.
- source_word: רָבוּעַ
  choice: quadrado
  rationale: Transmite diretamente a forma de quatro lados iguais, sem recorrer a uma expressão arcaica como "quadrangular" ou "de quatro lados".
- source_word: יִהְיֶה
  choice: será
  rationale: O imperfeito tem valor prescritivo nas instruções para a construção; o futuro em português comunica naturalmente essa especificação.
- source_word: קֹמָתוֹ
  choice: de altura
  rationale: No contexto de uma estrutura, "altura" é o equivalente idiomático de קֹמָה.
- source_word: מִמֶּנּוּ
  choice: formarão com ele uma só peça
  rationale: Embora literalmente signifique "dele" ou "a partir dele", no contexto artesanal indica que os chifres devem ser integrais ao altar, e não peças fixadas separadamente.
- source_word: קַרְנֹתָיו
  choice: seus chifres
  rationale: Conserva a terminologia cultual e as ligações com outras referências bíblicas às projeções em forma de chifre nos cantos do altar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe prescritiva natural. Conserva a unidade antiga "côvado" e o termo cultual "chifres", esclarecendo em nota tanto a medida variável quanto a construção integral indicada por מִמֶּנּוּ.
