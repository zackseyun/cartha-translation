base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/024.yaml
  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
translation:
  language: pt
  text: e quinhentos siclos de cássia, segundo o siclo do santuário, e um him de azeite de oliva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O him era uma antiga medida de líquidos; muitos calculam que correspondia a cerca de 3,5 a 4 litros.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: cássia
  rationale: Designa a cássia, casca aromática usada em perfumes; «cássia» é o equivalente português conciso e adequado à lista de ingredientes.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: quinhentos siclos
  rationale: O numeral indica a quantidade, e a unidade de peso expressa mais adiante no hebraico aplica-se a ela; explicitá-la aqui produz português natural sem alterar o sentido.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão especifica o padrão oficial de peso pelo qual a quantidade devia ser calculada.
- source_word: שֶׁמֶן זַיִת
  choice: azeite de oliva
  rationale: Forma corrente e amplamente compreensível em português para o óleo extraído da oliva.
- source_word: הִין
  choice: um him
  rationale: Mantém a unidade antiga específica, em vez de substituí-la por uma conversão moderna apenas aproximada.
- source_word: וְ
  choice: e
  rationale: Preserva a ligação deste item com os ingredientes anteriores e com o azeite na sequência da receita.
