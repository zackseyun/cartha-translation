  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: pt
  text: Arão queimará sobre ele incenso aromático todas as manhãs[a]; quando cuidar das lâmpadas[b], queimará o incenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “manhã após manhã”. A repetição no hebraico enfatiza a regularidade diária.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando puser em ordem as lâmpadas” ou “quando aparar as lâmpadas”. O verbo hebraico abrange o cuidado de prepará-las adequadamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: queimará
  rationale: O hifil de קטר, em contexto ritual, indica fazer a oferta subir em fumaça. “Queimará” é natural e preserva a ação cultual sem paráfrase excessiva.
- source_word: עָלָיו
  choice: sobre ele
  rationale: Retoma o altar do incenso mencionado no contexto anterior. O pronome masculino concorda naturalmente com “altar” em português.
- source_word: קְטֹרֶת סַמִּים
  choice: incenso aromático
  rationale: קְטֹרֶת designa incenso, e סַמִּים indica as substâncias aromáticas que o compõem. A expressão é clara, natural e semanticamente fiel.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: todas as manhãs
  rationale: A repetição hebraica tem força distributiva e enfatiza a prática diária regular. “Todas as manhãs” comunica isso de modo corrente em português; a forma mais literal consta em nota.
- source_word: בְּהֵיטִיבוֹ
  choice: quando cuidar
  rationale: O hifil de יטב refere-se aqui a pôr as lâmpadas em boas condições, incluindo prepará-las ou apará-las. “Cuidar” preserva a amplitude da ação sem especificar apenas uma de suas etapas.
- source_word: הַנֵּרֹת
  choice: das lâmpadas
  rationale: Refere-se às lâmpadas do santuário já conhecidas pelo contexto; não é necessário explicitar o candelabro.
- source_word: יַקְטִירֶנָּה
  choice: queimará o incenso
  rationale: O sufixo feminino singular retoma קְטֹרֶת. Repetir “o incenso” evita em português a possível ambiguidade de “o queimará”, que poderia parecer retomar o altar.
