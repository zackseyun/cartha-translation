  text: וְ/עָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְ/כַנּ֥/וֹ נְחֹ֖שֶׁת לְ/רָחְצָ֑ה וְ/נָתַתָּ֣ אֹת֗/וֹ בֵּֽין אֹ֤הֶל מוֹעֵד֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ וְ/נָתַתָּ֥ שָׁ֖מָּ/ה מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: pt
  text: Faça uma bacia de bronze[a], com seu suporte também de bronze[b], para as lavagens. Coloque-a entre a tenda do encontro e o altar, e ponha água nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pia”. O termo hebraico designa um grande recipiente usado para as lavagens no santuário.
    reason: lexical_alternative
  - marker: b
    text: “Bronze” também pode ser traduzido por “cobre”; o termo hebraico pode indicar cobre ou uma liga de cobre, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: bacia
  rationale: Designa um recipiente grande para água usado nas lavagens do santuário. “Bacia” é claro e corrente em português; “pia” é uma alternativa tradicional.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode designar cobre ou uma liga de cobre; no contexto dos utensílios do santuário, “bronze” é a tradução convencional e plausível.
- source_word: כַּן
  choice: suporte
  rationale: Designa a estrutura que sustentava a bacia. “Suporte” comunica a função de modo natural; “base” também é possível.
- source_word: לְרָחְצָה
  choice: para as lavagens
  rationale: O infinitivo indica finalidade. A formulação mantém concisão e não explicita neste versículo quem seria lavado.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução clara e amplamente compreensível para a designação do santuário, sem expandir o sentido.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Equivalente direto e inequívoco no contexto cultual.
- source_word: שָׁמָּה
  choice: nela
  rationale: Embora o advérbio signifique literalmente “ali/lá”, o contexto aponta para a bacia como recipiente da água. “Nela” evita que o português sugira água derramada apenas no local.
- source_word: מַיִם
  choice: água
  rationale: Equivalente direto; o substantivo hebraico de forma plural funciona aqui como nome de massa.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Faça ... Coloque ... ponha
  rationale: No contexto instrutivo, as formas verbais têm força diretiva. O imperativo em português é natural, claro e preserva essa força.
