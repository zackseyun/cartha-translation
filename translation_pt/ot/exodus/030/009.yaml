source:
  edition: WLC
  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: pt
  text: Não ofereçam sobre ele incenso não autorizado[a], nem holocausto, nem oferta de cereal; e não derramem sobre ele oferta de bebida alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “incenso estranho” ou “incenso estrangeiro”. O adjetivo hebraico pode indicar, neste contexto cultual, algo fora do que foi permitido ou prescrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: ofereçam
  rationale: O hifil de עלה significa literalmente “fazer subir”, mas, em contexto sacrificial, é a forma idiomática de dizer “oferecer” sobre um altar.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O pronome retoma o altar de incenso no contexto; “sobre ele” preserva com naturalidade a relação espacial.
- source_word: קְטֹרֶת זָרָה
  choice: incenso não autorizado
  rationale: קְטֹרֶת é “incenso”, e זָרָה, neste contexto cultual, indica algo alheio ao que foi permitido ou prescrito, não necessariamente algo estrangeiro em sentido étnico.
- source_word: וְעֹלָה
  choice: nem holocausto
  rationale: עֹלָה designa a oferta totalmente queimada. Na sequência de uma proibição, a conjunção hebraica é expressa naturalmente por “nem” em português.
- source_word: וּמִנְחָה
  choice: nem oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה normalmente designa a oferta feita de cereal; esta formulação é clara e específica.
- source_word: וְנֵסֶךְ
  choice: nenhuma oferta de bebida
  rationale: נֵסֶךְ é uma oferta líquida derramada. “Oferta de bebida” é compreensível e mantém a terminologia ritual sem recorrer ao menos acessível “libação”.
- source_word: תִסְּכוּ
  choice: derramem
  rationale: O verbo נסך descreve o ato ritual de derramar uma oferta líquida; “derramar” comunica diretamente a ação.
theological_decisions:
- issue: Sentido cultual de זָרָה ao qualificar o incenso
  choice: não autorizado
  alternative: estranho; estrangeiro
  rationale: A passagem regulamenta o culto no altar de incenso. “Não autorizado” comunica que se trata de incenso fora do que foi permitido ou prescrito, sem reduzir o termo à ideia de procedência étnica. A nota preserva as alternativas lexicais tradicionais.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo plural de leitura natural no Brasil e compreensão internacional. “Holocausto” mantém o termo cultual bíblico consolidado; “oferta de cereal” e “oferta de bebida” tornam explícitos os tipos de oferta.
