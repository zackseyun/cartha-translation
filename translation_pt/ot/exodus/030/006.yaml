  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: pt
  text: Coloque-o diante do véu que está diante da arca do testemunho[b], diante do propiciatório[a] que está sobre o testemunho, onde me encontrarei com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tampa da expiação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “arca do testemunho”. A expressão tradicional “arca da aliança” usa aqui um termo diferente do que consta no texto hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Coloque-o
  rationale: O verbo נתן tem sentido amplo de dar, pôr ou colocar. Neste contexto de instrução cultual, “coloque” expressa de modo natural e direto a ação ordenada; o pronome retoma o altar do incenso.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A expressão, repetida no versículo, indica posição espacial. “Diante de” preserva essa repetição e mantém um registro formal, mas corrente.
- source_word: הַפָּרֹכֶת
  choice: o véu
  rationale: פרכת designa a cortina interior que separava o Santo dos Santos. “Véu” é o termo cultual tradicional e continua compreensível em português.
- source_word: אֲרֹן הָעֵדֻת
  choice: a arca do testemunho
  rationale: O hebraico traz literalmente “testemunho”, não “aliança”. A tradução conserva essa distinção lexical.
- source_word: הַכַּפֹּרֶת
  choice: o propiciatório
  rationale: כפרת designa a cobertura de ouro sobre a arca, associada ao rito de expiação. “Propiciatório” é o termo cultual consolidado em português; uma alternativa explicativa aparece em nota.
- source_word: הָעֵדֻת
  choice: o testemunho
  rationale: A tradução mantém o mesmo equivalente usado na expressão “arca do testemunho”, sem substituí-lo pelo termo diferente “aliança”.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: onde me encontrarei com você
  rationale: O nifal de יעד indica um encontro estabelecido. “Onde” incorpora naturalmente o sentido locativo de שָׁמָּה, e “me encontrarei com você” preserva a referência direta ao encontro divino sem acrescentar uma interpretação.
theological_decisions:
- issue: Tradução do termo cultual הַכַּפֹּרֶת
  choice: propiciatório
  alternative: tampa da expiação
  rationale: “Propiciatório” preserva o referente cultual tradicional sem reduzir o termo a uma explicação doutrinária específica. A nota oferece uma formulação funcional mais transparente.
- issue: Tradução de עֵדוּת na expressão referente à arca
  choice: testemunho
  alternative: aliança
  rationale: O texto hebraico emprega עֵדוּת, “testemunho”. Traduzir por “aliança” importaria a formulação tradicional “arca da aliança”, baseada em outro vocábulo, e apagaria a escolha lexical deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e ampla inteligibilidade internacional. A repetição de “diante” reproduz a estrutura espacial do hebraico. O singular “você” representa a fala dirigida a Moisés.
