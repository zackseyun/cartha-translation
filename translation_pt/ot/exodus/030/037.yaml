revisions:
- from: E o incenso que você fizer segundo a sua composição[a], não o façam para uso próprio[b]; ele será considerado santo por vocês, dedicado a Yahweh.
  to: E, quanto ao incenso que você preparar segundo a sua composição[a], vocês não devem fazê-lo para si mesmos[b]; ele será santo para você, para Yahweh.
  rationale: A revisão conserva a alternância do hebraico entre o singular («você preparar»; «para você») e o plural da proibição («vocês não devem»), tornando-a inteligível em português. Remove também «considerado», que não está expresso no original, e evita explicitar além do necessário a relação final com Yahweh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:52Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente o incenso, a composição prescrita, a proibição de reprodução para uso próprio e a santidade relacionada a Yahweh. Contudo, «será considerado santo por vocês» muda a construção predicativa hebraica («será santo para você») e introduz a noção interpretativa de ser considerado; além disso, substitui o singular final por plural.
  naturalness: O texto atual mistura «você fizer» com «não o façam» sem explicitar a mudança de destinatário. O hebraico de fato alterna singular e plural, mas em português moderno a transição fica mais clara com «vocês não devem».
  terminology: «Incenso», «composição», «santo» e «Yahweh» são adequados. «Dedicado a Yahweh» é uma explicitação aceitável do último sintagma, mas, combinada com «considerado santo por vocês», afasta-se desnecessariamente da forma e da ambiguidade do original.
  issues:
  - severity: medium
    issue: «será considerado santo por vocês»
    rationale: O hebraico diz literalmente que o incenso «será santo para você», não que será considerado santo por um grupo. A formulação introduz uma mediação cognitiva ausente e altera o singular do destinatário.
  - severity: low
    issue: Alternância de pessoa pouco clara
    rationale: «Você fizer» seguido de «não o façam» reflete formalmente a alternância hebraica, mas sem sujeito expresso soa como incongruência em português. Explicitar «vocês» na proibição preserva a mudança textual com mais clareza.
  revised_text: E, quanto ao incenso que você preparar segundo a sua composição[a], vocês não devem fazê-lo para si mesmos[b]; ele será santo para você, para Yahweh.
  revised_footnotes:
  - marker: a
    text: Ou “segundo a sua fórmula” ou “segundo as suas proporções”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, essa mistura sagrada de incenso não devia ser reproduzida para uso pessoal comum.
    reason: cultural_note
