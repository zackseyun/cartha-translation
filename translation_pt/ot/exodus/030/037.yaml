base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: pt
  text: E, quanto ao incenso que você preparar segundo a sua composição[a], vocês não devem fazê-lo para si mesmos[b]; ele será santo para você, para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a sua fórmula” ou “segundo as suas proporções”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, essa mistura sagrada de incenso não devia ser reproduzida para uso pessoal comum.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: o incenso
  rationale: Designa a mistura sagrada de incenso descrita no contexto imediato; a tradução simples evita acrescentar uma qualificação ausente neste versículo.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: que você fizer
  rationale: Preserva o singular do hebraico e introduz naturalmente, em português, a oração relativa.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: segundo a sua composição
  rationale: Expressa a ideia da composição ou proporção prescrita sem impor uma precisão técnico-científica moderna.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: não o façam para uso próprio
  rationale: Mantém o plural da proibição e explicita com naturalidade o valor do dativo reflexivo, isto é, fabricar para si mesmos.
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: ele será considerado santo por vocês
  rationale: Comunica que Israel deve reconhecer e tratar o incenso como santo. O plural português harmoniza o referente coletivo implícito na alternância hebraica entre singular e plural.
- source_word: לַיהוָה
  choice: dedicado a Yahweh
  rationale: A preposição indica orientação, pertença ou consagração; 'dedicado a' torna clara essa relação sem reduzir o nome divino a um título.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido da santidade do incenso
  choice: santo e dedicado a Yahweh
  alternative: apenas reservado para uso ritual
  rationale: Preserva tanto o estatuto sagrado expresso por קֹדֶשׁ quanto sua relação com Yahweh, sem reduzir santidade a mera restrição prática.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira. A alternância do original entre formas no singular e no plural foi preservada de modo compreensível: ''você fizer'' e ''não o façam''. O pronome ''ele'' retoma ''incenso'' sem ambiguidade.'
