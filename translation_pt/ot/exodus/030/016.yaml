  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: pt
  text: Você recolherá dos filhos de Israel o dinheiro da expiação[a] e o destinará ao serviço da tenda do encontro. Esse dinheiro servirá aos filhos de Israel como memorial diante de Yahweh, para fazer expiação pela vida de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “o dinheiro do resgate”. O hebraico traz literalmente “o dinheiro das expiações”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “por suas vidas” ou “por suas pessoas”; tradicionalmente, “por suas almas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: o dinheiro da expiação
  rationale: כֶּסֶף pode designar prata ou dinheiro; no contexto, trata-se da contribuição monetária do recenseamento. הַכִּפֻּרִים, plural de valor abstrato ligado a כפר, tem sentido cultual de expiação. A formulação é clara e preserva esse sentido.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Reproduz de modo transparente a expressão hebraica masculina plural usada coletivamente para o povo da aliança, sem excluir a alternativa idiomática “dos israelitas”.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: ao serviço da tenda do encontro
  rationale: עַל indica aqui destinação, e עֲבֹדָה se refere ao serviço ou trabalho ligado ao santuário. “Tenda do encontro” é a designação direta e tradicional de אֹהֶל מוֹעֵד.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: servirá ... como memorial
  rationale: זִכָּרוֹן denota algo que mantém a lembrança diante de Deus. “Servirá ... como memorial” é natural em português e conserva a função cultual da oferta.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa presença ou comparecimento diante de alguém; o nome próprio divino יהוה é transliterado como “Yahweh”.
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵיכֶם
  choice: para fazer expiação pela vida de vocês
  rationale: O infinitivo piel de כפר conserva o sentido cultual de fazer expiação. נֶפֶשׁ, neste contexto de pagamento de resgate, refere-se à vida ou à própria pessoa, não necessariamente a uma “alma” separada do corpo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio da designação divina sem substituí-la por um título.
- issue: Sentido expiatório de כפר no pagamento do recenseamento
  choice: fazer expiação
  alternative: resgatar; fazer propiciação
  rationale: A tradução mantém a terminologia cultual ampla do verbo hebraico e não decide além do texto qual mecanismo teológico específico está em vista.
- issue: Referente de נַפְשֹׁתֵיכֶם
  choice: pela vida de vocês
  alternative: por vocês mesmos; por suas almas
  rationale: Aqui נֶפֶשׁ designa as vidas ou pessoas protegidas mediante o pagamento. “Almas” poderia sugerir uma dicotomia antropológica não exigida pelo hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Você/vocês” torna explícita a mudança do destinatário singular para o plural presente no hebraico. A segunda ocorrência de “esse dinheiro” explicita o referente do pronome hebraico e evita ambiguidade em português.
