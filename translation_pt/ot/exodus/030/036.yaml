  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: pt
  text: Moa uma parte dela até ficar bem fina e coloque uma parte dela diante do testemunho, na tenda do encontro, onde me encontrarei com você. A mistura será santíssima para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “santo dos santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ מִמֶּנָּה הָדֵק
  choice: Moa uma parte dela até ficar bem fina
  rationale: שׁחק descreve a redução da mistura de incenso a partículas finas; “moer” é natural em português, e “até ficar bem fina” comunica o valor intensificador/resultativo de הָדֵק.
- source_word: מִמֶּנָּה
  choice: uma parte dela
  rationale: 'A preposição com o pronome tem sentido partitivo: apenas uma porção da mistura deve ser moída e colocada diante do testemunho.'
- source_word: וְנָתַתָּה
  choice: e coloque
  rationale: נתן pode significar dar, pôr ou colocar; neste contexto ritual, “coloque” expressa com clareza a ação de posicionar o incenso.
- source_word: לִפְנֵי הָעֵדֻת
  choice: diante do testemunho
  rationale: Mantém o termo cultual do hebraico sem explicá-lo como “arca” ou “tábuas”, referentes possíveis que o versículo não explicita.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução clara e formal da designação do santuário, preservando a ideia de encontro presente em מוֹעֵד.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: onde me encontrarei com você
  rationale: O nifal de יעד indica o encontro determinado por Deus. O singular “você” preserva o destinatário singular da forma לְךָ.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A construção hebraica exprime o grau máximo de santidade. “Santíssima” é corrente e digna em português; a forma estruturalmente mais literal fica registrada em nota.
- source_word: תִּהְיֶה לָכֶם
  choice: Ela será santíssima para vocês
  rationale: O feminino singular acompanha o referente contextual, a mistura de incenso, enquanto “para vocês” preserva o plural de לָכֶם sem definir de modo excessivo posse ou beneficiários.
theological_decisions:
- issue: Referente de “o testemunho”
  choice: Conservar “o testemunho” no texto principal.
  alternative: “a arca do testemunho” ou “as tábuas da aliança”
  rationale: O hebraico menciona o testemunho, sem identificar expressamente neste versículo a arca ou as tábuas. A formulação evita estreitar uma referência cultual genuinamente não explicitada.
- issue: Expressão superlativa de santidade
  choice: Traduzir קֹדֶשׁ קָדָשִׁים por “santíssima”.
  alternative: “santo dos santos”
  rationale: “Santíssima” comunica naturalmente o superlativo hebraico aplicado à mistura de incenso, enquanto a tradução mais formal é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservam-se os termos cultuais “testemunho” e “tenda do encontro”; o singular “você” e o plural “vocês” refletem a alternância numérica do hebraico.
