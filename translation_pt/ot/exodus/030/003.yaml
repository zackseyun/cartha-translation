  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: pt
  text: Você o revestirá de ouro puro — sua parte superior, suas paredes ao redor e seus chifres — e fará para ele uma moldura de ouro ao redor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma coroa de ouro ao redor”. O hebraico zēr pode designar uma borda, um aro ou uma moldura semelhante a uma coroa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Você o revestirá
  rationale: O verbo צפה, nesta construção, indica aplicar sobre o objeto uma camada de outro material; “revestir” é natural em português e transmite melhor essa ideia do que simplesmente “cobrir”.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Expressão portuguesa corrente e exata para ouro de elevada pureza.
- source_word: גַּגּוֹ
  choice: a parte de cima
  rationale: Embora גג frequentemente signifique “teto”, aqui designa a superfície superior de um pequeno altar; “a parte de cima” é clara e idiomática.
- source_word: קִירֹתָיו
  choice: as paredes
  rationale: Mantém o sentido lexical de קִירֹתָיו e é compreensível como referência às superfícies verticais do altar.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa que as paredes circundantes e a moldura abrangem todo o contorno, preservando também a repetição hebraica.
- source_word: קַרְנֹתָיו
  choice: os chifres
  rationale: Conserva literalmente o termo técnico cultual para as projeções nos cantos do altar.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: e fará para ele
  rationale: Reflete a construção hebraica com ל, segundo a qual esse elemento deve ser feito para o altar.
- source_word: זֵר זָהָב
  choice: uma moldura de ouro
  rationale: זֵר designa uma borda, aro ou acabamento ornamental em torno do móvel sagrado; “moldura” comunica a forma física sem sugerir indevidamente uma coroa régia.
theological_decisions:
- issue: Terminologia do mobiliário cultual
  choice: Manter “chifres” e traduzir זֵר como “moldura”.
  alternative: Traduzir זֵר como “coroa”, “aro” ou “borda”.
  rationale: “Chifres” preserva a terminologia cultual concreta. O versículo descreve a construção do altar, não afirma simbolismo régio; por isso, “moldura” é clara e neutra, enquanto a alternativa tradicional permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com futuro prescritivo adequado às instruções de construção. A formulação mantém a repetição de “ao redor” e os termos concretos do hebraico.
