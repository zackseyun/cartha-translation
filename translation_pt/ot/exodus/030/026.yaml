base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: pt
  text: Com ele, você ungirá a tenda do encontro e a arca do testemunho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, segundo a designação mais tradicional, “a arca da aliança”; aqui, o hebraico diz “o testemunho”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: você ungirá
  rationale: O qal perfeito 2ms com conjunção, nesta sequência de instruções, tem valor modal de ordem. “Ungirá” mantém a forma solene e diretiva sem tornar a frase artificial.
- source_word: בּוֹ
  choice: com ele
  rationale: A preposição ב com sufixo masculino singular retoma o óleo da unção no contexto anterior e expressa instrumento.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução consagrada e fiel da construção hebraica, clara no contexto do santuário.
- source_word: אֲרוֹן
  choice: a arca
  rationale: “Arca” é o termo convencional e exato para o cofre sagrado no contexto do tabernáculo.
- source_word: הָעֵדֻת
  choice: do testemunho
  rationale: Traduz diretamente o hebraico עֵדוּת e preserva sua terminologia própria, sem substituí-la por “aliança”.
theological_decisions:
- issue: Tradução de אֲרוֹן הָעֵדֻת
  choice: a arca do testemunho
  alternative: a arca da aliança; a arca do testemunho solene
  rationale: O texto hebraico emprega explicitamente “testemunho”, não “aliança”. A tradução principal conserva essa escolha lexical, enquanto a nota registra a designação tradicional conhecida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A colocação inicial “Com ele” preserva a referência contextual ao óleo, e “você ungirá” comunica de modo natural a instrução dirigida a Moisés.
