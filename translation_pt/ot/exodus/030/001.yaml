  text: וְ/עָשִׂ֥יתָ מִזְבֵּ֖חַ מִקְטַ֣ר קְטֹ֑רֶת עֲצֵ֥י שִׁטִּ֖ים תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/001.yaml
  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: pt
  text: Faça um altar para queimar incenso[a]; faça-o de madeira de acácia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais compacta, «um altar de incenso». O hebraico diz mais literalmente «um altar para queimar incenso».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal na segunda pessoa masculina singular, com conjunção em uma sequência de instruções, tem força diretiva. O imperativo é natural em português e preserva o caráter de ordem.
- source_word: מִזְבֵּחַ
  choice: um altar
  rationale: Tradução corrente do substantivo que designa um altar; o artigo indefinido convém à primeira apresentação desse objeto.
- source_word: מִקְטַר קְטֹרֶת
  choice: para queimar incenso
  rationale: A expressão construta indica a função do altar, ligada à queima de incenso. A formulação é clara e mantém mais visível a estrutura hebraica do que o título compacto «altar de incenso».
- source_word: עֲצֵי שִׁטִּים
  choice: madeira de acácia
  rationale: A expressão hebraica é um modo idiomático de designar madeira proveniente de acácias; esta é a formulação portuguesa corrente.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: faça-o
  rationale: O imperfeito na segunda pessoa continua a instrução e retoma enfaticamente o objeto antes da indicação do material. A repetição do verbo reflete essa retomada.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com imperativos diretos próprios de instruções. «Faça-o» conserva a retomada enfática do hebraico; «madeira de acácia» favorece leitura natural tanto no Brasil quanto internacionalmente.
