base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: pt
  text: Quem preparar uma mistura igual a essa ou aplicar um pouco dela em uma pessoa não autorizada[a] será eliminado do meio do seu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em um estranho”, “em alguém de fora” ou “em um leigo”. Neste contexto, o hebraico zar geralmente indica alguém não autorizado a receber aquilo que é sagrado.
    reason: lexical_alternative
  - marker: b
    text: “Será eliminado do meio do seu povo” é uma fórmula jurídica da aliança; aqui o texto não especifica como essa pena seria aplicada.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Quem
  rationale: A expressão hebraica introduz genericamente qualquer pessoa sujeita à proibição; “Quem” conserva a força jurídica com naturalidade em português.
- source_word: יִרְקַח
  choice: preparar uma mistura
  rationale: O verbo רקח descreve compor ou misturar uma substância aromática; esta formulação é clara e adequada ao contexto técnico do óleo sagrado.
- source_word: כָּמֹהוּ
  choice: igual a essa
  rationale: Retoma o óleo de unção descrito no contexto e proíbe uma preparação semelhante, sem acrescentar uma especificação ausente no hebraico.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: ou aplicar um pouco dela
  rationale: Neste contexto, נתן seguido de מן indica pôr ou aplicar parte do óleo; “aplicar” explicita naturalmente a ação pretendida.
- source_word: עַל זָר
  choice: em uma pessoa não autorizada
  rationale: Em contexto sacerdotal, זָר designa alguém sem autorização para receber ou usar o elemento sagrado, não necessariamente um estrangeiro étnico.
- source_word: וְנִכְרַת
  choice: será eliminado
  rationale: A forma passiva expressa a fórmula jurídica de ser cortado ou removido; “eliminado” mantém a severidade sem definir o mecanismo da pena.
- source_word: מֵעַמָּיו
  choice: do meio do seu povo
  rationale: Tradução natural da remoção da comunidade de pertença, preservando a referência coletiva e pactual.
theological_decisions:
- issue: Sentido de זָר em uma lei sacerdotal
  choice: pessoa não autorizada
  alternative: estranho; pessoa de fora; leigo
  rationale: A proibição delimita quem pode receber o óleo santo. A tradução evita interpretar o termo como referência meramente étnica, enquanto a nota registra alternativas mais literais.
- issue: Natureza da pena em וְנִכְרַת מֵעַמָּיו
  choice: será eliminado do meio do seu povo
  alternative: será excluído do seu povo; será morto
  rationale: A fórmula jurídica é preservada sem decidir se a pena significa morte, ação divina ou exclusão comunitária, pois o versículo não especifica seu modo de execução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o caráter jurídico e cultual do versículo, esclarecendo זָר no texto e preservando em nota suas alternativas lexicais. A pena permanece deliberadamente não especificada.
