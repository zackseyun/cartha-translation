  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: pt
  text: Quando entrarem na tenda do encontro, deverão lavar-se com água, para que não morram[a]; ou quando se aproximarem do altar para ministrar e queimar uma oferta feita pelo fogo para Yahweh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não morrerão”; ou: “para não morrerem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma oferta de alimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Quando entrarem
  rationale: A preposição בְּ com o infinitivo construto e sufixo pronominal tem valor temporal. “Quando entrarem” comunica naturalmente o ingresso na tenda.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Designação do santuário onde ocorre o encontro entre Deus e Israel; a formulação é clara e preserva os dois elementos do hebraico.
- source_word: יִרְחֲצוּ מַיִם
  choice: deverão lavar-se com água
  rationale: רחץ com מַיִם descreve a lavagem ritual. O reflexivo explícito é natural em português, e “deverão” expressa a força normativa do imperfeito neste contexto legal.
- source_word: וְלֹא יָמֻתוּ
  choice: para que não morram
  rationale: Embora a construção seja formalmente coordenada, no contexto indica a finalidade ou consequência da lavagem. A redação mantém a sanção de morte sem determinar de modo absoluto a relação sintática.
- source_word: אוֹ
  choice: ou
  rationale: Conjunção disjuntiva simples que introduz a segunda situação em que a lavagem é exigida.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: quando se aproximarem do altar
  rationale: נגשׁ indica aproximar-se ou chegar perto, especialmente em contexto cultual.
- source_word: לְשָׁרֵת
  choice: para ministrar
  rationale: No contexto sacerdotal, “ministrar” comunica serviço sagrado formal melhor do que o termo mais genérico “servir”.
- source_word: לְהַקְטִיר
  choice: queimando
  rationale: O hifil de קטר descreve fazer a oferta subir em fumaça sobre o altar. “Queimando” é conciso e natural, e o gerúndio explicita a atividade ministerial mencionada.
- source_word: אִשֶּׁה
  choice: uma oferta de alimento
  rationale: O termo cultual designa uma oferta consumida pelo fogo e pode ser entendido funcionalmente como alimento oferecido à divindade. A nota preserva a alternativa mais formal sem confundir esta oferta com a categoria específica do holocausto.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: O texto traz diretamente o nome divino יהוה; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A forma “Yahweh” representa o nome próprio no texto hebraico e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Relação sintática e sanção em וְלֹא יָמֻתוּ
  choice: para que não morram
  alternative: e não morrerão; para não morrerem
  rationale: A tradução principal expressa de modo natural a finalidade ou consequência contextual da lavagem e conserva integralmente a gravidade da sanção; a nota registra a coordenação mais formal e outra formulação possível.
- issue: Sentido cultual de אִשֶּׁה
  choice: oferta de alimento
  alternative: oferta feita pelo fogo
  rationale: A escolha principal comunica a função sacrificial do termo, enquanto a nota preserva a leitura ligada mais diretamente ao fogo. Nenhuma das opções é identificada indevidamente com o holocausto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém terminologia cultual reconhecível sem arcaísmo excessivo. A vírgula final sinaliza que a frase continua no versículo seguinte.
