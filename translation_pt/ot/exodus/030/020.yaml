review_pass:
  verdict: revise
  source_fidelity: A estrutura temporal, a exigência de lavagem, a sanção de morte, a alternativa introduzida por «ou» e a vírgula final, que indica continuação no versículo seguinte, são bem preservadas. Contudo, אִשֶּׁה designa tecnicamente uma oferta feita/consumida pelo fogo; «oferta de alimento» é uma interpretação funcional possível, mas não é a designação mais diretamente fiel aqui.
  naturalness: O texto é claro, moderno e adequado ao registro cultual. «Para ministrar e queimar» reproduz de modo mais direto e fluente os dois infinitivos coordenados do hebraico do que «para ministrar, queimando».
  terminology: «Tenda do encontro», «altar», «ministrar» e «Yahweh» são escolhas consistentes e compreensíveis. «Oferta feita pelo fogo» conserva o termo sacrificial sem identificar indevidamente a oferta com uma categoria sacrificial específica.
  issues:
  - severity: medium
    issue: «uma oferta de alimento» para אִשֶּׁה
    rationale: Embora «food offering» ocorra no trilho inglês e possa refletir uma explicação funcional, o hebraico emprega o termo técnico para uma oferta feita pelo fogo. A versão principal deve conservar esse elemento; «oferta de alimento» pode permanecer como alternativa explicativa em nota.
  - severity: low
    issue: Gerúndio «queimando» para לְשָׁרֵת לְהַקְטִיר
    rationale: Os dois infinitivos com לְ exprimem finalidades coordenadas. «Para ministrar e queimar» espelha mais claramente essa coordenação e evita sugerir que a queima seja apenas uma ação circunstancial.
