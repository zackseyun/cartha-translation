revisions:
- from: Quando entrarem na tenda do encontro, deverão lavar-se com água, para que não morram[a]; ou quando se aproximarem do altar para ministrar, queimando uma oferta de alimento para Yahweh[b],
  to: Quando entrarem na tenda do encontro, deverão lavar-se com água, para que não morram[a]; ou quando se aproximarem do altar para ministrar e queimar uma oferta feita pelo fogo para Yahweh[b],
  rationale: A revisão restitui na tradução principal a referência explícita ao fogo em אִשֶּׁה e coordena diretamente «ministrar» e «queimar», sem alterar a sanção, o nome divino nem o caráter incompleto da frase no fim do versículo. A alternativa funcional «oferta de alimento» é preservada em nota.
