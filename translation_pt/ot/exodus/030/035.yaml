base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: pt
  text: Faça disso um incenso[a], uma mistura aromática preparada segundo a arte de um perfumista, misturada com sal[b], pura e santa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma composição perfumada” ou “uma mistura aromática”. O hebraico enfatiza uma preparação aromática cuidadosamente combinada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “salgada” ou “temperada com sal”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sagrada”. O hebraico diz simplesmente “santa”, não “santíssima”, neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: Faça dela
  rationale: A forma verbal com וְ, em contexto de instrução, comunica uma ordem; “Faça dela” retoma naturalmente, em português, os ingredientes mencionados no versículo anterior.
- source_word: קְטֹרֶת רֹקַח
  choice: um incenso, uma mistura aromática
  rationale: קְטֹרֶת designa o incenso destinado à queima ritual, e רֹקַח destaca que se trata de uma preparação aromática cuidadosamente composta.
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: preparada por um perfumista
  rationale: A expressão significa literalmente “obra de perfumista/misturador”; a formulação escolhida preserva a ideia de preparação especializada em português natural.
- source_word: מְמֻלָּח
  choice: salgada
  rationale: O particípio passivo deriva da raiz associada a sal e, em seu sentido mais direto, descreve a mistura como tratada ou misturada com sal.
- source_word: טָהוֹר
  choice: pura
  rationale: “Pura” comunica adequadamente tanto a qualidade material quanto a pertinência cultual do termo neste contexto.
- source_word: קֹדֶשׁ
  choice: santa
  rationale: O hebraico diz simplesmente “santo/santa”, indicando algo separado para uso sagrado, sem empregar aqui uma construção superlativa.
theological_decisions:
- issue: Status cultual do incenso
  choice: santa
  alternative: santíssima
  rationale: O versículo emprega קֹדֶשׁ, “santo”, sem a construção que significaria “santíssimo”. A tradução evita intensificar a categoria cultual além do que esta frase declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sequência de adjetivos no feminino concorda com “mistura aromática”, sem alterar o referente do texto hebraico.
