id: EXO.30.12
reference: Exodus 30:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: pt
  text: Quando você fizer o recenseamento[a] dos filhos de Israel, segundo o número dos registrados, cada homem dará a Yahweh um resgate por sua vida[b], quando você os contar, para que não haja praga entre eles quando você os contar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levantar a cabeça dos filhos de Israel”, expressão idiomática que significa fazer um recenseamento.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um resgate por si mesmo”. Aqui, o hebraico néfesh significa “vida” ou “pessoa”, não apenas “alma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: A conjunção introduz a circunstância temporal ou condicional prevista pela instrução; “quando” se ajusta à ocasião esperada do recenseamento.
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: fizer o recenseamento
  rationale: A expressão significa literalmente “levantar a cabeça”, mas funciona aqui como uma expressão idiomática para contar ou recensear uma população.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar masculina do hebraico, de modo natural e tradicional em português.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo o número dos registrados
  rationale: Preserva a ideia administrativa de pessoas contadas e inscritas no recenseamento.
- source_word: וְנָתְנוּ אִישׁ
  choice: cada homem dará
  rationale: O singular distributivo אִישׁ indica cada homem individualmente dentro do grupo contado.
- source_word: כֹּפֶר
  choice: um resgate
  rationale: Designa um pagamento compensatório que livra a pessoa da consequência ameaçada; “resgate” comunica esse sentido sem acrescentar uma teoria expiatória.
- source_word: נַפְשׁוֹ
  choice: por sua vida
  rationale: Neste contexto, נֶפֶשׁ se refere à vida ou à própria pessoa, não necessariamente a uma alma imaterial.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Traduz diretamente o nome divino יהוה e expressa naturalmente o destinatário do pagamento.
- source_word: בִּפְקֹד אֹתָם
  choice: quando você os contar
  rationale: O infinitivo com preposição indica a ocasião do pagamento e mantém a repetição deliberada da linguagem do recenseamento.
- source_word: נֶגֶף
  choice: praga
  rationale: No contexto de juízo divino, o termo denota um golpe ou calamidade mortal, adequadamente expresso por “praga”.
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: para que não haja praga entre eles
  rationale: A formulação torna clara a relação de finalidade ou resultado entre o pagamento do resgate e a ausência da praga.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de נַפְשׁוֹ na fórmula do resgate
  choice: por sua vida
  alternative: por si mesmo; por sua alma
  rationale: O contexto trata da vida ou pessoa do homem recenseado; “alma” poderia introduzir uma distinção antropológica que o versículo não explicita.
- issue: Expressões masculinas בְּנֵי יִשְׂרָאֵל e אִישׁ
  choice: filhos de Israel ... cada homem
  alternative: israelitas ... cada pessoa
  rationale: A tradução conserva as formas masculinas e a expressão familiar do hebraico, sem apagar seu caráter distributivo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “quando você os contar” foi mantida por refletir a repetição enfática do hebraico. O tratamento “você” comunica naturalmente o singular dirigido a Moisés.
