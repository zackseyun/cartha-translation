lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar, e דִּבֵּר é representado por “falou”, forma corrente e adequada à fórmula de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; “a Moisés” é a construção portuguesa natural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o conteúdo da fala, apresentado no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva essa distinção e representa de modo amplamente reconhecido a provável vocalização do Tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula introdutória “falou... dizendo” mantida para refletir a estrutura hebraica e preparar a fala do versículo seguinte.
