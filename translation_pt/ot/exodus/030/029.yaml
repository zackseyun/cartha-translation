  source_fidelity: 'A tradução transmite adequadamente a sequência central: consagração dos objetos, seu caráter santíssimo e a santidade resultante do contato. Contudo, “essas coisas” introduz um demonstrativo que não está no hebraico e torna menos direto o pronome objeto de אֹתָם. “Tudo o que tocar” preserva de modo aceitável a amplitude genérica de כָּל הַנֹּגֵעַ, inclusive sem restringi-la indevidamente a pessoas.'
  naturalness: O texto é claro e fluente. A forma “Consagrarás” oferece registro bíblico instrutivo amplamente reconhecível no português internacional, sem o marcador regional mais forte de “Você consagrará”. “Santíssimos” é natural e apropriado para o superlativo cultual.
  terminology: “Consagrar” traduz bem o piel de קדשׁ; “santíssimos” traduz adequadamente קֹדֶשׁ קָדָשִׁים; e “se tornará santo” mantém a mudança de estado expressa por יִקְדָּשׁ, sem resolver suas implicações rituais. A nota preserva alternativas sem impor interpretação teológica.
