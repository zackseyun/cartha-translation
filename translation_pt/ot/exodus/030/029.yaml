base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: pt
  text: Consagrarás os objetos, e eles serão santíssimos. Tudo o que tocar neles se tornará santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será santo” ou “será consagrado”. O hebraico pode indicar que algo se torna santo pelo contato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Você consagrará
  rationale: No piel, קדשׁ indica tornar ou separar algo como santo. “Consagrará” é natural no contexto ritual e mantém o caráter instrutivo da forma verbal.
- source_word: אֹתָם
  choice: essas coisas
  rationale: O pronome retoma os objetos e utensílios mencionados no contexto. Em português, “essas coisas” evita sugerir pessoas e esclarece o referente inanimado.
- source_word: וְהָיוּ קֹדֶשׁ קָדָשִׁים
  choice: e elas serão santíssimas
  rationale: A construção קֹדֶשׁ קָדָשִׁים exprime o grau máximo de santidade. “Santíssimas” é idiomático, conciso e concorda com “essas coisas”.
- source_word: כָּל הַנֹּגֵעַ
  choice: Tudo o que tocar
  rationale: A expressão é genérica e pode abranger qualquer entidade que entre em contato com os objetos; “tudo o que” preserva essa amplitude.
- source_word: בָּהֶם
  choice: nelas
  rationale: O pronome remete às coisas consagradas anteriormente mencionadas.
- source_word: יִקְדָּשׁ
  choice: se tornará santo
  rationale: O qal imperfeito pode ter sentido incoativo ou resultativo. “Se tornará santo” explicita a mudança de estado ligada ao contato sem definir suas consequências rituais.
theological_decisions:
- issue: Sentido da santidade decorrente do contato
  choice: O contato faz com que aquilo que toca os objetos se torne santo, sem esclarecer se essa santidade é benéfica, perigosa ou acompanhada de restrições.
  alternative: Entender o contato apenas como consagração positiva, ou como entrada numa esfera sagrada sujeita a perigo e restrições.
  rationale: O hebraico afirma somente que aquilo que toca “se tornará santo”. A tradução preserva a tensão teológica e não acrescenta uma explicação ritual ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Santíssimas” traduz naturalmente o superlativo hebraico; a nota preserva as alternativas legítimas de יִקְדָּשׁ.
