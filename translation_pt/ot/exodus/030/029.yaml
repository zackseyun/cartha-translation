  - severity: low
    issue: “Você consagrará” tem marca mais especificamente brasileira do que o registro internacional pretendido.
    rationale: “Consagrarás” mantém o valor instrutivo/futuro da forma hebraica e é um registro bíblico compreensível também para leitores brasileiros.
