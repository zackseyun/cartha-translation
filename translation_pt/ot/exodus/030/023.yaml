base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: pt
  text: 'Quanto a você, tome para si as melhores especiarias: quinhentos siclos de mirra fluida[a]; metade dessa quantidade — duzentos e cinquenta siclos — de canela aromática; e duzentos e cinquenta siclos de cana aromática[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mirra pura”. A expressão hebraica provavelmente se refere à mirra que flui livremente em seu estado natural.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “canela doce” e “cálamo aromático”. O hebraico designa, de modo mais amplo, canela e cana fragrantes ou aromáticas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: A construção destaca o destinatário e marca a continuação do discurso. “Quanto a você” preserva essa ênfase de modo natural em português.
- source_word: בְּשָׂמִים רֹאשׁ
  choice: as melhores especiarias
  rationale: בְּשָׂמִים designa substâncias aromáticas, e רֹאשׁ, literalmente “cabeça”, tem aqui o sentido idiomático de principais ou melhores.
- source_word: מָר דְּרוֹר
  choice: mirra fluida
  rationale: מָר é “mirra”, enquanto דְּרוֹר provavelmente descreve a mirra que flui livremente em seu estado natural. “Fluida” conserva essa imagem sem adotar de forma definitiva a interpretação tradicional “pura”.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: quinhentos siclos
  rationale: O hebraico registra apenas o número neste ponto, mas a unidade é indicada pelo contexto da receita e explicitada no versículo seguinte. Acrescentar “siclos” evita que a quantidade fique indefinida.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: canela aromática
  rationale: קִנְּמָן significa “canela”, e בֶּשֶׂם ressalta sua fragrância. “Aromática” evita que “doce” seja entendido como referência ao sabor.
- source_word: מַחֲצִיתוֹ
  choice: da metade dessa quantidade
  rationale: O sufixo retoma a quantidade anterior, quinhentos. A formulação deixa clara a relação matemática preservada pelo hebraico.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: duzentos e cinquenta siclos
  rationale: O valor explicita a metade dos quinhentos mencionados anteriormente. A unidade é novamente suprida com base no contexto para maior clareza.
- source_word: קְנֵה בֹשֶׂם
  choice: cana aromática
  rationale: קָנֶה é “cana” ou “caniço”, e בֹשֶׂם indica uma planta fragrante. “Cana aromática” é transparente e evita identificar com certeza a espécie como cálamo.
