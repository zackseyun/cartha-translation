base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: pt
  text: 'Isto é o que todo aquele que passar entre os recenseados dará: meio siclo, segundo o siclo do santuário (o siclo equivale a vinte geras), meio siclo como contribuição para Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo aquele que passar para os recenseados”. A expressão hebraica é um idiomatismo de recenseamento e se refere aos que entram na contagem oficial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Isto é o que dará
  rationale: A fórmula demonstrativa introduz a quantia prescrita; o futuro em português transmite com naturalidade a força normativa do imperfeito hebraico.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: todo aquele que passar para o grupo dos recenseados
  rationale: Mantém a imagem verbal de 'passar' e explicita o contexto censitário de הַפְּקֻדִים sem reduzir a expressão simplesmente a 'todo recenseado'.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: meio siclo
  rationale: Forma tradicional, concisa e compreensível para a unidade de peso ou valor.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A preposição בְּ indica aqui o padrão de medida; 'do santuário' preserva o caráter técnico da expressão.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: o siclo equivale a vinte geras
  rationale: Expressa claramente a definição metrológica dada pela oração hebraica.
- source_word: תְּרוּמָה לַיהוָה
  choice: como contribuição para Yahweh
  rationale: תְּרוּמָה designa algo separado e entregue; 'contribuição' se ajusta ao pagamento exigido neste contexto, sem apagar sua destinação cultual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; 'Yahweh' preserva essa função e evita substituí-lo por um título.
- issue: Sentido cultual de תְּרוּמָה
  choice: contribuição para Yahweh
  alternative: oferta a Yahweh
  rationale: Neste contexto censitário, a palavra se refere concretamente à quantia entregue e destinada a Yahweh. 'Contribuição' preserva esse aspecto, embora 'oferta' também seja possível.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com legibilidade brasileira. Mantêm-se os termos técnicos antigos “siclo” e “gera”, explicados pela própria equivalência fornecida no versículo. O travessão apresenta a explicação metrológica sem tratá-la como nota externa.
