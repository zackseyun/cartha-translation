  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: pt
  text: Você ungirá Arão e seus filhos e os consagrará para que me sirvam como sacerdotes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: Você ungirá
  rationale: O verbo משׁח designa aqui a aplicação ritual do óleo sagrado para a investidura. “Ungir” preserva com precisão esse sentido ritual e teológico; o yiqtol tem força instrutiva neste contexto.
- source_word: וְקִדַּשְׁתָּ
  choice: e os consagrará
  rationale: O Piel de קדשׁ significa separar ou tornar santo para uma função sagrada. “Consagrar” é natural em português no contexto da investidura sacerdotal e mantém a força cultual.
- source_word: לְכַהֵן
  choice: para que ... sirvam como sacerdotes
  rationale: A forma verbal de כהן significa exercer a função sacerdotal. A expressão escolhida comunica tanto a função quanto o serviço de modo claro e corrente.
- source_word: לִי
  choice: me sirvam
  rationale: A preposição ל com o sufixo de primeira pessoa indica que o serviço sacerdotal é dirigido a Deus. Integrar o pronome ao verbo produz português natural sem perder essa relação.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica os filhos homens de Arão no contexto da linhagem sacerdotal; por isso, não se emprega uma formulação neutra.
- source_word: וְאֶת ... וְאֶת
  choice: Arão e seus filhos
  rationale: A repetição do marcador de objeto direto assinala os dois objetos coordenados. Em português, a coordenação simples os representa naturalmente.
theological_decisions:
- issue: Terminologia cultual de קדשׁ e כהן
  choice: “consagrará” e “sirvam como sacerdotes”
  alternative: “santificará” e “exerçam o sacerdócio”
  rationale: A formulação mantém o cenário de investidura sacerdotal, sem transferir ao texto categorias eclesiásticas posteriores, e permanece clara para leitores modernos.
- issue: Especificidade de gênero em בָּנָיו
  choice: “seus filhos”
  alternative: “seus descendentes” ou “seus filhos e filhas”
  rationale: O substantivo é masculino e, neste contexto, refere-se especificamente aos filhos de Arão destinados ao sacerdócio; neutralizá-lo alteraria a referência do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção no futuro preserva o tom instrutivo do contexto legal, e a oração final evita uma formulação artificial como “sacerdotarem para mim”.
