  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: pt
  text: 'E Moisés disse: “Como você disse[a], não verei mais o seu rosto[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim como você disse” ou “Que seja como você disse”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico, literalmente: “não acrescentarei novamente ver o seu rosto”, uma expressão que significa “não verei mais o seu rosto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “E ... disse” preserva esse fluxo sem explicitar uma relação temporal ou lógica além do hebraico.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Seja como você disse
  rationale: Expressa naturalmente a concordância de Moisés com a declaração anterior do faraó, preservando a possibilidade de assentimento enfático contida na construção hebraica.
- source_word: לֹא אֹסִף עוֹד
  choice: Nunca mais
  rationale: 'A combinação da negação com o hifil de יסף e עוֹד é idiomática: Moisés afirma que a ação não se repetirá.'
- source_word: רְאוֹת
  choice: verei
  rationale: O infinitivo de ראה completa a construção com יסף; em português, o futuro finito transmite de modo natural a ação que não voltará a ocorrer.
- source_word: פָּנֶיךָ
  choice: o seu rosto
  rationale: Mantém a imagem concreta do hebraico. Embora “sua presença” seja possível como sentido contextual, “seu rosto” preserva a expressão original e funciona naturalmente na cena.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. “Você” corresponde ao masculino singular dirigido ao faraó. A ordem das notas foi ajustada para que cada marcador acompanhe a expressão que explica.
