base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: pt
  text: 'Então o faraó lhe disse: “Saia da minha presença! Cuidado! Não volte a ver o meu rosto, pois, no dia em que vir o meu rosto, você morrerá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: Então o faraó lhe disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: לֵךְ מֵעָלַי
  choice: Saia da minha presença
  rationale: A ordem exige que Moisés se afaste do faraó. “Saia da minha presença” é natural, digna e mantém a referência relacional implícita na expressão hebraica.
- source_word: הִשָּׁמֶר לְךָ
  choice: Cuidado!
  rationale: O imperativo nifal com dativo reflexivo transmite uma advertência ameaçadora. “Cuidado!” reproduz sua força em português corrente.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: Não volte a ver o meu rosto
  rationale: A construção com יסף e infinitivo significa não tornar a fazer algo. A formulação portuguesa comunica o sentido idiomático sem perder a imagem do rosto.
- source_word: פָּנַי
  choice: o meu rosto
  rationale: Embora “rosto” possa representar “presença”, sua repetição no hebraico tem valor retórico e por isso é preservada nas duas ocorrências pertinentes.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: no dia em que vir o meu rosto
  rationale: Mantém a expressão temporal solene “no dia” e verte naturalmente o infinitivo construto com sufixo como oração finita.
- source_word: תָּמוּת
  choice: você morrerá
  rationale: Expressa com clareza a ameaça futura em português moderno, sem recorrer a uma formulação arcaizante.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso mantém o tom imperioso e ameaçador do faraó, com tratamento por “você”, corrente e claro. A repetição de “meu rosto” conserva a ênfase do hebraico.
