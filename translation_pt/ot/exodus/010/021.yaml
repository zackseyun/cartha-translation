  source_fidelity: 'O texto reproduz com fidelidade a sequência e a força geral do hebraico: o imperativo dirigido a Moisés, o gesto em direção ao céu, a escuridão sobre a terra do Egito e a cláusula final difícil. “Para que haja” comunica adequadamente o valor volitivo/resultativo de וִיהִי. “Possa ser sentida” mantém, sem resolver indevidamente, a noção de uma escuridão sensorialmente palpável em וְיָמֵשׁ חֹשֶׁךְ.'
