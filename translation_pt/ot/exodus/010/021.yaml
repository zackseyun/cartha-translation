  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֤ה יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ֥/יהִי חֹ֖שֶׁךְ עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יָמֵ֖שׁ חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Estenda a mão em direção ao céu, para que haja escuridão sobre a terra do Egito, e que a escuridão possa ser sentida.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como “e alguém possa apalpar a escuridão”. O verbo é raro e apresenta dificuldade de interpretação, mas ressalta que a escuridão seria palpável.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, preservando sua identificação pessoal e pactual.
- source_word: נְטֵה יָדְךָ
  choice: Estenda a mão
  rationale: Reproduz naturalmente em português o imperativo dirigido a Moisés, sem perder a imagem concreta do gesto.
- source_word: עַל הַשָּׁמַיִם
  choice: em direção ao céu
  rationale: Neste contexto gestual, a preposição indica direção; o plural hebraico é expresso pelo singular idiomático português “céu”.
- source_word: וִיהִי חֹשֶׁךְ
  choice: para que haja escuridão
  rationale: Expressa de modo natural a força volitiva ou resultativa da construção hebraica.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sobre a terra do Egito
  rationale: Mantém explicitamente אֶרֶץ, delimitando geograficamente a praga.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: e que a escuridão possa ser sentida
  rationale: Conserva a oração final e a noção tradicional de escuridão palpável, sem ocultar a dificuldade do verbo raro.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz diretamente o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o hebraico, mas evita construções artificiais; a ambiguidade do verbo final é preservada em nota.
