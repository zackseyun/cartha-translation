base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: pt
  text: Os gafanhotos subiram sobre toda a terra do Egito e pousaram em todo o território do Egito. Eram extremamente numerosos[a]. Nunca antes houve gafanhotos assim, nem haverá depois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “muito pesados”. A expressão descreve a quantidade ou a intensidade extraordinária da invasão de gafanhotos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiram
  rationale: Preserva a imagem espacial de עלה e soa natural para a chegada e o avanço dos gafanhotos.
- source_word: הָאַרְבֶּה
  choice: os gafanhotos
  rationale: O substantivo hebraico singular tem sentido coletivo; o plural é a forma natural de expressá-lo em português.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: sobre toda a terra do Egito
  rationale: Tradução direta que mantém a extensão total da invasão.
- source_word: וַיָּנַח
  choice: pousaram
  rationale: נוח indica que vieram a repousar; “pousaram” descreve com precisão e naturalidade o movimento dos insetos.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: em todo o território do Egito
  rationale: Aqui גְּבוּל designa a área dentro das fronteiras, não apenas a linha fronteiriça; a formulação mantém o singular coletivo do hebraico.
- source_word: כָּבֵד מְאֹד
  choice: extremamente numerosos
  rationale: Literalmente “muito pesados”; aplicado coletivamente aos gafanhotos, o idioma comunica sua enorme concentração ou quantidade. A nota preserva a imagem lexical hebraica.
- source_word: לְפָנָיו לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: Nunca antes houve tantos gafanhotos como aqueles
  rationale: Expressa em português natural a comparação superlativa e entende os sufixos singulares como referência ao coletivo.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵן
  choice: nem depois haverá tantos assim
  rationale: Mantém a comparação futura, completando a afirmação de que a invasão não teve nem terá equivalente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pousaram” é idiomático para insetos; “terra” e “território” preservam a distinção entre אֶרֶץ e גְּבוּל. A repetição de “gafanhotos” e “tantos” esclarece em português o referente coletivo dos pronomes hebraicos sem introduzir o substantivo “enxame”, ausente do texto-fonte.
