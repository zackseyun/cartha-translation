review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz bem a progressão da invasão: os gafanhotos sobem sobre o Egito e pousam por todo o seu território. «Extremamente numerosos» é uma interpretação contextual plausível de כָּבֵד מְאֹד, adequadamente esclarecida pela nota. Contudo, «tantos gafanhotos» reduz a comparação hebraica («gafanhotos como ele/assim») exclusivamente à quantidade, enquanto o enunciado pode abranger a excepcionalidade da praga em sentido mais amplo.'
  naturalness: O português é claro, moderno e de registro apropriado. «Pousaram» é particularmente natural para gafanhotos. «Gafanhotos assim» preserva melhor a formulação comparativa e soa idiomático neste contexto.
  terminology: «Gafanhotos», «terra do Egito» e «território do Egito» são escolhas adequadas. A nota lexical mantém de modo útil o sentido literal de «muito pesados» sem forçar uma expressão pouco natural em português.
  issues:
  - severity: medium
    issue: A expressão «Nunca antes houve tantos gafanhotos como aqueles, nem depois haverá tantos assim» especifica quantidade onde o hebraico afirma que não houve nem haverá gafanhotos/praga «assim», isto é, sem equivalente.
    rationale: Embora o grande número esteja bem implicado por כָּבֵד, a construção comparativa hebraica não limita explicitamente a afirmação posterior a uma contagem. «Gafanhotos assim» conserva a amplitude da comparação.
