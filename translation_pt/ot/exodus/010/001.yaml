  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Vá à presença do faraó, pois eu endureci[a] o coração dele e o coração dos seus servos, para pôr estes meus sinais no meio deles[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “tornei pesado”. Quando aplicado ao coração, o idioma indica que Yahweh o endureceu ou o tornou insensível.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “no meio dele”. A expressão pode se referir especificamente ao faraó ou, de modo mais amplo, ao faraó junto com seus servos e sua corte.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Vá à presença do faraó
  rationale: בוא pode indicar ir ou entrar. No contexto de audiência e confronto, esta formulação conserva a ideia de comparecer diante do faraó sem produzir a estranheza de “venha ao faraó”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior e mantém um tom narrativo claro e digno.
- source_word: הִכְבַּדְתִּי
  choice: endureci
  rationale: O hifil de כבד significa literalmente “tornei pesado”, mas, aplicado ao coração, descreve torná-lo insensível ou obstinado. “Endureci” é o equivalente idiomático mais claro; o sentido literal fica registrado em nota.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: o coração dele e o coração dos seus servos
  rationale: “Coração” preserva a imagem hebraica do centro da vontade e do entendimento. A repetição evita uma coordenação ambígua em português.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Mantém a amplitude de עבד, que neste contexto pode designar servos, cortesãos ou oficiais do faraó, sem restringir indevidamente o referente.
- source_word: לְמַעַן
  choice: para
  rationale: Expressa de forma natural a finalidade indicada pela construção hebraica.
- source_word: שִׁתִי
  choice: pôr
  rationale: Equivale diretamente ao infinitivo de שׂים (“pôr, colocar, estabelecer”) e soa natural em português com “sinais”.
- source_word: אֹתֹתַי אֵלֶּה
  choice: estes meus sinais
  rationale: Conserva tanto o demonstrativo quanto o sufixo possessivo do hebraico, numa formulação corrente e enfática em português.
- source_word: בְּקִרְבּוֹ
  choice: no meio deles
  rationale: O hebraico tem forma singular, literalmente “no meio dele”, mas o contexto imediato abrange o faraó e seus servos. A tradução contextual é mantida no texto, e a ambiguidade gramatical é explicitada em nota.
theological_decisions:
- issue: O endurecimento divino do coração do faraó
  choice: eu endureci o coração dele
  alternative: eu tornei pesado o coração dele / eu tornei obstinado o coração dele
  rationale: A tradução mantém a atribuição direta da ação a Yahweh, exatamente como no hebraico, sem atenuá-la nem tentar resolver a tensão entre a ação divina e a responsabilidade humana.
- issue: O âmbito dos sinais em בְּקִרְבּוֹ
  choice: no meio deles
  alternative: no meio dele
  rationale: O singular hebraico pode apontar especificamente para o faraó ou, de modo representativo, para o seu círculo e domínio. O texto principal segue o sentido contextual coletivo, enquanto a nota preserva a forma singular e a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “faraó” com artigo, conforme o uso natural em português, e mantém “Yahweh” como nome próprio. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
