id: EXO.10.7
reference: Exodus 10:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: pt
  text: 'Então os servos[a] de Faraó lhe disseram: “Até quando este homem[b] será uma armadilha[c] para nós? Mande os homens[d] embora, para que sirvam[e] a Yahweh[f], o Deus deles. Você ainda não sabe que o Egito está arruinado?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oficiais”; trata-se dos servos da corte de Faraó.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “este”; o demonstrativo refere-se a Moisés.
    reason: lexical_alternative
  - marker: c
    text: Ou “um laço”.
    reason: lexical_alternative
  - marker: d
    text: Hebraico “os homens”; algumas traduções ampliam para “o povo”.
    reason: lexical_alternative
  - marker: e
    text: Ou “prestem culto”; o verbo hebraico pode expressar tanto serviço quanto culto quando se refere a Deus.
    reason: lexical_alternative
  - marker: f
    text: “Yahweh” translitera o nome divino YHWH, tradicionalmente representado por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: É a correspondência lexical direta; no contexto, refere-se aos servos da corte de Faraó, possivelmente seus oficiais.
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressa naturalmente em português a pergunta temporal e o tom de impaciência do hebraico.
- source_word: זֶה
  choice: este homem
  rationale: O demonstrativo isolado refere-se a Moisés; acrescentar “homem” torna a referência natural em português sem eliminar a alternativa literal.
- source_word: לְמוֹקֵשׁ
  choice: uma armadilha
  rationale: Preserva a metáfora de algo que captura ou causa a queda, em linguagem corrente; “laço” também é possível.
- source_word: שַׁלַּח
  choice: Mande ... embora
  rationale: Reproduz a ordem para que Faraó dispense os homens, sem importar automaticamente a fórmula de outros contextos, “deixe o meu povo ir”.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Mantém o sentido masculino plural específico do substantivo hebraico, em vez de ampliá-lo para “o povo”.
- source_word: וְיַעַבְדוּ
  choice: para que sirvam
  rationale: O verbo עבד pode abranger serviço e culto quando Deus é seu referente; “sirvam” conserva essa amplitude.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Você ainda não sabe
  rationale: Forma idiomática em português para a pergunta de censura expressa pela construção hebraica.
- source_word: אָבְדָה
  choice: está arruinado
  rationale: Comunica o estado resultante da devastação já sofrida pelo Egito, sem sugerir necessariamente aniquilação total.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Alcance de הָאֲנָשִׁים
  choice: os homens
  alternative: o povo
  rationale: O substantivo é especificamente masculino plural. A tradução mantém essa forma, embora o grupo mais amplo em questão no relato seja Israel.
- issue: Amplitude religiosa de עבד
  choice: sirvam
  alternative: prestem culto; adorem
  rationale: “Sirvam” preserva a tensão semântica entre serviço e culto a Deus, sem reduzir o verbo apenas ao ato litúrgico.
translation_notes:
  register: Português moderno, digno e de leitura natural, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. “Você” torna direta a censura dirigida a Faraó; o texto conserva “servos”, “homens” e “sirvam” para manter os principais contornos lexicais do hebraico.
