base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Estenda a mão sobre a terra do Egito para os gafanhotos[a][b], a fim de que subam sobre a terra do Egito e comam toda a vegetação da terra, tudo o que o granizo deixou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente algo como “com respeito ao gafanhoto”. A preposição é difícil; também são possíveis traduções como “contra os gafanhotos” ou “sobre os gafanhotos”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “gafanhoto” e os verbos correspondentes estão no singular, mas o termo é usado coletivamente para o enxame. Em português, o sentido é expresso naturalmente no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: נְטֵה יָדְךָ
  choice: Estenda a mão
  rationale: Reproduz de modo natural o imperativo e a expressão corporal hebraica, adequada ao contexto dos sinais e das pragas.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: sobre a terra do Egito
  rationale: Mantém tanto o sentido espacial da preposição quanto a repetição de אֶרֶץ מִצְרַיִם no versículo.
- source_word: בָּאַרְבֶּה
  choice: para trazer os gafanhotos
  rationale: Expressa naturalmente em português o propósito contextual do gesto, sem ocultar em nota que a preposição hebraica é difícil e admite traduções mais literais.
- source_word: אַרְבֶּה
  choice: os gafanhotos
  rationale: Embora esteja no singular em hebraico, o substantivo é coletivo e designa a multidão de gafanhotos da praga; o plural é natural em português.
- source_word: וְיַעַל ... וְיֹאכַל
  choice: para que subam ... e comam
  rationale: O plural concorda em português com o sentido coletivo de אַרְבֶּה, enquanto preserva os sentidos básicos de ‘subir’ e ‘comer’.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: toda a vegetação da terra
  rationale: עֵשֶׂב pode indicar amplamente a vegetação, não apenas erva ou capim; esta escolha se ajusta à devastação agrícola do contexto.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: tudo o que o granizo deixou
  rationale: Tradução direta e idiomática que liga esta praga ao que restou da praga de granizo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Mantém o nome pessoal presente no texto hebraico sem substituí-lo por um título nem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação preserva a repetição de “terra do Egito” e registra em notas tanto a dificuldade da preposição בְּ quanto o caráter coletivo do singular hebraico.
