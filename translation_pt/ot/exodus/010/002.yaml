reference: Exodus 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: pt
  text: para que você conte aos ouvidos de seu filho e de seu neto como tratei duramente o Egito[a] e fale dos meus sinais, que coloquei no meio deles, e para que vocês saibam que eu sou Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como fiz do Egito objeto de zombaria”. O verbo hebraico pode enfatizar tanto a humilhação do Egito quanto o modo severo como Deus o tratou.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e vocês saberão que eu sou Yahweh”. A oração pode indicar resultado ou consequência futura, além de finalidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: para que
  rationale: Expressa de modo natural a finalidade introduzida pela locução hebraica e mantém a ligação com o contexto anterior.
- source_word: תְּסַפֵּר
  choice: você conte
  rationale: O piel de ספר indica narrar ou relatar às gerações seguintes. A forma singular de segunda pessoa do hebraico é preservada.
- source_word: בְּאָזְנֵי
  choice: aos ouvidos de
  rationale: Conserva a imagem idiomática hebraica sem impedir a compreensão em português atual.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: seu filho e seu neto
  rationale: “Neto” é o equivalente natural de “filho de seu filho” e mantém a sequência entre gerações.
- source_word: הִתְעַלַּלְתִּי
  choice: tratei duramente
  rationale: Comunica a ação severa e humilhante de Yahweh contra o Egito sem reduzi-la a simples zombaria; a nuance alternativa é preservada em nota.
- source_word: בְּמִצְרַיִם
  choice: o Egito
  rationale: Com “tratar duramente”, o objeto direto é idiomático em português e representa o Egito como alvo da ação divina.
- source_word: אֹתֹתַי
  choice: meus sinais
  rationale: É a correspondência direta de אותות e evita acrescentar “milagrosos”, ideia implícita no contexto, mas não expressa pelo substantivo.
- source_word: שַׂמְתִּי בָם
  choice: coloquei no meio deles
  rationale: Mantém o sentido concreto de “pôr/colocar”; “deles” remete naturalmente aos egípcios, e “no meio” traduz de forma legível a preposição ב.
- source_word: וִידַעְתֶּם
  choice: e para que vocês saibam
  rationale: Entende a oração como continuação da finalidade inicial e preserva a mudança do singular para o plural presente no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo pelo título “SENHOR”.
theological_decisions:
- issue: Sentido da ação divina expressa por הִתְעַלַּלְתִּי
  choice: como tratei duramente o Egito
  alternative: como fiz do Egito objeto de zombaria
  rationale: O contexto das pragas envolve juízo severo e humilhação. O texto principal comunica a severidade, enquanto a nota conserva a possível ênfase em escarnecer ou fazer pouco do Egito.
- issue: Valor sintático de וִידַעְתֶּם
  choice: e para que vocês saibam
  alternative: e vocês saberão
  rationale: A leitura de finalidade se harmoniza com לְמַעַן no início do versículo, mas a forma também pode ser entendida como consequência ou resultado futuro.
- issue: Mudança de número na segunda pessoa
  choice: “você conte” no singular e “vocês saibam” no plural
  alternative: uniformizar ambas as formas no plural ou no singular
  rationale: A mudança está no texto hebraico e pode ampliar a conclusão do indivíduo interpelado para a comunidade; por isso, não deve ser apagada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Aos ouvidos de” conserva deliberadamente a imagem hebraica. A alternância entre “você” e “vocês” reproduz a passagem da segunda pessoa singular para a plural no original. A coordenação “e fale dos meus sinais” explicita em português o alcance natural do verbo “contar” sobre o segundo objeto, evitando uma construção truncada.
