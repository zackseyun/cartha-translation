  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: pt
  text: 'Então o faraó chamou Moisés e disse: “Vão e sirvam a Yahweh. Apenas seus rebanhos e seu gado ficarão para trás[a]; até suas crianças irão com vocês[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejam deixados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus pequeninos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: No contexto narrativo, קרא indica chamar alguém; “chamou” é natural e não acrescenta a formalidade de “convocou”.
- source_word: פַרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada para o título real egípcio.
- source_word: אֶל מֹשֶׁה
  choice: Moisés
  rationale: Com קרא, a construção indica que o faraó chamou Moisés; omitir uma preposição explícita produz português idiomático sem alterar o sentido.
- source_word: לְכוּ
  choice: Vão
  rationale: Imperativo plural simples de הלך, dirigido a Moisés e ao povo que ele representa.
- source_word: עִבְדוּ אֶת יְהוָה
  choice: sirvam a Yahweh
  rationale: '“Sirvam” traduz diretamente עבד e preserva o tema de Êxodo: Israel deve servir a Yahweh, não ao faraó; no contexto, esse serviço inclui culto.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: רַק
  choice: Apenas
  rationale: Assinala de modo claro a restrição imposta pelo faraó à permissão concedida.
- source_word: צֹאנְכֶם
  choice: os seus rebanhos de ovelhas e cabras
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; a explicitação evita que “rebanhos” seja entendido de modo excessivamente genérico.
- source_word: וּבְקַרְכֶם
  choice: e o seu gado
  rationale: בקר designa animais de grande porte, especialmente bovinos; “gado” é a forma corrente e clara em português.
- source_word: יֻצָּג
  choice: devem ficar para trás
  rationale: O Hophal de יצג exprime que os animais devem ser deixados no lugar. A formulação comunica naturalmente a condição imposta pelo faraó, mantendo em nota a alternativa passiva mais formal.
- source_word: גַּם
  choice: Até
  rationale: 'Marca a concessão enfática: o faraó permite que também as crianças acompanhem o povo.'
- source_word: טַפְּכֶם
  choice: as suas crianças
  rationale: טַף refere-se aos filhos pequenos ou dependentes do grupo familiar; “crianças” é claro e atual, enquanto a nuance de pouca idade é registrada em nota.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: podem ir com vocês
  rationale: O imperfeito, no discurso permissivo do faraó, comunica concessão. “Podem ir” torna essa força pragmática explícita em português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sentido de עבד em relação a Deus
  choice: sirvam
  alternative: adorem
  rationale: “Sirvam” mantém o equivalente lexical mais direto e a tensão temática entre servir ao faraó e servir a Yahweh; “adorem” expressaria corretamente parte do sentido contextual, mas o restringiria ao culto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e explicita as duas categorias de animais para conservar a distinção hebraica entre צֹאן e בקר. Todos os marcadores de nota aparecem junto aos termos correspondentes no texto.
