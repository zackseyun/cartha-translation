  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: pt
  text: Agora, por favor, perdoem o meu pecado[a] só desta vez e supliquem a Yahweh, o Deus de vocês, para que ele afaste de mim apenas esta morte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tirem o meu pecado” ou “perdoem a minha culpa”. A expressão hebraica usa literalmente o verbo “levantar/carregar” tendo “pecado” como objeto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “esta morte”. Faraó provavelmente se refere à praga mortal que estava ocorrendo e a seus efeitos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz o apelo urgente de Faraó de modo natural em português; o contexto transmite suficientemente a função conectiva de וְ.
- source_word: שָׂא נָא חַטָּאתִי
  choice: por favor, perdoem o meu pecado
  rationale: נָשָׂא significa literalmente “levantar/carregar”, mas, tendo “pecado” como objeto, forma uma expressão idiomática para perdoar ou retirar a culpa. O plural “perdoem” preserva a forma verbal dirigida a Moisés e Arão, e “por favor” representa נָא.
- source_word: אַךְ הַפַּעַם
  choice: só desta vez
  rationale: Reproduz a restrição enfática do pedido de Faraó a esta ocasião.
- source_word: וְהַעְתִּירוּ
  choice: e supliquem
  rationale: A forma verbal expressa uma petição intensa dirigida a Deus. “Supliquem” comunica oração insistente sem recorrer a linguagem arcaica e mantém o plural hebraico.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: a Yahweh, o Deus de vocês
  rationale: Mantém o nome divino expresso no texto e preserva o distanciamento de Faraó ao dizer “o Deus de vocês”.
- source_word: וְיָסֵר מֵעָלַי
  choice: para que ele afaste de mim
  rationale: Expressa naturalmente a finalidade ou o resultado esperado da súplica. “Afaste de mim” corresponde ao sentido contextual de remover algo que pesa sobre Faraó.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: apenas esta morte
  rationale: Preserva tanto a força restritiva de רַק quanto a formulação incomum e deliberadamente não especificada do hebraico, literalmente “esta morte”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Referência de “esta morte”
  choice: Manter a expressão literal e ambígua
  alternative: esta praga mortal; esta calamidade
  rationale: No contexto, Faraó provavelmente se refere à praga de gafanhotos e a seus efeitos letais, mas o hebraico diz apenas “esta morte”. A tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As formas plurais “perdoem” e “supliquem” preservam o fato de Faraó se dirigir a Moisés e Arão. A estranheza de “esta morte” é mantida por fidelidade à ambiguidade do original e esclarecida em nota.
