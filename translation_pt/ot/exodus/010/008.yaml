base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: pt
  text: 'Então Moisés e Arão foram levados de volta ao faraó, e ele lhes disse: “Vão, sirvam a Yahweh, o Deus de vocês. Quem[a] são os que vão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Quem e quem são os que vão?” — expressão idiomática que pede a identificação precisa de todos os que irão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: foram levados de volta
  rationale: 'O hofal de שׁוב tem sentido passivo-causativo: Moisés e Arão foram feitos retornar. A formulação preserva esse valor e soa natural em português.'
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Moisés e Arão
  rationale: Os marcadores hebraicos de objeto direto não têm equivalente expresso em português; os nomes seguem suas formas portuguesas consagradas.
- source_word: אֶל פַּרְעֹה
  choice: ao faraó
  rationale: אֶל indica movimento em direção a alguém; “ao faraó” expressa diretamente esse sentido.
- source_word: לְכוּ
  choice: Vão
  rationale: Imperativo plural de הלך, traduzido pelo imperativo corrente em português.
- source_word: עִבְדוּ
  choice: sirvam
  rationale: עבד designa prestar serviço e, neste contexto, serviço religioso a Deus. “Sirvam” preserva a amplitude lexical sem restringir o sentido apenas ao culto litúrgico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O substantivo com sufixo de segunda pessoa masculina plural é expresso de modo claro e amplamente compreensível em português.
- source_word: מִי וָמִי
  choice: Quem
  rationale: A expressão idiomática hebraica pede a identificação precisa das pessoas. O texto principal usa uma pergunta natural em português, enquanto a repetição literal é registrada em nota.
- source_word: הַהֹלְכִים
  choice: os que irão
  rationale: O particípio com artigo funciona substantivamente, “os que vão”. O futuro “irão” é natural no contexto da permissão ainda em discussão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. “O Deus de vocês” evita a possível ambiguidade de “seu Deus” e representa claramente o plural hebraico. A nota foi colocada junto à pergunta que esclarece.
