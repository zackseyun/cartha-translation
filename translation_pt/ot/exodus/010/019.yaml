source:
  edition: WLC
  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: pt
  text: Então Yahweh mudou o vento, e um vento muito forte soprou do oeste[a]. Ele levou os gafanhotos e os lançou no Mar dos Juncos[b]. Não restou um só gafanhoto em todo o território do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “vento do mar”; neste contexto, provavelmente um vento vindo do mar Mediterrâneo, isto é, do oeste.'
    reason: Preserva a expressão hebraica e explica sua provável referência geográfica sem converter a inferência contextual em certeza.
  - marker: b
    text: Tradicionalmente traduzido como “Mar Vermelho”.
    reason: Registra a forma tradicional do topônimo para orientar o leitor.
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: mudou o vento, fazendo soprar
  rationale: O verbo הפך indica virar ou mudar. A formulação explicita de modo natural em português a mudança do vento, sem acrescentar uma causa além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רוּחַ יָם
  choice: vento do oeste
  rationale: Literalmente, a expressão é 'vento do mar'. No contexto geográfico do Egito, o mar fica a oeste, de modo que a expressão designa naturalmente um vento vindo do oeste; a imagem literal é indicada em nota.
- source_word: חָזָק מְאֹד
  choice: muito forte
  rationale: Reproduz com clareza e naturalidade a intensificação do hebraico.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: levou os gafanhotos
  rationale: נשא pode significar levantar, carregar ou levar. Com o vento como agente, 'levou' expressa naturalmente o transporte do enxame.
- source_word: וַיִּתְקָעֵהוּ
  choice: os lançou
  rationale: תקע aqui comunica impelir ou lançar com força. Embora o sufixo hebraico seja singular, ele retoma coletivamente o enxame de gafanhotos; o plural é natural em português.
- source_word: יָמָּה סּוּף
  choice: no mar dos Juncos
  rationale: Traduz o topônimo hebraico Yam Suf de forma transparente, em vez de adotar no texto principal a forma tradicional 'mar Vermelho'.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: Não restou um só gafanhoto
  rationale: Mantém a ênfase totalizante do singular אֶחָד e soa idiomático em português.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: em todo o território do Egito
  rationale: Neste contexto, גְּבוּל abrange a extensão territorial do Egito, não apenas sua fronteira.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Representação de יָם סוּף
  choice: mar dos Juncos
  alternative: mar Vermelho
  rationale: A escolha segue mais de perto a forma hebraica do topônimo; a tradução tradicional é mantida em nota para orientação do leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita a ambiguidade portuguesa de 'virou um vento' e mantém as notas junto aos termos correspondentes.
