base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: pt
  text: Não viram uns aos outros[a], e ninguém se levantou do seu lugar durante três dias; mas todos os filhos de Israel tinham luz em suas moradias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente, “um homem não viu o seu irmão”. A expressão tem sentido recíproco: “não viram uns aos outros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת אָחִיו
  choice: viam uns aos outros
  rationale: A construção literalmente diz que um homem não via seu irmão, mas funciona de modo recíproco. “Uns aos outros” comunica naturalmente essa reciprocidade sem restringir o sentido a irmãos de sangue. O hebraico afirma o fato, por isso não se acrescenta o interpretativo “não conseguiam ver”.
- source_word: אִישׁ
  choice: ninguém
  rationale: O substantivo masculino singular tem aqui valor distributivo e genérico. “Ninguém” reproduz esse sentido em português corrente sem limitar a referência aos homens.
- source_word: קָמוּ
  choice: se levantou
  rationale: O verbo קום significa comumente levantar-se ou erguer-se. “Se levantou” é natural e mantém o registro narrativo.
- source_word: מִתַּחְתָּיו
  choice: do seu lugar
  rationale: Embora a forma seja literalmente “de debaixo dele”, a expressão indica sair do lugar onde a pessoa estava. “Do seu lugar” transmite o sentido idiomático com clareza.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: durante três dias
  rationale: “Durante” expressa naturalmente em português a extensão temporal indicada pelo sintagma hebraico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: A tradução conserva a forma familiar e pactual da designação hebraica, que se refere coletivamente ao povo de Israel, e permanece clara em português bíblico moderno.
- source_word: הָיָה אוֹר
  choice: tinham luz
  rationale: A construção apresenta a luz como disponível aos filhos de Israel, em contraste direto com as trevas entre os egípcios. “Tinham luz” reproduz esse contraste de modo idiomático.
- source_word: בְּמֹשְׁבֹתָם
  choice: em suas moradias
  rationale: מוֹשָׁב pode indicar lugar de habitação ou assentamento. “Moradias” mantém a referência aos lugares em que viviam sem decidir indevidamente entre casas individuais e áreas habitadas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Conserva-se “filhos de Israel” para preservar a textura familiar da designação hebraica, enquanto “moradias” mantém a amplitude possível do termo original.
