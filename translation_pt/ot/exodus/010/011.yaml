  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: pt
  text: “Não![a] Vão agora os homens[b] e sirvam a Yahweh, pois é isso que vocês estão pedindo.” Então ele os expulsou da presença do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não será assim!” — tradução mais formal da recusa abrupta do faraó.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os homens”, referindo-se especificamente aos indivíduos do sexo masculino, não a todo o povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Não!
  rationale: Expressa de modo natural e incisivo a recusa abrupta do faraó; a alternativa mais formal é preservada em nota.
- source_word: לְכוּ נָא
  choice: Vão agora
  rationale: O imperativo com נָא pode suavizar ou dar urgência ao pedido. Neste contexto, “agora” combina melhor com o tom impaciente e categórico do faraó do que “por favor”.
- source_word: הַגְּבָרִים
  choice: os homens
  rationale: O substantivo designa especificamente os homens, em contraste com mulheres e crianças; essa restrição é essencial para a concessão parcial do faraó.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: e sirvam a Yahweh
  rationale: עבד, quando tem Deus como objeto, abrange serviço e culto. “Sirvam” preserva essa amplitude, e o nome divino é transliterado como “Yahweh”.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: pois é isso que vocês estão pedindo
  rationale: O pronome feminino retoma algo implícito, provavelmente a solicitação. “É isso que vocês estão pedindo” é natural em português sem especificar além do que o hebraico permite.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: Então ele os expulsou
  rationale: O verbo indica uma retirada forçada. O sujeito singular é naturalmente entendido, pelo contexto, como o faraó.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: da presença do faraó
  rationale: Equivalente português claro para o idioma hebraico que significa ser retirado de diante de alguém.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Restrição da permissão aos homens
  choice: os homens
  alternative: o povo; somente os homens
  rationale: O hebraico identifica especificamente os indivíduos do sexo masculino. A tradução mantém a restrição sem acrescentar “somente”, que não aparece de forma explícita no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O discurso direto mantém o tom abrupto do faraó; “vocês” comunica naturalmente a segunda pessoa do plural. “Faraó” aparece em minúscula por funcionar como título.
