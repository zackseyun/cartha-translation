base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: pt
  text: Eles encherão as suas casas, as casas de todos os seus servos e as casas de todo o Egito — algo que nem os seus pais nem os pais de seus pais viram[a], desde o dia em que vieram a existir sobre a terra[b] até o dia de hoje.” Então Moisés se virou e saiu da presença do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “que os seus pais e os pais de seus pais não viram”. A oração se refere à praga sem precedentes que acaba de ser anunciada.
    reason: lexical_alternative
  - marker: b
    text: O termo também pode ser traduzido por “solo” ou, conforme o contexto, “terra habitada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: Elas encherão
  rationale: O sujeito implícito são os gafanhotos mencionados no contexto anterior; o perfeito com conjunção dá continuidade ao anúncio futuro. O pronome feminino concorda naturalmente com “pragas de gafanhotos”/“nuvens de gafanhotos” no contexto, sem repetir o substantivo.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: as suas casas, as casas de todos os seus servos e as casas de todo o Egito
  rationale: Mantém a repetição e a progressão do hebraico, das casas do faraó às de seus servos e, por fim, às de todo o Egito.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: Preserva o termo amplo do hebraico; no contexto da corte pode incluir servidores e autoridades, sem especificar indevidamente “escravos”.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: algo que ... não viram
  rationale: A construção torna natural em português a referência ao caráter sem precedentes da praga, sem fixar de modo rígido o antecedente da oração relativa.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: os seus pais nem os pais de seus pais
  rationale: Conserva a expressão geracional enfática do hebraico; “avós” seria estreito demais, pois estão em vista gerações anteriores de modo amplo.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: desde o dia em que passaram a existir sobre a terra
  rationale: Representa o início da existência ou presença das gerações mencionadas. “Sobre a terra” é idiomático e mantém a amplitude lexical de אֲדָמָה.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente português natural e solene da fórmula temporal hebraica.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Então Moisés se virou e saiu da presença do faraó
  rationale: O nome “Moisés”, recuperado do contexto, evita ambiguidade em português; “da presença do faraó” comunica naturalmente o afastamento indicado por מֵעִם.
- source_word: פַּרְעֹה
  choice: faraó
  rationale: Usado como título, recebe minúscula segundo a norma corrente do português.
