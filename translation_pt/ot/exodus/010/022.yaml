  text: וַ/יֵּ֥ט מֹשֶׁ֛ה אֶת יָד֖/וֹ עַל הַ/שָּׁמָ֑יִם וַ/יְהִ֧י חֹֽשֶׁךְ אֲפֵלָ֛ה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם שְׁלֹ֥שֶׁת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: pt
  text: Então Moisés estendeu a mão em direção ao céu[a], e houve densas trevas[b] em toda a terra do Egito durante três dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em direção aos céus”. O hebraico שָּׁמַיִם pode significar “céu” ou “céus”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “profundas trevas”. A expressão hebraica reúne “trevas” e outro termo que denota escuridão intensa, reforçando a ideia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: estendeu
  rationale: O verbo נטה, neste contexto gestual, indica estender a mão; a formulação é natural em português e preserva a ação física.
- source_word: יָדוֹ
  choice: a mão
  rationale: יָד significa normalmente “mão”, e o possessivo é recuperado naturalmente pelo sujeito explícito em português.
- source_word: עַל הַשָּׁמָיִם
  choice: em direção ao céu
  rationale: Com o gesto de estender a mão, עַל pode indicar direção; “céu” é a opção contextual mais natural, sem excluir a alternativa lexical “céus”.
- source_word: וַיְהִי
  choice: houve
  rationale: A forma de היה introduz o estado resultante; “houve” expressa de modo conciso o surgimento das trevas.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: densas trevas
  rationale: A combinação de dois termos ligados à escuridão tem força intensificadora. “Densas trevas” preserva a intensidade e soa digna e compreensível em português.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: em toda a terra do Egito
  rationale: Representa diretamente a preposição בְּ e a expressão geográfica אֶרֶץ מִצְרַיִם, em formulação corrente na linguagem bíblica portuguesa.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: durante três dias
  rationale: “Durante” torna explícito o valor de duração temporal já presente no contexto, sem acrescentar interpretação.
