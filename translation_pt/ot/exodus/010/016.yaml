  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: pt
  text: 'Então o faraó mandou chamar depressa Moisés e Arão e disse: “Pequei contra Yahweh, o Deus de vocês, e contra vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: depressa
  rationale: O verbo מהר expressa pressa ou rapidez. Ligado a “mandou chamar”, “depressa” comunica com naturalidade a urgência da ação do faraó.
- source_word: לִקְרֹא
  choice: mandou chamar
  rationale: Neste contexto, o faraó ordena que Moisés e Arão sejam trazidos à sua presença. “Mandou chamar” é idiomático em português e expressa melhor esse sentido do que o simples “chamou”.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma corrente em português para o título do soberano egípcio; o artigo definido é natural neste contexto narrativo.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Os nomes tradicionais em português são mantidos; a relação introduzida pelas preposições hebraicas fica naturalmente incorporada em “mandou chamar Moisés e Arão”.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: Representa de modo direto e natural a forma narrativa hebraica que introduz o discurso.
- source_word: חָטָאתִי
  choice: Pequei
  rationale: Traduz diretamente o verbo חטא e preserva sua força moral e teológica. O pretérito perfeito é natural para uma confissão pontual em português.
- source_word: לַיהוָה
  choice: contra Yahweh
  rationale: Depois de חטא, a preposição ל identifica a parte ofendida; em português, a construção idiomática é “pecar contra”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e o distingue de títulos como “Senhor”.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O sufixo hebraico é da segunda pessoa do plural. “O Deus de vocês” é claro e amplamente compreensível, deixando explícito que o faraó se refere ao Deus de Moisés e Arão.
- source_word: וְלָכֶם
  choice: e contra vocês
  rationale: A preposição retoma o complemento de “pequei”. O plural inclui conjuntamente Moisés e Arão e é preservado por “vocês”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Natureza da confissão do faraó
  choice: Pequei contra Yahweh, o Deus de vocês, e contra vocês
  alternative: Pequei diante de Yahweh, seu Deus, e de vocês
  rationale: A formulação conserva tanto a linguagem explícita de pecado quanto a identificação de Yahweh como Deus dos interlocutores, sem ampliar a fala para uma adesão pessoal do faraó. “Contra” expressa naturalmente em português a parte ofendida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismo marcado. “Mandou chamar depressa” reproduz a urgência do hebraico; “vocês” deixa inequívoco o plural de אֱלֹהֵיכֶם e לָכֶם.
