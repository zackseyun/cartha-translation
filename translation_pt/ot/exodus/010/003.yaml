base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: pt
  text: 'Moisés e Arão foram à presença do faraó e lhe disseram: “Assim diz Yahweh, o Deus dos hebreus: Até quando se recusará a se humilhar diante de mim?[a] Deixe o meu povo ir, para que eles me sirvam.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a se submeter a mim” ou “a ser humilhado diante de mim”. O verbo hebraico pode expressar a ideia de humilhar-se, submeter-se ou ser humilhado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que eles me adorem”. O verbo hebraico também pode designar serviço cultual ou adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foram à presença
  rationale: O verbo בוא com אֶל indica ir até alguém ou entrar em sua presença. A formulação preserva o cenário de audiência com o faraó sem tornar o português excessivamente literal.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula de mensageiro divino e sua força presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: Até quando se recusará
  rationale: Reproduz de modo natural o desafio temporal hebraico e o caráter persistente da recusa do faraó.
- source_word: לֵעָנֹת מִפָּנָי
  choice: a se humilhar diante de mim
  rationale: Expressa a leitura reflexiva mais adequada ao contexto, mantendo em nota as possibilidades de submissão e de sentido passivo.
- source_word: שַׁלַּח עַמִּי
  choice: Deixe o meu povo ir
  rationale: Equivalente natural da fórmula recorrente do Êxodo, preservando a exigência de libertação.
- source_word: וְיַעַבְדֻנִי
  choice: para que eles me sirvam
  rationale: O verbo עבד abrange serviço e serviço cultual. “Sirvam” preserva essa amplitude melhor que o mais restrito “adorem”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto apresenta diretamente o nome próprio divino. A transliteração preserva essa identificação sem substituí-la por um título.
- issue: Sentido de לֵעָנֹת diante de Deus
  choice: se humilhar diante de mim
  alternative: submeter-se a mim; ser humilhado diante de mim
  rationale: A forma hebraica admite nuances reflexiva e passiva. O contexto favorece a exigência de que o faraó se humilhe, mas a nota conserva a ambiguidade lexical genuína.
- issue: Sentido de וְיַעַבְדֻנִי na exigência do Êxodo
  choice: para que eles me sirvam
  alternative: para que eles me adorem
  rationale: O serviço em vista inclui culto, mas עבד tem alcance mais amplo. “Servir” evita restringir indevidamente o sentido à adoração litúrgica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se tanto o tratamento arcaico de segunda pessoa quanto um pronome honorífico não presente no hebraico. A retomada plural “eles” preserva o verbo hebraico no plural, embora “povo” seja singular em português.
