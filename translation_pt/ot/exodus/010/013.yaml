  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: pt
  text: Então Moisés estendeu seu cajado sobre a terra do Egito, e Yahweh fez soprar sobre a terra um vento do leste[a] durante todo aquele dia e toda a noite. Quando amanheceu, o vento do leste havia trazido os gafanhotos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um vento leste”.'
    reason: Registra uma alternativa mais concisa para a expressão רוּחַ קָדִים, que denota vento procedente do leste.
lexical_decisions:
- source_word: וַיֵּט
  choice: estendeu
  rationale: O verbo נטה expressa estender ou alongar; “estendeu” é natural em português e se ajusta à fórmula narrativa das pragas.
- source_word: מַטֵּהוּ
  choice: seu cajado
  rationale: מַטֶּה pode designar vara ou cajado. “Cajado” identifica com clareza o objeto usado por Moisés e mantém o registro narrativo digno.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: sobre a terra do Egito
  rationale: Com o gesto do cajado, עַל é bem representado por “sobre”; אֶרֶץ מִצְרַיִם significa “a terra do Egito”.
- source_word: נִהַג
  choice: fez soprar
  rationale: נהג significa conduzir ou impelir. Tendo “vento” como objeto, “fez soprar” comunica em português corrente a ação causativa de Yahweh sem sugerir que o vento seja um agente guiado como pessoa ou animal.
- source_word: רוּחַ קָדִים
  choice: um vento leste
  rationale: A expressão indica um vento procedente do leste. “Vento leste” é conciso e natural; a alternativa mais explícita é registrada em nota.
- source_word: בָּאָרֶץ
  choice: sobre a terra
  rationale: No contexto do movimento do vento, “sobre a terra” representa naturalmente a preposição ב e a extensão geográfica da ação.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: durante todo aquele dia e toda a noite
  rationale: A formulação conserva a repetição enfática de כָּל e mantém o demonstrativo ligado a “dia”, como no hebraico, em português natural.
- source_word: הַבֹּקֶר הָיָה
  choice: Quando amanheceu
  rationale: A construção hebraica marca a chegada da manhã. “Quando amanheceu” expressa com naturalidade essa transição temporal.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: havia trazido os gafanhotos
  rationale: נשא pode significar carregar ou trazer. O mais-que-perfeito composto esclarece que o transporte dos gafanhotos pelo vento ocorreu durante o período que culminou no amanhecer.
- source_word: הָאַרְבֶּה
  choice: os gafanhotos
  rationale: O substantivo singular hebraico tem sentido coletivo neste contexto; o plural idiomático em português representa a multidão da praga.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe acompanha a progressão narrativa hebraica, mas evita construções artificiais. O marcador da nota foi colocado junto de “vento leste”, expressão à qual a variante lexical efetivamente se refere.
