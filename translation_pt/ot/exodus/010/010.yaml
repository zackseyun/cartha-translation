  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: pt
  text: 'E ele lhes disse[a]: “Que Yahweh esteja mesmo com vocês, se eu algum dia deixar vocês e suas crianças irem! Vejam[b], pois o mal está diante de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh esteja com vocês quando eu deixar vocês e suas crianças irem”, provavelmente dito com sarcasmo.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico é ambíguo: a frase pode significar “o desastre está à frente de vocês” ou “vocês têm o mal em vista / em mente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: Que Yahweh esteja mesmo com vocês
  rationale: Mantém a força volitiva de יְהִי e expressa כֵן de modo natural por “mesmo”, deixando que o contexto comunique a ironia de Faraó.
- source_word: כַּאֲשֶׁר אֲשַׁלַּח
  choice: se eu algum dia deixar ... irem
  rationale: Embora כַּאֲשֶׁר possa significar “quando” ou “assim como”, neste contexto hostil a formulação condicional transmite naturalmente o desafio sarcástico, enquanto שׁלח assume o sentido narrativo de permitir a partida.
- source_word: טַפְּכֶם
  choice: suas crianças
  rationale: טַף designa especialmente as crianças pequenas; “crianças” é claro e corrente, sem ampliar o termo para todos os dependentes.
- source_word: רְאוּ
  choice: Vejam
  rationale: Conserva o imperativo de ראה e permite que ele funcione, no contexto, tanto como chamada de atenção quanto como advertência.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: pois o mal está diante de vocês
  rationale: Segue de perto a formulação hebraica e preserva a ambiguidade entre um mal ou desastre que os espera e uma intenção má atribuída a eles.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová / SENHOR
  rationale: Translitera o nome divino conforme a convenção do projeto, sem substituí-lo por um título.
- issue: Ambiguidade da advertência final de Faraó
  choice: o mal está diante de vocês
  alternative: o desastre está à frente de vocês / vocês têm más intenções
  rationale: A redação principal retém a tensão sem decidir se Faraó ameaça com uma calamidade ou acusa Moisés e Arão de intenção maligna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. O uso de “vocês” evita formas regionais marcadas; a ironia é comunicada pelo contexto e por “mesmo” e “se eu algum dia”, sem explicitação excessiva no texto principal.
