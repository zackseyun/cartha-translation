base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: pt
  text: 'Moisés respondeu: “Iremos com nossos jovens e nossos idosos; iremos com nossos filhos e nossas filhas, com nossos rebanhos e nosso gado, pois temos de celebrar uma festa para o SENHOR.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: com os nossos jovens e os nossos idosos
  rationale: Reproduz o contraste abrangente entre jovens e velhos em linguagem natural e respeitosa.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: com os nossos rebanhos de ovelhas e de gado
  rationale: Distingue צֹאן, animais de pequeno porte sobretudo ovelhas e cabras, de בָּקָר, gado bovino, sem usar termos técnicos pouco comuns.
- source_word: חַג
  choice: uma festa
  rationale: O substantivo designa uma celebração festiva, frequentemente ligada à peregrinação; 'festa' preserva o sentido sem acrescentar detalhes não expressos.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes/maiúsculas.
- source_word: כִּי
  choice: porque
  rationale: 'Mantém a relação causal explícita: todos e seus animais irão porque haverá uma festa dedicada ao SENHOR.'
theological_decisions:
- issue: Força modal da oração כִּי חַג יְהוָה לָנוּ
  choice: porque celebraremos uma festa ao SENHOR
  alternative: porque temos de celebrar uma festa ao SENHOR
  rationale: O hebraico diz literalmente que há/é para eles uma festa do SENHOR, sem verbo modal explícito. A formulação escolhida expressa o propósito no contexto sem introduzir diretamente a ideia de obrigação, embora ela seja contextualmente possível.
- issue: Relação expressa por חַג יְהוָה
  choice: uma festa ao SENHOR
  alternative: uma festa do SENHOR
  rationale: A construção pode indicar uma festa pertencente, dedicada ou celebrada em honra ao SENHOR. 'Ao SENHOR' comunica naturalmente a dedicação cultual sem especificar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “iremos” foi preservada por refletir a ênfase retórica do hebraico. Não há notas de rodapé nesta tradução.
