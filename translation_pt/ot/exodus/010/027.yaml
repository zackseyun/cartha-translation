base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: pt
  text: Mas Yahweh endureceu o coração de Faraó[a], e ele não quis deixá-los ir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou firme” ou “fortaleceu o coração de Faraó”. O verbo hebraico pode significar “fortalecer” ou “tornar firme”, mas, neste contexto com “coração”, tem o sentido de “endurecer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele se recusou a deixá-los ir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: endureceu
  rationale: O verbo חזק significa literalmente fortalecer ou tornar firme, mas, nesta fórmula recorrente de Êxodo com “coração”, comunica de modo idiomático o endurecimento da disposição. “Endureceu” é natural em português e preserva o padrão narrativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵב
  choice: coração
  rationale: “Coração” preserva a expressão hebraica e é compreensível em português como referência à disposição interior e à vontade.
- source_word: פַּרְעֹה
  choice: faraó
  rationale: Forma portuguesa corrente do título real egípcio; usa-se minúscula por funcionar aqui como título comum.
- source_word: לֹא אָבָה
  choice: não quis
  rationale: אָבָה expressa vontade ou consentimento. “Não quis” é uma formulação direta e natural que mantém a volição do faraó, sem acrescentar uma relação causal ausente do hebraico.
- source_word: לְשַׁלְּחָם
  choice: deixá-los ir
  rationale: Neste contexto de Êxodo, שׁלח significa permitir que os israelitas partam. “Deixá-los ir” reproduz naturalmente o refrão narrativo.
theological_decisions:
- issue: Endurecimento divino e vontade humana
  choice: 'Manter as duas afirmações coordenadas: Yahweh endureceu o coração do faraó, e ele não quis deixá-los ir.'
  alternative: Yahweh tornou firme o coração do faraó, de modo que ele se recusou a deixá-los ir.
  rationale: O hebraico atribui explicitamente a Yahweh o endurecimento e, em seguida, afirma a falta de disposição do faraó. A tradução conserva essa tensão, sem atenuar a ação divina nem transformar a segunda oração em mero resultado causal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A construção “não quis” é mais direta que “não estava disposto”, e “deixá-los ir” conserva o conhecido refrão de Êxodo. Todos os marcadores de nota aparecem no texto principal.
