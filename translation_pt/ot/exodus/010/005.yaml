review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a cobertura da superfície da terra, a impossibilidade de vê-la, e a devastação causada pelos gafanhotos. Contudo, “depois do granizo” reduz a relação expressa por מִן־הַבָּרָד a mera sequência temporal; o hebraico identifica o restante como aquilo que escapou/sobreviveu ao granizo.
  naturalness: O português é claro, atual e adequado ao registro narrativo. O plural “Eles cobrirão / Comerão” retoma naturalmente os gafanhotos do contexto e é preferível a um singular coletivo pouco natural.
  terminology: “Superfície da terra” comunica bem o idiomatismo עֵין הָאָרֶץ, com a explicação literal na nota. “O restante que escapou ao granizo” evita tratar plantações como “sobreviventes” e preserva a construção hebraica.
  issues:
  - severity: medium
    issue: “depois do granizo” em vez de uma formulação que expresse escape ou sobrevivência ao granizo
    rationale: Em הַנִּשְׁאֶרֶת לָכֶם מִן־הַבָּרָד, מִן relaciona o restante à destruição provocada pelo granizo. “Depois de” pode indicar somente tempo e deixa de explicitar que esse restante foi poupado do granizo.
  revised_text: Eles cobrirão a superfície da terra[a], de modo que não se poderá ver a terra. Comerão o restante que escapou ao granizo e ficou para vocês, e comerão toda árvore que cresce para vocês no campo.
  revised_footnotes:
  - marker: a
    text: Literalmente, “o olho da terra”, expressão hebraica que se refere à superfície visível da terra.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o restante do que escapou, que restou para vocês do granizo”.'
    reason: alternative_reading
  revision_rationale: A revisão substitui a relação temporal imprecisa “depois do granizo” por “escapou ao granizo”, preservando o sentido de remanescente poupado da praga anterior. A nota b registra uma alternativa mais próxima da estrutura nominal e participial do hebraico.
