revisions:
- from: Eles cobrirão a superfície da terra[a], de modo que não se poderá ver a terra. Comerão o restante do que escapou, o que ficou para vocês depois do granizo[b], e comerão toda árvore que cresce para vocês no campo.
  to: Eles cobrirão a superfície da terra[a], de modo que não se poderá ver a terra. Comerão o restante que escapou ao granizo e ficou para vocês, e comerão toda árvore que cresce para vocês no campo.
  rationale: A revisão substitui a relação temporal imprecisa “depois do granizo” por “escapou ao granizo”, preservando o sentido de remanescente poupado da praga anterior. A nota b registra uma alternativa mais próxima da estrutura nominal e participial do hebraico.
