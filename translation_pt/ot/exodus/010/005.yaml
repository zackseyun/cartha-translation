base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: pt
  text: Eles cobrirão a superfície da terra[a], de modo que não se poderá ver a terra. Comerão o restante que escapou ao granizo e ficou para vocês, e comerão toda árvore que cresce para vocês no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o olho da terra”, expressão hebraica que se refere à superfície visível da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִסָּה
  choice: Eles cobrirão
  rationale: כסה significa “cobrir, ocultar”. O singular hebraico concorda com o coletivo אַרְבֶּה, “gafanhoto/enxame de gafanhotos”, do contexto anterior; o plural é a forma natural de retomar “gafanhotos” em português.
- source_word: עֵין הָאָרֶץ
  choice: a superfície da terra
  rationale: A expressão literalmente diz “o olho da terra”, idioma hebraico que designa sua superfície visível. “Superfície da terra” transmite o sentido com clareza, enquanto a forma literal é registrada em nota.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: de modo que não se poderá ver a terra
  rationale: A construção emprega um singular impessoal, literalmente “não poderá ver a terra”. A formulação impessoal portuguesa preserva essa estrutura sem introduzir um observador específico.
- source_word: וְאָכַל
  choice: Comerão
  rationale: אכל é o verbo comum “comer”. O plural português acompanha “gafanhotos”, embora o hebraico use o singular coletivo.
- source_word: יֶתֶר הַפְּלֵטָה
  choice: o restante do que escapou
  rationale: A expressão combina a ideia de resto com aquilo que escapou da destruição. Esta redação mantém as duas nuances e evita aplicar “sobreviventes” de modo pouco natural às plantações.
- source_word: הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: o que ficou para vocês depois do granizo
  rationale: O particípio caracteriza o restante deixado aos egípcios após a devastação do granizo. “Depois do granizo” expressa naturalmente o valor contextual de מן, enquanto uma tradução mais formal é preservada em nota.
- source_word: כָּל הָעֵץ
  choice: toda árvore
  rationale: עץ pode ter valor coletivo, mas com כל a leitura distributiva “toda árvore” é precisa e idiomática.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: que cresce para vocês no campo
  rationale: צמח indica crescer ou brotar; לָכֶם conserva a ideia de benefício ou posse. Embora מן expresse literalmente origem (“do campo”), “no campo” é mais natural em português neste contexto.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com “vocês” para ampla legibilidade brasileira e compreensão internacional. O plural retoma naturalmente os gafanhotos, sujeito coletivo singular no hebraico. A repetição de “terra” e de “comerão” foi mantida por refletir a ênfase do original.
