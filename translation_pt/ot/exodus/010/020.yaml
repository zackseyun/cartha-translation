base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: pt
  text: Mas Yahweh endureceu[a] o coração do faraó, e ele não deixou os filhos de Israel[b] partir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornou firme o coração do faraó” ou “fortaleceu o coração do faraó”; o verbo hebraico significa literalmente “tornar forte/firme”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os israelitas”; tradicionalmente, “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: endureceu
  rationale: O piel de חזק significa literalmente tornar forte ou firme; na fórmula recorrente do Êxodo, “endureceu” comunica de modo natural a resistência interior que se tornou inflexível, sem ocultar a ação divina explicitamente afirmada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לֵב
  choice: coração
  rationale: Preserva o idioma hebraico e abrange disposição, vontade e determinação interior.
- source_word: פַּרְעֹה
  choice: do faraó
  rationale: Forma corrente em português para o título real, com artigo definido de uso natural.
- source_word: שִׁלַּח
  choice: deixou ... partir
  rationale: No contexto da libertação de Israel, esta construção expressa naturalmente o sentido contextual de permitir que alguém vá embora.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão familiar hebraica, enquanto a nota registra a alternativa portuguesa mais fluida, “os israelitas”.
theological_decisions:
- issue: Ação divina no endurecimento do faraó
  choice: Yahweh endureceu o coração do faraó
  alternative: Yahweh tornou firme o coração do faraó / fortaleceu o coração do faraó
  rationale: O hebraico atribui diretamente a ação a Yahweh. A tradução preserva essa agência e a tensão teológica do relato, sem introduzir uma explicação sobre responsabilidade humana ou predestinação que o versículo não oferece.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A conjunção adversativa “Mas” representa וַ no fluxo narrativo e mantém a ligação com o contexto. A ordem das notas segue os termos a que estão anexadas no texto.
