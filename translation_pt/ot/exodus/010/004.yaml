  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: pt
  text: Pois, se você se recusar a deixar o meu povo partir, eis que amanhã trarei gafanhotos[a] para o seu território[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico está no singular, mas é empregado aqui em sentido coletivo; por isso, “gafanhotos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dentro das suas fronteiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Introduz uma advertência condicional ligada ao discurso anterior, preservando tanto a continuidade causal de כִּי como a condição expressa por אִם.
- source_word: מָאֵן
  choice: se recusar
  rationale: Expressa recusa deliberada, e não simples incapacidade ou hesitação.
- source_word: לְשַׁלֵּחַ
  choice: deixar ... partir
  rationale: No contexto do êxodo, traduz naturalmente a ideia de permitir que o povo saia, sem tornar o verbo excessivamente técnico.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Preserva de modo direto a expressão possessiva e sua relevância pactual.
- source_word: הִנְנִי
  choice: eis que
  rationale: Mantém a ênfase solene e a iminência da advertência em registro bíblico ainda compreensível.
- source_word: מֵבִיא
  choice: trarei
  rationale: O particípio com הִנְנִי indica ação futura iminente; o futuro em português é claro e a iminência também é marcada por “eis que” e “amanhã”.
- source_word: מָחָר
  choice: amanhã
  rationale: Equivalente temporal direto.
- source_word: אַרְבֶּה
  choice: gafanhotos
  rationale: Embora singular na forma hebraica, o substantivo é coletivo neste contexto; o plural é a forma natural em português.
- source_word: בִּגְבֻלֶךָ
  choice: para o seu território
  rationale: גְּבוּל pode designar tanto fronteira como a área delimitada; “território” preserva esse sentido e combina naturalmente com o movimento indicado por “trarei”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Eis que” conserva a solenidade enfática do hebraico; “você” explicita de modo natural o destinatário singular, o faraó.
