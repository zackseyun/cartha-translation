  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: pt
  text: 'Moisés, porém, disse: “Você também terá de entregar em nossas mãos sacrifícios e holocaustos, e nós os ofereceremos a Yahweh[a], nosso Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino יהוה (YHWH), aqui representado como “Yahweh”; muitas traduções usam “SENHOR”.
    reason: Esclarecer a representação do Tetragrama e registrar a alternativa tradicional sem ocultar o nome presente no texto-fonte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Moisés, porém, disse
  rationale: O waw consecutivo dá prosseguimento à narrativa, enquanto “porém” expressa naturalmente o contraste com a restrição imposta pelo faraó no versículo anterior.
- source_word: גַּם אַתָּה
  choice: você também
  rationale: A combinação da partícula aditiva com o pronome independente enfatiza que o próprio faraó também deverá fornecer o necessário.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: terá de pôr em nossas mãos
  rationale: “Terá de” comunica a exigência contextual sem transformar a forma verbal em mandamento explícito; “pôr em nossas mãos” conserva a imagem concreta do hebraico e é idiomático em português.
- source_word: זְבָחִים
  choice: sacrifícios
  rationale: Termo amplo e claro para ofertas sacrificiais, especialmente as que envolvem abate.
- source_word: וְעֹלֹת
  choice: e holocaustos
  rationale: “Holocausto” é o termo bíblico português estabelecido para a oferta inteiramente queimada, sem depender do sentido moderno extrabíblico quando usado neste contexto cultual.
- source_word: וְעָשִׂינוּ
  choice: e nós os ofereceremos
  rationale: Embora o verbo signifique literalmente “fazer”, no contexto sacrificial ele denota realizar ou oferecer os sacrifícios. O pronome “os” torna a referência natural em português.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: a Yahweh, nosso Deus
  rationale: A preposição indica o destinatário da oferta; o nome divino é transliterado, e a aposição “nosso Deus” reproduz claramente o hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título; a nota informa a tradição alternativa comum.
- issue: Força de תִּתֵּן
  choice: terá de pôr
  alternative: porá / dará
  rationale: No contexto, Moisés não faz uma simples previsão, mas insiste que o faraó deverá fornecer os animais. A formulação preserva essa força contextual sem elevar a forma a um imperativo gramatical.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A colocação “Moisés, porém, disse” preserva o contraste narrativo; “pôr em nossas mãos” mantém a imagem hebraica sem soar artificial. O tratamento “você” torna explícito o singular dirigido ao faraó.
