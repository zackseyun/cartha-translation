  to: 'Moisés, porém, disse: “Você também terá de entregar em nossas mãos sacrifícios e holocaustos, e nós os ofereceremos a Yahweh[a], nosso Deus.”'
  rationale: A única revisão substitui “pôr” por “entregar”. Ela melhora a naturalidade do português e mantém tanto o sentido de dar/fornecer de תִּתֵּן quanto a imagem concreta de transferência expressa por בְּיָדֵנוּ. O restante do texto e a nota estão adequados.
