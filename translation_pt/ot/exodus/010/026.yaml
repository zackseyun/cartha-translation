source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: pt
  text: Até mesmo os nossos rebanhos irão conosco; nem um casco ficará para trás,[a] pois deles tomaremos para servir a Yahweh, nosso Deus. E não sabemos com que serviremos a Yahweh até chegarmos lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para adorar a Yahweh, nosso Deus” / “com que adoraremos a Yahweh”. O verbo hebraico pode significar “servir” ou, neste contexto, “adorar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: os nossos rebanhos
  rationale: מִקְנֶה é um termo coletivo para animais domésticos possuídos. “Rebanhos” é amplo e natural em português, sem restringir o sentido apenas a gado bovino.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: irão conosco
  rationale: Expressa de modo natural o movimento futuro acompanhado; a concordância no plural segue o sentido coletivo de “rebanhos” em português.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: nem um casco ficará para trás
  rationale: Preserva a imagem literal e enfática de פַּרְסָה, enquanto “ficará para trás” explicita naturalmente a separação implícita.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: pois deles tomaremos
  rationale: Mantém a construção hebraica concisa e evita acrescentar um objeto não expresso, embora o contexto indique que serão tomados animais para o serviço sacrificial.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: para servir a Yahweh, nosso Deus
  rationale: “Servir” preserva a amplitude de עבד e sua repetição no versículo; no contexto, inclui culto e sacrifício sem se limitar a eles.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: E não sabemos
  rationale: O imperfeito hebraico indica a atual falta de conhecimento em relação à futura chegada; o presente é natural em português.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: com que serviremos a Yahweh
  rationale: 'O interrogativo מַה é entendido instrumentalmente no contexto: ainda não se sabe quais animais ou recursos serão usados. “Com que” preserva esse sentido concreto sem impor uma obrigação modal ausente da forma verbal.'
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: até chegarmos lá
  rationale: Traduz com naturalidade a chegada ao destino expressa por בוא com שָׁמָּה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função de nome pessoal no texto hebraico.
theological_decisions:
- issue: Sentido de עבד no contexto sacrificial e cultual
  choice: servir a Yahweh
  alternative: adorar a Yahweh
  rationale: “Adorar” é contextualmente possível, mas “servir” preserva a repetição hebraica e o sentido mais amplo do verbo, mantendo aberta sua dimensão tanto cultual quanto pactual.
- issue: Valor de מַה antes de נַעֲבֹד
  choice: com que serviremos
  alternative: como serviremos
  rationale: O contexto dos rebanhos favorece o valor instrumental, referente ao que será empregado no serviço a Yahweh. A alternativa “como” é possível, porém mais abstrata.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o longo período hebraico sem alterar sua progressão lógica. “Rebanhos” evita o sentido excessivamente estreito de “gado”, e “Yahweh” conserva o nome divino.
