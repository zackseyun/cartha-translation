source:
  edition: WLC
  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: pt
  text: Então Moisés saiu da presença do faraó e suplicou a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “orou fervorosamente a Yahweh” ou “implorou a Yahweh”. O verbo hebraico expressa uma súplica intensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O qal narrativo de יצא indica sair ou partir; “saiu” preserva tanto a sequência narrativa como o movimento concreto.
- source_word: מֵעִם פַּרְעֹה
  choice: da presença do faraó
  rationale: מֵעִם expressa afastamento de junto de alguém. Em português, “da presença do faraó” explicita com naturalidade que Moisés deixou o lugar onde estava com ele.
- source_word: פַּרְעֹה
  choice: faraó
  rationale: Forma consagrada em português para o título real egípcio; usa-se minúscula por funcionar aqui como título comum definido.
- source_word: וַיֶּעְתַּר
  choice: suplicou
  rationale: O verbo עתר neste contexto comunica uma petição intensa dirigida a Deus. “Suplicou” é natural, digno e preserva a ideia de fervor sem acrescentar conteúdo.
- source_word: אֶל
  choice: a
  rationale: A preposição אֶל marca a direção da súplica. Com “suplicar”, a regência “suplicar a Yahweh” é idiomática em português e mantém essa direção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo interpretativamente pelo título “SENHOR”.
- issue: Sujeito implícito de וַיֵּצֵא
  choice: Moisés
  alternative: ele
  rationale: O hebraico deixa o sujeito na continuidade do contexto anterior. Nomeá-lo como “Moisés” em português evita possível ambiguidade com o faraó sem alterar a identificação contextual do agente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem narrativa é mantida, e a expressão “da presença do faraó” reproduz naturalmente a força relacional de מֵעִם.
