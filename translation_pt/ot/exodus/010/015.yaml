  revised_text: Os gafanhotos cobriram a face de toda a terra[a], e a terra escureceu; eles comeram todas as plantas da terra e todos os frutos das árvores que o granizo havia deixado. Não restou nada verde nas árvores nem nas plantas do campo em toda a terra do Egito.
