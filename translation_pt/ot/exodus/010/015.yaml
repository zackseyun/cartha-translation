base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: pt
  text: Os gafanhotos cobriram a face de toda a terra[a], e a terra escureceu; eles comeram todas as plantas da terra e todos os frutos das árvores que o granizo havia deixado. Não restou nada verde nas árvores nem nas plantas do campo em toda a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “o olho de toda a terra”, expressão que indica a superfície visível, ou a face, da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: Cobriu
  rationale: O verbo hebraico está no singular e retoma coletivamente o enxame de gafanhotos do contexto. A omissão natural do pronome em português preserva o singular sem introduzir um referente explícito inexistente no versículo.
- source_word: עֵין כָּל הָאָרֶץ
  choice: a face de toda a terra
  rationale: A expressão hebraica, literalmente “o olho de toda a terra”, é uma metáfora para sua superfície visível. “Face” preserva a imagem de modo compreensível em português.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: e a terra escureceu
  rationale: O verbo indica que a terra se tornou escura. A construção intransitiva é direta e natural, sem precisar especificar além do texto a causa ou o grau da escuridão.
- source_word: וַיֹּאכַל
  choice: Comeu
  rationale: Mantém o sentido simples do verbo e o singular coletivo da sequência hebraica; evita a intensificação interpretativa de “devorou” ou “consumiu”.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: todas as plantas da terra
  rationale: עֵשֶׂב abrange plantas e vegetação, não apenas capim ou ervas. O plural distributivo é idiomático em português.
- source_word: כָּל פְּרִי הָעֵץ
  choice: todos os frutos das árvores
  rationale: Embora “árvore” esteja no singular em hebraico, seu uso é coletivo; o plural português comunica naturalmente a extensão distributiva.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: que o granizo havia deixado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da praga do granizo e mantém o sentido direto de הוֹתִיר, aquilo que o granizo deixou.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: Não restou nada verde
  rationale: Expressa de maneira natural a negação enfática e o sentido resultativo do hebraico, conservando a imagem ampla de qualquer coisa verde.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: nas árvores nem nas plantas do campo
  rationale: Os singulares coletivos são vertidos no plural natural. “Nem” corresponde à negação precedente e une as duas esferas da vegetação.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: em toda a terra do Egito
  rationale: Reproduz a expressão territorial e a abrangência total do original em português claro.
theological_decisions: []
