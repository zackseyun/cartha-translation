  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva o singular coletivo dos verbos hebraicos mediante sujeito oculto, preserva a metáfora “face da terra” com nota explicativa e evita vocabulário arcaico ou intensificação não exigida pelo texto.
