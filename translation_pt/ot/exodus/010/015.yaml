revisions:
- from: Cobriu a face de toda a terra[a], e a terra escureceu. Comeu todas as plantas da terra e todos os frutos das árvores que o granizo havia deixado. Não restou nada verde nas árvores nem nas plantas do campo, em toda a terra do Egito.
  to: Os gafanhotos cobriram a face de toda a terra[a], e a terra escureceu; eles comeram todas as plantas da terra e todos os frutos das árvores que o granizo havia deixado. Não restou nada verde nas árvores nem nas plantas do campo em toda a terra do Egito.
  rationale: A única alteração necessária é explicitar o referente coletivo dos verbos como "os gafanhotos" e retomá-lo por "eles". Embora o hebraico empregue formas verbais no singular coletivo, o plural semântico é a solução portuguesa natural e impede que "a terra" seja interpretada como sujeito de "comeram". Mantêm-se a metáfora com nota, a extensão total da destruição e o restante das escolhas lexicais.
