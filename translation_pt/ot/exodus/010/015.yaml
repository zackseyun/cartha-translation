review_pass:
  verdict: revise
  source_fidelity: O texto transmite adequadamente a devastação total e preserva a expressão metafórica "face de toda a terra", explicada em nota. Porém, os verbos sem sujeito expresso — sobretudo "Comeu" após "a terra escureceu" — podem fazer o leitor português entender, de modo gramaticalmente natural mas incorreto, que a própria terra comeu as plantas. O hebraico usa singular coletivo para a praga de gafanhotos; em português, o plural semântico explícito é mais claro.
  naturalness: A redação é moderna e clara em geral. A explicitação de "os gafanhotos" elimina uma ambiguidade de referência criada pela omissão do sujeito e produz uma sequência mais natural em português.
  terminology: '"Granizo", "plantas", "frutos", "campo" e "terra do Egito" são adequados. "Nada verde" comunica bem כָּל־יֶרֶק. A nota sobre "olho" como expressão para a superfície/face da terra é fiel e útil.'
  issues:
  - severity: medium
    issue: Sujeito elíptico potencialmente ambíguo em "Cobriu" e, especialmente, em "Comeu".
