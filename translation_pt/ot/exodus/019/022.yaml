base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: pt
  text: E também os sacerdotes que se aproximam de Yahweh devem se consagrar[a], para que Yahweh não irrompa contra eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devem se santificar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “irrompa sobre eles”. O hebraico retrata uma irrupção súbita do juízo de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: E também
  rationale: Preserva a ligação aditiva com as ordens anteriores e enfatiza que os sacerdotes igualmente estão incluídos.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente no contexto cultual, mantendo o artigo definido.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: que se aproximam de Yahweh
  rationale: Expressa o particípio de נגשׁ como aproximação para acesso ou serviço diante da presença divina, sem especificar além do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua repetição explícita no versículo.
- source_word: יִתְקַדָּשׁוּ
  choice: devem se consagrar
  rationale: Comunica o valor reflexivo do hitpael e o ato de se preparar ou separar como santo no contexto do Sinai.
- source_word: פֶּן
  choice: para que ... não
  rationale: Forma natural em português para introduzir a consequência negativa temida e a advertência.
- source_word: יִפְרֹץ בָּהֶם
  choice: irrompa contra eles
  rationale: Mantém a imagem vívida de פרץ, uma manifestação súbita e hostil de juízo, sem definir o modo da punição.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome da aliança e evita substituí-lo por um título.
- issue: Sentido da advertência יִפְרֹץ בָּהֶם יְהוָה
  choice: Yahweh pode irromper contra os sacerdotes em juízo súbito
  alternative: Yahweh pode abrir uma brecha entre eles ou lançar-se sobre eles
  rationale: O contexto das restrições no Sinai favorece uma consequência hostil e repentina, mas a tradução conserva a metáfora e não acrescenta uma forma específica de punição.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. Mantém a linguagem cultual de “sacerdotes” e “consagrar”, bem como a metáfora intensa de “irromper”.
