  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: pt
  text: Yahweh desceu sobre o monte Sinai, ao topo do monte. Então Yahweh chamou Moisés ao topo do monte, e Moisés subiu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: O verbo ירד indica movimento para baixo. “Desceu” é direto, natural e mantém o contraste narrativo com “subiu” no fim do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הַר סִינַי
  choice: monte Sinai
  rationale: Forma consagrada e idiomática em português para o nome geográfico.
- source_word: אֶל רֹאשׁ הָהָר
  choice: até o topo do monte / ao topo do monte
  rationale: רֹאשׁ significa literalmente “cabeça”, mas aqui designa idiomaticamente o topo ou cume. As preposições portuguesas foram ajustadas aos respectivos verbos para preservar o sentido espacial com naturalidade.
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: קרא, neste contexto, indica que Yahweh chamou Moisés; “convocou” seria possível, mas explicitaria mais a força do ato.
- source_word: לְמֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: וַיַּעַל
  choice: subiu
  rationale: עלה significa “subir”. A forma concisa mantém o ritmo narrativo e contrasta claramente com “desceu”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta diretamente o tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; “Jeová” reflete uma vocalização tradicional posterior.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa simples. A repetição de “monte” e do nome “Yahweh” acompanha a ênfase do hebraico. Não foram incluídas notas porque “topo do monte” comunica adequadamente o hebraísmo רֹאשׁ הָהָר sem perda relevante.
