reference: Exodus 19:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִגְבַּלְתָּ֤ אֶת הָ/עָם֙ סָבִ֣יב לֵ/אמֹ֔ר הִשָּׁמְר֥וּ לָ/כֶ֛ם עֲל֥וֹת בָּ/הָ֖ר וּ/נְגֹ֣עַ בְּ/קָצֵ֑/הוּ כָּל הַ/נֹּגֵ֥עַ בָּ/הָ֖ר מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: pt
  text: 'Trace limites ao redor do povo[a] e diga: “Tenham cuidado para não subir o monte nem tocar em sua extremidade. Todo aquele que tocar no monte certamente será morto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estabeleça um limite ao redor do povo”.'
    reason: A expressão hebraica pode enfatizar tanto o ato de traçar limites quanto o de estabelecer uma fronteira ao redor do povo.
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: Trace limites
  rationale: O hifil de גבל expressa estabelecer ou demarcar um limite. “Trace limites” comunica de modo natural a delimitação concreta da área proibida.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa aqui os israelitas reunidos como coletividade; “o povo” é a tradução contextual direta.
- source_word: סָבִיב
  choice: ao redor
  rationale: O termo indica o perímetro circundante, em todos os lados.
- source_word: לֵאמֹר
  choice: e diga
  rationale: O infinitivo introduz o conteúdo da ordem; em português, a coordenação com “diga” é mais natural do que o literal “dizendo” neste contexto.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Tenham cuidado
  rationale: A expressão idiomática com o imperativo nifal de שׁמר adverte os ouvintes a se precaverem; “Tenham cuidado” preserva sua força em português corrente.
- source_word: עֲלוֹת בָּהָר
  choice: subir o monte
  rationale: עלה com בָּהָר descreve subir ao monte ou penetrar em sua área elevada. A formulação é clara e idiomática.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: nem tocar em sua extremidade
  rationale: נגע significa “tocar”, e קצהו, “sua extremidade/borda”. “Extremidade” preserva a referência espacial sem confundi-la com o limite demarcado pelo povo.
- source_word: כָּל הַנֹּגֵעַ בָּהָר
  choice: Todo aquele que tocar no monte
  rationale: A construção é genérica e distributiva, abrangendo qualquer pessoa que viole a proibição.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto seguido da forma passiva intensifica a certeza da morte. “Será morto” mantém a voz passiva, e “certamente” representa a ênfase hebraica.
theological_decisions:
- issue: Natureza da pena em מוֹת יוּמָת
  choice: certamente será morto
  alternative: certamente morrerá
  rationale: A forma verbal é passiva e o versículo seguinte descreve a execução imposta pela comunidade. A tradução mantém essa indicação sem especificar aqui o método.
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais no plural. “Monte” segue o uso bíblico corrente; “extremidade” conserva a concretude espacial do hebraico. A fala direta usa aspas tipográficas.
