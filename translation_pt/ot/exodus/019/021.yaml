  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Desça e advirta o povo, para que não forcem passagem até Yahweh para vê-lo[a], e muitos dentre eles caiam[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “olhá-lo”. O verbo hebraico pode significar tanto “ver” como “olhar”; aqui se refere à tentativa de contemplar a manifestação de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e muitos dentre eles caiam”. Neste contexto, “cair” pode implicar morte, mas o hebraico não o declara de modo mais explícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רֵד
  choice: Desça
  rationale: Imperativo de ירד; é uma forma natural e direta de conservar o movimento do monte para baixo.
- source_word: הָעֵד בָּעָם
  choice: advirta o povo
  rationale: O hifil de עוד, neste contexto, indica uma advertência solene dirigida ao povo.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz uma consequência que a advertência pretende evitar; a construção é corrente e clara em português.
- source_word: יֶהֶרְסוּ אֶל־יְהוָה
  choice: atravesse os limites em direção a Yahweh
  rationale: הרס descreve aqui a violação dos limites estabelecidos ao redor do monte. A expressão explicita naturalmente em português o limite pressuposto pelo contexto, sem sugerir dano físico ao próprio Yahweh.
- source_word: לִרְאוֹת
  choice: a fim de vê-lo
  rationale: O infinitivo expressa a finalidade da aproximação indevida. 'Ver' conserva o sentido amplo do verbo hebraico ראה.
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: e muitos do povo caiam
  rationale: Mantém o verbo concreto 'cair' e a ideia de que um grande número dentre o povo sofreria a consequência, sem tornar explícita a morte que o contexto pode implicar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza da consequência expressa por וְנָפַל
  choice: caiam
  alternative: morram; pereçam
  rationale: No contexto, a queda provavelmente implica morte sob juízo divino, mas o hebraico não a declara de modo mais explícito; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O singular coletivo em “o povo... atravesse” evita uma alternância desnecessária de número; “muitos do povo” torna claro o referente de מִמֶּנּוּ. As notas preservam a amplitude lexical de ראה e a possível implicação fatal de נפל.
