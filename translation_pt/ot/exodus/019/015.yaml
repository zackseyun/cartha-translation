  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: pt
  text: 'E ele disse ao povo: “Estejam preparados por três dias; não se aproximem de mulher alguma.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não se aproximem de mulher alguma”; neste contexto, é uma instrução eufemística para abster-se de relações sexuais durante o período de preparação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico sem acrescentar uma nuance temporal mais específica.
- source_word: הָעָם
  choice: ao povo
  rationale: Refere-se coletivamente aos israelitas reunidos; “povo” é o equivalente natural neste contexto.
- source_word: הֱיוּ נְכֹנִים
  choice: Estejam preparados
  rationale: A construção com היה e נכון expressa prontidão ou preparação; esta formulação é clara, digna e idiomática.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: durante três dias
  rationale: Mantém o sentido mais direto de um período de preparação de três dias, sem harmonizá-lo silenciosamente com a formulação “para o terceiro dia” do contexto próximo.
- source_word: אַל תִּגְּשׁוּ
  choice: não se aproximem
  rationale: Traduz naturalmente a proibição com אַל e o verbo נגשׁ, preservando a linguagem de aproximação.
- source_word: אֶל אִשָּׁה
  choice: de mulher alguma
  rationale: Conserva no texto principal o eufemismo hebraico, sem explicitar nele a relação sexual; “alguma” torna idiomática em português a proibição de alcance geral.
theological_decisions:
- issue: Se deve explicitar que a proibição diz respeito a relações sexuais durante a preparação ritual
  choice: Manter no texto principal o eufemismo “não se aproximem de mulher alguma”
  alternative: “não tenham relações sexuais com mulher alguma” ou “não se aproximem de suas esposas”
  rationale: O hebraico emprega uma expressão eufemística, não um verbo sexual explícito. Preservá-la mantém a forma e a tensão do texto-fonte, enquanto a nota esclarece seu sentido contextual sem inserir no corpo da tradução uma interpretação mais explícita.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O imperativo plural “estejam” dirige-se ao povo reunido. A formulação mantém a concisão e o eufemismo do hebraico, com esclarecimento em nota.
