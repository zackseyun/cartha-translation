  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: pt
  text: Partiram de Refidim e chegaram ao deserto do Sinai, onde acamparam. Ali Israel acampou diante do monte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente ao monte”. A preposição hebraica pode indicar uma posição diante de algo ou de frente para ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: O verbo נסע, em narrativas de viagem, indica levantar acampamento e seguir caminho. “Partiram” expressa esse movimento de modo natural e conciso.
- source_word: מֵרְפִידִים
  choice: de Refidim
  rationale: O nome próprio רְפִידִים é transliterado na forma portuguesa tradicional; a preposição מִן é traduzida por “de”.
- source_word: וַיָּבֹאוּ
  choice: e chegaram
  rationale: בוא pode significar vir, entrar ou chegar. Com um destino expresso, “chegaram” é a opção mais natural em português.
- source_word: מִדְבַּר סִינַי
  choice: ao deserto do Sinai
  rationale: מִדְבָּר designa uma região desértica ou erma. “Deserto” é claro e corrente em português, e a construção hebraica é representada naturalmente por “do Sinai”.
- source_word: וַיַּחֲנוּ בַּמִּדְבָּר
  choice: onde acamparam
  rationale: חנה significa acampar. O relativo “onde” retoma naturalmente o deserto e evita uma repetição pesada, sem alterar a relação locativa do hebraico.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: Ali Israel acampou
  rationale: A forma verbal singular concorda com Israel como coletivo nacional. “Ali” preserva o destaque locativo de שָׁם.
- source_word: נֶגֶד הָהָר
  choice: diante do monte
  rationale: נֶגֶד indica posição à frente de, perante ou em frente a algo. “Diante do monte” preserva a relação espacial sem especificar em excesso a orientação exata.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “deserto” foi suavizada por meio de “onde”, enquanto a repetição deliberada do verbo “acampar” e a mudança do plural para Israel como coletivo singular foram preservadas. O marcador da nota foi colocado após “monte”, expressão à qual a alternativa lexical se refere.
