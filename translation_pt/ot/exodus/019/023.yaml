base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: pt
  text: 'Moisés disse a Yahweh: “O povo não pode subir ao monte Sinai, pois tu mesmo nos advertiste[a], dizendo: ‘Estabelece limites ao redor do monte e consagra-o’[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos fizeste uma advertência solene”. O verbo hebraico pode indicar uma advertência formal ou um testemunho solene.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Demarca o monte e santifica-o”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא יוּכַל
  choice: não pode
  rationale: O imperfeito de יכל expressa aqui incapacidade diante da restrição já imposta; a forma presente é natural no argumento de Moisés.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: subir ao monte Sinai
  rationale: Preserva o movimento ascendente de עלה e emprega a forma geográfica corrente em português.
- source_word: כִּי אַתָּה
  choice: pois tu mesmo
  rationale: כִּי introduz a razão apresentada por Moisés, e o pronome explícito אַתָּה recebe a ênfase natural de “tu mesmo”.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: nos advertiste
  rationale: Neste contexto, o hifil de עוד comunica uma advertência formal ou solene; “advertiste” mantém esse peso sem soar excessivamente técnico.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: Estabelece limites ao redor do monte
  rationale: O imperativo hifil de גבל ordena a demarcação do monte. O plural “limites” com “ao redor” explicita de modo natural a área vedada.
- source_word: וְקִדַּשְׁתּוֹ
  choice: e consagra-o
  rationale: O piel de קדשׁ indica separar o monte como santo; “consagrar” preserva a dimensão cultual da ordem.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sentido de וְקִדַּשְׁתּוֹ aplicado ao monte
  choice: consagra-o
  alternative: santifica-o; torna-o santo
  rationale: “Consagra-o” expressa que o monte deve ser separado como santo, sem explicar além do que o texto afirma.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O uso de “tu mesmo” conserva a ênfase do pronome hebraico explícito; os imperativos “estabelece” e “consagra” mantêm coerência com essa segunda pessoa. As notas preservam as alternativas lexicais genuínas sem sobrecarregar o texto principal.
