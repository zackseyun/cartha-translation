  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: pt
  text: e estejam prontos para o terceiro dia, porque, no terceiro dia, Yahweh descerá sobre o monte Sinai diante dos olhos de todo o povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: e estejam
  rationale: No contexto de instruções dirigidas a Moisés, a forma verbal tem força injuntiva; o presente do subjuntivo expressa isso com naturalidade em português.
- source_word: נְכֹנִים
  choice: prontos
  rationale: O adjetivo indica preparação ou prontidão para o acontecimento anunciado.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: para o terceiro dia
  rationale: A preposição marca o dia em vista do qual o povo deve estar preparado, sem transformar explicitamente a expressão em prazo final.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da instrução anterior.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Equivalente temporal direto e idiomático.
- source_word: יֵרֵד
  choice: descerá
  rationale: Preserva de modo claro e digno a imagem espacial e teofânica do verbo ירד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Mantém a imagem concreta do hebraico e comunica que a descida ocorrerá visivelmente perante o povo.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Expressa a totalidade da comunidade reunida em português natural.
- source_word: עַל הַר סִינָי
  choice: sobre o monte Sinai
  rationale: Com o verbo 'descer', indica o monte como o lugar sobre o qual Yahweh descerá.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título nem adotar a forma híbrida tradicional.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. A expressão concreta “diante dos olhos de” foi mantida para refletir a vivacidade do hebraico. Não se incluiu a nota da camada inglesa porque seu marcador está ligado a “terceiro dia”, enquanto o conteúdo proposto corresponde a לְעֵינֵי e não apresenta uma alternativa necessária à tradução portuguesa.
