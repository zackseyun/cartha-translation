  naturalness: O registro é claro e digno. “Forçar passagem” é uma expressão moderna e natural que comunica adequadamente a ideia de atravessar indevidamente um limite, sem acrescentar uma barreira explícita.
  terminology: “Yahweh”, “Arão”, “sacerdotes” e “povo” são adequados. “Irrompa contra eles” preserva bem a imagem do juízo súbito e mantém relação imagética com a tentativa de passagem forçada.
