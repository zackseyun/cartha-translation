base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: pt
  text: 'Então Yahweh lhe disse: “Desça e suba, você e Arão com você. Mas os sacerdotes e o povo não devem forçar passagem para subir até Yahweh, para que ele não irrompa contra eles”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não devem romper para subir até Yahweh, para que ele não irrompa contra eles”. O hebraico emprega imagens relacionadas de rompimento tanto para a invasão do povo quanto para o juízo de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: לֶךְ רֵד
  choice: Desça
  rationale: Os dois imperativos formam uma ordem idiomática de partir e descer; em português, “Desça” comunica naturalmente o movimento exigido.
- source_word: וְעָלִיתָ
  choice: e depois suba
  rationale: 'O perfeito assume força injuntiva na sequência de ordens. “Depois” torna clara a sucessão: Moisés deve descer e tornar a subir.'
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: você e Arão com você
  rationale: Mantém tanto a ênfase do pronome explícito quanto a ideia de que Arão acompanhará Moisés.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: os sacerdotes e o povo
  rationale: Equivalência direta e corrente para os dois grupos mencionados.
- source_word: אַל יֶהֶרְסוּ
  choice: não devem romper a barreira
  rationale: O verbo descreve a ruptura de um limite imposto. A explicitação de “a barreira” comunica em português a fronteira do contexto sem apagar a imagem concreta.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: para subir até Yahweh
  rationale: Preserva o movimento vertical e a aproximação da presença divina no monte.
- source_word: פֶּן יִפְרָץ בָּם
  choice: para que ele não irrompa contra eles
  rationale: Preserva a imagem súbita do juízo divino e, com “romper/irromper”, reproduz parcialmente o jogo de imagens entre a invasão humana e a reação de Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Mantém no corpo do texto o nome pessoal presente no hebraico, sem substituí-lo por um título.
- issue: Sujeito de יִפְרָץ
  choice: “ele”, referindo-se a Yahweh
  alternative: 'Forma impessoal: “para que não haja uma irrupção contra eles”'
  rationale: O antecedente imediato e o contexto favorecem Yahweh como agente do juízo, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A colocação “você e Arão com você” conserva deliberadamente a ênfase e a redundância do hebraico. O marcador de nota foi colocado após a frase a que se refere.
