base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: pt
  text: No terceiro dia, ao amanhecer, houve trovões e relâmpagos, uma nuvem densa sobre o monte e um som de trombeta muito forte[a]. Todo o povo que estava no acampamento tremeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um som muito forte de chifre”. O shofar era uma trombeta feita de chifre de animal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: No terceiro dia, ao amanhecer, houve
  rationale: Reproduz com naturalidade a sequência temporal e narrativa hebraica, sem recorrer a uma fórmula portuguesa pesada como “e aconteceu que”.
- source_word: קֹלֹת
  choice: trovões
  rationale: קוֹל pode significar voz ou som, mas, no plural e em paralelo com relâmpagos nesta descrição meteorológica da teofania, refere-se mais provavelmente a trovões.
- source_word: וּבְרָקִים
  choice: e relâmpagos
  rationale: Tradução direta do plural, natural em português.
- source_word: עָנָן כָּבֵד
  choice: uma nuvem densa
  rationale: כָּבֵד significa literalmente “pesada”, mas, aplicado a uma nuvem, “densa” expressa de modo idiomático sua espessura e aspecto carregado.
- source_word: עַל הָהָר
  choice: sobre o monte
  rationale: עַל admite “sobre” ou “no”; “sobre o monte” comunica naturalmente a posição da nuvem sem determinar se ela tocava a superfície.
- source_word: קֹל שֹׁפָר
  choice: um som de trombeta
  rationale: Preserva a referência explícita ao som; שׁוֹפָר designa uma trombeta de chifre, especificidade registrada em nota.
- source_word: חָזָק מְאֹד
  choice: muito forte
  rationale: Mantém de perto o sentido literal de “muito forte”; em português, a expressão pode descrever com naturalidade a grande intensidade de um som.
- source_word: וַיֶּחֱרַד
  choice: tremeu
  rationale: O verbo exprime tremor causado por medo ou profunda agitação, sem exigir que a tradução explicite apenas uma dimensão emocional.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: Todo o povo que estava no acampamento
  rationale: Mantém a oração relativa presente no hebraico em português claro e corrente.
theological_decisions:
- issue: Imagens da manifestação divina no Sinai
  choice: Descrever os fenômenos sensoriais sem acrescentar uma interpretação teológica posterior.
  alternative: Traduzir קֹלֹת como “vozes”, sugerindo vozes celestiais.
  rationale: O contexto, especialmente o paralelismo com os relâmpagos, favorece “trovões”. A tradução conserva o caráter assombroso da cena sem introduzir agentes ou significados que o verso não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção inicial foi condensada para evitar rigidez, e “monte” preserva o registro bíblico corrente. O único marcador de nota, [a], aparece no texto principal.
