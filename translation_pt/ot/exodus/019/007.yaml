base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: pt
  text: Então Moisés veio e convocou os anciãos do povo, e pôs diante deles todas estas palavras que Yahweh lhe havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi
  rationale: בוא pode significar «vir» ou «ir», conforme a perspectiva dêitica. Em português narrativo, «foi» expressa naturalmente o deslocamento de Moisés até os representantes do povo.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: convocou os anciãos do povo
  rationale: קרא com ל pode indicar chamar alguém ou convocá-lo. O contexto mostra que Moisés reuniu os representantes para transmitir a mensagem; «convocou» é claro e idiomático em português.
- source_word: זִקְנֵי הָעָם
  choice: os anciãos do povo
  rationale: זקנים designa os homens mais velhos reconhecidos como representantes da comunidade. «Anciãos» preserva a função social tradicional sem reduzi-la ao sentido genérico de «líderes».
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: pôs diante deles
  rationale: A construção שׂים לפני significa literalmente pôr ou colocar diante de alguém e também funciona naturalmente em português para apresentar palavras à consideração dos ouvintes.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: דברים pode significar «palavras», «assuntos» ou «coisas». Como Moisés transmite a fala divina dos versículos anteriores, «palavras» representa melhor o conteúdo verbal.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: que Yahweh lhe havia ordenado
  rationale: A oração identifica Yahweh como fonte e autoridade da mensagem. «Havia ordenado» deixa clara, de modo natural, a anterioridade da ordem em relação à apresentação aos anciãos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração «Yahweh» preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva a distinção entre o nome próprio de Deus e o título «Senhor», sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a sequência narrativa hebraica sem rigidez excessiva. Não foi acrescentada nota para דברים porque «palavras» é clara no contexto, embora a polissemia tenha sido registrada nas decisões lexicais.
