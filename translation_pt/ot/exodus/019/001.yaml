  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: pt
  text: No terceiro mês depois que os filhos de Israel[a] saíram da terra do Egito, neste mesmo dia[b], eles chegaram ao deserto do Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “neste dia”. A expressão pode enfatizar o dia exato da chegada: “neste mesmo dia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: No terceiro mês
  rationale: חֹדֶשׁ designa normalmente um mês em fórmulas cronológicas; a expressão portuguesa é direta e natural.
- source_word: לְצֵאת
  choice: depois que ... saíram
  rationale: O infinitivo construto com לְ estabelece a saída como referência temporal. A formulação comunica isso com clareza sem tornar a sintaxe excessivamente literal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de maneira transparente a designação hebraica convencional do povo da aliança, enquanto a nota registra a alternativa idiomática.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém אֶרֶץ, “terra”, explicitamente presente no hebraico.
- source_word: בַּיּוֹם הַזֶּה
  choice: neste mesmo dia
  rationale: O demonstrativo הַזֶּה é “este”, e “mesmo” expressa a possível ênfase na exatidão do dia sem eliminar a leitura mais simples, registrada em nota.
- source_word: בָּאוּ
  choice: eles chegaram
  rationale: Embora בוא signifique basicamente “vir/entrar”, neste aviso de itinerário “chegaram” comunica naturalmente a chegada ao destino mencionado.
- source_word: מִדְבַּר סִינָי
  choice: deserto do Sinai
  rationale: מִדְבָּר denota uma região erma ou desértica. “Deserto do Sinai” é claro, corrente e preserva a relação construtiva.
theological_decisions:
- issue: Designação do povo da aliança em בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A expressão masculina plural funciona como designação nacional convencional. A tradução principal mantém a forma do hebraico sem afirmar que apenas homens estavam incluídos; a nota oferece a forma portuguesa idiomática.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem da frase acompanha a progressão cronológica do hebraico, e os pronomes explícitos favorecem a clareza.
