  to: Nenhuma mão deverá tocar nele[a], pois certamente será apedrejado ou certamente será flechado[b]. Seja animal, seja homem, não viverá. Quando o chifre de carneiro emitir um toque prolongado[c], eles poderão subir ao monte.
