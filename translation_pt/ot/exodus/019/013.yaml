source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: pt
  text: Nenhuma mão deverá tocar nele[a], pois certamente será apedrejado ou certamente será flechado[b]. Seja animal, seja homem, não viverá. Quando o chifre de carneiro emitir um toque prolongado[c], eles poderão subir ao monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tocar nisso”, caso o pronome seja entendido de modo mais geral. O sentido é que o transgressor não deve ser tocado diretamente, mas executado à distância.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “perfurado”. O verbo hebraico pode se referir a alguém alvejado, provavelmente por flechas neste contexto.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “quando o yobel for prolongado”; provavelmente se refere a um toque longo em um chifre de carneiro.'
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Nenhuma mão deverá tocar nele
  rationale: Preserva o idioma jurídico impessoal e entende o sufixo masculino singular como referência ao transgressor, que não deve ser tocado diretamente.
- source_word: סָקוֹל יִסָּקֵל
  choice: certamente será apedrejado
  rationale: A construção com infinitivo absoluto intensifica a certeza e a obrigatoriedade da pena.
- source_word: יָרֹה יִיָּרֶה
  choice: morto a flechadas
  rationale: O verbo pode indicar atirar ou alvejar, provavelmente com flechas neste contexto; a formulação explicita em português que se trata de um meio de execução à distância.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Seja animal, seja homem
  rationale: Reproduz de maneira natural a construção distributiva hebraica e mantém o contraste entre animal e ser humano masculino.
- source_word: לֹא יִחְיֶה
  choice: não viverá
  rationale: Mantém a força breve e judicial da declaração hebraica.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: Quando o chifre de carneiro soar prolongadamente
  rationale: Expressa o sentido idiomático de o yobel ser prolongado, provavelmente um toque longo em um chifre de carneiro.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: eles poderão subir ao monte
  rationale: No contexto, o toque prolongado assinala que a proibição anterior foi suspensa; 'poderão' comunica essa permissão em português natural.
theological_decisions:
- issue: Referente do sufixo masculino singular em בּוֹ
  choice: O transgressor que tocou ou ultrapassou o limite do monte
  alternative: Aquilo que se tornou interdito por contato, ou o próprio monte em sentido mais geral
  rationale: A sequência jurídica trata da pessoa ou do animal que ultrapassa o limite e deve ser executado sem contato direto; o referente pessoal se ajusta melhor a essa lógica, sem ocultar a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o tom jurídico e solene, evita arcaísmos desnecessários e mantém em notas as ambiguidades reais do hebraico.
