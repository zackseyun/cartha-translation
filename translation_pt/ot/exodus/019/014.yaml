base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: pt
  text: Então Moisés desceu do monte até o povo, consagrou o povo[a], e eles lavaram as suas roupas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santificou o povo” ou “separou o povo”.
    reason: Alternativas lexicais para וַיְקַדֵּשׁ, que pode expressar consagração, santificação ou separação para uma finalidade sagrada.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: O verbo ירד expressa movimento para baixo; “desceu” é natural em português e corresponde ao deslocamento de Moisés desde o monte.
- source_word: מִן הָהָר
  choice: do monte
  rationale: הַר refere-se ao Sinai no contexto. “Monte” é a designação bíblica corrente e natural em português.
- source_word: אֶל הָעָם
  choice: até o povo
  rationale: עָם significa normalmente “povo”. A preposição אֶל indica o movimento de Moisés em direção ao povo; “até” comunica de modo natural que ele chegou a eles.
- source_word: וַיְקַדֵּשׁ
  choice: consagrou
  rationale: No piel, קדשׁ descreve aqui a preparação ritual do povo para o encontro com Deus. “Consagrou” preserva a ideia de separação para finalidade sagrada sem sugerir necessariamente transformação moral.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém-se a repetição hebraica para conservar clareza e proximidade com a estrutura do texto-fonte.
- source_word: וַיְכַבְּסוּ
  choice: lavaram
  rationale: כבס designa especificamente a lavagem de peças de roupa. “Lavaram” é a equivalência portuguesa direta e natural no contexto.
- source_word: שִׂמְלֹתָם
  choice: as suas roupas
  rationale: שִׂמְלָה designa roupa ou vestimenta. “Roupas” é claro e atual para leitores comuns, sem perder o sentido concreto da preparação ritual.
theological_decisions:
- issue: Linguagem de santidade ritual na preparação para a manifestação no Sinai
  choice: consagrou o povo
  alternative: santificou o povo; separou o povo para Deus
  rationale: O contexto descreve preparação ritual para o encontro com Deus. “Consagrou” conserva o sentido sagrado e cultual, sem resolver a expressão como transformação moral nem importar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Monte” preserva o uso bíblico corrente; “roupas” evita formalidade desnecessária. A coordenação narrativa e a repetição de “o povo” refletem a sequência hebraica.
