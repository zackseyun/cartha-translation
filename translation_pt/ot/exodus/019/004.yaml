base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: pt
  text: Vocês mesmos viram o que fiz ao Egito e os carreguei sobre asas de águias[a][b], e os trouxe até mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre as asas de águias”. A expressão hebraica é uma metáfora vívida de livramento poderoso e protetor.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida por “águias” também pode designar, de modo mais amplo, grandes aves de rapina.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para mim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם
  choice: vocês mesmos
  rationale: O pronome independente enfatiza os destinatários além da informação já expressa na forma verbal; “vocês mesmos” preserva essa ênfase em português atual.
- source_word: רְאִיתֶם
  choice: viram
  rationale: O perfeito hebraico aponta para uma experiência concluída que os israelitas testemunharam. Em português, o pretérito perfeito é a forma mais natural neste contexto.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: o que fiz ao Egito
  rationale: A preposição לְ apresenta o Egito como alvo afetado pelos atos divinos; “ao Egito” conserva tanto esse sentido quanto a referência coletiva à nação.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: Eu os carreguei
  rationale: נשא significa aqui carregar ou levar sustentando. “Carreguei” mantém a imagem concreta de cuidado e livramento.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: sobre asas de águias
  rationale: A expressão forma uma metáfora vívida de livramento poderoso e protetor. “Águias” é a identificação tradicional e contextualmente provável, embora o termo hebraico possa abranger grandes aves de rapina.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: e os trouxe para junto de mim
  rationale: אֵלָי significa literalmente “a mim/para mim”. “Para junto de mim” expressa com naturalidade o movimento em direção a Deus e sua dimensão relacional, sem especificar além do texto a natureza dessa relação.
theological_decisions:
- issue: Força relacional do propósito do livramento
  choice: para junto de mim
  alternative: para mim
  rationale: A formulação comunica que o êxodo conduz o povo à presença de Deus e a uma relação com ele. Ao mesmo tempo, não define de modo denominacional a natureza dessa relação, e a tradução mais literal é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês mesmos” preserva a ênfase hebraica; os pronomes objetos “os” evitam repetição pesada. A divisão em duas frases mantém a progressão retórica e torna a leitura pública mais clara.
