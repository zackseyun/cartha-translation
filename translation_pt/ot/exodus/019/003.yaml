id: EXO.19.3
reference: Exodus 19:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: pt
  text: 'Então Moisés subiu até Deus, e Yahweh o chamou do monte, dizendo: “Assim você dirá à casa de Jacó e anunciará aos filhos de Israel[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Israel” ou “povo de Israel”. O hebraico diz literalmente “filhos de Israel”, expressão coletiva masculina.
    reason: Alternativa lexical e esclarecimento do sentido coletivo da expressão hebraica.
lexical_decisions:
- source_word: עָלָה
  choice: subiu
  rationale: Preserva de modo natural o movimento para cima indicado pelo verbo no contexto do monte.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora o hebraico tenha artigo, “Deus” é a forma idiomática em português para a referência definida ao Deus de Israel.
- source_word: וַיִּקְרָא אֵלָיו
  choice: o chamou
  rationale: Expressa com clareza que Yahweh dirigiu o chamado a Moisés; o contexto e a expressão “do monte” preservam a ideia de chamar em sua direção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מִן הָהָר
  choice: do monte
  rationale: הַר designa aqui o monte Sinai; “monte” é a forma natural e tradicional em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente a fala divina e mantém a estrutura do hebraico.
- source_word: כֹּה תֹאמַר
  choice: Assim você dirá
  rationale: Conserva a fórmula solene de transmissão da mensagem, com sintaxe atual e acessível.
- source_word: לְבֵית יַעֲקֹב
  choice: à casa de Jacó
  rationale: Mantém a imagem coletiva e pactual da “casa” de Jacó.
- source_word: וְתַגֵּיד
  choice: e anunciará
  rationale: O Hifil de נגד comunica declarar ou dar a conhecer; “anunciará” preserva essa força e o paralelismo com “dirá”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Reproduz a expressão coletiva masculina do hebraico e preserva o paralelo com “casa de Jacó”; a nota esclarece alternativas coletivas naturais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Expressão coletiva לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: descendentes de Israel; povo de Israel
  rationale: A escolha mantém a forma masculina e genealógica da expressão hebraica sem negar seu alcance coletivo; a ambiguidade de referência é explicitada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O uso de “você” evita uma alternância regionalmente marcada de formas de segunda pessoa, enquanto o futuro mantém o tom formal da comissão divina. O marcador da nota foi colocado junto a “filhos de Israel”, expressão à qual a nota efetivamente se refere.
