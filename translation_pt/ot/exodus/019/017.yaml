  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: pt
  text: Então Moisés fez o povo sair do acampamento para encontrar-se com Deus, e eles tomaram posição ao pé do monte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: fez o povo sair
  rationale: 'O hifil de יצא é causativo: Moisés fez com que o povo saísse. Esta formulação preserva essa força sem acrescentar a ideia específica de condução.'
- source_word: לִקְרַאת
  choice: para encontrar-se com
  rationale: A expressão indica movimento em direção a um encontro; a forma pronominal é natural em português e mantém a reciprocidade própria do contexto.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora o hebraico tenha artigo, neste contexto a referência definida é ao Deus de Israel; em português, «Deus» é a forma natural.
- source_word: מִן הַמַּחֲנֶה
  choice: do acampamento
  rationale: Marca o lugar de onde o povo saiu. Com «fez ... sair», a preposição «de» expressa naturalmente a origem e a saída.
- source_word: וַיִּתְיַצְּבוּ
  choice: tomaram posição
  rationale: O hitpael de יצב sugere assumir deliberadamente um lugar ou postura, sentido mais preciso do que o simples «ficaram em pé».
- source_word: בְּתַחְתִּית הָהָר
  choice: ao pé do monte
  rationale: No contexto topográfico, תַּחְתִּית designa a parte inferior ou base do monte. «Ao pé do monte» é idiomático e evita sugerir que estavam literalmente debaixo dele.
theological_decisions:
- issue: Tradução de הָאֱלֹהִים na teofania do Sinai
  choice: Deus
  alternative: o Deus
  rationale: «Deus» identifica naturalmente em português o Deus de Israel neste contexto. «O Deus» seria marcado e exigiria complemento ou contraste não expresso no versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A estrutura narrativa foi mantida sem arcaísmos. Não se incluiu nota, pois «ao pé do monte» comunica adequadamente o valor contextual de בְּתַחְתִּית; a nota inglesa fornecida parece estar associada por engano ao marcador depois de «God».
