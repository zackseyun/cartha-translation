  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Eis que venho até você numa nuvem espessa, para que o povo ouça quando eu falar com você e também confie em você[a] para sempre”. Então Moisés relatou a Yahweh as palavras do povo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “creia em você”. O hebraico pode expressar confiança em Moisés como porta-voz confirmado por Deus.
    reason: alternativa lexical
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a força dêitica e solene do marcador hebraico em uma forma portuguesa reconhecível e digna.
- source_word: בָּא אֵלֶיךָ
  choice: venho até você
  rationale: O particípio apresenta a vinda como iminente e vívida; “até você” expressa naturalmente a direção indicada pela preposição.
- source_word: בְּעַב הֶעָנָן
  choice: numa nuvem espessa
  rationale: Reproduz a imagem de uma nuvem densa em português corrente.
- source_word: בַּעֲבוּר
  choice: para que
  rationale: Introduz adequadamente a finalidade da manifestação divina.
- source_word: יִשְׁמַע הָעָם
  choice: o povo ouça
  rationale: O subjuntivo português corresponde à oração de finalidade e mantém o sentido de percepção auditiva.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: quando eu falar com você
  rationale: Expressa de modo natural o valor temporal do infinitivo hebraico e preserva a ideia de Deus falar com Moisés.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: e também confie em você
  rationale: O hifil de אמן com ב pode indicar confiança ou fé depositada numa pessoa. “Confiar em você” é natural em português e apresenta Moisés como porta-voz confirmado por Deus sem acrescentar a ideia de culto.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Transmite de maneira clara a duração permanente ou indefinidamente duradoura expressa pelo hebraico.
- source_word: וַיַּגֵּד
  choice: Então Moisés relatou
  rationale: Faz avançar a narrativa e comunica precisamente o ato de transmitir a fala do povo.
- source_word: דִּבְרֵי הָעָם
  choice: as palavras do povo
  rationale: Mantém o substantivo “palavras” do hebraico sem tornar a frase artificial em português.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido de בְּךָ יַאֲמִינוּ com referência a Moisés
  choice: confiem em você
  alternative: creiam em você
  rationale: A construção admite tanto linguagem de crença quanto de confiança. No contexto, ela autentica Moisés como porta-voz de Deus; a tradução escolhida preserva essa confiança sem sugerir que Moisés seja objeto de adoração.
- issue: Alcance temporal de לְעוֹלָם
  choice: para sempre
  alternative: por todo o tempo
  rationale: Mantém a formulação ampla do hebraico sem limitar antecipadamente seu alcance teológico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a solenidade do discurso divino; “você” evita regionalismo excessivo e corresponde ao singular dirigido a Moisés.
