base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Vá ao povo e consagre-os[a] hoje e amanhã; que eles lavem suas roupas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santifique-os” ou “separe-os para a santidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então” expressa essa sequência de modo natural em português.
- source_word: לֵךְ אֶל־הָעָם
  choice: Vá ao povo
  rationale: Reproduz de maneira direta o imperativo e o referente coletivo de עָם.
- source_word: וְקִדַּשְׁתָּם
  choice: e consagre-os
  rationale: “Consagrar” conserva o sentido ritual e sacro do piel de קדשׁ neste contexto. O pronome plural reflete o sufixo hebraico, que considera os integrantes do povo.
- source_word: הַיּוֹם וּמָחָר
  choice: hoje e amanhã
  rationale: Expressão temporal simples e precisa para os dois dias de preparação.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: que eles lavem suas roupas
  rationale: O plural identifica o povo como agente da lavagem. “Roupas” é atual e abrangente para שִׂמְלֹת, sem restringir o termo a um tipo específico de veste.
theological_decisions:
- issue: Sentido ritual de קדשׁ
  choice: consagre-os
  alternative: santifique-os; separe-os como santos
  rationale: O contexto é a preparação do povo para o encontro divino no Sinai. “Consagrar” mantém a dimensão ritual e pactual sem reduzir a ação a transformação moral interior nem impor categorias doutrinárias posteriores.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; Jeová; SENHOR
  rationale: A forma escolhida preserva o nome pessoal expresso no hebraico, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “consagre-os” mantém o plural do hebraico, embora “povo” seja coletivamente singular em português; “que eles lavem” torna explícita a mudança para a ação que cabe aos integrantes do povo.
