base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: pt
  text: 'E todo o povo respondeu em conjunto: “Faremos tudo o que Yahweh disse”. Então Moisés levou a Yahweh as palavras do povo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “transmitiu a Yahweh as palavras do povo”.'
    reason: Alternativa lexical para וַיָּשֶׁב, que neste contexto pode significar levar de volta ou relatar/transmitir.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: respondeu
  rationale: ענה, neste contexto narrativo e seguido de discurso direto, indica uma resposta verbal; o singular concorda naturalmente em português com o coletivo “todo o povo”.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Preserva o sentido coletivo e abrangente da expressão hebraica em português natural.
- source_word: יַחְדָּו
  choice: em conjunto
  rationale: Expressa a unidade da resposta coletiva sem sugerir necessariamente que todos pronunciaram as palavras de modo simultâneo.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: tudo o que ... disse
  rationale: É uma formulação corrente e fiel para a totalidade do que havia sido falado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: נַעֲשֶׂה
  choice: faremos
  rationale: Conserva o sentido direto de עשה, “fazer”, evitando explicitar interpretativamente “obedecer”.
- source_word: וַיָּשֶׁב
  choice: levou
  rationale: O hifil de שוב comunica aqui que Moisés levou de volta ou transmitiu a resposta; “levou” preserva a direção do movimento verbal e soa natural no contexto.
- source_word: דִּבְרֵי הָעָם
  choice: as palavras do povo
  rationale: Mantém o substantivo concreto “palavras”, sem substituí-lo pelo interpretativo “resposta”.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: 'Representa a direção indicada por אֶל: Moisés leva as palavras a Yahweh.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Possível explicitação de obediência em נַעֲשֶׂה
  choice: faremos
  alternative: obedeceremos
  rationale: Embora o contexto de aliança envolva obediência, o verbo hebraico diz literalmente “fazer”; a tradução evita resolver a implicação por meio de uma paráfrase.
- issue: Sentido de וַיָּשֶׁב aplicado às palavras
  choice: levou ... as palavras
  alternative: transmitiu/relatou ... as palavras
  rationale: A forma causativa pode evocar levar de volta e, no contexto, relatar. O texto principal mantém a imagem verbal; a nota registra a alternativa sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, e o discurso direto dispensa um “e disse” redundante em português. O marcador [a] aparece após a oração correspondente à alternativa lexical.
