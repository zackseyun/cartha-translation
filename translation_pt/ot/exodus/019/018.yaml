  naturalness: O texto é claro, moderno e de registro apropriado. A revisão preserva essa fluidez, usando uma única frase coordenada, como no hebraico, sem a repetição inicial desnecessariamente destacada por uma nova frase.
  terminology: '"Yahweh", "em fogo", "fumaça" e "fornalha" são escolhas adequadas. A alternativa "forno" preserva de modo simples a possibilidade lexical de כִּבְשָׁן, sem especificar um tipo de forno que o hebraico não determina.'
  issues:
