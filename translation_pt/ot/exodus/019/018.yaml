  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: pt
  text: O monte Sinai estava todo coberto de fumaça, porque Yahweh havia descido sobre ele em fogo, e sua fumaça subiu como a fumaça de uma fornalha[a], e todo o monte tremeu violentamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como a fumaça de um forno”.'
    reason: Alternativa lexical para כִּבְשָׁן, que pode designar uma fornalha ou um forno.
lexical_decisions:
- source_word: וְהַר סִינַי עָשַׁן כֻּלּוֹ
  choice: Todo o monte Sinai estava coberto de fumaça
  rationale: Expressa naturalmente em português que o monte inteiro estava envolto em fumaça, preservando o valor abrangente de כֻּלּוֹ.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: porque
  rationale: A locução introduz claramente a causa da fumaça.
- source_word: יָרַד עָלָיו יְהוָה בָּאֵשׁ
  choice: Yahweh havia descido sobre ele em fogo
  rationale: O mais-que-perfeito explicita a anterioridade dentro da oração causal; 'em fogo' preserva o modo ou a manifestação da descida, sem definir além do texto.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: e a fumaça subia
  rationale: Traduz o movimento ascendente de עלה; a repetição de 'fumaça' é clara e evita ambiguidade pronominal em português.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: como a fumaça de uma fornalha
  rationale: כִּבְשָׁן pode indicar fornalha ou forno; 'fornalha' comunica de modo imediato a imagem de calor intenso e grande volume de fumaça.
- source_word: וַיֶּחֱרַד כָּל־הָהָר מְאֹד
  choice: Todo o monte tremia violentamente
  rationale: '''Tremia'' preserva o sentido físico de חרד, enquanto ''violentamente'' transmite de forma idiomática a forte intensificação de מְאֹד.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal sem o substituir pelo título tradicional.
- issue: Natureza da descida divina בָּאֵשׁ
  choice: em fogo
  alternative: com fogo; como fogo
  rationale: A tradução mantém a formulação concreta e sua possível amplitude modal ou manifestacional, sem decidir que Yahweh fosse identificado ontologicamente com o fogo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação hebraica foi dividida em duas frases para evitar uma sequência excessivamente longa. O marcador [a] aparece no texto principal junto à expressão anotada.
