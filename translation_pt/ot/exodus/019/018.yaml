    rationale: '"A fumaça subia" e "o monte tremia" apresentam a ação como durativa/imperfeita. Os wayyiqtol וַיַּעַל e וַיֶּחֱרַד fazem avançar a narrativa e são mais diretamente traduzidos por "subiu" e "tremeu".'
