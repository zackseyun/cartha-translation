  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: pt
  text: E vocês serão para mim um reino de sacerdotes e uma nação santa.[a] Estas são as palavras que você dirá aos filhos de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um reino sacerdotal”. A expressão hebraica pode indicar um reino composto de sacerdotes ou um reino marcado por caráter sacerdotal. Compare 1 Pedro 2:9, que emprega a expressão relacionada “sacerdócio real”.
    reason: lexical_alternative
  - marker: b
    text: “Os filhos de Israel” é a expressão hebraica para o povo de Israel como um todo, não apenas para os israelitas do sexo masculino.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: vocês serão
  rationale: O imperfeito qal de היה expressa aqui o futuro ou resultado da declaração da aliança. “Serão” preserva sua força solene sem transformá-la explicitamente em ordem.
- source_word: לִי
  choice: para mim
  rationale: A preposição ל com o sufixo da primeira pessoa indica relação, pertença ou finalidade; “para mim” mantém de modo natural a orientação da aliança.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: um reino de sacerdotes
  rationale: A construção nominal significa mais diretamente “reino de sacerdotes” e mantém a ambiguidade entre um reino composto de sacerdotes e um reino de caráter sacerdotal.
- source_word: גּוֹי קָדוֹשׁ
  choice: uma nação santa
  rationale: Tradução direta que preserva a ressonância pactual e teológica de קָדוֹשׁ.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Estas são as palavras
  rationale: דְּבָרִים designa naturalmente “palavras” neste contexto de fala, e a formulação conserva o tom solene do hebraico.
- source_word: תְּדַבֵּר
  choice: você dirá
  rationale: O verbo está na segunda pessoa masculina singular e se dirige a Moisés. “Dirá” é idiomático em português e preserva a força futura-diretiva do imperfeito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: A expressão hebraica é literalmente filial e masculina em sua forma. A tradução a conserva, enquanto a nota esclarece que seu referente é o povo inteiro.
theological_decisions:
- issue: Identidade coletiva de Israel em sua vocação na aliança
  choice: um reino de sacerdotes
  alternative: um reino sacerdotal; um sacerdócio real
  rationale: A opção principal segue de perto a construção hebraica e não introduz no texto de Êxodo a formulação da recepção posterior. A nota preserva a possível leitura de caráter sacerdotal.
- issue: Designação coletiva de Israel com forma masculina
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução mantém a forma filial do hebraico sem sugerir que apenas homens estejam incluídos; a abrangência coletiva é explicitada em nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural “vocês” representa o destinatário coletivo no início do versículo; o singular “você” representa Moisés na ordem final. A construção “reino de sacerdotes” preserva a forma e a ambiguidade genuína do hebraico.
