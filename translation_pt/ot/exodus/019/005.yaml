  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: pt
  text: E agora, se de fato ouvirem a minha voz e guardarem a minha aliança, vocês serão a minha propriedade preciosa dentre todos os povos[a], pois toda a terra é minha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “minha propriedade especial entre todos os povos”. A expressão hebraica designa um bem particularmente valorizado e pertencente ao seu dono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que liga o versículo ao contexto anterior quanto o valor temporal do advérbio.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: se de fato ouvirem a minha voz
  rationale: A construção hebraica com infinitivo absoluto intensifica o verbo. A formulação conserva a imagem concreta de ouvir, ao mesmo tempo que 'de fato' comunica a ênfase e o contexto sugere atenção obediente.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: e guardarem a minha aliança
  rationale: '''Guardar'' expressa a observância fiel exigida no contexto da aliança e mantém uma formulação bíblica natural em português.'
- source_word: וִהְיִיתֶם לִי סְגֻלָּה
  choice: vocês serão a minha propriedade preciosa
  rationale: סְגֻלָּה designa um bem especialmente pertencente e valorizado. 'Propriedade preciosa' comunica simultaneamente pertencimento e valor sem reduzir a expressão a mero afeto.
- source_word: מִכָּל הָעַמִּים
  choice: dentre todos os povos
  rationale: O מן indica seleção de entre os povos. 'Dentre' expressa a distinção de Israel sem sugerir que os demais estejam fora do domínio de Deus.
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: pois toda a terra é minha
  rationale: כִּי introduz a razão que fundamenta a afirmação anterior, e הָאָרֶץ tem aqui alcance universal em paralelo com 'todos os povos'.
theological_decisions:
- issue: Se שׁמע deve ser explicitado como obediência
  choice: ouvirem a minha voz
  alternative: obedecerem à minha voz / me obedecerem
  rationale: O idioma hebraico envolve escuta obediente, mas a tradução principal preserva a imagem auditiva e deixa que 'guardarem a minha aliança' torne explícita a dimensão prática da obediência.
- issue: Como expressar a condição especial de Israel sem negar o domínio universal de Deus
  choice: a minha propriedade preciosa dentre todos os povos
  alternative: a minha propriedade especial acima de todos os povos
  rationale: '''Dentre'' representa melhor a seleção de entre os povos e evita transformar a frase em uma classificação absoluta; a oração seguinte mantém em tensão a eleição particular e a posse divina de toda a terra.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se 'vocês' para a segunda pessoa do plural e mantiveram-se as imagens pactuais concretas do hebraico.
