  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: pt
  text: E o som da trombeta ficava cada vez mais forte[a]. Moisés falava, e Deus lhe respondia com uma voz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficava cada vez mais alto”. O hebraico descreve literalmente o som da trombeta como “indo e tornando-se muito forte”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “lhe respondia por meio do trovão” ou “lhe respondia de modo audível”. O hebraico diz: “com uma voz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... ficava
  rationale: A construção narrativa introduz o desenvolvimento da cena e, combinada com o particípio seguinte, é expressa naturalmente em português pelo valor progressivo de “ficava”.
- source_word: קוֹל הַשּׁוֹפָר
  choice: o som da trombeta
  rationale: קוֹל pode significar “som” ou “voz”; com שׁוֹפָר, “som” é a opção mais idiomática. “Trombeta” comunica com clareza o instrumento de sopro feito de chifre, sem tornar a frase pesada.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: ficava cada vez mais forte
  rationale: A sequência descreve intensificação contínua. “Cada vez mais forte” preserva a imagem hebraica de aumento de força sem restringi-la necessariamente ao volume.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Moisés falava
  rationale: O imperfeito apresenta ação em curso ou reiterada na cena. O pretérito imperfeito português preserva essa abertura aspectual com naturalidade.
- source_word: יַעֲנֶנּוּ
  choice: lhe respondia
  rationale: O imperfeito corresponde à ação em curso ou reiterada de Moisés; “lhe” representa o sufixo pronominal “a ele”.
- source_word: בְקוֹל
  choice: com uma voz
  rationale: A tradução mantém a formulação ampla do hebraico, que diz literalmente “com/em uma voz”, sem decidir que se tratava especificamente de trovão.
theological_decisions:
- issue: Natureza da resposta de Deus no Sinai
  choice: Deus lhe respondia “com uma voz”
  alternative: Deus lhe respondia “em meio ao trovão” ou “de modo audível”
  rationale: בְקוֹל permite a ideia de voz ou som, mas não especifica trovão. A tradução principal conserva a tensão e a formulação do texto, enquanto a nota registra interpretações possíveis.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pretérito imperfeito comunica o caráter contínuo ou reiterado das ações. As notas mantêm alternativas legítimas sem sobrecarregar o texto principal.
