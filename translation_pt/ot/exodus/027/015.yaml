base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: pt
  text: Para o segundo lado, haverá quinze côvados de cortinas[a], com três colunas e três bases[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “quinze”; “côvados” está subentendido pelo versículo anterior.
    reason: textual_ellipsis
  - marker: b
    text: Ou “encaixes”. O termo hebraico se refere às peças de fundação nas quais as colunas eram fixadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף
  choice: Para o ... lado
  rationale: Embora כָּתֵף signifique literalmente “ombro”, neste contexto arquitetônico designa o lado ou flanco do pátio. “Para o ... lado” expressa naturalmente a distribuição especificada.
- source_word: הַ/שֵּׁנִית
  choice: segundo
  rationale: Tradução direta do ordinal hebraico; no contexto, trata-se do lado correspondente ao mencionado anteriormente.
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: quinze côvados
  rationale: O hebraico traz apenas “quinze”, mas a unidade “côvados” está elíptica e é claramente recuperada da construção paralela do versículo anterior. Explicitá-la evita interpretar o número como quantidade de cortinas.
- source_word: קְלָעִים
  choice: cortinas
  rationale: No pátio do tabernáculo, o termo designa as peças de tecido que formavam a delimitação. “Cortinas” é claro e corrente em português.
- source_word: עַמֻּדֵי/הֶם
  choice: três colunas
  rationale: עַמּוּד designa os suportes verticais da estrutura. “Colunas” é natural e preciso; a relação possessiva é suficientemente indicada pelo contexto da construção.
- source_word: וְ/אַדְנֵי/הֶם
  choice: e três bases
  rationale: אֶדֶן designa as peças de fundação ou encaixe nas quais as colunas eram fixadas. “Bases” é a opção mais clara em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia arquitetônica acessível. A construção verbal “haverá” torna natural em português a frase nominal hebraica sem alterar seu caráter prescritivo.
