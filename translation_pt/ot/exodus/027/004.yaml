  text: וְ/עָשִׂ֤יתָ לּ/וֹ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת וְ/עָשִׂ֣יתָ עַל הָ/רֶ֗שֶׁת אַרְבַּע֙ טַבְּעֹ֣ת נְחֹ֔שֶׁת עַ֖ל אַרְבַּ֥ע קְצוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: pt
  text: Faça para ele uma grelha[a] de bronze, em forma de rede, e faça sobre a rede quatro argolas de bronze, nas suas quatro extremidades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grade”. O hebraico diz literalmente “uma grelha, obra de rede, de bronze”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nos seus quatro cantos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: grelha
  rationale: Designa uma estrutura vazada associada ao altar. “Grelha” é natural em português e se ajusta ao objeto descrito.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: em forma de rede
  rationale: A expressão significa literalmente “obra de rede”. Esta formulação comunica a construção reticulada com clareza e permite retomar רֶשֶׁת como “rede” na oração seguinte.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos utensílios do santuário, “bronze” é a tradução contextual tradicional e adequada, embora o termo hebraico também possa abranger cobre e suas ligas.
- source_word: עַל הָרֶשֶׁת
  choice: sobre a rede
  rationale: A preposição עַל indica aqui a posição das argolas em relação à estrutura reticulada; “sobre” preserva o sentido espacial e a repetição lexical de רֶשֶׁת.
- source_word: טַבְּעֹת
  choice: argolas
  rationale: O substantivo designa anéis ou argolas usados como pontos de fixação nos utensílios do santuário. “Argolas” é claro e idiomático neste contexto.
- source_word: קְצוֹתָיו
  choice: suas quatro extremidades
  rationale: O termo significa literalmente extremidades ou pontas. “Extremidades” preserva essa amplitude sem pressupor além do hebraico que se trate especificamente de cantos.
- source_word: לּוֹ
  choice: para ele
  rationale: O pronome retoma o altar, substantivo masculino em português; por isso, “para ele” é a referência gramatical natural.
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: A forma verbal prossegue a sequência de instruções dirigidas a Moisés. O imperativo “Faça” expressa essa força de maneira natural no português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais. A redação mantém a imagem da rede e sua repetição no hebraico, ao mesmo tempo que evita uma sequência excessivamente literal e pouco idiomática.
