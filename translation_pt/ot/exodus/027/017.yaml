base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: pt
  text: Todas as colunas ao redor do pátio serão revestidas com faixas de prata[a]; seus ganchos serão de prata, e suas bases, de bronze[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “unidas por barras de prata”. O termo hebraico pode se referir a faixas ou a peças de ligação de prata nas colunas.
    reason: lexical_alternative
  - marker: b
    text: Ou “encaixes”. O termo hebraico pode designar as bases metálicas nas quais as colunas eram assentadas.
    reason: lexical_alternative
  - marker: c
    text: “Bronze” também pode ser traduzido por “cobre”, pois o termo hebraico pode abranger o cobre e ligas de cobre no uso antigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי
  choice: Todas as colunas
  rationale: Expressa a totalidade das estruturas verticais; “colunas” é natural e adequado ao contexto arquitetônico do santuário.
- source_word: הֶחָצֵר סָבִיב
  choice: ao redor do pátio
  rationale: חָצֵר designa a área externa cercada, e סָבִיב indica todos os seus lados.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: revestidas com faixas de prata
  rationale: O particípio passivo descreve as colunas providas de trabalho de prata em forma de faixas ou peças de ligação; esta formulação mantém a imagem sem recorrer a vocabulário arcaico.
- source_word: וָוֵיהֶם
  choice: seus ganchos
  rationale: No contexto do tabernáculo, וָוִים são os acessórios usados para prender ou sustentar as cortinas.
- source_word: אַדְנֵיהֶם
  choice: suas bases
  rationale: Designa os suportes metálicos nos quais as colunas eram assentadas; “bases” é claro, enquanto “encaixes” permanece possível.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: É a tradução convencional no contexto dos metais do tabernáculo, embora o termo hebraico possa abranger cobre ou uma liga de cobre.
