  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: pt
  text: Faça o altar de madeira de acácia, com cinco côvados de comprimento e cinco côvados de largura. O altar será quadrado e terá três côvados de altura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com conjunção, neste contexto de instruções, tem força diretiva. O imperativo comunica essa ordem com naturalidade em português.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente corrente de מִזְבֵּחַ; o artigo definido hebraico foi preservado.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A construção indica o material. “Madeira de acácia” é clara e atual, ao contrário de uma transliteração tradicional do nome hebraico.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: cinco côvados de comprimento
  rationale: Reproduz de modo idiomático a medida longitudinal e conserva a unidade antiga.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: cinco côvados de largura
  rationale: Mantém o paralelismo das dimensões em português natural.
- source_word: רָבוּעַ יִהְיֶה
  choice: será quadrado
  rationale: רָבוּעַ descreve a forma quadrada; “quadrado” é o equivalente moderno mais direto.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: terá três côvados de altura
  rationale: Expressa naturalmente a altura indicada por קֹמָה e preserva o referente do sufixo possessivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservou-se “côvado” como unidade textual antiga, sem inserir no corpo do versículo uma conversão aproximada. A nota da camada inglesa foi omitida porque seu marcador aparece após “acacia wood”, mas o conteúdo trata de “foursquare”; além disso, “quadrado” transmite diretamente o sentido hebraico sem exigir nota.
