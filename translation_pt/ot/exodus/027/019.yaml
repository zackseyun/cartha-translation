base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: pt
  text: Todos os utensílios do tabernáculo, para todo o seu serviço, bem como todas as suas estacas e todas as estacas do pátio, serão de bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”; o termo hebraico pode designar de modo amplo um metal à base de cobre.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: utensílios
  rationale: Termo amplo e natural para os objetos e instrumentos empregados no serviço do tabernáculo, sem restringi-los ao mobiliário.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Designação consagrada e clara, em português bíblico moderno, para a habitação sagrada móvel.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: usados em todo o seu serviço
  rationale: Expressa naturalmente a relação funcional indicada pela preposição e por עֲבֹדָה, sem limitar o termo a um rito específico.
- source_word: יְתֵדֹתָיו
  choice: suas estacas
  rationale: יָתֵד designa as estacas que fixavam a estrutura; 'estacas' é claro e idiomático em português.
- source_word: יִתְדֹת הֶחָצֵר
  choice: as estacas do pátio
  rationale: חָצֵר refere-se aqui à área cercada ao redor do tabernáculo; 'pátio' é corrente e compreensível.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo hebraico pode designar cobre ou uma liga à base de cobre; 'bronze' é a tradução convencional e contextualmente adequada nas listas de materiais do tabernáculo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura fluente no Brasil, sem regionalismos marcados. A repetição de 'estacas' preserva a distinção explícita entre as do tabernáculo e as do pátio.
