  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ תִּהְיֶ֣יןָ קַרְנֹתָ֑י/ו וְ/צִפִּיתָ֥ אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: pt
  text: Faça chifres nos quatro cantos do altar; os chifres formarão uma só peça com ele[a]. Revista o altar de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “os seus chifres procederão dele”, isto é, serão feitos como parte integrante do altar, e não fixados separadamente.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico neḥóshet pode designar bronze ou cobre; aqui, “bronze” é o sentido mais provável no contexto de construção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal com waw, nesta sequência de instruções, tem força diretiva. O imperativo em português comunica essa função de modo natural e claro.
- source_word: קַרְנֹתָיו
  choice: chifres
  rationale: קֶרֶן significa literalmente “chifre” e, neste contexto, designa as projeções em forma de chifre do altar. A escolha preserva a imagem concreta do hebraico.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: nos quatro cantos do altar
  rationale: עַל pode significar “sobre” ou “em”; “nos quatro cantos” é idiomático em português. A explicitação de “do altar” evita uma sequência pouco natural de pronomes sem acrescentar conteúdo novo.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: os chifres formarão uma só peça com ele
  rationale: A expressão significa literalmente que os chifres procederão “dele”. Em linguagem de construção, indica que serão parte integrante do altar, e não peças fixadas separadamente.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: Revista o altar
  rationale: O piel de צפה indica cobrir ou revestir um objeto com determinado material. “Revestir” é preciso e corrente em português; repetir “o altar” dá clareza ao referente.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze. “Bronze” é a opção mais provável neste contexto de fabricação e preserva o uso tradicional sem ocultar a alternativa lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa natural para instruções de construção. Os referentes pronominais foram explicitados quando necessário para evitar ambiguidade em português, e a repetição de “altar” mantém a leitura fluida.
