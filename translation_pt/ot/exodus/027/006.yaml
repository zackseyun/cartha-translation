  text: וְ/עָשִׂ֤יתָ בַדִּים֙ לַ/מִּזְבֵּ֔חַ בַּדֵּ֖י עֲצֵ֣י שִׁטִּ֑ים וְ/צִפִּיתָ֥ אֹתָ֖/ם נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: pt
  text: Faça varas para o altar, varas de madeira de acácia, e revista-as de bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: cobre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: O perfeito qal na 2ª pessoa masculina singular, com conjunção prefixada e em contexto instrutivo, tem força diretiva. O imperativo em português expressa essa ordem de modo natural e claro.
- source_word: בַדִּים / בַּדֵּי
  choice: varas
  rationale: O substantivo designa as peças alongadas usadas para transportar o altar. “Varas” é corrente e adequado ao contexto, sem sugerir travessas estruturais.
- source_word: לַמִּזְבֵּחַ
  choice: para o altar
  rationale: Traduz diretamente a expressão hebraica, sem acrescentar a identificação contextual “dos holocaustos”, ausente neste versículo.
- source_word: עֲצֵי שִׁטִּים
  choice: madeira de acácia
  rationale: É a identificação moderna usual e inteligível do material, preferível a uma transliteração pouco clara.
- source_word: וְצִפִּיתָ
  choice: revista
  rationale: No contexto da fabricação dos utensílios do santuário, o piel de צפה indica cobrir ou revestir com metal. “Revista” preserva o sentido artesanal sem especificar uma técnica moderna.
- source_word: אֹתָם
  choice: -as
  rationale: O pronome retoma “varas”; em português, o pronome oblíquo feminino plural torna essa referência explícita e natural.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: “Bronze” é a tradução tradicional e contextualmente provável para o metal empregado nos utensílios do tabernáculo, embora “cobre” também seja lexicalmente possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa natural. A repetição de “varas” preserva a ênfase e a estrutura explicativa do hebraico. O marcador de nota foi colocado imediatamente após “bronze”, termo ao qual se refere.
