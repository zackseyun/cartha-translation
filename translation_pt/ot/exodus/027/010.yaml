translation:
  language: pt
  text: com suas vinte colunas e as suas vinte bases de bronze[a]; os ganchos das colunas e suas faixas[b] serão de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «encaixes», isto é, os suportes das colunas.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por «faixas» é incerto; versões tradicionais frequentemente trazem «frisos».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: suas vinte colunas
  rationale: עַמּוּד designa uma coluna ou pilar. O sufixo masculino singular retoma o lado ou conjunto de cortinas do versículo anterior; «suas vinte colunas» preserva essa ligação com naturalidade.
- source_word: אַדְנֵיהֶם
  choice: suas vinte bases
  rationale: אֶדֶן, no contexto do tabernáculo, designa o suporte inferior em que se assentam elementos estruturais. «Bases» é claro em português corrente; «encaixes» é uma alternativa possível.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode referir-se a cobre ou bronze. «Bronze» é a designação convencional e provável neste contexto de utensílios e estruturas do tabernáculo.
- source_word: וָוֵי
  choice: ganchos
  rationale: וָוִים são peças de fixação ligadas às colunas do tabernáculo; «ganchos» expressa de modo claro a função mais provável.
- source_word: חֲשֻׁקֵיהֶם
  choice: suas faixas
  rationale: O referente arquitetônico exato de חֲשֻׁקִים é incerto. «Faixas» preserva a ideia geral de peças presas às colunas sem especificar indevidamente sua forma ou função.
- source_word: כָּסֶף
  choice: prata
  rationale: Termo direto para o metal prata; no predicado, aplica-se aos ganchos e às faixas.
- source_word: וְ
  choice: com; e
  rationale: A conjunção inicial dá continuidade à descrição do versículo anterior e é traduzida por «com»; a coordenação seguinte é expressa pela pontuação e por «e».
