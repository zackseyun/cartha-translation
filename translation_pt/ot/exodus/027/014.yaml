  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: pt
  text: Quinze côvados de cortinas para um dos lados, com suas três colunas e suas três bases.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: quinze côvados
  rationale: O numeral composto significa “quinze”, e אַמָּה é a medida linear padrão “côvado”; não é necessário explicitar “de comprimento”.
- source_word: קְלָעִים
  choice: cortinas
  rationale: No contexto do pátio do santuário, o termo designa os tecidos suspensos que formavam o cercado. “Cortinas” é claro e natural em português.
- source_word: לַכָּתֵף
  choice: para um dos lados
  rationale: Embora כָּתֵף signifique literalmente “ombro”, em descrição arquitetônica indica o lado ou flanco junto à entrada; o lado correspondente aparece no versículo seguinte.
- source_word: עַמֻּדֵיהֶם
  choice: suas três colunas
  rationale: עַמּוּד designa coluna, pilar ou poste. “Colunas” é terminologia arquitetônica corrente, e “suas” preserva o sufixo pronominal hebraico.
- source_word: אַדְנֵיהֶם
  choice: suas três bases
  rationale: אֶדֶן designa a peça de apoio, semelhante a um encaixe ou pedestal, que sustenta uma coluna. “Bases” comunica a função de modo claro e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A expressão espacial foi traduzida pelo sentido arquitetônico contextual, sem reproduzir literalmente “ombro”, que seria obscuro em português.
