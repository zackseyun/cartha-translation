  yaml_path: translation/ot/exodus/027/005.yaml
  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: pt
  text: Você a colocará sob a saliência[a] do altar, pela parte de baixo, e a rede se estenderá até a metade da altura do altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “borda” ou “rebordo”. O termo hebraico karkov parece indicar uma borda, moldura ou projeção do altar.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e a rede estará até a metade do altar”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Você a colocará
  rationale: O verbo נתן, com objeto direto e indicação de lugar, tem aqui o sentido natural de “colocar”. O futuro preserva o valor instrutivo da forma hebraica no contexto.
- source_word: אֹתָהּ
  choice: a
  rationale: O pronome feminino singular retoma a rede ou grade de bronze mencionada no versículo anterior.
- source_word: תַּחַת
  choice: por baixo de
  rationale: Expressa diretamente a posição inferior em relação à saliência do altar.
- source_word: כַּרְכֹּב
  choice: saliência
  rationale: O termo raro designa provavelmente uma borda, moldura ou projeção estrutural do altar. “Saliência” comunica a ideia arquitetônica sem especificar em excesso sua forma exata.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente português corrente e tradicional de מזבח.
- source_word: מִלְּמָטָּה
  choice: na parte inferior
  rationale: Preserva a indicação espacial do hebraico e evita a repetição pouco natural de “por baixo... de baixo”.
- source_word: וְהָיְתָה הָרֶשֶׁת עַד
  choice: e a rede se estenderá até
  rationale: Reproduz a coordenação hebraica e expressa em português natural a extensão ou posição resultante da rede, sem introduzir uma ideia explícita de finalidade.
- source_word: הָרֶשֶׁת
  choice: a rede
  rationale: רשת indica uma estrutura tramada ou reticulada; “rede” preserva a imagem e é clara no contexto.
- source_word: חֲצִי הַמִּזְבֵּחַ
  choice: a metade da altura do altar
  rationale: A expressão é literalmente “a metade do altar”; no contexto da colocação vertical da rede, refere-se ao ponto médio da altura. A formulação explicita apenas essa relação espacial necessária à compreensão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto para leitores brasileiros como para um público lusófono amplo. A ordem de “na parte inferior” foi ajustada para evitar redundância, mantendo todos os elementos espaciais do hebraico.
