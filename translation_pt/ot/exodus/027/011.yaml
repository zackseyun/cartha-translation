base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: pt
  text: 'Do mesmo modo, para o lado norte, em comprimento: cortinas de cem côvados de comprimento[a], suas vinte colunas e suas vinte bases de bronze. Os ganchos das colunas e suas faixas[b] serão de prata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “cem de comprimento”; a unidade “côvados” é indicada pelo contexto imediato.
    reason: cultural_note
  - marker: b
    text: Ou “peças de ligação”; o termo hebraico se refere a peças que circundavam ou ligavam as colunas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Do mesmo modo
  rationale: Expressa a correspondência com as especificações do lado anterior de maneira natural em português.
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: ao longo do lado norte
  rationale: Reúne de modo idiomático a indicação do lado e de sua extensão, sem perder o sentido dimensional.
- source_word: קְלָעִים
  choice: cortinas
  rationale: No contexto do pátio do tabernáculo, designa os panos suspensos que formavam o cercado; “cortinas” é claro e corrente.
- source_word: מֵאָה אֹרֶךְ
  choice: de cem côvados de comprimento
  rationale: O hebraico diz literalmente “cem de comprimento”; a unidade “côvados” é recuperada das medidas explícitas no contexto imediato.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: com vinte colunas
  rationale: Transmite naturalmente em português que as cortinas desse lado eram sustentadas por vinte colunas.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: e vinte bases de bronze
  rationale: אדן designa a base ou encaixe de sustentação das colunas; “bases” é acessível, e “bronze” é a designação contextual usual de נְחֹשֶׁת.
- source_word: וָוֵי הָעַמֻּדִים
  choice: Os ganchos das colunas
  rationale: וָוִים refere-se aos ganchos ou peças de fixação presos às colunas; “ganchos” é concreto e adequado ao contexto.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: suas faixas
  rationale: O termo designa peças que circundavam ou ligavam as colunas. “Faixas” preserva essa amplitude sem impor uma forma técnica incerta.
- source_word: כָּסֶף
  choice: prata
  rationale: Designação direta do material.
