  text: וּ/לְ/שַׁ֨עַר הֶֽ/חָצֵ֜ר מָסָ֣ךְ עֶשְׂרִ֣ים אַמָּ֗ה תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֣ה רֹקֵ֑ם עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֖ם אַרְבָּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: pt
  text: Para a entrada do pátio haverá uma cortina[a] de vinte côvados de comprimento[b], feita de fios azuis, púrpuras e escarlates e de linho fino retorcido, trabalho de bordador, com suas quatro colunas e suas quatro bases[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma tela” ou “um reposteiro” para fechar a entrada.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “vinte côvados”; “de comprimento” foi acrescentado para esclarecer a dimensão indicada.'
    reason: clarification
  - marker: c
    text: Ou “seus quatro pedestais”; o termo hebraico designa as bases ou encaixes das colunas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: Para a entrada do pátio
  rationale: שַׁעַר pode designar portão, portal ou entrada. Como o fechamento é uma cortina, “entrada” comunica com naturalidade a abertura de acesso ao pátio, enquanto וּלְ é representado por “Para”.
- source_word: מָסָךְ
  choice: uma cortina
  rationale: No contexto do tabernáculo, מָסָךְ é uma peça têxtil que cobre ou fecha uma entrada. “Cortina” é corrente e evita sugerir uma porta sólida; a alternativa “tela” consta em nota.
- source_word: עֶשְׂרִים אַמָּה
  choice: vinte côvados de comprimento
  rationale: O hebraico diz literalmente “vinte côvados”. A expressão “de comprimento” é suprida para explicitar a dimensão da cortina no contexto arquitetônico.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: fios azuis, púrpuras e escarlates
  rationale: Os termos designam materiais tingidos nas cores azul, púrpura e escarlate. “Fios” explicita de modo natural o caráter têxtil da lista sem alterar sua função.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: e de linho fino retorcido
  rationale: שֵׁשׁ designa linho fino, e מָשְׁזָר descreve fios torcidos ou retorcidos. A formulação preserva tanto o material quanto o modo de fabricação.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: trabalho de bordador
  rationale: A construção hebraica apresenta o produto como obra de um artesão especializado em trabalho decorativo têxtil. “Trabalho de bordador” mantém a construção com agente e o sentido artesanal.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה
  choice: suas quatro colunas
  rationale: Mantém o sufixo possessivo plural explícito do hebraico e emprega “colunas”, termo natural para os suportes verticais da estrutura.
- source_word: וְאַדְנֵיהֶם אַרְבָּעָה
  choice: e suas quatro bases
  rationale: אֶדֶן é o encaixe ou base que sustenta uma coluna. “Bases” é mais acessível em português moderno, enquanto “pedestais” permanece como alternativa em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha a instrução arquitetônica hebraica sem rigidez excessiva. Mantiveram-se os possessivos de terceira pessoa do plural em “suas quatro colunas” e “suas quatro bases”.
