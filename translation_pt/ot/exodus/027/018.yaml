base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: pt
  text: O pátio terá cem côvados de comprimento, cinquenta por cinquenta de largura[a] e cinco côvados de altura. As cortinas serão de linho fino retorcido, e as bases[b] das colunas serão de bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “cinquenta por cinquenta”. Muitas traduções apresentam apenas “cinquenta côvados”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “encaixes”. O termo hebraico designa as peças metálicas em que as colunas eram fixadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: O pátio terá ... de comprimento
  rationale: Expressa com naturalidade a dimensão arquitetônica e preserva o valor diretivo da construção hebraica.
- source_word: מֵאָה בָאַמָּה
  choice: cem côvados
  rationale: Mantém a unidade antiga do texto e a coerência com as medidas do santuário.
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: cinquenta por cinquenta
  rationale: Preserva a formulação incomum e repetida do hebraico, sem decidir silenciosamente que a segunda ocorrência deve ser omitida.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: cinco côvados de altura
  rationale: Tradução direta e idiomática da dimensão vertical.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: שֵׁשׁ designa linho fino neste contexto, e מָשְׁזָר descreve fios retorcidos; a expressão é corrente e clara em português.
- source_word: וְאַדְנֵיהֶם
  choice: as bases das colunas
  rationale: אַדֶן designa as peças metálicas de sustentação. A explicitação de “das colunas” torna claro o referente implícito do pronome plural e evita que “suas bases” pareça referir-se às cortinas.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: É a designação tradicional e contextualmente adequada do metal empregado na estrutura do pátio, embora o termo também possa abranger cobre.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi dividida em duas frases para evitar que “de linho fino retorcido” pareça modificar a altura. A expressão hebraica incomum “cinquenta por cinquenta” foi mantida no texto, com esclarecimento em nota.
