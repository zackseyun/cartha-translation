  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: pt
  text: As suas varas serão introduzidas nas argolas[a] e ficarão nos dois lados[b] do altar quando ele for transportado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão levadas para dentro das argolas”. O verbo hebraico está na voz passiva e descreve a inserção das varas para o transporte.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “peças laterais” ou “flancos”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: serão introduzidas
  rationale: O hofal de בוא tem sentido passivo e causativo. Neste contexto, descreve a colocação das varas nas argolas para o transporte; “serão introduzidas” preserva a voz passiva e expressa a inserção com naturalidade.
- source_word: בַּדָּיו
  choice: as suas varas
  rationale: בַּד designa aqui as varas usadas para transportar o mobiliário sagrado. “Varas” é uma expressão clara, concisa e corrente em português.
- source_word: בַּטַּבָּעֹת
  choice: nas argolas
  rationale: A preposição ב indica aqui o lugar em que as varas são inseridas. Com o verbo “introduzir”, “nas argolas” comunica naturalmente essa relação espacial.
- source_word: וְהָיוּ
  choice: e ficarão
  rationale: O verbo descreve a posição resultante das varas depois de inseridas. “Ficarão” expressa esse estado prescrito sem acrescentar a ideia de permanência absoluta.
- source_word: עַל
  choice: nos
  rationale: עַל indica a relação espacial das varas com os lados do altar. Em português, “nos dois lados” é natural e evita uma formulação rígida.
- source_word: שְׁתֵּי צַלְעֹת
  choice: os dois lados
  rationale: צֵלָע pode significar lado, flanco ou peça lateral. “Os dois lados” é claro no contexto, sem definir de modo excessivo a estrutura exata.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Tradução padrão de מִזְבֵּחַ no contexto do culto.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: quando ele for transportado
  rationale: O infinitivo construto de נשׂא com ב expressa circunstância ou tempo. A construção passiva mantém o altar como foco e não introduz um agente ausente do hebraico.
