  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: pt
  text: Faça-o oco, com tábuas[a]. Como lhe foi mostrado no monte, assim o farão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oco, feito de tábuas”. O hebraico descreve o altar como uma estrutura oca construída com tábuas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב
  choice: oco
  rationale: O adjetivo descreve o altar como uma estrutura vazia por dentro, não maciça; “oco” é claro, conciso e natural em português.
- source_word: לֻחֹת
  choice: de tábuas
  rationale: O substantivo plural indica as tábuas que formam a estrutura. “De tábuas” expressa naturalmente o material e a construção do altar.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: Faça-o
  rationale: Imperativo natural em português para a instrução dirigida diretamente a Moisés, preservando sua força normativa.
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Introduz de modo claro a correspondência entre o modelo revelado e a execução.
- source_word: הֶרְאָה אֹתְךָ
  choice: foi mostrado a você
  rationale: Preserva a forma passiva do hebraico e não explicita o agente divino, que permanece implícito no texto-fonte.
- source_word: בָּהָר
  choice: no monte
  rationale: Forma idiomática e tradicionalmente compreensível para indicar o local onde o modelo foi mostrado.
- source_word: כֵּן יַעֲשׂוּ
  choice: assim eles o farão
  rationale: Mantém o verbo no plural e a estrutura comparativa do hebraico, sem substituir os executores por uma construção passiva.
