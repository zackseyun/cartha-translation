base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: pt
  text: Na tenda do encontro, do lado de fora do véu[b] que fica diante do testemunho[c], Arão e seus filhos o disporão diante de Yahweh, da tarde até a manhã. Será um estatuto permanente para os israelitas, por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou: “cortina”.'
    reason: lexical_alternative
  - marker: c
    text: O “testemunho” provavelmente se refere às tábuas da aliança guardadas na arca; assim, a expressão descreve a posição do véu em relação à arca.
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Preserva a designação cultual da tenda como lugar de encontro, em português claro e corrente.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: do lado de fora do véu
  rationale: פָּרֹכֶת designa a divisória do santuário interior; “véu” mantém o sentido cultual tradicional sem deixar de ser compreensível.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: que fica diante do testemunho
  rationale: Embora עַל possa significar “sobre”, aqui descreve a posição do véu em relação à arca que continha o testemunho.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: o porão em ordem
  rationale: ערך expressa dispor ou pôr em ordem. O pronome singular masculino é preservado, remetendo ao elemento do serviço da lâmpada mencionado no contexto anterior.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: desde a tarde até a manhã
  rationale: Reproduz claramente o período noturno durante o qual o serviço sacerdotal deveria ser mantido.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Mantém o idioma cultual “diante de” e representa diretamente o nome divino יְהוָה.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Comunica a vigência duradoura da prescrição no contexto legal e pactual, sem impor ao idioma uma afirmação metafísica de infinitude absoluta.
- source_word: לְדֹרֹתָם
  choice: por todas as suas gerações
  rationale: Forma portuguesa natural para a continuidade geracional expressa pela fórmula hebraica.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: da parte dos filhos de Israel
  rationale: Preserva a noção de procedência ou responsabilidade marcada por מֵאֵת e mantém a designação coletiva בְּנֵי יִשְׂרָאֵל.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Alcance de חֻקַּת עוֹלָם na legislação cultual
  choice: estatuto permanente
  alternative: estatuto perpétuo; estatuto eterno
  rationale: “Permanente” conserva a força legal e a continuidade pactual do idioma sem resolver além do texto a extensão teológica de עוֹלָם.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantêm-se os termos cultuais “tenda do encontro”, “véu”, “testemunho” e “estatuto”, acompanhados de notas apenas onde a alternativa lexical ou o referente cultural merece esclarecimento.
