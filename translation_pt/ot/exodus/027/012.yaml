  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: pt
  text: Quanto à largura do pátio, no lado oeste[a], haverá cortinas de cinquenta côvados, com suas dez colunas e suas dez bases[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “do lado do mar”, expressão usual para indicar o oeste.
    reason: lexical_alternative
  - marker: b
    text: Ou “encaixes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר
  choice: Na largura do pátio
  rationale: רֹחַב indica a largura, e חָצֵר designa a área cercada ao redor do tabernáculo. A formulação introduz naturalmente, em português, a especificação desse lado do pátio.
- source_word: לִ/פְאַת יָם
  choice: do lado oeste
  rationale: פֵאָה designa lado ou extremidade; יָם significa literalmente “mar”, mas funciona aqui como orientação convencional para o oeste.
- source_word: קְלָעִים
  choice: cortinas
  rationale: No contexto do pátio do tabernáculo, o termo se refere aos grandes tecidos suspensos que formavam o cercado. “Cortinas” é claro e corrente em português.
- source_word: חֲמִשִּׁים אַמָּה
  choice: cinquenta côvados
  rationale: Tradução direta da medida antiga, sem acrescentar uma conversão moderna incerta ao texto.
- source_word: עַמֻּדֵי/הֶם עֲשָׂרָה
  choice: suas dez colunas
  rationale: Preserva tanto a contagem quanto o sufixo pronominal hebraico, ligando as colunas ao conjunto de cortinas descrito.
- source_word: וְ/אַדְנֵי/הֶם עֲשָׂרָה
  choice: e suas dez bases
  rationale: אֶדֶן designa a peça inferior que sustenta uma coluna. “Bases” é compreensível e preserva a relação expressa pelo sufixo pronominal.
