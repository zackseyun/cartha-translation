lexical_decisions:
- source_word: וְרֹחַב
  choice: A largura
  rationale: רֹחַב indica largura ou extensão transversal. “A largura” é natural em português e mantém o sentido dimensional; o וְ coordena esta frase com as instruções anteriores, sem exigir aqui um “e” pouco natural.
- source_word: הֶחָצֵר
  choice: do pátio
  rationale: חָצֵר designa a área externa cercada do santuário. “Pátio” é claro, corrente e apropriado ao contexto do tabernáculo.
- source_word: לִפְאַת קֵדְמָה
  choice: no lado leste
  rationale: פֵאָה pode significar lado, extremidade ou borda; com a indicação direcional קֵדְמָה, “no lado leste” expressa naturalmente a construção.
- source_word: מִזְרָחָה
  choice: na direção do nascer do sol
  rationale: מִזְרָחָה reforça a orientação oriental com referência ao lugar do nascer do sol. A formulação preserva a dupla expressão direcional do hebraico sem mera repetição de “leste”.
- source_word: חֲמִשִּׁים אַמָּה
  choice: cinquenta côvados
  rationale: Mantém o numeral e a unidade linear antiga do texto-fonte, sem inserir conversão aproximada no texto principal.
