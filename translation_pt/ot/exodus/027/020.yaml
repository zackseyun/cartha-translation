language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: pt
  text: Você ordenará aos filhos de Israel[a] que lhe tragam azeite puro de azeitonas esmagadas[b], para a iluminação, a fim de manter uma lâmpada acesa continuamente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “aos israelitas” ou “ao povo de Israel”. Hebraico: “aos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “azeite batido”. Refere-se ao azeite de alta qualidade obtido ao bater ou esmagar as azeitonas, em vez de submetê-las à prensagem comum.
    reason: lexical_alternative
  - marker: c
    text: No contexto do santuário, “continuamente” pode indicar manutenção regular e constante, não necessariamente uma chama ininterrupta a cada momento; compare Êxodo 27:21 e Levítico 24:2–4.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: Você
  rationale: O pronome independente dá ênfase ao destinatário, Moisés, e assinala uma leve mudança no discurso. Em português, o pronome explícito preserva essa ênfase sem exigir a tradução mecânica da conjunção inicial.
- source_word: תְּצַוֶּה
  choice: ordenará
  rationale: O piel de צוה significa ordenar ou incumbir. O futuro com valor diretivo mantém o tom jurídico-instrutivo do contexto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico. Uma nota esclarece que, como designação coletiva, refere-se aos israelitas, ao povo de Israel.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: que lhe tragam
  rationale: Embora לקח tenha o sentido básico de tomar, com אֶל neste contexto de provisão significa obter e levar até Moisés. 'Tragam' é idiomático e fiel à ação pretendida.
- source_word: שֶׁמֶן זַיִת
  choice: azeite
  rationale: Em português, 'azeite' denota normalmente óleo de oliva; a construção seguinte explicita sua produção a partir de azeitonas.
- source_word: זָךְ
  choice: puro
  rationale: Abrange a pureza e limpidez exigidas do azeite destinado ao uso no santuário.
- source_word: כָּתִית
  choice: de azeitonas esmagadas
  rationale: O termo descreve azeite obtido de olivas batidas ou esmagadas, em vez do processo comum de prensagem. A formulação natural evita sugerir que o próprio líquido era golpeado.
- source_word: לַמָּאוֹר
  choice: para a iluminação
  rationale: Preserva o substantivo referente à luz ou iluminação sem acrescentar ao versículo um aparato específico apenas inferido do contexto.
- source_word: לְהַעֲלֹת נֵר
  choice: a fim de manter uma lâmpada acesa
  rationale: O hifil com נר é uma expressão relativa a acender e sustentar a chama. 'Manter ... acesa' comunica a manutenção indicada pelo contexto imediato e evita o literalismo obscuro 'fazer subir uma lâmpada'.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Mantém o termo cultual tradicional, sem decidir se implica absoluta ininterrupção ou manutenção regular e recorrente; a nota registra essa amplitude contextual.
theological_decisions:
- issue: Designação pactual בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A forma principal conserva a imagem genealógica do hebraico. No contexto, é uma designação coletiva da comunidade de Israel, não uma afirmação de que as mulheres estejam excluídas.
- issue: Extensão temporal de תָּמִיד no serviço do santuário
  choice: continuamente
  alternative: regularmente; de modo permanente
  rationale: A tradução conserva a tensão entre continuidade e manutenção regular própria do culto, sem impor a ideia de combustão ininterrupta a cada instante.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe mantém o caráter diretivo da instrução, enquanto 'azeite' e 'manter uma lâmpada acesa' comunicam naturalmente os referentes concretos.
