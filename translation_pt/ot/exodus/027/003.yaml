translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O imperativo traduz a força diretiva da sequência legal. A repetição dos possessivos preserva a relação de cada utensílio com o altar sem tornar a frase excessivamente pesada.
