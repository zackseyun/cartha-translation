base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: pt
  text: Faça os seus recipientes para retirar as cinzas[a], as suas pás, as suas bacias, os seus garfos e os seus braseiros. Faça de bronze[b] todos os seus utensílios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, «para remover suas cinzas gordurosas»; a expressão se refere à retirada das cinzas produzidas pelas ofertas no altar.
    reason: lexical_alternative
  - marker: b
    text: Ou «cobre».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça também
  rationale: O perfeito consecutivo, dentro das instruções do santuário, tem força diretiva. O imperativo em português é natural e digno; “também” representa a ligação com a instrução anterior.
- source_word: סִּירֹתָיו
  choice: os seus recipientes
  rationale: סִירוֹת designa recipientes ou potes. “Recipientes” evita sugerir panelas domésticas e permite que a expressão seguinte indique sua função.
- source_word: לְדַשְּׁנוֹ
  choice: para retirar as cinzas
  rationale: No Piel, דשן pode designar a remoção dos resíduos gordurosos e das cinzas produzidos pelas ofertas no altar. A formulação comunica claramente a função sem impor ao leitor a expressão obscura “cinzas gordurosas”.
- source_word: יָעָיו
  choice: as suas pás
  rationale: O substantivo indica instrumentos usados para manusear cinzas ou brasas; “pás” é claro e adequado ao contexto.
- source_word: מִזְרְקֹתָיו
  choice: as suas bacias
  rationale: O termo designa recipientes ligados ao manejo de líquidos, inclusive sangue sacrificial. “Bacias” preserva o caráter cultual melhor que uma expressão doméstica.
- source_word: מִזְלְגֹתָיו
  choice: os seus garfos
  rationale: O substantivo se refere a instrumentos em forma de garfo. “Garfos” é atual e não acrescenta a interpretação mais específica de “garfos para carne”.
- source_word: מַחְתֹּתָיו
  choice: os seus braseiros
  rationale: O termo pode indicar recipientes usados para recolher ou transportar brasas. “Braseiros” é conciso e reconhecível, embora “recipientes para brasas” também seja possível.
- source_word: לְכָל־כֵּלָיו
  choice: todos os seus utensílios
  rationale: כְּלִי é um termo amplo para objetos, instrumentos ou utensílios; aqui resume naturalmente o conjunto de acessórios do altar.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos objetos do tabernáculo, “bronze” é a tradução tradicional e historicamente plausível, embora o termo hebraico também possa indicar cobre.
