  rationale: A revisão conserva no texto a medida hebraica e desloca sua equivalência aproximada para a nota. Também adota um registro diretivo mais apropriado e uma redação que preserva a dupla indicação meridional sem acrescentar precisão interpretativa indevida. A nota lexical sobre «cortinas» não é necessária, pois o termo é natural no contexto e a tradução não depende de uma alternativa textual.
