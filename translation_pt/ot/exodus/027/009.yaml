  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: pt
  text: Farás o pátio do tabernáculo. Do lado sul, para o sul, haverá cortinas de linho fino retorcido para o pátio, com cem côvados[a] de comprimento para um dos lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cem côvados”, aproximadamente 45 metros.'
    reason: measurement_conversion
lexical_decisions:
- source_word: חֲצַר
  choice: pátio
  rationale: Designa a área aberta e cercada ao redor do tabernáculo; “pátio” é claro e natural em português.
- source_word: הַמִּשְׁכָּן
  choice: tabernáculo
  rationale: Termo consagrado e compreensível para a tenda-santuário de Êxodo.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: No lado sul, voltado para o sul
  rationale: Preserva a dupla indicação meridional do hebraico sem soar excessivamente rígida.
- source_word: קְלָעִים
  choice: cortinas
  rationale: Refere-se aos painéis de tecido que formavam a delimitação do pátio; “cortinas” é corrente e inteligível, com a função esclarecida em nota.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Mantém tanto a qualidade do tecido quanto o modo de preparação dos fios.
- source_word: מֵאָה בָאַמָּה
  choice: quarenta e cinco metros
  rationale: Converte cem côvados para uma medida moderna aproximada, facilitando a compreensão; a unidade antiga é preservada em nota.
- source_word: אֹרֶךְ
  choice: de comprimento
  rationale: Forma idiomática em português junto à indicação da medida.
- source_word: לַפֵּאָה הָאֶחָת
  choice: para esse lado
  rationale: Retoma com clareza o lado sul que acaba de ser especificado.
