  text: וַ/יְהִ֗י מְאַת֙ כִּכַּ֣ר הַ/כֶּ֔סֶף לָ/צֶ֗קֶת אֵ֚ת אַדְנֵ֣י הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת אַדְנֵ֣י הַ/פָּרֹ֑כֶת מְאַ֧ת אֲדָנִ֛ים לִ/מְאַ֥ת הַ/כִּכָּ֖ר כִּכָּ֥ר לָ/אָֽדֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: pt
  text: 'Os cem talentos de prata foram usados para fundir as bases do santuário e as bases do véu[a]: cem bases correspondentes aos cem talentos, um talento para cada base.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “véu” era a cortina interior que separava o Lugar Santo do Lugar Santíssimo.
    reason: cultural_note
  - marker: b
    text: Um talento era uma antiga unidade de peso. Neste versículo, cada base correspondia a um talento de prata.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: foram usados
  rationale: No contexto da prestação de contas, o verbo introduz a destinação da prata; esta formulação torna natural em português a relação com o infinitivo de propósito לָצֶקֶת.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: os cem talentos de prata
  rationale: Mantém a quantidade exata e expressa de modo idiomático a unidade antiga de peso.
- source_word: לָצֶקֶת
  choice: para fundir
  rationale: O infinitivo indica finalidade e, neste contexto metalúrgico, descreve a fundição das peças.
- source_word: אַדְנֵי
  choice: bases
  rationale: Designa as peças metálicas de fundação que sustentavam a estrutura; “bases” é claro e corrente, enquanto “encaixes” também é possível.
- source_word: הַקֹּדֶשׁ
  choice: do santuário
  rationale: Aqui se refere à estrutura sagrada do tabernáculo, e não necessariamente apenas a um de seus compartimentos.
- source_word: הַפָּרֹכֶת
  choice: do véu
  rationale: Designa especificamente a cortina interior divisória do santuário; “véu” conserva essa especificidade cultual.
- source_word: לִמְאַת הַכִּכָּר
  choice: com os cem talentos
  rationale: A preposição marca a correspondência entre as cem bases e os cem talentos empregados; “com” comunica naturalmente a matéria/quantidade usada sem alterar a proporção.
- source_word: כִּכָּר לָאָדֶן
  choice: um talento para cada base
  rationale: Explicita de forma idiomática a proporção distributiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para uma prestação de contas. “Santuário”, “véu” e “bases” preservam a terminologia cultual sem recorrer a formulações excessivamente arcaicas.
