  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: pt
  text: Estes são os registros[a] do tabernáculo, o tabernáculo do testemunho[b], apurados por ordem de Moisés, pelo serviço dos levitas, sob a direção de Itamar[c], filho de Arão, o sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inventário” ou “prestação de contas”; o termo hebraico se refere a um levantamento oficial.
    reason: lexical_alternative
  - marker: b
    text: “O testemunho” provavelmente se refere ao testemunho da aliança, especialmente às tábuas colocadas na arca.
    reason: cultural_note
  - marker: c
    text: Literalmente, “pela mão de Itamar”, expressão que pode indicar atuação ou supervisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: registros
  rationale: O substantivo designa aqui um levantamento ou uma prestação oficial de contas dos materiais do tabernáculo. “Registros” é claro e natural, enquanto a nota preserva as alternativas mais específicas.
- source_word: הַמִּשְׁכָּן
  choice: tabernáculo
  rationale: É o termo português tradicional e amplamente compreendido para a estrutura do santuário em Êxodo.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: o tabernáculo do testemunho
  rationale: Mantém a repetição explicativa do hebraico e preserva “testemunho” sem explicitar no texto principal uma identificação apenas implícita.
- source_word: פֻּקַּד
  choice: levantados
  rationale: Retoma o sentido administrativo de פְקוּדֵי e expressa de modo idiomático que os registros foram oficialmente apurados.
- source_word: עַל פִּי מֹשֶׁה
  choice: por ordem de Moisés
  rationale: A expressão idiomática significa “segundo a palavra/ordem de”; a tradução comunica de maneira natural a autoridade de Moisés.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: por meio do serviço dos levitas
  rationale: Preserva tanto o valor instrumental da construção quanto o sentido de trabalho ou serviço designado aos levitas.
- source_word: בְּיַד אִיתָמָר
  choice: sob a direção de Itamar
  rationale: A expressão literal “pela mão de” indica aqui agência ou supervisão; “sob a direção de” comunica claramente essa função.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do título de Arão, mantido como identificação em aposição.
theological_decisions:
- issue: Referente de “testemunho”
  choice: Manter “testemunho” no texto principal e explicar a provável referência em nota.
  alternative: Traduzir diretamente como “documento da aliança” ou “tábuas da aliança”.
  rationale: O termo hebraico não explicita aqui o referente. A formulação preserva a linguagem e a ambiguidade do texto, sem ocultar a associação provável com as tábuas guardadas na arca.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe administrativa clara. “Tabernáculo”, “testemunho”, “levitas” e “sacerdote” conservam o vocabulário bíblico estabelecido; as notas esclarecem termos técnicos e o idioma hebraico sem sobrecarregar o texto principal.
