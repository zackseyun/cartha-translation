lexical_decisions:
- source_word: כֶסֶף
  choice: prata
  rationale: No contexto da prestação de contas, refere-se ao metal recolhido, não a dinheiro em sentido abstrato.
- source_word: פְּקוּדֵי
  choice: os que foram contados
  rationale: Expressa o sentido administrativo passivo de pessoas registradas no censo, em português natural.
- source_word: הָעֵדָה
  choice: comunidade
  rationale: Designa o conjunto do povo reunido; «comunidade» é claro, atual e adequado ao contexto.
- source_word: מְאַת כִּכָּר
  choice: cem talentos
  rationale: Mantém a unidade antiga de peso e traduz diretamente o total hebraico.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: mil setecentos e setenta e cinco siclos
  rationale: Apresenta em português corrente a sequência numérica aditiva, cujo total é 1.775 siclos.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: conforme o siclo do santuário
  rationale: Indica que o peso foi calculado segundo o padrão oficial associado ao santuário.
