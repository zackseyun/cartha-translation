  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: pt
  text: A prata dos que foram contados na comunidade foi de cem talentos e mil setecentos e setenta e cinco siclos, conforme o siclo do santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
