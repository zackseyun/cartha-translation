  text: וְ/לִ/פְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽ/עַמּוּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: pt
  text: Quanto ao lado norte, media cem côvados; havia vinte colunas e vinte bases de bronze. Os ganchos das colunas e suas cintas[a] eram de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: suas hastes de ligação. O termo hebraico designa peças arquitetônicas de prata associadas às colunas; sua forma exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: quanto ao lado norte
  rationale: פֵּאָה indica lado, margem ou região; com צָפוֹן, designa o lado norte do pátio. A formulação mantém o estilo de inventário e soa natural em português.
- source_word: מֵאָה בָאַמָּה
  choice: media cem côvados
  rationale: A expressão informa a extensão do lado. O verbo “media”, implícito no hebraico nominal, torna a frase clara sem alterar seu sentido.
- source_word: עַמּוּדֵיהֶם
  choice: vinte colunas
  rationale: עַמּוּדִים são os suportes verticais da estrutura. “Colunas” é claro, corrente e adequado ao contexto do tabernáculo.
- source_word: אַדְנֵיהֶם
  choice: vinte bases
  rationale: אֶדֶן designa as bases ou encaixes que sustentavam as colunas. “Bases” comunica melhor a função ao leitor comum.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No vocabulário dos materiais do tabernáculo, נְחֹשֶׁת é tradicional e adequadamente vertido por “bronze”, embora o termo antigo possa abranger cobre e suas ligas.
- source_word: וָוֵי הָעַמּוּדִים
  choice: os ganchos das colunas
  rationale: וָוִים designa aqui peças em forma de gancho presas às colunas, não estacas de tenda.
- source_word: חֲשֻׁקֵיהֶם
  choice: suas cintas
  rationale: O termo se refere a peças de prata que cingiam as colunas ou as ligavam, mas sua forma arquitetônica exata é incerta. “Cintas” preserva a ideia básica de envolver ou prender sem empregar vocabulário arcaico.
- source_word: כָּסֶף
  choice: prata
  rationale: É o termo comum para prata e indica o material dos ganchos e das cintas.
theological_decisions: []
