  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: pt
  text: Fez o altar do holocausto de madeira de acácia. Tinha cinco côvados de comprimento e cinco côvados de largura; era quadrado[a] e tinha três côvados de altura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de quatro lados iguais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O waw consecutivo com עשה dá continuidade à narrativa no passado. “Fez” é direto e natural em português; o sujeito permanece implícito, como o contexto permite.
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: A expressão designa o altar associado à oferta inteiramente queimada. “Altar do holocausto” é a formulação bíblica corrente e compreensível em português.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: שִׁטִּים refere-se à acácia. A tradução pelo nome moderno da madeira é mais clara do que uma transliteração tradicional.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: Preserva-se a unidade antiga usada de modo consistente nas dimensões do santuário, sem introduzir uma conversão aproximada no texto.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: No enunciado dimensional reformulado em português, a locução expressa naturalmente o comprimento do altar.
- source_word: רָחְבּוֹ
  choice: de largura
  rationale: “Largura” é o equivalente moderno e corrente para a dimensão indicada por רֹחַב.
- source_word: רָבוּעַ
  choice: quadrado
  rationale: O adjetivo indica uma forma quadrada, isto é, com comprimento e largura iguais. “Quadrado” é preciso e natural.
- source_word: קֹמָתוֹ
  choice: de altura
  rationale: Em contexto arquitetônico, קוֹמָה indica altura. A locução é idiomática na descrição das medidas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A longa sequência nominal do hebraico foi distribuída em duas frases para maior clareza, sem alterar as medidas nem a relação entre elas. O marcador da nota foi colocado após “quadrado”, termo ao qual a alternativa lexical de רָבוּעַ efetivamente se refere.
