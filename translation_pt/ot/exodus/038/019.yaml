  text: וְ/עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֥ם אַרְבָּעָ֖ה נְחֹ֑שֶׁת וָוֵי/הֶ֣ם כֶּ֔סֶף וְ/צִפּ֧וּי רָאשֵׁי/הֶ֛ם וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: pt
  text: As quatro colunas tinham quatro bases de bronze[a]. Seus ganchos eram de prata; o revestimento da parte superior das colunas[b] e suas faixas também eram de prata[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encaixes”. O termo hebraico designa as peças metálicas de sustentação no pé das colunas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o revestimento das cabeças delas”.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, “filetes”. Não se sabe ao certo qual era a forma desses elementos de prata.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: as quatro colunas
  rationale: עַמּוּד designa uma coluna ou pilar; “colunas” é claro e apropriado para a estrutura do pátio do tabernáculo.
- source_word: אַדְנֵיהֶם
  choice: quatro bases
  rationale: אֶדֶן refere-se às peças metálicas de sustentação no pé das colunas. “Bases” é mais natural em português moderno; “encaixes” continua possível.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Embora o termo possa abranger cobre, “bronze” é a designação convencional e contextual para esse metal na construção do tabernáculo.
- source_word: וָוֵיהֶם
  choice: seus ganchos
  rationale: וָו designa elementos de fixação, normalmente entendidos aqui como ganchos associados às colunas.
- source_word: כֶּסֶף
  choice: prata
  rationale: O substantivo denota diretamente prata, material dos ganchos, do revestimento superior e das faixas.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: o revestimento da parte superior das colunas
  rationale: צִפּוּי é revestimento ou cobertura metálica, e רָאשֵׁיהֶם significa literalmente “suas cabeças”, isto é, a parte superior das colunas.
- source_word: חֲשֻׁקֵיהֶם
  choice: suas faixas
  rationale: A forma exata desses elementos é incerta. “Faixas” comunica peças que circundavam ou ligavam as colunas sem especificar além da evidência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sequência nominal hebraica foi expressa em orações breves para evitar um fragmento obscuro, sem alterar quais peças eram de bronze ou de prata.
