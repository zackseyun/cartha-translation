base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/010.yaml
  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: pt
  text: Suas colunas eram vinte, e suas vinte bases eram de bronze; os ganchos das colunas e suas faixas eram de prata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus aros” ou “suas hastes de ligação”. O termo hebraico provavelmente indica faixas ou elementos de conexão associados às colunas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: suas colunas
  rationale: עַמּוּדִים designa os suportes verticais da estrutura. O sufixo masculino plural retoma, pelo contexto, os elementos do lado anteriormente descrito; “suas colunas” preserva essa referência de modo natural.
- source_word: עֶשְׂרִים
  choice: vinte
  rationale: Número cardinal traduzido diretamente nas duas ocorrências.
- source_word: אַדְנֵיהֶם
  choice: suas vinte bases
  rationale: אֶדֶן, no contexto do tabernáculo, indica a base ou encaixe que sustentava uma coluna. “Bases” é claro em português moderno; “encaixes” permanece uma alternativa possível.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze; “bronze” corresponde ao uso tradicional e é apropriado para os utensílios e componentes do tabernáculo.
- source_word: וָוֵי הָעַמֻּדִים
  choice: os ganchos das colunas
  rationale: וָוִים designa ganchos ou peças de conexão fixadas às colunas. “Ganchos” expressa com clareza sua provável função.
- source_word: חֲשֻׁקֵיהֶם
  choice: suas faixas
  rationale: O termo raro se refere a faixas, aros ou elementos de ligação associados às colunas. “Faixas” preserva o sentido físico sem recorrer a terminologia arcaica, enquanto a nota registra a incerteza.
- source_word: כָּסֶף
  choice: prata
  rationale: Termo comum para o material, traduzido diretamente.
