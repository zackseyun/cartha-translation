  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: pt
  text: Ele fez o pátio. Do lado sul, para o sul, as cortinas[a] do pátio eram de linho fino retorcido e tinham cem côvados de comprimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «panos pendurados do pátio».'
