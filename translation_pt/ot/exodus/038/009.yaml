lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa; a formulação simples e natural preserva o sentido verbal.
- source_word: הֶחָצֵר
  choice: o pátio
  rationale: חָצֵר designa aqui a área externa cercada do tabernáculo; “pátio” é claro e corrente em português.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: No lado sul, voltado para o sul
  rationale: A tradução mantém os dois elementos direcionais do hebraico, sem reduzir a expressão a uma única referência ao sul.
- source_word: קַלְעֵי הֶחָצֵר
  choice: as cortinas do pátio
  rationale: קְלָעִים refere-se às peças de tecido que delimitavam o pátio; “cortinas” é natural e compreensível neste contexto.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: de linho fino retorcido
  rationale: A expressão comunica tanto a qualidade do linho quanto o modo de preparação dos fios.
- source_word: מֵאָה בָּאַמָּה
  choice: tinham cem côvados de comprimento
  rationale: O hebraico fornece a medida; “de comprimento” explicita naturalmente a dimensão implícita.
