  register: Português moderno, digno e de leitura ampla, com coordenação fiel ao hebraico e sem introduzir contraste onde o texto apenas encadeia os elementos. A repetição de “prata” e a relação lexical entre “faixas” e “guarnecidas com faixas” foram mantidas.
