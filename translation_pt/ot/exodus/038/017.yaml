base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: pt
  text: As bases[a] das colunas eram de bronze; os ganchos das colunas e suas faixas[b] eram de prata, e o revestimento da parte superior delas era de prata. Todas as colunas do pátio eram guarnecidas com faixas de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encaixes”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa peças de prata associadas às colunas, talvez faixas, aros ou barras de ligação; sua forma arquitetônica exata é incerta.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: bases
  rationale: No contexto da construção do santuário, refere-se aos suportes ou encaixes inferiores das colunas. “Bases” é claro e natural; a alternativa mais específica é preservada em nota.
- source_word: עַמֻּדִים
  choice: colunas
  rationale: Designa os suportes verticais da estrutura. “Colunas” é a terminologia arquitetônica corrente e digna em português.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Embora o termo possa designar cobre ou liga de cobre, “bronze” é a tradução convencional e plausível neste contexto metalúrgico.
- source_word: וָוֵי
  choice: ganchos
  rationale: Refere-se às peças curvas fixadas às colunas para sustentar ou prender outros elementos da estrutura.
- source_word: חֲשׁוּקֵיהֶם
  choice: suas faixas
  rationale: O referente arquitetônico exato é incerto. “Faixas” conserva a ideia de peças que cingem ou guarnecem as colunas sem especificar excessivamente sua forma.
- source_word: צִפּוּי
  choice: revestimento
  rationale: Expressa uma camada de metal aplicada sobre uma superfície e é natural no português contemporâneo.
- source_word: רָאשֵׁיהֶם
  choice: a parte superior delas
  rationale: Literalmente “suas cabeças”; no contexto, indica a porção superior das colunas. A formulação evita o tecnicismo possivelmente excessivo “capitéis”.
- source_word: מְחֻשָּׁקִים
  choice: guarnecidas com faixas
  rationale: O particípio é cognato de חֲשׁוּקֵיהֶם. A tradução mantém essa ligação lexical e indica que as colunas receberam tais peças de prata.
- source_word: חָצֵר
  choice: pátio
  rationale: No contexto do santuário, designa a área externa cercada. “Pátio” é concreto, corrente e amplamente compreensível.
theological_decisions: []
