  register: Português moderno, digno e acessível, com sintaxe de inventário preservada. O fragmento começa em minúscula porque continua a enumeração do versículo anterior. “Ao redor do pátio” reproduz סָבִיב sem a formulação potencialmente ambígua “pátio circundante”.
