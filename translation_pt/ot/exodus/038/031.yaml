translation:
  language: pt
  text: as bases ao redor do pátio[a], as bases da entrada do pátio, todas as estacas do tabernáculo[b] e todas as estacas ao redor do pátio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encaixes”, em vez de “bases”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pinos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: bases
  rationale: No contexto da construção do tabernáculo, designa as peças de fundação nas quais se encaixavam armações ou postes. “Bases” é claro, concreto e natural em português.
- source_word: חָצֵר
  choice: pátio
  rationale: Designa a área externa cercada do santuário. “Pátio” é corrente e espacialmente claro em português.
- source_word: סָבִיב
  choice: ao redor
  rationale: Preserva a ideia de distribuição por todo o perímetro e soa natural tanto com as bases como com as estacas.
- source_word: שַׁעַר
  choice: entrada
  rationale: Neste contexto, refere-se à abertura de acesso ao pátio. “Entrada” evita sugerir necessariamente uma porta rígida e é natural para a entrada com cortina descrita no contexto.
- source_word: יִתְדֹת
  choice: estacas
  rationale: Refere-se às peças cravadas no solo para firmar o tabernáculo e o pátio. “Estacas” é a designação corrente em português para esse tipo de fixação.
- source_word: מִּשְׁכָּן
  choice: tabernáculo
  rationale: É a designação tradicional e específica da tenda-santuário em Êxodo, preservando a continuidade terminológica.
- source_word: כָּל
  choice: todas
  rationale: Expressa de maneira natural e completa a totalidade das estacas mencionadas.
- source_word: וְאֵת / וְאֶת
  choice: e
  rationale: A conjunção com o marcador de objeto direto organiza a enumeração. Em português, a coordenação simples com “e” reproduz adequadamente essa estrutura.
