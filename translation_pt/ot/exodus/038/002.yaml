  text: וַ/יַּ֣עַשׂ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ הָי֣וּ קַרְנֹתָ֑י/ו וַ/יְצַ֥ף אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: pt
  text: Fez chifres nos quatro cantos do altar; os chifres formavam uma só peça com ele[a], e revestiu o altar de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «dele eram os seus chifres», indicando que não foram feitos separadamente e depois fixados ao altar.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico neḥóshet pode designar bronze ou cobre; «bronze» é a tradução convencional no contexto do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: Traduz diretamente o wayyiqtol de עשה e mantém o fluxo narrativo natural em português, sem exigir a repetição de «E» no início.
- source_word: קַרְנֹתָיו
  choice: chifres
  rationale: קֶרֶן significa literalmente «chifre» e, neste contexto, designa as saliências em forma de chifre nos cantos do altar. O termo concreto preserva a imagem cultual hebraica.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: nos quatro cantos do altar
  rationale: Expressa com clareza a localização indicada por עַל e explicita o referente dos sufixos pronominais, evitando ambiguidade pouco natural em português.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: os chifres formavam uma só peça com ele
  rationale: A expressão significa literalmente «dele eram os seus chifres» e, em linguagem de construção, indica que os chifres eram integrais ao altar, não peças anexadas.
- source_word: וַיְצַף אֹתוֹ
  choice: revestiu o altar
  rationale: צפה, neste contexto artesanal, significa cobrir ou revestir um objeto com metal. A repetição de «o altar» torna o referente claro.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze; «bronze» é a tradução convencional e contextualmente apropriada nas descrições do tabernáculo, preservando-se a alternativa em nota.
