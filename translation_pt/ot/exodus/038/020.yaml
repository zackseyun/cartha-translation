  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: pt
  text: E todas as estacas do tabernáculo e do pátio ao redor eram de bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”. O termo hebraico נְחֹשֶׁת pode designar cobre ou bronze, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Todas
  rationale: Com o substantivo plural, כָּל tem sentido coletivo; em português, “todas” expressa isso naturalmente. A conjunção inicial pode ser omitida neste versículo isolado sem perda semântica relevante.
- source_word: הַיְתֵדֹת
  choice: as estacas
  rationale: יָתֵד designa estacas ou pinos usados para firmar uma estrutura. “Estacas” é claro e corrente em português neste contexto.
- source_word: לַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: מִשְׁכָּן é o termo habitual para a estrutura sagrada de Êxodo. Embora a preposição hebraica indique destinação (“para”), “estacas do tabernáculo” comunica de modo natural sua função em português.
- source_word: וְלֶחָצֵר סָבִיב
  choice: e do pátio ao redor
  rationale: חָצֵר é o recinto aberto cercado, e סָבִיב indica sua disposição circundante. “Pátio ao redor” conserva a relação espacial sem explicitar um referente ausente do hebraico.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos materiais do tabernáculo, “bronze” é a tradução tradicional e contextualmente adequada, embora o termo hebraico também possa designar cobre.
