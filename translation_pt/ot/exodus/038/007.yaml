  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: pt
  text: Ele colocou as varas nas argolas dos lados do altar[a], para carregá-lo com elas. Fez o altar oco, de tábuas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele trouxe as varas para dentro das argolas”. O verbo hebraico significa mais literalmente “trouxe”, mas, neste contexto, refere-se a pôr as varas em posição.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “oco, tábuas”. A expressão provavelmente indica que o altar foi construído como uma estrutura oca, feita de tábuas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: colocou
  rationale: O hifil de בוא, construído aqui com as argolas, descreve o posicionamento das varas nelas. “Colocou” é natural em português e preserva o sentido contextual sem limitar a ação a simplesmente trazê-las.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: No contexto do tabernáculo, בַּדִּים são as varas usadas para transportar os utensílios sagrados. “Varas” é a designação bíblica corrente e clara em português.
- source_word: בַּטַּבָּעֹת
  choice: nas argolas
  rationale: A preposição ב indica que as varas foram postas dentro das argolas. Com o verbo “colocar”, “nas argolas” expressa isso naturalmente em português.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: dos lados do altar
  rationale: צַלְעֹת designa os lados ou partes laterais. A formulação localiza as argolas sem acrescentar uma descrição estrutural não explícita.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: para carregá-lo com elas
  rationale: O infinitivo expressa finalidade; o pronome em בָּהֶם remete às varas. “Carregar” é o equivalente moderno e direto de נשׂא neste contexto.
- source_word: נְבוּב
  choice: oco
  rationale: נְבוּב descreve o altar como internamente vazio; “oco” é conciso e exato.
- source_word: לֻחֹת
  choice: de tábuas
  rationale: A construção hebraica נְבוּב לֻחֹת é elíptica. “Oco, de tábuas” conserva tanto a característica do altar quanto o material ou tipo de construção, sem explicitar além do texto.
- source_word: עָשָׂה אֹתוֹ
  choice: Fez o altar
  rationale: O referente pronominal é explicitado como “o altar” para evitar que, em português, “o fez” pareça retomar apenas o ato de transporte ou outro elemento próximo.
