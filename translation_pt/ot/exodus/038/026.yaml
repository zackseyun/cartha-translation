base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: pt
  text: 'um beca por cabeça[a][b], isto é, meio siclo segundo o siclo do santuário, para cada um dos que passaram entre os recenseados[c], de vinte anos de idade para cima: 603.550.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um beca equivalia a meio siclo segundo o padrão do santuário.
    reason: cultural_note
  - marker: b
    text: Literalmente, “por crânio”, expressão idiomática hebraica que significa cada pessoa contada individualmente.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que passaram para o grupo dos contados”. O hebraico emprega linguagem censitária e conserva a imagem de passar para ser registrado.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: beca
  rationale: Translitera o termo hebraico específico de peso; a expressão seguinte esclarece seu valor como meio siclo.
- source_word: לַגֻּלְגֹּלֶת
  choice: por cabeça
  rationale: Reproduz em português natural o idiomatismo de contagem individual, cujo sentido literal é “por crânio”.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: meio siclo
  rationale: Traduz diretamente a expressão que define o valor do beca.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Indica que o peso era calculado conforme o padrão oficial associado ao santuário.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: para cada um dos que passaram entre os recenseados
  rationale: Mantém a imagem verbal de passar e o contexto de registro censitário, sem reduzir a expressão simplesmente a “inscritos”.
- source_word: הַפְּקֻדִים
  choice: os recenseados
  rationale: Expressa de modo claro e atual o particípio passivo referente às pessoas contadas no censo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: da idade de vinte anos para cima
  rationale: Forma portuguesa natural para o limite etário da fórmula censitária.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '603.550'
  rationale: Apresenta o total hebraico em algarismos e com a convenção portuguesa de separação de milhares.
