  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: pt
  text: Fez para o altar uma grade[a] de bronze, em forma de rede, debaixo da saliência do altar, por baixo, até a metade do altar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma grelha, feita como uma rede, de bronze”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por baixo, até o seu ponto médio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol dá continuidade à narrativa; em português, o sujeito oculto e a ausência de uma conjunção inicial são naturais neste contexto.
- source_word: לַמִּזְבֵּחַ
  choice: para o altar
  rationale: 'A preposição ל indica finalidade ou destinação: a peça foi feita para o altar.'
- source_word: מִכְבָּר
  choice: uma grade
  rationale: O substantivo designa uma estrutura vazada ou gradeada; “grade” é claro e corrente em português.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: em forma de rede
  rationale: Expressa de modo natural o caráter reticulado da peça, preservando a imagem de רֶשֶׁת.
- source_word: נְחֹשֶׁת
  choice: de bronze
  rationale: “Bronze” é a tradução tradicional e contextualmente adequada para o metal dos utensílios do tabernáculo, embora o termo também possa abranger cobre.
- source_word: תַּחַת כַּרְכֻּבּוֹ
  choice: debaixo da sua saliência
  rationale: תַּחַת é espacial, e כַּרְכֻּבּוֹ parece designar uma parte projetada do altar; “saliência” evita especificar excessivamente sua forma.
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: desde baixo até a metade do altar
  rationale: Mantém o valor direcional de מִן em מִלְּמַטָּה e explicita o referente do sufixo para clareza em português.
