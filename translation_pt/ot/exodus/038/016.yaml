lexical_decisions:
- source_word: כָּל
  choice: Todas
  rationale: Expressa a totalidade coletiva das peças de tecido que cercavam o pátio.
- source_word: קַלְעֵי
  choice: as cortinas
  rationale: Designa as peças de tecido que formavam o cercado do pátio; «cortinas» é natural e compreensível em português.
- source_word: הֶחָצֵר
  choice: do pátio
  rationale: No contexto do tabernáculo, refere-se ao espaço externo cercado; «pátio» é claro e corrente.
- source_word: סָבִיב
  choice: ao redor
  rationale: Indica que as cortinas circundavam todo o perímetro do pátio.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: No vocabulário dos tecidos do tabernáculo, indica linho de qualidade; a expressão é tradicional e inteligível.
- source_word: מָשְׁזָר
  choice: retorcido
  rationale: Descreve fios trabalhados por torção, preservando de modo conciso a característica técnica do tecido.
