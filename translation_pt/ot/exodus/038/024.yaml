base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: pt
  text: Todo o ouro usado na obra, em toda a obra do santuário — o ouro da oferta movida[a] — totalizou vinte e nove talentos e setecentos e trinta siclos[b], segundo o siclo do santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de apresentação”. O termo hebraico designa uma oferta apresentada diante do SENHOR com um movimento ritual.'
    reason: lexical_alternative
  - marker: b
    text: O talento e o siclo eram unidades antigas de peso; seu valor exato em medidas modernas é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: usado na obra
  rationale: O particípio passivo de עשה descreve o ouro empregado no projeto; “usado” evita sugerir que o próprio ouro foi fabricado.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: em toda a obra do santuário
  rationale: No contexto da construção do tabernáculo, מְלָאכָה designa o trabalho realizado, e הַקֹּדֶשׁ se refere ao santuário.
- source_word: זְהַב הַתְּנוּפָה
  choice: o ouro da oferta movida
  rationale: “Oferta movida” preserva o termo cultual tradicional associado a um gesto ritual de apresentação diante do SENHOR.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר
  choice: vinte e nove talentos
  rationale: Reproduz o valor numérico em ordem natural no português moderno e mantém a unidade antiga.
- source_word: וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: e setecentos e trinta siclos
  rationale: Tradução direta e idiomática da quantidade, conservando a unidade hebraica antiga.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A preposição indica o padrão de peso pelo qual a quantidade foi calculada.
