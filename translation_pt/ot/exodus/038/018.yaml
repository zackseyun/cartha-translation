translation_notes:
  register: Português moderno, claro e solene, com vocabulário concreto. “Pátio”, “cortina” e “entrada” são acessíveis ao leitor comum; “côvado” conserva a medida antiga. A ambiguidade técnica de מַעֲשֵׂה רֹקֵם e a sintaxe dimensional difícil são preservadas por notas, em vez de serem resolvidas silenciosamente.
