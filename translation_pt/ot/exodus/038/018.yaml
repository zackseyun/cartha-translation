  to: A cortina da entrada do pátio era trabalho de um bordador[a], feita de fios de cor azul, púrpura e escarlate e de linho fino retorcido. Tinha vinte côvados de comprimento e cinco côvados de altura, na largura, em correspondência com as cortinas do pátio[b].
