base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: pt
  text: A cortina da entrada do pátio era trabalho de um bordador[a], feita de fios de cor azul, púrpura e escarlate e de linho fino retorcido. Tinha vinte côvados de comprimento e cinco côvados de altura, na largura, em correspondência com as cortinas do pátio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “trabalho de um tecelão de desenhos coloridos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é incomum e diz literalmente algo próximo de “e a altura, na largura, cinco côvados, em correspondência com as cortinas do pátio”. A relação exata entre “altura”, “largura” e as cortinas do pátio é incerta; provavelmente a cortina da entrada tinha a mesma altura das demais cortinas do pátio.
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: a cortina da entrada do pátio
  rationale: מָסַךְ designa uma peça têxtil que fecha ou cobre uma passagem; junto de שַׁעַר, a expressão indica a cortina instalada na entrada do pátio. “Entrada” evita sugerir necessariamente um portão rígido.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: obra de bordador
  rationale: Preserva a construção artesanal do hebraico e comunica um trabalho têxtil decorado, sem definir além da evidência se a técnica era bordado com agulha ou tecelagem colorida.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: fios de cor azul, púrpura e escarlate
  rationale: Os termos identificam materiais têxteis por suas cores prestigiosas. “Fios de cor” é explicitado em português para tornar natural a enumeração no contexto da confecção da cortina.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linho fino retorcido
  rationale: Expressa tanto a qualidade do linho quanto o processo de torção dos fios, fórmula recorrente nas descrições do santuário.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: vinte côvados de comprimento
  rationale: Mantém a unidade antiga e reproduz diretamente a dimensão indicada pelo hebraico.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: cinco côvados de altura, correspondendo à largura das cortinas do pátio
  rationale: 'Apresenta de modo inteligível a provável relação dimensional: a altura da cortina da entrada correspondia à dimensão transversal das cortinas circundantes, sem ocultar a formulação hebraica incomum, registrada em nota.'
