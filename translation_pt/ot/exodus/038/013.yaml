lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: E, para o lado
  rationale: פֵּאָה designa lado, extremidade ou borda. No contexto das medidas do pátio, “lado” é a opção mais natural; a conjunção e a preposição são preservadas por “E, para”.
- source_word: קֵדְמָה
  choice: leste
  rationale: O termo pode indicar a frente ou a direção oriental; em combinação com מִזְרָחָה, a referência ao leste é explícita.
- source_word: מִזְרָחָה
  choice: na direção do nascer do sol
  rationale: מִזְרָח relaciona-se ao lugar onde o sol nasce e, por extensão, ao leste. A tradução mantém a expressão direcional dupla do hebraico sem simplesmente repetir “leste”.
- source_word: חֲמִשִּׁים
  choice: cinquenta
  rationale: Número cardinal direto.
- source_word: אַמָּה
  choice: côvados
  rationale: אַמָּה é a unidade linear tradicionalmente denominada “côvado” em português bíblico.
