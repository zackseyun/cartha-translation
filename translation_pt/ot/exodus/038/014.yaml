  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: pt
  text: As cortinas de um dos lados mediam quinze côvados; suas colunas[a] eram três, e suas bases, três.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “postes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְלָעִים
  choice: cortinas
  rationale: No contexto do pátio do tabernáculo, designa as peças de tecido que formavam o cercado; “cortinas” é claro e natural em português.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: mediam quinze côvados
  rationale: O hebraico traz diretamente a medida; o verbo “mediam” explicita em português natural a relação dimensional sem acrescentar conteúdo substancial.
- source_word: אֶל הַכָּתֵף
  choice: de um dos lados
  rationale: כָּתֵף significa literalmente “ombro” e, aqui, indica uma das laterais ou seções laterais junto à entrada do pátio.
- source_word: עַמּוּדֵיהֶם
  choice: três colunas
  rationale: “Colunas” é o termo arquitetônico corrente para os suportes das cortinas; a construção com “havia” evita uma sequência possessiva pouco natural.
- source_word: אַדְנֵיהֶם
  choice: três bases
  rationale: O termo indica as bases ou encaixes nos quais as colunas se apoiavam; “bases” é claro e adequado ao contexto.
