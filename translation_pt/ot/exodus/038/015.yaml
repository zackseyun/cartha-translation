  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: pt
  text: Para o outro lado da entrada do pátio, havia cortinas de quinze côvados, com três colunas e três bases[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “três encaixes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: do outro lado
  rationale: כָּתֵף significa literalmente “ombro” e, neste contexto arquitetônico, designa a seção lateral junto à entrada. “Outro lado” comunica naturalmente essa relação espacial.
- source_word: מִזֶּה וּמִזֶּה
  choice: tanto de um lado como do outro
  rationale: A expressão distribui as cortinas pelos dois lados que ladeavam a entrada; esta formulação preserva explicitamente o sentido espacial.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: da entrada do pátio
  rationale: O לְ relaciona as seções laterais à abertura do pátio. “Entrada” é natural em português para a abertura delimitada por cortinas, embora “portão” também seja possível.
- source_word: קְלָעִים
  choice: cortinas
  rationale: No contexto do tabernáculo, o termo designa os painéis de tecido que formavam a cerca do pátio. “Cortinas” é claro e corrente em português.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: quinze côvados
  rationale: Mantém a antiga unidade de medida expressa diretamente no hebraico, sem conversão interpretativa.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: com três colunas
  rationale: עַמּוּד designa coluna ou pilar. A construção com “com” torna natural em português a formulação nominal e inventarial do hebraico.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: e três bases
  rationale: אֶדֶן pode designar a base ou o encaixe inferior de uma coluna. “Bases” é mais imediatamente compreensível, mantendo “encaixes” em nota como alternativa.
