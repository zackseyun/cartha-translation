  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: pt
  text: 'Ele fez todos os utensílios do altar: as panelas[a], as pás, as bacias, os garfos e os recipientes para brasas. Fez de bronze[b] todos os seus utensílios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “panelas” pode referir-se mais especificamente a recipientes usados para retirar as cinzas.
    reason: lexical_alternative
  - marker: b
    text: Ou “cobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: utensílios do altar
  rationale: כְּלִי é um termo amplo para objetos, instrumentos ou recipientes; “utensílios” abrange naturalmente os diversos itens enumerados.
- source_word: הַסִּירֹת
  choice: panelas
  rationale: סִירוֹת designa normalmente panelas ou recipientes semelhantes. O contexto permite que servissem para recolher cinzas, mas isso não é explicitado no termo hebraico.
- source_word: הַיָּעִים
  choice: pás
  rationale: יַע designa um instrumento usado para retirar ou recolher material; “pás” é claro e adequado ao serviço do altar.
- source_word: הַמִּזְרָקֹת
  choice: bacias
  rationale: מִזְרָקוֹת são recipientes empregados no manuseio ritual de líquidos; “bacias” preserva sua função cultual sem acrescentar detalhes não expressos.
- source_word: הַמִּזְלָגֹת
  choice: garfos
  rationale: O substantivo indica instrumentos semelhantes a garfos. A tradução evita acrescentar a especificação interpretativa “para carne”.
- source_word: הַמַּחְתֹּת
  choice: recipientes para brasas
  rationale: מַחְתָּה refere-se a um recipiente usado para recolher ou transportar brasas. A expressão é mais transparente no português atual do que o termo técnico “braseiros” e não o confunde com um incensário.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: O sufixo pronominal remete ao altar; “seus” preserva essa forma de referência e “utensílios” mantém a consistência lexical.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Em contextos dos utensílios do santuário, “bronze” é a tradução convencional e historicamente plausível, embora o termo hebraico também possa designar cobre.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ele fez ... Fez
  rationale: A repetição do verbo עשה é mantida, refletindo a estrutura resumitiva do hebraico sem produzir uma frase artificial em português.
theological_decisions: []
