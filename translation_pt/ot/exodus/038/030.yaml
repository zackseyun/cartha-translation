base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: pt
  text: Com ele fez as bases da entrada da tenda do encontro[a], o altar de bronze, a grade de bronze que lhe pertencia[b] e todos os utensílios do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os encaixes da entrada da tenda do encontro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a grelha de bronze” ou “a rede de bronze que servia para ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo comum עשה, neste contexto narrativo de fabricação, é expresso naturalmente por “fez”.
- source_word: בָּהּ
  choice: Com ele
  rationale: O pronome retoma o bronze contabilizado no versículo anterior; a preposição tem sentido instrumental.
- source_word: אַדְנֵי
  choice: bases
  rationale: No contexto do santuário, designa suportes metálicos ou encaixes; “bases” é claro e preserva a função geral sem tecnicismo excessivo.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: a entrada da tenda do encontro
  rationale: פֶּתַח indica abertura ou entrada, e אֹהֶל מוֹעֵד é vertido de modo direto e compreensível como “tenda do encontro”.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: o altar de bronze
  rationale: É a formulação portuguesa natural para o altar feito de נְחֹשֶׁת; “bronze” é a designação convencional e contextualmente adequada.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: a grade de bronze
  rationale: מִכְבָּר designa uma estrutura reticulada associada ao altar; “grade” é concreta, corrente e apropriada ao objeto.
- source_word: אֲשֶׁר לוֹ
  choice: que lhe pertencia
  rationale: A frase relativa associa a grade ao altar sem determinar com precisão sua posição física.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: todos os utensílios do altar
  rationale: כְּלִים é um termo amplo para objetos e instrumentos; “utensílios” é natural neste contexto cultual.
