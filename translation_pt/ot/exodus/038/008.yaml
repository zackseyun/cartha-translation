base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: pt
  text: Fez a bacia de bronze e sua base de bronze dos espelhos[b] das mulheres que serviam à entrada da tenda do encontro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das mulheres que se reuniam à entrada da tenda do encontro”. O hebraico pode destacar tanto a reunião organizada quanto o serviço.
    reason: alternative_reading
  - marker: b
    text: Ou “dos espelhos de metal polido”. Na Antiguidade, os espelhos geralmente eram feitos de bronze polido, não de vidro.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: bacia
  rationale: Designa o grande recipiente usado para as lavagens no serviço do santuário. “Bacia” é claro e corrente em português.
- source_word: כַּן
  choice: base
  rationale: Refere-se ao suporte ou pedestal da bacia; “base” expressa naturalmente sua função física.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos utensílios do santuário, “bronze” é a tradução convencional e plausível, embora o termo hebraico possa abranger cobre e ligas de cobre.
- source_word: בְּמַרְאֹת
  choice: com os espelhos
  rationale: A preposição indica aqui o material empregado na fabricação. “Com os espelhos” é natural em português e mantém explícito o objeto fornecido pelas mulheres.
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: as mulheres que serviam
  rationale: A repetição da raiz צבא pode transmitir reunião organizada ou serviço. “Serviam” comunica uma atividade intencional no santuário sem atribuir às mulheres um ofício sacerdotal não especificado pelo texto.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Preserva tanto a localização quanto a expressão cultual hebraica em linguagem clara e digna.
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O pretérito perfeito dá continuidade natural à narrativa; o sujeito singular é recuperado do contexto, como no hebraico.
theological_decisions:
- issue: Identidade e função de הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: mulheres que serviam à entrada da tenda do encontro
  alternative: mulheres que se reuniam à entrada da tenda do encontro
  rationale: A raiz צבא pode indicar reunir-se organizadamente ou apresentar-se para serviço. “Serviam” se ajusta ao contexto do santuário, enquanto a nota conserva a ambiguidade e evita definir a atividade como um ministério sacerdotal formal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tenda do encontro” mantém a expressão bíblica sem recorrer a vocabulário arcaico. A construção concisa acompanha o estilo narrativo hebraico.
