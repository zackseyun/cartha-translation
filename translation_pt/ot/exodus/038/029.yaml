  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: pt
  text: E o bronze[a] da oferta movida[b] pesava setenta talentos e 2.400 siclos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cobre»; o hebraico נְחֹשֶׁת pode designar cobre ou bronze, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: «Oferta movida» é um termo técnico para algo apresentado diante do SENHOR mediante um movimento ritual; também pode ser traduzido de modo mais geral como «oferta apresentada» ou «contribuição».
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode designar cobre ou bronze; no inventário de utensílios e estruturas trabalhados do tabernáculo, «bronze» é a tradução tradicional e contextual mais provável, sem excluir a alternativa lexical indicada em nota.
- source_word: הַתְּנוּפָה
  choice: oferta movida
  rationale: Preserva o caráter técnico de תְּנוּפָה, uma oferta apresentada ritualmente diante do SENHOR por um movimento cerimonial, e soa mais natural em português do que uma reprodução excessivamente literal.
- source_word: שִׁבְעִים כִּכָּר
  choice: setenta talentos
  rationale: Mantém a antiga unidade de peso כִּכָּר, convencionalmente traduzida por «talento», sem impor no texto principal uma conversão moderna incerta.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: 2.400 siclos
  rationale: Mantém a unidade antiga שֶׁקֶל como «siclo» e usa a notação numérica corrente em português para facilitar a leitura.
- source_word: וְ
  choice: E
  rationale: Conserva a coordenação com os totais do inventário apresentados nos versículos anteriores.
theological_decisions:
- issue: Natureza cultual de הַתְּנוּפָה
  choice: oferta movida
  alternative: oferta apresentada; contribuição
  rationale: A expressão técnica mantém explícito o gesto ritual sem reduzir o termo a uma contribuição genérica; a nota reconhece traduções mais amplas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A inserção de «pesava» explicita naturalmente que talentos e siclos são unidades de peso, sem alterar o sentido do hebraico. Mantêm-se as unidades antigas e o termo cultual técnico, acompanhados de notas breves.
