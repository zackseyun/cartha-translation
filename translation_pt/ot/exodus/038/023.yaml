    reason: lexical_alternative
  revision_rationale: A revisão preserva a amplitude dos termos hebraicos para os materiais, corrige a associação da nota de variante de nome e mantém a terminologia artesanal e bíblica estabelecida, sem introduzir interpretação adicional.
