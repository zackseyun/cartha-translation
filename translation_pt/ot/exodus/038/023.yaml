base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: pt
  text: E com ele estava Aoliabe[a], filho de Aisamaque, da tribo de Dã, artesão, desenhista e bordador em azul, púrpura, fio escarlate[b] e linho fino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também transliterado “Ooliabe”.
    reason: lexical_alternative
  - marker: b
    text: “Fio escarlate” traduz uma expressão hebraica referente a material têxtil tingido de escarlate; outra tradução possível é simplesmente “escarlate”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: E com ele estava
  rationale: A frase preposicional apresenta Aoliabe como companheiro de Bezalel, mencionado no versículo anterior; o verbo suprido expressa naturalmente em português a oração nominal hebraica.
- source_word: אָהֳלִיאָב
  choice: Aoliabe
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: filho de Aisamaque
  rationale: Reproduz diretamente a construção patronímica, com transliteração adaptada ao português.
- source_word: לְמַטֵּה דָן
  choice: da tribo de Dã
  rationale: Expressa de modo idiomático a filiação tribal indicada pelo hebraico.
- source_word: חָרָשׁ
  choice: artesão
  rationale: O termo designa um trabalhador habilidoso e não especifica inequivocamente, neste contexto imediato, a técnica de gravação; 'artesão' preserva sua amplitude.
- source_word: וְחֹשֵׁב
  choice: desenhista
  rationale: No contexto dos tecidos do santuário, refere-se a quem concebe ou executa desenhos artísticos; 'desenhista' mantém o aspecto criativo sem restringi-lo a uma técnica específica.
- source_word: וְרֹקֵם
  choice: bordador
  rationale: Equivalente claro e atual para o profissional que realiza trabalho de bordado.
- source_word: בַּתְּכֵלֶת
  choice: em tecido azul
  rationale: O termo cromático designa aqui material têxtil tingido; explicitar 'tecido' torna a referência natural em português sem afirmar que se tratava necessariamente de fio.
- source_word: וּבָאַרְגָּמָן
  choice: púrpura
  rationale: Mantém o paralelismo da enumeração dos materiais e a designação tradicional da corante/material púrpura.
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: fio escarlate
  rationale: A expressão refere-se a material têxtil tingido de escarlate; 'fio' explicita adequadamente seu uso no trabalho de bordado, embora o hebraico também permita simplesmente 'escarlate'.
- source_word: וּבַשֵּׁשׁ
  choice: linho fino
  rationale: No vocabulário do tabernáculo, שֵׁשׁ designa linho de qualidade fina; esta é a equivalência portuguesa clara e tradicional.
theological_decisions: []
