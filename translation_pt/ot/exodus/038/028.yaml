  yaml_path: translation/ot/exodus/038/028.yaml
  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: pt
  text: Com os mil setecentos e setenta e cinco siclos, fez os ganchos para as colunas, revestiu a parte superior delas e colocou faixas ao redor delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uniu-as com faixas». O verbo hebraico pode se referir a guarnecer as colunas com faixas ou a ligá-las por meio delas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: Com os mil setecentos e setenta e cinco siclos
  rationale: A expressão retoma a prestação de contas da prata no versículo anterior. A preposição «com» comunica o material empregado; «siclos» explicita em português a unidade elíptica no hebraico, recuperável pelo contexto imediato.
- source_word: עָשָׂה
  choice: fez
  rationale: É o equivalente corrente e natural de עשה em um contexto de fabricação.
- source_word: וָוִים
  choice: ganchos
  rationale: No contexto da construção do tabernáculo, o termo designa ganchos metálicos presos às colunas.
- source_word: לָעַמּוּדִים
  choice: para as colunas
  rationale: «Colunas» é uma designação arquitetônica clara e consagrada para os suportes estruturais aqui mencionados.
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: revestiu a parte superior delas
  rationale: O piel de צפה indica revestimento com metal, e רָאשֵׁיהֶם refere-se literalmente às «cabeças», isto é, à parte superior das colunas. A formulação evita o tecnicismo potencialmente excessivo «capitéis».
- source_word: וְחִשַּׁק אֹתָם
  choice: e colocou faixas ao redor delas
  rationale: Neste contexto, o verbo se refere a guarnecer ou cingir as colunas com faixas metálicas. A formulação é clara em português e conserva a imagem construtiva sem recorrer a vocabulário arcaico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A unidade «siclos», elíptica no hebraico deste versículo, foi explicitada a partir do contexto imediato para evitar uma frase incompleta em português. A ambiguidade do último verbo foi preservada em nota.
