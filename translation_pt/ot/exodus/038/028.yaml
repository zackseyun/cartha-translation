  source_fidelity: 'O texto transmite com precisão a sequência hebraica: o uso dos 1.775 siclos, a fabricação dos ganchos para as colunas, o revestimento de suas partes superiores e a aplicação de faixas. A explicitação de «siclos», embora elíptica no versículo hebraico, é sustentada diretamente pelo contexto contábil imediato (vv. 25–28) e não altera o sentido.'
