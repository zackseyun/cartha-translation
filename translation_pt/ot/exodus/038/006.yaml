  yaml_path: translation/ot/exodus/038/006.yaml
  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: pt
  text: Fez as varas de madeira de acácia e as revestiu de bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa. Em português, o sujeito pode ficar implícito e a conjunção pode ser omitida sem perder a sequência.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: No contexto dos utensílios do tabernáculo, בַּדִּים designa varas usadas para transporte; “varas” é claro e natural em português.
- source_word: עֲצֵי שִׁטִּים
  choice: de madeira de acácia
  rationale: A expressão construta refere-se ao material. “Madeira de acácia” é uma tradução transparente e corrente.
- source_word: וַיְצַף
  choice: e as revestiu
  rationale: Neste contexto artesanal, צפה significa cobrir ou revestir um objeto com metal. “Revestiu” comunica isso de modo natural e preciso.
- source_word: אֹתָם
  choice: as
  rationale: O pronome objeto retoma “as varas” e, em português, concorda com o antecedente feminino plural.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze. “Bronze” é a designação tradicional e contextual mais provável, mantendo-se “cobre” em nota como alternativa lexical legítima.
