source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: pt
  text: E Bezalel, filho de Uri, filho de Hur, da tribo de Judá, fez tudo o que Yahweh[a] havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: E Bezalel
  rationale: A conjunção וּ preserva a ligação com o relato anterior; o nome próprio é transliterado na forma Bezalel, corrente e reconhecível em português.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: filho de Uri, filho de Hur
  rationale: A repetição de בֶּן constitui uma fórmula genealógica direta; “filho de” conserva sua forma e sentido naturais.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: da tribo de Judá
  rationale: Neste contexto de filiação tribal, מַטֶּה significa “tribo”, e a preposição לְ indica pertencimento.
- source_word: עָשָׂה
  choice: fez
  rationale: Embora עָשָׂה possa significar “fazer” ou “realizar”, “fez” é amplo o bastante para abranger toda a obra do santuário sem acrescentar uma nuance técnica ausente do verbo.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: A expressão comunica a totalidade do que foi ordenado e soa natural no português contemporâneo.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto explicita naturalmente em português que a ordem precedeu a execução, sem alterar a relação temporal do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é representado como nome próprio divino, em vez de ser substituído pelo título tradicional “SENHOR”.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Com o verbo português “ordenar”, a pessoa que recebe a ordem é expressa idiomaticamente com a preposição “a”; אֵת marca Moisés como complemento do verbo hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio e não o substitui por um título; a nota registra a convenção tradicional.
translation_notes:
  register: Português moderno, claro e digno, com construção genealógica formal. A colocação do marcador junto de “Yahweh” corrige a aparente associação indevida da nota inglesa com “Uri” e identifica precisamente o termo explicado.
