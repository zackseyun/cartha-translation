  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: pt
  text: Fundiu quatro argolas nas quatro extremidades da grade de bronze[a], como suportes para as varas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos quatro cantos da grade de bronze”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “casas para as varas”, isto é, receptáculos ou suportes destinados a recebê-las.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Fundiu
  rationale: No contexto da fabricação de peças metálicas, יצק descreve o ato de fundir ou moldar metal; “fundiu” é natural e conciso em português.
- source_word: אַרְבַּע טַבָּעֹת
  choice: quatro argolas
  rationale: טַבָּעוֹת designa argolas metálicas usadas para prender ou receber as varas; “argolas” é claro e corrente.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: nas quatro extremidades
  rationale: קָצֶה pode significar ponta, extremidade ou canto. “Extremidades” preserva a amplitude lexical do hebraico sem impor uma geometria mais específica.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: da grade de bronze
  rationale: מִכְבָּר é uma estrutura de treliça ou grade, e נְחֹשֶׁת, neste contexto, é adequadamente traduzido por “bronze”.
- source_word: בָּתִּים
  choice: encaixes
  rationale: Literalmente “casas”, aqui o termo indica receptáculos ou suportes destinados a receber as varas. “Encaixes” comunica essa função de modo natural.
- source_word: לַבַּדִּים
  choice: para as varas
  rationale: בַּדִּים são as varas usadas para transportar os utensílios do santuário; “varas” é a designação tradicional e compreensível em português.
