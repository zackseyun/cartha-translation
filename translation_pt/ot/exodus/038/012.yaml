  text: וְ/לִ/פְאַת יָ֗ם קְלָעִים֙ חֲמִשִּׁ֣ים בָּֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֥ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָ֑ה וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשׁוּקֵי/הֶ֖ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: pt
  text: Para o lado oeste, havia cortinas de cinquenta côvados, com dez colunas e dez bases; os ganchos das colunas e suas faixas[a] eram de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas hastes de ligação”. O termo hebraico para essas peças das colunas é técnico e pode designar faixas, aros, hastes ou elementos decorativos de ligação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: Para o lado oeste
  rationale: יָם significa literalmente “mar”, mas, nesta descrição do pátio, indica convencionalmente o oeste; a formulação preserva a relação introduzida por לִ e soa natural em português.
- source_word: קְלָעִים
  choice: cortinas
  rationale: No contexto do pátio do tabernáculo, o termo designa as peças de tecido que formavam o cercado. “Cortinas” é claro e corrente sem especificar além do texto.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: de cinquenta côvados
  rationale: Mantém a unidade antiga אַמָּה e a expressão direta da medida, sem acrescentar explicitamente “de comprimento”, que está apenas implícito.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: com dez colunas
  rationale: עַמּוּדִים designa os suportes verticais da estrutura. “Com” integra naturalmente ao português a construção enumerativa do hebraico.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: e dez bases
  rationale: אֶדֶן é a base ou o encaixe inferior de uma coluna; “bases” é preciso e mais acessível do que o termo técnico “soquetes”.
- source_word: וָוֵי הָעַמֻּדִים
  choice: os ganchos das colunas
  rationale: וָוִים refere-se aqui às peças em forma de gancho fixadas às colunas; esta é a equivalência mais estabelecida e concreta.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: e suas faixas
  rationale: O referente arquitetônico exato do termo técnico é incerto. “Faixas” comunica peças metálicas associadas às colunas sem decidir se eram aros, hastes ou elementos de ligação; a incerteza é registrada em nota.
- source_word: כָּסֶף
  choice: eram de prata
  rationale: O substantivo funciona predicativamente e indica o material dos ganchos e das faixas; em português, a cópula e a preposição tornam essa relação explícita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e vocabulário amplamente internacional. Preservou-se “côvados” como unidade bíblica tradicional. O marcador da nota foi colocado junto a “faixas”, termo ao qual a alternativa lexical efetivamente se refere.
