  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do hebraico: a interpelação enfática a Moisés, o imperativo dirigido coletivamente aos filhos de Israel, a partícula אַךְ com força enfática, o plural “meus sábados”, a função de sinal entre Yahweh e Israel através das gerações e a finalidade de reconhecer Yahweh como aquele que santifica o povo. “Isso é um sinal” preserva de modo prudente a referência algo elíptica de הִוא, sem fixar indevidamente um antecedente singular.'
  naturalness: Português moderno, claro e de registro apropriado. “Quanto a você, fale...” expressa naturalmente a mudança de foco do pronome antecipado; “entre mim e vocês”, “por todas as suas gerações” e “para que saibam” são formulações idiomáticas e legíveis. A construção “Certamente guardem” é aceitável como imperativo enfático no registro bíblico.
  terminology: “Filhos de Israel” mantém a expressão hebraica e é adequadamente esclarecido em nota como designação coletiva. “Sábados”, “sinal”, “Yahweh” e “que os santifica” são escolhas terminológicas fiéis e consistentes. A nota sobre אַךְ registra adequadamente possibilidades restritiva, contrastiva e enfática, sem transformar uma alternativa em leitura obrigatória.
