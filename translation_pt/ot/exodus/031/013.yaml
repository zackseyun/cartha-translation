id: EXO.31.13
reference: Exodus 31:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: pt
  text: 'Quanto a você, fale aos filhos de Israel[b]: “Certamente[a] guardem os meus sábados, pois isso é um sinal entre mim e vocês por todas as suas gerações, para que saibam que eu sou Yahweh, que os santifica[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Somente” ou “Contudo”. A partícula hebraica אַךְ pode indicar restrição, contraste ou forte ênfase.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”, designação pactual tradicional para o povo de Israel.'
    reason: lexical_clarification
  - marker: c
    text: Ou “que os torna santos” ou “que os consagra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: O pronome expresso e antecipado marca ênfase e transição em relação às instruções anteriores; “Quanto a você” comunica esse destaque com naturalidade.
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: fale aos filhos de Israel
  rationale: “Fale” preserva a força do imperativo; a fórmula לֵאמֹר é representada naturalmente pelos dois-pontos que introduzem a fala direta.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar e pactual do hebraico, que aqui designa coletivamente o povo de Israel.
- source_word: אַךְ
  choice: Certamente
  rationale: Neste contexto, a partícula reforça a obrigação de observar os sábados em meio às instruções sobre o santuário. A nota registra também seu possível valor restritivo ou adversativo.
- source_word: שַׁבְּתֹתַי
  choice: os meus sábados
  rationale: Conserva tanto o plural explícito quanto o pronome possessivo do hebraico.
- source_word: תִּשְׁמֹרוּ
  choice: guardem
  rationale: שׁמר pode significar guardar, observar ou cumprir. “Guardem” preserva a imagem verbal e continua compreensível no contexto de uma ordenança.
- source_word: אוֹת
  choice: um sinal
  rationale: “Sinal” é a equivalência corrente para a marca que identifica e confirma uma relação pactual.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: entre mim e vocês
  rationale: Explicita naturalmente em português que o segundo pronome está no plural.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Expressa a continuidade da obrigação e do sinal ao longo das gerações sucessivas.
- source_word: לָדַעַת
  choice: para que saibam
  rationale: Traduz o infinitivo com לְ como finalidade, sem excluir a nuance de resultado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְקַדִּשְׁכֶם
  choice: que os santifica
  rationale: O particípio causativo apresenta Yahweh como aquele que torna o povo santo ou o consagra.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, não um título. “Yahweh” preserva essa distinção sem inserir uma substituição tradicional.
- issue: Sentido de מְקַדִּשְׁכֶם
  choice: que os santifica
  alternative: que os torna santos; que os consagra
  rationale: “Santifica” mantém a amplitude teológica do causativo hebraico, enquanto a nota oferece uma formulação em linguagem comum.
- issue: Referente e função de אוֹת הִוא
  choice: isso é um sinal
  alternative: ele é um sinal; ela é um sinal
  rationale: O hebraico usa um pronome feminino singular após “meus sábados”, provavelmente retomando o sábado ou sua observância como instituição. “Isso” evita impor um referente gramatical específico e produz português natural.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A escolha preserva a metáfora genealógica explícita e seu caráter pactual; a nota esclarece que a expressão designa o povo coletivamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais naturais no plural (“guardem”, “saibam”). Mantém-se “filhos de Israel” por sua função genealógica e pactual, com esclarecimento em nota. A pontuação substitui de modo idiomático a fórmula hebraica de introdução da fala.
