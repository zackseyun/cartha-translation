  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: pt
  text: a tenda do encontro, a arca do testemunho[a], a tampa da expiação[b], que está sobre ela, e todos os utensílios da tenda—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a arca destinada ao testemunho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “o propiciatório”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Expressão natural e consagrada em português para a estrutura onde Deus se encontrava com Israel, mantendo de perto o sentido do hebraico.
- source_word: הָאָרֹן לָעֵדֻת
  choice: a arca do testemunho
  rationale: Traduz de modo claro a relação expressa por לָעֵדֻת e evita inserir explicitamente 'aliança', termo não presente na expressão hebraica deste versículo.
- source_word: הַכַּפֹּרֶת
  choice: a tampa da expiação
  rationale: Identifica concretamente a cobertura de ouro da arca e conserva sua associação lexical e ritual com a expiação, em linguagem compreensível ao leitor moderno.
- source_word: אֲשֶׁר עָלָיו
  choice: que está sobre ela
  rationale: Mantém a relação espacial da preposição עַל e deixa claro que a tampa fica sobre a arca.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: todos os utensílios da tenda
  rationale: כְּלִים é um termo amplo para objetos e equipamentos; 'utensílios' é corrente no contexto do santuário e preserva a referência aos diversos itens da tenda.
theological_decisions:
- issue: Tradução de כַּפֹּרֶת no contexto do santuário
  choice: a tampa da expiação
  alternative: o propiciatório
  rationale: A opção principal comunica tanto o objeto físico — a tampa da arca — quanto sua função ritual, sem depender de vocabulário eclesiástico menos transparente. A alternativa tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A enumeração acompanha a sintaxe do hebraico, e o travessão final preserva a continuidade da lista no contexto.
