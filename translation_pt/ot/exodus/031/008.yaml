  text: וְ/אֶת הַ/שֻּׁלְחָן֙ וְ/אֶת כֵּלָ֔י/ו וְ/אֶת הַ/מְּנֹרָ֥ה הַ/טְּהֹרָ֖ה וְ/אֶת כָּל כֵּלֶ֑י/הָ וְ/אֵ֖ת מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: pt
  text: a mesa com os seus utensílios, o candelabro puro[a] com todos os seus utensílios e o altar do incenso[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Puro” pode referir-se à pureza ritual e, neste contexto do tabernáculo, provavelmente também evoca o fato de o candelabro ser feito de ouro puro nas descrições relacionadas.
    reason: cultural_note
  - marker: b
    text: Ou “o altar de incenso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: O substantivo significa simplesmente “mesa”. O contexto identifica a mesa do santuário, mas o versículo não repete sua designação mais completa.
- source_word: כֵּלָיו
  choice: os seus utensílios
  rationale: כְּלִי é um termo amplo para objetos, recipientes ou instrumentos; “utensílios” é natural e adequado aos objetos usados no serviço do santuário.
- source_word: הַמְּנֹרָה
  choice: o candelabro
  rationale: מְנוֹרָה designa o suporte das lâmpadas do santuário. “Candelabro” é a tradução portuguesa tradicional e amplamente compreensível do substantivo comum, evitando a transliteração no texto principal.
- source_word: הַטְּהֹרָה
  choice: puro
  rationale: טָהוֹר pode significar “limpo” ou “puro”. Neste contexto cultual, “puro” é mais idiomático e conserva a possível ressonância com o ouro puro usado na confecção do candelabro.
- source_word: כָּל כֵּלֶיהָ
  choice: todos os seus utensílios
  rationale: A tradução preserva a totalidade expressa por כָּל e aplica o mesmo termo amplo aos objetos associados ao candelabro.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: o altar do incenso
  rationale: A cadeia construta significa literalmente “altar do incenso”; esta formulação é clara, natural e mantém a relação explícita entre o altar e o incenso.
- source_word: וְאֶת
  choice: coordenação por vírgulas e “e”
  rationale: אֵת marca objetos diretos e não requer tradução. O וְ coordena os itens; em português, vírgulas e um “e” antes do último elemento produzem uma enumeração natural sem perder a estrutura.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração segue naturalmente em português e mantém a continuidade sintática com os versículos adjacentes. “Candelabro” foi preferido a “menorá”; não se acrescentou nota para essa alternativa porque ela é uma transliteração, não uma diferença de sentido necessária à compreensão.
