revisions:
- from: Guardem o sábado, porque ele é santo para vocês. Quem o profanar certamente será morto, pois todo aquele que nele fizer algum trabalho, essa pessoa será eliminada do meio do seu povo.[a]
  to: Guardem o sábado, porque ele é santo para vocês. Quem o profanar certamente será morto, pois a pessoa que nele fizer trabalho será cortada do meio do seu povo.[a]
  rationale: A revisão substitui «será eliminada» por «será cortada», preservando a imagem e a ambiguidade da fórmula jurídica hebraica, e reformula a cláusula sobre trabalho para um português moderno mais fluente. A nota permanece ancorada na fórmula que esclarece.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:58Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a ordem de guardar o sábado, sua santidade, a pena de morte por profaná-lo e a fórmula de exclusão. Contudo, «será eliminada» tende a explicitar remoção/destruição mais do que o hebraico מאפשר; «será cortada» preserva melhor a fórmula deliberadamente não especificada.
  naturalness: «Todo aquele que nele fizer algum trabalho, essa pessoa...» é uma construção pouco fluente em português moderno, com retomada redundante. Uma oração relativa com «a pessoa» é mais natural e mantém o referente jurídico singular.
  terminology: «Sábado», «santo», «profanar», «certamente será morto» e «pessoa» são escolhas adequadas. «Cortada do meio do seu povo» mantém a terminologia convencional da fórmula hebraica sem decidir o modo de sua execução.
  issues:
  - severity: medium
    issue: «Será eliminada» para וְנִכְרְתָה
    rationale: Embora possível em sentido amplo, «eliminada» pode sugerir uma modalidade definida de destruição ou execução. A expressão hebraica de ‘ser cortada’ é uma fórmula jurídica cujo mecanismo permanece indeterminado no versículo.
  - severity: low
    issue: Redundância em «todo aquele que nele fizer algum trabalho, essa pessoa»
    rationale: A retomada por «essa pessoa» depois de «todo aquele» soa pesada. A reformulação melhora a legibilidade sem alterar o sentido nem a generalidade jurídica.
  revised_text: Guardem o sábado, porque ele é santo para vocês. Quem o profanar certamente será morto, pois a pessoa que nele fizer trabalho será cortada do meio do seu povo.[a]
