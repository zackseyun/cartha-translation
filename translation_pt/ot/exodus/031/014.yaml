  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: pt
  text: Guardem o sábado, porque ele é santo para vocês. Quem o profanar certamente será morto, pois a pessoa que nele fizer trabalho será cortada do meio do seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “será cortada do meio do seu povo”; fórmula jurídica cujo modo exato de cumprimento não é especificado aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Guardem
  rationale: O verbo שׁמר expressa guardar ou observar. O imperativo plural comunica com naturalidade, em português atual, a força normativa da forma hebraica no contexto.
- source_word: הַשַּׁבָּת
  choice: o sábado
  rationale: É a designação corrente e precisa da instituição e do dia de descanso referido pelo hebraico שַׁבָּת.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: ele é santo para vocês
  rationale: Preserva tanto a ideia de algo consagrado como a relação expressa por לָכֶם, em linguagem natural e compreensível.
- source_word: מְחַלְלֶיהָ
  choice: Quem o profanar
  rationale: No piel, חלל significa profanar ou tornar não santo. A construção com “quem” preserva o valor genérico do particípio.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: A combinação do infinitivo absoluto com a forma verbal finita intensifica a certeza da pena; a voz passiva corresponde ao hophal e ao contexto jurídico.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: todo aquele que nele fizer algum trabalho
  rationale: מְלָאכָה denota trabalho ou atividade laboriosa. “Algum trabalho” é uma formulação portuguesa natural para a proibição geral, sem restringir indevidamente o tipo de atividade.
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: O nifal de כרת nesta fórmula jurídica e pactual indica que alguém será cortado ou eliminado. “Eliminada” mantém a força da expressão sem definir por si só o modo da pena.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: essa pessoa
  rationale: Neste contexto jurídico, נֶפֶשׁ designa o indivíduo responsável, não especificamente uma parte imaterial do ser humano.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: do meio do seu povo
  rationale: Reproduz a ideia de remoção dentre a comunidade. “Seu” funciona naturalmente em português sem atribuir sexo ao infrator.
theological_decisions:
- issue: Sentido da fórmula penal וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: Manter a formulação “será eliminada do meio do seu povo”, sem especificar o mecanismo.
  alternative: Será expulsa da comunidade; será removida por juízo divino.
  rationale: O hebraico não determina neste versículo se a fórmula descreve execução humana, exclusão comunitária ou juízo divino. A tradução preserva essa tensão jurídica e teológica.
- issue: Sentido de נֶפֶשׁ no contexto jurídico
  choice: pessoa
  alternative: alma
  rationale: A palavra se refere aqui ao indivíduo infrator. “Pessoa” evita introduzir uma afirmação antropológica que o contexto não exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega-se “vocês” para explicitar o plural sem regionalismo excessivo. A construção legal permanece firme, mas evita vocabulário arcaico. O marcador [a] foi colocado junto à fórmula que a nota explica.
