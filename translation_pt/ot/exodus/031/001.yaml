  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”; outra forma: “Jeová”.'
    reason: Registra a forma hebraica e as principais convenções de representação do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa a sequência de modo natural, e “falou” representa דִּבֵּר como ato de dirigir a palavra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; esta é a formulação portuguesa direta e idiomática.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz o conteúdo da fala. Em português atual, os dois-pontos desempenham naturalmente essa função e evitam o pouco idiomático “dizendo” antes de uma citação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e não o substitui pelo título tradicional; a nota registra as convenções alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção introdutória usa dois-pontos porque a fala propriamente dita começa no versículo seguinte.
