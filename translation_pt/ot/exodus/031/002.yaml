  yaml_path: translation/ot/exodus/031/002.yaml
  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: pt
  text: Veja[a], chamei Bezalel pelo nome, filho de Uri, filho de Hur, da tribo de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Olhe, convoquei Bezalel pelo nome”. A expressão hebraica “chamar pelo nome” pode transmitir a ideia de escolha ou designação pessoal e específica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Veja
  rationale: Imperativo singular de ראה usado para chamar a atenção do ouvinte. “Veja” preserva a forma direta do hebraico e é natural em português.
- source_word: קָרָאתִי
  choice: chamei
  rationale: O qal perfeito na primeira pessoa do singular de קרא, combinado com בְּשֵׁם, expressa chamar ou designar alguém. “Chamei” mantém o sentido básico sem explicitar além do texto a ideia de nomeação.
- source_word: בְשֵׁם
  choice: pelo nome
  rationale: Preserva de modo natural a expressão hebraica קרא בשם, que pode indicar que alguém foi pessoal e especificamente escolhido ou designado.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Nome próprio transliterado segundo a forma convencional em português.
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica imediata, בֶּן indica normalmente filiação direta; “filho de” é a tradução simples e adequada.
- source_word: אוּרִי
  choice: Uri
  rationale: Nome próprio transliterado segundo a forma convencional em português.
- source_word: חוּר
  choice: Hur
  rationale: Nome próprio transliterado segundo a forma convencional em português.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: מַטֶּה designa aqui uma tribo, e a preposição לְ marca pertencimento ou associação. “Da tribo de” comunica essa afiliação de modo idiomático.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome tribal.
