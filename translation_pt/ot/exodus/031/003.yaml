  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: pt
  text: E o enchi do Espírito de Deus[a], com sabedoria, entendimento, conhecimento e toda espécie de trabalho artesanal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do espírito de Deus” ou “de um espírito divino”. A expressão hebraica pode ser entendida de modo mais geral, mas aqui provavelmente se refere ao próprio Espírito de Deus, que o capacita.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: E eu o enchi
  rationale: O verbo מלא significa “encher”. O perfeito apresenta a capacitação divina como realizada e relevante para a tarefa; em português, “enchi” é natural e não exige explicitar no aspecto verbal a ideia de resultado presente.
- source_word: אֹתוֹ
  choice: o
  rationale: Pronome de objeto direto que retoma Bezalel no contexto imediato.
- source_word: רוּחַ אֱלֹהִים
  choice: do Espírito de Deus
  rationale: A construção pode designar o Espírito de Deus, o espírito de Deus ou um espírito divino. Neste contexto de capacitação direta para o serviço sagrado, a leitura mais provável é o próprio Espírito capacitador de Deus, sem impor ao texto formulações doutrinárias posteriores.
- source_word: בְּחָכְמָה
  choice: dando-lhe sabedoria
  rationale: A preposição ב introduz aquilo com que Bezalel foi dotado. “Dando-lhe” comunica naturalmente em português essa capacitação e evita a sequência pouco fluida “com... com...”.
- source_word: וּבִתְבוּנָה
  choice: entendimento
  rationale: תבונה denota entendimento, discernimento ou percepção; “entendimento” preserva com clareza a tríade lexical.
- source_word: וּבְדַעַת
  choice: conhecimento
  rationale: דעת é o termo comum para conhecimento e mantém a progressão concisa da lista.
- source_word: וּבְכָל מְלָאכָה
  choice: habilidade para todo tipo de trabalho artesanal
  rationale: מלאכה pode significar trabalho, ofício ou labor especializado. O contexto da construção do tabernáculo favorece trabalho artesanal; “habilidade” explicita que esse é o quarto elemento da capacitação, enquanto “todo tipo de” traduz idiomaticamente כל com o substantivo singular.
theological_decisions:
- issue: Se רוּחַ אֱלֹהִים deve ser entendido como “o Espírito de Deus”, “o espírito de Deus” ou “um espírito divino”
  choice: o Espírito de Deus
  alternative: o espírito de Deus; um espírito divino
  rationale: O contexto descreve uma ação direta de Deus que capacita Bezalel para o serviço do santuário, favorecendo a referência ao próprio Espírito de Deus. A nota preserva as possibilidades gramaticais mais gerais e evita resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Trabalho artesanal” é mais natural e preciso no contexto do que “artesanato”, que poderia sugerir apenas os produtos acabados. A formulação conserva a coordenação dos dons sem produzir uma cadeia pesada de preposições.
