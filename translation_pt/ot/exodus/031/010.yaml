  text: וְ/אֵ֖ת בִּגְדֵ֣י הַ/שְּׂרָ֑ד וְ/אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/010.yaml
  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: pt
  text: e as vestes finamente tecidas[a], as vestes sagradas para Arão, o sacerdote, e as vestes de seus filhos, para servirem como sacerdotes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as vestes para o ministério”, “as vestes de serviço” ou “as vestes tecidas”. O termo hebraico é difícil e pode destacar tanto a maneira como foram confeccionadas quanto seu uso no serviço do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: as vestes finamente tecidas
  rationale: בִּגְדֵי significa “vestes”; o raro הַשְּׂרָד é de sentido incerto e pode indicar a confecção ou o uso ministerial. “Finamente tecidas” expressa a provável nuance artesanal em português claro, enquanto a nota preserva as alternativas.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: as vestes sagradas
  rationale: A expressão significa literalmente “vestes de santidade”. “Vestes sagradas” é natural em português e comunica que foram separadas para o serviço santo.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: para Arão, o sacerdote
  rationale: A preposição לְ indica destinação, e הַכֹּהֵן funciona como título em aposição a Arão.
- source_word: בִּגְדֵי בָנָיו
  choice: as vestes de seus filhos
  rationale: Mantém a construção possessiva e o referente claro a Arão.
- source_word: לְכַהֵן
  choice: para servirem como sacerdotes
  rationale: O infinitivo כהן descreve o exercício do ofício sacerdotal. A formulação é clara e atual, sem perder a função específica.
- source_word: וְאֵת / וְאֶת
  choice: e / omitido diante de objetos subsequentes
  rationale: אֵת é marcador de objeto direto e não recebe tradução própria; o primeiro וְ mantém a ligação com a lista anterior, enquanto a coordenação portuguesa evita repetição pesada.
