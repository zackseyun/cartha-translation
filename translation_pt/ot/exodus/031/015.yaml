  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: pt
  text: Durante seis dias, o trabalho poderá ser feito, mas o sétimo dia é um sábado de descanso completo[a], santo para Yahweh. Quem fizer algum trabalho no dia de sábado certamente será morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sábado, um descanso solene”. A expressão hebraica intensifica a ideia de cessação e descanso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: o trabalho poderá ser feito
  rationale: O nifal imperfeito de עשה com מְלָאכָה tem sentido passivo. “Poderá ser feito” comunica naturalmente a permissão própria deste contexto legal sem transformá-la em mera previsão futura.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mas o sétimo dia
  rationale: Embora ו possa significar simplesmente “e”, “mas” explicita em português o contraste entre os seis dias de trabalho e o sétimo dia, sem alterar o sentido.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: sábado de descanso completo
  rationale: A combinação intensifica a ideia de cessação ou repouso. A formulação preserva tanto “sábado” quanto a força intensificadora de שַׁבָּתוֹן em português claro.
- source_word: קֹדֶשׁ לַיהוָה
  choice: santo para Yahweh
  rationale: קֹדֶשׁ atribui caráter sagrado ao dia, e ל indica sua dedicação ou orientação a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: Quem fizer algum trabalho
  rationale: A construção participial com כָּל estabelece uma categoria legal geral. “Quem fizer” preserva essa força universal de modo idiomático.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: A tradução conserva o substantivo explícito יוֹם e soa natural em português.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto seguido da forma passiva intensifica a pena. “Certamente” expressa a ênfase, e “será morto” preserva a voz passiva, em vez de reduzir a expressão a “morrerá”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança revelado no contexto do Sinai sem substituí-lo por um título.
- issue: Força da expressão sabática שַׁבַּת שַׁבָּתוֹן
  choice: sábado de descanso completo
  alternative: um sábado, um descanso solene
  rationale: A escolha mantém a intensidade da cessação exigida pelo hebraico sem acrescentar formulações doutrinárias posteriores.
- issue: Natureza da pena em מוֹת יוּמָת
  choice: certamente será morto
  alternative: certamente morrerá
  rationale: A forma verbal é passiva e apresenta uma pena judicial; a tradução conserva essa voz e a intensificação hebraica sem identificar no próprio versículo quem a executa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva a estrutura legal do versículo, o contraste entre os seis dias e o sétimo, e a solenidade da sanção. O marcador foi colocado junto à expressão hebraica que a nota esclarece.
