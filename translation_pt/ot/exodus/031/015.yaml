revisions:
- from: Durante seis dias, o trabalho poderá ser feito, mas o sétimo dia é sábado de descanso completo[a], santo para Yahweh. Quem fizer algum trabalho no dia de sábado certamente será morto.
  to: Durante seis dias, o trabalho poderá ser feito, mas o sétimo dia é um sábado de descanso completo[a], santo para Yahweh. Quem fizer algum trabalho no dia de sábado certamente será morto.
  rationale: Foi inserido apenas o artigo indefinido “um” antes de “sábado”, para refletir mais claramente a identificação predicativa do sétimo dia como um sábado de descanso completo. O restante do texto e a nota permanecem inalterados, pois representam adequadamente o hebraico e mantêm a leitura moderna e solene.
