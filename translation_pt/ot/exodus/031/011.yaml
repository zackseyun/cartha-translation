base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: pt
  text: e o óleo da unção, e o incenso aromático[a] para o santuário. Eles os farão conforme tudo o que ordenei a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o incenso de especiarias para o santuário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: Reproduz de modo natural a construção hebraica e expressa a função ritual do óleo sem acrescentar um qualificativo ausente no texto.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: o incenso aromático
  rationale: Comunica em português corrente que se trata de incenso preparado com substâncias aromáticas; a forma mais literal é registrada em nota.
- source_word: לַקֹּדֶשׁ
  choice: para o santuário
  rationale: No contexto do tabernáculo, קֹדֶשׁ designa naturalmente o âmbito sagrado ou santuário. A tradução evita restringir indevidamente a expressão a um compartimento específico.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: conforme ordenei a você
  rationale: Preserva a ideia de plena conformidade com a ordem divina; o sentido abrangente de כְּכֹל é expresso em português pela combinação de “tudo” com “conforme”.
- source_word: יַעֲשׂוּ
  choice: Eles farão tudo
  rationale: Mantém o sujeito masculino plural implícito, referente aos artesãos, e retoma naturalmente o conjunto de objetos enumerados no contexto.
theological_decisions:
- issue: Sentido de לַקֹּדֶשׁ
  choice: para o santuário
  alternative: para o lugar santo; para uso sagrado
  rationale: “Santuário” se ajusta ao contexto cultual sem decidir que a expressão se refere exclusivamente ao compartimento chamado Lugar Santo; a formulação hebraica também pode indicar destinação sagrada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Óleo da unção” conserva a linguagem cultual bíblica sem soar arcaico; “ordenar a você” mantém a solenidade da instrução divina.
