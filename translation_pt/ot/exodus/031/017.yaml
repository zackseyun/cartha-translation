source:
  edition: WLC
  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: pt
  text: Isso é um sinal para sempre entre mim e os filhos de Israel[a], pois em seis dias Yahweh fez os céus e a terra, e no sétimo dia cessou[b] e tomou alento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “descansou”; o verbo hebraico significa, mais literalmente, “cessou” ou “parou”.
    reason: lexical_alternative
  - marker: c
    text: Ou “revigorou-se” ou “recobrou o alento”; o hebraico emprega uma imagem antropomórfica vívida.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: entre mim e
  rationale: Expressa de modo idiomático em português a relação entre as duas partes.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar masculina do hebraico, mantendo a alternativa mais idiomática em nota.
- source_word: אוֹת
  choice: sinal
  rationale: É o termo corrente para um marcador visível e duradouro da relação de aliança.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: Tradução direta, natural e não limitada do valor duradouro da expressão hebraica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual o sábado funciona como sinal.
- source_word: שֵׁשֶׁת יָמִים
  choice: em seis dias
  rationale: Forma temporal natural em português para o período da obra criadora.
- source_word: עָשָׂה
  choice: fez
  rationale: Verbo simples e contextual para a ação criadora de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: Preserva o plural hebraico e a expressão abrangente para a criação.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: e no sétimo dia
  rationale: Mantém a conjunção sequencial sem impor contraste ausente do texto.
- source_word: שָׁבַת
  choice: cessou
  rationale: Preserva o sentido fundamental de parar ou cessar a atividade, sem introduzir necessariamente a ideia de fadiga.
- source_word: וַיִּנָּפַשׁ
  choice: tomou alento
  rationale: Conserva a imagem vívida e antropomórfica ligada a respirar e renovar-se, em português digno e compreensível.
theological_decisions:
- issue: Descrição antropomórfica de Deus na linguagem do sábado
  choice: cessou e tomou alento
  alternative: descansou e revigorou-se
  rationale: Mantém a linguagem humana e corporal do hebraico sem explicá-la ou suavizá-la teologicamente.
- issue: Sentido de שָׁבַת
  choice: cessou
  alternative: descansou
  rationale: Distingue o ato de parar a obra da expressão seguinte sobre tomar alento, preservando a tensão e a progressão verbal.
- issue: Expressão בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: Conserva a metáfora familiar explícita do original, embora a alternativa seja mais idiomática.
- issue: Nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Representa diretamente o nome pessoal presente no texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a expressão familiar “filhos de Israel”, o nome Yahweh e o antropomorfismo do encerramento, recorrendo a notas apenas para alternativas relevantes.
