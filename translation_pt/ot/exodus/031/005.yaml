  text: in the cutting of stone for setting[a], and in the carving of wood, to do every kind of work[b],
translation:
  language: pt
  text: no trabalho de lapidar pedras para engastá-las[a][b] e no entalhe da madeira, para realizar todo tipo de trabalho,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no trabalho artesanal em pedra para incrustação” ou “na gravação de pedras para engastá-las”.
    reason: lexical_alternative
  - marker: b
    text: “Pedras” é uma expressão geral aqui; neste contexto, pode incluir pedras preciosas usadas na construção e no mobiliário do santuário.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: no trabalho de lapidar / no entalhe
  rationale: 'O substantivo derivado de חרשׁת indica trabalho artesanal especializado. Como aparece com materiais diferentes, a tradução varia naturalmente: “lapidar” para pedras e “entalhe” para madeira.'
- source_word: אֶבֶן
  choice: pedras
  rationale: É o termo geral para pedra. O contexto pode incluir pedras preciosas, mas o hebraico deste versículo não as especifica.
- source_word: לְמַלֹּאת
  choice: para engastá-las
  rationale: Neste contexto artesanal, refere-se à preparação de pedras para serem colocadas e fixadas em um engaste. “Engastar” expressa isso de modo claro e idiomático em português.
- source_word: עֵץ
  choice: madeira
  rationale: É o termo comum e natural em português para o material trabalhado.
- source_word: לַעֲשׂוֹת
  choice: para realizar
  rationale: O infinitivo de עשה é amplo. “Realizar” combina naturalmente com “todo tipo de trabalho” sem restringir o sentido à fabricação de objetos.
- source_word: בְּכָל מְלָאכָה
  choice: todo tipo de trabalho
  rationale: מְלָאכָה designa trabalho, tarefa ou atividade especializada. A formulação mantém a abrangência do hebraico, enquanto o contexto deixa claro que se trata de trabalho artesanal.
