  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: pt
  text: Os filhos de Israel[a] guardarão o sábado, para observarem o sábado[b] em todas as suas gerações, como aliança perpétua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os israelitas». O hebraico diz literalmente «os filhos de Israel».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «fazer o sábado»; isto é, observá-lo ou guardá-lo.
    reason: lexical_alternative
  - marker: c
    text: Ou «aliança eterna» ou «aliança permanente».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: guardarão
  rationale: O verbo שׁמר significa guardar, preservar ou observar. “Guardarão” conserva a força normativa e pactual do contexto sem tornar a frase artificial.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar masculina do hebraico, que aqui designa coletivamente o povo da aliança.
- source_word: הַשַּׁבָּת
  choice: o sábado
  rationale: É a designação portuguesa corrente para שַׁבָּת e, neste contexto, nomeia a instituição que serve como sinal da aliança.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: observando o sábado
  rationale: Embora a expressão seja literalmente “fazer o sábado”, “observar o sábado” comunica de modo natural o sentido idiomático. O gerúndio liga a expressão à maneira pela qual Israel o guardaria.
- source_word: לְדֹרֹתָם
  choice: ao longo das suas gerações
  rationale: Expressa a continuidade da observância entre as sucessivas gerações do povo.
- source_word: בְּרִית עוֹלָם
  choice: como aliança perpétua
  rationale: “Aliança” preserva a terminologia pactual de בְּרִית, e “perpétua” comunica a duração continuada de עוֹלָם sem definir além do texto todas as suas implicações teológicas. “Como” torna explícita em português a função predicativa da expressão final.
theological_decisions:
- issue: Designação do povo da aliança em בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os filhos e as filhas de Israel
  rationale: A tradução mantém a forma familiar masculina presente no hebraico, sem negar que a expressão funcione coletivamente para o povo de Israel.
- issue: Alcance temporal de בְּרִית עוֹלָם
  choice: aliança perpétua
  alternative: aliança eterna; aliança permanente
  rationale: “Perpétua” preserva a força durativa da expressão, enquanto a nota registra alternativas legítimas e evita resolver no próprio texto questões teológicas que vão além deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a terminologia bíblica tradicional “filhos de Israel”, “sábado” e “aliança”, explicando em notas as alternativas relevantes e o idioma hebraico.
