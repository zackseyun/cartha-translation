revisions:
- from: Quanto a mim, eis que[a] designei, junto com ele, Aoliabe, filho de Aisamaque, da tribo de Dã; e pus sabedoria no coração de todos os que têm coração sábio[b], para que façam tudo o que ordenei a você.
  to: E eu, eis que[a] designei, para estar com ele, Aoliabe, filho de Aisamaque, da tribo de Dã; e pus sabedoria no coração de todos os sábios de coração[b], para que façam tudo o que ordenei a você.
  rationale: A revisão torna a expressão hebraica «sábio de coração» idiomática em português sem eliminar a imagem do coração como sede de sabedoria e capacidade. Também esclarece que Aoliabe foi designado para trabalhar ao lado de Bezalel. A ênfase de וַאֲנִי הִנֵּה e a relação final expressa por «para que» foram mantidas.
