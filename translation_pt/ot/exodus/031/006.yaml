  source_fidelity: 'A tradução preserva os elementos centrais do hebraico: a ênfase em primeira pessoa, a partícula de chamada de atenção, a designação de Aoliabe ao lado de Bezalel, sua filiação e tribo, a concessão de sabedoria e a finalidade da obra. Contudo, «todos os que têm coração sábio» é uma reprodução excessivamente literal e pouco idiomática de חֲכַם לֵב.'
  naturalness: O registro é adequado, mas «todos os sábios de coração» é a forma portuguesa mais natural, clara e ainda fiel ao idiomatismo hebraico. «Designei, para estar com ele» evita a possível leitura de que Deus teria designado Aoliabe conjuntamente com alguém, em vez de designá-lo como colaborador de Bezalel.
  terminology: Aoliabe, Aisamaque e Dã são formas portuguesas reconhecíveis. «Sabedoria», «coração» e «ordenar» preservam adequadamente os termos e imagens relevantes do texto.
