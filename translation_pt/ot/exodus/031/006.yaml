base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: pt
  text: E eu, eis que[a] designei, para estar com ele, Aoliabe, filho de Aisamaque, da tribo de Dã; e pus sabedoria no coração de todos os sábios de coração[b], para que façam tudo o que ordenei a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica dá ênfase ao próprio Deus e chama a atenção para o que ele está fazendo; também poderia ser traduzida: “E eu mesmo, eis que designei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sábios de coração”, expressão que descreve pessoas dotadas de sabedoria, entendimento e habilidade prática.'
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Quanto a mim, eis que
  rationale: Preserva tanto a ênfase do pronome independente וַאֲנִי quanto a força de chamada de atenção de הִנֵּה, em português digno e compreensível.
- source_word: נָתַתִּי אִתּוֹ
  choice: designei, junto com ele
  rationale: Neste contexto de comissão, נָתַתִּי expressa a designação de uma pessoa, enquanto אִתּוֹ situa Aoliabe ao lado de Bezalel.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Aoliabe, filho de Aisamaque
  rationale: Emprega formas portuguesas reconhecíveis dos nomes hebraicos e mantém a relação genealógica.
- source_word: לְמַטֵּה דָן
  choice: da tribo de Dã
  rationale: מַטֶּה indica aqui a afiliação tribal.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: e pus sabedoria no coração de todos os que têm coração sábio
  rationale: Mantém a repetição de לֵב e a antropologia hebraica do coração como sede do entendimento e da capacidade prática, sem reduzir a expressão apenas a habilidade técnica.
- source_word: נָתַתִּי חָכְמָה
  choice: pus sabedoria
  rationale: Conserva a imagem concreta de Deus colocando sabedoria neles e a amplitude de חָכְמָה, que inclui perícia artesanal neste contexto.
- source_word: וְעָשׂוּ
  choice: para que façam
  rationale: Expressa naturalmente a relação de propósito ou resultado entre a sabedoria concedida e a execução da obra, sem excluir a alternativa coordenada.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: tudo o que ordenei a você
  rationale: Reproduz a totalidade da expressão e dirige a ordem a Moisés em português moderno e amplamente compreensível.
theological_decisions:
- issue: Sentido de חֲכַם לֵב no contexto do trabalho artesanal
  choice: os que têm coração sábio / sabedoria
  alternative: os habilidosos / habilidade
  rationale: O contexto inclui perícia artesanal, mas a formulação escolhida preserva a concepção hebraica de que essa capacidade prática é sabedoria dada por Deus, sem impor uma distinção moderna mais estreita.
- issue: Força de וְעָשׂוּ depois da concessão de sabedoria
  choice: para que façam
  alternative: e farão
  rationale: A formulação de propósito ou resultado preserva a ligação entre a capacitação divina e a obra dos artesãos, embora a coordenação simples continue gramaticalmente possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas nominais tradicionais e compreensíveis. A sintaxe preserva as ênfases e imagens hebraicas sem se tornar excessivamente literal; a repetição de “coração” é deliberada.
