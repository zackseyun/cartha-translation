  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: pt
  text: Quando acabou de falar com Moisés no monte Sinai, Deus lhe deu as duas tábuas do testemunho, tábuas de pedra, escritas com o dedo de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “inscritas pelo dedo de Deus”. A expressão hebraica atribui vividamente a escrita ao próprio Deus.'
    reason: alternativa lexical e esclarecimento da imagem antropomórfica
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Deus lhe deu
  rationale: O wayyiqtol de נתן expressa a ação narrativa seguinte. O sujeito, implícito no hebraico e identificado pelo contexto como Deus, foi explicitado em português para evitar uma sequência pouco clara de pronomes.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Quando acabou de falar
  rationale: A construção com כ, o infinitivo de כלה e o infinitivo לְדַבֵּר indica a conclusão da fala em sentido temporal; esta formulação é natural e mantém o valor de “quando/depois que terminou”.
- source_word: אִתּוֹ
  choice: com Moisés
  rationale: O pronome retoma Moisés no contexto. A explicitação do referente produz clareza idiomática em português sem alterar o sentido.
- source_word: בְּהַר סִינַי
  choice: no monte Sinai
  rationale: Forma corrente em português para indicar o lugar onde ocorreu a fala.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: as duas tábuas do testemunho
  rationale: “Tábuas” representa לֻחֹת, e “testemunho” preserva o sentido pactual de עֵדוּת sem o ampliar para uma paráfrase explicativa.
- source_word: לֻחֹת אֶבֶן
  choice: tábuas de pedra
  rationale: Mantém a aposição hebraica e identifica diretamente o material das tábuas.
- source_word: כְּתֻבִים
  choice: escritas
  rationale: O particípio passivo de כתב tem o sentido simples de “escritas”; a concordância feminina segue “tábuas” em português.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: com o dedo de Deus
  rationale: O ב instrumental indica o meio, e a tradução conserva a imagem concreta e antropomórfica que atribui a escrita diretamente a Deus.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים designa em sentido singular o Deus de Israel.
theological_decisions:
- issue: Expressão antropomórfica da autoria divina
  choice: com o dedo de Deus
  alternative: diretamente por Deus; pelo poder de Deus
  rationale: A imagem concreta do hebraico foi mantida, sem ser reduzida a uma explicação abstrata, preservando a ênfase na ação direta de Deus.
- issue: Identificação do sujeito e do interlocutor
  choice: Deus ... com Moisés
  alternative: ele ... com ele
  rationale: Embora os referentes sejam pronominais no hebraico, o contexto os identifica. Explicitá-los evita ambiguidade artificial em português sem introduzir uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a expressão pactual “tábuas do testemunho” e o paralelismo apositivo “tábuas de pedra”.
