  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: pt
  text: o altar do holocausto, com todos os seus utensílios, e a bacia com seu suporte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח
  choice: altar
  rationale: É o equivalente português padrão e natural para o local de sacrifício; a expressão seguinte especifica sua função.
- source_word: הָעֹלָה
  choice: do holocausto
  rationale: No contexto cultual, עֹלָה designa a oferta inteiramente queimada. “Holocausto” é a designação bíblica consagrada em português e forma uma expressão natural com “altar”.
- source_word: כָּל
  choice: todos
  rationale: Com o substantivo plural seguinte, indica a totalidade dos objetos associados ao altar.
- source_word: כֵּלָיו
  choice: seus utensílios
  rationale: כְּלִי abrange os objetos e instrumentos usados com o altar; “utensílios” é claro, concreto e corrente nesse contexto.
- source_word: הַכִּיּוֹר
  choice: a bacia
  rationale: Refere-se ao recipiente de lavagem no pátio do tabernáculo. “Bacia” é moderno e amplamente compreensível, sem o arcaísmo de “pia de bronze” ou “lavatório”.
- source_word: כַּנּוֹ
  choice: seu suporte
  rationale: O substantivo indica a estrutura que sustenta a bacia. “Suporte” preserva essa função e é mais preciso aqui do que uma forma que poderia sugerir apenas a parte inferior do recipiente.
- source_word: וְאֶת
  choice: e
  rationale: Na enumeração, a conjunção introduz objetos diretos adicionais; o marcador hebraico de objeto direto não recebe tradução própria.
