lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  choice: elaborar projetos artísticos
  rationale: A expressão hebraica combina o verbo חשׁב com o substantivo cognato מַחֲשָׁבוֹת. No contexto do artesanato do santuário, indica conceber e planejar trabalhos artísticos, não apenas pensar de modo genérico.
- source_word: לַעֲשׂוֹת
  choice: trabalhar
  rationale: Diante da lista de metais, o infinitivo se refere à execução artesanal. “Trabalhar em” é natural em português e expressa o uso habilidoso dos materiais.
- source_word: בַּזָּהָב וּבַכֶּסֶף
  choice: em ouro, prata
  rationale: A preposição בְּ introduz os materiais nos quais o artesão trabalha. Em português, “trabalhar em ouro, prata...” comunica isso com clareza, sem repetir desnecessariamente a preposição.
- source_word: וּבַנְּחֹשֶׁת
  choice: e bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze. “Bronze” se ajusta melhor ao contexto dos utensílios e da metalurgia do tabernáculo, preservando-se a alternativa em nota.
