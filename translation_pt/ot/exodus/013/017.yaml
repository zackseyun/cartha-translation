  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: pt
  text: 'Quando o faraó deixou o povo partir, Deus não o conduziu pelo caminho da terra dos filisteus, embora esse caminho fosse próximo[a], pois Deus disse: “Para que o povo não mude de ideia[b] ao ver a guerra e volte para o Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois esse caminho era próximo”. A conjunção hebraica pode ser entendida como causal; o texto principal a traduz em sentido concessivo, de acordo com a lógica do contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se arrependa” ou “volte atrás”. O verbo hebraico indica aqui uma mudança de ideia ou decisão diante da guerra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: quando o faraó deixou o povo partir
  rationale: A construção com infinitivo e בְּ indica circunstância temporal. “Deixou o povo partir” expressa naturalmente a libertação e preserva o eco do pedido recorrente no relato do Êxodo.
- source_word: נָחָם
  choice: conduziu
  rationale: O verbo נחה significa conduzir ou guiar; “conduziu” se ajusta com naturalidade ao contexto de escolha de rota.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: pelo caminho da terra dos filisteus
  rationale: Mantém a referência geográfica do hebraico, que fala da terra pertencente ou associada aos filisteus, sem substituí-la pelo nome regional “Filístia”.
- source_word: כִּי קָרוֹב הוּא
  choice: embora esse caminho fosse próximo
  rationale: כִּי admite valor causal ou concessivo. O valor concessivo comunica aqui que Deus não escolheu essa rota apesar de sua proximidade, enquanto a nota preserva a alternativa causal.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz uma finalidade negativa ou um receio. A construção “para que não” é clara e corrente em português moderno.
- source_word: יִנָּחֵם
  choice: mude de ideia
  rationale: O nifal de נחם indica aqui mudança de disposição ou decisão diante da guerra, não necessariamente arrependimento moral.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: ao ver a guerra
  rationale: O infinitivo com בְּ exprime a circunstância temporal, e מִלְחָמָה designa guerra ou combate; a formulação conserva a amplitude do hebraico.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: e volte para o Egito
  rationale: שׁוב significa voltar ou retornar, e a terminação direcional de מִצְרַיִם é representada por “para o Egito”.
- source_word: וַיְהִי
  choice: sem equivalente lexical separado
  rationale: A forma introduz o desenvolvimento narrativo, mas a oração temporal iniciada por “Quando” transmite adequadamente a progressão sem acrescentar um marcador como “Ora” ou “Então” que não corresponde a uma palavra temporal explícita.
theological_decisions:
- issue: A razão divina para evitar o caminho da terra dos filisteus
  choice: Apresentar a decisão de Deus como resposta antecipada à possível mudança de decisão do povo diante da guerra.
  alternative: Tratar a explicação como mera conjectura do narrador ou sugerir que Deus alterou seu plano de modo reativo.
  rationale: A frase explícita “pois Deus disse” atribui a razão ao próprio Deus. A tradução conserva essa afirmação sem acrescentar conclusões doutrinárias sobre presciência ou providência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Evitou-se o arcaísmo “para que não suceda que” e também uma paráfrase excessiva como “rota mais curta”, pois o hebraico afirma literalmente que o caminho era próximo.
