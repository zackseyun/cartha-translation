  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: pt
  text: E Yahweh ia adiante deles, de dia numa coluna de nuvem, para guiá-los pelo caminho, e de noite numa coluna de fogo, para iluminá-los, a fim de que pudessem caminhar de dia e de noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e conserva o וַ conjuntivo no fluxo narrativo.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: ia adiante deles
  rationale: O particípio indica ação contínua; a expressão portuguesa comunica tanto a posição à frente quanto a função de condução.
- source_word: יוֹמָם
  choice: de dia
  rationale: Equivalente adverbial natural, em paralelo com 'de noite'.
- source_word: בְּעַמּוּד עָנָן
  choice: numa coluna de nuvem
  rationale: Preserva a imagem concreta e entende בְּ como localização ou manifestação na coluna, sem tratá-la apenas como instrumento.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: para guiá-los pelo caminho
  rationale: נחה expressa condução ou orientação; 'pelo caminho' é a construção portuguesa natural neste contexto.
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: e de noite numa coluna de fogo
  rationale: Mantém o paralelismo entre dia/noite e nuvem/fogo.
- source_word: לְהָאִיר לָהֶם
  choice: para iluminá-los
  rationale: O hifil de אור significa dar luz ou iluminar; a formulação é clara e concisa em português.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: a fim de que pudessem caminhar de dia e de noite
  rationale: Explicita naturalmente a finalidade do infinitivo e preserva a repetição enfática dos dois períodos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o caráter de nome próprio sem inserir uma substituição titular no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi preservada sem rigidez excessiva.
