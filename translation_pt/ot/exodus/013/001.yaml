  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa naturalmente a sequência, e “falou” representa דִּבֵּר de modo direto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino (YHWH), em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Equivalente português natural da preposição que indica o destinatário da fala.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa convencional do nome próprio hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto seguinte sem parafraseá-la.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e representa sua vocalização acadêmica mais difundida, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “falou a Moisés” é natural e mantém a fórmula narrativa do hebraico; os dois-pontos indicam que o discurso direto continua no versículo seguinte.
