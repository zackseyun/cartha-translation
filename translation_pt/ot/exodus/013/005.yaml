source:
  edition: WLC
  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: pt
  text: Quando Yahweh levar você para a terra dos cananeus, dos hititas, dos amorreus, dos heveus e dos jebuseus, terra que ele jurou a seus antepassados dar a você, uma terra que mana leite e mel, você realizará este serviço[a] neste mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “realizará este rito”, “cumprirá esta observância” ou “prestará este culto”. O termo hebraico pode designar um ato prescrito de adoração ou serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: A construção introduz uma circunstância futura. “Quando” expressa naturalmente o valor temporal em português, sem a rigidez de “e acontecerá que, quando”.
- source_word: יְבִיאֲךָ
  choice: levar você para
  rationale: O hifil de בוא significa fazer entrar ou levar. A formulação escolhida é natural em português e mantém o movimento em direção à terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: para a terra dos cananeus, dos hititas, dos amorreus, dos heveus e dos jebuseus
  rationale: Os gentílicos hebraicos estão no singular coletivo; o plural é a forma idiomática e clara em português.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: terra que ele jurou aos seus antepassados dar a você
  rationale: Mantém a oração relativa ligada à terra e preserva tanto a linguagem de juramento quanto o destinatário da dádiva. “Antepassados” comunica o sentido contextual de אָבוֹת sem sugerir apenas os pais imediatos.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: Reproduz a imagem hebraica de abundância com uma expressão consagrada e compreensível em português.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: você prestará este culto
  rationale: A combinação do verbo עבד com o substantivo cognato עֲבֹדָה indica a realização de um serviço prescrito de adoração. “Prestará este culto” preserva a dimensão religiosa sem definir em excesso sua forma ritual.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: neste mês
  rationale: Tradução direta e idiomática da expressão temporal, referente ao mês determinado no contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz o nome pessoal divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título; “Javé” é uma forma portuguesa possível, mas representa uma adaptação fonológica adicional.
- issue: Sentido cultual de עֲבֹדָה no contexto da Páscoa e dos Pães sem Fermento
  choice: este culto
  alternative: este rito; esta observância; este serviço
  rationale: O termo pode designar serviço, trabalho ou um ato prescrito de adoração. No contexto, “culto” comunica a natureza religiosa da prática, enquanto a nota conserva alternativas legítimas sem restringir o termo a uma liturgia específica.
translation_notes:
  register: Português moderno, digno e acessível, com construção compreensível tanto no Brasil quanto internacionalmente. O singular “você” torna explícito o destinatário individual presente nas formas hebraicas. Os travessões delimitam a descrição parentética da terra e evitam uma sequência excessivamente longa de orações.
