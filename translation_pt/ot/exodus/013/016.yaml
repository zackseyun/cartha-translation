  naturalness: '«Isso servirá de sinal ... e de frontais» soa gramaticalmente desigual: o singular «isso» e a construção «servirá de» funcionam bem com «sinal», mas tornam «de frontais» truncado. «Será como sinal ... e como frontais» é mais fluente e mantém o paralelismo hebraico. A colocação das chamadas também deve identificar diretamente os termos a que as notas se referem.'
  terminology: «Frontais» é uma escolha defensável para טוֹטָפֹת, pois conserva o caráter incomum e não impõe «filactérios». «Yahweh» está consistente com a política indicada. «Mão forte» traduz de modo transparente a expressão hebraica.
