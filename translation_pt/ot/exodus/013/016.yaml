base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: pt
  text: Isso será como sinal em sua mão e como frontais[a] entre seus olhos[b], pois, com mão forte, Yahweh nos tirou do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faixas”; tradicionalmente, “filactérios”. O termo hebraico é raro e provavelmente se refere a algo usado na parte frontal da cabeça como lembrete.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “entre seus olhos”, expressão muitas vezes entendida como “na sua testa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Isso servirá
  rationale: O perfeito com conjunção tem valor futuro/resultativo neste contexto instrutivo. “Servirá” expressa de modo natural a função contínua do sinal.
- source_word: לְאוֹת
  choice: de sinal
  rationale: אוֹת designa um sinal, marca ou memorial. “Sinal” mantém a amplitude do termo hebraico.
- source_word: עַל יָדְכָה
  choice: na sua mão
  rationale: Preserva o substantivo hebraico “mão”, sem substituí-lo interpretativamente por “braço”.
- source_word: וּלְטוֹטָפֹת
  choice: de frontais
  rationale: טוֹטָפֹת é um termo raro, provavelmente referente a algo usado na parte frontal da cabeça. “Frontais” preserva essa provável referência sem impor a designação ritual posterior “filactérios”.
- source_word: בֵּין עֵינֶיךָ
  choice: entre os seus olhos
  rationale: Mantém literalmente a imagem hebraica; a interpretação idiomática “na testa” é registrada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para o sinal e liga as duas orações com naturalidade em português.
- source_word: בְּחֹזֶק יָד
  choice: com mão forte
  rationale: Reproduz de perto a expressão hebraica e comunica a força da ação divina sem intensificação desnecessária.
- source_word: הוֹצִיאָנוּ
  choice: nos tirou
  rationale: O hifil de יצא significa fazer sair ou tirar; esta formulação é clara e idiomática no contexto do êxodo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Com “nos tirou”, esta é a construção portuguesa natural para indicar a procedência.
theological_decisions:
- issue: Se a linguagem da mão e dos olhos deve ser interpretada no texto principal como objetos rituais posteriores
  choice: Manter a imagem concreta — “na sua mão” e “frontais entre os seus olhos”
  alternative: Traduzir especificamente como “filactérios” ou parafrasear tudo como um lembrete figurado
  rationale: O hebraico não identifica explicitamente a prática ritual posterior e deixa aberta a relação entre sentido literal e simbólico. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Frontais” é deliberadamente menos comum, mas conserva a raridade e a provável referência concreta do hebraico; as alternativas são esclarecidas em nota.
