  - severity: low
    issue: As chamadas de nota aparecem juntas ao fim da expressão, sem ancoragem imediata em «frontais» e «entre seus olhos».
    rationale: Cada nota trata de um segmento distinto; posicioná-las junto aos respectivos segmentos melhora a rastreabilidade lexical.
  - severity: low
    issue: A construção clivada «foi com mão forte que Yahweh nos tirou» acrescenta foco enfático.
    rationale: Uma ordem direta conserva melhor a sobriedade da construção hebraica, que simplesmente caracteriza o modo da ação.
