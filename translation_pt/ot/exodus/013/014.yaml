  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of slaves.’
translation:
  language: pt
  text: 'E, quando no futuro seu filho lhe perguntar: “O que significa isto?”, você lhe dirá: “Com mão poderosa, o SENHOR nos tirou do Egito, da casa da escravidão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: no futuro
  rationale: Embora signifique literalmente “amanhã”, aqui o termo aponta idiomaticamente para um tempo posterior, quando o filho vier a perguntar.
- source_word: בְּחֹזֶק יָד
  choice: Com mão poderosa
  rationale: Reproduz a metáfora hebraica da mão e comunica naturalmente a força irresistível da ação divina.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o tetragrama por SENHOR em versaletes.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa da escravidão
  rationale: Preserva a metáfora hebraica para o Egito como lugar e sistema de servidão, em formulação idiomática e reconhecível em português.
theological_decisions:
- issue: Identificação comunitária na expressão הוֹצִיאָנוּ (“nos tirou”)
  choice: nos tirou
  alternative: tirou os nossos antepassados
  rationale: Mantém a identificação litúrgica e geracional do texto, sem explicitar uma referência ancestral que o hebraico não declara.
- issue: Representação do nome divino יהוה
  choice: o SENHOR
  alternative: YHWH / Javé
  rationale: A convenção tradicional evita impor uma vocalização disputada e preserva a distinção editorial por meio de versaletes.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pergunta foi vertida como “O que significa isto?” porque o contexto trata do sentido do rito, sem alterar sua força direta.
