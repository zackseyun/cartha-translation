base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: pt
  text: 'Então Moisés disse ao povo: “Lembrem-se deste dia, em que vocês saíram do Egito, da casa de escravos[a], pois Yahweh os tirou de lá com mão forte[b]; e não se comerá nada fermentado[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da casa da escravidão”. Em hebraico, literalmente, “da casa de escravos”, expressão que descreve o Egito como lugar de escravização.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com mão poderosa”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não se comerá pão fermentado”. O termo hebraico também pode ter o sentido mais amplo de algo fermentado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Lembrem-se
  rationale: O imperativo singular hebraico se dirige ao povo como coletividade. Em português corrente, o plural concorda naturalmente com “vocês”, mantendo a força memorial e imperativa.
- source_word: הַיּוֹם הַזֶּה
  choice: deste dia
  rationale: Reproduz de modo natural a construção definida com demonstrativo, sem acrescentar ênfase ausente do hebraico.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: vocês saíram do Egito
  rationale: יצא indica sair; a formulação é direta e idiomática em português.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Preserva a imagem concreta e o substantivo plural עֲבָדִים. A expressão é um idiomatismo que caracteriza o Egito como lugar de escravização.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para guardar o dia na memória; “pois” mantém com naturalidade a relação causal.
- source_word: בְּחֹזֶק יָד
  choice: com mão forte
  rationale: Tradução próxima do idioma hebraico para a ação poderosa de Deus; conserva a imagem da mão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto, em vez de substituí-lo por um título.
- source_word: הוֹצִיא ... אֶתְכֶם מִזֶּה
  choice: os tirou de lá
  rationale: O hifil de יצא tem sentido causativo, “fazer sair/tirar”; “de lá” retoma o Egito e a casa de escravos.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: e não se comerá nada fermentado
  rationale: A construção impessoal preserva o valor passivo da proibição. חָמֵץ pode designar de modo mais amplo aquilo que é fermentado, não apenas pão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original apresenta o Tetragrama como nome próprio. “Yahweh” preserva essa função sem substituí-la por um título.
- issue: Condição de Israel em מִבֵּית עֲבָדִים
  choice: casa de escravos
  alternative: casa de escravidão; casa de servos
  rationale: “Escravos” expressa claramente a condição real de sujeição e preserva a metáfora concreta do hebraico; “servos” poderia atenuá-la.
- issue: Extensão de חָמֵץ
  choice: nada fermentado
  alternative: pão fermentado; fermento
  rationale: O termo pode referir-se ao que contém fermento ou está fermentado. A formulação escolhida mantém o alcance amplo sem limitar a proibição exclusivamente ao pão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para tornar natural a referência plural de יְצָאתֶם e do sufixo em אֶתְכֶם. Mantém a metáfora hebraica “casa de escravos” e a expressão “mão forte”, esclarecendo alternativas em notas.
