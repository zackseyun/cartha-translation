source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: pt
  text: E aconteceu que, como o faraó se recusou obstinadamente a nos deixar partir, Yahweh matou todos os primogênitos na terra do Egito, desde o primogênito dos seres humanos até o primogênito dos animais. Por isso, sacrifico a Yahweh todo macho que abre o ventre, mas resgato todo filho primogênito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה
  choice: se recusou obstinadamente
  rationale: No contexto, o hifil de קשׁה com o infinitivo 'deixar partir' expressa resistência obstinada; a formulação comunica isso com naturalidade em português.
- source_word: לְשַׁלְּחֵנוּ
  choice: a nos deixar partir
  rationale: שׁלח, no refrão do êxodo, significa permitir que o povo saia ou libertá-lo; 'deixar partir' preserva esse sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּכוֹר
  choice: primogênito
  rationale: Equivalente tradicional e preciso para o primeiro nascido, mantido de modo coerente ao longo do versículo.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: desde o primogênito dos seres humanos até o primogênito dos animais
  rationale: אָדָם é genérico e contrasta a humanidade com os animais; esta redação moderna evita que 'homem' seja entendido apenas como indivíduo masculino.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de maneira natural a relação de consequência entre a morte dos primogênitos e a prática de sacrifício e resgate.
- source_word: זֹבֵחַ
  choice: sacrifico
  rationale: זבח designa oferecer em sacrifício, normalmente mediante abate; 'sacrifico' é conciso e adequado ao contexto ritual.
- source_word: פֶּטֶר רֶחֶם
  choice: que abre o ventre
  rationale: Preserva de perto a imagem idiomática hebraica para a primeira cria que sai do útero.
- source_word: הַזְּכָרִים
  choice: todo macho
  rationale: Identifica distributivamente os descendentes machos entre os que abrem o ventre, conforme o hebraico.
- source_word: בָּנַי
  choice: meus filhos
  rationale: O hebraico emprega especificamente o substantivo masculino plural 'filhos', e não um termo genérico para crianças.
- source_word: אֶפְדֶּה
  choice: resgato
  rationale: פדה, neste contexto legal e cultual, indica livrar mediante substituição ou pagamento; 'resgatar' é claro em português e conserva o sentido.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor / Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido genérico de אָדָם em contraste com בְּהֵמָה
  choice: seres humanos
  alternative: homem / humanidade
  rationale: Aqui אָדָם abrange seres humanos em contraste com animais; a escolha mantém a abrangência do referente sem acrescentar uma distinção de sexo ausente do contexto.
- issue: Relação entre sacrifício e resgate dos primogênitos
  choice: contraste explícito com “mas”
  alternative: coordenação simples com “e”
  rationale: 'Embora o hebraico use וְ em ambos os membros, o contraste contextual é real: os machos animais são sacrificados, enquanto os filhos são resgatados. ''Mas'' torna essa relação clara sem alterar a prática descrita.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a fórmula narrativa 'E aconteceu que', o nome Yahweh e a imagem cultual 'abre o ventre'. Não há marcadores de nota porque nenhuma nota foi necessária.
