revisions:
- from: E aconteceu que, como o faraó se recusou obstinadamente a nos deixar partir, Yahweh matou todos os primogênitos na terra do Egito, desde o primogênito dos seres humanos até o primogênito dos animais. Por isso, sacrifico a Yahweh todo macho que abre o ventre, mas resgato todo primogênito de meus filhos.
  to: E aconteceu que, como o faraó se recusou obstinadamente a nos deixar partir, Yahweh matou todos os primogênitos na terra do Egito, desde o primogênito dos seres humanos até o primogênito dos animais. Por isso, sacrifico a Yahweh todo macho que abre o ventre, mas resgato todo filho primogênito.
  rationale: 'Foi feita uma única correção segura: substituiu-se «todo primogênito de meus filhos» por «todo filho primogênito», a fim de expressar claramente que se trata dos filhos primogênitos do israelita, e não dos primogênitos de seus filhos. Não há nota textual ou lexical que exija marcador neste versículo.'
