base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: pt
  text: A coluna de nuvem durante o dia e a coluna de fogo durante a noite não se afastavam da frente do povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não saíam da frente do povo”. O verbo hebraico ressalta que as colunas orientadoras permaneciam continuamente presentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: não se afastavam
  rationale: O verbo מוּשׁ expressa remoção ou afastamento. A forma no singular antecede um sujeito composto coordenado, construção possível em hebraico; em português natural, emprega-se o plural. A expressão também comunica a presença contínua das colunas.
- source_word: עַמּוּד
  choice: coluna
  rationale: “Coluna” representa com clareza a forma vertical da manifestação e soa natural em português contemporâneo.
- source_word: הֶעָנָן
  choice: nuvem
  rationale: Equivalente direto de עָנָן; a construção “coluna de nuvem” preserva a imagem concreta.
- source_word: יוֹמָם
  choice: durante o dia
  rationale: O advérbio indica o período diurno e forma um paralelo claro e natural com “durante a noite”.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: e a coluna de fogo
  rationale: Preserva o paralelismo com “a coluna de nuvem” e a imagem concreta do fogo.
- source_word: לָיְלָה
  choice: durante a noite
  rationale: Acusativo adverbial de tempo, traduzido de maneira corrente e paralela a “durante o dia”.
- source_word: לִפְנֵי
  choice: da frente de
  rationale: Com o verbo de afastamento, indica movimento para longe da posição diante do povo. “Da frente de” conserva a relação espacial em português natural.
- source_word: הָעָם
  choice: o povo
  rationale: Substantivo coletivo definido que, no contexto, se refere corporativamente a Israel.
