  text: מַצּוֹת֙ יֵֽאָכֵ֔ל אֵ֖ת שִׁבְעַ֣ת הַ/יָּמִ֑ים וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֜ חָמֵ֗ץ וְ/לֹֽא יֵרָאֶ֥ה לְ/ךָ֛ שְׂאֹ֖ר בְּ/כָל גְּבֻלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: pt
  text: Durante os sete dias, deve-se comer pão sem fermento. Não se verá entre vocês[a] nada fermentado[b], nem se verá fermento em todo o território de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não será visto com você”. A expressão indica que nenhuma dessas coisas deve permanecer na posse ou no domínio do povo durante os sete dias.
    reason: lexical_alternative
  - marker: b
    text: Ou “coisa levedada”. O hebraico חָמֵץ designa aquilo que foi fermentado, enquanto שְׂאֹר, na oração seguinte, se refere mais especificamente ao próprio agente fermentador.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצּוֹת
  choice: pão sem fermento
  rationale: No contexto da Páscoa, designa pães preparados sem agente fermentador. A expressão é clara em português moderno e conserva o sentido ritual.
- source_word: יֵאָכֵל
  choice: deve-se comer
  rationale: O nifal imperfeito tem forma passiva, literalmente “será comido”. Em português, a construção impessoal comunica de modo natural a prescrição legal sem transformá-la numa ordem direta mais enfática.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: durante os sete dias
  rationale: O acusativo de duração abrange todo o período de sete dias.
- source_word: יֵרָאֶה לְךָ
  choice: não se verá entre vocês
  rationale: Conserva o verbo passivo “ser visto” e expressa de modo compreensível a ideia contextual de que o item não deve estar presente no meio, na posse ou no domínio do povo. O singular hebraico dirige-se coletivamente a Israel; o plural português torna esse destinatário coletivo mais natural.
- source_word: חָמֵץ
  choice: nada fermentado
  rationale: חָמֵץ pode designar aquilo que foi levedado ou fermentado, e não apenas pão. Esta formulação preserva seu alcance e o distingue de שְׂאֹר, o agente fermentador mencionado em seguida.
- source_word: שְׂאֹר
  choice: fermento
  rationale: Refere-se mais especificamente ao agente ou massa fermentadora. “Fermento” é o equivalente amplo e corrente em português, sem restringir indevidamente o método antigo a fermento industrial moderno.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: em todo o território de vocês
  rationale: A expressão abrange toda a área dentro dos limites do povo. “Território” comunica esse alcance melhor que a tradução concreta “fronteiras”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Empregou-se o plural para tornar explícito o destinatário coletivo do singular hebraico, e manteve-se a distinção lexical entre o produto fermentado e o agente fermentador.
