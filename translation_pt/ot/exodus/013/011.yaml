id: EXO.13.11
reference: Exodus 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: pt
  text: E, quando[a] Yahweh levar você à terra dos cananeus, como jurou a você e a seus pais[b], e a der a você,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “E acontecerá que, quando”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a seus antepassados”; em hebraico, literalmente: “a seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E, quando
  rationale: A construção introduz uma circunstância futura. “E, quando” comunica naturalmente a força temporal e mantém a ligação com o contexto anterior, sem reproduzir de modo rígido o idiomatismo hebraico.
- source_word: יְבִיאֲךָ
  choice: levar você
  rationale: O hifil de בוא significa fazer alguém ir ou entrar. Em português, “levar você à terra” é natural neste contexto de movimento rumo ao destino prometido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: à terra dos cananeus
  rationale: Expressa o movimento em direção à terra e traduz diretamente a designação gentílica coletiva הַכְּנַעֲנִי.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz de maneira concisa a correspondência entre a futura ação de Yahweh e o juramento anteriormente feito.
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O nifal de שׁבע tem o sentido usual de jurar ou fazer juramento; “jurou” é direto e natural.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: a você e a seus pais
  rationale: Preserva os dois complementos do juramento e traduz literalmente אָבוֹת por “pais”, deixando em nota a possível extensão semântica a “antepassados”.
- source_word: וּנְתָנָהּ לָךְ
  choice: e a der a você
  rationale: O pronome feminino retoma “terra”. O futuro do subjuntivo acompanha naturalmente a oração temporal iniciada por “quando” e mantém a ação futura.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Referente de לַאֲבֹתֶיךָ
  choice: a seus pais
  alternative: a seus antepassados
  rationale: “Pais” mantém a forma concreta do hebraico, enquanto a nota reconhece que o termo pode abranger os ancestrais patriarcais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe preserva o caráter incompleto da oração, que continua no versículo seguinte, e evita explicitar relações que o hebraico deixa implícitas.
