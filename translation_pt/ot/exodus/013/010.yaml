  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: pt
  text: Você deverá observar este estatuto no tempo determinado, de ano em ano[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «de dias a dias», expressão idiomática geralmente entendida aqui como «de ano em ano».'
