lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Você deverá observar
  rationale: Em contexto legal e cultual, שׁמר expressa a obrigação contínua de cumprir ou observar uma prescrição. «Deverá observar» comunica com naturalidade em português moderno tanto a força normativa quanto a continuidade.
- source_word: הַחֻקָּה הַזֹּאת
  choice: este estatuto
  rationale: חֻקָּה designa uma prescrição fixa ou norma estabelecida. «Estatuto» preserva o tom formal da legislação da aliança sem introduzir conotação eclesiástica específica.
- source_word: לְמוֹעֲדָהּ
  choice: no tempo determinado
  rationale: מוֹעֵד refere-se a um tempo ou ocasião fixada. O sufixo pronominal relaciona esse tempo à observância mencionada; «no tempo determinado» transmite de modo conciso sua força calendárica.
- source_word: מִיָּמִים יָמִימָה
  choice: de ano em ano
  rationale: A expressão hebraica significa literalmente «de dias a dias», mas, neste contexto de celebração anual, funciona idiomaticamente como «de ano em ano». A forma literal é preservada em nota.
