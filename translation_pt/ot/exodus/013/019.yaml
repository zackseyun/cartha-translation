  to: 'Moisés levou consigo os ossos de José, pois José havia feito os filhos de Israel jurarem solenemente: “Deus certamente intervirá em favor de vocês[a], e vocês levarão daqui os meus ossos com vocês.”'
  rationale: A revisão limita-se a substituir «então levem» por «e vocês levarão», evitando uma consequência não marcada no original e preservando melhor a força futura e obrigacional da cláusula no contexto do juramento.
