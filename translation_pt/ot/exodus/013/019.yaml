    issue: «então levem»
    rationale: O hebraico tem a conjunção פשוטa וְ seguida de uma forma com valor futuro/obrigacional no contexto do juramento. «Então» acrescenta uma relação consecutiva, e o imperativo «levem» altera levemente a modalidade da formulação. «E vocês levarão» reproduz melhor o encadeamento e o valor da fala citada.
