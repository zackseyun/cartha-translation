base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: pt
  text: 'Moisés levou consigo os ossos de José, pois José havia feito os filhos de Israel jurarem solenemente: “Deus certamente intervirá em favor de vocês[a], e vocês levarão daqui os meus ossos com vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus certamente visitará vocês”. O idioma hebraico pode indicar a intervenção decisiva de Deus em favor do seu povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: levou
  rationale: Neste contexto de deslocamento, o verbo לקח é expresso naturalmente por “levou”, sem perder o sentido narrativo de tomar consigo.
- source_word: עַצְמוֹת יוֹסֵף
  choice: os ossos de José
  rationale: Mantém a concretude e a precisão do hebraico, em vez do mais interpretativo “restos mortais”.
- source_word: עִמּוֹ
  choice: consigo
  rationale: 'Forma idiomática e concisa em português para a ideia de acompanhamento: Moisés levou os ossos com ele.'
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: havia feito ... jurarem solenemente
  rationale: Preserva o sentido causativo do Hifil e a ênfase da combinação do infinitivo absoluto com o verbo finito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão familiar explícita do hebraico e é reconhecível e natural em português bíblico contemporâneo.
- source_word: פָּקֹד יִפְקֹד
  choice: certamente intervirá em favor de
  rationale: A construção enfática assegura a ação divina; no contexto, o verbo פקד indica atenção efetiva e intervenção favorável, não mera observação.
- source_word: וְהַעֲלִיתֶם
  choice: então levem
  rationale: No contexto do juramento, o perfeito com waw tem força consequencial e obrigacional. “Levem” comunica naturalmente a incumbência; a direção de saída/subida está contextualizada por “daqui”.
- source_word: עַצְמֹתַי מִזֶּה אִתְּכֶם
  choice: daqui os meus ossos com vocês
  rationale: Preserva os elementos concretos, dêiticos e de acompanhamento presentes no hebraico, em ordem natural no português.
theological_decisions:
- issue: Sentido de פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Deus certamente intervirá em favor de vocês
  alternative: Deus certamente visitará vocês
  rationale: A tradução principal comunica a atenção divina que resulta em ação libertadora sem limitar indevidamente seu modo. A nota preserva a metáfora mais literal e a amplitude do idioma hebraico.
- issue: Referente de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A expressão familiar do texto-fonte é mantida, sem negar que a referência corporativa alcance os descendentes de Israel como povo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta usa “vocês”, natural no português brasileiro e inteligível internacionalmente. A construção evita arcaísmos, mas conserva “filhos de Israel” e “ossos” por fidelidade à forma concreta e familiar do hebraico.
