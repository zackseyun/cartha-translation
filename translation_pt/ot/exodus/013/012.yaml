  text: וְ/הַעֲבַרְתָּ֥ כָל פֶּֽטֶר רֶ֖חֶם לַֽ/יהֹוָ֑ה וְ/כָל פֶּ֣טֶר שֶׁ֣גֶר בְּהֵמָ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ הַ/זְּכָרִ֖ים לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: pt
  text: você separará para Yahweh todo aquele que abre o ventre[a] e toda primeira cria dos animais que você tiver[b]; os machos pertencerão a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo o que abre o ventre”; isto é, o primeiro nascido.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica se refere à primeira cria nascida entre os animais domésticos; a frase final especifica os machos como pertencentes a Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: você separará
  rationale: O hifil de עבר significa literalmente fazer passar ou transferir; neste contexto cultual, indica destinar ou consagrar a Yahweh. “Separará” comunica isso de modo claro sem apagar a imagem de transferência.
- source_word: פֶּטֶר רֶחֶם
  choice: todo aquele que abre o ventre
  rationale: Preserva o idioma hebraico “o que abre o ventre”, que designa o primeiro nascido, mantendo sua precisão jurídica e cultual.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Mantém o nome divino יהוה como Yahweh e expressa a destinação cultual.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: toda primeira cria do rebanho
  rationale: שֶׁגֶר se refere à cria ou prole dos animais, e פֶּטֶר indica a primeira saída do ventre. A formulação é natural em português e preserva a referência ao nascimento animal.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: que você tiver
  rationale: Expressa de maneira idiomática a posse indicada pela construção hebraica.
- source_word: הַזְּכָרִים
  choice: os machos
  rationale: O plural definido identifica, entre as primeiras crias mencionadas, aquelas que são do sexo masculino; mantê-lo como expressão independente reflete a sintaxe hebraica e evita fazer de “macho” um modificador antecipado.
- source_word: לַיהוָה
  choice: pertencem a Yahweh
  rationale: Explicita em português natural a força de posse e consagração da frase nominal final.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança e segue a orientação fornecida.
- issue: Relação de הַזְּכָרִים com as primeiras crias
  choice: os machos pertencem a Yahweh
  alternative: toda primeira cria macho do rebanho pertence a Yahweh
  rationale: A formulação mantém a referência gramatical aos machos entre as primeiras crias e preserva a leve tensão da sintaxe hebraica, sem sugerir que toda primeira cria, independentemente do sexo, deva ser consagrada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém o nome Yahweh e conserva a imagem hebraica de “abrir o ventre”. Os marcadores foram colocados junto às expressões que explicam.
