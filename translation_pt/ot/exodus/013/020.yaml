  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: pt
  text: Partiram de Sucote e acamparam em Etã, à beira do deserto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: 'O wayyiqtol plural de נסע apresenta a ação narrativa seguinte: levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.'
- source_word: מִסֻּכֹּת
  choice: de Sucote
  rationale: O nome próprio סֻכּוֹת, precedido por מִן, indica o ponto de partida. A forma tradicional portuguesa “Sucote” preserva o topônimo por transliteração.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה significa montar ou estabelecer acampamento. “Acamparam” é a equivalência moderna e direta.
- source_word: בְאֵתָם
  choice: em Etã
  rationale: A preposição בְ marca localização. “Em Etã” é idiomático em português para o lugar onde o povo acampou; “Etã” translitera o topônimo hebraico.
- source_word: בִּקְצֵה
  choice: à beira de
  rationale: קָצֶה pode indicar extremidade, limite ou borda. No contexto geográfico, “à beira de” comunica naturalmente a posição junto ao limite da região.
- source_word: הַמִּדְבָּר
  choice: o deserto
  rationale: מִדְבָּר designa uma região erma ou pouco habitada, não necessariamente um deserto arenoso. Em português bíblico corrente, “deserto” é claro e pode abranger esse sentido mais amplo.
