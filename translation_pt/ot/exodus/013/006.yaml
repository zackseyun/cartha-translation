  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: pt
  text: Durante sete dias, você comerá pães sem fermento; e, no sétimo dia, haverá uma festa[a] para Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma celebração religiosa”.'
    reason: Alternativa lexical para חַג, que pode designar uma festa ou celebração cultual.
  - marker: b
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Identificação do nome divino e indicação da tradução tradicional alternativa.
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: A locução construta expressa duração; “durante” explicita esse valor e soa natural em português moderno.
- source_word: תֹּאכַל
  choice: você comerá
  rationale: O imperfeito qal na segunda pessoa masculina singular tem força diretiva neste contexto de instrução. O futuro em português conserva o tom prescritivo sem intensificá-lo com “deverá”.
- source_word: מַצֹּת
  choice: pães sem fermento
  rationale: O plural hebraico designa os pães não fermentados próprios desta celebração. A expressão é clara e evita uma transliteração desnecessária.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: e, no sétimo dia
  rationale: O waw é aditivo, e a locução preposicional situa temporalmente a oração seguinte.
- source_word: חַג
  choice: uma festa
  rationale: O termo denota uma celebração religiosa, possivelmente com conotações de peregrinação. “Festa” é natural e mantém o caráter celebrativo e sagrado.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: 'A preposição ל indica relação ou dedicação: a festa é celebrada em honra de Yahweh. O nome divino é transliterado, em vez de substituído por um título.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta diretamente o tetragrama, o nome pactual divino. “Yahweh” o preserva como nome próprio, enquanto “SENHOR” representa a leitura substitutiva tradicional.
- issue: Relação expressa por ל em חַג לַיהוָה
  choice: festa para Yahweh
  alternative: festa de Yahweh
  rationale: “Para” preserva a ideia provável de dedicação ou celebração dirigida a Yahweh sem definir além do que a construção hebraica permite.
translation_notes:
  register: Português moderno, claro e digno, com “você” para tornar explícita a segunda pessoa singular e favorecer a leitura brasileira. O ponto e vírgula separa as duas instruções relacionadas. “Haverá” explicita em português a oração nominal elíptica do hebraico sem alterar seu sentido.
