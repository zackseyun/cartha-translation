language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: pt
  text: Assim, Deus fez o povo dar a volta pelo caminho do deserto, rumo ao Mar dos Juncos[a]; e os filhos de Israel subiram da terra do Egito armados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mar Vermelho”. O nome hebraico significa literalmente “Mar dos Juncos”.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico é incerto; também pode significar “preparados para a batalha”, “em ordem de batalha” ou, de modo mais geral, “organizados em fileiras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: fez o povo dar a volta
  rationale: O hifil de סבב expressa que Deus fez o povo seguir uma rota indireta; a formulação preserva a agência divina e soa natural em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O referente é singular, como indica também o verbo singular.
- source_word: הָעָם
  choice: o povo
  rationale: Designa coletivamente Israel durante a saída do Egito.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: pelo caminho do deserto
  rationale: Preserva a ideia de rota expressa por דֶּרֶךְ, sem reduzir a frase simplesmente a 'pelo deserto'.
- source_word: יַם סוּף
  choice: Mar dos Juncos
  rationale: Traduz diretamente os componentes hebraicos, em vez de adotar no texto principal a identificação tradicional 'Mar Vermelho'.
- source_word: וַחֲמֻשִׁים
  choice: armados
  rationale: É uma tradução concisa e plausível do termo difícil, cuja possível referência a formação ou organização militar é registrada em nota.
- source_word: עָלוּ
  choice: saíram
  rationale: Neste contexto de êxodo, traduz idiomaticamente o movimento de subida para fora do Egito sem impor uma referência topográfica específica.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a forma masculina plural da expressão hebraica e seu sentido corporativo.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Reproduz de perto a origem indicada pela preposição e pelo substantivo hebraicos.
theological_decisions:
- issue: Tradução de יַם סוּף
  choice: Mar dos Juncos
  alternative: Mar Vermelho
  rationale: A tradução principal segue o sentido lexical mais direto do hebraico; a forma tradicional e familiar é preservada em nota, sem identificar dogmaticamente a localização.
- issue: Tradução de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha preserva a forma da expressão hebraica, embora ela se refira corporativamente ao povo de Israel.
- issue: Sentido de וַחֲמֻשִׁים
  choice: armados
  alternative: organizados em formação / preparados para a batalha
  rationale: Como o sentido exato do termo é discutido, o texto adota uma opção provável e concisa, enquanto a nota conserva alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'fez o povo dar a volta' comunica a rota indireta; 'rumo ao' evita sugerir mais do que a sintaxe permite quanto à relação exata entre o caminho do deserto e o mar. As notas aparecem na ordem [a], [b] e cada marcador está presente no texto.
