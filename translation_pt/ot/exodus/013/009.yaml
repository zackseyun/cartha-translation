  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: pt
  text: Isto será para você um sinal na sua mão e um memorial entre os seus olhos[a], para que a lei de Yahweh[b] esteja na sua boca; pois, com mão forte[c], Yahweh tirou você do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é literalmente “entre os seus olhos”; pode ser entendida idiomaticamente como “na sua testa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a instrução de Yahweh”. O hebraico torá pode significar “lei” ou “instrução”, conforme o contexto.
    reason: lexical_alternative
  - marker: c
    text: Ou “com mão poderosa”, formulação tradicional para esta expressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E isso será
  rationale: O perfeito com waw tem valor prospectivo neste contexto de instrução; “será” expressa naturalmente a função que a celebração deverá cumprir.
- source_word: לְאוֹת
  choice: como sinal
  rationale: “Sinal” preserva a amplitude de אוֹת, sem decidir se a imagem é estritamente física ou simbólica.
- source_word: עַל יָדְךָ
  choice: na sua mão
  rationale: Mantém a referência literal à mão e não introduz explicitamente a prática posterior dos tefilin.
- source_word: וּלְזִכָּרוֹן
  choice: e como memorial
  rationale: “Memorial” conserva o peso comemorativo e pactual do substantivo, embora “lembrança” também seja possível.
- source_word: בֵּין עֵינֶיךָ
  choice: entre os seus olhos
  rationale: Reproduz a formulação hebraica concreta; “na testa” é uma explicação idiomática possível, indicada em nota.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz com naturalidade a finalidade expressa pela oração hebraica.
- source_word: תּוֹרַת יְהוָה
  choice: a lei de Yahweh
  rationale: “Lei” é uma tradução contextual legítima e reconhecível de תּוֹרָה; “instrução” permanece como alternativa para preservar a amplitude semântica.
- source_word: בְּפִיךָ
  choice: na sua boca
  rationale: Mantém a imagem hebraica de recitação e confissão oral, que é compreensível em português.
- source_word: כִּי
  choice: pois
  rationale: Marca a fundamentação explicativa da finalidade anterior.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Segue de perto o hebraico; “mão poderosa” é uma alternativa portuguesa tradicional e idiomática.
- source_word: הוֹצִאֲךָ
  choice: tirou você
  rationale: Expressa de modo natural o hifil de יצא, isto é, fazer sair ou retirar do Egito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Caráter literal ou interpretativo da linguagem da mão e dos olhos
  choice: Conservar “na sua mão” e “entre os seus olhos” no texto principal.
  alternative: Explicitar “no braço” e “na testa” como referência aos tefilin, ou parafrasear toda a imagem como lembrança interior.
  rationale: O hebraico apresenta imagens concretas, mas não nomeia os objetos rituais posteriores nem limita a linguagem a uma metáfora interior. A tradução mantém essa abertura interpretativa.
- issue: Sentido de תּוֹרָה neste contexto
  choice: Traduzir por “lei” no texto principal.
  alternative: “Instrução” ou “Torá”.
  rationale: “Lei” é adequada ao contexto pactual e pertence ao campo semântico do termo, enquanto a nota registra “instrução” para não ocultar sua extensão semântica.
- issue: Representação do nome divino יהוה
  choice: Usar “Yahweh”.
  alternative: “SENHOR” ou “Jeová”.
  rationale: A transliteração preserva no texto o caráter de nome próprio da forma hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de boa legibilidade brasileira. O singular de segunda pessoa foi vertido por “você/sua” para conservar o destinatário individual do hebraico sem recorrer ao registro arcaizante de “tu”. A ordem das notas foi alinhada à posição de seus marcadores no texto.
