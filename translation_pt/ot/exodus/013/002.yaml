  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: pt
  text: Consagre para mim todo primogênito, todo o que abre a madre entre os filhos de Israel, entre os seres humanos e entre os animais; ele é meu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: Consagre
  rationale: O imperativo de קדשׁ ordena separar alguém ou algo para Deus como santo. “Consagre” é corrente, digno e preserva a força religiosa do termo.
- source_word: לִי
  choice: a mim
  rationale: A preposição ל indica aqui dedicação dirigida a Deus; “consagre a mim” mantém essa relação sem reduzir a expressão apenas à ideia de benefício.
- source_word: כָל בְּכוֹר
  choice: todo primogênito
  rationale: בכור significa “primogênito”. O texto não acrescenta explicitamente “macho”, por isso essa especificação não foi introduzida.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: aquele que primeiro abre cada ventre
  rationale: A expressão define o primogênito como o primeiro a abrir o ventre. A formulação conserva a imagem hebraica e torna explícita a função apositiva da frase.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Reproduz a forma hebraica de modo compreensível e preserva a designação coletiva tradicional, sem a converter simplesmente em “israelitas”.
- source_word: בָּאָדָם
  choice: entre os seres humanos
  rationale: אָדָם é um singular coletivo que, neste contexto, designa a categoria humana em contraste com os animais. “Seres humanos” comunica claramente esse valor representativo em português atual.
- source_word: וּבַבְּהֵמָה
  choice: e entre os animais
  rationale: בְּהֵמָה designa animal ou besta, frequentemente animal doméstico em contextos legais. “Animais” preserva o contraste geral sem restringir indevidamente o termo a rebanhos.
- source_word: לִי הוּא
  choice: ele é meu
  rationale: A cláusula final afirma enfaticamente a posse divina. O pronome masculino retoma “todo primogênito” e conserva a concisão do hebraico.
theological_decisions:
- issue: Uso representativo de אָדָם em contraste com בְּהֵמָה
  choice: seres humanos
  alternative: homem
  rationale: O singular hebraico é coletivo e contrasta a humanidade com os animais, não especificamente o sexo masculino com os animais. A tradução principal explicita esse sentido em português moderno, enquanto a nota preserva a forma singular mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a repetição de “entre” correspondente à preposição hebraica em cada categoria e evita acrescentar “macho”, ausente do versículo.
