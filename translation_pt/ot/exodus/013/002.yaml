revisions:
- from: Consagre a mim todo primogênito, aquele que primeiro abre cada ventre entre os filhos de Israel, entre os seres humanos[a] e entre os animais; ele é meu.
  to: Consagre para mim todo primogênito, todo o que abre a madre entre os filhos de Israel, entre os seres humanos e entre os animais; ele é meu.
  rationale: A revisão torna a regência portuguesa idiomática («para mim»), substitui a formulação pouco natural e potencialmente imprecisa «primeiro abre cada ventre» pela fórmula estabelecida «abre a madre» e ajusta a nota para representar os dois singulares coletivos hebraicos. Mantêm-se o alcance do texto, a repetição de «entre», a ausência de «macho» e a ambiguidade inclusiva de אָדָם.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:51:35Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o imperativo de consagração, a abrangência de «todo primogênito», a definição pelo que abre a madre, o âmbito dos filhos de Israel, o contraste seres humanos/animais e a declaração de posse divina. Contudo, «a mim» não é a regência portuguesa mais natural para a dedicação expressa por לִי; «para mim» comunica adequadamente a destinação. «Cada ventre» também sugere indevidamente cada ventre individual, enquanto a expressão hebraica é a fórmula coletiva para o que abre a madre.
  naturalness: «Consagre a mim» soa pouco idiomático no português moderno neste contexto. «Consagre para mim» é claro e natural. «Todo o que abre a madre» é uma formulação bíblica estabelecida e inteligível, que evita a estranheza de «aquele que primeiro abre cada ventre» sem perder o sentido da expressão hebraica.
  terminology: «Primogênito», «consagre», «filhos de Israel» e «animais» são adequados. «Madre» preserva a terminologia jurídica-cultual tradicional da passagem e é mais preciso aqui do que «cada ventre». A nota deve refletir que tanto אָדָם como בְּהֵמָה estão no singular coletivo no hebraico.
  issues:
  - severity: medium
    issue: Regência de «Consagre a mim»
    rationale: Embora compreensível por influência formal do hebraico, a construção não é idiomática para a ideia de dedicar algo a Deus em português. «Consagre para mim» preserva a direção/destinação de לִי.
  - severity: medium
    issue: «aquele que primeiro abre cada ventre»
    rationale: «Cada ventre» não reproduz naturalmente a fórmula coletiva פטר כל רחם e pode dar a impressão de uma ação relativa a todos os ventres. «Todo o que abre a madre» mantém a expressão definidora de primogênito e seu uso jurídico-cultual.
  - severity: low
    issue: Nota de rodapé não espelha plenamente os singulares coletivos do hebraico
    rationale: A alternativa proposta traz «homem» no singular, mas «animais» no plural. Uma nota que use «o ser humano e o animal» descreve com maior precisão a forma hebraica, sem alterar o texto principal.
  revised_text: Consagre para mim todo primogênito, todo o que abre a madre entre os filhos de Israel, entre os seres humanos e entre os animais; ele é meu.
  revised_footnotes:
  - marker: a
    text: 'Ou: “entre o ser humano e entre o animal”. O hebraico emprega substantivos no singular com sentido coletivo para a humanidade e os animais.'
    reason: lexical_alternative
