reference: Exodus 13:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִגַּדְתָּ֣ לְ/בִנְ/ךָ֔ בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר בַּ/עֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהוָה֙ לִ֔/י בְּ/צֵאתִ֖/י מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: pt
  text: 'E naquele dia você contará a seu filho: “É por causa disto que Yahweh agiu em meu favor quando saí do Egito”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh fez isto por mim quando saí do Egito”. No hebraico, “isto” pode estar ligado à razão desta celebração ou, mais diretamente, àquilo que Yahweh fez.'
    reason: alternativa sintática e lexical
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: E ... você contará
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. “Você contará” é natural, claro e preserva o caráter instrutivo da forma verbal.
- source_word: לְבִנְךָ
  choice: a seu filho
  rationale: A preposição ל marca o objeto indireto. “A seu filho” preserva o singular masculino do hebraico sem tornar a frase pouco natural.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal corrente que mantém a força demonstrativa do original.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: O infinitivo introduz o conteúdo da fala. Em português, os dois-pontos expressam essa função com maior naturalidade do que o literal “dizendo”.
- source_word: בַּעֲבוּר זֶה
  choice: É por causa disto
  rationale: A expressão indica causa ou fundamento. Esta formulação preserva sua ligação possível tanto com a observância presente quanto com o ato de Yahweh.
- source_word: עָשָׂה יְהוָה לִי
  choice: Yahweh agiu em meu favor
  rationale: עשה é amplo, podendo significar fazer ou agir. Como não há objeto explícito, “agiu em meu favor” evita acrescentar um objeto e comunica a intervenção em benefício do falante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: quando saí do Egito
  rationale: O infinitivo construto com ב expressa circunstância temporal. A formulação é idiomática e mantém a perspectiva na primeira pessoa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Termo filial masculino בֵּן
  choice: seu filho
  alternative: sua criança
  rationale: O hebraico está no singular masculino, e o contexto não exige neutralização de gênero.
- issue: Relação sintática de בַּעֲבוּר זֶה com עָשָׂה
  choice: Manter no texto a leitura causal “É por causa disto que Yahweh agiu...”
  alternative: “Yahweh fez isto por mim...”
  rationale: A construção hebraica admite que “isto” indique a razão da observância ou esteja mais diretamente ligado ao que Yahweh fez. A nota conserva essa ambiguidade sem fixar indevidamente uma só leitura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para fluência natural; a ambiguidade sintática relevante foi preservada por nota.
