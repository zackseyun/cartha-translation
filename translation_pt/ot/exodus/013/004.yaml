  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: pt
  text: Hoje vocês estão saindo no mês de abibe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abibe é o nome do mês; o termo está associado ao estágio de amadurecimento dos cereais na primavera.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: Hoje
  rationale: O substantivo com artigo funciona adverbialmente e indica o dia presente do êxodo. “Hoje” preserva com naturalidade a imediaticidade da fala.
- source_word: אַתֶּם
  choice: vocês
  rationale: O pronome é masculino plural e se dirige coletivamente a Israel. “Vocês” expressa claramente o plural em português moderno e tem ampla legibilidade brasileira.
- source_word: יֹצְאִים
  choice: estão saindo
  rationale: O particípio qal plural de יצא descreve uma ação em curso ou iminente. A forma progressiva preserva esse aspecto e o movimento para fora do Egito.
- source_word: בְּחֹדֶשׁ
  choice: no mês de
  rationale: A preposição בְּ com “mês” introduz a referência temporal; “no mês de” é a formulação portuguesa natural e precisa.
- source_word: הָאָבִיב
  choice: abibe
  rationale: Mantém-se transliterado o nome ou designação hebraica do mês, sem substituí-lo por uma interpretação como “primavera” ou “espigas novas”. Usa-se inicial minúscula conforme a convenção portuguesa para nomes de meses.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com “vocês” para tornar explícito o destinatário plural e “estão saindo” para representar o valor progressivo ou iminente do particípio hebraico. A vírgula conserva a referência temporal final como especificação destacada.
