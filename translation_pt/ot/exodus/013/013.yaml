    rationale: O hebraico חֲמוֹר é “jumento/burro” e não contém o termo feminino para “jumenta”. Embora “primogênito” envolva o nascimento, a formulação hebraica usa o nome genérico do animal.
  - severity: medium
    issue: A oração final omite explicitamente o componente humano de בְּכוֹר אָדָם.
    rationale: “Todo primogênito entre os seus filhos” pode ser compreensível no contexto, mas não traduz de modo suficiente o contraste lexical explícito entre o primogênito humano e o animal.
  - severity: low
    issue: A modulação verbal do texto é inconsistente.
    rationale: “Deve ser resgatado”, “se você não o resgatar”, “quebre-lhe” e “deve resgatar” alternam voz e modalidade sem necessidade. Uma formulação paralela em segunda pessoa melhora a clareza legal.
