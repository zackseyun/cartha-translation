  source_fidelity: 'É necessária uma correção: חֲמוֹר significa “jumento/burro” e não especifica uma fêmea (“jumenta”). Além disso, a expressão final deve conservar explicitamente o contraste humano de בְּכוֹר אָדָם, sem perder “filhos” para בְּבָנֶיךָ. A instrução condicional sobre quebrar o pescoço foi preservada de modo direto e não eufemístico.'
  naturalness: A redação revista usa português moderno e claro, com construção normativa coerente. “Você resgatará” reproduz adequadamente a forma injuntiva/futura hebraica e evita a alternância algo desigual entre passiva, perífrase obrigativa e imperativo.
  terminology: “Resgatar” mantém o sentido jurídico-cultual de פדה. “Jumento” é a designação não marcada e fiel para חֲמוֹר. “Cordeiro” é uma tradução contextual possível de שֶׂה, com nota que informa a maior amplitude do hebraico. “Primogênito humano” torna visível o contraste de אָדָם com o animal, e “dentre seus filhos” conserva בְּבָנֶיךָ.
