  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: pt
  text: Todo primogênito de jumento você resgatará com um cordeiro[a]; mas, se não o resgatar, deverá quebrar-lhe o pescoço. Todo primogênito humano dentre seus filhos você resgatará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico שֶׂה é mais amplo e pode designar um animal do rebanho miúdo, uma ovelha ou uma cabra.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: primogênito de jumenta
  rationale: פֶּטֶר designa aquilo que primeiro abre o ventre. Em linguagem legal corrente, “primogênito” transmite naturalmente essa ideia; “de jumenta” explicita o animal materno pressuposto pela referência ao ventre.
- source_word: תִּפְדֶּה
  choice: deve ser resgatado / deve resgatar
  rationale: פדה indica libertação mediante substituição ou pagamento. “Resgatar” preserva o sentido jurídico e cultual; a construção com “deve” comunica a força normativa da instrução.
- source_word: בְשֶׂה
  choice: com um cordeiro
  rationale: שֶׂה designa um animal do rebanho miúdo e pode referir-se a ovelha ou cabra. “Cordeiro” é uma formulação sacrificial natural e conhecida em português, enquanto a extensão mais ampla do termo hebraico é registrada em nota.
- source_word: וַעֲרַפְתּוֹ
  choice: quebre-lhe o pescoço
  rationale: ערף descreve a quebra do pescoço, em particular pela nuca, e não o abate comum. A expressão escolhida é clara, direta e idiomática.
- source_word: בְּכוֹר אָדָם
  choice: primogênito
  rationale: No contexto da oração final, o referente humano fica explícito por “entre os seus filhos”; assim, “primogênito” preserva o contraste entre os primeiros nascimentos animais e humanos sem uma repetição pouco natural.
- source_word: בְּבָנֶיךָ
  choice: entre os seus filhos
  rationale: בָּנִים significa especificamente “filhos” neste contexto legal, e não o termo mais amplo “crianças” ou “descendentes”.
theological_decisions:
- issue: Sentido de אָדָם em בְּכוֹר אָדָם
  choice: Entendido como ser humano em contraste com o animal, expresso no contexto por “primogênito entre os seus filhos”.
  alternative: “todo primogênito humano entre os seus filhos”
  rationale: אָדָם marca aqui a categoria humana, não um homem adulto. Como בְּבָנֶיךָ já identifica os referentes como filhos humanos, não é necessário introduzir “homem”, que poderia sugerir indevidamente idade adulta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “deve” para a obrigação legal. Evitou-se a flexão solene e hoje menos corrente “resgatarás”. A alternância entre passiva e ativa mantém o primeiro período natural e deixa claro, na oração final, que a obrigação recai sobre o destinatário.
