  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: pt
  text: 'Então o faraó chamou Moisés e Arão e disse: “Vão e ofereçam sacrifícios ao seu Deus na terra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofereçam sacrifícios ao seu Deus dentro da terra”; isto é, dentro do Egito.
    reason: Alternativa lexical/contextual para בָּאָרֶץ. O texto principal preserva a formulação breve do hebraico, enquanto a nota esclarece que, no contexto, a terra é o Egito.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto narrativo, קרא significa chamar alguém ou mandar chamá-lo. “Chamou” é natural e não acrescenta ao verbo um caráter oficial mais forte que o necessário.
- source_word: פַרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada para o título real egípcio.
- source_word: אֶל־מֹשֶׁה וּלְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Com “chamou”, o português expressa naturalmente os destinatários como objeto direto, embora o hebraico empregue a preposição אֶל diante de Moisés e לְ diante de Arão.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: Equivalente narrativo corrente de אמר; os interlocutores já estão explícitos.
- source_word: לְכוּ
  choice: Vão
  rationale: Imperativo plural direto de הלך, apropriado à permissão dada por faraó.
- source_word: זִבְחוּ
  choice: ofereçam sacrifícios
  rationale: זבח designa o ato de sacrificar no culto. A locução portuguesa evita a possível ambiguidade moderna de “sacrifiquem” e explicita naturalmente o sentido ritual.
- source_word: לֵאלֹהֵיכֶם
  choice: ao seu Deus
  rationale: O לְ marca o destinatário da oferta sacrificial. “Ao seu Deus” é a formulação idiomática em português.
- source_word: בָּאָרֶץ
  choice: aqui mesmo, nesta terra
  rationale: A expressão significa literalmente “na terra”. No contexto, o faraó permite o culto somente dentro do Egito; “aqui mesmo” comunica essa restrição, enquanto “nesta terra” mantém a imagem lexical do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” de modo implícito nas formas verbais plurais (“Vão”, “ofereçam”), evitando regionalismos e linguagem excessivamente arcaica.
