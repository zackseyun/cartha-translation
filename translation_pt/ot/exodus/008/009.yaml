base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: pt
  text: E o SENHOR[a] fez conforme a palavra de Moisés; as rãs morreram nas casas, nos pátios e nos campos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome pessoal de Deus, tradicionalmente representado por SENHOR.'
    reason: Identifica o nome divino subjacente à tradução convencional.
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por “SENHOR”, com nota que torna explícito o hebraico.
- source_word: כִּדְבַר מֹשֶׁה
  choice: conforme a palavra de Moisés
  rationale: 'Preserva de perto a formulação hebraica e sua possível abrangência: aquilo que Moisés havia dito ou solicitado.'
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: nas casas, nos pátios e nos campos
  rationale: Com o verbo “morrer”, o hebraico min indica aqui os lugares onde se encontravam as rãs; em português atual, “morreram nas...” comunica naturalmente esse sentido sem sugerir que elas saíram vivas desses locais.
theological_decisions:
- issue: Representação do nome divino
  choice: SENHOR, com nota explicativa
  alternative: Yahweh
  rationale: Mantém a convenção bíblica portuguesa mais difundida sem ocultar que o texto hebraico traz o nome próprio divino.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem reproduzir de modo artificial a preposição min após “morrer”.
