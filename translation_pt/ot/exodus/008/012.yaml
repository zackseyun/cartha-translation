source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: pt
  text: 'Então Javé disse a Moisés: “Diga a Arão: ‘Estenda o seu cajado e bata no pó da terra; ele se transformará em mosquitos[a] por toda a terra do Egito.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piolhos”; o termo hebraico indica pequenos insetos que picam ou causam irritação, mas não se sabe ao certo de que espécie eram.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma portuguesa corrente o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português.
- source_word: אֱמֹר
  choice: Diga
  rationale: Imperativo dirigido a Moisés que introduz a ordem a ser transmitida a Arão; “Diga” é direto e natural.
- source_word: נְטֵה
  choice: Estenda
  rationale: Expressa o ato de alongar ou projetar o cajado, sem recorrer a uma formulação arcaica.
- source_word: מַטְּךָ
  choice: o seu cajado
  rationale: “Cajado” é a designação moderna e clara do bastão associado a Moisés e Arão.
- source_word: וְהַךְ
  choice: e bata
  rationale: O imperativo de נכה pede um golpe efetivo. “Bata” é natural neste contexto e preserva a ação sem a solenidade arcaica de “fira”.
- source_word: עֲפַר הָאָרֶץ
  choice: no pó da terra
  rationale: Mantém a imagem hebraica do pó fino do solo e a ligação lexical com a terra do Egito.
- source_word: וְהָיָה
  choice: ele se transformará
  rationale: Embora a forma signifique literalmente “e será”, o contexto descreve o pó passando a ser os insetos; “se transformará” explicita naturalmente esse resultado sem mudar seu sentido.
- source_word: לְכִנִּם
  choice: em mosquitos
  rationale: O termo hebraico designa pequenos insetos incômodos ou picadores, mas a espécie exata é incerta. “Mosquitos” é uma opção portuguesa corrente, com a incerteza preservada em nota.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: por toda a terra do Egito
  rationale: Comunica de modo idiomático a extensão abrangente da praga em todo o território egípcio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: Senhor; Jeová
  rationale: O texto traz explicitamente o tetragrama. “Javé” preserva o nome próprio em forma portuguesa amplamente reconhecida, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A fala dentro da fala foi preservada, assim como a sequência concisa de ordens. O marcador [a] foi colocado diretamente após o termo lexicalmente incerto.
