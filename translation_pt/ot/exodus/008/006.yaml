base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: pt
  text: 'O faraó respondeu: “Amanhã.” Então Moisés disse: “Será conforme a sua palavra, para que você saiba que não há ninguém como Yahweh[a], nosso Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome próprio do Deus de Israel; tradicionalmente traduzido por “SENHOR”.'
    reason: Explicar a forma e a tradição de tradução do nome divino.
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: O faraó respondeu ... Então Moisés disse
  rationale: 'Os dois verbos têm literalmente o sentido de “e ele disse”. Os sujeitos, implícitos no hebraico, são explicitados a partir do diálogo imediato para evitar ambiguidade em português: o faraó dá a resposta, e Moisés continua falando.'
- source_word: לְמָחָר
  choice: Amanhã
  rationale: Resposta temporal direta à pergunta anterior; a forma breve e natural preserva o sentido do advérbio hebraico.
- source_word: כִּדְבָרְךָ
  choice: conforme a sua palavra
  rationale: Preserva o idioma hebraico relativamente formal e indica que Moisés agirá de acordo com o prazo declarado pelo faraó.
- source_word: לְמַעַן תֵּדַע
  choice: para que você saiba
  rationale: Expressa naturalmente a finalidade indicada por לְמַעַן, mantendo a referência ao destinatário masculino singular, o faraó.
- source_word: אֵין כַּיהוָה
  choice: não há ninguém como Yahweh
  rationale: A negação existencial seguida da comparação é vertida de maneira idiomática, sem reduzir a afirmação à mera inexistência de outro deus idêntico.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Apesar da forma morfológica plural de אֱלֹהִים, o contexto e o sufixo referem-se ao Deus de Israel no singular.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e corresponde à vocalização acadêmica amplamente aceita; a nota informa a convenção alternativa tradicional sem inseri-la no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Conforme a sua palavra” mantém deliberadamente um tom um pouco mais formal para refletir o idioma hebraico. Os sujeitos foram explicitados por clareza discursiva, sem alterar os participantes identificáveis no contexto.
