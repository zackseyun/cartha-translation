base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/010.yaml
  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: pt
  text: E amontoaram as rãs em montes e mais montes[a], e a terra ficou cheirando mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em montões” ou “monte sobre monte”; o hebraico repete o substantivo para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: amontoaram
  rationale: O verbo צבר descreve reunir em montes; “amontoaram” expressa de modo natural e concreto tanto a ação de juntar quanto a formação das pilhas.
- source_word: אֹתָם
  choice: as rãs
  rationale: O pronome objeto retoma as rãs do contexto imediato. A explicitação evita a ambiguidade que “as” isoladamente poderia causar em português.
- source_word: חֳמָרִם חֳמָרִם
  choice: em montes e mais montes
  rationale: A repetição do substantivo tem força distributiva e enfática, indicando numerosos montes. A formulação preserva essa ênfase em português corrente.
- source_word: וַתִּבְאַשׁ
  choice: ficou cheirando mal
  rationale: O verbo באש indica exalar mau cheiro. A expressão é direta, clara e natural em português amplo, sem enfraquecer o resultado repulsivo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste contexto, אֶרֶץ designa a terra ou região atingida pela praga, não o planeta inteiro; “a terra” mantém a formulação tradicional e contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Montes e mais montes” reproduz idiomaticamente a repetição enfática do hebraico; “ficou cheirando mal” evita uma formulação excessivamente literária ou regional.
