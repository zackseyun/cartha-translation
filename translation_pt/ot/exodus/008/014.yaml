base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: pt
  text: Os magos fizeram o mesmo com suas artes secretas, tentando produzir os mosquitos[a], mas não conseguiram. E os mosquitos estavam sobre as pessoas e sobre os animais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piolhos”. A identificação do inseto mencionado pelo termo hebraico é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: os magos
  rationale: Designa os especialistas rituais da corte do faraó; “magos” é a equivalência tradicional e natural em português, sem especificar além do hebraico.
- source_word: בְּלָטֵיהֶם
  choice: com suas artes secretas
  rationale: Expressa práticas ocultas ou secretas e mantém a ideia de técnicas mágicas escondidas em linguagem clara e atual.
- source_word: לְהוֹצִיא
  choice: tentando produzir
  rationale: 'No contexto, o infinitivo indica a finalidade da ação: fazer surgir os insetos. “Tentando produzir” torna natural em português tanto o propósito quanto o fracasso subsequente.'
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: os mosquitos
  rationale: A identificação exata do inseto é incerta. “Mosquitos” é uma tradução comum e inteligível; a alternativa tradicional “piolhos” é preservada em nota.
- source_word: וְלֹא יָכֹלוּ
  choice: mas não conseguiram
  rationale: Comunica diretamente a incapacidade dos magos em português natural.
- source_word: בָּאָדָם
  choice: sobre as pessoas
  rationale: אָדָם é coletivo neste contexto e se refere aos seres humanos em geral, não especificamente a homens do sexo masculino. “As pessoas” reproduz esse sentido com naturalidade.
- source_word: וּבַבְּהֵמָה
  choice: e sobre os animais
  rationale: O substantivo singular tem sentido coletivo. “Os animais” preserva o contraste abrangente entre seres humanos e animais em português idiomático.
theological_decisions:
- issue: Tradução de אָדָם em sentido coletivo
  choice: as pessoas
  alternative: o homem / a humanidade
  rationale: Aqui, o singular hebraico representa coletivamente os seres humanos e contrasta com o coletivo animal. “As pessoas” transmite a referência universal sem sugerir um indivíduo masculino, enquanto mantém o paralelismo sem introduzir interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação hebraica foi suavizada em duas frases, sem alterar a progressão narrativa. A repetição de “mosquitos” foi mantida por corresponder à repetição do texto-fonte.
