base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: pt
  text: E Yahweh fez conforme a palavra de Moisés e retirou o enxame[a] de Faraó, de seus servos e de seu povo; não restou um só.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os enxames de moscas”. O hebraico עָרֹב designa a praga de criaturas que formavam enxames, mas o próprio termo não especifica a espécie exata.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Reproduz diretamente o sentido amplo de עשה e funciona naturalmente na expressão 'fez conforme'.
- source_word: כִּדְבַר מֹשֶׁה
  choice: conforme a palavra de Moisés
  rationale: Preserva o substantivo דָּבָר, aqui no sentido de palavra ou declaração, sem reduzir a expressão a uma paráfrase.
- source_word: וַיָּסַר
  choice: retirou
  rationale: O hifil de סור indica remover ou afastar; 'retirou' é claro e natural no contexto da praga.
- source_word: הֶעָרֹב
  choice: o enxame
  rationale: Mantém a referência coletiva e evita especificar uma espécie que o termo hebraico não identifica por si só.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: do faraó, dos seus servos e do seu povo
  rationale: Conserva a preposição repetida no hebraico e a remoção de cada grupo mencionado.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: não restou um só
  rationale: 'Expressa com naturalidade e ênfase o singular אֶחָד: nenhum indivíduo do enxame permaneceu.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o nome pessoal divino; a transliteração 'Yahweh' o preserva sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o encadeamento narrativo e a ênfase final do hebraico.
