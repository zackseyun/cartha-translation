  text: וְ/שַׂמְתִּ֣י פְדֻ֔ת בֵּ֥ין עַמִּ֖/י וּ/בֵ֣ין עַמֶּ֑/ךָ לְ/מָחָ֥ר יִהְיֶ֖ה הָ/אֹ֥ת הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: pt
  text: E farei distinção entre o meu povo e o seu povo.[a] Amanhã acontecerá este sinal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resgate” ou “livramento”; o termo hebraico pode indicar o ato de Deus resgatar, expresso aqui pela distinção que ele faz entre Israel e o Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: E farei
  rationale: Embora שׂים signifique literalmente “pôr” ou “colocar”, com o substantivo abstrato פְדֻת e a construção “entre... e...” o português natural pede “fazer distinção”.
- source_word: פְדֻת
  choice: distinção
  rationale: No contexto imediato, o termo descreve o tratamento diferenciador pelo qual Deus separa seu povo do povo do faraó. Os sentidos possíveis de “resgate” e “livramento” são preservados em nota.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e ...
  rationale: Equivalente português natural da construção correlativa hebraica que marca diferenciação entre dois grupos.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Construção possessiva direta, referente ao povo de Deus, Israel.
- source_word: עַמֶּךָ
  choice: o seu povo
  rationale: Construção possessiva dirigida ao faraó, referente ao povo egípcio; “seu” mantém linguagem corrente e digna.
- source_word: לְמָחָר
  choice: Amanhã
  rationale: Traduz diretamente o advérbio temporal e conserva sua posição enfática no início da oração.
- source_word: יִהְיֶה
  choice: acontecerá
  rationale: Com “este sinal” como sujeito, “acontecerá” expressa de modo natural a ocorrência futura indicada pelo verbo היה.
- source_word: הָאֹת הַזֶּה
  choice: este sinal
  rationale: אוֹת designa aqui um sinal dado por Deus no contexto das pragas; “sinal” é a tradução clara e consagrada em português.
theological_decisions:
- issue: Se פְדֻת deve ser traduzido por seu sentido soteriológico mais explícito ou por seu sentido contextual de diferenciação
  choice: distinção no texto principal
  alternative: resgate ou livramento
  rationale: 'A sintaxe “entre o meu povo e o seu povo” destaca o resultado concreto da ação divina: distinguir Israel do Egito. A nota preserva a ressonância de resgate ou livramento sem impor ao texto principal um sentido mais estreito.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Farei distinção” evita o pouco natural “porei uma distinção”, enquanto “acontecerá” comunica idiomaticamente a ocorrência futura do sinal.
