    issue: A nota diz que “o faraó se tornou obstinado”.
    rationale: Embora explique o efeito do idiomatismo, essa formulação pode obscurecer a agência explícita do verbo hebraico. A explicação deve indicar que ele tornou o coração obstinado ou insensível.
