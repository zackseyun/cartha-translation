  verdict: revise
  source_fidelity: A oração principal preserva corretamente Faraó como sujeito agente, a repetição temporal de גַּם בַּפַּעַם הַזֹּאת e sua recusa em deixar o povo partir. Contudo, “tornou obstinado o seu coração” não é uma construção idiomática em português e enfraquece a formulação estabelecida e natural para o idiomatismo hebraico.
  naturalness: “Endureceu o seu coração” é português moderno, claro e digno, e comunica naturalmente o sentido figurado de וַיַּכְבֵּד sem perder a agência de Faraó. A posição de “também desta vez” após o sujeito mantém a leitura fluente.
  terminology: “Endureceu ... coração” preserva a terminologia narrativa recorrente do Êxodo em português. A nota deve manter a imagem literal de peso e explicar que o sujeito faz seu coração obstinado/insensível, não que ele simplesmente se torna assim.
