base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: pt
  text: Mas o faraó também endureceu o seu coração desta vez[a] e não deixou o povo partir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “tornou pesado o seu coração”. A expressão indica que o faraó tornou o seu coração obstinado ou insensível.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: tornou obstinado
  rationale: O verbo כבד significa literalmente tornar pesado. Com “coração”, descreve aqui uma ação deliberada de insensibilidade ou obstinação. “Tornou obstinado” comunica o sentido do idioma e mantém o faraó como agente.
- source_word: לִבּוֹ
  choice: o seu coração
  rationale: Preserva a imagem antropológica hebraica do coração como centro da vontade e da disposição.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: também dessa vez
  rationale: 'Expressa naturalmente a ideia aditiva e temporal: o faraó repetiu a mesma atitude nesta ocasião.'
- source_word: וְלֹא שִׁלַּח
  choice: e não deixou ... partir
  rationale: No contexto do Êxodo, שׁלח indica permitir que o povo parta ou libertá-lo. Esta formulação é clara e idiomática em português.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente natural do substantivo coletivo definido, que no contexto se refere ao povo de Israel.
- source_word: וַ
  choice: Mas
  rationale: Embora o waw também possa ser traduzido simplesmente por “E”, “Mas” explicita de modo natural o contraste entre o alívio anterior e a reação contrária do faraó.
theological_decisions:
- issue: Agência no endurecimento do coração do faraó
  choice: o faraó tornou obstinado o seu coração
  alternative: o coração do faraó ficou obstinado
  rationale: O hebraico apresenta o faraó como sujeito ativo do verbo. A tradução preserva essa agência sem apagar a tensão narrativa com outras passagens em que Deus endurece o coração do faraó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação “também dessa vez” é natural, e a nota preserva a metáfora hebraica sem tornar o texto principal artificial.
