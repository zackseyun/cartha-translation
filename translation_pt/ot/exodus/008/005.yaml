base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: pt
  text: 'E Moisés disse ao faraó[a]: “Concedo-lhe a honra de decidir: para quando devo suplicar por você, por seus servos e por seu povo, para eliminar as rãs de junto de você e de suas casas? Elas permanecerão somente no Nilo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Glorie-se sobre mim”. A expressão hebraica é difícil; no contexto, Moisés concede ao faraó a honra de determinar quando ele deve suplicar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: Concedo-lhe a honra de decidir
  rationale: 'A expressão hebraica é idiomática e difícil. A tradução mantém a ideia de honra ou precedência concedida ao faraó e explicita apenas o necessário no contexto: cabe a ele indicar o momento da intercessão.'
- source_word: לְמָתַי
  choice: para quando
  rationale: A pergunta não busca apenas saber quando algo ocorrerá, mas convida o faraó a determinar o momento da súplica; “para quando” expressa isso naturalmente em português.
- source_word: אַעְתִּיר
  choice: devo suplicar
  rationale: O hifil de עתר denota uma súplica insistente, neste contexto dirigida a Deus em favor de outros. “Suplicar” é corrente, digno e evita transformar a palavra em termo técnico.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: por você, por seus servos e por seu povo
  rationale: A repetição de “por” preserva a extensão e a ênfase da construção hebraica.
- source_word: לְהַכְרִית
  choice: eliminar
  rationale: Embora כרת tenha o sentido básico de “cortar”, aqui significa fazer cessar ou retirar a infestação. “Eliminar” comunica com clareza o efeito pretendido sem sugerir literalmente o corte das rãs.
- source_word: הַצֲפַרְדְּעִים
  choice: as rãs
  rationale: Equivalente direto e tradicionalmente compreensível para os animais da praga.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: de junto de você e de suas casas
  rationale: “De junto de você” torna natural a ideia de afastamento da presença do faraó, enquanto a repetição de “de” reflete a estrutura hebraica.
- source_word: רַק
  choice: somente
  rationale: 'Marca a exceção enfática: as rãs serão eliminadas dos demais lugares, mas continuarão no Nilo.'
- source_word: בַּיְאֹר
  choice: no Nilo
  rationale: Em Êxodo, יְאֹר designa especificamente o Nilo no contexto egípcio; o nome próprio é mais preciso do que o genérico “rio”.
- source_word: תִּשָּׁאַרְנָה
  choice: Elas permanecerão
  rationale: O nifal de שׁאר indica continuar ou ficar restante. A formulação é natural e preserva a afirmação de que as rãs continuarão no Nilo.
theological_decisions:
- issue: Natureza da ação de Moisés expressa por אַעְתִּיר
  choice: “suplicar”, sem objeto divino explícito
  alternative: “orar a Deus” ou “interceder”
  rationale: O contexto envolve súplica a Deus em favor do faraó, mas o hebraico deste versículo não nomeia explicitamente Deus. A tradução preserva essa forma e evita acrescentar uma explicitação teológica desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “você” evita o regionalismo de “tu” e a excessiva formalidade de “Vossa Majestade”. A difícil expressão inicial foi vertida por equivalência ótima, com sua forma mais literal preservada em nota.
