  naturalness: “Mandou chamar”, “Supliquem” e “deixarei o povo ir” são naturais e adequados ao registro narrativo. Em “para que ofereça sacrifícios”, a elipse de “o povo” é gramaticalmente possível, mas produz uma referência menos clara; repetir o sujeito melhora a legibilidade internacional.
  terminology: “Faraó”, “Moisés”, “Arão”, “rãs”, “sacrifícios” e “Yahweh” estão bem empregados. “Supliquem” conserva apropriadamente a força intensiva de הַעְתִּירוּ sem introduzir interpretação doutrinária.
