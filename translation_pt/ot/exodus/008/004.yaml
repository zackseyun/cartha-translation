base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: pt
  text: 'Então o faraó mandou chamar Moisés e Arão e disse: “Supliquem a Yahweh[a] que tire as rãs de mim e do meu povo, e eu deixarei o povo ir, para que o povo ofereça sacrifícios a Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido por “orem” ou “intercedam”, mas pode transmitir a ideia de um pedido insistente.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e o povo ofereça sacrifícios a Yahweh”. O hebraico também pode indicar simples coordenação, embora neste contexto provavelmente expresse a finalidade de deixar o povo ir.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: mandou chamar Moisés e Arão
  rationale: A construção קרא com לְ pode indicar convocar alguém. “Mandou chamar” é natural em português e comunica que o faraó os fez comparecer diante dele.
- source_word: הַעְתִּירוּ
  choice: Supliquem
  rationale: O hifil de עתר, em contexto de oração, denota rogar ou interceder com insistência. “Supliquem” preserva essa intensidade melhor do que o termo mais geral “orem”.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição אֶל indica o destinatário da súplica, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: וְיָסֵר הַצְפַרְדְּעִים
  choice: que tire as rãs
  rationale: O hifil de סור significa retirar ou afastar. Depois do imperativo de súplica, a forma verbal exprime o conteúdo ou resultado pedido.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: de mim e do meu povo
  rationale: Preserva-se a repetição da preposição מן, destacando tanto o próprio faraó quanto seu povo.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: e eu deixarei o povo ir
  rationale: A forma coortativa expressa a intenção ou promessa declarada pelo faraó. No contexto recorrente do Êxodo, שלח significa permitir que o povo parta.
- source_word: וְיִזְבְּחוּ לַיהוָה
  choice: para que ofereça sacrifícios a Yahweh
  rationale: A forma prefixada pode expressar o propósito de deixar o povo partir. O singular coletivo “o povo” admite naturalmente a retomada por “ofereça” em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Relação sintática da oração וְיִזְבְּחוּ
  choice: 'finalidade: “para que ofereça sacrifícios”'
  alternative: 'coordenação simples: “e ofereça sacrifícios”'
  rationale: Depois da promessa coortativa do faraó, a oração pode indicar a finalidade pretendida da libertação. A coordenação simples continua gramaticalmente possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mandou chamar” e “deixarei o povo ir” preservam expressões naturais e recorrentes da narrativa; “supliquem” mantém a força do verbo hebraico sem recorrer a linguagem arcaica.
