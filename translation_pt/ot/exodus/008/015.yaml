  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: pt
  text: 'Então os magos disseram ao faraó: “Isto é o dedo de Deus.”[a] Mas o coração do faraó se endureceu[b], e ele não lhes deu ouvidos, conforme Yahweh[c] havia dito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dedo de Deus” é uma imagem que indica a atuação direta do poder divino.
    reason: cultural_note
  - marker: b
    text: 'Ou: “o coração do faraó ficou firme”. O hebraico não declara aqui quem causou esse endurecimento.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: YHWH, nome divino tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: os magos
  rationale: Designa os especialistas rituais do faraó. “Magos” é claro, tradicional no contexto do Êxodo e não especifica além do que o hebraico afirma.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: Isto é o dedo de Deus
  rationale: Preserva a cláusula nominal hebraica e a imagem concreta que atribui o acontecimento à atuação direta do poder divino.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora אֱלֹהִים possa, em outros contextos, significar “um deus” ou “deuses”, aqui a referência singular a Deus é a leitura contextual mais natural no confronto narrado.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: o coração do faraó se endureceu
  rationale: A construção apresenta o coração como sujeito e não explicita quem causou o endurecimento. A forma portuguesa mantém o sentido resultativo sem acrescentar um agente.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: e ele não lhes deu ouvidos
  rationale: Expressão portuguesa natural para não escutar nem atender ao que foi dito, refletindo שׁמע com אֶל.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: conforme Yahweh havia dito
  rationale: A forma verbal portuguesa situa a declaração divina antes do acontecimento narrado, e “conforme” reproduz a relação indicada por כַּאֲשֶׁר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal YHWH. “Yahweh” o representa diretamente e a nota informa a tradução tradicional.
- issue: Agente do endurecimento do coração do faraó
  choice: o coração do faraó se endureceu
  alternative: o coração do faraó foi endurecido; o faraó endureceu o coração
  rationale: O hebraico desta oração não nomeia o agente. A tradução conserva essa abertura e não atribui explicitamente a ação nem a Deus nem ao faraó.
- issue: Sentido de אֱלֹהִים na fala dos magos
  choice: Deus
  alternative: um deus; os deuses
  rationale: A leitura singular definida se ajusta melhor ao reconhecimento do poder divino no contexto imediato, embora o substantivo hebraico tenha uma faixa semântica mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não lhes deu ouvidos” mantém um tom narrativo natural; “se endureceu” preserva a metáfora bíblica e a ausência de agente explícito.
