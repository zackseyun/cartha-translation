base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Diga a Arão: ‘Estenda a mão com o seu cajado sobre os rios, sobre os canais[a] e sobre as lagoas, e faça as rãs subirem sobre a terra do Egito.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os canais do Nilo”; no contexto egípcio, o termo hebraico muitas vezes se refere às vias de água ligadas ao Nilo.'
    reason: Alternativa lexical que explicita a referência geográfica possível sem inseri-la obrigatoriamente no texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica a sequência com naturalidade em português moderno.
- source_word: אֱמֹר
  choice: Diga
  rationale: Equivalente direto e natural do imperativo dirigido a Moisés, que introduz a fala a Arão.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Estenda a mão
  rationale: Preserva tanto o sentido do verbo נטה quanto o substantivo concreto “mão”, em formulação corrente e digna.
- source_word: בְּמַטֶּךָ
  choice: com o seu cajado
  rationale: Entende a preposição ב instrumentalmente. “Cajado” identifica com clareza o objeto empregado por Arão.
- source_word: הַנְּהָרֹת
  choice: os rios
  rationale: Equivalente comum de נהרות, mantido distinto dos dois termos hídricos seguintes.
- source_word: הַיְאֹרִים
  choice: os canais
  rationale: No contexto egípcio, o plural designa cursos de água associados ao Nilo; “canais” preserva sua distinção em relação a rios e lagoas.
- source_word: הָאֲגַמִּים
  choice: as lagoas
  rationale: אגמים indica águas reunidas, como lagoas ou tanques. “Lagoas” é claro, natural e não pressupõe construção artificial.
- source_word: וְהַעַל
  choice: e faça ... subirem
  rationale: A forma causativa de עלה é representada por “faça ... subirem”, construção idiomática em português.
- source_word: הַצְפַרְדְּעִים
  choice: as rãs
  rationale: Equivalente lexical direto para os animais desta praga.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sobre a terra do Egito
  rationale: Mantém a preposição על e evita ampliar interpretativamente o sentido para “por toda” a terra.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A fala emoldurada usa formas respeitosas e correntes (“Diga”, “Estenda”), preserva a enumeração tríplice das águas e mantém a repetição espacial de “sobre”. O marcador [a] foi colocado junto a “canais”, expressão a que a nota efetivamente se refere.
