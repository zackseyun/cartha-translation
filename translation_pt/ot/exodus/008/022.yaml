  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: pt
  text: 'Moisés, porém, disse: “Não é correto fazer isso, pois sacrificaríamos a Yahweh, nosso Deus, aquilo que é abominável para os egípcios.[a] Se sacrificarmos diante dos olhos deles aquilo que lhes é abominável, será que não nos apedrejarão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a abominação do Egito” ou “a abominação dos egípcios”. A expressão provavelmente se refere àquilo que os egípcios consideravam abominável.
    reason: Registra a forma mais literal e a ambiguidade da construção hebraica תּוֹעֲבַת מִצְרַיִם.
lexical_decisions:
- source_word: נָכוֹן
  choice: correto
  rationale: Neste contexto, o termo indica o que é apropriado ou aceitável. “Não é correto” é natural em português e mantém tanto a dimensão prática quanto a possível dimensão moral da objeção.
- source_word: לַעֲשׂוֹת כֵּן
  choice: fazer isso
  rationale: Reproduz de modo claro e idiomático a expressão hebraica “fazer assim”.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: aquilo que é abominável para os egípcios
  rationale: A construção pode significar literalmente “a abominação do Egito/dos egípcios”. No contexto, o sentido objetivo — aquilo que eles consideram abominável — explica a ameaça de apedrejamento, sem especificar além do texto quais animais ou ritos estavam em vista.
- source_word: נִזְבַּח
  choice: sacrificaríamos / sacrificarmos
  rationale: A primeira ocorrência descreve a ação que resultaria da proposta em discussão, daí o condicional “sacrificaríamos”; a segunda integra a condição explícita da pergunta retórica, daí “se sacrificarmos”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה e preserva sua função como nome pessoal da aliança.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Mantém explicitamente a construção possessiva e a identificação do Deus de Israel.
- source_word: הֵן
  choice: Se
  rationale: Aqui introduz a situação hipotética que fundamenta a pergunta retórica; “se” expressa essa função com naturalidade em português.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Preserva a imagem concreta e enfática do hebraico, em vez de reduzi-la simplesmente a “diante deles”.
- source_word: יִסְקְלֻנוּ
  choice: nos apedrejarão
  rationale: O verbo designa atacar ou matar com pedras. A formulação “será que não...” comunica a expectativa enfática da pergunta retórica.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio sem substituí-lo por um título; “Jeová” reflete uma vocalização tradicional posterior.
- issue: Sentido de תּוֹעֲבַת מִצְרַיִם
  choice: aquilo que é abominável para os egípcios
  alternative: a abominação do Egito / dos egípcios
  rationale: O contexto favorece o sentido objetivo, pois a reação violenta esperada decorre daquilo que os egípcios considerariam ofensivo. Como a construção hebraica admite formulação mais literal e ambígua, essa alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Moisés, porém, disse” conserva a progressão narrativa e o contraste contextual. A pergunta final mantém a força retórica do hebraico sem recorrer a linguagem arcaica.
