  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: pt
  text: Pois, se você não deixar o meu povo ir, eis que estou enviando o enxame[a] contra você, contra os seus servos, contra o seu povo e para dentro das suas casas. As casas do Egito ficarão cheias do enxame, e também o chão[b] sobre o qual eles estão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “moscas”. O termo hebraico עָרֹב provavelmente designa um enxame, tradicionalmente entendido como de moscas; a tradução mais abrangente preserva a incerteza quanto ao tipo de criatura.
    reason: lexical_alternative
  - marker: b
    text: Ou “a terra”. A palavra hebraica אֲדָמָה pode significar “chão”, “solo” ou “terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Introduz uma advertência condicional ligada à fala anterior, preservando tanto a conexão explicativa quanto a condição.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: você não deixar o meu povo ir
  rationale: No relato do êxodo, שׁלח com 'meu povo' expressa libertação; esta formulação é natural e reconhecível em português.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: eis que enviarei
  rationale: Preserva a solenidade da fórmula de anúncio e comunica a iminência e certeza da ação, embora o hebraico empregue uma construção participial.
- source_word: הֶעָרֹב
  choice: enxames
  rationale: O referente exato do termo hebraico é incerto. 'Enxames' evita especificar indevidamente a criatura e soa mais natural em português neste contexto do que o singular coletivo repetido.
- source_word: בְּךָ ... וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: contra você, contra os seus servos, contra o seu povo
  rationale: A preposição marca os atingidos pela praga; 'contra' transmite o caráter hostil e mantém a repetição retórica.
- source_word: וּבְבָתֶּיךָ
  choice: e para dentro das suas casas
  rationale: No contexto do envio de uma praga móvel, a expressão explicita naturalmente a entrada nas casas, confirmada pela oração seguinte.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: As casas do Egito ficarão cheias
  rationale: Reproduz o resultado expresso pelo verbo hebraico e conserva a abrangência da construção 'casas do Egito'.
- source_word: וְגַם הָאֲדָמָה
  choice: e também o chão
  rationale: אֲדָמָה pode significar chão, solo ou terra; em contraste com as casas, 'chão' comunica bem a superfície coberta.
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: em que eles estão
  rationale: Mantém o pronome plural ambíguo do hebraico e a relação espacial sem acrescentar que estejam necessariamente em pé.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de 'contra' conserva a progressão retórica hebraica; 'eis que' mantém a solenidade sem tornar o restante do versículo arcaico.
