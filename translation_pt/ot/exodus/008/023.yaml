base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: pt
  text: Iremos ao deserto, numa jornada de três dias, e ofereceremos sacrifícios a Yahweh, nosso Deus, conforme ele nos disser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme ele nos diz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: caminho de três dias
  rationale: A expressão hebraica usa דֶּרֶךְ com uma medida de tempo para indicar o percurso ou a distância correspondente; a formulação preserva o idioma sem explicá-lo em excesso.
- source_word: נֵלֵךְ
  choice: iremos
  rationale: O imperfeito qal na primeira pessoa do plural expressa aqui a ação futura proposta por Moisés, sem necessidade de acrescentar obrigação.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: מִדְבָּר designa região erma ou não cultivada. Em português bíblico corrente, “deserto” é claro e não precisa implicar exclusivamente areia; “pelo” combina naturalmente com a ideia de percorrer um caminho.
- source_word: וְזָבַחְנוּ
  choice: e ofereceremos sacrifícios
  rationale: זבח denota sacrificar, especialmente abater ou apresentar uma vítima sacrificial. A expressão torna explícito e natural em português o sentido cultual do verbo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando sua função como nome próprio no texto hebraico.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo da primeira pessoa do plural.
- source_word: כַּאֲשֶׁר יֹאמַר אֵלֵינוּ
  choice: conforme ele nos disser
  rationale: 'כַּאֲשֶׁר indica conformidade, e o imperfeito יֹאמַר admite sentido futuro: o sacrifício será realizado segundo a instrução divina.'
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama como nome próprio. “Yahweh” conserva essa distinção, enquanto “SENHOR” representa a tradição de substituição reverencial.
- issue: Temporalidade de יֹאמַר
  choice: conforme ele nos disser
  alternative: conforme ele nos diz
  rationale: O imperfeito hebraico pode apontar para a instrução que será dada, mas também admite formulação mais geral ou presente. O texto principal conserva a orientação futura do contexto sem excluir a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a concisão do hebraico e evita linguagem denominacional. O marcador [a] aparece no texto imediatamente após a expressão a que se refere.
