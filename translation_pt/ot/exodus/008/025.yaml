  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: pt
  text: 'E Moisés disse: “Eis que sairei da tua presença e suplicarei a Yahweh; amanhã, o enxame[a] se afastará do faraó, dos seus servos e do seu povo. Somente que o faraó não volte a enganar, recusando-se a deixar o povo ir oferecer sacrifícios a Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar mais especificamente um enxame de moscas ou de outros insetos; a referência exata é incerta.
    reason: alternativa lexical
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força de chamar a atenção e se encaixa no registro digno da narrativa, sem ser obscuro em português.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: sairei da tua presença
  rationale: Expressa naturalmente o movimento de afastar-se de alguém e torna explícito o valor relacional de מֵעִמָּךְ sem alterar o sentido.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: e suplicarei a Yahweh
  rationale: O verbo עתר indica súplica ou intercessão insistente, mais específica que uma oração genérica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְסָר
  choice: se afastará
  rationale: Preserva o sentido intransitivo de retirar-se ou apartar-se, tendo o enxame como sujeito.
- source_word: הֶעָרֹב
  choice: o enxame
  rationale: Conserva a referência coletiva sem especificar indevidamente a espécie exata das criaturas.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: do faraó, dos seus servos e do seu povo
  rationale: Reproduz a distribuição do afastamento entre os três grupos e mantém a repetição preposicional do hebraico.
- source_word: מָחָר
  choice: amanhã
  rationale: Equivalente temporal direto; sua posição antes da oração principal soa natural e deixa claro quando ocorrerá o afastamento.
- source_word: רַק
  choice: Somente
  rationale: Introduz de modo conciso a ressalva e advertência de Moisés.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: não continue o faraó a agir com falsidade
  rationale: Combina a ideia aspectual de repetição ou continuação em יסף com o caráter enganoso e desdenhoso de התל, sem reduzir o termo a mera zombaria verbal.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: recusando-se a deixar o povo ir
  rationale: Apresenta a recusa em libertar o povo como a forma concreta da conduta falsa de faraó.
- source_word: לִזְבֹּחַ
  choice: oferecer sacrifícios
  rationale: Mantém a especificidade cultual de זבח e produz uma formulação idiomática em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome próprio da aliança em vez de substituí-lo por um título.
- issue: Identificação específica de עָרֹב
  choice: o enxame
  alternative: o enxame de moscas; o enxame misto
  rationale: A identificação zoológica exata é incerta; a tradução mantém essa abertura sem inserir uma espécie que o hebraico não determina com segurança.
- issue: Sentido da advertência הָתֵל
  choice: agir com falsidade
  alternative: zombar; enganar
  rationale: No contexto, a conduta envolve promessa não cumprida e trato enganoso; a formulação conserva a dimensão moral sem limitar o verbo à zombaria verbal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção com “tu” acompanha o discurso direto singular dirigido ao faraó; “Eis que” e “não continue o faraó” dão solenidade sem recorrer a vocabulário arcaico excessivo.
