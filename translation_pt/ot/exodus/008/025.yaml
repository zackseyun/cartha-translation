    issue: Formulação de אַל יֹסֵף ... הָתֵל
    rationale: “Agir com falsidade” comunica parte do sentido, mas é uma abstração um tanto pesada e não deixa tão nítida a noção de o faraó voltar a enganar/tratar enganosamente. Uma redação mais direta melhora a naturalidade sem restringir indevidamente o termo hebraico.
