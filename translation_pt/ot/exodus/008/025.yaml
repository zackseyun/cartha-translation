revisions:
- from: 'E Moisés disse: “Eis que sairei da tua presença e suplicarei a Yahweh; amanhã, o enxame[a] se afastará do faraó, dos seus servos e do seu povo. Somente não continue o faraó a agir com falsidade, recusando-se a deixar o povo ir oferecer sacrifícios a Yahweh.”'
  to: 'E Moisés disse: “Eis que sairei da tua presença e suplicarei a Yahweh; amanhã, o enxame[a] se afastará do faraó, dos seus servos e do seu povo. Somente que o faraó não volte a enganar, recusando-se a deixar o povo ir oferecer sacrifícios a Yahweh.”'
  rationale: A revisão limita-se à advertência final. “Não volte a enganar” expressa de modo mais natural e contextualizado a construção hebraica que proíbe a repetição de uma conduta enganosa; “recusando-se a deixar” mantém essa recusa como o modo pelo qual o engano se manifesta. A nota e seu marcador foram preservados.
