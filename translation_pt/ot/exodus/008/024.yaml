source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: pt
  text: 'Então o faraó disse: “Eu deixarei vocês ir, para que ofereçam sacrifícios a Yahweh, seu Deus, no deserto. Apenas não se afastem demais. Supliquem por mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez em português.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma tradicional e natural em português para o título real egípcio.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Eu deixarei vocês ir
  rationale: Neste contexto de negociação, שׁלח significa permitir que o povo parta. O pronome explícito אָנֹכִי dá alguma ênfase ao “Eu”, preservada pela sua presença na tradução.
- source_word: וּזְבַחְתֶּם
  choice: para que ofereçam sacrifícios
  rationale: Depois de “deixarei vocês ir”, a construção expressa a finalidade da partida; “ofereçam sacrifícios” é corrente e deixa claro o caráter cultual do verbo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, em conformidade com a evidência do texto hebraico e a decisão terminológica fornecida.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Traduz diretamente a construção possessiva, dirigindo-se ao grupo com uma forma natural no português de ampla compreensão.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma e não cultivada; “deserto” é a forma mais corrente e clara neste contexto em português.
- source_word: רַק
  choice: Apenas
  rationale: Introduz de modo conciso a condição restritiva imposta pelo faraó.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: não se afastem demais
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ideia de distância; a tradução comunica idiomaticamente a proibição enfática.
- source_word: הַעְתִּירוּ
  choice: Supliquem
  rationale: O Hifil de עתר indica súplica insistente ou intercessão; “Supliquem” é digno, compreensível e preserva a intensidade.
- source_word: בַּעֲדִי
  choice: por mim
  rationale: Expressa de maneira direta que a súplica deve ser feita em benefício do faraó.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título; “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural, evitando tanto arcaísmo quanto regionalismo excessivo. A ordem das frases e a condição do faraó são mantidas com naturalidade.
