base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: pt
  text: Então Moisés saiu da presença do faraó e suplicou a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “orou com insistência a Yahweh”. O verbo hebraico transmite a ideia de súplica urgente ou fervorosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O qal wayyiqtol de יצא indica partida física e dá continuidade à sequência narrativa; “saiu” é direto e natural em português.
- source_word: מֵעִם
  choice: da presença de
  rationale: A combinação מן + עם expressa afastamento da companhia ou presença de alguém. “Da presença do faraó” explicita essa nuance sem alterar o sentido.
- source_word: פַּרְעֹה
  choice: faraó
  rationale: Forma tradicional e amplamente reconhecida em português para o título real egípcio.
- source_word: וַיֶּעְתַּר
  choice: suplicou
  rationale: O verbo עתר neste contexto descreve uma súplica intensa ou oração insistente, não apenas uma oração genérica. “Suplicou” preserva essa força e soa natural em português.
- source_word: אֶל
  choice: a
  rationale: A preposição אֶל indica o destinatário da súplica. Com o verbo “suplicar”, “a Yahweh” é construção portuguesa natural e próxima da forma hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Da presença do faraó” conserva a nuance relacional de מֵעִם, e “suplicou” mantém a intensidade do verbo hebraico.
