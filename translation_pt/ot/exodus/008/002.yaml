base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: pt
  text: Então Arão estendeu a mão sobre as águas do Egito, e as rãs[a] subiram e cobriram a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente «a rã», no singular, provavelmente com sentido coletivo; por isso, «as rãs».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: estendeu
  rationale: No contexto do sinal da praga, נטה descreve o gesto de estender a mão; «estendeu» é natural, preciso e preserva a ação concreta.
- source_word: יָדוֹ
  choice: a mão
  rationale: O hebraico especifica «mão», e não «braço»; o possessivo é recuperado naturalmente pelo sujeito Arão em português.
- source_word: עַל
  choice: sobre
  rationale: Expressa de modo natural a orientação espacial da mão em relação às águas.
- source_word: מֵימֵי מִצְרָיִם
  choice: as águas do Egito
  rationale: Mantém o plural hebraico e a referência coletiva aos corpos de água do Egito.
- source_word: וַתַּעַל
  choice: subiram
  rationale: עלה indica que as rãs emergiram das águas e avançaram para a terra; «subiram» conserva o movimento expresso no original.
- source_word: הַצְּפַרְדֵּעַ
  choice: as rãs
  rationale: Embora a forma hebraica seja singular e definida, ela provavelmente tem sentido coletivo; o plural é a expressão natural em português.
- source_word: וַתְּכַס
  choice: cobriram
  rationale: Reproduz diretamente o sentido de כסה sem acrescentar intensidade interpretativa.
- source_word: אֶרֶץ מִצְרָיִם
  choice: a terra do Egito
  rationale: Aqui אֶרֶץ designa o território egípcio; «terra do Egito» é preciso e mantém a formulação bíblica corrente.
