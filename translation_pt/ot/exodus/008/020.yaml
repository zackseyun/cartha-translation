base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: pt
  text: 'E Yahweh fez assim: um grande enxame[a] entrou na casa do faraó e nas casas de seus servos; por toda a terra do Egito, a terra ficou arruinada por causa do enxame.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode referir-se a um grande enxame de insetos; tradicionalmente, é entendido como um enxame de moscas, mas a espécie exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: fez assim
  rationale: Expressão portuguesa simples que mantém a ideia de que Yahweh executou o que havia anunciado.
- source_word: עָרֹב כָּבֵד
  choice: um enorme enxame
  rationale: עָרֹב indica uma massa ou um enxame de criaturas cuja espécie exata é incerta; כָּבֵד intensifica sua grandeza ou severidade. 'Enorme' é mais natural em português do que o literal 'pesado'.
- source_word: בֵּיתָה פַרְעֹה
  choice: entrou na casa do faraó
  rationale: A forma direcional ligada a 'casa' indica movimento para dentro; mantém-se 'casa', sem especificar interpretativamente 'palácio'.
- source_word: וּבֵית עֲבָדָיו
  choice: nas casas de seus servos
  rationale: O singular construto com o plural 'servos' tem sentido distributivo natural. 'Servos' preserva a amplitude do termo, sem restringi-lo a 'oficiais'.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: por toda a terra do Egito
  rationale: Comunica de modo idiomático a abrangência total indicada pela expressão hebraica.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: a terra ficou arruinada
  rationale: Expressa o dano grave indicado pelo Nifal de שׁחת sem sugerir necessariamente destruição absoluta.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: por causa do enxame
  rationale: Neste contexto, a locução hebraica tem valor causal, expresso com clareza em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. A forma 'Yahweh' preserva o nome pessoal em vez de substituí-lo pelo título 'SENHOR'; também mantém a forma editorial adotada na camada de consulta, embora 'Javé' seja uma adaptação portuguesa comum.
- issue: Identidade das criaturas designadas por עָרֹב
  choice: enxame, sem indicar a espécie
  alternative: enxame de moscas
  rationale: A identificação precisa das criaturas não é segura. O texto principal conserva essa incerteza, enquanto a tradição que as entende como moscas é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Conserva a repetição de 'terra' presente no hebraico e evita especificar a espécie do enxame ou trocar 'casa' por 'palácio'.
