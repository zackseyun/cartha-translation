  source_fidelity: A tradução preserva adequadamente a sequência narrativa, o nome divino, o movimento do enxame para as casas, a extensão por toda a terra do Egito e o resultado de ruína causado pelo enxame. A troca de «enorme» por «grande» corresponde mais diretamente ao valor intensivo de כָּבֵד, sem tentar reproduzir de modo pouco natural o literal «pesado».
  naturalness: O português é claro e atual. A ligação por dois-pontos torna a relação entre «Yahweh fez assim» e o acontecimento subsequente mais fluida e mais próxima da unidade sintática do hebraico.
  terminology: «Yahweh», «enxame», «casa», «servos» e «terra» são escolhas apropriadas. A nota deve manter a incerteza da identificação sem ampliar desnecessariamente o referente para «outras criaturas», formulação que não é necessária para explicar a ambiguidade lexical.
  issues:
