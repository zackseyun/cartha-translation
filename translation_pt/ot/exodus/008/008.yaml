base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: pt
  text: Moisés e Arão saíram da presença do faraó, e Moisés clamou a Yahweh a respeito das rãs que Yahweh havia feito vir sobre o faraó[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que Yahweh havia posto contra o faraó”. O verbo hebraico significa literalmente “pôr” ou “colocar”; “feito vir sobre” expressa de modo idiomático seu sentido no contexto desta praga.'
    reason: Alternativa lexical que conserva mais de perto a formulação do hebraico.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saíram
  rationale: O singular hebraico abre uma ação cujo sujeito composto é “Moisés e Arão”. Em português, a concordância no plural é natural e inequívoca; o verbo comunica o afastamento da presença do faraó.
- source_word: מֵעִם פַּרְעֹה
  choice: da presença do faraó
  rationale: מֵעִם indica afastamento de junto de alguém. “Da presença do faraó” explicita esse valor relacional com clareza e dignidade.
- source_word: וַיִּצְעַק
  choice: clamou
  rationale: צעק expressa um apelo intenso. “Clamou” preserva essa força e é corrente no registro bíblico moderno, sem reduzi-lo simplesmente a “orou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל דְּבַר
  choice: a respeito de
  rationale: A locução hebraica pode significar “a respeito de” ou “por causa de”. Aqui introduz o assunto do clamor de Moisés, e a formulação escolhida preserva isso sem afirmar mais do que o texto.
- source_word: הַצְפַרְדְּעִים
  choice: as rãs
  rationale: Equivalente português direto para o plural que designa os animais da praga.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: que ele havia feito vir sobre o faraó
  rationale: שׂים significa literalmente “pôr/colocar”, mas, no contexto de uma praga, “fazer vir sobre” comunica de modo natural que as rãs foram impostas ao faraó. O pronome “ele” mantém formalmente implícito o sujeito, como no hebraico, embora o contexto aponte para Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sujeito de שָׂם (“havia feito vir”)
  choice: manter o pronome “ele”
  alternative: explicitar “Yahweh”
  rationale: O contexto favorece Yahweh como referente, mas o hebraico não repete o nome no interior da oração relativa. Manter “ele” evita transformar uma inferência contextual em explicitação textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Faraó” foi usado com artigo e inicial minúscula por funcionar aqui como título. A estrutura conserva a intensidade de “clamou” e a possível ambiguidade gramatical do pronome “ele”.
