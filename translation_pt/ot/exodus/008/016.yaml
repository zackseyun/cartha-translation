base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: pt
  text: 'Então o SENHOR disse a Moisés: “Levante-se bem cedo pela manhã e apresente-se diante do faraó. Veja, ele está saindo para a água. Diga-lhe: ‘Assim diz o SENHOR: Deixe o meu povo ir, para que me sirva.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Levante-se de manhã bem cedo
  rationale: Expressa de modo natural a ideia idiomática de levantar-se cedo pela manhã.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: e apresente-se diante do faraó
  rationale: Preserva a ordem de tomar posição perante o faraó, com formulação digna e corrente em português.
- source_word: הִנֵּה יוֹצֵא הַמָּיְמָה
  choice: Ele estará saindo para ir às águas
  rationale: O presente participial hebraico, no contexto da instrução para a manhã seguinte, é vertido naturalmente pelo futuro progressivo; 'às águas' mantém a referência não especificada do original.
- source_word: שַׁלַּח עַמִּי
  choice: Deixe o meu povo ir
  rationale: Reproduz a exigência de libertação/permissão sem acrescentar um destino ausente desta oração.
- source_word: וְיַעַבְדֻנִי
  choice: para que me sirva
  rationale: Mantém o sentido amplo de עבד, que pode envolver serviço e culto, sem restringi-lo explicitamente a apenas um desses aspectos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida e a camada de consulta auditada, usando versaletes para sinalizar o nome divino sem inserir no corpo uma vocalização reconstruída.
- issue: Sentido de עבד na finalidade da libertação
  choice: sirva
  alternative: preste culto
  rationale: '''Sirva'' preserva a amplitude lexical e a tensão entre serviço, lealdade e culto, evitando reduzir antecipadamente o termo a uma única dimensão ritual.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A fala direta foi organizada com pontuação natural, sem alterar a estrutura de discurso dentro de discurso do hebraico.
