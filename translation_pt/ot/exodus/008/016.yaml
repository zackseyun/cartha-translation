  to: 'Então o SENHOR disse a Moisés: “Levante-se bem cedo pela manhã e apresente-se diante do faraó. Veja, ele está saindo para a água. Diga-lhe: ‘Assim diz o SENHOR: Deixe o meu povo ir, para que me sirva.’”'
