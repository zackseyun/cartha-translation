  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: pt
  text: Naquele dia, porém, separarei a terra de Gósen, onde o meu povo habita, para que ali não haja enxame algum[a], a fim de que você saiba que eu sou Yahweh no meio da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enxames” ou “um enxame de insetos”. O termo hebraico עָרֹב pode designar de modo mais amplo uma massa de insetos, e não somente moscas.
    reason: lexical_alternative
  - marker: b
    text: Ou “no meio do país”. O hebraico também pode ser entendido de modo mais amplo como “no meio da terra”, embora, neste contexto, provavelmente se refira à terra do Egito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: separarei
  rationale: O hifil de פלא expressa aqui a ação de distinguir ou tratar de modo diferente. “Separarei” comunica com naturalidade que Gósen será poupada da praga.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: a terra de Gósen
  rationale: אֶרֶץ designa uma terra, território ou região; “terra de Gósen” preserva a forma geográfica tradicional e é clara em português.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: onde o meu povo habita
  rationale: Embora עֹמֵד signifique literalmente “está de pé” ou “permanece”, nesta construção referente a um território indica residência ou permanência.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: para que ali não haja
  rationale: A construção infinitiva tem valor de propósito ou resultado e é vertida por uma oração final idiomática em português.
- source_word: עָרֹב
  choice: enxame
  rationale: A identificação zoológica exata é incerta. “Enxame” preserva a generalidade do hebraico sem acrescentar “moscas” ao texto principal.
- source_word: לְמַעַן תֵּדַע
  choice: a fim de que você saiba
  rationale: A expressão introduz propósito explícito, e o verbo está na segunda pessoa masculina singular, dirigido ao faraó.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: A tradução conserva a expressão locativa concreta do hebraico e também sua possível amplitude sem explicitar “Egito” no texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Alcance de בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  alternative: no meio do país; no meio da terra do Egito
  rationale: No contexto, הָאָרֶץ provavelmente se refere à terra do Egito, mas a expressão hebraica também pode ter alcance mais amplo. O texto principal mantém essa ambiguidade, esclarecida em nota.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. “Você” torna explícita a segunda pessoa singular dirigida ao faraó. A ordem foi levemente ajustada em “Naquele dia, porém” para fluência natural, e as notas foram posicionadas junto às expressões que de fato esclarecem.
