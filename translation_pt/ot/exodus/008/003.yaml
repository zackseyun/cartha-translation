source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֥ן הַֽ/חֲרְטֻמִּ֖ים בְּ/לָטֵי/הֶ֑ם וַ/יַּעֲל֥וּ אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: pt
  text: E os magos fizeram o mesmo com suas artes secretas[a] e fizeram subir as rãs sobre a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com seus encantamentos” ou “por meio de suas artes ocultas”.
    reason: Alternativas lexicais que refletem o possível sentido de בְּלָטֵיהֶם.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram o mesmo
  rationale: A expressão formada por עשה e כֵן indica que eles agiram da mesma maneira que no ato anterior. “Fizeram o mesmo” é natural e preserva a força comparativa.
- source_word: הַחֲרְטֻמִּים
  choice: os magos
  rationale: Em Êxodo, o termo designa os especialistas da corte do faraó que reproduzem sinais mediante práticas esotéricas. “Magos” é claro, tradicional e adequado ao contexto, sem especificar além do hebraico.
- source_word: בְּלָטֵיהֶם
  choice: com suas artes secretas
  rationale: O termo se refere a práticas mágicas ocultas ou secretas. Esta formulação preserva tanto o valor instrumental da preposição quanto o caráter esotérico das práticas.
- source_word: וַיַּעֲלוּ
  choice: fizeram subir
  rationale: O hifil de עלה tem sentido causativo. “Fizeram subir” preserva de modo transparente esse valor, sem reduzir a ação a simplesmente “produzir”.
- source_word: אֶת הַצְפַרְדְּעִים
  choice: as rãs
  rationale: O substantivo está no plural e leva artigo definido. “As rãs” reproduz naturalmente essa determinação em português.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sobre a terra do Egito
  rationale: עַל pode significar “sobre” ou “por cima de”. A formulação conserva a imagem espacial e sugere a disseminação das rãs pelo território sem explicitar mais do que o texto.
theological_decisions:
- issue: Natureza do ato dos magos
  choice: Relatar diretamente que os magos também fizeram subir as rãs.
  alternative: Apresentar a ação como mera aparência, ilusão ou fraude.
  rationale: A narrativa hebraica afirma a ação sem qualificá-la. A tradução não deve introduzir uma explicação naturalista, cética ou doutrinária ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Magos” mantém o termo bíblico reconhecível; “fizeram subir” conserva deliberadamente a construção causativa do hebraico.
