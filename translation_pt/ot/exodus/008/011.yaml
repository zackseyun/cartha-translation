  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: pt
  text: Mas, quando o faraó viu que havia alívio[a], endureceu o coração e não lhes deu ouvidos, conforme Yahweh havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trégua”. O termo hebraico pode indicar alívio, diminuição da pressão ou espaço para respirar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva o sentido básico de ראה e a expressão idiomática hebraica, que neste contexto também implica perceber a mudança das circunstâncias.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: que havia alívio
  rationale: הָרְוָחָה designa alívio, folga ou trégua após uma situação opressiva; “havia alívio” é claro, natural e adequado ao contexto da praga.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: endureceu o coração
  rationale: O hifil de כבד significa literalmente tornar pesado, mas, aplicado ao coração nesta fórmula recorrente de Êxodo, expressa obstinação. “Endureceu o coração” preserva a metáfora bíblica consagrada e atribui a ação ao faraó neste versículo.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: e não lhes deu ouvidos
  rationale: שׁמע com אֶל significa escutar ou atender. A expressão portuguesa é natural e comunica a recusa de escutar Moisés e Arão sem especificar em excesso a ideia de obediência.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme ... havia dito
  rationale: A oração indica que o comportamento do faraó correspondeu à fala divina anterior; o mais-que-perfeito composto expressa essa anterioridade com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Agência no endurecimento do coração do faraó
  choice: O faraó é apresentado como aquele que endureceu o próprio coração.
  alternative: Entender que o coração dele simplesmente se tornou duro ou introduzir aqui a causalidade divina.
  rationale: A forma causativa ativa hebraica tem o faraó como sujeito implícito. A tradução mantém a atribuição específica deste versículo sem apagar a tensão com outras passagens de Êxodo que atribuem a Yahweh o endurecimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Faraó” é usado com artigo, conforme o uso natural em português; “não lhes deu ouvidos” preserva o sentido sem soar excessivamente literal.
