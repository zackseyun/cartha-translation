base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: pt
  text: E eles fizeram assim. Arão estendeu a mão com seu cajado e golpeou o pó da terra, e os mosquitos[a] vieram sobre os seres humanos e os animais. Todo o pó da terra se transformou em mosquitos em toda a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piolhos”. A identificação zoológica exata do termo hebraico é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: E eles fizeram assim
  rationale: Reproduz de modo natural a fórmula narrativa de cumprimento da ordem anterior.
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: Arão estendeu a mão com seu cajado
  rationale: Mantém a construção hebraica e sua possível nuance de acompanhamento ou instrumento sem explicá-la em excesso.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: feriu o pó da terra
  rationale: Preserva o verbo narrativo forte e a imagem repetida do pó, em registro bíblico digno e compreensível.
- source_word: הַכִּנָּם / כִנִּים
  choice: mosquitinhos
  rationale: Designa pequenos insetos voadores de modo inteligível, mas a identificação zoológica exata do hebraico é incerta e fica registrada em nota.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: sobre os seres humanos e os animais
  rationale: אָדם é coletivo e inclui a humanidade; בהמה contrasta os humanos com os animais, provavelmente sobretudo os domésticos.
- source_word: הָיָה כִנִּים
  choice: se transformou em mosquitinhos
  rationale: Expressa com clareza o sentido resultativo de היה no contexto.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: em toda a terra do Egito
  rationale: Conserva a abrangência territorial total indicada pelo hebraico.
theological_decisions:
- issue: Sentido coletivo de אָדָם
  choice: seres humanos
  alternative: homem / humanidade
  rationale: O contexto não trata apenas de indivíduos do sexo masculino; a formulação explicita corretamente o referente coletivo sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “pó da terra” foi preservada por sua função imagética. O marcador [a] aparece imediatamente após o termo zoologicamente incerto.
