  naturalness: O texto é claro e de registro apropriado. «Mosquitos» é mais natural e digno do que «mosquitinhos» neste contexto narrativo solene. «Vieram sobre» conserva a imagem e o andamento do hebraico, com inteligibilidade suficiente em português bíblico moderno.
  terminology: «Arão», «cajado», «pó da terra», «seres humanos» e «animais» são adequados. A nota «Ou “piolhos”» preserva corretamente a principal alternativa para כנים, cuja identificação zoológica permanece incerta.
