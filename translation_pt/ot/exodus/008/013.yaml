revisions:
- from: E eles fizeram assim. Arão estendeu a mão com seu cajado e feriu o pó da terra, e os mosquitinhos[a] vieram sobre os seres humanos e os animais. Todo o pó da terra se transformou em mosquitinhos em toda a terra do Egito.
  to: E eles fizeram assim. Arão estendeu a mão com seu cajado e golpeou o pó da terra, e os mosquitos[a] vieram sobre os seres humanos e os animais. Todo o pó da terra se transformou em mosquitos em toda a terra do Egito.
  rationale: A revisão limita-se a substituir o diminutivo «mosquitinhos» por «mosquitos», formulação mais neutra, natural e compatível com a identificação incerta de כנים. «Golpeou» também torna o ato de atingir o pó mais idiomático em português sem alterar o sentido de וַיַּךְ.
