  text: וְ/סָר֣וּ הַֽ/צְפַרְדְּעִ֗ים מִמְּ/ךָ֙ וּ/מִ/בָּ֣תֶּ֔י/ךָ וּ/מֵ/עֲבָדֶ֖י/ךָ וּ/מֵ/עַמֶּ֑/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: pt
  text: E as rãs se retirarão de você, das suas casas, dos seus servos e do seu povo; somente no Nilo[a] permanecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no rio”. O termo hebraico יְאֹר pode significar “rio”, mas em Êxodo geralmente se refere especificamente ao Nilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: E ... se retirarão
  rationale: O verbo סוּר expressa afastar-se ou retirar-se. No contexto do fim da praga, “se retirarão” comunica naturalmente que as rãs deixarão esses lugares, sem acrescentar que serão destruídas.
- source_word: הַצְפַרְדְּעִים
  choice: as rãs
  rationale: Tradução direta do substantivo definido no plural.
- source_word: מִמְּךָ
  choice: de você
  rationale: Mantém de modo claro a preposição מן com o sufixo masculino singular, dirigida ao faraó.
- source_word: וּמִבָּתֶּיךָ
  choice: das suas casas
  rationale: Preserva o plural do hebraico e soa natural em português.
- source_word: וּמֵעֲבָדֶיךָ
  choice: dos seus servos
  rationale: עֶבֶד pode designar servo, escravo ou oficial. “Servos” conserva aqui a amplitude do termo para aqueles que estão sob a autoridade do faraó, sem especificar indevidamente sua condição.
- source_word: וּמֵעַמֶּךָ
  choice: e do seu povo
  rationale: “Povo” representa de maneira ampla a população sujeita ao faraó.
- source_word: רַק
  choice: somente
  rationale: Marca claramente a limitação ou exceção introduzida pela oração final.
- source_word: בַּיְאֹר
  choice: no Nilo
  rationale: Embora יְאֹר possa significar genericamente “rio”, em Êxodo normalmente se refere especificamente ao Nilo; o nome próprio torna a referência contextual explícita.
- source_word: תִּשָּׁאַרְנָה
  choice: permanecerão
  rationale: O nifal de שׁאר indica permanecer ou ser deixado. A posição final do verbo mantém a ênfase hebraica no único lugar onde as rãs continuarão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural para brasileiros. A repetição das construções com “de” preserva a progressão do hebraico, enquanto “se retirarão” evita uma formulação excessivamente literal ou ambígua.
