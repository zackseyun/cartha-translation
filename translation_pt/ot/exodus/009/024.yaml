base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: pt
  text: Houve granizo, e fogo faiscava no meio do granizo. A tempestade era muito intensa, como nunca havia ocorrido em toda a terra do Egito desde que este se tornou uma nação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: Houve granizo
  rationale: A construção narrativa com היה apresenta a ocorrência do fenômeno; “Houve granizo” é natural em português e preserva sua força existencial.
- source_word: וְאֵשׁ
  choice: e fogo
  rationale: O substantivo hebraico significa literalmente “fogo”. Embora no contexto possa descrever relâmpagos, a tradução mantém a imagem explícita do texto.
- source_word: מִתְלַקַּחַת
  choice: que se inflamava
  rationale: O particípio hitpael sugere fogo que se acende, irrompe ou se move repetidamente. “Que se inflamava” conserva a imagem de fogo sem reduzi-la explicitamente a relâmpagos.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: no meio do granizo
  rationale: Traduz diretamente a ideia espacial de algo presente em meio à saraivada.
- source_word: כָּבֵד מְאֹד
  choice: uma tempestade muito intensa
  rationale: כבד significa literalmente “pesado”, mas aqui caracteriza a gravidade ou intensidade do fenômeno. A explicitação de “tempestade” produz português natural sem alterar o referente contextual.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: como nunca tinha ocorrido
  rationale: Expressa de modo idiomático a comparação hebraica, segundo a qual jamais houvera fenômeno semelhante.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: em toda a terra do Egito
  rationale: Mantém a expressão territorial tradicional e clara.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: desde que este se tornou uma nação
  rationale: O pronome “este” retoma o Egito e evita atribuir de modo pouco natural a transformação em nação à palavra portuguesa feminina “terra”; לְגוֹי indica a passagem à condição de nação.
