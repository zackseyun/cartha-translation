base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: pt
  text: Assim, o coração do faraó se endureceu[a], e ele não deixou os filhos de Israel[b] partir, assim como Yahweh havia falado por meio de Moisés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficou obstinado” ou “se tornou firme”. O verbo hebraico pode significar “tornar-se forte/firme” e, aqui, indica endurecimento obstinado.'
    reason: alternative_reading
  - marker: b
    text: 'Também se pode traduzir: “os israelitas”; literalmente, “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “pela mão de Moisés”, expressão que significa “por meio de Moisés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: se endureceu
  rationale: O verbo חזק expressa tornar-se forte ou firme; neste contexto, descreve o endurecimento obstinado da disposição do faraó. A forma pronominal portuguesa comunica mudança de estado sem atribuir explicitamente a causa a Deus ou ao próprio faraó.
- source_word: לֵב פַּרְעֹה
  choice: o coração do faraó
  rationale: Preserva a imagem hebraica do coração como centro da vontade e da disposição, em formulação natural em português.
- source_word: שִׁלַּח
  choice: deixou ... partir
  rationale: No contexto do Êxodo, o verbo indica permitir que Israel vá embora; esta formulação é clara e corrente em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão hebraica literal, sem perder a referência coletiva ao povo israelita.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Expressa claramente a correspondência entre o acontecimento e a palavra divina anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Traduz de modo natural o idioma hebraico de agência, literalmente 'pela mão de Moisés'.
theological_decisions:
- issue: Agência no endurecimento do coração
  choice: o coração do faraó se endureceu
  alternative: o coração do faraó foi endurecido; o faraó endureceu o coração
  rationale: A forma hebraica apresenta o coração como tornando-se forte ou firme, sem identificar explicitamente neste versículo quem causou o endurecimento. A tradução preserva essa tensão e evita atribuir uma causalidade mais específica do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações e as imagens centrais do hebraico foram preservadas, enquanto o idioma de agência foi vertido de maneira natural. Os marcadores de notas foram posicionados junto às expressões correspondentes.
