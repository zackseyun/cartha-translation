  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: pt
  text: 'Mas foi para isto que mantive você de pé[a]: para mostrar a você o meu poder e para que o meu nome seja proclamado em toda a terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiz você permanecer de pé” ou “levantei você”. O hebraico pode indicar que Deus fez o faraó ficar ou continuar de pé; neste contexto, provavelmente significa que o preservou em vez de destruí-lo imediatamente.'
    reason: Registra a amplitude semântica do verbo hebraico e a leitura alternativa tradicional.
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mas
  rationale: Expressa de modo natural e direto o forte contraste com a afirmação anterior.
- source_word: בַּעֲבוּר זֹאת
  choice: foi para isto
  rationale: Introduz propósito, e não apenas causa, preparando as duas orações finais que explicam a intenção divina.
- source_word: הֶעֱמַדְתִּיךָ
  choice: mantive você de pé
  rationale: Preserva a imagem hebraica de fazer alguém permanecer em pé e, no contexto, comunica que o faraó foi mantido vivo em vez de ser imediatamente eliminado.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: para mostrar a você
  rationale: Reproduz com clareza a oração de propósito e mantém explícito o destinatário da demonstração.
- source_word: כֹּחִי
  choice: o meu poder
  rationale: Traduz naturalmente a força ou capacidade divina manifestada nas pragas.
- source_word: וּלְמַעַן
  choice: e para que
  rationale: Coordena uma segunda finalidade com a primeira sem obscurecer a estrutura do hebraico.
- source_word: סַפֵּר
  choice: seja proclamado
  rationale: O Piel pode significar narrar, declarar ou proclamar; a construção passiva preserva o sujeito humano indefinido e ressalta a divulgação ampla.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: Mantém a expressão hebraica, que inclui a identidade e a reputação reveladas de Deus.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: O alcance universal do contexto favorece “terra” em vez de uma região ou território local.
theological_decisions:
- issue: Sentido de הֶעֱמַדְתִּיךָ em relação ao faraó
  choice: Deus manteve o faraó de pé, isto é, permitiu que continuasse vivo para cumprir um propósito divino.
  alternative: Deus levantou ou fez surgir o faraó, possivelmente elevando-o à sua posição.
  rationale: O contexto imediato contrasta a possibilidade de Deus já ter eliminado o faraó com sua permanência. A formulação principal favorece a preservação sem excluir, na nota, a amplitude causativa do verbo nem resolver além do texto a tensão sobre a soberania divina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna inequívoco o destinatário singular; “mantive você de pé” conserva a imagem do original sem recorrer a uma formulação excessivamente literal ou arcaica.
