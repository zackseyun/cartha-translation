  yaml_path: translation/ot/exodus/009/002.yaml
  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: pt
  text: Pois, se você se recusar a deixá-los partir e continuar a retê-los,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ainda os mantiver retidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Conserva tanto a ligação explicativa de כִּי com o versículo anterior quanto a condição expressa por אִם, em português natural.
- source_word: מָאֵן
  choice: se recusar
  rationale: Expressa uma negativa deliberada, e não simples incapacidade ou hesitação.
- source_word: לְשַׁלֵּחַ
  choice: a deixá-los partir
  rationale: No contexto do êxodo, traduz de modo idiomático a permissão exigida para que os israelitas saiam.
- source_word: וְעוֹדְךָ
  choice: e ainda continuar
  rationale: Comunica a persistência da ação atribuída ao faraó, embora haja alguma redundância intencional para representar o aspecto continuativo.
- source_word: מַחֲזִיק בָּם
  choice: a retê-los
  rationale: Representa o ato contínuo de manter o povo sob domínio e impedir sua partida, sem sugerir necessariamente contato físico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração permanece incompleta, como no hebraico, pois a consequência da condição vem no versículo seguinte.
