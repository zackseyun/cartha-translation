  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: pt
  text: Mas, quando o faraó viu que a chuva, o granizo e os trovões[a] haviam cessado, tornou a pecar e endureceu o seu coração, ele e os seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as vozes”; neste contexto de tempestade, a expressão se refere aos trovões.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva o verbo narrativo comum ראה e, em português, comporta naturalmente a percepção de que a tempestade havia cessado.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo percebido pelo faraó; o valor temporal do conjunto é expresso por «quando» na oração principal.
- source_word: חָדַל
  choice: haviam cessado
  rationale: Expressa a ação já concluída no momento em que o faraó a percebeu e concorda com o sujeito composto.
- source_word: הַמָּטָר וְהַבָּרָד וְהַקֹּלֹת
  choice: a chuva, o granizo e os trovões
  rationale: Traduz diretamente os fenômenos da tempestade; קֹלוֹת significa literalmente «vozes/sons», mas neste contexto designa trovões.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: tornou a pecar
  rationale: A construção יסף + infinitivo indica repetição ou continuação. «Tornou a pecar» comunica de modo natural que ele pecou novamente, sem a formulação pouco idiomática «acrescentou pecar».
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: endureceu o seu coração
  rationale: Embora כבד tenha o sentido básico de tornar pesado, a expressão recorrente em Êxodo descreve tornar o coração insensível ou obstinado; «endureceu» preserva a ligação temática.
- source_word: הוּא וַעֲבָדָיו
  choice: ele e os seus servos
  rationale: Mantém a ênfase explícita do pronome e traduz עֲבָדִים de forma ampla, sem restringir indevidamente o grupo a escravos ou autoridades palacianas.
- source_word: וַ
  choice: Mas
  rationale: A conjunção faz avançar a narrativa e, no contexto imediato, marca o contraste com a confissão e a promessa anteriores do faraó.
theological_decisions:
- issue: Agência e alcance do endurecimento do coração
  choice: O texto atribui ao faraó o endurecimento de seu próprio coração e conserva a frase final «ele e os seus servos».
  alternative: Interpretar a frase final de modo inequívoco como sujeito coletivo apenas do endurecimento, ou tratá-la somente como observação parentética sobre a corte.
  rationale: A formulação hebraica menciona primeiro «seu coração», no singular, e depois acrescenta «ele e seus servos». A tradução mantém essa tensão sintática e não introduz uma conclusão doutrinária mais ampla sobre agência divina e humana.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Faraó» recebe artigo conforme o uso natural em português. A coordenação final, ligeiramente marcada, reproduz a ênfase e a possível tensão sintática do hebraico.
