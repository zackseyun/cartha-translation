id: EXO.9.22
reference: Exodus 9:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Estenda a mão em direção ao céu[a], para que haja granizo em toda a terra do Egito, sobre o ser humano[b], sobre os animais e sobre toda planta do campo na terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos céus”. A palavra hebraica pode significar “céu” ou “céus”; aqui, o contexto se refere ao céu visível, de onde vem o granizo.
    reason: lexical_alternative
  - marker: b
    text: O singular “o ser humano” tem sentido coletivo e se refere aos seres humanos em geral, em contraste com os animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Estenda a mão
  rationale: Traduz diretamente a ordem e emprega uma expressão natural em português para o gesto solicitado.
- source_word: עַל הַשָּׁמַיִם
  choice: em direção ao céu
  rationale: A preposição tem sentido direcional, e o contexto meteorológico aponta para o céu visível; a possível acepção de 'céus' é registrada em nota.
- source_word: וִיהִי בָרָד
  choice: para que haja granizo
  rationale: Expressa o resultado desejado após o imperativo sem acrescentar ao verbo a ideia explícita de 'cair', que não está lexicalmente presente.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: em toda a terra do Egito
  rationale: Conserva a abrangência de כָּל e a formulação geográfica do hebraico.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Mantém o singular coletivo e representativo do hebraico, em contraste com os animais, sem limitar a referência aos homens do sexo masculino.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: Comunica de modo claro o sentido coletivo do termo; no contexto, estão especialmente em vista os animais domésticos, mas o vocábulo não precisa ser estreitado a 'gado'.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: toda planta do campo
  rationale: Representa a amplitude semântica de עֵשֶׂב e preserva a expressão 'do campo'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome da aliança como nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Sentido genérico de הָאָדָם
  choice: o ser humano
  alternative: o homem; a humanidade; as pessoas
  rationale: Preserva o valor representativo e coletivamente humano do singular hebraico, bem como seu contraste com os animais, sem introduzir uma restrição de sexo.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição final de “na terra do Egito” foi mantida por corresponder à repetição enfática do hebraico.
