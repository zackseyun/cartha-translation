    text: Ou “cinza da fornalha”. O hebraico indica mais especificamente fuligem ou pó fino e escuro proveniente de um forno ou de uma fornalha.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no ser humano e no animal”, formas coletivas que indicam que a erupção atingiu pessoas e animais.
    reason: lexical_alternative
  revision_rationale: A revisão substitui a construção pronominal e relativa ambígua por uma fórmula impessoal compatível com o hebraico e melhora a equivalência de «stood before». Mantêm-se as escolhas lexicais e as duas notas, com seus marcadores adequadamente ancorados.
