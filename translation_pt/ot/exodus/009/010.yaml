base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: pt
  text: Então eles pegaram fuligem do forno[a] e ficaram diante do faraó. Moisés a lançou para o céu, e surgiram furúnculos com bolhas, irrompendo nas pessoas e nos animais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cinza da fornalha”. O hebraico indica mais especificamente fuligem ou pó fino e escuro proveniente de um forno ou de uma fornalha.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no ser humano e no animal”, formas coletivas que indicam que a erupção atingiu pessoas e animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: fuligem
  rationale: Designa o pó fino e escuro produzido pela combustão; “fuligem” é mais específico que “cinza”.
- source_word: הַכִּבְשָׁן
  choice: o forno
  rationale: כִּבְשָׁן pode indicar forno ou fornalha. “Forno” é concreto, natural e adequado ao contexto.
- source_word: לִפְנֵי פַרְעֹה
  choice: diante do faraó
  rationale: Expressa de modo idiomático que eles ficaram na presença do faraó.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: Moisés a lançou
  rationale: O pronome retoma “fuligem”, substantivo feminino em português; “lançou” preserva a ação sem especificar indevidamente seu modo.
- source_word: הַשָּׁמָיְמָה
  choice: para o céu
  rationale: A terminação direcional indica movimento para cima; a formulação preserva o sentido físico imediato.
- source_word: שְׁחִין
  choice: furúnculos
  rationale: O termo designa inflamações ou erupções cutâneas, tradicional e claramente expressas aqui como “furúnculos”.
- source_word: אֲבַעְבֻּעֹת
  choice: com bolhas
  rationale: O substantivo se refere a bolhas ou pústulas associadas aos furúnculos, sem exigir a ideia adicional de supuração.
- source_word: פֹּרֵחַ
  choice: que irromperam
  rationale: O particípio comunica o surgimento ativo da erupção; “irromperam” é natural no contexto de lesões cutâneas.
- source_word: בָּאָדָם
  choice: nas pessoas
  rationale: אָדָם é coletivo e genérico neste contraste entre seres humanos e animais; “nas pessoas” comunica isso sem sugerir apenas indivíduos do sexo masculino.
- source_word: וּבַבְּהֵמָה
  choice: e nos animais
  rationale: O singular coletivo hebraico abrange os animais; o plural genérico é a expressão natural em português.
theological_decisions:
- issue: Sentido genérico de אָדָם no contraste entre seres humanos e animais
  choice: nas pessoas
  alternative: no ser humano
  rationale: A opção mantém a referência coletiva a seres humanos em geral e evita uma leitura exclusivamente masculina, sem alterar o contraste hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases reduz a extensão do período sem romper a sequência narrativa. Os marcadores de nota foram posicionados junto às expressões que explicam.
