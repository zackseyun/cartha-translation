revisions:
- from: Então eles pegaram fuligem do forno[a] e se apresentaram diante do faraó. Moisés a lançou para o céu, e ela se transformou em furúnculos com bolhas, que irromperam nas pessoas e nos animais.[b]
  to: Então eles pegaram fuligem do forno[a] e ficaram diante do faraó. Moisés a lançou para o céu, e surgiram furúnculos com bolhas, irrompendo nas pessoas e nos animais.[b]
  rationale: A revisão substitui a construção pronominal e relativa ambígua por uma fórmula impessoal compatível com o hebraico e melhora a equivalência de «stood before». Mantêm-se as escolhas lexicais e as duas notas, com seus marcadores adequadamente ancorados.
