source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: pt
  text: Supliquem a Yahweh[a], pois já basta de trovões de Deus e granizo. Então deixarei vocês partir, e vocês não permanecerão mais aqui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “vozes de Deus e granizo”. Neste contexto de tempestade, “vozes” se refere aos trovões.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Supliquem
  rationale: O imperativo hifil plural de עתר expressa súplica insistente ou intercessão. “Supliquem” preserva a intensidade do pedido e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: וְרַב מִהְיֹת
  choice: pois já basta de
  rationale: A construção idiomática comunica suficiência ou excesso e, no contexto, o pedido de que a praga cesse.
- source_word: קֹלֹת אֱלֹהִים
  choice: trovões de Deus
  rationale: קֹלֹת significa literalmente “vozes” ou “sons”, mas, junto do granizo e no contexto da tempestade, refere-se a trovões. “De Deus” conserva a atribuição expressa pelo hebraico.
- source_word: וּבָרָד
  choice: e granizo
  rationale: Tradução direta do substantivo בָּרָד.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Então deixarei vocês ir
  rationale: Neste contexto de Êxodo, שׁלח com o povo como objeto significa libertá-lo ou permitir que parta.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: e vocês não permanecerão mais aqui
  rationale: A expressão literal “não acrescentarão permanecer” significa que não continuarão ali. “Aqui” torna explícita a referência contextual ao Egito sem identificar um lugar mais específico.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, sem o substituir por um título.
- issue: Sentido de קֹלֹת אֱלֹהִים
  choice: trovões de Deus
  alternative: vozes de Deus; trovões poderosos
  rationale: O contexto meteorológico favorece “trovões”, enquanto “de Deus” preserva a forma e a agência divina do hebraico, sem reduzir אֱלֹהִים a mero superlativo.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Supliquem” mantém a intensidade da fala de Faraó; “vocês” representa naturalmente o plural. A formulação evita arcaísmos, preservando a força e a tensão do hebraico.
