  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: pt
  text: O granizo atingiu, em toda a terra do Egito, tudo o que havia no campo, desde os seres humanos[a] até os animais. O granizo atingiu toda planta do campo e despedaçou toda árvore do campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ser humano” ou “as pessoas”.
    reason: Alternativas lexicais para o valor coletivo de אָדָם.
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: atingiu
  rationale: O verbo נכה indica golpear ou ferir. “Atingiu” é natural em português para os efeitos destrutivos do granizo e permite manter a repetição do verbo hebraico.
- source_word: הַבָּרָד
  choice: o granizo
  rationale: Correspondência direta e corrente para o fenômeno meteorológico; a repetição no texto-fonte foi preservada.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: em toda a terra do Egito
  rationale: Preserva a abrangência territorial expressa por בְּכָל sem tornar a frase artificial.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: tudo o que havia no campo
  rationale: Reproduz o sentido abrangente de כָּל אֲשֶׁר e explicita de modo natural em português a presença no campo.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: desde os seres humanos até os animais
  rationale: Mantém a construção de extensão total, de humanos a animais. Os plurais coletivos são naturais em português e adequados ao contexto.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: toda planta do campo
  rationale: עֵשֶׂב pode designar vegetação, erva ou plantas cultivadas. “Planta” é claro, atual e suficientemente abrangente.
- source_word: עֵץ הַשָּׂדֶה
  choice: toda árvore do campo
  rationale: Tradução direta que conserva a repetição de “do campo” presente no hebraico.
- source_word: שִׁבֵּר
  choice: despedaçou
  rationale: A forma intensiva de שבר comunica destruição violenta; “despedaçou” transmite a força do granizo melhor que uma formulação mais branda.
theological_decisions:
- issue: Sentido coletivo de אָדָם na expressão de abrangência
  choice: seres humanos
  alternative: homem; pessoas
  rationale: Neste contexto, אָדָם representa a humanidade em contraste abrangente com os animais, não apenas indivíduos do sexo masculino. “Seres humanos” conserva o referente humano coletivo sem resolver além do que a expressão exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “O granizo atingiu” e de “do campo” foi mantida por refletir a estrutura enfática do hebraico.
