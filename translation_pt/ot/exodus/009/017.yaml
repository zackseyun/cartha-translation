  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: pt
  text: Você ainda se exalta contra o meu povo, não o deixando ir?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continua agindo com arrogância contra o meu povo” ou “continua se levantando contra o meu povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדְךָ
  choice: Você ainda
  rationale: A combinação de עוֹד com o elemento pronominal de segunda pessoa masculina singular descreve uma ação persistente dirigida ao faraó; no contexto, a pergunta retórica é natural em português.
- source_word: מִסְתּוֹלֵל
  choice: se exalta
  rationale: O particípio Hitpolel de סלל expressa autoexaltação ou afirmação arrogante. “Se exalta” preserva tanto a força reflexiva quanto a ideia de orgulho.
- source_word: בְּעַמִּי
  choice: contra o meu povo
  rationale: 'A preposição ב assume aqui sentido adversativo: o faraó se ergue em oposição ao povo que Deus reivindica como seu.'
- source_word: לְבִלְתִּי
  choice: não o deixando
  rationale: A construção negativa infinitiva explica como a autoexaltação do faraó se manifesta. A forma gerundiva liga essa recusa de modo claro e natural à ação principal.
- source_word: שַׁלְּחָם
  choice: o deixando ir
  rationale: O Piel de שלח, na narrativa das pragas, designa a libertação de Israel. O pronome singular coletivo “o” retoma naturalmente “o meu povo” em português, embora o hebraico use sufixo plural.
theological_decisions:
- issue: A reivindicação divina expressa em “meu povo”
  choice: Manter “o meu povo” como reivindicação direta de Deus sobre Israel
  alternative: “o povo” ou “Israel”
  rationale: O sufixo de primeira pessoa é teologicamente significativo no contexto do êxodo, pois destaca o vínculo de Deus com Israel e mostra que a resistência do faraó se dirige também contra Deus.
translation_notes:
  register: Português moderno, digno e acessível, com formulação amplamente compreensível no Brasil e em outros contextos lusófonos. A pergunta retórica e a força reflexiva do hebraico foram preservadas; a nota registra a amplitude lexical de מִסְתּוֹלֵל.
