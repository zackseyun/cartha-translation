  text: וְ/לֹֽא יָכְל֣וּ הַֽ/חַרְטֻמִּ֗ים לַ/עֲמֹ֛ד לִ/פְנֵ֥י מֹשֶׁ֖ה מִ/פְּנֵ֣י הַ/שְּׁחִ֑ין כִּֽי הָיָ֣ה הַ/שְּׁחִ֔ין בַּֽ/חֲרְטֻמִּ֖ם וּ/בְ/כָל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: pt
  text: Os magos não conseguiam permanecer diante de Moisés por causa das feridas[a], pois as feridas atingiam os magos e estavam por todo o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “úlceras” ou “furúnculos”. O termo hebraico designa uma afecção inflamada da pele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: os magos
  rationale: Em Êxodo, o termo designa os especialistas rituais da corte do faraó que se opõem a Moisés e Arão ou imitam seus sinais. “Magos” é a designação tradicional, clara e natural em português.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: permanecer diante de Moisés
  rationale: Preserva o sentido concreto de עמד e a expressão “diante de”, podendo indicar que eles não conseguiam manter-se de pé ou apresentar-se na presença de Moisés, sem decidir além do que o hebraico exige.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: por causa das feridas
  rationale: מִפְּנֵי expressa causa neste contexto. שְׁחִין é uma afecção inflamada da pele; “feridas” comunica de modo natural e abrangente as lesões da praga.
- source_word: הַשְּׁחִין
  choice: as feridas
  rationale: O substantivo hebraico está no singular coletivo, mas o plural português exprime naturalmente as lesões distribuídas entre os atingidos e mantém a repetição do original.
- source_word: בַּחֲרְטֻמִּם
  choice: atingiam os magos
  rationale: A preposição ב indica que a afecção estava neles; a formulação verbal é natural em português e deixa claro que os magos sofriam corporalmente com as feridas.
- source_word: וּבְכָל מִצְרָיִם
  choice: e estavam por todo o Egito
  rationale: Mantém a referência geográfica explícita do hebraico, “em todo o Egito”, sem inserir no texto principal o referente pessoal implícito. O contexto indica que se trata das feridas entre a população egípcia.
theological_decisions: []
