base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: pt
  text: 'Então o faraó mandou chamar Moisés e Arão e lhes disse: “Desta vez pequei. Yahweh é justo[a], e eu e o meu povo somos perversos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está com a razão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “somos culpados” ou “somos os que estão errados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: mandou chamar
  rationale: A sequência literal é “enviou e chamou”, mas, em português, “mandou chamar” expressa naturalmente que o faraó enviou alguém para convocar Moisés e Arão, sem alterar o sentido da ação.
- source_word: חָטָאתִי הַפָּעַם
  choice: Desta vez pequei
  rationale: Preserva a admissão direta de pecado e a expressão temporal הַפָּעַם, que delimita a confissão à ocasião presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַצַּדִּיק
  choice: é justo
  rationale: O adjetivo צַדִּיק pode indicar aquele que é justo ou que está com a razão. “É justo” conserva seu peso moral e judicial e mantém aberta a amplitude da afirmação.
- source_word: הָרְשָׁעִים
  choice: somos culpados
  rationale: No contraste confessional com הַצַּדִּיק, a expressão atribui culpa ao faraó e ao seu povo. “Somos culpados” é natural em português e retém a força moral e judicial, enquanto a nota registra a alternativa mais literalmente moral.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Força do contraste entre הַצַּדִּיק e הָרְשָׁעִים
  choice: “Yahweh é justo” e “somos culpados”
  alternative: “Yahweh está com a razão” e “somos os perversos”
  rationale: A formulação escolhida comunica com clareza a confissão judicial e moral do faraó, sem reduzir צַדִּיק a mero acerto factual nem obrigar רָשָׁע a uma caracterização abstrata e permanente. As notas preservam as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Mandou chamar” evita uma sequência artificial, enquanto a ordem “eu e o meu povo” conserva a ênfase do hebraico na autoimplicação do faraó.
