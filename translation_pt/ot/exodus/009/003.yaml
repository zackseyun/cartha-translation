revisions:
- from: Eis que a mão de Yahweh cairá sobre os seus animais que estão no campo — sobre os cavalos, os jumentos, os camelos, o gado bovino e os rebanhos de ovelhas e cabras —, trazendo uma peste[a] gravíssima.
  to: Eis que a mão de Yahweh virá sobre os seus animais que estão no campo — os cavalos, os jumentos, os camelos, o gado bovino e os rebanhos de ovelhas e cabras — com uma peste[a] gravíssima.
  rationale: Substitui-se «cairá sobre ... trazendo» por «virá sobre ... com», preservando a imagem da mão de Yahweh e a construção anunciativa do hebraico, sem acrescentar uma relação causal ou instrumental. Mantêm-se as demais escolhas lexicais e a nota.
