  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: pt
  text: Eis que a mão de Yahweh virá sobre os seus animais que estão no campo — os cavalos, os jumentos, os camelos, o gado bovino e os rebanhos de ovelhas e cabras — com uma peste[a] gravíssima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “epidemia mortal”; o termo hebraico indica aqui uma doença epidêmica que atinge os animais.
    reason: Registra o sentido específico de דֶּבֶר no contexto e evita que “peste” seja entendida apenas como calamidade genérica.
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força de chamada de atenção e a urgência do anúncio hebraico em registro bíblico ainda compreensível no português moderno.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Conserva a imagem hebraica da mão como expressão do poder e do juízo divinos, sem reduzi-la a uma ação genérica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, preservando sua referência pactual.
- source_word: הוֹיָה בְּ
  choice: cairá sobre
  rationale: Expressa de modo natural a ação iminente e hostil da mão divina. O futuro corresponde ao sentido preditivo do anúncio, enquanto a locução preserva a imagem de algo que sobrevém aos animais.
- source_word: מִקְנְךָ
  choice: os seus animais
  rationale: O termo abrange os animais domésticos possuídos por alguém, e a enumeração seguinte esclarece que se trata dos animais de criação de Faraó. Esta formulação evita restringi-lo apenas ao gado bovino.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: que estão no campo
  rationale: 'Preserva a delimitação explícita no hebraico: os animais atingidos são os que se encontram no campo.'
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: sobre os cavalos, os jumentos, os camelos, o gado bovino e os rebanhos de ovelhas e cabras
  rationale: Reproduz toda a enumeração. 'Gado bovino' distingue בָּקָר, enquanto 'rebanhos de ovelhas e cabras' explicita o alcance coletivo de צֹאן, que pode incluir ambos os tipos de pequenos ruminantes.
- source_word: דֶּבֶר
  choice: peste
  rationale: Designa uma epidemia mortal, aqui incidente sobre os animais. 'Peste' é clara e corrente, sem o caráter arcaizante de alternativas como 'pestilência'.
- source_word: כָּבֵד מְאֹד
  choice: gravíssima
  rationale: Comunica idiomaticamente a intensidade extrema da peste; o superlativo corresponde ao hebraico 'muito grave/pesado'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e a referência pactual sem substituí-lo por um título.
- issue: Imagem da 'mão de Yahweh'
  choice: Manter a metáfora
  alternative: Explicitar como 'o poder' ou 'o castigo de Yahweh'
  rationale: A metáfora é inteligível e teologicamente significativa, podendo indicar poder e juízo sem obrigar a tradução a escolher apenas uma dessas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” conserva a solenidade e a função de chamar a atenção; “jumentos” e “gado bovino” são correntes e precisos. A colocação do marcador após “peste” liga corretamente a nota ao termo explicado.
