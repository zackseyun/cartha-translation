  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: pt
  text: Agora, mande imediatamente pôr em segurança o seu gado e tudo o que você tem no campo. Toda pessoa e todo animal que forem encontrados no campo e não forem recolhidos para dentro de casa[a] — o granizo cairá sobre eles, e morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa” pode designar aqui uma construção ou abrigo onde pessoas e animais ficariam protegidos.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Expressa tanto a ligação com a advertência anterior quanto a urgência temporal de עַתָּה, em português natural.
- source_word: שְׁלַח הָעֵז
  choice: mande pôr em segurança
  rationale: A sequência imperativa ordena o envio de uma instrução e a colocação dos bens sob proteção. A formulação portuguesa comunica a ação urgente sem introduzir um objeto explícito, como “mensagem”, que não aparece no hebraico.
- source_word: מִקְנְךָ
  choice: o seu gado
  rationale: מִקְנֶה designa os animais domésticos possuídos por alguém; “gado” é claro e corrente, sem restringir necessariamente a bovinos neste contexto.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: e tudo o que você tem no campo
  rationale: Mantém a abrangência da expressão hebraica e usa uma construção corrente e acessível.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: Toda pessoa e todo animal
  rationale: אָדָם é coletivo e genérico aqui, referindo-se a qualquer ser humano exposto; “pessoa” transmite esse alcance em português. A repetição de “todo” torna clara a força distributiva aplicada também aos animais.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: que forem encontrados no campo
  rationale: Preserva o sentido passivo do nifal de מָצָא. O plural é exigido naturalmente em português pelo sujeito composto “pessoa e animal”.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: e não forem recolhidos para dentro de casa
  rationale: “Recolhidos” conserva o valor passivo de אָסַף, e “para dentro” representa a direção indicada por הַבַּיְתָה.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: o granizo cairá sobre eles
  rationale: Formulação idiomática que preserva o movimento descendente de יָרַד e a incidência do granizo sobre os expostos.
- source_word: וָמֵתוּ
  choice: e morrerão
  rationale: Apresenta de modo direto a consequência futura e fatal anunciada no contexto.
theological_decisions:
- issue: Sentido representativo de אָדָם na advertência
  choice: Toda pessoa
  alternative: Todo homem
  rationale: Neste contexto, אָדָם não identifica especificamente indivíduos do sexo masculino, mas qualquer ser humano que permaneça no campo. “Toda pessoa” preserva o caráter genérico e distributivo sem reduzir o alcance da advertência.
- issue: Natureza do abrigo indicado por הַבַּיְתָה
  choice: para dentro de casa
  alternative: para um abrigo
  rationale: A tradução mantém a imagem lexical de בַּיִת e sua forma direcional, sem decidir que apenas uma residência humana, e não uma construção protetora, esteja em vista; a nota registra essa amplitude contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade no singular dirigido ao faraó, evita arcaísmos e conserva a estrutura solene da advertência.
