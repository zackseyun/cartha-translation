source:
  edition: WLC
  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: pt
  text: Quem dentre os servos do faraó temeu a palavra de Yahweh[a] levou depressa seus servos e seu gado para dentro das casas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele, dentre os servos do faraó, que temeu a palavra de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “fez fugir”; isto é, levou-os rapidamente para um lugar coberto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: Quem ... temeu
  rationale: O artigo com o particípio tem valor substantivado, referindo-se à pessoa — ou, de modo geral, a qualquer pessoa — que temia. “Quem ... temeu” expressa naturalmente essa referência em português.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: דָּבָר pode significar “palavra” ou “mensagem”. “A palavra de Yahweh” preserva a expressão bíblica e evita restringi-la interpretativamente a “aviso”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando o nome pessoal presente no texto hebraico.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: dentre os servos do faraó
  rationale: 'A preposição מִן tem sentido partitivo: a pessoa em questão pertencia ao grupo dos servos do faraó.'
- source_word: הֵנִיס
  choice: levou depressa
  rationale: O hifil de נוּס significa fazer fugir ou pôr em fuga. No contexto, descreve a ação urgente de fazer pessoas e animais entrarem nos edifícios antes do granizo; “levou depressa” comunica isso com naturalidade sem acrescentar pânico.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עֶבֶד pode designar servo ou escravo. Aqui o foco recai sobre o pessoal subordinado do oficial egípcio, e “servos” é adequado ao contexto sem decidir além do que o versículo exige.
- source_word: מִקְנֵהוּ
  choice: seu gado
  rationale: מִקְנֶה abrange os animais domésticos possuídos por alguém. “Gado” é uma forma corrente e coletiva em português, entendida aqui em sentido amplo, não apenas como bovinos.
- source_word: אֶל הַבָּתִּים
  choice: para dentro das casas
  rationale: A construção indica movimento em direção ao interior dos edifícios. O plural “casas” foi preservado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” conserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o singular do hebraico, o valor partitivo de מִן e o plural “casas”. Os marcadores [a] e [b] aparecem no texto principal.
