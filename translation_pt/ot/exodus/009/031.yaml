  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: pt
  text: O linho e a cevada foram atingidos, porque a cevada já tinha espigas[a], e o linho estava em botão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «estava amadurecendo».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «estava em flor».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: o linho
  rationale: פִּשְׁתָּה designa a planta do linho; em português, «linho» é a forma corrente de nomear tanto a planta quanto a fibra, e o contexto agrícola deixa claro que se trata da cultura.
- source_word: הַשְּׂעֹרָה
  choice: a cevada
  rationale: שְׂעֹרָה é o termo comum para cevada, um dos cultivos atingidos pelo granizo.
- source_word: נֻכָּתָה
  choice: foram destruídos
  rationale: A forma passiva de נכה indica que os cultivos foram atingidos com efeito devastador. «Foram destruídos» expressa naturalmente em português o resultado do granizo; usa-se o plural por causa do sujeito composto.
- source_word: כִּי
  choice: porque
  rationale: כִּי introduz a razão pela qual esses cultivos sofreram o dano; «porque» é claro e natural no português moderno.
- source_word: אָבִיב
  choice: já tinha espigas
  rationale: אָבִיב descreve o cereal no estágio em que a espiga já se formou e está fresca ou amadurecendo. A expressão concreta «já tinha espigas» é clara para leitores comuns e evita sugerir que o grão estivesse plenamente maduro.
- source_word: גִּבְעֹל
  choice: estava em botão
  rationale: גִּבְעֹל indica um estágio avançado do desenvolvimento do linho, possivelmente com botões, flores ou cápsulas em formação. «Em botão» preserva a imagem vegetal sem impor precisão maior do que a evidência lexical permite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário agrícola acessível. Os marcadores aparecem imediatamente após as expressões às quais suas alternativas se referem. A concordância verbal plural segue o sujeito composto em português.
