  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: pt
  text: 'Então o SENHOR disse a Moisés: “Vá até o faraó e diga-lhe: ‘Assim diz o SENHOR, o Deus dos hebreus: Deixe o meu povo ir, para que me sirva.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Vá até o faraó
  rationale: A expressão hebraica, literalmente ‘entre/vá a Faraó’, indica dirigir-se à presença dele; ‘vá até’ comunica isso naturalmente em português sem acrescentar a ideia específica de entrar em um recinto.
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: e diga-lhe
  rationale: Embora o verbo seja literalmente ‘falar’, neste contexto introduz a mensagem exata a ser transmitida; ‘diga-lhe’ é idiomático e fiel à função da forma verbal.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a convenção portuguesa tradicional para representar o nome divino YHWH, usando versaletes simulados por maiúsculas.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Deixe o meu povo ir
  rationale: O imperativo intensivo exige que o faraó liberte ou permita a partida do povo; esta formulação preserva o conhecido sentido do refrão e soa natural.
- source_word: וְיַעַבְדֻנִי
  choice: para que me sirva
  rationale: עבד pode significar servir, trabalhar ou prestar culto. ‘Sirva’ mantém a amplitude sem reduzir o termo apenas a ‘adorar’; o singular concorda com o coletivo ‘povo’.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: A escolha segue uma convenção bíblica amplamente reconhecida em português, sem alterar a identificação do Deus de Israel; as maiúsculas distinguem o nome divino do título comum.
- issue: Amplitude religiosa e política de עבד
  choice: servir
  alternative: prestar culto
  rationale: ‘Servir’ preserva a tensão lexical entre serviço, lealdade e culto, importante no confronto entre a autoridade do faraó e a de Deus.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. Mantém a fórmula profética ‘Assim diz o SENHOR’ e o tratamento coletivo singular de ‘povo’.
