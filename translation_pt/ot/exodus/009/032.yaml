  text: וְ/הַ/חִטָּ֥ה וְ/הַ/כֻּסֶּ֖מֶת לֹ֣א נֻכּ֑וּ כִּ֥י אֲפִילֹ֖ת הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: pt
  text: Mas o trigo e a espelta[a] não foram atingidos, porque amadurecem mais tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “espelta” pode indicar um cereal aparentado, como o trigo-emmer.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: Mas o trigo
  rationale: חִטָּה significa trigo. Embora וְ seja formalmente “e”, “Mas” expressa em português o contraste contextual com as culturas destruídas no versículo anterior.
- source_word: וְהַכֻּסֶּמֶת
  choice: e a espelta[a]
  rationale: כֻּסֶּמֶת designa um cereal geralmente identificado como espelta ou uma espécie próxima, possivelmente o trigo-emmer; “espelta” é uma designação moderna reconhecível, com a incerteza botânica preservada em nota.
- source_word: לֹא נֻכּוּ
  choice: não foram atingidos
  rationale: O passivo de נכה indica que essas plantas não foram golpeadas pelo granizo. “Atingidos” é natural em português e conserva a imagem do impacto, sem reduzir o sentido a mero dano.
- source_word: כִּי
  choice: porque
  rationale: כִּי introduz a razão pela qual esses cereais não foram atingidos.
- source_word: אֲפִילֹת הֵנָּה
  choice: amadurecem mais tarde
  rationale: A expressão feminina plural descreve as culturas como tardias ou ainda pouco desenvolvidas. A formulação comunica com clareza o sentido agrícola provável e explica por que resistiram ao granizo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O contraste com o versículo anterior é explicitado por “Mas”; a ordem e a relação causal do hebraico são preservadas. O plural masculino em “atingidos” e a forma verbal “amadurecem” concordam naturalmente com o conjunto formado por trigo e espelta.
