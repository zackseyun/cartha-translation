id: EXO.9.30
reference: Exodus 9:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֖ה וַ/עֲבָדֶ֑י/ךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּ/ן מִ/פְּנֵ֖י יְהוָ֥ה אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: pt
  text: Mas, quanto a você e aos seus servos, sei que vocês ainda não temem[a] Yahweh Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuam sem temer” ou “antes que temam”. O termo hebraico pode indicar prioridade temporal (“antes”) ou, neste contexto, ter o sentido de “ainda não”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, o nome divino, aqui representado por “Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas, quanto a você
  rationale: A conjunção com o pronome independente assinala contraste e topicalização; esta formulação os expressa naturalmente em português.
- source_word: וַעֲבָדֶיךָ
  choice: e aos seus servos
  rationale: עֶבֶד pode significar servo ou escravo; no contexto da corte do faraó, “servos” abrange seus subordinados sem impor uma condição social mais específica.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: O perfeito expressa aqui o conhecimento ou a avaliação já firmada de Moisés, com valor presente.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Moisés sabe.
- source_word: טֶרֶם
  choice: ainda não
  rationale: Com o imperfeito seguinte, indica que o temor ainda não se manifestou, embora também admita uma leitura temporal com “antes”.
- source_word: תִּירְאוּן
  choice: vocês ... temem
  rationale: O plural abrange o faraó e seus servos. “Temer” preserva a amplitude de ירא entre medo, reverência e reconhecimento diante de Deus.
- source_word: מִפְּנֵי
  choice: temem ... Yahweh Deus
  rationale: Na construção com ירא, a expressão literalmente ligada à presença ou face pode ser vertida de modo idiomático em português com objeto direto, sem acrescentar uma distinção ausente no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Funciona em aposição ao nome divino, formando a designação “Yahweh Deus”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Amplitude de ירא diante de Deus
  choice: temem
  alternative: reverenciam; têm medo de
  rationale: “Temer” mantém a tensão entre pavor, reverência e resposta adequada ao juízo divino, sem restringir o sentido a apenas uma dessas dimensões.
- issue: Valor temporal de טֶרֶם
  choice: ainda não
  alternative: antes de
  rationale: No contexto, “ainda não” comunica naturalmente que o faraó e seus servos não chegaram a temer a Deus; a possibilidade formal de leitura com “antes” é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com concordância brasileira natural (“você”/“vocês”). A repetição entre o singular “você” e o plural “vocês” preserva a mudança do hebraico, que primeiro destaca o faraó e depois inclui seus servos. Os marcadores foram posicionados junto aos elementos que explicam.
