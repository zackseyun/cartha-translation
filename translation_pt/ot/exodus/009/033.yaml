  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: pt
  text: Então Moisés saiu da presença do faraó e da cidade e estendeu as mãos a Yahweh. Os trovões[a] e o granizo cessaram, e a chuva já não era derramada sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as vozes”; neste contexto de tempestade, a expressão se refere aos trovões.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a chuva não foi derramada sobre o chão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: Moisés saiu da presença do faraó, foi para fora da cidade
  rationale: Expressa a separação da presença do faraó e o movimento para fora da cidade. A formulação torna natural em português a construção hebraica incomum com אֶת הָעִיר, sem ocultar os dois elementos do percurso.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: estendeu as mãos
  rationale: Reproduz de modo natural o gesto físico de oração; כַּפָּיו designa literalmente as palmas, mas o idioma português normalmente emprega “mãos”.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: אֶל indica a direção do gesto e da oração. O nome divino é transliterado como “Yahweh”, preservando o nome da aliança presente no texto hebraico.
- source_word: הַקֹּלוֹת
  choice: os trovões
  rationale: O sentido básico é “as vozes” ou “os sons”, mas, no contexto inequívoco da tempestade, refere-se aos trovões.
- source_word: וַיַּחְדְּלוּ
  choice: cessaram
  rationale: Mantém o sentido de interrupção e combina com o registro narrativo digno da passagem.
- source_word: וְהַבָּרָד
  choice: e o granizo
  rationale: Equivalência direta para o fenômeno meteorológico da praga.
- source_word: וּמָטָר לֹא נִתַּךְ
  choice: e a chuva já não era derramada
  rationale: Preserva a forma passiva e a imagem de a chuva ser derramada. “Já não” explicita naturalmente, no contexto narrativo, que a precipitação cessou.
- source_word: אָרְצָה
  choice: sobre a terra
  rationale: A forma direcional de אֶרֶץ aponta para a terra ou o chão; “sobre a terra” é claro e adequado à abrangência da narrativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação foi levemente explicitada para transmitir com naturalidade a saída da presença do faraó e da cidade. A imagem da chuva “derramada” foi mantida, enquanto “estendeu as mãos” evita a rigidez de “estendeu as palmas”.
