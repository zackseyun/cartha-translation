  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Levante-se cedo pela manhã, apresente-se diante do faraó e diga-lhe: ‘Assim diz Yahweh, o Deus dos hebreus: Deixe o meu povo ir, para que me sirvam[a]’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que me adorem”. O verbo hebraico pode indicar o serviço prestado a Deus, inclusive a adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Levante-se cedo pela manhã
  rationale: Reproduz o sentido idiomático do imperativo de שׁכם e sua referência temporal, em português natural.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: apresente-se diante de
  rationale: Expressa o ato deliberado de tomar posição perante o faraó e preserva o tom formal da audiência.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula solene de mensageiro que introduz uma declaração divina autorizada.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: o Deus dos hebreus
  rationale: Tradução direta e idiomática da cadeia construta hebraica.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: Deixe o meu povo ir
  rationale: No contexto do Êxodo, comunica claramente a ordem para que o faraó liberte o povo.
- source_word: וְיַעַבְדֻנִי
  choice: para que me sirva
  rationale: O verbo עבד abrange serviço prestado a Deus, inclusive culto; 'sirva' preserva essa amplitude, e a conjunção com o imperfeito indica finalidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome divino pessoal; a transliteração preserva sua distinção em relação a títulos.
- issue: Sentido de וְיַעַבְדֻנִי
  choice: para que me sirva
  alternative: para que me adore
  rationale: '''Sirva'' conserva o sentido amplo de עבד e não restringe a finalidade apenas ao culto litúrgico, embora este esteja incluído.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala divina conserva solenidade sem recorrer a construções arcaicas.
