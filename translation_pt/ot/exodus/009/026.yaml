base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: pt
  text: Somente na terra de Gósen, onde estavam os filhos de Israel[a], não houve granizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Marca restrição ou exclusão e, no início da frase, conserva a ênfase do hebraico.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: na terra de Gósen
  rationale: Representa naturalmente a preposição בְּ, o substantivo אֶרֶץ e o nome da região.
- source_word: אֲשֶׁר שָׁם
  choice: onde
  rationale: A combinação do relativo com o advérbio de lugar forma uma expressão locativa, vertida de modo claro e idiomático.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar masculina do hebraico e continua inteligível em português moderno.
- source_word: לֹא הָיָה
  choice: não houve
  rationale: Expressa de forma natural em português a inexistência ou ausência indicada pela forma negativa de היה.
- source_word: בָּרָד
  choice: granizo
  rationale: É o equivalente português corrente para o fenômeno meteorológico no relato da praga.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A escolha mantém a forma familiar masculina explícita do texto hebraico sem excluir em nota as alternativas coletivas naturais em português.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada ao uso natural do português, preservando a restrição enfática de רַק.
