  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés e a Arão: “Peguem para vocês punhados cheios[a] de fuligem[b] de uma fornalha, e que Moisés a lance para o céu[c], diante dos olhos do faraó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a plenitude das mãos de vocês”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido de modo mais geral como “cinzas”, embora o hebraico indique mais especificamente a fuligem fina de uma fornalha.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para os céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קְחוּ לָכֶם
  choice: Peguem para vocês
  rationale: O imperativo plural dirige-se a Moisés e Arão; “para vocês” conserva a nuance dativa/reflexiva de לָכֶם.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: punhados cheios
  rationale: Expressa de modo natural a ideia literal de encher as mãos em concha e preserva a noção explícita de plenitude.
- source_word: פִּיחַ
  choice: fuligem
  rationale: Designa o resíduo fino e escuro produzido pelo fogo, sentido mais específico do que “cinzas”.
- source_word: כִּבְשָׁן
  choice: fornalha
  rationale: Termo amplo e corrente para forno ou instalação de calor intenso, sem especificar indevidamente seu uso.
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: e que Moisés a lance
  rationale: Preserva a mudança do comando plural para Moisés como agente singular; o pronome feminino retoma naturalmente “fuligem” em português.
- source_word: הַשָּׁמַיְמָה
  choice: para o céu
  rationale: Comunica a direção ascendente indicada pela terminação direcional, sem atribuir necessariamente um sentido teológico ao movimento.
- source_word: לְעֵינֵי פַרְעֹה
  choice: diante dos olhos do faraó
  rationale: Mantém a imagem concreta do idioma hebraico e enfatiza que a ação seria realizada visivelmente perante o faraó.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de הַשָּׁמַיְמָה
  choice: para o céu
  alternative: para os céus
  rationale: Neste gesto físico, a expressão indica primordialmente direção ascendente. A alternativa formalmente plural permanece registrada em nota, sem impor uma referência ao domínio celestial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “que Moisés a lance” conserva naturalmente a mudança do destinatário plural para o agente singular. Os marcadores foram posicionados junto às expressões a que suas notas realmente se referem.
