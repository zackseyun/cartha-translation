  verdict: approve
  source_fidelity: 'A tradução conserva todos os elementos do hebraico: Yahweh é o sujeito explícito de וַיְחַזֵּק, «o coração do faraó» é o objeto, e a recusa de ouvir o pronome plural é mantida sem explicitar Moisés e Arão. «Endureceu» é uma representação contextual adequada de חזק nesta fórmula de Êxodo, e a nota registra de modo apropriado as alternativas mais literais «tornou firme» e «fortaleceu».'
  naturalness: 'O texto é fluente, claro e de registro bíblico moderno em português internacional: «Mas Yahweh endureceu o coração do faraó, e ele não os ouviu, conforme Yahweh havia falado a Moisés.» «Não os ouviu» mantém a concisão e a referência pronominal do original; embora «não lhes deu ouvidos» também fosse possível, não é necessária alteração.'
  terminology: «Yahweh» segue a política informada para o Tetragrama. «Coração», «faraó», «endureceu» e «conforme ... havia falado» são consistentes com a terminologia e preservam a agência divina explícita sem interpretar ou atenuar a tensão teológica.
