  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: pt
  text: Mas Yahweh endureceu o coração do faraó[a], e ele não os ouviu, conforme Yahweh havia falado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornou firme o coração do faraó” ou “fortaleceu o coração do faraó”. O verbo hebraico significa mais literalmente “tornar forte/firme”, mas, neste contexto, refere-se à resistência obstinada do faraó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: endureceu
  rationale: O hifil de חזק significa literalmente tornar forte ou firme; na fórmula recorrente ligada ao coração do faraó, “endureceu” comunica de modo natural sua resistência obstinada, sem apagar a agência divina explícita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵב פַּרְעֹה
  choice: o coração do faraó
  rationale: Mantém a imagem antropológica hebraica do coração como centro da vontade e da disposição, sem explicá-la dentro do texto.
- source_word: שָׁמַע אֲלֵהֶם
  choice: não os ouviu
  rationale: שׁמע com אֶל pode significar ouvir ou dar ouvidos. “Não os ouviu” é claro e conserva a expressão relacional sem especificar demais como “não obedeceu”.
- source_word: אֲלֵהֶם
  choice: os
  rationale: Conserva o pronome do hebraico; pelo contexto, seu referente é Moisés e Arão.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: conforme Yahweh havia falado a Moisés
  rationale: “Conforme” preserva o valor comparativo e de cumprimento de כַּאֲשֶׁר; o mais-que-perfeito composto situa naturalmente a fala divina antes do acontecimento narrado.
theological_decisions:
- issue: Agência divina no endurecimento do coração do faraó
  choice: Yahweh endureceu o coração do faraó
  alternative: Yahweh tornou firme / fortaleceu o coração do faraó
  rationale: O hebraico apresenta Yahweh diretamente como sujeito e o coração do faraó como objeto. A tradução não transforma essa ação em mera permissão, preservando a tensão teológica, enquanto a nota registra o sentido mais literal do verbo חזק.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens centrais do hebraico foram preservadas, com ajustes sintáticos naturais em português.
