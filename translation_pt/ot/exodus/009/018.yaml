base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: pt
  text: Eis que amanhã, por volta desta hora[a], farei cair granizo muito pesado, como nunca houve no Egito desde o dia em que foi fundado[b] até agora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “amanhã, a esta hora”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estabelecido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz com ênfase solene o anúncio divino e preserva a força dêitica da expressão hebraica sem acrescentar uma interpretação.
- source_word: מַמְטִיר
  choice: farei cair uma chuva de granizo
  rationale: O hifil atribui diretamente a Deus a ação de fazer o granizo precipitar. Esta formulação é natural em português e mantém a causação explícita.
- source_word: כָּעֵת מָחָר
  choice: amanhã, por volta desta hora
  rationale: O כְּ pode indicar aproximação ou comparação; “por volta desta hora” conserva essa nuance temporal sem excluir a leitura mais exata.
- source_word: בָּרָד
  choice: granizo
  rationale: É o termo meteorológico corrente, preciso e amplamente compreensível em português moderno.
- source_word: כָּבֵד מְאֹד
  choice: muito forte
  rationale: Embora כָּבֵד signifique literalmente “pesado”, aplicado a uma precipitação de granizo descreve naturalmente sua grande intensidade ou severidade; “muito forte” comunica isso com clareza.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: como nunca houve
  rationale: Preserva de modo conciso a comparação superlativa com todos os episódios anteriores.
- source_word: בְּמִצְרַיִם
  choice: no Egito
  rationale: Tradução locativa direta.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: desde o dia em que foi fundado
  rationale: O nifal expressa o estabelecimento do Egito de forma passiva. “Fundado” é claro e idiomático em referência ao país.
- source_word: וְעַד עָתָּה
  choice: até agora
  rationale: Expressão temporal corrente que conserva o intervalo desde a fundação do Egito até o momento do anúncio.
theological_decisions:
- issue: Agência divina no anúncio da praga
  choice: “farei cair” mantém Deus como agente direto da queda do granizo.
  alternative: Uma formulação impessoal, como “cairá granizo”.
  rationale: O verbo causativo na primeira pessoa atribui explicitamente a ação a Deus; a tradução não deve atenuar essa agência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Eis que” conserva a solenidade do anúncio; “chuva de granizo muito forte” evita o arcaísmo “saraiva” e a combinação pouco natural “granizo pesado”. Os marcadores foram colocados junto às expressões às quais as alternativas realmente se referem.
