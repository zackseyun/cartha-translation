source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: pt
  text: Pois, a esta altura, eu já poderia ter estendido a mão e ferido você e o seu povo com a peste[a], e você teria sido eliminado da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Pois agora estendi a mão, feri você e o seu povo com a peste, e você foi eliminado da terra.” As formas verbais hebraicas estão formalmente no passado, mas o contexto favorece fortemente um sentido contrafactual.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da declaração anterior com valor causal e explicativo.
- source_word: עַתָּה
  choice: a esta altura
  rationale: No contexto contrafactual, expressa naturalmente o sentido temporal de algo que já poderia ter acontecido.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: eu já poderia ter estendido a mão
  rationale: Preserva a imagem hebraica da mão estendida como ação divina, enquanto o auxiliar expressa a força contrafactual exigida pelo contexto.
- source_word: וָאַךְ
  choice: e ferido
  rationale: Traduz נכה de modo natural e digno no contexto de juízo, sem recorrer a linguagem arcaica.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: você e o seu povo
  rationale: Representa diretamente os objetos do juízo; “você” oferece ampla legibilidade brasileira.
- source_word: בַּדָּבֶר
  choice: com a peste
  rationale: דֶּבֶר designa peste ou pestilência, especialmente como instrumento de juízo; “peste” é claro e distingue esta doença das pragas em sentido mais amplo.
- source_word: וַתִּכָּחֵד
  choice: você teria sido eliminado
  rationale: Expressa o sentido passivo de ser apagado, exterminado ou removido, e o condicional composto acompanha a leitura contrafactual.
- source_word: מִן־הָאָרֶץ
  choice: da terra
  rationale: Mantém a amplitude possível de אֶרֶץ e a ideia de eliminação da face da terra, sem restringir necessariamente o sentido ao território do Egito.
theological_decisions:
- issue: Força contrafactual da sequência verbal
  choice: 'Traduzir como situação não realizada: “eu já poderia ter... e você teria sido...”'
  alternative: 'Traduzir formalmente no passado: “agora estendi... e você foi eliminado...”'
  rationale: Embora as formas hebraicas sejam formalmente passadas, o faraó continua vivo e sendo interpelado. O contraste com o versículo seguinte indica aquilo que Deus poderia já ter feito, mas não fez, preservando assim a tensão discursiva sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira e compreensão internacional. A formulação principal privilegia o sentido contextual, enquanto a nota preserva a forma verbal mais literal e a ambiguidade do hebraico.
