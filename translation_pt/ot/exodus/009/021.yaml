  text: וַ/אֲשֶׁ֥ר לֹא שָׂ֛ם לִבּ֖/וֹ אֶל דְּבַ֣ר יְהוָ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: pt
  text: Mas quem não deu atenção à palavra de Yahweh deixou seus servos e seus rebanhos no campo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não pôs o coração na palavra de Yahweh”, isto é, não a levou a sério.'
    reason: Registra a forma mais literal do idioma hebraico לֹא שָׂם לִבּוֹ אֶל e esclarece seu sentido contextual.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Mas quem
  rationale: O waw introduz contraste com os que temeram a palavra de Yahweh no versículo anterior, enquanto אֲשֶׁר mantém o sentido relativo indefinido.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: não deu atenção a
  rationale: A expressão significa literalmente não pôr o coração em algo; aqui indica não levar a sério nem atender à advertência. A tradução comunica o sentido idiomático em português atual, preservando a forma literal na nota.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: דָּבָר pode significar palavra, assunto ou mensagem; neste contexto é a advertência anunciada por Yahweh. 'Palavra' conserva a expressão bíblica sem perder clareza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעֲזֹב
  choice: deixou
  rationale: O verbo descreve concretamente a decisão de deixar pessoas e animais expostos no campo; 'deixou' é natural e não acrescenta a carga afetiva de 'abandonou'.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עֶבֶד pode indicar servo ou escravo. O contexto destaca os trabalhadores da casa deixados ao ar livre, sem especificar aqui sua condição jurídica; 'servos' preserva essa amplitude.
- source_word: מִקְנֵהוּ
  choice: seus rebanhos
  rationale: O substantivo coletivo abrange os animais domésticos possuídos. 'Rebanhos' é claro e natural em português, sem restringir o referente apenas ao gado bovino.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução locativa direta; o contexto torna evidente que servos e animais ficaram expostos ao granizo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e mantém o contraste narrativo. O marcador [a] aparece no texto principal.
