base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: pt
  text: 'E Yahweh fixou um prazo[a], dizendo: “Amanhã Yahweh fará isto na terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um tempo determinado” ou “uma ocasião marcada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: marcou
  rationale: O verbo שׂוּם, em combinação com מוֹעֵד, tem aqui o sentido de estabelecer ou fixar. “Marcou” forma uma expressão natural em português com “um tempo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מוֹעֵד
  choice: um tempo
  rationale: O substantivo indica um tempo determinado ou ocasião marcada. “Um tempo” preserva a concisão do hebraico, enquanto a nota registra alternativas mais explícitas.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente convencional do infinitivo hebraico que introduz discurso direto na narrativa.
- source_word: מָחָר
  choice: Amanhã
  rationale: Traduz diretamente o advérbio temporal e destaca o momento anunciado para o cumprimento.
- source_word: יַעֲשֶׂה
  choice: fará
  rationale: Preserva o sentido amplo e simples de עשה sem especificar além do texto a natureza da ação.
- source_word: הַדָּבָר הַזֶּה
  choice: isto
  rationale: Em português atual, “fará isto” é mais natural que o decalque “fará esta coisa” e mantém a referência ampla ao ato anunciado.
- source_word: בָּאָרֶץ
  choice: nesta terra
  rationale: O artigo definido hebraico aponta para a terra conhecida no contexto, isto é, o Egito. “Nesta terra” mantém a referência contextual sem inserir explicitamente “Egito”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, sem substituí-lo por um título nem adotar uma forma portuguesa tradicional baseada numa vocalização posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a estrutura narrativa concisa do hebraico e evita explicar no corpo do versículo que a terra é o Egito, informação fornecida pelo contexto.
