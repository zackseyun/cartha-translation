  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: pt
  text: 'E Yahweh fez isso no dia seguinte: todo o gado do Egito morreu, mas, do gado dos filhos de Israel[a], não morreu um só animal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “israelitas”. Hebraico: “filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעַשׂ ... אֶת הַדָּבָר הַזֶּה
  choice: fez isso
  rationale: Reproduz com naturalidade em português o sentido direto da expressão hebraica, sem o peso pouco idiomático de “fez esta coisa”.
- source_word: מִמָּחֳרָת
  choice: no dia seguinte
  rationale: Expressa de modo claro e corrente a referência ao dia posterior.
- source_word: כֹּל מִקְנֵה מִצְרָיִם
  choice: todo o gado do Egito
  rationale: מִקְנֶה abrange os animais domésticos de criação; “gado”, em uso coletivo, é conciso e mais amplo que uma referência apenas a bovinos.
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל
  choice: mas, do gado dos filhos de Israel
  rationale: Mantém a preposição מִן (“do/dentre o”) e o contraste explícito com os animais do Egito.
- source_word: לֹא מֵת אֶחָד
  choice: não morreu um só animal
  rationale: Conserva a negação enfática e explicita o referente animal implícito no numeral masculino אֶחָד.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o nome pessoal divino; “Yahweh” preserva esse nome sem substituí-lo por um título.
- issue: Expressão étnica בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução principal preserva a forma concreta do hebraico, enquanto a nota registra o equivalente étnico natural; no contexto, a expressão designa coletivamente o povo de Israel.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação com dois-pontos liga naturalmente a ação divina ao seu resultado, e “um só animal” torna explícito o referente sem alterar o sentido.
