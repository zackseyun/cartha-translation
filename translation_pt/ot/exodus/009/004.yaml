source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: pt
  text: Mas Yahweh fará distinção entre os animais de criação de Israel e os do Egito, e nenhum animal dos filhos de Israel morrerá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos israelitas”. Em hebraico, “dos filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָה
  choice: fará distinção
  rationale: O hifil de פלא expressa aqui uma distinção ou separação clara; a formulação preserva a nuance causativa e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e ...
  rationale: Reproduz o par correlativo que contrasta os dois grupos.
- source_word: מִקְנֵה
  choice: rebanhos
  rationale: Designa coletivamente os animais domésticos; no contexto, 'rebanhos' é corrente e não restringe o sentido apenas ao gado bovino.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Mantém a designação nacional do construto hebraico, 'rebanhos do Egito'.
- source_word: וְלֹא יָמוּת
  choice: e não morrerá
  rationale: Preserva a coordenação explícita e o valor futuro do hebraico sem tornar a relação lógica mais específica do que o texto.
- source_word: מִכָּל ... דָּבָר
  choice: nenhum animal
  rationale: No contexto dos rebanhos, a expressão negativa idiomática indica que nem um único animal morrerá; explicitar 'animal' evita o português pouco natural 'nenhuma coisa'.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pertencente aos filhos de Israel
  rationale: O לְ indica pertença no contexto, e 'filhos de Israel' preserva a expressão nacional e familiar do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o nome divino; 'Yahweh' o preserva como nome pessoal, sem substituí-lo por um título.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha conserva a expressão masculina plural tradicional do hebraico e sua forma familiar-nacional, sem excluir semanticamente o povo como um todo.
- issue: Relação entre a distinção e a sobrevivência dos animais de Israel
  choice: coordenação com 'e'
  alternative: oração de resultado com 'de modo que'
  rationale: O וְ hebraico permite uma relação contextual de resultado, mas não a marca de maneira inequívoca; a coordenação preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. 'Rebanhos' é usado em sentido coletivo para os animais domésticos. A nota esclarece a expressão hebraica nacional sem sobrecarregar o texto principal.
