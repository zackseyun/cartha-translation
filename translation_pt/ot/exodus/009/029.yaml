  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: pt
  text: 'Moisés lhe disse: “Assim que eu sair da cidade, estenderei as mãos a Yahweh. Os trovões[a] cessarão, e não haverá mais granizo, para que você saiba que a terra[b] pertence a Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “as vozes”; neste contexto de tempestade, a expressão se refere aos trovões.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a região”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: Assim que eu sair
  rationale: A preposição כְּ com o infinitivo construto de יצא e o sufixo da primeira pessoa marca o momento da saída de Moisés; esta formulação comunica com naturalidade a sequência temporal iminente.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: estenderei as mãos
  rationale: פרשׂ com כף, em contexto de oração, descreve o gesto de abrir ou estender as mãos em súplica; “estenderei as mãos” é natural e preserva o gesto físico.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando sua função como nome pessoal da aliança.
- source_word: הַקֹּלוֹת
  choice: os trovões
  rationale: Embora o plural signifique literalmente “as vozes” ou “os sons”, no contexto da tempestade designa os trovões.
- source_word: יֶחְדָּלוּן
  choice: cessarão
  rationale: חדל significa cessar ou parar; “cessarão” mantém concisão e registro digno.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: e não haverá mais granizo
  rationale: Expressa de modo corrente em português que o granizo deixará de ocorrer.
- source_word: לְמַעַן תֵּדַע
  choice: para que você saiba
  rationale: לְמַעַן introduz finalidade; a construção portuguesa preserva esse valor sem eliminar a nuance volitiva do imperfeito.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: que a terra pertence a Yahweh
  rationale: O לְ diante do nome divino indica posse, e הָאָרֶץ pode designar tanto a terra em sentido amplo quanto uma região; “a terra” preserva melhor a amplitude possível no contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: a região; o país
  rationale: A afirmação pode ter alcance universal, declarando o domínio de Yahweh sobre a terra, mas o substantivo também admite referência territorial; a nota mantém essa ambiguidade lexical disponível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta mantém ritmo natural; “você” comunica a segunda pessoa singular de modo amplamente compreensível no português brasileiro. As notas preservam alternativas genuínas do hebraico sem sobrecarregar o texto principal.
