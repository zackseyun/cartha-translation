  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: pt
  text: Então Moisés estendeu o seu cajado em direção ao céu, e Yahweh enviou trovões e granizo; fogo desceu até a terra.[a] E Yahweh fez chover granizo sobre a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “fogo” neste contexto provavelmente se refere a relâmpagos. O hebraico diz literalmente que o fogo foi em direção à terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: estendeu
  rationale: O verbo נָטָה exprime aqui o ato de estender o cajado; esta é uma formulação natural e adequada ao contexto das pragas.
- source_word: מַטֵּהוּ
  choice: o seu cajado
  rationale: מַטֶּה pode significar cajado ou vara; “cajado” é claro, atual e apropriado para o instrumento de Moisés.
- source_word: עַל הַשָּׁמַיִם
  choice: em direção ao céu
  rationale: A preposição indica, neste gesto, orientação para cima. “Em direção ao céu” comunica naturalmente esse sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: enviou trovões e granizo
  rationale: Embora נָתַן signifique literalmente “deu”, “enviou” é idiomático neste contexto; קֹלֹת designa os estrondos do trovão numa tempestade.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: fogo desceu até a terra
  rationale: Preserva “fogo” e a direção para a terra, expressando em português natural o movimento descrito pelo hebraico sem substituí-lo interpretativamente por “relâmpago”.
- source_word: וַיַּמְטֵר
  choice: fez chover
  rationale: A forma causativa do verbo מָטַר é representada explicitamente por “fez chover”.
- source_word: אֶרֶץ מִצְרָיִם
  choice: a terra do Egito
  rationale: Mantém a referência geográfica explícita do hebraico e a extensão territorial da praga.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto apresenta o nome próprio divino; “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Identidade do “fogo” na tempestade
  choice: Manter “fogo” no texto principal
  alternative: relâmpago
  rationale: Embora o contexto provavelmente indique relâmpagos, אֵשׁ significa “fogo”. A tradução preserva a imagem e registra a provável referência em nota, sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a vivacidade da narrativa e a imagem concreta do hebraico sem linguagem arcaica.
