base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: pt
  text: E ela se tornará pó fino sobre toda a terra do Egito e se tornará, nas pessoas e nos animais, em furúnculos que irrompem com bolhas, em toda a terra do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: ela se tornará pó fino
  rationale: O verbo היה com לְ marca aqui o resultado da transformação das cinzas; “pó fino” comunica o caráter particulado de אָבָק. O pronome retoma naturalmente “a cinza” do versículo anterior.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: sobre toda a terra do Egito
  rationale: A preposição עַל exprime a dispersão do pó por cima de todo o território.
- source_word: עַל הָאָדָם וְעַל הַבְּהֵמָה
  choice: nas pessoas e nos animais
  rationale: אָדָם é coletivo e genérico neste contraste entre seres humanos e animais. Em português atual, “pessoas” transmite esse sentido sem sugerir apenas indivíduos do sexo masculino; בְּהֵמָה também tem valor coletivo.
- source_word: לִשְׁחִין
  choice: em furúnculos
  rationale: שְׁחִין designa uma afecção eruptiva da pele; “furúnculos” é uma equivalência tradicional, clara e corrente.
- source_word: פֹּרֵחַ
  choice: que irrompem
  rationale: O particípio, literalmente associado a brotar ou florescer, descreve figuradamente a irrupção da doença na pele.
- source_word: אֲבַעְבֻּעֹת
  choice: em bolhas
  rationale: O termo indica inchaços ou bolhas associados aos furúnculos. A formulação preserva este elemento sem reduzi-lo a um adjetivo não expresso no hebraico.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: em toda a terra do Egito
  rationale: A repetição mantém a ênfase hebraica na extensão total da praga.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: pessoas
  alternative: ser humano / humanidade / homem
  rationale: No contexto, o termo abrange coletivamente os seres humanos em contraste com os animais. “Pessoas” é natural, inclusivo no sentido lexical e não elimina o contraste humano-animal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura conserva a dupla transformação e a repetição territorial do hebraico, ao mesmo tempo que evita a expressão pouco natural “sobre o homem e sobre o animal”.
