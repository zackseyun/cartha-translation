base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: pt
  text: Pois, desta vez, enviarei todas as minhas pragas contra o seu coração[a], contra os seus servos e contra o seu povo, para que você saiba que não há ninguém como eu em toda a terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ao seu coração». A expressão hebraica pode indicar que as pragas são dirigidas contra o próprio faraó, atingindo o centro do seu ser.'
    reason: lexical_alternative
  - marker: b
    text: 'O termo hebraico também pode ter sentido mais local: «em todo o país» ou «em todo o território». Aqui, é entendido como uma afirmação universal da incomparabilidade do SENHOR.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada ao aviso e à preservação do faraó no contexto anterior; «Pois» mantém de modo natural a conexão discursiva.
- source_word: בַּפַּעַם הַזֹּאת
  choice: desta vez
  rationale: Expressão temporal idiomática referente à presente rodada de ações; é clara e corrente em português.
- source_word: שֹׁלֵחַ
  choice: enviarei
  rationale: O particípio indica ação iminente no contexto. O futuro em português comunica essa iminência com mais naturalidade do que uma forma progressiva, sem alterar o sentido.
- source_word: כָּל מַגֵּפֹתַי
  choice: todas as minhas pragas
  rationale: מַגֵּפָה pode designar golpe, aflição ou praga; «pragas» corresponde ao contexto de Êxodo e conserva a força de juízo.
- source_word: אֶל לִבְּךָ
  choice: contra o seu coração
  rationale: Conserva o substantivo hebraico «coração» e a força direcional ou adversativa da expressão, sem reduzi-la simplesmente a «contra você».
- source_word: וּבַעֲבָדֶיךָ
  choice: contra os seus servos
  rationale: Neste contexto, עֲבָדִים refere-se aos subordinados ou oficiais do faraó; «servos» evita identificá-los indevidamente como escravos.
- source_word: וּבְעַמֶּךָ
  choice: contra o seu povo
  rationale: Mantém explícita a força da preposição na coordenação e identifica os egípcios sujeitos ao faraó.
- source_word: בַּעֲבוּר
  choice: para que
  rationale: Marca propósito de forma direta e natural em português.
- source_word: תֵּדַע
  choice: você saiba
  rationale: Depois da expressão de propósito, o subjuntivo português expressa adequadamente o resultado pretendido, sem convertê-lo em simples previsão futura.
- source_word: אֵין כָּמֹנִי
  choice: não há ninguém como eu
  rationale: Expressa com clareza a fórmula hebraica de incomparabilidade divina.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: אֶרֶץ pode significar «terra» em sentido local ou mundial. No contexto da afirmação de incomparabilidade, «terra» preserva a formulação e permite o alcance universal, enquanto a nota registra a alternativa local.
theological_decisions:
- issue: Alcance da incomparabilidade divina
  choice: «em toda a terra», entendido como uma afirmação de alcance universal
  alternative: «em toda a região/terra», com referência mais local
  rationale: A narrativa apresenta a singularidade do SENHOR para além do Egito. A tradução mantém «terra», e a nota reconhece a polissemia do hebraico sem enfraquecer a afirmação.
- issue: Sentido de «contra o seu coração»
  choice: Manter a metáfora, dirigindo as pragas ao coração do faraó
  alternative: Achatar interpretativamente para «contra você» ou entender apenas «ao seu coração»
  rationale: O hebraico menciona explicitamente o coração. Preservá-lo retém a dimensão pessoal e interior do juízo e a tensão narrativa relacionada ao coração endurecido do faraó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «você» por naturalidade contemporânea e mantém «coração» para preservar a imagem e a tensão do hebraico. A repetição de «contra» esclarece o alcance coordenado das pragas.
