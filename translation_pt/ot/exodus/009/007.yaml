base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: pt
  text: O faraó mandou averiguar[a], e eis que não havia morrido nem um só dos animais de criação de Israel. Mas o coração do faraó ficou pesado[b], e ele não deixou o povo partir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mandou” ou “enviou”; o objeto não é expresso. Pelo contexto, ele mandou averiguar o que havia acontecido.'
    reason: implicit_object
  - marker: b
    text: 'Hebraico: “o coração do faraó ficou pesado”, expressão que, neste contexto, indica que ele se tornou obstinado e resistente.'
    reason: idiom
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou averiguar
  rationale: O verbo significa literalmente “mandou” ou “enviou”, sem objeto expresso. Como o contexto mostra que o faraó buscou confirmar o que acontecera aos animais de Israel, “mandou averiguar” torna explícita apenas a ação implícita necessária para um português natural.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: A expressão chama a atenção para o resultado surpreendente da averiguação e conserva a vivacidade narrativa do hebraico.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: não havia morrido nem um só animal dos rebanhos de Israel
  rationale: A formulação comunica o sentido enfático de עַד אֶחָד, “nem sequer um”, e emprega “havia morrido” por se tratar do resultado já ocorrido que a averiguação constatou.
- source_word: מִקְנֶה
  choice: animais dos rebanhos
  rationale: O termo abrange os animais domésticos possuídos por Israel e não se limita a bovinos, como poderia sugerir “gado” em alguns usos.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: o coração do faraó ficou pesado
  rationale: A tradução conserva a imagem específica do hebraico, segundo a qual o coração “ficou pesado”, sem substituir a expressão por outra fórmula de endurecimento nem introduzir um agente não mencionado.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: e ele não deixou o povo partir
  rationale: Neste contexto, שׁלח significa permitir que o povo saia ou libertá-lo; “deixou o povo partir” é claro e idiomático em português.
theological_decisions:
- issue: Agência no endurecimento do faraó
  choice: o coração do faraó ficou pesado
  alternative: o coração do faraó foi endurecido / o faraó endureceu o coração
  rationale: A oração hebraica apresenta o coração do faraó como sujeito e não identifica um agente externo. A imagem literal, explicada em nota, preserva a tensão entre a responsabilidade humana e a ação divina no conjunto da narrativa, sem resolvê-la neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “E eis que” mantém o relevo narrativo do original; “ficou pesado” preserva a metáfora hebraica, enquanto a nota evita que ela seja entendida apenas como tristeza.
