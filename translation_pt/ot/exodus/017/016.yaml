  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: pt
  text: 'E ele disse[a]: “Uma mão está sobre o trono de Yah. Yahweh estará em guerra contra Amaleque de geração em geração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil e elíptico; literalmente: “Uma mão sobre o trono de Yah”. Também pode ser entendido como “uma mão contra o trono de Yah” ou, menos provavelmente, tomando כֵּס no sentido de “estandarte”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém a continuação narrativa do wayyiqtol e o sujeito masculino singular não explicitado pelo nome neste versículo.
- source_word: כִּי
  choice: não traduzido separadamente
  rationale: Aqui introduz o conteúdo da fala; os dois-pontos e as aspas cumprem essa função em português sem impor um valor causal incerto.
- source_word: יָד
  choice: Uma mão
  rationale: Preserva a ausência de artigo e não identifica de quem é a mão numa expressão deliberadamente elíptica.
- source_word: עַל
  choice: sobre
  rationale: É o sentido espacial mais direto da preposição; a leitura adversativa “contra” é mantida na nota como possibilidade.
- source_word: כֵּס
  choice: trono
  rationale: Provavelmente é uma forma abreviada ou defectiva relacionada a כִּסֵּא, “trono”; “estandarte” é lexicalmente menos provável.
- source_word: יָהּ
  choice: Yah
  rationale: Conserva a forma breve do nome divino e a distingue de יהוה na oração seguinte.
- source_word: מִלְחָמָה לַיהוָה
  choice: Yahweh estará em guerra
  rationale: Expressa naturalmente em português a oração nominal segundo a qual há guerra pertencente a Yahweh, sem tornar a formulação mais ativa do que o hebraico.
- source_word: בַּעֲמָלֵק
  choice: contra Amaleque
  rationale: Em contexto bélico, ב marca o adversário; “contra” é a formulação portuguesa natural e inequívoca.
- source_word: מִדֹּר דֹּר
  choice: de geração em geração
  rationale: Equivalente idiomático transparente para a continuidade através de gerações sucessivas.
theological_decisions:
- issue: Distinção entre יָהּ e יהוה
  choice: Yah; Yahweh
  alternative: Senhor para ambos, ou Yahweh para ambos
  rationale: O texto emprega primeiro a forma breve Yah e depois o tetragrama; a tradução preserva essa diferença formal e o nome divino.
- issue: Sentido da cláusula elíptica יָד עַל כֵּס יָהּ
  choice: Uma mão está sobre o trono de Yah
  alternative: Uma mão está contra o trono de Yah; uma mão está sobre o estandarte de Yah
  rationale: A formulação principal segue os valores lexicais mais diretos e mantém a concisão incomum, enquanto a nota registra as leituras genuinamente disputadas sem escolher silenciosamente uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A estrutura incomum da primeira declaração foi preservada para não eliminar a ambiguidade do hebraico.
source_grounding:
  english_pob_role: consult_only
