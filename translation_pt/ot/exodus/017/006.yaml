  source_fidelity: 'A tradução representa bem a sequência hebraica: a autodeclaração divina, a ordem para atingir a rocha, a saída de água, o povo bebendo e a confirmação de que Moisés obedeceu perante os anciãos. «Sobre a rocha, em Horebe» preserva adequadamente a ligação sintática mais natural com o estar de Deus. «Água» é idiomático em português, embora מים tenha forma plural em hebraico.'
  naturalness: O português é claro, moderno e de registro digno. «Você deve bater na rocha» exprime mais claramente a força diretiva da instrução hebraica do que um futuro meramente preditivo («Você baterá»), sem recorrer a uma formulação arcaica. «Diante dos olhos dos anciãos» é compreensível e preserva o valor público e visual da expressão.
  terminology: «Eis que», «rocha», «Horebe», «anciãos de Israel» e «diante de você» são escolhas adequadas e consistentes. A nota sobre o particípio mantém de modo apropriado a alternativa presente, sem decidir além do que o hebraico permite.
