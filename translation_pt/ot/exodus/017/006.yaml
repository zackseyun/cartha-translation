base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: pt
  text: Eis que estarei[a] ali diante de você, sobre a rocha, em Horebe. Você deve bater na rocha, e dela sairá água, e o povo beberá. E Moisés assim fez diante dos olhos dos anciãos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que estou ali diante de você, sobre a rocha, em Horebe”. O particípio hebraico também pode ser traduzido no presente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva a força solene e demonstrativa da declaração divina em linguagem bíblica ainda compreensível no português atual.
- source_word: עֹמֵד
  choice: estarei
  rationale: O particípio hebraico descreve Deus de pé, mas, no fluxo da instrução, admite valor iminente ou futuro. Em português, “estarei” comunica naturalmente a ação que Moisés encontrará ao chegar ao local.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: Equivalente natural que conserva a posição de Deus à frente de Moisés sem acrescentar explicações ao texto.
- source_word: הַצּוּר
  choice: a rocha
  rationale: Equivalente comum de צוּר neste contexto e mantém a repetição lexical do hebraico.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: Em português, a preposição “em” é natural com o nome de uma região ou localidade e não determina mais precisamente a natureza geográfica de Horebe.
- source_word: וְהִכִּיתָ
  choice: Você baterá
  rationale: No contexto instrucional, a forma verbal tem força diretiva. “Bater na rocha” é corrente e claro em português, preservando a ação física sem artificialidade.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: dela sairá água
  rationale: Expressa diretamente a saída da água e identifica a rocha como sua origem, sem acrescentar a imagem específica de a água “jorrar” ou “fluir”.
- source_word: וְשָׁתָה הָעָם
  choice: e o povo beberá
  rationale: Mantém a sequência simples de comando, resultado e consumo presente no hebraico, sem transformar explicitamente a oração em finalidade.
- source_word: וַיַּעַשׂ כֵּן
  choice: E Moisés assim fez
  rationale: Fórmula portuguesa natural e digna para a declaração hebraica de que Moisés cumpriu a instrução.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Conserva a imagem concreta do hebraico e ressalta que os anciãos foram testemunhas visuais do ato.
theological_decisions:
- issue: Valor temporal do particípio עֹמֵד na autodeclaração divina
  choice: Eis que estarei ali diante de você
  alternative: Eis que estou ali diante de você
  rationale: O particípio pode ser entendido de modo presente, mas o contexto de instruções sobre uma ação iminente favorece, em português, o futuro. A alternativa legítima é registrada em nota para preservar a ambiguidade aspectual.
- issue: Relação sintática de “sobre a rocha, em Horebe”
  choice: 'A expressão modifica a posição de Deus: ele estará sobre a rocha'
  alternative: Deus estará diante de Moisés, junto da rocha em Horebe
  rationale: A sintaxe hebraica liga mais naturalmente “ali, sobre a rocha, em Horebe” ao ato divino de estar de pé. A tradução conserva essa imagem marcante sem explicá-la ou atenuá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Eis que” mantém a solenidade da fala divina; “diante de você” evita o lusitanismo marcado de “diante de ti”. A colocação “sobre a rocha, em Horebe” busca representar com transparência a estrutura hebraica.
