  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: pt
  text: Moisés construiu um altar e lhe deu o nome de “Yahweh é minha bandeira”.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O verbo בנה, nesta forma narrativa, indica diretamente o ato de construir; “construiu” é natural e concreto em português.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: É o equivalente português estabelecido para מִזְבֵּחַ, lugar destinado a sacrifício ou culto memorial.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: lhe deu o nome de
  rationale: A expressão hebraica significa literalmente “chamou seu nome”. A formulação escolhida comunica naturalmente em português que Moisés nomeou o altar, sem alterar o referente pronominal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: נִסִּי
  choice: é Minha Bandeira
  rationale: נֵס pode designar bandeira, estandarte ou sinal erguido. A cópula “é”, implícita na frase nominal hebraica, é acrescentada para formar um título natural em português; “bandeira” preserva a metáfora de reunião e vitória.
theological_decisions:
- issue: Tradução do nome divino יְהוָה no nome memorial do altar
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal no título dado ao altar, sem substituí-lo por um título.
- issue: Sentido da expressão nominal יְהוָה נִסִּי
  choice: Yahweh é Minha Bandeira
  alternative: Yahweh, minha bandeira; Yahweh é Meu Estandarte
  rationale: O hebraico não traz uma cópula expressa, mas admite naturalmente a leitura predicativa. A tradução mantém a metáfora sem explicar no corpo do versículo de que maneira Yahweh funciona como bandeira.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção “lhe deu o nome de” evita a rigidez de “chamou seu nome”, e “bandeira” é mais acessível ao leitor comum do que “estandarte”.
