  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: pt
  text: 'Moisés disse a Josué: “Escolha homens para nós e saia para lutar contra Amaleque.[a] Amanhã estarei de pé no alto da colina,[b] com o cajado de Deus em minha mão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saia e guerreie contra Amaleque”.'
    reason: Registra a alternativa lexical militar de הִלָּחֵם sem alterar o sentido básico do texto principal.
  - marker: b
    text: 'Hebraico: “sobre a cabeça da colina”, expressão que significa “no alto da colina”.'
    reason: Explica a imagem idiomática hebraica subjacente à tradução natural em português.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Moisés disse
  rationale: O perfeito consecutivo faz a narrativa avançar. Em português, a sequência já fica clara pelo contexto, sem necessidade de acrescentar mecanicamente “e” ou “então”.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Escolha homens para nós
  rationale: Preserva o sentido direto de בחר, “escolher”, o referente masculino de אֲנָשִׁים no contexto de combate e o valor benefactivo de לָנוּ, sem acrescentar que os homens seriam escolhidos necessariamente dentre os israelitas.
- source_word: וְצֵא הִלָּחֵם בַּעֲמָלֵק
  choice: e saia para lutar contra Amaleque
  rationale: “Saia” conserva o movimento expresso por יצא; a construção final “para lutar” transmite com naturalidade em português a sequência coordenada dos imperativos. “Contra” explicita o sentido adversativo da preposição no contexto militar.
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: Amanhã estarei
  rationale: Embora נִצָּב seja formalmente um particípio, מָחָר lhe dá referência futura. “Estarei” expressa de modo natural a posição que Moisés ocupará.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: no alto da colina
  rationale: רֹאשׁ significa literalmente “cabeça”, mas nesta expressão designa idiomaticamente o alto ou topo da colina.
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: com o cajado de Deus na mão
  rationale: A frase nominal final descreve a circunstância em que Moisés estará no alto da colina. “Cajado de Deus” preserva a construção hebraica, e “na mão” traduz diretamente בְּיָדִי; em português, o possuidor fica claro pelo sujeito.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים em מַטֵּה הָאֱלֹהִים
  choice: o cajado de Deus
  alternative: o cajado divino
  rationale: O contexto de Êxodo aponta para o Deus de Israel, e a construção definida hebraica é preservada sem diluir a referência pessoal nem acrescentar uma interpretação sobre a natureza do objeto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva “homens”, “Amaleque”, “colina” e “cajado de Deus” por precisão contextual e continuidade bíblica. A pontuação mantém juntas as instruções dadas a Josué e separa a ação futura de Moisés.
