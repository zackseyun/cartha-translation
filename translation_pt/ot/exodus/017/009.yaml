review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente as ordens a Josué, o adversário Amaleque, a referência temporal futura e o sintagma «cajado de Deus». Contudo, «Amanhã estarei no alto da colina» torna menos explícita a ideia de postura contida em נִצָּב («estarei de pé»/«ficarei de pé»). Além disso, «em minha mão» reproduz explicitamente o sufixo de primeira pessoa em בְּיָדִי.
  naturalness: O português é moderno, claro e apropriado ao registro narrativo bíblico. «Estarei de pé no alto da colina» é natural e mantém melhor a imagem do hebraico.
  terminology: «Josué», «Amaleque», «homens», «colina» e «cajado de Deus» são escolhas adequadas e consistentes. As notas preservam corretamente a alternativa militar e explicam o idiomatismo de «cabeça da colina».
  issues:
  - severity: medium
    issue: A postura expressa por נִצָּב não está explicitada.
    rationale: «Estarei» apenas indica presença/localização, enquanto o particípio נִצָּב, determinado por «amanhã», descreve Moisés em pé ou postado. «Estarei de pé» preserva essa informação sem forçar uma nuance adicional.
  - severity: low
    issue: A primeira pessoa em בְּיָדִי fica apenas inferida em «na mão».
    rationale: Embora o sujeito torne a referência compreensível, «em minha mão» traduz de modo direto e inequívoco o sufixo possessivo hebraico.
