base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: pt
  text: Josué fez como Moisés lhe havia dito e foi lutar contra Amaleque[a]. Moisés, Arão e Hur subiram ao topo da colina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Amaleque”; o nome pode referir-se aqui ao povo descendente de Amaleque, isto é, aos amalequitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר
  choice: fez como
  rationale: A construção indica que Josué cumpriu a instrução de Moisés; “fez como” preserva de modo natural a relação de conformidade.
- source_word: אָמַר לוֹ
  choice: lhe havia ordenado
  rationale: Embora אָמַר signifique literalmente “disse”, o contexto imediato é uma ordem dada por Moisés no versículo anterior. O mais-que-perfeito deixa clara a anterioridade da instrução.
- source_word: לְהִלָּחֵם
  choice: foi lutar
  rationale: O infinitivo expressa a ação que Josué deveria realizar. “Foi lutar” é claro e idiomático em português narrativo.
- source_word: בַּעֲמָלֵק
  choice: contra Amaleque
  rationale: Com o verbo לָחַם, a preposição indica confronto hostil. Mantém-se o nome próprio do hebraico, sem substituí-lo no texto por “amalequitas”.
- source_word: עָלוּ
  choice: subiram
  rationale: Expressa diretamente o movimento para um lugar elevado e soa natural em português.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: topo da colina
  rationale: O sentido literal de “cabeça da colina” é idiomaticamente o seu topo.
- source_word: יְהוֹשֻׁעַ / מֹשֶׁה / אַהֲרֹן / חוּר
  choice: Josué / Moisés / Arão / Hur
  rationale: Empregam-se as formas portuguesas bíblicas consagradas dos nomes pessoais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. A pontuação em duas frases evita uma coordenação excessivamente longa. O marcador da nota foi colocado junto a “Amaleque”, termo ao qual a explicação lexical se refere.
