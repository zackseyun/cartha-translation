  source_fidelity: 'O texto transmite com precisão os elementos do hebraico: o conjunto da comunidade de Israel parte do deserto de Sim, desloca-se por etapas conforme a ordem de Yahweh, acampa em Refidim e não encontra água para o povo beber. “Mas” para o waw antes da falta de água é uma explicitação adversativa moderada e contextual, sem alteração de sentido.'
