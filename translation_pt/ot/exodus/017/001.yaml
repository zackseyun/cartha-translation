id: EXO.17.1
reference: Exodus 17:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: pt
  text: Toda a comunidade dos filhos de Israel partiu do deserto de Sim, viajando por etapas, conforme a ordem de Yahweh[a], e acampou em Refidim. Mas não havia água para o povo beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “segundo a boca de Yahweh”, expressão hebraica que significa “conforme a ordem ou direção de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiu
  rationale: No contexto de deslocamentos pelo deserto, נסע indica levantar acampamento e seguir viagem. “Partiu” é natural e preserva o movimento narrativo.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a comunidade dos filhos de Israel
  rationale: עֵדָה designa a comunidade reunida, e בְּנֵי יִשְׂרָאֵל é mantido na forma tradicional e próxima do hebraico, sem excluir do contexto o conjunto do povo.
- source_word: מִמִּדְבַּר סִין
  choice: do deserto de Sim
  rationale: מִדְבָּר pode significar deserto ou região erma. “Sim” é a forma portuguesa tradicional do topônimo hebraico סִין.
- source_word: לְמַסְעֵיהֶם
  choice: viajando por etapas
  rationale: מַסָּע designa uma etapa ou jornada associada ao levantamento do acampamento. A expressão comunica uma sucessão de deslocamentos em português corrente.
- source_word: עַל פִּי יְהוָה
  choice: conforme a ordem de Yahweh
  rationale: A expressão idiomática עַל־פִּי significa literalmente “segundo a boca de”, mas aqui indica conformidade com uma ordem ou direção autorizada.
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: e acampou em Refidim
  rationale: חנה significa montar ou estabelecer acampamento. O singular “acampou” concorda naturalmente com o sujeito coletivo “comunidade” em português.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: Mas não havia água para o povo beber
  rationale: O waw introduz aqui o contraste entre a chegada ao acampamento e a falta de água. A construção com infinitivo é vertida de modo claro e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título, sem afirmar certeza absoluta sobre a vocalização antiga.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantiveram-se os topônimos tradicionais “Sim” e “Refidim”, e o nome divino foi transliterado como “Yahweh”.
