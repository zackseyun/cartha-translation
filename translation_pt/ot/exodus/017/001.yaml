  terminology: “Comunidade”, “filhos de Israel”, “deserto de Sim”, “Refidim” e “Yahweh” são escolhas consistentes e adequadas. A nota explica de forma correta o idiomatismo hebraico עַל־פִּי. O topônimo “Sim” é uma forma bíblica portuguesa estabelecida e não deve ser entendido como tradução do vocábulo comum português.
