base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/008.yaml
  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: pt
  text: Então Amaleque veio e lutou contra Israel em Refidim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “lutou com Israel”; neste contexto, “com” tem sentido adversativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... veio
  rationale: O waw consecutivo faz a narrativa avançar. “Então” comunica com naturalidade a sequência dos acontecimentos, enquanto “veio” preserva o sentido simples de בוא.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Forma tradicional e amplamente reconhecida em português. No contexto, o nome do ancestral representa coletivamente o povo amalequita.
- source_word: וַיִּלָּחֶם
  choice: lutou
  rationale: O nifal de לחם significa aqui lutar ou travar combate. “Lutou” é direto, atual e adequado ao estilo narrativo.
- source_word: עִם
  choice: contra
  rationale: Embora a preposição signifique literalmente “com”, em contexto de combate ela indica a parte adversária. Em português, “lutou contra Israel” evita a possível leitura de que Amaleque lutou ao lado de Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma convencional do nome do povo da aliança.
- source_word: בִּרְפִידִם
  choice: em Refidim
  rationale: A preposição בְּ marca localização. “Em Refidim” é a expressão natural em português para indicar o local do combate.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A ordem “Então Amaleque veio” mantém o avanço da narrativa sem soar artificial; “contra” explicita em português o sentido bélico contextual, enquanto a nota registra a forma mais literal.
