  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: pt
  text: 'Então Moisés clamou a Yahweh, dizendo: “O que farei com este povo? Mais um pouco, e me apedrejarão!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Ainda um pouco, e me apedrejarão”, indicando que a ameaça é iminente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: clamou
  rationale: O verbo צעק expressa um grito urgente de aflição ou pedido de socorro; “clamou” preserva essa intensidade em português bíblico corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz de modo natural o infinitivo hebraico que introduz o discurso direto.
- source_word: מָה אֶעֱשֶׂה
  choice: O que farei
  rationale: Preserva a pergunta deliberativa de Moisés sobre como agir diante da situação.
- source_word: לָעָם הַזֶּה
  choice: com este povo
  rationale: Neste contexto, a preposição ל com עשה indica a relação com o objeto da ação; “fazer com” é a formulação idiomática em português.
- source_word: עֹוד מְעַט
  choice: Só falta um pouco
  rationale: Comunica naturalmente a ideia de que resta muito pouco para a ameaça se concretizar, preservando a iminência da expressão hebraica.
- source_word: וּסְקָלֻנִי
  choice: para me apedrejarem
  rationale: O verbo סקל significa atacar ou matar por apedrejamento; a construção ligada a עֹוד מְעַט comunica um resultado iminente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Clamou” mantém a urgência sem soar coloquial; “apedrejarem” transmite de forma direta a ameaça de violência. O marcador [a] aparece após a declaração a que a nota se refere.
