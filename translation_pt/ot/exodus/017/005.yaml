  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Passe à frente do povo e leve com você alguns dos anciãos de Israel.[a] Pegue em sua mão o seu cajado, com o qual você feriu o Nilo,[b] e vá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dos anciãos de Israel”; a expressão provavelmente indica que Moisés deveria levar consigo alguns anciãos escolhidos.'
    reason: lexical_alternative
  - marker: b
    text: Ou “o rio”; em Êxodo, este termo geralmente se refere especificamente ao Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Passe adiante do povo
  rationale: Mantém tanto a ideia básica de passar ou avançar quanto a relação espacial expressa por לִפְנֵי, sem tornar a frase excessivamente explicativa.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: e leve com você alguns dos anciãos de Israel
  rationale: 'A preposição מִן tem sentido partitivo neste contexto: Moisés deve escolher membros do grupo dos anciãos, não necessariamente levar todos.'
- source_word: וּמַטְּךָ
  choice: o seu cajado
  rationale: “Cajado” é uma tradução corrente de מַטֶּה e se ajusta ao instrumento carregado e usado por Moisés.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: com o qual você feriu o Nilo
  rationale: בּוֹ é instrumental, e הַיְאֹר no contexto egípcio de Êxodo designa especificamente o Nilo.
- source_word: קַח בְּיָדְךָ
  choice: Pegue na mão
  rationale: Conserva a repetição do verbo קח e a sequência de ordens do hebraico em português natural.
- source_word: וְהָלָכְתָּ
  choice: e vá
  rationale: A forma verbal dá continuidade às ordens anteriores e funciona aqui como uma instrução direta e concisa.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: Expressa de modo natural o avanço da narrativa marcado pelo waw consecutivo.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” preserva o nome da aliança no texto e evita substituí-lo pelo título “SENHOR”, sem acrescentar uma interpretação doutrinária ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento amplamente compreensíveis no Brasil e em outras comunidades lusófonas. Os imperativos com “você” evitam arcaísmos, e a repetição de “pegue” preserva a sequência enfática do hebraico. O marcador [a] foi colocado junto à expressão que ele esclarece.
