base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: pt
  text: 'Ali o povo teve sede de água e reclamou contra Moisés, dizendo: “Por que foi que você nos fez subir do Egito para matar de sede a mim, meus filhos e meu gado?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... לַמַּיִם
  choice: teve sede de água
  rationale: Expressa de modo natural o sentido literal de sentir sede por falta de água, mantendo a referência explícita à água.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: reclamou contra Moisés
  rationale: O verbo לון, neste contexto, descreve a queixa hostil ou murmuração dirigida contra Moisés; “reclamou contra” é claro e atual.
- source_word: לָמָּה זֶּה
  choice: Por que foi que
  rationale: Reproduz em português a ênfase da expressão interrogativa hebraica sem recorrer a uma construção artificial.
- source_word: הֶעֱלִיתָנוּ מִמִּצְרַיִם
  choice: você nos fez subir do Egito
  rationale: Preserva o valor causativo do verbo e a imagem espacial de subir a partir do Egito, embora “tirou do Egito” fosse mais idiomático.
- source_word: מִקְנַי
  choice: meu gado
  rationale: מִקְנֶה designa os animais de criação ou rebanhos possuídos; “gado” é uma forma ampla e compreensível em português.
- source_word: בַּצָּמָא
  choice: de sede
  rationale: Na expressão com “matar”, o português idiomático “matar de sede” comunica com precisão a causa ou meio indicado pelo hebraico.
theological_decisions:
- issue: Valor do infinitivo לְהָמִית como propósito alegado
  choice: Para matar de sede...
  alternative: '...e assim matar de sede...'
  rationale: Mantém a acusação do povo na forma de propósito, sem suavizá-la como mera consequência.
- issue: Mudança do coletivo “o povo” para a primeira pessoa singular
  choice: a mim, meus filhos e meu gado
  alternative: a nós, nossos filhos e nosso gado
  rationale: Preserva a mudança marcante do hebraico para o singular אֹתִי, בָּנַי e מִקְנַי, provavelmente dando voz representativa a cada integrante do povo, sem harmonizá-la silenciosamente com o sujeito coletivo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação “nos fez subir do Egito” é deliberadamente mais próxima da imagem hebraica; a pergunta separada “Para matar...” conserva a força indignada da acusação.
