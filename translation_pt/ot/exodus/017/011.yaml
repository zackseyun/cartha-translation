translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O imperfeito (“acontecia”, “levantava”, “prevalecia”, “abaixava”) reforça naturalmente a repetição no passado. Conservou-se “mão”, em vez de “braço”, por fidelidade lexical; o possessivo foi omitido por ser inequívoco em português.
