  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: pt
  text: E, sempre que Moisés levantava a mão[a], Israel prevalecia; e, sempre que abaixava a mão[b], Amaleque prevalecia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando Moisés levantava a mão [...] quando abaixava a mão”. A construção hebraica pode ser traduzida de modo mais formal com “quando”, mas o contexto indica uma ação repetida durante a batalha; por isso, “sempre que”.'
    reason: lexical_alternative
  - marker: b
    text: “Abaixava” traduz um verbo que também pode significar “fazia descansar” ou “deixava repousar”. O contraste com “levantava a mão” favorece aqui o sentido de abaixá-la.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecia que
  rationale: A construção narrativa com היה introduz aqui uma circunstância recorrente. A expressão portuguesa preserva esse valor e conduz naturalmente às orações com “sempre que”.
- source_word: כַאֲשֶׁר
  choice: sempre que
  rationale: No contexto da batalha, a partícula indica ocasiões repetidas, não apenas um único momento; “sempre que” comunica claramente esse valor iterativo.
- source_word: יָרִים
  choice: levantava
  rationale: O hifil de רום significa levantar ou erguer. “Levantava” é natural e não acrescenta a ideia de manutenção prolongada da posição.
- source_word: יָדוֹ
  choice: a mão
  rationale: O substantivo hebraico significa literalmente “mão”. O possessivo fica claro pelo sujeito Moisés e pode ser omitido com naturalidade em português.
- source_word: וְגָבַר
  choice: prevalecia
  rationale: גבר expressa ser forte ou levar vantagem. “Prevalecia” se ajusta ao contexto militar sem sugerir uma derrota definitiva naquele instante.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo.
- source_word: וְכַאֲשֶׁר
  choice: e, sempre que
  rationale: Mantém tanto a coordenação hebraica quanto o caráter repetido das situações contrastantes.
- source_word: יָנִיחַ
  choice: abaixava
  rationale: O hifil de נוח pode significar fazer repousar, deixar descansar ou baixar. Em contraste direto com “levantava”, “abaixava” é a formulação portuguesa mais clara e natural.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Forma tradicional e reconhecida em português para o nome do povo.
