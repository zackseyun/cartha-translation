base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: pt
  text: Mas as mãos de Moisés estavam pesadas, por isso pegaram uma pedra, colocaram-na debaixo dele, e ele se sentou sobre ela. Arão e Hur sustentaram as mãos dele, um de um lado e o outro do outro lado; assim, suas mãos permaneceram firmes[a] até o pôr do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estáveis” ou “constantes”. O substantivo hebraico também pode transmitir a ideia de “fidelidade”; aqui, descreve a firmeza física das mãos de Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: as mãos de Moisés estavam pesadas
  rationale: Preserva a expressão concreta do hebraico; no contexto, o peso implica cansaço sem precisar explicitá-lo.
- source_word: וַיִּקְחוּ אֶבֶן
  choice: pegaram uma pedra
  rationale: Mantém o sujeito plural não especificado do hebraico e traduz אֶבֶן pelo termo comum e preciso 'pedra'.
- source_word: וַיָּשִׂימוּ תַחְתָּיו וַיֵּשֶׁב עָלֶיהָ
  choice: colocaram-na debaixo dele, e ele se sentou sobre ela
  rationale: Reproduz com clareza a sequência narrativa e explicita pelos pronomes que Moisés se sentou sobre a pedra.
- source_word: תָּמְכוּ בְיָדָיו
  choice: sustentaram as mãos dele
  rationale: O verbo expressa apoio ou sustentação física; 'mãos' conserva a imagem repetida do hebraico.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: um de um lado e o outro do outro
  rationale: 'Expressa naturalmente a distribuição: Arão de um lado e Hur do outro.'
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: suas mãos permaneceram firmes
  rationale: Neste contexto de cansaço e apoio físico, אֱמוּנָה indica firmeza ou estabilidade. 'Permaneceram' comunica o resultado duradouro.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: até o pôr do sol
  rationale: Equivalente português natural e digno para a chegada ou entrada do sol, indicando o limite temporal.
theological_decisions:
- issue: Sentido de אֱמוּנָה aplicado às mãos de Moisés
  choice: firmeza física
  alternative: fidelidade ou constância
  rationale: O contexto imediato trata do cansaço corporal de Moisés e do apoio físico dado por Arão e Hur. 'Firmes' preserva a amplitude semântica de estabilidade e constância sem introduzir uma abstração moral alheia à cena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem narrativa foi mantida, e o hebraísmo 'mãos pesadas' foi preservado por ser claro no contexto.
