  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: pt
  text: 'Então o povo discutiu com Moisés e disse: “Dê-nos água para beber.” Moisés lhes disse: “Por que vocês discutem comigo? Por que põem Yahweh à prova?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que testam Yahweh?”'
    reason: Alternativa lexical mais literal e concisa para תְּנַסּוּן.
lexical_decisions:
- source_word: וַיָּרֶב הָעָם עִם מֹשֶׁה
  choice: o povo discutiu com Moisés
  rationale: ריב indica disputa ou contenda. “Discutiu com” é natural em português, conserva o caráter adversarial e mantém o valor formal de עִם sem precisar explicitar “contra”.
- source_word: תְּנוּ לָנוּ מַיִם וְנִשְׁתֶּה
  choice: Dê-nos água para beber
  rationale: A formulação idiomática em português expressa com clareza a ordem e a finalidade indicada pela forma volitiva וְנִשְׁתֶּה.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Por que vocês discutem comigo?
  rationale: Repete a raiz ריב da primeira oração, preservando a ligação lexical e o tom de repreensão.
- source_word: מַה תְּנַסּוּן
  choice: Por que põem ... à prova?
  rationale: נסה no piel significa testar ou pôr à prova. A locução portuguesa comunica melhor o sentido de desafiar ou exigir comprovação, sem suavizar a tensão teológica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” conserva o nome da aliança e evita convertê-lo silenciosamente em um título.
- issue: Sentido de testar Deus
  choice: põem Yahweh à prova
  alternative: testam Yahweh
  rationale: A locução preserva a acusação teológica de exigir que Deus demonstre sua presença ou fidelidade, sem explicar além do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo indicado pelas formas verbais hebraicas. A ordem singular “Dê-nos” dirige-se a Moisés, como no contexto gramatical.
