lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: derrotou
  rationale: O verbo חלש pode expressar enfraquecer ou subjugar. Neste relato de batalha, “derrotou” comunica naturalmente o êxito militar de Josué sem implicar o extermínio completo do inimigo.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Forma tradicional portuguesa do nome próprio, que aqui também representa a força amalequita ligada a esse nome ancestral.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Preserva o sentido comum de עַם. No contexto militar, refere-se provavelmente aos combatentes sob Amaleque, mas “seu povo” mantém a formulação hebraica sem restringi-la a “exército” ou “tropas”.
- source_word: לְפִי חָרֶב
  choice: à espada
  rationale: Expressão portuguesa natural para indicar derrota em combate armado, correspondente ao idioma hebraico que, literalmente, diz “pela boca da espada”.
