  text: Josué derrotou Amaleque e seu povo à espada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “ao fio da espada”. O hebraico diz literalmente “pela boca da espada”, expressão idiomática que indica derrota em combate armado.
