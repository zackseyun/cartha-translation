  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: pt
  text: 'E ele deu àquele lugar o nome de Massá e Meribá[a], por causa da contenda dos filhos de Israel[b] e porque puseram Yahweh à prova, dizendo: “Yahweh está no nosso meio ou não?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Massá está ligado ao verbo hebraico que significa “pôr à prova”; Meribá está ligado ao termo hebraico para “contenda” ou “disputa”.
    reason: Explica o jogo de palavras que fundamenta os nomes do lugar.
  - marker: b
    text: Isto é, os israelitas.
    reason: Esclarece o sentido coletivo da expressão hebraica literal “filhos de Israel”.
  - marker: c
    text: 'Ou: “Yahweh está entre nós ou não?”'
    reason: Registra uma tradução igualmente possível de בְּקִרְבֵּנוּ.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: deu àquele lugar o nome de
  rationale: Expressa naturalmente em português a fórmula hebraica de nomeação, sem perder o ato explícito de dar nome ao lugar.
- source_word: מַסָּה וּמְרִיבָה
  choice: Massá e Meribá
  rationale: Mantém os topônimos por transliteração adaptada à pronúncia e à acentuação gráfica do português; o jogo de palavras hebraico é explicado em nota.
- source_word: עַל רִיב
  choice: por causa da contenda
  rationale: עַל introduz aqui o motivo da nomeação, e רִיב designa disputa, conflito ou contenda. “Contenda” conserva a ligação semântica com Meribá e mantém registro digno.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica e sua forma corporativa tradicional; uma nota esclarece que ela designa os israelitas.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: e porque puseram Yahweh à prova
  rationale: O piel de נסה significa testar ou pôr à prova. Esta formulação é idiomática em português e deixa claro que Yahweh é o objeto da ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Yahweh está no nosso meio ou não?
  rationale: Preserva a pergunta polar e traduz בְּקִרְבֵּנוּ de modo claro e corrente, mantendo em aberto a tensão sobre a presença divina entre o povo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio e evita trocar silenciosamente o nome por um título.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A formulação principal mantém a expressão hebraica, que funciona coletivamente para o povo de Israel; a alternativa idiomática é registrada em nota.
- issue: Natureza da pergunta final
  choice: Yahweh está no nosso meio ou não?
  alternative: Será que Yahweh está entre nós ou não?
  rationale: A tradução conserva a força direta e desafiadora da pergunta, sem suavizar a dúvida do povo nem resolver a tensão narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi naturalizada sem apagar a fórmula de nomeação, os topônimos, a designação coletiva nem a pergunta incisiva do povo.
