language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Escreva isto como memorial no livro[a] e faça Josué ouvir isto[b], pois certamente apagarei[c] de debaixo dos céus a memória de Amaleque.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “num livro” ou “no rolo”; o hebraico diz literalmente “no livro”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ponha nos ouvidos de Josué”, isto é, faça Josué ouvir isto ou recite-o para ele.
    reason: lexical_alternative
  - marker: c
    text: A construção hebraica traduzida como “certamente apagarei” é enfática.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּתֹב
  choice: Escreva
  rationale: O imperativo de כתב significa diretamente escrever e mantém a forma simples da ordem.
- source_word: זֹאת זִכָּרוֹן
  choice: isto como memorial
  rationale: Expressa a finalidade comemorativa do registro e preserva o contraste com a futura eliminação da memória de Amaleque.
- source_word: בַּסֵּפֶר
  choice: no livro
  rationale: Reproduz o artigo definido hebraico; 'rolo' seria historicamente possível, mas mais interpretativo.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: e faça Josué ouvi-lo
  rationale: Comunica em português natural o idioma hebraico literalmente expresso como 'põe nos ouvidos de Josué', sem perder seu sentido causativo.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a explicação ou fundamento da ordem anterior.
- source_word: מָחֹה אֶמְחֶה
  choice: certamente apagarei
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica e assegura a ação; 'certamente' transmite essa ênfase sem reproduzir uma construção artificial.
- source_word: זֵכֶר עֲמָלֵק
  choice: a memória de Amaleque
  rationale: '''Memória'' é natural em português e mantém a correspondência conceitual com o memorial que Moisés deve escrever.'
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de debaixo dos céus
  rationale: Preserva a imagem e o alcance universal da expressão hebraica, incluindo o plural de 'céus'.
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz explicitamente יהוה. A transliteração 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Alcance da eliminação de Amaleque
  choice: a memória de Amaleque
  alternative: o nome de Amaleque
  rationale: זֵכֶר significa memória ou lembrança. A tradução não especifica além do hebraico se a declaração se refere à memória histórica, à identidade coletiva ou à existência do povo, preservando a tensão do texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas naturais ao público brasileiro. A ordem hebraica foi levemente ajustada para fluidez, e o idioma relativo aos ouvidos de Josué foi expresso pelo seu sentido corrente, com a imagem literal preservada em nota.
