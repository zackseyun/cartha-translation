  source_fidelity: A tradução capta bem o imperativo idiomático מִלְאוּ יֶדְכֶם como chamado à consagração e preserva adequadamente a elipse de כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו mediante “cada um se voltou contra...”. A finalidade de וְלָתֵת...בְּרָכָה também é mantida.
  naturalness: O texto é fluente, solene e claro em português moderno. Contudo, em “para que hoje ele conceda”, o pronome masculino singular tende a buscar um antecedente gramatical imediato, especialmente “o próprio irmão”, em vez de preservar a indeterminação do agente presente no hebraico.
  terminology: “Consagrem-se” é uma boa solução não institucionalizante para a expressão hebraica de investidura/consagração. “SENHOR” é consistente com a convenção para o tetragrama. “Bênção” é apropriado.
