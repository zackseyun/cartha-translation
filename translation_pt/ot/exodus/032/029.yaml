base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: pt
  text: 'E Moisés disse: “Consagrem-se hoje ao SENHOR, pois cada um se voltou contra o próprio filho e contra o próprio irmão, para que hoje lhes seja concedida uma bênção.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: Consagrem-se
  rationale: A expressão idiomática literal, “encham a mão”, é usada para investidura ou consagração. “Consagrem-se” comunica seu sentido neste contexto em português natural, sem limitar o ato à ordenação eclesiástica moderna.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Mantém a convenção editorial reverente para o nome divino YHWH, com versalete representado em maiúsculas.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: pois cada um se voltou contra o próprio filho e contra o próprio irmão
  rationale: A frase hebraica é elíptica, omitindo um verbo que o contexto anterior fornece. “Se voltou contra” explicita apenas o mínimo necessário e preserva a dureza dos vínculos familiares rompidos.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: para que hoje ele conceda uma bênção a vocês
  rationale: Reproduz a construção de finalidade e deixa o sujeito implícito de “conceda” sem identificação adicional, preservando a ambiguidade formal do hebraico.
theological_decisions:
- issue: Natureza da consagração dos levitas
  choice: Consagrem-se
  alternative: Ordenem-se
  rationale: O idioma hebraico pode designar investidura sacerdotal, mas aqui a consagração decorre da lealdade demonstrada no episódio. “Consagrem-se” evita impor a noção moderna e institucional de ordenação.
- issue: Sujeito de “conceda uma bênção”
  choice: ele conceda
  alternative: o SENHOR conceda
  rationale: O hebraico emprega um infinitivo sem sujeito expresso. O pronome mantém essa abertura, embora o SENHOR seja o referente mais provável no contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A elipse hebraica foi discretamente completada a partir do contexto imediato, e a ambiguidade do agente da bênção foi preservada.
