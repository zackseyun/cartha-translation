    rationale: O infinitivo hebraico לתת (“dar/conceder”) não explicita seu sujeito. Embora o SENHOR seja o referente contextual provável, “ele” em português é sintaticamente propenso a ser entendido como “o próprio irmão”. Uma construção impessoal evita essa falsa resolução sem atribuir explicitamente a ação ao SENHOR.
