source:
  edition: WLC
  text: וְ/עַתָּה֙ הַנִּ֣יחָ/ה לִּ֔/י וְ/יִֽחַר אַפִּ֥/י בָ/הֶ֖ם וַ/אֲכַלֵּ֑/ם וְ/אֶֽעֱשֶׂ֥ה אוֹתְ/ךָ֖ לְ/ג֥וֹי גָּדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: pt
  text: Agora, deixe-me em paz[a], para que a minha ira se acenda contra eles e eu os consuma[b]; e farei de você uma grande nação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixe-me só”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e eu os destrua”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: O marcador discursivo introduz a ordem imediata e faz avançar a fala; “Agora” é direto e natural em português.
- source_word: הַנִּיחָה לִּי
  choice: deixe-me em paz
  rationale: Neste uso idiomático, o imperativo significa deixar alguém em paz ou parar de contê-lo. A formulação preserva a força da ordem em português atual.
- source_word: וְיִחַר אַפִּי
  choice: para que a minha ira se acenda
  rationale: A expressão hebraica retrata a ira como algo que arde ou se inflama. “A ira se acenda” conserva a metáfora de modo idiomático, e “para que” comunica a relação de propósito ou resultado após o imperativo.
- source_word: בָהֶם
  choice: contra eles
  rationale: Com a expressão de ira, “contra eles” comunica naturalmente a direção hostil indicada pela preposição hebraica.
- source_word: וַאֲכַלֵּם
  choice: e eu os consuma
  rationale: O Piel de כלה pode significar acabar com, consumir ou destruir. “Consuma” preserva a textura lexical e a severidade do juízo sem restringir o termo à alternativa mais genérica “destrua”.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: e farei de você
  rationale: A construção hebraica expressa fazer de alguém aquilo que é indicado em seguida. Esta é uma formulação natural e clara em português.
- source_word: לְגוֹי גָּדוֹל
  choice: uma grande nação
  rationale: “Nação” traduz diretamente גוי, e “grande” preserva a formulação e sua ressonância com as promessas patriarcais sem acrescentar explicação.
theological_decisions:
- issue: Linguagem antropopática sobre a ira divina
  choice: Manter a metáfora de a ira de Deus se acender.
  alternative: Abstrair como “para que eu fique irado contra eles”.
  rationale: O hebraico emprega uma imagem vívida de ira ardente. Preservá-la mantém a força narrativa e a tensão teológica entre santidade e juízo.
- issue: Força do imperativo em relação à intercessão de Moisés
  choice: Traduzir como uma ordem real, sem explicar no texto principal sua possível função retórica.
  alternative: Explicitar a ordem como um convite implícito para Moisés interceder.
  rationale: O versículo apresenta diretamente uma ordem, um juízo anunciado e uma promessa. Entender a ordem como convite à intercessão é uma inferência interpretativa que não deve ser inserida na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A escolha “você” evita a ambiguidade regional de “tu” com flexão verbal variável; “ira” e “se acenda” preservam o tom solene e a imagem hebraica sem arcaísmo excessivo.
