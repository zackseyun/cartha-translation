source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: pt
  text: 'No dia seguinte, Moisés disse ao povo: “Vocês cometeram um grande pecado.[a] Agora subirei até Yahweh; talvez eu possa fazer expiação pelo pecado de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “Vocês pecaram um grande pecado”, construção que intensifica a gravidade da transgressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: No dia seguinte
  rationale: O hebraico introduz o acontecimento seguinte e situa-o no dia posterior. Em português, a expressão temporal basta para manter a sequência narrativa sem uma fórmula artificial.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: Moisés disse ao povo
  rationale: אמר com אֶל é a construção comum para dirigir palavras a alguém; esta formulação é direta e natural.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: Vocês cometeram um grande pecado
  rationale: O pronome plural é expresso por “vocês”, de ampla legibilidade brasileira. “Cometeram um grande pecado” comunica naturalmente a construção cognata e conserva sua gravidade, explicada na nota.
- source_word: וְעַתָּה אֶעֱלֶה
  choice: Agora subirei
  rationale: Marca a transição para a ação pretendida por Moisés. “Subirei” preserva o movimento em direção ao monte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אוּלַי
  choice: talvez
  rationale: Preserva a incerteza esperançosa de Moisés quanto ao resultado de sua intercessão.
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: eu possa fazer expiação pelo pecado de vocês
  rationale: O piel de כפר neste contexto intercessório admite “fazer expiação”. O subjuntivo depois de “talvez” expressa possibilidade, sem garantir o resultado; בְּעַד é traduzido naturalmente por “por”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” mantém o nome pessoal e não o substitui por um título.
- issue: Alcance da expectativa de Moisés quanto à expiação
  choice: talvez eu possa fazer expiação
  alternative: talvez eu obtenha expiação; talvez eu faça expiação
  rationale: A combinação de אוּלַי com a forma verbal apresenta uma tentativa esperançosa, mas incerta. A tradução não afirma nem nega antecipadamente a eficácia da intercessão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e mantém o termo teológico corrente “expiação”. A abertura hebraica וַיְהִי é representada pela progressão narrativa natural, sem o arcaísmo “e aconteceu que”.
