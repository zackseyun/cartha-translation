base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: pt
  text: Quando ele se aproximou do acampamento e viu o bezerro e as danças, a ira de Moisés se acendeu. Então ele lançou das mãos as tábuas e as despedaçou ao pé do monte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa hebraica introduz a sequência temporal. Em português atual, “Quando” comunica essa relação com naturalidade, sem reproduzir de modo rígido o elemento formulaico “e aconteceu que”.
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: ele se aproximou do acampamento
  rationale: קָרַב expressa aproximação espacial; “se aproximou do acampamento” é claro, natural e fiel.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: e viu o bezerro
  rationale: רָאָה é o verbo comum “ver”, e o artigo definido identifica o bezerro já conhecido no contexto.
- source_word: וּמְחֹלֹת
  choice: e as danças
  rationale: O substantivo hebraico está no plural e designa danças. A tradução formal “as danças” é idiomática em português e evita a interpretação adicional de “folia” ou “orgia”.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: a ira de Moisés se acendeu
  rationale: Preserva a imagem vívida do idioma hebraico de ira ardente, com formulação digna e compreensível em português.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: ele lançou das mãos
  rationale: שָׁלַךְ significa lançar ou atirar. Embora o hebraico use o singular “de sua mão”, o plural em português harmoniza naturalmente com as duas tábuas, sem alterar o sentido da ação.
- source_word: הַלֻּחֹת
  choice: as tábuas
  rationale: “Tábuas” é o termo bíblico português claro e estabelecido para לוּחֹת; o contexto já identifica o referente, não sendo necessário acrescentar “de pedra” neste versículo.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: e as despedaçou
  rationale: שָׁבַר indica quebrar; “despedaçou” transmite a força da ação sem recorrer a linguagem coloquial.
- source_word: תַּחַת הָהָר
  choice: ao pé do monte
  rationale: Neste contexto topográfico, תַּחַת é expresso naturalmente como “ao pé do monte”, em vez do espacialmente rígido “debaixo do monte”.
theological_decisions: []
