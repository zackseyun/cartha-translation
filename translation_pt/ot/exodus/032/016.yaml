  text: וְ/הַ֨/לֻּחֹ֔ת מַעֲשֵׂ֥ה אֱלֹהִ֖ים הֵ֑מָּה וְ/הַ/מִּכְתָּ֗ב מִכְתַּ֤ב אֱלֹהִים֙ ה֔וּא חָר֖וּת עַל הַ/לֻּחֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: pt
  text: As tábuas eram obra de Deus[a], e a escrita era a escrita de Deus, gravada nas tábuas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trabalho de Deus... inscrição de Deus”. O hebraico repete as palavras correspondentes a “obra” e “escrita” para dar ênfase.'
    reason: Alternativas lexicais e explicação da repetição enfática no hebraico.
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: as tábuas
  rationale: O substantivo designa tábuas; o contexto já esclarece que são de pedra, por isso não se acrescenta aqui uma informação que não está explícita neste versículo.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: obra de Deus
  rationale: Preserva a construção nominal hebraica e atribui diretamente a Deus a confecção das tábuas.
- source_word: הֵמָּה
  choice: eram
  rationale: A cópula em português expressa naturalmente a identificação enfática, sem exigir a repetição do pronome independente hebraico.
- source_word: הַמִּכְתָּב ... מִכְתַּב אֱלֹהִים
  choice: a escrita era a escrita de Deus
  rationale: Mantém a repetição deliberada do substantivo no hebraico e sua ênfase retórica, ainda que a formulação seja mais solene que a fala cotidiana.
- source_word: חָרוּת
  choice: gravada
  rationale: Indica escrita talhada ou incisa numa superfície; “gravada” é preciso e natural para tábuas de pedra.
- source_word: עַל הַלֻּחֹת
  choice: nas tábuas
  rationale: Expressa de modo idiomático em português a localização da escrita sobre a superfície das tábuas.
- source_word: וְ
  choice: e
  rationale: Liga as duas afirmações coordenadas do versículo. Não se acrescenta um marcador temporal como “ora”, pois o hebraico não contém uma palavra temporal explícita.
theological_decisions:
- issue: Agência na confecção das tábuas e da escrita
  choice: Tanto as tábuas quanto a escrita são apresentadas como obra diretamente atribuída a Deus.
  alternative: 'Traduzir de modo verbal: “as tábuas tinham sido feitas por Deus, e o texto tinha sido escrito por Deus”.'
  rationale: As expressões nominais do hebraico são preservadas para manter a atribuição enfática a Deus sem explicitar além do texto o modo exato dessa agência.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição “a escrita era a escrita de Deus” é mantida intencionalmente para refletir a ênfase do original. O marcador [a] aparece no texto principal.
