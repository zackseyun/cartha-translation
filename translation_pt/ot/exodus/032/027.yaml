  verdict: revise
  source_fidelity: A tradução preserva bem a fórmula divina, o nome Yahweh, os imperativos plurais e a sequência distributiva da ordem. Contudo, “à cintura” desloca a localização explícita “sobre a sua coxa”, e “tornem a passar” não exprime com precisão o segundo imperativo, “voltem/retornem”.
  naturalness: O português é claro e de registro apropriado. “Prenda a sua espada à coxa” comunica de modo natural o gesto de armar-se sem omitir a referência corporal do hebraico. “Percorram ... e retornem” é idiomático e mantém os dois movimentos ordenados.
  terminology: “Yahweh” e “o Deus de Israel” estão corretos. “Parente próximo” é uma leitura contextual plausível para קְרֹבוֹ, desde que a nota preserve as alternativas relacionais e espaciais. O marcador da nota deve ficar junto de “parente próximo”, não depois da citação inteira.
  issues:
  - severity: medium
    issue: “à cintura” substitui a referência à coxa.
    rationale: O hebraico diz literalmente que cada homem deve colocar sua espada “sobre a sua coxa” (עַל־יְרֵכוֹ). Embora “à cintura” seja idiomático, ela altera o detalhe concreto do texto.
  - severity: medium
    issue: “tornem a passar” não traduz claramente וָשׁוּבוּ.
    rationale: O segundo imperativo significa “voltem/retornem”; a formulação atual sugere apenas repetir a travessia, em vez de preservar o movimento de retorno.
  - severity: low
    issue: Âncora da nota afastada do termo anotado.
    rationale: A nota lexical sobre קְרֹבוֹ deve ser ancorada imediatamente após “parente próximo”, permitindo identificar sem ambiguidade a palavra a que se refere.
