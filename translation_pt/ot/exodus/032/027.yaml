base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: pt
  text: 'E ele lhes disse: “Assim diz Yahweh, o Deus de Israel: Cada homem prenda a sua espada à coxa. Percorram o acampamento de uma entrada a outra e retornem; cada homem mate seu irmão, cada homem seu companheiro e cada homem seu parente próximo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aquele que lhe é próximo”; também pode ser traduzido por “seu próximo”, “seu vizinho” ou “uma pessoa chegada”.'
    reason: Alternativa lexical para קְרֹבוֹ, cujo sentido pode indicar proximidade familiar, social ou espacial.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: E ele lhes disse
  rationale: Preserva o fluxo narrativo do wayyiqtol e a referência pronominal do hebraico, em português corrente.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula de mensageiro que introduz uma declaração divina autorizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto, sem substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção que identifica Yahweh como o Deus de Israel.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: Cada homem ponha a espada à cintura
  rationale: Expressa naturalmente em português o ato de armar-se, preservando o sentido distributivo de אִישׁ.
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: Passem e tornem a passar
  rationale: Conserva os dois imperativos e comunica movimento repetido pelo acampamento sem reduzir a expressão a uma única ação.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: de uma entrada a outra por todo o acampamento
  rationale: ‘Entrada’ evita sugerir necessariamente portões construídos num acampamento, enquanto a construção distributiva e a extensão espacial permanecem claras.
- source_word: וְהִרְגוּ
  choice: mate
  rationale: É o equivalente moderno, direto e não eufemístico do verbo hebraico.
- source_word: אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ
  choice: cada um mate seu irmão, cada um seu companheiro
  rationale: Mantém a repetição distributiva e a proximidade relacional chocante da ordem.
- source_word: וְאִישׁ אֶת קְרֹבוֹ
  choice: e cada um seu parente próximo
  rationale: קָרוֹב designa alguém próximo e pode indicar especialmente um familiar; esta escolha preserva essa nuance sem duplicar simplesmente ‘irmão’.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; a transliteração o preserva em vez de substituí-lo por um título.
- issue: Repetição distributiva de אִישׁ
  choice: Cada homem ... cada um ... cada um ... cada um
  alternative: Todos ... cada pessoa
  rationale: A primeira ocorrência conserva a referência masculina no contexto dos levitas; nas demais, ‘cada um’ é masculino e evita uma repetição pouco natural de ‘cada homem’ sem neutralizar o referente.
- issue: Amplitude semântica de קְרֹבוֹ
  choice: parente próximo, com nota sobre alternativas
  alternative: próximo; vizinho; pessoa chegada
  rationale: O termo admite proximidade familiar ou social. O texto principal oferece uma leitura contextual provável, e a nota preserva a amplitude genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o tom solene da ordem, mas evita arcaísmos como ‘cingir’ e ‘coxa’ no idioma de armar-se. O marcador foi colocado imediatamente após a expressão a que se refere.
