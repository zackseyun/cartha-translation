  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: pt
  text: Mas agora, se perdoares o pecado deles[a]... E, se não, apaga-me, por favor, do teu livro que escreveste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se carregares o pecado deles” ou “se levares embora o pecado deles”; o idioma hebraico usa literalmente o verbo “levantar/carregar” com “pecado”.
    reason: lexical_alternative
  - marker: b
    text: “Teu livro” pode se referir a um registro divino dos vivos ou, por extensão, ao livro da vida; o hebraico não o especifica.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Marca a transição para o pedido urgente de Moisés e expressa naturalmente o contraste contextual.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: perdoares o pecado deles
  rationale: נשׂא significa literalmente levantar ou carregar; com 'pecado' como objeto, forma um idioma que comunica remover a culpa ou perdoar. 'Perdoares' é claro e natural, enquanto a nota preserva a imagem hebraica.
- source_word: וְאִם אַיִן
  choice: Porém, se não
  rationale: Reproduz a condição negativa elíptica e sua forte virada contrastiva.
- source_word: מְחֵנִי נָא
  choice: por favor, apaga-me
  rationale: מחה designa apagar ou eliminar de um registro, e נָא dá ao pedido um tom de súplica.
- source_word: מִסִּפְרְךָ
  choice: do teu livro
  rationale: ספר pode indicar livro, rolo ou registro. 'Livro' mantém a imagem e não define indevidamente a natureza do registro divino.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: que escreveste
  rationale: Traduz diretamente a oração relativa e identifica Deus como aquele que escreveu o livro.
theological_decisions:
- issue: Natureza de “teu livro”
  choice: teu livro
  alternative: teu registro; teu rolo; livro da vida
  rationale: O hebraico não especifica se se trata do registro divino dos vivos, do livro da vida ou de outro registro. A formulação mantém essa ambiguidade teológica.
- issue: Frase condicional interrompida
  choice: reticências após a primeira condição
  alternative: acrescentar “muito bem” ou “eu te peço”
  rationale: O texto hebraico deixa sem expressão a consequência de “se perdoares”. As reticências preservam a interrupção enfática sem fornecer palavras ausentes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A próclise em “apaga-me” segue o imperativo afirmativo na norma formal; “por favor” comunica naturalmente a partícula de súplica. As reticências preservam a apódose não expressa no hebraico.
