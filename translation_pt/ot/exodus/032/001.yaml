  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: pt
  text: 'Quando o povo viu que Moisés estava demorando para descer do monte, reuniu-se ao redor de Arão e lhe disse: “Levante-se! Faça para nós deuses que vão à nossa frente[a], pois, quanto a esse Moisés, o homem que nos tirou da terra do Egito, não sabemos o que lhe aconteceu”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um deus que vá à nossa frente”. Alguns entendem אֱלֹהִים aqui no singular porque a narrativa logo se concentra numa única imagem de bezerro; porém, a forma hebraica e o verbo que a acompanha estão no plural.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: estava demorando
  rationale: Expressa a demora percebida pelo povo em português atual e natural, sem sugerir necessariamente que Moisés agiu de modo culpável.
- source_word: לָרֶדֶת מִן הָהָר
  choice: para descer do monte
  rationale: Conserva claramente o movimento descendente e emprega a expressão bíblica corrente «do monte».
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: reuniu-se ao redor de Arão
  rationale: Retrata a concentração do povo junto a Arão e a pressão implícita, sem tornar explícita uma hostilidade que a construção não exige.
- source_word: קוּם
  choice: Levante-se!
  rationale: Mantém o imperativo abrupto e enérgico em linguagem contemporânea e digna.
- source_word: עֲשֵׂה לָנוּ
  choice: Faça para nós
  rationale: Preserva o beneficiário expresso pelo pronome hebraico.
- source_word: אֱלֹהִים אֲשֶׁר יֵלְכוּ
  choice: deuses que vão
  rationale: Segue a concordância plural explícita entre o substantivo de forma plural e o verbo plural, deixando a leitura singular em nota.
- source_word: לְפָנֵינוּ
  choice: à nossa frente
  rationale: Comunica naturalmente a ideia de ir adiante do povo, guiando-o.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: esse Moisés, o homem
  rationale: Preserva a construção apositiva e o tom de distanciamento perceptível em «esse Moisés».
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: nos tirou da terra do Egito
  rationale: Expressa em português idiomático o Hiphil de עלה no contexto do êxodo, conservando a menção completa à terra do Egito.
- source_word: מֶה הָיָה לוֹ
  choice: o que lhe aconteceu
  rationale: É o equivalente idiomático moderno da pergunta sobre o destino de Moisés.
theological_decisions:
- issue: Se אֱלֹהִים deve ser traduzido no singular ou no plural neste contexto
  choice: 'plural: «deuses que vão»'
  alternative: 'singular: «um deus que vá»'
  rationale: A forma אֱלֹהִים pode ter valor singular ou plural em diferentes contextos, mas aqui o verbo יֵלְכוּ está no plural, favorecendo a leitura plural. Como a narrativa passa a tratar de uma única imagem de bezerro, a alternativa singular é preservada em nota, sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso mantém força e dignidade sem arcaísmos; «Arão» segue a forma portuguesa tradicional. A repetição de «o povo» foi reduzida na segunda oração porque o sujeito permanece inequívoco em português.
