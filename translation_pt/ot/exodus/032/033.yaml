  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Quem pecou contra mim, eu o apagarei[a] do meu livro[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “riscarei do meu livro”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “meu livro” pode se referir ao registro de Deus daqueles que estão sob seu cuidado; alguns a entendem mais especificamente como “o livro da vida”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva esse fluxo de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala, e “Moisés” é a forma portuguesa consagrada do nome.
- source_word: מִי אֲשֶׁר
  choice: Quem
  rationale: A construção introduz uma referência relativa indefinida; “Quem” expressa de forma concisa e natural o sentido de “aquele que”.
- source_word: חָטָא לִי
  choice: pecou contra mim
  rationale: O verbo no perfeito apresenta o pecado como cometido, e לִי indica que a ofensa foi dirigida contra Deus.
- source_word: אֶמְחֶנּוּ
  choice: esse eu apagarei
  rationale: מחה descreve apagar ou eliminar algo de um registro. A retomada “esse” torna explícito em português o referente do sufixo masculino singular e preserva a ênfase da ordem hebraica.
- source_word: מִסִּפְרִי
  choice: do meu livro
  rationale: Com “apagar”, a preposição מן é expressa naturalmente por “de/do”; סֵפֶר mantém a imagem de um livro ou registro divino.
theological_decisions:
- issue: Natureza de “meu livro”
  choice: Manter a metáfora “meu livro” sem definir seu referente.
  alternative: “livro da vida”, “registro dos vivos” ou “registro da aliança”
  rationale: O hebraico diz apenas “meu livro”. Especificar o tipo de livro resolveria uma ambiguidade interpretativa que o texto mantém.
translation_notes:
  register: Português atual, claro e digno, com sintaxe acessível tanto no Brasil quanto em outros contextos lusófonos. A formulação conserva o nome divino, a metáfora do apagamento e a ambiguidade de “meu livro”.
