base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: pt
  text: 'Por que os egípcios haveriam de dizer: “Ele os tirou com má intenção, para matá-los nas montanhas e exterminá-los da face da terra”? Afasta-te do ardor da tua ira e volta atrás quanto à calamidade contra o teu povo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cede quanto à calamidade contra o teu povo” ou “muda de ideia quanto à calamidade contra o teu povo”. O hebraico emprega linguagem humana e relacional no apelo de Moisés; «calamidade» refere-se ao desastre ameaçado, não à maldade moral.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Por que os egípcios haveriam de dizer
  rationale: Expressa em português natural a pergunta retórica introduzida por לָמָּה com o imperfeito יֹאמְרוּ, referindo מִצְרַיִם ao povo egípcio.
- source_word: בְּרָעָה
  choice: com má intenção
  rationale: Comunica o propósito malévolo que, segundo Moisés, os egípcios atribuiriam a Deus, sem reduzir a expressão a um resultado meramente infeliz.
- source_word: הוֹצִיאָם
  choice: Ele os tirou de lá
  rationale: Reproduz o Hifil de יצא no contexto do êxodo; 'de lá' é uma explicitação contextual mínima e natural em português.
- source_word: לַהֲרֹג אֹתָם
  choice: para matá-los
  rationale: Tradução direta e atual do infinitivo de propósito.
- source_word: בֶּהָרִים
  choice: nas montanhas
  rationale: Mantém o plural concreto do hebraico e a referência à região montanhosa do deserto.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: e exterminá-los da face da terra
  rationale: O Piel de כלה indica destruição completa; 'exterminá-los da face da terra' preserva a força e o idioma da frase hebraica.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Abandona o furor da tua ira
  rationale: Verte o imperativo como apelo para deixar o curso de ira; 'furor da tua ira' conserva a intensidade da expressão hebraica sem soar arcaico.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: e volta atrás quanto ao mal que ameaças trazer sobre o teu povo
  rationale: Preserva a linguagem relacional forte de נחם e distingue הָרָעָה, aqui como dano ou calamidade ameaçada, da má intenção atribuída a Deus no início do versículo.
theological_decisions:
- issue: Linguagem antropopática de וְהִנָּחֵם aplicada a Deus
  choice: volta atrás
  alternative: cede; arrepende-te; muda de ideia
  rationale: '''Volta atrás'' mantém o apelo real de Moisés para que Deus não execute o juízo anunciado, sem sugerir arrependimento moral nem explicar para longe a tensão do texto.'
- issue: Sentido de הָרָעָה na ação divina ameaçada
  choice: o mal que ameaças trazer
  alternative: a calamidade; o desastre; o dano
  rationale: '''Mal'' preserva a amplitude lexical e a repetição da raiz רעה, enquanto a oração explicativa deixa claro que se trata da calamidade ameaçada contra o povo, não de maldade moral em Deus.'
- issue: Força de לְעַמֶּךָ após הָרָעָה
  choice: sobre o teu povo
  alternative: contra o teu povo; destinado ao teu povo
  rationale: '''Sobre'' expressa naturalmente o alvo da calamidade em português e evita decidir além do necessário entre dano pretendido e juízo anunciado.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega segunda pessoa singular ('tua', 'teu') para conservar a forma direta e solene da oração de Moisés. A nota preserva a ambiguidade de נחם e de רעה sem impor uma solução doutrinária.
