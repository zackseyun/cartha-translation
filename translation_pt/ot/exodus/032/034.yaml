  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: pt
  text: Mas agora vá, conduza o povo ao lugar de que lhe falei. Eis que o meu anjo irá à sua frente. Contudo, no dia em que eu pedir contas, pedirei contas a eles pelo seu pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu os visitar, farei recair sobre eles o seu pecado”; o verbo hebraico pode indicar visitar para examinar, responsabilizar ou punir.'
    reason: Registra a amplitude e a repetição do verbo פקד, bem como uma construção mais próxima da forma hebraica.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Expressa a transição adversativa e temporal no contexto, em português natural.
- source_word: נְחֵה
  choice: conduza
  rationale: Traduz o imperativo de נחה como liderança e direção do povo.
- source_word: מַלְאָכִי
  choice: o meu anjo
  rationale: Mantém o sentido básico de mensageiro celestial sem determinar além do que o texto afirma.
- source_word: פָּקַד / פָּקַדְתִּי
  choice: pedir contas / pedirei contas
  rationale: Preserva a repetição da raiz hebraica e, neste contexto judicial, comunica responsabilização sem reduzir o verbo apenas a 'punir'.
- source_word: חַטָּאתָם
  choice: seu pecado
  rationale: Mantém o singular coletivo do hebraico, referido ao pecado do povo.
theological_decisions:
- issue: Natureza da ação divina expressa por פקד
  choice: pedir contas
  alternative: punir
  rationale: O verbo possui amplitude semântica que inclui visitar, intervir, examinar e punir. 'Pedir contas' preserva a dimensão judicial e a abertura quanto à forma concreta da consequência.
- issue: Identidade do anjo
  choice: meu anjo
  alternative: meu mensageiro
  rationale: A tradução tradicional e natural é mantida sem identificar explicitamente esse anjo com Deus, com Cristo ou com qualquer outra figura.
- issue: Objeto da prestação de contas
  choice: a eles pelo seu pecado
  alternative: sobre eles o seu pecado
  rationale: Torna clara a responsabilidade do povo, sem resolver além do texto a relação entre culpa, juízo e punição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos naturais e preservação da repetição enfática do hebraico. “Eis que” mantém o destaque discursivo de הִנֵּה sem soar excessivamente técnico.
