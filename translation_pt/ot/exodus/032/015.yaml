base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: pt
  text: Então Moisés se virou e desceu do monte, levando na mão as duas tábuas do testemunho, tábuas escritas dos dois lados; de um lado e do outro estavam escritas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: se virou
  rationale: Expressa naturalmente a mudança de direção de Moisés, sem ampliar o sentido do verbo.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Equivalente direto e natural de ירד no contexto narrativo.
- source_word: הָהָר
  choice: o monte
  rationale: No contexto do Sinai, “monte” é a designação portuguesa consagrada e natural.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: as duas tábuas do testemunho
  rationale: Mantém tanto o número quanto a terminologia pactual de עֵדוּת, sem acrescentar “pedra”, que não aparece neste versículo.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Preserva o singular hebraico e funciona idiomaticamente em português.
- source_word: לֻחֹת כְּתֻבִים
  choice: tábuas escritas
  rationale: Reproduz o particípio passivo de כתב sem especificar um modo de gravação além do texto.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: dos dois lados
  rationale: Forma clara e idiomática de indicar que havia escrita nas duas faces das tábuas.
- source_word: מִזֶּה וּמִזֶּה
  choice: de um lado e do outro
  rationale: Preserva o paralelismo distributivo e a ênfase reiterativa do hebraico.
- source_word: הֵם כְּתֻבִים
  choice: estavam escritas
  rationale: Mantém a repetição enfática do original, com concordância natural em português com “tábuas”.
theological_decisions:
- issue: Tradução de עֵדוּת em “tábuas do testemunho”
  choice: testemunho
  alternative: aliança; documento da aliança
  rationale: “Testemunho” preserva a terminologia hebraica e sua ressonância pactual sem reduzir o termo a uma interpretação explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluência (“levando na mão”), mantendo o conteúdo, o singular de “mão” e a repetição enfática sobre os dois lados.
