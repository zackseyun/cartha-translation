base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/017.yaml
  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: pt
  text: 'Quando Josué ouviu o barulho do povo gritando[a], disse a Moisés: “Há barulho de guerra no acampamento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no meio da gritaria” ou “enquanto ele gritava”. Em hebraico, “povo” é um substantivo coletivo singular, e a expressão se refere ao seu grito forte ou à sua gritaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O qal narrativo de שׁמע indica aqui percepção auditiva simples na sequência dos acontecimentos.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: קוֹל
  choice: barulho
  rationale: Neste contexto, קוֹל designa a forte comoção audível produzida pelo povo, não uma fala articulada. “Barulho” é natural em português e funciona bem nas duas ocorrências.
- source_word: הָעָם
  choice: o povo
  rationale: O substantivo coletivo עָם se refere aqui ao povo israelita.
- source_word: בְּרֵעֹה
  choice: gritando
  rationale: A expressão indica a emissão de um grito forte ou uma gritaria. O sufixo singular concorda formalmente com o coletivo “povo”; em português, a construção “o povo gritando” conserva esse valor coletivo de modo natural.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: disse a Moisés
  rationale: Tradução corrente e direta da fórmula narrativa hebraica.
- source_word: קוֹל מִלְחָמָה
  choice: barulho de guerra
  rationale: Preserva a relação construta, literalmente “som/barulho de guerra”. “Barulho” expressa de modo natural a interpretação auditiva de Josué, sem especificar indevidamente uma batalha.
- source_word: בַּמַּחֲנֶה
  choice: no acampamento
  rationale: מַחֲנֶה designa o acampamento israelita; esta é a tradução direta e idiomática.
