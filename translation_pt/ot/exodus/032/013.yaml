id: EXO.32.13
reference: Exodus 32:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: pt
  text: 'Lembra-te de Abraão, de Isaque e de Israel[a], teus servos, aos quais juraste por ti mesmo e disseste: “Multiplicarei a descendência de vocês como as estrelas dos céus; e toda esta terra, da qual falei, darei à descendência de vocês, e eles a herdarão para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jacó” — o patriarca que mais tarde recebeu o nome Israel. Aqui, o texto hebraico traz “Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Imperativo dirigido a Deus na intercessão de Moisés. A forma pronominal é natural no registro bíblico digno e preserva o apelo pactual sem explicitação adicional.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: de Abraão, de Isaque e de Israel
  rationale: Mantém os três nomes do hebraico; em particular, preserva “Israel”, o nome pactual do patriarca, em vez de substituí-lo interpretativamente por “Jacó”.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: Neste contexto, עבד assinala a relação dos patriarcas com Deus, não prioritariamente uma condição social de escravidão.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: aos quais juraste por ti mesmo
  rationale: Reproduz a fórmula de juramento na qual o próprio Deus é a garantia, preservando a força reflexiva de בָּךְ.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: e disseste
  rationale: Equivalente português natural para introduzir discurso direto, sem alterar o conteúdo de דבר.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Multiplicarei a descendência de vocês
  rationale: “Descendência” comunica o valor coletivo de זרע. “De vocês” evita a forma ambígua “vossa” para muitos leitores modernos, mantendo claro que a promessa se dirige aos patriarcas.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: como as estrelas dos céus
  rationale: Preserva a imagem e o plural hebraico em linguagem elevada e inteligível.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: e toda esta terra
  rationale: Mantém o demonstrativo e a abrangência da expressão hebraica referente à terra prometida.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: da qual falei
  rationale: Traduz a oração relativa separadamente, sem fundi-la com a promessa subsequente “darei”, preservando a estrutura e a possível concisão do hebraico.
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: darei à descendência de vocês
  rationale: Mantém a promessa futura e traduz זרע de modo coerente com sua primeira ocorrência.
- source_word: וְנָחֲלוּ
  choice: e eles a herdarão
  rationale: “Herdarão” expressa נחל; os pronomes “eles” e “a” tornam explícitos em português os referentes contextuais — a descendência e a terra — deixados implícitos no hebraico.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: Equivalente corrente que preserva a duração indefinida/permanente da promessa neste contexto pactual.
theological_decisions:
- issue: Uso de “Israel” em vez de “Jacó” para o patriarca
  choice: Israel no texto principal
  alternative: Jacó
  rationale: O texto hebraico traz explicitamente יִשְׂרָאֵל. Mantê-lo preserva a ressonância do novo nome pactual sem substituir tradução por interpretação.
- issue: Fórmula de juramento בָּךְ
  choice: por ti mesmo
  alternative: por tua própria pessoa
  rationale: “Por ti mesmo” comunica com naturalidade que Deus jurou tendo a si próprio como garantia, sem acrescentar formulação doutrinária ao texto.
- issue: Relação entre אֲשֶׁר אָמַרְתִּי e אֶתֵּן
  choice: “da qual falei, darei” como duas unidades relacionadas
  alternative: “que disseste que darias”
  rationale: A tradução preserva a oração relativa e o verbo subsequente como elementos distintos, evitando incorporar antecipadamente o conteúdo de אֶתֵּן em אָמַרְתִּי.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega “Lembra-te”, “teus” e “juraste” no discurso dirigido a Deus, mas “de vocês” dentro da citação dirigida coletivamente aos patriarcas, evitando a ambiguidade regional de “vossa descendência”. O marcador [a] aparece junto a “Israel”, termo ao qual a nota se refere.
