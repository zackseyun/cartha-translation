base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Vi este povo, e eis que é um povo de dura cerviz[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obstinado”. A expressão hebraica significa literalmente “de pescoço duro” e retrata resistência teimosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Preserva a sequência narrativa do wayyiqtol sem acrescentar uma nuance temporal mais forte do que a expressa no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רָאִיתִי
  choice: Tenho visto
  rationale: Expressa a observação já realizada com relevância para a avaliação presente; mantém aberta a amplitude aspectual do perfeito hebraico.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o substantivo coletivo singular e a força demonstrativa, inclusive seu possível tom de distanciamento.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Conserva a função enfática e de chamada de atenção de הִנֵּה em registro digno e reconhecível.
- source_word: קְשֵׁה עֹרֶף
  choice: de dura cerviz
  rationale: Preserva a metáfora hebraica vívida e tradicional; a nota esclarece seu sentido para leitores atuais.
- source_word: הוּא
  choice: é
  rationale: O pronome retoma o coletivo singular עַם; em português, a cópula sem pronome explícito produz uma construção natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração preserva o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Sentido da metáfora קְשֵׁה עֹרֶף
  choice: de dura cerviz
  alternative: obstinado; teimoso
  rationale: A tradução mantém a imagem de resistência e obstinação sem reduzir a expressão a uma interpretação abstrata.
translation_notes:
  register: Português moderno de registro digno, com sintaxe simples. “Eis que” e “dura cerviz” conservam a força retórica e a imagem do hebraico; a nota torna a metáfora acessível ao leitor contemporâneo.
