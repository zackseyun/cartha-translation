  terminology: “Yahweh”, “Moisés”, “povo” e “dura cerviz” estão consistentes com o hebraico e com o registro adotado. A nota mantém a imagem literal e apresenta “obstinado” como alternativa interpretativa, sem impor leitura doutrinária.
