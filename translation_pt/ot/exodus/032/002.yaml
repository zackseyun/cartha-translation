base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: pt
  text: 'E Arão lhes disse[a]: “Tirem as argolas de ouro que estão nas orelhas de suas mulheres, de seus filhos e de suas filhas, e tragam-nas a mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Arranquem as argolas de ouro...”. O verbo hebraico pode sugerir retirar ou desprender os adornos com força.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva esse fluxo de modo natural e digno em português.
- source_word: אֲלֵהֶם
  choice: lhes
  rationale: Mantém o pronome explícito do hebraico sem substituí-lo por um substantivo interpretativo como “ao povo”.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: פָּרְקוּ
  choice: Tirem
  rationale: No contexto, o verbo ordena a retirada dos adornos do corpo. “Tirem” é natural em português, enquanto a possível ideia de arrancar ou desprender com força é preservada em nota.
- source_word: נִזְמֵי הַזָּהָב
  choice: as argolas de ouro
  rationale: נֶזֶם designa uma argola que pode ser usada no nariz ou na orelha; como o texto especifica que elas estão nas orelhas, “argolas” evita restringir além do necessário e “de ouro” expressa naturalmente o material.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: que estão nas orelhas de
  rationale: Reproduz diretamente a oração relativa e a localização indicadas pelo hebraico.
- source_word: נְשֵׁיכֶם
  choice: suas mulheres
  rationale: Preserva a amplitude lexical de נָשִׁים, que neste contexto familiar pode significar “mulheres” ou, mais especificamente, “esposas”, sem resolver desnecessariamente a ambiguidade.
- source_word: בְּנֵיכֶם
  choice: seus filhos
  rationale: Traduz o termo masculino plural em paralelo explícito com “filhas”; no contexto, refere-se aos filhos homens.
- source_word: וּבְנֹתֵיכֶם
  choice: e suas filhas
  rationale: Preserva a menção explícita e paralela às filhas.
- source_word: וְהָבִיאוּ אֵלָי
  choice: e tragam-nas a mim
  rationale: Expressa claramente o segundo imperativo; o pronome feminino plural retoma “argolas” e “a mim” conserva a ênfase do complemento hebraico.
theological_decisions: []
