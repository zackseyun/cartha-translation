  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: pt
  text: 'E Arão disse: “Não se acenda a ira do meu senhor. Tu conheces o povo: ele é inclinado ao mal[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é dado ao mal” ou “está voltado para o mal”. A expressão hebraica é idiomática e caracteriza o povo pelo mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: E Arão disse
  rationale: Mantém o fluxo narrativo introduzido pelo waw consecutivo e emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: אַל יִחַר אַף
  choice: Não se acenda a ira
  rationale: Preserva a metáfora hebraica da ira que se inflama, em formulação digna e natural em português.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de Arão dirigir-se a Moisés, não um título divino; a inicial minúscula evita confusão.
- source_word: אַתָּה יָדַעְתָּ אֶת הָעָם
  choice: Tu conheces este povo
  rationale: O pronome explícito é representado por “Tu”, preservando sua presença sem acrescentar a ênfase mais forte de “tu mesmo”. O demonstrativo torna natural a referência ao povo presente no contexto.
- source_word: כִּי בְרָע הוּא
  choice: e sabes que ele é inclinado ao mal
  rationale: Explicita de modo natural em português o conteúdo conhecido por Moisés e conserva a referência coletiva singular de הָעָם/הוּא. “Inclinado ao mal” comunica a caracterização idiomática sem transformá-la numa afirmação de ação pontual.
theological_decisions:
- issue: Sentido de אֲדֹנִי ao dirigir-se a Moisés
  choice: meu senhor
  alternative: meu mestre; senhor
  rationale: O referente humano exige uma forma de deferência que não seja confundida com o título divino.
- issue: Caracterização moral em בְרָע הוּא
  choice: ele é inclinado ao mal
  alternative: ele está voltado para o mal; ele é dado ao mal
  rationale: A expressão hebraica é idiomática e admite nuances de disposição ou propensão. A tradução mantém essa tensão sem impor uma formulação doutrinária sobre a natureza humana.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a metáfora hebraica da ira que se acende e usa “meu senhor” em minúsculas por se tratar de Moisés. O singular coletivo “ele” retoma “este povo” e evita uma mudança desnecessária de número.
