  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: pt
  text: 'Moisés disse a Arão: “O que este povo lhe fez para que você trouxesse sobre ele um pecado tão grande?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão; em português, a conjunção pode ser omitida sem perda da sequência narrativa.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: O que este povo fez a você
  rationale: Preserva a pergunta direta, o demonstrativo e o possível tom de distanciamento de “este povo”; “fez a você” é natural e fiel a עשה + ל.
- source_word: כִּי
  choice: para que
  rationale: 'Neste contexto, introduz a consequência ligada à pergunta: o que o povo teria feito a Arão para resultar em tamanha culpa de sua parte.'
- source_word: הֵבֵאתָ עָלָיו
  choice: você trouxesse sobre ele
  rationale: O hifil de בוא significa “trazer”; o pronome hebraico é singular e retoma coletivamente “o povo”, uso que o português permite conservar.
- source_word: חֲטָאָה גְדֹלָה
  choice: tão grande pecado
  rationale: Mantém o sentido direto de pecado grave e expressa naturalmente, em português, a intensidade da repreensão dentro da construção interrogativa.
theological_decisions:
- issue: Responsabilidade de Arão
  choice: Arão é apresentado como aquele que trouxe grande pecado sobre o povo.
  alternative: Arão levou o povo a cometer um grande pecado.
  rationale: A formulação conserva a atribuição direta de responsabilidade moral a Arão sem explicar além do que o hebraico afirma.
- issue: Referente do pronome עָלָיו
  choice: “sobre ele”, retomando coletivamente “este povo”
  alternative: “sobre eles”, explicitando os integrantes do povo
  rationale: O hebraico usa pronome singular em concordância com o substantivo coletivo singular הָעָם; o português também admite essa retomada e, assim, preserva a forma do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “para que você trouxesse” comunica consequência sem absolver Arão, e “sobre ele” preserva a referência coletiva singular do hebraico.
