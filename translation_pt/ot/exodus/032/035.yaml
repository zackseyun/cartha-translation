- from: Então Yahweh atingiu o povo com uma praga por causa do que fizeram com o bezerro que Arão tinha feito.[a]
  to: Então Yahweh feriu o povo por causa do que fizeram com o bezerro que Arão fez.[a]
  rationale: 'A revisão remove do texto principal a expressão «com uma praga», pois ela vai além do que é explicitamente dito, e conserva essa possibilidade semântica na nota. Também substitui o mais-que-perfeito por «fez», tradução direta e natural do perfeito hebraico. A formulação «do que fizeram com o bezerro» mantém a ambiguidade e a tensão sintática do versículo: o povo é responsabilizado por sua ação, e Arão é identificado como quem fez o bezerro.'
