  source_fidelity: A tradução preserva adequadamente Yahweh, «o povo», o nexo causal e a distinção sintática entre a ação plural do povo e a oração que identifica o bezerro como obra de Arão. Contudo, «com uma praga» introduz um meio de juízo que אינו é expresso por um substantivo no hebraico; נָגַף pode ter conotação de praga neste contexto, mas também permite «feriu/atingiu». Além disso, «tinha feito» é possível em português, mas o perfeito simples hebraico não exige explicitar anterioridade.
  naturalness: «Então Yahweh feriu o povo por causa do que fizeram com o bezerro que Arão fez» é claro, natural e de registro bíblico moderno. Evita a repetição um pouco pesada de «tinha feito» e não acrescenta uma especificação não explícita.
  terminology: «Yahweh», «Arão» e «bezerro» estão corretos e adequados ao uso bíblico português. «Feriu» traduz de modo sóbrio e diretamente o verbo hebraico, enquanto a nota registra a possibilidade contextual de entender uma aflição ou praga.
