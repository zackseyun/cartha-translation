base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: pt
  text: Então Yahweh feriu o povo por causa do que fizeram com o bezerro que Arão fez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então Yahweh atingiu o povo por causa do que fizeram com o bezerro que Arão fez”. O verbo hebraico também pode referir-se a uma aflição ou praga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: atingiu ... com uma praga
  rationale: O verbo נָגַף denota ferir ou afligir e muitas vezes se refere a uma praga ou juízo. A expressão comunica esse sentido provável em português sem afirmar mortes nem especificar a natureza da praga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָעָם
  choice: o povo
  rationale: É a forma natural de designar coletivamente a comunidade de Israel neste contexto.
- source_word: עַל אֲשֶׁר
  choice: por causa do que
  rationale: Expressa de modo natural a relação causal introduzida pela preposição e pela oração relativa.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: Preserva a forma plural e a responsabilidade do povo; no contexto, a construção portuguesa 'o que fizeram com' evita identificar de maneira indevidamente rígida a ação apenas como fabricação.
- source_word: הָעֵגֶל
  choice: o bezerro
  rationale: Traduz diretamente o substantivo sem acrescentar 'de ouro', informação conhecida pelo contexto, mas ausente deste versículo.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: que Arão tinha feito
  rationale: Identifica o bezerro como obra de Arão; o mais-que-perfeito composto torna clara, em português, a anterioridade da fabricação.
theological_decisions:
- issue: Natureza do juízo divino em וַיִּגֹּף
  choice: atingiu o povo com uma praga
  alternative: atingiu o povo; afligiu o povo
  rationale: Embora o hebraico não apresente um substantivo explícito para 'praga', o verbo pode designar uma aflição desse tipo. A nota preserva a possibilidade de uma tradução mais geral.
- issue: Responsabilidade do povo e fabricação por Arão
  choice: por causa do que fizeram com o bezerro que Arão tinha feito
  alternative: porque fizeram o bezerro que Arão tinha feito
  rationale: 'A formulação mantém a tensão do texto: o plural עָשׂוּ atribui culpa ao povo, enquanto a oração final atribui a fabricação do bezerro a Arão, sem harmonizar as duas afirmações.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Arão' segue a forma bíblica portuguesa tradicional e corrente. A ordem da frase acompanha de perto o hebraico, mas emprega construções idiomáticas em português.
