base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: pt
  text: Ele pegou o bezerro que eles tinham feito, queimou-o no fogo, moeu-o até que ficasse bem fino, espalhou-o sobre a superfície da água e fez os filhos de Israel beberem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fez os israelitas beberem». Em hebraico, «os filhos de Israel», designação tradicional do povo como um todo. O texto hebraico não explicita o que eles beberam; pelo contexto, pode-se entender a água sobre a qual o material moído foi espalhado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: o bezerro
  rationale: עֵגֶל designa um bezerro ou bovino jovem; «bezerro» é a forma tradicional, clara e adequada ao contexto do ídolo.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que eles tinham feito
  rationale: O mais-que-perfeito expressa naturalmente em português a ação anterior de fabricar o bezerro.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: queimou-o no fogo
  rationale: Preserva de modo concreto o verbo e a expressão preposicional hebraica, em português natural.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: moeu-o até reduzi-lo a pó fino
  rationale: טחן significa moer, e דק indica matéria fina ou reduzida a partículas pequenas; a formulação torna explícito em português o resultado material exigido pelo contexto.
- source_word: וַיִּזֶר
  choice: espalhou-o
  rationale: O verbo descreve a dispersão dos restos moídos; «espalhou» é claro e não introduz a ideia mais específica de joeirar.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: sobre a superfície da água
  rationale: Reproduz a imagem de פְּנֵי, literalmente «face», com uma expressão portuguesa corrente.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: fez os filhos de Israel beberem dela
  rationale: O hifil de שׁקה é causativo, «fazer beber». «Filhos de Israel» conserva a designação hebraica, e «dela» retoma naturalmente a água sobre a qual o material fora espalhado.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A forma principal preserva a expressão hebraica e seu caráter pactual, sem negar que ela designe coletivamente todo o povo; a alternativa idiomática é registrada em nota.
- issue: Objeto implícito de «beber»
  choice: beberem dela, isto é, da água
  alternative: beberem aquilo, isto é, a mistura
  rationale: O hebraico não apresenta pronome objeto após o verbo causativo. Como a água é o referente expresso imediatamente anterior, «dela» é natural, mas a nota preserva a possibilidade de entender o ato como beber a água com o material espalhado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência verbal foi mantida direta e narrativa; evitou-se vocabulário arcaico como «espargiu» ou «deu de beber».
