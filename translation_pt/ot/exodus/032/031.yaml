  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: pt
  text: 'Então Moisés voltou a Yahweh e disse: “Por favor, este povo cometeu um grande pecado, e eles fizeram para si deuses de ouro[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram para si um deus de ouro”. O hebraico diz literalmente “deuses de ouro”, no plural, embora alguns entendam a expressão como referência singular ao bezerro de ouro por causa do contexto mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב indica que Moisés retornou a Yahweh depois de estar com o povo; “voltou” é natural e conciso em português.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição אֶל expressa direção, e o nome divino יְהוָה é transliterado como “Yahweh”, preservando o nome da aliança presente no texto hebraico.
- source_word: אָנָּא
  choice: Por favor
  rationale: A partícula introduz uma súplica; “Por favor” comunica o tom de intercessão sem arcaísmo.
- source_word: חָטָא הָעָם הַזֶּה
  choice: este povo cometeu
  rationale: “Este povo” conserva o coletivo singular de עָם. Com “pecado” como objeto cognato, “cometeu” produz uma formulação portuguesa natural sem perder o sentido de חטא.
- source_word: חֲטָאָה גְדֹלָה
  choice: um grande pecado
  rationale: Preserva a gravidade e o conteúdo lexical da construção cognata hebraica, embora evite a repetição pouco natural “pecou um grande pecado”.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: fizeram para si
  rationale: Conserva a ideia de que o povo produziu os objetos para seu próprio uso ou benefício.
- source_word: אֱלֹהֵי זָהָב
  choice: deuses de ouro
  rationale: Traduz formalmente o plural construto hebraico, sem harmonizá-lo silenciosamente com o bezerro singular do contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Número gramatical de אֱלֹהֵי זָהָב
  choice: deuses de ouro
  alternative: um deus de ouro
  rationale: A forma hebraica é plural, embora o contexto narrativo possa levar alguns a entendê-la como referência ao bezerro de ouro no singular. O texto principal mantém o plural e a nota registra a leitura contextual alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações acompanha o hebraico, enquanto “cometeu um grande pecado” evita uma construção cognata artificial em português. O marcador [a] aparece junto à expressão que explica.
