  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: pt
  text: 'Moisés, porém, suplicou[a] a Yahweh, seu Deus, dizendo: “Por que, Yahweh, a tua ira deveria arder contra o teu povo, que tiraste da terra do Egito com grande poder e com mão forte?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “procurou o rosto de Yahweh”; expressão que significa buscar seu favor ou suplicar com insistência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: suplicou a
  rationale: A construção idiomática significa buscar o favor de alguém por meio de súplica intensa. “Suplicou a” comunica com naturalidade a urgência da intercessão, enquanto a nota preserva a imagem literal do rosto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: O sufixo singular refere-se ao Deus de Moisés e preserva a relação pessoal e pactual expressa no texto.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: a tua ira deveria arder
  rationale: Preserva a metáfora hebraica do calor da ira sem reproduzir de modo obscuro a imagem literal do nariz; “deveria” expressa a força retórica da pergunta.
- source_word: בְּעַמֶּךָ
  choice: contra o teu povo
  rationale: Com o verbo de ira, a preposição indica o alvo; “teu povo” mantém o apelo pactual de Moisés.
- source_word: אֲשֶׁר הוֹצֵאתָ מֵאֶרֶץ מִצְרַיִם
  choice: que tiraste da terra do Egito
  rationale: Mantém a fórmula do êxodo, a referência geográfica completa e a ação divina em forma direta e natural.
- source_word: בְּכֹחַ גָּדוֹל
  choice: com grande poder
  rationale: Representa naturalmente o beth instrumental e conserva a ênfase na força divina.
- source_word: וּבְיָד חֲזָקָה
  choice: e mão forte
  rationale: Tradução próxima e idiomática da expressão hebraica; a preposição “com”, já expressa antes, rege os dois elementos coordenados.
theological_decisions:
- issue: Linguagem antropomórfica da ira divina
  choice: a tua ira deveria arder
  alternative: deverias ficar irado
  rationale: A formulação conserva a imagem hebraica de calor e a tensão retórica da intercessão, sem literalizar de maneira opaca a referência ao nariz.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto-fonte em vez de substituí-lo por um título.
- issue: Intercessão de Moisés e favor divino
  choice: suplicou a
  alternative: procurou aplacar
  rationale: “Suplicou” descreve a ação textual de Moisés sem acrescentar uma explicação teológica sobre mudança em Deus ou manipulação da vontade divina.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a metáfora da ira que arde, a linguagem pactual e a cadência solene do apelo.
