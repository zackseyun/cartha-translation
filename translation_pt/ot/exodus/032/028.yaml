base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: pt
  text: E os filhos de Levi fizeram conforme a palavra de Moisés; e, naquele dia, caíram[a] dentre o povo cerca de três mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente «caíram», expressão comum para morrer ou ser abatido; também se pode traduzir por «foram mortos».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: Mantém o sentido amplo e direto de עשה e combina naturalmente com «conforme a palavra de Moisés».
- source_word: בְנֵי לֵוִי
  choice: os filhos de Levi
  rationale: Reproduz a expressão familiar hebraica sem substituir sua forma concreta pelo termo institucional «levitas».
- source_word: כִּדְבַר מֹשֶׁה
  choice: conforme a palavra de Moisés
  rationale: Reflete de perto a construção hebraica; «palavra» comunica aqui a ordem ou instrução de Moisés.
- source_word: וַיִּפֹּל
  choice: caíram
  rationale: Preserva o verbo hebraico e seu uso idiomático para morrer ou ser abatido, sem explicitar mais do que o texto.
- source_word: מִן הָעָם
  choice: dentre o povo
  rationale: 'Expressa o valor partitivo de מן: os que caíram faziam parte do povo.'
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Formulação natural e dignificada em português para a expressão temporal hebraica.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: cerca de três mil homens
  rationale: «Cerca de» representa o valor aproximativo do prefixo כ, e «homens» corresponde a אִישׁ.
theological_decisions:
- issue: Formulação das mortes no contexto de juízo
  choice: caíram dentre o povo cerca de três mil homens
  alternative: foram mortos cerca de três mil homens do povo
  rationale: O hebraico emprega «cair», não um verbo explícito para «matar». A tradução conserva a gravidade e a tensão do relato sem acrescentar especificidade causal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem da última oração foi ajustada para evitar a leitura momentânea de que «cerca de três mil» modifica «povo», mantendo todos os elementos e a ênfase narrativa do hebraico.
