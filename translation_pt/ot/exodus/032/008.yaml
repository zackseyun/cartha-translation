language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: pt
  text: 'Eles se desviaram depressa do caminho que lhes ordenei seguir. Fizeram para si a imagem fundida de um bezerro[a], curvaram-se diante dela, ofereceram-lhe sacrifícios e disseram: “Estes são os seus deuses, Israel, que tiraram você da terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o seu deus, Israel”. O hebraico diz literalmente: “Estes são os seus deuses”, embora, no contexto, o referente seja um único bezerro.'
    reason: Leitura alternativa decorrente da tensão entre a forma plural do hebraico e o referente singular no contexto.
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: se desviaram depressa
  rationale: Preserva tanto a metáfora do afastamento do caminho ordenado quanto a rapidez da transgressão, em português natural.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: do caminho que eu lhes ordenei
  rationale: Mantém a imagem moral do “caminho” e reproduz de modo conciso a construção hebraica, entendendo o caminho como aquilo que Deus lhes ordenou seguir.
- source_word: עָשׂוּ לָהֶם
  choice: fizeram para si
  rationale: 'Conserva a nuance reflexiva: eles próprios providenciaram o objeto de culto.'
- source_word: עֵגֶל מַסֵּכָה
  choice: a imagem fundida de um bezerro
  rationale: מַסֵּכָה designa uma imagem produzida por fundição; a formulação deixa claro que se trata de um ídolo em forma de bezerro.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: curvaram-se diante dela
  rationale: Preserva o gesto corporal de prostração, sem substituí-lo pelo termo interpretativo mais amplo “adoraram”.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: ofereceram-lhe sacrifícios
  rationale: Expressa claramente a ação cultual do verbo זבח em linguagem portuguesa corrente.
- source_word: אֵלֶּה אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: Estes são os seus deuses, Israel
  rationale: Mantém o plural gramatical explícito do hebraico, apesar da referência contextual a uma única imagem.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: que tiraram você da terra do Egito
  rationale: “Tiraram” comunica naturalmente em português o movimento do êxodo expresso pelo hifil de עלה; o plural concorda com a declaração hebraica preservada.
theological_decisions:
- issue: Número gramatical na aclamação אֵלֶּה אֱלֹהֶיךָ
  choice: 'Preservar no texto principal o plural: “Estes são os seus deuses, Israel”.'
  alternative: 'Traduzir segundo o referente singular: “Este é o seu deus, Israel”.'
  rationale: O demonstrativo e o substantivo estão formalmente no plural. Como o contexto menciona um só bezerro, a tensão deve ser preservada, e não resolvida silenciosamente; a leitura singular aparece em nota.
- issue: Sentido cultual de וַיִּשְׁתַּחֲווּ
  choice: curvaram-se diante dela
  alternative: adoraram-na
  rationale: 'A tradução escolhida conserva a ação física de prostração e mantém a progressão do relato: curvar-se, sacrificar e proclamar.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” no discurso dirigido coletivamente a Israel, evitando formas arcaicas; mantém a metáfora do caminho, a concretude da prostração e a ambiguidade de número presente no hebraico.
