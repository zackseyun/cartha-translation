  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: pt
  text: Então, Yahweh desistiu da calamidade que havia dito que traria sobre seu povo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mudou de ideia” ou “arrependeu-se” quanto à calamidade que havia dito que traria sobre seu povo.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “o mal”. Aqui, a expressão se refere ao dano ou à calamidade ameaçada, não à maldade moral em Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: desistiu
  rationale: O nifal de נחם expressa aqui o abandono de uma ação anteriormente anunciada. “Desistiu” comunica de modo natural a mudança real no curso narrativo sem definir além do texto como isso se relaciona com a natureza de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: עַל הָרָעָה
  choice: do mal
  rationale: A construção נחם על indica aquilo de que se desiste. רָעָה pode designar mal, dano, desgraça ou calamidade; o contexto mostra que se trata do juízo ameaçado, não de maldade moral em Deus.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: que havia dito que faria
  rationale: Reproduz de maneira clara e próxima do hebraico a referência ao que Yahweh anunciara anteriormente fazer.
- source_word: לְעַמּוֹ
  choice: ao seu povo
  rationale: Indica o povo como alvo da ação ameaçada e soa natural em português.
theological_decisions:
- issue: Descrição antropopática de Deus por meio de נחם
  choice: desistiu
  alternative: mudou de ideia; arrependeu-se
  rationale: O versículo apresenta uma mudança efetiva na ação anunciada em resposta à intercessão. “Desistiu” preserva essa força narrativa sem resolver silenciosamente a tensão teológica nem sugerir necessariamente erro ou ignorância em Deus.
- issue: Sentido de הָרָעָה aplicado à ação divina ameaçada
  choice: mal, esclarecido em nota como dano ou calamidade
  alternative: desgraça; calamidade
  rationale: “Mal” preserva a amplitude e a tensão lexical do hebraico, enquanto a nota impede que o leitor o entenda como maldade moral em Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa acompanha a estrutura do hebraico; as notas preservam tanto a gama semântica de נחם quanto a ambiguidade de רָעָה.
