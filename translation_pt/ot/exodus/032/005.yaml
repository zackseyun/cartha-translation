base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: pt
  text: 'Quando Arão viu aquilo[a], diante dele construiu um altar. Então Arão proclamou: “Amanhã haverá uma festa para Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O objeto de «viu» não está expresso no hebraico; pelo contexto, é o bezerro. O pronome em «diante dele» pode, gramaticalmente, referir-se a Arão ou ao bezerro, embora o contexto favoreça o bezerro.
    reason: O hebraico omite o objeto de «viu», e o sufixo pronominal de לְפָנָיו tem referente gramaticalmente ambíguo.
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quando Arão viu aquilo
  rationale: O verbo significa “ver”; “aquilo” explicita naturalmente em português o objeto subentendido, apontando no contexto para o bezerro recém-feito. “Quando” comunica bem o valor temporal da sequência narrativa.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: construiu um altar
  rationale: Tradução direta e idiomática de בנה com מזבח, preservando o sentido cultual.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Preserva o pronome masculino singular do hebraico e sua ambiguidade gramatical. No contexto, “dele” provavelmente se refere ao bezerro, mas pode gramaticalmente remeter a Arão.
- source_word: וַיִּקְרָא אַהֲרֹן וַיֹּאמַר
  choice: Então Arão proclamou
  rationale: A combinação literal “chamou e disse” introduz um anúncio público; “proclamou” expressa isso de modo natural e conciso em português, sem a redundância pouco idiomática.
- source_word: חַג
  choice: uma festa
  rationale: חג designa uma festa ou celebração religiosa. “Festa” é clara e corrente, sem especificar indevidamente uma peregrinação.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica destinação ou dedicação, e “para” é natural neste anúncio. O nome divino יהוה é transliterado como “Yahweh”, preservando o nome da aliança.
- source_word: מָחָר
  choice: Amanhã haverá
  rationale: O hebraico apresenta uma oração nominal concisa; “haverá” fornece em português a cópula futura exigida pelo contexto do anúncio.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a decisão editorial indicada, sem substituí-lo por um título.
- issue: Referente do sufixo em לְפָנָיו
  choice: Manter no texto “diante dele”, provavelmente referente ao bezerro
  alternative: Explicitar “diante do bezerro” ou entender “diante de Arão”
  rationale: O contexto favorece fortemente o bezerro como referente, mas a forma hebraica masculina singular admite gramaticalmente Arão. A tradução mantém a ambiguidade genuína e a nota a esclarece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a concisão narrativa do hebraico, evita redundância em “proclamou e disse” e conserva, tanto quanto possível, a ambiguidade do pronome.
