  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: pt
  text: 'Então Moisés ficou de pé junto à entrada do acampamento e disse[a]: “Quem está do lado de Yahweh, venha até mim!” E todos os filhos de Levi se reuniram a ele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Quem é por Yahweh? A mim!” A tradução explicita a convocação subentendida: “venha até mim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os levitas”. Literalmente, “todos os filhos de Levi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: ficou de pé
  rationale: Traduz diretamente עמד no fluxo narrativo, sem acrescentar a formalidade ou a determinação sugerida por expressões como “tomou posição”.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: junto à entrada do acampamento
  rationale: שַׁעַר designa o portão ou a entrada. Como um acampamento não precisa ter um portão construído, “entrada” comunica naturalmente o ponto de acesso delimitado pelo contexto.
- source_word: מִי לַיהוָה
  choice: Quem está do lado de Yahweh
  rationale: A frase nominal significa literalmente “Quem [é] para Yahweh?”. “Está do lado de” preserva o sentido contextual de lealdade sem transformar a pergunta em declaração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלָי
  choice: venha até mim
  rationale: O hebraico traz apenas “a mim!”, uma convocação elíptica. O verbo “venha” explicita em português o movimento necessariamente subentendido.
- source_word: וַיִּיֵּאָסְפוּ
  choice: se reuniram
  rationale: O nifal de אסף indica ajuntar-se ou reunir-se; a forma pronominal é idiomática e neutra em português.
- source_word: אֵלָיו
  choice: ao redor dele
  rationale: Embora אֶל denote normalmente movimento em direção a alguém, com o verbo “reunir-se” o português natural favorece “ao redor dele”; a nota preserva a correspondência mais literal “até ele”.
- source_word: כָּל בְּנֵי לֵוִי
  choice: todos os filhos de Levi
  rationale: Mantém a expressão tribal masculina explícita do hebraico, sem reduzi-la ao equivalente mais genérico “levitas”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino. “Yahweh” o preserva como nome e evita substituí-lo por um título.
- issue: Sentido de lealdade em מִי לַיהוָה
  choice: Quem está do lado de Yahweh
  alternative: Quem pertence a Yahweh?; Quem é por Yahweh?
  rationale: A formulação escolhida exprime a convocação para manifestar lealdade no contexto, sem impor a ideia mais forte de posse contida em “pertence”.
- issue: Designação tribal בְּנֵי לֵוִי
  choice: todos os filhos de Levi
  alternative: todos os levitas
  rationale: Preserva o modo genealógico e masculino pelo qual o texto identifica o grupo, enquanto a nota oferece o equivalente coletivo corrente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a força narrativa e a convocação direta; as notas registram a elipse hebraica e as alternativas mais literais.
