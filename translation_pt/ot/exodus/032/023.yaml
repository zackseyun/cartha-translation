base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: pt
  text: 'E eles me disseram[a]: «Faça para nós deuses que vão adiante de nós, porque este Moisés, o homem que nos tirou da terra do Egito, não sabemos o que aconteceu com ele.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Faça para nós um deus que vá adiante de nós». Embora este versículo empregue um substantivo plural acompanhado de verbo plural («deuses ... vão»), alguns traduzem a ideia no singular por causa da imagem do bezerro no contexto.'
    reason: Leitura alternativa decorrente da amplitude semântica de אֱלֹהִים e do contexto narrativo.
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: E eles me disseram
  rationale: O wayyiqtol dá continuidade à narrativa; a formulação preserva a sequência e explicita o destinatário com naturalidade em português.
- source_word: עֲשֵׂה לָנוּ
  choice: Faça para nós
  rationale: Preserva tanto o imperativo de עשה quanto a nuance dativa de לָנוּ, em linguagem corrente.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: Embora o substantivo possa ter sentido singular ou plural, o verbo plural יֵלְכוּ favorece fortemente o plural neste versículo.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: que vão adiante de nós
  rationale: Expressa a ideia de seguir à frente como guia. O presente do subjuntivo é natural em português após o pedido e não elimina a orientação prospectiva da frase.
- source_word: כִּי
  choice: pois
  rationale: Introduz a justificativa do pedido de modo claro e digno, preservando a força causal.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: quanto a esse Moisés, o homem
  rationale: ‘Esse Moisés’ conserva o tom potencialmente distanciador do demonstrativo; ‘quanto a’ integra a construção à sintaxe natural do português sem apagar sua ênfase.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: que nos tirou da terra do Egito
  rationale: Comunica naturalmente o Hifil de עלה no contexto do êxodo e mantém a expressão completa ‘terra do Egito’.
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: não sabemos o que aconteceu com ele
  rationale: O perfeito descreve um estado presente resultante; esta formulação traduz com clareza o idioma hebraico sobre o destino ou paradeiro de alguém.
theological_decisions:
- issue: Se אֱלֹהִים deve ser traduzido no singular ou no plural no relato de Arão
  choice: 'plural: “deuses”'
  alternative: 'singular: “um deus”'
  rationale: O verbo plural יֵלְכוּ favorece decisivamente a leitura plural neste versículo. A tradução mantém a tensão com o bezerro singular do contexto, em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o plural gramatical do hebraico e registra em nota a leitura singular contextual.
