reference: Exodus 32:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Vá, desça, pois o seu povo, que você fez subir da terra do Egito, corrompeu-se[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiu de modo corrupto”. O verbo hebraico também pode ser traduzido com ênfase na conduta corrupta, em vez de na corrupção resultante.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... disse
  rationale: A forma narrativa com waw faz a ação avançar; “Então” expressa essa sequência com naturalidade, e “disse” é idiomático em português para introduzir fala direta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֶךְ רֵד
  choice: Vá, desça
  rationale: Conserva os dois imperativos hebraicos, literalmente “vá, desça”, e transmite a urgência da ordem sem fundi-los.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira natural, em português, a razão da ordem dada a Moisés.
- source_word: שִׁחֵת
  choice: corrompeu-se
  rationale: Expressa a corrupção moral culpável do povo no contexto do bezerro de ouro, preservando a força destrutiva do verbo; a alternativa comportamental é registrada em nota.
- source_word: עַמְּךָ
  choice: o seu povo
  rationale: Mantém o substantivo coletivo e o possessivo dirigido a Moisés, cuja força retórica é significativa no contexto.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: que você fez subir
  rationale: Reproduz o sentido causativo de העלה e conserva a imagem espacial associada ao êxodo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Reflete explicitamente אֶרֶץ e permanece claro e natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Força contextual de שִׁחֵת
  choice: corrompeu-se
  alternative: agiu de modo corrupto
  rationale: A leitura escolhida comunica a ruína moral produzida pelo próprio pecado do povo, enquanto a nota preserva a possibilidade de dar maior ênfase ao comportamento corrupto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna explícita a segunda pessoa singular dirigida a Moisés. A formulação “Vá, desça” mantém a sequência incomum dos dois imperativos do hebraico, e “fez subir” preserva a imagem do texto-fonte.
