base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: pt
  text: No dia seguinte, levantaram-se cedo, ofereceram holocaustos e apresentaram sacrifícios de paz. Depois, o povo se sentou para comer e beber e se levantou para entregar-se à folia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para brincar” ou “para festejar”. O verbo hebraico pode indicar brincadeira, celebração ou folia; neste contexto, sugere uma festividade desordenada, e não uma diversão inocente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: levantaram-se cedo
  rationale: O hifil de שׁכם normalmente indica levantar-se cedo. A formulação é natural em português e mantém a ênfase temporal.
- source_word: מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Indica o dia posterior aos acontecimentos anteriores; esta é a forma corrente e clara em português moderno.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: ofereceram holocaustos
  rationale: No contexto sacrificial, עלה com עֹלָה refere-se à oferta inteiramente queimada. “Holocaustos” preserva a categoria cultual tradicional sem ampliar o sentido.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: apresentaram ofertas de comunhão
  rationale: נגשׁ significa aqui trazer ou apresentar, e שְׁלָמִים designa sacrifícios associados à paz, integridade e refeição compartilhada. “Ofertas de comunhão” comunica melhor sua função em português moderno, embora “ofertas de paz” seja uma alternativa tradicional.
- source_word: וַיֵּשֶׁב הָעָם
  choice: o povo se sentou
  rationale: ישׁב significa sentar-se e, nesta sequência narrativa, introduz naturalmente a refeição.
- source_word: לֶאֱכֹל וְשָׁתוֹ
  choice: para comer e beber
  rationale: Os infinitivos expressam a atividade ou finalidade de modo direto e idiomático.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: se levantou para festejar
  rationale: צחק pode significar brincar, divertir-se, celebrar ou participar de folguedo. “Festejar” preserva a dimensão celebrativa e permite que o contexto dê à ação sua conotação desordenada, sem especificar conduta sexual não exigida pelo versículo.
theological_decisions:
- issue: Nuance de לְצַחֵק no episódio do bezerro de ouro
  choice: para festejar
  alternative: para brincar; para se divertir; para entregar-se à folia
  rationale: O contexto de culto idolátrico, banquete e juízo sugere mais que uma diversão inocente, mas o verbo isoladamente não exige uma referência sexual explícita. A tradução mantém a tensão lexical e a nota esclarece a amplitude sem resolver em excesso.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. “Holocaustos” mantém a terminologia sacrificial consolidada; “ofertas de comunhão” torna clara a natureza relacional dos שְׁלָמִים. A concordância no singular em “o povo se sentou... e se levantou” segue o uso natural do substantivo coletivo em português.
