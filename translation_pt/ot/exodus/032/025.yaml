  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: pt
  text: Quando Moisés viu que o povo estava sem controle — pois Arão o havia deixado sem controle[a], como motivo de escárnio entre seus adversários[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem freio” ou “desenfreado”. O hebraico repete a mesma raiz para descrever o estado do povo e a ação de Arão.
    reason: lexical_alternative
  - marker: b
    text: Ou “como motivo de desprezo entre os que se levantavam contra eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא מֹשֶׁה
  choice: Quando Moisés viu
  rationale: O wayyiqtol dá continuidade à narrativa; “quando” liga naturalmente a observação de Moisés à ação que vem em seguida no contexto.
- source_word: הָעָם
  choice: o povo
  rationale: Neste contexto, עָם designa a comunidade israelita reunida no acampamento.
- source_word: כִּי פָרֻעַ הוּא
  choice: que o povo estava sem controle
  rationale: A forma de פרע descreve a perda de contenção ou disciplina. “Sem controle” comunica o estado de desordem em português atual sem restringir o sentido a nudez ou libertinagem.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: pois Arão o havia deixado sem controle
  rationale: O verbo repete a raiz פרע e atribui a Arão responsabilidade pelo estado do povo. A repetição de “sem controle” conserva essa ligação lexical sem afirmar que Arão pretendia produzir o resultado.
- source_word: לְשִׁמְצָה
  choice: para o escárnio
  rationale: שִׁמְצָה pode indicar escárnio, desprezo ou comentário difamatório. “Escárnio” é conciso, digno e preserva a força negativa do termo.
- source_word: בְּקָמֵיהֶם
  choice: de seus adversários
  rationale: O particípio de קום refere-se literalmente aos que se levantam contra eles; “adversários” expressa esse sentido de modo natural e sem pressupor necessariamente combate militar.
theological_decisions:
- issue: Nuance moral e social de פרע
  choice: sem controle
  alternative: sem freio; desenfreado; exposto ou nu
  rationale: A raiz envolve soltar, deixar sem restrição e, em certos contextos, expor. Aqui, o foco mais seguro é a desordem resultante da liderança de Arão; traduzir por “nu” ou “libertino” estreitaria indevidamente o sentido.
- issue: Relação expressa por לְשִׁמְצָה
  choice: para o escárnio de seus adversários
  alternative: como motivo de escárnio entre seus adversários; expondo-o ao desprezo de seus adversários
  rationale: A preposição לְ pode indicar resultado ou finalidade. A formulação mantém essa relação relativamente aberta, sem decidir se Arão buscou o escárnio ou se ele foi apenas a consequência.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição deliberada de “sem controle” reproduz a repetição da raiz hebraica. O travessão conserva a explicação parentética, e a vírgula final indica que a oração continua no versículo em seu contexto narrativo.
