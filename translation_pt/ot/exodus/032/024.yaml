  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: pt
  text: 'E eu lhes disse[a]: “Quem tiver ouro, tire-o.” Então eles me deram o ouro; eu o lancei no fogo, e saiu este bezerro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem tem ouro? Tire-o.” O hebraico diz literalmente: “Quem tem ouro? Removam-no.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu lhes disse
  rationale: Mantém a sequência narrativa do wayyiqtol e introduz naturalmente, em português, a fala relatada de Arão.
- source_word: לְמִי זָהָב
  choice: Quem tiver ouro
  rationale: A construção hebraica, literalmente “a quem há ouro?”, expressa posse de modo indefinido. “Quem tiver ouro” é natural em português e se ajusta à ordem dirigida ao grupo.
- source_word: הִתְפָּרָקוּ
  choice: tire-o
  rationale: O hitpael de פרק indica aqui remover de si os adornos de ouro. O pronome retoma coletivamente “ouro”, sem acrescentar um objeto não explicitado.
- source_word: וַיִּתְּנוּ לִי
  choice: Então eles me deram o ouro
  rationale: Explicita em português o objeto implícito retomado do contexto; “Então” comunica naturalmente a progressão narrativa.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: eu o lancei no fogo
  rationale: שלך significa lançar ou atirar; “lancei” oferece clareza e dignidade. “No fogo” expressa de forma idiomática o movimento para dentro dele.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: e saiu este bezerro
  rationale: Preserva a formulação direta e evasiva de Arão, além da ordem hebraica em que o verbo antecede o sujeito. “Bezerro” é a designação contextual estabelecida de עֵגֶל.
theological_decisions:
- issue: O relato evasivo de Arão sobre a origem do ídolo
  choice: Traduzir diretamente “e saiu este bezerro”, sem qualificar o acontecimento.
  alternative: Acrescentar termos como “por si só”, “milagrosamente” ou “supostamente”, ou parafrasear para denunciar explicitamente a falsidade.
  rationale: O texto registra as palavras de Arão e deixa que o contexto revele sua evasão. A tradução não deve transformar a ironia narrativa em comentário interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe preserva a sequência narrativa e a ironia do hebraico sem soar artificial. O marcador [a] aparece junto à fala que contém a construção hebraica ambígua.
