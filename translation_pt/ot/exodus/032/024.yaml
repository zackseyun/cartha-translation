  source_fidelity: 'O texto principal transmite com fidelidade a sequência hebraica: Arão diz ao povo que remova o ouro, recebe-o, lança-o no fogo e afirma que «saiu este bezerro». «Tire-o», «me deram o ouro», «lancei no fogo» e «saiu este bezerro» são escolhas adequadas e não acrescentam uma explicação para a alegação evasiva de Arão.'
