base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: pt
  text: Então todo o povo tirou as argolas de ouro que estavam em suas orelhas e as levou a Arão[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrancou” ou “removeu” as argolas de ouro. O verbo hebraico pode enfatizar uma retirada enérgica.
    reason: lexical_alternative
  - marker: b
    text: Ou “os brincos de ouro”. O termo hebraico traduzido por “argolas” pode designar adornos de orelha neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: tirou
  rationale: O hitpael de פרק indica aqui que o povo removeu de si os adornos. “Tirou” é natural em português e preserva o sentido reflexivo coletivo; a possível ideia de remoção enérgica é registrada em nota.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: A expressão designa coletivamente a comunidade reunida. “Todo o povo” é direta, idiomática e mantém a força abrangente do hebraico.
- source_word: נִזְמֵי הַזָּהָב
  choice: as argolas de ouro
  rationale: נֶזֶם designa uma argola ornamental que pode ser usada na orelha ou no nariz. “Argolas” preserva essa amplitude lexical, enquanto a oração seguinte especifica que estavam nas orelhas.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: que estavam em suas orelhas
  rationale: A oração relativa localiza as argolas. A formulação acompanha de perto o hebraico e é clara em português moderno.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: e as levou a Arão
  rationale: O verbo significa trazer ou levar até alguém. O pronome “as” retoma naturalmente “argolas”; o singular coletivo “levou” concorda com “todo o povo”.
