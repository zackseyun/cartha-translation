base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: pt
  text: 'Ele pegou o ouro das mãos deles, moldou-o com um instrumento de gravação[a] e fez dele um bezerro de metal fundido. Então disseram: “Estes são os seus deuses, Israel,[b][c] que fizeram você subir da terra do Egito”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um estilete” ou “com um cinzel”; o sentido exato do termo hebraico é discutido.
    reason: lexical_alternative
  - marker: b
    text: Algumas tradições textuais trazem “ele disse” em vez de “disseram”.
    reason: textual_variant
  - marker: c
    text: 'Hebraico: “Estes são os seus deuses”. Tradicionalmente, a frase também é traduzida como “Este é o seu deus”, provavelmente por referência à única imagem do bezerro.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: pegou o ouro das mãos deles
  rationale: לקח significa tomar ou receber. O objeto, omitido no hebraico por estar claro no contexto anterior, é explicitado como “o ouro” para evitar em português um pronome sem antecedente dentro do versículo.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: moldou-o com uma ferramenta de gravar
  rationale: יצר descreve formar ou moldar artesanalmente. חֶרֶט designa algum instrumento de gravação ou modelagem, mas sua identificação exata é discutida; a formulação ampla conserva essa incerteza.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: fez dele um bezerro de metal fundido
  rationale: עגל é “bezerro”, e מסכה indica uma imagem produzida por fundição. “De metal fundido” comunica naturalmente em português o processo de fabricação sem usar o pouco corrente “bezerro fundido”.
- source_word: וַיֹּאמְרוּ
  choice: Então disseram
  rationale: O texto massorético traz o verbo no plural. O sujeito fica naturalmente implícito em português, como no hebraico.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Estes são os seus deuses
  rationale: O demonstrativo e a forma nominal são morfologicamente plurais. A tradução mantém o plural apesar da tensão com a única imagem mencionada.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: que tiraram você da terra do Egito
  rationale: O hifil de עלה significa literalmente fazer subir e, no contexto do êxodo, expressa fazer sair ou tirar. “Tiraram você” é idiomático, conserva a concordância plural e mantém a expressão completa “da terra do Egito”.
theological_decisions:
- issue: Plural ou singular na aclamação ao ídolo
  choice: Estes são os seus deuses, Israel
  alternative: Este é o seu deus, Israel
  rationale: O Texto Massorético apresenta formas plurais. A tradução preserva essa formulação e a tensão com o único bezerro, sem harmonizá-la silenciosamente; a forma singular tradicional é registrada em nota.
- issue: Agência de Arão na fabricação
  choice: Atribuir diretamente a ele tanto o ato de moldar quanto o de fazer a imagem
  alternative: Apresentá-lo apenas como recebedor do ouro ou supervisor do processo
  rationale: Os verbos hebraicos no singular atribuem diretamente essas ações a Arão. A tradução não atenua nem amplia sua responsabilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por clareza na fala direta a Israel e evita tanto arcaísmos como “ó Israel” quanto terminologia excessivamente técnica. A coordenação verbal acompanha a sequência hebraica e deixa visível a dificuldade material entre moldar com ferramenta e produzir por fundição; a nota limita-se à incerteza lexical do instrumento.
