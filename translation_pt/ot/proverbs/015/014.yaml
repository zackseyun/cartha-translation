  text: The heart of the discerning seeks knowledge[a], but the face of fools feeds on folly.
translation:
  language: pt
  text: O coração de quem tem discernimento busca conhecimento, mas o rosto[a] dos tolos se alimenta de insensatez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “o rosto dos tolos”. Muitas traduções usam “a boca dos tolos”, entendendo “rosto” como referência à boca ou adotando uma formulação que combina mais diretamente com a imagem de alimentar-se.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem hebraica do centro interior do pensamento, da vontade e dos afetos, sem reduzi-la apenas à mente.
- source_word: נָבוֹן
  choice: quem tem discernimento
  rationale: Expressa de modo natural a pessoa caracterizada por entendimento e capacidade de discernir.
- source_word: יְבַקֶּשׁ
  choice: busca
  rationale: Comunica a procura ativa e intencional indicada pelo verbo.
- source_word: דָּעַת
  choice: conhecimento
  rationale: É o equivalente direto e apropriado ao vocabulário sapiencial de Provérbios.
- source_word: וּפְנֵי
  choice: mas o rosto
  rationale: Segue a leitura direta do Texto Massorético, que traz literalmente “rosto”, preservando a imagem incomum em vez de substituí-la silenciosamente por “boca”.
- source_word: כְסִילִים
  choice: dos tolos
  rationale: Mantém a categoria moral e intelectual típica da literatura sapiencial, em linguagem clara e corrente.
- source_word: יִרְעֶה
  choice: se alimenta de
  rationale: Reproduz naturalmente o sentido metafórico de pastar, alimentar-se ou nutrir-se de algo.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Designa a conduta e disposição contrárias à sabedoria; também evita uma repetição portuguesa pouco elegante de “tolos” e “tolice” sem perder a relação semântica.
theological_decisions: []
translation_notes:
