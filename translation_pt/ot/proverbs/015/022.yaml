  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָפֵ֣ר מַ֭חֲשָׁבוֹת בְּ/אֵ֣ין ס֑וֹד וּ/בְ/רֹ֖ב יוֹעֲצִ֣ים תָּקֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/022.yaml
  text: Plans fail for lack of counsel[a], but with many advisers they stand.
translation:
  language: pt
  text: Os planos fracassam por falta de aconselhamento[a], mas, com muitos conselheiros, eles se firmam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os planos são frustrados sem deliberação, mas, com muitos conselheiros, ficam estabelecidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵר
  choice: fracassam
  rationale: O hifil de פרר comunica a ideia de romper, frustrar ou fazer malograr. Com “planos” como sujeito em português, “fracassam” expressa naturalmente o resultado, sem excluir a alternativa mais formal “são frustrados”.
- source_word: מַחֲשָׁבוֹת
  choice: planos
  rationale: Embora o substantivo também possa significar “pensamentos” ou “intenções”, o paralelismo com conselheiros e com o ato de se firmar indica planos ou propósitos deliberados.
- source_word: בְּאֵין
  choice: por falta de
  rationale: A construção expressa ausência e, no contexto, tem força causal. “Por falta de” é natural e clara em português.
- source_word: סוֹד
  choice: aconselhamento
  rationale: סוֹד pode designar conversa reservada, conselho em grupo ou deliberação íntima. Aqui, o contraste com “muitos conselheiros” favorece o processo de consultar e deliberar, não a ideia de segredo.
- source_word: וּבְרֹב
  choice: mas, com muitos
  rationale: A conjunção introduz o contraste antitético, e רֹב indica multiplicidade. A formulação preserva de modo conciso a estrutura proverbial.
- source_word: יוֹעֲצִים
  choice: conselheiros
  rationale: O particípio ativo de יעץ se refere aos que dão conselho. “Conselheiros” é corrente, digno e adequado ao contexto sapiencial.
- source_word: תָּקוּם
  choice: eles se firmam
  rationale: קום significa levantar-se, permanecer ou ser estabelecido. Embora o verbo hebraico esteja no feminino singular, ele retoma coletivamente os planos; o plural explícito é natural em português. “Firmam-se” conserva a imagem de permanência e êxito sem tornar a expressão excessivamente técnica.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o paralelismo antitético e um tom sapiencial conciso. “Aconselhamento” evita reduzir סוֹד a um único conselho pontual e preserva sua nuance de consulta ou deliberação; a nota registra a alternativa mais formal.
