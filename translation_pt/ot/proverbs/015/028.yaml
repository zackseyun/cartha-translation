  text: לֵ֣ב צַ֭דִּיק יֶהְגֶּ֣ה לַ/עֲנ֑וֹת וּ/פִ֥י רְ֝שָׁעִ֗ים יַבִּ֥יעַ רָעֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/028.yaml
  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
translation:
  language: pt
  text: O coração do justo pondera como responder[a], mas a boca dos perversos derrama coisas más.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “medita antes de responder”. O verbo hebraico pode transmitir a ideia de meditar ou refletir; mais literalmente, a frase seria “pondera para responder”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Na literatura sapiencial hebraica, o coração representa a interioridade humana, incluindo pensamento e deliberação. A escolha preserva a imagem do original e é natural em português.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado designa de modo genérico a pessoa justa, sem necessidade de explicitar gênero além da forma convencional portuguesa.
- source_word: יֶהְגֶּה
  choice: pondera
  rationale: O verbo pode indicar meditar, refletir ou murmurar. Com o infinitivo 'responder', o contexto favorece a ideia de reflexão cuidadosa antes da fala; 'pondera' preserva essa nuance.
- source_word: לַעֲנוֹת
  choice: como responder
  rationale: O infinitivo com ל expressa a orientação da reflexão para a resposta. O acréscimo idiomático de 'como' torna clara a deliberação sem determinar indevidamente o conteúdo da resposta.
- source_word: וּפִי
  choice: mas a boca
  rationale: Embora ו seja formalmente 'e', o paralelismo antitético pede em português a conjunção adversativa 'mas'.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O plural substantivado indica a classe dos que agem com perversidade. 'Perversos' é atual, inteligível e mantém o contraste moral com 'o justo'.
- source_word: יַבִּיעַ
  choice: derrama
  rationale: O Hifil comunica a imagem de fazer brotar ou jorrar abundantemente. 'Derrama' mantém a vivacidade da metáfora e sugere fala copiosa e não refreada.
- source_word: רָעוֹת
  choice: coisas más
  rationale: O plural pode abranger males, conteúdos perversos ou palavras nocivas. 'Coisas más' preserva a amplitude e o número do hebraico sem restringir o sentido.
