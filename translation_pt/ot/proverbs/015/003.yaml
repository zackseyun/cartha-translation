  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/003.yaml
  text: In every place the eyes of Yahweh watch over the evil and the good[a].
translation:
  language: pt
  text: Em todo lugar, os olhos de Yahweh[a] observam os maus e os bons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma hebraica do nome divino e sua tradução tradicional.
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  choice: Em todo lugar
  rationale: Preserva o sentido distributivo da expressão hebraica e soa natural em português contemporâneo.
- source_word: עֵינֵי יְהוָה
  choice: os olhos de Yahweh
  rationale: Mantém explícita a relação construta e preserva a imagem antropomórfica do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צֹפוֹת
  choice: observam
  rationale: O particípio indica observação contínua; o presente simples português expressa naturalmente essa ação habitual sem acrescentar a ideia específica de proteção.
- source_word: רָעִים וְטוֹבִים
  choice: os maus e os bons
  rationale: Os adjetivos são substantivados e se referem a pessoas; esta formulação preserva a concisão e o contraste do provérbio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; usar “Yahweh” preserva o nome próprio, enquanto a nota registra a tradução tradicional.
- issue: Sentido de צֹפוֹת
  choice: observam
  alternative: velam por
  rationale: O verbo neste contexto afirma que ninguém escapa ao olhar divino. “Observam” preserva esse sentido sem resolver a expressão como cuidado protetor, nuance que “velam por” poderia sugerir.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura concisa e equilibrada do provérbio foi preservada.
