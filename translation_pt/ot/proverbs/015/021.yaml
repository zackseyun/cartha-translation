  text: אִ֭וֶּלֶת שִׂמְחָ֣ה לַ/חֲסַר לֵ֑ב וְ/אִ֥ישׁ תְּ֝בוּנָ֗ה יְיַשֶׁר לָֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/021.yaml
  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
translation:
  language: pt
  text: A insensatez é alegria para quem não tem juízo[a], mas o homem de entendimento endireita seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “falto de coração”, expressão que significa não ter bom senso ou discernimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Expressa o substantivo abstrato que designa a falta de sabedoria e a conduta insensata, em contraste com o entendimento.
- source_word: שִׂמְחָה
  choice: é alegria
  rationale: Preserva a construção nominal breve e enfática do hebraico.
- source_word: לַחֲסַר לֵב
  choice: para quem não tem juízo
  rationale: Comunica em português corrente o idiomatismo hebraico «falto de coração», que aqui indica carência de bom senso ou discernimento, não de emoção.
- source_word: אִישׁ תְּבוּנָה
  choice: o homem de entendimento
  rationale: Mantém o substantivo masculino explícito אִישׁ e traduz תְּבוּנָה pelo termo sapiencial amplo «entendimento».
- source_word: יְיַשֶׁר לָכֶת
  choice: endireita seu caminho
  rationale: Conserva a força causativa de ישר («tornar reto») e verte idiomaticamente o infinitivo «andar/ir» como metáfora do rumo da vida.
theological_decisions:
- issue: Linguagem masculina representativa
  choice: o homem de entendimento
  alternative: a pessoa que tem entendimento
  rationale: O segundo membro traz explicitamente אִישׁ («homem»). A tradução preserva essa forma masculina representativa sem restringir a aplicação universal do provérbio.
- issue: Agência na conduta do sábio
  choice: endireita seu caminho
  alternative: anda por um caminho reto
  rationale: A forma verbal hebraica é causativa e apresenta o homem de entendimento como alguém que torna reto o seu proceder; a tradução evita reduzir essa nuance à simples descrição de um caminhar reto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo conciso do provérbio e explica em nota o único hebraísmo que poderia ser entendido incorretamente.
