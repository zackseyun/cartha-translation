  text: תּוֹעֲבַ֣ת יְ֭הוָה מַחְשְׁב֣וֹת רָ֑ע וּ֝/טְהֹרִ֗ים אִמְרֵי נֹֽעַם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/026.yaml
  text: Evil plans are an abomination to Yahweh[b][a], but pleasant words are pure.
translation:
  language: pt
  text: Os planos maus são uma abominação para Yahweh, mas as palavras agradáveis são puras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: abomináveis
  rationale: Preserva a forte reprovação moral do termo hebraico e se integra naturalmente à construção predicativa em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַחְשְׁבוֹת רָע
  choice: planos maus
  rationale: מַחְשְׁבוֹת pode designar pensamentos, planos ou projetos; no contexto, “planos maus” comunica com naturalidade intenções concebidas para o mal, sem acrescentar um agente não expresso.
- source_word: וּטְהֹרִים
  choice: mas ... são puras
  rationale: A conjunção foi vertida como adversativa para explicitar o paralelismo antitético, e a ordem hebraica foi reorganizada para um português natural.
- source_word: אִמְרֵי נֹעַם
  choice: palavras agradáveis
  rationale: Reproduz de modo claro a construção “palavras de agradabilidade”, preservando o sentido de doçura ou prazer sem restringi-lo a “graciosas”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar outra forma tradicional de transliteração.
- issue: Natureza da pureza em טְהֹרִים
  choice: puras
  alternative: limpas
  rationale: “Puras” mantém aberta a dimensão moral e a ressonância de pureza do hebraico, sem limitar o adjetivo à limpeza física ou defini-lo exclusivamente em sentido ritual.
translation_notes:
  register: Português moderno, conciso e digno, com legibilidade brasileira e compreensão internacional. Mantém a antítese proverbial e evita formulações excessivamente literais como “pensamentos de mal” ou a ordem marcada “puras são as palavras agradáveis”.
