source:
  edition: WLC
  text: בֵּ֣ן חָ֭כָם יְשַׂמַּח אָ֑ב וּ/כְסִ֥יל אָ֝דָ֗ם בּוֹזֶ֥ה אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/020.yaml
  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
translation:
  language: pt
  text: O filho sábio alegra seu pai, mas o homem insensato[a] despreza sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pessoa insensata”; o hebraico diz literalmente “homem insensato” (כְסִיל אָדָם), empregando אָדָם para um indivíduo, não para a humanidade.
    reason: alternativa lexical e esclarecimento da referência individual
lexical_decisions:
- source_word: בֵּן
  choice: filho
  rationale: O substantivo hebraico está no singular masculino e forma um paralelo natural com o homem mencionado na segunda parte; “filho” preserva essa forma concreta.
- source_word: חָכָם
  choice: sábio
  rationale: Na literatura sapiencial, o termo abrange sabedoria prática e moral; “sábio” é a tradução mais direta e natural.
- source_word: יְשַׂמַּח
  choice: alegra
  rationale: A forma piel de שׂמח tem sentido causativo, “faz ficar alegre”; “alegra” expressa isso de modo conciso e corrente.
- source_word: אָב
  choice: seu pai
  rationale: Embora o hebraico diga literalmente “pai” sem sufixo, o possessivo é naturalmente inferido da relação com “filho” e é necessário para uma formulação idiomática em português.
- source_word: כְסִיל
  choice: insensato
  rationale: O termo descreve quem é moralmente obtuso e obstinado, não apenas alguém com pouca inteligência; “insensato” conserva o tom sapiencial e dignificado.
- source_word: אָדָם
  choice: homem
  rationale: Aqui אָדָם designa um indivíduo em paralelo com “filho”, e não a humanidade em geral; “homem” preserva a referência masculina do provérbio.
- source_word: בּוֹזֶה
  choice: despreza
  rationale: O particípio apresenta uma conduta característica de tratar alguém com desprezo; “despreza” mantém a força e a concisão do hebraico.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: O sufixo hebraico explicita a relação possessiva; “sua mãe” a reproduz naturalmente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com paralelismo conciso. Conservou-se a referência masculina concreta do hebraico. O marcador da nota foi colocado junto de “homem insensato”, expressão à qual a alternativa lexical efetivamente se refere.
