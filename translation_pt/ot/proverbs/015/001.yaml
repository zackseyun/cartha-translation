  text: מַֽעֲנֶה רַּ֭ךְ יָשִׁ֣יב חֵמָ֑ה וּ/דְבַר עֶ֝֗צֶב יַעֲלֶה אָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/001.yaml
  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
translation:
  language: pt
  text: Uma resposta branda afasta o furor, mas uma palavra que fere[a] desperta a ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma palavra dolorosa” ou “uma palavra dura”. A expressão hebraica significa literalmente “uma palavra de dor/sofrimento” e pode descrever uma fala que causa dor e, assim, provoca ira.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲנֶה
  choice: resposta
  rationale: O substantivo designa uma resposta dada em uma interação verbal; “resposta” é natural e conciso em português.
- source_word: רַךְ
  choice: branda
  rationale: O adjetivo significa “suave, brando”. “Branda” expressa aqui uma maneira calma e gentil de responder, em contraste com a fala que fere.
- source_word: יָשִׁיב
  choice: afasta
  rationale: A forma causativa de שוב comunica fazer o furor recuar ou desviar-se. “Afasta” preserva essa força e soa natural em português.
- source_word: חֵמָה
  choice: furor
  rationale: O termo denota ira intensa ou ardente. “Furor” conserva essa intensidade e mantém um registro proverbial digno.
- source_word: דְבַר עֶצֶב
  choice: uma palavra que fere
  rationale: A expressão é literalmente “palavra de dor/sofrimento” e pode indicar fala que causa dor. “Uma palavra que fere” comunica essa leitura em português natural, enquanto a nota preserva a ambiguidade lexical.
- source_word: יַעֲלֶה
  choice: desperta
  rationale: A forma causativa de עלה significa literalmente fazer subir; com “ira”, refere-se a fazê-la surgir ou intensificar-se. “Desperta” expressa essa relação de modo idiomático.
- source_word: אָף
  choice: ira
  rationale: Embora o sentido concreto do substantivo seja “nariz”, ele funciona aqui como expressão idiomática para a ira. “Ira” transmite claramente o sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com boa legibilidade brasileira e compreensão internacional. “Branda”, “furor” e “ira” preservam a dignidade poética sem tornar o verso arcaico. A colocação do marcador junto a “uma palavra que fere” esclarece corretamente o termo ao qual a nota lexical se refere.
