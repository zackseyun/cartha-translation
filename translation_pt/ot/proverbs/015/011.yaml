source:
  edition: WLC
  text: שְׁא֣וֹל וַ֭/אֲבַדּוֹן נֶ֣גֶד יְהוָ֑ה אַ֝֗ף כִּֽי לִבּ֥וֹת בְּֽנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/011.yaml
  text: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
translation:
  language: pt
  text: O Sheol e o Abadom[a] estão expostos diante de Yahweh; quanto mais os corações dos seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Destruição». «Abadom» pode designar a destruição ou o domínio da destruição.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «os filhos do ser humano», expressão que aqui se refere aos seres humanos em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos, sem reduzi-lo apenas à sepultura nem lhe impor uma concepção mais específica do além.
- source_word: אֲבַדּוֹן
  choice: Abadom
  rationale: Emprega a forma tradicional em português e preserva a força quase nominal do termo em paralelo com Sheol; uma nota registra o sentido lexical de destruição.
- source_word: נֶגֶד
  choice: estão expostos diante de
  rationale: Expressa não apenas posição diante de Yahweh, mas plena visibilidade e ausência de ocultamento, sentido exigido pelo argumento do provérbio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, preservando sua referência pactual.
- source_word: אַף כִּי
  choice: quanto mais
  rationale: 'Reproduz o argumento a fortiori: se até os domínios ocultos da morte estão expostos, com maior razão o interior humano.'
- source_word: לִבּוֹת
  choice: coração
  rationale: Conserva a metáfora antropológica hebraica para o íntimo da pessoa — pensamentos, intenções e vontade. O singular coletivo é mais idiomático em português neste enunciado geral.
- source_word: בְּנֵי אָדָם
  choice: seres humanos
  rationale: Comunica naturalmente em português o valor genérico do idioma hebraico, que se refere à humanidade em geral, sem sugerir apenas indivíduos do sexo masculino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; a transliteração Yahweh preserva o nome próprio sem substituí-lo por um título.
- issue: Tratamento de שְׁאוֹל e אֲבַדּוֹן
  choice: Sheol e Abadom
  alternative: o mundo dos mortos e a destruição
  rationale: A transliteração preserva o par hebraico e evita definir com excessiva precisão a natureza desses domínios; a nota oferece a alternativa lexical de Abadom.
- issue: Valor genérico de בְּנֵי אָדָם
  choice: seres humanos
  alternative: filhos do homem
  rationale: A expressão hebraica masculina é idiomática e abrange as pessoas em geral. A tradução natural explicita esse alcance sem alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se Sheol, Abadom e Yahweh por sua relevância textual e teológica; a sintaxe concisa conserva o paralelismo e a progressão lógica do provérbio.
