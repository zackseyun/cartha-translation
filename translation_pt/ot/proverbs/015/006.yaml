base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
translation:
  language: pt
  text: 'Na casa do justo há grande riqueza,

    mas na renda do perverso há perturbação.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas no produto, na colheita ou na renda do perverso há perturbação ou ruína”. O verbo hebraico pode expressar perturbação, aflição ou ruína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  choice: na casa do justo
  rationale: Preserva a imagem concreta da casa e o singular representativo do hebraico, podendo abranger também o lar e os bens do justo.
- source_word: חֹסֶן רָב
  choice: grande riqueza
  rationale: חֹסֶן pode indicar riqueza, tesouro ou recursos; com רָב, a expressão comunica abundância material de modo natural e sem reduzir o termo a um objeto específico.
- source_word: וּבִתְבוּאַת רָשָׁע
  choice: mas na renda do perverso
  rationale: A conjunção assume valor adversativo no paralelismo. תְבוּאָה designa produto, colheita ou rendimento; “renda” expressa aqui o resultado econômico em português corrente.
- source_word: נֶעְכָּרֶת
  choice: há perturbação
  rationale: O verbo עכר pode transmitir perturbação, aflição ou ruína. A construção existencial produz português claro, mantendo aberta a natureza exata do dano.
theological_decisions:
- issue: Natureza da consequência ligada à renda do perverso
  choice: há perturbação
  alternative: ela é arruinada / há desgraça
  rationale: O hebraico permite entender tanto uma condição de transtorno quanto um processo de dano ou ruína; a tradução não especifica uma causalidade ou doutrina de retribuição além do que o provérbio afirma.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo proverbial preservado. “Justo” e “perverso” mantêm o contraste moral tradicional sem explicitação denominacional; “renda” amplia naturalmente a imagem agrícola para o resultado econômico, enquanto a nota conserva as alternativas concretas e a ambiguidade verbal.
