id: PRO.15.29
reference: Proverbs 15:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
translation:
  language: pt
  text: Yahweh está longe dos maus, mas ouve a oração dos justos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוֹק
  choice: está longe
  rationale: Preserva a imagem hebraica de distância e, no contexto do paralelismo, comunica afastamento moral e relacional sem reduzi-lo a geografia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵרְשָׁעִים
  choice: dos maus
  rationale: Designa pessoas caracterizadas pela maldade. Esta formulação é concisa, natural e amplamente compreensível em português.
- source_word: וּתְפִלַּת
  choice: mas ... a oração
  rationale: Embora o hebraico use a conjunção simples, o paralelismo é antitético; “mas” explicita naturalmente esse contraste. תְּפִלָּה corresponde diretamente a “oração”.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: Mantém a designação coletiva típica da literatura sapiencial para pessoas caracterizadas pela justiça.
- source_word: יִשְׁמָע
  choice: ouve
  rationale: Traduz o sentido lexical de ouvir ou escutar. No contexto da oração, pode implicar atenção favorável, mas evita explicitar a ideia mais forte de que necessariamente responde.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido da distância de Yahweh em relação aos maus
  choice: Distância moral e relacional
  alternative: Ausência espacial absoluta ou incapacidade de percebê-los
  rationale: O adjetivo “longe”, contrastado com o ato de ouvir a oração dos justos, exprime falta de atenção favorável e separação relacional; a tradução não transforma isso em ausência metafísica.
- issue: Sentido de ouvir a oração
  choice: ouve
  alternative: responde à oração
  rationale: O verbo שׁמע pode sugerir acolhimento favorável neste contexto, mas “ouve” conserva a formulação hebraica e não resolve além do texto a relação entre ouvir e responder.
translation_notes:
  register: Português moderno, digno e direto, com leitura natural no Brasil e compreensão internacional. O paralelismo antitético foi preservado em uma única frase concisa. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
