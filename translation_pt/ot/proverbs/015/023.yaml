  text: שִׂמְחָ֣ה לָ֭/אִישׁ בְּ/מַעֲנֵה פִ֑י/ו וְ/דָבָ֖ר בְּ/עִתּ֣/וֹ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
translation:
  language: pt
  text: O homem se alegra com a resposta que dá,[a] e uma palavra no tempo certo[b] — como é boa!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Para o homem há alegria na resposta de sua boca”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em seu tempo”; também pode ser traduzido por “na hora oportuna”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: se alegra
  rationale: O substantivo expressa alegria ou satisfação. A construção verbal é mais natural em português e mantém o sentido de que a pessoa sente alegria por sua resposta.
- source_word: לָאִישׁ
  choice: O homem
  rationale: אִישׁ está no singular masculino e tem aqui valor representativo. A formulação preserva essa forma sem tornar a frase artificial.
- source_word: בְּמַעֲנֵה פִיו
  choice: com a resposta que dá
  rationale: מַעֲנֶה é uma resposta, e פִיו significa literalmente “sua boca”. A tradução principal verte o idioma hebraico em português corrente, deixando a forma mais literal na nota.
- source_word: וְדָבָר
  choice: e uma palavra
  rationale: No paralelismo com “resposta”, דָבָר designa naturalmente algo dito. “Palavra” conserva a concisão proverbial.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: A expressão significa literalmente “em seu tempo” e, no contexto, comunica adequação e oportunidade.
- source_word: מַה־טּוֹב
  choice: como é boa!
  rationale: Reproduz a exclamação hebraica e concorda naturalmente com “palavra” em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A primeira oração foi tornada idiomática sem apagar a construção hebraica, registrada na nota; a segunda mantém a concisão e a força exclamativa do provérbio.
