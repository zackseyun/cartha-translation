base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/018.yaml
  text: A hot-tempered man stirs up strife[c][b][a], but one who is slow to anger quiets a dispute.
translation:
  language: pt
  text: O homem irascível provoca discórdia, mas quem é lento para se irar acalma a discussão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acalma uma briga”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֵמָה
  choice: o homem irascível
  rationale: A expressão caracteriza literalmente um homem dado à ira. “Irascível” preserva a forma masculina singular e comunica de modo conciso um temperamento propenso à cólera.
- source_word: יְגָרֶה
  choice: provoca
  rationale: O piel de גרה indica incitar ou atiçar. “Provoca” expressa com naturalidade que essa pessoa faz surgir ou intensifica o conflito.
- source_word: מָדוֹן
  choice: discórdia
  rationale: O termo designa contenda ou conflito. “Discórdia” é claro, corrente e adequado ao paralelismo proverbial.
- source_word: אֶרֶך אַפַּיִם
  choice: quem demora a irar-se
  rationale: O idioma hebraico, literalmente “longo de narinas”, descreve alguém que não se entrega rapidamente à ira. A formulação mantém explícita a relação com a ira e soa natural em português.
- source_word: יַשְׁקִיט
  choice: acalma
  rationale: 'O hifil de שקט tem sentido causativo: fazer sossegar ou aquietar. “Acalma” comunica claramente esse efeito.'
- source_word: רִיב
  choice: discussão
  rationale: O substantivo pode indicar disputa, contenda, discussão ou litígio. Neste contexto sapiencial interpessoal, “discussão” evita restringir o sentido ao âmbito jurídico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura antitética concisa. “Irascível” mantém o caráter proverbial sem recorrer a linguagem excessivamente coloquial; “demora a irar-se” torna transparente o idioma hebraico.
