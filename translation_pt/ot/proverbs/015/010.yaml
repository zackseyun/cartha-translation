id: PRO.15.10
reference: Proverbs 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מוּסָ֣ר רָ֭ע לְ/עֹזֵ֣ב אֹ֑רַח שׂוֹנֵ֖א תוֹכַ֣חַת יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
translation:
  language: pt
  text: Há disciplina severa[a] para quem abandona o caminho[b]; quem odeia a repreensão morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplina dura”. O adjetivo hebraico também pode significar “má” ou “ruim”, mas aqui provavelmente descreve a dolorosa severidade da disciplina.
    reason: lexical_alternative
  - marker: b
    text: Ou “a vereda”. No hebraico, trata-se de uma metáfora sapiencial comum para o curso moral da vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסָר
  choice: disciplina
  rationale: O termo abrange instrução corretiva e disciplina. Neste contexto, em paralelo com a rejeição da repreensão, destaca-se seu aspecto corretivo, possivelmente punitivo.
- source_word: רָע
  choice: severa
  rationale: Embora o adjetivo normalmente possa significar “má” ou “ruim”, aqui qualifica a disciplina destinada a quem abandona o caminho; “severa” comunica sua dureza sem sugerir que a própria correção seja moralmente perversa.
- source_word: לְעֹזֵב
  choice: para quem abandona
  rationale: A preposição indica a pessoa a quem a disciplina se destina, e o particípio descreve de modo geral aquele que deixa o curso correto.
- source_word: אֹרַח
  choice: o caminho
  rationale: Preserva a metáfora sapiencial comum para o curso moral da vida e soa natural em português.
- source_word: שׂוֹנֵא
  choice: quem odeia
  rationale: O particípio tem sentido genérico; esta formulação reproduz a máxima proverbial em português atual.
- source_word: תוֹכַחַת
  choice: repreensão
  rationale: Designa censura ou correção verbal. “Repreensão” mantém distinção adequada em relação a מוּסָר, traduzido como “disciplina”.
- source_word: יָמוּת
  choice: morrerá
  rationale: Mantém de forma direta a força do verbo hebraico e apresenta a consequência como advertência proverbial.
theological_decisions:
- issue: Natureza da morte anunciada no provérbio
  choice: morrerá
  alternative: perecerá; acabará em ruína; morrerá fisicamente
  rationale: O verbo hebraico não especifica aqui se a morte é física, moral ou escatológica. A tradução conserva o termo simples e não resolve a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da primeira oração foi ajustada com “Há” para produzir uma frase natural sem perder a relação expressa no hebraico. O paralelismo e a advertência direta do provérbio foram preservados.
