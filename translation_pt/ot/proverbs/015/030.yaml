  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
translation:
  language: pt
  text: A luz dos olhos alegra o coração[a]; uma boa notícia revigora até os ossos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O brilho dos olhos”, isto é, um olhar alegre ou radiante.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “engorda o osso”; a expressão retrata vigor e renovação que alcançam o corpo inteiro.'
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר עֵינַיִם
  choice: A luz dos olhos
  rationale: Preserva a imagem concreta e a relação construta do hebraico, sem decidir se se trata do brilho de um olhar alegre ou da luz percebida pelos olhos.
- source_word: יְשַׂמַּח לֵב
  choice: alegra o coração
  rationale: Mantém o sentido causativo do piel de שׂמח e o coração como centro da vida interior na antropologia hebraica.
- source_word: שְׁמוּעָה טוֹבָה
  choice: uma boa notícia
  rationale: Expressão corrente em português para uma informação ou notícia favorável.
- source_word: תְּדַשֶּׁן עָצֶם
  choice: revigora até os ossos
  rationale: Comunica em português natural o efeito de vigor profundo da metáfora hebraica de tornar gordo ou viçoso o osso; 'até' explicita idiomaticamente a profundidade corporal sem mudar o referente.
