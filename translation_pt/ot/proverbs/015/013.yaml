  text: לֵ֣ב שָׂ֭מֵחַ יֵיטִ֣ב פָּנִ֑ים וּ/בְ/עַצְּבַת לֵ֝ב ר֣וּחַ נְכֵאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/013.yaml
  text: A joyful heart makes the face cheerful[b][a], but by the sorrow of the heart the spirit is crushed.
translation:
  language: pt
  text: O coração alegre torna o rosto radiante[a], mas, pela tristeza do coração, o espírito fica abatido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alegra o rosto”. O hebraico diz literalmente “torna bom o rosto”, uma expressão sobre a melhora da aparência ou expressão exterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o espírito é esmagado” ou “fica quebrantado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Em Provérbios, o termo designa a pessoa interior, incluindo emoções e disposição. “Coração” é natural em português e preserva o paralelismo com “espírito”.
- source_word: שָׂמֵחַ
  choice: alegre
  rationale: Expressa um estado de contentamento ou alegria e forma, em português corrente, a combinação natural “coração alegre”.
- source_word: יֵיטִב פָּנִים
  choice: torna o rosto radiante
  rationale: O hifil de יטב significa tornar bom ou melhorar; com “rosto”, a expressão indica que a alegria interior melhora ou ilumina a expressão exterior. A tradução conserva a causatividade e a imagem concreta.
- source_word: וּבְעַצְּבַת לֵב
  choice: mas, pela tristeza do coração
  rationale: 'O contexto antitético favorece “mas”. A preposição ב pode ter sentido causal ou instrumental: a tristeza interior causa o abatimento do espírito.'
- source_word: רוּחַ
  choice: espírito
  rationale: Refere-se à disposição ou força interior da pessoa, não ao vento nem necessariamente à respiração. “Espírito” preserva a amplitude antropológica do hebraico.
- source_word: נְכֵאָה
  choice: fica abatido
  rationale: O adjetivo descreve um espírito ferido, quebrantado ou esmagado. “Abatido” é natural em português e comunica uma condição interior profundamente enfraquecida sem exceder a evidência lexical.
