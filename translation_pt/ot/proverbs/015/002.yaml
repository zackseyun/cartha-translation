source:
  edition: WLC
  text: לְשׁ֣וֹן חֲ֭כָמִים תֵּיטִ֣יב דָּ֑עַת וּ/פִ֥י כְ֝סִילִ֗ים יַבִּ֥יעַ אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/002.yaml
  text: The tongue of the wise makes knowledge good[b][a], but the mouth of fools pours out folly.
translation:
  language: pt
  text: A língua dos sábios torna agradável o conhecimento[a], mas a boca dos tolos derrama insensatez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “usa bem o conhecimento”, “adorna o conhecimento” ou “apresenta bem o conhecimento”. O verbo hebraico é causativo (“faz bom”) e pode indicar tanto o uso proveitoso do conhecimento quanto a maneira adequada ou atraente de apresentá-lo.
    reason: lexical_alternative
  - marker: b
    text: Ou “faz jorrar” ou “faz borbulhar”. O verbo hebraico retrata algo que sai ou se espalha em abundância.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן
  choice: a língua
  rationale: Mantém a imagem concreta do órgão da fala, em paralelo com “a boca” no segundo verso.
- source_word: חֲכָמִים
  choice: dos sábios
  rationale: Expressa a classe de pessoas caracterizadas pela sabedoria sem especificar gênero.
- source_word: תֵּיטִיב
  choice: torna agradável
  rationale: Preserva de modo natural em português a força causativa de יטב (“fazer bom”), indicando que a fala sábia dá ao conhecimento uma forma boa, proveitosa ou atraente; a nota registra outras leituras possíveis.
- source_word: דָּעַת
  choice: o conhecimento
  rationale: É o sentido usual de דָּעַת na literatura sapiencial e mantém o contraste conceitual com “insensatez”.
- source_word: וּפִי
  choice: mas a boca
  rationale: O waw é traduzido adversativamente por causa do contraste entre os dois membros; “boca” conserva a imagem corporal paralela a “língua”.
- source_word: כְסִילִים
  choice: dos tolos
  rationale: Tradução corrente do termo sapiencial para pessoas moral e intelectualmente insensatas.
- source_word: יַבִּיעַ
  choice: derrama
  rationale: Reproduz a imagem de algo que jorra ou transborda em abundância, sugerindo fala incontida.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Termo natural e digno para a qualidade e as manifestações próprias do tolo em Provérbios.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva o paralelismo concreto entre “língua” e “boca” e mantém, por meio da nota, a ambiguidade semântica do verbo תֵּיטִיב.
