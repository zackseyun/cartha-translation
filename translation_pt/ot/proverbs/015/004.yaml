base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/004.yaml
  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
translation:
  language: pt
  text: A língua que traz cura é árvore de vida[a], mas a perversidade nela é uma fratura no espírito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A língua saudável é árvore de vida”; מַרְפֵּא pode indicar cura, saúde ou caráter salutar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mas a tortuosidade nela é uma ruptura no espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְפֵּא
  choice: que traz cura
  rationale: Expressa o sentido de cura, remédio ou saúde e produz em português uma construção natural, sem reduzi-lo a mera brandura.
- source_word: לָשׁוֹן
  choice: língua
  rationale: Mantém a imagem concreta hebraica e sua função metonímica de fala.
- source_word: עֵץ חַיִּים
  choice: árvore de vida
  rationale: Preserva a expressão sapiencial e sua ressonância intertextual sem identificá-la obrigatoriamente com uma única árvore específica.
- source_word: סֶלֶף
  choice: perversidade
  rationale: Comunica a ideia de distorção ou tortuosidade moral da fala, sem restringi-la apenas ao engano.
- source_word: בָּהּ
  choice: nela
  rationale: Retoma naturalmente o substantivo feminino “língua” e conserva a ligação pronominal do hebraico.
- source_word: שֶׁבֶר
  choice: quebra
  rationale: Mantém a metáfora nominal de fratura, ruptura ou colapso, em linguagem portuguesa corrente.
- source_word: בְּרוּחַ
  choice: o espírito
  rationale: Neste contexto sapiencial, refere-se mais naturalmente ao espírito humano, isto é, à vida interior da pessoa.
theological_decisions:
- issue: Referente de רוּחַ
  choice: espírito humano / vida interior
  alternative: Espírito divino
  rationale: O contraste trata dos efeitos restauradores ou destrutivos da fala na experiência humana; o contexto favorece o espírito da pessoa, não o Espírito Santo.
- issue: Relação sintática de שֶׁבֶר בְּרוּחַ
  choice: quebra o espírito
  alternative: é uma fratura no espírito
  rationale: A formulação verbal é natural em português e comunica o efeito destrutivo, enquanto a nota preserva a construção nominal e locativa mais formal do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A imagem de “língua” e a expressão “árvore de vida” foram mantidas; “que traz cura” evita a expressão pouco natural “língua curadora” sem perder o sentido restaurador do hebraico.
