base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/024.yaml
  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: pt
  text: O caminho da vida leva o prudente para cima, para que ele se afaste do Sheol abaixo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sheol: termo hebraico para o domínio dos mortos.'
    reason: Esclarece um termo transliterado cuja amplitude não corresponde exatamente a “inferno” ou “sepultura”.
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: O caminho da vida
  rationale: Expressa naturalmente a imagem hebraica de uma rota ou modo de viver que conduz à vida.
- source_word: לְמַשְׂכִּיל
  choice: o prudente
  rationale: O particípio descreve quem age com entendimento e discernimento; “prudente” é claro, corrente e adequado ao vocabulário sapiencial.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Translitera o termo hebraico para preservar sua amplitude sem identificá-lo automaticamente com inferno, sepultura ou um estado final específico.
- source_word: לְמַעְלָה / מָטָּה
  choice: para cima / lá embaixo
  rationale: Mantém o contraste espacial enfático do hebraico entre a direção ascendente da vida e o Sheol abaixo.
theological_decisions:
- issue: Relação sintática de לְמַעְלָה com לְמַשְׂכִּיל
  choice: “conduz para cima o prudente”
  alternative: “é para cima para o prudente”
  rationale: A formulação portuguesa torna inteligível o sentido direcional sem eliminar a imagem nem acrescentar um destino não expresso.
- issue: Força de לְמַעַן
  choice: “para que”
  alternative: “a fim de que” / “de modo que”
  rationale: Preserva a relação de propósito, possivelmente também resultativa, entre o caminho ascendente e o afastamento do Sheol.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando o paralelismo vertical do original.
