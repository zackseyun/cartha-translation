base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/019.yaml
  text: The way of the lazy is like a hedge of thorns[a], but the path of the upright is a raised highway.
translation:
  language: pt
  text: O caminho do preguiçoso é como uma cerca de espinhos, mas a vereda dos íntegros é uma estrada elevada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é plana” ou “está livre de obstáculos”. O termo hebraico pode indicar uma estrada construída ou elevada e, por extensão, um caminho plano e desimpedido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Preserva tanto a imagem concreta quanto o sentido proverbial de modo de viver ou proceder.
- source_word: עָצֵל
  choice: o preguiçoso
  rationale: Expressa de forma corrente a pessoa caracterizada pela preguiça habitual, sem recorrer a vocabulário arcaico.
- source_word: כִּמְשֻׂכַת
  choice: é como uma cerca
  rationale: O prefixo כְּ introduz a comparação, e o substantivo designa uma cerca viva ou barreira; “cerca” mantém a imagem compacta.
- source_word: חָדֶק
  choice: de espinhos
  rationale: Designa vegetação espinhosa ou um espinheiro e comunica com clareza a ideia de impedimento doloroso.
- source_word: אֹרַח
  choice: vereda
  rationale: É quase sinônimo de דֶּרֶךְ; “vereda” conserva o campo metafórico do percurso e oferece variação natural em português.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: Indica pessoas moralmente retas. “Íntegros” comunica o sentido ético sem restringi-lo à ideia forense de justiça.
- source_word: סְלֻלָה
  choice: é uma estrada elevada
  rationale: A forma deriva de סלל, verbo associado a erguer, aterrar ou preparar uma estrada. “Estrada elevada” preserva a imagem concreta de uma via construída e desimpedida, sem ocultar a possível extensão semântica de caminho plano ou livre.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A estrutura paralela do hebraico foi preservada, bem como o contraste entre o percurso obstruído do preguiçoso e o caminho preparado dos íntegros.
