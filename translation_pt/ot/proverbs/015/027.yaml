base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/027.yaml
  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
translation:
  language: pt
  text: Quem é ávido por ganho desonesto traz problemas para sua casa, mas quem odeia subornos[a] viverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “presentes” ou “dádivas”; neste contexto, o sentido provável é “subornos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹכֵר
  choice: causa transtorno
  rationale: O particípio de עכר indica causar perturbação, calamidade ou dano. “Causa transtorno” conserva a relação de causa e efeito sem ampliar o sentido para destruição total.
- source_word: בֵּיתוֹ
  choice: à sua própria casa
  rationale: בַּיִת pode designar a casa, a família ou todo o círculo doméstico. A formulação mantém a imagem hebraica e permite a extensão natural ao lar e à família.
- source_word: בּוֹצֵעַ בָּצַע
  choice: é ávido por ganhos desonestos
  rationale: A construção cognata de verbo e substantivo enfatiza a busca gananciosa de lucro, e בֶּצַע frequentemente traz conotação de ganho indevido. A tradução expressa tanto a avidez quanto a censura moral do contexto.
- source_word: וְשׂוֹנֵא
  choice: mas quem odeia
  rationale: Embora וְ possa significar simplesmente “e”, o paralelismo antitético favorece “mas”, que comunica naturalmente o contraste em português.
- source_word: מַתָּנוֹת
  choice: subornos
  rationale: O sentido básico é “presentes” ou “dádivas”, mas neste contexto de ganho indevido o termo provavelmente se refere a presentes usados para corromper ou influenciar, isto é, subornos. A amplitude lexical é preservada em nota.
- source_word: יִחְיֶה
  choice: viverá
  rationale: A forma verbal pode abranger sobrevivência, vida preservada e prosperidade. “Viverá” mantém a concisão e a abertura semântica do hebraico.
