  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
translation:
  language: pt
  text: O caminho do perverso é abominação para Yahweh[a], mas ele ama quem busca a justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh detesta o caminho do perverso.”'
    reason: Alternativa idiomática que transforma o predicado nominal hebraico em uma construção verbal sem alterar sua forte avaliação negativa.
  - marker: b
    text: 'Ou: “a retidão”.'
    reason: O hebraico צְדָקָה pode indicar justiça, retidão ou aquilo que é correto.
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: abominação
  rationale: Preserva a forte condenação expressa pelo substantivo hebraico, que designa algo moral ou cultualmente repugnante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Mantém a imagem recorrente da literatura sapiencial para a conduta e o modo de viver.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Representa o singular genérico hebraico sem restringir a referência ao sexo masculino; descreve a pessoa caracterizada pela perversidade.
- source_word: מְרַדֵּף
  choice: quem busca
  rationale: Expressa de modo natural o particípio substantivado e sua ideia de empenho contínuo, embora 'persegue' seja uma correspondência mais literal.
- source_word: צְדָקָה
  choice: a justiça
  rationale: Abrange aqui a conformidade com o que é reto e justo; 'retidão' também é possível e destaca mais diretamente a integridade moral.
- source_word: יֶאֱהָב
  choice: ele ama
  rationale: O imperfeito expressa uma verdade geral proverbial, adequadamente vertida pelo presente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não um título. A transliteração preserva essa distinção textual.
- issue: Alcance do masculino singular genérico
  choice: o perverso / quem busca a justiça
  alternative: o homem perverso / o homem que busca a justiça
  rationale: As formas masculinas singulares têm valor representativo no provérbio; a redação escolhida conserva esse alcance geral sem impor uma limitação exclusivamente masculina.
- issue: Sentido de צְדָקָה
  choice: justiça
  alternative: retidão
  rationale: O termo pode abranger tanto a conduta moralmente reta quanto a ordem justa. 'Justiça' preserva essa amplitude, e a nota registra a alternativa legítima.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo entre o caminho do perverso e a pessoa que busca a justiça, além de manter explícito Yahweh como sujeito de “ama”.
