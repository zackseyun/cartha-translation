  text: ט֤וֹב אֲרֻחַ֣ת יָ֭רָק וְ/אַהֲבָה שָׁ֑ם מִ/שּׁ֥וֹר אָ֝ב֗וּס וְ/שִׂנְאָה בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/017.yaml
  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
translation:
  language: pt
  text: Melhor é uma refeição de verduras onde há amor do que um boi cevado em meio ao ódio[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um boi alimentado no estábulo”; a expressão hebraica pode enfatizar tanto a alimentação no estábulo quanto o estado cevado resultante.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e ódio nele”; provavelmente se refere à refeição ou ao ambiente da casa marcado pelo ódio.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: No paralelismo comparativo com מִן, o adjetivo tem sentido idiomático de superioridade; a construção preserva a concisão proverbial.
- source_word: אֲרֻחַת יָרָק
  choice: uma refeição de verduras
  rationale: אֲרֻחָה designa uma refeição ou porção de alimento, e יָרָק refere-se a vegetais verdes comestíveis; a expressão é clara e natural em português.
- source_word: וְאַהֲבָה שָׁם
  choice: onde há amor
  rationale: Traduz naturalmente a expressão hebraica concisa, literalmente 'e amor ali', relacionando o amor ao ambiente da refeição.
- source_word: מִשּׁוֹר אָבוּס
  choice: do que um boi cevado
  rationale: שׁוֹר é 'boi', e אָבוּס pode descrever o animal alimentado no estábulo ou o resultado dessa alimentação, isto é, cevado; a alternativa é registrada em nota.
- source_word: וְשִׂנְאָה בוֹ
  choice: acompanhado de ódio
  rationale: Expressa em português natural a ideia literal de 'e ódio nele/com ele', sem determinar de modo excessivo se o referente é o boi, a refeição ou o ambiente doméstico; a ambiguidade é esclarecida em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura comparativa e a concisão do provérbio foram preservadas; as duas ambiguidades lexicais genuínas são mantidas por meio de notas.
