- from: Melhor é uma refeição de verduras onde há amor do que um boi cevado acompanhado de ódio[a][b].
  to: Melhor é uma refeição de verduras onde há amor do que um boi cevado em meio ao ódio[a][b].
  rationale: A revisão substitui uma construção que faz o ódio acompanhar diretamente o boi por «em meio ao ódio», que mantém a qualidade hostil do contexto sem resolver além do necessário o referente de בוֹ. As demais escolhas estão adequadas e as notas preservam as ambiguidades lexicais relevantes.
