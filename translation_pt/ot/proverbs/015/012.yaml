  text: לֹ֣א יֶאֱהַב לֵ֭ץ הוֹכֵ֣חַֽ ל֑/וֹ אֶל חֲ֝כָמִ֗ים לֹ֣א יֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
translation:
  language: pt
  text: O zombador não ama quem o corrige; não irá aos sábios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: zombador
  rationale: Em Provérbios, designa uma pessoa que trata os outros e a correção com desprezo e escárnio. “Zombador” é atual, claro e preserva esse sentido ativo.
- source_word: יֶאֱהַב
  choice: não ama
  rationale: Mantém o sentido comum e direto do verbo hebraico, sem intensificá-lo para “odeia” nem enfraquecê-lo para “não gosta”.
- source_word: הוֹכֵחַ לוֹ
  choice: quem o corrige
  rationale: O particípio indica a pessoa que lhe dirige correção ou repreensão. A formulação é natural em português e conserva a função corretiva sem sugerir dureza excessiva.
- source_word: אֶל חֲכָמִים
  choice: aos sábios
  rationale: A preposição indica movimento ou aproximação, e o plural substantivado refere-se à classe das pessoas sábias. “Aos sábios” é idiomático e preserva a forma masculina plural do hebraico sem limitar necessariamente a referência aos homens.
- source_word: לֹא יֵלֵךְ
  choice: não irá
  rationale: Neste contexto, הלך significa ir ou aproximar-se. O futuro traduz bem a recusa ou indisposição caracterizadora expressa pelo yiqtol proverbial.
theological_decisions:
- issue: Abrangência de gênero de חֲכָמִים
  choice: aos sábios
  alternative: às pessoas sábias
  rationale: Embora o hebraico empregue o masculino plural, o uso sapiencial provavelmente é genérico. Em português, “os sábios” pode igualmente designar a categoria em geral, preservando de modo conciso a forma e a intenção do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela e a repetição da negação do hebraico foram preservadas. Não se acrescentou nota, pois as alternativas relevantes podem ser representadas adequadamente no texto sem perda importante de ambiguidade.
