  text: שִׂפְתֵ֣י חֲ֭כָמִים יְזָ֣רוּ דָ֑עַת וְ/לֵ֖ב כְּסִילִ֣ים לֹא כֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/007.yaml
  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
translation:
  language: pt
  text: Os lábios dos sábios espalham conhecimento[a], mas o coração dos tolos não é assim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dispersam conhecimento”. O verbo hebraico evoca o ato de espalhar ou dispersar.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é elíptico; literalmente: “mas o coração dos tolos, não assim”. Pelo contraste, entende-se que os tolos não difundem conhecimento como os sábios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: os lábios dos
  rationale: Mantém a imagem concreta dos lábios e expressa naturalmente em português a relação construta com “sábios”.
- source_word: חֲכָמִים
  choice: sábios
  rationale: O adjetivo substantivado plural designa uma classe de pessoas, sem necessidade de explicitar gênero.
- source_word: יְזָרוּ
  choice: espalham
  rationale: O verbo זרה traz a imagem de dispersar ou espalhar; com “conhecimento” como objeto, “espalham” é natural e preserva a metáfora.
- source_word: דָעַת
  choice: conhecimento
  rationale: É a correspondência direta e usual para דַּעַת na literatura sapiencial.
- source_word: לֵב
  choice: o coração dos
  rationale: Preserva um termo central de Provérbios, referente ao interior da pessoa, incluindo pensamento e disposição.
- source_word: כְּסִילִים
  choice: tolos
  rationale: Termo corrente para pessoas moralmente insensatas ou obstinadas no contexto sapiencial.
- source_word: לֹא כֵן
  choice: não é assim
  rationale: Conserva a formulação hebraica breve e elíptica sem acrescentar uma ação que o texto não explicita.
theological_decisions:
- issue: Sentido da oração elíptica וְלֵב כְּסִילִים לֹא כֵן
  choice: mas o coração dos tolos não é assim
  alternative: mas o coração dos tolos não espalha conhecimento
  rationale: A tradução escolhida preserva a ambiguidade e a concisão do hebraico, enquanto a alternativa explicitaria uma ação apenas inferida do paralelismo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem proverbial e as imagens concretas de “lábios” e “coração” foram preservadas.
