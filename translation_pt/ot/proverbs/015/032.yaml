  text: פּוֹרֵ֣עַ מ֭וּסָר מוֹאֵ֣ס נַפְשׁ֑/וֹ וְ/שׁוֹמֵ֥עַ תּ֝וֹכַ֗חַת ק֣וֹנֶה לֵּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/032.yaml
  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: pt
  text: Quem rejeita a disciplina despreza a si mesmo, mas quem escuta a repreensão adquire entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פּוֹרֵעַ
  choice: rejeita
  rationale: O particípio descreve quem se esquiva da disciplina ou a deixa de lado; “rejeita” expressa essa recusa de modo natural e direto.
- source_word: מוּסָר
  choice: disciplina
  rationale: Abrange instrução corretiva e formação moral, sentido bem preservado por “disciplina”.
- source_word: מֹאֵס נַפְשׁוֹ
  choice: despreza a si mesmo
  rationale: Mantém a formulação reflexiva do hebraico; נֶפֶשׁ aqui se refere à própria pessoa ou vida, não apenas à alma como entidade distinta.
- source_word: תּוֹכַחַת
  choice: repreensão
  rationale: Designa correção verbal que expõe o erro; “repreensão” conserva a força do termo.
- source_word: קֹנֶה לֵּב
  choice: adquire entendimento
  rationale: Literalmente, “adquire coração”; no uso sapiencial, “coração” é o centro do discernimento. A tradução comunica naturalmente a aquisição de bom senso ou entendimento.
theological_decisions:
- issue: Sentido de נַפְשׁוֹ
  choice: a si mesmo
  alternative: sua alma / sua vida
  rationale: O contexto apresenta o dano causado à própria pessoa por rejeitar a correção; evita impor uma leitura antropológica dualista.
- issue: Expressão קֹנֶה לֵּב
  choice: adquire entendimento
  alternative: adquire coração / ganha entendimento
  rationale: Preserva o sentido sapiencial da expressão sem transformar a metáfora hebraica em formulação obscura em português.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O paralelismo antitético e a concisão proverbial foram preservados.
