  text: טוֹב מְ֭עַט בְּ/יִרְאַ֣ת יְהוָ֑ה מֵ/אוֹצָ֥ר רָ֝֗ב וּ/מְה֥וּמָה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/016.yaml
  text: Better is a little with the fear of Yahweh than great treasure with turmoil[a].
translation:
  language: pt
  text: Melhor é ter pouco com o temor de Yahweh do que ter um grande tesouro com inquietação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e perturbação com ele” ou “e confusão nele”. O termo hebraico pode indicar inquietação, tumulto, perturbação ou confusão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Melhor é ter pouco
  rationale: A construção proverbial sem verbo estabelece uma comparação. Em português natural, “Melhor é ter pouco” comunica o sentido idiomático sem reduzir טוֹב a apenas “bom”.
- source_word: בְּיִרְאַת יְהוָה
  choice: com o temor de Yahweh
  rationale: A preposição indica circunstância ou acompanhamento. “Temor” preserva a expressão teológica característica da literatura sapiencial, sem restringi-la por paráfrase a mero medo ou apenas reverência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo tetragrama, em conformidade com a camada de consulta fornecida.
- source_word: מֵאוֹצָר רָב
  choice: do que um grande tesouro
  rationale: A preposição מִן marca a comparação, e אוֹצָר רָב designa um tesouro ou riqueza acumulada de grande vulto.
- source_word: וּמְהוּמָה בוֹ
  choice: acompanhado de inquietação
  rationale: מְהוּמָה abrange agitação, perturbação, confusão ou desassossego. “Inquietação” expressa de modo natural o estado perturbador ligado ao tesouro, enquanto “acompanhado de” representa a relação indicada por בוֹ.
theological_decisions:
- issue: Sentido de “temor de Yahweh” na literatura sapiencial
  choice: Manter “o temor de Yahweh” no texto principal
  alternative: “a reverência por Yahweh” ou “o profundo respeito por Yahweh”
  rationale: A formulação preserva a ressonância canônica e a amplitude da expressão hebraica, que envolve reverência, submissão piedosa e consciência da autoridade divina, sem equipará-la simplesmente a terror.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação conserva o paralelismo proverbial e a ambiguidade lexical de מְהוּמָה por meio da nota.
