  text: כָּל יְמֵ֣י עָנִ֣י רָעִ֑ים וְ/טֽוֹב לֵ֝֗ב מִשְׁתֶּ֥ה תָמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/015.yaml
  text: All the days of the afflicted are bad[b][a], but a cheerful heart is a continual feast.
translation:
  language: pt
  text: Todos os dias do aflito[a] são difíceis, mas quem é alegre de coração[b] tem um banquete contínuo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do pobre” ou “do oprimido”; o termo hebraico pode se referir a quem é pobre, necessitado, afligido ou oprimido.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “bom de coração”; a expressão hebraica descreve uma disposição interior positiva, aqui em contraste com a aflição.
    reason: literal_rendering
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Todos os dias
  rationale: Preserva a imagem hebraica e expressa naturalmente a totalidade dos dias da pessoa.
- source_word: עָנִי
  choice: do aflito
  rationale: O termo pode indicar alguém pobre, necessitado, oprimido ou afligido; “aflito” mantém aqui a amplitude da condição sem restringi-la à pobreza econômica.
- source_word: רָעִים
  choice: são difíceis
  rationale: No contexto, o adjetivo caracteriza os dias como penosos ou ruins, não como moralmente maus; “difíceis” comunica isso com naturalidade em português.
- source_word: וְטוֹב לֵב
  choice: mas quem tem o coração alegre
  rationale: A expressão hebraica, literalmente relacionada a ser “bom de coração”, descreve neste contraste uma disposição interior alegre. A formulação evita que “bom coração” seja entendido apenas como bondade moral.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: O substantivo designa uma festa ou banquete; “banquete” preserva a imagem concreta de abundância e celebração.
- source_word: תָמִיד
  choice: contínuo
  rationale: Transmite a ideia de algo constante ou permanente e se combina naturalmente com “banquete”.
