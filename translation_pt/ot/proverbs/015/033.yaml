source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה מוּסַ֣ר חָכְמָ֑ה וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
translation:
  language: pt
  text: O temor de Yahweh é instrução em sabedoria[a], e antes da honra está a humildade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O temor de Yahweh é a disciplina da sabedoria”. O termo hebraico traduzido como “instrução” também pode ter o sentido de disciplina corretiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: Mantém o sentido pleno de temor reverente característico da literatura sapiencial e preserva o nome divino expresso no hebraico.
- source_word: מוּסַר חָכְמָה
  choice: instrução para a sabedoria
  rationale: מוּסָר abrange instrução formativa e disciplina corretiva; a formulação portuguesa expressa que o temor de Yahweh educa para a sabedoria sem eliminar a nuance disciplinar.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente corrente e adequado ao vocabulário central de Provérbios.
- source_word: וְלִפְנֵי כָבוֹד
  choice: e antes da honra
  rationale: לִפְנֵי indica aqui precedência temporal ou lógica; 'honra' comunica melhor que 'glória' a estima ou exaltação em vista neste contexto sapiencial.
- source_word: עֲנָוָה
  choice: vem a humildade
  rationale: O substantivo designa humildade ou condição humilde. Como a oração hebraica não traz verbo expresso, 'vem' produz em português uma sentença natural e preserva a relação de precedência.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o caráter de nome próprio e segue a decisão teológica fornecida, sem substituí-lo por um título.
- issue: Natureza do temor de Yahweh
  choice: temor
  alternative: reverência
  rationale: '''Temor'' conserva a amplitude e a tensão do hebraico, que inclui reverência e assombro sem ser reduzido a mera deferência.'
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem do segundo membro foi mantida próxima do paralelismo hebraico: antes da honra vem a humildade.'
