  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
translation:
  language: pt
  text: O ouvido que escuta a repreensão que conduz à vida permanecerá entre os sábios[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O ouvido que escuta a repreensão da vida habitará entre os sábios». O verbo hebraico significa literalmente «passar a noite» ou «hospedar-se» e é usado aqui de modo figurado para permanecer ou habitar entre os sábios.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser traduzida como «repreensão da vida» ou «repreensão para a vida», isto é, correção que leva à vida ou a preserva.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  choice: o ouvido
  rationale: Preserva a metonímia hebraica, na qual o ouvido representa a pessoa receptiva; a imagem também é natural em português.
- source_word: שֹׁמַעַת
  choice: que escuta
  rationale: O particípio indica uma disposição contínua e receptiva, mais que a simples percepção auditiva.
- source_word: תּוֹכַחַת
  choice: repreensão
  rationale: Expressa a advertência corretiva de caráter moral própria da literatura sapiencial, em linguagem atual e digna.
- source_word: חַיִּים
  choice: que conduz à vida
  rationale: Explicita de modo natural a provável força relacional da construção hebraica, sem ocultar na nota as alternativas formais «da vida» e «para a vida».
- source_word: בְּקֶרֶב
  choice: entre
  rationale: Traduz de forma concisa e idiomática a ideia de estar no meio de um grupo.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O adjetivo plural substantivado designa uma categoria de pessoas sem necessidade de marcar gênero masculino em sentido exclusivo.
- source_word: תָּלִין
  choice: permanecerá
  rationale: Comunica o sentido figurado contextual do verbo, literalmente «passará a noite» ou «se hospedará», indicando associação ou residência estável entre os sábios.
