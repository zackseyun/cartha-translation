reference: Proverbs 15:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
translation:
  language: pt
  text: 'O sacrifício dos maus é uma abominação para Yahweh,

    mas a oração dos íntegros lhe agrada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tem o seu favor» ou «é aceitável para ele». O substantivo hebraico pode indicar prazer, favor ou aceitação.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: sacrifício
  rationale: Designa uma oferta sacrificial; «sacrifício» é natural em português e mantém o contraste proverbial com «oração».
- source_word: רְשָׁעִים
  choice: os maus
  rationale: O adjetivo substantivado plural designa pessoas moralmente culpadas; «os maus» é claro, conciso e acessível.
- source_word: תּוֹעֲבַת
  choice: abominável
  rationale: Preserva a forte ideia de algo repugnante a Deus, formando em português uma construção mais natural que o substantivo abstrato «abominação» neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: תְפִלַּת
  choice: a oração
  rationale: Mantém o singular representativo e a relação construta «a oração dos».
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: Comunica a retidão moral do termo hebraico e evita confundi-lo com um sentido exclusivamente forense de «justos».
- source_word: רְצוֹנוֹ
  choice: lhe agrada
  rationale: Expressa de modo natural que a oração é objeto do prazer, favor ou aceitação de Yahweh, sem eliminar a amplitude lexical; as alternativas constam na nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido de רְצוֹנוֹ na segunda oração
  choice: lhe agrada
  alternative: recebe o seu favor; é aceitável para ele
  rationale: A oração nominal hebraica admite prazer, favor ou aceitação. «Lhe agrada» mantém a antítese forte com «abominável», enquanto a nota preserva as demais possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem antitética e o paralelismo do provérbio foram preservados; o pronome «lhe» retoma Yahweh de maneira natural.
