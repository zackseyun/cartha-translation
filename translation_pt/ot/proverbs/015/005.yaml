id: PRO.15.5
reference: Proverbs 15:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱוִ֗יל יִ֭נְאַץ מוּסַ֣ר אָבִ֑י/ו וְ/שֹׁמֵ֖ר תּוֹכַ֣חַת יַעְרִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/005.yaml
  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
translation:
  language: pt
  text: 'O insensato despreza a disciplina de seu pai,

    mas quem acolhe a repreensão age com prudência.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas quem guarda a repreensão torna-se prudente”. O verbo hebraico traduzido por “acolhe” significa literalmente “guarda” ou “observa”; o verbo final também pode significar “torna-se prudente” ou “mostra-se perspicaz”.'
    reason: Alternativas lexicais que preservam a amplitude semântica dos dois verbos hebraicos.
lexical_decisions:
- source_word: אֱוִיל
  choice: o insensato
  rationale: Termo sapiencial que descreve alguém moral e praticamente insensato, não apenas alguém com pouca inteligência. “Insensato” é natural e digno em português.
- source_word: יִנְאַץ
  choice: despreza
  rationale: Expressa rejeição com desdém, mais forte que uma simples recusa.
- source_word: מוּסַר
  choice: a disciplina
  rationale: Em Provérbios, abrange formação, correção e instrução; “disciplina” preserva bem o contexto paterno.
- source_word: אָבִיו
  choice: de seu pai
  rationale: Mantém a referência masculina explícita do hebraico, sem neutralizá-la.
- source_word: וְשֹׁמֵר
  choice: mas quem acolhe
  rationale: O sentido literal é “guardar” ou “observar”; no contexto, indica receber e levar a sério a repreensão. “Acolhe” comunica essa resposta ativa em português natural.
- source_word: תּוֹכַחַת
  choice: a repreensão
  rationale: Designa correção verbal ou censura; “repreensão” é corrente e apropriado ao registro sapiencial.
- source_word: יַעְרִם
  choice: age com prudência
  rationale: O verbo pode indicar tornar-se prudente ou mostrar perspicácia. Esta formulação conserva a nuance de conduta prudente sem sugerir astúcia maliciosa.
theological_decisions:
- issue: Linguagem parental marcada por gênero
  choice: de seu pai
  alternative: de seus pais / de seu progenitor
  rationale: O texto hebraico menciona especificamente o pai; a tradução preserva essa particularidade.
- issue: Estado ou manifestação de prudência no verbo יַעְרִם
  choice: age com prudência
  alternative: torna-se prudente / mostra-se perspicaz
  rationale: O hebraico admite a ideia de adquirir ou demonstrar prudência. A tradução principal expressa a manifestação prática, enquanto a nota preserva as demais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo antitético foi preservado. “Insensato”, “disciplina” e “repreensão” mantêm o registro sapiencial sem arcaísmo excessivo.
