  text: בֵּ֣ית גֵּ֭אִים יִסַּ֥ח יְהוָ֑ה וְ֝/יַצֵּ֗ב גְּב֣וּל אַלְמָנָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
translation:
  language: pt
  text: Yahweh derruba[a] a casa dos orgulhosos, mas firma a divisa da viúva[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arranca a casa dos orgulhosos”. O verbo hebraico pode transmitir a ideia de remover ou arrancar, e não apenas de demolir.
    reason: lexical_alternative
  - marker: b
    text: Ou “estabelece o limite da viúva” ou “firma o marco da viúva”. A imagem é a de Yahweh protegendo os direitos de propriedade de uma pessoa vulnerável.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: casa
  rationale: Preserva a imagem concreta do hebraico e também pode sugerir, pelo contexto, a família, o patrimônio ou a posição duradoura dos orgulhosos.
- source_word: גֵּאִים
  choice: os orgulhosos
  rationale: Designa pessoas soberbas ou arrogantes; “orgulhosos” é claro, natural e apropriado ao contraste da literatura sapiencial.
- source_word: יִסַּח
  choice: derruba
  rationale: O verbo comunica remoção violenta e pode incluir a ideia de arrancar. Com “casa”, “derruba” exprime naturalmente sua força destrutiva, sem excluir a alternativa indicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְיַצֵּב
  choice: mas firma
  rationale: A forma causativa expressa estabelecer ou tornar firme. “Mas” explicita o contraste antitético do provérbio entre o juízo sobre os orgulhosos e a proteção da viúva.
- source_word: גְּבוּל
  choice: o limite da propriedade
  rationale: O substantivo pode indicar fronteira, divisa territorial ou marco delimitador. A formulação torna clara a imagem fundiária no contexto da proteção de uma pessoa vulnerável.
- source_word: אַלְמָנָה
  choice: a viúva
  rationale: Mantém o singular representativo do hebraico e a categoria social vulnerável em vista.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Iavé; SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem o substituir por um título.
- issue: Valor da conjunção ו antes de יַצֵּב
  choice: mas
  alternative: e
  rationale: 'Embora a conjunção hebraica seja normalmente aditiva, o paralelismo é antitético: a destruição da casa dos orgulhosos contrasta com a proteção da propriedade da viúva.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Casa” conserva a concisão e a amplitude da imagem hebraica; “limite da propriedade” esclarece a referência à divisa territorial sem eliminar as alternativas mais literais, registradas em nota.
