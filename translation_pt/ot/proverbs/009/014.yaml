  text: and sits at the doorway of her house[a], on a seat at the heights of the city,
translation:
  language: pt
  text: 'e se senta à entrada de sua casa,

    num assento nos lugares altos da cidade,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשְׁבָה
  choice: e se senta
  rationale: O Qal perfeito na descrição poética pode ter força presente e vívida. “Se senta” retrata a Loucura personificada em sua postura contínua e torna explícito em português o sujeito já dado pelo contexto.
- source_word: לְפֶתַח
  choice: à entrada
  rationale: פֶּתַח designa abertura ou entrada. “À entrada” é natural, concreto e não pressupõe uma porta física fechada.
- source_word: בֵּיתָהּ
  choice: de sua casa
  rationale: בַּיִת refere-se aqui ao edifício ou local físico; “casa” conserva melhor essa imagem do que “lar”.
- source_word: עַל כִּסֵּא
  choice: num assento
  rationale: עַל é locativo, e כִּסֵּא pode indicar assento, cadeira ou trono. “Num assento” expressa a posição sem introduzir necessariamente uma imagem régia.
- source_word: מְרֹמֵי קָרֶת
  choice: nos lugares altos da cidade
  rationale: O plural construto מְרֹמֵי indica os pontos elevados, e קָרֶת designa cidade. A formulação preserva a localização elevada e pública e ecoa a descrição paralela da Sabedoria em Provérbios 9:3.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem poética natural. Mantém-se a descrição no presente e o paralelismo espacial do capítulo. Não se acrescenta nota para “trono”, pois a alternativa lexical não altera de modo necessário a leitura teológica e “assento” preserva adequadamente a amplitude contextual.
