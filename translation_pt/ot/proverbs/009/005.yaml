  yaml_path: translation/ot/proverbs/009/005.yaml
  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
translation:
  language: pt
  text: Venham[a], comam do meu pão e bebam do vinho que misturei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vão, comam do meu pão”. O verbo hebraico significa literalmente “ir”, mas, neste contexto de convite, funciona como uma convocação: “Venham”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que preparei”. O verbo hebraico se refere especificamente a misturar vinho, provavelmente com água ou especiarias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: Embora o verbo signifique literalmente “ir/andar”, neste convite feito pela Sabedoria funciona idiomaticamente como uma convocação para que os ouvintes se aproximem. “Venham” comunica naturalmente essa força em português.
- source_word: לַחֲמוּ
  choice: comam
  rationale: O verbo לחם II significa “comer” neste contexto, em paralelo com “bebam” e tendo “meu pão” como complemento.
- source_word: בְלַחֲמִי
  choice: do meu pão
  rationale: A preposição ב tem sentido partitivo com o verbo “comer”. “Comam do meu pão” preserva de modo natural o convite a participar do alimento preparado pela Sabedoria.
- source_word: וּשְׁתוּ
  choice: e bebam
  rationale: Imperativo coordenado com o anterior; a formulação mantém o paralelismo do verso.
- source_word: בְּיַיִן
  choice: do vinho
  rationale: Com “beber”, a preposição pode ser expressa em sentido partitivo como “do vinho”, em paralelo com “do meu pão”.
- source_word: מָסָכְתִּי
  choice: que misturei
  rationale: O verbo designa a mistura ou preparação do vinho, possivelmente com água ou especiarias. “Misturei” é a tradução mais direta e evita especificar ingredientes não declarados.
theological_decisions:
- issue: Natureza das imagens do convite da Sabedoria
  choice: Manter as imagens concretas do pão e do vinho sem expansão alegórica.
  alternative: Interpretar o pão e o vinho sacramentalmente ou transformar a refeição explicitamente em metáfora de instrução.
  rationale: O hebraico apresenta a Sabedoria personificada convidando pessoas para uma refeição preparada. A tradução conserva essa imagem e deixa suas possíveis ressonâncias teológicas abertas à interpretação.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural inclusivos e naturais. A estrutura paralela do hebraico é preservada por “comam do meu pão” e “bebam do vinho”. Os marcadores de nota aparecem no texto principal.
