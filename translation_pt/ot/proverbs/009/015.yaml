  text: 'to call to those passing by on the road[a], who are going straight on their paths:'
translation:
  language: pt
  text: 'para chamar os que passam pela estrada[a], os que seguem em frente por suas veredas:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que endireitam suas veredas”. O particípio hebraico pode destacar tanto o ato de seguir diretamente em frente como o de manter reto o próprio caminho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: para chamar
  rationale: O infinitivo construto expressa finalidade no contexto mais amplo. “Chamar” preserva a ação vocal e pública sem acrescentar uma nuance ausente do verbo.
- source_word: לְעֹבְרֵי דָרֶךְ
  choice: os que passam pela estrada
  rationale: Mantém a força verbal do particípio e a imagem concreta de pessoas em trânsito.
- source_word: דָרֶךְ
  choice: estrada
  rationale: Neste contexto, designa a via pela qual os transeuntes passam e permite distingui-la de אֹרְחוֹת, traduzido como “veredas”.
- source_word: הַמְיַשְּׁרִים
  choice: os que seguem em frente
  rationale: O particípio de ישר com “suas veredas” pode indicar avançar diretamente ou manter reto o próprio curso. A formulação comunica o movimento sem eliminar a alternativa causativa.
- source_word: אֹרְחוֹתָם
  choice: por suas veredas
  rationale: “Veredas” conserva a imagem de percurso e a possível ressonância moral própria da literatura sapiencial; a preposição produz em português uma expressão natural com “seguem em frente”.
