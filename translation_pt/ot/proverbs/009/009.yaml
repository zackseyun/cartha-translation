base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/009.yaml
  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
translation:
  language: pt
  text: Dê ao sábio[a], e ele se tornará ainda mais sábio; ensine o justo[b], e ele aumentará seu saber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “Dê instrução ao sábio”. No hebraico, o objeto de “dê” não é expresso.
    reason: lexical_alternative
  - marker: b
    text: “O justo” traduz a forma masculina singular do hebraico, usada aqui de modo representativo, como é comum em Provérbios.
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן
  choice: Dê
  rationale: O imperativo de נתן significa literalmente “dar”. Mantê-lo sem objeto preserva a concisão e a elipse deliberada do hebraico; o contexto permite entender que se dá ensino ou instrução.
- source_word: לְחָכָם
  choice: ao sábio
  rationale: חָכָם designa uma pessoa sábia. “Ao sábio” é natural em português e conserva o singular masculino representativo típico de Provérbios.
- source_word: וְיֶחְכַּם עוֹד
  choice: e ele se tornará ainda mais sábio
  rationale: A forma verbal de חכם, acompanhada de עוֹד, expressa crescimento adicional em sabedoria. A formulação comunica claramente esse aumento.
- source_word: הוֹדַע
  choice: ensine
  rationale: O imperativo no hifil de ידע significa “faça saber”. No contexto pedagógico da literatura sapiencial, “ensine” transmite naturalmente essa força.
- source_word: לְצַדִּיק
  choice: o justo
  rationale: צַדִּיק significa “justo” ou “reto”. O substantivo adjetival “o justo” preserva o paralelismo com “o sábio” e o singular representativo.
- source_word: וְיוֹסֶף לֶקַח
  choice: e ele aumentará seu saber
  rationale: יסף indica acrescentar ou aumentar, e לֶקַח se refere ao ensino recebido, aprendizado ou saber. “Aumentará seu saber” reproduz o sentido de aquisição adicional em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém a elipse do primeiro verbo e o paralelismo poético entre “o sábio” e “o justo”, evitando explicitar no texto principal aquilo que o hebraico deixa implícito.
