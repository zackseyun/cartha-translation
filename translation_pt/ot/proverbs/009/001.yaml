  text: חָ֭כְמוֹת בָּנְתָ֣ה בֵיתָ֑/הּ חָצְבָ֖ה עַמּוּדֶ֣י/הָ שִׁבְעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/001.yaml
  text: Wisdom has built her house[a]; she has hewn out her seven pillars.
translation:
  language: pt
  text: A Sabedoria construiu sua casa[a]; talhou suas sete colunas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, a palavra traduzida como «Sabedoria» tem forma plural, mas aqui vem acompanhada de verbos femininos no singular e funciona como uma personificação singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  choice: a Sabedoria
  rationale: Embora tenha forma morfológica plural, o substantivo rege aqui verbos femininos no singular e funciona como personificação singular. Em português, «a Sabedoria» preserva naturalmente tanto o sentido quanto a personificação.
- source_word: בָּנְתָה
  choice: construiu
  rationale: O perfeito hebraico apresenta a construção como concluída. O pretérito perfeito é natural em português e mantém esse aspecto completo.
- source_word: בֵיתָהּ
  choice: sua casa
  rationale: O sentido concreto de «casa» corresponde à imagem arquitetônica desenvolvida na segunda linha. «Lar» seria menos estrutural, e «família» alteraria a imagem.
- source_word: חָצְבָה
  choice: talhou
  rationale: O verbo descreve cortar ou lavrar material duro, muitas vezes pedra. «Talhou» comunica de modo corrente e preciso o trabalho arquitetônico, sem a estranheza de uma formulação como «escavou» neste contexto.
- source_word: עַמּוּדֶיהָ
  choice: suas colunas
  rationale: «Colunas» é o termo arquitetônico natural em português para os suportes de uma casa e combina bem com o ato de talhar. «Pilares» também é possível, mas pode sugerir elementos menos ornamentados e nem sempre talhados.
- source_word: שִׁבְעָה
  choice: sete
  rationale: O numeral é traduzido diretamente. Uma possível conotação de plenitude não deve substituir o número explícito no texto.
theological_decisions:
- issue: Personificação da sabedoria
  choice: Traduzir חָכְמוֹת como a personificação singular «a Sabedoria» e empregar pronomes possessivos compatíveis com o feminino em português.
  alternative: Explicitar como «a Senhora Sabedoria» ou reproduzir formalmente o plural como «sabedorias».
  rationale: Os verbos femininos no singular e os sufixos possessivos mostram que a forma plural funciona aqui como uma personagem singular. «Senhora Sabedoria» acrescentaria uma designação ausente do hebraico, enquanto «sabedorias» prejudicaria o sentido sintático e literário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem poética e o paralelismo foram preservados sem recorrer a vocabulário arcaico.
