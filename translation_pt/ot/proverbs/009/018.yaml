  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
translation:
  language: pt
  text: Mas ele não sabe que os mortos estão ali[a], que seus convidados estão nas profundezas do Sheol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as sombras estão ali”. O hebraico רְפָאִים refere-se aos mortos, aos que partiram e estão no Sheol.
    reason: Alternativa lexical para רְפָאִים que preserva sua imagem tradicional sem reduzir a clareza do texto principal.
lexical_decisions:
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção com a negação estabelece um forte contraste com a percepção ingênua do homem seduzido no versículo anterior.
- source_word: יָדַע
  choice: ele não sabe
  rationale: O qatal descreve aqui um estado presente de desconhecimento; esta formulação é natural e direta em português.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que ele não sabe.
- source_word: רְפָאִים
  choice: os mortos
  rationale: Neste contexto sapiencial, o termo designa os mortos que estão no Sheol, e não o povo dos refains; a nota conserva a alternativa lexical mais literal.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio aponta para o lugar associado à casa da mulher; “ali” é natural neste contraste espacial.
- source_word: בְּעִמְקֵי
  choice: nas profundezas do
  rationale: Preserva a imagem espacial de lugares profundos e da descida ao mundo dos mortos.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos, sem reduzi-lo a “sepultura” nem identificá-lo de modo anacrônico com “inferno”.
- source_word: קְרֻאֶיהָ
  choice: os convidados dela
  rationale: O particípio passivo de קרא com sufixo feminino refere-se aos que foram chamados ou convidados por ela; “convidados” preserva o motivo do convite e soa natural.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos; o inferno
  rationale: O termo hebraico indica o domínio ou morada dos mortos. Conservá-lo evita acrescentar uma especificidade doutrinária posterior e mantém a gravidade e a tensão da imagem sapiencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi preservada, e “Sheol” foi mantido como termo teológico contestado.
