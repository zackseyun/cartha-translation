  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה וַ/חֲסַר לֵ֝֗ב וְ/אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/016.yaml
  text: Whoever is simple[a], let him turn in here! And to him who lacks sense she says,
translation:
  language: pt
  text: '“Quem é ingênuo, venha para cá!” E a quem falta entendimento[a] ela diz:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sem coração”. Em Provérbios, o “coração” muitas vezes representa o entendimento, o discernimento ou o bom senso interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: Quem é ingênuo
  rationale: A construção introduz um convite geral. Em Provérbios, פֶתִי designa a pessoa inexperiente, crédula e ainda não formada moralmente; “ingênuo” comunica essa categoria sem sugerir mera deficiência intelectual.
- source_word: יָסֻר הֵנָּה
  choice: venha para cá
  rationale: O imperfeito tem força de convite. Embora סור expresse literalmente a ideia de desviar-se ou voltar-se, “venha para cá” transmite de modo natural o chamado em direção ao lugar da mulher.
- source_word: חֲסַר לֵב
  choice: a quem falta entendimento
  rationale: A expressão hebraica significa literalmente “falto de coração”; aqui, “coração” representa entendimento, discernimento e bom senso. A formulação escolhida preserva o sentido sapiencial em português claro.
- source_word: וְאָמְרָה לּוֹ
  choice: ela diz
  rationale: O sujeito feminino é identificado pelo contexto como a Insensatez personificada. O presente introduz naturalmente a fala direta que continua no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O paralelismo e a transição para a fala do versículo seguinte foram preservados. O marcador da nota foi colocado junto à expressão חֲסַר לֵב, à qual a explicação literal efetivamente corresponde.
