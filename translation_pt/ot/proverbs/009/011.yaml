  text: For by me your days will be multiplied[a], and years of life will be added to you.
translation:
  language: pt
  text: Pois por meio de mim os seus dias se multiplicarão[a], e anos de vida lhe serão acrescentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “em mim” ou “por mim”; aqui, a preposição hebraica admite sentidos próximos, embora o contexto favoreça a ideia de meio: a Sabedoria é o meio pelo qual a vida é prolongada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior e mantém com naturalidade o fluxo explicativo do provérbio.
- source_word: בִי
  choice: por meio de mim
  rationale: No contexto, a preposição בְּ com o sufixo de primeira pessoa indica mais provavelmente meio ou instrumentalidade, preservando a fala personificada da Sabedoria.
- source_word: יִרְבּוּ
  choice: se multiplicarão
  rationale: O verbo רבה significa tornar-se numeroso, aumentar ou multiplicar-se; com “dias” como sujeito, esta formulação conserva a imagem hebraica e é natural em português.
- source_word: יָמֶיךָ
  choice: os seus dias
  rationale: Mantém a expressão hebraica para a duração da vida, também clara e idiomática em português.
- source_word: וְיוֹסִיפוּ
  choice: serão acrescentados
  rationale: A construção admite em português uma formulação passiva de resultado, coerente com לְךָ e sem introduzir um sujeito indefinido ausente do texto.
- source_word: לְךָ
  choice: lhe
  rationale: Marca a pessoa a quem os anos acrescentados cabem; o pronome dativo é direto e natural.
- source_word: שְׁנוֹת חַיִּים
  choice: anos de vida
  rationale: Equivalente formal e idiomático da construção hebraica, referindo-se aos anos vividos.
