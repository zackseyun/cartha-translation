  text: אִם חָ֭כַמְתָּ חָכַ֣מְתָּ לָּ֑/ךְ וְ֝/לַ֗צְתָּ לְֽ/בַדְּ/ךָ֥ תִשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
translation:
  language: pt
  text: Se você é sábio, é sábio para si mesmo; se zomba, só você arcará com isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “só você o suportará”. O hebraico diz apenas “suportará”, deixando implícito o que será suportado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a força condicional da máxima hebraica sem convertê-la em uma afirmação de certeza temporal.
- source_word: חָכַמְתָּ חָכַמְתָּ לָּךְ
  choice: você for sábio, será sábio para o seu próprio bem
  rationale: Mantém a repetição enfática do verbo חכם e expressa לָּךְ como benefício pessoal, de modo natural em português.
- source_word: וְלַצְתָּ
  choice: se zombar
  rationale: O verbo לוץ indica zombaria arrogante, característica do zombador em Provérbios. “Zombar” conserva a forma verbal e é claro no português atual.
- source_word: לְבַדְּךָ
  choice: você sozinho
  rationale: Reproduz a ênfase na responsabilidade individual e exclusiva.
- source_word: תִשָּׂא
  choice: arcará com isso
  rationale: נשא significa carregar ou suportar. A expressão portuguesa comunica naturalmente que a pessoa terá de suportar o peso decorrente de sua zombaria, sem explicitar além do hebraico quais são as consequências.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção condicional clara. A repetição ligada à sabedoria foi preservada, enquanto “para o seu próprio bem” esclarece o sentido beneficiário de לָּךְ. A segunda oração mantém implícita a natureza do peso ou das consequências.
