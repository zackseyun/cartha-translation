  yaml_path: translation/ot/proverbs/009/006.yaml
  text: Leave the simple[a], and live; and walk in the way of understanding.
translation:
  language: pt
  text: Deixem para trás a ingenuidade[a] e vivam; sigam pelo caminho do entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Abandonem os ingênuos”. No contexto, a expressão pode significar deixar para trás a ingenuidade ou a companhia e a condição dos ingênuos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ פְתָאיִם
  choice: Deixem para trás a ingenuidade
  rationale: A expressão hebraica diz literalmente “abandonem os ingênuos”, mas, no contexto, os próprios inexperientes são chamados a deixar sua condição anterior. A formulação portuguesa comunica esse sentido provável sem sugerir, de modo enganoso, que devam abandonar certas pessoas; a nota preserva a forma e a ambiguidade do hebraico.
- source_word: וִחְיוּ
  choice: e vivam
  rationale: Mantém o imperativo plural coordenado e a força concisa da exortação hebraica.
- source_word: וְאִשְׁרוּ
  choice: sigam
  rationale: O verbo pode expressar avançar, prosseguir ou andar direito. Com “caminho”, “sigam” é natural em português e preserva a metáfora de conduta.
- source_word: בְּדֶרֶךְ
  choice: pelo caminho
  rationale: Equivalente idiomático da imagem hebraica de um percurso que representa a maneira de viver.
- source_word: בִּינָה
  choice: do entendimento
  rationale: “Entendimento” é claro, amplamente acessível e corresponde ao discernimento intelectual e moral frequentemente expresso por בינה em Provérbios.
