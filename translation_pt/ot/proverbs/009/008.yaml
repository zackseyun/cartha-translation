  text: אַל תּ֣וֹכַח לֵ֭ץ פֶּן יִשְׂנָאֶ֑/ךָּ הוֹכַ֥ח לְ֝/חָכָ֗ם וְ/יֶאֱהָבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
translation:
  language: pt
  text: Não repreenda o zombador[a], para que ele não odeie você; repreenda o sábio[b], e ele amará você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escarnecedor». O termo hebraico se refere a alguém marcado por escárnio arrogante e desdenhoso.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «um sábio»; em Provérbios, o singular masculino é usado para representar um tipo de pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Com o imperfeito, אַל expressa proibição; «não» é a forma natural em português, sem acrescentar ênfase.
- source_word: תּוֹכַח / הוֹכַח (יכח)
  choice: repreenda
  rationale: O verbo indica correção verbal ou censura. «Repreender» preserva sua força e funciona naturalmente nas duas orações.
- source_word: לֵץ
  choice: zombador
  rationale: Em Provérbios, designa alguém caracterizado por escárnio arrogante e desdenhoso. «Zombador» é claro no português moderno; a nota explicita o perfil moral do termo.
- source_word: פֶּן
  choice: para que... não
  rationale: פֶּן introduz uma consequência negativa que deve ser evitada. Esta construção é natural em português e mantém a relação de advertência.
- source_word: יִשְׂנָאֶךָּ
  choice: ele não odeie você
  rationale: O imperfeito depois de פֶּן apresenta a consequência provável; o subjuntivo português é exigido pela construção «para que... não».
- source_word: לְחָכָם
  choice: o sábio
  rationale: O hebraico traz um singular masculino representativo. «O sábio» conserva o número, o gênero gramatical e o caráter proverbial com naturalidade.
- source_word: וְיֶאֱהָבֶךָּ
  choice: e ele amará você
  rationale: O imperfeito indica o resultado esperado da repreensão; o futuro expressa isso claramente em português.
theological_decisions:
- issue: Singular masculino na instrução sapiencial
  choice: o sábio
  alternative: uma pessoa sábia; quem é sábio
  rationale: Mantém-se a forma masculina singular representativa do hebraico sem restringir explicitamente a máxima apenas aos homens; a nota esclarece seu uso proverbial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «repreenda» conserva o paralelismo hebraico; «você» traduz diretamente o objeto de segunda pessoa singular.
