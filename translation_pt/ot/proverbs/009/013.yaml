base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/013.yaml
  text: The woman Folly is loud[a]; she is simple and knows nothing.
translation:
  language: pt
  text: 'A mulher Insensatez é barulhenta; é simplória e não sabe coisa alguma.[a]


    [a] Em hebraico, mais literalmente: “e não sabe o quê”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, mais literalmente: “e não sabe o quê”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  choice: A mulher Insensatez
  rationale: A construção significa literalmente “mulher de insensatez”. No contexto de Provérbios 9, a insensatez é personificada como mulher; a forma escolhida preserva essa personificação e evita acrescentar um título como “Senhora”.
- source_word: הֹמִיָּה
  choice: é barulhenta
  rationale: O termo descreve alguém ruidoso, turbulento ou espalhafatoso. “Barulhenta” é natural em português atual e preserva a caracterização sonora sem restringir o sentido a mera agitação.
- source_word: פְּתַיּוּת
  choice: é ingênua
  rationale: O substantivo denota ingenuidade ou falta de discernimento. Como a oração hebraica não tem verbo expresso e predica uma qualidade da mulher, a tradução usa o adjetivo “ingênua”, corrente e compreensível.
- source_word: וּבַל
  choice: e não
  rationale: A conjunção seguida da partícula negativa acrescenta uma nova descrição. “E não” acompanha a estrutura cumulativa do hebraico sem introduzir contraste mais forte do que o texto exige.
- source_word: יָדְעָה מָּה
  choice: não sabe coisa alguma
  rationale: A formulação hebraica é literalmente “não sabe o quê” e expressa ignorância enfática. “Não sabe coisa alguma” comunica esse sentido de modo idiomático, enquanto a redação abrupta do original é preservada em nota.
