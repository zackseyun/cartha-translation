  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה חֲסַר לֵ֝֗ב אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/004.yaml
  text: Whoever is simple[a], let him turn in here! To him who lacks sense she says,
translation:
  language: pt
  text: '“Quem é inexperiente, volte-se para cá!” Ao que não tem discernimento[a], ela diz:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “falto de coração”. Em hebraico, “coração” muitas vezes se refere ao entendimento ou ao juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: Quem for inexperiente
  rationale: מִי introduz um destinatário genérico, e פֶתִי designa em Provérbios a pessoa ingênua, ainda sem experiência e facilmente influenciável, não alguém necessariamente incapaz intelectualmente.
- source_word: יָסֻר הֵנָּה
  choice: venha para cá
  rationale: O jussivo expressa um convite. Embora סור tenha a ideia básica de desviar-se ou voltar-se, no contexto do convite para entrar na casa, “venha para cá” comunica naturalmente o movimento em direção à locutora.
- source_word: חֲסַר לֵב
  choice: não tem discernimento
  rationale: A expressão significa literalmente “falto de coração”; no uso hebraico, o coração pode representar entendimento, juízo e discernimento. A formulação escolhida transmite o sentido sem sugerir uma condição física.
- source_word: אָמְרָה לּוֹ
  choice: ela diz ao que
  rationale: O feminino singular retoma a Sabedoria, e o perfeito introduz vividamente sua fala. A construção portuguesa mantém o destinatário singular genérico e prepara a continuação da citação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Inexperiente” evita a possível conotação depreciativa ou intelectual de “simples”. A ordem das duas linhas preserva o paralelismo hebraico e a frase termina com dois-pontos porque a fala continua no versículo seguinte.
