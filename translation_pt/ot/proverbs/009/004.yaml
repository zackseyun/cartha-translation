  rationale: A revisão substitui “venha para cá” por “volte-se para cá”, preservando a nuance de direcionamento do jussivo hebraico. Mantém “inexperiente” como equivalente moderno apropriado para פֶתִי e acrescenta uma nota, corretamente ancorada em “discernimento”, para explicitar o idiomatismo hebraico de חֲסַר לֵב. Os dois-pontos e a aspa de abertura permanecem porque a fala prossegue no versículo seguinte.
