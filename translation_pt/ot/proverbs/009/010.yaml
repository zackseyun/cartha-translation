  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
translation:
  language: pt
  text: O princípio da sabedoria é o temor de Yahweh, e o conhecimento do Santo[a] é entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “santos”. A forma plural é muitas vezes entendida aqui como referência a Deus, daí “o Santo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַּת
  choice: princípio da
  rationale: O construto de תְּחִלָּה indica o começo ou ponto de partida. “Princípio da” é natural em português e preserva tanto a formulação hebraica quanto sua possível força fundacional.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É a tradução corrente do tema moral e prático de חָכְמָה em Provérbios, sem restringi-lo a habilidade ou conduta sábia.
- source_word: יִרְאַת
  choice: temor de
  rationale: Preserva a tensão do hebraico entre reverência, assombro e o devido temor diante de Deus; “reverência” seria mais estreito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְדַעַת
  choice: e o conhecimento de
  rationale: Mantém a conjunção e a relação construta do substantivo, formando um paralelismo nominal natural em português.
- source_word: קְדֹשִׁים
  choice: o Santo
  rationale: Embora a forma hebraica seja plural, o paralelismo com Yahweh favorece aqui uma referência singular a Deus. A forma plural genuína é registrada em nota.
- source_word: בִּינָה
  choice: é entendimento
  rationale: “Entendimento” conserva a equação nominal do hebraico e corresponde naturalmente a sabedoria e conhecimento no paralelismo.
theological_decisions:
- issue: Referente de קְדֹשִׁים
  choice: 'Referente divino singular: “o Santo”'
  alternative: 'Referente plural: “os santos” ou “seres santos”'
  rationale: O paralelismo sinonímico faz “o conhecimento do Santo” corresponder a “o temor de Yahweh”, favorecendo a referência a Deus. Como קְדֹשִׁים é morfologicamente plural, essa ambiguidade não é apagada, mas preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e ampla compreensão internacional. A formulação mantém o paralelismo poético e o termo teologicamente denso “temor”, sem explicá-lo dentro do versículo.
