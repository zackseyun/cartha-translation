  text: טָבְחָ֣ה טִ֭בְחָ/הּ מָסְכָ֣ה יֵינָ֑/הּ אַ֝֗ף עָֽרְכָ֥ה שֻׁלְחָנָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/002.yaml
  text: She has slaughtered her meat[a]; she has mixed her wine[b]; she has also set her table.
translation:
  language: pt
  text: Ela abateu os animais para o banquete[a], misturou o seu vinho[b] e também pôs a mesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preparou a carne”; o hebraico se refere aos animais abatidos ou à carne preparada para o banquete.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, preparou o vinho misturando-o, provavelmente segundo o costume dos banquetes.
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָה טִבְחָהּ
  choice: abateu os animais para o banquete
  rationale: O verbo טבח indica abater animais para servir de alimento, e o substantivo טבח designa os animais abatidos ou a carne assim preparada. A formulação mantém a ação concreta e explicita de modo natural em português sua finalidade no contexto.
- source_word: מָסְכָה יֵינָהּ
  choice: misturou o seu vinho
  rationale: מסך designa misturar ou preparar vinho, possivelmente com água ou especiarias segundo o costume dos banquetes. “Misturou” preserva o sentido específico sem definir ingredientes que o texto não informa.
- source_word: אַף
  choice: também
  rationale: A partícula acrescenta a última ação à sequência de preparativos.
- source_word: עָרְכָה שֻׁלְחָנָהּ
  choice: pôs a mesa
  rationale: ערך significa dispor ou colocar em ordem; na expressão referente à mesa, “pôs a mesa” é a formulação portuguesa natural e conserva a imagem concreta.
theological_decisions:
- issue: Sujeito feminino personificado no poema sobre a Sabedoria
  choice: Empregar “Ela” sem acrescentar uma identificação no versículo.
  alternative: “A Sabedoria abateu...”
  rationale: As formas verbais hebraicas estão no feminino singular, e o contexto imediato identifica o referente como a Sabedoria personificada. O pronome preserva a personificação poética sem inserir uma glosa interpretativa no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Abateu” evita a conotação predominantemente violenta de “matou” e mantém a ação culinária concreta; “pôs a mesa” é idiomático sem perder a imagem do hebraico.
