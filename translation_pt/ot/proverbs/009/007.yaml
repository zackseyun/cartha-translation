  naturalness: “Quem corrige o zombador atrai desonra para si” é natural e adequado. “Quem repreende um perverso fica com a sua mancha” soa menos idiomático e tem referente possessivo opaco em português. “Recebe uma mancha” é mais direto, mas a nota deve explicar o emprego metafórico e a ambiguidade contextual.
