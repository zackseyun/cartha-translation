base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
translation:
  language: pt
  text: Quem corrige o zombador atrai desonra para si[a], e quem repreende um perverso[c] recebe uma mancha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toma para si a desonra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sua mancha” ou “seu defeito”. A expressão concisa pode indicar a reprovação ou o insulto que recai sobre quem repreende o perverso.'
    reason: lexical_alternative
  - marker: c
    text: A forma hebraica está no masculino singular, empregada aqui de maneira genérica.
    reason: cultural_note
lexical_decisions:
- source_word: יֹסֵר
  choice: Quem corrige
  rationale: O particípio expressa uma máxima geral. “Quem corrige” é natural em português e comunica correção verbal sem pressupor castigo físico.
- source_word: לֵץ
  choice: o zombador
  rationale: Em Provérbios, o termo designa quem rejeita a sabedoria com arrogância e desprezo. “Zombador” preserva essa dimensão de escárnio.
- source_word: לֹקֵחַ לוֹ
  choice: atrai ... para si
  rationale: A construção indica tomar ou receber algo sobre si. “Atrai ... para si” expressa de modo corrente que a pessoa incorre nessa consequência.
- source_word: קָלוֹן
  choice: desonra
  rationale: O substantivo denota vergonha, ignomínia ou desonra pública; “desonra” evita reduzi-lo a um sentimento interior.
- source_word: וּמוֹכִיחַ
  choice: e quem repreende
  rationale: O particípio de יכח indica censurar ou repreender. A formulação mantém o paralelismo com “quem corrige”, com intensidade verbal adequada.
- source_word: לְרָשָׁע
  choice: um perverso
  rationale: O substantivo/adjetivo masculino singular refere-se genericamente a uma pessoa moralmente perversa. “Um perverso” é conciso e mantém a forma representativa do hebraico.
- source_word: מוּמוֹ
  choice: a sua mancha
  rationale: A expressão significa literalmente “sua mancha/seu defeito”. O possessivo hebraico é compacto e seu referente ou efeito exato não é inteiramente claro; a tradução mantém essa ambiguidade, esclarecida em nota.
theological_decisions:
- issue: Referente e sentido de מוּמוֹ (“sua mancha”)
  choice: Manter “a sua mancha” no texto
  alternative: “recebe insultos” ou “fica manchado”
  rationale: O hebraico pode apontar para a mancha associada ao perverso ou para a desonra que recai sobre quem o repreende. Uma formulação interpretativa resolveria uma ambiguidade genuína que o texto não resolve explicitamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Zombador”, “desonra” e “perverso” conservam o tom sapiencial sem arcaísmo excessivo. O possessivo em “a sua mancha” preserva deliberadamente a concisão e a ambiguidade do hebraico.
