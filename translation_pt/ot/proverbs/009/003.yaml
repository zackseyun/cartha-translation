  text: שָֽׁלְחָ֣ה נַעֲרֹתֶ֣י/הָ תִקְרָ֑א עַל גַּ֝פֵּ֗י מְרֹ֣מֵי קָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/003.yaml
  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
translation:
  language: pt
  text: Ela enviou suas moças[a]; ela chama do alto da cidade:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas jovens”. O hebraico designa jovens do sexo feminino e, neste contexto, pode se referir a auxiliares ou servas, mas não define expressamente sua posição social.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre os cumes das alturas da cidade”. A expressão retrata um ponto elevado e público.
    reason: literal_rendering
lexical_decisions:
- source_word: שָׁלְחָה
  choice: enviou
  rationale: O qal perfeito, terceira pessoa feminina singular, apresenta como concluído o envio feito pela Sabedoria personificada; o pretérito perfeito é natural em português.
- source_word: נַעֲרֹתֶיהָ
  choice: suas jovens
  rationale: Preserva diretamente as ideias de idade e gênero sem afirmar além do hebraico que sejam servas, embora o contexto possa sugerir auxiliares.
- source_word: תִקְרָא
  choice: ela chama
  rationale: O qal imperfeito descreve o chamado público da Sabedoria. “Chama” mantém a força básica do verbo sem intensificá-lo desnecessariamente como “clama”.
- source_word: עַל גַּפֵּי מְרֹמֵי קָרֶת
  choice: do alto da cidade
  rationale: Expressão portuguesa natural para o local elevado de onde parte o chamado. Condensa a combinação hebraica de termos de elevação sem perder a imagem central.
- source_word: קָרֶת
  choice: cidade
  rationale: Forma poética hebraica para cidade; a escolha preserva o cenário urbano em linguagem corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “ela” mantém explícita a Sabedoria personificada. A ordem foi ajustada para evitar que “do alto da cidade” pareça modificar o envio das jovens.
