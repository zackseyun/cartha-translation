  text: מַֽיִם גְּנוּבִ֥ים יִמְתָּ֑קוּ וְ/לֶ֖חֶם סְתָרִ֣ים יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/017.yaml
  text: Stolen water is sweet[a], and bread of secrecy is pleasant.
translation:
  language: pt
  text: “A água roubada é doce, e o pão de segredos[a] é agradável.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “pão em lugares ocultos” ou “pão secreto”. O hebraico diz literalmente “pão de segredos/coisas ocultas” e é uma expressão condensada; não especifica se o pão é obtido, consumido ou guardado em segredo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: água
  rationale: Embora a forma hebraica seja plural, o substantivo funciona aqui como nome de massa; o singular é a forma natural em português.
- source_word: גְּנוּבִים
  choice: roubada
  rationale: O particípio passivo de גנב indica algo obtido por roubo; “roubada” preserva diretamente essa ideia.
- source_word: יִמְתָּקוּ
  choice: é doce
  rationale: O verbo מתק expressa a qualidade de ser doce; a construção estativa é natural em português e mantém a imagem sensorial.
- source_word: לֶחֶם
  choice: pão
  rationale: “Pão” conserva a imagem concreta e o paralelismo com “água”, embora o termo também possa, em certos contextos, designar alimento em geral.
- source_word: סְתָרִים
  choice: comido às escondidas
  rationale: O plural de סתר denota ocultamento ou lugares secretos. A formulação portuguesa explicita a relação idiomática com “pão”, sem perder a ideia central de consumo clandestino; a nota preserva a concisão e a ambiguidade do hebraico.
- source_word: יִנְעָם
  choice: é saboroso
  rationale: נעם significa ser agradável ou deleitoso. No paralelismo alimentar, “saboroso” comunica naturalmente o prazer sugerido, em correspondência com “doce”.
theological_decisions:
- issue: Sentido figurado do prazer ilícito
  choice: Manter apenas as imagens de água roubada e pão clandestino
  alternative: Explicitar no versículo uma referência a adultério ou pecado secreto
  rationale: O contexto personifica a insensatez e sugere o fascínio do proibido, mas o versículo mantém a metáfora; a tradução não deve resolver ou ampliar essa imagem no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Às escondidas” é corrente e comunica a clandestinidade; a nota registra a formulação hebraica mais comprimida. As aspas indicam a fala da mulher insensata no contexto imediato.
