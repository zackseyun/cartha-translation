base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/003.yaml
  text: A whip for the horse[a], a bridle for the donkey[b], and a rod for the back of fools.
translation:
  language: pt
  text: 'Chicote para o cavalo,

    freio para o jumento

    e vara para as costas dos insensatos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹט
  choice: chicote
  rationale: Designa um instrumento usado para conduzir ou disciplinar um animal; “chicote” é o equivalente moderno mais natural e mantém o paralelismo concreto.
- source_word: לַסּוּס
  choice: para o cavalo
  rationale: A preposição ל indica destinação ou adequação. O artigo definido preserva o caráter proverbial da formulação hebraica.
- source_word: מֶתֶג
  choice: freio
  rationale: O termo designa o equipamento posto na boca do animal para controlá-lo. Em português, “freio” é a designação corrente e precisa; “rédea” indicaria apenas outra parte do conjunto.
- source_word: לַחֲמוֹר
  choice: para o jumento
  rationale: “Jumento” é uma designação clara, corrente e digna em português, adequada ao animal referido no hebraico.
- source_word: וְשֵׁבֶט
  choice: e vara
  rationale: No contexto sapiencial, שֵׁבֶט indica uma vara usada para correção ou golpe; “vara” conserva essa nuance disciplinar.
- source_word: לְגֵו
  choice: para as costas
  rationale: O substantivo pode indicar dorso ou corpo, mas aqui identifica naturalmente as costas como o lugar atingido. O plural idiomático português concorda distributivamente com “insensatos”.
- source_word: כְּסִילִים
  choice: dos insensatos
  rationale: Em Provérbios, o termo descreve pessoas moralmente refratárias à sabedoria, não apenas pessoas sem inteligência. “Insensatos” comunica melhor esse sentido sapiencial do que “tolos” em alguns contextos modernos.
