  text: Whoever digs a pit will fall into it[a], and he who rolls a stone, it will come back on him.
translation:
  language: pt
  text: Quem cava uma cova cairá nela, e quem faz rolar uma pedra, ela voltará sobre ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּרֶה
  choice: Quem cava
  rationale: O particípio qal substantivado descreve genericamente qualquer pessoa; “quem cava” é natural em português e preserva a forma proverbial.
- source_word: שַּׁחַת
  choice: uma cova
  rationale: “Cova” expressa de modo corrente o buraco escavado que pode servir de armadilha, sem acrescentar ao texto uma finalidade explícita.
- source_word: בָּהּ
  choice: nela
  rationale: O sufixo feminino retoma “cova”; “cairá nela” reproduz com concisão a relação do hebraico.
- source_word: יִפֹּל
  choice: cairá
  rationale: O imperfeito apresenta a consequência previsível e proverbial; o futuro em português comunica bem esse efeito gnômico.
- source_word: וְגֹלֵל
  choice: e quem faz rolar
  rationale: O segundo particípio também é substantivado e genérico. “Faz rolar” representa a ação causativa ou continuada evocada pelo particípio sem identificar um propósito não declarado.
- source_word: אֶבֶן
  choice: uma pedra
  rationale: “Pedra” é o equivalente amplo e usual de אֶבֶן e mantém a imagem concreta do provérbio.
- source_word: אֵלָיו
  choice: sobre si
  rationale: Com o verbo “voltar”, a preposição indica que a pedra retorna sobre ou contra o agente. “Sobre si” preserva a ideia de repercussão danosa e evita ambiguidade de referente.
- source_word: תָּשׁוּב
  choice: verá a pedra voltar
  rationale: O verbo feminino concorda com “pedra” e significa “voltará”. A formulação portuguesa evita o encadeamento pouco natural “quem..., ela voltará”, mantendo explícito o retorno da pedra e a consequência para o agente.
theological_decisions: []
