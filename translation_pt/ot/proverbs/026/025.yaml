  yaml_path: translation/ot/proverbs/026/025.yaml
  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
translation:
  language: pt
  text: Quando ele tornar sua voz agradável[a], não confie nele, pois há sete abominações em seu coração.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando ele falar de maneira agradável” ou “Quando fizer sua voz soar agradável”. O hebraico diz literalmente: “quando tornar sua voz agradável”.'
    reason: lexical_alternative
  - marker: b
    text: No estilo da literatura de sabedoria, “sete” provavelmente sugere plenitude ou totalidade; o número foi mantido no texto.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַנֵּן קוֹלוֹ
  choice: tornar sua voz agradável
  rationale: Preserva a imagem concreta do hebraico, em que a forma intensiva de חנן se refere à voz, e comunica que a pessoa faz sua fala soar cativante ou favorável.
- source_word: אַל תַּאֲמֶן בּוֹ
  choice: não confie nele
  rationale: O hifil de אמן com a preposição ב expressa aqui confiança depositada na pessoa, e não apenas assentimento ao que ela diz.
- source_word: שֶׁבַע
  choice: sete
  rationale: Mantém o número explícito do texto hebraico, sem eliminar sua possível conotação sapiencial de plenitude ou totalidade.
- source_word: תּוֹעֵבוֹת
  choice: abominações
  rationale: Conserva a forte carga moral de תּוֹעֵבָה e seu uso bíblico tradicional, sendo também compreensível em português contemporâneo.
- source_word: בְּלִבּוֹ
  choice: em seu coração
  rationale: Preserva o idioma antropológico hebraico para o íntimo da pessoa, incluindo pensamentos, disposições e intenções.
