  text: Like one who grabs a dog by the ears is a passerby who gets involved in a quarrel not his own[a].
translation:
  language: pt
  text: Como quem agarra um cão pelas orelhas é quem passa e se envolve numa briga que não é sua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se intromete numa briga que não é sua”. O verbo hebraico pode indicar que alguém se envolve na disputa de outra pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיק
  choice: agarra
  rationale: O particípio hifil de חזק indica segurar com firmeza; “agarra” preserva a vivacidade e o perigo da imagem proverbial.
- source_word: בְּאָזְנֵי
  choice: pelas orelhas
  rationale: A preposição marca o ponto pelo qual o animal é agarrado; esta é a formulação idiomática natural em português.
- source_word: כָלֶב
  choice: um cão
  rationale: Tradução direta do substantivo singular, mantendo a imagem concreta do provérbio.
- source_word: עֹבֵר
  choice: quem passa
  rationale: O particípio qal designa alguém que está apenas passando; a formulação é corrente, concisa e evita sugerir uma categoria social específica.
- source_word: מִתְעַבֵּר
  choice: se envolve
  rationale: Neste contexto, o hitpael de עבר provavelmente descreve a intromissão voluntária numa disputa alheia; “se envolve” conserva o sentido sem intensificar indevidamente o tom.
- source_word: עַל
  choice: numa
  rationale: Com “se envolve”, o português idiomático pede “numa briga”, expressando a relação indicada pela preposição hebraica.
- source_word: רִיב
  choice: briga
  rationale: “Briga” é linguagem cotidiana e clara para um conflito interpessoal, adequada ao registro sapiencial do provérbio.
- source_word: לֹא לוֹ
  choice: que não é sua
  rationale: Reproduz de modo compacto a ideia de que a disputa não pertence nem diz respeito à pessoa que nela entra.
