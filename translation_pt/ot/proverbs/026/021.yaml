base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/021.yaml
  text: Charcoal for embers[a], and wood for fire[b], and a quarrelsome man for kindling strife.
translation:
  language: pt
  text: Carvão para as brasas e lenha para o fogo; assim também o homem dado a brigas[a] para atiçar uma contenda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “homem de contendas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para inflamar uma briga”. O verbo hebraico significa fazer arder ou avivar; aqui aplica a imagem do fogo à contenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּחָם
  choice: carvão
  rationale: Designa carvão usado como combustível; mantém a distinção em relação às brasas já acesas.
- source_word: גֶחָלִים
  choice: brasas
  rationale: Refere-se a carvões acesos ou incandescentes. “Brasas” é natural em português e preserva a progressão da imagem.
- source_word: עֵצִים
  choice: lenha
  rationale: Embora o substantivo possa significar “madeira”, no contexto de combustível para o fogo “lenha” expressa naturalmente o sentido.
- source_word: אֵשׁ
  choice: fogo
  rationale: Equivalente direto e corrente do termo hebraico.
- source_word: אִישׁ מדונים
  choice: homem dado a brigas
  rationale: Expressa de modo natural o hebraísmo atributivo “homem de contendas”, preservando tanto o masculino singular quanto a ideia de comportamento habitual.
- source_word: חַרְחַר
  choice: atiça
  rationale: O verbo comunica fazer arder ou inflamar. “Atiçar” preserva a metáfora do fogo e sua aplicação ao conflito.
- source_word: רִיב
  choice: contenda
  rationale: Abrange briga, disputa ou conflito. “Contenda” evita repetir “brigas” e mantém o tom proverbial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira. A estrutura paralela foi preservada por meio de “alimenta” e “atiça”; a elipse em “e a lenha, o fogo” evita repetição sem perder clareza.
