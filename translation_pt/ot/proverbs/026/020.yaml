base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/020.yaml
  text: For lack of wood[a], the fire goes out, and where there is no whisperer, strife grows quiet.
translation:
  language: pt
  text: Por falta de lenha, o fogo se apaga; e, não havendo quem espalhe boatos[a], a discórdia se aquieta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mexeriqueiro”. O termo hebraico se refere a quem espalha conversas prejudiciais, muitas vezes em segredo ou murmurando.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶפֶס
  choice: por falta de
  rationale: Expressa ausência ou carência com valor causal e soa natural em português.
- source_word: עֵצִים
  choice: lenha
  rationale: Neste contexto, o plural hebraico designa madeira usada como combustível; “lenha” transmite isso diretamente.
- source_word: תִּכְבֶּה
  choice: se apaga
  rationale: Preserva o sentido intransitivo de כבה e é a expressão corrente para um fogo que deixa de arder.
- source_word: וּבְאֵין
  choice: e, não havendo
  rationale: Mantém o paralelismo de ausência entre os dois membros e apresenta a condição de modo idiomático.
- source_word: נִרְגָּן
  choice: quem espalhe boatos
  rationale: O termo descreve uma pessoa que murmura ou faz circular conversas prejudiciais, muitas vezes de modo discreto; a formulação é clara no português moderno sem restringir o sentido a calúnia formal.
- source_word: יִשְׁתֹּק
  choice: se aquieta
  rationale: Conserva a imagem de algo que fica silencioso ou perde intensidade, sem afirmar necessariamente uma cessação absoluta.
- source_word: מָדוֹן
  choice: a discórdia
  rationale: Traduz a ideia de contenda ou conflito e combina naturalmente com “se aquieta” no registro proverbial.
theological_decisions: []
