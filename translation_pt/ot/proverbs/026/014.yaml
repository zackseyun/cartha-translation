base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/014.yaml
  text: As a door turns on its hinge[a], so a sluggard on his bed.
translation:
  language: pt
  text: Como a porta gira sobre a dobradiça, assim o preguiçoso sobre a cama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico omite o verbo no segundo membro, formando um paralelismo conciso. Pode-se explicitar o sentido: «Como a porta gira sobre a dobradiça, assim o preguiçoso se vira na cama».'
    reason: preservação da elipse hebraica e alternativa de tradução
lexical_decisions:
- source_word: הַדֶּלֶת
  choice: a porta
  rationale: O substantivo significa “porta”. O artigo definido foi mantido, pois em português é natural empregar o definido com valor genérico em provérbios.
- source_word: תִּסּוֹב
  choice: gira
  rationale: A forma de סבב descreve o movimento repetido da porta em torno de seu ponto de articulação. “Gira” preserva de modo claro e conciso a imagem hebraica.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica aquilo em que se apoia ou em torno de que ocorre o movimento. “Sobre” funciona naturalmente nos dois membros paralelos.
- source_word: צִירָהּ
  choice: a dobradiça
  rationale: צִיר designa o eixo ou a articulação da porta. “Dobradiça” é o termo corrente e imediatamente compreensível em português; o possessivo hebraico é dispensável porque a relação com a porta já está clara.
- source_word: וְעָצֵל
  choice: e o preguiçoso
  rationale: עָצֵל é o termo característico da literatura sapiencial para a pessoa entregue à preguiça. “O preguiçoso” preserva a força moral e proverbial, com artigo definido de valor genérico.
- source_word: מִטָּתוֹ
  choice: sobre a cama
  rationale: מִטָּה significa “cama” ou lugar de repouso. A construção mantém o paralelismo com “sobre a dobradiça”; o possessivo é naturalmente entendido pelo contexto.
theological_decisions: []
translation_notes:
  register: 'Português moderno, conciso e proverbial. A construção elíptica conserva o equilíbrio e a ironia do hebraico: tanto a porta quanto o preguiçoso se movem repetidamente, mas não saem do lugar.'
