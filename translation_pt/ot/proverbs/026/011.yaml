  text: Like a dog returning to its vomit[a], so a fool repeats his folly.
translation:
  language: pt
  text: Como o cão volta ao seu vômito, assim o insensato repete a sua insensatez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em construção mais formal: “Assim como o cão volta ao seu vômito, o insensato repete a sua insensatez”. O hebraico emprega particípios nas duas metades, criando uma imagem vívida de ação habitual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶלֶב
  choice: Como o cão
  rationale: O prefixo כְּ marca comparação. “Como o cão” introduz a imagem proverbial de modo claro e natural em português.
- source_word: שָׁב עַל קֵאוֹ
  choice: que volta ao seu vômito
  rationale: O particípio שָׁב retrata uma ação característica ou recorrente. Embora עַל signifique literalmente “sobre”, a construção idiomática em português é “voltar ao seu vômito”.
- source_word: כְּסִיל
  choice: o insensato
  rationale: Em Provérbios, כְּסִיל designa alguém moral e intelectualmente obstinado, não apenas uma pessoa com pouca inteligência. “Insensato” comunica essa dimensão e mantém um registro digno.
- source_word: שׁוֹנֶה בְאִוַּלְתּוֹ
  choice: que repete a sua insensatez
  rationale: שׁוֹנֶה expressa repetição, e a preposição בְ pode ser vertida idiomaticamente com objeto direto em português. “Repete a sua insensatez” preserva o sentido sem tornar a frase artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “seu/sua” conserva a correspondência entre as duas metades do provérbio.
