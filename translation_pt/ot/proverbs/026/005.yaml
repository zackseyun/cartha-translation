  text: עֲנֵ֣ה כְ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּן יִהְיֶ֖ה חָכָ֣ם בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/005.yaml
  text: Answer a fool according to his folly[b][a], lest he be wise in his own eyes.
translation:
  language: pt
  text: Responda ao insensato de acordo com a sua insensatez[a], para que ele não seja sábio aos seus próprios olhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como a sua insensatez merece”. O hebraico indica uma resposta correspondente à insensatez dele, não necessariamente uma imitação de seu modo insensato de agir.'
    reason: lexical_alternative
  - marker: b
    text: Este provérbio está intencionalmente em tensão com Provérbios 26:4; a sabedoria discerne quando convém calar e quando convém responder.
    reason: cross_reference
lexical_decisions:
- source_word: עֲנֵה
  choice: Responda
  rationale: O imperativo de ענה pede que se dê uma resposta. “Responda” é natural no português atual e mantém a concisão proverbial.
- source_word: כְסִיל
  choice: ao insensato
  rationale: כְסִיל é um termo característico da literatura sapiencial para quem é moral e intelectualmente obstinado. “Insensato” preserva essa categoria sem recorrer a uma expressão meramente ofensiva.
- source_word: כְאִוַּלְתּוֹ
  choice: de acordo com a sua insensatez
  rationale: 'O כ prefixado indica correspondência: a resposta deve ser apropriada à insensatez do interlocutor. A formulação conserva a ambiguidade e a tensão deliberada com o versículo anterior.'
- source_word: פֶּן
  choice: para que ... não
  rationale: פֶּן introduz finalidade preventiva. A construção “para que não” é clara e corrente em português, sem perder a relação lógica do hebraico.
- source_word: יִהְיֶה חָכָם
  choice: seja sábio
  rationale: A expressão, qualificada por “aos seus próprios olhos”, não afirma sabedoria real, mas a avaliação que o insensato faz de si mesmo.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: A expressão preserva a metáfora hebraica e comunica de modo natural a ideia de alguém se considerar sábio.
theological_decisions:
- issue: Tensão interpretativa com Provérbios 26:4
  choice: Manter “de acordo com a sua insensatez”, sem explicar o aparente paradoxo dentro do texto.
  alternative: “como a sua insensatez merece” ou “de modo apropriado à sua insensatez”
  rationale: 'Os provérbios adjacentes apresentam uma tensão sapiencial intencional: não se deve responder de modo a tornar-se semelhante ao insensato, mas pode ser necessário responder de modo adequado para expor sua insensatez. A tradução conserva essa tensão.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Insensato” mantém o vocabulário sapiencial; “para que não” evita o tom arcaizante de “para que não venha a”.
