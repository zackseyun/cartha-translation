  text: לְֽשׁוֹן שֶׁ֭קֶר יִשְׂנָ֣א דַכָּ֑י/ו וּ/פֶ֥ה חָ֝לָ֗ק יַעֲשֶׂ֥ה מִדְחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/028.yaml
  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
translation:
  language: pt
  text: A língua mentirosa odeia aqueles que ela esmaga[a], e a boca lisonjeira[b] causa ruína[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que foram esmagados por ela”, “suas vítimas esmagadas” ou “os que ela fere”. O hebraico se refere a vítimas esmagadas ou oprimidas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma boca suave”; isto é, uma fala marcada por lisonja ou suavidade enganosa.
    reason: lexical_alternative
  - marker: c
    text: Ou “queda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  choice: a língua mentirosa
  rationale: A expressão significa literalmente “língua de falsidade”. “Língua mentirosa” é natural em português e preserva a personificação da fala como agente.
- source_word: יִשְׂנָא
  choice: odeia
  rationale: O yiqtol exprime aqui uma verdade geral, por isso o presente corresponde ao estilo proverbial em português.
- source_word: דַכָּיו
  choice: aqueles que ela esmaga
  rationale: A forma aponta para pessoas esmagadas, oprimidas ou feridas. A tradução explicita de modo natural a relação implícita com a língua mentirosa e conserva a força da imagem.
- source_word: וּפֶה חָלָק
  choice: e a boca lisonjeira
  rationale: Literalmente, “e uma boca suave/lisa”. No contexto, a suavidade da fala indica lisonja ou engano; “boca lisonjeira” comunica o sentido idiomático sem eliminar a imagem corporal.
- source_word: יַעֲשֶׂה
  choice: causa
  rationale: Embora o verbo básico seja “fazer”, com מִדְחֶה a expressão significa produzir ou provocar a ruína. “Causa” é conciso e idiomático.
- source_word: מִדְחֶה
  choice: ruína
  rationale: O substantivo pode indicar queda, derrocada ou ruína. “Ruína” expressa claramente o resultado destrutivo, enquanto “queda” permanece registrada como alternativa.
theological_decisions: []
