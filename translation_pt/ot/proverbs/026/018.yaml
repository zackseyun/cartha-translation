base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/018.yaml
  text: Like a madman who shoots firebrands[a], arrows, and death[b],
translation:
  language: pt
  text: Como um desvairado[a] que atira tições em chamas[b], flechas e morte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alguém que age desvairadamente” ou “uma pessoa delirante”.
    reason: lexical_alternative
  - marker: b
    text: Ou “projéteis incendiários”, “tições ardentes” ou “dardos em chamas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִתְלַהְלֵהַּ
  choice: Como um insensato
  rationale: O כְּ introduz a comparação, e o particípio hitpael de הלל descreve alguém que age de modo irracional ou desvairado. “Insensato” é natural e digno em português, embora possa soar menos intenso que “desvairado”; a nota preserva essa força lexical.
- source_word: הַיֹּרֶה
  choice: que dispara
  rationale: ירה é empregado para lançar ou atirar projéteis. “Dispara” acomoda tanto as flechas quanto os projéteis incendiários e mantém a imagem de ataque à distância.
- source_word: זִקִּים
  choice: projéteis incendiários
  rationale: O substantivo designa objetos ardentes usados como projéteis. A expressão é clara no português atual e comunica melhor a escala perigosa da imagem do que “faíscas”; “tições” é uma alternativa mais literal, porém menos imediatamente clara neste contexto.
- source_word: חִצִּים
  choice: flechas
  rationale: É o sentido comum e direto do substantivo hebraico, adequado ao contexto de projéteis.
- source_word: וָמָוֶת
  choice: e morte
  rationale: Mantém o substantivo abstrato e a culminação abrupta do hebraico, sem decidir se a morte é figurativamente o último projétil, o resultado dos disparos ou um resumo do dano letal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A vírgula final foi mantida porque o versículo 18 introduz a comparação que se completa no versículo 19. A formulação preserva a sequência poética e a ambiguidade de “morte”.
