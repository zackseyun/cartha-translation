review_pass:
  verdict: revise
  source_fidelity: “Insensato” normalmente designa falta de juízo ou tolice, mas כְּמִתְלַהְלֵהַּ retrata mais especificamente alguém que age de modo desvairado ou irracional. “Projéteis incendiários” é possível, porém explicita e tecniciza uma imagem que o hebraico exprime concretamente por זִקִּים. A revisão conserva a comparação, a ação de atirar e a sequência culminante “e morte”.
  naturalness: “Como um desvairado que atira tições em chamas, flechas e morte,” é natural em português moderno, mantém a força imagética do provérbio e deixa clara a continuidade sintática com o versículo seguinte.
  terminology: “Desvairado” comunica adequadamente o comportamento irracional e perigoso sem introduzir diagnóstico clínico. “Tições em chamas” traduz a imagem de objetos ardentes; a nota registra alternativas lexicais sem deslocar a âncora.
  issues:
