    issue: “Insensato” enfraquece o sentido de כְּמִתְלַהְלֵהַּ.
    rationale: No contexto, o particípio descreve conduta alucinada, desvairada ou perigosamente irracional, não apenas a qualidade proverbial de quem carece de sabedoria.
  - severity: low
    issue: “Projéteis incendiários” é uma formulação abstrata e mais técnica que a imagem hebraica.
    rationale: זִקִּים designa objetos ardentes, para os quais “tições em chamas” preserva melhor a concretude poética.
  - severity: low
    issue: A única nota reúne alternativas de dois termos distintos sob uma âncora ligada a apenas um deles.
    rationale: Âncoras separadas tornam explícito a que expressão cada alternativa se refere.
