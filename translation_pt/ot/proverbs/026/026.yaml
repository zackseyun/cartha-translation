base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/026.yaml
  text: Though hatred is covered with deceit[b][a], his evil will be exposed in the assembly.
translation:
  language: pt
  text: Embora o ódio seja encoberto por meio do engano[a], a maldade dele será revelada na assembleia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com engano” ou “mediante engano”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na congregação”. O hebraico se refere a uma comunidade ou grupo reunido.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכַּסֶּה
  choice: se esconda
  rationale: O nifal imperfeito, com שִׂנְאָה como sujeito feminino, admite sentido passivo ou reflexivo. “Se esconda” é natural em português e preserva a ideia de ódio dissimulado.
- source_word: שִׂנְאָה
  choice: ódio
  rationale: Expressa diretamente hostilidade ou aversão e mantém o substantivo abstrato do hebraico.
- source_word: בְּמַשָּׁאוֹן
  choice: por meio do engano
  rationale: מַשָּׁאוֹן designa engano ou fraude, e a preposição בְּ indica o meio pelo qual o ódio é ocultado.
- source_word: תִּגָּלֶה
  choice: será revelada
  rationale: O nifal imperfeito indica que a maldade encoberta virá a ser manifesta; o futuro conserva o contraste proverbial.
- source_word: רָעָתוֹ
  choice: sua maldade
  rationale: רָעָה abrange mal moral, perversidade e conduta nociva. “Sua maldade” soa natural e mantém essa amplitude no contexto.
- source_word: בְקָהָל
  choice: na assembleia
  rationale: קָהָל refere-se concretamente a uma comunidade reunida; “assembleia” preserva esse cenário sem reduzi-lo ao sentido abstrato de “publicamente”.
theological_decisions: []
