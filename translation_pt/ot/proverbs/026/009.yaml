  text: Like a thorn that comes up in the hand of a drunkard[b][a], so is a proverb in the mouth of fools.
translation:
  language: pt
  text: Como um espinho que se ergue na mão de um bêbado[a], assim é o provérbio na boca dos tolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como um espinheiro na mão de um bêbado”. O verbo hebraico significa literalmente “sobe” ou “se eleva”; a imagem pode ser a de um espinho levantado ou brandido de modo perigoso e descontrolado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹחַ
  choice: espinho
  rationale: O substantivo pode designar um espinho ou uma planta espinhosa. “Espinho” mantém de modo conciso a imagem de algo pontiagudo e perigoso.
- source_word: עָלָה
  choice: sobe
  rationale: Reproduz o sentido básico de “subir”, sem decidir se o espinho é levantado, brandido ou acaba entrando na mão.
- source_word: בְּיַד
  choice: na mão de
  rationale: Preserva a imagem concreta e a preposição hebraica sem acrescentar uma ação deliberada.
- source_word: שִׁכּוֹר
  choice: bêbado
  rationale: Designa uma pessoa embriagada; “bêbado” é corrente, claro e natural em português.
- source_word: מָשָׁל
  choice: provérbio
  rationale: No contexto do livro, refere-se naturalmente a um dito proverbial ou máxima sapiencial.
- source_word: בְּפִי
  choice: na boca dos
  rationale: A tradução concreta conserva o paralelo corporal entre a mão e a boca.
- source_word: כְסִילִים
  choice: tolos
  rationale: É o termo sapiencial para pessoas moralmente insensatas ou obstinadas, não apenas de pouca inteligência.
