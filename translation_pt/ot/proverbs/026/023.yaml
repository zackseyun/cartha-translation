  yaml_path: translation/ot/proverbs/026/023.yaml
  text: Like silver dross overlaid on earthenware are fervent lips with an evil heart[a].
translation:
  language: pt
  text: Como escória de prata aplicada sobre um vaso de barro, assim são lábios ardentes[a] e um coração mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «lábios fervorosos»; o particípio hebraico evoca literalmente calor ou fogo e, aqui, descreve palavras que soam intensamente calorosas ou entusiasmadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף סִיגִים
  choice: escória de prata
  rationale: A expressão indica o resíduo impuro da prata, cuja aparência metálica contrasta com seu pouco valor. A tradução preserva essa imagem sem sugerir prata pura.
- source_word: מְצֻפֶּה
  choice: revestindo
  rationale: O particípio passivo descreve algo coberto ou folheado. Em português, «revestindo» comunica uma camada exterior e mantém fluida a comparação.
- source_word: עַל חָרֶשׂ
  choice: um vaso de barro
  rationale: חָרֶשׂ designa barro cozido ou cerâmica. «Vaso de barro» torna concreta e compreensível a oposição entre a base barata e o revestimento brilhante.
- source_word: שְׂפָתַיִם
  choice: lábios
  rationale: Mantém a metáfora corporal do hebraico, natural em português para representar a fala.
- source_word: דֹּלְקִים
  choice: fervorosos
  rationale: O particípio evoca calor ou ardor. «Fervorosos» expressa uma fala intensa e calorosa sem especificar indevidamente que seja lisonjeira.
- source_word: וְלֶב רָע
  choice: e o coração mau
  rationale: Preserva tanto a conjunção hebraica como a avaliação moral direta de רָע, deixando que o contraste entre expressão exterior e realidade interior surja da imagem proverbial.
