  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת נִ֝לְאָ֗ה לַֽ/הֲשִׁיבָ֥/הּ אֶל פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/015.yaml
  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
translation:
  language: pt
  text: O preguiçoso enterra a mão no prato[a]; fica cansado demais para levá-la de volta à boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esconde a mão na tigela”. O verbo hebraico pode significar “esconder” ou “enterrar”, e o recipiente também pode ser entendido como tigela ou travessa.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: enterra
  rationale: O verbo pode significar esconder, ocultar ou enterrar. “Enterra” conserva a imagem concreta, exagerada e cômica do provérbio.
- source_word: עָצֵל
  choice: o preguiçoso
  rationale: Em Provérbios, o termo designa um tipo humano recorrente. “O preguiçoso” é natural em português e mantém essa força caracterológica.
- source_word: יָדוֹ
  choice: a mão
  rationale: Tradução direta do substantivo singular com sufixo masculino; o possuidor já está claro pelo sujeito.
- source_word: בַּצַּלָּחַת
  choice: no prato
  rationale: O substantivo indica um recipiente para comida, como prato, travessa ou tigela. “Prato” é corrente e adequado ao contexto, sem tornar a cena obscura.
- source_word: נִלְאָה
  choice: fica cansado demais
  rationale: A forma verbal expressa ficar cansado ou exausto. No contexto hiperbólico, a formulação explicita naturalmente que o cansaço o impede de completar o gesto.
- source_word: לַהֲשִׁיבָהּ
  choice: para levá-la de volta
  rationale: O Hifil de שוב significa fazer voltar ou trazer de volta. O pronome feminino retoma “mão”, e “levá-la de volta” preserva o movimento desde o prato.
- source_word: אֶל פִּיו
  choice: à boca
  rationale: Tradução direta e idiomática; o possessivo é dispensável em português porque a relação com o sujeito é inequívoca.
