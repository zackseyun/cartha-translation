  text: One who sends messages by the hand of a fool cuts off his feet and drinks violence[a].
translation:
  language: pt
  text: Quem envia mensagens pela mão de um insensato corta os próprios pés e bebe violência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palavras” em vez de “mensagens”; o termo hebraico pode ter ambos os sentidos, mas aqui provavelmente se refere a uma comunicação confiada a um mensageiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַצֶּה
  choice: corta
  rationale: O particípio piel de קצה expressa cortar ou decepar. “Corta” preserva a imagem forte e permite que “os próprios pés” deixe claro o dano autoinfligido, sem tornar a formulação excessivamente gráfica.
- source_word: רַגְלַיִם
  choice: os próprios pés
  rationale: O dual designa os pés. “Próprios” explicita em português o sentido proverbial de que o remetente causa dano a si mesmo, implícito na construção hebraica.
- source_word: חָמָס
  choice: violência
  rationale: חָמָס pode indicar violência, injustiça ou dano destrutivo. “Violência” mantém o caráter concreto e contundente da imagem.
- source_word: שֹׁתֶה
  choice: bebe
  rationale: Tradução literal do particípio de שתה, preservando a metáfora hebraica de ingerir o próprio dano.
- source_word: שֹׁלֵחַ
  choice: Quem envia
  rationale: Reproduz de modo natural a força genérica do particípio proverbial.
- source_word: דְּבָרִים
  choice: mensagens
  rationale: Embora o termo possa significar literalmente “palavras”, no contexto de algo confiado à mão de um mensageiro ele provavelmente se refere a comunicações ou mensagens.
- source_word: בְּיַד
  choice: pelas mãos de
  rationale: Mantém a imagem concreta do idioma hebraico de agência. O plural concorda naturalmente em português com a referência genérica a “um insensato”, embora o hebraico use o singular “mão”.
- source_word: כְּסִיל
  choice: um insensato
  rationale: Em Provérbios, o termo caracteriza alguém moral e praticamente imprudente, não apenas uma pessoa com pouca capacidade intelectual. “Insensato” é digno, claro e tradicional sem soar como mero insulto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira e alcance internacional. A construção conserva as duas imagens abruptas do hebraico — cortar os próprios pés e beber violência — sem suavizá-las.
