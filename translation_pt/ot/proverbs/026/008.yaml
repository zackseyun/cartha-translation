base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/008.yaml
  text: Like one who binds a stone in a sling[a], so is one who gives honor to a fool.
translation:
  language: pt
  text: Como quem amarra uma pedra numa funda[a], assim é quem dá honra ao insensato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Como pôr uma pedra num monte de pedras, assim é quem dá honra ao insensato.” O termo hebraico traduzido por “funda” tem sentido lexical incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּצְרוֹר
  choice: Como quem amarra
  rationale: A forma é mais provavelmente derivada do verbo צרר, “amarrar, atar”. A construção “como quem amarra” preserva a imagem concreta e introduz naturalmente a comparação proverbial em português.
- source_word: אֶבֶן
  choice: uma pedra
  rationale: אֶבֶן significa normalmente “pedra”, termo simples e adequado à provável imagem de uma funda.
- source_word: בְּמַרְגֵּמָה
  choice: numa funda
  rationale: O substantivo é lexicalmente incerto, mas “funda” produz uma imagem coerente no contexto. A interpretação alternativa, “monte de pedras”, é preservada em nota.
- source_word: כֵּן
  choice: assim é
  rationale: כֵּן estabelece a correspondência entre a imagem inicial e sua aplicação. “Assim é” conserva explicitamente essa estrutura comparativa.
- source_word: נוֹתֵן
  choice: quem dá
  rationale: O particípio expressa uma pessoa genérica caracterizada pela ação; “quem dá” comunica esse sentido de modo natural e sem especificar gênero.
- source_word: לִכְסִיל
  choice: ao insensato
  rationale: כְּסִיל designa em Provérbios a pessoa moralmente obtusa e obstinada. “Insensato” mantém o tom sapiencial e evita sugerir mera falta de inteligência.
- source_word: כָּבוֹד
  choice: honra
  rationale: Neste contexto, כָּבוֹד se refere à honra ou estima social. “Honra” é a correspondência portuguesa mais clara e direta.
