  text: אַל תַּ֣עַן כְּ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּֽן תִּשְׁוֶה לּ֥/וֹ גַם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/004.yaml
  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
translation:
  language: pt
  text: Não responda ao insensato segundo a sua insensatez[a], para que você também não se torne semelhante a ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de maneira insensata”. A expressão hebraica também pode indicar uma resposta que imita a própria insensatez do insensato.'
    reason: lexical_alternative
  - marker: b
    text: 'O versículo seguinte dá a orientação complementar: “Responda ao insensato segundo a sua insensatez”. Juntos, os dois provérbios exigem discernimento conforme a situação, em vez de estabelecerem regras contraditórias.'
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּעַן
  choice: Não responda
  rationale: אַל com o imperfeito expressa proibição; “não responda” é natural em português e mantém o vínculo verbal com o versículo seguinte.
- source_word: כְּסִיל
  choice: ao insensato
  rationale: כְּסִיל designa, na literatura sapiencial, alguém moral e intelectualmente obstinado, não apenas uma pessoa com pouca inteligência. “Insensato” preserva esse caráter sapiencial com dignidade e clareza.
- source_word: כְאִוַּלְתּוֹ
  choice: segundo a sua insensatez
  rationale: A preposição כְּ indica correspondência. A formulação mantém a ambiguidade entre responder de modo insensato e responder em termos correspondentes à insensatez, preservando a tensão deliberada com Provérbios 26:5.
- source_word: פֶּן
  choice: para que ... não
  rationale: פֶּן introduz uma consequência negativa a evitar. “Para que... não” é corrente e claro no português moderno.
- source_word: תִּשְׁוֶה לּוֹ
  choice: você ... se torne semelhante a ele
  rationale: O verbo שׁוה com לְ exprime igualdade ou semelhança. “Tornar-se semelhante a ele” comunica naturalmente o risco de passar a compartilhar a conduta do insensato.
- source_word: גַם אָתָּה
  choice: você também
  rationale: A expressão enfatiza que o próprio interlocutor pode acabar semelhante ao insensato.
theological_decisions:
- issue: Tensão interpretativa com Provérbios 26:5
  choice: Manter “segundo a sua insensatez” sem restringir o sentido.
  alternative: “de maneira insensata” ou “como a sua insensatez merece”
  rationale: Os provérbios emparelhados apresentam orientações complementares que exigem discernimento situacional. A tradução não deve eliminar a tensão ao escolher apenas uma das possíveis nuances.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Insensato” preserva o vocabulário sapiencial; a ordem da frase acompanha de perto o hebraico sem soar artificial. Os marcadores foram posicionados junto às afirmações que esclarecem.
