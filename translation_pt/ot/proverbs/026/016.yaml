  text: חָכָ֣ם עָצֵ֣ל בְּ/עֵינָ֑י/ו מִ֝/שִּׁבְעָ֗ה מְשִׁ֣יבֵי טָֽעַם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/016.yaml
  text: A sluggard is wiser in his own eyes than seven who answer with discernment[a].
translation:
  language: pt
  text: Aos seus próprios olhos, o preguiçoso é mais sábio do que sete pessoas que respondem com discernimento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do que sete pessoas capazes de dar uma resposta sensata”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: mais sábio
  rationale: O adjetivo predicativo integra uma construção comparativa marcada por מִן; “mais sábio” expressa essa relação com naturalidade em português.
- source_word: עָצֵל
  choice: o preguiçoso
  rationale: Designa, na literatura sapiencial, a pessoa caracterizada pela preguiça habitual. A forma substantivada é concisa e preserva o tom proverbial.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: A expressão hebraica indica a avaliação que a pessoa faz de si mesma; “próprios” explicita seu valor reflexivo sem alterar o sentido.
- source_word: מִשִּׁבְעָה
  choice: do que sete pessoas
  rationale: A preposição מִן introduz a comparação. “Pessoas” evita restringir indevidamente o referente pelo gênero em português.
- source_word: מְשִׁיבֵי
  choice: que respondem
  rationale: O particípio descreve aqueles que dão uma resposta; a formulação direta conserva a concisão do provérbio.
- source_word: טָעַם
  choice: com discernimento
  rationale: Neste contexto, o termo denota juízo, sensatez ou discernimento, não o sentido literal de “sabor”. “Discernimento” preserva sua ligação com a sabedoria.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. A anteposição de “Aos seus próprios olhos” destaca desde o início que a sabedoria atribuída ao preguiçoso é apenas sua própria avaliação.
