base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/012.yaml
  text: Do you see a man wise in his own eyes? There is more hope for a fool than for him[a].
translation:
  language: pt
  text: Você vê um homem sábio aos seus próprios olhos? Há mais esperança para o insensato do que para ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você já viu um homem sábio aos seus próprios olhos?” O perfeito hebraico pode ser entendido como uma observação retórica ou como uma pergunta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָ
  choice: Você vê
  rationale: O qal perfeito na segunda pessoa masculina singular pode introduzir, na literatura sapiencial, uma observação retórica formulada como pergunta. O presente é natural em português e comunica o caráter proverbial geral.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o singular masculino do hebraico e apresenta o indivíduo como exemplo proverbial.
- source_word: חָכָם
  choice: sábio
  rationale: Adjetivo predicativo que preserva o vocabulário característico da literatura sapiencial e o contraste irônico com כְסִיל.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Conserva a imagem idiomática hebraica de autoavaliação; “próprios” explicita naturalmente o valor reflexivo em português.
- source_word: תִּקְוָה
  choice: esperança
  rationale: Expressa a perspectiva ou possibilidade favorável e mantém a formulação proverbial tradicional e clara.
- source_word: לִכְסִיל
  choice: para o insensato
  rationale: כְסִיל designa em Provérbios alguém moral e intelectualmente obstinado. “Insensato” comunica essa categoria sapiencial sem sugerir apenas falta de inteligência.
- source_word: מִמֶּנּוּ
  choice: do que para ele
  rationale: Traduz a comparação marcada por מִן e identifica concisamente o homem sábio aos próprios olhos como o termo comparado.
theological_decisions: []
