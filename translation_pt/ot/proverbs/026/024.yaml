base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/024.yaml
  text: A hater disguises himself with his lips[b][a], but within himself he sets deceit.
translation:
  language: pt
  text: Quem odeia se disfarça com os lábios,[a] mas, no íntimo,[b] põe engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “finge com os lábios”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “dentro dele” ou “em seu interior”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִשְׂפָתוֹ
  choice: com os lábios
  rationale: O בְּ tem valor instrumental, e a expressão preserva a imagem concreta do hebraico, referindo-se à fala como meio do disfarce.
- source_word: יִנָּכֵר
  choice: se disfarça
  rationale: O nifal de נכר indica aqui fazer-se parecer diferente do que se é. A forma reflexiva comunica de modo natural a dissimulação deliberada.
- source_word: שֹׂנֵא
  choice: quem odeia
  rationale: O particípio substantivado caracteriza uma pessoa por seu ódio. Esta formulação é mais natural e inclusiva em português do que o substantivo pouco corrente 'odiador', sem trocar o sentido por 'inimigo'.
- source_word: וּבְקִרְבּוֹ
  choice: mas, no íntimo
  rationale: קֶרֶב designa o interior da pessoa. 'No íntimo' mantém o contraste entre a expressão exterior dos lábios e a realidade interior, sem especificar 'coração', termo ausente do hebraico.
- source_word: יָשִׁית
  choice: guarda
  rationale: Embora שׁית signifique literalmente 'pôr' ou 'colocar', 'guarda' expressa em português natural que o engano é mantido no interior. Evita a construção pouco idiomática 'põe engano dentro de si'.
- source_word: מִרְמָה
  choice: o engano
  rationale: מִרְמָה denota engano, fraude ou perfídia. 'Engano' é claro e adequado à afirmação sapiencial, sem intensificar indevidamente para 'traição'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem poética mantém o contraste entre a aparência exterior e o engano interior; a vírgula antes da nota [a] pertence à frase e não altera o alcance da nota.
