  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/022.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: pt
  text: As palavras do que espalha murmúrios são como petiscos deliciosos[a] e descem até as câmaras mais íntimas do ventre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como bocados finos” ou “como coisas engolidas com avidez”. O termo hebraico é raro e discutido; uma tradição antiga o traduziu por “como feridas”.
    reason: lexical_alternative
  - marker: b
    text: “As câmaras mais íntimas do ventre” é uma imagem hebraica para as profundezas do interior da pessoa.
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: As palavras do
  rationale: O plural em estado construto de דָּבָר é vertido naturalmente por “as palavras de”, preservando a referência concreta ao que é dito.
- source_word: נִרְגָּן
  choice: o que espalha murmúrios
  rationale: A expressão descreve quem difunde falas murmuradas e divisivas. Evita restringir o sentido a “caluniador” e comunica melhor que o pouco usual “sussurrador” em português.
- source_word: כְּמִתְלַהֲמִים
  choice: como petiscos deliciosos
  rationale: O termo raro e discutido parece indicar bocados atraentes, saboreados ou engolidos com avidez, como também em Provérbios 18:8. A nota conserva as alternativas lexicais, inclusive a tradição antiga “feridas”.
- source_word: וְהֵם
  choice: e
  rationale: O referente plural permanece claro pelo sujeito elíptico de “descem”; explicitar “elas” seria possível, mas menos fluente em português.
- source_word: יָרְדוּ
  choice: descem
  rationale: O presente traduz adequadamente o valor proverbial e habitual do perfeito hebraico neste dito sapiencial.
- source_word: חַדְרֵי בָטֶן
  choice: as câmaras mais íntimas do ventre
  rationale: Mantém a metáfora corporal hebraica de “câmaras do ventre”, ao mesmo tempo que “mais íntimas” torna claro o movimento até o interior profundo da pessoa.
