  text: The sluggard says[a], “There is a lion in the road! A lion in the public squares!”
translation:
  language: pt
  text: 'O preguiçoso diz: “Há um leão no caminho! Um leão no meio das praças públicas!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָצֵל
  choice: preguiçoso
  rationale: O substantivo descreve uma pessoa habitualmente entregue à preguiça, um tipo moral recorrente em Provérbios. “O preguiçoso” preserva essa força proverbial em português natural.
- source_word: אָמַר
  choice: diz
  rationale: Embora a forma hebraica seja formalmente perfeita, no contexto proverbial tem sentido genérico e habitual; o presente comunica melhor o caráter gnômico.
- source_word: שַׁחַל
  choice: leão
  rationale: O termo designa um leão, possivelmente com conotação de força ou ferocidade. A tradução simples preserva a repetição retórica com אֲרִי sem introduzir uma distinção não desenvolvida pelo provérbio.
- source_word: בַּדָּרֶךְ
  choice: no caminho
  rationale: A expressão situa o animal numa via de passagem. “No caminho” é idiomático, concreto e mantém a formulação tradicional sem sugerir apenas obstrução abstrata.
- source_word: אֲרִי
  choice: leão
  rationale: É um termo comum para leão. Repetir a mesma palavra em português reflete o paralelismo sinonímico e a ênfase exagerada da desculpa.
- source_word: בֵּין הָרְחֹבוֹת
  choice: no meio das praças públicas
  rationale: רְחֹבוֹת refere-se a espaços urbanos amplos e abertos, como praças. Aqui בֵּין pode expressar localização em meio a esses lugares; a formulação escolhida conserva essa nuance e soa natural em português.
