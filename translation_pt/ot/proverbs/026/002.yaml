base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/002.yaml
  text: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
translation:
  language: pt
  text: 'Como o pardal que vagueia,

    como a andorinha que voa,

    assim a maldição sem motivo não chega[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não vem”. À luz da imagem das aves, a expressão também pode sugerir que a maldição não pousa sobre ninguém nem produz efeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  choice: Como o pardal
  rationale: צִפּוֹר pode designar uma ave pequena em geral, mas “pardal” é uma identificação tradicional e natural no paralelismo com דְּרוֹר.
- source_word: לָנוּד
  choice: que vagueia
  rationale: נוּד expressa movimento errante ou inquieto; a oração verbal é clara e mantém a imagem poética.
- source_word: כַּדְּרוֹר
  choice: como a andorinha
  rationale: דְּרוֹר é tradicionalmente entendido como “andorinha”, embora a identificação zoológica não seja inteiramente certa.
- source_word: לָעוּף
  choice: que voa
  rationale: עוּף significa voar; a forma verbal preserva o paralelismo simples dos dois primeiros membros.
- source_word: קִלְלַת חִנָּם
  choice: a maldição sem motivo
  rationale: חִנָּם significa literalmente “sem causa/motivo” ou “gratuitamente”; a formulação conserva a estrutura hebraica e indica que a maldição é infundada.
- source_word: לֹא תָבֹא
  choice: não chega
  rationale: בוא significa literalmente “vir/chegar”. A tradução evita inserir no texto principal a ideia interpretativa de pousar ou produzir efeito, deixando-a explicada em nota.
theological_decisions:
- issue: Se uma maldição infundada alcança seu alvo ou produz efeito
  choice: Preservar a afirmação proverbial de que ela “não chega”
  alternative: “não pousa”, “não se cumpre” ou “não produz efeito”
  rationale: O hebraico usa o verbo comum בוא, “vir/chegar”. As alternativas tornam explícita uma implicação possível da comparação com aves, mas também estreitam a ambiguidade entre chegada, repouso e eficácia.
translation_notes:
  register: Português moderno, corrente e digno, com versos breves para conservar o paralelismo proverbial. “Sem motivo” é amplamente compreensível e mantém mais de perto o hebraico do que “imerecida”. O marcador [a] aparece no texto principal.
