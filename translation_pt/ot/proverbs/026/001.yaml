base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/001.yaml
  text: Like snow in summer and like rain at harvest[a], so honor is not fitting for a fool.
translation:
  language: pt
  text: Como neve no verão e como chuva na colheita, assim a honra não convém ao insensato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּשֶּׁלֶג
  choice: Como neve
  rationale: O prefixo כ marca comparação. “Como neve” preserva a imagem e soa natural em português.
- source_word: בַּקַּיִץ
  choice: no verão
  rationale: Designa a estação quente e seca; a formulação é idiomática e concisa.
- source_word: וְכַמָּטָר
  choice: e como chuva
  rationale: Mantém a segunda comparação em paralelo equilibrado com a primeira.
- source_word: בַּקָּצִיר
  choice: na colheita
  rationale: קָצִיר denota a colheita ou o tempo da colheita. “Na colheita” conserva de modo natural o cenário sazonal.
- source_word: כֵּן
  choice: assim
  rationale: Introduz a conclusão da comparação e mantém o estilo proverbial.
- source_word: לֹא נָאוֶה
  choice: não convém
  rationale: נָאוֶה expressa aquilo que é apropriado, adequado ou decoroso. “Não convém” comunica essa inadequação com concisão e dignidade.
- source_word: לִכְסִיל
  choice: ao insensato
  rationale: A preposição ל liga a ideia de conveniência ao destinatário. “Insensato” é uma designação corrente e digna para o tipo moral de כְּסִיל na literatura sapiencial.
- source_word: כָּבוֹד
  choice: a honra
  rationale: Neste contexto, כָּבוֹד indica honra ou estima social, não glória divina.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo preservado. “Insensato” evita o tom meramente insultuoso que “tolo” pode assumir no uso atual e conserva a dimensão moral e sapiencial do termo hebraico.
