base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/007.yaml
  text: Like the legs that hang limp from a lame man[a], so is a proverb in the mouth of fools.
translation:
  language: pt
  text: Como as pernas pendem frouxas de uma pessoa manca[a], assim é o provérbio na boca dos tolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As pernas de uma pessoa manca pendem; assim também um provérbio está na boca dos tolos.”'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: דַּלְיוּ
  choice: pendem sem força
  rationale: Expressa a imagem de membros caídos, frouxos ou pendentes, e não apenas de fraqueza em sentido abstrato.
- source_word: שֹׁקַיִם
  choice: pernas
  rationale: Embora o termo possa designar mais especificamente as partes inferiores das pernas ou as coxas, “pernas” é natural e suficientemente preciso no contexto.
- source_word: מִפִּסֵּחַ
  choice: de uma pessoa manca
  rationale: 'A preposição indica origem ou associação: as pernas pertencem à pessoa ou pendem dela. A formulação é clara, atual e respeitosa.'
- source_word: וּמָשָׁל
  choice: assim é o provérbio
  rationale: A conjunção introduz a segunda metade da comparação; explicitar “assim” comunica naturalmente a força do paralelismo hebraico.
- source_word: מָשָׁל
  choice: provérbio
  rationale: No livro de Provérbios, o termo designa naturalmente um provérbio ou dito sapiencial.
- source_word: בְּפִי
  choice: na boca
  rationale: Preserva a metáfora concreta hebraica para aquilo que alguém profere.
- source_word: כְסִילִים
  choice: dos tolos
  rationale: Mantém a categoria moral e intelectual característica da literatura sapiencial, sem reduzi-la a mera falta de inteligência.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pessoa manca” evita um rótulo substantivado sem apagar a imagem concreta do hebraico; “na boca” conserva a expressão figurada original.
