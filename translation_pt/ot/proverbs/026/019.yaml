  yaml_path: translation/ot/proverbs/026/019.yaml
  text: So is the man who deceives his neighbor and says[b][a], “Am I not only joking?”
translation:
  language: pt
  text: 'Assim é o homem que engana o seu próximo[a] e diz: “Não estou apenas brincando?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu amigo” ou “seu companheiro”. O termo hebraico pode designar um próximo, amigo ou companheiro, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “Não estou jogando?” ou “Não estou gracejando?”. O particípio hebraico pode indicar brincar, jogar ou gracejar; aqui, serve como desculpa para minimizar um engano prejudicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim é
  rationale: Retoma a comparação do versículo anterior e preserva a força analógica da expressão hebraica.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o singular masculino representativo do texto hebraico, de modo natural no gênero proverbial.
- source_word: רִמָּה
  choice: engana
  rationale: Expressa diretamente a ação enganosa praticada contra outra pessoa, sem restringi-la a uma forma específica de fraude.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: Abrange a relação social indicada por רֵעַ sem pressupor a intimidade de uma amizade; a nota registra outras possibilidades lexicais.
- source_word: וְאָמַר
  choice: e diz
  rationale: O presente caracteriza a conduta habitual ou típica descrita pelo provérbio.
- source_word: הֲלֹא מְשַׂחֵק אָנִי
  choice: Eu não estava apenas brincando?
  rationale: Reproduz como pergunta retórica a desculpa usada para minimizar o engano. O imperfeito perifrástico é idiomático em português para alguém que justifica retrospectivamente sua conduta, e “apenas” explicita o tom de minimização contextual.
