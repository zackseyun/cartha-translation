  text: רַ֥ב מְחֽוֹלֵֽל כֹּ֑ל וְ/שֹׂכֵ֥ר כְּ֝סִ֗יל וְ/שֹׂכֵ֥ר עֹבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/010.yaml
  text: Like an archer who wounds everyone is one who hires a fool or hires passersby[a][b].
translation:
  language: pt
  text: Como um arqueiro que fere a todos é quem contrata um insensato ou quem contrata qualquer um que passa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico é notoriamente difícil. “Como um arqueiro que fere a todos” segue uma interpretação antiga. Outras traduções entendem o início de modo mais literal, como “Um grande homem produz todas as coisas” ou algo semelhante, mas essas opções são menos coerentes no contexto.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “contrata um insensato e contrata qualquer um que passa”. A ideia é a contratação indiscriminada que causa dano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב
  choice: como um arqueiro
  rationale: Embora רַב normalmente signifique “grande”, “mestre” ou “muitos”, o texto consonantal é extremamente difícil. A interpretação tradicional como “arqueiro” produz uma comparação coerente com o dano indiscriminado descrito no restante do provérbio.
- source_word: מְחוֹלֵל
  choice: que fere
  rationale: Neste contexto, o particípio é entendido como ação que causa ferimento ou dor. “Fere” preserva de modo claro e conciso a imagem nociva do arqueiro.
- source_word: כֹּל
  choice: a todos
  rationale: Na imagem de um arqueiro que atinge pessoas indiscriminadamente, o sentido pessoal “a todos” é mais natural do que “tudo”.
- source_word: וְשֹׂכֵר
  choice: é quem contrata
  rationale: O primeiro וְשֹׂכֵר liga a imagem inicial à sua aplicação. A cópula explícita em português torna clara a estrutura comparativa sem alterar o sentido.
- source_word: כְּסִיל
  choice: um insensato
  rationale: “Insensato” é uma tradução corrente em Provérbios e conserva a dimensão moral e intelectual de כְּסִיל, sem se reduzir à falta de inteligência.
- source_word: וְשֹׂכֵר
  choice: ou quem contrata
  rationale: A repetição do particípio introduz outra forma da mesma contratação imprudente. “Ou” comunica naturalmente a alternativa, embora o hebraico também possa ser entendido de modo cumulativo.
- source_word: עֹבְרִים
  choice: qualquer um que passa
  rationale: O particípio de עבר designa os que passam. Com “qualquer um”, a expressão comunica em português a contratação aleatória e indiscriminada sugerida pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a imagem tradicional do arqueiro, explicita a comparação de modo idiomático e conserva em nota tanto a dificuldade textual quanto a possibilidade de ler a segunda conjunção como cumulativa.
