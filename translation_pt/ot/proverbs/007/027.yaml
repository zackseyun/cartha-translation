  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
translation:
  language: pt
  text: A casa dela são caminhos para o Sheol[a], que descem às câmaras da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A casa dela é caminho para o Sheol”. O hebraico usa o plural “caminhos”, que pode ser entendido coletivamente. Sheol é o domínio dos mortos; outra tradução possível é “sepultura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  choice: caminho
  rationale: O plural construto significa literalmente “caminhos/veredas”, mas pode ter sentido coletivo. Em português, o singular “é caminho para” comunica com naturalidade que a casa conduz ao destino indicado; a forma plural é registrada em nota.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos, sem reduzi-lo à sepultura física nem identificá-lo indevidamente com uma doutrina posterior do inferno.
- source_word: בֵּיתָהּ
  choice: A casa dela
  rationale: Tradução direta e natural; no contexto, designa a casa da mulher e, por extensão, o lugar para o qual ela atrai suas vítimas.
- source_word: יֹרְדוֹת
  choice: descendo
  rationale: Preserva a imagem vívida e a força participial do feminino plural hebraico. Embora sua concordância formal seja com “caminhos”, o gerúndio português permite conservar o movimento descendente após o singular coletivo.
- source_word: אֶל
  choice: às
  rationale: Expressa direção para as câmaras da morte de modo conciso e idiomático.
- source_word: חַדְרֵי
  choice: câmaras
  rationale: Conserva a imagem de aposentos interiores e o tom poético e ameaçador, mais marcado que “quartos”.
- source_word: מָוֶת
  choice: morte
  rationale: Traduz o substantivo comum sem impor uma personificação que o hebraico não exige.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos
  rationale: A transliteração preserva a referência hebraica ao domínio dos mortos, mais ampla que uma sepultura individual, sem importar a noção posterior de inferno.
- issue: Plural דַּרְכֵי com predicado בֵּיתָהּ
  choice: 'singular coletivo: “é caminho”'
  alternative: “são caminhos” / “é um dos caminhos”
  rationale: O hebraico apresenta literalmente “caminhos do Sheol [é] a casa dela”, construção cuja relação predicativa pode soar rígida em português. O singular coletivo oferece uma leitura natural sem resolver excessivamente a imagem; a forma plural é preservada na nota.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Câmaras da morte” preserva o paralelismo poético e o caráter ominoso; “Sheol” mantém a precisão cultural e teológica, explicado em nota.
