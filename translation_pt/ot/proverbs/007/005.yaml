  text: לִ֭/שְׁמָרְ/ךָ מֵ/אִשָּׁ֣ה זָרָ֑ה מִ֝/נָּכְרִיָּ֗ה אֲמָרֶ֥י/הָ הֶחֱלִֽיקָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/005.yaml
  text: to keep you from the forbidden woman[a], from the foreign woman whose words are smooth.
translation:
  language: pt
  text: para proteger você da mulher proibida, da estrangeira que suavizou suas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que lisonjeia com suas palavras”. O hebraico diz literalmente “suavizou suas palavras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: para proteger você
  rationale: O infinitivo com לִ expressa propósito em continuidade com o versículo anterior. “Proteger você” comunica de modo natural o sentido de guardar ou preservar de um perigo.
- source_word: מֵאִשָּׁה זָרָה
  choice: da mulher proibida
  rationale: Embora זָרָה possa significar literalmente “estranha” ou “alheia”, em Provérbios a expressão designa a mulher que está fora dos limites legítimos da relação sexual. “Mulher proibida” transmite essa força moral sem sugerir apenas alguém desconhecido.
- source_word: מִנָּכְרִיָּה
  choice: da estrangeira
  rationale: נָכְרִיָּה tem mais diretamente o sentido de mulher estrangeira ou alheia. A escolha preserva a distinção lexical em relação a זָרָה no paralelismo, sem eliminar a conotação contextual de sedução ilícita.
- source_word: אֲמָרֶיהָ
  choice: as suas palavras
  rationale: O substantivo plural significa “palavras” ou “ditos” dela. O possessivo retoma naturalmente “a estrangeira” em português.
- source_word: הֶחֱלִיקָה
  choice: torna suaves
  rationale: O hifil de חלק significa literalmente “tornar liso/suave” e, aplicado à fala, sugere linguagem sedutora ou lisonjeira. A tradução mantém a imagem concreta e deixa explícita na nota a nuance metafórica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção de boa legibilidade no Brasil. Mantém-se a diferença entre זָרָה (“proibida”, no sentido contextual) e נָכְרִיָּה (“estrangeira”), bem como a imagem hebraica das palavras tornadas suaves.
