revisions:
- from: E eis que uma mulher veio ao encontro dele, com traje de prostituta e coração dissimulado[a].
  to: E eis que uma mulher veio ao encontro dele, com traje de prostituta e de coração reservado[a].
  rationale: A revisão limita-se à expressão final. “De coração reservado” reproduz de modo natural a metáfora de um coração guardado, sem decidir indevidamente entre os sentidos possíveis de reserva, ocultação e astúcia. A nota explicita as alternativas contextualmente plausíveis e preserva o sentido literal.
