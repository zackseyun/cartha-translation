base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/010.yaml
  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
translation:
  language: pt
  text: E eis que uma mulher veio ao encontro dele, com traje de prostituta e de coração reservado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de coração astuto”, “de coração dissimulado” ou “de coração oculto”. O hebraico diz literalmente “guardada de coração” e pode sugerir intenções encobertas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a introdução vívida e deítica da cena; é uma fórmula digna e ainda compreensível no português atual.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O contexto apresenta uma figura feminina ainda não identificada; “mulher” é o equivalente natural, sem pressupor aqui o sentido de “esposa”.
- source_word: לִקְרָאתוֹ
  choice: veio ao encontro dele
  rationale: Expressa de modo idiomático o movimento direto para encontrá-lo, implícito na construção hebraica.
- source_word: שִׁית זוֹנָה
  choice: com traje de prostituta
  rationale: Mantém a referência concreta à vestimenta ou aparência característica, sem recorrer a termos arcaicos ou pejorativos além do tom do hebraico.
- source_word: וּנְצֻרַת לֵב
  choice: e coração dissimulado
  rationale: A expressão literalmente associa o coração a algo guardado ou oculto. “Dissimulado” comunica intenções encobertas e a provável ideia contextual de astúcia, sem eliminar a ambiguidade da metáfora.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “E eis que” conserva a vivacidade narrativa; “coração dissimulado” preserva a imagem hebraica e sua ambiguidade melhor do que uma paráfrase puramente psicológica.
