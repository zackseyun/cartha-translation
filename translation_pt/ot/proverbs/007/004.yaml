base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/004.yaml
  text: Say to wisdom[a], “You are my sister,” and call understanding your kinswoman,
translation:
  language: pt
  text: 'Diga à sabedoria: “Você é minha irmã”, e chame o entendimento de sua parente[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amiga íntima” ou “conhecida próxima”. O termo hebraico pode designar alguém conhecido de perto e, conforme o contexto, também um parente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Diga
  rationale: Imperativo masculino singular de אמר. “Diga” introduz naturalmente o discurso direto e mantém a exortação.
- source_word: לַחָכְמָה
  choice: à sabedoria
  rationale: A preposição ל marca a destinatária da fala; “sabedoria” preserva a personificação central de Provérbios.
- source_word: אֲחֹתִי אָתְּ
  choice: Você é minha irmã
  rationale: Mantém o termo literal de parentesco e explicita a cópula exigida pelo português. “Você” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: וּמוֹדָע
  choice: seu parente
  rationale: מוֹדָע designa alguém conhecido e pode indicar uma relação de parentesco ou de intimidade. “Parente” preserva o paralelismo familiar com “irmã”, sem especificar um grau de parentesco inexistente no hebraico.
- source_word: לַבִּינָה
  choice: o entendimento
  rationale: בִּינָה denota entendimento ou discernimento; “entendimento” mantém a associação tradicional e clara com “sabedoria”.
- source_word: תִקְרָא
  choice: chame
  rationale: A forma verbal tem força diretiva em paralelo com o imperativo inicial; “chame ... de” expressa em português a atribuição do nome ou relação.
