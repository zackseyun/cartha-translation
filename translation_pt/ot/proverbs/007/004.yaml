  verdict: revise
  source_fidelity: A tradução preserva corretamente os dois imperativos, a personificação feminina de sabedoria e entendimento e a metáfora de parentesco. Contudo, «seu parente» é ambíguo quanto ao possuidor e soa pouco natural para designar o entendimento personificado; a forma feminina esclarece a relação metafórica e se harmoniza com «minha irmã».
  naturalness: '«Diga à sabedoria: “Você é minha irmã”» é moderno e natural. Em «chame o entendimento de seu parente», porém, «seu» pode ser entendido como referente a «o entendimento», e o masculino enfraquece a personificação feminina. «Chame o entendimento de sua parente» é mais claro e idiomático.'
  terminology: «Sabedoria» e «entendimento» são equivalentes estabelecidos e adequados para חָכְמָה e בִּינָה. «Parente» é uma opção defensável para מוֹדָע neste paralelismo, desde que a nota mantenha as alternativas de intimidade/conhecimento próximo.
  issues:
