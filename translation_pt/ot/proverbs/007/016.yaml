translation:
  language: pt
  text: Cobri a minha cama com cobertas ornamentais[a], com tecidos coloridos de linho do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Enfeitei a minha cama com trabalhos entalhados, com tecido do Egito”. Os termos hebraicos para as cobertas decoradas e o material egípcio são raros e talvez se refiram mais especificamente a tecidos estampados ou bordados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: cobertas ornamentais
  rationale: O plural designa cobertas ou mantas estendidas para adornar o leito. A expressão é natural em português e conserva o caráter luxuoso sem sugerir especificamente tapetes de chão.
- source_word: רָבַדְתִּי
  choice: Estendi
  rationale: O verbo indica estender ou dispor em camadas; o pretérito comunica que a preparação do leito já foi concluída.
- source_word: עַרְשִׂי
  choice: a minha cama
  rationale: O substantivo pode indicar cama ou divã. No português atual, “cama” é a opção mais clara e natural no contexto íntimo, sem perder o sentido do original.
- source_word: חֲטֻבוֹת
  choice: tecidos coloridos
  rationale: O termo raro pode descrever peças trabalhadas, estampadas ou multicoloridas. A tradução preserva a referência provável a tecidos decorativos sem definir uma técnica específica.
- source_word: אֵטוּן
  choice: linho
  rationale: O vocábulo raro se refere a um material têxtil fino, entendido de modos diversos como fio, tecido ou linho. “Linho” é adequado ao contexto de artigos luxuosos, mas a incerteza é registrada na nota.
- source_word: מִצְרָיִם
  choice: do Egito
  rationale: Reproduz diretamente a origem egípcia expressa no hebraico e mantém a associação com um tecido importado de luxo.
