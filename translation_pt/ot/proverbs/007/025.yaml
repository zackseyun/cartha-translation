  text: אַל יֵ֣שְׂטְ אֶל דְּרָכֶ֣י/הָ לִבֶּ֑/ךָ אַל תֵּ֝תַע בִּ/נְתִיבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/025.yaml
  text: Do not let your heart turn aside to her ways; do not wander into her paths.
translation:
  language: pt
  text: Não deixe que seu coração se desvie para os caminhos dela; não vagueie por suas veredas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשְׂטְ
  choice: se desviar
  rationale: O verbo expressa afastar-se ou desviar-se da direção correta; a construção portuguesa mantém o coração como sujeito sem tornar explícita uma causação que o hebraico não exige.
- source_word: דְּרָכֶיהָ
  choice: os caminhos dela
  rationale: Equivalente natural e direto para a imagem plural de modos ou caminhos associados à mulher descrita no contexto.
- source_word: תֵּתַע
  choice: vagueie
  rationale: Preserva a ideia de andar errante, extraviar-se ou perambular, sem reduzir o sentido a um simples movimento pontual.
- source_word: נְתִיבוֹתֶיהָ
  choice: as veredas dela
  rationale: Mantém a metáfora espacial e distingue נְתִיבוֹת de דְּרָכִים com um termo português corrente em registro bíblico digno.
theological_decisions:
- issue: Agência moral do coração
  choice: Não deixe seu coração se desviar
  alternative: Que seu coração não se desvie
  rationale: A formulação conserva a exortação dirigida ao ouvinte e a imagem hebraica do coração desviando-se, sem acrescentar uma explicação doutrinária sobre vontade ou tentação.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado entre “caminhos” e “veredas”. Não há necessidade de notas textuais ou lexicais neste versículo.
