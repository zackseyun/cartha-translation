id: PRO.7.2
reference: Proverbs 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁמֹ֣ר מִצְוֺתַ֣/י וֶ/חְיֵ֑ה וְ֝/תוֹרָתִ֗/י כְּ/אִישׁ֥וֹן עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
translation:
  language: pt
  text: Guarde os meus mandamentos e viva; guarde o meu ensino como a menina dos seus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como a pupila dos seus olhos”. A expressão hebraica indica algo que deve ser protegido com o máximo cuidado.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר
  choice: Guarde
  rationale: O imperativo de שׁמר reúne as ideias de observar e proteger com cuidado; “guarde” funciona naturalmente tanto com “mandamentos” quanto, de modo elíptico, com “ensino”.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: Preserva diretamente o plural com sufixo de primeira pessoa e o caráter normativo de מִצְוָה.
- source_word: וֶחְיֵה
  choice: e viva
  rationale: 'Mantém a coordenação concisa do hebraico e deixa perceptível, sem explicitá-la demais, a possível nuance de resultado: guardar os mandamentos conduz à vida.'
- source_word: וְתוֹרָתִי
  choice: o meu ensino
  rationale: Em Provérbios, תּוֹרָה designa sobretudo a instrução transmitida pelo mestre ou pai, não apenas legislação; “ensino” é claro e natural em português.
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  choice: como a menina dos seus olhos
  rationale: “Menina dos olhos” é uma expressão portuguesa corrente para a pupila e conserva a força idiomática de algo protegido com extremo cuidado.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto sapiencial
  choice: ensino
  alternative: lei; instrução
  rationale: “Ensino” preserva o sentido sapiencial e parental do termo sem restringi-lo à legislação mosaica nem reduzi-lo a mera informação.
- issue: Relação entre guardar os mandamentos e viver
  choice: e viva
  alternative: para que viva; e você viverá
  rationale: A forma coordenada conserva a tensão do original entre segundo imperativo e consequência implícita, sem definir de modo excessivo a natureza da vida prometida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “guarde” na segunda oração torna explícito em português o verbo subentendido no hebraico. O idiomatismo “menina dos seus olhos” foi mantido no texto, enquanto a referência anatômica à pupila aparece na nota.
