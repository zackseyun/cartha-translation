base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/021.yaml
  text: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
translation:
  language: pt
  text: Com sua grande persuasão, ela o faz ceder; com a suavidade de seus lábios, ela o arrasta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Com muita persuasão, ela o desvia; com a fala suave de seus lábios, ela o impele.”'
    reason: Alternativa lexical que preserva mais diretamente os sentidos de desviar em הִטַּתּוּ e de impelir em תַּדִּיחֶנּוּ.
lexical_decisions:
- source_word: הִטַּתּוּ
  choice: ela o faz ceder
  rationale: O hifil de נטה indica fazer alguém inclinar-se, desviar-se ou deixar-se convencer. No contexto, “faz ceder” exprime naturalmente o efeito da persuasão sem acrescentar explicitamente a nuance sexual de “seduz”.
- source_word: בְּרֹב לִקְחָהּ
  choice: com sua grande persuasão
  rationale: רֹב indica grande quantidade ou abundância, e לֶקַח pode designar instrução ou discurso persuasivo. Aqui, o contexto de aliciamento favorece “grande persuasão”, preservando o valor instrumental da preposição.
- source_word: בְּחֵלֶק
  choice: com a suavidade de
  rationale: חֵלֶק descreve a qualidade lisa ou suave da fala, frequentemente com a conotação de lisonja. “Suavidade” mantém a imagem hebraica sem reduzi-la diretamente a uma interpretação.
- source_word: שְׂפָתֶיהָ
  choice: seus lábios
  rationale: Tradução literal que conserva a imagem concreta e poética do hebraico.
- source_word: תַּדִּיחֶנּוּ
  choice: ela o arrasta
  rationale: O hifil de נדח pode significar impelir, conduzir ou desviar. “Arrasta” comunica a forte pressão que o leva adiante e preserva o movimento da imagem, sem tornar explícita no texto principal a interpretação moral “desvia”.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com leitura fluida no Brasil e compreensão internacional. O paralelismo e a imagem dos lábios foram preservados; evitou-se “seduz”, que explicitaria uma nuance fornecida pelo contexto mais amplo, e não apenas por este versículo.
