  text: בְּ֭נִ/י שְׁמֹ֣ר אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/001.yaml
  text: My son[a], keep my words, and treasure up my commandments with you.
translation:
  language: pt
  text: Meu filho, guarde as minhas palavras e mantenha consigo os meus mandamentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico pode também sugerir guardar cuidadosamente ou esconder algo para mantê-lo em segurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: A expressão hebraica está no singular masculino e traz o sufixo de primeira pessoa; é a forma direta de tratamento paterno característica de Provérbios.
- source_word: שְׁמֹר
  choice: guarde
  rationale: O imperativo comunica a ideia de preservar atentamente e também observar a instrução; “guarde” mantém essa amplitude em português.
- source_word: אֲמָרָי
  choice: as minhas palavras
  rationale: O plural se refere às instruções proferidas pelo mestre; “palavras” é amplo, natural e fiel ao hebraico.
- source_word: וּמִצְוֺתַי
  choice: e os meus mandamentos
  rationale: “Mandamentos” preserva o peso instrutivo e moral de מִצְוָה sem restringir o termo a simples conselhos.
- source_word: תִּצְפֹּן
  choice: conserve
  rationale: O verbo descreve guardar, armazenar ou esconder algo com cuidado. “Conserve” expressa aqui a preservação deliberada e evita uma repetição imediata de “guarde”.
- source_word: אִתָּךְ
  choice: consigo
  rationale: A expressão significa literalmente “com você”; após o imperativo dirigido por “Meu filho”, “consigo” é a formulação portuguesa natural e preserva a ideia de manter os mandamentos em sua posse ou perto de si.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A construção mantém o paralelismo do hebraico e distingue os dois verbos por meio de “guarde” e “conserve”.
