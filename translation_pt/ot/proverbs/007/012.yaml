  text: פַּ֤עַם בַּ/ח֗וּץ פַּ֥עַם בָּ/רְחֹב֑וֹת וְ/אֵ֖צֶל כָּל פִּנָּ֣ה תֶאֱרֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/012.yaml
  text: In the street[a], now in the squares[b], and beside every corner she lies in wait.
translation:
  language: pt
  text: Ora está na rua, ora nas praças; junto a cada esquina, fica à espreita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arma emboscada”. O verbo hebraico descreve uma espera furtiva, com intenção predatória.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  choice: ora ... ora
  rationale: A repetição marca alternância de lugar. “Ora... ora” preserva essa movimentação vívida sem introduzir um marcador discursivo ausente no hebraico.
- source_word: בַּחוּץ
  choice: na rua
  rationale: חוּץ designa aqui o espaço público exterior; “na rua” é natural no cenário urbano e contrasta adequadamente com as praças.
- source_word: בָּרְחֹבוֹת
  choice: nas praças
  rationale: רְחֹבוֹת pode indicar espaços públicos amplos e abertos da cidade; “praças” evita repetir “rua” e mantém a distinção espacial.
- source_word: וְאֵצֶל כָּל פִּנָּה
  choice: junto a cada esquina
  rationale: אֵצֶל expressa proximidade, e פִּנָּה significa “esquina” ou “canto”; a formulação é clara e idiomática em português.
- source_word: תֶאֱרֹב
  choice: fica à espreita
  rationale: O verbo ארב descreve uma espera oculta e predatória, frequentemente ligada a uma emboscada. “Fica à espreita” comunica essa nuance com naturalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão, com boa legibilidade brasileira. A estrutura “ora... ora” reproduz a alternância do hebraico, e o ponto e vírgula organiza naturalmente as duas partes do verso.
