base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/006.yaml
  text: For at the window of my house[a], through my lattice, I looked out,
translation:
  language: pt
  text: Pois, à janela da minha casa, pela minha treliça[a], olhei para fora,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: pela minha gelosia. O termo hebraico designa uma abertura com grade ou treliça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou a base narrativa do que vem a seguir, preservando a ligação discursiva sem impor uma causalidade rígida.
- source_word: בְּחַלּוֹן בֵּיתִי
  choice: à janela da minha casa
  rationale: חַלּוֹן significa “janela”; com בְּ, a expressão situa o observador junto à janela. A formulação é natural em português e mantém a referência concreta à casa do narrador.
- source_word: בְּעַד
  choice: por entre
  rationale: A preposição indica que o olhar passa através de uma abertura ou de sua estrutura. “Por entre” combina naturalmente com “treliça” e conserva a imagem visual.
- source_word: אֶשְׁנַבִּי
  choice: a treliça
  rationale: O substantivo designa uma abertura provida de grade ou treliça. “Treliça” distingue este elemento da “janela” mencionada antes e mantém a imagem arquitetônica.
- source_word: נִשְׁקָפְתִּי
  choice: olhei para fora
  rationale: O verbo descreve o ato de olhar para fora, muitas vezes de um ponto elevado. A tradução comunica a observação sem acrescentar intensidade não expressa no hebraico.
