  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי רַבִּ֣ים חֲלָלִ֣ים הִפִּ֑ילָה וַ֝/עֲצֻמִ֗ים כָּל הֲרֻגֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/026.yaml
  text: For she has cast down many wounded[a], and all her slain are mighty.
translation:
  language: pt
  text: 'Pois ela derrubou muitos feridos[a],

    e todos os que ela matou são poderosos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos são os mortos que ela derrubou”. O substantivo hebraico também pode significar “mortos” ou “traspassados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “numerosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a advertência do contexto; “Pois” conserva de modo natural essa função explicativa.
- source_word: רַבִּים
  choice: muitos
  rationale: Expressa diretamente a grande quantidade das vítimas.
- source_word: חֲלָלִים
  choice: feridos
  rationale: O substantivo pode designar feridos, traspassados ou mortos. “Feridos” preserva a possível progressão poética até הֲרֻגֶיהָ, “os que ela matou”, sem eliminar a alternativa lexical.
- source_word: הִפִּילָה
  choice: derrubou
  rationale: O hifil de נפל significa fazer cair. “Derrubou” é conciso, vívido e natural em português.
- source_word: וַעֲצֻמִים
  choice: poderosos
  rationale: O adjetivo pode indicar força ou grande número. “Poderosos” mantém o sentido de que até pessoas fortes sucumbiram, enquanto a leitura quantitativa é registrada em nota.
- source_word: כָּל
  choice: todos
  rationale: Representa naturalmente o sentido abrangente do termo hebraico.
- source_word: הֲרֻגֶיהָ
  choice: os que ela matou
  rationale: Traduz com clareza o particípio passivo com sufixo feminino, literalmente “os mortos dela/por ela”, preservando a relação causal.
theological_decisions:
- issue: A relação entre “feridos” e “os que ela matou”
  choice: Manter uma progressão de “feridos” para “mortos por ela”
  alternative: Traduzir ambos os termos como mortos
  rationale: O primeiro substantivo admite “feridos” e “mortos”. A escolha principal conserva a intensificação poética, enquanto a nota preserva a leitura alternativa sem impor uma interpretação teológica.
- issue: Sentido de וַעֲצֻמִים
  choice: poderosos
  alternative: numerosos
  rationale: As duas acepções são lexicalmente possíveis. O texto principal segue a leitura qualitativa, que ressalta a força das vítimas, e a nota mantém visível a leitura quantitativa.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo em duas linhas. “Derrubou” evita uma formulação excessivamente literal, e “os que ela matou” comunica com naturalidade o particípio hebraico. As notas retêm as ambiguidades lexicais reais do verso.
