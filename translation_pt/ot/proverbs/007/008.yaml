  text: עֹבֵ֣ר בַּ֭/שּׁוּק אֵ֣צֶל פִּנָּ֑/הּ וְ/דֶ֖רֶךְ בֵּיתָ֣/הּ יִצְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/008.yaml
  text: passing through the street near her corner[a], and he steps toward her house.
translation:
  language: pt
  text: passando pela rua perto da esquina dela[a], ele segue o caminho para a casa dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passando pela rua do mercado perto da esquina dela e seguindo o caminho para a casa dela”.'
    reason: Alternativa lexical para שׁוּק, que também pode designar uma rua ou área de mercado.
lexical_decisions:
- source_word: עֹבֵר
  choice: passando
  rationale: O particípio qal apresenta a ação como parte da cena em andamento; “passando” preserva essa função e se liga naturalmente ao contexto anterior.
- source_word: בַּשּׁוּק
  choice: pela rua
  rationale: שׁוּק pode designar uma rua ou via pública, possivelmente uma rua de mercado. “Pela rua” é claro no contexto urbano sem excluir essa nuance.
- source_word: אֵצֶל פִּנָּהּ
  choice: perto da esquina dela
  rationale: אֵצֶל indica proximidade, e o sufixo feminino de פִּנָּה associa a esquina à mulher do contexto. A formulação conserva essa associação sem explicá-la em excesso.
- source_word: וְדֶרֶךְ בֵּיתָהּ
  choice: pelo caminho que leva à casa dela
  rationale: A construção indica a rota associada à casa dela e, no contexto de movimento, sugere direção ou destino. Esta tradução mantém a imagem concreta do caminho em português natural.
- source_word: יִצְעָד
  choice: ele segue
  rationale: צעד descreve avançar dando passos. “Segue” expressa o movimento deliberado pela rota indicada, sem introduzir a força de “marchar” ou “andar a passos largos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a abertura participial e a associação feminina expressa pelos sufixos hebraicos; evita-se transformar a possível “rua do mercado” em certeza no texto principal.
