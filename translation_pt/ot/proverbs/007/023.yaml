  text: until an arrow pierces his liver[a], like a bird rushing into a snare, and he does not know that it will cost him his life.
translation:
  language: pt
  text: até que uma flecha lhe atravesse o fígado, como um pássaro que se apressa para a armadilha, sem saber que isso lhe custará a vida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que isso é por sua vida”. O hebraico é elíptico; no contexto, a expressão indica que esse caminho lhe custará a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: até que
  rationale: Marca o limite temporal da ação iniciada no versículo anterior e conduz ao seu desfecho fatal.
- source_word: יְפַלַּח
  choice: atravesse
  rationale: O piel de פלח descreve penetração violenta; “atravesse” é natural em português e mantém a imagem concreta da flecha que perfura o corpo.
- source_word: חֵץ
  choice: uma flecha
  rationale: Equivalente comum do substantivo hebraico, sem razão contextual para especificação adicional.
- source_word: כְּבֵדוֹ
  choice: o fígado
  rationale: כָּבֵד designa literalmente o fígado. A tradução conserva a parte concreta do corpo e a vivacidade da imagem hebraica.
- source_word: כְמַהֵר
  choice: que se apressa
  rationale: Expressa movimento rápido e irrefletido, de modo idiomático e digno em português.
- source_word: צִפּוֹר
  choice: um pássaro
  rationale: O termo é genérico e não identifica nenhuma espécie.
- source_word: אֶל־פָּח
  choice: para a armadilha
  rationale: פָּח é uma armadilha ou laço para aves; “para a armadilha” preserva a direção do hebraico sem sugerir que a ave reconheça o perigo.
- source_word: וְלֹא יָדַע
  choice: sem saber
  rationale: Reproduz com naturalidade a falta de percepção do jovem e liga claramente a oração ao símile precedente.
- source_word: כִּי בְנַפְשׁוֹ הוּא
  choice: que isso lhe custará a vida
  rationale: A expressão hebraica é elíptica, literalmente algo como “que isso é por/contra a sua vida”. No contexto, indica que o caminho termina na perda da vida.
