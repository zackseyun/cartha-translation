  text: 'She seized him and kissed him[a]; with a bold face she said to him:'
translation:
  language: pt
  text: 'Ela o agarrou e o beijou; com rosto descarado[a], lhe disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com rosto atrevido” ou “com descarado atrevimento”. A expressão hebraica transmite uma atitude audaciosa, impudente e sem constrangimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  choice: Ela o agarrou
  rationale: O hifil de חזק com ב expressa agarrar ou segurar alguém. “Agarrou” comunica a ação física súbita e assertiva de modo natural em português.
- source_word: וְנָשְׁקָה לּוֹ
  choice: e o beijou
  rationale: נשק no qal significa normalmente “beijar”. A formulação direta preserva a sequência narrativa hebraica.
- source_word: הֵעֵזָה פָנֶיהָ
  choice: com o rosto atrevido
  rationale: A expressão idiomática descreve tornar firme ou audacioso o rosto, indicando atrevimento sem constrangimento. Esta escolha preserva a imagem facial e soa compreensível em português.
- source_word: וַתֹּאמַר לוֹ
  choice: disse a ele
  rationale: Mantém o objeto indireto explícito no hebraico e a natureza direta do encontro.
