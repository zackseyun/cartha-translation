  text: קָשְׁרֵ֥/ם עַל אֶצְבְּעֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/003.yaml
  text: Tie them on your fingers[a]; write them on the tablet of your heart.
translation:
  language: pt
  text: Amarre-os aos seus dedos[a]; escreva-os na tábua do seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ate-os aos seus dedos”.'
    reason: Alternativa lexical para קשר, que pode ser traduzido por “amarrar” ou “atar”.
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Amarre-os
  rationale: O imperativo de קשר significa literalmente “amarrar, atar”. “Amarre-os” é natural em português moderno e preserva a imagem concreta de manter os ensinamentos presos junto a si.
- source_word: עַל אֶצְבְּעֹתֶיךָ
  choice: aos seus dedos
  rationale: A formulação expressa de maneira natural em português a ideia de prender algo aos dedos, mantendo o plural do hebraico e a imagem de constante proximidade.
- source_word: כָּתְבֵם
  choice: escreva-os
  rationale: O imperativo de כתב é vertido diretamente, preservando o paralelismo com a primeira oração e a metáfora da instrução interiorizada.
- source_word: עַל לוּחַ
  choice: na tábua
  rationale: לוּחַ designa uma tábua ou placa para escrita. “Na tábua” conserva a imagem concreta e suas ressonâncias bíblicas.
- source_word: לִבֶּךָ
  choice: do seu coração
  rationale: “Coração” mantém a metáfora hebraica tradicional e pode abranger pensamento, vontade e afetos, sem reduzir seu sentido a apenas mente ou emoção.
theological_decisions:
- issue: Interiorização metafórica da instrução
  choice: Manter as imagens concretas de amarrar aos dedos e escrever na tábua do coração.
  alternative: Parafrasear como “mantenha-os sempre presentes e grave-os profundamente em seu íntimo”.
  rationale: As metáforas possuem valor literário e ressonância pactual e sapiencial. Preservá-las evita substituir a linguagem do texto por uma interpretação explicativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A colocação pronominal em “Amarre-os” e “escreva-os” mantém fluidez e paralelismo; “tábua do seu coração” preserva a imagem bíblica sem explicá-la excessivamente.
