  text: עַל כֵּ֭ן יָצָ֣אתִי לִ/קְרָאתֶ֑/ךָ לְ/שַׁחֵ֥ר פָּ֝נֶ֗י/ךָ וָ/אֶמְצָאֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/015.yaml
  text: Therefore I came out to meet you[a], to seek your face, and I have found you.
translation:
  language: pt
  text: Por isso, saí ao seu encontro, para procurar você[a], e encontrei você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para procurar você com empenho” ou “para procurar você desde cedo”. O verbo hebraico pode indicar uma busca diligente ou feita cedo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e digno a relação causal introduzida pela locução hebraica.
- source_word: יָצָאתִי
  choice: saí
  rationale: O verbo indica sair; no contexto, a mulher relata que saiu com a finalidade de encontrar o jovem.
- source_word: לִקְרָאתֶךָ
  choice: ao seu encontro
  rationale: É a forma idiomática portuguesa para a construção hebraica que descreve sair para encontrar alguém.
- source_word: לְשַׁחֵר פָּנֶיךָ
  choice: para procurar você com empenho
  rationale: O verbo pode sugerir busca diligente ou feita cedo. Embora פָּנֶיךָ seja literalmente 'seu rosto', a expressão inteira significa procurar a própria pessoa; a tradução natural explicita isso sem perder a intensidade, preservada também em nota.
- source_word: וָאֶמְצָאֶךָּ
  choice: e encontrei você
  rationale: O verbo narrativo apresenta o resultado da busca. O pretérito perfeito é direto e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Evitou-se o pouco natural “procurar o seu rosto”, traduzindo a expressão hebraica segundo seu sentido contextual, enquanto a possível nuance temporal ou intensiva do verbo foi mantida em nota.
