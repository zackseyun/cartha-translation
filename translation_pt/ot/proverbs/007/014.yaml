  text: זִבְחֵ֣י שְׁלָמִ֣ים עָלָ֑/י הַ֝/יּ֗וֹם שִׁלַּ֥מְתִּי נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
translation:
  language: pt
  text: Eu tinha de oferecer sacrifícios de comunhão[a]; hoje cumpri os meus votos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifícios de paz”. O hebraico se refere a sacrifícios de paz ou bem-estar, dos quais se podia comer depois do sacrifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  choice: ofertas de comunhão
  rationale: A expressão designa sacrifícios de paz ou bem-estar, dos quais o ofertante podia comer. “Ofertas de comunhão” comunica de modo natural o caráter cultual e a refeição partilhada, enquanto a nota preserva a alternativa mais formal.
- source_word: עָלַי
  choice: tenho comigo
  rationale: Embora literalmente seja “sobre mim”, neste contexto a expressão indica que essas ofertas lhe cabem ou estão à sua disposição após o sacrifício. “Tenho comigo” é natural em português e se ajusta ao convite implícito no contexto.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto e corrente em português.
- source_word: שִׁלַּמְתִּי
  choice: cumpri
  rationale: No piel, com “votos” como objeto, o verbo significa pagar ou cumprir uma obrigação votiva. “Cumpri” é a colocação mais natural em português e mantém a conclusão do ato.
- source_word: נְדָרַי
  choice: os meus votos
  rationale: Traduz diretamente o substantivo plural com sufixo de primeira pessoa, sem acrescentar “ofertas”, já expresso pelo contexto sacrificial.
theological_decisions:
- issue: Terminologia cultual na fala da mulher sedutora
  choice: Manter explicitamente as ofertas e os votos, sem moralizar nem reduzir a fala a uma referência genérica a comida.
  alternative: Parafrasear como “preparei uma refeição” ou adotar a forma estritamente literal “sacrifícios de paz estão sobre mim”.
  rationale: A fala emprega linguagem legítima de culto no contexto de sedução. A tradução preserva essa tensão narrativa e religiosa sem explicar além do que o hebraico afirma.
- issue: Sentido de עָלַי
  choice: 'Entender como disponibilidade ou posse presente: “tenho comigo”.'
  alternative: 'Entender como obrigação: “cabiam-me ofertas de paz” ou “eu devia ofertas de paz”.'
  rationale: A construção admite associação ou obrigação. O contexto imediato, em que a mulher acaba de cumprir os votos e dispõe da carne sacrificial para uma refeição, favorece a disponibilidade presente, mas a ambiguidade é reconhecida na análise lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cumpri os meus votos” é idiomático e preserva o caráter religioso. O marcador [a] aparece imediatamente após a expressão anotada.
