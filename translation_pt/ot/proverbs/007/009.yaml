  text: at twilight[a], in the evening of the day, in the black of night and darkness.
translation:
  language: pt
  text: ao anoitecer, no entardecer do dia, na escuridão da noite e nas trevas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶשֶׁף
  choice: ao anoitecer
  rationale: No contexto da progressão do entardecer para a noite, designa o período de luz enfraquecida no fim do dia. “Ao anoitecer” é natural em português e mantém o sentido de transição.
- source_word: עֶרֶב יוֹם
  choice: no fim do dia
  rationale: Expressa de modo corrente a fase vespertina do dia sem eliminar o segundo degrau da progressão temporal presente no hebraico.
- source_word: אִישׁוֹן לַיְלָה
  choice: na escuridão da noite
  rationale: A expressão, literalmente ligada à “pupila do olho”, é um idioma para a parte mais escura da noite. A tradução comunica o sentido sem introduzir em português uma imagem opaca.
- source_word: וַאֲפֵלָה
  choice: em meio às trevas
  rationale: Preserva a acumulação enfática de imagens noturnas e evita a formulação pouco natural “escuridão da noite e trevas”.
- source_word: בְּ ... בְּ ... בְּ
  choice: ao ... no ... na ... em meio às
  rationale: As formas portuguesas variam naturalmente conforme os complementos, mantendo a sucessão de circunstâncias temporais e o movimento progressivo para a escuridão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A tradução conserva a progressão cumulativa do anoitecer às trevas, sem reproduzir literalmente o idioma hebraico da “pupila da noite”, que seria obscuro para a maioria dos leitores.
