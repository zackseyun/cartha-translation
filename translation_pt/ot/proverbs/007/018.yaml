  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
translation:
  language: pt
  text: Vem, vamos nos saciar de carícias até o amanhecer; vamos nos deleitar com amores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Venha
  rationale: O imperativo de הלך funciona idiomaticamente como um convite ou uma exortação. “Venha” é natural em português e preserva o tom sedutor.
- source_word: נִרְוֶה
  choice: vamos nos saciar
  rationale: O verbo רוה expressa beber até ficar satisfeito ou fartar-se. “Nos saciar” conserva a ideia de satisfação plena e combina naturalmente com o objeto erótico.
- source_word: דֹדִים
  choice: de carícias
  rationale: No plural e em contexto erótico, דֹדִים pode designar manifestações físicas de amor ou carícias. A escolha comunica o sentido sensual com clareza sem explicitação excessiva.
- source_word: עַד הַבֹּקֶר
  choice: até o amanhecer
  rationale: Expressa com naturalidade o limite temporal e mantém a referência à manhã ou alvorada.
- source_word: נִתְעַלְּסָה
  choice: vamos nos entregar aos prazeres
  rationale: A forma hitpael de עלס indica deleitar-se, desfrutar intensamente ou regalar-se. A formulação mantém o valor reflexivo e o prazer sensual.
- source_word: בָּאֳהָבִים
  choice: do amor
  rationale: O plural substantivado de אהב, neste contexto, aponta para prazeres amorosos e eróticos. “Prazeres do amor” torna essa força contextual inteligível em português sem restringi-la a um único ato.
