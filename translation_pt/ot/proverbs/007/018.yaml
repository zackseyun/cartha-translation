review_pass:
  verdict: revise
  source_fidelity: A primeira cola preserva adequadamente o convite e a imagem de saciar-se; «carícias» é uma opção contextual legítima para דֹדִים. Na segunda, porém, «nos entregar aos prazeres» introduz a ideia de entrega e transforma o verbo reflexivo de deleitar-se/revelar-se (נִתְעַלְּסָה) em uma construção mais interpretativa. A revisão recupera diretamente o deleite partilhado e mantém a linguagem erótica sem especificar um ato sexual.
  naturalness: «Vem» é mais natural para um convite íntimo e direto do que «Venha», que em português contemporâneo tende a sugerir tratamento formal. «Deleitar-nos com amores» conserva um tom poético digno e é compreensível; o plural «amores» também deixa transparecer, sem excessiva concretização, o plural hebraico.
  terminology: «Carícias» para דֹדִים e «amores» para אֳהָבִים distinguem os dois termos hebraicos correlatos e preservam seu valor sensual no contexto. Evita-se impor «prazeres», termo que não corresponde explicitamente ao substantivo hebraico, embora o contexto seja erótico.
  issues:
  - severity: medium
    issue: «vamos nos entregar aos prazeres do amor» é uma expansão interpretativa de נִתְעַלְּסָה בָּאֳהָבִים.
    rationale: O hitpael de עלס expressa deleitar-se, regalar-se ou desfrutar intensamente. «Entregar-se» acrescenta uma nuance distinta, e «prazeres» converte o objeto «amores» em uma abstração explicativa.
  - severity: low
    issue: «Venha» é menos adequado ao tom íntimo do convite.
    rationale: Embora possível, «Venha» normalmente marca tratamento formal. «Vem» reproduz com maior naturalidade a exortação sedutora do hebraico.
  revised_text: Vem, vamos nos saciar de carícias até o amanhecer; vamos nos deleitar com amores.
