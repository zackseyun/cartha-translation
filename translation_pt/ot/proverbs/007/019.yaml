  text: For the man is not at his house[a]; he has gone on a journey far away.
translation:
  language: pt
  text: Pois o homem não está em sua casa[a]; ele partiu em viagem para longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu marido não está em casa”. Mais literalmente, o hebraico diz “o homem não está em sua casa”, empregando uma expressão indireta para se referir ao marido dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a segurança expressa pela mulher no contexto, preservando a força causal.
- source_word: אֵין
  choice: não está
  rationale: Com a expressão nominal e o complemento de lugar, indica ausência; esta formulação é natural em português.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Preserva a expressão indireta do hebraico; no contexto, trata-se do marido da mulher.
- source_word: בְּבֵיתוֹ
  choice: em sua casa
  rationale: Mantém tanto a localização quanto o possessivo explícito do texto hebraico.
- source_word: הָלַךְ
  choice: partiu
  rationale: 'Expressa uma ação concluída cujo resultado permanece relevante: ele saiu e continua ausente.'
- source_word: בְּדֶרֶךְ
  choice: em viagem
  rationale: Traduz idiomaticamente o uso de 'caminho' para indicar uma jornada.
- source_word: מֵרָחוֹק
  choice: para longe
  rationale: Comunica a distância espacial associada à viagem sem reduzi-la apenas à ideia de duração.
