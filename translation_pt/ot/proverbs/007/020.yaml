base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/020.yaml
  text: He took a bag of money in his hand[a]; he will come home at the full moon.
translation:
  language: pt
  text: Levou na mão uma bolsa de dinheiro; voltará para casa no dia da lua cheia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no dia marcado”. O termo hebraico é difícil e também tem sido entendido como “lua nova”, embora “lua cheia” pareça ajustar-se melhor ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: bolsa
  rationale: O substantivo designa algo amarrado, aqui uma bolsa ou saco para guardar dinheiro. “Bolsa” é natural e adequada ao contexto de viagem.
- source_word: הַכֶּסֶף
  choice: dinheiro
  rationale: Embora כֶּסֶף possa significar literalmente “prata”, neste contexto refere-se ao dinheiro levado para a viagem.
- source_word: לָקַח בְיָדוֹ
  choice: levou consigo
  rationale: A expressão hebraica diz literalmente “tomou em sua mão”, mas funciona idiomaticamente com o sentido de levar algo consigo. A tradução evita uma formulação artificial em português.
- source_word: לְיוֹם
  choice: no dia da
  rationale: A preposição introduz o momento previsto para a volta. “No dia da” preserva a referência explícita ao dia e soa naturalmente em português.
- source_word: הַכֵּסֶא
  choice: lua cheia
  rationale: O termo raro e discutido provavelmente indica a lua cheia, uma data do mês lunar que reforça que o marido demorará a voltar. A incerteza lexical é preservada em nota.
- source_word: יָבֹא בֵיתוֹ
  choice: voltará para casa
  rationale: O hebraico diz literalmente “virá à sua casa”. No contexto, “voltará para casa” expressa de modo natural a chegada do marido de sua viagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a sequência direta da fala da mulher e explicita na nota a incerteza do termo lunar.
