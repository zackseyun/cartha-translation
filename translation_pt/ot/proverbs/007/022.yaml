  text: ה֤וֹלֵ֥ךְ אַחֲרֶ֗י/הָ פִּ֫תְאֹ֥ם כְּ֭/שׁוֹר אֶל טָ֣בַח יָב֑וֹא וּ֝/כְ/עֶ֗כֶס אֶל מוּסַ֥ר אֱוִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
translation:
  language: pt
  text: Ele vai atrás dela de imediato, como o boi que vai para o abate e como um grilhão para a correção de um insensato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta última comparação é difícil: “e como um grilhão para a correção de um insensato”. A expressão traduzida como “grilhão” também tem sido entendida de outras maneiras, dando origem a traduções como “um cervo que vai para uma armadilha” ou “grilhões para a disciplina de um insensato”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: vai
  rationale: O particípio qal de הלך descreve vividamente a ação em curso; “vai” é natural em português e se ajusta à sequência narrativa.
- source_word: אַחֲרֶיהָ
  choice: atrás dela
  rationale: A expressão indica que o jovem segue a mulher; “atrás dela” preserva tanto a imagem espacial quanto o sentido contextual.
- source_word: פִּתְאֹם
  choice: de imediato
  rationale: O advérbio ressalta a reação abrupta e irrefletida. “De imediato” comunica prontidão impulsiva sem sugerir apenas surpresa.
- source_word: כְּשׁוֹר
  choice: como o boi
  rationale: שׁוֹר designa gado bovino; “boi” conserva a imagem tradicional de um animal conduzido sem perceber o destino.
- source_word: אֶל טָבַח יָבֹא
  choice: que vai para o abate
  rationale: Embora a formulação hebraica seja literalmente próxima de “vem ao abate”, esta expressão portuguesa transmite naturalmente o movimento rumo ao destino fatal.
- source_word: וּכְעֶכֶס
  choice: e como grilhões
  rationale: עֶכֶס é raro e seu sentido neste contexto é discutido. “Grilhões” representa a interpretação ligada a restrição ou prisão, sem ocultar a dificuldade, que é explicitada em nota.
- source_word: אֶל מוּסַר
  choice: para a correção
  rationale: מוּסָר abrange instrução, disciplina e correção. Neste contexto de consequências severas, “correção” mantém a dimensão disciplinar sem reduzi-la simplesmente a castigo.
- source_word: אֱוִיל
  choice: do insensato
  rationale: O substantivo singular caracteriza alguém moralmente obtuso. “Insensato” é corrente, digno e adequado ao vocabulário sapiencial.
