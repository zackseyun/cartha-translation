source:
  edition: WLC
  text: וָ/אֵ֤רֶא בַ/פְּתָאיִ֗ם אָ֘בִ֤ינָה בַ/בָּנִ֗ים נַ֣עַר חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/007.yaml
  text: and I saw among the simple[a]; I discerned among the young men a youth lacking sense.
translation:
  language: pt
  text: e vi entre os ingênuos; percebi entre os jovens um rapaz sem juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “falto de coração”, expressão que indica falta de entendimento, discernimento ou bom senso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: e vi
  rationale: O wayyiqtol de ראה dá continuidade à narrativa; “e vi” preserva a sequência e o sentido direto de observação.
- source_word: בַפְּתָאיִם
  choice: entre os ingênuos
  rationale: פְּתָאיִם designa, em Provérbios, pessoas inexperientes e facilmente influenciáveis. “Ingênuos” comunica essa categoria sapiencial com mais clareza no português atual do que o literal “simples”.
- source_word: אָבִינָה
  choice: percebi
  rationale: A forma de בין expressa percepção com discernimento. “Percebi” distingue esta avaliação do simples ato de ver mencionado antes.
- source_word: בַבָּנִים
  choice: entre os jovens
  rationale: Embora בָּנִים signifique literalmente “filhos”, neste contexto refere-se aos jovens observados em grupo; “jovens” é idiomático e natural.
- source_word: נַעַר
  choice: um rapaz
  rationale: נַעַר pode designar desde um menino até um jovem. “Rapaz” se ajusta ao contexto de alguém que circula sozinho pela rua e evita especificar demais a idade.
- source_word: חֲסַר לֵב
  choice: sem juízo
  rationale: A expressão significa literalmente “falto de coração”, mas לֵב, na literatura sapiencial, abrange entendimento, discernimento e senso moral. “Sem juízo” transmite de modo natural essa deficiência intelectual e moral, enquanto a nota preserva a imagem hebraica.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com fluidez brasileira e compreensão internacional. O paralelismo entre “vi” e “percebi” foi preservado; o ponto e vírgula torna clara a progressão da observação sem eliminar a estrutura poética.
