  text: נַ֥פְתִּי מִשְׁכָּבִ֑/י מֹ֥ר אֲ֝הָלִ֗ים וְ/קִנָּמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/017.yaml
  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
translation:
  language: pt
  text: Perfumei minha cama com mirra, aloés[a] e canela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, madeira aromática de aloés, também chamada madeira de ágar; não se trata da planta medicinal conhecida hoje como babosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  choice: Perfumei
  rationale: O piel indica a aplicação de substâncias aromáticas. “Perfumei” comunica naturalmente tanto a ação quanto o resultado pretendido no contexto.
- source_word: מִשְׁכָּבִי
  choice: minha cama
  rationale: מִשְׁכָּבִי designa o lugar onde a pessoa se deita; “minha cama” é claro, corrente e adequado ao contexto de sedução.
- source_word: מֹר
  choice: mirra
  rationale: Equivalente português tradicional e preciso para a resina aromática מור.
- source_word: אֲהָלִים
  choice: aloés
  rationale: Designa uma madeira aromática usada em perfumes, tradicionalmente chamada “aloés” em contexto bíblico. A nota evita a associação equivocada com a planta medicinal moderna.
- source_word: וְקִנָּמוֹן
  choice: e canela
  rationale: Tradução direta de קִנָּמוֹן, mantendo a conjunção que encerra a lista de aromas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem natural da frase. “Perfumei” preserva o sentido resultativo do verbo, e a nota esclarece o referente botânico potencialmente ambíguo.
