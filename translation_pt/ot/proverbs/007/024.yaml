source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/הַקְשִׁ֗יבוּ לְ/אִמְרֵי פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
translation:
  language: pt
  text: E agora, filhos[a], escutem-me e prestem atenção às palavras da minha boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “crianças”. O hebraico diz literalmente “filhos”, um plural masculino usado na instrução sapiencial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: A conjunção com o advérbio temporal assinala uma transição e renova a exortação; “E agora” preserva o fluxo discursivo.
- source_word: בָנִים
  choice: filhos
  rationale: O hebraico emprega o plural masculino, forma característica do tratamento pedagógico em Provérbios; a tradução conserva o gênero expresso no texto.
- source_word: שִׁמְעוּ לִי
  choice: escutem-me
  rationale: שׁמע com ל indica audição atenta dirigida ao falante. “Escutem-me” transmite com naturalidade a força do imperativo.
- source_word: וְהַקְשִׁיבוּ
  choice: e prestem atenção
  rationale: A forma causativa de קשׁב reforça o chamado à atenção cuidadosa; a expressão é clara e corrente em português.
- source_word: לְאִמְרֵי פִי
  choice: às palavras da minha boca
  rationale: A formulação mantém a imagem poética hebraica e a ênfase na instrução pronunciada diretamente pelo mestre.
theological_decisions:
- issue: Vocativo marcado por gênero na instrução sapiencial
  choice: filhos
  alternative: crianças; filhos e filhas
  rationale: O texto-fonte traz um plural gramaticalmente masculino. “Filhos” preserva essa forma sem decidir se o alcance pragmático do ensino é exclusivamente masculino ou representativo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativos no plural. Conserva-se o paralelismo entre escutar o mestre e prestar atenção às palavras de sua boca.
