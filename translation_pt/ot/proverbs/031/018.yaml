  text: She perceives that her merchandise is good[b][a]; her lamp does not go out at night.
translation:
  language: pt
  text: Ela percebe que sua mercadoria é boa[a][b]; sua lâmpada não se apaga à noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “prova”. Aqui, o verbo expressa discernimento adquirido pela experiência, não o ato literal de comer.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu comércio” ou “seu lucro é bom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָעֲמָה
  choice: percebe
  rationale: O verbo significa literalmente “provar”, mas aqui expressa discernimento adquirido pela experiência. “Percebe” comunica esse sentido de modo natural, sem sugerir o ato físico de comer.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo da percepção: ela percebe que sua mercadoria é boa.'
- source_word: טוֹב
  choice: boa
  rationale: Preserva o sentido amplo de qualidade e benefício do hebraico, sem restringi-lo apenas à lucratividade.
- source_word: סַחְרָהּ
  choice: sua mercadoria
  rationale: Mantém o sentido comercial concreto do termo; “comércio” e “lucro” são possibilidades contextuais, registradas em nota.
- source_word: לֹא יִכְבֶּה
  choice: não se apaga
  rationale: É a expressão portuguesa natural para uma lâmpada que continua acesa.
- source_word: בַלַּיְלָה
  choice: durante a noite
  rationale: Expressa naturalmente o valor temporal e sugere continuidade ao longo da noite.
- source_word: נֵרָהּ
  choice: sua lâmpada
  rationale: Conserva a imagem doméstica concreta do hebraico, em vez de substituí-la pela ideia abstrata de luz.
