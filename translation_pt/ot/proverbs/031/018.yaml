revisions:
- from: Ela percebe que sua mercadoria é boa[a][b]; sua lâmpada não se apaga durante a noite.
  to: Ela percebe que sua mercadoria é boa[a][b]; sua lâmpada não se apaga à noite.
  rationale: A revisão substitui «durante a noite» por «à noite», formulação mais estritamente correspondente ao hebraico, e corrige a nota lexical para evitar o falso sentido português de «provar que» = «demonstrar que». O sentido do texto permanece inalterado.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:25:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'O texto principal transmite adequadamente o hebraico: טָעֲמָה tem aqui o sentido figurado de discernimento pela experiência; סַחְרָהּ admite «mercadoria», «comércio» ou «lucro/ganho»; e a imagem da lâmpada que não se extingue é preservada. «Durante a noite», porém, explicita uma duração que o simples «à noite» não precisa acrescentar.'
  naturalness: '«Ela percebe que sua mercadoria é boa» é claro e natural em português moderno. «À noite» é mais direto e mais próximo do valor temporal hebraico do que «durante a noite». A primeira nota, tal como redigida, é enganosa em português: «Ela prova que...» normalmente significa «ela demonstra que», e não conserva de forma inteligível a alternativa lexical «provar/tastar».'
  terminology: «Mercadoria» e «lâmpada» são escolhas apropriadas. As alternativas «comércio» e «lucro» são lexicalmente defensáveis. A nota sobre טָעֲמָה deve identificar «provar» como o sentido literal do verbo sem apresentá-lo numa construção portuguesa que mude seu sentido para «demonstrar».
  issues:
  - severity: low
    issue: A expressão «durante a noite» acrescenta levemente a ideia de duração contínua.
    rationale: בַלַּיְלָה significa simplesmente «à noite»/«de noite». Embora o contexto possa sugerir continuidade, não é necessário explicitá-la.
  - severity: medium
    issue: A nota a usa «Ela prova que sua mercadoria é boa» como alternativa.
    rationale: Em português atual, «provar que» significa normalmente «demonstrar que». Isso não representa o sentido literal de טָעֲמָה («provar», isto é, degustar) nem esclarece adequadamente sua extensão figurada.
  revised_text: Ela percebe que sua mercadoria é boa[a][b]; sua lâmpada não se apaga à noite.
  revised_footnotes:
  - marker: a
    text: Literalmente, “prova”. Aqui, o verbo expressa discernimento adquirido pela experiência, não o ato literal de comer.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu comércio” ou “seu lucro é bom”.'
    reason: lexical_alternative
  revision_rationale: A revisão substitui «durante a noite» por «à noite», formulação mais estritamente correspondente ao hebraico, e corrige a nota lexical para evitar o falso sentido português de «provar que» = «demonstrar que». O sentido do texto permanece inalterado.
