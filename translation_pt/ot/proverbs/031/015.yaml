  text: She rises while it is still night and gives food to her household and portions to her servant girls[a].
translation:
  language: pt
  text: Ela se levanta enquanto ainda é noite e dá alimento aos de sua casa e a porção determinada às suas servas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e uma cota fixada às suas servas”. A palavra hebraica também pode indicar algo prescrito ou atribuído; alguns a entendem como uma tarefa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Ela se levanta
  rationale: O wayyiqtol de קום integra a descrição poética; o presente comunica naturalmente, em português, a ação habitual e vívida.
- source_word: בְּעוֹד לַיְלָה
  choice: enquanto ainda é noite
  rationale: Preserva a referência temporal sem especificar indevidamente um momento exato, como 'antes do amanhecer'.
- source_word: וַתִּתֵּן
  choice: e dá
  rationale: Tradução direta de נתן, adequada ao presente habitual do contexto.
- source_word: טֶרֶף
  choice: alimento
  rationale: Embora possa significar literalmente 'presa', neste contexto doméstico designa comida ou provisão; 'alimento' evita uma leitura enganosa.
- source_word: לְבֵיתָהּ
  choice: aos de sua casa
  rationale: בַּיִת aqui abrange as pessoas que compõem a casa, não apenas o edifício; a expressão é natural e inclusiva em português.
- source_word: וְחֹק
  choice: e a porção determinada
  rationale: חֹק pode indicar porção, cota ou quota prescrita. A formulação mantém a ideia de uma distribuição fixada e acompanha o paralelismo alimentar.
- source_word: לְנַעֲרֹתֶיהָ
  choice: às suas servas
  rationale: נַעֲרוֹת designa jovens mulheres que servem na casa. 'Servas' expressa com clareza a função doméstica, sem o tom potencialmente infantil de 'garotas'.
