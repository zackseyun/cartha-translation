  text: נוֹדָ֣ע בַּ/שְּׁעָרִ֣ים בַּעְלָ֑/הּ בְּ֝/שִׁבְתּ֗/וֹ עִם זִקְנֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/023.yaml
  text: Her husband is known in the gates[b][a], when he sits among the elders of the land.
translation:
  language: pt
  text: Seu marido é conhecido[b] nos portões[a], quando se assenta entre os anciãos da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nos portões” refere-se ao lugar público onde eram tratados assuntos cívicos, jurídicos e comunitários.
    reason: cultural_note
  - marker: b
    text: Ou “é reconhecido” ou “é respeitado”. O hebraico diz literalmente “é conhecido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: é conhecido
  rationale: Preserva o sentido estativo/passivo do particípio nifal de ידע sem explicitar como honra aquilo que o contexto apenas sugere.
- source_word: בַּשְּׁעָרִים
  choice: nos portões
  rationale: Mantém a imagem hebraica dos portões como lugar da vida pública, jurídica e comunitária; uma nota esclarece o contexto cultural.
- source_word: בַּעְלָהּ
  choice: seu marido
  rationale: No retrato doméstico desta passagem, 'marido' é o sentido contextual claro de בעל, sem acrescentar a conotação hierárquica de 'senhor' ou 'dono'.
- source_word: בְּשִׁבְתּוֹ
  choice: quando se assenta
  rationale: A preposição ב com o infinitivo construto e sufixo tem valor temporal/circunstancial; esta formulação é natural e digna em português.
- source_word: עִם
  choice: entre
  rationale: Embora עִם possa ser vertido literalmente por 'com', 'entre' expressa de modo idiomático sua participação no grupo dos anciãos.
- source_word: זִקְנֵי אָרֶץ
  choice: os anciãos da terra
  rationale: Conserva o sentido lexical de ארץ, sem restringi-lo indevidamente a 'cidade', e mantém a designação tradicional dos líderes comunitários.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a imagem concreta dos portões e a ambiguidade de נוֹדָע; a ordem dos marcadores no texto acompanha a associação imediata da nota lexical com “conhecido” e da nota cultural com “portões”.
