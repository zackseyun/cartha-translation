base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/002.yaml
  text: What[a], my son? And what, son of my womb? And what, son of my vows?
translation:
  language: pt
  text: O quê, meu filho? E o quê, filho do meu ventre? E o quê, filho dos meus votos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “O que direi, meu filho? E o que direi, filho do meu ventre? E o que direi, filho dos meus votos?” O hebraico mantém a repetição abrupta de “O quê?” para produzir efeito retórico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: O quê
  rationale: A interrogativa repetida introduz uma interpelação retórica, breve e emotiva. “O quê” conserva a elipse e a repetição poética do hebraico.
- source_word: בְּרִי
  choice: meu filho
  rationale: בַּר com sufixo de primeira pessoa singular significa “meu filho”. A forma masculina e a relação materna explícita são preservadas.
- source_word: בַּר
  choice: filho de
  rationale: A repetição de “filho” mantém o paralelismo tríplice e a formulação masculina da fonte.
- source_word: בִּטְנִי
  choice: meu ventre
  rationale: בֶּטֶן pode designar ventre ou útero. Neste contexto materno, “meu ventre” é natural, preciso e poeticamente digno em português.
- source_word: נְדָרָי
  choice: meus votos
  rationale: O plural com sufixo de primeira pessoa significa literalmente “meus votos”. A tradução não especifica a natureza desses votos, que o texto deixa sem explicação.
theological_decisions:
- issue: Força da interpelação retórica tríplice
  choice: 'Três perguntas abruptas: “O quê...? O quê...? O quê...?”'
  alternative: 'Expansão idiomática: “O que direi...?” ou “O que devo dizer...?”'
  rationale: O hebraico é elíptico e carregado de emoção. Manter a interrogativa isolada preserva a intensidade poética sem inserir um verbo ausente da fonte.
- issue: Termo filial marcado pelo gênero
  choice: “meu filho” / “filho do meu ventre” / “filho dos meus votos”
  alternative: “meu filho” com reformulações menos literais nas duas linhas seguintes, ou o termo neutro “criança”
  rationale: A fonte repete o substantivo masculino בַּר. A tradução conserva tanto o gênero quanto a repetição estrutural.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Meu ventre” soa mais natural e poético do que “meu útero” neste contexto. A conjunção hebraica repetida não foi vertida como “e” antes da segunda e da terceira perguntas, pois a justaposição em português preserva melhor a cadência enfática sem artificialidade.
