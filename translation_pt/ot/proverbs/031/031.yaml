  text: תְּנוּ לָ֭/הּ מִ/פְּרִ֣י יָדֶ֑י/הָ וִֽ/יהַלְל֖וּ/הָ בַ/שְּׁעָרִ֣ים מַעֲשֶֽׂי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/031.yaml
  text: Give her of the fruit of her hands[b][a], and let her works praise her in the gates.
translation:
  language: pt
  text: Deem a ela do fruto de suas mãos, e que suas obras a louvem às portas da cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “às portas”. Na antiga sociedade israelita, as portas da cidade eram um lugar de vida pública, julgamento e reconhecimento.
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ לָהּ
  choice: Deem a ela
  rationale: O imperativo plural de נתן, seguido do objeto indireto, dirige à comunidade uma ordem direta para que ela receba o que lhe é devido; a formulação é natural em português e não acrescenta um objeto ausente no hebraico.
- source_word: מִפְּרִי יָדֶיהָ
  choice: do fruto de suas mãos
  rationale: Preserva a imagem concreta hebraica do fruto produzido por suas mãos. A contração “do” pode expressar a procedência ou a porção recebida sem reduzir a expressão simplesmente a “trabalho”.
- source_word: וִיהַלְלוּהָ
  choice: e que ... a louvem
  rationale: Reproduz o valor volitivo do imperfeito após o imperativo inicial e mantém a personificação pela qual as obras dão testemunho público em favor dela.
- source_word: מַעֲשֶׂיהָ
  choice: suas obras
  rationale: “Obras” abrange feitos e realizações, conserva o paralelismo com “fruto de suas mãos” e funciona naturalmente como sujeito personificado de “louvem”.
- source_word: בַשְּׁעָרִים
  choice: às portas da cidade
  rationale: Explicita de modo conciso o referente cultural das portas urbanas, lugar de vida pública, julgamento e reconhecimento, sem substituir a imagem original por uma abstração.
theological_decisions: []
