base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/004.yaml
  text: It is not for kings[a], O Lemuel, it is not for kings to drink wine, nor for rulers to desire strong drink,
translation:
  language: pt
  text: Não convém aos reis, ó Lemuel, não convém aos reis beber vinho, nem aos governantes desejar bebida forte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “nem aos governantes: ‘Onde está a bebida forte?’” A expressão hebraica é concisa e pode retratar governantes procurando bebida embriagante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל לַמְלָכִים
  choice: Não convém aos reis
  rationale: A partícula negativa אַל, ligada a לַמְלָכִים, expressa aqui proibição em termos do que não é apropriado aos reis. A formulação preserva a repetição enfática e soa natural em português.
- source_word: לְמוֹאֵל
  choice: ó Lemuel
  rationale: O nome funciona como vocativo; “ó” explicita de modo digno e natural o chamamento direto.
- source_word: שְׁתוֹ יָיִן
  choice: beber vinho
  rationale: Representa diretamente a ação verbal e o sentido comum de יָיִן.
- source_word: וּלְרוֹזְנִים
  choice: nem aos governantes
  rationale: רוֹזְנִים designa autoridades ou altos dignitários. “Governantes” é claro, atual e mantém o paralelismo com “reis”.
- source_word: או שֵׁכָר
  choice: desejar bebida forte
  rationale: A expressão hebraica é concisa e difícil. Entendê-la como procura ou desejo por bebida embriagante produz sentido coerente no paralelismo, enquanto a alternativa mais literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “não convém aos reis” conserva a ênfase poética do hebraico; “bebida forte” mantém uma designação ampla para bebida alcoólica diferente do vinho.
