  text: She considers a field and acquires it[b][a]; from the fruit of her hands she plants a vineyard.
translation:
  language: pt
  text: Ela avalia um campo e o adquire[a]; com os rendimentos de seu trabalho[b], planta uma vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “considera um campo e o toma”. O primeiro verbo também pode transmitir a ideia de planejar; «adquire» é natural no contexto econômico, sem afirmar explicitamente que houve compra.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do fruto de suas mãos”; uma expressão para os rendimentos ou recursos resultantes de seu trabalho.
    reason: cultural_note
lexical_decisions:
- source_word: זָמְמָה
  choice: avalia
  rationale: O verbo expressa consideração intencional ou planejamento. “Avalia” comunica deliberação cuidadosa no contexto de uma decisão econômica, sem reduzir o sentido a mero desejo.
- source_word: שָׂדֶה
  choice: um campo
  rationale: É o equivalente direto e natural para terra rural ou cultivável neste contexto.
- source_word: וַתִּקָּחֵהוּ
  choice: e o adquire
  rationale: לקח significa de modo amplo “tomar” ou “adquirir”. No contexto econômico, “adquire” é natural e evita especificar uma compra, que o hebraico não declara expressamente.
- source_word: מִפְּרִי כַפֶּיהָ
  choice: com o fruto de suas mãos
  rationale: A expressão preserva a imagem hebraica dos resultados produzidos por seu trabalho. Em português, “com” torna natural a ideia de empregar esse rendimento no plantio, enquanto a nota esclarece o idioma.
- source_word: נטע
  choice: planta
  rationale: O sentido lexical é “plantar”. Embora a forma consonantal seja formalmente ambígua ou incomum neste ponto, o contexto mantém a mulher como sujeito da sequência de ações.
- source_word: כָּרֶם
  choice: uma vinha
  rationale: “Vinha” é um equivalente português estabelecido para uma área plantada com videiras e mantém concisão e dignidade.
