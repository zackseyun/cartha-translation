  yaml_path: translation/ot/proverbs/031/024.yaml
  text: She makes linen garments and sells them[c][b][a], and supplies belts to the merchant.
translation:
  language: pt
  text: Faz roupas de linho e as vende[a]; fornece cintos[b] ao comerciante.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “peças de linho” ou “roupas de linho fino”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “faixas” usadas na cintura.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “ao cananeu”; neste contexto, provavelmente significa “ao comerciante” ou “ao negociante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  choice: roupas de linho
  rationale: O substantivo designa uma peça ou artigo de linho fino. No contexto comercial, o plural natural em português apresenta os produtos confeccionados sem restringir indevidamente o termo a tecido não costurado.
- source_word: עָשְׂתָה
  choice: faz
  rationale: Embora a forma hebraica seja perfeita, o poema retrata atividades habituais da mulher; o presente exprime naturalmente esse valor em português.
- source_word: וַתִּמְכֹּר
  choice: e as vende
  rationale: Dá continuidade à descrição de sua atividade habitual. O pronome feminino plural retoma de modo natural as roupas.
- source_word: חֲגוֹר
  choice: cintos
  rationale: O termo indica algo usado ao redor da cintura. 'Cintos' é claro e atual, enquanto 'faixas' continua sendo uma alternativa lexical possível.
- source_word: נָתְנָה
  choice: fornece
  rationale: Literalmente 'dá', mas, neste contexto de comércio, comunica a entrega ou provisão de mercadoria sem especificar indevidamente a modalidade da transação.
- source_word: לַכְּנַעֲנִי
  choice: ao comerciante
  rationale: Literalmente 'ao cananeu'; em contexto comercial, o gentílico pode designar metonimicamente um negociante. 'Comerciante' torna o sentido contextual claro, preservando a forma literal em nota.
