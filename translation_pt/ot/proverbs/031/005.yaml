  text: פֶּן יִ֭שְׁתֶּה וְ/יִשְׁכַּ֣ח מְחֻקָּ֑ק וִֽ֝/ישַׁנֶּה דִּ֣ין כָּל בְּנֵי עֹֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/005.yaml
  text: lest he drink and forget what has been decreed[b][a], and pervert the justice due to all the afflicted.
translation:
  language: pt
  text: para que não beba, se esqueça do que foi decretado[b] e perverta a justiça de todos os aflitos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “filhos da aflição”, expressão que se refere a pessoas que sofrem ou são oprimidas.
    reason: lexical_alternative
  - marker: b
    text: Ou “do decreto” ou “do que foi prescrito”.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּן
  choice: para que não
  rationale: Introduz o resultado negativo que se procura evitar; em português corrente, a construção comunica a advertência com naturalidade.
- source_word: יִשְׁתֶּה
  choice: beba
  rationale: O imperfeito após פֶּן expressa a ação contra a qual se adverte; o subjuntivo português é adequado à construção.
- source_word: וְיִשְׁכַּח
  choice: se esqueça
  rationale: Expressa de modo natural em português a consequência coordenada do ato de beber.
- source_word: מְחֻקָּק
  choice: do que foi decretado
  rationale: Preserva o sentido passivo da forma derivada de חקק e evita restringi-la indevidamente a 'lei'.
- source_word: וִישַׁנֶּה
  choice: e perverta
  rationale: No contexto judicial, o Piel de שנה indica alteração indevida; 'perverter' mantém a força ética e jurídica.
- source_word: דִּין
  choice: a justiça
  rationale: No contexto da responsabilidade judicial do rei, designa o juízo ou direito devido; 'justiça' é claro e mantém o campo jurídico.
- source_word: כָּל
  choice: todos
  rationale: Reproduz o quantificador abrangente do hebraico.
- source_word: בְּנֵי עֹנִי
  choice: os aflitos
  rationale: Traduz naturalmente o idiomatismo literal 'filhos da aflição', referindo-se aos que sofrem ou são oprimidos.
