  text: The heart of her husband trusts in her, and he will lack no gain.
translation:
  language: pt
  text: O coração do seu marido confia nela, e a ele não faltará ganho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַח
  choice: confia
  rationale: Expressa diretamente a segurança e a confiança depositadas nela, mantendo o presente do hebraico.
- source_word: לֵב
  choice: O coração
  rationale: Preserva a imagem hebraica do coração como centro da confiança, do juízo e da disposição interior.
- source_word: בַּעְלָהּ
  choice: do seu marido
  rationale: Neste contexto conjugal, בַּעַל designa naturalmente o marido.
- source_word: שָׁלָל
  choice: ganho
  rationale: Embora o sentido literal comum seja 'despojo', no contexto descreve o proveito ou benefício que o marido não perde graças à esposa; 'ganho' comunica esse uso metafórico sem introduzir a imagem estranha de saque.
- source_word: לֹא יֶחְסָר
  choice: não faltará
  rationale: Reproduz de modo natural a ideia de não sofrer falta ou carência.
