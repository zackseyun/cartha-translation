  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação conserva a concisão de um título sapiencial. Os marcadores aparecem junto aos termos ambíguos correspondentes, e a leitura geográfica de מַשָּׂא é mantida sem ser imposta ao texto principal.
