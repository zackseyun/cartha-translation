  text: דִּ֭בְרֵי לְמוּאֵ֣ל מֶ֑לֶךְ מַ֝שָּׂ֗א אֲֽשֶׁר יִסְּרַ֥תּ/וּ אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/001.yaml
  text: 'The words of King Lemuel[b][a], an oracle that his mother taught him:'
translation:
  language: pt
  text: 'Palavras do rei Lemuel, um oráculo[a] que sua mãe lhe ensinou[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Palavras de Lemuel, rei de Massá, que sua mãe lhe ensinou”. O hebraico מַשָּׂא pode ser entendido como “oráculo” ou como o nome do lugar “Massá”.'
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico também pode significar “instruiu” ou “disciplinou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Palavras de
  rationale: Plural em construto de דָּבָר, empregado como fórmula de título; “Palavras de” é direto, natural e menos interpretativo que “Provérbios de” ou “Ditos de”.
- source_word: לְמוּאֵל
  choice: Lemuel
  rationale: Nome próprio transliterado segundo a forma tradicional em português.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Título em aposição a Lemuel; em português, a ordem natural é “rei Lemuel”.
- source_word: מַשָּׂא
  choice: um oráculo
  rationale: De acordo com a vocalização massorética e um sentido lexical comum de מַשָּׂא, designa uma mensagem solene ou profética. A possível leitura como topônimo, “Massá”, é preservada em nota.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo que liga “oráculo” à oração seguinte, expresso de modo natural em português.
- source_word: יִסְּרַתּוּ
  choice: ensinou
  rationale: O verbo יסר abrange instruir, corrigir e disciplinar. No contexto da transmissão materna de sabedoria, “ensinou” comunica claramente o sentido principal sem excluir a dimensão formativa, registrada em nota.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Substantivo com sufixo masculino singular, traduzido diretamente.
theological_decisions: []
