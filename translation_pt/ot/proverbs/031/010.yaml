  text: אֵֽשֶׁת חַ֭יִל מִ֣י יִמְצָ֑א וְ/רָחֹ֖ק מִ/פְּנִינִ֣ים מִכְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/010.yaml
  text: A wife of noble character—who can find? Her value is far beyond jewels[a][b][c].
translation:
  language: pt
  text: Mulher de grande valor, quem a encontrará? Seu valor está muito acima das joias[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esposa de grande valor”; o hebraico pode referir-se de modo mais geral a uma mulher, embora o contexto do lar favoreça “esposa”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido por “pérolas” ou, tradicionalmente, “rubis”; não se sabe ao certo qual objeto precioso está em vista.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Seu preço supera em muito o das joias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: Mulher de grande valor
  rationale: A expressão construta pode designar uma mulher ou esposa caracterizada por força, capacidade, excelência e dignidade. O contexto doméstico favorece a ideia de esposa, mas “mulher” preserva a forma ampla do hebraico e soa natural em português; “de grande valor” reúne capacidade e caráter sem restringir חַיִל ao sentido militar.
- source_word: מִי יִמְצָא
  choice: quem a encontrará?
  rationale: O imperfeito tem força retórica e salienta a raridade dessa mulher; o futuro idiomático em português mantém a pergunta sem transformá-la numa declaração absoluta de impossibilidade.
- source_word: וְרָחֹק
  choice: está muito acima
  rationale: 'O adjetivo “distante” funciona comparativamente: o valor dela excede em muito o das preciosidades mencionadas.'
- source_word: פְּנִינִים
  choice: joias
  rationale: A identificação exata do objeto precioso é incerta. “Joias” comunica alto valor sem especificar indevidamente pérolas, rubis ou corais.
- source_word: מִכְרָהּ
  choice: Seu valor
  rationale: O substantivo indica preço, avaliação ou valor. “Valor” conserva a comparação e evita uma formulação excessivamente comercial.
