  source_fidelity: O texto traduz adequadamente אֵשֶׁת־חַיִל de modo amplo como “Mulher de grande valor”, sem eliminar a possibilidade contextual de “esposa”. A pergunta retórica de מִי יִמְצָא é preservada. “Seu valor está muito acima das joias” comunica de forma fiel a comparação de valor expressa por וְרָחֹק ... מִכְרָהּ, e “joias” evita especificar indevidamente פְּנִינִים, cuja identificação permanece incerta.
