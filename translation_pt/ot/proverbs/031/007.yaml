  text: יִ֭שְׁתֶּה וְ/יִשְׁכַּ֣ח רִישׁ֑/וֹ וַ֝/עֲמָל֗/וֹ לֹ֣א יִזְכָּר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/007.yaml
  text: Let him drink and forget his poverty[a], and remember his trouble no more.
translation:
  language: pt
  text: Que ele beba e se esqueça da sua pobreza, e não se lembre mais da sua aflição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do seu trabalho penoso»; o hebraico pode se referir a trabalho árduo, dificuldade ou sofrimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁתֶּה
  choice: Que ele beba
  rationale: O imperfeito com valor volitivo, em continuidade com o contexto, expressa permissão ou exortação; «Que ele beba» preserva essa nuance sem o transformar em simples futuro.
- source_word: וְיִשְׁכַּח
  choice: e se esqueça
  rationale: A conjunção seguida do imperfeito dá continuidade à sequência volitiva e pode sugerir propósito ou resultado; esta formulação conserva a fluidez e evita determinar excessivamente a relação.
- source_word: רִישׁוֹ
  choice: da sua pobreza
  rationale: רִישׁ designa pobreza ou condição de privação; «pobreza» é uma tradução direta, natural e amplamente compreensível.
- source_word: וַעֲמָלוֹ
  choice: da sua aflição
  rationale: עָמָל pode indicar trabalho penoso, dificuldade, sofrimento ou miséria. «Aflição» comunica aqui o peso vivido pela pessoa sem restringir o sentido ao trabalho.
- source_word: לֹא יִזְכָּר עוֹד
  choice: não se lembre mais
  rationale: A negação com זכר e עוֹד indica cessação; «não se lembre mais» reproduz de modo natural e conciso a ideia de já não recordar.
