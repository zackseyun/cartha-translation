  naturalness: “Ela procura lã e linho” é claro e natural. A expressão “trabalha com mãos dispostas” é compreensível, mas pouco idiomática no português moderno; “trabalha de boa vontade com as mãos” comunica o mesmo sentido de forma natural e mantém a imagem das mãos.
