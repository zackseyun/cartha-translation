base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/013.yaml
  text: She seeks wool and flax[a], and works with willing hands.
translation:
  language: pt
  text: Ela procura lã e linho e trabalha de boa vontade com as mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trabalha com prazer com as próprias mãos” ou “trabalha diligentemente com as mãos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרְשָׁה
  choice: procura
  rationale: O verbo indica buscar ou procurar ativamente. “Procura” preserva essa iniciativa sem especificar se ela apenas busca, seleciona ou adquire os materiais.
- source_word: צֶמֶר
  choice: lã
  rationale: O substantivo designa diretamente a lã, material têxtil comum.
- source_word: וּפִשְׁתִּים
  choice: linho
  rationale: O termo hebraico designa o linho, seja como planta/fibra usada na produção têxtil. Em português corrente, “linho” é mais natural que “fibras de linho” e mantém o paralelismo com “lã”.
- source_word: וַתַּעַשׂ
  choice: trabalha
  rationale: Embora o verbo seja amplo, com o sentido de fazer ou realizar, o contexto de produção têxtil favorece “trabalha” como expressão natural da atividade produtiva.
- source_word: בְּחֵפֶץ
  choice: dispostas
  rationale: O substantivo pode expressar prazer, desejo, agrado ou disposição. Ligado às mãos, “dispostas” comunica prontidão voluntária sem eliminar totalmente a ideia de satisfação no trabalho.
- source_word: כַּפֶּיהָ
  choice: mãos
  rationale: Embora o termo possa significar literalmente “palmas”, “mãos” é o equivalente idiomático natural para os instrumentos do trabalho manual.
