  text: פְּתַח פִּ֥י/ךָ שְׁפָט צֶ֑דֶק וְ֝/דִ֗ין עָנִ֥י וְ/אֶבְיֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/009.yaml
  text: Open your mouth[a], judge righteously, and plead the cause of the poor and needy.
translation:
  language: pt
  text: Abra a boca[a], julgue com justiça e defenda a causa do pobre e do necessitado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tome a palavra, julgue com justiça e defenda o pobre e o necessitado.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Abra a boca
  rationale: Mantém a imagem concreta do imperativo hebraico e, em português, comunica naturalmente a ordem de tomar a palavra em favor de alguém.
- source_word: שְׁפָט
  choice: julgue
  rationale: O imperativo tem sentido judicial de julgar ou proferir juízo; “julgue” é conciso e preserva essa força.
- source_word: צֶדֶק
  choice: com justiça
  rationale: O substantivo funciona adverbialmente. “Com justiça” é natural em português e conserva o vínculo lexical com justiça/retidão.
- source_word: וְדִין
  choice: defenda a causa
  rationale: דין pode significar julgar, contender ou pleitear uma causa. Neste paralelismo judicial, “defenda a causa” expressa advocacy legal sem restringir indevidamente o sentido.
- source_word: עָנִי
  choice: do pobre
  rationale: No contexto sapiencial e jurídico, designa a pessoa pobre ou aflita; “pobre” é a opção mais clara aqui.
- source_word: אֶבְיוֹן
  choice: do necessitado
  rationale: Indica alguém carente ou indigente. “Necessitado” preserva a distinção em relação a עָנִי e evita repetição.
