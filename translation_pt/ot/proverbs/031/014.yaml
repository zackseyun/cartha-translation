  yaml_path: translation/ot/proverbs/031/014.yaml
  text: She is like merchant ships[a]; from far away she brings her food.
translation:
  language: pt
  text: Ela é como navios mercantes; de longe traz seu alimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu pão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: Ela é
  rationale: O perfeito qal na 3ª pessoa feminina singular descreve, neste contexto proverbial, uma conduta característica; por isso, o presente é natural em português.
- source_word: כָּאֳנִיּוֹת סוֹחֵר
  choice: como navios mercantes
  rationale: A preposição כְּ introduz a comparação, e סוֹחֵר caracteriza os navios como ligados ao comércio. A expressão portuguesa é clara e preserva o plural do hebraico.
- source_word: מִמֶּרְחָק
  choice: de longe
  rationale: Expressa procedência de um lugar distante de modo conciso, natural e fiel em português.
- source_word: תָּבִיא
  choice: traz
  rationale: O hifil de בוא significa aqui fazer chegar ou trazer, referindo-se à obtenção das provisões.
- source_word: לַחְמָהּ
  choice: seu alimento
  rationale: Embora לֶחֶם signifique literalmente “pão”, também pode designar alimento em sentido mais amplo; o contexto trata do abastecimento doméstico.
