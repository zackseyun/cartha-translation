  text: יָ֭דֶי/הָ שִׁלְּחָ֣ה בַ/כִּישׁ֑וֹר וְ֝/כַפֶּ֗י/הָ תָּ֣מְכוּ פָֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/019.yaml
  text: She stretches out her hands to the distaff[a], and her palms hold the spindle.
translation:
  language: pt
  text: Ela estende as mãos para a roca[a], e suas palmas seguram o fuso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela põe as mãos na roca, e suas palmas agarram o fuso”.'
    reason: Alternativa lexical que preserva outras possibilidades contextuais para שִׁלְּחָה, בַכִּישׁוֹר e תָּמְכוּ.
lexical_decisions:
- source_word: יָדֶיהָ
  choice: as mãos
  rationale: O dual com sufixo de terceira pessoa feminina singular refere-se naturalmente às duas mãos da mulher retratada no poema.
- source_word: שִׁלְּחָה
  choice: estende
  rationale: O verbo שׁלח descreve aqui uma ação manual intencional; “estende” preserva a imagem concreta sem tornar a expressão artificial em português.
- source_word: בַכִּישׁוֹר
  choice: para a roca
  rationale: כִּישׁוֹר designa um instrumento de fiar, provavelmente a roca; “para” expressa com naturalidade o movimento das mãos em direção ao instrumento e o distingue do fuso no segundo membro.
- source_word: וְכַפֶּיהָ
  choice: e suas palmas
  rationale: כַּף indica especificamente a palma da mão. A escolha mantém a imagem corporal e o paralelismo poético, embora “mãos” fosse mais idiomático.
- source_word: תָּמְכוּ
  choice: seguram
  rationale: תמך pode significar sustentar, segurar ou agarrar. “Seguram” é natural no contexto do manuseio de um instrumento de fiar e não especifica demais o gesto.
- source_word: פָלֶךְ
  choice: o fuso
  rationale: פָלֶךְ designa um utensílio de fiação, normalmente o fuso, complementando a referência à roca no primeiro membro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém os termos tradicionais do trabalho têxtil (“roca” e “fuso”) e a distinção poética entre “mãos” e “palmas”.
