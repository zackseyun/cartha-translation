  source_fidelity: 'A tradução preserva adequadamente os dois membros do hebraico: o dual יָדֶיהָ é expresso por “as mãos”; שִׁלְּחָה é bem representado por “estende”; a distinção entre כִּישׁוֹר (“roca”) e פָלֶךְ (“fuso”) é mantida; e כַּפֶּיהָ recebe a tradução específica “suas palmas”. “Seguram” representa com sobriedade e fidelidade o campo semântico de תָּמְכוּ.'
