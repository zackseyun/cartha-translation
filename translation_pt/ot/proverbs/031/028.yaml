  source_fidelity: 'O sentido central está preservado: os filhos se levantam e a declaram bem-aventurada/feliz, e o marido a louva. Contudo, «proclamam feliz» não é a formulação portuguesa mais idiomática para אשר no piel, e a construção com «também» pode ser apresentada de modo mais claro sem eliminar a elipse hebraica.'
  naturalness: «A declaram feliz» é mais natural e preciso do que «a proclamam feliz». A pontuação com travessão torna legível a transição elíptica para o marido, preservando o efeito do hebraico e o caráter incompleto da frase antes de «ele a elogia».
  terminology: «Filhos» mantém adequadamente a amplitude possível de בָנֶיהָ. A nota alternativa deve empregar «filhos do sexo masculino», não «filhos homens». «Declaram feliz» comunica reconhecimento declarativo, sem introduzir a ideia de conceder uma bênção.
