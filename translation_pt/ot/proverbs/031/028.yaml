revisions:
- from: 'Seus filhos se levantam e a proclamam feliz[a]; seu marido também[b], e ele a elogia:'
  to: 'Seus filhos se levantam e a declaram feliz[a]; seu marido também — ele a elogia:'
  rationale: A revisão substitui uma expressão menos idiomática por «a declaram feliz», conserva «filhos» como equivalente amplo de בָנֶיהָ e melhora a redação da alternativa lexical. O travessão representa a elipse do hebraico sem preencher dogmaticamente o que o marido faz «também». A nota b é mantida como registro da ambiguidade sintática, embora o marcador não seja necessário no texto revisado.
