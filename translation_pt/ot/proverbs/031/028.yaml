  yaml_path: translation/ot/proverbs/031/028.yaml
  text: 'Her children rise up and call her blessed[a]; her husband also[b], and he praises her:'
translation:
  language: pt
  text: 'Seus filhos se levantam e a declaram feliz[a]; seu marido também — ele a elogia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus filhos do sexo masculino”. O termo hebraico בָנֶיהָ pode referir-se especificamente aos filhos do sexo masculino ou, de modo mais geral, aos filhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָמוּ
  choice: se levantam
  rationale: Traduz diretamente o qal de קום e conserva tanto a ação concreta quanto a possível nuance de demonstração pública de respeito.
- source_word: בָנֶיהָ
  choice: seus filhos
  rationale: בנים pode indicar especificamente filhos homens ou, em certos contextos, os filhos em geral. Em português, “filhos” preserva essa mesma possibilidade; a alternativa mais específica é registrada em nota.
- source_word: וַיְאַשְּׁרוּהָ
  choice: a proclamam feliz
  rationale: O piel de אשר significa declarar alguém feliz, afortunado ou digno de felicitação. “Proclamam feliz” comunica uma declaração de reconhecimento, sem sugerir que os filhos lhe concedem uma bênção.
- source_word: בַּעְלָהּ
  choice: seu marido
  rationale: Embora בעל possa ter outros sentidos, neste contexto doméstico designa claramente o marido.
- source_word: וַיְהַלְלָהּ
  choice: ele a elogia
  rationale: הלל expressa louvor ou elogio. O pronome “ele” explicita naturalmente em português que o sujeito singular é o marido.
- source_word: ו
  choice: também, e
  rationale: A sequência hebraica muda dos filhos para o marido e tem forma elíptica. “Também” preserva o valor aditivo, enquanto “e” introduz a ação expressa do marido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao hebraico. “Proclamam feliz” soa natural e distingue uma declaração de reconhecimento do ato de abençoar. A elipse antes da ação do marido foi preservada no texto e esclarecida em nota.
