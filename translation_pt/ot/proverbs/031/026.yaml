  yaml_path: translation/ot/proverbs/031/026.yaml
  text: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
translation:
  language: pt
  text: Abre a boca com sabedoria, e a instrução bondosa está na sua língua.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a instrução da bondade” ou “a lei da bondade”. O hebraico תּוֹרָה pode significar “lei”, mas aqui provavelmente se refere, de modo mais amplo, a instrução ou ensino.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico חֶסֶד também pode expressar amor leal, misericórdia ou fidelidade, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיהָ
  choice: a boca
  rationale: Preserva a imagem concreta do hebraico; em português, “abrir a boca” comunica naturalmente o ato de falar.
- source_word: פָּתְחָה
  choice: abre
  rationale: O perfeito hebraico descreve aqui uma ação característica no retrato poético; o presente proverbial é natural em português.
- source_word: בְחָכְמָה
  choice: com sabedoria
  rationale: Mantém o valor modal ou associativo da preposição בְּ e soa claro e digno.
- source_word: וְתוֹרַת
  choice: a instrução
  rationale: תּוֹרָה, neste contexto sapiencial, denota ensino ou orientação, sem exigir o sentido mais estritamente jurídico de “lei”.
- source_word: חֶסֶד
  choice: bondosa
  rationale: Na construção תּוֹרַת חֶסֶד, o adjetivo produz português mais natural e expressa o caráter benevolente do ensino, sem eliminar em nota a amplitude semântica de חֶסֶד.
- source_word: תּוֹרַת חֶסֶד
  choice: a instrução bondosa
  rationale: Transmite de modo idiomático que a instrução é marcada pela bondade; a alternativa estruturalmente mais literal é preservada em nota.
- source_word: עַל לְשׁוֹנָהּ
  choice: está em sua língua
  rationale: Conserva a metáfora hebraica da língua como sede da fala pronta e habitual. “Em sua língua” é corrente em português, embora “sobre a sua língua” seja mais formalmente literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O paralelismo e as imagens concretas do hebraico foram preservados, enquanto “instrução bondosa” evita uma formulação excessivamente rígida ou pouco idiomática.
