  text: לֹא תִירָ֣א לְ/בֵיתָ֣/הּ מִ/שָּׁ֑לֶג כִּ֥י כָל בֵּ֝יתָ֗/הּ לָבֻ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/021.yaml
  text: She does not fear snow for her household[a], for all her household are clothed in scarlet.
translation:
  language: pt
  text: Ela não teme a neve por sua casa, pois todos os de sua casa estão vestidos de escarlate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vestidos com roupas duplas”. Alguns entendem aqui o hebraico שָׁנִים no sentido de duplicidade, em vez de tecido escarlate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: não teme
  rationale: O qal imperfeito, na descrição habitual da mulher, expressa ausência contínua de temor ou preocupação; a formulação é direta e preserva a força verbal.
- source_word: לְבֵיתָהּ
  choice: por sua casa / todos os de sua casa
  rationale: בַּיִת pode indicar tanto a casa quanto as pessoas que a compõem. O contexto trata das pessoas sob seus cuidados; a segunda ocorrência é explicitada de modo natural em português.
- source_word: מִשָּׁלֶג
  choice: a neve
  rationale: A preposição מִן indica a circunstância que poderia causar preocupação. Em português, 'temer a neve por sua casa' transmite naturalmente esse sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão de ela não temer, preservando a conexão explicativa em registro literário claro.
- source_word: לָבֻשׁ
  choice: estão vestidos
  rationale: Embora a forma hebraica seja singular e concorde coletivamente com בֵּיתָהּ, o plural é natural em português com 'todos os de sua casa'.
- source_word: שָׁנִים
  choice: escarlate
  rationale: A leitura lexical tradicional e mais direta entende o termo como 'escarlate' ou tecido dessa cor. A possível relação com 'duplo', contextualmente apropriada à neve, permanece na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Casa' preserva o campo semântico doméstico do hebraico, enquanto 'todos os de sua casa' deixa claro que se trata das pessoas. A ambiguidade de שָׁנִים é mantida em nota.
