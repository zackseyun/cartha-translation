  text: She girds her waist with strength and makes her arms strong[a].
translation:
  language: pt
  text: Ela se cinge de força e fortalece os braços.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ela cinge a própria cintura com força». O hebraico conserva uma imagem corporal concreta de prontidão e vigor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגְרָה
  choice: se cinge
  rationale: Preserva a imagem concreta de prender algo ao redor da cintura e, no presente, combina com o estilo proverbial.
- source_word: בְּעֹז
  choice: de força
  rationale: Expressa de modo natural em português a força com que ela se equipa; a construção idiomática «cingir-se de força» mantém a metáfora hebraica.
- source_word: מָתְנֶיהָ
  choice: implícito em «se cinge»
  rationale: O verbo português já sugere a região da cintura; a nota explicita a imagem corporal presente no hebraico sem tornar o texto principal pesado.
- source_word: וַתְּאַמֵּץ
  choice: fortalece
  rationale: 'Comunica de maneira direta o valor factitivo/intensivo da forma piel: tornar fortes ou firmes.'
- source_word: זְרֹעוֹתֶיהָ
  choice: os braços
  rationale: É o equivalente português claro e comum, preservando a ênfase na capacidade vigorosa para o trabalho.
