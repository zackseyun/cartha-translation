  naturalness: “Abra a boca em favor de quem não pode falar” é natural e apropriado ao registro. A sequência “pela causa de todos os que estão passando”, porém, é semanticamente opaca e pouco idiomática. “Todos os que estão perecendo” é natural e conserva uma das leituras lexicais centrais, com as demais devidamente mantidas em nota.
  terminology: “Causa” representa bem a dimensão judicial de דִּין sem impor uma interpretação denominacional ou excessivamente específica. “Quem não pode falar” é uma formulação respeitosa e clara para אִלֵּם.
