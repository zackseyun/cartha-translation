  text: פְּתַח פִּ֥י/ךָ לְ/אִלֵּ֑ם אֶל דִּ֝֗ין כָּל בְּנֵ֥י חֲלֽוֹף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/008.yaml
  text: Open your mouth for the mute[a], for the cause of all the passing away.
translation:
  language: pt
  text: Abra a boca em favor de quem não pode falar[a], pela causa de todos os que estão perecendo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de quem não tem voz”.'
    reason: A expressão pode indicar literalmente quem não fala e, no contexto judicial, quem não consegue defender a própria causa.
  - marker: b
    text: Hebraico difícil. Também pode ser entendido como “pela causa de todos os desamparados”, “de todos os que estão desaparecendo” ou, mais literalmente, “de todos os filhos da transitoriedade”. O raro termo hebraico חֲלוֹף está ligado à ideia de passar ou desaparecer, mas seu sentido exato aqui é incerto.
    reason: Preserva a incerteza lexical e as principais possibilidades interpretativas da rara expressão hebraica.
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Abra a boca
  rationale: Preserva o imperativo concreto e a imagem hebraica, além de soar como uma exortação natural em português.
- source_word: לְאִלֵּם
  choice: em favor de quem não pode falar
  rationale: Expressa de modo claro e respeitoso a pessoa incapaz de falar e, no contexto, de defender a própria causa; evita substantivar uma condição pessoal.
- source_word: אֶל־דִּין
  choice: pela causa
  rationale: Mantém a nuance forense de דִּין, aqui relacionada à causa ou ao pleito que precisa ser defendido, sem ampliar o termo simplesmente para 'justiça'.
- source_word: כָּל בְּנֵי חֲלוֹף
  choice: todos os que estão passando
  rationale: Conserva a imagem verbal provavelmente ligada a חלף, 'passar', e evita resolver a dificuldade lexical em favor de uma única interpretação mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a metáfora de abrir a boca e a ambiguidade da expressão final, remetendo as alternativas necessárias às notas.
