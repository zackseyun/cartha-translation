source:
  edition: WLC
  text: אַל תִּתֵּ֣ן לַ/נָּשִׁ֣ים חֵילֶ֑/ךָ וּ֝/דְרָכֶ֗י/ךָ לַֽ/מְח֥וֹת מְלָכִֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/003.yaml
  text: Do not give your strength to women[b][a], or your ways to that which destroys kings.
translation:
  language: pt
  text: Não entregue às mulheres a sua força[a], nem os seus caminhos ao que arruína reis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Força” também pode incluir vigor, capacidade, recursos ou riqueza, e não somente poder físico.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta expressão é difícil. Outras traduções possíveis são: “nem os seus caminhos à ruína dos reis” ou “nem os seus caminhos ao que destrói reis”.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Não entregue
  rationale: A partícula negativa com o imperfeito expressa proibição. “Não entregue” conserva a metáfora de dar ou ceder algo valioso e soa natural em português.
- source_word: לַנָּשִׁים
  choice: às mulheres
  rationale: O substantivo hebraico está no plural e significa “mulheres”; não há base textual suficiente para restringi-lo a “esposas” ou a uma única mulher.
- source_word: חֵילֶךָ
  choice: a sua força
  rationale: חַיִל pode abranger força, vigor, capacidade, recursos e riqueza. “Força” mantém essa amplitude melhor que opções mais específicas.
- source_word: וּדְרָכֶיךָ
  choice: nem os seus caminhos
  rationale: דֶּרֶךְ pode indicar caminho, conduta ou curso de vida. Depois de uma proibição, “nem” comunica naturalmente em português a coordenação hebraica.
- source_word: לַמְחוֹת
  choice: ao que arruína
  rationale: A forma é difícil e admite análise como infinitivo substantivado ligado à ideia de apagar, destruir ou arruinar. “Ao que arruína” preserva a referência não especificada sem introduzir agentes pessoais ausentes do texto.
- source_word: מְלָכִין
  choice: reis
  rationale: Forma plural de “rei”, preservando o contexto de instrução régia.
theological_decisions:
- issue: Alcance da advertência sobre as mulheres
  choice: Manter a formulação geral do hebraico como advertência sapiencial contra dissipar a força régia em envolvimentos com mulheres.
  alternative: Restringir a advertência a esposas estrangeiras, à poligamia real ou convertê-la numa condenação geral das mulheres.
  rationale: O texto diz literalmente “mulheres”, mas não define um grupo específico nem formula uma doutrina sobre a natureza feminina. A tradução deve conservar a advertência sem ampliar seu alcance.
- issue: Sentido de חֵילֶךָ
  choice: Força em sentido amplo, incluindo vigor, capacidade e recursos.
  alternative: Riqueza apenas ou potência sexual especificamente.
  rationale: A amplitude lexical e o paralelismo não justificam reduzir o termo a uma única dimensão.
- issue: Construção de לַמְחוֹת מְלָכִין
  choice: “ao que arruína reis”
  alternative: “à ruína dos reis”, “aos que destroem reis” ou “à destruição dos reis”.
  rationale: O hebraico é sintaticamente difícil. A formulação escolhida mantém a força destrutiva do verbo e a referência aberta, sem resolver indevidamente se se trata de pessoa, prática ou ruína abstrata.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “sua/seus”. A tradução conserva o paralelismo e a ambiguidade da expressão final, evitando especificar agentes ou práticas que o hebraico não identifica.
