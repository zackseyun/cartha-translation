source:
  edition: WLC
  text: שֶׁ֣קֶר הַ֭/חֵן וְ/הֶ֣בֶל הַ/יֹּ֑פִי אִשָּׁ֥ה יִרְאַת יְ֝הוָ֗ה הִ֣יא תִתְהַלָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/030.yaml
  text: Charm is deceitful[a], and beauty is fleeting[c][b], but a woman who fears Yahweh shall be praised.
translation:
  language: pt
  text: O encanto é enganoso, e a beleza é passageira[a]; mas a mulher[b] que teme Yahweh será elogiada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a beleza é vapor”. A imagem hebraica pode ressaltar tanto a transitoriedade quanto a falta de substância.
    reason: lexical_alternative
  - marker: b
    text: Ou “a esposa”; o termo hebraico אִשָּׁה pode significar “mulher” ou “esposa”, conforme o contexto.
    reason: alternative_reading
  - marker: c
    text: Ou “elogiará a si mesma”, se o verbo for entendido reflexivamente; porém, o contexto favorece “será elogiada”.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁקֶר
  choice: enganoso
  rationale: O substantivo hebraico expressa falsidade ou engano. Em português, o predicativo adjetival “enganoso” é natural com “encanto” e preserva a avaliação negativa do provérbio.
- source_word: הַחֵן
  choice: o encanto
  rationale: Neste contexto, refere-se à atratividade ou graça exterior, não à graça em sentido teológico nem ao favor social. “Encanto” é direto e idiomático.
- source_word: הֶבֶל
  choice: passageira
  rationale: A imagem básica é sopro ou vapor e pode indicar transitoriedade ou vazio. Com “beleza”, “passageira” comunica com clareza que ela não dura, enquanto a nota preserva a metáfora hebraica.
- source_word: הַיֹּפִי
  choice: a beleza
  rationale: É o equivalente português mais direto e natural para a beleza ou atratividade em vista.
- source_word: אִשָּׁה
  choice: a mulher
  rationale: O termo pode significar “mulher” ou “esposa”. Aqui, a formulação sapiencial permite o sentido geral “mulher”, sem excluir na nota a alternativa contextual “esposa”.
- source_word: יִרְאַת יְהוָה
  choice: que teme a Yahweh
  rationale: A construção identifica a mulher por seu temor reverente a Yahweh. A oração relativa é clara em português e preserva o tema sapiencial do temor de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando o nome pactual presente no texto hebraico.
- source_word: הִיא
  choice: representado pelo sujeito da oração final
  rationale: O pronome independente dá destaque à mulher. Em português, esse foco é suficientemente comunicado pela estrutura contrastiva sem uma repetição pouco natural de “ela”.
- source_word: תִתְהַלָּל
  choice: será elogiada
  rationale: 'O hitpael pode admitir sentido reflexivo, “elogiar-se” ou “gloriar-se”, mas o contexto de exaltação da mulher favorece o sentido passivo ou estimativo: ela receberá elogio. A alternativa é preservada em nota.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Sentido de תִתְהַלָּל na oração final
  choice: 'sentido passivo: “será elogiada”'
  alternative: 'sentido reflexivo: “poderá elogiar a si mesma” ou “se gloriará”'
  rationale: Embora a forma verbal possa ser reflexiva, o contraste com o encanto e a beleza, juntamente com a conclusão elogiosa do poema, favorece que essa mulher seja o objeto do louvor. A nota mantém visível a ambiguidade legítima.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação realça o contraste entre qualidades exteriores transitórias e o temor de Yahweh, sem inserir ênfase artificial. As três notas preservam a metáfora, a ambiguidade de אִשָּׁה e a possível leitura reflexiva do verbo final.
