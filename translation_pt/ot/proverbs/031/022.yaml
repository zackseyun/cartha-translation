  text: מַרְבַדִּ֥ים עָֽשְׂתָה לָּ֑/הּ שֵׁ֖שׁ וְ/אַרְגָּמָ֣ן לְבוּשָֽׁ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/022.yaml
  text: She makes coverings for herself[a]; fine linen and purple are her clothing.
translation:
  language: pt
  text: Faz para si cobertas[a]; linho fino e púrpura são as suas vestes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “colchas”, “cobertas de cama” ou, possivelmente, “tapeçarias”. O termo hebraico refere-se de modo amplo a tecidos usados como cobertura e pode indicar artigos domésticos luxuosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: cobertas
  rationale: O substantivo plural designa tecidos estendidos, provavelmente usados no ambiente doméstico ou sobre camas. “Cobertas” é natural e suficientemente amplo em português, sem restringir o sentido a colchas ou tapeçarias.
- source_word: עָשְׂתָה
  choice: faz
  rationale: Embora a forma hebraica seja qatal, no retrato sapiencial ela expressa uma ação característica; o presente comunica adequadamente esse hábito.
- source_word: לָּהּ
  choice: para si
  rationale: A preposição com sufixo indica benefício ou uso próprio; “para si” preserva essa nuance sem tornar explícito mais do que o hebraico.
- source_word: שֵׁשׁ
  choice: linho fino
  rationale: O termo costuma indicar linho de alta qualidade, ligado a vestuário valioso.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Designa material tingido de púrpura, associado a riqueza e dignidade; no paralelismo com vestes, o sentido têxtil fica claro.
- source_word: לְבוּשָׁהּ
  choice: as suas vestes
  rationale: O substantivo singular coletivo refere-se ao vestuário em geral. O plural idiomático “vestes” mantém o tom poético e evita sugerir uma única peça.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve cadência poética. “Cobertas” mantém a amplitude lexical do hebraico, enquanto “vestes” preserva o registro elevado sem soar arcaico.
