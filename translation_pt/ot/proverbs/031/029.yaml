base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/029.yaml
  text: Many daughters have done nobly[b][a], but you surpass them all.
translation:
  language: pt
  text: Muitas filhas agiram com excelência,[a] mas você supera todas elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitas mulheres demonstraram força e valor”. O termo hebraico traduzido por “excelência” também pode indicar força, capacidade ou valor; “filhas” pode referir-se aqui, de modo mais amplo, a mulheres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Muitas
  rationale: Expressa de modo direto e natural o sentido de grande número.
- source_word: בָּנוֹת
  choice: filhas
  rationale: Preserva a imagem literal e poética do hebraico; no contexto, o termo pode designar mulheres de modo mais amplo, como esclarece a nota.
- source_word: עָשׂוּ חָיִל
  choice: agiram com excelência
  rationale: Reproduz a construção verbal e mantém a amplitude de חַיִל, que neste contexto envolve capacidade, força, valor e excelência, sem restringi-lo ao sentido militar.
- source_word: וְאַתְּ
  choice: mas você
  rationale: A conjunção assume valor contrastivo, e o pronome independente dá ênfase à mulher elogiada.
- source_word: עָלִית עַל כֻּלָּנָה
  choice: você supera todas elas
  rationale: Traduz idiomaticamente a imagem de subir acima de todas, preservando a força comparativa total.
