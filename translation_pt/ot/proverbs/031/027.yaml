base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/027.yaml
  text: She watches over the ways of her household[b][a], and does not eat the bread of idleness.
translation:
  language: pt
  text: Ela cuida atentamente do andamento de sua casa[a] e não come o pão da preguiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela cuida atentamente dos assuntos de sua casa”. O hebraico fala literalmente dos “caminhos”, “andamentos” ou “movimentos” de sua casa.'
    reason: lexical_alternative
  - marker: b
    text: “O pão da preguiça” é uma expressão hebraica que retrata a pessoa vivendo na ociosidade ou se sustentando sem trabalho produtivo.
    reason: cultural_note
lexical_decisions:
- source_word: צוֹפִיָּה
  choice: vigia
  rationale: O particípio qal feminino singular expressa uma atividade contínua e atenta. “Vigia” comunica de modo natural a supervisão habitual.
- source_word: הֲלִיכוֹת
  choice: os caminhos
  rationale: O plural deriva de הלך e significa literalmente “andanças” ou “caminhos”; aqui se refere aos movimentos, à conduta ou aos assuntos da casa. “Caminhos” preserva a imagem hebraica.
- source_word: בֵּיתָהּ
  choice: de sua casa
  rationale: בַּיִת pode indicar tanto a residência quanto as pessoas e atividades domésticas. “Sua casa” mantém essa amplitude em português.
- source_word: לֶחֶם
  choice: pão
  rationale: A tradução literal preserva a metáfora hebraica daquilo de que alguém se alimenta ou vive.
- source_word: עַצְלוּת
  choice: preguiça
  rationale: O substantivo designa indolência ou ociosidade censurável. “Preguiça” é claro, atual e mantém a nuance moral.
- source_word: לֹא תֹאכֵל
  choice: não come
  rationale: O imperfeito tem valor característico no enunciado proverbial, descrevendo uma conduta habitual, e não apenas uma ação futura.
