base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/012.yaml
  text: She does him good[a], and not harm, all the days of her life.
translation:
  language: pt
  text: Ela lhe faz o bem[a], e não o mal, todos os dias de sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela lhe retribui com o bem, e não com o mal.” O verbo hebraico também pode ter o sentido de tratar alguém de certa maneira ou de lhe retribuir algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמָלַתְהוּ
  choice: lhe faz
  rationale: O verbo גמל pode significar tratar, retribuir ou recompensar alguém. Com os objetos contrastantes “bem” e “mal”, “lhe faz o bem” comunica naturalmente em português a conduta contínua da mulher para com o marido, sem restringir o sentido à ideia de retribuição.
- source_word: טוֹב
  choice: o bem
  rationale: טוֹב funciona aqui de modo substantivado. “O bem” preserva o contraste direto com “o mal” e soa natural na construção portuguesa “fazer o bem a alguém”.
- source_word: וְלֹא רָע
  choice: e não o mal
  rationale: רָע pode designar mal moral, dano ou adversidade. “O mal” mantém a amplitude lexical e o paralelismo antitético do hebraico; neste contexto relacional, inclui a ideia de prejuízo sem reduzi-la somente a dano material.
- source_word: כֹּל יְמֵי
  choice: todos os dias de
  rationale: A expressão temporal hebraica é representada diretamente por uma formulação portuguesa corrente, preservando sua força distributiva e sua cadência poética.
- source_word: חַיֶּיהָ
  choice: sua vida
  rationale: Embora חַיִּים tenha forma plural em hebraico, neste uso significa o período da vida de uma pessoa. O singular “vida” é a forma idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O paralelismo “o bem... o mal” conserva a concisão e a tensão lexical do hebraico.
