  text: עֹז וְ/הָדָ֥ר לְבוּשָׁ֑/הּ וַ֝/תִּשְׂחַ֗ק לְ/י֣וֹם אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/025.yaml
  text: Strength and dignity are her clothing[a], and she laughs at the days to come.
translation:
  language: pt
  text: Força e dignidade são suas vestes, e ela ri do futuro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ela ri do dia que virá”; literalmente, “ela ri de/para um dia posterior/último”.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹז
  choice: força
  rationale: O substantivo denota força ou poder; “força” é a forma mais natural em português e descreve uma qualidade de caráter.
- source_word: הָדָר
  choice: dignidade
  rationale: Embora possa significar esplendor, majestade ou honra, “dignidade” comunica aqui uma postura honrada sem sugerir pompa régia.
- source_word: לְבוּשָׁהּ
  choice: são as suas vestes
  rationale: Preserva a metáfora hebraica segundo a qual força e dignidade são aquilo de que ela está vestida; o plural concorda naturalmente com os dois substantivos coordenados.
- source_word: וַתִּשְׂחַק
  choice: ela ri
  rationale: Mantém o sentido direto e vívido do verbo שׂחק, expressando confiança diante do que está por vir, sem abrandá-lo para “sorri” nem interpretá-lo como “se alegra”.
- source_word: לְיוֹם אַחֲרוֹן
  choice: do dia que virá
  rationale: A expressão é literalmente “de/para um dia posterior/último”. “Do dia que virá” mantém o singular do hebraico e comunica naturalmente a orientação para o futuro, sem impor uma leitura escatológica.
theological_decisions:
- issue: Possível sentido escatológico de אַחֲרוֹן
  choice: 'Referência temporal ao futuro: “do dia que virá”'
  alternative: “do último dia” ou, de modo mais geral, “do futuro”
  rationale: O contexto sapiencial enfatiza a confiança da mulher diante do futuro. Contudo, como אַחֲרוֹן também pode significar “último”, a nota conserva a ambiguidade lexical sem transformar o verso numa afirmação escatológica explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vestes” conserva a imagem poética sem soar obscuro; “dia que virá” mantém o singular e parte da tensão do hebraico.
