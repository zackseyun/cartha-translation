  text: She opens her palm to the poor[b][a], and extends her hands to the needy.
translation:
  language: pt
  text: Abre a palma da mão ao pobre[a] e estende as mãos ao necessitado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estende a palma da mão ao pobre”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “alcança com as mãos o necessitado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפָּהּ
  choice: a palma da mão
  rationale: כַּף designa com frequência a palma ou a concavidade da mão. A expressão portuguesa preserva a imagem concreta e soa natural com o verbo “abre”.
- source_word: פָּרְשָׂה
  choice: abre
  rationale: פרשׂ significa estender ou abrir. Com “palma da mão”, “abre” comunica de modo idiomático o gesto de generosidade, sem perder a imagem hebraica.
- source_word: לֶעָנִי
  choice: ao pobre
  rationale: עָנִי pode indicar alguém pobre, aflito ou socialmente vulnerável. Neste contexto de auxílio material, “pobre” expressa melhor o sentido predominante.
- source_word: יָדֶיהָ
  choice: as mãos
  rationale: A forma refere-se naturalmente às duas mãos e sustenta o paralelismo com “palma da mão” no primeiro membro.
- source_word: שִׁלְּחָה
  choice: estende
  rationale: No piel, שלח pode significar enviar ou estender. Com “mãos” e um destinatário introduzido por ל, “estende” exprime fielmente o gesto de oferecer ajuda.
- source_word: לָאֶבְיוֹן
  choice: ao necessitado
  rationale: אֶבְיוֹן designa quem está em necessidade ou carência. “Necessitado” mantém a distinção lexical em relação a עָנִי e preserva o paralelismo.
