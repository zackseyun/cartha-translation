  text: תְּנוּ שֵׁכָ֣ר לְ/אוֹבֵ֑ד וְ֝/יַיִן לְ/מָ֣רֵי נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/006.yaml
  text: Give strong drink to one who is perishing[b][a], and wine to those bitter in soul.
translation:
  language: pt
  text: Deem bebida embriagante a quem está perecendo[a] e vinho aos que têm a alma amargurada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a quem está morrendo”. O particípio hebraico pode referir-se, de modo mais amplo, a alguém que perece, está arruinado ou se encontra perto da morte.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos amargurados de alma”, expressão que indica profunda angústia ou miséria interior.
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ
  choice: Deem
  rationale: Imperativo plural de נתן. “Deem” reproduz diretamente tanto a força verbal quanto o número.
- source_word: שֵׁכָר
  choice: bebida embriagante
  rationale: Designa bebida alcoólica, em geral distinta do vinho, com capacidade de embriagar. “Bebida embriagante” evita sugerir especificamente um destilado, que seria anacrônico.
- source_word: לְאוֹבֵד
  choice: a quem perece
  rationale: O particípio de אבד pode indicar alguém que perece, está arruinado ou próximo da morte. A formulação conserva essa amplitude sem restringi-la apenas ao processo de morrer.
- source_word: וְיַיִן
  choice: e vinho
  rationale: Correspondência direta e natural para o termo hebraico comum יַיִן.
- source_word: לְמָרֵי נָפֶשׁ
  choice: aos de alma amargurada
  rationale: Reproduz a metáfora hebraica de amargura interior em português natural, mantendo o plural e o paralelismo.
- source_word: נָפֶשׁ
  choice: alma
  rationale: Neste idioma, נֶפֶשׁ se refere à vida interior ou ao íntimo da pessoa. “Alma” preserva a imagem hebraica e é clara neste contexto.
theological_decisions:
- issue: Se a ordem deve ser atenuada para não parecer uma aprovação geral da embriaguez
  choice: Manter o imperativo direto do hebraico, sem atenuação interpretativa.
  alternative: Apresentar a bebida apenas como uso medicinal limitado ou reformular a frase como ironia.
  rationale: O versículo traz imperativos diretos e, isoladamente, não declara que sejam irônicos nem explicita uma limitação medicinal. Qualificações éticas ou contextuais pertencem à interpretação da passagem mais ampla, não devem ser inseridas silenciosamente na tradução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Bebida embriagante” é preferível a “bebida forte” porque não sugere necessariamente uma bebida destilada; “aos de alma amargurada” conserva a metáfora sem soar excessivamente artificial.
