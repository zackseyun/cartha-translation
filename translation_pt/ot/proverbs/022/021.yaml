id: PRO.22.21
reference: Proverbs 22:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/הוֹדִֽיעֲ/ךָ֗ קֹ֭שְׁטְ אִמְרֵ֣י אֱמֶ֑ת לְ/הָשִׁ֥יב אֲמָרִ֥ים אֱ֝מֶ֗ת לְ/שֹׁלְחֶֽי/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/021.yaml
  text: to make known to you the certainty of words of truth[b][a], so that you may return words of truth to those who sent you.
translation:
  language: pt
  text: para lhe dar a conhecer a confiabilidade das palavras de verdade[a], a fim de que você responda com palavras verdadeiras aos que o enviaram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a verdade das palavras de verdade”; קֹשְׁט também pode significar “verdade”, “correção” ou “certeza”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a fim de que você leve de volta palavras de verdade aos que o enviaram”.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  choice: para lhe dar a conhecer
  rationale: Preserva a força causativa do infinitivo hifil de ידע e soa natural e digna em português.
- source_word: קֹשְׁט
  choice: a confiabilidade
  rationale: Expressa a ideia de correção segura ou caráter digno de confiança, distinguindo o termo de אֱמֶת, que aparece explicitamente duas vezes no versículo.
- source_word: אִמְרֵי אֱמֶת
  choice: das palavras de verdade
  rationale: Mantém de modo natural a construção hebraica no estado construto e a formulação característica da linguagem sapiencial.
- source_word: לְהָשִׁיב
  choice: a fim de que você responda
  rationale: No contexto, o hifil de שוב descreve a ação de dar uma resposta. Esta formulação comunica o sentido idiomático sem perder a finalidade expressa pelo infinitivo.
- source_word: אֲמָרִים אֱמֶת
  choice: com palavras verdadeiras
  rationale: 'A construção sem estado construto favorece entender אֱמֶת de modo atributivo ou adverbial: palavras que correspondem à verdade.'
- source_word: לְשֹׁלְחֶיךָ
  choice: aos que o enviaram
  rationale: Representa naturalmente o particípio qal plural com sufixo de segunda pessoa masculina singular.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para a segunda pessoa singular e evita tanto arcaísmos quanto coloquialismos. A tradução distingue קֹשְׁט de אֱמֶת, mas registra em nota a sobreposição semântica e preserva a ambiguidade de לְהָשִׁיב.
