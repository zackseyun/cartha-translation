  text: עֹ֣שֵֽׁק דָּ֭ל לְ/הַרְבּ֣וֹת ל֑/וֹ נֹתֵ֥ן לְ֝/עָשִׁ֗יר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/016.yaml
  text: One who oppresses the poor to increase his own wealth[a], or gives to the rich[b], will come only to poverty.
translation:
  language: pt
  text: Quem oprime o pobre para aumentar a própria riqueza[a], ou dá ao rico, só acabará na pobreza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem oprime o pobre para enriquecer e dá ao rico — só acabará na pobreza”. O hebraico pode descrever duas ações comparáveis ou um único padrão de conduta que reúne ambas.'
    reason: alternative_reading
  - marker: b
    text: “Pobreza” também pode ser traduzido por “falta” ou “necessidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׁק
  choice: Quem oprime
  rationale: O particípio qal é usado de modo substantivado e descreve genericamente quem explora ou oprime. “Quem oprime” preserva essa força habitual e soa natural em português.
- source_word: דָּל
  choice: o pobre
  rationale: דָּל pode designar alguém pobre, humilde ou socialmente fraco; neste contexto econômico, “o pobre” expressa com clareza o sentido principal.
- source_word: לְהַרְבּוֹת לוֹ
  choice: para aumentar a própria riqueza
  rationale: O infinitivo de רבה com a preposição e o sufixo indica finalidade ou benefício para o próprio agente. O objeto aumentado está implícito; o contexto econômico justifica explicitar “riqueza”.
- source_word: נֹתֵן
  choice: ou dá
  rationale: O segundo particípio qal aparece em uma construção hebraica condensada. “Ou dá” apresenta uma segunda prática comparável, enquanto a nota preserva a possibilidade de as duas ações descreverem um único padrão de conduta.
- source_word: לְעָשִׁיר
  choice: ao rico
  rationale: עָשִׁיר designa uma pessoa rica. “Ao rico” mantém o valor genérico e a concisão proverbial.
- source_word: אַךְ
  choice: apenas
  rationale: 'Aqui אַךְ tem força limitadora e enfática: o resultado é nada além de pobreza.'
- source_word: לְמַחְסוֹר
  choice: na pobreza
  rationale: מַחְסוֹר significa falta, necessidade ou pobreza. “Na pobreza” é a formulação idiomática mais clara para o desfecho econômico indicado pelo provérbio.
theological_decisions:
- issue: Relação sintática entre os dois particípios
  choice: O versículo apresenta duas práticas autodestrutivas — oprimir o pobre para enriquecer e dar ao rico — que levam à pobreza.
  alternative: O versículo descreve uma só pessoa que tanto oprime o pobre como dá ao rico, e assim acaba na pobreza.
  rationale: O hebraico é condensado e não explicita a relação lógica entre os particípios, permitindo uma leitura disjuntiva ou cumulativa. O texto principal usa “ou” para exprimir duas situações paralelas, e a nota registra a leitura combinada sem eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A formulação conserva a concisão proverbial, explicita apenas o ganho econômico implícito no contexto e registra em nota a ambiguidade sintática do hebraico.
