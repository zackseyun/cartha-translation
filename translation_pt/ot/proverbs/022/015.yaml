  text: אִ֭וֶּלֶת קְשׁוּרָ֣ה בְ/לֶב נָ֑עַר שֵׁ֥בֶט מ֝וּסָ֗ר יַרְחִיקֶ֥/נָּה מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/015.yaml
  text: Folly is bound up in the heart of a boy[a]; the rod of discipline will drive it far from him.
translation:
  language: pt
  text: A insensatez está presa ao coração do menino[a]; a vara da disciplina a afastará dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A insensatez está ligada ao coração de um jovem”.'
    reason: Registra a amplitude de נָעַר («menino/jovem») e uma alternativa possível para קְשׁוּרָה («ligada»).
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Em Provérbios, o substantivo indica falta de juízo de caráter moral e prático, não simples deficiência intelectual. “Insensatez” é natural, digna e recorrente no vocabulário sapiencial em português.
- source_word: קְשׁוּרָה
  choice: está presa
  rationale: O particípio passivo descreve algo atado ou firmemente ligado. “Está presa” conserva a imagem concreta e sugere ligação arraigada sem acrescentar uma interpretação ausente do hebraico.
- source_word: בְלֶב
  choice: ao coração
  rationale: A construção portuguesa “presa ao coração” expressa naturalmente a ligação indicada pelo hebraico. “Coração” preserva a metáfora hebraica para o centro do pensamento, da vontade e dos desejos.
- source_word: נָעַר
  choice: menino
  rationale: O termo masculino singular pode abranger desde uma criança até um jovem. Neste contexto de imaturidade e disciplina, “menino” representa de modo natural o provável referente, enquanto a nota registra a alternativa mais ampla.
- source_word: שֵׁבֶט
  choice: vara
  rationale: O substantivo designa concretamente uma vara ou bastão e, neste contexto, um instrumento de correção. Manter “vara” evita diluir a imagem explícita do texto.
- source_word: מוּסָר
  choice: disciplina
  rationale: Na literatura sapiencial, o termo abrange instrução corretiva, formação e castigo disciplinar. “Disciplina” conserva essa amplitude melhor que uma opção restrita apenas à punição.
- source_word: יַרְחִיקֶנָּה
  choice: a afastará
  rationale: A forma causativa significa fazer ficar longe. “A afastará” comunica com clareza a remoção da insensatez; a ideia de distância é inerente ao verbo português.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: O pronome marca separação em relação ao menino. “Dele” completa de maneira direta e idiomática o verbo “afastará”.
theological_decisions:
- issue: Se a imagem de disciplina corporal deve ser suavizada ou tornada abstrata
  choice: Manter a expressão concreta “a vara da disciplina”.
  alternative: Traduzir apenas por “a disciplina” ou “a correção”.
  rationale: O hebraico menciona explicitamente שֵׁבֶט, “vara”. Preservar a imagem respeita a primazia do texto-fonte e não transforma a tradução em comentário ético. A associação com “disciplina” situa a vara no campo da formação corretiva próprio de Provérbios, sem ampliar o dito para além do que ele afirma.
- issue: Como representar o gênero e a faixa etária de נָעַר
  choice: Usar “menino” no texto principal.
  alternative: Usar “jovem”, “rapaz” ou “criança”.
  rationale: A forma hebraica é masculina singular e, no contexto, aponta naturalmente para um menor do sexo masculino sujeito à disciplina. A nota preserva a amplitude lexical de “jovem” sem neutralizar o referente no texto principal.
- issue: Valor da relação entre as duas metades do provérbio
  choice: Usar “mas” para explicitar o contraste pragmático entre a insensatez arraigada e sua remoção pela disciplina.
  alternative: Justapor as orações com ponto e vírgula, sem conjunção expressa.
  rationale: O hebraico apresenta as duas orações em paralelismo sem conjunção explícita. Em português, “mas” comunica naturalmente o contraste implícito, sem alterar a relação lógica fundamental.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conservam-se as imagens sapienciais de “coração” e “vara”, evitando tanto arcaísmo quanto suavização interpretativa.
