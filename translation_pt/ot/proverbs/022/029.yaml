  text: חָזִ֡יתָ אִ֤ישׁ מָ֘הִ֤יר בִּ/מְלַאכְתּ֗/וֹ לִֽ/פְנֵֽי מְלָכִ֥ים יִתְיַצָּ֑ב בַּל יִ֝תְיַצֵּב לִ/פְנֵ֥י חֲשֻׁכִּֽים׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
translation:
  language: pt
  text: Você já viu um homem habilidoso[a] em seu trabalho? Ele se apresentará diante de reis; não se apresentará diante de homens sem importância.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diligente” ou “rápido”. O termo hebraico pode destacar rapidez e prontidão e, por extensão, competência.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “homens obscuros”, isto é, pessoas sem destaque ou posição social importante.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: Você já viu
  rationale: O perfeito qal na segunda pessoa introduz retoricamente uma observação baseada na experiência. “Você já viu” é natural em português e mantém essa força.
- source_word: אִישׁ
  choice: um homem
  rationale: O hebraico emprega o singular masculino representativo. A tradução o conserva sem ampliar nem restringir a aplicação proverbial.
- source_word: מָהִיר
  choice: habilidoso
  rationale: Embora o adjetivo possa indicar rapidez, prontidão ou diligência, junto de מְלָאכָה ressalta sobretudo competência e destreza no trabalho.
- source_word: בִּמְלַאכְתּוֹ
  choice: em seu trabalho
  rationale: A expressão abrange trabalho, ofício, tarefa ou ocupação, sem limitar o provérbio ao artesanato manual.
- source_word: לִפְנֵי מְלָכִים
  choice: diante de reis
  rationale: Preserva a expressão hebraica para comparecer na presença ou a serviço de governantes e mantém a elevação social sugerida pelo contraste.
- source_word: יִתְיַצָּב
  choice: se apresentará
  rationale: O hitpael de יצב expressa tomar posição ou apresentar-se diante de alguém. “Se apresentará” comunica esse sentido naturalmente em português.
- source_word: בַּל
  choice: não
  rationale: A partícula negativa poética estabelece contraste enfático com a primeira afirmação.
- source_word: לִפְנֵי חֲשֻׁכִּים
  choice: diante de homens sem importância
  rationale: O termo significa literalmente pessoas “obscuras”, aqui no sentido social de desconhecidas ou sem destaque. A formulação evita sugerir escuridão moral ou pobreza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura retórica da pergunta e o paralelismo entre os dois grupos foram preservados; “se apresentará” torna natural a imagem hebraica de tomar posição diante de alguém.
