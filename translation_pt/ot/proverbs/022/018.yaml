  text: כִּֽי נָ֭עִים כִּֽי תִשְׁמְרֵ֣/ם בְּ/בִטְנֶ֑/ךָ יִכֹּ֥נוּ יַ֝חְדָּ֗ו עַל שְׂפָתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/018.yaml
  text: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
translation:
  language: pt
  text: Pois é agradável se você as guardar em seu interior[a]; elas estarão firmes, todas juntas, em seus lábios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em seu ventre”, expressão hebraica que se refere ao interior da pessoa.
    reason: cultural_note
  - marker: b
    text: 'Ou: “estarão todas prontas”. O verbo pode enfatizar tanto a firmeza com que as palavras estão estabelecidas quanto sua prontidão para serem pronunciadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי (primeira ocorrência)
  choice: Pois
  rationale: Introduz a motivação para a exortação do versículo anterior, preservando a força explicativa em português natural.
- source_word: נָעִים
  choice: agradável
  rationale: Expressa aquilo que causa prazer ou satisfação, em registro claro e apropriado à literatura sapiencial.
- source_word: כִּי (segunda ocorrência)
  choice: se
  rationale: Neste contexto, introduz a circunstância ou condição em que guardar as palavras é agradável; mantém aberta a nuance entre condição e ocasião.
- source_word: תִשְׁמְרֵם
  choice: você as guardar
  rationale: שׁמר pode significar guardar, conservar ou proteger. Aqui indica reter interiormente as palavras dos sábios.
- source_word: בְּבִטְנֶךָ
  choice: dentro de si
  rationale: A expressão significa literalmente 'em seu ventre', mas funciona como referência à interioridade da pessoa. A tradução evita impor o termo mais interpretativo 'coração'.
- source_word: יִכֹּנוּ
  choice: estiverem firmes
  rationale: O nifal de כון comunica a ideia de estar estabelecido, firme ou preparado. 'Estiverem firmes' preserva o sentido básico e funciona naturalmente com a imagem das palavras nos lábios.
- source_word: יַחְדָּו
  choice: todas
  rationale: O advérbio indica coletividade ou união. Com o pronome plural, 'todas' transmite de modo natural que as palavras estão reunidas e disponíveis.
- source_word: עַל שְׂפָתֶיךָ
  choice: em seus lábios
  rationale: Mantém a imagem hebraica convencional de palavras disponíveis para serem pronunciadas.
