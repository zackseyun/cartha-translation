id: PRO.22.12
reference: Proverbs 22:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֵינֵ֣י יְ֭הוָה נָ֣צְרוּ דָ֑עַת וַ֝/יְסַלֵּ֗ף דִּבְרֵ֥י בֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
translation:
  language: pt
  text: Os olhos de Yahweh preservam o conhecimento[a], mas ele subverte[b] as palavras do traiçoeiro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guardam o conhecimento” ou “protegem o conhecimento”. O verbo hebraico pode significar guardar, conservar ou preservar.
    reason: lexical_alternative
  - marker: b
    text: Ou “perverte” ou “derruba”. O verbo hebraico pode transmitir a ideia de tornar algo torto, pervertê-lo ou derrubá-lo.
    reason: lexical_alternative
  - marker: c
    text: Ou “do desleal”. O termo hebraico se refere a quem age de modo traiçoeiro ou infiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  choice: Os olhos de Yahweh
  rationale: Mantém a imagem antropomórfica do olhar vigilante de Deus e reproduz o nome divino presente no hebraico.
- source_word: נָצְרוּ
  choice: preservam
  rationale: O verbo נצר pode significar guardar, proteger ou preservar; “preservam” forma um contraste claro com a ação destrutiva da segunda oração.
- source_word: דָעַת
  choice: o conhecimento
  rationale: “Conhecimento” é o sentido direto e habitual de דעת em Provérbios, sem restringi-lo interpretativamente a mera compreensão.
- source_word: וַיְסַלֵּף
  choice: mas ele derruba
  rationale: סלף expressa a ideia de tornar torto, subverter ou fazer cair. “Derruba” comunica de modo natural a oposição eficaz de Yahweh às palavras do desleal, preservando a força metafórica do verbo.
- source_word: דִּבְרֵי
  choice: as palavras
  rationale: Embora דבר também possa designar assuntos ou atos, “palavras” é a leitura mais direta neste contexto.
- source_word: בֹגֵד
  choice: do traiçoeiro
  rationale: בוגד designa quem age com traição ou deslealdade. “Traiçoeiro” preserva o caráter pessoal e moral do termo sem especificar indevidamente o âmbito da infidelidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” procura representar o nome divino, em vez de substituí-lo por um título.
- issue: Relação entre a vigilância divina e o conhecimento
  choice: Manter a afirmação de que os olhos de Yahweh preservam o conhecimento
  alternative: Explicitar que Yahweh protege as pessoas que possuem conhecimento
  rationale: O hebraico apresenta “conhecimento” como objeto direto e não identifica explicitamente pessoas sábias como objeto da proteção; a tradução conserva essa formulação e sua possível amplitude.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das orações e a imagem dos “olhos” foram mantidas; “mas” explicita o contraste natural entre preservar o conhecimento e derrubar a fala traiçoeira.
