  text: הֲ/לֹ֤א כָתַ֣בְתִּי לְ֭/ךָ שלשום בְּ/מ֖וֹעֵצֹ֣ת וָ/דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/020.yaml
  text: Have I not written for you thirty sayings of counsel and knowledge?[a][b]
translation:
  language: pt
  text: Não escrevi para você trinta ditos de conselho e conhecimento?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não escrevi para você anteriormente sobre conselho e conhecimento?» A palavra hebraica tradicionalmente traduzida por «anteriormente» é difícil neste trecho; muitos a entendem como «trinta», talvez em referência a uma coleção de trinta ditos.'
    reason: alternative_reading
  - marker: b
    text: Traduções tradicionais também trazem «coisas excelentes» em vez de «trinta ditos». Essa opção resulta de outra interpretação da difícil expressão hebraica.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não... ?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. A construção «Não escrevi...?» preserva essa força e soa natural em português.
- source_word: כָתַבְתִּי
  choice: escrevi
  rationale: Qal perfeito, primeira pessoa do singular, de כתב. O pretérito perfeito expressa naturalmente em português a ação concluída com relevância para o presente.
- source_word: לְךָ
  choice: para você
  rationale: A preposição ל pode indicar direção ou benefício. «Para você» se ajusta ao contexto de instrução e tem ampla clareza no português moderno.
- source_word: שלשום
  choice: trinta ditos
  rationale: A expressão hebraica é difícil. Muitos a relacionam a «trinta», possivelmente indicando uma coleção de ditos; «ditos» é explicitado pelo contexto literário. A leitura adverbial «anteriormente» é preservada em nota.
- source_word: בְּמוֹעֵצוֹת
  choice: de conselho
  rationale: Deriva de עֵצָה, «conselho, orientação, plano». A formulação atributiva «ditos de conselho» comunica o sentido de modo natural sem adotar a leitura tradicional «coisas excelentes».
- source_word: וָדָעַת
  choice: e conhecimento
  rationale: דעת significa normalmente «conhecimento» e forma aqui um par coordenado com «conselho», apropriado ao vocabulário sapiencial.
theological_decisions: []
