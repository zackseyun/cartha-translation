base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/007.yaml
  text: The rich rules over the poor[a], and the borrower is a slave to the lender.
translation:
  language: pt
  text: O rico domina sobre os pobres, e quem toma emprestado é escravo de quem empresta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׁיר
  choice: o rico
  rationale: Adjetivo substantivado que designa genericamente a pessoa rica; a forma singular preserva o paralelismo proverbial do hebraico e soa natural em português.
- source_word: בְּרָשִׁים
  choice: sobre os pobres
  rationale: Com מָשַׁל, a preposição בְּ marca o objeto ou âmbito do domínio; “domina sobre” expressa claramente a hierarquia social.
- source_word: יִמְשׁוֹל
  choice: domina
  rationale: O imperfeito, em contexto proverbial, enuncia uma realidade geral, por isso o presente é adequado. “Domina” preserva a força de exercer poder.
- source_word: וְעֶבֶד
  choice: é escravo
  rationale: A oração nominal requer a cópula em português. “Escravo” mantém a imagem forte de sujeição e dependência econômica, sem abrandá-la para “servo”.
- source_word: לֹוֶה
  choice: quem toma emprestado
  rationale: O particípio qal substantivado significa literalmente “aquele que toma emprestado”. A construção é corrente e evita o tom mais técnico de “devedor”.
- source_word: לְאִישׁ מַלְוֶה
  choice: de quem empresta
  rationale: A expressão significa literalmente “de/para um homem que empresta”. Em português, “quem empresta” é natural, conserva o vínculo verbal com “toma emprestado” e evita restringir o sentido a uma instituição financeira.
