  text: אֹהֵ֥ב טהור לֵ֑ב חֵ֥ן שְׂ֝פָתָ֗י/ו רֵעֵ֥/הוּ מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/011.yaml
  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
translation:
  language: pt
  text: Quem ama a pureza de coração e fala com graça[a] tem o rei por amigo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «há graça em seus lábios».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «um rei é seu amigo».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֵב
  choice: Quem ama
  rationale: O particípio qal funciona como substantivo e descreve genericamente uma pessoa; «quem ama» é natural e inclusivo em português proverbial.
- source_word: טְהָר־לֵב
  choice: a pureza de coração
  rationale: A construção expressa pureza interior ou moral; esta formulação preserva o sentido abstrato e soa digna em português.
- source_word: חֵן שְׂפָתָיו
  choice: tem palavras agradáveis
  rationale: Literalmente, «há graça em seus lábios»; «palavras agradáveis» comunica naturalmente a metonímia dos lábios pela fala sem restringir חֵן a um sentido teológico.
- source_word: רֵעֵהוּ
  choice: terá ... por amigo
  rationale: רֵעֵהוּ significa «seu amigo/companheiro». A construção portuguesa deixa clara a relação expressa pela oração nominal hebraica.
- source_word: מֶלֶךְ
  choice: o rei
  rationale: Embora o substantivo hebraico não tenha artigo, no provérbio pode representar genericamente o governante; «o rei» é a formulação idiomática mais natural.
theological_decisions:
- issue: Relação sintática entre «o rei» e «seu amigo»
  choice: o rei torna-se amigo da pessoa descrita
  alternative: um rei é seu amigo
  rationale: A oração nominal hebraica admite alguma flexibilidade de definitude. O texto principal comunica a leitura proverbial natural, enquanto a nota preserva a alternativa mais formal.
translation_notes:
  register: Português moderno, claro e proverbial, com boa legibilidade brasileira. «Palavras agradáveis» evita uma tradução artificial de «lábios» e preserva na nota a imagem literal. A ambiguidade quanto à definitude de מֶלֶךְ é mantida em nota.
