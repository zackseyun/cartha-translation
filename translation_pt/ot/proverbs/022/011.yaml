    issue: Futuro em «terá o rei por amigo»
    rationale: O hebraico termina em uma oração nominal («seu amigo [é] rei/o rei»), sem marca de futuro ou de resultado. O presente proverbial evita acrescentar uma promessa ou consequência temporal.
  - severity: low
    issue: «Palavras agradáveis» atenua o sentido de חֵן
    rationale: A expressão é possível, mas «agradáveis» pode restringir o termo a gentileza superficial. «Fala com graça» mantém melhor as possibilidades de graça, favor e encanto; a nota explicita a formulação literal com «lábios».
