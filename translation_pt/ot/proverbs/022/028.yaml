  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם אֲשֶׁ֖ר עָשׂ֣וּ אֲבוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/028.yaml
  text: Do not move an ancient boundary marker that your fathers made[a][b].
translation:
  language: pt
  text: Não desloque um antigo marco de divisa que seus pais estabeleceram[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não remova uma antiga divisa que seus pais fixaram.”'
    reason: lexical_alternative
  - marker: b
    text: “Seus pais” também pode referir-se, em sentido mais amplo, aos seus antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Com o imperfeito, אַל introduz uma proibição. “Não” expressa isso de modo direto e natural em português.
- source_word: תַּסֵּג
  choice: desloque
  rationale: Neste contexto de limites de propriedade, o verbo indica mover ou alterar indevidamente a posição da divisa. “Desloque” preserva essa ideia sem sugerir necessariamente a retirada completa.
- source_word: גְּבוּל
  choice: marco de divisa
  rationale: Embora o substantivo possa significar “limite” ou “divisa”, com o verbo “deslocar” refere-se concretamente ao marco que demarca a propriedade. A expressão torna explícito esse sentido contextual.
- source_word: עוֹלָם
  choice: antigo
  rationale: Aqui descreve algo estabelecido desde tempos remotos, não a eternidade em sentido absoluto. “Antigo” comunica esse valor temporal com naturalidade.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que descreve o marco de divisa.
- source_word: עָשׂוּ
  choice: estabeleceram
  rationale: O verbo comum עשה significa “fazer”, mas neste contexto os pais fixaram ou instituíram a divisa. “Estabeleceram” transmite com clareza a ação contextual sem alterar seu sentido.
- source_word: אֲבוֹתֶיךָ
  choice: seus pais
  rationale: Preserva a forma masculina plural do hebraico e pode, no contexto, designar os antepassados. A alternativa mais ampla é registrada em nota.
