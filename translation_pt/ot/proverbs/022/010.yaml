  text: גָּ֣רֵֽשׁ לֵ֭ץ וְ/יֵצֵ֣א מָד֑וֹן וְ֝/יִשְׁבֹּ֗ת דִּ֣ין וְ/קָלֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/010.yaml
  text: Drive out a scoffer[a], and strife will go out[b]; judgment and disgrace will cease.
translation:
  language: pt
  text: Expulse o zombador[a], e a discórdia irá embora; a disputa[b] e a desonra cessarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escarnecedor”. O termo hebraico לֵץ é frequente na literatura de sabedoria e descreve alguém que ridiculariza com arrogância a correção e a sabedoria.
    reason: lexical_alternative
  - marker: b
    text: O hebraico דִּין também pode significar “julgamento” ou “causa judicial”; neste contexto, provavelmente se refere a uma disputa ou contenda.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Expulse
  rationale: O imperativo de גרשׁ indica fazer alguém sair à força ou afastá-lo do meio. “Expulse” preserva a força da ordem e é claro em português atual.
- source_word: לֵץ
  choice: o zombador
  rationale: Em Provérbios, לֵץ designa quem ridiculariza com arrogância a sabedoria e rejeita a correção. “Zombador” comunica esse perfil em português corrente.
- source_word: מָדוֹן
  choice: a discórdia
  rationale: מדון denota conflito, contenda ou desavença. “Discórdia” exprime de modo natural o conflito comunitário causado pelo zombador.
- source_word: וְיֵצֵא
  choice: irá embora
  rationale: Embora seja literalmente “sairá”, o verbo descreve aqui o desaparecimento da discórdia como resultado esperado da ordem anterior. “Irá embora” mantém a imagem de saída e soa natural.
- source_word: וְיִשְׁבֹּת
  choice: cessarão
  rationale: A forma de שׁבת significa cessar ou chegar ao fim. O plural em português concorda naturalmente com os dois elementos coordenados, “a disputa e a desonra”.
- source_word: דִּין
  choice: a disputa
  rationale: דין pode significar julgamento, causa judicial ou disputa. No paralelismo com מדון, o sentido de conflito verbal ou contenda é provável, sem eliminar a ambiguidade lexical, registrada em nota.
- source_word: קָלוֹן
  choice: a desonra
  rationale: קלון denota vergonha, ignomínia ou desonra. “Desonra” conserva a dimensão social da reprovação associada ao conflito.
theological_decisions: []
