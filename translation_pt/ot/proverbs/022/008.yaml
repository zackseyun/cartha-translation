id: PRO.22.8
reference: Proverbs 22:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זוֹרֵ֣עַ עַ֭וְלָה יקצור אָ֑וֶן וְ/שֵׁ֖בֶט עֶבְרָת֣/וֹ יִכְלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/008.yaml
  text: Whoever sows injustice will reap trouble[b][a], and the rod of his fury will come to an end.
translation:
  language: pt
  text: Quem semeia injustiça colherá sofrimento[a], e a vara da sua fúria chegará ao fim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desgraça”, “calamidade” ou “aflição”. O hebraico אָוֶן pode indicar uma consequência nociva ou miséria.
    reason: lexical_alternative
  - marker: b
    text: Ou “a vara da sua ira se acabará”. A frase hebraica pode apontar para o fim do poder irado ou violento de quem pratica a injustiça.
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹרֵעַ
  choice: Quem semeia
  rationale: O particípio qal masculino singular tem sentido genérico neste provérbio. “Quem semeia” expressa com naturalidade uma conduta habitual e preserva a metáfora agrícola.
- source_word: עַוְלָה
  choice: injustiça
  rationale: O substantivo indica injustiça ou ação errada. “Injustiça” é claro, atual e mantém o peso moral do termo.
- source_word: יקצור
  choice: colherá
  rationale: O imperfeito apresenta a consequência proverbial do ato de semear; o futuro em português comunica claramente a relação entre ação e resultado.
- source_word: אָוֶן
  choice: sofrimento
  rationale: O termo pode designar desgraça, calamidade, aflição ou uma consequência nociva. No papel de colheita da injustiça, “sofrimento” preserva a amplitude sem limitar o resultado a um desastre externo específico.
- source_word: וְשֵׁבֶט
  choice: e a vara
  rationale: שֵׁבֶט pode significar vara, bastão ou cetro. “Vara” preserva a imagem de um instrumento de golpe ou poder punitivo.
- source_word: עֶבְרָתוֹ
  choice: da sua fúria
  rationale: עֶבְרָה significa normalmente ira ou fúria. “Fúria” é vívido e atual, sem substituir o sentido por uma interpretação como “arrogância”.
- source_word: יִכְלֶה
  choice: chegará ao fim
  rationale: O verbo כלה pode significar acabar, ser consumido ou chegar ao fim. Esta formulação reproduz diretamente a cessação anunciada e soa natural em português.
theological_decisions:
- issue: Sentido da frase final וְשֵׁבֶט עֶבְרָתוֹ יִכְלֶה
  choice: “a vara da sua fúria chegará ao fim”
  alternative: “a vara da sua ira se acabará”; a frase também pode ser entendida como referência ao colapso do poder violento do injusto
  rationale: O texto hebraico massorético fala mais naturalmente da “vara” associada à fúria do indivíduo. A tradução conserva a imagem e a relação genitiva sem decidir de modo excessivo se a vara representa especificamente violência, autoridade opressora ou poder punitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura proverbial e as metáforas de semear, colher e usar uma vara foram preservadas; termos excessivamente arcaicos ou confessionais foram evitados.
