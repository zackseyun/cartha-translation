  source_fidelity: 'A tradução acompanha fielmente o hebraico: o particípio genérico é bem expresso por “Quem semeia”; “injustiça” corresponde a עַוְלָה; “colherá sofrimento” preserva a relação proverbial de consequência para אָוֶן; e a cláusula final conserva a imagem deliberadamente concisa de “a vara da sua fúria”. “Chegará ao fim” representa adequadamente יִכְלֶה sem definir além do necessário o modo desse fim.'
