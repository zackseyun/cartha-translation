  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: צִנִּ֣ים פַּ֭חִים בְּ/דֶ֣רֶךְ עִקֵּ֑שׁ שׁוֹמֵ֥ר נַ֝פְשׁ֗/וֹ יִרְחַ֥ק מֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/005.yaml
  text: Thorns and snares are in the way of the crooked[c][b][a]; he who guards his life keeps far from them.
translation:
  language: pt
  text: Espinhos e armadilhas[a] estão no caminho do perverso[b]; aquele que guarda a própria vida[c] se mantém longe deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “laços”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “do tortuoso” ou “do desonesto”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “sua alma”; aqui, “vida” transmite a ideia de preservar a si mesmo do perigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנִּים
  choice: espinhos
  rationale: O substantivo designa perigos pontiagudos, provavelmente espinhos; a escolha mantém a imagem concreta e sua aplicação figurada ao percurso da vida.
- source_word: פַּחִים
  choice: armadilhas
  rationale: O termo pode indicar laços ou armadilhas. “Armadilhas” é claro em português moderno e preserva a ideia de perigos que capturam.
- source_word: בְּדֶרֶךְ
  choice: no caminho
  rationale: Mantém a metáfora hebraica do caminho como percurso ou conduta de vida, com expressão natural em português.
- source_word: עִקֵּשׁ
  choice: do perverso
  rationale: O adjetivo descreve alguém moralmente tortuoso ou desviado. “Perverso” comunica o sentido moral com clareza, enquanto a nota registra alternativas que preservam mais diretamente a metáfora.
- source_word: שׁוֹמֵר נַפְשׁוֹ
  choice: aquele que guarda a própria vida
  rationale: A construção participial formula um princípio geral. נֶפֶשׁ pode significar alma, vida ou a própria pessoa; neste contexto de preservação diante do perigo, “vida” exprime melhor o sentido.
- source_word: יִרְחַק מֵהֶם
  choice: se mantém longe deles
  rationale: O imperfeito expressa o resultado característico da prudência. O pronome plural retoma naturalmente os espinhos e as armadilhas.
theological_decisions:
- issue: Masculino genérico na literatura sapiencial
  choice: aquele que guarda a própria vida
  alternative: quem guarda a própria vida
  rationale: “Aquele” representa o particípio masculino singular do hebraico sem restringir o provérbio apenas aos homens; a máxima continua sendo geral e representativa.
- issue: Sentido de נֶפֶשׁ no contexto
  choice: vida
  alternative: alma
  rationale: Aqui o foco é proteger a si mesmo dos perigos associados ao caminho perverso. Traduzir por “vida” evita impor uma distinção metafísica que o contexto não exige, enquanto a nota conserva a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura paralela e a metáfora do caminho foram preservadas; “se mantém” apresenta a máxima como resultado habitual.
