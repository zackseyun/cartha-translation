base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/017.yaml
  text: Incline your ear and hear the words of the wise[a], and set your heart on my knowledge.
translation:
  language: pt
  text: Inclina o teu ouvido e ouve as palavras dos sábios, e aplica o teu coração ao meu conhecimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao meu ensino”. O hebraico diz literalmente “ao meu conhecimento”, expressão que pode referir-se ao conhecimento do mestre ou, por extensão, ao ensino que esse conhecimento transmite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַט אָזְנְךָ
  choice: Incline o ouvido
  rationale: Preserva a metáfora hebraica de voltar ou inclinar deliberadamente o ouvido, com uma formulação digna e compreensível em português.
- source_word: וּשְׁמַע
  choice: e escute
  rationale: Mantém o segundo imperativo distinto do gesto figurado de inclinar o ouvido; “escute” comunica atenção deliberada com mais naturalidade que “ouça” nesta sequência.
- source_word: דִּבְרֵי חֲכָמִים
  choice: as palavras dos sábios
  rationale: Reproduz o plural e conserva o sentido amplo de palavras ou ditos, sem acrescentar especificação masculina desnecessária.
- source_word: וְלִבְּךָ תָּשִׁית
  choice: e volte o coração
  rationale: Conserva “coração” como centro do pensamento e da vontade, enquanto “volte” expressa em português natural a orientação intencional indicada por תָּשִׁית.
- source_word: לְדַעְתִּי
  choice: para o meu conhecimento
  rationale: Preserva o substantivo e o sufixo de primeira pessoa do hebraico, sem decidir se a expressão denota o conhecimento do mestre ou, por extensão, o ensino que ele transmite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla legibilidade brasileira. A metáfora do ouvido e do coração foi preservada, assim como a ambiguidade de “meu conhecimento”.
