  text: עֵ֣קֶב עֲ֭נָוָה יִרְאַ֣ת יְהוָ֑ה עֹ֖שֶׁר וְ/כָב֣וֹד וְ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/004.yaml
  text: The reward of humility and the fear of Yahweh is wealth and honor and life[a].
translation:
  language: pt
  text: A recompensa da humildade e do temor de Yahweh é riqueza, honra e vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução, menos provável: “A recompensa da humildade é o temor de Yahweh, riqueza, honra e vida.”'
    reason: Leitura alternativa da relação sintática entre “humildade” e “temor de Yahweh”.
lexical_decisions:
- source_word: עֵקֶב
  choice: A recompensa da
  rationale: O termo pode indicar consequência, resultado ou recompensa. Aqui introduz naturalmente os benefícios decorrentes das virtudes mencionadas; “recompensa” preserva a força proverbial e retributiva.
- source_word: עֲנָוָה
  choice: humildade
  rationale: Equivalente moderno e claro para a atitude de humildade ou modéstia, sem a possível conotação de passividade de “mansidão”.
- source_word: יִרְאַת יְהוָה
  choice: temor de Yahweh
  rationale: Mantém a expressão característica da literatura de sabedoria e sua combinação de reverência, submissão e temor, sem reduzi-la à paráfrase “reverência”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עֹשֶׁר
  choice: riqueza
  rationale: Expressa de forma natural a abundância material indicada pelo substantivo.
- source_word: כָבוֹד
  choice: honra
  rationale: Neste contexto sapiencial humano, indica estima e reconhecimento social, não glória divina.
- source_word: חַיִּים
  choice: vida
  rationale: Embora formalmente plural em hebraico, funciona como substantivo abstrato. “Vida” é direto e não acrescenta a ideia não expressa de longevidade.
theological_decisions:
- issue: Relação sintática entre “humildade” e “temor de Yahweh”
  choice: As duas expressões são entendidas como virtudes coordenadas cuja recompensa é riqueza, honra e vida.
  alternative: “A recompensa da humildade é o temor de Yahweh, riqueza, honra e vida.”
  rationale: A construção hebraica é condensada e admite ambas as leituras. A coordenação das duas virtudes como causa da tríade final é mais natural no contexto proverbial, mas a leitura apositiva permanece genuinamente possível e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A formulação conserva o paralelismo conciso do provérbio e o nome divino Yahweh.
