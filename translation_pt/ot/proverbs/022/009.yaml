  source_fidelity: 'O sentido central está corretamente representado: o hebraico descreve a pessoa caracterizada pela generosidade, anuncia que ela será abençoada e fundamenta isso em sua partilha do próprio pão com o pobre. A passiva de “será abençoado” preserva apropriadamente o agente não expresso. “Dá do seu pão ao pobre” reproduz bem o valor habitual proverbial e a noção de dar de sua provisão.'
  naturalness: “Quem tem olhar generoso” é compreensível, mas em português moderno tende a sugerir uma expressão ou maneira benevolente de olhar, e não necessariamente liberalidade material. “Quem é generoso” comunica de modo direto e idiomático o sentido do idiomatismo hebraico; a metáfora literal pode permanecer na nota.
  terminology: “Abençoado”, “pão” e “pobre” são escolhas adequadas e de registro digno. A nota deve apresentar a forma literal sem fazer de “olhar generoso” uma metáfora portuguesa artificial.
