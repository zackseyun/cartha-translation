  text: טֽוֹב עַ֭יִן ה֣וּא יְבֹרָ֑ךְ כִּֽי נָתַ֖ן מִ/לַּחְמ֣/וֹ לַ/דָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/009.yaml
  text: He who has a generous eye will be blessed[a], for he gives some of his bread to the poor.
translation:
  language: pt
  text: Quem é generoso[a] será abençoado, pois dá do seu pão ao pobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “bom de olho”; expressão hebraica que indica generosidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב עַיִן
  choice: quem tem olhar generoso
  rationale: A expressão hebraica, literalmente ligada a um “olho bom”, é um idiomatismo para generosidade. “Olhar generoso” preserva a imagem do olho e comunica seu sentido com naturalidade em português.
- source_word: יְבֹרָךְ
  choice: será abençoado
  rationale: A forma verbal é passiva. O futuro expressa de modo natural a consequência esperada no estilo proverbial, sem identificar explicitamente quem concede a bênção.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão da afirmação anterior; “pois” mantém a relação explicativa e o tom conciso do provérbio.
- source_word: נָתַן
  choice: dá
  rationale: Embora a forma hebraica seja formalmente perfeita, no discurso proverbial descreve a conduta característica da pessoa generosa; o presente habitual é natural em português.
- source_word: מִלַּחְמוֹ
  choice: do seu pão
  rationale: 'A preposição tem força partitiva: a pessoa dá de sua própria provisão. “Pão” conserva a imagem concreta do hebraico sem exigir que se explicite “uma parte”.'
- source_word: לַדָּל
  choice: ao pobre
  rationale: O termo designa quem é pobre, necessitado ou socialmente vulnerável. “Ao pobre” é direto e adequado ao contexto de partilha material.
theological_decisions:
- issue: Agente da bênção na forma passiva יְבֹרָךְ
  choice: Manter o agente implícito em “será abençoado”
  alternative: Explicitar “Deus o abençoará”
  rationale: O texto hebraico não nomeia o agente. A tradução preserva essa indeterminação, ainda que o leitor possa entender uma passiva divina.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção inclusiva “quem tem” evita acrescentar gênero ao sujeito, e “olhar generoso” conserva a metáfora hebraica sem soar obscuro.
