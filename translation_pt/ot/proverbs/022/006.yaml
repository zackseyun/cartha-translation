id: PRO.22.6
reference: Proverbs 22:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חֲנֹ֣ךְ לַ֭/נַּעַר עַל פִּ֣י דַרְכּ֑/וֹ גַּ֥ם כִּֽי יַ֝זְקִ֗ין לֹֽא יָס֥וּר מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/006.yaml
  text: Train up a boy according to his way[b][a]; even when he grows old he will not turn from it.
translation:
  language: pt
  text: Eduque o menino segundo o seu caminho[a][b]; mesmo quando envelhecer, não se afastará dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “Eduque o menino no caminho em que deve andar”. O hebraico diz mais literalmente “segundo o seu caminho”.'
    reason: alternative_reading
  - marker: b
    text: “Menino” traduz um termo hebraico masculino singular empregado genericamente para alguém jovem. O provérbio expressa um princípio geral de sabedoria, não uma promessa sem exceções.
    reason: cultural_note
lexical_decisions:
- source_word: חֲנֹךְ
  choice: Eduque
  rationale: O imperativo de חנך pode significar iniciar, dedicar ou formar. Neste contexto sapiencial, “eduque” comunica de modo natural o processo formativo sem restringi-lo à instrução verbal.
- source_word: לַנַּעַר
  choice: o menino
  rationale: נַעַר é um substantivo masculino singular que pode designar menino, jovem ou pessoa ainda em formação. “O menino” preserva a forma masculina singular e funciona genericamente no provérbio.
- source_word: עַל פִּי
  choice: segundo
  rationale: A locução idiomática עַל־פִּי significa aqui “segundo” ou “de acordo com”; uma reprodução literal como “sobre a boca de” seria obscura em português.
- source_word: דַרְכּוֹ
  choice: o seu caminho
  rationale: A expressão hebraica diz literalmente “seu caminho”. A tradução mantém essa formulação aberta, sem acrescentar “em que deve andar” nem decidir se há referência ao caminho apropriado, à inclinação ou à fase do menino.
- source_word: גַּם כִּי
  choice: mesmo quando
  rationale: A expressão tem valor concessivo-temporal. “Mesmo quando” apresenta a velhice como etapa futura esperada, sem converter a frase numa hipótese improvável.
- source_word: יַזְקִין
  choice: envelhecer
  rationale: A forma verbal indica chegar à velhice. “Envelhecer” é corrente e preserva esse sentido processual.
- source_word: לֹא יָסוּר
  choice: não se afastará
  rationale: סור significa afastar-se, desviar-se ou abandonar. “Não se afastará” é idiomático e retoma naturalmente o caminho mencionado.
- source_word: מִמֶּנָּה
  choice: dele
  rationale: O sufixo feminino hebraico retoma דֶּרֶךְ. Como “caminho” é masculino em português, a concordância exige “dele”.
theological_decisions:
- issue: Sentido da expressão “seu caminho”
  choice: Manter no texto principal a formulação literal e ambígua “segundo o seu caminho”.
  alternative: “no caminho em que deve andar” ou “de acordo com sua inclinação”.
  rationale: O hebraico não explicita se o caminho é moralmente correto, adequado à condição do jovem ou correspondente à sua inclinação. A tradução não resolve silenciosamente essa tensão interpretativa.
- issue: Força da afirmação proverbial
  choice: Apresentar a máxima na forma categórica do hebraico, esclarecendo em nota seu gênero sapiencial.
  alternative: Acrescentar qualificadores como “em geral” ou “normalmente” ao texto principal.
  rationale: O verso formula uma observação geral com a concisão típica dos provérbios. Inserir uma ressalva no corpo do texto alteraria sua forma retórica, mas a nota evita tratá-lo como promessa sem exceções.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Eduque” é mais natural que “treine” neste contexto humano; “segundo” conserva a concisão proverbial. Os marcadores aparecem junto à expressão que requer esclarecimento.
