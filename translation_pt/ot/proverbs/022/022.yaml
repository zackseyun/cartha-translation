  text: אַֽל תִּגְזָל דָּ֭ל כִּ֣י דַל ה֑וּא וְ/אַל תְּדַכֵּ֖א עָנִ֣י בַ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/022.yaml
  text: Do not rob the poor because he is poor[b][a], and do not crush the afflicted at the gate.
translation:
  language: pt
  text: Não roube o pobre porque ele é pobre[b], nem esmague o aflito à porta da cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A porta da cidade era o lugar onde causas legais e decisões públicas costumavam ser tratadas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Não oprima o pobre [...] nem esmague o necessitado no tribunal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְזָל
  choice: roube
  rationale: O verbo גזל indica tomar injustamente, muitas vezes pela força ou por abuso de poder. “Roubar” é natural em português e preserva a acusação direta.
- source_word: דָּל
  choice: o pobre
  rationale: דָּל pode designar alguém pobre, fraco ou socialmente desfavorecido. “O pobre” comunica com clareza a condição socioeconômica e permite manter a repetição na oração seguinte.
- source_word: כִּי דַל הוּא
  choice: porque ele é pobre
  rationale: כִּי tem sentido causal neste contexto. A formulação conserva a repetição retórica de דָּל e mostra que a vulnerabilidade da pessoa é explorada como ocasião do roubo.
- source_word: תְּדַכֵּא
  choice: esmague
  rationale: O piel de דכא expressa esmagar ou oprimir. “Esmague” mantém a metáfora forte e a gravidade moral do hebraico.
- source_word: עָנִי
  choice: o aflito
  rationale: עָנִי pode significar pobre, necessitado, aflito ou oprimido. “O aflito” preserva alguma distinção em relação a דָּל sem eliminar a sobreposição semântica entre os termos.
- source_word: בַשָּׁעַר
  choice: à porta da cidade
  rationale: A expressão significa literalmente “à porta”, referindo-se à porta da cidade, espaço público onde causas e julgamentos eram tratados. A explicitação de “da cidade” torna a referência cultural inteligível sem substituir a imagem pela interpretação “no tribunal”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o paralelismo, a repetição de “pobre” e a imagem intensa de “esmagar”, enquanto a nota registra a possível explicitação judicial.
