id: PRO.22.23
reference: Proverbs 22:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יָרִ֣יב רִיבָ֑/ם וְ/קָבַ֖ע אֶת קֹבְעֵי/הֶ֣ם נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/023.yaml
  text: For Yahweh will plead their case and rob of life those who rob them[a].
translation:
  language: pt
  text: Pois Yahweh defenderá a causa deles e tirará a vida dos que os roubam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois Yahweh contenderá pela causa deles e despojará da vida os que os despojam.”'
    reason: Preserva mais de perto a repetição lexical e a linguagem de disputa judicial do hebraico.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência precedente e preserva de modo natural a força causal do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: יָרִיב רִיבָם
  choice: defenderá a causa deles
  rationale: A construção cognata pertence ao campo jurídico. Esta formulação comunica que Yahweh toma para si a causa dos vulneráveis, embora não reproduza a repetição do hebraico.
- source_word: וְקָבַע
  choice: e tirará a vida
  rationale: Com נָפֶשׁ, o verbo קבע indica privação retributiva da própria vida; a formulação é clara e digna em português.
- source_word: קֹבְעֵיהֶם
  choice: dos que os roubam
  rationale: O particípio designa aqueles que espoliam ou roubam as vítimas mencionadas; 'roubam' é corrente e mantém a ligação lexical parcial com a ideia de privação.
- source_word: נָפֶשׁ
  choice: a vida
  rationale: Neste contexto, נָפֶשׁ refere-se à vida da pessoa, não especificamente a uma alma imaterial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
- issue: Natureza da ação divina em יָרִיב רִיבָם
  choice: defenderá a causa deles
  alternative: contenderá pela causa deles
  rationale: Mantém a imagem forense de Yahweh como aquele que assume a causa dos explorados, sem definir em excesso o procedimento.
- issue: Sentido de נָפֶשׁ na retribuição
  choice: vida
  alternative: alma
  rationale: O contexto aponta para a perda da vida, evitando importar uma distinção antropológica que o verso não exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução principal privilegia naturalidade sem apagar a imagem jurídica; a nota registra uma alternativa mais formal e a reciprocidade verbal do original.
