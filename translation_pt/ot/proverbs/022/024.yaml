base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/024.yaml
  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
translation:
  language: pt
  text: 'Não faça amizade com um homem dado à ira[a],

    nem ande com um homem irascível.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se associe com um homem irado”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não venhas com”; no contexto, a ideia é juntar-se a ele ou manter sua companhia.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
  choice: faça amizade
  rationale: O hitpael de רעה indica associar-se intimamente ou tornar-se companheiro de alguém. “Fazer amizade” comunica com naturalidade a força relacional do verbo.
- source_word: בַּעַל אָף
  choice: alguém dado à ira
  rationale: A construção בַּעַל mais substantivo descreve alguém caracterizado por uma qualidade. אָף pode significar literalmente “nariz”, mas aqui designa a ira; “dado à ira” preserva o sentido idiomático.
- source_word: אִישׁ חֵמוֹת
  choice: um homem cheio de fúria
  rationale: A expressão caracteriza um homem marcado por acessos de fúria. “Cheio de fúria” mantém a intensidade e soa natural em português.
- source_word: תָבֽוֹא
  choice: ande com
  rationale: Embora בוא signifique literalmente “vir” ou “entrar”, neste paralelismo o sentido é juntar-se a alguém ou manter sua companhia. “Andar com” expressa isso de modo corrente.
- source_word: אַל ... לֹא
  choice: Não ... nem
  rationale: Os dois elementos formam proibições paralelas. “Não... nem” conserva a estrutura e a força da advertência sem repetição desnecessária.
- source_word: אִישׁ
  choice: homem
  rationale: O substantivo hebraico é masculino singular e apresenta uma figura proverbial representativa; “homem” mantém essa forma no segundo membro.
