base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/001.yaml
  text: A name is to be chosen rather than great wealth[c][b][a], and favor is better than silver and gold.
translation:
  language: pt
  text: Um nome é preferível a grandes riquezas[a][b], e o favor[c] é melhor do que prata e ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um nome deve ser escolhido em vez de grandes riquezas” ou “Um nome é mais desejável do que grandes riquezas”.'
    reason: lexical_alternative
  - marker: b
    text: “Nome” tem aqui o sentido de reputação ou honra.
    reason: cultural_note
  - marker: c
    text: 'Ou: “graça”. O termo hebraico pode indicar favor, graça, encanto ou consideração favorável, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְחָר
  choice: mais vale escolher
  rationale: O particípio nifal funciona predicativamente e exprime preferência ou superioridade de valor. A formulação proverbial portuguesa comunica isso com naturalidade.
- source_word: שֵׁם
  choice: um bom nome
  rationale: Embora o hebraico diga literalmente apenas “nome”, no contexto sapiencial a expressão se refere à reputação ou honra pública. Em português, “bom nome” preserva a imagem e torna esse sentido idiomático.
- source_word: מֵעֹשֶׁר רָב
  choice: do que muitas riquezas
  rationale: O מִן comparativo indica preferência, e עֹשֶׁר רָב denota riqueza grande ou abundante. “Muitas riquezas” é claro e mantém o paralelismo proverbial.
- source_word: חֵן
  choice: boa consideração
  rationale: Aqui o termo provavelmente indica o favor ou a estima recebida das pessoas, em paralelo com o nome respeitado. “Boa consideração” explicita a dimensão social sem introduzir uma conotação teológica indevida.
- source_word: טוֹב
  choice: é melhor
  rationale: Embora טוֹב signifique literalmente “bom”, a construção elíptica com מִן exige valor comparativo em português.
- source_word: מִכֶּסֶף וּמִזָּהָב
  choice: do que prata e ouro
  rationale: Tradução direta da segunda comparação, conservando as imagens tradicionais dos metais preciosos.
