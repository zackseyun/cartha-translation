translation_notes:
  register: Português moderno, digno e proverbial, com ampla legibilidade brasileira. A tradução emprega “bom nome” como expressão portuguesa estabelecida para reputação, enquanto a nota registra que o hebraico traz literalmente “nome”. Mantém-se o paralelismo entre reputação/consideração e riqueza/metais preciosos.
