  source_fidelity: A expressão «um bom nome» acrescenta «bom», que não está explicitamente no hebraico (שֵׁם, «nome»), embora a ideia de reputação seja contextual. «Muitas riquezas» é aceitável, mas «grandes riquezas» corresponde mais diretamente a עֹשֶׁר רָב. «Ter boa consideração» interpreta e reformula excessivamente חֵן; «favor» preserva melhor o termo e o paralelismo conciso do provérbio.
  naturalness: «Um nome é preferível a grandes riquezas, e o favor é melhor do que prata e ouro» é português moderno, claro e proverbial. A nota explica o sentido social de «nome» sem o introduzir indevidamente no texto.
  terminology: «Nome» mantém a imagem hebraica; «favor» é a opção mais neutra para חֵן neste contexto e evita tanto uma leitura teológica automática de «graça» quanto a paráfrase pouco idiomática «boa consideração».
