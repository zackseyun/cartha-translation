    issue: “fiz você saber” é pouco idiomático
    rationale: Embora reproduza mecanicamente uma leitura causativa, a expressão não é natural em português moderno. “Dei a conhecer a você” é uma construção estabelecida, preserva a causatividade e permite que o objeto permaneça implícito, como no hebraico.
  - severity: low
    issue: “sim, você mesmo” introduz uma marca de gênero desnecessária
    rationale: O hebraico dirige-se gramaticalmente a um singular masculino, mas “você mesmo” torna essa marca mais saliente em português do que é necessário para a ênfase. “Sim, a você” mantém a repetição enfática e é mais amplamente aplicável.
