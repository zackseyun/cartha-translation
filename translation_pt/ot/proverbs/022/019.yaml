  text: לִ/הְי֣וֹת בַּ֭/יהוָה מִבְטַחֶ֑/ךָ הוֹדַעְתִּ֖י/ךָ הַ/יּ֣וֹם אַף אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/019.yaml
  text: So that your trust may be in Yahweh[a], I have made known to you today, even to you.
translation:
  language: pt
  text: Para que você confie em Yahweh, hoje dei a conhecer a você — sim, a você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “dei a conhecer a você hoje, sim, você”. Aquilo que foi dado a conhecer não é declarado explicitamente; o contexto aponta para estes ensinamentos ou ditos.'
    reason: O objeto de “dei a conhecer” está implícito no hebraico. A nota informa esse fato e indica o referente contextual sem acrescentá-lo ao texto principal.
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Para que ... esteja
  rationale: O infinitivo construto com לְ expressa aqui finalidade; a construção portuguesa comunica esse propósito de modo natural.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição בְּ indica em quem se deposita a confiança, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: מִבְטַחֶךָ
  choice: a sua confiança
  rationale: מִבְטָח designa confiança ou segurança depositada em alguém; “a sua confiança” preserva o sentido e o sufixo de segunda pessoa singular.
- source_word: הוֹדַעְתִּיךָ
  choice: fiz você saber
  rationale: O hifil de ידע tem sentido causativo, “fazer saber”. Esta formulação preserva a construção hebraica sem inserir no texto principal um objeto que não está expresso.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto e corrente em português.
- source_word: אַף אָתָּה
  choice: sim, você mesmo
  rationale: אַף com o pronome independente enfatiza o destinatário; “sim, você mesmo” reproduz essa ênfase sem eliminar a possível força intensiva da expressão.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Objeto não expresso de הוֹדַעְתִּיךָ
  choice: Não acrescentar um objeto no texto principal
  alternative: “dei estas palavras a conhecer a você” ou “fiz você conhecê-las”
  rationale: O hebraico diz literalmente que o mestre fez o destinatário saber, sem declarar explicitamente o conteúdo. O contexto sugere os ensinamentos ou ditos, mas a tradução mantém a abertura do original e a explica em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Fiz você saber” é deliberadamente mais próximo da forma causativa hebraica; o travessão destaca a ênfase final no destinatário.
