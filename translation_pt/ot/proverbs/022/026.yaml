  text: אַל תְּהִ֥י בְ/תֹֽקְעֵי כָ֑ף בַּ֝/עֹרְבִ֗ים מַשָּׁאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/026.yaml
  text: Do not be among those who strike hands[a], among those who become surety for debts.
translation:
  language: pt
  text: Não esteja entre os que apertam as mãos como garantia[a], entre os que se tornam fiadores de dívidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não seja um dos que batem as mãos em penhor, dos que se tornam fiadores de empréstimos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Não esteja
  rationale: A partícula negativa אַל com o imperfeito de היה expressa uma proibição; “Não esteja” reproduz de modo natural e conciso a advertência.
- source_word: בְ/תֹקְעֵי כָף
  choice: entre os que apertam as mãos em compromisso
  rationale: A preposição בְּ indica associação, e a expressão idiomática תקע כף descreve o gesto de bater ou apertar as mãos para firmar um compromisso. A explicitação “em compromisso” evita que o leitor entenda apenas uma saudação.
- source_word: בַּ/עֹרְבִים
  choice: entre os que se tornam fiadores
  rationale: O particípio de ערב, neste contexto, refere-se a assumir responsabilidade ou dar garantia pela obrigação de outra pessoa.
- source_word: מַשָּׁאוֹת
  choice: dívidas
  rationale: O termo designa obrigações financeiras ou valores emprestados; “dívidas” é claro, atual e adequado ao contexto de fiança.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão gestual hebraica foi preservada com uma breve explicitação no texto, enquanto a nota registra uma alternativa mais literal.
