  yaml_path: translation/ot/proverbs/022/013.yaml
  text: The sluggard says[b][a], “There is a lion outside! I will be killed in the streets!”
translation:
  language: pt
  text: 'O preguiçoso diz: “Há um leão lá fora! Serei morto no meio das ruas[a]!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no meio das praças” ou “nos espaços públicos”; o termo hebraico pode designar ruas largas, praças e outros espaços públicos abertos.
    reason: lexical_alternative
  - marker: b
    text: Ou “serei assassinado” ou “serei morto violentamente”; o verbo hebraico pode indicar uma morte violenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: o preguiçoso
  rationale: Designa quem se caracteriza habitualmente pela preguiça. Com o artigo, a expressão funciona naturalmente em português como tipo representativo nos provérbios.
- source_word: אֲרִי
  choice: leão
  rationale: É o sentido lexical direto; o contexto apresenta o animal como pretexto exagerado do preguiçoso.
- source_word: בַחוּץ
  choice: lá fora
  rationale: Refere-se ao espaço exterior à casa. “Lá fora” é corrente e preserva o contraste com os espaços públicos da frase seguinte.
- source_word: בְּתוֹךְ רְחֹבוֹת
  choice: no meio das ruas
  rationale: בְּתוֹךְ expressa estar no interior ou no meio de algo, e רְחֹבוֹת pode indicar ruas largas, praças ou espaços públicos abertos. A formulação conserva a imagem vívida e a amplitude lexical é registrada em nota.
- source_word: אֵרָצֵחַ
  choice: serei morto
  rationale: A forma nifal de רצח tem sentido passivo e pode sugerir morte violenta. “Serei morto” soa natural em português sem impor uma classificação jurídica mais específica.
- source_word: אָמַר עָצֵל
  choice: O preguiçoso diz
  rationale: Embora o substantivo não tenha artigo no hebraico, o estilo proverbial apresenta um representante genérico de uma classe; o artigo definido é a forma idiomática em português.
