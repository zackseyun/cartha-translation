id: PRO.22.3
reference: Proverbs 22:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָר֤וּם רָאָ֣ה רָעָ֣ה ו/יסתר וּ֝/פְתָיִ֗ים עָבְר֥וּ וְֽ/נֶעֱנָֽשׁוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/003.yaml
  text: A prudent man sees danger and hides himself[b][a], but the simple pass on and suffer for it.
translation:
  language: pt
  text: O prudente vê o perigo[a] e se esconde, mas os ingênuos seguem adiante e sofrem as consequências[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mal”, “o dano” ou “a calamidade”. O termo hebraico pode designar tanto o mal moral quanto uma situação nociva; aqui indica uma ameaça que o prudente percebe.
    reason: lexical_alternative
  - marker: b
    text: Ou “são punidos”. O hebraico pode enfatizar uma penalidade, mas também pode indicar que eles sofrem o resultado de sua conduta.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: o prudente
  rationale: 'Em Provérbios, o adjetivo costuma ter sentido positivo: alguém perspicaz e cauteloso. A forma substantivada masculina singular é preservada naturalmente em português.'
- source_word: רָאָה
  choice: vê
  rationale: Embora a forma hebraica seja qatal, no enunciado proverbial ela expressa uma verdade geral; o presente é natural em português e mantém a imagem concreta de perceber o que está adiante.
- source_word: רָעָה
  choice: perigo
  rationale: O substantivo pode indicar mal moral, dano ou calamidade. Neste contexto, designa uma circunstância ameaçadora percebida e evitada pelo prudente.
- source_word: ו/יסתר
  choice: se esconde
  rationale: A forma verbal indica que a pessoa se retira ou se abriga para se proteger. A expressão preserva de modo claro e natural a imagem hebraica.
- source_word: פְתָיִם
  choice: os ingênuos
  rationale: Termo característico da literatura sapiencial para pessoas inexperientes, crédulas ou sem discernimento. 'Ingênuos' é corrente e evita o possível sentido intelectual pejorativo de 'simples' no português moderno.
- source_word: עָבְרוּ
  choice: seguem adiante
  rationale: Expressa a continuação do caminho sem que se tome uma medida de proteção diante do perigo.
- source_word: וְנֶעֱנָשׁוּ
  choice: sofrem as consequências
  rationale: A forma pode indicar sofrer penalidade ou ser punido. A tradução mantém aberta a possibilidade de consequência natural ou de punição, adequada à concisão sapiencial.
theological_decisions:
- issue: Natureza do resultado sofrido pelos ingênuos
  choice: sofrem as consequências
  alternative: são punidos
  rationale: O hebraico admite uma nuance penal, mas o provérbio não explicita se se trata de punição judicial/divina ou do resultado natural da imprudência; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O paralelismo conciso do provérbio foi preservado; 'ingênuos' comunica o termo sapiencial sem sugerir deficiência intelectual.
