  text: שׁוּחָ֣ה עֲ֭מֻקָּה פִּ֣י זָר֑וֹת זְע֥וּם יְ֝הוָ֗ה יפול שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/014.yaml
  text: The mouth of forbidden women is a deep pit[a]; he who is under Yahweh’s wrath will fall there.
translation:
  language: pt
  text: A boca das mulheres proibidas é uma cova profunda[a]; quem está sob a ira de Yahweh cairá nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulheres estranhas”, “mulheres estrangeiras” ou “mulheres adúlteras”. Em Provérbios, o termo hebraico costuma se referir a mulheres que estão fora dos limites legítimos das relações sexuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּחָה
  choice: cova
  rationale: O substantivo designa uma cavidade ou fosso profundo. “Cova” preserva de modo natural a imagem concreta de perigo e aprisionamento.
- source_word: עֲמֻקָּה
  choice: profunda
  rationale: O adjetivo modifica diretamente “cova” e mantém sem ampliação interpretativa a imagem hebraica.
- source_word: פִּי
  choice: boca
  rationale: Tradução literal que preserva a metáfora; no contexto, pode sugerir fala sedutora sem tornar essa implicação explícita no texto.
- source_word: זָרוֹת
  choice: mulheres proibidas
  rationale: Em Provérbios, o termo costuma indicar mulheres fora dos limites sexuais legítimos, e não necessariamente mulheres estrangeiras em sentido étnico. “Proibidas” mantém a categoria ampla sem restringi-la apenas ao adultério.
- source_word: זְעוּם
  choice: está sob a ira
  rationale: O particípio passivo descreve alguém que é objeto da indignação divina. A formulação é idiomática em português e preserva esse estado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יפול
  choice: cairá
  rationale: O imperfeito expressa naturalmente o resultado geral anunciado pelo provérbio.
- source_word: שָׁם
  choice: nela
  rationale: Embora o hebraico diga literalmente “ali”, o referente é a cova. “Nela” torna a relação clara e idiomática em português sem alterar a imagem.
theological_decisions:
- issue: Sentido de זָרוֹת no contexto sapiencial de Provérbios
  choice: mulheres proibidas
  alternative: mulheres estranhas, estrangeiras ou adúlteras
  rationale: O termo pode carregar essas nuances, mas em Provérbios frequentemente funciona como categoria para relações sexualmente ilícitas. A escolha evita tanto uma leitura meramente étnica quanto uma restrição exclusiva ao adultério.
- issue: Força de זְעוּם יְהוָה
  choice: quem está sob a ira de Yahweh
  alternative: quem é amaldiçoado ou detestado por Yahweh
  rationale: A tradução conserva a ideia de a pessoa ser objeto da indignação divina sem intensificar o termo para “amaldiçoado” nem estreitá-lo para “detestado”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe concisa preserva o paralelismo proverbial e a metáfora concreta do hebraico.
