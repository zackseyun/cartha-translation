id: PRO.22.2
reference: Proverbs 22:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָשִׁ֣יר וָ/רָ֣שׁ נִפְגָּ֑שׁוּ עֹשֵׂ֖ה כֻלָּ֣/ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/002.yaml
  text: The rich and the poor meet together[a]; Yahweh is the maker of them all.
translation:
  language: pt
  text: O rico e o pobre se encontram[a]; Yahweh é quem fez todos eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira mais interpretativa: “O rico e o pobre têm isto em comum: Yahweh fez ambos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: o rico
  rationale: Adjetivo substantivado que designa genericamente a pessoa rica ou a classe dos ricos. A forma singular mantém a concisão e o caráter representativo do provérbio hebraico.
- source_word: וָרָשׁ
  choice: e o pobre
  rationale: Forma o contraste social com עָשִׁיר. O singular genérico é natural em português e preserva o paralelismo compacto do original.
- source_word: נִפְגָּשׁוּ
  choice: se encontram
  rationale: O nifal de פגשׁ expressa encontro recíproco. “Se encontram” preserva o sentido lexical direto sem determinar onde ou de que modo ocorre esse encontro.
- source_word: עֹשֵׂה
  choice: é quem fez
  rationale: O particípio qal substantivado identifica Yahweh como aquele que os fez. A construção portuguesa é natural e conserva o foco no autor comum de ambos.
- source_word: כֻלָּם
  choice: todos eles
  rationale: Retoma conjuntamente o rico e o pobre e explicita o alcance inclusivo do pronome hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Força interpretativa do primeiro membro do provérbio
  choice: O texto mantém a imagem concreta de o rico e o pobre se encontrarem, sob a realidade comum de terem sido feitos por Yahweh.
  alternative: '“O rico e o pobre têm isto em comum: Yahweh fez ambos.”'
  rationale: O verbo hebraico significa mais diretamente “encontrar-se”, embora o contexto proverbial possa sugerir uma condição compartilhada. A tradução principal preserva essa tensão, e a nota registra a leitura mais interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com singular genérico para reproduzir a concisão da literatura sapiencial. “É quem fez” soa mais natural do que “é o fabricante/criador de” neste contexto e evita introduzir vocabulário técnico ausente do verbo עשה.
