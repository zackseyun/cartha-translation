  text: If you have nothing with which to pay[a], why should he take your bed from under you?
translation:
  language: pt
  text: Se você não tem com que pagar, por que ele tiraria sua cama de debaixo de você?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אֵין לְךָ
  choice: Se você não tem
  rationale: A construção hebraica expressa uma condição e, com לְךָ, indica posse; esta formulação é natural em português e preserva o sentido.
- source_word: לְשַׁלֵּם
  choice: com que pagar
  rationale: O infinitivo se refere ao pagamento de uma dívida. A expressão comunica de modo idiomático a falta de recursos para pagar.
- source_word: לָמָּה יִקַּח
  choice: por que ele levaria
  rationale: Preserva a pergunta retórica e o sujeito masculino singular, provavelmente o credor mencionado no contexto, sem explicitá-lo além do texto.
- source_word: מִשְׁכָּבְךָ
  choice: a cama
  rationale: O substantivo designa concretamente o lugar onde se deita, e não uma garantia genérica. “Cama” é a opção moderna mais clara neste contexto.
- source_word: מִתַּחְתֶּיךָ
  choice: de debaixo de você
  rationale: Mantém a imagem concreta e incisiva de retirarem a própria cama enquanto a pessoa está sobre ela.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a imagem concreta e a força admonitória da pergunta retórica.
