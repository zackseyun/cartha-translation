  register: Português atual, claro e digno, com formas verbais de segunda pessoa do singular sem o pronome explícito. A tradução privilegia uma expressão idiomática no segundo hemistíquio, enquanto a nota preserva a formulação mais literal e a amplitude semântica de נֶפֶשׁ.
