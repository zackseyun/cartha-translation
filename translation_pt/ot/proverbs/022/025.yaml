  text: lest you learn his ways and take a snare for yourself[a][b].
translation:
  language: pt
  text: para que não aprendas os seus caminhos[a] e tomes um laço para ti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu caminho” ou “a sua maneira de viver”. O singular hebraico pode se referir à conduta habitual de uma pessoa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e tomes um laço para a tua vida”, ou “para a tua alma”. Aqui, néfesh provavelmente designa a própria pessoa, sem fazer uma afirmação técnica sobre a alma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: para que não
  rationale: Introduz aqui uma consequência a ser evitada, em continuidade com a advertência do versículo anterior. A expressão é natural em português e conserva a força cautelar.
- source_word: תֶּאֱלַף
  choice: aprendas
  rationale: O Qal de אלף pode significar aprender ou habituar-se. “Aprendas” mantém a imagem de adquirir, pelo convívio, o comportamento de outra pessoa.
- source_word: אָרְחֹתוֹ
  choice: os seus modos
  rationale: Embora o hebraico esteja no singular, “seu caminho”, o termo designa a conduta habitual. “Os seus modos” comunica isso com naturalidade em português.
- source_word: וְלָקַחְתָּ
  choice: e acabes por cair
  rationale: Literalmente, o verbo significa “tomar”. Com מוֹקֵשׁ e לְנַפְשֶׁךָ, descreve a pessoa trazendo sobre si uma armadilha; “acabes por cair” expressa idiomaticamente o resultado sem desfazer a metáfora.
- source_word: מוֹקֵשׁ
  choice: numa armadilha
  rationale: מוֹקֵשׁ é uma armadilha ou laço e, neste contexto, representa o perigo em que a própria conduta pode enredar a pessoa.
- source_word: לְנַפְשֶׁךָ
  choice: por cair numa armadilha
  rationale: A construção significa literalmente “para tua nephesh”. Aqui נֶפֶשׁ provavelmente se refere à própria pessoa; a formulação portuguesa incorpora esse sentido reflexivo na imagem de cair na armadilha.
theological_decisions: []
