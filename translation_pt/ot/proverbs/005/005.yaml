  text: רַ֭גְלֶי/הָ יֹרְד֣וֹת מָ֑וֶת שְׁ֝א֗וֹל צְעָדֶ֥י/הָ יִתְמֹֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/005.yaml
  text: Her feet go down to death[a]; her steps hold fast to Sheol.
translation:
  language: pt
  text: Os pés dela descem à morte; seus passos se agarram ao Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “à sepultura” ou “ao mundo dos mortos”. Hebraico: “Sheol”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֶיהָ
  choice: os pés dela
  rationale: O plural com sufixo feminino singular preserva a imagem corporal concreta e soa natural em português.
- source_word: יֹרְדוֹת
  choice: descem
  rationale: O particípio qal feminino plural indica um movimento característico ou contínuo para baixo; “descem” é claro, corrente e mantém o paralelismo poético.
- source_word: מָוֶת
  choice: a morte
  rationale: Mantém o sentido lexical direto e a gravidade da advertência, sem reduzi-lo a mero perigo ou ruína.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração conserva o conceito hebraico específico e evita identificá-lo de modo indevido apenas com a sepultura ou com concepções posteriores do inferno.
- source_word: צְעָדֶיהָ
  choice: seus passos
  rationale: Preserva o plural concreto e o paralelismo com “os pés dela” de maneira concisa e natural.
- source_word: יִתְמֹכוּ
  choice: se agarram a
  rationale: O verbo תמך envolve segurar, sustentar ou agarrar. Neste contexto poético, comunica que o caminho dela se prende firmemente ao Sheol, sem recorrer ao pouco natural “sustentam o Sheol”.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: Preserva a tensão conceitual própria da literatura sapiencial hebraica, sem restringir o termo à sepultura nem importar uma noção posterior e plenamente desenvolvida de inferno. A nota oferece equivalentes explicativos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem dos dois membros e as imagens concretas do paralelismo hebraico foram preservadas.
source_grounding:
  english_pob_role: consult_only
