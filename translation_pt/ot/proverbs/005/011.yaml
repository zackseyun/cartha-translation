  text: and you groan at your end[b][a], when your flesh and your body are consumed.
translation:
  language: pt
  text: e você gemerá[a] no seu fim[b], quando sua carne e seu corpo se consumirem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «você soltará gemidos»; o verbo hebraico indica um clamor audível de aflição.
    reason: lexical_alternative
  - marker: b
    text: Ou «no fim da sua vida» ou «diante do seu desfecho»; o hebraico pode se referir tanto ao fim da vida quanto ao resultado final de uma conduta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  choice: e você gemerá
  rationale: O verbo נהם descreve um som audível e profundo de aflição. «Gemerá» comunica de modo natural a dor e o arrependimento angustiado do contexto.
- source_word: בְאַחֲרִיתֶךָ
  choice: no fim da sua vida
  rationale: אַחֲרִית pode indicar o fim temporal ou o desfecho final. No contexto da deterioração física, «no fim da sua vida» é claro, embora a nota preserve o sentido possível de resultado final.
- source_word: בִּכְלוֹת
  choice: quando ... se consumirem
  rationale: O infinitivo de כלה expressa a circunstância temporal e o esgotamento gradual ou completo; a construção reflexiva é natural em português para a deterioração corporal.
- source_word: בְּשָׂרְךָ
  choice: sua carne
  rationale: Mantém a imagem concreta de בשר e preserva a distinção em relação ao termo paralelo seguinte.
- source_word: וּשְׁאֵרֶךָ
  choice: seu corpo
  rationale: Neste paralelismo com «carne», שאר designa o corpo ou a constituição física; «corpo» é a opção mais clara e corrente em português.
theological_decisions: []
