id: PRO.5.12
reference: Proverbs 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ/אָמַרְתָּ֗ אֵ֭יךְ שָׂנֵ֣אתִי מוּסָ֑ר וְ֝/תוֹכַ֗חַת נָאַ֥ץ לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/012.yaml
  text: and you say[a], “How I hated discipline[b], and my heart despised reproof!”
translation:
  language: pt
  text: 'e você dirá[a]: “Como odiei a disciplina, e meu coração desprezou a repreensão!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e você diz”. O perfeito hebraico pode apresentar vividamente a fala futura ou consequente dentro da advertência do pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: e você dirá
  rationale: O perfeito qal na segunda pessoa masculina singular, ligado por וְ, tem aqui sentido futuro ou consequencial dentro da advertência paterna. O futuro em português exprime naturalmente o lamento que ocorrerá como resultado.
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação de pesar, não uma pergunta informativa; “Como” preserva de modo conciso a força emocional.
- source_word: שָׂנֵאתִי
  choice: odiei
  rationale: O perfeito qal na primeira pessoa singular apresenta uma confissão retrospectiva; o pretérito perfeito é natural em português.
- source_word: מוּסָר
  choice: disciplina
  rationale: Em Provérbios, o termo abrange formação, instrução e correção. “Disciplina” conserva essa amplitude pedagógica e corretiva em linguagem corrente.
- source_word: וְתוֹכַחַת
  choice: e ... repreensão
  rationale: O substantivo designa censura ou correção verbal. “Repreensão” é claro, digno e mantém a distinção em relação a “disciplina”.
- source_word: נָאַץ
  choice: desprezou
  rationale: O verbo expressa rejeição com desdém. “Desprezou” preserva a intensidade e o paralelismo com “odiei”.
- source_word: לִבִּי
  choice: meu coração
  rationale: Mantém a imagem antropológica hebraica do coração como centro da vontade, do pensamento e da disposição interior, sem reduzi-la a um simples pronome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva o paralelismo poético e a força retrospectiva do lamento. Evita “reprovação”, que pode sugerir resultado de avaliação, e prefere “repreensão” para a correção verbal.
