base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/015.yaml
  text: Drink water from your own cistern[a], and flowing water from your own well.
translation:
  language: pt
  text: Beba água da sua própria cisterna e água corrente[a] de dentro do seu próprio poço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o que flui de dentro do seu próprio poço”. O particípio hebraico pode ser traduzido mais literalmente sem que se acrescente a palavra “água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Beba
  rationale: Imperativo qal na segunda pessoa do singular de שׁתה. “Beba” preserva de modo direto a força da ordem, sem acrescentar uma intensidade ausente do verbo.
- source_word: מַיִם
  choice: água
  rationale: O substantivo comum significa “água”. Embora tenha forma plural em hebraico, o singular massivo é a expressão idiomática em português.
- source_word: מִבּוֹרֶךָ
  choice: da sua própria cisterna
  rationale: בּוֹר designa com frequência uma cisterna ou reservatório escavado. “Sua própria” expressa o sufixo possessivo e, de modo natural, a exclusividade salientada pelo contexto.
- source_word: וְנֹזְלִים
  choice: e água corrente
  rationale: O particípio de נזל significa “fluir”. A expressão é elíptica e retoma “água” por paralelismo; “água corrente” torna a imagem natural em português sem explicitar a metáfora conjugal.
- source_word: מִתּוֹךְ
  choice: do
  rationale: Neste contexto, a preposição indica a procedência a partir do interior do poço. O português idiomático pode expressá-la simplesmente por “do”; a tradução mais explícita “de dentro do” é preservada na nota.
- source_word: בְּאֵרֶךָ
  choice: seu próprio poço
  rationale: בְּאֵר normalmente significa “poço”. Mantém-se a imagem concreta do hebraico, enquanto “próprio” comunica naturalmente a posse e a exclusividade contextual.
theological_decisions:
- issue: Tornar explícita no texto principal a metáfora conjugal e sexual
  choice: Manter no texto principal a imagem literal da água, da cisterna e do poço
  alternative: Traduzir interpretativamente como “Satisfaça-se com sua própria esposa” ou formulação semelhante
  rationale: O provérbio emprega deliberadamente uma metáfora, cuja aplicação é esclarecida pelo contexto imediato. Explicitar a esposa no próprio versículo substituiria a imagem poética por interpretação e acrescentaria palavras que não estão no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva-se o paralelismo poético e a metáfora concreta, sem antecipar sua explicação contextual.
