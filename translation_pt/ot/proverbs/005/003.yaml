  text: כִּ֤י נֹ֣פֶת תִּ֭טֹּפְנָה שִׂפְתֵ֣י זָרָ֑ה וְ/חָלָ֖ק מִ/שֶּׁ֣מֶן חִכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
translation:
  language: pt
  text: Pois os lábios da mulher proibida[a] destilam mel, e o seu palato[b] é mais suave que o azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulher estranha”, “mulher estrangeira” ou “adúltera”. Em Provérbios, o termo hebraico muitas vezes designa uma mulher fora dos limites de uma relação sexual legítima.
    reason: lexical_alternative
  - marker: b
    text: Ou “boca”; por extensão, pode referir-se à boca ou à fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a advertência do contexto e mantém com naturalidade a ligação lógica.
- source_word: נֹפֶת תִּטֹּפְנָה
  choice: destilam mel
  rationale: Reproduz a imagem do mel que goteja ou escorre, numa formulação portuguesa natural e poética.
- source_word: שִׂפְתֵי זָרָה
  choice: os lábios da mulher proibida
  rationale: Mantém a imagem corporal e comunica o sentido sapiencial de uma mulher situada fora dos limites de uma relação sexual legítima, sem reduzir necessariamente o termo a estrangeira ou adúltera.
- source_word: וְחָלָק מִשֶּׁמֶן
  choice: é mais suave que o azeite
  rationale: Expressa o valor comparativo de מִן e verte שֶׁמֶן pelo azeite familiar no contexto cultural, preservando a metáfora de fala sedutora.
- source_word: חִכָּהּ
  choice: o seu paladar
  rationale: Conserva o referente anatômico literal, que funciona por metonímia para a boca ou a fala, sem substituir a imagem por sua interpretação.
theological_decisions:
- issue: Sentido de זָרָה no contexto sapiencial de Provérbios
  choice: mulher proibida
  alternative: mulher estranha; mulher estrangeira; adúltera
  rationale: No contexto, o termo caracteriza sobretudo a mulher com quem a relação sexual é ilícita. A escolha comunica essa força moral sem fazer da etnia a questão central nem especificar além do texto que ela seja casada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Destilam mel” preserva o paralelismo poético; “paladar” mantém a imagem hebraica, esclarecida em nota.
