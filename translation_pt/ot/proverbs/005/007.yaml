  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ/אַל תָּ֝ס֗וּרוּ מֵ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
translation:
  language: pt
  text: E agora, filhos[a], escutem-me e não se desviem das palavras da minha boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “crianças”. O hebraico emprega o plural masculino (“filhos”), forma preservada aqui de acordo com a redação do texto-fonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que liga o versículo ao contexto anterior quanto a mudança discursiva marcada pelo advérbio temporal.
- source_word: בָנִים
  choice: filhos
  rationale: Mantém o plural masculino do hebraico e a forma de tratamento filial característica da literatura sapiencial, sem acrescentar o possessivo “meus”, ausente neste versículo.
- source_word: שִׁמְעוּ לִי
  choice: escutem-me
  rationale: Expressa de modo natural a ordem de prestar atenção; o contexto pode implicar obediência, mas traduzi-lo diretamente por “obedeçam-me” tornaria explícito mais do que o verbo exige.
- source_word: וְאַל תָּסוּרוּ
  choice: e não se desviem
  rationale: Reproduz a coordenação entre as exortações e conserva a imagem de afastar-se de um caminho ou instrução.
- source_word: מֵאִמְרֵי פִי
  choice: das palavras da minha boca
  rationale: Preserva o idioma hebraico e sua solenidade retórica sem perder clareza em português.
theological_decisions: []
