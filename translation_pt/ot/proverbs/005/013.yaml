  text: וְֽ/לֹא שָׁ֭מַעְתִּי בְּ/ק֣וֹל מוֹרָ֑/י וְ֝/לִֽ/מְלַמְּדַ֗/י לֹא הִטִּ֥יתִי אָזְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/013.yaml
  text: and I did not listen to the voice of my instructors[a], nor did I incline my ear to my teachers.
translation:
  language: pt
  text: e não ouvi a voz dos que me instruíam[a], nem inclinei o ouvido aos que me ensinavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedeci aos que me instruíam”. Nesse contexto de sabedoria, o verbo hebraico pode indicar ouvir com disposição para obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: ouvi
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. Com בְּקוֹל, no contexto de sabedoria, implica dar ouvidos e atender; “ouvi” preserva a formulação concisa e permite que a nota explicite a nuance de obediência.
- source_word: בְּקוֹל
  choice: a voz
  rationale: A expressão שׁמע בקול é literalmente “ouvir a voz” e frequentemente significa atender ou obedecer. A tradução mantém a imagem hebraica, que também é natural em português.
- source_word: מוֹרָי
  choice: dos que me instruíam
  rationale: O particípio plural com sufixo de primeira pessoa designa aqueles que davam instrução ao falante. A construção verbal é clara e ajuda a distingui-lo do termo paralelo seguinte.
- source_word: מְלַמְּדַי
  choice: aos que me ensinavam
  rationale: Derivado de למד, expressa os que ensinavam o falante. A escolha preserva a leve variação lexical do paralelismo hebraico.
- source_word: הִטִּיתִי אָזְנִי
  choice: inclinei o ouvido
  rationale: Mantém a metáfora hebraica de voltar ou inclinar o ouvido para prestar atenção, em linguagem digna e compreensível.
- source_word: וְ...וְלֹא
  choice: e não... nem
  rationale: As duas orações negativas coordenadas são vertidas naturalmente em português com “e não... nem”.
theological_decisions: []
