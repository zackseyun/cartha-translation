  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/021.yaml
  text: For a man's ways are before the eyes of Yahweh[a], and he watches all his paths.
translation:
  language: pt
  text: Pois os caminhos do homem estão diante dos olhos de Yahweh, e ele avalia todas as veredas do homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele pesa todas as veredas do homem”. O verbo hebraico pode transmitir a ideia de medir ou avaliar um percurso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a advertência anterior e mantém de modo conciso a ligação explicativa.
- source_word: נֹכַח עֵינֵי יְהוָה
  choice: diante dos olhos de Yahweh
  rationale: 'Preserva a imagem antropomórfica e espacial do hebraico: a conduta humana está inteiramente exposta à vista de Yahweh.'
- source_word: דַּרְכֵי אִישׁ
  choice: os caminhos do homem
  rationale: Mantém o masculino singular genérico do hebraico e a metáfora convencional dos caminhos como conduta.
- source_word: מַעְגְּלֹתָיו
  choice: suas veredas
  rationale: Conserva o paralelismo poético com 'caminhos' e a imagem mais concreta de trilhas ou cursos seguidos.
- source_word: מְפַלֵּס
  choice: avalia
  rationale: No contexto, o particípio comunica exame ou mensuração ativa dos rumos humanos; 'avalia' expressa essa dimensão sem limitar o verbo à observação visual.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto e preserva sua referência pessoal e pactual.
- issue: Masculino genérico אִישׁ
  choice: do homem
  alternative: do ser humano; de uma pessoa
  rationale: Reproduz a forma masculina singular representativa do hebraico, entendida como aplicável genericamente.
- issue: Sentido de מְפַלֵּס aplicado por Yahweh às veredas
  choice: avalia
  alternative: observa; pesa; aplaina
  rationale: Preserva a noção contextual de medir ou examinar a conduta. A alternativa metafórica 'pesa' é registrada em nota, sem resolver em excesso a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A formulação mantém o paralelismo entre 'caminhos' e 'veredas' e conserva a imagem dos 'olhos de Yahweh'.
