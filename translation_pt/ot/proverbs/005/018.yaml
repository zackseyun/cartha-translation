base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/018.yaml
  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
translation:
  language: pt
  text: Seja bendita a sua fonte[a], e alegre-se com a esposa da sua juventude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua nascente”. O hebraico mantém a metáfora da água e pode sugerir tanto a fonte da vida quanto a fecundidade conjugal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Seja
  rationale: O jussivo de היה expressa desejo ou exortação; “Seja” preserva essa força de modo conciso e natural em português.
- source_word: מְקוֹרְךָ
  choice: a sua fonte
  rationale: מָקוֹר designa fonte ou nascente. “Fonte” mantém a metáfora da água e sua possível associação contextual com vida e fecundidade conjugal.
- source_word: בָרוּךְ
  choice: bendita
  rationale: O sentido passivo/adjetival é diretamente expresso por “bendita”, sem especificar indevidamente a forma da bênção.
- source_word: וּשְׂמַח
  choice: e alegre-se
  rationale: O imperativo prossegue a exortação e comunica de maneira atual e digna a alegria conjugal ordenada pelo texto.
- source_word: מֵאֵשֶׁת
  choice: com a mulher
  rationale: Após שׂמח, מן pode indicar a fonte ou o objeto da alegria. “Alegre-se com” é natural em português e preserva a relação conjugal sem explicá-la em excesso.
- source_word: נְעוּרֶיךָ
  choice: da sua juventude
  rationale: A expressão indica a mulher com quem o homem se uniu quando jovem; a tradução literal é clara e reconhecível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A metáfora hebraica foi preservada, e “mulher da sua juventude” mantém a formulação sapiencial sem acrescentar interpretação denominacional.
