base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/020.yaml
  text: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
translation:
  language: pt
  text: Por que, meu filho, você se desviaria com uma mulher alheia[a] e abraçaria o seio de uma estrangeira[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “mulher estranha” ou “mulher proibida”. Aqui, o termo hebraico indica uma mulher alheia aos vínculos conjugais legítimos, não alguém meramente incomum.
    reason: lexical_alternative
  - marker: b
    text: Ou “o colo de uma estrangeira”. A palavra hebraica pode indicar o seio ou o colo envolvido num abraço íntimo. Neste contexto, “estrangeira” também tem o sentido de mulher de fora dos vínculos legítimos, não sendo principalmente uma referência à etnia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Por que ... você se desviaria
  rationale: A pergunta retórica introduz uma advertência. O futuro hebraico tem aqui força modal, expressa naturalmente em português pelo condicional.
- source_word: תִשְׁגֶּה
  choice: se desviaria
  rationale: שׁגה pode indicar errar, vaguear ou deixar-se desviar e, neste contexto, também pode sugerir fascinação. “Desviar-se” preserva o sentido moral sem tornar explícita apenas uma das nuances possíveis.
- source_word: בְנִי
  choice: meu filho
  rationale: Reproduz o sufixo de primeira pessoa e mantém a moldura de instrução paterna de Provérbios.
- source_word: זָרָה
  choice: mulher alheia
  rationale: No contexto das advertências de Provérbios, designa uma mulher fora dos vínculos conjugais legítimos. “Alheia” comunica alteridade relacional sem sugerir que ela seja simplesmente excêntrica ou necessariamente estrangeira por etnia.
- source_word: תְחַבֵּק
  choice: abraçaria
  rationale: Equivalente direto e natural de חבק, adequado ao paralelismo e ao contexto íntimo.
- source_word: חֵק
  choice: colo
  rationale: חֵק pode designar o colo ou a região do peito acolhida num abraço. “Colo” conserva a imagem corporal íntima sem especificá-la além do hebraico.
- source_word: נָכְרִיָּה
  choice: estrangeira
  rationale: Preserva a distinção lexical em relação a זָרָה e o sentido básico de alguém de fora, enquanto o contexto indica que a questão central é a relação sexual ilícita, não a etnia.
theological_decisions:
- issue: Como verter os termos paralelos זָרָה e נָכְרִיָּה
  choice: “mulher alheia” e “estrangeira”
  alternative: “mulher estranha” e “estrangeira”; ou “adúltera” em ambos os membros
  rationale: A tradução mantém a distinção entre os dois vocábulos e deixa que o contexto estabeleça a impropriedade moral. Evita reduzir a advertência à origem étnica da mulher e também evita tornar “adúltera” explícito onde o lexema isolado é mais amplo.
- issue: Nuance de שׁגה no contexto de Provérbios 5
  choice: “se desviaria”
  alternative: “se deixaria seduzir” ou “ficaria embriagado”
  rationale: O verbo admite a ideia de desvio e pode ecoar a fascinação amorosa do versículo anterior. “Desviar-se” preserva essa tensão sem resolver o jogo semântico em favor de uma única imagem.
translation_notes:
  register: Português moderno, claro e digno, com construção interrogativa natural. O uso de “você” favorece ampla legibilidade brasileira; “meu filho” preserva o tom sapiencial. Os marcadores foram colocados junto às expressões que as notas explicam.
