  text: but in the end she is bitter like wormwood[a], sharp like a two-edged sword.
translation:
  language: pt
  text: Mas o fim dela é amargo como o absinto[a], afiado como uma espada de dois gumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “mas, no fim, ela é amarga como o absinto e afiada como uma espada de dois gumes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  choice: mas, no fim, ela
  rationale: אַחֲרִיתָהּ pode indicar literalmente “o fim dela” e, por extensão, seu resultado final. A formulação idiomática mantém o contraste com a doçura descrita no versículo anterior e explicita o referente feminino.
- source_word: מָרָה
  choice: é amarga
  rationale: O adjetivo funciona como predicativo e descreve o resultado final como doloroso e desagradável.
- source_word: כַלַּעֲנָה
  choice: como o absinto
  rationale: לַעֲנָה designa uma planta proverbialmente amarga. “Absinto” é a designação bíblica tradicional e inteligível em português, preservando a imagem concreta.
- source_word: חַדָּה
  choice: afiada
  rationale: O feminino concorda com “ela” e expressa diretamente a qualidade cortante evocada pela comparação seguinte.
- source_word: כְּחֶרֶב פִּיּוֹת
  choice: como uma espada de dois gumes
  rationale: A expressão hebraica, literalmente “espada de bocas/gumes”, designa idiomaticamente uma lâmina cortante dos dois lados. “Espada de dois gumes” é natural e tradicional em português.
