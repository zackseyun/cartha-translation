source:
  edition: WLC
  text: לִ/שְׁמֹ֥ר מְזִמּ֑וֹת וְ֝/דַ֗עַת שְׂפָתֶ֥י/ךָ יִנְצֹֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/002.yaml
  text: so that you may keep discretion[b][a], and your lips may guard knowledge.
translation:
  language: pt
  text: para que você preserve a prudência[a], e seus lábios guardem o conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o discernimento” ou “o bom senso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: para que você preserve
  rationale: O infinitivo construto com ל indica propósito no contexto. “Para que você preserve” explicita essa relação e mantém o sentido de guardar ou conservar.
- source_word: מְזִמּוֹת
  choice: a prudência
  rationale: No contexto positivo da literatura sapiencial, o termo indica discernimento prudente ou bom senso, e não planos ou intrigas em sentido negativo.
- source_word: וְדַעַת
  choice: o conhecimento
  rationale: דעת designa com frequência, em Provérbios, conhecimento moral e prático. “Conhecimento” preserva a correspondência lexical sem ampliar o sentido para “entendimento”.
- source_word: שְׂפָתֶיךָ
  choice: seus lábios
  rationale: A tradução conserva a imagem corporal concreta do hebraico, na qual os lábios representam a fala.
- source_word: יִנְצֹרוּ
  choice: guardem
  rationale: O verbo traz a ideia de proteger ou conservar. O subjuntivo português acompanha naturalmente a construção de propósito iniciada por “para que”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura de propósito e o paralelismo poético foram preservados; a imagem literal dos lábios foi mantida por ser natural e expressiva em português.
