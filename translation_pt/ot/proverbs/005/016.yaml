  yaml_path: translation/ot/proverbs/005/016.yaml
  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
translation:
  language: pt
  text: Será que as suas fontes devem se espalhar lá fora[b][a], como ribeiros de água pelas ruas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Espalhem-se as suas fontes lá fora, como ribeiros de água pelas ruas.” A forma hebraica pode ser lida assim, mas o contexto mais amplo favorece fortemente uma pergunta retórica.'
    reason: alternative_reading
  - marker: b
    text: No contexto da fidelidade conjugal, a imagem da água se refere metaforicamente à vitalidade sexual e aos descendentes do homem (veja Provérbios 5:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: יָפ֣וּצוּ
  choice: devem se espalhar
  rationale: O Qal de פוץ exprime dispersão ou espalhamento. Com a partícula interrogativa suprida pelo contexto, a formulação transmite a força de pergunta retórica sem transformar a forma hebraica em simples afirmação.
- source_word: מַעְיְנֹתֶיךָ
  choice: as suas fontes
  rationale: מַעְיָן designa uma fonte ou nascente. “Fontes” é claro em português, preserva a metáfora da água e funciona naturalmente em paralelo com “ribeiros”.
- source_word: חוּצָה
  choice: lá fora
  rationale: O advérbio indica movimento ou localização para fora. “Lá fora” mantém o contraste entre o âmbito íntimo e o espaço público de modo natural em português.
- source_word: בָּרְחֹבוֹת
  choice: pelas ruas
  rationale: רְחֹבוֹת pode designar ruas largas, praças ou espaços públicos. “Pelas ruas” é idiomático e ressalta a dispersão no espaço público.
- source_word: פַּלְגֵי מָיִם
  choice: ribeiros de água
  rationale: פֶּלֶג denota canal, curso ou corrente de água. “Ribeiros de água” preserva o paralelismo poético com “fontes” e é compreensível em português amplo.
theological_decisions:
- issue: Se a linha deve ser entendida como afirmação, exortação ou pergunta retórica no contexto da fidelidade conjugal
  choice: 'Pergunta retórica: “Será que as suas fontes devem se espalhar...?”'
  alternative: 'Exortação: “Espalhem-se as suas fontes...” ou afirmação indicativa.'
  rationale: A forma hebraica admite leitura volitiva, mas o contexto imediato de Provérbios 5:15–17 exorta à exclusividade conjugal, especialmente no versículo seguinte. A pergunta retórica preserva essa progressão sem inserir uma conclusão doutrinária estranha ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores [b][a] acompanha os elementos explicados no texto de consulta. A coordenação com “e” torna explícito o paralelismo elíptico do hebraico sem resolver além do necessário a relação entre as duas imagens.
