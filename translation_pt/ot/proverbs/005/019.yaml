base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/019.yaml
  text: a loving doe[a], a graceful mountain goat—may her breasts satisfy you at all times[b]; be intoxicated always with her love.
translation:
  language: pt
  text: Uma corça amorosa, uma cabra-montês graciosa[a] — que os seios dela o satisfaçam em todo o tempo; esteja sempre embriagado pelo amor dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um íbex gracioso”. O hebraico יַעֲלָה designa uma cabra selvagem das montanhas.
    reason: lexical_alternative
  - marker: b
    text: Ou “deixe-se sempre arrebatar pelo amor dela”. O verbo hebraico pode significar literalmente “desviar-se” ou “andar errante”, mas aqui é empregado positivamente para descrever alguém inteiramente tomado pelo amor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  choice: uma corça amorosa
  rationale: אַיֶּלֶת designa a fêmea do cervo, e אֲהָבִים caracteriza a imagem por sua associação com o amor e o afeto. “Corça amorosa” mantém a metáfora animal e soa natural em português.
- source_word: וְיַעֲלַת חֵן
  choice: uma cabra-montês graciosa
  rationale: יַעֲלָה designa uma cabra selvagem das montanhas, ou íbex, e חֵן comunica graça ou encanto. A escolha preserva o paralelismo poético e torna a imagem compreensível.
- source_word: דַּדֶּיהָ
  choice: os seios dela
  rationale: O substantivo refere-se concretamente aos seios. O contexto conjugal e erótico justifica uma tradução direta, sem suavização eufemística.
- source_word: יְרַוֻּךָ
  choice: o satisfaçam
  rationale: A forma de רוה expressa beber até saciar-se, ficar plenamente satisfeito ou saturado. Neste contexto, “satisfaçam” comunica de modo idiomático a plenitude do prazer conjugal.
- source_word: בְכָל עֵת
  choice: em todo o tempo
  rationale: Reproduz claramente a expressão temporal e a distingue de תָמִיד na oração seguinte.
- source_word: בְאַהֲבָתָהּ
  choice: pelo amor dela
  rationale: A preposição ב pode indicar a causa ou o meio pelo qual a pessoa é arrebatada. “Pelo amor dela” é natural em português e mantém o foco no amor da esposa.
- source_word: תִּשְׁגֶּה
  choice: esteja embriagado
  rationale: Embora שׁגה normalmente possa significar errar ou desviar-se, aqui descreve positivamente o homem tomado pelo amor da esposa. “Esteja embriagado” preserva a força da imagem no contexto.
- source_word: תָמִיד
  choice: sempre
  rationale: Equivalente corrente e direto para a ideia de continuidade expressa pelo advérbio.
theological_decisions:
- issue: Imagens eróticas no casamento dentro da literatura sapiencial
  choice: Manter explicitamente os seios e a satisfação amorosa no casamento.
  alternative: Empregar eufemismos como “colo” ou reduzir a imagem a afeto não sexual.
  rationale: No contexto de Provérbios 5, o versículo recomenda o prazer com a própria esposa como contraponto ao adultério. A linguagem concreta pertence ao texto hebraico e não deve ser suavizada por escrúpulos externos ao texto.
- issue: Sentido positivo de תִּשְׁגֶּה neste contexto
  choice: Traduzir metaforicamente como “esteja embriagado”.
  alternative: Traduzir literalmente como “ande sempre desviado” ou, de modo menos intenso, “deixe-se arrebatar”.
  rationale: O sentido comum de desviar-se produziria aqui uma tensão deliberada, pois o contexto transforma a ideia de perder o rumo numa imagem positiva de entrega ao amor conjugal. A tradução escolhida comunica essa extensão sem convertê-la em condenação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A anatomia e o teor erótico-conjugal são expressos diretamente, como no hebraico. A construção volitiva “que... satisfaçam” e a exortação “esteja” reproduzem a força contextual das formas verbais sem recorrer a linguagem arcaica.
