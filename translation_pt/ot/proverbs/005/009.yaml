  text: פֶּן תִּתֵּ֣ן לַ/אֲחֵרִ֣ים הוֹדֶ֑/ךָ וּ֝/שְׁנֹתֶ֗י/ךָ לְ/אַכְזָרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/009.yaml
  text: lest you give your honor to others[b][a], and your years to the cruel one.
translation:
  language: pt
  text: para que você não entregue a outros a sua honra[a], nem os seus anos a alguém cruel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu esplendor” ou “o seu vigor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a uma pessoa impiedosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: para que... não
  rationale: Introduz a consequência indesejada contra a qual se adverte. Em português atual, esta construção preserva a finalidade preventiva e se integra naturalmente ao contexto iniciado no versículo anterior.
- source_word: תִּתֵּן
  choice: entregue
  rationale: נתן significa normalmente “dar”, mas “entregar” expressa com naturalidade, neste contexto, a perda de algo próprio para terceiros sem tornar explícita uma ideia de rendição que o verbo hebraico não exige.
- source_word: לַאֲחֵרִים
  choice: a outros
  rationale: Reproduz o plural e mantém a referência ampla a outras pessoas, sem restringi-la indevidamente a estrangeiros ou desconhecidos.
- source_word: הוֹדֶךָ
  choice: a sua honra
  rationale: הוֹד pode indicar honra, esplendor, majestade ou vigor. “Honra” comunica bem a dignidade e posição que se perdem no contexto, enquanto uma nota preserva alternativas lexicais legítimas.
- source_word: וּשְׁנֹתֶיךָ
  choice: nem os seus anos
  rationale: A coordenação negativa com “nem” é idiomática após “não” em português. “Seus anos” conserva a expressão concisa do hebraico, que pode se referir aos anos de vida ou aos melhores anos.
- source_word: לְאַכְזָרִי
  choice: a alguém cruel
  rationale: O adjetivo singular substantivado não identifica explicitamente sexo nem referente. “Alguém cruel” soa natural em português e preserva essa abertura melhor que “homem cruel”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação permanece ligada sintaticamente à advertência do versículo anterior. Os pronomes possessivos com artigo favorecem naturalidade ampla, e “alguém cruel” evita acrescentar ao hebraico uma identificação masculina explícita.
