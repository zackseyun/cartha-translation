  text: כִּ֭/מְעַט הָיִ֣יתִי בְ/כָל רָ֑ע בְּ/ת֖וֹךְ קָהָ֣ל וְ/עֵדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/014.yaml
  text: I was almost in every kind of evil in the midst of the assembly and congregation[a].
translation:
  language: pt
  text: 'Quase estive em todo tipo de mal,

    no meio da assembleia e da comunidade.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu estava à beira da ruína total” ou “Quase estive em todo o mal”. A expressão hebraica é compacta e pode enfatizar tanto o mal moral como uma ruína desastrosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Por pouco não
  rationale: Com הָיִיתִי, indica proximidade de uma situação, não curta duração. A construção idiomática portuguesa expressa naturalmente o sentido de “quase”.
- source_word: הָיִיתִי
  choice: me vi
  rationale: O hebraico diz literalmente “eu estava/fui”. Em português, “me vi” conserva a retrospectiva pessoal e se liga com naturalidade a “por pouco não”, sem acrescentar uma causa.
- source_word: בְכָל רָע
  choice: em todo tipo de mal
  rationale: Mantém a abrangência de כָּל e o possível sentido moral de רָע no contexto, enquanto a nota registra a leitura igualmente possível de ruína ou calamidade total.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Reproduz de modo natural o sentido espacial e público de estar no interior da coletividade reunida.
- source_word: קָהָל
  choice: assembleia
  rationale: Equivalente corrente e digno para uma coletividade formalmente reunida.
- source_word: וְעֵדָה
  choice: e da comunidade
  rationale: Preserva os dois termos hebraicos correlatos sem a redundância pouco natural de “assembleia e congregação”; “comunidade” destaca o corpo coletivo.
theological_decisions:
- issue: רָע pode indicar mal moral ou desgraça/ruína
  choice: todo tipo de mal
  alternative: ruína completa
  rationale: O contexto de advertência moral favorece “mal”, mas o hebraico compacto não exclui o resultado desastroso; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O paralelismo nominal hebraico é preservado por “assembleia e comunidade”, e a ambiguidade de רָע é explicitada em nota.
