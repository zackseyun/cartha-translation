  text: ה֗וּא יָ֭מוּת בְּ/אֵ֣ין מוּסָ֑ר וּ/בְ/רֹ֖ב אִוַּלְתּ֣/וֹ יִשְׁגֶּֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/023.yaml
  text: He dies for lack of discipline[a], and in the abundance of his folly he goes astray.
translation:
  language: pt
  text: Ele morre por falta de disciplina[a] e, por causa de sua grande insensatez, se desvia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele morrerá sem disciplina e, por causa de sua grande insensatez, se desviará.”'
    reason: Alternativa lexical e aspectual que preserva o valor futuro possível dos verbos e a leitura circunstancial de בְּאֵין.
lexical_decisions:
- source_word: יָמוּת
  choice: morre
  rationale: O imperfeito qal pode expressar o resultado geral ou certo típico da literatura sapiencial; o presente soa natural como máxima proverbial em português.
- source_word: בְּאֵין
  choice: por falta de
  rationale: Expressa de modo natural tanto a circunstância quanto a força causal da construção hebraica.
- source_word: מוּסָר
  choice: disciplina
  rationale: Em Provérbios, o termo costuma indicar formação corretiva e moral, não apenas transmissão de informação.
- source_word: וּבְרֹב
  choice: por causa de sua grande
  rationale: רֹב indica grandeza ou abundância; com o substantivo abstrato, esta formulação comunica naturalmente a intensidade e a relação causal sugerida pelo contexto.
- source_word: אִוַּלְתּוֹ
  choice: sua grande insensatez
  rationale: O substantivo designa insensatez moral, uma categoria central da literatura sapiencial; “insensatez” é atual, digna e mais clara ao leitor comum que “estultícia”.
- source_word: יִשְׁגֶּה
  choice: se desvia
  rationale: Preserva a ideia de errar ou sair do caminho moral sem especificar indevidamente embriaguez ou cambaleio físico.
- source_word: הוּא
  choice: Ele
  rationale: Mantém o pronome explícito e enfático do hebraico de maneira simples e natural.
