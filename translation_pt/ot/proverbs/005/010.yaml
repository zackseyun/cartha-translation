  text: פֶּֽן יִשְׂבְּע֣וּ זָרִ֣ים כֹּחֶ֑/ךָ וַ֝/עֲצָבֶ֗י/ךָ בְּ/בֵ֣ית נָכְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/010.yaml
  text: lest strangers be filled with your strength[b][a], and your labors go to the house of a foreigner.
translation:
  language: pt
  text: para que estranhos não se fartem da sua força[a], e seus esforços[b] acabem na casa de um estrangeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não se satisfaçam com a sua força”. O verbo hebraico pode indicar tanto ficar cheio como ficar satisfeito.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus trabalhos penosos”. A expressão também pode se referir aos bens obtidos com muito trabalho.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz a consequência indesejada que deve ser evitada; esta construção é natural em português e mantém a força de advertência.
- source_word: יִשְׂבְּעוּ
  choice: se fartem
  rationale: O verbo indica ficar cheio ou satisfeito. “Fartar-se” preserva a imagem de outros consumindo ou aproveitando plenamente os recursos do destinatário.
- source_word: זָרִים
  choice: estranhos
  rationale: Designa pessoas de fora do círculo próprio do destinatário e mantém distinção lexical em relação a נָכְרִי no segundo segmento.
- source_word: כֹּחֶךָ
  choice: sua força
  rationale: Conserva o sentido amplo de força, vigor ou capacidade produtiva, sem reduzi-lo exclusivamente a riqueza.
- source_word: וַעֲצָבֶיךָ
  choice: o fruto do seu trabalho
  rationale: O substantivo pode indicar os esforços penosos ou aquilo que eles produzem. No contexto de algo que chega à casa alheia, a expressão torna explícita a metonímia de modo natural.
- source_word: בְּבֵית
  choice: vá parar na casa de
  rationale: Embora a preposição expresse literalmente localização, o paralelismo pressupõe que o resultado do trabalho acaba no lar de outra pessoa; “vá parar” comunica essa transferência implícita.
- source_word: נָכְרִי
  choice: um estrangeiro
  rationale: Mantém o sentido de alguém alheio ou de fora e preserva a distinção em relação a “estranhos” no primeiro segmento.
