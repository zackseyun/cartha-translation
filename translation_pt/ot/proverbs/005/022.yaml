  text: עַֽווֹנוֹתָ֗י/ו יִלְכְּדֻ/נ֥וֹ אֶת הָ/רָשָׁ֑ע וּ/בְ/חַבְלֵ֥י חַ֝טָּאת֗/וֹ יִתָּמֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/022.yaml
  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
translation:
  language: pt
  text: As suas iniquidades capturarão o ímpio[a], e ele ficará preso nas cordas[b] do seu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o perverso”; o hebraico está no masculino singular.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos laços”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוּוֹנוֹתָיו
  choice: as suas próprias iniquidades
  rationale: O plural de עָוֹן expressa transgressões moralmente graves e pode incluir a culpa que elas acarretam. “Iniquidades” conserva esse peso; “próprias” explicita de modo natural em português que elas pertencem ao próprio ímpio, sem alterar a relação indicada pelo sufixo hebraico.
- source_word: יִלְכְּדֻנוֹ
  choice: capturarão
  rationale: O verbo לָכַד descreve apanhar, capturar ou prender. “Capturarão” preserva a imagem vívida na qual as próprias iniquidades se tornam o agente da captura.
- source_word: הָרָשָׁע
  choice: o ímpio
  rationale: O hebraico usa um adjetivo substantivado masculino singular. “O ímpio” reproduz essa forma com linguagem bíblica clara e corrente.
- source_word: וּבְחַבְלֵי
  choice: nas cordas
  rationale: חֶבֶל pode designar corda, cabo ou vínculo. “Nas cordas” mantém a imagem concreta de aprisionamento e o paralelismo com “capturarão”.
- source_word: חַטָּאתוֹ
  choice: do seu pecado
  rationale: O singular חַטָּאתוֹ é mantido como “seu pecado”, que pode funcionar coletivamente e apresenta o pecado como aquilo que prende o transgressor.
- source_word: יִתָּמֵךְ
  choice: ficará preso
  rationale: Neste contexto, o nifal de תמך indica ser segurado ou retido. “Ficará preso” comunica naturalmente o sentido passivo e se ajusta à figura das cordas, sem recorrer ao sentido inadequado de “ser sustentado”.
theological_decisions:
- issue: Imagem da responsabilidade e das consequências morais
  choice: As próprias iniquidades do ímpio são apresentadas como aquilo que o captura e prende.
  alternative: Uma declaração genérica sobre consequências, sem conservar a personificação do pecado como instrumento de captura.
  rationale: O paralelismo entre ser capturado pelas iniquidades e ficar preso nas cordas do pecado retrata o mal do próprio indivíduo como causa de seu aprisionamento. A tradução conserva essa causalidade moral sem acrescentar explicações sobre determinismo ou sobre os mecanismos do juízo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas o paralelismo e as imagens concretas de captura e aprisionamento foram preservados.
