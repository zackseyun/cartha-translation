  text: My son[a], pay attention to my wisdom; incline your ear to my understanding[b],
translation:
  language: pt
  text: Meu filho, preste atenção à minha sabedoria; incline o ouvido ao meu entendimento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao meu discernimento” ou “à minha compreensão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: O vocativo hebraico é masculino singular e apresenta a instrução de um pai ou mestre dirigida ao filho.
- source_word: לְחָכְמָתִי
  choice: à minha sabedoria
  rationale: Preserva o substantivo חָכְמָה e a relação sintática com o imperativo de prestar atenção.
- source_word: הַקְשִׁיבָה
  choice: preste atenção
  rationale: Expressa de modo natural e atual a ideia de escutar com atenção.
- source_word: לִתְבוּנָתִי
  choice: ao meu entendimento
  rationale: Mantém o substantivo abstrato e o paralelismo com 'sabedoria'; 'discernimento' e 'compreensão' também são possíveis.
- source_word: הַט
  choice: incline
  rationale: Conserva a metáfora hebraica de voltar ou inclinar o ouvido para escutar atentamente.
- source_word: אָזְנֶךָ
  choice: o ouvido
  rationale: Mantém o singular do hebraico e produz uma expressão idiomática compreensível em português.
