base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
translation:
  language: pt
  text: Para que ela não aplane a vereda da vida,[a] suas trilhas se desviam; ela não sabe disso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com o ouvinte como sujeito: “Para que não ponderes a vereda da vida; suas trilhas se desviam.” O verbo hebraico também pode significar “pesar” ou “ponderar”.'
    reason: lexical_alternative
  - marker: b
    text: O texto consonantal hebraico traz “minhas trilhas”, enquanto a leitura tradicional à margem traz “suas trilhas”, referindo-se à mulher. A forma final também pode ser entendida como “não sabes”, dirigida ao ouvinte.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: a vereda da vida
  rationale: “Vereda” preserva a metáfora concreta de um caminho e distingue este termo de מַעְגָּל na oração seguinte.
- source_word: פֶּן
  choice: para que ... não venha a
  rationale: Expressa a ideia de prevenção ou finalidade negativa de פֶּן em português atual, sem eliminar a construção compacta e difícil do hebraico.
- source_word: תְּפַלֵּס
  choice: tornar plana
  rationale: O piel de פלס pode indicar nivelar ou tornar plano, além de pesar ou ponderar. A escolha principal mantém a imagem viária; a alternativa interpretativa é registrada em nota.
- source_word: נָעוּ
  choice: vagueiam
  rationale: Comunica movimento errante e instabilidade, adequando-se à imagem das trilhas sem restringir o verbo apenas a instabilidade abstrata.
- source_word: מַעְגְּלֹתֶיהָ
  choice: suas trilhas
  rationale: Segue a leitura qere com sufixo feminino, referente à mulher dos versículos anteriores. “Trilhas” preserva a metáfora e evita repetir “vereda”.
- source_word: לֹא תֵדָע
  choice: ela não sabe disso
  rationale: A forma verbal pode ser entendida como terceira pessoa feminina ou segunda masculina singular. No texto principal, a referência feminina mantém a descrição da mulher; “disso” explicita apenas o objeto implícito.
theological_decisions:
- issue: Referente do sujeito e dos pronomes na segunda metade do versículo
  choice: 'A segunda metade continua descrevendo a mulher: “suas trilhas ... ela não sabe”.'
  alternative: 'A tradição escrita e a ambiguidade da forma verbal permitem entender uma interpelação ao ouvinte: “tuas trilhas ... não sabes”.'
  rationale: A leitura qere de מַעְגְּלֹתֶיהָ e o contexto de Provérbios 5:3–6 favorecem a referência feminina, mas a variante textual e a forma verbal ambígua exigem que a alternativa seja preservada.
- issue: Sentido de פלס e relação sintática de פן
  choice: Manter no texto a imagem de tornar plana a vereda, com פן expresso como finalidade ou prevenção negativa.
  alternative: 'Entender o verbo como “considerar/ponderar” e traduzir: “Ela não considera a vereda da vida; suas trilhas vagueiam”.'
  rationale: O hebraico é extremamente compacto e admite mais de uma análise. A tradução principal preserva a metáfora viária e a força de פן, enquanto a nota conserva a leitura tradicional alternativa sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação principal conserva deliberadamente a estranheza controlada da sintaxe hebraica; as notas esclarecem as alternativas lexical, sintática e textual sem impor uma solução denominacional.
