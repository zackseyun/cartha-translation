base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/008.yaml
  text: Keep your way far from her[a], and do not go near the entrance of her house.
translation:
  language: pt
  text: Mantenha o seu caminho longe dela[a] e não se aproxime da entrada da casa dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fique longe dela e não se aproxime da entrada da casa dela.”'
    reason: Alternativa lexical que entende הַרְחֵק de modo mais diretamente intransitivo, sem explicitar “o seu caminho” na primeira oração, embora o substantivo apareça no hebraico.
lexical_decisions:
- source_word: הַרְחֵק
  choice: Mantenha ... longe
  rationale: O imperativo hifil de רחק expressa a ordem causativa de estabelecer distância. Com “o seu caminho” como objeto, “mantenha ... longe” preserva tanto a força do imperativo quanto a imagem do caminho.
- source_word: מֵעָלֶיהָ
  choice: dela
  rationale: A construção preposicional indica afastamento da proximidade ou esfera dessa mulher. “Dela” completa naturalmente “longe” em português.
- source_word: דַרְכֶּךָ
  choice: o seu caminho
  rationale: דֶּרֶךְ pode designar caminho literal ou, metaforicamente, conduta e curso de vida. A tradução conserva essa imagem característica da literatura sapiencial.
- source_word: וְאַל תִּקְרַב
  choice: e não se aproxime
  rationale: A forma negativa expressa proibição. “Não se aproxime” é clara, natural e mantém a imagem de movimento espacial.
- source_word: אֶל פֶּתַח
  choice: da entrada
  rationale: פֶּתַח designa abertura, entrada ou portal. “Entrada” abrange o acesso à casa sem especificar indevidamente a porta física.
- source_word: בֵּיתָהּ
  choice: da casa dela
  rationale: בַּיִת significa concretamente “casa”; a formulação mantém o cenário espacial da advertência e torna inequívoca a referência possessiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “o seu caminho” conserva a metáfora hebraica; “casa dela” evita a possível ambiguidade oral de “sua casa”.
