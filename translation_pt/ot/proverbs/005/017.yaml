base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/017.yaml
  text: Let them be for you alone[a], and not for strangers with you.
translation:
  language: pt
  text: Que sejam somente seus[a], e não compartilhados com estranhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que sejam só seus, e não de estranhos com você”. O versículo dá continuidade à metáfora das fontes e correntes no contexto anterior e ressalta a fidelidade conjugal exclusiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Sejam
  rationale: O imperfeito qal na exortação tem força volitiva; “Sejam” transmite naturalmente essa nuance em português.
- source_word: לְךָ
  choice: para você
  rationale: A preposição לְ com o sufixo indica posse ou benefício; “para você” preserva a construção e mantém a ligação com a metáfora anterior.
- source_word: לְבַדֶּךָ
  choice: somente
  rationale: A expressão indica exclusividade. Com “para você”, “somente” produz uma formulação clara e natural.
- source_word: וְאֵין
  choice: e não
  rationale: A conjunção com a negação existencial apresenta o contraponto negativo de modo conciso, sem acrescentar uma proibição explícita ausente da forma hebraica.
- source_word: לְזָרִים
  choice: para estranhos
  rationale: זָרִים designa aqui pessoas alheias ao vínculo conjugal, não estrangeiros em sentido étnico; “estranhos” preserva a amplitude do termo.
- source_word: אִתָּךְ
  choice: com você
  rationale: A expressão associativa é vertida diretamente e conserva a ideia de que outros não devem compartilhar aquilo que pertence exclusivamente ao destinatário.
theological_decisions:
- issue: Exclusividade na metáfora das fontes e correntes
  choice: Manter a referência plural implícita e a linguagem metafórica, explicando na nota sua relação com a fidelidade conjugal.
  alternative: Explicitar no versículo a esposa ou a intimidade conjugal.
  rationale: O hebraico depende do contexto anterior e não nomeia diretamente a realidade simbolizada; explicá-la no corpo do texto eliminaria a metáfora e resolveria sua tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a concisão, o plural e a metáfora contextual do hebraico; “estranhos” indica pessoas de fora do vínculo conjugal, sem conotação étnica.
