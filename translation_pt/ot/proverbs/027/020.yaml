  text: שְׁא֣וֹל ו/אבדה לֹ֣א תִשְׂבַּ֑עְנָה וְ/עֵינֵ֥י הָ֝/אָדָ֗ם לֹ֣א תִשְׂבַּֽעְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/020.yaml
  text: Sheol and Abaddon are never satisfied[b][a], and the eyes of man are never satisfied.
translation:
  language: pt
  text: O Sheol[a] e a destruição[b] nunca se saciam, e os olhos do ser humano nunca se saciam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sheol: termo hebraico para o mundo dos mortos.'
    reason: lexical_clarification
  - marker: b
    text: O termo hebraico significa “destruição” e, neste paralelismo, pode evocar uma força ou domínio personificado de destruição.
    reason: lexical_clarification
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém transliterado o termo hebraico para o mundo dos mortos, evitando reduzi-lo a “sepultura” ou associá-lo diretamente ao conceito posterior de “inferno”.
- source_word: אבדה
  choice: a Destruição
  rationale: Traduz diretamente o substantivo como “Destruição”, preservando ao mesmo tempo, pela inicial maiúscula e pelo paralelismo com Sheol, sua possível força personificada ou referente ao domínio da destruição.
- source_word: לֹא תִשְׂבַּעְנָה
  choice: nunca se fartam
  rationale: O verbo שׂבע expressa ficar cheio ou saciado. “Nunca se fartam” é natural em português, comunica desejo insaciável e permite repetir exatamente a mesma formulação nas duas metades do provérbio.
- source_word: עֵינֵי הָאָדָם
  choice: os olhos do ser humano
  rationale: Preserva a imagem concreta dos olhos como expressão do desejo, enquanto “ser humano” comunica com clareza o sentido genérico de הָאָדָם, referente à humanidade em geral.
theological_decisions:
- issue: Identidade de Sheol
  choice: Manter “Sheol” sem identificá-lo com o inferno
  alternative: sepultura; mundo dos mortos; inferno
  rationale: O termo hebraico possui alcance semântico próprio e, neste provérbio, participa de uma imagem poética de insaciabilidade. Traduzir por “inferno” importaria associações doutrinárias posteriores; “sepultura” estreitaria seu sentido.
- issue: Forma de אבדה no paralelismo com Sheol
  choice: a Destruição
  alternative: Abadom
  rationale: A forma fornecida significa “destruição”. A tradução mantém essa leitura lexical sem eliminar sua possível dimensão personificada ou espacial. “Abadom” é tradicional e condiz com passagens que usam a forma אֲבַדּוֹן, mas não deve substituir silenciosamente a forma apresentada aqui.
- issue: Sentido genérico de הָאָדָם
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: O substantivo singular com artigo tem aqui valor genérico. “O ser humano” conserva o singular representativo e deixa claro que o provérbio trata da condição humana em geral, não somente de indivíduos do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “nunca se fartam” reproduz deliberadamente o paralelismo e a repetição verbal do hebraico. “Fartar-se” foi preferido a “ficar satisfeito” por conservar tanto a ideia de enchimento quanto a de desejo insaciável.
