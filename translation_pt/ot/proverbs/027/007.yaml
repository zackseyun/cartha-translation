  text: נֶ֣פֶשׁ שְׂ֭בֵעָה תָּב֣וּס נֹ֑פֶת וְ/נֶ֥פֶשׁ רְ֝עֵבָ֗ה כָּל מַ֥ר מָתֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/007.yaml
  text: A satisfied person despises honey[b][a], but to a hungry person every bitter thing is sweet.
translation:
  language: pt
  text: Quem está saciado despreza o mel[a], mas, para quem tem fome, tudo o que é amargo é doce.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Mel» pode referir-se mais especificamente ao mel do favo ou ao mel que escorre.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: «A alma saciada pisoteia o mel, mas, para a alma faminta, tudo o que é amargo é doce». Em hebraico, «alma» designa aqui a pessoa em relação ao seu apetite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: quem / para quem
  rationale: Aqui, נֶפֶשׁ designa idiomaticamente a pessoa considerada em relação ao apetite. A construção com «quem» é natural em português e evita a leitura técnica de «alma».
- source_word: שְׂבֵעָה
  choice: está satisfeito
  rationale: O adjetivo indica estar saciado ou de estômago cheio. «Está satisfeito» comunica esse estado com naturalidade e mantém o contraste com a fome.
- source_word: תָּבוּס
  choice: despreza
  rationale: Embora o verbo possa significar literalmente «pisotear», neste contexto expressa rejeição desdenhosa. «Despreza» preserva a força figurada sem tornar a imagem obscura.
- source_word: נֹפֶת
  choice: mel
  rationale: O termo pode referir-se mais especificamente ao mel que escorre ou ao mel do favo. «Mel» é claro no texto principal, e a nuance é registrada em nota.
- source_word: רְעֵבָה
  choice: tem fome
  rationale: Expressa simplesmente a condição de estar faminto; «tem fome» é corrente, exato e não exagera a intensidade.
- source_word: כָּל
  choice: tudo o que
  rationale: O valor distributivo é expresso naturalmente em português pela construção «tudo o que é amargo».
- source_word: מַר
  choice: o que é amargo
  rationale: O adjetivo é usado de modo substantivado e se refere a qualquer coisa amarga.
- source_word: מָתוֹק
  choice: é doce
  rationale: Mantém a predicação direta do hebraico, sem acrescentar interpretações como «parece» ou «tem gosto».
