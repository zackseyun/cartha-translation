  text: שֶׁ֣מֶן וּ֭/קְטֹרֶת יְשַׂמַּֽח לֵ֑ב וּ/מֶ֥תֶק רֵ֝עֵ֗/הוּ מֵֽ/עֲצַת נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/009.yaml
  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
translation:
  language: pt
  text: O óleo e o incenso alegram o coração, e a doçura de um amigo vem do conselho da alma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a doçura de um amigo é melhor que o conselho dado a si mesmo”. O hebraico da segunda linha é especialmente conciso e admite mais de uma interpretação.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶן
  choice: óleo
  rationale: É a correspondência mais direta para o termo hebraico, que pode designar óleo comum ou perfumado; preserva a imagem concreta ao lado do incenso.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: O termo designa normalmente incenso ou uma mistura aromática queimada; “incenso” mantém a imagem sensorial do provérbio.
- source_word: יְשַׂמַּח לֵב
  choice: alegram o coração
  rationale: Expressa naturalmente em português a ideia causativa do verbo hebraico e conserva “coração” como centro da experiência interior.
- source_word: מֶתֶק
  choice: doçura
  rationale: Mantém a metáfora sensorial do hebraico e descreve de modo conciso o caráter agradável da amizade.
- source_word: רֵעֵהוּ
  choice: de um amigo
  rationale: O hebraico traz “seu amigo/companheiro”; a formulação indefinida soa natural em um provérbio de aplicação geral, sem alterar o sentido.
- source_word: מֵעֲצַת
  choice: vem do conselho
  rationale: 'Toma a preposição מִן em sentido de origem: a doçura do amigo procede do conselho. A nota registra a possível leitura comparativa.'
- source_word: נָפֶשׁ
  choice: da alma
  rationale: Conserva a expressão antropológica compacta do hebraico e evita resolver interpretativamente se o conselho é sincero, íntimo ou dado a si mesmo.
