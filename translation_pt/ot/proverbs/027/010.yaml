  text: רֵֽעֲ/ךָ֨ ו/רעה אָבִ֡י/ךָ אַֽל תַּעֲזֹ֗ב וּ/בֵ֥ית אָחִ֗י/ךָ אַל תָּ֭בוֹא בְּ/י֣וֹם אֵידֶ֑/ךָ ט֥וֹב שָׁכֵ֥ן קָ֝ר֗וֹב מֵ/אָ֥ח רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/010.yaml
  text: Do not forsake your friend or your father’s friend[a], and do not go to your brother’s house in the day of your calamity[b]; a nearby neighbor is better than a distant brother.
translation:
  language: pt
  text: Não abandone o seu amigo nem o amigo de seu pai[a]; e não vá à casa de seu irmão[b] no dia da sua calamidade. Melhor é um vizinho próximo do que um irmão distante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e o amigo de seu pai”. Sob uma única proibição, “nem” expressa de modo natural em português a ligação entre os dois termos.'
    reason: lexical_alternative
  - marker: b
    text: “Irmão” também pode ter o sentido mais amplo de parente próximo ou membro do mesmo clã.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעֲךָ
  choice: o seu amigo
  rationale: רֵעַ pode designar amigo, companheiro ou próximo. Em paralelo com “o amigo de seu pai”, o sentido de amizade pessoal é o mais adequado.
- source_word: וְרֵעַ אָבִיךָ
  choice: nem o amigo de seu pai
  rationale: Sob o alcance da proibição, “nem” liga naturalmente em português os dois relacionamentos que não devem ser abandonados. A conjunção hebraica é literalmente “e”, possibilidade registrada em nota.
- source_word: אַל תַּעֲזֹב
  choice: Não abandone
  rationale: עזב expressa deixar ou abandonar uma pessoa, relação ou compromisso. “Abandone” preserva o peso relacional e é claro no português atual.
- source_word: וּבֵית אָחִיךָ אַל תָּבוֹא
  choice: e não vá à casa de seu irmão
  rationale: בוא pode significar vir, ir ou entrar. Com “casa”, “ir à casa” é a formulação portuguesa mais natural e sugere recorrer ao irmão em busca de ajuda.
- source_word: בְּיוֹם אֵידֶךָ
  choice: no dia da sua calamidade
  rationale: אֵיד indica desastre, ruína ou calamidade. A escolha comunica uma adversidade grave sem especificar indevidamente sua natureza.
- source_word: טוֹב
  choice: Melhor é
  rationale: Embora טוֹב signifique literalmente “bom”, a construção com מִן estabelece uma comparação, para a qual “melhor” é a forma idiomática em português.
- source_word: שָׁכֵן קָרוֹב
  choice: um vizinho próximo
  rationale: שָׁכֵן é “vizinho”, e קָרוֹב indica proximidade. “Próximo” mantém em aberto a dimensão espacial e relacional da expressão.
- source_word: מֵאָח רָחוֹק
  choice: do que um irmão distante
  rationale: אָח pode designar um irmão literal ou, em sentido mais amplo, um parente próximo. “Irmão” preserva a imagem familiar do hebraico, enquanto “distante” conserva o contraste com o vizinho próximo.
theological_decisions:
- issue: Amplitude da linguagem de parentesco
  choice: Manter “irmão” no texto principal.
  alternative: “parente” ou “membro do clã”
  rationale: Embora אָח possa ter sentido mais amplo, “irmão” preserva o contraste concreto entre laço familiar e proximidade prática, sem decidir se o provérbio se limita necessariamente a irmãos biológicos.
- issue: Sentido da proximidade e da distância
  choice: Preservar “próximo” e “distante” sem restringi-los exclusivamente à geografia ou à intimidade afetiva.
  alternative: Explicitar “vizinho que mora perto” e “irmão que mora longe”.
  rationale: Os adjetivos hebraicos permitem que a máxima evoque tanto disponibilidade prática quanto localização. A formulação não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem proverbial “Melhor é...” conserva concisão e solenidade sem soar excessivamente arcaica.
