  text: Lambs are for your clothing[a], and goats are the price of a field.
translation:
  language: pt
  text: Os cordeiros servem para o seu vestuário, e os bodes são o preço de um campo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבָשִׂים
  choice: cordeiros
  rationale: O substantivo designa normalmente ovinos jovens. “Cordeiros” preserva sua especificidade e se ajusta à imagem da provisão de lã para roupa.
- source_word: לִלְבוּשֶׁךָ
  choice: fornecem roupa para você
  rationale: A construção com לְ expressa finalidade ou uso. A formulação explicita de modo natural em português a provisão implícita na frase nominal hebraica, sem acrescentar uma ideia estranha ao contexto.
- source_word: וּמְחִיר
  choice: e ... são o preço
  rationale: מְחִיר significa “preço” ou “pagamento”. O verbo “são” supre a cópula omitida em hebraico e mantém a ideia de que os animais equivalem ao preço de compra.
- source_word: שָׂדֶה
  choice: um campo
  rationale: É o sentido comum e direto de שָׂדֶה e corresponde à imagem econômica e rural do provérbio.
- source_word: עַתּוּדִים
  choice: bodes
  rationale: O termo se refere especificamente a caprinos machos. “Bodes” transmite essa precisão diretamente em português, sem necessidade de generalização ou nota lexical.
