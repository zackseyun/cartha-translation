base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/023.yaml
  text: Know well the condition of your flock[b][a]; set your heart on the herds.
translation:
  language: pt
  text: Conheça bem o estado do seu rebanho[a]; dedique atenção aos rebanhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “conheça, sim, a face do seu rebanho”; a expressão hebraica significa conhecer bem o estado dele.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ponha o seu coração nos rebanhos”. O termo final pode designar rebanhos ou manadas, isto é, grupos de animais de criação.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Conheça bem
  rationale: A construção com infinitivo absoluto intensifica o imperativo; “conheça bem” transmite essa ênfase com naturalidade em português.
- source_word: פְּנֵי
  choice: o estado de
  rationale: Embora signifique literalmente “a face de”, aqui a expressão se refere à condição observável do rebanho.
- source_word: צֹאנְךָ
  choice: seu rebanho
  rationale: צֹאן designa pequenos animais de criação, sobretudo ovelhas e cabras; “rebanho” é a forma portuguesa mais natural e suficientemente abrangente.
- source_word: שִׁית לִבְּךָ
  choice: dedique atenção
  rationale: Literalmente, “ponha o seu coração”; a formulação escolhida expressa o sentido de cuidado atento e intencional sem impor uma leitura estranha ao português atual.
- source_word: לַעֲדָרִים
  choice: aos seus animais
  rationale: O termo plural designa grupos de animais reunidos em rebanhos ou manadas. “Seus animais” evita uma distinção artificial entre espécies e torna clara a referência geral ao gado sob os cuidados do proprietário.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A primeira oração conserva a ênfase hebraica; a segunda comunica idiomaticamente a atenção cuidadosa indicada por “pôr o coração”.
