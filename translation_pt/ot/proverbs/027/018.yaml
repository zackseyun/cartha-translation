  text: נֹצֵ֣ר תְּ֭אֵנָה יֹאכַ֣ל פִּרְיָ֑/הּ וְ/שֹׁמֵ֖ר אֲדֹנָ֣י/ו יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/018.yaml
  text: Whoever tends a fig tree will eat its fruit[b][a], and he who watches over his master will be honored.
translation:
  language: pt
  text: Quem cuida de uma figueira[a] comerá do seu fruto, e quem zela por seu senhor[b] será honrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “guarda” ou “conserva uma figueira”; o hebraico ressalta o cuidado atento e fiel.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “guarda” ou “vigia seu senhor”; a expressão indica principalmente atenção e cuidado fiéis para com o superior, não apenas proteção física.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: cuida de
  rationale: O particípio pode significar guardar ou conservar; tendo uma figueira como objeto, “cuida de” comunica naturalmente a atenção contínua necessária para que ela produza fruto.
- source_word: תְּאֵנָה
  choice: figueira
  rationale: O substantivo designa a árvore, e não apenas o figo; “figueira” preserva a imagem agrícola concreta.
- source_word: יֹאכַל
  choice: comerá
  rationale: O imperfeito expressa o resultado geral e esperado em linguagem proverbial; o futuro em português transmite bem essa relação entre cuidado e resultado.
- source_word: פִּרְיָהּ
  choice: seu fruto
  rationale: O sufixo feminino singular retoma a figueira. “Seu fruto” é idiomático em português e mantém a referência clara no contexto.
- source_word: שֹׁמֵר
  choice: zela por
  rationale: O particípio significa guardar, vigiar ou observar. “Zela por” expressa atenção fiel ao superior sem limitar o sentido à proteção física nem ampliá-lo para uma paráfrase como “serve”.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: אדון significa senhor ou mestre. “Seu senhor” preserva a relação social expressa no hebraico e não impõe um referente divino.
- source_word: יְכֻבָּד
  choice: será honrado
  rationale: O Pual de כבד indica que a pessoa recebe honra; “será honrado” é direto e mantém a correspondência entre cuidado fiel e reconhecimento.
theological_decisions:
- issue: Referente de “seu senhor”
  choice: Manter “seu senhor” como referência ordinária ao superior humano no sentido imediato do provérbio
  alternative: Entender “Senhor” como referência direta a Deus
  rationale: O hebraico אֲדֹנָיו não contém marca que exija um referente divino, e o paralelismo com o cuidado de uma figueira favorece uma relação social comum. A formulação ainda permite uma aplicação teológica mais ampla sem inseri-la no texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Cuida de” e “zela por” preservam o paralelismo sem repetição artificial; “senhor” foi mantido em minúscula para não determinar indevidamente um referente divino.
