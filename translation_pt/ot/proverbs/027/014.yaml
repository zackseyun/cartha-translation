revisions:
- from: Quem abençoa o seu próximo[a] em voz alta, de manhã bem cedo[b], terá isso considerado uma maldição[c].
  to: Quem abençoa o seu próximo[a] em voz alta, de manhã bem cedo[b], isso lhe será considerado uma maldição[c].
  rationale: A revisão substitui uma construção portuguesa que tornava o autor da bênção o agente de «considerar» por uma passiva que corresponde ao nifal de חשב. «Lhe será considerado» mantém de forma concisa a relação expressa por לוֹ e preserva a ambiguidade textual quanto à pessoa para quem ou contra quem a bênção é reputada maldição.
