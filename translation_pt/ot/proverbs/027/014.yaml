  text: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
translation:
  language: pt
  text: Quem abençoa o seu próximo[a] em voz alta, de manhã bem cedo[b], isso lhe será considerado uma maldição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu amigo” ou “seu companheiro”.
    reason: lexical_alternative
  - marker: b
    text: 'O sentido é irônico: uma bênção ostensiva e barulhenta, dada de manhã bem cedo, é recebida como se fosse uma maldição.'
    reason: cultural_note
  - marker: c
    text: Ou “isso será considerado uma maldição para ele”. O hebraico não especifica quem faz essa avaliação.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבָרֵךְ
  choice: abençoa
  rationale: O particípio piel de ברך indica proferir uma bênção sobre alguém ou dirigir-lhe uma bênção. “Abençoa” preserva o sentido lexical e deixa que o contexto revele a ironia.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode designar próximo, amigo ou companheiro. “Próximo” mantém a referência interpessoal ampla, sem pressupor intimidade.
- source_word: בְּקוֹל גָּדוֹל
  choice: em voz alta
  rationale: Expressão idiomática que indica grande volume de voz. A formulação portuguesa é concreta, natural e evidencia o caráter incômodo da ação.
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  choice: de manhã bem cedo
  rationale: הַשְׁכֵּים reforça a ideia de levantar-se ou agir cedo. “Bem cedo” comunica essa ênfase de modo natural, sem tornar a frase pesada.
- source_word: קְלָלָה
  choice: uma maldição
  rationale: O substantivo significa claramente “maldição”. A tradução conserva o contraste irônico entre bênção e maldição.
- source_word: תֵּחָשֶׁב לוֹ
  choice: terá isso considerado uma maldição
  rationale: O nifal de חשב expressa ser considerado, reputado ou computado como algo. A construção preserva a ideia passiva, enquanto o pronome implícito em “terá” associa a avaliação ao agente sem eliminar por completo a tensão contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para fluência, colocando a circunstância temporal antes do resultado. “Bem cedo” traduz de modo idiomático a ênfase de הַשְׁכֵּים. A nota final conserva a possível ambiguidade do pronome hebraico לוֹ.
