  text: גָּלָ֣ה חָ֭צִיר וְ/נִרְאָה דֶ֑שֶׁא וְ֝/נֶאֶסְפ֗וּ עִשְּׂב֥וֹת הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/025.yaml
  text: The hay is removed[a], and the new growth appears[c][b], and the grasses of the mountains are gathered.
translation:
  language: pt
  text: O capim é retirado[a], a vegetação nova aparece[b], e as ervas dos montes são recolhidas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O capim desaparece” ou “O capim fica descoberto”. O verbo hebraico pode indicar que algo é descoberto ou removido; neste contexto, o capim provavelmente foi cortado ou já não está ali.
    reason: lexical_alternative
  - marker: b
    text: Ou “a relva tenra” ou “o capim fresco”.
    reason: lexical_alternative
  - marker: c
    text: Ou “as plantas dos montes são recolhidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלָה
  choice: é retirado
  rationale: O verbo expressa a ideia de ser descoberto, removido ou desaparecer. No contexto agrícola, “é retirado” comunica o resultado do corte e da coleta sem especificar além do hebraico.
- source_word: חָצִיר
  choice: capim
  rationale: O termo designa erva ou capim que pode servir de forragem. “Capim” é claro no português moderno e evita sugerir que o produto já esteja seco, como poderia ocorrer com “feno”.
- source_word: נִרְאָה
  choice: aparece
  rationale: O nifal significa “ser visto” ou “aparecer”; “aparece” descreve naturalmente a vegetação que se torna visível.
- source_word: דֶשֶׁא
  choice: vegetação nova
  rationale: O substantivo indica vegetação verde e tenra. “Vegetação nova” preserva a noção de crescimento fresco e evita repetição excessiva de “capim”.
- source_word: נֶאֶסְפוּ
  choice: são recolhidas
  rationale: A forma passiva significa literalmente que as plantas são reunidas ou recolhidas. A tradução mantém a voz passiva e não restringe o ato ao sentido técnico de colheita.
- source_word: עִשְּׂבוֹת
  choice: ervas
  rationale: O termo abrange ervas e outras plantas rasteiras. “Ervas” conserva essa amplitude, enquanto o contexto deixa claro que se trata de vegetação do campo.
- source_word: הָרִים
  choice: montes
  rationale: O plural pode designar montanhas, montes ou região montanhosa. “Montes” corresponde à paisagem pastoril sem excluir elevações maiores.
theological_decisions: []
