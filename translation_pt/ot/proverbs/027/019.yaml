base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/019.yaml
  text: As in water face reflects face[b][a], so the heart of man reflects man.
translation:
  language: pt
  text: Assim como a água reflete um rosto,[a] o coração de uma pessoa reflete a própria pessoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Como a água, o rosto para o rosto”. O verbo “reflete” está implícito na comparação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “assim o coração do ser humano corresponde ao ser humano”. O hebraico diz literalmente: “assim o coração do ser humano para o ser humano”, permitindo mais de uma compreensão da relação.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּמַּיִם
  choice: Assim como na água
  rationale: O prefixo כַּ introduz a comparação. A expressão “na água” explicita de modo natural, em português, o meio em que o rosto é visto, sem alterar a imagem do hebraico.
- source_word: הַפָּנִים לַפָּנִים
  choice: um rosto reflete outro rosto
  rationale: O hebraico é elíptico, literalmente “o rosto para o rosto”. No contexto da água, “reflete” torna inteligível a correspondência visual implícita; “um... outro” evita a formulação portuguesa pouco natural “o rosto para o rosto”.
- source_word: כֵּן
  choice: o coração...
  rationale: A correlação de כֵּן com כַּ é expressa pela construção portuguesa “Assim como..., ...”, na qual não é necessário acrescentar “assim” na segunda oração.
- source_word: לֵב
  choice: o coração
  rationale: Mantém a metáfora sapiencial tradicional e abrangente do centro interior da pessoa, incluindo pensamento, caráter e disposição.
- source_word: הָאָדָם ... לָאָדָם
  choice: de uma pessoa ... a própria pessoa
  rationale: אָדָם tem aqui valor humano genérico. “Pessoa” comunica esse sentido naturalmente no português atual; “a própria pessoa” expressa a provável relação reflexiva entre o coração e aquele a quem ele pertence, sem limitar o provérbio ao sexo masculino.
theological_decisions:
- issue: Sentido genérico e relação entre as duas ocorrências de אָדָם
  choice: uma pessoa ... a própria pessoa
  alternative: o ser humano ... o ser humano; ou, mais literalmente, o homem ... ao homem
  rationale: O substantivo אָדָם pode designar genericamente o ser humano. A formulação escolhida preserva o singular representativo e comunica a leitura de que o coração revela ou espelha a pessoa. Como a sintaxe hebraica é elíptica e admite uma correspondência mais aberta, a literalidade e a alternativa são registradas em nota.
- issue: Verbo implícito nas duas metades do provérbio
  choice: reflete
  alternative: corresponde a
  rationale: O texto hebraico não apresenta verbo expresso. “Reflete” decorre naturalmente da imagem do rosto visto na água e produz o paralelismo esperado, mas a nota conserva a forma literal e sua ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “rosto” e “pessoa” preserva o paralelismo conciso do provérbio; as notas registram a elipse e a ambiguidade do hebraico.
