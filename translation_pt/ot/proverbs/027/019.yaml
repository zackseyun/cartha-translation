  source_fidelity: A tradução capta adequadamente o paralelismo comparativo e a elipse verbal do hebraico. Contudo, “na água um rosto reflete outro rosto” faz gramaticalmente de “um rosto” o agente que reflete, enquanto a imagem hebraica é a do rosto refletido na água. A revisão torna a água o elemento que reflete, sem eliminar a concisão proverbial nem a ambiguidade registrada em nota.
  naturalness: 'A formulação revista é mais idiomática e imediatamente inteligível em português moderno: “a água reflete um rosto”. “O coração de uma pessoa reflete a própria pessoa” preserva o paralelismo e comunica naturalmente a ideia de que o interior revela quem alguém é.'
  terminology: “Coração” é a equivalência tradicional e adequada para לֵב no registro sapiencial. “Uma pessoa” comunica de modo natural o uso genérico singular de אָדָם, sem introduzir uma restrição sexual ausente da função genérica do provérbio. A nota mantém a construção literal e a possibilidade mais aberta de “corresponde”.
  issues:
