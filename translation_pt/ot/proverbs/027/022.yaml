  yaml_path: translation/ot/proverbs/027/022.yaml
  text: Even if you grind a fool in a mortar with a pestle among crushed grain[a], his foolishness will not depart from him.
translation:
  language: pt
  text: Mesmo que você triture o insensato num pilão, com uma mão de pilão, entre grãos triturados[a], sua insensatez não se afastará dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grãos socados” ou “cereal triturado”. O sentido exato do raro termo hebraico é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְתּוֹשׁ
  choice: triture
  rationale: O verbo descreve o ato de socar ou esmagar algo num pilão. “Triture” preserva a força da imagem e é amplamente compreensível.
- source_word: אֱוִיל
  choice: insensato
  rationale: Em Provérbios, designa uma pessoa moral e intelectualmente obstinada, não apenas alguém com pouca inteligência. “Insensato” mantém esse sentido sapiencial.
- source_word: מַּכְתֵּשׁ
  choice: pilão
  rationale: Refere-se ao recipiente usado para socar grãos ou especiarias. “Pilão” é corrente e concreto em português.
- source_word: רִיפוֹת
  choice: grãos triturados
  rationale: O termo raro parece indicar grãos ou cereal socado. A tradução mantém a imagem culinária sem especificar indevidamente o tipo de cereal ou preparo.
- source_word: עֱלִי
  choice: mão de pilão
  rationale: É o instrumento usado para socar dentro do pilão; “mão de pilão” distingue a peça móvel do recipiente.
- source_word: תָסוּר מֵעָלָיו
  choice: não se afastará dele
  rationale: A expressão indica que algo não é removido nem deixa a pessoa. A formulação conserva a personificação proverbial da insensatez.
- source_word: אִוַּלְתּוֹ
  choice: a insensatez dele
  rationale: O substantivo abstrato nomeia a insensatez arraigada do insensato. A formulação é clara e mantém a relação lexical com “insensato”.
- source_word: אִם
  choice: Mesmo que
  rationale: 'A partícula introduz aqui uma hipótese concessiva: nem uma ação tão extrema alcançaria o resultado desejado.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira. O tratamento genérico “você” reproduz de modo natural a segunda pessoa do hebraico. A repetição “pilão / mão de pilão” é mantida para identificar com precisão o recipiente e o instrumento.
