  text: עָר֤וּם רָאָ֣ה רָעָ֣ה נִסְתָּ֑ר פְּ֝תָאיִ֗ם עָבְר֥וּ נֶעֱנָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/012.yaml
  text: A prudent man sees danger and hides himself[a], but the simple pass on and suffer for it.
translation:
  language: pt
  text: O prudente vê o perigo e se esconde, mas os inexperientes seguem em frente e sofrem as consequências[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são castigados”. O hebraico pode indicar sofrer uma penalidade ou arcar com as consequências.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: o prudente
  rationale: Em Provérbios, o termo tem sentido positivo de sensatez e cautela prática. O singular masculino representativo do hebraico é preservado de modo natural em português.
- source_word: רָאָה
  choice: vê
  rationale: O perfeito hebraico tem aqui valor proverbial e geral; o presente expressa adequadamente uma conduta característica.
- source_word: רָעָה
  choice: o perigo
  rationale: Embora o substantivo possa significar mal, calamidade ou dano, neste contexto designa uma ameaça previsível da qual alguém pode se proteger.
- source_word: נִסְתָּר
  choice: se esconde
  rationale: O nifal indica que a pessoa se retira ou se oculta diante do perigo; a formulação preserva o sentido reflexivo e é clara em português corrente.
- source_word: פְּתָאיִם
  choice: os inexperientes
  rationale: O termo sapiencial descreve pessoas sem discernimento ou experiência. “Inexperientes” evita tanto a possível conotação intelectual de “simples” quanto o tom excessivamente pejorativo de outras opções.
- source_word: עָבְרוּ
  choice: seguem em frente
  rationale: 'O verbo contrasta com a cautela do prudente: os inexperientes continuam seu caminho sem tomar precauções.'
- source_word: נֶעֱנָשׁוּ
  choice: sofrem as consequências
  rationale: O nifal de ענשׁ pode indicar sofrer uma penalidade ou arcar com consequências. A escolha mantém a amplitude do hebraico sem impor um cenário judicial formal.
theological_decisions:
- issue: Natureza do resultado sofrido pelos inexperientes
  choice: sofrem as consequências
  alternative: são castigados
  rationale: O hebraico admite tanto a ideia de penalidade quanto a de sofrer as consequências. O texto principal mantém essa abertura, e a alternativa mais explicitamente punitiva é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. “O prudente” preserva o contraste singular/plural do hebraico; “os inexperientes” comunica o termo sapiencial sem recorrer a linguagem pejorativa. O marcador foi colocado junto à expressão lexical a que a nota se refere.
