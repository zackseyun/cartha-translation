- from: Quem tenta contê-la tenta conter o vento, e com a mão direita tenta segurar óleo.[a]
  to: Quem procura contê-la é como quem procura conter o vento ou segurar óleo com a mão direita.[a]
  rationale: A revisão preserva o referente feminino implícito e o paralelismo com o vento, mas usa uma comparação natural em português para expressar a força proverbial da imagem. Na segunda imagem, “segurar óleo com a mão direita” mantém a interpretação contextual adotada no percurso de auditoria inglês, enquanto a nota registra de modo mais fiel a dificuldade do verbo hebraico e evita uma alternativa não claramente atestada pela sintaxe do texto recebido.
