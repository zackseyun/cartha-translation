base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/016.yaml
  text: Whoever restrains her restrains the wind[a], and his right hand grasps oil.
translation:
  language: pt
  text: Quem procura contê-la é como quem procura conter o vento ou segurar óleo com a mão direita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da última oração é difícil. Mais literalmente: “e sua mão direita chama o óleo”; o sentido exato de “chama” nesta construção é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפְנֶיהָ
  choice: Quem tenta contê-la
  rationale: O particípio com sufixo feminino retoma a mulher briguenta do versículo anterior. Embora צפן normalmente signifique “esconder” ou “guardar”, aqui o paralelismo favorece a ideia contextual de tentar contê-la ou mantê-la sob controle.
- source_word: צָפַן
  choice: tenta conter
  rationale: A repetição de “conter” preserva o jogo verbal hebraico e apresenta o vento como algo impossível de controlar; “tenta” explicita naturalmente o caráter frustrado da ação no provérbio.
- source_word: רוּחַ
  choice: o vento
  rationale: Neste quadro concreto, רוּחַ designa o vento, algo que não pode ser contido, e não o espírito.
- source_word: וְשֶׁמֶן
  choice: óleo
  rationale: “Óleo” é o equivalente direto e mantém a imagem sem acrescentar “de oliva”, detalhe culturalmente provável, mas não expresso no texto.
- source_word: יְמִינוֹ
  choice: com a mão direita
  rationale: A expressão conserva a imagem corporal explícita do hebraico e foi integrada de modo idiomático à oração portuguesa.
- source_word: יִקְרָא
  choice: tenta segurar
  rationale: 'קרא normalmente significa “chamar”, o que torna a cláusula hebraica muito difícil. A tradução principal expressa a interpretação contextual tradicional: conter essa mulher é tão inviável quanto segurar óleo na mão. A leitura mais literal é preservada em nota.'
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com repetição deliberada de “conter” para refletir o paralelismo hebraico. A formulação “tenta segurar óleo” comunica a imagem proverbial sem ocultar, graças à nota, a incerteza textual e lexical da última oração.
