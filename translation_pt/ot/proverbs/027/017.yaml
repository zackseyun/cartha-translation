base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/017.yaml
  text: Iron sharpens iron[a], and a man sharpens the face of his friend.
translation:
  language: pt
  text: O ferro afia o ferro[a], e o homem afia o rosto de seu amigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O ferro afia o ferro, e uma pessoa afia a outra.” O hebraico diz literalmente “afia o rosto de seu amigo”, expressão que pode se referir a aprimorar ou aguçar outra pessoa.'
    reason: alternativa lexical e esclarecimento do idioma hebraico
lexical_decisions:
- source_word: בַּרְזֶל בְּבַרְזֶל
  choice: O ferro afia o ferro
  rationale: בַּרְזֶל significa claramente “ferro”; a preposição בְּ indica meio ou instrumento. A formulação portuguesa conserva a repetição compacta e o sentido recíproco do provérbio.
- source_word: יָחַד / יַחַד
  choice: afia
  rationale: Neste contexto, a forma causativa do verbo significa tornar afiado ou aguçar. A repetição de “afia” nos dois membros preserva o paralelismo hebraico.
- source_word: וְאִישׁ
  choice: e o homem
  rationale: אִישׁ é masculino singular e aqui tem valor proverbial representativo. “O homem” mantém a forma do hebraico sem limitar necessariamente a aplicação do princípio.
- source_word: פְּנֵי
  choice: o rosto de
  rationale: A expressão significa literalmente “o rosto de”. A tradução mantém a imagem concreta e sua possível dimensão idiomática, sem decidir silenciosamente se se refere ao caráter, à disposição ou à pessoa como um todo.
- source_word: רֵעֵהוּ
  choice: seu amigo
  rationale: רֵעַ pode designar amigo, companheiro ou próximo. “Amigo” é natural no contexto interpessoal e corresponde bem ao sufixo possessivo masculino.
theological_decisions:
- issue: Linguagem masculina representativa na literatura sapiencial
  choice: o homem
  alternative: uma pessoa
  rationale: O texto emprega אִישׁ, masculino singular, em uma máxima de aplicação geral. A tradução conserva o gênero gramatical e a forma proverbial sem afirmar que o princípio se aplique somente a homens.
- issue: Sentido da expressão “afia o rosto”
  choice: preservar a expressão concreta do hebraico
  alternative: uma pessoa afia a outra
  rationale: A imagem pode indicar que alguém aprimora, estimula ou torna mais perspicaz o amigo, mas o hebraico mantém “rosto”. Preservar essa tensão evita fixar uma única interpretação da metáfora.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A estrutura breve e paralela do provérbio foi preservada; a nota explica a expressão hebraica incomum sem eliminar sua ambiguidade.
