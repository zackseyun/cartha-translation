base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/011.yaml
  text: Be wise[a], my son, and make my heart glad[b], that I may answer the one who reproaches me.
translation:
  language: pt
  text: Seja sábio[a], meu filho, e alegre o meu coração, para que eu possa responder[b] a quem me afronta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Torne-se sábio, meu filho”. O imperativo hebraico pode ressaltar tanto a condição de ser sábio quanto a busca da sabedoria.'
    reason: lexical_alternative
  - marker: b
    text: 'Em hebraico, literalmente: “devolver uma palavra a quem me afronta”, isto é, responder-lhe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם
  choice: Seja sábio
  rationale: O imperativo masculino singular de חכם exorta o filho a possuir e demonstrar sabedoria. “Seja sábio” é natural, conciso e não restringe o sentido apenas ao comportamento nem enfatiza excessivamente o processo de tornar-se sábio.
- source_word: בְּנִי
  choice: meu filho
  rationale: בן com sufixo de primeira pessoa do singular significa literalmente “meu filho”. A forma masculina é preservada, como no texto hebraico e no contexto de instrução sapiencial.
- source_word: וְשַׂמַּח לִבִּי
  choice: e alegre o meu coração
  rationale: O imperativo no hifil de שמח tem sentido causativo. “Alegre o meu coração” preserva tanto essa força quanto a imagem concreta do hebraico, em linguagem portuguesa digna e compreensível.
- source_word: וְאָשִׁיבָה ... דָבָר
  choice: para que eu possa responder
  rationale: A forma cohortativa de שוב integra a expressão idiomática “devolver uma palavra”, isto é, dar uma resposta. A construção final “para que eu possa” expressa naturalmente a relação de propósito ou resultado com a sabedoria do filho.
- source_word: חֹרְפִי
  choice: a quem me afronta
  rationale: O particípio ativo de חרף com sufixo de primeira pessoa indica aquele que censura, provoca ou afronta o sábio. “Quem me afronta” mantém a força pessoal e contínua sem usar uma expressão artificial.
