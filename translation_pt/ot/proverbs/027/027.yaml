  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém o paralelismo da provisão destinada ao indivíduo, aos de sua casa e às servas, enquanto notas preservam os sentidos literais e as ambiguidades lexicais do hebraico.
