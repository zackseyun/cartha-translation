  text: וְ/דֵ֤י חֲלֵ֬ב עִזִּ֗ים לְֽ֭/לַחְמְ/ךָ לְ/לֶ֣חֶם בֵּיתֶ֑/ךָ וְ֝/חַיִּ֗ים לְ/נַעֲרוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/027.yaml
  text: And there will be enough goats' milk for your food[a], for the food of your household[b], and sustenance for your servant girls.
translation:
  language: pt
  text: Haverá leite de cabra suficiente para o seu alimento[a], para o alimento dos de sua casa e para o sustento[b] de suas servas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pão”, aqui usado no sentido mais amplo de alimento ou provisão; o mesmo termo aparece nas duas ocorrências de “alimento” neste versículo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “vida” ou “vidas”, no sentido daquilo que mantém a vida.'
    reason: lexical_alternative
  - marker: c
    text: Ou “suas jovens”. O termo hebraico pode designar moças, jovens ou servas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֵי
  choice: Haverá ... suficiente
  rationale: דַּי expressa suficiência. A construção existencial com “haverá” é natural em português e explicita o sentido implícito no hebraico.
- source_word: חֲלֵב עִזִּים
  choice: leite de cabra
  rationale: Tradução direta e corrente de “leite de cabras”; o singular genérico é a forma idiomática em português.
- source_word: לְלַחְמְךָ
  choice: para o seu alimento
  rationale: Embora לֶחֶם signifique literalmente “pão”, também designa alimento ou provisão em sentido amplo. Neste contexto, o leite é parte da alimentação.
- source_word: לְלֶחֶם בֵּיתֶךָ
  choice: para o alimento dos de sua casa
  rationale: בַּיִת refere-se aqui às pessoas da casa, não apenas ao edifício. “Os de sua casa” preserva a imagem doméstica e abrange a família ou o grupo familiar.
- source_word: וְחַיִּים
  choice: e para o sustento
  rationale: חַיִּים significa literalmente “vida”, mas aqui indica aquilo que mantém a vida. “Sustento” comunica esse valor concreto sem apagar a leitura literal, registrada em nota.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: de suas servas
  rationale: נַעֲרָה pode significar jovem, moça ou serva. No contexto da provisão de uma casa, “servas” é provável, enquanto a alternativa lexical é preservada em nota.
