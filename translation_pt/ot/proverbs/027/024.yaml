  text: כִּ֤י לֹ֣א לְ/עוֹלָ֣ם חֹ֑סֶן וְ/אִם נֵ֝֗זֶר לְ/ד֣וֹר דור־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/024.yaml
  text: For wealth does not last forever[b][a], nor a crown from generation to generation.
translation:
  language: pt
  text: Pois a riqueza[a] não dura para sempre, nem a coroa[b] dura de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bens” ou “recursos”; o termo hebraico pode indicar riqueza, recursos materiais ou força, mas o contexto favorece o sentido material.
    reason: lexical_alternative
  - marker: b
    text: Ou “diadema”; o termo hebraico também pode significar “consagração”, mas aqui provavelmente designa uma coroa como símbolo de posição ou governo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a exortação do contexto; “pois” expressa naturalmente essa força explicativa.
- source_word: חֹסֶן
  choice: riqueza
  rationale: No contexto de prudência agrícola e provisão material (Pv 27.23–27), refere-se mais naturalmente a recursos ou bens materiais do que à força abstrata.
- source_word: לֹא לְעוֹלָם
  choice: não dura para sempre
  rationale: Explicita em português corrente a ideia de que a riqueza não permanece indefinidamente, sem alterar o sentido do hebraico.
- source_word: וְאִם
  choice: nem
  rationale: Após a negação inicial, a expressão introduz de modo elíptico uma segunda afirmação negada; “nem” reproduz essa correlação em português natural.
- source_word: נֵזֶר
  choice: coroa
  rationale: Preserva a imagem concreta de posição régia, autoridade ou destaque e se ajusta ao paralelismo com a riqueza, sem impor o sentido cultual possível de “consagração”.
- source_word: לְדוֹר דּוֹר
  choice: de geração em geração
  rationale: Expressa a sucessão contínua das gerações em formulação idiomática e digna em português.
theological_decisions:
- issue: Sentido de נֵזֶר no paralelismo proverbial
  choice: coroa, como símbolo de poder, posição ou proeminência
  alternative: diadema; consagração
  rationale: O provérbio contrapõe realidades que podem parecer permanentes — riqueza e posição elevada — mas cuja continuidade não é garantida. “Coroa” mantém a imagem concreta e a ambiguidade quanto ao tipo exato de autoridade, sem transformar o termo em uma referência exclusivamente cultual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom conciso e proverbial. “Não dura para sempre” comunica com clareza a não permanência indicada pelo hebraico, e “de geração em geração” conserva a expressão tradicional sem soar arcaica.
