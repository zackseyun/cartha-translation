  text: ט֭וֹבָה תּוֹכַ֣חַת מְגֻלָּ֑ה מֵֽ/אַהֲבָ֥ה מְסֻתָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/005.yaml
  text: Open rebuke is better than hidden love[a].
translation:
  language: pt
  text: Melhor é a repreensão aberta do que o amor oculto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor escondido”. O hebraico pode se referir a um amor que não é demonstrado, e não à ausência de amor.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה
  choice: Melhor
  rationale: Com מִן em uma construção comparativa, o adjetivo tem naturalmente o sentido de “melhor”, não apenas “boa”.
- source_word: תּוֹכַחַת
  choice: repreensão
  rationale: O substantivo indica censura ou correção verbal; “repreensão” preserva sua força e é corrente em português.
- source_word: מְגֻלָּה
  choice: franca
  rationale: O particípio significa literalmente “descoberta, revelada”. “Franca” comunica uma repreensão feita às claras, sem restringir indevidamente o sentido a uma censura pública.
- source_word: מִן
  choice: do que
  rationale: A preposição marca aqui a comparação introduzida por “melhor”.
- source_word: אַהֲבָה
  choice: amor
  rationale: É o equivalente direto e natural do substantivo hebraico, sem enfraquecê-lo para “afeição”.
- source_word: מְסֻתָּרֶת
  choice: oculto
  rationale: O particípio significa “escondido, oculto”. A escolha preserva a ambiguidade entre um amor mantido em segredo e um amor que existe, mas não é demonstrado.
theological_decisions: []
translation_notes:
  register: Português moderno, conciso e digno, com ampla legibilidade brasileira. “Repreensão franca” soa natural e mantém a oposição entre correção manifestada e amor não manifestado; a nota conserva a ambiguidade do hebraico.
