source:
  edition: WLC
  text: אַֽל תִּ֭תְהַלֵּל בְּ/י֣וֹם מָחָ֑ר כִּ֤י לֹא תֵ֝דַ֗ע מַה יֵּ֥לֶד יֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/001.yaml
  text: Do not boast about tomorrow[a], for you do not know what a day may bring.
translation:
  language: pt
  text: Não se gabe do amanhã,[a] pois você não sabe o que um dia pode trazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o que um dia dará à luz”, isto é, produzirá ou trará.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלֵּל
  choice: se gabe
  rationale: O hitpael de הלל tem aqui sentido reflexivo de exaltação de si mesmo. “Gabar-se” expressa isso de modo natural e direto em português.
- source_word: בְּיוֹם מָחָר
  choice: do dia de amanhã
  rationale: Embora a expressão seja literalmente “no dia de amanhã”, a preposição introduz aquilo de que alguém se gaba. “Do dia de amanhã” é idiomático e mantém a referência explícita ao dia futuro.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição e preserva o estilo conciso do provérbio.
- source_word: תֵדַע
  choice: você não sabe
  rationale: O verbo ידע afirma falta de conhecimento, sem acrescentar a ideia abstrata de incapacidade.
- source_word: מַה יֵּלֶד יוֹם
  choice: o que um dia dará à luz
  rationale: Preserva a metáfora hebraica de ילד, “dar à luz, gerar”, e a força do aspecto ainda desconhecido do que o dia produzirá.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com tratamento por “você” para ampla legibilidade brasileira. A metáfora final do hebraico foi mantida no texto, em vez de ser substituída pela formulação mais idiomática “o que um dia poderá trazer”.
