  text: A stone is heavy[a], and sand is weighty, but a fool’s anger is heavier than both of them.
translation:
  language: pt
  text: A pedra é pesada[a], e a areia pesa, mas a ira do insensato é mais pesada que ambas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O peso de uma pedra e a carga de areia são coisas pesadas, mas a irritação do insensato é mais pesada que ambos». O hebraico emprega termos estreitamente relacionados ao peso na primeira e na terceira partes do provérbio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּבֶד
  choice: é pesada
  rationale: O substantivo hebraico expressa peso ou caráter pesado. A forma predicativa é natural em português e mantém o campo semântico retomado pelo verbo «pesa» no final.
- source_word: אֶבֶן
  choice: pedra
  rationale: É o equivalente comum e concreto, adequado à imagem proverbial.
- source_word: נֵטֶל
  choice: é um fardo
  rationale: O termo indica carga ou peso que se carrega. «Fardo» preserva essa nuance e forma um paralelismo natural com «é pesada».
- source_word: הַחוֹל
  choice: a areia
  rationale: Mantém o artigo hebraico e apresenta a areia como massa pesada, não como grãos individuais.
- source_word: כַעַס
  choice: ira
  rationale: No contexto, indica a reação colérica ou exasperada ligada ao insensato. «Ira» conserva a força do termo sem deslocar a ação para quem o provoca.
- source_word: אֱוִיל
  choice: do insensato
  rationale: Expressa a relação genitiva de modo natural e conserva o caráter genérico da máxima.
- source_word: כָּבֵד
  choice: pesa mais
  rationale: Com a preposição comparativa מִן, o adjetivo tem sentido comparativo. A formulação verbal em português retoma de modo claro a imagem concreta do peso.
- source_word: מִשְּׁנֵיהֶם
  choice: que as duas juntas
  rationale: Refere-se conjuntamente à pedra e à areia; «as duas juntas» deixa explícita a comparação com ambas.
