  text: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
translation:
  language: pt
  text: Tome a roupa dele, pois ele ficou por fiador de um estranho[a]; e, por uma mulher estrangeira,[b] tome-o como penhor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Estranho” indica aqui alguém de fora do círculo de relações e responsabilidades da pessoa; não significa necessariamente alguém de outra nação.
    reason: lexical_alternative
  - marker: b
    text: “Mulher estrangeira” também pode indicar, em Provérbios, uma mulher social ou moralmente alheia, não apenas uma mulher de outra nacionalidade.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico da segunda parte é conciso e diz mais literalmente: “e, por uma mulher estrangeira, tome-o como penhor”. O pronome é masculino e pode referir-se ao fiador; a construção também pode evocar a tomada ou retenção da roupa mencionada na primeira parte como garantia.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: קַח
  choice: Tome
  rationale: Imperativo direto de לקח. “Tome” é natural em português e mantém a força da ordem.
- source_word: בִּגְדוֹ
  choice: a roupa dele
  rationale: בגד designa uma peça de roupa ou vestimenta, frequentemente usada como garantia. “A roupa dele” é clara e acessível, sem restringir indevidamente o termo a um tipo específico de manto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem e preserva o estilo conciso do provérbio.
- source_word: עָרַב
  choice: ficou por fiador
  rationale: O verbo descreve assumir responsabilidade pela dívida ou obrigação de outra pessoa. “Ficar por fiador” comunica com precisão esse sentido jurídico-financeiro em português corrente.
- source_word: זָר
  choice: um estranho
  rationale: Aqui indica alguém de fora do círculo familiar ou social responsável, não necessariamente um estrangeiro étnico. “Estranho” conserva essa amplitude.
- source_word: וּבְעַד
  choice: e, se ele se comprometeu por
  rationale: בעד indica agir em favor de alguém. A formulação explicita em português a relação paralela com a fiança da primeira linha; o valor condicional contextual é sinalizado em nota por não estar expresso de modo inequívoco no hebraico.
- source_word: נָכְרִיָּה
  choice: uma mulher estrangeira
  rationale: נכריה pode designar literalmente uma mulher de fora e, em Provérbios, também uma mulher social ou moralmente alheia. A tradução ampla evita reduzi-la interpretativamente a “adúltera”.
- source_word: חַבְלֵהוּ
  choice: retenha-a como penhor
  rationale: חבל, neste contexto, refere-se a tomar ou conservar uma garantia. Embora o sufixo hebraico seja masculino singular (“dele/o”), a tradução retoma naturalmente “a roupa” como o bem dado em garantia; a construção literal e sua concisão são registradas em nota.
