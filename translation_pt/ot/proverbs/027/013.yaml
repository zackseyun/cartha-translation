  naturalness: «Ficou por fiador» é claro e idiomático em registro proverbial. «Tome-o como penhor» é compreensível e conserva a concisão e a estranheza deliberada da imagem de garantia; a nota esclarece a possível relação com a roupa da primeira linha.
  terminology: «Estranho» para זָר e «mulher estrangeira» para נָכְרִיָּה preservam a amplitude dos termos sem impor leituras étnicas ou morais mais restritas. «Penhor» e «fiador» mantêm com precisão o campo jurídico-econômico.
