base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/008.yaml
  text: Like a bird that wanders from its nest[a], so is a man who wanders from his place.
translation:
  language: pt
  text: 'Como a ave que se afasta do seu ninho,

    assim é o homem que se afasta do seu lugar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a pessoa que se afasta de sua casa”. O hebraico diz “do seu lugar”, expressão mais ampla, que também pode indicar seu lugar próprio ou sua posição, e não apenas uma residência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִפּוֹר
  choice: Como a ave
  rationale: צִפּוֹר é um termo geral para ave, sem indicar necessariamente uma espécie específica. “Ave” mantém a amplitude lexical e um registro proverbial digno.
- source_word: נוֹדֶדֶת / נוֹדֵד
  choice: que vagueia
  rationale: As duas formas participiais derivam de נוד e expressam movimento errante ou sem fixidez. Repetir “vagueia” preserva o paralelismo lexical entre a ave e o homem.
- source_word: מִן קִנָּהּ
  choice: longe do seu ninho
  rationale: קֵן significa “ninho”; a preposição מן marca afastamento. “Longe de” torna natural em português a ideia de estar afastado do ninho.
- source_word: כֵּן
  choice: assim é
  rationale: כֵּן introduz a correspondência entre a imagem inicial e sua aplicação humana, preservada naturalmente por “assim é”.
- source_word: אִישׁ
  choice: o homem
  rationale: O hebraico emprega um substantivo masculino singular representativo. “O homem” preserva essa forma sem restringi-la explicitamente a uma leitura exclusivamente masculina.
- source_word: מִמְּקוֹמוֹ
  choice: longe do seu lugar
  rationale: מָקוֹם tem o sentido amplo de “lugar”. A escolha mantém aberta a referência à morada, ao lugar habitual ou ao lugar que cabe à pessoa, sem reduzi-la a “casa”.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: o homem
  alternative: a pessoa
  rationale: A tradução conserva o masculino singular do hebraico e sua função representativa, sem introduzir uma formulação neutra ausente da forma do texto-fonte.
- issue: Amplitude de מָקוֹם
  choice: seu lugar
  alternative: sua casa
  rationale: “Lugar” preserva a ambiguidade do original, que pode envolver morada, localização habitual ou posição apropriada; “casa” resolveria indevidamente essa tensão.
translation_notes:
  register: Português moderno, claro e proverbial, com boa legibilidade brasileira. A repetição de “vagueia” reproduz deliberadamente a repetição da raiz hebraica; “ave” evita especificar uma espécie, e “seu lugar” conserva a amplitude semântica do original.
