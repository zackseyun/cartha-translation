  text: יְהַלֶּלְ/ךָ֣ זָ֣ר וְ/לֹא פִ֑י/ךָ נָ֝כְרִ֗י וְ/אַל שְׂפָתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/002.yaml
  text: Let another praise you[a], and not your own mouth; a stranger[b], and not your own lips.
translation:
  language: pt
  text: Que outro elogie você, e não sua própria boca; um estranho, e não seus próprios lábios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהַלֶּלְךָ
  choice: Que ... elogie você
  rationale: O imperfeito com valor volitivo expressa uma exortação. “Que ... elogie você” reproduz isso naturalmente, e “elogiar” comunica com clareza o sentido de הלל neste contexto.
- source_word: זָר
  choice: outro
  rationale: Aqui, זָר designa alguém distinto da própria pessoa. “Outro” destaca o contraste central entre o elogio vindo de alguém mais e o autoelogio, sem introduzir desnecessariamente uma ideia étnica.
- source_word: פִּיךָ
  choice: a sua própria boca
  rationale: Literalmente, “sua boca”. “Própria” explicita de modo natural o contraste reflexivo do provérbio.
- source_word: נָכְרִי
  choice: um desconhecido
  rationale: נָכְרִי pode indicar alguém estranho, alheio ou não conhecido. “Desconhecido” preserva a distinção lexical em relação a זָר e evita que “estrangeiro” sugira principalmente nacionalidade.
- source_word: שְׂפָתֶיךָ
  choice: os seus próprios lábios
  rationale: A expressão é literalmente “seus lábios”. “Próprios” mantém o paralelismo com “sua própria boca” e torna explícita a oposição ao autoelogio.
- source_word: וְלֹא ... וְאַל
  choice: e não ... e não
  rationale: Embora as partículas negativas sejam diferentes, ambas negam o autoelogio em membros paralelos. A repetição “e não” conserva o equilíbrio poético e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A estrutura paralela boca/lábios foi preservada; “outro” e “desconhecido” mantêm a variação dos dois termos hebraicos sem enfatizar indevidamente estrangeiridade étnica.
