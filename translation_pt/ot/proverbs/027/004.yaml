  text: אַכְזְרִיּ֣וּת חֵ֭מָה וְ/שֶׁ֣טֶף אָ֑ף וּ/מִ֥י יַ֝עֲמֹד לִ/פְנֵ֥י קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/004.yaml
  text: Wrath is cruel[a], and anger is a flood, but who can stand before jealousy?
translation:
  language: pt
  text: O furor é cruel, e a ira é uma inundação; mas quem pode resistir diante do ciúme?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inveja” em vez de “ciúme” (hebraico קִנְאָה); conforme o contexto, o termo pode ter qualquer um desses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזְרִיּוּת
  choice: é cruel
  rationale: O substantivo denota crueldade ou dureza. Nesta oração nominal, a formulação predicativa é natural em português e preserva o sentido.
- source_word: חֵמָה
  choice: furor
  rationale: O termo expressa ira ardente ou fúria. “Furor” mantém a intensidade e permite distingui-lo de אָף no membro paralelo.
- source_word: שֶׁטֶף
  choice: uma inundação
  rationale: O substantivo designa literalmente uma enchente ou torrente transbordante. “Inundação” conserva a metáfora vívida e a concisão proverbial.
- source_word: אָף
  choice: ira
  rationale: Embora literalmente relacionado ao “nariz”, aqui o sentido idiomático é ira. A escolha é clara e mantém distinção lexical em relação a חֵמָה.
- source_word: וּמִי
  choice: mas quem
  rationale: A conjunção com o interrogativo introduz o clímax contrastante da pergunta retórica.
- source_word: יַעֲמֹד
  choice: pode resistir
  rationale: O verbo significa ficar de pé ou permanecer. No contexto, implica suportar ou resistir; esta formulação comunica naturalmente a força da pergunta.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva a imagem espacial de estar perante algo e combina naturalmente com “resistir”.
- source_word: קִנְאָה
  choice: ciúme
  rationale: O termo pode designar ciúme, inveja ou zelo. Neste provérbio sobre paixões destrutivas, “ciúme” se ajusta bem, sem eliminar a alternativa contextual “inveja”, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Furor” e “ira” distinguem os dois termos hebraicos; “inundação” preserva a metáfora concreta. O marcador de nota aparece imediatamente após o termo relevante.
