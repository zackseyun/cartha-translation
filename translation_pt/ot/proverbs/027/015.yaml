base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/015.yaml
  text: A constant dripping on a day of heavy rain[a], and a quarrelsome wife, are alike.
translation:
  language: pt
  text: Uma goteira persistente num dia de chuva forte[a] e uma esposa briguenta são semelhantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O gotejar contínuo num dia chuvoso e uma esposa briguenta são a mesma coisa.”'
    reason: Registra tanto a possibilidade de entender דֶּלֶף טוֹרֵד como “gotejar contínuo” quanto uma tradução mais forte da equivalência expressa por נִשְׁתָּוָה.
lexical_decisions:
- source_word: דֶּלֶף
  choice: goteira
  rationale: O termo descreve água que pinga ou vaza, especialmente pelo teto. “Goteira” preserva a imagem doméstica concreta e é natural em português.
- source_word: טוֹרֵד
  choice: persistente
  rationale: O particípio comunica ação contínua ou repetida. “Persistente” transmite a duração incômoda do gotejar sem tornar explícito algo além do hebraico.
- source_word: בְּיוֹם
  choice: num dia de
  rationale: Expressão temporal corrente que mantém o cenário concreto do provérbio.
- source_word: סַגְרִיר
  choice: chuva forte
  rationale: O substantivo indica tempo chuvoso, chuva contínua ou tempestuosa. “Chuva forte” comunica com clareza a condição desagradável, enquanto a nota registra uma alternativa menos específica.
- source_word: אֵשֶׁת מִדְיָנִים
  choice: uma esposa briguenta
  rationale: A construção significa literalmente “esposa de contendas”. “Esposa briguenta” é idiomático, atual e preserva a caracterização do texto.
- source_word: נִשְׁתָּוָה
  choice: são semelhantes
  rationale: O verbo expressa comparação ou equivalência. O plural idiomático em português explicita que os dois elementos comparados se assemelham, embora o hebraico use uma forma singular.
