base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/006.yaml
  text: Faithful are the wounds of a friend[a], but the kisses of an enemy are excessive.
translation:
  language: pt
  text: Fiéis são as feridas de um amigo, mas excessivos[a] são os beijos de um inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abundantes”. O termo hebraico é difícil; a ideia pode ser que os beijos de um inimigo sejam numerosos demais e, por isso, insinceros ou enganosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱמָנִים
  choice: fiéis
  rationale: O adjetivo expressa confiabilidade e sinceridade. “Fiéis” preserva a formulação compacta do provérbio e indica que as feridas causadas pelo amigo procedem de uma intenção leal.
- source_word: פִּצְעֵי
  choice: feridas
  rationale: O substantivo designa feridas ou lesões e, neste contexto sapiencial, também evoca a dor de uma repreensão sincera.
- source_word: אוֹהֵב
  choice: amigo
  rationale: O particípio significa literalmente “quem ama”. “Amigo” é natural em português e mantém o contraste relacional com “inimigo”.
- source_word: וְנַעְתָּרוֹת
  choice: excessivos
  rationale: A forma hebraica é difícil, mas seu sentido lexical mais direto aponta para abundância ou profusão. “Excessivos” preserva essa ideia sem inserir no texto principal a interpretação de que os beijos são enganosos.
- source_word: נְשִׁיקוֹת
  choice: beijos
  rationale: Equivalente direto do substantivo hebraico; no contexto, representa demonstrações de afeto que podem ser lisonjeiras ou insinceras.
- source_word: שׂוֹנֵא
  choice: inimigo
  rationale: O particípio significa literalmente “quem odeia”. “Inimigo” forma um contraste claro e idiomático com “amigo”.
theological_decisions: []
