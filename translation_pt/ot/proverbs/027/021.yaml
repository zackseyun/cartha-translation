  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וְ֝/אִ֗ישׁ לְ/פִ֣י מַהֲלָלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/021.yaml
  text: The crucible is for silver[a], and the furnace for gold, and a man is tested by his praise.
translation:
  language: pt
  text: O crisol é para a prata, e a fornalha, para o ouro; e o homem é provado segundo o seu louvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem é provado por aquilo que elogia”; alternativamente: “o homem é provado pelo elogio que recebe”.'
    reason: Registra as principais interpretações da expressão hebraica ambígua לְפִי מַהֲלָלוֹ.
lexical_decisions:
- source_word: מַצְרֵף
  choice: crisol
  rationale: Designa o recipiente em que a prata é refinada. “Crisol” preserva com precisão a imagem metalúrgica e é compreensível no português moderno.
- source_word: לַכֶּסֶף
  choice: para a prata
  rationale: 'A preposição indica finalidade ou adequação: o crisol serve para refinar a prata.'
- source_word: כּוּר
  choice: fornalha
  rationale: Refere-se ao forno usado para fundir ou refinar metais; “fornalha” é natural e mantém o paralelismo.
- source_word: לַזָּהָב
  choice: para o ouro
  rationale: É paralelo a “para a prata” e indica o metal ao qual a fornalha se destina.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o substantivo masculino singular do hebraico, usado aqui proverbialmente para representar um indivíduo.
- source_word: לְפִי
  choice: segundo
  rationale: A expressão significa literalmente “conforme a boca de” e, idiomaticamente, “segundo” ou “de acordo com”. “Segundo” preserva a relação de medida sem determinar como o louvor prova o homem.
- source_word: מַהֲלָלוֹ
  choice: o seu louvor
  rationale: O substantivo pode referir-se ao louvor expresso pelo homem, ao louvor que ele recebe ou à sua reputação louvada. A formulação compacta conserva essa ambiguidade, esclarecida na nota.
theological_decisions:
- issue: Ambiguidade interpretativa do último membro do provérbio
  choice: o homem é provado segundo o seu louvor
  alternative: o homem é provado por aquilo que elogia; ou pelo elogio que recebe
  rationale: לְפִי מַהֲלָלוֹ admite mais de uma interpretação legítima. O texto principal mantém “seu louvor” sem decidir se se trata do louvor que parte do homem ou daquele que lhe é dirigido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O ponto e vírgula destaca a comparação entre o refinamento dos metais e a prova do caráter humano; a elipse em “e a fornalha, para o ouro” reproduz naturalmente o paralelismo proverbial.
