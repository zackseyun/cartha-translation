  text: פִּֽי צַ֭דִּיק יָנ֣וּב חָכְמָ֑ה וּ/לְשׁ֥וֹן תַּ֝הְפֻּכ֗וֹת תִּכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/031.yaml
  text: The mouth of the righteous bears wisdom as fruit[b][a], but the tongue of perversity will be cut off.
translation:
  language: pt
  text: A boca do justo produz sabedoria como fruto[a], mas a língua perversa[b] será cortada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faz brotar sabedoria”. O verbo hebraico evoca o brotar ou o dar fruto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a língua de perversidades”. O plural hebraico pode enfatizar manifestações repetidas de fala torcida.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: a boca
  rationale: Mantém a imagem concreta hebraica da boca como fonte da fala e o paralelismo com “língua”.
- source_word: צַדִּיק
  choice: do justo
  rationale: Representa o singular hebraico como tipo moral, em formulação proverbial natural e tradicional em português.
- source_word: יָנוּב
  choice: produz ... como fruto
  rationale: Preserva de modo compreensível a metáfora orgânica do verbo, que pode descrever brotar ou dar fruto.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Traduz diretamente o substantivo abstrato, sem restringi-lo interpretativamente a “palavras sábias”.
- source_word: לְשׁוֹן
  choice: a língua
  rationale: Conserva a metonímia hebraica para a fala e corresponde à imagem de “boca” no primeiro membro.
- source_word: תַּהְפֻּכוֹת
  choice: perversa
  rationale: A expressão adjetiva é idiomática em português e comunica a ideia de fala torcida ou moralmente desviada; a força do plural hebraico é registrada em nota.
- source_word: תִּכָּרֵת
  choice: será cortada
  rationale: Preserva a voz passiva e a imagem severa de כרת sem decidir se o resultado específico é silenciamento, remoção ou destruição.
