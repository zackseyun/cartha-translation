  text: לֹֽא יַרְעִ֣יב יְ֭הוָה נֶ֣פֶשׁ צַדִּ֑יק וְ/הַוַּ֖ת רְשָׁעִ֣ים יֶהְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/003.yaml
  text: Yahweh will not let the righteous person go hungry[a], but he drives away the craving of the wicked.
translation:
  language: pt
  text: Yahweh não deixará o justo passar fome, mas repelirá o desejo[a] dos perversos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afastará a ruína dos perversos”. O substantivo hebraico pode ser entendido como “desejo/ânsia” ou como “ruína/calamidade”.'
    reason: Leitura alternativa decorrente da ambiguidade lexical de הַוַּת.
lexical_decisions:
- source_word: לֹא יַרְעִיב
  choice: não deixará ... passar fome
  rationale: O hifil de רעב expressa causar fome. A formulação portuguesa é natural e conserva o sentido causativo sem intensificá-lo para «deixar morrer de fome».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נֶפֶשׁ צַדִּיק
  choice: o justo
  rationale: Neste contexto, נֶפֶשׁ designa a própria pessoa viva; «o justo» comunica naturalmente o referente integral da expressão hebraica, sem sugerir que apenas uma alma imaterial passa fome.
- source_word: הַוַּת
  choice: o desejo
  rationale: No paralelismo com a fome do primeiro membro, o sentido de «desejo/ânsia» é provável. A possibilidade lexical de «ruína/calamidade» é preservada em nota.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Plural substantivado que designa pessoas moralmente más. «Perversos» é claro, corrente e adequado ao contraste sapiencial com «o justo».
- source_word: יֶהְדֹּף
  choice: repelirá
  rationale: O verbo indica empurrar, afastar ou repelir. «Repelirá» preserva essa imagem e funciona naturalmente com «desejo».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na expressão נֶפֶשׁ צַדִּיק
  choice: o justo, entendido como a pessoa inteira
  alternative: a alma do justo; a vida do justo; o apetite do justo
  rationale: A fome afeta a pessoa viva; a tradução evita impor uma distinção técnica entre alma e corpo que o contexto não exige.
- issue: Sentido de הַוַּת רְשָׁעִים
  choice: o desejo dos perversos
  alternative: a ruína ou calamidade dos perversos
  rationale: O contraste com a fome favorece o campo semântico do desejo ou apetite, mas a ambiguidade real do substantivo hebraico permanece registrada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro exprime a forma proverbial dos verbos hebraicos. «Passar fome» é idiomático, enquanto «repelirá» mantém a força concreta do verbo final. A nota foi colocada junto à expressão efetivamente ambígua.
