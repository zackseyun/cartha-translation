id: PRO.10.28
reference: Proverbs 10:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
translation:
  language: pt
  text: 'A expectativa[a] dos justos é alegria,

    mas a esperança dos ímpios perecerá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esperança”. O hebraico emprega aqui um substantivo diferente do usado no segundo segmento, embora os sentidos se sobreponham.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: expectativa
  rationale: O substantivo expressa expectativa ou espera esperançosa. “Expectativa” é natural em português e preserva a variação lexical em relação a תִקְוָה no segundo segmento.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo substantivado plural designa pessoas justas. “Os justos” é conciso e mantém o contraste proverbial com “os ímpios”.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Equivalente direto, corrente e compacto para a alegria ou satisfação indicada pelo substantivo hebraico.
- source_word: תִקְוַת
  choice: a esperança
  rationale: O substantivo significa normalmente “esperança”. Esta escolha mantém o paralelismo antitético e, ao mesmo tempo, a distinção vocabular em relação a תּוֹחֶלֶת.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Designa pessoas moralmente perversas ou culpadas. “Os ímpios” é uma expressão corrente na literatura sapiencial e forma um contraste claro com “os justos”.
- source_word: תֹּאבֵד
  choice: perecerá
  rationale: O verbo אבד pode significar perecer, perder-se ou desaparecer. “Perecerá” conserva a força da afirmação e concorda com “esperança”, que é o sujeito da oração.
theological_decisions:
- issue: Referente daquilo que perece no segundo segmento
  choice: É a esperança dos ímpios que perecerá.
  alternative: A frase pode ser entendida de modo mais amplo como uma alusão à ruína dos próprios ímpios juntamente com suas esperanças.
  rationale: O verbo feminino singular concorda com תִקְוַת, “esperança”. Por isso, a tradução afirma diretamente o fim da esperança deles, sem acrescentar uma conclusão doutrinária sobre o destino final das pessoas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a concisão preservam o paralelismo antitético do provérbio; a variação “expectativa/esperança” reflete os dois substantivos hebraicos sem tornar a frase artificial.
