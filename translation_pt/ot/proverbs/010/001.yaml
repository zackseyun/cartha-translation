  yaml_path: translation/ot/proverbs/010/001.yaml
  text: 'The proverbs of Solomon: a wise son makes a father glad[a], but a foolish son is the grief of his mother.'
translation:
  language: pt
  text: 'Provérbios de Salomão:


    O filho sábio alegra o pai,

    mas o filho tolo é a tristeza de sua mãe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é motivo de tristeza para sua mãe”.'
    reason: A construção nominal תּוּגַת אִמּוֹ pode ser expressa como identificação — “a tristeza de sua mãe” — ou, de modo mais idiomático, como aquilo que causa tristeza à mãe.
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: Provérbios de
  rationale: Plural em estado construto de מָשָׁל, usado aqui como título de uma coleção. “Provérbios” é o equivalente consagrado e adequado ao gênero sapiencial.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: בֵּן חָכָם
  choice: O filho sábio
  rationale: Mantém o masculino singular explícito do hebraico e o sentido moral e prático de חָכָם no contexto de Provérbios.
- source_word: יְשַׂמַּח אָב
  choice: alegra o pai
  rationale: O hifil de שׂמח tem sentido causativo. “Alegra” expressa isso de forma concisa e natural; o artigo definido é idiomático em português para a relação familiar genérica.
- source_word: וּבֵן כְּסִיל
  choice: mas o filho tolo
  rationale: Embora וּ seja formalmente “e”, o paralelismo é antitético, por isso “mas” comunica naturalmente o contraste. כְּסִיל indica insensatez moral e prática, bem representada por “tolo”.
- source_word: תּוּגַת אִמּוֹ
  choice: é a tristeza de sua mãe
  rationale: Reproduz a relação construta de modo conciso e representa o sufixo de terceira pessoa masculina singular em אִמּוֹ. A cópula, implícita no hebraico, é necessária em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura em dois versos para tornar visível o paralelismo antitético. Conserva “filho” em vez de neutralizar o gênero e emprega “tolo” no sentido sapiencial, não como simples falta de inteligência.
