base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
translation:
  language: pt
  text: Quem ajunta no verão é filho prudente[a][b], mas quem dorme durante a colheita é filho que causa vergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é filho sábio”.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “filho” está no masculino singular. Em Provérbios, muitas vezes tem sentido representativo, embora preserve a forma de instrução de pai para filho.
    reason: cultural_note
lexical_decisions:
- source_word: אֹגֵר
  choice: ajunta
  rationale: O particípio descreve a ação de recolher a produção. “Ajunta” é direto e natural no contexto agrícola, sem especificar além do hebraico que ela seja armazenada.
- source_word: בַּקַּיִץ
  choice: no verão
  rationale: Indica a estação apropriada para recolher ou preparar a produção; a expressão é concisa e idiomática em português.
- source_word: בֵּן
  choice: filho
  rationale: O hebraico emprega o masculino singular e preserva a forma de instrução de pai para filho característica de Provérbios.
- source_word: מַשְׂכִּיל
  choice: prudente
  rationale: O particípio expressa discernimento prático demonstrado pela conduta oportuna; “prudente” comunica essa sensatez aplicada.
- source_word: נִרְדָּם
  choice: dorme
  rationale: O particípio nifal retrata aquele que está dormindo justamente quando deveria trabalhar; “dorme” preserva a formulação proverbial direta.
- source_word: בַּקָּצִיר
  choice: durante a colheita
  rationale: Marca o período decisivo em que o trabalho precisa ser realizado; a formulação explicita naturalmente a relação temporal.
- source_word: מֵבִישׁ
  choice: que causa vergonha
  rationale: 'O particípio hifil tem sentido causativo: o filho provoca vergonha ou desonra. A oração relativa conserva essa nuance melhor que um simples adjetivo.'
theological_decisions: []
