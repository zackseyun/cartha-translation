  text: צַדִּ֣יק לְ/עוֹלָ֣ם בַּל יִמּ֑וֹט וּ֝/רְשָׁעִ֗ים לֹ֣א יִשְׁכְּנוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/030.yaml
  text: The righteous will never be shaken[a], but the wicked will not dwell in the land.
translation:
  language: pt
  text: O justo jamais será abalado, mas os perversos não habitarão na terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico אֶרֶץ pode se referir tanto à terra em sentido mais amplo quanto a uma terra ou território específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado singular apresenta a pessoa justa de modo genérico e representativo; “o justo” é conciso, natural e preserva essa força proverbial.
- source_word: לְעוֹלָם ... בַּל
  choice: jamais
  rationale: A expressão temporal combinada com a partícula poética de negação comunica uma impossibilidade permanente. “Jamais” reproduz com naturalidade a ênfase e o tom elevado.
- source_word: יִמּוֹט
  choice: será abalado
  rationale: O nifal de מוט descreve ser movido ou perder a estabilidade. “Será abalado” mantém a metáfora sem intensificá-la para “será destruído” ou “derrubado”.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado plural designa genericamente pessoas moralmente más. “Os perversos” é claro e digno no português contemporâneo.
- source_word: יִשְׁכְּנוּ
  choice: habitarão
  rationale: O verbo שכן indica morar, residir ou estabelecer habitação. “Habitarão” preserva melhor a ideia de residência estabelecida do que o mais amplo “viverão”.
- source_word: אָרֶץ
  choice: terra
  rationale: O termo pode indicar uma terra ou território específico e também a terra em sentido amplo. Em português, “terra” preserva naturalmente essa polissemia, explicitada na nota.
theological_decisions:
- issue: Alcance de אָרֶץ no provérbio
  choice: terra, deixando o referente aberto
  alternative: a terra de Israel ou a terra/mundo em sentido amplo
  rationale: O hebraico permite tanto uma ressonância territorial, inclusive ligada à permanência na terra, quanto uma afirmação sapiencial mais universal. A tradução não restringe silenciosamente o referente, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Jamais será abalado” conserva o paralelismo e a imagem poética; “habitarão na terra” mantém a concisão e a ambiguidade do original.
