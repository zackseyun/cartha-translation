base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/010.yaml
  text: Whoever winks the eye causes grief[a], and a fool of lips will come to ruin.
translation:
  language: pt
  text: Quem pisca o olho causa tristeza, e o insensato de lábios chegará à ruína.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “insensato de lábios” traduz literalmente o hebraico e pode indicar um insensato caracterizado por sua fala. O verbo final é raro; outra tradução possível é “será derrubado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  choice: Quem pisca o olho
  rationale: O particípio tem sentido genérico, “aquele que pisca”, e עַיִן (“olho”) é seu objeto. A formulação conserva a imagem hebraica e soa natural em português.
- source_word: יִתֵּן עַצָּבֶת
  choice: causa tristeza
  rationale: 'Embora נתן signifique literalmente “dar”, com עַצָּבֶת a expressão tem sentido causativo: causar ou trazer tristeza, dor ou sofrimento.'
- source_word: וֶאֱוִיל שְׂפָתַיִם
  choice: e o insensato de lábios
  rationale: A tradução próxima da forma hebraica preserva a expressão incomum e caracteriza o insensato por sua fala, sem restringir o sentido a tagarelice.
- source_word: יִלָּבֵט
  choice: cairá em ruína
  rationale: O verbo é raro e de sentido difícil. No contexto, indica queda ou ruína; esta formulação comunica o resultado sem impor uma imagem mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção deliberadamente incomum “insensato de lábios” conserva a tensão lexical e a imagem do hebraico; a nota esclarece sua natureza literal e a incerteza do verbo final.
