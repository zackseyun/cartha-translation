  text: מְק֣וֹר חַ֭יִּים פִּ֣י צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/011.yaml
  text: The mouth of the righteous is a fountain of life[a], but the mouth of the wicked conceals violence.
translation:
  language: pt
  text: A boca do justo é uma fonte de vida, mas a violência cobre a boca dos perversos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas a boca dos perversos encobre a violência”. A sequência hebraica permite ambas as leituras; “a violência cobre a boca dos perversos” é a análise sintática mais provável.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: מְקוֹר
  choice: fonte
  rationale: O substantivo designa uma nascente ou fonte de água. “Fonte” preserva de modo natural em português a imagem da fala que transmite vida.
- source_word: חַיִּים
  choice: de vida
  rationale: Embora a forma hebraica seja plural, aqui ela tem o sentido abstrato usual de “vida”.
- source_word: פִּי צַדִּיק
  choice: a boca do justo
  rationale: Mantém a imagem concreta de “boca” e traduz o singular representativo צַדִּיק sem acrescentar marca de gênero desnecessária além da forma lexical portuguesa consagrada.
- source_word: וּפִי רְשָׁעִים
  choice: mas a boca dos perversos
  rationale: “Mas” explicita o contraste próprio do paralelismo. O hebraico traz “boca” no singular e “perversos” no plural; a tradução conserva essa construção coletiva, natural em português.
- source_word: יְכַסֶּה
  choice: encobre
  rationale: O verbo significa “cobrir” e pode, em sentido figurado, significar ocultar ou dissimular. “Encobre” preserva tanto a imagem de cobrir quanto a ideia de esconder.
- source_word: חָמָס
  choice: a violência
  rationale: O termo abrange violência e injustiça violenta; “violência” é a tradução direta e concisa adequada ao contraste moral do provérbio.
theological_decisions:
- issue: Relação sintática entre “a boca dos perversos” e “violência”
  choice: “a boca dos perversos encobre a violência”
  alternative: “a violência cobre a boca dos perversos”
  rationale: A ordem mais direta permite tomar “a boca” como sujeito do verbo, mas, como o verbo singular pode concordar também com “violência”, o paralelismo admite a leitura inversa. A tradução principal segue a sintaxe mais imediata, e a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Fonte de vida” conserva a concisão e a metáfora sapiencial; “perversos” expressa a categoria moral do plural hebraico sem restringi-la a atos específicos.
