base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/006.yaml
  text: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
translation:
  language: pt
  text: 'Bênçãos estão sobre a cabeça do justo,

    mas a boca dos perversos encobre violência.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra compreensão possível do hebraico: “mas a violência cobre a boca dos perversos”.'
    reason: Registra uma ambiguidade real de sintaxe e paralelismo sem alterar silenciosamente o texto massorético adotado.
lexical_decisions:
- source_word: בְּרָכוֹת
  choice: Bênçãos
  rationale: Mantém o plural concreto do hebraico e o sentido de favores ou benefícios recebidos.
- source_word: לְרֹאשׁ
  choice: sobre a cabeça
  rationale: Preserva a imagem hebraica de bênçãos repousando ou sendo conferidas sobre a cabeça.
- source_word: צַדִּיק
  choice: do justo
  rationale: Equivalente natural e tradicional para a pessoa caracterizada pela retidão.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O plural hebraico é preservado; “perversos” comunica culpa moral em português corrente.
- source_word: יְכַסֶּה
  choice: encobre
  rationale: Retém o sentido básico e a ambiguidade de “cobrir”, podendo sugerir ocultação sem tornar essa interpretação explícita demais.
- source_word: חָמָס
  choice: violência
  rationale: 'Expressa o sentido predominante do termo: violência, injustiça ou dano praticado.'
theological_decisions:
- issue: Ambiguidade da relação entre a boca dos perversos e a violência
  choice: a boca dos perversos encobre violência
  alternative: a violência cobre a boca dos perversos
  rationale: A vocalização e a ordem do texto massorético favorecem “a boca ... encobre violência”, embora o paralelismo e Provérbios 10:11 permitam considerar uma leitura em que a violência cobre a boca deles. A tradução principal segue o WLC sem eliminar a alternativa textual/interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com construção poética concisa. “Sobre a cabeça” conserva a metáfora original; “encobre” soa natural e mantém a tensão sem explicar em excesso.
