  text: שִׂפְתֵ֣י צַ֭דִּיק יֵדְע֣וּ/ן רָצ֑וֹן וּ/פִ֥י רְ֝שָׁעִ֗ים תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
translation:
  language: pt
  text: Os lábios do justo sabem o que é agradável[a], mas a boca dos perversos profere perversidades.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que é aceitável”, “o que agrada” ou “favor”. O substantivo hebraico pode indicar favor, boa vontade ou aquilo que é agradável e apropriado.
    reason: lexical_alternative
  - marker: b
    text: 'Em hebraico, literalmente: “mas a boca dos perversos — perversidades”; o verbo “profere” foi acrescentado para dar clareza em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: os lábios de
  rationale: Mantém a imagem concreta do hebraico e o paralelismo poético com “boca” no segundo membro.
- source_word: צַדִּיק
  choice: o justo
  rationale: O singular hebraico tem sentido genérico. “O justo” é uma formulação tradicional, concisa e natural em português, sem precisar explicitar gênero além da forma gramatical.
- source_word: יֵדְעוּן
  choice: sabem
  rationale: Preserva o sentido lexical básico de “conhecer/saber”, deixando que o contexto comunique discernimento no falar.
- source_word: רָצוֹן
  choice: o que é agradável
  rationale: No contexto, designa aquilo que agrada, é aceitável ou apropriado. A expressão preserva a abertura sem restringir o termo ao favor divino.
- source_word: וּפִי
  choice: mas a boca de
  rationale: “Mas” expressa o contraste entre os dois membros, e “boca” conserva a imagem e o paralelismo do original.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Representa a classe dos moralmente maus; “perversos” também estabelece uma correspondência lexical natural com “perversidades”, sem apagar o contraste ético.
- source_word: תַּהְפֻּכוֹת
  choice: profere perversidades
  rationale: O substantivo plural indica coisas torcidas ou perversas. O verbo “profere” é suprido para produzir uma oração natural em português, enquanto “perversidades” conserva o plural e a força substantiva do hebraico.
