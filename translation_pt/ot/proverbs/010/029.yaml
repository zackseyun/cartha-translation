  text: מָע֣וֹז לַ֭/תֹּם דֶּ֣רֶךְ יְהוָ֑ה וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
translation:
  language: pt
  text: O caminho de Yahweh é uma fortaleza para quem vive com integridade[a], mas é ruína[b] para os que praticam o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o íntegro” ou “para quem é irrepreensível”. “O caminho de Yahweh” pode referir-se tanto ao modo como Yahweh age quanto ao caminho que ele coloca diante das pessoas.
    reason: lexical_alternative
  - marker: b
    text: Ou “destruição” ou “terror”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: fortaleza
  rationale: Preserva a metáfora concreta de um lugar de proteção e força; é corrente e digna em português.
- source_word: לַתֹּם
  choice: para quem vive com integridade
  rationale: תֹּם expressa integridade, inteireza ou irrepreensibilidade. A formulação pessoal mantém o contraste com os praticantes do mal e evita a possível leitura abstrata de que o caminho fortalece a própria integridade.
- source_word: דֶּרֶךְ יְהוָה
  choice: O caminho de Yahweh
  rationale: Mantém a construção ampla do hebraico, que pode aludir tanto ao modo de agir de Yahweh quanto ao caminho que ele estabelece para as pessoas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וּמְחִתָּה
  choice: mas é ruína
  rationale: מְחִתָּה pode indicar ruína, destruição ou terror. 'Ruína' conserva a oposição à fortaleza sem decidir entre resultado destrutivo e experiência aterradora; o ו é adversativo no paralelismo.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: para os que praticam o mal
  rationale: Expressa naturalmente a força verbal de פֹעֲלֵי e o sentido ético de אָוֶן em linguagem moderna.
theological_decisions:
- issue: Amplitude semântica de דֶּרֶךְ יְהוָה
  choice: Preservar 'O caminho de Yahweh' sem especificar a relação.
  alternative: O modo de agir de Yahweh; o caminho ordenado por Yahweh.
  rationale: A construção hebraica admite tanto o modo de agir de Yahweh quanto o caminho que ele propõe às pessoas; restringi-la eliminaria uma ambiguidade genuína.
- issue: Função paralela do caminho de Yahweh
  choice: Explicitar apenas a cópula elíptica em 'mas é ruína', mantendo o mesmo sujeito nos dois membros.
  alternative: Entender a ruína como uma ação divina expressa de maneira independente.
  rationale: O hebraico apresenta 'o caminho de Yahweh' como sujeito da sentença e contrapõe seus efeitos sobre dois grupos, sem desenvolver uma afirmação doutrinária além disso.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. 'Fortaleza', 'vive com integridade' e 'praticam o mal' combinam dignidade proverbial com clareza popular. Os marcadores foram colocados junto às expressões que explicam.
