id: PRO.10.24
reference: Proverbs 10:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
translation:
  language: pt
  text: Aquilo que o perverso teme virá sobre ele, mas o desejo dos justos será concedido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “ele dará”. O sujeito não é declarado; a tradução mantém indefinido quem concede o desejo.
    reason: alternative_reading
lexical_decisions:
- source_word: מְגוֹרַת
  choice: aquilo que ... teme
  rationale: O substantivo pode indicar tanto o temor quanto o objeto temido. Esta formulação natural em português expressa com clareza aquilo que o perverso receia.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado singular tem sentido representativo e proverbial. “O perverso” preserva esse caráter sem acrescentar marca de gênero além da forma gramatical corrente.
- source_word: הִיא תְבוֹאֶנּוּ
  choice: virá sobre ele
  rationale: O pronome feminino retoma מְגוֹרַת, e o verbo com sufixo indica que o objeto temido chegará até ele ou cairá sobre ele. “Virá sobre ele” é idiomático e mantém a imagem do hebraico.
- source_word: וְתַאֲוַת
  choice: mas o desejo
  rationale: תַּאֲוָה significa desejo ou anseio. Embora וְ seja formalmente “e”, “mas” explicita em português o paralelismo antitético do provérbio.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O plural substantivado designa coletivamente as pessoas justas. “Os justos” é natural e tradicional em português contemporâneo.
- source_word: יִתֵּן
  choice: será concedido
  rationale: A forma hebraica é ativa, literalmente “ele dará”, mas o sujeito não é expresso. A passiva mantém o agente implícito e comunica naturalmente o cumprimento do desejo.
theological_decisions:
- issue: Sujeito implícito de יִתֵּן
  choice: Manter o concessor implícito por meio de “será concedido”.
  alternative: “Ele dará”, com sujeito não identificado; ou “Deus concederá”, tornando explícita a agência divina.
  rationale: O hebraico não identifica o sujeito. Embora a ação divina possa estar implícita no contexto sapiencial, nomear Deus resolveria uma ambiguidade genuína da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a concisão proverbial, o contraste entre perverso e justos e a ambiguidade quanto ao agente do último verbo.
