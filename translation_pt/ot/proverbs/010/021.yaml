source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יִרְע֣וּ רַבִּ֑ים וֶֽ֝/אֱוִילִ֗ים בַּ/חֲסַר לֵ֥ב יָמֽוּתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/021.yaml
  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
translation:
  language: pt
  text: Os lábios do justo alimentam muitos[a], mas os tolos morrem por falta de entendimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nutrem muitos”; o verbo hebraico também pode significar “pastorear” ou “apascentar”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por falta de coração”; em hebraico, “coração” muitas vezes se refere ao entendimento, ao discernimento ou ao juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: os lábios de
  rationale: Mantém a imagem hebraica dos lábios como metonímia da fala e soa natural em português.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado designa de modo genérico a pessoa justa; o singular preserva a forma do hebraico.
- source_word: יִרְעוּ
  choice: alimentam
  rationale: O verbo רעה pode significar alimentar, apascentar ou pastorear. Com “lábios” como sujeito, “alimentam” preserva a metáfora e comunica naturalmente que a fala beneficia outros.
- source_word: רַבִּים
  choice: muitos
  rationale: Reproduz diretamente o substantivo/adjetivo plural sem acrescentar “pessoas”, que está apenas implícito.
- source_word: אֱוִילִים
  choice: os tolos
  rationale: Termo característico da literatura sapiencial para pessoas moralmente insensatas e obstinadas, não apenas pouco inteligentes.
- source_word: בַּחֲסַר לֵב
  choice: por falta de entendimento
  rationale: A expressão significa literalmente “por falta de coração”; no uso antropológico hebraico, “coração” frequentemente abrange entendimento, discernimento e juízo. A formulação escolhida comunica o sentido idiomático em português atual.
- source_word: יָמוּתוּ
  choice: morrem
  rationale: Preserva o sentido lexical direto do verbo e usa o presente proverbial, natural em português.
theological_decisions: []
