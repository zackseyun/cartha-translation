  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
translation:
  language: pt
  text: 'O ódio provoca conflitos,

    mas o amor cobre todas as transgressões.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Cobre» conserva a imagem do hebraico: em contraste com o ódio, o amor não fica expondo nem perpetuando as ofensas. O provérbio não está ordenando que se ocultem injustiças.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂנְאָה
  choice: ódio
  rationale: Substantivo abstrato em contraste direto com אַהֲבָה; «ódio» é o equivalente natural e preserva a oposição do provérbio.
- source_word: תְּעוֹרֵר
  choice: provoca
  rationale: A forma verbal tem sentido causativo, de despertar ou suscitar. «Provoca» expressa em português corrente a ação de fazer surgir conflitos.
- source_word: מְדָנִים
  choice: conflitos
  rationale: O plural designa disputas, contendas ou desavenças. «Conflitos» é claro, atual e suficientemente amplo.
- source_word: וְ/עַל
  choice: mas
  rationale: Embora a construção seja literalmente «e sobre», o paralelismo antitético pede em português uma conjunção adversativa; a ideia espacial permanece representada pelo verbo «cobre».
- source_word: כָּל
  choice: todas
  rationale: Mantém o alcance abrangente do quantificador hebraico e concorda naturalmente com «transgressões».
- source_word: פְּשָׁעִים
  choice: transgressões
  rationale: Preserva o peso moral de atos ofensivos ou rebeldes sem restringir o contexto a simples desavenças interpessoais.
- source_word: תְּכַסֶּה
  choice: cobre
  rationale: Mantém a metáfora concreta do hebraico, sem substituí-la por interpretações mais específicas como «perdoa», «ignora» ou «oculta».
- source_word: אַהֲבָה
  choice: amor
  rationale: Equivalente direto do substantivo abstrato e termo que preserva o contraste central com «ódio».
theological_decisions:
- issue: Sentido de «o amor cobre todas as transgressões»
  choice: Conservar a metáfora de que o amor cobre as transgressões, sem definir no texto exatamente como isso ocorre.
  alternative: Traduzir como «o amor perdoa todas as transgressões» ou como «o amor oculta toda injustiça».
  rationale: 'O hebraico diz «cobre», não emprega explicitamente um verbo para perdoar. Preservar a imagem mantém a tensão do provérbio: em contraste com o ódio, que alimenta conflitos, o amor não expõe nem perpetua ofensas. Ao mesmo tempo, a formulação não deve ser tomada como ordem para encobrir injustiças.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. O paralelismo foi preservado em dois versos. «Conflitos» foi preferido a «contendas» por ser mais corrente; «transgressões» mantém o peso moral do hebraico.
