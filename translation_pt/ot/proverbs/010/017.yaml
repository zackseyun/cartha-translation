  text: אֹ֣רַח לְ֭/חַיִּים שׁוֹמֵ֣ר מוּסָ֑ר וְ/עוֹזֵ֖ב תּוֹכַ֣חַת מַתְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/017.yaml
  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
translation:
  language: pt
  text: Quem segue a disciplina está no caminho para a vida[a], mas quem abandona a repreensão desvia outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «é caminho para a vida». O hebraico é conciso e permite que «caminho para a vida» funcione como expressão predicativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: caminho
  rationale: O substantivo designa caminho, vereda ou curso de vida; «caminho» preserva a metáfora moral e é natural em português.
- source_word: לְחַיִּים
  choice: para a vida
  rationale: A preposição לְ indica aqui, de modo plausível, direção ou resultado. «Para a vida» conserva essa orientação sem excluir a leitura predicativa mais concisa.
- source_word: שׁוֹמֵר
  choice: acolhe
  rationale: O particípio significa guardar, observar ou atender. Com מוּסָר, «acolhe» comunica adesão contínua à disciplina em português corrente, sem sugerir apenas conservação passiva.
- source_word: מוּסָר
  choice: disciplina
  rationale: Em Provérbios, o termo abrange formação, instrução e correção; «disciplina» mantém essa amplitude pedagógica e corretiva.
- source_word: וְעוֹזֵב
  choice: mas quem abandona
  rationale: O וְ estabelece contraste entre as duas linhas, e עזב expressa deixar ou abandonar. A formulação conserva a gravidade moral do verbo.
- source_word: תּוֹכַחַת
  choice: repreensão
  rationale: O termo denota correção verbal, censura ou repreensão. «Repreensão» é claro, digno e adequado ao paralelismo sapiencial.
- source_word: מַתְעֶה
  choice: desvia outros
  rationale: 'O particípio hifil de תעה é causativo: faz alguém errar ou se desviar. «Outros» explicita em português o objeto implícito no hebraico sem transformar o verbo em reflexivo.'
theological_decisions:
- issue: Função sintática de אֹרַח לְחַיִּים
  choice: «está no caminho para a vida»
  alternative: «é caminho para a vida»
  rationale: O hebraico é terso e permite entender «caminho para a vida» como expressão predicativa. O texto principal explicita a leitura idiomática mais natural, enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo antitético foi preservado; evitou-se linguagem excessivamente arcaica.
