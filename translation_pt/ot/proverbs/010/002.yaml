id: PRO.10.2
reference: Proverbs 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא י֭וֹעִילוּ אוֹצְר֣וֹת רֶ֑שַׁע וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
translation:
  language: pt
  text: Tesouros obtidos com maldade não trazem proveito, mas a justiça livra da morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a retidão livra da morte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֭וֹעִילוּ
  choice: não trazem proveito
  rationale: O hifil de יעל expressa utilidade ou benefício. A formulação é natural em português e mantém a concisão proverbial.
- source_word: אוֹצְר֣וֹת
  choice: Tesouros
  rationale: No estado construto com רֶשַׁע, refere-se mais provavelmente a riquezas acumuladas do que a depósitos ou edifícios.
- source_word: רֶ֑שַׁע
  choice: obtidos com maldade
  rationale: 'Explicita, de modo natural, a provável relação do construto: riquezas adquiridas por meios perversos. A formulação evita a possível leitura pouco clara de ''tesouros de maldade''.'
- source_word: וּ֝/צְדָקָ֗ה
  choice: mas a justiça
  rationale: O waw tem valor adversativo no paralelismo antitético. 'Justiça' preserva aqui tanto a conduta moralmente reta quanto a dimensão de agir com equidade.
- source_word: תַּצִּ֥יל
  choice: livra
  rationale: O hifil de נצל significa resgatar ou livrar. 'Livra' é idiomático, digno e não restringe o alcance da afirmação.
- source_word: מִ/מָּֽוֶת
  choice: da morte
  rationale: Reproduz diretamente a construção com מן e mantém aberta a abrangência literal e sapiencial da expressão.
theological_decisions:
- issue: Sentido de צְדָקָה
  choice: justiça
  alternative: retidão
  rationale: Neste contraste entre riqueza perversa e conduta reta, 'justiça' é uma tradução portuguesa abrangente e natural. 'Retidão' também é possível e enfatizaria mais diretamente o caráter moral; a nota preserva essa alternativa sem resolver em excesso a amplitude do hebraico.
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira e alcance internacional. Mantém o paralelismo antitético e a concisão do hebraico.
