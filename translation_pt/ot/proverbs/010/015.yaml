  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ מְחִתַּ֖ת דַּלִּ֣ים רֵישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/015.yaml
  text: A rich man's wealth is his fortified city[b][a]; the ruin of the poor is their poverty.
translation:
  language: pt
  text: A riqueza do rico é sua cidade fortificada[a]; a ruína[b] dos pobres é a pobreza deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua cidade forte”. O hebraico diz literalmente: “cidade de sua força”.'
    reason: lexical_alternative
  - marker: b
    text: “Ruína” também pode ser traduzido por “destruição” ou, com menor probabilidade neste contexto, “terror” ou “consternação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: riqueza
  rationale: Designa bens materiais ou riqueza e estabelece de modo natural o contraste econômico do provérbio.
- source_word: עָשִׁיר
  choice: do rico
  rationale: O adjetivo substantivado está no singular masculino; esta formulação preserva tanto a forma quanto a relação possessiva com a riqueza.
- source_word: קִרְיַת עֻזּוֹ
  choice: sua cidade fortificada
  rationale: A expressão significa literalmente “cidade de sua força”; “cidade fortificada” comunica em português corrente a imagem de segurança e defesa sem eliminar a alternativa literal.
- source_word: מְחִתַּת
  choice: ruína
  rationale: O substantivo pode indicar ruína, destruição, terror ou consternação. Neste paralelismo econômico, “ruína” expressa melhor a ideia de que a pobreza é a perdição dos pobres.
- source_word: דַּלִּים
  choice: dos pobres
  rationale: Refere-se às pessoas pobres ou de condição humilde; “os pobres” é conciso e adequado ao contraste social.
- source_word: רֵישָׁם
  choice: sua pobreza
  rationale: O termo significa pobreza ou indigência. O pronome singular coletivo é natural em português, embora o hebraico tenha sufixo plural, referido aos pobres.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. Mantém a metáfora urbana e a tensão entre a segurança proporcionada pela riqueza e a vulnerabilidade causada pela pobreza.
