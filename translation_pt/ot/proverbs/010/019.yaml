  yaml_path: translation/ot/proverbs/010/019.yaml
  text: When words are many[a], transgression does not cease[b], but whoever restrains his lips is prudent.
translation:
  language: pt
  text: Quando as palavras são muitas, a transgressão não cessa[a]; mas quem refreia os lábios age com prudência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na abundância de palavras, não falta transgressão.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  choice: Quando as palavras são muitas
  rationale: A construção com בְּ mais רֹב expressa circunstância ou quantidade. Esta formulação comunica de modo natural a ideia de fala abundante, preservando a referência direta a “palavras”.
- source_word: לֹא יֶחְדַּל
  choice: não cessa
  rationale: O verbo חדל no qal significa “cessar, parar”. Com a negação, indica que a transgressão não chega ao fim; a nota registra a alternativa contextual “não falta”.
- source_word: פָּשַׁע
  choice: transgressão
  rationale: O substantivo denota transgressão, rebeldia ou ofensa. “Transgressão” mantém o peso moral do hebraico e é adequado ao registro sapiencial.
- source_word: וְחֹשֵׂךְ
  choice: mas quem refreia
  rationale: O particípio de חשׂך significa reter ou conter. “Refreia” é corrente no contexto de autocontrole, e “mas” explicita o contraste poético entre os dois membros.
- source_word: שְׂפָתָיו
  choice: os lábios
  rationale: A imagem corporal do hebraico é preservada e funciona naturalmente em português como referência ao controle da fala. A construção com “quem” evita limitar o provérbio ao sexo masculino.
- source_word: מַשְׂכִּיל
  choice: age com prudência
  rationale: O particípio hifil de שׂכל pode indicar agir com discernimento ou prudência. A formulação verbal representa bem o caráter ativo da expressão hebraica.
