source:
  edition: WLC
  text: כֶּ֣סֶף נִ֭בְחָר לְשׁ֣וֹן צַדִּ֑יק לֵ֖ב רְשָׁעִ֣ים כִּ/מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/020.yaml
  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
translation:
  language: pt
  text: A língua do justo é prata de primeira qualidade; o coração dos perversos pouco vale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vale muito pouco”, “é pouco” ou “é quase nada”. O hebraico é conciso e pode indicar pouco valor ou quase total insignificância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: prata
  rationale: Preserva a imagem concreta do metal precioso e o contraste de valor presente no provérbio.
- source_word: נִבְחָר
  choice: de primeira qualidade
  rationale: No contexto, qualifica a prata como selecionada ou excelente; esta formulação é natural em português e não exige interpretar o termo especificamente como “refinada”.
- source_word: לְשׁוֹן
  choice: língua
  rationale: Mantém a metonímia corporal do hebraico, natural em português para representar a fala.
- source_word: צַדִּיק
  choice: do justo
  rationale: Traduz o adjetivo substantivado singular sem acrescentar marca masculina além da forma gramatical convencional.
- source_word: לֵב
  choice: coração
  rationale: Conserva a imagem hebraica, que abrange o interior, o pensamento e o caráter moral da pessoa.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Representa o plural substantivado como categoria moral coletiva em linguagem corrente e dignificada.
- source_word: כִּמְעָט
  choice: pouco vale
  rationale: Explicita de modo idiomático a avaliação de escasso valor sugerida pelo paralelismo com a prata, sem eliminar a concisão do original.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A estrutura antitética e as imagens concretas de “língua”, “prata” e “coração” foram preservadas. O marcador foi colocado após a expressão cuja ambiguidade lexical a nota explica.
