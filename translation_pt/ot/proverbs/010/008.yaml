source:
  edition: WLC
  text: חֲכַם לֵ֭ב יִקַּ֣ח מִצְוֺ֑ת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/008.yaml
  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
translation:
  language: pt
  text: O sábio de coração aceita mandamentos, mas o insensato de lábios será derrubado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cairá em ruína”. O verbo hebraico final é raro e pode ter o sentido de ser derrubado ou acabar em ruína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: o sábio de coração
  rationale: Preserva a imagem hebraica, na qual o coração é o centro do pensamento e da vontade, em formulação natural e proverbial em português.
- source_word: יִקַּח
  choice: aceita
  rationale: Embora o sentido básico seja “toma/recebe”, com “mandamentos” o verbo expressa acolhimento voluntário e obediente.
- source_word: מִצְוֺת
  choice: mandamentos
  rationale: Comunica diretivas dotadas de autoridade e mantém a força normativa do substantivo hebraico.
- source_word: אֱוִיל
  choice: o insensato
  rationale: Designa alguém moral e praticamente tolo; “insensato” é digno, claro e adequado ao registro sapiencial.
- source_word: שְׂפָתַיִם
  choice: de lábios
  rationale: Conserva deliberadamente o idioma hebraico que caracteriza o insensato por sua fala, sem reduzi-lo interpretativamente a “tagarela”.
- source_word: יִלָּבֵט
  choice: será derrubado
  rationale: O verbo nifal é raro e provavelmente comunica ser lançado abaixo ou arruinado. A forma passiva “será derrubado” preserva sua força concreta e resultativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concisão proverbial. A expressão “sábio de coração” mantém a antropologia e a imagem do hebraico; “insensato de lábios” preserva o paralelismo e a estranheza significativa do original.
