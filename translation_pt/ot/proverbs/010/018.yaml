  text: מְכַסֶּ֣ה שִׂ֭נְאָה שִׂפְתֵי שָׁ֑קֶר וּ/מוֹצִ֥א דִ֝בָּ֗ה ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/018.yaml
  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
translation:
  language: pt
  text: Lábios mentirosos escondem o ódio[a], e quem espalha difamação[b] é insensato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem esconde o ódio tem lábios falsos”. A construção hebraica admite entender “lábios de falsidade” como sujeito ou como caracterização daquele que esconde o ódio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um relato prejudicial”. A expressão hebraica pode indicar a divulgação de uma notícia ruim ou danosa em sentido mais amplo, não somente difamação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: escondem
  rationale: O particípio de כסה significa cobrir ou ocultar. Em português, “escondem” expressa com naturalidade o ato de dissimular o ódio por meio de palavras falsas.
- source_word: שִׂנְאָה
  choice: o ódio
  rationale: O substantivo designa ódio ou hostilidade; “ódio” é a correspondência direta e natural neste provérbio.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: lábios mentirosos
  rationale: A expressão construta significa literalmente “lábios de falsidade”. “Lábios mentirosos” conserva a imagem hebraica e soa natural em português.
- source_word: וּ/מוֹצִא
  choice: e quem espalha
  rationale: O particípio hifil de יצא significa literalmente “fazer sair” ou “trazer para fora”; com דִבָּה, pode indicar divulgar ou fazer circular um relato prejudicial. “Quem espalha” torna essa ação clara.
- source_word: דִבָּה
  choice: difamação
  rationale: O termo pode designar um relato desfavorável ou prejudicial, por vezes falso ou malicioso. “Difamação” comunica sua força danosa sem restringi-lo a uma acusação formal.
- source_word: הוּא כְסִיל
  choice: é insensato
  rationale: כְּסִיל é um termo característico de Provérbios para quem é moralmente obtuso, não apenas pouco inteligente. “Insensato” preserva essa categoria sapiencial em registro digno e corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo proverbial, conserva a imagem concreta dos “lábios” e registra em nota tanto a ambiguidade sintática do primeiro membro quanto a amplitude semântica de דִבָּה.
