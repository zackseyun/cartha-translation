id: PRO.10.25
reference: Proverbs 10:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/עֲב֣וֹר ס֭וּפָה וְ/אֵ֣ין רָשָׁ֑ע וְ֝/צַדִּ֗יק יְס֣וֹד עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
translation:
  language: pt
  text: Quando passa a tempestade[a], o perverso já não existe[b], mas o justo é fundamento para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando passa o vendaval” ou “Como passa a tempestade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “e não há perverso”. O sentido pode ser que o perverso desaparece ou perece.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר
  choice: Quando passa
  rationale: A preposição כְּ com o infinitivo construto de עבר tem aqui valor temporal, possivelmente também comparativo. “Quando passa” é natural em português e preserva a cena dinâmica do provérbio.
- source_word: סוּפָה
  choice: tempestade
  rationale: O termo designa uma tempestade violenta, podendo também ser entendido como vendaval ou redemoinho. “Tempestade” comunica com clareza a força destrutiva da imagem.
- source_word: וְאֵין
  choice: já não existe
  rationale: Literalmente, “e não há”. No contexto, exprime o desaparecimento ou a ruína do perverso depois da tempestade; “já não existe” torna esse resultado claro sem definir além do texto como ele ocorre.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Embora seja singular masculino, funciona como tipo representativo na linguagem proverbial. O singular “o perverso” conserva mais diretamente a forma hebraica e se refere genericamente à pessoa perversa.
- source_word: וְצַדִּיק
  choice: mas o justo
  rationale: O וְ introduz um contraste nítido no paralelismo, adequadamente expresso por “mas”. O singular é representativo, como no membro anterior.
- source_word: יְסוֹד
  choice: fundamento
  rationale: É a correspondência direta para a ideia de base ou alicerce. “Fundamento” mantém a formulação concisa e metafórica do hebraico.
- source_word: עוֹלָם
  choice: para sempre
  rationale: O termo indica duração indefinida ou permanente. A construção portuguesa “fundamento para sempre” preserva a força duradoura da expressão sem acrescentar um qualificativo ausente do hebraico.
theological_decisions:
- issue: Singular masculino representativo na literatura sapiencial
  choice: Manter “o perverso” e “o justo” como singulares representativos e genéricos.
  alternative: “Os perversos” e “os justos”, ou “o homem perverso” e “o homem justo”.
  rationale: Os adjetivos substantivados no singular descrevem tipos humanos, não restringem a afirmação aos homens. Manter o singular preserva a forma e o contraste individual do hebraico, enquanto o português permite entendê-los genericamente.
- issue: Sentido de “fundamento para sempre”
  choice: Preservar a metáfora sem explicitar se o justo é fundamento para outros ou se possui estabilidade permanente.
  alternative: “O justo permanece firme para sempre” ou “o justo tem um fundamento eterno”.
  rationale: A sintaxe hebraica afirma literalmente que o justo é “fundamento de eternidade/perpetuidade”. As alternativas resolvem a metáfora em sentidos plausíveis, mas não expressos de modo inequívoco no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A concisão e o paralelismo antitético do provérbio foram preservados; as notas registram alternativas lexicais e a expressão hebraica mais literal.
