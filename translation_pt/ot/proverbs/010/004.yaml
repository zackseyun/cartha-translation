  text: רָ֗אשׁ עֹשֶׂ֥ה כַף רְמִיָּ֑ה וְ/יַ֖ד חָרוּצִ֣ים תַּעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/004.yaml
  text: A slack hand makes one poor[a], but the hand of the diligent makes rich.
translation:
  language: pt
  text: A mão preguiçosa leva à pobreza, mas a mão dos diligentes traz riqueza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A mão enganosa leva à pobreza». O termo hebraico רְמִיָּה pode ter o sentido de engano em outros contextos, mas, neste provérbio sobre o trabalho, o contexto favorece «preguiçosa» ou «negligente».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשׁ
  choice: empobrece
  rationale: O termo indica pobreza como resultado. Em português, o verbo «empobrece», em combinação com עֹשֶׂה, expressa naturalmente o sentido causativo e cria um paralelo claro com «enriquece».
- source_word: עֹשֶׂה
  choice: expresso pelo valor causativo de «empobrece»
  rationale: O particípio de עשה indica produzir ou causar um resultado; a formulação verbal portuguesa evita uma construção rígida como «faz pobre».
- source_word: כַף
  choice: mão
  rationale: Embora possa designar especificamente a palma, aqui se refere à mão como instrumento do trabalho.
- source_word: רְמִיָּה
  choice: preguiçosa
  rationale: No contexto do trabalho e em contraste com os diligentes, comunica falta de empenho ou negligência. «Preguiçosa» é corrente e clara, sem abandonar a alternativa lexical «enganosa», registrada em nota.
- source_word: יָד
  choice: a mão
  rationale: Mantém a imagem corporal repetida no paralelismo antitético.
- source_word: חָרוּצִים
  choice: dos diligentes
  rationale: O plural substantivado designa pessoas aplicadas e trabalhadoras; o plural é preservado na expressão possessiva natural em português.
- source_word: תַּעֲשִׁיר
  choice: enriquece
  rationale: O hifil de עשר tem valor causativo, «tornar rico»; «enriquece» é conciso e equilibra «empobrece».
