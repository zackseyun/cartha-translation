base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
translation:
  language: pt
  text: Praticar a maldade é brincadeira para o insensato[a], mas a sabedoria é própria do homem de entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Praticar um plano perverso é brincadeira para o insensato.” O termo hebraico traduzido como “maldade” também pode indicar um ato desavergonhado ou ultrajante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂחוֹק
  choice: é como diversão
  rationale: O כ prefixado expressa comparação, e שְׂחוֹק pode indicar riso, divertimento ou passatempo. “É como diversão” comunica naturalmente que o insensato trata o mal como algo recreativo, sem restringir o sentido a uma piada verbal.
- source_word: לִכְסִיל
  choice: para o insensato
  rationale: 'A preposição ל marca relação ou perspectiva: é assim que o insensato encara a prática da maldade. “Insensato” é uma forma corrente e digna de representar כְּסִיל no vocabulário sapiencial.'
- source_word: עֲשׂוֹת
  choice: Praticar
  rationale: O infinitivo construto funciona substantivamente como sujeito da oração. “Praticar” é conciso e idiomático em português.
- source_word: זִמָּה
  choice: a maldade
  rationale: זִמָּה pode designar maldade, plano perverso ou ato moralmente ultrajante e, em certos contextos, ter conotação sexual. Aqui, “maldade” preserva a força ética ampla sem estreitar indevidamente o termo.
- source_word: וְחָכְמָה
  choice: mas a sabedoria
  rationale: Embora וְ corresponda formalmente a “e”, o paralelismo contrapõe o insensato ao homem de entendimento; por isso, “mas” torna explícito em português o valor adversativo contextual.
- source_word: לְאִישׁ תְּבוּנָה
  choice: é própria do homem que tem entendimento
  rationale: O hebraico diz literalmente “para/de um homem de entendimento” e omite o predicado no segundo membro. “É própria de” mantém a concisão e uma relação ampla de correspondência ou pertença, sem acrescentar a ideia mais interpretativa de que a sabedoria seja seu prazer.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: homem que tem entendimento
  alternative: pessoa que tem entendimento; quem tem entendimento
  rationale: אִישׁ é um substantivo masculino singular usado de modo representativo numa máxima sapiencial. A tradução conserva a forma masculina do texto, embora a aplicação do provérbio seja geral.
- issue: Relação elíptica entre sabedoria e o homem de entendimento
  choice: a sabedoria é própria do homem que tem entendimento
  alternative: a sabedoria é um prazer para o homem que tem entendimento; a sabedoria pertence ao homem que tem entendimento
  rationale: O segundo membro não apresenta verbo ou predicado explícito. A formulação escolhida preserva em boa medida essa abertura e evita afirmar que a sabedoria é especificamente “prazer”, leitura possível pelo paralelismo, mas não expressa diretamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Diversão” evita o possível sentido exclusivamente verbal de “piada”; “insensato” mantém o registro sapiencial tradicional sem soar arcaico. O paralelismo e a concisão do hebraico foram preservados tanto quanto permite a naturalidade em português.
