  text: בִּרְכַּ֣ת יְ֭הוָה הִ֣יא תַעֲשִׁ֑יר וְ/לֹֽא יוֹסִ֖ף עֶ֣צֶב עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/022.yaml
  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: pt
  text: A bênção do SENHOR enriquece, e ele não acrescenta tristeza com ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o esforço penoso nada acrescenta a ela”. O hebraico também pode ser entendido dessa maneira.'
    reason: A sintaxe permite analisar עֶצֶב (“esforço penoso”, “dor” ou “tristeza”) como sujeito da segunda oração, em vez de objeto do verbo.
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  choice: A bênção do SENHOR
  rationale: Mantém a construção genitiva hebraica e segue a convenção editorial de representar o nome divino por SENHOR em versaletes.
- source_word: תַעֲשִׁיר
  choice: enriquece
  rationale: 'O hifil de עשר expressa causação: tornar rico ou proporcionar riqueza.'
- source_word: עֶצֶב
  choice: tristeza
  rationale: O termo pode designar tristeza, dor ou esforço penoso; “tristeza” preserva o contraste sapiencial entre a riqueza dada por Deus e a aflição que frequentemente a acompanha.
- source_word: עִמָּהּ
  choice: com ela
  rationale: O sufixo feminino remete naturalmente à bênção; a formulação conserva a relação expressa por עִם sem definir além do texto de que modo a tristeza poderia acompanhá-la.
theological_decisions:
- issue: Sujeito implícito de יוֹסִף
  choice: ele, referindo-se ao SENHOR
  alternative: “o esforço penoso nada acrescenta a ela” ou “ela não acrescenta tristeza”
  rationale: A forma verbal masculina singular permite entender o SENHOR como sujeito retomado da primeira oração, em consonância com a leitura tradicional e com a camada inglesa auditada. Como a sintaxe hebraica também admite outra análise de עֶצֶב, a alternativa é registrada em nota, sem ocultar a ambiguidade.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição pronominal “ele” explicita o sujeito implícito mais provável da segunda oração, enquanto a nota preserva a alternativa sintática genuína.
