  text: חֲכָמִ֥ים יִצְפְּנוּ דָ֑עַת וּ/פִֽי אֱ֝וִיל מְחִתָּ֥ה קְרֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/014.yaml
  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
translation:
  language: pt
  text: Os sábios acumulam conhecimento[a], mas a boca do insensato é ruína próxima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Acumulam» também pode ser traduzido por «guardam», «entesouram» ou «escondem», com a ideia de conservar prudentemente o conhecimento.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico elíptico, literalmente: «mas a boca do insensato — ruína próxima». A expressão também pode ser entendida como «a boca do insensato está perto da ruína» ou «traz para perto a ruína». «Ruína» pode ainda significar «destruição», «terror» ou «consternação». A conjunção traduzida por «mas» também pode ser vertida por «e».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: חֲכָמִים
  choice: Os sábios
  rationale: O adjetivo substantivado no plural designa genericamente as pessoas sábias. Em português, «os sábios» é proverbial, natural e preserva a forma masculina plural do hebraico.
- source_word: יִצְפְּנוּ
  choice: acumulam
  rationale: O verbo צפן pode significar esconder, guardar ou entesourar. «Acumulam» comunica aqui a aquisição e preservação prudente do conhecimento sem sugerir ocultação enganosa.
- source_word: דָעַת
  choice: conhecimento
  rationale: É o equivalente direto e corrente de דָעַת no vocabulário sapiencial de Provérbios.
- source_word: וּפִי
  choice: mas a boca
  rationale: Embora ו possa ser simplesmente «e», o paralelismo contrapõe os sábios ao insensato; «mas» torna explícito esse valor adversativo provável.
- source_word: אֱוִיל
  choice: do insensato
  rationale: אֱוִיל caracteriza a pessoa moralmente obtusa e obstinada. «Insensato» é digno, compreensível e tradicional no gênero sapiencial.
- source_word: מְחִתָּה
  choice: ruína
  rationale: O substantivo admite os sentidos de ruína, destruição, terror ou consternação. No contexto da fala do insensato e de algo próximo, «ruína» expressa de modo conciso a calamidade iminente.
- source_word: קְרֹבָה
  choice: próxima
  rationale: Preserva o sentido predicativo de proximidade e a imagem hebraica de perigo iminente.
theological_decisions:
- issue: Relação da boca do insensato com a ruína
  choice: «anuncia ruína próxima»
  alternative: «é ruína próxima» / «traz para perto a ruína»
  rationale: 'O hebraico é elíptico: literalmente, «a boca do insensato — ruína próxima». A formulação escolhida produz português inteligível sem afirmar de modo categórico que a boca seja idêntica à ruína; a nota preserva as leituras possíveis.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo proverbial foi mantido com linguagem concisa e digna; a elipse difícil do segundo membro foi levemente explicitada, com as alternativas preservadas em nota.
