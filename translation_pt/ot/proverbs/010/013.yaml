  text: בְּ/שִׂפְתֵ֣י נָ֭בוֹן תִּמָּצֵ֣א חָכְמָ֑ה וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
translation:
  language: pt
  text: Nos lábios de quem tem discernimento encontra-se sabedoria, mas a vara é para as costas de quem não tem entendimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “carente de coração”; em hebraico, é uma expressão para quem carece de entendimento ou bom senso.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׂפְתֵי
  choice: Nos lábios de
  rationale: A preposição בְּ com “lábios” indica o lugar em que a sabedoria se manifesta, especialmente na fala; a formulação preserva a imagem hebraica e soa natural em português.
- source_word: נָבוֹן
  choice: quem tem discernimento
  rationale: O termo designa uma pessoa dotada de compreensão e discernimento. Esta formulação é proverbial, clara e evita tornar o masculino gramatical hebraico mais específico do que o sentido exige.
- source_word: תִּמָּצֵא
  choice: encontra-se
  rationale: O imperfeito nifal expressa aqui uma verdade geral, não necessariamente futura; o presente reflexo/passivo comunica bem esse valor proverbial.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É a tradução consagrada e contextualmente adequada do conceito central de חָכְמָה em Provérbios.
- source_word: וְשֵׁבֶט
  choice: mas a vara
  rationale: Embora וְ possa ser traduzido literalmente por “e”, o paralelismo é contrastivo. “Mas” explicita esse contraste, e “vara” preserva a imagem de disciplina ou castigo.
- source_word: לְגֵו
  choice: é para as costas
  rationale: גֵּו refere-se ao dorso ou às costas, o lugar atingido pela vara. O verbo “é” é suprido naturalmente na oração nominal portuguesa.
- source_word: חֲסַר לֵב
  choice: quem não tem entendimento
  rationale: A expressão significa literalmente “carente de coração”, mas “coração” funciona aqui como sede da compreensão e do juízo. A tradução comunica o sentido idiomático sem reduzir a expressão a mera falta de informação.
