translation_notes:
  register: Português moderno, claro e digno, com paralelismo próximo ao hebraico. Não se acrescentou nota para “vinho azedo”, pois “vinagre” comunica adequadamente o sentido lexical no contexto e a alternativa não é necessária para preservar ambiguidade relevante.
