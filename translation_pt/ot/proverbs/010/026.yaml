  text: Like vinegar to the teeth and smoke to the eyes[a], so is the sluggard to those who send him.
translation:
  language: pt
  text: Como vinagre para os dentes e fumaça para os olhos, assim é o preguiçoso para os que o enviam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹמֶץ
  choice: vinagre
  rationale: O substantivo designa algo azedo, comumente vinagre. “Vinagre” é o equivalente português mais direto e natural neste contraste sensorial.
- source_word: לַשִּׁנַּיִם
  choice: para os dentes
  rationale: A preposição ל indica relação ou efeito; “para os dentes” mantém a estrutura paralela da comparação em português.
- source_word: עָשָׁן
  choice: fumaça
  rationale: Equivalente lexical direto, preservando a imagem da irritação causada aos olhos.
- source_word: לָעֵינַיִם
  choice: para os olhos
  rationale: Mantém o paralelismo com “para os dentes” e expressa o efeito desagradável.
- source_word: כֵּן
  choice: assim é
  rationale: Introduz a aplicação da comparação e explicita naturalmente a cópula subentendida no hebraico.
- source_word: הֶעָצֵל
  choice: o preguiçoso
  rationale: O adjetivo substantivado descreve uma pessoa caracterizada pela preguiça. “O preguiçoso” é corrente, claro e preserva o tipo moral recorrente em Provérbios.
- source_word: לְשֹׁלְחָיו
  choice: para os que o enviam
  rationale: Preserva o referente plural do particípio e o objeto singular do sufixo, em formulação portuguesa natural.
