  naturalness: O português é moderno, claro e digno. A repetição de “anda” reproduz eficazmente o efeito do hebraico e soa natural em registro proverbial. “Torna tortuosos os seus caminhos” é levemente formal, mas apropriado ao gênero e compreensível internacionalmente.
