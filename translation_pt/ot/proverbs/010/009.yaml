  text: הוֹלֵ֣ךְ בַּ֭/תֹּם יֵ֣לֶךְ בֶּ֑טַח וּ/מְעַקֵּ֥שׁ דְּ֝רָכָ֗י/ו יִוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/009.yaml
  text: Whoever walks in integrity walks securely[a], but he who makes his ways crooked will be found out.
translation:
  language: pt
  text: 'Quem anda com integridade anda em segurança,

    mas quem torna tortuosos os seus caminhos será descoberto[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se tornará conhecido” ou “será exposto”. O hebraico pode indicar tanto que a pessoa de caminhos tortuosos será reconhecida pelo que é quanto que sua conduta será revelada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: Quem anda
  rationale: O particípio tem sentido genérico e proverbial. “Quem anda” preserva a metáfora hebraica do modo de viver sem restringir a afirmação a um indivíduo masculino.
- source_word: בַּתֹּם
  choice: com integridade
  rationale: תֹּם expressa inteireza moral, retidão ou caráter íntegro. “Com integridade” é natural em português e evita a ideia mais absoluta que “sem culpa” poderia sugerir.
- source_word: יֵלֶךְ
  choice: anda
  rationale: A repetição de “anda” mantém o paralelismo e a metáfora de caminhada presentes no hebraico.
- source_word: בֶּטַח
  choice: em segurança
  rationale: בֶּטַח indica segurança ou condição segura, mais do que mera confiança subjetiva. “Em segurança” se liga naturalmente a “anda”.
- source_word: וּמְעַקֵּשׁ
  choice: mas quem torna tortuosos
  rationale: O particípio de עקשׁ comunica a ação de entortar, torcer ou perverter. A formulação mantém o valor ativo e introduz com clareza o contraste proverbial.
- source_word: דְּרָכָיו
  choice: os seus caminhos
  rationale: O plural conserva a metáfora hebraica dos caminhos como conduta e modo de vida.
- source_word: יִוָּדֵעַ
  choice: será descoberto
  rationale: O nifal de ידע pode significar “ser conhecido”, “tornar-se conhecido” ou, no contexto, “ser descoberto”. A escolha comunica naturalmente que a conduta tortuosa não permanecerá oculta, enquanto a nota preserva a amplitude lexical.
