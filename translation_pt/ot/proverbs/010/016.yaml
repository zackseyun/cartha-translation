id: PRO.10.16
reference: Proverbs 10:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פְּעֻלַּ֣ת צַדִּ֣יק לְ/חַיִּ֑ים תְּבוּאַ֖ת רָשָׁ֣ע לְ/חַטָּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/016.yaml
  text: The labor of the righteous leads to life[c][b][a]; the produce of the wicked leads to sin.
translation:
  language: pt
  text: O trabalho do justo conduz à vida[a]; o ganho do perverso conduz ao pecado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é para a vida” ou “resulta em vida”. A preposição hebraica pode indicar finalidade ou resultado.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida por “pecado” também pode significar “oferta pelo pecado” em contextos sacrificiais; aqui, porém, o sentido é “pecado”.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּעֻלַּת
  choice: trabalho
  rationale: פְּעֻלָּה pode designar trabalho, atividade ou o resultado dela. “Trabalho” mantém o sentido amplo e forma um contraste natural com o que o perverso obtém.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo singular substantivado tem valor representativo. “O justo” é conciso, tradicional e natural em português.
- source_word: לְחַיִּים
  choice: conduz à vida
  rationale: A preposição לְ pode indicar finalidade ou resultado. “Conduz à vida” expressa essa direção sem excluir inteiramente a nuance de finalidade.
- source_word: תְּבוּאַת
  choice: ganho
  rationale: תְּבוּאָה pode significar produto, colheita, rendimento ou receita. Neste paralelismo sobre os frutos da atividade humana, “ganho” é claro e não restringe a imagem à agricultura.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O singular substantivado representa a pessoa caracterizada pela maldade. “O perverso” preserva o contraste moral com “o justo” em linguagem corrente e digna.
- source_word: לְחַטָּאת
  choice: conduz ao pecado
  rationale: Neste contexto sapiencial, חַטָּאת significa “pecado”. A formulação paralela “conduz ao” reproduz a força direcional ou resultativa de לְ.
theological_decisions:
- issue: Sentido de חַטָּאת
  choice: pecado
  alternative: oferta pelo pecado
  rationale: Embora חַטָּאת possa designar uma oferta pelo pecado em contextos sacrificiais, aqui não há contexto cúltico. A antítese sapiencial entre vida e pecado favorece claramente o sentido moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo foi mantido por meio da repetição de “conduz”. “Ganho” comunica de modo amplo o produto ou rendimento da atividade do perverso; opções como “produto”, “rendimento” ou “colheita” permanecem lexicalmente possíveis.
