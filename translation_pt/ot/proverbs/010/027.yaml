id: PRO.10.27
reference: Proverbs 10:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה תּוֹסִ֣יף יָמִ֑ים וּ/שְׁנ֖וֹת רְשָׁעִ֣ים תִּקְצֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/027.yaml
  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
translation:
  language: pt
  text: O temor de Yahweh acrescenta dias[a], mas os anos dos perversos serão abreviados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prolonga os dias”. O verbo hebraico significa literalmente “acrescenta” e tem “dias” como objeto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: temor de
  rationale: Preserva a construção hebraica e seu peso na literatura sapiencial, onde indica temor reverente diante de Deus sem reduzi-lo a mero respeito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do tetragrama, em vez de substituí-lo por um título.
- source_word: תּוֹסִיף
  choice: acrescenta
  rationale: Representa diretamente o hifil de יסף, 'acrescentar', e mantém 'dias' como objeto; a ideia contextual de prolongar a vida é indicada em nota.
- source_word: יָמִים
  choice: dias
  rationale: Mantém a imagem concreta do hebraico e o paralelismo poético com 'anos' no segundo membro.
- source_word: וּ/שְׁנוֹת
  choice: mas os anos de
  rationale: Embora ו seja formalmente 'e', o paralelismo antitético justifica o valor adversativo natural de 'mas' em português.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Designa pessoas moralmente más na literatura sapiencial; 'perversos' é corrente, conciso e mantém o plural representativo.
- source_word: תִּקְצֹרְנָה
  choice: serão abreviados
  rationale: Expressa o resultado de se tornarem curtos e concorda naturalmente com 'anos', sem acrescentar um agente não expresso no hebraico.
theological_decisions:
- issue: Natureza da afirmação proverbial sobre longevidade
  choice: Manter a formulação direta como princípio geral de sabedoria, sem apresentá-la explicitamente como garantia absoluta.
  alternative: Interpretá-la como promessa incondicional de vida longa para toda pessoa que teme a Deus e de morte precoce para todo perverso.
  rationale: O texto formula um padrão moral característico da sabedoria bíblica. A tradução conserva sua força e também a tensão com as exceções observadas em outros textos, sem inserir qualificações no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo entre “dias” e “anos” e mantém o nome divino Yahweh.
