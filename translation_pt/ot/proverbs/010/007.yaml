  text: זֵ֣כֶר צַ֭דִּיק לִ/בְרָכָ֑ה וְ/שֵׁ֖ם רְשָׁעִ֣ים יִרְקָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/007.yaml
  text: The memory of the righteous is a blessing[a], but the name of the wicked will rot.
translation:
  language: pt
  text: A memória do justo é uma bênção[a], mas o nome dos perversos apodrecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A lembrança do justo é para bênção”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: memória
  rationale: O substantivo pode indicar memória, lembrança ou menção. “Memória” é natural em português e forma um contraste adequado com “nome” na segunda linha.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado designa genericamente a pessoa justa. O singular preserva a forma e a concisão do hebraico.
- source_word: לִבְרָכָה
  choice: é uma bênção
  rationale: A expressão é literalmente “para bênção”. Em português corrente, a construção predicativa comunica com clareza que a memória do justo é considerada bendita ou benéfica, sem ampliar o texto.
- source_word: שֵׁם
  choice: nome
  rationale: “Nome” é o equivalente direto e conserva o idioma hebraico, que pode abranger reputação e legado sem restringir o sentido a apenas uma dessas ideias.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O plural substantivado indica pessoas moralmente perversas. “Os perversos” é conciso, atual e adequado ao vocabulário sapiencial.
- source_word: יִרְקָב
  choice: apodrecerá
  rationale: O verbo descreve literalmente apodrecimento ou decomposição. “Apodrecerá” mantém a imagem concreta e forte do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva o paralelismo entre “memória” e “nome” e a imagem vívida de apodrecimento.
