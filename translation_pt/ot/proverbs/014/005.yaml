source:
  edition: WLC
  text: עֵ֣ד אֱ֭מוּנִים לֹ֣א יְכַזֵּ֑ב וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
translation:
  language: pt
  text: A testemunha fiel não mente, mas a testemunha falsa exala mentiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “profere falsidades”. O verbo hebraico retrata as mentiras como algo exalado ou expelido.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: testemunha
  rationale: O substantivo designa quem presta testemunho; “testemunha” é o termo jurídico e moral natural em português e funciona nos dois membros do provérbio.
- source_word: אֱמוּנִים
  choice: fiel
  rationale: A forma plural abstrata ou intensiva qualifica a testemunha como digna de confiança. “Fiel” é conciso, natural e preserva a dimensão moral do termo.
- source_word: לֹא יְכַזֵּב
  choice: não mente
  rationale: Neste contexto de testemunho, o Piel de כזב se refere a falar falsamente. “Não mente” comunica isso de modo direto e idiomático.
- source_word: וְיָפִיחַ
  choice: mas ... sopra
  rationale: A conjunção introduz o contraste entre os dois membros e, por isso, é traduzida por “mas”. “Sopra” preserva a imagem vívida do Hifil de פוח, que retrata as falsidades como algo exalado ou expelido.
- source_word: כְּזָבִים
  choice: mentiras
  rationale: O plural corresponde ao hebraico e, com “sopra”, sugere a emissão repetida de declarações falsas.
- source_word: עֵד שָׁקֶר
  choice: a testemunha falsa
  rationale: A expressão designa alguém cujo testemunho é falso. “Testemunha falsa” é clara, idiomática e mantém a formulação bíblica tradicional sem soar arcaica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo antitético foi mantido, bem como a metáfora concreta de “soprar” mentiras.
