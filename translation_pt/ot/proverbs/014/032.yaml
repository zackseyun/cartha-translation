source:
  edition: WLC
  text: בְּֽ֭/רָעָת/וֹ יִדָּחֶ֣ה רָשָׁ֑ע וְ/חֹסֶ֖ה בְ/מוֹת֣/וֹ צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/032.yaml
  text: By his evil the wicked is driven away[c][b][a], but the righteous finds refuge in his death.
translation:
  language: pt
  text: Por sua maldade, o perverso é derrubado[a], mas o justo encontra refúgio em sua morte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em sua calamidade, o perverso é derrubado”. A palavra hebraica pode significar tanto “maldade” como “calamidade” ou “desastre”, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em sua morte”; também pode ser entendido como “ao morrer” ou “quando morre”. Outra tradução possível de “encontra refúgio” é “busca refúgio”. Algumas versões explicam a frase como “tem esperança ao morrer”, mas o hebraico não emprega diretamente a palavra “esperança”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָעָתוֹ
  choice: Por sua maldade
  rationale: רָעָה pode indicar maldade moral ou calamidade. A associação com רָשָׁע e o contraste ético com o justo favorecem aqui o sentido moral; a preposição בְּ é entendida como causal ou instrumental. A alternativa contextual é preservada em nota.
- source_word: יִדָּחֶה
  choice: é derrubado
  rationale: 'O nifal expressa ação sofrida: ser impelido, afastado ou lançado abaixo. “É derrubado” conserva a voz passiva e comunica naturalmente a ruína, sem especificar além do hebraico como ela ocorre.'
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado singular representa um tipo proverbial. “O perverso” mantém o contraste ético com “o justo” em português natural e digno.
- source_word: וְחֹסֶה
  choice: encontra refúgio
  rationale: O particípio de חסה pode denotar buscar ou encontrar refúgio. “Encontra refúgio” exprime o resultado sem exigir que se explicite o objeto da confiança, ausente no texto.
- source_word: בְמוֹתוֹ
  choice: em sua morte
  rationale: A formulação reproduz de perto a expressão compacta hebraica e preserva sua dificuldade interpretativa. Leituras temporais como “ao morrer” são possíveis e constam da nota.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado designa a pessoa justa como tipo proverbial e forma um paralelo direto e natural com “o perverso”.
theological_decisions:
- issue: Se o versículo afirma confiança além da morte ou segurança no momento da morte
  choice: “encontra refúgio em sua morte”, preservando a ambiguidade
  alternative: “tem esperança ao morrer” ou “está seguro quando morre”
  rationale: O hebraico não contém uma palavra explícita para “esperança” nem define a natureza do refúgio. A tradução mantém a tensão teológica sem transformar uma interpretação possível em afirmação textual.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial conciso. “Perverso” e “justo” funcionam como substantivos genéricos. A construção incomum “em sua morte” foi mantida deliberadamente para conservar a ambiguidade do original, com esclarecimento em nota.
