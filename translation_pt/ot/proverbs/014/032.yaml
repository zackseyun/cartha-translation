  source_fidelity: 'O texto português representa adequadamente o hebraico: “Por sua maldade” preserva a leitura causal/instrumental de בְּרָעָתוֹ, “o perverso é derrubado” mantém a passiva de יִדָּחֶה, e a segunda linha conserva a formulação deliberadamente concisa e ambígua “encontra refúgio em sua morte”. Não introduz “esperança” nem especifica o objeto do refúgio, elementos ausentes do texto hebraico.'
  naturalness: O português é moderno, claro e apropriado ao registro sapiencial. “O perverso” e “o justo” soam naturais como tipos proverbiais, e o paralelismo é conciso. Embora “em sua morte” seja uma construção marcada em português, ela é compreensível e justificadamente mantém a ambiguidade formal do hebraico; a nota oferece alternativas idiomáticas.
  terminology: “Maldade”, “perverso”, “justo” e “refúgio” são escolhas estáveis, dignas e semanticamente adequadas. “Derrubado” é uma representação aceitável de יִדָּחֶה no contexto de ruína, sem impor um mecanismo excessivamente específico. As notas distinguem corretamente a alternativa “calamidade/desastre” e evitam transformar a possível leitura de esperança na morte em texto principal.
