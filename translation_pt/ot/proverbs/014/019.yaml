  text: שַׁח֣וּ רָ֭עִים לִ/פְנֵ֣י טוֹבִ֑ים וּ֝/רְשָׁעִ֗ים עַֽל שַׁעֲרֵ֥י צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
translation:
  language: pt
  text: Os maus se curvam diante dos bons[a], e os perversos, às portas do justo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se prostram diante dos bons”. O verbo hebraico pode indicar um ato mais profundo de curvar-se até o chão.'
    reason: lexical_alternative
  - marker: b
    text: Estar “às portas do justo” pode sugerir que os perversos chegam em situação de dependência ou súplica, ou reconhecendo a posição do justo.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁחוּ
  choice: se curvam
  rationale: O verbo שׁחה descreve curvar-se profundamente ou prostrar-se. “Se curvam” conserva a imagem de humilhação ou submissão sem determinar se o ato é voluntário ou forçado.
- source_word: רָעִים
  choice: os maus
  rationale: O adjetivo plural substantivado designa pessoas más. “Os maus” é conciso, natural e adequado ao contraste proverbial.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A preposição indica posição perante ou na presença de alguém; “diante de” se ajusta naturalmente à ação de curvar-se.
- source_word: טוֹבִים
  choice: os bons
  rationale: O adjetivo plural substantivado refere-se a pessoas boas. “Os bons” mantém o paralelismo antitético com “os maus” sem acrescentar a ideia específica de retidão.
- source_word: וּרְשָׁעִים
  choice: e os perversos
  rationale: רְשָׁעִים é um termo característico da literatura sapiencial para os que agem de modo culpável e contrário à justiça. “Perversos” distingue o termo de רָעִים e preserva seu peso moral.
- source_word: עַל
  choice: às
  rationale: Com “portas”, עַל indica localização junto a elas. A contração “às” expressa de modo natural “junto às portas” no contexto.
- source_word: שַׁעֲרֵי
  choice: portas
  rationale: O plural construto significa literalmente “portas de”. A forma plural foi preservada e pode evocar tanto entradas quanto o espaço social associado a elas.
- source_word: צַדִּיק
  choice: do justo
  rationale: O singular substantivado representa uma pessoa justa. “Do justo” é compacto, natural na linguagem sapiencial e conserva o contraste moral com “os perversos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial compacta. O paralelismo hebraico foi preservado, assim como o plural “portas” e a distinção entre רָעִים (“maus”) e רְשָׁעִים (“perversos”).
