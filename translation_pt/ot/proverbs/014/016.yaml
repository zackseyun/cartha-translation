base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/016.yaml
  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
translation:
  language: pt
  text: O sábio teme e se desvia do mal, mas o tolo age temerariamente e é confiante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se enfurece” ou “ultrapassa os limites”. O verbo hebraico é difícil e pode descrever um comportamento impetuoso e sem freio.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: o sábio
  rationale: O adjetivo substantivado designa proverbialmente a pessoa sábia; a forma masculina singular é preservada de modo natural em português.
- source_word: יָרֵא
  choice: teme
  rationale: Preserva o sentido básico do verbo e, neste contexto sapiencial, sugere temor prudente diante do mal sem explicitar um objeto que o hebraico não fornece.
- source_word: וְסָר
  choice: e se desvia
  rationale: Expressa naturalmente a ação de afastar-se ou mudar de rumo para evitar algo.
- source_word: מֵרָע
  choice: do mal
  rationale: Mantém tanto a dimensão moral predominante no contexto quanto a possível associação com aquilo que é nocivo.
- source_word: כְסִיל
  choice: o tolo
  rationale: Equivalente tradicional e corrente para a categoria moral e intelectual característica da literatura sapiencial.
- source_word: מִתְעַבֵּר
  choice: se exalta
  rationale: O hitpael é raro e difícil; 'se exalta' preserva melhor a imagem possível de exceder limites ou agir com arrogância, sem eliminar as alternativas de ira ou imprudência, registradas em nota.
- source_word: וּבוֹטֵחַ
  choice: e confia em si mesmo
  rationale: בטח indica confiança ou sensação de segurança. Sem objeto expresso e em paralelo negativo com o comportamento do tolo, a formulação comunica confiança indevida sem acrescentar a ideia distinta de descuido.
