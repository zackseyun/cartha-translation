revisions:
- from: Não se desviam os que planejam o mal? Mas amor leal e fidelidade pertencem aos que planejam o bem.[a]
  to: Os que planejam o mal não se desviam? Mas amor leal e fidelidade acompanham os que planejam o bem.[a]
  rationale: A revisão melhora a fluidez da pergunta retórica e substitui uma formulação possessiva por “acompanham”, que torna legível a oração nominal hebraica sem definir em excesso se amor leal e fidelidade são qualidades praticadas pelos planejadores do bem ou benefícios que os alcançam. Mantêm-se o paralelismo “planejam o mal / planejam o bem”, os termos éticos e a nota lexical.
