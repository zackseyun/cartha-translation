  text: הֲֽ/לוֹא יִ֭תְעוּ חֹ֣רְשֵׁי רָ֑ע וְ/חֶ֥סֶד וֶ֝/אֱמֶ֗ת חֹ֣רְשֵׁי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/022.yaml
  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
translation:
  language: pt
  text: Os que planejam o mal não se desviam? Mas amor leal e fidelidade acompanham os que planejam o bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bondade e verdade”, ou “misericórdia e fidelidade”. O par hebraico frequentemente designa amor leal unido à confiabilidade ou à verdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção preserva sua força interrogativa em português natural.
- source_word: יִתְעוּ
  choice: se desviam
  rationale: Expressa afastar-se do caminho certo ou errar, mantendo a imagem moral comum na literatura sapiencial.
- source_word: חֹרְשֵׁי רָע
  choice: os que planejam o mal
  rationale: O particípio de חרשׁ indica conceber ou tramar deliberadamente; “planejam” comunica intenção sem acrescentar a conotação clandestina mais forte de “tramam”.
- source_word: רָע
  choice: o mal
  rationale: Preserva o contraste ético direto com טוֹב.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Comunica bondade amorosa, compromisso e constância relacional, dimensões frequentes de חֶסֶד.
- source_word: אֱמֶת
  choice: fidelidade
  rationale: No par חֶסֶד וֶאֱמֶת, designa com naturalidade confiabilidade e constância, embora “verdade” continue lexicalmente possível.
- source_word: חֹרְשֵׁי טוֹב
  choice: os que planejam o bem
  rationale: Repete o mesmo verbo usado na primeira metade e conserva o paralelismo deliberado entre planejar o mal e planejar o bem.
- source_word: טוֹב
  choice: o bem
  rationale: O adjetivo tem função substantiva e forma o contraste conciso com “o mal”.
theological_decisions:
- issue: Sentido da oração nominal וְחֶסֶד וֶאֱמֶת חֹרְשֵׁי טוֹב
  choice: “amor leal e fidelidade pertencem aos que planejam o bem”
  alternative: “amor leal e fidelidade encontram os que planejam o bem” ou “há amor leal e fidelidade para os que planejam o bem”
  rationale: O hebraico não traz verbo explícito. “Pertencem a” torna a frase legível sem decidir rigidamente se essas qualidades são praticadas por tais pessoas ou recebidas por elas.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo compacto do provérbio foi preservado, bem como a pergunta retórica e a ambiguidade da oração hebraica sem verbo explícito.
