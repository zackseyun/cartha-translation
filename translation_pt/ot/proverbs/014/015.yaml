  text: פֶּ֭תִי יַאֲמִ֣ין לְ/כָל דָּבָ֑ר וְ֝/עָר֗וּם יָבִ֥ין לַ/אֲשֻׁרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/015.yaml
  text: A simple man believes every word[a], but a prudent man considers his steps.
translation:
  language: pt
  text: O ingênuo acredita em toda palavra[a], mas o prudente considera os seus passos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acredita em tudo” ou “acredita em todo assunto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתִי
  choice: o ingênuo
  rationale: Em Provérbios, designa a pessoa inexperiente e facilmente influenciável, não alguém de pouca inteligência. “Ingênuo” comunica essa categoria de modo natural no português atual.
- source_word: יַאֲמִין
  choice: acredita
  rationale: O hifil de אמן indica aqui aceitar algo como verdadeiro ou digno de crédito; “acredita” corresponde naturalmente ao contexto.
- source_word: לְכָל דָּבָר
  choice: em toda palavra
  rationale: דָּבָר pode significar “palavra”, “coisa” ou “assunto”. “Toda palavra” preserva a imagem concreta do hebraico e sugere aceitar indiscriminadamente o que se diz, enquanto a nota mantém as alternativas mais amplas.
- source_word: עָרוּם
  choice: o prudente
  rationale: Neste contexto sapiencial, עָרוּם tem sentido positivo de sagacidade e discernimento, não de astúcia enganosa. “Prudente” expressa bem o contraste com o ingênuo.
- source_word: יָבִין
  choice: considera
  rationale: בין denota compreender ou discernir; ligado aos passos de alguém, expressa reflexão prática e cuidadosa.
- source_word: לַאֲשֻׁרוֹ
  choice: os seus passos
  rationale: O substantivo se refere a passos ou ao curso seguido. A formulação conserva a metáfora hebraica para a conduta e o rumo de vida.
