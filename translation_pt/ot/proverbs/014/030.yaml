  text: A tranquil heart is life to the body[b][a], but jealousy is rottenness to the bones.
translation:
  language: pt
  text: O coração sereno[a] é vida para o corpo, mas a inveja[b] é podridão para os ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um coração saudável é vida para o corpo.” O termo hebraico traduzido como “sereno” está mais literalmente relacionado à cura ou à saúde.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ciúme”. A palavra hebraica pode indicar inveja, ciúme ou zelo, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי
  choice: vida
  rationale: O plural construto de חַיִּים é usado idiomaticamente com o sentido de “vida”; na frase nominal do provérbio, “é vida” expressa com naturalidade a relação predicativa.
- source_word: בְשָׂרִים
  choice: o corpo
  rationale: Embora o termo signifique literalmente “carnes”, aqui se refere ao organismo físico. “Corpo” comunica o sentido contextual sem sugerir conotações teológicas estranhas ao provérbio.
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica e designa aqui a disposição interior e emocional da pessoa.
- source_word: מַרְפֵּא
  choice: sereno
  rationale: O substantivo se relaciona a cura, saúde ou remédio. No contexto, caracteriza um coração saudável e apaziguado; “sereno” é natural em português, enquanto a relação lexical com cura é preservada em nota.
- source_word: וּרְקַב
  choice: mas ... é podridão
  rationale: A conjunção introduz o contraste entre as duas metades. “Podridão” conserva a imagem concreta e intensa de deterioração.
- source_word: עֲצָמוֹת
  choice: os ossos
  rationale: Tradução literal que preserva a imagem da estrutura física profunda e, por extensão, da vitalidade interior.
- source_word: קִנְאָה
  choice: inveja
  rationale: O termo pode significar inveja, ciúme ou zelo. Neste paralelismo negativo, “inveja” descreve com clareza o ressentimento diante do bem alheio, sem eliminar a alternativa “ciúme”, registrada em nota.
