  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/012.yaml
  text: There is a way that seems right to a man[a], but its end is the ways of death.
translation:
  language: pt
  text: Há caminho que parece certo ao homem,[a] mas o seu fim são caminhos de morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «diante de um homem»; expressão idiomática para aquilo que parece certo segundo a sua própria percepção.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há
  rationale: A partícula existencial introduz uma verdade geral; “Há” é conciso e natural em português.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Preserva a imagem concreta e o sentido metafórico de modo de viver ou proceder, além da ligação lexical com o plural posterior.
- source_word: יָשָׁר
  choice: certo
  rationale: Neste contexto, indica aquilo que é avaliado como correto pela própria pessoa, não apenas algo reto em sentido espacial.
- source_word: לִפְנֵי אִישׁ
  choice: parece certo ao homem
  rationale: A expressão literalmente significa “diante de um homem”, mas funciona idiomaticamente para aquilo que se mostra correto segundo a percepção dele. A formulação é natural em português e mantém o masculino singular representativo do hebraico.
- source_word: וְאַחֲרִיתָהּ
  choice: mas, no fim
  rationale: A conjunção tem força contrastiva, e אַחֲרִיתָהּ aponta para o fim ou desfecho do caminho.
- source_word: דַּרְכֵי
  choice: conduz a caminhos
  rationale: Mantém o plural “caminhos” e torna explícita, de modo idiomático em português, a relação de destino implicada entre o fim do caminho e a morte.
- source_word: מָוֶת
  choice: morte
  rationale: Tradução direta que conserva a advertência forte e não restringe o termo a ruína, destruição ou somente morte física.
theological_decisions:
- issue: Masculino genérico אִישׁ
  choice: ao homem
  alternative: a uma pessoa
  rationale: Mantém a forma masculina singular representativa do texto hebraico sem deixar de comunicar uma máxima universal.
- issue: Natureza da “morte” no contexto sapiencial
  choice: morte
  alternative: ruína
  rationale: O hebraico diz “morte”; a tradução preserva sua amplitude e não decide se a referência é exclusivamente física, moral ou escatológica.
- issue: Plural דַּרְכֵי מָוֶת
  choice: caminhos de morte
  alternative: caminho da morte
  rationale: O plural do texto-fonte é mantido, preservando a possível ideia de múltiplos desfechos ou manifestações associados à morte.
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira e alcance internacional. A ordem foi ajustada para soar natural, sem eliminar o contraste nem o plural incomum do hebraico.
