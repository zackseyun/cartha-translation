  text: בְּ/רָב עָ֥ם הַדְרַת מֶ֑לֶךְ וּ/בְ/אֶ֥פֶס לְ֝אֹ֗ם מְחִתַּ֥ת רָזֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/028.yaml
  text: In a multitude of people is a king’s splendor[a], but without people, a ruler’s ruin.
translation:
  language: pt
  text: Na multidão do povo está o esplendor do rei, mas, na falta de povo, está a ruína[a] do governante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terror” ou “consternação”. O termo hebraico pode indicar tanto pavor quanto ruína ou colapso destrutivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב עָם
  choice: Na multidão do povo
  rationale: Expressa a circunstância de abundância numérica indicada por בְּ־ com רָב e preserva o sentido coletivo e político de עָם.
- source_word: הַדְרַת מֶלֶךְ
  choice: o esplendor do rei
  rationale: הַדְרָה pode indicar esplendor, majestade ou honra; “esplendor” mantém a imagem da grandeza pública que um povo numeroso confere ao rei.
- source_word: וּבְאֶפֶס לְאֹם
  choice: mas, na falta de povo
  rationale: אֶפֶס indica ausência ou inexistência, e לְאֹם designa um povo ou população. “Povo” evita a ideia moderna e mais restrita de um Estado-nação, enquanto “mas” explicita o contraste entre os dois membros.
- source_word: מְחִתַּת
  choice: ruína
  rationale: O substantivo pode indicar pavor, consternação ou colapso destrutivo. “Ruína” forma uma antítese clara com “esplendor”, sem ocultar as alternativas, registradas em nota.
- source_word: רָזוֹן
  choice: do governante
  rationale: O termo designa alguém investido de autoridade, como governante ou príncipe. “Governante” é amplo e não força uma distinção hierárquica rígida em relação ao rei.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo compacto. A repetição de “povo” torna explícito o contraste hebraico sem sugerir necessariamente um Estado-nação formal.
