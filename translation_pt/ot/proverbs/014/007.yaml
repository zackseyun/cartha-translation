  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
translation:
  language: pt
  text: Afaste-se da presença de um homem insensato, pois não perceberá palavras de conhecimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Vá de diante de um homem insensato, e não conhecerá lábios de conhecimento.” O hebraico pode apresentar a segunda oração como consequência da ordem ou como a razão para afastar-se.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לֵךְ מִנֶּגֶד
  choice: Afaste-se da presença de
  rationale: O imperativo לֵךְ, unido a מִנֶּגֶד, exorta o ouvinte a retirar-se de diante de alguém. A formulação mantém a ideia espacial do hebraico em português natural.
- source_word: לְאִישׁ כְּסִיל
  choice: do homem insensato
  rationale: Preserva אִישׁ, “homem”, e traduz כְּסִיל pelo termo sapiencial “insensato”, que indica falta moral e prática de sabedoria, não mera limitação intelectual.
- source_word: וּבַל יָדַעְתָּ
  choice: pois você não reconhecerá nele
  rationale: בַל nega poeticamente o verbo, e o perfeito pode ter valor de resultado geral no provérbio. “Pois” explicita a relação causal; “reconhecerá” preserva a possível nuance perceptiva de ידע. “Nele” torna natural em português a ligação contextual com o insensato, sem eliminar a ambiguidade, registrada em nota.
- source_word: שִׂפְתֵי דָעַת
  choice: palavras de conhecimento
  rationale: A expressão literal é “lábios de conhecimento”, metonímia hebraica para a fala. “Palavras de conhecimento” comunica essa imagem funcionalmente e com clareza no português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “Insensato” mantém o vocabulário sapiencial; “palavras de conhecimento” evita a rigidez pouco natural de “lábios de conhecimento”, enquanto a nota preserva a forma e a ambiguidade do hebraico.
