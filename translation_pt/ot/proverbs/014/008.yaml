id: PRO.14.8
reference: Proverbs 14:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
translation:
  language: pt
  text: A sabedoria do prudente está em discernir o seu caminho[a], mas a insensatez dos tolos é engano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “compreender o seu caminho”. “Caminho” também pode indicar a conduta ou o rumo da vida.'
    reason: lexical_alternative
  - marker: b
    text: “Engano” pode referir-se tanto à conduta enganosa quanto ao autoengano que caracteriza a insensatez dos tolos.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: חָכְמַת עָרוּם
  choice: A sabedoria do prudente
  rationale: 'Preserva a relação de construto e o sentido positivo de עָרוּם no contexto sapiencial: pessoa prudente, sensata e capaz de avaliar bem.'
- source_word: הָבִין
  choice: está em discernir
  rationale: A forma verbal define em que consiste a sabedoria do prudente. “Discernir” comunica avaliação atenta, não apenas compreensão intelectual.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: Mantém o singular do hebraico e a amplitude metafórica de דֶּרֶךְ, que pode indicar conduta, rumo ou curso de vida.
- source_word: וְאִוֶּלֶת כְּסִילִים
  choice: mas a insensatez dos tolos
  rationale: “Mas” explicita o contraste entre os dois membros do provérbio; “insensatez” e “tolos” preservam a terminologia sapiencial concreta.
- source_word: מִרְמָה
  choice: engano
  rationale: Termo conciso que conserva a ambiguidade entre conduta enganosa e autoengano, sem restringir o hebraico a apenas uma dessas ideias.
theological_decisions:
- issue: Sufixo masculino singular em דַּרְכּוֹ
  choice: o seu caminho
  alternative: o caminho dele; o próprio caminho
  rationale: A construção portuguesa mantém o referente singular representativo sem acrescentar uma especificação de gênero que o possessivo não exige naturalmente.
- issue: Valor moral de עָרוּם
  choice: prudente
  alternative: astuto; sagaz
  rationale: O paralelismo contrapõe sabedoria e insensatez, favorecendo aqui o sentido positivo de cautela inteligente, e não o de esperteza maliciosa.
- issue: Alcance de מִרְמָה
  choice: engano, sem determinar seu objeto
  alternative: fraude praticada contra outros; autoengano
  rationale: O texto hebraico não declara se os tolos enganam outros, enganam a si mesmos ou se sua insensatez é enganosa em sentido geral; a tradução preserva essa tensão.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com fluência brasileira. A formulação mantém o paralelismo antitético e o tom sentencioso do provérbio.
