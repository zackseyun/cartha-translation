  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
translation:
  language: pt
  text: A mais sábia das mulheres constrói sua casa[a][b], mas a insensata a derruba com as próprias mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda mulher sábia constrói sua casa”. A expressão hebraica inicial também pode ser entendida genericamente, como uma afirmação sobre toda mulher sábia, em vez de como superlativo.'
    reason: lexical_alternative
  - marker: b
    text: “Casa” também pode incluir o sentido de “lar”, “família” ou “unidade doméstica”, e não apenas o edifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  choice: a mais sábia das mulheres
  rationale: A construção plural seguida do verbo feminino singular admite valor idiomático superlativo. A tradução preserva o contraste com a figura feminina singular da segunda linha, sem ocultar na nota a possível leitura genérica.
- source_word: בָּנְתָה
  choice: constrói
  rationale: Embora a forma hebraica seja perfeita, no provérbio ela expressa uma verdade geral; o presente comunica naturalmente esse valor gnômico em português.
- source_word: בֵיתָהּ
  choice: sua casa
  rationale: Mantém a imagem concreta do hebraico e também permite a extensão metafórica para o lar, a família ou a unidade doméstica.
- source_word: אִוֶּלֶת
  choice: a insensata
  rationale: O substantivo feminino, ligado a um verbo no feminino singular e em paralelo com a primeira linha, é expresso naturalmente como referência pessoal. “Insensata” conserva o contraste sapiencial sem introduzir explicação excessiva.
- source_word: בְּיָדֶיהָ
  choice: com as próprias mãos
  rationale: A expressão é instrumental e enfatiza que ela mesma é responsável pela destruição.
- source_word: תֶהֶרְסֶנּוּ
  choice: a derruba
  rationale: O verbo significa demolir ou derrubar. “Derruba” forma um contraste vívido e direto com “constrói”; o pronome retoma “casa”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo concreto entre construir e derrubar. Os marcadores seguem a ordem natural de leitura no texto, e as notas preservam a ambiguidade lexical do hebraico.
