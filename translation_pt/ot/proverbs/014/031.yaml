  text: עֹ֣שֵֽׁק דָּ֭ל חֵרֵ֣ף עֹשֵׂ֑/הוּ וּ֝/מְכַבְּד֗/וֹ חֹנֵ֥ן אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
translation:
  language: pt
  text: Quem oprime o pobre insulta aquele que o fez[a], mas quem trata o necessitado com bondade honra a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível para a segunda parte: “mas quem honra o pobre trata o necessitado com bondade”. O pronome hebraico em “honra” pode se referir tanto ao pobre quanto àquele que o fez; o texto principal entende que se refere a Deus por causa do paralelismo.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  choice: Quem oprime
  rationale: O particípio qal funciona de modo substantivado e exprime opressão ou exploração injusta; a oração relativa indefinida comunica naturalmente o caráter proverbial.
- source_word: דָּל
  choice: o pobre
  rationale: O termo pode indicar alguém pobre, fraco ou socialmente vulnerável; “o pobre” é claro e idiomático neste contexto.
- source_word: חֵרֵף
  choice: insulta
  rationale: O verbo denota afrontar, desprezar ou tratar com desdém; “insulta” expressa de maneira atual a afronta dirigida ao Criador.
- source_word: עֹשֵׂהוּ
  choice: aquele que o fez
  rationale: O sufixo remete naturalmente ao pobre. A expressão preserva o sentido de “seu Criador” em linguagem portuguesa fluente e evita possível ambiguidade quanto ao antecedente do possessivo.
- source_word: וּמְכַבְּדוֹ
  choice: honra a Deus
  rationale: O sufixo pronominal pode apontar para o Criador mencionado na primeira metade ou para o pobre. O texto principal explicita Deus como referente, leitura favorecida pelo paralelismo antitético, e a nota registra a alternativa.
- source_word: חֹנֵן
  choice: trata ... com bondade
  rationale: O particípio comunica conceder favor, agir com graça ou mostrar benevolência. Esta formulação é natural, atual e conserva a ação concreta para com o necessitado.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: O termo enfatiza carência ou indigência; “necessitado” preserva uma distinção semântica em relação a דָּל, traduzido como “pobre”.
theological_decisions:
- issue: Referente do sufixo em וּמְכַבְּדוֹ
  choice: O pronome se refere a Deus, isto é, àquele que fez o pobre; assim, tratar o necessitado com bondade honra a Deus.
  alternative: 'O pronome se refere ao pobre: “mas quem honra o pobre trata o necessitado com bondade”.'
  rationale: O paralelismo antitético favorece a correspondência entre insultar o Criador pela opressão do pobre e honrá-lo pela bondade para com o necessitado. Como a forma hebraica admite outro antecedente, a ambiguidade é documentada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aquele que o fez” reproduz a ideia de Criador sem recorrer a uma construção possessiva potencialmente ambígua. A explicitação “a Deus” torna claro o referente adotado no texto principal, enquanto a nota preserva a ambiguidade genuína do hebraico.
