  text: בְּֽ/פִי אֱ֭וִיל חֹ֣טֶר גַּאֲוָ֑ה וְ/שִׂפְתֵ֥י חֲ֝כָמִ֗ים תִּשְׁמוּרֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
translation:
  language: pt
  text: Na boca do insensato há uma vara[a] de orgulho, mas os lábios dos sábios os guardam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um broto”. A palavra hebraica traduzida por “vara” também pode significar “broto” ou “ramo”; neste contexto, “vara” parece adequar-se melhor à advertência sobre a fala orgulhosa.
    reason: lexical_alternative
  - marker: b
    text: 'O pronome “os” provavelmente se refere aos próprios sábios: seus lábios, isto é, sua fala, os protegem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפִי
  choice: Na boca de
  rationale: A preposição בְּ com פֶּה é tomada em sentido locativo. A formulação conserva a imagem hebraica daquilo que se encontra na boca, isto é, na fala.
- source_word: אֱוִיל
  choice: insensato
  rationale: Em Provérbios, o termo descreve alguém moralmente obtuso e obstinado, não apenas uma pessoa de pouca inteligência. “Insensato” é corrente e digno em português.
- source_word: חֹטֶר
  choice: vara
  rationale: Embora o substantivo também possa designar um broto ou ramo, “vara” preserva aqui a provável imagem de algo que fere ou castiga, sem explicitar além do hebraico como a metáfora funciona.
- source_word: גַּאֲוָה
  choice: orgulho
  rationale: É o equivalente direto para a ideia de orgulho, altivez ou arrogância. A construção compacta “vara de orgulho” mantém a tensão da metáfora hebraica.
- source_word: וְשִׂפְתֵי
  choice: mas os lábios de
  rationale: O וְ introduz um contraste entre o insensato e os sábios; por isso, “mas” exprime naturalmente a relação entre os dois membros. “Lábios” conserva o paralelismo poético com “boca”.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O adjetivo plural substantivado designa, como classe representativa, aqueles que vivem com sabedoria.
- source_word: תִּשְׁמוּרֵם
  choice: os guardam
  rationale: O verbo שׁמר significa guardar, proteger ou preservar, e o sufixo é masculino plural, “os”. O presente exprime com naturalidade a verdade geral do provérbio, enquanto o pronome mantém a formulação condensada do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Foram mantidas as imagens paralelas de “boca” e “lábios”, bem como a metáfora deliberadamente compacta “vara de orgulho”. O presente verbal dá ao enunciado o caráter geral típico de um provérbio.
