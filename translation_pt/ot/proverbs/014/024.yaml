base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
translation:
  language: pt
  text: 'A coroa dos sábios é a sua riqueza,

    mas a insensatez dos tolos é insensatez.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas versões antigas e alguns intérpretes trazem: “mas a riqueza dos tolos é insensatez”. O Texto Massorético diz literalmente: “a insensatez dos tolos é insensatez”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: Preserva a metáfora hebraica de honra e distinção visível e é natural em português.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: Designa genericamente as pessoas sábias, sem acrescentar uma especificação masculina ausente do sentido do hebraico.
- source_word: עָשְׁרָם
  choice: a riqueza deles / sua riqueza
  rationale: O substantivo עֹשֶׁר com sufixo de terceira pessoa do plural significa literalmente 'riqueza deles'; na ordem natural da frase portuguesa, 'A riqueza dos sábios' expressa com clareza a mesma relação.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Termo corrente e digno para a falta de juízo moral e intelectual própria da literatura sapiencial; permite conservar a repetição enfática do hebraico.
- source_word: כְּסִילִים
  choice: tolos
  rationale: Equivalente tradicional e claro para pessoas moral e intelectualmente obtusas no vocabulário sapiencial.
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  choice: a insensatez dos tolos é insensatez
  rationale: Mantém a formulação tautológica e enfática do Texto Massorético, sem suavizar a possível intenção retórica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A ordem da primeira linha foi ajustada para preservar o foco metafórico de modo idiomático, sem alterar o sentido. A repetição deliberada da segunda linha foi mantida, e a variante antiga foi registrada em nota.
