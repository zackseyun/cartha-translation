  text: אֶ֣רֶךְ אַ֭פַּיִם רַב תְּבוּנָ֑ה וּ/קְצַר ר֝֗וּחַ מֵרִ֥ים אִוֶּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/029.yaml
  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
translation:
  language: pt
  text: Quem demora a irar-se tem grande entendimento, mas quem se irrita facilmente[a] exalta a insensatez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “curto de espírito”; isto é, impaciente ou de temperamento explosivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  choice: quem demora a irar-se
  rationale: O idioma hebraico significa literalmente “longo de narinas” e descreve alguém paciente, que não se ira depressa. A formulação escolhida comunica esse sentido com naturalidade e mantém a referência explícita à ira.
- source_word: רַב תְּבוּנָה
  choice: tem grande entendimento
  rationale: רַב indica abundância, e תְּבוּנָה designa entendimento, discernimento ou perspicácia. A expressão portuguesa reproduz de modo claro a construção predicativa.
- source_word: קְצַר רוּחַ
  choice: quem se irrita facilmente[a]
  rationale: A expressão, literalmente “curto de espírito”, pode indicar impaciência ou temperamento explosivo. No paralelismo com אֶרֶךְ אַפַּיִם, a referência à irritação rápida é especialmente adequada; a imagem literal e a amplitude lexical são registradas em nota.
- source_word: מֵרִים
  choice: exalta
  rationale: O particípio hifil de רום significa erguer ou exaltar. “Exalta” preserva a metáfora hebraica, sem substituí-la pela interpretação mais explícita “põe em evidência”.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Em Provérbios, o termo descreve uma falta moral e intelectual de sabedoria. “Insensatez” é corrente, digna e mais abrangente que uma simples falta de inteligência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo natural. Conserva-se a metáfora de “exaltar” a insensatez, enquanto o idioma obscuro קְצַר רוּחַ é vertido de maneira compreensível e explicado em nota.
