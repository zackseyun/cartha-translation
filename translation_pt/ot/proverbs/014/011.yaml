  text: בֵּ֣ית רְ֭שָׁעִים יִשָּׁמֵ֑ד וְ/אֹ֖הֶל יְשָׁרִ֣ים יַפְרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/011.yaml
  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
translation:
  language: pt
  text: 'A casa dos perversos será destruída,

    mas a tenda dos íntegros florescerá.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brotará” ou “prosperará”; o verbo hebraico evoca a imagem de uma planta que brota e floresce.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית רְשָׁעִים
  choice: A casa dos perversos
  rationale: Preserva a relação construta e a imagem concreta de uma casa, que também pode sugerir a família ou a linhagem, em contraste deliberado com a “tenda” do segundo verso.
- source_word: יִשָּׁמֵד
  choice: será destruída
  rationale: Expressa naturalmente o nifal imperfeito de שׁמד como destruição sofrida, sem intensificar indevidamente o sentido para aniquilação absoluta.
- source_word: אֹהֶל
  choice: a tenda
  rationale: Mantém a imagem hebraica específica e o contraste entre a casa aparentemente sólida dos perversos e a tenda mais modesta dos íntegros.
- source_word: יְשָׁרִים
  choice: dos íntegros
  rationale: Comunica a ideia ética de pessoas retas e moralmente íntegras em português atual, sem confundir o termo com outros vocábulos hebraicos frequentemente traduzidos por “justos”.
- source_word: יַפְרִיחַ
  choice: florescerá
  rationale: Conserva a metáfora vegetal de פרח — brotar ou dar flores — e comunica, no contexto proverbial, prosperidade e vitalidade.
