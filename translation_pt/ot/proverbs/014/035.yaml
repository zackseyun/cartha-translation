  text: רְֽצוֹן מֶ֭לֶךְ לְ/עֶ֣בֶד מַשְׂכִּ֑יל וְ֝/עֶבְרָת֗/וֹ תִּהְיֶ֥ה מֵבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
translation:
  language: pt
  text: O favor do rei é para o servo que age com sabedoria,[a] mas sua ira será contra aquele que causa vergonha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o servo prudente” ou “o servo competente”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua ira será [para] aquele que causa vergonha”; o hebraico não explicita a relação exata.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: favor
  rationale: No contexto sapiencial e da corte, indica a disposição favorável ou a aprovação do rei; “favor” é natural e preserva essa ideia.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente direto do substantivo hebraico para um monarca.
- source_word: לְעֶבֶד
  choice: para o servo
  rationale: O לְ marca aquele a quem se dirige o favor. “Servo” se ajusta ao contexto de serviço na corte sem destacar desnecessariamente uma condição jurídica de escravidão.
- source_word: מַשְׂכִּיל
  choice: que age com sabedoria
  rationale: O particípio no Hifil de שׂכל expressa conduta perspicaz, prudente ou eficaz; a formulação mantém seu valor verbal e prático.
- source_word: וְעֶבְרָתוֹ
  choice: mas sua ira
  rationale: עֶבְרָה designa ira intensa; “ira” conserva essa força, e “mas” explicita o contraste entre os dois membros do provérbio.
- source_word: תִּהְיֶה
  choice: será
  rationale: Representa diretamente a forma verbal de היה e preserva a formulação prospectiva do hebraico, embora o provérbio também expresse uma verdade geral.
- source_word: מֵבִישׁ
  choice: aquele que causa vergonha
  rationale: 'O particípio no Hifil de בוש é entendido causativamente: alguém que causa vergonha ou desonra.'
theological_decisions:
- issue: Relação elíptica entre a ira do rei e o causador de vergonha
  choice: “será contra aquele”
  alternative: “será para aquele” / “recairá sobre aquele”
  rationale: O hebraico deixa a relação parcialmente implícita; “contra” comunica em português o sentido contextual provável sem desenvolver uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura antitética do provérbio foi preservada, assim como a intensidade de “ira” e a ambiguidade lexical relevante de מַשְׂכִּיל e da relação marcada pela preposição diante de מֵבִישׁ.
