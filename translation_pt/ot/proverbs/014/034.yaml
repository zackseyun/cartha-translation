  text: צְדָקָ֥ה תְרֽוֹמֵֽם גּ֑וֹי וְ/חֶ֖סֶד לְאֻמִּ֣ים חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/034.yaml
  text: Righteousness exalts a nation[a], but sin is a disgrace to peoples.
translation:
  language: pt
  text: A justiça engrandece uma nação, mas o pecado é uma vergonha para os povos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico do segundo segmento é difícil. A interpretação tradicional entende que o pecado traz vergonha ou desonra aos povos. A palavra hebraica חֶסֶד (hesed), porém, normalmente significa “bondade”, “amor leal” ou “fidelidade”; por isso, a frase também já foi entendida de modo diverso, como “a bondade para com os povos é pecado”. Alguns atribuem a essa palavra, neste contexto, o sentido raro de “opróbrio” ou “desonra”.
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: justiça
  rationale: O substantivo abrange retidão moral e social, isto é, aquilo que é justo. “Justiça” comunica esse sentido amplo em português corrente sem restringi-lo apenas à esfera jurídica.
- source_word: תְרוֹמֵם
  choice: engrandece
  rationale: A forma verbal de רום expressa elevar ou colocar em posição alta. “Engrandece” preserva naturalmente, no contexto nacional, as ideias de elevação, honra e prestígio.
- source_word: גּוֹי
  choice: uma nação
  rationale: O termo designa aqui genericamente uma coletividade nacional, sem contraste específico entre Israel e os gentios.
- source_word: חֶסֶד
  choice: mas
  rationale: O texto consonantal traz חֶסֶד, palavra normalmente associada a bondade, amor leal ou fidelidade, mas a construção é difícil. A tradução principal expressa o contraste indicado pelo paralelismo, sem atribuir a esta palavra isoladamente um equivalente lexical seguro; a dificuldade é preservada em nota.
- source_word: לְאֻמִּים
  choice: para os povos
  rationale: Mantém o plural e o paralelismo poético com “uma nação” no primeiro segmento.
- source_word: חַטָּאת
  choice: o pecado é uma vergonha
  rationale: חַטָּאת significa primariamente “pecado”. No entendimento tradicional do segmento, o pecado traz desonra pública; a formulação explicita essa relação e produz em português o contraste entre engrandecimento e vergonha.
theological_decisions:
- issue: Sentido do segundo segmento וְחֶסֶד לְאֻמִּים חַטָּאת
  choice: “mas o pecado é uma vergonha para os povos”
  alternative: Uma tradução mais direta da vocalização massorética seria “mas a bondade para os povos é pecado”; outra análise atribui a חֶסֶד o sentido raro de “vergonha” ou “opróbrio”.
  rationale: O hebraico é notoriamente difícil, pois חֶסֶד costuma ter sentido positivo. O paralelismo antitético favorece o entendimento tradicional de que o pecado desonra os povos, mas a nota registra a dificuldade real e evita apresentar como inequívoca uma solução contestada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Engrandece” conserva a imagem de elevação sem soar excessivamente literal; a nota preserva a ambiguidade textual do segundo segmento.
