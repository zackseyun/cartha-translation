  text: The heart knows the bitterness of its soul[b][a], and no stranger shares in its joy.
translation:
  language: pt
  text: O coração conhece a amargura de sua própria alma[a], e nenhum estranho participa de sua alegria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a amargura de sua alma”. Aqui, “alma” se refere ao ser interior ou à vida da pessoa, sem necessariamente constituir uma afirmação técnica sobre a natureza humana.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e nenhum estranho se mistura com sua alegria” ou “compartilha de sua alegria”. O verbo hebraico pode indicar envolver-se ou tomar parte em algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Em Provérbios, לֵב designa com frequência o interior da pessoa como sede do pensamento e dos sentimentos. “Coração” é natural em português e preserva a imagem antropológica hebraica.
- source_word: יֹדֵעַ
  choice: conhece
  rationale: ידע expressa aqui conhecimento ou consciência íntima e pessoal; “conhece” mantém a formulação direta do hebraico.
- source_word: מָרַת
  choice: amargura
  rationale: O termo derivado de מרר denota amargura emocional ou existencial. “Amargura” preserva a metáfora sem restringi-la interpretativamente a tristeza ou sofrimento.
- source_word: נַפְשׁוֹ
  choice: sua própria alma
  rationale: נפש pode significar alma, vida ou o próprio ser. Aqui aponta para o interior da pessoa em relação com “coração”. “Própria” torna clara a referência reflexiva em português, sem fazer uma afirmação técnica sobre a constituição humana.
- source_word: וּבְשִׂמְחָתוֹ
  choice: e ... de sua alegria
  rationale: שִׂמְחָה significa alegria ou contentamento. A preposição ב é expressa naturalmente na construção portuguesa “participar de”.
- source_word: יִתְעָרַב
  choice: participa de
  rationale: O hitpael de ערב pode indicar envolver-se, misturar-se ou tomar parte em algo. “Participa de” comunica com clareza a ideia contextual sem eliminar outras nuances, que são registradas em nota.
- source_word: זָר
  choice: estranho
  rationale: זָר refere-se aqui a quem está de fora da experiência íntima de outra pessoa, e não necessariamente a um estrangeiro em sentido étnico. “Estranho” preserva a concisão e o contraste do provérbio.
