source:
  edition: WLC
  text: אֱ֭וִלִים יָלִ֣יץ אָשָׁ֑ם וּ/בֵ֖ין יְשָׁרִ֣ים רָצֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/009.yaml
  text: Fools mock guilt[b][a], but among the upright there is favor.
translation:
  language: pt
  text: Os insensatos zombam da culpa[a], mas entre os íntegros há favor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “zombam da oferta pela culpa”. O termo hebraico pode significar tanto “culpa” como, em contextos sacrificiais, “oferta pela culpa”.'
    reason: alternative_reading
  - marker: b
    text: Também pode ser entendido como “aceitação” ou “boa vontade”. O hebraico não especifica de quem procede o favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: os insensatos
  rationale: Designa pessoas moralmente insensatas, uma categoria recorrente na literatura sapiencial. “Os insensatos” é claro e natural em português.
- source_word: יָלִיץ
  choice: zombam
  rationale: O hifil de לוץ expressa escárnio ou zombaria. A forma escolhida comunica que os insensatos tratam a culpa com desprezo ou leviandade.
- source_word: אָשָׁם
  choice: culpa
  rationale: Neste contexto sapiencial, o sentido abstrato de culpabilidade se ajusta bem ao contraste ético. Como o termo também pode designar uma oferta pela culpa, essa possibilidade é preservada em nota.
- source_word: וּבֵין
  choice: mas entre
  rationale: A conjunção introduz o contraste entre os dois membros do provérbio; “mas entre” torna explícita essa relação em português natural.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: O termo descreve pessoas moralmente retas. “Íntegros” é corrente, digno e adequado ao vocabulário sapiencial.
- source_word: רָצוֹן
  choice: favor
  rationale: O substantivo pode significar favor, aceitação ou boa vontade. “Favor” é conciso e mantém indefinida a origem desse favor.
theological_decisions:
- issue: Sentido de אָשָׁם no contexto sapiencial
  choice: culpa
  alternative: oferta pela culpa
  rationale: O contraste ético entre insensatos e íntegros favorece o sentido abstrato, sem eliminar o possível sentido sacrificial, registrado em nota.
- issue: Origem ou agente do רָצוֹן
  choice: favor, sem especificar de quem
  alternative: favor de Deus; boa vontade humana; aceitação
  rationale: O hebraico não identifica quem concede o favor. A tradução preserva essa abertura interpretativa e evita acrescentar uma referência divina ou humana ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção breve que conserva o paralelismo antitético do provérbio. “Insensatos” e “íntegros” mantêm as categorias morais próprias da literatura sapiencial.
