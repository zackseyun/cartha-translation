  text: מַצִּ֣יל נְ֭פָשׁוֹת עֵ֣ד אֱמֶ֑ת וְ/יָפִ֖חַ כְּזָבִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/025.yaml
  text: A truthful witness rescues lives[c][b][a], but one who breathes out lies is deceitful.
translation:
  language: pt
  text: A testemunha verdadeira salva vidas[a], mas quem exala mentiras[b] é enganador[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “livra pessoas”. O hebraico também pode ser traduzido literalmente por “almas”, mas aqui se refere a pessoas ou vidas, não especificamente a almas imateriais.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “sopra mentiras”. O hebraico emprega a imagem vívida de expelir o ar para descrever o ato de proferir falsidades.'
    reason: lexical_alternative
  - marker: c
    text: A frase final também pode ser traduzida mais literalmente por “quem exala mentiras é engano” ou entendida como “exala mentiras com falsidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: salva
  rationale: O particípio hifil de נצל indica fazer escapar, livrar ou resgatar. “Salva” expressa com naturalidade o efeito concreto do testemunho verdadeiro, sem exigir aqui um sentido religioso técnico.
- source_word: נְפָשׁוֹת
  choice: vidas
  rationale: O plural de נֶפֶשׁ pode designar pessoas ou vidas, não especificamente almas imateriais. “Vidas” se ajusta ao contexto de pessoas preservadas das consequências de um falso testemunho.
- source_word: עֵד אֱמֶת
  choice: a testemunha verdadeira
  rationale: A construção caracteriza a testemunha por sua veracidade. “Testemunha verdadeira” é clara, digna e idiomática em português.
- source_word: וְיָפִחַ
  choice: mas quem exala
  rationale: פוח evoca literalmente soprar ou expelir o ar e, figuradamente, proferir palavras. “Exala” conserva a imagem vívida sem soar tão estranho quanto “sopra mentiras”; a conjunção foi vertida como adversativa por causa do paralelismo contrastante.
- source_word: כְּזָבִים
  choice: mentiras
  rationale: O substantivo plural indica declarações falsas; “mentiras” é a opção mais direta e natural.
- source_word: מִרְמָה
  choice: é enganador
  rationale: O substantivo final, “engano/falsidade”, caracteriza de modo condensado aquele que profere mentiras. A formulação predicativa “é enganador” produz português natural, enquanto a nota preserva as possibilidades mais literais.
