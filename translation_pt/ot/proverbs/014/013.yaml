lexical_decisions:
- source_word: גַּם
  choice: Mesmo
  rationale: 'Expressa a força concessiva e enfática: apesar do riso, pode haver dor interior.'
- source_word: בִּשְׂחוֹק
  choice: no riso
  rationale: Preserva a imagem concreta do hebraico e soa natural em português.
- source_word: יִכְאַב
  choice: pode doer
  rationale: O imperfeito hebraico, em linguagem proverbial, admite valor potencial ou gnômico; esta formulação preserva essa abertura.
- source_word: לֵב
  choice: o coração
  rationale: É a correspondência tradicional e clara para a sede da experiência interior neste contexto.
- source_word: וְאַחֲרִיתָהּ
  choice: e o fim da
  rationale: Conserva a imagem de término ou resultado final; o sufixo feminino retoma 'alegria'.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Equivalente atual e abrangente, em contraste direto com a tristeza.
- source_word: תוּגָה
  choice: tristeza
  rationale: Comunica com clareza a aflição ou pesar indicado pelo termo hebraico, sem soar técnico ou arcaico.
