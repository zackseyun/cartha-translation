  text: בְּ/כָל עֶ֭צֶב יִהְיֶ֣ה מוֹתָ֑ר וּ/דְבַר שְׂ֝פָתַ֗יִם אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/023.yaml
  text: In all labor there is profit[a], but mere talk leads only to lack.
translation:
  language: pt
  text: Em todo trabalho árduo há proveito, mas o mero falar só leva à falta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à pobreza”. O termo hebraico מַחְסוֹר pode indicar falta, necessidade ou pobreza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל
  choice: Em todo
  rationale: A combinação da preposição ב com כָּל introduz aqui um princípio geral; “em todo” é idiomático e preserva o alcance abrangente da afirmação.
- source_word: עֶצֶב
  choice: trabalho árduo
  rationale: O termo pode indicar labor penoso, esforço ou sofrimento. No contraste com palavras improdutivas, “trabalho árduo” comunica atividade produtiva que exige esforço sem reduzir o sentido a dor emocional.
- source_word: יִהְיֶה
  choice: há
  rationale: O imperfeito tem força proverbial ou gnômica, expressando uma verdade geral; o presente “há” é natural em português.
- source_word: מוֹתָר
  choice: proveito
  rationale: מוֹתָר designa aquilo que sobra e, por extensão, vantagem, ganho ou benefício. “Proveito” mantém o sentido amplo e combina naturalmente com o contexto sapiencial.
- source_word: וּ/דְבַר שְׂפָתַיִם
  choice: mas o mero falar
  rationale: A expressão, literalmente relacionada à “palavra dos lábios”, é uma maneira idiomática de se referir à fala. O contexto antitético justifica “mas”, e “mero falar” explicita com naturalidade a oposição entre esforço efetivo e palavras sem ação.
- source_word: אַךְ
  choice: só
  rationale: Aqui a partícula restringe o resultado, dando à advertência o sentido de “somente” ou “nada além de”.
- source_word: לְ/מַחְסוֹר
  choice: leva à falta
  rationale: מַחְסוֹר pode significar falta, necessidade ou pobreza. “Leva à falta” preserva a amplitude lexical e expressa em português natural o resultado indicado pela preposição לְ.
