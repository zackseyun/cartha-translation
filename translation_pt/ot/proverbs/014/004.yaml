  text: בְּ/אֵ֣ין אֲ֭לָפִים אֵב֣וּס בָּ֑ר וְ/רָב תְּ֝בוּא֗וֹת בְּ/כֹ֣חַ שֽׁוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/004.yaml
  text: Where there are no oxen[a], the manger is clean[b], but abundant crops come by the strength of an ox.
translation:
  language: pt
  text: Onde não há bois, o cocho[a] fica limpo, mas há colheitas[b] abundantes pela força do boi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “manjedoura”.
    reason: lexical_alternative
  - marker: b
    text: Ou “produção”, “safras” ou “rendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Onde não há
  rationale: A combinação de בְּ com אֵין introduz uma circunstância ou condição. “Onde não há” expressa com naturalidade o contraste situacional do provérbio.
- source_word: אֲלָפִים
  choice: bois
  rationale: O plural pode designar gado bovino em geral, mas o paralelo com שׁוֹר e o contexto agrícola apontam para animais de trabalho. “Bois” comunica isso claramente.
- source_word: אֵבוּס
  choice: cocho
  rationale: O substantivo designa o lugar ou recipiente onde os animais comem. “Cocho” é preciso, corrente e evita que “manjedoura” seja entendida apenas em associação com a narrativa do nascimento de Jesus.
- source_word: בָּר
  choice: limpo
  rationale: No contexto, descreve o cocho livre da sujeira e da desordem decorrentes da presença dos bois. “Limpo” preserva o sentido prático, embora a ideia de estar vazio também possa estar implícita.
- source_word: וְרָב
  choice: mas ... abundantes
  rationale: O וְ introduz aqui um contraste, expresso naturalmente por “mas”; רָב indica grande quantidade e concorda semanticamente com “colheitas”.
- source_word: תְּבוּאוֹת
  choice: colheitas
  rationale: O termo se refere à produção ou ao rendimento agrícola. “Colheitas” mantém concreta a imagem rural e é compreensível em português amplo.
- source_word: בְּכֹחַ
  choice: pela força
  rationale: 'A preposição בְּ marca o meio ou instrumento: a produção resulta da capacidade de trabalho do boi.'
- source_word: שׁוֹר
  choice: do boi
  rationale: O singular tem valor genérico e retoma naturalmente os “bois” da primeira metade do verso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com boa legibilidade brasileira e compreensão internacional. “Cocho” mantém a precisão da imagem agrícola; a estrutura conserva o contraste entre limpeza sem animais e produtividade obtida pelo trabalho deles.
