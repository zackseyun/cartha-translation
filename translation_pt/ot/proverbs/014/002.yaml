  text: הוֹלֵ֣ךְ בְּ֭/יָשְׁר/וֹ יְרֵ֣א יְהוָ֑ה וּ/נְל֖וֹז דְּרָכָ֣י/ו בּוֹזֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
translation:
  language: pt
  text: Quem anda em retidão teme Yahweh, mas quem é tortuoso em seus caminhos[a] o despreza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas quem é perverso em seus caminhos”. O hebraico descreve alguém cuja conduta é torcida ou desviada.'
    reason: lexical_alternative
  - marker: b
    text: O pronome em “o despreza” refere-se mais naturalmente a Yahweh; também é possível entendê-lo de maneira mais geral.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: anda
  rationale: Em Provérbios, הלך descreve metaforicamente a maneira de viver. “Anda” preserva a imagem hebraica e é uma expressão natural em português.
- source_word: בְּיָשְׁרוֹ
  choice: em retidão
  rationale: O termo expressa retidão, integridade e conduta moralmente direita. “Em retidão” conserva a imagem de um caminho reto sem tornar o possessivo hebraico artificial em português.
- source_word: יְרֵא יְהוָה
  choice: teme Yahweh
  rationale: “Teme” preserva a expressão sapiencial característica e sua seriedade moral; “Yahweh” representa o nome divino יהוה, em vez de substituí-lo por um título.
- source_word: וּנְלוֹז דְּרָכָיו
  choice: mas quem é tortuoso em seus caminhos
  rationale: נלוז indica o que é torcido, tortuoso ou perverso, e דְּרָכָיו se refere aos padrões de conduta. A formulação mantém a imagem concreta dos caminhos e soa clara em português.
- source_word: בּוֹזֵהוּ
  choice: o despreza
  rationale: בזה significa desprezar ou tratar com desdém. O pronome masculino retoma mais naturalmente Yahweh no paralelismo antitético.
theological_decisions:
- issue: Referente do sufixo pronominal em בּוֹזֵהוּ
  choice: O pronome em “o despreza” refere-se a Yahweh.
  alternative: O pronome pode ser entendido de modo mais geral ou, menos provavelmente, como referência à pessoa íntegra.
  rationale: A antítese mais direta contrapõe temer Yahweh a desprezá-lo. Como o hebraico não repete explicitamente o nome, a nota conserva a possibilidade de outra compreensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem sapiencial de “andar” e dos “caminhos” foi preservada; evitou-se linguagem denominacional.
