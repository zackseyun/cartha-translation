  text: בְּ/לֵ֣ב נָ֭בוֹן תָּנ֣וּחַ חָכְמָ֑ה וּ/בְ/קֶ֥רֶב כְּ֝סִילִ֗ים תִּוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
translation:
  language: pt
  text: A sabedoria repousa no coração de quem tem discernimento, mas, no meio dos insensatos, ela se dá a conhecer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּלֵב
  choice: no coração de
  rationale: Preserva a imagem concreta do hebraico לֵב, que neste contexto abrange o íntimo, o entendimento e a vontade, e soa natural em português.
- source_word: נָבוֹן
  choice: quem tem discernimento
  rationale: O adjetivo substantivado designa uma pessoa dotada de entendimento e discernimento. A formulação portuguesa é natural e não acrescenta uma especificação de sexo que o sentido representativo não exige.
- source_word: תָּנוּחַ
  choice: repousa
  rationale: O verbo נוח comunica repouso ou assentamento. “Repousa” conserva a imagem de a sabedoria permanecer serenamente no íntimo da pessoa perspicaz.
- source_word: חָכְמָה
  choice: A sabedoria
  rationale: Mantém o substantivo abstrato como sujeito da oração, sem impor uma personificação além do que a construção poética sugere.
- source_word: וּבְקֶרֶב
  choice: mas, no meio de
  rationale: A conjunção recebe valor adversativo pelo contraste entre o repouso interior da primeira oração e a manifestação pública da segunda; “no meio de” preserva a imagem espacial de קֶרֶב.
- source_word: כְּסִילִים
  choice: insensatos
  rationale: No vocabulário sapiencial, כְּסִילִים caracteriza pessoas moral e intelectualmente obtusas. “Insensatos” é corrente, digno e menos sujeito a uma leitura meramente ofensiva do que “tolos”.
- source_word: תִּוָּדֵעַ
  choice: ela se dá a conhecer
  rationale: A forma nifal de ידע admite nuance passiva, reflexiva ou incoativa. “Se dá a conhecer” conserva a possível reflexividade e expressa o contraste com o repouso discreto da sabedoria no coração de quem discerne.
theological_decisions:
- issue: Referente e sentido de תִּוָּדֵעַ
  choice: “ela se dá a conhecer”, tendo “a sabedoria” como sujeito
  alternative: “ela se torna conhecida” ou “é conhecida”
  rationale: A concordância feminina singular remete naturalmente a חָכְמָה. A tradução mantém a tensão do provérbio — a sabedoria repousa no discernente, mas se torna perceptível entre os insensatos — sem explicar de que modo isso acontece nem introduzir uma interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é conciso e sapiencial; “repousa” mantém a imagem poética, e “quem tem discernimento” comunica com clareza o adjetivo hebraico substantivado.
