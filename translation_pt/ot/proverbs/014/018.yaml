  source_fidelity: A primeira linha traduz adequadamente נָחֲלוּ, פְתָאיִם e אִוֶּלֶת. Na segunda, o hebraico traz um verbo Hifil ativo (יַכְתִּרוּ), e «se coroam de conhecimento» é uma possibilidade interpretativa, mas a construção portuguesa é menos direta e pode sugerir reflexividade que não está explicitamente marcada no hebraico. «Coroam-se de conhecimento» representa melhor, em português, a leitura ativa/adornativa preservada pela nota.
