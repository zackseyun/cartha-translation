base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/018.yaml
  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
translation:
  language: pt
  text: Os ingênuos herdam a insensatez, mas os prudentes coroam-se de conhecimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas os prudentes são coroados de conhecimento”. O verbo hebraico pode ser entendido ativamente, como “coroar”, ou em sentido adornativo, descrevendo-os como coroados de conhecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחֲלוּ
  choice: herdam
  rationale: Preserva a metáfora hebraica de receber algo como herança ou posse, aqui a insensatez.
- source_word: פְתָאיִם
  choice: os ingênuos
  rationale: Em Provérbios, designa pessoas inexperientes e facilmente influenciáveis; “ingênuos” comunica isso em português atual sem limitar o termo à falta de inteligência.
- source_word: אִוֶּלֶת
  choice: a insensatez
  rationale: Expressa a falta de juízo moral e prático própria do vocabulário sapiencial.
- source_word: עֲרוּמִים
  choice: os prudentes
  rationale: O contraste favorece o sentido positivo de pessoas sensatas, cautelosas e dotadas de discernimento.
- source_word: יַכְתִּרוּ
  choice: se coroam de
  rationale: Representa naturalmente a forma causativa ativa e a imagem de cingir ou adornar com uma coroa, sem eliminar a possível leitura resultativa.
- source_word: דָעַת
  choice: conhecimento
  rationale: É o equivalente direto do termo sapiencial hebraico e mantém sua relação com discernimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ingênuos” evita o possível sentido meramente intelectual de “simples”; “insensatez” mantém o teor moral e prático do provérbio. A formulação principal conserva a voz ativa do hebraico, enquanto a nota registra a leitura resultativa/passiva.
