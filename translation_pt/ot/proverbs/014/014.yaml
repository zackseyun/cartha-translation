  text: מִ/דְּרָכָ֣י/ו יִ֭שְׂבַּע ס֣וּג לֵ֑ב וּ֝/מֵ/עָלָ֗י/ו אִ֣ישׁ טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/014.yaml
  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
translation:
  language: pt
  text: Quem se desvia de coração se fartará de seus próprios caminhos; e o homem bom, do que procede dele mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da segunda linha é difícil e elíptico. Outra tradução possível é: “e o homem bom se fartará de seus próprios atos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִדְּרָכָיו
  choice: dos seus próprios caminhos
  rationale: A preposição מִן indica a fonte daquilo que o sacia. Em português, “fartar-se de” preserva tanto essa relação quanto a imagem concreta, e “próprios” explicita o sufixo possessivo no contraste proverbial.
- source_word: יִשְׂבַּע
  choice: se fartará
  rationale: O verbo significa ficar saciado ou satisfeito. “Se fartará” conserva a metáfora concreta e permite subentender o mesmo verbo no segundo membro do paralelismo.
- source_word: סוּג לֵב
  choice: quem se desvia no coração
  rationale: סוּג expressa voltar atrás ou afastar-se, enquanto לֵב aponta para a orientação moral interior. A formulação evita o termo denominacionalmente carregado “apóstata” e mantém a referência explícita ao coração.
- source_word: וּמֵעָלָיו
  choice: e ... do que procede dele mesmo
  rationale: A expressão é elíptica e difícil. Em paralelo com “dos seus próprios caminhos”, foi entendida como indicação da fonte da satisfação do homem bom, isto é, aquilo que resulta de sua própria conduta, sem tornar essa explicação explícita demais no texto.
- source_word: אִישׁ טוֹב
  choice: o homem bom
  rationale: A tradução preserva a forma masculina singular do hebraico e o estilo sentencioso do provérbio; no contexto, a expressão tem força representativa.
theological_decisions:
- issue: Retribuição moral inerente à conduta
  choice: Preservar a imagem de cada pessoa ser saciada pelo que provém de seu próprio caminho ou de si mesma
  alternative: Explicitar que Deus recompensa diretamente cada pessoa por suas obras
  rationale: O versículo descreve a correspondência entre caráter, conduta e resultado, mas não nomeia diretamente o agente da retribuição. A tradução não acrescenta uma especificação teológica ausente do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O ponto e vírgula evidencia o paralelismo antitético, e a elipse de “se fartará” no segundo membro reproduz a concisão proverbial do hebraico.
