  text: Even his neighbor hates a poor man[b][a], but the friends of a rich man are many.
translation:
  language: pt
  text: Até mesmo o pobre é odiado pelo seu próximo[a], mas são muitos os que amam o rico[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até mesmo o pobre é odiado pelo seu amigo.” A palavra hebraica pode significar “próximo”, “amigo” ou “companheiro”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que amam o rico”; isto é, muitos se ligam a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Neste contexto, a partícula intensifica a afirmação e realça o caráter surpreendente da rejeição: até alguém socialmente próximo ao pobre o odeia.'
- source_word: לְרֵעֵהוּ
  choice: pelo seu próximo
  rationale: רֵעַ pode designar próximo, amigo ou companheiro. “Próximo” preserva a ideia ampla de proximidade social, enquanto a nota registra a alternativa lexical.
- source_word: יִשָּׂנֵא
  choice: é odiado
  rationale: A forma nifal é naturalmente entendida como passiva. A tradução mantém essa voz e identifica o pobre como aquele que sofre a rejeição.
- source_word: רָשׁ
  choice: o pobre
  rationale: O adjetivo substantivado masculino singular designa uma pessoa pobre ou necessitada. “O pobre” é conciso e natural no estilo proverbial português.
- source_word: וְאֹהֲבֵי
  choice: os que amam
  rationale: O particípio plural significa literalmente “os que amam”. A expressão preserva a força verbal do hebraico sem sugerir necessariamente amizade genuína.
- source_word: עָשִׁיר
  choice: o rico
  rationale: O adjetivo substantivado singular designa uma pessoa rica e forma o contraste direto com “o pobre”.
- source_word: רַבִּים
  choice: muitos são
  rationale: A construção predicativa expressa grande número. A ordem escolhida produz uma formulação proverbial natural e mantém a ênfase em “muitos”.
