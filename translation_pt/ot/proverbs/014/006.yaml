id: PRO.14.6
reference: Proverbs 14:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּקֶּשׁ לֵ֣ץ חָכְמָ֣ה וָ/אָ֑יִן וְ/דַ֖עַת לְ/נָב֣וֹן נָקָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/006.yaml
  text: A scoffer seeks wisdom and there is none[b][a], but knowledge comes easily to one who has understanding.
translation:
  language: pt
  text: O zombador busca sabedoria, mas não a encontra[a]; o conhecimento, porém, é fácil para quem tem discernimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “e não há”. Também pode ser traduzido: “mas não encontra nenhuma”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz uma forma masculina singular, literalmente “para o discernente”, usada aqui de modo proverbial para qualquer pessoa caracterizada pelo discernimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקֶּשׁ
  choice: busca
  rationale: Embora a forma hebraica seja qatal, no contexto proverbial ela expressa uma verdade geral; o presente gnômico é natural em português.
- source_word: לֵץ
  choice: zombador
  rationale: Designa alguém marcado pela zombaria arrogante e pela rejeição da sabedoria e da correção. “Zombador” é atual e conserva a carga moral do termo.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É a tradução consagrada e adequada em Provérbios, abrangendo entendimento hábil e moralmente orientado.
- source_word: וָאָיִן
  choice: mas não a encontra
  rationale: A formulação hebraica é literalmente existencial, “e não há”, mas no contexto indica que a busca do zombador é infrutífera. A tradução explicita essa relação com naturalidade, enquanto a nota preserva a forma literal.
- source_word: וְדַעַת
  choice: o conhecimento
  rationale: Mantém a distinção lexical em relação a “sabedoria” e indica conhecimento compreendido, não mero acúmulo de informações.
- source_word: לְנָבוֹן
  choice: para quem tem discernimento
  rationale: Expressa naturalmente o caráter da pessoa נָבוֹן, dotada de entendimento e capacidade de discernir, sem restringir o provérbio ao sexo masculino.
- source_word: נָקָל
  choice: é fácil
  rationale: Reproduz diretamente a ideia de facilidade ou acessibilidade e forma uma construção idiomática com “para quem tem discernimento”.
theological_decisions:
- issue: Masculino singular representativo na literatura sapiencial
  choice: para quem tem discernimento
  alternative: para o homem discernente
  rationale: O hebraico emprega uma forma masculina singular com função proverbial e representativa. A formulação escolhida comunica esse alcance geral em português sem acrescentar uma restrição de sexo; a nota registra a forma gramatical do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo contrastivo foi preservado; “porém” marca a virada entre a busca inútil do zombador e a facilidade do conhecimento para a pessoa discernente.
