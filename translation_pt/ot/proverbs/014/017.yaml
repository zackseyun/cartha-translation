  text: קְֽצַר אַ֭פַּיִם יַעֲשֶׂ֣ה אִוֶּ֑לֶת וְ/אִ֥ישׁ מְ֝זִמּ֗וֹת יִשָּׂנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/017.yaml
  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
translation:
  language: pt
  text: Quem se irrita facilmente age com insensatez, e o homem de maquinações é odiado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o homem de planos é odiado”. A palavra hebraica pode indicar planos ou maquinações e, neste contexto, provavelmente tem sentido negativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  choice: quem se irrita facilmente
  rationale: O idiomatismo hebraico, literalmente relacionado a ser 'curto de ira', descreve alguém que se ira depressa. A formulação é natural e clara em português moderno.
- source_word: יַעֲשֶׂה
  choice: age
  rationale: O verbo comum 'fazer' combina aqui com o substantivo seguinte no sentido de praticar ou agir com insensatez; 'age' produz uma expressão idiomática em português.
- source_word: אִוֶּלֶת
  choice: com insensatez
  rationale: O substantivo denota insensatez ou loucura moral. A locução adverbial preserva o sentido substantivo sem tornar a frase artificial.
- source_word: אִישׁ
  choice: homem
  rationale: Mantém o masculino singular representativo do hebraico e a estrutura paralela do provérbio.
- source_word: מְזִמּוֹת
  choice: intrigas
  rationale: O termo pode significar planos, desígnios ou maquinações. No contexto, a reação de ódio favorece um sentido pejorativo; 'intrigas' o comunica sem acrescentar explicitamente 'malignas' ao texto.
- source_word: יִשָּׂנֵא
  choice: é odiado
  rationale: Reproduz diretamente a forma passiva do hebraico e emprega o presente de valor geral próprio de um provérbio.
theological_decisions:
- issue: Relação entre as duas metades do provérbio
  choice: mas
  alternative: e
  rationale: O waw hebraico pode ser simplesmente aditivo, mas o contraste entre a insensatez impulsiva da primeira pessoa e a conduta calculada da segunda favorece 'mas'. A oposição não deve ser entendida como aprovação de nenhuma das duas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A primeira expressão foi vertida de modo idiomático; o paralelismo e a voz passiva da segunda oração foram preservados.
