base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
translation:
  language: pt
  text: No temor de Yahweh há firme confiança, e para seus filhos[a] haverá refúgio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente, “seus filhos” pode referir-se aos filhos de Yahweh, entendendo-se que “seus” se refere a Yahweh, e não à pessoa que o teme.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יִרְאַת
  choice: No temor de
  rationale: A preposição ב com o substantivo construto יִרְאָה expressa aqui a esfera em que se vive; “no temor de” preserva o idioma hebraico e comunica reverência, não mero medo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִבְטַח עֹז
  choice: firme confiança
  rationale: מִבְטַח indica confiança ou segurança, e עֹז lhe atribui força. “Firme confiança” é natural em português e mantém o valor intensificador da expressão.
- source_word: וּ֝/לְ/בָנָ֗י/ו
  choice: e para os seus filhos
  rationale: בָּנִים pode designar filhos de modo genérico, e a preposição ל é preservada por “para”. O antecedente mais natural do sufixo é a pessoa que teme Yahweh.
- source_word: יִהְיֶה
  choice: haverá
  rationale: O verbo היה introduz aqui a existência do refúgio; “haverá” reproduz essa construção de modo conciso e natural.
- source_word: מַחְסֶה
  choice: refúgio
  rationale: O termo denota abrigo ou lugar de proteção; “refúgio” conserva de forma direta a imagem protetora.
theological_decisions:
- issue: Referente do sufixo pronominal em “seus filhos”
  choice: O sufixo se refere à pessoa que teme Yahweh.
  alternative: O sufixo pode se referir a Yahweh, de modo que seriam os filhos de Yahweh.
  rationale: 'A progressão proverbial favorece a pessoa temente a Yahweh como antecedente: ela encontra firme confiança, e seus filhos encontram refúgio. Como a referência a Yahweh permanece gramaticalmente possível, a alternativa é preservada em nota.'
translation_notes:
  register: Português moderno, digno e acessível, com construção concisa de caráter proverbial. “Firme confiança” evita a possível leitura estritamente física de “segurança forte”, e “para os seus filhos haverá refúgio” conserva a preposição hebraica sem deixar de soar natural.
