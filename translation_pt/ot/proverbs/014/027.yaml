source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: pt
  text: O temor de Yahweh é uma fonte de vida[a], para que a pessoa se afaste das armadilhas da morte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma nascente de vida”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para se desviar das armadilhas da morte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: temor de
  rationale: Preserva a expressão central da literatura sapiencial, que abrange medo, reverência e assombro diante de Deus, sem reduzi-la apenas a respeito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מְקוֹר
  choice: fonte
  rationale: Comunica naturalmente a imagem de uma nascente ou fonte que dá vida; a alternativa mais concreta, “nascente”, é registrada em nota.
- source_word: חַיִּים
  choice: vida
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui funciona como substantivo abstrato e coletivo.
- source_word: לָסוּר
  choice: para que a pessoa se afaste
  rationale: Expressa em português natural a finalidade ou o resultado possível do infinitivo hebraico. “A pessoa” torna explícito apenas o sujeito humano genérico implícito no contexto.
- source_word: מִמֹּקְשֵׁי
  choice: das armadilhas de
  rationale: Mantém a metáfora de perigos ocultos capazes de capturar alguém; “armadilhas” é claro e corrente em português.
- source_word: מָוֶת
  choice: morte
  rationale: Preserva a amplitude do termo, que pode abranger tanto a morte literal quanto a ruína associada ao caminho insensato.
theological_decisions:
- issue: Sentido de “temor de Yahweh” na literatura sapiencial
  choice: Manter “temor”
  alternative: “reverência por Yahweh”
  rationale: “Temor” conserva a tensão do hebraico entre medo, reverência, assombro e postura obediente, sem suavizar interpretativamente a expressão.
- issue: Valor do infinitivo לָסוּר
  choice: “para que a pessoa se afaste” como finalidade ou resultado
  alternative: “para afastar alguém”
  rationale: O infinitivo com ל pode indicar finalidade ou resultado. A formulação principal preserva o sentido intransitivo de סור e evita impor uma leitura estritamente causativa; a alternativa é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Armadilhas” foi preferido a “laços” por ser mais imediatamente compreensível, sem perder a metáfora hebraica. Os marcadores [a] e [b] aparecem no texto principal.
