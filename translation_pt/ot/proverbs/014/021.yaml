  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
translation:
  language: pt
  text: Quem despreza o seu próximo peca, mas feliz[a] é quem trata os pobres com bondade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bem-aventurado”. O termo hebraico expressa uma condição de bênção e florescimento, não apenas um sentimento de felicidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: despreza
  rationale: O particípio descreve quem trata outra pessoa com desprezo; “despreza” é conciso, natural e mantém a força moral do hebraico.
- source_word: לְרֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ designa alguém do convívio ou da esfera social; “próximo” é idiomático em português e adequado ao contexto ético da literatura sapiencial.
- source_word: חוֹטֵא
  choice: peca
  rationale: O particípio tem função predicativa e emprega explicitamente a categoria moral de pecado; “peca” preserva essa força sem a enfraquecer para mera injustiça.
- source_word: וּמְחוֹנֵן
  choice: trata ... com bondade
  rationale: A forma de חנן indica conceder favor ou agir graciosamente. A expressão escolhida comunica essa benevolência de maneira natural em português, sem restringi-la apenas a um sentimento de compaixão.
- source_word: עניים
  choice: os pobres
  rationale: O termo pode abranger pobres, necessitados ou aflitos; neste contraste ético, “os pobres” expressa de modo direto a vulnerabilidade socioeconômica em vista.
- source_word: אַשְׁרָיו
  choice: feliz é quem
  rationale: A fórmula sapiencial declara uma condição objetiva de bem-estar, prosperidade humana e favor, não apenas uma emoção passageira. “Feliz é quem” é natural no português atual, enquanto a nota preserva a amplitude do termo.
theological_decisions:
- issue: Sentido da fórmula sapiencial אַשְׁרָיו
  choice: feliz é quem
  alternative: bem-aventurado é aquele que
  rationale: “Feliz” oferece clareza e naturalidade, mas pode ser entendido de maneira subjetiva; por isso, a nota esclarece que o hebraico fala de uma condição de bênção e florescimento. A tradução não define a origem dessa condição além do que o provérbio afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O paralelismo antitético foi preservado; a linguagem permanece concisa, como no provérbio hebraico.
