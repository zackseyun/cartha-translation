  source_fidelity: A primeira oração traduz adequadamente לְקַח בִּגְדוֹ כִּי עָרַב זָר. Porém, חַבְלֵהוּ traz sufixo masculino singular e, no contexto jurídico, é mais bem expresso como tomar/exigir dele um penhor, isto é, uma garantia do homem. “Retenha-a” retoma “roupa” com pronome feminino e altera essa referência.
  naturalness: “Tome a roupa dele” e “tornou-se fiador” são claros e naturais em português moderno. “Tome dele um penhor” é um pouco mais formal, mas é terminologia jurídica compreensível e apropriada ao provérbio.
  terminology: “Fiador” transmite com precisão o sentido de ערב. “Estranho” para זָר e “estrangeiros” para נכרים preservam a distinção lexical e o plural do texto hebraico fornecido. “Em favor de” é possível para בעד; “por estrangeiros” é mais conciso e idiomático neste paralelismo, sem exceder o sentido de responsabilidade em nome de terceiros.
  issues:
