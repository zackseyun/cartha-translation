base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/016.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold him in pledge for foreigners.
translation:
  language: pt
  text: Tome a roupa dele, pois ele se tornou fiador de um estranho[b]; tome dele um penhor por estrangeiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “penhore-o por estrangeiros”. A expressão hebraica é concisa; neste contexto jurídico, pode significar tomar dele um penhor, isto é, uma garantia.'
    reason: alternative_reading
  - marker: b
    text: “Tornar-se fiador” significa garantir a dívida ou a obrigação de outra pessoa.
    reason: cultural_note
lexical_decisions:
- source_word: לְקַח
  choice: Tome
  rationale: Imperativo qal masculino singular de לקח. “Tome” comunica uma ordem direta sem intensificá-la indevidamente como “apodere-se”.
- source_word: בִּגְדוֹ
  choice: a roupa dele
  rationale: בגד designa de modo amplo uma peça de vestuário. “A roupa dele” é natural e acessível em português atual, sem especificar “manto” ou “túnica”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem e preserva de modo fluente a relação causal do provérbio.
- source_word: עָרַב
  choice: se tornou fiador
  rationale: Neste contexto jurídico-financeiro, ערב indica assumir responsabilidade pela dívida ou obrigação de outra pessoa. “Tornar-se fiador” é claro e corrente em português.
- source_word: זָר
  choice: de um estranho
  rationale: זָר indica alguém de fora do círculo habitual. “Estranho” mantém a distância social expressa pelo termo sem acrescentar uma nacionalidade.
- source_word: וּבְעַד
  choice: em favor de
  rationale: בעד pode indicar representação ou responsabilidade assumida em benefício de terceiros. “Em favor de” torna essa relação clara em português.
- source_word: נכרים
  choice: estrangeiros
  rationale: O texto consonantal apresentado traz o plural de נכרי, referente a pessoas de fora da comunidade; “estrangeiros” preserva tanto o plural quanto a distinção lexical em relação a זָר.
- source_word: חַבְלֵהוּ
  choice: retenha-a como penhor
  rationale: חבל, neste contexto, diz respeito a tomar ou conservar uma garantia. O pronome é vertido no feminino por concordância natural com “roupa”, entendendo a peça de vestuário como o objeto retomado; a ambiguidade do hebraico é registrada em nota.
