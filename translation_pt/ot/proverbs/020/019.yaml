  text: גּֽוֹלֶה סּ֭וֹד הוֹלֵ֣ךְ רָכִ֑יל וּ/לְ/פֹתֶ֥ה שְׂ֝פָתָ֗י/ו לֹ֣א תִתְעָרָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/019.yaml
  text: One who reveals secrets goes about as a gossip[b][a]; do not associate with one who opens his lips wide.
translation:
  language: pt
  text: Quem revela segredos anda espalhando fofocas; não se associe com quem fala demais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com quem abre os lábios”. A expressão se refere a quem fala livremente demais ou sem discrição.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹלֶה סּוֹד
  choice: revela segredos
  rationale: O particípio de גלה indica divulgar ou expor algo oculto, e סוד, neste contexto, designa informação confidencial. A expressão é clara e conserva a imagem hebraica.
- source_word: הוֹלֵךְ רָכִיל
  choice: anda espalhando fofocas
  rationale: הולך preserva a ideia idiomática de uma conduta habitual, enquanto רכיל designa quem faz circular relatos prejudiciais. “Espalhando fofocas” comunica isso naturalmente sem restringir o sentido à acusação necessariamente falsa sugerida por “caluniador”.
- source_word: וּלְפֹתֶה שְׂפָתָיו
  choice: com quem fala demais
  rationale: A formulação hebraica retrata alguém que abre os lábios livremente, isto é, que fala sem a devida reserva. A tradução apresenta o sentido idiomático no texto e conserva a imagem literal em nota.
- source_word: לֹא תִתְעָרָב
  choice: não se associe
  rationale: O Hitpael de ערב significa misturar-se, envolver-se ou manter relações com alguém. “Não se associe” é natural, direto e adequado ao tom proverbial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “Fofocas” é imediatamente compreensível para leitores brasileiros e evita a força excessivamente específica de “calúnias”; a nota preserva a imagem concreta dos lábios presente no hebraico.
