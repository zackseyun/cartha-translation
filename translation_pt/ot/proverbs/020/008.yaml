  text: A king sitting on a throne of judgment winnows all evil with his eyes[a][b].
translation:
  language: pt
  text: O rei que se senta no trono de julgamento peneira todo o mal com os olhos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «joeira», «dispersa» ou «separa»; o verbo hebraico evoca o ato de joeirar, separando o que não presta daquilo que é bom.
    reason: lexical_alternative
  - marker: b
    text: Ou «toda pessoa má». O hebraico pode referir-se ao mal em sentido amplo ou, por implicação, aos malfeitores levados a julgamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: O rei
  rationale: O substantivo sem artigo tem valor genérico neste provérbio. Em português, «O rei» expressa naturalmente a classe ou função real, sem indicar um monarca específico.
- source_word: יוֹשֵׁב
  choice: que se assenta
  rationale: O particípio retrata uma postura característica ou contínua. A oração relativa é natural em português e preserva a imagem concreta do rei sentado para julgar.
- source_word: עַל כִּסֵּא דִין
  choice: no trono de julgamento
  rationale: «Trono» mantém o cenário régio de כִּסֵּא, enquanto «julgamento» comunica o sentido judicial de דִין sem reduzi-lo a uma cadeira comum.
- source_word: מְזָרֶה
  choice: peneira
  rationale: O verbo זרה evoca o ato agrícola de joeirar, separando o grão da palha. «Peneira» conserva de modo compreensível a metáfora de examinar e separar, embora «joeira» seja uma alternativa mais literal e menos corrente.
- source_word: בְעֵינָיו
  choice: com os olhos
  rationale: A preposição pode ter valor instrumental. A expressão preserva a imagem hebraica do olhar discernidor do rei, sem explicitar além do texto como esse discernimento opera.
- source_word: כָּל רָע
  choice: todo o mal
  rationale: רָע pode designar o mal de maneira ampla ou, contextualmente, pessoas más. «Todo o mal» mantém a abrangência e a ambiguidade do hebraico.
