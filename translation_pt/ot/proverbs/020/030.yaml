  text: חַבֻּר֣וֹת פֶּ֭צַע תמריק בְּ/רָ֑ע וּ֝/מַכּ֗וֹת חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/030.yaml
  text: The bruises of a wound cleanse away evil[b][a], and blows cleanse the innermost parts of the belly.
translation:
  language: pt
  text: 'Os vergões de um ferimento purificam o mal,[a]

    e os golpes purificam as câmaras do ventre.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “expurgam o mal”. O verbo hebraico pode transmitir a ideia de limpar, esfregar até remover ou expurgar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as câmaras do ventre”, expressão hebraica que representa as partes mais profundas do interior de uma pessoa.
    reason: cultural_note
lexical_decisions:
- source_word: חַבֻּרוֹת
  choice: vergões
  rationale: O substantivo indica marcas deixadas por golpes, como vergões ou contusões. “Vergões” preserva a imagem concreta de castigo físico e forma um paralelo claro com “golpes”.
- source_word: פֶּצַע
  choice: de um ferimento
  rationale: Foi entendido como complemento de חַבֻּרוֹת. A formulação mantém os dois substantivos do hebraico, sem reduzi-los a uma única imagem.
- source_word: תמריק
  choice: eliminam / purificam
  rationale: A forma causativa de מרק pode exprimir limpar, polir ou expurgar. “Eliminam” torna natural a relação com “o mal”; no segundo membro, “purificam” explicita o verbo subentendido pelo paralelismo e conserva a metáfora de limpeza.
- source_word: בְּרָע
  choice: o mal
  rationale: O mal é entendido como aquilo que a ação de limpeza remove. A formulação é concisa e preserva o peso moral de רַע.
- source_word: וּמַכּוֹת
  choice: e os golpes
  rationale: O termo designa golpes ou pancadas. “Golpes” é direto, atual e adequado ao paralelismo com os vergões.
- source_word: חַדְרֵי בָטֶן
  choice: as câmaras do ventre
  rationale: A expressão significa literalmente “câmaras do ventre” e representa as regiões mais profundas do interior humano. A imagem corporal foi mantida no texto, com esclarecimento em nota.
theological_decisions:
- issue: Sentido das imagens de ferimento e golpes
  choice: O provérbio apresenta a correção dolorosa como capaz de remover o mal e agir no interior mais profundo da pessoa.
  alternative: As imagens poderiam referir-se, de modo mais geral, ao efeito purificador do sofrimento, sem indicar especificamente disciplina corretiva.
  rationale: O paralelismo entre vergões e golpes favorece o contexto de correção, mas a tradução não acrescenta uma afirmação doutrinária sobre todo sofrimento nem identifica explicitamente o agente da disciplina.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a imagem corporal incomum do hebraico; a repetição verbal no segundo membro foi explicitada a partir do paralelismo.
