  text: תּוֹעֲבַ֣ת יְ֭הוָה אֶ֣בֶן וָ/אָ֑בֶן וּ/מֹאזְנֵ֖י מִרְמָ֣ה לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
translation:
  language: pt
  text: Pesos desiguais são uma abominação para Yahweh[a], e balanças fraudulentas não são boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma pedra e outra pedra”, expressão que se refere a pesos diferentes usados de modo desonesto no comércio.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: abominação
  rationale: Preserva a forte reprovação moral do substantivo hebraico e corresponde ao uso bíblico corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶבֶן וָאָבֶן
  choice: pesos desiguais
  rationale: A expressão literalmente repete 'pedra' e designa pesos de pedra diferentes, empregados de maneira desonesta no comércio. A tradução comunica naturalmente o sentido do idioma.
- source_word: וּמֹאזְנֵי מִרְמָה
  choice: e balanças fraudulentas
  rationale: מֹאזְנֵי designa balanças, e מִרְמָה indica fraude ou engano. 'Balanças fraudulentas' torna explícito o uso comercial desonesto sem acrescentar uma ideia estranha ao texto.
- source_word: לֹא טוֹב
  choice: não são boas
  rationale: Mantém a formulação hebraica deliberadamente moderada, 'não bom', sem intensificá-la para 'são más' ou 'são inaceitáveis'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal divino e representa de modo amplamente reconhecido sua provável pronúncia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção paralela e a expressão moderada 'não são boas' preservam a forma proverbial do hebraico.
