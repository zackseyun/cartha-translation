  yaml_path: translation/ot/proverbs/020/009.yaml
  text: Who can say[a], “I have made my heart pure; I am clean from my sin” ?
translation:
  language: pt
  text: 'Quem pode dizer: “Purifiquei o meu coração; estou limpo do meu pecado”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יֹאמַר
  choice: Quem pode dizer
  rationale: מִי é o interrogativo “quem”, seguido de “dizer”. O acréscimo idiomático de “pode” comunica em português a força retórica da pergunta, cuja resposta esperada é “ninguém”, sem apagar o verbo explícito.
- source_word: זִכִּיתִי
  choice: Purifiquei
  rationale: A forma piel de זכה, com “meu coração” como objeto, exprime tornar limpo ou puro. “Purifiquei” preserva de modo natural a ideia de ação exercida sobre o próprio coração.
- source_word: לִבִּי
  choice: o meu coração
  rationale: “Coração” conserva a antropologia bíblica e designa o centro interior e moral da pessoa, sem reduzi-lo apenas à mente ou às emoções.
- source_word: טָהַרְתִּי
  choice: estou limpo
  rationale: טהר pode indicar ser ou tornar-se limpo. “Estou limpo” destaca o estado resultante e mantém o paralelismo sem impor uma construção reflexiva mais forte do que a forma hebraica exige.
- source_word: מֵחַטָּאתִי
  choice: do meu pecado
  rationale: חטאת significa “pecado” neste contexto, e מִן indica separação ou afastamento. Em português, “limpo do meu pecado” reproduz com clareza essa relação.
theological_decisions:
- issue: Antropologia e alegação de pureza moral
  choice: Traduzir como pergunta retórica que põe em dúvida a possibilidade de alguém alegar verdadeiramente pureza interior e ausência de pecado.
  alternative: Entender como simples pergunta observacional sobre quem, talvez excepcionalmente, possa fazer essa afirmação.
  rationale: As duas declarações paralelas formulam uma alegação abrangente de pureza moral. “Quem pode dizer” conserva a resposta implícita “ninguém”, sem acrescentar uma formulação doutrinária que não esteja expressa no provérbio.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação mantém o paralelismo conciso do hebraico. Não se incluiu nota porque “Purifiquei” já preserva no texto principal a nuance de autocleansing da primeira forma verbal, enquanto “estou limpo” respeita a ambiguidade de estado ou resultado da segunda.
