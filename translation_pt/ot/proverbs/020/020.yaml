base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/020.yaml
  text: Whoever curses his father or his mother—his lamp will be put out in deepest darkness[a][b].
translation:
  language: pt
  text: Quem amaldiçoa seu pai e sua mãe terá a sua lâmpada apagada na mais profunda escuridão[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na pupila da escuridão”, expressão hebraica que indica a escuridão mais profunda ou mais negra.
    reason: cultural_note
  - marker: b
    text: 'Ou: “a sua lâmpada se apagará em completa escuridão”. A lâmpada provavelmente representa a vida, o bem-estar ou o futuro da pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַלֵּל
  choice: Quem amaldiçoa
  rationale: O particípio funciona como substantivo e formula uma máxima geral. “Quem amaldiçoa” é natural em português e preserva o sentido de proferir maldição contra alguém.
- source_word: אָבִיו וְאִמּוֹ
  choice: seu pai ou sua mãe
  rationale: 'Embora ו seja normalmente conjuntivo, neste enunciado de abrangência distributiva o português idiomático usa “ou”: a máxima se aplica a quem amaldiçoa qualquer um dos dois, sem exigir que amaldiçoe ambos.'
- source_word: יִדְעַךְ
  choice: terá ... apagada
  rationale: O verbo descreve uma lâmpada que se extingue. A construção expressa o resultado futuro e mantém em aberto o agente do juízo.
- source_word: נֵרוֹ
  choice: a sua lâmpada
  rationale: Mantém a imagem concreta de נֵר, que pode representar metaforicamente a vida, o bem-estar ou o futuro da pessoa.
- source_word: בְאִישׁוֹן חֹשֶׁךְ
  choice: na mais profunda escuridão
  rationale: Traduz idiomaticamente a expressão hebraica literalmente ligada à “pupila da escuridão”, comunicando seu sentido intensivo sem introduzir em português uma imagem obscura.
theological_decisions:
- issue: Sentido metafórico da lâmpada apagada
  choice: Preservar a imagem sem explicá-la no corpo do versículo
  alternative: Interpretar diretamente como morte, ruína, perda de prosperidade ou ausência de descendência
  rationale: O texto não especifica qual aspecto da vida, do bem-estar ou do futuro a lâmpada representa; uma explicitação resolveria indevidamente a tensão metafórica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação proverbial foi mantida concisa, e a metáfora concreta da lâmpada foi preservada.
