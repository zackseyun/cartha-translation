base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/006.yaml
  text: Many a man proclaims his own loyalty[b][a], but who can find a faithful man?
translation:
  language: pt
  text: Muitos proclamam a própria lealdade[a], mas quem poderá encontrar alguém fiel[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o seu amor constante” ou “a sua bondade”. A palavra hebraica também pode indicar amor leal, lealdade ou bondade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “alguém digno de confiança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אָדָם
  choice: Muitos
  rationale: 'A combinação de רָב com אָדָם tem sentido distributivo e genérico: muitas pessoas. “Muitos” é natural em português e não acrescenta uma especificação masculina ausente do substantivo humano genérico.'
- source_word: יִקְרָא
  choice: proclamam
  rationale: Embora קרא possa significar “chamar”, neste contexto indica declarar ou alardear uma qualidade própria; “proclamam” preserva o tom público da afirmação.
- source_word: אִישׁ חַסְדּוֹ
  choice: a própria lealdade
  rationale: חֶסֶד pode expressar amor constante, bondade ou lealdade. Aqui, em contraste com a pessoa realmente fiel, “lealdade” comunica com clareza a virtude que cada um reivindica para si. “Própria” representa o sufixo de terceira pessoa e o sentido de autoelogio.
- source_word: וְאִישׁ אֱמוּנִים
  choice: mas ... alguém fiel
  rationale: אֱמוּנִים denota fidelidade, confiabilidade ou constância. “Alguém fiel” mantém o caráter humano genérico e produz uma formulação proverbial natural.
- source_word: מִי יִמְצָא
  choice: quem encontrará
  rationale: O interrogativo com o imperfeito forma uma pergunta retórica que ressalta a raridade. O futuro simples conserva de perto a forma hebraica e soa idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e proverbial, com leitura natural no Brasil e ampla compreensão internacional. A tradução preserva o contraste entre a lealdade alegada e a fidelidade efetivamente demonstrada.
