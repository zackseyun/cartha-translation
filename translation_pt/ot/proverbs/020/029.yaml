  text: תִּפְאֶ֣רֶת בַּחוּרִ֣ים כֹּחָ֑/ם וַ/הֲדַ֖ר זְקֵנִ֣ים שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/029.yaml
  text: The glory of young men is their strength[a], and the splendor of old men is gray hair.
translation:
  language: pt
  text: 'A glória dos jovens é a sua força,

    e o esplendor dos idosos são os cabelos grisalhos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A beleza dos jovens é a sua força, e a honra dos idosos são os cabelos grisalhos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְאֶרֶת
  choice: glória
  rationale: O substantivo pode indicar glória, beleza, esplendor ou motivo de orgulho. “Glória” preserva a ideia de distinção honrosa e forma um paralelo poético natural com “esplendor”.
- source_word: בַּחוּרִים
  choice: jovens
  rationale: O hebraico designa jovens do sexo masculino. Em português, “os jovens” é natural e pode conservar a referência masculina no contraste com “os idosos”, sem a formulação menos fluida “homens jovens”.
- source_word: כֹּחָם
  choice: a sua força
  rationale: כֹּחַ denota força ou vigor; neste contexto, é a capacidade física característica da juventude. A forma singular concorda naturalmente com o nome coletivo plural em português.
- source_word: הֲדַר
  choice: esplendor
  rationale: O termo abrange esplendor, honra, majestade e beleza. “Esplendor” mantém o registro poético e o paralelismo com “glória”, sem eliminar a conotação de honra.
- source_word: זְקֵנִים
  choice: idosos
  rationale: O contraste é de idade, não de função comunitária; por isso, “idosos” é preferível a “anciãos”. É também atual, digno e amplamente compreensível.
- source_word: שֵׂיבָה
  choice: cabelos grisalhos
  rationale: O substantivo se refere à canície, isto é, aos cabelos grisalhos como sinal visível da velhice. A expressão concreta preserva a imagem do provérbio.
theological_decisions: []
translation_notes:
  register: Tradução poética, clara e digna, com paralelismo entre “glória” e “esplendor”. A concordância “o esplendor ... são os cabelos” trata “os cabelos grisalhos” como identificação predicativa e soa natural no português brasileiro contemporâneo. A nota preserva as alternativas semânticas relevantes de תִּפְאֶרֶת e הֲדַר.
