  text: מַ֣יִם עֲ֭מֻקִּים עֵצָ֣ה בְ/לֶב אִ֑ישׁ וְ/אִ֖ישׁ תְּבוּנָ֣ה יִדְלֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/005.yaml
  text: Counsel in a man's heart is like deep water[b][a], but a man of understanding draws it out.
translation:
  language: pt
  text: O conselho no coração de um homem é como águas profundas, mas um homem de entendimento o traz à tona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “um homem” e “um homem de entendimento”; neste provérbio, a forma masculina é usada em sentido genérico.
    reason: cultural_note
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: águas profundas
  rationale: Reproduz diretamente o plural hebraico e preserva a imagem de algo profundo, oculto e difícil de alcançar.
- source_word: עֵצָה
  choice: conselho
  rationale: Mantém o vocabulário característico da literatura sapiencial e pode abranger conselho, intenção ou deliberação interior sem restringir excessivamente o sentido.
- source_word: בְלֶב אִישׁ
  choice: no coração de um homem
  rationale: Preserva 'coração', que no hebraico inclui pensamento, vontade e intenção, e mantém a forma masculina genérica do provérbio.
- source_word: וְאִישׁ תְּבוּנָה
  choice: mas o homem que tem entendimento
  rationale: A conjunção recebe valor adversativo pelo contraste entre a inacessibilidade do conselho e a capacidade de alcançá-lo; 'entendimento' preserva o campo sapiencial de תְּבוּנָה.
- source_word: יִדְלֶנָּה
  choice: sabe tirá-lo de lá
  rationale: Comunica a ação de retirar ou trazer à tona, como quem tira água de um poço, e o verbo 'sabe' torna explícita de modo natural a capacidade associada ao entendimento, sem eliminar a metáfora contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das imagens foi mantida próxima ao hebraico. O plural literal 'águas profundas' soa natural em português, dispensando nota lexical. O pronome em 'tirá-lo' retoma 'conselho', enquanto 'de lá' ajuda a conservar a imagem de extração das profundezas.
