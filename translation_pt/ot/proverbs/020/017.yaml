  text: עָרֵ֣ב לָ֭/אִישׁ לֶ֣חֶם שָׁ֑קֶר וְ֝/אַחַ֗ר יִמָּֽלֵא פִ֥י/הוּ חָצָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/017.yaml
  text: Bread of deceit is sweet to a man[b][a], but afterward his mouth is filled with gravel.
translation:
  language: pt
  text: O pão da mentira[a] é saboroso para o homem, mas depois a sua boca se encherá de cascalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pão da falsidade”; pode referir-se a pão ou sustento obtido por meio do engano.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵב
  choice: é saboroso
  rationale: O termo significa “agradável”, “doce” ou “prazeroso”. No contexto da imagem alimentar, “saboroso” soa natural em português e reforça o contraste irônico com o cascalho.
- source_word: לָאִישׁ
  choice: para o homem
  rationale: Mantém o singular masculino do hebraico, empregado aqui como personagem representativa do provérbio.
- source_word: לֶחֶם שָׁקֶר
  choice: o pão da mentira
  rationale: Preserva a construção concreta e concisa do hebraico, sem eliminar sua possível referência a alimento obtido por meio de engano.
- source_word: וְאַחַר
  choice: mas depois
  rationale: Embora a conjunção seja literalmente “e”, o contraste entre o prazer inicial e a consequência posterior é expresso naturalmente por “mas” em português.
- source_word: יִמָּלֵא
  choice: se encherá
  rationale: O imperfeito nifal apresenta a consequência subsequente; o futuro em português acompanha claramente a progressão temporal do provérbio.
- source_word: פִיהוּ
  choice: a sua boca
  rationale: Tradução direta que conserva a imagem sensorial central.
- source_word: חָצָץ
  choice: cascalho
  rationale: O substantivo designa pequenas pedras ou cascalho; a escolha preserva a imagem áspera e dolorosa que reverte o prazer inicial.
