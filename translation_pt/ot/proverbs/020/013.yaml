  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
translation:
  language: pt
  text: Não ame o sono, para que não caia na pobreza; abra os olhos e se fartará de pão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “abra os olhos; farte-se de pão”. A última oração também pode ser entendida como uma ordem, em vez de resultado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֶּאֱהַב
  choice: Não ame
  rationale: A partícula negativa com a forma verbal expressa uma proibição. A tradução direta preserva a força moral do provérbio.
- source_word: שֵׁנָה
  choice: o sono
  rationale: É o sentido comum do substantivo hebraico; a formulação é clara e atual em português.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz uma consequência negativa a ser evitada. Esta construção é natural e digna em português.
- source_word: תִּוָּרֵשׁ
  choice: caia na pobreza
  rationale: O verbo, no contexto, indica tornar-se pobre ou ser reduzido à pobreza, como consequência da indolência.
- source_word: פְּקַח עֵינֶיךָ
  choice: abra os olhos
  rationale: Mantém a imagem concreta do hebraico, que no contexto também conota despertar e agir com diligência.
- source_word: שְׂבַע
  choice: se fartará
  rationale: Embora a forma hebraica seja imperativa, a sequência proverbial permite entendê-la como o resultado da ordem anterior. O futuro explicita naturalmente essa relação sem eliminar a forma literal, registrada em nota.
- source_word: לָחֶם
  choice: de pão
  rationale: Preserva a imagem hebraica de pão como alimento e provisão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A imagem hebraica de abrir os olhos e a referência concreta ao pão foram preservadas; a relação entre as duas últimas orações foi expressa como resultado, com a alternativa formal indicada em nota.
