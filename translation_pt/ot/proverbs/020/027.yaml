  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/027.yaml
  text: The spirit of man is the lamp of Yahweh[b][a], searching all the innermost chambers of the belly.
translation:
  language: pt
  text: O espírito[a] do ser humano é a lâmpada de Yahweh; ela sonda todas as câmaras do ventre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O sopro do ser humano é a lâmpada de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “as câmaras do ventre”, expressão figurada para as partes mais profundas do interior de uma pessoa.
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  choice: lâmpada
  rationale: Preserva a imagem concreta de um instrumento que ilumina e revela o que está oculto, em vez de substituí-la pelo conceito abstrato de “luz”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: נִשְׁמַת
  choice: espírito
  rationale: Neste contexto antropológico, נשמה pode indicar o sopro vital ou espírito humano. “Espírito” é natural em português e mantém a referência ampla à dimensão interior da pessoa; a alternativa “sopro” é registrada em nota.
- source_word: אָדָם
  choice: ser humano
  rationale: O substantivo é genérico e singular. “Ser humano” comunica essa abrangência em português atual sem restringir o provérbio ao sexo masculino.
- source_word: חֹפֵשׂ
  choice: sonda
  rationale: O particípio descreve uma ação contínua de busca minuciosa. “Sonda” combina com a imagem da lâmpada que penetra e expõe os recantos ocultos.
- source_word: כָּל
  choice: todas
  rationale: Expressa diretamente a totalidade abrangida pela sondagem.
- source_word: חַדְרֵי
  choice: câmaras
  rationale: Mantém a metáfora espacial hebraica de compartimentos ou recintos interiores, sem convertê-la inteiramente em uma abstração.
- source_word: בָטֶן
  choice: ventre
  rationale: Conserva a imagem corporal do hebraico e, em português bíblico atual, pode representar figuradamente o interior profundo da pessoa. Uma nota esclarece o sentido idiomático.
theological_decisions:
- issue: Sentido antropológico de נִשְׁמַת אָדָם
  choice: O espírito ou sopro vital humano é apresentado como a lâmpada de Yahweh que sonda a interioridade da pessoa.
  alternative: Entender o termo mais concretamente como “sopro” ou interpretá-lo especificamente como “consciência”.
  rationale: O hebraico permite “espírito” ou “sopro”, mas não nomeia explicitamente a consciência. O texto principal mantém a categoria antropológica ampla, enquanto a nota preserva a alternativa lexical sem impor uma interpretação teológica mais específica.
- issue: Agente da sondagem
  choice: A oração relativa liga a ação de sondar à metáfora da lâmpada.
  alternative: Explicitar que Yahweh sonda a pessoa por meio do espírito humano, ou tomar diretamente o espírito como agente.
  rationale: O particípio masculino חֹפֵשׂ se associa naturalmente a נֵר, “lâmpada”, também masculino em hebraico. A formulação portuguesa conserva essa ligação sem desenvolver além do texto o modo exato da ação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva as imagens concretas de “lâmpada”, “câmaras” e “ventre”, esclarecendo em nota o idioma corporal hebraico. “Ser humano” mantém o valor genérico singular de אָדָם.
