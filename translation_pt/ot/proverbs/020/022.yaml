  text: אַל תֹּאמַ֥ר אֲשַׁלְּמָה רָ֑ע קַוֵּ֥ה לַֽ֝/יהוָ֗ה וְ/יֹ֣שַֽׁע לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/022.yaml
  text: Do not say[a], “I will repay evil”; wait for Yahweh[c][b], and he will save you.
translation:
  language: pt
  text: 'Não diga: “Retribuirei o mal”[a]. Espere por Yahweh[b], e ele salvará você[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pagarei de volta o mal” ou “Retribuirei a injustiça”.'
    reason: lexical_alternative
  - marker: b
    text: “Esperar por” também traz a ideia de aguardar com esperança e confiança em Yahweh.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “livrará você”; conforme o contexto, o verbo também pode incluir a ideia de defender sua causa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: A partícula אַל com a forma verbal seguinte expressa uma proibição; “Não diga” é direto, natural e introduz adequadamente a fala citada.
- source_word: אֲשַׁלְּמָה רָע
  choice: Retribuirei o mal
  rationale: O Piel de שׁלם, neste contexto, indica pagar na mesma moeda ou revidar. “Retribuirei o mal” preserva tanto a reciprocidade quanto a dimensão moral de רָע.
- source_word: קַוֵּה
  choice: Espere
  rationale: קוה denota esperar com expectativa e esperança. “Espere” mantém o sentido básico, enquanto a nota explicita sua nuance confiante.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: A preposição לְ com קוה pode ser expressa naturalmente como “esperar por”; o nome divino יהוה é transliterado “Yahweh”, preservando o nome próprio presente no hebraico.
- source_word: וְיֹשַׁע לָךְ
  choice: e ele salvará você
  rationale: 'O Hifil de ישׁע abrange salvar e livrar. A construção com לָךְ é vertida de modo idiomático em português como objeto direto: “salvará você”.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Amplitude do verbo ישׁע
  choice: salvará você
  alternative: livrará você; defenderá sua causa
  rationale: “Salvar” preserva a amplitude do verbo hebraico, que pode envolver resgate, livramento ou vindicação, sem limitar antecipadamente a forma da intervenção divina.
- issue: Relação entre não retaliar e esperar em Deus
  choice: Mantém a sequência exortativa sem explicar o mecanismo da ação divina
  alternative: Acrescentar que Deus vingará ou fará justiça
  rationale: O versículo ordena que a pessoa não anuncie retaliação e espere por Yahweh, prometendo salvação. Não afirma explicitamente neste verso que Deus praticará a retaliação em lugar dela.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O futuro “retribuirei” conserva o tom deliberado da fala; “salvará você” evita marcação de gênero e mantém clareza internacional. Os marcadores aparecem imediatamente após as expressões às quais se referem.
