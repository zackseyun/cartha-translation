  text: מַ֭חֲשָׁבוֹת בְּ/עֵצָ֣ה תִכּ֑וֹן וּ֝/בְ/תַחְבֻּל֗וֹת עֲשֵׂ֣ה מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/018.yaml
  text: Plans are established by counsel[a]; wage war with strategy.
translation:
  language: pt
  text: Os planos se firmam com conselho; faça guerra com estratégias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחֲשָׁבוֹת
  choice: planos
  rationale: Neste contexto, o plural indica cursos de ação pretendidos, não apenas pensamentos interiores; também se liga naturalmente à ação militar do segundo membro.
- source_word: בְּעֵצָה
  choice: com bons conselhos
  rationale: 'A preposição tem valor instrumental: os planos se tornam firmes mediante conselho. O plural é natural em português, e ''bons'' explicita de modo idiomático a qualidade prudente pressuposta no contexto sapiencial.'
- source_word: תִכּוֹן
  choice: se firmam
  rationale: O nifal de כון expressa ser estabelecido ou tornado firme. A construção reflexiva/passiva com plural é clara e natural em português.
- source_word: וּבְתַחְבֻּלוֹת
  choice: com estratégia
  rationale: O termo evoca direção hábil, originalmente como o ato de conduzir ou governar, e no contexto militar comunica planejamento estratégico sem reproduzir de forma rígida a metáfora.
- source_word: עֲשֵׂה
  choice: faça
  rationale: Com מִלְחָמָה, o verbo forma a expressão 'fazer guerra'. Em português, 'faça a guerra' é idiomático, direto e preserva o imperativo.
- source_word: מִלְחָמָה
  choice: guerra
  rationale: É o equivalente direto e amplo do substantivo hebraico neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso de provérbio. A formulação mantém o conselho como meio de consolidar planos e a estratégia como condição prudencial para a guerra, sem acrescentar aprovação moral irrestrita do conflito.
