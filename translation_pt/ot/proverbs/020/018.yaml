  verdict: revise
  source_fidelity: 'A tradução capta adequadamente a estrutura e o sentido geral do provérbio: os planos são firmados por conselho, e a guerra requer orientação estratégica. Contudo, “bons” acrescenta uma qualificação avaliativa que אינה está expressa em בְּעֵצָה (“por/com conselho”). Além disso, o plural de תַּחְבֻּלוֹת é melhor preservado por “estratégias”.'
  naturalness: “Os planos se firmam” é claro e idiomático. “Faça guerra com estratégias” mantém o imperativo proverbial e é compreensível em português moderno; o ponto e vírgula preserva bem o paralelismo conciso.
  terminology: “Planos”, “conselho”, “guerra” e “estratégias” correspondem bem aos termos hebraicos. “Conselho”, no singular coletivo, evita introduzir o plural “conselhos” onde o hebraico usa o singular.
