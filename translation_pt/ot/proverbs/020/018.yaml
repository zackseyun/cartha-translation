  - severity: low
    issue: “estratégia” verte um substantivo hebraico plural.
    rationale: תַּחְבֻּלוֹת está no plural e denota estratégias, orientações hábeis ou medidas táticas. O plural português preserva melhor a forma e a amplitude do original.
