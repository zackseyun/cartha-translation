  naturalness: «Amor leal», «fidelidade», «preservam» e «seu trono é sustentado» são formulações naturais, claras e de registro proverbial em português moderno. A vírgula em «e, pelo amor leal, seu trono...» melhora levemente a leitura sem alterar a estrutura.
