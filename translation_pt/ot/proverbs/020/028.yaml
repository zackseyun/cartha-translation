base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/028.yaml
  text: Steadfast love and faithfulness preserve a king[c][b][a], and by steadfast love his throne is upheld.
translation:
  language: pt
  text: 'O amor leal[c] e a fidelidade[a] preservam[b] um rei,

    e, pelo amor leal, seu trono é sustentado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «verdade»; aqui, אֱמֶת provavelmente ressalta a confiabilidade ou fidelidade ao lado do amor leal.
    reason: lexical_alternative
  - marker: b
    text: Ou «guardam» ou «protegem», em vez de «preservam».
    reason: lexical_alternative
  - marker: c
    text: O mesmo termo hebraico, חֶסֶד, é repetido nas duas partes do provérbio; por isso, «amor leal» é repetido na tradução.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa benevolência comprometida e lealdade duradoura, indo além de mera bondade ou misericórdia; a repetição nas duas partes conserva a ênfase hebraica.
- source_word: אֱמֶת
  choice: fidelidade
  rationale: Na associação com חֶסֶד, indica sobretudo confiabilidade e constância, embora também possa significar «verdade».
- source_word: יִצְּרוּ
  choice: preservam
  rationale: O verbo נצר significa guardar, conservar ou proteger; «preservam» comunica naturalmente o efeito protetor dessas virtudes sobre o rei.
- source_word: מֶלֶךְ
  choice: o rei
  rationale: Embora o substantivo hebraico não tenha artigo e a máxima seja genérica, em português «o rei» expressa com naturalidade uma classe ou função em enunciados proverbiais.
- source_word: וְסָעַד
  choice: e ... é sustentado
  rationale: O verbo סעד descreve apoiar ou sustentar. A formulação passiva em português mantém o trono como aquilo que recebe sustentação.
- source_word: בַּחֶסֶד
  choice: pelo amor leal
  rationale: 'A preposição בְּ tem sentido instrumental neste contexto: o amor leal é o meio pelo qual o trono é sustentado.'
- source_word: כִּסְאוֹ
  choice: seu trono
  rationale: Conserva a imagem concreta do trono e o sufixo masculino singular, ainda que o trono represente, por metonímia, o governo real.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Amor leal» preserva a força relacional de חֶסֶד e é repetido nas duas partes, como no hebraico. A ordem dos marcadores foi normalizada e cada nota corresponde ao elemento pertinente do texto.
