base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/026.yaml
  text: A wise king winnows the wicked and drives the wheel over them.
translation:
  language: pt
  text: Um rei sábio joeira os perversos e faz a roda passar sobre eles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, a roda de um instrumento usado para debulhar o cereal.
    reason: Esclarece a provável imagem agrícola sem substituir no texto o termo hebraico direto, «roda», nem afirmar com certeza a identificação do instrumento.
lexical_decisions:
- source_word: מְזָרֶה
  choice: joeira
  rationale: O particípio de זרה descreve a ação de separar o cereal ao vento; “joeira” preserva de modo conciso a imagem agrícola aplicada ao julgamento dos perversos.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Expressa pessoas moralmente culpadas ou ímpias em linguagem portuguesa atual, sem restringir o termo a uma categoria jurídica.
- source_word: וַיָּשֶׁב עֲלֵיהֶם
  choice: faz passar sobre eles
  rationale: Comunica a ação causativa exercida pelo rei e mantém a imagem severa de fazer a roda atuar sobre os perversos, sem suavizá-la.
- source_word: אוֹפָן
  choice: a roda
  rationale: É o sentido direto do substantivo; no contexto agrícola, provavelmente alude à roda de um instrumento de debulha.
theological_decisions:
- issue: A imagem do julgamento régio
  choice: Preservar as duas imagens agrícolas — joeirar e fazer passar a roda — como descrição da ação do rei sábio contra os perversos.
  alternative: Explicitar abstratamente que o rei “separa e castiga” os maus.
  rationale: O provérbio apresenta o julgamento por meio de metáforas concretas. Torná-las abstratas eliminaria sua força e poderia definir além do que o texto afirma a natureza exata do castigo.
translation_notes:
  register: Português moderno, digno e conciso, com leitura natural no Brasil e compreensão internacional. “Joeira” mantém a precisão da metáfora agrícola; a nota esclarece a referência menos familiar.
