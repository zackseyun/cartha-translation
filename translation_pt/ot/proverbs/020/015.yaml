  text: יֵ֣שׁ זָ֭הָב וְ/רָב פְּנִינִ֑ים וּ/כְלִ֥י יְ֝קָ֗ר שִׂפְתֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/015.yaml
  text: There is gold[a], and an abundance of pearls, but lips of knowledge are a precious vessel.
translation:
  language: pt
  text: Há ouro e abundância de pedras preciosas[a], mas lábios que expressam conhecimento são um objeto precioso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pérolas”, “rubis” ou “corais”; o referente exato do termo hebraico é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há
  rationale: A partícula existencial introduz a observação proverbial; “Há” é a forma natural e concisa em português.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do termo hebraico para o metal precioso.
- source_word: וְרָב
  choice: e muitas
  rationale: רָב indica grande quantidade e concorda naturalmente, em português, com “pedras preciosas”.
- source_word: פְּנִינִים
  choice: pedras preciosas
  rationale: O referente exato é incerto e pode designar pérolas, corais, rubis ou outras gemas; a expressão geral evita uma precisão não sustentada, e a nota preserva as alternativas.
- source_word: וּכְלִי יְקָר
  choice: mas ... são uma joia preciosa
  rationale: כְלִי pode ser objeto, utensílio ou recipiente; aqui funciona como imagem de algo valioso. “Joia preciosa” comunica naturalmente a comparação e mantém o contraste poético introduzido pelo waw.
- source_word: שִׂפְתֵי דָעַת
  choice: lábios que comunicam conhecimento
  rationale: A construção literal é “lábios de conhecimento”; a formulação escolhida esclarece, sem ampliar indevidamente, que se trata de fala marcada pelo conhecimento.
