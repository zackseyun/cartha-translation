  naturalness: O texto é fluente em português moderno. A revisão proposta mantém essa fluência e torna a segunda linha mais idiomática sem perder o paralelismo.
  terminology: “Pedras preciosas” é uma solução prudente para פְּנִינִים, cujo referente é incerto, e a nota registra alternativas adequadas. “Objeto precioso” é preferível a “joia preciosa” para כְלִי יְקָר.
