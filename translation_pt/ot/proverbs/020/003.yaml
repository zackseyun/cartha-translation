  text: כָּב֣וֹד לָ֭/אִישׁ שֶׁ֣בֶת מֵ/רִ֑יב וְ/כָל אֱ֝וִ֗יל יִתְגַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/003.yaml
  text: It is an honor for a man to keep away from strife[a], but every fool bursts out in quarrel.
translation:
  language: pt
  text: 'É uma honra para o homem manter-se longe de contendas,

    mas todo insensato se lança numa briga.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido como “se lança numa briga” é raro e de sentido incerto. Também pode significar “se mete numa briga” ou, mais literalmente, algo como “se mostra” de maneira agressiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּבוֹד
  choice: honra
  rationale: No contexto sapiencial, o substantivo indica estima ou conduta honrosa; “honra” comunica naturalmente o valor social e moral da atitude.
- source_word: לָאִישׁ
  choice: para o homem
  rationale: Preserva o singular masculino do hebraico אִישׁ, empregado aqui com força representativa própria do estilo proverbial.
- source_word: שֶׁבֶת
  choice: manter-se longe
  rationale: Nesta construção com מִן, expressa cessar, abster-se ou ficar fora de algo. A formulação escolhida transmite esse sentido em português corrente.
- source_word: מֵרִיב
  choice: de contendas
  rationale: רִיב pode designar disputa, conflito ou briga. “Contendas” conserva o caráter geral e proverbial da advertência.
- source_word: אֱוִיל
  choice: insensato
  rationale: Termo sapiencial que caracteriza uma falha moral e prática, não apenas intelectual. “Insensato” é natural e digno em português bíblico moderno.
- source_word: יִתְגַּלָּע
  choice: se lança numa briga
  rationale: A forma hitpael é rara e de sentido incerto. Pelo contraste com manter-se longe de contendas, provavelmente descreve alguém que irrompe ou se solta numa discussão; a tradução mantém esse movimento sem ocultar a incerteza, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. O paralelismo antitético foi preservado, assim como o masculino singular representativo do hebraico. A quebra de linha realça as duas metades do provérbio.
