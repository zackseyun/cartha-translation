  text: מוֹקֵ֣שׁ אָ֭דָם יָ֣לַע קֹ֑דֶשׁ וְ/אַחַ֖ר נְדָרִ֣ים לְ/בַקֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/025.yaml
  text: It is a snare for a man to rashly dedicate something as holy, and only afterward to consider his vows.
translation:
  language: pt
  text: É uma armadilha para alguém consagrar algo precipitadamente[a] como santo e só depois examinar os votos que fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido como “consagrar precipitadamente” é raro e de sentido incerto. A expressão também pode ser entendida como falar impensadamente ao declarar algo santo.
    reason: Registra uma incerteza lexical genuína sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: מוֹקֵשׁ
  choice: armadilha
  rationale: Expressa diretamente a ideia de laço ou cilada que traz consequências para quem age sem cautela.
- source_word: יָלַע קֹדֶשׁ
  choice: consagrar algo precipitadamente como santo
  rationale: O verbo יָלַע é raro e de sentido discutido; no contexto de votos, a expressão aponta para uma declaração ou dedicação impensada de algo como sagrado. A formulação explicita o objeto implícito sem limitar sua natureza.
- source_word: וְאַחַר נְדָרִים לְבַקֵּר
  choice: e só depois examinar os votos que fez
  rationale: Preserva a sequência temporal e traduz לְבַקֵּר como examinar ou reconsiderar cuidadosamente. 'Que fez' torna natural em português a referência aos próprios votos, implícita no contexto.
theological_decisions:
- issue: Natureza do ato precipitado
  choice: consagrar algo como santo
  alternative: 'dizer precipitadamente: “É santo”'
  rationale: O contexto de votos favorece um ato de dedicação, mas a redação evita especificar um ritual ou sistema religioso não declarado no hebraico.
- issue: Força de 'examinar' após os votos
  choice: examinar os votos que fez
  alternative: procurar uma forma de escapar dos votos
  rationale: A alternativa é uma interpretação possível das consequências, mas não está expressa lexicalmente. A tradução mantém o sentido mais direto de לְבַקֵּר e preserva a tensão do provérbio.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. 'Alguém' representa o uso genérico de אָדָם sem restringir o provérbio ao sexo masculino.
