  source_fidelity: 'A tradução preserva adequadamente a estrutura proverbial do hebraico: o justo é caracterizado por andar em sua integridade, e seus filhos são declarados felizes/bem-aventurados depois dele. “Anda”, “integridade”, “justo”, “filhos” e “depois dele” correspondem de perto aos termos e à concisão do texto-fonte. A forma masculina singular permanece representativa, como no hebraico.'
