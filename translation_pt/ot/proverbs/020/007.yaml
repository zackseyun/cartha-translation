  terminology: “Integridade” é uma boa equivalência para בְּתֻמּוֹ, e “justo” corresponde de modo estabelecido a צַדִּיק. “Felizes” transmite adequadamente אַשְׁרֵי como declaração de condição favorável, sem introduzir uma causa teológica não expressa. A nota oferece “bem-aventurados” como alternativa legítima.
