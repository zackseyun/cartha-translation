id: PRO.20.7
reference: Proverbs 20:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִתְהַלֵּ֣ךְ בְּ/תֻמּ֣/וֹ צַדִּ֑יק אַשְׁרֵ֖י בָנָ֣י/ו אַחֲרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/007.yaml
  text: A righteous man walks in his integrity[b][a]; blessed are his children after him.
translation:
  language: pt
  text: O justo anda em sua integridade; felizes os seus filhos depois dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bem-aventurados os seus filhos depois dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְהַלֵּךְ
  choice: anda
  rationale: O particípio hitpael de הלך descreve a maneira habitual de viver ou proceder. “Anda” preserva a metáfora hebraica e é compreensível no registro sapiencial em português.
- source_word: בְּתֻמּוֹ
  choice: em sua integridade
  rationale: תֹּם/תֻּם expressa inteireza, retidão ou integridade de caráter. A formulação conserva a preposição hebraica e o sentido ético.
- source_word: צַדִּיק
  choice: o justo
  rationale: O termo designa uma pessoa justa e está no masculino singular representativo. “O justo” é conciso, natural em provérbios e preserva a forma do hebraico.
- source_word: אַשְׁרֵי
  choice: felizes
  rationale: אַשְׁרֵי proclama a condição favorável, invejável ou bem-aventurada de alguém. “Felizes” é claro e atual, sem limitar necessariamente o sentido a uma emoção passageira.
- source_word: בָנָיו
  choice: os seus filhos
  rationale: Embora בנים possa abranger descendentes de ambos os sexos, “filhos” também pode funcionar genericamente em português e mantém a concisão e a forma familiar do texto.
- source_word: אַחֲרָיו
  choice: depois dele
  rationale: A expressão aponta para os filhos que vêm depois do justo, possivelmente tanto em sucessão temporal quanto seguindo seu legado; a tradução direta preserva essa abertura.
theological_decisions:
- issue: Masculino singular representativo no provérbio
  choice: o justo
  alternative: a pessoa justa
  rationale: O hebraico emprega o masculino singular em uma máxima de alcance geral. A tradução conserva essa forma sem afirmar que o princípio exclua as mulheres.
- issue: Natureza da felicidade dos descendentes
  choice: felizes os seus filhos depois dele
  alternative: abençoados os seus filhos depois dele
  rationale: O hebraico אַשְׁרֵי descreve uma condição favorável ou digna de celebração, mas não declara explicitamente uma ação divina de abençoar. “Felizes” mantém o caráter exclamativo sem resolver além do texto a causa dessa condição.
translation_notes:
  register: Português moderno, conciso e digno, com cadência proverbial. A metáfora “anda em sua integridade” foi mantida por ser inteligível e refletir de perto o hebraico. O marcador [a] aparece no texto principal.
