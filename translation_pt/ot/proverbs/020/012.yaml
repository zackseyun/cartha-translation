base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/012.yaml
  text: The hearing ear and the seeing eye—Yahweh made both of them[a].
translation:
  language: pt
  text: O ouvido que ouve e o olho que vê — Yahweh fez ambos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O ouvido capaz de ouvir e o olho capaz de ver — Yahweh fez os dois.”'
    reason: Alternativa lexical que torna explícita a possível nuance de capacidade dos particípios hebraicos e a expressão literal “os dois”.
lexical_decisions:
- source_word: אֹזֶן שֹׁמַעַת
  choice: o ouvido que ouve
  rationale: Mantém o substantivo concreto no singular e traduz o particípio atributivo de modo natural, preservando o paralelismo hebraico.
- source_word: עַיִן רֹאָה
  choice: o olho que vê
  rationale: Reproduz a construção paralela da primeira expressão e conserva o singular poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עָשָׂה
  choice: fez
  rationale: É a tradução direta e natural do qal perfeito; expressa aqui uma verdade geral sobre a ação de Deus sem acrescentar a especificidade de 'criou'.
- source_word: גַם שְׁנֵיהֶם
  choice: ambos
  rationale: Expressa com concisão o sentido inclusivo de גַם junto de 'os dois deles', referindo-se ao ouvido e ao olho.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem convertê-lo em título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “ouvido que ouve” e “olho que vê” foi preservada por refletir a simetria enfática do provérbio hebraico.
