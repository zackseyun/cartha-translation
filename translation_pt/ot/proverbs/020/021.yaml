base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/021.yaml
  text: An inheritance gained hastily at first will not be blessed in the end[a].
translation:
  language: pt
  text: A herança obtida às pressas no início não será abençoada no fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A herança obtida rapidamente desde o princípio”. O termo hebraico pode enfatizar rapidez, aquisição prematura ou pressa motivada pela avidez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: herança
  rationale: O substantivo designa propriedade ou posse herdada; “herança” é o equivalente português mais natural e preserva o contexto de riqueza familiar.
- source_word: מבחלת
  choice: obtida às pressas
  rationale: A forma é geralmente relacionada à ideia de apressar-se ou adquirir rapidamente, talvez com precipitação ou avidez. A expressão conserva a noção de rapidez e sua provável conotação imprópria.
- source_word: בָּרִאשֹׁנָה
  choice: no início
  rationale: A expressão temporal assinala a fase inicial e forma um contraste claro e conciso com “no fim”.
- source_word: וְאַחֲרִיתָהּ
  choice: no fim
  rationale: O termo com sufixo significa literalmente “seu fim” ou “seu resultado final”; em português proverbial, “no fim” comunica naturalmente o desfecho.
- source_word: לֹא תְבֹרָךְ
  choice: não será abençoada
  rationale: Mantém a linguagem ampla de bênção do hebraico, sem restringi-la à prosperidade material nem explicitar um mecanismo específico de juízo.
theological_decisions:
- issue: Natureza da advertência do provérbio
  choice: A herança adquirida com pressa não terá bênção em seu resultado final, sem especificar como isso ocorrerá.
  alternative: Entender a frase exclusivamente como juízo divino contra a ganância ou apenas como consequência prática da impaciência.
  rationale: A formulação preserva a abrangência teológica de “não será abençoada” e não reduz a máxima nem a uma punição explicitamente definida nem a meras consequências naturais.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Às pressas” é amplamente compreensível no Brasil e em outras variedades do português; a nota preserva a ambiguidade lexical do hebraico.
