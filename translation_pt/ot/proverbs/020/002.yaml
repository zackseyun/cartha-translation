source:
  edition: WLC
  text: נַ֣הַם כַּ֭/כְּפִיר אֵ֣ימַת מֶ֑לֶךְ מִ֝תְעַבְּר֗/וֹ חוֹטֵ֥א נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/002.yaml
  text: The terror of a king is like the growling of a young lion[c][b][a]; whoever provokes him to anger sins against his own life.
translation:
  language: pt
  text: O terror que o rei inspira é como o rugido de um leão jovem; quem provoca a sua ira[a] peca contra a própria vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quem o provoca”; o sentido provável é provocar a ira do rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “peca contra si mesmo” ou “contra a própria alma”. O hebraico néfesh pode significar “vida”, “pessoa” ou “alma”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: rugido
  rationale: O substantivo designa o som ameaçador de um leão. “Rugido” é a expressão portuguesa mais natural e digna; “rosnado” também é possível, mas pode sugerir um som mais baixo e específico do que o hebraico exige.
- source_word: כְּפִיר
  choice: leão jovem
  rationale: Preserva a especificidade de כפיר, que normalmente indica um leão jovem, vigoroso e perigoso.
- source_word: אֵימַת מֶלֶךְ
  choice: o terror que o rei inspira
  rationale: A construção expressa o temor intenso provocado pelo rei. A formulação explicita com naturalidade que o rei é a fonte desse terror, sem mudar o sentido.
- source_word: מִתְעַבְּרוֹ
  choice: quem provoca a sua ira
  rationale: O particípio hitpael com sufixo admite dificuldade sintática, mas no contexto adverte contra despertar a ira do rei. Esta tradução comunica o sentido provável sem recorrer a uma expressão coloquial.
- source_word: חוֹטֵא
  choice: peca
  rationale: Mantém a linguagem moral do verbo חטא, em vez de reduzir a advertência a uma simples imprudência ou perda.
- source_word: נַפְשׁוֹ
  choice: a própria vida
  rationale: Neste contexto de perigo diante da ira real, נפש se refere naturalmente à vida ou à própria pessoa. “A própria vida” torna clara a consequência mortal e conserva a força reflexiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da comparação foi mantida próxima do hebraico, enquanto “que o rei inspira” esclarece de modo natural a relação do construto. “Rugido” foi preferido a “rosnado” por ser mais idiomático em português na imagem do leão.
