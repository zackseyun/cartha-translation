  source_fidelity: O texto traduz com precisão os dois membros do provérbio. «Por causa do inverno» representa adequadamente a leitura causal possível de מֵחֹרֶף, e a nota preserva a alternativa temporal. «Não ara» corresponde especificamente a יַחֲרֹשׁ. «Na colheita, procura» mantém a concisão e o objeto não expresso de יִשְׁאָל, sem introduzir indevidamente aquilo que ele procura. «Mas não há nada» transmite bem a negação existencial final, com contraste consequencial natural em português.
