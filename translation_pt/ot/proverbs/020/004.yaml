base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/004.yaml
  text: Because of winter[a], the lazy man does not plow; at harvest he seeks[b], and there is nothing.
translation:
  language: pt
  text: Por causa do inverno[a], o preguiçoso não ara; na colheita, procura[b], mas não há nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No inverno, o preguiçoso não ara”. A preposição hebraica pode indicar tempo (“no inverno”) ou causa (“por causa do inverno”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pede”. O verbo hebraico pode significar “pedir” ou, por implicação neste contexto, “procurar” ou solicitar alimento quando chega a colheita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחֹרֶף
  choice: Por causa do inverno
  rationale: 'A preposição מִן pode ter sentido causal: o inverno, ou o frio dessa estação, é o motivo alegado para não arar. A alternativa temporal permanece indicada em nota.'
- source_word: עָצֵל
  choice: o preguiçoso
  rationale: Termo corrente e natural em português para a figura típica da literatura sapiencial, preservando o masculino singular representativo do hebraico.
- source_word: לֹא יַחֲרֹשׁ
  choice: não ara
  rationale: O verbo חרשׁ refere-se especificamente a arar a terra; o presente expressa bem a força proverbial e geral da frase.
- source_word: ישאל
  choice: procura
  rationale: Embora שׁאל normalmente signifique «pedir» ou «perguntar», neste contexto sem objeto explícito pode indicar procurar ou solicitar o produto esperado na colheita. «Procura» preserva a concisão e a abertura do hebraico.
- source_word: בַּקָּצִיר
  choice: na colheita
  rationale: Expressa de modo conciso e natural o momento em que a consequência da falta de trabalho se torna evidente.
- source_word: וָאָיִן
  choice: mas não há nada
  rationale: אָיִן é uma negação existencial. «Não há nada» mantém implícito o objeto, como no hebraico; «mas» explicita em português o contraste resultante sem alterar o sentido.
