  naturalness: A construção «ambos são abominação» soa incompleta em português, pois o predicativo nominal contável requer artigo neste uso. «Ambos são uma abominação para Yahweh» é natural, mantém o singular coletivo de תּוֹעֲבַת e preserva a concisão proverbial.
