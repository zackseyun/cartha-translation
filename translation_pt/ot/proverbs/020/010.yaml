  text: אֶ֣בֶן וָ֭/אֶבֶן אֵיפָ֣ה וְ/אֵיפָ֑ה תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/010.yaml
  text: A differing weight and a differing measure—both of them are an abomination to Yahweh[a].
translation:
  language: pt
  text: Pesos diferentes e medidas diferentes — ambos são uma abominação para Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “pedra e pedra, efa e efa”, isto é, pesos diferentes e medidas diferentes usados de modo desonesto no comércio.'
    reason: Explica as expressões comerciais idiomáticas e o sentido implícito da repetição.
lexical_decisions:
- source_word: אֶבֶן וָאֶבֶן
  choice: pesos diferentes
  rationale: A repetição literal, «pedra e pedra», refere-se a pesos de pedra não equivalentes usados em balanças comerciais. A tradução comunica o sentido idiomático com clareza.
- source_word: אֵיפָה וְאֵיפָה
  choice: medidas diferentes
  rationale: O efa era uma medida de secos; a repetição indica padrões não equivalentes. «Medidas diferentes» preserva o sentido comercial sem exigir que o leitor conheça a unidade antiga.
- source_word: תּוֹעֲבַת
  choice: abominação
  rationale: Mantém a intensidade da repulsa moral expressa pelo substantivo hebraico e seu uso bíblico consagrado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: גַּם שְׁנֵיהֶם
  choice: ambos
  rationale: 'Preserva a ênfase inclusiva: tanto os pesos quanto as medidas fraudulentas são condenados.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; «Yahweh» o representa diretamente e evita substituí-lo por um título.
- issue: Explicitação da desonestidade comercial
  choice: Mantê-la na nota, não acrescentá-la ao corpo do versículo
  alternative: pesos falsos e medidas falsas
  rationale: A fraude é claramente implicada pela duplicação de padrões no contexto comercial, mas não é nomeada de modo explícito nesta linha hebraica. A formulação escolhida preserva essa concisão e deixa a explicação para a nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo conciso do provérbio foi preservado; «pesos» e «medidas» tornam acessíveis os objetos comerciais antigos.
