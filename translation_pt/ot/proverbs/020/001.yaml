  text: לֵ֣ץ הַ֭/יַּין הֹמֶ֣ה שֵׁכָ֑ר וְ/כָל שֹׁ֥גֶה בּ֝֗/וֹ לֹ֣א יֶחְכָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/001.yaml
  text: Wine is a mocker[a], strong drink a brawler, and whoever is led astray by it is not wise.
translation:
  language: pt
  text: O vinho é zombador[a], a bebida forte, barulhenta; e quem se deixa desencaminhar por ela não é sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O vinho é escarnecedor; a bebida forte causa tumulto”. O hebraico personifica as bebidas intoxicantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵץ
  choice: zombador
  rationale: O substantivo designa quem zomba ou escarnece. Como predicativo de “vinho”, preserva a personificação vívida do hebraico.
- source_word: הַיַּיִן
  choice: o vinho
  rationale: Equivalente comum de יין; o artigo é natural em português nesta formulação proverbial.
- source_word: הֹמֶה
  choice: barulhenta
  rationale: O particípio de המה expressa ruído, tumulto ou agitação. “Barulhenta” conserva o sentido básico e evita restringi-lo à ideia mais específica de briga.
- source_word: שֵׁכָר
  choice: bebida forte
  rationale: Designa de modo amplo uma bebida intoxicante distinta do vinho. “Bebida forte” é tradicional, inteligível e não limita a referência a uma bebida moderna específica.
- source_word: שֹׁגֶה
  choice: se deixa desencaminhar
  rationale: O verbo indica desviar-se ou errar. A construção comunica a influência da bebida sem transformar explicitamente o verbo hebraico em mero cambalear físico.
- source_word: בּוֹ
  choice: por ela
  rationale: O sufixo singular remete naturalmente à bebida intoxicante mencionada; o feminino concorda com “bebida” em português.
- source_word: לֹא יֶחְכָּם
  choice: não é sábio
  rationale: O imperfeito tem força proverbial geral. Esta formulação é concisa e natural, sem impor sentido exclusivamente futuro.
