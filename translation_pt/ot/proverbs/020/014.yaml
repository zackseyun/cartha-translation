base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/014.yaml
  text: “Bad[a], bad,” says the buyer; but when he goes away, then he boasts.
translation:
  language: pt
  text: “Ruim, ruim”[a], diz o comprador; mas, depois que vai embora, ele se gaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não presta, não presta” ou “Sem valor, sem valor”. O hebraico repete “ruim” para dar ênfase, refletindo a tentativa do comprador de diminuir o valor da mercadoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע רַע
  choice: “Ruim, ruim”
  rationale: Preserva a repetição enfática e concisa do hebraico, reproduzindo a tentativa do comprador de depreciar a mercadoria durante a negociação.
- source_word: יֹאמַר
  choice: diz
  rationale: O imperfeito tem valor habitual ou geral neste provérbio; o presente é natural em português.
- source_word: הַקּוֹנֶה
  choice: o comprador
  rationale: No contexto comercial, é a forma mais direta e corrente de traduzir o particípio de קנה.
- source_word: וְאֹזֵל לוֹ
  choice: mas, depois que vai embora
  rationale: A formulação comunica a progressão temporal e torna explícito o contraste implícito entre depreciar o produto diante do vendedor e vangloriar-se após sair; לוֹ integra a expressão idiomática e não requer tradução independente.
- source_word: אָז
  choice: depois que
  rationale: A relação temporal marcada por אָז é expressa naturalmente em conjunto com a oração anterior, evitando uma sequência pouco fluida como “mas vai embora; então”.
- source_word: יִתְהַלָּל
  choice: ele se gaba
  rationale: O hitpael de הלל indica vanglória ou congratulação própria; “se gaba” é claro, atual e adequado ao tom moral do provérbio.
theological_decisions: []
