  text: מֵ/יהוָ֥ה מִצְעֲדֵי גָ֑בֶר וְ֝/אָדָ֗ם מַה יָּבִ֥ין דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/024.yaml
  text: A man's steps are from Yahweh[b][a]; how then can a man understand his way?
translation:
  language: pt
  text: Os passos de um homem[b] vêm de Yahweh[a]; como, então, pode o homem entender o seu caminho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit. “são de Yahweh”. A expressão indica origem ou fonte: os passos do homem vêm de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: “Um homem” e “o homem” traduzem dois termos hebraicos masculinos singulares empregados aqui de modo genérico, com referência ao ser humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/יהוָה
  choice: procedem de Yahweh
  rationale: A preposição מִן indica origem ou fonte. “Procedem de” comunica essa relação sem explicitar além do hebraico como Yahweh dirige o percurso. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: מִצְעֲדֵי
  choice: os passos
  rationale: O substantivo designa passos ou movimentos e, neste provérbio, funciona também como metáfora do curso da vida.
- source_word: גָבֶר
  choice: um homem
  rationale: גָבֶר designa um homem e aqui tem força representativa ou genérica. A tradução mantém o substantivo masculino do hebraico.
- source_word: וְאָדָם
  choice: então, o homem
  rationale: אָדָם refere-se genericamente ao ser humano. A conjunção וְ é expressa de modo idiomático por “então”, tornando clara a relação inferencial entre as duas orações.
- source_word: מַה יָּבִין
  choice: como ... pode entender
  rationale: Nesta construção interrogativa, מַה introduz uma pergunta retórica sobre a limitação humana; “como pode entender” é natural em português e preserva essa força.
- source_word: דַּרְכּוֹ
  choice: o seu próprio caminho
  rationale: דֶּרֶךְ significa “caminho” tanto em sentido literal como metafórico. “Próprio” esclarece que o sufixo se refere ao caminho do homem, sem alterar a ideia central.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Relação entre a ação divina e a compreensão humana
  choice: “procedem de Yahweh” como afirmação de origem, sem definir o mecanismo
  alternative: “são determinados por Yahweh” ou “são dirigidos por Yahweh”
  rationale: A preposição hebraica marca fonte ou origem, mas o versículo não especifica aqui o modo exato da ação divina. A formulação preserva a tensão entre a proveniência divina dos passos e a incapacidade humana de compreender plenamente o próprio caminho.
- issue: Masculinos genéricos גָבֶר e אָדָם
  choice: um homem ... o homem
  alternative: uma pessoa ... o ser humano
  rationale: Os dois termos estão no masculino singular e têm alcance representativo. A tradução mantém essa forma, enquanto a nota esclarece que a máxima se aplica genericamente aos seres humanos.
translation_notes:
  register: Português moderno, claro e solene, com construção natural tanto no Brasil como em outros contextos lusófonos. A repetição de “homem” conserva a forma representativa do hebraico; “como, então” explicita de maneira idiomática a conclusão retórica.
