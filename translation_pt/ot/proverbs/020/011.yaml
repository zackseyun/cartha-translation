  text: Even a youth makes himself known by his deeds[a], whether his work is pure and upright.
translation:
  language: pt
  text: Até o jovem se dá a conhecer por seus atos[a], quer sua obra seja pura, quer reta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até o jovem é reconhecido por seus atos, quer aquilo que faz seja puro, quer reto.”'
    reason: 'Alternativa lexical e sintática: יִתְנַכֶּר pode ser entendido de modo reflexivo («se dá a conhecer») ou com sentido próximo ao passivo («é reconhecido»). Os dois אִם finais podem ser expressos correlativamente: «quer... quer...».'
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Expressa naturalmente em português a força enfática e inclusiva: até mesmo uma pessoa jovem pode ser conhecida por sua conduta.'
- source_word: בְּמַעֲלָלָיו
  choice: por seus atos
  rationale: מַעֲלָל designa ações ou feitos, frequentemente com conotação moral; a preposição בְּ indica o meio pelo qual o jovem se torna conhecido.
- source_word: יִתְנַכֶּר
  choice: se dá a conhecer
  rationale: Preserva a nuance reflexiva do hitpael de נכר e comunica que o caráter se manifesta exteriormente nas ações. A leitura passiva também é possível e consta na nota.
- source_word: נָעַר
  choice: o jovem
  rationale: נַעַר abrange menino, rapaz ou pessoa jovem. “O jovem” mantém a generalização proverbial sem restringir demais a idade.
- source_word: אִם זַךְ וְאִם יָשָׁר
  choice: se ... é pura e correta
  rationale: Os dois אִם introduzem a avaliação da conduta. זַךְ denota pureza ou inocência, e יָשָׁר, retidão moral. “Correta” é clara e natural para leitores modernos.
- source_word: פָּעֳלוֹ
  choice: a sua conduta
  rationale: פֹּעַל pode significar obra, feito ou atividade. No contexto, resume aquilo que o jovem faz; “conduta” torna explícito o sentido moral e evita a repetição pouco natural de “atos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa conserva o paralelismo e a ambiguidade entre manifestação reflexiva e reconhecimento por terceiros; a alternativa é registrada em nota.
