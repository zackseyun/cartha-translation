  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/008.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: pt
  text: As palavras de quem espalha intrigas são como bocados saborosos[a]; elas descem às câmaras mais íntimas do ventre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como iguarias”; o raro termo hebraico também pode ser entendido como “como feridas” ou “como coisas engolidas com avidez”.
    reason: lexical_alternative
  - marker: b
    text: “As câmaras mais íntimas do ventre” é uma expressão hebraica para o íntimo da pessoa.
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: As palavras de
  rationale: O plural em estado construto significa literalmente “palavras de”; esta forma é natural em português e preserva a imagem verbal do provérbio.
- source_word: נִרְגָּן
  choice: quem faz intrigas
  rationale: O termo designa alguém que murmura ou espalha conversas de modo velado e desagregador. A expressão evita tanto o regionalismo de “fofoqueiro” quanto o sentido excessivamente específico de “caluniador”.
- source_word: כְּמִתְלַהֲמִים
  choice: como bocados saborosos
  rationale: O termo raro e discutido é tradicionalmente associado, também em Provérbios 26:22, a algo apetitoso e consumido com avidez. “Bocados saborosos” mantém a metáfora alimentar e deixa as alternativas lexicais para a nota.
- source_word: וְהֵם
  choice: elas
  rationale: O pronome retoma “as palavras”; em português, a retomada explícita deixa clara a transição para a segunda imagem.
- source_word: יָרְדוּ
  choice: descem
  rationale: Embora a forma hebraica seja perfeita, o contexto proverbial expressa uma verdade geral; o presente gnômico é o equivalente natural em português.
- source_word: חַדְרֵי בָטֶן
  choice: às câmaras mais íntimas do ventre
  rationale: A tradução conserva a metáfora hebraica de “câmaras do ventre” sem substituí-la interpretativamente por “coração” ou “ser interior”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem faz intrigas” comunica a fala velada e divisiva sem recorrer a um termo excessivamente coloquial ou regional. A metáfora corporal do hebraico foi mantida no texto e esclarecida em nota.
