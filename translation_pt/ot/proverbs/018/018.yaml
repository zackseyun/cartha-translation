  text: מִ֭דְיָנִים יַשְׁבִּ֣ית הַ/גּוֹרָ֑ל וּ/בֵ֖ין עֲצוּמִ֣ים יַפְרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/018.yaml
  text: The lot puts an end to disputes[a], and separates between the mighty.
translation:
  language: pt
  text: A sorte põe fim às disputas[a] e separa os poderosos uns dos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A sorte resolve as disputas e decide entre os poderosos.”'
    reason: Alternativa contextual que explicita a função arbitral da sorte, enquanto o texto principal preserva os verbos concretos do hebraico.
lexical_decisions:
- source_word: מִדְיָנִים
  choice: disputas
  rationale: O plural designa contendas ou conflitos, inclusive de caráter judicial; “disputas” é natural, atual e suficientemente amplo.
- source_word: יַשְׁבִּית
  choice: põe fim a
  rationale: O hifil de שבת tem aqui sentido causativo, “fazer cessar”; “põe fim a” preserva essa força sem interpretar antecipadamente como “resolve”.
- source_word: הַגּוֹרָל
  choice: a sorte
  rationale: גורל se refere à sorte lançada como meio de decisão. “A sorte” é a forma bíblica concisa e adequada ao estilo proverbial.
- source_word: וּבֵין
  choice: e ... [os envolvidos]
  rationale: בין marca as partes entre as quais ocorre a separação; em português, o objeto direto plural após “separa” expressa isso naturalmente, sem a construção pouco idiomática “separa entre”.
- source_word: עֲצוּמִים
  choice: os poderosos
  rationale: O adjetivo substantivado indica pessoas fortes ou poderosas, sem exigir a especificação de gênero presente em “homens poderosos”.
- source_word: יַפְרִיד
  choice: separa
  rationale: O hifil de פרד significa separar ou dividir. “Separa” conserva a imagem concreta do hebraico e deixa implícita, sem eliminá-la, sua função decisória no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com boa legibilidade brasileira. A formulação mantém o paralelismo conciso e preserva a tensão entre o sentido literal de cessar/separar e a implicação contextual de resolver/decidir.
