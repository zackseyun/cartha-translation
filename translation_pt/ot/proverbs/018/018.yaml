  source_fidelity: 'A primeira oração traduz com precisão o hifil de שבת: a sorte faz cessar as disputas. Na segunda, “separa os poderosos” comunica o verbo פרד, mas deixa menos explícita a relação entre as partes expressa por וּבֵין. “Separa os poderosos uns dos outros” preserva essa relação sem substituir a imagem de separação pela interpretação “decide”.'
  naturalness: O texto é claro, conciso e de registro proverbial natural em português moderno. A pequena ampliação “uns dos outros” torna a segunda oração mais idiomática e inequívoca, evitando a possível leitura de que os poderosos são separados de outras pessoas ou coisas.
  terminology: “Sorte”, “disputas” e “poderosos” são escolhas adequadas, contemporâneas e semanticamente amplas. A nota apresenta de modo apropriado a alternativa contextual “resolve/decide”, sem a impor ao texto principal.
