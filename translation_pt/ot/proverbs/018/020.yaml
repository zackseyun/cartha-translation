base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/020.yaml
  text: From the fruit of a man's mouth his stomach is satisfied[a]; he is satisfied by the produce of his lips.
translation:
  language: pt
  text: Do fruto da boca do homem, seu estômago se satisfaz[a]; da produção de seus lábios ele se satisfaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pelo fruto da boca do homem, seu estômago fica cheio; pelo rendimento de seus lábios, ele fica cheio.”'
    reason: 'Alternativa lexical: מִן pode indicar meio (“pelo”), שׂבע também pode ser traduzido por “ficar cheio”, e תְּבוּאָה por “rendimento”.'
lexical_decisions:
- source_word: מִפְּרִי
  choice: Do fruto de
  rationale: Preserva a metáfora frutífera e permite que מִן indique a fonte ou o meio pelo qual vem a satisfação.
- source_word: פִי
  choice: boca
  rationale: Mantém o sentido literal e a metonímia da fala, em paralelo com “lábios”.
- source_word: אִישׁ
  choice: do homem
  rationale: Reflete o masculino singular hebraico usado proverbialmente, sem eliminar sua possível função genérica.
- source_word: תִּשְׂבַּע
  choice: se satisfaz
  rationale: שׂבע significa ficar satisfeito ou saciado; o presente comunica naturalmente uma máxima proverbial.
- source_word: בִּטְנוֹ
  choice: seu estômago
  rationale: Conserva a imagem corporal de בֶּטֶן em linguagem portuguesa atual.
- source_word: תְּבוּאַת
  choice: da produção de
  rationale: Preserva a metáfora agrícola de produto, rendimento ou colheita e sua relação com “fruto”.
- source_word: שְׂפָתָיו
  choice: seus lábios
  rationale: Mantém a metonímia literal do hebraico e o paralelismo poético com “boca”.
- source_word: יִשְׂבָּע
  choice: ele se satisfaz
  rationale: Repete o mesmo verbo da primeira linha, preservando a ênfase e a estrutura hebraicas.
