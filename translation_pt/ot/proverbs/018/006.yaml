  text: A fool’s lips enter into strife[b][a], and his mouth calls for blows.
translation:
  language: pt
  text: Os lábios do insensato entram em contenda,[a] e sua boca pede pancadas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
