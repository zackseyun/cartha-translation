lexical_decisions:
- source_word: שִׂפְתֵי
  choice: os lábios
  rationale: Mantém a metonímia concreta do hebraico para a fala e o paralelismo poético com “boca”.
- source_word: כְסִיל
  choice: insensato
  rationale: Em Provérbios, designa alguém moral e comportamentalmente falto de sabedoria, não apenas uma pessoa de pouca inteligência.
- source_word: יָבֹאוּ בְרִיב
  choice: entram em contenda
  rationale: Reproduz de perto a construção hebraica e comunica que a fala do insensato se envolve em conflito.
- source_word: וּפִיו
  choice: e sua boca
  rationale: Preserva a imagem corporal e o paralelismo com “lábios” no primeiro segmento.
- source_word: לְמַהֲלֻמוֹת יִקְרָא
  choice: pede pancadas
  rationale: Expressa de modo natural e conciso que sua própria fala provoca ou convida agressões, sem especificar além do hebraico quem as recebe.
