base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
translation:
  language: pt
  text: O homem que tem muitos companheiros pode acabar arruinado[a], mas há amigo mais chegado do que um irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O homem que tem muitos companheiros deve mostrar-se amigável”. O verbo hebraico לְהִתְרֹעֵעַ é difícil e tem sido entendido de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: O homem
  rationale: Mantém o masculino singular do hebraico, empregado aqui em formulação proverbial representativa.
- source_word: רֵעִים
  choice: muitos companheiros
  rationale: “Companheiros” distingue o círculo numeroso de relações do “amigo” leal no segundo membro; “muitos” explicita o valor contextual da construção.
- source_word: לְהִתְרֹעֵעַ
  choice: pode acabar arruinado
  rationale: Adota a interpretação ligada a sofrer dano ou ruína, favorecida pelo contraste com o amigo fiel, sem apresentar o resultado como inevitável. A dificuldade lexical e a leitura alternativa são preservadas em nota.
- source_word: וְיֵשׁ
  choice: mas há
  rationale: Expressa naturalmente o contraste contextual entre numerosos companheiros e um amigo excepcionalmente leal.
- source_word: אֹהֵב
  choice: amigo
  rationale: O particípio substantivado designa, neste contexto sapiencial, alguém que ama e age como amigo.
- source_word: דָּבֵק
  choice: mais apegado
  rationale: Preserva a imagem de ligação firme e proximidade duradoura expressa por דבק, em português atual e natural.
- source_word: מֵאָח
  choice: que um irmão
  rationale: 'Representa o uso comparativo da preposição מִן: a ligação desse amigo supera até a proximidade fraterna.'
