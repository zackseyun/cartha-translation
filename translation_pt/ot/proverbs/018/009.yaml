  text: Even one who is slack in his work is brother to a master of destruction[a].
translation:
  language: pt
  text: Até quem é negligente em seu trabalho é irmão de um destruidor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é irmão de alguém dado à destruição”. A construção hebraica caracteriza a pessoa como alguém ligado à destruição; o termo final também pode ser entendido concretamente como “quem destrói”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Marca a comparação enfática e surpreendente: até a negligência no trabalho aproxima alguém de quem destrói.'
- source_word: מִתְרַפֶּה
  choice: quem é negligente
  rationale: O particípio hitpael de רפה descreve quem se deixa afrouxar ou age com desleixo; “é negligente” comunica essa falha voluntária sem sugerir mera incapacidade.
- source_word: בִמְלַאכְתּוֹ
  choice: em seu trabalho
  rationale: Expressão natural e abrangente para o âmbito em que a negligência se manifesta.
- source_word: אָח הוּא
  choice: é irmão de
  rationale: Mantém a metáfora concreta de parentesco, que indica afinidade de caráter ou de efeito.
- source_word: לְבַעַל מַשְׁחִית
  choice: de um mestre da destruição
  rationale: Preserva a construção hebraica marcada com בַּעַל, que caracteriza uma pessoa pela destruição, sem eliminar a possibilidade mais concreta de entender מַשְׁחִית como “quem destrói”.
