base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/022.yaml
  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
translation:
  language: pt
  text: Quem encontra uma esposa encontra o bem e alcança o favor de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “O homem que encontra uma esposa encontra algo bom e alcança o favor de Yahweh”. O hebraico usa uma forma masculina singular em sentido proverbial e representativo.'
    reason: Alternativa lexical e esclarecimento da forma gramatical.
lexical_decisions:
- source_word: מָצָא
  choice: encontra
  rationale: O perfeito qal tem força gnômica no provérbio; o presente expressa naturalmente uma verdade geral em português.
- source_word: אִשָּׁה
  choice: uma esposa
  rationale: Neste contexto sapiencial e matrimonial, o termo designa uma esposa, não apenas uma mulher em sentido genérico.
- source_word: טוֹב
  choice: o bem
  rationale: O adjetivo é usado substantivamente. “O bem” preserva a formulação concisa e abrangente do hebraico sem acrescentar “uma coisa”.
- source_word: וַיָּפֶק
  choice: alcança
  rationale: Aqui o verbo comunica obter ou conseguir. “Alcança” é natural em português e mantém o paralelismo com “encontra”.
- source_word: רָצוֹן
  choice: favor
  rationale: Em relação a Deus, o substantivo indica favor, boa vontade ou aceitação; “favor” é claro, corrente e teologicamente neutro.
- source_word: מֵיְהוָה
  choice: de Yahweh
  rationale: A preposição indica a fonte do favor, e o nome divino é transliterado como “Yahweh”.
- source_word: sujeito implícito de מָצָא
  choice: Quem
  rationale: O hebraico emprega uma forma masculina singular com sentido proverbial representativo. “Quem” reproduz naturalmente em português o sujeito genérico sem restringir a máxima.
theological_decisions:
- issue: Sujeito masculino genérico do provérbio
  choice: Quem encontra uma esposa
  alternative: O homem que encontra uma esposa
  rationale: Embora a forma hebraica seja masculina singular, o sujeito não é expresso lexicalmente. “Quem” conserva a generalidade proverbial e soa mais natural em português, enquanto “esposa” mantém explícito o cenário marital masculino pressuposto pela frase.
- issue: Nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva o nome próprio divino presente no texto hebraico, sem substituí-lo por um título.
- issue: Natureza do bem encontrado
  choice: encontra o bem
  alternative: encontra uma coisa boa
  rationale: O hebraico deixa טוֹב em formulação substantiva e concisa. “O bem” preserva essa amplitude sem definir além do texto se o bem é a própria esposa, o casamento ou a bênção associada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo conciso do provérbio e preserva a amplitude de טוֹב. O marcador [a] aparece no texto principal.
