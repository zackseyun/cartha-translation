  text: לֵ֣ב נָ֭בוֹן יִקְנֶה דָּ֑עַת וְ/אֹ֥זֶן חֲ֝כָמִ֗ים תְּבַקֶּשׁ דָּֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/015.yaml
  text: An understanding heart acquires knowledge[b][a], and the ear of the wise seeks knowledge.
translation:
  language: pt
  text: O coração que discerne adquire conhecimento, e o ouvido[a] dos sábios busca conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O singular “ouvido” é uma expressão coletiva e metafórica para a disposição dos sábios de escutar e aprender.
    reason: cultural_note
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Preserva a metáfora hebraica para a faculdade interior de pensar, discernir e decidir, e é natural na linguagem sapiencial em português.
- source_word: נָבוֹן
  choice: que discerne
  rationale: Expressa a percepção criteriosa atribuída ao coração e soa mais natural em português atual do que uma construção rígida como “coração entendido”.
- source_word: יִקְנֶה
  choice: adquire
  rationale: Comunica a obtenção intencional de conhecimento sem introduzir indevidamente a ideia comercial que “comprar” poderia sugerir.
- source_word: דָּעַת
  choice: conhecimento
  rationale: É a correspondência direta e corrente no contexto de Provérbios; a repetição nos dois membros preserva o paralelismo retórico hebraico.
- source_word: אֹזֶן
  choice: ouvido
  rationale: Mantém a imagem corporal hebraica da receptividade à instrução e forma um paralelo concreto com “coração”.
- source_word: חֲכָמִים
  choice: dos sábios
  rationale: O plural masculino funciona genericamente na literatura sapiencial; “os sábios” conserva a forma concisa sem restringir necessariamente a referência a homens.
- source_word: תְּבַקֶּשׁ
  choice: busca
  rationale: Traduz a procura ativa expressa pelo verbo e preserva o paralelismo com “adquire”.
