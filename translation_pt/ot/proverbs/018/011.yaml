  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ וּ/כְ/חוֹמָ֥ה נִ֝שְׂגָּבָ֗ה בְּ/מַשְׂכִּיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
translation:
  language: pt
  text: 'A riqueza do rico é a sua cidade fortificada,

    e, em sua imaginação,[a] é como uma muralha alta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua mente”, “em sua percepção” ou “em sua presunção”. O termo hebraico se refere a uma imagem mental ou maneira de enxergar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: riqueza
  rationale: Designa bens ou riqueza material; “riqueza” é natural, abrangente e adequado à afirmação proverbial.
- source_word: עָשִׁיר
  choice: do rico
  rationale: O adjetivo substantivado indica uma pessoa rica. “Do rico” preserva a forma masculina singular e soa idiomático em português.
- source_word: קִרְיַת עֻזּוֹ
  choice: a sua cidade fortificada
  rationale: A expressão é literalmente “cidade da sua força”. “Cidade fortificada” conserva a imagem urbana defensiva e comunica naturalmente a ideia de segurança.
- source_word: וּכְחוֹמָה נִשְׂגָּבָה
  choice: como uma muralha alta
  rationale: “Muralha” corresponde ao muro defensivo de uma cidade, e “alta” preserva o sentido básico de elevação, sem explicitar indevidamente a noção implícita de inacessibilidade.
- source_word: בְּמַשְׂכִּיתוֹ
  choice: em sua imaginação
  rationale: O substantivo pode indicar imagem, representação ou quadro mental. Neste contexto, descreve como o rico percebe a segurança proporcionada por sua riqueza, mantendo aberta a possível dimensão ilusória.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo e as imagens defensivas do hebraico foram preservados; a nota mantém a amplitude semântica do termo final.
