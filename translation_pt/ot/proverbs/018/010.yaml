  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
translation:
  language: pt
  text: O nome de Yahweh[a] é uma torre forte; o justo[b] corre para ela e fica seguro em lugar elevado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”; outra forma possível é “Javé”.
    reason: alternative_reading
  - marker: b
    text: O hebraico está no singular masculino e tem força representativa; isto é, refere-se à pessoa justa.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “fica protegido, fora de alcance”. O verbo hebraico sugere segurança em um lugar alto e inacessível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: torre forte
  rationale: A expressão hebraica significa literalmente “torre de força”. “Torre forte” preserva a metáfora defensiva em português natural.
- source_word: שֵׁם
  choice: nome
  rationale: Mantém o termo explícito do hebraico e sua riqueza sem reduzi-lo a “reputação” ou interpretá-lo além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בּוֹ
  choice: para ela
  rationale: O sufixo masculino singular retoma mais naturalmente a torre metafórica. Como “torre” é feminino em português, a concordância natural é “ela”; a construção com “correr para” comunica movimento em busca de refúgio.
- source_word: יָרוּץ
  choice: corre
  rationale: Traduz diretamente o verbo “correr”, deixando que o contexto defensivo comunique a ideia de buscar refúgio.
- source_word: צַדִּיק
  choice: o justo
  rationale: Reproduz o adjetivo substantivado no singular e conserva o estilo proverbial. Em português, “o justo” pode ter força representativa sem acrescentar “homem” ao texto.
- source_word: נִשְׂגָּב
  choice: fica seguro em lugar elevado
  rationale: O nifal de שׂגב combina elevação, inacessibilidade e segurança. A formulação preserva tanto a imagem vertical quanto seu efeito protetor.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o tetragrama. A transliteração preserva o nome próprio, enquanto a nota informa a tradição de substituí-lo pelo título “SENHOR”.
- issue: Força representativa de צַדִּיק
  choice: o justo
  alternative: a pessoa justa
  rationale: “O justo” mantém o singular substantivado e a forma proverbial sem inserir o substantivo “homem”; a referência pode representar qualquer pessoa justa.
- issue: Amplitude semântica de נִשְׂגָּב
  choice: fica seguro em lugar elevado
  alternative: fica protegido, fora de alcance
  rationale: A escolha conserva simultaneamente a elevação da torre e a segurança decorrente da inacessibilidade, sem reduzir o verbo apenas a “estar seguro”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A estrutura paralela e a metáfora concisa do provérbio foram preservadas.
