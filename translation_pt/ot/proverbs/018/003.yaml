  yaml_path: translation/ot/proverbs/018/003.yaml
  text: When wickedness comes[a], contempt also comes, and with dishonor comes reproach.
translation:
  language: pt
  text: Quando chega o perverso, chega também o desprezo; e, com a desonra, vem a afronta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא
  choice: Quando chega
  rationale: A preposição בְּ com o infinitivo construto de בוא introduz uma circunstância temporal. “Quando chega” é natural em português e conserva a repetição da raiz com o verbo seguinte.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O termo funciona primariamente como adjetivo substantivado masculino singular, designando de modo proverbial uma pessoa caracterizada pela maldade. “O perverso” preserva essa forma concisa sem acrescentar “homem”, ausente do hebraico.
- source_word: בָּא
  choice: chega
  rationale: O verbo repete a raiz בוא do início do verso. A repetição de “chega” mantém a ênfase e o paralelismo do hebraico.
- source_word: גַם
  choice: também
  rationale: Expressa a ideia aditiva de que o desprezo acompanha a chegada do perverso.
- source_word: בּוּז
  choice: desprezo
  rationale: O substantivo denota desprezo ou escárnio. “Desprezo” conserva seu caráter abstrato e se encaixa naturalmente no paralelismo.
- source_word: וְעִם
  choice: e, com
  rationale: Preserva tanto a conjunção quanto a ideia de acompanhamento introduzida pela preposição.
- source_word: קָלוֹן
  choice: desonra
  rationale: O termo designa vergonha ou desonra, muitas vezes de caráter público. “Desonra” o distingue do substantivo final.
- source_word: חֶרְפָּה
  choice: afronta
  rationale: Pode indicar opróbrio, insulto ou vergonha lançada sobre alguém. “Afronta” transmite sua dimensão relacional e pública sem confundi-lo com קָלוֹן.
theological_decisions: []
translation_notes:
  register: Português moderno, conciso e proverbial, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. O ponto e vírgula explicita os dois membros do paralelismo sem alterar sua relação. A variação “vem” no último membro evita uma formulação portuguesa rígida; o hebraico não traz ali um segundo verbo expresso.
