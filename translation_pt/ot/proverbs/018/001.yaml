  text: לְֽ֭/תַאֲוָה יְבַקֵּ֣שׁ נִפְרָ֑ד בְּ/כָל תּ֝וּשִׁיָּ֗ה יִתְגַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/001.yaml
  text: Whoever isolates himself seeks his own desire[b][a]; he breaks out against all sound judgment.
translation:
  language: pt
  text: Quem se isola busca o próprio desejo[a]; insurge-se contra todo bom senso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem se separa busca o desejo”. O hebraico é conciso e não traz um pronome correspondente a “próprio”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “contra toda sabedoria sólida, ele briga”. O hebraico da segunda linha é difícil, sobretudo por causa do verbo raro traduzido por “insurge-se”. “Bom senso” também pode ser traduzido por “sabedoria sólida” ou “discernimento”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְתַאֲוָה
  choice: o próprio desejo
  rationale: תַּאֲוָה denota desejo, anseio ou cobiça; com לְ, indica aqui o propósito ou motivo. “O próprio desejo” explicita com naturalidade a orientação egoísta sugerida pelo contexto, sem transformar o termo em “desejo egoísta” no texto principal.
- source_word: יְבַקֵּשׁ
  choice: busca
  rationale: O piel de בקש significa regularmente “buscar” ou “procurar”. “Busca” é direto e mantém a formulação concisa do provérbio.
- source_word: נִפְרָד
  choice: quem se isola
  rationale: O particípio nifal de פרד descreve alguém separado ou que se separa. “Quem se isola” comunica a força genérica e proverbial e, no contexto, a separação voluntária da convivência e do conselho.
- source_word: בְּכָל
  choice: contra todo
  rationale: A função da preposição בְ nesta linha poética é incerta. Em ligação com o verbo raro e com o sentido adversativo provável, “contra todo” oferece uma construção portuguesa clara sem ocultar a dificuldade, registrada em nota.
- source_word: תּוּשִׁיָּה
  choice: bom senso
  rationale: Em Provérbios, תּוּשִׁיָּה pode indicar sabedoria sólida, discernimento prático ou capacidade de julgar bem. “Bom senso” é natural, acessível e adequado ao contexto social do dito.
- source_word: יִתְגַּלָּע
  choice: insurge-se
  rationale: Este raro hitpael é de sentido discutido e pode sugerir irromper hostilmente, contender ou mostrar-se em oposição. “Insurge-se” preserva a ideia vívida de oposição ativa sem impor a imagem específica e incerta de “mostrar os dentes”.
