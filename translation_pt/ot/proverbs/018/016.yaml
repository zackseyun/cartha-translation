  text: A man's gift makes room for him[b][a], and brings him before great men.
translation:
  language: pt
  text: O presente de uma pessoa abre-lhe caminho e a leva à presença dos poderosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O presente de alguém lhe abre espaço e o conduz à presença de pessoas importantes.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: presente
  rationale: O substantivo designa algo dado, um presente ou dádiva. “Presente” expressa naturalmente, neste contexto proverbial, algo oferecido para proporcionar acesso.
- source_word: אָדָם
  choice: de uma pessoa
  rationale: O singular é genérico e individual. “Uma pessoa” conserva esse sentido em português atual sem restringir desnecessariamente o provérbio ao sexo masculino.
- source_word: יַרְחִיב לוֹ
  choice: abre-lhe caminho
  rationale: O hifil de רחב significa literalmente “alargar”. A expressão portuguesa preserva a imagem de criar espaço e comunica de modo natural a ideia contextual de facilitar acesso ou oportunidade.
- source_word: וְלִפְנֵי גְדֹלִים
  choice: à presença dos poderosos
  rationale: לִפְנֵי indica estar diante de alguém ou em sua presença; גְדֹלִים se refere aqui a pessoas de posição, influência ou poder. “Poderosos” é corrente e mantém a referência pessoal plural.
- source_word: יַנְחֶנּוּ
  choice: a leva
  rationale: O hifil de נחה significa “conduzir, guiar”. “Leva” comunica naturalmente o resultado de conduzir a pessoa até a presença de figuras poderosas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o paralelismo e a metáfora de acesso do hebraico, usando linguagem inclusiva natural para o אָדָם genérico. O pronome “a” retoma “uma pessoa”.
