  text: פִּֽי כְ֭סִיל מְחִתָּה ל֑/וֹ וּ֝/שְׂפָתָ֗י/ו מוֹקֵ֥שׁ נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
translation:
  language: pt
  text: A boca do insensato é a sua ruína,[a] e os seus lábios são uma armadilha para a sua vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A boca do insensato traz destruição para ele.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sua alma”; aqui, provavelmente, no sentido de “sua vida” ou “ele próprio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: boca
  rationale: Preserva a imagem concreta hebraica da boca como fonte da fala e soa natural no paralelismo proverbial.
- source_word: כְסִיל
  choice: insensato
  rationale: Expressa o termo sapiencial como uma falha moral e prática, e não apenas como falta de inteligência.
- source_word: מְחִתָּה
  choice: ruína
  rationale: No contexto, indica a destruição que a fala do insensato traz sobre ele; “ruína” é natural e mantém o paralelismo com “armadilha”.
- source_word: לוֹ
  choice: sua
  rationale: A construção hebraica literalmente significa “para ele”; em português, a relação é expressa de modo idiomático por “a sua ruína”.
- source_word: וּשְׂפָתָיו
  choice: e os seus lábios
  rationale: Mantém a imagem corporal concreta e o paralelismo com “boca”.
- source_word: מוֹקֵשׁ
  choice: uma armadilha
  rationale: Transmite com clareza a metáfora de algo que captura e põe em perigo o próprio insensato.
- source_word: נַפְשׁוֹ
  choice: sua vida
  rationale: Aqui נֶפֶשׁ provavelmente designa a vida ou a própria pessoa, não especificamente uma alma imaterial.
theological_decisions: []
