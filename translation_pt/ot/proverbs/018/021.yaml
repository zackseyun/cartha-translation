  text: מָ֣וֶת וְ֭/חַיִּים בְּ/יַד לָשׁ֑וֹן וְ֝/אֹהֲבֶ֗י/הָ יֹאכַ֥ל פִּרְיָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/021.yaml
  text: Death and life are in the power of the tongue[b][a], and those who love it will eat its fruit.
translation:
  language: pt
  text: A morte e a vida estão no poder da língua[a], e os que a amam[b] comerão do fruto dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «A morte e a vida estão na mão da língua».'
    reason: lexical_alternative
  - marker: b
    text: «Os que a amam» provavelmente se refere aos que gostam de usar a língua; eles experimentarão as consequências de suas palavras, seja para a morte, seja para a vida.
    reason: cultural_note
lexical_decisions:
- source_word: מָוֶת
  choice: a morte
  rationale: Mantém o substantivo abstrato hebraico e seu contraste direto com «a vida», sem sugerir personificação.
- source_word: חַיִּים
  choice: a vida
  rationale: Embora a forma hebraica seja morfologicamente plural, ela funciona aqui como o conceito singular e abstrato de vida.
- source_word: בְּיַד
  choice: estão no poder de
  rationale: Traduz de modo natural a expressão idiomática «na mão de», que indica poder ou domínio, enquanto a nota preserva a imagem literal.
- source_word: לָשׁוֹן
  choice: a língua
  rationale: Conserva a imagem concreta do órgão da fala usada no hebraico, em vez de reduzi-la ao termo abstrato «fala».
- source_word: אֹהֲבֶיהָ
  choice: os que a amam
  rationale: 'O pronome remete naturalmente à língua e a formulação preserva a possível amplitude de sentido: gostar de falar, usar muito a língua ou apreciar seu poder.'
- source_word: יֹאכַל
  choice: comerão
  rationale: O futuro expressa naturalmente a consequência proverbial; o singular hebraico ocorre com uma expressão coletiva plural, para a qual o plural é idiomático em português.
- source_word: פִּרְיָהּ
  choice: seu fruto
  rationale: Preserva a metáfora agrícola dos resultados ou consequências produzidos pelo uso da língua.
theological_decisions:
- issue: Referente e alcance de אֹהֲבֶיהָ («os que a amam»)
  choice: Preservar no texto a referência pronominal à língua e explicar sua provável força na nota.
  alternative: Traduzir interpretativamente como «os que gostam de falar» ou «os que fazem uso dela».
  rationale: O hebraico aponta para «língua», mas não especifica de modo inequívoco se o amor é pela fala, pelo uso frequente da língua ou por seu poder; uma tradução mais explícita resolveria indevidamente essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo conciso e as metáforas hebraicas da língua, da mão e do fruto foram preservados; a expressão idiomática «na mão de» foi vertida no texto como «no poder de» e mantida literalmente em nota.
