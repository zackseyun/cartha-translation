  text: The first to present his case seems right[a], until his neighbor comes and examines him.
translation:
  language: pt
  text: O primeiro a apresentar sua causa parece ter razão[a], até que venha o outro e o examine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O primeiro, em sua disputa, parece justo, até que venha o outro e o examine.”'
    reason: Alternativa lexical que preserva mais literalmente צַדִּיק e בְּרִיבוֹ, bem como o sentido amplo de חקר.
lexical_decisions:
- source_word: צַדִּיק
  choice: parece ter razão
  rationale: Embora o adjetivo signifique normalmente “justo”, no contexto de uma controvérsia indica que a primeira parte parece estar com a razão antes de ser submetida ao exame da outra.
- source_word: הָרִאשׁוֹן
  choice: O primeiro
  rationale: Designa a primeira parte a falar ou comparecer na controvérsia e preserva de modo conciso o contraste com a chegada da outra parte.
- source_word: בְּרִיבוֹ
  choice: a apresentar sua causa
  rationale: רִיב pode indicar disputa, controvérsia ou causa judicial. A formulação comunica naturalmente o contexto forense sem restringi-lo a um processo formal.
- source_word: יבא
  choice: a apresentar
  rationale: O verbo significa literalmente “vem”, mas integra a ideia de a primeira parte vir à frente para expor sua causa; em português, isso é expresso naturalmente na locução.
- source_word: רֵעֵהוּ
  choice: o outro
  rationale: רֵעַ pode significar próximo, companheiro ou a outra pessoa envolvida. Neste contexto adversarial, “o outro” identifica com clareza a parte contrária sem sugerir amizade ou mera proximidade residencial.
- source_word: וַחֲקָרוֹ
  choice: o interrogue
  rationale: חקר significa examinar, investigar ou averiguar. “Interrogue” conserva o cenário de contestação e o exame crítico das alegações, sem recorrer ao tecnicismo mais estreito “contrainterrogue”.
