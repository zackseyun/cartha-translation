  text: לֹֽא יַחְפֹּ֣ץ כְּ֭סִיל בִּ/תְבוּנָ֑ה כִּ֝֗י אִֽם בְּ/הִתְגַּלּ֥וֹת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/002.yaml
  text: A fool does not delight in understanding[a], but only in revealing his heart.
translation:
  language: pt
  text: O insensato não tem prazer no entendimento, mas apenas em revelar o que há em seu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em expor seu coração”. Aqui, “coração” se refere aos pensamentos, às intenções e às inclinações interiores, não apenas às emoções.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: não tem prazer
  rationale: Preserva o sentido volitivo de חפץ — ter prazer, deleitar-se ou desejar — em linguagem portuguesa natural.
- source_word: כְּסִיל
  choice: insensato
  rationale: Em Provérbios, designa alguém moral e intelectualmente obstinado, não apenas uma pessoa de pouca inteligência. “Insensato” comunica bem esse sentido sapiencial.
- source_word: תְבוּנָה
  choice: entendimento
  rationale: Representa diretamente a ideia de compreensão e discernimento própria da literatura sapiencial.
- source_word: כִּי אִם
  choice: mas apenas
  rationale: Expressa tanto o contraste quanto a força exclusiva da construção hebraica.
- source_word: בְּהִתְגַּלּוֹת
  choice: em revelar
  rationale: O infinitivo da raiz גלה indica descobrir, expor ou tornar conhecido; “revelar” mantém essa imagem de trazer à mostra.
- source_word: לִבּוֹ
  choice: o que há em seu coração
  rationale: Torna natural em português a expressão hebraica “revelar seu coração”, preservando “coração” como referência ao interior da pessoa — pensamentos, intenções e inclinações.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação sapiencial concisa. “Insensato” evita reduzir כְּסִיל a deficiência intelectual, e “o que há em seu coração” comunica naturalmente a antropologia hebraica sem limitar o termo às emoções.
