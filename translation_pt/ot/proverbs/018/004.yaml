  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
translation:
  language: pt
  text: As palavras da boca de um homem são águas profundas;[a] a fonte da sabedoria é um ribeiro que flui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As palavras da boca de um homem são águas profundas, um ribeiro que flui, uma fonte de sabedoria.” O hebraico permite entender que as duas imagens de água descrevem as próprias palavras, em vez de tomar a segunda linha como uma declaração separada sobre a sabedoria.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: águas profundas
  rationale: Preserva a imagem concreta e a forma plural idiomática do hebraico, sem explicitar em excesso o possível sentido figurado de profundidade.
- source_word: דִּבְרֵי
  choice: as palavras
  rationale: É a tradução direta e flexível do plural construto, adequada ao paralelismo poético.
- source_word: פִי אִישׁ
  choice: da boca de um homem
  rationale: Reproduz naturalmente a construção hebraica e mantém o substantivo masculino singular אִישׁ, empregado no estilo proverbial para um indivíduo.
- source_word: נַחַל
  choice: ribeiro
  rationale: Expressa um curso de água em movimento e combina de modo natural com a imagem de uma fonte, sem impor especificamente a ideia de um leito sazonal seco.
- source_word: נֹבֵעַ
  choice: que flui
  rationale: Comunica a ação contínua de brotar ou correr, de maneira corrente e sem exagerar a intensidade.
- source_word: מְקוֹר חָכְמָה
  choice: a fonte da sabedoria
  rationale: Mantém a metáfora hídrica de מְקוֹר e a relação construta com 'sabedoria'; o artigo é natural em português numa afirmação proverbial.
