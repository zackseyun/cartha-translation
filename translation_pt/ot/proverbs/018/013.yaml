  text: He who answers a matter before he hears it[a], it is folly and shame to him.
translation:
  language: pt
  text: Quem responde a uma questão antes de ouvi-la[a] comete insensatez e passa vergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem responde a uma palavra, a um assunto ou a um caso antes de ouvir o que foi dito”. O hebraico דָּבָר pode significar “palavra”, “questão”, “assunto” ou “caso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: responde
  rationale: O particípio hifil de שוב tem aqui o sentido idiomático de responder; o presente generalizante é natural em um provérbio.
- source_word: דָּבָר
  choice: uma questão
  rationale: דָּבָר é amplo e pode indicar palavra, assunto ou caso. “Questão” funciona naturalmente como aquilo que deve ser ouvido antes de receber resposta, sem limitar o dito a uma única palavra.
- source_word: בְּטֶרֶם
  choice: antes de
  rationale: Expressa de modo claro e corrente a relação temporal do hebraico.
- source_word: יִשְׁמָע
  choice: ouvi-la
  rationale: שמע pode significar ouvir ou escutar. O pronome retoma naturalmente “questão” em português, embora o hebraico deixe o objeto implícito.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Termo corrente e digno que preserva a dimensão intelectual e moral do vocabulário sapiencial.
- source_word: הִיא לוֹ
  choice: comete
  rationale: A formulação idiomática portuguesa comunica que o ato descrito constitui insensatez para a pessoa, evitando um calque pouco natural como “isso é insensatez para ele”.
- source_word: וּכְלִמָּה
  choice: e passa vergonha
  rationale: כלמה denota vergonha ou desonra. A locução corrente “passa vergonha” expressa a consequência pessoal indicada por לוֹ e forma paralelismo natural com “comete insensatez”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com ampla legibilidade brasileira. A construção inclusiva “Quem responde” reproduz o valor generalizante do particípio hebraico sem inserir marca de gênero ausente da aplicação do provérbio. A redação favorece naturalidade sem eliminar a amplitude lexical de דָּבָר, registrada na nota.
