source:
  edition: WLC
  text: לִ/פְנֵי שֶׁ֭בֶר יִגְבַּ֣הּ לֵב אִ֑ישׁ וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/012.yaml
  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
translation:
  language: pt
  text: Antes da ruína, o coração do homem se torna arrogante[a]; antes da honra vem a humildade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o coração da pessoa”. O hebraico diz literalmente “o coração do homem”, empregando o masculino singular em sentido proverbial genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: antes de / antes da
  rationale: A preposição tem valor temporal e indica o que precede um acontecimento. A repetição de “antes” preserva o paralelismo dos dois membros.
- source_word: שֶׁבֶר
  choice: ruína
  rationale: No contexto sapiencial, o substantivo indica colapso ou desastre, não uma quebra literal. “Ruína” comunica isso de modo natural e conciso.
- source_word: יִגְבַּהּ
  choice: se torna arrogante
  rationale: O verbo significa literalmente “ser alto”, mas, ligado a “coração”, descreve orgulho ou arrogância. “Se torna arrogante” também preserva a forma verbal e a progressão que antecede a ruína.
- source_word: לֵב אִישׁ
  choice: o coração do homem
  rationale: Mantém o substantivo masculino singular do hebraico e seu uso proverbial genérico, em formulação portuguesa natural e tradicionalmente inteligível.
- source_word: כָבוֹד
  choice: honra
  rationale: Aqui designa reconhecimento ou posição honrosa, e não especificamente glória divina.
- source_word: עֲנָוָה
  choice: humildade
  rationale: Expressa a disposição humilde que antecede e contrasta com a honra, em paralelo antitético com o coração arrogante.
theological_decisions:
- issue: Masculino genérico אִישׁ na declaração proverbial
  choice: o coração do homem
  alternative: o coração da pessoa / o coração humano
  rationale: A redação preserva a forma masculina singular e representativa do hebraico sem restringir a aplicação do provérbio somente aos homens; uma nota explicita seu sentido genérico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura paralela “Antes...; antes...” foi preservada. “Ruína” é mais idiomático que “destruição” neste aforismo, e “se torna arrogante” comunica o valor figurado do coração que se eleva.
