  text: תַּחֲנוּנִ֥ים יְדַבֶּר רָ֑שׁ וְ֝/עָשִׁ֗יר יַעֲנֶ֥ה עַזּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/023.yaml
  text: The poor man speaks with pleas[a], but the rich man answers harshly.
translation:
  language: pt
  text: O pobre fala com súplicas[a], mas o rico responde com dureza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O pobre fala com pedidos insistentes, mas o rico responde com palavras duras.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחֲנוּנִים
  choice: com súplicas
  rationale: O substantivo plural indica pedidos insistentes por favor ou misericórdia. “Com súplicas” preserva tanto o conteúdo quanto o modo humilde de falar e é claro em português atual.
- source_word: יְדַבֶּר
  choice: fala
  rationale: O piel de דבר tem aqui o sentido comum de “falar”. O presente se ajusta ao caráter geral e proverbial da afirmação.
- source_word: רָשׁ
  choice: o pobre
  rationale: O termo substantivado designa uma pessoa pobre. “O pobre” conserva o singular representativo do hebraico sem acrescentar “homem”, ausente do texto.
- source_word: וְעָשִׁיר
  choice: mas o rico
  rationale: Embora וְ seja formalmente “e”, o paralelismo contrapõe pobre e rico; “mas” expressa naturalmente esse valor adversativo.
- source_word: יַעֲנֶה
  choice: responde
  rationale: O qal de ענה significa “responder”. A escolha reproduz diretamente a ação da segunda linha.
- source_word: עַזּוֹת
  choice: com dureza
  rationale: A forma plural feminina funciona adverbialmente e denota uma resposta dura, severa ou áspera. “Com dureza” preserva a construção nominal do hebraico e evita interpretar o termo como coragem elogiável.
theological_decisions: []
