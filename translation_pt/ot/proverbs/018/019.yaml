  text: אָ֗ח נִפְשָׁ֥ע מִ/קִּרְיַת עֹ֑ז ו/מדונים כִּ/בְרִ֥יחַ אַרְמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
translation:
  language: pt
  text: Um irmão ofendido é mais difícil de conquistar do que uma cidade fortificada,[a] e as brigas são como a tranca de uma cidadela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um irmão injustiçado é mais difícil de conquistar do que uma cidade fortificada”. O termo hebraico pode descrever alguém ofendido ou alguém contra quem se cometeu uma injustiça.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e as disputas são como a tranca de um palácio”. A palavra hebraica final pode indicar tanto uma residência fortificada como um palácio; o contexto defensivo favorece “cidadela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: irmão
  rationale: Mantém a imagem concreta do hebraico, que pode indicar um irmão literal ou alguém de vínculo próximo.
- source_word: נִפְשָׁע
  choice: ofendido
  rationale: O particípio de פשע, neste contexto relacional, descreve de modo plausível alguém ofendido ou contra quem se cometeu uma transgressão; “ofendido” é natural e preserva a ambiguidade mediante nota.
- source_word: מִקִּרְיַת עֹז
  choice: mais difícil de conquistar do que uma cidade fortificada
  rationale: O מִן tem valor comparativo, e “cidade fortificada” comunica naturalmente a imagem de força e inacessibilidade. “De conquistar” explicita a elipse exigida pelo sentido proverbial.
- source_word: וּמְדֹנִים
  choice: e as brigas
  rationale: O plural designa contendas ou disputas; “brigas” é claro, atual e adequado ao registro proverbial.
- source_word: כִּבְרִיחַ
  choice: são como a tranca de
  rationale: בְּרִיחַ é a barra ou tranca que fecha e protege uma porta ou portão; o singular português acompanha a forma hebraica.
- source_word: אַרְמוֹן
  choice: uma cidadela
  rationale: O termo pode denotar palácio ou residência fortificada. A imagem defensiva do contexto favorece “cidadela”.
