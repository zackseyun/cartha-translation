source:
  edition: WLC
  text: שְׂאֵ֣ת פְּנֵי רָשָׁ֣ע לֹא ט֑וֹב לְ/הַטּ֥וֹת צַ֝דִּ֗יק בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/005.yaml
  text: To show partiality to the wicked is not good[b][a], nor to deprive the righteous of justice.
translation:
  language: pt
  text: Não é bom favorecer o perverso[a], nem negar justiça ao justo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “levantar o rosto do perverso”, expressão idiomática que significa tratá-lo com favoritismo ou parcialidade.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “desviar o justo no julgamento”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאֵת פְּנֵי
  choice: favorecer
  rationale: A expressão idiomática significa literalmente “levantar o rosto” e, neste contexto judicial, indica tratar alguém com favoritismo ou parcialidade.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado designa uma pessoa moralmente má; “o perverso” preserva essa categoria sem limitar o sentido a “culpado” em termos estritamente jurídicos.
- source_word: לֹא טוֹב
  choice: não é bom
  rationale: Tradução direta que conserva a avaliação simples e enfática do hebraico.
- source_word: לְהַטּוֹת
  choice: negar justiça
  rationale: O verbo significa “inclinar” ou “desviar”; no contexto judicial, a formulação comunica naturalmente o efeito de decidir contra alguém e privá-lo da justiça, enquanto a nota preserva a imagem verbal.
- source_word: צַדִּיק
  choice: o justo
  rationale: O termo pode indicar tanto a pessoa moralmente justa quanto aquela que tem razão ou é inocente numa causa. “O justo” mantém essa amplitude moral e jurídica.
- source_word: בַּמִּשְׁפָּט
  choice: justiça
  rationale: מִשְׁפָּט possui aqui sentido judicial. Na expressão portuguesa “negar justiça”, o contexto legal fica claro sem acrescentar explicitamente “no tribunal”, elemento não expresso no hebraico.
theological_decisions:
- issue: Amplitude de צַדִּיק entre justiça moral e inocência jurídica
  choice: o justo
  alternative: o inocente
  rationale: “O justo” preserva a tensão entre caráter moral e condição de quem está com a razão numa causa, sem reduzir o termo à inocência forense.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A coordenação “não é bom... nem...” reproduz a censura moral do provérbio; as notas conservam a expressão idiomática e a formulação judicial mais literal.
