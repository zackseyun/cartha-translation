  text: רֽוּחַ אִ֭ישׁ יְכַלְכֵּ֣ל מַחֲלֵ֑/הוּ וְ/ר֥וּחַ נְ֝כֵאָ֗ה מִ֣י יִשָּׂאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/014.yaml
  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
translation:
  language: pt
  text: O espírito de uma pessoa a sustenta na doença, mas um espírito esmagado, quem o suportará?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito abatido” ou “um espírito quebrantado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: espírito
  rationale: No paralelismo, refere-se à disposição ou força interior da pessoa, não ao vento ou à respiração.
- source_word: אִישׁ
  choice: uma pessoa
  rationale: Embora o hebraico use o substantivo masculino singular, aqui ele tem sentido humano representativo próprio do provérbio; “uma pessoa” comunica esse alcance naturalmente em português.
- source_word: יְכַלְכֵּל
  choice: pode sustentá-la
  rationale: O verbo כלכל expressa sustentar ou manter. A formulação preserva a ideia de que a força interior ampara a pessoa durante a enfermidade.
- source_word: מַחֲלֵהוּ
  choice: na doença
  rationale: O substantivo com sufixo masculino significa literalmente “sua doença”; em português, “sustentá-la na doença” exprime de modo idiomático a relação.
- source_word: נְכֵאָה
  choice: abatido
  rationale: O adjetivo pode indicar algo ferido, quebrantado ou esmagado. “Abatido” é natural, digno e adequado para a condição interior descrita.
- source_word: מִי יִשָּׂאֶנָּה
  choice: quem pode suportar
  rationale: A pergunta retórica usa נשא no sentido de carregar ou aguentar; “suportar” transmite a incapacidade de resistir a essa condição interior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. O masculino singular representativo do hebraico foi vertido por “uma pessoa”, sem restringir o alcance do provérbio. A repetição de “espírito” preserva o contraste central do original.
