  text: שֵׂ֣כֶל אָ֭דָם הֶאֱרִ֣יךְ אַפּ֑/וֹ וְ֝/תִפאַרְתּ֗/וֹ עֲבֹ֣ר עַל פָּֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/011.yaml
  text: A man's insight makes him slow to anger[b][a], and it is his glory to overlook an offense.
translation:
  language: pt
  text: A prudência torna a pessoa lenta para se irar, e deixar passar uma ofensa é sua honra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׂכֶל
  choice: prudência
  rationale: O termo indica discernimento prático ou bom senso. “Prudência” expressa naturalmente a sabedoria que leva ao domínio da ira.
- source_word: אָדָם
  choice: a pessoa
  rationale: Aqui o substantivo se refere genericamente a um ser humano individual; “a pessoa” comunica esse sentido de modo natural e abrangente em português.
- source_word: הֶאֱרִיךְ אַפּוֹ
  choice: torna a pessoa paciente
  rationale: A expressão hebraica literalmente fala em “prolongar o nariz”, idioma que indica demorar a irar-se. “Torna a pessoa paciente” transmite o efeito da prudência sem reproduzir uma imagem opaca em português.
- source_word: וְתִפאַרְתּוֹ
  choice: é motivo de honra
  rationale: תִפְאֶרֶת pode significar beleza, esplendor, glória ou honra. Neste contexto ético, a expressão indica aquilo que honra ou enobrece alguém.
- source_word: עֲבֹר עַל
  choice: deixar passar
  rationale: A construção significa passar por cima, não levar adiante ou não reagir à falta. “Deixar passar” preserva a metáfora e evita tornar o sentido mais forte por meio de “perdoar”.
- source_word: פָּשַׁע
  choice: uma ofensa
  rationale: Embora o termo possa denotar transgressão ou rebelião, no contexto interpessoal do provérbio “ofensa” é claro e mantém a seriedade do erro sem assumir um tom técnico.
