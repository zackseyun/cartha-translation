- from: Pare[a], meu filho, de ouvir a instrução que o desvia das palavras do conhecimento.
  to: Meu filho, deixe de ouvir instrução para se desviar das palavras do conhecimento.[a]
  rationale: A revisão elimina a oração relativa causal acrescentada pela versão anterior e conserva a justaposição dos infinitivos hebraicos. A formulação principal reproduz a tensão deliberadamente abrupta do provérbio; a nota explicita, sem decidir dogmaticamente, as principais relações sintáticas propostas.
