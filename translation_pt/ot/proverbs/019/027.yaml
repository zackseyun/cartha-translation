  text: חַֽדַל בְּ֭נִ/י לִ/שְׁמֹ֣עַ מוּסָ֑ר לִ֝/שְׁג֗וֹת מֵֽ/אִמְרֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/027.yaml
  text: Cease[a], my son, to hear instruction and to stray from the words of knowledge.
translation:
  language: pt
  text: Meu filho, deixe de ouvir instrução para se desviar das palavras do conhecimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com sentido irônico: “Meu filho, pare de ouvir instrução, e você se desviará das palavras do conhecimento.” A sintaxe hebraica é condensada. Pode advertir contra ouvir instrução que leva alguém a afastar-se das palavras do conhecimento, ou repreender ironicamente quem deixa de ouvir a boa instrução.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַדַל
  choice: Pare
  rationale: Imperativo masculino singular de חדל. “Pare” comunica de modo direto e natural a ordem de cessar, mantendo o tom de advertência proverbial.
- source_word: בְּנִי
  choice: meu filho
  rationale: Vocativo masculino singular característico da literatura sapiencial; preserva a forma e a relação pedagógica do hebraico.
- source_word: לִשְׁמֹעַ
  choice: de ouvir
  rationale: Com חַדַל, o infinitivo de שמע expressa aquilo que deve deixar de ser feito. “Ouvir” preserva tanto a recepção auditiva quanto o sentido sapiencial de dar atenção.
- source_word: מוּסָר
  choice: a instrução
  rationale: מוּסָר pode indicar disciplina, correção ou instrução. Neste contexto, “instrução” combina naturalmente com “ouvir” e mantém o sentido de formação sapiencial.
- source_word: לִשְׁגוֹת
  choice: que o desvia
  rationale: O infinitivo de שגה indica errar ou desviar-se. A oração relativa explicita uma possível relação de resultado ou efeito na sintaxe hebraica comprimida, sem excluir a leitura alternativa registrada em nota.
- source_word: מֵאִמְרֵי
  choice: das palavras
  rationale: A preposição מִן indica afastamento ou separação, e אִמְרֵי está em relação construta. “Das palavras” expressa ambos de modo idiomático.
- source_word: דָעַת
  choice: do conhecimento
  rationale: דָעַת designa conhecimento no campo semântico da sabedoria; a tradução direta preserva a terminologia sapiencial.
theological_decisions:
- issue: Relação entre os dois infinitivos na sintaxe hebraica comprimida
  choice: A instrução mencionada é apresentada como aquilo que desvia das palavras do conhecimento.
  alternative: “Pare, meu filho, de ouvir a instrução, e você se desviará das palavras do conhecimento”, como repreensão irônica a quem deixa de ouvir a boa instrução.
  rationale: A construção hebraica admite mais de uma relação sintática entre לִשְׁמֹעַ e לִשְׁגוֹת. O texto principal adota uma leitura coerente e natural em português, enquanto a nota preserva a ambiguidade real sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O vocativo “meu filho” e o termo sapiencial “instrução” preservam o registro proverbial. A expansão mínima “que o desvia” torna inteligível uma das relações sintáticas possíveis, e a nota registra a alternativa substantiva.
