  text: עַ֭צְלָה תַּפִּ֣יל תַּרְדֵּמָ֑ה וְ/נֶ֖פֶשׁ רְמִיָּ֣ה תִרְעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/015.yaml
  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
translation:
  language: pt
  text: 'A preguiça faz cair em profundo sono,

    e a pessoa negligente passará fome.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a pessoa [ou alma] negligente terá fome”. A palavra traduzida por “negligente” também pode significar “enganosa” em outros contextos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְלָה
  choice: preguiça
  rationale: O substantivo indica indolência ou falta de disposição para agir; “preguiça” é natural, atual e mantém a força moral do provérbio.
- source_word: תַּפִּיל
  choice: faz cair em
  rationale: A forma causativa de נפל significa “fazer cair” ou “lançar”. A expressão preserva a imagem hebraica e soa natural com “sono profundo”.
- source_word: תַּרְדֵּמָה
  choice: sono profundo
  rationale: O termo designa sono pesado ou profundo, mais intenso que simples sonolência.
- source_word: נֶפֶשׁ
  choice: pessoa
  rationale: Neste contexto, נֶפֶשׁ se refere ao indivíduo ou à própria pessoa, não necessariamente a uma “alma” em sentido metafísico.
- source_word: רְמִיָּה
  choice: negligente
  rationale: No paralelismo com “preguiça” e na relação com a fome, o termo expressa relaxamento, descuido ou falta de diligência. “Negligente” evita repetir “preguiçosa” e preserva essa nuance; a possibilidade lexical de “enganosa” é registrada em nota.
- source_word: תִרְעָב
  choice: passará fome
  rationale: O verbo significa ter ou sofrer fome. “Passará fome” comunica naturalmente a consequência sem intensificá-la para “morrer de fome”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém o paralelismo proverbial e a imagem causativa do primeiro verso. “Pessoa” representa o uso contextual de נֶפֶשׁ, enquanto a nota conserva as alternativas lexicais relevantes sem impor leitura metafísica.
