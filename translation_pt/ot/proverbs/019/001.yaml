id: PRO.19.1
reference: Proverbs 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ שְׂ֝פָתָ֗י/ו וְ/ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
translation:
  language: pt
  text: Melhor é o pobre que anda em sua integridade do que aquele cuja fala é perversa e que é tolo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do que o tolo cuja fala é perversa”. A sintaxe hebraica permite que a expressão final, “e ele é tolo”, identifique de modo mais compacto a pessoa contrastada.'
    reason: alternative_reading
  - marker: b
    text: “Anda” é uma metáfora hebraica para a maneira de viver e agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: Preserva a fórmula comparativa característica dos provérbios e introduz diretamente o juízo de valor.
- source_word: רָשׁ
  choice: o pobre
  rationale: O termo designa uma pessoa pobre; o masculino singular do hebraico é mantido de maneira natural em português.
- source_word: הוֹלֵךְ
  choice: que anda
  rationale: Mantém a metáfora hebraica do caminhar como modo de viver e agir.
- source_word: בְּתֻמּוֹ
  choice: em sua integridade
  rationale: Expressa inteireza e retidão de caráter sem sugerir ausência absoluta de pecado.
- source_word: מֵעִקֵּשׁ שְׂפָתָיו
  choice: do que aquele cuja fala é perversa
  rationale: A preposição marca a comparação, e a expressão literalmente ligada aos lábios descreve uma fala moralmente tortuosa; esta formulação é clara e natural em português.
- source_word: וְהוּא כְסִיל
  choice: e que é tolo
  rationale: Mantém a coordenação simples do hebraico e, na leitura principal, caracteriza como tolo o homem de fala perversa.
theological_decisions:
- issue: Relação sintática de וְהוּא כְסִיל com a pessoa contrastada
  choice: 'Entender a oração como uma segunda caracterização da pessoa cuja fala é perversa: “e que é tolo”.'
  alternative: 'Entender “tolo” como o núcleo da pessoa contrastada: “do que o tolo de fala perversa”.'
  rationale: A ordem e a coordenação hebraicas admitem as duas formulações, sem diferença substancial no contraste moral; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva-se a metáfora sapiencial de “andar”, enquanto “fala perversa” comunica naturalmente a imagem hebraica dos lábios tortuosos.
