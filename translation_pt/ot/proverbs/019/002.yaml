  text: Also[a], without knowledge, desire is not good, and whoever hurries with his feet sins.
translation:
  language: pt
  text: Além disso, o desejo[a] sem conhecimento não é bom, e quem se apressa com os pés peca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa sem conhecimento não é boa”. A expressão hebraica com נֶפֶשׁ pode ser entendida de mais de uma maneira; aqui ela é entendida idiomaticamente no sentido de “desejo” ou “apetite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a força aditiva do advérbio hebraico e a ligação desta máxima com o contexto, sem lhe dar ênfase excessiva.
- source_word: בְּלֹא דַעַת
  choice: sem conhecimento
  rationale: Tradução direta que mantém amplo o sentido intelectual e moral de דַּעַת na literatura sapiencial.
- source_word: נֶפֶשׁ
  choice: desejo
  rationale: Neste contexto, נֶפֶשׁ pode designar o apetite ou impulso interior. “Desejo” comunica esse uso idiomático em português corrente, sem transformar o termo numa referência técnica à alma; a leitura alternativa referente à pessoa é preservada em nota.
- source_word: לֹא טוֹב
  choice: não é bom
  rationale: Mantém a formulação simples, ampla e proverbial do hebraico.
- source_word: וְאָץ
  choice: e quem se apressa
  rationale: Expressa de modo natural o valor genérico do particípio, que descreve a pessoa que age precipitadamente.
- source_word: בְּרַגְלַיִם
  choice: com os pés
  rationale: Conserva a imagem corporal concreta do hebraico em vez de substituí-la por uma abstração como “em seus atos”.
- source_word: חוֹטֵא
  choice: peca
  rationale: Preserva o peso moral do verbo חטא, que aqui pode abranger tanto o erro prático quanto a transgressão moral.
