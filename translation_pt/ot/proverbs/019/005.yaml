source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים לֹ֣א יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
translation:
  language: pt
  text: A testemunha falsa não ficará sem castigo[a], e quem profere mentiras não escapará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será absolvida” ou “não será considerada inocente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “exala mentiras”, imagem de quem as fala livremente ou de modo reiterado; também pode ser traduzido por “profere mentiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: a testemunha falsa
  rationale: Expressão idiomática e clara em português, preservando o sentido jurídico e testemunhal da construção hebraica.
- source_word: יִנָּקֶה
  choice: não ficará sem castigo
  rationale: O nifal de נקה pode indicar ficar livre de culpa ou punição. Neste paralelismo sapiencial, a formulação comunica naturalmente que a testemunha não permanecerá impune, sem restringir o sentido a uma absolvição judicial.
- source_word: וְיָפִיחַ כְּזָבִים
  choice: e quem profere mentiras
  rationale: O hifil de פוח apresenta literalmente a imagem de soprar ou exalar, aqui aplicada à fala. 'Profere mentiras' é natural e digno em português; a imagem literal é preservada em nota.
- source_word: כְּזָבִים
  choice: mentiras
  rationale: Equivalente direto e corrente para o plural hebraico, em paralelo com 'testemunha falsa'.
- source_word: יִמָּלֵט
  choice: não escapará
  rationale: Reproduz de modo direto o sentido de escapar ou livrar-se e mantém o paralelismo com a impossibilidade de ficar sem castigo.
