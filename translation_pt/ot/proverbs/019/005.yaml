  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação conserva o tom sentencioso e o paralelismo do provérbio. Emprega 'testemunha falsa', expressão corrente, e registra em notas as nuances judiciais de נקה e a imagem concreta de פוח.
