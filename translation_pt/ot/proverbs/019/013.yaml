  yaml_path: translation/ot/proverbs/019/013.yaml
  text: A foolish son is ruin to his father[a], and a wife’s quarrels are a continual dripping.
translation:
  language: pt
  text: O filho insensato é uma ruína para seu pai,[a] e as brigas da esposa são um gotejar constante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O filho insensato é uma calamidade para seu pai, e as contendas da esposa são um gotejar incessante.”'
    reason: Alternativas lexicais para הַוּוֹת, מִדְיְנֵי e טֹרֵד, preservando o valor intensivo de «calamidade» e a persistência da imagem do gotejamento.
lexical_decisions:
- source_word: הַוּוֹת
  choice: ruína
  rationale: O plural hebraico tem valor abstrato ou intensivo e expressa ruína ou calamidade; “ruína” preserva a força do provérbio em português natural.
- source_word: לְאָבִיו
  choice: de seu pai
  rationale: O lamed indica a pessoa atingida; na construção portuguesa “é a ruína de seu pai”, a relação e o impacto ficam claros e idiomáticos.
- source_word: בֵּן כְּסִיל
  choice: o filho insensato
  rationale: Em Provérbios, כְּסִיל caracteriza insensatez moral e prática, não mera falta de inteligência; “insensato” comunica esse sentido com dignidade.
- source_word: דֶּלֶף טֹרֵד
  choice: um gotejar constante
  rationale: A expressão descreve água que pinga persistentemente, imagem doméstica de incômodo contínuo. “Gotejar constante” reproduz tanto a imagem quanto sua duração.
- source_word: מִדְיְנֵי
  choice: brigas
  rationale: O plural denota contendas ou disputas repetidas; “brigas” é claro e corrente sem perder a força do contexto doméstico.
- source_word: אִשָּׁה
  choice: da esposa
  rationale: Embora אִשָּׁה também possa significar “mulher”, o cenário familiar e o paralelismo doméstico favorecem “esposa”.
