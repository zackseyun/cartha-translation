  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת גַּם אֶל פִּ֝֗י/הוּ לֹ֣א יְשִׁיבֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/024.yaml
  text: The sluggard buries his hand in the dish[b][a]; he will not even bring it back to his mouth.
translation:
  language: pt
  text: O preguiçoso enterra[a] a mão no prato[b]; nem sequer a leva de volta à boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esconde a mão no prato”. O verbo hebraico pode significar “esconder” ou “enterrar”; “enterra” preserva a imagem exagerada do provérbio.
    reason: lexical_alternative
  - marker: b
    text: Ou “na tigela” ou “na travessa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: enterra
  rationale: O verbo pode significar esconder, ocultar ou enterrar. “Enterra” conserva a imagem hiperbólica e absurda do provérbio, sem reduzi-la ao simples ato de pôr a mão no recipiente.
- source_word: עָצֵל
  choice: o preguiçoso
  rationale: Termo recorrente da literatura sapiencial para uma pessoa caracterizada pela preguiça; é claro, conciso e proverbial em português atual.
- source_word: יָדוֹ
  choice: a mão
  rationale: Mantém o substantivo no singular; o possuidor já está claro pelo sujeito e pelo pronome retomado na segunda oração.
- source_word: בַּצַּלָּחַת
  choice: no prato
  rationale: O substantivo indica um recipiente para servir ou comer, podendo ser prato, tigela ou travessa. “Prato” é natural no contexto, sem eliminar as alternativas em nota.
- source_word: גַּם
  choice: nem sequer
  rationale: 'Em combinação com a negação, a partícula intensifica o absurdo: ele não realiza nem mesmo o movimento mínimo seguinte.'
- source_word: אֶל־פִּיהוּ
  choice: à boca
  rationale: Preserva a referência concreta à boca e a cena de alimentação presente no hebraico.
- source_word: לֹא יְשִׁיבֶנָּה
  choice: não a leva de volta
  rationale: O hifil de שוב expressa fazer voltar ou trazer de volta. O pronome feminino retoma “mão”; a formulação portuguesa mantém esse movimento sem sugerir que o objeto retomado seja o prato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. A tradução conserva a hipérbole concreta do hebraico. “Mas nem sequer” explicita naturalmente em português o valor intensificador de גַּם sob negação. Os marcadores seguem imediatamente o termo a que se referem.
