  text: תַּאֲוַ֣ת אָדָ֣ם חַסְדּ֑/וֹ וְ/טֽוֹב רָ֝שׁ מֵ/אִ֥ישׁ כָּזָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/022.yaml
  text: What is desired in a man is his steadfast love[b][a], and a poor man is better than a liar.
translation:
  language: pt
  text: O que se deseja em uma pessoa é seu amor leal[a][b], e mais vale um pobre do que um mentiroso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O desejo de uma pessoa é seu amor leal”. O hebraico da primeira linha é conciso e pode indicar tanto o que é desejável numa pessoa quanto identificar o desejo dela com sua bondade ou lealdade.'
    reason: alternative_reading
  - marker: b
    text: “Amor leal” traduz חֶסֶד, termo rico que, conforme o contexto, também pode significar bondade, lealdade ou amor fiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: O que se deseja
  rationale: O substantivo pode significar “desejo” ou “aquilo que é desejado”. Esta formulação expressa a provável leitura predicativa, sem ocultar na nota a construção hebraica concisa e ambígua.
- source_word: אָדָם
  choice: em uma pessoa
  rationale: Aqui designa um ser humano individual de modo genérico. “Pessoa” comunica naturalmente essa abrangência no português moderno.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, bondade e lealdade. “Amor leal” preserva seu peso relacional e sua constância sem impor uma especificação exclusivamente pactual.
- source_word: וְטוֹב
  choice: e mais vale
  rationale: A conjunção e o adjetivo introduzem a comparação. “Mais vale” é uma construção proverbial natural em português e mantém a força comparativa.
- source_word: רָשׁ
  choice: um pobre
  rationale: O termo substantivado indica uma pessoa pobre. Em português, “um pobre” conserva de forma concisa o singular representativo do hebraico.
- source_word: מֵאִישׁ
  choice: do que
  rationale: A preposição מִן marca o padrão da comparação; em português, a relação é expressa naturalmente por “do que”.
- source_word: כָּזָב
  choice: um mentiroso
  rationale: Neste sintagma, o substantivo “falsidade/engano” caracteriza o homem como alguém falso; “mentiroso” é conciso e idiomático.
theological_decisions:
- issue: Ambiguidade da primeira linha
  choice: O que se deseja em uma pessoa é seu amor leal
  alternative: O desejo de uma pessoa é seu amor leal
  rationale: A leitura principal entende תַּאֲוַת como “aquilo que é desejado”, adequada ao contraste moral do paralelismo. Como a sintaxe hebraica também admite entender a expressão como “o desejo de uma pessoa”, essa possibilidade é preservada em nota, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e proverbial, com ampla legibilidade brasileira. “Pessoa” expressa o sentido humano genérico de אָדָם; “mais vale” dá fluidez idiomática à comparação. Os marcadores [a] e [b] aparecem no texto principal junto à expressão pertinente.
