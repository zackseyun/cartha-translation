  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
translation:
  language: pt
  text: Todos os irmãos do pobre o odeiam[a]; quanto mais os seus amigos se afastam dele! Ele corre atrás de palavras, mas elas não existem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” está no masculino em hebraico e, no contexto social do provérbio, refere-se aos membros da família.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Ele corre atrás de palavras que nada são”, ou: “Ele corre atrás de promessas, mas elas não se cumprem”. A oração final é textual e sintaticamente difícil em hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשׁ
  choice: o pobre
  rationale: O termo designa alguém empobrecido. O singular masculino e os sufixos masculinos são preservados de modo natural em português por “o pobre”.
- source_word: אֲחֵי
  choice: irmãos
  rationale: Preserva diretamente o sentido familiar do construto hebraico, sem ampliá-lo para “parentes”.
- source_word: שְׂנֵאֻהוּ
  choice: o odeiam
  rationale: Traduz a força normal do verbo שׂנא, evitando suavizá-lo como “desprezam”.
- source_word: אַף כִּי
  choice: quanto mais
  rationale: 'Expressa o raciocínio a fortiori: se até os irmãos o odeiam, com maior razão os amigos se mantêm distantes.'
- source_word: מְרֵעֵהוּ
  choice: os seus amigos
  rationale: O substantivo indica companheiros ou amigos; “amigos” é natural e mantém o contraste com “irmãos”.
- source_word: רָחֲקוּ מִמֶּנּוּ
  choice: se afastam dele
  rationale: Comunica tanto a distância quanto o afastamento relacional em português corrente.
- source_word: מְרַדֵּף
  choice: Ele corre atrás
  rationale: O particípio é sintaticamente difícil; esta formulação o entende como continuação da descrição do pobre e conserva a ideia intensa de perseguir.
- source_word: אֲמָרִים
  choice: palavras
  rationale: Mantém o sentido lexical básico, sem decidir no texto principal se são promessas, apelos ou palavras vazias.
- source_word: לֹא הֵמָּה
  choice: elas não estão lá
  rationale: Reproduz a conclusão breve e difícil do hebraico, deixando sua possível referência a palavras ou promessas ausentes sem resolução excessiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo, a força de “odeiam” e a ambiguidade da oração final.
