  source_fidelity: 'A tradução preserva bem as relações centrais do hebraico: os irmãos do pobre o odeiam, e seus amigos se afastam ainda mais. “O pobre”, “irmãos”, “odeiam”, “quanto mais”, “amigos” e “palavras” são escolhas fiéis e adequadas. A oração final permanece reconhecidamente difícil; contudo, “elas não estão lá” reproduz um deítico do inglês que não é natural em português e não expressa bem a elipse hebraica.'
  naturalness: O texto é claro e de registro proverbial apropriado. “Quanto mais os seus amigos se afastam dele” funciona bem como intensificação. A única formulação que soa como decalque é “mas elas não estão lá”; “mas elas não existem” é mais idiomático em português e mantém a concisão e a estranheza deliberada da cláusula hebraica.
  terminology: A terminologia é consistente e não introduz interpretação teológica ou confessional. “Irmãos” é preferível a uma ampliação para “parentes”; a nota cultural explica adequadamente o masculino gramatical e o enquadramento social. A nota da dificuldade textual da última oração é necessária e deve ser preservada.
