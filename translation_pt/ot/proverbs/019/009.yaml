base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
translation:
  language: pt
  text: A testemunha falsa não ficará impune[a], e quem profere mentiras[b] perecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será absolvida” ou “não será considerada inocente”. O verbo hebraico pode enfatizar tanto a falta de absolvição quanto a certeza da punição.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “exala” ou “sopra mentiras”. A expressão hebraica retrata as mentiras saindo com a mesma facilidade que o ar expirado.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: testemunha falsa
  rationale: A expressão hebraica, literalmente “testemunha de falsidades”, designa uma testemunha que dá depoimento falso. “Testemunha falsa” é a forma natural em português e conserva o sentido forense.
- source_word: לֹא יִנָּקֶה
  choice: não ficará sem punição
  rationale: O nifal de נקה pode indicar ser considerado inocente, ficar livre ou escapar. Neste contexto sapiencial e judicial, a formulação comunica que a testemunha falsa não escapará das consequências, sem apagar a possibilidade lexical de “não ser absolvida”, registrada em nota.
- source_word: וְיָפִיחַ
  choice: e quem exala
  rationale: O particípio de פוח retrata alguém que faz sair falsidades como quem solta o ar. “Exala” preserva a imagem expressiva do hebraico e continua inteligível em português.
- source_word: כְּזָבִים
  choice: mentiras
  rationale: O plural significa mentiras ou falsidades. “Mentiras” é claro, direto e natural no paralelismo do provérbio.
- source_word: יֹאבֵד
  choice: perecerá
  rationale: O qal de אבד significa perecer, perder-se ou chegar à ruína. “Perecerá” mantém a força concisa da advertência e não especifica além do que o hebraico afirma.
