source:
  edition: WLC
  text: עֵ֣ד בְּ֭לִיַּעַל יָלִ֣יץ מִשְׁפָּ֑ט וּ/פִ֥י רְ֝שָׁעִ֗ים יְבַלַּע אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/028.yaml
  text: A worthless witness mocks justice[c][b][a], and the mouth of the wicked swallows iniquity.
translation:
  language: pt
  text: 'A testemunha vil[a] zomba da justiça[b],

    e a boca dos perversos engole a maldade[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma testemunha indigna” ou “uma testemunha sem valor”. O termo hebraico é entendido aqui como descrição moral, não como o nome próprio posterior “Belial”.
    reason: lexical_alternative
  - marker: b
    text: Ou “zomba do julgamento” ou “escarnece da justiça”.
    reason: lexical_alternative
  - marker: c
    text: Ou “engole a perversidade”, “o mal” ou “a falsidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: testemunha
  rationale: Designa quem presta testemunho; “testemunha” é o equivalente jurídico natural em português.
- source_word: בְּלִיַּעַל
  choice: vil
  rationale: O termo qualifica moralmente a testemunha como indigna ou sem valor. “Vil” é conciso e evita tratá-lo como o nome próprio posterior “Belial”.
- source_word: יָלִיץ
  choice: zomba de
  rationale: Neste contexto, o verbo comunica desprezo escarnecedor pela justiça; “zomba de” preserva a força moral do provérbio em linguagem corrente.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: O substantivo pode indicar justiça, julgamento ou decisão judicial. “Justiça” expressa bem o sentido ético e jurídico sem restringi-lo a uma sentença específica.
- source_word: פִי
  choice: a boca de
  rationale: Mantém a imagem corporal explícita no hebraico e prepara naturalmente a metáfora de engolir.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O plural substantivado refere-se genericamente a pessoas moralmente más; “os perversos” é claro e adequado ao estilo proverbial.
- source_word: יְבַלַּע
  choice: engole
  rationale: Preserva o sentido concreto de engolir e a imagem vívida formada com “boca”, sem explicar em excesso a metáfora.
- source_word: אָוֶן
  choice: maldade
  rationale: O termo pode denotar maldade, perversidade, dano ou falsidade. “Maldade” conserva a amplitude moral da palavra e é mais corrente que “iniquidade”.
theological_decisions:
- issue: Sentido de בְּלִיַּעַל
  choice: 'Adjetivo moral comum: “vil”'
  alternative: 'Nome próprio: “Belial”'
  rationale: No contexto sapiencial, a construção descreve o caráter da testemunha; traduzi-la como nome próprio importaria uma personificação posterior não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo e a metáfora concreta de boca que engole, sem suavizar a imagem incomum do hebraico. A quebra de linha destaca os dois membros do provérbio.
