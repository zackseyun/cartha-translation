source:
  edition: WLC
  text: יִרְאַ֣ת יְהוָ֣ה לְ/חַיִּ֑ים וְ/שָׂבֵ֥עַ יָ֝לִ֗ין בַּל יִפָּ֥קֶד רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/023.yaml
  text: The fear of Yahweh leads to life[a], and whoever has it will rest satisfied[c][b]; he will not be visited by harm.
translation:
  language: pt
  text: O temor de Yahweh conduz à vida[a], e quem o tem repousará satisfeito[b]; não será visitado pela desgraça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é para a vida”. A expressão hebraica é muito concisa.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “passará a noite satisfeito” ou “dormirá satisfeito”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pelo mal” ou “pela calamidade”. Aqui, “mal” se refere a dano ou desgraça, não ao mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: temor
  rationale: No construto com יְהוָה, indica temor reverente diante de Deus. “Temor” preserva tanto a reverência quanto a seriedade do termo hebraico, sem reduzi-lo a mero respeito nem a simples terror.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְחַיִּים
  choice: conduz à vida
  rationale: A expressão nominal hebraica é muito concisa. Esta formulação comunica de modo natural a direção ou o resultado indicado por לְ, mantendo “vida” em seu sentido sapiencial amplo.
- source_word: וְשָׂבֵעַ
  choice: satisfeito
  rationale: O adjetivo descreve quem está saciado, contente ou em condição de plenitude; “satisfeito” funciona naturalmente com a imagem de repouso.
- source_word: יָלִין
  choice: repousará
  rationale: O verbo significa literalmente passar a noite ou pernoitar. “Repousará” comunica a segurança tranquila sugerida no contexto, enquanto a nota preserva a imagem literal.
- source_word: בַּל
  choice: não
  rationale: Reproduz diretamente a partícula negativa poética, sem acrescentar a ênfase de “jamais”.
- source_word: יִפָּקֶד
  choice: será visitado
  rationale: O nifal de פקד pode descrever uma visitação que sobrevém a alguém. A formulação conserva a metáfora hebraica de uma visitação adversa.
- source_word: רָע
  choice: desgraça
  rationale: Neste contexto, רָע designa calamidade ou dano, não maldade moral. “Desgraça” deixa claro o caráter adverso da visitação.
theological_decisions:
- issue: Se “vida” deve ser limitada à longevidade, à prosperidade terrena ou à vida espiritual
  choice: Manter “vida” sem qualificadores, entendendo-a como uma categoria sapiencial ampla.
  alternative: Explicitar “vida longa”, “prosperidade” ou “vida eterna”.
  rationale: O texto não restringe o termo. Em Provérbios, “vida” pode abranger vitalidade, bem-estar e florescimento sob a ordem de Deus; uma especificação resolveria indevidamente essa amplitude.
- issue: Se a cláusula final promete isenção absoluta de toda adversidade
  choice: Preservar a generalização proverbial e a metáfora da visitação, sem acrescentar explicações ao texto principal.
  alternative: Verter “nenhum mal jamais lhe acontecerá” ou interpretar a frase como punição por maldade.
  rationale: A literatura sapiencial formula verdades gerais de modo condensado. A tradução deve manter a força da afirmação sem transformá-la numa formulação sistemática sobre todo sofrimento possível.
- issue: Identidade do sujeito implícito nas duas últimas cláusulas
  choice: Explicitar “quem o tem” como referência à pessoa caracterizada pelo temor de Yahweh.
  alternative: 'Traduzir de modo mais elíptico: “e satisfeito repousará”.'
  rationale: O hebraico deixa o sujeito implícito. A explicitação torna a frase idiomática em português e segue a ligação contextual, mas não acrescenta uma categoria teológica ausente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Yahweh” preserva o nome divino; “repousará satisfeito” soa natural, enquanto a nota registra a imagem concreta de passar a noite. A pontuação mantém as três unidades do provérbio sem tornar excessivamente rígido o paralelismo.
