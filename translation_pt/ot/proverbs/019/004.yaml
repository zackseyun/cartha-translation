  text: ה֗וֹן יֹ֭סִיף רֵעִ֣ים רַבִּ֑ים וְ֝/דָ֗ל מֵרֵ֥ע/הוּ יִפָּרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/004.yaml
  text: Wealth adds many friends[a], but a poor man is separated from his friend.
translation:
  language: pt
  text: 'A riqueza acrescenta muitos amigos,

    mas o pobre fica separado do seu amigo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é abandonado pelo seu amigo”. O verbo hebraico indica separação sem esclarecer se o pobre se afasta ou se é abandonado; o contexto sugere fortemente abandono social.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: riqueza
  rationale: Designa riqueza material ou bens; “riqueza” é amplo, natural e não restringe o sentido a dinheiro.
- source_word: יֹסִיף
  choice: multiplica
  rationale: O hifil de יסף significa acrescentar ou aumentar. Neste contexto, “multiplica” expressa com naturalidade que a riqueza aumenta o número de amigos.
- source_word: רֵעִים רַבִּים
  choice: os amigos
  rationale: רֵעִים designa amigos ou companheiros, e רַבִּים indica grande número. Com o verbo “multiplica”, a ideia de “muitos” já está incorporada sem perda de sentido.
- source_word: דָל
  choice: o pobre
  rationale: דָל pode designar quem é pobre, fraco ou socialmente desfavorecido. “O pobre” conserva o singular genérico e o estilo conciso do provérbio.
- source_word: מֵרֵעֵהוּ
  choice: do seu amigo
  rationale: A preposição מִן com רֵעַ e o sufixo de terceira pessoa singular indica separação “do seu amigo”; o singular genérico é preservado.
- source_word: יִפָּרֵד
  choice: fica separado
  rationale: O nifal de פרד pode descrever o estado ou processo de separação sem identificar claramente quem toma a iniciativa. “Fica separado” preserva essa ambiguidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo antitético e a concisão proverbial foram preservados; a nota mantém a ambiguidade legítima da forma verbal hebraica.
