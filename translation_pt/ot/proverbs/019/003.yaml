id: PRO.19.3
reference: Proverbs 19:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִוֶּ֣לֶת אָ֭דָם תְּסַלֵּ֣ף דַּרְכּ֑/וֹ וְ/עַל יְ֝הוָ֗ה יִזְעַ֥ף לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
translation:
  language: pt
  text: 'A insensatez do homem[a] arruína[b] o seu caminho, e o seu coração se enfurece contra Yahweh.


    [a] Aqui, o hebraico usa “homem” no singular em sentido genérico, referindo-se a uma pessoa em geral.

    [b] Ou “desvirtua” ou “torna tortuoso”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, o hebraico usa “homem” no singular em sentido genérico, referindo-se a uma pessoa em geral.
    reason: cultural_note
  - marker: b
    text: Ou “desvirtua” ou “torna tortuoso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Expressa a condição de agir sem sabedoria e mantém o contraste característico de Provérbios entre sabedoria e insensatez.
- source_word: אָדָם
  choice: homem
  rationale: Reproduz o substantivo singular genérico do hebraico e preserva o estilo conciso do provérbio; a nota esclarece que a referência é à pessoa em geral.
- source_word: תְּסַלֵּף
  choice: arruína
  rationale: Comunica de modo natural o efeito destrutivo da insensatez sobre o curso de vida da própria pessoa. A nota registra mais diretamente a imagem lexical de torcer ou desvirtuar.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: Mantém a metáfora sapiencial do caminho como conduta e curso de vida, além de preservar suas ressonâncias ao longo de Provérbios.
- source_word: וְעַל
  choice: e ... contra
  rationale: Conserva a coordenação hebraica e explicita naturalmente o alvo da hostilidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico em vez de substituí-lo por um título.
- source_word: יִזְעַף
  choice: se enfurece
  rationale: Reflete a forte indignação expressa pelo verbo e torna clara a ironia de a pessoa culpar a Deus pelas consequências da própria insensatez.
- source_word: לִבּוֹ
  choice: o seu coração
  rationale: Preserva a imagem hebraica do coração como centro interior do pensamento, da vontade e da emoção.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: O versículo emprega diretamente o tetragrama; “Yahweh” preserva o nome próprio e mantém a convenção do projeto.
- issue: Sentido genérico de אָדָם
  choice: homem, com nota explicativa
  alternative: pessoa
  rationale: A forma hebraica é singular e genericamente humana. A tradução preserva sua forma proverbial tradicional sem restringir o referente ao sexo masculino, como esclarece a nota.
- issue: Relação entre a ruína causada pela própria insensatez e a ira contra Deus
  choice: manter as duas afirmações coordenadas sem explicitar causalidade adicional
  alternative: mas o seu coração se enfurece contra Yahweh
  rationale: O texto sugere forte ironia moral, porém usa coordenação simples. A tradução evita inserir uma relação adversativa ou causal mais explícita do que a fonte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial concisa. “Insensatez” e “caminho” preservam o registro da literatura sapiencial; “se enfurece” comunica a intensidade do hebraico sem soar arcaico.
