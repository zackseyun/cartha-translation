review_pass:
  verdict: revise
  source_fidelity: O paralelismo e os referentes estão bem preservados. Contudo, תַּכֶּה denota literalmente aplicar um golpe punitivo; «castigue» torna a ação mais abstrata. Além disso, יָבִין דָּעַת expressa a aquisição/assimilação de conhecimento, e «compreenderá o conhecimento» é pouco idiomático em português.
  naturalness: O texto é claro e de registro sapiencial adequado. «Compreenderá o conhecimento», porém, soa redundante e pouco natural; «adquirirá conhecimento» é mais fluente e comunica bem o resultado.
  terminology: «Zombador», «inexperiente», «prudente», «repreenda» e «discernimento» são escolhas adequadas para os termos de sabedoria. «Golpeie» preserva a concretude do verbo hebraico sem o tom arcaico de «fira».
  issues:
  - severity: medium
    issue: «Castigue» atenua a ação física expressa por תַּכֶּה.
    rationale: O verbo hebraico indica golpear como punição. Uma formulação concreta preserva melhor a imagem proverbial, sem exigir que se infira violência excessiva.
  - severity: medium
    issue: «Compreenderá o conhecimento» é formulação pouco idiomática.
    rationale: Embora reflita superficialmente o verbo «entender» e o substantivo «conhecimento», em português a combinação soa tautológica. «Adquirirá conhecimento» expressa naturalmente o resultado de יָבִין דָּעַת.
  revised_text: Golpeie o zombador, e o inexperiente se tornará prudente; repreenda quem tem discernimento, e ele adquirirá conhecimento.
  revised_footnotes: []
