base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/025.yaml
  text: Strike a scoffer[a], and the simple will become shrewd; rebuke one who has understanding[c][b], and he will gain knowledge.
translation:
  language: pt
  text: Golpeie o zombador, e o inexperiente se tornará prudente; repreenda quem tem discernimento, e ele adquirirá conhecimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: zombador
  rationale: Em Provérbios, designa quem trata a sabedoria com desprezo e escárnio. “Zombador” é natural em português e mantém a carga moral do termo.
- source_word: תַּכֶּה
  choice: castigue
  rationale: O verbo נכה pode indicar aplicar um golpe punitivo. No contexto proverbial, “castigue” comunica a ação disciplinar sem sugerir necessariamente violência excessiva.
- source_word: פֶתִי
  choice: o inexperiente
  rationale: É uma categoria sapiencial para a pessoa ingênua, influenciável e ainda não formada. “Inexperiente” evita que “simples” seja entendido como humilde ou pouco sofisticado.
- source_word: יַעְרִם
  choice: se tornará prudente
  rationale: A forma de ערם expressa adquirir prudência ou sagacidade prática. “Prudente” conserva aqui o valor positivo próprio da literatura sapiencial.
- source_word: וְהוֹכִיחַ
  choice: repreenda
  rationale: יכח indica censurar ou corrigir verbalmente. “Repreenda” é conciso, atual e adequado ao paralelismo com a disciplina da primeira linha.
- source_word: לְנָבוֹן
  choice: quem tem discernimento
  rationale: נָבוֹן descreve uma pessoa capaz de perceber e distinguir. A formulação preserva o referente pessoal singular de maneira natural e sem acrescentar gênero.
- source_word: יָבִין
  choice: compreenderá
  rationale: בין significa primariamente entender ou discernir. Com דָּעַת como objeto, “compreenderá o conhecimento” preserva de perto a formulação hebraica e a distinção entre discernimento já possuído e compreensão adicional.
- source_word: דָּעַת
  choice: conhecimento
  rationale: É o termo sapiencial comum para conhecimento. A tradução direta conserva o vocabulário conceitual de Provérbios.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e os dois resultados distintos foram preservados. Preferiu-se “castigue” a “golpeie” no texto principal para comunicar a função disciplinar do ato; a concretude física permanece implícita no verbo hebraico. Não foram necessárias notas, pois as alternativas lexicais não alteram substancialmente o sentido do versículo.
