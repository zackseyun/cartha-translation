revisions:
- from: Castigue o zombador, e o inexperiente se tornará prudente; repreenda quem tem discernimento, e ele compreenderá o conhecimento.
  to: Golpeie o zombador, e o inexperiente se tornará prudente; repreenda quem tem discernimento, e ele adquirirá conhecimento.
  rationale: A revisão preserva a ação punitiva concreta de תַּכֶּה e substitui uma construção portuguesa pouco natural por uma expressão idiomática que mantém o sentido resultativo de יָבִין דָּעַת. Não são necessárias notas para este versículo.
