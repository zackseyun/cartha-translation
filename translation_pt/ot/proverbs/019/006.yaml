  yaml_path: translation/ot/proverbs/019/006.yaml
  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
translation:
  language: pt
  text: Muitos procuram o favor do homem generoso,[a] e todos são amigos de quem dá presentes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do nobre». O termo hebraico pode referir-se a alguém generoso ou a uma pessoa de posição nobre.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «e todo amigo [é] para um homem de dádiva».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Muitos
  rationale: Mantém de forma concisa o quantificador plural e o estilo proverbial.
- source_word: יְחַלּוּ פְנֵי
  choice: procuram o favor de
  rationale: Traduz idiomaticamente a expressão hebraica, cujo sentido é suplicar ou buscar o favor de alguém, sem conservar o literalismo pouco natural «abrandar o rosto».
- source_word: נָדִיב
  choice: homem generoso
  rationale: Embora o termo também possa designar um nobre ou príncipe, o paralelismo com o homem que dá presentes favorece aqui a ideia de generosidade.
- source_word: וְכָל הָרֵעַ
  choice: e todos são amigos
  rationale: Expressa naturalmente a abrangência de כָל e a relação de amizade indicada por רֵעַ.
- source_word: לְאִישׁ מַתָּן
  choice: de quem dá presentes
  rationale: Comunica em português corrente a construção literal «de um homem de dádiva(s)», isto é, alguém caracterizado por dar presentes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. A primeira oração conserva a possível ambiguidade de נָדִיב em nota; a segunda emprega linguagem inclusiva natural sem apagar o sentido do hebraico.
