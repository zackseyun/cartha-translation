  terminology: «Homem generoso», «favor» e «presentes» são escolhas coerentes com o registro sapiencial e com o paralelismo. A nota a preserva a alternativa lexical relevante. A nota b, porém, não representa corretamente a preposição hebraica לְ; «é do homem» sugere posse ou pertença, não a relação expressa por «para/com respeito a».
