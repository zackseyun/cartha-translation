  text: נַ֣הַם כַּ֭/כְּפִיר זַ֣עַף מֶ֑לֶךְ וּ/כְ/טַ֖ל עַל עֵ֣שֶׂב רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/012.yaml
  text: A king’s wrath is like the growling of a young lion[b][a], but his favor is like dew on the grass.
translation:
  language: pt
  text: A ira do rei é como o rugido de um leão jovem, mas o seu favor é como o orvalho sobre a relva.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַהַם
  choice: rugido
  rationale: O substantivo designa o som ameaçador de um leão, podendo ser entendido como rugido ou rosnado. “Rugido” é natural, vívido e mantém o tom elevado do provérbio.
- source_word: כְּפִיר
  choice: leão jovem
  rationale: O termo se refere normalmente a um leão jovem, já vigoroso e perigoso; a tradução evita a ideia possivelmente dócil de um filhote.
- source_word: זַעַף
  choice: ira
  rationale: Expressa cólera intensa ou indignação. “Ira” conserva a força e a dignidade poética do hebraico.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente direto e apropriado ao contexto de sabedoria sobre o poder real.
- source_word: וּכְטַל
  choice: mas ... é como o orvalho
  rationale: O waw coordena os dois membros, que formam um contraste claro. “Mas” torna esse contraste natural em português, enquanto “orvalho” preserva literalmente a imagem de refrigério e benefício.
- source_word: עַל
  choice: sobre
  rationale: Preposição natural em português com a imagem do orvalho que repousa na vegetação.
- source_word: עֵשֶׂב
  choice: relva
  rationale: No contexto da imagem poética, “relva” expressa de modo natural a vegetação baixa coberta pelo orvalho e é amplamente compreensível.
- source_word: רְצוֹנוֹ
  choice: seu favor
  rationale: O substantivo pode significar favor, boa vontade, aceitação ou prazer. Em oposição à ira do rei, “favor” é claro e contextualmente adequado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo proverbial claro. A ordem dos membros acompanha o hebraico; o contraste implícito foi expresso por “mas”. Não se acrescentou nota, pois “rugido” e “favor” representam adequadamente o sentido contextual sem eliminar uma ambiguidade teologicamente relevante.
