source:
  edition: WLC
  text: שְׁמַ֣ע עֵ֭צָה וְ/קַבֵּ֣ל מוּסָ֑ר לְ֝מַ֗עַן תֶּחְכַּ֥ם בְּ/אַחֲרִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/020.yaml
  text: Listen to counsel and accept discipline[a], so that you may become wise in the end.
translation:
  language: pt
  text: Ouça o conselho e aceite a disciplina, para que você se torne sábio no fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seus últimos dias” ou “quanto ao seu futuro”. O termo hebraico pode indicar o fim, o desfecho ou o futuro de uma pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouça
  rationale: O imperativo pede atenção obediente, não apenas percepção auditiva; “ouça” é natural e adequado ao contexto sapiencial.
- source_word: עֵצָה
  choice: o conselho
  rationale: Designa orientação ponderada. O singular com artigo produz uma formulação idiomática em português sem reduzir o peso sapiencial a uma sugestão casual.
- source_word: וְקַבֵּל
  choice: e aceite
  rationale: Expressa acolhimento voluntário da formação oferecida; “aceite” é mais natural neste contexto do que o literal “receba”.
- source_word: מוּסָר
  choice: a disciplina
  rationale: Abrange ensino formativo, correção e treinamento moral; “disciplina” preserva essa amplitude melhor do que “instrução” isoladamente.
- source_word: לְמַעַן
  choice: para que
  rationale: Mantém a relação de propósito expressa pela partícula hebraica em português corrente.
- source_word: תֶּחְכַּם
  choice: você se torne sábio
  rationale: Comunica a aquisição ou o desenvolvimento da sabedoria como resultado de acolher conselho e disciplina.
- source_word: בְּאַחֲרִיתֶךָ
  choice: no fim
  rationale: Preserva de modo conciso a referência hebraica ao fim, resultado posterior ou futuro da pessoa, sem decidir no texto principal entre essas nuances.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” para ampla legibilidade brasileira. A formulação conserva os dois imperativos e a relação de propósito do hebraico. A nota mantém aberta a amplitude semântica da expressão final.
