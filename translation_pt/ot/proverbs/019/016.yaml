source:
  edition: WLC
  text: שֹׁמֵ֣ר מִ֭צְוָה שֹׁמֵ֣ר נַפְשׁ֑/וֹ בּוֹזֵ֖ה דְרָכָ֣י/ו יומת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/016.yaml
  text: Whoever keeps the commandment keeps his life[b][a]; he who despises his ways will die.
translation:
  language: pt
  text: Quem guarda o mandamento guarda a própria vida[a]; quem despreza os próprios caminhos[b] será morto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico néfesh, termo que, conforme o contexto, pode significar “vida”, “pessoa” ou “alma”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a própria conduta. Outros entendem “seus caminhos” como os caminhos de Deus ou, de modo mais geral, o caminho indicado pelo mandamento.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “morrerá”. A forma hebraica é passiva, mas o agente não é especificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: guarda
  rationale: O particípio expressa uma prática contínua de guardar, observar e cumprir. A repetição de “guarda” preserva o paralelismo verbal hebraico.
- source_word: מִצְוָה
  choice: o mandamento
  rationale: Mantém o singular do hebraico e funciona proverbialmente como referência ao que é ordenado.
- source_word: נַפְשׁוֹ
  choice: a própria vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida ou a própria pessoa, e o contraste com a morte favorece “vida”, sem sugerir uma antropologia técnica de “alma”.
- source_word: בּוֹזֵה
  choice: despreza
  rationale: Expressa diretamente a atitude de desdém ou menosprezo indicada pelo particípio hebraico.
- source_word: דְרָכָיו
  choice: os próprios caminhos
  rationale: Reproduz o plural “caminhos” e entende o sufixo como referente ao próprio sujeito, isto é, à sua conduta, sem substituir a imagem hebraica por uma explicação.
- source_word: יומת
  choice: será morto
  rationale: Preserva a forma passiva do hophal, sem identificar o agente. A formulação proverbial pode indicar um desfecho fatal certo.
theological_decisions:
- issue: Referente de “seus caminhos” no segundo membro
  choice: Os caminhos do próprio sujeito, isto é, sua conduta
  alternative: Os caminhos de Deus ou, mais genericamente, o caminho do mandamento
  rationale: O sufixo de terceira pessoa pode retomar o sujeito humano, e o paralelismo favorece uma referência à maneira como ele trata a própria conduta. Como o hebraico não nomeia Deus, a tradução não introduz esse referente, mas registra a alternativa em nota.
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma ou a própria pessoa
  rationale: O contraste imediato com o desfecho de morte favorece o sentido concreto de “vida” e evita impor ao provérbio uma distinção antropológica posterior.
- issue: Força passiva de יומת
  choice: será morto
  alternative: morrerá
  rationale: A tradução principal conserva a morfologia passiva do hebraico. A alternativa idiomática é registrada porque o provérbio não identifica um agente e pode enfatizar sobretudo o resultado fatal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “guarda... guarda” conserva o paralelismo do original; “a própria vida” e “os próprios caminhos” tornam naturais em português os sufixos masculinos singulares sem restringir a aplicação universal do provérbio.
