  text: בַּ֣יִת וָ֭/הוֹן נַחֲלַ֣ת אָב֑וֹת וּ֝/מֵ/יְהוָ֗ה אִשָּׁ֥ה מַשְׂכָּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/014.yaml
  text: A house and wealth are an inheritance from fathers[a], but a prudent wife is from Yahweh.
translation:
  language: pt
  text: Casa e riqueza são herança dos pais, mas uma esposa sensata[a] vem de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma mulher sensata”. O hebraico אִשָּׁה pode significar “mulher” ou “esposa”; neste contexto, “esposa” se ajusta melhor ao contraste com os bens herdados.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: casa
  rationale: Preserva o sentido concreto de imóvel ou casa recebida como herança e mantém o paralelismo com a riqueza.
- source_word: הוֹן
  choice: riqueza
  rationale: Expressa com clareza os bens materiais ou recursos mencionados no contexto de herança.
- source_word: נַחֲלַת
  choice: herança
  rationale: Reproduz diretamente o substantivo hebraico e permite uma formulação nominal natural em português.
- source_word: אָבוֹת
  choice: pais
  rationale: Mantém o masculino plural explícito do hebraico e se ajusta ao contexto antigo de transmissão patrimonial, sem ampliar silenciosamente para “antepassados” ou “pais e mães”.
- source_word: מֵיְהוָה
  choice: vem de Yahweh
  rationale: A preposição מִן indica origem ou procedência; o acréscimo verbal exigido pela fluência em português torna explícita a relação da oração nominal sem alterar seu sentido.
- source_word: אִשָּׁה
  choice: esposa
  rationale: Embora o termo possa significar “mulher” ou “esposa”, o contraste com bens herdados favorece aqui a referência à companheira conjugal.
- source_word: מַשְׂכָּלֶת
  choice: sensata
  rationale: Comunica discernimento, bom senso e sabedoria prática em linguagem portuguesa atual e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome divino pessoal em vez de substituí-lo por um título.
- issue: Contraste apresentado pelo provérbio
  choice: Os bens podem ser recebidos dos pais, mas a esposa sensata é apresentada como procedente de Yahweh.
  alternative: Uma mulher sensata vem de Yahweh.
  rationale: A construção atribui a origem da esposa sensata à providência divina, em contraste com a herança transmitida pela linhagem humana. A possibilidade lexical mais ampla de “mulher” é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação “Casa e riqueza são herança” conserva a concisão proverbial; “sensata” transmite sabedoria prática sem soar técnica ou arcaica.
