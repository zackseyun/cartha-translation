  text: לֹֽא נָאוֶ֣ה לִ/כְסִ֣יל תַּעֲנ֑וּג אַ֝֗ף כִּֽי לְ/עֶ֤בֶד מְשֹׁ֬ל בְּ/שָׂרִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/010.yaml
  text: Luxury is not fitting for a fool[c][b][a], much less for a slave to rule over princes.
translation:
  language: pt
  text: O luxo não convém ao insensato[a], muito menos que um escravo[b] governe sobre príncipes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tolo”. Em Provérbios, o termo descreve sobretudo uma condição moral, e não apenas pouca inteligência.
    reason: lexical_alternative
  - marker: b
    text: Ou “servo”. O termo hebraico pode abranger diferentes condições de serviço e sujeição; “escravo” ressalta a forte inversão social do provérbio.
    reason: lexical_alternative
  - marker: c
    text: Ou “nobres” ou “autoridades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֶה
  choice: convém
  rationale: Expressa de modo natural e conciso a ideia de algo apropriado ou adequado, preservando o juízo avaliativo do provérbio.
- source_word: כְסִיל
  choice: insensato
  rationale: Em Provérbios, designa uma categoria moral e espiritual, não apenas falta de inteligência; “insensato” comunica isso em português corrente e digno.
- source_word: תַּעֲנוּג
  choice: luxo
  rationale: Embora possa significar prazer ou deleite, neste contraste social aponta provavelmente para vida confortável, requintada ou indulgente; “luxo” preserva essa força contextual.
- source_word: אַף כִּי
  choice: muito menos
  rationale: Marca aqui uma progressão a fortiori para uma situação considerada ainda mais imprópria.
- source_word: עֶבֶד
  choice: escravo
  rationale: O termo abrange diferentes condições servis, mas a inversão acentuada de posição social é central ao provérbio; “escravo” preserva melhor essa força que “servo”.
- source_word: מְשֹׁל
  choice: governe
  rationale: Verbo natural em português para o exercício de autoridade sobre pessoas de alta posição.
- source_word: שָׂרִים
  choice: príncipes
  rationale: Preserva a referência a líderes ou dignitários de posição elevada e mantém com clareza o contraste social.
theological_decisions: []
