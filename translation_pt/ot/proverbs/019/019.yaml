  text: גרל חֵ֭מָה נֹ֣שֵׂא עֹ֑נֶשׁ כִּ֥י אִם תַּ֝צִּ֗יל וְ/ע֣וֹד תּוֹסִֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/019.yaml
  text: A hot-tempered man bears the penalty[a], for if you rescue him, you will only have to do it again.
translation:
  language: pt
  text: O homem de temperamento explosivo arca com a punição[a], pois, se você o livrar, terá de fazer isso outra vez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “quem é de grande ira carrega uma penalidade”; o hebraico é compacto e idiomático.
    reason: lexical_alternative
lexical_decisions:
- source_word: גרל חֵמָה
  choice: homem de temperamento explosivo
  rationale: A expressão hebraica compacta caracteriza uma pessoa pela intensidade da sua ira. Esta formulação preserva a referência pessoal masculina e comunica de modo natural a ideia de alguém propenso a acessos de raiva.
- source_word: נֹשֵׂא עֹנֶשׁ
  choice: arca com a punição
  rationale: O particípio נֹשֵׂא tem sentido proverbial e contínuo de levar ou suportar, enquanto עֹנֶשׁ designa punição ou penalidade. “Arca com” expressa com naturalidade que a pessoa sofre a sanção decorrente da sua conduta.
- source_word: כִּי אִם
  choice: pois, se
  rationale: Mantém tanto a ligação explicativa com a primeira oração quanto a condição introduzida na segunda.
- source_word: תַּצִּיל
  choice: você o livrar
  rationale: O hifil de נצל significa livrar ou resgatar. O objeto masculino, implícito no hebraico, é explicitado em português como referência ao homem irado.
- source_word: וְעוֹד תּוֹסִף
  choice: terá de fazer isso outra vez
  rationale: 'A expressão é elíptica: literalmente comunica acrescentar ou repetir. A tradução explicita de forma natural que o interlocutor precisará voltar a livrá-lo, sem determinar além do contexto a natureza da intervenção.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Temperamento explosivo” comunica a imagem de calor e ira sem recorrer a vocabulário excessivamente erudito; “outra vez” preserva a ideia de repetição.
