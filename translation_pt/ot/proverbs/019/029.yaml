base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/029.yaml
  text: Judgments are prepared for scoffers[a], and beatings for the back of fools.
translation:
  language: pt
  text: Os juízos estão preparados para os zombadores[a], e os golpes para as costas dos tolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os juízos estão prontos para os zombadores, e os golpes para as costas dos tolos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכ֣וֹנוּ
  choice: estão preparados
  rationale: O nifal perfeito plural de כון indica que algo foi preparado, estabelecido ou posto de prontidão; a expressão comunica que os juízos já estão reservados para seus destinatários.
- source_word: לַ/לֵּצִ֣ים
  choice: para os zombadores
  rationale: לֵצִים designa pessoas que zombam com arrogância e desprezo. “Zombadores” é natural em português e preserva a categoria moral recorrente em Provérbios.
- source_word: שְׁפָטִ֑ים
  choice: os juízos
  rationale: שְׁפָטִים pode indicar decisões judiciais e, neste paralelismo com golpes, juízos de caráter punitivo. “Juízos” mantém a amplitude lexical sem apagar o sentido penal dado pelo contexto.
- source_word: וּ֝/מַהֲלֻמ֗וֹת
  choice: e os golpes
  rationale: מַהֲלֻמוֹת refere-se a golpes ou pancadas. “Golpes” reproduz o plural e é claro, digno e direto no português moderno.
- source_word: לְ/גֵ֣ו
  choice: para as costas
  rationale: גֵּו é singular coletivo e pode significar costas, dorso ou corpo. No contexto de golpes, “costas” é a formulação idiomática em português, ainda que morfologicamente plural.
- source_word: כְּסִילִֽים
  choice: dos tolos
  rationale: כְּסִילִים é a categoria sapiencial dos moralmente insensatos e obstinados, não uma simples referência a pouca inteligência. “Tolos” preserva esse uso tradicional e contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva o paralelismo hebraico e o valor punitivo sugerido pelo contexto, sem reduzir שְׁפָטִים explicitamente a “castigos”.
