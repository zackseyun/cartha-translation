source:
  edition: WLC
  text: רַבּ֣וֹת מַחֲשָׁב֣וֹת בְּ/לֶב אִ֑ישׁ וַ/עֲצַ֥ת יְ֝הוָ֗ה הִ֣יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/021.yaml
  text: Many are the plans in a man's heart[a], but the counsel of Yahweh will stand.
translation:
  language: pt
  text: Muitos são os planos no coração do homem[a], mas o conselho de Yahweh permanecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pensamentos” ou “intenções”, em vez de “planos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Muitos são
  rationale: Preserva a ênfase inicial do predicativo hebraico e mantém um estilo proverbial natural em português.
- source_word: מַחֲשָׁבוֹת
  choice: planos
  rationale: Neste contexto sapiencial, o termo abrange pensamentos concebidos como intenções ou projetos; “planos” expressa melhor o contraste com o conselho divino.
- source_word: בְּלֶב אִישׁ
  choice: no coração do homem
  rationale: Mantém “coração” como centro interior do pensamento e da vontade na antropologia hebraica, e conserva o singular masculino representativo de אִישׁ.
- source_word: וַעֲצַת
  choice: mas o conselho de
  rationale: Embora o waw seja formalmente aditivo, a estrutura antitética pede “mas”; “conselho” preserva a ideia de propósito ou desígnio estabelecido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal e preserva sua referência pactual sem substituí-lo por um título.
- source_word: הִיא תָקוּם
  choice: permanecerá
  rationale: קום indica aqui que o conselho ficará firme, subsistirá ou prevalecerá. “Permanecerá” comunica essa eficácia duradoura de modo idiomático, sem acrescentar uma explicação causal.
theological_decisions:
- issue: Planejamento humano e propósito divino
  choice: O provérbio contrapõe os muitos planos humanos ao conselho de Yahweh, que permanece.
  alternative: Uma paráfrase determinista mais forte, como “somente o plano de Deus acontece”.
  rationale: O hebraico afirma a firmeza e eficácia final do conselho de Yahweh, mas não explicita aqui uma doutrina completa sobre a causalidade divina; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Muitos são” conserva a ênfase proverbial do hebraico; “homem” mantém o singular masculino representativo do texto-fonte.
