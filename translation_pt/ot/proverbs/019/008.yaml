source:
  edition: WLC
  text: קֹֽנֶה לֵּ֭ב אֹהֵ֣ב נַפְשׁ֑/וֹ שֹׁמֵ֥ר תְּ֝בוּנָ֗ה לִ/מְצֹא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/008.yaml
  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
translation:
  language: pt
  text: Quem adquire discernimento[a] ama a própria vida[b]; quem guarda o entendimento encontrará o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “adquire coração”. Na literatura sapiencial hebraica, “coração” muitas vezes se refere à mente ou à capacidade de discernir.
    reason: lexical_alternative
  - marker: b
    text: Ou “ama a si mesmo” ou “ama o próprio ser”. O substantivo hebraico pode designar a pessoa ou a vida, e não apenas a alma em sentido estrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֶה לֵב
  choice: adquire discernimento
  rationale: A expressão significa literalmente “adquire coração”, mas, na literatura sapiencial hebraica, “coração” frequentemente designa a capacidade de pensar e discernir. “Adquire discernimento” comunica esse sentido em português natural sem perder a ideia de obtenção deliberada.
- source_word: אֹהֵב נַפְשׁוֹ
  choice: ama a própria vida
  rationale: נֶפֶשׁ pode indicar a pessoa, o próprio ser ou a vida, e não apenas “alma” em sentido estreito. “Ama a própria vida” preserva a linguagem de interesse pelo próprio bem-estar.
- source_word: שֹׁמֵר תְּבוּנָה
  choice: guarda o entendimento
  rationale: שׁמר expressa conservar com cuidado ou proteger; “guarda” mantém essa força. תְּבוּנָה é um termo sapiencial para entendimento, discernimento ou perspicácia.
- source_word: לִמְצֹא טוֹב
  choice: encontrará o bem
  rationale: A construção pode indicar o resultado de guardar o entendimento. O futuro em português expressa naturalmente essa consequência, enquanto “o bem” preserva a amplitude de טוֹב.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação conserva o paralelismo conciso do provérbio e usa termos comuns da tradição sapiencial sem tornar “coração” literalmente no texto principal, onde poderia ser entendido apenas como sede das emoções.
