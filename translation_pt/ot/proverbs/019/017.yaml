  text: מַלְוֵ֣ה יְ֭הוָה ח֣וֹנֵֽן דָּ֑ל וּ֝/גְמֻל֗/וֹ יְשַׁלֶּם לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/017.yaml
  text: Whoever is gracious to the poor lends to Yahweh[a], and he will repay him for his deed.
translation:
  language: pt
  text: Quem é generoso com o pobre empresta a Yahweh, e ele lhe retribuirá pelo que fez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְוֵה
  choice: empresta
  rationale: Preserva a metáfora explícita de empréstimo expressa pelo particípio hifil de לוה, sem reduzi-la a uma ideia genérica de dar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: חֹנֵן
  choice: favorece
  rationale: Expressa o ato de mostrar favor ou graça e soa natural em português neste contexto de auxílio ao pobre.
- source_word: דָּל
  choice: o pobre
  rationale: Neste provérbio, o termo denota naturalmente a pessoa pobre, necessitada ou socialmente desfavorecida.
- source_word: וּגְמֻלוֹ
  choice: o que fez
  rationale: Comunica de modo idiomático o ato ou benefício realizado, evitando em português a repetição pouco natural de 'retribuirá sua retribuição'.
- source_word: יְשַׁלֶּם
  choice: retribuirá
  rationale: O piel de שלם indica pagar de volta ou recompensar; 'retribuirá' mantém a reciprocidade ligada à metáfora do empréstimo.
- source_word: לוֹ
  choice: lhe
  rationale: Representa naturalmente em português o objeto indireto hebraico 'a ele', cujo referente é quem favorece o pobre.
theological_decisions:
- issue: Relação metafórica entre a generosidade para com o pobre e Deus
  choice: A bondade demonstrada ao pobre é descrita como um empréstimo feito ao próprio Yahweh, que retribuirá ao benfeitor.
  alternative: Parafrasear apenas que Deus vê e recompensa a generosidade.
  rationale: O hebraico apresenta explicitamente Yahweh como aquele a quem se empresta. A metáfora deve ser mantida sem acrescentar explicações doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção proverbial foi mantida concisa; 'favorece' preserva a noção de graça/favor sem soar excessivamente técnica.
