  naturalness: A redação principal é clara, moderna e apropriada ao registro proverbial. “Causa vergonha e desonra” é uma compressão portuguesa natural dos dois particípios finais. Na nota, “faz a mãe fugir” é mais idiomático e direto do que “põe a mãe em fuga”.
