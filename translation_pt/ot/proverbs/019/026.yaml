  text: He who devastates his father and drives away his mother is a son who brings shame and reproach[a].
translation:
  language: pt
  text: Quem arruína o pai e expulsa a mãe é um filho que causa vergonha e desonra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem despoja o pai e faz a mãe fugir é um filho que causa vergonha e desonra.”'
    reason: Alternativas lexicais que refletem mais literalmente os sentidos possíveis de מְשַׁדֶּד e יַבְרִיחַ.
lexical_decisions:
- source_word: מְשַׁדֶּד
  choice: arruína
  rationale: O particípio de שׁדד pode indicar devastar, despojar ou arruinar. “Arruína” comunica maus-tratos destrutivos graves sem restringir o sentido ao roubo.
- source_word: אָב
  choice: o pai
  rationale: Tradução direta; a relação filial expressa por “um filho” torna natural entender que se trata do próprio pai.
- source_word: יַבְרִיחַ
  choice: expulsa
  rationale: O hifil de ברח indica fazer fugir ou mandar embora. “Expulsa” preserva a força causativa em português natural.
- source_word: אֵם
  choice: a mãe
  rationale: Tradução direta, em paralelismo com “o pai”; o contexto indica a mãe do filho descrito.
- source_word: בֵּן
  choice: um filho
  rationale: O substantivo caracteriza, de modo predicativo, a pessoa descrita e mantém a formulação proverbial.
- source_word: מֵבִישׁ
  choice: que causa vergonha
  rationale: O particípio causativo de בוש descreve alguém que provoca vergonha; a oração relativa preserva seu valor ativo.
- source_word: וּמַחְפִּיר
  choice: e desonra
  rationale: O particípio paralelo intensifica a ideia de causar opróbrio ou humilhação. A coordenação nominal é idiomática, embora a nota preserve uma representação participial mais explícita.
