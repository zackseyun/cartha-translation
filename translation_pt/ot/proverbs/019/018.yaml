  text: יַסֵּ֣ר בִּ֭נְ/ךָ כִּי יֵ֣שׁ תִּקְוָ֑ה וְ/אֶל הֲ֝מִית֗/וֹ אַל תִּשָּׂ֥א נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/018.yaml
  text: Discipline your son[a], for there is hope[b]; do not set your heart on putting him to death.
translation:
  language: pt
  text: Discipline o seu filho, pois há esperança[a]; não tenha a intenção de matá-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto há esperança”. A expressão hebraica pode indicar a causa (“pois há esperança”) ou o tempo oportuno (“enquanto há esperança”).'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não eleve sua alma para matá-lo”. Trata-se de uma expressão hebraica que indica orientar o desejo ou a determinação para um fim; aqui, para a morte do filho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: Discipline
  rationale: O imperativo intensivo de יסר indica correção disciplinar intencional. “Discipline” é natural no português atual e mantém o propósito formativo, sem reduzir o sentido a uma simples repreensão.
- source_word: בִּנְךָ
  choice: seu filho
  rationale: O hebraico emprega especificamente “filho”; a tradução conserva essa referência, em vez de ampliá-la para “criança”.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: pois há esperança
  rationale: כִּי é entendido em sentido causal, apresentando a esperança como motivo para disciplinar. A possível leitura temporal é preservada em nota.
- source_word: וְאֶל הֲמִיתוֹ
  choice: em matá-lo
  rationale: O infinitivo causativo de מות significa causar a morte dele. “Matá-lo” expressa isso com clareza e sem eufemismo.
- source_word: אַל תִּשָּׂא נַפְשֶׁךָ
  choice: não ponha o coração
  rationale: A expressão hebraica, literalmente “não eleve sua alma”, descreve orientar o desejo ou a determinação para certo objetivo. “Não ponha o coração” conserva a imagem interior em português natural.
theological_decisions:
- issue: Sentido da advertência no segundo membro do versículo
  choice: A disciplina deve visar à correção esperançosa, não a uma severidade deliberadamente mortal.
  alternative: Não deixe de discipliná-lo e assim se torne responsável pela morte dele.
  rationale: A sintaxe hebraica liga diretamente a proibição ao ato de dirigir o desejo para causar a morte do filho. A tradução evita inverter a advertência ou transformá-la numa exortação implícita a aplicar castigo mais severo.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. A construção mantém o paralelismo entre disciplina esperançosa e intenção destrutiva, sem suavizar a linguagem forte do hebraico.
