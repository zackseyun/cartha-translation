source:
  edition: WLC
  text: בְּ֭נִ/י אַל יָלֻ֣זוּ מֵ/עֵינֶ֑י/ךָ נְצֹ֥ר תֻּ֝שִׁיָּ֗ה וּ/מְזִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/021.yaml
  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
translation:
  language: pt
  text: Meu filho, não deixe que se afastem dos seus olhos[a]; guarde a sabedoria sólida[b] e a prudência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não deixe que saiam da sua vista”. O sujeito plural não expresso retoma os ensinamentos ou as qualidades do contexto próximo.
    reason: lexical_alternative
  - marker: b
    text: “Sabedoria sólida” também pode ser traduzida como “bom senso”, “juízo seguro” ou “capacidade prática”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém o vocativo masculino singular do quadro discursivo de Provérbios, em que um pai ou mestre se dirige a um filho.
- source_word: אַל יָלֻזוּ
  choice: não deixe que se afastem
  rationale: Expressa naturalmente a proibição com o verbo no plural. O sujeito permanece implícito, como no hebraico, e remete aos ensinamentos ou às qualidades do contexto.
- source_word: מֵעֵינֶיךָ
  choice: dos seus olhos
  rationale: Preserva a imagem hebraica de manter algo continuamente diante dos olhos, sem substituir a expressão por uma explicação.
- source_word: נְצֹר
  choice: guarde
  rationale: Comunica preservação atenta e vigilante, adequada ao imperativo hebraico.
- source_word: תֻּשִׁיָּה
  choice: sabedoria sólida
  rationale: Conserva a combinação de sabedoria confiável, juízo sensato e eficácia prática própria do termo no contexto sapiencial.
- source_word: וּמְזִמָּה
  choice: e a prudência
  rationale: O contexto positivo e a associação com תֻּשִׁיָּה favorecem o sentido de reflexão prudente, e não o sentido negativo de trama ou maquinação.
theological_decisions:
- issue: Forma de tratamento filial marcada por gênero
  choice: Meu filho
  alternative: Minha criança
  rationale: O hebraico traz um vocativo explicitamente masculino singular. A tradução mantém esse traço do cenário literário sem generalizá-lo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção conserva a imagem dos olhos e a referência plural implícita do hebraico, enquanto as notas registram as principais alternativas lexicais.
