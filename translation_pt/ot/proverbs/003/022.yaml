  text: and they will be life to your soul and grace to your neck[a][b].
translation:
  language: pt
  text: e serão vida para a sua alma[a] e graça para o seu pescoço[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para a sua vida», «para você» ou «para o seu ser interior». O termo hebraico נֶפֶשׁ tem uma amplitude de sentidos maior que a palavra portuguesa «alma».
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como «favor», «encanto» ou «beleza para o seu pescoço», ressaltando a imagem de um adorno que confere estima e atratividade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: e serão
  rationale: O imperfeito qal na 3ª pessoa do plural, ligado pela conjunção, retoma a sabedoria e a discrição do versículo anterior e expressa o resultado futuro.
- source_word: חַיִּים
  choice: vida
  rationale: Embora tenha forma plural em hebraico, o termo funciona frequentemente como substantivo abstrato coletivo e corresponde naturalmente ao singular «vida» em português.
- source_word: לְנַפְשֶׁךָ
  choice: para a sua alma
  rationale: Mantém a amplitude antropológica de נֶפֶשׁ, que pode indicar alma, vida, pessoa ou ser interior, sem reduzi-la apenas à vida física.
- source_word: וְחֵן
  choice: e graça
  rationale: חֵן abrange graça, favor, encanto e beleza. «Graça» preserva a concisão e a qualidade moral e estética sugerida pela imagem do pescoço adornado.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: para o seu pescoço
  rationale: O substantivo designa a região da garganta ou do pescoço; neste contexto proverbial, «pescoço» comunica naturalmente a imagem de algo usado como adorno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe compacta próxima do paralelismo hebraico. «Alma» e «graça» preservam a ambiguidade lexical do original, esclarecida pelas notas.
