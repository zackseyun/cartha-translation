source:
  edition: WLC
  text: אַל תֹּ֘אמַ֤ר ל/רעי/ך לֵ֣ךְ וָ֭/שׁוּב וּ/מָחָ֥ר אֶתֵּ֗ן וְ/יֵ֣שׁ אִתָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
translation:
  language: pt
  text: 'Não diga ao seu próximo: “Vá e volte; amanhã eu darei”, quando você já tem isso à sua disposição.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase final indica que a pessoa já dispõe do que pode dar e, portanto, não deve adiar a ajuda.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: próximo
  rationale: No contexto de Provérbios, designa alguém do convívio ou da proximidade social, não necessariamente um amigo íntimo. “Próximo” mantém a amplitude ética do termo melhor que “amigo” e evita restringi-lo a um vizinho residencial.
- source_word: לֵךְ
  choice: Vá
  rationale: Reproduz de modo direto e natural o imperativo hebraico, sem acrescentar a ideia mais forte de expulsão presente em “vá embora”.
- source_word: שׁוּב
  choice: volte
  rationale: É a forma corrente em português para a ordem de retornar ao lugar ou à pessoa que fala; “retorne” é uma alternativa mais formal.
- source_word: מָחָר
  choice: amanhã
  rationale: Equivalente temporal direto, sem necessidade de explicitação.
- source_word: אֶתֵּן
  choice: eu darei
  rationale: Mantém implícito, como no hebraico, o objeto daquilo que será dado. O pronome “eu” torna natural a promessa enfática no discurso direto.
- source_word: יֵשׁ אִתָּךְ
  choice: se você tem isso consigo
  rationale: Expressa a disponibilidade presente do recurso sem impor a imagem mais específica de tê-lo “na mão”. “Isso” torna compreensível em português a elipse do objeto presente no hebraico.
- source_word: אַל
  choice: Não
  rationale: É a forma comum e suficiente de exprimir a proibição hebraica, sem acrescentar uma ênfase como “nunca”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Próximo” preserva o alcance relacional e ético do hebraico; o discurso direto permanece conciso, e a elipse do objeto de “darei” é mantida.
