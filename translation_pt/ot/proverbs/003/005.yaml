  text: בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ וְ/אֶל בִּֽ֝ינָתְ/ךָ֗ אַל תִּשָּׁעֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/005.yaml
  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
translation:
  language: pt
  text: Confie em Yahweh de todo o seu coração e não se apoie[a] no seu próprio entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não dependa do seu próprio entendimento”. O verbo hebraico significa literalmente “apoiar-se” ou “sustentar-se” em algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַח
  choice: Confie
  rationale: O imperativo masculino singular de בטח pede uma ordem direta. “Confie” é natural e preserva a ideia de dependência pessoal.
- source_word: אֶל־יְהוָה
  choice: em Yahweh
  rationale: Com o verbo “confiar”, a preposição אֶל é vertida idiomaticamente por “em”. O nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio presente no hebraico.
- source_word: בְּכָל־לִבֶּךָ
  choice: de todo o seu coração
  rationale: A expressão comunica entrega integral da pessoa interior, incluindo pensamento e vontade. “De todo o seu coração” é clara, corrente e mantém a imagem hebraica.
- source_word: בִּינָתְךָ
  choice: seu próprio entendimento
  rationale: בינה denota entendimento, discernimento ou percepção. “Seu próprio” torna natural em português o possessivo e ressalta o contraste com a confiança em Yahweh sem acrescentar uma ideia estranha ao texto.
- source_word: אַל־תִּשָּׁעֵן
  choice: não se apoie
  rationale: אַל com a forma verbal seguinte expressa proibição. O nifal de שען descreve apoiar-se ou sustentar-se em algo; “não se apoie” conserva essa metáfora.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Relação entre confiar em Yahweh e o entendimento humano
  choice: Manter a ordem e o contraste do hebraico sem explicar além do texto
  alternative: Parafrasear como rejeição absoluta da razão humana
  rationale: O provérbio proíbe fazer do próprio entendimento o apoio decisivo; não declara explicitamente que todo uso do entendimento seja inválido. A tradução preserva essa tensão sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo conciso e a metáfora concreta do hebraico.
