base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/003.yaml
  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
translation:
  language: pt
  text: Que o amor leal e a fidelidade não abandonem você[a]; amarre-os ao redor do seu pescoço; escreva-os na tábua do seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a misericórdia e a verdade”. O par hebraico frequentemente expressa amor leal e confiabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa a bondade amorosa marcada por lealdade e compromisso; é mais preciso aqui do que apenas “bondade” ou “misericórdia”.
- source_word: אֱמֶת
  choice: fidelidade
  rationale: Em combinação com חֶסֶד, indica sobretudo constância e confiabilidade, embora “verdade” continue sendo uma alternativa possível.
- source_word: אַל יַעַזְבֻךָ
  choice: não o abandonem
  rationale: Preserva as duas qualidades personificadas como sujeito e comunica naturalmente a força exortativa da construção hebraica.
- source_word: קָשְׁרֵם
  choice: amarre-os
  rationale: Mantém a imagem concreta de prender intencionalmente essas qualidades a si.
- source_word: גַּרְגְּרוֹתֶיךָ
  choice: ao redor do pescoço
  rationale: É a expressão portuguesa natural para a imagem ornamental ou mnemônica associada à região do pescoço.
- source_word: כָּתְבֵם
  choice: escreva-os
  rationale: Conserva a metáfora da inscrição deliberada e da interiorização.
- source_word: לוּחַ לִבֶּךָ
  choice: na tábua do coração
  rationale: Retém a imagem concreta da tábua como superfície de escrita e do coração como centro interior da pessoa.
theological_decisions:
- issue: Tradução do par חֶסֶד וֶאֱמֶת
  choice: amor leal e fidelidade
  alternative: misericórdia e verdade
  rationale: O par hebraico ressalta lealdade relacional e confiabilidade. A opção escolhida comunica essas dimensões no português atual sem impor uma interpretação doutrinária mais estreita; a nota preserva a tradução tradicional possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular genérico foi mantido por meio de “o” e das formas verbais de terceira pessoa; as metáforas do pescoço e da tábua do coração foram preservadas.
