lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a força condicional ou circunstancial básica da partícula hebraica, sem excluir a ideia de uma situação geral.
- source_word: תִּשְׁכַּב
  choice: você se deitar
  rationale: Expressa naturalmente o ato de deitar-se para dormir e mantém proximidade com o hebraico.
- source_word: לֹא תִפְחָד
  choice: não terá medo
  rationale: Transmite a garantia resultante expressa pelo imperfeito negado, sem transformá-la em ordem.
- source_word: וְשָׁכַבְתָּ
  choice: quando se deitar
  rationale: Representa com naturalidade a continuação temporal ou resultativa e conserva o paralelismo da repetição.
- source_word: וְעָרְבָה
  choice: será agradável
  rationale: O verbo descreve aquilo que é agradável ou doce; aplicado ao sono, “agradável” é claro e corrente.
- source_word: שְׁנָתֶךָ
  choice: seu sono
  rationale: Equivalente direto, claro e moderno para o estado ou a experiência de dormir.
