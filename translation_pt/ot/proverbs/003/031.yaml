  yaml_path: translation/ot/proverbs/003/031.yaml
  text: Do not envy a violent man[a], and do not choose any of his ways.
translation:
  language: pt
  text: Não tenha inveja de um homem violento[a] e não escolha nenhum dos seus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não tenha ciúmes de um homem violento». O verbo hebraico pode expressar inveja ou ciúme neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Não tenha inveja
  rationale: אַל com a forma verbal seguinte expressa proibição. «Não tenha inveja» é natural em português e preserva o sentido contextual de קנא, sem eliminar a possibilidade lexical indicada na nota.
- source_word: בְּאִישׁ חָמָס
  choice: do homem violento
  rationale: אִישׁ designa aqui um homem representativo, e חָמָס caracteriza-o como violento, isto é, marcado por violência ou injustiça brutal.
- source_word: וְאַל תִּבְחַר
  choice: e não escolha
  rationale: A conjunção mantém o paralelismo entre as duas proibições, enquanto בחר tem o sentido direto de escolher ou adotar.
- source_word: בְּכָל דְּרָכָיו
  choice: nenhum dos seus caminhos
  rationale: Sob proibição, a expressão totalizante comunica que não se deve escolher sequer um dos caminhos dele. «Caminhos» preserva a metáfora sapiencial para modos de agir ou de viver.
