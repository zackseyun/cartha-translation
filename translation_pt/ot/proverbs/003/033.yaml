id: PRO.3.33
reference: Proverbs 3:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מְאֵרַ֣ת יְ֭הוָה בְּ/בֵ֣ית רָשָׁ֑ע וּ/נְוֵ֖ה צַדִּיקִ֣ים יְבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
translation:
  language: pt
  text: A maldição de Yahweh está sobre a casa do perverso[a], mas ele abençoa a morada dos justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na casa do perverso”; a preposição hebraica admite essa tradução mais literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  choice: maldição
  rationale: O substantivo indica uma maldição ou condição amaldiçoada; “maldição” é a forma direta e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּבֵית
  choice: está sobre a casa
  rationale: Embora בְּ possa ser traduzida literalmente por “em”, com “maldição” a expressão “está sobre” comunica naturalmente que ela recai sobre a casa ou família.
- source_word: רָשָׁע
  choice: do perverso
  rationale: O singular hebraico tem valor genérico no provérbio; “o perverso” preserva tanto o singular representativo quanto a categoria moral.
- source_word: וּנְוֵה
  choice: mas ... a morada
  rationale: נָוֶה designa morada, habitação ou lar. A conjunção foi vertida como adversativa por causa do contraste entre as duas orações.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O adjetivo plural substantivado designa as pessoas justas; “os justos” é idiomático e mantém o plural do hebraico.
- source_word: יְבָרֵךְ
  choice: ele abençoa
  rationale: O imperfeito expressa aqui uma verdade geral, por isso o presente proverbial é mais adequado do que um futuro estrito.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Singular genérico רָשָׁע
  choice: o perverso
  alternative: os perversos; o homem perverso
  rationale: O singular representa genericamente uma classe moral. A tradução mantém esse valor sem acrescentar “homem”, que não precisa ser explicitado em português.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Morada” conserva a imagem concreta e o leve paralelismo com “casa”, sem soar excessivamente técnico.
