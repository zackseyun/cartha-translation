  text: Then you will walk securely on your way[a], and your foot will not stumble.
translation:
  language: pt
  text: Então você caminhará em segurança pelo seu caminho[a], e seu pé não tropeçará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com segurança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca o resultado da instrução anterior e preserva de modo conciso a sequência do hebraico.
- source_word: תֵּלֵךְ
  choice: você seguirá
  rationale: הלך significa ir ou andar. Com “pelo seu caminho”, “seguirá” soa natural em português e mantém a imagem de avançar por uma trajetória.
- source_word: לָבֶטַח
  choice: seguro
  rationale: Expressa segurança objetiva, não apenas confiança subjetiva, e funciona naturalmente como predicativo adverbial em português.
- source_word: דַּרְכֶּךָ
  choice: pelo seu caminho
  rationale: דֶּרֶךְ pode designar caminho, estrada ou modo de vida; a formulação preserva tanto a imagem concreta quanto sua ressonância metafórica em Provérbios.
- source_word: וְרַגְלְךָ
  choice: e seu pé
  rationale: Mantém o singular do hebraico e a imagem corporal concreta.
- source_word: לֹא תִגּוֹף
  choice: não tropeçará
  rationale: Neste contexto, נגף descreve o pé chocando-se contra algo ou a pessoa tropeçando; “não tropeçará” é claro, idiomático e coerente com a imagem do caminhar seguro.
