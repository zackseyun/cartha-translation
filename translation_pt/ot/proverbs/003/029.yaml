  yaml_path: translation/ot/proverbs/003/029.yaml
  text: Do not devise harm against your neighbor while he dwells securely with you[a].
translation:
  language: pt
  text: Não planeje o mal contra o seu próximo enquanto ele vive em segurança com você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não trame o mal contra o seu próximo enquanto ele mora confiante ao seu lado.”'
    reason: Alternativa lexical que explicita as possíveis nuances de trama deliberada, confiança e proximidade.
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  choice: planeje
  rationale: Neste uso idiomático, חרשׁ descreve conceber ou tramar algo, não o sentido literal de “arar”. “Planeje” comunica de modo claro a intenção deliberada.
- source_word: עַל
  choice: contra
  rationale: Com חרשׁ e רָעָה, a preposição indica que a ação maliciosa se dirige contra alguém.
- source_word: רֵעֲךָ
  choice: o seu próximo
  rationale: רֵעַ pode designar próximo, companheiro ou amigo. “Próximo” preserva aqui o alcance social e ético sem pressupor amizade íntima.
- source_word: רָעָה
  choice: o mal
  rationale: רָעָה pode significar mal, dano ou desgraça. “O mal” conserva a amplitude do termo hebraico, abrangendo tanto a intenção perversa quanto o dano pretendido.
- source_word: יוֹשֵׁב
  choice: vive
  rationale: O particípio de ישׁב indica permanência ou residência contínua. “Vive” é natural no português atual e mantém esse sentido.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: בֶּטַח expressa segurança e pode também sugerir confiança despreocupada. “Em segurança” representa diretamente o sentido principal sem eliminar a nuance contextual de confiança.
- source_word: אִתָּךְ
  choice: com você
  rationale: A expressão indica convivência ou proximidade. “Com você” reproduz sua formulação ampla sem restringi-la apenas à proximidade espacial.
