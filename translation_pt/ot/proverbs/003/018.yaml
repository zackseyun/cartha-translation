  naturalness: “Ela é árvore de vida” é uma construção proverbial aceitável e idiomática em registro bíblico moderno. “Os que a seguram firmemente” é claro para leitores brasileiros e internacionais e torna o paralelismo mais natural do que “os que a sustentam”.
  terminology: “Árvore de vida”, “sabedoria” e “abençoados” são apropriados ao vocabulário sapiencial. Mantém-se a personificação feminina sem convertê-la em afirmação teológica adicional.
