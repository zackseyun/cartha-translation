  text: עֵץ חַיִּ֣ים הִ֭יא לַ/מַּחֲזִיקִ֣ים בָּ֑/הּ וְֽ/תֹמְכֶ֥י/הָ מְאֻשָּֽׁר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/018.yaml
  text: She is a tree of life to those who take hold of her[b][a], and those who hold her fast are blessed.
translation:
  language: pt
  text: Ela[b] é árvore de vida para os que se apegam a ela, e os que a seguram firmemente[a] são abençoados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que a sustentam” ou “os que a apoiam”. O verbo hebraico pode significar “sustentar”, “apoiar” ou “segurar firmemente”.'
    reason: lexical_alternative
  - marker: b
    text: Os pronomes femininos se referem à sabedoria personificada no contexto.
    reason: cultural_note
lexical_decisions:
- source_word: עֵץ חַיִּים
  choice: árvore de vida
  rationale: Preserva a metáfora hebraica sem identificá-la necessariamente como a árvore única do Éden; em português, a ausência de artigo após o verbo é natural e mantém a expressão indefinida.
- source_word: הִיא
  choice: Ela é
  rationale: O pronome feminino retoma a sabedoria personificada no contexto e conserva esse recurso literário.
- source_word: לַמַּחֲזִיקִים בָּהּ
  choice: para os que se apegam a ela
  rationale: Comunica a ideia concreta de agarrar-se firmemente à sabedoria em português corrente, sem a dureza que teria 'apoderar-se dela'.
- source_word: וְתֹמְכֶיהָ
  choice: e os que a sustentam
  rationale: Mantém o sentido próprio de תמך, 'sustentar, apoiar, segurar firmemente', e preserva a ambiguidade lexical em vez de reduzi-la apenas à ideia de retenção.
- source_word: מְאֻשָּׁר
  choice: são abençoados
  rationale: Expressa a condição favorável e digna de inveja própria da linguagem sapiencial; evita tanto a subjetividade de 'felizes' quanto a ideia de acaso associada a 'afortunados'.
theological_decisions:
- issue: Personificação da sabedoria
  choice: 'Manter a linguagem pessoal feminina: “Ela... ela”'
  alternative: Empregar linguagem impessoal para tratar a sabedoria como conceito abstrato
  rationale: As formas hebraicas são femininas e retomam a sabedoria personificada no contexto. A tradução conserva o recurso literário sem acrescentar uma identificação teológica não explicitada no versículo.
- issue: Possível alusão à árvore da vida do Éden
  choice: 'Traduzir sem artigo definido: “árvore de vida”'
  alternative: Traduzir “a árvore da vida”, sugerindo identificação direta com a árvore edênica
  rationale: O hebraico apresenta uma construção genitiva sem artigo que não exige referência à árvore única de Gênesis. A formulação escolhida preserva a imagem e deixa aberta a possibilidade de eco intertextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Apegam-se” expressa vínculo firme de modo natural; “sustentam” conserva a amplitude do segundo verbo hebraico. Os marcadores foram colocados ao fim do versículo para não interromper o paralelismo, e ambos aparecem no texto principal.
