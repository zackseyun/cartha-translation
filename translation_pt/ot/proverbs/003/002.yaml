  yaml_path: translation/ot/proverbs/003/002.yaml
  text: for they will add to you length of days and years of life and peace[a].
translation:
  language: pt
  text: pois eles acrescentarão a você muitos dias, anos de vida e paz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bem-estar” ou “plenitude”. A palavra hebraica shalom descreve uma condição completa de prosperidade e harmonia, não apenas a ausência de conflito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a exortação do versículo anterior e mantém de modo natural a ligação argumentativa.
- source_word: אֹרֶךְ יָמִים
  choice: muitos dias
  rationale: Expressa em português corrente o idiomatismo hebraico que indica longevidade, sem sugerir literalmente dias de maior duração.
- source_word: וּשְׁנוֹת חַיִּים
  choice: anos de vida
  rationale: Preserva o paralelismo poético com “muitos dias” e traduz diretamente a relação construta.
- source_word: וְשָׁלוֹם
  choice: e paz
  rationale: “Paz” é a tradução tradicional e concisa de shalom; uma nota conserva seu campo semântico mais amplo de bem-estar e plenitude.
- source_word: יוֹסִיפוּ
  choice: acrescentarão
  rationale: Representa diretamente o hifil de יסף e conserva a imagem de algo acrescentado à pessoa.
- source_word: לָךְ
  choice: a você
  rationale: Traduz o objeto indireto marcado por ל em linguagem amplamente compreensível no português moderno.
