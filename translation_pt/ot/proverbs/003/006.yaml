source:
  edition: WLC
  text: בְּ/כָל דְּרָכֶ֥י/ךָ דָעֵ֑/הוּ וְ֝/ה֗וּא יְיַשֵּׁ֥ר אֹֽרְחֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/006.yaml
  text: In all your ways acknowledge him[a], and he will make your paths straight.
translation:
  language: pt
  text: Em todos os seus caminhos, reconheça-o, e ele endireitará as suas veredas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dirigirá as suas veredas”. O hebraico diz mais literalmente “endireitará as suas veredas”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: בְּכָל
  choice: Em todos
  rationale: 'Expressa de modo natural a abrangência total da construção hebraica: em todo o âmbito da conduta da pessoa.'
- source_word: דְּרָכֶיךָ
  choice: os seus caminhos
  rationale: Preserva a amplitude figurada de דֶּרֶךְ como modo de viver e mantém distinção em relação a אֹרְחוֹתֶיךָ no fim do versículo.
- source_word: דָעֵהוּ
  choice: reconheça-o
  rationale: 'O imperativo de יָדַע, com Deus como objeto, indica mais que conhecimento intelectual: implica reconhecê-lo e levá-lo em conta na própria conduta. A formulação é concisa e natural em português.'
- source_word: וְהוּא
  choice: e ele
  rationale: Mantém a conjunção e o pronome explícito, destacando Deus como aquele que realiza a ação prometida.
- source_word: יְיַשֵּׁר
  choice: endireitará
  rationale: O piel de יָשַׁר comunica tornar reto ou aplanar. “Endireitará” preserva a imagem concreta sem reduzi-la apenas à ideia de dar orientação.
- source_word: אֹרְחֹתֶיךָ
  choice: as suas veredas
  rationale: “Veredas” conserva a metáfora de caminho ou trilha e distingue este substantivo de דְּרָכֶיךָ, traduzido como “caminhos”.
theological_decisions:
- issue: Natureza da ação divina prometida
  choice: ele endireitará as suas veredas
  alternative: ele dirigirá as suas veredas
  rationale: O hebraico retrata Deus tornando o percurso reto, não apenas oferecendo indicações de direção. A tradução principal preserva essa imagem, enquanto a nota registra a interpretação tradicional possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase preserva o destaque inicial dado à totalidade dos caminhos, e “veredas” mantém o paralelismo sem apagar a distinção lexical do hebraico.
