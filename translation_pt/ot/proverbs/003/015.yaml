id: PRO.3.15
reference: Proverbs 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְקָ֣רָה הִ֭יא מ/פניים וְ/כָל חֲ֝פָצֶ֗י/ךָ לֹ֣א יִֽשְׁווּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/015.yaml
  text: She is more precious than jewels[a], and none of your delights can compare with her.
translation:
  language: pt
  text: Ela é mais preciosa do que joias[a], e nada do que você deseja pode se comparar a ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rubis”; o termo hebraico provavelmente se refere, de modo mais geral, a pedras preciosas ou joias, e sua identificação exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקָרָה
  choice: mais preciosa
  rationale: O adjetivo expressa grande valor e, com a preposição comparativa מִן, pede naturalmente a forma comparativa em português.
- source_word: הִיא
  choice: ela
  rationale: O pronome feminino singular retoma a sabedoria personificada no contexto.
- source_word: מִפְּנִינִים
  choice: do que joias
  rationale: פְּנִינִים designa objetos ou pedras preciosas, mas sua identificação exata é incerta; “joias” preserva o sentido amplo sem especificação indevida.
- source_word: וְכָל חֲפָצֶיךָ
  choice: e nada do que você deseja
  rationale: Embora a construção seja literalmente “e todas as coisas desejadas por você”, junto da negação ela comunica que nenhuma delas se iguala à sabedoria. A formulação portuguesa mantém tanto o caráter desejável das coisas quanto o sentido distributivo negativo.
- source_word: לֹא יִשְׁווּ בָּהּ
  choice: pode se comparar a ela
  rationale: O verbo שוה indica igualar-se em valor; esta formulação é natural em português e expressa que nada alcança o valor da sabedoria.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com personificação feminina da sabedoria preservada. O singular genérico “você” traduz a segunda pessoa masculina singular sem acrescentar distinção denominacional ou interpretativa.
