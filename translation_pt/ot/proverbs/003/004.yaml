source:
  edition: WLC
  text: וּ/מְצָא חֵ֖ן וְ/שֵֽׂכֶל ט֑וֹב בְּ/עֵינֵ֖י אֱלֹהִ֣ים וְ/אָדָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
translation:
  language: pt
  text: Assim você encontrará favor e bom senso aos olhos de Deus e das pessoas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do ser humano”; o hebraico אָדָם representa aqui os seres humanos em contraste com Deus. Também se pode traduzir “dos homens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְצָא
  choice: Assim você encontrará
  rationale: No contexto das exortações anteriores, a forma com ו introduz naturalmente o resultado esperado. O futuro em português expressa com clareza essa consequência sem transformar o provérbio numa garantia mecânica.
- source_word: חֵן
  choice: favor
  rationale: חֵן indica favor, aceitação ou boa acolhida. “Favor” preserva a expressão sapiencial sem acrescentar a carga teológica que “graça” poderia sugerir.
- source_word: וְשֵׂכֶל טוֹב
  choice: e bom senso
  rationale: שֵׂכֶל pode designar entendimento, discernimento, prudência ou, segundo outra leitura contextual, boa reputação ou êxito. “Bom senso” é natural no português atual e mantém em primeiro plano a dimensão cognitiva e ética, sem eliminar a ambiguidade por meio de paráfrase extensa.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém a imagem idiomática hebraica de avaliação e estima, também natural em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto se refere ao Deus único; por isso, o singular com inicial maiúscula é adequado.
- source_word: וְאָדָם
  choice: e das pessoas
  rationale: אָדָם contrasta aqui a esfera humana com Deus e tem sentido coletivo, não especificamente masculino. “Das pessoas” comunica esse referente abrangente em português corrente.
theological_decisions:
- issue: Sentido representativo de אָדָם no contraste entre Deus e a humanidade
  choice: das pessoas
  alternative: do ser humano; dos homens
  rationale: O substantivo singular אָדָם representa os seres humanos em geral. A tradução inclusiva explicita o sentido referencial sem apagar o contraste entre a avaliação divina e a humana.
- issue: Nuance de שֵׂכֶל טוֹב
  choice: bom senso
  alternative: bom entendimento; boa reputação; bom êxito
  rationale: A expressão admite uma nuance de discernimento prudente e, neste contexto de favor “aos olhos” de outros, pode também apontar para boa consideração ou reputação. “Bom senso” preserva a leitura cognitivo-ética principal sem resolver dogmaticamente a amplitude lexical.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. A construção “aos olhos de” conserva a imagem hebraica; “assim” liga o versículo às exortações anteriores e apresenta seu resultado.
