  text: בְּ֭/דַעְתּ/וֹ תְּהוֹמ֣וֹת נִבְקָ֑עוּ וּ֝/שְׁחָקִ֗ים יִרְעֲפוּ טָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/020.yaml
  text: By his knowledge the depths were split open[b][a], and the clouds drip dew.
translation:
  language: pt
  text: Pelo seu conhecimento, as profundezas[a] se fenderam, e as nuvens[b] gotejam orvalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os abismos” ou “as águas profundas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַעְתּוֹ
  choice: Pelo seu conhecimento
  rationale: A preposição בְּ indica meio ou instrumento, e דַּעַת significa “conhecimento”. A formulação mantém o pronome, cujo referente é Deus no contexto imediato.
- source_word: תְּהוֹמוֹת
  choice: as profundezas
  rationale: O plural designa as águas profundas ou os abismos cósmicos. “As profundezas” é natural em português e conserva a amplitude poética da imagem.
- source_word: נִבְקָעוּ
  choice: se fenderam
  rationale: O nifal expressa aqui a abertura por ruptura. “Se fenderam” preserva a imagem vívida e não especifica além do hebraico o agente imediato ou o evento aludido.
- source_word: וּשְׁחָקִים
  choice: e as nuvens
  rationale: שְׁחָקִים pode indicar nuvens ou céus. A menção do gotejar do orvalho favorece “nuvens”, enquanto a alternativa é registrada em nota.
- source_word: יִרְעֲפוּ
  choice: gotejam
  rationale: O verbo descreve o cair ou destilar de gotas. “Gotejam” comunica a ação suave em linguagem atual e preserva o paralelismo poético.
- source_word: טָל
  choice: orvalho
  rationale: É o equivalente português direto e adequado de טָל neste contexto.
theological_decisions:
- issue: Imagem cósmica de criação e providência
  choice: Manter imagens das profundezas que se fendem e das nuvens que gotejam, sem definir se o foco é exclusivamente a criação inicial ou também a providência contínua.
  alternative: Explicitar que o versículo trata somente da criação do mundo ou somente dos fenômenos meteorológicos contínuos.
  rationale: Provérbios 3:19–20 apresenta o conhecimento divino como meio de ordenação do mundo. A linguagem poética comporta tanto uma evocação da criação quanto da ordem providencial, e a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Se fenderam” conserva a força da imagem hebraica; “gotejam orvalho” mantém a concisão e o paralelismo do verso.
