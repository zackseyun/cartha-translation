  text: אֹ֣רֶךְ יָ֭מִים בִּֽ/ימִינָ֑/הּ בִּ֝/שְׂמֹאולָ֗/הּ עֹ֣שֶׁר וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
translation:
  language: pt
  text: Na mão direita dela está a longevidade[a]; na esquerda, riquezas e honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “extensão de dias”; também pode ser traduzido por “vida longa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: longevidade
  rationale: Expressa naturalmente em português a ideia hebraica de “extensão de dias”, preservando o sentido de vida longa sem reproduzir um idiomatismo pouco usual.
- source_word: בִּימִינָהּ
  choice: na mão direita dela
  rationale: A preposição ב indica aqui aquilo que a Sabedoria personificada tem na mão; “dela” mantém explícita a referência feminina do sufixo.
- source_word: בִּשְׂמֹאולָהּ
  choice: na esquerda
  rationale: A elipse de “mão” é natural em português e conserva o paralelismo conciso com o primeiro hemistíquio.
- source_word: עֹשֶׁר
  choice: riquezas
  rationale: Equivalente corrente e poeticamente adequado para bens materiais, formando um par natural com “honra”.
- source_word: כָבוֹד
  choice: honra
  rationale: No contexto sapiencial, designa estima e posição honrosa; “honra” é mais apropriado aqui do que “glória”.
theological_decisions:
- issue: Referente dos sufixos femininos
  choice: Os sufixos referem-se à Sabedoria personificada no contexto imediato.
  alternative: Entendê-los como referência a um ser divino feminino.
  rationale: A forma feminina continua a personificação literária da Sabedoria em Provérbios; a tradução preserva essa figura sem acrescentar uma identificação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com concisão proverbial. “Longevidade” evita a expressão pouco idiomática “extensão de dias”, enquanto a nota registra a forma hebraica e a alternativa comum.
