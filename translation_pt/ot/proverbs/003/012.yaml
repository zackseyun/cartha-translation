  text: כִּ֤י אֶ֥ת אֲשֶׁ֣ר יֶאֱהַ֣ב יְהוָ֣ה יוֹכִ֑יחַ וּ֝/כְ/אָ֗ב אֶת בֵּ֥ן יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/012.yaml
  text: For Yahweh reproves the one he loves[b][a], as a father the son in whom he delights.
translation:
  language: pt
  text: Pois Yahweh repreende[a] aquele a quem ama, como um pai repreende o filho de quem se agrada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corrige”. O verbo hebraico denota repreensão ou correção; no contexto, essa ação faz parte da disciplina de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é conciso e omite o verbo na comparação: “e, como um pai, o filho de quem se agrada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e mantém com naturalidade o encadeamento argumentativo do provérbio.
- source_word: אֶת אֲשֶׁר יֶאֱהַב
  choice: aquele a quem ama
  rationale: Reproduz a construção relativa pessoal no singular e conserva de modo claro a ideia de amor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יוֹכִיחַ
  choice: repreende
  rationale: 'Expressa o sentido central do hifil de יכח: confrontar alguém com vistas à correção. O contexto mais amplo envolve disciplina, mas o verbo é mais específico.'
- source_word: וּכְאָב
  choice: como um pai
  rationale: Conserva a comparação explícita e a imagem parental masculina do hebraico; a conjunção é absorvida pela sintaxe natural em português.
- source_word: אֶת בֵּן
  choice: o filho
  rationale: Mantém o singular masculino representativo do texto hebraico sem acrescentar um possessivo ausente no original.
- source_word: יִרְצֶה
  choice: em quem se agrada
  rationale: Comunica a ideia de aprovação, favor e prazer afetivo de רצה neste contexto, formando uma expressão idiomática em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome da aliança. A transliteração preserva a distinção entre o nome próprio e títulos divinos.
- issue: Imagem parental marcada por gênero
  choice: como um pai ... o filho
  alternative: como quem corrige a criança
  rationale: O hebraico emprega explicitamente “pai” e “filho”; preservar essa imagem evita neutralizar um traço real do provérbio.
- issue: Natureza da ação divina
  choice: repreende
  alternative: corrige; disciplina
  rationale: A escolha mantém o valor lexical específico de יכח sem reduzir a ação à punição física nem antecipar toda a noção mais ampla de disciplina presente no contexto.
- issue: Elipse na comparação paterna
  choice: repetição de “repreende” na segunda oração
  alternative: como um pai, o filho em quem se agrada
  rationale: O segundo verbo está elíptico no hebraico. Repeti-lo torna a comparação inteligível em português sem alterar a relação sintática provável; a nota registra a concisão e a alternativa de sentido para רצה.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. “Repreende” conserva a precisão lexical sem soar excessivamente técnica; a repetição do verbo explicita a elipse hebraica.
