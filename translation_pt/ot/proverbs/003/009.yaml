  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּבֵּ֣ד אֶת יְ֭הוָה מֵ/הוֹנֶ֑/ךָ וּ֝/מֵ/רֵאשִׁ֗ית כָּל תְּבוּאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
translation:
  language: pt
  text: Honre Yahweh com os seus bens[a] e com as primícias de toda a sua produção[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos seus bens”; depois de “honre”, a preposição hebraica pode ser entendida como “com” ou “de”.
    reason: lexical_alternative
  - marker: b
    text: “Primícias” são a primeira e melhor porção da colheita, oferecida em honra a Deus.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: Honre
  rationale: O imperativo piel de כבד significa dar honra ou reconhecer o valor de alguém. “Honre” é direto, natural e preserva o caráter ético da exortação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵהוֹנֶךָ
  choice: com os seus bens
  rationale: הוֹן designa riqueza, recursos ou posses. “Bens” comunica de modo claro e abrangente os recursos materiais, e “com” expressa naturalmente o meio pelo qual Yahweh deve ser honrado.
- source_word: וּמֵרֵאשִׁית
  choice: e com as primícias
  rationale: רֵאשִׁית significa o começo ou a primeira parte; no contexto da produção agrícola, “primícias” é o equivalente consagrado e preciso.
- source_word: כָּל
  choice: toda
  rationale: Preserva o sentido abrangente de כָּל e concorda naturalmente com “produção”.
- source_word: תְּבוּאָתֶךָ
  choice: a sua produção
  rationale: תְּבוּאָה pode indicar produto, colheita ou rendimento agrícola. “Produção” mantém o sentido agrícola sem recorrer a uma expressão arcaica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O versículo traz diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de “primícias”
  choice: A primeira e melhor porção da produção
  alternative: Apenas a parte cronologicamente colhida primeiro
  rationale: No contexto israelita, as primícias eram a porção inicial separada em honra a Deus. A tradução mantém o termo cultural sem acrescentar ao corpo do texto uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Bens” evita tanto o tom excessivamente financeiro de “riqueza” quanto o caráter arcaico de “fazenda”; “primícias” é um termo bíblico ainda reconhecível e recebe explicação em nota.
