  text: אַשְׁרֵ֣י אָ֭דָם מָצָ֣א חָכְמָ֑ה וְ֝/אָדָ֗ם יָפִ֥יק תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
translation:
  language: pt
  text: Feliz o homem que encontra sabedoria[a], e o homem que alcança entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Feliz a pessoa que encontra sabedoria, e a pessoa que alcança entendimento”. O hebraico usa “homem” em sentido representativo.'
    reason: alternativa lexical e esclarecimento do alcance inclusivo
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula hebraica de bem-aventurança descreve uma condição invejável de felicidade e favor. “Feliz” é natural, digna e amplamente compreensível em português, sem sugerir necessariamente uma bênção verbal pronunciada.
- source_word: אָדָם
  choice: o homem
  rationale: O substantivo singular é empregado de modo representativo, referindo-se a qualquer ser humano. “O homem” preserva no texto principal a forma masculina genérica e o paralelismo do hebraico; a nota esclarece seu alcance inclusivo.
- source_word: מָצָא
  choice: encontra
  rationale: O perfeito hebraico funciona aqui em uma máxima proverbial; o presente gnômico “encontra” expressa naturalmente uma verdade geral.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente português consagrado e adequado para o termo central da literatura sapiencial.
- source_word: וְאָדָם
  choice: e o homem
  rationale: A repetição explícita conserva o paralelismo poético entre os dois membros do versículo.
- source_word: יָפִיק
  choice: alcança
  rationale: Neste paralelismo com “encontra”, o verbo comunica a obtenção bem-sucedida do entendimento. “Alcança” preserva a ideia de aquisição sem soar coloquial.
- source_word: תְּבוּנָה
  choice: entendimento
  rationale: Representa de modo natural o discernimento ou capacidade de compreender designados pelo termo hebraico e forma um par claro com “sabedoria”.
theological_decisions:
- issue: Masculino genérico na bem-aventurança sapiencial
  choice: Manter “o homem” no texto principal em sentido representativo
  alternative: “a pessoa” ou “quem”
  rationale: O hebraico repete אָדָם no singular e o usa representativamente. A tradução conserva essa forma e o paralelismo, enquanto a nota explicita que a afirmação se aplica a qualquer pessoa.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. A repetição de “o homem” preserva o paralelismo hebraico; “Feliz” evita uma formulação excessivamente eclesiástica e mantém o caráter de bem-aventurança.
