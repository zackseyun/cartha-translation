  text: אַל תִּ֭ירָא מִ/פַּ֣חַד פִּתְאֹ֑ם וּ/מִ/שֹּׁאַ֥ת רְ֝שָׁעִ֗ים כִּ֣י תָבֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/025.yaml
  text: Do not fear sudden terror[a], or the ruin of the wicked when it comes[b],
translation:
  language: pt
  text: Não tenha medo do terror repentino, nem da devastação dos perversos quando ela vier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “devastação dos perversos” pode indicar tanto a calamidade que atinge os perversos quanto a calamidade associada a eles; o hebraico não especifica plenamente essa relação. “Devastação” também pode ser traduzido por “ruína” ou “destruição”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: A partícula negativa אַל com o imperfeito de ירא expressa uma proibição. A formulação é natural em português e preserva a força direta do hebraico.
- source_word: מִפַּחַד פִּתְאֹם
  choice: do terror repentino
  rationale: Após um verbo de temor, מִן indica aquilo que causa medo. פַּחַד denota terror ou pavor, e פִּתְאֹם caracteriza sua irrupção súbita e inesperada.
- source_word: וּמִשֹּׁאַת
  choice: nem da devastação
  rationale: שֹׁאָה pode designar devastação, ruína ou destruição. “Devastação” comunica claramente uma calamidade destrutiva e mantém o paralelismo com “terror repentino”.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O plural substantivado designa pessoas perversas. A construção compacta “devastação dos perversos” preserva sem resolver a relação genitiva não especificada no hebraico.
- source_word: כִּי תָבֹא
  choice: quando ela vier
  rationale: כִּי tem valor temporal neste contexto, e o verbo feminino singular retoma שֹׁאָה. O pronome “ela” torna essa concordância clara e natural em português.
theological_decisions:
- issue: Relação entre a devastação e os perversos
  choice: devastação dos perversos
  alternative: devastação que cairá sobre os perversos; devastação causada pelos perversos
  rationale: O estado construto hebraico não determina se os perversos sofrem, causam ou estão de outro modo associados à calamidade. A tradução mantém essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição da ideia de medo foi evitada por meio da construção idiomática “ter medo de”, sem enfraquecer a proibição. A nota reúne a alternativa lexical e a ambiguidade sintática para não sobrecarregar um versículo curto.
