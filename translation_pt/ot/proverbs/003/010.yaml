  yaml_path: translation/ot/proverbs/003/010.yaml
  text: then your barns will be filled with abundance[a], and your vats will burst with new wine.
translation:
  language: pt
  text: então os seus celeiros ficarão cheios de fartura, e os seus lagares transbordarão[a] de vinho novo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico sugere literalmente romper ou irromper, ressaltando a abundância.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: ficarão cheios
  rationale: O nifal imperfeito de מלא expressa o resultado futuro de serem enchidos; “ficarão cheios” é natural em português e conserva esse valor resultativo.
- source_word: אֲסָמֶיךָ
  choice: os seus celeiros
  rationale: אֹסֶם designa um depósito de grãos ou produtos agrícolas. “Celeiros” preserva de modo claro e concreto a imagem rural.
- source_word: שָׂבָע
  choice: de fartura
  rationale: O substantivo comunica abundância, plenitude ou saciedade. “Fartura” se ajusta naturalmente a “cheios” e mantém a ideia de provisão abundante.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: תִּירוֹשׁ costuma indicar vinho novo ou o produto fresco da uva, distinguindo-se do termo mais geral para vinho.
- source_word: יְקָבֶיךָ
  choice: os seus lagares
  rationale: יֶקֶב designa o lagar ou tanque ligado à prensagem e coleta do sumo das uvas. “Lagares” é a designação portuguesa tradicional e conserva o cenário agrícola.
- source_word: יִפְרֹצוּ
  choice: transbordarão
  rationale: פרץ traz a imagem forte de romper ou irromper. No contexto de recipientes repletos de vinho novo, “transbordarão” comunica com naturalidade a abundância pretendida, enquanto a nota registra a força literal.
theological_decisions:
- issue: Natureza da prosperidade prometida
  choice: Manter a imagem concreta de abundância agrícola, com celeiros, lagares e produtos da terra.
  alternative: Generalizar a linguagem como uma bênção apenas espiritual ou abstrata.
  rationale: O hebraico apresenta uma cena material e agrícola. A tradução não deve decidir de antemão se a declaração é exaustiva, simbólica ou uma garantia mecânica e universal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Fartura” e “lagares” preservam a concretude poética e agrícola sem tornar a frase excessivamente técnica.
