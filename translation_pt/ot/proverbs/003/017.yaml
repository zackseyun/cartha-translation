  text: דְּרָכֶ֥י/הָ דַרְכֵי נֹ֑עַם וְֽ/כָל נְתִ֖יבוֹתֶ֣י/הָ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/017.yaml
  text: Her ways are ways of pleasantness[a], and all her paths are peace.
translation:
  language: pt
  text: 'Seus caminhos são caminhos agradáveis,

    e todas as suas veredas são paz.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bem-estar” ou “plenitude”. O termo hebraico shalom tem um sentido mais amplo do que a ausência de conflito.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ
  choice: seus caminhos
  rationale: דֶּרֶךְ pode indicar caminho, estrada ou modo de vida. “Seus caminhos” conserva a imagem concreta e o sentido figurado, com o sufixo feminino retomando a sabedoria no contexto.
- source_word: דַרְכֵי
  choice: caminhos
  rationale: 'A forma construta repete o substantivo: literalmente, “seus caminhos são caminhos de...”. A repetição foi mantida para preservar a ênfase e o paralelismo poético hebraico.'
- source_word: נֹעַם
  choice: agradáveis
  rationale: נֹעַם expressa agrado, deleite ou amenidade. A formulação adjetival “caminhos agradáveis” é natural em português e comunica o valor do substantivo abstrato hebraico sem restringi-lo ao prazer emocional.
- source_word: וְכָל
  choice: e todas
  rationale: Mantém a conjunção e a força abrangente de כָּל, com concordância com “veredas”.
- source_word: נְתִיבוֹתֶיהָ
  choice: suas veredas
  rationale: נְתִיבָה designa vereda, senda ou trilha e forma paralelo poético com דֶּרֶךְ. “Veredas” preserva essa distinção lexical e é corrente no registro bíblico português.
- source_word: שָׁלוֹם
  choice: paz
  rationale: שָׁלוֹם abrange paz, bem-estar, integridade e plenitude. “Paz” é a tradução principal mais concisa e estabelecida, enquanto a nota registra a amplitude semântica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se a repetição poética de “caminhos” e a distinção entre “caminhos” e “veredas”. O plural “são paz” é deliberadamente preservado como predicação poética enfática, em vez de ser suavizado para “conduzem à paz”.
