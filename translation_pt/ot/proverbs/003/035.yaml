  text: כָּ֭בוֹד חֲכָמִ֣ים יִנְחָ֑לוּ וּ֝/כְסִילִ֗ים מֵרִ֥ים קָלֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/035.yaml
  text: The wise will inherit honor, but fools lift up disgrace.
translation:
  language: pt
  text: 'Os sábios herdarão honra,

    mas os tolos exaltam a desonra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como “exaltam a desonra” é difícil. Também pode ser entendida como “ostentam a desonra”; alguns propõem “a desonra os exalta”, em sentido irônico.
    reason: Registra a dificuldade sintática e semântica de מֵרִים קָלוֹן sem resolver silenciosamente a ambiguidade.
lexical_decisions:
- source_word: כָּבוֹד
  choice: honra
  rationale: Expressa naturalmente o sentido de honra, dignidade ou reconhecimento no contraste sapiencial.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: Equivalente direto e corrente para os que vivem com sabedoria.
- source_word: יִנְחָלוּ
  choice: herdarão
  rationale: Preserva a metáfora hebraica de receber algo como herança ou porção duradoura.
- source_word: כְסִילִים
  choice: os tolos
  rationale: Termo sapiencial para pessoas moralmente insensatas, sem recorrer a linguagem excessivamente técnica.
- source_word: מֵרִים
  choice: exaltam
  rationale: Mantém o sentido básico de levantar ou elevar e preserva a formulação marcante do hebraico.
- source_word: קָלוֹן
  choice: desonra
  rationale: Forma um contraste claro com 'honra' e comunica vergonha pública ou ignomínia.
theological_decisions:
- issue: O sentido da expressão מֵרִים קָלוֹן
  choice: exaltam a desonra
  alternative: a desonra os exalta / recebem desonra
  rationale: A forma consonantal e a vocalização massorética favorecem 'fazem subir/levantam'; a tradução conserva essa imagem sem explicar de modo conclusivo se os tolos ostentam a desonra ou a fazem crescer. A ambiguidade interpretativa é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. 'Herdarão honra' conserva a metáfora do original; 'exaltam a desonra' mantém deliberadamente a imagem incomum e a tensão da segunda linha.
