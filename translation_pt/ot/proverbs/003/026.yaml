  text: כִּֽי יְ֭הוָה יִהְיֶ֣ה בְ/כִסְלֶ֑/ךָ וְ/שָׁמַ֖ר רַגְלְ/ךָ֣ מִ/לָּֽכֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
translation:
  language: pt
  text: Pois Yahweh será a sua confiança[a] e protegerá o seu pé de ser apanhado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estará ao seu lado”; a expressão hebraica admite uma compreensão mais literal, embora aqui provavelmente indique confiança ou segurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação e a promessa anteriores, preservando de modo conciso a ligação explicativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִהְיֶה
  choice: será
  rationale: O futuro simples corresponde naturalmente ao sentido de promessa no contexto.
- source_word: בְכִסְלֶךָ
  choice: a sua confiança
  rationale: כֶּסֶל pode designar literalmente o flanco ou lado, mas também confiança ou segurança. Neste contexto de proteção divina, a acepção figurada é natural, sem eliminar a alternativa literal indicada em nota.
- source_word: וְשָׁמַר
  choice: e não deixará
  rationale: Expressa idiomaticamente em português a ação protetora de guardar ou preservar, em combinação com a ideia seguinte de não ser apanhado.
- source_word: רַגְלְךָ
  choice: o seu pé
  rationale: Mantém o singular do hebraico e preserva a imagem concreta do caminhar ameaçado.
- source_word: מִלָּכֶד
  choice: seja apanhado
  rationale: Transmite a ideia de ser capturado ou preso sem acrescentar explicitamente uma armadilha que o texto hebraico apenas sugere pela imagem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal do Deus de Israel em vez de substituí-lo por um título.
- issue: Sentido de בְכִסְלֶךָ
  choice: Yahweh como a confiança do destinatário
  alternative: Yahweh ao lado do destinatário
  rationale: A leitura figurada se ajusta bem ao paralelismo com a proteção contra ser apanhado, enquanto a possibilidade espacial ou mais literal é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção “não deixará que” evita a formulação pouco idiomática “guardará o seu pé de ser apanhado”, sem perder a imagem hebraica nem explicitar uma armadilha.
