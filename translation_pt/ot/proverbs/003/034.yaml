  text: If it is to scoffers, he scoffs[c]; but to the humble[b] he gives favor[a].
translation:
  language: pt
  text: Certamente, ele zomba dos zombadores[a]; mas concede favor aos humildes[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete a mesma raiz em “zombadores” e “zomba”, criando um jogo de palavras. A partícula inicial também pode ser entendida com valor condicional: “Se é com os zombadores...”'
    reason: lexical_alternative
  - marker: b
    text: Ou “pobres”, “aflitos” ou “abatidos”; o termo hebraico pode indicar pessoas humildes ou rebaixadas por sua condição e suas circunstâncias.
    reason: lexical_alternative
  - marker: c
    text: Ou “graça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לַלֵּצִים הוּא יָלִיץ
  choice: Com os zombadores, ele zomba
  rationale: A formulação conserva a disposição enfática do hebraico e o jogo deliberado entre לֵצִים e יָלִיץ por meio de “zombadores” e “zomba”. אִם é incomum nesta construção e pode ter força condicional ou enfática; a tradução evita impor uma análise excessivamente específica.
- source_word: וְלַעֲנִיִּים
  choice: mas aos humildes
  rationale: עֲנִיִּים pode designar pobres, aflitos ou pessoas de condição humilde. No paralelismo antitético com os zombadores, “humildes” comunica bem a postura e a condição de rebaixamento, sem ocultar as outras possibilidades, registradas em nota.
- source_word: יִתֶּן
  choice: concede
  rationale: O imperfeito tem valor habitual ou proverbial. O presente português expressa essa ação característica; “concede” é natural com “favor” e preserva a ideia de dádiva.
- source_word: חֵן
  choice: favor
  rationale: חֵן significa favor, benevolência ou graça. “Favor” é claro no contexto sapiencial e evita carregar o termo com associações teológicas posteriores que não precisam ser especificadas aqui.
theological_decisions:
- issue: Referente de הוּא
  choice: Manter “ele”, deixando que o contexto identifique Deus como referente.
  alternative: Explicitar “Deus” ou “o SENHOR”.
  rationale: O texto hebraico emprega o pronome explícito הוּא, não o nome divino. Preservar o pronome evita acrescentar ao versículo uma designação ausente, sem impedir que o contexto estabeleça o referente.
- issue: Sentido de עֲנִיִּים
  choice: humildes
  alternative: pobres; aflitos; abatidos
  rationale: O contraste com os zombadores favorece aqui uma leitura ligada à humildade ou condição humilde. Como o termo também pode indicar pobreza ou aflição concreta, essa amplitude é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem marcada da primeira oração conserva a simetria retributiva e o jogo verbal do hebraico sem recorrer a uma formulação excessivamente arcaica.
