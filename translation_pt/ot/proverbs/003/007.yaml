id: PRO.3.7
reference: Proverbs 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תְּהִ֣י חָכָ֣ם בְּ/עֵינֶ֑י/ךָ יְרָ֥א אֶת יְ֝הוָ֗ה וְ/ס֣וּר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/007.yaml
  text: Do not be wise in your own eyes[c][b][a]; fear Yahweh and turn away from evil.
translation:
  language: pt
  text: Não seja sábio aos seus próprios olhos[a]; tema Yahweh[b] e afaste-se do mal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se torne sábio aos seus próprios olhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “reverencie Yahweh”. O verbo hebraico pode indicar temor reverente ou assombro respeitoso diante de Deus.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “desvie-se do mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Não seja
  rationale: A partícula negativa אַל com o imperfeito/jussivo de היה expressa uma proibição. “Não seja” reproduz com naturalidade a construção predicativa.
- source_word: חָכָם
  choice: sábio
  rationale: O adjetivo predicativo significa “sábio” e mantém a formulação concisa do hebraico.
- source_word: בְּעֵינֶיךָ
  choice: aos seus próprios olhos
  rationale: Expressão idiomática referente à avaliação que a pessoa faz de si mesma; “próprios” explicita naturalmente o valor reflexivo sem ampliar o sentido.
- source_word: יְרָא
  choice: tema
  rationale: O imperativo de ירא pode envolver temor reverente e profundo respeito diante de Deus. “Tema” preserva a força e a tensão teológica do termo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְסוּר
  choice: e afaste-se
  rationale: O imperativo de סור indica desviar-se, retirar-se ou manter distância; “afaste-se” é claro e idiomático em português atual.
- source_word: מֵרָע
  choice: do mal
  rationale: Neste contexto sapiencial, רָע tem sentido ético e moral; “do mal” conserva sua amplitude.
theological_decisions:
- issue: Sentido de ירא diante de Deus
  choice: tema
  alternative: reverencie
  rationale: “Tema” conserva a linguagem bíblica e abrange mais claramente o temor reverente, sem reduzi-lo a mero respeito; a nota registra a alternativa legítima.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino pessoal. A transliteração “Yahweh” preserva esse nome em vez de substituí-lo por um título.
- issue: Força de סור em relação ao mal
  choice: afaste-se do mal
  alternative: desvie-se do mal
  rationale: A escolha expressa uma ação moral deliberada de evitar ou abandonar o mal, sem especificar além do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém o paralelismo conciso do provérbio e preserva a ambiguidade lexical relevante por meio das notas.
