  text: for her profit is better than the profit of silver[b][a], and her yield than gold.
translation:
  language: pt
  text: Pois seu ganho[a] é melhor do que o lucro da prata, e seu rendimento é melhor do que o ouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu lucro” ou “sua mercadoria”; o hebraico emprega linguagem comercial para expressar o valor que a sabedoria proporciona.
    reason: lexical_alternative
  - marker: b
    text: Ou “ouro fino”; o termo hebraico pode indicar ouro especialmente precioso ou refinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da afirmação precedente e soa natural em português.
- source_word: טוֹב
  choice: é melhor
  rationale: Embora טוֹב signifique formalmente “bom”, a construção comparativa com מִן exige “melhor”.
- source_word: סַחְרָהּ
  choice: o lucro que ela dá
  rationale: Preserva a metáfora comercial e explicita de modo natural que se trata do benefício proporcionado pela sabedoria personificada.
- source_word: מִסְּחַר כָּסֶף
  choice: do que o lucro da prata
  rationale: Mantém a repetição e a imagem comercial do hebraico, em vez de reduzir a comparação simplesmente à prata.
- source_word: כָּסֶף
  choice: prata
  rationale: Equivalente usual do metal precioso neste contexto de comparação de valor.
- source_word: וּמֵחָרוּץ
  choice: do que o ouro
  rationale: חָרוּץ designa ouro, possivelmente ouro fino ou refinado; a forma simples é clara, e a nuance é preservada em nota.
- source_word: תְּבוּאָתָהּ
  choice: o seu rendimento
  rationale: Expressa aquilo que a sabedoria produz ou rende, preservando a imagem de resultado sem soar excessivamente agrícola no contexto.
