  text: יְֽהוָ֗ה בְּ/חָכְמָ֥ה יָֽסַד אָ֑רֶץ כּוֹנֵ֥ן שָׁ֝מַ֗יִם בִּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/019.yaml
  text: Yahweh founded the earth by wisdom[a]; he established the heavens by understanding.
translation:
  language: pt
  text: Yahweh fundou a terra por meio da sabedoria[a]; estabeleceu os céus por meio do entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com sabedoria” — e, no segundo membro, “com entendimento”. A preposição hebraica pode indicar meio ou acompanhamento; neste contexto, provavelmente indica o meio empregado na criação.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּחָכְמָה
  choice: com sabedoria
  rationale: A preposição ב pode indicar meio ou acompanhamento. Em português, “com sabedoria” é natural, mantém essa amplitude e, no contexto, permite o sentido instrumental.
- source_word: יָסַד
  choice: fundou
  rationale: Preserva a metáfora de lançar fundamentos e corresponde de modo conciso ao sentido do verbo.
- source_word: אָרֶץ
  choice: a terra
  rationale: O paralelismo cósmico com “os céus” aponta para a terra, não para um território específico.
- source_word: כּוֹנֵן
  choice: estabeleceu
  rationale: Expressa a ideia de firmar ou pôr em posição estável, mantendo distinção em relação a “fundou”.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Conserva a forma plural e o par cosmológico “terra/céus” em registro digno e corrente.
- source_word: בִּתְבוּנָה
  choice: com entendimento
  rationale: Mantém o paralelismo com “com sabedoria” e traduz תְּבוּנָה como capacidade de compreender e discernir.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” o preserva por transliteração sem substituí-lo por um título.
- issue: Papel da sabedoria e do entendimento na criação
  choice: com sabedoria ... com entendimento
  alternative: por meio da sabedoria ... por meio do entendimento
  rationale: A formulação preserva a possível nuance de acompanhamento da preposição hebraica, embora o contexto favoreça a noção de meio; não transforma a sabedoria em uma entidade pessoal nem elimina a força instrumental.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. “Fundou” conserva a imagem arquitetônica; “estabeleceu” evita repetir o mesmo verbo. A escolha de “com” soa natural em português e mantém a ambiguidade legítima da preposição hebraica, explicitada na nota.
