source:
  edition: WLC
  text: בְּ֭נִ/י תּוֹרָתִ֣/י אַל תִּשְׁכָּ֑ח וּ֝/מִצְוֺתַ֗/י יִצֹּ֥ר לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
translation:
  language: pt
  text: Meu filho, não se esqueça do meu ensino[a], e que o seu coração guarde[b] os meus mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha instrução”. O termo hebraico aqui se refere ao ensino recebido, não necessariamente à lei em sentido jurídico estrito.
    reason: lexical_alternative
  - marker: b
    text: Isto é, conserve e observe cuidadosamente. O verbo hebraico também pode ser traduzido como “proteja” ou “vigie”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém o vocativo masculino singular e o contexto literário de instrução de pai para filho.
- source_word: תּוֹרָתִי
  choice: meu ensino
  rationale: Neste contexto sapiencial, תּוֹרָה se refere ao ensino ou à instrução transmitida pelo pai, não necessariamente à lei em sentido jurídico estrito. “Ensino” é natural e claro em português.
- source_word: אַל תִּשְׁכָּח
  choice: não se esqueça
  rationale: Expressa de modo idiomático a proibição hebraica, preservando sua força exortativa.
- source_word: וּמִצְוֺתַי
  choice: os meus mandamentos
  rationale: Preserva o peso de ordens revestidas de autoridade e mantém uma formulação bíblica clara e corrente.
- source_word: יִצֹּר
  choice: guarde
  rationale: O verbo נצר comunica a ideia de guardar com cuidado, conservar e observar. “Guarde” preserva essa imagem e funciona naturalmente com “mandamentos”.
- source_word: לִבֶּךָ
  choice: o seu coração
  rationale: Mantém a linguagem antropológica hebraica, na qual o coração abrange pensamento, vontade e afetos, sem reduzi-lo apenas à mente.
theological_decisions:
- issue: Tratamento marcado por gênero na instrução sapiencial
  choice: Manter o masculino singular em “Meu filho”
  alternative: “Meu filho ou minha filha” ou “Minha criança”
  rationale: O hebraico é explicitamente masculino singular e pertence ao quadro literário de um pai dirigindo-se ao filho. A tradução preserva essa forma sem ampliar nem neutralizar o referente.
- issue: Sentido de תּוֹרָה no contexto
  choice: Traduzir como “ensino”
  alternative: “lei”
  rationale: O contexto imediato é a instrução sapiencial paterna. Traduzir como “lei” poderia sugerir indevidamente uma referência exclusiva à legislação mosaica, embora a palavra possa ter esse sentido em outros contextos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “que o seu coração guarde” conserva o paralelismo e a personificação do coração presentes no hebraico.
