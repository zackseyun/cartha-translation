  - severity: medium
    issue: «ele compartilha sua intimidade» torna explícita uma ação de compartilhar e seleciona a leitura de intimidade para סוֹדוֹ.
    rationale: O texto hebraico não traz o verbo «compartilhar»; sua construção permite conselho confidencial, segredo ou comunhão íntima. Uma formulação nominal no texto e alternativas na nota preservam melhor essa abertura.
