  text: כִּ֤י תוֹעֲבַ֣ת יְהוָ֣ה נָל֑וֹז וְֽ/אֶת יְשָׁרִ֥ים סוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/032.yaml
  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
translation:
  language: pt
  text: Pois o perverso é uma abominação para Yahweh, mas seu conselho está com os íntegros[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seu segredo está com os íntegros» ou «ele tem comunhão íntima com os íntegros». O termo hebraico pode indicar conselho confidencial, segredo ou comunhão íntima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a advertência anterior e soa natural na literatura sapiencial em português.
- source_word: תוֹעֲבַת יְהוָה
  choice: é detestável para Yahweh
  rationale: Expressa a forte repulsa moral indicada pelo substantivo hebraico sem recorrer ao menos corrente e potencialmente ritualizado «abominação».
- source_word: נָלוֹז
  choice: quem se desvia
  rationale: O termo descreve a pessoa moralmente tortuosa ou desviada; a formulação preserva a imagem de afastamento do caminho reto e é clara em português atual.
- source_word: וְאֶת
  choice: mas
  rationale: Embora a conjunção seja formalmente aditiva, o paralelismo antitético exige uma ligação adversativa natural em português.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: Designa os moralmente retos e mantém o contraste sapiencial com quem se desvia.
- source_word: סוֹדוֹ
  choice: ele compartilha sua intimidade
  rationale: סוֹד abrange conselho confidencial, segredo e convívio íntimo. Esta formulação portuguesa comunica proximidade reservada sem restringir o termo apenas a informação ou apenas a conselho.
theological_decisions:
- issue: Sentido de סוֹד na relação de Yahweh com os íntegros
  choice: Yahweh compartilha sua intimidade com os íntegros
  alternative: Seu conselho confidencial está com os íntegros; seu segredo está com os íntegros
  rationale: O hebraico permite tanto confidência e conselho reservado quanto comunhão íntima. O texto principal privilegia uma expressão relacional abrangente, e a nota conserva explicitamente as demais possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Yahweh» translitera o nome divino. A construção verbal no segundo membro evita o pouco natural «sua intimidade está com», sem eliminar a ambiguidade lexical, preservada na nota.
