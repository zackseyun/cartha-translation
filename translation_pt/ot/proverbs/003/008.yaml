  yaml_path: translation/ot/proverbs/003/008.yaml
  text: It will be healing to your body and refreshment to your bones[a][b].
translation:
  language: pt
  text: Isso será cura para o seu corpo[a] e refrigério para os seus ossos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao seu umbigo”. O termo hebraico pode se referir especificamente ao umbigo, embora, neste contexto, possa representar de modo mais amplo o bem-estar físico.
    reason: lexical_alternative
  - marker: b
    text: Ou “umidade” ou “nutrição” para os seus ossos.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְאוּת
  choice: cura
  rationale: O substantivo denota cura ou restauração da saúde. “Cura” preserva o sentido resultante e a imagem corporal concreta.
- source_word: תְּהִי
  choice: Isso trará
  rationale: A forma verbal, em concordância com o substantivo feminino, apresenta aqui a consequência da exortação anterior. “Isso trará” explicita de modo natural em português a relação resultante sem convertê-la em mera possibilidade.
- source_word: לְשָׁרֶּךָ
  choice: ao seu corpo
  rationale: Embora שֹׁר possa designar especificamente o umbigo, no contexto provavelmente representa de modo mais amplo o centro físico ou o bem-estar corporal. “Corpo” comunica esse sentido com clareza, enquanto a alternativa literal é preservada em nota.
- source_word: וְשִׁקּוּי
  choice: e vigor
  rationale: O termo deriva da ideia de dar de beber ou umedecer. Em paralelo com “cura” e aplicado aos ossos, indica renovação ou fortalecimento vital. “Vigor” produz uma expressão natural em português e conserva o efeito restaurador da imagem; os sentidos concretos ficam registrados em nota.
- source_word: לְעַצְמוֹתֶיךָ
  choice: aos seus ossos
  rationale: Tradução direta que preserva a imagem hebraica dos ossos como estrutura e vitalidade da pessoa.
