source:
  edition: WLC
  text: אַל תרוב עִם אָדָ֣ם חִנָּ֑ם אִם לֹ֖א גְמָלְ/ךָ֣ רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/030.yaml
  text: Do not contend with a man without cause[b][a], if he has done you no harm.
translation:
  language: pt
  text: Não entre em conflito com ninguém sem motivo[a], se essa pessoa não lhe fez mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não discuta” ou “Não litigue”. O verbo hebraico pode abranger conflito verbal e disputa judicial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se ela não lhe causou nenhum mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תָּרוֹב
  choice: Não entre em conflito
  rationale: A proibição com ריב abrange discutir, contender e até litigar. “Entrar em conflito” conserva essa amplitude em português natural, sem restringir o sentido a uma ação judicial.
- source_word: עִם אָדָם
  choice: com ninguém
  rationale: No contexto da proibição, אָדָם designa genericamente qualquer pessoa; “com ninguém” exprime com naturalidade a combinação portuguesa de proibição e referente humano indefinido.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Comunica a ideia de agir sem causa ou justificativa, em linguagem clara e atual.
- source_word: אִם לֹא
  choice: se ... não
  rationale: Mantém de forma direta a condição negativa do hebraico, sem transformá-la numa afirmação mais categórica.
- source_word: גְמָלְךָ רָעָה
  choice: essa pessoa não lhe fez mal
  rationale: גמל com רעה descreve causar ou fazer mal a alguém. A formulação é idiomática e preserva a ação dirigida ao destinatário.
theological_decisions:
- issue: Alcance da proibição
  choice: A proibição é qualificada por “sem motivo” e pela condição de que a outra pessoa não tenha causado mal.
  alternative: Entender o versículo como proibição absoluta de toda disputa.
  rationale: O texto hebraico mantém a tensão entre rejeitar conflitos injustificados e reconhecer, pela oração condicional, que pode existir uma causa real; a tradução não amplia nem elimina essa qualificação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Essa pessoa” evita uma alternância pouco natural entre o genérico “ninguém” e um pronome masculino, sem alterar o caráter universal do provérbio.
