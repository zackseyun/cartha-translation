  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּמְנַע ט֥וֹב מִ/בְּעָלָ֑י/ו בִּ/הְי֨וֹת לְ/אֵ֖ל ידי/ך לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/027.yaml
  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
translation:
  language: pt
  text: Não negue o bem a quem tem direito a ele, quando estiver ao seu alcance fazê-lo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de seus donos” ou “de seus possuidores”.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “quando houver poder em sua mão para fazer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Expressa de modo direto e natural a proibição hebraica.
- source_word: תִּמְנַע
  choice: negue
  rationale: O verbo significa reter, impedir ou recusar algo; “negar o bem a alguém” comunica com clareza a força ética da proibição em português atual.
- source_word: טוֹב
  choice: o bem
  rationale: Mantém o sentido amplo do hebraico, sem restringi-lo a bondade, favor, ajuda ou benefício material.
- source_word: מִבְּעָלָיו
  choice: a quem tem direito a ele
  rationale: בעליו significa literalmente “seus donos” ou “seus possuidores”, mas aqui designa naturalmente aqueles que têm reivindicação legítima sobre o bem. A formulação idiomática é usada no texto, e a imagem literal é preservada em nota.
- source_word: בִּהְיוֹת
  choice: quando estiver
  rationale: O infinitivo construto com בְּ introduz a circunstância em que a ação é possível.
- source_word: לְאֵל יָדֶךָ
  choice: ao seu alcance
  rationale: A expressão hebraica, literalmente relacionada ao poder da mão, é um idioma de capacidade ou possibilidade. “Ao seu alcance” é natural e conserva parcialmente a imagem concreta.
- source_word: לַעֲשׂוֹת
  choice: fazê-lo
  rationale: Traduz o verbo comum “fazer” e retoma de maneira natural a concessão do bem mencionada na primeira oração.
theological_decisions:
- issue: Natureza do direito expresso por בְּעָלָיו
  choice: a quem tem direito a ele
  alternative: aos seus donos
  rationale: O texto apresenta o beneficiário como alguém com reivindicação legítima, mas não especifica se a obrigação é jurídica, econômica ou moral. A tradução mantém essa amplitude, e a nota registra a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Não negue o bem” preserva a amplitude moral e prática do original; “ao seu alcance” comunica o idioma hebraico sem eliminar por completo sua imagem corporal, explicitada na nota.
