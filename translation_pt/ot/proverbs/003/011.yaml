  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
translation:
  language: pt
  text: Meu filho, não despreze a disciplina de Yahweh, nem deteste a sua repreensão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem se canse da sua repreensão”. O verbo hebraico também pode expressar cansaço ou impaciência, além de aversão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: disciplina
  rationale: Em Provérbios, o termo designa formação corretiva, não apenas ensino abstrato. “Disciplina” conserva tanto o aspecto educativo quanto o corretivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva o vocativo singular masculino e o cenário literário de instrução paterna.
- source_word: אַל תִּמְאָס
  choice: não despreze
  rationale: O verbo מָאַס comunica rejeição acompanhada de desdém; “despreze” mantém essa força atitudinal.
- source_word: תָּקֹץ
  choice: nem tenha aversão
  rationale: קוּץ pode indicar repulsa, impaciência ou cansaço. “Tenha aversão” preserva a força emocional e o paralelismo com “não despreze”, enquanto a nota registra a alternativa ligada ao cansaço.
- source_word: בְּתוֹכַחְתּוֹ
  choice: à sua repreensão
  rationale: תּוֹכַחַת denota advertência ou correção verbal. “Repreensão” distingue esse ato verbal da disciplina formativa mais ampla.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de terceira pessoa amplamente naturais no uso brasileiro. A formulação mantém o paralelismo hebraico e posiciona a nota junto à expressão lexical a que ela se refere.
