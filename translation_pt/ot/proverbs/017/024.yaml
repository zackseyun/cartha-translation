  text: אֶת פְּנֵ֣י מֵבִ֣ין חָכְמָ֑ה וְ/עֵינֵ֥י כְ֝סִ֗יל בִּ/קְצֵה אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
translation:
  language: pt
  text: A sabedoria está diante do homem que tem discernimento[a], mas os olhos do insensato estão nos confins da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «diante do rosto do homem que tem discernimento». A expressão hebraica também pode ser entendida como «na presença de quem entende».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «nos confins do país».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת פְּנֵי
  choice: diante de
  rationale: 'A expressão é entendida como indicação de proximidade ou presença: a sabedoria está ao alcance imediato de quem tem discernimento. A tradução evita a formulação pouco natural «diante do rosto», registrando-a em nota.'
- source_word: מֵבִין
  choice: homem que tem discernimento
  rationale: O particípio masculino singular descreve proverbialmente uma pessoa caracterizada por compreender e discernir. «Tem discernimento» comunica essa qualidade em português corrente.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: O substantivo abstrato funciona como sujeito da primeira oração. Não é necessário impor aqui uma personificação teológica.
- source_word: וְעֵינֵי
  choice: mas os olhos
  rationale: Embora וְ normalmente corresponda a «e», o paralelismo estabelece contraste claro, expresso naturalmente em português por «mas».
- source_word: כְסִיל
  choice: insensato
  rationale: Em Provérbios, o termo designa quem é moral e intelectualmente tolo. «Insensato» é claro, digno e tradicional sem soar excessivamente coloquial.
- source_word: בִּקְצֵה אָרֶץ
  choice: nos confins da terra
  rationale: A expressão retrata distância extrema e a atenção dispersa do insensato. «Confins da terra» preserva a hipérbole e a imagem espacial hebraica.
theological_decisions:
- issue: Sujeito proverbial marcado no masculino
  choice: homem que tem discernimento
  alternative: pessoa que tem discernimento; quem entende
  rationale: O hebraico emprega um particípio masculino singular como tipo proverbial representativo. A tradução conserva essa forma sem sugerir que a verdade do provérbio se limite aos homens.
- issue: Possível personificação da sabedoria
  choice: a sabedoria
  alternative: Sabedoria, entendida como figura pessoal
  rationale: O versículo permite ler חָכְמָה simplesmente como a qualidade da sabedoria e não exige uma personificação teologicamente definida. A tradução mantém essa abertura sem acrescentar uma identificação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. «Está diante de» comunica disponibilidade imediata; «estão nos confins» conserva o contraste concreto entre a sabedoria próxima e o olhar distante e disperso do insensato.
