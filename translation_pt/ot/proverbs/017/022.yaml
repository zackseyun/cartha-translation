  yaml_path: translation/ot/proverbs/017/022.yaml
  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
translation:
  language: pt
  text: O coração alegre favorece a cura[a], mas o espírito abatido resseca os ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faz bem como remédio”. O substantivo hebraico גֵּהָה pode indicar cura, recuperação ou remédio; o texto principal adota o sentido mais amplo de “cura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Em Provérbios, o termo designa a pessoa interior, abrangendo emoções, pensamento e vontade. “Coração” é natural em português e preserva a imagem antropológica.
- source_word: שָׂמֵחַ
  choice: alegre
  rationale: O adjetivo expressa alegria ou contentamento; “coração alegre” é uma combinação corrente e digna em português.
- source_word: יֵיטִב
  choice: favorece
  rationale: A forma causativa de יטב pode significar “fazer bem” ou “tornar bom”. Com גֵּהָה, “favorece a cura” comunica com naturalidade que a alegria contribui para a recuperação, sem transformar o provérbio em promessa absoluta.
- source_word: גֵּהָה
  choice: cura
  rationale: O substantivo raro pode indicar cura, recuperação ou remédio. “Cura” preserva o sentido amplo e forma um contraste claro com a deterioração corporal do segundo membro.
- source_word: רוּחַ
  choice: espírito
  rationale: Aqui se refere ao ânimo ou à disposição interior da pessoa. “Espírito” preserva o paralelismo com “coração” e a imagem do hebraico.
- source_word: נְכֵאָה
  choice: abatido
  rationale: O termo descreve alguém interiormente golpeado ou quebrantado. “Abatido” é idiomático em português para um espírito profundamente desanimado, embora seja um pouco menos concreto que “esmagado”.
- source_word: תְּיַבֶּשׁ
  choice: resseca
  rationale: O verbo intensivo descreve a ação de secar. “Resseca” mantém a força e a concretude da metáfora em português natural.
- source_word: גָּרֶם
  choice: os ossos
  rationale: Embora a forma hebraica seja singular, pode ter valor coletivo. O plural “os ossos” é a expressão idiomática em português e representa a estrutura física inteira.
