  text: כַּ֣עַס לְ֭/אָבִי/ו בֵּ֣ן כְּסִ֑יל וּ֝/מֶ֗מֶר לְ/יוֹלַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
translation:
  language: pt
  text: O filho insensato é motivo de aflição para seu pai[a] e de amargura para aquela que o deu à luz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “motivo de irritação para seu pai”. O termo hebraico pode expressar ira, irritação, desgosto ou aflição; aqui, provavelmente enfatiza o sofrimento causado ao pai.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, sua mãe; literalmente, “aquela que o deu à luz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  choice: aflição
  rationale: O substantivo pode indicar ira, desgosto ou aflição. Neste paralelismo, descreve naturalmente o sofrimento que o filho causa ao pai, em correspondência com “amargura” no segundo membro.
- source_word: לְאָבִיו
  choice: para seu pai
  rationale: A preposição לְ marca aqui a pessoa afetada. A formulação “motivo de aflição para seu pai” torna natural em português a oração nominal concisa do hebraico.
- source_word: בֵּן כְּסִיל
  choice: o filho insensato
  rationale: Em Provérbios, כְּסִיל designa quem age sem sabedoria moral e prática, não apenas alguém de pouca inteligência. “Insensato” preserva essa categoria sapiencial.
- source_word: וּמֶמֶר
  choice: e de amargura
  rationale: O substantivo raro é mais provavelmente entendido como amargura ou sofrimento amargo, formando paralelo com כַּעַס. A repetição elíptica de “motivo” mantém o verso conciso e natural.
- source_word: לְיוֹלַדְתּוֹ
  choice: para aquela que o deu à luz
  rationale: O particípio significa literalmente “aquela que o gerou/deu à luz”. A tradução conserva a expressão materna vívida do hebraico, em vez de reduzi-la simplesmente a “sua mãe”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Insensato” mantém o vocabulário sapiencial tradicional sem sugerir mera deficiência intelectual; “aquela que o deu à luz” preserva a especificidade e a força poética do original.
