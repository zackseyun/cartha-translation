base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/028.yaml
  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
translation:
  language: pt
  text: Até o insensato, quando se cala, é considerado sábio; quem fecha os lábios é considerado prudente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “... é considerado alguém de discernimento.” No segundo membro, o hebraico deixa subentendido o verbo “é considerado”; o provérbio enfatiza que o silêncio pode fazer até o insensato parecer sábio e prudente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Expressa a força concessiva e surpreendente: até mesmo uma pessoa insensata pode ser tida por sábia nessa condição.'
- source_word: אֱוִיל
  choice: insensato
  rationale: Termo natural e digno para a pessoa moral e intelectualmente deficiente retratada na literatura sapiencial, sem sugerir apenas baixa inteligência.
- source_word: מַחֲרִישׁ
  choice: quando fica calado
  rationale: Representa o particípio que descreve a pessoa abstendo-se de falar e soa natural em português contemporâneo.
- source_word: חָכָם יֵחָשֵׁב
  choice: é considerado sábio
  rationale: Preserva o sentido passivo de ser avaliado ou reputado como sábio.
- source_word: אֹטֵם
  choice: quem mantém ... fechados
  rationale: Conserva a imagem concreta de fechar os lábios e comunica contenção deliberada da fala.
- source_word: שְׂפָתָיו
  choice: os lábios
  rationale: Mantém a imagem corporal concreta do hebraico; o possessivo fica implícito e inequívoco na construção portuguesa.
- source_word: נָבוֹן
  choice: alguém que tem discernimento
  rationale: Transmite compreensão perceptiva e preserva a construção elíptica do segundo membro, no qual o verbo 'é considerado' fica subentendido.
