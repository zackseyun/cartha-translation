  text: אָדָ֣ם חֲסַר לֵ֭ב תּוֹקֵ֣עַ כָּ֑ף עֹרֵ֥ב עֲ֝רֻבָּ֗ה לִ/פְנֵ֥י רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/018.yaml
  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
translation:
  language: pt
  text: O homem sem juízo[a] aperta a mão[b], tornando-se fiador[c] diante do seu próximo.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “falto de coração”; aqui, alguém sem entendimento ou bom senso.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “bate a mão”. O gesto selava um compromisso ou uma garantia.
    reason: cultural_note
  - marker: c
    text: Isto é, assumindo a responsabilidade de pagar a dívida ou cumprir a obrigação de outra pessoa.
    reason: clarification
  - marker: d
    text: Ou “na presença do seu próximo”. O hebraico não esclarece se o próximo é o beneficiário, o credor ou uma testemunha.
    reason: ambiguity
lexical_decisions:
- source_word: אָדָם
  choice: O homem
  rationale: O substantivo singular apresenta um indivíduo representativo no provérbio. “O homem” conserva a forma masculina do hebraico sem transformar a referência em uma afirmação sobre toda a humanidade.
- source_word: חֲסַר לֵב
  choice: sem juízo
  rationale: Literalmente, “falto de coração”. Na literatura sapiencial hebraica, o coração é também o centro do entendimento e do discernimento; “sem juízo” comunica essa força idiomática em português atual.
- source_word: תּוֹקֵעַ כָּף
  choice: aperta a mão
  rationale: A expressão descreve bater ou unir as mãos como gesto que confirma um compromisso. “Aperta a mão” é uma equivalência cultural clara, enquanto a nota registra a forma literal e o sentido jurídico do gesto.
- source_word: עֹרֵב עֲרֻבָּה
  choice: tornando-se fiador
  rationale: O verbo e o substantivo cognatos exprimem assumir formalmente uma garantia por outra pessoa. “Tornar-se fiador” conserva o sentido financeiro e jurídico em linguagem compreensível.
- source_word: לִפְנֵי רֵעֵהוּ
  choice: diante do seu próximo
  rationale: Mantém o sentido básico de לִפְנֵי, “diante de/na presença de”, sem decidir se o próximo é beneficiário, credor ou testemunha do compromisso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção proverbial concisa. “Sem juízo” evita o literalismo obscuro de “falto de coração”; “fiador” preserva com precisão o contexto de garantia financeira. As notas mantêm visíveis o gesto hebraico e a ambiguidade relacional da frase final.
