  text: Whoever repays evil for good[a], evil will not depart from his house.
translation:
  language: pt
  text: Quem retribui o bem com o mal, o mal[a] não se afastará de sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a calamidade não se afastará de sua casa”. A segunda ocorrência de “mal” (רָעָה) pode indicar tanto o mal moral quanto uma consequência nociva, como calamidade ou desgraça; o texto principal preserva a repetição do hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: retribui
  rationale: O particípio hifil de שוב expressa aqui fazer voltar algo em troca. “Retribui” comunica com naturalidade a ideia de dar uma resposta correspondente, neste caso perversa.
- source_word: רָעָה תַּחַת טוֹבָה
  choice: o bem com o mal
  rationale: Em português, “retribuir o bem com o mal” é a formulação idiomática para a relação de troca marcada por תַּחַת, embora a ordem dos substantivos seja ajustada em relação ao hebraico.
- source_word: טוֹבָה
  choice: o bem
  rationale: Mantém o sentido amplo de bondade, benefício ou ação boa e conserva o contraste direto com “o mal” sem restringi-lo a um gesto específico.
- source_word: רָעָה (primeira ocorrência)
  choice: o mal
  rationale: Neste contexto, refere-se à conduta moralmente má praticada como resposta ao bem recebido.
- source_word: לֹא תמיש
  choice: não se afastará
  rationale: O imperfeito hifil de מוש indica que o mal não será removido nem deixará o âmbito da casa; a forma reflexiva é corrente e digna em português.
- source_word: רָעָה (segunda ocorrência)
  choice: o mal
  rationale: Repete a mesma expressão da primeira ocorrência, como no hebraico, preservando a simetria e a possível tensão entre mal moral e calamidade resultante.
- source_word: מִבֵּיתוֹ
  choice: de sua casa
  rationale: “Casa” é a correspondência direta e pode incluir, no uso proverbial, tanto a residência quanto a família ou unidade doméstica.
- source_word: sujeito implícito do particípio
  choice: Quem
  rationale: O particípio substantivado tem sentido genérico; “Quem” o expressa de modo claro, conciso e natural no português moderno.
theological_decisions:
- issue: Sentido da segunda ocorrência de רָעָה
  choice: Manter “o mal” no texto principal
  alternative: “a calamidade” ou “a desgraça”
  rationale: O termo pode indicar tanto mal quanto consequência nociva. Repeti-lo preserva o recurso lexical hebraico e evita decidir silenciosamente se a sentença descreve mal moral persistente ou juízo calamitoso; a alternativa é indicada em nota.
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A inversão “de sua casa o mal não se afastará” conserva a ênfase sobre a casa e dá cadência solene sem recorrer a linguagem arcaica.
