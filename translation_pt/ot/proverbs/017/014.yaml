  text: פּ֣וֹטֵֽר מַ֭יִם רֵאשִׁ֣ית מָד֑וֹן וְ/לִ/פְנֵ֥י הִ֝תְגַּלַּ֗ע הָ/רִ֥יב נְטֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/014.yaml
  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
translation:
  language: pt
  text: O começo de uma contenda é como liberar água[a]; antes que a disputa irrompa[b], abandone-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O começo de uma contenda é como alguém que libera água”. A imagem hebraica pode aludir à abertura de uma brecha numa represa ou num canal, depois da qual o fluxo se torna difícil de conter.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido por “irrompa” é difícil; alternativas incluem “venha à tona”, “se manifeste” ou “se agrave”. O sentido é deixar a disputa antes que ela se torne aberta e difícil de conter.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר
  choice: deixar ... escapar
  rationale: O particípio evoca abrir uma passagem ou liberar algo que estava contido. Com “água”, a expressão natural preserva a imagem de um fluxo que, uma vez iniciado, se torna difícil de deter.
- source_word: מַיִם
  choice: a água
  rationale: Embora a forma hebraica seja morfologicamente plural, trata-se do substantivo coletivo comum para água; o singular é a forma idiomática em português.
- source_word: רֵאשִׁית
  choice: o começo de
  rationale: Indica o princípio ou a primeira etapa de algo. “O começo de” é claro, corrente e apropriado ao estilo proverbial.
- source_word: מָדוֹן
  choice: contenda
  rationale: Designa conflito ou antagonismo litigioso. “Contenda” mantém a amplitude do termo e o tom digno da literatura sapiencial.
- source_word: וְלִפְנֵי
  choice: por isso ... antes que
  rationale: A conjunção e a preposição introduzem a aplicação prática da comparação. “Por isso” explicita com naturalidade a consequência proverbial, enquanto “antes que” preserva a relação temporal.
- source_word: הִתְגַּלַּע
  choice: irrompa
  rationale: O verbo raro pode sugerir romper-se, manifestar-se abertamente ou agravar-se. “Irrompa” mantém a ideia de eclosão súbita e combina com a imagem da água liberada, sem eliminar a incerteza lexical, registrada em nota.
- source_word: הָרִיב
  choice: a disputa
  rationale: רִיב denota disputa, litígio ou desavença. “Disputa” é atual e distingue este termo de מָדוֹן sem criar uma diferença excessiva de sentido.
- source_word: נְטוֹשׁ
  choice: abandone
  rationale: O imperativo ordena deixar ou interromper a disputa. “Abandone” conserva a força da exortação e permanece claro em português moderno.
