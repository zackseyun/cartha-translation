base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/012.yaml
  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: pt
  text: É melhor encontrar uma ursa que perdeu os filhotes do que um insensato em sua insensatez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּגוֹשׁ
  choice: encontrar
  rationale: 'O infinitivo absoluto funciona aqui como formulação comparativa elíptica: é preferível encontrar. “Encontrar” expressa naturalmente o confronto inesperado sugerido pelo verbo.'
- source_word: דֹּב שַׁכּוּל
  choice: uma ursa privada de seus filhotes
  rationale: Embora דֹּב possa designar urso sem marcar formalmente o sexo, o particípio שַׁכּוּל evoca o animal que perdeu as crias; o feminino “ursa” torna essa imagem explícita e idiomática em português.
- source_word: כְּסִיל
  choice: insensato
  rationale: Termo sapiencial para quem rejeita a sabedoria e age sem bom senso moral; “insensato” preserva essa dimensão sem soar meramente intelectual.
- source_word: אִוַּלְתּוֹ
  choice: sua insensatez
  rationale: Mantém a relação lexical entre o insensato e sua conduta característica, reproduzindo a força da expressão hebraica.
theological_decisions:
- issue: Forma comparativa elíptica e objeto humano implícito
  choice: Melhor encontrar... do que...
  alternative: Que uma ursa privada de seus filhotes encontre alguém, e não um insensato em sua insensatez.
  rationale: 'O hebraico apresenta uma construção proverbial compacta, literalmente próxima de “encontre uma ursa... um homem, mas não um insensato...”. A tradução comparativa comunica com clareza o sentido: o encontro com o insensato é ainda mais perigoso que o encontro com a ursa enfurecida, sem introduzir interpretação doutrinária.'
translation_notes:
  register: Português moderno, claro e proverbial, com tom digno. A formulação conserva o paralelismo e a imagem violenta do hebraico sem explicação intrusiva.
