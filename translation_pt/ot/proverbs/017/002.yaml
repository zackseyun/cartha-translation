  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent slave will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
translation:
  language: pt
  text: Um escravo[a] prudente terá autoridade sobre um filho que traz vergonha e, entre irmãos[b], terá parte na herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servo». O termo hebraico pode ter os dois sentidos; «escravo» ressalta a inversão social apresentada pelo provérbio.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, «irmãos e irmãs». O hebraico diz literalmente «irmãos» e se refere aos herdeiros da família.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: escravo
  rationale: 'O substantivo pode designar escravo ou servo. Aqui, «escravo» preserva a condição social inferior que dá força à inversão do provérbio: por agir com prudência, ele pode elevar-se acima de um filho que desonra a família.'
- source_word: מַשְׂכִּיל
  choice: prudente
  rationale: O particípio expressa a ideia de agir com discernimento e bom senso prático, característica central da sabedoria em Provérbios.
- source_word: יִמְשֹׁל בְּבֵן
  choice: terá autoridade sobre um filho
  rationale: משׁל indica governar ou exercer domínio. Esta formulação comunica naturalmente em português a relação de autoridade e conserva a inversão social do hebraico.
- source_word: מֵבִישׁ
  choice: que traz vergonha
  rationale: 'O particípio tem sentido causativo: trata-se de um filho que causa vergonha, provavelmente à própria família, e não apenas de alguém que sente vergonha.'
- source_word: וּבְתוֹךְ אַחִים
  choice: e, entre irmãos
  rationale: A expressão situa o escravo no círculo dos herdeiros da família. «Irmãos» conserva o plural masculino explícito do hebraico.
- source_word: יַחֲלֹק נַחֲלָה
  choice: terá parte na herança
  rationale: No contexto sucessório, חלק indica participar da divisão ou receber uma porção. «Terá parte na herança» evita sugerir apenas que ele administrará a divisão dos bens.
theological_decisions:
- issue: Linguagem familiar marcada por gênero
  choice: irmãos
  alternative: irmãos e irmãs; demais filhos da família
  rationale: O hebraico usa explicitamente o plural masculino אַחִים. A tradução mantém essa forma sem decidir se, no alcance proverbial, ela poderia abranger outros herdeiros da família.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação conserva o paralelismo e a inversão social do original sem tornar a sintaxe artificial.
