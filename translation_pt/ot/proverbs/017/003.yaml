id: PRO.17.3
reference: Proverbs 17:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
translation:
  language: pt
  text: O crisol é para a prata, e o forno, para o ouro; mas[a] Yahweh prova os corações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Yahweh prova os corações”.'
    reason: A conjunção hebraica pode ser entendida como aditiva (“e”) ou, no paralelismo, como contrastiva (“mas”).
lexical_decisions:
- source_word: מַצְרֵף
  choice: crisol
  rationale: Designa um recipiente ou instrumento usado para refinar metais. “Crisol” é preciso, corrente e preserva a imagem metalúrgica.
- source_word: לַכֶּסֶף
  choice: para a prata
  rationale: 'A preposição ל indica finalidade ou aplicação: o crisol é usado para a prata. O artigo soa natural em português sem alterar o caráter geral do provérbio.'
- source_word: כּוּר
  choice: forno
  rationale: Refere-se a um forno de fundição ou refino. “Forno” é claro e mantém o paralelismo conciso com “crisol”.
- source_word: לַזָּהָב
  choice: para o ouro
  rationale: Como na expressão paralela, ל indica finalidade ou aplicação. “Para o ouro” é idiomático e mantém o sentido proverbial.
- source_word: וּבֹחֵן
  choice: mas prova
  rationale: O particípio de בחן expressa examinar ou pôr à prova para revelar a qualidade. “Prova” mantém a ligação com o refino; “mas” explicita o contraste natural em português, enquanto a nota preserva o valor aditivo possível da conjunção hebraica.
- source_word: לִבּוֹת
  choice: os corações
  rationale: No uso hebraico, o coração representa a interioridade humana, incluindo pensamentos, intenções e caráter. A tradução conserva essa metáfora bíblica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando-o como nome pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de בחן aplicado à interioridade humana
  choice: prova os corações
  alternative: examina os corações
  rationale: “Prova” conserva a força avaliativa do verbo e sua relação metafórica com o teste de metais, sem restringir o sentido a uma análise psicológica ou judicial.
- issue: Relação da última oração com o paralelismo anterior
  choice: mas Yahweh prova os corações
  alternative: e Yahweh prova os corações
  rationale: A conjunção ו pode ser aditiva ou assumir valor contrastivo no contexto. “Mas” comunica com naturalidade que, assim como instrumentos avaliam metais, Yahweh avalia o interior humano; a nota registra a leitura formalmente aditiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura breve e paralela do provérbio foi preservada; a pontuação evidencia a passagem da comparação metalúrgica à ação divina.
