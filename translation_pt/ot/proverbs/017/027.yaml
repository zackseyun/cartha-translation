source:
  edition: WLC
  text: חוֹשֵׂ֣ךְ אֲ֭מָרָי/ו יוֹדֵ֣עַ דָּ֑עַת ו/קר ר֝֗וּחַ אִ֣ישׁ תְּבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/027.yaml
  text: Whoever restrains his words has knowledge[b][a], and a man of understanding is cool in spirit.
translation:
  language: pt
  text: Quem refreia suas palavras tem conhecimento, e o homem de discernimento[b] tem espírito sereno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “é frio de espírito”. A imagem de temperatura expressa serenidade e domínio próprio.
    reason: lexical_alternative
  - marker: b
    text: A forma hebraica é masculina singular (“homem”), usada aqui de modo proverbial para caracterizar alguém dotado de discernimento.
    reason: cultural_note
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: refreia
  rationale: O particípio de חשׂך expressa a ação habitual de conter ou moderar a fala; “refreia” comunica autocontrole de modo natural e conciso.
- source_word: אֲמָרָיו
  choice: suas palavras
  rationale: אֲמָרִים designa palavras ou enunciados; “suas palavras” é a correspondência mais direta e idiomática.
- source_word: יוֹדֵעַ דָּעַת
  choice: tem conhecimento
  rationale: A construção hebraica, literalmente próxima de “conhece conhecimento”, caracteriza alguém que possui saber; a formulação portuguesa evita uma repetição artificial.
- source_word: וְקַר־רוּחַ
  choice: tem espírito sereno
  rationale: קַר significa literalmente “frio”, mas aqui a imagem térmica descreve compostura e domínio próprio. “Tem espírito sereno” transmite o sentido em português natural, enquanto a nota preserva a imagem concreta.
- source_word: אִישׁ תְּבוּנָה
  choice: homem de discernimento
  rationale: A expressão construta descreve um homem caracterizado por entendimento e capacidade de julgar bem. “Discernimento” é claro e adequado ao vocabulário sapiencial.
theological_decisions:
- issue: Expressão masculina em uma máxima sapiencial
  choice: homem de discernimento
  alternative: pessoa de discernimento; quem tem discernimento
  rationale: O hebraico emprega אִישׁ, substantivo masculino singular explícito. A tradução conserva essa forma, sem negar que o provérbio expresse uma verdade geral aplicável a qualquer pessoa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo entre moderação da fala e serenidade interior foi preservado; a metáfora hebraica de temperatura aparece explicada em nota para evitar em português a conotação de insensibilidade que “espírito frio” poderia sugerir.
