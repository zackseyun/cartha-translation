  text: בְּ/כָל עֵ֭ת אֹהֵ֣ב הָ/רֵ֑עַ וְ/אָ֥ח לְ֝/צָרָ֗ה יִוָּלֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
translation:
  language: pt
  text: O amigo ama em todo tempo, e o irmão nasce para a adversidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o irmão nasce para o tempo de angústia”.'
    reason: A expressão לְצָרָה pode ser entendida de modo geral, “para a adversidade”, ou com valor temporal, “para o tempo de angústia”.
lexical_decisions:
- source_word: בְּ/כָל עֵת
  choice: em todo tempo
  rationale: A combinação de ב com כָּל e עֵת indica abrangência temporal completa. “Em todo tempo” é natural no registro proverbial e preserva a afirmação universal do hebraico.
- source_word: אֹהֵב
  choice: ama
  rationale: O particípio qal expressa uma ação característica e contínua. “Ama” é direto e mantém a concisão do provérbio.
- source_word: הָ/רֵעַ
  choice: o amigo
  rationale: Embora o substantivo tenha artigo, o estilo proverbial permite entendê-lo como representante de uma classe. “O amigo” soa natural em português e conserva formalmente o artigo hebraico.
- source_word: וְ/אָח
  choice: e o irmão
  rationale: אָח significa normalmente “irmão” e pode também sugerir solidariedade familiar. A tradução literal preserva o paralelismo e não restringe indevidamente o sentido.
- source_word: לְ֝/צָרָה
  choice: para a adversidade
  rationale: צָרָה pode designar aflição, angústia ou adversidade. “Adversidade” mantém a formulação concisa e geral.
- source_word: יִוָּלֵד
  choice: nasce
  rationale: O nifal de ילד significa literalmente “nasce”. A escolha preserva a imagem forte do original, embora a construção possa sugerir que o papel de irmão se manifesta especialmente na aflição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com dicção digna e ampla legibilidade brasileira. A tradução mantém o paralelismo e a metáfora do nascimento, sem explicar no corpo do texto a relação exata entre fraternidade e adversidade.
