  source_fidelity: 'A tradução preserva adequadamente a comparação proverbial hebraica: o pão seco e a paz contrastam com a casa de fartura sacrificial e conflito. «Um pedaço de pão seco» reproduz bem פַּת חֲרֵבָה sem restringir indevidamente a imagem a uma crosta. «Em paz» comunica de modo idiomático a tranquilidade de וְשַׁלְוָה בָהּ, e «brigas» expressa apropriadamente רִיב.'
