base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/001.yaml
  text: Better is a dry crust with peace than a house full of sacrificial feasts with strife[a].
translation:
  language: pt
  text: Melhor é um pedaço de pão seco em paz do que uma casa cheia de banquetes sacrificiais em meio a brigas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifícios”; o hebraico pode se referir tanto a refeições sacrificiais quanto, de modo mais geral, à comida farta de banquetes ligada aos sacrifícios.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: Preserva a fórmula comparativa concisa e proverbial do hebraico.
- source_word: פַּת חֲרֵבָה
  choice: um pedaço de pão seco
  rationale: פַּת designa um pedaço ou porção de pão; a expressão natural em português mantém a imagem de uma refeição escassa, sem restringi-la especificamente à crosta.
- source_word: וְשַׁלְוָה בָהּ
  choice: em paz
  rationale: שַׁלְוָה comunica tranquilidade e sossego. A formulação idiomática preserva o contraste doméstico com as brigas, sem reproduzir de modo artificial o sufixo pronominal.
- source_word: מִבַּיִת מָלֵא
  choice: do que uma casa cheia de
  rationale: Mantém a comparação introduzida por מִן e o cenário concreto da casa.
- source_word: זִבְחֵי
  choice: banquetes sacrificiais
  rationale: O plural de זֶבַח pode indicar sacrifícios ou as refeições festivas ligadas a eles; esta escolha conserva tanto a dimensão sacrificial quanto a ideia de fartura.
- source_word: רִיב
  choice: brigas
  rationale: Expressa de maneira clara e corrente o conflito interpessoal, conservando o contraste com a paz.
