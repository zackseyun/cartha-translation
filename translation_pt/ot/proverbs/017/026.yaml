  yaml_path: translation/ot/proverbs/017/026.yaml
  text: Also[a], to punish a righteous man is not good[b], nor to strike nobles for their uprightness.
translation:
  language: pt
  text: 'Também não é bom punir o justo,

    nem ferir os nobres por sua retidão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem ferir líderes contra o que é justo”. A expressão hebraica pode significar que eles são feridos por causa de sua retidão ou que o ato de feri-los é contrário à justiça. “Nobres” também pode ser traduzido por “príncipes” ou “líderes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a força aditiva do hebraico e liga esta afirmação ao contexto proverbial anterior de modo natural.
- source_word: עֲנוֹשׁ
  choice: punir
  rationale: Expressa de modo amplo a imposição de uma pena, sem restringi-la a multa ou outra sanção específica.
- source_word: לַצַּדִּיק
  choice: o justo
  rationale: Mantém o singular representativo e a linguagem tradicional da sabedoria bíblica, sem acrescentar um substantivo masculino ausente do hebraico.
- source_word: לֹא טוֹב
  choice: não é bom
  rationale: Reproduz a avaliação hebraica de forma direta, natural e deliberadamente ampla.
- source_word: לְהַכּוֹת
  choice: ferir
  rationale: Traduz o sentido amplo de golpear sem especificar indevidamente açoite, espancamento ou outra modalidade de violência.
- source_word: נְדִיבִים
  choice: os nobres
  rationale: No contexto social e judicial, o termo provavelmente designa pessoas de posição elevada; 'nobres' preserva essa ideia sem limitar o referente a príncipes.
- source_word: עַל יֹשֶׁר
  choice: por sua retidão
  rationale: Toma עַל como indicação da causa ou motivo e entende יֹשֶׁר como conduta reta. A construção também permite o sentido adverbial 'contra o que é justo', preservado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. 'O justo' funciona como singular representativo; 'ferir' evita especificar uma pena corporal não explicitada pelo verbo hebraico. A ambiguidade de עַל יֹשֶׁר é mantida por meio da nota.
