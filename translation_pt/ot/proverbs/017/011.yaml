source:
  edition: WLC
  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
translation:
  language: pt
  text: O rebelde só busca o mal, e um mensageiro cruel[a] será enviado contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um anjo cruel”. A palavra hebraica pode significar tanto “mensageiro” como “anjo”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: só
  rationale: 'Expressa de modo natural a força restritiva e enfática: a busca do rebelde se concentra no mal.'
- source_word: מְרִי
  choice: o rebelde
  rationale: Embora o substantivo possa significar abstratamente “rebelião”, aqui funciona de modo pessoal/metonímico, como indicam o verbo e o pronome masculinos no singular.
- source_word: יְבַקֶּשׁ
  choice: busca
  rationale: Reproduz de forma concisa e corrente o sentido do piel de בקש, “buscar, procurar”.
- source_word: רָע
  choice: o mal
  rationale: Mantém o sentido moral amplo de רָע sem excluir suas consequências nocivas.
- source_word: מַלְאָךְ
  choice: mensageiro
  rationale: Preserva a referência geral a um agente enviado sem determinar indevidamente que seja sobrenatural; a possibilidade “anjo” é registrada em nota.
- source_word: אַכְזָרִי
  choice: cruel
  rationale: Equivalente direto e natural que comunica a severidade implacável do agente.
- source_word: יְשֻׁלַּח
  choice: será enviado
  rationale: Conserva a voz passiva do pual e apresenta a consequência proverbial como futura.
- source_word: בּוֹ
  choice: contra ele
  rationale: No contexto hostil e punitivo, esta é a formulação idiomática em português para a direção da ação.
theological_decisions:
- issue: Se מַלְאָךְ designa um “anjo” sobrenatural ou um “mensageiro” em sentido mais geral
  choice: mensageiro
  alternative: anjo
  rationale: O versículo não identifica explicitamente o agente como celestial. “Mensageiro” evita acrescentar uma especificação teológica que o hebraico não exige, enquanto a nota preserva a leitura possível “anjo”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O artigo definido em “o rebelde” apresenta o tipo humano descrito pelo provérbio; “só busca o mal” conserva a concisão e o paralelismo do hebraico.
