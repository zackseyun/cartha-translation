source:
  edition: WLC
  text: אֶֽבֶן חֵ֣ן הַ֭/שֹּׁחַד בְּ/עֵינֵ֣י בְעָלָ֑י/ו אֶֽל כָּל אֲשֶׁ֖ר יִפְנֶ֣ה יַשְׂכִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/008.yaml
  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
translation:
  language: pt
  text: O suborno é uma pedra que traz favor aos olhos de quem o possui[a]; para onde quer que ele se volte, prospera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “uma pedra preciosa”, “uma pedra encantada” ou “um amuleto da sorte”. Hebraico: “uma pedra de favor”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “tem sucesso”. O verbo hebraico pode indicar agir com êxito ou prosperar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  choice: uma pedra que traz favor
  rationale: A expressão significa literalmente “pedra de favor/graça”. A tradução mantém a imagem concreta da pedra e comunica sua aparente capacidade de obter boa vontade ou vantagem, sem definir se se trata de uma pedra preciosa, mágica ou de um amuleto.
- source_word: הַשֹּׁחַד
  choice: o suborno
  rationale: O substantivo normalmente designa pagamento corruptor, não um presente neutro. “Suborno” expressa com clareza o sentido predominante neste contexto sapiencial.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva de modo natural em português o idioma hebraico que indica avaliação ou perspectiva.
- source_word: בְעָלָיו
  choice: quem o possui
  rationale: O sufixo remete ao suborno e designa seu possuidor, provavelmente aquele que dispõe dele para oferecê-lo. A formulação evita a rigidez de “seu dono” sem acrescentar uma relação social inexistente no texto.
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  choice: para onde quer que ele se volte
  rationale: Reproduz naturalmente a ideia abrangente de toda direção, situação ou iniciativa à qual o possuidor do suborno se dirige.
- source_word: יַשְׂכִּיל
  choice: prospera
  rationale: Neste contexto, o hifil de שׂכל indica obter êxito ou agir eficazmente. “Prospera” comunica o resultado prático atribuído ao suborno, enquanto a alternativa “tem sucesso” é registrada em nota.
theological_decisions:
- issue: Descrição do efeito do suborno
  choice: Manter a afirmação proverbial sem inserir condenação explícita
  alternative: Acrescentar linguagem que indique que o sucesso é apenas aparente ou moralmente condenado
  rationale: O versículo descreve, do ponto de vista de quem possui o suborno, sua eficácia percebida. Embora “suborno” já carregue conotação negativa, o hebraico não acrescenta neste verso uma avaliação moral explícita; por isso, a tensão ética é preservada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A imagem hebraica da pedra foi preservada, mas a expressão foi formulada de modo inteligível. O pronome “ele” explicita que o sujeito da segunda oração é quem possui o suborno, conforme a leitura contextual mais provável.
