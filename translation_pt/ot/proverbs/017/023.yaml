  text: שֹׁ֣חַד מֵ֭/חֵיק רָשָׁ֣ע יִקָּ֑ח לְ֝/הַטּ֗וֹת אָרְח֥וֹת מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/023.yaml
  text: A wicked man takes a bribe from the bosom to pervert the paths of justice[a][b].
translation:
  language: pt
  text: O perverso aceita um suborno tirado do colo, para desviar os caminhos da justiça[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do colo” ou “do seio”; a imagem provavelmente se refere à dobra da roupa, de onde algo era tirado ou mantido oculto, sugerindo segredo.
    reason: lexical_alternative
  - marker: b
    text: Ou “o curso da justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: suborno
  rationale: O substantivo designa um pagamento ilícito destinado a influenciar uma decisão ou conduta; “suborno” é o equivalente português claro e natural neste contexto judicial.
- source_word: מֵחֵיק
  choice: às escondidas
  rationale: Literalmente, a expressão significa “do colo” ou “do peito”, evocando a dobra da roupa onde algo podia ser ocultado. No texto principal, “às escondidas” comunica naturalmente a ideia contextual de uma transação secreta, enquanto a nota preserva a imagem concreta.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado descreve uma pessoa moralmente perversa. O singular genérico e a concisão proverbial são preservados.
- source_word: יִקָּח
  choice: aceita
  rationale: Embora o verbo comum signifique “tomar”, no contexto de suborno “aceita” expressa com precisão e naturalidade o ato de receber a propina.
- source_word: לְהַטּוֹת
  choice: para desviar
  rationale: O infinitivo indica fazer algo afastar-se do rumo correto. “Desviar” mantém a metáfora de caminhos e comunica a corrupção da justiça.
- source_word: אָרְחוֹת
  choice: as veredas
  rationale: O plural significa “caminhos” ou “veredas”. “Veredas” preserva a imagem poética e sapiencial do hebraico em registro digno.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No contexto de suborno e corrupção judicial, refere-se à justiça ou ao processo justo, mais do que apenas a uma sentença específica.
- source_word: אָרְחוֹת מִשְׁפָּט
  choice: as veredas da justiça
  rationale: A formulação conserva a metáfora plural do hebraico; a nota registra a alternativa idiomática “o curso da justiça”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução combina naturalidade no gesto secreto (“às escondidas”) com a preservação, em nota, da imagem hebraica do colo ou peito; “veredas da justiça” mantém a metáfora sapiencial do original.
