  text: עִקֶּשׁ לֵ֭ב לֹ֣א יִמְצָא ט֑וֹב וְ/נֶהְפָּ֥ךְ בִּ֝/לְשׁוֹנ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: pt
  text: Quem tem o coração tortuoso não encontra o bem, e quem tem a língua perversa cai na desgraça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  choice: quem tem o coração tortuoso
  rationale: Expressa a ideia de um coração moralmente distorcido, preservando a metáfora hebraica com linguagem natural em português.
- source_word: לֹא יִמְצָא טוֹב
  choice: não encontra o bem
  rationale: 'Tradução direta que mantém a possível amplitude de טוֹב: aquilo que é bom, benéfico ou favorável.'
- source_word: וְנֶהְפָּךְ בִּלְשׁוֹנוֹ
  choice: e quem tem a língua perversa
  rationale: נֶהְפָּךְ indica algo retorcido ou invertido; aplicado à língua, descreve fala perversa ou enganosa. A formulação evita a expressão pouco natural 'retorcido em sua língua'.
- source_word: יִפּוֹל בְּרָעָה
  choice: cai na desgraça
  rationale: Mantém a imagem verbal de cair e traduz רָעָה, neste contexto consequencial, como calamidade ou desgraça, sem restringi-la meramente a 'problemas'.
theological_decisions:
- issue: Sentido de טוֹב e רָעָה no paralelismo
  choice: o bem / a desgraça
  alternative: prosperidade / mal
  rationale: A escolha preserva o contraste amplo entre bem e adversidade sem transformar o provérbio em promessa específica de prosperidade nem reduzir רָעָה exclusivamente ao mal moral.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. 'Coração tortuoso' conserva a antropologia metafórica do hebraico; 'língua perversa' soa natural e comunica fala moralmente distorcida.
