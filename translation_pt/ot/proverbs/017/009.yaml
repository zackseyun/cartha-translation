base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/009.yaml
  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
translation:
  language: pt
  text: Quem encobre[a] uma ofensa busca o amor, mas quem volta a falar no assunto separa amigos íntimos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encobre uma transgressão”. O hebraico conserva a metáfora de cobrir, em vez de declarar explicitamente o perdão.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “separa um amigo íntimo”, no singular. O plural expressa com naturalidade o sentido geral do provérbio. “Volta a falar no assunto” também pode ser traduzido como “repete o assunto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: encobre
  rationale: Preserva a metáfora hebraica de cobrir sem explicitar além do texto a ideia de perdoar; no contexto, indica não expor nem ficar remoendo a falta.
- source_word: פֶּשַׁע
  choice: uma ofensa
  rationale: Embora possa significar transgressão ou rebeldia, aqui designa naturalmente uma falta no âmbito das relações pessoais.
- source_word: מְבַקֵּשׁ
  choice: busca
  rationale: Equivalente direto e conciso do particípio hebraico, preservando a lógica moral do provérbio.
- source_word: אַהֲבָה
  choice: o amor
  rationale: Mantém o sentido amplo do substantivo hebraico sem restringi-lo prematuramente a amizade ou afeição.
- source_word: שֹׁנֶה
  choice: volta a falar
  rationale: No contexto de דָבָר, comunica de modo natural a ideia de retomar ou trazer novamente à conversa uma ofensa passada.
- source_word: בְדָבָר
  choice: no assunto
  rationale: דָבָר pode significar palavra, questão ou assunto; aqui se refere naturalmente ao caso ou ofensa retomado.
- source_word: מַפְרִיד
  choice: separa
  rationale: Reproduz diretamente o sentido causativo de provocar separação.
- source_word: אַלּוּף
  choice: amigos íntimos
  rationale: Expressa em português corrente a ideia de companheiro muito próximo; o plural comunica naturalmente a força genérica do singular hebraico.
