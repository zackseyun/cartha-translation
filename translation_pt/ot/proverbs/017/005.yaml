language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹעֵ֣ג לָ֭/רָשׁ חֵרֵ֣ף עֹשֵׂ֑/הוּ שָׂמֵ֥חַ לְ֝/אֵ֗יד לֹ֣א יִנָּקֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/005.yaml
  text: Whoever mocks the poor insults his Maker[c][b][a]; he who rejoices at calamity will not go unpunished.
translation:
  language: pt
  text: Quem zomba do pobre insulta aquele que o fez; quem se alegra com a desgraça não ficará impune.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será considerado inocente” ou “não será absolvido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹעֵג
  choice: zomba
  rationale: O particípio expressa escárnio ou zombaria. “Zomba” é corrente, conciso e preserva o desprezo ativo do hebraico.
- source_word: לָרָשׁ
  choice: do pobre
  rationale: רָשׁ designa uma pessoa pobre ou necessitada. O singular “do pobre” preserva a forma proverbial e o referente retomado pelo sufixo seguinte.
- source_word: חֵרֵף
  choice: insulta
  rationale: O verbo significa censurar, afrontar ou tratar com desprezo. “Insulta” comunica com clareza a afronta, sem impor o sentido cultual mais específico de blasfemar.
- source_word: עֹשֵׂהוּ
  choice: aquele que o fez
  rationale: A forma participial com sufixo significa literalmente “aquele que o fez”. Esta formulação natural mantém explícito que o Criador do pobre é afrontado, sem acrescentar ao texto o nome “Deus”.
- source_word: שָׂמֵחַ
  choice: se alegra
  rationale: A forma descreve a atitude de sentir alegria. “Se alegra” é natural em português e preserva a postura moral condenada pelo provérbio.
- source_word: לְאֵיד
  choice: com a desgraça
  rationale: אֵיד denota calamidade, desastre ou ruína. “Desgraça” é clara e abrangente, e a construção “alegrar-se com” soa natural em português.
- source_word: לֹא יִנָּקֶה
  choice: não ficará impune
  rationale: O nifal de נקה pode indicar ser considerado inocente ou escapar de punição. Neste contexto sapiencial, “não ficará impune” comunica de modo direto a consequência judicial e moral.
theological_decisions:
- issue: Referente de “aquele que o fez”
  choice: 'O sufixo remete naturalmente ao pobre: zombar dele é insultar aquele que o criou.'
  alternative: Traduzir de forma titular como “seu Criador”, enfatizando mais explicitamente a identidade divina.
  rationale: A tradução preserva a relação possessiva e a teologia da dignidade humana fundada no ato criador, mas evita explicitar além do hebraico o nome do Criador.
- issue: Alcance genérico das formas masculinas
  choice: Empregar “quem”, forma inclusiva e natural, mantendo “o pobre” no singular gramatical.
  alternative: Usar “aquele que” em ambas as orações, reproduzindo mais visivelmente o masculino singular proverbial.
  rationale: “Quem” expressa adequadamente o valor genérico dos particípios masculinos hebraicos sem restringir a aplicação a homens e sem perder a concisão proverbial.
translation_notes:
  register: Português moderno, digno e acessível, com cadência proverbial. “Aquele que o fez” preserva de perto עֹשֵׂהוּ e evita tanto uma formulação arcaica quanto uma explicitação interpretativa desnecessária. O marcador [a] aparece junto à expressão à qual se refere.
