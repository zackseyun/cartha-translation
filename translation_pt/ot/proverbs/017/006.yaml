source:
  edition: WLC
  text: עֲטֶ֣רֶת זְ֭קֵנִים בְּנֵ֣י בָנִ֑ים וְ/תִפְאֶ֖רֶת בָּנִ֣ים אֲבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
translation:
  language: pt
  text: 'Os netos[a] são a coroa dos idosos[b],

    e a glória dos filhos são seus pais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos dos filhos”.
    reason: lexical_alternative
  - marker: b
    text: Também poderia ser traduzido por “homens idosos”; o hebraico se refere a pessoas de idade avançada, não necessariamente a anciãos com função de liderança.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: Preserva a metáfora hebraica de distinção e honra e forma um paralelo elevado com “glória”.
- source_word: זְקֵנִים
  choice: idosos
  rationale: Neste provérbio, o termo designa pessoas de idade avançada, sem indicar necessariamente anciãos investidos de uma função comunitária.
- source_word: בְּנֵי בָנִים
  choice: netos
  rationale: A expressão literal “filhos dos filhos” é a maneira idiomática hebraica de dizer “netos”; a forma portuguesa é clara e natural.
- source_word: תִפְאֶרֶת
  choice: glória
  rationale: O substantivo pode exprimir glória, esplendor ou honra. “Glória” conserva o tom elevado e o paralelismo com “coroa”.
- source_word: בָּנִים
  choice: filhos
  rationale: O masculino plural hebraico se refere aqui aos descendentes na relação familiar. “Filhos” mantém a forma de parentesco do texto sem tornar a frase artificial.
- source_word: אֲבוֹתָם
  choice: seus pais
  rationale: O hebraico emprega o termo masculino para “pais”. Em português, “pais” é a correspondência lexical natural, embora também possa ser entendido coletivamente como pai e mãe; a nota preserva a especificidade da forma hebraica.
theological_decisions:
- issue: Termos familiares marcados por gênero em um provérbio de aplicação geral
  choice: Traduzir בְּנֵי בָנִים idiomaticamente por “netos”, בָּנִים por “filhos” e אֲבוֹתָם por “seus pais”, esclarecendo em nota que o último termo é masculino no hebraico.
  alternative: Empregar “descendentes” e “progenitores” para generalizar os termos, ou “filhos homens” e “seus pais homens” para explicitar rigidamente o gênero.
  rationale: A formulação escolhida preserva as relações entre gerações e a marca masculina onde ela aparece, sem impor uma limitação doutrinária ausente do provérbio nem produzir português pouco natural.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial paralela. “Netos” e “idosos” favorecem a compreensão imediata; “coroa” e “glória” preservam as metáforas e o tom elevado do hebraico.
