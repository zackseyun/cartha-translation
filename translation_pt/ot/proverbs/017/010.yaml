base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/010.yaml
  text: A rebuke goes deeper into a man of understanding than a hundred blows into a fool[a].
translation:
  language: pt
  text: A repreensão penetra mais fundo em quem tem entendimento do que cem golpes em um insensato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma repreensão causa mais efeito em quem entende do que golpear cem vezes um insensato.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּחַת
  choice: penetra mais fundo
  rationale: O verbo נחת comunica a ideia de descer ou penetrar; no contexto, descreve o efeito profundo da repreensão e preserva naturalmente a comparação introduzida por מִן.
- source_word: גְּעָרָה
  choice: a repreensão
  rationale: O substantivo indica uma correção verbal firme. “Repreensão” é claro, digno e corrente em português.
- source_word: בְמֵבִין
  choice: em quem tem entendimento
  rationale: O particípio מֵבִין designa alguém que entende ou discerne. Esta formulação natural preserva o sentido proverbial sem restringir indevidamente sua aplicação.
- source_word: מֵהַכּוֹת
  choice: do que cem golpes em
  rationale: O מִן marca a comparação, e o infinitivo de נכה exprime golpear. A redação conserva a imagem concreta e relaciona os golpes ao insensato.
- source_word: כְּסִיל
  choice: um insensato
  rationale: Em Provérbios, כְּסִיל é o termo característico para a pessoa moral e intelectualmente obstinada. “Insensato” preserva esse sentido sapiencial sem sugerir apenas pouca inteligência.
- source_word: מֵאָה
  choice: cem
  rationale: O numeral reforça hiperbolicamente o contraste e é vertido pela forma portuguesa natural.
