  text: יֹלֵ֣ד כְּ֭סִיל לְ/ת֣וּגָה ל֑/וֹ וְ/לֹֽא יִ֝שְׂמַ֗ח אֲבִ֣י נָבָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
translation:
  language: pt
  text: Quem gera um tolo o faz para sua própria tristeza[a], e o pai de uma pessoa vil[b] não terá alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem gera um tolo o gera para a tristeza.” A construção hebraica é compacta e admite esta tradução mais formal.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “pessoa vil” descreve alguém moralmente vergonhoso ou desprezível, não apenas alguém sem inteligência.
    reason: cultural_note
lexical_decisions:
- source_word: יֹלֵד
  choice: Quem gera
  rationale: O particípio qal funciona como substantivo, isto é, “aquele que gera”. O paralelismo com “pai” favorece o sentido paterno, enquanto “quem gera” é natural e conciso em português.
- source_word: כְּסִיל
  choice: um tolo
  rationale: Termo característico da literatura sapiencial para alguém obstinado moral e intelectualmente, e não apenas de pouca inteligência. “Tolo” preserva esse sentido tradicional e contextual.
- source_word: לְתוּגָה לוֹ
  choice: para sua própria tristeza
  rationale: תוגה indica tristeza, pesar ou aflição; o pronome לוֹ remete a quem gera. A formulação comunica naturalmente que o resultado recai sobre o próprio pai.
- source_word: וְלֹא יִשְׂמַח
  choice: não terá alegria
  rationale: O imperfeito expressa a consequência geral em estilo proverbial. A construção mantém a ideia de não se alegrar sem limitar o enunciado a um único momento.
- source_word: אֲבִי
  choice: o pai de
  rationale: A forma construta é completada pelo substantivo seguinte. Em português, “o pai de” transmite de modo idiomático o valor genérico do provérbio.
- source_word: נָבָל
  choice: uma pessoa vil
  rationale: נבל descreve alguém moralmente baixo, vergonhoso ou desprezível, não apenas intelectualmente insensato. “Pessoa vil” preserva a dimensão ética e distingue o termo de כְּסִיל no primeiro membro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo poético foi mantido, e os dois termos hebraicos para tipos distintos de insensatez foram diferenciados.
