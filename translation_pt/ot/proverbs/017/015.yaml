source:
  edition: WLC
  text: מַצְדִּ֣יק רָ֭שָׁע וּ/מַרְשִׁ֣יעַ צַדִּ֑יק תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/015.yaml
  text: The one who acquits the wicked and the one who condemns the righteous—both alike are an abomination to Yahweh[a].
translation:
  language: pt
  text: Quem absolve o perverso e quem condena o justo — ambos são uma abominação para Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem declara justo o perverso e quem declara culpado o justo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְדִּיק
  choice: quem absolve
  rationale: O particípio hifil de צדק tem aqui sentido forense, confirmado pelo contraste paralelo com “condena”. “Absolve” expressa com clareza uma decisão judicial favorável sem introduzir conotações doutrinárias posteriores de “justificar”.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Designa uma pessoa moralmente culpável. “O perverso” preserva a dimensão ética do hebraico, enquanto “o culpado” restringiria o sentido ao âmbito estritamente jurídico.
- source_word: וּמַרְשִׁיעַ
  choice: e quem condena
  rationale: O particípio hifil de רשע, em uso judicial, significa declarar culpado ou condenar. “Condena” forma uma antítese natural e precisa com “absolve”.
- source_word: צַדִּיק
  choice: o justo
  rationale: Refere-se à pessoa que está com a razão e é justa. “O justo” conserva simultaneamente as ressonâncias ética e forense, ao passo que “o inocente” seria mais estreito.
- source_word: תּוֹעֲבַת
  choice: abominação
  rationale: Termo moral forte para aquilo que é repugnante a Deus. “Abominação” preserva a intensidade e a força bíblica do substantivo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: גַּם שְׁנֵיהֶם
  choice: ambos
  rationale: A expressão inclui enfaticamente as duas pessoas e suas ações na mesma avaliação divina. Em português, “ambos” comunica essa inclusão com concisão natural.
theological_decisions:
- issue: Sentido forense ou transformativo dos verbos derivados de צדק e רשע
  choice: 'Linguagem judicial: “absolve” e “condena”'
  alternative: Sentido moral mais geral, como “trata como justo” e “trata como perverso”
  rationale: Os particípios hifil emparelhados constituem uma antítese de tribunal comum em contextos legais e sapienciais. A formulação judicial preserva o sentido imediato e evita importar para “justificar” uma elaboração doutrinária que o provérbio não explicita.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “Perverso” foi preferido a “ímpio” por ser amplamente compreensível e conservar o caráter moral do termo. O travessão marca a conclusão enfática; a nota mantém a alternativa forense mais literal.
