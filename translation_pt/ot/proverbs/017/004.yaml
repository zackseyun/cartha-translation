  text: מֵ֭רַע מַקְשִׁ֣יב עַל שְׂפַת אָ֑וֶן שֶׁ֥קֶר מֵ֝זִין עַל לְשׁ֥וֹן הַוֺּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/004.yaml
  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
translation:
  language: pt
  text: O malfeitor dá ouvidos a lábios perversos[a]; o mentiroso escuta a língua destrutiva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O malfeitor escuta lábios de iniquidade; a falsidade dá ouvidos a uma língua de ruína.” O hebraico permite uma tradução mais literal em que “falsidade” é entendida de forma abstrata, e não como “o mentiroso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרַע
  choice: o malfeitor
  rationale: O termo funciona como substantivo e designa alguém caracterizado pela prática do mal. “Malfeitor” preserva a força moral e é claro em português.
- source_word: מַקְשִׁיב עַל
  choice: dá ouvidos a
  rationale: A construção indica escuta atenta ou receptiva. “Dá ouvidos a” expressa naturalmente em português a disposição culpável de acolher esse discurso.
- source_word: שְׂפַת אָוֶן
  choice: lábios perversos
  rationale: “Lábios” é mantido como metonímia da fala; אָוֶן pode indicar maldade, iniquidade ou dano. “Perversos” comunica aqui o caráter moralmente corrupto do discurso.
- source_word: שֶׁקֶר
  choice: o mentiroso
  rationale: Embora a forma denote literalmente “falsidade” ou “mentira”, o paralelismo com “malfeitor” favorece o uso substantivado para a pessoa caracterizada pela mentira. A leitura abstrata permanece na nota.
- source_word: מֵזִין עַל
  choice: escuta
  rationale: O Hifil de אזן significa dar ouvidos, escutar atentamente. A formulação simples preserva o paralelismo sem tornar o verso artificial.
- source_word: לְשׁוֹן הַוֺּת
  choice: a língua destrutiva
  rationale: “Língua” representa a fala, enquanto הַוּוֹת aponta para ruína, calamidades ou ações destrutivas. “Destrutiva” transmite de modo conciso a capacidade nociva desse discurso.
theological_decisions: []
