  text: לָ/מָּה זֶּ֣ה מְחִ֣יר בְּ/יַד כְּסִ֑יל לִ/קְנ֖וֹת חָכְמָ֣ה וְ/לֶב אָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/016.yaml
  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
translation:
  language: pt
  text: Por que há dinheiro nas mãos do insensato para comprar sabedoria, se ele não tem entendimento?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e não há coração”. Em hebraico, “coração” pode designar a faculdade interior de compreender, julgar ou querer.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Por que há
  rationale: Introduz uma pergunta retórica. A formulação existencial é natural em português e comunica adequadamente o valor idiomático da expressão hebraica.
- source_word: מְחִיר
  choice: dinheiro
  rationale: O termo designa o preço ou os recursos para uma compra. Neste contexto, “dinheiro” expressa de modo natural o meio de compra que está nas mãos do insensato, sem abandonar a imagem comercial.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Preserva a imagem hebraica de algo disponível ou sob o controle de alguém; o plural é a forma idiomática usual em português.
- source_word: כְּסִיל
  choice: insensato
  rationale: Termo tradicional e claro em Provérbios para a pessoa moral e intelectualmente obstinada, não apenas alguém com pouca inteligência.
- source_word: לִקְנוֹת
  choice: para comprar
  rationale: Mantém o sentido comercial de קנה e sua ligação direta com מְחִיר.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente central e consagrado para a sabedoria moral e prática no livro de Provérbios.
- source_word: וְלֶב אָיִן
  choice: se ele não tem entendimento
  rationale: Torna inteligível o sentido antropológico de לֵב, que aqui abrange a faculdade interior de compreender e julgar. A nota conserva a imagem literal e sua amplitude.
theological_decisions: []
