  text: אֹ֣הֵֽב פֶּ֭שַׁע אֹהֵ֣ב מַצָּ֑ה מַגְבִּ֥יהַּ פִּ֝תְח֗/וֹ מְבַקֶּשׁ שָֽׁבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/019.yaml
  text: Whoever loves transgression loves strife[a]; he who makes his door high seeks destruction.
translation:
  language: pt
  text: Quem ama a transgressão ama a discórdia; quem torna alta a sua entrada[a] busca a ruína.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porta” ou “portão”. A imagem pode aludir à exaltação arrogante, à ostentação arquitetônica ou a uma construção que acaba propiciando o desastre; o sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: ama
  rationale: O particípio qal de אָהַב expressa amor, apego ou prazer em algo. “Ama” mantém a força moral e a repetição deliberada dos dois primeiros membros.
- source_word: פֶּשַׁע
  choice: transgressão
  rationale: O termo costuma indicar violação deliberada, delito ou rebeldia, não um simples erro. “Transgressão” preserva sua gravidade ética sem restringir indevidamente o sentido.
- source_word: מַצָּה
  choice: discórdia
  rationale: O substantivo designa contenda, conflito ou disputa. “Discórdia” é natural em português, concisa e adequada ao alcance geral do provérbio.
- source_word: מַגְבִּיהַּ
  choice: torna alta
  rationale: O particípio hifil de גבה significa fazer ficar alto ou elevar. A formulação conserva a imagem concreta e incomum do hebraico, sem decidir que se trata apenas de uma metáfora de orgulho.
- source_word: פִּתְחוֹ
  choice: a sua entrada
  rationale: פֶּתַח pode designar abertura, entrada, vão de porta ou portão. “Entrada” conserva essa amplitude melhor do que uma escolha arquitetônica mais específica.
- source_word: מְבַקֶּשׁ
  choice: busca
  rationale: O particípio de בקש significa procurar ou buscar. No provérbio, a expressão sugere ironicamente que tal pessoa atrai para si o resultado, mas “busca” preserva a formulação direta do original.
- source_word: שָׁבֶר
  choice: ruína
  rationale: שֶׁבֶר pode significar quebra, colapso, calamidade ou destruição. “Ruína” comunica tanto o desastre quanto a possível ressonância de colapso e combina naturalmente com “busca”.
theological_decisions:
- issue: Sentido da entrada tornada alta
  choice: Manter a imagem concreta e explicar sua incerteza em nota
  alternative: Interpretar diretamente como arrogância, ostentação ou construção imprudente
  rationale: O texto hebraico não explicita a referência da imagem. Preservá-la evita transformar uma possível implicação moral ou arquitetônica em interpretação exclusiva.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A repetição de “ama” e “busca” preserva a força proverbial; “torna alta a sua entrada” mantém a estranheza significativa da imagem hebraica sem a explicar no corpo do versículo.
