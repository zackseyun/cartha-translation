base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
translation:
  language: pt
  text: A fala elevada[a] não convém ao insensato; muito menos convêm lábios mentirosos a uma pessoa nobre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fala grandiosa” ou “fala excessiva”. A expressão hebraica pode indicar uma fala elevada, superior ou exagerada.
    reason: lexical_alternative
  - marker: b
    text: Ou “um príncipe” ou “uma pessoa generosa”. O termo hebraico pode indicar posição nobre ou caráter nobre.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  choice: não convém
  rationale: Expressa de modo natural e digno a ideia de algo que não é apropriado ou condizente.
- source_word: נָבָל
  choice: insensato
  rationale: Em Provérbios, designa alguém moral e intelectualmente falho, não apenas uma pessoa de pouca inteligência; “insensato” preserva essa força no português bíblico corrente.
- source_word: שְׂפַת יֶתֶר
  choice: fala elevada
  rationale: Mantém a imagem de “lábio/fala” e a amplitude de יֶתֶר, que pode sugerir discurso elevado, grandioso ou excessivo, sem decidir que a fala seja necessariamente excelente em sentido moral.
- source_word: אַף כִּי
  choice: muito menos
  rationale: Reproduz com clareza a progressão comparativa, ou argumento a fortiori, entre os dois membros do provérbio.
- source_word: נָדִיב
  choice: uma pessoa nobre
  rationale: Preserva a possível referência tanto à posição social quanto ao caráter honrado, sem limitar o termo a “príncipe” nem explicitar gênero onde o português não exige.
- source_word: שְׂפַת שָׁקֶר
  choice: lábios mentirosos
  rationale: Conserva a imagem concreta hebraica e transmite idiomaticamente a ideia de fala falsa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo foi mantido, assim como a progressão enfática de “muito menos”. “Pessoa nobre” evita uma formulação pesada e conserva a ambiguidade entre nobreza social e moral.
