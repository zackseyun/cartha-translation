  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יֹ֣אכַל ט֑וֹב וְ/נֶ֖פֶשׁ בֹּגְדִ֣ים חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/002.yaml
  text: From the fruit of a man's mouth he eats good[b][a], but the soul of the treacherous feeds on violence.
translation:
  language: pt
  text: Do fruto de sua boca, o homem come o que é bom; mas o apetite dos traiçoeiros é violência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico conciso e sem verbo no segundo membro. Literalmente, “mas a alma dos traiçoeiros, violência”; também pode ser entendido como “a alma dos traiçoeiros se alimenta de violência”. Aqui, “alma” (néfesh) tem provavelmente o sentido de “apetite” ou “desejo”.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: מִפְּרִי פִי
  choice: Do fruto de sua boca
  rationale: Preserva a imagem concreta hebraica do “fruto” produzido pela boca, isto é, os resultados da fala, e traduz מִן como indicação de origem.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém a forma masculina singular e representativa do provérbio hebraico, que aqui formula uma verdade geral.
- source_word: יֹאכַל טוֹב
  choice: come o que é bom
  rationale: O imperfeito tem valor habitual ou gnômico. A formulação conserva a metáfora de comer e expressa naturalmente o adjetivo substantivado טוֹב sem restringir seu sentido amplo.
- source_word: וְנֶפֶשׁ
  choice: mas o apetite
  rationale: נֶפֶשׁ pode designar vida, pessoa, alma, desejo ou apetite. Neste contexto elíptico, “apetite” produz uma relação natural com “violência”; “mas” explicita o contraste entre os dois membros.
- source_word: בֹּגְדִים
  choice: dos traiçoeiros
  rationale: O particípio plural descreve pessoas caracterizadas por agir com deslealdade ou perfídia; “traiçoeiros” preserva essa força sem limitar o termo a traição política.
- source_word: חָמָס
  choice: violência
  rationale: É a equivalência direta e abrangente para violência, brutalidade ou injustiça violenta, mantendo a concisão do hebraico.
theological_decisions:
- issue: Sentido de נֶפֶשׁ e elipse verbal no segundo membro
  choice: “o apetite dos traiçoeiros é violência”
  alternative: “a alma dos traiçoeiros se alimenta de violência”
  rationale: O hebraico traz literalmente algo como “mas a nephesh dos traiçoeiros, violência”, sem verbo expresso. “Apetite” é um sentido contextual legítimo de נֶפֶשׁ e permite conservar a concisão e a tensão da oração nominal; a nota registra tanto o valor literal quanto a possibilidade de suprir um verbo ligado ao ato de comer.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se a metáfora hebraica do fruto e do comer; evita-se explicar “o que é bom” como prosperidade ou recompensa específica. A formulação do segundo membro conserva a concisão proverbial, com nota para a ambiguidade lexical e sintática.
