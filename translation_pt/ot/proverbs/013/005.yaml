  yaml_path: translation/ot/proverbs/013/005.yaml
  text: A righteous man hates a lying word[b][a], but a wicked man acts shamefully and disgracefully.
translation:
  language: pt
  text: O justo odeia uma palavra mentirosa, mas o perverso se torna odioso e cai em desonra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mas o perverso age de modo repugnante e vergonhoso». Os dois últimos verbos também podem ser entendidos como descrevendo a conduta vergonhosa do perverso, em vez de ele se tornar odioso e cair em desonra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  choice: a palavra mentirosa
  rationale: Preserva a expressão concreta no singular, literalmente «palavra de falsidade», e comunica de modo natural uma declaração falsa ou enganosa.
- source_word: יִשְׂנָא
  choice: odeia
  rationale: Equivalente direto do qal de שׂנא, expressando forte aversão moral.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo masculino singular substantivado apresenta o tipo proverbial; «o justo» é corrente, digno e inclusivo em sentido representativo.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Mantém o substantivo masculino singular em paralelo antitético com «o justo» e expressa a condição moral indicada pelo hebraico.
- source_word: יַבְאִישׁ
  choice: se torna repugnante
  rationale: Comunica o sentido de tornar-se malcheiroso ou odioso sem impor em português uma imagem física estranha ao uso moral do contexto.
- source_word: וְיַחְפִּיר
  choice: e cai em desonra
  rationale: Expressa a leitura intransitiva de chegar à vergonha, mantendo em nota a possibilidade de os verbos descreverem conduta vergonhosa.
