base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/003.yaml
  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
translation:
  language: pt
  text: Quem guarda a boca preserva a própria vida[a]; quem abre demais os lábios vai à ruína[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sua vida” (néfesh). O termo também pode significar “alma” ou “a própria pessoa”, mas aqui se refere mais naturalmente à vida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “traz destruição sobre si” ou “é ruína para si”. A expressão hebraica é concisa e admite traduções próximas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: guarda
  rationale: O particípio expressa vigilância e contenção contínuas; “guarda” é natural em português e mantém a imagem concreta.
- source_word: פִּיו
  choice: a boca
  rationale: Tradução direta que preserva a imagem hebraica e forma um paralelismo natural com “os lábios”.
- source_word: שֹׁמֵר
  choice: preserva
  rationale: 'Embora o verbo normalmente signifique “guardar”, com נַפְשׁוֹ indica o resultado de controlar a fala: conservar ou proteger a própria vida.'
- source_word: נַפְשׁוֹ
  choice: a própria vida
  rationale: Neste contexto sapiencial, נֶפֶשׁ designa mais naturalmente a vida ou a própria pessoa, não especificamente uma alma imaterial.
- source_word: פֹּשֵׂק
  choice: escancara
  rationale: Expressa vividamente a ideia de abrir muito ou deixar sem contenção, preservando a metáfora concreta da fala desenfreada.
- source_word: שְׂפָתָיו
  choice: os lábios
  rationale: Mantém a imagem literal e o paralelismo poético entre boca e lábios.
- source_word: מְחִתָּה לוֹ
  choice: caminha para a ruína
  rationale: A expressão hebraica é compacta e elíptica. Esta formulação portuguesa comunica uma consequência desastrosa para a própria pessoa sem tornar a sintaxe artificial.
theological_decisions:
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma; a si mesmo
  rationale: “Vida” se ajusta ao contexto de sabedoria prática e evita impor uma distinção antropológica posterior que o termo não exige aqui.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura antitética e as imagens concretas de “boca” e “lábios” foram preservadas. “Escancara” comunica fala sem freio de modo corrente, sem substituir a metáfora por uma explicação.
