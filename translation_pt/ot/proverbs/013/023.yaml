  text: רָב אֹ֭כֶל נִ֣יר רָאשִׁ֑ים וְ/יֵ֥שׁ נִ֝סְפֶּ֗ה בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
translation:
  language: pt
  text: O campo recém-lavrado dos pobres[b] produz alimento em abundância, mas há quem seja arruinado por falta de justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas há o que se perde sem justiça”. O segundo membro do texto hebraico é conciso e também admite uma tradução mais impessoal.'
    reason: alternative_reading
  - marker: b
    text: “Campo recém-lavrado” também pode ser traduzido por “terra não cultivada” ou “terra arável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אֹכֶל
  choice: alimento em abundância
  rationale: Expressa naturalmente a grande quantidade de alimento ou produção comestível indicada pela construção hebraica, sem limitar o sentido a uma cultura específica.
- source_word: נִיר
  choice: campo recém-lavrado
  rationale: Designa terra arável lavrada ou recentemente revolvida. Esta opção comunica com clareza a imagem agrícola; a nota preserva as alternativas possíveis.
- source_word: רָאשִׁים
  choice: dos pobres
  rationale: Embora a forma hebraica seja incomum, o entendimento tradicional e contextual é de pessoas pobres ou necessitadas.
- source_word: וְיֵשׁ
  choice: mas há quem
  rationale: Mantém a construção existencial e o contraste entre os dois membros do provérbio, sem impor um número definido de pessoas.
- source_word: נִסְפֶּה
  choice: seja arruinado
  rationale: O particípio nifal indica alguém que perece, é destruído ou levado à ruína. 'Seja arruinado' preserva a voz passiva e funciona naturalmente com 'há quem'.
- source_word: בְּלֹא מִשְׁפָּט
  choice: por falta de justiça
  rationale: Comunica a ausência de justiça, julgamento justo ou ordem jurídica como circunstância ou causa da ruína, preservando a força ético-social de מִשְׁפָּט.
theological_decisions:
- issue: Interpretação do segundo membro do provérbio
  choice: O texto contrasta a produtividade do campo dos pobres com a ruína que ocorre por falta de justiça.
  alternative: Entender impessoalmente que algo, talvez a produção agrícola, se perde sem juízo adequado ou por má administração.
  rationale: בְּלֹא מִשְׁפָּט aponta naturalmente para a ausência de justiça ou julgamento, e נִסְפֶּה permite referência pessoal. Contudo, a concisão do hebraico deixa o sujeito implícito; a nota preserva uma tradução mais impessoal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para uma formulação proverbial natural. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
