source:
  edition: WLC
  text: תּוֹחֶ֣לֶת מְ֭מֻשָּׁכָה מַחֲלָה לֵ֑ב וְ/עֵ֥ץ חַ֝יִּ֗ים תַּאֲוָ֥ה בָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/012.yaml
  text: Hope deferred makes the heart sick[a], but a desire fulfilled is a tree of life.
translation:
  language: pt
  text: A esperança adiada deixa o coração doente,[a] mas o desejo realizado é árvore de vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “A esperança prolongada é doença do coração, e o desejo que chega é árvore de vida.”'
    reason: Alternativa lexical e estrutural mais literal, que preserva a oração nominal e o valor formal da conjunção hebraica.
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: esperança
  rationale: O substantivo indica expectativa esperançosa. “Esperança” é natural em português e mantém o contraste com o desejo realizado.
- source_word: מְמֻשָּׁכָה
  choice: adiada
  rationale: O termo significa literalmente “prolongada” ou “arrastada”. “Adiada” comunica com clareza que a esperança demora a se concretizar.
- source_word: מַחֲלָה לֵב
  choice: deixa o coração doente
  rationale: O hebraico forma uma oração nominal, literalmente “doença do coração”. A formulação verbal é idiomática em português e conserva a imagem.
- source_word: וְעֵץ חַיִּים
  choice: mas ... árvore de vida
  rationale: Embora ו seja formalmente “e”, aqui introduz o segundo membro contrastante do paralelismo. Conserva-se a importante imagem bíblica “árvore de vida”.
- source_word: תַּאֲוָה
  choice: o desejo
  rationale: “Desejo” mantém o sentido amplo e neutro do substantivo neste contexto sapiencial, sem a conotação necessariamente negativa de “cobiça”.
- source_word: בָאָה
  choice: realizado
  rationale: Literalmente, o desejo “vem” ou “chega”. “Realizado” expressa em português natural a concretização do que se desejava, sem mudar o sentido contextual.
theological_decisions:
- issue: Sentido da conjunção ו antes de עֵץ חַיִּים
  choice: mas
  alternative: e
  rationale: A conjunção hebraica é literalmente “e”, porém o paralelismo entre a esperança prolongada e o desejo concretizado é antitético. “Mas” torna esse contraste claro em português.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução prioriza equivalência ótima, preservando o paralelismo e a metáfora bíblica.
