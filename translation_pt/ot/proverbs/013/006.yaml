  text: צְ֭דָקָה תִּצֹּ֣ר תָּם דָּ֑רֶךְ וְ֝/רִשְׁעָ֗ה תְּסַלֵּ֥ף חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
translation:
  language: pt
  text: A justiça protege quem é íntegro em seu caminho, mas a maldade arruína o pecador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas a maldade transtorna o pecado”. O termo hebraico חַטָּאת pode significar “pecado” ou, neste contexto, referir-se ao pecador.'
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: A justiça
  rationale: Neste provérbio, o substantivo designa retidão moral. “Justiça” é natural em português e mantém o vínculo lexical com a linguagem sapiencial e teológica.
- source_word: תִּצֹּר
  choice: protege
  rationale: O verbo נצר significa guardar, vigiar ou preservar; “protege” expressa com clareza sua função protetora neste contexto.
- source_word: תָּם דָּרֶךְ
  choice: quem é íntegro em seu caminho
  rationale: A construção hebraica é condensada e qualifica a pessoa por sua conduta. “Íntegro” comunica inteireza moral sem sugerir impecabilidade absoluta, e “em seu caminho” preserva a metáfora ética de דֶּרֶךְ.
- source_word: וְרִשְׁעָה
  choice: mas a maldade
  rationale: O waw é adversativo no paralelismo. “Maldade” traduz a qualidade moral oposta à justiça de forma corrente e digna.
- source_word: תְּסַלֵּף
  choice: arruína
  rationale: O piel de סלף pode indicar torcer, transtornar ou levar à ruína. “Arruína” produz em português uma afirmação natural e preserva o efeito destrutivo.
- source_word: חַטָּאת
  choice: o pecador
  rationale: Embora a forma também possa significar “pecado”, aqui o paralelismo entre a pessoa íntegra e a pessoa caracterizada pelo pecado favorece o sentido pessoal “pecador”. A ambiguidade lexical genuína é registrada em nota.
theological_decisions:
- issue: Sentido de חַטָּאת no segundo membro
  choice: “o pecador”, entendendo o substantivo como referência à pessoa pecadora
  alternative: “o pecado”, tomando o substantivo em sentido abstrato
  rationale: 'O paralelismo antitético favorece uma referência pessoal: a justiça protege a pessoa íntegra, enquanto a maldade arruína o pecador. Como חַטָּאת também pode designar o pecado, a alternativa é mantida em nota, sem ocultar a tensão do hebraico.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação conserva a metáfora do caminho e explicita em nota a ambiguidade do último substantivo hebraico.
