  text: A wicked messenger falls into trouble[b][a], but a faithful envoy brings healing.
translation:
  language: pt
  text: O mensageiro perverso cai em apuros[a], mas o emissário fiel traz cura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cai no mal”, “cai no dano” ou “cai em calamidade”. A expressão hebraica pode indicar mal, dano ou adversidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mensageiro” ou “embaixador” para “emissário”. O hebraico emprega duas palavras diferentes para mensageiro neste provérbio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  choice: mensageiro
  rationale: No contexto social e sapiencial de Provérbios, refere-se a um mensageiro humano, não a um ser celestial. “Mensageiro” é o equivalente português mais amplo e natural.
- source_word: רָשָׁע
  choice: perverso
  rationale: Como adjetivo que caracteriza o mensageiro, expressa sua condição moral. “Perverso” preserva essa força ética em português atual e dignificado.
- source_word: יִפֹּל
  choice: cai
  rationale: O yiqtol formula uma verdade geral; o presente é natural no estilo proverbial e conserva a imagem de queda.
- source_word: בְּרָע
  choice: na desgraça
  rationale: רָע pode indicar mal, dano ou calamidade. Neste contexto, “na desgraça” comunica uma consequência danosa sem restringir indevidamente o sentido à maldade moral.
- source_word: צִיר
  choice: emissário
  rationale: O termo costuma designar alguém enviado com uma missão, por vezes oficial. “Emissário” o diferencia de מַלְאָךְ e mantém o paralelismo entre os dois enviados.
- source_word: אֱמוּנִים
  choice: fiel
  rationale: A forma transmite confiabilidade ou fidelidade. “Fiel” é conciso, natural e preserva a dimensão ética do termo.
- source_word: מַרְפֵּא
  choice: traz cura
  rationale: O substantivo significa cura, remédio ou restauração. A formulação verbal natural em português explicita que esse é o efeito benéfico do emissário fiel, sem especificar se a cura é literal ou figurada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e compreensão internacional. A tradução mantém o contraste proverbial, distingue os dois termos hebraicos para mensageiro por meio de “mensageiro” e “emissário” e preserva em nota a amplitude semântica de בְּרָע.
