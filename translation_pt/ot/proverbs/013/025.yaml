  text: צַדִּ֗יק אֹ֭כֵל לְ/שֹׂ֣בַע נַפְשׁ֑/וֹ וּ/בֶ֖טֶן רְשָׁעִ֣ים תֶּחְסָֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/025.yaml
  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
translation:
  language: pt
  text: O justo come até ficar satisfeito[a], mas o ventre dos perversos não tem o suficiente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “para a saciedade de sua alma”. Ou: “para satisfazer seu apetite”. A palavra hebraica נֶפֶשׁ (néfesh) pode significar “alma”, “vida”, “pessoa” ou “apetite”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo masculino singular substantivado designa um representante da classe dos justos; esta forma é natural e tradicional em português sapiencial.
- source_word: אֹכֵל
  choice: come
  rationale: O particípio expressa uma ação habitual ou verdade geral; o presente simples reproduz bem o caráter proverbial.
- source_word: לְשֹׂבַע נַפְשׁוֹ
  choice: até ficar satisfeito
  rationale: A expressão indica comer até a suficiência ou saciedade. A formulação natural em português comunica o sentido contextual de נֶפֶשׁ sem restringi-lo apenas ao órgão físico.
- source_word: וּבֶטֶן
  choice: mas o ventre
  rationale: A conjunção tem força adversativa no paralelismo. 'Ventre' conserva a imagem corporal do hebraico e mantém um registro digno.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O plural substantivado refere-se aos que praticam a perversidade como classe; 'perversos' é claro e corrente.
- source_word: תֶּחְסָר
  choice: passa necessidade
  rationale: O verbo significa carecer, ter falta ou estar em necessidade. A expressão evita o pouco natural 'o ventre carece' e preserva o contraste com a satisfação do justo.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e proverbial, com legibilidade brasileira e compreensão internacional. A tradução prioriza equivalência ótima: mantém a imagem literal de ''ventre'', mas verte a expressão idiomática ligada a נֶפֶשׁ de maneira natural, registrando sua amplitude semântica em nota.'
