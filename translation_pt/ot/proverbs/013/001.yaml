  text: בֵּ֣ן חָ֭כָם מ֣וּסַר אָ֑ב וְ֝/לֵ֗ץ לֹא שָׁמַ֥ע גְּעָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/001.yaml
  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
translation:
  language: pt
  text: Um filho sábio acolhe a disciplina do pai[a], mas o zombador[b] não dá ouvidos à repreensão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um filho sábio ouve a disciplina do pai”. O hebraico não traz um verbo expresso no primeiro membro; a ideia de ouvir, acolher ou obedecer é inferida pelo paralelismo com o segundo membro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “escarnecedor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: filho
  rationale: O substantivo hebraico está no singular masculino e, no estilo proverbial, apresenta um caso representativo; “filho” preserva essa forma sem a neutralizar.
- source_word: חָכָם
  choice: sábio
  rationale: Em Provérbios, o adjetivo indica sabedoria prática e discernimento moral; “sábio” é a tradução direta e natural.
- source_word: מוּסַר
  choice: disciplina
  rationale: O termo abrange formação, correção e instrução moral, não apenas transmissão de informação; “disciplina” expressa bem essa dimensão formativa.
- source_word: אָב
  choice: do pai
  rationale: A construção hebraica significa literalmente “disciplina de pai”. Em português, “do pai” é idiomático e evita acrescentar o possessivo explícito “seu”, ausente no hebraico.
- source_word: לֵץ
  choice: zombador
  rationale: Em Provérbios, o termo caracteriza quem ridiculariza com arrogância e rejeita a correção; “zombador” é claro e corrente em português.
- source_word: שָׁמַע
  choice: acolhe / não dá ouvidos
  rationale: O verbo pode significar ouvir, escutar ou atender obedientemente. No primeiro membro, “acolhe” explicita de modo natural a aceitação implícita; no segundo, “não dá ouvidos” comunica a recusa em atender à repreensão.
- source_word: גְּעָרָה
  choice: repreensão
  rationale: O substantivo designa uma censura ou reprimenda verbal; “repreensão” é claro, digno e adequado ao contraste proverbial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com boa legibilidade brasileira. “Acolhe” evita o tom meramente passivo de “recebe”, enquanto “não dá ouvidos” reproduz naturalmente a recusa deliberada indicada pelo contexto. A ambiguidade sintática do primeiro membro é preservada em nota.
