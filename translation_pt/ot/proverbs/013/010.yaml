translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A estrutura antitética e concisa do hebraico foi preservada; as ambiguidades reais do alcance de רַק e da forma נוֹעָצִים aparecem em notas.
