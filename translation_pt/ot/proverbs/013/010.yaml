  text: רַק בְּ֭/זָדוֹן יִתֵּ֣ן מַצָּ֑ה וְ/אֶת נ֖וֹעָצִ֣ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
translation:
  language: pt
  text: Só por arrogância surge conflito,[a] mas a sabedoria está com os que aceitam conselhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A arrogância só gera conflito”.'
    reason: O alcance de רַק (“só”) pode ser expresso de modo a restringir a causa do conflito, como no texto, ou o resultado produzido pela arrogância.
  - marker: b
    text: 'Ou: “os que se aconselham” ou “os que são bem aconselhados”.'
    reason: 'נוֹעָצִים admite nuance passiva ou reflexiva: receber conselho, ser aconselhado ou consultar-se com outros.'
lexical_decisions:
- source_word: רַק
  choice: só
  rationale: 'Preserva a força restritiva de רַק. Na frase principal, liga-se naturalmente ao resultado da arrogância: ela só gera conflito; a outra leitura possível do alcance da restrição é registrada na nota [a].'
- source_word: בְּזָדוֹן
  choice: a arrogância
  rationale: זָדוֹן designa orgulho presunçoso, arrogância ou insolência. A construção hebraica com בְּ é vertida de modo idiomático, fazendo da arrogância a causa do conflito.
- source_word: יִתֵּן
  choice: gera
  rationale: Embora נתן signifique literalmente “dar”, aqui “gera” expressa em português natural a ideia de produzir ou provocar o resultado indicado.
- source_word: מַצָּה
  choice: conflito
  rationale: מַצָּה refere-se a contenda, disputa ou conflito. “Conflito” é claro, atual e suficientemente amplo para o paralelismo proverbial.
- source_word: וְאֶת
  choice: mas ... com
  rationale: O וְ introduz o contraste entre os dois membros, expresso naturalmente por “mas”; אֶת tem aqui o sentido relacional de “com” na oração nominal.
- source_word: נוֹעָצִים
  choice: os que aceitam conselhos
  rationale: O particípio nifal de יעץ pode indicar pessoas aconselhadas, receptivas a conselho, ou pessoas que se consultam. “Os que aceitam conselhos” comunica com clareza a receptividade à orientação, sem eliminar a alternativa registrada na nota [b].
- source_word: חָכְמָה
  choice: sabedoria
  rationale: חָכְמָה é o termo sapiencial central de Provérbios; “sabedoria” mantém essa ligação temática e lexical.
