  text: מִתְאַוָּ֣ה וָ֭/אַיִן נַפְשׁ֣/וֹ עָצֵ֑ל וְ/נֶ֖פֶשׁ חָרֻצִ֣ים תְּדֻשָּֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/004.yaml
  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
translation:
  language: pt
  text: O preguiçoso deseja, mas não tem nada; já o desejo dos diligentes será plenamente satisfeito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “será engordado”, imagem hebraica de fartura e plena satisfação.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְאַוָּה
  choice: deseja
  rationale: O particípio hitpael de אוה expressa desejo contínuo ou habitual. “Deseja” é claro e natural em português, sem acrescentar uma intensidade que o contexto não exige.
- source_word: וָאַיִן
  choice: mas não tem nada
  rationale: A conjunção seguida da negação existencial indica que, apesar do desejo, nada há para o preguiçoso. Esta formulação reproduz o contraste de modo idiomático.
- source_word: נַפְשׁוֹ
  choice: o preguiçoso (como sujeito de “deseja”)
  rationale: נֶפֶשׁ designa aqui a pessoa em seu desejo ou apetite, não uma “alma” em sentido técnico. Em português, explicitar “alma” tornaria a frase artificial; o sentido é incorporado ao verbo “deseja”.
- source_word: עָצֵל
  choice: o preguiçoso
  rationale: Termo sapiencial para quem se caracteriza pela preguiça. “O preguiçoso” é conciso, proverbial e amplamente compreensível.
- source_word: וְנֶפֶשׁ
  choice: já o desejo
  rationale: Na segunda linha, נֶפֶשׁ tem o sentido contextual de desejo ou apetite. “Desejo” mantém o paralelismo sem sugerir exclusivamente fome física.
- source_word: חָרֻצִים
  choice: dos diligentes
  rationale: O adjetivo plural substantivado descreve pessoas trabalhadoras e aplicadas. “Diligentes” conserva a concisão e o registro sapiencial.
- source_word: תְּדֻשָּׁן
  choice: será plenamente satisfeito
  rationale: O pual de דשׁן evoca literalmente ser engordado, imagem hebraica de fartura e plena satisfação. A tradução comunica o resultado natural da metáfora, enquanto a nota preserva sua forma concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A formulação evita interpretar נֶפֶשׁ como “alma” em sentido teológico técnico e preserva o contraste entre desejo vazio e satisfação abundante.
