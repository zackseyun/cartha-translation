  text: כֹּ֣פֶר נֶֽפֶשׁ אִ֣ישׁ עָשְׁר֑/וֹ וְ֝/רָ֗שׁ לֹא שָׁמַ֥ע גְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/008.yaml
  text: A man's wealth is the ransom of his life[a], but a poor man does not hear a rebuke.
translation:
  language: pt
  text: A riqueza de um homem é o resgate de sua vida, mas o pobre não ouve repreensão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ouve ameaça”. É provável que a ideia seja que o pobre não se torna alvo de extorsão ou de um pedido de resgate, pois nada tem para pagar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּפֶר
  choice: resgate
  rationale: Preserva o sentido concreto de preço ou compensação pagos para livrar alguém de perda, pena ou perigo.
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Neste contexto sapiencial, refere-se à vida da pessoa, não especificamente a uma alma imaterial.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o masculino singular representativo do hebraico e o estilo proverbial.
- source_word: עָשְׁרוֹ
  choice: a riqueza de um homem
  rationale: Expressa de modo natural os bens ou recursos que podem servir como resgate.
- source_word: רָשׁ
  choice: o pobre
  rationale: É uma forma corrente e digna de verter o substantivo/adjetivo masculino singular, conservando o contraste com o homem rico.
- source_word: לֹא שָׁמַע
  choice: não ouve
  rationale: Mantém a imagem literal do hebraico sem explicitar no texto principal uma implicação social apenas provável.
- source_word: גְּעָרָה
  choice: repreensão
  rationale: Equivalente direto que também pode, conforme o contexto, comportar a ideia de censura severa ou ameaça.
theological_decisions:
- issue: Sentido da segunda linha e sua relação com a primeira
  choice: Conservar a formulação literal “não ouve repreensão” e explicar a leitura contextual em nota.
  alternative: Traduzir explicitamente “não ouve ameaça” ou parafrasear que o pobre não é alvo de extorsão.
  rationale: O substantivo hebraico permite repreensão/censura e pode assumir força ameaçadora. A tradução principal preserva a ambiguidade lexical e a tensão proverbial, enquanto a nota informa a interpretação contextual provável sem torná-la obrigatória.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “Resgate de sua vida” conserva o caráter econômico e jurídico da primeira linha; “repreensão” mantém no texto a ambiguidade do hebraico, esclarecida pela nota.
