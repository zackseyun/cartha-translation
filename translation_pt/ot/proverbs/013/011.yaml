base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/011.yaml
  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
translation:
  language: pt
  text: A riqueza que vem do vazio diminui[a], mas quem ajunta pouco a pouco[b] a faz crescer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A riqueza que vem da ilusão diminui”. O hebraico emprega a palavra para “sopro” ou “vapor”, que pode indicar algo vazio, fugaz, inconsistente ou mal fundamentado.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre a mão”; a expressão provavelmente indica ajuntar gradualmente ou em pequenas quantidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: riqueza
  rationale: O termo designa bens ou recursos materiais; “riqueza” é amplo, natural e adequado ao tom proverbial.
- source_word: מֵהֶבֶל
  choice: que vem da ilusão
  rationale: הֶבֶל significa literalmente “sopro, vapor” e, por extensão, algo vazio, ilusório, inconsistente ou fugaz. “Da ilusão” mantém a imagem conceitual sem restringi-la indevidamente a ganho rápido ou desonesto.
- source_word: יִמְעָט
  choice: diminui
  rationale: O verbo significa tornar-se pouco ou diminuir. “Diminui” é claro e preserva a afirmação simples do hebraico.
- source_word: וְקֹבֵץ
  choice: mas quem ajunta
  rationale: O particípio tem sentido genérico, referindo-se a qualquer pessoa que acumula; “quem ajunta” soa natural em português proverbial.
- source_word: עַל יָד
  choice: pouco a pouco
  rationale: Embora literalmente relacionado a “mão”, o uso idiomático indica acumulação gradual, em pequenas porções.
- source_word: יַרְבֶּה
  choice: a faz crescer
  rationale: A forma causativa expressa fazer aumentar. O pronome retoma naturalmente “a riqueza”.
