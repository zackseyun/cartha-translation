base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/014.yaml
  text: The instruction of a wise man is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: pt
  text: O ensino do sábio é fonte de vida, para se desviar das armadilhas da morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  choice: O ensino do
  rationale: Aqui, תּוֹרָה designa ensino ou instrução, não especificamente um código legal; “ensino” é natural e claro no contexto sapiencial.
- source_word: חָכָם
  choice: sábio
  rationale: Preserva o substantivo masculino singular representativo do hebraico e soa natural em português.
- source_word: מְקוֹר
  choice: fonte
  rationale: Expressa uma nascente ou manancial de água e mantém a imagem poética de algo que comunica vida.
- source_word: חַיִּים
  choice: vida
  rationale: Embora a forma hebraica seja morfologicamente plural, o uso é idiomático e abstrato, correspondendo ao singular “vida” em português.
- source_word: לָסוּר
  choice: para afastar
  rationale: O infinitivo pode indicar propósito ou resultado. A formulação mantém essa abertura sem acrescentar um objeto humano inexistente no texto hebraico.
- source_word: מִמֹּקְשֵׁי
  choice: das armadilhas
  rationale: מוֹקֵשׁ indica laço ou armadilha; “armadilhas” é uma imagem clara e corrente em português.
- source_word: מָוֶת
  choice: da morte
  rationale: Tradução direta que preserva a construção metafórica “armadilhas da morte”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com concisão proverbial. A construção “para afastar das armadilhas da morte” preserva a ausência de objeto explícito no hebraico; no contexto, o sujeito implícito pode ser quem acolhe o ensino.
