source:
  edition: WLC
  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
translation:
  language: pt
  text: O homem bom deixa uma herança para os netos[a], mas a riqueza do pecador fica reservada[b] para o justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “filhos dos filhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fica guardada” ou “fica escondida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: o homem bom
  rationale: O adjetivo masculino singular é usado substantivamente e representa, em forma proverbial, uma pessoa boa. A formulação mantém o gênero gramatical do hebraico sem limitar necessariamente o princípio apenas aos homens.
- source_word: יַנְחִיל
  choice: deixa uma herança
  rationale: O hifil de נחל significa fazer alguém herdar ou dar algo como herança. Em português atual, “deixa uma herança” comunica naturalmente esse sentido causativo no contexto de legado familiar.
- source_word: בְּנֵי בָנִים
  choice: os netos
  rationale: A expressão significa literalmente “filhos dos filhos”. “Netos” é o equivalente português natural e claro, enquanto a nota preserva a forma concreta do hebraico.
- source_word: וְצָפוּן
  choice: mas ... fica reservada
  rationale: A forma passiva de צפן pode indicar algo guardado, escondido ou reservado. “Fica reservada” se ajusta ao beneficiário introduzido por ל e explicita naturalmente o contraste do paralelismo; a nota registra outras possibilidades lexicais.
- source_word: לַצַּדִּיק
  choice: para o justo
  rationale: A preposição ל marca o beneficiário, e o adjetivo substantivado singular descreve o justo como figura representativa.
- source_word: חֵיל
  choice: riqueza
  rationale: Neste contexto de herança e bens acumulados, חֵיל denota recursos ou patrimônio; “riqueza” é a opção mais clara e corrente.
- source_word: חוֹטֵא
  choice: o pecador
  rationale: O particípio substantivado designa aquele que peca como tipo proverbial. O artigo em português produz uma antítese natural com “o justo” sem exigir que o hebraico tenha artigo definido.
theological_decisions:
- issue: Adjetivo substantivado masculino em uma máxima proverbial
  choice: o homem bom
  alternative: a pessoa boa / quem é bom
  rationale: A tradução conserva a forma masculina singular do hebraico e sua figura representativa, sem acrescentar uma restrição doutrinária segundo a qual o princípio se aplicaria exclusivamente a homens.
- issue: Relação entre a riqueza do pecador e o justo
  choice: fica reservada para o justo
  alternative: fica guardada / escondida para o justo
  rationale: A redação preserva a afirmação proverbial de transferência ou destinação futura sem especificar quando, como ou por qual mecanismo isso ocorre.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe concisa mantém o paralelismo antitético do provérbio; as notas preservam a expressão geracional concreta e a amplitude semântica de צפן.
