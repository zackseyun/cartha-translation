  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
translation:
  language: pt
  text: A luz dos justos se alegra[a], mas a lâmpada dos perversos se apaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fica alegre”. O verbo hebraico normalmente significa “alegrar-se” ou “estar alegre”; por ter “luz” como sujeito, alguns entendem que, neste contexto, a expressão quer dizer “brilha intensamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: luz
  rationale: אוֹר designa normalmente luz ou claridade. “Luz” é a correspondência mais natural e mantém o contraste poético com “lâmpada” no segundo membro.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O adjetivo plural é usado como substantivo. “Os justos” expressa de modo conciso a categoria moral típica da literatura sapiencial.
- source_word: יִשְׂמָח
  choice: se alegra
  rationale: O verbo שׂמח significa normalmente alegrar-se ou estar alegre. A tradução preserva a personificação da luz e não introduz no texto principal o sentido contextual inferido de “brilha intensamente”.
- source_word: נֵר
  choice: lâmpada
  rationale: נֵר se refere a uma lâmpada, geralmente de óleo, e não especificamente a uma vela. “Lâmpada” preserva com precisão a imagem hebraica.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O adjetivo plural é substantivado. “Perversos” é claro em português moderno, conserva o sentido moral forte do termo e forma um contraste natural com “justos”.
- source_word: יִדְעָךְ
  choice: se apaga
  rationale: O verbo descreve uma chama ou lâmpada que se extingue. “Se apaga” é idiomático, preciso e não especifica um agente.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção corresponda formalmente a “e”, ela introduz aqui o segundo membro antitético do provérbio; “mas” torna essa relação clara em português.
