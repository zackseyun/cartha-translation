source:
  edition: WLC
  text: כָּל עָ֭רוּם יַעֲשֶׂ֣ה בְ/דָ֑עַת וּ֝/כְסִ֗יל יִפְרֹ֥שׂ אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/016.yaml
  text: Every prudent man acts with knowledge[a], but a fool displays folly.
translation:
  language: pt
  text: 'Todo prudente age com conhecimento,

    mas o insensato expõe[a] sua insensatez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estende” ou “põe à mostra”. O verbo hebraico sugere abrir ou tornar algo visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todo
  rationale: O distributivo “todo” preserva o caráter geral e proverbial da afirmação.
- source_word: עָרוּם
  choice: prudente
  rationale: Em Provérbios, o termo costuma designar positivamente quem age com cautela e discernimento; “prudente” evita a conotação negativa de “astuto”.
- source_word: יַעֲשֶׂה
  choice: age
  rationale: O verbo hebraico é amplo, e “age” expressa de modo natural a conduta habitual descrita pelo provérbio.
- source_word: בְדָעַת
  choice: com conhecimento
  rationale: 'A preposição pode indicar a base ou a maneira da ação: o prudente age apoiado no conhecimento.'
- source_word: וּכְסִיל
  choice: mas o insensato
  rationale: Embora a conjunção seja literalmente “e”, “mas” torna explícito em português o contraste entre os dois membros. “Insensato” é uma tradução corrente e digna do termo sapiencial כְּסִיל.
- source_word: יִפְרֹשׂ
  choice: expõe
  rationale: O verbo sugere estender, abrir ou tornar visível; “expõe” conserva essa imagem e comunica que o insensato põe sua insensatez à vista.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Termo abstrato natural em português para a falta moral e prática de sabedoria no vocabulário de Provérbios.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. O masculino singular tem valor representativo, como na formulação proverbial hebraica. O marcador da nota foi colocado após “expõe”, pois a alternativa lexical diz respeito ao verbo hebraico יִפְרֹשׂ.
