  text: בָּ֣ז לְ֭/דָבָר יֵחָ֣בֶל ל֑/וֹ וִ/ירֵ֥א מִ֝צְוָ֗ה ה֣וּא יְשֻׁלָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
translation:
  language: pt
  text: Quem despreza uma palavra[a] será arruinado, mas quem teme o mandamento será recompensado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um assunto”. O hebraico דָבָר pode significar “palavra”, “assunto” ou “coisa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “será retribuído”. Mais literalmente, o hebraico indica que receberá a devida paga ou retribuição.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: despreza
  rationale: O particípio descreve quem trata algo com desdém. “Despreza” conserva a força moral do hebraico e é natural em português atual.
- source_word: לְדָבָר
  choice: uma palavra
  rationale: דָבָר pode designar palavra, assunto ou coisa. “Uma palavra” mantém a forma lexical e a abertura proverbial, provavelmente aludindo a conselho ou instrução sem especificá-los em excesso.
- source_word: יֵחָבֶל לוֹ
  choice: será prejudicado por ela
  rationale: A forma verbal expressa sofrer dano ou chegar à ruína. Esta formulação conserva a relação entre o desprezo e o dano resultante sem impor o grau máximo sugerido por “será arruinado”.
- source_word: וִירֵא
  choice: quem teme
  rationale: A expressão denota temor reverente. “Teme” preserva o vocabulário característico da literatura sapiencial, sem reduzi-lo a simples respeito.
- source_word: מִצְוָה
  choice: o mandamento
  rationale: מִצְוָה significa diretamente mandamento ou ordem. “O mandamento” preserva seu peso ético e o contraste proverbial com “uma palavra”.
- source_word: יְשֻׁלָּם
  choice: será recompensado
  rationale: O Pual de שלם significa ser retribuído ou receber a devida paga. No paralelismo, o contexto favorece uma retribuição positiva; “será recompensado” comunica isso com clareza, enquanto a nota registra a formulação mais literal.
- source_word: הוּא
  choice: quem
  rationale: O pronome hebraico dá ênfase ao sujeito da segunda oração. Em português, a construção genérica “quem” produz paralelismo natural; não é necessário introduzir gênero onde a gramática portuguesa permite referência geral.
theological_decisions:
- issue: Linguagem masculina representativa em um provérbio sapiencial
  choice: Empregar “quem... quem...” como construção genérica nas duas orações.
  alternative: “O que despreza... aquele que teme...” ou uma formulação explicitamente masculina.
  rationale: As formas masculinas singulares do hebraico têm função proverbial genérica. O português “quem” preserva essa abrangência sem alterar o conteúdo nem introduzir uma aplicação restrita a homens.
- issue: Caráter positivo da retribuição em יְשֻׁלָּם
  choice: Traduzir “será recompensado”.
  alternative: “Será retribuído” ou “receberá a paga”.
  rationale: Embora o verbo possa indicar retribuição de modo amplo, o contraste com o dano sofrido por quem despreza a palavra favorece aqui uma recompensa positiva. A alternativa mais literal permanece em nota para não ocultar a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo conciso do provérbio foi mantido; “palavra” e “mandamento” preservam a abertura e o peso ético do hebraico.
