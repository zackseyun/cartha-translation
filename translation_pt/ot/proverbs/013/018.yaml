  text: רֵ֣ישׁ וְ֭/קָלוֹן פּוֹרֵ֣עַ מוּסָ֑ר וְ/שׁוֹמֵ֖ר תּוֹכַ֣חַת יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/018.yaml
  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
translation:
  language: pt
  text: Pobreza e desonra são para quem abandona a disciplina, mas quem dá atenção à repreensão será honrado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵישׁ
  choice: Pobreza
  rationale: O substantivo indica pobreza ou carência; “pobreza” é claro e natural em português.
- source_word: קָלוֹן
  choice: desonra
  rationale: O termo expressa vergonha ou perda pública de honra; “desonra” preserva o contraste direto com “será honrado”.
- source_word: פּוֹרֵעַ
  choice: quem rejeita
  rationale: O particípio pode significar deixar de lado, negligenciar ou rejeitar. No contexto da disciplina, “rejeita” comunica de modo natural a recusa deliberada sem acrescentar uma explicação ao verso.
- source_word: מוּסָר
  choice: a disciplina
  rationale: Em Provérbios, o termo abrange formação corretiva e disciplina, não apenas transmissão de informação.
- source_word: שׁוֹמֵר
  choice: quem acolhe
  rationale: Literalmente “guarda” ou “observa”; aqui descreve prestar atenção à correção e conservá-la. “Acolhe” forma um contraste natural com “rejeita”.
- source_word: תּוֹכַחַת
  choice: a repreensão
  rationale: O substantivo denota correção verbal ou censura; “repreensão” mantém a distinção em relação a “disciplina”.
- source_word: יְכֻבָּד
  choice: será honrado
  rationale: A forma passiva de כבד indica receber honra ou estima; esta tradução preserva tanto a voz passiva quanto o sentido social.
theological_decisions:
- issue: Relação entre conduta e resultado no provérbio
  choice: Manter a afirmação sapiencial direta de que pobreza e desonra esperam quem rejeita a disciplina
  alternative: Introduzir qualificações como “pode acabar em pobreza”
  rationale: O hebraico apresenta a relação de modo proverbial e categórico. Acrescentar modalizadores enfraqueceria a formulação sem apoio textual.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo claro entre “rejeita a disciplina” e “acolhe a repreensão”, e entre “desonra” e “será honrado”.
