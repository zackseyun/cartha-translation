translation:
  language: pt
  text: O bom senso traz favor[a], mas o caminho dos desleais é duro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O bom entendimento conquista favor”. O verbo hebraico significa literalmente “dá”, mas pode expressar o resultado de alcançar ou obter favor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é áspero”. A palavra hebraica pode sugerir algo duro, acidentado, firme ou inflexível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל טוֹב
  choice: bom senso
  rationale: A expressão indica entendimento acertado ou discernimento prático. “Bom senso” é natural em português e conserva a ênfase sapiencial na capacidade de julgar bem.
- source_word: יִתֶּן
  choice: traz
  rationale: O verbo significa literalmente “dá”, mas, neste provérbio, pode indicar que o bom senso resulta em favor ou o obtém. “Traz” mantém essa relação sem definir rigidamente sua direção.
- source_word: חֵן
  choice: favor
  rationale: Neste contexto, refere-se à boa vontade, aceitação ou consideração favorável, e não necessariamente à graça em sentido teológico.
- source_word: דֶרֶךְ
  choice: caminho
  rationale: Termo sapiencial frequente para o modo de viver ou proceder; “caminho” preserva tanto a imagem quanto o sentido figurado.
- source_word: בֹּגְדִים
  choice: os desleais
  rationale: O particípio caracteriza pessoas que agem com infidelidade ou traição. “Desleais” é claro, atual e suficientemente amplo.
- source_word: אֵיתָן
  choice: duro
  rationale: No contraste do provérbio, descreve o caminho dos desleais como penoso, áspero ou inflexível. “Duro” preserva essa amplitude e a concisão proverbial.
