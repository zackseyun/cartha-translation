  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
translation:
  language: pt
  text: O desejo realizado é doce para a alma[a], mas afastar-se do mal é uma abominação para os tolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O desejo que se concretiza é agradável para a alma.”'
    reason: Alternativa lexical que explicita נִהְיָה como aquilo que vem a acontecer e תֶּעֱרַב como “é agradável”.
lexical_decisions:
- source_word: תַּאֲוָה
  choice: desejo
  rationale: O substantivo indica desejo ou anseio; “desejo” é amplo, natural e não intensifica indevidamente o sentido.
- source_word: נִהְיָה
  choice: realizado
  rationale: O particípio nifal de היה descreve o desejo como algo que veio a acontecer ou se concretizou; “realizado” combina naturalmente com “desejo”.
- source_word: תֶּעֱרַב
  choice: é doce
  rationale: O verbo expressa aquilo que é agradável ou doce; a tradução conserva a metáfora concreta e continua idiomática em português.
- source_word: לְנָפֶשׁ
  choice: para a alma
  rationale: נפש refere-se aqui à pessoa em sua dimensão interior e afetiva; “para a alma” preserva essa profundidade antropológica.
- source_word: וְתוֹעֲבַת
  choice: mas ... é abominável
  rationale: O contexto pede contraste entre os dois membros do provérbio. “Abominável” mantém a força de תועבה com construção natural em português.
- source_word: כְּסִילִים
  choice: os tolos
  rationale: Em Provérbios, o termo caracteriza pessoas moral e intelectualmente obstinadas; “tolos” preserva essa dimensão sapiencial.
- source_word: סוּר
  choice: afastar-se
  rationale: O infinitivo indica abandonar ou desviar-se de algo; “afastar-se” comunica com naturalidade a ação moral deliberada.
- source_word: מֵרָע
  choice: do mal
  rationale: No contexto sapiencial, רע denota o mal em sentido moral, não apenas dano ou infortúnio.
