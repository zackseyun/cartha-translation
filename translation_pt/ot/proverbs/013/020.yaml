base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/020.yaml
  text: Whoever walks with the wise will become wise[a], but a companion of fools will suffer harm.
translation:
  language: pt
  text: Quem anda com os sábios se tornará sábio, mas quem se associa aos insensatos sofrerá dano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será prejudicado”, “se dará mal” ou “acabará em ruína”. O verbo hebraico pode indicar sofrer dano ou experimentar um resultado adverso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ
  choice: Quem anda
  rationale: O infinitivo absoluto tem aqui valor proverbial, referindo-se à pessoa que habitualmente anda com alguém; “anda” preserva a metáfora hebraica de convivência e conduta.
- source_word: אֶת
  choice: com
  rationale: Neste contexto, a preposição indica acompanhamento ou convivência.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O plural designa pessoas sábias em geral, sem necessidade de especificar gênero.
- source_word: וְחָכָם
  choice: se tornará sábio
  rationale: 'A forma expressa o resultado da convivência: quem anda com sábios adquire sabedoria. A formulação comunica melhor essa progressão do que apenas “será sábio”.'
- source_word: וְרֹעֶה
  choice: mas quem faz companhia
  rationale: Embora a raiz possa significar “pastorear”, aqui denota associação ou convivência. A expressão escolhida mantém o paralelismo com “anda com” sem produzir a imagem enganosa de pastorear insensatos.
- source_word: כְסִילִים
  choice: aos insensatos
  rationale: “Insensatos” expressa a categoria moral e intelectual característica de Provérbios e soa natural em português bíblico contemporâneo.
- source_word: יֵרוֹעַ
  choice: sofrerá dano
  rationale: O nifal de רעע indica sofrer prejuízo, lesão ou um resultado adverso. “Sofrerá dano” preserva essa amplitude sem necessariamente implicar ruína completa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo proverbial foi preservado. O marcador da nota foi colocado após “sofrerá dano”, termo ao qual a alternativa lexical hebraica efetivamente se refere.
