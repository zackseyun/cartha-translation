  text: חַ֭טָּאִים תְּרַדֵּ֣ף רָעָ֑ה וְ/אֶת צַ֝דִּיקִ֗ים יְשַׁלֶּם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/021.yaml
  text: Disaster pursues sinners, but good repays the righteous.
translation:
  language: pt
  text: O mal persegue os pecadores, mas o bem recompensa os justos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: o mal
  rationale: O substantivo pode indicar mal, desgraça ou calamidade. “O mal” preserva a amplitude sem restringir o sentido apenas a um desastre específico.
- source_word: תְּרַדֵּף
  choice: persegue
  rationale: Reproduz diretamente a imagem verbal de algo que vai no encalço dos pecadores.
- source_word: יְשַׁלֶּם
  choice: recompensa
  rationale: O verbo da raiz שלם pode significar pagar, retribuir ou recompensar. Neste paralelismo, “recompensa” expressa uma retribuição favorável de modo natural em português.
- source_word: טוֹב
  choice: o bem
  rationale: Mantém o substantivo como sujeito do verbo, em paralelo com “o mal”, sem explicitar um agente que o hebraico não nomeia.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Equivalente corrente e teologicamente não sectário para aqueles caracterizados pela justiça ou retidão.
theological_decisions:
- issue: Agência da retribuição
  choice: Manter “o mal” e “o bem” como sujeitos gramaticais.
  alternative: Explicitar Deus como quem castiga e recompensa.
  rationale: O texto hebraico não nomeia Deus neste versículo; a personificação preserva a forma proverbial e evita acrescentar uma identificação teológica implícita.
- issue: Sentido de יְשַׁלֶּם
  choice: “recompensa”
  alternative: “retribui” ou “paga”
  rationale: “Recompensa” comunica claramente o resultado favorável para os justos, embora o verbo também admita a noção mais ampla de retribuição.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A formulação conserva a personificação simétrica de “o mal” e “o bem” e evita tornar explícito o agente divino.
