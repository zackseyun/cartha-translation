  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
translation:
  language: pt
  text: Há quem finja ser rico[a] e não tenha nada; há quem finja ser pobre e tenha muitas riquezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Há quem se faça rico e não tenha nada; há quem se faça pobre e tenha muitas riquezas». Os verbos reflexivos hebraicos podem indicar tanto a maneira como alguém se apresenta quanto o ato de enriquecer ou empobrecer a si mesmo. O texto principal favorece o sentido de aparência por causa da forte ironia do provérbio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há quem
  rationale: A partícula existencial introduz uma observação geral; «Há quem» reproduz com naturalidade o caráter proverbial.
- source_word: מִתְעַשֵּׁר
  choice: finja ser rico
  rationale: O hitpael de עשר pode indicar tanto apresentar-se como rico quanto enriquecer a si mesmo. O contraste com «não tenha nada» favorece no texto principal a ideia de aparência ou simulação.
- source_word: וְאֵין כֹּל
  choice: e não tenha nada
  rationale: אֵין com כֹּל expressa ausência total. A coordenação com «e» preserva a forma hebraica, enquanto o contraste permanece claro no contexto.
- source_word: מִתְרוֹשֵׁשׁ
  choice: finja ser pobre
  rationale: A forma reflexiva de רושׁ/רשׁשׁ pode descrever apresentar-se como pobre ou empobrecer a si mesmo. Em paralelo com מִתְעַשֵּׁר, a leitura de aparência é a mais provável no texto principal.
- source_word: וְהוֹן רָב
  choice: e tenha muitas riquezas
  rationale: הוֹן designa bens ou riqueza, e רָב indica grande quantidade. «Muitas riquezas» é claro e mantém o paralelismo com «nada».
