  text: חוֹשֵׂ֣ךְ שִׁ֭בְט/וֹ שׂוֹנֵ֣א בְנ֑/וֹ וְ֝/אֹהֲב֗/וֹ שִֽׁחֲר֥/וֹ מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/024.yaml
  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
translation:
  language: pt
  text: Quem retém[a] sua vara odeia seu filho, mas quem o ama busca discipliná-lo com diligência.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poupa”. O verbo hebraico pode ter o sentido de reter, poupar ou deixar de usar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, o verbo significa “buscar cedo” e, neste contexto, comunica buscar com empenho ou diligência. O sufixo refere-se ao filho; “disciplina” também pode incluir correção e formação.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: retém
  rationale: O particípio de חשׂך expressa a ação de reter ou deixar de empregar algo. “Retém” conserva essa ideia ativa sem a possível conotação compassiva que “poupa” pode ter no português atual.
- source_word: שִׁבְטוֹ
  choice: sua vara
  rationale: שֵׁבֶט designa vara, bastão ou cetro. No contexto da disciplina familiar, “vara” preserva de modo direto a imagem concreta do provérbio.
- source_word: שׂוֹנֵא
  choice: odeia
  rationale: O verbo significa diretamente “odiar”. A formulação forte foi mantida para preservar a antítese retórica do hebraico.
- source_word: בְנוֹ
  choice: seu filho
  rationale: O hebraico diz especificamente “seu filho”; a tradução mantém essa referência masculina em vez de generalizá-la como “criança”.
- source_word: וְאֹהֲבוֹ
  choice: mas quem o ama
  rationale: A construção participial e o sufixo pronominal são expressos de forma idiomática, com “o” retomando “seu filho”.
- source_word: שִׁחֲרוֹ
  choice: busca ... com diligência
  rationale: O piel de שׁחר está ligado literalmente a buscar cedo e, por extensão, a procurar com empenho ou diligência. A expressão portuguesa comunica essa intencionalidade e também representa o sufixo referente ao filho por meio de “discipliná-lo”.
- source_word: מוּסָר
  choice: discipliná-lo
  rationale: מוּסָר abrange disciplina corretiva, instrução e formação moral. A forma verbal é natural em português dentro da construção e não limita o sentido a castigo físico.
theological_decisions:
- issue: Se a imagem de disciplina corporal deve ser suavizada
  choice: Manter a imagem concreta da “vara” e, ao mesmo tempo, traduzir מוּסָר pelo conceito mais amplo de disciplinar.
  alternative: Substituir “vara” por “correção” ou “orientação” de modo genérico.
  rationale: O texto hebraico emprega explicitamente שֵׁבֶט (“vara”) e associa o amor paterno à disciplina ativa. A imagem e a tensão ética do provérbio não devem ser apagadas; contudo, מוּסָר é mais amplo que punição física e inclui correção e formação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A formulação preserva a forte antítese proverbial, a referência específica ao filho e a imagem concreta da vara, sem reduzir מוּסָר exclusivamente a castigo físico.
