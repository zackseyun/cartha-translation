  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יִשְׂבַּע ט֑וֹב וּ/גְמ֥וּל יְדֵי אָ֝דָ֗ם ישוב לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/014.yaml
  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
translation:
  language: pt
  text: Do fruto de sua boca, o homem[a] se farta do bem, e a retribuição por suas obras volta para ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O homem” é usado aqui em sentido genérico; o provérbio se aplica a todas as pessoas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “o resultado de suas obras volta para ele”. O termo hebraico pode indicar tanto a retribuição quanto aquilo que os próprios atos produzem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: Do fruto da boca, o homem
  rationale: Preserva a metáfora hebraica do fruto produzido pela fala. A ordem foi levemente ajustada para soar natural em português, sem acrescentar um possessivo ausente no texto hebraico.
- source_word: יִשְׂבַּע טוֹב
  choice: se farta do bem
  rationale: שׂבע indica ficar saciado ou plenamente satisfeito; טוֹב permanece amplo, abrangendo o que é bom, benéfico ou favorável. O presente expressa naturalmente uma verdade proverbial.
- source_word: וּגְמוּל יְדֵי אָדָם
  choice: e a retribuição pelos atos das mãos do homem
  rationale: גְמוּל pode indicar retribuição, resultado ou aquilo que uma ação traz de volta. A formulação conserva a ideia de correspondência entre os atos e suas consequências, sem reduzi-la apenas a trabalho manual ou recompensa positiva.
- source_word: יָשׁוּב לוֹ
  choice: volta para ele
  rationale: Traduz diretamente a imagem de שׁוב, 'voltar, retornar', e mantém o princípio proverbial de que os efeitos das ações recaem sobre quem as pratica.
theological_decisions:
- issue: Uso genérico de אִישׁ e אָדָם
  choice: o homem ... do homem
  alternative: a pessoa ... do ser humano
  rationale: Os dois substantivos hebraicos estão no masculino singular e representam genericamente qualquer pessoa. A tradução conserva essa forma e esclarece em nota sua abrangência universal.
- issue: Sentido moral de גְמוּל
  choice: retribuição pelos atos
  alternative: trabalho / resultado das mãos
  rationale: A escolha mantém aberta a possibilidade de consequências favoráveis ou desfavoráveis e evita transformar o provérbio numa promessa exclusivamente material.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A concisão e o paralelismo proverbial foram preservados; “se farta do bem” mantém deliberadamente a amplitude moral e prática de טוֹב.
