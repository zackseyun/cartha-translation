  text: דְּאָגָ֣ה בְ/לֶב אִ֣ישׁ יַשְׁחֶ֑/נָּה וְ/דָבָ֖ר ט֣וֹב יְשַׂמְּחֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/025.yaml
  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
translation:
  language: pt
  text: A ansiedade no coração de alguém abate[a] essa pessoa, mas uma boa palavra a alegra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz essa pessoa curvar-se”. O verbo hebraico retrata ser levado para baixo ou ficar curvado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  choice: ansiedade
  rationale: O substantivo denota preocupação ou inquietação interior. “Ansiedade” é atual, clara e mantém o sentido emocional do hebraico.
- source_word: בְלֶב אִישׁ
  choice: no coração de alguém
  rationale: O hebraico diz literalmente “no coração de um homem”. “Alguém” comunica naturalmente o singular representativo, enquanto “coração” preserva a imagem hebraica da pessoa interior.
- source_word: יַשְׁחֶנָּה
  choice: o abate
  rationale: O verbo descreve fazer baixar, curvar ou ficar prostrado. “Abate” preserva de modo conciso a imagem de ser levado para baixo, sem reduzi-la a um diagnóstico clínico.
- source_word: וְדָבָר טוֹב
  choice: mas uma boa palavra
  rationale: דָבָר pode significar palavra, assunto ou mensagem. “Boa palavra” mantém a amplitude da expressão, e “mas” torna explícito o contraste do paralelismo.
- source_word: יְשַׂמְּחֶנָּה
  choice: o alegra
  rationale: A forma causativa de שׂמח significa fazer alguém ficar alegre. “O alegra” é direta, digna e conserva esse valor causativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e de ampla compreensão, com boa legibilidade brasileira. O singular masculino dos pronomes retoma naturalmente “alguém”, sem restringir o provérbio aos homens; “coração” conserva o idioma antropológico hebraico.
