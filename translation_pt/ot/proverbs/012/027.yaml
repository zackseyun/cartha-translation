  text: לֹא יַחֲרֹ֣ךְ רְמִיָּ֣ה צֵיד֑/וֹ וְ/הוֹן אָדָ֖ם יָקָ֣ר חָרֽוּץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
translation:
  language: pt
  text: O preguiçoso não assa a sua caça[a], mas a diligência é a riqueza preciosa do homem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não apanha a sua presa», caso o verbo seja entendido de maneira mais ampla como obter ou preparar a caça, e não especificamente assá-la.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, «homem» representa a pessoa humana em geral, conforme o uso masculino singular da linguagem proverbial hebraica.
    reason: cultural_note
lexical_decisions:
- source_word: יַחֲרֹךְ
  choice: assa
  rationale: O verbo חרך normalmente expressa chamuscar ou assar ao fogo. Com צֵידוֹ, a imagem concreta é a de alguém que não aproveita nem prepara a caça obtida; por isso, «assa» é preferível, sem excluir em nota a interpretação mais ampla.
- source_word: רְמִיָּה
  choice: o preguiçoso
  rationale: Neste contraste sapiencial com חָרוּץ, o termo indica negligência, indolência ou disposição preguiçosa, e não principalmente engano. A forma masculina singular conserva o estilo proverbial hebraico.
- source_word: צֵידוֹ
  choice: a sua caça
  rationale: צֵיד designa caça ou presa. «A sua caça» combina naturalmente com o ato de assar e mantém o sufixo possessivo.
- source_word: הוֹן
  choice: riqueza
  rationale: הוֹן significa riqueza, bens ou recursos. «Riqueza» preserva a metáfora econômica da afirmação proverbial.
- source_word: אָדָם
  choice: do homem
  rationale: O substantivo singular אָדָם refere-se aqui ao ser humano de modo geral, expresso na linguagem masculina representativa própria do provérbio.
- source_word: יָקָר
  choice: preciosa
  rationale: O adjetivo comunica alto valor ou preciosidade e qualifica naturalmente «riqueza» em português.
- source_word: חָרוּץ
  choice: diligência
  rationale: A palavra pode designar tanto a pessoa diligente como a qualidade da diligência. A leitura abstrata produz em português uma antítese clara com «o preguiçoso» e corresponde à compreensão adotada do segundo hemistíquio.
theological_decisions:
- issue: Linguagem masculina representativa em אָדָם
  choice: do homem
  alternative: da pessoa; do ser humano
  rationale: Não há questão doutrinária específica. Conserva-se a forma proverbial masculina da fonte, esclarecendo que a referência é genericamente humana.
- issue: Sintaxe comprimida do segundo hemistíquio
  choice: a diligência é a riqueza preciosa do homem
  alternative: o diligente é um bem precioso; o bem precioso do homem é a diligência
  rationale: A sequência hebraica é concisa e admite mais de uma relação sintática entre הוֹן, אָדָם, יָקָר e חָרוּץ. A redação escolhida mantém o contraste entre preguiça e diligência e entende a diligência como verdadeira riqueza, sem transformar a máxima em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção paralela preserva a concisão proverbial; «preguiçoso», «caça», «diligência» e «riqueza preciosa» mantêm a imagem e o contraste da fonte.
