  text: הָפ֣וֹךְ רְשָׁעִ֣ים וְ/אֵינָ֑/ם וּ/בֵ֖ית צַדִּיקִ֣ים יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/007.yaml
  text: The wicked are overthrown and are no more[b][a], but the house of the righteous will stand.
translation:
  language: pt
  text: Os perversos são derrubados e deixam de existir[a], mas a casa dos justos permanecerá firme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e eles não existem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mas a família dos justos permanecerá firme”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפוֹךְ
  choice: são derrubados
  rationale: A forma é elíptica e tem sentido passivo/resultativo no provérbio. A expressão portuguesa explicita naturalmente o predicado sem perder a imagem de queda ou ruína.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado plural designa pessoas moralmente más. “Os perversos” é conciso, corrente e preserva a categoria ética.
- source_word: וְאֵינָם
  choice: e deixam de existir
  rationale: A expressão significa literalmente “e eles não [existem/estão]”. A formulação comunica desaparecimento ou fim sem especificar além do hebraico o modo como isso ocorre.
- source_word: וּבֵית
  choice: mas a casa
  rationale: בַּיִת pode indicar tanto a casa física quanto a família ou o núcleo doméstico. “Casa” conserva essa amplitude; “mas” torna explícito o contraste contextual expresso pela conjunção.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O adjetivo plural substantivado expressa a categoria ética dos que agem com justiça; “os justos” é claro e tradicional sem ser arcaico.
- source_word: יַעֲמֹד
  choice: permanecerá firme
  rationale: O verbo significa literalmente “ficará de pé”. No paralelismo, implica estabilidade e continuidade em oposição à ruína; “permanecerá firme” preserva ambos os sentidos em português natural.
theological_decisions: []
