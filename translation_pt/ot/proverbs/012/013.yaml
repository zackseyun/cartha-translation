base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
translation:
  language: pt
  text: Na transgressão dos lábios há uma armadilha para o homem mau[b][a], mas o justo sai da aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pela transgressão dos lábios, o homem mau cai numa armadilha”. O hebraico é compacto, e a relação entre “transgressão dos lábios” e “armadilha” pode indicar tanto esfera (“na”) como meio ou resultado (“pela”).'
    reason: alternative_reading
  - marker: b
    text: “Lábios” é uma maneira hebraica de se referir à fala ou às palavras proferidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Na transgressão
  rationale: A preposição בְּ pode indicar esfera ou meio. “Na” preserva a formulação compacta e não decide além do necessário se a transgressão é o âmbito ou o meio da armadilha.
- source_word: שְׂפָתַיִם
  choice: dos lábios
  rationale: Mantém a metáfora corporal hebraica para a fala ou as palavras proferidas.
- source_word: מוֹקֵשׁ
  choice: uma armadilha
  rationale: Expressa naturalmente em português a imagem de algo que captura ou enreda.
- source_word: רָע
  choice: o homem mau
  rationale: O adjetivo substantivado singular masculino designa uma pessoa má; a formulação conserva o contraste representativo do provérbio.
- source_word: וַיֵּצֵא
  choice: sai
  rationale: Preserva a imagem concreta do verbo “sair”, sem explicitar interpretativamente “escapa”.
- source_word: מִצָּרָה
  choice: da aflição
  rationale: צָרָה pode indicar aflição, angústia ou dificuldade; “aflição” conserva a intensidade e forma uma expressão natural com “sai”.
- source_word: צַדִּיק
  choice: o justo
  rationale: Tradução substantivada corrente e digna, em contraste direto com “o homem mau”.
theological_decisions:
- issue: Substantivos representativos no singular masculino na literatura sapiencial
  choice: o homem mau ... o justo
  alternative: a pessoa má ... a pessoa justa
  rationale: O hebraico emprega formas masculinas singulares como tipos humanos representativos. A tradução preserva essa forma onde ela permanece natural em português, sem limitar o princípio do provérbio apenas aos homens.
- issue: Relação entre a transgressão dos lábios e a armadilha
  choice: Na transgressão dos lábios há uma armadilha
  alternative: Pela transgressão dos lábios, o homem mau cai numa armadilha
  rationale: A construção hebraica é compacta e permite entender בְּ como esfera ou como meio. O texto principal conserva a ambiguidade; a alternativa explicita a leitura instrumental/resultativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se o paralelismo conciso do provérbio e a metáfora dos lábios. Os marcadores seguem a ordem associada aos termos no texto de consulta ([b] após “lábios” e [a] para a construção alternativa).
