source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה שִׂפְתֵי שָׁ֑קֶר וְ/עֹשֵׂ֖י אֱמוּנָ֣ה רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/022.yaml
  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
translation:
  language: pt
  text: Lábios mentirosos são uma abominação para Yahweh, mas os que agem com fidelidade[a] são o seu prazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que praticam a fidelidade”, “os que agem com verdade” ou “os que são confiáveis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: uma abominação
  rationale: Mantém a forte carga moral do substantivo hebraico, que indica algo detestável ou repulsivo, e preserva o contraste nominal com “prazer”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: lábios mentirosos
  rationale: Expressão portuguesa natural que conserva a imagem hebraica dos “lábios” e comunica a ideia de falsidade deliberada.
- source_word: וְעֹשֵׂי
  choice: mas os que agem
  rationale: O particípio designa aqueles que fazem ou praticam algo. “Mas” explicita naturalmente o contraste antitético indicado pelo contexto proverbial.
- source_word: אֱמוּנָה
  choice: com fidelidade
  rationale: O termo pode abranger fidelidade, verdade, confiabilidade e firmeza. A construção adverbial é natural em português e conserva a referência à conduta, sem limitar indevidamente o sentido.
- source_word: רְצוֹנוֹ
  choice: o seu prazer
  rationale: Expressa aquilo que agrada a Yahweh e forma um contraponto direto e vívido a “abominação”; “seu” retoma Yahweh sem acrescentar interpretação.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e corresponde à transliteração adotada, sem substituí-lo pelo título “SENHOR”.
- issue: Amplitude semântica de אֱמוּנָה
  choice: com fidelidade
  alternative: com verdade; de modo confiável; praticam a fidelidade
  rationale: No contraste com “lábios mentirosos”, o termo pode apontar tanto para veracidade quanto para fidelidade e confiabilidade. A tradução principal mantém essa amplitude, e a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. Conserva-se o paralelismo entre “abominação” e “prazer”, bem como a metáfora de “lábios”. O marcador da nota foi colocado após “com fidelidade”, termo ao qual a alternativa lexical efetivamente se refere.
