  text: מַחְשְׁב֣וֹת צַדִּיקִ֣ים מִשְׁפָּ֑ט תַּחְבֻּל֖וֹת רְשָׁעִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/005.yaml
  text: The thoughts of the righteous are justice[b][a]; the counsels of the wicked are deceit.
translation:
  language: pt
  text: Os pensamentos dos justos são justos[a]; os planos dos perversos são enganosos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os planos dos justos visam à justiça”. O hebraico diz literalmente “justiça” ou “juízo”, usando um substantivo para caracterizar os pensamentos.'
    reason: lexical_alternative
  - marker: b
    text: “Planos” também pode ser traduzido como “conselhos”, “estratégias” ou, neste contexto, “tramas”. O termo hebraico final significa “engano”, “fraude” ou “deceit”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: pensamentos
  rationale: O substantivo pode indicar pensamentos, planos ou intenções. “Pensamentos” preserva a amplitude do termo e contrasta naturalmente com os desígnios deliberados do segundo membro.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O adjetivo substantivado designa pessoas justas; esta forma é concisa, corrente e mantém o plural representativo.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Mantém a forma nominal hebraica e o paralelismo com “engano”, sem resolver a expressão em um adjetivo.
- source_word: תַּחְבֻּלוֹת
  choice: conselhos
  rationale: O termo abrange orientação, deliberação e planejamento estratégico. “Conselhos” conserva essa amplitude sem introduzir por si só uma conotação malévola mais forte que a do contexto.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: O adjetivo substantivado se refere a pessoas moralmente más. “Perversos” é claro e idiomático no português contemporâneo.
- source_word: מִרְמָה
  choice: engano
  rationale: Expressa fraude ou falsidade de modo direto e natural, preservando o contraste nominal com “justiça”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção nominal “são justiça” é deliberadamente marcada para refletir o hebraico e preservar o paralelismo poético com “são engano”; as notas oferecem formulações mais idiomáticas e alternativas lexicais legítimas.
