  text: ט֗וֹב יָפִ֣יק רָ֭צוֹן מֵ/יְהוָ֑ה וְ/אִ֖ישׁ מְזִמּ֣וֹת יַרְשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
translation:
  language: pt
  text: O homem bom alcança o favor[a] de Yahweh, mas Yahweh condena o homem de planos ardilosos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obtém a aprovação de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “homem de planos”; neste contexto, a expressão provavelmente se refere a alguém caracterizado por planos ardilosos ou perversos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: o homem bom
  rationale: O adjetivo substantivado descreve uma pessoa por seu caráter. A formulação explicita o referente humano e preserva o sentido moral amplo de “bom”.
- source_word: יָפִיק
  choice: alcança
  rationale: Neste contexto, o hifil indica obter ou conseguir para si o favor divino. “Alcança” é corrente, conciso e natural em português.
- source_word: רָצוֹן
  choice: favor
  rationale: O substantivo denota aqui benevolência ou aprovação divina; “favor” conserva essa amplitude e se ajusta à concisão proverbial.
- source_word: מֵיְהוָה
  choice: de Yahweh
  rationale: A preposição indica a fonte do favor, e o nome divino é representado diretamente como “Yahweh”.
- source_word: אִישׁ מְזִמּוֹת
  choice: o homem de planos ardilosos
  rationale: Mantém o referente masculino singular e traduz מְזִמּוֹת de modo contextualmente negativo sem convertê-lo explicitamente em “planos perversos”; “ardilosos” comunica astúcia moralmente suspeita.
- source_word: יַרְשִׁיעַ
  choice: ele condena
  rationale: O hifil de רשע significa declarar culpado ou condenar. O pronome retoma naturalmente Yahweh como sujeito implícito, preservando a elipse e a brevidade do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Sujeito implícito de יַרְשִׁיעַ
  choice: “ele” retoma Yahweh
  alternative: “Yahweh condena”; “é condenado”
  rationale: O hebraico não repete o sujeito na segunda oração. Retomar Yahweh por pronome oferece a leitura sintática mais natural sem inserir novamente o nome nem transformar a oração em passiva.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo conciso. “Homem” preserva a forma masculina representativa do provérbio, e “planos ardilosos” mantém a força negativa sugerida pelo contraste sem ampliar o texto para uma acusação mais específica.
