  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֖ף רֵיקִ֣ים חֲסַר לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/011.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues empty things lacks sense.
translation:
  language: pt
  text: Quem cultiva sua terra terá pão de sobra, mas quem corre atrás de coisas vazias[a] não tem juízo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corre atrás de gente imprestável”. O hebraico diz literalmente “vazios” e pode ser entendido em referência a pessoas ou a coisas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: cultiva
  rationale: O particípio de עבד indica aqui o trabalho agrícola. “Cultiva” expressa com naturalidade o ato de trabalhar a terra e evita o possível sentido ambíguo de “serve”.
- source_word: אַדְמָתוֹ
  choice: sua terra
  rationale: אֲדָמָה pode significar solo, chão ou terra; no contexto agrícola, “sua terra” é natural e preserva a referência concreta.
- source_word: יִשְׂבַּע לָחֶם
  choice: terá pão de sobra
  rationale: A expressão significa literalmente ficar saciado de pão. “Terá pão de sobra” comunica provisão abundante em português atual e mantém a imagem concreta do pão.
- source_word: וּמְרַדֵּף
  choice: mas quem corre atrás de
  rationale: A conjunção introduz o contraste do paralelismo. “Corre atrás de” é uma formulação corrente que transmite a busca insistente indicada pelo particípio intensivo.
- source_word: רֵיקִים
  choice: coisas vazias
  rationale: O plural substantivado significa literalmente “vazios” e pode referir-se tanto a coisas ou ocupações inúteis quanto a pessoas imprestáveis. O texto principal adota o sentido impessoal sem eliminar a alternativa, registrada em nota.
- source_word: חֲסַר לֵב
  choice: não tem juízo
  rationale: O idioma hebraico, literalmente “falto de coração”, descreve falta de entendimento ou bom senso. “Não tem juízo” é claro, conciso e adequado à linguagem sapiencial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo antitético foi preservado, assim como as imagens concretas da terra e do pão. A ambiguidade de רֵיקִים foi mantida por meio da nota.
