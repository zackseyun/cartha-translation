  text: חָמַ֣ד רָ֭שָׁע מְצ֣וֹד רָעִ֑ים וְ/שֹׁ֖רֶשׁ צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/012.yaml
  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
translation:
  language: pt
  text: O perverso cobiça a presa dos maus[a], mas a raiz dos justos dá fruto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a rede dos maus”. O substantivo hebraico é difícil e pode se referir a rede, armadilha, presa ou pilhagem.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “a raiz dos justos dá”. “Dá fruto” explicita o provável sentido agrícola da expressão hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  choice: cobiça
  rationale: O verbo expressa desejo intenso; no contexto do perverso e daquilo que os maus obtêm, “cobiça” comunica naturalmente a conotação negativa sem alterar o objeto do desejo.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado singular tem sentido genérico. “O perverso” é conciso, corrente em provérbios e preserva o contraste moral com os justos.
- source_word: מְצוֹד
  choice: a presa
  rationale: O substantivo é difícil e pode indicar presa, produto da caça ou pilhagem, e possivelmente rede ou armadilha. “Presa” preserva a associação com captura e funciona como objeto cobiçado, sem ocultar a alternativa lexical indicada em nota.
- source_word: רָעִים
  choice: dos maus
  rationale: O adjetivo plural substantivado designa pessoas más. “Dos maus” é natural e mantém o paralelismo com “o perverso”.
- source_word: שֹׁרֶשׁ
  choice: a raiz
  rationale: Mantém diretamente a metáfora botânica do hebraico.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O plural substantivado refere-se à classe dos que agem com justiça. “Dos justos” é idiomático e preserva o contraste ético.
- source_word: יִתֵּן
  choice: dá fruto
  rationale: Literalmente, “dá”. Com “raiz” como sujeito, “dá fruto” explicita de modo natural a produtividade implícita na imagem agrícola.
