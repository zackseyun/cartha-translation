id: PRO.12.3
reference: Proverbs 12:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא יִכּ֣וֹן אָדָ֣ם בְּ/רֶ֑שַׁע וְ/שֹׁ֥רֶשׁ צַ֝דִּיקִ֗ים בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/003.yaml
  text: A man is not established by wickedness[b][a], but the root of the righteous will not be moved.
translation:
  language: pt
  text: 'Ninguém se firma pela perversidade,

    mas a raiz dos justos não será abalada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִכּוֹן
  choice: se firma
  rationale: O nifal de כון expressa ser estabelecido ou tornar-se firme. A construção pronominal é natural em português e mantém o sentido resultativo no presente proverbial.
- source_word: אָדָם
  choice: ninguém
  rationale: Neste provérbio, o singular genérico refere-se a qualquer ser humano. “Ninguém”, em correlação com a negação hebraica, comunica isso de modo claro e idiomático sem restringir a afirmação ao sexo masculino.
- source_word: בְּרֶשַׁע
  choice: pela perversidade
  rationale: 'A preposição ב tem valor instrumental: a perversidade é apresentada como meio incapaz de proporcionar estabilidade duradoura.'
- source_word: שֹׁרֶשׁ
  choice: a raiz
  rationale: Preserva-se a metáfora concreta da raiz, que sugere firmeza, continuidade e vida.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O adjetivo plural substantivado designa a classe dos que agem justamente; “os justos” é conciso e tradicional sem ser arcaico.
- source_word: בַּל יִמּוֹט
  choice: não será abalada
  rationale: A negativa poética בַּל e o verbo מוט negam movimento, oscilação ou perda de estabilidade. “Não será abalada” mantém a imagem e concorda naturalmente com “raiz”.
theological_decisions:
- issue: Referência humana genérica no discurso proverbial
  choice: Usar “ninguém” para expressar a negação aplicada a qualquer pessoa
  alternative: “O homem não se firma” ou “Uma pessoa não se firma”
  rationale: אָדָם é singular, mas tem alcance humano genérico neste contexto. Em português atual, “ninguém” reproduz com naturalidade a combinação לֹא + אָדָם e evita sugerir que o princípio se limite aos homens.
- issue: Natureza da estabilidade dos justos
  choice: Conservar a metáfora da raiz que não é abalada
  alternative: Explicitar como “a estabilidade dos justos permanecerá”
  rationale: 'O texto hebraico não explica nem espiritualiza a metáfora. Mantê-la preserva sua amplitude: firmeza, permanência e vitalidade.'
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Perversidade” representa רֶשַׁע com força moral ampla; “será abalada” conserva a linguagem figurada de estabilidade sem soar arcaica.
