  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
translation:
  language: pt
  text: Na vereda da justiça está a vida[a], e em seu caminho não há morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e sua vereda é imortalidade”. Essa tradução reflete outra interpretação do difícil hebraico do segundo membro do versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/אֹרַח
  choice: Na vereda da
  rationale: אֹרַח designa vereda, caminho ou curso de vida. “Na vereda” preserva a metáfora moral e expressa naturalmente o בְּ locativo.
- source_word: צְדָקָה
  choice: justiça
  rationale: צְדָקָה abrange justiça e retidão. Neste contexto sapiencial, “justiça” é natural em português e comunica a conduta moralmente correta sem restringir o campo semântico.
- source_word: חַיִּים
  choice: vida
  rationale: 'Embora tenha forma plural em hebraico, חַיִּים normalmente funciona como substantivo coletivo ou abstrato no singular: “vida”.'
- source_word: וְ/דֶרֶךְ נְתִיבָה
  choice: e em seu caminho
  rationale: A expressão hebraica é compacta e difícil, reunindo termos semanticamente próximos para caminho e vereda. “Em seu caminho” retoma a vereda da justiça, conserva o paralelismo e evita uma combinação pouco natural em português.
- source_word: אַל
  choice: não há
  rationale: Embora אַל seja com frequência uma partícula proibitiva, aqui é entendido em sentido negativo. “Não há” produz uma afirmação proverbial coerente sem emendar o texto massorético.
- source_word: מָוֶת
  choice: morte
  rationale: מָוֶת significa “morte” e forma a antítese direta com “vida”.
theological_decisions:
- issue: Interpretação do segundo membro וְדֶרֶךְ נְתִיבָה אַל־מָוֶת
  choice: 'O caminho da justiça não contém nem conduz à morte: “e em seu caminho não há morte”.'
  alternative: “e sua vereda é imortalidade” ou “e o caminho de sua vereda leva à morte”.
  rationale: O hebraico massorético é sintaticamente comprimido e admite interpretações divergentes. O texto principal mantém a leitura negativa que melhor sustenta a antítese entre vida e morte no provérbio, enquanto a nota registra a leitura alternativa de “imortalidade” sem introduzir emenda especulativa no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vereda” conserva a imagem poética tradicional sem soar arcaica; “caminho” cria variação natural no paralelismo. O marcador [a] aparece no texto principal e corresponde à nota.
