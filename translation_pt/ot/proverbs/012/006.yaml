base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/006.yaml
  text: The words of the wicked are an ambush for blood[b][a], but the mouth of the upright delivers them.
translation:
  language: pt
  text: As palavras dos perversos são uma emboscada para derramar sangue,[a] mas a boca dos íntegros os livra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficam à espreita para derramar sangue”. O hebraico retrata as palavras dos perversos como uma emboscada mortal.'
    reason: lexical_alternative
  - marker: b
    text: '“Os” pode referir-se, de modo geral, aos ameaçados por essa violência. Alguns entendem o sentido como reflexivo: “a boca dos íntegros livra a si mesmos”, ou simplesmente: “livra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי רְשָׁעִים
  choice: As palavras dos perversos
  rationale: Preserva a referência direta à fala e o contraste moral com os íntegros, em português natural e conciso.
- source_word: אֱרָב דָּם
  choice: são uma emboscada para derramar sangue
  rationale: Mantém a metáfora da emboscada e torna inteligível o uso metonímico de 'sangue' como violência mortal, sem eliminar a imagem hebraica.
- source_word: וּפִי יְשָׁרִים
  choice: mas a boca dos íntegros
  rationale: Conserva a imagem concreta de 'boca', o paralelismo com 'palavras' e o contraste introduzido pela conjunção.
- source_word: יַצִּילֵם
  choice: os livra
  rationale: Representa o hifil de נצל e mantém explícito o objeto plural, cuja referência exata permanece ambígua no hebraico.
theological_decisions:
- issue: Referente do sufixo plural em יַצִּילֵם
  choice: '''os livra'', entendido de modo aberto como referência aos ameaçados pela violência'
  alternative: '''livra a si mesmos'' ou simplesmente ''livra'''
  rationale: A morfologia traz objeto masculino plural, mas o antecedente não é expresso. A tradução preserva essa abertura sem impor uma leitura reflexiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo poético, a metáfora da emboscada e a ambiguidade do pronome final.
