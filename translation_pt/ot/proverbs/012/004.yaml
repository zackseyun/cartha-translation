  text: אֵֽשֶׁת חַ֭יִל עֲטֶ֣רֶת בַּעְלָ֑/הּ וּ/כְ/רָקָ֖ב בְּ/עַצְמוֹתָ֣י/ו מְבִישָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/004.yaml
  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
translation:
  language: pt
  text: Uma esposa de valor[a] é a coroa de seu marido, mas a que causa vergonha é como podridão em seus ossos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma esposa capaz”, “valorosa” ou “excelente”. O termo hebraico חַיִל abrange força, mérito, competência e excelência.
    reason: lexical_alternative
  - marker: b
    text: A imagem da “podridão nos ossos” retrata uma vergonha que corrói profundamente por dentro.
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: uma esposa de valor
  rationale: אֵשֶׁת é entendido no sentido conjugal por causa da referência explícita a “seu marido”. חַיִל reúne ideias de força, mérito, capacidade e excelência; “de valor” conserva essa amplitude sem limitar a expressão apenas à virtude moral.
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: Mantém a imagem hebraica de honra, distinção e dignidade conferidas ao marido.
- source_word: בַּעְלָהּ
  choice: de seu marido
  rationale: Expressa de modo natural em português a relação possessiva do hebraico.
- source_word: וּכְרָקָב
  choice: mas ... como podridão
  rationale: O contexto exige contraste, daí “mas”; רָקָב designa podridão ou decomposição, e a comparação vívida é preservada.
- source_word: בְּעַצְמוֹתָיו
  choice: em seus ossos
  rationale: Preserva literalmente a metáfora hebraica de deterioração profunda e interior.
- source_word: מְבִישָׁה
  choice: a que causa vergonha
  rationale: O particípio feminino causativo descreve aquela que provoca vergonha. A formulação mantém o sentido ativo e a referência à esposa sem acrescentar um objeto não expresso no hebraico.
