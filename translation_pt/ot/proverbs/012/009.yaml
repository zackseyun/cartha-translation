  text: ט֣וֹב נִ֭קְלֶה וְ/עֶ֣בֶד ל֑/וֹ מִ֝/מְּתַכַּבֵּ֗ד וַ/חֲסַר לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/009.yaml
  text: Better is one who is lightly esteemed and has a servant than one who honors himself and lacks bread[a].
translation:
  language: pt
  text: Melhor é quem é pouco estimado, mas tem um servo, do que quem se dá importância, mas não tem pão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do que quem finge ser importante e não tem pão”. O termo hebraico traduzido por “se dá importância” pode indicar alguém que procura parecer honrado ou importante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: No contexto comparativo do provérbio, טוֹב tem o sentido idiomático de “melhor”; a cópula é acrescentada naturalmente em português.
- source_word: נִקְלֶה
  choice: quem é pouco estimado
  rationale: O particípio nifal indica alguém considerado insignificante ou de pouca importância social, sem intensificar o sentido para “desprezado”.
- source_word: וְעֶבֶד לוֹ
  choice: mas tem um servo
  rationale: A expressão significa literalmente “e um servo para ele”, isto é, alguém que possui um servo doméstico. “Mas” explicita o contraste implícito entre baixa estima social e recursos reais.
- source_word: מִמְּתַכַּבֵּד
  choice: quem se dá importância
  rationale: O particípio hitpael de כבד é reflexivo e pode indicar alguém que se apresenta como importante ou digno de honra. A formulação preserva tanto a autoexaltação quanto a possível pretensão social.
- source_word: וַחֲסַר לָחֶם
  choice: mas não tem pão
  rationale: לֶחֶם conserva a imagem concreta do pão, representando a falta do alimento básico. “Mas” torna natural em português o contraste com a importância que a pessoa atribui a si mesma.
