id: PRO.12.23
reference: Proverbs 12:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָדָ֣ם עָ֭רוּם כֹּ֣סֶה דָּ֑עַת וְ/לֵ֥ב כְּ֝סִילִ֗ים יִקְרָ֥א אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/023.yaml
  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
translation:
  language: pt
  text: A pessoa prudente encobre o que sabe[a], mas o coração dos tolos proclama a insensatez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A pessoa sagaz oculta o conhecimento”. O adjetivo hebraico também pode significar “sagaz”, e o verbo significa literalmente “cobre” ou “encobre”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “clama a insensatez”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: pessoa
  rationale: O substantivo singular designa um indivíduo representativo. Em português atual, “pessoa” expressa naturalmente o caráter geral do provérbio sem sugerir que ele se aplique apenas a homens.
- source_word: עָרוּם
  choice: prudente
  rationale: No contexto sapiencial positivo de Provérbios, o adjetivo indica alguém sensato e sagaz; “prudente” se ajusta ao contraste com os tolos, embora “sagaz” também seja possível.
- source_word: כֹּסֶה דָּעַת
  choice: encobre o que sabe
  rationale: O particípio significa literalmente “cobre/encobre”, e דָּעַת significa “conhecimento”. A formulação natural em português comunica a retenção discreta do conhecimento sem implicar necessariamente fraude.
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica do centro interior do pensamento e da disposição, em vez de reduzi-la apenas à mente.
- source_word: כְּסִילִים
  choice: tolos
  rationale: É o termo sapiencial tradicional e adequado para a categoria moral e intelectual retratada em Provérbios.
- source_word: יִקְרָא
  choice: proclama
  rationale: O verbo significa “chamar, clamar”. Neste paralelismo, “proclama” transmite que a insensatez se torna pública, preservando no rodapé a imagem mais literal.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Expressa de modo corrente e digno a falta moral e intelectual indicada pelo termo hebraico, evitando a repetição estilisticamente pesada de “tolos” e “tolice”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A primeira oração foi formulada idiomaticamente, enquanto as notas preservam as alternativas mais literais e a amplitude lexical do hebraico.
