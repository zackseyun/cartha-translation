  text: אֹהֵ֣ב מ֭וּסָר אֹ֣הֵֽב דָּ֑עַת וְ/שֹׂנֵ֖א תוֹכַ֣חַת בָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/001.yaml
  text: Whoever loves discipline loves knowledge[a], but he who hates reproof is stupid.
translation:
  language: pt
  text: Quem ama a disciplina ama o conhecimento, mas quem odeia a repreensão é estúpido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «insensato» ou «embrutecido». O termo hebraico pode descrever alguém obtuso, sem discernimento ou semelhante a um animal irracional.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Quem ama
  rationale: O particípio tem sentido genérico e proverbial. “Quem ama” é natural em português e não restringe a afirmação ao gênero masculino.
- source_word: מוּסָר
  choice: disciplina
  rationale: Em Provérbios, o termo abrange formação, instrução e correção. “Disciplina” preserva esse caráter formativo e corretivo.
- source_word: דָּעַת
  choice: conhecimento
  rationale: Equivalente corrente no contexto sapiencial, mantendo o vínculo temático entre aceitar disciplina e adquirir conhecimento.
- source_word: וְשֹׂנֵא
  choice: mas quem odeia
  rationale: Embora a conjunção seja formalmente aditiva, o paralelismo é antitético; “mas” explicita de modo natural o contraste sem alterar o sentido.
- source_word: תוֹכַחַת
  choice: repreensão
  rationale: O substantivo designa censura ou correção verbal. “Repreensão” é claro, digno e corrente em português.
- source_word: בָּעַר
  choice: insensato
  rationale: O adjetivo caracteriza alguém embrutecido, obtuso ou sem discernimento. “Insensato” comunica a avaliação sapiencial com naturalidade, enquanto a nota preserva a imagem mais áspera do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo conciso. Optou-se por “insensato” no texto por sua adequação ao registro sapiencial e por “estúpido” e “embrutecido” na nota para preservar a força e a amplitude semântica do hebraico.
