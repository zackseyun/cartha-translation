  yaml_path: translation/ot/proverbs/012/019.yaml
  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
translation:
  language: pt
  text: O lábio verdadeiro permanece firme para sempre,[a] mas a língua mentirosa dura apenas um instante.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “O lábio da verdade é estabelecido para sempre”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é difícil; o sentido no contexto parece ser que a fala falsa dura muito pouco, em contraste com a permanência da verdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  choice: O lábio verdadeiro
  rationale: Preserva a imagem concreta e o singular proverbial do hebraico, usando uma formulação natural em português para caracterizar a fala veraz.
- source_word: תִּכּוֹן
  choice: permanece firme
  rationale: O nifal de כון expressa estabilidade ou firmeza duradoura. A forma presente comunica adequadamente a verdade geral do provérbio.
- source_word: לָעַד
  choice: para sempre
  rationale: Expressa com clareza a permanência em contraste com a brevidade da falsidade.
- source_word: וְעַד
  choice: mas
  rationale: Embora a conjunção seja formalmente aditiva, o paralelismo antitético pede uma ligação contrastiva em português.
- source_word: אַרְגִּיעָה
  choice: dura apenas um instante
  rationale: A forma hebraica é difícil; no contexto, aponta para duração muito breve. A tradução explicita o verbo subentendido e mantém o contraste com 'para sempre'.
- source_word: לְשׁוֹן שָׁקֶר
  choice: a língua mentirosa
  rationale: Mantém a metáfora corporal hebraica para a fala e verte naturalmente a construção 'língua de falsidade'.
