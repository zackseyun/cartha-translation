review_pass:
  verdict: revise
  source_fidelity: A primeira oração transmite adequadamente a metonímia hebraica de “mão” e a ideia de ascendência. Na segunda, רְמִיָּה, em contraste com os diligentes, é mais bem vertido em português por uma referência a pessoas negligentes/preguiçosas, com a possibilidade do substantivo abstrato registrada em nota. “Mão negligente” introduz uma elipse que o hebraico não expressa claramente e torna a nota lexical menos coerente. מַס refere-se a serviço de trabalho imposto; “trabalho compulsório” é preciso e evita sugerir uma pluralidade ausente no hebraico.
  naturalness: “A mão dos diligentes governará” é claro e mantém o sabor proverbial. “Os negligentes serão submetidos a trabalho compulsório” é idiomático em português moderno, preserva o contraste pessoal e expressa naturalmente a sujeição indicada por לָמַס.
  terminology: “Diligentes”, “governará” e “trabalho compulsório” são escolhas adequadas. A nota cultural pode mencionar “corveia”, mas “trabalho tributário” é menos transparente e pode ser entendido como imposto, não como serviço exigido.
  issues:
