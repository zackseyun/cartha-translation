  text: יַד חָרוּצִ֥ים תִּמְשׁ֑וֹל ו֝/רְמִיָּ֗ה תִּהְיֶ֥ה לָ/מַֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/024.yaml
  text: The hand of the diligent will rule[b][a], but the slack will be put to forced labor.
translation:
  language: pt
  text: A mão dos diligentes governará, mas os negligentes[a] serão submetidos a trabalho compulsório[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a negligência” ou “a preguiça”. O hebraico também pode ser entendido como um substantivo abstrato.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa serviço de trabalho compulsório, também chamado corveia.
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  choice: mão
  rationale: Mantém a imagem concreta hebraica, em que “mão” representa a ação, a capacidade e o trabalho da pessoa.
- source_word: חָרוּצִים
  choice: dos diligentes
  rationale: Expressa pessoas trabalhadoras e aplicadas, em contraste direto com a negligência da segunda oração.
- source_word: תִּמְשׁוֹל
  choice: governará
  rationale: O verbo מָשַׁל denota governar, dominar ou exercer autoridade; “governará” é claro e preserva a força do hebraico.
- source_word: רְמִיָּה
  choice: mão negligente
  rationale: A forma feminina pode qualificar a “mão” subentendida da primeira oração. Essa leitura produz um contraste concreto entre a mão diligente e a negligente, sem eliminar a alternativa de entender o termo como o substantivo abstrato “negligência” ou “preguiça”.
- source_word: תִּהְיֶה
  choice: será submetida
  rationale: Expansão idiomática de “será” diante de לָמַס, deixando claro que o resultado é sujeição a serviço compulsório.
- source_word: לָמַס
  choice: a trabalhos forçados
  rationale: מַס designa serviço compulsório, corveia ou trabalho imposto, e não apenas tributo monetário.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a imagem proverbial da “mão” e assinala-se em nota a ambiguidade gramatical e lexical de רְמִיָּה.
