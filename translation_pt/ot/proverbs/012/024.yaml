revisions:
- from: A mão dos diligentes governará, mas a mão negligente[a] será submetida a trabalhos forçados[b].
  to: A mão dos diligentes governará, mas os negligentes[a] serão submetidos a trabalho compulsório[b].
  rationale: A revisão elimina a “mão” acrescentada na segunda oração e traduz o contraste proverbial de modo natural entre pessoas diligentes e negligentes, sem ocultar em nota a leitura abstrata possível de רְמִיָּה. Também ajusta a expressão de מַס para o singular coletivo mais próximo do hebraico.
