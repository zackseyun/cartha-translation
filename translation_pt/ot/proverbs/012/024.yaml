    issue: “a mão negligente” como sujeito da segunda oração
    rationale: O texto hebraico traz רְמִיָּה, termo que aqui designa negligência/preguiça e pode ter sentido pessoal coletivo no contraste. Embora se possa defender uma associação conceitual com “mão”, o substantivo “mão” não é repetido; explicitá-lo na tradução restringe indevidamente a construção e cria tensão com a nota, que apresenta leituras abstratas.
  - severity: low
    issue: “trabalhos forçados” no plural
    rationale: מַס designa o estado ou serviço compulsório. O singular “trabalho compulsório” representa mais diretamente o termo e soa mais preciso no provérbio.
