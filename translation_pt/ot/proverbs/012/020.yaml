  text: מִ֭רְמָה בְּ/לֶב חֹ֣רְשֵׁי רָ֑ע וּֽ/לְ/יֹעֲצֵ֖י שָׁל֣וֹם שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/020.yaml
  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
translation:
  language: pt
  text: Há engano no coração dos que planejam o mal, mas há alegria para os que aconselham a paz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida como “paz” também pode incluir as ideias de bem-estar e integridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְמָה
  choice: engano
  rationale: O substantivo indica fraude ou intenção enganosa. “Engano” é claro, conciso e adequado ao contraste moral do provérbio.
- source_word: בְּלֶב
  choice: no coração
  rationale: Mantém a imagem hebraica do coração como centro das intenções e disposições interiores; o verbo “há” é suprido naturalmente em português por se tratar de uma oração nominal.
- source_word: חֹרְשֵׁי רָע
  choice: os que planejam o mal
  rationale: O particípio de חרשׁ, neste contexto, comunica a ideia de conceber ou tramar algo nocivo. “Planejam” preserva a noção de intenção deliberada sem restringi-la necessariamente a uma conspiração.
- source_word: וּלְיֹעֲצֵי שָׁלוֹם
  choice: mas ... para os que aconselham a paz
  rationale: A construção com לְ identifica o grupo ao qual cabe a alegria, enquanto o particípio יֹעֲצֵי preserva a ação de aconselhar ou recomendar. A conjunção foi vertida como “mas” para expressar o contraste entre os dois membros do provérbio.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” é a correspondência principal e natural em português, embora o termo hebraico também possa abranger bem-estar, integridade e prosperidade.
- source_word: שִׂמְחָה
  choice: há alegria
  rationale: A oração hebraica não tem verbo expresso. “Há alegria para” reproduz naturalmente em português a relação indicada pela preposição sem transformar a afirmação em posse estrita.
