  text: יֵ֣שׁ בּ֭וֹטֶה כְּ/מַדְקְר֣וֹת חָ֑רֶב וּ/לְשׁ֖וֹן חֲכָמִ֣ים מַרְפֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/018.yaml
  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
translation:
  language: pt
  text: Há quem fale sem pensar, como estocadas de espada,[a] mas a língua dos sábios é cura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como golpes de espada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “traz cura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há quem
  rationale: Introduz, de modo idiomático em português, a existência de um tipo de pessoa, sem identificar um indivíduo específico.
- source_word: בּוֹטֶה
  choice: fale sem pensar
  rationale: Expressa a fala precipitada, irrefletida e nociva indicada pelo particípio, em linguagem natural e amplamente compreensível.
- source_word: כְּמַדְקְרוֹת חָרֶב
  choice: como golpes de espada
  rationale: Conserva a comparação vívida com golpes que perfuram e mantém o plural, sugerindo ferimentos repetidos.
- source_word: וּלְשׁוֹן
  choice: mas a língua
  rationale: Preserva a metáfora hebraica da língua como fala; a conjunção adversativa explicita naturalmente o contraste do provérbio.
- source_word: חֲכָמִים
  choice: dos sábios
  rationale: Refere-se genericamente às pessoas sábias, sem restringir o gênero, e mantém a forma proverbial concisa.
- source_word: מַרְפֵּא
  choice: é cura
  rationale: Mantém a construção nominal e a concisão do hebraico, preservando a ideia de que a fala sábia possui caráter restaurador.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação proverbial concisa. “Fale sem pensar” favorece clareza internacional e leitura natural no Brasil; “é cura” conserva a força metafórica e a estrutura nominal do hebraico.
