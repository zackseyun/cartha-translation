  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
translation:
  language: pt
  text: O homem é elogiado segundo o seu discernimento[a], mas quem tem o coração tortuoso[b] será desprezado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O homem é elogiado na medida da sua prudência”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “tortuoso de coração”, expressão que indica uma disposição interior moralmente desviada.
    reason: cultural_note
lexical_decisions:
- source_word: לְפִי
  choice: segundo
  rationale: A expressão funciona como padrão de medida ou proporção. “Segundo” é natural em português e preserva a ideia de que o elogio corresponde ao discernimento demonstrado.
- source_word: שִׂכְלוֹ
  choice: seu discernimento
  rationale: שֵׂכֶל abrange discernimento, prudência e bom senso. “Discernimento” mantém a dimensão intelectual e prática própria da literatura sapiencial.
- source_word: יְהֻלַּל
  choice: é elogiado
  rationale: O Pual indica que a pessoa recebe elogio. O presente expressa adequadamente uma verdade geral de caráter proverbial.
- source_word: אִישׁ
  choice: O homem
  rationale: O substantivo hebraico está no masculino singular e tem força representativa neste provérbio. “O homem” preserva a forma da fonte e é inteligível em português.
- source_word: נַעֲוֵה
  choice: tortuoso
  rationale: O termo comunica desvio, deformação ou perversidade moral. “Tortuoso” conserva a metáfora do que não é reto e combina naturalmente com “coração”.
- source_word: לֵב
  choice: coração
  rationale: No hebraico bíblico, לֵב inclui pensamento, vontade e disposição moral, além das emoções. “Coração” preserva o idioma bíblico sem restringir seu alcance.
- source_word: יִהְיֶה לָבוּז
  choice: será desprezado
  rationale: A construção descreve alguém que se torna objeto de desprezo. “Será desprezado” é conciso, natural e preserva a forma prospectiva do hebraico.
