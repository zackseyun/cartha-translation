id: PRO.12.26
reference: Proverbs 12:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָתֵ֣ר מֵ/רֵעֵ֣/הוּ צַדִּ֑יק וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תַּתְעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
translation:
  language: pt
  text: O justo guia o seu próximo[a][b], mas o caminho dos maus os leva a se desviar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O justo é mais excelente do que o seu próximo”. O sentido do verbo hebraico יָתֵר neste versículo é difícil, e essa tradução tradicional continua possível.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico traduzido como “próximo” também pode significar “amigo” ou “companheiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָתֵר
  choice: guia
  rationale: A forma hebraica é notoriamente difícil. O paralelismo antitético com o caminho dos maus, que desencaminha, favorece aqui um sentido ativo de orientar ou conduzir corretamente, embora a leitura comparativa tradicional continue possível.
- source_word: מֵרֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode designar próximo, amigo ou companheiro. “Próximo” mantém o alcance social amplo típico da literatura sapiencial; a preposição מ־ integra a construção difícil da primeira oração.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado designa genericamente a pessoa justa. “O justo” é conciso, natural e tradicional em português, sem exigir referência exclusiva ao sexo masculino.
- source_word: וְדֶרֶךְ
  choice: mas o caminho
  rationale: Embora וְ normalmente signifique “e”, o paralelismo opõe a conduta do justo à dos maus, justificando o valor adversativo “mas”.
- source_word: רְשָׁעִים
  choice: os maus
  rationale: Substantivo adjetival plural comum em Provérbios. “Os maus” é claro e corrente; evita atribuir ao termo um sentido estritamente forense.
- source_word: תַּתְעֵם
  choice: os leva a se desviar
  rationale: A forma causativa de תעה com sufixo de terceira pessoa plural significa fazê-los vaguear ou desviar-se. A expressão preserva tanto a causatividade quanto o referente plural ambíguo do hebraico.
theological_decisions:
- issue: Sentido da primeira oração
  choice: O justo guia o seu próximo
  alternative: O justo é mais excelente do que o seu próximo
  rationale: A leitura adotada forma um contraste direto entre a orientação proporcionada pelo justo e o desencaminhamento causado pela conduta dos maus. Como o hebraico admite análise comparativa tradicional, essa possibilidade é preservada em nota.
- issue: Referente do pronome em תַּתְעֵם
  choice: os leva a se desviar
  alternative: leva os próprios maus a se desviar / leva outras pessoas a se desviar
  rationale: O sufixo plural não identifica inequivocamente seu referente. A tradução mantém a mesma ambiguidade, sem decidir se o caminho desencaminha os maus ou aqueles que o seguem.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção concisa conserva o paralelismo antitético e mantém na nota a incerteza lexical genuína da primeira oração.
