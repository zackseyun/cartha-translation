  text: אֱוִ֗יל בַּ֭/יּוֹם יִוָּדַ֣ע כַּעְס֑/וֹ וְ/כֹסֶ֖ה קָל֣וֹן עָרֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/016.yaml
  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
translation:
  language: pt
  text: A ira do insensato se revela imediatamente[a], mas o prudente encobre a desonra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no mesmo dia”. O hebraico diz literalmente “no dia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “oculta a vergonha”; o termo também pode se referir a um insulto ou a uma afronta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: insensato
  rationale: Em Provérbios, designa uma pessoa moral e praticamente tola, não alguém com mera limitação intelectual. “Insensato” expressa bem esse sentido no português atual.
- source_word: בַּיּוֹם
  choice: imediatamente
  rationale: A expressão significa literalmente “no dia”, mas, neste contexto proverbial, indica que a ira se torna visível sem demora. A nota preserva a leitura mais literal.
- source_word: יִוָּדַע
  choice: se revela
  rationale: O nifal de ידע indica que a ira se torna conhecida ou evidente. “Se revela” preserva essa ideia em português natural.
- source_word: כַּעְסוֹ
  choice: a ira
  rationale: O substantivo pode indicar ira, irritação ou desgosto. “Ira” é conciso e adequado ao contraste com o autocontrole do prudente.
- source_word: וְכֹסֶה
  choice: mas ... encobre
  rationale: O particípio de כסה significa cobrir ou ocultar. “Encobre” mantém a metáfora hebraica, e a conjunção foi traduzida adversativamente por causa do contraste entre as duas atitudes.
- source_word: קָלוֹן
  choice: a desonra
  rationale: O termo pode designar desonra, vergonha ou um insulto sofrido. “Desonra” mantém a amplitude sem decidir se se trata de uma afronta pessoal ou de uma situação vergonhosa.
- source_word: עָרוּם
  choice: o prudente
  rationale: Em Provérbios, o termo costuma ter sentido positivo de discernimento e cautela. O adjetivo substantivado “o prudente” reproduz de modo conciso a figura contrastante.
