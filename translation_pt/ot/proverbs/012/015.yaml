  text: דֶּ֣רֶךְ אֱ֭וִיל יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/שֹׁמֵ֖עַ לְ/עֵצָ֣ה חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
translation:
  language: pt
  text: O caminho do tolo é certo aos seus próprios olhos[a], mas quem dá ouvidos ao conselho é sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O caminho do tolo lhe parece certo”. A expressão hebraica “aos seus próprios olhos” refere-se ao julgamento ou à avaliação que a pessoa faz por si mesma.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Preserva a metáfora característica da literatura sapiencial para o modo de viver ou proceder, sem explicá-la em excesso.
- source_word: אֱוִיל
  choice: tolo
  rationale: Em Provérbios, designa quem carece de sabedoria tanto no juízo quanto na conduta; “tolo” é a equivalência portuguesa tradicional, clara e adequada.
- source_word: יָשָׁר
  choice: certo
  rationale: Neste contexto, expressa a avaliação de que o caminho é correto segundo o próprio indivíduo, e não necessariamente retidão objetiva.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Mantém a imagem e o conhecido idiomatismo hebraico referente ao julgamento ou à avaliação que alguém faz de si mesmo.
- source_word: וְשֹׁמֵעַ
  choice: mas quem dá ouvidos
  rationale: “Mas” explicita o contraste entre os dois membros do provérbio; “dá ouvidos” traduz naturalmente o particípio como disposição habitual de escutar.
- source_word: לְעֵצָה
  choice: ao conselho
  rationale: “Conselho” corresponde ao vocabulário sapiencial e comunica orientação ponderada, não mera sugestão casual.
- source_word: חָכָם
  choice: é sábio
  rationale: A construção predicativa é natural em português e preserva o contraste direto entre o tolo e quem age com sabedoria.
theological_decisions:
- issue: Formas masculinas singulares usadas genericamente no provérbio
  choice: Manter “do tolo” e empregar “quem” na segunda linha, com o possessivo masculino exigido pelo referente
  alternative: Usar formulações inteiramente impessoais, como “para si mesmo”
  rationale: O hebraico apresenta o masculino singular como representante genérico. A formulação portuguesa conserva essa forma no primeiro membro, enquanto “quem” torna o segundo natural e inclusivo sem alterar o sentido.
- issue: Caráter subjetivo da afirmação de que o caminho é “certo”
  choice: Preservar a expressão “é certo aos seus próprios olhos”
  alternative: Explicitar “parece certo para ele”
  rationale: 'A tradução principal mantém a tensão e a forma idiomática do hebraico: o texto descreve a avaliação do tolo, não declara objetivamente correto o seu caminho. A nota esclarece a alternativa sem resolver silenciosamente a ambiguidade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo conciso do provérbio e a imagem hebraica “aos seus próprios olhos”; “dá ouvidos ao conselho” oferece naturalidade sem perder o tom sapiencial.
