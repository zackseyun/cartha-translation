base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/017.yaml
  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
translation:
  language: pt
  text: Quem profere a verdade[a] declara o que é justo[b], mas a testemunha falsa profere engano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Quem profere fidelidade declara o que é justo.»'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «declara justiça».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפִיחַ
  choice: profere
  rationale: O hifil de נפח evoca literalmente soprar ou expelir o ar, mas aqui funciona como imagem para emitir palavras. “Profere” comunica o sentido idiomático com dignidade e naturalidade em português.
- source_word: אֱמוּנָה
  choice: a verdade
  rationale: No contraste com a testemunha falsa, o termo indica fala verdadeira e digna de confiança. “A verdade” é claro no contexto, enquanto “fidelidade” é preservado em nota como alternativa lexical genuína.
- source_word: יַגִּיד
  choice: declara
  rationale: O hifil de נגד significa tornar conhecido, contar ou declarar. “Declara” combina com o contexto de testemunho e mantém o tom conciso.
- source_word: צֶדֶק
  choice: o que é justo
  rationale: Neste contexto jurídico e ético, צֶדֶק abrange aquilo que é correto ou justo. A expressão evita restringir o sentido exclusivamente à virtude moral ou à justiça judicial.
- source_word: עֵד שְׁקָרִים
  choice: a testemunha falsa
  rationale: A construção hebraica é literalmente “testemunha de falsidades/mentiras”; “testemunha falsa” é a formulação idiomática e consagrada em português.
- source_word: מִרְמָה
  choice: engano
  rationale: 'O substantivo final é elíptico no hebraico. A repetição de “profere” em português explicita a relação verbal exigida pela sintaxe receptora sem alterar a antítese: a testemunha falsa produz fala enganosa.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A imagem literal de “soprar” foi vertida idiomaticamente por “proferir”; a elipse da segunda metade foi levemente explicitada pela repetição do verbo para evitar uma frase truncada em português.
