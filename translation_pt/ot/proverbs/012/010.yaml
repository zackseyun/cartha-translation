  text: יוֹדֵ֣עַ צַ֭דִּיק נֶ֣פֶשׁ בְּהֶמְתּ֑/וֹ וְֽ/רַחֲמֵ֥י רְ֝שָׁעִ֗ים אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/010.yaml
  text: A righteous man knows the life of his animal[a], but the compassion of the wicked is cruel.
translation:
  language: pt
  text: O justo conhece a vida do seu animal[a], mas a compaixão dos perversos é cruel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conhece as necessidades do seu animal”. O hebraico diz literalmente “conhece a vida de seu animal”, expressando atenção cuidadosa ao bem-estar da criatura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדֵעַ
  choice: conhece
  rationale: Preserva o sentido lexical básico de conhecer e compreender, enquanto o contexto comunica a ideia de atenção cuidadosa.
- source_word: צַדִּיק
  choice: o justo
  rationale: Reproduz o substantivo adjetival masculino singular e sua função proverbial de modo natural e tradicional em português.
- source_word: נֶפֶשׁ
  choice: a vida
  rationale: Neste contexto, refere-se à vida ou condição vivente do animal. “Vida” conserva a imagem hebraica sem introduzir as possíveis conotações enganosas de “alma”.
- source_word: בְּהֶמְתּוֹ
  choice: do seu animal
  rationale: בְּהֵמָה pode designar animal doméstico ou gado; “animal” mantém a referência ampla e soa natural em português moderno.
- source_word: רַחֲמֵי
  choice: a compaixão
  rationale: O plural construto hebraico pode indicar sentimentos ou atos de misericórdia; o singular coletivo “compaixão” é claro e idiomático em português.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Expressa de forma concisa o plural substantivado usado para pessoas moralmente más, em contraste com “o justo”.
- source_word: אַכְזָרִי
  choice: cruel
  rationale: 'Equivalente direto que preserva a força e a ironia do contraste: até a compaixão dos perversos se mostra cruel.'
theological_decisions:
- issue: Masculino singular no sujeito proverbial
  choice: o justo
  alternative: a pessoa justa; os justos
  rationale: O hebraico emprega o masculino singular com função proverbial e aplicação geral. A tradução preserva essa forma sem restringir o alcance moral do provérbio aos homens.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A formulação conserva o paralelismo conciso e a tensão irônica do hebraico.
