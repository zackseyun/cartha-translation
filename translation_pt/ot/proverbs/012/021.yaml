  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: pt
  text: Nenhum mal sobrevém ao justo, mas os perversos ficam cheios de desgraça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְאֻנֶּה
  choice: sobrevém
  rationale: O verbo no pual expressa aquilo que acontece a alguém ou o atinge. “Sobrevém” preserva a ideia de ocorrência adversa e se ajusta ao caráter proverbial da frase.
- source_word: צַּדִּיק
  choice: justo
  rationale: Equivalente corrente e direto para a pessoa caracterizada pela retidão.
- source_word: אָוֶן
  choice: mal
  rationale: O termo pode indicar perversidade, dano, desgraça ou dificuldade. “Mal” conserva essa amplitude sem restringir o sentido apenas ao sofrimento ou apenas à culpa moral.
- source_word: רְשָׁעִים
  choice: perversos
  rationale: Expressa pessoas moralmente culpadas ou ímpias em linguagem atual e amplamente compreensível.
- source_word: מָלְאוּ
  choice: ficam cheios
  rationale: Reproduz a imagem hebraica de plenitude. O presente habitual comunica a máxima proverbial, sem transformar a declaração em referência a um único evento passado.
- source_word: רָע
  choice: desgraça
  rationale: Neste paralelismo, o termo aponta naturalmente para o mal experimentado como calamidade ou aflição. “Desgraça” mantém o contraste com a proteção do justo e evita a leitura pouco natural de que os perversos estão literalmente preenchidos de maldade.
theological_decisions:
- issue: Caráter geral ou promessa absoluta de imunidade ao sofrimento
  choice: Manter a formulação proverbial sem qualificações acrescentadas
  alternative: Explicitar que nenhum dano definitivo atingirá o justo, ou dizer que isso ocorre apenas em geral
  rationale: O hebraico apresenta uma afirmação categórica própria da literatura sapiencial. A tradução não deve resolver silenciosamente sua tensão com a experiência do sofrimento dos justos nem acrescentar uma limitação ausente do texto.
- issue: Sentido moral ou calamitoso de אָוֶן e רָע
  choice: Preservar a amplitude de אָוֶן com “mal” e verter רָע como “desgraça” segundo o paralelismo
  alternative: Traduzir ambos exclusivamente como “maldade” ou exclusivamente como “aflição”
  rationale: Os dois substantivos têm campos semânticos amplos. A combinação escolhida preserva a tensão entre mal moral e suas consequências adversas, sem impor uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e acessível, com presente gnômico adequado a uma máxima sapiencial. A estrutura antitética e a concisão do hebraico foram preservadas.
