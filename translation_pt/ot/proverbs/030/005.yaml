  text: כָּל אִמְרַ֣ת אֱל֣וֹהַּ צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לַֽ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/005.yaml
  text: Every word of God is proven; he is a shield to those who take refuge in him.
translation:
  language: pt
  text: Toda palavra de Deus é comprovada; ele é escudo para os que nele se refugiam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִמְרַת אֱלוֹהַּ
  choice: Toda palavra de Deus
  rationale: Mantém o valor distributivo de כָּל e traduz אִמְרָה de modo natural e abrangente, sem restringi-la a uma modalidade específica de revelação.
- source_word: צְרוּפָה
  choice: é comprovada
  rationale: O particípio passivo de צרף evoca metal refinado e provado pelo fogo. “Comprovada” preserva o resultado do teste e acompanha a revisão auditada, embora a imagem metalúrgica fique implícita.
- source_word: מָגֵן
  choice: escudo
  rationale: Correspondência direta que conserva a metáfora de proteção.
- source_word: לַחֹסִים בּוֹ
  choice: para os que nele se refugiam
  rationale: Traduz o particípio חֹסִים como ação contínua de buscar refúgio e preserva em “nele” a referência pronominal a Deus.
theological_decisions:
- issue: Sentido de צְרוּפָה aplicado à palavra divina
  choice: é comprovada
  alternative: é pura / é refinada
  rationale: O hebraico comporta a imagem de refino e a ideia de algo que resistiu à prova. “Comprovada” conserva a afirmação de confiabilidade sem transformar explicitamente a metáfora em uma declaração abstrata de pureza.
- issue: Referência do pronome em הוּא e בּוֹ
  choice: ele / nele, referindo-se a Deus
  alternative: ela / nela, referindo-se à palavra
  rationale: O pronome masculino singular הוּא concorda naturalmente com אֱלוֹהַּ, “Deus”, e מָגֵן é masculino; assim, Deus é apresentado como escudo daqueles que nele se refugiam.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa e paralelismo preservado. O uso de “comprovada” expressa o aspecto de prova/refino sem acrescentar explicação no corpo do versículo.
