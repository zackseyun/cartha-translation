  text: שְׁ֭פַנִּים עַ֣ם לֹא עָצ֑וּם וַ/יָּשִׂ֖ימוּ בַ/סֶּ֣לַע בֵּיתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/026.yaml
  text: Rock badgers are a people not mighty[a], yet they make their home in the crag.
translation:
  language: pt
  text: Os damões[a] são um povo sem poder, mas estabelecem a sua morada na rocha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «híraces»; tradicionalmente, «coelhos-do-mato» em algumas versões.
    reason: alternative identification
lexical_decisions:
- source_word: שְׁפַנִּים
  choice: damões
  rationale: O termo designa provavelmente os hiracoides conhecidos em português como damões; a escolha identifica o animal de modo mais preciso do que designações tradicionais ambíguas.
- source_word: עַם
  choice: um povo
  rationale: Preserva a expressão figurada e classificatória do hebraico, que aplica aos animais o substantivo comum para “povo”.
- source_word: לֹא עָצוּם
  choice: sem força
  rationale: Expressa naturalmente a falta de vigor ou poder indicada pelo adjetivo, mantendo o contraste proverbial com a maneira sábia de buscar abrigo.
- source_word: וַיָּשִׂימוּ
  choice: fazem
  rationale: Embora o verbo signifique literalmente “põem” ou “estabelecem”, com “casa” a formulação idiomática portuguesa é “fazem sua casa”; o presente comunica o caráter geral da máxima.
- source_word: בַסֶּלַע
  choice: nos rochedos
  rationale: סֶלַע indica rocha, penhasco ou formação rochosa. O plural natural em português descreve o habitat sem alterar o sentido coletivo do refúgio pétreo.
- source_word: בֵּיתָם
  choice: sua casa
  rationale: Mantém de perto a imagem hebraica de “casa” e soa natural como referência ao abrigo dos animais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com sintaxe equilibrada entre os dois membros do verso. “Damões” é o nome zoológico corrente em português para os animais provavelmente indicados pelo hebraico; a linguagem conserva a personificação de “um povo”.
