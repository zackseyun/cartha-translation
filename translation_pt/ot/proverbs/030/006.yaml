  text: אַל תּ֥וֹסְףְּ עַל דְּבָרָ֑י/ו פֶּן יוֹכִ֖יחַ בְּ/ךָ֣ וְ/נִכְזָֽבְתָּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/006.yaml
  text: Do not add to his words[a], lest he rebuke you and you be proved a liar.
translation:
  language: pt
  text: Não acrescente nada às palavras dele, para que ele não repreenda você e fique provado que você é mentiroso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תּוֹסְףְּ
  choice: Não acrescente nada
  rationale: A partícula אַל com a forma verbal expressa uma proibição. O verbo יסף no hiphil significa acrescentar; “nada” explicita de modo natural em português o alcance da proibição sem alterar seu sentido.
- source_word: עַל דְּבָרָיו
  choice: às palavras dele
  rationale: Com o verbo “acrescentar”, עַל corresponde idiomaticamente a “a”. דְּבָרָיו é mantido como “palavras dele”, preservando o pronome hebraico e sua ligação contextual com Deus no versículo anterior.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz uma consequência negativa que se deseja evitar. A construção “para que não” é atual, clara e mantém a força de advertência.
- source_word: יוֹכִיחַ בְּךָ
  choice: ele não o repreenda
  rationale: יכח no hiphil pode indicar repreender, censurar ou demonstrar que alguém está errado. “Repreenda” comunica com clareza a ação pessoal e judicial implícita no contexto.
- source_word: וְנִכְזָבְתָּ
  choice: e você seja considerado mentiroso
  rationale: O nifal de כזב expressa ser constatado ou demonstrado como falso. “Seja considerado mentiroso” preserva o resultado passivo e a dimensão moral do termo.
theological_decisions:
- issue: Referente do pronome em “palavras dele”
  choice: Manter o pronome, entendido contextualmente como referência a Deus no versículo 5.
  alternative: Explicitar “às palavras de Deus” ou entender a expressão como referência genérica às palavras de um falante.
  rationale: O contexto imediato aponta para Deus, mas substituir o pronome por um nome resolveria no texto algo que o hebraico deixa contextual. A tradução preserva a forma pronominal e a ligação entre os versículos.
- issue: Natureza da consequência final
  choice: Traduzir como constatação de que a pessoa é mentirosa.
  alternative: “seja desmascarado como falso” ou “fique comprovado que você mentiu”.
  rationale: A formulação conserva tanto o valor passivo/resultativo do nifal quanto a acusação moral, sem limitar a frase a uma simples inexatidão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação “ele não o repreenda” evita a ambiguidade regional de “lhe repreenda” e mantém o referente divino sem explicitá-lo. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
