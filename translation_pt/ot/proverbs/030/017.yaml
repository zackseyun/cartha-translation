  text: עַ֤יִן תִּֽלְעַ֣ג לְ/אָב֮ וְ/תָב֪וּז לִֽ/יקֲּהַ֫ת אֵ֥ם יִקְּר֥וּ/הָ עֹרְבֵי נַ֑חַל וְֽ/יֹאכְל֥וּ/הָ בְנֵי נָֽשֶׁר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/017.yaml
  text: The eye that mocks a father and despises obedience to a mother—the ravens of the valley will peck it out[c][b][a], and the young of the eagle will eat it.
translation:
  language: pt
  text: O olho que zomba do pai e despreza a obediência à mãe[a] — os corvos do vale[b] o arrancarão a bicadas, e os filhotes de águia[c] o comerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o mandamento/a instrução da mãe»; o raro termo hebraico provavelmente se refere à obediência ou atenção devida à mãe.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «corvos do vale»; «vale» também pode ser entendido como «uádi» ou «leito de torrente».'
    reason: lexical_alternative
  - marker: c
    text: O hebraico nesher pode designar uma águia ou um abutre; tradicionalmente é traduzido por «águia».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: O olho
  rationale: Mantém o substantivo singular e introduz de modo natural o sujeito proverbial em português.
- source_word: תִּלְעַג
  choice: zomba
  rationale: Expressa com clareza a atitude de escárnio ou desprezo indicada pelo verbo hebraico.
- source_word: לְאָב
  choice: do pai
  rationale: A construção é genérica em português e não acrescenta um possessivo ausente no hebraico.
- source_word: וְתָבוּז
  choice: e despreza
  rationale: Preserva o sentido forte de tratar com desdém ou considerar sem valor.
- source_word: לִיקֲּהַת אֵם
  choice: a obediência à mãe
  rationale: יקהת é raro e discutido; no contexto, provavelmente indica a obediência ou atenção devida à mãe. A nota conserva as principais alternativas lexicais.
- source_word: יִקְּרוּהָ
  choice: o arrancarão a bicadas
  rationale: Comunica de forma vívida e idiomática a ação de aves que picam e extraem o olho.
- source_word: עֹרְבֵי נַחַל
  choice: os corvos do vale
  rationale: נחל pode designar vale, uádi ou leito de torrente. «Vale» é claro e acessível, enquanto a nota registra a amplitude geográfica do termo.
- source_word: וְיֹאכְלוּהָ
  choice: o comerão
  rationale: Reproduz sem intensificação desnecessária o verbo comum hebraico para «comer».
- source_word: בְנֵי נָשֶׁר
  choice: os filhotes de águia
  rationale: Traduz naturalmente a expressão literal «filhos de nesher»; «águia» segue a tradição, e a possível referência a abutre é indicada em nota.
theological_decisions: []
