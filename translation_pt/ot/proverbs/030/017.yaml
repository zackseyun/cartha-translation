  register: Português moderno, digno e de leitura ampla, com imagem concreta e contundente. O travessão preserva a passagem enfática da conduta condenada para sua consequência. Os artigos com «pai» e «mãe» têm valor genérico e não introduzem possessivos ausentes no hebraico.
