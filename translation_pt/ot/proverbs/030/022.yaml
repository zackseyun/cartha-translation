  text: תַּֽחַת עֶ֭בֶד כִּ֣י יִמְל֑וֹךְ וְ֝/נָבָ֗ל כִּ֣י יִֽשְׂבַּֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/022.yaml
  text: under a slave when he becomes king[a], and a fool when he is filled with bread[b],
translation:
  language: pt
  text: 'sob um escravo quando se torna rei[a],

    e um tolo quando se farta de pão[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando reina”.
    reason: lexical_alternative
  - marker: b
    text: “Pão” também pode representar, de forma mais ampla, “alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sob
  rationale: No contexto da lista de Provérbios 30:21–23, a preposição introduz as condições sob as quais a terra treme. “Sob” preserva de modo conciso a imagem e a estrutura repetida do hebraico.
- source_word: עֶבֶד
  choice: escravo
  rationale: O termo designa um servo em condição de sujeição. Como a inversão social é central ao provérbio, “escravo” comunica essa condição com mais precisão do que “servo”.
- source_word: כִּי
  choice: quando
  rationale: Aqui a conjunção introduz a circunstância em que ocorre cada situação perturbadora; “quando” é a forma mais natural em português.
- source_word: יִמְלֹךְ
  choice: se torna rei
  rationale: O verbo pode significar reinar ou tornar-se rei. Esta escolha torna explícita a ascensão inesperada à realeza, sem excluir em nota a leitura mais durativa, “reina”.
- source_word: נָבָל
  choice: tolo
  rationale: Na literatura sapiencial, o termo indica alguém insensato também em sentido moral e social. “Tolo” é conciso, corrente e adequado ao uso em Provérbios.
- source_word: יִשְׂבַּע
  choice: se farta
  rationale: O verbo expressa ficar saciado ou ter o bastante. “Se farta” preserva a imagem concreta de saciedade e soa natural em português.
- source_word: לָחֶם
  choice: pão
  rationale: O hebraico diz literalmente “pão”, embora o termo possa representar alimento em geral. Manter “pão” preserva a imagem da fonte.
