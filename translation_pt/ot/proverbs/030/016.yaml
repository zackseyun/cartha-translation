  text: שְׁאוֹל֮ וְ/עֹ֪צֶ֫ר רָ֥חַם אֶ֭רֶץ לֹא שָׂ֣בְעָה מַּ֑יִם וְ֝/אֵ֗שׁ לֹא אָ֥מְרָה הֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/016.yaml
  text: Sheol[a], and a barren womb; earth, never satisfied with water; and fire, which never says[c][b], “Enough.”
translation:
  language: pt
  text: 'O Sheol[a], o ventre fechado[b], a terra, que não se farta de água, e o fogo, que nunca diz: “Basta!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “o domínio dos mortos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o fechamento do ventre”, isto é, um ventre que não gera filhos.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica no fim do versículo é difícil. Muitos a entendem como “Basta!”. Outros propõem um sentido relacionado a “riqueza” ou “bens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o conceito hebraico do domínio dos mortos, mais amplo e específico do que uma simples sepultura; a nota oferece equivalentes naturais.
- source_word: עֹצֶר רָחַם
  choice: o ventre fechado
  rationale: Preserva de modo relativamente formal a imagem hebraica de fechamento ou impedimento do ventre, cujo sentido contextual é a esterilidade.
- source_word: אֶרֶץ
  choice: a terra
  rationale: Neste catálogo de realidades insaciáveis, a referência é elementar e geral, não a um território específico.
- source_word: לֹא שָׂבְעָה מַּיִם
  choice: que não se farta de água
  rationale: Traduz o verbo de saciedade com uma expressão portuguesa natural e preserva a personificação poética.
- source_word: אֵשׁ
  choice: o fogo
  rationale: Correspondência direta e natural.
- source_word: לֹא אָמְרָה הוֹן
  choice: 'que nunca diz: “Basta!”'
  rationale: A leitura 'Basta!' ajusta-se ao paralelismo sobre coisas insaciáveis, enquanto a dificuldade lexical da palavra final é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com cadência proverbial. A forma em lista continua o contexto anterior; 'não se farta' conserva a imagem de insaciabilidade, e as notas registram as ambiguidades lexicais genuínas.
