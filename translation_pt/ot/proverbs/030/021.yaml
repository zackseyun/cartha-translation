base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/021.yaml
  text: 'Under three things the earth trembles[a], and under four it cannot bear up:'
translation:
  language: pt
  text: Por causa de três coisas a terra treme, e por causa de quatro não consegue suportar:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não consegue aguentar” ou “não consegue carregar”. O verbo hebraico pode expressar carregar um peso ou suportar uma situação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: por causa de
  rationale: Neste dito numérico, a preposição introduz as situações que provocam a reação da terra. “Por causa de” comunica naturalmente essa relação em português, sem sugerir posição física.
- source_word: שָׁלוֹשׁ / אַרְבַּע
  choice: três coisas / quatro
  rationale: O hebraico traz apenas os números. Acrescentar “coisas” na primeira ocorrência torna a fórmula clara em português, enquanto a elipse na segunda preserva o paralelismo conciso.
- source_word: רָגְזָה
  choice: treme
  rationale: O verbo רָגַז pode indicar tremor ou agitação. “Treme” preserva a personificação vívida da terra sem exigir a ideia de um terremoto literal.
- source_word: אֶרֶץ
  choice: a terra
  rationale: Embora אֶרֶץ também possa significar “terra” no sentido de território, o contexto proverbial favorece a personificação ampla da terra.
- source_word: לֹא תוּכַל שְׂאֵת
  choice: não consegue suportar
  rationale: A construção expressa incapacidade, e o infinitivo de נָשָׂא pode significar carregar, aguentar ou suportar. A formulação portuguesa mantém tanto a ideia de peso quanto a de resistência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “por causa de” reproduz o paralelismo hebraico de maneira mais natural que o calque espacial “debaixo de”. O marcador [a] está ligado à expressão ambígua “suportar”.
