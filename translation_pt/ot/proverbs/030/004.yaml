id: PRO.30.4
reference: Proverbs 30:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֤י עָלָֽה שָׁמַ֨יִם וַ/יֵּרַ֡ד מִ֤י אָֽסַף ר֨וּחַ בְּ/חָפְנָ֡י/ו מִ֤י צָֽרַר מַ֨יִם בַּ/שִּׂמְלָ֗ה מִ֭י הֵקִ֣ים כָּל אַפְסֵי אָ֑רֶץ מַה שְּׁמ֥/וֹ וּ/מַֽה שֶּׁם בְּ֝נ֗/וֹ כִּ֣י תֵדָֽע־׀־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/004.yaml
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has established all the ends of the earth? What is his name[a], and what is his son's name[c][b], surely you know!
translation:
  language: pt
  text: 'Quem subiu ao céu[a] e desceu?

    Quem recolheu o vento nas mãos?

    Quem envolveu as águas numa veste?

    Quem estabeleceu todos os confins da terra?

    Qual é o seu nome, e qual é o nome de seu filho[c]? Com certeza você sabe![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos céus”. A palavra hebraica שָׁמַיִם tem forma plural.
    reason: lexical_alternative
  - marker: b
    text: Ou “se é que você sabe”. Neste contexto, o hebraico também pode ser entendido como um desafio irônico.
    reason: lexical_alternative
  - marker: c
    text: A interpretação cristã muitas vezes reconheceu significado na expressão “seu filho”, mas o próprio texto hebraico não identifica explicitamente esse filho.
    reason: cross_reference
lexical_decisions:
- source_word: עָלָה ... וַיֵּרַד
  choice: subiu ... e desceu
  rationale: Reproduz diretamente o movimento vertical e a sequência verbal concluída, com formulação natural em português.
- source_word: שָׁמַיִם
  choice: céu
  rationale: Embora a forma hebraica seja plural, “céu” é a expressão idiomática mais natural em português para o domínio celeste neste contexto; “céus” continua sendo uma alternativa legítima.
- source_word: אָסַף רוּחַ
  choice: recolheu o vento
  rationale: No conjunto de imagens cósmicas — vento, águas e terra — רוּחַ designa mais naturalmente o vento. “Recolheu” comunica a ação de ajuntar ou reunir.
- source_word: בְּחָפְנָיו
  choice: nas mãos
  rationale: O termo evoca as mãos côncavas usadas para conter algo. “Nas mãos” conserva a imagem de modo claro, sem sugerir punhos cerrados, o que seria menos preciso neste contexto.
- source_word: צָרַר מַיִם בַּשִּׂמְלָה
  choice: envolveu as águas numa veste
  rationale: “Envolveu” expressa a ideia de atar ou embrulhar, e “veste” representa a peça exterior de roupa sem tornar a metáfora excessivamente específica.
- source_word: הֵקִים כָּל אַפְסֵי אָרֶץ
  choice: estabeleceu todos os confins da terra
  rationale: “Estabeleceu” comunica a ação de firmar ou colocar no lugar; “confins da terra” é uma expressão portuguesa corrente para seus extremos ou regiões mais distantes.
- source_word: מַה שְּׁמוֹ
  choice: Qual é o seu nome
  rationale: Tradução direta e natural da pergunta hebraica, preservando a referência não explicitada.
- source_word: וּמַה שֶּׁם בְּנוֹ
  choice: e qual é o nome de seu filho
  rationale: Mantém explicitamente “filho”, conforme o hebraico, sem acrescentar uma identificação ausente no texto.
- source_word: כִּי תֵדָע
  choice: Com certeza você sabe!
  rationale: Expressa a força de desafio irônico que a cláusula pode assumir no contexto. A leitura condicional, “se é que você sabe”, permanece registrada em nota.
theological_decisions:
- issue: Identidade de “seu filho”
  choice: Manter a expressão sem identificar explicitamente o filho.
  alternative: Entender a frase como referência retórica a um ser humano impossível de nomear, ou como uma sugestão posteriormente lida de modo cristológico.
  rationale: O hebraico menciona o filho, mas não o identifica. A tradução preserva essa abertura e a tensão interpretativa, sem inserir no texto uma conclusão teológica que ele não declara expressamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As perguntas paralelas e as imagens cósmicas foram preservadas; a conclusão usa uma formulação enfática que admite leitura irônica, enquanto a alternativa condicional aparece em nota.
