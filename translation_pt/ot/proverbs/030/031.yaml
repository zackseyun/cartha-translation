lexical_decisions:
- source_word: זַרְזִיר מָתְנַיִם
  choice: o galo que desfila garboso
  rationale: A expressão é rara e incerta. מָתְנַיִם significa literalmente “lombos”, mas, ligada a זַרְזִיר, parece descrever um animal de corpo firme e andar imponente. “Galo” é uma interpretação moderna plausível, e “desfila garboso” comunica de modo natural o porte majestoso exigido pelo contexto.
- source_word: אוֹ תָיִשׁ
  choice: o bode
  rationale: תָיִשׁ designa especificamente o macho da cabra. Embora אוֹ normalmente signifique “ou”, aqui os elementos compõem a enumeração de três figuras de andar majestoso iniciada no versículo anterior; por isso, a relação de lista é expressa naturalmente pela pontuação e pela coordenação portuguesa.
- source_word: מֶלֶךְ
  choice: o rei
  rationale: Equivalente direto do substantivo hebraico comum para um governante.
- source_word: אַלְקוּם עִמּוֹ
  choice: contra quem ninguém se levanta
  rationale: A expressão hebraica é extremamente difícil. Esta leitura entende אַל como negação e קוּם como “levantar-se”, produzindo uma descrição coerente de um rei cuja marcha não encontra resistência. A alternativa que relaciona a expressão a forças que acompanham o rei permanece na nota.
theological_decisions:
- issue: Sentido da cláusula אַלְקוּם עִמּוֹ
  choice: contra quem ninguém se levanta
  alternative: cujo exército está com ele
  rationale: Nenhuma questão doutrinária deve ser decidida por uma expressão textual tão obscura. O texto principal adota uma análise gramatical antiga e plausível, enquanto a nota conserva a outra interpretação contextual importante sem identificar עִמּוֹ explicitamente com Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Desfila garboso” preserva a imagem de movimento imponente sem reproduzir literalmente a expressão opaca “de lombos”. Os artigos definidos mantêm a forma proverbial de apresentar figuras representativas. As duas incertezas reais do hebraico são sinalizadas no próprio texto e explicadas em notas.
