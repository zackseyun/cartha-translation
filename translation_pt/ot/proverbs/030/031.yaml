  text: o galo que desfila garboso[a], o bode e o rei contra quem ninguém se levanta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “galo” é raro e incerto. Outras interpretações possíveis são “galgo”, “cavalo de guerra” ou, de modo mais geral, “animal bem cingido pelos lombos”.
