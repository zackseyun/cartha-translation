  text: אַל תַּלְשֵׁ֣ן עֶ֭בֶד אֶל אדנ/ו פֶּֽן יְקַלֶּלְ/ךָ֥ וְ/אָשָֽׁמְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/010.yaml
  text: Do not slander a slave to his master[a], lest he curse you and you become guilty.
translation:
  language: pt
  text: Não calunie um escravo perante o seu senhor[a], para que ele não amaldiçoe você e você se torne culpado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O hebraico עֶבֶד pode designar tanto um escravo quanto um servo subordinado; “escravo” destaca aqui sua condição social de sujeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּלְשֵׁן
  choice: calunie
  rationale: O verbo ligado a לָשׁוֹן, “língua”, descreve usar a língua contra alguém, aqui como calúnia ou acusação maliciosa. “Calunie” expressa com clareza a proibição moral, sem o sentido potencialmente neutro de “denuncie”.
- source_word: עֶבֶד
  choice: escravo
  rationale: O substantivo pode significar “escravo” ou “servo”. Neste contexto, “escravo” torna transparente a condição de sujeição e a vulnerabilidade social da pessoa; a alternativa é registrada em nota.
- source_word: אֶל אדניו
  choice: diante de seu senhor
  rationale: A expressão indica que a fala contra o escravo é dirigida ao senhor dele. “Diante de” comunica naturalmente esse ato de acusá-lo perante sua autoridade; “senhor” preserva a relação social do hebraico sem sugerir aqui um referente divino.
- source_word: פֶּן
  choice: para que ... não
  rationale: פֶּן introduz uma consequência indesejada. A construção portuguesa “para que não” mantém a advertência proverbial de modo natural e atual.
- source_word: יְקַלֶּלְךָ
  choice: amaldiçoe você
  rationale: O piel de קלל significa aqui amaldiçoar, e não apenas insultar. A escolha conserva a gravidade da fala que invoca ou deseja o mal.
- source_word: וְאָשָׁמְתָּ
  choice: e você se torne culpado
  rationale: A forma de אשם indica incorrer em culpa ou ficar sujeito a ela. “Torne culpado” preserva o caráter consequencial sem definir além do texto como essa culpa se efetiva.
theological_decisions:
- issue: Relação entre a maldição do escravo e a culpa do caluniador
  choice: Manter a sequência “amaldiçoe você, e você se torne culpado” sem explicitar um agente julgador nem um mecanismo causal.
  alternative: “e a maldição recaia sobre você” ou “e Deus o considere culpado”
  rationale: O hebraico afirma a maldição e a culpa, mas não identifica expressamente quem aplica a sanção nem explica como uma leva à outra. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial concisa. Emprega-se “você” para a segunda pessoa singular por sua ampla inteligibilidade brasileira. “Senhor” está em minúscula porque designa o senhor humano do escravo.
