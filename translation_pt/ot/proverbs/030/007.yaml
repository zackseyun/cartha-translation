base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/007.yaml
  text: 'Two things I have asked of you[a]; do not withhold them from me before I die:'
translation:
  language: pt
  text: 'Duas coisas te pedi[a]; não me negues antes que eu morra:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Duas te pedi”. A palavra “coisas” está implícita no contexto e foi acrescentada em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתַּיִם
  choice: Duas coisas
  rationale: O numeral feminino aparece de forma elíptica; “coisas” é naturalmente suprido em português e o versículo seguinte identifica os dois pedidos.
- source_word: שָׁאַלְתִּי
  choice: te pedi
  rationale: O perfeito qal expressa o pedido já formulado. O pretérito perfeito é natural em português e mantém o pedido em vigor no contexto.
- source_word: מֵאִתָּךְ
  choice: te
  rationale: O pronome átono marca de modo idiomático a pessoa a quem se dirige o pedido e incorpora a relação expressa pela preposição hebraica.
- source_word: אַל תִּמְנַע
  choice: não as negues
  rationale: A partícula negativa com o imperfeito volitivo forma uma súplica direta. “Negar algo a alguém” traduz naturalmente a ideia de não conceder o que foi pedido.
- source_word: מִמֶּנִּי
  choice: a mim
  rationale: Com “negar”, o português pede a construção “negar algo a alguém”; “a mim” preserva a ênfase explícita do hebraico.
- source_word: בְּטֶרֶם אָמוּת
  choice: antes que eu morra
  rationale: Reproduz com clareza a relação temporal e o verbo qal na primeira pessoa.
