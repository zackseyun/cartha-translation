base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/028.yaml
  text: A lizard you can catch with your hands[a], yet it is in kings’ palaces.
translation:
  language: pt
  text: A lagartixa, você pode pegá-la com as mãos[a], mas ela está nos palácios dos reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aranha”. O termo hebraico שְׂמָמִית é raro e de sentido incerto; muitas traduções tradicionais trazem “aranha”, enquanto outras entendem uma espécie de lagarto ou lagartixa.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמָמִית
  choice: lagartixa
  rationale: O termo hebraico é raro e de identificação incerta. Uma pequena lagartixa, capaz de entrar e viver em edifícios, corresponde bem ao contraste com sua presença em palácios; a alternativa tradicional “aranha” é preservada em nota.
- source_word: בְּיָדַיִם
  choice: com as mãos
  rationale: A preposição indica meio ou instrumento; esta é a formulação natural e concreta em português.
- source_word: תְּתַפֵּשׂ
  choice: você pode pegá-la
  rationale: A forma verbal está na segunda pessoa masculina singular e descreve a ação de agarrar ou capturar. O pronome retomado evita ambiguidade em português, e “pode” comunica naturalmente a facilidade implícita sem transformar a frase em passiva.
- source_word: וְהִיא
  choice: mas ela vive
  rationale: A conjunção introduz o contraste entre a vulnerabilidade aparente do animal e sua presença em residências reais. “Vive” expressa de modo natural a ideia contextual de estar habitualmente nesses lugares.
- source_word: בְּהֵיכְלֵי מֶלֶךְ
  choice: nos palácios dos reis
  rationale: A construção hebraica é literalmente “nos palácios de rei”. O plural genérico “dos reis” mantém o caráter proverbial e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A topicalização inicial conserva o destaque dado ao pequeno animal no hebraico.
