  source_fidelity: O texto traduz adequadamente a construção de תַּחַת, dependente do enunciado anterior sobre a terra que treme, e conserva o valor circunstancial de כִּי como “quando”. “Mulher odiada” reflete sem atenuação שְׂנוּאָה; “se casa” expressa bem o nifal eventivo de תִּבָּעֵל. “Escrava” representa precisamente שִׁפְחָה. A formulação contextual “toma o lugar de sua senhora” comunica de modo claro o provável efeito social de תִירַשׁ, enquanto a nota preserva a alternativa lexical mais literal, “herda sua senhora”.
  naturalness: O português é moderno, claro e de registro proverbial digno. A repetição de “sob” sustenta o paralelismo e torna explícita, em cada membro, a dependência da construção iniciada no versículo anterior; não prejudica a concisão.
  terminology: “Escrava” e “senhora” mantêm adequadamente a assimetria social do texto sem eufemismos. “Mulher odiada” conserva a força do hebraico. A nota explica a amplitude semântica de ירש sem impor como única leitura a interpretação contextual adotada no texto principal.
