  yaml_path: translation/ot/proverbs/030/023.yaml
  text: under a hated woman when she is married[a], and a female slave when she inherits from her mistress.
translation:
  language: pt
  text: 'sob uma mulher odiada quando se casa,

    e sob uma escrava quando toma o lugar de sua senhora.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando herda sua senhora”. O verbo hebraico geralmente significa “herdar”, “possuir” ou “tomar posse de”; aqui, provavelmente se refere a assumir o lugar ou a posição da senhora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sob
  rationale: 'Mantém a construção do contexto: estas são circunstâncias sob as quais a terra estremece (vv. 21–23), sem transformar a expressão numa paráfrase causal.'
- source_word: שְׂנוּאָה
  choice: mulher odiada
  rationale: Reproduz diretamente a força do particípio passivo, que descreve uma mulher odiada ou rejeitada; “não amada” atenuaria o hebraico.
- source_word: כִּי
  choice: quando
  rationale: Introduz, nos dois membros, a circunstância em que ocorre a mudança de condição.
- source_word: תִבָּעֵל
  choice: se casa
  rationale: O nifal de בעל indica tornar-se casada. “Se casa” expressa naturalmente em português o acontecimento e a mudança de condição, sem sugerir apenas um estado já existente.
- source_word: שִׁפְחָה
  choice: escrava
  rationale: Indica com clareza a condição servil e feminina, de modo mais preciso que “serva” neste contraste social.
- source_word: תִירַשׁ
  choice: toma o lugar de
  rationale: ירש costuma significar “herdar”, “possuir” ou “tomar posse”; neste contexto, com a senhora como objeto direto, a formulação comunica a provável ideia de a escrava assumir a posição dela, preservando em nota a tradução lexical mais direta.
- source_word: גְּבִרְתָּהּ
  choice: sua senhora
  rationale: Designa a mulher de posição superior na casa, especificamente a senhora da escrava; “sua senhora” é claro e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo entre os dois membros. “Mulher odiada” conserva a intensidade do hebraico, e “escrava” explicita a condição social. A ambiguidade de תִירַשׁ é preservada por meio da nota.
