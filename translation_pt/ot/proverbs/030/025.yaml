  yaml_path: translation/ot/proverbs/030/025.yaml
  text: The ants are a people not strong[a], yet they prepare their food in the summer.
translation:
  language: pt
  text: As formigas são um povo que não é forte; contudo, preparam seu alimento[a] no verão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu pão”; aqui, “pão” tem o sentido mais amplo de “alimento” ou “provisões”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּמָלִים
  choice: as formigas
  rationale: O substantivo plural definido refere-se às formigas como classe; o artigo definido é natural em português.
- source_word: עַם
  choice: um povo
  rationale: Mantém a personificação e a metáfora coletiva do hebraico, em vez de reduzi-las a “criaturas”.
- source_word: לֹא עָז
  choice: que não é forte
  rationale: Conserva a negação explícita do adjetivo “forte”, sem intensificá-la para “fraco” ou “indefeso”.
- source_word: וַיָּכִינוּ
  choice: contudo, preparam
  rationale: O hifil de כון expressa tornar pronto ou preparar; “preparam” evita acrescentar a ideia mais específica de armazenar. “Contudo” comunica o contraste contextual introduzido pela conjunção.
- source_word: בַקַּיִץ
  choice: no verão
  rationale: Reproduz de modo idiomático a indicação temporal da preposição com artigo.
- source_word: לַחְמָם
  choice: seu alimento
  rationale: Embora לֶחֶם possa significar literalmente “pão”, também designa alimento em sentido amplo; este é o sentido natural no contexto das formigas.
