id: PRO.30.3
reference: Proverbs 30:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹֽא לָמַ֥דְתִּי חָכְמָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים אֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/003.yaml
  text: And I have not learned wisdom[a], nor do I know the knowledge of the Holy One.
translation:
  language: pt
  text: Não aprendi a sabedoria, nem conheço o saber do Santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nem conheço o saber dos santos». A forma hebraica traduzida por «Santo» é plural, mas, em Provérbios, pode referir-se a Deus como «o Santo».'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמַדְתִּי
  choice: aprendi
  rationale: O perfeito na primeira pessoa expressa a sabedoria que o falante não adquiriu. Em português, o pretérito perfeito é natural e, neste contexto confessional, mantém a consequência presente.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente corrente em Provérbios para a sabedoria prática, moral e religiosa.
- source_word: דַעַת
  choice: conhecimento
  rationale: Preserva o sentido comum do substantivo e sua ligação lexical com o verbo ידע na mesma oração.
- source_word: קְדֹשִׁים
  choice: o Santo
  rationale: Embora a forma hebraica seja plural, em Provérbios ela pode designar Deus, como provavelmente também em 9:10. A ambiguidade morfológica é preservada em nota.
- source_word: אֵדָע
  choice: tenho
  rationale: Na expressão portuguesa natural «ter conhecimento», comunica o valor presente do imperfeito hebraico sem a construção pouco idiomática «conheço o conhecimento».
theological_decisions:
- issue: Se קְדֹשִׁים designa Deus no singular ou seres/pessoas santos no plural
  choice: 'Referência singular a Deus: «o Santo»'
  alternative: «os santos»
  rationale: O paralelo de Provérbios 9:10 favorece a referência divina, mas a forma hebraica é genuinamente plural; por isso, a leitura alternativa é indicada em nota, sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Não aprendi a sabedoria» conserva a formulação enfática do hebraico; «tenho o conhecimento» evita repetição verbal artificial e mantém o paralelismo semântico.
