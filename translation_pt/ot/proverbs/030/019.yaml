id: PRO.30.19
reference: Proverbs 30:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
translation:
  language: pt
  text: 'o caminho da águia no céu[a],

    o caminho da serpente sobre a rocha,

    o caminho do navio no coração do mar[b]

    e o caminho do homem com uma jovem[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode designar, de modo mais amplo, uma grande ave de rapina.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é literalmente “no coração do mar”, isto é, no meio do mar.
    reason: cultural_note
  - marker: c
    text: Ou “com uma virgem”. O termo hebraico עַלְמָה significa mais amplamente “mulher jovem” e, por si só, não exige o sentido mais específico de “virgem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: O substantivo estrutura as quatro linhas e pode abranger trajetória, modo e curso, preservando a amplitude do hebraico.
- source_word: הַנֶּשֶׁר
  choice: águia
  rationale: É a tradução tradicional e natural em português; o termo hebraico também pode designar mais amplamente uma grande ave de rapina, possibilidade registrada em nota.
- source_word: בַּשָּׁמַיִם
  choice: no céu
  rationale: Neste contexto, refere-se ao espaço visível em que a ave voa; “céu” é concreto e corrente.
- source_word: נָחָשׁ
  choice: serpente
  rationale: É uma forma digna e amplamente compreensível, adequada ao paralelismo poético sem acrescentar uma interpretação simbólica.
- source_word: עֲלֵי צוּר
  choice: sobre a rocha
  rationale: Representa de maneira direta o deslocamento da serpente pela superfície rochosa.
- source_word: אֳנִיָּה
  choice: navio
  rationale: Indica naturalmente uma embarcação que atravessa o mar.
- source_word: בְלֶב יָם
  choice: no coração do mar
  rationale: Preserva a imagem vívida do hebraico; em português, a expressão é inteligível como referência ao meio ou à imensidão do mar.
- source_word: גֶּבֶר
  choice: homem
  rationale: O termo hebraico designa especificamente um adulto do sexo masculino.
- source_word: בְּעַלְמָה
  choice: com uma jovem
  rationale: עַלְמָה designa uma mulher jovem, normalmente em idade de casar, sem afirmar por si só que seja virgem; a preposição é vertida relacionalmente por “com”.
theological_decisions:
- issue: Sentido da frase final וְדֶרֶךְ גֶּבֶר בְּעַלְמָה
  choice: o caminho do homem com uma jovem
  alternative: o caminho do homem numa jovem; o caminho do homem com uma virgem
  rationale: A formulação mantém a ambiguidade sugestiva do hebraico quanto à atração, ao relacionamento ou à intimidade, sem explicitar um sentido sexual nem restringir עַלְמָה a “virgem”.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. A repetição de “o caminho” reproduz a estrutura hebraica, e “no coração do mar” conserva sua metáfora sem comprometer a compreensão.
