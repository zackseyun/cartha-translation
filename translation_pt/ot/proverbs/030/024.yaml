  yaml_path: translation/ot/proverbs/030/024.yaml
  text: 'Four are small on the earth[a], yet they are exceedingly wise:'
translation:
  language: pt
  text: 'Quatro são pequenos na terra, mas são extremamente sábios[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sábios, feitos sábios” — expressão enfática que significa “muito” ou “extremamente sábios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  choice: Quatro
  rationale: O numeral cardinal abre a máxima numérica com a concisão do hebraico.
- source_word: קְטַנֵּי אָרֶץ
  choice: pequenos na terra
  rationale: Preserva o sentido adjetival de “pequenos” e a referência ampla à terra, sem acrescentar “animais” ou “criaturas”, termos implícitos no contexto, mas ausentes neste versículo.
- source_word: וְהֵמָּה
  choice: mas são
  rationale: A conjunção e o pronome independente estabelecem um contraste enfático entre o pequeno tamanho e a grande sabedoria; em português, “mas” expressa isso com naturalidade.
- source_word: חֲכָמִים מְחֻכָּמִים
  choice: extremamente sábios
  rationale: A combinação enfática, literalmente próxima de “sábios, tornados sábios”, intensifica a qualidade; “extremamente sábios” comunica essa força em português corrente e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concisão proverbial. O marcador foi colocado após “sábios”, a expressão à qual a nota se refere.
