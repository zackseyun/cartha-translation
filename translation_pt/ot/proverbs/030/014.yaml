  yaml_path: translation/ot/proverbs/030/014.yaml
  text: a generation whose teeth are swords[a], and whose fangs are knives[b], to devour the poor from the earth and the needy from among mankind.
translation:
  language: pt
  text: Uma geração cujos dentes são espadas e cujas presas são facas, para devorar os pobres da terra[a] e os necessitados dentre os seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do país» ou «da terra» em sentido territorial.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «do ser humano»; אָדָם é usado aqui em sentido genérico, referindo-se à humanidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: uma geração
  rationale: Mantém a identificação breve e enfática de um grupo humano, em continuidade com a série poética dos versículos anteriores, sem acrescentar um verbo inexistente no hebraico.
- source_word: חֲרָבוֹת
  choice: espadas
  rationale: É o sentido comum do plural de חֶרֶב e preserva a imagem concreta de violência.
- source_word: שִׁנָּיו
  choice: cujos dentes
  rationale: O sufixo masculino singular retoma coletivamente דּוֹר; a construção com «cujos» é natural em português.
- source_word: מַאֲכָלוֹת
  choice: facas
  rationale: No paralelismo com «espadas» e na imagem de dentes que devoram, o termo designa instrumentos cortantes; «facas» é claro e não especifica indevidamente um tipo particular de lâmina.
- source_word: מְתַלְּעֹתָיו
  choice: cujas presas
  rationale: O termo se refere aos dentes da mandíbula; «presas» comunica de modo natural a imagem predatória, sem a expressão técnica e menos fluente «dentes molares».
- source_word: לֶאֱכֹל
  choice: para devorar
  rationale: Embora o verbo signifique literalmente «comer», aqui descreve metaforicamente a destruição dos vulneráveis; «devorar» conserva a força predatória.
- source_word: עֲנִיִּים
  choice: os pobres
  rationale: Expressa com clareza a vulnerabilidade socioeconômica indicada pelo termo, sem excluir sua dimensão de aflição.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: Preserva a amplitude de אֶרֶץ e sua ambiguidade possível entre «terra» em sentido amplo e «país/território».
- source_word: אֶבְיוֹנִים
  choice: os necessitados
  rationale: Distingue o termo de עֲנִיִּים e mantém a variação semântica do paralelismo hebraico.
- source_word: מֵאָדָם
  choice: dentre os seres humanos
  rationale: אָדָם tem aqui referência humana genérica, não masculina individual; a formulação é inclusiva, clara e preserva a ideia de retirada do meio da humanidade.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: seres humanos
  alternative: homem; humanidade
  rationale: O substantivo se refere genericamente ao conjunto humano. «Seres humanos» evita uma leitura restrita ao sexo masculino e se encaixa naturalmente após a preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase nominal «Uma geração...» conserva a concisão e a estrutura poética hebraica. As imagens violentas e predatórias permanecem concretas, e a ambiguidade de אֶרֶץ é registrada em nota.
