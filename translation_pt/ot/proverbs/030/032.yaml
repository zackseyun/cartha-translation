  text: אִם נָבַ֥לְתָּ בְ/הִתְנַשֵּׂ֑א וְ/אִם זַ֝מּ֗וֹתָ יָ֣ד לְ/פֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/032.yaml
  text: If you have acted foolishly by exalting yourself[a], or if you have plotted[b], put your hand over your mouth.
translation:
  language: pt
  text: Se você agiu como tolo ao se exaltar, ou se tramou, ponha a mão sobre a boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mão à boca”; expressão que indica calar-se ou refrear a fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבַלְתָּ
  choice: agiu como tolo
  rationale: O verbo pode indicar comportamento insensato ou desonroso. A formulação comunica uma ação moralmente imprudente, não mera falta de inteligência.
- source_word: בְהִתְנַשֵּׂא
  choice: ao se exaltar
  rationale: O infinitivo reflexivo expressa elevar a si mesmo, isto é, agir com presunção ou autopromoção; a construção também preserva a possível relação circunstancial ou causal com a insensatez.
- source_word: זַמּוֹתָ
  choice: tramou alguma coisa
  rationale: O verbo significa conceber, planejar ou tramar e frequentemente tem conotação negativa. Como o objeto não aparece no hebraico, evita-se acrescentar explicitamente “o mal”; “alguma coisa” torna o uso absoluto natural em português sem definir seu conteúdo.
- source_word: יָד לְפֶה
  choice: ponha a mão sobre a boca
  rationale: A expressão concreta funciona como ordem de calar-se ou conter a fala. A tradução conserva a imagem e é clara em português atual.
- source_word: אִם ... וְאִם
  choice: Se ... ou se
  rationale: A estrutura apresenta duas hipóteses relacionadas; “se... ou se” transmite naturalmente essa alternativa em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva o paralelismo condicional, a imagem corporal final e a indefinição do objeto de זַמּוֹתָ, sem inserir “o mal”, que não está expresso no hebraico.
