  text: פֶּ֥ן אֶשְׂבַּ֨ע וְ/כִחַשְׁתִּי֮ וְ/אָמַ֗רְתִּי מִ֥י יְה֫וָ֥ה וּ/פֶֽן אִוָּרֵ֥שׁ וְ/גָנַ֑בְתִּי וְ֝/תָפַ֗שְׂתִּי שֵׁ֣ם אֱלֹהָֽ/י׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/009.yaml
  text: lest I become full and deny you and say[b][a], “Who is Yahweh?” or lest I become poor and steal and profane the name of my God.
translation:
  language: pt
  text: 'para que eu não me farte, te negue e diga: “Quem é Yahweh?”, nem empobreça, venha a roubar e profane o nome do meu Deus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “use indevidamente o nome do meu Deus”. O hebraico diz literalmente “agarre” ou “tome o nome do meu Deus”, expressão cujo sentido exato é discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן ... וּפֶן
  choice: para que eu não ... nem
  rationale: As duas ocorrências introduzem consequências temidas. Esta construção preserva a ligação com a oração do versículo anterior e soa natural em português.
- source_word: אֶשְׂבַּע
  choice: eu me farte
  rationale: Mantém a imagem concreta de ficar saciado por ter abundância, sem reduzi-la a uma noção abstrata de satisfação.
- source_word: וְכִחַשְׁתִּי
  choice: te negue
  rationale: Embora o objeto não esteja expresso no hebraico, o contexto imediato aponta para Deus, a quem o pedido é dirigido. “Negar” comunica repúdio, não apenas falsidade.
- source_word: מִי יְהוָה
  choice: Quem é Yahweh?
  rationale: Preserva a pergunta retórica e verte diretamente o nome divino, expressando a atitude arrogante de quem julga não precisar de Deus.
- source_word: אִוָּרֵשׁ
  choice: empobreça
  rationale: Expressa de modo conciso e corrente a entrada numa condição de pobreza, em paralelo com “me farte”.
- source_word: וְגָנַבְתִּי
  choice: venha a roubar
  rationale: A locução deixa clara a consequência temida da pobreza e evita que a sequência de subjuntivos soe truncada em português.
- source_word: וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: e profane o nome do meu Deus
  rationale: A expressão hebraica é difícil e literalmente envolve “agarrar” ou “tomar” o nome. No contexto, indica desonrar o nome de Deus pela conduta; a nota preserva a forma e a alternativa lexical.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega o tetragrama como nome próprio. “Yahweh” o preserva explicitamente, sem substituí-lo por um título.
- issue: Sentido de וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: profane o nome do meu Deus
  alternative: use indevidamente o nome do meu Deus
  rationale: “Profanar” abrange a desonra trazida ao nome de Deus pelo roubo, sem limitar a expressão a um uso verbal do nome. A nota registra a dificuldade e a imagem literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi mantida, mas a segunda consequência recebeu “venha a” para dar fluência à sequência verbal.
