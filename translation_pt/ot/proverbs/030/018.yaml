  - severity: low
    issue: Ordem pouco idiomática em «quatro eu não compreendo»
    rationale: A antecipação de «eu» não é necessária e torna a frase menos natural. A forma concisa «quatro não compreendo» conserva adequadamente o paralelismo hebraico.
