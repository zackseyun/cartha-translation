- from: 'Três coisas são maravilhosas demais para mim[a]; quatro eu não compreendo:'
  to: 'Três coisas são admiráveis demais para eu compreender; quatro não compreendo:'
  rationale: A revisão torna explícita, sem expandir indevidamente o texto, a dimensão de compreensão ultrapassada presente em «נִפְלְאוּ מִמֶּנִּי». Também ajusta a segunda linha para uma ordem mais natural em português, preservando a fórmula numérica três/quatro e a concisão do hebraico. A nota continua a registrar a alternativa formal baseada em «não conheço».
