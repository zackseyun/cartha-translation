  text: 'Three things are too wonderful for me[a]; four I do not understand:'
translation:
  language: pt
  text: 'Três coisas são admiráveis demais para eu compreender; quatro não compreendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשָׁה
  choice: Três coisas
  rationale: O numeral masculino introduz a fórmula do provérbio numérico. Em português, acrescentar “coisas” torna natural o referente implícito sem alterar o sentido.
- source_word: הֵמָּה
  choice: são
  rationale: O pronome independente tem valor enfático, mas sua força é comunicada naturalmente pela construção “Três coisas são”, sem a forma menos fluida “três são elas”.
- source_word: נִפְלְאוּ
  choice: maravilhosas demais
  rationale: O verbo de פלא descreve algo extraordinário, assombroso ou difícil de compreender. “Maravilhosas demais” preserva tanto o assombro quanto a ideia de ultrapassar a compreensão do falante.
- source_word: מִמֶּנִּי
  choice: para mim
  rationale: Com נִפְלְאוּ, a expressão indica que essas coisas excedem a capacidade de compreensão do falante. “Para mim” produz uma formulação portuguesa clara e próxima do hebraico.
- source_word: וְאַרְבַּע
  choice: quatro
  rationale: A passagem usa o paralelismo numérico x/x+1 característico da literatura sapiencial. O ponto e vírgula e a progressão de três para quatro representam naturalmente a conjunção hebraica.
- source_word: לֹא יְדַעְתִּים
  choice: eu não compreendo
  rationale: Embora a forma seja literalmente “não as conheço”, ידע aqui aponta para apreensão ou entendimento. “Não compreendo” expressa esse sentido no contexto; o objeto é fornecido por “quatro”.
