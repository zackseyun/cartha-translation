  register: Português moderno, claro e digno, com estrutura proverbial paralela. A repetição de “quando se... produz-se” preserva o encadeamento causal; os verbos específicos tornam cada imagem natural em português, enquanto a nota conserva o jogo lexical hebraico que não pode ser reproduzido integralmente.
