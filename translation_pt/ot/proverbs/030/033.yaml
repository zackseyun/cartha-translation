  text: For churning milk produces butter[a], and pressing the nose produces blood[b], and pressing anger produces strife.
translation:
  language: pt
  text: Pois bater o leite produz manteiga[a], apertar o nariz produz sangue[b], e atiçar a ira produz conflito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coalhada”; o termo hebraico pode designar de modo amplo um produto do leite obtido por agitação ou coagulação.
    reason: lexical_alternative
  - marker: b
    text: 'Há um jogo de palavras em hebraico: “nariz” e “ira” são expressos por formas da mesma palavra, אַף, que pode indicar o nariz ou, em sentido idiomático, a ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a advertência anterior e preserva naturalmente a relação causal.
- source_word: מִיץ
  choice: bater / apertar / atiçar
  rationale: O termo indica pressão ou compressão e se repete nas três orações. A tradução varia de modo idiomático conforme cada objeto, mantendo a progressão de ações que provocam resultados.
- source_word: חָלָב
  choice: leite
  rationale: Equivalente direto e natural.
- source_word: יוֹצִיא
  choice: produz-se
  rationale: O hifil de יצא expressa causação ou resultado; a forma impessoal comunica com clareza que cada ação gera sua consequência.
- source_word: חֶמְאָה
  choice: manteiga
  rationale: Designa um produto lácteo obtido por agitação ou coagulação. 'Manteiga' é tradicional e adequado ao contexto, embora 'coalhada' também seja possível.
- source_word: אַף
  choice: nariz
  rationale: Nesta oração, o sentido concreto é exigido pela menção do sangue.
- source_word: דָם
  choice: sangue
  rationale: Equivalente direto.
- source_word: אַפַּיִם
  choice: ira
  rationale: Embora relacionado literalmente às narinas, o termo funciona como expressão idiomática de ira. A nota registra o jogo hebraico com 'nariz'.
- source_word: רִיב
  choice: conflito
  rationale: Expressa disputa, contenda ou briga em linguagem moderna, ampla e proverbial.
