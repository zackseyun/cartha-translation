base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/029.yaml
  text: 'There are three that are stately in stride[a], even four that are stately in walking:'
translation:
  language: pt
  text: 'Há três que têm um passo majestoso,[a]

    e quatro que caminham com imponência:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que têm um belo modo de andar” / “que andam admiravelmente”. A expressão hebraica descreve seres cuja maneira de se mover causa especial impressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: Há três
  rationale: Expressa de modo natural em português a fórmula numérica introdutória do dito sapiencial, sem reproduzir rigidamente o pronome hebraico.
- source_word: מֵיטִיבֵי צָעַד
  choice: têm um passo majestoso
  rationale: O particípio de יטב indica fazer algo bem; ligado a צעד, descreve uma maneira de andar notavelmente bela ou imponente, não bondade moral.
- source_word: וְאַרְבָּעָה
  choice: e quatro
  rationale: Preserva a progressão numérica hebraica de três para quatro; em português, a própria fórmula comunica o efeito culminante sem exigir 'até quatro'.
- source_word: מֵיטִבֵי לָכֶת
  choice: caminham com imponência
  rationale: Mantém o paralelismo sem uma repetição artificial e comunica o porte impressionante associado ao movimento.
