source:
  edition: WLC
  text: שָׁ֤וְא וּֽ/דְבַר כָּזָ֡ב הַרְחֵ֬ק מִמֶּ֗/נִּי רֵ֣אשׁ וָ֭/עֹשֶׁר אַל תִּֽתֶּן לִ֑/י הַ֝טְרִיפֵ֗/נִי לֶ֣חֶם חֻקִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/008.yaml
  text: Keep falsehood and lying words far from me[a]; give me neither poverty nor riches[b]; feed me with the bread allotted to me.
translation:
  language: pt
  text: Afasta de mim a falsidade e as palavras mentirosas[a]; não me dês nem pobreza nem riqueza; alimenta-me com o pão que me cabe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a fala enganosa».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «o pão da minha porção»; também se pode traduzir por «a minha porção de pão» ou «o meu pão diário».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: falsidade
  rationale: Em paralelo com דְבַר כָּזָב, designa aqui aquilo que é falso ou enganoso no âmbito moral e verbal; «falsidade» preserva essa força sem reduzir o termo a mera vaidade.
- source_word: דְבַר כָּזָב
  choice: palavras mentirosas
  rationale: A expressão significa literalmente «palavra de mentira/falsidade». O plural idiomático comunica naturalmente a categoria ampla da fala enganosa.
- source_word: הַרְחֵק מִמֶּנִּי
  choice: Afasta de mim
  rationale: O imperativo causativo de רחק pede que algo seja posto ou mantido longe. «Afasta de mim» é direto, natural e apropriado ao tom de oração.
- source_word: רֵאשׁ
  choice: pobreza
  rationale: O substantivo denota pobreza ou indigência; «pobreza» é claro e estabelece o contraste econômico com «riqueza».
- source_word: עֹשֶׁר
  choice: riqueza
  rationale: Expressa abundância material e forma, em português corrente, o contraste equilibrado com «pobreza».
- source_word: אַל תִּתֶּן לִי
  choice: não me dês nem ... nem ...
  rationale: A proibição governa os dois substantivos coordenados. A construção «não me dês nem... nem...» reproduz com clareza a petição hebraica.
- source_word: הַטְרִיפֵנִי
  choice: alimenta-me
  rationale: No causativo, o verbo tem aqui o sentido de fornecer alimento ou sustento. «Alimenta-me» é conciso e mantém a imagem concreta do pão.
- source_word: לֶחֶם חֻקִּי
  choice: o pão que me cabe
  rationale: A expressão é literalmente «o pão da minha porção». «O pão que me cabe» preserva tanto a imagem do pão como a ideia de uma porção determinada, em linguagem portuguesa natural.
theological_decisions:
- issue: Sentido da petição לֶחֶם חֻקִּי
  choice: pedido pela porção de alimento que cabe ao orante, sem privação nem excesso
  alternative: «meu pão diário»
  rationale: O contexto contrasta pobreza e riqueza e pede uma provisão medida. «O pão que me cabe» conserva o tema sapiencial da porção adequada sem importar automaticamente a formulação litúrgica posterior de «pão diário».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «dês» e os imperativos pronominais por serem naturais no registro bíblico contemporâneo, sem arcaísmo excessivo. A estrutura em três petições acompanha o paralelismo e a progressão do hebraico.
