  text: 'The leech has two daughters: “Give[a], give.” Three things are never satisfied; four never say[c][b], “Enough.”'
translation:
  language: pt
  text: 'A sanguessuga tem duas filhas: “Dá! Dá!”[a] Três coisas nunca se saciam; quatro nunca dizem: “Basta!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mais! Mais!” A expressão pode representar o grito das filhas, pedindo sempre mais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quatro não dizem: ‘Já chega!’” A palavra final é entendida aqui como uma expressão de suficiência, em vez do sentido nominal mais comum, “riqueza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲלוּקָה
  choice: A sanguessuga
  rationale: עֲלוּקָה designa a sanguessuga. O ל inicial introduz o tópico ou a relação de posse; em português natural, a construção completa fica bem expressa por “A sanguessuga tem”.
- source_word: שְׁתֵּי בָנוֹת
  choice: tem duas filhas
  rationale: O hebraico é uma oração nominal, sem verbo expresso. Acrescenta-se “tem” para formar uma frase natural, preservando literalmente a imagem das “filhas”.
- source_word: הַב הַב
  choice: “Dê! Dê!”
  rationale: A repetição reproduz o grito imperativo e insistente por mais. “Dê” preserva melhor a forma verbal e a concisão do hebraico do que o interpretativo “Mais”.
- source_word: שָׁלוֹשׁ הֵנָּה לֹא תִשְׂבַּעְנָה
  choice: Há três coisas que nunca se satisfazem
  rationale: A formulação segue o padrão dos ditos numéricos de Provérbios. “Coisas” é suprido para tornar explícito em português o referente do pronome e do verbo femininos no plural.
- source_word: אַרְבַּע לֹא אָמְרוּ הוֹן
  choice: 'quatro que nunca dizem: “Basta!”'
  rationale: הוֹן é entendido aqui como expressão de suficiência, não no sentido nominal mais comum de “riqueza”. “Basta!” comunica de modo conciso a insaciabilidade das quatro coisas.
