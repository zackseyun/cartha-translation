  - severity: low
    issue: «Nunca se satisfazem» é compreensível, mas menos preciso e menos idiomático que «nunca se saciam» para a imagem de insaciabilidade.
    rationale: O verbo hebraico refere-se primariamente a saciar-se; «saciam» mantém a metáfora concreta sem perder o sentido figurado.
