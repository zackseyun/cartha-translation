  source_fidelity: A imagem da sanguessuga, das duas filhas e do seu clamor insistente é preservada. A expressão final é corretamente entendida como declaração de suficiência, e não como «riqueza». A revisão mantém o paralelismo do dito numérico hebraico de modo mais direto.
  naturalness: «Há três coisas ..., quatro que ...» fica sintaticamente frouxo e obscurece a estrutura escalonada característica do provérbio. «Três coisas ...; quatro ...» é natural, conciso e claro em português moderno. «Se saciam» também é mais idiomático neste contexto de apetite insaciável.
  terminology: «Sanguessuga» é o equivalente lexical adequado. «Dá! Dá!» conserva o clamor imperativo curto do hebraico com uma forma corrente e amplamente compreensível; a nota registra «Mais! Mais!» como alternativa interpretativa.
