  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Proceder” preserva o sentido comportamental de דֶּרֶךְ; os verbos no presente comunicam o caráter proverbial e habitual da cena. Os marcadores foram posicionados junto aos trechos que explicam.
