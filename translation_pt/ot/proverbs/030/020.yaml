id: PRO.30.20
reference: Proverbs 30:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֵּ֤ן דֶּ֥רֶךְ אִשָּׁ֗ה מְנָ֫אָ֥פֶת אָ֭כְלָה וּ/מָ֣חֲתָה פִ֑י/הָ וְ֝/אָמְרָ֗ה לֹֽא פָעַ֥לְתִּי אָֽוֶן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/020.yaml
  text: 'So is the way of an adulterous woman: she eats and wipes her mouth and says[b][a], “I have done no wrong.”'
translation:
  language: pt
  text: 'Assim é o proceder da mulher adúltera: ela come, limpa a boca[a] e diz: “Não fiz nada de errado.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem de comer e limpar a boca retrata a ocultação despreocupada do ato, como se ele não tivesse deixado nenhum vestígio moral.
    reason: cultural_note
  - marker: b
    text: 'Ou, mais literalmente: “Não pratiquei maldade alguma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Introduz a comparação conclusiva com a imagem do versículo anterior, de modo conciso e natural.
- source_word: דֶּרֶךְ
  choice: proceder
  rationale: Aqui o substantivo indica a maneira característica de agir. “Proceder” comunica esse sentido em português atual sem acrescentar uma interpretação moral além do contexto.
- source_word: אִשָּׁה מְנָאָפֶת
  choice: mulher adúltera
  rationale: O particípio feminino descreve uma mulher que pratica adultério; a formulação é clara, digna e direta.
- source_word: אָכְלָה
  choice: ela come
  rationale: Embora a forma hebraica seja perfectiva, a sequência apresenta ações vívidas e características num provérbio; o presente expressa adequadamente esse valor habitual.
- source_word: וּמָחֲתָה פִיהָ
  choice: limpa a boca
  rationale: 'Mantém a imagem concreta do hebraico: depois de comer, ela remove da boca os sinais do ato.'
- source_word: וְאָמְרָה
  choice: e diz
  rationale: O presente acompanha o valor proverbial e habitual das ações anteriores.
- source_word: לֹא פָעַלְתִּי אָוֶן
  choice: Não fiz nada de errado
  rationale: Expressa de maneira natural a negação autodefensiva. אָוֶן pode indicar maldade, iniquidade ou ação errada, sem exigir aqui um termo religioso mais técnico.
theological_decisions: []
