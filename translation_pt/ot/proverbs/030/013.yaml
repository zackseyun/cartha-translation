  text: דּ֭וֹר מָה רָמ֣וּ עֵינָ֑י/ו וְ֝/עַפְעַפָּ֗י/ו יִנָּשֵֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/013.yaml
  text: There is a generation—how lofty are its eyes[a], and its eyelids are raised high.
translation:
  language: pt
  text: Há uma geração — como são altivos os seus olhos[a], e como se erguem as suas pálpebras!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma geração — como são elevados os seus olhos, e como se levantam as suas pálpebras!”'
    reason: Alternativa lexical e sintática que conserva mais diretamente a imagem vertical do hebraico.
lexical_decisions:
- source_word: דּוֹר
  choice: Há uma geração
  rationale: O substantivo pode indicar uma geração ou uma classe de pessoas. A construção existencial reproduz em português a introdução exclamativa desse tipo humano no contexto.
- source_word: מָה
  choice: como
  rationale: Aqui funciona como partícula exclamativa de grau, não como pronome interrogativo.
- source_word: רָמוּ
  choice: são altivos
  rationale: A forma de רום expressa elevação. “Altivos” preserva a imagem de olhos erguidos e sua conotação de orgulho, embora explicite um pouco mais a implicação moral do que “elevados”.
- source_word: עֵינָיו
  choice: os seus olhos
  rationale: O sufixo masculino singular concorda com o coletivo דּוֹר. Em português, “seus” mantém a referência gramatical singular sem soar artificial.
- source_word: וְעַפְעַפָּיו
  choice: e ... as suas pálpebras
  rationale: Mantém o sentido anatômico concreto de עַפְעַף e a vivacidade da imagem poética.
- source_word: יִנָּשֵׂאוּ
  choice: como se erguem
  rationale: O nifal de נשׂא indica que as pálpebras são levantadas ou se mantêm erguidas. A formulação é natural em português e conserva a imagem corporal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “como” torna explícita em português a força exclamativa que abrange os dois membros poéticos. O ponto de exclamação representa essa força sem transformar a afirmação em pergunta.
