id: PRO.30.1
reference: Proverbs 30:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דִּבְרֵ֤י אָג֥וּר בִּן יָקֶ֗ה הַ/מַּ֫שָּׂ֥א נְאֻ֣ם הַ֭/גֶּבֶר לְ/אִֽיתִיאֵ֑ל לְ/אִ֖יתִיאֵ֣ל וְ/אֻכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/001.yaml
  text: 'The words of Agur son of Jakeh[a], the oracle: the declaration of the man to Ithiel[b], to Ithiel and Ucal.'
translation:
  language: pt
  text: 'Palavras de Agur, filho de Jaque[a], o oráculo: a declaração do homem a Itiel[b], a Itiel e Ucal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Palavras de Agur, filho de Jaque, de Massá”, entendendo הַמַּשָּׂא como nome de lugar ou de tribo, e não como “o oráculo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, possivelmente: “Estou cansado, ó Deus; estou cansado, ó Deus, e exausto”, se as palavras finais forem revocalizadas como uma oração verbal, em vez de lidas como os nomes Itiel e Ucal.'
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Palavras de
  rationale: O plural em estado construto introduz uma coleção ou pronunciamento; “Palavras de” é direto e preserva a flexibilidade da fórmula.
- source_word: אָגוּר
  choice: Agur
  rationale: Nome próprio transliterado segundo a forma corrente em português.
- source_word: בִּן יָקֶה
  choice: filho de Jaque
  rationale: בִּן é o marcador genealógico comum; יָקֶה é mantido como nome próprio transliterado.
- source_word: הַמַּשָּׂא
  choice: o oráculo
  rationale: מַשָּׂא pode designar um pronunciamento solene ou profético. O artigo favorece aqui a leitura como substantivo comum, embora “Massá” como nome geográfico ou tribal permaneça possível.
- source_word: נְאֻם הַגֶּבֶר
  choice: declaração do homem
  rationale: נְאֻם introduz um pronunciamento solene; “declaração” conserva esse tom formal. הַגֶּבֶר é traduzido sem acrescentar uma ideia não exigida de força ou valentia.
- source_word: לְאִיתִיאֵל לְאִיתִיאֵל
  choice: a Itiel, a Itiel
  rationale: A preposição לְ é vertida pelo destinatário “a”, e a repetição do texto hebraico é preservada em vez de harmonizada.
- source_word: וְאֻכָל
  choice: e Ucal
  rationale: Segue-se a vocalização massorética como nome próprio. A possível revocalização verbal, que produz sentido bastante diferente, é registrada em nota.
theological_decisions:
- issue: Sentido de הַמַּשָּׂא na inscrição
  choice: 'Ler como substantivo comum: “o oráculo”.'
  alternative: 'Ler como nome próprio, “Massá”, por exemplo: “Agur, filho de Jaque, de Massá”.'
  rationale: A presença do artigo favorece a leitura como substantivo comum, e “oráculo” se ajusta a uma inscrição de pronunciamento. Como a leitura toponímica ou tribal é antiga e plausível, ela é preservada em nota.
- issue: Interpretação das palavras finais לְאִיתִיאֵל לְאִיתִיאֵל וְאֻכָל
  choice: 'Tratá-las como nomes próprios, de acordo com a vocalização massorética: “a Itiel, a Itiel e Ucal”.'
  alternative: 'Revocalizar as consoantes como uma oração verbal: “Estou cansado, ó Deus; estou cansado, ó Deus, e exausto”.'
  rationale: O texto massorético apresenta nomes próprios, leitura mantida no texto principal. A alternativa é registrada porque a sintaxe é difícil e ela altera substancialmente o sentido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação concisa conserva o caráter de inscrição e as repetições do hebraico; as ambiguidades textuais genuínas são apresentadas em notas.
