source:
  edition: WLC
  text: כִּ֤י בַ֣עַר אָנֹכִ֣י מֵ/אִ֑ישׁ וְ/לֹֽא בִינַ֖ת אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/002.yaml
  text: For I am more brutish than anyone[a], and I do not have human understanding.
translation:
  language: pt
  text: Pois sou mais irracional do que um ser humano, e não tenho entendimento humano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois sou irracional demais para ser humano e não tenho o entendimento de um ser humano.”'
    reason: Alternativa lexical e sintática para בַּעַר ... מֵאִישׁ e para o paralelismo com אָדָם.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que o falante acaba de declarar e preserva de modo natural o valor causal ou explicativo da conjunção.
- source_word: בַעַר
  choice: mais irracional
  rationale: O termo descreve alguém embrutecido ou sem entendimento, com possível conotação animalesca. “Irracional” conserva essa força sem sugerir apenas falta de instrução ou comportamento grosseiro.
- source_word: אָנֹכִי
  choice: sou
  rationale: O pronome independente dá ênfase ao falante; em português, essa ênfase é suficientemente comunicada pela forma verbal em primeira pessoa dentro da declaração autodepreciativa.
- source_word: מֵאִישׁ
  choice: que qualquer pessoa
  rationale: מִן pode marcar comparação. Esta formulação expressa em português natural o alcance comparativo de “mais... que”, embora o singular hebraico também permita a leitura mais literal refletida na nota.
- source_word: וְלֹא
  choice: e não
  rationale: Mantém a coordenação simples e a negação do hebraico.
- source_word: בִינַת
  choice: entendimento
  rationale: Equivalente amplo e natural para a capacidade de compreender ou discernir, adequado ao contexto sapiencial.
- source_word: אָדָם
  choice: humano
  rationale: Aqui אָדָם tem sentido antropológico genérico; “humano” comunica esse alcance sem restringi-lo ao sexo masculino.
- source_word: לִי
  choice: tenho
  rationale: A construção dativa de posse é vertida idiomaticamente pelo verbo “ter” em português.
theological_decisions:
- issue: Sentido antropológico genérico de אָדָם
  choice: entendimento humano
  alternative: entendimento do homem
  rationale: O contexto se refere ao entendimento próprio dos seres humanos em geral, não exclusivamente ao sexo masculino.
- issue: Relação sintática de מֵאִישׁ com בַעַר
  choice: 'comparação: “mais irracional que qualquer pessoa”'
  alternative: 'privação ou inadequação: “irracional demais para ser homem”'
  rationale: A preposição מִן admite naturalmente o valor comparativo, adotado no texto principal. Como a construção também pode ser entendida como indicando que o falante não merece ser contado como homem, essa leitura genuinamente possível é preservada em nota.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Irracional” preserva o tom forte de autodepreciação e a ideia de falta de entendimento, evitando o possível sentido meramente comportamental de “bruto”. A nota conserva a ambiguidade da construção hebraica.
