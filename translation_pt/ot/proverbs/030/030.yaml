translation:
  language: pt
  text: o leão[a], valente entre os animais, e não recua diante de ninguém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um leão, valente entre os animais”. O hebraico emprega um termo poético para leão e uma palavra de sentido amplo para a vida animal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: o leão
  rationale: Termo hebraico poético para “leão”. Embora o artigo não esteja explícito, o português usa naturalmente “o leão” como exemplar genérico e emblemático nesta enumeração proverbial.
- source_word: גִּבּוֹר
  choice: valente
  rationale: Expressa força, poder e bravura. “Valente” preserva o tom elevado e, neste contexto, comunica tanto vigor como destemor sem restringir o sentido à esfera militar.
- source_word: בַּבְּהֵמָה
  choice: entre os animais
  rationale: A preposição ב indica aqui relação dentro do mundo animal, e בְּהֵמָה funciona em sentido amplo. “Entre os animais” é claro, natural e não limita indevidamente a referência a animais domésticos.
- source_word: וְלֹא יָשׁוּב
  choice: que não recua
  rationale: שׁוּב significa literalmente voltar ou virar para trás; no contexto, descreve a recusa destemida de retroceder. “Não recua” transmite essa imagem de modo conciso e idiomático.
- source_word: מִפְּנֵי כֹל
  choice: diante de ninguém
  rationale: A expressão indica não retroceder perante qualquer oponente. Em português, “diante de ninguém” conserva a força abrangente e soa mais natural com o verbo “recuar”.
