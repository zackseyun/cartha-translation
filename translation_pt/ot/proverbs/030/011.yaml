  text: דּ֭וֹר אָבִ֣י/ו יְקַלֵּ֑ל וְ/אֶת אִ֝מּ֗/וֹ לֹ֣א יְבָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/011.yaml
  text: There is a generation that curses its father and does not bless its mother[a][b].
translation:
  language: pt
  text: Há uma geração que amaldiçoa o pai e não abençoa a mãe.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu pai [...] sua mãe”. O hebraico usa sufixos pronominais masculinos no singular; o texto principal emprega os artigos definidos de maneira natural em português, com referência aos integrantes da geração.
    reason: lexical_alternative
  - marker: b
    text: “Não abençoa” também pode ter aqui o sentido de “não fala bem de” ou “não honra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: geração
  rationale: O termo designa uma geração ou classe de pessoas marcada por uma característica comum. Preserva também a repetição literária de Provérbios 30:11–14.
- source_word: אָבִיו
  choice: o pai
  rationale: O hebraico traz sufixo masculino singular, literalmente «seu pai». Em português, a referência coletiva já fica clara pelo sujeito «uma geração», e o artigo definido evita o pouco natural «seu pai» com possível ambiguidade de referente.
- source_word: יְקַלֵּל
  choice: amaldiçoa
  rationale: O piel de קלל pode indicar amaldiçoar ou tratar verbalmente com desprezo. «Amaldiçoa» mantém a força da expressão e o contraste lexical com «abençoa».
- source_word: וְאֶת
  choice: e
  rationale: A conjunção וְ é traduzida por «e»; אֶת é marcador de objeto direto definido e não recebe equivalente separado em português.
- source_word: אִמּוֹ
  choice: a mãe
  rationale: O hebraico traz literalmente «sua mãe». O artigo definido é natural em português ao falar de relações familiares e mantém a referência distributiva aos integrantes da geração.
- source_word: לֹא יְבָרֵךְ
  choice: não abençoa
  rationale: ברך no piel significa normalmente «abençoar». A tradução direta conserva o paralelismo antitético com «amaldiçoa», embora no contexto também possa envolver falar bem da mãe ou honrá-la.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial direta. «Há uma geração» preserva a fórmula hebraica e a sequência literária. Os artigos definidos diante de «pai» e «mãe» soam mais naturais em português do que possessivos ligados gramaticalmente a «geração», sem ocultar a forma literal, registrada em nota.
