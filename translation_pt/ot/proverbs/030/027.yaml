base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/027.yaml
  text: The locusts have no king[a], yet all of them march out in ranks.
translation:
  language: pt
  text: Os gafanhotos não têm rei, mas todos saem em fileiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas saem todos divididos”, isto é, organizados em bandos ou divisões.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente direto e natural do substantivo hebraico, preservando a comparação proverbial.
- source_word: אֵין לָאַרְבֶּה
  choice: os gafanhotos não têm
  rationale: A construção existencial com ל expressa posse; o coletivo singular hebraico é vertido naturalmente pelo plural em português.
- source_word: אַרְבֶּה
  choice: os gafanhotos
  rationale: Embora formalmente singular, funciona como substantivo coletivo, confirmado por כֻּלּוֹ e pelo sentido genérico do provérbio.
- source_word: וַיֵּצֵא
  choice: mas ... saem
  rationale: O verbo singular concorda com o coletivo hebraico. O plural é natural em português, e 'mas' explicita o contraste contextual sem alterar a proposição.
- source_word: חֹצֵץ
  choice: em fileiras
  rationale: Expressa a ideia de divisão ou disposição ordenada em grupos, adequada ao movimento coletivo dos gafanhotos.
- source_word: כֻּלּוֹ
  choice: todos
  rationale: Representa a totalidade do coletivo; a concordância plural segue a forma natural escolhida em português.
