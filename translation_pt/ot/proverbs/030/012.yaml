  text: דּ֭וֹר טָה֣וֹר בְּ/עֵינָ֑י/ו וּ֝/מִ/צֹּאָת֗/וֹ לֹ֣א רֻחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/012.yaml
  text: There is a generation that is pure in its own eyes[b][a], yet is not washed from its filth.
translation:
  language: pt
  text: Há uma geração que é pura aos seus próprios olhos[a], mas não está lavada da sua imundície[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpa aos seus próprios olhos”.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica pode significar “imundície”, “esterco” ou “excremento”; a imagem é deliberadamente forte.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: geração
  rationale: O termo pode designar tanto uma geração quanto um grupo de pessoas caracterizado por determinada conduta. “Geração” preserva o sentido lexical e o padrão retórico repetido em Provérbios 30:11–14.
- source_word: טָהוֹר
  choice: pura
  rationale: O adjetivo pode significar “puro” ou “limpo”, em sentido físico, ritual ou moral. “Pura” mantém as conotações mais amplas e contrasta naturalmente com a imundície não lavada.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: A expressão idiomática indica a avaliação que alguém faz de si mesmo. A formulação conserva a imagem hebraica e deixa claro o caráter coletivo e autorreferente da avaliação.
- source_word: וּמִצֹּאָתוֹ
  choice: de sua imundície
  rationale: צֹאָה pode denotar sujeira, esterco ou excremento. “Imundície” preserva a imagem repulsiva e sua possível dimensão moral sem limitar o termo ao sentido estritamente corporal.
- source_word: לֹא רֻחָץ
  choice: não foi lavada
  rationale: A forma passiva expressa que a geração não se encontra purificada como resultado de uma lavagem. A tradução não especifica quem realizaria essa ação, pois o hebraico também não o faz.
theological_decisions:
- issue: Natureza da linguagem de pureza
  choice: Manter o contraste entre a pureza que a geração atribui a si mesma e a imundície da qual não foi lavada, sem restringi-lo ao âmbito ritual ou moral.
  alternative: Interpretar a pureza como exclusivamente ritual ou exclusivamente moral.
  rationale: Embora o contexto favoreça uma aplicação moral, os termos hebraicos evocam linguagem de limpeza que pode abranger dimensões físicas, rituais e morais. A tradução preserva essa amplitude e tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A expressão idiomática “aos seus próprios olhos” foi preservada, e “imundície” mantém a força da imagem sem soar excessivamente clínica.
