base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/003.yaml
  text: For I was a son to my father[b][a], tender and an only child before my mother.
translation:
  language: pt
  text: Pois eu era filho de meu pai, ainda tenro e único diante de minha mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois eu era filho de meu pai, ainda tenro e filho único para minha mãe”. A palavra hebraica traduzida por “único” também pode significar “filho único”, “singular” ou, em certos contextos, “querido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a exortação paterna no contexto e mantém a relação discursiva do hebraico.
- source_word: בֵן הָיִיתִי לְאָבִי
  choice: eu era filho de meu pai
  rationale: Expressa em português natural a relação indicada por לְ, preservando tanto o sentido específico de 'filho' quanto o estado passado de הָיִיתִי.
- source_word: רַךְ
  choice: ainda tenro
  rationale: Conserva a ideia de pouca idade, delicadeza e vulnerabilidade sem reduzir o termo simplesmente a 'jovem'. 'Ainda' torna natural em português a referência à fase da vida.
- source_word: וְיָחִיד
  choice: e único
  rationale: Mantém a amplitude de יָחִיד, que pode indicar o único filho, alguém singular ou alguém especialmente querido, sem decidir no corpo do texto entre essas nuances.
- source_word: לִפְנֵי אִמִּי
  choice: diante de minha mãe
  rationale: Preserva a imagem relacional e presencial da expressão hebraica לִפְנֵי, evitando acrescentar explicitamente 'aos olhos' ou 'na estima', ideias possíveis mas não declaradas.
