  text: קְנֵ֣ה חָ֭כְמָה קְנֵ֣ה בִינָ֑ה אַל תִּשְׁכַּ֥ח וְ/אַל תֵּ֝֗ט מֵֽ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/005.yaml
  text: Acquire wisdom[a]; acquire understanding. Do not forget[b], and do not turn away from the words of my mouth.
translation:
  language: pt
  text: Adquira sabedoria[a]; adquira entendimento. Não se esqueça e não se desvie[b] das palavras da minha boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Obtenha sabedoria; obtenha entendimento”. O verbo hebraico pode significar obter, adquirir ou comprar, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não se afaste” ou “não se aparte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְנֵה
  choice: Adquira
  rationale: O imperativo de קנה expressa obter ou alcançar intencionalmente algo de valor. “Adquira” evita restringir o sentido a uma compra e permite conservar a repetição retórica.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente consagrado e natural em Provérbios, abrangendo sabedoria prática e moral.
- source_word: בִינָה
  choice: entendimento
  rationale: Mantém a distinção em relação a “sabedoria” e forma, em português corrente, um par natural com ela; “discernimento” também é possível.
- source_word: אַל תִּשְׁכַּח
  choice: Não se esqueça
  rationale: Preserva o sentido lexical direto de שכח, sem explicitar a possível implicação contextual de negligência.
- source_word: וְאַל תֵּט
  choice: e não se desvie
  rationale: נטה pode indicar virar-se ou afastar-se do caminho. “Desviar-se de” é idiomático em português e comunica a ideia de não abandonar a instrução.
- source_word: מֵאִמְרֵי פִי
  choice: das palavras da minha boca
  rationale: Conserva a imagem hebraica da instrução oral e o caráter pessoal da exortação, em vez de reduzi-la simplesmente a “meus ditos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “adquira” reproduz a ênfase do hebraico; a expressão concreta “palavras da minha boca” foi mantida.
