base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
translation:
  language: pt
  text: Pois eles comem o pão da perversidade[a] e bebem o vinho da violência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alimentam-se do pão da perversidade”. O verbo hebraico pode ter o sentido de comer, consumir ou alimentar-se; “comem” preserva melhor o paralelo direto com “bebem”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “vinho de violências”. O plural hebraico provavelmente intensifica ou reúne a ideia; em português, “vinho da violência” é mais natural.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência precedente e preserva de modo natural a força explicativa do hebraico.
- source_word: לָחֲמוּ
  choice: comem
  rationale: O verbo לחם II significa aqui comer ou consumir; “comem” é direto e forma um paralelo claro com “bebem”.
- source_word: לֶחֶם
  choice: o pão
  rationale: Mantém a imagem concreta do hebraico, em paralelo com “vinho”; o artigo definido torna a construção idiomática em português.
- source_word: רֶשַׁע
  choice: perversidade
  rationale: Expressa a qualidade moral de רֶשַׁע no contexto sapiencial sem reduzir a expressão apenas a atos isolados.
- source_word: וְיֵין
  choice: e ... o vinho
  rationale: Conserva a ligação coordenada e o paralelismo poético entre pão e vinho.
- source_word: חֲמָסִים
  choice: violência
  rationale: Embora a forma hebraica seja plural, ela pode ter sentido intensivo ou coletivo; o singular abstrato é natural em português.
- source_word: יִשְׁתּוּ
  choice: bebem
  rationale: Traduz diretamente o verbo e explicita o sujeito já presente no primeiro membro, produzindo paralelismo natural em português.
