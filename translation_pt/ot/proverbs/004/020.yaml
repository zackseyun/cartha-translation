base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
translation:
  language: pt
  text: Meu filho, preste atenção às minhas palavras; incline o ouvido[a] aos meus dizeres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “incline o ouvido” significa escutar com atenção.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: O vocativo masculino singular corresponde ao contexto imediato de instrução de um pai ou mestre ao filho e preserva a forma específica do hebraico.
- source_word: לִדְבָרַי
  choice: às minhas palavras
  rationale: דברים designa aqui as palavras ou a instrução do falante; “palavras” é claro, natural e mantém o paralelismo poético.
- source_word: הַקְשִׁיבָה
  choice: preste atenção
  rationale: O imperativo hifil de קשׁב pede escuta ativa e cuidadosa. “Preste atenção” expressa essa força de modo corrente em português.
- source_word: לַאֲמָרַי
  choice: para os meus dizeres
  rationale: “Dizeres” preserva alguma distinção lexical em relação a דברים e mantém o paralelismo sem repetir simplesmente “palavras”.
- source_word: הַט
  choice: incline
  rationale: O imperativo de נטה significa literalmente inclinar ou voltar; com “ouvido”, forma uma imagem de escuta atenta, preservada na tradução.
- source_word: אָזְנֶךָ
  choice: o ouvido
  rationale: Mantém o singular do hebraico. O artigo definido com referência ao interlocutor é natural em português, sem necessidade de explicitar o possessivo.
