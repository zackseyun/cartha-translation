  text: מִֽ/כָּל מִ֭שְׁמָר נְצֹ֣ר לִבֶּ֑/ךָ כִּֽי מִ֝מֶּ֗/נּוּ תּוֹצְא֥וֹת חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/023.yaml
  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
translation:
  language: pt
  text: Acima de tudo o que se guarda, guarde o seu coração,[a] pois dele procedem as fontes da vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mais do que qualquer outra coisa que você guarda, guarde o seu coração”. O hebraico enfatiza que o coração requer a máxima vigilância.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois dele vêm as saídas da vida” ou “as origens da vida”. A expressão hebraica pode indicar fontes, saídas ou aquilo de onde a vida procede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  choice: Acima de tudo o que se guarda
  rationale: Expressa a força comparativa ou superlativa da construção hebraica e mantém a repetição semântica entre “guardar” e o imperativo seguinte, em português natural.
- source_word: נְצֹר
  choice: guarde
  rationale: O imperativo pede proteção ativa e vigilante; “guarde” também preserva o jogo verbal com מִשְׁמָר.
- source_word: לִבֶּךָ
  choice: o seu coração
  rationale: Mantém a imagem antropológica hebraica do coração como centro do pensamento, da vontade e dos afetos, sem reduzi-lo apenas às emoções.
- source_word: כִּי
  choice: pois
  rationale: Introduz com clareza a razão do imperativo.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: Retoma naturalmente “coração” como a origem indicada pela frase.
- source_word: תּוֹצְאוֹת
  choice: fontes
  rationale: O termo pode indicar saídas, nascentes ou origens. “Fontes” preserva a imagem de algo de onde a vida procede, sem a obscuridade de uma tradução excessivamente literal.
- source_word: חַיִּים
  choice: vida
  rationale: Embora tenha forma plural em hebraico, o substantivo funciona aqui com o sentido abstrato singular de “vida”.
theological_decisions:
- issue: Sentido antropológico de “coração”
  choice: Manter “coração” como centro da vida interior.
  alternative: Traduzir como “mente” ou “ser interior”.
  rationale: A tradução literal preserva a amplitude do conceito hebraico, que abrange pensamento, vontade e afetos, sem impor uma interpretação mais estreita.
- issue: Imagem de תּוֹצְאוֹת חַיִּים
  choice: “fontes da vida”
  alternative: “saídas da vida” ou “rumos da vida”
  rationale: O hebraico admite mais de uma nuance. “Fontes da vida” conserva a ideia de origem ou fluxo, enquanto a nota registra a amplitude lexical sem resolver indevidamente a imagem.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a ênfase e o jogo de palavras do hebraico sem soar excessivamente literal.
