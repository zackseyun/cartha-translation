id: PRO.4.1
reference: Proverbs 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֣וּ בָ֭נִים מ֣וּסַר אָ֑ב וְ֝/הַקְשִׁ֗יבוּ לָ/דַ֥עַת בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/001.yaml
  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
translation:
  language: pt
  text: Ouçam[a], filhos, a instrução de um pai; prestem atenção para conhecer o entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Escutem”. O hebraico também pode sugerir ouvir com atenção e obedecer.
    reason: alternativa lexical
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural de שׁמע convoca a uma escuta atenta, com possível implicação de obediência. “Ouçam” preserva a concisão e a força do chamado.
- source_word: בָנִים
  choice: filhos
  rationale: O substantivo masculino plural significa literalmente “filhos” e conserva a moldura pedagógica de pai para filhos característica de Provérbios.
- source_word: מוּסַר
  choice: instrução
  rationale: No contexto sapiencial, מוּסַר abrange instrução formativa, disciplina e correção. “Instrução” se ajusta ao contexto imediato sem excluir essa dimensão formativa.
- source_word: אָב
  choice: de um pai
  rationale: A construção מוּסַר אָב é indefinida; “de um pai” evita introduzir a especificidade de “meu pai” e soa natural em português.
- source_word: וְהַקְשִׁיבוּ
  choice: prestem atenção
  rationale: O imperativo de קשׁב indica atenção concentrada, distinguindo-se do primeiro chamado a ouvir.
- source_word: לָדַעַת
  choice: para conhecer
  rationale: O infinitivo com ל pode expressar propósito ou resultado. “Para conhecer” preserva de modo natural essa relação sem a definir em excesso.
- source_word: בִּינָה
  choice: entendimento
  rationale: Termo central da literatura sapiencial, referente à capacidade de compreender e discernir. “Entendimento” mantém a formulação ampla do hebraico.
theological_decisions:
- issue: Forma masculina do público da instrução sapiencial
  choice: filhos
  alternative: crianças; filhos e filhas
  rationale: O hebraico emprega explicitamente o masculino plural e apresenta a instrução na moldura filial de pai para filhos. A tradução preserva essa forma textual sem negar a aplicação mais ampla da sabedoria.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantém-se o paralelismo entre “Ouçam” e “prestem atenção”, bem como a expressão deliberadamente compacta “conhecer o entendimento” do hebraico.
