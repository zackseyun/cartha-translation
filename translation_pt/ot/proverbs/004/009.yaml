  text: תִּתֵּ֣ן לְ֭/רֹאשְׁ/ךָ לִוְיַת חֵ֑ן עֲטֶ֖רֶת תִּפְאֶ֣רֶת תְּמַגְּנֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/009.yaml
  text: She will place on your head a graceful wreath[b][a]; she will bestow on you a crown of beauty.
translation:
  language: pt
  text: Ela colocará na sua cabeça uma grinalda de graça[a] e lhe dará uma coroa de esplendor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grinalda graciosa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma coroa de beleza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: colocará
  rationale: O qal imperfeito 3fs tem a sabedoria como sujeito feminino no contexto. “Colocará” soa natural com “na sua cabeça” e preserva a imagem concreta.
- source_word: לְרֹאשְׁךָ
  choice: na sua cabeça
  rationale: Neste contexto de adorno, a preposição ל é expressa naturalmente em português por “na”.
- source_word: לִוְיַת
  choice: grinalda
  rationale: Designa um ornamento circular usado na cabeça. “Grinalda” preserva a imagem e é compreensível em português atual.
- source_word: חֵן
  choice: de graça
  rationale: O substantivo pode indicar graça, encanto ou favor. A construção nominal “grinalda de graça” mantém a amplitude e a forma poética do hebraico.
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: É a equivalência comum e clara para o adorno de cabeça mencionado no paralelismo.
- source_word: תִּפְאֶרֶת
  choice: esplendor
  rationale: O termo abrange beleza, esplendor e glória. “Esplendor” preserva sua força ornamental e elevada sem restringi-lo apenas à beleza física.
- source_word: תְּמַגְּנֶךָּ
  choice: lhe dará
  rationale: O piel aqui significa entregar ou conceder, com sufixo de segunda pessoa masculina. “Lhe dará” é natural, claro e adequado ao paralelismo, sem sugerir o sentido distinto de “proteger”.
theological_decisions: []
