source:
  edition: WLC
  text: בְּ/אֹ֣רַח רְ֭שָׁעִים אַל תָּבֹ֑א וְ/אַל תְּ֝אַשֵּׁ֗ר בְּ/דֶ֣רֶךְ רָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/014.yaml
  text: Do not enter the path of the wicked[a], and do not walk in the way of evil men.
translation:
  language: pt
  text: Não entre na vereda dos perversos e não avance[a] pelo caminho dos maus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prossiga” ou “siga em frente”. O verbo hebraico pode indicar avançar ou continuar por um caminho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: vereda
  rationale: O termo designa uma trilha ou curso de vida. “Vereda” preserva a metáfora concreta e permite distingui-lo de דֶּרֶךְ no segundo segmento.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado se refere coletivamente a pessoas moralmente perversas. “Os perversos” é claro, atual e evita acrescentar uma conotação jurídica além do contexto.
- source_word: אַל תָּבֹא
  choice: não entre
  rationale: Com a expressão “na vereda”, o verbo בוא comunica a ideia de ingressar num curso ou modo de vida; “não entre” mantém a imagem de deslocamento.
- source_word: תְּאַשֵּׁר
  choice: não avance
  rationale: No Piel, אשר pode significar seguir em frente, avançar ou prosseguir. “Não avance” expressa esse movimento ao longo do caminho sem reduzi-lo simplesmente a “andar”.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: O substantivo pode indicar uma estrada e, figuradamente, uma maneira de viver. “Caminho” é a equivalência portuguesa mais natural neste contexto.
- source_word: רָעִים
  choice: os maus
  rationale: O adjetivo masculino plural substantivado designa pessoas más. “Os maus” conserva a forma coletiva e o paralelismo com “os perversos”.
theological_decisions:
- issue: Representação dos plurais masculinos רְשָׁעִים e רָעִים
  choice: os perversos / os maus
  alternative: as pessoas perversas / os que praticam o mal
  rationale: As formas hebraicas são masculinas plurais substantivadas. A tradução mantém essa forma gramatical e seu sentido coletivo sem restringir explicitamente a advertência apenas a homens.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. “Vereda” e “caminho” preservam a variação lexical hebraica; “avance” mantém a força específica do segundo verbo, enquanto a nota registra alternativas legítimas.
