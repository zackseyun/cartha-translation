  text: פְּרָעֵ֥/הוּ אַל תַּעֲבָר בּ֑/וֹ שְׂטֵ֖ה מֵ/עָלָ֣י/ו וַ/עֲבֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/015.yaml
  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
translation:
  language: pt
  text: Evite-o[a]; não passe por ele. Desvie-se dele[b] e siga adiante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mantenha-se longe dele”. O verbo hebraico é raro e, neste contexto, indica evitar o caminho dos perversos.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “Desvie-se de cima dele e passe adiante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵהוּ
  choice: Evite-o
  rationale: O imperativo raro, com sufixo masculino singular, ordena que se mantenha distância do caminho dos perversos. “Evite-o” é claro, natural e preserva o referente masculino “caminho” do contexto.
- source_word: אַל תַּעֲבָר בּוֹ
  choice: não passe por ele
  rationale: A partícula אַל expressa proibição, enquanto עבר com ב mantém a imagem espacial de passar pelo caminho mencionado anteriormente.
- source_word: שְׂטֵה מֵעָלָיו
  choice: Desvie-se dele
  rationale: O imperativo שְׂטֵה indica afastar-se ou mudar de direção; a formulação portuguesa comunica uma decisão deliberada de não seguir esse caminho.
- source_word: וַעֲבוֹר
  choice: e siga adiante
  rationale: O imperativo final manda continuar em frente sem entrar no caminho perverso. “Siga adiante” distingue essa ação do “passe por ele” proibido na oração anterior.
