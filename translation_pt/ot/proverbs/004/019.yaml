  text: דֶּ֣רֶךְ רְ֭שָׁעִים כָּֽ/אֲפֵלָ֑ה לֹ֥א יָ֝דְע֗וּ בַּ/מֶּ֥ה יִכָּשֵֽׁלוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/019.yaml
  text: The way of the wicked is like deep darkness[b][a]; they do not know what makes them stumble.
translation:
  language: pt
  text: O caminho dos perversos é como a escuridão profunda[a]; eles não sabem em que tropeçam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como densas trevas” ou “como a escuridão sombria”. O termo hebraico indica uma escuridão especialmente intensa.
    reason: lexical_alternative
  - marker: b
    text: Ou “eles não sabem o que os faz tropeçar”. A expressão hebraica pode indicar aquilo em que tropeçam ou aquilo que causa o tropeço.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Preserva a metáfora sapiencial comum para o curso da vida ou a conduta, em português natural e conciso.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Representa o plural substantivado referente a pessoas moralmente culpadas; é uma formulação clara e corrente em contextos sapienciais.
- source_word: כָּאֲפֵלָה
  choice: como a escuridão profunda
  rationale: Mantém a comparação marcada por כְּ e comunica a intensidade de אֲפֵלָה, uma escuridão densa, mais forte que a escuridão comum.
- source_word: לֹא יָדְעוּ
  choice: eles não sabem
  rationale: Tradução direta que preserva a amplitude entre desconhecimento e falta de percepção.
- source_word: בַּמֶּה
  choice: em que
  rationale: Reflete de perto a construção preposicional hebraica e, com 'tropeçam', permite entender tanto aquilo em que tropeçam quanto, de modo mais amplo, a causa do tropeço.
- source_word: יִכָּשֵׁלוּ
  choice: tropeçam
  rationale: Conserva a imagem moral e sapiencial de כשל sem intensificá-la desnecessariamente para 'caem'.
theological_decisions: []
