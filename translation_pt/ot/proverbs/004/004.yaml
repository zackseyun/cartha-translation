  text: וַ/יֹּרֵ֗/נִי וַ/יֹּ֥אמֶר לִ֗/י יִֽתְמָךְ דְּבָרַ֥/י לִבֶּ֑/ךָ שְׁמֹ֖ר מִצְוֺתַ֣/י וֶֽ/חְיֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/004.yaml
  text: Then he taught me and said to me[a], “Let your heart hold fast my words[b]; keep my commandments and live.”
translation:
  language: pt
  text: 'Então ele me ensinou e me disse: “Que o seu coração[a] retenha firmemente as minhas palavras[b]; guarde os meus mandamentos e viva.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “coração” frequentemente inclui o pensamento, a vontade e o entendimento, não apenas as emoções.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Que o seu coração se apegue firmemente às minhas palavras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֵנִי
  choice: ele me ensinou
  rationale: O hifil de ירה significa aqui ensinar ou instruir. “Ensinou” é natural em português e preserva o contexto pedagógico de pai para filho.
- source_word: וַיֹּאמֶר לִי
  choice: e me disse
  rationale: Tradução direta e idiomática da introdução ao discurso, sem acrescentar nuance interpretativa.
- source_word: יִתְמָךְ
  choice: retenha firmemente
  rationale: תמך pode expressar segurar, sustentar ou manter firme. Com “coração” como sujeito e “minhas palavras” como objeto, a expressão comunica conservação interior firme.
- source_word: דְּבָרַי
  choice: as minhas palavras
  rationale: Tradução ampla e direta, sem restringir o termo a máximas ou explicações específicas.
- source_word: לִבֶּךָ
  choice: o seu coração
  rationale: Preserva a imagem hebraica do coração como centro da reflexão, vontade e disposição interior; uma nota evita sua redução ao campo das emoções.
- source_word: שְׁמֹר
  choice: guarde
  rationale: שמר significa guardar, observar ou cumprir. “Guarde” mantém a imagem de conservar com cuidado e combina naturalmente com “mandamentos”.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: מצוה designa uma ordem dotada de autoridade; “mandamentos” preserva esse peso sem enfraquecê-lo como simples conselho.
- source_word: וֶחְיֵה
  choice: e viva
  rationale: Mantém a forma imperativa e a construção compacta do hebraico, sem decidir se a conjunção deve ser entendida explicitamente como finalidade ou resultado.
theological_decisions:
- issue: Relação entre guardar os mandamentos e viver
  choice: “guarde os meus mandamentos e viva”
  alternative: “guarde os meus mandamentos para que viva” ou “e você viverá”
  rationale: A formulação conserva a coordenação concisa e a tensão do hebraico, sem especificar além do texto se a vida é ordem, finalidade ou resultado prometido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o tom de instrução paterna e a concisão proverbial do hebraico.
