  text: הָסֵ֣ר מִ֭מְּ/ךָ עִקְּשׁ֣וּת פֶּ֑ה וּ/לְז֥וּת שְׂ֝פָתַ֗יִם הַרְחֵ֥ק מִמֶּֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/024.yaml
  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
translation:
  language: pt
  text: Afaste de você a perversidade da boca[a] e mantenha longe de você a falsidade dos lábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a boca perversa” e “os lábios perversos”. Os substantivos hebraicos nas duas partes descrevem uma fala moralmente tortuosa, distorcida ou enganosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Afaste
  rationale: O imperativo causativo pede uma ação deliberada de remover ou afastar; “afaste” é natural em português e combina com a expressão de separação “de você”.
- source_word: מִמְּךָ
  choice: de você
  rationale: A preposição com sufixo de segunda pessoa masculina singular indica separação do destinatário e ressalta sua responsabilidade pessoal.
- source_word: עִקְּשׁוּת
  choice: perversidade
  rationale: O substantivo designa aquilo que é moralmente tortuoso ou distorcido. “Perversidade” preserva seu caráter abstrato e a metáfora ética.
- source_word: פֶּה
  choice: boca
  rationale: Tradução literal que conserva a imagem corporal e o paralelismo poético com “lábios”.
- source_word: וּלְזוּת
  choice: maldade
  rationale: O substantivo raro aponta para desvio, distorção ou perversidade, especialmente na fala. “Maldade” produz uma expressão portuguesa compreensível sem eliminar a sobreposição semântica com o primeiro verso.
- source_word: שְׂפָתַיִם
  choice: lábios
  rationale: Mantém a imagem concreta do hebraico e seu paralelismo com “boca”.
- source_word: הַרְחֵק
  choice: mantenha longe
  rationale: O imperativo causativo significa fazer ficar longe ou manter à distância; a formulação preserva a intensificação do segundo membro.
- source_word: מִמֶּךָ
  choice: de você
  rationale: Indica novamente separação do destinatário, em formulação idiomática e clara.
theological_decisions: []
