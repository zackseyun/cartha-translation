  text: הַחֲזֵ֣ק בַּ/מּוּסָ֣ר אַל תֶּ֑רֶף נִ֝צְּרֶ֗/הָ כִּי הִ֥יא חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/013.yaml
  text: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
translation:
  language: pt
  text: Agarre-se à instrução e não a solte. Guarde-a, pois ela é a sua vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Agarre-se
  rationale: O imperativo de חזק expressa firmeza ao segurar ou apegar-se. “Agarre-se” preserva a metáfora concreta e a força da exortação em português natural.
- source_word: בַּמּוּסָר
  choice: à instrução
  rationale: מוּסָר em Provérbios abrange ensino formativo, disciplina e correção. “Instrução” funciona bem no contexto sapiencial sem excluir as demais nuances.
- source_word: אַל תֶּרֶף
  choice: não a solte
  rationale: רפה indica aqui afrouxar ou soltar aquilo que se segura. A tradução mantém a metáfora iniciada por “Agarre-se”.
- source_word: נִצְּרֶהָ
  choice: Guarde-a
  rationale: נצר significa guardar, conservar ou vigiar. “Guarde-a” comunica proteção e retenção cuidadosa, com o pronome feminino retomando “instrução” naturalmente em português.
- source_word: כִּי הִיא
  choice: pois ela
  rationale: O pronome feminino retoma מוּסָר. Em português, “ela” concorda naturalmente com “instrução” e preserva a referência explícita do hebraico.
- source_word: חַיֶּיךָ
  choice: a sua vida
  rationale: Embora חַיִּים tenha forma plural, é idiomaticamente usado com o sentido abrangente de “vida”. O singular é a formulação natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sequência “Agarre-se... não a solte” conserva a metáfora de segurar firmemente; “Guarde-a” mantém a mudança para a ideia de proteção. Não se acrescentou nota, pois as nuances disciplinares de מוּסָר não exigem esclarecimento para a compreensão do versículo isolado.
