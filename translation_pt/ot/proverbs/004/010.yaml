id: PRO.4.10
reference: Proverbs 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י וְ/קַ֣ח אֲמָרָ֑/י וְ/יִרְבּ֥וּ לְ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/010.yaml
  text: Hear[a], my son, and receive my words[c][b], and the years of your life will be many.
translation:
  language: pt
  text: Ouça, meu filho, e acolha as minhas palavras, e os anos de sua vida se multiplicarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os seus anos de vida serão muitos” ou “aumentarão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouça
  rationale: O imperativo masculino singular de שׁמע pode indicar tanto ouvir como prestar atenção obediente. “Ouça” é natural em português e preserva essa amplitude sem explicitar além do hebraico.
- source_word: בְּנִי
  choice: meu filho
  rationale: O vocativo com sufixo de primeira pessoa é masculino singular e pertence ao quadro literário de instrução de pai para filho em Provérbios.
- source_word: וְקַח
  choice: e acolha
  rationale: O imperativo de לקח significa tomar ou receber. No contexto de instrução, “acolha” expressa de modo idiomático a recepção atenta das palavras, sem reduzir a ideia à mera audição.
- source_word: אֲמָרָי
  choice: as minhas palavras
  rationale: O plural com sufixo de primeira pessoa é traduzido diretamente e com naturalidade; “ditos” seria possível, mas mais marcado como gênero sapiencial.
- source_word: וְיִרְבּוּ
  choice: se multiplicarão
  rationale: O qal imperfeito plural de רבה tem o sentido de tornar-se muitos, aumentar ou multiplicar-se. “Se multiplicarão” mantém a imagem verbal do hebraico e funciona naturalmente com “anos”.
- source_word: לְךָ שְׁנוֹת חַיִּים
  choice: os anos de sua vida
  rationale: A combinação de לְךָ com “anos de vida” indica os anos de vida destinados ou pertencentes ao ouvinte. A formulação possessiva é idiomática em português.
theological_decisions:
- issue: Tratamento marcado por gênero na instrução sapiencial
  choice: meu filho
  alternative: minha criança
  rationale: O hebraico é masculino singular e conserva a moldura literária concreta da instrução paterna. Uma forma neutra apagaria essa característica do texto.
- issue: Relação entre acolher a instrução e a longevidade
  choice: 'manter a afirmação direta: “os anos de sua vida se multiplicarão”'
  alternative: explicitar como regra geral, promessa condicionada ou garantia absoluta
  rationale: O provérbio enuncia diretamente a consequência sem qualificar sua natureza. A tradução preserva essa tensão sapiencial e não acrescenta uma sistematização teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ouça” e “acolha” formam uma exortação natural; “se multiplicarão” conserva a força figurada do verbo hebraico. O pronome “sua” acompanha o tratamento por “você” implícito nas formas verbais, sem introduzir regionalismo.
