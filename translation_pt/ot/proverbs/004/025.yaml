  text: Let your eyes look straight ahead[a], and your eyelids be directed before you.
translation:
  language: pt
  text: Que os seus olhos olhem diretamente para a frente, e as suas pálpebras se mantenham voltadas diretamente para o que está diante de você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “e as suas pálpebras se dirijam retas diante de você”. O verbo hebraico expressa a ideia de direcionar ou seguir em linha reta.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: os seus olhos
  rationale: O substantivo está no plural com sufixo de segunda pessoa masculina singular; a forma plural é natural em português e preserva a imagem corporal hebraica.
- source_word: לְנֹכַח
  choice: diretamente para a frente
  rationale: A expressão indica aquilo que está diretamente à frente. A tradução conserva tanto a orientação espacial quanto a ideia contextual de atenção sem desvio.
- source_word: יַבִּיטוּ
  choice: olhem
  rationale: O verbo נבט significa olhar ou contemplar. “Olhem” é claro e não acrescenta a intensidade sugerida por “fitem” ou “contemplem”.
- source_word: וְעַפְעַפֶּיךָ
  choice: e as suas pálpebras
  rationale: Mantém o termo anatômico concreto e o paralelismo poético com “olhos”, sem reduzi-lo simplesmente a “olhar”.
- source_word: יַיְשִׁרוּ
  choice: se mantenham voltadas
  rationale: O verbo deriva de ישר e expressa retidão ou direção em linha reta. A formulação portuguesa comunica a orientação visual sem tornar a imagem das pálpebras excessivamente estranha; a nota preserva o sentido mais literal de retidão.
- source_word: נֶגְדֶּךָ
  choice: para o que está diante de você
  rationale: Reproduz a referência ao que se encontra em frente da pessoa e mantém a distinção lexical em relação à primeira metade do verso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A segunda pessoa é expressa por “você” com possessivos de terceira pessoa, evitando mistura pronominal. O paralelismo e a imagem concreta de olhos e pálpebras foram preservados.
