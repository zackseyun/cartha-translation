  text: אַל תַּעַזְבֶ֥/הָ וְ/תִשְׁמְרֶ֑/ךָּ אֱהָבֶ֥/הָ וְ/תִצְּרֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/006.yaml
  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
translation:
  language: pt
  text: Não a abandone[a], e ela o guardará; ame-a, e ela o protegerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a sabedoria, personificada como mulher nesta passagem.
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Com o imperfeito, אַל expressa uma proibição. “Não” é a forma natural em português, sem acrescentar uma ênfase ausente do hebraico.
- source_word: תַּעַזְבֶהָ
  choice: abandone a sabedoria
  rationale: עזב significa deixar ou abandonar. “Abandone” preserva a força relacional do verbo. A explicitação de “a sabedoria” evita a ambiguidade pouco natural de iniciar o versículo isolado com “a”, mantendo a referência feminina do contexto.
- source_word: וְתִשְׁמְרֶךָּ
  choice: e ela cuidará de você
  rationale: שׁמר pode significar guardar, vigiar, preservar ou cuidar. “Cuidará de você” é natural, comunica proteção e permite distinguir este verbo de נצר no segundo membro.
- source_word: אֱהָבֶהָ
  choice: ame-a
  rationale: אהב significa diretamente “amar”. O pronome feminino conserva a personificação da sabedoria.
- source_word: וְתִצְּרֶךָּ
  choice: e ela o protegerá
  rationale: נצר transmite a ideia de guardar ou preservar com nuance protetora. “Protegerá” expressa essa nuance e mantém uma leve distinção em relação a שׁמר.
theological_decisions:
- issue: Personificação feminina da sabedoria
  choice: Manter a referência feminina por meio de “ela” e “ame-a”
  alternative: Tratar a sabedoria como uma abstração sem pronomes femininos ou repetir o substantivo em cada oração
  rationale: Os sufixos femininos hebraicos retomam a sabedoria, personificada como mulher no contexto. A tradução conserva essa imagem literária sem transformá-la numa afirmação ontológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cuidará de você” e “o protegerá” preservam o paralelismo com variação lexical natural. O marcador [a] aparece no texto principal.
