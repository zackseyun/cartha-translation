  text: כִּ֤י לֶ֣קַח ט֭וֹב נָתַ֣תִּי לָ/כֶ֑ם תּֽ֝וֹרָתִ֗/י אַֽל תַּעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
translation:
  language: pt
  text: Pois eu lhes dei boa instrução; não abandonem o meu ensino[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha instrução”; tradicionalmente, “minha lei”. O hebraico torá pode designar instrução em sentido amplo, não apenas lei estatutária.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da exortação no contexto, preservando de modo natural a força conectiva.
- source_word: לֶקַח טוֹב
  choice: boa instrução
  rationale: לֶקַח designa aqui o conteúdo transmitido pelo pai, e טוֹב o qualifica como bom; a expressão é clara e natural em português.
- source_word: נָתַתִּי לָכֶם
  choice: eu lhes dei
  rationale: O perfeito hebraico apresenta a instrução como já concedida. O pretérito perfeito português expressa isso naturalmente, sem precisar explicitar aspecto resultativo.
- source_word: תּוֹרָתִי
  choice: o meu ensino
  rationale: No contexto sapiencial de instrução paterna, תּוֹרָה tem sentido amplo de ensino autorizado, não necessariamente de legislação codificada.
- source_word: אַל תַּעֲזֹבוּ
  choice: não abandonem
  rationale: A proibição pede fidelidade contínua ao ensino. “Abandonem” conserva o peso moral de עזב e é corrente no português moderno.
theological_decisions:
- issue: Sentido de תּוֹרָתִי no contexto sapiencial
  choice: o meu ensino
  alternative: a minha lei; a minha instrução
  rationale: O contexto de pai para filhos favorece o sentido amplo de ensino autorizado. A tradução evita identificar indevidamente estas palavras com a Lei mosaica, sem excluir a amplitude semântica de תּוֹרָה.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lhes” corresponde ao plural לָכֶם, e “não abandonem” mantém o plural da exortação.
