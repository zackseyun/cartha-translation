  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
translation:
  language: pt
  text: Valorize-a muito[a], e ela o exaltará; ela o honrará quando você a abraçar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estime-a” ou “Exalte-a”. O verbo hebraico é raro e pode transmitir a ideia de valorizar, estimar ou exaltar a sabedoria.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porque você a abraça”. O hebraico também pode ser entendido em sentido causal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  choice: Valorize-a muito
  rationale: O verbo סלסל é raro e pode expressar a ideia de valorizar, estimar ou exaltar. “Valorize-a muito” preserva essa amplitude básica e evita repetir “exaltar”, empregado na oração seguinte.
- source_word: וּתְרוֹמְמֶךָ
  choice: e ela o exaltará
  rationale: A forma de רומם significa levantar ou exaltar; o sujeito feminino singular retoma a sabedoria personificada. “Exaltará” mantém o sentido elevado e honorífico.
- source_word: תְּכַבֵּדְךָ
  choice: ela o honrará
  rationale: O piel de כבד aqui comunica conceder honra. “Honrará” é natural em português e não intensifica o sentido indevidamente como poderia ocorrer com “glorificará”.
- source_word: כִּי
  choice: porque
  rationale: O valor causal comum de כי foi mantido no texto principal, preservando a relação explícita do hebraico entre abraçar a sabedoria e receber honra. A possível leitura circunstancial ou temporal é registrada em nota.
- source_word: תְחַבְּקֶנָּה
  choice: você a abraça
  rationale: O verbo חבק significa abraçar. A tradução conserva a imagem da sabedoria personificada como mulher e a ideia de acolhê-la e mantê-la junto de si.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com a personificação feminina da sabedoria preservada. Optou-se por “você” para ampla inteligibilidade brasileira e por uma formulação causal no texto principal, mais próxima do valor usual de כִּי.
