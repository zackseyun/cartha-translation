  text: כִּֽי חַיִּ֣ים הֵ֭ם לְ/מֹצְאֵי/הֶ֑ם וּֽ/לְ/כָל בְּשָׂר֥/וֹ מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/022.yaml
  text: For they are life to those who find them[a], and healing to all their flesh.
translation:
  language: pt
  text: Pois elas são vida para quem as encontra e cura para todo o seu corpo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cura para toda a sua carne”. Também se pode traduzir: “saúde para todo o seu corpo”.'
    reason: Registra a expressão hebraica literal e uma alternativa lexical possível.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e mantém a ligação explicativa natural em português.
- source_word: חַיִּים
  choice: vida
  rationale: Embora tenha forma plural em hebraico, o substantivo funciona idiomaticamente como abstrato singular.
- source_word: הֵם
  choice: elas são
  rationale: O pronome retoma as palavras do ensinamento mencionadas no contexto; o feminino concorda naturalmente com “palavras” em português.
- source_word: לְמֹצְאֵיהֶם
  choice: para quem as encontra
  rationale: Expressa de modo corrente o particípio substantivado, com o objeto pronominal retomando as palavras; “quem” tem valor genérico sem restringir o sentido.
- source_word: וּלְכָל בְּשָׂרוֹ
  choice: e para todo o seu corpo
  rationale: בָּשָׂר significa literalmente “carne”, mas aqui designa a totalidade física da pessoa. “Todo o seu corpo” comunica esse sentido com clareza no português moderno, enquanto a nota preserva a transparência lexical.
- source_word: מַרְפֵּא
  choice: cura
  rationale: O substantivo denota cura, restauração ou saúde; “cura” preserva o sentido resultativo sem sugerir necessariamente um medicamento concreto.
theological_decisions:
- issue: Masculino singular genérico no discurso proverbial
  choice: “quem as encontra” e “seu corpo”
  alternative: “os que as encontram” e “a carne dele”
  rationale: A formulação portuguesa mantém a referência genérica individual e faz corresponder naturalmente o singular de “quem” ao sufixo masculino singular de בְּשָׂרוֹ, sem limitar a aplicação aos homens.
- issue: Sentido literal ou contextual de בָּשָׂר
  choice: “corpo” no texto, com “carne” na nota
  alternative: “carne” no texto principal
  rationale: Neste contexto, בָּשָׂר se refere ao ser físico inteiro. “Corpo” é mais natural e inequívoco em português atual; a nota registra a forma literal e preserva a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O pronome “elas” retoma as palavras ou instruções do contexto imediato. A construção genérica com “quem” conserva o valor proverbial e permite manter o singular da segunda oração.
