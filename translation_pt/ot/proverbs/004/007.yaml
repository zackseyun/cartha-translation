  text: רֵאשִׁ֣ית חָ֭כְמָה קְנֵ֣ה חָכְמָ֑ה וּ/בְ/כָל קִ֝נְיָנְ/ךָ֗ קְנֵ֣ה בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
translation:
  language: pt
  text: 'O princípio da sabedoria é este: adquira sabedoria[a]; e, com tudo o que você adquirir[b], adquira entendimento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A sabedoria é o mais importante; portanto, adquira sabedoria», entendendo רֵאשִׁית no sentido de «principal» ou «de primeira importância».'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: «com toda a sua aquisição» ou «com todos os seus bens»; a formulação provavelmente faz um jogo de palavras com o verbo repetido «adquirir».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: o princípio da
  rationale: Preserva o sentido usual de começo ou primeira etapa e permite que a oração seguinte explique em que consiste esse princípio, sem excluir o possível sentido de prioridade.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente consagrado e natural em Provérbios para a capacidade prática e moral de viver bem; a repetição hebraica é mantida.
- source_word: קְנֵה
  choice: adquira
  rationale: O imperativo pode significar comprar, obter ou adquirir. «Adquira» comunica busca intencional, conserva a dignidade do registro e sustenta o jogo verbal com קִנְיָן.
- source_word: וּבְכָל קִנְיָנְךָ
  choice: e, com tudo o que você adquirir
  rationale: Reproduz a ideia de empregar tudo quanto se adquire e preserva, na medida do possível, o jogo de palavras entre o substantivo cognato e o imperativo, sem restringir o sentido a dinheiro ou riqueza.
- source_word: בִינָה
  choice: entendimento
  rationale: Termo claro e abrangente para a capacidade de compreender e discernir, adequado ao vocabulário sapiencial.
theological_decisions:
- issue: Sentido de רֵאשִׁית na frase nominal inicial
  choice: «O princípio da sabedoria é este»
  alternative: «A sabedoria é o mais importante; portanto...»
  rationale: O hebraico admite tanto uma leitura temporal/fundamental («princípio») quanto uma leitura de primazia («principal coisa»). O texto principal conserva a forma mais direta, enquanto a nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «sabedoria» e «adquira» conserva a ênfase e o jogo retórico do hebraico. O pronome «você» torna explícita a segunda pessoa masculina singular do texto-fonte sem produzir um registro excessivamente solene.
