source:
  edition: WLC
  text: פַּ֭לֵּס מַעְגַּ֣ל רַגְלֶ֑/ךָ וְֽ/כָל דְּרָכֶ֥י/ךָ יִכֹּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/026.yaml
  text: Level the path of your feet[a], and all your ways will be established.
translation:
  language: pt
  text: Aplane a vereda para os seus pés[a], e todos os seus caminhos ficarão firmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Examine cuidadosamente a vereda dos seus pés”; o verbo hebraico também pode ter o sentido de pesar ou avaliar com cuidado.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּ֭לֵּס
  choice: Aplane
  rationale: O imperativo piel de פלס pode expressar a ação de nivelar ou aplainar e também a de pesar, avaliar. “Aplane” preserva aqui a imagem concreta de preparar cuidadosamente a vereda, sem eliminar a alternativa lexical indicada em nota.
- source_word: מַעְגַּ֣ל רַגְלֶ֑ךָ
  choice: a vereda para os seus pés
  rationale: מַעְגָּל designa vereda, trilha ou curso. A formulação portuguesa mantém a imagem corporal dos pés e comunica com naturalidade a ideia de uma rota preparada para caminhar.
- source_word: וְֽכָל
  choice: e todos
  rationale: Reproduz a coordenação simples do hebraico sem acrescentar uma relação inferencial mais explícita do que a marcada no texto.
- source_word: דְּרָכֶ֥יךָ
  choice: os seus caminhos
  rationale: דֶּרֶךְ no plural pode indicar tanto caminhos concretos quanto o modo de viver; “caminhos” conserva essa extensão metafórica.
- source_word: יִכֹּֽנוּ
  choice: ficarão firmes
  rationale: O nifal de כון comunica a ideia de ser estabelecido, consolidado ou tornado firme. “Ficarão firmes” é natural em português e preserva o sentido resultativo e a imagem de estabilidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “seus” evita regionalismos marcados; “vereda” conserva o registro sapiencial sem soar arcaico. A nota preserva a ambiguidade genuína do verbo hebraico.
