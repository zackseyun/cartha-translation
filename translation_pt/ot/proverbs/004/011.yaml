base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/011.yaml
  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
translation:
  language: pt
  text: 'Eu lhe ensinei o caminho da sabedoria;

    eu o conduzi pelas veredas da retidão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veredas retas”. O termo hebraico pode evocar tanto a retidão literal de um caminho quanto a retidão moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֶרֶךְ חָכְמָה
  choice: o caminho da sabedoria
  rationale: דֶּרֶךְ designa caminho, estrada ou modo de viver. A tradução conserva a metáfora central de Provérbios e expressa naturalmente em português a relação com חָכְמָה.
- source_word: הֹרֵתִיךָ
  choice: Eu lhe ensinei
  rationale: O hifil de ירה pode significar ensinar, instruir ou orientar. “Ensinei” é claro e natural no contexto pedagógico, sem perder a ideia de transmissão de sabedoria.
- source_word: הִדְרַכְתִּיךָ
  choice: eu o conduzi
  rationale: O hifil de דרך significa fazer caminhar, guiar ou conduzir. “Conduzi” preserva a imagem de movimento e distingue este verbo do ensino mencionado na primeira linha.
- source_word: בְּמַעְגְּלֵי
  choice: pelas veredas da
  rationale: מַעְגָּל indica trilha, vereda ou curso. “Veredas” mantém o plural hebraico e produz paralelismo natural com “caminho”.
- source_word: יֹשֶׁר
  choice: retidão
  rationale: יֹשֶׁר pode indicar tanto a qualidade literal de ser reto quanto a integridade moral. “Retidão” comunica bem o sentido ético provável sem apagar a metáfora espacial, explicitada em nota.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e acessível, com boa legibilidade brasileira. O pronome de tratamento implícito é “você”: por isso, usam-se “lhe” e “o” para o destinatário masculino indicado pelo hebraico. O paralelismo poético e a metáfora do percurso foram preservados.'
