  text: אַל יַלִּ֥יזוּ מֵ/עֵינֶ֑י/ךָ שָׁ֝מְרֵ֗/ם בְּ/ת֣וֹךְ לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/021.yaml
  text: Do not let them depart from your eyes[b][a]; keep them within your heart.
translation:
  language: pt
  text: Não as perca de vista[a]; guarde-as no íntimo do seu coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não deixe que se afastem dos seus olhos.”'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “coração” se refere à pessoa interior — o centro do pensamento, da vontade e dos afetos no uso hebraico.
    reason: cultural_note
lexical_decisions:
- source_word: אַל יַלִּיזוּ מֵעֵינֶיךָ
  choice: Não as perca de vista
  rationale: Expressa em português natural a proibição hebraica de que os ensinamentos se afastem dos olhos, preservando a ideia de mantê-los continuamente diante da atenção. A formulação mais concreta do hebraico é registrada na nota.
- source_word: שָׁמְרֵם
  choice: guarde-as
  rationale: O imperativo de שׁמר abrange guardar, conservar e vigiar. “Guarde-as” é claro e mantém essa amplitude no contexto dos ensinamentos mencionados anteriormente.
- source_word: בְּתוֹךְ לְבָבֶךָ
  choice: no íntimo do seu coração
  rationale: “No íntimo” representa a localização interior enfatizada por בְּתוֹךְ, enquanto “coração” conserva a metáfora hebraica de לֵבָב sem reduzi-la apenas à mente ou às emoções.
