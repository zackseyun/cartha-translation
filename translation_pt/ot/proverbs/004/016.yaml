  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
translation:
  language: pt
  text: Pois eles não dormem até que tenham praticado o mal, e o sono lhes é tirado até que façam alguém tropeçar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que eles mesmos tropecem”. A forma hebraica é breve e pode ser entendida como “fazer alguém tropeçar” ou como “eles mesmos tropeçarem”; o contexto favorece a ideia de causar tropeço a outros.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da advertência anterior e preserva de modo natural a relação causal.
- source_word: לֹא יִשְׁנוּ
  choice: não dormem
  rationale: Mantém a forma direta do hebraico e, no contexto, expressa a conduta habitual dos perversos.
- source_word: אִם לֹא יָרֵעוּ
  choice: enquanto não fazem o mal
  rationale: A construção portuguesa é natural para uma condição que precisa ser cumprida antes do sono; “fazem o mal” conserva a generalidade do verbo, cujo objeto não é expresso.
- source_word: וְנִגְזְלָה שְׁנָתָם
  choice: e seu sono lhes é roubado
  rationale: Preserva a voz passiva e a imagem forte de גזל, ao mesmo tempo que soa clara e idiomática em português.
- source_word: אִם לֹא יכשולו
  choice: enquanto não fazem alguém tropeçar
  rationale: O contexto e o paralelismo favorecem o sentido causativo, no qual os perversos provocam a queda de outra pessoa; a metáfora de tropeçar é preservada.
theological_decisions:
- issue: Alcance moral de יָרֵעוּ sem objeto expresso
  choice: fazem o mal
  alternative: causam dano a outros
  rationale: O hebraico não identifica uma vítima nessa oração; a tradução mantém a afirmação geral sem acrescentar um objeto.
- issue: Sentido de יכשולו
  choice: fazem alguém tropeçar
  alternative: eles mesmos tropeçam
  rationale: O paralelismo com a prática do mal e a progressão do provérbio favorecem o sentido causativo, mas a brevidade da forma hebraica permite a leitura intransitiva, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Enquanto não” comunica naturalmente a condição temporal repetida, e “seu sono lhes é roubado” conserva a imagem enfática do hebraico.
