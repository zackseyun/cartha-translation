id: PRO.4.18
reference: Proverbs 4:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
translation:
  language: pt
  text: Mas a vereda dos justos é como a luz da aurora[a], que brilha cada vez mais até o dia chegar à sua plenitude.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma luz resplandecente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “até o dia estar plenamente estabelecido”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/אֹרַח
  choice: Mas a vereda
  rationale: אֹרַח significa caminho ou vereda. No contraste com o caminho dos perversos no versículo anterior, a conjunção וְ é naturalmente expressa por “mas”.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O substantivo adjetival plural designa as pessoas justas como categoria moral; “os justos” é conciso, corrente e preserva essa categoria.
- source_word: כְּ/אוֹר נֹגַהּ
  choice: como a luz da aurora[a]
  rationale: כְּ marca a comparação, אוֹר significa “luz”, e נֹגַהּ designa brilho ou resplendor. A progressão até o dia pleno favorece contextualmente “aurora”, enquanto a nota preserva a alternativa lexical mais direta.
- source_word: הוֹלֵךְ וָאוֹר
  choice: que brilha cada vez mais
  rationale: A sequência idiomática, literalmente “vai e brilha”, descreve uma progressão contínua de luminosidade. A formulação escolhida comunica essa progressão em português natural sem transformar a imagem em explicação abstrata.
- source_word: עַד נְכוֹן הַיּוֹם
  choice: até o dia chegar à sua plenitude[b]
  rationale: עַד marca o limite temporal; נְכוֹן, de כון, comunica algo firme ou plenamente estabelecido. “Chegar à sua plenitude” expressa de modo idiomático o dia já estabelecido em sua claridade, e a nota registra a construção mais formal.
theological_decisions:
- issue: Categoria moral de צַדִּיקִים
  choice: os justos
  alternative: as pessoas justas; os retos
  rationale: A expressão mantém o contraste ético entre justos e perversos no contexto de Provérbios, sem acrescentar uma definição soteriológica ou denominacional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Vereda” conserva a metáfora sapiencial tradicional sem soar arcaica; as notas preservam a amplitude lexical e a forma incomum do hebraico.
