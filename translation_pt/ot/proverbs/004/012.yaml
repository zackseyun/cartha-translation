base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/012.yaml
  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
translation:
  language: pt
  text: Quando você andar, seu passo não será impedido[a]; e, se correr, não tropeçará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ficará apertado/restringido”. O verbo hebraico transmite a ideia de ser estreitado ou limitado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  choice: Quando você andar
  rationale: O infinitivo construto de הלך com בְּ e sufixo de segunda pessoa masculina singular tem valor temporal. “Quando você andar” exprime isso com naturalidade em português.
- source_word: יֵצַר
  choice: não será impedido
  rationale: O verbo comunica a ideia de estreitamento ou restrição. No contexto do passo, “não será impedido” transmite naturalmente que o movimento não ficará limitado, enquanto a nota preserva a imagem lexical hebraica.
- source_word: צַעֲדֶךָ
  choice: seu passo
  rationale: Mantém o substantivo singular com sufixo de segunda pessoa, preservando a imagem do caminhar.
- source_word: וְאִם
  choice: e, se
  rationale: Conserva tanto a ligação coordenativa quanto a formulação condicional simples do hebraico.
- source_word: תָּרוּץ
  choice: correr
  rationale: רץ significa normalmente “correr”; não há motivo contextual para enfraquecer o sentido como “apressar-se” nem intensificá-lo.
- source_word: תִכָּשֵׁל
  choice: não tropeçará
  rationale: O nifal de כשל denota tropeçar ou vacilar. “Tropeçará” preserva a metáfora do caminho e permite sua ressonância tanto concreta quanto moral.
