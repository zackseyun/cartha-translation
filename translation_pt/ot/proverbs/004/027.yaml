  text: אַֽל תֵּט יָמִ֥ין וּ/שְׂמֹ֑אול הָסֵ֖ר רַגְלְ/ךָ֣ מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/027.yaml
  text: Do not turn to the right or to the left[b][a]; remove your foot from evil.
translation:
  language: pt
  text: Não se desvie nem para a direita nem para a esquerda; afaste o seu pé do mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּט
  choice: se desvie
  rationale: Com אַל, a forma verbal expressa proibição. “Desviar-se” comunica naturalmente a ideia de sair do caminho e combina com as direções paralelas.
- source_word: יָמִין
  choice: para a direita
  rationale: Preserva o sentido direcional simples e o paralelismo hebraico.
- source_word: שְׂמֹאול
  choice: para a esquerda
  rationale: Mantém o contraponto exato a “direita” e a imagem de não abandonar o caminho em nenhuma direção.
- source_word: הָסֵר
  choice: afaste
  rationale: O imperativo pede que o pé seja retirado ou mantido longe do mal. “Afaste” é corrente em português e preserva a imagem concreta sem explicá-la em excesso.
- source_word: רַגְלְךָ
  choice: o seu pé
  rationale: Mantém o singular do hebraico e a metáfora corporal do caminho e da conduta.
- source_word: מֵרָע
  choice: do mal
  rationale: No contexto da exortação sapiencial, רַע tem sentido moral amplo. “Do mal” é conciso e não restringe indevidamente a referência a dano ou perversidade específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “nem” torna natural a proibição coordenada, enquanto “afaste o seu pé do mal” conserva a metáfora concreta e a concisão do hebraico.
