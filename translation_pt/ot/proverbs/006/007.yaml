  text: אֲשֶׁ֖ר אֵֽין לָ֥/הּ קָצִ֗ין שֹׁטֵ֥ר וּ/מֹשֵֽׁל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/007.yaml
  text: which has no chief[a], officer, or ruler,
translation:
  language: pt
  text: que não tem chefe[a], oficial nem governante,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que descreve a formiga mencionada no versículo anterior.
- source_word: אֵין לָהּ
  choice: não tem
  rationale: A construção existencial com ל e sufixo pronominal expressa posse; “não tem” é idiomático e preserva o sentido.
- source_word: קָצִין
  choice: chefe
  rationale: Designa alguém em posição de liderança; “chefe” mantém a distinção em relação ao último termo, “governante”.
- source_word: שֹׁטֵר
  choice: supervisor
  rationale: O termo pode designar um oficial ou encarregado administrativo. “Supervisor” é claro no contexto da organização do trabalho da formiga e não sugere especificamente um agente policial moderno.
- source_word: וּמֹשֵׁל
  choice: nem governante
  rationale: מֹשֵׁל é quem governa ou exerce domínio. Depois da negativa “não tem”, “nem” apresenta naturalmente em português os demais membros da série.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação final mantém a continuidade sintática com o versículo seguinte. O feminino explícito de לָהּ não precisa ser reproduzido, pois “formiga” já é gramaticalmente feminino em português.
