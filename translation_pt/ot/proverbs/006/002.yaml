translation:
  language: pt
  text: você ficou enredado pelas palavras da sua boca[a], ficou preso pelas palavras da sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você está enredado pelas palavras da sua boca”. Os verbos hebraicos podem destacar o estado presente resultante.'
    reason: alternativa gramatical
lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  choice: você ficou enredado
  rationale: O nifal de יקש descreve alguém apanhado numa armadilha. “Ficou enredado” preserva a imagem e expressa com naturalidade o estado resultante do perfeito hebraico.
- source_word: בְאִמְרֵי
  choice: pelas palavras da
  rationale: A preposição ב tem valor instrumental, e אִמְרֵי designa as palavras proferidas; “pelas palavras da” comunica o meio pelo qual a pessoa foi enredada.
- source_word: פִיךָ
  choice: sua boca
  rationale: A tradução concreta de פֶּה preserva o idioma hebraico para a fala e a repetição enfática nos dois membros do verso.
- source_word: נִלְכַּדְתָּ
  choice: ficou preso
  rationale: O nifal de לכד significa ser apanhado ou capturado. “Ficou preso” é português corrente e forma um paralelismo sinonímico natural com “ficou enredado”.
