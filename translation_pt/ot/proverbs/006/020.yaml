  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
translation:
  language: pt
  text: Guarde, meu filho, o mandamento de seu pai e não abandone o ensino de sua mãe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: Guarde
  rationale: O imperativo de נצר expressa guardar com cuidado, conservar e observar. “Guarde” preserva tanto a ideia protetora quanto a de obediência.
- source_word: בְּנִי
  choice: meu filho
  rationale: A expressão hebraica é masculina singular com sufixo de primeira pessoa; “meu filho” conserva sua forma e o cenário de instrução familiar.
- source_word: מִצְוַת
  choice: o mandamento
  rationale: מִצְוָה designa uma ordem ou um mandamento. “Mandamento” mantém o peso da orientação paterna e combina com o registro sapiencial.
- source_word: אָבִיךָ
  choice: de seu pai
  rationale: A construção hebraica indica posse; “de seu pai” é natural e mantém o paralelismo com “de sua mãe”.
- source_word: תִּטֹּשׁ
  choice: não abandone
  rationale: נטש significa deixar ou abandonar. “Não abandone” comunica claramente a rejeição deliberada da instrução, sem recorrer a vocabulário arcaizante.
- source_word: תּוֹרַת
  choice: o ensino
  rationale: Neste contexto de sabedoria familiar, תּוֹרָה se refere à formação e orientação materna, não especificamente a legislação codificada. “Ensino” expressa isso de modo natural.
- source_word: אִמֶּךָ
  choice: de sua mãe
  rationale: A construção indica posse e corresponde naturalmente ao paralelo “de seu pai”.
