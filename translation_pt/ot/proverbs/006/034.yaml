  text: כִּֽי קִנְאָ֥ה חֲמַת גָּ֑בֶר וְ/לֹֽא יַ֝חְמ֗וֹל בְּ/י֣וֹם נָקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/034.yaml
  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: pt
  text: Pois o ciúme é a fúria de um homem, e ele não terá compaixão no dia da vingança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  choice: ciúme
  rationale: No contexto do adultério e do marido ofendido, o termo indica ciúme conjugal, não inveja.
- source_word: חֲמַת
  choice: desperta a fúria
  rationale: חֵמָה denota ira intensa ou furor. A construção hebraica é compacta e pode ser entendida como predicativa; a formulação verbal comunica naturalmente em português que o ciúme provoca essa fúria.
- source_word: גָּבֶר
  choice: do marido
  rationale: Embora o substantivo signifique literalmente 'homem', o contexto imediato identifica esse homem como o marido da mulher envolvida no adultério.
- source_word: יַחְמוֹל
  choice: terá compaixão
  rationale: O verbo significa poupar, mostrar piedade ou ter compaixão; esta escolha preserva o sentido sem sugerir necessariamente perdão judicial.
- source_word: בְּיוֹם נָקָם
  choice: no dia da vingança
  rationale: Tradução direta da expressão temporal, que aponta para o momento em que o marido busca retribuição.
theological_decisions:
- issue: Caráter descritivo ou prescritivo da vingança
  choice: Manter a declaração descritiva de que o marido não terá compaixão
  alternative: Reformular como aprovação moral ou autorização divina da vingança
  rationale: O provérbio descreve a reação implacável do marido traído dentro da advertência contra o adultério; não explicita aprovação moral dessa reação.
- issue: Identidade de גָּבֶר
  choice: Traduzir contextualmente como 'marido'
  alternative: Traduzir de modo estritamente lexical como 'homem'
  rationale: Os versículos 29 e 32–35 tratam do adultério e da resposta do marido; 'marido' torna explícito o referente contextual sem introduzir doutrina externa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para evitar a formulação pouco idiomática 'o ciúme é a fúria do marido', preservando a relação causal/predicativa do hebraico.
