  text: לֹא יִ֭שָּׂא פְּנֵ֣י כָל כֹּ֑פֶר וְ/לֹֽא יֹ֝אבֶ֗ה כִּ֣י תַרְבֶּה שֹֽׁחַד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/035.yaml
  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
translation:
  language: pt
  text: Não aceitará resgate algum[a] nem cederá, por maior que seja o suborno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “compensação”. O hebraico diz literalmente que ele não “levantará o rosto” de resgate algum, expressão que, neste contexto, indica recusar pagamento ou favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  choice: Não aceitará
  rationale: O hebraísmo, literalmente relacionado a “levantar o rosto”, aqui comunica que ele não concederá favor em troca do pagamento mencionado; “não aceitará” expressa isso naturalmente em português.
- source_word: כָל כֹּפֶר
  choice: resgate algum
  rationale: כֹּפֶר designa um pagamento compensatório destinado a afastar consequências. “Resgate” preserva a força do termo, enquanto a alternativa mais ampla é indicada em nota.
- source_word: לֹא יֹאבֶה
  choice: nem cederá
  rationale: O verbo expressa falta de disposição ou consentimento. No contexto de uma tentativa de apaziguamento financeiro, “não cederá” transmite o sentido sem convertê-lo em satisfação emocional.
- source_word: כִּי תַרְבֶּה שֹׁחַד
  choice: por maior que seja o suborno
  rationale: A formulação portuguesa comunica naturalmente o valor concessivo da oração e mantém “suborno” no singular, como no hebraico.
