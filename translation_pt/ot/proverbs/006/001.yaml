base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
translation:
  language: pt
  text: Meu filho, se você se tornou fiador do seu próximo[a], se apertou a mão de um estranho para firmar uma garantia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do seu amigo” ou “do seu companheiro”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “bateu as suas mãos com um estranho”; o gesto de unir ou apertar as mãos confirmava uma garantia ou obrigação.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém o vocativo masculino singular característico da instrução paterna ou sapiencial em Provérbios, em linguagem natural e digna.
- source_word: אִם
  choice: se
  rationale: Introduz diretamente a condição apresentada pelo versículo.
- source_word: עָרַבְתָּ
  choice: se tornou fiador
  rationale: O verbo descreve assumir responsabilidade pela dívida ou obrigação de outra pessoa. “Tornar-se fiador” expressa com clareza essa nuance jurídico-financeira.
- source_word: לְרֵעֶךָ
  choice: do seu próximo
  rationale: רֵעַ pode designar amigo, companheiro, vizinho ou outra pessoa com quem se mantém uma relação. “Próximo” preserva essa amplitude sem pressupor amizade íntima.
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  choice: apertou a mão ... para firmar o compromisso
  rationale: A expressão concreta de bater ou unir as mãos refere-se ao gesto pelo qual se confirmava uma garantia. A formulação portuguesa conserva a imagem da mão e explicita sua função.
- source_word: לַזָּר
  choice: de um estranho
  rationale: זָר indica alguém estranho ou de fora. A construção “apertou a mão de um estranho” é idiomática em português e mantém a identidade da outra parte sem definir indevidamente seu papel.
