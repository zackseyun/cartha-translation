  text: נֹאֵ֣ף אִשָּׁ֣ה חֲסַר לֵ֑ב מַֽשְׁחִ֥ית נַ֝פְשׁ֗/וֹ ה֣וּא יַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
translation:
  language: pt
  text: Quem comete adultério com uma mulher não tem juízo[a]; quem faz isso destrói a si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem comete adultério com uma esposa não tem entendimento; quem faz isso arruína a própria vida.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאֵף
  choice: comete adultério
  rationale: O particípio hebraico descreve quem pratica adultério. A locução verbal é natural em português e expressa claramente a ação.
- source_word: אִשָּׁה
  choice: com uma mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. O sentido adúltero já está expresso pelo verbo; a tradução principal mantém o termo mais amplo sem eliminar a alternativa lexical.
- source_word: חֲסַר לֵב
  choice: não tem juízo
  rationale: A expressão, literalmente “falto de coração”, designa em Provérbios deficiência de discernimento ou bom senso, e não falta de emoção. “Não tem juízo” é corrente, claro e apropriado ao contexto sapiencial.
- source_word: מַשְׁחִית
  choice: destrói
  rationale: O particípio no Hifil comunica causar destruição ou ruína. “Destrói” preserva a força e a concisão do hebraico.
- source_word: נַפְשׁוֹ
  choice: a si mesmo
  rationale: נֶפֶשׁ refere-se aqui à própria pessoa ou vida, não especificamente a uma alma imaterial. A forma reflexiva reproduz esse sentido de modo natural.
- source_word: הוּא יַעֲשֶׂנָּה
  choice: quem faz isso
  rationale: O pronome enfático e o verbo com sufixo feminino retomam o ato de adultério. “Quem faz isso” expressa naturalmente essa referência em português.
