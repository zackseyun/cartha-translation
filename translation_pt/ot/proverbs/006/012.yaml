review_pass:
  verdict: revise
  source_fidelity: O paralelismo «אָדָם בְּלִיַּעַל / אִישׁ אָוֶן» é bem reconhecido, e «anda» preserva adequadamente o particípio הוֹלֵךְ como retrato de conduta habitual. Contudo, «homem perverso» para אִישׁ אָוֶן enfraquece a construção caracterizadora «homem de maldade», e «anda com a boca perversa» soa pouco idiomático em português e pode sugerir uma característica física, em vez de fala moralmente torcida.
  naturalness: «Anda com perversidade na boca» conserva a imagem de פֶּה, comunica de modo claro a referência à fala e é uma formulação portuguesa mais natural e digna para o registro proverbial.
  terminology: «Homem sem valor» é uma opção defensável para בְּלִיַּעַל no contexto moral. «Homem de maldade» representa de modo mais próximo e claro אִישׁ אָוֶן, sem impor uma distinção teológica além do texto. «Perversidade» representa bem עִקְּשׁוּת.
  issues:
  - severity: medium
    issue: A expressão «anda com a boca perversa» é pouco natural e imprecisa em português.
    rationale: Embora reflita literalmente a associação entre «andar» e «boca», o hebraico descreve a fala/caráter verbal da pessoa. «Com perversidade na boca» conserva a imagem concreta e torna o sentido inequívoco.
  - severity: low
    issue: «Homem perverso» torna adjetival a expressão «homem de maldade».
    rationale: A opção não é errada quanto ao sentido geral, mas «homem de maldade» preserva melhor a construção hebraica, o paralelismo e a caracterização moral por אָוֶן.
  revised_text: O homem sem valor, o homem de maldade, anda com perversidade na boca[a].
