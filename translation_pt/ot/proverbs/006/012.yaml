  text: אָדָ֣ם בְּ֭לִיַּעַל אִ֣ישׁ אָ֑וֶן ה֝וֹלֵ֗ךְ עִקְּשׁ֥וּת פֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/012.yaml
  text: A worthless man[a], a man of wickedness, walks with a perverse mouth.
translation:
  language: pt
  text: O homem sem valor, o homem de maldade, anda com perversidade na boca[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «falando perversidades». Lit. «com perversidade de boca».'
    reason: Registra a explicitação idiomática da referência à fala e a forma literal da expressão hebraica.
lexical_decisions:
- source_word: אָדָם
  choice: homem
  rationale: O contexto apresenta um indivíduo como exemplo moral, e o paralelismo com אִישׁ favorece o singular pessoal.
- source_word: בְּלִיַּעַל
  choice: sem valor
  rationale: Aqui o termo qualifica moralmente o homem como vil ou indigno; evita-se a transliteração “Belial”, que poderia sugerir indevidamente um nome próprio personificado.
- source_word: אִישׁ
  choice: homem
  rationale: Preserva o paralelismo hebraico com אָדָם e a referência singular do provérbio.
- source_word: אָוֶן
  choice: perverso
  rationale: A construção “homem de אָוֶן” caracteriza a pessoa pela maldade. Em português, o adjetivo “perverso” transmite essa força moral com naturalidade.
- source_word: הוֹלֵךְ
  choice: anda
  rationale: Mantém a metáfora hebraica do andar como conduta habitual, ainda compreensível em português.
- source_word: עִקְּשׁוּת
  choice: perversa
  rationale: Expressa a ideia de tortuosidade ou perversidade moral e concorda naturalmente com “boca” na formulação portuguesa.
- source_word: פֶּה
  choice: boca
  rationale: Preserva a imagem concreta do hebraico, embora ela se refira à maneira de falar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo próximo ao hebraico. A repetição de “homem” é mantida por seu efeito retórico, e “boca” conserva a imagem concreta da fala.
