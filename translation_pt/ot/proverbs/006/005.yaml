  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
translation:
  language: pt
  text: Livre-se, como a gazela, da mão; e, como o pássaro, da mão de quem arma laços.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No primeiro membro, o hebraico diz apenas “da mão”; o agente não é especificado. No segundo, “quem arma laços” pode também ser traduzido “armadilheiro” ou “passarinheiro”.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הִנָּצֵל
  choice: Livre-se
  rationale: 'O imperativo nifal masculino singular de נצל tem aqui sentido reflexivo e urgente: o destinatário deve escapar do compromisso perigoso descrito no contexto. “Livre-se” comunica de modo natural tanto a ordem quanto a ideia de sair do poder de alguém.'
- source_word: כִּצְבִי
  choice: como a gazela
  rationale: צְבִי designa normalmente a gazela; a preposição כ־ introduz a comparação. “Gazela” conserva a imagem ágil e é mais precisa que o termo amplo “veado”.
- source_word: מִיָּד
  choice: da mão
  rationale: יָד significa literalmente “mão” e pode representar domínio ou poder. A expressão concreta foi preservada por fazer parte da imagem de captura e do paralelismo hebraico.
- source_word: וּכְצִפּוֹר
  choice: e, como o pássaro
  rationale: צִפּוֹר é um termo geral para ave, frequentemente de pequeno porte, sem exigir a espécie “pardal”. “Pássaro” é natural e mantém a generalidade do hebraico.
- source_word: מִיַּד יָקוּשׁ
  choice: da mão de quem arma laços
  rationale: יָקוּשׁ designa a pessoa que coloca laços ou armadilhas. A formulação mantém o agente humano e a repetição de “da mão”, evitando o termo pouco corrente “passarinheiro” no corpo do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por vocabulário corrente. O paralelismo e a imagem concreta da “mão” foram preservados. A elipse incomum do primeiro membro foi explicitada no texto como “caçador”, mas documentada em nota para não ocultar que o hebraico traz somente “da mão”.
