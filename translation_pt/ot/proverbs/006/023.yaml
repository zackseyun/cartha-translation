base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
translation:
  language: pt
  text: Pois o mandamento é lâmpada, e o ensino[a] é luz; as repreensões da disciplina são o caminho da vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «instrução». Neste contexto sapiencial, תּוֹרָה se refere provavelmente a um ensino autorizado, não especificamente à Lei mosaica.
    reason: lexical_alternative
  - marker: b
    text: Ou «repreensões disciplinadoras» ou «repreensões que promovem disciplina». A expressão hebraica reúne a correção verbal e a disciplina formativa. «Caminho da vida» também pode ser entendido como «caminho para a vida».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e mantém a função explicativa do hebraico.
- source_word: נֵר
  choice: lâmpada
  rationale: Preserva a imagem concreta e a distingue de אוֹר, “luz”, no paralelismo.
- source_word: מִצְוָה
  choice: mandamento
  rationale: Expressa uma ordem dotada de autoridade, adequada ao contexto de instrução parental em Provérbios.
- source_word: תּוֹרָה
  choice: ensino
  rationale: Neste contexto sapiencial, designa ensino normativo e autorizado, sem exigir uma referência específica à Lei mosaica.
- source_word: אוֹר
  choice: luz
  rationale: É o equivalente natural e preserva a imagem de iluminação e orientação.
- source_word: דֶרֶךְ חַיִּים
  choice: o caminho da vida
  rationale: Reproduz uma expressão sapiencial que pode indicar tanto o caminho caracterizado pela vida quanto aquele que conduz a ela.
- source_word: תּוֹכְחוֹת מוּסָר
  choice: as repreensões que disciplinam
  rationale: Comunica em português natural a combinação entre correção verbal e disciplina formativa, sem reduzir um dos dois elementos ao outro.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto sapiencial
  choice: ensino
  alternative: lei; instrução
  rationale: “Ensino” preserva a autoridade do termo no contexto parental e sapiencial sem restringi-lo indevidamente à Lei mosaica.
- issue: Sentido de דֶרֶךְ חַיִּים
  choice: o caminho da vida
  alternative: o caminho para a vida
  rationale: A formulação mantém a tensão do hebraico entre um modo de viver caracterizado pela vida e um caminho que conduz à vida.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e as imagens de lâmpada, luz e caminho foram preservadas; o ponto e vírgula torna clara a progressão sem enfraquecer a unidade poética.
