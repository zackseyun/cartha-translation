  text: לִ֭/שְׁמָרְ/ךָ מֵ/אֵ֣שֶׁת רָ֑ע מֵֽ֝/חֶלְקַ֗ת לָשׁ֥וֹן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/024.yaml
  text: to keep you from the evil woman[b][a], from the smooth tongue of the foreign woman.
translation:
  language: pt
  text: para proteger você da mulher má[b], da língua lisonjeira[a] da mulher estrangeira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da língua suave”; literalmente, “da língua lisa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da mulher estranha”; alguns entendem mais especificamente “da adúltera”.
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: para guardar você
  rationale: O infinitivo construto com ל expressa a finalidade do ensino mencionado no versículo anterior. “Guardar você” é claro em português e mantém o sentido de proteção.
- source_word: מֵאֵשֶׁת רָע
  choice: da mulher má
  rationale: אֵשֶׁת pode significar “mulher” ou “esposa”; neste contexto, “mulher” evita restringir indevidamente o referente. רָע descreve sua maldade moral.
- source_word: מֵחֶלְקַת לָשׁוֹן
  choice: da língua suave
  rationale: A expressão evoca literalmente a suavidade ou lisura da língua e, de modo idiomático, uma fala sedutora ou bajuladora. A imagem hebraica é preservada no texto, com explicação em nota.
- source_word: נָכְרִיָּה
  choice: da mulher estrangeira
  rationale: A escolha mantém o sentido lexical básico de alguém estrangeiro ou alheio, sem reduzir antecipadamente a expressão à interpretação mais específica de “adúltera”.
theological_decisions:
- issue: Interpretação de נָכְרִיָּה na literatura sapiencial
  choice: mulher estrangeira
  alternative: mulher estranha; adúltera
  rationale: O termo possui o sentido básico de estrangeira ou alheia e pode adquirir conotações de perigo sexual e moral em Provérbios. O texto principal conserva o valor lexical, enquanto a nota registra as interpretações contextuais possíveis.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação preserva o paralelismo e a metáfora hebraica sem tornar explícita no texto principal uma interpretação mais estreita do que o original.
