  text: בְּ/הִתְהַלֶּכְ/ךָ֨ תַּנְחֶ֬ה אֹתָ֗/ךְ בְּֽ֭/שָׁכְבְּ/ךָ תִּשְׁמֹ֣ר עָלֶ֑י/ךָ וַ֝/הֲקִיצ֗וֹתָ הִ֣יא תְשִׂיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
translation:
  language: pt
  text: Quando você andar, ela o guiará; quando se deitar, ela velará por você; e, quando acordar, ela falará com você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  choice: Quando você andar
  rationale: O ב temporal com o infinitivo construto hitpael de הלך indica a ocasião da ação. “Andar” preserva tanto o movimento cotidiano quanto a possível dimensão do modo de viver, em paralelo com deitar-se e acordar.
- source_word: תַּנְחֶה אֹתָךְ
  choice: ela o guiará
  rationale: O hifil de נחה significa conduzir ou guiar. “Guiará” é natural no contexto sapiencial, e o pronome feminino explicita a concordância com a instrução mencionada no contexto.
- source_word: בְּשָׁכְבְּךָ
  choice: quando se deitar
  rationale: O ב temporal com o infinitivo construto de שכב se refere ao ato de deitar-se, não necessariamente ao sono; a forma reflexiva é idiomática em português.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: ela velará por você
  rationale: שׁמר com על comunica proteção e vigilância. “Velará por você” preserva essa nuance e mantém um registro digno e compreensível.
- source_word: וַהֲקִיצוֹתָ
  choice: e, quando acordar
  rationale: A forma de קיץ/יקץ dá continuidade à sequência temporal. “Acordar” é corrente e direto em português moderno.
- source_word: הִיא
  choice: ela
  rationale: O pronome hebraico é feminino singular e retoma a instrução/mandamento do contexto. Como esses substantivos também são femininos em português, “ela” preserva naturalmente a referência e a personificação.
- source_word: תְשִׂיחֶךָ
  choice: ela falará com você
  rationale: שׂיח pode expressar falar, conversar ou meditar. “Falará com você” conserva a nuance relacional sem restringir o sentido a mera instrução unilateral.
theological_decisions:
- issue: Personificação feminina da instrução ou do mandamento
  choice: Manter “ela” no texto principal
  alternative: Usar uma formulação impessoal, como “isso”, ou repetir “a instrução”
  rationale: O hebraico emprega explicitamente um pronome feminino, e o português permite preservá-lo com naturalidade porque “instrução”, provável referente imediato, é feminino. Isso também mantém a ressonância da personificação sapiencial sem identificar dogmaticamente a figura.
- issue: Alcance de “andar”
  choice: Preservar “andar” sem explicitar “viver” ou “seguir seu caminho”
  alternative: Traduzir como “quando você seguir seu caminho” ou “em sua vida diária”
  rationale: A forma verbal pode sugerir tanto deslocamento quanto conduta habitual. O paralelismo cotidiano favorece a tradução concreta, que deixa aberta a extensão metafórica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se a cadência tríplice do hebraico e a referência feminina explícita. “Velará” oferece dignidade poética sem ser arcaico; “você” assegura clareza para o singular masculino genérico do destinatário.
