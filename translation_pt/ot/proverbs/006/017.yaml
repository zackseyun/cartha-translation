  text: olhos arrogantes, língua mentirosa e mãos que derramam sangue inocente,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַיִם רָמוֹת
  choice: olhos arrogantes
  rationale: Mantém a imagem hebraica dos olhos como expressão visível do orgulho. “Arrogantes” comunica naturalmente a elevação moralmente condenável indicada por רָמוֹת.
- source_word: לְשׁוֹן שָׁקֶר
  choice: língua mentirosa
  rationale: Preserva a metonímia corporal do hebraico, em que a língua representa a fala, e expressa שָׁקֶר como falsidade praticada.
- source_word: יָדַיִם
  choice: mãos
  rationale: Tradução literal que mantém a sequência poética de partes do corpo usadas como instrumentos do mal.
- source_word: שֹׁפְכוֹת
  choice: que derramam
  rationale: A oração relativa reproduz com naturalidade o valor descritivo e caracterizador do particípio hebraico.
- source_word: דָּם נָקִי
  choice: sangue inocente
  rationale: Expressão portuguesa consagrada e fiel ao hebraico, referindo-se ao sangue de quem não tem culpa que justifique a violência sofrida.
