source:
  edition: WLC
  text: וְ֭/נִמְצָא יְשַׁלֵּ֣ם שִׁבְעָתָ֑יִם אֶת כָּל ה֖וֹן בֵּית֣/וֹ יִתֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/031.yaml
  text: Yet if he is found[a], he must repay sevenfold; he must give all the wealth of his house.
translation:
  language: pt
  text: Mas, se for pego, terá de restituir sete vezes[a]; terá de entregar todos os bens de sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sétuplo”. A expressão hebraica pode indicar restituição multiplicada por sete ou um pagamento no valor de sete.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצָא
  choice: Mas, se for pego
  rationale: O waw introduz um contraste com a compaixão mencionada no versículo anterior, e o nifal de מצא indica que o ladrão é descoberto ou apanhado. A formulação condicional é natural no contexto.
- source_word: יְשַׁלֵּם
  choice: terá de restituir
  rationale: O piel de שלם denota fazer restituição. “Terá de” comunica a obrigação resultante de ele ser pego.
- source_word: שִׁבְעָתָיִם
  choice: sete vezes
  rationale: A forma numeral adverbial indica restituição multiplicada por sete. “Sete vezes” é clara e natural em português, sem decidir além do que a expressão hebraica permite.
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  choice: todos os bens de sua casa
  rationale: הוֹן pode designar riqueza, recursos ou bens. Aqui, “todos os bens de sua casa” comunica a totalidade do patrimônio doméstico em linguagem corrente.
- source_word: יִתֵּן
  choice: dará
  rationale: נתן descreve o ato concreto de entregar os bens, em paralelismo com a restituição exigida na primeira oração.
theological_decisions:
- issue: Relação entre a restituição sete vezes maior e a entrega de todos os bens
  choice: Manter as duas afirmações em paralelo, sem explicar se a segunda limita ou intensifica a primeira
  alternative: Interpretar a entrega de todos os bens apenas como resultado possível do pagamento sétuplo
  rationale: O hebraico justapõe as duas orações e não explicita a relação lógica precisa entre elas; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Pego” expressa de modo corrente o ato de o ladrão ser descoberto; “restituir” preserva o teor jurídico do contexto sapiencial.
