  text: נֶֽגַע וְ/קָל֥וֹן יִמְצָ֑א וְ֝/חֶרְפָּת֗/וֹ לֹ֣א תִמָּחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/033.yaml
  text: He will find injury and disgrace[b][a], and his reproach will not be wiped away.
translation:
  language: pt
  text: Encontrará ferimento e desonra, e sua desonra não será apagada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Encontrará ferida e desonra, e seu opróbrio não será apagado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: ferimento
  rationale: O termo pode indicar golpe, ferida ou aflição. “Ferimento” conserva o caráter concreto da consequência sem restringi-la a doença.
- source_word: קָלוֹן
  choice: desonra
  rationale: Expressa vergonha pública e perda de honra, em linguagem natural e atual.
- source_word: יִמְצָא
  choice: encontrará
  rationale: Preserva de modo inteligível a formulação hebraica segundo a qual essas consequências alcançarão o homem.
- source_word: חֶרְפָּתוֹ
  choice: sua humilhação
  rationale: O termo denota opróbrio, afronta ou vergonha pública duradoura. “Humilhação” evita repetir “desonra” e mantém essa dimensão social.
- source_word: לֹא תִמָּחֶה
  choice: não será apagada
  rationale: Mantém a imagem do hebraico de algo que não pode ser eliminado ou apagado.
theological_decisions: []
