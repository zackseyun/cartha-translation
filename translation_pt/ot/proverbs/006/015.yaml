base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/015.yaml
  text: Therefore his disaster will come suddenly[a]; in an instant he will be broken[b], and there will be no healing.
translation:
  language: pt
  text: Por isso, sua calamidade[a] virá de repente; num instante ele será destruído, e não haverá cura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu desastre” / “sua ruína”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e não haverá remédio” / “sem remédio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e direto a consequência decorrente da descrição anterior do homem perverso.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: Preserva o sentido adverbial de algo que sobrevém subitamente.
- source_word: יָבֹוא אֵידוֹ
  choice: sua calamidade virá
  rationale: אֵיד pode indicar calamidade, desastre ou ruína; “calamidade” mantém a amplitude do termo e se ajusta ao tom solene da advertência sapiencial.
- source_word: פֶּתַע
  choice: num instante
  rationale: Distingue este segundo termo de súbita ocorrência de פִּתְאֹם e preserva a intensificação poética.
- source_word: יִשָּׁבֵר
  choice: ele será quebrado
  rationale: Mantém a voz passiva e a imagem ampla do verbo שׁבר, sem restringi-la explicitamente a ruína, esmagamento ou morte.
- source_word: וְאֵין מַרְפֵּא
  choice: e não haverá cura
  rationale: Conserva a metáfora de cura e restauração presente em מַרְפֵּא, indicando que a destruição será irremediável.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição conceitual dos dois termos hebraicos ligados à subitaneidade foi preservada por expressões distintas (“de repente” e “num instante”), e a metáfora de ser quebrado foi mantida deliberadamente aberta.
