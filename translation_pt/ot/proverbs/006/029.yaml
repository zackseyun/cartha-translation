  text: כֵּ֗ן הַ֭/בָּא אֶל אֵ֣שֶׁת רֵעֵ֑/הוּ לֹ֥א יִ֝נָּקֶ֗ה כָּֽל הַ/נֹּגֵ֥עַ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/029.yaml
  text: So is the one who goes in to his neighbor’s wife[b][a]; everyone who touches her will not go unpunished.
translation:
  language: pt
  text: 'Assim acontece com quem se deita com a mulher do seu próximo: ninguém que tocar nela[b] ficará impune[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será absolvido” ou “não será considerado sem culpa”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “tocar nela” provavelmente se refere a contato sexual ilícito, não a um toque físico casual.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: Assim acontece
  rationale: Introduz a aplicação da comparação dos versículos anteriores de maneira natural em português.
- source_word: הַבָּא אֶל
  choice: quem se deita com
  rationale: No contexto de adultério, a expressão com בוא אל é um eufemismo sexual; esta formulação comunica o sentido claramente sem ser vulgar.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: a mulher do seu próximo
  rationale: Preserva o sentido relacional e ético de רֵעַ e mantém a formulação proverbial tradicional, com boa compreensão em português.
- source_word: לֹא יִנָּקֶה
  choice: não ficará impune
  rationale: O nifal de נקה expressa aqui não escapar da punição ou não ser declarado sem culpa; esta é uma formulação portuguesa natural.
- source_word: כָּל הַנֹּגֵעַ בָּהּ
  choice: ninguém que tocar nela
  rationale: Reproduz o verbo amplo 'tocar' e expressa distributivamente a negação universal, preservando a linguagem contida do hebraico.
theological_decisions:
- issue: Natureza da consequência expressa por לֹא יִנָּקֶה
  choice: ficará impune
  alternative: será declarado inocente / ficará sem culpa
  rationale: A tradução preserva a força judicial e consequencial da forma hebraica sem especificar se a punição é social, jurídica ou divina.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A expressão 'se deita com' explicita naturalmente o eufemismo sexual de בוא אל, enquanto 'tocar nela' conserva a formulação contida e mais ampla da segunda oração. Os marcadores seguem imediatamente a afirmação a que se referem.
