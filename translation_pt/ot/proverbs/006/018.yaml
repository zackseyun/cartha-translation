  text: a heart that devises wicked plans[a], feet that hurry to run to evil,
translation:
  language: pt
  text: um coração que trama planos perversos[a], pés que se apressam a correr para o mal,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um coração que maquina projetos malignos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica do íntimo da pessoa, incluindo pensamento e intenção, sem reduzi-la apenas à mente.
- source_word: חֹרֵשׁ
  choice: trama
  rationale: Neste uso figurado, o verbo significa arquitetar ou maquinar. “Trama” é natural em português e comunica a elaboração intencional de algo mau.
- source_word: מַחְשְׁבוֹת
  choice: planos
  rationale: O substantivo pode designar pensamentos, projetos ou planos; no contexto, “planos” expressa melhor a intenção deliberada.
- source_word: אָוֶן
  choice: perversos
  rationale: Aqui o termo qualifica os planos como moralmente corruptos. “Perversos” preserva o sentido e evita repetir “mal” no segundo membro.
- source_word: רַגְלַיִם
  choice: pés
  rationale: Mantém a imagem concreta das partes do corpo apresentadas como instrumentos da maldade.
- source_word: מְמַהֲרוֹת
  choice: se apressam
  rationale: O particípio indica pressa e prontidão; a forma reflexiva é idiomática e digna em português.
- source_word: לָרוּץ
  choice: a correr
  rationale: Traduz diretamente o infinitivo e conserva a imagem enfática de movimento veloz.
- source_word: לָרָעָה
  choice: para o mal
  rationale: Reproduz de modo compacto a preposição direcional com o substantivo, sem acrescentar a ideia explícita de “praticar”, ausente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A estrutura paralela e as imagens corporais do hebraico foram preservadas; “trama planos” mantém a deliberada formação interior da maldade.
