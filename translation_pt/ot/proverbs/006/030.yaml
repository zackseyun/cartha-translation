  text: People do not despise a thief if he steals to satisfy himself when he is hungry[a][b].
translation:
  language: pt
  text: As pessoas não desprezam um ladrão se ele rouba para saciar o apetite[a] quando está com fome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para encher sua alma/vida”; no contexto, também pode significar “para satisfazer seu apetite” ou “para satisfazer a si mesmo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque está com fome”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָב֣וּזוּ
  choice: se despreza
  rationale: בוז indica desprezar ou tratar com desdém. A construção impessoal com «se» comunica naturalmente em português a avaliação social geral expressa pelo plural hebraico.
- source_word: לַגַּנָּב
  choice: o ladrão
  rationale: Embora o substantivo seja definido em hebraico, «o ladrão» funciona naturalmente em português como singular genérico proverbial.
- source_word: כִּי יִגְנ֑וֹב
  choice: quando rouba
  rationale: כִּי introduz aqui a circunstância em que a afirmação se aplica. «Quando» preserva essa relação sem impor uma condicionalidade mais forte.
- source_word: לְמַלֵּ֥א נַפְשׁוֹ
  choice: para saciar a própria fome
  rationale: A expressão significa literalmente «para encher sua נפש». No contexto explícito de fome, «saciar a própria fome» transmite de modo natural a ideia de satisfazer a necessidade ou o apetite, enquanto a nota preserva a forma e a amplitude do hebraico.
- source_word: נַפְשׁוֹ
  choice: a própria fome
  rationale: נֶפֶשׁ pode designar a pessoa, a vida ou o apetite. Neste contexto, a referência ao estar faminto favorece uma expressão ligada à fome, sem recorrer ao pouco natural «encher sua alma» no texto principal.
- source_word: כִּי יִרְעָב
  choice: porque está faminto
  rationale: A segunda ocorrência de כִּי pode indicar a causa que motiva o furto. «Porque» torna clara essa relação; a leitura circunstancial «quando» permanece registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação proverbial impessoal evita especificar um sujeito ausente no hebraico. «Faminto» evita a repetição imediata de «fome» sem elevar excessivamente o registro.
