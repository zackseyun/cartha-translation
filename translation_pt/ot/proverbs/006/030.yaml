  source_fidelity: 'A tradução capta o sentido geral do provérbio: a avaliação social de um ladrão que rouba por necessidade de alimento. Contudo, «porque está faminto» torna a segunda ocorrência de כִּי inequivocamente causal e, junto de «saciar a própria fome», produz uma redundância mais forte do que a do hebraico. A formulação principal deve conservar a leitura circunstancial, com a causal registrada como alternativa.'
  naturalness: «Não se despreza o ladrão» é compreensível, mas «As pessoas não desprezam um ladrão» expressa de modo mais direto e natural o plural genérico hebraico em português moderno. «Saciar o apetite» é idiomático e evita identificar נֶפֶשׁ diretamente com «fome».
  terminology: «Ladrão» e «desprezar» correspondem bem a גַּנָּב e בוז. «Apetite» representa adequadamente a possibilidade contextual de נֶפֶשׁ, enquanto a nota mantém as alternativas literais e semânticas.
