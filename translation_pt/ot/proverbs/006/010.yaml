base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/010.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: pt
  text: Um pouco de sono[a], um pouco de cochilo, um pouco de cruzar as mãos para se deitar —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “sonos”, no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט
  choice: um pouco de
  rationale: A repetição tripla foi mantida para preservar o ritmo insistente e proverbial do hebraico.
- source_word: שֵׁנוֹת
  choice: sono
  rationale: Embora a forma hebraica seja plural, o substantivo coletivo no singular é a expressão natural em português.
- source_word: תְּנוּמוֹת
  choice: cochilo
  rationale: Distingue um sono leve ou breve do termo anterior e mantém o paralelismo em linguagem corrente.
- source_word: חִבֻּק יָדַיִם
  choice: cruzar as mãos
  rationale: Reproduz de modo compreensível a imagem hebraica, literalmente um 'abraço das mãos', que neste contexto sugere uma postura de repouso e inatividade.
- source_word: לִשְׁכָּב
  choice: para se deitar
  rationale: Mantém o sentido concreto do infinitivo hebraico e sua provável relação de finalidade com a postura das mãos.
