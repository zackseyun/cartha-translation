  text: Can a man walk on coals and his feet not be scorched?[a]
translation:
  language: pt
  text: Pode um homem andar sobre brasas sem que seus pés se queimem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se um homem andar sobre brasas, seus pés não se queimarão?” O hebraico começa com אִם (“se”), que aqui introduz uma pergunta retórica em paralelo com o versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Pode
  rationale: Embora אִם normalmente signifique “se”, aqui introduz uma pergunta retórica em paralelo com o versículo anterior. “Pode” comunica essa força com naturalidade em português.
- source_word: יְהַלֵּךְ
  choice: andar
  rationale: O verbo הלך descreve caminhar ou mover-se; “andar” é a opção mais natural na imagem proverbial.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo hebraico está no masculino singular e retrata um indivíduo genérico no contexto da instrução dirigida ao homem.
- source_word: עַל הַגֶּחָלִים
  choice: sobre brasas
  rationale: A preposição indica contato com a superfície, e גֶּחָלִים designa carvões em brasa ou brasas.
- source_word: וְרַגְלָיו
  choice: os pés
  rationale: O hebraico diz literalmente “e os pés dele”; a construção portuguesa com “sem queimar os pés” preserva o referente e soa mais natural.
- source_word: לֹא תִכָּוֶינָה
  choice: sem queimar
  rationale: A forma passiva de כוה significa “ser queimado”. Na pergunta com “pode”, a construção “sem queimar” expressa de modo idiomático o resultado negado, sem alterar a força retórica.
