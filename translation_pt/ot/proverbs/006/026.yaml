  text: For because of a prostitute one is reduced to a loaf of bread[c][b][a], but a married woman hunts a precious life.
translation:
  language: pt
  text: Pois, por causa de uma prostituta, alguém fica reduzido a viver com um simples pão;[a] mas a esposa de outro homem[b] caça uma vida preciosa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois, por causa de uma prostituta, até um pão”. O hebraico é conciso e elíptico; muitos entendem que a primeira linha descreve alguém sendo reduzido à pobreza.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a esposa de um homem”; neste contexto, refere-se à esposa de outro homem, numa relação adúltera.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma alma preciosa”. A palavra hebraica pode significar “alma”, “pessoa” ou “vida”; neste contexto de advertência, “vida” parece ajustar-se melhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência anterior de modo natural em português, sem a redundância pouco idiomática de uma reprodução literal.
- source_word: בְעַד אִשָּׁה זוֹנָה
  choice: por causa de uma prostituta
  rationale: Expressa o valor causal de בְעַד e traduz זוֹנָה com um termo moderno, claro e não arcaico.
- source_word: עַד כִּכַּר לָחֶם
  choice: fica reduzido a um pedaço de pão
  rationale: A construção hebraica é elíptica e comprimida. A tradução comunica a interpretação contextual comum de empobrecimento, preservando a imagem do pão e registrando a literalidade em nota.
- source_word: וְאֵשֶׁת אִישׁ
  choice: mas a mulher de outro homem
  rationale: Preserva mais de perto o sentido literal de 'mulher/esposa de um homem' e, no contexto da advertência contra o adultério, deixa claro que se trata da esposa alheia. 'Mas' explicita o contraste contextual indicado pela coordenação.
- source_word: נֶפֶשׁ יְקָרָה
  choice: uma vida preciosa
  rationale: נֶפֶשׁ pode significar alma, pessoa ou vida; aqui 'vida' se ajusta à ameaça de ruína total ou mortal sem eliminar a alternativa lexical, indicada em nota.
- source_word: תָצוּד
  choice: caça
  rationale: Mantém a metáfora vívida de perseguir ou capturar uma presa e concorda com o sujeito feminino singular.
