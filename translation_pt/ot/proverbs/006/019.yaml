  text: יָפִ֣יחַ כְּ֭זָבִים עֵ֣ד שָׁ֑קֶר וּ/מְשַׁלֵּ֥חַ מְ֝דָנִ֗ים בֵּ֣ין אַחִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/019.yaml
  text: a false witness who breathes out lies[b][a], and one who sends out strife among brothers.
translation:
  language: pt
  text: a testemunha falsa que exala mentiras[a] e quem espalha contendas entre irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma testemunha mentirosa que profere falsidades”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “entre irmãos”; a expressão pode se referir literalmente a irmãos ou, de modo mais amplo, a membros próximos de uma comunidade.'
    reason: cultural_note
lexical_decisions:
- source_word: יָפִיחַ
  choice: exala
  rationale: Preserva a imagem vívida do hifil de פוח, literalmente relacionado a fazer sair o sopro, e comunica de modo natural a ideia de proferir continuamente ou fazer sair palavras.
- source_word: כְּזָבִים
  choice: mentiras
  rationale: Equivalente moderno, direto e moralmente claro para o plural que designa falsidades ou enganos.
- source_word: עֵד שָׁקֶר
  choice: a testemunha falsa
  rationale: Expressão jurídica e moral corrente em português, correspondente à construção hebraica 'testemunha de falsidade'.
- source_word: וּמְשַׁלֵּחַ
  choice: e quem espalha
  rationale: O particípio de שלח significa literalmente 'enviar' ou 'soltar'; com 'contendas', 'espalha' transmite naturalmente a ação de disseminar conflitos sem recorrer ao menos literal 'semeia'.
- source_word: מְדָנִים
  choice: contendas
  rationale: Termo digno e compreensível que expressa disputas, conflitos e desavenças, mantendo o peso característico da literatura sapiencial.
- source_word: בֵּין אַחִים
  choice: entre irmãos
  rationale: Reproduz de perto a expressão hebraica e conserva o substantivo masculino plural, que pode indicar irmãos literais ou, em sentido mais amplo, membros próximos de uma comunidade.
theological_decisions:
- issue: Alcance do termo relacional אַחִים
  choice: irmãos
  alternative: irmãos e irmãs; parentes; membros da comunidade
  rationale: O hebraico emprega o masculino plural 'irmãos'. A tradução preserva essa forma e sua textura social, enquanto a nota registra que o uso pode abranger uma comunidade mais ampla sem impor essa leitura no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Exala mentiras” conserva a metáfora hebraica; “espalha contendas” comunica de forma idiomática o ato de fazer o conflito circular. A redação mantém a estrutura de item enumerado do contexto de Provérbios 6:16–19.
