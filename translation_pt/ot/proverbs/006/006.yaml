  text: לֵֽךְ אֶל נְמָלָ֥ה עָצֵ֑ל רְאֵ֖ה דְרָכֶ֣י/הָ וַ/חֲכָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/006.yaml
  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
translation:
  language: pt
  text: Vá até a formiga, preguiçoso; observe os caminhos dela e torne-se sábio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל
  choice: Vá até
  rationale: O imperativo de הלך com אֶל expressa movimento em direção à formiga. “Vá até” é natural em português e mantém a exortação direta.
- source_word: נְמָלָה
  choice: a formiga
  rationale: O singular com artigo apresenta a formiga como exemplo representativo de sua espécie, uso natural também em português.
- source_word: עָצֵל
  choice: preguiçoso
  rationale: O substantivo/adjetivo masculino singular funciona como vocativo e repreende diretamente a pessoa dominada pela preguiça. “Preguiçoso” é claro, corrente e incisivo.
- source_word: רְאֵה
  choice: observe
  rationale: Embora o sentido básico seja “ver”, neste contexto sapiencial o imperativo pede atenção cuidadosa com a finalidade de aprender. “Observe” preserva tanto a percepção quanto a reflexão.
- source_word: דְרָכֶיהָ
  choice: os caminhos dela
  rationale: O plural de דֶּרֶךְ pode indicar modos de agir ou padrões de conduta. “Caminhos” mantém a imagem recorrente da literatura sapiencial, enquanto “dela” reproduz sem artificialidade o sufixo feminino referente à formiga.
- source_word: וַחֲכָם
  choice: e torne-se sábio
  rationale: A forma imperativa conclama o destinatário a adquirir sabedoria como resultado da observação. “Torne-se sábio” comunica melhor esse movimento do que a formulação possivelmente estática “seja sábio”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocativo direto. A imagem dos “caminhos” foi preservada por sua importância sapiencial e por ser compreensível no contexto. Não são necessárias notas, pois a concordância feminina pode ser expressa naturalmente por “dela”.
