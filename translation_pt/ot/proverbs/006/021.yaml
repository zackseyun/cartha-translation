  text: Bind them on your heart continually[b][a]; tie them around your neck.
translation:
  language: pt
  text: Amarre-os sempre ao coração; prenda-os ao redor do pescoço.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “use-os como adorno ao redor do pescoço”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Amarre-os
  rationale: O imperativo qal com sufixo de terceira pessoa do plural expressa a ação concreta de atar; “amarre-os” preserva a metáfora e soa natural em português.
- source_word: לִבְּךָ
  choice: ao coração
  rationale: Embora לֵב possa abranger pensamento, vontade e interioridade, “coração” mantém a imagem antropológica hebraica e é transparente no contexto.
- source_word: תָמִיד
  choice: sempre
  rationale: O advérbio indica constância contínua ou habitual; “sempre” é corrente, conciso e preserva essa abrangência.
- source_word: עָנְדֵם
  choice: prenda-os
  rationale: O verbo descreve pôr ou fixar algo como ornamento. “Prenda-os” distingue esta ação da anterior sem eliminar a imagem concreta; também pode implicar usá-los como adorno.
- source_word: גַּרְגְּרֹתֶךָ
  choice: pescoço
  rationale: Neste contexto, refere-se à região onde se prende ou usa um ornamento; “pescoço” é o equivalente idiomático mais natural.
