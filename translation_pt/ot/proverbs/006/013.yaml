  text: winking with his eyes[a], signaling with his feet[b], pointing with his fingers.
translation:
  language: pt
  text: pisca os olhos, faz sinais com o pé[a] e aponta com os dedos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «arrasta/raspa o pé»; o verbo hebraico מֹלֵל é raro, e o gesto exato é incerto. Neste contexto, indica alguma forma de sinal dissimulado feito com o pé.
    reason: lexical_alternative
  - marker: b
    text: Ou «orienta com os dedos». O verbo também pode significar «ensinar» ou «dirigir», mas aqui o contexto favorece um gesto físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ
  choice: pisca
  rationale: O particípio descreve um gesto furtivo com os olhos, provavelmente usado para transmitir uma intenção oculta; «pisca» é natural e preserva a ação concreta.
- source_word: בְּעֵינָיו
  choice: os olhos
  rationale: O substantivo hebraico está no plural com sufixo de terceira pessoa masculina; em português, «pisca os olhos» expressa naturalmente o gesto.
- source_word: מֹלֵל
  choice: faz sinais
  rationale: O verbo é raro e seu gesto exato é incerto. O paralelismo com olhos e dedos indica comunicação corporal dissimulada; «faz sinais» preserva essa ideia sem definir um movimento específico.
- source_word: בְּרַגְלוֹ
  choice: com o pé
  rationale: O hebraico apresenta o substantivo no singular; a tradução o preserva, mantendo uma formulação natural em português.
- source_word: מֹרֶה
  choice: aponta
  rationale: Embora o verbo possa significar «ensinar» ou «dirigir», a sequência de gestos corporais favorece o sentido físico de apontar ou indicar.
- source_word: בְּאֶצְבְּעֹתָיו
  choice: com os dedos
  rationale: O plural hebraico refere-se diretamente aos dedos como meio pelo qual se faz o gesto.
