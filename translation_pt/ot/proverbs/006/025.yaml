  naturalness: A redação é clara e concisa. «Não deseje, em seu coração, a beleza dela» torna a relação sintática mais fluente em português. «Nem deixe que ela o prenda com seus cílios» é natural em registro poético-sapiencial e evita a abstração adicional de «olhares».
