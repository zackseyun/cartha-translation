  text: Do not desire her beauty in your heart[b][a], and do not let yourself be captured by her eyelashes.
translation:
  language: pt
  text: Não deseje, em seu coração, a beleza dela[a], nem deixe que ela o prenda com seus cílios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não cobice, em seu coração, a beleza dela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não deixe que ela o tome com suas pálpebras”; o termo também pode referir-se aos cílios. A imagem é a de um apelo sedutor pelos olhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  choice: deseje
  rationale: חמד expressa desejar ou cobiçar. “Deseje” preserva aqui o sentido amplo de desejo interior sem impor de modo excessivo a conotação jurídica de “cobiçar” nem explicitar o sentido sexual além do hebraico.
- source_word: יָפְיָהּ
  choice: a beleza dela
  rationale: יֹפִי significa beleza ou formosura; “a beleza dela” é direto, natural e claro em português moderno.
- source_word: בִּלְבָבֶךָ
  choice: no coração
  rationale: לֵבָב designa a interioridade, incluindo desejos e intenções. “No coração” conserva a imagem antropológica hebraica e evidencia o caráter interior da advertência.
- source_word: תִּקָּחֲךָ
  choice: se deixe prender
  rationale: לקח significa literalmente “tomar”; nesta construção, comunica ser apanhado ou dominado pelo poder de sedução. “Se deixe prender” reproduz a advertência e o resultado figurado com naturalidade.
- source_word: בְּעַפְעַפֶּיהָ
  choice: pelos olhares dela
  rationale: עַפְעַף denota pálpebra ou cílio, mas no contexto representa o recurso visual de sedução. “Pelos olhares dela” comunica naturalmente em português a força da imagem, enquanto a nota preserva sua forma concreta.
