base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
translation:
  language: pt
  text: 'Faça isto, então, meu filho, e livre-se, pois você está nas mãos do seu próximo[a]: vá, humilhe-se[b] e insista com os seus amigos.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na palma da mão do seu próximo”, isto é, sob o poder ou controle dele.
    reason: lexical_alternative
  - marker: b
    text: Ou “prostrar-se” ou “submeter-se”. O verbo hebraico é raro e pode indicar o ato de se rebaixar, possivelmente até se lançar ao chão.
    reason: lexical_alternative
  - marker: c
    text: O texto hebraico traz “seus amigos” no plural, embora muitos entendam que o sentido seja singular — “seu próximo” ou “seu amigo” — em harmonia com a expressão anterior.
    reason: textual_variant
lexical_decisions:
- source_word: עֲשֵׂה זֹאת אֵפוֹא
  choice: Faça isto, então
  rationale: Mantém o imperativo direto e representa אֵפוֹא como partícula de conclusão e urgência, sem acrescentar conteúdo.
- source_word: בְּנִי
  choice: meu filho
  rationale: Preserva o vocativo masculino singular característico da instrução sapiencial.
- source_word: וְהִנָּצֵל
  choice: e livre-se
  rationale: Expressa de modo natural a força reflexiva do imperativo nifal, isto é, escapar da situação ou desvencilhar-se dela.
- source_word: כִּי בָאתָ בְכַף רֵעֶךָ
  choice: pois você ficou nas mãos do seu próximo
  rationale: כִּי introduz a razão da ordem; a formulação portuguesa comunica o estado resultante de estar sob o poder de alguém. O plural idiomático “nas mãos” soa natural, enquanto a imagem hebraica literal é esclarecida em nota.
- source_word: לֵךְ הִתְרַפֵּס
  choice: vá, humilhe-se
  rationale: O verbo raro הִתְרַפֵּס provavelmente descreve rebaixar-se ou prostrar-se diante de alguém. “Humilhe-se” preserva a postura social sem determinar se há um gesto físico.
- source_word: וּרְהַב רֵעֶיךָ
  choice: e insista com os seus amigos
  rationale: רהב, neste contexto, sugere ação insistente ou importuna. רֵעֶיךָ é formalmente plural no texto massorético; “amigos” comunica o campo semântico de רֵעַ de maneira mais natural em português do que o plural isolado “próximos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita arcaísmo; “próximo” preserva o vocabulário relacional sapiencial no singular, enquanto “amigos” torna natural o plural formalmente presente no texto massorético.
