review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de imperativos, o vocativo masculino singular e a distinção entre o singular «seu próximo» e o plural massorético «seus amigos». «Nas mãos» é uma boa expressão idiomática para a condição de estar no poder de alguém, desde que a nota mantenha a imagem concreta de «palma». Contudo, «você ficou» não representa bem o perfeito hebraico como estado resultante; «você está» comunica com mais precisão a situação presente pressuposta pela exortação.
  naturalness: O português é claro, moderno e apropriado ao registro sapiencial. «Humilhe-se» e «insista com os seus amigos» são naturais. A correção das formas citadas na nota b é necessária para que a nota seja gramatical e não confunda o leitor.
  terminology: «Meu filho», «próximo» e «amigos» são escolhas adequadas. A manutenção de «amigos» no plural principal, com nota sobre a provável referência singular, respeita a forma do texto massorético sem resolver indevidamente a dificuldade.
  issues:
  - severity: medium
    issue: «você ficou nas mãos do seu próximo»
    rationale: «Ficou» tende a significar permanência ou resto em português e não exprime naturalmente o perfeito hebraico בָאתָ («você veio/chegou») com seu estado resultante. «Você está nas mãos» preserva a ideia contextual de estar sob o poder do próximo sem introduzir uma nuance inadequada.
  - severity: medium
    issue: 'Formas imperativas incorretas na nota b: «prostrem-se» e «submeta-se»'
    rationale: A nota oferece alternativas para um destinatário singular, mas «prostrem-se» é plural. Como alternativas lexicais, devem ser dadas em forma de infinitivo («prostrar-se», «submeter-se») ou, se imperativas, ambas no singular.
