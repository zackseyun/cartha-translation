  text: וּ/בָֽא כִ/מְהַלֵּ֥ךְ רֵאשֶׁ֑/ךָ וּ֝/מַחְסֹֽרְ/ךָ֗ כְּ/אִ֣ישׁ מָגֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/011.yaml
  text: and your poverty will come like a prowler[b][a], and your lack like an armed man.
translation:
  language: pt
  text: e a sua pobreza virá como um andarilho[a], e a sua necessidade, como um homem armado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “como alguém que anda de um lado para outro”.
    reason: lexical_alternative
  - marker: b
    text: Ou, “como um homem com escudo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: e ... virá
  rationale: O perfeito qal, nesta sequência proverbial, tem força resultativa ou futura; “virá” expressa naturalmente a consequência da preguiça.
- source_word: כִמְהַלֵּךְ
  choice: como um andarilho
  rationale: O particípio de הלך designa literalmente alguém que anda ou perambula. “Andarilho” preserva essa imagem sem acrescentar necessariamente a ideia de furtividade contida em “espreitador”.
- source_word: רֵאשֶׁךָ
  choice: a sua pobreza
  rationale: O substantivo com sufixo de segunda pessoa masculina singular indica pobreza ou indigência; “pobreza” é claro e natural em português.
- source_word: וּמַחְסֹרְךָ
  choice: e a sua necessidade
  rationale: מַחְסוֹר indica carência, falta ou necessidade. “Necessidade” mantém o paralelismo com “pobreza” e evita a formulação menos natural “a sua falta”.
- source_word: כְּאִישׁ מָגֵן
  choice: como um homem armado
  rationale: Literalmente, a expressão pode ser entendida como “um homem com escudo”; no contexto, retrata uma figura equipada e ameaçadora. A tradução corrente fica no texto, e a forma mais literal é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. A repetição de “a sua” mantém explícitos os dois membros paralelos. As notas preservam as alternativas mais literais e a ambiguidade das imagens hebraicas.
