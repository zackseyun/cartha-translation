  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
translation:
  language: pt
  text: 'Há seis coisas que Yahweh odeia, e sete são abominações para ele[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sete abominações para sua alma”, isto é, sete coisas que lhe são profundamente repugnantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁשׁ הֵנָּה
  choice: Há seis coisas
  rationale: A construção hebraica introduz um provérbio numérico. Em português, a forma existencial explicita naturalmente os itens que serão enumerados.
- source_word: שָׂנֵא
  choice: odeia
  rationale: Traduz diretamente a forte aversão expressa pelo verbo, sem suavizá-la.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְשֶׁבַע
  choice: sete
  rationale: Mantém a fórmula poética numérica seis/sete, na qual o segundo número intensifica e completa o primeiro.
- source_word: תועבות
  choice: que são uma abominação
  rationale: Comunica a ideia plural de coisas profundamente repugnantes por meio de uma construção idiomática e forte em português.
- source_word: נַפְשׁוֹ
  choice: para ele
  rationale: נֶפֶשׁ designa aqui idiomaticamente a própria pessoa. A tradução evita impor uma distinção antropológica entre corpo e alma, enquanto a forma literal é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal divino, sem substituí-lo por um título.
- issue: Expressão antropomórfica “abominações de/para sua alma”
  choice: sete que são uma abominação para ele
  alternative: sete abominações para a sua alma; sete que a sua alma detesta
  rationale: A expressão hebraica usa נֶפֶשׁ no sentido idiomático da própria pessoa. A redação escolhida comunica esse sentido com naturalidade, e a nota conserva a forma mais literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A cadência “seis... sete” e os dois-pontos preservam a forma do provérbio numérico e introduzem a lista dos versículos seguintes.
