lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressão interrogativa idiomática de duração; em português, “Até quando” preserva de modo natural o tom de repreensão.
- source_word: עָצֵל
  choice: preguiçoso
  rationale: Designa em Provérbios a pessoa caracterizada pela preguiça. “Preguiçoso” é corrente, direto e mantém o masculino singular representativo do hebraico.
- source_word: תִּשְׁכָּב
  choice: você ficará deitado
  rationale: O verbo significa “deitar-se/estar deitado”; no contexto, a construção expressa a permanência na cama e combina naturalmente com “Até quando”.
- source_word: מָתַי
  choice: Quando
  rationale: Reproduz diretamente o advérbio interrogativo que introduz a segunda pergunta.
- source_word: תָּקוּם
  choice: se levantará
  rationale: Equivalente natural de “levantar-se/erguer-se” no contexto de despertar e sair da cama.
- source_word: מִשְּׁנָתֶךָ
  choice: do seu sono
  rationale: Traduz diretamente o substantivo “sono” com o sufixo de segunda pessoa masculina singular.
