base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/014.yaml
  text: Perversity is in his heart[a]; he devises evil at all times; he sends out strife.
translation:
  language: pt
  text: Há perversidade em seu coração; ele trama o mal em todo tempo e envia discórdias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «espalha discórdias». O hebraico diz literalmente «envia discórdias», expressão que pode indicar causar ou difundir conflitos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהְפֻּכוֹת
  choice: perversidade
  rationale: O plural abstrato hebraico expressa desvio ou torção moral; «perversidade» preserva esse sentido de modo natural e digno em português.
- source_word: בְּלִבּוֹ
  choice: no seu coração
  rationale: A locução preposicional funciona como predicado de uma oração sem verbo; «há» torna a construção natural em português e mantém o coração como sede da disposição interior.
- source_word: חֹרֵשׁ רָע
  choice: ele trama o mal
  rationale: Embora חֹרֵשׁ possa significar literalmente «arar», aqui é usado de modo figurado para planejar ou maquinar. «Trama» comunica a ação deliberada e maliciosa.
- source_word: בְּכָל עֵת
  choice: o tempo todo
  rationale: A expressão indica conduta habitual e contínua. «O tempo todo» é uma formulação corrente e fiel ao sentido.
- source_word: מְדָנִים
  choice: discórdias
  rationale: O substantivo plural designa contendas e conflitos; «discórdias» preserva o plural e combina naturalmente com a ideia de espalhá-las.
- source_word: יְשַׁלֵּחַ
  choice: semeia
  rationale: O Piel de שלח significa literalmente «envia» ou «espalha». Com «discórdias», «semeia» reproduz de maneira idiomática em português o ato de causar e difundir conflitos, embora seja uma tradução interpretativa.
