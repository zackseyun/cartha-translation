  text: הֲ/יַחְתֶּ֤ה אִ֓ישׁ אֵ֬שׁ בְּ/חֵיק֑/וֹ וּ֝/בְגָדָ֗י/ו לֹ֣א תִשָּׂרַֽפְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/027.yaml
  text: Can a man carry fire in his bosom and his clothes not be burned?[a]
translation:
  language: pt
  text: Pode um homem carregar fogo junto ao peito[a] sem que suas roupas se queimem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no colo” ou “na dobra da roupa”; o hebraico se refere à região do peito ou colo, onde algo podia ser mantido bem perto do corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  choice: carregar
  rationale: O verbo חתה pode indicar apanhar ou recolher brasas/fogo. No contexto, a imagem é a de tomar o fogo e mantê-lo junto ao corpo; “carregar” expressa isso com naturalidade.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo é masculino singular e, neste provérbio, tem sentido genérico. A tradução conserva a forma concreta da imagem hebraica.
- source_word: אֵשׁ
  choice: fogo
  rationale: Equivalente direto e natural.
- source_word: בְּחֵיקוֹ
  choice: junto ao peito
  rationale: חֵיק designa a região do peito ou colo, inclusive a dobra da roupa onde algo podia ser levado bem perto do corpo. “Junto ao peito” é claro e atual, sem limitar indevidamente a imagem ao colo.
- source_word: וּבְגָדָיו
  choice: suas roupas
  rationale: “Roupas” é o equivalente moderno e natural do plural בְּגָדִים.
- source_word: לֹא תִשָּׂרַפְנָה
  choice: sem que suas roupas se queimem
  rationale: A forma verbal apresenta as roupas sofrendo a ação do fogo. A construção mantém o caráter retórico da pergunta e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial natural. “Junto ao peito” evita o tom arcaico de “no seio” e preserva a proximidade corporal expressa pelo hebraico.
