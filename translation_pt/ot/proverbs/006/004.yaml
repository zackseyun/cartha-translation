  text: אַל תִּתֵּ֣ן שֵׁנָ֣ה לְ/עֵינֶ֑י/ךָ וּ֝/תְנוּמָ֗ה לְ/עַפְעַפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/004.yaml
  text: Do not give sleep to your eyes[a], nor slumber to your eyelids.
translation:
  language: pt
  text: Não dê sono aos seus olhos, nem cochilo[a] às suas pálpebras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sonolência”. O termo hebraico indica sono leve ou o ato de cochilar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Não dê
  rationale: אַל com a forma verbal seguinte expressa uma proibição. “Não dê” conserva de modo natural a imagem concreta do hebraico, sem acrescentar ênfase.
- source_word: שֵׁנָה
  choice: sono
  rationale: É o sentido comum do substantivo e mantém o primeiro elemento do paralelismo poético.
- source_word: לְעֵינֶיךָ
  choice: aos seus olhos
  rationale: A preposição marca o destinatário na expressão hebraica “dar sono aos olhos”; a formulação preserva essa imagem e é compreensível em português.
- source_word: וּתְנוּמָה
  choice: nem cochilo
  rationale: No paralelismo negativo, a conjunção é expressa naturalmente por “nem”. “Cochilo” distingue o sono leve do termo mais geral “sono”.
- source_word: לְעַפְעַפֶּיךָ
  choice: às suas pálpebras
  rationale: עַפְעַף designa as pálpebras. A tradução direta conserva o paralelismo entre partes do corpo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” implícito nas formas “seus/suas”. A construção concreta “dar sono aos olhos” foi preservada por seu valor poético e por permanecer inteligível em português.
