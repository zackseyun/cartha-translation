  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
translation:
  language: pt
  text: prepara no verão o seu alimento[a] e ajunta na colheita a sua provisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o seu pão”; aqui, provavelmente no sentido mais amplo de alimento ou sustento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: prepara
  rationale: O hifil de כון expressa aqui a ideia de deixar pronto ou preparar; “prepara” é natural em português e mantém o paralelismo com “ajunta”.
- source_word: בַּקַּיִץ
  choice: no verão
  rationale: A preposição בְּ com o substantivo definido indica o período em que ocorre a ação; “no verão” é a forma corrente e concisa em português.
- source_word: לַחְמָהּ
  choice: o seu alimento
  rationale: Embora לֶחֶם possa significar literalmente “pão”, também designa alimento ou sustento em sentido amplo. Como o referente é a formiga, “alimento” comunica melhor o sentido contextual.
- source_word: אָגְרָה
  choice: ajunta
  rationale: O verbo אגר indica reunir ou recolher, frequentemente com a noção contextual de armazenar. “Ajunta” preserva a ação concreta sem tornar explícito além do necessário o armazenamento.
- source_word: בַקָּצִיר
  choice: na colheita
  rationale: O termo designa a colheita ou a época da colheita; “na colheita” preserva a concisão e a possível referência tanto à atividade quanto ao período.
- source_word: מַאֲכָלָהּ
  choice: a sua provisão
  rationale: מַאֲכָל designa aquilo que se come. “Provisão” distingue discretamente este termo de לַחְמָהּ e combina com a ideia de alimento reunido para uso futuro.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e o paralelismo dos dois membros hebraicos foram preservados. Não se acrescentou uma nota equivalente à nota inglesa b, pois o hebraico distribui claramente as ações: preparar no verão e ajuntar na colheita; transferir “seu alimento” para o segundo membro não representa adequadamente a sintaxe do texto massorético.'
