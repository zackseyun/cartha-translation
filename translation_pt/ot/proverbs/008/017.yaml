base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/017.yaml
  text: I love those who love me[a], and those who seek me diligently find me.
translation:
  language: pt
  text: Eu amo os que me amam, e os que me buscam com dedicação[a] me encontram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que me buscam cedo me encontram”. O verbo hebraico pode indicar buscar logo cedo e, por extensão, buscar com empenho ou dedicação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Eu
  rationale: O pronome de primeira pessoa aparece explicitamente no início da oração hebraica e foi mantido para preservar sua ênfase.
- source_word: אֹהֲבַי / אהבי/ה
  choice: os que me amam
  rationale: O particípio com sufixo de primeira pessoa funciona como substantivo. A oração relativa é natural em português e evita as conotações inadequadas de “meus amantes”.
- source_word: אֵהָב
  choice: amo
  rationale: O imperfeito qal tem aqui valor habitual ou gnômico; o presente exprime naturalmente a verdade geral formulada pelo provérbio.
- source_word: מְשַׁחֲרַי
  choice: os que me buscam com dedicação
  rationale: O particípio piel de שׁחר pode indicar buscar cedo e, por extensão, buscar com empenho. “Com dedicação” comunica essa intensidade em português corrente, enquanto o sentido temporal mais literal é preservado em nota.
- source_word: יִמְצָאֻנְנִי
  choice: me encontram
  rationale: O presente gnômico mantém o paralelismo com a primeira oração e comunica uma verdade geral de modo natural em português.
theological_decisions:
- issue: Linguagem recíproca do amor da Sabedoria
  choice: Apresentar a afirmação como princípio geral de reciprocidade na fala poética da Sabedoria personificada.
  alternative: Interpretá-la no texto principal como eleição salvífica, favoritismo de aliança ou referência cristológica direta.
  rationale: Em Provérbios 8, a Sabedoria personificada declara sua disposição favorável para com quem a ama e busca. A tradução preserva essa linguagem literária e teológica sem acrescentar categorias doutrinárias que o hebraico não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Com dedicação” evita uma formulação excessivamente técnica e conserva a ideia de busca empenhada; a alternativa literal ligada a “cedo” aparece na nota.
