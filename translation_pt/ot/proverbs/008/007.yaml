base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/007.yaml
  text: For my mouth will utter truth[a], and wickedness is an abomination to my lips.
translation:
  language: pt
  text: Pois a minha boca profere a verdade[a], e a maldade é uma abominação para os meus lábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o meu palato profere a verdade”. Aqui, “palato” é uma figura para o órgão da fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta o apelo anterior da Sabedoria, com naturalidade em português.
- source_word: אֱמֶת
  choice: a verdade
  rationale: No contexto da fala, designa aquilo que é verdadeiro; a formulação concisa preserva o contraste ético com רֶשַׁע.
- source_word: יֶהְגֶּה
  choice: profere
  rationale: Com o paladar como sujeito e a verdade como objeto, o verbo indica expressão vocal, não meditação silenciosa; “profere” conserva o caráter deliberado e o registro digno.
- source_word: חִכִּי
  choice: o meu paladar
  rationale: Mantém a imagem concreta do hebraico, em que o paladar funciona metonimicamente como órgão da fala; a nota esclarece seu sentido.
- source_word: וְתוֹעֲבַת
  choice: e ... é abominável
  rationale: Expressa forte repulsa moral sem enfraquecer o substantivo hebraico תּוֹעֵבָה.
- source_word: שְׂפָתַי
  choice: para os meus lábios
  rationale: Preserva a metáfora corporal e comunica que tal conteúdo é incompatível com a fala da Sabedoria.
- source_word: רֶשַׁע
  choice: a maldade
  rationale: Termo corrente e moralmente claro para a conduta ou expressão perversa, em contraste com a verdade.
