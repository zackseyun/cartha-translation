source:
  edition: WLC
  text: כֻּלָּ֣/ם נְ֭כֹחִים לַ/מֵּבִ֑ין וִֽ֝/ישָׁרִ֗ים לְ/מֹ֣צְאֵי דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/009.yaml
  text: All of them are straightforward to the one who understands[a], and upright to those who find knowledge.
translation:
  language: pt
  text: Todas elas são claras para quem tem entendimento[a] e retas para os que encontram conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diretas” ou “corretas”. O hebraico ressalta que as palavras da sabedoria não são tortuosas para quem discerne.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todas elas
  rationale: Retoma as palavras ou declarações da sabedoria nos versículos anteriores e preserva a abrangência de כֹּל; o feminino concorda naturalmente com “palavras”, subentendido pelo contexto.
- source_word: נְכֹחִים
  choice: claras
  rationale: No contexto da fala, o termo descreve palavras diretas, francas ou sem tortuosidade. “Claras” é natural em português e mantém a ideia de que são compreensíveis para quem discerne.
- source_word: לַמֵּבִין
  choice: para quem tem entendimento
  rationale: Reproduz a relação marcada por לְ e o valor substantivado do particípio de בין, sem introduzir especificação masculina desnecessária.
- source_word: וִישָׁרִים
  choice: e retas
  rationale: Preserva a imagem paralela do que é reto, correto e não tortuoso, sem reduzir o termo apenas a uma avaliação moral abstrata.
- source_word: לְמֹצְאֵי
  choice: para os que encontram
  rationale: 'Mantém o caráter ativo e experiencial do particípio plural: pessoas que chegam a encontrar ou adquirir conhecimento.'
- source_word: דָעַת
  choice: conhecimento
  rationale: É o equivalente usual de דַּעַת e conserva a distinção lexical em relação ao entendimento expresso anteriormente por בין.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação preserva o paralelismo hebraico entre “claras” e “retas”, bem como entre “entendimento” e “conhecimento”.
