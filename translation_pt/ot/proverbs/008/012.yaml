  text: I[a], wisdom, dwell with prudence, and I find knowledge and discretion.
translation:
  language: pt
  text: Eu, a sabedoria, habito com a prudência e encontro conhecimento de planos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho habitado com a prudência”. O hebraico também permite esse valor verbal. A palavra traduzida como “planos” também pode significar “desígnios”, “estratagemas” ou, neste contexto, “bom senso” e “discernimento”.'
    reason: Alternativas lexicais de מְזִמּוֹת e aspecto verbal de שָׁכַנְתִּי.
lexical_decisions:
- source_word: חָכְמָה
  choice: sabedoria
  rationale: O substantivo significa “sabedoria”. A forma minúscula mantém a personificação poética sem transformá-la necessariamente em nome próprio.
- source_word: שָׁכַנְתִּי
  choice: habito
  rationale: O verbo שׁכן expressa morar ou residir. O presente comunica naturalmente a afirmação geral da sabedoria personificada, embora a forma hebraica também admita valor perfeito.
- source_word: עָרְמָה
  choice: prudência
  rationale: Em Provérbios, o termo tem sentido positivo de sagacidade prática e cautelosa, não de astúcia enganosa.
- source_word: דַעַת
  choice: conhecimento
  rationale: É a correspondência corrente do substantivo e o mantém distinto de “sabedoria”.
- source_word: מְזִמּוֹת
  choice: discernimento
  rationale: No contexto positivo da literatura sapiencial, comunica a capacidade de ponderar e formular decisões sensatas; a nota registra os sentidos alternativos ligados a planos e projetos.
- source_word: אֶמְצָא
  choice: encontro
  rationale: Preserva o sentido básico de מצא e a imagem simples do hebraico sem explicitação interpretativa.
- source_word: וְ
  choice: e
  rationale: Reproduz de modo natural a ligação entre as duas afirmações poéticas.
theological_decisions:
- issue: Personificação da sabedoria
  choice: Apresentar a sabedoria como a própria voz poética do versículo, sem impor uma identificação doutrinária posterior.
  alternative: Grafar “Sabedoria” como nome próprio ou introduzir linguagem explicitamente cristológica.
  rationale: Provérbios 8 personifica poeticamente a sabedoria. A tradução preserva essa característica literária e teológica, mas não decide uma identificação que o próprio versículo não explicita.
- issue: Relação entre דַעַת e מְזִמּוֹת
  choice: 'Traduzir como dois objetos coordenados: “conhecimento e discernimento”.'
  alternative: 'Entender a expressão como uma relação construta: “conhecimento de planos/projetos”.'
  rationale: A leitura coordenada corresponde bem ao paralelismo positivo e à tradição lexical do contexto, enquanto a nota preserva a possibilidade semântica de “planos” ou “projetos”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Habito” preserva um tom sapiencial sem soar arcaico; “discernimento” evita o possível sentido moderno de reserva pessoal associado a “discrição”.
