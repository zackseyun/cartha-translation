  text: בִּ֭/י שָׂרִ֣ים יָשֹׂ֑רוּ וּ֝/נְדִיבִ֗ים כָּל שֹׁ֥פְטֵי צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/016.yaml
  text: By me rulers rule[a], and nobles, all judges of righteousness.
translation:
  language: pt
  text: Por meio de mim, os governantes governam, e os nobres, todos os que julgam com justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os que julgam com retidão”. O hebraico צֶדֶק pode indicar tanto justiça no âmbito judicial quanto retidão moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Por meu intermédio
  rationale: A preposição ב com o sufixo de primeira pessoa indica aqui meio ou agência na fala da Sabedoria. A expressão comunica de modo natural que o governo é exercido por meio dela, sem sugerir mera localização.
- source_word: שָׂרִים
  choice: os governantes
  rationale: O termo designa príncipes ou altos oficiais. “Governantes” é atual, abrangente e evita restringir o sentido a filhos de reis.
- source_word: יָשֹׂרוּ
  choice: governam
  rationale: O verbo שׂרר significa exercer domínio ou governar. “Governam” preserva o sentido político e a repetição enfática do hebraico entre governantes e governar.
- source_word: וּנְדִיבִים
  choice: também os nobres
  rationale: O substantivo indica pessoas nobres ou líderes de posição elevada. “Nobres” mantém a distinção em relação aos governantes; “também” explicita em português a continuação elíptica do verbo sem alterar o conteúdo.
- source_word: כָּל
  choice: todos
  rationale: O quantificador é mantido explicitamente e introduz a expressão final que especifica ou resume os nobres ligados ao exercício do juízo.
- source_word: שֹׁפְטֵי צֶדֶק
  choice: juízes que fazem justiça
  rationale: A construção hebraica associa os juízes a צֶדֶק. Esta formulação é natural em português e conserva o sentido judicial do contexto sem apagar a possibilidade ética de retidão, registrada em nota.
- source_word: צֶדֶק
  choice: justiça
  rationale: No contexto de juízes e governo, “justiça” é a escolha idiomática mais direta. O termo hebraico também pode expressar retidão moral, alternativa preservada na nota.
theological_decisions:
- issue: A atuação da Sabedoria no exercício da autoridade política
  choice: O versículo afirma que governantes, nobres e juízes exercem corretamente sua função por meio da Sabedoria.
  alternative: Entender a frase como endosso direto, pela Sabedoria, de toda autoridade política e de todo governante.
  rationale: O hebraico apresenta a Sabedoria como meio pelo qual se governa e se julga. A tradução não amplia essa afirmação para uma doutrina sobre a legitimidade moral de toda autoridade existente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula marca as duas metades do verso; “também” torna natural a elipse do verbo na segunda metade. A formulação evita o pouco idiomático “juízes de justiça”, enquanto a nota preserva a amplitude semântica de צֶדֶק.
