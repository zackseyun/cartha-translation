  text: before he had made the earth and the fields[b][a], or the first of the dust of the world.
translation:
  language: pt
  text: antes de ter feito a terra, os campos abertos[a] e a primeira porção do pó do mundo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os lugares abertos”. Em outros contextos, חוּצוֹת pode significar “ruas”, mas o contexto da criação favorece aqui o sentido de campos ou espaços abertos.
    reason: lexical_alternative
  - marker: b
    text: Ou “o princípio do pó do mundo”. A expressão hebraica é compacta e incomum; pode referir-se à primeira porção, ou aos primeiros elementos, do pó primordial do mundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד לֹא
  choice: quando ... ainda não
  rationale: A expressão temporal indica que o fato ainda não havia ocorrido; esta formulação transmite com naturalidade a prioridade temporal no contexto.
- source_word: עָשָׂה
  choice: tinha feito
  rationale: O verbo comum significa “fazer”. O mais-que-perfeito composto combina naturalmente com a construção temporal portuguesa.
- source_word: אֶרֶץ
  choice: a terra
  rationale: No contexto da criação e em paralelo com תֵּבֵל, refere-se à terra em sentido amplo, não a uma região específica.
- source_word: חוּצוֹת
  choice: os campos abertos
  rationale: Embora o termo possa designar ruas em contexto urbano, aqui aponta para espaços exteriores ou extensões abertas; “campos abertos” preserva esse sentido não urbano.
- source_word: וְ
  choice: nem
  rationale: Sob o alcance da negação em “ainda não tinha feito”, a coordenação hebraica é expressa naturalmente em português por “nem”, sem transformar a conjunção em uma alternativa.
- source_word: רֹאשׁ
  choice: o primeiro
  rationale: A expressão compacta parece indicar a primeira ou mais antiga porção do pó primordial; a tradução mantém a formulação incomum do hebraico.
- source_word: עָפְרוֹת
  choice: pó
  rationale: O plural hebraico tem provável valor coletivo e pode designar pó ou solo seco; “pó” conserva a imagem da criação.
- source_word: תֵּבֵל
  choice: mundo
  rationale: O termo designa o mundo ordenado, muitas vezes entendido como mundo habitável; “mundo” é claro e conciso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “quando... ainda não” evita rigidez excessiva, enquanto “o primeiro pó” preserva a estranheza significativa da expressão hebraica.
