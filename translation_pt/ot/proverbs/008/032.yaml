id: PRO.8.32
reference: Proverbs 8:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/אַשְׁרֵ֗י דְּרָכַ֥/י יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/032.yaml
  text: And now[a], sons, listen to me; blessed are those who keep my ways.
translation:
  language: pt
  text: E agora, filhos, escutem-me; felizes os que guardam os meus caminhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «observam os meus caminhos». O verbo hebraico também pode transmitir a ideia de cumprir cuidadosamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que dá continuidade ao discurso quanto o advérbio temporal que introduz a exortação.
- source_word: בָנִים
  choice: filhos
  rationale: Reproduz o plural masculino hebraico e o modo convencional de um mestre dirigir-se aos discípulos na literatura de sabedoria, sem acrescentar o possessivo «meus».
- source_word: שִׁמְעוּ לִי
  choice: escutem-me
  rationale: Expressa de modo natural a ordem de ouvir com atenção, sem explicitar como «obedeçam» uma implicação que o verbo não precisa denotar por si só.
- source_word: וְאַשְׁרֵי
  choice: felizes
  rationale: Traduz a declaração hebraica de condição favorável e plena. «Felizes» é corrente e digna em português, sem atribuir explicitamente a ação de abençoar a um agente não mencionado.
- source_word: דְּרָכַי
  choice: os meus caminhos
  rationale: Mantém a metáfora sapiencial para modos de viver ou de agir.
- source_word: יִשְׁמֹרוּ
  choice: guardam
  rationale: Conserva a ideia de preservar cuidadosamente e também permite, no contexto, a noção de observar na prática.
theological_decisions:
- issue: Tratamento masculino na instrução sapiencial
  choice: filhos
  alternative: crianças; filhos e filhas
  rationale: O texto hebraico emprega o plural masculino «filhos», forma pedagógica típica de Provérbios. A tradução o preserva sem restringir por isso a aplicação da exortação somente a homens.
- issue: Sentido da bem-aventurança אַשְׁרֵי
  choice: felizes
  alternative: bem-aventurados; abençoados
  rationale: A forma declara o estado favorável daqueles que guardam os caminhos da Sabedoria, sem indicar gramaticalmente quem concede esse estado. «Felizes» preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem direta e o imperativo «escutem-me» soam naturais; «filhos» e «caminhos» preservam o registro tradicional da instrução sapiencial.
