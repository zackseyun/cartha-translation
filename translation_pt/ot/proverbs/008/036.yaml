  text: וְֽ֭/חֹטְאִ/י חֹמֵ֣ס נַפְשׁ֑/וֹ כָּל מְ֝שַׂנְאַ֗/י אָ֣הֲבוּ מָֽוֶת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/036.yaml
  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
translation:
  language: pt
  text: Mas quem peca contra mim faz violência à própria vida[a]; todos os que me odeiam amam a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “faz violência à sua própria vida”. O termo hebraico traduzido por “vida” também pode ser traduzido por “alma”, “ser” ou “pessoa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  choice: quem peca contra mim
  rationale: O particípio de חטא com sufixo de primeira pessoa pode expressar errar o alvo, faltar ou pecar contra alguém. No contexto moral da fala da Sabedoria, “peca contra mim” é natural e exato, sem eliminar por completo a ideia de falhar em relação a ela.
- source_word: חֹמֵס
  choice: faz violência
  rationale: O particípio de חמס tem força intensa e pode significar praticar violência, causar dano ou cometer injustiça. A formulação mantém essa força e reproduz de perto a construção hebraica.
- source_word: נַפְשׁוֹ
  choice: à própria vida
  rationale: נפש pode designar vida, pessoa ou ser, além de “alma”. Aqui, com חמס, refere-se ao dano autoinfligido à própria vida ou pessoa; “vida” evita impor uma dicotomia técnica entre corpo e alma.
- source_word: כָּל מְשַׂנְאַי
  choice: todos os que me odeiam
  rationale: Preserva o quantificador universal e verte o particípio com sufixo como oração relativa idiomática em português.
- source_word: אָהֲבוּ מָוֶת
  choice: amam a morte
  rationale: Embora אָהֲבוּ tenha forma perfeita, o paralelismo proverbial comunica uma verdade geral; o presente em português expressa adequadamente esse valor gnômico.
theological_decisions:
- issue: Sentido antropológico de נַפְשׁוֹ
  choice: à própria vida
  alternative: à própria alma; a si mesmo
  rationale: “Vida” preserva o alcance concreto e integral de נפש e comunica que rejeitar a Sabedoria é autodestrutivo, sem definir uma antropologia bipartida que o hebraico não exige.
- issue: Valor de חֹטְאִי com a Sabedoria como objeto
  choice: quem peca contra mim
  alternative: quem não me encontra; quem erra a meu respeito
  rationale: A expressão admite a imagem de errar ou falhar, mas, neste contexto de oposição à Sabedoria, também possui clara dimensão moral. A escolha conserva essa seriedade sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concisa e o paralelismo do provérbio foram preservados; “faz violência à própria vida” mantém deliberadamente a intensidade e a leve estranheza expressiva do hebraico.
