  source_fidelity: 'A sequência locativa hebraica é bem representada: junto aos portões, à entrada da cidade e no ponto de entrada das portas/aberturas. Contudo, «acesso» pode designar uma via ou permissão de acesso, enquanto מְבוֹא se refere mais diretamente à entrada. «À entrada das portas» conserva melhor o substantivo hebraico e a construção em cadeia.'
  naturalness: «Junto aos portões, à entrada da cidade, à entrada das portas» é claro, digno e natural em português contemporâneo. A repetição de «entrada» reflete deliberadamente a intensificação locativa do hebraico e evita introduzir o sentido mais amplo de «acesso».
