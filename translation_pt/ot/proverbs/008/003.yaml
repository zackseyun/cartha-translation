source:
  edition: WLC
  text: לְ/יַד שְׁעָרִ֥ים לְ/פִי קָ֑רֶת מְב֖וֹא פְתָחִ֣ים תָּרֹֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/003.yaml
  text: Beside the gates[a], at the mouth of the city, at the entrance of the doorways[b], she cries out.
translation:
  language: pt
  text: Junto aos portões, à entrada da cidade, à entrada das portas, ela clama em alta voz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ela chama bem alto».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיַד שְׁעָרִים
  choice: Junto aos portões
  rationale: A expressão לְיַד significa idiomaticamente «junto a» ou «ao lado de». «Portões» indica os portões da cidade, lugar público de reunião.
- source_word: לְפִי קָרֶת
  choice: na entrada da cidade
  rationale: לְפִי significa literalmente «na boca de», mas aqui «na entrada da cidade» comunica com naturalidade o sentido espacial da imagem hebraica.
- source_word: מְבוֹא פְתָחִים
  choice: no acesso às portas
  rationale: מְבוֹא designa entrada ou acesso, e פְתָחִים, aberturas ou portas. A formulação preserva os dois elementos sem a redundância pouco natural de «entrada das entradas».
- source_word: תָּרֹנָּה
  choice: ela clama em alta voz
  rationale: O verbo descreve uma proclamação pública e audível. «Clama em alta voz» transmite intensidade sem atribuir necessariamente aflição emocional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A metáfora hebraica «boca da cidade» foi expressa funcionalmente como «entrada da cidade»; a sequência de locais públicos foi preservada.
