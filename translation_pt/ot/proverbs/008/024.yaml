  text: בְּ/אֵין תְּהֹמ֥וֹת חוֹלָ֑לְתִּי בְּ/אֵ֥ין מַ֝עְיָנ֗וֹת נִכְבַּדֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/024.yaml
  text: When there were no depths[a], I was brought forth, when there were no springs abounding with water.
translation:
  language: pt
  text: Quando ainda não havia profundezas, fui trazida à luz[a]; quando ainda não havia fontes abundantes em água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nasci” ou “fui formada”. O verbo hebraico pode evocar a imagem do parto; “fui trazida à luz” preserva a metáfora sem especificá-la em excesso.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: quando ainda não havia
  rationale: A construção introduz aqui uma circunstância temporal em dois membros paralelos. “Quando ainda não havia” é natural em português e mantém a referência ao período anterior à criação sem tornar a relação temporal mais explícita do que o hebraico.
- source_word: תְּהֹמוֹת
  choice: profundezas
  rationale: O plural designa as águas profundas ou abissais. “Profundezas” é claro, poético e não acrescenta associações mitológicas ausentes do termo por si só.
- source_word: חוֹלָלְתִּי
  choice: fui trazida à luz
  rationale: O verbo passivo evoca parto ou nascimento no discurso da Sabedoria personificada. A expressão conserva essa imagem e a voz passiva sem impor uma formulação biologicamente estreita nem uma conclusão cristológica posterior.
- source_word: מַעְיָנוֹת
  choice: fontes
  rationale: O substantivo indica nascentes ou fontes naturais de água. “Fontes” é corrente, dignificado e adequado ao paralelismo poético.
- source_word: נִכְבַּדֵּי מָיִם
  choice: abundantes em água
  rationale: A expressão descreve fontes pesadas, carregadas ou ricas em água. “Abundantes em água” comunica naturalmente em português a plenitude sugerida pela imagem hebraica, evitando a formulação pouco idiomática “pesadas de água”.
- source_word: מָיִם
  choice: água
  rationale: Embora a forma hebraica seja morfologicamente plural, o singular coletivo “água” é a forma natural nesta construção portuguesa.
theological_decisions:
- issue: A linguagem sobre a origem da Sabedoria em Provérbios 8
  choice: fui trazida à luz
  alternative: nasci; fui formada; fui gerada
  rationale: A fala emprega uma imagem de parto para a Sabedoria personificada. A tradução preserva a metáfora e sua tensão teológica, sem identificar diretamente a Sabedoria com Cristo nem extrair do verso uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, poético e acessível, com concordância feminina por ser a Sabedoria personificada quem fala. O ponto e vírgula torna claro o paralelismo dos dois membros sem alterar sua relação sintática.
