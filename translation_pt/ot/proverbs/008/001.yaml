  text: הֲ/לֹֽא חָכְמָ֥ה תִקְרָ֑א וּ֝/תְבוּנָ֗ה תִּתֵּ֥ן קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
translation:
  language: pt
  text: Não chama a sabedoria, e não levanta a voz o entendimento[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “clama”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dá a sua voz”; expressão hebraica que significa fazer ouvir a voz ou falar em voz alta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Por acaso, ... não
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. A formulação preserva claramente a força interrogativa do hebraico em português natural.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente direto e consagrado. O substantivo abstrato é mantido, enquanto o contexto e a ação de falar preservam sua personificação literária.
- source_word: תִקְרָא
  choice: chama
  rationale: O qal de קרא pode significar chamar ou clamar. “Chama” é direto, natural e não explicita um volume de voz maior do que o texto exige.
- source_word: וּתְבוּנָה
  choice: e o entendimento
  rationale: תבונה designa entendimento, discernimento ou compreensão. “Entendimento” forma um par claro e convencional com “sabedoria”.
- source_word: תִּתֵּן קוֹלָהּ
  choice: ergue a voz
  rationale: A expressão significa literalmente “dá a sua voz”, mas funciona idiomaticamente no sentido de fazer a voz ser ouvida ou falar em voz alta. “Ergue a voz” conserva a imagem e soa natural em português.
theological_decisions:
- issue: Personificação da sabedoria e do entendimento
  choice: Manter os substantivos abstratos e a personificação literária implícita nas ações de chamar e erguer a voz.
  alternative: Despersonalizar a linguagem ou grafar “Sabedoria” com inicial maiúscula para sugerir uma identificação teológica mais desenvolvida.
  rationale: Os substantivos e sufixos são femininos em hebraico, e o contexto personifica a sabedoria como uma mulher que fala publicamente. A tradução conserva essa imagem sem impor uma identificação doutrinária que o versículo não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica e o paralelismo poético foram preservados; a vírgula antes de “e” marca os dois membros paralelos.
