  text: עֹֽשֶׁר וְ/כָב֥וֹד אִתִּ֑/י ה֥וֹן עָ֝תֵ֗ק וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/018.yaml
  text: Riches and honor are with me[b][a], enduring wealth and righteousness.
translation:
  language: pt
  text: Riquezas e honra estão comigo; bens duradouros[a] e justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bens permanentes”; o adjetivo também pode sugerir bens sólidos ou substanciais.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  choice: riquezas
  rationale: Expressa abundância material e preserva o paralelismo poético com “honra”, sem repetir “bens” na segunda parte.
- source_word: כָבוֹד
  choice: honra
  rationale: Neste contexto sapiencial, refere-se naturalmente a estima e prestígio, mais do que à “glória” em sentido divino.
- source_word: אִתִּי
  choice: estão comigo
  rationale: Explicita em português a cópula ausente no hebraico e concorda com o sujeito composto “riquezas e honra”.
- source_word: הוֹן
  choice: bens
  rationale: Designa posses ou riqueza; “bens” distingue o termo de עֹשֶׁר e soa natural com o qualificativo “duradouros”.
- source_word: עָתֵק
  choice: duradouros
  rationale: No contexto, provavelmente qualifica os bens como permanentes, sólidos ou substanciais; “duradouros” comunica com clareza essa ideia.
- source_word: צְדָקָה
  choice: justiça
  rationale: O termo abrange justiça e retidão. “Justiça” é idiomático em português e preserva a dimensão moral e relacional, enquanto “retidão” fica registrada como alternativa.
theological_decisions:
- issue: Sentido de צְדָקָה em um contexto sapiencial moralmente carregado
  choice: justiça
  alternative: retidão
  rationale: O hebraico permite ambos os sentidos. Como o contexto não é especificamente forense nem paulino, “justiça” oferece uma formulação ampla e natural; a nota conserva “retidão” para não eliminar a tensão semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula reproduz as duas unidades paralelas do verso sem tornar a frase artificial.
