source:
  edition: WLC
  text: יִֽרְאַ֣ת יְהוָה֮ שְֽׂנֹ֫את רָ֥ע גֵּ֘אָ֤ה וְ/גָא֨וֹן וְ/דֶ֣רֶךְ רָ֭ע וּ/פִ֨י תַהְפֻּכ֬וֹת שָׂנֵֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
translation:
  language: pt
  text: O temor de Yahweh é odiar o mal; orgulho, arrogância, o caminho do mal e uma boca perversa[a] — eu odeio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma boca de perversidades”; também pode ser traduzido por “uma boca de coisas tortuosas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: A expressão construta designa temor reverente dirigido a YHWH; a transliteração Yahweh preserva o nome próprio presente no texto hebraico.
- source_word: שְׂנֹאת רָע
  choice: é odiar o mal
  rationale: O infinitivo construto tem função predicativa e conserva força verbal; 'é odiar o mal' é natural em português e expressa o caráter moral de רָע.
- source_word: גֵּאָה וְגָאוֹן
  choice: orgulho, arrogância
  rationale: Os dois substantivos semanticamente próximos são mantidos com termos distintos, ambos negativos no contexto da lista de vícios.
- source_word: דֶרֶךְ רָע
  choice: o caminho do mal
  rationale: Preserva a metáfora hebraica de um curso de conduta caracterizado pelo mal.
- source_word: פִי תַהְפֻּכוֹת
  choice: a boca perversa
  rationale: Equivalente português claro para a construção literalmente 'boca de perversidades/coisas tortuosas', referindo-se à fala distorcida.
- source_word: שָׂנֵאתִי
  choice: eu odeio
  rationale: Embora seja perfeito Qal na primeira pessoa, funciona como declaração gnômica no discurso da Sabedoria e é naturalmente vertido no presente.
theological_decisions:
- issue: Identidade da voz em primeira pessoa no discurso da Sabedoria
  choice: Manter 'eu odeio' sem identificar explicitamente quem fala
  alternative: Acrescentar 'a Sabedoria diz' ou interpretar o 'eu' como a voz de Deus
  rationale: O hebraico passa à primeira pessoa no contexto do discurso da Sabedoria. Explicitar a identidade no próprio versículo resolveria uma tensão literária e teológica que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial próxima do hebraico. A ordem final 'eu odeio' preserva a ênfase e a estrutura da lista, embora seja marcada em português. O nome divino é transliterado como Yahweh em conformidade com a camada inglesa fornecida.
