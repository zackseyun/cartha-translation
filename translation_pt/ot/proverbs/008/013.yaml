revisions:
- from: O temor de Yahweh é odiar o mal; orgulho, arrogância, o caminho do mal e a boca perversa[a], eu odeio.
  to: O temor de Yahweh é odiar o mal; orgulho, arrogância, o caminho do mal e uma boca perversa[a] — eu odeio.
  rationale: A revisão limita-se a ajustar o artigo de «boca perversa» ao sintagma hebraico sem artigo e a melhorar a pontuação da inversão final. Ela preserva a voz não identificada em primeira pessoa, a ordem enfática da lista e a alternativa lexical indicada pela nota.
