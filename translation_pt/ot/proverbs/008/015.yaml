source:
  edition: WLC
  text: בִּ֭/י מְלָכִ֣ים יִמְלֹ֑כוּ וְ֝/רוֹזְנִ֗ים יְחֹ֣קְקוּ צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
translation:
  language: pt
  text: Por mim os reis reinam, e os governantes decretam o que é justo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “decretam justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Por mim
  rationale: A preposição ב com o sufixo da primeira pessoa expressa aqui meio ou agência no discurso da Sabedoria. “Por mim” é natural, conciso e também pode abranger a ideia de “por meio de mim”.
- source_word: מְלָכִים
  choice: reis
  rationale: Equivalente direto e corrente do substantivo plural que designa monarcas.
- source_word: יִמְלֹכוּ
  choice: reinam
  rationale: O verbo מלך denota o exercício do governo real; “reinam” preserva a associação lexical e retórica com “reis”.
- source_word: וְרֹזְנִים
  choice: e os governantes
  rationale: רֹזְנִים designa dignitários ou altos dirigentes. “Governantes” comunica amplamente sua função política sem restringi-los a príncipes hereditários.
- source_word: יְחֹקְקוּ
  choice: decretam
  rationale: Neste contexto de governo, חקק indica estabelecer ou prescrever autoritativamente. “Decretam” preserva essa força sem impor a noção moderna e específica de um processo legislativo.
- source_word: צֶדֶק
  choice: o que é justo
  rationale: צֶדֶק pode significar justiça, retidão ou aquilo que é correto. Como objeto de “decretam”, “o que é justo” soa natural em português e mantém o sentido jurídico-moral.
theological_decisions:
- issue: Se o versículo atribui à Sabedoria um papel capacitador no governo político sem legitimar moralmente, de modo automático, todo governante
  choice: Afirmar que, por meio da Sabedoria, reis reinam e governantes decretam o que é justo
  alternative: Entender a frase como legitimação providencial irrestrita de toda autoridade política, ou como afirmação de que todos os governantes sempre promulgam decisões justas
  rationale: No contexto, a Sabedoria personificada declara ser indispensável ao governo correto. A tradução conserva esse ideal positivo sem afirmar além do texto que todo governo existente seja necessariamente justo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “reis reinam” preserva deliberadamente o paralelismo lexical hebraico. O marcador da nota aparece no texto imediatamente após a expressão a que se refere.
