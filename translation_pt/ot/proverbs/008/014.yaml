  text: לִֽ/י עֵ֭צָה וְ/תוּשִׁיָּ֑ה אֲנִ֥י בִ֝ינָ֗ה לִ֣/י גְבוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/014.yaml
  text: Counsel and sound wisdom are mine[a]; I am understanding; strength is mine.
translation:
  language: pt
  text: O conselho e a sabedoria eficaz me pertencem; eu sou o entendimento; a força é minha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tenho conselho e sabedoria sólida; eu sou discernimento; tenho poder.»'
    reason: Alternativas lexicais possíveis para תוּשִׁיָּה, בִינָה, גְּבוּרָה e para a construção possessiva לִי.
lexical_decisions:
- source_word: עֵצָה
  choice: conselho
  rationale: Em Provérbios, o termo designa orientação prudente ou deliberação, e «conselho» preserva o tom elevado da Sabedoria personificada.
- source_word: תוּשִׁיָּה
  choice: sabedoria eficaz
  rationale: O substantivo pode indicar sabedoria sólida e capaz de produzir resultados, competência ou bom senso; «sabedoria eficaz» comunica tanto a solidez quanto a dimensão prática.
- source_word: אֲנִי בִינָה
  choice: eu sou o entendimento
  rationale: A oração nominal identifica a Sabedoria com o entendimento, em vez de apenas declarar que ela o possui; a formulação mantém essa força predicativa.
- source_word: גְּבוּרָה
  choice: força
  rationale: O termo abrange força, poder ou valentia; «força» é amplo e natural, sem impor um sentido exclusivamente militar.
- source_word: לִי ... לִי
  choice: me pertencem ... é minha
  rationale: A repetição marca posse com ênfase. A formulação portuguesa mantém essa repetição e o paralelismo poético.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter a autodescrição em primeira pessoa da Sabedoria personificada.
  alternative: Explicitar na tradução uma identificação cristológica posterior.
  rationale: O hebraico apresenta a Sabedoria personificada falando em primeira pessoa. A tradução conserva essa apresentação literária e teológica sem solucionar debates interpretativos posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva o paralelismo, a personificação e a ênfase possessiva do hebraico.
