  text: בְּ/טֶ֣רֶם הָרִ֣ים הָטְבָּ֑עוּ לִ/פְנֵ֖י גְבָע֣וֹת חוֹלָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/025.yaml
  text: Before the mountains were settled[a], before the hills, I was brought forth.
translation:
  language: pt
  text: Antes que os montes fossem firmados, antes das colinas, fui dada à luz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nasci” ou “fui gerada”. O hebraico emprega uma imagem de nascimento ou origem para a Sabedoria personificada.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Antes que
  rationale: Introduz uma relação temporal anterior; com a oração verbal seguinte, “antes que” é a formulação mais natural em português.
- source_word: הָרִים
  choice: os montes
  rationale: Equivalente corrente do plural hebraico, preservando o paralelismo poético com “colinas”.
- source_word: הָטְבָּעוּ
  choice: fossem firmados
  rationale: O Hofal de טבע descreve os montes sendo fixados ou assentados firmemente. “Fossem firmados” comunica seu estabelecimento na criação sem a estranheza de uma versão excessivamente literal como “fossem afundados”.
- source_word: לִפְנֵי
  choice: antes das
  rationale: A preposição tem sentido temporal neste contexto e retoma poeticamente a ideia de anterioridade expressa no primeiro segmento.
- source_word: גְבָעוֹת
  choice: colinas
  rationale: Tradução comum que mantém o par poético e topográfico “montes/colinas”.
- source_word: חוֹלָלְתִּי
  choice: fui dada à luz
  rationale: Preserva a imagem hebraica de nascimento e origem aplicada à Sabedoria personificada, sem impor um sentido biológico estrito nem uma formulação dogmaticamente mais carregada.
theological_decisions:
- issue: Como traduzir a linguagem de origem da Sabedoria sem resolver a personificação poética por meio de conclusões doutrinárias posteriores
  choice: fui dada à luz
  alternative: nasci; fui gerada
  rationale: “Fui dada à luz” mantém a metáfora de nascimento/origem e sua forma passiva, deixando intacta a tensão poético-teológica. “Nasci” é possível, mas apaga a forma passiva; “fui gerada” pode soar mais ligada a debates cristológicos posteriores.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Montes” e “colinas” são amplamente compreensíveis; “fui dada à luz” conserva a imagem do original sem introduzir terminologia confessional.
