id: PRO.8.4
reference: Proverbs 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
translation:
  language: pt
  text: A vocês, homens, eu clamo; minha voz se dirige aos filhos dos homens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seres humanos” ou “aos filhos da humanidade”. O hebraico diz literalmente “aos filhos de homem”, expressão comum para os seres humanos em geral.
    reason: alternativa lexical e esclarecimento do sentido idiomático
lexical_decisions:
- source_word: אֲלֵיכֶם
  choice: A vocês
  rationale: A preposição אֶל com sufixo de segunda pessoa masculina plural identifica diretamente os destinatários. “A vocês” é natural no português moderno e mantém o endereço direto.
- source_word: אִישִׁים
  choice: homens
  rationale: O plural de אִישׁ designa homens e forma o primeiro membro do paralelismo. “Homens” preserva a forma masculina do hebraico sem recorrer ao vocativo arcaizante “ó homens”.
- source_word: אֶקְרָא
  choice: eu clamo
  rationale: O qal imperfeito de קרא expressa aqui o ato de chamar em voz alta. “Clamo” conserva a intensidade pública da fala da Sabedoria; o pronome explícito dá fluidez e ênfase em português.
- source_word: וְקוֹלִי אֶל
  choice: minha voz se dirige aos
  rationale: 'A construção nominal hebraica é direcional: literalmente, “minha voz [é] para”. “Minha voz se dirige aos” comunica essa direção de modo idiomático, mantendo o substantivo “voz” e o paralelismo.'
- source_word: בְּנֵי אָדָם
  choice: filhos dos homens
  rationale: A expressão hebraica significa literalmente “filhos de homem/da humanidade” e funciona como designação comum dos seres humanos. A formulação escolhida preserva a imagem genealógica e a distinção poética em relação a אִישִׁים; a nota esclarece seu alcance genérico.
theological_decisions:
- issue: Linguagem antropológica masculina no paralelismo hebraico
  choice: Manter “homens” e “filhos dos homens” no texto principal.
  alternative: “pessoas” e “seres humanos”
  rationale: O verso emprega duas expressões masculinas distintas, אִישִׁים e בְּנֵי אָדָם. Preservá-las mantém a forma e a tensão poética do original, enquanto a nota informa que a segunda expressão é uma designação hebraica comum da humanidade em geral, sem restringi-la apenas aos homens do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A vocês” evita o arcaísmo regional de “a vós”; “clamo” conserva o tom elevado da personificação da Sabedoria. O ponto e vírgula reproduz com naturalidade o paralelismo entre os dois membros.
