source:
  edition: WLC
  text: הָבִ֣ינוּ פְתָאיִ֣ם עָרְמָ֑ה וּ֝/כְסִילִ֗ים הָבִ֥ינוּ לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
translation:
  language: pt
  text: Inexperientes, adquiram prudência; e vocês, insensatos, adquiram entendimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “coração”. Aqui, “coração” se refere à capacidade interior de compreender, avaliar e discernir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִינוּ
  choice: adquiram
  rationale: O imperativo plural de בין pede que os ouvintes compreendam ou desenvolvam discernimento. Com os objetos “prudência” e “bom senso”, “adquiram” expressa naturalmente em português o chamado a alcançar essa capacidade.
- source_word: פְתָאיִם
  choice: inexperientes
  rationale: Em Provérbios, פתי designa pessoas ingênuas, crédulas ou ainda não instruídas, não pessoas com deficiência intelectual. “Inexperientes” comunica essa condição sem o possível sentido pejorativo ou intelectual de “simplórios”.
- source_word: עָרְמָה
  choice: prudência
  rationale: 'Neste contexto sapiencial, ערמה tem sentido positivo: sagacidade prática e discernimento cauteloso, não astúcia enganosa. “Prudência” preserva essa avaliação favorável.'
- source_word: וּכְסִילִים
  choice: e vocês, insensatos
  rationale: כסילים é uma categoria sapiencial para pessoas moralmente obstinadas e avessas à sabedoria. “Insensatos” mantém a censura moral sem sugerir mera incapacidade mental, e a forma com “vocês” conserva o apelo direto.
- source_word: לֵב
  choice: bom senso
  rationale: Embora לֵב signifique literalmente “coração”, aqui se refere à faculdade interior de pensar, julgar e discernir. “Bom senso” comunica essa função de modo natural, enquanto a imagem hebraica é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com vocativos explícitos para preservar o paralelismo do apelo. A repetição do imperativo hebraico é representada por “adquiram” nas duas orações; a segunda ocorrência fica subentendida antes de “bom senso” apenas dentro da mesma construção coordenada.
