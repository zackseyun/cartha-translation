base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
translation:
  language: pt
  text: para dar bens como herança aos que me amam e encher seus tesouros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַנְחִיל
  choice: dar
  rationale: O hifil de נחל expressa fazer herdar ou dar como herança. Em português corrente, “dar” comunica naturalmente a concessão beneficente; a dimensão específica de herança é preservada na nota.
- source_word: אֹהֲבַי
  choice: aos que me amam
  rationale: O particípio com sufixo de primeira pessoa designa aqueles que se caracterizam por amar a Sabedoria personificada. A formulação é natural e exata em português.
- source_word: יֵשׁ
  choice: riqueza
  rationale: Neste contexto sapiencial, em paralelo com “tesouros”, יֵשׁ aponta para bens substanciais ou posses. “Riqueza” é clara e atual, sem excluir a alternativa mais formal “bens”.
- source_word: וְאֹצְרֹתֵיהֶם
  choice: e ... os seus tesouros
  rationale: אוֹצָר pode indicar depósito, tesouraria ou tesouro. “Tesouros” mantém a imagem concreta e soa mais natural e amplamente compreensível em português do que “tesourarias”.
- source_word: אֲמַלֵּא
  choice: encher
  rationale: A forma piel na primeira pessoa significa literalmente “encherei/encho”, mas prossegue semanticamente a construção final iniciada por לְהַנְחִיל. O infinitivo coordenado “encher” produz uma frase portuguesa fluente sem alterar a relação sintática.
theological_decisions:
- issue: Natureza das bênçãos prometidas pela Sabedoria personificada
  choice: Manter a imagem concreta de riqueza e tesouros sem transformá-la numa promessa doutrinária universal de prosperidade material.
  alternative: Traduzir de modo abstrato como “verdadeiras riquezas” ou “bens duradouros”.
  rationale: O paralelismo entre יֵשׁ e “tesouros” favorece linguagem de bens materiais ou substanciais. Contudo, o versículo integra o motivo mais amplo das bênçãos da sabedoria em Provérbios; por isso, a tradução preserva a imagem sem acrescentar uma interpretação de teologia da prosperidade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla legibilidade brasileira. A ordem foi ajustada para evitar a construção pouco idiomática “fazer herdar riqueza”, enquanto a nota conserva tanto a força causativa de לְהַנְחִיל quanto a amplitude lexical de יֵשׁ.
