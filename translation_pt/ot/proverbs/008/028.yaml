  text: when he made the skies firm above[a], when the springs of the deep grew strong[b],
translation:
  language: pt
  text: quando firmou os céus[a] no alto, quando se fortaleceram as fontes do abismo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Céus” também pode ser traduzido por “nuvens” ou “firmamento”, conforme a amplitude atribuída a שְׁחָקִים neste contexto da criação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando fortaleceu as fontes do abismo”. O hebraico pode ser entendido como as fontes do abismo se fortalecendo ou como Deus as fortalecendo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַמְּצוֹ
  choice: quando firmou
  rationale: A preposição בְּ com o infinitivo construto introduz uma oração temporal. O verbo אמץ comunica a ideia de tornar forte ou firme; “firmou” é conciso, natural e adequado à imagem da criação.
- source_word: שְׁחָקִים
  choice: os céus
  rationale: שְׁחָקִים pode designar céus, firmamento ou nuvens. No contexto da criação e junto de מִמָּעַל, “os céus” preserva o sentido amplo da região superior.
- source_word: מִמָּעַל
  choice: lá no alto
  rationale: A expressão indica aquilo que está acima. “Lá no alto” transmite com naturalidade tanto a localização quanto a ênfase espacial do hebraico.
- source_word: בַּעֲזֹז
  choice: quando se fortaleceram
  rationale: A construção temporal paralela descreve as fontes do abismo tornando-se fortes. A forma pronominal mantém em português a leitura intransitiva sem excluir, em nota, a possível ênfase na ação divina.
- source_word: עִינוֹת
  choice: as fontes
  rationale: עִינוֹת designa fontes ou nascentes de água. “Fontes” é claro, digno e conserva bem a imagem cosmológica das águas que procedem do abismo.
- source_word: תְּהוֹם
  choice: do abismo
  rationale: תְּהוֹם refere-se ao abismo aquático ou profundidade primordial. “Abismo” preserva sua ressonância cósmica e é uma formulação bíblica inteligível em português.
theological_decisions:
- issue: Agente do fortalecimento das fontes do abismo
  choice: “quando se fortaleceram as fontes do abismo” apresenta as fontes como sujeito gramatical da oração.
  alternative: “quando fortaleceu as fontes do abismo” explicita Deus como agente.
  rationale: A forma hebraica permite entender que as fontes se tornaram fortes, enquanto o contexto de uma série de atos criadores pode favorecer a explicitação da ação divina. A tradução principal conserva a construção mais direta, e a nota registra a alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Lá no alto” evita rigidez excessiva, enquanto “fontes do abismo” preserva a força poética e cosmológica do original. As notas foram posicionadas junto aos termos a que efetivamente se referem.
