  text: יְֽהוָ֗ה קָ֭נָ/נִי רֵאשִׁ֣ית דַּרְכּ֑/וֹ קֶ֖דֶם מִפְעָלָ֣י/ו מֵ/אָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
translation:
  language: pt
  text: Yahweh me possuía no princípio do seu caminho,[a] antes de suas obras de tempos remotos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh me criou” ou “Yahweh me adquiriu”. O verbo hebraico pode ter mais de um sentido. Este versículo teve papel central em debates históricos sobre a Sabedoria personificada e sua relação com o Filho.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קָנָנִי
  choice: me possuía
  rationale: O verbo קנה pode expressar adquirir ou possuir e, em certos contextos, criar. “Me possuía” mantém uma opção lexical forte sem impor no texto principal a leitura teologicamente mais carregada “me criou”; as alternativas são registradas em nota.
- source_word: רֵאשִׁית דַּרְכּוֹ
  choice: no princípio do seu caminho
  rationale: Reproduz a expressão temporal e mantém a amplitude metafórica de דֶּרֶךְ, que pode abranger o curso ou a atividade de Yahweh.
- source_word: קֶדֶם מִפְעָלָיו מֵאָז
  choice: antes de suas obras mais antigas
  rationale: Expressa a prioridade temporal da Sabedoria em relação às obras primordiais de Yahweh, de modo natural em português, sem tratar מֵאָז como um complemento separado e artificial.
theological_decisions:
- issue: Sentido de קָנָנִי em um texto historicamente associado a debates cristológicos
  choice: me possuía
  alternative: me criou; me adquiriu
  rationale: Provérbios 8 apresenta a Sabedoria personificada e não identifica explicitamente essa personagem com o Filho. A tradução principal segue um sentido lexical plausível sem resolver debates posteriores; a nota conserva as alternativas relevantes e a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “no princípio do seu caminho” preserva a formulação metafórica do hebraico; “obras mais antigas” comunica antiguidade primordial sem recorrer ao arcaísmo “desde outrora”.
