  text: בַּ/הֲכִינ֣/וֹ שָׁ֭מַיִם שָׁ֣ם אָ֑נִי בְּ/ח֥וּק/וֹ ח֝֗וּג עַל פְּנֵ֥י תְהֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/027.yaml
  text: When he established the heavens[a], I was there, when he inscribed a circle on the face of the deep.
translation:
  language: pt
  text: Quando ele estabeleceu os céus, eu estava lá; quando traçou um círculo[a] sobre a face do abismo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “delimitou um círculo”. O hebraico pode evocar o horizonte ou um limite circular sobre as águas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲכִינוֹ
  choice: quando ele estabeleceu
  rationale: A preposição בְּ com o infinitivo construto e sufixo tem valor temporal. “Estabeleceu” comunica a ação de ordenar e firmar no contexto da criação.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural tradicional e natural em português preserva tanto a amplitude cósmica quanto o registro poético.
- source_word: שָׁם אָ֑נִי
  choice: eu estava lá
  rationale: שָׁם é locativo, e o verbo “estava” é suprido de modo idiomático para expressar a presença da Sabedoria durante a criação.
- source_word: בְּח֥וּק֝וֹ
  choice: quando traçou
  rationale: A forma introduz outra circunstância temporal e descreve concretamente o ato de marcar ou delimitar, em harmonia com o objeto “círculo”.
- source_word: חוּג
  choice: um círculo
  rationale: Mantém a imagem geométrica direta do hebraico sem a restringir interpretativamente a “horizonte” ou “abóbada”.
- source_word: עַל־פְּנֵי
  choice: sobre a face de
  rationale: Preserva a expressão poética hebraica, ainda compreensível em português moderno.
- source_word: תְהוֹם
  choice: o abismo
  rationale: Designa aqui as águas profundas primordiais. “Abismo” conserva a concisão e a força poética sem acrescentar uma explicação cosmológica ao texto.
theological_decisions:
- issue: Imagens cosmológicas no discurso da Sabedoria
  choice: Apresentar poeticamente a presença da Sabedoria durante a criação, mantendo “círculo” como imagem aberta.
  alternative: Especificar “horizonte” ou “abóbada”, ou formular o texto de modo a impor uma interpretação cristológica posterior.
  rationale: O hebraico descreve a Sabedoria personificada e permite mais de uma compreensão da imagem cosmológica. A tradução não deve fixar um modelo cosmológico específico nem resolver debates teológicos posteriores.
translation_notes:
  register: Português moderno, claro e solene, com pontuação que evidencia as duas orações temporais paralelas. A formulação conserva a textura poética sem soar arcaica.
