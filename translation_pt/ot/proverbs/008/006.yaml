base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/006.yaml
  text: Listen[a], for I will speak noble things[b], and the opening of my lips will be upright things.
translation:
  language: pt
  text: Escutem, pois falarei coisas nobres[a], e a abertura dos meus lábios produzirá coisas retas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas excelentes”. O termo hebraico está relacionado ao que é principesco ou nobre e, por isso, descreve palavras de grande valor.
    reason: lexical_alternative
  - marker: b
    text: Ou “o que é correto”. O hebraico denota retidão, especialmente em sentido moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Escutem
  rationale: O imperativo plural pede atenção. “Escutem” é natural no português moderno e comunica melhor a ideia de ouvir atentamente.
- source_word: כִּי
  choice: pois
  rationale: 'Introduz a razão do chamado para escutar: a Sabedoria está prestes a falar. “Pois” mantém essa relação explicativa de modo conciso e digno.'
- source_word: נְגִידִים
  choice: coisas nobres
  rationale: Embora o termo esteja ligado a governantes ou príncipes, aqui caracteriza as palavras como elevadas e valiosas. “Coisas nobres” preserva essa associação sem transformar o termo em referência pessoal.
- source_word: אֲדַבֵּר
  choice: falarei
  rationale: O imperfeito na primeira pessoa singular indica, neste contexto, fala iminente após o imperativo.
- source_word: וּמִפְתַּח שְׂפָתַי
  choice: e, quando eu abrir os lábios, direi
  rationale: A formulação torna natural em português a imagem hebraica de “abrir os lábios”, ao mesmo tempo que explicita o ato de dizer exigido pela construção poética.
- source_word: מֵישָׁרִים
  choice: o que é correto
  rationale: O plural abstrato hebraico expressa retidão ou aquilo que é moralmente direito. “O que é correto” é idiomático e conserva o sentido ético.
