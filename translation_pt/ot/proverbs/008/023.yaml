id: PRO.8.23
reference: Proverbs 8:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מֵ֭/עוֹלָם נִסַּ֥כְתִּי מֵ/רֹ֗אשׁ מִ/קַּדְמֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
translation:
  language: pt
  text: Desde a eternidade fui estabelecida[a], desde o princípio, antes de existir a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fui constituída” ou “fui instalada”; o verbo hebraico é discutido e também tem sido entendido, com menor probabilidade aqui, como “fui ungida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: Desde a eternidade
  rationale: עוֹלָם pode indicar antiguidade remota ou eternidade. No contexto anterior à criação, “desde a eternidade” conserva o alcance temporal elevado e soa natural em português.
- source_word: נִסַּכְתִּי
  choice: fui estabelecida
  rationale: O nifal de נסך é discutido. “Fui estabelecida” comunica que a Sabedoria foi posta ou designada antes da criação, preserva a voz passiva e concorda com a personificação feminina.
- source_word: מֵרֹאשׁ
  choice: desde o princípio
  rationale: Nesta expressão temporal, רֹאשׁ significa naturalmente “princípio” ou “início”; a formulação escolhida é clara, digna e mantém o paralelismo.
- source_word: מִקַּדְמֵי אָרֶץ
  choice: antes de existir a terra
  rationale: A expressão indica anterioridade em relação à terra. A explicitação de “existir” evita a construção pouco natural “desde antes da terra” sem resolver além do necessário o sentido do hebraico.
theological_decisions:
- issue: Possível leitura cristológica excessiva da Sabedoria personificada
  choice: Traduzir a Sabedoria personificada falando de seu estabelecimento anterior à criação, sem terminologia explicitamente messiânica ou trinitária.
  alternative: Traduzir נִסַּכְתִּי por “fui ungida”, o que pode sugerir diretamente uma leitura messiânica.
  rationale: Embora a tradição cristã possa relacionar tipologicamente Provérbios 8 ao Filho, o sentido literário imediato apresenta a Sabedoria personificada. A tradução não deve introduzir conclusões doutrinárias que o vocabulário hebraico não exige.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. O feminino em “estabelecida” acompanha a Sabedoria personificada no contexto. A sequência temporal conserva o paralelismo poético, enquanto “antes de existir a terra” torna idiomática a expressão final.
