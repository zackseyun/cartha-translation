  text: rejoicing in the world of his earth[b][a], and my delight was with the sons of man.
translation:
  language: pt
  text: alegrando-me no mundo da sua terra[a], e o meu prazer estava com os filhos dos homens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no mundo habitado”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a humanidade; literalmente, “os filhos dos homens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֶקֶת
  choice: alegrando-me
  rationale: O particípio feminino descreve a atividade contínua e jubilosa da Sabedoria personificada. “Alegrando-me” comunica deleite vivo sem reduzir o sentido a mero entretenimento.
- source_word: בְּתֵבֵל
  choice: no mundo
  rationale: תֵבֵל designa o mundo ordenado e habitável. “Mundo” é claro e natural no texto principal, enquanto a nuance de mundo habitado é preservada em nota.
- source_word: אַרְצוֹ
  choice: da sua terra
  rationale: O sufixo masculino singular foi mantido. No contexto da criação, “terra” tem alcance cósmico e se encaixa na construção “o mundo da sua terra”.
- source_word: וְשַׁעֲשֻׁעַי
  choice: e o meu prazer estava
  rationale: Embora a forma hebraica seja plural, ela pode ter valor intensivo. O singular abstrato é idiomático em português e preserva o paralelismo de deleite.
- source_word: בְּנֵי אָדָם
  choice: os filhos dos homens
  rationale: A expressão hebraica foi preservada de modo formal e poético. Aqui ela tem sentido coletivo e se refere à humanidade, esclarecido em nota.
theological_decisions:
- issue: A atividade jubilosa da Sabedoria personificada e sua possível interpretação cristológica posterior
  choice: Manter a voz poética da Sabedoria personificada, sem identificá-la explicitamente com Cristo no texto
  alternative: Traduzir de modo que a Sabedoria seja diretamente identificada com o Filho preexistente
  rationale: O hebraico apresenta a Sabedoria em personificação feminina. Leituras cristológicas tipológicas ou canônicas permanecem possíveis, mas não devem ser incorporadas à tradução como se fossem explícitas neste versículo.
translation_notes:
  register: Português moderno, claro e poético, com construção próxima do hebraico. A primeira pessoa mantém a fala da Sabedoria no contexto, e as notas preservam nuances lexicais sem sobrecarregar o verso.
