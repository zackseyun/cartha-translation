id: PRO.8.30
reference: Proverbs 8:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָֽ/אֶהְיֶ֥ה אֶצְל֗/וֹ אָ֫מ֥וֹן וָֽ/אֶהְיֶ֣ה שַׁ֭עֲשֻׁעִים י֤וֹם י֑וֹם מְשַׂחֶ֖קֶת לְ/פָנָ֣י/ו בְּ/כָל עֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/030.yaml
  text: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
translation:
  language: pt
  text: Então eu estava ao lado dele como mestre de obras[a]; eu era a sua alegria, dia após dia, alegrando-me diante dele em todo o tempo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma criança pequena” (ou “como alguém fiel”); a palavra hebraica traduzida por “mestre de obras” é difícil e pode ter outro sentido.
    reason: alternative_reading
  - marker: b
    text: Ou “brincando diante dele em todo o tempo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: eu estava / eu era
  rationale: O wayyiqtol de היה descreve aqui a situação passada da Sabedoria; a variação exigida pela sintaxe portuguesa expressa naturalmente os dois predicados.
- source_word: אֶצְלוֹ
  choice: ao lado dele
  rationale: Preserva a ideia de proximidade e companhia sem definir em excesso a relação.
- source_word: אָמֹון
  choice: como mestre de obras
  rationale: No contexto da criação, esta leitura tradicional e plausível comunica participação habilidosa, mas o vocábulo hebraico é raro e controverso; outras possibilidades são registradas em nota.
- source_word: שַׁעֲשֻׁעִים
  choice: a sua alegria
  rationale: O plural abstrato/intensivo designa deleite ou aquilo que dá prazer. Em português, a formulação indica naturalmente que a Sabedoria era motivo de alegria para ele.
- source_word: יוֹם יוֹם
  choice: dia após dia
  rationale: Reproduz de modo idiomático a repetição hebraica e sua ideia de continuidade regular.
- source_word: מְשַׂחֶקֶת
  choice: alegrando-me
  rationale: O particípio de שׂחק pode expressar brincar, rir ou regozijar-se. Esta escolha mantém o tom jubiloso do poema, enquanto a imagem mais concreta de brincar fica na nota.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Expressa de maneira concisa a presença perante alguém.
- source_word: בְּכָל־עֵת
  choice: em todo o tempo
  rationale: Mantém o alcance abrangente da expressão hebraica em registro poético natural.
theological_decisions:
- issue: O papel da Sabedoria na criação sugerido por אָמוֹן
  choice: como mestre de obras
  alternative: como uma criança pequena; como alguém fiel
  rationale: A leitura principal se ajusta ao contexto imediato da criação, mas o termo é genuinamente ambíguo. A nota preserva alternativas sem transformar o verso em afirmação cristológica ou metafísica mais precisa do que o hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência poética. “Mestre de obras” é amplamente compreensível e evita o tecnicismo de “arquiteto”. Os dois marcadores de nota aparecem no texto principal.
