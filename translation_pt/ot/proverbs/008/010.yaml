  text: קְחֽוּ מוּסָרִ֥/י וְ/אַל כָּ֑סֶף וְ֝/דַ֗עַת מֵ/חָר֥וּץ נִבְחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/010.yaml
  text: Take my instruction instead of silver[b][a], and knowledge rather than choice gold.
translation:
  language: pt
  text: Aceitem a minha instrução em vez da prata[a], e o conhecimento, de preferência ao ouro escolhido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aceitem a minha disciplina, e não a prata”. O contraste hebraico pode ser traduzido de modo mais literal, mas, neste contexto, indica que a instrução da sabedoria deve ser preferida à riqueza.'
    reason: lexical_alternative
  - marker: b
    text: “Ouro escolhido” também pode ser traduzido como “ouro fino” ou “ouro selecionado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Aceitem
  rationale: O imperativo plural de לקח é um apelo direto. “Aceitem” exprime naturalmente a ideia de receber e acolher a instrução oferecida.
- source_word: מוּסָרִי
  choice: a minha instrução
  rationale: מוּסָר abrange instrução com possível nuance disciplinar ou corretiva; no paralelismo com “conhecimento”, “instrução” é a opção mais natural sem apagar totalmente esse campo semântico.
- source_word: וְאַל כָּסֶף
  choice: em vez da prata
  rationale: 'Depois do imperativo, o contraste com אַל comunica preferência: deve-se escolher a instrução, não a prata. A formulação portuguesa torna clara essa relação comparativa.'
- source_word: דַעַת
  choice: o conhecimento
  rationale: Tradução usual de דַּעַת na literatura sapiencial, em paralelo com “instrução” e em contraste com a riqueza.
- source_word: מֵחָרוּץ
  choice: de preferência ao ouro
  rationale: חָרוּץ designa ouro, frequentemente ouro precioso ou fino. A preposição comparativa מִן é expressa por “de preferência a” no contexto da exortação.
- source_word: נִבְחָר
  choice: escolhido
  rationale: O particípio passivo de בחר significa literalmente “escolhido” ou “selecionado” e qualifica o ouro como especialmente valioso, preservando a forma do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo poético e a exortação no plural foram preservados; as notas registram tanto a formulação hebraica mais literal quanto as alternativas para o tipo ou a qualidade do ouro.
