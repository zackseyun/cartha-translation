source:
  edition: WLC
  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: pt
  text: Pois quem me encontra encontra a vida e alcança o favor de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior e mantém com naturalidade a ligação discursiva em português.
- source_word: מֹצְאִי
  choice: quem me encontra
  rationale: A forma significa literalmente “aquele que me encontra”, com o sufixo de primeira pessoa referindo-se à Sabedoria personificada. “Quem me encontra” expressa naturalmente o valor genérico sem restringi-lo ao sexo masculino.
- source_word: חַיִּים
  choice: a vida
  rationale: Embora tenha forma plural em hebraico, חַיִּים é o termo idiomático comum para “vida”; o singular com artigo é natural em português neste contexto sapiencial.
- source_word: וַיָּפֶק
  choice: alcança
  rationale: O verbo pode indicar fazer sair, obter ou conseguir. Com “favor de Yahweh”, “alcança” comunica de modo idiomático a obtenção desse favor sem explicitar além do texto o modo como isso ocorre.
- source_word: רָצוֹן
  choice: o favor
  rationale: Neste contexto, designa a boa vontade, aceitação ou favor divino. “Favor” preserva de maneira concisa seu sentido relacional.
- source_word: מֵיְהוָה
  choice: de Yahweh
  rationale: 'A preposição מִן marca a fonte: o favor procede de Yahweh. O nome divino יְהוָה é transliterado como “Yahweh”.'
theological_decisions:
- issue: Singular genérico no contexto da Sabedoria personificada
  choice: quem me encontra
  alternative: aquele que me encontra
  rationale: O singular hebraico tem alcance genérico e não é limitado aos homens. A formulação escolhida preserva a universalidade e soa natural em português.
- issue: Forma de verter יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o nome divino; “Yahweh” preserva sua identidade como nome próprio, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição “encontra encontra” foi preservada porque reproduz a estrutura enfática do hebraico e continua inteligível em português.
