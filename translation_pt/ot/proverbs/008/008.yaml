  text: בְּ/צֶ֥דֶק כָּל אִמְרֵי פִ֑/י אֵ֥ין בָּ֝/הֶ֗ם נִפְתָּ֥ל וְ/עִקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/008.yaml
  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
translation:
  language: pt
  text: Todas as palavras da minha boca são justas; não há nelas nada tortuoso nem perverso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: são justas
  rationale: A construção com בְּ mais צֶדֶק expressa conformidade com o que é reto e justo. “São justas” comunica isso de modo natural em português, sem a rigidez pouco idiomática de “estão em justiça”.
- source_word: כָּל
  choice: Todas
  rationale: Preserva o alcance abrangente do hebraico e concorda naturalmente com “palavras”.
- source_word: אִמְרֵי פִי
  choice: as palavras da minha boca
  rationale: Mantém a imagem concreta e solene do hebraico, em vez de reduzi-la ao mais interpretativo “meus dizeres”.
- source_word: אֵין בָּהֶם
  choice: não há nelas nada
  rationale: Reproduz de maneira idiomática a negação existencial e retoma corretamente o substantivo feminino plural “palavras”.
- source_word: נִפְתָּל
  choice: tortuoso
  rationale: Expressa aquilo que é torcido, sinuoso ou desonesto, preservando a metáfora moral e distinguindo o termo do adjetivo seguinte.
- source_word: וְעִקֵּשׁ
  choice: nem perverso
  rationale: עִקֵּשׁ designa o que é retorcido ou moralmente desviado. “Perverso” forma um par natural com “tortuoso”; o “nem” é a coordenação idiomática esperada depois da negação portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A formulação conserva a abrangência, a imagem da boca e o paralelismo de dois termos próximos, sem tornar a sintaxe artificial.
