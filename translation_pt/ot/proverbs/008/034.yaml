  text: אַ֥שְֽׁרֵי אָדָם֮ שֹׁמֵ֪עַֽ֫ לִ֥/י לִ/שְׁקֹ֣ד עַל דַּ֭לְתֹתַ/י י֤וֹם י֑וֹם לִ֝/שְׁמֹ֗ר מְזוּזֹ֥ת פְּתָחָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
translation:
  language: pt
  text: Feliz é o homem[a] que me escuta, vigiando junto às minhas portas dia após dia, guardando os batentes das minhas entradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega aqui uma forma masculina singular com sentido genérico, referindo-se a qualquer pessoa que escuta a Sabedoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz é
  rationale: Expressa a condição de bem-estar e pleno florescimento própria das declarações de felicidade na literatura sapiencial. “Feliz é” soa natural no português atual sem reduzir a expressão a uma emoção passageira.
- source_word: אָדָם
  choice: o homem
  rationale: Preserva o substantivo humano singular e masculino do hebraico e o estilo proverbial. Neste contexto, seu alcance é genérico, conforme esclarecido na nota.
- source_word: שֹׁמֵעַ לִי
  choice: que me escuta
  rationale: Mantém a imagem de ouvir com atenção e a relação pessoal marcada por לִי, sem explicitar como “obedecer” aquilo que o verbo apenas implica no contexto.
- source_word: לִשְׁקֹד עַל דַּלְתֹתַי
  choice: vigiando junto às minhas portas
  rationale: Retrata atenção perseverante e expectante em um lugar de espera. “Junto às” comunica posição às portas com naturalidade em português.
- source_word: יוֹם יוֹם
  choice: dia após dia
  rationale: Reproduz o valor iterativo e enfático da repetição hebraica, indicando constância.
- source_word: לִשְׁמֹר
  choice: mantendo-se de vigia
  rationale: Conserva o sentido de permanecer atento ou de guarda, sem sugerir necessariamente que a pessoa esteja defendendo fisicamente a entrada.
- source_word: מְזוּזוֹת
  choice: batentes
  rationale: Designa concretamente as peças laterais da abertura de uma porta e preserva a imagem arquitetônica.
- source_word: פְּתָחָי
  choice: das minhas entradas
  rationale: Mantém o plural e distingue as aberturas ou entradas das “portas” mencionadas no membro paralelo.
theological_decisions:
- issue: Masculino singular genérico na declaração sapiencial
  choice: o homem
  alternative: a pessoa; quem
  rationale: אָדָם aparece no singular masculino, mas representa qualquer ser humano que escute a Sabedoria, não apenas indivíduos do sexo masculino. O texto mantém a forma proverbial concreta e a nota explicita seu alcance inclusivo.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. A repetição “vigiando… de vigia” reflete os dois verbos hebraicos semanticamente próximos e reforça a imagem de atenção perseverante às portas da Sabedoria.
