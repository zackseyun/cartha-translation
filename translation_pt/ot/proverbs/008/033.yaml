base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
translation:
  language: pt
  text: Ouçam a instrução e tornem-se sábios; não a rejeitem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não a deixem de lado” ou “não a negligenciem”. O verbo hebraico pode indicar rejeitar ou abandonar a instrução.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural de שׁמע expressa escuta atenta, podendo implicar obediência sem explicitá-la em excesso.
- source_word: מוּסָר
  choice: instrução
  rationale: Em Provérbios, מוּסָר designa formação que pode incluir ensino, correção e disciplina. “Instrução” é natural e abrangente neste contexto.
- source_word: וַחֲכָמוּ
  choice: e tornem-se sábios
  rationale: O imperativo plural de חכם aponta para adquirir sabedoria, não apenas para já possuí-la.
- source_word: וְאַל תִּפְרָעוּ
  choice: não a rejeitem
  rationale: Aqui, פרע pode transmitir a ideia de abandonar, deixar de lado ou negligenciar. “Não a rejeitem” mantém a força da advertência, com “a” retomando a instrução.
