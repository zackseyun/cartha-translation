base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/020.yaml
  text: I walk in the way of righteousness[a], in the midst of the paths of justice,
translation:
  language: pt
  text: Ando pelo caminho da retidão[a], no meio das veredas da justiça,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo caminho da justiça... no meio das veredas do juízo”. Os termos hebraicos צְדָקָה e מִשְׁפָּט têm sentidos parcialmente sobrepostos; o texto principal preserva sua distinção poética como “retidão” e “justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֹֽרַח
  choice: pelo caminho da
  rationale: אֹרַח designa caminho, vereda ou curso. Com o verbo de movimento, a preposição בְּ é expressa naturalmente em português por “pelo”, preservando a imagem de percorrer um curso moral.
- source_word: צְדָקָה
  choice: retidão
  rationale: צְדָקָה pode significar retidão ou justiça. “Retidão” preserva neste paralelismo uma distinção poética natural em relação a מִשְׁפָּט, sem negar a sobreposição semântica entre os termos.
- source_word: אֲהַלֵּך
  choice: Ando
  rationale: A forma de הלך comunica movimento ou conduta contínua. “Ando” mantém a metáfora característica da literatura sapiencial e a fala em primeira pessoa da Sabedoria.
- source_word: בְּ/תוֹךְ
  choice: no meio das
  rationale: תּוֹךְ indica o meio ou interior de algo. “No meio das” conserva a imagem espacial e o paralelismo poético.
- source_word: נְתִיבוֹת
  choice: veredas
  rationale: נְתִיבוֹת refere-se a caminhos ou trilhas. “Veredas” é uma opção poética, digna e inteligível, além de evitar a repetição de “caminho”.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: מִשְׁפָּט pode indicar justiça, juízo ou direito. Neste contexto ético, “justiça” é clara e complementa “retidão” no paralelismo.
