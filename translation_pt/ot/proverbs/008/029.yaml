  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/שׂ֘וּמ֤/וֹ לַ/יָּ֨ם חֻקּ֗/וֹ וּ֭/מַיִם לֹ֣א יַֽעַבְרוּ פִ֑י/ו בְּ֝/חוּק֗/וֹ מ֣וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/029.yaml
  text: when he set a boundary for the sea[a], so that the waters would not transgress his command, when he marked out the foundations of the earth[b],
translation:
  language: pt
  text: 'quando estabeleceu um limite para o mar[a],

    para que as águas não ultrapassassem sua ordem[b],

    quando traçou os fundamentos da terra,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu decreto para o mar” ou “o limite dele”; o termo hebraico pode designar tanto uma determinação fixa quanto uma fronteira prescrita.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua boca”; isto é, aquilo que sua boca ordenou.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  choice: quando estabeleceu
  rationale: A preposição בְּ com o infinitivo construto e o sufixo assume sentido temporal neste contexto. “Estabeleceu” expressa com naturalidade a fixação deliberada do limite.
- source_word: לַיָּם חֻקּוֹ
  choice: um limite para o mar
  rationale: חֹק pode indicar decreto, prescrição ou limite fixado. No contexto da contenção das águas, “limite” preserva melhor a imagem concreta, sem eliminar em nota a nuance de decreto.
- source_word: וּמַיִם לֹא יַעַבְרוּ
  choice: para que as águas não ultrapassassem
  rationale: A conjunção introduz naturalmente a finalidade ou o resultado da determinação anterior. “Ultrapassassem” conserva a ideia espacial de cruzar um limite.
- source_word: פִיו
  choice: sua ordem
  rationale: O hebraico diz literalmente “sua boca”, metonímia para aquilo que Deus profere ou ordena. “Sua ordem” é claro em português e combina com o verbo “ultrapassar”, enquanto a forma literal fica registrada em nota.
- source_word: בְּחוּקוֹ
  choice: quando traçou
  rationale: O verbo חקק pode significar gravar, inscrever, prescrever ou demarcar. “Traçou” preserva a imagem poética de delinear ou assentar as fundações.
- source_word: מוֹסְדֵי אָרֶץ
  choice: os fundamentos da terra
  rationale: Tradução direta da construção hebraica, mantendo a imagem cosmológica concreta do poema.
theological_decisions:
- issue: A imagem da criação no discurso da Sabedoria
  choice: Apresentar Deus ordenando e delimitando a criação em linguagem poética concreta.
  alternative: Interpretar a linguagem apenas como ordem abstrata ou inserir no texto categorias cristológicas posteriores.
  rationale: O versículo descreve poeticamente a organização da criação. A tradução mantém o que o hebraico afirma sem decidir debates teológicos posteriores.
- issue: Relação entre o limite do mar e a ordem divina
  choice: Manter no texto tanto a dimensão espacial do limite quanto a dimensão verbal da ordem.
  alternative: Traduzir חֻקּוֹ exclusivamente como “seu decreto” ou entender פִיו apenas como referência espacial.
  rationale: A combinação hebraica permite a sobreposição entre fronteira estabelecida e mandamento divino; a tradução não deve reduzir essa tensão a apenas uma das imagens.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. “Estabeleceu”, “ultrapassassem” e “traçou” são correntes e mantêm as imagens de limite, comando e fundação. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
