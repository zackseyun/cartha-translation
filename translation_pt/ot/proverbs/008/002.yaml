  text: בְּ/רֹאשׁ מְרוֹמִ֥ים עֲלֵי דָ֑רֶךְ בֵּ֖ית נְתִיב֣וֹת נִצָּֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/002.yaml
  text: On the heights beside the road[a], at the crossroads she takes her stand.
translation:
  language: pt
  text: No topo das elevações, junto ao caminho, na encruzilhada[a], ela se posta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na casa das veredas”, isto é, no lugar onde as veredas se encontram.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רֹאשׁ מְרוֹמִים
  choice: No alto das elevações
  rationale: A combinação expressa o ponto mais alto ou proeminente de lugares elevados. A formulação preserva tanto רֹאשׁ, “alto/topo”, quanto o plural מְרוֹמִים, sem reduzir a expressão simplesmente a “nas alturas”.
- source_word: עֲלֵי דָרֶךְ
  choice: junto ao caminho
  rationale: A expressão indica localização ao lado ou nas proximidades do caminho. “Junto ao caminho” é natural em português e mantém o cenário público e acessível.
- source_word: בֵּית נְתִיבוֹת
  choice: na encruzilhada
  rationale: Literalmente, “casa de veredas”, expressão que designa o lugar onde caminhos ou veredas se encontram. “Encruzilhada” comunica esse sentido de modo claro e idiomático.
- source_word: נִצָּבָה
  choice: ela toma posição
  rationale: A forma feminina singular descreve a Sabedoria personificada colocando-se ou mantendo-se deliberadamente em determinado lugar. “Toma posição” preserva essa intencionalidade melhor que o simples “fica em pé”.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Usar o pronome feminino “ela”
  alternative: Repetir “a Sabedoria” ou evitar o pronome
  rationale: O verbo hebraico está no feminino singular e retoma a Sabedoria personificada no contexto. O feminino preserva a forma literária do texto sem acrescentar uma identificação teológica além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Caminho” e “encruzilhada” preservam a imagem espacial e poética; a inversão moderada acompanha o destaque dado aos locais antes da ação da Sabedoria.
