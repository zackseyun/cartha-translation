base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/019.yaml
  text: My fruit is better than gold[a], even fine gold, and my yield than choice silver.
translation:
  language: pt
  text: Meu fruto é melhor do que o ouro e do que o ouro fino, e meu rendimento é melhor do que a prata escolhida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: é melhor do que
  rationale: 'O adjetivo em posição predicativa, construído com מִן comparativo, expressa superioridade: o fruto da sabedoria é melhor do que os metais preciosos mencionados.'
- source_word: פִּרְיִי
  choice: meu fruto
  rationale: Preserva a metáfora concreta de פְּרִי e estabelece o paralelismo com aquilo que a sabedoria produz.
- source_word: מֵחָרוּץ
  choice: do que o ouro
  rationale: חָרוּץ designa ouro neste contexto. A tradução simples permite que פָּז, na sequência, indique ouro de qualidade especialmente elevada.
- source_word: וּמִפָּז
  choice: sim, do que o ouro fino
  rationale: פָּז denota ouro fino ou puro. “Sim” comunica naturalmente a intensificação do segundo termo sem fundir os dois vocábulos hebraicos.
- source_word: וּתְבוּאָתִי
  choice: e o que produzo
  rationale: תְּבוּאָה pode indicar produto, colheita ou rendimento. A formulação mantém a ideia de resultado produzido e evita a repetição pouco natural de “meu fruto” e “meu produto”.
- source_word: מִכֶּסֶף נִבְחָר
  choice: é melhor do que a prata escolhida
  rationale: נִבְחָר significa literalmente “escolhida” e, aplicado à prata, comunica qualidade superior. A repetição de “é melhor” torna claro em português o comparativo elíptico do segundo hemistíquio.
