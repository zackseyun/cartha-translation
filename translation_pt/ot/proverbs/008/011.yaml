source:
  edition: WLC
  text: כִּֽי טוֹבָ֣ה חָ֭כְמָה מִ/פְּנִינִ֑ים וְ/כָל חֲ֝פָצִ֗ים לֹ֣א יִֽשְׁווּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
translation:
  language: pt
  text: Pois a sabedoria é melhor do que joias[a], e nada do que se deseja pode se comparar a ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pérolas” ou “rubis”; o termo hebraico se refere a objetos preciosos, mas sua identificação exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a exortação anterior e preserva de modo natural a força explicativa do conectivo.
- source_word: טוֹבָה חָכְמָה
  choice: a sabedoria é melhor
  rationale: Com a preposição comparativa מִן, טוֹבָה tem sentido comparativo; a formulação também mantém o tema da Sabedoria personificada.
- source_word: מִפְּנִינִים
  choice: do que joias
  rationale: פְּנִינִים designa objetos de grande valor, possivelmente pérolas, rubis ou outras pedras preciosas; “joias” evita uma identificação excessivamente específica.
- source_word: וְכָל חֲפָצִים
  choice: e nada do que se deseja
  rationale: Expressa idiomaticamente em português o sentido abrangente de todas as coisas desejáveis, sem restringi-lo a uma classe particular de bens.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: pode se comparar a ela
  rationale: O verbo שׁוה com ב indica equivalência ou comparabilidade. A construção negativa, combinada com וְכָל, é vertida naturalmente por “nada ... pode”, e “a ela” preserva a referência feminina à sabedoria.
theological_decisions:
- issue: Personificação da sabedoria
  choice: manter a referência pessoal feminina em “a ela”
  alternative: usar uma referência impessoal ou repetir “à sabedoria”
  rationale: O sufixo hebraico בָהּ é feminino singular, e Provérbios 8 apresenta a Sabedoria como mulher. “A ela” conserva esse recurso literário sem acrescentar uma identificação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” conserva a ligação argumentativa; “joias” mantém a amplitude lexical; e “nada do que se deseja” soa natural sem perder a abrangência do hebraico.
