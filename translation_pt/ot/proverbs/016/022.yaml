id: PRO.16.22
reference: Proverbs 16:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים שֵׂ֣כֶל בְּעָלָ֑י/ו וּ/מוּסַ֖ר אֱוִלִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
translation:
  language: pt
  text: O entendimento é fonte de vida para quem o possui, mas a instrução dos insensatos é insensatez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Instrução” também pode ser traduzida como “disciplina” ou “correção”. A frase pode indicar que aquilo que corrige os insensatos é a própria insensatez, ou que a instrução característica deles não passa de insensatez.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: fonte
  rationale: Preserva a metáfora concreta de uma nascente ou fonte que comunica vida e soa natural em português.
- source_word: חַיִּים
  choice: vida
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui funciona como substantivo abstrato e corresponde naturalmente ao singular português.
- source_word: שֵׂכֶל
  choice: entendimento
  rationale: Expressa a inteligência prática e o bom senso característicos da literatura sapiencial, mantendo o contraste com a insensatez.
- source_word: בְּעָלָיו
  choice: para quem o possui
  rationale: Traduz de modo natural a ideia literal de 'seu possuidor', preservando a relação singular com o entendimento.
- source_word: מוּסַר
  choice: instrução
  rationale: O termo abrange instrução, disciplina e correção. 'Instrução' mantém aberta a ambiguidade sobre aquilo que os insensatos recebem ou oferecem.
- source_word: אֱוִלִים
  choice: insensatos
  rationale: Designa em Provérbios pessoas moralmente obtusas e resistentes à sabedoria; é uma categoria proverbial clara e dignificada em português.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: Mantém a ligação lexical e retórica com 'insensatos' e produz um encerramento conciso.
theological_decisions:
- issue: Sentido da segunda linha
  choice: 'Preservar a formulação compacta: ''a instrução dos insensatos é insensatez''.'
  alternative: Explicitar que aquilo que serve de correção aos insensatos é apenas insensatez.
  rationale: 'A construção hebraica permite mais de uma relação: a disciplina recebida pelos insensatos, ou a instrução que lhes é própria. A tradução não resolve silenciosamente essa tensão.'
translation_notes:
  register: Português moderno, claro e proverbial, com ampla legibilidade brasileira. A ordem das linhas e a metáfora da fonte foram preservadas; evitou-se linguagem confessional específica.
