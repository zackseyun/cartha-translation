base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
translation:
  language: pt
  text: 'Quem fecha os olhos para tramar perversidades,

    quem aperta os lábios[a] leva o mal até o fim[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comprime os lábios”. O hebraico menciona especificamente os lábios; aqui não se refere a piscar os olhos.
    reason: lexical_alternative
  - marker: b
    text: Ou “consuma o mal” ou “completa o mal”. O verbo hebraico enfatiza levar a ação má à sua plena realização.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹצֶה עֵינָיו
  choice: fecha os olhos
  rationale: O particípio descreve o ato de fechar os olhos; a formulação é natural em português e conserva o gesto ligado à elaboração do mal.
- source_word: לַחְשֹׁב
  choice: para tramar
  rationale: Neste contexto, חשב indica conceber ou planejar intencionalmente. “Tramar” comunica com clareza a ideia de planejamento malicioso.
- source_word: תַּהְפֻּכוֹת
  choice: perversidades
  rationale: O plural designa coisas, atos ou planos moralmente tortuosos. “Perversidades” preserva a amplitude e a força ética do termo.
- source_word: קֹרֵץ שְׂפָתָיו
  choice: aperta os lábios
  rationale: Como o objeto expresso são os lábios, o verbo descreve apertá-los ou comprimi-los, e não piscar os olhos. “Aperta os lábios” é claro e idiomático.
- source_word: כִּלָּה רָעָה
  choice: leva o mal até o fim
  rationale: O Piel de כלה enfatiza completar ou conduzir algo ao seu término. A expressão portuguesa conserva essa ideia de consumação sem sugerir apenas que a pessoa começa a praticar o mal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com estrutura poética concisa. A repetição de “quem” mantém o paralelismo dos dois particípios hebraicos, enquanto “leva o mal até o fim” expressa de modo natural o resultado indicado pelo verbo final.
