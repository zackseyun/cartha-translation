source:
  edition: WLC
  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
translation:
  language: pt
  text: Lábios justos são o prazer dos reis[a], e ele ama quem fala o que é reto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lábios justos têm o favor dos reis” ou “são o agrado dos reis”. A palavra hebraica pode significar prazer, agrado, favor ou aceitação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quem fala o que é correto”. A expressão hebraica está no plural e significa literalmente “coisas retas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: prazer
  rationale: O substantivo pode indicar prazer, agrado, favor ou aceitação. Aqui, a construção apresenta a fala justa como aquilo em que os reis têm prazer; “prazer” é natural e mantém o valor avaliativo sem excluir a alternativa “agrado”.
- source_word: מְלָכִים
  choice: reis
  rationale: Tradução direta do plural, preservando o cenário concreto da autoridade real na literatura sapiencial.
- source_word: שִׂפְתֵי צֶדֶק
  choice: lábios justos
  rationale: A expressão construta significa literalmente “lábios de justiça/retidão”. “Lábios justos” conserva a metonímia hebraica para a fala e soa conciso em português.
- source_word: צֶדֶק
  choice: justos
  rationale: Neste contexto, qualifica a fala conforme a justiça ou retidão moral. “Justos” é idiomático com “lábios”, enquanto “de justiça” permanece uma alternativa mais formal.
- source_word: וְדֹבֵר
  choice: e ele ama quem fala
  rationale: 'O particípio é substantivado: “aquele que fala”. “Quem fala” expressa naturalmente essa referência genérica. Mantém-se “ele” porque יֶאֱהָב é singular, embora o antecedente coletivo esteja no plural.'
- source_word: יְשָׁרִים
  choice: o que é reto
  rationale: O plural adjetival é usado substantivamente e designa coisas retas, corretas ou íntegras. A formulação portuguesa comunica o sentido moral sem uma tradução rigidamente literal.
- source_word: יֶאֱהָב
  choice: ele ama
  rationale: A forma verbal é terceira pessoa masculina singular e, no provérbio, exprime ação habitual ou geral. A tradução preserva deliberadamente o singular do hebraico.
theological_decisions:
- issue: Referente singular de יֶאֱהָב após o plural “reis”
  choice: “ele ama”, preservando a forma verbal singular do hebraico
  alternative: “eles amam”, fazendo concordância semântica com “reis”
  rationale: O texto massorético traz inequivocamente um verbo singular. O singular pode representar o rei típico ou genérico; pluralizá-lo eliminaria uma tensão gramatical genuína do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe concisa própria de um provérbio. Preserva-se a imagem concreta dos “lábios” e o singular inesperado “ele ama”, em vez de regularizar silenciosamente a concordância com “reis”.
