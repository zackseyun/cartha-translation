  source_fidelity: A primeira linha reproduz adequadamente a construção nominal e a força oracular/judicial de קֶסֶם. No segundo segmento, porém, o hebraico traz literalmente a ideia de que, «no julgamento», a boca do rei não age deslealmente (בְּמִשְׁפָּט לֹא יִמְעַל פִּיו). A formulação proposta, «não trai a justiça», é uma interpretação fluente, mas torna «justiça» objeto direto de «trair» e deixa menos visível o enquadramento judicial expresso pela preposição בְּ.
  naturalness: «Uma sentença divina está nos lábios de um rei» é clara e conserva o tom proverbial. «Ao julgar, sua boca não age traiçoeiramente» é natural em português moderno e expressa diretamente a relação entre o ato de julgar e a lealdade da fala.
  terminology: «Sentença divina» é uma solução contextual defensável para קֶסֶם, desde que a nota preserve «adivinhação» e «oráculo» como alternativas. «Um rei» mantém melhor o caráter generalizante do hebraico do que «o rei».
