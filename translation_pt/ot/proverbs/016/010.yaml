id: PRO.16.10
reference: Proverbs 16:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קֶ֤סֶם עַֽל שִׂפְתֵי מֶ֑לֶךְ בְּ֝/מִשְׁפָּ֗ט לֹ֣א יִמְעַל פִּֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/010.yaml
  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
translation:
  language: pt
  text: Uma sentença divina está nos lábios de um rei[a]; ao julgar, sua boca não age traiçoeiramente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico geralmente significa “adivinhação” ou “oráculo”; neste contexto judicial, também pode ser entendido como “sentença divina”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em juízo”. O verbo hebraico indica agir com deslealdade ou perfídia; também se pode traduzir, de modo mais interpretativo, “sua boca não trai a justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶסֶם
  choice: sentença divina
  rationale: Embora o substantivo frequentemente designe adivinhação ou pronunciamento oracular, aqui o paralelismo com מִשְׁפָּט situa a fala do rei no âmbito judicial. “Sentença divina” conserva a força elevada e quase oracular sem sugerir, no texto principal, uma prática oculta.
- source_word: עַל שִׂפְתֵי מֶלֶךְ
  choice: está nos lábios do rei
  rationale: A oração nominal hebraica recebe “está” em português, preservando a imagem locativa. O singular definido funciona naturalmente em português como referência genérica ao rei enquanto figura régia.
- source_word: בְּמִשְׁפָּט
  choice: a justiça
  rationale: No contexto da decisão régia, מִשְׁפָּט pode indicar justiça, julgamento ou o ato de julgar. “A justiça” produz uma construção portuguesa natural com o verbo “trair”, enquanto as alternativas mais formais são registradas em nota.
- source_word: לֹא יִמְעַל
  choice: não trai
  rationale: מעל expressa infidelidade, deslealdade ou transgressão. Aplicado à fala judicial, “não trai” comunica de modo conciso que a boca do rei não é infiel à justiça.
- source_word: פִּיו
  choice: sua boca
  rationale: Mantém a imagem concreta do hebraico e sua variação em relação a “lábios” no primeiro segmento.
theological_decisions:
- issue: Se קֶסֶם deve conservar seu sentido usual de “adivinhação” ou receber aqui um sentido positivo e judicial
  choice: sentença divina
  alternative: adivinhação; oráculo
  rationale: O paralelismo descreve a fala régia em relação à justiça. A tradução contextual positiva evita apresentar o provérbio como aprovação inequívoca de prática ocultista, mas a nota preserva a amplitude e a tensão lexical do hebraico.
- issue: Se o segundo segmento afirma de forma absoluta a infalibilidade de todo rei ou apresenta o ideal sapiencial da justiça régia
  choice: Preservar a afirmação proverbial sem acrescentar qualificações ao texto
  alternative: Explicitar “ao julgar corretamente” ou “o rei ideal”
  rationale: O hebraico formula uma máxima direta. Inserir uma limitação resolveria uma tensão que o original deixa implícita; o contexto sapiencial permite entendê-la como retrato normativo da função régia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo entre “lábios” e “boca” e mantém a concisão proverbial.
