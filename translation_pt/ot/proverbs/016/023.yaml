  text: לֵ֣ב חָ֭כָם יַשְׂכִּ֣יל פִּ֑י/הוּ וְ/עַל שְׂ֝פָתָ֗י/ו יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/023.yaml
  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
translation:
  language: pt
  text: O coração do sábio torna prudente a sua boca[a] e acrescenta instrução aos seus lábios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dá discernimento à sua boca”. O verbo hebraico pode expressar a ideia de tornar prudente ou de conferir discernimento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “torna seus lábios mais persuasivos”. O termo hebraico pode significar instrução ou aprendizado e, neste contexto, também pode indicar uma fala instrutiva ou persuasiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica, na qual o coração abrange pensamento, discernimento e vontade, não apenas emoção.
- source_word: חָכָם
  choice: do sábio
  rationale: O adjetivo masculino singular substantivado é vertido de modo conciso e natural, mantendo a forma representativa do hebraico.
- source_word: יַשְׂכִּיל
  choice: torna prudente
  rationale: O hifil de שׂכל tem valor causativo e pode indicar tornar prudente ou conferir discernimento; esta formulação liga naturalmente o coração sábio à maneira de falar.
- source_word: פִּיהוּ
  choice: a sua boca
  rationale: Mantém a imagem concreta do hebraico e o paralelismo com “lábios” no segundo membro.
- source_word: וְעַל
  choice: e ... aos
  rationale: A preposição עַל é representada de maneira idiomática em português na construção “acrescenta ... aos seus lábios”, sem achatar a coordenação poética.
- source_word: שְׂפָתָיו
  choice: seus lábios
  rationale: Preserva a expressão concreta e o paralelismo poético com “boca”.
- source_word: יֹסִיף
  choice: acrescenta
  rationale: Reproduz diretamente a ideia de adicionar ou aumentar e soa natural no contexto.
- source_word: לֶקַח
  choice: instrução
  rationale: O substantivo pode designar ensino ou aprendizado recebido; “instrução” é lexicalmente direto e funciona naturalmente como qualidade ou conteúdo da fala, sem excluir a possível nuance de persuasão.
theological_decisions: []
