  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva as imagens hebraicas de coração, boca e lábios, bem como o paralelismo do provérbio. As notas registram as principais ambiguidades lexicais sem resolvê-las de modo denominacional.
