  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
translation:
  language: pt
  text: O homem perverso cava o mal[a], e seus lábios são como fogo abrasador.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cava a desgraça” ou “cava o dano”. O termo hebraico pode ressaltar tanto o mal moral quanto o prejuízo destrutivo causado por alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “e sobre os seus lábios, como fogo abrasador”. A oração hebraica não contém verbo expresso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: homem
  rationale: O substantivo é masculino singular e, no provérbio, apresenta um tipo humano representativo; “homem” preserva essa forma sem neutralização desnecessária.
- source_word: בְּלִיַּעַל
  choice: perverso
  rationale: Neste contexto sapiencial, o termo caracteriza alguém moralmente depravado ou sem valor, não um nome próprio. “Perverso” comunica com naturalidade a avaliação moral em português.
- source_word: כֹּרֶה
  choice: cava
  rationale: O particípio de כרה significa literalmente “cavar”. A tradução mantém a imagem metafórica de alguém que procura, prepara ou faz surgir o mal.
- source_word: רָעָה
  choice: o mal
  rationale: O termo pode indicar maldade moral, dano ou desgraça. “O mal” preserva a amplitude sem limitar o sentido apenas ao prejuízo causado.
- source_word: שפתיו
  choice: seus lábios
  rationale: Mantém a imagem corporal literal e poética do hebraico, associando a fala ao fogo.
- source_word: כְּאֵשׁ
  choice: como que um fogo
  rationale: A preposição כְּ introduz uma comparação. “Como que” conserva o valor de símile dentro da oração nominal hebraica.
- source_word: צָרָבֶת
  choice: abrasador
  rationale: O termo raro denota calor intenso ou aquilo que queima. “Abrasador” expressa a força destrutiva da imagem.
- source_word: וְעַל
  choice: e em
  rationale: Embora עַל seja literalmente “sobre”, em português “em seus lábios” é a expressão natural para localizar figuradamente a fala, sem perder a imagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A imagem concreta de cavar e a comparação da fala com fogo foram preservadas; “como que” mantém a ambiguidade e a estrutura poética da oração nominal sem explicitar em excesso o referente.
