  text: לֵ֣ב אָ֭דָם יְחַשֵּׁ֣ב דַּרְכּ֑/וֹ וַֽ֝/יהוָ֗ה יָכִ֥ין צַעֲדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
translation:
  language: pt
  text: O coração do homem planeja o seu caminho, mas Yahweh firma[a] os seus passos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dirige os seus passos”. O verbo hebraico pode significar “tornar firme”, “estabelecer” ou, neste contexto, “dirigir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem hebraica do centro interior do pensamento e da intenção; em português, “coração” continua compreensível nesse sentido figurado.
- source_word: אָדָם
  choice: homem
  rationale: O singular genérico representa aqui o ser humano individual; “o homem” conserva a forma masculina e o caráter proverbial do hebraico.
- source_word: יְחַשֵּׁב
  choice: planeja
  rationale: O piel de חשׁב expressa elaboração intencional de planos; “planeja” é conciso, natural e adequado ao paralelismo.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: Mantém a metáfora hebraica do caminho como curso de vida e sua relação poética com “passos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: יָכִין
  choice: firma
  rationale: O hiphil de כון pode significar tornar firme, estabelecer ou dispor. “Firma” preserva de modo natural a ideia causativa sem reduzi-la apenas a orientação.
- source_word: צַעֲדוֹ
  choice: os seus passos
  rationale: Embora a forma hebraica seja singular, o substantivo tem sentido coletivo; o plural é idiomático em português e preserva a metáfora concreta.
theological_decisions:
- issue: Soberania divina e planejamento humano
  choice: O ser humano realmente planeja seu caminho, enquanto Yahweh firma seus passos.
  alternative: Yahweh dirige os seus passos; Yahweh determina os seus passos.
  rationale: A formulação mantém lado a lado a intenção humana e a ação decisiva de Yahweh, sem transformar o provérbio nem em mero aconselhamento divino nem em determinismo explícito.
translation_notes:
  register: Português moderno, claro e digno, com concisão proverbial. “O coração do homem” preserva a antropologia e a forma genérica do hebraico; “firma” é mais corrente em português do que “estabelece” com o objeto “passos” e retém a ambiguidade lexical relevante.
