  text: תּוֹעֲבַ֣ת יְ֭הוָה כָּל גְּבַהּ לֵ֑ב יָ֥ד לְ֝/יָ֗ד לֹ֣א יִנָּקֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/005.yaml
  text: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
translation:
  language: pt
  text: Todo aquele que é arrogante de coração é uma abominação para Yahweh; mão a mão[a], não ficará impune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico “mão a mão”, expressão de sentido incerto. Pode significar “certamente” ou “esteja certo”; também pode ser entendida como “ainda que unam as mãos”, isto é, mesmo que formem uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: é abominável
  rationale: Expressa com naturalidade em português a forte repulsa moral e religiosa indicada pelo substantivo hebraico, sem enfraquecê-lo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל גְּבַהּ לֵב
  choice: Todo coração arrogante
  rationale: Preserva a forma concisa do hebraico e seu foco no coração como centro da disposição interior; “arrogante” comunica a ideia idiomática de coração elevado.
- source_word: יָד לְיָד
  choice: de mão em mão
  rationale: Mantém visível a expressão hebraica difícil, cuja função pode ser asseverativa ou aludir a pessoas que unem as mãos; a nota registra a ambiguidade.
- source_word: לֹא יִנָּקֶה
  choice: certamente não ficará sem castigo
  rationale: Comunica o sentido do nifal de não escapar à punição. “Certamente” representa na leitura principal a provável força enfática da expressão anterior, sem ocultar outras possibilidades na nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de empregar um título substitutivo.
- issue: Interpretação de יָד לְיָד
  choice: Conservar “de mão em mão” no texto e refletir a leitura enfática por meio de “certamente”
  alternative: Traduzir apenas “com certeza” ou entender “ainda que unam as mãos”
  rationale: A locução é genuinamente difícil. A redação principal conserva sua forma e uma leitura provável, enquanto a nota mantém acessíveis as alternativas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi ajustada para soar natural, mas a concisão proverbial, o foco no coração e a expressão hebraica ambígua foram preservados.
