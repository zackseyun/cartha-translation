id: PRO.16.1
reference: Proverbs 16:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
translation:
  language: pt
  text: Ao ser humano[b] pertencem os planos do coração[a], mas de Yahweh vem a resposta da língua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os arranjos/preparativos do coração».'
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa אָדָם, no singular, como referência representativa ao ser humano em geral.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָדָם
  choice: Ao ser humano pertencem
  rationale: O לְ indica posse ou relação. A construção «pertencem» torna natural em português a oração nominal hebraica e mantém o contraste entre o que cabe ao ser humano e o que vem de Yahweh. «Ser humano» comunica o valor genérico do singular אָדָם sem restringi-lo ao sexo masculino.
- source_word: מַעַרְכֵי
  choice: planos
  rationale: O termo, derivado de ערך, designa disposições, preparativos ou coisas ordenadas. Com «coração», «planos» expressa de modo claro a organização interior das intenções, sem perder o sentido básico.
- source_word: לֵב
  choice: coração
  rationale: לֵב abrange pensamento, vontade e intenção. «Coração» preserva a imagem hebraica característica da literatura sapiencial.
- source_word: וּמֵיְהוָה
  choice: mas de Yahweh vem
  rationale: Embora ו possa ser traduzido por «e», o paralelismo estabelece um contraste entre a esfera do planejamento humano e a origem divina da resposta. «Mas» explicita esse valor adversativo sem ampliar a afirmação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מַעֲנֵה
  choice: resposta
  rationale: O substantivo denota uma resposta ou réplica. «Resposta» é direto e adequado ao paralelismo conciso do provérbio.
- source_word: לָשׁוֹן
  choice: língua
  rationale: A tradução literal conserva a imagem concreta hebraica, na qual «língua» funciona como metonímia da fala.
theological_decisions:
- issue: Intenção humana e soberania divina no paralelismo
  choice: O texto atribui ao ser humano os planos interiores, mas declara que a resposta da língua vem de Yahweh.
  alternative: Entender a segunda linha como uma afirmação geral sobre o controle divino dos resultados, ou como a determinação divina de toda fala humana.
  rationale: A tradução mantém a tensão precisa entre «planos do coração» e «resposta da língua», sem transformá-la em um sistema determinista nem reduzi-la a uma afirmação vaga sobre providência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem da segunda oração foi ajustada para fluência, preservando a ênfase na origem («de Yahweh»). A expressão poética «resposta da língua» foi mantida deliberadamente.
