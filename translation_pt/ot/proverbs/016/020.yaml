base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
translation:
  language: pt
  text: Quem trata de um assunto com discernimento[a] encontrará o bem; feliz é quem confia em Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem age com sabedoria em relação a uma questão” ou “Quem é prudente ao tratar de um assunto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל עַל־דָּבָר
  choice: trata de um assunto com discernimento
  rationale: O particípio hifil de שׂכל pode indicar agir com prudência, considerar atentamente ou proceder com entendimento. Com עַל־דָּבָר, a formulação escolhida comunica o manejo atento e sábio de uma questão, sem reduzir o sentido à reflexão puramente intelectual.
- source_word: יִמְצָא טוֹב
  choice: encontrará o bem
  rationale: Preserva a concisão do hebraico e a amplitude de טוֹב, que pode abranger benefício, bem-estar e resultado favorável, sem restringi-lo à prosperidade material.
- source_word: וּבוֹטֵחַ בַּיהוָה
  choice: e ... quem confia em Yahweh
  rationale: O particípio qal tem valor genérico. A construção com “quem” soa natural em português e abrange qualquer pessoa, enquanto “confia em” reproduz de modo idiomático בטח ב.
- source_word: אַשְׁרָיו
  choice: feliz é quem
  rationale: אַשְׁרֵי descreve a condição favorável e plena de quem está sob o bem de Deus, não apenas uma emoção passageira. “Feliz é quem” mantém a forma proverbial e evita uma expressão masculina desnecessária em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e evita substituí-lo por um título.
- issue: Sentido de אַשְׁרָיו
  choice: feliz é quem
  alternative: abençoado é aquele; como é feliz aquele
  rationale: A escolha conserva a declaração de bem-aventurança sem definir de maneira excessivamente específica se ela descreve bênção concedida, prosperidade integral ou felicidade resultante.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A estrutura paralela e concisa do provérbio foi preservada; “quem” mantém a aplicação genericamente humana.
