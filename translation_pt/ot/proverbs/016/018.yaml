source:
  edition: WLC
  text: לִ/פְנֵי שֶׁ֥בֶר גָּא֑וֹן וְ/לִ/פְנֵ֥י כִ֝שָּׁל֗וֹן גֹּ֣בַהּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/018.yaml
  text: Pride comes before destruction[a], and a haughty spirit before a fall.
translation:
  language: pt
  text: O orgulho vem antes da ruína[a], e o espírito arrogante, antes da queda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Antes da ruína, o orgulho; e antes do tropeço, a elevação de espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: antes de
  rationale: A expressão preposicional tem sentido temporal no provérbio e indica aquilo que precede o resultado mencionado.
- source_word: שֶׁבֶר
  choice: ruína
  rationale: Aqui o substantivo designa colapso ou destruição, não uma quebra física; “ruína” é natural em português e mantém o paralelismo com “queda”.
- source_word: גָּאוֹן
  choice: orgulho
  rationale: Embora possa significar majestade ou exaltação em outros contextos, o paralelismo com a ruína exige aqui o sentido negativo de orgulho ou arrogância.
- source_word: וְלִפְנֵי
  choice: e ... antes de
  rationale: A repetição de “antes de” preserva a estrutura equilibrada dos dois membros do provérbio.
- source_word: כִּשָּׁלוֹן
  choice: queda
  rationale: O termo pode indicar tropeço, queda ou fracasso; “queda” é conciso, idiomático e corresponde bem a “ruína”.
- source_word: גֹּבַהּ רוּחַ
  choice: espírito arrogante
  rationale: A expressão significa literalmente “altura de espírito”; “espírito arrogante” comunica naturalmente a altivez interior em sentido negativo e preserva o termo “espírito”.
theological_decisions:
- issue: Caracterização moral de גָּאוֹן e גֹּבַהּ רוּחַ
  choice: As duas expressões são traduzidas negativamente como “orgulho” e “espírito arrogante”.
  alternative: “Majestade” e “elevação de espírito” seriam possíveis em outros contextos ou como traduções mais literais.
  rationale: O paralelismo associa ambas as disposições à ruína e à queda, tornando claro o sentido ético negativo sem depender de uma interpretação doutrinária particular.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo hebraico, mas usa ordem verbal natural em português; a elipse do verbo no segundo membro conserva concisão proverbial.
