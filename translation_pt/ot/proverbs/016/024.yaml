  text: צוּף דְּ֭בַשׁ אִמְרֵי נֹ֑עַם מָת֥וֹק לַ֝/נֶּפֶשׁ וּ/מַרְפֵּ֥א לָ/עָֽצֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/024.yaml
  text: Pleasant words are a honeycomb[b][a], sweet to the soul and healing to the bones.
translation:
  language: pt
  text: Palavras agradáveis são mel do favo[a], doces para a alma[b] e cura para os ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mel de favos”; a expressão hebraica designa o mel no próprio favo.'
    reason: lexical_alternative
  - marker: b
    text: “Alma” também pode significar “vida”, “pessoa” ou “ser interior”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּף דְּבַשׁ
  choice: mel do favo
  rationale: A expressão designa o mel no favo ou mel de favos. “Mel do favo” conserva a imagem concreta e soa mais natural em português do que uma tradução estritamente literal como “favo de mel” nesta construção predicativa.
- source_word: אִמְרֵי נֹעַם
  choice: palavras agradáveis
  rationale: אִמְרֵי refere-se a palavras ou ditos, e נֹעַם expressa agrado, encanto ou deleite. “Palavras agradáveis” é claro e evita restringir o sentido a uma qualidade moral específica, como “bondosas” ou “graciosas”.
- source_word: מָתוֹק
  choice: doces
  rationale: Mantém a metáfora sensorial do mel e concorda naturalmente com “palavras”, sujeito poético da segunda oração.
- source_word: לַנֶּפֶשׁ
  choice: para a alma
  rationale: נֶפֶשׁ pode significar alma, vida, pessoa ou ser interior. “Alma” preserva a imagem antropológica e o paralelismo com “ossos”, sem eliminar a amplitude lexical.
- source_word: וּמַרְפֵּא
  choice: e cura
  rationale: O substantivo pode indicar cura, saúde ou remédio. “Cura” é natural no paralelismo e comunica o efeito restaurador sem transformar a expressão em uma afirmação médica técnica.
- source_word: לָעָצֶם
  choice: para os ossos
  rationale: Embora o hebraico use a forma singular, ela tem sentido coletivo. O plural é idiomático em português e preserva a imagem corporal.
theological_decisions: []
