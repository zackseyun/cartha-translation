reference: Proverbs 16:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/חֶ֣סֶד וֶ֭/אֱמֶת יְכֻפַּ֣ר עָוֺ֑ן וּ/בְ/יִרְאַ֥ת יְ֝הוָ֗ה ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/006.yaml
  text: By steadfast love and faithfulness iniquity is atoned for[b][a], and by the fear of Yahweh one turns away from evil.
translation:
  language: pt
  text: Pelo amor leal e pela fidelidade, a iniquidade é expiada[a][b]; e pelo temor de Yahweh a pessoa se afasta do mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pelo amor leal e pela verdade, a iniquidade é expiada.” O termo hebraico traduzido como “fidelidade” também pode significar “verdade”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo “é expiada” não declara quem realiza a expiação. O hebraico não explicita se o foco está na ação de Deus, no papel do amor leal e da fidelidade, ou em ambos.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחֶסֶד
  choice: pelo amor leal
  rationale: חֶסֶד abrange bondade, lealdade relacional e amor constante. “Amor leal” conserva de modo natural em português tanto o aspecto afetivo quanto a fidelidade duradoura; בְּ é entendido instrumentalmente.
- source_word: וֶאֱמֶת
  choice: e pela fidelidade
  rationale: אֱמֶת pode significar “verdade” ou “fidelidade/confiabilidade”. Na expressão חֶסֶד וֶאֱמֶת, “fidelidade” comunica melhor a qualidade relacional, sem excluir a alternativa lexical “verdade”.
- source_word: יְכֻפַּר
  choice: é expiada
  rationale: O Pual de כפר é passivo e indica fazer expiação. “É expiada” preserva a voz passiva e a força cultual/moral do verbo, deixando o agente sem identificação, como no hebraico.
- source_word: עָוֺן
  choice: a iniquidade
  rationale: עָוֺן pode designar iniquidade, culpa ou sua consequência. “Iniquidade” mantém em primeiro plano a perversidade moral sem restringir o termo apenas ao sentimento ou estado de culpa.
- source_word: וּבְיִרְאַת יְהוָה
  choice: e pelo temor de Yahweh
  rationale: יִרְאָה, na literatura sapiencial, denota temor reverente diante de Deus. A preposição é mantida com valor instrumental, em paralelo com o primeiro membro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em conformidade com a orientação do projeto.
- source_word: סוּר
  choice: a pessoa se afasta
  rationale: A forma expressa uma afirmação proverbial genérica. “A pessoa se afasta” é corrente e inclusivo em português, sem introduzir um sujeito específico ausente do hebraico.
- source_word: מֵרָע
  choice: do mal
  rationale: Neste contexto sapiencial, רָע se refere ao mal moral. “Do mal” é conciso e preserva o contraste ético.
theological_decisions:
- issue: Se o primeiro membro ensina mérito humano como causa do perdão
  choice: 'Manter a construção passiva e o agente não declarado: “a iniquidade é expiada”.'
  alternative: Explicitar que Deus expia por seu amor e fidelidade, ou afirmar que as virtudes humanas obtêm expiação.
  rationale: יְכֻפַּר não identifica o agente. A tradução não resolve se o foco recai na ação divina, no papel dessas virtudes pactuais ou na relação entre ambos.
- issue: Sentido de חֶסֶד וֶאֱמֶת
  choice: “amor leal e fidelidade”
  alternative: “amor leal e verdade”
  rationale: A combinação frequentemente descreve lealdade e confiabilidade relacionais, mas אֱמֶת também admite legitimamente “verdade”; essa possibilidade é registrada em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: “Yahweh” preserva o nome próprio no texto em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Amor leal” evita o tom excessivamente técnico de “amor pactual”; “a pessoa” expressa naturalmente o sujeito genérico. A ordem dos marcadores segue a ordem das questões no texto.
