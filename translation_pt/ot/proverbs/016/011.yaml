  text: פֶּ֤לֶס וּ/מֹאזְנֵ֣י מִ֭שְׁפָּט לַֽ/יהוָ֑ה מַ֝עֲשֵׂ֗/הוּ כָּל אַבְנֵי כִֽיס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/011.yaml
  text: A just balance and scales belong to Yahweh[a]; all the weights in the bag are his work.
translation:
  language: pt
  text: Uma balança justa e pratos justos pertencem a Yahweh; todos os pesos da bolsa[a] são obra dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todas as pedras da bolsa”. Essas pedras eram usadas como pesos para medir.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּלֶס
  choice: balança
  rationale: Designa um instrumento de pesagem. “Balança” é claro e natural em português e preserva a imagem comercial.
- source_word: וּמֹאזְנֵי מִשְׁפָּט
  choice: e os pratos justos
  rationale: מֹאזְנַיִם designa a balança de dois pratos; no paralelismo, “pratos” evita repetir “balança”. מִשְׁפָּט qualifica a pesagem como conforme à justiça, daí “justos”.
- source_word: לַיהוָה
  choice: pertencem a Yahweh
  rationale: A preposição לְ exprime aqui pertença ou domínio. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: מַעֲשֵׂהוּ
  choice: são obra dele
  rationale: Preserva a formulação ampla do hebraico, segundo a qual os padrões de peso dependem da ação e da ordem estabelecida por Deus.
- source_word: כָּל אַבְנֵי כִיס
  choice: todos os pesos da bolsa
  rationale: Literalmente, “todas as pedras da bolsa”; no contexto comercial, são pedras calibradas usadas como pesos. “Bolsa” comunica o recipiente portátil em que eram guardadas.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Alcance da afirmação sobre pesos e medidas
  choice: Os padrões justos de pesagem pertencem à autoridade e à ordem de Yahweh.
  alternative: Deus apenas criou fisicamente os pesos; ou Deus aprova indiscriminadamente quaisquer padrões comerciais.
  rationale: A presença de מִשְׁפָּט, “justiça”, situa a declaração no campo moral do comércio honesto, sem exigir uma afirmação mais ampla que o texto.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em âmbito internacional. “Pratos” refere-se aos pratos da balança e mantém a distinção lexical entre os dois termos hebraicos para o instrumento de pesagem.
