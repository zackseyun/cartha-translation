  register: Português moderno, claro e digno, com boa legibilidade brasileira. A primeira oração foi formulada de maneira idiomática; a segunda preserva a imagem hebraica da “doçura dos lábios”. O marcador da nota foi colocado após a expressão ambígua a que se refere.
