base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/021.yaml
  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
translation:
  language: pt
  text: Quem tem o coração sábio é chamado de prudente, e a doçura dos lábios aumenta o aprendizado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acrescenta persuasão” ou “acrescenta instrução”. O termo hebraico pode indicar o aprendizado recebido, a instrução ou o efeito de um ensino persuasivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  choice: Quem tem o coração sábio
  rationale: Expressa de modo natural em português o idiomatismo hebraico que descreve uma pessoa dotada de sabedoria interior, preservando a imagem do coração.
- source_word: יִקָּרֵא
  choice: é chamado
  rationale: O nifal tem sentido passivo ou resultativo; o presente é adequado ao caráter geral do provérbio.
- source_word: נָבוֹן
  choice: prudente
  rationale: נָבוֹן designa alguém que possui entendimento e discernimento; “prudente” é corrente e natural em português neste contexto sapiencial.
- source_word: וּמֶתֶק שְׂפָתַיִם
  choice: e a doçura dos lábios
  rationale: Mantém a metáfora poética hebraica, na qual os lábios representam a fala agradável.
- source_word: יֹסִיף
  choice: aumenta
  rationale: O hifil de יסף significa acrescentar ou aumentar; aqui indica que a fala agradável amplia o efeito expresso por לֶקַח.
- source_word: לֶקַח
  choice: a capacidade de aprender
  rationale: לֶקַח pode indicar aprendizado recebido, instrução ou poder persuasivo. A formulação torna o sentido de “aprendizado” idiomático em português, sem excluir as alternativas registradas em nota.
theological_decisions: []
