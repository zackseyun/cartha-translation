  text: בְּ/אוֹר פְּנֵי מֶ֥לֶךְ חַיִּ֑ים וּ֝/רְצוֹנ֗/וֹ כְּ/עָ֣ב מַלְקֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/015.yaml
  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
translation:
  language: pt
  text: Na luz do rosto do rei há vida[b], e seu favor é como uma nuvem de chuva da primavera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais formal, “uma nuvem de chuva tardia”.
    reason: lexical_alternative
  - marker: b
    text: A imagem é a da expressão favorável e da boa vontade do rei trazendo vida e bênção, assim como a chuva benéfica do fim da estação para as plantações.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/אוֹר
  choice: Na luz
  rationale: Preserva a imagem hebraica de luz e forma, com פְּנֵי, uma expressão natural em português.
- source_word: פְּנֵי
  choice: do rosto
  rationale: Traduz literalmente a imagem concreta do rosto do rei, cuja expressão manifesta sua disposição favorável; “presença” seria mais interpretativo.
- source_word: מֶלֶךְ
  choice: do rei
  rationale: Correspondência lexical direta, com o artigo exigido naturalmente pela construção portuguesa.
- source_word: חַיִּים
  choice: há vida
  rationale: O substantivo plural hebraico tem sentido idiomático de “vida”; “há” torna natural a oração nominal sem ampliar seu conteúdo.
- source_word: וּ/רְצוֹנ/וֹ
  choice: e seu favor
  rationale: רָצוֹן denota favor, boa vontade ou aceitação; “favor” se ajusta ao contexto régio e ao paralelismo.
- source_word: כְּ/עָב
  choice: é como uma nuvem de
  rationale: Expressa de modo natural a comparação introduzida por כְּ, mantendo a imagem da nuvem.
- source_word: מַלְקוֹשׁ
  choice: chuva da primavera
  rationale: Refere-se à chuva tardia da estação, vital para o amadurecimento das plantações; “chuva da primavera” comunica o sentido agrícola ao leitor moderno, enquanto a forma mais literal aparece em nota.
theological_decisions: []
