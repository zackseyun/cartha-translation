  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/025.yaml
  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: pt
  text: Há caminho que parece certo a alguém, mas seu fim são caminhos de morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ דֶּרֶךְ
  choice: Há caminho
  rationale: Reproduz de modo conciso a construção existencial hebraica e mantém o tom proverbial.
- source_word: יָשָׁר
  choice: reto
  rationale: Preserva a imagem moral e espacial de algo direito/correto, sem reduzir o sentido a uma mera impressão subjetiva.
- source_word: לִפְנֵי אִישׁ
  choice: diante de uma pessoa
  rationale: Traduz formalmente 'diante de' e entende אִישׁ aqui de modo genérico, com linguagem natural e inclusiva em português.
- source_word: אַחֲרִיתָהּ
  choice: seu fim
  rationale: Mantém a referência feminina ao caminho e expressa o desfecho ou resultado final.
- source_word: דַּרְכֵי מָוֶת
  choice: caminhos de morte
  rationale: Conserva o plural marcante do hebraico, em vez de normalizá-lo para o singular.
theological_decisions:
- issue: Contraste entre aparência humana e resultado mortal
  choice: parece reto diante de uma pessoa
  alternative: é reto diante de uma pessoa
  rationale: No contexto proverbial, a expressão comunica avaliação humana, não uma declaração divina de retidão objetiva; 'parece' torna explícita essa força sem eliminar a formulação 'diante de'.
- issue: Plural no desfecho
  choice: caminhos de morte
  alternative: caminho da morte
  rationale: O plural hebraico pode intensificar ou ampliar as consequências fatais; preservá-lo mantém a tensão e a forma do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação é concisa e proverbial; evita linguagem denominacional e conserva o plural incomum do original.
