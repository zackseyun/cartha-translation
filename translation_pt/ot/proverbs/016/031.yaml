id: PRO.16.31
reference: Proverbs 16:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֲטֶ֣רֶת תִּפְאֶ֣רֶת שֵׂיבָ֑ה בְּ/דֶ֥רֶךְ צְ֝דָקָ֗ה תִּמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
translation:
  language: pt
  text: Os cabelos brancos são uma coroa de glória[b]; encontram-se no caminho da justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na vereda da justiça”. A expressão hebraica descreve um curso de vida marcado pela justiça.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, os cabelos brancos são honrosos quando acompanham uma vida justa. O provérbio apresenta um princípio geral de sabedoria, não uma promessa absoluta de vida longa para toda pessoa justa.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: O substantivo designa uma coroa ou adorno que circunda. “Coroa” preserva de modo natural a metáfora de honra.
- source_word: תִּפְאֶרֶת
  choice: glória
  rationale: O termo pode expressar beleza, esplendor, honra ou glória. “Glória” mantém o tom elevado da construção hebraica “coroa de glória”.
- source_word: שֵׂיבָה
  choice: cabelos brancos
  rationale: O substantivo se refere concretamente às cãs e, por extensão, à velhice. “Cabelos brancos” conserva a imagem hebraica em linguagem moderna e amplamente compreensível.
- source_word: בְּדֶרֶךְ
  choice: no caminho
  rationale: A expressão hebraica usa a imagem de um caminho para indicar o curso ou modo de vida. “No caminho” preserva a metáfora sem perder clareza.
- source_word: צְדָקָה
  choice: justiça
  rationale: O termo abrange retidão, justiça e conduta correta. “Justiça” é conciso e preserva a amplitude ética do hebraico, sem reduzir a expressão apenas a comportamento individual.
- source_word: תִּמָּצֵא
  choice: encontram-se
  rationale: A forma nifal de מצא significa literalmente “é encontrada”. A concordância portuguesa exige o plural com “cabelos brancos”; a formulação preserva a ambiguidade entre serem achados e caracteristicamente pertencerem a esse caminho de vida.
theological_decisions:
- issue: Força interpretativa do segundo membro do provérbio
  choice: Apresentar os cabelos brancos como honra associada ao caminho da justiça, mantendo a formulação proverbial geral.
  alternative: Entender o versículo como declaração de que toda velhice é honrosa ou como promessa absoluta de que a justiça sempre garante longevidade.
  rationale: A tradução literal do segundo membro preserva a tensão do hebraico. Como máxima sapiencial, o verso expressa uma relação característica, sem precisar convertê-la em garantia mecânica nem em afirmação universal sobre toda pessoa idosa.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário compreensível tanto no Brasil como em outros contextos lusófonos. A construção paralela e a metáfora do caminho foram preservadas.
