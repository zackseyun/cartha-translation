revisions:
- from: Confie a Javé tudo o que você faz,[a] e seus planos serão firmados.[b]
  to: Entregue a Javé suas obras,[a] e seus planos[b] serão estabelecidos.
  rationale: A revisão conserva o nome divino e a promessa proverbial, mas substitui uma paráfrase mais ampla por “suas obras”, termo que corresponde diretamente a מַעֲשֶׂיךָ. “Entregue” traduz de forma idiomática e próxima o imperativo metafórico גֹּל, e “serão estabelecidos” explicita o sentido passivo/resultativo de וְיִכֹּנוּ. As notas preservam a metáfora hebraica e a alternativa semântica de מַחְשְׁבֹתֶיךָ, com âncoras junto aos termos pertinentes.
