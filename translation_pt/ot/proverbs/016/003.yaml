  text: גֹּ֣ל אֶל יְהוָ֣ה מַעֲשֶׂ֑י/ךָ וְ֝/יִכֹּ֗נוּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
translation:
  language: pt
  text: Entregue a Javé suas obras,[a] e seus planos[b] serão estabelecidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “Role suas obras para Javé”; a expressão significa entregá-las aos cuidados dele.'
    reason: lexical_alternative
  - marker: b
    text: Ou “seus pensamentos” ou “seus propósitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Confie
  rationale: O imperativo significa literalmente “role”, mas, nesta construção com אֶל יְהוָה, expressa a ideia idiomática de entregar algo aos cuidados de Deus. “Confie” comunica isso de modo natural em português.
- source_word: אֶל
  choice: a
  rationale: 'Marca a direção da entrega: aquilo que se faz é confiado a Javé. A construção “confiar a” é idiomática e clara.'
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma portuguesa corrente o nome divino יהוה, em vez de substituí-lo pelo título “SENHOR”.
- source_word: מַעֲשֶׂיךָ
  choice: tudo o que você faz
  rationale: O substantivo abrange obras, ações e empreendimentos. A formulação comunica naturalmente essa amplitude sem restringi-la a atos morais ou trabalhos específicos.
- source_word: וְיִכֹּנוּ
  choice: serão firmados
  rationale: O nifal de כון indica que algo é estabelecido, consolidado ou tornado firme. “Serão firmados” conserva a voz passiva e o resultado expresso pelo hebraico.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: seus planos
  rationale: O termo pode indicar pensamentos, propósitos ou planos. No paralelismo com as ações confiadas a Javé, “planos” exprime bem o sentido prático, sem excluir totalmente a noção de propósito.
theological_decisions:
- issue: Relação entre a ação humana e o estabelecimento divino
  choice: A exortação manda confiar a Javé aquilo que se faz e afirma como resultado que os planos serão firmados.
  alternative: Ler o texto como garantia de êxito material em todo empreendimento ou como afirmação de que Deus fixa unilateralmente todos os planos, independentemente da resposta humana.
  rationale: O provérbio afirma confiança e estabelecimento, mas não desenvolve uma doutrina completa da providência nem promete sucesso mundano irrestrito. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O tratamento por “você” evita formas regionais de segunda pessoa; “Javé” preserva o nome divino. As notas mantêm a metáfora hebraica e a amplitude lexical de מַחְשְׁבֹתֶיךָ.
