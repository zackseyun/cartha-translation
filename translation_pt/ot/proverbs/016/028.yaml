  text: אִ֣ישׁ תַּ֭הְפֻּכוֹת יְשַׁלַּ֣ח מָד֑וֹן וְ֝/נִרְגָּ֗ מַפְרִ֥יד אַלּֽוּף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
translation:
  language: pt
  text: O homem perverso provoca discórdia,[a] e o que espalha boatos[b] separa amigos íntimos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espalha contenda”. O verbo hebraico significa literalmente “envia” ou “solta”, e תַּהְפֻּכוֹת pode ser traduzido por “perversidade” ou “tortuosidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o mexeriqueiro” ou “o difamador”. O hebraico נִרְגָּן se refere a quem fala de modo dissimulado e prejudica relacionamentos.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “um amigo íntimo” ou “um companheiro próximo”. O plural expressa a aplicação geral do provérbio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ תַּהְפֻּכוֹת
  choice: o homem perverso
  rationale: Expressa naturalmente em português a construção hebraica que descreve um homem caracterizado pela perversidade ou tortuosidade, preservando o masculino singular.
- source_word: יְשַׁלַּח מָדוֹן
  choice: provoca discórdia
  rationale: Embora o verbo signifique literalmente “envia” ou “solta”, com “discórdia” indica pôr o conflito em movimento; “provoca” comunica esse efeito de modo claro e idiomático.
- source_word: נִרְגָּן
  choice: o que espalha boatos
  rationale: Designa quem fala às escondidas ou difunde comentários nocivos. A expressão é corrente e mantém o foco na fala que prejudica relacionamentos.
- source_word: מַפְרִיד
  choice: separa
  rationale: Tradução direta do particípio, que descreve a ação característica dessa pessoa.
- source_word: אַלּוּף
  choice: amigos íntimos
  rationale: Neste contexto, refere-se a companheiro próximo ou amigo íntimo. O plural comunica naturalmente a força geral do provérbio, embora o hebraico esteja no singular.
