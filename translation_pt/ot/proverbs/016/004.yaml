id: PRO.16.4
reference: Proverbs 16:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֤ל פָּעַ֣ל יְ֭הוָה לַֽ/מַּעֲנֵ֑/הוּ וְ/גַם רָ֝שָׁ֗ע לְ/י֣וֹם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
translation:
  language: pt
  text: Yahweh fez tudo para o seu propósito[a], até o perverso para o dia da calamidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para si mesmo”. A expressão hebraica também pode ser entendida como: “Yahweh fez tudo para si mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para o dia da desgraça” ou “para um dia de mal”. Aqui, “mal” significa calamidade ou ruína, não maldade moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: tudo
  rationale: Expressa de modo natural e abrangente o sentido de “tudo, todas as coisas”.
- source_word: פָּעַל
  choice: fez
  rationale: Neste contexto, com Yahweh como sujeito e “tudo” como objeto, comunica naturalmente sua ação deliberada, sem limitar o enunciado apenas à criação inicial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לַמַּעֲנֵהוּ
  choice: para o seu propósito
  rationale: A expressão é difícil e pode significar literalmente algo como “para sua resposta”. Aqui, “propósito” transmite melhor a ideia contextual de uma finalidade correspondente; “seu” mantém em português a ambiguidade possível entre o propósito próprio de cada coisa e o propósito de Yahweh, explicitada em nota.
- source_word: וְגַם
  choice: até
  rationale: Marca a extensão enfática do enunciado geral ao caso surpreendente do perverso.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado singular tem sentido genérico e representa a pessoa moralmente perversa.
- source_word: לְיוֹם רָעָה
  choice: para o dia da calamidade
  rationale: Neste contexto, רָעָה indica desgraça, ruína ou calamidade, e não maldade moral.
theological_decisions:
- issue: Se o versículo afirma que Deus criou a maldade moral ou que ordena todas as coisas para uma finalidade
  choice: O texto declara que Yahweh fez ou ordenou tudo para uma finalidade, incluindo o perverso para o dia da calamidade.
  alternative: Yahweh fez tudo para si mesmo, até o perverso para o dia do mal.
  rationale: A tradução preserva a forte afirmação de soberania divina e sua tensão teológica, mas não transforma “calamidade” em maldade moral nem afirma além do que a formulação hebraica exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Perverso” conserva o caráter moral de רָשָׁע; “calamidade” evita a interpretação indevida de רָעָה como maldade moral. A colocação dos marcadores segue as expressões às quais as notas se referem.
