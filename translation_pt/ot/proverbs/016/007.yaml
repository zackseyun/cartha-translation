  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
translation:
  language: pt
  text: Quando os caminhos de um homem[a] agradam ao SENHOR, ele faz com que até os seus inimigos estejam em paz com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma pessoa”. O hebraico diz literalmente “de um homem”, com sentido representativo e genérico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְצוֹת
  choice: Quando ... agradam
  rationale: A preposição בְּ com o infinitivo construto de רצה introduz uma circunstância temporal. A construção portuguesa é natural e mantém a ideia de obter o agrado divino.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Emprega a forma portuguesa tradicional para o Tetragrama, distinguindo-a tipograficamente como representação do nome divino.
- source_word: דַּרְכֵי אִישׁ
  choice: os caminhos de um homem
  rationale: “Caminhos” expressa conduta ou modo de viver. אִישׁ está no masculino singular, mas tem aqui sentido representativo e genérico, esclarecido em nota.
- source_word: גַּם
  choice: até
  rationale: 'Comunica a força enfática: a consequência alcança até mesmo os inimigos.'
- source_word: אֹיְבָיו
  choice: os seus inimigos
  rationale: Tradução direta do substantivo plural com sufixo possessivo.
- source_word: יַשְׁלִם
  choice: faz que ... vivam em paz
  rationale: 'O hifil de שלם tem neste contexto sentido causativo: fazer estar ou viver em paz. A formulação evita a rigidez de “faz estar em paz”.'
- source_word: אִתּוֹ
  choice: com ele
  rationale: Preserva a relação expressa pela preposição na construção relativa à paz.
theological_decisions:
- issue: Sentido genérico de אִישׁ
  choice: um homem
  alternative: uma pessoa
  rationale: Mantém a forma masculina singular do hebraico sem restringir o provérbio exclusivamente aos homens; a nota explicita seu alcance representativo.
- issue: Representação de יְהוָה
  choice: o SENHOR
  alternative: Yahweh; Jeová
  rationale: Segue a convenção portuguesa de representar o nome divino pelo título em versaletes, sem introduzir uma vocalização disputada no texto principal.
- issue: Sujeito de יַשְׁלִם
  choice: ele
  alternative: o SENHOR
  rationale: O contexto aponta para o SENHOR como agente, mas o hebraico usa apenas a forma verbal sem repetir o sujeito. O pronome conserva essa estrutura e a leve ambiguidade formal do original.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. “Vivam em paz” transmite de modo idiomático a nuance causativa de יַשְׁלִם; “SENHOR” deve ser composto em versaletes na edição final.
