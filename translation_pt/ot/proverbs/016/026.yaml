  text: The appetite of a laborer labors for him[c][b][a], for his mouth presses him on.
translation:
  language: pt
  text: O apetite do trabalhador trabalha para ele[a][b], pois sua boca o impele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A alma do trabalhador trabalha para ele”, “A vida do trabalhador trabalha para ele” ou “O desejo do trabalhador trabalha para ele”. O termo hebraico néfesh pode ter esses sentidos; aqui, a menção à boca favorece “apetite”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para si mesmo”. O hebraico diz “para ele”, mas a expressão pode ser entendida em sentido reflexivo.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “o pressiona”, “o impulsiona” ou “o obriga”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: apetite
  rationale: Neste contexto, נֶפֶשׁ designa o apetite ou a necessidade que anima a pessoa, e a referência paralela à boca favorece “apetite” em vez de “alma”.
- source_word: עָמֵל
  choice: quem trabalha
  rationale: Expressão natural e amplamente compreensível para aquele que labuta, embora atenue a forma nominal do hebraico.
- source_word: עָמְלָה
  choice: trabalha
  rationale: Preserva, tanto quanto possível em português corrente, o jogo de palavras entre עָמֵל e o verbo da mesma raiz.
- source_word: לּוֹ
  choice: por ele
  rationale: Reproduz o sentido direto da preposição com sufixo de terceira pessoa; o possível sentido reflexivo é registrado em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural a razão pela qual a pessoa trabalha.
- source_word: אָכַף
  choice: impulsiona
  rationale: Comunica a pressão exercida pela necessidade, sem tornar a formulação excessivamente dura; alternativas como “pressiona”, “impele” ou “obriga” permanecem possíveis.
- source_word: עָלָיו
  choice: o
  rationale: É incorporado idiomaticamente ao objeto de “impulsiona”, transmitindo a pressão exercida sobre o trabalhador.
- source_word: פִּיהוּ
  choice: sua boca
  rationale: Mantém a imagem literal e personificada do hebraico, em vez de substituí-la interpretativamente por “fome”.
