id: PRO.16.32
reference: Proverbs 16:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
translation:
  language: pt
  text: Melhor é quem demora a irar-se[a] do que o valente, e quem domina o seu espírito[b] do que quem conquista uma cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quem é paciente»; literalmente, «longo de narinas», expressão hebraica que significa demorar a irar-se.
    reason: lexical_alternative
  - marker: b
    text: Ou «seu temperamento» ou «a si mesmo».
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: Introduz de modo natural a comparação característica da literatura sapiencial e preserva a forma proverbial do hebraico.
- source_word: אֶרֶךְ אַפַּיִם
  choice: quem demora a irar-se
  rationale: Expressa com clareza o sentido do idioma hebraico, literalmente «longo de narinas», sem reduzir seu significado ao termo mais amplo «paciente».
- source_word: מִגִּבּוֹר
  choice: do que o valente
  rationale: גִּבּוֹר designa alguém forte, poderoso ou valoroso, muitas vezes com conotação militar. «O valente» é conciso, digno e mantém essa amplitude.
- source_word: וּמֹשֵׁל
  choice: e quem domina
  rationale: O particípio descreve uma característica contínua. «Domina» comunica governo efetivo e forma um paralelo natural com a primeira oração.
- source_word: בְּרוּחוֹ
  choice: o seu espírito
  rationale: Mantém a amplitude de רוּחַ, que aqui aponta para a disposição e os impulsos interiores, sem estreitar o sentido para «temperamento» nem ampliá-lo para «a si mesmo».
- source_word: מִלֹּכֵד עִיר
  choice: do que quem conquista uma cidade
  rationale: Preserva a imagem militar concreta de capturar ou tomar uma cidade e o contraste entre conquista exterior e domínio interior.
theological_decisions:
- issue: Sentido antropológico de רוּחַ no contexto sapiencial
  choice: «seu espírito», referindo-se à disposição e aos impulsos interiores da pessoa sob domínio
  alternative: «seu temperamento» ou «a si mesmo»
  rationale: '«Espírito» preserva a extensão semântica e a tensão do hebraico: «temperamento» seria mais estreito, enquanto «a si mesmo» seria uma paráfrase mais abrangente.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo proverbial e a imagem da conquista militar, evitando linguagem excessivamente arcaica ou explicitação doutrinária.
