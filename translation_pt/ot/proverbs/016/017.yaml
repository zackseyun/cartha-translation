  yaml_path: translation/ot/proverbs/016/017.yaml
  text: The highway of the upright turns away from evil[b][a]; he who guards his life watches over his way.
translation:
  language: pt
  text: A estrada dos íntegros é afastar-se do mal[a]; quem guarda a própria vida[b] vigia o seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A estrada dos íntegros se afasta do mal.” O hebraico permite entender a expressão tanto como definição da estrada quanto como descrição de seu rumo.'
    reason: syntactic_alternative
  - marker: b
    text: 'Hebraico: “sua néfesh”; aqui, o termo provavelmente significa “sua vida” ou “a si mesmo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלַּת
  choice: estrada
  rationale: מְסִלָּה designa uma via preparada ou elevada; “estrada” preserva a imagem marcada e soa mais natural em português amplo do que “via elevada”.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: O adjetivo descreve pessoas moralmente retas. “Íntegros” comunica o sentido ético sem confundi-lo com termos hebraicos mais específicos para justiça.
- source_word: סוּר מֵרָע
  choice: afastar-se do mal
  rationale: O infinitivo funciona como predicado ou explicação da estrada dos íntegros. A expressão verbal preserva a ideia de abandonar ou evitar o mal.
- source_word: רָע
  choice: mal
  rationale: Neste contexto sapiencial, o termo tem sentido moral; “mal” é direto, corrente e adequado ao contraste ético.
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: quem guarda a própria vida
  rationale: נֶפֶשׁ refere-se aqui à vida ou à própria pessoa, não necessariamente a uma alma imaterial em sentido técnico.
- source_word: נֹצֵר דַּרְכּוֹ
  choice: vigia o seu caminho
  rationale: נצר expressa guardar com atenção. “Vigia” distingue o verbo de שׁמר no primeiro membro e mantém “caminho” como metáfora sapiencial da conduta.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto sapiencial
  choice: vida, isto é, a própria pessoa em sua existência
  alternative: alma
  rationale: O provérbio trata de conduta prudente e preservação pessoal. “Vida” evita impor uma dicotomia técnica entre corpo e alma que o hebraico não exige.
- issue: Relação sintática entre “estrada” e “afastar-se do mal”
  choice: 'oração nominal explicativa: “é afastar-se do mal”'
  alternative: 'oração verbal personificada: “afasta-se do mal”'
  rationale: O hebraico permite compreender o infinitivo como aquilo em que consiste a estrada dos íntegros. A forma escolhida preserva mais claramente essa estrutura e evita atribuir literalmente à estrada a ação de se afastar.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém o paralelismo sapiencial, distingue os dois verbos de guardar e conserva a ambiguidade sintática por meio de nota.
