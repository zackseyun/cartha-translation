  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
translation:
  language: pt
  text: A ira do rei são mensageiros de morte[a], mas o sábio a apaziguará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “mensageiros” também pode significar “anjos”; aqui, provavelmente se refere a agentes enviados pelo rei.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico vem da mesma raiz frequentemente traduzida como “fazer expiação”. Neste contexto, significa apaziguar ou afastar a ira do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: ira
  rationale: O substantivo expressa ardor de cólera. “Ira” mantém o tom elevado e grave do provérbio e combina com a ameaça de morte.
- source_word: מֶלֶךְ
  choice: rei
  rationale: É o sentido concreto e direto do hebraico no contexto político e cortesão.
- source_word: מַלְאֲכֵי מָוֶת
  choice: traz mensageiros de morte
  rationale: מַלְאָךְ pode designar mensageiro humano ou anjo. Aqui, a imagem da corte favorece agentes do rei. A inserção idiomática de “traz” torna natural em português a construção nominal hebraica sem eliminar a metáfora.
- source_word: וְאִישׁ חָכָם
  choice: mas o sábio
  rationale: O waw tem valor adversativo entre os dois membros. “O sábio” é uma formulação proverbial natural e representa o masculino singular hebraico sem sugerir que se trate de um indivíduo previamente mencionado.
- source_word: יְכַפְּרֶנָּה
  choice: a apaziguará
  rationale: No piel, כפר pode indicar expiação ou apaziguamento conforme o contexto. Como o sufixo feminino retoma “ira”, aqui o sentido é desviar ou acalmar essa ira, não realizar um rito cultual.
theological_decisions:
- issue: Se כפר deve receber linguagem cultual de expiação ou linguagem não cultual de apaziguamento
  choice: “a apaziguará”
  alternative: “fará expiação por ela” ou “a aplacará”
  rationale: O contexto imediato trata da ira real, não de sacrifício ou culto. “Apaziguará” comunica o afastamento da ira sem introduzir teologia ritual, enquanto a nota preserva a ligação lexical com o vocabulário de expiação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem antitética do provérbio foi preservada. “Traz” explicita de modo idiomático a relação predicativa da primeira oração hebraica; “o sábio” evita a expressão menos natural “um homem sábio” sem apagar a forma proverbial singular.
