id: PRO.16.2
reference: Proverbs 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּֽל דַּרְכֵי אִ֭ישׁ זַ֣ךְ בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן רוּח֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/002.yaml
  text: All a man's ways are pure in his own eyes[b][a], but Yahweh weighs the spirits.
translation:
  language: pt
  text: Todos os caminhos de um homem são puros aos seus próprios olhos, mas Yahweh pesa os espíritos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas Yahweh examina os espíritos”; ou: “mas Yahweh avalia as motivações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: O quantificador abrange a totalidade dos caminhos; “todos” concorda naturalmente com o substantivo plural em português.
- source_word: דַּרְכֵי אִישׁ
  choice: os caminhos de um homem
  rationale: Em literatura de sabedoria, “caminhos” representa a conduta ou o curso de vida. “Um homem” preserva o masculino singular representativo do hebraico.
- source_word: זַךְ
  choice: puros
  rationale: Expressa a ideia de pureza ou limpeza moral na autoavaliação, sem acrescentar o sentido jurídico mais forte de “inocentes”.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Reproduz de modo natural o idioma hebraico que indica a avaliação que a pessoa faz de si mesma.
- source_word: וְתֹכֵן
  choice: pesa
  rationale: Preserva a metáfora hebraica de medir ou pesar e destaca a avaliação precisa de Yahweh em contraste com a autoavaliação humana.
- source_word: רוּחוֹת
  choice: os espíritos
  rationale: Mantém a imagem e a amplitude antropológica do plural hebraico, que neste contexto aponta para a dimensão interior ou disposição das pessoas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido antropológico de רוּחוֹת
  choice: os espíritos humanos, entendidos como a dimensão interior ou as disposições que Yahweh avalia
  alternative: as motivações; as disposições interiores
  rationale: O contraste com a percepção que o homem tem dos próprios caminhos favorece uma referência à interioridade humana. “Espíritos” conserva a amplitude e a tensão do hebraico; “motivações” seria mais restrito e interpretativo.
- issue: Masculino representativo אִישׁ
  choice: um homem
  alternative: uma pessoa; o ser humano
  rationale: Preserva o masculino singular gramatical do original, empregado de forma representativa, sem negar a aplicação universal do provérbio.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo antitético e a metáfora de pesar. O marcador [a] aparece no texto principal.
