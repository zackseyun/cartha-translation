  text: תּוֹעֲבַ֣ת מְ֭לָכִים עֲשׂ֣וֹת רֶ֑שַׁע כִּ֥י בִ֝/צְדָקָ֗ה יִכּ֥וֹן כִּסֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
translation:
  language: pt
  text: É abominável que os reis pratiquem a maldade, pois um trono se firma pela retidão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: é abominável
  rationale: Expressa com naturalidade o forte juízo moral de algo detestável, preservando a concisão proverbial.
- source_word: מְלָכִים
  choice: para os reis
  rationale: Mantém o plural simples e a relação construta do hebraico sem ampliar o referente para governantes em geral.
- source_word: עֲשׂוֹת
  choice: praticar
  rationale: O infinitivo de עשה é vertido por um infinitivo natural em português; “praticar” combina idiomaticamente com “maldade”.
- source_word: רֶשַׁע
  choice: a maldade
  rationale: Preserva a dimensão moral do termo, sendo mais forte que “erro” e mais específica no contexto que o genérico “mal”.
- source_word: כִּי
  choice: pois
  rationale: Introduz de forma concisa a razão que fundamenta a primeira afirmação.
- source_word: בִצְדָקָה
  choice: pela retidão
  rationale: A preposição indica meio ou fundamento. “Retidão” conserva aqui a qualidade moral ampla de צדקה; “justiça” é mantida em nota por sua especial pertinência ao governo real.
- source_word: יִכּוֹן
  choice: se firma
  rationale: Reproduz o sentido nifal de tornar-se ou permanecer firme, com linguagem natural aplicada à estabilidade do trono.
- source_word: כִּסֵּא
  choice: o trono
  rationale: O substantivo singular tem valor genérico; em português, o artigo definido exprime naturalmente essa generalização proverbial.
theological_decisions:
- issue: Sentido de צדקה no contexto da sabedoria régia
  choice: retidão
  alternative: justiça
  rationale: “Retidão” destaca a qualidade moral ampla que sustenta o reinado, enquanto “justiça” explicita a dimensão judicial e governamental presente no contexto. A alternativa é preservada em nota para não reduzir a amplitude do termo.
- issue: Relação de תּוֹעֲבַת com מְלָכִים
  choice: abominável para os reis
  alternative: uma abominação que os reis pratiquem a maldade
  rationale: A construção nominal hebraica pode ser entendida como aquilo que é abominável aos reis ou, de modo normativo, como o caráter abominável de reis fazerem o mal. A formulação escolhida acompanha de perto a estrutura hebraica sem explicar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial concisa. “Se firma” é corrente e comunica estabilidade sem tecnicismo; “retidão” preserva o peso moral do original, e a nota registra a leitura governamental “justiça”.
