  text: בַּ֭/חֵיק יוּטַ֣ל אֶת הַ/גּוֹרָ֑ל וּ֝/מֵ/יְהוָ֗ה כָּל מִשְׁפָּטֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/033.yaml
  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
translation:
  language: pt
  text: A sorte é lançada no colo, mas cada decisão[a] dela vem de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada veredito” ou “cada julgamento”. O termo hebraico também pode ter sentido judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֵיק
  choice: no colo
  rationale: חֵיק designa literalmente o peito, o colo ou a dobra da roupa. Neste contexto, “no colo” mantém de modo claro e concreto o lugar onde se lançava a sorte.
- source_word: יוּטַל
  choice: é lançada
  rationale: A forma passiva do verbo expressa que a sorte é lançada. A escolha preserva tanto a voz passiva quanto a concisão do hebraico.
- source_word: הַגּוֹרָל
  choice: a sorte
  rationale: גּוֹרָל refere-se ao objeto ou procedimento usado para tomar uma decisão por sorteio. “A sorte” é a expressão portuguesa tradicional e suficientemente abrangente, sem especificar indevidamente o objeto usado.
- source_word: וּמֵיְהוָה
  choice: mas ... vem de Yahweh
  rationale: Embora ו possa ser traduzido por “e”, “mas” explicita o contraste contextual entre o ato humano de lançar a sorte e a origem de sua decisão. מֵ indica procedência, expressa naturalmente por “vem de”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל
  choice: cada
  rationale: 'Com o substantivo singular, כָּל tem sentido distributivo: cada decisão produzida pela sorte está em vista.'
- source_word: מִשְׁפָּטוֹ
  choice: decisão dela
  rationale: מִשְׁפָּט pode significar decisão, veredito ou julgamento. No contexto do lançamento de sortes, “decisão” comunica naturalmente o resultado determinante, enquanto “dela” preserva o sufixo pronominal que remete à sorte.
theological_decisions:
- issue: Soberania divina em relação a acontecimentos aparentemente aleatórios
  choice: O ser humano lança a sorte, mas cada decisão dela vem de Yahweh.
  alternative: O provérbio poderia ser entendido de modo mais restrito, apenas em relação ao uso sagrado de sortes, ou como uma afirmação geral sobre a providência divina.
  rationale: O hebraico contrasta diretamente o lançamento da sorte com Yahweh como origem de seu מִשְׁפָּט. A tradução mantém essa afirmação sem ampliá-la para além das palavras do provérbio.
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa de provérbio. “No colo” preserva a imagem antiga sem explicação intrusiva; “Yahweh” conserva o nome divino. O marcador da nota foi colocado junto de “decisão”, termo ao qual a alternativa lexical efetivamente se refere.
