  text: טוֹב מְ֭עַט בִּ/צְדָקָ֑ה מֵ/רֹ֥ב תְּ֝בוּא֗וֹת בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/008.yaml
  text: Better a little with righteousness than great income without justice.
translation:
  language: pt
  text: É melhor ter pouco com justiça do que grandes rendimentos sem justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Melhor é ter pouco
  rationale: 'Expressa de modo natural em português a comparação hebraica elíptica: é preferível possuir pouco.'
- source_word: בִּצְדָקָה
  choice: com justiça
  rationale: Preserva o sentido ético de צְדָקָה como conduta justa ou íntegra e mantém o paralelismo com מִשְׁפָּט.
- source_word: רֹב תְּבוּאוֹת
  choice: muitos ganhos
  rationale: תְּבוּאוֹת pode designar produtos, rendimentos ou receitas; no contexto sapiencial, 'ganhos' comunica amplamente a abundância adquirida.
- source_word: בְּלֹא מִשְׁפָּט
  choice: sem retidão
  rationale: Aqui מִשְׁפָּט aponta para o que é justo e correto; 'retidão' evita uma leitura limitada à justiça judicial e produz paralelismo ético natural.
theological_decisions:
- issue: Relação entre prosperidade material e conduta moral
  choice: Manter a afirmação comparativa de que pouco obtido ou possuído com justiça é preferível a ganhos abundantes sem retidão.
  alternative: Entender o versículo como condenação geral da riqueza.
  rationale: O hebraico não condena a abundância em si, mas a contrapõe à justiça quando os ganhos existem sem conduta correta.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A formulação concisa conserva o paralelismo antitético do provérbio e evita linguagem excessivamente técnica.
