  text: אִ֣ישׁ חָ֭מָס יְפַתֶּ֣ה רֵעֵ֑/הוּ וְ֝/הוֹלִיכ֗/וֹ בְּ/דֶ֣רֶךְ לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/029.yaml
  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
translation:
  language: pt
  text: O homem violento alicia o seu próximo[a] e o conduz por um caminho que não é bom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu amigo” ou “seu companheiro”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em um caminho não bom”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: homem
  rationale: Mantém o masculino singular representativo do hebraico e soa natural no gênero proverbial.
- source_word: חָמָס
  choice: violento
  rationale: Na construção אִישׁ חָמָס, descreve alguém caracterizado pela violência ou brutalidade; a forma adjetival é natural em português.
- source_word: יְפַתֶּה
  choice: seduz
  rationale: O piel de פתה indica atrair ou induzir alguém a uma conduta errada. Aqui, “seduz” expressa atração moral enganosa sem exigir um sentido sexual.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode indicar próximo, amigo ou companheiro. “Próximo” conserva a abrangência relacional sem pressupor amizade íntima.
- source_word: וְהוֹלִיכוֹ
  choice: e o conduz
  rationale: Preserva o valor causativo do hifil de הלך — fazer ir, levar — em português corrente e digno.
- source_word: בְּדֶרֶךְ
  choice: por um caminho
  rationale: Mantém a metáfora de דֶּרֶךְ como caminho ou curso de conduta, com uma construção idiomática em português.
- source_word: לֹא טוֹב
  choice: que não é bom
  rationale: Reproduz deliberadamente a formulação hebraica “não bom”, sem intensificá-la interpretativamente para “mau” ou “perverso”.
