  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: pt
  text: Adquirir sabedoria — quanto melhor do que ouro! E adquirir entendimento é preferível à prata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְנֹה / וּקְנוֹת
  choice: adquirir
  rationale: O infinitivo hebraico expressa a obtenção de sabedoria e entendimento; «adquirir» preserva essa ideia de modo natural e mantém o paralelismo.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e abrangente para a capacidade de viver e agir com discernimento.
- source_word: חָרוּץ
  choice: ouro
  rationale: Neste contexto comparativo de metais preciosos, o termo designa ouro, possivelmente ouro refinado.
- source_word: בִּינָה
  choice: entendimento
  rationale: Mantém a distinção paralela em relação a «sabedoria» e comunica discernimento ou compreensão.
- source_word: נִבְחָר
  choice: é preferível
  rationale: O particípio passivo de בחר significa literalmente «é escolhido»; no contexto comparativo, «é preferível» transmite naturalmente aquilo que deve ser escolhido acima de outra coisa.
- source_word: כָּסֶף
  choice: prata
  rationale: Equivalente direto do metal precioso usado no segundo membro do paralelismo.
