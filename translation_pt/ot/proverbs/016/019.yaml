  text: ט֣וֹב שְׁפַל ר֭וּחַ אֶת עניים מֵֽ/חַלֵּ֥ק שָׁ֝לָ֗ל אֶת גֵּאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/019.yaml
  text: Better to be lowly in spirit with the poor than to divide plunder with the proud[a].
translation:
  language: pt
  text: É melhor ser humilde de espírito com os pobres[a] do que repartir o despojo com os orgulhosos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os aflitos” ou “com os humildes”. A palavra hebraica pode se referir aos pobres, aos aflitos ou aos humildes, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: Introduz a avaliação comparativa e preserva a concisão proverbial, com uma formulação natural e digna em português.
- source_word: שְׁפַל רוּחַ
  choice: ser humilde de espírito
  rationale: Expressa uma disposição interior de humildade ou pequenez sem reduzir רוּחַ a uma categoria psicológica moderna.
- source_word: אֶת עניים
  choice: com os pobres
  rationale: אֶת tem sentido associativo neste contexto. עניים pode designar pobres, aflitos ou humildes; “pobres” oferece um contraste social claro com aqueles que repartem despojos, sem eliminar as demais possibilidades, registradas em nota.
- source_word: מֵחַלֵּק
  choice: do que repartir
  rationale: A preposição מִן marca a comparação depois de טוֹב. “Repartir” comunica naturalmente a distribuição do despojo entre participantes.
- source_word: שָׁלָל
  choice: o despojo
  rationale: Designa bens tomados em saque. “Despojo” é preciso, compreensível e adequado ao registro sapiencial.
- source_word: אֶת גֵּאִים
  choice: com os orgulhosos
  rationale: אֶת volta a ter sentido associativo, e גֵּאִים descreve os orgulhosos ou arrogantes. “Orgulhosos” estabelece o contraste direto com “humilde de espírito”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira e alcance internacional. A ordem “Melhor é” mantém a concisão e a dignidade do paralelismo hebraico; a nota preserva a amplitude semântica de עניים.
