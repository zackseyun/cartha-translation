lexical_decisions:
- source_word: אֲשֶׁר
  choice: cujas
  rationale: O pronome relativo retoma o referente plural do versículo anterior e liga-se naturalmente à construção possessiva «suas veredas».
- source_word: אָרְחֹתֵיהֶם
  choice: veredas
  rationale: Preserva a metáfora concreta de um percurso e seu sentido figurado como modo de vida.
- source_word: עִקְּשִׁים
  choice: tortuosas
  rationale: Expressa tanto a imagem de algo não reto quanto a distorção moral, em linguagem corrente e digna.
- source_word: וּנְלוֹזִים
  choice: que se desviam
  rationale: Reproduz o sentido de afastar-se ou virar para o lado sem impor uma caracterização psicológica mais específica, como «enganadores».
- source_word: בְּמַעְגְּלוֹתָם
  choice: em seus caminhos
  rationale: מַעְגָּל designa trilha, curso ou caminho; «caminhos» é natural em português e mantém o paralelismo com «veredas».
