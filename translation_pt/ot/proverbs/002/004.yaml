  text: if you seek it like silver and search for it like hidden treasures[b][a],
translation:
  language: pt
  text: se a buscares como a prata e a procurares como tesouros escondidos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tesouros enterrados”. O termo hebraico pode designar bens valiosos ocultos no solo ou escondidos de outra maneira.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz a condição que continua a instrução do pai; “se” preserva diretamente o valor condicional.
- source_word: תְּבַקְשֶׁנָּה
  choice: a buscares
  rationale: O verbo בקשׁ expressa a ação de buscar. O pronome feminino singular retoma a sabedoria ou a compreensão dos versículos anteriores, e o português permite conservar naturalmente essa referência.
- source_word: כַכָּסֶף
  choice: como a prata
  rationale: O prefixo comparativo כ é expresso naturalmente por “como”; a prata representa algo valioso que se procura com empenho.
- source_word: וְכַמַּטְמוֹנִים
  choice: e como tesouros escondidos
  rationale: מַטְמוֹנִים designa bens valiosos ocultos ou guardados; “tesouros escondidos” conserva tanto a ideia de valor quanto a de ocultação.
- source_word: תַּחְפְּשֶׂנָּה
  choice: a procurares
  rationale: חפשׂ indica procurar de modo atento ou diligente. “Procurar” forma um paralelismo natural com “buscar” e mantém o objeto feminino singular.
theological_decisions: []
