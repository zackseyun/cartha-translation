id: PRO.2.5
reference: Proverbs 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֗ז תָּ֭בִין יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת אֱלֹהִ֣ים תִּמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/005.yaml
  text: Then you will understand the fear of Yahweh and find the knowledge of God[a].
translation:
  language: pt
  text: Então você entenderá o temor de Yahweh e encontrará o conhecimento de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca o resultado lógico e temporal das condições apresentadas nos versículos anteriores; “então” é conciso e natural.
- source_word: תָּבִין
  choice: você entenderá
  rationale: O qal imperfeito na segunda pessoa masculina singular expressa chegar a compreender ou discernir; esta formulação mantém o sentido e fala diretamente ao leitor.
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: Preserva a expressão temática da literatura sapiencial, sem reduzir “temor” a mero respeito, e translitera diretamente o nome divino.
- source_word: וְדַעַת אֱלֹהִים
  choice: e ... o conhecimento de Deus
  rationale: Mantém o paralelismo entre compreender e encontrar, traduzindo דַּעַת por “conhecimento” e אֱלֹהִים como referência ao Deus verdadeiro.
- source_word: תִּמְצָא
  choice: encontrará
  rationale: Conserva o sentido comum de מצא e a imagem de busca dos versículos anteriores.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; “Javé” seria uma adaptação portuguesa possível.
- issue: Sentido de יִרְאַת יְהוָה
  choice: temor de Yahweh
  alternative: reverência por Yahweh
  rationale: “Temor” preserva a amplitude e a tensão teológica da expressão hebraica, que inclui reverência sem se limitar a ela.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O pronome “você” explicita naturalmente a segunda pessoa masculina singular do hebraico. Não se adotou a nota alternativa da camada inglesa, pois ela não apresenta correspondência clara nem apoio no texto hebraico fornecido.
