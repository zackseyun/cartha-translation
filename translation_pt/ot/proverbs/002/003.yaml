  text: sim[a], se você clamar por entendimento e erguer a voz por discernimento,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de fato, se você clamar por discernimento e erguer a voz por entendimento”. Os dois termos hebraicos ligados à sabedoria são quase sinônimos e também podem ser traduzidos na ordem inversa sem mudança importante de sentido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: sim, se
  rationale: A expressão dá continuidade enfática à condição iniciada nos versículos anteriores. “Sim, se” conserva tanto a intensificação retórica quanto o valor condicional.
- source_word: בִּינָה
  choice: entendimento
  rationale: O termo designa a capacidade de compreender ou perceber com clareza. “Entendimento” é natural no contexto sapiencial e mantém alguma distinção em relação ao quase sinônimo seguinte.
- source_word: תִקְרָא
  choice: clamar
  rationale: Neste contexto, o verbo descreve um apelo vocal e insistente, não apenas o ato de chamar ou dar nome. “Clamar” expressa essa intensidade de modo conciso e digno.
- source_word: תְּבוּנָה
  choice: discernimento
  rationale: O termo se sobrepõe semanticamente a בִּינָה, mas pode realçar a capacidade de distinguir e avaliar. “Discernimento” preserva essa nuance sem exagerar a diferença entre os dois vocábulos.
- source_word: תִּתֵּן קוֹלֶךָ
  choice: erguer a voz
  rationale: O hebraico diz literalmente “dar a sua voz”, expressão que indica falar em voz alta ou com insistência. “Erguer a voz” conserva a imagem e soa natural em português contemporâneo.
