  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
translation:
  language: pt
  text: para que você ande no caminho dos bons[a] e se mantenha nas veredas dos justos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das pessoas boas”. O adjetivo hebraico está no masculino plural e é empregado como substantivo para designar uma classe de pessoas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “guarde as veredas dos justos”. O verbo hebraico pode significar “manter”, “guardar” ou “observar”; aqui, provavelmente indica permanecer nessas veredas ou continuar a segui-las.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado da instrução anterior e reproduz naturalmente a força final da expressão hebraica.
- source_word: תֵּלֵךְ
  choice: você ande
  rationale: O imperfeito qal de הלך, após לְמַעַן, expressa o resultado ou propósito pretendido; o presente do subjuntivo é a construção portuguesa natural.
- source_word: בְּדֶרֶךְ
  choice: no caminho
  rationale: Preserva a metáfora hebraica do caminho como modo de vida e combina naturalmente com «ande».
- source_word: טוֹבִים
  choice: dos bons
  rationale: Adjetivo masculino plural substantivado, referente a uma classe de pessoas moralmente boas. «Dos bons» mantém essa forma concisa sem acrescentar um substantivo ausente no hebraico.
- source_word: וְאָרְחוֹת
  choice: e ... nas veredas
  rationale: «Veredas» preserva a imagem poética e distingue אָרְחוֹת de דֶרֶךְ, sem deixar de formar um paralelismo natural em português.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: Adjetivo plural substantivado; «os justos» é a formulação bíblica clara e corrente para pessoas moralmente retas.
- source_word: תִּשְׁמֹר
  choice: se mantenha
  rationale: Com «veredas» como objeto, שׁמר pode indicar guardar, observar ou conservar-se nelas. «Se mantenha nas veredas» comunica a ideia contextual de continuar seguindo esse curso, sem eliminar a alternativa mais literal.
