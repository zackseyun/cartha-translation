  text: בְּ֭נִ/י אִם תִּקַּ֣ח אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/001.yaml
  text: My son[a], if you receive my words and store up my commandments with you[b],
translation:
  language: pt
  text: Meu filho[a], se você acolher as minhas palavras e guardar consigo os meus mandamentos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Meu filho ou minha filha”. O hebraico está no masculino singular (“meu filho”), forma habitual da instrução paterna em Provérbios.
    reason: lexical_alternative
  - marker: b
    text: Ou “entesourar”. O verbo hebraico pode transmitir a ideia de guardar algo cuidadosamente e em segurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Mantém o vocativo masculino singular e a forma literária de instrução paterna característica de Provérbios.
- source_word: אִם
  choice: se
  rationale: Preserva a força condicional direta da oração hebraica.
- source_word: תִּקַּח
  choice: acolher
  rationale: No contexto da instrução sapiencial, o verbo 'tomar' expressa recepção favorável; 'acolher' comunica aceitação receptiva em português natural.
- source_word: אֲמָרָי
  choice: as minhas palavras
  rationale: Reproduz o sentido amplo de palavras ou ditos sem restringir indevidamente o gênero.
- source_word: וּמִצְוֺתַי
  choice: e os meus mandamentos
  rationale: Conserva o peso instrutivo e moral de מִצְוָה, além da terminologia bíblica corrente.
- source_word: תִּצְפֹּן
  choice: guardar
  rationale: Expressa conservar cuidadosamente para uso futuro; a nuance de entesourar é registrada em nota.
- source_word: אִתָּךְ
  choice: consigo
  rationale: Representa de modo idiomático o hebraico 'com você', mantendo a imagem de conservar os mandamentos em sua posse.
theological_decisions:
- issue: Tratamento filial marcado por gênero na literatura sapiencial
  choice: Meu filho
  alternative: Minha criança / Meu filho ou filha
  rationale: O hebraico é masculino singular e reflete a forma literária de instrução de um pai a um filho. O texto principal conserva essa forma sem negar o alcance mais amplo da sabedoria.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção 'guardar consigo' conserva a imagem hebraica sem soar excessivamente literal; 'acolher' expressa naturalmente a recepção atenta da instrução.
