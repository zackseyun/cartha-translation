  text: מְ֭זִמָּה תִּשְׁמֹ֥ר עָלֶ֗י/ךָ תְּבוּנָ֥ה תִנְצְרֶֽ/כָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/011.yaml
  text: Discretion will watch over you[a]; understanding will guard you.
translation:
  language: pt
  text: A prudência velará por você[a]; o discernimento o protegerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O bom senso guardará você; o entendimento o preservará.”'
    reason: Alternativa lexical que explicita outros sentidos legítimos dos dois substantivos e dos verbos hebraicos paralelos.
lexical_decisions:
- source_word: מְזִמָּה
  choice: prudência
  rationale: Neste contexto sapiencial, o substantivo tem sentido positivo de reflexão cuidadosa, bom senso e capacidade de agir com cautela. “Prudência” comunica isso com naturalidade em português, sem sugerir o sentido negativo de “maquinação” possível em outros contextos.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: velará por você
  rationale: A construção com שׁמר e עַל expressa cuidado protetor dirigido ao interlocutor. “Velará por você” preserva essa ideia e evita repetir o verbo da linha paralela.
- source_word: תְּבוּנָה
  choice: discernimento
  rationale: O termo designa a capacidade de perceber distinções e compreender corretamente. “Discernimento” é claro, atual e apropriado ao vocabulário de sabedoria de Provérbios.
- source_word: תִנְצְרֶכָּה
  choice: o protegerá
  rationale: נצר transmite a ideia de guardar, conservar ou proteger. “O protegerá” mantém o paralelismo protetor e representa o sufixo masculino singular do texto hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e a personificação da prudência e do discernimento como agentes protetores.
