id: PRO.2.17
reference: Proverbs 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ֭/עֹזֶבֶת אַלּ֣וּף נְעוּרֶ֑י/הָ וְ/אֶת בְּרִ֖ית אֱלֹהֶ֣י/הָ שָׁכֵֽחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/017.yaml
  text: who abandons the companion of her youth and forgets the covenant of her God[a][b].
translation:
  language: pt
  text: que abandona o companheiro da sua juventude[a] e se esquece da aliança do seu Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o marido da sua juventude”. A palavra hebraica pode designar um companheiro íntimo e, aqui, provavelmente se refere ao marido dela.
    reason: lexical_alternative
  - marker: b
    text: “A aliança do seu Deus” provavelmente se refere à aliança matrimonial estabelecida sob a autoridade ou o testemunho de Deus, embora também possa aludir, de modo mais amplo, às obrigações da aliança dela com Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת
  choice: que abandona
  rationale: O particípio qal feminino singular caracteriza a mulher mencionada no contexto. “Abandona” expressa o ato deliberado de deixar para trás sem recorrer a linguagem arcaica.
- source_word: אַלּוּף
  choice: companheiro
  rationale: O termo pode designar alguém íntimo ou próximo e, neste contexto, provavelmente se refere ao marido. “Companheiro” conserva a amplitude lexical, enquanto a nota explicita a referência conjugal provável.
- source_word: נְעוּרֶיהָ
  choice: da sua juventude
  rationale: Reproduz naturalmente a construção hebraica e indica um vínculo estabelecido quando ela era jovem.
- source_word: בְּרִית
  choice: aliança
  rationale: “Aliança” preserva o caráter solene, vinculante e teológico do termo hebraico.
- source_word: אֱלֹהֶיהָ
  choice: seu Deus
  rationale: Mantém o sufixo feminino singular e a dimensão pessoal da responsabilidade dela diante de Deus.
- source_word: שָׁכֵחָה
  choice: se esquece
  rationale: Embora seja uma forma perfeita em hebraico, o presente é natural na caracterização proverbial. No contexto, esquecer implica desprezar ou desconsiderar a obrigação da aliança.
theological_decisions:
- issue: Se בְּרִית אֱלֹהֶיהָ se refere especificamente à aliança matrimonial diante de Deus ou, de modo mais amplo, às obrigações da aliança com Deus
  choice: “a aliança do seu Deus”, mantendo a provável implicação matrimonial
  alternative: “sua aliança matrimonial diante de Deus” ou uma referência geral à aliança com Deus
  rationale: O paralelismo com “o companheiro da sua juventude” aponta fortemente para o casamento, mas o hebraico diz literalmente “a aliança do seu Deus”. A formulação principal preserva essa amplitude e a tensão interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a ligação sintática com o versículo anterior e preserva a ambiguidade legítima do hebraico.
