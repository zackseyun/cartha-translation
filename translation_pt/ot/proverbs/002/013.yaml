  text: who abandon the paths of uprightness to walk in the ways of darkness,[a]
translation:
  language: pt
  text: os que abandonam as veredas da retidão para andar pelos caminhos das trevas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que deixam as veredas do que é certo”.'
    reason: Alternativa lexical para יֹשֶׁר, traduzindo a qualidade abstrata por uma expressão substantivada mais corrente.
lexical_decisions:
- source_word: הָעֹזְבִים
  choice: os que abandonam
  rationale: O particípio funciona como substantivo e caracteriza as pessoas mencionadas no contexto. “Abandonam” expressa uma ação deliberada e é natural em português atual.
- source_word: אָרְחוֹת
  choice: as veredas da
  rationale: “Veredas” preserva a metáfora sapiencial do percurso da vida e permite manter a variação poética em relação a דֶּרֶךְ, traduzido por “caminhos”.
- source_word: יֹשֶׁר
  choice: retidão
  rationale: O termo indica retitude ou correção moral. “Retidão” conserva tanto o sentido ético quanto a imagem implícita do que é reto.
- source_word: לָלֶכֶת
  choice: para andar
  rationale: Mantém a metáfora hebraica de caminhar como modo de viver ou agir, comum na literatura sapiencial.
- source_word: בְּדַרְכֵי
  choice: pelos caminhos das
  rationale: “Pelos caminhos” é idiomático em português e conserva o paralelismo com “veredas”.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Preserva a imagem moral sem explicitá-la como “maldade”. “Trevas” tem dignidade literária e é amplamente compreensível em português.
theological_decisions:
- issue: Metáfora moral das trevas
  choice: trevas
  alternative: maldade; mal
  rationale: O hebraico mantém a imagem de escuridão, cujo sentido moral decorre do contexto. Traduzir diretamente por “maldade” eliminaria a metáfora e resolveria de modo indevido sua amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva o paralelismo entre “veredas” e “caminhos” e a metáfora sapiencial do caminhar moral.
