  yaml_path: translation/ot/proverbs/002/014.yaml
  text: who rejoice to do evil[a], and exult in the perversities of evil[b],
translation:
  language: pt
  text: 'os que se alegram em fazer o mal[a]

    e exultam nas perversidades do mal[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que têm prazer em fazer o mal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e se alegram em coisas perversas” ou “em atos de perversidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: os que se alegram
  rationale: O particípio caracteriza as pessoas mencionadas no contexto anterior. “Os que se alegram” preserva essa força caracterizadora e expressa naturalmente o sentido emocional de שמח.
- source_word: לַעֲשׂוֹת
  choice: em fazer
  rationale: A construção portuguesa “alegrar-se em fazer” traduz com naturalidade o infinitivo de עשה sem acrescentar a ideia de prática habitual ou de delito formal.
- source_word: רָע
  choice: o mal
  rationale: No contexto sapiencial, רָע tem clara dimensão moral. “O mal” preserva essa força melhor que alternativas mais fracas, como “o que é errado”, ou voltadas às consequências, como “dano”.
- source_word: יָגִילוּ
  choice: exultam
  rationale: “Exultam” comunica a alegria intensa de גיל e distingue o termo do שמח da primeira linha, mantendo a progressão e o paralelismo poético.
- source_word: בְּתַהְפֻּכוֹת
  choice: com as perversidades
  rationale: O substantivo plural denota coisas, condutas ou atos moralmente torcidos. “Perversidades” conserva o plural e a formulação abstrata do hebraico sem limitar o referente exclusivamente a atos.
- source_word: רָע
  choice: do mal
  rationale: A expressão mantém a relação compacta e ambígua entre תַהְפֻּכוֹת e רָע, sem decidir se o segundo termo descreve a qualidade das perversidades ou sua associação com o mal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo foi preservado em duas linhas. “Perversidades do mal” é deliberadamente compacto para conservar a tensão lexical do hebraico, e as alternativas mais explícitas aparecem em nota.
