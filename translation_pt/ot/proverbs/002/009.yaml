base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/009.yaml
  text: Then you will understand righteousness and justice and equity[a], every good path.
translation:
  language: pt
  text: Então você entenderá a justiça, o juízo, a retidão e todo bom caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “equidade”. O hebraico מֵישָׁרִים enfatiza aquilo que é reto, nivelado ou moralmente íntegro.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a consequência temporal e lógica das condições anteriores do capítulo, de modo natural em português.
- source_word: תָּבִין
  choice: você entenderá
  rationale: O qal imperfeito de בין indica chegar a compreender ou discernir; esta forma é clara e preserva o sentido prospectivo.
- source_word: צֶדֶק
  choice: justiça
  rationale: Designa aquilo que é moralmente correto. Em português, “justiça” conserva esse peso ético, embora haja sobreposição semântica com o termo seguinte.
- source_word: מִשְׁפָּט
  choice: juízo
  rationale: Pode indicar julgamento, justiça ou ordem justa. “Juízo” mantém a distinção lexical em relação a צֶדֶק e inclui a ideia de julgamento correto.
- source_word: מֵישָׁרִים
  choice: retidão
  rationale: Deriva da noção do que é reto ou nivelado e, no contexto ético, exprime integridade e equidade.
- source_word: כָּל
  choice: todo
  rationale: 'Com o substantivo singular, tem naturalmente sentido distributivo: “todo bom caminho”.'
- source_word: מַעְגַּל
  choice: caminho
  rationale: Refere-se literalmente a uma trilha ou percurso e, metaforicamente, ao curso da vida; “caminho” preserva a imagem proverbial.
- source_word: טוֹב
  choice: bom
  rationale: Qualifica o caminho em sentido moral e prático sem restringir indevidamente sua amplitude.
theological_decisions:
- issue: Relação de כָּל מַעְגַּל טוֹב com a tríade anterior
  choice: 'Manter a frase final justaposta por vírgula: “a justiça, o juízo e a retidão, todo bom caminho”.'
  alternative: Acrescentar uma conjunção — “e todo bom caminho” — ou usar travessão para explicitar uma aposição.
  rationale: O hebraico não traz conjunção antes de כָּל. A vírgula conserva a justaposição e a possível função resumitiva ou apositiva sem resolver de modo excessivo a relação sintática.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com preferência por “você” para o singular direto. A sequência de substantivos preserva a concisão e a tensão lexical do hebraico; a pontuação evita explicitar além do texto a relação da expressão final com a tríade.
