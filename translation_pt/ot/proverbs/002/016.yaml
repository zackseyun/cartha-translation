translation:
  language: pt
  text: para livrar você da mulher de fora, da estrangeira que suaviza suas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da mulher estranha, da estrangeira que torna suaves as suas palavras”. Em Provérbios, essas expressões podem designar uma mulher alheia aos limites conjugais ou sociais apropriados, e não apenas alguém de outro povo. “Que suaviza suas palavras” também pode ser entendido como “que usa palavras lisonjeiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: para livrar você
  rationale: O infinitivo hifil de נצל com sufixo de segunda pessoa masculina singular expressa finalidade ou resultado. “Livrar” comunica de modo natural a retirada de um perigo.
- source_word: מֵאִשָּׁה זָרָה
  choice: da mulher estranha
  rationale: Mantém o sentido básico de זרה e preserva a ambiguidade entre alguém de fora e uma mulher alheia aos limites conjugais ou sociais apropriados no contexto de Provérbios.
- source_word: מִנָּכְרִיָּה
  choice: da estrangeira
  rationale: Conserva a referência lexical à condição de estrangeira ou pessoa de fora e reproduz o paralelismo com “mulher estranha”, sem reduzir a expressão apenas à etnia.
- source_word: אֲמָרֶיהָ
  choice: as suas palavras
  rationale: Representa diretamente o plural “palavras/ditos dela” em construção com o sufixo feminino.
- source_word: הֶחֱלִיקָה
  choice: torna suaves
  rationale: Preserva a forma verbal ativa do hifil e a metáfora da fala tornada lisa ou suave; no contexto, isso implica sedução ou lisonja.
theological_decisions:
- issue: Identidade da mulher descrita como זָרָה e נָכְרִיָּה
  choice: Preservar as imagens “mulher estranha” e “estrangeira” no texto
  alternative: “mulher proibida” ou “adúltera”
  rationale: O hebraico permite uma associação moral e conjugal no contexto, mas os termos não especificam por si sós adultério nem mera origem étnica. A tradução mantém essa tensão, e a nota esclarece o uso proverbial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “da... da...” preserva o paralelismo hebraico. “Torna suaves as suas palavras” mantém a metáfora e a ação verbal do original, enquanto a nota apresenta o sentido idiomático.
