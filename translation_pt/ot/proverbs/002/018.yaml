  text: כִּ֤י שָׁ֣חָה אֶל מָ֣וֶת בֵּיתָ֑/הּ וְ/אֶל רְ֝פָאִ֗ים מַעְגְּלֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/018.yaml
  text: For her house sinks down to death[a], and her paths to the dead.
translation:
  language: pt
  text: Pois a casa dela se inclina para a morte, e suas veredas, para os mortos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as sombras”, termo poético para os mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para evitar a mulher descrita no contexto e preserva de modo conciso a força explicativa.
- source_word: שָׁחָה
  choice: se inclina
  rationale: Conserva a imagem de curvar-se ou descer, sem acrescentar a ideia não explícita de que a casa 'leva' alguém a certo destino.
- source_word: אֶל מָוֶת
  choice: para a morte
  rationale: Expressa naturalmente a direção indicada pela preposição אֶל.
- source_word: בֵּיתָהּ
  choice: a casa dela
  rationale: Mantém a imagem concreta de 'casa' e torna inequívoco, em português corrente, que ela pertence à mulher mencionada no contexto.
- source_word: רְפָאִים
  choice: os mortos
  rationale: Neste contexto sapiencial e poético, designa os falecidos, não o povo chamado refains; a nuance poética é preservada em nota.
- source_word: מַעְגְּלֹתֶיהָ
  choice: suas veredas
  rationale: Reproduz a imagem poética de caminhos ou trilhas e permite conservar a elipse verbal do segundo membro.
theological_decisions:
- issue: Sentido de רְפָאִים no contexto sapiencial-poético
  choice: os mortos
  alternative: as sombras; os espíritos dos mortos; os refains
  rationale: O termo se refere aqui aos habitantes do domínio da morte. 'Os mortos' é claro e evita tanto uma referência étnica indevida quanto uma cosmologia mais específica do que o texto exige; a alternativa poética aparece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção elíptica “e suas veredas, para os mortos” preserva o paralelismo e a ausência de um segundo verbo explícito no hebraico.
