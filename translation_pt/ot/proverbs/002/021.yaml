source:
  edition: WLC
  text: כִּֽי יְשָׁרִ֥ים יִשְׁכְּנוּ אָ֑רֶץ וּ֝/תְמִימִ֗ים יִוָּ֥תְרוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
translation:
  language: pt
  text: Pois os íntegros habitarão na terra[a], e os irrepreensíveis permanecerão nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no país”. O hebraico אֶרֶץ pode indicar tanto uma terra ou país quanto a terra em sentido mais amplo; aqui, “na terra” foi mantido porque o contexto destaca permanecer num lugar habitável ou ser removido dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da exortação precedente, preservando de modo natural a ligação lógica.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: Designa pessoas moralmente retas e honestas; “íntegros” comunica esse caráter ético sem confundir o termo com vocabulário mais específico de justiça.
- source_word: יִשְׁכְּנוּ
  choice: habitarão
  rationale: O verbo שכן expressa habitação estável ou permanência; “habitarão” mantém o tom digno da literatura sapiencial.
- source_word: אָרֶץ
  choice: na terra
  rationale: Pode designar tanto uma terra habitável específica quanto a terra em sentido amplo. No contraste com a expulsão no versículo seguinte, “na terra” preserva o sentido espacial concreto sem restringi-lo indevidamente.
- source_word: וּתְמִימִים
  choice: e os irrepreensíveis
  rationale: תמים descreve integridade, inteireza moral ou conduta sem culpa; “irrepreensíveis” mantém a distinção em relação a יְשָׁרִים e forma um paralelismo natural.
- source_word: יִוָּתְרוּ
  choice: permanecerão
  rationale: O nifal de יתר tem o sentido de ser deixado, restar ou permanecer. Aqui “permanecerão” expressa naturalmente a continuidade na terra.
- source_word: בָהּ
  choice: nela
  rationale: O sufixo pronominal retoma אָרֶץ de forma concisa e idiomática em português.
theological_decisions:
- issue: Alcance de אָרֶץ
  choice: terra
  alternative: país; Terra
  rationale: O contexto contrapõe permanecer nesse espaço habitável a ser arrancado dele. “Terra” conserva tanto a referência concreta quanto a amplitude possível do hebraico; a nota registra a alternativa sem impor uma leitura territorial estreita.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo sapiencial preservado. “Íntegros” e “irrepreensíveis” mantêm próximos, mas distintos, os dois qualificativos éticos hebraicos.
