  text: לִ֭/נְצֹר אָרְח֣וֹת מִשְׁפָּ֑ט וְ/דֶ֖רֶךְ חסיד/ו יִשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/008.yaml
  text: to guard the paths of justice[a], and he watches over the way of his faithful ones.
translation:
  language: pt
  text: para guardar as veredas da justiça e proteger o caminho dos que lhe são fiéis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Conforme a leitura tradicional do texto hebraico. A forma consonantal também pode ser entendida no singular: “daquele que lhe é fiel”. O termo descreve quem demonstra fidelidade e devoção a Deus.'
    reason: variante_textual_e_lexical
lexical_decisions:
- source_word: לִנְצֹר
  choice: para guardar
  rationale: O infinitivo construto indica propósito ou resultado em continuidade com o contexto anterior. “Guardar” conserva o sentido de proteção e combina naturalmente com “veredas”.
- source_word: אָרְחוֹת
  choice: as veredas
  rationale: O plural designa caminhos ou trilhas. “Veredas” é claro, digno e preserva a variação poética em relação ao singular דֶרֶךְ.
- source_word: מִשְׁפָּט
  choice: da justiça
  rationale: Neste contexto sapiencial, o termo aponta para a justiça e para o que é reto, não apenas para uma sentença judicial.
- source_word: וְדֶרֶךְ
  choice: e ... o caminho
  rationale: “Caminho” traduz naturalmente דֶרֶךְ e mantém a alternância poética entre “veredas” no plural e “caminho” no singular.
- source_word: חסיד/ו
  choice: dos que lhe são fiéis
  rationale: A leitura massorética tradicionalmente vocalizada como plural refere-se aos que demonstram fidelidade ou piedade para com Deus. A formulação portuguesa expressa essa relação sem recorrer a termos eclesiásticos técnicos; a variante consonantal singular é registrada em nota.
- source_word: יִשְׁמֹר
  choice: proteger
  rationale: O verbo significa guardar, vigiar ou preservar. “Proteger” evita a repetição imediata de “guardar” e mantém a ação protetora de Deus.
theological_decisions:
- issue: Sujeito implícito de יִשְׁמֹר
  choice: Deus, retomado do contexto anterior, permanece implícito na coordenação verbal
  alternative: Explicitar “ele” ou “o SENHOR”
  rationale: Provérbios 2:6–8 apresenta o SENHOR como aquele que dá sabedoria e protege. Em português, os infinitivos coordenados permitem conservar a continuidade sem inserir um nome ausente neste versículo.
- issue: Número e sentido de חסיד/ו
  choice: 'Plural: “dos que lhe são fiéis”'
  alternative: 'Singular: “daquele que lhe é fiel”'
  rationale: A tradição de leitura massorética e o paralelismo favorecem o plural, enquanto a forma consonantal transmitida admite o singular. A nota preserva essa variante real sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Veredas” preserva o tom poético sapiencial sem soar obscuro; “dos que lhe são fiéis” comunica naturalmente o valor relacional do hebraico.
