  terminology: «Justiça», «veredas», «caminho» e «fiéis» são escolhas terminologicamente sólidas e não impõem leitura confessional específica. A nota explica com sobriedade a dimensão de fidelidade e devoção associada a חסיד, sem transformar o termo em título eclesiástico.
