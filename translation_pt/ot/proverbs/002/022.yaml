  text: וּ֭/רְשָׁעִים מֵ/אֶ֣רֶץ יִכָּרֵ֑תוּ וּ֝/בוֹגְדִ֗ים יִסְּח֥וּ מִמֶּֽ/נָּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
translation:
  language: pt
  text: Mas os maus serão cortados da terra[a], e os desleais serão arrancados dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do país”. O hebraico pode designar tanto uma terra ou país específico como a terra em sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico sugere remoção forçada.
    reason: lexical_clarification
lexical_decisions:
- source_word: רְשָׁעִים
  choice: os maus
  rationale: O adjetivo substantivado plural designa pessoas moralmente perversas. “Os maus” é claro, conciso e natural em português.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. No contraste com o versículo anterior, refere-se ao território habitável no qual os íntegros permanecem; “terra” preserva o sentido e a ambiguidade melhor do que “país”.
- source_word: יִכָּרֵתוּ
  choice: serão eliminados
  rationale: O nifal de כרת expressa ser cortado, excluído ou removido. “Serão eliminados” comunica com naturalidade a remoção decisiva, embora a tradução mais literal seja registrada em nota.
- source_word: בוֹגְדִים
  choice: os desleais
  rationale: O particípio de בגד caracteriza os que agem com deslealdade ou traição. “Os desleais” é digno, corrente e evita restringir o termo à traição política.
- source_word: יִסְּחוּ
  choice: serão arrancados
  rationale: O verbo נסח indica remoção forçada, como arrancar algo de seu lugar. “Serão arrancados” conserva a força da imagem sem explicá-la em excesso.
- source_word: מִמֶּנָּה
  choice: dela
  rationale: O sufixo feminino singular retoma אֶרֶץ. “Dela” é a retomada idiomática em português.
- source_word: וּ ... וּ
  choice: Mas ... e ...
  rationale: A primeira conjunção estabelece contraste com o destino dos íntegros no versículo anterior; a segunda coordena os dois membros paralelos.
theological_decisions:
- issue: Sentido de אֶרֶץ no contexto sapiencial
  choice: terra
  alternative: país; mundo
  rationale: O contexto imediato contrapõe os íntegros, que permanecem nela, aos maus, que dela são removidos. “Terra” mantém a referência territorial e a amplitude lexical do hebraico sem transformar o verso, por si só, numa afirmação universal sobre o mundo inteiro.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo foi preservado; “maus” e “desleais” apresentam as duas classes morais, enquanto “eliminados” e “arrancados” mantêm a progressão da remoção para sua expressão mais vívida.
