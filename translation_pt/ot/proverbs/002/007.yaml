id: PRO.2.7
reference: Proverbs 2:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
translation:
  language: pt
  text: Ele reserva sabedoria eficaz[a] para os retos; é escudo para os que andam com integridade[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sabedoria sólida”, “bom senso” ou “capacidade para alcançar bom resultado”; o termo hebraico abrange a ideia de sabedoria prática e eficaz.
    reason: lexical_alternative
  - marker: b
    text: Ou “inteireza” ou “conduta irrepreensível”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e reserva um escudo para os que andam com integridade”.'
    reason: syntactical_alternative
lexical_decisions:
- source_word: וְצָפַן
  choice: reserva
  rationale: O verbo צפן expressa guardar, armazenar ou manter algo em reserva. “Reserva” comunica naturalmente a ideia de um bem guardado para benefício futuro.
- source_word: לַיְשָׁרִים
  choice: para os retos
  rationale: יְשָׁרִים designa pessoas moralmente retas. “Os retos” conserva o sentido ético e é corrente na linguagem sapiencial.
- source_word: תּוּשִׁיָּה
  choice: sabedoria eficaz
  rationale: תּוּשִׁיָּה pode indicar sabedoria sólida e prática, capacidade ou êxito resultante dela. “Sabedoria eficaz” conserva tanto o aspecto sapiencial quanto sua efetividade, sem reduzir o termo apenas a sucesso.
- source_word: מָגֵן
  choice: escudo
  rationale: מָגֵן significa literalmente “escudo”. A tradução mantém a metáfora concreta de proteção.
- source_word: לְהֹלְכֵי
  choice: para os que andam
  rationale: O particípio de הלך descreve aqui uma conduta habitual. “Os que andam” preserva a metáfora hebraica do modo de viver.
- source_word: תֹם
  choice: integridade
  rationale: תֹם pode exprimir inteireza, irrepreensibilidade ou integridade moral. “Integridade” é clara em português moderno e não sugere necessariamente impecabilidade absoluta.
theological_decisions:
- issue: Relação entre as duas orações
  choice: Deus é entendido como sujeito tanto de “reserva” quanto de “é escudo”.
  alternative: 'A segunda oração pode ser entendida elipticamente: “e reserva um escudo para os que andam com integridade”.'
  rationale: O contexto imediato apresenta o SENHOR como agente, e a leitura com o mesmo sujeito nas duas orações produz um paralelismo natural. Como a construção hebraica admite uma relação elíptica com o primeiro verbo, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Reserva” evita o tom arcaico de “entesoura”; “sabedoria eficaz” mantém a amplitude do termo sapiencial; e “andam com integridade” preserva a metáfora ética do hebraico.
