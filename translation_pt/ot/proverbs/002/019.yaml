base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/019.yaml
  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: pt
  text: Todos os que vão até ela não voltam, nem alcançam as veredas da vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֶיהָ
  choice: os que entram na casa dela
  rationale: O verbo בוא com a preposição אֶל e o sufixo feminino indica ir ou entrar até ela; no contexto da casa mencionada no versículo anterior, explicitar “na casa dela” produz português natural sem mudar o referente.
- source_word: יְשׁוּבוּן
  choice: voltam
  rationale: Mantém o sentido comum de שׁוב, “voltar”, e a formulação absoluta e enfática do hebraico.
- source_word: יַשִּׂיגוּ
  choice: reencontram
  rationale: נשׂג pode significar alcançar, atingir ou obter. Neste paralelismo, a ideia é voltar a alcançar as veredas da vida depois de tê-las abandonado; “reencontram” comunica essa retomada sem sugerir mera compreensão intelectual.
- source_word: אָרְחוֹת חַיִּים
  choice: as veredas da vida
  rationale: Preserva a metáfora sapiencial de caminhos que conduzem à vida; “veredas” é corrente, digna e distingue adequadamente אָרְחוֹת.
theological_decisions:
- issue: Caráter absoluto da advertência
  choice: Preservar “não voltam, nem reencontram” sem atenuação
  alternative: Introduzir qualificações como “dificilmente voltam” ou “em geral não voltam”
  rationale: O hebraico apresenta uma máxima sapiencial em termos absolutos. A tradução deve manter sua força retórica sem transformá-la numa afirmação sistemática sobre a impossibilidade metafísica de arrependimento.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo conciso. “Entram na casa dela” retoma naturalmente a casa do contexto imediato; “veredas da vida” conserva a imagem poética de Provérbios.
