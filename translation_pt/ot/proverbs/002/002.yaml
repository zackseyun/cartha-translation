lexical_decisions:
- source_word: לְהַקְשִׁיב
  choice: tornando ... atento
  rationale: O infinitivo causativo de קשׁב expressa a ação intencional de fazer o ouvido prestar atenção. A formulação também preserva a dependência sintática do versículo anterior.
- source_word: לַחָכְמָה
  choice: à sabedoria
  rationale: A preposição ל indica aquilo para o qual se dirige a atenção; “à sabedoria” é natural e mantém a imagem hebraica.
- source_word: אָזְנֶךָ
  choice: o seu ouvido
  rationale: O hebraico emprega o singular com sufixo de segunda pessoa masculina singular. O singular preserva a imagem concreta e é idiomático em português.
- source_word: תַּטֶּה
  choice: inclinando
  rationale: נטה pode significar inclinar, voltar ou dirigir. “Inclinando” conserva a imagem corporal e forma um paralelo natural com o primeiro membro.
- source_word: לִבְּךָ
  choice: o seu coração
  rationale: לֵב abrange intelecto, vontade e interioridade. “Coração” preserva essa amplitude antropológica, ao passo que “mente” estreitaria o sentido.
- source_word: לַתְּבוּנָה
  choice: ao entendimento
  rationale: תְּבוּנָה designa entendimento, discernimento ou perspicácia. “Entendimento” forma uma associação natural com “sabedoria” sem excluir a dimensão de discernimento.
