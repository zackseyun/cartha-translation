  text: כִּֽי תָב֣וֹא חָכְמָ֣ה בְ/לִבֶּ֑/ךָ וְ֝/דַ֗עַת לְֽ/נַפְשְׁ/ךָ֥ יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
translation:
  language: pt
  text: Pois a sabedoria entrará no seu coração[a], e o conhecimento será agradável à sua alma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando a sabedoria entrar no seu coração”.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico também pode significar “você mesmo” ou “sua vida”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz naturalmente, em português, a explicação ou fundamento do contexto anterior. A leitura temporal “quando” continua possível e é registrada em nota.
- source_word: תָבוֹא חָכְמָה בְלִבֶּךָ
  choice: a sabedoria entrará no seu coração
  rationale: Preserva o sentido concreto de בוא com בְּ (“entrar em”) e mantém “coração” como expressão hebraica para o centro interior do pensamento, da vontade e dos afetos.
- source_word: וְדַעַת
  choice: e o conhecimento
  rationale: Mantém o termo sapiencial “conhecimento” e sua distinção de palavras hebraicas que expressam entendimento ou discernimento.
- source_word: לְנַפְשְׁךָ
  choice: à sua alma
  rationale: Conserva a imagem antropológica e o paralelismo com “coração”; נֶפֶשׁ também pode designar a própria pessoa ou a vida, conforme o contexto.
- source_word: יִנְעָם
  choice: será agradável
  rationale: Expressa o sentido predicativo de נעם, que indica ser agradável, prazeroso ou doce, sem transformar o verbo em uma formulação mais interpretativa.
theological_decisions:
- issue: Antropologia hebraica em לֵב e נֶפֶשׁ
  choice: Manter “coração” e “alma” no texto principal
  alternative: “mente” e “ser interior” ou “vida”
  rationale: Esses termos preservam a linguagem poética e conceitual hebraica sobre a pessoa interior, sem reduzi-la apenas ao intelecto nem impor uma definição técnica posterior de corpo e alma.
- issue: Valor explicativo ou temporal de כִּי
  choice: “Pois”, com sentido explicativo
  alternative: “Quando”, com sentido temporal
  rationale: O valor explicativo se ajusta ao encadeamento do discurso sapiencial, mas o hebraico e o contexto permitem entender a oração temporalmente; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário sapiencial tradicional. O paralelismo entre “coração” e “alma” foi mantido; a ambiguidade de כִּי foi indicada em nota.
