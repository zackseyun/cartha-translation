base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/006.yaml
  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
translation:
  language: pt
  text: Pois Yahweh dá sabedoria; da sua boca vêm o conhecimento e o entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior. Em português, “Pois” mantém com naturalidade o encadeamento explicativo do provérbio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: יִתֵּן
  choice: dá
  rationale: O imperfeito expressa aqui uma verdade geral característica do estilo proverbial; o presente comunica adequadamente esse sentido gnômico.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e tematicamente central em Provérbios.
- source_word: מִפִּיו
  choice: da sua boca vêm
  rationale: Preserva a imagem hebraica da boca de Yahweh como fonte do conhecimento e do entendimento, suprindo em português o verbo exigido pela construção.
- source_word: דַּעַת
  choice: o conhecimento
  rationale: Tradução direta e natural do termo no contexto da literatura sapiencial.
- source_word: וּתְבוּנָה
  choice: e o entendimento
  rationale: Mantém o sentido de capacidade de compreender ou discernir e forma um par natural com “conhecimento”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título; “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem e o paralelismo do hebraico foram preservados sem rigidez artificial; a imagem concreta “da sua boca” foi mantida no texto principal.
