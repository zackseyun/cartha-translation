  text: לְ֭/הַצִּ֣ילְ/ךָ מִ/דֶּ֣רֶךְ רָ֑ע מֵ֝/אִ֗ישׁ מְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/012.yaml
  text: to deliver you from the evil way[a], from the man who speaks perverse things,
translation:
  language: pt
  text: 'para livrar você do mau caminho,

    do homem que fala coisas perversas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: coisas distorcidas.'
    reason: Alternativa lexical para תַּהְפֻּכוֹת, que pode descrever conteúdos ou palavras torcidas, desviadas ou perversas.
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: para livrar você
  rationale: O infinitivo hifil de נצל com sufixo masculino singular expressa finalidade ou resultado. “Livrar você” comunica proteção e resgate com naturalidade, sem acrescentar uma conotação especificamente soteriológica.
- source_word: מִדֶּרֶךְ רָע
  choice: do mau caminho
  rationale: דֶּרֶךְ conserva a imagem sapiencial do caminho como modo de vida, e רָע lhe dá sentido moral. “Mau caminho” é uma expressão portuguesa natural e mantém a metáfora ética.
- source_word: מֵאִישׁ
  choice: do homem
  rationale: 'אִישׁ está no masculino singular e apresenta um tipo representativo de malfeitor. A repetição de “do” preserva os dois complementos paralelos: livramento do caminho e do homem.'
- source_word: מְדַבֵּר
  choice: que fala
  rationale: O particípio descreve a conduta característica desse homem; a oração relativa é a forma mais natural em português.
- source_word: תַּהְפֻּכוֹת
  choice: perversidades
  rationale: O plural designa palavras ou ideias torcidas, perversas e desviadas. “Perversidades” preserva a forma plural e a força moral do termo, enquanto a nota registra uma formulação mais concreta.
theological_decisions:
- issue: Gênero na tradução de אִישׁ
  choice: do homem
  alternative: de uma pessoa
  rationale: O hebraico emprega um substantivo masculino singular para representar esse tipo de malfeitor. A tradução mantém o gênero gramatical sem transformar a referência em linguagem neutra.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mau caminho” mantém a metáfora tradicional em linguagem corrente; “livrar você” evita tanto a solenidade marcada de “livrar-te” quanto uma leitura teológica indevida de “salvar”.
