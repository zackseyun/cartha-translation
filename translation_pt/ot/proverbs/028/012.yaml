  text: בַּ/עֲלֹ֣ץ צַ֭דִּיקִים רַבָּ֣ה תִפְאָ֑רֶת וּ/בְ/ק֥וּם רְ֝שָׁעִ֗ים יְחֻפַּ֥שׂ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/012.yaml
  text: When the righteous rejoice[a], there is great glory, but when the wicked rise, people hide themselves.
translation:
  language: pt
  text: Quando os justos exultam, há grande glória; mas, quando os perversos se levantam, as pessoas[a] se escondem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit. «uma pessoa». Ou, possivelmente: «uma pessoa é procurada»; no contexto, o sentido mais provável é que as pessoas se ocultam quando os perversos ganham poder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹץ
  choice: Quando ... exultam
  rationale: A preposição בְּ com o infinitivo construto de עלץ tem sentido temporal. “Exultam” conserva a intensidade de alegria pública e elevada do verbo hebraico.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Adjetivo substantivado no plural, comum na literatura sapiencial para pessoas que vivem com retidão.
- source_word: רַבָּה תִפְאָרֶת
  choice: há grande glória
  rationale: רַבָּה funciona predicativamente com תִפְאָרֶת. A formulação preserva a amplitude sem restringir o substantivo a beleza, honra ou esplendor apenas.
- source_word: וּבְקוּם
  choice: mas, quando ... se levantam
  rationale: A conjunção introduz contraste, e בְּ com o infinitivo construto de קום é temporal. “Levantam-se” preserva a imagem hebraica, que no contexto pode incluir ascensão social ou política.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Expressa pessoas moralmente más em linguagem natural e digna, sem limitar o termo à culpa jurídica.
- source_word: יְחֻפַּשׂ אָדָם
  choice: as pessoas se escondem
  rationale: O singular genérico אָדָם representa as pessoas em geral. No paralelismo, a forma passiva de חפשׂ descreve o desaparecimento da vida pública sob o domínio dos perversos; a formulação reflexiva comunica esse sentido idiomaticamente, enquanto a leitura formalmente passiva é registrada em nota.
theological_decisions:
- issue: Sentido do singular genérico אָדָם e da forma passiva יְחֻפַּשׂ
  choice: as pessoas se escondem
  alternative: uma pessoa é procurada / tem de ser procurada
  rationale: O provérbio descreve de modo geral a reação humana quando os perversos ascendem. A tradução principal comunica o sentido contextual provável sem introduzir distinção de gênero; a nota preserva a ambiguidade lexical e a forma passiva do hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo foi mantido com “quando... mas, quando...”; “exultam” e “glória” preservam o tom elevado da poesia sapiencial.
