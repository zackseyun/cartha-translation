  text: גּוֹזֵ֤ל אָ֘בִ֤י/ו וְ/אִמּ֗/וֹ וְ/אֹמֵ֥ר אֵֽין פָּ֑שַׁע חָבֵ֥ר ה֝֗וּא לְ/אִ֣ישׁ מַשְׁחִֽית׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/024.yaml
  text: Whoever robs his father and his mother and says[a], “It is no transgression,” is a companion of a destructive man.
translation:
  language: pt
  text: 'Quem rouba seu pai e sua mãe e diz: “Isso não é transgressão” é companheiro[a] de um homem que destrói.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é companheiro de um destruidor”.'
    reason: Alternativa lexical para a expressão hebraica que descreve a associação com uma pessoa destrutiva.
lexical_decisions:
- source_word: גּוֹזֵל
  choice: rouba
  rationale: O particípio qal de גזל indica apropriação ilícita, por vezes mediante força. “Rouba” preserva a gravidade e é natural em português.
- source_word: אָבִיו וְאִמּוֹ
  choice: seu pai e sua mãe
  rationale: Mantém a menção individual de ambos os pais e a força retórica do hebraico, em vez de condensar em “seus pais”.
- source_word: וְאֹמֵר
  choice: e diz
  rationale: A coordenação simples reproduz naturalmente a conjunção seguida do particípio hebraico.
- source_word: אֵין פָּשַׁע
  choice: Isso não é transgressão
  rationale: פָּשַׁע pode designar transgressão, delito ou rebelião. “Transgressão” conserva a dimensão moral sem restringir o sentido a uma categoria exclusivamente jurídica; “isso” retoma claramente o roubo mencionado.
- source_word: חָבֵר
  choice: companheiro
  rationale: חָבֵר descreve alguém associado ou unido a outro. “Companheiro” comunica associação moral sem necessariamente sugerir afeição pessoal.
- source_word: לְאִישׁ מַשְׁחִית
  choice: de quem causa destruição
  rationale: 'O לְ marca a relação de associação, e מַשְׁחִית é um particípio hifil com sentido ativo: alguém que destrói ou causa ruína. A formulação escolhida é natural e preserva a ação destrutiva sem introduzir gênero não exigido em português.'
- source_word: הוּא
  choice: é
  rationale: O pronome atua na oração nominal e é expresso de modo idiomático pela cópula portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura proverbial e a condenação moral direta foram preservadas. Não se acrescentou nota, pois a tradução no texto comunica adequadamente a força ativa de מַשְׁחִית e a relação marcada por לְ.
