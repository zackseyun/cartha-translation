base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/001.yaml
  text: The wicked flee when no one is pursuing[a], but the righteous are confident like a young lion.
translation:
  language: pt
  text: O perverso foge sem que haja quem o persiga[a], mas os justos são confiantes como um leão jovem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O perverso foge embora ninguém o persiga ... mas os justos são corajosos como um leão”. O hebraico permite nuances ligeiramente diferentes nas duas partes; “leão jovem” traduz o sentido mais específico de כְּפִיר.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוּ
  choice: foge
  rationale: 'Embora a forma hebraica seja plural, o sujeito coletivo רָשָׁע permite expressar em português a verdade proverbial com o singular genérico: “O perverso foge”.'
- source_word: וְאֵין רֹדֵף
  choice: quando ninguém o persegue
  rationale: אֵין com particípio indica a inexistência de perseguidor. “Quando ninguém o persegue” preserva o valor circunstancial e soa natural em português.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O termo designa genericamente quem age de modo moralmente perverso. O singular com artigo funciona em português como tipo representativo, sem introduzir referência especificamente masculina.
- source_word: וְצַדִּיקִים
  choice: mas os justos
  rationale: O adjetivo plural substantivado designa coletivamente as pessoas justas e mantém o contraste moral com “o perverso”.
- source_word: כִּכְפִיר
  choice: como um leão novo
  rationale: כְּפִיר indica mais especificamente um leão jovem, não apenas um leão em sentido geral. “Leão novo” preserva essa precisão sem sugerir um filhote indefeso.
- source_word: יִבְטָח
  choice: ficam confiantes
  rationale: O verbo בטח pode significar confiar, sentir-se seguro ou agir com confiança. No contraste com a fuga amedrontada e na comparação com o leão novo, “ficam confiantes” comunica segurança e destemor sem reduzir o termo a mera ousadia.
theological_decisions:
- issue: Tipos morais genéricos e os números gramaticais no provérbio
  choice: 'Traduzir רָשָׁע e צַדִּיקִים como categorias morais genéricas: “o perverso” e “os justos”.'
  alternative: “Os perversos ... os justos” ou “a pessoa perversa ... as pessoas justas”.
  rationale: O provérbio contrasta classes morais, não indivíduos específicos nem apenas homens. A redação preserva o singular representativo do substantivo רָשָׁע e o plural explícito de צַדִּיקִים, usando formas naturais em português.
- issue: Nuance de segurança, confiança ou valentia em יִבְטָח
  choice: “ficam confiantes”
  alternative: “são valentes”, “sentem-se seguros” ou “confiam”
  rationale: A imagem comporta confiança, segurança e destemor. “Ficam confiantes” mantém essa amplitude sem afirmar que a justiça produz mera autoconfiança nem especificar indevidamente o objeto da confiança.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Perverso” preserva a categoria moral sem o possível estreitamento religioso de “ímpio”; “leão novo” mantém a especificidade lexical do hebraico.
