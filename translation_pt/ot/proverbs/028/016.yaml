  terminology: “Governante”, “discernimento”, “opressões”, “ganho injusto” e “prolongará os seus dias” são escolhas amplas, compreensíveis e adequadas. “Ganho injusto” soa um pouco mais idiomático que “lucro injusto” e conserva o sentido moral de בֶּצַע sem tratar todo lucro como ilícito.
