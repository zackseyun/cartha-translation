  text: נָגִ֗יד חֲסַ֣ר תְּ֭בוּנוֹת וְ/רַ֥ב מַעֲשַׁקּ֑וֹת שנאי בֶ֝֗צַע יַאֲרִ֥יךְ יָמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/016.yaml
  text: A ruler lacking understanding is great in acts of oppression[b][a], but one who hates unjust gain will prolong his days.
translation:
  language: pt
  text: O governante sem discernimento pratica muitas opressões[a], mas quem odeia o ganho injusto[b] prolongará os seus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comete muitas extorsões”. A expressão hebraica diz literalmente: “e grande em opressões”.'
    reason: lexical_alternative
  - marker: b
    text: “Ganho injusto” também pode ser traduzido como “ganho desonesto” ou “ganho obtido pela ganância”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָגִיד
  choice: governante
  rationale: Designa alguém investido de autoridade; “governante” é amplo, natural e não restringe o provérbio a um príncipe monárquico.
- source_word: חֲסַר תְּבוּנוֹת
  choice: sem entendimento
  rationale: Expressa falta de discernimento e bom senso; a formulação é clara e preserva o vocabulário característico da literatura sapiencial.
- source_word: וְרַב מַעֲשַׁקּוֹת
  choice: multiplica os atos de opressão
  rationale: O hebraico diz literalmente algo como “e grande/muito em opressões”. A formulação portuguesa comunica de modo natural a abundância ou repetição de condutas opressivas, sem limitar o sentido à extorsão.
- source_word: מַעֲשַׁקּוֹת
  choice: atos de opressão
  rationale: O plural aponta para atos opressivos ou exploradores; “atos de opressão” é mais idiomático em português do que o plural isolado “opressões”.
- source_word: שׂנֵא בֶצַע
  choice: quem odeia o lucro injusto
  rationale: בֶצַע denota ganho cobiçoso ou obtido por meios indevidos. “Lucro injusto” mantém explícita essa carga moral sem condenar todo lucro.
- source_word: יַאֲרִיךְ יָמִים
  choice: prolongará os seus dias
  rationale: Preserva a imagem do conhecido idiomatismo hebraico para desfrutar vida longa e continua compreensível em português atual.
