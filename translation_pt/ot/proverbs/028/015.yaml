  text: Like a roaring lion and a charging bear is a wicked ruler over a poor people[a].
translation:
  language: pt
  text: Como leão que ruge e urso que investe, assim é o governante perverso sobre um povo pobre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um urso voraz” ou “um urso que avança impetuosamente”; o particípio hebraico transmite uma ameaça agressiva e pode destacar tanto o movimento violento quanto a voracidade do animal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרִי
  choice: leão
  rationale: O substantivo designa o animal de modo geral; “leão” é o equivalente natural no símile.
- source_word: נֹהֵם
  choice: que ruge
  rationale: O particípio descreve o som ameaçador do leão; a forma verbal relativa soa natural em português.
- source_word: דֹב
  choice: urso
  rationale: Equivalente direto e corrente do termo hebraico.
- source_word: שׁוֹקֵק
  choice: que avança para atacar
  rationale: A expressão comunica movimento impetuoso e ameaça agressiva, sem limitar o sentido à fome predatória.
- source_word: מֹשֵׁל
  choice: governante
  rationale: O particípio substantivado indica alguém que exerce domínio; “governante” é claro e abrangente.
- source_word: רָשָׁע
  choice: perverso
  rationale: Preserva a forte avaliação moral própria da literatura sapiencial e concorda naturalmente com “governante”.
- source_word: עַל
  choice: sobre
  rationale: No contexto de governo, indica autoridade exercida sobre o povo, embora a imagem também sugira hostilidade.
- source_word: עַם
  choice: povo
  rationale: Refere-se à população submetida ao governante e mantém o enfoque social do provérbio.
- source_word: דָּל
  choice: pobre
  rationale: É o sentido mais direto aqui, incluindo no contexto a ideia de vulnerabilidade social.
