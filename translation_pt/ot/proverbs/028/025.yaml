  text: רְחַב נֶ֭פֶשׁ יְגָרֶ֣ה מָד֑וֹן וּ/בוֹטֵ֖חַ עַל יְהוָ֣ה יְדֻשָּֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/025.yaml
  text: A greedy person stirs up strife[b][a], but the one who trusts in Yahweh will be enriched.
translation:
  language: pt
  text: Quem tem apetite insaciável provoca discórdia[a], mas quem confia em Yahweh terá fartura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, «amplo de alma»: expressão que pode descrever alguém ávido, ganancioso ou de apetite desmedido; também pode ser entendida como «o orgulhoso».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «será engordado», imagem hebraica de abundância, vigor e florescimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  choice: quem tem apetite insaciável
  rationale: A expressão significa literalmente «amplo de alma» e descreve um desejo expansivo, ávido ou difícil de satisfazer. A formulação portuguesa preserva a imagem do apetite e seu sentido moral sem restringi-la necessariamente à comida.
- source_word: יְגָרֶה
  choice: provoca
  rationale: O hifil expressa causar ou incitar; «provoca» combina naturalmente com «discórdias» e mantém a concisão proverbial.
- source_word: מָדוֹן
  choice: discórdias
  rationale: Designa contenda ou conflito interpessoal. O plural idiomático em português comunica conflitos recorrentes de modo natural.
- source_word: וּבֹטֵחַ
  choice: mas quem confia
  rationale: A conjunção recebe valor adversativo por causa do paralelismo antitético. «Quem confia» reproduz naturalmente a força caracterizadora do particípio.
- source_word: עַל יְהוָה
  choice: em Yahweh
  rationale: Embora a preposição hebraica seja literalmente «sobre», em português confia-se naturalmente «em» alguém. O nome divino é transliterado como Yahweh.
- source_word: יְדֻשָּׁן
  choice: terá fartura
  rationale: O passivo significa literalmente «será engordado», imagem hebraica de abundância, vigor e florescimento. «Terá fartura» conserva a ideia concreta de abundância sem reproduzir uma metáfora corporal potencialmente enganosa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. «Yahweh» preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Alcance da promessa em יְדֻשָּׁן
  choice: terá fartura
  alternative: prosperará; será enriquecido; será fortalecido
  rationale: A expressão indica abundância ou florescimento, mas não especifica exclusivamente riqueza monetária. A tradução mantém essa amplitude e evita transformar o provérbio numa garantia estritamente financeira.
- issue: Sujeito masculino representativo
  choice: quem... quem
  alternative: o homem ávido... o que confia
  rationale: O masculino singular hebraico tem função proverbial genérica. A construção «quem» é natural em português, inclui qualquer pessoa e não altera o alcance semântico.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. «Apetite insaciável» retém algo da imagem hebraica e «terá fartura» comunica a metáfora final sem limitar a promessa ao enriquecimento financeiro.
