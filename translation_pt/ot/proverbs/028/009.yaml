  text: מֵסִ֣יר אָ֭זְנ/וֹ מִ/שְּׁמֹ֣עַ תּוֹרָ֑ה גַּֽם תְּ֝פִלָּת֗/וֹ תּוֹעֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/009.yaml
  text: Whoever turns his ear away from hearing the law—even his prayer is an abomination[a].
translation:
  language: pt
  text: Quem desvia o ouvido de ouvir a lei[a] — até mesmo sua oração é uma abominação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a instrução” ou “o ensino”. O hebraico torá pode designar mais amplamente a instrução autorizada de Deus, não apenas estatutos legais.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: afasta
  rationale: O particípio no hifil descreve uma atitude característica e deliberada. “Afasta” preserva a imagem concreta de desviar o ouvido e soa natural em português.
- source_word: אָזְנוֹ
  choice: o ouvido
  rationale: Mantém a metáfora corporal do hebraico para a recusa de escutar, sem necessidade de explicitação interpretativa.
- source_word: מִשְּׁמֹעַ
  choice: para não ouvir
  rationale: Expressa em português natural o afastamento em relação ao ato de ouvir e torna explícita a finalidade negativa implícita na construção hebraica.
- source_word: תּוֹרָה
  choice: a lei
  rationale: Preserva o peso normativo e a ressonância bíblica do termo, sem excluir o sentido mais amplo de instrução divina, registrado em nota.
- source_word: גַּם
  choice: até mesmo
  rationale: 'Comunica a força enfática: além da recusa em ouvir, até a oração dessa pessoa é considerada inaceitável.'
- source_word: תְּפִלָּתוֹ
  choice: sua oração
  rationale: É a correspondência direta e usual para o substantivo hebraico neste contexto.
- source_word: תּוֹעֵבָה
  choice: abominação
  rationale: Conserva a intensidade moral e religiosa do hebraico, evitando alternativas que enfraqueceriam a afirmação.
theological_decisions:
- issue: Amplitude de תּוֹרָה no contexto sapiencial
  choice: “a lei”, entendida como instrução autorizada de Deus
  alternative: “a instrução” ou “o ensino”
  rationale: “Lei” mantém a força normativa e pactual do termo, enquanto a nota preserva sua amplitude sem restringi-lo apenas a estatutos legais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A imagem hebraica do ouvido foi preservada; o travessão destaca a consequência enfática.
