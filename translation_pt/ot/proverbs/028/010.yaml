  text: Whoever leads the upright astray in an evil way will himself fall into his own pit[a], but the blameless will inherit good.
translation:
  language: pt
  text: Quem desencaminha os retos por um caminho mau cairá ele mesmo na sua própria cova[a], mas os íntegros herdarão o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cairá na sua própria destruição” ou “na sua própria ruína”. O termo hebraico pode designar uma cova, ruína ou destruição; o texto mantém a imagem de alguém que cai na própria armadilha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁגֶּה
  choice: Quem desvia
  rationale: O particípio hifil de שׁגה indica causar alguém a errar ou se desviar. “Quem desvia” preserva a força genérica e soa natural em português.
- source_word: יְשָׁרִים
  choice: os justos
  rationale: O termo designa pessoas moralmente retas. “Os justos” é claro e corrente em português bíblico moderno, sem limitar o sentido à mera honestidade.
- source_word: בְּדֶרֶךְ רָע
  choice: para um caminho mau
  rationale: דֶּרֶךְ mantém a metáfora do caminho como conduta. Embora בְּ possa ser vertido por “em”, a construção portuguesa “desviar para um caminho” expressa naturalmente o resultado do ato sem abandonar a imagem hebraica.
- source_word: בִּשְׁחוּתוֹ
  choice: na sua própria cova
  rationale: O substantivo pode indicar cova, ruína ou destruição. “Cova” preserva a imagem concreta de retribuição, enquanto a nota registra a amplitude lexical.
- source_word: הוּא יִפּוֹל
  choice: cairá ele mesmo
  rationale: 'O pronome hebraico explícito é enfático. “Ele mesmo” conserva o contraste: quem desvia outros sofre pessoalmente a consequência.'
- source_word: וּתְמִימִים
  choice: mas os íntegros
  rationale: תְמִימִים descreve pessoas de integridade, irrepreensíveis em sua conduta. “Íntegros” comunica essa inteireza moral; “mas” explicita o contraste contextual expresso pelo וְ.
- source_word: יִנְחֲלוּ
  choice: herdarão
  rationale: נחל significa receber ou possuir como herança. “Herdarão” conserva a ressonância própria do verbo e a formulação concisa do provérbio.
- source_word: טוֹב
  choice: o bem
  rationale: O hebraico é deliberadamente amplo. “O bem” preserva essa abertura sem restringi-lo a prosperidade material ou a uma bênção específica.
theological_decisions:
- issue: Imagem da consequência moral em בִּשְׁחוּתוֹ
  choice: Manter no texto a imagem concreta de “sua própria cova”
  alternative: “sua própria destruição” ou “sua própria ruína”
  rationale: A imagem comunica justiça retributiva em forma proverbial sem definir de maneira estreita o modo do juízo. A nota preserva as alternativas abstratas permitidas pelo termo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo e as imagens de caminho, queda, cova e herança, evitando especificar além do hebraico a natureza do “bem” herdado.
