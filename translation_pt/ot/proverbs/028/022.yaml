  text: נִֽבֳהָ֥ל לַ/ה֗וֹן אִ֭ישׁ רַ֣ע עָ֑יִן וְ/לֹֽא יֵ֝דַע כִּי חֶ֥סֶר יְבֹאֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/022.yaml
  text: A man with an evil eye hastens after wealth[a], and does not know that poverty will come upon him.
translation:
  language: pt
  text: O homem de olho mau[a] se apressa em busca de riqueza e não sabe que a pobreza virá sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “avarento” ou “ganancioso”; literalmente, “homem de olho mau”, expressão idiomática hebraica para uma disposição egoísta, invejosa ou mesquinha.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֳהָל
  choice: se apressa
  rationale: O particípio nifal de בהל comunica pressa ou ação precipitada. “Se apressa” preserva esse sentido e soa natural em português.
- source_word: לַהוֹן
  choice: em busca de riqueza
  rationale: הוֹן significa riqueza ou bens; com ל, indica aqui o objetivo para o qual o homem se apressa. “Em busca de riqueza” expressa com clareza essa orientação.
- source_word: אִישׁ
  choice: O homem
  rationale: Mantém o singular masculino do hebraico e o estilo característico da formulação proverbial.
- source_word: רַע עָיִן
  choice: de olho mau
  rationale: Preserva a imagem literal e a amplitude do idioma hebraico, que pode indicar avareza, ganância, inveja ou uma disposição egoísta e ressentida. A nota esclarece o sentido cultural.
- source_word: וְלֹא יֵדַע
  choice: e não sabe
  rationale: Reproduz diretamente a coordenação hebraica e mantém o fluxo conciso do provérbio.
- source_word: חֶסֶר
  choice: pobreza
  rationale: Embora חֶסֶר possa significar falta ou carência, neste contexto a “pobreza” expressa de modo concreto o resultado econômico da busca precipitada por riqueza.
- source_word: יְבֹאֶנּוּ
  choice: virá sobre ele
  rationale: Traduz a ideia de que a pobreza chega até o homem ou o alcança, preservando o tom solene de advertência.
