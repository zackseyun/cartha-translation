source:
  edition: WLC
  text: אִ֣ישׁ אֱ֭מוּנוֹת רַב בְּרָכ֑וֹת וְ/אָ֥ץ לְ֝/הַעֲשִׁ֗יר לֹ֣א יִנָּקֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/020.yaml
  text: A faithful man will abound with blessings[a], but one who hastens to become rich will not go unpunished.
translation:
  language: pt
  text: O homem fiel terá muitas bênçãos, mas quem se apressa para enriquecer não ficará impune.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não será considerado inocente” ou “não será absolvido”.
    reason: Alternativas lexicais para לֹא יִנָּקֶה, que pode enfocar tanto a culpa quanto a punição decorrente.
lexical_decisions:
- source_word: אִישׁ
  choice: homem
  rationale: Preserva o singular masculino representativo do hebraico e soa natural no gênero proverbial.
- source_word: אֱמוּנוֹת
  choice: fiel
  rationale: O plural abstrato, literalmente ligado a fidelidade, lealdade ou confiabilidade, qualifica אִישׁ; “fiel” expressa essa integridade de modo claro e conciso.
- source_word: רַב בְּרָכוֹת
  choice: terá muitas bênçãos
  rationale: רַב predica abundância, e בְּרָכוֹת está no plural. A formulação comunica naturalmente a generalização proverbial sem especificar além do texto a forma dessas bênçãos.
- source_word: וְאָץ
  choice: mas quem se apressa
  rationale: אָץ indica pressa ou ímpeto impaciente. “Mas quem se apressa” preserva o contraste e produz uma construção corrente em português.
- source_word: לְהַעֲשִׁיר
  choice: para enriquecer
  rationale: O infinitivo hifil aqui expressa tornar-se rico ou adquirir riqueza; “enriquecer” é natural, digno e semanticamente preciso.
- source_word: לֹא יִנָּקֶה
  choice: não ficará impune
  rationale: O nifal de נקה pode indicar não ser declarado inocente ou não escapar da punição. “Não ficará impune” comunica com clareza a consequência proverbial, enquanto a nota registra alternativas mais formais.
theological_decisions:
- issue: Natureza das bênçãos
  choice: Manter apenas “bênçãos”, sem defini-las como exclusivamente materiais ou espirituais.
  alternative: Explicitar prosperidade material ou favor divino.
  rationale: O substantivo hebraico é amplo, e o versículo não especifica a forma ou a fonte imediata das bênçãos; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo antitético do provérbio foi mantido, e o marcador da nota foi colocado junto à expressão que ele esclarece.
