  text: אָ֭דָם עָשֻׁ֣ק בְּ/דַם נָפֶשׁ עַד בּ֥וֹר יָ֝נ֗וּס אַל יִתְמְכוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/017.yaml
  text: A man burdened with the blood of a life will flee as far as the pit[b][a]; let no one support him.
translation:
  language: pt
  text: Um homem sobrecarregado pelo sangue de uma vida[a] fugirá até a cova[b]; ninguém o ampare.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “um homem oprimido/sobrecarregado pelo sangue de uma vida”. A expressão se refere à culpa de sangue por ter tirado uma vida.
    reason: lexical_alternative
  - marker: b
    text: Ou “até a sepultura”. O termo hebraico traduzido como “cova” pode sugerir um fim mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: O homem
  rationale: O substantivo singular apresenta o caso de um indivíduo, e não a humanidade em geral. “O homem” mantém essa referência concreta e o gênero gramatical do texto.
- source_word: עָשֻׁק
  choice: sobrecarregado
  rationale: Embora o termo possa significar “oprimido”, na construção com “sangue” descreve alguém sob o peso e a responsabilidade de sangue derramado. “Sobrecarregado” preserva essa imagem sem tornar explícita no corpo do texto uma interpretação jurídica.
- source_word: בְּדַם נָפֶשׁ
  choice: pelo sangue de uma vida
  rationale: A expressão hebraica é literalmente “pelo/com o sangue de uma vida [ou pessoa]” e, no contexto, indica culpa por tirar uma vida. A tradução conserva a imagem concreta do sangue, e a nota esclarece o sentido idiomático.
- source_word: עַד בּוֹר
  choice: até a cova
  rationale: בּוֹר pode designar cova, poço, cisterna ou calabouço e também sugerir a sepultura ou um fim mortal. “Cova” preserva a imagem e sua possível ressonância de morte.
- source_word: יָנוּס
  choice: fugirá
  rationale: O imperfeito descreve a fuga do culpado em direção ao seu fim. “Fugirá” é direto e natural em português.
- source_word: אַל יִתְמְכוּ בוֹ
  choice: ninguém o ampare
  rationale: O jussivo plural negativo dirige uma proibição a pessoas não especificadas. “Ninguém o ampare” comunica de modo conciso a ordem de não sustentá-lo nem ajudá-lo.
theological_decisions:
- issue: A natureza da culpa ligada ao sangue
  choice: Manter no texto a imagem hebraica do “sangue de uma vida” e explicar em nota sua referência à culpa por tirar uma vida
  alternative: Traduzir diretamente como “culpado de homicídio” ou “sob culpa de sangue”
  rationale: O hebraico associa sangue e vida sem especificar no próprio verso todas as categorias jurídicas ou morais. A formulação escolhida conserva a tensão e evita restringir indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. A expressão incomum “sangue de uma vida” foi mantida deliberadamente para preservar a imagem concreta e a ambiguidade do hebraico, com esclarecimento em nota.
