reference: Proverbs 28:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ דְּ֝רָכַ֗יִם וְ/ה֣וּא עָשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/006.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his ways[a], though he is rich.
translation:
  language: pt
  text: Melhor é o pobre que anda com integridade do que aquele cujos caminhos são tortuosos, embora seja rico.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Melhor é o pobre que anda em sua integridade do que o tortuoso de caminhos, e ele é rico”. A frase hebraica final diz literalmente “e ele é rico” e se refere à pessoa de caminhos tortuosos.'
    reason: alternativa lexical e esclarecimento da sintaxe
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: No início desta comparação proverbial, טוֹב tem valor comparativo. “Melhor é” preserva a estrutura aforística e soa natural em português.
- source_word: רָשׁ
  choice: o pobre
  rationale: רָשׁ designa uma pessoa pobre ou necessitada. O masculino singular foi mantido de acordo com a forma representativa do hebraico.
- source_word: הוֹלֵךְ
  choice: que anda
  rationale: O verbo הלך significa literalmente “andar” e, na literatura de sabedoria, também descreve a conduta. A tradução conserva essa metáfora ética.
- source_word: בְּתֻמּוֹ
  choice: com integridade
  rationale: תֹּם/תֻּם expressa inteireza, retidão ou integridade, sem necessariamente afirmar ausência absoluta de pecado. “Com integridade” é claro e idiomático.
- source_word: מֵעִקֵּשׁ
  choice: do que aquele ... são tortuosos
  rationale: 'A preposição comparativa מִן introduz o segundo termo: alguém caracterizado como tortuoso. A formulação portuguesa liga naturalmente essa qualidade aos “caminhos” mencionados em seguida.'
- source_word: דְּרָכַיִם
  choice: cujos caminhos
  rationale: דְּרָכַיִם, formalmente uma forma dual/plural, refere-se aqui aos caminhos ou à conduta de alguém. “Cujos caminhos” preserva a imagem hebraica e evita reduzir o termo abstratamente a “comportamento”.
- source_word: וְהוּא עָשִׁיר
  choice: embora seja rico
  rationale: A frase final significa literalmente “e ele é rico” e se refere ao homem de caminhos tortuosos. “Embora” explicita a força concessiva sugerida pelo contraste proverbial, mantendo o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora sapiencial de andar e de caminhos foi preservada; a relação concessiva da oração final foi explicitada no texto, enquanto a forma mais literal aparece na nota.
