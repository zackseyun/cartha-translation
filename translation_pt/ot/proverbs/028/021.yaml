  yaml_path: translation/ot/proverbs/028/021.yaml
  text: To show partiality is not good[c][b][a], yet for a piece of bread a man will transgress.
translation:
  language: pt
  text: Não é bom mostrar parcialidade[a], mas, por um pedaço de pão[b], um homem transgride[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “reconhecer rostos”, expressão que significa agir com parcialidade ou favoritismo.
    reason: lexical_alternative
  - marker: b
    text: Ou “por um bocado de pão”; a ideia é que alguém pode cometer uma transgressão em troca de algo insignificante.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz “um homem” em sentido genérico, próprio da linguagem proverbial.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֵּר פָּנִים
  choice: mostrar parcialidade
  rationale: A expressão idiomática significa literalmente “reconhecer rostos” e descreve favorecer alguém no julgamento ou no tratamento. “Mostrar parcialidade” comunica com clareza sua força ética.
- source_word: לֹא טוֹב
  choice: não é bom
  rationale: Preserva a avaliação moral ampla e direta do hebraico, sem restringi-la ao âmbito jurídico.
- source_word: וְעַל
  choice: mas, por
  rationale: A conjunção permite aqui uma relação adversativa entre a condenação da parcialidade e a facilidade com que alguém transgride por um ganho insignificante.
- source_word: פַּת לֶחֶם
  choice: um pedaço de pão
  rationale: Designa uma pequena porção de pão e ressalta quão ínfimo pode ser o benefício que leva alguém a agir mal.
- source_word: יִפְשַׁע
  choice: chega a transgredir
  rationale: פשע possui peso moral de transgressão ou rebeldia. A construção portuguesa expressa a disposição ou ocorrência proverbial sem transformar a forma imperfeita em uma previsão absoluta sobre todo homem.
- source_word: גָּבֶר
  choice: um homem
  rationale: Mantém o substantivo masculino singular do texto hebraico, empregado em sentido representativo no provérbio.
theological_decisions:
- issue: Masculino genérico na máxima proverbial
  choice: um homem
  alternative: uma pessoa
  rationale: O hebraico usa גָּבֶר, substantivo masculino singular, em sentido representativo. A tradução conserva a forma marcada do original, e uma nota esclarece seu alcance proverbial genérico.
- issue: Força moral de פשע
  choice: transgredir
  alternative: pecar; agir mal
  rationale: “Transgredir” preserva a gravidade moral e potencialmente jurídica do verbo sem especificar indevidamente contra quem ou contra o que se dirige a transgressão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das notas acompanha sua ocorrência no texto. A formulação mantém o paralelismo conciso e o contraste moral do provérbio.
