source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם מְפַחֵ֣ד תָּמִ֑יד וּ/מַקְשֶׁ֥ה לִ֝בּ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/014.yaml
  text: Blessed is the man who is always fearful[b][a], but whoever hardens his heart will fall into calamity.
translation:
  language: pt
  text: Feliz é o homem que teme sempre[a], mas quem endurece o coração cairá na desgraça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Feliz é o homem que vive sempre com temor.” O hebraico não declara explicitamente o objeto de “teme”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cairá no mal” ou “cairá na aflição”. O termo hebraico רָעָה pode significar mal, dano, aflição, desgraça ou calamidade; aqui, provavelmente se refere a uma situação ruinosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz é
  rationale: A forma de bem-aventurança apresenta uma condição digna de estima. “Feliz é” soa natural no gênero sapiencial e evita sugerir apenas uma bênção futura.
- source_word: אָדָם
  choice: o homem
  rationale: O substantivo masculino singular tem sentido representativo e genérico neste provérbio; a tradução conserva essa forma sem restringir a aplicação do dito.
- source_word: מְפַחֵד תָּמִיד
  choice: que teme sempre
  rationale: O particípio de פחד expressa temor ou receio contínuo, e תָּמִיד indica constância. A formulação preserva a força lexical e não acrescenta um objeto que o hebraico não declara.
- source_word: וּמַקְשֶׁה לִבּוֹ
  choice: mas quem endurece o coração
  rationale: O hifil de קשה significa tornar duro ou endurecer. A expressão portuguesa mantém com clareza o sentido moral e volitivo de obstinação.
- source_word: יִפּוֹל
  choice: cairá
  rationale: O imperfeito apresenta a consequência proverbial; o futuro é idiomático em português e conserva a imagem de cair.
- source_word: בְּרָעָה
  choice: na desgraça
  rationale: רָעָה pode indicar mal, dano, aflição ou calamidade. Neste contexto, “desgraça” comunica uma consequência ruinosa sem decidir que se trata do mal moral praticado.
theological_decisions:
- issue: Natureza do temor elogiado na primeira parte
  choice: Manter “teme” sem indicar objeto
  alternative: “teme sempre o SENHOR” ou “é sempre cauteloso”
  rationale: O hebraico não explicita o objeto do temor. Acrescentar “o SENHOR” resolveria uma ambiguidade real, embora seja uma leitura plausível no contexto sapiencial; usar apenas “cauteloso” enfraqueceria o sentido lexical de פחד.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conserva o paralelismo proverbial, o masculino genérico do hebraico e a ambiguidade quanto ao objeto do temor.
