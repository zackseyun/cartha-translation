  terminology: «Repreende», «favor» e «lisonjeia com a língua» são escolhas adequadas. «Lisonjeia com a língua» conserva deliberadamente a imagem hebraica, embora «língua lisonjeira» seja uma alternativa portuguesa mais compacta.
