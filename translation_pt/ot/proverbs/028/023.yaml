- from: Quem repreende alguém depois encontrará favor,[a] mais do que quem lisonjeia com a língua.
  to: Quem repreende alguém encontrará mais tarde favor, mais do que quem lisonjeia com a língua.[a]
  rationale: A revisão desloca «mais tarde» para junto de «encontrará», esclarecendo que o favor é obtido posteriormente. Mantêm-se o sentido temporal mais provável de אַחֲרַי, a comparação introduzida por מִן e a imagem de לָשׁוֹן («língua»).
