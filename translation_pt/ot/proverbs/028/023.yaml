  text: מ֘וֹכִ֤יחַ אָדָ֣ם אַ֭חֲרַי חֵ֣ן יִמְצָ֑א מִֽ/מַּחֲלִ֥יק לָשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/023.yaml
  text: Whoever rebukes a man will afterward find favor[a], more than one who flatters with the tongue.
translation:
  language: pt
  text: Quem repreende alguém encontrará mais tarde favor, mais do que quem lisonjeia com a língua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «... encontrará mais tarde favor, mais do que quem tem língua lisonjeira».'
    reason: Alternativa lexical e sintática para מִמַּחֲלִיק לָשׁוֹן, preservando a imagem hebraica da língua e a comparação.
lexical_decisions:
- source_word: מוֹכִיחַ
  choice: repreende
  rationale: O particípio no hifil de יכח indica censurar ou corrigir. «Repreende» preserva a força direta da advertência e o contraste com a lisonja.
- source_word: אָדָם
  choice: alguém
  rationale: Aqui designa o indivíduo que recebe a repreensão. «Alguém» é natural no português atual e mantém o sentido humano genérico sem especificar sexo onde o contexto não o exige.
- source_word: אַחֲרַי
  choice: depois
  rationale: 'No contexto, tem valor adverbial temporal: o favor vem posteriormente, talvez em contraste com a reação imediata à repreensão.'
- source_word: חֵן
  choice: favor
  rationale: חֵן denota favor, boa vontade ou aceitação. «Favor» preserva a amplitude do termo sem lhe impor uma conotação teológica específica.
- source_word: יִמְצָא
  choice: encontrará
  rationale: O imperfeito expressa o resultado esperado numa afirmação proverbial; «encontrará» reproduz também a imagem verbal do hebraico.
- source_word: מִמַּחֲלִיק לָשׁוֹן
  choice: mais do que quem lisonjeia com a língua
  rationale: O מִן marca a comparação, e מחליק, literalmente ligado a tornar liso, descreve a fala lisonjeira. A formulação conserva a imagem hebraica da língua sem deixar de ser compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A ordem foi mantida próxima do hebraico, e a imagem «com a língua» foi preservada. O marcador [a] aparece no texto principal.
