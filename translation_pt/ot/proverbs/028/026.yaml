id: PRO.28.26
reference: Proverbs 28:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/לִבּ/וֹ ה֣וּא כְסִ֑יל וְ/הוֹלֵ֥ךְ בְּ֝/חָכְמָ֗ה ה֣וּא יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/026.yaml
  text: Whoever trusts in his own heart is a fool[b][a], but he who walks in wisdom will escape.
translation:
  language: pt
  text: Quem confia no próprio coração[a] é insensato, mas quem anda com sabedoria escapará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “coração” muitas vezes se refere à pessoa interior, incluindo pensamento, discernimento e vontade, e não apenas às emoções.
    reason: cultural_note
  - marker: b
    text: Ou “será livrado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: confia
  rationale: O particípio de בטח expressa depositar confiança em alguém ou algo. “Confia” é natural em português e preserva a advertência contra a autoconfiança.
- source_word: בְּלִבּוֹ
  choice: no próprio coração
  rationale: לֵב designa o coração como centro da vida interior, incluindo pensamento, discernimento e vontade. “Próprio” explicita o sufixo de terceira pessoa e o sentido reflexivo sem substituir a imagem hebraica.
- source_word: כְסִיל
  choice: insensato
  rationale: É um termo característico da literatura sapiencial para a pessoa moral e intelectualmente imprudente. “Insensato” preserva essa categoria e mantém um registro digno e compreensível.
- source_word: וְהוֹלֵךְ
  choice: mas quem anda
  rationale: הלך descreve metaforicamente a maneira de viver ou proceder. “Anda” conserva a metáfora hebraica, enquanto “quem” produz uma construção natural em português.
- source_word: בְּחָכְמָה
  choice: com sabedoria
  rationale: A expressão comunica que a sabedoria orienta a conduta. “Com sabedoria” é mais idiomático em português do que “em sabedoria”, sem reduzir a frase ao simples advérbio “sabiamente”.
- source_word: יִמָּלֵט
  choice: escapará
  rationale: O nifal de מלט pode indicar escapar ou ser livrado. “Escapará” se ajusta ao estilo conciso do provérbio e não especifica indevidamente o agente do livramento.
- source_word: הוּא ... הוּא
  choice: é ... quem ... escapará
  rationale: Os pronomes hebraicos dão ênfase aos dois sujeitos. Em português, a estrutura paralela com “quem” e os verbos expressos transmite o contraste sem repetição artificial.
theological_decisions:
- issue: Antropologia de “coração”
  choice: Manter “coração” e explicar sua amplitude em nota.
  alternative: Traduzir por “mente”, “juízo” ou “si mesmo”.
  rationale: No hebraico bíblico, o coração abrange pensamento, discernimento e vontade, além das emoções. A imagem deve ser preservada sem ser reduzida a uma categoria psicológica moderna.
- issue: Resultado expresso por יִמָּלֵט
  choice: Usar “escapará” no texto e registrar “será livrado” como alternativa.
  alternative: Traduzir diretamente por “será livrado”.
  rationale: A forma verbal permite tanto a ideia de escapar quanto a de ser livrado. A tradução principal mantém a concisão e evita introduzir um agente não expresso, enquanto a nota preserva a alternativa passiva.
- issue: Masculino singular genérico
  choice: Usar “quem” com o predicativo masculino singular “insensato”.
  alternative: Empregar uma formulação plural ou repetir “a pessoa que”.
  rationale: A formulação conserva a representação singular e o gênero gramatical do hebraico, mas soa natural em português.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva o paralelismo e a metáfora sapiencial de “andar”, com tom conciso e digno.
