  naturalness: O texto é claro, atual e apropriado ao registro proverbial. “De discernimento e conhecimento” reproduz de modo mais natural e conciso os dois particípios hebraicos do que “que entende e tem conhecimento”, sem fundi-los.
  terminology: “Transgressão”, “terra”, “governantes”, “homem”, “discernimento” e “conhecimento” são escolhas adequadas. “Estabilidade” é uma explicitação interpretativa defensável para a cláusula difícil, desde que a nota deixe clara a elipse e a incerteza do hebraico.
