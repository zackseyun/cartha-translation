  text: Because of a land's transgression[a], its rulers are many, but by a man of understanding and knowledge[b], stability endures.
translation:
  language: pt
  text: Por causa da transgressão de uma terra, seus governantes são muitos; mas, por meio de um homem[a] de discernimento e conhecimento, a estabilidade perdura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Homem” traduz o hebraico אָדָם (adam), termo singular para ser humano usado aqui de modo representativo; no contexto, pode referir-se a um líder ou conselheiro e não implica necessariamente exclusão por sexo.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico da segunda parte é difícil e elíptico. Mais literalmente, lê-se: “mas, por meio de um homem que discerne e conhece, assim ele prolonga”; o sujeito e o objeto de “prolonga” não são expressos. O sentido provável é que o discernimento sábio faz durar a boa ordem de uma terra.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Por causa da transgressão
  rationale: A preposição בְּ é entendida em sentido causal. “Transgressão” conserva a dimensão moral e jurídica de פֶשַׁע, incluindo a ideia de rebelião contra a ordem legítima.
- source_word: אֶרֶץ
  choice: uma terra
  rationale: אֶרֶץ designa aqui um território politicamente organizado. “Uma terra” preserva o caráter genérico do provérbio e evita limitar o sentido a um país específico.
- source_word: רַבִּים שָׂרֶיהָ
  choice: seus governantes são muitos
  rationale: שָׂרִים pode indicar príncipes, autoridades ou governantes. A tradução mantém a formulação direta do hebraico sem decidir se o texto alude à multiplicação simultânea das autoridades ou à frequente sucessão de governantes.
- source_word: וּבְאָדָם
  choice: mas, por meio de um homem
  rationale: “Mas” explicita o contraste do paralelismo, e “por meio de” expressa o provável valor instrumental de בְּ. אָדָם está no singular e apresenta representativamente uma pessoa humana, provavelmente na função de líder ou conselheiro.
- source_word: מֵבִין יֹדֵעַ
  choice: que entende e tem conhecimento
  rationale: Os dois particípios foram mantidos separadamente para preservar tanto o discernimento expresso por בין quanto o conhecimento expresso por ידע.
- source_word: כֵּן יַאֲרִיךְ
  choice: a estabilidade perdura
  rationale: A construção hebraica é difícil e elíptica. כֵּן pode significar literalmente “assim” ou apontar para aquilo que está firme ou em boa ordem, enquanto o hifil de ארך comunica prolongamento. A tradução explicita o sentido contextual provável — a permanência de uma ordem estável — sem esconder a incerteza, registrada em nota.
