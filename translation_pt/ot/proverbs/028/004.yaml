id: PRO.28.4
reference: Proverbs 28:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֹזְבֵ֣י ת֭וֹרָה יְהַֽלְל֣וּ רָשָׁ֑ע וְ/שֹׁמְרֵ֥י ת֝וֹרָ֗ה יִתְגָּ֥רוּ בָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/004.yaml
  text: Those who forsake the law praise the wicked[b][a], but those who keep the law contend with them.
translation:
  language: pt
  text: Os que abandonam a instrução elogiam o perverso, mas os que guardam a instrução se opõem a eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entram em conflito com eles” ou “lutam contra eles”. O verbo hebraico indica oposição ativa ou contenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹזְבֵי
  choice: os que abandonam
  rationale: O particípio qal plural descreve pessoas caracterizadas por deixar ou abandonar algo. “Abandonam” transmite com naturalidade o peso moral do verbo.
- source_word: תּוֹרָה
  choice: a instrução
  rationale: Em Provérbios, תּוֹרָה frequentemente designa ensino ou instrução moral dotada de autoridade. “Instrução” preserva esse sentido sapiencial sem restringi-lo indevidamente à legislação.
- source_word: יְהַלְלוּ
  choice: elogiam
  rationale: O piel de הלל significa louvar, elogiar ou enaltecer. “Elogiam” soa natural em português e comunica a aprovação irônica dada ao perverso.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O singular substantivado tem valor representativo, referindo-se ao tipo ou à classe da pessoa perversa. O singular português conserva a forma compacta do hebraico.
- source_word: שֹׁמְרֵי
  choice: os que guardam
  rationale: O particípio qal de שמר pode significar guardar, observar ou cumprir. “Guardam” mantém a imagem hebraica de preservar e obedecer à instrução.
- source_word: יִתְגָּרוּ
  choice: se opõem
  rationale: O hitpael de גרה neste contexto expressa envolver-se ativamente contra alguém, contender ou provocar confronto. “Se opõem” é claro e corrente, sem sugerir necessariamente violência física.
- source_word: בָם
  choice: a eles
  rationale: Com este verbo, a preposição ב marca as pessoas contra as quais se dirige a oposição. O pronome plural mantém a mudança compacta do singular representativo para o grupo referido.
theological_decisions:
- issue: Referente de “eles” no segundo membro
  choice: Mantém-se o pronome plural sem explicitar um único antecedente, abrangendo os perversos ou os que abandonam a instrução mencionados no primeiro membro.
  alternative: Explicitar “aos perversos” ou restringir o referente aos que abandonam a instrução.
  rationale: O hebraico passa do substantivo singular representativo רָשָׁע ao pronome plural בָם. Preservar “eles” conserva a ambiguidade genuína sem impor uma identificação mais estreita.
- issue: Alcance de תּוֹרָה
  choice: “instrução”, no sentido de ensino moral autorizado
  alternative: “lei” ou “ensino”
  rationale: No contexto sapiencial de Provérbios, “instrução” comunica melhor a amplitude de תּוֹרָה, embora “lei” continue possível, sobretudo quando se percebe uma dimensão pactual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi preservado por “abandonam/guardam”, e a repetição de “a instrução” reproduz a estrutura enfática do hebraico.
