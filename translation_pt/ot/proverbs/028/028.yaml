  text: בְּ/ק֣וּם רְ֭שָׁעִים יִסָּתֵ֣ר אָדָ֑ם וּ֝/בְ/אָבְדָ֗/ם יִרְבּ֥וּ צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/028.yaml
  text: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
translation:
  language: pt
  text: Quando os perversos se levantam, cada um se esconde[a]; mas, quando eles perecem, os justos se multiplicam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fica escondido”; o verbo hebraico pode ser entendido como passivo (“fica escondido”) ou em sentido médio/reflexivo (“se esconde”).
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקוּם
  choice: quando ... se levantam
  rationale: A preposição בְּ com o infinitivo construto de קום forma aqui uma oração temporal; “quando ... se levantam” é natural e conserva a ideia de ascensão ou tomada de poder.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado plural designa pessoas moralmente más. “Os perversos” preserva a categoria moral sem acrescentar uma referência masculina específica.
- source_word: יִסָּתֵר
  choice: se esconde
  rationale: O nifal de סתר pode ter sentido passivo ou médio/reflexivo. No contexto, “se esconde” expressa naturalmente a provável ideia de alguém que se retira da vista, sem eliminar a alternativa passiva, registrada em nota.
- source_word: אָדָם
  choice: cada um
  rationale: אָדָם é singular e genérico neste dito proverbial. “Cada um” transmite em português corrente o ser humano individual representativo e mantém o contraste distributivo com os plurais do verso.
- source_word: וּבְאָבְדָם
  choice: mas, quando eles perecem
  rationale: A conjunção com בְּ, o infinitivo construto e o sufixo de terceira pessoa masculina plural forma uma oração temporal. “Mas” explicita o paralelismo antitético, e “eles” retoma os perversos.
- source_word: יִרְבּוּ
  choice: se multiplicam
  rationale: רבה indica tornar-se numeroso ou aumentar. “Se multiplicam” conserva a formulação compacta e deixa em aberto se o aumento é numérico, social ou de presença pública.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo substantivado plural é a designação habitual, na literatura sapiencial, dos que se caracterizam pela justiça; “os justos” é claro e tradicional em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção proverbial permanece concisa, e o paralelismo antitético foi preservado. Optou-se por “cada um” para o אָדָם genérico, evitando restringi-lo ao sexo masculino.
