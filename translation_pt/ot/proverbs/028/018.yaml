  text: הוֹלֵ֣ךְ תָּ֭מִים יִוָּשֵׁ֑עַ וְ/נֶעְקַ֥שׁ דְּ֝רָכַ֗יִם יִפּ֥וֹל בְּ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/018.yaml
  text: Whoever walks in integrity will be delivered[b][a], but one crooked in his ways will fall at once.
translation:
  language: pt
  text: Quem anda com integridade será livrado[a], mas quem segue caminhos tortuosos cairá de repente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será salvo” ou “será mantido em segurança”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em uma”; provavelmente “de uma só vez” ou “subitamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: anda
  rationale: Preserva a metáfora hebraica do caminhar como modo de vida e é natural no português sapiencial.
- source_word: תָּמִים
  choice: com integridade
  rationale: Expressa inteireza moral sem sugerir perfeição absoluta ou ausência de pecado.
- source_word: יִוָּשֵׁעַ
  choice: será livrado
  rationale: Mantém o sentido passivo de resgate ou preservação no contexto sapiencial, sem restringi-lo à salvação em sentido doutrinário.
- source_word: נֶעְקַשׁ
  choice: tortuosos
  rationale: Comunica desvio moral e conserva a imagem espacial ligada aos caminhos.
- source_word: דְּרָכַיִם
  choice: caminhos
  rationale: Preserva o plural e a metáfora hebraica para padrões de conduta.
- source_word: יִפּוֹל
  choice: cairá
  rationale: Mantém a imagem concreta da queda, que no provérbio também sugere ruína.
- source_word: בְּאֶחָת
  choice: de repente
  rationale: Representa uma provável força adverbial da expressão, cujo sentido literal e interpretação permanecem incertos; a ambiguidade é registrada em nota.
theological_decisions:
- issue: Alcance de יִוָּשֵׁעַ no contexto sapiencial
  choice: será livrado
  alternative: será salvo; será mantido em segurança
  rationale: O contexto aponta para livramento ou preservação de caráter geral, sem excluir ressonâncias teológicas mais amplas nem impor um sentido soteriológico específico.
- issue: Expressão masculina genérica
  choice: quem ... quem
  alternative: aquele que ... o homem que
  rationale: O português permite representar naturalmente o alcance genérico do masculino singular hebraico com “quem”, sem alterar o caráter individual da máxima.
- issue: Sentido de בְּאֶחָת
  choice: de repente
  alternative: de uma só vez; em uma [coisa]
  rationale: A expressão hebraica é concisa e discutida. O texto principal oferece o sentido adverbial mais provável, enquanto a nota preserva a formulação literal e outras possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção paralela preserva o contraste proverbial, e as metáforas de andar, caminhos e cair são mantidas.
