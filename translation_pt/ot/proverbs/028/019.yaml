review_pass:
  verdict: revise
  source_fidelity: A primeira linha traduz adequadamente o particípio עובד no sentido agrícola, אדמתו como «a sua terra» e a imagem concreta de «pão». O contraste introduzido por «mas» é justificável. Na segunda linha, porém, «terá pobreza em abundância» enfraquece a repetição irônica de שבע («ficar saciado/ter o bastante») e soa semanticamente artificial em português. «Ficará saciado de pobreza» reproduz melhor a construção e a ironia hebraicas.
  naturalness: «Cultiva a sua terra» e «terá pão em abundância» são claros e proverbiais. «Corre atrás de» é possível, mas «persegue» é mais conciso e apropriado ao registro sapiencial. «Coisas vazias» é compreensível, embora pouco idiomático como objeto de busca; «coisas sem valor» é mais natural no português moderno.
  terminology: רֵקִים permanece semanticamente aberto entre «coisas vazias/sem valor» e, para alguns, pessoas vazias ou sem valor. A nota deve manter essa alternativa sem apresentar «ociosas» como certeza lexical. «Saciado de pobreza» conserva a repetição de שבע e o efeito irônico.
  issues:
  - severity: medium
    issue: «terá pobreza em abundância»
    rationale: A formulação substitui a imagem verbal de ser saciado por uma expressão de abundância aplicada à pobreza, menos natural e menos fiel ao paralelismo lexical e à ironia do hebraico.
  - severity: low
    issue: «coisas vazias» como leitura principal
    rationale: É literal, mas pouco idiomática em português neste contexto. «Coisas sem valor» comunica melhor o provável sentido, enquanto a nota preserva a alternativa literal e a possível referência a pessoas.
  revised_text: Quem cultiva a sua terra terá pão em abundância, mas quem persegue coisas sem valor[a] ficará saciado de pobreza.
