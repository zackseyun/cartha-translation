- from: Quem cultiva a sua terra terá pão em abundância, mas quem corre atrás de coisas vazias[a] terá pobreza em abundância.
  to: Quem cultiva a sua terra terá pão em abundância, mas quem persegue coisas sem valor[a] ficará saciado de pobreza.
