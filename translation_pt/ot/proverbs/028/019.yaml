  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֥ף רֵ֝קִ֗ים יִֽשְׂבַּֽע רִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/019.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
translation:
  language: pt
  text: Quem cultiva a sua terra terá pão em abundância, mas quem persegue coisas sem valor[a] ficará saciado de pobreza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas vazias”; o hebraico também pode ser entendido, por alguns, como referência a pessoas vazias ou sem valor.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: cultiva
  rationale: O particípio de עבד descreve aqui o trabalho produtivo realizado na terra. “Cultiva” é natural em português e explicita adequadamente o contexto agrícola.
- source_word: אַדְמָתוֹ
  choice: a sua terra
  rationale: אֲדָמָה pode significar solo, chão ou terra; no contexto agrícola, “a sua terra” é claro e idiomático.
- source_word: יִשְׂבַּע לָחֶם
  choice: terá pão em abundância
  rationale: A expressão significa literalmente ficar saciado de pão. Esta formulação conserva a imagem concreta do pão e comunica provisão suficiente em português natural.
- source_word: וּמְרַדֵּף
  choice: mas quem corre atrás de
  rationale: O waw assume valor contrastivo no paralelismo. “Corre atrás de” expressa de modo atual a busca insistente indicada pelo particípio intensivo.
- source_word: רֵקִים
  choice: coisas vazias
  rationale: O termo significa literalmente “vazios” e pode referir-se a coisas fúteis ou, possivelmente, a pessoas sem valor ou ociosas. “Coisas vazias” preserva melhor a ambiguidade sem definir silenciosamente o referente.
- source_word: יִשְׂבַּע רִישׁ
  choice: terá pobreza em abundância
  rationale: 'A repetição de “terá ... em abundância” reproduz a correspondência com a primeira linha e mantém a ironia do hebraico: a única fartura resultante será a pobreza.'
