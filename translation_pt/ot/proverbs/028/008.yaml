source:
  edition: WLC
  text: מַרְבֶּ֣ה ה֭וֹנ/וֹ בְּ/נֶ֣שֶׁךְ ו/ב/תרבית לְ/חוֹנֵ֖ן דַּלִּ֣ים יִקְבְּצֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/008.yaml
  text: Whoever increases his wealth by interest and profit gathers it for one who is gracious to the poor[a][b].
translation:
  language: pt
  text: Quem aumenta sua riqueza cobrando juros e acréscimos[a] ajunta-a para quem trata os pobres com bondade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de usura e ganho”. Os termos hebraicos se referem ao ganho obtido com empréstimos, muitas vezes com sentido explorador.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para quem é generoso com os pobres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבֶּה
  choice: aumenta
  rationale: O particípio hifil de רבה expressa a ação de fazer crescer ou multiplicar; “aumenta” é claro e natural no contexto da acumulação de riqueza.
- source_word: הוֹנוֹ
  choice: sua riqueza
  rationale: הוֹן designa riqueza, bens ou recursos; “riqueza” preserva o sentido econômico amplo e a referência possessiva do hebraico.
- source_word: בְּנֶשֶׁךְ
  choice: cobrando juros
  rationale: נֶשֶׁךְ designa juros cobrados sobre empréstimos e frequentemente traz conotação exploradora. O verbo “cobrando” explicita de modo natural em português a relação financeira indicada pela preposição hebraica.
- source_word: וּבְתַרְבִּית
  choice: e acréscimos
  rationale: תַּרְבִּית é o aumento ou valor adicional exigido, especialmente em empréstimos. “Acréscimos” distingue o termo de “juros” sem generalizá-lo como qualquer lucro comercial.
- source_word: לְחוֹנֵן
  choice: para quem trata ... com bondade
  rationale: O particípio de חנן significa mostrar favor, compaixão ou graça. A formulação verbal é idiomática em português e preserva a ação benevolente, sem restringi-la apenas à doação material.
- source_word: דַּלִּים
  choice: os pobres
  rationale: דַּל pode indicar o pobre, necessitado, fraco ou socialmente humilde; o contexto econômico favorece “os pobres”.
- source_word: יִקְבְּצֶנּוּ
  choice: ajunta-a
  rationale: קבץ significa reunir ou ajuntar, e o sufixo masculino singular retoma הוֹן, “riqueza”. “Ajunta-a” conserva a concisão e a ironia proverbial de acumular para outra pessoa.
theological_decisions:
- issue: Natureza da condenação dos juros
  choice: Manter os termos econômicos sem declarar que toda forma moderna de juros é idêntica à prática condenada
  alternative: Traduzir diretamente por “usura”, tornando explícito o caráter abusivo
  rationale: Os dois substantivos hebraicos referem-se ao ganho obtido em empréstimos e podem ter sentido explorador, mas o verso não define aqui todas as condições da prática. O texto principal permanece concreto, e a nota registra a alternativa mais marcada.
- issue: Sentido de חנן em relação aos pobres
  choice: “trata os pobres com bondade”
  alternative: “é generoso com os pobres”
  rationale: “Bondade” preserva a amplitude de mostrar favor ou compaixão, enquanto “generoso” pode sugerir especificamente contribuição financeira.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ajunta-a” mantém o paralelismo conciso do provérbio; “cobrando juros e acréscimos” torna explícito o contexto de empréstimos sem eliminar a alternativa lexical mais severa, registrada em nota.
