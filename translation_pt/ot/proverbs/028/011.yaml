  text: חָכָ֣ם בְּ֭/עֵינָי/ו אִ֣ישׁ עָשִׁ֑יר וְ/דַ֖ל מֵבִ֣ין יַחְקְרֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/011.yaml
  text: A rich man is wise in his own eyes[a], but a poor man who has understanding searches him out.
translation:
  language: pt
  text: 'O rico é sábio aos seus próprios olhos,

    mas o pobre que tem entendimento o examina.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o investiga” ou “o sonda”. O verbo hebraico pode indicar pesquisar, examinar ou penetrar a verdadeira condição de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם בְּעֵינָיו
  choice: é sábio aos seus próprios olhos
  rationale: Preserva o predicativo “sábio” e a expressão hebraica de autoavaliação, sem ampliar para a paráfrase interpretativa “considera-se sábio”.
- source_word: אִישׁ עָשִׁיר
  choice: o rico
  rationale: Expressa naturalmente em português o homem rico apresentado como figura proverbial; o singular masculino do hebraico é mantido.
- source_word: וְדַל
  choice: mas o pobre
  rationale: O waw liga orações em contraste; “mas” explicita essa relação no português corrente. דַל designa alguém de poucos recursos.
- source_word: מֵבִין
  choice: que tem entendimento
  rationale: O particípio de בין caracteriza o pobre como alguém dotado de discernimento; a oração relativa é clara e mantém a formulação do texto.
- source_word: יַחְקְרֶנּוּ
  choice: o examina
  rationale: חקר pode significar investigar, sondar ou examinar. “Examina” soa natural em português e conserva a ideia de penetrar além da autoimagem do rico sem explicitar indevidamente o resultado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial conciso. “Aos seus próprios olhos” mantém o idioma semítico, amplamente inteligível em português, enquanto “o examina” evita uma formulação artificial e preserva a amplitude lexical do verbo.
