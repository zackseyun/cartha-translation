  text: מְכַסֶּ֣ה פְ֭שָׁעָי/ו לֹ֣א יַצְלִ֑יחַ וּ/מוֹדֶ֖ה וְ/עֹזֵ֣ב יְרֻחָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/013.yaml
  text: Whoever covers his transgressions will not prosper[b][a], but he who confesses and forsakes them will be shown mercy.
translation:
  language: pt
  text: Quem encobre suas transgressões[a] não prosperará, mas quem as confessa e abandona receberá misericórdia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oculta” ou “esconde” suas transgressões.
    reason: lexical_alternative
  - marker: b
    text: Ou “será alvo de misericórdia”. O hebraico emprega uma forma passiva; também pode ser traduzido por “alcançará misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: encobre
  rationale: Preserva a imagem concreta de cobrir e, em português, comunica naturalmente a ideia moral de ocultar uma falta.
- source_word: פְשָׁעָיו
  choice: suas transgressões
  rationale: פשע indica transgressão ou rebeldia deliberada; “transgressões” conserva essa força melhor que o termo mais amplo “pecados”.
- source_word: יַצְלִיחַ
  choice: não prosperará
  rationale: O hifil de צלח expressa ter êxito ou prosperar. “Não prosperará” é natural no gênero sapiencial e mantém o alcance amplo do verbo.
- source_word: וּמוֹדֶה
  choice: confessa
  rationale: Neste contexto, ידה se refere a reconhecer abertamente as transgressões; “confessa” é claro e idiomático.
- source_word: וְעֹזֵב
  choice: abandona
  rationale: עזב significa deixar ou abandonar. “Abandona” expressa com clareza a renúncia prática às transgressões e é mais corrente no português moderno que “deixa” ou “renuncia a elas”.
- source_word: יְרֻחָם
  choice: receberá misericórdia
  rationale: A forma passiva de רחם indica que a pessoa será objeto de compaixão ou misericórdia. A formulação portuguesa é natural, mantém o agente implícito e evita sugerir que a misericórdia foi merecida.
- source_word: objeto implícito depois de וּמוֹדֶה וְעֹזֵב
  choice: as
  rationale: O pronome retoma “suas transgressões” como objeto dos dois verbos, tornando explícita em português a elipse natural do hebraico sem repetição desnecessária.
- source_word: particípios e pronomes masculinos singulares de valor genérico
  choice: Quem ... quem
  rationale: “Quem” preserva o singular genérico e a aplicação universal do provérbio de modo natural em português, sem introduzir plural.
theological_decisions:
- issue: Agente da misericórdia implícito na forma passiva
  choice: Manter o agente não expresso em “receberá misericórdia”
  alternative: Deus terá misericórdia dele
  rationale: Embora o contexto sapiencial possa apontar para a misericórdia divina, o hebraico não nomeia o agente. A tradução evita acrescentar explicitamente “Deus” e conserva essa abertura.
- issue: Relação entre confissão, abandono e misericórdia
  choice: Traduzir a sequência sem explicar se ela constitui condição, evidência de arrependimento ou mérito
  alternative: Parafrasear como promessa condicionada ou como descrição explícita de arrependimento
  rationale: O paralelismo afirma a relação de modo conciso, sem elaborar sua mecânica teológica. A tradução preserva essa tensão e não apresenta a misericórdia como algo conquistado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Encobre” preserva a metáfora hebraica; “abandona” soa mais corrente que “deixa” no contexto moral. A estrutura concisa mantém o paralelismo antitético do provérbio.
