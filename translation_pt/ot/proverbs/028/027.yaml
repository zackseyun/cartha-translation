  text: נוֹתֵ֣ן לָ֭/רָשׁ אֵ֣ין מַחְס֑וֹר וּ/מַעְלִ֥ים עֵ֝ינָ֗י/ו רַב מְאֵרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/027.yaml
  text: Whoever gives to the poor will have no lack[a], but he who hides his eyes will have many curses.
translation:
  language: pt
  text: Quem dá ao pobre não passará necessidade, mas quem fecha os olhos[a] terá muitas maldições.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “esconde os olhos”; isto é, desvia o olhar ou ignora deliberadamente o pobre.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Quem dá
  rationale: O particípio qal de נתן tem sentido genérico e proverbial; “Quem dá” expressa naturalmente uma conduta habitual.
- source_word: לָרָשׁ
  choice: ao pobre
  rationale: רָשׁ designa uma pessoa pobre ou sem recursos. O singular genérico “ao pobre” preserva a forma e o alcance do hebraico.
- source_word: אֵין מַחְסוֹר
  choice: não passará necessidade
  rationale: A construção existencial negativa indica ausência de carência. Esta formulação é clara em português e não especifica indevidamente a natureza da provisão.
- source_word: וּמַעְלִים עֵינָיו
  choice: mas quem fecha os olhos
  rationale: O particípio hifil de עלם com “olhos” forma uma imagem de ignorar deliberadamente a necessidade alheia. “Fecha os olhos” conserva a imagem e comunica o sentido idiomático em português atual.
- source_word: רַב מְאֵרוֹת
  choice: terá muitas maldições
  rationale: מְאֵרוֹת é o plural de “maldição”. O hebraico não traz verbo explícito; “terá” completa naturalmente a oração em paralelo com a consequência expressa no primeiro membro, sem acrescentar a ideia específica de “receber”.
