base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/003.yaml
  text: A poor man who oppresses the lowly is like a sweeping rain that leaves no food[a].
translation:
  language: pt
  text: O homem pobre que oprime os necessitados é como chuva devastadora, e não há pão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e não há pão”; aqui, “pão” pode representar alimento ou sustento em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: homem
  rationale: O substantivo designa aqui um indivíduo do sexo masculino apresentado como figura representativa no provérbio; “homem” preserva essa forma masculina sem acrescentar a nuance possível de força.
- source_word: רָשׁ
  choice: pobre
  rationale: Expressa diretamente a falta de recursos e é a equivalência mais natural neste contexto sapiencial.
- source_word: עֹשֵׁק
  choice: que oprime
  rationale: O particípio de עשק indica exploração ou opressão em curso; a oração relativa produz sintaxe portuguesa clara e preserva o sentido ativo.
- source_word: דַּלִּים
  choice: os necessitados
  rationale: O termo pode indicar pessoas humildes, fracas ou pobres. “Necessitados” comunica sua vulnerabilidade e evita repetir “pobre”, preservando a distinção lexical em relação a רָשׁ.
- source_word: מָטָר סֹחֵף
  choice: chuva torrencial que tudo arrasta
  rationale: מָטָר é “chuva”, e סֹחֵף descreve seu efeito de arrastar ou levar embora. A formulação comunica naturalmente em português a força destrutiva da imagem.
- source_word: וְאֵין לָחֶם
  choice: e não há pão
  rationale: Mantém de perto a construção hebraica e sua imagem concreta. “Pão” pode representar alimento ou sustento em geral, possibilidade explicada em nota.
