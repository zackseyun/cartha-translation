  text: נוֹצֵ֣ר תּ֭וֹרָה בֵּ֣ן מֵבִ֑ין וְ/רֹעֶה זֽ֝וֹלְלִ֗ים יַכְלִ֥ים אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/007.yaml
  text: Whoever keeps the law is a discerning son[b][a], but he who associates with gluttons shames his father.
translation:
  language: pt
  text: Quem guarda a instrução é um filho que tem discernimento, mas quem se associa a glutões[a] envergonha seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dissipados” ou “perdulários”. Literalmente, “pastoreia glutões”; o verbo hebraico usa uma imagem pastoral para expressar associação ou convivência habitual.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹצֵר
  choice: guarda
  rationale: O particípio expressa guardar, observar ou cumprir fielmente; “guarda” combina naturalmente com “instrução” e conserva a ideia de cuidado obediente.
- source_word: תּוֹרָה
  choice: a instrução
  rationale: Em Provérbios, תּוֹרָה frequentemente designa ensino autorizado, não necessariamente a Lei mosaica em sentido técnico. “Instrução” preserva essa amplitude contextual.
- source_word: בֵּן מֵבִין
  choice: um filho que tem discernimento
  rationale: Mantém o substantivo masculino explícito בֵּן e traduz o particípio מֵבִין de modo natural e claro em português.
- source_word: וְרֹעֶה
  choice: mas quem anda na companhia de
  rationale: O verbo significa literalmente “pastoreia”, mas aqui funciona idiomaticamente para a convivência ou associação habitual com determinadas pessoas. A expressão portuguesa comunica essa relação sem uma imagem pastoral obscura.
- source_word: זֹלְלִים
  choice: libertinos
  rationale: O termo pode indicar glutões, mas também pessoas entregues ao excesso e à dissipação. “Libertinos” exprime bem o sentido amplo no contexto, enquanto a alternativa mais literal é registrada em nota.
- source_word: יַכְלִים
  choice: envergonha
  rationale: O hifil indica causar vergonha ou desonra; “envergonha” é direto e idiomático.
- source_word: אָבִיו
  choice: seu pai
  rationale: Tradução direta do substantivo com sufixo possessivo masculino singular.
