id: PRO.28.5
reference: Proverbs 28:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַנְשֵׁי רָ֭ע לֹא יָבִ֣ינוּ מִשְׁפָּ֑ט וּ/מְבַקְשֵׁ֥י יְ֝הוָ֗ה יָבִ֥ינוּ כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/005.yaml
  text: Evil men do not understand justice[a], but those who seek Yahweh understand all things.
translation:
  language: pt
  text: Os homens maus não entendem a justiça, mas os que buscam Yahweh entendem tudo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, “tudo” se refere a um amplo discernimento moral, especialmente a respeito da justiça, e não a conhecer todas as coisas sem limite.
    reason: Esclarecimento do alcance contextual de כֹל e prevenção de uma leitura como onisciência literal.
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  choice: os homens maus
  rationale: A expressão construta significa literalmente “homens do mal”. “Os homens maus” conserva a forma masculina e representativa do hebraico e soa natural em português.
- source_word: יָבִינוּ
  choice: entendem
  rationale: O verbo בין abrange entender e discernir. “Entendem” é claro e natural, além de permitir a repetição intencional nos dois membros do provérbio.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto sapiencial, o termo indica justiça, ordem moral e aquilo que é correto, não apenas uma sentença judicial.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: os que buscam Yahweh
  rationale: O particípio descreve pessoas caracterizadas por buscar continuamente a Yahweh. A formulação é idiomática e preserva essa ideia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כֹל
  choice: tudo
  rationale: O absoluto כֹל é expresso naturalmente por “tudo”. O contexto delimita a afirmação proverbial ao discernimento moral amplo, sem apagar a força abrangente do hebraico.
theological_decisions:
- issue: Alcance de “entendem tudo”
  choice: Preservar a afirmação abrangente como generalização proverbial sobre discernimento moral.
  alternative: Interpretar a expressão como conhecimento literal e ilimitado de todas as coisas.
  rationale: O paralelismo contrapõe a incapacidade dos maus de compreender a justiça ao amplo discernimento dos que buscam Yahweh. A tradução mantém “tudo”, enquanto a nota esclarece o sentido contextual sem inserir onisciência no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “entendem” reproduz o paralelismo hebraico; “justiça” mantém o vocabulário ético do texto.
