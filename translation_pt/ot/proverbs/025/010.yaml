  text: פֶּֽן יְחַסֶּדְ/ךָ֥ שֹׁמֵ֑עַ וְ֝/דִבָּתְ/ךָ֗ לֹ֣א תָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/010.yaml
  text: lest one who hears it disgrace you[b][a], and your bad reputation not turn back.
translation:
  language: pt
  text: para que quem ouvir não desonre você[a], e a má fama a seu respeito não tenha volta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “envergonhar você” ou “censurar você”. O verbo hebraico é raro e seu sentido neste contexto é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “e uma notícia desfavorável a seu respeito não terá volta”. O hebraico pode se referir tanto a uma notícia desfavorável que continua circulando quanto à desonra que já não pode ser revertida.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: do contrário
  rationale: Introduz a consequência indesejável da revelação mencionada no contexto anterior. Em português atual, “do contrário” expressa naturalmente a advertência proverbial.
- source_word: יְחַסֶּדְךָ
  choice: desonrar você
  rationale: O verbo raro e difícil parece ter aqui sentido negativo e público. “Desonrar” preserva a ideia de vergonha ou censura social sem definir excessivamente o termo.
- source_word: שֹׁמֵעַ
  choice: quem ouvir
  rationale: O particípio substantivado designa uma pessoa indefinida que ouve a revelação. A formulação é direta e natural em português.
- source_word: דִבָּתְךָ
  choice: a má fama a seu respeito
  rationale: דִּבָּה pode indicar notícia desfavorável, rumor difamatório ou infâmia. Esta escolha comunica o dano público dirigido ao interlocutor, evitando sugerir inequivocamente que ele próprio praticou calúnia.
- source_word: לֹא תָשׁוּב
  choice: não terá volta
  rationale: Conserva a imagem de algo que não retorna nem pode ser revertido, em uma expressão portuguesa idiomática e concisa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. O pronome “você” favorece ampla legibilidade brasileira; as notas preservam a incerteza lexical e a ambiguidade da segunda oração.
