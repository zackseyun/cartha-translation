base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/005.yaml
  text: Remove the wicked from before the king[b][a], and his throne will be established in righteousness.
translation:
  language: pt
  text: Retire[a] o perverso da presença do rei, e seu trono será estabelecido em justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Afaste o perverso de diante do rei”. A ordem provavelmente se refere à remoção da influência corruptora da corte real.'
    reason: lexical_alternative
  - marker: b
    text: “Em justiça” também pode ser entendido como “pela justiça” ou “em retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Retire
  rationale: O imperativo qal, em paralelo com o versículo anterior, expressa a remoção de algo ou alguém. “Retire” preserva a força imperativa sem especificar o método.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo masculino singular substantivado designa uma pessoa perversa. “O perverso” conserva o singular e funciona naturalmente como tipo genérico em português.
- source_word: לִפְנֵי מֶלֶךְ
  choice: da presença do rei
  rationale: A expressão idiomática indica afastar alguém de diante do rei, isto é, de sua presença e esfera cortesã.
- source_word: וְיִכּוֹן
  choice: será firmado
  rationale: O nifal de כון comunica ser estabelecido ou tornado firme; “será firmado” preserva o sentido passivo-resultativo.
- source_word: בַּצֶּדֶק
  choice: em justiça
  rationale: A preposição pode indicar esfera ou meio, e צֶדֶק reúne sentidos morais e judiciais. “Em justiça” é natural no contexto do governo real e mantém alguma abertura semântica.
- source_word: כִּסְאוֹ
  choice: o trono dele
  rationale: O sufixo de terceira pessoa masculina singular retoma naturalmente o rei. “O trono dele” deixa clara a referência.
