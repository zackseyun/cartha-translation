source:
  edition: WLC
  text: מַ֣יִם קָ֭רִים עַל נֶ֣פֶשׁ עֲיֵפָ֑ה וּ/שְׁמוּעָ֥ה ט֝וֹבָ֗ה מֵ/אֶ֥רֶץ מֶרְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/025.yaml
  text: Like cold water to a weary soul[a], so is good news from a distant land.
translation:
  language: pt
  text: Como água fria para uma alma cansada, assim é uma boa notícia de uma terra distante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um bom relato de uma terra distante”. O termo hebraico שְׁמוּעָה pode significar “notícia”, “relato” ou “informação recebida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קָרִים
  choice: água fria
  rationale: Embora מַיִם tenha forma plural, funciona aqui como substantivo de massa. “Água fria” é natural em português e preserva a imagem vívida de refrigério.
- source_word: עַל
  choice: para
  rationale: Neste contexto comparativo, “para” expressa de modo natural a relação entre a água e quem está cansado, evitando o pouco idiomático “sobre a alma”.
- source_word: נֶפֶשׁ עֲיֵפָה
  choice: alma cansada
  rationale: נֶפֶשׁ pode significar alma, vida ou pessoa; “alma” mantém o registro poético e a amplitude do hebraico. “Cansada” comunica o esgotamento sem intensificá-lo indevidamente.
- source_word: וּשְׁמוּעָה טוֹבָה
  choice: assim são as boas notícias
  rationale: שְׁמוּעָה designa notícia, relato ou informação recebida. O plural idiomático “boas notícias” soa natural em português e concorda com a construção comparativa.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: vindas de uma terra distante
  rationale: A expressão hebraica significa literalmente algo como “de uma terra de distância”. “Uma terra distante” preserva a ideia geográfica e o tom poético.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve cadência poética. A comparação do hebraico foi explicitada com “assim”, sem alterar seu sentido. O marcador de nota foi colocado após a frase à qual se refere.
