base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/020.yaml
  text: Like one who takes off a garment on a cold day[a], and like vinegar on soda[b], is one who sings songs to a troubled heart.
translation:
  language: pt
  text: Como quem tira uma roupa num dia frio, e como vinagre sobre natrão[a], assim é quem canta canções a um coração angustiado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O natrão era um álcali mineral. O vinagre sobre ele provoca uma reação efervescente.
    reason: Esclarecimento lexical e cultural de נָתֶר.
  - marker: b
    text: Literalmente, “sobre um coração mau”. Aqui, “mau” indica uma condição interior penosa, aflita ou triste, não necessariamente maldade moral.
    reason: Preservação da expressão hebraica e de sua amplitude semântica.
lexical_decisions:
- source_word: מַעֲדֶה
  choice: quem tira
  rationale: Expressa o sentido contextual de remover uma peça de roupa, em formulação natural e concisa.
- source_word: בֶּגֶד
  choice: uma roupa
  rationale: Termo geral e acessível para uma peça de vestuário, sem especificar indevidamente casaco ou manto.
- source_word: בְּיוֹם קָרָה
  choice: num dia frio
  rationale: Reproduz de modo natural a circunstância temporal e a inconveniência da ação.
- source_word: חֹמֶץ
  choice: vinagre
  rationale: É o equivalente português direto do termo hebraico.
- source_word: נָתֶר
  choice: natrão
  rationale: Designa com maior precisão o álcali mineral antigo; uma nota esclarece o termo pouco comum e a reação evocada.
- source_word: וְשָׁר בַּשִּׁרִים
  choice: quem canta canções
  rationale: Mantém o particípio e o plural hebraico em português claro.
- source_word: עַל לֶב רָע
  choice: a um coração angustiado
  rationale: No contexto, רָע descreve uma condição interior penosa ou aflita, não necessariamente maldade moral; 'angustiado' comunica essa condição sem eliminar a referência ao coração.
theological_decisions:
- issue: Sentido moral ou emocional de לֵב רָע
  choice: coração angustiado
  alternative: coração mau
  rationale: O paralelismo retrata a inadequação de cantar para alguém interiormente aflito. A tradução evita atribuir perversidade moral onde o contexto favorece sofrimento ou tristeza, enquanto a nota registra a forma literal.
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. 'Natrão' preserva a referência histórica com explicação em nota; a repetição 'Como... e como...' mantém a série de comparações do hebraico.
