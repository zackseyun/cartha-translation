  text: אִם רָעֵ֣ב שֹׂ֭נַאֲ/ךָ הַאֲכִלֵ֣/הוּ לָ֑חֶם וְ/אִם צָ֝מֵ֗א הַשְׁקֵ֥/הוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/021.yaml
  text: If your enemy is hungry[a], feed him bread, and if he is thirsty, give him water to drink.
translation:
  language: pt
  text: Se o seu inimigo[a] estiver com fome, alimente-o com pão; e, se estiver com sede, dê-lhe água para beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aquele que odeia você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz diretamente a condição expressa pela partícula hebraica, sem torná-la mais esperada como faria “quando”.
- source_word: רָעֵב
  choice: estiver com fome
  rationale: Expressa de modo natural em português o adjetivo predicativo que descreve a condição do inimigo, sem intensificá-lo indevidamente.
- source_word: שֹׂנַאֲךָ
  choice: o seu inimigo
  rationale: O particípio com sufixo significa literalmente “aquele que odeia você”; “o seu inimigo” comunica com naturalidade a relação hostil, e a alternativa literal é preservada em nota.
- source_word: הַאֲכִלֵהוּ
  choice: alimente-o
  rationale: Reproduz com clareza e concisão o imperativo causativo hebraico, “faça-o comer/dê-lhe de comer”.
- source_word: לָחֶם
  choice: com pão
  rationale: Mantém a imagem concreta de “pão” presente no hebraico, em vez de generalizá-la como “comida”.
- source_word: וְאִם
  choice: e, se
  rationale: Preserva a coordenação e o paralelismo da segunda oração condicional.
- source_word: צָמֵא
  choice: estiver com sede
  rationale: Traduz naturalmente o adjetivo predicativo e mantém o paralelismo com “estiver com fome”.
- source_word: הַשְׁקֵהוּ
  choice: dê-lhe ... para beber
  rationale: Expressa de forma idiomática o imperativo causativo “faça-o beber/dê-lhe de beber”.
- source_word: מָיִם
  choice: água
  rationale: Mantém o objeto explícito e concreto do texto hebraico.
theological_decisions:
- issue: Formas masculinas singulares em um provérbio de alcance representativo
  choice: 'Manter o referente no singular masculino: “o seu inimigo ... alimente-o ... dê-lhe”.'
  alternative: 'Usar formulação neutralizada ou plural: “seus inimigos ... alimente-os”.'
  rationale: O hebraico emprega formas masculinas singulares com força representativa. Preservá-las mantém tanto a forma da fonte quanto o caráter pessoal da exortação, sem restringir a aplicação moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Alimente-o com pão” conserva a imagem concreta e a força imperativa; a pontuação destaca o paralelismo das duas condições.
