  text: כְּבֹ֣ד אֱ֭לֹהִים הַסְתֵּ֣ר דָּבָ֑ר וּ/כְבֹ֥ד מְ֝לָכִ֗ים חֲקֹ֣ר דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/002.yaml
  text: It is the glory of God to conceal a matter[b][a], and the glory of kings to search out a matter.
translation:
  language: pt
  text: 'A glória de Deus está em ocultar uma questão[a],

    e a glória dos reis, em investigá-la.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “um assunto”. Também se pode traduzir: “A honra de Deus está em esconder uma questão, e a honra dos reis, em examiná-la”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹד
  choice: glória
  rationale: Preserva o sentido elevado de honra, dignidade ou esplendor e mantém o paralelismo entre Deus e os reis.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No contexto da tradição sapiencial de Israel, refere-se ao único Deus.
- source_word: הַסְתֵּר
  choice: ocultar
  rationale: Expressa uma ação deliberada de manter algo encoberto, em registro digno e natural.
- source_word: דָּבָר
  choice: questão
  rationale: Aqui designa um assunto ou caso a ser considerado, e não necessariamente uma palavra; a repetição é representada pelo pronome em português para maior naturalidade.
- source_word: וּ/כְבֹד
  choice: e a glória
  rationale: Mantém a coordenação do hebraico sem impor uma oposição adversativa.
- source_word: מְלָכִים
  choice: reis
  rationale: Conserva a referência régia concreta do texto hebraico.
- source_word: חֲקֹר
  choice: investigá-la
  rationale: Comunica a ideia de examinar ou pesquisar diligentemente uma questão e, com o pronome, preserva o mesmo referente do primeiro verso.
theological_decisions:
- issue: Relação entre o ocultamento por Deus e a investigação pelos reis
  choice: Apresentar as duas ações em paralelismo coordenado, sem explicar além do que o provérbio afirma.
  alternative: Interpretar como oposição entre mistério divino e governo humano, ou como participação dos reis na descoberta daquilo que Deus ocultou.
  rationale: O hebraico atribui glória a Deus ao ocultar e aos reis ao investigar, preservando uma tensão sapiencial sem formular uma doutrina mais ampla de revelação ou política.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A construção “está em” torna natural a relação nominal do hebraico; a divisão em dois versos conserva o paralelismo poético.
