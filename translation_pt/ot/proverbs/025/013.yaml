base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/013.yaml
  text: Like the coolness of snow on a harvest day is a faithful messenger to those who send him[b][a], for he refreshes the life of his masters.
translation:
  language: pt
  text: Como o frescor da neve num dia de colheita[a], assim é o mensageiro fiel para os que o enviam, pois ele revigora a vida de seus senhores.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como o frio da neve no tempo da colheita”. A imagem hebraica provavelmente se refere ao frescor associado à neve, e não à neve caindo e prejudicando a colheita.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele restaura a alma de seus senhores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִנַּת שֶׁלֶג
  choice: Como o frescor da neve
  rationale: 'צִנָּה designa frio ou frescor. “Frescor” preserva o caráter positivo da comparação: alívio revigorante durante a colheita, sem sugerir necessariamente uma nevasca prejudicial.'
- source_word: בְּיוֹם קָצִיר
  choice: num dia de colheita
  rationale: Mantém a imagem concreta do hebraico e soa natural em português, evocando o calor e o esforço associados à época da colheita.
- source_word: צִיר נֶאֱמָן
  choice: mensageiro fiel
  rationale: צִיר é alguém enviado com uma mensagem, e נֶאֱמָן indica fidelidade, confiabilidade e constância. “Mensageiro fiel” é claro, digno e preserva a dimensão moral da expressão.
- source_word: לְשֹׁלְחָיו
  choice: para os que o enviam
  rationale: Preserva o plural do hebraico, literalmente “para seus remetentes”, em formulação idiomática e compreensível.
- source_word: וְנֶפֶשׁ אֲדֹנָיו יָשִׁיב
  choice: pois ele revigora a vida de seus senhores
  rationale: נֶפֶשׁ pode significar vida, pessoa, ser interior ou alma; o hifil de שׁוב expressa fazer voltar ou restaurar. “Revigora a vida” comunica naturalmente a recuperação da vitalidade e se harmoniza com a imagem refrescante. אֲדֹנָיו foi mantido no plural como “seus senhores”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção correlativa “Como..., assim...” torna explícita a relação da comparação sem alterar seu conteúdo. “Pois” apresenta naturalmente a última oração como explicação do benefício trazido pelo mensageiro fiel.
