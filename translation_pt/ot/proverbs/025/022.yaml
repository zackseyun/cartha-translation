translation:
  language: pt
  text: pois você amontoará brasas sobre a cabeça dele[a], e o SENHOR lhe retribuirá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você recolherá” ou “remexerá brasas sobre a cabeça dele”. A expressão hebraica foi preservada; há diferentes interpretações sobre se ela indica levar o inimigo à vergonha e ao arrependimento ou aumentar seu juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o SENHOR recompensará você”. O verbo hebraico pode indicar pagar, retribuir ou recompensar; neste contexto, pode ter sentido favorável para quem pratica o bem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: pois assim
  rationale: Introduz a razão ligada à exortação do versículo anterior; “assim” torna natural em português a relação entre o ato precedente e seu resultado, sem romper a conexão explicativa.
- source_word: גֶחָלִים
  choice: brasas acesas
  rationale: Designa brasas vivas; a expressão conserva a imagem concreta e deixa claro que ainda queimam.
- source_word: חֹתֶה
  choice: amontoará
  rationale: O verbo descreve recolher ou remexer brasas; com “sobre a cabeça”, “amontoará” exprime naturalmente o resultado da ação, enquanto a alternativa mais literal é registrada em nota.
- source_word: עַל רֹאשׁוֹ
  choice: sobre a cabeça dele
  rationale: Tradução direta e atual que preserva a metáfora hebraica sem explicá-la no corpo do texto.
- source_word: וַיהוָה
  choice: e o SENHOR
  rationale: Emprega a convenção portuguesa tradicional para o nome divino, em versaletes representados aqui por maiúsculas.
- source_word: יְשַׁלֶּם לָךְ
  choice: recompensará você
  rationale: O verbo pode indicar pagar, retribuir ou recompensar. No contexto, a retribuição dirigida à pessoa que faz o bem é favorável; “recompensará” comunica isso com naturalidade.
theological_decisions:
- issue: Sentido da imagem das brasas acesas sobre a cabeça
  choice: Preservar a metáfora no texto principal sem definir seu efeito.
  alternative: Interpretá-la explicitamente como vergonha que conduz ao arrependimento, como aumento do juízo, ou como ambas as coisas.
  rationale: O hebraico apresenta a imagem sem explicar seu significado. Mantê-la preserva a ambiguidade e a tensão interpretativa genuínas.
- issue: Natureza da ação divina expressa por יְשַׁלֶּם
  choice: Traduzir como recompensa favorável no contexto.
  alternative: Usar o mais amplo “retribuirá” ou “pagará de volta”.
  rationale: Embora o verbo tenha sentido geral de retribuição, o contexto indica uma resposta favorável de Deus à pessoa que trata bem o inimigo; a nota conserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem concreta e sua ambiguidade, usando “você” para leitura natural e “SENHOR” como representação convencional do nome divino.
