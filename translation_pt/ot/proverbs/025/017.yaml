  yaml_path: translation/ot/proverbs/025/017.yaml
  text: Let your foot be seldom in your neighbor’s house[b][a], lest he have his fill of you and hate you.
translation:
  language: pt
  text: Não ponha o pé na casa do seu próximo[a] com muita frequência, para que ele não se farte de você e passe a odiar você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amigo” ou “companheiro”. O termo hebraico pode ter qualquer um desses sentidos.
    reason: alternative_reading
lexical_decisions:
- source_word: הֹקַר רַגְלְךָ
  choice: Não ponha o pé ... com muita frequência
  rationale: A construção significa literalmente tornar raro o próprio pé na casa de alguém, isto é, limitar as visitas. A formulação preserva a imagem concreta do pé e comunica de modo natural a força imperativa.
- source_word: מִבֵּית
  choice: na casa
  rationale: Embora מִן tenha sentido básico de procedência, nesta expressão idiomática indica que a presença na casa deve ser rara; em português, “na casa” transmite isso naturalmente.
- source_word: רֵעֶךָ
  choice: seu próximo
  rationale: רֵעַ pode designar próximo, amigo ou companheiro. “Próximo” conserva a amplitude social do termo sem pressupor intimidade.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz o resultado indesejável que a advertência procura evitar, expresso de maneira corrente em português.
- source_word: יִשְׂבָּעֲךָ
  choice: se canse de você
  rationale: O verbo שבע significa literalmente ficar satisfeito ou farto. No contexto, descreve alguém que se farta da presença frequente de outra pessoa; “se canse de você” comunica esse sentido com clareza.
- source_word: וּשְׂנֵאֶךָ
  choice: e passe a odiá-lo
  rationale: Mantém o sentido forte de שׂנא, “odiar”, e explicita naturalmente em português o desenvolvimento do resultado temido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A imagem hebraica do pé foi preservada, enquanto a expressão idiomática foi esclarecida por “com muita frequência”.
