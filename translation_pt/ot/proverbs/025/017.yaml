review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a advertência para limitar as visitas à casa do רֵעַ e preserva o resultado progressivo temido. Contudo, «se canse de você» enfraquece a imagem lexical de saciedade/fartura em יִשְׂבָּעֲךָ.
  naturalness: «Não ponha o pé na casa do seu próximo ... com muita frequência» é compreensível e mantém a imagem idiomática hebraica. No entanto, em «ele não se canse de você e passe a odiá-lo», o pronome «-lo» pode criar ambiguidade formal, pois o antecedente masculino mais próximo é «ele». «Odiar você» elimina essa ambiguidade.
  terminology: «Próximo» é uma opção adequada para רֵעֶךָ, e a nota registra legitimamente «amigo» e «companheiro» como alternativas. «Farte» representa melhor שבע sem introduzir interpretação doutrinária ou suavizar o paralelismo imagético.
  issues:
  - severity: medium
    issue: A expressão «se canse de você» atenua o verbo hebraico שבע.
    rationale: O verbo significa estar satisfeito, saciado ou farto; no contexto descreve alguém que se farta da presença frequente do visitante. «Fartar-se de você» conserva melhor a metáfora e permanece natural em português.
  - severity: medium
    issue: O pronome em «passe a odiá-lo» é potencialmente ambíguo.
    rationale: Embora o sentido pretendido seja que o anfitrião passe a odiar o visitante, «-lo» pode ser lido como retomando «ele». A forma explícita «odiar você» preserva sem ambiguidade o sufixo de segunda pessoa do hebraico.
  revised_text: Não ponha o pé na casa do seu próximo[a] com muita frequência, para que ele não se farte de você e passe a odiar você.
