- from: Não ponha o pé na casa do seu próximo[a] com muita frequência, para que ele não se canse de você e passe a odiá-lo.
  to: Não ponha o pé na casa do seu próximo[a] com muita frequência, para que ele não se farte de você e passe a odiar você.
