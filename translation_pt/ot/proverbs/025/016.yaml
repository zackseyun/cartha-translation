base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/016.yaml
  text: If you find honey[a], eat only enough for you, lest you become full of it and vomit it.
translation:
  language: pt
  text: Se você encontrar mel, coma apenas o suficiente[a], para não se fartar dele e vomitá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “coma quanto lhe baste”.'
    reason: Alternativa lexical que reproduz mais explicitamente a ideia de “sua suficiência” em דַּיֶּךָ.
lexical_decisions:
- source_word: דְּבַשׁ
  choice: mel
  rationale: O substantivo denota concretamente mel; a tradução conserva a imagem sem introduzir uma interpretação metafórica.
- source_word: מָצָאתָ
  choice: se você encontrar
  rationale: Embora a forma hebraica seja perfeita, o contexto proverbial apresenta uma situação geral; a construção condicional no presente do subjuntivo é natural em português.
- source_word: אֱכֹל
  choice: coma
  rationale: Imperativo masculino singular. O objeto fica implícito, como no hebraico, e é claramente retomado de “mel”.
- source_word: דַּיֶּךָ
  choice: apenas o suficiente
  rationale: Expressa a ideia de suficiência ou quantidade bastante, com a força limitadora da advertência. O pronome “você” já estabelece a referência pessoal do sufixo hebraico.
- source_word: פֶּן
  choice: para não
  rationale: Introduz a consequência indesejada que deve ser evitada; “para não” comunica essa relação de modo claro e atual.
- source_word: תִּשְׂבָּעֶנּוּ
  choice: se fartar dele
  rationale: O verbo significa ficar saciado ou farto, e o sufixo se refere ao mel. A escolha mantém a imagem física do consumo excessivo.
- source_word: וַהֲקֵאתוֹ
  choice: e vomitá-lo
  rationale: A forma verbal significa vomitar; a tradução preserva o sentido direto e forte, sem suavizá-lo.
