  text: אַל תִּתְהַדַּ֥ר לִ/פְנֵי מֶ֑לֶךְ וּ/בִ/מְק֥וֹם גְּ֝דֹלִ֗ים אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/006.yaml
  text: Do not exalt yourself before a king[a], and do not stand in the place of great men.
translation:
  language: pt
  text: Não se engrandeça diante de um rei e não se coloque no lugar dos grandes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os grandes” ou “entre pessoas importantes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַדַּר
  choice: se engrandeça
  rationale: O hitpael de הדר expressa aqui a ação reflexiva de buscar honra, destaque ou glória para si. “Engrandecer-se” transmite de modo natural a advertência contra a autopromoção.
- source_word: לִפְנֵי מֶלֶךְ
  choice: diante do rei
  rationale: לִפְנֵי significa “diante de” ou “na presença de”; a formulação é concisa e preserva o cenário da corte.
- source_word: בִּמְקוֹם גְּדֹלִים
  choice: entre os grandes
  rationale: A expressão literalmente fala do “lugar dos grandes”, isto é, das pessoas de posição elevada. Em português, “entre os grandes” comunica naturalmente tanto o espaço ocupado quanto o círculo social, sem especificar indevidamente “nobres”.
- source_word: תַּעֲמֹד
  choice: tome seu lugar
  rationale: Embora עמד signifique literalmente “ficar de pé”, neste contexto descreve posicionar-se ou instalar-se num lugar de honra. “Tome seu lugar” torna essa força contextual clara em português.
theological_decisions:
- issue: Referência social de גְּדֹלִים
  choice: os grandes
  alternative: as pessoas importantes; os homens importantes
  rationale: O masculino plural hebraico designa pessoas socialmente proeminentes, sem exigir que o provérbio se limite a homens. “Os grandes” conserva a forma substantivada e a ambiguidade quanto ao grupo exato, sem neutralizar a ideia de posição elevada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos negativos naturais. A formulação preserva o paralelismo entre buscar exaltação diante do rei e ocupar um lugar entre pessoas de alta posição.
