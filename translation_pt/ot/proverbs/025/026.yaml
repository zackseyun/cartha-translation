base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/026.yaml
  text: Like a muddied spring and a polluted fountain is a righteous man who gives way before the wicked[a].
translation:
  language: pt
  text: Como nascente turvada e fonte contaminada é o justo que cede diante do perverso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como nascente enlameada pelo pisoteio e fonte corrompida é o justo que vacila diante do perverso.”'
    reason: Alternativas lexicais para נִרְפָּשׂ, מָשְׁחָת e מָט, preservando a possível imagem de uma nascente pisoteada e a noção de instabilidade.
lexical_decisions:
- source_word: מַעְיָן
  choice: nascente
  rationale: Designa uma fonte natural de água. “Nascente” é claro em português atual e permite manter a variação poética em relação a מָקוֹר.
- source_word: נִרְפָּשׂ
  choice: turvada
  rationale: O particípio passivo descreve água tornada turva, possivelmente por agitação ou pisoteio. “Turvada” preserva a imagem sem especificar além do que o texto exige.
- source_word: מָקוֹר
  choice: fonte
  rationale: Em paralelismo com מַעְיָן, indica uma origem ou manancial de água. “Fonte” mantém a quase sinonímia e a distinção poética.
- source_word: מָשְׁחָת
  choice: contaminada
  rationale: O termo expressa corrupção, deterioração ou ruína. Aplicado a uma fonte de água, “contaminada” comunica de modo natural que ela se tornou imprópria.
- source_word: צַדִּיק
  choice: o justo
  rationale: Adjetivo masculino singular usado como substantivo. “O justo” é a forma proverbial, concisa e natural em português, com valor representativo.
- source_word: מָט
  choice: cede
  rationale: O verbo pode indicar cambalear, vacilar, inclinar-se ou ceder. No contexto de estar diante do perverso, “cede” expressa adequadamente uma capitulação moral ou social, enquanto a alternativa literal é preservada em nota.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa estar perante ou na presença de alguém; “diante de” é idiomático e mantém a relação direta entre o justo e o perverso.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Adjetivo masculino singular substantivado. “O perverso” conserva o singular representativo e contrasta naturalmente com “o justo”.
theological_decisions:
- issue: Forma de gênero em צַדִּיק
  choice: o justo
  alternative: a pessoa justa
  rationale: O hebraico emprega o masculino singular em formulação proverbial. A tradução conserva essa forma gramatical sem negar seu alcance representativo.
- issue: Sentido de מָט diante do perverso
  choice: cede
  alternative: vacila
  rationale: O contexto admite tanto a imagem de instabilidade quanto a ideia de rendição diante de uma pessoa perversa. O texto principal comunica a provável força moral ou social, e a nota preserva a alternativa lexical sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo conciso. “Nascente” e “fonte” mantêm a variação dos termos hebraicos; “turvada” e “contaminada” tornam clara a imagem hídrica. A construção proverbial “o justo” / “o perverso” conserva o contraste masculino singular do original.
