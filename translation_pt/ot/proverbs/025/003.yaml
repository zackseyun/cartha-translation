  text: שָׁמַ֣יִם לָ֭/רוּם וָ/אָ֣רֶץ לָ/עֹ֑מֶק וְ/לֵ֥ב מְ֝לָכִ֗ים אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/003.yaml
  text: The heavens for height[a], and the earth for depth, and the heart of kings—there is no searching out.
translation:
  language: pt
  text: A altura dos céus, a profundidade da terra e o coração dos reis são insondáveis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «não há sondagem» ou «não há investigação». A expressão se refere mais diretamente ao coração dos reis e completa a comparação com a altura dos céus e a profundidade da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural hebraico designa os céus e, em paralelo com a terra, conserva a dimensão cósmica do provérbio.
- source_word: לָרוּם
  choice: a altura
  rationale: 'A preposição לְ introduz o aspecto considerado: os céus quanto à altura. A formulação nominal mantém o paralelismo conciso.'
- source_word: וָאָרֶץ
  choice: a terra
  rationale: Em paralelo com os céus, אֶרֶץ tem sentido cósmico, não o de uma região ou território.
- source_word: לָעֹמֶק
  choice: a profundidade
  rationale: Mantém o paralelismo com 'a altura' e expressa a terra considerada quanto à profundidade.
- source_word: לֵב
  choice: o coração
  rationale: Preserva a metáfora hebraica, que abrange pensamentos, intenções e disposições interiores.
- source_word: מְלָכִים
  choice: dos reis
  rationale: O substantivo significa especificamente reis e preserva o contexto régio do provérbio.
- source_word: אֵין חֵקֶר
  choice: são insondáveis
  rationale: Expressa em português natural a ausência de possibilidade de investigar ou descobrir plenamente. Embora a frase esteja ligada mais diretamente ao coração dos reis, a elipse poética permite que sua força alcance também a altura dos céus e a profundidade da terra.
theological_decisions:
- issue: Alcance de אֵין חֵקֶר
  choice: Aplicar 'são insondáveis' aos três elementos coordenados
  alternative: 'Ligá-lo gramaticalmente apenas a ''o coração dos reis'': ''quanto ao coração dos reis, não há como sondá-lo'''
  rationale: O hebraico apresenta primeiro dois sintagmas nominais elípticos e conclui com אֵין חֵקֶר. A tradução escolhida torna explícita a comparação implícita sem eliminar a possibilidade de que a afirmação recaia de modo especial sobre o coração dos reis; a nota registra a construção literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação nominal reproduz a concisão proverbial; 'insondáveis' evita o pouco natural 'não há investigação' no corpo do versículo, enquanto a nota preserva a forma e a ambiguidade sintática do hebraico.
