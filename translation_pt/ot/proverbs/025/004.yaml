  text: הָג֣וֹ סִיגִ֣ים מִ/כָּ֑סֶף וַ/יֵּצֵ֖א לַ/צֹּרֵ֣ף כֶּֽלִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/004.yaml
  text: Remove the dross from the silver[a], and a vessel comes out for the refiner.
translation:
  language: pt
  text: 'Retire da prata as impurezas,

    e surgirá uma peça para o refinador.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o ourives”. O termo hebraico pode designar de modo mais amplo um trabalhador de metais, mas “refinador” combina melhor com o contexto imediato da remoção de impurezas da prata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Retire
  rationale: O imperativo, no contexto, ordena remover ou afastar; “retire” é natural, direto e preserva o tom instrutivo do provérbio.
- source_word: סִיגִים
  choice: as impurezas
  rationale: O termo designa a escória ou os resíduos separados do metal no refino. “Impurezas” comunica a imagem com clareza em português corrente, sem depender de vocabulário metalúrgico menos conhecido.
- source_word: מִכָּסֶף
  choice: da prata
  rationale: 'A preposição indica separação: as impurezas são retiradas da prata.'
- source_word: וַיֵּצֵא
  choice: e sairá
  rationale: A forma verbal apresenta o resultado subsequente. O futuro proverbial expressa naturalmente em português o efeito da ação ordenada.
- source_word: לַצֹּרֵף
  choice: para o refinador
  rationale: צֹרֵף designa quem refina ou trabalha metais; “refinador” se ajusta melhor ao contexto imediato de remover impurezas da prata.
- source_word: כֶּלִי
  choice: um objeto
  rationale: כְּלִי é amplo e pode indicar utensílio, recipiente ou artigo produzido. “Objeto” preserva essa abertura sem impor que o produto seja necessariamente um vaso ou recipiente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e paralelismo conciso. “Impurezas” favorece a compreensão ampla; “objeto” preserva a extensão semântica de כֶּלִי. O marcador [a] foi colocado junto de “refinador”, termo ao qual a nota se refere.
