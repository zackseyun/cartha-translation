base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/019.yaml
  text: Confidence in a treacherous man in a day of trouble is like a bad tooth and a slipping foot[a][b].
translation:
  language: pt
  text: Confiar em homem traiçoeiro no dia da angústia é como um dente estragado e um pé que escorrega.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depositar confiança numa pessoa desleal”.'
    reason: lexical_alternative
  - marker: b
    text: “Pé que escorrega” também pode ser entendido como “pé vacilante” ou “pé cambaleante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן
  choice: dente
  rationale: O substantivo designa concretamente um dente; preservar a imagem corporal é preferível a tornar a expressão abstrata, como “dor de dente”.
- source_word: רֹעָה
  choice: estragado
  rationale: O termo descreve algo mau, defeituoso ou incapaz de cumprir sua função. “Dente estragado” é natural em português e comunica falta de confiabilidade sem especificar além do hebraico se está podre, quebrado ou lesionado.
- source_word: רֶגֶל
  choice: pé
  rationale: É o sentido normal e mantém com precisão a imagem corporal do provérbio.
- source_word: מוּעָדֶת
  choice: vacilante
  rationale: O particípio indica que o pé falseia, escorrega ou é instável. “Vacilante” preserva a instabilidade sem limitar a imagem a um único movimento.
- source_word: מִבְטָח
  choice: confiar
  rationale: Embora seja um substantivo que significa confiança ou segurança, a construção verbal “confiar em” é mais natural em português e conserva a relação semântica central.
- source_word: בּוֹגֵד
  choice: homem traiçoeiro
  rationale: O particípio masculino singular caracteriza alguém que age com deslealdade ou perfídia. A formulação mantém a forma masculina representativa do hebraico.
- source_word: בְּיוֹם
  choice: no dia da
  rationale: Reproduz de modo natural a expressão temporal hebraica e o tom proverbial.
- source_word: צָרָה
  choice: angústia
  rationale: O substantivo denota aflição, aperto ou adversidade. “Angústia” é corrente, digna e adequada à gravidade do contexto.
theological_decisions:
- issue: Masculino genérico em בּוֹגֵד
  choice: homem traiçoeiro
  alternative: pessoa desleal
  rationale: A tradução conserva o particípio masculino singular do texto hebraico, usado de modo representativo, sem negar a aplicação geral do provérbio.
- issue: Forma elíptica da comparação
  choice: Explicitar “usar” e “apoiar-se”
  alternative: “é dente estragado e pé vacilante”
  rationale: O hebraico justapõe as imagens sem verbos explícitos. Os verbos acrescentados tornam em português a função das imagens compreensível — tentar depender de algo incapaz de sustentar — sem resolver indevidamente a tensão do provérbio.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom é proverbial e digno. A ordem da frase foi ajustada à sintaxe natural do português; os verbos funcionais “usar” e “apoiar-se” explicitam a comparação elíptica, enquanto as notas preservam alternativas lexicais genuínas.
