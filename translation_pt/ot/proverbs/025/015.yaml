  text: בְּ/אֹ֣רֶךְ אַ֭פַּיִם יְפֻתֶּ֣ה קָצִ֑ין וְ/לָשׁ֥וֹן רַ֝כָּ֗ה תִּשְׁבָּר גָּֽרֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/015.yaml
  text: By patience a ruler may be persuaded[b][a], and a gentle tongue breaks a bone.
translation:
  language: pt
  text: Com paciência, um governante pode ser persuadido, e a língua branda quebra um osso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, «a língua branda quebra um osso»: imagem do poder da fala gentil para vencer a dureza ou a resistência.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  choice: Com paciência
  rationale: A expressão hebraica, literalmente relacionada à demora da ira, é um idiomatismo para paciência, domínio próprio ou longanimidade. “Com paciência” é natural e comunica perseverança serena.
- source_word: יְפֻתֶּה
  choice: se persuade
  rationale: A forma passiva de פתה indica que alguém é induzido, convencido ou conquistado. “Se persuade” preserva o valor passivo sem sugerir necessariamente engano.
- source_word: קָצִין
  choice: um governante
  rationale: O termo designa alguém investido de autoridade, como governante, chefe ou oficial. “Governante” mantém a aplicação ampla do provérbio.
- source_word: לָשׁוֹן רַכָּה
  choice: a língua branda
  rationale: Preserva a imagem concreta da língua e expressa fala suave ou gentil. “Branda” também cria o contraste intencional com a dureza do osso.
- source_word: תִּשְׁבָּר גָּרֶם
  choice: quebra um osso
  rationale: 'Mantém a metáfora forte e paradoxal do hebraico: palavras brandas vencem resistência aparentemente rígida.'
