lexical_decisions:
- source_word: טוֹב
  choice: É melhor
  rationale: O adjetivo predicativo introduz uma comparação típica da literatura sapiencial; a formulação é natural e direta em português.
- source_word: שֶׁבֶת
  choice: morar
  rationale: Embora o sentido básico seja “sentar-se”, aqui, ligado a um lugar, indica habitar ou residir.
- source_word: עַל פִּנַּת גָּג
  choice: num canto do terraço
  rationale: Preserva a imagem concreta de um espaço pequeno e exposto sobre o teto plano característico das casas antigas; “terraço” comunica essa realidade com clareza ao leitor moderno.
- source_word: מֵאֵשֶׁת
  choice: do que com uma esposa
  rationale: A preposição מִן marca a comparação depois de טוֹב; em português, a construção idiomática pede “do que com”.
- source_word: מדונים (מִדְיָנִים)
  choice: briguenta
  rationale: O substantivo plural “contendas” funciona de modo atributivo e descreve alguém habitualmente dado a conflitos; “briguenta” é claro e corrente.
- source_word: וּבֵית חָבֶר
  choice: numa casa compartilhada
  rationale: A expressão hebraica é concisa e pode indicar uma casa em comum ou a convivência no mesmo lar. A tradução mantém o sentido prático sem eliminar a ambiguidade, registrada na nota.
