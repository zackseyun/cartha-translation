  text: It is better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: pt
  text: É melhor morar num canto do terraço do que com uma esposa briguenta numa casa compartilhada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma esposa briguenta e uma casa em comum”. A expressão final é concisa em hebraico e pode enfatizar o fato de partilhar o mesmo lar, mais do que o prazer da companhia.'
