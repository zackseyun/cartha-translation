  text: נְשִׂיאִ֣ים וְ֭/רוּחַ וְ/גֶ֣שֶׁם אָ֑יִן אִ֥ישׁ מִ֝תְהַלֵּ֗ל בְּ/מַתַּת שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/014.yaml
  text: Like clouds and wind without rain is a man who boasts of a false gift[a].
translation:
  language: pt
  text: Como nuvens e vento sem chuva, assim é o homem que se gaba de um presente falso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como nuvens e vento, mas sem chuva, assim é o homem que se gaba de um presente que não entrega.”'
    reason: Alternativa interpretativa que explicita a provável ideia contextual de uma dádiva anunciada, mas não concretizada.
lexical_decisions:
- source_word: נְשִׂיאִים
  choice: nuvens
  rationale: No contexto da imagem meteorológica ligada à expectativa de chuva, “nuvens” é o equivalente português mais natural.
- source_word: רוּחַ
  choice: vento
  rationale: A associação com nuvens e chuva determina claramente o sentido meteorológico.
- source_word: גֶשֶׁם
  choice: chuva
  rationale: É o sentido comum e contextual do termo.
- source_word: אָיִן
  choice: sem
  rationale: “Sem chuva” reproduz de modo conciso e idiomático a ausência expressa pelo hebraico.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o masculino singular representativo do texto hebraico e se encaixa na comparação proverbial.
- source_word: מִתְהַלֵּל
  choice: se gaba
  rationale: Expressa a autoexaltação do hitpael de הלל em linguagem atual, clara e digna.
- source_word: בְּמַתַּת
  choice: de um presente
  rationale: A preposição introduz o conteúdo da vanglória; em português, “gabar-se de” é a construção natural.
- source_word: שָׁקֶר
  choice: enganoso
  rationale: Indica que o presente anunciado cria uma expectativa falsa, sem limitar o sentido apenas à falsidade material do objeto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com ampla legibilidade brasileira. A estrutura compacta da comparação hebraica foi preservada; “assim é” torna explícita a relação entre as duas metades sem alterar seu sentido.
