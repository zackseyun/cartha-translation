    rationale: A formulação pode sugerir que o presente em si é enganador. O provérbio contrasta a aparência promissora com a falta de chuva e, analogamente, a ostentação de uma dádiva que é falsa ou não é entregue. «Presente falso» preserva melhor a formulação compacta do hebraico; a nota pode explicitar a leitura contextual.
