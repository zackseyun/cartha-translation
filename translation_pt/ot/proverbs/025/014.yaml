- from: Como nuvens e vento sem chuva, assim é o homem que se gaba de um presente enganoso.[a]
  to: Como nuvens e vento sem chuva, assim é o homem que se gaba de um presente falso.[a]
  rationale: A revisão substitui «enganoso» por «falso», equivalente mais direto de שקר e menos propenso a deslocar o sentido para as qualidades do objeto dado. Mantêm-se a comparação, o masculino genérico, o registro moderno e a nota que apresenta a explicitação contextual sem transformá-la em tradução obrigatória.
