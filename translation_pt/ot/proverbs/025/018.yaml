  yaml_path: translation/ot/proverbs/025/018.yaml
  text: A club[a], a sword, and a sharp arrow is a man who bears false witness against his neighbor.
translation:
  language: pt
  text: Uma clava, uma espada e uma flecha afiada — assim é o homem que dá falso testemunho contra o seu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפִיץ
  choice: clava
  rationale: O substantivo designa uma arma usada para esmagar. “Clava” preserva a imagem concreta e é compreensível em português atual.
- source_word: חֶרֶב
  choice: espada
  rationale: Equivalente comum e direto do termo hebraico.
- source_word: חֵץ שָׁנוּן
  choice: flecha afiada
  rationale: Preserva tanto o substantivo concreto quanto a ideia de uma ponta aguçada.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o masculino singular proverbial do hebraico; aqui representa o indivíduo descrito.
- source_word: עֹנֶה ... עֵד שָׁקֶר
  choice: dá falso testemunho
  rationale: Embora עֹנֶה signifique literalmente “responde”, sua combinação com עֵד שָׁקֶר tem sentido forense; a expressão escolhida é natural e lexicalmente precisa em português.
- source_word: בְרֵעֵהוּ
  choice: contra o seu próximo
  rationale: A preposição assume valor adversativo no contexto judicial, e “próximo” preserva a ressonância ética de רֵעַ.
