  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תֵּצֵ֥א לָ/רִ֗ב מַ֫הֵ֥ר פֶּ֣ן מַה תַּ֭עֲשֶׂה בְּ/אַחֲרִיתָ֑/הּ בְּ/הַכְלִ֖ים אֹתְ/ךָ֣ רֵעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/008.yaml
  text: Do not go out hastily to a dispute[a], lest in the end, when your neighbor puts you to shame[b], you not know what to do.
translation:
  language: pt
  text: Não se apresse em entrar numa disputa,[a] para que, no fim, quando o seu próximo o envergonhar, você não fique sem saber o que fazer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não saia precipitadamente para contender” ou, em sentido mais jurídico, “Não se apresse em ir ao tribunal”.
    reason: alternative_reading
  - marker: b
    text: 'O hebraico é elíptico; literalmente: “para que, no fim dela, quando o seu próximo o envergonhar, o que você fará?”. A tradução explicita o sentido provável: ficar sem saber o que fazer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא לָרִיב
  choice: entrar numa disputa
  rationale: Embora תֵּצֵא signifique literalmente “sair”, a expressão com לָרִיב descreve lançar-se numa contenda. “Entrar numa disputa” é natural em português e mantém a amplitude de רִיב, que pode indicar contenda pessoal ou litígio.
- source_word: מַהֵר
  choice: apressar-se
  rationale: Expressa não apenas rapidez, mas precipitação imprudente, adequada à advertência proverbial.
- source_word: פֶּן
  choice: para que... não
  rationale: Reproduz de modo natural em português a advertência introduzida por פֶּן e seu resultado indesejável.
- source_word: בְּאַחֲרִיתָהּ
  choice: no fim
  rationale: Comunica o desfecho da disputa sem precisar explicitar o referente feminino implícito no hebraico.
- source_word: בְּהַכְלִים אֹתְךָ
  choice: quando... o envergonhar
  rationale: O infinitivo com בְּ indica a circunstância temporal; “envergonhar” preserva a dimensão pública de vergonha ou humilhação.
- source_word: רֵעֶךָ
  choice: seu próximo
  rationale: Mantém o sentido social amplo de רֵעַ, sem pressupor a intimidade de um amigo.
- source_word: מַה תַּעֲשֶׂה
  choice: você não fique sem saber o que fazer
  rationale: Torna explícita a força provável da construção elíptica hebraica, preservando a advertência prática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação evita juridicizar excessivamente רִיב, mas registra em nota tanto a imagem literal de “sair para contender” quanto a possível nuance forense. Os pronomes seguem o uso brasileiro corrente de “você”, enquanto “seu próximo” preserva o registro sapiencial e a amplitude relacional do hebraico.
