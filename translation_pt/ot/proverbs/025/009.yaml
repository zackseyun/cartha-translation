source:
  edition: WLC
  text: רִֽ֭יבְ/ךָ רִ֣יב אֶת רֵעֶ֑/ךָ וְ/ס֖וֹד אַחֵ֣ר אַל תְּגָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/009.yaml
  text: Argue your case with your neighbor himself[b][a], and do not reveal another person's secret.
translation:
  language: pt
  text: Discuta a sua causa com o seu próximo[a] e não revele o segredo de outra pessoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Defenda a sua causa diante do seu próximo” ou “Trate diretamente da sua disputa com o seu próximo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o segredo de outro”; isto é, uma informação confidencial pertencente a outra pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיבְךָ רִיב
  choice: Discuta a sua causa
  rationale: A repetição do substantivo e do verbo derivados de ריב associa a questão em disputa à ação de tratá-la. “Discuta a sua causa” mantém tanto o possível tom jurídico quanto o sentido mais amplo de controvérsia, em português natural.
- source_word: אֶת רֵעֶךָ
  choice: com o seu próximo
  rationale: רֵעַ pode indicar próximo, companheiro ou amigo. “Próximo” preserva essa amplitude, e “com” expressa naturalmente a pessoa com quem se trata a controvérsia.
- source_word: וְסוֹד אַחֵר
  choice: e ... o segredo de outra pessoa
  rationale: סוֹד pode designar segredo, assunto confidencial ou conversa reservada. Aqui, “segredo” comunica com clareza a informação confidencial ligada a אַחֵר, “outra pessoa”.
- source_word: אַל תְּגָל
  choice: não revele
  rationale: A forma proibitiva de גלה ordena que não se descubra ou divulgue algo. “Não revele” é clara, corrente e fiel ao contexto de confidencialidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita restringir ריב a um processo judicial ou a uma briga emocional. “Diretamente” fica na nota porque essa ideia é sugerida pelo contraste do provérbio, mas não está expressa por uma palavra específica no hebraico.
