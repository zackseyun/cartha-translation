  text: ר֣וּחַ צָ֭פוֹן תְּח֣וֹלֵֽל גָּ֑שֶׁם וּ/פָנִ֥ים נִ֝זְעָמִ֗ים לְשׁ֣וֹן סָֽתֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/023.yaml
  text: The north wind brings forth rain[a], and an angry face[b], a slanderous tongue.
translation:
  language: pt
  text: O vento do norte traz chuva[a], e a língua que fala às escondidas[b] provoca um rosto indignado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O vento do norte afasta a chuva, e a língua que fala pelas costas provoca um rosto indignado”. O verbo hebraico admite interpretações diferentes; alguns entendem que o vento do norte dissipa a chuva, em vez de produzi-la.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “uma língua de segredo” ou “uma língua oculta”, isto é, fala secreta ou pelas costas, como difamação ou calúnia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ צָ֭פוֹן
  choice: o vento norte
  rationale: A expressão hebraica designa o vento vindo do norte; esta é a forma natural e tradicional em português.
- source_word: תְּח֣וֹלֵֽל
  choice: traz
  rationale: O verbo pode expressar produção ou causação. “Traz” soa natural em relação à chuva e mantém a relação causal do paralelismo sem especificar em excesso o fenômeno meteorológico.
- source_word: גָּ֑שֶׁם
  choice: a chuva
  rationale: Equivalente corrente e claro para o termo hebraico que designa chuva ou aguaceiro.
- source_word: וּ/פָנִ֥ים נִ֝זְעָמִ֗ים
  choice: um rosto indignado
  rationale: Embora פָנִים tenha forma plural, é frequentemente empregado com sentido singular de rosto ou semblante. “Indignado” comunica a reação de ira ou desagrado.
- source_word: לְשׁ֣וֹן סָֽתֶר
  choice: a língua que fala às escondidas
  rationale: Preserva a imagem concreta de “língua” e explicita com naturalidade o sentido de fala secreta ou pelas costas, sem restringi-lo necessariamente à acusação falsa implicada por “calúnia”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo causal e a imagem hebraica da língua, enquanto as notas registram a ambiguidade do verbo e o sentido literal da expressão final.
