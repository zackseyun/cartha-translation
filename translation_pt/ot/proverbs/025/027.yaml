base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/027.yaml
  text: To eat much honey is not good[a], and to search out their glory is glory.
translation:
  language: pt
  text: Comer mel em excesso não é bom, e investigar a glória deles é glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e investigar a glória deles é glória”. A segunda linha é difícil. Pode significar que buscar honra para si mesmo não é honroso, ou que investigar assuntos de peso é honroso. Aqui, o Texto Massorético é traduzido de perto.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֹל
  choice: Comer
  rationale: O infinitivo funciona como sujeito de uma afirmação proverbial; o infinitivo em português preserva de modo natural essa força geral.
- source_word: דְּבַשׁ
  choice: mel
  rationale: Mantém literalmente a imagem simples e concreta do hebraico.
- source_word: הַרְבּוֹת
  choice: em excesso
  rationale: Expressa a ideia de abundância excessiva com mais clareza em português do que uma tradução meramente quantitativa como “muito”.
- source_word: לֹא טוֹב
  choice: não é bom
  rationale: Conserva a avaliação breve e aberta do hebraico, sem restringi-la a dano físico ou moral.
- source_word: וְחֵקֶר
  choice: e investigar
  rationale: O substantivo “investigação” é vertido verbalmente para formar uma construção proverbial natural e paralela em português.
- source_word: כְּבֹדָם
  choice: a glória deles
  rationale: Preserva o sufixo de terceira pessoa masculina plural do Texto Massorético, sem substituí-lo por “a própria honra” ou outra interpretação conjectural.
- source_word: כָּבוֹד
  choice: é glória
  rationale: Mantém o predicado nominal conciso e a repetição intencional da raiz כבד, apesar da dificuldade da linha.
theological_decisions:
- issue: Sentido da segunda linha
  choice: 'Tradução próxima ao Texto Massorético: “investigar a glória deles é glória”'
  alternative: “buscar a própria honra não é honroso” ou “investigar assuntos de peso é honroso”
  rationale: A formulação hebraica é notoriamente difícil. A tradução não resolve por conjectura a referência do pronome nem altera o segundo “glória” para uma negação ausente do texto recebido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Em excesso” torna natural a primeira linha; a estranheza real da segunda é preservada no texto e explicada em nota.
