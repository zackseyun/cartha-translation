  text: כִּ֤י ט֥וֹב אֲמָר לְ/ךָ֗ עֲֽלֵ֫ה הֵ֥נָּה מֵֽ֭/הַשְׁפִּ֣ילְ/ךָ לִ/פְנֵ֣י נָדִ֑יב אֲשֶׁ֖ר רָא֣וּ עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/007.yaml
  text: For it is better that it be said to you[b][a], “Come up here,” than that you be humbled before a nobleman whom your eyes have seen.
translation:
  language: pt
  text: 'Pois é melhor que lhe digam: “Suba para cá”, do que você ser rebaixado diante de um nobre que os seus olhos viram.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais natural em português, “um nobre que você viu”. A expressão hebraica diz literalmente “que os seus olhos viram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a justificativa da exortação anterior e expressa naturalmente o valor explicativo da conjunção.
- source_word: טוֹב ... מִן
  choice: é melhor ... do que
  rationale: A construção com מִן tem sentido comparativo.
- source_word: אֲמָר לְךָ
  choice: que lhe digam
  rationale: Mantém indefinido quem fala e soa mais natural em português do que uma construção passiva impessoal rígida.
- source_word: עֲלֵה הֵנָּה
  choice: Suba para cá
  rationale: Preserva tanto o movimento ascendente quanto a promoção social sugerida pelo contexto.
- source_word: מֵהַשְׁפִּילְךָ
  choice: do que você ser rebaixado
  rationale: Expressa o sentido causativo de ser posto em posição inferior, incluindo a vergonha social sem reduzi-lo apenas a um sentimento subjetivo de humilhação.
- source_word: לִפְנֵי נָדִיב
  choice: diante de um nobre
  rationale: Representa a situação pública e a posição elevada da pessoa, sem especificar indevidamente que seja príncipe ou governante.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: que os seus olhos viram
  rationale: Conserva a expressão hebraica vívida e sua possível referência a um dignitário específico já visto pelo destinatário.
