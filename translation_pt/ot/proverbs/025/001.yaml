  text: גַּם אֵ֭לֶּה מִשְׁלֵ֣י שְׁלֹמֹ֑ה אֲשֶׁ֥ר הֶ֝עְתִּ֗יקוּ אַנְשֵׁ֤י חִזְקִיָּ֬ה מֶֽלֶךְ יְהוּדָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/001.yaml
  text: These also are proverbs of Solomon[b][a], which the men of Hezekiah king of Judah copied.
translation:
  language: pt
  text: Estes também são provérbios de Salomão que os homens de Ezequias[b], rei de Judá, copiaram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “transcreveram” ou “compilaram”. O verbo hebraico provavelmente se refere a copiar estes provérbios e reuni-los numa coleção.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é “os homens de Ezequias” e provavelmente se refere a membros da corte de Ezequias ou a escribas a serviço do rei.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Estes também
  rationale: Preserva tanto o demonstrativo, que apresenta a seção seguinte, quanto a ideia de acréscimo ou continuação expressa por גַּם.
- source_word: מִשְׁלֵי
  choice: provérbios
  rationale: É a designação corrente e adequada ao gênero de מָשָׁל neste livro.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: הֶעְתִּיקוּ
  choice: copiaram
  rationale: Expressa de maneira clara o provável ato de trasladar por escrito estes provérbios para uma coleção, sem definir em excesso o processo editorial.
- source_word: אַנְשֵׁי חִזְקִיָּה
  choice: os homens de Ezequias
  rationale: Mantém a expressão masculina e a relação direta do hebraico; no contexto, provavelmente designa membros da corte ou escribas ligados ao rei.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reproduz naturalmente a cadeia construta que identifica o cargo real de Ezequias.
theological_decisions:
- issue: Expressão de gênero אַנְשֵׁי חִזְקִיָּה
  choice: os homens de Ezequias
  alternative: os oficiais de Ezequias
  rationale: O texto hebraico emprega um substantivo masculino plural. A tradução preserva essa forma, enquanto a nota esclarece sua provável função cortesã ou escribal sem converter a inferência em texto principal.
- issue: Natureza do trabalho descrito por הֶעְתִּיקוּ
  choice: copiaram
  alternative: transcreveram ou compilaram
  rationale: “Copiaram” conserva o núcleo semântico provável sem decidir se o trabalho envolveu apenas transcrição ou também organização editorial.
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe próxima do hebraico sem soar artificial. Os marcadores aparecem após a oração pertinente: [a] explica “copiaram”, e [b], “os homens de Ezequias”.'
