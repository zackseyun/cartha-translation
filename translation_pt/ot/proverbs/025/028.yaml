  text: עִ֣יר פְּ֭רוּצָה אֵ֣ין חוֹמָ֑ה אִ֝֗ישׁ אֲשֶׁ֤ר אֵ֖ין מַעְצָ֣ר לְ/רוּחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/028.yaml
  text: A man who has no restraint over his spirit is like a city broken into[a], without a wall.
translation:
  language: pt
  text: 'Como uma cidade com brechas, sem muralha,

    assim é o homem que não tem domínio sobre seu espírito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “...sobre seu temperamento” ou “...sobre si mesmo”. O hebraico diz “seu espírito”, expressão que pode se referir à disposição interior ou ao temperamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: cidade
  rationale: Equivalente comum e natural para um centro urbano; preserva com clareza a imagem proverbial.
- source_word: פְּרוּצָה
  choice: arrombada
  rationale: O particípio de פרץ descreve uma cidade cuja defesa foi rompida. “Arrombada” comunica em português atual a ideia de invasão por uma abertura forçada, sem exigir o vocabulário mais técnico “brechada”.
- source_word: אֵין חוֹמָה
  choice: sem muralha
  rationale: Expressa diretamente a ausência da estrutura defensiva da cidade. “Muralha” é mais precisa que “muro” neste contexto urbano antigo.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém a forma masculina singular do hebraico, usada de maneira representativa no provérbio.
- source_word: מַעְצָר
  choice: domina
  rationale: O substantivo denota contenção ou controle; a formulação verbal “não domina” produz português mais natural e rege claramente “o seu espírito”, sem acrescentar explicitamente a ideia reflexiva de “autocontrole”.
- source_word: לְרוּחוֹ
  choice: o seu espírito
  rationale: Preserva o termo hebraico רוּחַ e sua amplitude, que aqui pode indicar a disposição interior, os impulsos ou o temperamento.
theological_decisions:
- issue: Linguagem masculina representativa no dito sapiencial
  choice: o homem
  alternative: a pessoa; quem
  rationale: אִישׁ é masculino singular e funciona proverbialmente como representante geral. A tradução conserva essa forma sem restringir a aplicação moral apenas aos homens.
- issue: Sentido de רוּחַ no domínio interior
  choice: espírito
  alternative: temperamento; a si mesmo
  rationale: “Espírito” mantém a amplitude antropológica do hebraico e sua tensão sem reduzir o sentido somente à ira ou ao temperamento; a nota apresenta as leituras contextuais possíveis.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da comparação foi preservada: primeiro a cidade indefesa, depois a pessoa sem domínio interior. O paralelismo foi disposto em dois versos.'
