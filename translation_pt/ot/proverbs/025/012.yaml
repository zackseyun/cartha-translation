  text: Like a gold ring and an ornament of fine gold is a wise reprover to a listening ear[a].
translation:
  language: pt
  text: Como um anel de ouro e um adorno de ouro fino, assim é quem repreende com sabedoria para um ouvido atento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como um anel de ouro e uma joia de ouro fino, assim é quem repreende com sabedoria para um ouvido que ouve.” Os termos hebraicos para os adornos são relativamente gerais, e a frase final enfatiza uma escuta receptiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶזֶם
  choice: anel
  rationale: O termo designa um ornamento em forma de anel, usado no nariz ou na orelha; como o local exato não é indicado, “anel” evita especificação indevida.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do material que qualifica o anel.
- source_word: וַחֲלִי
  choice: e um adorno
  rationale: חֲלִי é um termo relativamente amplo para adorno ou joia; “adorno” preserva essa generalidade.
- source_word: כָתֶם
  choice: ouro fino
  rationale: Indica ouro refinado ou de alta qualidade; “ouro fino” é natural e mantém o valor elevado da comparação.
- source_word: מוֹכִיחַ חָכָם
  choice: a pessoa sábia que repreende
  rationale: A construção expressa alguém sábio que oferece correção. Esta formulação é natural, inclusiva e preserva o caráter construtivo da repreensão.
- source_word: עַל
  choice: para
  rationale: Expressa aqui a relação ou direção da repreensão para quem a recebe, embora o sentido básico da preposição seja “sobre”.
- source_word: אֹזֶן שֹׁמָעַת
  choice: o ouvido que escuta
  rationale: Mantém de perto a imagem hebraica e sugere não apenas audição física, mas atenção receptiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial preservada. “Pessoa sábia que repreende” evita o substantivo pouco corrente “repreensor” e comunica naturalmente o particípio hebraico; “ouvido que escuta” conserva a metáfora e a ênfase na receptividade.
