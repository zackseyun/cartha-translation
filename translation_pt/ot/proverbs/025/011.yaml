base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/011.yaml
  text: Like apples of gold in settings of silver is a word spoken at the right time[a][b][c].
translation:
  language: pt
  text: Como maçãs[b] de ouro em engastes de prata[c] é uma palavra dita no momento certo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dita de modo apropriado»; literalmente, «dita sobre suas rodas», expressão de sentido difícil que indica, ao que parece, uma palavra adequada à ocasião ou dita no tempo certo.
    reason: lexical_alternative
  - marker: b
    text: A fruta exata designada pelo termo hebraico talvez não corresponda à maçã moderna.
    reason: cultural_note
  - marker: c
    text: Ou «em entalhes de prata» ou «em filigrana de prata».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחֵי
  choice: maçãs
  rationale: Mantém a imagem concreta e a tradução tradicional de תַּפּוּחַ, embora não seja possível identificar com certeza a fruta antiga; essa incerteza é registrada em nota.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do termo hebraico para o metal.
- source_word: בְּמַשְׂכִּיּוֹת
  choice: em engastes
  rationale: Expressa uma obra ornamental de prata na qual as formas de ouro aparecem artisticamente dispostas. Como o sentido exato do substantivo é incerto, outras possibilidades são preservadas em nota.
- source_word: כָּסֶף
  choice: prata
  rationale: Equivalente direto do termo hebraico para o metal.
- source_word: דָּבָר
  choice: a palavra
  rationale: No contexto da fala, דָּבָר designa adequadamente uma palavra ou declaração; o singular conserva a concisão proverbial.
- source_word: דָּבֻר
  choice: dita
  rationale: Traduz de modo natural em português a forma passiva de דבר e concorda com «palavra».
- source_word: עַל אָפְנָיו
  choice: no momento certo
  rationale: Comunica com clareza a adequação circunstancial ou temporal sugerida pela difícil expressão idiomática hebraica, sem apresentar a leitura literal obscura como se fosse inequívoca.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da comparação acompanha o hebraico. «Engastes» preserva a imagem artesanal com mais precisão, enquanto as alternativas e a incerteza lexical ficam explícitas nas notas.
