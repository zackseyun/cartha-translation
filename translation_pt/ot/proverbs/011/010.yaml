base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
translation:
  language: pt
  text: Quando os justos prosperam[a], a cidade se alegra; quando os perversos perecem, há gritos de alegria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando tudo vai bem com os justos”. O hebraico fala literalmente do “bem” ou “bem-estar” dos justos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “há aclamação”. O termo hebraico pode indicar um clamor forte e jubiloso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב
  choice: quando ... prosperam
  rationale: A construção com בְּ e טוּב indica a ocasião ou circunstância do bem-estar dos justos. A formulação temporal é natural em português e comunica sua condição favorável sem reproduzir literalmente a expressão hebraica.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo plural substantivado designa pessoas caracterizadas pela justiça; “os justos” é conciso e preserva a categoria moral de Provérbios.
- source_word: תַּעֲלֹץ
  choice: se alegra
  rationale: O verbo עלץ expressa alegria intensa ou exultação. “Se alegra” é claro, natural e adequado à personificação da cidade.
- source_word: קִרְיָה
  choice: a cidade
  rationale: O substantivo se refere a uma cidade ou povoação. Em português, o artigo definido funciona naturalmente na afirmação proverbial genérica.
- source_word: וּבַאֲבֹד
  choice: quando ... perecem
  rationale: A preposição com o infinitivo construto de אבד introduz uma circunstância paralela à primeira oração. A construção temporal preserva esse paralelismo em português corrente.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo plural substantivado contrasta moralmente com “os justos”. “Perversos” comunica de modo claro pessoas cuja conduta é moralmente má.
- source_word: רִנָּה
  choice: ressoam gritos de alegria
  rationale: רִנָּה denota um clamor forte, frequentemente jubiloso. A expressão transmite tanto o caráter audível quanto a alegria pública sugerida pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura temporal paralela comunica o sentido proverbial do hebraico, enquanto “ressoam gritos de alegria” preserva a força pública e jubilosa do segundo segmento.
