  text: כֵּן צְדָקָ֥ה לְ/חַיִּ֑ים וּ/מְרַדֵּ֖ף רָעָ֣ה לְ/מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/019.yaml
  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
translation:
  language: pt
  text: Assim, a retidão conduz à vida[a], mas quem persegue o mal caminha para a própria morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, a retidão é para a vida” ou “De fato, a retidão conduz à vida”. A primeira oração não tem verbo expresso no hebraico; por isso, é necessário suprir o sentido em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Expressa de modo natural a força inferencial ou enfática do advérbio hebraico no contexto proverbial.
- source_word: צְדָקָה
  choice: a justiça
  rationale: Abrange aqui a retidão moral, em contraste antitético com a busca do mal; em português corrente, “justiça” preserva bem o campo semântico do termo.
- source_word: לְחַיִּים
  choice: conduz à vida
  rationale: A preposição לְ indica direção ou resultado. Como a oração hebraica não tem verbo expresso, “conduz” torna clara essa relação sem eliminar a ambiguidade, registrada na nota.
- source_word: וּמְרַדֵּף
  choice: mas quem persegue
  rationale: O particípio substantivado descreve aquele que habitualmente busca algo, e a conjunção assume valor contrastivo no paralelismo.
- source_word: רָעָה
  choice: o mal
  rationale: O contraste com justiça favorece o sentido ético de mal, em vez de dano ou calamidade.
- source_word: לְמוֹתוֹ
  choice: caminha para a própria morte
  rationale: A expressão indica destino ou resultado e contém o sufixo possessivo masculino singular. “Própria” explicita naturalmente que a morte recai sobre quem persegue o mal; “caminha” é suprido para formar uma oração portuguesa fluente.
theological_decisions:
- issue: Sentido de צְדָקָה no contexto sapiencial
  choice: justiça como retidão moral que conduz à vida
  alternative: justiça entendida mais especificamente como equidade social
  rationale: O paralelismo antitético contrapõe uma orientação moral justa à perseguição do mal. A tradução mantém o sentido ético amplo sem restringi-lo a uma categoria doutrinária ou apenas social.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo proverbial e sinaliza em nota a ambiguidade da oração nominal hebraica.
