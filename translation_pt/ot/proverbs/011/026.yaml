source:
  edition: WLC
  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
translation:
  language: pt
  text: Quem retém o cereal, o povo o amaldiçoa[a]; mas a bênção está sobre a cabeça de quem o vende[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a população» ou «a nação o amaldiçoa»; o hebraico לְאֹם pode designar um povo ou o público coletivamente.
    reason: lexical_alternative
  - marker: b
    text: Ou «quem o fornece»; o particípio hebraico pode destacar a ação de suprir cereal, embora neste contexto normalmente se refira a vendê-lo ou colocá-lo à disposição, em contraste com retê-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹנֵעַ
  choice: quem retém
  rationale: O particípio substantivado descreve, de modo geral, a pessoa que segura o produto e não o disponibiliza; «retém» conserva a ideia sem acrescentar um motivo específico.
- source_word: בָּר
  choice: o cereal
  rationale: Aqui o termo designa genericamente grãos destinados à alimentação, sem se limitar ao trigo; «cereal» evita a possível leitura brasileira de «grão» como uma espécie específica.
- source_word: יִקְּבֻהוּ
  choice: o amaldiçoa
  rationale: O verbo נקב tem aqui o sentido direto de proferir maldição contra alguém. A colocação pronominal é natural em português e preserva o referente masculino singular.
- source_word: לְאֹם
  choice: o povo
  rationale: O substantivo pode indicar povo, nação ou a coletividade. Neste contexto social, «o povo» expressa naturalmente o público afetado pela retenção do cereal.
- source_word: וּבְרָכָה
  choice: mas a bênção
  rationale: Embora ו seja literalmente «e», o paralelismo antitético torna «mas» a ligação mais natural em português, sem mudar a relação entre as duas linhas.
- source_word: לְרֹאשׁ
  choice: está sobre a cabeça de
  rationale: Mantém a imagem concreta hebraica da bênção sobre a cabeça da pessoa, em vez de reduzi-la a uma formulação abstrata.
- source_word: מַשְׁבִּיר
  choice: quem o vende
  rationale: O particípio hifil de שׁבר, neste contexto comercial, refere-se a disponibilizar cereal para compra. «Vende» exprime o sentido contextual sem transformá-lo em distribuição necessariamente gratuita.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção proverbial concisa. A ordem das notas segue os respectivos marcadores no texto. Conservou-se a metáfora hebraica da bênção sobre a cabeça e explicitou-se a oposição por meio de «mas».
