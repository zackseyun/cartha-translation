base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
translation:
  language: pt
  text: Quem busca o bem com empenho[a] procura o favor[b], mas o mal virá sobre quem o busca.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “busca cedo o bem”; o verbo hebraico pode indicar uma busca empenhada ou iniciada cedo.
    reason: lexical_alternative
  - marker: b
    text: “Favor” pode referir-se amplamente à aceitação ou boa vontade de Deus, das pessoas ou de ambos.
    reason: lexical_alternative
  - marker: c
    text: Ou “mas o mal lhe virá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחֵר
  choice: busca com empenho
  rationale: O particípio expressa uma busca diligente, intensa ou até iniciada cedo. “Busca com empenho” comunica essa intensidade em português natural sem restringir o sentido à ideia temporal.
- source_word: טוֹב
  choice: o bem
  rationale: O adjetivo tem função substantiva e abrange aquilo que é bom, tanto no sentido moral quanto no prático.
- source_word: יְבַקֵּשׁ
  choice: procura
  rationale: O verbo comum de buscar foi traduzido por “procura”, evitando uma repetição pouco elegante sem perder o paralelismo semântico.
- source_word: רָצוֹן
  choice: o favor
  rationale: “Favor” preserva a ideia ampla de aceitação ou boa vontade, sem determinar se ela vem de Deus, das pessoas ou de ambos.
- source_word: וְדֹרֵשׁ
  choice: mas ... quem o busca
  rationale: Embora a conjunção seja formalmente “e”, o paralelismo é antitético, justificando “mas”. O verbo indica buscar ou procurar com intenção.
- source_word: רָעָה
  choice: o mal
  rationale: A expressão pode abranger tanto o mal moral quanto dano ou desgraça. “O mal” mantém deliberadamente essa amplitude.
- source_word: תְבוֹאֶנּוּ
  choice: virá sobre quem o busca
  rationale: A forma verbal indica que o mal virá ou chegará ao buscador. O futuro exprime com clareza a consequência certa, e “sobre” conserva a possível nuance de algo que sobrevém à pessoa.
theological_decisions:
- issue: Origem do favor em רָצוֹן
  choice: Manter “favor” sem identificar sua origem.
  alternative: Especificar “favor de Deus” ou “favor das pessoas”.
  rationale: O texto hebraico não nomeia quem concede o favor; a formulação ampla preserva essa ambiguidade legítima.
- issue: Amplitude de רָעָה
  choice: Traduzir por “o mal”, permitindo sentido moral e consequencial.
  alternative: Restringir a “desgraça”, “dano” ou “calamidade”.
  rationale: A antítese com “o bem” favorece “o mal”, enquanto a afirmação de que ele virá sobre o buscador também admite a ideia de consequência danosa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura antitética e a concisão proverbial foram preservadas; as ambiguidades de “favor” e “mal” não foram resolvidas além do hebraico.
