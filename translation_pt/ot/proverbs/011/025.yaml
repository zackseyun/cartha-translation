  source_fidelity: 'O texto principal preserva bem o sentido proverbial: a pessoa caracterizada por generosidade recebe fartura, e quem proporciona refrigério a outros também o recebe. Contudo, «revigora» acrescenta mais especificamente a ideia de restaurar forças, enquanto o hebraico mantém a imagem mais ampla de dar de beber/regar e de refrigério. A nota a chama de «literal» uma formulação que já substitui «alma» por «pessoa».'
  naturalness: «A pessoa generosa terá abundância» é natural, clara e adequada ao registro. «Quem refresca os outros também será refrescado» conserva o paralelismo e a reciprocidade de modo mais direto e idiomático do que «revigora ... será revigorado».
  terminology: «Pessoa generosa» traduz adequadamente נֶפֶשׁ בְּרָכָה no contexto. «Abundância» comunica a imagem de fartura de תְדֻשָּׁן sem impor uma leitura exclusivamente material. Nas notas, «alma» deve ser mantido quando se alega literalidade, e a imagem de regar deve ser explicitada sem tratar a tradução idiomática como se fosse a única possibilidade.
