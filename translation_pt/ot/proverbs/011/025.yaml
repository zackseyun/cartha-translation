  text: נֶֽפֶשׁ בְּרָכָ֥ה תְדֻשָּׁ֑ן וּ֝/מַרְוֶ֗ה גַּם ה֥וּא יוֹרֶֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/025.yaml
  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
translation:
  language: pt
  text: A pessoa generosa terá abundância[a], e quem refresca os outros também será refrescado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma alma de bênção será tornada gorda”. O hebraico usa a imagem de fartura e florescimento.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “quem dá de beber também será regado”. O hebraico emprega a imagem de dar de beber ou regar e, em seguida, receber o mesmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: pessoa
  rationale: Embora נֶפֶשׁ possa significar literalmente “alma”, aqui designa a pessoa inteira. “Pessoa” comunica o sentido idiomático sem sugerir uma distinção indevida entre alma e corpo.
- source_word: בְּרָכָה
  choice: generosa
  rationale: O substantivo significa “bênção”, mas na expressão נֶפֶשׁ בְּרָכָה caracteriza alguém que beneficia ou abençoa os outros. “Generosa” expressa com naturalidade o sentido ético no contexto.
- source_word: תְדֻשָּׁן
  choice: terá abundância
  rationale: A forma Pual de דשׁן emprega a imagem de ser engordado, isto é, desfrutar fartura e florescimento. “Terá abundância” preserva essa ideia sem a conotação física pouco adequada de “engordará”.
- source_word: וּמַרְוֶה
  choice: quem revigora os outros
  rationale: O particípio Hifil de רוה descreve literalmente quem dá de beber ou rega. No paralelismo, a imagem aponta para quem proporciona refrigério e benefício; “revigora os outros” transmite esse sentido figurado em português corrente.
- source_word: גַּם הוּא יוֹרֶא
  choice: também será revigorado
  rationale: 'A expressão enfatiza a reciprocidade: aquele que proporciona refrigério também o receberá. A formulação portuguesa conserva tanto a correspondência verbal quanto a ênfase de גַּם הוּא.'
theological_decisions:
- issue: Natureza da recompensa prometida
  choice: Manter a promessa em termos amplos de abundância e renovação
  alternative: Restringi-la explicitamente à prosperidade material ou, no sentido oposto, apenas ao benefício espiritual
  rationale: O provérbio afirma uma correspondência entre a generosidade e o bem recebido, mas não especifica que a recompensa seja exclusivamente material nem exclusivamente espiritual. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. O paralelismo e a reciprocidade do hebraico foram preservados, enquanto as imagens literais de gordura e rega são explicadas em notas para evitar estranheza ou interpretação indevida no texto principal.
