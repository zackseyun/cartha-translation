base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/005.yaml
  text: The righteousness of the blameless makes his way straight[b][a], but the wicked falls by his wickedness.
translation:
  language: pt
  text: A retidão do íntegro torna reto o seu caminho[a], mas o perverso cai por sua perversidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “endireita o seu caminho” ou “aplana o seu caminho”. O verbo hebraico evoca a imagem de tornar reto ou plano um caminho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cai em sua perversidade”. A expressão hebraica pode indicar tanto o meio pelo qual o perverso cai quanto a esfera em que ocorre sua queda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: justiça
  rationale: O substantivo em estado construto indica aqui conduta moralmente correta. “Justiça” mantém a ligação lexical com o campo de צדק e é natural no contexto sapiencial.
- source_word: תָּמִים
  choice: íntegro
  rationale: Descreve inteireza e integridade moral, não perfeição absoluta. “Íntegro” comunica esse sentido com clareza em português atual.
- source_word: תְּיַשֵּׁר
  choice: torna reto
  rationale: O piel de ישר apresenta a imagem de endireitar ou aplanar um caminho. “Torna reto” preserva tanto o valor causativo quanto a metáfora.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: “Caminho” é a metáfora sapiencial habitual para a conduta ou o curso da vida e combina naturalmente com “torna reto”.
- source_word: וּבְרִשְׁעָתוֹ
  choice: por sua própria perversidade
  rationale: A preposição ב pode indicar meio ou esfera. No texto principal, “por” expressa a perversidade como causa ou meio da queda; “própria” torna explícita em português a referência pronominal ao perverso sem acrescentar uma nova causa.
- source_word: יִפֹּל
  choice: cai
  rationale: O imperfeito tem força gnômica no provérbio. O presente expressa naturalmente uma verdade geral em português.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado singular designa a pessoa perversa como tipo moral. “O perverso” preserva a concisão e o contraste do hebraico.
theological_decisions:
- issue: Gênero antropológico nas formas masculinas singulares
  choice: Manter o singular masculino em “o seu caminho” e “o perverso”
  alternative: Empregar formas plurais ou explicitamente inclusivas
  rationale: O hebraico formula a máxima com formas masculinas singulares de valor representativo. A tradução conserva essa forma sem restringir a aplicação moral do provérbio.
- issue: Relação entre a perversidade e a queda
  choice: 'Traduzir ב de modo instrumental ou causal: “por sua própria perversidade”'
  alternative: 'Traduzir de modo locativo: “em sua perversidade”'
  rationale: O contexto favorece a ideia de que a própria maldade do perverso ocasiona sua queda, mas a possível leitura locativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A formulação preserva o paralelismo conciso, a metáfora do caminho e o contraste moral do provérbio.
