  text: בָּֽא זָ֭דוֹן וַ/יָּבֹ֣א קָל֑וֹן וְֽ/אֶת צְנוּעִ֥ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/002.yaml
  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
translation:
  language: pt
  text: Quando chega a arrogância, chega também a desonra[a], mas com os humildes está a sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando vem o orgulho, vem então a vergonha.”'
    reason: Alternativas lexicais legítimas para זָדוֹן e קָלוֹן, além de uma forma igualmente possível de expressar o encadeamento verbal.
lexical_decisions:
- source_word: בָּא
  choice: chega
  rationale: O perfeito qal de בוא tem sentido genérico e proverbial; o presente em português expressa naturalmente uma verdade recorrente.
- source_word: זָדוֹן
  choice: arrogância
  rationale: O substantivo indica orgulho presunçoso e moralmente censurável. “Arrogância” é claro e evita os possíveis sentidos positivos de “orgulho” no uso atual.
- source_word: וַיָּבֹא
  choice: chega também
  rationale: A forma verbal encadeia o resultado à primeira oração. “Também” preserva a associação proverbial entre arrogância e desonra.
- source_word: קָלוֹן
  choice: desonra
  rationale: O termo abrange vergonha pública, desonra e desprestígio. “Desonra” mantém o contraste social e moral de modo digno e corrente.
- source_word: וְאֶת
  choice: mas com
  rationale: Neste contexto, אֶת exprime associação. O valor contrastivo do paralelismo é explicitado naturalmente por “mas”, enquanto “com” preserva a construção associativa.
- source_word: צְנוּעִים
  choice: os humildes
  rationale: O adjetivo descreve pessoas modestas, discretas ou despretensiosas. “Os humildes” apresenta com clareza o contraste ético com a arrogância.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: 'É o equivalente comum do substantivo e preserva a concisão da oração nominal hebraica: “com os humildes está a sabedoria”.'
