source:
  edition: WLC
  text: יָ֣ד לְ֭/יָד לֹא יִנָּ֣קֶה רָּ֑ע וְ/זֶ֖רַע צַדִּיקִ֣ים נִמְלָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/021.yaml
  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
translation:
  language: pt
  text: Mão a mão[a], o mau não ficará impune, mas a descendência dos justos escapará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Mão a mão”, expressão idiomática de sentido debatido, provavelmente usada para reforçar a certeza: “certamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד לְיָד
  choice: Mão com mão
  rationale: Preserva a imagem concisa e um tanto obscura do hebraico, sem reduzir a expressão a uma única interpretação. A nota apresenta o provável valor enfático.
- source_word: יִנָּקֶה
  choice: não ficará impune
  rationale: O nifal de נקה indica ficar livre de culpa ou castigo. Neste provérbio, a formulação portuguesa expressa com naturalidade a certeza da consequência moral.
- source_word: רָע
  choice: o mau
  rationale: O adjetivo masculino singular é usado como substantivo para designar uma pessoa má. “O mau” conserva esse caráter pessoal e singular sem acrescentar “homem” ao texto.
- source_word: וְזֶרַע
  choice: mas a descendência
  rationale: זֶרַע refere-se aqui aos descendentes, não a semente literal. A conjunção foi vertida como adversativa porque contrapõe o destino do mau ao dos descendentes dos justos.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O plural substantivado designa pessoas justas; “dos justos” é conciso, natural e compatível com o estilo proverbial.
- source_word: נִמְלָט
  choice: escapará
  rationale: O verbo pode indicar escapar ou ser livrado. “Escapará” mantém em aberto se o livramento é do castigo, da calamidade ou do destino do mau, e o singular concorda com o coletivo “descendência”.
theological_decisions:
- issue: Caráter pessoal do substantivo רָע
  choice: o mau
  alternative: a pessoa má; o perverso; o mal
  rationale: O hebraico apresenta um masculino singular substantivado, representativo de uma pessoa má. A tradução evita transformar a referência pessoal no conceito abstrato de “o mal” e também evita acrescentar “homem”.
- issue: Sentido da expressão יָד לְיָד
  choice: preservar a imagem no texto principal
  alternative: certamente; pode ter certeza; ainda que deem as mãos
  rationale: A expressão é obscura e admite mais de uma explicação. Manter a formulação imagética, acompanhada de nota, preserva a ambiguidade real sem impor a ideia específica de solidariedade entre os maus.
translation_notes:
  register: Português moderno, conciso e digno, com cadência proverbial. “Mão com mão” é deliberadamente incomum para conservar a imagem hebraica; a nota impede que sua opacidade prejudique a compreensão.
