id: PRO.11.9
reference: Proverbs 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/פֶ֗ה חָ֭נֵף יַשְׁחִ֣ת רֵעֵ֑/הוּ וּ֝/בְ/דַ֗עַת צַדִּיקִ֥ים יֵחָלֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
translation:
  language: pt
  text: Com a boca, o ímpio arruína o seu próximo[a], mas pelo conhecimento os justos são livrados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o hipócrita destrói o seu próximo com a boca”. A palavra hebraica pode designar uma pessoa hipócrita, profana ou ímpia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os justos escapam pelo conhecimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶה
  choice: Com a boca
  rationale: A preposição בְּ tem valor instrumental. “Com a boca” é natural em português e preserva a imagem concreta da fala como meio de causar dano.
- source_word: חָנֵף
  choice: o ímpio
  rationale: O termo pode designar alguém ímpio, profano ou hipócrita. “Ímpio” preserva o sentido moral e religioso amplo e estabelece contraste natural com “os justos”, sem restringir a ideia à hipocrisia.
- source_word: יַשְׁחִת
  choice: arruína
  rationale: O hifil de שׁחת expressa causar ruína ou destruição. “Arruína” comunica a força do verbo sem sugerir necessariamente destruição física.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode significar próximo, companheiro ou amigo. “Próximo” mantém a amplitude social do termo e é adequado ao contexto ético de Provérbios.
- source_word: וּבְדַעַת
  choice: mas pelo conhecimento
  rationale: O וְ marca o contraste entre os dois membros, enquanto בְּ indica meio. “Conhecimento” preserva um termo central do vocabulário sapiencial de Provérbios.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo masculino plural é usado substantivamente e designa uma classe ética. “Os justos” é uma formulação concisa e tradicional, ainda corrente em português.
- source_word: יֵחָלֵצוּ
  choice: são livrados
  rationale: O nifal de חלץ comunica livramento ou escape. A forma passiva “são livrados” acompanha a voz hebraica e não explicita quem efetua o livramento.
theological_decisions:
- issue: Sentido de חָנֵף no contexto sapiencial
  choice: o ímpio
  alternative: o hipócrita
  rationale: Embora o vocábulo possa incluir hipocrisia, o contraste com “os justos” aponta para uma categoria moral e religiosa mais ampla. “Ímpio” preserva essa amplitude.
- issue: Relação sintática no segundo membro
  choice: os justos são livrados pelo conhecimento
  alternative: outros são livrados pelo conhecimento dos justos
  rationale: A sintaxe hebraica toma mais naturalmente צַדִּיקִים como sujeito plural de יֵחָלֵצוּ. A tradução mantém essa leitura sem identificar expressamente o perigo do qual são livrados.
- issue: Agente do livramento
  choice: não explicitado
  alternative: Deus livra os justos
  rationale: A forma passiva hebraica não nomeia o agente. A tradução evita inserir uma identificação teológica que, embora possível, não é declarada no verso.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo antitético, a imagem concreta da boca, o termo sapiencial “conhecimento” e a passividade do livramento. Os marcadores seguem a ordem em que aparecem no texto.
