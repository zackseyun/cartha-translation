source:
  edition: WLC
  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
translation:
  language: pt
  text: Quando morre o homem perverso, sua esperança perece, e a expectativa depositada na força[a] se desfaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a expectativa dos fortes perece”. O hebraico é difícil; também pode aludir aos recursos ou às riquezas que dão poder.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: Quando morre
  rationale: A preposição בְּ com o infinitivo construto de מות forma uma oração temporal; esta é a expressão mais natural em português.
- source_word: אָדָם רָשָׁע
  choice: o homem perverso
  rationale: אָדָם designa aqui um indivíduo representativo, e רָשָׁע é o termo sapiencial usual para quem age de modo moralmente perverso.
- source_word: תֹּאבַד תִּקְוָה
  choice: sua esperança perece
  rationale: תִּקְוָה significa 'esperança', e אבד comunica sua perda ou desaparecimento definitivo.
- source_word: וְתוֹחֶלֶת
  choice: e a expectativa
  rationale: Preserva a distinção lexical e o paralelismo com 'esperança', sem repetir exatamente o mesmo substantivo.
- source_word: אוֹנִים
  choice: depositada na força
  rationale: O termo difícil relaciona-se mais naturalmente com força, vigor ou poder. A formulação explicita a relação idiomática entre expectativa e força sem decidir se esta é física, social ou material.
- source_word: אָבָדָה
  choice: se desfaz
  rationale: Mantém o campo semântico de אבד, mas evita repetição rígida de 'perece' e produz um provérbio natural em português.
theological_decisions:
- issue: Referência individual de אָדָם
  choice: homem
  alternative: pessoa
  rationale: O provérbio apresenta um indivíduo masculino representativo; 'homem' conserva essa forma sem transformar a referência em humanidade coletiva.
- issue: Sentido de אוֹנִים
  choice: força
  alternative: os fortes; riquezas
  rationale: O hebraico é difícil e pode indicar força/poder, talvez os fortes, enquanto a leitura 'riquezas' interpreta os recursos que conferem poder. O texto principal preserva o sentido lexical mais direto e a nota registra as alternativas reais.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. O paralelismo poético foi preservado, com leve variação verbal para evitar rigidez.
