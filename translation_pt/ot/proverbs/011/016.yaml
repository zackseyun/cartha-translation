  text: A gracious woman obtains honor[a], and ruthless men obtain wealth.
translation:
  language: pt
  text: 'Uma mulher graciosa obtém honra,[a]

    mas os homens cruéis obtêm riqueza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma mulher graciosa mantém firmemente a honra, mas os homens cruéis mantêm firmemente a riqueza”. Nos dois segmentos, o verbo hebraico significa literalmente “segurar” ou “sustentar”, mas aqui provavelmente tem o sentido de assegurar ou obter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חֵן
  choice: a mulher cheia de graça
  rationale: A construção significa literalmente “mulher de graça/favor”. A formulação escolhida é natural em português, preserva a qualidade positiva e evita reduzir חֵן a mero charme exterior.
- source_word: תִּתְמֹךְ
  choice: alcança
  rationale: תמך significa basicamente “segurar, sustentar, apegar-se”. Neste paralelismo, pode indicar tomar posse ou assegurar algo; “alcança” comunica esse resultado de modo idiomático, sem ocultar a alternativa literal registrada na nota.
- source_word: כָּבוֹד
  choice: honra
  rationale: No contexto sapiencial, כָּבוֹד designa aqui honra ou estima social, em contraste com a riqueza material.
- source_word: עָרִיצִים
  choice: homens cruéis
  rationale: O termo descreve pessoas violentas, implacáveis ou opressoras. “Homens cruéis” é claro e amplo, sem restringir o sentido a tiranos políticos.
- source_word: יִתְמְכוּ
  choice: alcançam
  rationale: É o mesmo verbo empregado no primeiro segmento. A repetição de “alcança/alcançam” preserva o paralelismo lexical e expressa a ideia contextual de assegurar ou obter.
- source_word: עֹשֶׁר
  choice: riqueza
  rationale: Equivalente português corrente para abundância de bens materiais e contraponto natural a “honra”.
