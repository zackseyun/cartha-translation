id: PRO.11.23
reference: Proverbs 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תַּאֲוַ֣ת צַדִּיקִ֣ים אַךְ ט֑וֹב תִּקְוַ֖ת רְשָׁעִ֣ים עֶבְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
translation:
  language: pt
  text: O desejo dos justos é somente o bem, mas a esperança[a] dos ímpios é a ira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “expectativa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “furor”. O hebraico não diz explicitamente de quem é a ira; pode referir-se à expectativa irada dos ímpios ou à ira que vem sobre eles.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  choice: desejo
  rationale: O substantivo expressa desejo ou anseio. “Desejo” é natural, conciso e mantém o paralelo com “esperança”.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Adjetivo plural substantivado; “os justos” preserva de modo idiomático a categoria moral do hebraico.
- source_word: אַךְ
  choice: somente
  rationale: A partícula tem valor restritivo no contexto, indicando que o desejo dos justos se dirige exclusivamente ao bem ou tem somente o bem como resultado.
- source_word: טוֹב
  choice: o bem
  rationale: A forma concisa “o bem” é natural em português e preserva a amplitude do hebraico, que pode indicar aquilo que é bom ou um bom resultado.
- source_word: תִּקְוַת
  choice: esperança
  rationale: O termo pode significar esperança ou expectativa. “Esperança” é a equivalência mais corrente e mantém o contraste ético do provérbio.
- source_word: רְשָׁעִים
  choice: os ímpios
  rationale: Adjetivo plural substantivado; “os ímpios” é uma formulação corrente e forma paralelo direto com “os justos”.
- source_word: עֶבְרָה
  choice: ira
  rationale: O substantivo denota ira, furor ou cólera intensa. “Ira” conserva a concisão e o peso moral do original sem identificar indevidamente quem a manifesta.
theological_decisions:
- issue: Sentido da oração final
  choice: “a esperança dos ímpios é a ira”, sem identificar o agente da ira
  alternative: A esperança dos ímpios é seu próprio furor; ou a esperança deles termina na ira que sobrevém contra eles, possivelmente a ira divina.
  rationale: O hebraico não explicita de quem é a ira nem acrescenta um verbo como “termina”. A formulação nominal e concisa preserva a ambiguidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura breve e antitética do provérbio foi mantida; evitou-se explicitar um agente para “ira” ou resolver a relação semântica entre esperança e ira.
