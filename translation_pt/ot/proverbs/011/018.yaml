base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
translation:
  language: pt
  text: O perverso obtém ganho enganoso[a], mas quem semeia retidão recebe recompensa verdadeira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pratica uma obra de falsidade”; a expressão hebraica pode salientar tanto o ganho enganoso quanto um trabalho cujo resultado se mostra vão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “recompensa segura” ou “pagamento confiável”; literalmente, “salário/recompensa de verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: o perverso
  rationale: O substantivo masculino singular tem sentido genérico e proverbial. “O perverso” é natural em português e preserva a caracterização moral sem tornar o gênero mais explícito do que o necessário.
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  choice: recebe pagamento enganoso
  rationale: A expressão combina “fazer/produzir” com “obra, salário ou resultado de falsidade”. No paralelismo com שֶׂכֶר, a formulação destaca o retorno ilusório da conduta perversa, sem ocultar a leitura mais literal registrada em nota.
- source_word: שָׁקֶר
  choice: enganoso
  rationale: O termo pode indicar falsidade, engano ou algo que se revela vão e não confiável. “Enganoso” preserva a ironia de um ganho aparente que não corresponde ao que promete.
- source_word: וְזֹרֵעַ
  choice: mas quem semeia
  rationale: Embora וְ possa ser simplesmente “e”, o paralelismo antitético favorece “mas”. “Quem semeia” conserva a metáfora agrícola e o sujeito proverbial singular.
- source_word: צְדָקָה
  choice: justiça
  rationale: Em Provérbios, צְדָקָה frequentemente designa conduta reta e justa. “Justiça” é corrente e abrangente em português, mantendo a dimensão ética; “retidão” também seria possível.
- source_word: שֶׂכֶר אֱמֶת
  choice: recompensa segura
  rationale: Literalmente, “recompensa/salário de verdade”. “Segura” comunica que a recompensa é genuína e confiável, em contraste com o pagamento enganoso, enquanto a forma literal fica preservada em nota.
theological_decisions:
- issue: Sentido de צְדָקָה
  choice: justiça
  alternative: retidão
  rationale: O contexto contrasta duas formas de agir e seus resultados. “Justiça” preserva o alcance moral e social do hebraico sem restringi-lo a uma formulação doutrinária; “retidão” é uma alternativa legítima.
- issue: Natureza da recompensa em שֶׂכֶר אֱמֶת
  choice: recompensa segura
  alternative: recompensa verdadeira
  rationale: O genitivo hebraico permite entender a recompensa como genuína, firme ou confiável. “Segura” realça sua confiabilidade sem transformar o provérbio numa garantia mecanicista ou especificar quando ela será recebida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo foi mantido, assim como a metáfora de semear. As notas preservam a ambiguidade lexical das duas expressões relacionadas a trabalho, pagamento e recompensa.
