  text: פְּֽרִי צַ֭דִּיק עֵ֣ץ חַיִּ֑ים וְ/לֹקֵ֖חַ נְפָשׂ֣וֹת חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/030.yaml
  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
translation:
  language: pt
  text: O fruto do justo é árvore de vida, e sábio é quem conquista pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “quem toma pessoas/vidas é sábio”. O hebraico usa “tomar” com “pessoas/vidas”; a expressão pode indicar ganhar pessoas ou exercer influência sobre elas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי
  choice: fruto
  rationale: Preserva a metáfora hebraica e permite o sentido figurado de resultado ou efeito da vida do justo.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado singular representa genericamente a pessoa justa, sem acrescentar especificação ausente do hebraico.
- source_word: עֵץ חַיִּים
  choice: árvore de vida
  rationale: Mantém a expressão sapiencial e sua ressonância com outras ocorrências em Provérbios e Gênesis.
- source_word: וְלֹקֵחַ
  choice: conquista
  rationale: O particípio de לקח significa literalmente tomar; nesta combinação, “conquistar pessoas” comunica de modo natural a ideia possível de ganhá-las ou exercer influência sobre elas, sem definir o tipo de influência.
- source_word: נְפָשׂוֹת
  choice: pessoas
  rationale: נפשׁ pode significar pessoa, vida ou ser; “pessoas” evita sugerir exclusivamente a alma imaterial e funciona naturalmente com “conquista”.
- source_word: חָכָם
  choice: sábio é
  rationale: Reproduz o adjetivo predicativo e conserva a ênfase da ordem hebraica na qualificação de quem age assim.
theological_decisions:
- issue: Sentido de “tomar pessoas/vidas” no contexto sapiencial
  choice: “conquista pessoas”, no sentido amplo de ganhá-las ou exercer influência sobre elas
  alternative: “toma vidas” ou “ganha almas”
  rationale: O hebraico é ambíguo e não especifica conversão evangelística. A redação principal oferece um sentido idiomático plausível, enquanto a nota preserva as possibilidades mais literais e a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo conciso do provérbio; a nota registra a ambiguidade real de לקח com נפשות e evita restringi-la a uma leitura evangelística posterior.
