  yaml_path: translation/ot/proverbs/011/017.yaml
  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
translation:
  language: pt
  text: O homem bondoso faz bem a si mesmo, mas o cruel prejudica a própria carne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao próprio corpo”; alternativamente, “aos seus parentes consanguíneos”, se שְׁאֵרוֹ for entendido no sentido de parentes, e não de carne ou corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֵל
  choice: faz bem
  rationale: O particípio de גמל indica aqui fazer o bem ou trazer benefício; “faz bem” é natural em português e mantém o contraste com o dano causado no segundo membro.
- source_word: נַפְשׁוֹ
  choice: a si mesmo
  rationale: נפש pode significar alma, vida ou a própria pessoa. Neste provérbio, o sentido reflexivo é o mais provável, sem impor uma distinção antropológica entre alma e corpo.
- source_word: אִישׁ חָסֶד
  choice: o homem bondoso
  rationale: A expressão descreve um homem caracterizado por חֶסֶד. “Bondoso” comunica benevolência e consideração leal em português corrente, sem atribuir ao termo um sentido técnico exclusivamente pactual.
- source_word: עֹכֵר
  choice: causa sofrimento
  rationale: עכר expressa causar perturbação, desgraça ou dano. “Causa sofrimento” preserva o sentido causativo e produz um contraste claro com “faz bem”.
- source_word: שְׁאֵרוֹ
  choice: à própria carne
  rationale: שְׁאֵר pode designar carne, corpo ou parentes consanguíneos. “A própria carne” preserva a imagem hebraica e, no paralelismo com נַפְשׁוֹ, provavelmente se refere à própria pessoa ou ao próprio corpo.
- source_word: אַכְזָרִי
  choice: o cruel
  rationale: O adjetivo é substantivado no hebraico. “O cruel” reproduz essa forma de modo conciso e proverbial.
