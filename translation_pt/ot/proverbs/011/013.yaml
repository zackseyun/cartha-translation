  text: הוֹלֵ֣ךְ רָ֭כִיל מְגַלֶּה סּ֑וֹד וְ/נֶאֱמַן ר֝֗וּחַ מְכַסֶּ֥ה דָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/013.yaml
  text: A gossip reveals a secret[b][a], but one who is faithful in spirit conceals a matter.
translation:
  language: pt
  text: 'Quem vive espalhando fofocas revela um segredo,

    mas quem é de espírito fiel mantém um assunto em segredo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cobre um assunto”. Ou: “encobre uma questão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  choice: Quem vive espalhando fofocas
  rationale: A expressão idiomática descreve quem anda levando relatos de pessoa em pessoa. A formulação comunica o caráter habitual da conduta sem restringir o sentido à calúnia, que exigiria necessariamente falsidade.
- source_word: מְגַלֶּה סּוֹד
  choice: revela segredos
  rationale: מְגַלֶּה indica tornar conhecido, e סוֹד, neste paralelismo, designa informação reservada ou confidencial. O plural genérico soa natural em português e preserva a máxima proverbial.
- source_word: נֶאֱמַן רוּחַ
  choice: quem é fiel de espírito
  rationale: Preserva a referência explícita a רוּחַ e a caracterização de confiabilidade interior, embora a expressão também possa ser vertida de modo mais idiomático como 'uma pessoa digna de confiança'.
- source_word: מְכַסֶּה דָבָר
  choice: guarda o que lhe foi confiado
  rationale: O sentido contextual é manter uma informação encoberta. Esta redação torna clara em português a discrição contrastada com a revelação de segredos, sem sugerir que se trate de ocultar qualquer fato indiscriminadamente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial. 'Fofocas' é corrente e amplamente inteligível; 'fiel de espírito' conserva a imagem antropológica hebraica, enquanto a nota registra a alternativa idiomática e o sentido mais literal.
