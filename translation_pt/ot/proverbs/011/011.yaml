  text: בְּ/בִרְכַּ֣ת יְ֭שָׁרִים תָּר֣וּם קָ֑רֶת וּ/בְ/פִ֥י רְ֝שָׁעִ֗ים תֵּהָרֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/011.yaml
  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
translation:
  language: pt
  text: Pela bênção dos íntegros, a cidade se eleva[a], mas pela boca[b] dos perversos ela é derrubada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prospera”. O hebraico diz literalmente que a cidade “se eleva”.
    reason: lexical_alternative
  - marker: b
    text: “Pela boca” refere-se ao poder destrutivo das palavras dos perversos.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/בִרְכַּת
  choice: Pela bênção dos
  rationale: A preposição בְּ indica aqui meio ou instrumento, e בִּרְכָּה significa “bênção”. A formulação preserva tanto a ideia de uma bênção pronunciada pelos íntegros quanto a de sua influência benéfica.
- source_word: יְשָׁרִים
  choice: íntegros
  rationale: יָשָׁר descreve pessoas moralmente retas. “Íntegros” é natural no português atual e mantém a força ética sem restringir o sentido à mera honestidade verbal.
- source_word: תָּרוּם
  choice: se eleva
  rationale: O Qal de רוּם indica que a cidade sobe ou é elevada em condição e honra. “Se eleva” conserva a metáfora hebraica e pode sugerir prosperidade cívica sem explicitá-la além do texto.
- source_word: קָרֶת
  choice: a cidade
  rationale: קָרֶת designa uma cidade ou povoação; “cidade” é o equivalente mais corrente e adequado ao alcance comunitário do provérbio.
- source_word: וּ/בְ/פִי
  choice: mas pela boca
  rationale: A conjunção introduz o contraste, e בְּ indica o meio. A tradução literal de פֶּה por “boca” preserva a imagem hebraica do discurso como instrumento de destruição.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: רָשָׁע designa os moralmente maus no vocabulário sapiencial. “Perversos” comunica essa categoria ética com naturalidade e dignidade em português.
- source_word: תֵּהָרֵס
  choice: ela é derrubada
  rationale: O Nifal de הָרַס exprime ser derrubado, demolido ou destruído. “É derrubada” conserva a voz passiva e forma uma antítese clara com “se eleva”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura antitética e a concisão proverbial foram preservadas; a imagem concreta de “boca” foi mantida, e a possível dimensão social de “se eleva” foi indicada sem eliminar a metáfora do hebraico.
