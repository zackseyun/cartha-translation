  text: תּוֹעֲבַ֣ת יְ֭הוָה עִקְּשֵׁי לֵ֑ב וּ֝/רְצוֹנ֗/וֹ תְּמִ֣ימֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/020.yaml
  text: The crooked in heart are an abomination to Yahweh[b][a], but those blameless in their way are his delight.
translation:
  language: pt
  text: Os de coração perverso são uma abominação para Yahweh, mas os de conduta íntegra são do seu agrado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os íntegros de caminho”, isto é, aqueles cuja maneira de viver é íntegra ou irrepreensível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: abominação
  rationale: Preserva a intensidade do substantivo hebraico, que indica algo moralmente repugnante, e mantém a concisão proverbial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עִקְּשֵׁי לֵב
  choice: os de coração perverso
  rationale: Conserva a imagem antropológica de 'coração' como centro interior da vontade e do pensamento; 'perverso' comunica a distorção moral indicada pelo adjetivo.
- source_word: וּרְצוֹנוֹ
  choice: são o seu prazer
  rationale: Expressa naturalmente a ideia de prazer, agrado ou favor e mantém o forte paralelismo antitético com 'abominação'.
- source_word: תְּמִימֵי דָרֶךְ
  choice: os de conduta íntegra
  rationale: 'Interpreta o idiomatismo ''íntegros de caminho'' segundo seu sentido sapiencial: pessoas cuja maneira de viver se caracteriza por inteireza e retidão.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração 'Yahweh' preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido antropológico de לֵב
  choice: manter 'coração'
  alternative: interior ou mente
  rationale: No contexto sapiencial hebraico, 'coração' abrange pensamento, vontade e orientação moral; manter a imagem evita reduzi-la a uma única faculdade.
- issue: Alcance de תָּמִים em תְּמִימֵי דָרֶךְ
  choice: conduta íntegra
  alternative: irrepreensíveis em seu caminho
  rationale: Aqui o termo descreve inteireza moral no modo de viver, não perfeição absoluta ou impecabilidade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com concisão proverbial. 'Abominação' mantém a força do original; 'conduta íntegra' torna claro o idiomatismo hebraico sem eliminar sua dimensão ética.
