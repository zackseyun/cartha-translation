  text: בּוֹטֵ֣חַ בְּ֭/עָשְׁר/וֹ ה֣וּא יִפֹּ֑ל וְ֝/כֶ/עָלֶ֗ה צַדִּיקִ֥ים יִפְרָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
translation:
  language: pt
  text: 'Quem confia em sua riqueza cairá,

    mas os justos florescerão como a folha.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido coletivo, “como a folhagem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ בְּעָשְׁרוֹ
  choice: Quem confia em sua riqueza
  rationale: O particípio de בטח expressa depositar confiança em algo, e עֹשֶׁר significa riqueza. A construção com “quem” comunica naturalmente o valor genérico do masculino singular hebraico.
- source_word: הוּא יִפֹּל
  choice: cairá
  rationale: O imperfeito apresenta a consequência geral de confiar na riqueza. O pronome enfático הוּא fica implícito em português, sem perda relevante do contraste proverbial.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo masculino plural substantivado designa as pessoas justas; “os justos” é conciso, tradicional e compreensível.
- source_word: וְכֶעָלֶה ... יִפְרָחוּ
  choice: mas ... florescerão como a folhagem
  rationale: פרח admite a ideia de florescer ou vicejar. Embora עָלֶה esteja no singular, pode evocar coletivamente a folhagem verdejante; “folhagem” preserva a imagem vegetal e combina de modo natural com o plural “os justos”.
theological_decisions:
- issue: Referência genérica do particípio masculino singular
  choice: Quem confia em sua riqueza
  alternative: O que confia em suas riquezas
  rationale: “Quem” preserva a aplicação geral do provérbio sem restringi-la aos homens, enquanto “sua” mantém a relação pessoal com a riqueza sem explicitação desnecessária de gênero.
- issue: Número e força da imagem de עָלֶה
  choice: como a folhagem
  alternative: como uma folha
  rationale: O hebraico tem literalmente o singular “folha”, mas a comparação pode ter sentido representativo ou coletivo. O texto principal comunica a imagem de crescimento verdejante, e a nota conserva a forma mais literal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém o paralelismo conciso do provérbio e a metáfora vegetal, sem especificar a natureza da queda nem transformar a máxima em promessa material absoluta.
