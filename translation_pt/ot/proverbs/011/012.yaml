  text: בָּז לְ/רֵעֵ֥/הוּ חֲסַר לֵ֑ב וְ/אִ֖ישׁ תְּבוּנ֣וֹת יַחֲרִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
translation:
  language: pt
  text: Quem despreza o seu próximo[a] não tem bom senso[b], mas o homem[c] de discernimento se mantém calado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu amigo” ou “o seu companheiro”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “é falto de coração”; no hebraico, trata-se de uma expressão para a falta de bom senso ou entendimento.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz “homem de discernimento”, empregando o masculino singular em sentido representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: despreza
  rationale: O termo expressa tratar alguém com desdém ou desprezo. “Despreza” é conciso, natural e preserva o contraste moral do provérbio.
- source_word: לְרֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode designar próximo, amigo ou companheiro. “Próximo” mantém o sentido social amplo do contexto sapiencial sem restringi-lo a uma amizade íntima.
- source_word: חֲסַר לֵב
  choice: não tem bom senso
  rationale: A expressão significa literalmente “falto de coração”, mas “coração” representa aqui a capacidade de discernir e julgar. A formulação idiomática comunica esse sentido com clareza em português.
- source_word: וְאִישׁ תְּבוּנוֹת
  choice: mas o homem de discernimento
  rationale: O hebraico emprega o masculino singular de modo representativo. O plural abstrato תְּבוּנוֹת comunica discernimento ou compreensão bem desenvolvida; “de discernimento” é natural e preciso.
- source_word: יַחֲרִישׁ
  choice: se mantém calado
  rationale: O verbo indica calar-se ou guardar silêncio. “Se mantém calado” sugere a contenção deliberada que contrasta com a atitude de desprezo.
theological_decisions:
- issue: Linguagem masculina representativa em וְאִישׁ
  choice: o homem de discernimento
  alternative: a pessoa de discernimento; quem tem discernimento
  rationale: A tradução conserva a forma masculina singular do hebraico, que funciona de maneira representativa no provérbio, sem limitar a verdade enunciada apenas aos homens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Bom senso” traduz o idioma antropológico hebraico sem sugerir mera deficiência emocional; “se mantém calado” ressalta a contenção voluntária.
