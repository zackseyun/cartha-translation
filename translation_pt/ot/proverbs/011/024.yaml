  text: יֵ֣שׁ מְ֭פַזֵּר וְ/נוֹסָ֥ף ע֑וֹד וְ/חוֹשֵׂ֥ךְ מִ֝/יֹּ֗שֶׁר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
translation:
  language: pt
  text: Há quem espalhe e ainda tenha mais; mas há quem retenha mais do que é justo[a], e isso só leva à pobreza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retenha o que é justo”. A expressão hebraica מִיֹּשֶׁר é difícil; pode indicar reter além do que é apropriado ou reter aquilo que é justo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há quem
  rationale: Introduz naturalmente, em português, um tipo geral de pessoa, sem indicar um indivíduo específico.
- source_word: מְפַזֵּר
  choice: espalhe generosamente
  rationale: Preserva a imagem concreta de espalhar, enquanto o advérbio torna claro o sentido contextual de distribuir com liberalidade.
- source_word: וְנוֹסָף עוֹד
  choice: e ainda veja seus bens aumentarem
  rationale: Expressa o aumento paradoxal que sucede à distribuição; 'seus bens' explicita de modo natural o referente econômico sugerido pelo contexto.
- source_word: וְחוֹשֵׂךְ
  choice: e há quem retenha
  rationale: Mantém a antítese com o ato de espalhar e traduz o sentido de guardar ou negar algo que poderia ser dado.
- source_word: מִיֹּשֶׁר
  choice: mais do que é justo
  rationale: A expressão hebraica é difícil. Esta formulação entende מִן em sentido comparativo e יֹשֶׁר como aquilo que é correto ou apropriado, sem apagar a alternativa lexical.
- source_word: אַךְ
  choice: apenas
  rationale: Marca a limitação enfática e o resultado irônico da retenção.
- source_word: לְמַחְסוֹר
  choice: na pobreza
  rationale: Comunica com clareza o estado de carência ou falta indicado pelo substantivo hebraico.
