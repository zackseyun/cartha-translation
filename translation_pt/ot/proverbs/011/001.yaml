  text: מֹאזְנֵ֣י מִ֭רְמָה תּוֹעֲבַ֣ת יְהוָ֑ה וְ/אֶ֖בֶן שְׁלֵמָ֣ה רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
translation:
  language: pt
  text: Balanças fraudulentas são uma abominação para Yahweh, mas um peso íntegro[a] é do seu agrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma pedra completa”, isto é, uma pedra usada como peso-padrão, íntegra e correta, no comércio.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  choice: balanças fraudulentas
  rationale: A construção hebraica significa literalmente “balanças de engano”. A formulação portuguesa é natural e mantém a imagem comercial e a ideia de fraude deliberada.
- source_word: תּוֹעֲבַת
  choice: abominação
  rationale: Preserva a forte reprovação moral expressa pelo termo hebraico, sem suavizá-la.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶבֶן שְׁלֵמָה
  choice: um peso exato
  rationale: Literalmente, “uma pedra completa”. No contexto comercial, אֶבֶן designa uma pedra usada como peso padrão, e שְׁלֵמָה indica que ela é íntegra, completa e correta. “Peso exato” comunica com clareza a função e o contraste ético.
- source_word: רְצוֹנוֹ
  choice: o seu prazer
  rationale: O substantivo pode indicar favor, agrado ou prazer. Aqui forma o contraponto avaliativo a “abominação”; “o seu prazer” preserva esse paralelismo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva de modo transliterado, sem substituí-lo por um título.
- issue: Força moral de תּוֹעֲבַת
  choice: abominação
  alternative: coisa detestável
  rationale: “Abominação” mantém a intensidade da condenação divina e o peso tradicional do vocabulário bíblico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo antitético do provérbio foi preservado; “fraudulentas” explicita idiomaticamente o substantivo hebraico “engano”, e “peso exato” comunica o referente comercial da expressão literal.
