  text: עוֹכֵ֣ר בֵּ֭ית/וֹ יִנְחַל ר֑וּחַ וְ/עֶ֥בֶד אֱ֝וִ֗יל לַ/חֲכַם לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
translation:
  language: pt
  text: Quem traz problemas para a própria casa[a] herdará o vento[b], e o insensato será servo do sábio de coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “casa” pode se referir à família ou ao conjunto das pessoas do lar, e não apenas à moradia.
    reason: lexical_alternative
  - marker: b
    text: Ou “herdará o vazio” ou “não herdará nada”; no hebraico, “vento” retrata aquilo que é insubstancial ou fútil.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  choice: causa transtorno
  rationale: O particípio descreve quem provoca perturbação, desgraça ou dano. “Causa transtorno” conserva o sentido ativo sem especificar ruína completa.
- source_word: בֵּיתוֹ
  choice: à própria casa
  rationale: “Casa” preserva a imagem concreta do hebraico e, no contexto, pode abranger a família ou todos os que compõem o lar.
- source_word: יִנְחַל
  choice: herdará
  rationale: 'Mantém o sentido comum do verbo e a ironia proverbial: a herança obtida por essa pessoa será apenas vento.'
- source_word: רוּחַ
  choice: o vento
  rationale: Preserva a metáfora hebraica de algo inconsistente, vazio ou inútil, em vez de substituí-la diretamente por uma interpretação.
- source_word: וְעֶבֶד
  choice: será servo
  rationale: A oração nominal permite em português uma formulação de resultado. “Servo” expressa a condição subordinada sem impor que se trate necessariamente de escravidão formal.
- source_word: אֱוִיל
  choice: o insensato
  rationale: Termo sapiencial que caracteriza alguém moral e praticamente sem juízo. “Insensato” é corrente, digno e natural em português bíblico moderno.
- source_word: לַחֲכַם־לֵב
  choice: de quem tem o coração sábio
  rationale: Conserva a referência hebraica ao coração como centro do discernimento, numa construção portuguesa mais natural que “sábio de coração”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A metáfora “herdar o vento” e a expressão antropológica “coração sábio” foram preservadas, enquanto a sintaxe foi ajustada ao uso corrente.
