base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/014.yaml
  text: Without guidance a people falls[a], but in an abundance of counselors there is deliverance.
translation:
  language: pt
  text: Sem orientação, um povo cai; mas, com muitos conselheiros, há livramento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Onde não há orientação, um povo cai; mas, numa multidão de conselheiros, há segurança/vitória.”'
    reason: 'Alternativas lexicais e sintáticas: בְּאֵין também pode ser expresso como “onde não há”, e תְּשׁוּעָה pode indicar livramento, segurança ou vitória.'
lexical_decisions:
- source_word: בְּאֵין
  choice: Sem
  rationale: A construção preposicional com אֵין expressa ausência; “sem” é conciso, natural e preserva o valor circunstancial do hebraico.
- source_word: תַּחְבֻּלוֹת
  choice: orientação
  rationale: O substantivo pode indicar direção, condução ou estratégia. “Orientação” se ajusta ao contexto amplo de sabedoria sem restringir o sentido ao campo militar ou náutico e mantém distinção em relação a יוֹעֵץ.
- source_word: יִפָּל
  choice: cai
  rationale: Mantém a imagem direta do verbo נפל, que neste contexto também sugere colapso ou ruína.
- source_word: עָם
  choice: um povo
  rationale: Expressa o caráter geral do provérbio sem limitar a afirmação a um povo ou nação específicos.
- source_word: וּתְשׁוּעָה
  choice: mas... há livramento
  rationale: תְּשׁוּעָה pode significar livramento, segurança ou vitória. “Livramento” preserva a ideia ampla de resgate e preservação; “há” representa naturalmente a oração nominal hebraica, e “mas” explicita o contraste entre os dois membros.
- source_word: בְּרֹב יוֹעֵץ
  choice: com muitos conselheiros
  rationale: A expressão apresenta יוֹעֵץ no singular com sentido coletivo após רֹב. A formulação portuguesa comunica de modo natural a pluralidade de pessoas que aconselham.
