translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo proverbial foi preservado com ponto e vírgula; evitou-se repetir “conselho” nos dois membros para refletir a distinção lexical do hebraico.
