base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/022.yaml
  text: Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion[a].
translation:
  language: pt
  text: Como uma argola de ouro no focinho de um porco é a mulher bonita sem discernimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como um anel de ouro no nariz de um porco é uma mulher bonita que se desvia do bom senso.”'
    reason: Alternativas lexicais para נֶזֶם (“argola”, “anel”) e para טַעַם (“discernimento”, “bom senso”), bem como uma tradução mais próxima da forma participial de וְסָרַת.
lexical_decisions:
- source_word: נֶזֶם
  choice: joia
  rationale: O termo designa um adorno em forma de argola, muitas vezes usado no nariz. “Joia” preserva a ideia de um adorno precioso sem tornar redundante a localização explícita no focinho; a alternativa mais concreta é registrada em nota.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto que mantém o contraste entre o objeto precioso e o porco.
- source_word: בְּאַף חֲזִיר
  choice: no focinho de um porco
  rationale: אַף tem aqui o sentido anatômico de nariz; “focinho” é o termo natural em português para o nariz do porco.
- source_word: אִשָּׁה יָפָה
  choice: a mulher bonita
  rationale: Não há contexto matrimonial que exija “esposa”; “mulher bonita” expressa de modo claro a beleza física indicada pelo hebraico.
- source_word: וְסָרַת טָעַם
  choice: que rejeita o bom senso
  rationale: A expressão descreve uma mulher que se afasta de טַעַם, termo que neste contexto sapiencial indica discernimento, juízo ou bom senso. “Rejeita” preserva melhor a ideia ativa de afastar-se do que a simples formulação “não tem”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A comparação direta e o contraste incisivo do hebraico foram preservados.
