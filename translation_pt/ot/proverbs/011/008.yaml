  terminology: «Justo» e «perverso» preservam adequadamente o contraste moral substantivado. «É livrado» reflete bem a voz passiva de נֶחֱלָץ. A nota deve apresentar «em vez dele» como alternativa para a locução de substituição, sem fazer da consequência sugerida uma afirmação explícita do versículo.
