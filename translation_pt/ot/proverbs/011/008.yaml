source:
  edition: WLC
  text: צַ֭דִּיק מִ/צָּרָ֣ה נֶחֱלָ֑ץ וַ/יָּבֹ֖א רָשָׁ֣ע תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/008.yaml
  text: The righteous is rescued from trouble[a], and the wicked comes in his place.
translation:
  language: pt
  text: O justo é livrado da aflição, e o perverso vem em lugar dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em vez dele». A expressão hebraica pode indicar substituição, sugerindo que o perverso entra na aflição em lugar do justo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado designa uma pessoa justa no singular; “o justo” conserva a forma representativa e é natural no português bíblico atual.
- source_word: מִצָּרָה
  choice: da aflição
  rationale: A preposição מִן indica saída ou livramento, e צָרָה abrange aflição, angústia ou adversidade. “Da aflição” exprime com concisão o perigo ou sofrimento do qual alguém é retirado.
- source_word: נֶחֱלָץ
  choice: é livrado
  rationale: 'O nifal de חלץ comunica ação passiva: ser retirado ou liberto. “É livrado” preserva essa passividade sem sugerir que o justo escapa apenas por esforço próprio.'
- source_word: וַיָּבֹא
  choice: toma
  rationale: Embora o verbo signifique literalmente “vem/entra”, em combinação com תַּחְתָּיו a expressão idiomática em português é “toma o lugar dele”. O presente mantém o caráter proverbial.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado contrasta a pessoa culpada ou moralmente má com o justo. “O perverso” é claro, corrente e preserva o paralelismo.
- source_word: תַּחְתָּיו
  choice: o lugar dele
  rationale: 'תַּחַת com sufixo pode indicar substituição: “no lugar dele” ou “em vez dele”. A formulação escolhida expressa esse sentido sem acrescentar detalhes ausentes do hebraico.'
theological_decisions:
- issue: A reversão expressa pelo provérbio
  choice: O perverso toma o lugar do justo após este ser livrado da aflição.
  alternative: O perverso cai especificamente na mesma aflição da qual o justo foi livrado.
  rationale: O hebraico sugere substituição e reversão por meio de תַּחְתָּיו, mas não explicita o mecanismo nem exige que se descreva uma situação narrativa específica. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “O justo” e “o perverso” preservam o contraste representativo do singular hebraico; “é livrado” mantém a voz passiva.
