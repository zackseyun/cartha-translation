base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
translation:
  language: pt
  text: A retidão dos íntegros os livra, mas os traiçoeiros são apanhados pelo próprio desejo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas os traiçoeiros são apanhados em sua ruína” ou “por sua destruição”. O substantivo hebraico pode indicar tanto um desejo destrutivo quanto calamidade ou ruína; o texto principal o entende como o desejo interior que os enreda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: justiça
  rationale: O substantivo em construto designa aqui a qualidade ou conduta de quem age corretamente. “Justiça” preserva o vínculo lexical com צְדָקָה e é natural no contexto ético de Provérbios.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: Designa pessoas moralmente retas. “Íntegros” comunica essa categoria ética em português corrente sem recorrer à expressão menos natural “os retos”.
- source_word: תַּצִּילֵם
  choice: os livra
  rationale: O hifil de נצל significa retirar do perigo, libertar ou resgatar. “Livra” é conciso, natural e apropriado ao paralelismo proverbial.
- source_word: וּבְהַוַּת
  choice: pelo próprio desejo
  rationale: הַוָּה pode indicar desejo ou cobiça destrutiva, mas também ruína ou calamidade. No texto principal, ב é entendido instrumentalmente, e o desejo é visto como aquilo que enreda os traiçoeiros; a ambiguidade lexical é preservada em nota.
- source_word: בֹּגְדִים
  choice: os traiçoeiros
  rationale: O termo descreve os que agem com traição ou deslealdade. “Traiçoeiros” mantém a categoria moral ampla, sem restringi-la à apostasia religiosa nem à traição política.
- source_word: יִלָּכֵדוּ
  choice: são apanhados
  rationale: O nifal de לכד exprime ser capturado ou cair numa armadilha. “São apanhados” é claro e conserva a imagem de serem presos pelo próprio desejo.
