source:
  edition: WLC
  text: הֵ֣ן צַ֭דִּיק בָּ/אָ֣רֶץ יְשֻׁלָּ֑ם אַ֝֗ף כִּֽי רָשָׁ֥ע וְ/חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
translation:
  language: pt
  text: Eis que[a] o justo recebe na terra o que lhe é devido; quanto mais o perverso e o pecador!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De fato, o justo recebe sua retribuição na terra”. Mais literalmente: “Eis que o justo será retribuído na terra”; “terra” também pode ser entendido como “território”.'
    reason: Alternativa lexical e formal para הֵן e יְשֻׁלָּם, preservando também a possibilidade de entender אֶרֶץ como “terra” ou “território”.
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Introduz uma afirmação enfática e chama a atenção do público. “Vejam” comunica essa força em português atual; “De fato” também é possível.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo masculino singular substantivado representa a pessoa justa; “o justo” é a forma tradicional, concisa e natural em português.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode significar “terra”, “país” ou “território”. Aqui, a máxima moral geral favorece “na terra”, sem excluir por completo a nuance territorial.
- source_word: יְשֻׁלָּם
  choice: recebe ... o que lhe é devido
  rationale: O pual de שלם expressa retribuição ou pagamento devido. Esta formulação preserva a neutralidade quanto a recompensa favorável ou consequência adversa, evitando restringir o sentido.
- source_word: אַף כִּי
  choice: quanto mais
  rationale: 'A locução introduz um argumento a fortiori: se isso vale para o primeiro caso, com maior razão vale para o segundo.'
- source_word: רָשָׁע
  choice: o perverso
  rationale: Equivalente corrente de רָשָׁע na literatura sapiencial, indicando quem age de modo moralmente mau ou culpável.
- source_word: וְחוֹטֵא
  choice: e o pecador
  rationale: O particípio substantivado designa alguém caracterizado por pecar; “o pecador” preserva o paralelismo com “o perverso”.
theological_decisions:
- issue: Natureza da retribuição recebida pelo justo
  choice: O justo recebe na terra o que lhe é devido, sem se especificar se isso é recompensa favorável, sofrimento disciplinar ou ambos.
  alternative: “O justo é recompensado na terra” ou “o justo é castigado na terra”.
  rationale: O verbo hebraico admite a noção ampla de retribuição. Especificar apenas recompensa ou apenas castigo resolveria indevidamente a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “Vejam” funciona como chamado geral à atenção. A formulação “recebe ... o que lhe é devido” mantém a ambiguidade genuína da retribuição, e a exclamação final transmite a força do argumento a fortiori.
