  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
translation:
  language: pt
  text: A riqueza não serve para nada no dia da ira[a], mas a justiça[b] livra da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “num dia de ira”. “O dia da ira” também pode indicar, de modo geral, um tempo de juízo ou calamidade; o provérbio não especifica mais.'
    reason: alternative_reading
  - marker: b
    text: “Justiça” também pode ser entendida como “retidão” ou “conduta correta” neste contexto sapiencial.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: a riqueza
  rationale: Designa riqueza ou bens materiais; “a riqueza” é natural, abrangente e mantém o contraste proverbial com “a justiça”.
- source_word: יוֹעִיל
  choice: não serve para nada
  rationale: O hifil de יעל expressa proveito, benefício ou utilidade. A formulação comunica de modo claro a total ineficácia da riqueza nesse contexto.
- source_word: בְּיוֹם עֶבְרָה
  choice: no dia da ira
  rationale: Preserva de perto a expressão hebraica e sua força proverbial, sem decidir se se trata de calamidade histórica ou de juízo divino final.
- source_word: צְדָקָה
  choice: justiça
  rationale: Em Provérbios, צְדָקָה abrange retidão, justiça e conduta correta. “Justiça” é corrente em português e permite conservar essa amplitude sem transformar o termo em linguagem técnica sobre justificação.
- source_word: תַּצִּיל
  choice: livra
  rationale: O hifil de נצל significa resgatar ou livrar. “Livra” é conciso, idiomático e adequado ao paralelismo sapiencial.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: É a tradução direta da expressão hebraica, sem restringi-la a mero perigo mortal nem ampliar seu alcance doutrinário.
theological_decisions:
- issue: Sentido de “o dia da ira”
  choice: Um tempo decisivo de ira ou juízo, deixado sem especificação adicional.
  alternative: Um dia de calamidade humana ou, especificamente, o dia escatológico do juízo divino.
  rationale: O texto admite um cenário de juízo, mas não define sua natureza ou momento. A tradução conserva essa abertura.
- issue: Sentido de “a justiça livra da morte”
  choice: A máxima sapiencial apresenta a justiça como aquilo que livra da morte, sem explicar o mecanismo em categorias doutrinárias posteriores.
  alternative: A conduta correta evita consequências fatais, ou a justiça diante de Deus assegura livramento divino.
  rationale: O provérbio afirma diretamente o valor vivificante da justiça, mas não deve ser convertido numa formulação técnica sobre soteriologia ou justificação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo antitético e a concisão proverbial foram preservados. Os marcadores [a] e [b] aparecem no texto principal.
