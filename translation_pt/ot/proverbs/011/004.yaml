  source_fidelity: 'A tradução reproduz com precisão o paralelismo hebraico: הוֹן é adequadamente vertido por “riqueza”; לֹא יוֹעִיל, por “não serve para nada”; e as expressões “no dia da ira” e “livra da morte” mantêm a formulação e a abertura semântica do texto-fonte. “A justiça” é uma opção defensável para צְדָקָה e a nota preserva as nuances de retidão e conduta correta.'
