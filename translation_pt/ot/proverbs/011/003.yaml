source:
  edition: WLC
  text: תֻּמַּ֣ת יְשָׁרִ֣ים תַּנְחֵ֑/ם וְ/סֶ֖לֶף בּוֹגְדִ֣ים ו/שד/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/003.yaml
  text: The integrity of the upright guides them[b][a], but the crookedness of the treacherous destroys them.
translation:
  language: pt
  text: A integridade dos retos os guia, mas a perversidade[a] dos desleais os destrói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tortuosidade» ou «distorção». O hebraico evoca algo moralmente torcido, em contraste com os «retos».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֻּמַּת
  choice: integridade
  rationale: O substantivo expressa inteireza ou integridade moral. “Integridade” comunica o sentido ético sem sugerir ausência absoluta de pecado.
- source_word: יְשָׁרִים
  choice: os retos
  rationale: O termo designa pessoas moralmente retas e preserva o contraste figurado com a perversidade ou tortuosidade da segunda metade.
- source_word: תַּנְחֵם
  choice: os guia
  rationale: A forma causativa de נחה significa conduzir ou guiar; no contexto sapiencial, indica orientação moral.
- source_word: סֶלֶף
  choice: perversidade
  rationale: O substantivo denota distorção, tortuosidade ou perversidade moral. “Perversidade” é natural em português; a imagem mais concreta de algo torto permanece indicada pelo contraste com “retos”.
- source_word: בּוֹגְדִים
  choice: os desleais
  rationale: O particípio caracteriza os que agem com deslealdade ou traem a confiança. “Desleais” é abrangente e idiomático no contexto de sabedoria.
- source_word: וְשָׁדָם
  choice: é a ruína deles
  rationale: Conforme o texto massorético apresentado, a expressão é nominal e pode ser entendida como “sua devastação/ruína”. A tradução preserva essa construção, suprindo apenas a cópula exigida pelo português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. “Retos” e “perversidade” mantêm o contraste moral; a oração final segue de perto a construção nominal do texto hebraico fornecido.
