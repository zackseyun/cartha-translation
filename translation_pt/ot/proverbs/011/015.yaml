base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/015.yaml
  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
translation:
  language: pt
  text: Quem se faz fiador de um estranho certamente sofrerá dano, mas quem detesta dar garantias[a] está seguro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “bater as mãos” — gesto usado para confirmar uma promessa ou garantia. Ou: “quem detesta apertar as mãos para selar uma garantia está seguro”.'
    reason: cultural_note
lexical_decisions:
- source_word: רַע יֵרוֹעַ
  choice: certamente sofrerá dano
  rationale: A combinação intensifica a advertência e descreve um resultado prejudicial, não maldade moral. A formulação é natural em português e conserva a força proverbial.
- source_word: כִּי עָרַב
  choice: quem se torna fiador
  rationale: כִּי introduz aqui a pessoa ou circunstância que recebe a advertência, enquanto עָרַב designa assumir responsabilidade pela obrigação de outra pessoa.
- source_word: זָר
  choice: de um estranho
  rationale: No contexto sapiencial, indica alguém de fora do círculo de relações e responsabilidades pessoais, sem exigir o sentido étnico de estrangeiro.
- source_word: שֹׂנֵא
  choice: detesta
  rationale: Mantém a forte aversão expressa pelo particípio hebraico sem suavizá-la para simples cautela ou recusa.
- source_word: תֹקְעִים
  choice: selar compromissos com um aperto de mãos
  rationale: Expressa de modo compreensível o gesto de bater ou apertar as mãos para confirmar uma garantia ou compromisso, preservando a imagem cultural e seu sentido financeiro.
- source_word: בּוֹטֵחַ
  choice: está seguro
  rationale: Contrasta de maneira concisa com o dano da primeira linha e comunica segurança diante do risco mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Fiador” preserva a precisão jurídico-financeira e é amplamente compreensível; a expressão sobre o aperto de mãos explicita o valor cultural do gesto sem transformar a advertência em condenação de todo cumprimento social.
