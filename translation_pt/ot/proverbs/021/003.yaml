  text: עֲ֭שֹׂה צְדָקָ֣ה וּ/מִשְׁפָּ֑ט נִבְחָ֖ר לַ/יהוָ֣ה מִ/זָּֽבַח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/003.yaml
  text: To do righteousness and justice is more acceptable to Yahweh than sacrifice[a].
translation:
  language: pt
  text: Praticar a retidão e a justiça é mais aceitável para Yahweh do que o sacrifício.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é preferível para Yahweh ao sacrifício”. O hebraico diz literalmente “é escolhido por/para Yahweh”, expressando preferência ou aceitação divina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֹׂה
  choice: Praticar
  rationale: O infinitivo funciona substantivamente e apresenta a conduta avaliada. “Praticar” exprime de modo natural uma ação ética habitual, sem alterar o sentido de “fazer”.
- source_word: צְדָקָה
  choice: a retidão
  rationale: “Retidão” comunica conduta correta e preserva a distinção em relação a מִשְׁפָּט, traduzido como “justiça”.
- source_word: וּמִשְׁפָּט
  choice: e a justiça
  rationale: Neste contexto sapiencial, o termo designa justiça ou juízo justo na conduta humana; “justiça” é claro e corrente em português.
- source_word: נִבְחָר
  choice: é preferível
  rationale: O particípio nifal de בחר significa literalmente “é escolhido” e, nesta comparação, expressa preferência divina. “É preferível” preserva essa força sem reduzir o sentido apenas a agrado emocional.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição indica aquele para quem a conduta é preferível. O nome divino יהוה é transliterado como “Yahweh”, preservando seu caráter de nome próprio.
- source_word: מִזָּבַח
  choice: a oferecer sacrifícios
  rationale: A preposição מן introduz a comparação. A formulação verbal e o plural genérico são naturais em português e deixam claro que se compara a conduta ética com o ato sacrificial em geral.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Relação entre conduta ética e sacrifício
  choice: preferência comparativa, não rejeição absoluta do sacrifício
  alternative: condenação de todo sacrifício
  rationale: A construção comparativa com מן afirma que Yahweh prefere retidão e justiça ao sacrifício; por si só, o provérbio não declara que todo sacrifício seja inválido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Retidão e justiça” mantém o paralelismo ético dos dois substantivos hebraicos; “oferecer sacrifícios” evita a rigidez pouco idiomática de “preferível a sacrifício”.
