  text: הֵעֵ֬ז אִ֣ישׁ רָשָׁ֣ע בְּ/פָנָ֑י/ו וְ֝/יָשָׁ֗ר ה֤וּא יכין דרכי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/029.yaml
  text: A wicked man puts on a bold face[a], but an upright man makes his way sure.
translation:
  language: pt
  text: O homem perverso assume uma expressão insolente[a], mas o homem íntegro firma os seus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “endurece o rosto”; a segunda parte também pode ser traduzida: “mas o íntegro estabelece os seus caminhos”.'
    reason: Registra a expressão facial mais literal e a alternativa formal para כון, preservando a amplitude lexical do hebraico.
lexical_decisions:
- source_word: הֵעֵז ... בְּפָנָיו
  choice: assume uma expressão insolente
  rationale: O hifil de עזז, ligado a “seu rosto”, descreve alguém que torna o rosto ousado ou impudente. A formulação comunica em português atual a atitude descarada sem eliminar a imagem facial; a alternativa mais literal é preservada em nota.
- source_word: אִישׁ רָשָׁע
  choice: o homem perverso
  rationale: Mantém o masculino singular representativo do provérbio e traduz רָשָׁע pela categoria moral habitual da literatura sapiencial.
- source_word: וְיָשָׁר הוּא
  choice: mas o homem íntegro
  rationale: “Mas” explicita o contraste entre os dois tipos humanos. “Íntegro” expressa a retidão ética de יָשָׁר, e “homem” torna natural em português o pronome hebraico enfático no paralelismo.
- source_word: יכין
  choice: firma
  rationale: O hifil de כון significa estabelecer, tornar firme ou pôr em ordem. “Firma” conserva essa ideia central e se ajusta ao curso de vida representado pelos caminhos.
- source_word: דרכיו
  choice: os seus caminhos
  rationale: Preserva o plural morfológico hebraico e a imagem sapiencial dos modos de agir ou rumos de vida do homem íntegro.
theological_decisions: []
