  text: ט֗וֹב לָ/שֶׁ֥בֶת עַל פִּנַּת גָּ֑ג מֵ/אֵ֥שֶׁת מִ֝דְיָנִ֗ים וּ/בֵ֥ית חָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/009.yaml
  text: Better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: pt
  text: Melhor morar num canto do terraço do que com uma mulher briguenta numa casa compartilhada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa casa compartilhada com outros”; a expressão hebraica significa literalmente “e uma casa de companhia/associação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor
  rationale: No estilo conciso do provérbio, o adjetivo introduz naturalmente uma comparação de preferência.
- source_word: לָשֶׁבֶת
  choice: morar
  rationale: Embora o sentido básico seja “sentar-se”, neste contexto de habitação o verbo significa residir ou morar.
- source_word: עַל פִּנַּת גָּג
  choice: num canto do terraço
  rationale: גָּג designa o teto plano usado como terraço nas casas antigas; a formulação conserva a imagem de um lugar exposto e apertado.
- source_word: מֵאֵשֶׁת מִדְיָנִים
  choice: do que com uma mulher briguenta
  rationale: A preposição מִן marca a comparação depois de טוֹב, e מִדְיָנִים caracteriza alguém dado a brigas. “Com” explicita em português a convivência implícita.
- source_word: וּבֵית חָבֶר
  choice: numa casa compartilhada
  rationale: A expressão hebraica é difícil e literalmente se refere a uma “casa de companhia/associação”. A escolha comunica uma casa dividida com outros sem ocultar a incerteza, registrada em nota.
theological_decisions: []
