  text: ט֗וֹב שֶׁ֥בֶת בְּ/אֶֽרֶץ מִדְבָּ֑ר מֵ/אֵ֖שֶׁת מדונים וָ/כָֽעַס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/019.yaml
  text: It is better to live in a desert land than with a quarrelsome and angry wife[a].
translation:
  language: pt
  text: É melhor viver numa terra deserta do que com uma esposa briguenta e irada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do que com uma esposa briguenta e provocadora”. O termo final pode descrever tanto a disposição dela (“irada”) como o efeito que causa nos outros (“irritante, provocadora”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: É melhor
  rationale: Adjetivo predicativo que introduz a comparação; esta é a formulação proverbial natural em português.
- source_word: שֶׁבֶת
  choice: viver
  rationale: O infinitivo de ישׁב indica residência; “viver” é atual e natural, sem sugerir apenas o ato de sentar-se.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: numa terra deserta
  rationale: Preserva tanto אֶרֶץ, “terra”, como מִדְבָּר, região erma ou desértica, em português idiomático.
- source_word: מֵאֵשֶׁת
  choice: do que com uma mulher
  rationale: מִן introduz o segundo termo da comparação. Com “viver”, o português pede naturalmente “com”. אֵשֶׁת pode designar mulher ou esposa; “mulher” conserva em português a possível referência conjugal sem torná-la obrigatoriamente explícita.
- source_word: מדונים
  choice: briguenta
  rationale: O plural abstrato de מדון, “contenda”, caracteriza alguém dado a discussões; “briguenta” é claro e corrente.
- source_word: וָכָעַס
  choice: e irada
  rationale: כעס pode indicar ira, irritação ou provocação. “Irada” expressa diretamente a disposição de ira, enquanto a nota preserva a leitura causativa possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção proverbial é concisa; “terra deserta” mantém a imagem hebraica de uma região erma. O marcador [a] está presente no texto principal.
