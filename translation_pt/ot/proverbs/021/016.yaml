source:
  edition: WLC
  text: אָדָ֗ם תּ֭וֹעֶה מִ/דֶּ֣רֶךְ הַשְׂכֵּ֑ל בִּ/קְהַ֖ל רְפָאִ֣ים יָנֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/016.yaml
  text: A man who wanders from the way of understanding will come to rest in the assembly of the dead[a].
translation:
  language: pt
  text: O homem que se desvia do caminho do entendimento repousará na assembleia dos mortos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das sombras”. O hebraico traz “refains”, termo usado na literatura sapiencial para os mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: O homem
  rationale: O substantivo singular apresenta um indivíduo representativo num provérbio. “O homem” preserva a forma singular e o paralelismo sentencioso, embora o princípio se aplique genericamente às pessoas.
- source_word: תּוֹעֶה
  choice: que se desvia
  rationale: O particípio descreve quem se afasta ou anda errante. “Se desvia” soa natural em português e mantém a metáfora moral do caminho.
- source_word: מִדֶּרֶךְ
  choice: do caminho
  rationale: “Caminho” é termo recorrente da literatura sapiencial para o curso da vida e da conduta.
- source_word: הַשְׂכֵּל
  choice: do entendimento
  rationale: O termo denota discernimento, compreensão prudente ou bom senso. “Entendimento” conserva o registro sapiencial e a amplitude semântica.
- source_word: בִּקְהַל
  choice: na assembleia
  rationale: קהל designa um grupo reunido. “Assembleia” preserva a imagem coletiva sem introduzir uma conotação eclesiástica específica.
- source_word: רְפָאִים
  choice: dos mortos
  rationale: Neste contexto sapiencial, רְפָאִים refere-se aos mortos, concebidos como habitantes do mundo dos mortos, e não ao povo dos refains. A alternativa mais literal é registrada em nota.
- source_word: יָנוּחַ
  choice: repousará
  rationale: 'O verbo significa descansar ou estabelecer-se. “Repousará” preserva a concisão e a ironia sombria do hebraico: o destino final de quem abandona o entendimento é estar entre os mortos.'
theological_decisions:
- issue: Sentido de רְפָאִים na literatura sapiencial
  choice: os mortos
  alternative: as sombras; os refains
  rationale: O contexto apresenta o destino mortal de quem abandona o caminho do entendimento. Transliterar “refains” obscureceria esse sentido; “sombras” conserva melhor a imagem do mundo dos mortos, mas é menos imediatamente clara, por isso aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. Mantém-se a metáfora do caminho, a imagem coletiva da assembleia e a ambiguidade evocativa de “repousará”, sem converter o verso numa explicação doutrinária.
