  yaml_path: translation/ot/proverbs/021/015.yaml
  text: Doing justice is a joy to the righteous[a], but destruction to evildoers.
translation:
  language: pt
  text: Praticar a justiça é alegria para o justo, mas é ruína para os que praticam o mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Praticar a justiça é alegria para o justo, mas causa terror aos que praticam o mal.” O substantivo hebraico מְחִתָּה pode significar terror, consternação ou ruína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Preserva o valor nominal de alegria ou contentamento e soa natural na oração sem verbo explícito.
- source_word: לַצַּדִּיק
  choice: para o justo
  rationale: A preposição ל marca relação ou efeito, e o singular substantivado tem valor representativo.
- source_word: עֲשׂוֹת
  choice: praticar
  rationale: O infinitivo construto é substantivado; “praticar” expressa uma conduta geral e combina naturalmente com “justiça”.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: No contexto sapiencial, designa o que é justo ou a justiça como norma moral e jurídica.
- source_word: וּמְחִתָּה
  choice: mas é ruína
  rationale: מְחִתָּה pode indicar terror, consternação ou ruína. “Ruína” conserva o possível sentido de resultado destrutivo; “mas” explicita em português a antítese marcada pelo paralelismo.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: para os que praticam o mal
  rationale: Reproduz de modo claro a expressão concreta “os que fazem/praticam perversidade”, sem recorrer a vocabulário arcaico.
- source_word: אָוֶן
  choice: mal
  rationale: Nesta combinação, o termo tem sentido moral de perversidade ou iniquidade, não apenas de sofrimento ou dificuldade.
