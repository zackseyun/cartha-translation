  text: כָּֽל דֶּרֶךְ אִ֭ישׁ יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן לִבּ֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/002.yaml
  text: Every man's way is right in his own eyes[a], but Yahweh weighs hearts.
translation:
  language: pt
  text: O caminho de todo homem é reto a seus próprios olhos, mas Yahweh pesa os corações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: Todo
  rationale: O singular distributivo apresenta como verdadeira, em cada caso, a avaliação que cada indivíduo faz do próprio caminho.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Mantém a metáfora característica da literatura sapiencial para o modo de viver ou a conduta de alguém.
- source_word: אִישׁ
  choice: de um homem
  rationale: Preserva o substantivo masculino singular do hebraico e seu valor representativo no enunciado proverbial.
- source_word: יָשָׁר
  choice: reto
  rationale: Conserva tanto a imagem espacial de retidão quanto o sentido avaliativo de algo considerado correto.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Reproduz o idioma hebraico que indica a avaliação pessoal do indivíduo; “próprios” explicita naturalmente a força reflexiva em português.
- source_word: וְתֹכֵן
  choice: mas ... pesa
  rationale: “Pesa” preserva a metáfora de medir ou avaliar; “mas” expressa em português o contraste pragmático entre a autoavaliação humana e o exame divino.
- source_word: לִבּוֹת
  choice: os corações
  rationale: Mantém o plural e o idioma antropológico hebraico, no qual o coração abrange pensamentos, intenções e motivações.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Contraste entre a autoavaliação humana e a avaliação divina
  choice: “é reto aos seus próprios olhos, mas Yahweh pesa os corações”
  alternative: “parece certo para ele, mas o SENHOR examina as motivações”
  rationale: A redação escolhida conserva a afirmação idiomática hebraica sem acrescentar explicitamente “parece” e mantém as metáforas de olhos, pesagem e corações, sem reduzir estes últimos apenas às motivações.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original emprega diretamente o tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com estrutura proverbial concisa. “Um homem” conserva a forma masculina singular representativa do hebraico; “aos seus próprios olhos” é idiomático e deixa clara a autoavaliação. Não foi adotada a nota inglesa fornecida, pois ela contradiz o próprio texto inglês ao afirmar que o texto principal traz “the LORD” quando traz “Yahweh”.
