id: PRO.21.10
reference: Proverbs 21:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/010.yaml
  text: The soul of the wicked desires evil[b][a]; his neighbor finds no favor in his eyes.
translation:
  language: pt
  text: A alma do perverso deseja o mal; seu próximo[a] não encontra favor aos olhos dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu amigo” ou “seu companheiro”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica indica que o próximo não recebe dele favor, bondade ou aprovação.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alma
  rationale: Aqui, נֶפֶשׁ designa a vida interior ou o centro dos desejos da pessoa. “Alma” mantém a expressão compacta e o peso antropológico do hebraico.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo é usado como substantivo e representa a pessoa moralmente má. “O perverso” é conciso, corrente na literatura sapiencial e preserva o singular representativo.
- source_word: אִוְּתָה
  choice: deseja
  rationale: O verbo expressa desejo ou anseio. “Deseja” comunica o sentido com naturalidade, sem aumentar indevidamente sua intensidade.
- source_word: רָע
  choice: o mal
  rationale: Neste contexto sapiencial, רָע tem força moral, embora também possa envolver dano. “O mal” preserva a formulação abrangente do provérbio.
- source_word: יֻחַן
  choice: não encontra favor
  rationale: A forma passiva de חנן indica que alguém recebe favor, graça ou bondade. “Não encontra favor” conserva essa perspectiva passiva e se integra ao idioma hebraico dos olhos.
- source_word: בְּעֵינָיו
  choice: aos olhos dele
  rationale: A expressão hebraica apresenta a atitude ou avaliação do perverso. A tradução mantém a imagem concreta, esclarecendo o referente pronominal.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: רֵעַ pode indicar próximo, companheiro ou amigo. “Próximo” preserva aqui a dimensão ética e social sem pressupor intimidade.
theological_decisions:
- issue: Amplitude moral de רָע
  choice: o mal
  alternative: o dano
  rationale: O contexto caracteriza o desejo do perverso em termos morais; “o mal” mantém essa força sem excluir as consequências nocivas de suas intenções.
- issue: Natureza do favor negado ao próximo
  choice: não encontra favor aos olhos dele
  alternative: não recebe bondade dele
  rationale: A formulação escolhida preserva a imagem e a relativa abertura do hebraico entre favor, compaixão, bondade e aprovação, em vez de restringi-la a uma única manifestação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e a imagem hebraica “aos olhos dele” foram preservadas, enquanto o pronome foi explicitado para evitar ambiguidade.
