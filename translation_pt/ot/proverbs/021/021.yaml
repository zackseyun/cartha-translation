  text: רֹ֭דֵף צְדָקָ֣ה וָ/חָ֑סֶד יִמְצָ֥א חַ֝יִּ֗ים צְדָקָ֥ה וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/021.yaml
  text: Whoever pursues righteousness and steadfast love will find life[a], righteousness[c][b], and honor.
translation:
  language: pt
  text: Quem busca a justiça e o amor leal[a] encontrará vida, justiça[b] e honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bondade”, “misericórdia” ou “amor constante”. O termo hebraico também envolve fidelidade e lealdade.
    reason: lexical_alternative
  - marker: b
    text: “Justiça” também pode ser traduzida por “retidão” nas duas ocorrências; aqui, na segunda, pode ter o sentido de “vindicação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֵף
  choice: busca
  rationale: O particípio expressa uma busca ativa e contínua. Em português, “busca” é natural no registro proverbial; “persegue” poderia sugerir hostilidade.
- source_word: צְדָקָה
  choice: justiça
  rationale: O termo abrange retidão moral e conduta justa. “Justiça” é claro e natural em português e permite conservar a repetição hebraica.
- source_word: חֶסֶד
  choice: amor leal
  rationale: A expressão comunica amor acompanhado de fidelidade e compromisso, evitando reduzir o termo a mera bondade ou compaixão.
- source_word: יִמְצָא
  choice: encontrará
  rationale: O futuro expressa com clareza o resultado geral apresentado pelo provérbio.
- source_word: חַיִּים
  choice: vida
  rationale: Embora a forma hebraica seja plural, o substantivo tem sentido coletivo e idiomático de “vida” neste contexto.
- source_word: צְדָקָה
  choice: justiça
  rationale: A repetição preserva a forma compacta e a simetria do hebraico; no segundo uso, o termo também pode apontar para retidão reconhecida ou vindicação.
- source_word: כָבוֹד
  choice: honra
  rationale: No contexto sapiencial, “honra” expressa estima e dignidade sem introduzir indevidamente a ideia específica de riqueza.
theological_decisions:
- issue: Sentido da repetição de צְדָקָה
  choice: justiça nas duas ocorrências
  alternative: retidão em uma ou ambas; vindicação na segunda
  rationale: Manter o mesmo termo preserva a repetição e a tensão do original. A nota registra a possível nuance de vindicação na segunda ocorrência sem impô-la ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação proverbial é concisa; “quem” representa naturalmente o sujeito genérico, e a repetição de “justiça” conserva a estrutura do hebraico.
