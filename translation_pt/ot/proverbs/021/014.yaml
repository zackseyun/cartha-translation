  text: מַתָּ֣ן בַּ֭/סֵּתֶר יִכְפֶּה אָ֑ף וְ/שֹׁ֥חַד בַּ֝/חֵ֗ק חֵמָ֥ה עַזָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/014.yaml
  text: A gift in secret subdues anger[a], and a bribe in the bosom, fierce wrath.
translation:
  language: pt
  text: 'Um presente em segredo abranda a ira,

    e um suborno no colo[a], a fúria intensa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao peito”. A imagem hebraica é de algo oculto nas dobras da roupa, enfatizando o segredo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: presente
  rationale: Designa um presente ou dádiva; “presente” é natural em português e mantém a distinção em relação ao termo explicitamente negativo “suborno” no segundo verso.
- source_word: בַּסֵּתֶר
  choice: dado em segredo
  rationale: Expressa o caráter oculto da entrega de modo claro e natural, preservando a ideia locativa do hebraico.
- source_word: יִכְפֶּה
  choice: acalma
  rationale: No contexto, indica conter, abrandar ou apaziguar a ira; “acalma” comunica o efeito sem afirmar necessariamente sua eliminação completa.
- source_word: אָף
  choice: ira
  rationale: Embora o sentido concreto seja “nariz”, trata-se do conhecido uso idiomático hebraico para ira.
- source_word: שֹׁחַד
  choice: suborno
  rationale: O termo costuma indicar pagamento corruptor ou ilícito, devendo permanecer distinto do “presente” do primeiro verso.
- source_word: בַּחֵק
  choice: escondido no colo
  rationale: O hebraico retrata algo colocado no colo ou junto ao peito, nas dobras da roupa; a inclusão de “escondido” torna explícita a função contextual da imagem.
- source_word: חֵמָה עַזָּה
  choice: fúria intensa
  rationale: Preserva o aumento de força em relação a “ira” no primeiro verso e reproduz a intensificação do substantivo pelo adjetivo.
theological_decisions:
- issue: Possível aparência de aprovação do suborno
  choice: Traduzir descritivamente, sem acrescentar condenação ou aprovação moral
  alternative: Acrescentar linguagem que condene explicitamente a prática
  rationale: O provérbio descreve o efeito de presentes secretos e subornos sobre a ira; a tradução deve preservar essa tensão sem inserir uma avaliação que não está expressa neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo compacto. “No colo” preserva a imagem concreta do hebraico, enquanto a nota esclarece o costume implícito.
