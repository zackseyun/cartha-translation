  text: עֵד כְּזָבִ֥ים יֹאבֵ֑ד וְ/אִ֥ישׁ שׁ֝וֹמֵ֗עַ לָ/נֶ֥צַח יְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/028.yaml
  text: A false witness will perish[a], but a man who listens will speak forever.
translation:
  language: pt
  text: A testemunha falsa perecerá, mas o homem que escuta falará para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falará continuamente” ou “falará com efeito duradouro”. A expressão hebraica traduzida por “para sempre” provavelmente destaca a validade duradoura do que é dito, e não uma duração infinita em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד כְּזָבִים
  choice: a testemunha falsa
  rationale: A construção hebraica significa literalmente “testemunha de mentiras”. “Testemunha falsa” é a forma natural em português e preserva o contexto forense.
- source_word: יֹאבֵד
  choice: perecerá
  rationale: O verbo pode significar perecer, ser destruído ou desaparecer. “Perecerá” mantém a concisão e não especifica indevidamente a forma da ruína.
- source_word: וְאִישׁ
  choice: mas o homem
  rationale: A conjunção introduz contraste, e אִישׁ é um substantivo masculino singular. “O homem” preserva a forma do hebraico e seu valor representativo no provérbio.
- source_word: שׁוֹמֵעַ
  choice: que escuta
  rationale: O particípio pode significar ouvir, escutar ou obedecer. No contraste com a testemunha falsa, “escuta” sugere atenção cuidadosa antes de falar sem impor explicitamente o sentido de obediência.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: A expressão pode indicar perpetuidade, continuidade ou validade duradoura. “Para sempre” reproduz de modo compacto a força do hebraico, enquanto a nota registra as nuances possíveis.
- source_word: יְדַבֵּר
  choice: falará
  rationale: O imperfeito de דבר significa “falar”. O futuro simples mantém a estrutura proverbial, deixando que לָנֶצַח expresse a duração ou o efeito permanente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação preserva o paralelismo conciso e a ambiguidade de לָנֶצַח. O marcador foi colocado após “para sempre”, expressão à qual a nota se refere.
