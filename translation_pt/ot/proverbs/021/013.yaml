source:
  edition: WLC
  text: אֹטֵ֣ם אָ֭זְנ/וֹ מִ/זַּעֲקַת דָּ֑ל גַּֽם ה֥וּא יִ֝קְרָ֗א וְ/לֹ֣א יֵעָנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/013.yaml
  text: Whoever shuts his ear to the cry of the poor will also call out and not be answered[a].
translation:
  language: pt
  text: Quem fecha o ouvido ao clamor do pobre[a] também clamará e não terá resposta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fraco” ou “necessitado”. O termo hebraico דָּל pode indicar uma pessoa pobre, fraca ou socialmente vulnerável.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹטֵם
  choice: fecha
  rationale: O particípio qal descreve a ação deliberada de fechar ou tapar. “Fecha” é natural em português e, com “o ouvido”, comunica a recusa consciente de escutar.
- source_word: אָזְנוֹ
  choice: o ouvido
  rationale: O hebraico traz o singular com sufixo masculino. A expressão portuguesa “fechar o ouvido” preserva a imagem concreta e funciona de modo genérico no contexto proverbial.
- source_word: מִזַּעֲקַת
  choice: ao clamor de
  rationale: Com אטם אזן, a preposição indica aquilo que a pessoa se recusa a ouvir. “Ao clamor de” é idiomático e mantém a força de um pedido urgente de socorro.
- source_word: דָּל
  choice: o pobre
  rationale: דָּל pode designar alguém pobre, fraco, necessitado ou socialmente vulnerável. “O pobre” é claro e tradicional no contexto sapiencial; a nota preserva a extensão semântica.
- source_word: גַּם הוּא
  choice: também
  rationale: 'O advérbio mantém a reciprocidade enfática: aquele que não escuta se verá, por sua vez, sem resposta. Em português, não é necessário explicitar um pronome masculino para conservar essa relação.'
- source_word: יִקְרָא
  choice: clamará
  rationale: O verbo significa chamar ou clamar. “Clamará” cria uma correspondência natural com “clamor” e conserva a urgência, sem especificar a quem se dirige o apelo.
- source_word: וְלֹא יֵעָנֶה
  choice: e não terá resposta
  rationale: O nifal expressa a ideia passiva de não ser respondido. “Não terá resposta” é português natural, mantém o resultado passivo e não identifica quem deixa de responder.
theological_decisions:
- issue: Agente implícito da falta de resposta
  choice: Deixar sem identificação quem não responderá.
  alternative: Explicitar que Deus, ou outras pessoas, não responderão.
  rationale: O hebraico não nomeia o agente de יֵעָנֶה. Embora o contexto possa sugerir justiça divina, explicitar Deus ou seres humanos resolveria uma ambiguidade mantida pelo texto.
- issue: Masculino singular genérico
  choice: Usar a construção genérica “Quem...” sem acrescentar pronome.
  alternative: Explicitar “ele também” ou reformular no plural inclusivo.
  rationale: As formas hebraicas são masculinas singulares e representativas. A construção portuguesa “Quem... também...” é igualmente genérica, preserva o singular e evita uma repetição pouco natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo entre “clamor” e “clamará” e preserva a ambiguidade quanto a quem deixará de responder.
