source:
  edition: WLC
  text: אִ֣ישׁ מַ֭חְסוֹר אֹהֵ֣ב שִׂמְחָ֑ה אֹהֵ֥ב יַֽיִן וָ֝/שֶׁ֗מֶן לֹ֣א יַעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/017.yaml
  text: A man who loves pleasure will become poor[b][a]; whoever loves wine and oil will not become rich.
translation:
  language: pt
  text: Quem ama os prazeres[a] passará necessidade; quem ama o vinho e o azeite[b] não enriquecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a alegria» ou «as festas». O termo hebraico pode indicar alegria ou celebração, mas aqui provavelmente se refere a uma vida dedicada aos prazeres.
    reason: lexical_alternative
  - marker: b
    text: O termo se refere ao óleo, normalmente azeite de oliva. Neste contexto, pode sugerir luxo ou unguentos caros, e não apenas um alimento básico.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ מַחְסוֹר
  choice: Quem ... passará necessidade
  rationale: A expressão nominal hebraica descreve literalmente um «homem de carência». Em português proverbial, «quem ... passará necessidade» comunica com naturalidade o resultado implícito, sem restringir a máxima aos homens nem ampliar a ideia para além da falta material.
- source_word: אֹהֵב שִׂמְחָה
  choice: ama os prazeres
  rationale: שִׂמְחָה pode indicar alegria, regozijo ou festa. Neste paralelismo com vinho e azeite, «os prazeres» expressa melhor o estilo de vida voltado à diversão e ao consumo, sem afirmar que a alegria em si seja condenada.
- source_word: אֹהֵב יַיִן וָשֶׁמֶן
  choice: ama o vinho e o azeite
  rationale: יַיִן é «vinho», e שֶׁמֶן designa óleo, normalmente azeite de oliva. «Azeite» preserva a imagem concreta e é mais natural em português; no contexto, o par sugere consumo requintado ou luxuoso.
- source_word: לֹא יַעֲשִׁיר
  choice: não enriquecerá
  rationale: 'A forma verbal de עשר tem aqui sentido resultativo e intransitivo: não chegar a ser rico. «Não enriquecerá» é conciso e mantém a referência específica à riqueza.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo equilibrado. «Quem» conserva a aplicação geral da máxima; «passará necessidade» evita a formulação pouco natural «será um homem de carência». Os marcadores foram posicionados junto aos termos que explicam.
