  text: אֵ֣ין חָ֭כְמָה וְ/אֵ֣ין תְּבוּנָ֑ה וְ/אֵ֥ין עֵ֝צָ֗ה לְ/נֶ֣גֶד יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/030.yaml
  text: There is no wisdom[a], no understanding, and no counsel against Yahweh.
translation:
  language: pt
  text: Não há sabedoria, nem entendimento, nem conselho contra Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de Yahweh” ou “na presença de Yahweh”. A expressão hebraica pode indicar algo posto diante de alguém, mas aqui provavelmente tem o sentido de oposição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: não há ... nem ... nem
  rationale: A negação existencial hebraica se repete diante dos três substantivos. Em português, “não há” seguido de “nem” preserva a ênfase cumulativa sem soar artificial.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente corrente no contexto de Provérbios e expressa sabedoria prática e hábil.
- source_word: תְּבוּנָה
  choice: entendimento
  rationale: Mantém a distinção em relação a “sabedoria” e comunica a capacidade de compreender e discernir.
- source_word: עֵצָה
  choice: conselho
  rationale: Abrange conselho e deliberação estratégica, completando a progressão dos três termos sapienciais.
- source_word: לְנֶגֶד
  choice: que possa se opor a
  rationale: No contexto, a expressão indica oposição, não apenas posição espacial. A formulação explicita naturalmente em português que nenhuma sabedoria, compreensão ou estratégia consegue enfrentar Yahweh com êxito, sem declarar além do hebraico que elas não existam em sentido absoluto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva de forma transliterada, sem o trocar pelo título “Senhor”.
- issue: Sentido de לְנֶגֶד יְהוָה
  choice: que possa se opor a Yahweh
  alternative: diante de Yahweh; na presença de Yahweh
  rationale: A construção pode ter valor espacial, mas neste provérbio a leitura adversativa se ajusta melhor à afirmação de que sabedoria, entendimento e conselho não podem resistir a Yahweh. A nota conserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação com “nem” preserva o ritmo proverbial; “que possa se opor” torna explícita a relação sintática implícita no hebraico.
