  text: רוּם עֵ֭ינַיִם וּ/רְחַב לֵ֑ב נִ֖ר רְשָׁעִ֣ים חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/004.yaml
  text: Haughty eyes and a proud heart— the lamp of the wicked— are sin[a].
translation:
  language: pt
  text: Olhos arrogantes e coração orgulhoso — a lâmpada dos perversos — são pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cultivo dos perversos é pecado”; também se pode entender “a lavoura” ou “o terreno não cultivado dos perversos”. A palavra hebraica traduzida como “lâmpada” também pode ser interpretada em sentido agrícola.'
    reason: alternative_reading
lexical_decisions:
- source_word: רוּם עֵינַיִם
  choice: Olhos arrogantes
  rationale: A expressão literalmente ligada à altura dos olhos é uma metáfora de soberba. “Olhos arrogantes” é natural em português e preserva a imagem corporal.
- source_word: וּרְחַב לֵב
  choice: coração orgulhoso
  rationale: Embora רְחַב signifique literalmente “largo”, aqui a largura do coração indica exaltação pessoal, não generosidade. A formulação comunica o sentido moral com clareza.
- source_word: נִר
  choice: lâmpada
  rationale: A forma admite a leitura “lâmpada”, que produz uma afirmação coerente sobre aquilo que orienta ou caracteriza os perversos. A possível interpretação agrícola é mantida em nota.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Termo corrente na literatura sapiencial para pessoas moralmente culpadas. “Os perversos” conserva a designação coletiva e tem registro digno e acessível.
- source_word: חַטָּאת
  choice: são pecado
  rationale: Mantém a força nominal de חַטָּאת, em vez de reduzi-la ao adjetivo “pecaminosos”. O plural concorda naturalmente com “olhos” e “coração”, embora a construção hebraica seja compacta e permita entender toda a caracterização como uma unidade.
theological_decisions:
- issue: Interpretação de נִר רְשָׁעִים
  choice: a lâmpada dos perversos
  alternative: o cultivo dos perversos / a lavoura dos perversos / o terreno não cultivado dos perversos
  rationale: A questão é lexical e contextual, mas altera substancialmente o sentido do provérbio. A leitura “lâmpada” é tradicional e se ajusta ao foco na disposição arrogante; a leitura agrícola também é plausível e, por isso, não é suprimida, mas registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A pontuação com travessões conserva a aposição compacta e a tensão interpretativa do hebraico sem explicá-la no corpo do versículo.
