  text: שֹׁמֵ֣ר פִּ֭י/ו וּ/לְשׁוֹנ֑/וֹ שֹׁמֵ֖ר מִ/צָּר֣וֹת נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/023.yaml
  text: Whoever guards his mouth and his tongue guards his life from troubles[a].
translation:
  language: pt
  text: Quem guarda a boca e a língua guarda a própria vida das aflições.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guarda a si mesmo das angústias”. Em hebraico, literalmente: “guarda sua néfesh das aflições”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: guarda
  rationale: O particípio qal expressa a ação habitual de vigiar ou proteger. “Guarda” é natural em português nos dois usos do verbo e preserva sua repetição no hebraico.
- source_word: פִּיו
  choice: a boca
  rationale: Tradução direta do substantivo com sufixo possessivo; em português, o possessivo pode ficar implícito porque o sujeito já está claro.
- source_word: וּלְשׁוֹנוֹ
  choice: e a língua
  rationale: Mantém a imagem hebraica em que a língua representa a fala. A preposição לְ faz parte da construção verbal e não precisa ser reproduzida separadamente em português.
- source_word: מִצָּרוֹת
  choice: das aflições
  rationale: O plural צָרוֹת abrange situações de aperto, angústia ou dificuldade. “Aflições” preserva essa amplitude e se combina naturalmente com “guardar ... de”.
- source_word: נַפְשׁוֹ
  choice: a própria vida
  rationale: Neste contexto sapiencial, נֶפֶשׁ indica a vida ou a própria pessoa, não necessariamente uma “alma” imaterial. “A própria vida” comunica o sentido idiomático e explicita naturalmente a referência ao sujeito.
theological_decisions:
- issue: Sentido de נַפְשׁוֹ
  choice: a própria vida
  alternative: a si mesmo; a sua alma
  rationale: O provérbio trata das consequências práticas da fala. “Vida” respeita o campo semântico de נֶפֶשׁ sem impor uma definição doutrinária da constituição humana; a nota preserva a alternativa reflexiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “guarda” reproduz a estrutura enfática e causal do hebraico; os possessivos de “boca” e “língua” foram omitidos por naturalidade, sem perda de sentido.
