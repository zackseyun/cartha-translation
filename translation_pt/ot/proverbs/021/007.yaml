  text: The violence of the wicked will drag them away[a], because they refuse to do justice.
translation:
  language: pt
  text: A violência dos perversos os arrastará[a], porque se recusam a praticar a justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O saque dos perversos os varrerá.” O verbo hebraico é difícil, e os intérpretes divergem quanto a se a ênfase recai sobre violência, saque, terror ou sobre serem levados pela própria maldade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁד
  choice: violência
  rationale: O termo pode indicar destruição violenta, devastação ou saque. No paralelismo com a recusa em praticar a justiça, “violência” expressa de modo natural a conduta destrutiva dos perversos sem restringi-la ao roubo.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Designa pessoas moralmente culpadas. “Os perversos” é conciso, corrente em linguagem proverbial e amplamente inteligível em português.
- source_word: יְגוֹרֵם
  choice: os arrastará
  rationale: A forma verbal é difícil. Em contexto, pode retratar a própria violência dos perversos levando-os à ruína. “Os arrastará” preserva tanto o sufixo pronominal como a imagem de uma consequência que os leva à força.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da afirmação anterior e mantém clara a relação causal.
- source_word: מֵאֲנוּ
  choice: se recusam
  rationale: O verbo significa recusar. O presente expressa adequadamente uma conduta habitual no estilo atemporal do provérbio.
- source_word: לַעֲשׂוֹת
  choice: a praticar
  rationale: Embora literalmente seja “fazer”, “praticar” forma em português uma combinação natural com “justiça” e destaca a conduta ética.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto, refere-se à ação justa, não apenas a uma sentença judicial. “Praticar a justiça” comunica essa dimensão ética e social.
