  yaml_path: translation/ot/proverbs/021/005.yaml
  text: The plans of the diligent surely lead to abundance[c][b][a], but everyone who is hasty surely comes to want.
translation:
  language: pt
  text: Os planos de quem é diligente certamente levam à abundância[a], mas todo o que se apressa[b] certamente acaba em carência[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao lucro” ou “ao excedente”; o termo hebraico pode indicar abundância, vantagem ou ganho.
    reason: lexical_alternative
  - marker: b
    text: Ou “quem se precipita”; o termo hebraico enfatiza a pressa impetuosa ou precipitada, e não apenas a rapidez.
    reason: lexical_alternative
  - marker: c
    text: Ou “acaba na pobreza”; o hebraico pode se referir de modo amplo à falta, à necessidade, à carência ou ao empobrecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: planos
  rationale: No contexto sapiencial, o substantivo indica projetos ou intenções deliberadas, não meros pensamentos.
- source_word: חָרוּץ
  choice: quem é diligente
  rationale: Expressa a pessoa laboriosa e aplicada em linguagem natural, atual e inclusiva quanto ao gênero.
- source_word: אַךְ
  choice: certamente
  rationale: Nas duas metades do provérbio, marca ênfase e a segurança do resultado, mais que exclusão.
- source_word: לְמוֹתָר
  choice: levam à abundância
  rationale: מוֹתָר pode indicar excedente, vantagem ou ganho; “abundância” forma uma antítese concreta com a necessidade, e “levam a” explicita naturalmente a relação de resultado indicada pelo לְ.
- source_word: וְכָל
  choice: mas todo aquele que
  rationale: Embora וְ seja formalmente “e”, o paralelismo antitético favorece “mas”; כָל dá sentido distributivo e abrangente.
- source_word: אָץ
  choice: se apressa
  rationale: O particípio descreve quem age com pressa ou precipitação; a forma verbal preserva o caráter ativo do hebraico sem restringi-lo à impaciência.
- source_word: לְמַחְסוֹר
  choice: acaba na necessidade
  rationale: מַחְסוֹר abrange falta, carência e pobreza. “Necessidade” preserva essa amplitude, enquanto “acaba” comunica o resultado.
theological_decisions: []
