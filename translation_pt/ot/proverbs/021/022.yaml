translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Avança contra” comunica o uso militar de “subir”, e “fortaleza” torna concreta a imagem defensiva, enquanto a nota preserva a formulação mais literal e a referência gramatical ambígua.
