  text: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
translation:
  language: pt
  text: O sábio avança contra a cidade dos guerreiros e derruba a fortaleza em que ela confia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O sábio sobe contra a cidade dos guerreiros e derruba a força de sua confiança [ou segurança].” O hebraico também pode ser traduzido por “força” ou “poder”, em vez de “fortaleza”. O sufixo em “sua confiança” é feminino singular e provavelmente se refere à cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: cidade
  rationale: É o sentido básico do substantivo e se ajusta naturalmente ao contexto militar de uma cidade defendida.
- source_word: גִּבֹּרִים
  choice: guerreiros
  rationale: O termo designa homens fortes ou valentes e frequentemente tem conotação militar; “guerreiros” comunica essa força de modo natural em português.
- source_word: עָלָה
  choice: avança contra
  rationale: Literalmente, “sobe”, mas em contexto militar pode descrever o avanço contra uma cidade. A formulação conserva o movimento e explicita a relação hostil sem reduzir o verbo simplesmente a “ataca”.
- source_word: חָכָם
  choice: o sábio
  rationale: O adjetivo substantivado singular expressa a figura proverbial da pessoa sábia; “o sábio” é corrente, digno e preserva a forma masculina do hebraico.
- source_word: וַיֹּרֶד
  choice: e derruba
  rationale: A forma causativa significa fazer descer. No quadro de conquista das defesas, “derruba” é idiomático e vigoroso.
- source_word: עֹז
  choice: a fortaleza
  rationale: Embora עֹז normalmente signifique “força” ou “poder”, aqui o contexto militar favorece uma concretização como aquilo que proporciona defesa e segurança. A alternativa mais literal é preservada em nota.
- source_word: מִבְטֶחָה
  choice: em que eles confiam
  rationale: O substantivo expressa confiança ou segurança, com sufixo feminino singular que retoma a cidade. Em português, a oração explicita naturalmente que essa força defensiva é o objeto da confiança dos guerreiros.
