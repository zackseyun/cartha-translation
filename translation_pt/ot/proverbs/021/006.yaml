  text: פֹּ֣עַל א֭וֹצָרוֹת בִּ/לְשׁ֣וֹן שָׁ֑קֶר הֶ֥בֶל נִ֝דָּ֗ף מְבַקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/006.yaml
  text: The getting of treasures by a lying tongue is a fleeting vapor[c][b][a], a snare of those who seek death.
translation:
  language: pt
  text: Acumular tesouros com uma língua mentirosa é vapor levado pelo vento[a]; quem os busca procura a morte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “vapor impelido” ou “vapor que se dissipa”.'
    reason: lexical_alternative
  - marker: b
    text: A frase hebraica final é difícil e diz literalmente “os que buscam a morte”. Também pode ser entendida como “os que obtêm tais riquezas buscam a morte”. Algumas traduções, influenciadas por versões antigas, trazem “um laço de morte”.
    reason: alternative_reading
lexical_decisions:
- source_word: פֹּעַל אֹצָרוֹת
  choice: Acumular tesouros
  rationale: פֹּעַל pode indicar obra, atividade ou resultado. No contexto, a expressão nominal descreve o processo de obter ou ajuntar riquezas; “acumular tesouros” é natural em português e conserva a imagem concreta.
- source_word: בִּלְשׁוֹן שָׁקֶר
  choice: com uma língua mentirosa
  rationale: A expressão significa literalmente “com/por uma língua de falsidade”. A tradução mantém a metáfora corporal e apresenta a língua mentirosa como o meio empregado para obter riqueza.
- source_word: הֶבֶל נִדָּף
  choice: vapor levado pelo vento
  rationale: הֶבֶל designa vapor, sopro ou algo inconsistente, e נִדָּף significa “impelido/levado”. A formulação preserva tanto a imagem quanto a ideia de transitoriedade.
- source_word: מְבַקְשֵׁי מָוֶת
  choice: quem os busca procura a morte
  rationale: O hebraico traz literalmente “os que buscam a morte”, numa sequência sintaticamente difícil. A formulação portuguesa entende que os que procuram tais tesouros, na realidade, procuram a morte, sem substituir o texto massorético pela leitura “laço de morte”.
theological_decisions:
- issue: Sentido da frase final מְבַקְשֵׁי מָוֶת
  choice: Os que buscam esses tesouros fraudulentos estão procurando a morte.
  alternative: “buscadores da morte”; ou “um laço de morte”, conforme uma leitura influenciada por versões antigas.
  rationale: O texto massorético contém “os que buscam a morte”, mas sua relação sintática com a frase anterior é incerta. O texto principal oferece uma leitura coerente e mantém a consequência fatal da fraude; a nota registra a dificuldade e evita apresentar como inequívoca uma interpretação disputada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das imagens hebraicas foi mantida, e a difícil frase final recebeu uma tradução idiomática acompanhada de nota que preserva as principais possibilidades textuais e sintáticas.
