source:
  edition: WLC
  text: מַשְׂכִּ֣יל צַ֭דִּיק לְ/בֵ֣ית רָשָׁ֑ע מְסַלֵּ֖ף רְשָׁעִ֣ים לָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/012.yaml
  text: The righteous one considers the house of the wicked[a], bringing the wicked to ruin.
translation:
  language: pt
  text: O justo observa atentamente a casa do perverso[a], levando os perversos à ruína.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Justo observa atentamente a casa do perverso; ele leva os perversos à ruína”, entendendo que o sujeito é Deus, e não uma pessoa justa.'
    reason: Leitura alternativa possível para a identidade do sujeito implícito.
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: observa atentamente
  rationale: O particípio hifil de שכל expressa ação guiada por discernimento ou consideração cuidadosa. “Observa atentamente” comunica essa atenção perspicaz em português natural, sem reduzir o sentido a mero olhar.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo masculino singular substantivado retrata uma figura representativa. “O justo” preserva a forma singular e o estilo conciso de Provérbios.
- source_word: לְבֵית רָשָׁע
  choice: a casa do perverso
  rationale: בַּיִת pode designar tanto a casa quanto a família ou os bens domésticos. “Casa” mantém a imagem direta e deixa aberta essa extensão de sentido; רָשָׁע permanece singular.
- source_word: מְסַלֵּף
  choice: levando ... à ruína
  rationale: O verbo סלף pode significar virar, transtornar ou arruinar. A construção escolhida expressa a ação e seu resultado, além de conservar a compactação entre as duas orações participiais.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo masculino plural substantivado é vertido como designação genérica e concisa das pessoas perversas.
- source_word: לָרָע
  choice: à ruína
  rationale: Embora רַע também signifique “mal”, aqui a preposição e o contexto favorecem um desfecho calamitoso. “À ruína” evita sugerir que o sujeito torna essas pessoas moralmente más.
theological_decisions:
- issue: Identidade do sujeito num provérbio sintaticamente condensado
  choice: “O justo” é o sujeito humano genérico das duas partes do versículo.
  alternative: '“O Justo” designa Deus: “O Justo observa atentamente a casa do perverso; ele leva os perversos à ruína.”'
  rationale: O hebraico não traz um nome ou título divino explícito. A leitura gramatical mais direta toma צַדִּיק como uma pessoa justa e mantém o mesmo sujeito no segundo particípio. Contudo, como a ação de arruinar os perversos pode ser entendida como juízo divino, a leitura referente a Deus é genuinamente possível e foi preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com concisão proverbial. “Perverso” distingue a categoria moral de uma simples pessoa que pratica ocasionalmente algo errado. A construção com gerúndio evita inserir no texto principal um pronome que não aparece no hebraico e mantém unidas as duas ações.
