  text: הֲפַכְפַּ֬ךְ דֶּ֣רֶךְ אִ֣ישׁ וָזָ֑ר וְ֝/זַ֗ךְ יָשָׁ֥ר פָּעֳלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/008.yaml
  text: The way of a guilty man is crooked and strange[a], but the conduct of the pure is upright.
translation:
  language: pt
  text: O caminho do homem culpado é tortuoso e estranho[a], mas a conduta de quem é puro é reta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O caminho de um homem é tortuoso e estranho”. O termo hebraico traduzido como “culpado” é difícil e também pode ter o sentido de “estranho”, “estrangeiro” ou “alheio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲפַכְפַּךְ
  choice: tortuoso
  rationale: O adjetivo descreve algo retorcido ou distorcido. “Tortuoso” preserva a metáfora do caminho e contrasta naturalmente com “correta” no segundo hemistíquio.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Termo sapiencial comum para o modo ou rumo de vida de alguém; mantém a metáfora hebraica.
- source_word: אִישׁ
  choice: homem
  rationale: O substantivo hebraico está no masculino singular e a formulação proverbial admite a tradução direta.
- source_word: וָזָר
  choice: culpado
  rationale: A forma é difícil e pode significar “estranho”, “estrangeiro” ou “alheio”. No contraste ético com זַךְ, “culpado” expressa uma leitura contextual plausível, sem ocultar a incerteza, registrada em nota.
- source_word: זַךְ
  choice: puro
  rationale: No contexto ético de Provérbios, indica pureza ou integridade moral.
- source_word: יָשָׁר
  choice: correta
  rationale: O adjetivo denota o que é reto ou direito. Aplicado a “conduta”, “correta” soa natural em português e conserva o contraste com o caminho tortuoso.
- source_word: פָּעֳלוֹ
  choice: conduta
  rationale: Embora possa significar “obra”, “ação” ou “feito”, aqui “conduta” forma um paralelo natural com o caminho de vida mencionado na primeira linha.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura antitética e a metáfora sapiencial do caminho foram preservadas; a dificuldade lexical de וָזָר foi explicitada em nota.
