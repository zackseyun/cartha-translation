id: PRO.21.1
reference: Proverbs 21:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/001.yaml
  text: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
translation:
  language: pt
  text: O coração de um rei é como canais de água[a] na mão de Yahweh; ele o dirige para onde deseja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correntes de água” ou “cursos de água”. A imagem hebraica é de águas divididas em canais que podem ser direcionados.
    reason: lexical_alternative
  - marker: b
    text: Ou “lhe agrada” ou “quer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: canais de água
  rationale: A expressão designa cursos ou canais de água divididos e dirigíveis, evocando provavelmente a irrigação. “Canais de água” mantém a imagem que prepara o verbo final.
- source_word: לֶב מֶלֶךְ
  choice: o coração de um rei
  rationale: A construção expressa uma verdade proverbial geral sobre qualquer rei. “Coração” preserva o sentido hebraico amplo de interioridade, disposição, pensamento e vontade.
- source_word: בְּיַד יְהוָה
  choice: na mão de Yahweh
  rationale: Mantém o idioma concreto de estar sob o poder e controle de alguém, sem reduzi-lo a mera orientação. O nome divino é transliterado como “Yahweh”.
- source_word: עַל כָּל אֲשֶׁר
  choice: para onde
  rationale: Com o verbo de inclinar ou dirigir, a expressão indica qualquer direção ou destino escolhido. “Para onde” é natural em português e se harmoniza com a imagem dos canais.
- source_word: יַחְפֹּץ
  choice: deseja
  rationale: חפץ pode expressar desejo, agrado ou vontade. “Deseja” é claro e não acrescenta uma formulação filosófica mais forte que o hebraico.
- source_word: יַטֶּנּוּ
  choice: ele o dirige
  rationale: O hifil de נטה significa inclinar, voltar ou dirigir. “Dirige” funciona naturalmente com canais de água; o pronome “o” retoma explicitamente “o coração”.
theological_decisions:
- issue: Soberania divina sobre os governantes
  choice: A tradução afirma que Yahweh tem controle real sobre a disposição e a direção interior de um rei.
  alternative: Traduzir de modo a afirmar determinismo exaustivo, ou enfraquecer a frase para indicar somente conselho ou influência.
  rationale: A imagem do coração na mão de Yahweh e a ação de dirigi-lo são fortes, mas o provérbio não define um modelo filosófico de providência nem explica a relação entre soberania divina e responsabilidade humana.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura proverbial é concisa; a metáfora concreta e o nome divino foram preservados.
