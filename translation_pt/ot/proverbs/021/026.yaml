  text: כָּל הַ֭/יּוֹם הִתְאַוָּ֣ה תַאֲוָ֑ה וְ/צַדִּ֥יק יִ֝תֵּ֗ן וְ/לֹ֣א יַחְשֹֽׂךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/026.yaml
  text: All day long he craves greedily[b][a], but the righteous gives and does not hold back.
translation:
  language: pt
  text: O dia inteiro, ele deseja ardentemente[a], mas o justo[b] dá e não retém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente, “deseja um desejo”. O hebraico emprega um verbo e um substantivo da mesma raiz para dar ênfase; também se pode traduzir: “não para de desejar”.'
    reason: lexical_alternative
  - marker: b
    text: “O justo” está no masculino singular em hebraico, mas funciona aqui como singular representativo; o provérbio descreve, de modo geral, o caráter de uma pessoa justa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: O dia inteiro
  rationale: Expressão temporal idiomática que conserva o sentido de duração contínua ao longo do dia.
- source_word: הִתְאַוָּה תַאֲוָה
  choice: deseja ardentemente[a]
  rationale: O verbo seguido de um substantivo cognato intensifica o desejo. A formulação comunica essa ênfase em português natural sem especificar um objeto que o hebraico deixa indeterminado.
- source_word: צַדִּיק
  choice: o justo[b]
  rationale: Adjetivo substantivado masculino singular, usado proverbialmente como representante de qualquer pessoa justa.
- source_word: יִתֵּן
  choice: dá
  rationale: O imperfeito tem força habitual no provérbio; o presente simples reproduz esse caráter geral sem acrescentar uma qualificação à maneira de dar.
- source_word: לֹא יַחְשֹׂךְ
  choice: não retém
  rationale: Traduz diretamente a ideia de não guardar ou recusar aquilo que poderia ser dado, preservando o contraste com o desejo incessante da primeira oração.
theological_decisions: []
