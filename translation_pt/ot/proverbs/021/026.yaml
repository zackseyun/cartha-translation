  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A repetição cognata do hebraico é comunicada no texto por um intensificador e explicitada em nota; a estrutura contrastiva e a generalidade do desejo permanecem intactas.
