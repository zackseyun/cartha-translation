  text: כֹּ֣פֶר לַ/צַּדִּ֣יק רָשָׁ֑ע וְ/תַ֖חַת יְשָׁרִ֣ים בּוֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/018.yaml
  text: The wicked is a ransom for the righteous[a], and the treacherous one in place of the upright.
translation:
  language: pt
  text: O perverso serve de resgate pelo justo[a], e o desleal, em lugar dos íntegros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O perverso é dado em lugar do justo, e o desleal em lugar dos íntegros.”'
    reason: Alternativa lexical que torna explícito o sentido substitutivo de כֹּפֶר, sem pressupor necessariamente um pagamento literal.
lexical_decisions:
- source_word: כֹּפֶר
  choice: resgate
  rationale: O termo designa preço de resgate ou compensação oferecida em lugar de alguém. “Resgate” preserva de modo conciso a metáfora substitutiva.
- source_word: לַצַּדִּיק
  choice: pelo justo
  rationale: A preposição ל indica aqui a pessoa em favor de quem, ou em lugar de quem, se dá o resgate. “Pelo justo” é natural em português e mantém o singular genérico proverbial.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O substantivo/adjetivo singular funciona como categoria moral genérica. “O perverso” estabelece com clareza o contraste com “o justo”.
- source_word: וְתַחַת
  choice: e ... em lugar de
  rationale: תַּחַת expressa substituição neste paralelismo, não posição espacial. “Em lugar de” explicita naturalmente essa relação.
- source_word: יְשָׁרִים
  choice: os íntegros
  rationale: O plural se refere aos moralmente retos. “Íntegros” comunica essa qualidade ética em português atual e digno.
- source_word: בּוֹגֵד
  choice: o desleal
  rationale: בּוֹגֵד descreve quem age com perfídia ou quebra de fidelidade. “Desleal” preserva a amplitude moral sem restringir o sentido a traição política.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A formulação preserva o caráter proverbial e a tensão da imagem de substituição, sem explicar o mecanismo pelo qual o perverso ocupa o lugar do justo.
