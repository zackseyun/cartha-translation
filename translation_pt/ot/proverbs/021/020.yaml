  text: אוֹצָ֤ר נֶחְמָ֣ד וָ֭/שֶׁמֶן בִּ/נְוֵ֣ה חָכָ֑ם וּ/כְסִ֖יל אָדָ֣ם יְבַלְּעֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/020.yaml
  text: Precious treasure and oil are in the dwelling of a wise man[a], but a foolish man swallows them up.
translation:
  language: pt
  text: Tesouro precioso e óleo há na morada do sábio, mas o homem insensato devora isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “o engole”. O pronome hebraico está no singular e pode se referir ao estoque como um todo; o verbo retrata vividamente o consumo imprudente dos recursos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹצָר נֶחְמָד
  choice: tesouro precioso
  rationale: אוֹצָר designa riqueza ou bens armazenados, e נֶחְמָד os caracteriza como valiosos ou desejáveis. A expressão natural em português preserva tanto o valor quanto a ideia de reserva.
- source_word: וָשֶׁמֶן
  choice: e óleo
  rationale: שֶׁמֶן frequentemente se refere a azeite, mas o hebraico não o especifica aqui; “óleo” mantém a generalidade do texto e a imagem de uma provisão doméstica valiosa.
- source_word: בִּנְוֵה חָכָם
  choice: na morada do sábio
  rationale: נָוֶה indica habitação ou morada. “Morada” conserva o tom proverbial digno, enquanto “do sábio” expressa naturalmente o adjetivo substantivado masculino singular.
- source_word: וּכְסִיל אָדָם
  choice: mas o homem insensato
  rationale: כְּסִיל é o termo sapiencial recorrente para alguém moral e praticamente insensato, e אָדָם explicita o tipo humano. A formulação mantém o masculino singular representativo do hebraico.
- source_word: יְבַלְּעֶנּוּ
  choice: os devora
  rationale: O verbo בלע significa literalmente “engolir” e, no contexto, retrata o consumo imprudente das provisões. “Devora” conserva a força da imagem e admite como objeto conjunto “tesouro precioso e óleo”; a forma hebraica pronominal singular pode tratar essa reserva como um todo.
theological_decisions:
- issue: Antropologia proverbial marcada pelo masculino em חָכָם ... כְסִיל אָדָם
  choice: “do sábio ... o homem insensato”
  alternative: “da pessoa sábia ... a pessoa insensata” ou “dos sábios ... o insensato”
  rationale: O hebraico emprega formas masculinas singulares para tipos humanos representativos. A tradução preserva essa forma sem restringir a aplicação do provérbio apenas aos homens.
- issue: Número do objeto pronominal em יְבַלְּעֶנּוּ
  choice: “os devora”
  alternative: “o devora”
  rationale: Embora o sufixo hebraico seja singular e possa conceber a provisão como um conjunto, o português pede naturalmente o plural para retomar os dois elementos coordenados, “tesouro precioso e óleo”. A nota registra a imagem literal e a possível compreensão coletiva.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Morada” mantém leve formalidade sem soar arcaico; “devora” comunica de modo natural a metáfora forte do hebraico.
