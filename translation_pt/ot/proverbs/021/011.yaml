source:
  edition: WLC
  text: בַּ/עְנָשׁ לֵ֭ץ יֶחְכַּם פֶּ֑תִי וּ/בְ/הַשְׂכִּ֥יל לְ֝/חָכָ֗ם יִקַּח דָּֽעַת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/011.yaml
  text: When a scoffer is punished[a], the simple become wise; and when a wise man is instructed[b], he gains knowledge.
translation:
  language: pt
  text: Quando o zombador é castigado[a], o ingênuo se torna sábio; quando se dá entendimento ao sábio[b], ele adquire conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao castigar o zombador”. A construção hebraica também pode ser entendida mais formalmente como “pelo castigo do zombador”.'
    reason: alternativa sintática
  - marker: b
    text: 'Ou: “quando o sábio é instruído”. O hebraico traz “sábio” no masculino singular, como figura representativa no estilo proverbial.'
    reason: alternativa lexical e forma gramatical
lexical_decisions:
- source_word: בַּעְנָשׁ
  choice: Quando ... é castigado
  rationale: A preposição בְּ com o infinitivo construto expressa circunstância ou ocasião. A formulação temporal é natural em português e preserva o sentido de “ao ser castigado” ou “quando é castigado”.
- source_word: לֵץ
  choice: o zombador
  rationale: O termo designa quem zomba com desprezo e rejeita a correção. “Zombador” é atual e compreensível, enquanto “escarnecedor” seria menos corrente.
- source_word: יֶחְכַּם
  choice: se torna sábio
  rationale: O verbo indica tornar-se sábio ou adquirir sabedoria, não apenas já possuir sabedoria.
- source_word: פֶּתִי
  choice: o ingênuo
  rationale: Em Provérbios, o termo caracteriza a pessoa inexperiente, influenciável e ainda não formada moral e intelectualmente. “Ingênuo” evita a possível ideia moderna de que “simples” signifique humilde ou descomplicado.
- source_word: וּבְהַשְׂכִּיל לְחָכָם
  choice: quando se dá entendimento ao sábio
  rationale: O Hifil de שׂכל pode significar fazer compreender, dar entendimento ou instruir. A construção impessoal em português conserva o valor causativo sem especificar um agente ausente do hebraico.
- source_word: לְחָכָם
  choice: ao sábio
  rationale: O adjetivo substantivado está no masculino singular e apresenta uma figura proverbial representativa. “Ao sábio” mantém a forma e soa natural em português.
- source_word: יִקַּח דָּעַת
  choice: ele adquire conhecimento
  rationale: Embora לקח signifique literalmente “tomar”, com דַּעַת exprime aquisição. “Adquire conhecimento” preserva a distinção lexical entre conhecimento e sabedoria.
theological_decisions:
- issue: Sujeito proverbial no masculino singular
  choice: ao sábio; ele
  alternative: à pessoa sábia; ela
  rationale: O hebraico emprega o masculino singular como tipo representativo no estilo proverbial. A tradução mantém essa forma sem afirmar que a máxima se aplique somente a homens.
- issue: Relação entre castigo, observação e aprendizado
  choice: o ingênuo se torna sábio quando o zombador é castigado
  alternative: pelo castigo do zombador, o ingênuo se torna sábio
  rationale: A construção hebraica permite uma leitura temporal-circunstancial e também uma formulação mais instrumental. A tradução não explicita além do texto se o aprendizado vem da observação, do exemplo ou do efeito do castigo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Zombador” e “ingênuo” comunicam as categorias sapienciais sem recorrer aos termos menos correntes “escarnecedor” e “néscio”. O paralelismo e as duas orações temporais do hebraico foram preservados.
