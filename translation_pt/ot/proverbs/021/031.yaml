  text: ס֗וּס מ֭וּכָן לְ/י֣וֹם מִלְחָמָ֑ה וְ֝/לַֽ/יהוָ֗ה הַ/תְּשׁוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/031.yaml
  text: A horse is prepared for the day of battle[a], but victory belongs to Yahweh.
translation:
  language: pt
  text: O cavalo é preparado para o dia da batalha, mas a vitória[a] pertence a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas a salvação pertence a Yahweh” ou “mas o livramento pertence a Yahweh”. O termo hebraico pode designar salvação ou livramento em sentido amplo; aqui, “vitória” se ajusta ao contexto de batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּס
  choice: cavalo
  rationale: O substantivo designa o animal de modo geral. O contexto militar vem da expressão seguinte, por isso não se acrescenta “de guerra”.
- source_word: מוּכָן
  choice: é preparado
  rationale: O particípio passivo expressa um estado resultante de preparação e conserva a voz passiva do hebraico.
- source_word: לְיוֹם מִלְחָמָה
  choice: para o dia da batalha
  rationale: A preposição indica finalidade ou referência; “dia da batalha” é uma expressão natural e mantém a imagem concreta do combate.
- source_word: וְלַיהוָה
  choice: mas ... pertence a Yahweh
  rationale: A conjunção introduz, neste paralelismo, um contraste entre a preparação humana e o resultado que depende de Yahweh. A construção portuguesa explicita naturalmente a relação possessiva indicada pela preposição.
- source_word: הַתְּשׁוּעָה
  choice: a vitória
  rationale: O termo pode indicar salvação, livramento ou vitória. No contexto de batalha, “vitória” comunica com maior clareza seu sentido contextual sem eliminar a amplitude lexical, registrada em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido de תְּשׁוּעָה no contexto militar
  choice: vitória
  alternative: salvação; livramento
  rationale: O cenário é o dia da batalha, favorecendo o sentido concreto de vitória. A nota preserva os sentidos lexicais mais amplos e a possível tensão entre resultado militar e livramento divino.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. Mantém-se “cavalo”, sem explicitar “cavalo de guerra”, e emprega-se “Yahweh” para o nome divino.
