  text: תַּאֲוַ֣ת עָצֵ֣ל תְּמִיתֶ֑/נּוּ כִּֽי מֵאֲנ֖וּ יָדָ֣י/ו לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/025.yaml
  text: The craving of a lazy man puts him to death, because his hands refuse to work.
translation:
  language: pt
  text: 'O desejo do preguiçoso o mata,

    pois suas mãos se recusam a trabalhar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּאֲוַת (taʾawat)
  choice: desejo
  rationale: O termo designa desejo ou anseio intenso. “Desejo” preserva sua amplitude sem acrescentar a ideia específica de cobiça; o contexto mostra que se trata do desejo não acompanhado de trabalho.
- source_word: עָצֵל (ʿatsel)
  choice: preguiçoso
  rationale: Equivalente corrente e claro para a pessoa indolente retratada na literatura sapiencial.
- source_word: תְּמִיתֶנּוּ (temitennu)
  choice: o mata
  rationale: Reproduz diretamente a construção causativa do hebraico, na qual “o desejo” é o sujeito e o preguiçoso é o objeto.
- source_word: מֵאֲנוּ יָדָיו לַעֲשׂוֹת (meʾanu yadaiv laʿasot)
  choice: suas mãos se recusam a trabalhar
  rationale: Mantém a personificação das mãos e expressa naturalmente em português o sentido contextual de realizar trabalho.
theological_decisions:
- issue: Relação entre o desejo e a morte do preguiçoso
  choice: 'Preservar a afirmação direta: “o mata”'
  alternative: “o leva à morte”
  rationale: O hebraico formula uma relação forte e direta. A tradução não atenua nem explica além do que o provérbio afirma.
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo conciso. “Pois” comunica a relação explicativa introduzida por כִּי, e a personificação das mãos foi preservada.
