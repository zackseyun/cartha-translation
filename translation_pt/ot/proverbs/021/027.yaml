  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֵבָ֑ה אַ֝֗ף כִּֽי בְ/זִמָּ֥ה יְבִיאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/027.yaml
  text: The sacrifice of the wicked is an abomination[a]; how much more when he brings it with evil intent.
translation:
  language: pt
  text: O sacrifício dos maus é uma abominação; quanto mais quando ele o traz com má intenção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto mais quando ele o traz como parte de um plano perverso”. A expressão hebraica pode indicar tanto uma intenção depravada quanto um plano malicioso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: sacrifício
  rationale: Designa uma oferta sacrificial, em especial um animal sacrificado; “sacrifício” é natural e mantém a especificidade cultual.
- source_word: רְשָׁעִים
  choice: dos maus
  rationale: O plural substantivado designa pessoas moralmente culpadas. “Dos maus” é claro, corrente e preserva a categoria proverbial.
- source_word: תּוֹעֵבָה
  choice: uma abominação
  rationale: Termo forte para aquilo que é moralmente repugnante; “abominação” conserva seu peso moral e teológico.
- source_word: אַף כִּי
  choice: quanto mais quando
  rationale: A expressão intensifica o primeiro enunciado e introduz uma circunstância que torna o ato ainda mais condenável.
- source_word: בְּזִמָּה
  choice: com má intenção
  rationale: Neste contexto, indica intenção perversa ou plano malicioso, não necessariamente indecência sexual. A formulação preserva o foco no propósito corrupto.
- source_word: יְבִיאֶנּוּ
  choice: o oferecem
  rationale: O hifil de בוא significa trazer ou apresentar, e o sufixo retoma naturalmente “sacrifício”. “Oferecem” explicita de modo idiomático a apresentação cultual; o plural concorda em português com “os maus”.
theological_decisions:
- issue: Avaliação moral do sacrifício oferecido pelos maus
  choice: O provérbio afirma que o sacrifício dos maus é repugnante e intensifica a condenação quando ele é oferecido com intenção corrupta.
  alternative: A segunda oração pode ser entendida mais amplamente como “quando o oferecem com um plano perverso”, ressaltando uma trama maliciosa específica.
  rationale: A tradução não condena o sacrifício em si, mas o culto de pessoas más, sobretudo quando associado a um propósito perverso. Evita-se importar uma teologia antissacrificial geral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Abominação” conserva deliberadamente a força do hebraico; “quanto mais quando” mantém a progressão enfática do provérbio.
