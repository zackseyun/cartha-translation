  text: זֵ֣ד יָ֭הִיר לֵ֣ץ שְׁמ֑/וֹ ע֝וֹשֶׂ֗ה בְּ/עֶבְרַ֥ת זָדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/024.yaml
  text: “Proud[a], arrogant, a scoffer” is his name—one who acts in the fury of presumption.
translation:
  language: pt
  text: “Presunçoso, arrogante, zombador” é o seu nome — aquele que age com fúria presunçosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֵד
  choice: presunçoso
  rationale: Designa alguém marcado por orgulho atrevido e autoconfiança insolente; “presunçoso” preserva essa nuance e funciona naturalmente como caracterização pessoal.
- source_word: יָהִיר
  choice: arrogante
  rationale: Intensifica o retrato de exaltação própria sem simplesmente repetir “presunçoso”.
- source_word: לֵץ
  choice: zombador
  rationale: Em Provérbios, designa o tipo humano que despreza e ridiculariza; “zombador” é claro e corrente em português.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Mantém a fórmula hebraica de caracterização, inteligível em português como identificação da índole da pessoa.
- source_word: עֹשֶׂה
  choice: aquele que age
  rationale: O particípio expressa conduta habitual e definidora do caráter.
- source_word: בְּעֶבְרַת
  choice: com furor
  rationale: Expressa ira intensa e transbordante como modo de agir; “com furor” é natural e conserva a força do termo.
- source_word: זָדוֹן
  choice: insolente
  rationale: O substantivo indica presunção, arrogância ou insolência. Como qualificador idiomático de “furor”, “insolente” preserva a ligação semântica com זֵד e evita uma formulação abstrata pouco natural.
