  text: Buy truth[a], and do not sell wisdom, instruction[c][b], and understanding.
translation:
  language: pt
  text: Compre a verdade[a] e não venda a sabedoria, a instrução[b] e o entendimento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Adquira a verdade”. O verbo hebraico pode significar “comprar” ou, de modo mais amplo, “adquirir”, mas a imagem comercial provavelmente é intencional por causa de “não venda”.
    reason: lexical_alternative
  - marker: b
    text: “Instrução” também pode ser traduzida por “disciplina” ou “correção”.
    reason: lexical_alternative
  - marker: c
    text: “Entendimento” também pode ser traduzido por “discernimento” ou “percepção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: verdade
  rationale: O termo pode expressar verdade, confiabilidade ou fidelidade. Neste apelo sapiencial, “verdade” preserva de modo conciso tanto a dimensão moral quanto a cognitiva.
- source_word: קְנֵה
  choice: compre
  rationale: O imperativo pode significar “comprar” ou, em sentido mais amplo, “adquirir”. “Compre” conserva a imagem comercial reforçada pelo verbo correspondente “vender”.
- source_word: וְאַל תִּמְכֹּר
  choice: e não a venda
  rationale: Mantém a proibição e o contraste comercial. O pronome retoma naturalmente “a verdade”, sem excluir que a exortação se estenda aos demais bens sapienciais enumerados.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e adequado em Provérbios, abrangendo capacidade prática e moral para viver bem.
- source_word: מוּסָר
  choice: instrução
  rationale: O termo abrange instrução formativa, disciplina e correção. “Instrução” é natural no contexto e evita restringi-lo ao aspecto punitivo.
- source_word: בִינָה
  choice: entendimento
  rationale: Expressa a capacidade de compreender e distinguir. É uma tradução ampla e natural, sem eliminar as nuances de discernimento e percepção.
theological_decisions:
- issue: Alcance dos verbos “comprar” e “não vender” sobre a lista final
  choice: A pontuação e “também” apresentam sabedoria, instrução e entendimento como bens igualmente abrangidos pela exortação, sem repetir um verbo ausente no hebraico.
  alternative: Explicitar “compre também” ou fazer toda a lista depender apenas de “não venda”.
  rationale: O hebraico é terso e deixa implícita a relação sintática da lista final. A formulação conserva essa concisão e evita decidir excessivamente se os três termos dependem de “compre”, de “não venda” ou de ambos.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo na forma “compre”, natural sobretudo para leitores brasileiros e amplamente compreensível no espaço lusófono. A construção breve preserva o paralelismo e a imagem comercial do hebraico.
