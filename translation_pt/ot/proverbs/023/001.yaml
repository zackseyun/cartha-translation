base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/001.yaml
  text: When you sit down to dine with a ruler[a], carefully consider what is before you.
translation:
  language: pt
  text: Quando você se sentar para comer com um governante, preste muita atenção ao que está diante de você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao que foi posto diante de você”. O hebraico pode se referir especificamente à comida na mesa, mas também pode abranger a situação diante do convidado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz aqui uma situação típica da instrução sapiencial, não uma causa; “quando” expressa naturalmente esse contexto em português.
- source_word: תֵשֵׁב
  choice: você se sentar
  rationale: Mantém a ação concreta de ישׁב e soa natural no contexto de tomar lugar para uma refeição.
- source_word: לִלְחוֹם
  choice: para comer
  rationale: O infinitivo de לחם significa aqui participar de uma refeição. “Comer” é claro, atual e natural, sem elevar artificialmente o registro.
- source_word: אֶת מוֹשֵׁל
  choice: com um governante
  rationale: מוֹשֵׁל designa alguém que exerce autoridade; no contexto da refeição, a construção é naturalmente vertida como companhia.
- source_word: בִּין תָּבִין
  choice: preste muita atenção
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a exortação. A expressão comunica atenção cuidadosa e discernimento em português corrente.
- source_word: אֶת אֲשֶׁר לְפָנֶיךָ
  choice: ao que está diante de você
  rationale: Preserva a amplitude do hebraico, que pode indicar tanto a comida posta diante do convidado quanto, por extensão, toda a situação.
theological_decisions: []
