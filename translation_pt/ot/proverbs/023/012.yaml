  text: הָבִ֣יאָ/ה לַ/מּוּסָ֣ר לִבֶּ֑/ךָ וְ֝/אָזְנֶ֗/ךָ לְ/אִמְרֵי דָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/012.yaml
  text: Apply your heart to instruction[a], and your ear to words of knowledge.
translation:
  language: pt
  text: 'Aplique o seu coração à instrução[a]

    e o seu ouvido às palavras de conhecimento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Leve o seu coração à disciplina e o seu ouvido aos ditos de conhecimento.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאָה
  choice: Aplique
  rationale: O hifil imperativo de בוא significa literalmente “traga”, mas, com “coração” e a preposição que introduz o alvo, exprime a ideia de dirigir-se intencionalmente ou dedicar-se. “Aplique” comunica esse sentido de modo natural em português.
- source_word: לַמּוּסָר
  choice: à instrução
  rationale: מוּסָר abrange instrução, disciplina e correção. Em paralelo com “palavras de conhecimento”, “instrução” destaca adequadamente o aspecto pedagógico sem excluir sua dimensão formativa.
- source_word: לִבֶּךָ
  choice: o coração
  rationale: No hebraico bíblico, לֵב designa o centro interior do pensamento, da vontade e das disposições, não apenas as emoções. “Coração” preserva a imagem e é transparente em português.
- source_word: וְאָזְנֶךָ
  choice: e os ouvidos
  rationale: Embora o hebraico use o singular “teu ouvido”, o plural é a forma mais natural em português nessa exortação e mantém claramente a imagem da escuta atenta.
- source_word: לְאִמְרֵי
  choice: às palavras de
  rationale: אִמְרֵי é o plural construto de אֵמֶר, “ditos” ou “palavras”. “Palavras de” é corrente e preserva o conteúdo lexical.
- source_word: דָעַת
  choice: conhecimento
  rationale: דַּעַת significa diretamente “conhecimento” e se ajusta ao contexto sapiencial e instrutivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A primeira linha conserva a imagem hebraica do coração como sede da mente e da vontade; o plural “ouvidos” favorece a naturalidade em português. A nota registra tanto o sentido mais literal de הָבִיאָה (“leve”) quanto a nuance disciplinadora de מוּסָר.
