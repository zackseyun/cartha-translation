  text: Listen[a], my son, and be wise, and direct your heart in the way.
translation:
  language: pt
  text: Escute[a], meu filho, e seja sábio; oriente o seu coração pelo caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ouça, meu filho, e torne-se sábio; encaminhe o seu coração pela vereda.”'
    reason: Alternativas lexicais legítimas para שׁמע, חכם, אשר e דרך.
lexical_decisions:
- source_word: שְׁמַע
  choice: Escute
  rationale: O imperativo pede atenção obediente, não apenas percepção auditiva. “Escute” expressa isso de modo natural no português atual; “Ouça” também é possível.
- source_word: בְנִי
  choice: meu filho
  rationale: O vocativo hebraico é masculino singular e retrata a instrução de pai para filho característica de Provérbios.
- source_word: וַחֲכָם
  choice: e seja sábio
  rationale: O imperativo conciso é bem representado por “seja sábio”, sem acrescentar a ênfase processual de “torne-se sábio”.
- source_word: וְאַשֵּׁר
  choice: dirija
  rationale: O imperativo piel comunica orientar ou encaminhar. “Dirija” conserva de forma compacta a imagem de conduzir o coração.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: Mantém a metáfora hebraica do caminho como modo de vida ou conduta, sem especificar um qualificativo ausente no texto.
- source_word: לִבֶּךָ
  choice: o seu coração
  rationale: “Coração” preserva a imagem concreta e a amplitude antropológica do hebraico, que abrange pensamento, vontade e desejos.
theological_decisions:
- issue: Tratamento filial marcado por gênero na instrução sapiencial
  choice: meu filho
  alternative: meu filho ou minha filha
  rationale: O hebraico é explicitamente masculino singular. Embora a instrução possa ter aplicação representativa mais ampla, a tradução preserva a forma do texto sem neutralizá-la.
- issue: Sentido moral do caminho
  choice: no caminho
  alternative: no caminho certo
  rationale: O contexto sapiencial sugere a boa conduta, mas o adjetivo “certo” não está expresso neste versículo. A formulação mantém a concisão e a tensão metafórica do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação com ponto e vírgula organiza os dois pares de imperativos sem alterar sua coordenação. O pronome possessivo “seu” segue o uso corrente, enquanto “meu filho” preserva o endereço direto do hebraico.
