  text: כִּ֭י אִם יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/018.yaml
  text: For surely there is a future[a], and your hope will not be cut off.
translation:
  language: pt
  text: Pois certamente há um futuro[a], e a sua esperança não será cortada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “há um fim/desfecho”; o termo hebraico אַחֲרִית pode indicar fim, desfecho ou futuro. Aqui, “futuro” foi adotado porque o contexto expressa uma expectativa positiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois certamente
  rationale: A expressão introduz uma afirmação enfática e mantém a ligação explicativa com o versículo anterior; evita a leitura condicional enganosa de “pois, se”.
- source_word: יֵשׁ
  choice: há
  rationale: É a forma existencial mais natural e direta em português.
- source_word: אַחֲרִית
  choice: um futuro
  rationale: O termo pode indicar fim, desfecho ou futuro. Neste contexto de expectativa positiva, “futuro” comunica melhor a perspectiva assegurada sem sugerir apenas término.
- source_word: וְתִקְוָתְךָ
  choice: e a sua esperança
  rationale: “Esperança” é o equivalente português mais natural para a expectativa confiante expressa pelo substantivo hebraico.
- source_word: לֹא תִכָּרֵת
  choice: não será frustrada
  rationale: O hebraico diz literalmente “não será cortada”. Aplicada à esperança, a expressão significa que ela não será eliminada nem deixará de se cumprir; “não será frustrada” transmite o sentido idiomático com clareza em português.
