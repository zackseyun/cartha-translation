source:
  edition: WLC
  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/017.yaml
  text: Do not let your heart envy sinners[a], but be in the fear of Yahweh all day long.
translation:
  language: pt
  text: Que o seu coração não tenha inveja dos pecadores, mas tenha temor de Yahweh o dia inteiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יְקַנֵּא
  choice: Não deixe ... ter inveja
  rationale: Expressa de modo natural em português a proibição hebraica dirigida à disposição interior, sem perder a construção com “coração”.
- source_word: לִבְּךָ
  choice: o seu coração
  rationale: Mantém a imagem hebraica do coração como centro dos desejos e da disposição interior.
- source_word: בַּחַטָּאִים
  choice: dos pecadores
  rationale: “Pecadores” traduz diretamente o substantivo que designa pessoas caracterizadas pelo pecado; a regência “ter inveja de” pede “dos”.
- source_word: כִּי אִם
  choice: mas
  rationale: 'Marca a correção contrastiva: não uma postura, mas a outra.'
- source_word: בְּיִרְאַת יְהוָה
  choice: no temor de Yahweh
  rationale: Preserva a expressão teológica central “temor de Yahweh” e verte o nome divino como nome próprio.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Forma corrente e clara de indicar duração ao longo de todo o dia.
theological_decisions:
- issue: Como exprimir a segunda oração, que não contém verbo explícito no hebraico
  choice: mas permaneça no temor de Yahweh
  alternative: mas esteja no temor de Yahweh
  rationale: O hebraico é elíptico. “Permaneça” produz uma exortação natural e combina com a duração indicada por “o dia inteiro”, embora acrescente discretamente a noção de continuidade; a alternativa é mais formal, mas menos idiomática em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva “coração”, “pecadores”, “temor” e o nome divino “Yahweh”, evitando parafrasear a tensão moral do provérbio.
