  text: לְ/מִ֨י א֥וֹי לְ/מִ֪י אֲב֡וֹי לְ/מִ֤י מדונים לְ/מִ֥י שִׂ֗יחַ לְ֭/מִי פְּצָעִ֣ים חִנָּ֑ם לְ֝/מִ֗י חַכְלִל֥וּת עֵינָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/029.yaml
  text: Who has woe? Who has sorrow? Who has strife? Who has complaining? Who has wounds for nothing? Who has redness of eyes?[a][b][c]
translation:
  language: pt
  text: Quem tem ais? Quem tem lamentos?[a] Quem tem brigas? Quem tem queixas? Quem tem feridas sem motivo?[b] Quem tem os olhos vermelhos?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pesares»; o hebraico אֲבוֹי tem a nuance de um grito de dor ou lamentação.
    reason: lexical_alternative
  - marker: b
    text: Ou «sem causa» ou «inutilmente».
    reason: lexical_alternative
  - marker: c
    text: Ou «os olhos injetados de sangue»; a expressão hebraica descreve a aparência alterada dos olhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: ais
  rationale: 'O plural idiomático «ais» conserva a força breve de uma exclamação de aflição e se encaixa naturalmente na pergunta «Quem tem...?». '
- source_word: אֲבוֹי
  choice: lamentos
  rationale: Distingue este termo do «ais» anterior e preserva sua nuance de expressão de pesar, sem reduzir o paralelismo a uma repetição idêntica.
- source_word: מְדֹונִים
  choice: brigas
  rationale: Expressa de modo atual e acessível os conflitos e contendas recorrentes indicados pelo plural hebraico.
- source_word: שִׂיחַ
  choice: queixas
  rationale: O substantivo pode indicar fala, queixa ou reflexão angustiada; «queixas» é natural no contexto e mantém a ambiguidade entre fala de descontentamento e lamentação.
- source_word: פְּצָעִים
  choice: feridas
  rationale: Tradução concreta e vívida para lesões corporais.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Comunica que as feridas são gratuitas, inúteis ou sem causa justificável, sem especificar além do hebraico.
- source_word: חַכְלִלוּת עֵינָיִם
  choice: olhos vermelhos
  rationale: Formulação natural em português que permanece próxima da referência hebraica à aparência alterada dos olhos; «injetados de sangue» seria mais interpretativo.
- source_word: לְמִי
  choice: Quem tem
  rationale: Embora a construção seja literalmente «para quem?», esta formulação reproduz em português corrente a série de perguntas retóricas e sua cadência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de «Quem tem...?», seguida de substantivos breves, preserva a cadência retórica e proverbial do hebraico.
