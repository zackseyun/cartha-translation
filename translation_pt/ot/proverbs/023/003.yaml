  text: אַל תִּ֭תְאָו לְ/מַטְעַמּוֹתָ֑י/ו וְ֝/ה֗וּא לֶ֣חֶם כְּזָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/003.yaml
  text: Do not crave his delicacies[a], for they are deceptive food.
translation:
  language: pt
  text: Não cobice as iguarias dele, pois são comida enganosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּתְאָו
  choice: Não cobice
  rationale: A partícula negativa com a forma verbal expressa proibição; “não cobice” comunica de modo conciso o desejo intenso e indevido indicado por אוה.
- source_word: לְמַטְעַמּוֹתָיו
  choice: as iguarias dele
  rationale: O substantivo designa pratos saborosos ou requintados; “iguarias” é natural, claro e mantém seu poder de atração no contexto.
- source_word: וְהוּא
  choice: pois são
  rationale: A conjunção introduz a razão da proibição. Embora o pronome hebraico seja singular, refere-se coletivamente às iguarias ou à comida; a concordância plural é natural em português.
- source_word: לֶחֶם כְּזָבִים
  choice: comida enganosa
  rationale: לֶחֶם pode significar alimento em sentido amplo, não apenas pão. O plural כְּזָבִים, literalmente “mentiras”, caracteriza a comida como enganosa, isto é, associada a intenções ou aparências falsas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem alimentar e a advertência contra o caráter enganoso das iguarias, sem explicitar além do hebraico quais seriam as intenções ocultas.
