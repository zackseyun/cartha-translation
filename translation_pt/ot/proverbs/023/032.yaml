  text: אַ֭חֲרִית/וֹ כְּ/נָחָ֣שׁ יִשָּׁ֑ךְ וּֽ/כְ/צִפְעֹנִ֥י יַפְרִֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/032.yaml
  text: In the end it bites like a snake[c][b][a], and it stings like a viper.
translation:
  language: pt
  text: No fim, ele morde como a cobra e fere como a víbora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O último verbo hebraico é de sentido incerto. Também pode ser traduzido por “ataca” ou, possivelmente, “espalha veneno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיתוֹ
  choice: No fim
  rationale: אַחֲרִיתוֹ significa literalmente “seu fim” e, no contexto, aponta para o resultado final do vinho. “No fim” é natural em português e mantém esse sentido temporal e consequencial.
- source_word: כְּנָחָשׁ
  choice: como a cobra
  rationale: נָחָשׁ é o termo comum para cobra ou serpente. “Cobra” é claro e corrente, sem acrescentar associações que o hebraico não exige.
- source_word: יִשָּׁךְ
  choice: ele morde
  rationale: A forma vem de נשׁך, “morder”. O presente exprime bem uma verdade proverbial; o pronome retoma o vinho mencionado no contexto.
- source_word: וּכְצִפְעֹנִי
  choice: como a víbora
  rationale: צִפְעֹנִי designa uma serpente venenosa. “Víbora” é uma equivalência portuguesa clara e atual.
- source_word: יַפְרִשׁ
  choice: fere
  rationale: O verbo é lexicalmente difícil. “Fere” preserva a ação nociva da serpente venenosa e o paralelismo com “morde”, sem afirmar de modo excessivamente específico que ela “pica” ou “espalha veneno”.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com leitura fluente no Brasil e compreensão ampla no mundo lusófono. O pronome “ele” explicita o vinho retomado do contexto imediato; a nota preserva a incerteza lexical do verbo final.
