base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/026.yaml
  text: My son[a], give me your heart, and let your eyes delight in my ways.
translation:
  language: pt
  text: Meu filho, dê-me o seu coração, e que os seus olhos se agradem dos meus caminhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que os seus olhos observem os meus caminhos”. O verbo hebraico pode indicar atenção cuidadosa; neste contexto, porém, provavelmente inclui aprovação e prazer no modo de vida do pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: dê
  rationale: Imperativo de נתן. “Dê” comunica de modo direto e natural a exortação paterna.
- source_word: בְנִי
  choice: Meu filho
  rationale: Vocativo masculino singular com sufixo de primeira pessoa. Preserva a forma específica e afetuosa do tratamento hebraico.
- source_word: לִבְּךָ
  choice: o seu coração
  rationale: Mantém a metáfora hebraica do coração como centro da vontade, dos afetos e do ser interior.
- source_word: לִי
  choice: -me
  rationale: O pronome enclítico em “dê-me” expressa naturalmente em português o objeto indireto marcado por ל.
- source_word: וְעֵינֶיךָ
  choice: e que os seus olhos
  rationale: A construção com “que” transmite o valor volitivo da forma verbal ligada à primeira ordem, sem tornar a frase artificial.
- source_word: דְּרָכַי
  choice: dos meus caminhos
  rationale: דרך designa aqui caminhos no sentido figurado de conduta ou modo de vida; a imagem é preservada.
- source_word: תרצנה
  choice: se agradem
  rationale: A forma, entendida a partir de רצה, sugere aprovação, prazer ou acolhimento favorável. “Se agradem” conserva esse componente afetivo e volitivo, embora o texto consonantal também permita uma leitura relacionada à observação atenta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal em “dê-me” mantém naturalidade e solenidade moderada. A ambiguidade lexical do último verbo é preservada em nota.
