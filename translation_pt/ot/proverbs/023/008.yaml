review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração representa bem o hebraico: o perfeito de «comeu» exprime a ingestão já ocorrida, e «vomitará» preserva a imagem forte de תְּקִיאֶנָּה. Na segunda oração, porém, «terá desperdiçado» introduz um futuro perfeito que não é exigido pela forma hebraica nem pelo paralelismo. O futuro simples transmite com mais precisão a consequência anunciada.'
  naturalness: «Você vomitará o bocado que comeu» é claro e idiomático em português moderno. «E desperdiçará suas palavras agradáveis» restaura o paralelismo verbal e soa mais direto e proverbial. O marcador de nota deve ficar junto de «agradáveis», termo ao qual a alternativa lexical se refere.
  terminology: «Bocado» é uma boa equivalência concisa para פַּת. «Palavras agradáveis» preserva a amplitude de נְעִימִים; «amáveis» e «gentis» são alternativas legítimas, sem estreitar indevidamente o sentido.
  issues:
  - severity: medium
    issue: Tempo verbal composto em «terá desperdiçado»
    rationale: וְשִׁחַתָ funciona aqui como a consequência futura paralela a «vomitará». O futuro perfeito português sugere uma anterioridade ou resultado já completado que o texto não especifica; «desperdiçará» mantém o paralelismo e evita essa nuance adicional.
  - severity: low
    issue: Posição do marcador de nota
    rationale: A nota oferece alternativas para «agradáveis», portanto o marcador deve ser colocado imediatamente após essa palavra, e não após a pontuação final.
  revised_text: Você vomitará o bocado que comeu e desperdiçará suas palavras agradáveis[a].
