  yaml_path: translation/ot/proverbs/023/008.yaml
  text: You will vomit up the morsel you have eaten[a], and you will waste your pleasant words.
translation:
  language: pt
  text: Você vomitará o bocado que comeu e desperdiçará suas palavras agradáveis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palavras amáveis” ou “palavras gentis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְּךָ
  choice: o bocado
  rationale: פַּת designa um pedaço ou bocado de pão/comida. “Bocado” preserva a imagem concisa sem especificar além do hebraico; o sufixo de segunda pessoa é expresso naturalmente pela oração “que comeu”.
- source_word: אָכַלְתָּ
  choice: que comeu
  rationale: O qal perfeito de אָכַל indica a ação já realizada; em português, o pretérito perfeito simples é a forma natural neste contexto.
- source_word: תְקִיאֶנָּה
  choice: Você vomitará
  rationale: A forma de קיא descreve diretamente vomitar, e o sufixo feminino retoma פַּת. A tradução mantém a força vívida da imagem hebraica.
- source_word: וְשִׁחַתָּ
  choice: e terá desperdiçado
  rationale: Neste contexto, שׁחת comunica que as palavras proferidas terão sido gastas sem proveito. O futuro composto apresenta o resultado consumado da experiência descrita.
- source_word: דְּבָרֶיךָ
  choice: suas palavras
  rationale: Equivalente direto do substantivo plural com sufixo de segunda pessoa.
- source_word: הַנְּעִימִים
  choice: agradáveis
  rationale: נעים denota aquilo que é agradável, amável ou aprazível. “Agradáveis” preserva a amplitude lexical sem interpretar excessivamente a intenção das palavras.
