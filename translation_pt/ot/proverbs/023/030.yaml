base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/030.yaml
  text: For those who linger over wine[a], for those who come to search out mixed wine.
translation:
  language: pt
  text: 'Para os que se demoram com o vinho,

    para os que vêm procurar vinho misturado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho aromatizado” ou “bebida preparada”. O hebraico se refere a vinho misturado, provavelmente com especiarias ou outros ingredientes.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֲרִים
  choice: se demoram
  rationale: O particípio indica permanecer por muito tempo ou tardar; “se demoram” é natural em português e comunica a permanência prolongada junto ao vinho.
- source_word: עַל הַיָּיִן
  choice: com o vinho
  rationale: Neste contexto, a preposição apresenta aquilo com que a pessoa permanece ocupada. “Com o vinho” forma uma expressão portuguesa natural sem acrescentar explicitamente uma ação ausente do hebraico.
- source_word: בָּאִים
  choice: vêm
  rationale: Traduz diretamente o verbo “vir” e preserva o movimento deliberado expresso no texto-fonte.
- source_word: לַחְקֹר
  choice: procurar
  rationale: O verbo pode significar investigar, explorar ou buscar. Neste contexto, “procurar” comunica de modo claro a busca intencional pela bebida, sem soar artificial.
- source_word: מִמְסָךְ
  choice: vinho misturado
  rationale: O substantivo designa uma bebida de vinho preparada por mistura, possivelmente com especiarias ou outros ingredientes. A tradução direta mantém em aberto a composição exata.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo entre os dois segmentos. Evitou-se “tardam”, de tom menos corrente, e também explicitar “bebendo”, pois essa ação, embora implícita no contexto, não aparece diretamente no hebraico.
