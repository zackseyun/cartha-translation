  text: יִֽשְׂמַח אָבִ֥י/ךָ וְ/אִמֶּ֑/ךָ וְ֝/תָגֵ֗ל יֽוֹלַדְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/025.yaml
  text: Let your father and your mother be glad[a], and let her who gave birth to you rejoice.
translation:
  language: pt
  text: Que seu pai e sua mãe se alegrem, e exulte aquela que deu você à luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמַח
  choice: se alegrem
  rationale: O jussivo de שׂמח expressa desejo ou exortação. Em português, “Que ... se alegrem” comunica naturalmente esse valor; o plural concorda com o sujeito composto “seu pai e sua mãe”.
- source_word: אָבִיךָ וְאִמֶּךָ
  choice: seu pai e sua mãe
  rationale: Reproduz diretamente os dois substantivos com o sufixo possessivo de segunda pessoa.
- source_word: וְתָגֵל
  choice: e exulte
  rationale: O jussivo de גיל denota alegria intensa. “Exulte” preserva a progressão poética em relação a “se alegrem” e mantém o tom elevado sem deixar de ser compreensível.
- source_word: יוֹלַדְתֶּךָ
  choice: aquela que deu você à luz
  rationale: A forma feminina singular refere-se à mulher que gerou o destinatário, isto é, sua mãe. A expressão “dar à luz” é clara e corrente em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção jussiva natural (“Que...”) e paralelismo preservado. A repetição da mãe no segundo membro mantém a ênfase poética do hebraico.
