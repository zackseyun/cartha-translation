translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Bebem vinho em excesso” preserva o sentido habitual do particípio; “se empanturram” expressa vividamente a voracidade de זלל sem recorrer ao rótulo abstrato “glutões”.
