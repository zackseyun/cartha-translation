base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/020.yaml
  text: Do not be among heavy drinkers of wine[a], among gluttonous eaters of meat,
translation:
  language: pt
  text: Não esteja entre os que bebem vinho em excesso, nem entre os que se empanturram de carne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “entre os que se empanturram de carne para si mesmos”. O termo hebraico final, לָמוֹ, é sintaticamente difícil e talvez apenas dê ênfase, sem acrescentar uma ideia distinta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Não esteja
  rationale: A partícula אַל com a forma jussiva de היה expressa proibição. “Não esteja” comunica naturalmente a advertência contra fazer parte desse grupo.
- source_word: בְסֹבְאֵי יָיִן
  choice: entre os que bebem vinho em excesso
  rationale: A preposição בְּ indica associação, e סבא descreve o consumo excessivo ou habitual de bebida. A formulação evita o arcaísmo e conserva o foco na prática.
- source_word: בְזֹלֲלֵי בָשָׂר
  choice: nem entre os que se empanturram de carne
  rationale: בְּ novamente indica associação; o particípio זֹלֲלֵי denota consumo voraz e excessivo, enquanto בָשָׂר é carne usada como alimento.
- source_word: לָמוֹ
  choice: não explicitado separadamente no texto principal
  rationale: O termo final é sintaticamente difícil e pode reforçar a expressão precedente, sem acrescentar uma ideia distinta. A possível leitura reflexiva é preservada na nota.
