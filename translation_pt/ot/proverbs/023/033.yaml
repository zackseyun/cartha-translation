base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/033.yaml
  text: Your eyes will see strange things[b][a], and your heart will speak perverse things.
translation:
  language: pt
  text: Seus olhos verão coisas estranhas[a], e seu coração dirá coisas perversas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulheres estranhas”. O hebraico זָרוֹת pode, em certos contextos, referir-se a mulheres estrangeiras ou ilícitas; aqui também pode indicar, de modo mais geral, visões estranhas ou distorcidas provocadas pela embriaguez.
    reason: alternative_reading
  - marker: b
    text: Ou “coisas distorcidas” ou “coisas tortuosas”. O hebraico תַּהְפֻּכוֹת refere-se ao que é distorcido ou perverso, especialmente na fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: seus olhos
  rationale: O dual com sufixo de segunda pessoa masculina singular é expresso naturalmente em português pelo plural “seus olhos”.
- source_word: יִרְאוּ
  choice: verão
  rationale: O imperfeito qal tem sentido de consequência futura no contexto da advertência sobre a embriaguez.
- source_word: זָרוֹת
  choice: coisas estranhas
  rationale: O feminino plural pode referir-se a coisas estranhas ou, em certos contextos, a mulheres estranhas. A formulação mais ampla se ajusta aos efeitos da intoxicação sem especificar um objeto que o hebraico não explicita.
- source_word: וְלִבְּךָ
  choice: e seu coração
  rationale: “Coração” preserva a imagem hebraica do centro interior do pensamento e da vontade, sem reduzi-la interpretativamente a “mente”.
- source_word: יְדַבֵּר
  choice: dirá
  rationale: O imperfeito piel, paralelo a “verão”, indica o resultado futuro; “dirá” soa mais natural em português neste contexto do que a tradução mais mecânica “falará”.
- source_word: תַּהְפֻּכוֹת
  choice: coisas perversas
  rationale: O substantivo denota perversidades ou coisas distorcidas, especialmente no âmbito da fala; “coisas perversas” conserva tanto a dimensão moral quanto a verbal.
