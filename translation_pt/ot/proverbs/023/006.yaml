lexical_decisions:
- source_word: תִּלְחַם
  choice: coma
  rationale: No contexto de לֶחֶם, o verbo se refere a comer, não ao homógrafo com o sentido de lutar.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém a imagem concreta do hebraico; no contexto, o pão representa também a comida ou refeição oferecida.
- source_word: רַע עָיִן
  choice: quem tem olho mau
  rationale: Preserva a expressão idiomática hebraica e sua força imagética, enquanto a nota esclarece que ela caracteriza uma pessoa mesquinha e que oferece de má vontade.
- source_word: תתאו
  choice: cobice
  rationale: Expressa desejo intenso e inadequado, adequado à advertência sapiencial.
- source_word: לְמַטְעַמֹּתָיו
  choice: suas iguarias
  rationale: Designa pratos saborosos ou especialmente atraentes; “iguarias” é natural e conciso em português.
