source:
  edition: WLC
  text: אַל תִּמְנַ֣ע מִ/נַּ֣עַר מוּסָ֑ר כִּֽי תַכֶּ֥/נּוּ בַ֝/שֵּׁ֗בֶט לֹ֣א יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/013.yaml
  text: Do not withhold discipline from a boy[a], for if you strike him with the rod[b], he will not die.
translation:
  language: pt
  text: Não deixe de disciplinar o menino[a], pois, se você lhe bater com a vara[b], ele não morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a criança” ou “o jovem”. O substantivo hebraico pode designar um menino ou, de modo mais amplo, uma pessoa jovem; o texto principal mantém a forma masculina singular do provérbio.
    reason: lexical_alternative
  - marker: b
    text: O provérbio afirma que essa correção não é, por si só, fatal; não deve ser entendido como aprovação irrestrita de violência abusiva nem como garantia absoluta para todos os casos.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Não deixe de
  rationale: Expressa em português natural a proibição formada por אַל com o imperfeito, preservando a ideia de não reter ou deixar de aplicar algo.
- source_word: מִנַּעַר
  choice: do menino
  rationale: נַעַר pode indicar menino, criança ou jovem; “menino” mantém o masculino singular do provérbio e concorda com o sufixo masculino subsequente.
- source_word: מוּסָר
  choice: disciplinar
  rationale: Em Provérbios, מוּסָר abrange formação e correção disciplinar. A construção verbal “deixar de disciplinar” é mais corrente em português do que “reter a disciplina” e se ajusta ao contexto imediato.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a proibição, com conexão explicativa clara e digna em português.
- source_word: תַכֶּנּוּ
  choice: você lhe bater
  rationale: נכה designa concretamente golpear ou bater. “Bater” conserva a ação física sem substituí-la pela noção mais abstrata de disciplinar nem intensificá-la necessariamente como espancamento.
- source_word: בַשֵּׁבֶט
  choice: com a vara
  rationale: שֵׁבֶט, no contexto da disciplina sapiencial, significa vara. O artigo definido do hebraico é preservado naturalmente.
- source_word: לֹא יָמוּת
  choice: ele não morrerá
  rationale: Reproduz diretamente o imperfeito negado, sem acrescentar qualificações interpretativas ao texto principal.
theological_decisions:
- issue: Referência masculina de נַעַר em uma máxima sapiencial
  choice: menino no texto principal
  alternative: criança ou jovem
  rationale: O substantivo e os referentes seguintes estão no masculino singular. A tradução mantém essa forma, enquanto a nota registra a amplitude lexical sem impor uma aplicação exclusivamente masculina.
- issue: Natureza da afirmação sobre disciplina corporal
  choice: traduzir diretamente “ele não morrerá”
  alternative: “isso não o matará” ou uma formulação qualificadora
  rationale: O hebraico apresenta uma afirmação proverbial direta. Qualificá-la no texto principal suavizaria ou interpretaria o original; a necessária cautela contra uma leitura abusiva fica na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Não deixe de disciplinar” evita a rigidez pouco idiomática de “não retenha a disciplina”; “lhe bater com a vara” mantém explícita a imagem concreta e a referência pronominal masculina.
