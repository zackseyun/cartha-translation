  yaml_path: translation/ot/proverbs/023/002.yaml
  text: and put a knife to your throat if you are a man of appetite[a].
translation:
  language: pt
  text: e ponha uma faca à sua garganta, se você é dominado pelo apetite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se você se entrega ao apetite” ou “se você é guloso”. Literalmente, a expressão hebraica é “dono/senhor de nefesh”; neste contexto, nefesh se refere ao apetite ou desejo e descreve alguém governado por um forte desejo de comer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  choice: e ponha
  rationale: O waw seguido do perfeito qal na sequência de instruções tem força continuativa e injuntiva; “e ponha” é natural e preserva a ligação com o versículo anterior.
- source_word: שַׂכִּין
  choice: uma faca
  rationale: O substantivo designa uma faca; a tradução mantém simples e vívida a advertência hiperbólica.
- source_word: בְּ/לֹעֶךָ
  choice: na garganta
  rationale: לֹעַ indica garganta ou goela. Em português, “pôr uma faca na garganta” expressa naturalmente a imagem sem a rigidez de uma tradução como “dentro da garganta”.
- source_word: אִם
  choice: se
  rationale: A partícula introduz a condição sob a qual se aplica a advertência.
- source_word: בַּעַל נֶפֶשׁ
  choice: dominado pelo apetite
  rationale: A expressão é literalmente algo como “senhor/dono de apetite (ou desejo)”, mas, neste contexto, caracteriza quem é fortemente movido pelo apetite. “Dominado pelo apetite” comunica o sentido idiomático sem limitar necessariamente a expressão à gula habitual.
- source_word: אָתָּה
  choice: você é
  rationale: O pronome independente explicita o sujeito; “você é” oferece leitura moderna e amplamente compreensível em português.
