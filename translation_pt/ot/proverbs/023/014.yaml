source:
  edition: WLC
  text: אַ֭תָּה בַּ/שֵּׁ֣בֶט תַּכֶּ֑/נּוּ וְ֝/נַפְשׁ֗/וֹ מִ/שְּׁא֥וֹל תַּצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/014.yaml
  text: You shall strike him with the rod[b][a], and you will deliver his life from Sheol.
translation:
  language: pt
  text: Você o golpeará com a vara e livrará a vida dele[a] do Sheol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a alma dele”. O hebraico néfesh pode significar “vida”, “pessoa” ou “alma”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Sheol é o termo hebraico para o domínio dos mortos; outra tradução possível é “a sepultura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשֵּׁבֶט
  choice: com a vara
  rationale: שֵׁבֶט pode designar vara, bastão ou cetro. Neste contexto de disciplina parental, “vara” preserva de modo natural e concreto o instrumento mencionado.
- source_word: תַּכֶּנּוּ
  choice: você o golpeará
  rationale: O hifil de נכה significa aqui golpear ou ferir. “Golpeará” mantém a ação física expressa no hebraico, sem a suavização interpretativa de “disciplinará” nem a possível intensificação de “espancará”.
- source_word: נַפְשׁוֹ
  choice: a vida dele
  rationale: נֶפֶשׁ pode significar vida, pessoa ou alma. Em paralelo com a libertação do Sheol, “a vida dele” comunica claramente a ideia contextual sem impor uma antropologia mais estreita.
- source_word: מִשְּׁאוֹל
  choice: do Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos, sem reduzi-lo simplesmente à sepultura. A nota esclarece o termo.
- source_word: תַּצִּיל
  choice: livrará
  rationale: O hifil de נצל significa livrar ou resgatar. “Livrará” combina naturalmente com “do Sheol” e mantém o tom solene do provérbio.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em relação ao Sheol
  choice: a vida dele
  alternative: a alma dele
  rationale: O provérbio apresenta a disciplina como meio de afastar o filho de um caminho que leva à morte. “A vida dele” preserva o sentido idiomático provável sem usar o versículo para definir a relação entre corpo e alma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção no futuro preserva a forma verbal do hebraico e funciona como instrução proverbial. “Golpeará” mantém a concretude do original sem recorrer a linguagem mais extrema.
