  text: כִּי סֹבֵ֣א וְ֭/זוֹלֵל יִוָּרֵ֑שׁ וּ֝/קְרָעִ֗ים תַּלְבִּ֥ישׁ נוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/021.yaml
  text: For the drunkard and the glutton will come to poverty[a], and drowsiness will clothe one with rags.
translation:
  language: pt
  text: Pois o beberrão e o glutão acabarão na pobreza, e a sonolência[a] vestirá alguém de trapos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sono”. O substantivo hebraico נוּמָה pode ser traduzido tanto por “sono” como por “sonolência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹבֵא
  choice: beberrão
  rationale: Designa quem se entrega habitualmente à bebida em excesso; “beberrão” é claro, corrente e preserva a caracterização moral do provérbio.
- source_word: זוֹלֵל
  choice: glutão
  rationale: No contexto, refere-se a quem come de modo excessivo e autocomplacente; “glutão” forma o par natural com “beberrão”.
- source_word: יִוָּרֵשׁ
  choice: acabarão na pobreza
  rationale: O nifal de ירש expressa aqui tornar-se pobre. A formulação comunica de modo natural a consequência progressiva desse modo de vida.
- source_word: קְרָעִים
  choice: trapos
  rationale: O substantivo plural indica roupas rasgadas ou andrajos; “trapos” conserva a imagem concreta de pobreza extrema.
- source_word: תַּלְבִּישׁ
  choice: vestirá
  rationale: 'Mantém diretamente a metáfora causativa do hebraico: a sonolência faz com que a pessoa fique vestida de trapos.'
- source_word: נוּמָה
  choice: sonolência
  rationale: O termo pode indicar sonolência ou sono; “sonolência” destaca o torpor associado à negligência sem excluir a alternativa lexical registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção proverbial e a metáfora de ser vestido de trapos foram preservadas.
