  text: אַל תִּיגַ֥ע לְֽ/הַעֲשִׁ֑יר מִֽ/בִּינָתְ/ךָ֥ חֲדָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/004.yaml
  text: Do not wear yourself out to get rich[a]; stop relying on your own understanding.
translation:
  language: pt
  text: Não se esgote para ficar rico[a]; pare de confiar no seu próprio entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se fatigue para enriquecer; desista de seu próprio entendimento.”'
    reason: Alternativa lexical e sintática que preserva mais de perto a formulação concisa do hebraico.
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Partícula negativa que, com a forma verbal seguinte, expressa uma proibição direta.
- source_word: תִּיגַע
  choice: se esgote
  rationale: O verbo יגע indica trabalho fatigante ou esforço que leva à exaustão; a forma reflexiva comunica naturalmente esse sentido em português.
- source_word: לְהַעֲשִׁיר
  choice: para ficar rico
  rationale: 'O infinitivo hifil de עשר expressa aqui o objetivo do esforço extenuante: tornar-se rico.'
- source_word: מִבִּינָתְךָ
  choice: de confiar no seu próprio entendimento
  rationale: בינה significa entendimento ou discernimento. Com חדל e a preposição מן, indica aquilo de que a pessoa deve desistir; a formulação explicita de modo natural a provável ideia de depender do próprio discernimento, sem ocultar a construção mais concisa do hebraico, registrada na nota.
- source_word: חֲדָל
  choice: pare
  rationale: Imperativo de חדל, com o sentido de parar, cessar ou desistir.
theological_decisions:
- issue: Sentido da segunda oração
  choice: pare de confiar no seu próprio entendimento
  alternative: cesse em seu próprio entendimento
  rationale: O hebraico é conciso e admite uma tradução mais formal. No contexto de Provérbios, a frase provavelmente adverte contra depender do próprio discernimento na busca da riqueza, e não contra o entendimento em si. A nota conserva a alternativa mais literal e a ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não se esgote” preserva a força de esforço extenuante; “ficar rico” é corrente sem ser coloquial demais. A nota registra a leitura mais formal do segundo segmento.
