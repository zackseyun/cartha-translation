lexical_decisions:
- source_word: וְהָיִיתָ
  choice: E você será
  rationale: O perfeito qal com a conjunção tem aqui força futura ou resultativa no contexto de advertência e mantém a interpelação direta na segunda pessoa.
- source_word: כְּשֹׁכֵב
  choice: como quem se deita
  rationale: O particípio descreve alguém deitado; esta formulação preserva a comparação sem interpretá-la especificamente como sono.
- source_word: בְּלֶב יָם
  choice: no coração do mar
  rationale: Mantém a imagem vívida do hebraico לֵב, que neste uso indica o interior ou meio do mar, e continua clara em português.
- source_word: וּכְשֹׁכֵב
  choice: como quem se deita
  rationale: A repetição conserva o paralelismo e a intensificação do texto hebraico.
- source_word: בְּרֹאשׁ
  choice: no alto de
  rationale: Expressa de modo natural o sentido de 'cabeça', 'topo' ou ponto mais elevado no contexto náutico.
- source_word: חִבֵּל
  choice: mastro
  rationale: No difícil contexto náutico, 'mastro' representa a interpretação tradicional e produz uma imagem coerente de posição elevada e precária; a amplitude lexical referente a cordas ou aparelhagem é registrada em nota.
