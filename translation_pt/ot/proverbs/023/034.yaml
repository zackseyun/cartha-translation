  text: And you will be like one lying down in the heart of the sea[a], like one lying down on the top of the mast.
translation:
  language: pt
  text: E você será como quem se deita no coração do mar, como quem se deita no alto do mastro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no alto da aparelhagem”. O termo hebraico é incerto e pode se referir a cordas, cabos ou outra parte do aparelho de um navio; “mastro” segue uma interpretação tradicional do contexto.'
