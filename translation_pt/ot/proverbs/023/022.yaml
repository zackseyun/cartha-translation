  text: שְׁמַ֣ע לְ֭/אָבִי/ךָ זֶ֣ה יְלָדֶ֑/ךָ וְ/אַל תָּ֝ב֗וּז כִּֽי זָקְנָ֥ה אִמֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/022.yaml
  text: Listen to your father[a], who fathered you[b], and do not despise your mother when she is old.
translation:
  language: pt
  text: Escute seu pai, aquele que gerou você,[a] e não despreze sua mãe quando ela estiver idosa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu pai, este que gerou você”. O hebraico emprega um demonstrativo (“este”) depois de “seu pai” para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando ela tiver envelhecido”. O verbo hebraico pode destacar o estado resultante de ter envelhecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע לְאָבִיךָ
  choice: Escute seu pai
  rationale: O imperativo שׁמע com ל pede atenção obediente, não apenas percepção auditiva. “Escute seu pai” é natural e mantém a força exortativa.
- source_word: זֶה יְלָדֶךָ
  choice: aquele que gerou você
  rationale: O demonstrativo זֶה retoma e enfatiza o pai mencionado, enquanto ילד, com sujeito masculino, indica que ele gerou o filho. A formulação preserva essa ênfase sem recorrer ao arcaísmo “te gerou” como única opção regional.
- source_word: וְאַל תָּבוּז
  choice: e não despreze
  rationale: בוז exprime desprezo ou desdém; “não despreze” é direto, forte e corrente em português.
- source_word: כִּי זָקְנָה אִמֶּךָ
  choice: quando ela envelhecer
  rationale: כִּי pode introduzir aqui a circunstância temporal, e o perfeito זָקְנָה retrata a chegada ao estado de velhice. “Quando ela envelhecer” comunica esse desenvolvimento com naturalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “aquele” conserva a ênfase do demonstrativo hebraico; as notas registram alternativas mais formais e a nuance aspectual do verbo.
