  text: The father of a righteous man will greatly rejoice[b][a]; he who fathers a wise son will be glad in him.
translation:
  language: pt
  text: O pai de um justo se alegrará muito[a]; quem gera um filho sábio se alegrará com ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “o pai de um justo certamente se alegrará”. A repetição da raiz verbal intensifica a alegria.
    reason: lexical_alternative
  - marker: b
    text: Ou “quem gera um sábio”. O hebraico não repete explicitamente “filho” nesta linha, embora o sentido filial seja fortemente indicado pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: גול יגול
  choice: muito se alegrará
  rationale: A construção hebraica com repetição verbal intensifica a ideia. Em português natural, o advérbio “muito” comunica essa ênfase sem reproduzir de modo artificial a duplicação.
- source_word: אֲבִי צַדִּיק
  choice: o pai de um homem justo
  rationale: A expressão em estado construto indica o pai de um indivíduo justo. “Homem justo” preserva o masculino singular e prepara o paralelismo com o filho sábio.
- source_word: צַדִּיק
  choice: homem justo
  rationale: “Justo” conserva a categoria moral do hebraico, e “homem” torna explícito o referente masculino singular no contexto filial.
- source_word: יולד
  choice: quem gera
  rationale: O particípio masculino do verbo ילד descreve aquele que gera um descendente. “Quem gera” é corrente e digno em português, sem o tom técnico de “procria” nem a possível referência materna de “dá à luz”.
- source_word: חָכָם
  choice: um filho sábio
  rationale: O hebraico diz literalmente “um sábio”, sem repetir “filho”; contudo, o paralelismo e o contexto parental tornam clara a relação filial. A explicitação favorece a compreensão, e a nota registra a forma mais literal.
- source_word: וישמח בו
  choice: ficará feliz com ele
  rationale: A expressão comunica alegria cujo motivo é o filho. “Ficará feliz com ele” é natural em português moderno e mantém o pronome masculino e a relação expressa por ב.
