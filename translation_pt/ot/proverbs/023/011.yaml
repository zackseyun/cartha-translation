  text: for their Redeemer is strong[a]; he will plead their case against you.
translation:
  language: pt
  text: pois o redentor deles é forte[a]; ele pleiteará a causa deles contra você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o parente-resgatador deles” ou “o defensor deles”. O termo hebraico גֹאֵל refere-se a quem age para resgatar, defender ou reivindicar os direitos de um membro da família.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição anterior e preserva de modo natural a força causal no contexto.
- source_word: גֹאֲלָם
  choice: o Redentor deles
  rationale: גאל designa quem resgata, protege ou reivindica os direitos de um membro da família. “Redentor” conserva de forma concisa as ressonâncias jurídicas e teológicas, enquanto a nota registra as nuances de parentesco e defesa.
- source_word: חָזָק
  choice: forte
  rationale: Expressa diretamente o poder e a capacidade de agir em favor dos vulneráveis, sem elevar desnecessariamente o registro.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente dá ênfase ao sujeito; sua expressão explícita em português preserva esse destaque.
- source_word: יָרִיב אֶת רִיבָם
  choice: defenderá a causa deles
  rationale: A construção cognata de ריב tem caráter jurídico. Esta formulação portuguesa comunica que o Redentor assumirá a defesa da causa deles, com linguagem natural e digna.
- source_word: אִתָּךְ
  choice: contra você
  rationale: Com ריב, a preposição indica a parte adversária da contenda; “contra você” torna clara essa relação jurídica e hostil.
theological_decisions:
- issue: Tradução de גֹאֵל no contexto sapiencial
  choice: Redentor
  alternative: parente-resgatador; defensor
  rationale: “Redentor” preserva o peso jurídico e teológico do termo sem limitar o referente à vingança nem explicitar em excesso a relação de parentesco. A nota mantém disponíveis as nuances legítimas do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Defenderá a causa” mantém a imagem jurídica em expressão idiomática; a colocação “deles” evita formas menos internacionais como “seu Redentor”, que poderiam gerar ambiguidade de referente.
