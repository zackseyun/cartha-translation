  text: וְ/תַעְלֹ֥זְנָה כִלְיוֹתָ֑/י בְּ/דַבֵּ֥ר שְׂ֝פָתֶ֗י/ךָ מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/016.yaml
  text: and my inmost being will rejoice when your lips speak what is upright[a][b].
translation:
  language: pt
  text: e o meu íntimo se alegrará quando os seus lábios falarem o que é reto[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “meus rins”, expressão hebraica que se refere ao íntimo da pessoa ou às suas emoções mais profundas.
    reason: cultural_note
  - marker: b
    text: Ou “o que é certo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַעְלֹזְנָה
  choice: se alegrará
  rationale: O verbo עלז expressa alegria intensa ou exultação. “Se alegrará” é natural em português contemporâneo e preserva o sentido futuro.
- source_word: כִלְיוֹתָי
  choice: o meu íntimo
  rationale: Literalmente, “meus rins”; no hebraico, é uma imagem para o íntimo da pessoa ou suas emoções mais profundas. “O meu íntimo” comunica esse sentido sem substituir a imagem por “coração”.
- source_word: בְּדַבֵּר
  choice: quando ... falarem
  rationale: A preposição ב com o infinitivo construto tem aqui valor temporal. A formulação portuguesa é idiomática e mantém essa relação sintática.
- source_word: שְׂפָתֶיךָ
  choice: os seus lábios
  rationale: Conserva a imagem poética concreta do hebraico e é clara em português.
- source_word: מֵישָׁרִים
  choice: o que é reto
  rationale: O termo denota retidão ou aquilo que é direito, frequentemente em sentido ético. “O que é reto” preserva a imagem lexical e se encaixa naturalmente com “falar”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem poética dos “lábios” foi preservada; o hebraísmo opaco “meus rins” foi traduzido pelo sentido e explicado em nota.
