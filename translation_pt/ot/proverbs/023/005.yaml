base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/005.yaml
  text: Will you let your eyes fly to it[a], and it is gone? For it surely makes wings for itself; like an eagle, it flies to the heavens.
translation:
  language: pt
  text: Você fará seus olhos voarem em direção a ela, e ela já terá desaparecido? Pois certamente fará asas para si; como a águia[a], voará para os céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um abutre”; o hebraico néšer pode designar de modo mais amplo uma grande ave de rapina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָעוּף
  choice: Você deixará ... voarem
  rationale: Preserva a imagem vívida do causativo de עוּף, literalmente “fazer voar”, e a forma interrogativa, ao mesmo tempo que produz uma frase compreensível em português.
- source_word: עֵינֶיךָ
  choice: seus olhos
  rationale: A tradução literal conserva a personificação e a imagem poética hebraica, em vez de reduzi-las ao termo abstrato “olhar”.
- source_word: בּוֹ
  choice: até ela
  rationale: O pronome retoma a riqueza mencionada no contexto anterior; o feminino concorda naturalmente com “riqueza” em português, e “até” combina com a metáfora de olhos que voam.
- source_word: וְאֵינֶנּוּ
  choice: e ela já não estará lá
  rationale: A expressão hebraica significa literalmente que aquilo “não está” ou “não existe”. Esta formulação comunica seu desaparecimento repentino sem eliminar por completo a construção original.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação para o desaparecimento súbito da riqueza.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: certamente fará
  rationale: O infinitivo absoluto seguido do imperfeito intensifica o verbo; “certamente” reproduz essa ênfase.
- source_word: לּוֹ כְנָפַיִם
  choice: asas para si
  rationale: Conserva tanto o sentido reflexivo do dativo לּוֹ quanto a imagem direta de a riqueza produzir suas próprias asas.
- source_word: כְנֶשֶׁר
  choice: como a águia
  rationale: “Águia” mantém a imagem tradicional e imediatamente reconhecível de uma grande ave de rapina; como a identificação zoológica de נֶשֶׁר não é inequívoca, a alternativa “abutre” é registrada em nota.
- source_word: וְעָף
  choice: voará
  rationale: O futuro acompanha naturalmente a sequência verbal iniciada por “fará”, apresentando o voo como resultado de a riqueza criar asas.
- source_word: הַשָּׁמָיִם
  choice: para os céus
  rationale: Conserva o plural e o registro poético elevado do hebraico, sem sugerir necessariamente o céu como destino teológico.
theological_decisions: []
