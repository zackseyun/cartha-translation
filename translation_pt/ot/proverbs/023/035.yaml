base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/035.yaml
  text: “They struck me[a], but I was not hurt; they beat me, but I did not know it[b]. When shall I awake? I will seek it again.”
translation:
  language: pt
  text: “Bateram-me[a], mas não fiquei ferido; espancaram-me, mas não percebi. Quando vou acordar? Vou procurá-lo outra vez[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bateram-me, mas não senti dor”. O verbo hebraico pode indicar estar doente, enfraquecido, ferido ou sentir dor.'
    reason: lexical_alternative
  - marker: b
    text: O pronome em “vou procurá-lo outra vez” provavelmente se refere ao vinho ou à bebida forte mencionados no contexto.
    reason: cross_reference
lexical_decisions:
- source_word: הִכּוּנִי
  choice: Bateram em mim
  rationale: Traduz naturalmente נכה como agressão física, sem especificar além do hebraico o modo do golpe.
- source_word: בַל חָלִיתִי
  choice: mas não senti dor
  rationale: חלה pode indicar estar enfermo, enfraquecido ou ferido; no contexto dos golpes e da insensibilidade causada pela embriaguez, esta formulação preserva a nuance de não sentir o dano, sem medicalizar a frase.
- source_word: הֲלָמוּנִי
  choice: espancaram-me
  rationale: הלם denota golpear; a escolha distingue o segundo verbo do primeiro e mantém a intensificação natural do paralelismo.
- source_word: בַל יָדָעְתִּי
  choice: mas não percebi
  rationale: ידע significa literalmente saber/conhecer, mas aqui expressa falta de consciência dos golpes. “Não percebi” comunica esse sentido em português corrente.
- source_word: מָתַי אָקִיץ
  choice: Quando vou acordar?
  rationale: Mantém a imagem literal de despertar e soa natural na fala direta em português moderno.
- source_word: אוֹסִיף אֲבַקְשֶׁנּוּ עוֹד
  choice: Vou procurar isso de novo
  rationale: יסף com עוד expressa repetição, enquanto בקשׁ significa buscar/procurar. “Isso” preserva a referência pronominal masculina do hebraico sem inserir “vinho” no texto.
theological_decisions:
- issue: Referente do sufixo em אֲבַקְשֶׁנּוּ
  choice: isso
  alternative: o vinho / a bebida
  rationale: O contexto aponta provavelmente para o vinho ou a bebida, mas o versículo usa apenas um pronome. A tradução mantém essa referência implícita e a nota esclarece a leitura contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tom entorpecido e compulsivo do bêbado; a repetição dos verbos de agressão é preservada com variação lexical natural.
