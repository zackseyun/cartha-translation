base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/027.yaml
  text: For a prostitute is a deep pit[a], and a foreign woman is a narrow well.
translation:
  language: pt
  text: 'Pois a prostituta é uma cova profunda,

    e a mulher estrangeira[a], um poço estreito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulher estranha”; alguns traduzem de forma mais interpretativa por “adúltera”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação para a advertência anterior, preservando de modo natural a força explicativa do provérbio.
- source_word: שׁוּחָה עֲמֻקָּה
  choice: cova profunda
  rationale: Mantém a imagem concreta de uma cavidade funda e perigosa, sem explicitar no texto principal a ideia interpretativa de armadilha.
- source_word: זוֹנָה
  choice: prostituta
  rationale: É uma tradução moderna, direta e digna do termo hebraico, evitando tanto arcaísmo quanto linguagem desnecessariamente grosseira.
- source_word: וּבְאֵר
  choice: e ... um poço
  rationale: בְּאֵר designa normalmente um poço; a conjunção hebraica é representada por “e”.
- source_word: צָרָה
  choice: estreito
  rationale: Preserva a imagem concreta de um poço apertado, da qual decorre a noção de confinamento, sem acrescentá-la explicitamente.
- source_word: נָכְרִיָּה
  choice: mulher estrangeira
  rationale: Reproduz o sentido lexical básico e mantém a ambiguidade própria da linguagem de advertência em Provérbios; opções mais interpretativas ficam na nota.
theological_decisions:
- issue: Sentido de נָכְרִיָּה nas advertências da literatura sapiencial
  choice: mulher estrangeira
  alternative: mulher estranha; adúltera
  rationale: Embora o termo tenha conotações morais e sociais no contexto de Provérbios, “mulher estrangeira” conserva seu sentido lexical sem identificar de maneira indevidamente específica a mulher como adúltera. A nota registra as leituras alternativas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo poético foi preservado em duas linhas. A elipse de “é” no segundo membro soa natural em português e mantém a concisão proverbial. O marcador foi colocado após “mulher estrangeira”, expressão à qual a alternativa lexical se refere.
