base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/028.yaml
  text: Indeed[a], she lies in wait like a robber[b], and she increases the treacherous among men.
translation:
  language: pt
  text: De fato, ela fica à espreita como um assaltante[a] e multiplica os desleais entre os seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como alguém que ataca de repente”. O termo hebraico חֶתֶף é raro e de sentido incerto; pode indicar um assaltante ou, mais genericamente, um ataque súbito e violento.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “entre o ser humano”; אָדָם é usado coletivamente, referindo-se à humanidade em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף הִיא
  choice: Ela também
  rationale: אַף liga esta afirmação ao contexto anterior com sentido aditivo e enfático; “também” soa natural e mantém a referência feminina explícita de הִיא.
- source_word: כְּחֶתֶף
  choice: como um assaltante
  rationale: חֶתֶף é um termo raro e difícil. Em combinação com “fica à espreita”, provavelmente retrata alguém que ataca e toma pela força; “assaltante” preserva a imagem predatória sem tornar a interpretação excessivamente específica.
- source_word: תֶּאֱרֹב
  choice: fica à espreita
  rationale: O verbo ארב descreve esperar escondido para atacar; a expressão portuguesa comunica com naturalidade a ideia de emboscada.
- source_word: וּבוֹגְדִים
  choice: os desleais
  rationale: בוגדים designa pessoas que agem com deslealdade ou perfídia. “Desleais” mantém a categoria moral ampla adequada à literatura sapiencial.
- source_word: בְּאָדָם
  choice: entre os seres humanos
  rationale: אָדָם tem aqui sentido coletivo e genérico, abrangendo a humanidade, não apenas indivíduos do sexo masculino.
- source_word: תּוֹסִף
  choice: multiplica
  rationale: O hifil de יסף significa acrescentar ou aumentar; neste contexto, “multiplica” expressa de modo conciso que ela faz crescer o número dos desleais.
