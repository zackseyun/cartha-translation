  text: כִּ֤י כְּמוֹ שָׁעַ֥ר בְּ/נַפְשׁ֗/וֹ כֶּ֫ן ה֥וּא אֱכֹ֣ל וּ֭/שְׁתֵה יֹ֣אמַר לָ֑/ךְ וְ֝/לִבּ֗/וֹ בַּל עִמָּֽ/ךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/007.yaml
  text: 'For as he calculates within himself[a], so he is: “Eat and drink,” he says to you, but his heart is not with you.'
translation:
  language: pt
  text: Pois, como ele calcula em seu íntimo, assim ele é[a]. “Coma e beba”, ele diz a você, mas o coração dele não está com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, como ele pensa em seu íntimo, assim ele é”. O verbo hebraico pode significar “pensar”, mas sugere mais especificamente calcular, estimar ou fazer contas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da advertência no contexto e preserva a força causal-explicativa do provérbio.
- source_word: כְּמוֹ...כֵּן
  choice: assim como... assim
  rationale: Reproduz de modo natural em português a estrutura comparativa correlativa do hebraico.
- source_word: שָׁעַר
  choice: calcula
  rationale: O verbo sugere avaliar, estimar ou fazer contas interiormente; no contexto, retrata o anfitrião que calcula o custo do que oferece.
- source_word: בְּנַפְשׁוֹ
  choice: consigo mesmo
  rationale: נֶפֶשׁ designa aqui o íntimo da pessoa, não uma 'alma' em sentido técnico; a expressão comunica uma avaliação privada e interior.
- source_word: כֵּן הוּא
  choice: assim ele é
  rationale: Mantém a formulação breve e proverbial sem explicar além do que o hebraico afirma.
- source_word: אֱכֹל וּשְׁתֵה
  choice: Coma e beba
  rationale: Traduz diretamente os imperativos do convite e preserva o contraste entre as palavras do anfitrião e sua disposição interior.
- source_word: יֹאמַר לָךְ
  choice: ele lhe diz
  rationale: O presente é natural no discurso proverbial em português; 'lhe' representa o destinatário singular.
- source_word: וְלִבּוֹ
  choice: mas o coração dele
  rationale: A conjunção tem valor adversativo pelo contraste contextual entre o convite verbal e a verdadeira disposição do anfitrião.
- source_word: בַּל
  choice: não está
  rationale: Expressa de forma idiomática a negação enfática do hebraico no predicado português.
- source_word: עִמָּךְ
  choice: com você
  rationale: 'Preserva a imagem relacional: interiormente, o anfitrião não está genuinamente unido ao convidado nem favoravelmente disposto para com ele.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A alternância entre “lhe” e “você” evita a ambiguidade de “seu coração” e mantém a referência ao anfitrião clara. A tradução conserva a ambiguidade proverbial de “assim ele é”, enquanto a nota registra a alternativa lexical de שָׁעַר.
