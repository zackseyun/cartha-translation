base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/031.yaml
  text: Do not look at wine when it is red[a], when it sparkles in the cup[b], when it goes down smoothly.
translation:
  language: pt
  text: Não fique olhando para o vinho quando está vermelho, quando brilha no copo[a], quando desce suavemente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quando põe seu olho no copo”, expressão hebraica que descreve a aparência atraente do vinho.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “segue em linha reta”; aqui, o sentido provável é que o vinho desce com facilidade ou suavidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֵּרֶא
  choice: Não fique olhando
  rationale: אַל com o imperfeito expressa proibição. A construção portuguesa comunica aqui não apenas ver, mas deter deliberadamente o olhar na aparência sedutora do vinho.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente comum e direto do substantivo hebraico.
- source_word: כִּי יִתְאַדָּם
  choice: quando está vermelho
  rationale: No encadeamento poético, כִּי introduz a circunstância em que o vinho atrai o olhar; o verbo descreve sua aparência avermelhada.
- source_word: כִּי יִתֵּן בַכּוֹס עֵינוֹ
  choice: quando reluz no copo
  rationale: A expressão literal, 'quando põe/dá seu olho no copo', descreve poeticamente a aparência atraente do vinho. 'Reluz' comunica isso de modo natural sem tornar a imagem excessivamente explícita no texto principal.
- source_word: יִתְהַלֵּךְ בְּמֵישָׁרִים
  choice: desce suavemente
  rationale: Embora a formulação hebraica seja literalmente algo como 'anda em retidão', no contexto ela descreve o vinho passando com facilidade ao ser bebido. A tradução preserva o sentido contextual, e a nota registra a imagem literal.
