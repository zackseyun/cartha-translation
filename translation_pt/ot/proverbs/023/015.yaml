  text: My son[a], if your heart is wise, my heart also will rejoice.
translation:
  language: pt
  text: Meu filho, se o seu coração for sábio, meu coração também se alegrará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «também eu me alegrarei»; o hebraico diz literalmente «meu coração, também eu», com ênfase pessoal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Traduz literalmente o vocativo masculino singular e mantém a forma paternal característica de Provérbios.
- source_word: אִם
  choice: se
  rationale: Preserva o sentido condicional direto da partícula hebraica, sem convertê-lo em expectativa temporal.
- source_word: חָכַם לִבֶּךָ
  choice: o seu coração for sábio
  rationale: O perfeito estativo na oração condicional descreve a condição de possuir sabedoria; em português, o futuro do subjuntivo é a forma natural depois de «se».
- source_word: לִבֶּךָ / לִבִּי
  choice: seu coração / meu coração
  rationale: Mantém a imagem antropológica hebraica e o paralelismo poético entre o interior do filho e o do pai.
- source_word: יִשְׂמַח
  choice: se alegrará
  rationale: Expressa naturalmente o resultado futuro da condição e conserva o tom digno da literatura sapiencial.
- source_word: גַם אֲנִי
  choice: também
  rationale: Comunica no texto a força aditiva da expressão; a possível ênfase pessoal «até eu / eu mesmo» é registrada em nota.
