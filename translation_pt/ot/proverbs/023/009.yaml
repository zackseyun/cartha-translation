  text: בְּ/אָזְנֵ֣י כְ֭סִיל אַל תְּדַבֵּ֑ר כִּֽי יָ֝ב֗וּז לְ/שֵׂ֣כֶל מִלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/009.yaml
  text: Do not speak in the hearing of a fool[b][a], for he will despise the wisdom of your words.
translation:
  language: pt
  text: Não fale aos ouvidos do insensato[a], pois ele desprezará o bom senso das suas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos ouvidos do insensato”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  choice: aos ouvidos de
  rationale: Preserva a imagem concreta do hebraico e permanece natural em português, indicando fala dirigida a alguém que pode ouvi-la.
- source_word: כְסִיל
  choice: insensato
  rationale: Termo tradicional e adequado à literatura sapiencial para alguém moral e intelectualmente obstinado, não apenas pouco inteligente.
- source_word: אַל תְּדַבֵּר
  choice: Não fale
  rationale: Expressa diretamente a proibição hebraica em linguagem atual e concisa.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo compacto a razão da proibição.
- source_word: יָב֗וּז
  choice: desprezará
  rationale: Comunica a rejeição marcada por desdém expressa pelo verbo hebraico.
- source_word: לְ/שֵׂכֶל
  choice: o bom senso
  rationale: שֵׂכֶל pode designar discernimento, prudência ou sensatez; aqui, “bom senso” combina naturalmente com “das suas palavras” sem ampliar o sentido para toda a sabedoria.
- source_word: מִלֶּֽי/ךָ
  choice: das suas palavras
  rationale: Mantém a relação genitiva e a expressão concreta do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concisão proverbial. A forma “insensato” conserva a carga moral do vocabulário sapiencial; “bom senso” preserva a nuance de שֵׂכֶל sem resolver o termo como “sabedoria” em sentido mais amplo.
