  verdict: approve
  source_fidelity: 'A tradução preserva com precisão as duas proibições do hebraico: não deslocar uma divisa/marco estabelecido desde tempos antigos e não entrar nos campos dos órfãos. «Marco antigo» comunica adequadamente o referente concreto de גְּבוּל neste contexto, e «entre nos campos» reproduz bem o verbo de movimento com בִּ.'
  naturalness: O texto é conciso, claro e natural em português moderno de ampla compreensão. «Não desloque um marco antigo nem entre nos campos dos órfãos» mantém o paralelismo proverbial e o registro apropriado. A vírgula final é justificável, pois a unidade sintática prossegue no versículo seguinte.
  terminology: «Marco» é uma boa opção contextual para a divisa de propriedade; «antigo» representa adequadamente עוֹלָם no sentido de longa data. «Órfãos» é corrente e inteligível; embora יְתוֹמִים possa ter mais especificamente o sentido de pessoas sem pai, não há perda indevida de sentido no uso português contemporâneo. A nota oferece de modo apropriado «limite antigo» como alternativa lexical.
