  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם וּ/בִ/שְׂדֵ֥י יְ֝תוֹמִ֗ים אַל תָּבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/010.yaml
  text: Do not move an ancient boundary marker[a], and do not enter the fields of orphans,
translation:
  language: pt
  text: Não desloque um marco antigo[a] nem entre nos campos dos órfãos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não remova um limite antigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסֵּג
  choice: desloque
  rationale: O verbo נסג, neste contexto, indica tirar do lugar ou recuar um limite de propriedade. “Desloque” preserva a ação concreta sem explicitar além do hebraico a intenção de usurpação.
- source_word: גְּבוּל
  choice: marco
  rationale: Embora גְּבוּל possa designar limite ou fronteira, aqui o verbo favorece a referência concreta ao marco que assinala a divisa de uma propriedade.
- source_word: עוֹלָם
  choice: antigo
  rationale: Neste contexto, עוֹלָם indica algo estabelecido desde tempos remotos, e não eternidade em sentido metafísico.
- source_word: וּבִשְׂדֵי
  choice: nem ... nos campos de
  rationale: A conjunção coordenada após uma proibição é expressa naturalmente por “nem”; com o verbo de movimento, בִּ assume o sentido de entrada em determinado espaço.
- source_word: יְתוֹמִים
  choice: órfãos
  rationale: O termo designa pessoas privadas do pai e vulneráveis socialmente. “Órfãos” é claro e corrente em português, embora possa sugerir, no uso moderno, perda de ambos os pais.
- source_word: תָּבֹא
  choice: entre
  rationale: O verbo בוא, com a preposição e o campo como destino, significa entrar. A formulação conserva a proibição direta e deixa o contexto indicar a ideia de invasão ou apropriação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. “Marco antigo” preserva a imagem concreta da divisa tradicional; a nota registra a leitura mais abstrata de גְּבוּל como “limite”. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
