    rationale: שַׁלְוָה pode denotar segurança, tranquilidade, facilidade ou complacência. Embora a segurança seja perigosamente complacente no contexto, «falsa» restringe e intensifica o sentido além do que é lexicalmente expresso. «Complacência» preserva a leitura contextual sem essa adição.
  - severity: low
    issue: «Inexperientes» é possível, mas é menos específico que «ingênuos» para פְּתָיִם.
    rationale: O termo sapiencial se refere especialmente aos crédulos/suscetíveis, e não somente a pessoas sem experiência. «Ingênuos» conserva melhor essa nuance em português corrente.
