- from: 'Pois o desvio dos inexperientes os matará,

    e a falsa segurança dos insensatos os destruirá.[a]'
  to: 'Pois o desvio dos ingênuos os matará,

    e a complacência dos insensatos os destruirá.[a]'
  rationale: A revisão elimina a adição interpretativa de «falsa» e emprega «complacência» para a segurança acomodada que o contexto condena. Também substitui «inexperientes» por «ingênuos», termo mais próximo da credulidade implicada por פְּתָיִם. A nota preserva alternativas lexicais legítimas para os dois substantivos principais.
