  text: כִּ֤י מְשׁוּבַ֣ת פְּתָיִ֣ם תַּֽהַרְגֵ֑/ם וְ/שַׁלְוַ֖ת כְּסִילִ֣ים תְּאַבְּדֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/032.yaml
  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
translation:
  language: pt
  text: 'Pois o desvio dos ingênuos os matará,

    e a complacência dos insensatos os destruirá.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois o afastamento dos ingênuos os matará, e a segurança dos insensatos os destruirá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão explicativa da advertência anterior e mantém a ligação concisa própria do provérbio.
- source_word: מְשׁוּבַת
  choice: desvio
  rationale: Expressa o ato ou a disposição de se afastar do caminho da sabedoria sem acrescentar conotações doutrinárias posteriores presentes em termos como “apostasia”.
- source_word: פְּתָיִם
  choice: inexperientes
  rationale: Em Provérbios, designa pessoas ingênuas, suscetíveis e ainda sem formação moral; “inexperientes” é natural e evita sugerir mera deficiência intelectual.
- source_word: תַּהַרְגֵם
  choice: os matará
  rationale: Reproduz diretamente a força severa do verbo הרג e explicita corretamente o objeto pronominal plural.
- source_word: וְשַׁלְוַת
  choice: e a falsa segurança
  rationale: שַׁלְוָה pode indicar tranquilidade, facilidade ou segurança; neste contexto, trata-se de uma segurança enganosa e complacente que leva os insensatos à ruína.
- source_word: כְּסִילִים
  choice: dos insensatos
  rationale: Termo corrente e digno para a categoria sapiencial dos moralmente obstinados, não apenas dos intelectualmente incapazes.
- source_word: תְּאַבְּדֵם
  choice: os destruirá
  rationale: Preserva a força causativa de אבד no piel e o paralelismo severo com “os matará”.
