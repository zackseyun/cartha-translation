  yaml_path: translation/ot/proverbs/001/005.yaml
  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
translation:
  language: pt
  text: Que o sábio ouça e aumente seu aprendizado, e que o discernente adquira conselhos sábios[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O sábio ouvirá e aumentará seu aprendizado, e o discernente adquirirá conselhos sábios”; os verbos hebraicos no imperfeito também podem ser entendidos de modo descritivo ou prospectivo, embora aqui tenham sido traduzidos como exortação por causa do contexto instrutivo.'
    reason: alternative_reading
  - marker: b
    text: “Conselhos sábios” traduz um termo que também pode significar “orientações”, “direção” ou, mais literalmente, “condução”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: Que ... ouça
  rationale: O imperfeito hebraico na terceira pessoa pode ser descritivo ou prospectivo, mas, no contexto instrutivo, admite naturalmente força exortativa. A construção portuguesa com “que” preserva essa força sem transformar a frase em ordem direta.
- source_word: חָכָם
  choice: o sábio
  rationale: Mantém o substantivo masculino singular representativo do hebraico e soa natural no gênero sapiencial em português.
- source_word: וְיֹסֶף
  choice: e aumente
  rationale: O verbo יסף significa acrescentar ou aumentar. Com “aprendizado”, “aumente” comunica de modo claro o progresso pretendido.
- source_word: לֶקַח
  choice: seu aprendizado
  rationale: לֶקַח pode designar instrução recebida, ensino ou aprendizado. Neste contexto, “aprendizado” combina naturalmente com a ideia de aumentar, enquanto “seu” explicita em português aquilo que o sábio acumula sem alterar o sentido.
- source_word: נָבוֹן
  choice: o homem de discernimento
  rationale: Expressa a pessoa caracterizada por entendimento ou discernimento e preserva a forma masculina singular representativa do hebraico.
- source_word: תַּחְבֻּלוֹת
  choice: orientação
  rationale: O termo plural pode indicar direção hábil, conselhos ou estratégias, tendo ao fundo a imagem de conduzir ou pilotar. “Orientação” preserva a amplitude adequada ao contexto sapiencial.
- source_word: יִקְנֶה
  choice: adquira
  rationale: קנה significa adquirir ou obter. “Adquira” conserva a imagem de alcançar algo valioso e é idiomático neste contexto.
