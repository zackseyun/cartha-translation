  text: כִּֽי חִ֭נָּם מְזֹרָ֣ה הָ/רָ֑שֶׁת בְּ֝/עֵינֵ֗י כָל בַּ֥עַל כָּנָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/017.yaml
  text: For the net is spread in vain in the sight of any bird[a].
translation:
  language: pt
  text: Pois é inútil estender a rede à vista de qualquer ave.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “qualquer possuidor de asa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da advertência anterior e preserva a força causal do hebraico.
- source_word: חִנָּם
  choice: é inútil
  rationale: Neste contexto, o advérbio exprime a inutilidade ou futilidade da ação, não ausência de causa ou gratuidade.
- source_word: מְזֹרָה
  choice: estender
  rationale: A forma passiva do verbo זרה descreve a rede aberta ou espalhada; em português, “estender a rede” é a expressão natural para essa ação.
- source_word: הָרָשֶׁת
  choice: a rede
  rationale: רֶשֶׁת designa a rede usada como armadilha e mantém clara a imagem de caça.
- source_word: בְּעֵינֵי
  choice: à vista de
  rationale: Equivale literalmente a “aos olhos de” e aqui indica que a armadilha é preparada de modo visível.
- source_word: כָל
  choice: qualquer
  rationale: Com a expressão singular seguinte, comunica adequadamente o sentido genérico do hebraico.
- source_word: בַּעַל כָּנָף
  choice: ave
  rationale: A expressão significa literalmente “possuidor de asa”; “ave” é seu equivalente idiomático e conciso no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção proverbial foi mantida concisa; “à vista de” preserva a imagem visual, e a nota registra o caráter concreto da expressão hebraica para ave.
