  text: בְּנִ֡/י אִם יְפַתּ֥וּ/ךָ חַ֝טָּאִ֗ים אַל תֹּבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
translation:
  language: pt
  text: Meu filho[a], se pecadores tentarem atrair você, não consinta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meu filho” preserva a forma masculina singular do hebraico e o caráter paterno do apelo sapiencial.
    reason: cultural_note
  - marker: b
    text: 'Ou: “não ceda” ou “não aceite”. O verbo hebraico significa estar disposto ou consentir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva o vocativo masculino singular e o tom paterno da instrução sapiencial.
- source_word: אִם
  choice: se
  rationale: Partícula condicional que introduz uma situação hipotética.
- source_word: יְפַתּוּךָ
  choice: tentarem seduzir você
  rationale: O piel de פתה expressa persuasão ou atração enganosa para um curso de ação. A construção com “tentarem” soa natural em português e “seduzir” conserva a força moral sem exigir conotação sexual.
- source_word: חַטָּאִים
  choice: pecadores
  rationale: Plural substantivado que designa pessoas caracterizadas pelo pecado; “pecadores” é direto e natural.
- source_word: אַל תֹּבֵא
  choice: não consinta
  rationale: A proibição com אבה adverte contra estar disposto, concordar ou ceder ao convite; “não consinta” preserva com precisão essa dimensão volitiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” evita regionalismo excessivo; a ordem da frase acompanha naturalmente o hebraico sem soar rígida.
