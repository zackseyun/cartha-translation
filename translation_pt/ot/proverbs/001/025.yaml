  text: וַ/תִּפְרְע֥וּ כָל עֲצָתִ֑/י וְ֝/תוֹכַחְתִּ֗/י לֹ֣א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/025.yaml
  text: but you ignored all my counsel[b][a], and you were unwilling to accept my reproof—
translation:
  language: pt
  text: mas vocês ignoraram todos os meus conselhos[a] e não quiseram aceitar a minha repreensão[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixaram de lado todos os meus conselhos” ou “desprezaram todos os meus conselhos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “recusaram a minha repreensão”. O hebraico enfatiza a indisposição: “não estiveram dispostos a aceitar a minha repreensão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְרְעוּ
  choice: vocês desprezaram
  rationale: O verbo פרע, neste contexto, indica deixar de lado ou desconsiderar deliberadamente. “Desprezaram” comunica a rejeição intencional e forma um paralelo natural com “não quiseram”, sem sugerir um ato violento.
- source_word: כָל
  choice: todos
  rationale: É o quantificador comum “todo”. O plural concorda naturalmente em português com “conselhos”.
- source_word: עֲצָתִי
  choice: os meus conselhos
  rationale: עֵצָה designa conselho ou orientação sábia. O plural idiomático em português expressa bem o sentido coletivo do singular hebraico e mantém linguagem clara e digna.
- source_word: וְתוֹכַחְתִּי
  choice: a minha repreensão
  rationale: תּוֹכַחַת denota censura corretiva ou repreensão, especialmente em Provérbios. “Repreensão” conserva tanto a força disciplinadora quanto o registro sapiencial.
- source_word: לֹא אֲבִיתֶם
  choice: não quiseram aceitar
  rationale: אָבָה com negação enfatiza falta de disposição ou recusa. “Não quiseram aceitar” preserva esse componente volitivo e explicita de modo natural em português a relação com “a minha repreensão”.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês”, mantém o tom direto e solene da fala da Sabedoria e conserva a tensão entre desconsiderar o conselho e não estar disposto a receber correção.
