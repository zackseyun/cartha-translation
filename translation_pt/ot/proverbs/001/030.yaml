  text: לֹא אָב֥וּ לַ/עֲצָתִ֑/י נָ֝אֲצ֗וּ כָּל תּוֹכַחְתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/030.yaml
  text: They were unwilling to accept my counsel[b][a]; they despised all my reproof.
translation:
  language: pt
  text: Não quiseram aceitar o meu conselho; desprezaram toda a minha repreensão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a minha correção” ou “toda a minha censura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אָבוּ
  choice: Não quiseram
  rationale: A combinação da negação com אָבוּ expressa falta de disposição ou recusa. “Não quiseram” preserva de modo natural o aspecto volitivo, sem tornar a ação mais enfática do que o hebraico exige.
- source_word: לַעֲצָתִי
  choice: aceitar o meu conselho
  rationale: עֵצָה significa “conselho”. O verbo “aceitar” explicita em português a resposta implícita exigida pela construção com “não quiseram”, mantendo o sentido sem acréscimo substancial.
- source_word: נָאֲצוּ
  choice: desprezaram
  rationale: O verbo indica rejeição acompanhada de desprezo. “Desprezaram” é claro, forte e adequado ao tom solene da fala da Sabedoria.
- source_word: כָּל
  choice: toda
  rationale: O quantificador abrange integralmente a repreensão; a forma feminina concorda naturalmente com “repreensão”.
- source_word: תּוֹכַחְתִּי
  choice: a minha repreensão
  rationale: תּוֹכַחַת pode indicar repreensão, correção ou censura. “Repreensão” conserva a força disciplinadora e o registro sapiencial, sem soar excessivamente técnico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem paralela das duas orações e a intensidade crescente entre não querer aceitar e desprezar foram preservadas.
