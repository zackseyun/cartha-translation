  text: to know wisdom and instruction[a], to understand words of insight[b],
translation:
  language: pt
  text: para conhecer a sabedoria e a instrução[a], para compreender palavras de discernimento[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplina”. O termo hebraico também inclui a ideia de formação corretiva, não apenas ensino.
