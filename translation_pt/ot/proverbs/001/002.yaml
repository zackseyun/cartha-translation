  - marker: b
    text: Ou “ditos de entendimento” / “ditos de discernimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: para conhecer
  rationale: O ל prefixado ao infinitivo construto expressa propósito na sequência do prólogo (vv. 2–6). “Para conhecer” preserva essa função e soa natural em português.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente consagrado em Provérbios, abrangendo sabedoria prática e moral, não apenas capacidade intelectual.
- source_word: מוּסָר
  choice: instrução
  rationale: Neste enunciado programático, “instrução” comunica de modo claro o sentido pedagógico amplo; a nota preserva a nuance de disciplina e formação corretiva.
- source_word: לְהָבִין
  choice: para compreender
  rationale: Infinitivo de propósito paralelo a לָדַעַת. “Compreender” é natural e mantém o paralelismo sem explicitar além do hebraico.
- source_word: אִמְרֵי
  choice: palavras de
  rationale: O plural em estado construto designa palavras, expressões ou ditos. “Palavras de” é amplo, natural e preserva a relação construta.
- source_word: בִינָה
  choice: discernimento
  rationale: Expressa entendimento perceptivo e evita a repetição estilisticamente pesada de “compreender palavras de compreensão”.
