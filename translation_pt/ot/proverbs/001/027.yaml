id: PRO.1.27
reference: Proverbs 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/בֹ֤א כ/שאוה פַּחְדְּ/כֶ֗ם וְֽ֭/אֵידְ/כֶם כְּ/סוּפָ֣ה יֶאֱתֶ֑ה בְּ/בֹ֥א עֲ֝לֵי/כֶ֗ם צָרָ֥ה וְ/צוּקָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/027.yaml
  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
translation:
  language: pt
  text: quando o que vocês temem vier como devastação[a], e a calamidade de vocês chegar como um vendaval, quando aflição e angústia vierem sobre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma tempestade”; o termo hebraico pode destacar tanto a ruína devastadora como a força impetuosa de uma tempestade.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹא
  choice: quando ... vier
  rationale: A preposição ב com o infinitivo construto de בוא introduz uma oração temporal; esta formulação é natural em português e preserva seu valor temporal.
- source_word: כְשָׁאוָה
  choice: como devastação
  rationale: O substantivo enfatiza ruína devastadora e súbita. A escolha retém esse sentido lexical, enquanto a nota registra a leitura imagética possível em termos de tempestade.
- source_word: פַּחְדְּכֶם
  choice: o que vocês temem
  rationale: פחד pode designar tanto o medo quanto aquilo que se teme. A formulação é clara em português e combina com a chegada concreta do desastre, sem negar a ambiguidade lexical.
- source_word: וְאֵידְכֶם
  choice: e a calamidade de vocês
  rationale: איד designa desastre ou calamidade; 'calamidade' mantém o tom poético e solene sem se tornar arcaico.
- source_word: כְּסוּפָה
  choice: como um vendaval
  rationale: סופה denota uma tempestade de vento violenta. 'Vendaval' é corrente, vívido e adequado ao paralelismo poético.
- source_word: יֶאֱתֶה
  choice: chegar
  rationale: O verbo significa vir ou chegar; 'chegar' evita repetição imediata sem alterar o sentido.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: על descreve a adversidade sobrevindo às pessoas; 'sobre vocês' preserva essa relação de modo natural.
- source_word: צָרָה
  choice: aflição
  rationale: צרה expressa dificuldade, aperto ou aflição. A escolha distingue o termo de צוקה sem apagar a sobreposição poética.
- source_word: וְצוּקָה
  choice: e angústia
  rationale: צוקה comunica pressão, aperto e angústia; 'angústia' transmite bem a intensidade do termo.
