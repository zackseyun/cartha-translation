  text: for they are a graceful wreath for your head and necklaces for your neck[a][b].
translation:
  language: pt
  text: pois eles são uma grinalda graciosa para a sua cabeça e colares para o seu pescoço[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma grinalda de favor” para a sua cabeça.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “correntes” para o seu pescoço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação do versículo anterior e mantém a ligação argumentativa de modo natural em português.
- source_word: לִוְיַת חֵן
  choice: uma grinalda graciosa
  rationale: לִוְיַת designa algo entrelaçado ou posto ao redor, e חֵן comunica encanto, beleza ou graça. A expressão preserva a imagem ornamental sem atribuir a חֵן um sentido doutrinário.
- source_word: הֵם
  choice: eles são
  rationale: O pronome retoma a instrução do pai e o ensino da mãe no versículo 8; o masculino plural é natural em português para essa referência composta.
- source_word: לְרֹאשֶׁךָ
  choice: para a sua cabeça
  rationale: Conserva de perto a relação expressa pela preposição לְ e se combina naturalmente com a imagem da grinalda.
- source_word: וַעֲנָקִים
  choice: e colares
  rationale: Mantém o plural hebraico e expressa claramente adornos usados no pescoço; 'correntes' continua sendo uma alternativa lexical possível.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: para o seu pescoço
  rationale: Embora o termo possa designar a garganta ou a região do pescoço, 'pescoço' é a expressão portuguesa natural no contexto de adornos.
