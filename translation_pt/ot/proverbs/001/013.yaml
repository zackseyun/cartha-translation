  text: כָּל ה֣וֹן יָקָ֣ר נִמְצָ֑א נְמַלֵּ֖א בָתֵּ֣י/נוּ שָׁלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/013.yaml
  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
translation:
  language: pt
  text: Encontraremos toda riqueza preciosa[a]; encheremos nossas casas de despojos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “riqueza valiosa” ou “bens de grande valor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “bens saqueados”; o termo hebraico se refere a bens tomados como despojo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: toda
  rationale: Preserva o alcance abrangente da afirmação, que expressa a expectativa ambiciosa dos homens violentos.
- source_word: הוֹן יָקָר
  choice: riqueza preciosa
  rationale: Mantém a combinação hebraica de riqueza material com a ideia de alto valor, sem acrescentar uma categoria ausente no texto.
- source_word: נִמְצָא
  choice: encontraremos
  rationale: Conserva o sentido comum de מצא e, no contexto do convite, exprime uma expectativa confiante; a forma também pode ter força exortativa.
- source_word: נְמַלֵּא
  choice: encheremos
  rationale: A forma dá continuidade à fala confiante do grupo. Em português, o futuro comunica naturalmente a promessa, embora o hebraico admita nuance exortativa.
- source_word: בָתֵּינוּ
  choice: nossas casas
  rationale: Tradução concreta e direta da imagem de armazenar os bens tomados.
- source_word: שָׁלָל
  choice: despojos
  rationale: Designa bens tomados pela força. “Despojos” é claro, digno e adequado ao contexto de violência e roubo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo hebraico foi preservado, assim como o tom confiante e ganancioso da fala.
