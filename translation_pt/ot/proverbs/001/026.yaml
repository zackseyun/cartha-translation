  text: גַּם אֲ֭נִי בְּ/אֵידְ/כֶ֣ם אֶשְׂחָ֑ק אֶ֝לְעַ֗ג בְּ/בֹ֣א פַחְדְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/026.yaml
  text: I also will laugh at your calamity[a]; I will mock when your dread comes,
translation:
  language: pt
  text: Eu também rirei da sua calamidade; zombarei quando chegar o que vocês temem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando chegar o seu terror”. O termo hebraico pode indicar tanto o medo ou terror quanto aquilo que se teme, isto é, o acontecimento temido que chega.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Eu também
  rationale: Preserva tanto a ideia de correspondência/adição de גַּם quanto a ênfase do pronome explícito אֲנִי, em ordem natural no português.
- source_word: בְּאֵידְכֶם
  choice: da sua calamidade
  rationale: אֵיד designa calamidade, desastre ou ruína. Com o verbo 'rir', o português idiomático pede 'rir de'; 'calamidade' mantém a gravidade do termo.
- source_word: אֶשְׂחָק
  choice: rirei
  rationale: Verte diretamente o Qal de שׂחק, sem suavizar nem intensificar o sentido.
- source_word: אֶלְעַג
  choice: zombarei
  rationale: לעג expressa zombaria ou escárnio. 'Zombarei' é claro, atual e conserva o paralelismo com 'rirei'.
- source_word: בְּבֹא
  choice: quando chegar
  rationale: O infinitivo construto de בוא com בְּ tem valor temporal; 'quando chegar' é natural em português.
- source_word: פַחְדְּכֶם
  choice: o que vocês temem
  rationale: פחד pode indicar o medo/terror ou aquilo que o provoca. No contexto de algo que 'chega', esta formulação natural expressa o evento temido, enquanto a nota preserva a amplitude lexical.
theological_decisions:
- issue: Tom da resposta da Sabedoria personificada aos insensatos
  choice: Manter literalmente a força de 'rirei' e 'zombarei'.
  alternative: Suavizar para 'sorrirei' ou reinterpretar como 'me alegrarei'.
  rationale: Os verbos hebraicos são fortes e apresentam uma resposta judicial da Sabedoria personificada. A tradução conserva essa tensão sem amenizá-la nem ampliá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural hebraico de segunda pessoa foi vertido por “vocês”; o possessivo singular “sua” tem referência coletiva nesse uso.
