id: PRO.1.12
reference: Proverbs 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נִ֭בְלָעֵ/ם כִּ/שְׁא֣וֹל חַיִּ֑ים וּ֝/תְמִימִ֗ים כְּ/י֣וֹרְדֵי בֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
translation:
  language: pt
  text: Vamos engoli-los vivos, como o Sheol[a], e inteiros[b], como os que descem à cova;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sepultura”. “Sheol” designa, no pensamento hebraico, o domínio dos mortos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “intactos” ou “sem dano”. O hebraico pode indicar aqui inteireza ou completude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָעֵם
  choice: Vamos engoli-los
  rationale: O coortativo qal na primeira pessoa do plural, com sufixo de terceira pessoa masculina plural, expressa a exortação dos conspiradores. “Vamos engoli-los” conserva a metáfora predatória e soa natural em português.
- source_word: כִּשְׁאוֹל
  choice: como o Sheol
  rationale: Mantém o termo hebraico e sua imagem do domínio dos mortos, sem reduzi-lo antecipadamente a “sepultura” ou “morte”.
- source_word: חַיִּים
  choice: vivos
  rationale: 'O adjetivo tem valor predicativo: as vítimas seriam engolidas enquanto ainda estivessem vivas.'
- source_word: וּתְמִימִים
  choice: e inteiros
  rationale: Neste contexto de pessoas sendo engolidas, o sentido físico de totalidade ou integridade se ajusta melhor que o sentido moral de “íntegros” ou “irrepreensíveis”.
- source_word: כְּיוֹרְדֵי בוֹר
  choice: como os que descem à cova
  rationale: Preserva a imagem concreta da descida à cova e sua associação poética com a morte.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; a morte
  rationale: A transliteração preserva a concepção e a imagem hebraicas sem impor uma definição mais estreita.
- issue: Sentido de תְמִימִים no contexto
  choice: inteiros
  alternative: intactos; irrepreensíveis
  rationale: O paralelismo descreve a condição física das vítimas na imagem violenta, não faz necessariamente uma avaliação moral delas.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A construção “vamos engoli-los” comunica naturalmente a força exortativa do coortativo. “Sheol” foi preservado e explicado em nota; “cova” mantém a imagem poética concreta.
