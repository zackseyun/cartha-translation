  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/תֵ֣ת לִ/פְתָאיִ֣ם עָרְמָ֑ה לְ֝/נַ֗עַר דַּ֣עַת וּ/מְזִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/004.yaml
  text: to give prudence to the simple[a], knowledge and discretion to the young man.
translation:
  language: pt
  text: para dar prudência aos inexperientes, conhecimento e discernimento ao jovem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à pessoa jovem” ou “ao rapaz”. O hebraico está no masculino singular e pode ter sentido representativo na instrução sapiencial.
    reason: Preservar as alternativas lexicais e esclarecer o possível uso representativo do masculino singular.
lexical_decisions:
- source_word: לָתֵת
  choice: para dar
  rationale: O infinitivo construto de נתן com לְ continua a declaração de propósito do versículo anterior; “para dar” expressa essa relação de modo natural.
- source_word: לִפְתָאיִם
  choice: aos inexperientes
  rationale: פְּתָאִים designa pessoas ingênuas, sem experiência e facilmente influenciáveis, não pessoas com deficiência intelectual. “Inexperientes” comunica esse sentido com clareza no português atual.
- source_word: עָרְמָה
  choice: prudência
  rationale: Neste contexto positivo de instrução sapiencial, עָרְמָה indica cautela sensata e habilidade prática, embora em outros contextos possa significar astúcia.
- source_word: לְנַעַר
  choice: ao jovem
  rationale: נַעַר está no masculino singular e pode designar rapaz ou jovem. “Ao jovem” preserva o número e, mediante o artigo masculino, a forma gramatical do hebraico, sem soar antiquado.
- source_word: דַּעַת
  choice: conhecimento
  rationale: דַּעַת denota conhecimento e mantém aqui o vocabulário característico da literatura sapiencial.
- source_word: וּמְזִמָּה
  choice: e discernimento
  rationale: מְזִמָּה pode indicar capacidade de planejar, discrição ou juízo refletido. “Discernimento” expressa de modo corrente a capacidade de avaliar e agir com ponderação.
theological_decisions:
- issue: Masculino singular na instrução sapiencial
  choice: ao jovem
  alternative: à pessoa jovem; ao rapaz
  rationale: O hebraico נַעַר é masculino singular. A tradução preserva essa forma no texto principal, sem excluir a possibilidade de que o jovem funcione como representante dos destinatários da instrução sapiencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Inexperientes” evita a possível conotação intelectual depreciativa de “simples”; “discernimento” é mais corrente do que “discrição” neste contexto. O marcador foi colocado após “jovem”, termo ao qual a nota efetivamente se refere.
