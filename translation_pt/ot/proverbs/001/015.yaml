base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/015.yaml
  text: My son[a], do not walk in the way with them; keep your foot from their path.
translation:
  language: pt
  text: Meu filho, não ande com eles pelo caminho; mantenha o seu pé longe da vereda deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Vocativo de בֵּן com sufixo de primeira pessoa singular. Preserva a forma masculina singular e o quadro de instrução de pai para filho em Provérbios.
- source_word: אַל תֵּלֵךְ
  choice: não siga
  rationale: אַל com o imperfeito/jussivo expressa proibição. Neste contexto, “não siga” comunica naturalmente tanto o movimento quanto a ideia de adotar o proceder deles.
- source_word: בְּדֶרֶךְ אִתָּם
  choice: pelo caminho deles
  rationale: דֶּרֶךְ pode indicar estrada literal ou modo de vida. A formulação portuguesa é natural, preserva a metáfora sapiencial e expressa a associação indicada por אִתָּם sem sugerir apenas proximidade física.
- source_word: מְנַע
  choice: mantenha ... longe
  rationale: O imperativo de מנע pede contenção deliberada. “Mantenha ... longe” expressa de modo corrente a ordem de evitar esse percurso.
- source_word: רַגְלְךָ
  choice: seu pé
  rationale: Mantém o singular do hebraico e a imagem corporal concreta usada na exortação.
- source_word: מִנְּתִיבָתָם
  choice: da vereda deles
  rationale: נְתִיבָה designa vereda ou trilha. “Vereda” distingue o termo do דֶּרֶךְ anterior, preservando a variação lexical e o paralelismo.
