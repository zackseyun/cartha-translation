  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
translation:
  language: pt
  text: porque odiaram o conhecimento e não escolheram o temor de Yahweh[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O temor de Yahweh” é uma expressão central da literatura sapiencial e inclui reverência profunda, não apenas terror.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת כִּי
  choice: porque
  rationale: A locução introduz a causa do juízo descrito no contexto; “porque” expressa naturalmente essa relação causal em português.
- source_word: שָׂנְאוּ
  choice: odiaram
  rationale: Preserva a força direta do verbo hebraico, sem suavizá-lo como “desprezaram” ou “rejeitaram”.
- source_word: דָעַת
  choice: o conhecimento
  rationale: É a correspondência mais direta e mantém o vocabulário característico da sabedoria em Provérbios.
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: Conserva a expressão central da literatura sapiencial e sua amplitude, que inclui reverência, assombro e séria consciência moral diante de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֹא בָחָרוּ
  choice: não escolheram
  rationale: Mantém o sentido básico de בחר e a ênfase volitiva da frase.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada.
- issue: Sentido de יִרְאַת יְהוָה
  choice: o temor de Yahweh
  alternative: a reverência por Yahweh
  rationale: “Temor” preserva a tensão teológica da expressão, que não se limita ao terror nem se reduz a mera reverência.
translation_notes:
  register: Português moderno, claro e digno, com estrutura causal simples. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto imediato.
