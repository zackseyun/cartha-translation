  text: 'The proverbs of Solomon[a], son of David, king of Israel:'
translation:
  language: pt
  text: 'Provérbios de Salomão[a], filho de Davi, rei de Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ditos” ou “máximas”. O termo hebraico מָשָׁל pode designar um provérbio, uma máxima ou um dito de sabedoria; “Provérbios” se ajusta melhor ao título e ao cabeçalho do livro neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: Provérbios
  rationale: Plural em estado construto de מָשָׁל, usado aqui para apresentar a coleção. “Provérbios” é natural em português, corresponde ao sentido lexical e funciona bem como título e cabeçalho do livro.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: בֶן
  choice: filho de
  rationale: Expressa diretamente a relação filial indicada pelo hebraico neste cabeçalho régio; não há razão contextual para ampliar o sentido para “descendente de”.
- source_word: דָּוִד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português, especialmente natural para leitores brasileiros.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Substantivo em aposição a Salomão. Sem artigo, “rei de Israel” é a formulação mais natural no cabeçalho em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa convencional do nome próprio da nação ou reino.
