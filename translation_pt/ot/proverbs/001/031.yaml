id: PRO.1.31
reference: Proverbs 1:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ֭/יֹאכְלוּ מִ/פְּרִ֣י דַרְכָּ֑/ם וּֽ/מִ/מֹּעֲצֹ֖תֵי/הֶ֣ם יִשְׂבָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/031.yaml
  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
translation:
  language: pt
  text: Por isso, comerão do fruto do seu caminho[a] e se fartarão dos seus próprios planos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E comerão do fruto do seu caminho”.'
    reason: A conjunção hebraica também pode ser vertida simplesmente por “e”, sem explicitar seu valor consecutivo.
  - marker: b
    text: 'Ou: “dos seus próprios conselhos” ou “das suas próprias deliberações”.'
    reason: O termo hebraico pode referir-se a conselhos, deliberações ou planos.
lexical_decisions:
- source_word: וְיֹאכְלוּ
  choice: Por isso, comerão
  rationale: A conjunção liga o versículo à recusa descrita anteriormente e, no contexto, tem valor de consequência. “Por isso” explicita essa relação em português natural, enquanto o futuro “comerão” preserva a forma verbal.
- source_word: מִפְּרִי
  choice: do fruto
  rationale: A expressão conserva a metáfora agrícola das consequências produzidas pelas próprias escolhas. Em português, “comer do fruto” comunica naturalmente a ideia de participar daquilo que foi produzido.
- source_word: דַרְכָּם
  choice: do seu caminho
  rationale: “Caminho” mantém a metáfora característica da literatura sapiencial para o rumo da vida e a conduta, sem reduzi-la a uma explicação abstrata.
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  choice: dos seus próprios planos
  rationale: מֹעֲצוֹת pode designar conselhos, deliberações ou planos. “Planos” é claro no português atual e preserva a referência às decisões concebidas por eles; “próprios” torna explícito o sufixo possessivo e reforça, sem acrescentar doutrina, que sofrerão as consequências de suas próprias deliberações.
- source_word: יִשְׂבָּעוּ
  choice: se fartarão
  rationale: O verbo indica ficar saciado ou cheio. “Se fartarão” preserva a imagem de consumir até a saciedade e seu tom irônico de juízo, sem sugerir satisfação positiva.
theological_decisions:
- issue: Imagem de consequência moral no juízo sapiencial
  choice: Apresentar o resultado como consequência adequada do caminho e dos planos escolhidos pelas próprias pessoas.
  alternative: Manter a ligação apenas com “e”, deixando totalmente implícita a relação de consequência.
  rationale: O contexto e as imagens de comer o fruto e fartar-se expressam consequência moral retributiva. A tradução torna clara a ligação discursiva, mas não importa categorias doutrinárias posteriores nem define o mecanismo desse juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as duas metáforas paralelas — comer do fruto e fartar-se — e mantém “caminho”, termo central da linguagem sapiencial.
