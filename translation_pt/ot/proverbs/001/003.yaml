  text: לָ֭/קַחַת מוּסַ֣ר הַשְׂכֵּ֑ל צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט וּ/מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/003.yaml
  text: to receive instruction in wise dealing[a], righteousness, justice[c][b], and equity.
translation:
  language: pt
  text: para receber instrução em conduta sábia,[a][b] retidão, justiça e equidade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aceitar disciplina em conduta prudente”; o hebraico permite “receber” ou, mais literalmente, “tomar”, e מוּסָר também pode significar “disciplina”.
    reason: lexical_alternative
  - marker: b
    text: “Conduta sábia” traduz um termo que indica prudência prática ou habilidade para conduzir a vida, não apenas compreensão intelectual.
    reason: lexical_alternative
  - marker: c
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחַת
  choice: receber
  rationale: Embora o sentido básico seja “tomar”, com מוּסָר no contexto pedagógico de Provérbios o verbo comunica naturalmente acolher ou receber instrução.
- source_word: מוּסַר
  choice: instrução
  rationale: O termo abrange instrução formativa, disciplina e correção. “Instrução” preserva aqui o sentido educativo amplo sem restringi-lo à punição.
- source_word: הַשְׂכֵּל
  choice: agir com sabedoria
  rationale: O termo aponta para prudência prática e habilidade de conduzir bem a vida, não apenas para compreensão intelectual.
- source_word: צֶדֶק
  choice: retidão
  rationale: No conjunto ético do versículo, “retidão” expressa aquilo que é correto e mantém distinção em relação a מִשְׁפָּט, traduzido por “justiça”.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Neste contexto, o termo designa a justiça como norma ética e social, mais do que um julgamento isolado.
- source_word: מֵישָׁרִים
  choice: equidade
  rationale: O plural comunica retidão, imparcialidade e trato justo. “Equidade” preserva um elemento próprio na tríade, embora “integridade” também seja possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação de propósito coerente com a sequência de Provérbios 1:2–3. A expressão “agir com sabedoria” explicita de modo natural a dimensão prática de הַשְׂכֵּל. Os marcadores foram posicionados junto aos termos a que se referem.
