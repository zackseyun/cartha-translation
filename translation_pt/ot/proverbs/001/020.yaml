  text: חָ֭כְמוֹת בַּ/ח֣וּץ תָּרֹ֑נָּה בָּ֝/רְחֹב֗וֹת תִּתֵּ֥ן קוֹלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/020.yaml
  text: Wisdom cries aloud in the street[a]; in the squares she raises her voice.
translation:
  language: pt
  text: A Sabedoria clama em alta voz na rua[a]; nas praças, faz ouvir a sua voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “A Sabedoria chama em público; nas praças, levanta a voz.”'
    reason: Alternativa lexical que explicita o sentido público de בַּחוּץ e oferece equivalentes mais correntes para os dois verbos, sem alterar a personificação.
lexical_decisions:
- source_word: חָכְמוֹת
  choice: a Sabedoria
  rationale: Embora tenha forma plural, o substantivo funciona aqui como singular personificado, como indicam os verbos femininos no singular e o sufixo pronominal feminino.
- source_word: בַּחוּץ
  choice: na rua
  rationale: Designa o espaço exterior e público, em contraste com o ambiente privado; “na rua” é natural em português e combina com o paralelismo de “nas praças”.
- source_word: תָּרֹנָּה
  choice: clama em alta voz
  rationale: O verbo רנן indica uma emissão vocal forte e ressonante. Neste contexto de convocação pública, “clama em alta voz” preserva sua intensidade sem sugerir necessariamente canto ou celebração.
- source_word: בָּרְחֹבוֹת
  choice: nas praças
  rationale: Refere-se a lugares públicos amplos ou largos da cidade. “Praças” comunica de modo claro e conciso esse cenário público.
- source_word: תִּתֵּן קוֹלָהּ
  choice: faz ouvir a sua voz
  rationale: A expressão significa literalmente “dá a sua voz”. “Faz ouvir a sua voz” conserva a imagem de manifestação pública e soa natural em português.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter “a Sabedoria” como figura feminina singular.
  alternative: Verter de maneira puramente abstrata, sem destacar a personificação.
  rationale: As formas verbais femininas no singular e o sufixo pronominal apresentam a Sabedoria como personagem literária. A tradução mantém essa personificação sem identificá-la com uma figura doutrinária posterior.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O artigo e as iniciais maiúsculas realçam a personificação literária. O paralelismo entre “na rua” e “nas praças” foi preservado.
