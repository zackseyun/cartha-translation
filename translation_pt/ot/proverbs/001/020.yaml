  source_fidelity: A tradução preserva adequadamente a personificação singular feminina de חָכְמוֹת, o cenário público expresso por בַּחוּץ e בָּרְחֹבוֹת, e a progressão vocal dos dois membros. “Clama em alta voz” comunica bem a força de תָּרֹנָּה no contexto, e “faz ouvir a sua voz” representa de modo inteligível a expressão תִּתֵּן קוֹלָהּ, sem acrescentar interpretação doutrinária.
