  text: אִם יֹאמְרוּ֮ לְכָ֪/ה אִ֫תָּ֥/נוּ נֶאֶרְבָ֥ה לְ/דָ֑ם נִצְפְּנָ֖ה לְ/נָקִ֣י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
translation:
  language: pt
  text: 'Se eles disserem: “Venha conosco! Fiquemos à espreita para derramar sangue[a]; armemos uma emboscada[b] contra o inocente sem motivo”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “por sangue”, expressão concisa que indica violência sanguinária ou homicídio.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico pode significar mais literalmente “escondamo-nos”; neste contexto, refere-se a ficar oculto para atacar de surpresa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֹאמְרוּ
  choice: Se eles disserem
  rationale: Mantém a condição apresentada na advertência paterna e usa o futuro do subjuntivo, forma natural em português depois de “se”.
- source_word: לְכָה אִתָּנוּ
  choice: Venha conosco
  rationale: Expressa de modo direto e idiomático o convite para participar do grupo.
- source_word: נֶאֶרְבָה
  choice: Fiquemos à espreita
  rationale: Preserva a ideia de permanecer oculto à espera da vítima e o caráter premeditado da ação.
- source_word: לְדָם
  choice: para derramar sangue
  rationale: A expressão hebraica, literalmente “por/para sangue”, é concisa e indica violência sanguinária, provavelmente homicida. A formulação portuguesa mantém a imagem do sangue sem soar obscura.
- source_word: נִצְפְּנָה
  choice: armemos uma emboscada
  rationale: Embora o verbo possa significar literalmente esconder-se, neste paralelismo descreve ocultar-se com a finalidade de atacar.
- source_word: לְנָקִי
  choice: contra o inocente
  rationale: O adjetivo substantivado caracteriza moralmente a vítima como alguém sem culpa no conflito.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Comunica a ausência de causa ou justificativa para o ataque em português atual e claro.
theological_decisions:
- issue: Caracterização moral da vítima na instrução sapiencial
  choice: o inocente
  alternative: o irrepreensível; uma pessoa inocente
  rationale: A tradução conserva a condenação da violência injusta ao identificar a vítima como inocente, sem acrescentar uma noção de perfeição moral absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto conserva o tom urgente e sedutor do convite. “Fiquemos à espreita” e “armemos uma emboscada” mantêm o paralelismo sem produzir repetição artificial.
