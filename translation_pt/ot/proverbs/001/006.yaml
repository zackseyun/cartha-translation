  text: to understand a proverb and a saying[b][a], the words of the wise and their riddles.
translation:
  language: pt
  text: para compreender um provérbio e um dito[a], as palavras dos sábios e seus enigmas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma interpretação”. O termo hebraico pode se referir a um dito elaborado ou marcante e, em alguns contextos, a uma formulação interpretativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus ditos enigmáticos”. A palavra hebraica pode designar enigmas ou ditos obscuros que exigem reflexão.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  choice: para compreender
  rationale: O infinitivo com לְ expressa propósito e dá continuidade às declarações de finalidade dos versículos anteriores. “Compreender” preserva o sentido cognitivo de בין em português natural.
- source_word: מָשָׁל
  choice: o provérbio
  rationale: Em Provérbios, מָשָׁל normalmente designa um provérbio ou dito sapiencial; “provérbio” corresponde ao gênero e ao contexto imediato.
- source_word: מְלִיצָה
  choice: a expressão
  rationale: O termo raro pode indicar uma formulação expressiva ou elaborada e, em certos contextos, uma interpretação. “Expressão” é ampla e natural, sem eliminar a ambiguidade lexical, que é registrada em nota.
- source_word: דִּבְרֵי
  choice: as palavras dos
  rationale: Tradução direta do plural construto de דָּבָר, preservando claramente a relação com “sábios”.
- source_word: חֲכָמִים
  choice: sábios
  rationale: O adjetivo substantivado refere-se a pessoas sábias. “Os sábios” conserva o caráter representativo do hebraico sem especificar gênero desnecessariamente.
- source_word: חִידֹתָם
  choice: seus enigmas
  rationale: חִידָה pode designar um enigma ou dito enigmático que exige reflexão. “Seus enigmas” é claro, conciso e preserva o sufixo pronominal.
