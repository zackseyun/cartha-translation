source:
  edition: WLC
  text: בְּ/רֹ֥אשׁ הֹמִיּ֗וֹת תִּ֫קְרָ֥א בְּ/פִתְחֵ֖י שְׁעָרִ֥ים בָּ/עִ֗יר אֲמָרֶ֥י/הָ תֹאמֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
translation:
  language: pt
  text: 'No ponto principal das ruas movimentadas, ela clama[a]; junto às entradas dos portões da cidade[b], profere suas palavras[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No alto dos lugares tumultuosos, ela chama”. A expressão hebraica pode indicar tanto o lugar mais destacado quanto um ponto elevado ou dianteiro em meio à agitação pública.'
    reason: lexical_alternative
  - marker: b
    text: Os portões da cidade eram importantes locais públicos de encontro, onde se realizavam comércio, julgamentos e outras atividades da vida cívica.
    reason: cultural_note
  - marker: c
    text: 'Literalmente: “diz suas palavras”; isto é, fala publicamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹאשׁ הֹמִיּוֹת
  choice: No ponto principal das ruas movimentadas
  rationale: רֹאשׁ indica a parte principal, dianteira ou mais destacada; הֹמִיּוֹת descreve lugares marcados por ruído e agitação. A formulação comunica um local público urbano de destaque sem sugerir necessariamente uma elevação física.
- source_word: תִּקְרָא
  choice: ela clama
  rationale: קרא expressa chamar ou clamar em voz alta. “Clama” preserva a força pública e urgente da proclamação da Sabedoria.
- source_word: בְּפִתְחֵי שְׁעָרִים בָּעִיר
  choice: junto às entradas dos portões da cidade
  rationale: פֶּתַח designa abertura ou entrada, e שַׁעַר, os portões urbanos. A construção portuguesa liga naturalmente os portões à cidade, mantendo a localização pública indicada pelo hebraico.
- source_word: אֲמָרֶיהָ תֹאמֵר
  choice: profere suas palavras
  rationale: A expressão é literalmente “diz suas palavras”. “Profere suas palavras” conserva o objeto explícito e evita uma formulação pouco natural em português.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Manter a referência pessoal feminina (“ela”)
  alternative: Empregar uma formulação impessoal
  rationale: Os verbos e o sufixo hebraicos estão no feminino singular e dão continuidade à personificação da Sabedoria. A tradução preserva esse dado gramatical e literário sem acrescentar uma identificação teológica não explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ruas movimentadas” torna explícito o cenário urbano sugerido pelo contexto, enquanto a nota preserva a incerteza lexical de הֹמִיּוֹת. A ordem poética e o paralelismo entre os dois locais públicos foram mantidos.
