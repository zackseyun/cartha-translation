  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
translation:
  language: pt
  text: Mas quem me escuta habitará em segurança e estará tranquilo, sem medo da calamidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E aquele que me ouve habitará seguro e permanecerá tranquilo, longe do pavor da desgraça.”'
    reason: Alternativa lexical e sintática que preserva mais de perto os valores possíveis da conjunção, de שׁמע, שׁאנ, פחד e רעה.
lexical_decisions:
- source_word: וְשֹׁמֵעַ
  choice: Mas quem me escuta
  rationale: O particípio expressa uma atitude contínua de ouvir com atenção e responder. “Quem” preserva o sentido genérico, e “mas” explicita o contraste contextual com os que rejeitam a Sabedoria nos versículos anteriores.
- source_word: לִי
  choice: me
  rationale: Com o verbo português “escutar”, o pronome oblíquo reproduz naturalmente a referência à Sabedoria personificada, que continua falando em primeira pessoa.
- source_word: יִשְׁכָּן
  choice: habitará
  rationale: Preserva o sentido de residir ou permanecer estabelecido, incluindo a ideia de repouso estável.
- source_word: בֶּטַח
  choice: em segurança
  rationale: Comunica segurança e confiança de modo natural em português, sem reduzir o termo apenas à ausência imediata de perigo.
- source_word: וְשַׁאֲנַן
  choice: e estará tranquilo
  rationale: Expressa sossego e ausência de perturbação. Evita “acomodado”, que poderia introduzir uma conotação negativa não exigida pelo contexto.
- source_word: מִפַּחַד
  choice: sem medo da
  rationale: A preposição מן indica afastamento ou liberdade em relação ao pavor; “sem medo de” comunica essa relação com clareza em português.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste contexto, o termo aponta para desgraça, dano ou desastre, e não primariamente para o mal moral. “Calamidade” preserva a amplitude de um acontecimento ameaçador.
theological_decisions:
- issue: Representação de gênero no sujeito participial
  choice: quem me escuta
  alternative: aquele que me ouve
  rationale: Embora o particípio hebraico esteja no masculino singular, sua função é genérica na instrução sapiencial. “Quem” inclui corretamente qualquer pessoa sem acrescentar uma restrição masculina.
- issue: A Sabedoria personificada como locutora
  choice: manter a primeira pessoa em “me escuta”
  alternative: escuta a Sabedoria
  rationale: O versículo continua a fala direta da Sabedoria no contexto. Manter o pronome evita inserir no texto principal uma identificação explicativa ausente do hebraico.
- issue: Natureza da promessa
  choice: sem medo da calamidade
  alternative: a salvo de toda calamidade
  rationale: O hebraico promete tranquilidade diante do pavor da calamidade; não afirma de maneira inequívoca que a pessoa jamais enfrentará sofrimento. A tradução preserva essa tensão sem ampliar a promessa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Habitará em segurança” mantém a imagem hebraica de estabilidade; “estará tranquilo” evita tanto arcaísmo quanto uma interpretação negativa.
