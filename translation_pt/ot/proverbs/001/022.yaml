  source_fidelity: A estrutura interrogativa e as երեք categorias sapienciais são bem representadas. A repetição de “Até quando” explicita legitimamente o alcance da pergunta sobre as três orações. “Zombadores/zombaria”, “tolos” e “odiarão o conhecimento” refletem adequadamente o hebraico. Contudo, “inexperientes” não conserva o vínculo lexical que a nota afirma existir com “ingenuidade” e desloca פְּתָיִם para mera falta de experiência.
