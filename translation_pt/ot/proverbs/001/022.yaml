  text: עַד מָתַ֣י פְּתָיִם֮ תְּֽאֵהֲב֫וּ פֶ֥תִי וְ/לֵצִ֗ים לָ֭צוֹן חָמְד֣וּ לָ/הֶ֑ם וּ֝/כְסִילִ֗ים יִשְׂנְאוּ דָֽעַת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/022.yaml
  text: How long[a], O simple ones[b], will you love simplicity? How long will scoffers delight in scoffing and fools hate knowledge?
translation:
  language: pt
  text: Até quando, ingênuos[a], vocês amarão a ingenuidade? Até quando os zombadores terão prazer na zombaria, e os tolos odiarão o conhecimento?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega palavras da mesma raiz para “ingênuos” e “ingenuidade”; também se pode traduzir: “Até quando os ingênuos amarão ser ingênuos?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָיִם
  choice: inexperientes
  rationale: Designa pessoas ingênuas, crédulas ou ainda não formadas moralmente, não pessoas de pouca inteligência. Em português atual, “inexperientes” comunica melhor essa categoria sapiencial do que “simples”.
- source_word: תְּאֵהֲבוּ
  choice: amarão
  rationale: No contexto da pergunta de repreensão introduzida por “até quando”, o imperfeito expressa uma disposição persistente que se espera que cesse.
- source_word: פֶתִי
  choice: ingenuidade
  rationale: Expressa a condição característica dos inexperientes. O jogo de palavras hebraico com פְּתָיִם não pode ser reproduzido com naturalidade na tradução principal e é indicado em nota.
- source_word: לֵצִים / לָצוֹן
  choice: zombadores / zombaria
  rationale: O par cognato preserva em português a repetição lexical do hebraico e descreve quem despreza arrogantemente a sabedoria e a correção.
- source_word: חָמְדוּ
  choice: terão prazer
  rationale: Embora o verbo possa significar “desejar”, neste contexto comunica que os zombadores apreciam e escolhem a zombaria.
- source_word: כְסִילִים
  choice: tolos
  rationale: Mantém a categoria ético-espiritual recorrente em Provérbios, sem reduzi-la a deficiência intelectual.
- source_word: יִשְׂנְאוּ דָעַת
  choice: odiarão o conhecimento
  rationale: Preserva a força de “odiar” e traduz diretamente a aversão moral ao conhecimento.
theological_decisions:
- issue: Categorias sapienciais em Provérbios
  choice: 'Manter categorias morais distintas: “inexperientes”, “zombadores” e “tolos”.'
  alternative: Generalizar como pessoas ingênuas, pessoas que ridicularizam e pessoas sem entendimento.
  rationale: O texto apresenta tipos ético-espirituais recorrentes na literatura sapiencial; preservar as distinções evita transformá-los em meros traços psicológicos.
- issue: Repetição de “até quando”
  choice: Repetir “Até quando” no segundo período.
  alternative: Deixar a expressão subentendida nas duas últimas orações, como no hebraico.
  rationale: A repetição torna explícito em português que a pergunta rege as três orações, sem alterar seu sentido.
translation_notes:
  register: Português moderno, claro e digno, com vocativo sem “ó”. “Vocês” favorece legibilidade brasileira e continua amplamente compreensível. A repetição “zombadores/zombaria” reproduz deliberadamente o vínculo lexical hebraico.
