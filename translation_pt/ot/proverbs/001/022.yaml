  - severity: low
    issue: “Inexperientes” enfraquece a categoria de פְּתָיִם.
    rationale: O termo hebraico designa os ingênuos ou crédulos, e não simplesmente quem tem pouca experiência. “Ingênuos” é mais próximo e preserva o jogo com “ingenuidade”.
