  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
translation:
  language: pt
  text: 'Assim são os caminhos de todo aquele que busca lucro injusto: esse lucro tira a vida de quem o possui.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim são os caminhos de todo aquele que é ávido por lucro; ele tira a vida dos que o possuem.”'
    reason: Preserva a alternativa lexical para a expressão hebraica que enfatiza a avidez por ganho e mantém o sentido de בְּעָלָיו como «os que o possuem», sem acréscimo interpretativo.
lexical_decisions:
- source_word: כֵּן
  choice: Assim são
  rationale: Retoma e resume a advertência anterior, preservando a força comparativa e demonstrativa da expressão hebraica.
- source_word: אָרְחוֹת
  choice: os caminhos
  rationale: Mantém a metáfora concreta e recorrente da literatura sapiencial para a conduta e seu desfecho.
- source_word: כָּל
  choice: todo aquele que
  rationale: Expressa naturalmente em português o alcance distributivo e universal diante do particípio.
- source_word: בֹּצֵעַ בָּצַע
  choice: busca lucro injusto
  rationale: A construção com verbo e substantivo cognatos descreve a procura ávida por ganho, com caráter moralmente ilícito no contexto de violência e emboscada.
- source_word: נֶפֶשׁ
  choice: a vida
  rationale: Aqui se refere mais naturalmente à vida da pessoa, e não especificamente a uma alma imaterial.
- source_word: בְּעָלָיו
  choice: quem o possui
  rationale: O sufixo plural remete ao lucro como algo possuído; a formulação conserva o sentido sem a rigidez de 'seus possuidores'.
- source_word: יִקָּח
  choice: tira
  rationale: Apresenta o lucro injusto como sujeito da ação e transmite com clareza o efeito destrutivo expresso no contexto.
