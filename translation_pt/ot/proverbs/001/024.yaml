  text: יַ֣עַן קָ֭רָאתִי וַ/תְּמָאֵ֑נוּ נָטִ֥יתִי יָ֝דִ֗/י וְ/אֵ֣ין מַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
translation:
  language: pt
  text: Porque chamei, e vocês se recusaram; estendi a mão, e ninguém deu atenção[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escutou” ou “estava escutando”. O particípio hebraico enfatiza a escuta atenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Porque
  rationale: Introduz a causa do juízo anunciado nos versículos seguintes e preserva de modo natural a força causal do hebraico.
- source_word: קָרָאתִי
  choice: chamei
  rationale: O qal perfeito de קרא descreve o chamado público da Sabedoria; “chamei” é direto e adequado ao contexto.
- source_word: וַתְּמָאֵנוּ
  choice: e vocês se recusaram
  rationale: מאן significa recusar-se ou não estar disposto. A forma pronominal é natural em português quando o objeto da recusa fica implícito, e “e” preserva o waw simples.
- source_word: נָטִיתִי
  choice: estendi
  rationale: Mantém a imagem concreta de נטה, o ato de estender a mão como apelo ou advertência.
- source_word: יָדִי
  choice: a mão
  rationale: Preserva a imagem corporal do hebraico; o possessivo é naturalmente compreendido pelo sujeito de “estendi” em português.
- source_word: וְאֵין
  choice: e ninguém
  rationale: A construção existencial negativa seguida do particípio comunica que não havia pessoa alguma prestando atenção.
- source_word: מַקְשִׁיב
  choice: deu atenção
  rationale: O hifil de קשב expressa escuta atenta. “Deu atenção” comunica essa ideia em português corrente sem acrescentar a noção mais forte de obediência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação com “e” acompanha de perto o hebraico, enquanto “se recusaram” evita uma construção incompleta em português. O marcador da nota foi colocado junto à expressão correspondente ao particípio hebraico.
