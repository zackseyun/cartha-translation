id: PRO.1.23
reference: Proverbs 1:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תָּשׁ֗וּבוּ לְֽ/ת֫וֹכַחְתִּ֥/י הִנֵּ֤ה אַבִּ֣יעָה לָ/כֶ֣ם רוּחִ֑/י אוֹדִ֖יעָה דְבָרַ֣/י אֶתְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
translation:
  language: pt
  text: Voltem-se para a minha repreensão[a]. Eis que derramarei sobre vocês o meu espírito[b]; farei que conheçam as minhas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Voltem à minha correção” ou “Arrependam-se diante da minha repreensão”.
    reason: lexical_alternative
  - marker: b
    text: “Meu espírito” também pode ser entendido como “minha disposição” ou “meu pensamento interior”. Alguns leitores percebem uma ressonância mais ampla com o Espírito de Deus, embora neste versículo quem fale seja a Sabedoria personificada.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  choice: Voltem-se
  rationale: O verbo שׁוב convoca os ouvintes a mudar de direção. “Voltem-se” preserva a metáfora concreta e a força moral sem acrescentar toda a carga teológica que “arrependam-se” pode sugerir.
- source_word: לְתוֹכַחְתִּי
  choice: para a minha repreensão
  rationale: תּוֹכַחַת abrange repreensão, censura e correção. A preposição לְ com שׁוב pode indicar a direção ou resposta à repreensão; a formulação portuguesa mantém essa abertura.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Partícula que chama atenção para a promessa seguinte; “eis que” conserva o tom elevado e enfático da literatura sapiencial.
- source_word: אַבִּיעָה
  choice: derramarei
  rationale: O verbo נבע descreve algo que brota, jorra ou flui abundantemente. Com “meu espírito”, “derramarei” comunica de modo natural essa imagem de efusão.
- source_word: רוּחִי
  choice: o meu espírito
  rationale: רוּחַ pode significar espírito, sopro, disposição ou pensamento interior. “Meu espírito”, em minúscula, preserva a amplitude do termo e não identifica de modo explícito a fala da Sabedoria personificada com o Espírito Santo.
- source_word: אוֹדִיעָה
  choice: farei que conheçam
  rationale: Forma causativa de ידע, literalmente “farei conhecer”. A expressão portuguesa transmite diretamente a ação de levar os ouvintes ao conhecimento.
- source_word: דְבָרַי
  choice: as minhas palavras
  rationale: דָּבָר pode designar palavra, declaração ou assunto. “Minhas palavras” preserva o caráter verbal e instrutivo da fala da Sabedoria.
- source_word: לָכֶם ... אֶתְכֶם
  choice: sobre vocês ... que conheçam
  rationale: As duas expressões pronominais plurais dirigem a promessa aos ouvintes. A sintaxe portuguesa natural exige construções diferentes com “derramar” e “fazer conhecer”, sem perder o endereço direto.
theological_decisions:
- issue: Sentido de “meu espírito” na fala da Sabedoria
  choice: “meu espírito”, em minúscula, como espírito, disposição ou pensamento interior da Sabedoria personificada
  alternative: Entender a expressão como antecipação ou figura do Espírito de Deus
  rationale: No contexto imediato, quem fala é a Sabedoria personificada. O hebraico não identifica explicitamente רוּחִי com o Espírito Santo; a tradução mantém a expressão aberta e uma nota registra sua amplitude sem eliminar possíveis ressonâncias canônicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” expressa naturalmente o plural do hebraico. “Eis que” conserva o destaque retórico do original, enquanto o restante da frase evita arcaísmos desnecessários.
