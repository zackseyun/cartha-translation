- from: Mas eles ficam à espreita do próprio sangue[a]; armam uma emboscada contra a própria vida[b].
  to: Mas eles ficam à espreita contra o próprio sangue[a]; armam uma emboscada contra a própria vida[b].
  rationale: A revisão acrescenta “contra” à primeira oração para tornar inequívoco que o próprio sangue deles é o alvo, preservando a imagem concreta e a ironia reflexiva. A nota b foi reformulada para explicar o sentido literal de צפן e sua força contextual sem introduzir uma alternativa em português que soe inadequada.
