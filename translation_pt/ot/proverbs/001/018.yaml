review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem o contraste adversativo, a ironia reflexiva dos sufixos possessivos e a distinção geral entre ארב (“ficar à espreita”) e צפן (“ocultar-se/armar uma emboscada”). Contudo, em português, “ficam à espreita do próprio sangue” pode sugerir que o sangue é o objeto observado, não o alvo da emboscada. “Contra o próprio sangue” torna a relação hostil e a ironia do hebraico mais clara.
  naturalness: O registro é moderno e adequado. “Armam uma emboscada contra a própria vida” é claro e natural no paralelismo. A primeira oração precisa apenas de uma preposição que explicite o alvo.
  terminology: “Sangue” e “vida” são escolhas fiéis e evitam reduzir antecipadamente as imagens hebraicas a “morte” ou “pessoas”. A nota b deve evitar apresentar uma alternativa portuguesa pouco idiomática e semanticamente imprecisa como citação direta.
  issues:
  - severity: medium
    issue: “Ficam à espreita do próprio sangue” deixa ambígua a relação entre o verbo e “sangue”.
    rationale: O hebraico לְדָמָם, no contexto, comunica que eles espreitam visando o próprio sangue; em português, “à espreita de/do” pode ser entendido como observar ou aguardar algo, sem indicar claramente hostilidade. “Contra” explicita o sentido contextual sem substituir “sangue” por uma paráfrase.
  - severity: low
    issue: A alternativa citada na nota b, “escondem-se contra a própria vida”, não é uma formulação portuguesa natural nem reproduz de modo claro a função contextual do verbo.
    rationale: צפן tem o sentido básico de esconder/ocultar, mas, neste paralelismo, descreve ocultação para uma emboscada. É melhor explicar o valor lexical sem propor uma tradução alternativa artificial.
  revised_text: Mas eles ficam à espreita contra o próprio sangue[a]; armam uma emboscada contra a própria vida[b].
  revised_footnotes:
