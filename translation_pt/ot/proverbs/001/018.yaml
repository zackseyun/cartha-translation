  text: וְ֭/הֵם לְ/דָמָ֣/ם יֶאֱרֹ֑בוּ יִ֝צְפְּנ֗וּ לְ/נַפְשֹׁתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/018.yaml
  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
translation:
  language: pt
  text: Mas eles ficam à espreita contra o próprio sangue[a]; armam uma emboscada contra a própria vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “sangue”, imagem concreta que também pode representar morte violenta ou derramamento de sangue.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico significa mais literalmente “esconder” ou “ocultar”. Neste contexto, porém, provavelmente descreve ocultar-se para armar uma emboscada.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  choice: Mas eles
  rationale: A conjunção com o pronome independente estabelece contraste com a advertência do versículo anterior; “Mas eles” expressa esse valor adversativo e conserva o pronome explícito.
- source_word: לְדָמָם
  choice: do próprio sangue
  rationale: 'Mantém a imagem concreta de דָּם e evidencia, por meio de “próprio”, a ironia reflexiva: a violência deles se volta contra eles mesmos.'
- source_word: יֶאֱרֹבוּ
  choice: ficam à espreita
  rationale: ארב designa ficar à espera para atacar. A expressão é natural em português e preserva a ideia predatória.
- source_word: יִצְפְּנוּ
  choice: armam uma emboscada
  rationale: צפן significa fundamentalmente esconder ou ocultar; no paralelismo com ארב, descreve uma ação oculta com intenção de atacar. A formulação comunica essa força contextual sem apagar o sentido mais literal, registrado em nota.
- source_word: לְנַפְשֹׁתָם
  choice: contra a própria vida
  rationale: נֶפֶשׁ aqui se refere à vida ou à própria pessoa diante da morte violenta. O singular coletivo “vida” soa natural e conserva a ironia reflexiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “próprio/própria” realça a ironia do hebraico, enquanto “ficam à espreita” e “armam uma emboscada” preservam a distinção entre os dois verbos paralelos.
