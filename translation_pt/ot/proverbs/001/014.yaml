  text: גּ֭וֹרָ֣לְ/ךָ תַּפִּ֣יל בְּ/תוֹכֵ֑/נוּ כִּ֥יס אֶ֝חָ֗ד יִהְיֶ֥ה לְ/כֻלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/014.yaml
  text: Throw in your lot among us[b][a]; we will all have one purse.
translation:
  language: pt
  text: Lance a sua sorte entre nós[a]; teremos todos uma só bolsa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ponha o seu quinhão junto ao nosso”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma única bolsa de dinheiro pertencerá a todos nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹרָלְךָ תַּפִּיל
  choice: Lance a sua sorte
  rationale: A construção combina o hifil de נפל, «fazer cair/lançar», com גּוֹרָל, «sorte, quinhão». «Lançar a sua sorte» preserva a imagem do sorteio e, no contexto, comunica o convite para unir-se ao grupo e compartilhar seu destino e seus ganhos.
- source_word: בְּתוֹכֵנוּ
  choice: entre nós
  rationale: Expressa naturalmente a ideia de estar no meio do grupo, sem tornar explícita além do hebraico a noção de entrar para a companhia.
- source_word: כִּיס אֶחָד
  choice: uma só bolsa
  rationale: כִּיס designa uma bolsa ou saco usado para guardar dinheiro. «Uma só bolsa» preserva a ênfase de אֶחָד em um fundo comum.
- source_word: יִהְיֶה לְכֻלָּנוּ
  choice: teremos todos
  rationale: A expressão significa literalmente «será para todos nós»; a formulação escolhida transmite em português corrente a posse compartilhada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A metáfora da sorte foi mantida, e «uma só bolsa» comunica concisamente a promessa de partilha comum.
