  text: For their feet run to evil[b][a], and they hurry to shed blood.
translation:
  language: pt
  text: Pois os pés deles correm para o mal[a], e eles se apressam para derramar sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fazer o mal” ou “em direção ao mal”.'
