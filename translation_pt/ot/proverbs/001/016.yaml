lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência anterior e preserva de modo natural a força explicativa do hebraico.
- source_word: רַגְלֵיהֶם
  choice: os pés deles
  rationale: Mantém a imagem corporal do hebraico, que expressa sua disposição e rapidez para agir.
- source_word: לָרַע
  choice: para o mal
  rationale: 'Preserva a formulação concisa e sua possível amplitude: pode indicar avançar em direção ao mal ou correr para praticá-lo.'
- source_word: יָרוּצוּ
  choice: correm
  rationale: Conserva a metáfora concreta do movimento rápido e a ideia de prontidão.
- source_word: וִימַהֲרוּ
  choice: e eles se apressam
  rationale: Reproduz a intensificação paralela e usa linguagem portuguesa corrente e digna.
- source_word: לִשְׁפָּךְ דָּם
  choice: para derramar sangue
  rationale: É a expressão idiomática natural em português para o ato de causar morte violenta e corresponde de perto à locução hebraica.
