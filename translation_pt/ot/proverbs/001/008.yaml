id: PRO.1.8
reference: Proverbs 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י מוּסַ֣ר אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/008.yaml
  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
translation:
  language: pt
  text: Meu filho, ouça a instrução[a] de seu pai e não abandone o ensino[b] de sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplina”; מוּסָר inclui formação por meio de correção, além de instrução.
    reason: lexical_alternative
  - marker: b
    text: Ou “lei”; neste contexto, תּוֹרָה se refere ao ensino autorizado da mãe, não a um código legal formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: ouça
  rationale: O imperativo pede escuta atenta e receptiva, que no contexto sapiencial pode implicar obediência. “Ouça” preserva essa amplitude sem explicitar além do hebraico.
- source_word: בְּנִי
  choice: meu filho
  rationale: Reproduz o vocativo masculino singular com o sufixo de primeira pessoa e preserva a forma literária de pai para filho.
- source_word: מוּסַר
  choice: instrução
  rationale: O termo abrange ensino formativo, disciplina e correção. “Instrução” é natural no contexto familiar, enquanto a nota preserva a dimensão disciplinadora.
- source_word: אָבִיךָ
  choice: de seu pai
  rationale: Expressa de modo idiomático a relação possessiva do hebraico e mantém o paralelismo familiar.
- source_word: וְאַל
  choice: e não
  rationale: Mantém a coordenação direta entre a ordem positiva e a proibição.
- source_word: תִּטֹּשׁ
  choice: abandone
  rationale: Comunica claramente a ideia de deixar para trás ou rejeitar, conservando a força moral do verbo em português atual.
- source_word: תּוֹרַת
  choice: ensino
  rationale: No ambiente doméstico sapiencial, o termo indica orientação autorizada da mãe, não necessariamente um código legal formal.
- source_word: אִמֶּךָ
  choice: de sua mãe
  rationale: É a construção possessiva natural em português e corresponde ao paralelo “de seu pai”.
theological_decisions:
- issue: Forma masculina do destinatário na instrução sapiencial
  choice: meu filho
  alternative: meu filho ou minha filha; minha criança
  rationale: O hebraico é explicitamente masculino singular. A tradução conserva a forma literária e retórica do texto sem a neutralizar.
- issue: Sentido de תּוֹרָה no contexto doméstico
  choice: ensino
  alternative: lei; instrução
  rationale: Aqui o termo designa a orientação autorizada da mãe. “Ensino” evita sugerir indevidamente que se trata de um código jurídico ou de uma referência técnica à Torá mosaica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Ouça” mantém o tom direto da exortação sapiencial; “abandone” é atual e conserva a força do original. Os marcadores foram colocados junto aos termos hebraicos efetivamente explicados pelas notas.
