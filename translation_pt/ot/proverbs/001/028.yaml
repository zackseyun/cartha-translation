base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
translation:
  language: pt
  text: Então clamarão a mim, mas não responderei; buscarão por mim com empenho[a], mas não me encontrarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscarão por mim desde cedo” ou “buscarão por mim com insistência”. O verbo hebraico pode transmitir a ideia de uma busca iniciada cedo ou realizada com grande empenho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a consequência temporal das advertências anteriores de modo conciso e natural.
- source_word: יִקְרָאֻנְנִי
  choice: clamarão por mim
  rationale: O verbo קרא descreve aqui um apelo dirigido à Sabedoria em busca de resposta ou socorro; “clamar por” comunica a urgência melhor que o simples “chamar”.
- source_word: וְלֹא אֶעֱנֶה
  choice: mas não responderei
  rationale: Embora וְ seja formalmente uma conjunção aditiva, o contexto lhe dá força adversativa; “mas” expressa naturalmente o contraste.
- source_word: יְשַׁחֲרֻנְנִי
  choice: vão me buscar com empenho
  rationale: O piel de שׁחר pode indicar busca feita cedo, com diligência ou insistência. No contexto, “com empenho” preserva sobretudo a intensidade da busca, enquanto a nota registra as alternativas lexicais.
- source_word: וְלֹא יִמְצָאֻנְנִי
  choice: mas não me encontrarão
  rationale: מצא significa diretamente “encontrar”; “mas” torna explícito em português o contraste entre buscar e não encontrar.
theological_decisions:
- issue: Identidade da voz que fala
  choice: Manter a primeira pessoa como fala da Sabedoria personificada no contexto literário de Provérbios 1.
  alternative: Identificar explicitamente a voz com uma interpretação cristológica ou com outra formulação doutrinária posterior.
  rationale: O versículo apresenta a fala da Sabedoria em seu contexto imediato. A tradução preserva essa voz literária sem decidir interpretações tipológicas ou teológicas mais amplas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vão me buscar” evita uma sequência excessivamente solene sem enfraquecer a gravidade do enunciado. O marcador foi colocado junto à expressão à qual a variante lexical se refere.
