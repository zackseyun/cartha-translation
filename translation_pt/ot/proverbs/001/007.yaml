source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה רֵאשִׁ֣ית דָּ֑עַת חָכְמָ֥ה וּ֝/מוּסָ֗ר אֱוִילִ֥ים בָּֽזוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
translation:
  language: pt
  text: O temor de Yahweh[a] é o princípio do conhecimento; os tolos desprezam a sabedoria e a disciplina.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a reverência a Yahweh” ou “o temor reverente diante de Yahweh”. A expressão hebraica inclui reverência, admiração e temor submisso diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “instrução” ou “correção”. O termo hebraico se refere à formação que pode incluir correção.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: temor de
  rationale: “Temor” preserva a força da expressão hebraica na literatura de sabedoria, abrangendo reverência, assombro e submissão diante de Deus sem reduzi-la a simples medo emocional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração conserva o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: רֵאשִׁית
  choice: princípio
  rationale: '“Princípio” é natural em português e mantém a amplitude do hebraico: pode indicar tanto o ponto inicial quanto o fundamento do conhecimento.'
- source_word: דָּעַת
  choice: conhecimento
  rationale: É o equivalente direto e adequado neste contexto sapiencial, sem confundi-lo com outros termos hebraicos para entendimento ou discernimento.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente consagrado e amplo, capaz de incluir a habilidade de viver corretamente sem recorrer a uma paráfrase.
- source_word: מוּסָר
  choice: disciplina
  rationale: O termo hebraico inclui formação, instrução e correção; “disciplina” comunica bem seu caráter formativo e corretivo.
- source_word: אֱוִילִים
  choice: tolos
  rationale: Mantém a categoria moral característica de Provérbios e não sugere apenas falta de capacidade intelectual.
- source_word: בָּזוּ
  choice: desprezam
  rationale: Expressa com naturalidade a rejeição acompanhada de desdém ou menosprezo indicada pelo verbo hebraico.
theological_decisions:
- issue: Sentido de “temor de Yahweh” na teologia sapiencial
  choice: Manter “temor de Yahweh” no texto principal.
  alternative: “reverência por Yahweh” ou “assombro diante de Yahweh”
  rationale: A formulação hebraica reúne reverência, assombro e temor submisso. Uma opção mais explicativa estreitaria a tensão e a força moral da expressão.
- issue: Relação de רֵאשִׁית com o conhecimento
  choice: “o princípio do conhecimento”
  alternative: “o começo do conhecimento” ou “o fundamento do conhecimento”
  rationale: “Princípio” preserva a possibilidade de referência tanto ao ponto de partida quanto ao fundamento, sem decidir além do que o hebraico exige.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A estrutura breve e antitética do provérbio foi preservada; “Yahweh” mantém o nome divino, e “tolos” conserva a força moral do gênero sapiencial.
