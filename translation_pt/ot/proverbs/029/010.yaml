  text: אַנְשֵׁ֣י דָ֭מִים יִשְׂנְאוּ תָ֑ם וִֽ֝/ישָׁרִ֗ים יְבַקְשׁ֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/010.yaml
  text: Men of blood hate the blameless[a], but the upright seek his life.
translation:
  language: pt
  text: Os sanguinários odeiam quem é íntegro, mas os retos buscam a vida dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica também pode ser entendida em sentido positivo: “os retos zelam pela vida dele” ou “procuram protegê-lo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  choice: os sanguinários
  rationale: A expressão significa literalmente “homens de sangue(s)” e designa pessoas violentas ou homicidas. “Os sanguinários” comunica com naturalidade em português tanto a violência quanto a forte censura moral do hebraico.
- source_word: יִשְׂנְאוּ
  choice: odeiam
  rationale: Equivalente direto e corrente do verbo hebraico “odiar”.
- source_word: תָם
  choice: quem é íntegro
  rationale: O termo descreve alguém irrepreensível, inocente ou íntegro em sua conduta. Esta formulação é natural em português e não o confunde lexicalmente com “os retos” no segundo membro.
- source_word: וִישָׁרִים
  choice: os retos
  rationale: Termo comum da literatura sapiencial para pessoas moralmente retas; mantém o plural coletivo do hebraico.
- source_word: יְבַקְשׁוּ
  choice: buscam
  rationale: Preserva o sentido básico de “buscar, procurar” e evita decidir no texto principal se a ação visa a vida do íntegro de maneira hostil ou protetora.
- source_word: נַפְשׁוֹ
  choice: a vida dele
  rationale: Neste contexto, נֶפֶשׁ pode indicar a vida, a pessoa ou o próprio ser. “A vida dele” conserva o referente singular e a tensão interpretativa da expressão.
theological_decisions:
- issue: A expressão יְבַקְשׁוּ נַפְשׁוֹ pode sugerir buscar a vida de alguém para matá-lo ou, à luz do contraste entre os dois membros, interessar-se por sua vida e protegê-lo.
  choice: buscam a vida dele
  alternative: zelam pela vida dele; procuram protegê-lo
  rationale: A tradução principal mantém a formulação aberta do hebraico, sem resolver silenciosamente a tensão. A nota registra de modo explícito a leitura positiva favorecida pelo contraste com os sanguinários.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Os sanguinários” evita o pouco natural “homens de sangue”, enquanto “buscam a vida dele” conserva deliberadamente a ambiguidade do segundo membro.
