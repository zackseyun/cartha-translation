  text: אַנְשֵׁ֣י לָ֭צוֹן יָפִ֣יחוּ קִרְיָ֑ה וַ֝/חֲכָמִ֗ים יָשִׁ֥יבוּ אָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/008.yaml
  text: Mockers inflame a city[b][a], but wise men turn away anger.
translation:
  language: pt
  text: Os zombadores incendeiam uma cidade[a], mas os sábios fazem a ira recuar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atiçam uma cidade” ou “põem uma cidade em chamas”; o verbo hebraico pode evocar tanto o ato de acender como o de provocar tumulto na cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לָצוֹן
  choice: Os zombadores
  rationale: A expressão construta significa literalmente “homens de zombaria”. “Os zombadores” é natural, conciso e preserva o tipo moral característico de Provérbios.
- source_word: יָפִיחוּ
  choice: incendeiam
  rationale: O hifil de פוח emprega aqui uma imagem de atiçar ou fazer irromper algo. “Incendeiam” conserva a força metafórica e sugere a deflagração de tumulto social sem afirmar necessariamente um incêndio literal.
- source_word: קִרְיָה
  choice: uma cidade
  rationale: קִרְיָה designa cidade ou povoação; “cidade” é a equivalência corrente e condiz com a dimensão pública da desordem.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: Embora o hebraico tenha plural masculino, “os sábios” reproduz naturalmente a forma e mantém o paralelismo entre dois tipos de pessoas.
- source_word: יָשִׁיבוּ
  choice: fazem ... recuar
  rationale: O hifil de שוב significa fazer voltar ou afastar. “Fazem a ira recuar” preserva a imagem verbal, em vez de reduzi-la simplesmente a “acalmam”.
- source_word: אָף
  choice: a ira
  rationale: אָף significa literalmente “nariz”, mas é o termo convencional para ira. “Ira” combina com a imagem vigorosa de fazê-la recuar e mantém o tom proverbial digno.
theological_decisions: []
