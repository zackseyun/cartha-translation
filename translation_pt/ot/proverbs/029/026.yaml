  text: רַ֭בִּים מְבַקְשִׁ֣ים פְּנֵי מוֹשֵׁ֑ל וּ֝/מֵ/יְהוָ֗ה מִשְׁפַּט אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/026.yaml
  text: Many seek the face of a ruler, but from the LORD comes a man's justice.
translation:
  language: pt
  text: Muitos procuram o favor de um governante, mas do SENHOR vem a justiça de cada pessoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵי מוֹשֵׁל (pənê môšēl)
  choice: o favor de um governante
  rationale: A expressão literal “o rosto de um governante” é um idioma de acesso, atenção ou acolhimento favorável; “o favor” comunica seu sentido natural em português.
- source_word: מִשְׁפַּט אִישׁ (mišpaṭ ʾîš)
  choice: cada um recebe justiça
  rationale: מִשְׁפָּט pode indicar julgamento, decisão judicial, direito ou justiça. A formulação conserva a ideia de que a justiça devida a cada pessoa procede do SENHOR, sem atribuí-la em última instância ao governante.
- source_word: יְהוָה (YHWH)
  choice: SENHOR
  rationale: Emprega a convenção portuguesa amplamente reconhecida para representar o nome divino no texto bíblico.
theological_decisions:
- issue: Fonte última da justiça
  choice: “é do SENHOR que cada um recebe justiça”
  alternative: “do SENHOR vem o julgamento de cada um”
  rationale: A construção hebraica contrasta a busca do favor humano com a procedência divina do מִשְׁפָּט. “Justiça” mantém o foco do provérbio sem decidir se o termo se refere apenas ao veredito judicial ou, de modo mais amplo, ao direito devido à pessoa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo contrastivo foi preservado, e o idioma hebraico relativo ao “rosto” foi expresso por seu sentido contextual.
