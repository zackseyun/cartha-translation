  source_fidelity: A primeira linha transmite adequadamente o idiomatismo hebraico «buscar o rosto» como buscar favor. Na segunda, porém, «cada um recebe» introduz explicitamente um ato de receber que não está expresso no hebraico, cuja formulação é literalmente «do SENHOR [vem/é] a justiça de uma pessoa».
  naturalness: O texto é claro e moderno. «Mas do SENHOR vem a justiça de cada pessoa» é igualmente natural e preserva melhor a concisão proverbial e o paralelismo da fonte.
  terminology: «SENHOR» segue a convenção portuguesa para YHWH. «Justiça» é uma boa opção para מִשְׁפָּט e mantém a abrangência entre justiça, direito e decisão judicial; «favor» comunica adequadamente פְּנֵי no contexto.
