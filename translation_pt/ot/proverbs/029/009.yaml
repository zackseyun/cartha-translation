  text: אִֽישׁ חָכָ֗ם נִ֭שְׁפָּט אֶת אִ֣ישׁ אֱוִ֑יל וְ/רָגַ֥ז וְ֝/שָׂחַ֗ק וְ/אֵ֣ין נָֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/009.yaml
  text: If a wise man has a dispute with a foolish man[a], whether he rages or laughs[b], there is no rest.
translation:
  language: pt
  text: Se um homem sábio entra em disputa com um homem insensato,[a] quer ele se enfureça, quer ria,[b] não haverá sossego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se um homem sábio contende com um insensato, este pode se enfurecer ou rir, mas não haverá sossego”. O hebraico não identifica explicitamente se quem se enfurece ou ri é o sábio ou o insensato; para muitos intérpretes, o contexto favorece o insensato.'
    reason: alternative_reading
  - marker: b
    text: Neste contexto, “ria” pode ter o sentido de rir com desprezo ou zombar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָכָם
  choice: um homem sábio
  rationale: Mantém o masculino singular explícito do hebraico e a formulação representativa típica de Provérbios.
- source_word: נִשְׁפָּט
  choice: entra em disputa
  rationale: O nifal de שפט indica aqui envolver-se em contenda ou litígio, sem exigir que o cenário seja formalmente judicial.
- source_word: אֶת אִישׁ אֱוִיל
  choice: com um homem insensato
  rationale: Identifica a contraparte da disputa e preserva o paralelismo com “homem sábio”; “insensato” expressa a categoria sapiencial de אֱוִיל.
- source_word: וְרָגַז
  choice: se enfureça
  rationale: רגז comunica agitação ou ira intensa. O pronome não identifica seu referente, preservando a ambiguidade do hebraico.
- source_word: וְשָׂחַק
  choice: ria
  rationale: Retém o sentido básico de שׂחק, “rir”, enquanto a possível nuance de zombaria é indicada em nota.
- source_word: וְאֵין נָחַת
  choice: não haverá sossego
  rationale: נחת denota repouso, calma ou tranquilidade; “sossego” é natural em português e sugere a ausência de resolução pacífica.
theological_decisions:
- issue: Quem se enfurece ou ri
  choice: Manter o sujeito implícito por meio de “ele”
  alternative: Identificar explicitamente o homem insensato como sujeito
  rationale: O hebraico não explicita se o sujeito é o sábio ou o insensato; a tradução preserva essa ambiguidade genuína, embora muitos entendam que o contexto favorece o insensato.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “quer... quer...” preserva as duas reações contrastantes, e o pronome implícito em “ele” mantém a ambiguidade sintática do original.
