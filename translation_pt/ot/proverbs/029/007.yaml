base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/007.yaml
  text: A righteous man knows the case of the poor[b][a]; a wicked man does not understand knowledge.
translation:
  language: pt
  text: O justo conhece a causa dos pobres[a], mas o perverso não compreende conhecimento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conhece os direitos dos pobres” ou “conhece a justiça devida aos pobres”. A palavra hebraica pode significar causa, direito, julgamento ou justiça.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “não entende conhecimento”. A expressão é concisa, e sua relação exata com a primeira oração fica implícita.'
    reason: source_form
lexical_decisions:
- source_word: יֹדֵעַ
  choice: conhece
  rationale: Preserva o sentido direto de ידע, indicando que o justo reconhece e compreende a causa em questão sem ampliar para a ideia mais interpretativa de “preocupa-se com”.
- source_word: צַדִּיק
  choice: o justo
  rationale: O adjetivo substantivado singular designa um tipo representativo. “O justo” é natural e dignificado em português e mantém o contraste com “o perverso”.
- source_word: דִּין
  choice: a causa
  rationale: דִּין pode designar causa, processo, direito ou justiça. “A causa” conserva aqui a dimensão concreta, jurídica e social, sem excluir a noção dos direitos dos pobres.
- source_word: דַּלִּים
  choice: dos pobres
  rationale: O plural refere-se aos pobres, fracos ou socialmente vulneráveis. “Pobres” é claro e corrente no contexto sapiencial.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado singular contrasta com צַדִּיק. “Perverso” expressa a oposição moral sem inserir a ideia jurídica mais específica de “culpado”.
- source_word: יָבִין
  choice: entende
  rationale: בין significa entender ou discernir; “entende” oferece linguagem natural e mantém o paralelo semântico com “conhece”.
- source_word: דָּעַת
  choice: o que é conhecimento
  rationale: A construção hebraica é abrupta, literalmente “não entende conhecimento”. Esta formulação produz português inteligível sem substituir o substantivo por “a questão” nem acrescentar “tal” como conexão explícita.
theological_decisions:
- issue: Natureza do conhecimento atribuído ao justo e negado ao perverso
  choice: Manter a relação implícita entre conhecer a causa dos pobres e entender o conhecimento
  alternative: Explicitar “não entende esse conhecimento” ou interpretar como falta de preocupação pelos pobres
  rationale: O hebraico não contém demonstrativo nem declara diretamente que “conhecer” significa preocupar-se. A tradução preserva a tensão sapiencial sem impor uma explicação moral ou teológica adicional.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. O paralelismo antitético foi preservado. “Causa” mantém a possível moldura jurídica e social; a nota registra as alternativas legítimas. A formulação final evita tanto o português excessivamente truncado de “não entende conhecimento” quanto a inserção não expressa de “tal/esse conhecimento”.
