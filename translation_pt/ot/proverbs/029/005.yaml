  text: גֶּ֭בֶר מַחֲלִ֣יק עַל רֵעֵ֑/הוּ רֶ֝֗שֶׁת פּוֹרֵ֥שׂ עַל פְּעָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/005.yaml
  text: A man who flatters his neighbor spreads a net for his steps[a][b].
translation:
  language: pt
  text: O homem que lisonjeia o seu próximo[a] estende uma rede aos passos dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o seu amigo». O termo hebraico pode designar próximo, amigo ou companheiro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «aos passos dele» ou «aos pés dele» — imagem de armar uma rede no caminho de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: O homem
  rationale: Preserva o substantivo masculino singular do hebraico e seu valor representativo no estilo proverbial.
- source_word: מַחֲלִיק
  choice: que lisonjeia
  rationale: O particípio no hifil de חלק descreve aqui o uso de palavras suaves para adular; «lisonjeia» expressa isso de modo natural e conciso.
- source_word: עַל רֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode indicar próximo, amigo ou companheiro. «Próximo» mantém a amplitude social do termo; a preposição עַל é absorvida pela regência natural de «lisonjear» em português.
- source_word: רֶשֶׁת
  choice: uma rede
  rationale: Mantém a imagem concreta de uma rede usada como armadilha.
- source_word: פּוֹרֵשׂ
  choice: estende
  rationale: פרש significa abrir ou estender; «estende uma rede» é uma combinação natural em português e conserva a metáfora.
- source_word: עַל פְּעָמָיו
  choice: para os passos dele
  rationale: Preserva a imagem hebraica dos passos ou pés que serão apanhados. «Dele» esclarece naturalmente que o sufixo se refere ao próximo, sem substituir a metáfora por «no caminho».
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a imagem concreta do hebraico; «dele» evita a ambiguidade referencial que «seus» teria em português.
