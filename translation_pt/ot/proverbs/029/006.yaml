base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/006.yaml
  text: In the transgression of an evil man there is a snare[b][a], but the righteous sings for joy and rejoices.
translation:
  language: pt
  text: Na transgressão do homem mau há uma armadilha[a], mas o justo canta de alegria e se alegra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa da transgressão do homem mau, há uma armadilha”. O hebraico pode enfatizar tanto que a armadilha está na própria transgressão quanto que a transgressão a produz.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “dá gritos de alegria e está contente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Na transgressão
  rationale: Preserva de modo compacto a preposição בְּ, que pode indicar tanto o âmbito em que se encontra a armadilha quanto o meio ou a causa pela qual ela surge.
- source_word: אִישׁ רָע
  choice: do homem mau
  rationale: Mantém o masculino singular do hebraico e expressa com clareza o contraste moral do provérbio.
- source_word: מוֹקֵשׁ
  choice: uma armadilha
  rationale: Comunica naturalmente em português a imagem sapiencial de algo que captura ou enreda.
- source_word: צַדִּיק
  choice: o justo
  rationale: Emprega o adjetivo substantivado como designação representativa, uso tradicional e natural no contexto da literatura sapiencial.
- source_word: יָרוּן
  choice: canta de alegria
  rationale: Expressa a manifestação vocal e jubilosa indicada pelo verbo, sem reduzi-la a um sentimento apenas interior.
- source_word: וְשָׂמֵחַ
  choice: e se alegra
  rationale: Preserva a segunda expressão de alegria e o paralelismo, com formulação corrente em português.
theological_decisions:
- issue: Relação entre a transgressão e a armadilha
  choice: Na transgressão do homem mau há uma armadilha
  alternative: Por causa da transgressão do homem mau, há uma armadilha
  rationale: O hebraico permite entender a armadilha como inerente à transgressão ou como resultado produzido por ela; o texto principal conserva a formulação mais compacta, e a nota registra a alternativa causal.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. “Transgressão” preserva a força moral de פֶּשַׁע, enquanto “armadilha” torna a imagem imediatamente compreensível. A repetição de ideias em “canta de alegria e se alegra” mantém o paralelismo hebraico.
