  yaml_path: translation/ot/proverbs/029/020.yaml
  text: Do you see a man who is hasty in his words? There is more hope for a fool than for him[a].
translation:
  language: pt
  text: Você vê um homem precipitado em suas palavras? Há mais esperança para o insensato do que para ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você já viu um homem precipitado em suas palavras? Há mais esperança para o insensato do que para ele.” O verbo perfeito que abre o versículo pode ser entendido como uma observação retórica no presente ou como uma pergunta sobre algo já observado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: Você vê
  rationale: O qal perfeito na segunda pessoa masculina singular pode introduzir uma observação retórica na literatura sapiencial. O presente em forma de pergunta comunica essa força com naturalidade em português, preservando a interpelação direta.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo hebraico singular masculino e sua função representativa no provérbio.
- source_word: אָץ
  choice: precipitado
  rationale: O termo descreve quem age ou fala com pressa indevida. “Precipitado” é atual e natural em associação com palavras, sem ampliar o sentido para impulsividade em geral.
- source_word: בִּדְבָרָיו
  choice: em suas palavras
  rationale: Reproduz de perto a construção hebraica e mantém o foco explícito no modo de falar do homem.
- source_word: תִּקְוָה
  choice: esperança
  rationale: É o equivalente corrente do substantivo e, neste contexto, expressa a perspectiva de correção ou de um desfecho favorável.
- source_word: לִכְסִיל
  choice: para o insensato
  rationale: “Insensato” é um termo tradicional e compreensível em Provérbios, conservando tanto a dimensão intelectual quanto a moral de כְּסִיל.
- source_word: מִמֶּנּוּ
  choice: do que para ele
  rationale: Explicita naturalmente em português a comparação introduzida por מִן e retoma sem ambiguidade o homem precipitado.
