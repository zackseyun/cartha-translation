  text: תּוֹעֲבַ֣ת צַ֭דִּיקִים אִ֣ישׁ עָ֑וֶל וְ/תוֹעֲבַ֖ת רָשָׁ֣ע יְשַׁר דָּֽרֶךְ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/027.yaml
  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
translation:
  language: pt
  text: O homem injusto é uma abominação para os justos[a], e aquele cujo caminho é reto é uma abominação para o perverso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «é detestável para» ou «causa repulsa a».
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: é abominável para
  rationale: O substantivo em construção expressa aquilo que causa forte repulsa. A formulação preserva a intensidade moral e o paralelismo dos dois membros, em português natural.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: Adjetivo plural substantivado; «os justos» mantém a categoria moral e é expressão bíblica corrente e inteligível.
- source_word: אִישׁ עָוֶל
  choice: o homem injusto
  rationale: Mantém o substantivo masculino singular representativo אִישׁ e expressa o valor caracterizador de עָוֶל como injustiça ou perversidade.
- source_word: רָשָׁע
  choice: o perverso
  rationale: Adjetivo singular substantivado. «O perverso» conserva o singular genérico e evita repetir «injusto», mantendo a distinção lexical do hebraico.
- source_word: יְשַׁר דָּרֶךְ
  choice: aquele cujo caminho é reto
  rationale: Preserva a imagem sapiencial do «caminho» como modo de vida e comunica naturalmente a retidão moral.
- source_word: דָּרֶךְ
  choice: caminho
  rationale: Mantém a metáfora característica da literatura sapiencial para a conduta e o modo de viver.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ עָוֶל
  choice: o homem injusto
  alternative: a pessoa injusta; o injusto
  rationale: O hebraico emprega substantivo masculino singular em sentido representativo. A tradução conserva essa forma sem restringir necessariamente a máxima aos homens.
- issue: Força moral de תּוֹעֲבַת
  choice: é abominável para
  alternative: é detestável para; causa repulsa a
  rationale: «Abominável» preserva a forte aversão moral do termo sem explicar se a repulsa é aprovação divina ou reação humana; aqui o texto descreve a oposição recíproca entre tipos morais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo antitético e a metáfora de «caminho» foram preservados. O marcador [a] aparece imediatamente após a primeira ocorrência da expressão à qual se aplica também por paralelismo.
