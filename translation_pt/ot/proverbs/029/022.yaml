    rationale: בַעַל חֵמָה designa uma pessoa caracterizada por ira ardente; «homem colérico» é mais próximo e mantém registro natural.
  - severity: low
    issue: «Comete muitas transgressões» explicita quantidade, onde o hebraico também pode salientar abundância ou multiplicação.
    rationale: «Acumula transgressões» preserva essa nuance e continua sendo português corrente.
