base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/022.yaml
  text: An angry man stirs up strife[b][a], and a hot-tempered man abounds in transgression.
translation:
  language: pt
  text: O homem irascível provoca contendas, e o homem colérico acumula transgressões.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “um homem de ira ... e um dono da fúria”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “abunda em transgressão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אַף
  choice: o homem irado
  rationale: A expressão significa literalmente “homem de ira” e descreve alguém caracterizado pela raiva. “Homem irado” é natural em português e conserva o paralelismo masculino singular do hebraico.
- source_word: יְגָרֶה
  choice: atiça
  rationale: O verbo denota provocar ou incitar. “Atiçar” comunica vividamente a ação de fomentar a discórdia.
- source_word: מָדוֹן
  choice: a discórdia
  rationale: O substantivo designa contenda, conflito ou desavença. “Discórdia” é claro, conciso e adequado ao registro sapiencial.
- source_word: בַעַל חֵמָה
  choice: o homem de temperamento explosivo
  rationale: Literalmente, “senhor da fúria”, expressão idiomática para alguém habitualmente dominado por ira intensa. A escolha portuguesa comunica uma disposição persistente, não apenas um acesso momentâneo.
- source_word: רַב
  choice: comete muitas
  rationale: Ligado a פָשַׁע, exprime abundância. Em português corrente, “comete muitas transgressões” transmite naturalmente que tal pessoa se caracteriza por numerosas transgressões, sem excluir a leitura mais literal indicada em nota.
- source_word: פָשַׁע
  choice: transgressões
  rationale: O termo envolve transgressão ou rebeldia moral, sendo mais forte que um erro genérico. “Transgressões” preserva essa gravidade sem restringir o sentido à rebelião política.
