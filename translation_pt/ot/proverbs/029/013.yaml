  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/013.yaml
  text: A poor man and an oppressor meet together[b][a]; Yahweh gives light to the eyes of both of them.
translation:
  language: pt
  text: O pobre e o opressor se encontram[a]; Yahweh dá luz aos olhos de ambos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homem de opressões”. A expressão hebraica pode referir-se a uma pessoa exploradora ou opressora; também tem sido entendida como “homem enganador” ou “usurário”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “dar luz aos olhos” pode significar dar visão, dar vida, sustentar ou iluminar.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: o pobre
  rationale: O substantivo designa uma pessoa pobre ou necessitada. A forma singular preserva a concisão e o contraste proverbial do hebraico.
- source_word: אִישׁ תְּכָכִים
  choice: o opressor
  rationale: A expressão é difícil e literalmente próxima de “homem de opressões”. “O opressor” comunica de modo natural o provável sentido de alguém que explora ou oprime, sem ocultar as demais possibilidades, registradas em nota.
- source_word: נִפְגָּשׁוּ
  choice: se encontram
  rationale: O nifal de פגשׁ normalmente significa encontrar-se ou deparar-se. A formulação preserva a imagem concreta e pode também sugerir a condição comum explicada na segunda linha.
- source_word: מֵאִיר
  choice: dá luz
  rationale: O hifil de אור significa fazer brilhar ou dar luz. Com “olhos”, pode aludir a visão, vida, sustento ou esclarecimento; a tradução mantém a metáfora e sua amplitude.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: aos olhos de ambos
  rationale: A expressão reproduz com naturalidade a construção hebraica e enfatiza que as duas pessoas dependem igualmente de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido da segunda linha do provérbio
  choice: Yahweh dá luz aos olhos tanto do pobre quanto do opressor.
  alternative: Yahweh lhes concede especificamente visão, vida, sustento ou iluminação moral e espiritual.
  rationale: O hebraico afirma literalmente que Yahweh “dá luz aos olhos de ambos”. Como a expressão admite várias nuances, a tradução conserva a imagem e não define indevidamente qual delas predomina.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura breve e antitética própria do provérbio foi preservada; as notas mantêm visíveis a dificuldade lexical e a amplitude da metáfora hebraica.
