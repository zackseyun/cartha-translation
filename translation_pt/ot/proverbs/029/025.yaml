  text: חֶרְדַּ֣ת אָ֭דָם יִתֵּ֣ן מוֹקֵ֑שׁ וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה יְשֻׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
translation:
  language: pt
  text: O medo das pessoas arma uma cilada[a], mas quem confia em Yahweh será colocado no alto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “dá uma cilada”. A expressão indica que o medo das pessoas se torna uma armadilha.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estará seguro” ou “será protegido”. O hebraico descreve literalmente alguém sendo colocado no alto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת אָדָם
  choice: O medo das pessoas
  rationale: A construção expressa o temor ou pavor diante de seres humanos. “Das pessoas” comunica em português atual o sentido genérico de אָדָם sem sugerir apenas indivíduos do sexo masculino.
- source_word: יִתֵּן מוֹקֵשׁ
  choice: arma uma cilada
  rationale: Literalmente, “dá uma cilada”. A formulação idiomática preserva a imagem de algo que captura e expressa com naturalidade que esse medo se torna uma armadilha.
- source_word: וּבוֹטֵחַ
  choice: mas quem confia
  rationale: O particípio substantivado tem valor genérico e habitual. “Quem confia” reproduz esse alcance de modo natural e conciso.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: Mantém o nome divino expresso pelo tetragrama יהוה, em vez de substituí-lo por um título.
- source_word: יְשֻׂגָּב
  choice: será posto em lugar seguro
  rationale: O verbo retrata alguém colocado numa altura inacessível e, por isso, protegido. A escolha conserva a ideia de ser colocado em segurança, enquanto a nota registra a imagem literal da altura.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Alcance genérico de אָדָם
  choice: pessoas
  alternative: homem; seres humanos
  rationale: No contexto, o provérbio fala do medo de outras pessoas em geral. “Pessoas” transmite esse sentido amplo e natural sem restringir o referente a homens.
- issue: Imagem ou resultado em יְשֻׂגָּב
  choice: será posto em lugar seguro
  alternative: será colocado no alto; estará protegido
  rationale: A tradução principal comunica a segurança resultante sem eliminar totalmente a ideia espacial do verbo; a nota preserva a metáfora literal e as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo entre temer pessoas e confiar em Yahweh foi mantido. “Cilada” conserva a imagem sapiencial, e as notas registram as formulações hebraicas mais literais.
