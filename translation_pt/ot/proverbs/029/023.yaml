  text: גַּאֲוַ֣ת אָ֭דָם תַּשְׁפִּילֶ֑/נּוּ וּ/שְׁפַל ר֝֗וּחַ יִתְמֹ֥ךְ כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/023.yaml
  text: A man's pride will bring him low[a], but one who is lowly in spirit will obtain honor.
translation:
  language: pt
  text: O orgulho de uma pessoa a rebaixará, mas quem é humilde de espírito alcançará[a] honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conservará a honra” ou “obterá honra”. O verbo hebraico pode ter o sentido de agarrar, sustentar, conservar ou alcançar.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּאֲוַת
  choice: orgulho
  rationale: Expressa a elevada opinião de si mesmo e mantém com naturalidade o contraste sapiencial com a humildade.
- source_word: אָדָם
  choice: uma pessoa
  rationale: O substantivo singular tem aqui sentido representativo e genérico; “uma pessoa” preserva esse valor em português atual sem restringi-lo ao sexo masculino.
- source_word: תַּשְׁפִּילֶנּוּ
  choice: a rebaixará
  rationale: 'Preserva o sentido causativo do hifil de שׁפל: o orgulho faz a pessoa descer de posição ou condição.'
- source_word: וּשְׁפַל רוּחַ
  choice: mas quem é humilde de espírito
  rationale: Mantém a imagem hebraica de uma disposição interior baixa ou humilde, em formulação clara e digna.
- source_word: יִתְמֹךְ
  choice: alcançará
  rationale: No contexto de כָּבוֹד, comunica naturalmente a ideia de chegar à posse da honra, embora o verbo também possa significar segurar ou conservar.
- source_word: כָּבוֹד
  choice: honra
  rationale: No contexto de Provérbios, refere-se adequadamente à honra ou estima, em contraste com ser rebaixado.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A estrutura antitética do provérbio foi preservada, bem como a metáfora “humilde de espírito”. O pronome em “a rebaixará” retoma “uma pessoa” e evita inserir uma especificação masculina ausente do sentido genérico do contexto.
