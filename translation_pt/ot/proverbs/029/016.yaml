  text: בִּ/רְב֣וֹת רְ֭שָׁעִים יִרְבֶּה פָּ֑שַׁע וְ֝/צַדִּיקִ֗ים בְּֽ/מַפַּלְתָּ֥/ם יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/016.yaml
  text: When the wicked increase[a], transgression increases; but the righteous will look upon their downfall.
translation:
  language: pt
  text: Quando os perversos se multiplicam, multiplica-se a transgressão; mas os justos verão a queda deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “verão a ruína deles”. O verbo hebraico significa simplesmente “ver”, e o substantivo pode ser traduzido por “queda” ou “ruína”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Quando ... se multiplicam
  rationale: A preposição בְּ com o infinitivo construto de רבה introduz uma oração temporal ou circunstancial. A formulação preserva tanto esse valor quanto a repetição da raiz no segundo segmento.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado plural designa pessoas moralmente culpadas. “Os perversos” é claro, digno e corrente na literatura sapiencial.
- source_word: יִרְבֶּה
  choice: multiplica-se
  rationale: O imperfeito qal de רבה retoma deliberadamente o verbo do primeiro segmento. “Multiplica-se” preserva essa repetição e concorda naturalmente com “a transgressão”.
- source_word: פָּשַׁע
  choice: a transgressão
  rationale: O termo pode indicar transgressão ou rebelião contra uma ordem reconhecida, sendo mais específico que o termo genérico “pecado”.
- source_word: וְצַדִּיקִים
  choice: mas os justos
  rationale: Embora וְ seja normalmente aditivo, aqui o paralelismo lhe dá força contrastiva. “Mas” torna esse contraste natural em português.
- source_word: בְּמַפַּלְתָּם
  choice: a queda deles
  rationale: מַפָּלָה significa queda, ruína ou derrocada, e o sufixo masculino plural remete mais naturalmente aos perversos. Com ראה, a preposição בְּ não precisa ser representada separadamente em português.
- source_word: יִרְאוּ
  choice: verão
  rationale: O sentido básico de ראה é “ver”. A escolha evita acrescentar uma ideia de satisfação ou triunfo que não está expressa no hebraico.
theological_decisions:
- issue: Referente do sufixo em בְּמַפַּלְתָּם (“queda deles”)
  choice: O sufixo se refere aos perversos do primeiro segmento.
  alternative: O sufixo poderia, em tese, referir-se de modo mais geral aos que caem.
  rationale: “Os perversos” é o antecedente plural masculino mais próximo e o paralelismo contrasta sua multiplicação presente com a queda que os justos acabarão vendo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “se multiplicam / multiplica-se” reproduz o jogo verbal hebraico sem tornar a frase artificial; “verão” mantém a sobriedade do original e não introduz triunfalismo.
