  text: A man who loves wisdom makes his father glad[a], but one who keeps company with prostitutes destroys wealth.
translation:
  language: pt
  text: O homem que ama a sabedoria alegra seu pai, mas quem se associa a prostitutas[a] destrói sua riqueza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pastoreia prostitutas” ou, possivelmente, “alimenta-se com prostitutas”; a expressão hebraica indica associar-se a elas ou frequentá-las.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: O homem
  rationale: O substantivo hebraico está no singular masculino e apresenta uma figura representativa típica dos provérbios. “O homem” preserva a forma do original e funciona aqui em sentido geral.
- source_word: אֹהֵב חָכְמָה
  choice: que ama a sabedoria
  rationale: O particípio descreve uma característica contínua. “Sabedoria” traduz diretamente חָכְמָה sem restringir o sentido a instrução.
- source_word: יְשַׂמַּח
  choice: alegra
  rationale: A forma Piel expressa que o filho faz o pai se alegrar. “Alegra” é natural, conciso e mantém o valor causativo.
- source_word: אָבִיו
  choice: seu pai
  rationale: O substantivo com sufixo masculino singular significa especificamente “seu pai”, não apenas “seu progenitor” ou “seus pais”.
- source_word: וְרֹעֶה
  choice: mas quem anda na companhia de
  rationale: Embora רעה tenha o sentido literal de pastorear ou alimentar, nesta construção indica convivência ou associação habitual. A expressão escolhida comunica o idioma hebraico em português natural; a nota preserva a imagem literal.
- source_word: זֹנוֹת
  choice: prostitutas
  rationale: O plural feminino designa mulheres que exercem prostituição. “Prostitutas” é atual, preciso e evita termos arcaicos ou gratuitamente depreciativos.
- source_word: יְאַבֶּד
  choice: destrói
  rationale: O Piel de אבד comunica destruição ou perda ruinosa. “Destrói” preserva a força do verbo, em vez de reduzi-lo apenas à ideia de gastar.
- source_word: הוֹן
  choice: a própria riqueza
  rationale: 'הוֹן designa riqueza, bens ou patrimônio. “A própria” explicita em português a relação naturalmente inferida no contexto: é a riqueza daquele que mantém tal companhia que se perde.'
