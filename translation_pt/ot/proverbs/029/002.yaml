  text: בִּ/רְב֣וֹת צַ֭דִּיקִים יִשְׂמַ֣ח הָ/עָ֑ם וּ/בִ/מְשֹׁ֥ל רָ֝שָׁ֗ע יֵאָ֥נַֽח עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/002.yaml
  text: When the righteous increase[a], the people rejoice; but when a wicked man rules, the people groan.
translation:
  language: pt
  text: Quando os justos se multiplicam[a], o povo se alegra; mas, quando um perverso governa, o povo geme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando há muitos justos, o povo se alegra.” A construção hebraica pode destacar tanto o aumento quanto a grande quantidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: quando ... se multiplicam
  rationale: A preposição בְּ com o infinitivo construto de רבה forma uma oração temporal. “Se multiplicam” preserva o sentido de aumento, sem excluir a ideia de serem muitos.
- source_word: צַדִּיקִים
  choice: os justos
  rationale: O adjetivo plural substantivado designa uma classe de pessoas e é expresso de modo conciso e natural.
- source_word: יִשְׂמַח
  choice: se alegra
  rationale: שׂמח indica alegria ou contentamento. “Se alegra” é natural em português e mantém o contraste com “geme”.
- source_word: הָעָם
  choice: o povo
  rationale: עַם refere-se aqui à população como coletividade; “o povo” é a formulação mais direta e idiomática.
- source_word: וּבִמְשֹׁל
  choice: mas, quando ... governa
  rationale: A conjunção introduz o segundo membro antitético, e בְּ com o infinitivo construto forma novamente uma oração temporal. “Mas, quando” torna claro o contraste proverbial.
- source_word: רָשָׁע
  choice: um perverso
  rationale: O adjetivo singular substantivado aponta para uma pessoa perversa que exerce governo. A forma é inclusiva quanto ao gênero em português, sem apagar a referência singular do hebraico.
- source_word: יֵאָנַח
  choice: geme
  rationale: O nifal de אנח expressa gemer ou suspirar sob aflição. “Geme” comunica com força o sofrimento causado pelo governo perverso.
- source_word: עָם
  choice: o povo
  rationale: Embora sem artigo no segundo membro hebraico, refere-se naturalmente à mesma coletividade; a repetição mantém o paralelismo e soa idiomática em português.
