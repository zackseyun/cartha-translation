  text: מֶ֗לֶךְ בְּ֭/מִשְׁפָּט יַעֲמִ֣יד אָ֑רֶץ וְ/אִ֖ישׁ תְּרוּמ֣וֹת יֶֽהֶרְסֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/004.yaml
  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
translation:
  language: pt
  text: Um rei firma o país pela justiça, mas um homem[b] que recebe subornos[a] o arruína.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um homem de contribuições/ofertas”. O termo hebraico pode indicar ofertas, contribuições ou tributos, mas, neste contexto, provavelmente se refere a pagamentos corruptos, daí “subornos”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “um homem”, empregado aqui em sentido representativo ou genérico.'
    reason: cultural_note
lexical_decisions:
- source_word: מֶלֶךְ
  choice: um rei
  rationale: O substantivo sem artigo tem sentido genérico, próprio do estilo proverbial; não se refere a um rei específico.
- source_word: בְּמִשְׁפָּט
  choice: pela justiça
  rationale: מִשְׁפָּט pode designar justiça, julgamento ou ordem jurídica; aqui indica o governo exercido segundo decisões justas.
- source_word: יַעֲמִיד
  choice: firma
  rationale: O hifil de עמד expressa fazer permanecer ou dar estabilidade. “Firma” conserva de modo conciso essa ideia causativa no contexto do governo.
- source_word: אָרֶץ
  choice: o país
  rationale: Neste provérbio, o termo se refere ao território ou reino governado, não ao planeta inteiro. Em português, “o país” retoma naturalmente a referência genérica iniciada por “um rei”.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o masculino singular do hebraico, empregado de maneira representativa ou genérica.
- source_word: תְּרוּמוֹת
  choice: que recebe subornos
  rationale: Embora תְּרוּמוֹת possa significar contribuições, ofertas ou tributos, o contraste com o governo justo favorece pagamentos corruptos. A formulação verbal é mais natural em português do que “homem de subornos”, sem ocultar a alternativa lexical, registrada em nota.
- source_word: יֶהֶרְסֶנָּה
  choice: o arruína
  rationale: הרס significa demolir ou derrubar. “Arruína” comunica naturalmente a destruição do país e preserva o contraste com “firma”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com estrutura proverbial concisa. “Firma o país” preserva a imagem de estabilidade, enquanto “o arruína” expressa com naturalidade o efeito destrutivo do verbo hebraico.
