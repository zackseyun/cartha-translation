  text: מֶ֤לֶךְ שׁוֹפֵ֣ט בֶּֽ/אֱמֶ֣ת דַּלִּ֑ים כִּ֝סְא֗/וֹ לָ/עַ֥ד יִכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/014.yaml
  text: A king who judges the poor with truth—his throne will be established forever[a].
translation:
  language: pt
  text: O rei que julga os pobres com verdade terá o seu trono estabelecido para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «julga os pobres com fidelidade» ou «julga os pobres com justiça». A expressão hebraica «com verdade» pode indicar verdade, fidelidade ou justiça no julgamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: O rei
  rationale: O substantivo descreve genericamente o monarca apresentado pelo provérbio. Em português, o artigo definido é natural nessa formulação de princípio geral e preserva o cenário régio concreto.
- source_word: שׁוֹפֵט
  choice: que julga
  rationale: O particípio caracteriza o rei e mantém o sentido judicial específico, sem ampliá-lo para o governo em geral.
- source_word: בֶּאֱמֶת
  choice: com verdade
  rationale: A tradução formal preserva a amplitude de אֱמֶת, que pode envolver verdade, fidelidade e justiça; a nota registra alternativas mais idiomáticas sem reduzir a ambiguidade.
- source_word: דַּלִּים
  choice: os pobres
  rationale: דַּלִּים designa pessoas de condição baixa, pobres ou vulneráveis. «Os pobres» é claro, corrente e adequado ao contexto de justiça régia.
- source_word: כִּסְאוֹ
  choice: seu trono
  rationale: Preserva tanto a imagem concreta do trono quanto seu valor metonímico de poder e continuidade dinástica.
- source_word: לָעַד
  choice: para sempre
  rationale: Reproduz a expressão hebraica de duração permanente, deixando que o gênero proverbial determine sua força contextual.
- source_word: יִכּוֹן
  choice: terá ... estabelecido
  rationale: Expressa o valor passivo e resultativo do nifal de כון. A construção portuguesa é natural e mantém a ideia de firmeza e estabilidade do trono.
theological_decisions:
- issue: Força de לָעַד na literatura sapiencial
  choice: para sempre
  alternative: por muito tempo; de modo duradouro
  rationale: A expressão é mantida em sua força lexical normal, sem transformá-la explicitamente numa garantia metafísica absoluta nem enfraquecê-la. No contexto proverbial, comunica estabilidade régia duradoura.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem foi ajustada para fluência natural, preservando o paralelismo causal implícito e a imagem do trono.
