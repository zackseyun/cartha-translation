source:
  edition: WLC
  text: מֹ֭שֵׁל מַקְשִׁ֣יב עַל דְּבַר שָׁ֑קֶר כָּֽל מְשָׁרְתָ֥י/ו רְשָׁעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/012.yaml
  text: If a ruler listens to a lying word, all his servants become wicked.
translation:
  language: pt
  text: Se um governante dá ouvidos a uma palavra mentirosa, todos os seus servos são maus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹשֵׁל
  choice: governante
  rationale: Expressa de modo natural a pessoa que exerce autoridade, sem restringir o sentido a um título político específico.
- source_word: מַקְשִׁיב עַל דְּבַר שָׁקֶר
  choice: dá ouvidos à mentira
  rationale: Reproduz idiomaticamente a ideia de prestar atenção ou acolher uma declaração falsa; 'mentira' comunica com clareza דְּבַר שָׁקֶר sem tornar a frase pesada.
- source_word: מְשָׁרְתָיו
  choice: seus servos
  rationale: Mantém a relação de serviço oficial ou cortesão indicada pelo termo, em registro bíblico corrente e compreensível.
- source_word: רְשָׁעִים
  choice: perversos
  rationale: Conserva a dimensão moral forte do hebraico, evitando limitar o termo a desonestidade ou criminalidade.
theological_decisions:
- issue: Valor verbal da segunda oração nominal
  choice: se tornam perversos
  alternative: são perversos
  rationale: O hebraico não apresenta um verbo explícito e permite uma leitura descritiva ('são') ou resultativa ('tornam-se'). A formulação escolhida explicita a consequência provável do comportamento do governante, em consonância com a relação proverbial entre as duas orações, sem introduzir uma doutrina específica.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. A expressão idiomática 'dá ouvidos' preserva a força sapiencial e a relação causal implícita do provérbio.
