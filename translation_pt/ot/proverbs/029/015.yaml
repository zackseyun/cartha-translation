base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/015.yaml
  text: A rod and reproof give wisdom[a], but a boy left to himself brings shame to his mother.
translation:
  language: pt
  text: A vara e a repreensão dão sabedoria, mas o menino deixado por conta própria[a] envergonha a própria mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixado sem controle” ou “deixado sem disciplina”. O hebraico traz literalmente a ideia de um menino “solto” ou “deixado livre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: vara
  rationale: Preserva a imagem concreta do instrumento de disciplina, sem ampliá-la para o conceito abstrato de punição.
- source_word: וְתוֹכַחַת
  choice: e a repreensão
  rationale: Expressa a correção verbal e mantém o paralelismo entre disciplina física e advertência falada.
- source_word: יִתֵּן חָכְמָה
  choice: dão sabedoria
  rationale: O sujeito composto pede o plural em português; a formulação conserva a simplicidade e concisão do hebraico.
- source_word: נַעַר
  choice: menino
  rationale: O contexto de formação parental favorece um filho ainda sob os cuidados da mãe, preservando também o masculino singular do texto.
- source_word: מְשֻׁלָּח
  choice: deixado à própria vontade
  rationale: Comunica o sentido contextual de alguém solto, sem contenção ou disciplina, sem sugerir necessariamente abandono físico.
- source_word: מֵבִישׁ
  choice: envergonha
  rationale: Verbo causativo e idiomático em português, correspondente a causar vergonha ou desonra.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Traduz diretamente o sufixo masculino singular e retoma o menino.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com legibilidade brasileira e alcance internacional. “À própria vontade” é mais natural neste contexto do que o decalque “entregue a si mesmo” e preserva a noção de falta de contenção. O marcador [a] aparece imediatamente após a expressão a que se refere.
