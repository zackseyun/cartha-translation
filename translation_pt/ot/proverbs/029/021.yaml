  yaml_path: translation/ot/proverbs/029/021.yaml
  text: Whoever pampers his slave from youth[a], in the end he will become a son.
translation:
  language: pt
  text: Quem mima o seu escravo desde jovem, no fim ele se tornará como um filho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido do termo hebraico מָנוֹן (manon) é incerto. Ele pode indicar “filho” ou “alguém que age como filho”, possivelmente sugerindo que o escravo mimado passa a agir ou a reivindicar uma posição filial. Outros o entendem de modo mais geral como “problema” ou “insubordinação”.
    reason: alternative_reading
lexical_decisions:
- source_word: מְפַנֵּק
  choice: mima
  rationale: O particípio piel de פנק descreve tratar alguém com excesso de delicadeza ou indulgência. “Mima” é natural em português e preserva a censura implícita no provérbio.
- source_word: מִנֹּעַר
  choice: desde a juventude
  rationale: A expressão indica que esse tratamento começa cedo. A formulação mantém a concisão do hebraico sem acrescentar um possessivo ausente no texto.
- source_word: עַבְדּוֹ
  choice: seu escravo
  rationale: עבד pode designar servo ou escravo; neste contexto doméstico, a pessoa está subordinada à autoridade de um senhor. “Escravo” comunica com maior clareza essa realidade social e jurídica.
- source_word: וְאַחֲרִיתוֹ
  choice: no fim
  rationale: אַחֲרִית aponta para o desfecho ou resultado posterior. “No fim” é breve, idiomático e adequado à estrutura proverbial.
- source_word: יִהְיֶה
  choice: o verá tornar-se
  rationale: O verbo היה expressa o estado ou resultado futuro. A formulação portuguesa torna explícita a perspectiva do senhor, sugerida pelo provérbio, sem determinar além do necessário se o resultado é condição formal ou comportamento.
- source_word: מָנוֹן
  choice: como filho
  rationale: מָנוֹן é um termo raro e de sentido incerto. “Como filho” representa a antiga compreensão ligada à condição ou conduta filial, mas evita afirmar sem ressalvas uma adoção formal; a nota registra outras interpretações relevantes.
theological_decisions:
- issue: Se o desfecho descreve filiação formal, pretensão à condição de filho ou um resultado negativo mais geral
  choice: como filho, com nota de incerteza
  alternative: problema; insubordinação; filho
  rationale: O termo hebraico decisivo é obscuro. A tradução principal preserva a possível imagem filial sem transformar a frase numa declaração inequívoca de adoção, enquanto a nota mantém abertas as leituras negativas atestadas.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. “Mima” é corrente e expressa indulgência excessiva; “escravo” preserva a realidade social do termo hebraico. A formulação “como filho” e a nota evitam resolver silenciosamente a incerteza lexical de מָנוֹן.
