  naturalness: “Quem mima o seu escravo desde jovem, no fim ele se tornará como um filho” é claro, conciso e natural em português moderno. “Desde jovem” soa mais idiomático do que “desde a juventude” neste contexto e deixa explícito, pelo antecedente próximo, que se trata do escravo.
  terminology: “Escravo” reproduz apropriadamente a realidade social indicada por עֶבֶד neste provérbio. “Como um filho” é uma solução cautelosa para a leitura filial de מָנוֹן, sem afirmar uma adoção formal. A nota deve apresentar as alternativas como possibilidades lexicais, sem fazer da pretensão do escravo uma consequência certa.
