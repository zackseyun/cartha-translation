  - severity: low
    issue: Nota formula de modo excessivamente assertivo a implicação da leitura filial
    rationale: “Passa a reivindicar a posição de filho” é uma explicação interpretativa possível, mas o termo raro מָנוֹן não permite apresentá-la como resultado inequívoco. Convém usar formulação modal.
