- from: O homem que, mesmo depois de muitas repreensões, endurece a sua cerviz será quebrado de repente, sem que haja remédio.[a]
  to: O homem que, apesar de muitas repreensões, endurece a cerviz será quebrado de repente, sem remédio.[a]
  rationale: A revisão elimina a implicação temporal desnecessária de «depois de» e torna a expressão idiomática mais natural, mantendo a metáfora da cerviz, a passiva «será quebrado», a súbita ruína e a ausência de cura ou remédio. A nota continua oferecendo a alternativa mais literal e preservando a coordenação final hebraica.
