  text: אִ֣ישׁ תּ֭וֹכָחוֹת מַקְשֶׁה עֹ֑רֶף פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/001.yaml
  text: A man often reproved[a], who stiffens his neck, will suddenly be broken beyond healing.
translation:
  language: pt
  text: O homem que, apesar de muitas repreensões, endurece a cerviz será quebrado de repente, sem remédio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O homem de muitas repreensões, que endurece a cerviz, será quebrado de repente, e não haverá cura.”'
    reason: A construção hebraica אִישׁ תּוֹכָחוֹת pode ser entendida mais literalmente como “homem de repreensões”; a nota também preserva a forma coordenada explícita da cláusula final.
lexical_decisions:
- source_word: אִישׁ
  choice: o homem
  rationale: O substantivo hebraico está no singular masculino e apresenta um indivíduo representativo numa máxima sapiencial; “o homem” preserva a forma e funciona genericamente no contexto proverbial.
- source_word: תּוֹכָחוֹת
  choice: depois de muitas repreensões
  rationale: O plural indica repreensões repetidas. Esta formulação comunica naturalmente que o homem recebeu muitas advertências, sem transformar o substantivo em uma ideia diferente.
- source_word: מַקְשֶׁה עֹרֶף
  choice: endurece a sua cerviz
  rationale: Preserva a metáfora corporal hebraica de resistência obstinada. “Cerviz” é uma palavra bíblica reconhecível em português e evita reduzir a expressão simplesmente a “é teimoso”.
- source_word: פֶּתַע
  choice: de repente
  rationale: Expressa de modo direto a brusquidão indicada pelo advérbio hebraico.
- source_word: יִשָּׁבֵר
  choice: será quebrado
  rationale: Mantém a voz passiva e a metáfora de שׁבר, sem especificar indevidamente se a ruína é física, social ou moral.
- source_word: וְאֵין מַרְפֵּא
  choice: sem que haja remédio
  rationale: Reflete a construção literal “e não há cura/remédio” e comunica a finalidade irreversível do desfecho.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão “endurece a sua cerviz” conserva deliberadamente a imagem hebraica tradicional; o restante da frase usa sintaxe corrente. O marcador [a] aparece no texto principal e corresponde à nota.
