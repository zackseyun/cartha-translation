  text: בִּ֭/דְבָרִים לֹא יִוָּ֣סֶר עָ֑בֶד כִּֽי יָ֝בִ֗ין וְ/אֵ֣ין מַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/019.yaml
  text: A slave is not corrected by words alone[a], for though he understands[b], there is no response.
translation:
  language: pt
  text: Um escravo não é corrigido apenas com palavras[a], pois, embora entenda, não há resposta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um servo não é corrigido apenas com palavras”. O hebraico עָבֶד pode designar um servo ou um escravo, conforme o contexto; aqui, “escravo” preserva a condição de sujeição indicada pelo termo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois ele entende, mas não responde”. A expressão final pode indicar tanto a ausência de resposta verbal quanto a falta de uma reação correspondente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְבָרִים
  choice: apenas com palavras
  rationale: 'O ב instrumental indica o meio da correção. “Apenas” explicita de modo natural o contraste implícito: palavras, por si sós, não produzem a correção esperada.'
- source_word: יִוָּסֶר
  choice: não se corrige
  rationale: O nifal de יסר tem sentido passivo de ser corrigido ou disciplinado. A construção pronominal é idiomática em português e evita especificar uma punição física.
- source_word: עָבֶד
  choice: escravo
  rationale: O termo designa alguém em condição de servidão e pode ser traduzido como “servo” ou “escravo” conforme o contexto. “Escravo” preserva aqui a condição de sujeição e a dinâmica de autoridade pressuposta pelo provérbio.
- source_word: כִּי יָבִין
  choice: pois, embora entenda
  rationale: כִּי introduz a explicação, enquanto a relação entre entender e não responder tem força concessiva. Esta formulação reproduz ambas as relações em português natural.
- source_word: וְאֵין מַעֲנֶה
  choice: não há resposta
  rationale: A formulação impessoal acompanha de perto a construção nominal hebraica e mantém em aberto se falta uma resposta verbal ou uma reação obediente.
