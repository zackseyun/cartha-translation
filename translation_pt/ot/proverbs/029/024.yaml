  text: חוֹלֵ֣ק עִם גַּ֭נָּב שׂוֹנֵ֣א נַפְשׁ֑/וֹ אָלָ֥ה יִ֝שְׁמַ֗ע וְ/לֹ֣א יַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/024.yaml
  text: Whoever shares with a thief hates his own life[b][a]; he hears a curse and does not disclose it.
translation:
  language: pt
  text: Quem se associa a um ladrão odeia a própria vida; ouve uma maldição[a], mas não revela o que sabe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouve uma fórmula de juramento” ou “ouve uma adjuração”. O termo hebraico pode designar uma maldição ou um juramento que invoca uma maldição, provavelmente em uma situação jurídica na qual quem conhecia os fatos tinha o dever de falar.
    reason: lexical_alternative
  - marker: b
    text: Isto é, quem se torna cúmplice de um ladrão prejudica a si mesmo ao não revelar o que sabe.
    reason: cultural_note
lexical_decisions:
- source_word: חוֹלֵק עִם גַּנָּב
  choice: se associa a um ladrão
  rationale: O particípio חוֹלֵק indica compartilhar ou participar com alguém; neste contexto, expressa cumplicidade ou parceria com um ladrão, sem limitar o sentido à divisão dos bens roubados.
- source_word: שׂוֹנֵא נַפְשׁוֹ
  choice: odeia a própria vida
  rationale: נֶפֶשׁ pode significar vida, pessoa ou o próprio eu. Aqui descreve uma conduta autodestrutiva; “a própria vida” preserva a imagem hebraica e evita uma leitura dualista de “alma”.
- source_word: אָלָה
  choice: imprecação
  rationale: O termo designa uma maldição ou fórmula de juramento que invoca uma maldição, provavelmente uma convocação formal para que quem soubesse dos fatos se manifestasse. “Imprecação” preserva melhor essa força do que o termo genérico “juramento”.
- source_word: יִשְׁמַע
  choice: ouve
  rationale: O verbo significa literalmente “ouvir”. A tradução mantém a formulação simples do hebraico, deixando a provável situação jurídica para a nota.
- source_word: וְלֹא יַגִּיד
  choice: mas não revela o que sabe
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. A explicitação “o que sabe” torna natural em português o objeto implícito e comunica a omissão da informação sem restringi-la tecnicamente a um depoimento judicial.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Se associa” expressa cumplicidade sem recorrer ao coloquial “entra no esquema”; “imprecação” conserva a ambiguidade jurídico-religiosa do hebraico, esclarecida em nota. Os marcadores foram colocados junto às expressões que explicam.
