  text: A fool lets out all his spirit[a], but a wise man holds it back.
translation:
  language: pt
  text: O insensato dá vazão a todo o seu espírito[a], mas o sábio o retém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O insensato dá vazão a todo o seu temperamento, mas o sábio o acalma e o mantém contido.” A palavra hebraica traduzida por “espírito” também pode indicar o temperamento ou os impulsos interiores. A expressão final é difícil e pode sugerir tanto acalmar como conter ou manter em reserva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רוּחוֹ
  choice: todo o seu espírito
  rationale: Preserva a abrangência de כָּל e a imagem ampla de רוּחַ, que aqui pode envolver disposição interior, impulso emocional ou temperamento, sem reduzi-la apenas à ira.
- source_word: יוֹצִיא
  choice: dá vazão
  rationale: Expressa naturalmente em português o sentido causativo de fazer sair aquilo que está dentro, adequado ao contexto de falta de domínio próprio.
- source_word: כְסִיל
  choice: o insensato
  rationale: Equivalente corrente e digno para o tipo moral e prático da literatura sapiencial, sem sugerir mera limitação intelectual.
- source_word: חָכָם
  choice: o sábio
  rationale: Mantém a forma masculina singular genérica do provérbio e o contraste direto com o insensato.
- source_word: בְּאָחוֹר יְשַׁבְּחֶנָּה
  choice: o acalma e o mantém sob controle
  rationale: Representa conjuntamente a possível nuance de aquietar em יְשַׁבְּחֶנָּה e a ideia de reter ou manter atrás em בְּאָחוֹר. A formulação evita escolher exclusivamente entre acalmar e conter.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A tradução conserva a imagem hebraica de “espírito” no texto principal e registra em nota a ambiguidade entre temperamento, aquietamento e contenção.
