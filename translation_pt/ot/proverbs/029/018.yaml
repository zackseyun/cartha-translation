id: PRO.29.18
reference: Proverbs 29:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/אֵ֣ין חָ֭זוֹן יִפָּ֣רַֽע עָ֑ם וְ/שֹׁמֵ֖ר תּוֹרָ֣ה אַשְׁרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/018.yaml
  text: Where there is no vision[a], a people cast off restraint[d][c][b]; but the one who keeps the law—happy is he.
translation:
  language: pt
  text: Onde não há visão[a], o povo fica sem freios[b]; mas aquele que guarda a lei[c] é feliz[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “revelação” ou “visão profética”. O termo hebraico se refere à revelação divina, não apenas a planos ou ambições humanas.
    reason: lexical_alternative
  - marker: b
    text: Ou “fica desenfreado” ou “corre solto”.
    reason: lexical_alternative
  - marker: c
    text: Ou “instrução”.
    reason: lexical_alternative
  - marker: d
    text: Ou “é bem-aventurado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Onde não há
  rationale: Expressa de modo natural a circunstância geral indicada por בְּ com אֵין, preservando a estrutura de condição e consequência do provérbio.
- source_word: חָזוֹן
  choice: visão
  rationale: Preserva o termo tradicional e o sentido de visão reveladora ou profética; a nota impede que seja entendido apenas como planejamento ou ambição humana.
- source_word: יִפָּרַע
  choice: fica sem freios
  rationale: 'Comunica em português corrente a ideia do nifal de פרע: ficar desenfreado, solto ou sem contenção. Não adota a tradução tradicional ''perece'', que não corresponde ao sentido do verbo neste contexto.'
- source_word: עָם
  choice: o povo
  rationale: Mantém o valor coletivo singular do hebraico e soa natural em uma máxima geral em português.
- source_word: וְשֹׁמֵר
  choice: mas aquele que guarda
  rationale: O particípio descreve a pessoa caracterizada por observar continuamente; 'mas' explicita o contraste entre os dois membros do provérbio.
- source_word: תּוֹרָה
  choice: a lei
  rationale: Conserva o peso moral e pactual de תּוֹרָה, sem excluir o sentido mais amplo de instrução, registrado em nota.
- source_word: אַשְׁרֵהוּ
  choice: é feliz
  rationale: Reproduz a fórmula sapiencial de bem-aventurança em linguagem portuguesa natural, mantendo o referente singular por meio de 'aquele'.
theological_decisions:
- issue: Sentido de חָזוֹן como revelação divina
  choice: '''visão'' no sentido de revelação ou visão profética'
  alternative: '''visão'' como direção social, projeto estratégico ou ambição humana'
  rationale: No hebraico bíblico, חָזוֹן normalmente designa revelação recebida por profetas ou videntes. A tradução mantém a ambiguidade lexical legítima de 'visão', mas a nota esclarece seu horizonte revelador.
- issue: Valor de תּוֹרָה
  choice: lei
  alternative: instrução ou ensino
  rationale: Aqui תּוֹרָה pode designar instrução, mas também traz peso normativo. 'Lei' conserva esse aspecto, enquanto a nota registra a alternativa sem restringir indevidamente o termo.
- issue: Forma singular masculina de אַשְׁרֵהוּ
  choice: aquele que guarda... é feliz
  alternative: quem guarda... é feliz; felizes os que guardam
  rationale: A formulação preserva o singular masculino representativo do hebraico sem convertê-lo em plural.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão idiomática 'fica sem freios' torna inteligível a imagem social de descontrole sem acrescentar a ideia de perdição. A ordem dos membros e o contraste proverbial foram preservados.
