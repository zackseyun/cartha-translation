  text: יַסֵּ֣ר בִּ֭נְ/ךָ וִֽ/ינִיחֶ֑/ךָ וְ/יִתֵּ֖ן מַעֲדַנִּ֣ים לְ/נַפְשֶֽׁ/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/017.yaml
  text: Discipline your son[a], and he will give you rest[b]; he will give delights to your soul.
translation:
  language: pt
  text: Discipline seu filho, e ele lhe dará descanso; dará delícias à sua alma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «coisas agradáveis» ou «alegrias». O hebraico pode também empregar «alma» no sentido de «vida» ou «ser interior».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: Discipline
  rationale: O imperativo piel de יסר expressa correção ativa com finalidade formativa. “Discipline” é atual, claro e abrange tanto corrigir como educar.
- source_word: בִּנְךָ
  choice: seu filho
  rationale: O hebraico traz literalmente “seu filho”, no singular masculino; a tradução preserva essa especificidade.
- source_word: וִינִיחֶךָ
  choice: ele lhe dará descanso
  rationale: 'A forma hifil de נוח tem sentido causativo: o filho fará com que o pai ou responsável descanse ou fique tranquilo. A expressão também preserva o paralelismo com “dará” na oração seguinte.'
- source_word: וְיִתֵּן
  choice: dará
  rationale: נתן é o verbo comum “dar”. A escolha mantém a formulação direta e o paralelismo poético.
- source_word: מַעֲדַנִּים
  choice: prazer
  rationale: O plural hebraico pode denotar delícias, coisas agradáveis ou alegrias. No contexto, “prazer” comunica de modo natural a satisfação interior sem restringir o termo a iguarias.
- source_word: לְנַפְשֶׁךָ
  choice: à sua alma
  rationale: נפש pode indicar alma, vida ou o próprio ser. “À sua alma” preserva a imagem antropológica hebraica e a ideia de satisfação interior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva o paralelismo entre “lhe dará descanso” e “dará prazer”, bem como a referência específica a “seu filho” e a expressão hebraica “à sua alma”.
