  text: אֹ֤מֵ֨ר לְ/רָשָׁע֮ צַדִּ֪יק אָ֥תָּה יִקְּבֻ֥/הוּ עַמִּ֑ים יִזְעָמ֥וּ/הוּ לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/024.yaml
  text: Whoever says to the wicked[a], “You are righteous,” peoples will curse him; nations will denounce him.
translation:
  language: pt
  text: 'Quem diz ao perverso: “Você é justo”[a], os povos o amaldiçoarão, e as nações se indignarão contra ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você tem razão”; no contexto, também pode significar “Você é inocente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵר
  choice: Quem diz
  rationale: O particípio masculino singular tem sentido genérico e proverbial. “Quem diz” é natural em português e preserva o sujeito indefinido.
- source_word: לְרָשָׁע
  choice: ao perverso
  rationale: רָשָׁע designa aqui uma pessoa moralmente perversa. “Ao perverso” mantém a categoria ética genérica e o contraste com צַדִּיק.
- source_word: צַדִּיק
  choice: justo
  rationale: Em Provérbios, צַדִּיק costuma indicar retidão moral, embora neste contexto também possa ter nuance judicial. “Justo” preserva a formulação breve e a tensão entre as duas possibilidades.
- source_word: אָתָּה
  choice: Você é
  rationale: O pronome hebraico é explícito. “Você é” o representa naturalmente no discurso direto, com ampla legibilidade brasileira.
- source_word: יִקְּבֻהוּ
  choice: será amaldiçoado
  rationale: נקב tem aqui o sentido de proferir maldição contra alguém. A construção passiva é idiomática em português e preserva a força imprecatória.
- source_word: עַמִּים
  choice: pelos povos
  rationale: “Povos” preserva o plural coletivo e mantém distinção lexical em relação a לְאֻמִּים, traduzido como “nações”.
- source_word: יִזְעָמֻהוּ
  choice: alvo da indignação
  rationale: O verbo expressa indignação intensa dirigida contra alguém. Esta formulação conserva o paralelismo sem repetir “amaldiçoar” nem restringir indevidamente o sentido a uma denúncia verbal pública.
- source_word: לְאֻמִּים
  choice: das nações
  rationale: “Nações” é equivalente natural do termo paralelo e preserva a distinção entre לְאֻמִּים e עַמִּים.
theological_decisions:
- issue: Sentido moral ou judicial de צַדִּיק
  choice: “Você é justo” no texto principal
  alternative: “Você está com a razão” ou “Você é inocente”
  rationale: O contraste proverbial favorece a dimensão moral, mas o contexto de decisões judiciais em Provérbios 24:23–25 permite uma nuance forense. A nota registra essa ambiguidade sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A segunda oração foi coordenada em forma singular (“será... e alvo...”) para deixar claro que ambos os verbos se referem à pessoa que declara justo o perverso. O marcador [a] aparece imediatamente após a expressão cuja alternativa esclarece.
