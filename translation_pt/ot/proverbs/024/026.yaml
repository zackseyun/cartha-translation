  text: שְׂפָתַ֥יִם יִשָּׁ֑ק מֵ֝שִׁ֗יב דְּבָרִ֥ים נְכֹחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/026.yaml
  text: He kisses the lips who gives upright words[a][b].
translation:
  language: pt
  text: Beija os lábios quem responde com palavras retas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma resposta honesta é como um beijo nos lábios.” O verbo hebraico está na voz ativa (“beija”), mas o provérbio pode funcionar de modo figurado, comparando uma resposta apropriada à proximidade ou à sinceridade de um beijo.'
    reason: alternative_reading
  - marker: b
    text: “Palavras retas” também pode ser traduzido por “palavras corretas”, “palavras francas” ou “palavras honestas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפָתַיִם
  choice: os lábios
  rationale: O dual hebraico designa concretamente os lábios. A imagem foi mantida, sem substituí-la por uma explicação abstrata.
- source_word: יִשָּׁק
  choice: beija
  rationale: O qal imperfeito de נשׁק é ativo e, no caráter geral do provérbio, é expresso naturalmente pelo presente gnômico em português.
- source_word: מֵשִׁיב
  choice: quem responde
  rationale: O particípio hifil de שוב, junto de דְּבָרִים, indica quem dá ou devolve uma resposta. “Quem responde” preserva esse sentido de modo direto e corrente.
- source_word: דְּבָרִים
  choice: palavras
  rationale: Mantém o plural explícito do hebraico, em vez de reduzi-lo ao singular “resposta”.
- source_word: נְכֹחִים
  choice: corretas
  rationale: O adjetivo pode indicar aquilo que é reto, certo, franco ou apropriado. “Corretas” é natural em português e conserva tanto a ideia de verdade quanto a de adequação, sem restringi-la apenas à sinceridade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. A ordem foi mantida próxima à ênfase poética hebraica, colocando primeiro a imagem do beijo. As notas preservam a possível leitura idiomática e a amplitude lexical de נְכֹחִים.
