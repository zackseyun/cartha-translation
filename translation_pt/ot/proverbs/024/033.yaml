  text: מְעַ֣ט שֵׁ֭נוֹת מְעַ֣ט תְּנוּמ֑וֹת מְעַ֓ט חִבֻּ֖ק יָדַ֣יִם לִ/שְׁכָּֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/033.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: pt
  text: Um pouco de sono, um pouco de cochilo, um pouco de cruzar os braços para se deitar[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para descansar”. O infinitivo hebraico indica, de modo mais geral, o ato de se deitar, podendo implicar descanso ou sono como resultado.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט
  choice: um pouco
  rationale: A repetição tríplice preserva o efeito retórico, o sentido gradual e o paralelismo do hebraico.
- source_word: שֵׁנוֹת
  choice: sono
  rationale: Embora a forma hebraica seja plural, “sono” é o equivalente coletivo natural em português e mantém a cadência proverbial.
- source_word: תְּנוּמוֹת
  choice: cochilo
  rationale: Mantém o paralelismo quase sinonímico com “sono”, usando uma palavra comum e distinta o bastante para reproduzir a variação poética.
- source_word: חִבֻּק יָדַיִם
  choice: cruzar os braços
  rationale: É uma expressão portuguesa natural para a postura de inatividade ou ociosidade evocada pela imagem hebraica de abraçar ou dobrar as mãos.
- source_word: לִשְׁכָּב
  choice: para se deitar
  rationale: Traduz diretamente o infinitivo hebraico sem restringir seu sentido a dormir; o contexto pode sugerir repouso ou sono como resultado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com repetição e ritmo preservados. “Cruzar os braços” comunica naturalmente a imagem de inatividade, enquanto “para se deitar” conserva a amplitude lexical do hebraico.
