  text: בְּ֭/חָכְמָה יִבָּ֣נֶה בָּ֑יִת וּ֝/בִ/תְבוּנָ֗ה יִתְכּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/003.yaml
  text: By wisdom a house is built[b][a], and by understanding it is established.
translation:
  language: pt
  text: Com sabedoria se constrói uma casa[a], e com entendimento ela se firma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma família”; “casa” pode indicar tanto uma moradia física quanto, por extensão, uma família ou unidade doméstica.
    reason: lexical_alternative
  - marker: b
    text: Ou “é estabelecida” ou “se torna segura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָה
  choice: Com sabedoria
  rationale: A preposição בְּ indica meio ou instrumento. “Com sabedoria” é natural em português e expressa que a sabedoria é o meio pelo qual a casa é construída.
- source_word: יִבָּנֶה
  choice: se constrói
  rationale: O nifal imperfeito de בנה tem aqui valor passivo e proverbial. O presente genérico comunica uma verdade geral; a construção com “se” é idiomática em português.
- source_word: בָּיִת
  choice: uma casa
  rationale: בַּיִת pode designar tanto uma construção física quanto, por extensão, uma família ou unidade doméstica. “Casa” mantém a imagem concreta e permite essa amplitude figurada.
- source_word: וּבִתְבוּנָה
  choice: e com entendimento
  rationale: תְּבוּנָה denota entendimento ou discernimento. “Entendimento” preserva o vocabulário sapiencial e forma um paralelo claro com “sabedoria”.
- source_word: יִתְכּוֹנָן
  choice: ela se firma
  rationale: A forma de כון comunica tornar-se estabelecida, firme ou segura. “Se firma” preserva o sentido resultativo e o paralelismo sem sugerir apenas fundação inicial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com presente proverbial. A repetição de “com” conserva o paralelismo hebraico, enquanto “se constrói” e “se firma” soam naturais para leitores brasileiros e permanecem amplamente compreensíveis no português internacional.
