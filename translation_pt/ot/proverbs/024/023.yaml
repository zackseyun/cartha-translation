  text: גַּם אֵ֥לֶּה לַֽ/חֲכָמִ֑ים הַֽכֵּר פָּנִ֖ים בְּ/מִשְׁפָּ֣ט בַּל טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/023.yaml
  text: 'These also are sayings of the wise: to show partiality in judgment is not good[a][b].'
translation:
  language: pt
  text: 'Também estas são palavras dos sábios:[a]


    Não é bom mostrar parcialidade num julgamento.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Também estas, para/aos sábios”. É provável que o sentido seja: “Também estas são palavras dos sábios”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “reconhecer rostos num julgamento”, expressão que significa favorecer alguém ou mostrar parcialidade.'
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Também estas
  rationale: Preserva o valor aditivo de גַּם e o demonstrativo אֵלֶּה, marcando a continuação com uma nova coleção de ditos.
- source_word: לַחֲכָמִים
  choice: são palavras dos sábios
  rationale: A expressão hebraica, literalmente «para/aos sábios», é elíptica e funciona provavelmente como título de uma seção. «Palavras dos sábios» explicita com naturalidade essa função sem ocultar a forma literal, registrada em nota.
- source_word: הַכֵּר פָּנִים
  choice: mostrar parcialidade
  rationale: Traduz o sentido do idiomatismo «reconhecer rostos», isto é, favorecer alguém com base em sua identidade ou posição.
- source_word: בְּמִשְׁפָּט
  choice: num julgamento
  rationale: Mantém o contexto forense de מִשְׁפָּט e soa natural em português, indicando o ato ou processo de julgar.
- source_word: בַּל טוֹב
  choice: Não é bom
  rationale: Reproduz a avaliação moral ampla do hebraico, suprindo a cópula exigida pelo português.
theological_decisions:
- issue: Força elíptica de לַחֲכָמִים como sobrescrito
  choice: «Também estas são palavras dos sábios»
  alternative: «Também estas são para os sábios» ou «Também estas pertencem aos sábios»
  rationale: O contexto indica o início de outra subseção sapiencial. A tradução escolhida comunica essa função provável, enquanto a nota preserva a ambiguidade gramatical do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A divisão em título e máxima reflete a função provável da primeira frase. «Parcialidade» conserva a precisão ética e jurídica do original.
