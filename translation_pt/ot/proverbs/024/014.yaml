  text: כֵּ֤ן דְּעֶ֥/ה חָכְמָ֗ה לְ/נַ֫פְשֶׁ֥/ךָ אִם מָ֭צָאתָ וְ/יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/014.yaml
  text: 'Know that wisdom is thus for your soul: if you find it[a], then there is a future[b], and your hope will not be cut off.'
translation:
  language: pt
  text: 'Assim também, saiba que a sabedoria é boa para a sua vida[a]: se você a encontrar, haverá um futuro[b], e a sua esperança não será cortada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “para a sua alma”; נֶפֶשׁ também pode significar “você mesmo” ou “vida”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “haverá um desfecho” ou “haverá um fim”. O hebraico אַחֲרִית pode indicar o fim posterior, o resultado ou a perspectiva futura de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: assim
  rationale: 'Retoma por analogia a comparação com o mel no versículo anterior: assim como o mel é bom, assim também é a sabedoria.'
- source_word: דְּעֶה
  choice: Saiba
  rationale: Traduz diretamente o imperativo singular de ידע e soa natural no português moderno.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente corrente e preserva o termo temático central de Provérbios.
- source_word: לְנַפְשֶׁךָ
  choice: para a sua alma
  rationale: Mantém a imagem hebraica e o sentido de benefício pessoal e vital, sem reduzir נֶפֶשׁ simplesmente a um pronome reflexivo.
- source_word: אִם מָצָאתָ
  choice: se você a encontrar
  rationale: Preserva a condição introduzida por אִם; o pronome retoma naturalmente 'sabedoria'.
- source_word: וְיֵשׁ אַחֲרִית
  choice: haverá um futuro
  rationale: No contexto sapiencial, אַחֲרִית aponta para o desfecho ou perspectiva futura da pessoa; o futuro verbal em português expressa naturalmente a consequência da condição.
- source_word: וְתִקְוָתְךָ
  choice: e a sua esperança
  rationale: '''Esperança'' é o equivalente corrente de תִּקְוָה e forma um paralelo natural com a perspectiva futura.'
- source_word: לֹא תִכָּרֵת
  choice: não será cortada
  rationale: Preserva a metáfora do nifal de כרת e sua força, embora a expressão seja menos comum em português do que 'não será frustrada'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil como em outros contextos lusófonos. A forma de tratamento 'você' torna explícito o destinatário singular sem recorrer a formas arcaicas; a metáfora final foi mantida para conservar a força do hebraico.
