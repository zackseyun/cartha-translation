  text: וְ/לַ/מּוֹכִיחִ֥ים יִנְעָ֑ם וַֽ֝/עֲלֵי/הֶ֗ם תָּב֥וֹא בִרְכַּת טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/025.yaml
  text: But for those who rebuke[a], it will be pleasant[b], and a good blessing will come upon them.
translation:
  language: pt
  text: Mas os que repreendem[a] terão bom acolhimento[b], e sobre eles virá uma boa bênção[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que advertem” ou “os que corrigem”. O particípio hebraico se refere a pessoas que dão a repreensão ou correção necessária.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa uma expressão impessoal de agrado ou favor. Também pode ser entendido como “haverá agrado para eles” ou “tudo lhes irá bem”.
    reason: ambiguity
  - marker: c
    text: Literalmente, “uma bênção de bem”, isto é, uma bênção benéfica ou favorável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַמּוֹכִיחִים
  choice: Mas os que repreendem
  rationale: O particípio de יכח designa os que advertem, censuram ou corrigem quando necessário. “Repreendem” é conciso e adequado ao contexto moral e judicial; a conjunção foi traduzida como “Mas” por marcar contraste com o versículo anterior.
- source_word: יִנְעָם
  choice: terão satisfação
  rationale: O verbo נעם expressa agrado, prazer ou satisfação. Esta formulação natural em português conserva a ideia de uma experiência favorável sem definir além do hebraico em que consiste esse agrado.
- source_word: וַעֲלֵיהֶם תָּבוֹא
  choice: e sobre eles virá
  rationale: Mantém de modo natural a imagem hebraica de uma bênção que vem sobre seus destinatários.
- source_word: בִרְכַּת טוֹב
  choice: uma boa bênção
  rationale: O construto significa literalmente “bênção de bem”. “Uma boa bênção” preserva a concisão e comunica uma bênção benéfica ou favorável sem especificar quais bens ela inclui.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “terão satisfação” torna natural a expressão impessoal hebraica, enquanto a nota preserva sua forma e amplitude sem determinar indevidamente o resultado prometido.
