  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/006.yaml
  text: For by wise guidance you will wage war[b][a], and victory is in an abundance of counselors.
translation:
  language: pt
  text: Pois, com orientação sábia[a], você travará a sua guerra, e a vitória[b] vem com muitos conselheiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com estratégia” ou “com conselho sábio”. O termo hebraico se refere à orientação habilidosa ou ao planejamento estratégico.
    reason: lexical_alternative
  - marker: b
    text: Ou “livramento”. Neste contexto de guerra, o termo hebraico aponta mais especificamente para “vitória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a advertência anterior e mantém de modo natural a ligação argumentativa do provérbio.
- source_word: בְתַחְבֻּלוֹת
  choice: com orientação sábia
  rationale: O termo evoca direção habilidosa, planejamento e estratégia; esta formulação preserva o valor instrumental da preposição e evita restringir o sentido apenas a táticas militares.
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  choice: você fará a guerra
  rationale: A expressão hebraica significa travar ou conduzir guerra. 'Fará a guerra' é idiomático em português e o pronome explicita o sujeito singular; não se verte לְךָ por um possessivo potencialmente excessivo.
- source_word: וּתְשׁוּעָה
  choice: e a vitória
  rationale: Embora o substantivo também possa significar livramento ou salvação, o contexto militar favorece o resultado vitorioso da batalha.
- source_word: בְּרֹב
  choice: está na abundância de
  rationale: Preserva a imagem de grande número e apresenta a multiplicidade de conselheiros como esfera ou meio em que se encontra a vitória.
- source_word: יוֹעֵץ
  choice: conselheiros
  rationale: Apesar da forma morfologicamente singular, a construção com רֹב tem sentido coletivo e pede o plural natural em português.
theological_decisions:
- issue: Amplitude semântica de תְּשׁוּעָה
  choice: vitória no texto, com alternativa em nota
  alternative: livramento
  rationale: O cenário bélico torna 'vitória' contextualmente mais específico, mas a nota conserva a amplitude do termo hebraico sem impor um sentido teológico de salvação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação mantém o paralelismo proverbial e evita vocabulário militar excessivamente técnico.
