  text: For their disaster will rise suddenly[b][a], and who knows the ruin of them both?
translation:
  language: pt
  text: Pois a calamidade deles surgirá de repente,[a] e quem conhece a ruína de ambos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o desastre deles se levantará de repente”.'
    reason: lexical_alternative
  - marker: b
    text: “Ambos” provavelmente se refere ao SENHOR e ao rei, mencionados no versículo anterior. A expressão hebraica é concisa e pode ser entendida como a ruína causada por ambos, como a ruína que lhes pertence ou os atinge, ou com outros referentes implícitos no contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a exortação do versículo anterior e mantém o vínculo causal com naturalidade em português.
- source_word: פִתְאֹם
  choice: de repente
  rationale: Expressa a irrupção súbita e inesperada da calamidade em linguagem corrente e enfática.
- source_word: יָקוּם
  choice: surgirá
  rationale: Preserva a imagem de algo que se levanta ou irrompe, sem produzir uma formulação artificial em português.
- source_word: אֵידָם
  choice: a calamidade deles
  rationale: אֵיד indica calamidade ou desastre, e o sufixo de terceira pessoa masculina plural é mantido sem explicitar excessivamente seu referente.
- source_word: וּפִיד
  choice: e ... que ruína
  rationale: פִיד designa ruína ou destruição. “Ruína” conserva o peso do termo e evita repetir “calamidade” no paralelismo.
- source_word: שְׁנֵיהֶם
  choice: de ambos
  rationale: Mantém a referência aos dois sem nomeá-los no texto principal; no contexto, provavelmente são o SENHOR e o rei mencionados no versículo anterior.
- source_word: מִי יוֹדֵעַ
  choice: quem sabe
  rationale: Reproduz de forma concisa a pergunta retórica que ressalta a incapacidade humana de prever a extensão da ruína.
theological_decisions:
- issue: Referente e função de שְׁנֵיהֶם (“ambos”)
  choice: A formulação “que ruína virá de ambos” entende provavelmente “ambos” como o SENHOR e o rei, fontes da ruína que sobrevém aos rebeldes.
  alternative: A expressão pode ser entendida como a ruína que atinge os dois, ou seus referentes podem ser identificados de outra maneira a partir do contexto.
  rationale: O versículo anterior menciona explicitamente o SENHOR e o rei. A leitura de origem ou procedência explica bem a advertência, mas a nota registra a concisão e a ambiguidade reais do hebraico, sem transformar a interpretação contextual em certeza absoluta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém a conexão argumentativa; “surgirá de repente” soa natural sem perder a imagem hebraica; a nota preserva a ambiguidade interpretativa de “ambos”.
