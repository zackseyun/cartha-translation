  text: גֶּֽבֶר חָכָ֥ם בַּ/ע֑וֹז וְ/אִֽישׁ דַּ֝֗עַת מְאַמֶּץ כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/005.yaml
  text: A wise man is strong[b][a], and a man of knowledge strengthens his might.
translation:
  language: pt
  text: O homem sábio é forte[a], e o homem de conhecimento aumenta a força[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O homem sábio tem força»; também é possível entender: «Um homem forte e sábio». A construção hebraica é compacta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «fortalece o poder».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: homem
  rationale: Preserva a forma masculina singular e o estilo representativo do provérbio; a ideia de força é expressa no restante da primeira oração.
- source_word: חָכָם
  choice: sábio
  rationale: Em Provérbios, designa normalmente a sabedoria em sentido moral e prático.
- source_word: בַּעֹז
  choice: é forte
  rationale: A construção compacta com ב pode ter valor predicativo, traduzido naturalmente em português como «é forte», embora outras análises sejam possíveis.
- source_word: אִישׁ
  choice: homem
  rationale: Reproduz a forma masculina proverbial do hebraico sem introduzir uma generalização ausente do texto.
- source_word: דַּעַת
  choice: conhecimento
  rationale: É a correspondência mais direta para o termo no contexto da literatura sapiencial.
- source_word: מְאַמֶּץ
  choice: aumenta
  rationale: O particípio de אמץ pode indicar tornar forte ou intensificar; «aumenta» forma uma expressão natural com «força» e preserva uma alternativa lexical genuína.
- source_word: כֹּחַ
  choice: a força
  rationale: Traduz diretamente a capacidade ou vigor mencionados, sem acrescentar um pronome possessivo que não está expresso no hebraico.
