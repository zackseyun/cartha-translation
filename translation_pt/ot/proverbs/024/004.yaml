  text: and by knowledge rooms are filled with all precious and pleasant wealth[a][b][c].
translation:
  language: pt
  text: e pelo conhecimento os cômodos se enchem de toda espécie de riqueza preciosa e agradável[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aposentos”, em vez de “cômodos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “se encherão”; o imperfeito hebraico pode ser entendido como futuro, embora aqui o provérbio seja traduzido como uma verdade geral no presente.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “toda riqueza, preciosa e agradável”; “toda espécie de riqueza” torna a expressão mais natural em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַעַת
  choice: e pelo conhecimento
  rationale: Representa a conjunção e o valor instrumental da preposição; “conhecimento” é natural no paralelismo sapiencial.
- source_word: חֲדָרִים
  choice: os cômodos
  rationale: Designa os compartimentos internos de uma casa. “Cômodos” é corrente e amplamente compreensível; “aposentos” permanece como alternativa mais literária.
- source_word: יִמָּלְאוּ
  choice: se enchem
  rationale: O nifal imperfeito é vertido como presente geral, adequado ao caráter proverbial, sem excluir a leitura futura indicada em nota.
- source_word: כָּל הוֹן
  choice: toda riqueza
  rationale: Mantém de modo direto a construção hebraica com כָּל e o substantivo coletivo הוֹן, evitando acrescentar “tipo de” ao texto principal.
- source_word: יָקָר
  choice: preciosa
  rationale: Expressa valor e preciosidade, concordando naturalmente com “riqueza”.
- source_word: וְנָעִים
  choice: e agradável
  rationale: Preserva a ideia de algo desejável e prazeroso sem intensificá-la indevidamente.
