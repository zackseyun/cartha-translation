id: PRO.24.20
reference: Proverbs 24:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י לֹֽא תִהְיֶ֣ה אַחֲרִ֣ית לָ/רָ֑ע נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/020.yaml
  text: For there will be no future for the evil[b][a]; the lamp of the wicked will be put out.
translation:
  language: pt
  text: Pois o mau não terá futuro[a]; a lâmpada dos perversos se apagará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fim” ou “desfecho”. O termo hebraico pode indicar o fim de alguém, seu desfecho ou sua perspectiva futura.
    reason: lexical_alternative
  - marker: b
    text: A imagem da lâmpada que se apaga pode representar o fim da vida, da prosperidade ou de uma condição duradoura.
    reason: metaphor_clarification
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e preserva com naturalidade a força causal do hebraico.
- source_word: לֹא תִהְיֶה
  choice: não terá
  rationale: Com אַחֲרִית, esta formulação é idiomática em português e mantém o sentido futuro negativo da construção existencial.
- source_word: אַחֲרִית
  choice: futuro
  rationale: No contexto sapiencial, indica a perspectiva futura ou o desfecho de alguém; “futuro” comunica bem a ausência de uma perspectiva duradoura sem restringir o termo à posteridade.
- source_word: לָרָע
  choice: o mau
  rationale: Representa o adjetivo substantivado masculino singular com artigo, referindo-se a uma pessoa má, sem acrescentar “homem” nem sugerir um referente teológico específico.
- source_word: נֵר
  choice: lâmpada
  rationale: Preserva a imagem concreta hebraica associada à vida, prosperidade ou continuidade.
- source_word: רְשָׁעִים
  choice: dos perversos
  rationale: Mantém o substantivo adjetival plural e distingue este grupo plural do singular “o mau” no primeiro segmento.
- source_word: יִדְעָךְ
  choice: se apagará
  rationale: É a expressão portuguesa natural para uma lâmpada que deixa de arder e preserva a forma intransitiva do verbo hebraico.
theological_decisions:
- issue: Alternância entre o singular רָע e o plural רְשָׁעִים
  choice: Preservar a alternância com “o mau” e “os perversos”.
  alternative: Uniformizar ambos como “os perversos”.
  rationale: A mudança de número pertence à textura do texto hebraico; mantê-la evita harmonização desnecessária e não identifica “o mau” com Satanás.
- issue: Amplitude semântica de אַחֲרִית
  choice: Traduzir por “futuro”.
  alternative: “fim”, “desfecho” ou “posteridade”.
  rationale: “Futuro” expressa a ausência de perspectiva ou continuidade duradoura e se ajusta ao paralelismo da lâmpada apagada, sem limitar o sentido a descendentes.
- issue: Imagem da lâmpada apagada
  choice: 'Conservar literalmente a metáfora: “a lâmpada dos perversos se apagará”.'
  alternative: Explicitar como perda da vida, prosperidade ou posição duradoura.
  rationale: O hebraico deixa aberta a extensão exata da imagem; a tradução não deve resolver essa tensão interpretativa no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “O mau” mantém a referência pessoal singular sem acrescentar “homem”; “se apagará” é mais natural para a lâmpada e mais próximo da forma verbal hebraica do que uma construção passiva.
