  text: For their heart meditates on destruction[b][a], and their lips speak trouble.
translation:
  language: pt
  text: Pois o coração deles medita na violência[a], e seus lábios falam maldade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruição” ou “devastação”.
