lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da proibição do versículo anterior e preserva de modo natural a força explicativa.
- source_word: שֹׁד
  choice: violência
  rationale: O substantivo pode indicar violência, devastação ou ruína. Neste contexto, “violência” expressa de modo conciso o caráter destrutivo daquilo que os maus contemplam.
- source_word: יֶהְגֶּה
  choice: medita na
  rationale: Com “coração” como sujeito, o verbo descreve reflexão interior e persistente. “Medita” preserva essa imagem sem explicitar demais a ideia contextual de planejar.
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém a imagem hebraica do coração como centro do pensamento e da vontade, bem como o singular coletivo do texto-fonte.
- source_word: וְעָמָל
  choice: maldade
  rationale: Neste paralelismo, עָמָל aponta para dano, mal ou ação nociva, não simplesmente trabalho ou sofrimento. “Maldade” comunica com clareza o teor prejudicial da fala.
- source_word: שִׂפְתֵיהֶם
  choice: seus lábios
  rationale: Preserva a imagem poética e o contraste entre a reflexão interior do coração e sua expressão exterior.
- source_word: תְּדַבֵּרְנָה
  choice: falam
  rationale: O presente exprime naturalmente o sentido habitual e proverbial do imperfeito hebraico.
