  text: יְרָֽא אֶת יְהוָ֣ה בְּנִ֣/י וָ/מֶ֑לֶךְ עִם שׁ֝וֹנִ֗ים אַל תִּתְעָרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
translation:
  language: pt
  text: Tema a Yahweh, meu filho, e ao rei; não se associe com os que são dados a mudanças[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido contextual: “não se misture com rebeldes”. O hebraico diz literalmente “os que mudam” e provavelmente se refere a pessoas propensas à agitação, à subversão ou à deslealdade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרָא
  choice: Tema
  rationale: O imperativo de ירא, na literatura de sabedoria, expressa temor reverente que se manifesta em lealdade e obediência. “Tema” preserva essa amplitude melhor que o mais brando “reverencie”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּנִי
  choice: meu filho
  rationale: Mantém o masculino singular e a fórmula paterna característica de Provérbios.
- source_word: וָמֶלֶךְ
  choice: e ao rei
  rationale: O substantivo singular funciona como segundo objeto do mesmo imperativo. A contração “ao” é exigida pela regência natural de “temer” nesta construção coordenada em português.
- source_word: עִם ... אַל תִּתְעָרָב
  choice: não se associe com
  rationale: O hitpael de ערב com עִם indica misturar-se ou envolver-se com determinado grupo. “Não se associe com” comunica isso de modo natural e atual.
- source_word: שׁוֹנִים
  choice: os que são inclinados a mudanças
  rationale: O particípio está ligado à ideia de mudar e pode descrever pessoas propensas a mudanças, agitação ou deslealdade. A formulação conserva a ideia lexical sem identificar categoricamente essas pessoas como rebeldes.
theological_decisions:
- issue: Relação entre temer Yahweh e temer o rei
  choice: Manter Yahweh e o rei como objetos do mesmo imperativo, sem afirmar que ambos possuem igual autoridade.
  alternative: 'Diferenciar os verbos, por exemplo: “Tema a Yahweh e honre o rei”.'
  rationale: A sintaxe hebraica rege os dois objetos com יְרָא. Preservar essa construção mantém a tensão do texto e permite que o contexto distinga a autoridade divina da autoridade real, sem introduzir uma explicação doutrinária no versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “São inclinados a mudanças” é deliberadamente um pouco mais formal para preservar a ambiguidade do hebraico; a nota apresenta a leitura contextual mais forte, “rebeldes”.
