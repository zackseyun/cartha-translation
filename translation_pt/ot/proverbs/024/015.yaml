  text: אַל תֶּאֱרֹ֣ב רָ֭שָׁע לִ/נְוֵ֣ה צַדִּ֑יק אַֽל תְּשַׁדֵּ֥ד רִבְצ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/015.yaml
  text: Do not lie in wait[a], O wicked man, against the dwelling of the righteous[b]; do not devastate his resting place.
translation:
  language: pt
  text: Não fique à espreita[a], ó perverso, junto à morada do justo; não devaste o seu lugar de repouso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não arme emboscada contra a casa do justo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o lugar onde ele se deita” ou “o seu lugar de descanso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: não
  rationale: A partícula proibitiva introduz duas ordens negativas diretas; “não” expressa com clareza essa força em português.
- source_word: תֶּאֱרֹב
  choice: fique à espreita
  rationale: O verbo ארב descreve ficar escondido à espera de uma vítima ou oportunidade de ataque. “Ficar à espreita” preserva a imagem predatória sem restringi-la a uma emboscada militar.
- source_word: רָשָׁע
  choice: ó perverso
  rationale: O singular masculino funciona como vocativo. “Perverso” mantém a caracterização moral e “ó” deixa explícito o chamado direto, em registro digno.
- source_word: לִנְוֵה
  choice: contra a morada
  rationale: נָוֶה designa morada ou habitação; neste contexto, a preposição ל indica direção hostil. “Contra a morada” conserva ambos os elementos.
- source_word: צַדִּיק
  choice: do justo
  rationale: O substantivo singular caracteriza a pessoa pela retidão. “O justo” é uma formulação natural e tradicional em português, sem transformar o termo numa referência coletiva.
- source_word: תְּשַׁדֵּד
  choice: devaste
  rationale: O verbo שדד pode envolver pilhagem, violência e ruína. “Devastar” comunica a destruição violenta sem limitar o sentido ao roubo.
- source_word: רִבְצוֹ
  choice: o seu lugar de repouso
  rationale: Derivado de רבץ, o termo indica o lugar onde alguém se deita ou repousa. A expressão escolhida preserva a imagem de repouso protegido sem a conotação animal de “covil”.
theological_decisions: []
