  text: וָֽ/אֶחֱזֶ֣ה אָ֭נֹכִֽי אָשִׁ֣ית לִבִּ֑/י רָ֝אִ֗יתִי לָקַ֥חְתִּי מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/032.yaml
  text: Then I saw and took it to heart[b][a]; I looked and received instruction.
translation:
  language: pt
  text: Então observei e considerei atentamente; olhei e recebi instrução.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶחֱזֶה
  choice: Então observei
  rationale: O verbo חזה expressa ver ou contemplar. “Observei” comunica aqui um olhar atento e reflexivo, enquanto “então” representa naturalmente a progressão narrativa do waw prefixado.
- source_word: אָנֹכִי
  choice: eu (implícito na forma verbal)
  rationale: O pronome independente dá certa ênfase ao sujeito, mas em português sua expressão separada tornaria a frase mais pesada; a primeira pessoa verbal e a sequência pessoal preservam adequadamente o foco.
- source_word: אָשִׁית לִבִּי
  choice: levei aquilo a sério
  rationale: A expressão significa literalmente “pus meu coração”. No contexto, descreve reflexão atenta. “Levei aquilo a sério” é natural e preserva o envolvimento interior, sem sugerir desejo afetivo.
- source_word: רָאִיתִי
  choice: olhei
  rationale: O verbo ראה significa ver. “Olhei” mantém a progressão da observação à aprendizagem e evita repetir de modo mecânico a formulação da primeira oração.
- source_word: לָקַחְתִּי מוּסָר
  choice: recebi instrução
  rationale: מוּסָר pode designar instrução, correção ou disciplina na literatura sapiencial. “Recebi instrução” conserva o sentido pedagógico sem restringi-lo à punição.
