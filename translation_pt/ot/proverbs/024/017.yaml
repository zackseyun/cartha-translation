  yaml_path: translation/ot/proverbs/024/017.yaml
  text: Do not rejoice when your enemy falls[a], and do not let your heart exult when he stumbles,
translation:
  language: pt
  text: Não se alegre quando o seu inimigo cair[a], nem exulte o seu coração quando ele tropeçar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não fique contente quando o seu inimigo cair, nem se alegre o seu coração quando ele tropeçar.” O hebraico emprega dois termos relacionados, mas distintos, para a alegria: שמח (“alegrar-se, ficar contente”) e גיל (“exultar, jubilar”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְפֹל
  choice: quando ... cair
  rationale: A preposição ב com o infinitivo construto de נפל tem valor temporal neste contexto. “Quando ... cair” expressa naturalmente essa relação e preserva o sentido do acontecimento.
- source_word: אֹיְבֶיךָ
  choice: o seu inimigo
  rationale: Embora a forma consonantal possa parecer plural, o sufixo singular da oração paralela (“quando ele tropeçar”) favorece aqui o sentido singular, individual ou representativo.
- source_word: אַל
  choice: não
  rationale: אַל com a forma verbal seguinte expressa proibição. Em português, “não” com o presente do subjuntivo é a formulação natural.
- source_word: תִּשְׂמָח
  choice: se alegre
  rationale: שמח indica alegria ou contentamento. “Alegrar-se” é claro e corrente e mantém distinção em relação ao verbo mais intenso da segunda oração.
- source_word: וּבִכָּשְׁלוֹ
  choice: quando ele tropeçar
  rationale: A construção tem novamente valor temporal. “Tropeçar” preserva a distinção lexical entre כשל e נפל, traduzido como “cair” na primeira oração.
- source_word: יָגֵל
  choice: exulte
  rationale: גיל pode indicar alegria intensa ou jubilosa. “Exultar” conserva essa força e evita nivelá-lo com שמח.
- source_word: לִבֶּךָ
  choice: o seu coração
  rationale: לב designa a interioridade humana, abrangendo pensamentos e emoções. “Coração” preserva a imagem hebraica e é natural em português.
