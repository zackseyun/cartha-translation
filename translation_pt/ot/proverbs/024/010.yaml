base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/010.yaml
  text: If you falter in a day of distress[a], your strength is small.
translation:
  language: pt
  text: Se você fraqueja no dia da aflição[a], sua força é pequena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você se mostra fraco no dia da adversidade, sua força é limitada”.'
    reason: Alternativa lexical que explicita outros sentidos possíveis de הִתְרַפִּיתָ, צָרָה e צַר sem eliminar a formulação concisa do texto principal.
lexical_decisions:
- source_word: הִתְרַפִּיתָ
  choice: você vacila
  rationale: O hitpael perfeito de רפה pode expressar tornar-se frouxo ou fraco, perder o ânimo ou ceder. “Você vacila” é natural em português, conserva a concisão proverbial e abrange tanto a perda de firmeza quanto a insuficiência de resolução.
- source_word: בְּיוֹם
  choice: no dia da
  rationale: A preposição בְּ com יוֹם tem sentido temporal. “No dia da” mantém de perto a forma hebraica e soa natural no registro sapiencial.
- source_word: צָרָה
  choice: aflição
  rationale: צָרָה designa angústia, adversidade ou dificuldade opressiva. “Aflição” comunica a pressão da circunstância com linguagem clara e digna.
- source_word: צַר
  choice: é pequena
  rationale: O adjetivo significa literalmente “estreito” e, por extensão, limitado ou insuficiente. Referindo-se à força, “é pequena” reproduz de modo direto a avaliação metafórica do hebraico.
- source_word: כֹּחֶךָ
  choice: sua força
  rationale: כֹּחַ pode indicar força, poder ou capacidade. “Sua força” é a correspondência mais direta e idiomática neste contexto de resistência diante da aflição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com uso de “você” para ampla legibilidade brasileira. A estrutura condicional é explicitada por “Se”, como exige o sentido lógico do provérbio em português, embora o hebraico apresente a condição sem partícula equivalente expressa.
