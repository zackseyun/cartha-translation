  text: אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בָּ/רְשָׁעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/019.yaml
  text: Do not be agitated because of evildoers[a]; do not envy the wicked.
translation:
  language: pt
  text: Não se irrite por causa dos que praticam o mal; não tenha inveja dos perversos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְחַר
  choice: se irrite
  rationale: O hitpael de חרה descreve ficar acalorado ou emocionalmente alterado. Em português atual, “se irrite” expressa com naturalidade essa perturbação, sem recorrer ao menos usual “se afobe” ou ao sentido mais específico de “se enfureça”.
- source_word: בַּמְּרֵעִים
  choice: por causa dos que praticam o mal
  rationale: A preposição ב, com o verbo neste contexto, indica a causa ou o objeto da reação emocional. A forma participial מְרֵעִים designa pessoas que fazem o mal, daí a tradução verbal e clara.
- source_word: תְּקַנֵּא
  choice: tenha inveja
  rationale: Na literatura sapiencial, קנא seguido de ב frequentemente significa invejar alguém. “Tenha inveja” é a formulação idiomática mais clara em português.
- source_word: בָּרְשָׁעִים
  choice: os perversos
  rationale: רְשָׁעִים é uma categoria sapiencial para pessoas moralmente culpadas ou ímpias. “Os perversos” preserva a concisão proverbial e é amplamente compreensível.
- source_word: אַל
  choice: não
  rationale: אַל com a forma verbal seguinte expressa uma proibição direta; “não” reproduz naturalmente essa força nos dois membros do provérbio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e conciso, com paralelismo proverbial preservado. “Os que praticam o mal” torna explícito o valor participial do hebraico, enquanto “os perversos” mantém a categoria moral sintética do segundo membro.
