  source_fidelity: A tradução reproduz com fidelidade as duas proibições hebraicas. “Não se irrite” expressa adequadamente o hitpael de חרה, isto é, não se deixar emocionalmente inflamar/perturbar por causa dos malfeitores. “Por causa dos que praticam o mal” representa bem o uso contextual de ב־ com מְרֵעִים, e “não tenha inveja dos perversos” conserva o sentido de קנא ב־ e a categoria moral de רְשָׁעִים.
