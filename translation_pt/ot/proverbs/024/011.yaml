  text: הַ֭צֵּל לְקֻחִ֣ים לַ/מָּ֑וֶת וּ/מָטִ֥ים לַ֝/הֶ֗רֶג אִם תַּחְשֽׂוֹךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/011.yaml
  text: Rescue those being taken away to death[a], and those staggering to the slaughter, hold them back.
translation:
  language: pt
  text: Resgate os que estão sendo levados para a morte e contenha os que cambaleiam para a matança[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e os que cambaleiam para a matança, se você se abstiver” (ou “não se abstenha”). As palavras finais são sintaticamente difíceis e podem ser ligadas ao versículo seguinte; o texto principal apresenta o sentido mais provável no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצֵּל
  choice: Resgate
  rationale: O imperativo de נצל exige intervenção urgente. “Resgate” é natural, concreto e comunica tirar alguém de perigo imediato.
- source_word: לְקֻחִים
  choice: os que estão sendo levados
  rationale: O particípio passivo de לקח descreve pessoas tomadas e conduzidas; a forma progressiva preserva a ação em curso sem especificar indevidamente que sejam prisioneiros.
- source_word: לַמָּוֶת
  choice: para a morte
  rationale: A preposição ל marca destino ou resultado; “para a morte” expressa com naturalidade o destino fatal.
- source_word: וּמָטִים
  choice: os que cambaleiam
  rationale: O particípio retrata pessoas vacilantes, prestes a cair. “Cambaleiam” conserva a imagem vívida de instabilidade e perigo iminente.
- source_word: לַהֶרֶג
  choice: para a matança
  rationale: הרג aponta para morte violenta. “Matança” mantém a gravidade da imagem e o paralelismo com “morte”.
- source_word: אִם תַּחְשׂוֹךְ
  choice: detenha-os
  rationale: Embora a forma massorética seja literalmente difícil (“se você retiver/refrear”), o contexto favorece uma exortação paralela a “resgate”. “Detenha-os” comunica que se deve impedir que avancem para a matança, sem apagar a dificuldade textual, registrada em nota.
theological_decisions:
- issue: Força sintática de אִם תַּחְשׂוֹךְ no fim do versículo
  choice: 'Entendida no texto principal como continuação exortativa: “detenha-os”.'
  alternative: 'Traduzir literalmente “se você se abstiver” e ligar a expressão ao v. 12, ou entendê-la como proibição: “não se abstenha”.'
  rationale: A dificuldade é sintática, não doutrinária. Como versículo independente, a exortação coordenada comunica melhor a exigência moral do provérbio; a ambiguidade genuína do hebraico é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula mantém o paralelismo poético, e a retomada “quanto aos” permite conservar a ordem marcada da segunda oração.
