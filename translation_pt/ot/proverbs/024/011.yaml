review_pass:
  verdict: revise
  source_fidelity: A primeira oração traduz com precisão o imperativo הַצֵּל e os particípios passivos/ativos. A solução exortativa para a oração final obscura é defensável, desde que a nota mantenha explicitamente a leitura massorética e sua possível ligação com o versículo 12. “Detenha-os” pode sugerir prender ou interceptar as próprias pessoas e, com “quanto aos”, torna a relação sintática menos direta do que o paralelismo do hebraico.
  naturalness: “Quanto aos que cambaleiam..., detenha-os” é compreensível, mas é uma topicalização algo pesada e “deter” pode ter conotação policial em português moderno. Uma coordenação direta com “contenha” é mais fluente e reproduz melhor a progressão exortativa adotada no texto principal.
  terminology: “Resgate”, “estão sendo levados”, “morte”, “cambaleiam” e “matança” são escolhas adequadas, modernas e proporcionais à violência do texto. “Contenha” comunica melhor a ideia interpretativa de impedir/reter o avanço sem especificar detenção.
  issues:
