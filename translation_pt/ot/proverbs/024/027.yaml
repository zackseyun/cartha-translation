  text: הָ֘כֵ֤ן בַּ/ח֨וּץ מְלַאכְתֶּ֗/ךָ וְ/עַתְּדָ֣/הּ בַּ/שָּׂדֶ֣ה לָ֑/ךְ אַ֝חַ֗ר וּ/בָנִ֥יתָ בֵיתֶֽ/ךָ׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/027.yaml
  text: Prepare your work outside[a]; make it ready for yourself in the field; afterward[b], build your house.
translation:
  language: pt
  text: Prepare o seu trabalho lá fora[a] e deixe-o pronto para você no campo; depois, construa a sua casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Organize o seu trabalho lá fora e deixe-o pronto para você no campo; depois, construa a sua casa.”'
    reason: lexical_alternative
  - marker: b
    text: Na literatura de sabedoria, “casa” também pode ter o sentido mais amplo de lar ou família; porém, o contraste imediato com “lá fora” e “no campo” favorece aqui o sentido concreto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכֵן
  choice: Prepare
  rationale: O imperativo de כון pede que o trabalho seja preparado ou devidamente organizado; “prepare” é natural, digno e mantém a sequência de prioridades do provérbio.
- source_word: בַּחוּץ
  choice: lá fora
  rationale: Indica o espaço exterior, em contraste com a casa no fim do versículo. “Lá fora” expressa essa oposição espacial com naturalidade em português.
- source_word: מְלַאכְתֶּךָ
  choice: o seu trabalho
  rationale: מְלָאכָה tem sentido amplo de trabalho, labor ou tarefa; “o seu trabalho” preserva essa amplitude.
- source_word: וְעַתְּדָהּ
  choice: deixe-o pronto
  rationale: O piel de עתד significa tornar ou deixar pronto. O sufixo feminino retoma naturalmente מְלַאכְתֶּךָ; o pronome português “o” concorda com “trabalho”.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Mantém a referência concreta ao campo como lugar do trabalho produtivo ou agrícola.
- source_word: לָךְ
  choice: para você
  rationale: Explicita o dativo de interesse ou benefício sem forçar uma ênfase reflexiva excessiva.
- source_word: אַחַר
  choice: depois
  rationale: 'Marca claramente a ordem temporal: primeiro assegurar o trabalho exterior, depois construir a casa.'
- source_word: וּבָנִיתָ בֵיתֶךָ
  choice: construa a sua casa
  rationale: Preserva o sentido concreto de construir a casa, favorecido pelo contraste com “lá fora” e “no campo”, sem excluir possíveis aplicações mais amplas.
theological_decisions:
- issue: Possível sentido ampliado de בֵּית como lar ou família
  choice: casa no texto principal
  alternative: lar ou família
  rationale: O contraste espacial com o exterior e o campo favorece a construção concreta da casa. A nota conserva a amplitude possível na literatura de sabedoria sem impô-la ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo, a sequência prática do provérbio e o contraste espacial entre o trabalho exterior e a casa.
