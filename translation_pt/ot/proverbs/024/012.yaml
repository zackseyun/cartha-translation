  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי תֹאמַ֗ר הֵן֮ לֹא יָדַ֪עְנ֫וּ זֶ֥ה הֲֽ/לֹא תֹ֘כֵ֤ן לִבּ֨וֹת הֽוּא יָבִ֗ין וְ/נֹצֵ֣ר נַ֭פְשְׁ/ךָ ה֣וּא יֵדָ֑ע וְ/הֵשִׁ֖יב לְ/אָדָ֣ם כְּ/פָעֳלֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/012.yaml
  text: If you say[a], “Look, we did not know this,” does not he who weighs hearts understand, and he who keeps your soul know[e][d][c][b], and will he not repay a man according to his work?
translation:
  language: pt
  text: 'Se você disser: “Veja, nós não sabíamos disso”[a], acaso aquele que pesa os corações[b] não entenderá, e aquele que guarda a sua vida[c] não saberá, e não retribuirá a cada pessoa[d] conforme o que ela fez[e]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nada sabíamos sobre isso”.'
    reason: lexical_alternative
  - marker: b
    text: “Pesa os corações” é uma imagem de Deus avaliando as intenções e as motivações interiores.
    reason: cultural_note
  - marker: c
    text: 'Ou: “guarda a sua alma”. O termo hebraico também pode significar “vida”, “ser” ou a própria pessoa, conforme o contexto.'
    reason: lexical_alternative
  - marker: d
    text: 'Hebraico: “homem”; usado aqui em sentido genérico para uma pessoa ou ser humano.'
    reason: lexical_alternative
  - marker: e
    text: 'Ou: “segundo a sua obra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Se você disser
  rationale: כִּי introduz aqui uma situação condicional, e o imperfeito de segunda pessoa apresenta a alegação hipotética. A formulação é direta e natural em português.
- source_word: הֵן
  choice: Veja
  rationale: A interjeição chama atenção para a desculpa citada. “Veja” conserva essa força deíctica em linguagem atual, sem recorrer ao mais arcaico “eis”.
- source_word: לֹא יָדַעְנוּ זֶה
  choice: nós não sabíamos disso
  rationale: Mantém a primeira pessoa do plural e o referente expresso por זֶה, apresentando a alegação de ignorância sem explicá-la além do texto.
- source_word: הֲלֹא
  choice: acaso ... não ...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. Em português, “acaso ... não?” comunica essa expectativa com naturalidade.
- source_word: תֹכֵן לִבּוֹת
  choice: aquele que pesa os corações
  rationale: Preserva a imagem concreta de pesar ou avaliar e mantém “corações” como o centro hebraico da vontade, do pensamento e das motivações.
- source_word: יָבִין
  choice: perceberá
  rationale: O verbo expressa discernimento ou compreensão. “Perceberá” funciona naturalmente no contexto da tentativa humana de ocultar conhecimento ou motivos.
- source_word: וְנֹצֵר נַפְשְׁךָ
  choice: Aquele que guarda a sua vida
  rationale: נצר significa guardar ou proteger, e נֶפֶשׁ pode designar a vida ou a própria pessoa. “Vida” evita restringir o termo a uma parte imaterial do ser humano, mantendo em nota a alternativa tradicional “alma”.
- source_word: יֵדָע
  choice: não saberá?
  rationale: Mantém o sentido básico de ידע e, pela repetição da forma interrogativa negativa em português, deixa clara a continuação da pergunta retórica iniciada por הֲלֹא.
- source_word: וְהֵשִׁיב לְאָדָם כְּפָעֳלוֹ
  choice: E não retribuirá a cada pessoa conforme o que ela fez?
  rationale: O Hifil de שוב tem aqui sentido retributivo. אָדָם é genérico, e כְּפָעֳלוֹ indica correspondência entre a ação humana e a resposta recebida.
theological_decisions:
- issue: Amplitude antropológica de נֶפֶשׁ
  choice: a sua vida
  alternative: a sua alma
  rationale: Neste contexto, נֶפֶשׁ pode referir-se à vida ou à própria pessoa sob o cuidado de Deus. “Vida” é claro em português e evita impor ao termo uma dicotomia antropológica posterior; a alternativa formal é preservada em nota.
- issue: Alcance da pergunta retórica iniciada por הֲלֹא
  choice: As três afirmações sobre perceber, saber e retribuir são apresentadas como perguntas retóricas negativas.
  alternative: Encerrar a pergunta após “perceberá?” e apresentar as demais como afirmações positivas.
  rationale: Embora הֲלֹא apareça explicitamente apenas no início, a coordenação e o paralelismo permitem que sua força se estenda às orações seguintes. A repetição de “não” em português torna essa leitura transparente sem alterar a resposta afirmativa esperada.
- issue: Sentido genérico de אָדָם
  choice: cada pessoa
  alternative: um homem
  rationale: אָדָם designa aqui o ser humano de modo representativo, não especificamente um indivíduo masculino. “Cada pessoa” comunica o alcance universal da retribuição sem acrescentar distinção de gênero ausente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a imagem hebraica de pesar os corações, explicita em português a continuidade da pergunta retórica e evita tanto linguagem arcaica quanto terminologia antropológica excessivamente técnica.
