    rationale: O hebraico כֵּן introduz a ação equivalente dirigida ao ofensor. Em português, “fazer com alguém” pode ser elíptico ou significar fazer algo juntamente com a pessoa; “farei o mesmo com ele” comunica inequivocamente a simetria pretendida.
