  text: אַל תֹּאמַ֗ר כַּ/אֲשֶׁ֣ר עָֽשָׂה לִ֭/י כֵּ֤ן אֶֽעֱשֶׂה לּ֑/וֹ אָשִׁ֖יב לָ/אִ֣ישׁ כְּ/פָעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/029.yaml
  text: Do not say[a], “As he has done to me, so I will do to him; I will repay the man according to his deed.”
translation:
  language: pt
  text: 'Não diga[a]: “Assim como ele fez comigo, farei o mesmo com ele; retribuirei a esse homem conforme o que ele fez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lhe pagarei de volta conforme o que ele fez.”'
    reason: Alternativa lexical para o verbo hebraico אָשִׁיב, que pode significar “pagar de volta” ou “retribuir” neste contexto.
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: A partícula negativa אַל com o imperfeito expressa proibição; esta é a forma direta e natural em português.
- source_word: כַּאֲשֶׁר עָשָׂה לִי
  choice: Assim como ele fez comigo
  rationale: Preserva a comparação e a ação anterior sofrida pelo falante, em português corrente.
- source_word: כֵּן אֶעֱשֶׂה לּוֹ
  choice: farei com ele
  rationale: Mantém a correlação כַּאֲשֶׁר...כֵּן e a intenção de retaliar na mesma medida, sem explicitação indevida.
- source_word: אָשִׁיב
  choice: retribuirei
  rationale: O hifil de שׁוב tem aqui o sentido idiomático de dar de volta ou pagar na mesma moeda; “retribuirei” preserva o tom de represália.
- source_word: לָאִישׁ
  choice: a esse homem
  rationale: אִישׁ é masculino singular e retoma o indivíduo mencionado; o demonstrativo torna essa referência natural em português.
- source_word: כְּפָעֳלוֹ
  choice: conforme o que ele fez
  rationale: פֹּעַל designa ação ou feito. A formulação é natural e conserva o critério de retribuição baseado na conduta dele.
theological_decisions:
- issue: Força ética do provérbio quanto à retaliação pessoal
  choice: A fala proibida expressa a intenção pessoal de pagar na mesma moeda.
  alternative: Entender o versículo como proibição absoluta de toda justiça retributiva ou apenas como advertência pragmática contra palavras precipitadas.
  rationale: O texto condena diretamente a declaração de vingança pessoal e de retribuição segundo o ato do ofensor, mas não desenvolve uma doutrina abrangente sobre a justiça civil.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “ele” conserva a estrutura pessoal e retaliatória do hebraico.
