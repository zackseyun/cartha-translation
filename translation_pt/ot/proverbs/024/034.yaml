base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/034.yaml
  text: and your poverty will come like a prowler[a], and your need like an armed man.
translation:
  language: pt
  text: e a sua pobreza chegará rondando, e a sua necessidade, como um homem armado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como um homem com escudo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: e ... chegará
  rationale: O perfeito qal com a conjunção dá continuidade à consequência anunciada no versículo anterior. O futuro expressa naturalmente, em português, o resultado previsto pela advertência proverbial.
- source_word: מִתְהַלֵּךְ
  choice: rondando
  rationale: O particípio hitpael de הלך descreve movimento de um lado para outro. “Rondando” preserva a imagem de uma aproximação persistente e ameaçadora sem inserir no texto uma comparação que não está explicitamente marcada nesta forma do hebraico.
- source_word: רֵישֶׁךָ
  choice: a sua pobreza
  rationale: O substantivo רֵישׁ denota pobreza ou penúria. “Pobreza” é claro, corrente e adequado ao paralelismo.
- source_word: וּמַחְסֹרֶיךָ
  choice: e a sua necessidade
  rationale: מַחְסוֹר indica falta ou necessidade. Embora a forma massorética tenha terminação plural com sufixo, o emprego é coletivo, e o singular abstrato soa natural em português.
- source_word: כְּאִישׁ מָגֵן
  choice: como um homem armado
  rationale: A expressão é literalmente “como um homem de escudo/com escudo” e retrata alguém equipado para confronto. “Homem armado” comunica a força da imagem em português atual, enquanto a formulação literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram mantidos; “rondando” reproduz o movimento ameaçador do particípio sem transformar silenciosamente a expressão em uma comparação.
