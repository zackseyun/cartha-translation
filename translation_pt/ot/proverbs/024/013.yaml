base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/013.yaml
  text: Eat honey[a], my son, for it is good[b], and honey from the comb is sweet to your taste.
translation:
  language: pt
  text: Coma mel, meu filho, porque é bom, e o mel que escorre dos favos[a] é doce ao seu paladar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mel dos favos”. O termo hebraico pode designar o mel que goteja ou o mel retirado dos favos.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “sobre o seu palato”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱכָל
  choice: Coma
  rationale: Imperativo qal masculino singular de אכל; “Coma” mantém a exortação direta e soa natural em português atual.
- source_word: בְּנִי
  choice: meu filho
  rationale: Vocativo característico da literatura sapiencial, preservando tanto a forma masculina singular quanto o contexto de instrução.
- source_word: דְבַשׁ
  choice: mel
  rationale: Correspondência direta para o substantivo hebraico comum que designa mel.
- source_word: כִּי טוֹב
  choice: porque é bom
  rationale: כִּי introduz a razão da ordem, e טוֹב tem o sentido amplo de “bom”, que não deve ser reduzido apenas a “agradável”.
- source_word: וְנֹפֶת
  choice: e o mel que escorre dos favos
  rationale: נֹפֶת pode designar mel que goteja ou mel dos favos. A formulação mantém a imagem concreta e distingue essa expressão do termo geral דְבַשׁ, sem sugerir que se coma a estrutura de cera.
- source_word: מָתוֹק
  choice: é doce
  rationale: Tradução direta do adjetivo que descreve doçura ao paladar.
- source_word: עַל חִכֶּךָ
  choice: ao seu paladar
  rationale: חֵךְ designa literalmente o palato. “Ao seu paladar” conserva a imagem gustativa com expressão idiomática e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “seu” acompanha naturalmente o imperativo “Coma”; a ordem hebraica foi preservada tanto quanto permite a fluência em português.
