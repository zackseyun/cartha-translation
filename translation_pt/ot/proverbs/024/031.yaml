  yaml_path: translation/ot/proverbs/024/031.yaml
  text: and behold[a], it was all overgrown with thorns; nettles covered its surface[c][b], and its stone wall was broken down.
translation:
  language: pt
  text: e eis que tudo estava tomado de espinhos[a]; ervas daninhas[c] cobriam sua superfície[b], e o seu muro de pedras estava em ruínas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cardos”. A identificação exata da planta é incerta; o termo indica vegetação nociva, provavelmente espinhosa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sua face”, expressão que aqui significa a superfície do terreno.'
    reason: lexical_alternative
  - marker: c
    text: Ou “urtigas” ou “silvas”. O termo se refere a vegetação silvestre indesejada, mas a planta exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: e vi que
  rationale: Reproduz a força de descoberta e observação direta de הִנֵּה de modo natural no português atual, em continuidade com o observador do contexto.
- source_word: עָלָה כֻלּוֹ
  choice: tudo estava tomado
  rationale: Expressa o resultado do crescimento descontrolado por toda a propriedade sem reproduzir de forma rígida o sentido literal de 'subiu'.
- source_word: קִמְּשֹׂנִים
  choice: espinhos
  rationale: O termo designa vegetação nociva, provavelmente espinhosa, mas sua identificação botânica exata é incerta; 'espinhos' é claro e tradicional.
- source_word: כָּסּוּ
  choice: cobriam
  rationale: O imperfeito descritivo em português apresenta naturalmente o estado observado no terreno.
- source_word: פָנָיו
  choice: toda a sua superfície
  rationale: O hebraico diz literalmente 'sua face'; neste contexto, refere-se à extensão visível do terreno. 'Toda' explicita idiomaticamente a cobertura indicada pelo contexto.
- source_word: חֲרֻלִּים
  choice: ervas daninhas
  rationale: A espécie vegetal é incerta. A expressão comunica com clareza o crescimento silvestre indesejado e mantém distinção lexical em relação a קִמְּשֹׂנִים.
- source_word: וְגֶדֶר אֲבָנָיו
  choice: e o seu muro de pedras
  rationale: Designa o muro limítrofe feito de pedras; a formulação é natural e preserva o material explicitado no hebraico.
- source_word: נֶהֱרָסָה
  choice: estava em ruínas
  rationale: Comunica o estado resultante de desmoronamento ou demolição expresso pelo nifal, adequado ao cenário de abandono.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A abertura 'e vi que' evita o arcaísmo de 'e eis que' sem perder a vivacidade da observação. As notas preservam a incerteza botânica dos dois termos hebraicos.
