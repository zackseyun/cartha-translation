  text: אַל תְּ֭קַנֵּא בְּ/אַנְשֵׁ֣י רָעָ֑ה וְ/אַל תתאו לִ/הְי֥וֹת אִתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/001.yaml
  text: Do not envy evil men[b][a], and do not desire to be with them.
translation:
  language: pt
  text: Não tenha inveja de homens maus[a] e não deseje estar com eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “homens do mal”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estar na companhia deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Não tenha inveja
  rationale: A partícula negativa com a forma verbal expressa proibição; “não tenha inveja” transmite com naturalidade o sentido de קנא neste contexto.
- source_word: בְּאַנְשֵׁי רָעָה
  choice: de homens maus
  rationale: A construção masculina plural significa literalmente “homens de maldade”; “homens maus” preserva o referente masculino explícito e soa natural em português.
- source_word: וְאַל
  choice: e não
  rationale: Mantém a conjunção e o paralelismo entre as duas proibições.
- source_word: תתאו
  choice: deseje
  rationale: O verbo אוה indica desejo ou inclinação; “deseje” evita intensificar indevidamente a emoção.
- source_word: לִהְיוֹת אִתָּם
  choice: estar com eles
  rationale: Reproduz de modo direto o infinitivo de היה e a ideia de companhia ou associação expressa por אִתָּם.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com paralelismo preservado. A formulação mantém o masculino explícito do hebraico e deixa aberta a abrangência do desejo: tanto a companhia quanto a associação com o modo de vida desses homens.'
