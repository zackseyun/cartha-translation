  text: זִמַּ֣ת אִוֶּ֣לֶת חַטָּ֑את וְ/תוֹעֲבַ֖ת לְ/אָדָ֣ם לֵֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/009.yaml
  text: The scheme of folly is sin[b][a], and a scoffer is an abomination to mankind.
translation:
  language: pt
  text: O plano da insensatez é pecado, e o zombador é uma abominação para a humanidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִמַּת
  choice: plano
  rationale: O substantivo derivado de זמם indica algo concebido ou planejado. “Plano” preserva o caráter deliberado sem restringir o sentido a uma trama secreta.
- source_word: אִוֶּלֶת
  choice: insensatez
  rationale: O termo abstrato designa a falta moral e prática de sabedoria, não uma pessoa insensata. “Insensatez” é natural e digna no contexto sapiencial.
- source_word: חַטָּאת
  choice: pecado
  rationale: 'O substantivo funciona como predicativo: o plano da insensatez é pecado. A tradução direta mantém a formulação categórica do hebraico.'
- source_word: תוֹעֲבַת
  choice: detestável
  rationale: A construção nominal hebraica expressa forte repulsa. Em português, “é detestável” comunica naturalmente essa força, sem a possível rigidez de “é uma abominação” aplicada a uma pessoa.
- source_word: לְאָדָם
  choice: para as pessoas
  rationale: אָדָם tem aqui sentido genérico e coletivo, referente aos seres humanos. “Para as pessoas” torna explícita essa abrangência em português corrente.
- source_word: לֵץ
  choice: o zombador
  rationale: Em Provérbios, לֵץ descreve quem zomba com arrogância e rejeita a correção. “Zombador” preserva tanto a ação quanto a postura moral.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: para as pessoas
  alternative: para a humanidade
  rationale: O singular hebraico é genérico, não uma referência exclusiva ao sexo masculino. A formulação escolhida preserva o alcance humano geral e soa mais natural no português moderno.
translation_notes:
  register: Português moderno, claro e digno, com concisão proverbial. A ordem e o paralelismo das duas orações foram preservados; evitou-se linguagem denominacional ou explicativa.
