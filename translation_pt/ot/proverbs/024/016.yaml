source:
  edition: WLC
  text: כִּ֤י שֶׁ֨בַע יִפּ֣וֹל צַדִּ֣יק וָ/קָ֑ם וּ֝/רְשָׁעִ֗ים יִכָּשְׁל֥וּ בְ/רָעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/016.yaml
  text: For the righteous falls seven times and rises again[c][b][a], but the wicked stumble in calamity.
translation:
  language: pt
  text: Pois o justo cai sete vezes[a] e se levanta, mas os ímpios tropeçam na desgraça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Sete” provavelmente expressa repetição ou plenitude: o justo pode cair muitas vezes e, mesmo assim, voltar a se levantar.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “tropeçam na calamidade” ou “são derrubados pela desgraça”. Neste contexto, o termo hebraico pode indicar adversidade ou desastre, não necessariamente maldade moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a advertência anterior e preserva a ligação lógica com o contexto.
- source_word: שֶׁבַע
  choice: sete vezes
  rationale: Mantém a imagem numérica hebraica, provavelmente idiomática para recorrência ou plenitude.
- source_word: יִפּוֹל צַדִּיק וָקָם
  choice: ainda que o justo caia sete vezes, ele se levanta
  rationale: A formulação concessiva comunica naturalmente em português o contraste implícito entre quedas repetidas e recuperação, sem restringir a queda a pecado moral.
- source_word: צַדִּיק
  choice: o justo
  rationale: O masculino singular substantivado é representativo no provérbio; 'o justo' preserva a forma e soa natural em português.
- source_word: וּרְשָׁעִים
  choice: mas os perversos
  rationale: O contexto dá à conjunção valor adversativo, contrapondo o justo aos perversos.
- source_word: יִכָּשְׁלוּ
  choice: tropeçam
  rationale: Preserva a imagem lexical de vacilar ou tropeçar e o contraste com o justo que volta a se levantar.
- source_word: בְרָעָה
  choice: na desgraça
  rationale: Neste contexto, רָעָה indica mais provavelmente adversidade, desastre ou calamidade do que maldade moral.
theological_decisions:
- issue: Natureza da queda do justo
  choice: Queda em sentido amplo, especialmente diante de adversidade, seguida de recuperação
  alternative: Pecar repetidamente e arrepender-se
  rationale: O hebraico não especifica pecado, e a contraposição com בְרָעָה favorece o campo da adversidade ou desgraça. A tradução preserva essa amplitude.
- issue: Masculino singular representativo em צַדִּיק
  choice: o justo
  alternative: uma pessoa justa
  rationale: A forma hebraica é masculina singular e funciona como tipo representativo. 'O justo' conserva essa forma sem acrescentar o substantivo 'homem'.
- issue: Valor de שֶׁבַע
  choice: manter 'sete vezes' no texto
  alternative: muitas vezes
  rationale: A imagem hebraica deve ser preservada, enquanto a provável força idiomática é explicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concessiva 'ainda que' torna explícita a relação lógica implícita no paralelismo, e 'ele' evita a leitura momentânea de que 'sete vezes' modifica 'levanta'. Os marcadores foram colocados após a oração ou expressão a que correspondem.
