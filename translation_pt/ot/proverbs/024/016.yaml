revisions:
- from: Pois, ainda que o justo caia sete vezes, ele se levanta; mas os perversos tropeçam na desgraça.[a][b]
  to: Pois o justo cai sete vezes[a] e se levanta, mas os ímpios tropeçam na desgraça.[b]
  rationale: A revisão remove a concessão acrescentada por “ainda que” e restaura a formulação proverbial assertiva do hebraico. Também emprega “ímpios” para o contraste lexical com “justo” e reposiciona os marcadores para ancorá-los diretamente às expressões explicadas.
