  text: Do not be a witness against your neighbor without cause[b][a], and do not deceive with your lips.
translation:
  language: pt
  text: Não seja testemunha contra o seu próximo sem motivo[a]. E você enganaria com os seus lábios?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sem motivo” também pode ser traduzido como “sem razão” ou “gratuitamente”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e não engane com os seus lábios”. O texto hebraico massorético apresenta esta oração como pergunta, embora ela também seja entendida como uma segunda proibição paralela.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Não seja
  rationale: A partícula אַל seguida do imperfeito de היה expressa uma proibição direta; “não seja” é natural e mantém a forma do hebraico.
- source_word: עֵד
  choice: testemunha
  rationale: O substantivo designa uma testemunha, especialmente em contexto jurídico ou comunitário.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Neste contexto, indica que o testemunho é infundado ou injustificado. “Sem motivo” é claro e corrente, sem limitar o sentido apenas à ausência de pagamento.
- source_word: בְּרֵעֶךָ
  choice: contra o seu próximo
  rationale: Com “testemunha”, a preposição בְּ naturalmente assume sentido adversativo. “Próximo” preserva a dimensão social de רֵעַ.
- source_word: וַהֲפִתִּיתָ
  choice: E você ... usaria ... para enganar?
  rationale: A forma contém a conjunção וְ e o ה interrogativo antes do verbo de פתה. A tradução conserva a pergunta do texto massorético e expressa o sentido de enganar ou induzir ao erro.
- source_word: בִּשְׂפָתֶיךָ
  choice: os seus lábios
  rationale: Mantém a imagem hebraica concreta dos lábios como instrumento da fala, de modo compreensível em português.
theological_decisions:
- issue: Forma interrogativa da segunda oração
  choice: E você usaria os seus lábios para enganar?
  alternative: e não engane com os seus lábios
  rationale: A vocalização massorética apresenta ה interrogativo em וַהֲפִתִּיתָ. A pergunta retórica preserva essa evidência textual e a tensão da construção, enquanto a alternativa entende a oração como uma segunda proibição paralela.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A primeira oração mantém a linguagem jurídico-comunitária; a segunda preserva tanto a imagem concreta dos lábios quanto a forma interrogativa indicada pela vocalização massorética.
