source:
  edition: WLC
  text: פֶּן יִרְאֶ֣ה יְ֭הוָה וְ/רַ֣ע בְּ/עֵינָ֑י/ו וְ/הֵשִׁ֖יב מֵ/עָלָ֣י/ו אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/018.yaml
  text: lest Yahweh see it[a], and it be evil in his eyes, and he turn his anger away from him.
translation:
  language: pt
  text: Do contrário, Yahweh verá isso[a], isso será mau aos seus olhos, e ele desviará dele a sua ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Do contrário, Yahweh verá isso e isso lhe desagradará.”'
    reason: Registra uma tradução idiomática possível de וְרַע בְּעֵינָיו, literalmente “e isso será mau aos seus olhos”.
lexical_decisions:
- source_word: פֶּן
  choice: para que não
  rationale: Introduz a consequência indesejada que fundamenta a proibição do versículo anterior; esta construção é natural em português e conserva a força preventiva do hebraico.
- source_word: יִרְאֶה
  choice: veja
  rationale: O imperfeito, sob o alcance de פֶּן, apresenta uma consequência possível ou temida; o subjuntivo português expressa adequadamente essa nuance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְרַע בְּעֵינָיו
  choice: e isso seja mau aos seus olhos
  rationale: Preserva a imagem avaliativa hebraica e sua formulação deliberadamente forte; a alternativa idiomática seria 'e isso lhe desagrade'.
- source_word: וְהֵשִׁיב מֵעָלָיו אַפּוֹ
  choice: e desvie dele a sua ira
  rationale: O hifil de שׁוב indica fazer voltar ou afastar, e אַף é o termo idiomático para ira; a formulação mantém claro que a ira é retirada do inimigo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Motivação para não se alegrar com a queda do inimigo
  choice: Manter que Yahweh pode desviar do inimigo a sua ira
  alternative: Explicitar que a ira seria dirigida à pessoa que se alegra
  rationale: O hebraico afirma apenas que Deus desviará sua ira 'dele', isto é, do inimigo mencionado no contexto; não declara aqui para onde a ira irá, por isso essa possível inferência não foi acrescentada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva o encadeamento do hebraico e a expressão figurada “mau aos seus olhos”, enquanto a nota oferece a equivalência idiomática.
