  text: מְחַשֵּׁ֥ב לְ/הָרֵ֑עַ ל֝֗/וֹ בַּֽעַל מְזִמּ֥וֹת יִקְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/008.yaml
  text: Whoever plans to do evil—to him they will call, “master of schemes.”
translation:
  language: pt
  text: Quem planeja fazer o mal — a esse chamarão “mestre de maquinações”.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְחַשֵּׁב
  choice: planeja
  rationale: O particípio piel descreve quem concebe ou trama deliberadamente; “planeja” preserva a ideia de intenção calculada em linguagem natural.
- source_word: לְהָרֵעַ
  choice: fazer o mal
  rationale: O infinitivo hifil de רעע expressa causar ou praticar o mal; esta formulação é clara e mantém a amplitude moral do hebraico.
- source_word: בַּעַל מְזִמּוֹת
  choice: mestre de intrigas
  rationale: בעל pode indicar alguém caracterizado por, possuidor de ou mestre em algo, enquanto מזמות pode referir-se a planos ou maquinações. “Mestre de intrigas” conserva o caráter condenatório e a força idiomática.
- source_word: יִקְרָאוּ־לוֹ
  choice: a esse chamarão
  rationale: 'Mantém explicitamente o complemento indireto לוֹ e o sujeito plural indefinido do verbo: as pessoas o chamarão assim.'
theological_decisions:
- issue: Valor moral de מְזִמּוֹת
  choice: intrigas
  alternative: planos
  rationale: Embora o substantivo possa ser neutro ou até positivo em outros contextos, aqui o planejamento do mal determina seu sentido negativo sem acrescentar uma doutrina externa.
- issue: Identidade do sujeito plural de יִקְרָאוּ
  choice: sujeito indeterminado em “chamarão”
  alternative: “todos o chamarão”
  rationale: O texto não identifica os que dão o título; evita-se inserir “todos” ou outro sujeito não expresso.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O travessão preserva a topicalização enfática do hebraico (“a esse”), e as aspas apresentam o título atribuído ao malfeitor.
