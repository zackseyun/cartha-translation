  text: רָאמ֣וֹת לֶֽ/אֱוִ֣יל חָכְמ֑וֹת בַּ֝/שַּׁ֗עַר לֹ֣א יִפְתַּח פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/007.yaml
  text: Wisdom is too high for a fool[b][a]; in the gate he does not open his mouth.
translation:
  language: pt
  text: A sabedoria é elevada demais para o insensato[a]; no portão da cidade[b], ele não abre a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As sabedorias são elevadas para o insensato”. O hebraico emprega uma forma plural de “sabedoria”, provavelmente com sentido abstrato ou intensivo.'
    reason: lexical_alternative
  - marker: b
    text: O portão da cidade era o lugar de deliberações públicas, decisões judiciais e liderança cívica nas cidades israelitas.
    reason: cultural_note
lexical_decisions:
- source_word: רָאמוֹת
  choice: elevada demais
  rationale: O termo deriva da raiz רום, “ser alto, elevado”. No contexto, indica que a sabedoria está além do alcance do insensato, preservando a metáfora espacial.
- source_word: לֶאֱוִיל
  choice: para o insensato
  rationale: A preposição ל marca relação ou referência. “Insensato” é uma tradução natural de אֱוִיל no vocabulário sapiencial e descreve falta moral e prática de juízo, não deficiência intelectual.
- source_word: חָכְמוֹת
  choice: a sabedoria
  rationale: Embora a forma hebraica seja plural, aqui pode funcionar como plural abstrato ou intensivo. O singular coletivo é natural em português; a forma plural é registrada em nota para preservar a particularidade do original.
- source_word: בַּשַּׁעַר
  choice: no portão da cidade
  rationale: O hebraico diz literalmente “no portão”. O acréscimo explicativo “da cidade” torna claro o cenário institucional antigo sem substituir a imagem original.
- source_word: לֹא יִפְתַּח פִּיהוּ
  choice: ele não abre a boca
  rationale: 'A tradução mantém o idiomatismo e a ambiguidade do hebraico quanto à razão do silêncio: incapacidade, vergonha, falta de autoridade ou ausência de algo sábio a dizer.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Elevada demais” preserva tanto a imagem de altura quanto a ideia contextual de inacessibilidade. Os marcadores aparecem junto aos elementos que explicam, em ordem sequencial.
