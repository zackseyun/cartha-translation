source:
  edition: WLC
  text: עַל שְׂדֵ֣ה אִישׁ עָצֵ֣ל עָבַ֑רְתִּי וְ/עַל כֶּ֝֗רֶם אָדָ֥ם חֲסַר לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/030.yaml
  text: I passed by the field of a sluggard[a], and by the vineyard of a man lacking sense.
translation:
  language: pt
  text: Passei pelo campo de um preguiçoso e pela vinha de um homem sem juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sem entendimento»; literalmente, «falto de coração».'
    reason: Registra tanto uma alternativa idiomática legítima quanto a forma literal da expressão hebraica חֲסַר לֵב.
lexical_decisions:
- source_word: עַל ... עָבַרְתִּי
  choice: Passei pelo
  rationale: Com o verbo עבר, a preposição עַל indica aqui o lugar pelo qual ou junto ao qual o observador passou; «passei pelo» é idiomático em português e introduz naturalmente a cena.
- source_word: שְׂדֵה אִישׁ עָצֵל
  choice: campo de um preguiçoso
  rationale: שָׂדֶה designa terreno cultivado, e עָצֵל é o termo característico de Provérbios para a pessoa dominada pela preguiça. «Preguiçoso» é claro e atual, sem perder a censura moral.
- source_word: כֶּרֶם
  choice: vinha
  rationale: כֶּרֶם é um terreno plantado de videiras. «Vinha» é a equivalência portuguesa tradicional, natural e precisa.
- source_word: אָדָם
  choice: um homem
  rationale: O substantivo designa aqui um indivíduo masculino e forma paralelo com אִישׁ; a tradução preserva essa referência sem a neutralizar.
- source_word: חֲסַר לֵב
  choice: sem juízo
  rationale: A expressão significa literalmente «falto de coração», mas em Provérbios o coração é o centro do discernimento e do bom senso. «Sem juízo» comunica de modo natural a deficiência moral e intelectual do idiomatismo.
theological_decisions:
- issue: Linguagem antropológica masculina em אָדָם
  choice: um homem
  alternative: uma pessoa; alguém
  rationale: O texto hebraico emprega um substantivo masculino em paralelo com אִישׁ. Manter «um homem» preserva a forma concreta do original sem transformar a afirmação em linguagem abstrata ou neutra.
- issue: Sentido antropológico de חֲסַר לֵב
  choice: sem juízo
  alternative: falto de coração; sem entendimento
  rationale: No pensamento hebraico, «coração» inclui entendimento, discernimento e vontade. A tradução idiomática evita sugerir mera falta de emoção, enquanto a nota conserva a imagem e uma alternativa interpretativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação «pelo campo... e pela vinha» conserva o paralelismo hebraico; «preguiçoso» e «sem juízo» são naturais para leitores comuns.
