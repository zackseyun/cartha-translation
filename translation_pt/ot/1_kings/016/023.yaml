  text: בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וְ/אַחַ֜ת שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֤ךְ עָמְרִי֙ עַל יִשְׂרָאֵ֔ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/תִרְצָ֖ה מָלַ֥ךְ שֵׁשׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: pt
  text: No trigésimo primeiro ano de Asa, rei de Judá, Onri tornou-se rei de Israel e reinou durante doze anos; em Tirza, reinou seis anos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Onri reinou sobre Israel doze anos; em Tirza, reinou seis anos”. O versículo distingue a duração total de seu reinado dos seis anos em que reinou em Tirza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת ... שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: No trigésimo primeiro ano
  rationale: A fórmula hebraica de datação régia é expressa naturalmente em português com o numeral ordinal.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: A preposição ל indica aqui o ano do reinado de Asa; a aposição identifica seu reino.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: A primeira ocorrência tem sentido ingressivo no contexto, assinalando a ascensão de Onri ao trono.
- source_word: עַל יִשְׂרָאֵל
  choice: de Israel
  rationale: Com o verbo מלך, עַל indica o povo governado. Em português, «rei de Israel» é mais idiomático do que «rei sobre Israel», sem alterar o sentido.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: reinou durante doze anos
  rationale: A expressão informa a duração total do reinado; o verbo explicitado e «durante» produzem uma formulação portuguesa clara.
- source_word: בְּ/תִרְצָה
  choice: em Tirza
  rationale: A preposição ב tem sentido locativo e indica a cidade a partir da qual Onri reinou.
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: reinou seis anos
  rationale: A segunda ocorrência de מלך descreve a duração do reinado em Tirza, distinguindo-a dos doze anos totais.
