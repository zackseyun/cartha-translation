base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: pt
  text: Quem for de Baasa[a] e morrer na cidade, os cães comerão; e quem for dele e morrer no campo, as aves do céu[b] comerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pertencer a Baasa”. O hebraico expressa uma relação com Baasa, provavelmente os de sua casa ou dinastia, sem especificá-la de modo mais restrito.
    reason: lexical_alternative
  - marker: b
    text: Ou “as aves dos céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְבַעְשָׁא
  choice: Quem da família de Baasa morrer
  rationale: O particípio singular funciona genericamente, e o ל marca relação ou pertencimento. “Da família de Baasa” expressa em português natural a referência provável aos seus familiares ou à sua casa, sem restringi-la apenas aos descendentes.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Tradução locativa direta, preservando o contraste com o campo.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: os cães comerão
  rationale: Mantém o sentido básico de אָכַל e a ordem enfática do agente no português natural.
- source_word: וְהַמֵּת לוֹ
  choice: e quem dos seus morrer
  rationale: O pronome retoma Baasa. “Dos seus” preserva a relação ampla e o paralelismo, evitando a formulação pouco idiomática “pertencente a ele”.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Equivalente corrente de שׂדה e contraponto claro a “na cidade”.
- source_word: עוֹף הַשָּׁמָיִם
  choice: as aves do céu
  rationale: O substantivo coletivo עוֹף é naturalmente vertido no plural; “aves do céu” conserva a expressão bíblica e soa corrente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o paralelismo entre cidade e campo e conserva a imagem severa do hebraico.
