  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: pt
  text: Mas Zinri, seu servo e comandante de metade dos carros de guerra, conspirou contra ele enquanto ele estava em Tirza, bebendo até se embriagar[a] na casa de Arza, que era o encarregado do palácio[b] em Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bebendo até ficar bêbado”. A expressão hebraica é vívida e descreve o ato de beber que resulta em embriaguez.'
    reason: lexical_alternative
  - marker: b
    text: “Encarregado do palácio” era um título administrativo, provavelmente dado ao oficial responsável pela casa real ou pela administração do palácio.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: conspirou contra ele
  rationale: A construção קשר com עַל, em narrativa régia, indica uma conspiração contra um governante; a formulação preserva o sentido político e é natural em português.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: Mantém o sentido básico de עבד, que neste contexto régio também pode designar um subordinado ou oficial da corte.
- source_word: זִמְרִי
  choice: Zinri
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: comandante de metade dos carros de guerra
  rationale: שַׂר designa um comandante, e רכב se refere aqui aos carros ou à força de carros; “de guerra” esclarece naturalmente a função sem alterar o referente.
- source_word: וְהוּא בְתִרְצָה
  choice: enquanto ele estava em Tirza
  rationale: A expressão introduz a circunstância temporal em que ocorreu a conspiração; “enquanto” torna essa relação natural em português.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: bebendo até se embriagar
  rationale: Preserva a imagem vívida de uma ação contínua de beber que resulta em embriaguez, sem reduzi-la apenas a um estado.
- source_word: בֵּית אַרְצָא
  choice: na casa de Arza
  rationale: Representa diretamente a construção בית seguida do nome pessoal e mantém a localização concreta da cena.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: que era o encarregado do palácio
  rationale: A expressão é um título administrativo para o oficial responsável pela casa real ou pelo palácio; esta forma comunica a função com clareza ao leitor moderno.
- source_word: בְּתִרְצָה
  choice: em Tirza
  rationale: A repetição final do lugar foi preservada, refletindo a repetição do texto hebraico e vinculando o cargo ou a casa de Arza à cidade.
