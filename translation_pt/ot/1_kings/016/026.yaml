    text: 'Hebraico: “coisas vãs deles” ou “coisas sem valor deles”; o termo é uma designação polêmica comum para ídolos.'
    reason: lexical_alternative
  revision_rationale: A revisão resolve a falha sintática do segundo termo coordenado. «Seguiu plenamente o caminho» comunica a conformidade total expressa por «em todo o caminho», e «praticou os pecados» torna explícita e natural a conduta que o hebraico formula pela repetição de «andar em». A repetição de «Jeroboão» continua esclarecendo que os pecados e a ação causativa se referem a ele.
