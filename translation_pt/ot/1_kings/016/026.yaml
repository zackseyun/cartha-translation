  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט ו/ב/חטאתי/ו אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: pt
  text: Pois ele seguiu plenamente o caminho de Jeroboão, filho de Nebate, e praticou os pecados com que Jeroboão levou Israel a pecar, provocando Yahweh, o Deus de Israel, com os ídolos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “coisas vãs deles” ou “coisas sem valor deles”; o termo é uma designação polêmica comum para ídolos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: seguiu todo o caminho
  rationale: O verbo הלך com דֶּרֶךְ descreve conduta ou modo de vida. “Seguiu todo o caminho” preserva a metáfora hebraica e comunica plena conformidade ao exemplo de Jeroboão.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: וּבְחַטֹּאתָיו
  choice: e os pecados
  rationale: O sufixo masculino singular remete a Jeroboão. A repetição explícita do nome na oração seguinte evita que o português atribua os pecados ao sujeito principal sem perder o referente hebraico.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com que Jeroboão levou Israel a pecar
  rationale: O hifil de חטא tem sentido causativo. “Levou Israel a pecar” expressa essa causalidade de modo natural e claro.
- source_word: לְהַכְעִיס
  choice: provocando
  rationale: O infinitivo pode indicar propósito ou resultado. O gerúndio mantém essa relação aberta e dá fluidez à frase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica.
- source_word: בְּהַבְלֵיהֶם
  choice: com os ídolos deles
  rationale: הֶבֶל significa literalmente vapor, vaidade ou coisa sem valor e, neste contexto polêmico e cultual, designa ídolos. “Ídolos” torna claro o referente; “deles” preserva o sufixo plural hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio do Deus de Israel. “Yahweh” preserva o nome pessoal sem o substituir por um título.
- issue: Sentido cultual de הֶבֶל
  choice: ídolos
  alternative: vaidades; coisas sem valor
  rationale: O contexto relaciona os pecados de Jeroboão à provocação do Deus de Israel por objetos ou deuses cultuais. A nota conserva a metáfora depreciativa do hebraico sem reduzir o sentido contextual do texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “Jeroboão” esclarece o referente dos sufixos e do verbo causativo. “Ídolos deles” conserva o plural possessivo do hebraico, enquanto a nota registra sua imagem literal de vazio e inutilidade.
