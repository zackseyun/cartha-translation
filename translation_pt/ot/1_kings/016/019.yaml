base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: pt
  text: por causa dos pecados que cometeu[a], fazendo o que era mau aos olhos de Yahweh, andando no caminho de Jeroboão e no seu pecado, pelo qual levou Israel a pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “por causa do seu pecado com que pecou”.'
    reason: A nota registra a construção cognata e o singular coletivo do hebraico, vertidos de modo idiomático no texto principal.
lexical_decisions:
- source_word: עַל חטאתו אֲשֶׁר חָטָא
  choice: por causa dos pecados que cometeu
  rationale: עַל introduz a causa do juízo mencionado no contexto anterior. A construção cognata singular, literalmente “por causa do seu pecado com que pecou”, tem sentido coletivo e é expressa em português corrente pelo plural “pecados que cometeu”.
- source_word: לַעֲשׂוֹת הָרַע
  choice: fazendo o que era mau
  rationale: O infinitivo esclarece em que consistiam seus pecados. A forma escolhida mantém a relação explicativa e soa natural em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora avaliativa hebraica, clara e corrente em português.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: andando no caminho de Jeroboão
  rationale: Mantém a metáfora hebraica de seguir um padrão de conduta, sem substituir a imagem por uma explicação.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: e no pecado que levou Israel a cometer
  rationale: Integra o infinitivo causativo לְהַחֲטִיא à oração anterior. “Levou Israel a cometer” conserva a ideia de fazer Israel pecar e evita uma construção truncada em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Responsabilidade de Zinri e de Israel pelo pecado
  choice: levou Israel a cometer
  alternative: fez Israel pecar
  rationale: A formulação conserva o valor causativo do hifil sem eliminar a agência de Israel nem transformar a frase em afirmação sobre coerção irresistível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se as metáforas hebraicas “aos olhos” e “andando no caminho”; a sintaxe é ajustada apenas onde necessário para fluência.
