base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: pt
  text: Quando Zinri viu que a cidade tinha sido tomada, entrou na cidadela da casa do rei[a], incendiou a casa do rei sobre si mesmo[b] e morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortaleza” ou “palácio”. O termo hebraico אַרְמוֹן pode indicar uma estrutura real fortificada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “incendiou a casa do rei sobre si mesmo”; a expressão descreve sua autodestruição ao atear fogo à residência real sobre si.
    reason: cultural_note
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: quando ... viu
  rationale: O infinitivo construto precedido de כִּי tem sentido temporal neste contexto; a formulação é natural em português e preserva a sequência narrativa.
- source_word: נִלְכְּדָה
  choice: tinha sido tomada
  rationale: O nifal de לכד expressa que a cidade foi capturada; o mais-que-perfeito composto deixa claro que isso já ocorrera quando Zinri o percebeu.
- source_word: אַרְמוֹן
  choice: cidadela
  rationale: O termo pode designar um palácio ou uma estrutura real fortificada. “Cidadela” preserva o possível aspecto defensivo e evita identificá-lo sem ressalva com בֵּית הַמֶּלֶךְ.
- source_word: בֵּית הַמֶּלֶךְ / בֵּית מֶלֶךְ
  choice: casa do rei
  rationale: Mantém a expressão concreta do hebraico e sua repetição no versículo, sem fundi-la com אַרְמוֹן.
- source_word: וַיִּשְׂרֹף עָלָיו
  choice: incendiou sobre si mesmo
  rationale: Preserva a construção incomum do hebraico, segundo a qual Zinri ateou fogo à residência estando dentro dela, fazendo com que ardesse sobre ele.
- source_word: בָּאֵשׁ
  choice: incendiou
  rationale: O elemento instrumental “com fogo” está naturalmente incorporado ao verbo português “incendiar”, sem perda do sentido.
- source_word: וַיָּמֹת
  choice: e morreu
  rationale: Reproduz a continuação narrativa simples e o desfecho explícito do ato.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. Conserva-se a distinção lexical entre “cidadela” e “casa do rei”, bem como a formulação deliberadamente concreta da autodestruição de Zinri.
