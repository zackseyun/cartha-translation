base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: pt
  text: E Acabe, filho de Onri, tornou-se rei de Israel no trigésimo oitavo ano do reinado de Asa, rei de Judá. Acabe, filho de Onri, reinou sobre Israel em Samaria durante vinte e dois anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Na fórmula régia, o qatal de מלך indica a ascensão ao trono; a expressão distingue esse início do resumo posterior sobre a duração do reinado.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: no trigésimo oitavo ano do reinado
  rationale: Expressa naturalmente em português o valor ordinal da fórmula de datação e explicita que o ano pertence ao reinado de Asa, sem alterar o sentido.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: Preserva Asa como ponto de referência da sincronização régia em linguagem portuguesa clara e digna.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O verbo introduz a declaração de duração que se segue, por isso indica o exercício continuado do governo.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição marca o lugar da sede régia; 'em Samaria' é a forma natural em português.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: vinte e dois anos
  rationale: Tradução direta e idiomática da duração do reinado.
- source_word: וְ
  choice: Acabe
  rationale: A conjunção dá continuidade à sequência narrativa; em português, no início isolado do versículo, essa ligação pode permanecer implícita sem a rigidez de começar com 'E'.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição do nome e da filiação de Acabe foi preservada por corresponder à estrutura enfática da fórmula régia hebraica; a frase foi dividida em dois períodos para maior clareza.
