  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Jeú, filho de Hanani, contra Baasa[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito de Baasa”. A preposição hebraica pode ter sentido mais amplo, mas aqui introduz um oráculo de juízo; por isso, “contra” é preferível.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa introduz um novo acontecimento na sequência. “Então” expressa essa progressão de modo natural, enquanto “veio” integra idiomaticamente a fórmula profética.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” conserva a forma e a ressonância teológica da fórmula profética, sem tornar explícita a interpretação “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Marca naturalmente em português o destinatário a quem a palavra divina veio.
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: Jeú, filho de Hanani
  rationale: Emprega as formas portuguesas usuais e verte de modo direto a relação filial; as vírgulas tornam o aposto natural em português.
- source_word: עַל
  choice: contra
  rationale: No contexto de uma denúncia profética, comunica a orientação judicial do oráculo, preservando em nota a alternativa mais ampla.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Forma tradicional e reconhecível do nome em português bíblico.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz diretamente o conteúdo da fala divina que continua no versículo seguinte; os dois-pontos são naturais nessa função.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de עַל na fórmula profética
  choice: contra Baasa
  alternative: a respeito de Baasa; acerca de Baasa
  rationale: O contexto introduz um oráculo de condenação, por isso “contra” preserva sua força judicial; uma nota mantém visível a amplitude lexical da preposição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a fórmula profética tradicional sem arcaísmos desnecessários e preserva a ambiguidade relevante de עַל em nota.
