  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Baasa, o que ele fez e o seu poder — não estão escritos no Livro das Crônicas dos Reis de Israel[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livro dos Anais dos Reis de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: Na fórmula régia, דִּבְרֵי designa os atos ou acontecimentos registrados acerca do rei, e não apenas suas palavras. “Os demais atos” é claro e preserva o sentido substantivo de יֶתֶר.
- source_word: בַעְשָׁא
  choice: Baasa
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: o que ele fez
  rationale: Tradução direta da oração relativa, sem acrescentar “tudo”, que não está explícito no hebraico.
- source_word: וּגְבוּרָתוֹ
  choice: e o seu poder
  rationale: Preserva o substantivo abstrato גְּבוּרָה, que pode indicar força ou poder demonstrado; evita especificar “façanhas” quando o texto mantém certa amplitude.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica e a fórmula recorrente de Reis em português natural.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa significar literalmente “sobre”, com o verbo “escrever” indica registro em um documento.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Livro das Crônicas
  rationale: Expressa o título de uma fonte histórica oficial; “Livro dos Anais” continua sendo alternativa lexical plausível e é indicada em nota.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: O ל marca aqui a relação do documento com os reis de Israel; “dos Reis de Israel” é idiomático e claro em português.
