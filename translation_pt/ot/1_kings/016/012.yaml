  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: pt
  text: Assim, Zinri destruiu toda a casa de Baasa[b], conforme a palavra de Yahweh que ele havia falado contra[a] Baasa por meio do profeta Jeú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Baasa”. A preposição hebraica significa literalmente “a”, mas aqui introduz uma palavra de juízo dirigida contra ele.'
    reason: lexical_alternative
  - marker: b
    text: “Casa de Baasa” refere-se à casa real ou dinastia de Baasa, não apenas à sua família imediata ou residência.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: destruiu
  rationale: O hifil de שׁמד expressa causar destruição ou aniquilação. “Destruiu” é claro, digno e não especifica além do hebraico o modo da eliminação.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: toda a casa de Baasa
  rationale: Em contexto régio, “casa” designa a casa real ou dinastia, e não apenas uma residência ou família imediata. A formulação preserva o idioma bíblico; a nota esclarece o sentido.
- source_word: כִּדְבַר
  choice: conforme a palavra de
  rationale: A expressão indica conformidade com a declaração divina anterior e, no contexto, seu cumprimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ele havia proferido
  rationale: O mais-que-perfeito deixa clara a anterioridade da declaração profética. “Proferido” combina naturalmente com “palavra” e mantém um registro digno.
- source_word: אֶל בַּעְשָׁא
  choice: contra Baasa
  rationale: Embora אֶל costume significar “a/para”, aqui introduz uma palavra profética de juízo dirigida adversamente a Baasa. A nota preserva a alternativa formal.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: por meio do profeta Jeú
  rationale: O idioma “pela mão de” indica mediação ou agência. “Por meio de” comunica isso em português natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” o representa diretamente sem substituir o Tetragrama por “SENHOR”.
- issue: Força de אֶל na palavra profética referente a Baasa
  choice: contra Baasa
  alternative: a Baasa
  rationale: O contexto identifica a mensagem como um anúncio de juízo adverso. “Contra” explicita essa força contextual, enquanto a nota registra a forma mais literal e preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. Mantém o idioma dinástico “casa de Baasa”, esclarecido em nota, e usa “por meio de” para expressar naturalmente a agência profética.
