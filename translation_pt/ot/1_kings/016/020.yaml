base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Quanto aos demais atos de Zinri e à conspiração que ele tramou[a], não estão escritos no Livro das Crônicas dos Reis de Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao seu complô que ele urdiu”. No hebraico, o substantivo e o verbo vêm da mesma raiz, criando ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: Quanto aos demais atos de Zinri
  rationale: A expressão formular refere-se ao restante dos feitos do rei. “Quanto aos” marca naturalmente a transição discursiva sem acrescentar um advérbio temporal, e “atos” transmite o sentido contextual de דִּבְרֵי.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: e à conspiração que ele tramou
  rationale: “Conspiração” preserva o sentido político de קֶשֶׁר, enquanto “tramou” traduz o verbo cognato de modo natural em português. A nota registra a repetição enfática da mesma raiz no hebraico.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a forma de pergunta retórica e o sentido passivo do particípio hebraico.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: no Livro das Crônicas dos Reis de Israel
  rationale: Rendering idiomático da fórmula arquivística; “Crônicas” comunica o caráter analístico do registro, e “dos Reis de Israel” reflete a função titular do לְ.
