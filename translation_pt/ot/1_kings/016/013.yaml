  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: pt
  text: por causa de todos os pecados de Baasa e dos pecados de seu filho Elá, que eles cometeram e pelos quais fizeram Israel pecar, provocando Yahweh, o Deus de Israel, com seus ídolos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com suas vaidades” ou “com suas coisas sem valor”, expressão polêmica comum para se referir aos ídolos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: por causa de
  rationale: Neste contexto de juízo, a preposição introduz a causa do que foi declarado anteriormente.
- source_word: כָּל חַטֹּאות
  choice: todos os pecados
  rationale: Preserva tanto o sentido direto do substantivo plural como a abrangência expressa por כָּל.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Forma portuguesa corrente do nome próprio hebraico.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: e dos pecados de seu filho Elá
  rationale: Explicita naturalmente em português que Elá era filho de Baasa, sem alterar a relação do construto hebraico.
- source_word: אֲשֶׁר חָטְאוּ
  choice: que eles cometeram
  rationale: Em português, 'cometer pecados' reproduz idiomaticamente a relação entre o pronome relativo e os pecados mencionados.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: e pelos quais fizeram Israel pecar
  rationale: Preserva o valor causativo do hifil de חטא e liga a ação aos pecados já mencionados.
- source_word: לְהַכְעִיס
  choice: provocando
  rationale: Expressa de modo fluente o resultado ou propósito das ações pecaminosas sem eliminar essa possível amplitude sintática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e natural da construção hebraica.
- source_word: בְּהַבְלֵיהֶם
  choice: com seus ídolos
  rationale: Neste contexto, הֲבָלִים designa polemicamente os ídolos como coisas vãs ou sem valor; o referente é explicitado no texto e a imagem lexical é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de o substituir por um título.
- issue: Referente de בְּהַבְלֵיהֶם
  choice: com seus ídolos
  alternative: com suas vaidades / com suas coisas sem valor
  rationale: O contexto histórico e a expressão polêmica indicam ídolos, enquanto a nota conserva o sentido figurativo literal de vapor, vaidade ou inutilidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada em “seu filho Elá” para maior naturalidade. O marcador da nota foi colocado junto a “ídolos”, termo ao qual a nota lexical efetivamente se refere.
