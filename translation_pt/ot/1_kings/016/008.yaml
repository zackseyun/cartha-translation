base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: pt
  text: No vigésimo sexto ano de Asa, rei de Judá, Elá, filho de Baasa, passou a reinar sobre Israel, em Tirza, por dois anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: No vigésimo sexto ano
  rationale: Expressa de modo natural em português a fórmula hebraica de datação pelo ano de reinado, sem reproduzir sua repetição idiomática.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: O לְ indica referência ao reinado de Asa; a aposição com vírgulas é clara e corrente em português.
- source_word: מָלַךְ
  choice: tornou-se rei ... e reinou
  rationale: No aviso de entronização, o verbo introduz o começo do reinado, enquanto o período final informa sua duração. A formulação portuguesa explicita naturalmente ambas as relações sem alterar o conteúdo.
- source_word: אֵלָה
  choice: Elá
  rationale: Transliteração portuguesa do nome hebraico אֵלָה, com acento para indicar a tonicidade final.
- source_word: בֶן בַּעְשָׁא
  choice: filho de Baasa
  rationale: Equivalente direto e idiomático da construção filial hebraica.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Preserva diretamente a construção de governo com עַל, sem acrescentar 'reino', ausente do texto.
- source_word: בְּתִרְצָה
  choice: em Tirza
  rationale: A preposição בְּ marca aqui o local do reinado; 'em' é a forma natural em português.
- source_word: שְׁנָתָיִם
  choice: por dois anos
  rationale: O dual hebraico significa 'dois anos'; 'por' expressa com clareza a duração do reinado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para uma fórmula régia. Os nomes seguem formas transliteradas de leitura acessível em português. A repetição de 'rei/reinou' evita que 'em Tirza por dois anos' pareça modificar apenas o ato pontual de tornar-se rei.
