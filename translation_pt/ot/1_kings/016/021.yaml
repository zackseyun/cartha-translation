  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: pt
  text: 'Então o povo de Israel se dividiu em duas partes: metade do povo apoiava Tibni, filho de Ginate, para fazê-lo rei, e a outra metade apoiava Onri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: se dividiu
  rationale: O nifal de חלק expressa que o povo se dividiu ou foi dividido; a forma pronominal é natural em português e preserva a ação sem especificar um agente.
- source_word: הָעָם יִשְׂרָאֵל
  choice: o povo de Israel
  rationale: A expressão identifica a população de Israel e é vertida de modo claro e idiomático.
- source_word: לַחֵצִי
  choice: em duas partes
  rationale: No contexto, indica a divisão do povo em duas metades; a formulação torna explícita a bipartição sem alterar o sentido.
- source_word: חֲצִי הָעָם
  choice: metade do povo
  rationale: Preserva a distribuição equilibrada entre os dois grupos.
- source_word: הָיָה אַחֲרֵי
  choice: apoiava
  rationale: O idioma literalmente relacionado a estar atrás de alguém indica aqui adesão política a um pretendente; “apoiava” comunica esse sentido com clareza.
- source_word: תִבְנִי בֶן גִּינַת
  choice: Tibni, filho de Ginate
  rationale: Os nomes são transliterados segundo formas portuguesas legíveis, e a filiação é expressa naturalmente.
- source_word: לְהַמְלִיכוֹ
  choice: para fazê-lo rei
  rationale: O infinitivo hifil de מלך significa fazer alguém reinar; a tradução evita acrescentar uma cerimônia de coroação não expressa no hebraico.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: e a outra metade apoiava Onri
  rationale: O verbo é recuperado da oração paralela. “A outra metade” explicita naturalmente em português o contraste já implícito no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Apoiava” evidencia a lealdade política pretendida pelo idioma hebraico, enquanto “se dividiu” mantém a voz não agentiva do original.
