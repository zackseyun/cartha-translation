base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: pt
  text: Baasa descansou com seus antepassados[a] e foi sepultado em Tirza. E seu filho Elá reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deitou-se com seus pais”. Trata-se de uma fórmula hebraica convencional para a morte de um rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão é uma fórmula régia convencional para a morte. “Descansou” preserva a imagem do hebraico de modo natural e digno em português, enquanto “antepassados” comunica aqui o sentido coletivo de אֲבֹתָיו com maior clareza do que o literal “pais”.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: O nifal tem sentido passivo neste contexto; “foi sepultado” é uma formulação natural e apropriada ao registro régio.
- source_word: בְּתִרְצָה
  choice: em Tirza
  rationale: A preposição בְּ diante do nome da cidade é naturalmente expressa por “em”; o topônimo segue a forma portuguesa tradicional Tirza.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: “Reinou” preserva de maneira concisa a fórmula de sucessão real e o valor do verbo מָלַךְ.
- source_word: אֵלָה בְנוֹ
  choice: seu filho Elá
  rationale: Esta ordem é mais natural em português, sem alterar a relação filial expressa no hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: No contexto sucessório, a expressão indica que Elá assumiu a posição régia de Baasa; “em seu lugar” conserva esse sentido de substituição direta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva-se a fórmula mortuária por equivalência de imagem, mas emprega-se “antepassados” para evitar a possível leitura restrita de “pais” biológicos.
