source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: pt
  text: Porque eu o levantei do pó e o fiz governante do meu povo Israel, e você andou no caminho de Jeroboão e levou o meu povo Israel a pecar[a], provocando a minha ira com os pecados deles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez o meu povo Israel pecar”. O verbo hebraico está na forma causativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Porque
  rationale: Introduz a causa do juízo anunciado no versículo seguinte e mantém com naturalidade a força causal da expressão hebraica.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: eu o levantei do pó
  rationale: Preserva a imagem de elevação desde uma condição humilde e sua aplicação à ascensão política de Baasa.
- source_word: וָאֶתֶּנְךָ נָגִיד עַל עַמִּי יִשְׂרָאֵל
  choice: e o fiz governante sobre o meu povo Israel
  rationale: נָגִיד designa um líder ou governante constituído; a formulação conserva tanto a nomeação quanto a autoridade exercida sobre Israel.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: e você andou no caminho de Jeroboão
  rationale: Mantém o idiomatismo hebraico do andar como padrão de conduta e traduz a conjunção ו de modo direto, sem introduzir obrigatoriamente uma oposição.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: e levou o meu povo Israel a pecar
  rationale: Expressa de forma natural a força causativa do hifil de חטא, atribuindo ao rei responsabilidade por induzir o povo ao pecado.
- source_word: לְהַכְעִיסֵנִי
  choice: provocando a minha ira
  rationale: Comunica o resultado ou propósito da conduta descrita e preserva o caráter pessoal da ofensa contra Deus.
- source_word: בְּחַטֹּאתָם
  choice: com os pecados deles
  rationale: Conserva o plural e toma o sufixo como referência imediata ao povo de Israel, sem excluir a responsabilidade do rei.
theological_decisions:
- issue: Referente do sufixo plural em בְּחַטֹּאתָם (‘pecados deles’)
  choice: Os pecados são os cometidos pelo povo de Israel sob a influência de Baasa.
  alternative: A expressão pode abranger mais amplamente as práticas pecaminosas do caminho de Jeroboão, incluindo a participação do próprio Baasa.
  rationale: O antecedente sintático mais próximo é ‘meu povo Israel’; a tradução mantém a responsabilidade do povo por seus atos e a culpa do rei por levá-lo ao pecado.
- issue: Relação entre a elevação de Baasa e sua conduta
  choice: Traduzir a conjunção como ‘e’.
  alternative: Traduzir como ‘mas’ para explicitar o contraste contextual.
  rationale: Embora o contexto contenha claro contraste, a conjunção hebraica não exige por si só valor adversativo; ‘e’ preserva a coordenação e deixa o leitor perceber a tensão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Conserva o idiomatismo bíblico ‘andou no caminho’ e a imagem ‘do pó’, evitando linguagem arcaica. A vírgula final foi mantida porque o enunciado causal continua no versículo seguinte.
