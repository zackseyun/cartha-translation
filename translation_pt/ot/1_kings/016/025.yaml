  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: pt
  text: Onri fez o que era mau aos olhos de Yahweh e agiu pior do que todos os que vieram antes dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e foi pior do que todos os que vieram antes dele”. O verbo hebraico pode ser entendido como uma descrição do próprio Onri ou de sua conduta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: fez
  rationale: Com הָרַע como complemento, עשה forma a expressão idiomática “fazer o que é mau”; “fez” é natural em português e mantém o sentido de praticar ações más.
- source_word: הָרַע
  choice: o que era mau
  rationale: O adjetivo com artigo funciona substantivamente na fórmula hebraica. “O que era mau” comunica esse valor com clareza, sem a rigidez de “o mal”.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a imagem da expressão hebraica de avaliação e é idiomática em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּרַע
  choice: agiu pior
  rationale: O verbo no hifil, seguido da comparação com מִכֹּל, avalia a conduta de Onri como pior que a dos anteriores. A formulação é natural e mantém o foco narrativo em seus atos, sem eliminar a possível leitura de que ele próprio “foi pior”.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: do que todos os que vieram antes dele
  rationale: Reproduz a comparação sem acrescentar “reis” ou “predecessores”, termos plausíveis pelo contexto, mas não explícitos neste versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo pelo título “SENHOR”.
- issue: Se וַיָּרַע descreve a conduta de Onri ou o próprio Onri
  choice: agiu pior
  alternative: foi pior
  rationale: A leitura principal acompanha a fórmula narrativa de avaliação dos atos do rei, enquanto a nota conserva a possibilidade gramatical de uma caracterização direta da pessoa.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. Conserva-se a imagem hebraica “aos olhos de” e evita-se explicitar “reis”, que está implícito no contexto, mas não aparece no texto deste versículo.
