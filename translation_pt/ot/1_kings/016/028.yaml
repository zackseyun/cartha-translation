  yaml_path: translation/ot/1_kings/016/028.yaml
  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: pt
  text: Omri morreu e foi sepultado em Samaria[a], e seu filho Acabe reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dormiu com seus pais”, fórmula convencional de morte nas narrativas reais; aqui “pais” tem o sentido de antepassados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com os seus antepassados
  rationale: A expressão hebraica é uma fórmula convencional de morte nas narrativas reais. “Descansou” conserva a imagem do original sem produzir, no português atual, a possível conotação sexual de “dormiu com”; “antepassados” comunica com clareza o sentido familiar e dinástico de אָבוֹת neste contexto.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: O nifal pede uma formulação passiva. “Foi sepultado” é natural, digno e adequado ao registro narrativo.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição בְּ indica aqui o local do sepultamento; “em Samaria” é a forma corrente em português.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Na fórmula de sucessão, “reinou” traduz de modo conciso o verbo מלך sem acrescentar uma nuance incoativa obrigatória.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão indica que Acabe sucedeu Omri no trono; “em seu lugar” preserva diretamente a ideia de substituição e sucessão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula hebraica de morte foi preservada por equivalência idiomática, enquanto a nota registra sua forma mais literal. “Então” explicita de modo natural a progressão narrativa do wayyiqtol sem alterar a relação de sucessão.
