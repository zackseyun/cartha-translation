base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: pt
  text: 'E o povo que estava acampado ouviu dizer: “Zinri conspirou e também matou o rei”. Então, naquele mesmo dia, no acampamento, todo o Israel proclamou rei Onri, comandante do exército de Israel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: o povo que estava acampado
  rationale: Expressa naturalmente o particípio hebraico e identifica o povo presente no acampamento, sem acrescentar um advérbio ausente do texto.
- source_word: קָשַׁר
  choice: conspirou
  rationale: No contexto de uma tomada violenta do poder, o verbo significa conspirar ou tramar contra o rei.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: matou o rei
  rationale: Embora הִכָּה literalmente possa ser 'golpeou/feriu', aqui designa o golpe fatal contra o rei, conforme o contexto imediato.
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: proclamou rei Onri
  rationale: O hifil de מלך significa fazer alguém rei; 'proclamou rei' é idiomático e conserva a ação coletiva de entronização.
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: comandante do exército de Israel
  rationale: Transmite a função militar de Onri em português corrente; עַל indica sua autoridade sobre as forças de Israel.
