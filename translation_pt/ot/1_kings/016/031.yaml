base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: pt
  text: E, como se fosse pouca coisa para ele andar nos pecados de Jeroboão, filho de Nebate[a], tomou por mulher Jezabel, filha de Etbaal, rei dos sidônios, e foi servir Baal e prostrar-se diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi pouca coisa para ele andar nos pecados de Jeroboão, filho de Nebate...?” A abertura hebraica é retórica e destaca que Acabe tratou esses pecados como algo insignificante.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: הֲנָקֵל
  choice: como se fosse pouca coisa
  rationale: Preserva o caráter retórico e avaliativo da expressão hebraica, indicando que Acabe tratou os pecados de Jeroboão como insignificantes, antes de avançar ainda mais na apostasia.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: para ele andar nos pecados
  rationale: Mantém a metáfora hebraica de andar como padrão de conduta, uma formulação bíblica ainda clara em português.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: tomou por mulher Jezabel
  rationale: Reproduz de modo natural e digno a estrutura hebraica 'tomou como mulher', sem reduzir a expressão simplesmente a 'casou-se com'.
- source_word: אֶתְבַּעַל
  choice: Etbaal
  rationale: Transliteração portuguesa clara do nome fenício, coerente com a forma hebraica e com o uso bíblico em português.
- source_word: צִידֹנִים
  choice: sidônios
  rationale: Representa diretamente o gentílico plural hebraico na expressão 'rei dos sidônios'.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: servir Baal
  rationale: Conserva o sentido cultual de עבד e o distingue do ato de prostração expresso pelo verbo seguinte.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: prostrar-se diante dele
  rationale: Expressa o gesto concreto de submissão e culto sem fundi-lo semanticamente com 'servir'.
theological_decisions:
- issue: Relação entre os pecados de Jeroboão e a adoração de Baal por Acabe
  choice: 'A formulação mostra uma escalada: Acabe tratou como pouca coisa seguir os pecados de Jeroboão e avançou para o serviço e a prostração diante de Baal.'
  alternative: 'Ler a abertura como pergunta explícita: ''Foi pouca coisa para ele andar nos pecados de Jeroboão...?'''
  rationale: A construção hebraica admite uma força interrogativa ou idiomático-retórica. A tradução principal comunica a avaliação e a escalada narrativa sem resolver em excesso a forma sintática; a alternativa é registrada em nota.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservam-se as metáforas bíblicas ''andar nos pecados'' e o contraste entre servir e prostrar-se. Os nomes seguem formas portuguesas correntes: Jeroboão, Nebate, Jezabel, Etbaal e Baal.'
