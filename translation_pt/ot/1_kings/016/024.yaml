source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: pt
  text: Ele comprou de Semer o monte de Samaria por dois talentos de prata[a], construiu no monte e deu à cidade que construiu o nome de Samaria, por causa do nome de Semer, o proprietário do monte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O talento era uma grande unidade de peso usada para metais preciosos; o valor exato podia variar.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “e chamou o nome da cidade que construiu de Samaria, segundo o nome de Semer, o proprietário do monte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: comprou
  rationale: Neste contexto, קנה indica adquirir uma propriedade mediante pagamento; “comprou” é a forma mais natural e direta em português.
- source_word: הָהָר
  choice: o monte
  rationale: הַר pode designar monte ou montanha. “Monte” é idiomático para a elevação onde a cidade foi construída e corresponde ao uso bíblico corrente em português.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do lugar, aplicado aqui primeiro ao monte e depois à cidade.
- source_word: מֵאֵת שֶׁמֶר
  choice: de Semer
  rationale: A preposição assinala a pessoa de quem a propriedade foi adquirida. “Semer” é uma forma portuguesa tradicional do nome.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: por dois talentos de prata
  rationale: כִּכָּר, em contexto monetário, é uma grande unidade de peso; a forma dual indica dois talentos.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: construiu no monte
  rationale: A expressão hebraica é literalmente “construiu o monte”, mas o sentido contextual é construir edificações ou a cidade naquele local. A formulação evita acrescentar a ideia não explícita de fortificação.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: deu à cidade ... o nome de
  rationale: Reproduz em português natural o idioma hebraico de chamar ou proclamar o nome de uma cidade.
- source_word: אֲשֶׁר בָּנָה
  choice: que construiu
  rationale: Mantém a oração relativa e a sequência narrativa simples do hebraico.
- source_word: עַל שֵׁם שֶׁמֶר
  choice: por causa do nome de Semer
  rationale: A expressão relaciona explicitamente o nome da cidade ao nome de Semer. “Por causa do nome” preserva essa relação sem impor uma explicação etimológica mais específica que o texto.
- source_word: אֲדֹנֵי הָהָר
  choice: o proprietário do monte
  rationale: אדון tem aqui sentido de posse da propriedade, não de título nobiliárquico nem de senhorio divino.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A sintaxe foi suavizada onde o idioma hebraico seria pouco natural em português, sem eliminar a repetição de “construiu”, que liga a ação ao nome da cidade. Os marcadores das notas foram alinhados ao conteúdo correto, pois na camada inglesa fornecida as notas parecem estar trocadas.
