source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: pt
  text: Também por meio do profeta Jeú, filho de Hanani, a palavra de Yahweh veio contra Baasa e contra a sua casa, por causa de todo o mal que ele fez aos olhos de Yahweh, provocando-o à ira com a obra de suas mãos, ao se tornar semelhante à casa de Jeroboão, e porque a destruiu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e porque o matou”. O sufixo hebraico é masculino singular e pode se referir ao próprio Jeroboão ou, mais provavelmente neste contexto, à casa ou dinastia dele, considerada coletivamente.'
    reason: Preservar a ambiguidade gramatical e referencial do texto hebraico.
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Mantém a ideia de acréscimo e continuidade com o juízo mencionado no contexto anterior, sem tornar a abertura pesada.
- source_word: בְּיַד יֵהוּא בֶן־חֲנָנִי הַנָּבִיא
  choice: por meio do profeta Jeú, filho de Hanani
  rationale: A expressão idiomática בְּיַד indica mediação ou agência; “por meio de” comunica isso naturalmente em português.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e verte diretamente o nome divino יְהוָה como Yahweh.
- source_word: אֶל בַּעְשָׁא וְאֶל בֵּיתוֹ
  choice: contra Baasa e contra a sua casa
  rationale: Embora אֶל possa significar “a”, o contexto de denúncia e juízo favorece “contra”; “casa” conserva a abrangência de família, corte e dinastia.
- source_word: וְעַל כָּל־הָרָעָה
  choice: por causa de todo o mal
  rationale: Aqui עַל apresenta o fundamento do juízo; “por causa de” torna clara essa relação causal.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Conserva a metáfora hebraica tradicional em formulação corrente e inteligível em português.
- source_word: לְהַכְעִיסוֹ
  choice: provocando-o à ira
  rationale: Expressa o sentido causativo do verbo e mantém Yahweh como referente natural do pronome.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: com a obra de suas mãos
  rationale: Preserva a imagem concreta do hebraico sem restringi-la indevidamente a idolatria ou a uma categoria específica de atos.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: ao se tornar semelhante à casa de Jeroboão
  rationale: Apresenta de modo natural a circunstância ou resultado pelo qual Baasa reproduziu o padrão da casa de Jeroboão.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: e porque a destruiu
  rationale: O sufixo hebraico é masculino singular, mas pode retomar coletivamente a “casa” de Jeroboão. Em português, “a” explicita essa leitura contextual, enquanto a nota preserva a possível referência pessoal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” representa diretamente o nome divino sem substituí-lo por um título.
- issue: Referente do sufixo em אֹתוֹ
  choice: a casa/dinastia de Jeroboão, entendida coletivamente
  alternative: o próprio Jeroboão
  rationale: O contexto imediato trata da casa de Jeroboão, que Baasa exterminou, mas a forma masculina singular permite uma referência pessoal; por isso a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantêm-se as expressões bíblicas “palavra de Yahweh”, “casa” e “aos olhos de Yahweh”, enquanto os elos sintáticos são formulados de modo natural.
