review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente o anúncio de juízo e a eliminação da casa real de Baasa. Contudo, o hebraico alterna «sua casa» (a casa de Baasa) e «tua casa» (a casa do destinatário), e essa distinção deve ser mantida em português. A construção com הִנְנִי + particípio tem força iminente/em curso, mais bem refletida por «estou prestes a eliminar» do que pelo futuro simples.
  naturalness: «Eis que estou prestes a eliminar» é claro, solene e natural em português moderno. «Tua casa» é perfeitamente compreensível no registro bíblico e evita a ambiguidade referencial de repetir «sua casa».
  terminology: Baasa, Jeroboão e Nebate são formas portuguesas adequadas. «Casa» preserva a imagem hebraica e sua dimensão familiar e dinástica. A nota deve apresentar a expressão literal como idiomática sem sugerir que «o que vem depois» seja uma tradução lexical direta do hebraico.
  issues:
  - severity: medium
    issue: O segundo possessivo foi traduzido como «a sua casa» em vez de «a tua casa».
    rationale: O texto hebraico passa de בֵיתוֹ («sua casa», a casa de Baasa) para בֵיתְךָ («tua casa», dirigido a Baasa). Embora ambos se refiram na prática à mesma dinastia, a mudança de pessoa pertence à formulação do original e deve ser preservada.
  - severity: low
    issue: «Eliminarei» reduz a força aspectual de הִנְנִי מַבְעִיר.
    rationale: A fórmula «eis que eu estou...» expressa uma ação de juízo apresentada como iminente. «Estou prestes a eliminar» conserva melhor essa força sem tornar o português artificial.
  - severity: low
    issue: A paráfrase literal da nota, «o que vem depois de Baasa», não corresponde diretamente à sintaxe da expressão hebraica.
    rationale: A expressão contém literalmente o verbo «queimar/consumir» seguido de «após Baasa e após sua casa»; seu sentido idiomático é eliminar Baasa e sua linhagem. A nota deve distinguir a forma literal do sentido.
  revised_text: Eis que estou prestes a eliminar Baasa e a sua casa, e farei a tua casa como a casa de Jeroboão, filho de Nebate.[a]
  revised_footnotes:
