  text: הִנְ/נִ֥י מַבְעִ֛יר אַחֲרֵ֥י בַעְשָׁ֖א וְ/אַחֲרֵ֣י בֵית֑/וֹ וְ/נָֽתַתִּי֙ אֶת בֵּ֣יתְ/ךָ֔ כְּ/בֵ֖ית יָרָבְעָ֥ם בֶּן נְבָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: pt
  text: Eis que estou prestes a eliminar Baasa e a sua casa, e farei a tua casa como a casa de Jeroboão, filho de Nebate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «Eis que estou queimando/consumindo após Baasa e após a sua casa». A expressão hebraica é idiomática e significa que o SENHOR eliminará Baasa e a sua linhagem.'
    reason: alternativa lexical e esclarecimento do idioma hebraico
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz com solenidade e força profética o anúncio divino, em registro digno e corrente nas Escrituras.
- source_word: מַבְעִיר אַחֲרֵי
  choice: eliminarei
  rationale: A construção idiomática anuncia a remoção completa de Baasa e de sua linhagem. Uma tradução palavra por palavra, como «queimarei depois de», seria obscura em português.
- source_word: בַעְשָׁא
  choice: Baasa
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: בֵיתוֹ / בֵיתְךָ
  choice: a sua casa
  rationale: Preserva a imagem hebraica de «casa» e sua abrangência deliberada, que neste contexto inclui família, descendência e dinastia.
- source_word: וְנָתַתִּי
  choice: farei
  rationale: Nesta construção, נתן expressa tornar ou fazer que algo fique como outra coisa; «farei» é idiomático em português.
- source_word: כְּבֵית
  choice: como a casa de
  rationale: Expressa naturalmente a comparação marcada pela preposição hebraica כְּ.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Formas portuguesas tradicionais dos nomes, com pontuação natural para o patronímico.
theological_decisions:
- issue: Natureza do juízo contra a linhagem de Baasa
  choice: Expressar o resultado como eliminação total, sem afirmar que o fogo seja o mecanismo literal.
  alternative: «Consumirei o que vem depois de Baasa» ou «queimarei depois de Baasa».
  rationale: O idioma hebraico comunica o juízo divino abrangente contra Baasa e sua casa. «Eliminarei» torna esse sentido inteligível sem introduzir um modo literal de execução que o texto talvez não pretenda especificar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Eis que» conserva a solenidade profética; «casa» mantém a imagem hebraica e a ressonância dinástica. A nota preserva a forma mais literal e a tensão lexical do original.
