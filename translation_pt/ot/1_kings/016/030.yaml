  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: pt
  text: Acabe, filho de Onri, fez o que era mau aos olhos de Yahweh, mais do que todos os que vieram antes dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais do que todos os que o precederam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה, com הָרַע como objeto, forma a expressão hebraica habitual para praticar o mal; “fez” preserva essa construção de modo natural em português.
- source_word: הָרַע
  choice: o que era mau
  rationale: O adjetivo com artigo é substantivado (“o mal”); “o que era mau” comunica naturalmente a avaliação moral sem tornar a frase rígida.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém de perto o idioma hebraico que expressa a avaliação segundo a perspectiva de Yahweh e é claro em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: mais do que todos os que vieram antes dele
  rationale: O מן comparativo indica que Acabe superou os anteriores na prática do que era mau; a formulação preserva a referência temporal sem especificar além do que o verso diz.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama; “Yahweh” conserva o nome próprio, enquanto “SENHOR” o substitui por um título tradicional.
- issue: Identidade de “todos os que vieram antes dele”
  choice: manter a expressão abrangente do hebraico
  alternative: explicitar “todos os reis que o precederam”
  rationale: O contexto sugere reis anteriores, mas o verso não contém o substantivo “reis”; a tradução evita acrescentá-lo e preserva a amplitude formal da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “aos olhos de” preserva o colorido hebraico sem soar obscura; “vieram antes dele” é mais corrente do que “o precederam”, registrado como alternativa em nota.
