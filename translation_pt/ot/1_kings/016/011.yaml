reference: 1 Kings 16:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֨י בְ/מָלְכ֜/וֹ כְּ/שִׁבְתּ֣/וֹ עַל כִּסְא֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית בַּעְשָׁ֔א לֹֽא הִשְׁאִ֥יר ל֖/וֹ מַשְׁתִּ֣ין בְּ/קִ֑יר וְ/גֹאֲלָ֖י/ו וְ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: pt
  text: E aconteceu que, quando começou a reinar, assim que se assentou no trono, matou toda a casa de Baasa. Não deixou vivo para Baasa homem algum[a], nem nenhum de seus parentes próximos[b] ou amigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “quem urina contra a parede”, expressão grosseira que significa “homem do sexo masculino”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus vingadores” ou “seus resgatadores”. O termo hebraico designa um parente próximo com obrigações familiares.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva o marcador narrativo hebraico em português atual, sem recorrer à fórmula arcaica “e sucedeu”.
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: No contexto, a expressão situa a ação no início do reinado, isto é, na ascensão ao trono.
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: assim que se assentou no trono
  rationale: Expressa a sequência temporal imediata indicada pela construção e pelo contexto.
- source_word: הִכָּה
  choice: matou
  rationale: Embora o verbo possa significar “ferir” ou “golpear”, aqui a continuação deixa claro que se trata de violência letal.
- source_word: אֶת כָּל בֵּית בַּעְשָׁא
  choice: toda a casa de Baasa
  rationale: “Casa” conserva o sentido bíblico de família, linhagem ou dinastia, não de edifício.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: Não deixou vivo para Baasa
  rationale: Explicita naturalmente em português que ninguém foi poupado para dar continuidade à casa de Baasa, preservando o referente do pronome hebraico.
- source_word: מַשְׁתִּין בְּקִיר
  choice: homem algum
  rationale: Traduz o referente do idiomatismo hebraico grosseiro de modo claro e digno no texto principal; a formulação literal é registrada em nota.
- source_word: וְגֹאֲלָיו
  choice: seus parentes próximos
  rationale: O termo designa parentes com obrigações familiares, entre elas resgatar bens ou pessoas e vingar sangue. A escolha mantém o vínculo familiar sem fixar uma única função jurídica.
- source_word: וְרֵעֵהוּ
  choice: amigos
  rationale: É a equivalência mais direta para o termo, que também pode abranger companheiros ou aliados.
theological_decisions:
- issue: Amplitude de גֹאֵל no contexto da eliminação da casa de Baasa
  choice: parentes próximos
  alternative: vingadores; resgatadores
  rationale: O hebraico não determina aqui qual obrigação familiar está em primeiro plano. A tradução principal preserva a categoria de parentesco, e a nota mantém abertas as funções de resgate e vingança.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. Mantém-se “casa de Baasa” pelo valor dinástico tradicional. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
