  source_fidelity: O texto preserva corretamente a fórmula cronológica, o reinado de sete dias de Zinri em Tirza e a circunstância simultânea de o povo estar acampado contra Gibetom. “Reinou sete dias” é uma tradução fiel e idiomática de מָלַךְ com a duração expressa; não exige a expansão interpretativa “tornou-se rei”. “Contra Gibetom” transmite adequadamente a provável força militar de עַל sem especificar um cerco.
