base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: pt
  text: No vigésimo sétimo ano de Asa, rei de Judá, Zinri reinou sete dias em Tirza, enquanto o povo estava acampado contra Gibetom[a], que pertencia aos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto a Gibetom”. Neste contexto militar, “contra Gibetom” provavelmente indica que o povo estava acampado em oposição à cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: No vigésimo sétimo ano
  rationale: Reproduz de modo natural em português a fórmula hebraica de datação por ano de reinado.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: Preserva o sincronismo régio e apresenta o título em aposição idiomática.
- source_word: מָלַךְ ... שִׁבְעַת יָמִים
  choice: reinou sete dias
  rationale: Neste contexto, o verbo seguido da duração descreve de forma direta o período do reinado; esta formulação é mais natural em português do que 'tornou-se rei por sete dias'.
- source_word: בְּתִרְצָה
  choice: em Tirza
  rationale: Tradução locativa direta do hebraico.
- source_word: וְהָעָם חֹנִים
  choice: enquanto o povo estava acampado
  rationale: O particípio indica uma situação em curso; 'enquanto' expressa naturalmente o valor circunstancial da conjunção.
- source_word: עַל גִּבְּתוֹן
  choice: contra Gibetom
  rationale: Em contexto militar, עַל pode indicar oposição a uma cidade; evita-se 'sitiando', que seria mais específico que o texto.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: que pertencia aos filisteus
  rationale: Expressa com clareza a relação de posse ou associação indicada pelo ל sem acrescentar detalhes sobre a forma de controle.
