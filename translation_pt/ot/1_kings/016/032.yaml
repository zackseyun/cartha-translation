base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: pt
  text: Ele ergueu um altar a Baal na casa de Baal[a], que havia construído em Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo de Baal”. Em hebraico, literalmente, “casa de Baal”.
    reason: Alternativa lexical que esclarece a função cultual do edifício sem ocultar a formulação literal hebraica.
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ergueu
  rationale: O hifil de קום indica fazer ficar de pé, levantar ou estabelecer. “Ergueu” é natural em português para a construção ou instalação de um altar e permanece próximo da imagem hebraica.
- source_word: מִזְבֵּחַ
  choice: um altar
  rationale: Equivalente corrente e preciso de מִזְבֵּחַ, o lugar destinado a sacrifícios.
- source_word: לַבָּעַל
  choice: a Baal
  rationale: O לְ marca dedicação ou destinação; “um altar a Baal” expressa de modo idiomático que o altar foi dedicado à divindade.
- source_word: בֵּית הַבַּעַל
  choice: na casa de Baal
  rationale: Preserva literalmente a expressão hebraica “casa de Baal”, enquanto a nota esclarece que se trata do templo dedicado a Baal.
- source_word: אֲשֶׁר בָּנָה
  choice: que havia construído
  rationale: O mais-que-perfeito composto torna clara, em português, a anterioridade da construção da casa em relação ao levantamento do altar. O sujeito masculino singular é recuperado do contexto imediato.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: Forma portuguesa convencional do topônimo; a preposição בְּ indica localização.
theological_decisions:
- issue: Sentido de בֵּית הַבַּעַל
  choice: casa de Baal
  alternative: templo de Baal
  rationale: “Casa de Baal” conserva a formulação e a metáfora arquitetônico-religiosa do hebraico. Como a expressão designa funcionalmente um templo, essa alternativa é registrada em nota sem substituir silenciosamente a linguagem da fonte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Ergueu” mantém concisão narrativa; “casa de Baal” preserva a transparência lexical do hebraico, acompanhada de nota explicativa.
