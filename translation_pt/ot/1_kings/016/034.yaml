  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: pt
  text: Nos seus dias, Hiel, de Betel, reconstruiu Jericó[a]. Ao custo de Abirão, seu primogênito, lançou os alicerces da cidade; e, ao custo de Segube, seu filho mais novo, instalou os portões[b], conforme a palavra de Yahweh, que ele havia falado por meio de Josué, filho de Num.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «construiu Jericó». «Reconstruiu» reflete o contexto de que Jericó havia sido destruída anteriormente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «com/em Abirão, seu primogênito... e com/em Segube, seu mais novo». O sentido parece ser que a reconstrução custou a vida desses filhos, em cumprimento de Josué 6:26.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Nos seus dias
  rationale: Preserva a expressão temporal hebraica e a referência ao período do rei mencionado anteriormente, em português claro.
- source_word: בָּנָה
  choice: reconstruiu
  rationale: O verbo significa literalmente «construiu», mas o contexto histórico de Jericó como cidade anteriormente destruída favorece «reconstruiu»; a forma literal é registrada em nota.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: Hiel, de Betel
  rationale: A expressão gentílica indica procedência ou associação com Betel; «de Betel» é natural e evita um gentílico pouco corrente.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: Ao custo de Abirão, seu primogênito
  rationale: No eco de Josué 6:26, a preposição בְּ indica que a fundação implicou a perda do primogênito; a nota preserva a formulação hebraica mais literal.
- source_word: יִסְּדָהּ
  choice: lançou os alicerces da cidade
  rationale: Expressa naturalmente o ato de fundar ou assentar os alicerces, tornando inequívoco que o pronome feminino hebraico se refere a Jericó.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: e, ao custo de Segube, seu filho mais novo
  rationale: Mantém o paralelismo com a perda do primogênito e explicita a relação familiar implícita em «seu mais novo».
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: instalou os portões
  rationale: Em contexto urbano, דְּלָתוֹת designa as portas ou folhas dos portões da cidade; «instalou os portões» é idiomático e concreto.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Reproduz a fórmula de cumprimento e representa diretamente o nome divino יהוה, seguindo a camada inglesa fornecida e preservando sua especificidade.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: que ele havia falado por meio de
  rationale: בְּיַד é uma expressão de agência profética; «por meio de» comunica isso naturalmente sem a tradução rígida «pela mão de».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Forma portuguesa convencional do nome e do patronímico.
theological_decisions:
- issue: Natureza do cumprimento da maldição envolvendo os filhos de Hiel
  choice: A reconstrução ocorreu ao custo da vida do primogênito e do filho mais novo de Hiel, cumprindo a palavra transmitida por Josué.
  alternative: Ler as expressões mais literalmente como etapas da obra que apenas coincidiram com os filhos, sem afirmar diretamente sua morte.
  rationale: A formulação repete a ordem das etapas e dos filhos em Josué 6:26, apontando naturalmente para o cumprimento da maldição. «Ao custo de» comunica a perda sem acrescentar a maneira pela qual morreram.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o paralelismo solene do hebraico sem soar arcaica; «filho mais novo» evita a possível leitura de que «seu mais novo» qualifique algo que não seja a relação familiar.
