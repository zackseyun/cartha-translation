base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: pt
  text: Mas o povo que seguia Onri prevaleceu sobre o povo que seguia Tibni, filho de Ginate. Então Tibni morreu, e Onri tornou-se rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: prevaleceu sobre
  rationale: O verbo חזק, nesta construção com אֶת, expressa superioridade sobre o grupo rival. “Prevaleceu sobre” comunica de modo natural que a facção de Onri levou a melhor no conflito, sem especificar além do hebraico como isso ocorreu.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: o povo que seguia Onri
  rationale: Neste contexto de disputa política, אַחֲרֵי indica apoio ou lealdade. “Que seguia Onri” mantém a imagem do hebraico e é claro em português moderno.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: sobre o povo que seguia Tibni
  rationale: A construção apresenta a facção de Tibni como aquela sobre a qual os partidários de Onri prevaleceram. A repetição de “o povo que seguia” preserva o paralelismo do original.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: Tibni, filho de Ginate
  rationale: Os nomes são transliterados em formas naturais para leitores de português; בֶן é vertido pela identificação genealógica usual “filho de”.
- source_word: וַיָּמָת תִּבְנִי
  choice: Então Tibni morreu
  rationale: O waw consecutivo faz a narrativa avançar. “Então” preserva a sequência dos acontecimentos sem afirmar explicitamente uma relação causal que o texto não detalha.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: Onri tornou-se rei
  rationale: Aqui מלך marca a ascensão de Onri ao reinado depois da morte do rival. “Tornou-se rei” expressa essa mudança de condição com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas onomásticas correntes em português (“Onri”, “Tibni”, “Ginate”). A sintaxe conserva o paralelismo entre as duas facções e evita explicitar a causa ou as circunstâncias da morte de Tibni, que o hebraico não informa.
