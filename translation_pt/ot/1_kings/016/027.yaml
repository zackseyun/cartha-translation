base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Quanto aos demais atos de Onri, a tudo o que ele fez e ao poder que demonstrou[a], não estão escritos no Livro dos Anais dos Reis de Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e aos seus feitos poderosos”. O termo hebraico pode se referir tanto ao poder ou à força quanto aos atos que os manifestam.'
    reason: lexical_alternative
  - marker: b
    text: O “Livro dos Anais dos Reis de Israel” era uma fonte de registros reais, não o livro bíblico de Crônicas.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: Quanto aos demais atos de Onri
  rationale: A expressão formulaica introduz o restante do registro do reinado. “Quanto aos demais atos” transmite naturalmente a transição e usa “atos” no sentido contextual de feitos ou acontecimentos do governo.
- source_word: אֲשֶׁר עָשָׂה
  choice: ao que ele fez
  rationale: Mantém a oração relativa resumindo as ações de Onri, sem eliminar a repetição presente no hebraico.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: e ao poder que demonstrou
  rationale: גְּבוּרָה pode indicar força, poder ou feitos poderosos. A formulação conserva o substantivo e expressa idiomaticamente a ideia de poder manifestado em ações.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica hebraica, que espera resposta afirmativa, e mantém a imagem explícita da escrita.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: no Livro dos Anais
  rationale: Neste contexto arquivístico, עַל סֵפֶר equivale idiomaticamente a “no livro”. דִּבְרֵי הַיָּמִים designa registros analísticos; “Anais” evita confusão imediata com o livro bíblico de Crônicas.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: 'O לְ indica aqui relação ou pertencimento: os anais referentes aos reis de Israel.'
