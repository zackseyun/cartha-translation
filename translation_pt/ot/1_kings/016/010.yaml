base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: pt
  text: Então Zinri entrou, feriu-o e o matou, no vigésimo sétimo ano de Asa, rei de Judá; e reinou em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... entrou
  rationale: O verbo בוא pode significar “vir” ou “entrar”. No contexto do assassinato, “entrou” expressa naturalmente a chegada ao local, enquanto “Então” representa a progressão narrativa do waw consecutivo.
- source_word: זִמְרִי
  choice: Zinri
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: וַיַּכֵּהוּ
  choice: feriu-o
  rationale: נכה significa golpear ou ferir. “Feriu-o” preserva a distinção entre o golpe e o verbo seguinte, que declara explicitamente a morte.
- source_word: וַיְמִיתֵהוּ
  choice: e o matou
  rationale: No hifil, מות significa causar a morte, isto é, matar. A formulação é direta e natural em português moderno.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע
  choice: no vigésimo sétimo ano
  rationale: É a forma portuguesa convencional para a datação por ano de reinado.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: A preposição ל indica aqui o reinado usado como referência cronológica. As vírgulas tornam claro que “rei de Judá” identifica Asa.
- source_word: וַיִּמְלֹךְ
  choice: e reinou
  rationale: מלך pode significar “reinar” ou “tornar-se rei”. “Reinou” mantém a escolha verbal hebraica, e a expressão seguinte comunica a sucessão.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Em contexto de sucessão régia, תחתיו indica que alguém assume o lugar de outro. A tradução conserva de modo transparente a expressão hebraica.
