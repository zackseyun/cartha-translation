  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Elá e tudo o que ele fez não estão escritos no Livro das Crônicas dos Reis de Israel[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Livro dos Anais dos Reis de Israel».'
    reason: Registra a alternativa lexical «Anais» para דִּבְרֵי הַיָּמִים, expressão que pode designar registros históricos oficiais.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: Os demais atos de Elá
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula régia, refere-se aos atos ou feitos do rei. O וְ inicial liga a frase ao contexto sem exigir um marcador temporal como «agora».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta e natural da oração relativa, preservando o sentido amplo de עָשָׂה.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica que espera resposta afirmativa e conserva a imagem documental do particípio passivo כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל seja literalmente «sobre», em português o conteúdo consta «no» livro. A inicial maiúscula assinala o título de um registro específico.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: das Crônicas dos Reis de Israel
  rationale: דִּבְרֵי הַיָּמִים designa aqui um registro histórico ou analístico; «Crônicas» preserva a formulação tradicional e inteligível, enquanto לְ indica a relação do registro com os reis de Israel.
