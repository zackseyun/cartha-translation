  text: Then Omri and all Israel with him went up from Gibbethon[a], and they laid siege to Tirzah.
translation:
  language: pt
  text: Então Onri subiu de Gibetom com todo o Israel, e sitiaram Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: subiram
  rationale: O verbo עלה expressa subir ou avançar para um lugar. O plural é natural em português porque inclui Onri e todo o Israel, sem acrescentar a ideia mais específica de uma marcha militar.
- source_word: עָמְרִי
  choice: Onri
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: e todo o Israel que estava com ele
  rationale: Preserva o coletivo nacional “Israel” e explicita de modo natural em português que ele acompanhava Onri.
- source_word: מִגִּבְּתוֹן
  choice: de Gibetom
  rationale: Transliteração tradicional portuguesa do topônimo, com a preposição de origem מן.
- source_word: וַיָּצֻרוּ
  choice: cercaram
  rationale: No contexto militar, צור significa sitiar ou cercar uma cidade. “Cercaram” é claro, natural e mantém o sentido de cerco.
- source_word: עַל תִּרְצָה
  choice: Tirza
  rationale: Com o verbo “cercar”, o alvo é objeto direto em português; Tirza é a forma tradicional portuguesa do topônimo.
