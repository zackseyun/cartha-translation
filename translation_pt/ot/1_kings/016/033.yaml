  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: pt
  text: Acabe também fez a Aserá[a] e continuou a fazer ainda mais para provocar a ira de Yahweh, o Deus de Israel, do que todos os reis de Israel que vieram antes dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o poste de Aserá”. O termo hebraico אֲשֵׁרָה pode referir-se à deusa Aserá ou ao objeto cultual associado a ela.'
    reason: Leitura alternativa que esclarece a ambiguidade lexical do hebraico.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Traduz diretamente o sentido comum de עשה, “fazer”. Embora “erigiu” seja possível no contexto cultual, seria mais específico do que o verbo hebraico.
- source_word: הָאֲשֵׁרָה
  choice: a Aserá
  rationale: Mantém o termo hebraico e preserva a possível referência tanto à deusa Aserá quanto ao objeto cultual associado a ela.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: continuou a agir
  rationale: A construção יסף + infinitivo indica continuação ou acréscimo. “Continuou a agir” é natural em português e, com a comparação posterior, comunica a escalada das ações de Acabe.
- source_word: לְהַכְעִיס
  choice: para provocar a ira de
  rationale: O hifil de כעס expressa causar ira. A formulação explicita o valor causativo de modo claro e idiomático.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta, em aposição a Yahweh.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: mais do que todos os reis de Israel
  rationale: O מִן comparativo indica que as ações de Acabe excederam as dos reis israelitas anteriores.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: que vieram antes dele
  rationale: Expressa com clareza, em português atual, que esses reis o precederam.
theological_decisions:
- issue: Referente de אֲשֵׁרָה
  choice: Manter “a Aserá” sem decidir se se trata da deusa ou de seu objeto cultual.
  alternative: “o poste de Aserá” ou “Aserá”, entendida explicitamente como a deusa
  rationale: O termo hebraico pode designar a divindade ou a representação cultual associada a ela. O contexto imediato não resolve inequivocamente a referência, por isso a tradução conserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Aserá” segue a forma portuguesa usual do nome; “provocar a ira de” evita a possível leitura incompleta de “provocar Yahweh” e preserva o sentido causativo.
