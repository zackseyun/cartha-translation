  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: pt
  text: Assim, Salomão expulsou Abiatar do sacerdócio de Yahweh, cumprindo[a] a palavra que Yahweh havia falado contra a casa de Eli[b], em Siló.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fim de cumprir a palavra de Yahweh”. O hebraico pode indicar propósito ou resultado.'
    reason: alternative_reading
  - marker: b
    text: Veja 1 Samuel 2:27–36 e 3:11–14 sobre a palavra pronunciada contra a casa de Eli.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: expulsou
  rationale: O verbo גרשׁ indica expulsar ou afastar à força; “expulsou” conserva a intensidade e é natural em português.
- source_word: מִהְיוֹת כֹּהֵן לַיהוָה
  choice: do sacerdócio de Yahweh
  rationale: A construção com מִן mais o infinitivo de היה descreve a remoção de Abiatar de sua função ou condição sacerdotal. A formulação portuguesa evita o pouco natural “de ser sacerdote” sem perder o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לְמַלֵּא
  choice: cumprindo
  rationale: O infinitivo com לְ pode indicar propósito ou resultado. O gerúndio apresenta a ação como cumprimento da palavra anterior sem definir de modo rígido a intenção subjetiva de Salomão.
- source_word: דְּבַר יְהוָה אֲשֶׁר דִּבֶּר
  choice: a palavra que Yahweh havia falado
  rationale: “Palavra” é apropriado para o pronunciamento divino, e o mais-que-perfeito composto deixa clara a anterioridade dessa fala.
- source_word: עַל בֵּית עֵלִי
  choice: contra a casa de Eli
  rationale: Embora עַל possa significar “a respeito de”, o contexto é um pronunciamento de juízo; “contra” torna explícita essa força contextual sem acrescentar conteúdo estranho.
- source_word: בְּשִׁלֹה
  choice: em Siló
  rationale: Tradução locativa direta e idiomática da preposição בְּ com o nome do lugar.
theological_decisions:
- issue: Relação entre a ação de Salomão e a palavra divina
  choice: “cumprindo”, preservando a leitura de resultado sem excluir propósito
  alternative: “a fim de cumprir”, que apresenta a oração mais estritamente como propósito
  rationale: לְמַלֵּא admite valor de propósito ou resultado. O texto principal evita atribuir a Salomão uma intenção interior que o relato não declara de maneira inequívoca, enquanto a nota conserva a alternativa.
- issue: Natureza da palavra acerca da casa de Eli
  choice: “contra a casa de Eli”
  alternative: “a respeito da casa de Eli”
  rationale: O contexto de 1 Samuel 2:27–36 e 3:11–14 mostra que se trata de uma palavra de juízo. “Contra” comunica essa orientação, embora a preposição isoladamente também possa ser mais neutra.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Do sacerdócio” exprime naturalmente a destituição da função. Os marcadores aparecem junto às expressões que esclarecem.
