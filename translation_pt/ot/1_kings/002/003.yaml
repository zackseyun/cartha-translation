  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: pt
  text: 'Cumpra o que Yahweh, seu Deus, requer de você: ande nos caminhos dele e guarde os seus estatutos, mandamentos, juízos e testemunhos, conforme está escrito na Lei de Moisés, para que você aja com sabedoria[a] em tudo o que fizer e aonde quer que se dirigir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenha êxito” ou “prospere”. O verbo hebraico pode enfatizar tanto a conduta sábia como o êxito que dela resulta.'
    reason: Alternativa lexical para תַּשְׂכִּיל, cuja amplitude semântica inclui agir prudentemente e ser bem-sucedido.
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: Cumpra o que ... requer de você
  rationale: A construção exortativa ordena que Salomão cumpra um dever confiado a ele. Esta formulação comunica naturalmente em português o sentido de obrigação ou encargo, sem reduzir o verbo a mera observação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: ande nos caminhos dele
  rationale: Preserva a metáfora hebraica de conduta como caminhada e esclarece que os caminhos pertencem a Yahweh.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: os seus estatutos, mandamentos, juízos e testemunhos
  rationale: Mantém os quatro termos jurídicos e pactuais distintos, usando equivalentes reconhecíveis em português bíblico atual.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: na Lei de Moisés
  rationale: No contexto do corpus escrito mosaico, esta é a expressão portuguesa mais clara e estabelecida, embora תּוֹרָה também possa significar instrução.
- source_word: תַּשְׂכִּיל
  choice: aja com sabedoria
  rationale: O hifil de שׂכל pode indicar conduta prudente e também o bom êxito decorrente dela. A tradução principal destaca a ação sábia sem eliminar a nuance de sucesso, registrada em nota.
- source_word: כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: aonde quer que se dirigir
  rationale: Reproduz de modo idiomático a ideia espacial e figurada de voltar-se ou seguir em determinada direção.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. A transliteração preserva essa forma e evita substituí-la por um título.
- issue: Relação entre sabedoria e êxito em לְמַעַן תַּשְׂכִּיל
  choice: para que você aja com sabedoria
  alternative: para que você tenha êxito; para que você prospere
  rationale: A escolha conserva o foco possível na conduta prudente, enquanto a nota reconhece que o verbo também pode apontar para o êxito resultante. Assim, não se impõe ao texto uma promessa geral de prosperidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa é expressa por “você”, adequada ao discurso direto atual; a terminologia pactual e jurídica permanece deliberadamente distinta. O marcador [a] foi colocado junto à expressão que ele esclarece.
