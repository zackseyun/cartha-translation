base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: pt
  text: 'Então o rei lhe disse: “Faça como ele disse: mate-o[a] e sepulte-o. Assim, você removerá de mim e da casa de meu pai o sangue inocente[b] que Joabe derramou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ataque-o”. O verbo hebraico pode indicar atacar ou golpear alguém e, neste contexto, refere-se à sua execução.
    reason: lexical_alternative
  - marker: b
    text: “Sangue inocente” é uma expressão jurídico-moral hebraica para o sangue derramado sem justa causa, que traz culpa sobre os responsáveis.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: Faça como ele falou
  rationale: Expressa de modo direto e natural a ordem para cumprir o que Joabe acabara de dizer, sem tornar explícito além do hebraico quem é o referente.
- source_word: וּפְגַע בּוֹ
  choice: fira-o de morte
  rationale: פגע com ב pode indicar atacar ou golpear com resultado letal. A formulação comunica claramente a execução ordenada, preservando algo da imagem verbal em vez de reduzi-la simplesmente a “mate-o”.
- source_word: וּקְבַרְתּוֹ
  choice: e sepulte-o
  rationale: Reproduz a ordem sequencial de maneira concisa e digna.
- source_word: וַהֲסִירֹתָ
  choice: Assim, você removerá
  rationale: A forma verbal após os imperativos pode apresentar a consequência ou finalidade das ações. “Assim” conserva essa relação sem convertê-la inequivocamente numa oração de propósito.
- source_word: דְּמֵי חִנָּם
  choice: o sangue inocente
  rationale: Mantém a expressão concreta hebraica para sangue derramado sem justa causa, incluindo sua dimensão jurídico-moral.
- source_word: שָׁפַךְ
  choice: derramou
  rationale: Equivalente português tradicional e natural para o derramamento violento de sangue.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: de mim e da casa de meu pai
  rationale: Comunica naturalmente a retirada da culpa de sangue que repousa sobre uma pessoa e sua casa, sem substituir a imagem hebraica por uma abstração.
theological_decisions:
- issue: Responsabilidade pelo sangue inocente ligada ao rei e à casa de seu pai
  choice: Manter a imagem de remover deles “o sangue inocente” derramado por Joabe.
  alternative: Explicitar como “remover a culpa pelo sangue derramado”.
  rationale: O hebraico fala concretamente do sangue inocente sendo removido de sobre Salomão e a casa de seu pai. A tradução preserva a tensão entre o ato de Joabe e a responsabilidade vinculada à casa real, sem impor uma explicação doutrinária.
- issue: Relação entre a execução de Joabe e a remoção do sangue inocente
  choice: Traduzir וַהֲסִירֹתָ por “Assim, você removerá”.
  alternative: “para que você remova” ou simplesmente “e remova”.
  rationale: “Assim” permite perceber resultado ou finalidade sem decidir rigidamente entre essas nuances possíveis na sequência verbal hebraica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sepulte-o” mantém registro solene sem soar arcaico; “você removerá” evita a ambiguidade regional de formas verbais sem pronome. Os marcadores foram posicionados junto às expressões que explicam.
