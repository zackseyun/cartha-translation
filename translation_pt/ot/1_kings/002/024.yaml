id: 1KI.2.24
reference: 1 Kings 2:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: pt
  text: E agora, tão certo como vive Yahweh, que me estabeleceu e me fez sentar no trono de Davi, meu pai, e que fez para mim uma casa[a], conforme prometeu, certamente Adonias será morto hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estabeleceu para mim uma dinastia”. Aqui, “casa” provavelmente se refere à linhagem real duradoura, não a um edifício.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: tão certo como vive Yahweh
  rationale: Expressa em português natural a fórmula hebraica de juramento, preservando tanto sua força solene quanto o nome divino explícito.
- source_word: הֱכִינַנִי
  choice: me estabeleceu
  rationale: O hifil de כון comunica a ideia de firmar, confirmar ou estabelecer; no contexto, refere-se à consolidação de Salomão como rei.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: me fez sentar no trono
  rationale: Preserva com clareza o valor causativo do hifil de ישׁב e comunica a entronização.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: o trono de Davi, meu pai
  rationale: Reproduz naturalmente a relação do construto hebraico e evita que 'meu pai' pareça modificar 'trono'.
- source_word: עָשָׂה לִי בַּיִת
  choice: fez para mim uma casa
  rationale: Mantém a imagem literal de 'casa' e seus vínculos com a promessa davídica, sem eliminar o provável sentido dinástico; este é esclarecido em nota.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: conforme prometeu
  rationale: Embora דִּבֵּר signifique literalmente 'falou', o contexto da palavra divina assumida como compromisso favorece 'prometeu'.
- source_word: כִּי
  choice: certamente
  rationale: Neste juramento, כִּי introduz enfaticamente a declaração de Salomão; 'certamente' transmite esse valor asseverativo.
- source_word: יוּמַת
  choice: será morto
  rationale: O hofal de מות é passivo-causativo e indica que Adonias será levado à morte, não simplesmente que morrerá.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua ocorrência explícita no hebraico.
theological_decisions:
- issue: Sentido de בַּיִת na linguagem régia da promessa davídica
  choice: Conservar 'casa' no texto principal e explicar em nota o provável sentido de linhagem dinástica.
  alternative: Traduzir diretamente como 'dinastia' ou 'casa real'.
  rationale: O contexto favorece o sentido dinástico, mas a imagem concreta de 'casa' é parte da formulação hebraica e estabelece ligações intertextuais importantes. A nota preserva a clareza sem resolver excessivamente a polissemia.
translation_notes:
  register: Português moderno, solene e acessível, com sintaxe adequada a uma declaração régia sob juramento. O nome divino é transliterado como “Yahweh”; a ambiguidade teologicamente relevante de “casa” é preservada no texto e esclarecida em nota.
