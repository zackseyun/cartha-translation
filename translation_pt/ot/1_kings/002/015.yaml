source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: pt
  text: 'E ele disse: “Você sabe que o reino era meu e que todo Israel tinha os olhos voltados para mim, para que eu reinasse[a]. Mas o reino mudou de rumo e passou para meu irmão, pois lhe veio de Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo Israel havia posto o rosto sobre mim para eu reinar”; isto é, voltava-se para mim ou esperava que eu reinasse.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois era dele da parte de Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: o reino
  rationale: No contexto da sucessão real, designa o governo ou a dignidade régia. “O reino” é natural em português e mantém a formulação concreta do hebraico.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: todo o Israel esperava que eu reinasse
  rationale: Traduz naturalmente o idioma hebraico de dirigir ou pôr o rosto sobre alguém, que aqui expressa expectativa ou orientação política, sem reproduzir uma imagem pouco idiomática em português.
- source_word: לִמְלֹךְ
  choice: que eu reinasse
  rationale: Expressa o exercício da realeza e se encaixa naturalmente após “esperava”.
- source_word: וַתִּסֹּב
  choice: mudou de mãos
  rationale: Comunica a reversão e transferência da realeza de modo corrente, preservando a ideia de mudança de rumo sem especificar um agente.
- source_word: וַתְּהִי לְאָחִי
  choice: passou a meu irmão
  rationale: Conserva a ideia de transferência para o irmão de Adonias, sem acrescentar que ele a tomou ou recebeu por uma ação explicitamente descrita.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: pois lhe veio de Yahweh
  rationale: Preserva a procedência divina indicada por מֵיְהוָה e evita acrescentar um verbo explícito como “dar”, ausente do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אָחִי
  choice: meu irmão
  rationale: Tradução direta do termo familiar, que se refere a Salomão na fala de Adonias.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título; “Yahweh” o representa diretamente e evita a substituição interpretativa por “SENHOR”.
- issue: Grau de explicitação da ação divina na cláusula final
  choice: pois lhe veio de Yahweh
  alternative: pois Yahweh o deu a ele; pois era dele por vontade de Yahweh
  rationale: A construção hebraica afirma que o reino lhe pertencia ou lhe veio da parte de Yahweh, mas não contém um verbo explícito de dar. A tradução mantém essa tensão e a origem divina sem tornar mais específica a ação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “você” reflete o singular feminino אַתְּ dirigido a Bate-Seba. A expressão “mudou de mãos” torna natural a metáfora de reversão, enquanto as notas preservam o idioma hebraico e a ambiguidade da cláusula final.
