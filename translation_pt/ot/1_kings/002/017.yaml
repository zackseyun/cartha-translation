base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: pt
  text: 'E ele disse: “Por favor, peça ao rei Salomão, pois ele não recusará o seu pedido[a], e que ele me dê Abisague, a sunamita, como esposa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ele não fará voltar o seu rosto”, um idiomatismo hebraico que significa “ele não recusará você” ou “ele não negará o seu pedido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Por favor, fale
  rationale: O imperativo feminino singular com נָא formula um pedido cortês dirigido a Bate-Seba; a expressão é natural e atual em português.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: com o rei Salomão
  rationale: Em português, “falar com alguém” expressa naturalmente a intercessão solicitada, e o título antes do nome segue o uso corrente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual Bate-Seba deve apresentar o pedido.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: ele não recusará o seu pedido
  rationale: Traduz o sentido contextual do idioma hebraico, literalmente relacionado a fazer voltar o rosto de alguém, sem sugerir que Salomão recusaria a própria pessoa.
- source_word: וְיִתֶּן לִי
  choice: para que ele me dê
  rationale: No encadeamento do pedido, o verbo expressa o conteúdo da solicitação que Bate-Seba deve apresentar a Salomão.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abisague, a sunamita
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecível do nome, com o gentílico feminino em português.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: A construção indica casamento; esta formulação é clara e preserva o sentido sem acrescentar detalhes.
