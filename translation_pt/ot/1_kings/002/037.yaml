base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: pt
  text: Pois, no dia em que você sair e atravessar o vale do Cedrom[a], saiba com certeza que certamente morrerá; o seu sangue estará sobre a sua própria cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atravessar o ribeiro do Cedrom”. A palavra hebraica pode indicar um vale, uma ravina, um uádi ou um curso de água sazonal.'
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que significa que você próprio será responsável por sua morte.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Pois, no dia em que
  rationale: A construção introduz solenemente a condição e sua consequência. A formulação preserva a expressão temporal hebraica e soa natural em português.
- source_word: צֵאתְךָ
  choice: você sair
  rationale: O infinitivo construto com sufixo indica o ato de Simei sair da área à qual estava restrito.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: e atravessar o vale do Cedrom
  rationale: נחל pode designar vale, ravina, uádi ou curso de água sazonal. “Vale do Cedrom” é uma designação geográfica clara e corrente; a alternativa é registrada em nota.
- source_word: יָדֹעַ תֵּדַע
  choice: saiba com certeza
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a declaração, expressando certeza enfática.
- source_word: כִּי מוֹת תָּמוּת
  choice: que morrerá sem falta
  rationale: A construção com infinitivo absoluto enfatiza a certeza da morte. “Sem falta” conserva a força solene sem reproduzir de modo artificial a repetição hebraica.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: o seu sangue cairá sobre a sua própria cabeça
  rationale: Mantém a imagem jurídica hebraica e explicita naturalmente que a responsabilidade pela morte recairá sobre o próprio transgressor.
theological_decisions:
- issue: Fórmula jurídica de sangue e responsabilidade pessoal
  choice: Manter no texto a imagem “o seu sangue cairá sobre a sua própria cabeça”.
  alternative: “Você será responsável pela sua própria morte.”
  rationale: A expressão é uma fórmula de culpabilidade e responsabilidade pela consequência fatal. Preservar a metáfora mantém a força jurídica e moral do hebraico sem impor interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” comunica diretamente a segunda pessoa singular; “morrerá sem falta” conserva a ênfase solene das construções hebraicas.
