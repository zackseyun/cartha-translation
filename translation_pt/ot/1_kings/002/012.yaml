id: 1KI.2.12
reference: 1 Kings 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: pt
  text: Salomão ocupou o trono de Davi, seu pai, e seu reino ficou muito bem estabelecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu reinado ficou muito seguro” ou “seu poder real ficou firmemente estabelecido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: ocupou
  rationale: No contexto de sucessão real e com a expressão “sobre o trono”, o verbo indica que Salomão passou a ocupar o trono. “Ocupou” conserva a ideia concreta e soa natural em português.
- source_word: כִּסֵּא
  choice: trono
  rationale: O contexto régio e a sucessão davídica exigem o sentido específico de “trono”, não o genérico “assento”.
- source_word: אָבִיו
  choice: seu pai
  rationale: Davi é o pai literal de Salomão; não há razão contextual para traduzir como “antepassado”.
- source_word: וַתִּכֹּן
  choice: ficou ... estabelecido
  rationale: O nifal de כון comunica o estado resultante de algo tornado firme ou seguro. “Ficou estabelecido” reproduz esse valor passivo-resultativo em português corrente.
- source_word: מַלְכֻתוֹ
  choice: seu reino
  rationale: מַלְכוּת pode significar reino, reinado ou poder régio. “Seu reino” mantém a amplitude lexical do hebraico, embora “seu reinado” também seja possível neste contexto.
- source_word: מְאֹד
  choice: muito bem
  rationale: O advérbio intensifica o predicado. “Muito bem estabelecido” expressa de modo natural a força de מְאֹד sem reduzir a intensidade.
theological_decisions:
- issue: A linguagem de sucessão real ligada ao trono de Davi
  choice: Apresentar o versículo como relato histórico da entronização de Salomão e da consolidação de seu reino.
  alternative: Empregar linguagem teologicamente mais carregada que destaque a legitimidade dinástica ou implicações messiânicas posteriores.
  rationale: O versículo afirma diretamente a sucessão de Salomão e a firme consolidação de sua autoridade, mas não explicita desenvolvimentos messiânicos posteriores. A tradução não os introduz.
- issue: Amplitude de מַלְכוּת
  choice: “seu reino” no texto principal, com alternativas em nota
  alternative: “seu reinado” ou “seu poder real”
  rationale: O termo hebraico admite o domínio régio, o exercício do governo ou o reino. A opção principal preserva a formulação tradicional e ampla, enquanto a nota mantém visível a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ocupou o trono” é mais idiomático que o literal “sentou-se sobre o trono”. A nota preserva as possibilidades semânticas de מַלְכוּת e כון.
