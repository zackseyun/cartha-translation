base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: pt
  text: 'O rei Salomão respondeu e disse à sua mãe: “Por que você está pedindo Abisague, a sunamita, para Adonias? Peça também para ele o reino[a], pois ele é meu irmão mais velho — e para ele, para o sacerdote Abiatar e para Joabe, filho de Zeruia!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a realeza” ou “o trono”. O termo hebraico pode indicar o domínio real em sentido amplo; neste contexto, o pedido pelo reino implica a pretensão à autoridade régia.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu e disse
  rationale: Conserva os dois verbos da fórmula narrativa hebraica sem lhes acrescentar conteúdo.
- source_word: לְאִמּוֹ
  choice: à sua mãe
  rationale: Traduz somente o que o versículo explicita, sem inserir o nome de Bate-Seba a partir do contexto.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Abisague, a sunamita
  rationale: Emprega as formas portuguesas tradicionais e inteligíveis do nome e do gentílico.
- source_word: וְשַׁאֲלִי לוֹ
  choice: Peça também para ele
  rationale: O imperativo dá continuidade irônica ao pedido, e “também” expressa sua força aditiva.
- source_word: הַמְּלוּכָה
  choice: a realeza
  rationale: No contexto, designa a condição e autoridade régias reivindicadas, não apenas um território; a nota preserva as alternativas lexicais.
- source_word: אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: meu irmão mais velho
  rationale: Expressa de modo corrente a precedência etária indicada literalmente pelo hebraico.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: — para ele, para o sacerdote Abiatar e para Joabe, filho de Zeruia!
  rationale: Mantém a construção elíptica e a enumeração enfática dos beneficiários ou aliados, usando o travessão para marcar a adição abrupta.
theological_decisions:
- issue: Implicação político-dinástica do pedido por Abisague
  choice: Traduzir הַמְּלוּכָה como “a realeza”, tornando explícita, como faz o hebraico, a ligação que Salomão estabelece com o direito de reinar.
  alternative: “o reino” ou “o trono”
  rationale: “Realeza” abrange a dignidade e a autoridade régias sem reduzir o termo ao território nem substituir a ideia pela metonímia do trono.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” na fala familiar dirigida à mãe, conserva a fórmula narrativa hebraica e mantém a elipse e a indignação retórica do final.
