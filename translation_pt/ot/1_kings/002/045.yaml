  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: pt
  text: Mas o rei Salomão será abençoado[a], e o trono de Davi será estabelecido diante de Yahweh para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o rei Salomão é abençoado». O predicado hebraico pode ser entendido como uma declaração presente, embora o contexto também favoreça a tradução voltada para o futuro adotada no texto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: Mas o rei Salomão
  rationale: A conjunção וְ assume valor contrastivo no contexto, contrapondo a condenação de Simei à bênção de Salomão; «rei Salomão» traduz naturalmente a expressão hebraica.
- source_word: בָּרוּךְ
  choice: será abençoado
  rationale: O predicado hebraico significa «abençoado». Embora a oração nominal possa indicar estado presente, seu paralelismo com a oração seguinte, de orientação futura, favorece «será abençoado».
- source_word: וְ/כִסֵּא דָוִד
  choice: e o trono de Davi
  rationale: Mantém a coordenação e reproduz diretamente a relação construta entre «trono» e «Davi».
- source_word: יִהְיֶה נָכוֹן
  choice: será firmado
  rationale: A combinação verbal expressa a ideia de ficar estabelecido, seguro ou firme. «Será firmado» é natural em português e adequado ao contexto dinástico.
- source_word: לִ/פְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: «Diante de» preserva o sentido espacial e relacional de לִפְנֵי; o nome divino é transliterado como «Yahweh».
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português claro e corrente para a duração indefinida ou perpétua expressa pela locução hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; «Yahweh» preserva o nome próprio e segue a orientação do projeto sem substituí-lo por um título.
- issue: Valor temporal de בָּרוּךְ
  choice: 'futuro: «será abençoado»'
  alternative: 'presente: «é abençoado»'
  rationale: A forma hebraica, isoladamente, admite uma declaração presente. Contudo, o contexto judicial e sua associação com «será firmado» sustentam a leitura prospectiva, sem eliminar a alternativa legítima, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e o contraste do hebraico, bem como a ambiguidade temporal de בָּרוּךְ por meio da nota.
