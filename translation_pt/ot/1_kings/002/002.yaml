base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/002.yaml
  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: pt
  text: Vou pelo caminho de toda a terra. Portanto, seja forte e seja homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mostre-se homem” ou “porte-se como homem”. A expressão hebraica associa o ser homem a agir com coragem e responsabilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי הֹלֵךְ
  choice: Eu estou seguindo
  rationale: O pronome independente com o particípio qal expressa uma ação em curso ou iminente. A formulação mantém a metáfora da aproximação da morte sem explicitá-la.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: o caminho de toda a terra
  rationale: Preserva de modo inteligível a expressão hebraica para o destino mortal comum a todos os habitantes da terra.
- source_word: וְחָזַקְתָּ
  choice: Portanto, seja forte
  rationale: Embora a forma hebraica seja um perfeito com conjunção, neste contexto tem força exortativa. 'Portanto' explicita a ligação discursiva natural com a morte iminente de Davi.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: e seja homem
  rationale: Mantém o substantivo masculino dirigido especificamente a Salomão, bem como a exortação à coragem e à responsabilidade, sem substituí-lo por uma formulação neutra.
theological_decisions:
- issue: Expressão masculina na exortação
  choice: seja homem
  alternative: mostre que é homem; porte-se como homem
  rationale: O hebraico é masculino e se dirige especificamente a Salomão. A tradução conserva tanto a forma lexical quanto a força da exortação de pai para filho, enquanto a nota registra nuances legítimas sem impor estereótipos modernos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão metafórica hebraica foi preservada; a pontuação fecha o versículo em português, embora a fala continue no contexto.
