  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: pt
  text: 'Ela disse: “Tenho um pequeno pedido para lhe fazer; não rejeite o meu pedido.” O rei lhe respondeu: “Peça, minha mãe, pois não rejeitarei o seu pedido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: um pequeno pedido
  rationale: Expressa de modo natural a ideia de um único pedido considerado pequeno, sem sobrecarregar a frase com o numeral.
- source_word: אַל תָּשֶׁב אֶת פָּנָי / לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: não rejeite o meu pedido / não rejeitarei o seu pedido
  rationale: O hebraísmo literal, “não faça voltar o meu rosto”, significa não recusar ou despedir sem atender. Em português corrente, explicitar “pedido” preserva o sentido contextual e a repetição entre as duas falas.
- source_word: שַׁאֲלִי אִמִּי
  choice: Peça, minha mãe
  rationale: Mantém o imperativo feminino e o tratamento respeitoso e afetivo do rei.
