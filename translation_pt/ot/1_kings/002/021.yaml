  source_fidelity: O texto preserva a sequência narrativa, o jussivo passivo de pedido/proposta («Que ... seja dada»), a identificação gentílica de Abisague e a relação de Adonias com o destinatário. A construção matrimonial é corretamente entendida como dar em casamento.
