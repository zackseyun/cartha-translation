  text: 'E ela disse: “Que Abisague, a sunamita, seja dada a Adonias, teu irmão, como esposa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ela disse
  rationale: O waw consecutivo dá continuidade à narrativa; a forma simples preserva o encadeamento hebraico sem explicitar uma relação mais específica.
- source_word: יֻתַּן
  choice: Que ... seja dada
  rationale: O jussivo passivo expressa um pedido ou proposta. Esta construção portuguesa conserva tanto a modalidade volitiva quanto a voz passiva.
- source_word: אֲבִישַׁג
  choice: Abisague
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: הַשֻּׁנַמִּית
  choice: a sunamita
  rationale: O gentílico identifica Abisague por sua origem e pode ser expresso de modo conciso e natural em português.
- source_word: לַאֲדֹנִיָּהוּ
  choice: a Adonias
  rationale: A preposição ל marca o destinatário na construção de dar uma mulher em casamento.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: O sufixo masculino singular dirige-se a Salomão; 'seu irmão' conserva a relação familiar e é inequívoco no contexto direto.
- source_word: לְאִשָּׁה
  choice: por mulher
  rationale: A expressão hebraica indica casamento. 'Por mulher' é uma formulação digna e bíblica, ainda compreensível em português moderno, que preserva a construção matrimonial sem ampliar o sentido.
