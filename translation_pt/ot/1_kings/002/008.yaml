  terminology: «Yahweh» representa de modo consistente o Tetragrama. «Benjamita», «Baurim», «Maanaim», «Jordão» e «à espada» são adequados. A nota explica corretamente a fórmula de juramento e permanece ancorada à declaração jurada.
