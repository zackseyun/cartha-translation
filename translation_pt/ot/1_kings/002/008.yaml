  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: pt
  text: 'E veja: Simei, filho de Gera, o benjamita de Baurim, está com você. Ele me amaldiçoou com uma maldição terrível no dia em que fui para Maanaim. Mas ele desceu ao meu encontro junto ao Jordão, e eu lhe jurei por Yahweh: “Não o matarei à espada”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Se eu o matar à espada”. Trata-se de uma fórmula elíptica de juramento, com a imprecação omitida, cujo sentido é: “Não o matarei à espada”.'
    reason: Explica a forma literal e o valor idiomático da fórmula hebraica de juramento.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E veja
  rationale: Mantém a função de chamar a atenção para alguém já presente na esfera de Salomão, em linguagem atual e digna, sem o tom arcaico que “eis que” pode ter para alguns leitores.
- source_word: עִמְּךָ
  choice: está com você
  rationale: Expressa de modo natural que Simei se encontra ao alcance ou na esfera de autoridade de Salomão.
- source_word: שִׁמְעִי בֶן־גֵּרָא בֶן־הַיְמִינִי מִבַּחֻרִים
  choice: Simei, filho de Gera, o benjamita de Baurim
  rationale: Usa as formas portuguesas tradicionais dos nomes e verte o gentílico de forma idiomática, sem transformar a expressão em uma genealogia adicional.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: lançou contra mim uma terrível maldição
  rationale: Comunica tanto o ato de amaldiçoar quanto a intensidade da maldição. Evita a repetição pouco natural “amaldiçoou-me com uma maldição”, sem perder a ênfase da construção cognata hebraica.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: no dia em que fui para Maanaim
  rationale: Reproduz com clareza a referência temporal e o movimento em direção a Maanaim.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: desceu ao meu encontro junto ao Jordão
  rationale: Preserva o verbo de movimento “descer” e entende “o Jordão” como indicação do local do encontro.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: eu lhe jurei por Yahweh
  rationale: Mantém a fórmula explícita do juramento e representa o nome divino presente no hebraico.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Não o matarei à espada
  rationale: Explicita o sentido negativo da fórmula hebraica elíptica de juramento e conserva a imagem da morte pela espada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR, Javé ou Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” conserva o nome próprio em transliteração, sem substituí-lo por um título.
- issue: Sentido da fórmula de juramento אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Não o matarei à espada
  alternative: Se eu o matar à espada
  rationale: Em juramentos hebraicos, אִם pode introduzir uma imprecação cuja consequência fica subentendida; aqui a fórmula comunica uma promessa enfática de não matar. A nota preserva a forma literal e sua ambiguidade estrutural.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A pontuação divide o longo encadeamento hebraico para facilitar a leitura, sem alterar suas relações lógicas. O pronome “o” mantém um tom formal adequado à fala régia e evita excesso de coloquialidade.
