  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: pt
  text: Assim, o sangue deles recairá sobre a cabeça de Joabe e sobre a cabeça de seus descendentes para sempre[a]. Mas, para Davi, seus descendentes, sua casa e seu trono, haverá paz para sempre da parte de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “o sangue deles” é uma expressão que indica a responsabilidade pelo sangue que Joabe derramou.
    reason: Esclarecer o valor jurídico da imagem hebraica sem removê-la do texto principal.
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: recairá
  rationale: O verbo שׁוב, no contexto judicial e com דמים como sujeito, expressa o retorno das consequências do sangue derramado ao culpado. “Recairá” preserva esse sentido e combina naturalmente com “sobre a cabeça” em português.
- source_word: דְמֵיהֶם
  choice: o sangue deles
  rationale: Mantém a imagem hebraica, na qual o sangue das vítimas representa a responsabilidade pelas mortes, sem substituir diretamente a expressão por “culpa de sangue”.
- source_word: בְּרֹאשׁ
  choice: sobre a cabeça de
  rationale: Preserva a metáfora jurídica hebraica de culpa ou consequências que recaem sobre alguém.
- source_word: זַרְעוֹ
  choice: seus descendentes
  rationale: Neste contexto dinástico, זרע designa a posteridade coletiva. “Descendentes” é claro, natural e evita o literalismo pouco idiomático de “semente”.
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: para sempre
  rationale: A expressão comunica duração indefinida e permanente no pronunciamento judicial e na promessa dinástica; “para sempre” é a formulação portuguesa mais natural e solene.
- source_word: יִהְיֶה שָׁלוֹם
  choice: haverá paz
  rationale: Reproduz naturalmente a construção existencial e mantém a amplitude de שָׁלוֹם, que pode abranger paz, integridade e bem-estar.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: para Davi, seus descendentes, sua casa e seu trono
  rationale: A preposição ל marca benefício ou relação. A repetição pode ser condensada em português sem perder nenhum dos quatro referentes nem a importância dinástica de “casa” e “trono”.
- source_word: מֵעִם יְהוָה
  choice: da parte de Yahweh
  rationale: מֵעִם indica que Yahweh é a fonte da paz. “Da parte de” é idiomático e preserva essa relação de origem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal e o distingue do título “Senhor”.
theological_decisions:
- issue: Contraste entre o juízo sobre a linhagem de Joabe e a paz para a linhagem de Davi
  choice: Usar “Mas” para explicitar o valor adversativo da segunda conjunção.
  alternative: Manter a coordenação simples com “E”.
  rationale: Embora ו seja formalmente copulativo, o contexto contrapõe claramente o sangue que recai sobre Joabe à paz concedida a Davi. “Mas” torna essa relação discursiva natural em português sem acrescentar conteúdo teológico.
- issue: Alcance de שָׁלוֹם no contexto dinástico
  choice: Traduzir por “paz”, deixando implícitas suas dimensões de bem-estar, estabilidade e favor divino.
  alternative: Traduzir por “bem-estar” ou “prosperidade”.
  rationale: “Paz” mantém a amplitude e a força teológica do termo, ao passo que as alternativas podem estreitar seu sentido.
- issue: Responsabilidade atribuída aos descendentes de Joabe
  choice: Preservar literalmente a afirmação de que o sangue recairá também sobre seus descendentes, sem explicar ou harmonizar a tensão.
  alternative: Atenuar a formulação ou restringi-la aos descendentes que repetissem a culpa de Joabe.
  rationale: O texto inclui explicitamente a descendência de Joabe e não apresenta aqui uma condição. A tradução deve conservar essa tensão genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase preserva as imagens jurídicas e dinásticas do hebraico, empregando “recairá sobre a cabeça” e mantendo “casa” e “trono”. O nome divino é apresentado como “Yahweh”.
