  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: pt
  text: Então o rei Salomão enviou Benaia, filho de Joiada,[a] e Benaia o feriu, e ele morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “enviou pela mão de Benaia, filho de Joiada”, expressão idiomática que indica que Benaia agiu como seu agente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O verbo שׁלח, na sequência narrativa, tem o sentido comum de enviar. “Enviou” preserva a formulação simples do hebraico sem antecipar no verbo a ordem de execução.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: o rei Salomão
  rationale: Forma natural em português que conserva tanto o título real quanto o nome próprio.
- source_word: בְּיַד
  choice: enviou Benaia, filho de Joiada
  rationale: A expressão idiomática בְּיַד, literalmente “pela mão de”, indica aqui agência. A redação escolhida apresenta Benaia naturalmente como o agente enviado; a forma literal é registrada em nota.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: A construção patronímica hebraica é vertida na forma corrente e clara em português.
- source_word: וַיִּפְגַּע בּוֹ
  choice: este o feriu
  rationale: פגע com ב pode indicar encontrar, investir contra ou ferir. No contexto de execução, “feriu” comunica a ação hostil e deixa a morte para a oração seguinte, como faz o hebraico. “Este” esclarece que Benaia é o agente sem substituir o objeto pelo nome.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: A tradução mantém a oração sequencial explícita do hebraico, sem absorver a morte no verbo anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa próxima do hebraico. A repetição de “e” conserva a progressão coordenada do texto-fonte; “este” evita confusão quanto ao agente de “feriu”.
