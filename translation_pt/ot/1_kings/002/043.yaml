base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: pt
  text: Por que, então, você não cumpriu o juramento de Yahweh[a] e a ordem que ordenei a você?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o juramento feito a Yahweh” — isto é, o juramento feito em nome de Yahweh ou sob sua autoridade.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz, mais literalmente, “a ordem que ordenei sobre você”, destacando a obrigação imposta a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: Por que, então
  rationale: A expressão interrogativa significa “por quê?”, e a conjunção inicial liga a pergunta à acusação anterior; “então” expressa essa conexão de modo natural em português.
- source_word: לֹא שָׁמַרְתָּ
  choice: você não cumpriu
  rationale: שׁמר pode significar guardar, observar ou cumprir. Com “juramento” e “ordem”, “cumprir” comunica naturalmente a obrigação assumida e imposta.
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: o juramento de Yahweh
  rationale: Mantém de perto a construção hebraica e preserva a possível relação do juramento com Yahweh, sem explicar no texto principal se foi feito a ele, em seu nome ou sob sua autoridade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְאֶת הַמִּצְוָה
  choice: e a ordem
  rationale: מִצְוָה designa uma ordem ou mandamento; “ordem” é atual e apropriado à fala do rei neste contexto.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: que lhe dei
  rationale: Expressa idiomaticamente em português a ordem dirigida e imposta a Simei. A nota registra a formulação hebraica mais literal, com a ideia de algo posto sobre ele.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Relação entre Yahweh e o juramento
  choice: juramento de Yahweh
  alternative: juramento feito a Yahweh; juramento feito em nome de Yahweh
  rationale: A construção hebraica é concisa e pode indicar um juramento vinculado a Yahweh, provavelmente feito em seu nome ou sob sua autoridade. O texto principal preserva essa concisão, e a nota esclarece as possibilidades sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com “você” para a forma masculina singular. “Cumpriu” funciona naturalmente tanto com “juramento” quanto com “ordem”; a repetição pouco idiomática de “ordem que ordenei” foi evitada no texto principal e documentada em nota.
