base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/001.yaml
  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: pt
  text: 'Quando se aproximou o tempo de Davi morrer,[a] ele ordenou a seu filho Salomão:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os dias de Davi se aproximaram para morrer”; o idioma hebraico significa que o tempo da morte de Davi estava se aproximando.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: Quando se aproximou o tempo de Davi morrer
  rationale: 'O hebraico diz literalmente que “os dias de Davi se aproximaram para morrer”. A tradução conserva a ideia de aproximação, mas expressa em português natural o sentido do idioma temporal: aproximava-se o momento da morte de Davi.'
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה indica dar uma ordem ou incumbência. “Ordenou” preserva a força solene das instruções finais de Davi sem recorrer a linguagem arcaica.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: a seu filho Salomão
  rationale: Identifica naturalmente em português o destinatário da ordem e sua relação com Davi, embora reorganize a ordem hebraica “Salomão, seu filho”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introdutório hebraico anuncia o discurso direto. Em português atual, os dois-pontos desempenham essa função com mais naturalidade do que o decalque “dizendo”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita o literalismo pouco natural de “os dias de Davi se aproximaram para morrer”, enquanto a nota preserva a imagem e a estrutura do hebraico.
