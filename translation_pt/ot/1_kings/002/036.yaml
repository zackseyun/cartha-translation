base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: pt
  text: 'Então o rei mandou chamar Simei e lhe disse: “Construa para você uma casa em Jerusalém e more ali. Não saia dali para lugar nenhum.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְשִׁמְעִי
  choice: mandou chamar Simei
  rationale: A combinação dos dois verbos descreve naturalmente o envio de alguém para convocar Simei; em português, “mandou chamar” preserva ambos os elementos de modo idiomático.
- source_word: בְּנֵה לְךָ בַיִת
  choice: Construa para você uma casa
  rationale: Mantém o imperativo de בנה, o valor benefactivo de לְךָ e o sentido concreto de בית.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: e more ali
  rationale: ישב, neste contexto de residência obrigatória, indica morar ou residir; “more” é corrente e claro.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: Não saia dali
  rationale: Reproduz diretamente a proibição expressa por יצא e o ponto de origem indicado por מִשָּׁם.
- source_word: אָנֶה וָאָנָה
  choice: para lugar nenhum
  rationale: O par idiomático significa “para cá ou para lá”, isto é, para qualquer lugar; sob negação, “para lugar nenhum” expressa isso naturalmente em português.
