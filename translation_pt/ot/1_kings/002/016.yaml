base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: pt
  text: 'E agora quero lhe fazer um pedido; não me recuse.[a] Ela lhe disse: “Fale.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não faças voltar o meu rosto”, expressão que significa “não me rejeites” ou “não negues meu pedido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação narrativa de וְ como a função temporal e discursiva de עַתָּה.
- source_word: שְׁאֵלָה אַחַת
  choice: um pedido
  rationale: שְׁאֵלָה designa um pedido ou petição; em português, o singular já comunica com naturalidade a ideia de «um pedido».
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: quero lhe fazer
  rationale: Expressa de modo corrente o ato presente de pedir, marcado pelo pronome independente e pelo particípio hebraico, sem reproduzir uma construção pouco natural em português.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: não me recuse
  rationale: Traduz o sentido contextual do idioma hebraico de não fazer voltar o rosto do suplicante, isto é, não rejeitá-lo nem negar seu pedido; a imagem literal fica registrada em nota.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Ela lhe disse
  rationale: Representa com clareza a sequência narrativa e mantém os referentes pronominais feminino e masculino do hebraico.
- source_word: דַּבֵּר
  choice: Fale
  rationale: Imperativo breve que convida o interlocutor a apresentar o pedido, correspondendo diretamente ao hebraico.
