  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: pt
  text: O tempo durante o qual Davi reinou sobre Israel foi de quarenta anos. Em Hebrom, reinou sete anos; e, em Jerusalém, reinou trinta e três anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: O tempo durante o qual Davi reinou
  rationale: A expressão hebraica literalmente fala dos “dias” em que Davi reinou, mas aqui indica a duração do reinado. “O tempo durante o qual” comunica esse sentido com naturalidade em português moderno.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com o verbo מָלַךְ, a preposição עַל indica o povo sobre o qual se exerce o governo; “reinou sobre Israel” é idiomático e preciso.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarenta anos
  rationale: Tradução direta da expressão numeral e temporal hebraica.
- source_word: בְּחֶבְרוֹן
  choice: Em Hebrom
  rationale: A preposição בְּ marca localização, e “em Hebrom” é a forma natural em português.
- source_word: מָלַךְ שֶׁבַע שָׁנִים
  choice: reinou sete anos
  rationale: A repetição de “reinou” preserva a estrutura explícita do hebraico e mantém o foco no resumo régio.
- source_word: וּבִירוּשָׁלִַם
  choice: e, em Jerusalém
  rationale: Preserva a conjunção e a indicação locativa do hebraico; as vírgulas favorecem a leitura natural da coordenação em português.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: trinta e três anos
  rationale: Forma corrente em português para o número composto, preservando o total exato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita o literalismo pouco natural de “os dias que Davi reinou”, mas conserva a duração, a repetição do verbo e a divisão geográfica do reinado.
