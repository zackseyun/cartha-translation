base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: pt
  text: 'Simei disse ao rei: “A palavra é boa.[a] Assim como falou meu senhor, o rei, assim fará teu servo.” E Simei viveu em Jerusalém por muitos dias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O assunto é bom” ou “O que disseste é bom”.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: O que disseste é bom
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “coisa”. No contexto, Simei aprova a determinação que Salomão acabou de expressar; esta formulação comunica naturalmente esse sentido em português, sem eliminar as alternativas lexicais, registradas em nota.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o rei, meu senhor
  rationale: Preserva tanto o título real quanto a deferência de אֲדֹנִי, numa ordem natural e digna em português.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: assim fará o teu servo
  rationale: “Teu servo” conserva a autodesignação humilde própria do discurso perante o rei, sem implicar necessariamente escravidão; o imperfeito tem valor futuro de compromisso neste contexto.
- source_word: וַיֵּשֶׁב
  choice: viveu
  rationale: Em contexto de residência, יָשַׁב significa morar ou viver em determinado lugar. “Viveu” é atual e claro.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: Mantém a expressão hebraica e sua duração indefinida, em construção natural no português.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Emprega a forma portuguesa convencional do topônimo e traduz diretamente a preposição.
