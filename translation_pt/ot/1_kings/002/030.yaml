base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: pt
  text: 'Então Benaías foi à tenda de Yahweh[a] e lhe disse: “Assim diz o rei: ‘Saia.’” Mas ele respondeu: “Não, pois morrerei aqui.” Benaías levou a resposta de volta ao rei, dizendo: “Assim falou Joabe, e assim ele me respondeu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tabernáculo de Yahweh”. O hebraico diz literalmente “tenda de Yahweh”.'
    reason: Registra a alternativa tradicional “tabernáculo”, mantendo no texto principal o sentido lexical direto de אֹהֶל.
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: tenda de Yahweh
  rationale: אֹהֶל significa literalmente “tenda”. A expressão identifica o santuário sem substituir o termo hebraico por “casa”; “tabernáculo” é uma alternativa tradicional mais interpretativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando seu caráter de nome próprio em vez de substituí-lo por um título.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Assim diz o rei
  rationale: Preserva a fórmula formal de mensageiro e continua clara e natural em português atual.
- source_word: צֵא
  choice: Saia
  rationale: O imperativo de יצא ordena que Joabe deixe o lugar onde está; “Saia” é a forma direta e natural em português.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: Não, pois morrerei aqui
  rationale: Mantém tanto a recusa enfática quanto a explicação ou resolução introduzida por כִּי, sem decidir além do texto se Joabe deseja a morte ou apenas a prevê.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: levou a resposta de volta ao rei
  rationale: Expressa em português corrente o idioma hebraico de voltar com uma palavra ou relatório.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: Assim falou Joabe, e assim ele me respondeu
  rationale: Conserva a repetição de כֹּה e o tom formal do relatório de Benaías.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e corresponde melhor à reconstrução acadêmica amplamente aceita, sem substituí-lo por um título.
- issue: Sentido da declaração de Joabe sobre morrer no santuário
  choice: “pois morrerei aqui”
  alternative: “mas morrerei aqui”
  rationale: A tradução mantém aberta a nuance de כִּי e não acrescenta uma explicação teológica sobre asilo, expiação ou intenção suicida que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula “Assim diz o rei” e a repetição final de “assim” preservam o tom formal e a estrutura do hebraico; “Saia” evita uma construção artificial.
