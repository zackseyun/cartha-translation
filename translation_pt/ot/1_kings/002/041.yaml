  text: וַ/יֻּגַּ֖ד לִ/שְׁלֹמֹ֑ה כִּי הָלַ֨ךְ שִׁמְעִ֧י מִ/ירוּשָׁלִַ֛ם גַּ֖ת וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: pt
  text: E Salomão foi informado de que Simei tinha ido de Jerusalém a Gate e voltado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: foi informado
  rationale: A forma passiva de נגד indica que a informação foi comunicada a Salomão sem identificar quem a transmitiu; a expressão é natural em português e preserva a voz passiva.
- source_word: לִשְׁלֹמֹה
  choice: Salomão
  rationale: A preposição ל marca Salomão como destinatário da informação; em português, a construção 'Salomão foi informado' expressa naturalmente essa função.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo da informação em discurso indireto; 'de que' completa de modo idiomático a locução 'foi informado'.
- source_word: הָלַךְ
  choice: tinha ido
  rationale: הלך descreve o deslocamento; o mais-que-perfeito composto situa a ida antes do ato de informar.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: מִירוּשָׁלִַם
  choice: de Jerusalém
  rationale: A preposição מ indica o ponto de partida do deslocamento.
- source_word: גַּת
  choice: a Gate
  rationale: Embora não haja preposição explícita antes do topônimo, Gate funciona como destino de הלך; o português requer a preposição 'a'.
- source_word: וַיָּשֹׁב
  choice: e voltado
  rationale: שׁוב significa voltar ou retornar. A coordenação elíptica com 'tinha ido' comunica uma segunda ação concluída antes da informação, sem repetição desnecessária do auxiliar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formulação amplamente internacional. A ordem foi ajustada para a construção passiva pessoal natural em português, sem acrescentar um mensageiro não identificado no hebraico.
