base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: pt
  text: A notícia chegou a Joabe, pois ele havia tomado o partido de Adonias, mas não havia tomado o partido de Absalão.[a] Então Joabe fugiu para a tenda de Yahweh e agarrou-se aos chifres do altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Joabe havia se voltado após Adonias, mas não havia se voltado após Absalão”. A expressão indica aqui apoio ou lealdade política.'
    reason: lexical_alternative
  - marker: b
    text: Os “chifres” eram projeções semelhantes a chifres nos cantos do altar. Agarrar-se a eles podia ser um apelo por proteção ou misericórdia.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: a notícia
  rationale: O substantivo designa uma informação ou notícia que chega a alguém. “Notícia” é natural no contexto narrativo e não sugere a incerteza de “rumor”.
- source_word: בָּאָה עַד
  choice: chegou a
  rationale: Reproduz com naturalidade o movimento expresso pelo idioma hebraico, literalmente “veio até”.
- source_word: נָטָה אַחֲרֵי
  choice: tomado o partido de
  rationale: O idioma, literalmente “voltou-se após”, indica aqui adesão política. A formulação escolhida comunica esse sentido com clareza e permite repetir a mesma expressão nas duas orações.
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: וְאַחֲרֵי אַבְשָׁלוֹם לֹא נָטָה
  choice: embora não tivesse tomado o partido de Absalão
  rationale: “Embora” expressa a nuance concessiva possível da oração, enquanto a repetição de “tomado o partido de” preserva o paralelismo hebraico.
- source_word: וַיָּנָס
  choice: fugiu
  rationale: Equivalente narrativo direto, que comunica a urgência da ação.
- source_word: אֹהֶל יְהוָה
  choice: a tenda de Yahweh
  rationale: Traduz literalmente “tenda” sem introduzir o termo técnico “tabernáculo” e conserva o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: agarrou-se aos chifres do altar
  rationale: Mantém a ação física concreta e a designação tradicional das projeções do altar, deixando sua relevância cultural para a nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o preserva sem substituí-lo por um título.
- issue: Sentido político do idioma נָטָה אַחֲרֵי
  choice: tomado o partido de
  alternative: seguido; voltado-se após
  rationale: No contexto, a expressão se refere à lealdade política de Joabe. A escolha explicita esse sentido sem acrescentar uma avaliação teológica e mantém a repetição nas referências a Adonias e Absalão.
translation_notes:
  register: Português moderno, digno e acessível, com nomes bíblicos em suas formas correntes no português. A tradução prioriza clareza narrativa, preserva o paralelismo da lealdade a Adonias e Absalão e mantém a imagem cultual dos chifres do altar.
