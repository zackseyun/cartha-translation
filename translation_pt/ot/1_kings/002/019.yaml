base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: Then Bathsheba came to King Solomon to speak to him about Adonijah. And the king rose to meet her and bowed down to her, then sat on his throne and had a throne set for the king’s mother, and she sat at his right hand.
translation:
  language: pt
  text: Então Bate-Seba foi ao rei Salomão para falar com ele a respeito de Adonias. O rei se levantou para recebê-la, inclinou-se diante dela e depois sentou-se no seu trono. Colocou um trono para a mãe do rei, e ela se sentou à direita dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרָאתָהּ
  choice: para recebê-la
  rationale: No contexto de uma recepção régia, expressa naturalmente o movimento do rei ao encontro dela.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: inclinou-se diante dela
  rationale: Preserva o gesto de deferência indicado pelo verbo hebraico sem sugerir necessariamente adoração religiosa.
- source_word: כִּסֵּא
  choice: trono
  rationale: O mesmo substantivo designa tanto o assento régio de Salomão quanto o assento de honra preparado para a mãe do rei; 'trono' mantém essa correspondência deliberada.
- source_word: לִימִינוֹ
  choice: à direita dele
  rationale: Reproduz a posição de honra indicada literalmente pelo hebraico.
theological_decisions:
- issue: Natureza da reverência de Salomão diante de Bate-Seba
  choice: inclinou-se diante dela
  alternative: prostrou-se diante dela
  rationale: A formulação mantém o gesto de honra à mãe do rei sem impor uma leitura cultual nem exagerar a postura física além do que o contexto exige.
- issue: Status do assento da mãe do rei
  choice: um trono
  alternative: uma cadeira
  rationale: Preserva a repetição lexical de כִּסֵּא e a dignidade pública concedida à mãe do rei, sem desenvolver implicações doutrinárias não declaradas no texto.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. 'Bate-Seba' e 'Adonias' seguem formas amplamente reconhecidas em português. A coordenação hebraica foi distribuída em frases naturais, preservando a sequência dos atos.
