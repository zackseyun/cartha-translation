base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: pt
  text: 'E informaram ao rei Salomão que Joabe havia fugido para a tenda de Yahweh[a], e lá estava, junto ao altar. Então Salomão enviou Benaia, filho de Joiada, dizendo: “Vá, golpeie-o[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tabernáculo de Yahweh”. O hebraico diz literalmente “tenda de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ataque-o” ou “caia sobre ele”. O verbo hebraico pode indicar golpear, atacar ou investir contra alguém; neste contexto, a ordem tem consequências letais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: informaram
  rationale: O hofal expressa que a informação foi comunicada ao rei. A forma impessoal com sujeito indeterminado é natural em português e mantém o foco no conteúdo do relato.
- source_word: נָס
  choice: havia fugido
  rationale: O mais-que-perfeito composto deixa claro que a fuga de Joabe ocorreu antes de a notícia chegar a Salomão.
- source_word: אֶל אֹהֶל יְהוָה
  choice: para a tenda de Yahweh
  rationale: “Tenda” traduz diretamente אֹהֶל, sem substituir o termo por “tabernáculo”; Yahweh representa o nome divino explícito no hebraico.
- source_word: וְהִנֵּה
  choice: e estava
  rationale: No contexto do relato indireto, a construção apresenta vividamente onde Joabe se encontrava. A formulação natural evita o arcaísmo “e eis que”, sem alterar a informação.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: junto ao altar
  rationale: אֵצֶל indica proximidade; “junto ao” é claro e idiomático.
- source_word: וַיִּשְׁלַח
  choice: Então Salomão enviou
  rationale: “Então” expressa a progressão e a consequência narrativa introduzidas pelo wayyiqtol.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Forma portuguesa tradicional e inteligível dos nomes, com o patronímico explicitado naturalmente.
- source_word: לֵךְ
  choice: Vá
  rationale: Imperativo direto de הלך, vertido de forma natural no português contemporâneo.
- source_word: פְּגַע בּוֹ
  choice: mate-o
  rationale: Embora פגע com ב possa significar golpear ou atacar, o contexto é uma ordem de execução; “mate-o” comunica com clareza a força letal pretendida, enquanto a nota preserva a amplitude lexical.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, não o título אֲדֹנָי. “Yahweh” preserva sua condição de nome próprio sem substituí-lo por um título.
- issue: Natureza da ordem פְּגַע בּוֹ
  choice: mate-o
  alternative: golpeie-o; ataque-o
  rationale: O contexto imediato apresenta uma ordem de execução, mas a nota registra que o verbo hebraico, isoladamente, possui uma faixa semântica mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se “eis que” por soar marcadamente arcaico; a vivacidade foi integrada à narração. Os nomes próprios seguem formas portuguesas correntes.
