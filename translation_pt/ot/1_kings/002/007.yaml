  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: pt
  text: Mas trate com bondade[a] os filhos de Barzilai, o gileadita, e faça com que estejam entre os que comem à sua mesa,[b] pois foi assim que eles se aproximaram de mim[c] quando eu fugia de Absalão, seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aja com lealdade para com os filhos de Barzilai”. A expressão hebraica traduzida por “trate com bondade” pode indicar bondade leal, e não apenas um sentimento benevolente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “estejam entre os que comem à sua mesa”, expressão que indica provisão contínua e favor da parte do rei.
    reason: cultural_note
  - marker: c
    text: Ou “vieram até mim” ou “ficaram ao meu lado”. O verbo hebraico significa literalmente “aproximar-se”, mas, neste contexto, sugere que eles apoiaram Davi durante sua fuga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Mas ... os filhos de
  rationale: O waw dá continuidade às instruções de Davi e, após a ordem negativa anterior, admite aqui valor contrastivo. “Filhos de” preserva a referência aos descendentes masculinos de Barzilai no contexto narrativo.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai, o gileadita
  rationale: O nome próprio é transliterado, enquanto o gentílico é traduzido de modo claro e tradicional.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: trate com bondade
  rationale: A expressão idiomática indica agir com bondade marcada por lealdade. “Trate com bondade” é natural em português e não restringe חֶסֶד a uma formulação teológica específica.
- source_word: וְהָיוּ
  choice: e faça com que estejam
  rationale: No contexto das instruções de Davi a Salomão, a forma verbal tem força diretiva ou resultativa. A construção comunica claramente que Salomão deve incluí-los entre os sustentados pela corte.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: entre os que comem à sua mesa
  rationale: Preserva a imagem participial do hebraico e expressa a ideia de provisão contínua e favor real.
- source_word: כִּי כֵן
  choice: pois foi assim que
  rationale: “Pois” introduz a razão, e “foi assim que” mantém a força explicativa e comparativa de כֵן sem tornar a frase artificial.
- source_word: קָרְבוּ אֵלַי
  choice: eles se aproximaram de mim
  rationale: Mantém o sentido lexical de “aproximar-se”, sem explicitar demais o apoio que o contexto histórico sugere.
- source_word: בְּבָרְחִי
  choice: quando eu fugia
  rationale: O infinitivo com preposição tem valor temporal. O imperfeito português apresenta naturalmente a fuga em andamento.
- source_word: מִפְּנֵי
  choice: de
  rationale: Em contexto de fuga, a preposição hebraica é expressa de modo idiomático em português por “fugir de”.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: Absalão, seu irmão
  rationale: Mantém o nome e o termo de parentesco, que recorda a Salomão a relação familiar e o contexto político.
