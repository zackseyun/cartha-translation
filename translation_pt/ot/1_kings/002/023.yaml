base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: pt
  text: 'Então o rei Salomão jurou por Yahweh[a], dizendo: “Que Deus faça comigo isto e ainda mais[b], pois Adonias disse isso à custa da própria vida[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino יהוה (YHWH), aqui representado como “Yahweh”.
    reason: divine_name
  - marker: b
    text: Fórmula de juramento que invoca sobre quem fala um castigo não especificado — e ainda maior — como reforço solene do juramento.
    reason: idiom
  - marker: c
    text: Literalmente, “falou esta palavra com/contra a própria vida”; isto é, disse algo que põe sua vida em risco ou lhe custa a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: O verbo indica prestar juramento; “jurou” é conciso e natural na narrativa.
- source_word: בַּיהוָה
  choice: por Yahweh
  rationale: A preposição introduz aquele por quem se jura, e o nome divino יְהוָה é representado diretamente como “Yahweh”.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Que Deus me faça isto e ainda mais
  rationale: Mantém a forma tradicional de automaldição do juramento, cujo castigo específico fica implícito no hebraico.
- source_word: כִּי
  choice: pois
  rationale: 'Neste contexto, a partícula tem valor causal ou asseverativo: Salomão declara que o pedido de Adonias lhe custará a vida, e não formula uma condição negativa.'
- source_word: בְנַפְשׁוֹ
  choice: à custa da própria vida
  rationale: Expressa de modo natural que as palavras de Adonias põem sua vida em risco ou a tornam passível de perda, preservando o vínculo entre sua fala e sua morte.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: disse isso
  rationale: Representa em português corrente a expressão hebraica literalmente equivalente a “falou esta palavra/coisa”.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o nome próprio divino; “Yahweh” o preserva sem substituí-lo por um título.
- issue: Força de כִּי na fórmula de juramento
  choice: 'causal/asseverativa: “pois”'
  alternative: 'condicional: “se”'
  rationale: No contexto imediato, Salomão afirma que Adonias falou à custa da vida; entender כִּי como causal evita introduzir uma condição ou negação ausente no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula de juramento conserva deliberadamente parte da forma hebraica, esclarecida em nota; a expressão final recebe equivalência idiomática sem eliminar sua gravidade judicial.
