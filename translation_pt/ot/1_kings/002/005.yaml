source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: pt
  text: 'Você também sabe o que Joabe, filho de Zeruia, fez contra mim, o que fez aos dois comandantes dos exércitos de Israel — Abner, filho de Ner, e Amasa, filho de Jéter: ele os matou e derramou sangue de guerra em tempo de paz[a], e pôs esse sangue de guerra no cinturão que trazia na cintura e nas sandálias que calçava.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “pôs sangue de guerra em paz”. A expressão indica que Joabe praticou, em tempo de paz, derramamento de sangue próprio da guerra.
    reason: lexical_alternative
  - marker: b
    text: A imagem do sangue no cinturão e nas sandálias provavelmente retrata a culpa de sangue ligada a Joabe por essas mortes.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: Você também sabe
  rationale: Expressa naturalmente em português a conjunção, a ênfase aditiva e o conhecimento presente compartilhado com Salomão.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: o que ... fez contra mim
  rationale: O dativo לִי indica aqui prejuízo ou ação adversa; “contra mim” torna essa força mais clara do que o ambíguo “a mim”.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: aos dois comandantes dos exércitos de Israel
  rationale: שָׂרֵי designa chefes militares, e o plural צִבְאוֹת é preservado sem prejudicar a naturalidade.
- source_word: לְאַבְנֵר בֶּן נֵר וְלַעֲמָשָׂא בֶן יֶתֶר
  choice: Abner, filho de Ner, e Amasa, filho de Jéter
  rationale: Mantém a identificação em aposição dos dois comandantes e emprega formas portuguesas reconhecíveis dos nomes.
- source_word: וַיַּהַרְגֵם
  choice: Ele os matou
  rationale: Tradução direta do verbo narrativo e de seu sufixo pronominal.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: derramando sangue de guerra em tempo de paz
  rationale: Comunica o sentido da expressão hebraica — praticar violência própria da guerra sob condições de paz — e conserva o contraste retórico entre guerra e paz; a formulação mais literal é registrada em nota.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: pôs esse sangue de guerra no cinturão ... e nas sandálias
  rationale: Preserva a imagem concreta do sangue sobre o equipamento e o vestuário de Joabe. “Esse” retoma com clareza o sangue já mencionado.
- source_word: אֲשֶׁר בְּמָתְנָיו ... אֲשֶׁר בְּרַגְלָיו
  choice: que trazia na cintura ... que calçava
  rationale: Reproduz o conteúdo das orações relativas em português corrente, evitando a redundância pouco natural de “nos pés” após “sandálias”.
theological_decisions:
- issue: Relação das mortes com Davi em לִי
  choice: “contra mim”
  alternative: “a mim” ou omitir a expressão
  rationale: O texto massorético inclui explicitamente לִי. A tradução mantém a relação adversa com Davi sem explicar além do que o versículo afirma.
- issue: Sentido de “sangue de guerra em paz”
  choice: Manter o contraste e esclarecer o idioma por tradução e nota
  alternative: Resolver apenas como “assassinou-os em tempo de paz”
  rationale: A formulação escolhida conserva a linguagem acusatória e sua tensão poética, sem reduzir a imagem a uma interpretação puramente explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva as imagens hebraicas centrais, enquanto pequenas adaptações sintáticas evitam literalismo obscuro.
