  source_fidelity: O texto traduz adequadamente o imperativo prático de וְעָשִׂיתָ, a conformidade com a sabedoria de Salomão e a força causativa de וְלֹא תוֹרֵד. A expressão “ele, já de cabelos brancos” transmite de modo idiomático a metonímia hebraica de “sua cabeça grisalha/cabelos brancos”, sem alterar o sentido de que Joabe não deve chegar ao Sheol em paz.
  naturalness: A redação é clara, moderna e digna em português de ampla compreensão. “Aja segundo a sua sabedoria” e “não faça com que ele ... desça em paz ao Sheol” soam naturais no registro de uma instrução solene. A explicitação “já de cabelos brancos” evita uma construção literal pouco fluente em português.
  terminology: “Sheol” é uma escolha apropriada e não interpretativa para שְׁאוֹל; a nota explica o termo sem reduzir indevidamente seu alcance. “Em paz” preserva bem בְּשָׁלוֹם. A nota a oferece uma alternativa idiomática real para a formulação causativa, e os marcadores estão adequadamente ancorados.
