id: 1KI.2.6
reference: 1 Kings 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשִׂ֖יתָ כְּ/חָכְמָתֶ֑/ךָ וְ/לֹֽא תוֹרֵ֧ד שֵׂיבָת֛/וֹ בְּ/שָׁלֹ֖ם שְׁאֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: pt
  text: Aja segundo a sua sabedoria e não faça com que ele, já de cabelos brancos, desça em paz ao Sheol.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixe que ele, já de cabelos brancos, desça em paz ao Sheol”.'
    reason: lexical_alternative
  - marker: b
    text: “Sheol” é o termo hebraico para o domínio dos mortos; alternativamente, “a sepultura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Aja
  rationale: O verbo עשה é amplo, mas, nesta incumbência dada por Davi a Salomão, tem força prática e diretiva; “Aja” é conciso e natural.
- source_word: כְּחָכְמָתֶךָ
  choice: segundo a sua sabedoria
  rationale: A preposição כ indica conformidade com o discernimento de Salomão, sem especificar antecipadamente qual ação ele deveria tomar.
- source_word: וְלֹא תוֹרֵד
  choice: não faça com que ... desça
  rationale: O hifil de ירד é causativo, literalmente “não faça descer”. Esta formulação preserva essa força sem tornar a frase excessivamente rígida.
- source_word: שֵׂיבָתוֹ
  choice: ele, já de cabelos brancos
  rationale: שֵׂיבָה pode designar cabelos brancos ou velhice. A formulação portuguesa conserva a imagem da idade avançada e evita a expressão pouco natural “seus cabelos brancos desçam”.
- source_word: בְּשָׁלֹם
  choice: em paz
  rationale: Mantém a construção hebraica e comunica a ideia de morrer sem sofrer a punição ou o acerto de contas pretendido no contexto.
- source_word: שְׁאֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos sem reduzi-lo necessariamente à sepultura física.
theological_decisions:
- issue: Sentido de שְׁאֹל
  choice: Sheol
  alternative: a sepultura; o domínio dos mortos
  rationale: A transliteração mantém a amplitude do termo hebraico e evita decidir se, neste contexto, ele se refere estritamente à sepultura ou, de modo mais amplo, ao domínio dos mortos.
- issue: Força causativa de וְלֹא תוֹרֵד
  choice: não faça com que ... desça
  alternative: não deixe que ... desça
  rationale: A forma causativa do verbo favorece uma ação deliberada de Salomão, embora a alternativa permissiva seja idiomática e possível no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metonímia hebraica dos cabelos brancos foi preservada de maneira natural, e “Sheol” foi mantido com explicação em nota.
