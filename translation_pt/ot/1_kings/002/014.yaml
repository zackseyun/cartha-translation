  text: Then he said[a], “I have something to say to you.” And she said, “Speak.”
translation:
  language: pt
  text: 'Então ele disse[a]: “Tenho algo para dizer a você.” E ela disse: “Fale.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Uma palavra/assunto para mim, para você.” A expressão significa: “Tenho algo para dizer a você.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O wayyiqtol de אָמַר introduz a ação seguinte na sequência narrativa; “Então ele disse” preserva essa progressão de modo natural em português.
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: Tenho algo para dizer a você
  rationale: A construção hebraica, literalmente próxima de “há para mim uma palavra/questão para você”, é uma expressão idiomática que indica que o falante tem algo a comunicar à interlocutora.
- source_word: וַתֹּאמֶר
  choice: E ela respondeu
  rationale: O verbo é literalmente “disse”, mas, no intercâmbio direto, “respondeu” expressa naturalmente a função narrativa sem acrescentar conteúdo.
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo masculino singular de דָּבַר é reproduzido de forma direta, concisa e corrente.
