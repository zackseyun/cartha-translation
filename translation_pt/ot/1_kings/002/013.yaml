base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: pt
  text: 'Então Adonias, filho de Hagite, foi até Bate-Seba, mãe de Salomão. Ela perguntou:


    — Você vem em paz?[a]


    Ele respondeu:


    — Em paz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “A sua vinda é de paz?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi até
  rationale: O verbo בוא pode significar “vir” ou “ir”, conforme o ponto de vista. “Foi até” apresenta de modo natural o deslocamento de Adonias em direção a Bate-Seba.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶן חַגִּית
  choice: filho de Hagite
  rationale: Reproduz de modo direto a construção hebraica que identifica Adonias por sua mãe.
- source_word: בַּת שֶׁבַע
  choice: Bate-Seba
  rationale: Transliteração tradicional e reconhecível do nome em português.
- source_word: אֵם שְׁלֹמֹה
  choice: mãe de Salomão
  rationale: Mantém a identificação apositiva de Bate-Seba e a ênfase narrativa em sua relação com Salomão.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: Você vem em paz?
  rationale: שָׁלוֹם, neste contexto, pergunta pela intenção pacífica da visita. A formulação é natural em português e preserva a cautela presente na fala de Bate-Seba.
- source_word: שָׁלוֹם
  choice: Em paz
  rationale: A resposta elíptica retoma de forma breve as palavras de Bate-Seba, preservando a concisão do hebraico.
