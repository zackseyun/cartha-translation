base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: pt
  text: Então o rei ordenou a Benaia, filho de Joiada. Ele saiu, golpeou-o, e ele morreu. Assim, o reino ficou firmemente estabelecido na mão de Salomão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou firmemente estabelecido sob o domínio de Salomão”. Em hebraico, literalmente, “na mão de Salomão”; a expressão indica posse ou controle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: deu ordem a
  rationale: O verbo צוה expressa uma ordem investida de autoridade. “Deu ordem a” soa natural em português e preserva a autoridade real.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido refere-se a Salomão no contexto e admite tradução direta.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Os nomes são transliterados segundo o uso bíblico corrente em português, e a relação filial é expressa de modo natural.
- source_word: וַיֵּצֵא
  choice: Ele saiu
  rationale: Reproduz diretamente o sentido de יצא e mantém a sequência narrativa.
- source_word: וַיִּפְגַּע בּוֹ
  choice: golpeou-o
  rationale: פגע com ב pode indicar atingir ou atacar. “Golpeou-o” comunica o ato violento sem antecipar a declaração seguinte de que ele morreu.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Mantém explícita a sequência hebraica entre o golpe e seu resultado.
- source_word: וְהַמַּמְלָכָה
  choice: Assim, o reino
  rationale: ממלכה pode designar reino ou domínio real. “Reino” é amplo e natural; “Assim” comunica a força conclusiva ou resultante da cláusula.
- source_word: נָכוֹנָה
  choice: ficou firmemente estabelecido
  rationale: O nifal de כון indica que algo foi firmado, consolidado ou assegurado. O advérbio torna perceptível a ideia de estabilidade presente no hebraico.
- source_word: בְּיַד שְׁלֹמֹה
  choice: nas mãos de Salomão
  rationale: Conserva a imagem hebraica de mão como expressão de posse, poder ou controle, usando a forma idiomática natural em português.
