base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his slaves. Shimei went and brought his slaves back from Gath.
translation:
  language: pt
  text: Então Simei se levantou, selou seu jumento e foi a Gate, a Aquis, procurar seus escravos.[a] Simei foi e trouxe seus escravos de Gate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus servos”. O termo hebraico עֲבָדָיו pode designar servos ou escravos; aqui, “escravos” foi usado porque o contexto destaca sua condição de sujeição e a recuperação dos fugitivos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Traduz naturalmente o verbo קום e preserva a sequência narrativa sem sugerir, de modo mais específico, que ele já partiu.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: selou seu jumento
  rationale: No contexto de preparar um animal para viagem, חבש significa selar ou aparelhar; “selou seu jumento” é preciso e idiomático.
- source_word: גַּתָה
  choice: foi a Gate
  rationale: O ה direcional indica movimento em direção a Gate; em português, a preposição “a” expressa esse destino com naturalidade.
- source_word: אָכִישׁ
  choice: Aquis
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: לְבַקֵּשׁ
  choice: procurar
  rationale: בקש, neste contexto concreto, significa buscar ou procurar pessoas; “procurar” é corrente, claro e não excessivamente solene.
- source_word: עֲבָדָיו
  choice: seus escravos
  rationale: Embora עבד possa designar servo ou escravo, o contexto de fuga e recuperação destaca a condição de sujeição; a nota preserva a alternativa lexical.
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: trouxe seus escravos de Gate
  rationale: O hifil de בוא significa “trazer”. A formulação mantém o ponto de origem expresso no hebraico sem acrescentar explicitamente “de volta”, embora o retorno seja inferido pelo contexto.
