base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: pt
  text: 'Então o rei disse a Simei: “Você mesmo sabe todo o mal que seu coração conhece[a], que você fez contra Davi, meu pai; e Yahweh fez o seu mal recair sobre a sua própria cabeça[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o mal que você sabe em seu coração”. O hebraico diz literalmente que o coração de Simei conhece esse mal, destacando sua consciência íntima da própria culpa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fez voltar” ou “retribuiu”. O verbo hebraico expressa aqui a ideia de fazer o mal de Simei retornar contra ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל שִׁמְעִי
  choice: Então o rei disse a Simei
  rationale: “Então” expressa com naturalidade o avanço da narrativa marcado pelo waw consecutivo; “Simei” é a forma portuguesa tradicional do nome.
- source_word: אַתָּה יָדַעְתָּ
  choice: Você mesmo sabe
  rationale: O pronome explícito אַתָּה dá ênfase ao sujeito; “você mesmo” preserva essa força em português corrente.
- source_word: כָּל הָרָעָה
  choice: todo o mal
  rationale: רָעָה designa aqui a conduta moralmente má de Simei, e não apenas dano ou infortúnio.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: que o seu coração conhece
  rationale: Mantém a personificação hebraica do coração como sede da consciência interior, sem eliminar sua expressividade.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: o mal que fez a Davi, meu pai
  rationale: A repetição de “o mal” esclarece em português o referente da oração relativa e preserva a acusação direta.
- source_word: וְהֵשִׁיב ... אֶת רָעָתְךָ
  choice: fez o seu mal recair
  rationale: O hifil de שׁוב apresenta Yahweh como aquele que faz o mal praticado voltar contra Simei; “fez recair” preserva essa agência e a imagem retributiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּרֹאשֶׁךָ
  choice: sobre a sua própria cabeça
  rationale: Preserva o idioma concreto de culpa e retribuição voltando sobre o autor; “própria” explicita a força reflexiva natural no contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Agência divina na retribuição
  choice: Yahweh fez o seu mal recair sobre a sua própria cabeça
  alternative: Yahweh lhe retribuiu o mal que você fez
  rationale: A formulação mantém a agência divina explícita e a imagem hebraica do mal retornando ao seu autor, sem ampliar a afirmação para além do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala direta conserva a ênfase acusatória, a imagem semítica do coração que conhece e o idioma da retribuição sobre a própria cabeça.
