base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: pt
  text: Então o rei nomeou Benaia, filho de Joiada, para comandar o exército em lugar dele[a]; e o rei nomeou o sacerdote Zadoque em lugar de Abiatar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em lugar dele”; pelo contexto imediato, o pronome se refere a Joabe, o comandante que havia sido destituído.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: nomeou
  rationale: Embora o verbo tenha o sentido básico de dar ou colocar, neste contexto administrativo indica a designação de alguém para um cargo.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Forma portuguesa corrente para o nome e tradução natural da construção patronímica hebraica.
- source_word: תַּחְתָּיו עַל־הַצָּבָא
  choice: para comandar o exército em lugar dele
  rationale: Expressa naturalmente tanto a autoridade sobre o exército quanto a substituição do comandante anterior, sem inserir o nome de Joabe no corpo do texto.
- source_word: צָדוֹק הַכֹּהֵן
  choice: o sacerdote Zadoque
  rationale: Mantém o nome próprio em forma portuguesa corrente e apresenta o título em ordem natural no português.
- source_word: תַּחַת אֶבְיָתָר
  choice: em lugar de Abiatar
  rationale: Preserva diretamente a ideia de substituição no cargo.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do título definido; sua repetição na segunda oração foi mantida em conformidade com o hebraico.
