review_pass:
  verdict: revise
  source_fidelity: A primeira oração traduz bem a proibição judicial de נקה e a confiança de Davi no discernimento de Salomão. Contudo, «Sepultura» reduz desnecessariamente o alcance de שׁאול, que é melhor preservado por «Sheol» com nota. «Os seus cabelos brancos» não reproduz com precisão a expressão idiomática «sua cabeça grisalha», e a construção portuguesa torna os cabelos, em vez do homem, aquilo que desce ao Sheol.
  naturalness: 'O texto é em geral claro e de registro digno. «Faça descer à Sepultura os seus cabelos brancos com sangue», porém, é sintaticamente áspero e semanticamente estranho em português: cabelos não são o referente que desce. «Faça sua cabeça grisalha descer ao Sheol com sangue» preserva a imagem hebraica e a agência causal.'
  terminology: «Não o deixe impune», «homem sábio» e «o que deve fazer com ele» são escolhas adequadas. «Sheol» evita identificar o termo com uma sepultura individual ou impor uma leitura estreita; a nota oferece alternativas lexicais sem resolver a nuance cosmológica.
  issues:
  - severity: medium
    issue: «Sepultura» para שׁאול
    rationale: Embora possa ser uma aproximação contextual, «Sepultura» estreita o termo hebraico, que pode referir-se ao mundo dos mortos, não apenas a uma sepultura. A transliteração «Sheol» preserva melhor a ambiguidade do original.
  - severity: medium
    issue: «os seus cabelos brancos» para שׂיבתו
    rationale: A expressão hebraica é literalmente «sua cabeça grisalha» e funciona como imagem da velhice da pessoa. A redação atual desloca indevidamente o referente para os cabelos e produz uma imagem pouco natural.
  - severity: medium
    issue: Construção «faça descer ... os seus cabelos brancos»
    rationale: Em português, essa sintaxe sugere que apenas os cabelos descem ao Sheol. A construção revisada mantém que Shimei é levado à morte, por meio da imagem de sua cabeça grisalha.
  revised_text: Mas agora não o deixe impune, pois você é um homem sábio e saberá o que deve fazer com ele; faça sua cabeça grisalha descer ao Sheol com sangue.[a]
