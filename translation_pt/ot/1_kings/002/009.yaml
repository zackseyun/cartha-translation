  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: pt
  text: Mas agora não o deixe impune, pois você é um homem sábio e saberá o que deve fazer com ele; faça sua cabeça grisalha descer ao Sheol com sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à sepultura» ou «ao mundo dos mortos».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: não o deixe impune
  rationale: O piel de נקה com sufixo de objeto pode significar declarar inocente, absolver ou deixar sem punição. No contexto, a formulação natural preserva a força judicial da ordem.
- source_word: אִישׁ חָכָם
  choice: um homem sábio
  rationale: Mantém a referência masculina específica a Salomão e traduz diretamente a expressão hebraica.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: e saberá o que deve fazer com ele
  rationale: O perfeito seguido da forma verbal subsequente admite força futura neste contexto. “Deve fazer” comunica a incumbência prudencial e judicial sem tornar explícito além do necessário o meio da punição.
- source_word: וְהוֹרַדְתָּ
  choice: faça descer
  rationale: O hifil de ירד é causativo, “fazer descer”. O imperativo em português expressa naturalmente a força instrutiva da sequência.
- source_word: שֵׂיבָתוֹ
  choice: os seus cabelos brancos
  rationale: Preserva a imagem concreta da velhice presente no substantivo hebraico, sem substituí-la simplesmente por “velhice”.
- source_word: בְּדָם
  choice: com sangue
  rationale: Mantém a expressão abrupta do hebraico, que indica uma morte violenta e sangrenta, sem suavizá-la.
- source_word: שְׁאוֹל
  choice: Sepultura
  rationale: Em português, “Sepultura” com inicial maiúscula funciona como designação do domínio dos mortos e é mais imediatamente compreensível que a transliteração “Sheol”, sem reduzi-la necessariamente a uma sepultura individual.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sepultura
  alternative: Sheol; mundo dos mortos
  rationale: “Sepultura” preserva uma expressão bíblica digna e inteligível, enquanto a nota registra que o termo hebraico pode designar de modo mais amplo o mundo dos mortos, evitando impor uma cosmologia mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para naturalidade brasileira. A construção conserva a severidade e as imagens do hebraico, inclusive “cabelos brancos” e “com sangue”.
