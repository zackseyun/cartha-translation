base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: pt
  text: Então Benaia, filho de Joiada, subiu, feriu-o[a] e o matou; e Joabe foi sepultado em sua casa, no deserto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atacou-o”. O hebraico emprega aqui um verbo para a agressão e, em seguida, outro para a morte; o texto principal mantém as duas ações distintas.'
    reason: lexical_alternative
  - marker: b
    text: “Casa” pode referir-se, em sentido mais amplo, à propriedade ou às terras da família no deserto.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido básico de עלה, “subir”, sem acrescentar ao texto uma ideia explícita de ataque ou oposição.
- source_word: וַיִּפְגַּע בּוֹ
  choice: feriu-o
  rationale: Neste contexto, פגע com ב indica uma ação hostil contra Joabe. “Feriu-o” é natural em português e mantém essa ação distinta do verbo seguinte, que declara a morte.
- source_word: וַיְמִתֵהוּ
  choice: o matou
  rationale: O hifil de מות significa causar a morte. “O matou” comunica com clareza a execução e, em conjunto com “feriu-o”, preserva os dois verbos hebraicos.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: A forma nifal é passiva. O nome “Joabe” é repetido para deixar inequívoca a mudança de sujeito entre a execução realizada por Benaia e o sepultamento.
- source_word: בְּבֵיתוֹ
  choice: junto à sua casa
  rationale: בית pode designar casa, residência ou propriedade familiar. Em um relato de sepultamento, “junto à sua casa” evita sugerir de modo indevido que o corpo foi enterrado dentro do edifício, sem eliminar a amplitude do termo.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מדבר designa uma região desértica ou erma. “Deserto” é claro e corrente em português neste contexto.
