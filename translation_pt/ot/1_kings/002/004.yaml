language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: pt
  text: 'para que Yahweh confirme a palavra que falou a meu respeito[a], dizendo: “Se teus filhos guardarem o seu caminho, andando diante de mim com fidelidade[b], de todo o coração e de toda a alma”, dizendo: “Não te faltará homem algum no trono de Israel[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, segundo uma interpretação contextual tradicional, “falou comigo”. O hebraico diz literalmente “falou a meu respeito”.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico também pode ser traduzido por “com verdade” ou “com integridade”.
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “não te será eliminado homem algum de sobre o trono de Israel”. A expressão significa que não te faltará homem algum no trono.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa de modo natural a finalidade ou o resultado indicado pela construção hebraica.
- source_word: יָקִים
  choice: confirme
  rationale: O hifil de קום comunica aqui a ideia de fazer permanecer ou validar a palavra anteriormente proferida; “confirme” é claro e adequado ao contexto de promessa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: דְּבָרוֹ
  choice: a palavra
  rationale: Preserva o substantivo hebraico e, no contexto, permite ao leitor entender que se trata da promessa divina.
- source_word: דִּבֶּר עָלַי
  choice: falou a meu respeito
  rationale: Representa o sentido normal de עַל com דבר, “falar acerca de”, sem substituir silenciosamente a preposição pela ideia de falar diretamente a alguém.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: cuidarem do caminho deles
  rationale: Mantém tanto a noção de guardar ou observar quanto a metáfora hebraica do “caminho” como modo de vida.
- source_word: לָלֶכֶת לְפָנַי
  choice: andando diante de mim
  rationale: Conserva a metáfora relacional e ética de caminhar perante Deus e apresenta o infinitivo como explicação de como os filhos devem cuidar de seu caminho.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: No contexto de conduta diante de Deus, אֱמֶת denota verdade, firmeza e fidelidade; a escolha é natural em português sem excluir a amplitude lexical, registrada em nota.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: de todo o coração e de toda a alma
  rationale: Formulação idiomática e digna que preserva a totalidade da devoção expressa pelos dois termos hebraicos.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: Nunca lhe faltará um homem no trono de Israel
  rationale: Traduz naturalmente a expressão idiomática hebraica, cujo sentido é a continuidade de um representante masculino da linhagem de Davi no trono; a forma literal é preservada em nota.
- source_word: לֵאמֹר ... לֵאמֹר
  choice: dizendo ... isto é
  rationale: O hebraico emprega לֵאמֹר duas vezes. A segunda ocorrência é representada por “isto é”, que sinaliza a introdução da declaração resultante sem produzir em português a repetição artificial de “dizendo”.
theological_decisions:
- issue: Condicionalidade da promessa davídica
  choice: Manter explicitamente a condição “Se os seus filhos...” ligada à continuidade no trono.
  alternative: Suavizar a condição como simples exortação ou formular a promessa como incondicional.
  rationale: O hebraico apresenta de modo inequívoco uma condição relativa à conduta dos descendentes de Davi. A tradução preserva essa tensão sem harmonizá-la com outras formulações da promessa davídica.
- issue: Referente da fala divina
  choice: “falou a meu respeito”
  alternative: “falou comigo” ou “falou a mim”
  rationale: A preposição עַל favorece o sentido “a respeito de”; a alternativa contextual tradicional é registrada em nota, sem ser incorporada ao texto principal.
- issue: Continuidade dinástica masculina
  choice: “um homem no trono de Israel”
  alternative: “um descendente no trono de Israel”
  rationale: “Homem” preserva o substantivo masculino אִישׁ, enquanto o contexto dinástico esclarece a relação com Davi. A tradução evita ampliar o termo para uma formulação neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva as metáforas hebraicas de “caminho” e “andar diante de” quando elas permanecem inteligíveis, mas traduz idiomaticamente a fórmula dinástica final. A segunda ocorrência de לֵאמֹר é sinalizada por “isto é” para preservar sua função discursiva sem impor uma repetição pouco natural.
