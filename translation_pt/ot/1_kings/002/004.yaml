revisions:
- from: 'para que Yahweh confirme a palavra que falou a meu respeito[a], dizendo: “Se os seus filhos cuidarem do caminho deles, andando diante de mim com fidelidade[b], de todo o coração e de toda a alma”, isto é: “Nunca lhe faltará um homem no trono de Israel[c]”.'
  to: 'para que Yahweh confirme a palavra que falou a meu respeito[a], dizendo: “Se teus filhos guardarem o seu caminho, andando diante de mim com fidelidade[b], de todo o coração e de toda a alma”, dizendo: “Não te faltará homem algum no trono de Israel[c].”'
  rationale: 'A revisão substitui uma expressão portuguesa pouco natural por «guardarem o seu caminho», remove a intensificação não exigida por «nunca», mantém o interlocutor singular na promessa e restitui «dizendo» na segunda fórmula לֵאמֹר. A repetição resultante é deliberada: evita interpretar a segunda introdução de fala como mera explicação. As notas permanecem ancoradas nos mesmos pontos e a nota literal final foi ajustada para português gramaticalmente mais fiel.'
