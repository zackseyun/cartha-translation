source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two slaves of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your slaves are in Gath.”
translation:
  language: pt
  text: 'Ao fim de três anos, dois escravos de Simei fugiram para Aquis, filho de Maaca, rei de Gate. Então disseram a Simei: “Veja, seus escravos estão em Gate.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: Ao fim de três anos
  rationale: Preserva o ponto final do período expresso por מִקֵּץ, em português natural e digno.
- source_word: וַיִּבְרְחוּ
  choice: fugiram
  rationale: 'Expressa de modo direto o sentido de ברח: fugir ou escapar, aqui deixando o senhor.'
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: escravos / seus escravos
  rationale: Embora עבד também possa designar servos, a fuga e a subsequente busca ressaltam neste contexto a condição de escravidão.
- source_word: אֶל אָכִישׁ בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: para Aquis, filho de Maaca, rei de Gate
  rationale: Reproduz a direção do movimento e mantém a identificação patronímica e régia de Aquis.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: Então disseram a Simei
  rationale: O plural hebraico tem sujeito indeterminado. Em português, 'disseram' preserva isso; 'então' dá continuidade narrativa sem acrescentar um advérbio temporal como 'agora'. A fórmula לֵאמֹר é representada naturalmente pela introdução da fala direta.
- source_word: הִנֵּה
  choice: Veja
  rationale: Partícula de chamada de atenção vertida por uma forma atual e imediatamente compreensível.
- source_word: בְּגַת
  choice: em Gate
  rationale: A preposição marca localização dentro ou na cidade de Gate.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os nomes próprios seguem formas portuguesas correntes. A ambiguidade lexical de עבד foi avaliada contextualmente; 'escravos' explicita a condição vinculada que a fuga torna saliente.
