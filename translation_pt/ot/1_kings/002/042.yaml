base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: pt
  text: 'Então o rei mandou chamar Simei e lhe disse: “Não fiz você jurar por Yahweh e não o adverti solenemente[a], dizendo: ‘No dia em que você sair e for a qualquer lugar[b], fique certo de que morrerá’? E você me disse: ‘Está bem o que você disse[c]; eu ouvi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não testemunhei contra você” ou “não lhe dei uma ordem solene”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “para cá ou para lá”, expressão que significa “a qualquer lugar”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “A palavra é boa” ou “O assunto é bom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: fiz você jurar por Yahweh
  rationale: Preserva a força causativa do hifil de שבע e a fórmula de juramento com o nome divino, em português corrente.
- source_word: וָאָעִד בְּךָ
  choice: o adverti solenemente
  rationale: O verbo עוד no hifil pode exprimir advertência, testemunho contra alguém ou uma intimação solene. O advérbio comunica o caráter formal sem impor exclusivamente o sentido forense.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: e for a qualquer lugar
  rationale: Traduz naturalmente o par idiomático de advérbios, literalmente ‘para cá ou para lá’, que indica destino indefinido.
- source_word: יָדֹעַ תֵּדַע
  choice: fique certo
  rationale: Reproduz a intensificação do infinitivo absoluto com o verbo finito, indicando certeza enfática sem repetição artificial em português.
- source_word: מוֹת תָּמוּת
  choice: morrerá
  rationale: A certeza enfática da construção é comunicada pelo contexto de ‘fique certo de que’; evita-se duplicar a intensificação de modo pouco natural.
- source_word: טוֹב הַדָּבָר
  choice: O que você disse está certo
  rationale: דבר pode ser ‘palavra’, ‘declaração’ ou ‘assunto’. Aqui se refere à condição enunciada pelo rei; a formulação escolhida é clara e idiomática.
- source_word: שָׁמָעְתִּי
  choice: eu ouvi
  rationale: Mantém o sentido lexical direto, sem converter implicitamente ‘ouvir’ em ‘obedecer’ ou ‘aceitar’.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. ‘Yahweh’ preserva o nome próprio da aliança e segue a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por ‘você’ torna a fala direta natural; ‘adverti solenemente’ conserva o peso judicial. As notas preservam alternativas lexicais genuínas do hebraico.
