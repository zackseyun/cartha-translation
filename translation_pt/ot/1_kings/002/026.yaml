base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: pt
  text: 'Ao sacerdote Abiatar, o rei disse: “Vá para Anatote, para o seu campo, pois você merece morrer.[a] Contudo, hoje não o matarei, porque você carregou a arca do Senhor Yahweh diante de Davi, meu pai, e porque sofreu em tudo aquilo que meu pai sofreu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “você é homem de morte”, isto é, alguém sujeito à pena de morte.'
    reason: Explica o idiomatismo hebraico preservando sua forma literal como alternativa lexical.
lexical_decisions:
- source_word: עֲנָתֹת
  choice: Anatote
  rationale: Forma portuguesa tradicional e reconhecível do nome do lugar.
- source_word: עַל שָׂדֶיךָ
  choice: para o seu campo
  rationale: Preserva a imagem concreta de שָׂדֶה e expressa naturalmente o envio de Abiatar de volta à sua propriedade em Anatote.
- source_word: אִישׁ מָוֶת
  choice: você merece morrer
  rationale: Comunica em português atual o sentido jurídico do idiomatismo hebraico, isto é, alguém sujeito à pena de morte; a forma literal é registrada em nota.
- source_word: אֲמִיתֶךָ
  choice: não o matarei
  rationale: O hifil de מות significa causar a morte ou executar; no contexto, a declaração é judicial, mas a formulação concisa soa natural em português.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: você carregou a arca do Senhor Yahweh
  rationale: נשא descreve o ato de carregar a arca. A tradução mantém os dois elementos do título hebraico, אֲדֹנָי e יְהוִה, distinguindo o título do nome divino.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: diante de Davi, meu pai
  rationale: דiante de expressa de modo conciso o valor espacial e relacional de לִפְנֵי.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: sofreu em tudo aquilo que meu pai sofreu
  rationale: Mantém a repetição deliberada das duas formas do mesmo verbo e comunica a participação de Abiatar nos sofrimentos de Davi.
- source_word: כִּי ... וְכִי
  choice: porque ... e porque
  rationale: As duas orações apresentam razões paralelas para a clemência de Salomão.
theological_decisions:
- issue: Forma do título composto אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: Mantém separadamente o título אֲדֹנָי e o nome divino יְהוִה, sem produzir a combinação pouco clara “Senhor SENHOR”.
- issue: Sentido de אִישׁ מָוֶת
  choice: você merece morrer
  alternative: você é homem de morte
  rationale: A expressão indica responsabilidade passível de morte, não afirma que Abiatar já esteja morto nem resolve além do texto a base exata da sentença.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para clareza. A sintaxe preserva o paralelismo causal e a repetição do verbo “sofrer”, evitando linguagem excessivamente arcaica.
