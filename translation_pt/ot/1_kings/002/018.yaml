  text: וַ/תֹּ֥אמֶר בַּת שֶׁ֖בַע ט֑וֹב אָנֹכִ֕י אֲדַבֵּ֥ר עָלֶ֖י/ךָ אֶל הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/018.yaml
  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: pt
  text: 'Bate-Seba respondeu: “Está bem. Falarei ao rei em seu favor[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a seu respeito” ou “por você”. A expressão hebraica pode indicar falar acerca de alguém e, neste contexto, provavelmente implica interceder por Adonias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: respondeu
  rationale: Embora אמר normalmente seja traduzido por “disse”, aqui a fala responde diretamente ao pedido de Adonias; “respondeu” é natural em português e mantém a função narrativa.
- source_word: בַּת שֶׁבַע
  choice: Bate-Seba
  rationale: Forma tradicional e amplamente reconhecida do nome em português, transliterada em vez de traduzida literalmente.
- source_word: טוֹב
  choice: Está bem
  rationale: Neste diálogo, טוֹב expressa concordância breve. “Está bem” soa natural em português e preserva a concisão.
- source_word: אָנֹכִי
  choice: '[sujeito implícito em “Falarei”]'
  rationale: O pronome independente explicita o sujeito em hebraico; em português, a primeira pessoa já é indicada de modo claro pela flexão verbal, sem necessidade de “eu”.
- source_word: אֲדַבֵּר
  choice: Falarei
  rationale: Tradução direta do piel imperfeito de דבר, sem explicitar como “pedido” aquilo que o contexto apenas sugere.
- source_word: עָלֶיךָ
  choice: em seu favor
  rationale: A expressão pode significar falar acerca de alguém ou em seu benefício. No contexto de intercessão diante do rei, “em seu favor” comunica naturalmente o sentido mais provável, enquanto a nota preserva a amplitude lexical.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: Equivalente português natural da expressão direcional “ao rei”; “rei” permanece em minúscula por designar o cargo real.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A fala é concisa como no hebraico; a ambiguidade de עָלֶיךָ é preservada em nota.
