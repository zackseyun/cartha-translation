id: 1KI.2.32
reference: 1 Kings 2:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: pt
  text: 'E Yahweh fará o sangue dele recair sobre a sua própria cabeça[a], porque ele atacou dois homens mais justos e melhores do que ele e os matou à espada, sem que meu pai Davi soubesse: Abner, filho de Ner, comandante do exército de Israel, e Amasa, filho de Jéter, comandante do exército de Judá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fará a culpa de sangue dele recair sobre a sua cabeça”. A expressão hebraica indica que a responsabilidade pelo sangue derramado recai sobre o culpado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: fará ... recair
  rationale: O hifil de שׁוב expressa aqui retribuição, fazendo o sangue ou a culpa de sangue voltar sobre o responsável. A formulação preserva a imagem hebraica e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דָּמוֹ עַל רֹאשׁוֹ
  choice: o sangue dele recair sobre a sua própria cabeça
  rationale: Preserva a expressão idiomática hebraica de responsabilidade e retribuição pelo sangue derramado. A nota esclarece que também pode ser entendida explicitamente como culpa de sangue.
- source_word: פָּגַע
  choice: atacou
  rationale: No contexto, o verbo indica uma investida hostil contra os dois homens; a morte é declarada de modo explícito no verbo seguinte.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: mais justos e melhores do que ele
  rationale: Mantém os dois qualificativos e sua construção comparativa, sem reduzir צַדִּיקִים apenas a inocência jurídica.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: e os matou à espada
  rationale: Tradução direta e corrente da ação e do instrumento.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: sem que meu pai Davi soubesse
  rationale: Representa naturalmente o valor circunstancial da conjunção e indica que Davi não tinha conhecimento dos assassinatos.
- source_word: שַׂר צְבָא
  choice: comandante do exército
  rationale: Equivalente moderno e claro do título militar, aplicado de modo consistente a Israel e Judá.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. A transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido da expressão do sangue sobre a cabeça
  choice: Preservar a imagem de o sangue recair sobre a própria cabeça, com esclarecimento em nota
  alternative: 'Explicitar no corpo do texto: fará a culpa de sangue recair sobre a cabeça dele'
  rationale: A expressão comunica responsabilidade pelo derramamento de sangue e retribuição divina. Manter a imagem no texto conserva a força do hebraico, enquanto a nota evita uma leitura meramente física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a coordenação e a solenidade do discurso, mas emprega títulos militares e construções idiomáticas atuais.
