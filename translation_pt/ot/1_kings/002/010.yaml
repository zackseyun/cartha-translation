  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: pt
  text: Então Davi descansou com seus antepassados[a] e foi sepultado na Cidade de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deitou-se com seus pais”, expressão tradicional para indicar a morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No obituário régio, שׁכב integra uma expressão convencional para morrer. “Descansou” mantém uma imagem eufemística natural em português sem reduzir a expressão simplesmente a “morreu”.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: Embora אָבוֹת signifique literalmente “pais”, nesta fórmula refere-se aos antepassados falecidos. “Antepassados” comunica esse sentido com clareza no português atual.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: O nifal expressa aqui a voz passiva; “foi sepultado” é uma equivalência direta, digna e natural.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Preserva a designação tradicional e reconhecível do local como nome próprio.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
