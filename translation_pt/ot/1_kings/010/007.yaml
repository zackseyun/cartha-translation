base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: pt
  text: Mas eu não acreditei nos relatos até que vim e vi com meus próprios olhos. E eis que não me contaram nem a metade. Você superou o relato que eu tinha ouvido em sabedoria e prosperidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sabedoria e riqueza”. A palavra hebraica טוֹב pode indicar bem-estar ou prosperidade em sentido amplo e, neste contexto, pode incluir a riqueza como parte do florescimento de Salomão.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: não acreditei
  rationale: O hifil de אמן significa aqui considerar algo verdadeiro ou digno de crédito. “Não acreditei” expressa de modo direto a reação da rainha aos relatos.
- source_word: לַדְּבָרִים
  choice: nos relatos
  rationale: Embora דְּבָרִים possa significar literalmente “palavras” ou “coisas”, o contexto aponta para as informações transmitidas acerca de Salomão; “relatos” comunica esse sentido naturalmente.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: vi com meus próprios olhos
  rationale: A expressão hebraica diz literalmente “meus olhos viram”. A formulação portuguesa preserva a ênfase na comprovação pessoal.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: הִנֵּה introduz surpresa e ênfase. “E eis que” conserva essa força retórica em registro bíblico digno e compreensível.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: não me contaram nem a metade
  rationale: A forma idiomática portuguesa mantém a voz indefinida do hebraico e explicita adequadamente a ênfase da negação.
- source_word: הוֹסַפְתָּ
  choice: você superou
  rationale: Nesta construção comparativa com אֶל, יסף comunica exceder ou ir além. O passado “superou” corresponde ao valor contextual da forma verbal hebraica.
- source_word: חָכְמָה וָטוֹב
  choice: sabedoria e prosperidade
  rationale: חָכְמָה é “sabedoria”; טוֹב, no contexto do êxito e esplendor reais, pode designar bem-estar ou prosperidade, sem se limitar à bondade moral nem somente à riqueza.
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: o relato que eu tinha ouvido
  rationale: שְׁמוּעָה denota notícia ou relato ouvido. O mais-que-perfeito composto deixa clara, em português, a anterioridade do relato em relação à visita.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se “e eis que” para conservar a surpresa marcada por הִנֵּה, enquanto o restante da frase emprega sintaxe corrente. O marcador da nota foi colocado junto a “prosperidade”, termo ao qual a alternativa lexical se refere.
