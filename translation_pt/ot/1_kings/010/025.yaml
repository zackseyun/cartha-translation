base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: pt
  text: 'E eles traziam, cada um, o seu tributo[a]: objetos de prata, objetos de ouro, vestes[b], armas[c], especiarias, cavalos e mulas, ano após ano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu presente” ou “a sua oferta”. O termo hebraico pode indicar presente, oferta ou tributo; “tributo” corresponde ao contexto régio.
    reason: lexical_alternative
  - marker: b
    text: Ou “mantos” ou “túnicas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “armaduras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: trazia
  rationale: O particípio, reforçado por הֵמָּה e pelo contexto de repetição, indica ação habitual; o pretérito imperfeito português expressa isso naturalmente.
- source_word: אִישׁ מִנְחָתוֹ
  choice: cada um o seu tributo
  rationale: אִישׁ tem sentido distributivo, e מִנְחָה, no contexto régio, designa uma dádiva apresentada ao rei; “tributo” comunica adequadamente esse contexto, sem excluir por nota as alternativas “presente” ou “oferta”.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: objetos de prata, objetos de ouro
  rationale: כְּלִי é amplo e pode indicar objeto, utensílio ou recipiente; “objetos” evita restringir indevidamente a natureza dos artigos e mantém o paralelismo.
- source_word: שְׂלָמוֹת
  choice: vestes
  rationale: O termo se refere a peças de vestuário, possivelmente mantos ou túnicas; “vestes” é digno, claro e suficientemente abrangente.
- source_word: נֵשֶׁק
  choice: armas
  rationale: O termo denota equipamento militar e pode, conforme a compreensão lexical, abranger armamento ou armadura; “armas” é a opção mais natural no texto principal.
- source_word: בְשָׂמִים
  choice: especiarias
  rationale: Designa substâncias aromáticas usadas em comércio e como presentes; “especiarias” é corrente e preserva a amplitude contextual.
- source_word: סוּסִים וּפְרָדִים
  choice: cavalos e mulas
  rationale: Equivalentes portugueses diretos e naturais dos termos hebraicos.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: ano após ano
  rationale: A expressão idiomática indica recorrência anual; “ano após ano” preserva a repetição enfática e soa natural em português.
