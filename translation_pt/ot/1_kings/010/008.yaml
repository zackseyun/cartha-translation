  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: pt
  text: Felizes são os seus homens! Felizes são estes seus servos, que permanecem continuamente diante de você e ouvem a sua sabedoria!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Felizes são
  rationale: Expressa uma condição invejável de felicidade e bem-estar. A formulação mantém o tom elevado da aclamação sem sugerir necessariamente uma bênção formal pronunciada por Deus.
- source_word: אֲנָשֶׁיךָ
  choice: os seus homens
  rationale: O substantivo masculino plural refere-se naturalmente aos homens da corte de Salomão. A tradução preserva a referência masculina explícita do hebraico.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: No contexto da corte real, designa pessoas a serviço do rei, possivelmente oficiais ou assistentes. “Servos” comunica melhor essa função aqui do que “escravos”.
- source_word: אֵלֶּה
  choice: estes
  rationale: Preserva o demonstrativo proximal e aponta para os servos presentes ou em vista.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: que estão diante de você
  rationale: Mantém a imagem concreta de permanecer perante o rei, expressão que também implica servi-lo e estar à sua disposição.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Indica presença ou serviço regular e persistente, sem exigir a ideia absoluta de cada instante.
- source_word: הַשֹּׁמְעִים
  choice: e ouvem
  rationale: Reproduz a descrição participial dos servos como aqueles que têm acesso constante à sabedoria expressa pelo rei.
- source_word: חָכְמָתֶךָ
  choice: a sua sabedoria
  rationale: Traduz diretamente o objeto hebraico sem acrescentar uma referência explícita às palavras ou aos conselhos de Salomão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição enfática de “Felizes são” para refletir a estrutura hebraica. “Você” oferece ampla legibilidade brasileira sem introduzir no texto um título de tratamento ausente no original.
