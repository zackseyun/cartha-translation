base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: pt
  text: Quando a rainha de Sabá viu toda a sabedoria de Salomão e a casa que ele havia construído,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o palácio que ele havia construído”. A palavra hebraica traduzida como “casa” pode referir-se, neste contexto, a uma residência real.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quando ... viu
  rationale: A forma narrativa dá continuidade ao relato e, neste contexto, introduz uma oração temporal cuja sequência prossegue no versículo seguinte.
- source_word: מַלְכַּת שְׁבָא
  choice: a rainha de Sabá
  rationale: A construção hebraica identifica a soberana de Sabá; a formulação é natural e tradicional em português.
- source_word: אֵת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Marca o objeto direto definido em hebraico e não exige palavra correspondente em português.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: toda a sabedoria de Salomão
  rationale: Preserva a ideia de totalidade e a relação construta do hebraico em português claro e natural.
- source_word: וְהַבַּיִת
  choice: e a casa
  rationale: “Casa” traduz de modo transparente בַּיִת, embora neste contexto régio a palavra possa designar o palácio.
- source_word: אֲשֶׁר בָּנָה
  choice: que ele havia construído
  rationale: A oração relativa modifica “casa”; o pretérito mais-que-perfeito composto expressa naturalmente que a construção já estava concluída quando a rainha a viu.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A frase permanece aberta, acompanhando a sintaxe que continua no versículo seguinte; “casa” conserva a transparência lexical, enquanto “palácio” aparece como alternativa contextual na nota.
