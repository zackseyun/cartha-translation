id: 1KI.10.11
reference: 1 Kings 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם֙ אֳנִ֣י חִירָ֔ם אֲשֶׁר נָשָׂ֥א זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֨יא מֵ/אֹפִ֜יר עֲצֵ֧י אַלְמֻגִּ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֥בֶן יְקָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: pt
  text: Além disso, a frota de Hirão[a], que transportava ouro de Ofir, trouxe de Ofir uma enorme quantidade de madeira de almugue[b] e pedras preciosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o navio de Hirão”; o substantivo hebraico está no singular, mas pode ter sentido coletivo e se referir à atividade marítima de Hirão.
    reason: lexical_alternative
  - marker: b
    text: Também se pode dizer “madeira de algum”; não se sabe ao certo de que espécie de madeira se tratava.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Expressa de modo natural a força aditiva da expressão hebraica e liga o versículo ao relato anterior.
- source_word: אֳנִי חִירָם
  choice: a frota de Hirão
  rationale: Embora אֳנִי esteja no singular, o contexto permite entendê-lo coletivamente como o transporte marítimo ligado a Hirão; a nota preserva a leitura formalmente singular.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: que transportava ouro
  rationale: O verbo נָשָׂא significa carregar ou levar; “transportava” é natural no contexto de carga marítima.
- source_word: מֵאוֹפִיר
  choice: de Ofir
  rationale: Mantém a preposição de origem e a forma portuguesa corrente do topônimo.
- source_word: הֵבִיא
  choice: trouxe
  rationale: Reproduz de maneira direta e idiomática o sentido causativo de בוא no hifil.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: madeira de almugue
  rationale: Preserva o nome hebraico tradicional sem identificar de modo especulativo a espécie botânica.
- source_word: הַרְבֵּה מְאֹד
  choice: uma enorme quantidade
  rationale: Comunica naturalmente a forte ênfase de abundância presente na combinação hebraica.
- source_word: וְאֶבֶן יְקָרָה
  choice: e pedras preciosas
  rationale: O singular hebraico pode ter sentido coletivo; o plural é a forma natural em português para uma categoria de carga.
