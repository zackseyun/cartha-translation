  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: pt
  text: O rei tornou a prata tão comum em Jerusalém quanto as pedras e tornou os cedros tão abundantes quanto as figueiras-sicômoros[a] que há na Sefelá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sicômoros”; refere-se às figueiras-sicômoros.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na região baixa”. A Sefelá é a região de colinas baixas da Judeia, situada entre a região montanhosa e a planície costeira.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: tornou ... tão comum / tornou ... tão abundantes
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, aqui a construção expressa que o rei fez essas coisas se tornarem comuns ou abundantes. A formulação portuguesa preserva esse sentido causativo e as duas comparações.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: O hebraico diz literalmente “o rei”. O contexto identifica Salomão, mas o versículo não repete seu nome.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: O substantivo designa a prata como metal precioso e mercadoria; o artigo é natural em português nesta construção.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução locativa direta do nome geográfico.
- source_word: כָּאֲבָנִים
  choice: tão comum ... quanto as pedras
  rationale: 'O prefixo כ marca comparação. A explicitação de “comum” transmite naturalmente o valor idiomático: a prata se encontrava com a mesma facilidade que pedras.'
- source_word: הָאֲרָזִים
  choice: os cedros
  rationale: Preserva o plural concreto do hebraico, sem restringi-lo explicitamente a árvores vivas ou madeira, ambiguidade que o contexto permite.
- source_word: כַּשִּׁקְמִים
  choice: quanto as figueiras-sicômoros
  rationale: שקמים designa os sicômoros do Levante, isto é, figueiras-sicômoros, e não necessariamente as árvores chamadas simplesmente de sicômoros em outros contextos modernos.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: que há na Sefelá
  rationale: Sefelá é o nome geográfico da região de colinas baixas da Judeia. O presente “há” corresponde à formulação nominal hebraica e apresenta uma característica conhecida da região.
- source_word: לָרֹב
  choice: tão abundantes
  rationale: A expressão indica grande quantidade. Integrá-la à comparação produz português natural sem perder a ideia de abundância.
theological_decisions: []
