base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/003.yaml
  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: pt
  text: Salomão respondeu a todas as perguntas dela[a]; não houve nada oculto ao rei que ele não lhe explicasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Salomão lhe expôs todos os assuntos dela”. No contexto, isso se refere às respostas de Salomão às perguntas da rainha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: respondeu
  rationale: Embora o verbo normalmente signifique “contar” ou “declarar”, aqui descreve a resposta de Salomão às questões difíceis apresentadas pela rainha (v. 1).
- source_word: דְּבָרֶיהָ
  choice: a todas as perguntas dela
  rationale: דבר pode significar “palavra”, “assunto” ou “coisa”; no contexto da prova feita pela rainha, refere-se às perguntas que ela apresentou.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם מִן־הַמֶּלֶךְ
  choice: não houve nada oculto ao rei
  rationale: Mantém a imagem hebraica de algo oculto e traduz מן de modo natural com o adjetivo português “oculto”.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: que ele não lhe explicasse
  rationale: O segundo uso de נגד indica que Salomão tornou cada assunto compreensível para ela; “explicasse” evita a repetição pouco natural de “respondeu” e expressa adequadamente a divulgação da resposta.
