  text: וַ/יַּ֨עַשׂ הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מָאתַ֥יִם צִנָּ֖ה זָהָ֣ב שָׁח֑וּט שֵׁשׁ מֵא֣וֹת זָהָ֔ב יַעֲלֶ֖ה עַל הַ/צִּנָּ֥ה הָ/אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: pt
  text: O rei Salomão fez duzentos escudos grandes de ouro batido[b]; em cada escudo foram usados seiscentos siclos de ouro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seiscentos de ouro subia sobre um escudo”; “siclos” está subentendido como unidade de peso.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico empregado aqui indica um escudo grande, provavelmente distinto dos escudos menores mencionados no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo comum עשה indica aqui a confecção dos objetos; “fez” é natural, claro e fiel.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: o rei Salomão
  rationale: Mantém o título e o nome em ordem natural no português.
- source_word: מָאתַיִם
  choice: duzentos
  rationale: Correspondência direta do numeral cardinal.
- source_word: צִנָּה
  choice: escudos grandes
  rationale: צִנָּה provavelmente designa um escudo de grandes dimensões, distinto do termo empregado para os escudos menores no versículo seguinte.
- source_word: זָהָב שָׁחוּט
  choice: ouro batido
  rationale: שָׁחוּט descreve o ouro trabalhado a golpes, provavelmente em lâminas; “ouro batido” preserva o processo sem especificar além do texto.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: seiscentos siclos de ouro
  rationale: O hebraico traz literalmente “seiscentos de ouro”, omitindo a unidade de peso; “siclos” é a unidade convencionalmente subentendida e é explicitada para tornar a frase compreensível.
- source_word: יַעֲלֶה עַל
  choice: foram usados ... em
  rationale: A expressão literal “subia sobre” indica a quantidade de ouro aplicada a cada escudo. A formulação escolhida comunica naturalmente a função quantitativa em português.
- source_word: הַצִּנָּה הָאֶחָת
  choice: em cada escudo
  rationale: 'Embora a forma seja literalmente “sobre o escudo, o único/um”, o contexto exige sentido distributivo: essa quantidade correspondia a cada um dos duzentos escudos.'
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução prioriza equivalência ótima: conserva “ouro batido” e a distinção provável entre tipos de escudo, mas expressa de modo idiomático a quantidade de ouro aplicada a cada peça.'
