  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “Casa da Floresta do Líbano” preserva a designação tradicional do edifício, e “não era considerada coisa alguma” mantém o vigor do idioma hebraico sem explicar além do texto.
