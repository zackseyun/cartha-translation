source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: pt
  text: Todos os utensílios para bebidas do rei Salomão eram de ouro, e todos os utensílios da Casa da Floresta do Líbano eram de ouro puro[a]. A prata não era considerada coisa alguma nos dias de Salomão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouro refinado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “A prata não era considerada de valor algum nos dias de Salomão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: utensílios para bebidas
  rationale: Mantém a amplitude de כְּלֵי, sem limitar o sentido a “taças”, e expressa naturalmente em português que eram objetos destinados a servir ou consumir bebidas.
- source_word: זָהָב
  choice: ouro
  rationale: É o termo material direto e preserva a repetição enfática do hebraico.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Casa da Floresta do Líbano
  rationale: Conserva a forma hebraica e o caráter de nome próprio desse edifício real, sem substituí-lo interpretativamente por “palácio”.
- source_word: זָהָב סָגוּר
  choice: ouro puro
  rationale: Comunica de modo corrente a ideia de ouro de alta qualidade ou purificado; evita “ouro maciço”, que poderia enfatizar composição em vez de qualidade.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: não era considerada coisa alguma
  rationale: 'Preserva a formulação avaliativa e enfática do hebraico: a prata não tinha importância ou valor comparável naquele período.'
- source_word: בִּימֵי שְׁלֹמֹה
  choice: nos dias de Salomão
  rationale: Reproduz com naturalidade e dignidade a expressão temporal hebraica.
theological_decisions: []
