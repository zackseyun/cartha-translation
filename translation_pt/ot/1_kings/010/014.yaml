  text: וַֽ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכַּ֥ר זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: pt
  text: O peso do ouro que chegou a Salomão em um ano foi de seiscentos e sessenta e seis talentos de ouro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O talento era uma grande unidade de peso; o versículo informa a quantidade anual segundo a medida antiga, sem convertê-la em unidades modernas.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: foi
  rationale: A forma narrativa introduz a declaração contábil; em português moderno, o verbo copulativo transmite a frase naturalmente, sem acrescentar um marcador temporal inexistente.
- source_word: מִשְׁקַל
  choice: peso
  rationale: O substantivo designa peso ou medida e, neste contexto de registro, corresponde diretamente a “peso”.
- source_word: הַזָּהָב ... זָהָב
  choice: do ouro ... de ouro
  rationale: A primeira ocorrência identifica a mercadoria definida, e a segunda especifica de que material eram os talentos.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: que chegou a Salomão
  rationale: בוא com ל indica aquilo que chegou a Salomão, sem especificar se foi trazido por alguém ou acumulado de outra maneira.
- source_word: בְּשָׁנָה אֶחָת
  choice: em um ano
  rationale: Expressa a quantidade recebida no período de um ano e permanece próxima da formulação hebraica.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: seiscentos e sessenta e seis
  rationale: É a forma cardinal direta e idiomática em português.
- source_word: כִּכַּר
  choice: talentos
  rationale: כִּכָּר é uma antiga unidade de peso tradicionalmente chamada “talento”; preservá-la evita uma conversão moderna incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção contábil natural. A tradução conserva a unidade antiga e evita acrescentar um marcador discursivo como “ora” ou “então”.
