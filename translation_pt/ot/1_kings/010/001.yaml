  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: pt
  text: A rainha de Sabá ouviu falar da fama de Salomão em relação ao nome de Yahweh[a] e veio pô-lo à prova com enigmas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do relato sobre Salomão ligado ao nome de Yahweh”. A expressão hebraica é compacta e pode indicar que a fama de Salomão estava associada ao nome ou à reputação de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com perguntas difíceis”. O hebraico se refere mais literalmente a enigmas ou questões enigmáticas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: A rainha de Sabá
  rationale: O waw introduz a continuação narrativa, mas não exige um conectivo explícito em português. A construção hebraica é diretamente representada por “a rainha de Sabá”.
- source_word: שֹׁמַעַת אֶת־שֵׁמַע שְׁלֹמֹה
  choice: ouviu falar da fama de Salomão
  rationale: שֵׁמַע pode indicar notícia, relato ou fama. A expressão portuguesa comunica naturalmente que a reputação de Salomão chegou aos ouvidos da rainha.
- source_word: לְשֵׁם יְהוָה
  choice: em relação ao nome de Yahweh
  rationale: A formulação hebraica é compacta e sintaticamente aberta. “Em relação ao” preserva a ligação entre a fama de Salomão e o nome de Yahweh sem determinar se a relação é causal, temática ou de finalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַתָּבֹא לְנַסֹּתוֹ
  choice: e veio pô-lo à prova
  rationale: O verbo נסה significa testar ou pôr à prova. A formulação é natural em português e se ajusta ao exame da sabedoria de Salomão.
- source_word: בְּחִידוֹת
  choice: com enigmas
  rationale: חִידוֹת designa enigmas, ditos obscuros ou questões enigmáticas. “Enigmas” conserva o sentido lexical sem reduzi-lo simplesmente a perguntas difíceis.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Relação entre a fama de Salomão e o nome de Yahweh
  choice: em relação ao nome de Yahweh
  alternative: por causa do nome de Yahweh; ligada ao nome de Yahweh
  rationale: A preposição לְ permite mais de uma compreensão nesta frase compacta. A tradução mantém a relação sem afirmar de modo conclusivo causa, propósito ou natureza exata da associação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A frase preserva a ambiguidade da relação expressa por לְשֵׁם e usa “enigmas” como equivalente lexical direto, esclarecido por nota.
