  text: וַ/יִּגְדַּל֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מִ/כֹּ֖ל מַלְכֵ֣י הָ/אָ֑רֶץ לְ/עֹ֖שֶׁר וּ/לְ/חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/023.yaml
  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: pt
  text: Assim, o rei Salomão superou todos os reis da terra em riqueza e sabedoria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E o rei Salomão tornou-se maior do que todos os reis da terra em riqueza e sabedoria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: superou
  rationale: Na construção comparativa com מִן, o verbo גדל indica que Salomão se tornou ou mostrou-se maior que os demais. “Superou” expressa essa comparação de modo claro e natural, sem intensificá-la indevidamente.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: o rei Salomão
  rationale: A forma portuguesa usual de apresentar o título definido seguido do nome próprio preserva com naturalidade a aposição hebraica.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: todos os reis da terra
  rationale: Embora אֶרֶץ possa significar “terra”, “país” ou “território”, aqui o contexto de comparação internacional favorece o sentido amplo “terra”, sem exigir a formulação mais expansiva “mundo”.
- source_word: לְעֹשֶׁר
  choice: em riqueza
  rationale: עֹשֶׁר designa riqueza material; a preposição “em” encaixa-se naturalmente na comparação expressa por “superou”.
- source_word: וּלְחָכְמָה
  choice: e sabedoria
  rationale: חָכְמָה significa “sabedoria”. Em português, a preposição compartilhada em “em riqueza e sabedoria” preserva a coordenação do hebraico sem repetição desnecessária.
- source_word: וַ
  choice: Assim
  rationale: O waw dá continuidade à narrativa e, neste resumo, pode ter valor conclusivo ou resultativo. “Assim” torna essa relação discursiva clara em português corrente.
