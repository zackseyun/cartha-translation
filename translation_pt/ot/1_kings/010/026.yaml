source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּֽרָשִׁ֑ים וַ/יַּנְחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: pt
  text: Salomão reuniu carros de guerra e cavaleiros[a]. Ele tinha 1.400 carros de guerra e 12.000 cavaleiros e os estacionou nas cidades dos carros de guerra e junto ao rei, em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cavalaria”; o hebraico se refere mais literalmente a cavaleiros montados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: O verbo אסף indica aqui reunir ou acumular recursos militares; “reuniu” é natural e mantém o sentido do hebraico.
- source_word: רֶכֶב
  choice: carros de guerra
  rationale: Embora a forma singular possa ter sentido coletivo, o contexto numérico exige uma referência concreta aos carros; “carros de guerra” evita a ambiguidade moderna de “carros”.
- source_word: פָרָשִׁים
  choice: cavaleiros
  rationale: O substantivo designa propriamente homens montados, e não simplesmente os cavalos; “cavaleiros” conserva esse sentido sem impor a organização coletiva sugerida por “cavalaria”.
- source_word: וַיְהִי לוֹ
  choice: Ele tinha
  rationale: A construção idiomática hebraica expressa posse; “tinha” é o equivalente português mais claro e natural.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1.400 carros de guerra
  rationale: A expressão numérica é vertida diretamente, usando a convenção portuguesa de ponto para separar milhares.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12.000 cavaleiros
  rationale: A quantidade é traduzida diretamente, mantendo “cavaleiros” para a mesma palavra hebraica usada antes.
- source_word: וַיַּנְחֵם
  choice: que colocou
  rationale: No hifil, נוח pode significar fazer repousar, instalar ou colocar. “Colocou” preserva a amplitude do verbo e funciona naturalmente no contexto da distribuição desses recursos militares.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: nas cidades dos carros de guerra
  rationale: A expressão se refere a cidades destinadas ou associadas aos carros militares; esta formulação é clara em português sem criar um termo técnico pouco natural.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: e junto ao rei, em Jerusalém
  rationale: A tradução segue diretamente a localização indicada no hebraico, sem explicitar além do texto que apenas parte das forças permanecia ali.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Carros de guerra” esclarece o referente antigo, enquanto “cavaleiros” mantém a imagem concreta do hebraico. A repetição de “carros de guerra” é preservada por precisão, e os algarismos seguem a convenção gráfica portuguesa.
