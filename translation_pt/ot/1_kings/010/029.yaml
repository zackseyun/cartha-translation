translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação comercial é natural, mas as notas preservam os verbos de movimento e o idiomatismo hebraico. “Esses bens” esclarece o referente plural — carruagens e cavalos — sem alterar o conteúdo.
