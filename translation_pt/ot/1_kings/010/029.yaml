  source_fidelity: A tradução capta corretamente o contexto comercial de וַתַּעֲלֶה וַתֵּצֵא e de יֹצִיאוּ, bem como os preços, os hititas e Arã. Contudo, os imperfeitos passivos («era importada», «eram exportados») enfraquecem a sequência narrativa marcada pelos verbos hebraicos com vav consecutivo. Além disso, «por intermédio deles» fica com antecedente excessivamente indefinido e a nota correspondente está ancorada em «Arã», embora explique primariamente essa expressão.
  naturalness: «Carruagem», «siclos de prata» e «Arã» são naturais e adequados. O pretérito perfeito torna a narrativa mais idiomática neste contexto. A redação revista conserva a agência indeterminada do hebraico sem criar um agente identificável que o versículo não nomeia.
  terminology: «Siclos de prata» é uma explicitação justificável da unidade subentendida; «cavalo» não restringe indevidamente o sentido; «reis dos hititas» e «reis de Arã» preservam as designações do hebraico. «Carruagem» é aceitável para מֶרְכָּבָה no registro bíblico atual.
