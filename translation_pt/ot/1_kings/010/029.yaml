base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: pt
  text: Uma carruagem foi importada do Egito por seiscentos siclos de prata, e um cavalo, por cento e cinquenta siclos de prata.[a][b] E assim eles os exportavam para todos os reis dos hititas e para os reis de Arã,[c] por intermédio deles.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente «seiscentos de prata»; «siclos» é a unidade subentendida. O cavalo custava cento e cinquenta siclos de prata.
    reason: implicit_unit
  - marker: b
    text: 'Ou: «foi levada do Egito». O hebraico emprega verbos de movimento que, neste contexto comercial, se referem à importação.'
    reason: lexical_alternative
  - marker: c
    text: «Arã» também pode designar os arameus; tradicionalmente, «Síria».
    reason: name_clarification
  - marker: d
    text: 'Hebraico: «pela mão deles». Isto é, por meio deles ou de seus agentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: era importada
  rationale: Os dois verbos de movimento significam literalmente “subia e saía”, mas, neste contexto comercial, descrevem a entrada de mercadorias vindas do Egito. “Era importada” expressa naturalmente essa ideia em português.
- source_word: מֶרְכָּבָה
  choice: uma carruagem
  rationale: O substantivo está no singular e designa uma carruagem, provavelmente de uso militar, sem que o hebraico acrescente uma qualificação explícita.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: por seiscentos siclos de prata
  rationale: O hebraico diz literalmente “por seiscentos de prata”; “siclos” explicita a unidade de peso monetário subentendida.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: e um cavalo, por cento e cinquenta
  rationale: Mantém “cavalo” sem restringi-lo a cavalo de guerra e apresenta a ordem numérica de modo natural em português. A unidade e o material são recuperados da oração anterior.
- source_word: וְכֵן
  choice: E assim
  rationale: Liga os preços à prática de revenda das mesmas mercadorias.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: para todos os reis dos hititas
  rationale: A preposição marca os destinatários das mercadorias, e a designação étnico-política do hebraico é preservada.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: e para os reis de Arã
  rationale: Preserva o nome próprio hebraico Arã, em vez da identificação tradicional e mais interpretativa com a Síria.
- source_word: בְּיָדָם
  choice: por intermédio deles
  rationale: A expressão significa literalmente “pela mão deles” e funciona como idiomatismo de agência.
- source_word: יֹצִאוּ
  choice: eram exportados
  rationale: O hifil de יצא significa “fazer sair”. No contexto do comércio, “exportar” comunica o sentido; a voz passiva evita introduzir no texto um antecedente mais específico do que o hebraico explicita neste versículo.
