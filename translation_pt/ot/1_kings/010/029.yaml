revisions:
- from: Uma carruagem era importada do Egito por seiscentos siclos de prata, e um cavalo, por cento e cinquenta.[a][b] E assim, por intermédio deles, esses bens eram exportados para todos os reis dos hititas e para os reis de Arã.[c]
  to: Uma carruagem foi importada do Egito por seiscentos siclos de prata, e um cavalo, por cento e cinquenta siclos de prata.[a][b] E assim eles os exportavam para todos os reis dos hititas e para os reis de Arã,[c] por intermédio deles.[d]
  rationale: A revisão substitui os imperfeitos passivos por formas que preservam melhor a progressão narrativa hebraica e evita «esses bens», que não está expresso no texto-fonte. «Eles» permanece sem antecedente especificado, como no hebraico, e «os» retoma a carruagem e o cavalo. As notas foram separadas para que as âncoras correspondam precisamente ao conteúdo explicado.
