  text: לְ/בַד֙ מֵ/אַנְשֵׁ֣י הַ/תָּרִ֔ים וּ/מִסְחַ֖ר הָ/רֹכְלִ֑ים וְ/כָל מַלְכֵ֥י הָ/עֶ֖רֶב וּ/פַח֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: pt
  text: além do que vinha dos mercadores itinerantes[a], do comércio dos negociantes, de todos os reis da Arábia[b] e dos governadores da terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos homens que viajavam”; a expressão hebraica é difícil e talvez se refira, de modo mais geral, a comerciantes itinerantes.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos reis dos povos mistos”; neste contexto, porém, “Arábia” é mais provável.
    reason: alternative_reading
  - marker: c
    text: Ou “dos governadores provinciais”; também se traduz por “sátrapas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: além de
  rationale: Introduz uma fonte adicional de receita em relação ao total mencionado no versículo anterior; é natural e conciso em português.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: do que vinha dos mercadores itinerantes
  rationale: A expressão hebraica é difícil. No contexto comercial, תָּרִים provavelmente se refere a pessoas que viajavam, aqui entendidas como comerciantes itinerantes; a formulação explicita naturalmente que se trata de receita.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: do comércio dos negociantes
  rationale: מִסְחָר denota comércio ou atividade comercial, e רֹכְלִים, pessoas que negociam mercadorias. A escolha evita repetição imediata de “mercadores” sem alterar o sentido.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: de todos os reis da Arábia
  rationale: Neste elenco geopolítico, עֶרֶב é plausivelmente uma referência à Arábia ou aos povos árabes; “da Arábia” é claro para leitores modernos.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: e dos governadores da terra
  rationale: פַּחוֹת designa autoridades regionais subordinadas. “Governadores” comunica o cargo sem impor o termo historicamente mais específico “sátrapas”.
