base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/018.yaml
  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: pt
  text: Então o rei fez um grande trono de marfim e o revestiu de ouro refinado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouro puro” ou “ouro fino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Então ... fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Substantivo definido que, no contexto, se refere a Salomão.
- source_word: כִּסֵּא
  choice: trono
  rationale: No contexto régio, “trono” é mais preciso do que o termo genérico “assento”.
- source_word: שֵׁן
  choice: marfim
  rationale: Embora o substantivo possa significar literalmente “dente”, nesta construção designa o marfim usado como material.
- source_word: גָּדוֹל
  choice: grande
  rationale: Preserva tanto a dimensão quanto a imponência do trono.
- source_word: וַיְצַפֵּהוּ
  choice: o revestiu
  rationale: O verbo צפה indica cobrir ou revestir um objeto com determinado material; “revestiu” é natural e preciso para esse trabalho artesanal.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do termo que designa o material.
- source_word: מוּפָז
  choice: refinado
  rationale: O termo qualifica ouro de alta qualidade; “refinado” comunica isso sem impor uma especificidade técnica incerta.
