  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: pt
  text: a comida de sua mesa, os lugares onde seus servos se sentavam, os postos de seus auxiliares, as roupas deles, seus copeiros e o holocausto que ele oferecia na casa de Yahweh[a], ela ficou sem fôlego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua subida à casa de Yahweh”, possivelmente uma referência à escadaria ou à procissão pela qual ele subia.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: a comida de sua mesa
  rationale: Mantém a imagem concreta do alimento servido à mesa real e soa natural em português atual.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: os lugares onde seus servos se sentavam
  rationale: מוֹשָׁב pode indicar assento, lugar ou disposição. A formulação explicita a organização visível dos servos sem reduzir o sentido a cadeiras específicas.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: os postos de seus auxiliares
  rationale: מַעֲמָד evoca posição ou estação, enquanto מְשָׁרְתִים designa pessoas que prestam serviço oficial. “Postos” preserva a disposição formal da corte, e “auxiliares” os distingue dos servos mencionados antes.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: as roupas deles
  rationale: Tradução clara e contemporânea do termo referente a vestes, sem solenidade artificial.
- source_word: מַשְׁקָיו
  choice: seus copeiros
  rationale: No contexto da corte, o termo designa os encarregados de servir bebidas, não apenas as bebidas servidas.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: o holocausto que ele oferecia na casa de Yahweh
  rationale: Segue a vocalização massorética עֹלָתוֹ, “seu holocausto”. “Oferecia” comunica de modo natural o ato de fazer subir a oferta, enquanto a leitura alternativa relacionada à subida é preservada em nota.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de YHWH” e verte diretamente o nome divino como Yahweh.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: ela ficou sem fôlego
  rationale: Reproduz de forma idiomática e compreensível a imagem hebraica de já não haver nela רוּחַ, indicando espanto avassalador sem explicar além do texto.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de עֹלָתוֹ na enumeração
  choice: seu holocausto
  alternative: sua subida; a escadaria pela qual subia
  rationale: A vocalização massorética favorece “holocausto”, mas as consoantes e a história da interpretação permitem uma leitura ligada à subida à casa de Yahweh. A tradução principal segue o Texto Massorético e a nota conserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A enumeração mantém o caráter cortesão do hebraico; construções excessivamente literais foram evitadas quando soariam artificiais.
