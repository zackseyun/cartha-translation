base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: pt
  text: O trono tinha seis degraus; na sua parte de trás havia um topo arredondado[a]. Havia braços de um lado e do outro, junto ao assento[b], e dois leões estavam de pé junto aos braços.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o trono tinha um topo redondo atrás dele”. O hebraico é conciso e pode ser traduzido de maneira mais literal.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o lugar de sentar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: degraus
  rationale: No contexto da estrutura elevada de um trono, o substantivo designa os degraus que conduziam até ele.
- source_word: לַכִּסֵּה
  choice: O trono tinha
  rationale: 'O ל prefixado expressa aqui a relação arquitetônica de modo mais natural em português como posse: “o trono tinha seis degraus”.'
- source_word: רֹאשׁ עָגֹל
  choice: um topo arredondado
  rationale: A expressão significa literalmente “cabeça/topo redondo”. “Topo arredondado” descreve a parte superior sem especificá-la indevidamente como apoio para a cabeça.
- source_word: מֵאַחֲרָיו
  choice: na parte de trás
  rationale: Indica a posição do topo arredondado na parte posterior do trono.
- source_word: יָדֹת
  choice: braços
  rationale: Embora o termo esteja ligado literalmente a “mãos”, no contexto de mobiliário designa os braços laterais do trono. “Braços” é corrente e evita sugerir apenas a superfície acolchoada de um apoio.
- source_word: מִזֶּה וּמִזֶּה
  choice: de ambos os lados
  rationale: Expressa com naturalidade a disposição bilateral indicada por “deste lado e daquele”.
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: do assento
  rationale: A expressão literal “junto ao lugar de sentar” indica a posição dos braços em relação à área onde a pessoa se sentava.
- source_word: אֲרָיוֹת
  choice: leões
  rationale: Plural direto, referente às figuras de leões associadas ao trono.
- source_word: עֹמְדִים
  choice: ficavam em pé
  rationale: O particípio retrata os leões em posição ereta e fixa; a formulação portuguesa comunica tanto a postura quanto a colocação.
- source_word: אֵצֶל הַיָּדוֹת
  choice: junto aos braços
  rationale: Localiza os dois leões ao lado dos braços do trono e mantém coerência lexical com a ocorrência anterior de יָדֹת.
