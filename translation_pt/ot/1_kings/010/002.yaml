  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: pt
  text: Ela chegou a Jerusalém com uma comitiva muito numerosa[a], com camelos carregados de especiarias, uma enorme quantidade de ouro e pedras preciosas. Ela foi até Salomão e falou com ele sobre tudo o que tinha no coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um séquito muito numeroso”; mais literalmente, “com grande riqueza/força”. O termo hebraico חַיִל pode indicar riqueza, força ou um grupo numeroso.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: com uma comitiva muito numerosa
  rationale: חַיִל pode indicar força, riqueza ou um grupo numeroso. Neste contexto de viagem régia e diplomática, “comitiva” comunica naturalmente o séquito imponente, enquanto a nota preserva a amplitude lexical do hebraico.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: camelos carregados de especiarias
  rationale: Expressa em português corrente a construção participial e indica com clareza a carga transportada, sem acrescentar conteúdo.
- source_word: וְזָהָב רַב מְאֹד
  choice: de uma enorme quantidade de ouro
  rationale: Reproduz a forte ênfase quantitativa de רַב מְאֹד em linguagem portuguesa natural.
- source_word: וְאֶבֶן יְקָרָה
  choice: e de pedras preciosas
  rationale: O singular hebraico tem valor coletivo neste inventário; o plural é a forma natural em português.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: Apresentou-se a Salomão
  rationale: A segunda ocorrência de וַתָּבֹא assinala a passagem da chegada à cidade para o encontro com Salomão. “Apresentou-se” preserva essa nova etapa sem repetir de modo pesado o verbo “chegar”.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: e falou com ele
  rationale: “Falou com ele” é idiomático e compatível com אֶל neste contexto, sem exigir que o verbo, por si só, descreva um diálogo plenamente recíproco.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: sobre tudo o que tinha no coração
  rationale: Mantém a imagem hebraica do coração como sede dos pensamentos e das preocupações, em formulação natural e biblicamente ressonante.
