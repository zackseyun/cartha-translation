  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַד֙ אֲשֶׁ֣ר נָֽתַן לָ֔/הּ כְּ/יַ֖ד הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/תֵּ֛פֶן וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: pt
  text: E o rei Salomão deu à rainha de Sabá tudo o que ela desejava e que pediu, além do que lhe deu conforme os recursos do rei Salomão.[a] Então ela partiu e foi para a sua terra, ela e os seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “conforme a mão do rei Salomão”, expressão que pode indicar os recursos, a capacidade ou a generosidade dele.'
    reason: Explica o idioma hebraico e preserva sua amplitude semântica.
lexical_decisions:
- source_word: נָתַן
  choice: deu
  rationale: Equivalente comum e direto do verbo hebraico, adequado às duas ocorrências no versículo.
- source_word: מַלְכַּת שְׁבָא
  choice: a rainha de Sabá
  rationale: Preserva o título real e a forma tradicional do topônimo em português.
- source_word: כָּל חֶפְצָהּ
  choice: tudo o que ela desejou
  rationale: Expressa naturalmente o sentido de desejo ou aquilo que se deseja, sem a rigidez de uma tradução nominal literal.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: tudo o que pediu
  rationale: O verbo שׁאל significa pedir ou solicitar; a formulação mantém a abrangência da oração relativa e evita repetição excessivamente pesada.
- source_word: מִלְּבַד
  choice: além de
  rationale: Marca aqui adição e se integra naturalmente à sintaxe portuguesa.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: conforme a generosidade do rei Salomão
  rationale: A expressão significa literalmente 'conforme a mão' e, neste contexto, aponta para os recursos, a capacidade ou a liberalidade real; 'generosidade' comunica o sentido idiomático com clareza, enquanto a nota preserva a forma hebraica.
- source_word: וַתֵּפֶן
  choice: partiu
  rationale: Embora o verbo tenha o sentido básico de 'virar-se', em sequência com 'foi' descreve naturalmente o ato de partir; esta escolha evita em português a expressão pouco idiomática 'virou-se e foi'.
- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: foi para a sua terra
  rationale: Reproduz o movimento em direção à terra da rainha sem acrescentar explicitamente a ideia de retorno, embora ela seja contextual.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: ela e os seus servos
  rationale: Mantém a construção enfática hebraica e traduz עֲבָדִים pelo equivalente amplo e direto 'servos', apropriado ao contexto da comitiva real.
theological_decisions:
- issue: Tradução da expressão כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: conforme a generosidade do rei Salomão
  alternative: conforme a mão do rei Salomão; conforme os recursos do rei Salomão
  rationale: A expressão hebraica é idiomática e pode indicar capacidade, recursos ou liberalidade. A tradução no texto comunica a generosidade régia sem transformar uma expressão contextual em afirmação doutrinária; a nota registra a forma literal e a amplitude semântica.
- issue: Sentido de עֲבָדֶיהָ no contexto real
  choice: os seus servos
  alternative: os seus auxiliares; a sua comitiva
  rationale: O termo pode designar servos em sentido amplo e, em certos contextos, escravos. Aqui apenas identifica as pessoas que acompanhavam a rainha; 'servos' preserva o termo sem impor uma classificação social mais específica do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém a repetição enfática da abrangência dos pedidos e a construção final 'ela e os seus servos', ao mesmo tempo que traduz idiomaticamente a expressão hebraica sobre a 'mão' de Salomão.
