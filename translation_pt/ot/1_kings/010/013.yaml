revisions:
- from: E o rei Salomão deu à rainha de Sabá tudo o que ela desejou, tudo o que pediu, além do que lhe deu conforme a generosidade do rei Salomão.[a] Então ela partiu e foi para a sua terra, ela e os seus servos.
  to: E o rei Salomão deu à rainha de Sabá tudo o que ela desejava e que pediu, além do que lhe deu conforme os recursos do rei Salomão.[a] Então ela partiu e foi para a sua terra, ela e os seus servos.
  rationale: A revisão evita que desejo e pedido pareçam duas concessões separadas e substitui uma interpretação única do idioma hebraico por “recursos”, termo natural que conserva melhor o campo de sentido indicado pela nota. O restante do texto é mantido, inclusive a sequência narrativa de partida e ida à terra da rainha.
