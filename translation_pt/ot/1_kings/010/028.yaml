base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: pt
  text: Os cavalos de Salomão eram importados do Egito e de Que[a]; os mercadores do rei os adquiriam de Que por um preço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo hebraico traduzido por “Que” é incerto. Pode ser o nome de uma região, provavelmente na Cilícia, ou um substantivo comum com sentido semelhante a “manada” ou “lote”. Nesse caso, outra tradução possível seria: “e de uma manada; os mercadores do rei adquiriam uma manada por um preço”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: eram importados
  rationale: O substantivo pode indicar saída, origem ou movimentação comercial. No contexto do abastecimento de Salomão, a formulação verbal expressa naturalmente a importação sem perder a perspectiva do texto.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: Os cavalos de Salomão
  rationale: Construção portuguesa natural que preserva a relação ampla indicada pelo hebraico, seja posse, destinação ou vínculo com a rede comercial de Salomão.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: וּמִקְוֵה / מִקְוֵה
  choice: e de Que / em Que
  rationale: Interpreta o termo difícil como o topônimo Que, provavelmente na Cilícia, leitura coerente ao lado do Egito e com a repetição do termo. A incerteza lexical é explicitada em nota.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: os mercadores do rei
  rationale: Designa com clareza os agentes comerciais a serviço da coroa.
- source_word: יִקְחוּ
  choice: adquiriam
  rationale: Embora o verbo signifique literalmente tomar, o contexto comercial favorece adquirir, sem especificar além do texto o modo exato da transação.
- source_word: בִּמְחִיר
  choice: por certo preço
  rationale: Expressa uma aquisição comercial mediante pagamento, sem pressupor um valor específico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O topônimo foi grafado “Que”, sem acento, e a dificuldade do hebraico foi preservada em nota.
