base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: pt
  text: Fez também trezentos escudos de ouro batido[a]; em cada escudo foram aplicadas três minas de ouro[b]. Depois, o rei os colocou na Casa da Floresta do Líbano[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouro martelado” ou “ouro batido em lâminas finas”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “três minas de ouro subiam sobre um escudo”, isto é, essa quantidade de ouro era aplicada a cada escudo.'
    reason: lexical_alternative
  - marker: c
    text: A Casa da Floresta do Líbano era o nome de um edifício real associado ao complexo do palácio de Salomão; veja 1 Reis 7:2.
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: escudos
  rationale: מָגֵן designa um escudo defensivo e, neste contexto, contrasta com os escudos menores do versículo anterior. “Escudos” é a forma natural e amplamente compreensível em português.
- source_word: זָהָב שָׁחוּט
  choice: ouro batido
  rationale: שָׁחוּט descreve ouro trabalhado a golpes de martelo, provavelmente em lâminas finas. “Ouro batido” conserva de modo conciso o processo de fabricação.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: três minas
  rationale: מָנֶה é uma unidade antiga de peso. “Mina” é a designação tradicional em português e evita converter o valor para uma medida moderna com precisão incerta.
- source_word: יַעֲלֶה עַל
  choice: foram aplicadas
  rationale: A expressão diz literalmente que o ouro “subia sobre” o escudo e indica a quantidade colocada ou aplicada a cada peça. “Foram aplicadas” comunica naturalmente esse sentido sem afirmar que o escudo inteiro era de ouro maciço.
- source_word: הַמָּגֵן הָאֶחָת
  choice: em cada escudo
  rationale: 'Embora a forma hebraica seja singular, “o escudo, o único”, o uso é distributivo: a quantidade indicada correspondia a cada escudo.'
- source_word: וַיִּתְּנֵם
  choice: os colocou
  rationale: נתן pode significar dar, pôr ou colocar. Aqui se refere à instalação ou guarda dos escudos em determinado edifício.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Casa da Floresta do Líbano
  rationale: A expressão funciona como o nome de um edifício real específico. “Casa” preserva o termo hebraico, e a capitalização sinaliza o nome próprio.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade brasileira. O verbo “Fez” explicita a elipse herdada do versículo anterior, e “também” representa a conexão aditiva וּ. A formulação mantém a antiga unidade “mina” e explica em nota o idioma hebraico, sem impor uma conversão moderna incerta.
