base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: pt
  text: E doze leões estavam ali, sobre os seis degraus, de um lado e do outro[a]; nada semelhante havia sido feito em nenhum reino.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deste lado e daquele”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não se havia feito assim para todos os reinos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִים
  choice: E doze leões
  rationale: Mantém a coordenação narrativa e traduz diretamente o numeral e o substantivo plural, que designa as figuras de leões junto ao trono.
- source_word: עֹמְדִים שָׁם
  choice: estavam ali
  rationale: O particípio descreve a posição estática dos leões; em português, “estavam ali” expressa a cena com naturalidade, sem sugerir que fossem seres vivos em pé.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: sobre os seis degraus
  rationale: מַעֲלוֹת refere-se aos degraus que conduziam ao trono, e עַל indica sua colocação sobre ou ao longo deles. “Sobre” preserva essa relação espacial.
- source_word: מִזֶּה וּמִזֶּה
  choice: de um lado e do outro
  rationale: Expressão distributiva que indica disposição simétrica nos dois lados; esta formulação é clara e idiomática em português.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: nada semelhante havia sido feito
  rationale: O nifal perfeito de עשה com כֵן nega que algo comparável tivesse sido produzido; a formulação portuguesa comunica naturalmente essa comparação.
- source_word: לְכָל מַמְלָכוֹת
  choice: em nenhum reino
  rationale: No contexto de uma oração negativa, כָל com o plural tem sentido distributivo. “Em nenhum reino” é o equivalente idiomático em português e preserva a abrangência da afirmação.
