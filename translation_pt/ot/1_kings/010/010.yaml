base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: pt
  text: Ela deu ao rei cento e vinte talentos de ouro, uma quantidade muito grande de especiarias e pedras preciosas. Nunca mais chegou uma quantidade tão grande de especiarias como a que[a] a rainha de Sabá deu ao rei Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa «especiaria» no singular na comparação («como aquela especiaria»), provavelmente em sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן לַמֶּלֶךְ
  choice: Ela deu ao rei
  rationale: O wayyiqtol de נתן dá continuidade à narrativa. Em português, a sequência fica natural sem acrescentar um marcador temporal forte.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: cento e vinte talentos de ouro
  rationale: כִּכָּר designa uma antiga unidade de peso; conservar «talentos» evita uma conversão moderna incerta.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: uma quantidade enorme de especiarias
  rationale: בְשָׂמִים refere-se a substâncias aromáticas, e הַרְבֵּה מְאֹד intensifica fortemente sua quantidade.
- source_word: וְאֶבֶן יְקָרָה
  choice: e pedras preciosas
  rationale: Embora אֶבֶן esteja no singular, ele funciona naturalmente como coletivo nesta lista de presentes.
- source_word: לֹא בָא ... עוֹד לָרֹב
  choice: Nunca mais chegou tamanha abundância
  rationale: A combinação da negação com עוֹד comunica «nunca mais», enquanto לָרֹב destaca a quantidade excepcional.
- source_word: כַבֹּשֶׂם הַהוּא
  choice: de especiarias como a que
  rationale: O hebraico traz «especiaria» no singular, provavelmente com sentido coletivo; a formulação portuguesa mantém a comparação de modo natural.
- source_word: מַלְכַּת שְׁבָא ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: a rainha de Sabá ... ao rei Salomão
  rationale: Reproduz diretamente os títulos e nomes do hebraico em ordem idiomática portuguesa.
