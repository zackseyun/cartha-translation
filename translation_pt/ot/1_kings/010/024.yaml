  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: pt
  text: E toda a terra buscava a presença de Salomão[a], para ouvir a sabedoria que Deus havia posto no coração de Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “buscava a face de Salomão”, expressão que significa procurar sua presença ou uma audiência com ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָרֶץ
  choice: E toda a terra
  rationale: Preserva a expressão coletiva e abrangente do hebraico, que neste contexto régio se refere hiperbolicamente aos povos do mundo conhecido, sem restringi-la à terra de Israel.
- source_word: מְבַקְשִׁים
  choice: buscava
  rationale: O particípio indica ação contínua ou habitual. Em português, o imperfeito expressa naturalmente esse valor; o singular concorda com a expressão coletiva “toda a terra”.
- source_word: אֶת פְּנֵי שְׁלֹמֹה
  choice: a presença de Salomão
  rationale: Traduz o sentido do idioma hebraico “buscar a face de”, isto é, procurar acesso à presença ou audiência de alguém, preservando parte da imagem original.
- source_word: לִשְׁמֹעַ
  choice: para ouvir
  rationale: O infinitivo indica finalidade, e “ouvir” reproduz de modo direto o verbo hebraico.
- source_word: חָכְמָתוֹ
  choice: a sabedoria
  rationale: O referente possessivo já fica claro pela oração seguinte e pelo contexto imediato; a formulação evita em português a possível leitura equivocada de que Deus teria posto a própria sabedoria divina no coração de Salomão.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: que Deus havia posto
  rationale: Embora נָתַן signifique literalmente “deu”, a combinação com “em seu coração” é expressa naturalmente em português por “pôs”. O mais-que-perfeito composto indica que a concessão da sabedoria antecedeu a busca por Salomão.
- source_word: בְּ/לִבּוֹ
  choice: em seu coração
  rationale: Mantém a antropologia hebraica, na qual o coração abrange intelecto, discernimento e vontade, sem reduzi-lo apenas à mente.
theological_decisions:
- issue: Tradução de אֱלֹהִים fora de uma ocorrência do nome da aliança
  choice: Deus
  alternative: SENHOR
  rationale: O texto traz אֱלֹהִים, e não YHWH; “Deus” preserva essa distinção lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “toda a terra” conserva a hipérbole régia e o horizonte antigo; “buscava” comunica ação habitual. A nota esclarece o idioma hebraico sem sobrecarregar o texto principal.
