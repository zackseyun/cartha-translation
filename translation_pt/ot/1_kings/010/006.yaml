  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: pt
  text: 'Então ela disse ao rei: “A notícia que ouvi em minha terra a respeito de suas palavras[a] e de sua sabedoria era verdadeira.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus feitos” ou “seus assuntos”. A expressão hebraica traduzida como “suas palavras” também pode se referir, de modo mais amplo, a assuntos relacionados ao rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ela disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: אֶל־הַמֶּלֶךְ
  choice: ao rei
  rationale: Tradução direta da expressão preposicional definida.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: Era verdade o que ouvi
  rationale: אֱמֶת tem função predicativa, e דָּבָר designa aqui a notícia ou relato ouvido. Esta formulação é clara e idiomática sem duplicar “relato”.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: o que ouvi
  rationale: Expressa naturalmente em português a construção relativa hebraica.
- source_word: בְּאַרְצִי
  choice: na minha terra
  rationale: Preserva diretamente אֶרֶץ e o sufixo de primeira pessoa.
- source_word: עַל־דְּבָרֶיךָ
  choice: a respeito das suas palavras
  rationale: Mantém o sentido mais literal de דְּבָרִים, sem excluir no contexto a extensão semântica para assuntos, feitos ou notícias a respeito do rei.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: e da sua sabedoria
  rationale: Tradução direta que conserva a coordenação do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a possível amplitude de דְּבָרֶיךָ por meio de nota, sem resolver indevidamente a ambiguidade no texto principal.
