source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: pt
  text: Bendito seja Yahweh, o seu Deus, que se agradou de você para colocá-lo no trono de Israel. Por causa do amor eterno de Yahweh por Israel[a], ele o constituiu rei para exercer a justiça e a retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque Yahweh ama Israel para sempre”. O hebraico expressa literalmente o “amor de Yahweh” por Israel, mas a construção também pode ser vertida naturalmente por uma oração verbal.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Bendito seja
  rationale: A fórmula com o jussivo de היה e o predicativo בָּרוּךְ expressa uma bênção; “Bendito seja” é idiomático em português e conserva sua força optativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: Representa naturalmente em português a forma com sufixo de segunda pessoa masculina singular.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: que se agradou de você
  rationale: חפץ com ב indica prazer ou favor dirigido a uma pessoa; a formulação é atual, digna e não excessivamente enfática.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: e o colocou no trono de Israel
  rationale: נתן com עַל כִּסֵּא descreve a entronização. A coordenação explicita em português o resultado do favor divino sem perder a imagem do trono.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: Por causa do amor eterno de Yahweh por Israel
  rationale: O ב inicial é entendido causalmente, enquanto o substantivo אַהֲבָה é preservado como “amor”. “Eterno” comunica de modo natural a força de לְעֹלָם ligada ao amor de Yahweh.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: ele o constituiu rei
  rationale: שׂים com ל marca nomeação. “Constituiu rei” mantém o sentido régio e solene sem soar burocrático.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: para exercer a justiça e a retidão
  rationale: No contexto régio, עשה indica o exercício do governo justo. “Justiça e retidão” preserva a distinção e a amplitude ética do par hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Sentido de בְּאַהֲבַת יְהוָה e relação de לְעֹלָם
  choice: Por causa do amor eterno de Yahweh por Israel
  alternative: Porque Yahweh ama Israel para sempre
  rationale: A leitura escolhida preserva a construção nominal hebraica e entende ב causalmente. A nota registra a formulação verbal igualmente possível, evitando resolver além do necessário a relação temporal expressa por לְעֹלָם.
- issue: Relação entre favor divino e entronização
  choice: que se agradou de você e o colocou no trono
  alternative: que se agradou de você para colocá-lo no trono
  rationale: O infinitivo hebraico pode indicar finalidade ou resultado estreitamente ligado ao agrado de Yahweh. A coordenação portuguesa mantém essa ligação sem impor uma formulação teológica mais específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “você” torna clara a referência singular a Salomão; os pronomes masculinos “o” preservam essa referência. O registro permanece digno, com vocabulário régio e ético acessível.
