base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: pt
  text: Pois o rei tinha no mar navios de Társis junto com os navios de Hirão. Uma vez a cada três anos, os navios de Társis chegavam trazendo ouro, prata, marfim, macacos e pavões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata do último animal é incerta; o termo hebraico também tem sido entendido como “babuínos” ou outra ave ou animal exótico.
    reason: O hebraico תֻכִּיִּים é raro e sua identificação zoológica permanece discutida.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: navios de Társis
  rationale: Preserva a expressão hebraica, que pode designar navios ligados a Társis ou embarcações de uma classe própria para viagens longas, sem reduzi-la simplesmente a “frota”.
- source_word: שֶׁנְהַבִּים
  choice: marfim
  rationale: Equivalente português tradicional e contextual para o produto de luxo mencionado.
- source_word: קֹפִים
  choice: macacos
  rationale: Sentido lexical amplamente aceito e adequado à lista de animais exóticos.
- source_word: תֻכִּיִּים
  choice: pavões
  rationale: Tradução tradicional e plausível, embora a identificação zoológica exata do termo seja incerta; a incerteza é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Navios de Társis” mantém a forma do original e sua possível ambiguidade. A repetição de “navios” acompanha a estrutura hebraica sem soar excessivamente pesada.
