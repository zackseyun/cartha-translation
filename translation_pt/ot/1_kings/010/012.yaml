  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: pt
  text: Com a madeira de almugue[a], o rei fez suportes[b] para a casa de Yahweh e para a casa do rei, bem como liras e harpas para os cantores. Nunca havia chegado madeira de almugue como aquela, nem se viu madeira assim até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “madeira de algum”. O termo relacionado aparece com grafia variante na tradição paralela.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “suportes” é raro e também pode designar elementos arquitetônicos como degraus ou balaustradas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: madeira de almugue
  rationale: O termo designa uma madeira importada valiosa, mas sua identificação botânica é incerta. A transliteração baseada na forma do texto massorético evita uma identificação especulativa; o singular coletivo “madeira” é natural em português.
- source_word: מִסְעָד
  choice: suportes
  rationale: O substantivo é raro e de sentido incerto. “Suportes” preserva a função arquitetônica geral sem optar indevidamente por possibilidades mais específicas, como degraus ou balaustradas.
- source_word: לְבֵית יְהוָה
  choice: para a casa de Yahweh
  rationale: “Casa” conserva o paralelismo hebraico com a casa do rei, enquanto “Yahweh” representa diretamente o nome divino.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: e para a casa do rei
  rationale: Mantém a expressão e o paralelismo do hebraico; “palácio” seria possível, mas menos formalmente correspondente.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: liras e harpas
  rationale: Emprega dois termos distintos e correntes para instrumentos de cordas diferentes, embora sua identificação exata permaneça incerta.
- source_word: לַשָּׁרִים
  choice: para os cantores
  rationale: Traduz de modo preciso o particípio ligado ao verbo “cantar”, sem ampliá-lo para o sentido mais geral de músicos.
- source_word: לֹא בָא כֵן עֲצֵי אַלְמֻגִּים
  choice: Nunca havia chegado madeira de almugue como aquela
  rationale: Expressa em português natural o caráter sem precedente da chegada ou importação dessa madeira.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: nem se viu madeira assim até o dia de hoje
  rationale: Preserva a perspectiva temporal do narrador e explicita com naturalidade o referente implícito.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” conserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem inicial “Com a madeira...” torna natural a construção instrumental do hebraico. As notas foram posicionadas junto aos termos a que efetivamente se referem.
