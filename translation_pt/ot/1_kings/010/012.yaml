  source_fidelity: 'A tradução representa adequadamente a construção hebraica: o rei utiliza a madeira de almugue para fazer elementos arquitetônicos para a casa de Yahweh e a casa do rei, além de instrumentos para os cantores. “Suportes” conserva prudentemente a incerteza de מִסְעָד, e a formulação final comunica tanto o caráter sem precedente da chegada dessa madeira quanto a declaração narrativa de que não se viu madeira assim até o presente do narrador.'
