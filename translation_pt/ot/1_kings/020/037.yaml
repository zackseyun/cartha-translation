  yaml_path: translation/ot/1_kings/020/037.yaml
  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: pt
  text: 'Então ele encontrou outro homem e lhe disse: “Por favor, golpeie-me.” O homem o golpeou[a] e o feriu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete o verbo “golpear” para dar ênfase; literalmente: “o homem o golpeou, golpeando-o e ferindo-o”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Então ele encontrou
  rationale: A forma narrativa faz a ação avançar; “Então” expressa com naturalidade a sequência, sem acrescentar uma relação causal.
- source_word: אִישׁ אַחֵר
  choice: outro homem
  rationale: Traduz diretamente o substantivo masculino singular אִישׁ e o qualificativo אַחֵר.
- source_word: וַיֹּאמֶר
  choice: e lhe disse
  rationale: O pronome indireto, implícito no contexto português, identifica naturalmente o homem encontrado como destinatário da fala.
- source_word: הַכֵּינִי נָא
  choice: Por favor, golpeie-me
  rationale: O imperativo de נכה com sufixo de primeira pessoa significa “golpeie-me”; נָא dá à ordem o tom de pedido expresso por “por favor”. “Golpear” conserva a gravidade da ação melhor que o coloquial “bater”.
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: O homem o golpeou
  rationale: Mantém o sujeito explícito הָאִישׁ e o objeto pronominal “o”, em ordem natural no português.
- source_word: הַכֵּה וּפָצֹעַ
  choice: e o feriu
  rationale: Expressa de modo idiomático o resultado lesivo do golpe. A repetição enfática de נכה no hebraico é registrada em nota, evitando uma construção artificial no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Emprega-se “golpear” em vez de “bater” para conservar o tom sério do episódio; a construção hebraica enfática é preservada em nota.
