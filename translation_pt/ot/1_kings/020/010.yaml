base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: pt
  text: 'Ben-Hadade mandou dizer a ele: “Que os deuses façam isso comigo, e ainda mais, se o pó de Samaria será suficiente para os punhados[a] de todo o povo que está aos meus pés.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “se o pó de Samaria será suficiente para as concavidades das mãos de todo o povo que está aos meus pés”. A expressão pode referir-se a punhados ou às cavidades das mãos. Ben-Hadade se vangloria de que seu exército é tão numeroso que nem o pó de Samaria bastaria para todos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: mandou dizer a ele
  rationale: No contexto de comunicação diplomática, explicita naturalmente em português que Ben-Hadade enviou uma mensagem, sem precisar introduzir mensageiros não mencionados no hebraico.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadade
  rationale: Transliteração tradicional e amplamente reconhecível do nome em português.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: Que os deuses me castiguem, e ainda mais
  rationale: Reproduz de modo inteligível a fórmula de juramento e automaldição. O verbo genérico 'façam' é expresso pelo sentido pragmático 'castiguem', enquanto 'e ainda mais' preserva a intensificação.
- source_word: אִם
  choice: se
  rationale: 'Mantém a forma condicional da fórmula elíptica de juramento, cujo sentido é: que eu seja castigado se isso não acontecer.'
- source_word: יִשְׂפֹּק
  choice: for suficiente
  rationale: Expressa diretamente a ideia de suficiência do verbo hebraico em português corrente.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: o pó de Samaria
  rationale: Reprodução direta e natural da relação construta hebraica.
- source_word: לִשְׁעָלִים
  choice: para dar um punhado a cada um
  rationale: Comunica com clareza a imagem provável das concavidades das mãos ou punhados e torna inteligível a hipérbole numérica no contexto.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: a cada um de todos os que me seguem
  rationale: Traduz o valor idiomático de 'aos meus pés' como pessoas que acompanham o rei e estão sob seu comando, sem limitar necessariamente o referente apenas a soldados.
theological_decisions:
- issue: Sentido de אֱלֹהִים no juramento de um rei arameu
  choice: os deuses
  alternative: Deus
  rationale: O plural verbal e o contexto de um rei não israelita favorecem a referência às divindades dele, preservando a ambientação narrativa sem impor uma identificação com o Deus de Israel.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fórmula de juramento conserva sua força solene; a nota registra a imagem hebraica e o idioma militar sem sobrecarregar o texto principal.
