base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: pt
  text: 'Então todos os anciãos e todo o povo lhe disseram: “Não dê ouvidos e não concorde.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não obedeça e não consinta”. Os verbos hebraicos podem ter os sentidos de ouvir ou obedecer (שׁמע) e de estar disposto ou consentir (אבה).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O wayyiqtol de אמר faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “disseram” preserva o verbo de fala.
- source_word: אֵלָיו
  choice: lhe
  rationale: O hebraico emprega um pronome cujo antecedente contextual é o rei; “lhe” preserva essa referência pronominal sem explicitar o nome.
- source_word: כָּל הַזְּקֵנִים
  choice: todos os anciãos
  rationale: Neste contexto, זְקֵנִים designa líderes reconhecidos da comunidade, não apenas homens idosos; “anciãos” é a equivalência contextual consagrada e inteligível.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: עָם se refere ao conjunto mais amplo da população, distinguido dos anciãos. O singular coletivo “todo o povo” é natural em português.
- source_word: אַל תִּשְׁמַע
  choice: Não dê ouvidos
  rationale: שׁמע pode significar ouvir, dar ouvidos ou obedecer. “Não dê ouvidos” preserva o sentido imediato de não acolher a exigência sem resolver a expressão simplesmente como obediência.
- source_word: וְלֹא תֹאבֶה
  choice: e não concorde
  rationale: אבה expressa disposição ou consentimento. “Não concorde” é claro e natural no contexto de uma exigência política, mantendo a ideia de recusa em aceitá-la.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Anciãos” mantém o papel institucional do grupo; “dê ouvidos” e “concorde” formam uma exortação natural, sem eliminar a amplitude semântica dos verbos hebraicos, registrada na nota.
