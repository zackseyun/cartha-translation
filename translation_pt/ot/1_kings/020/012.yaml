base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: pt
  text: 'Quando ouviu essa mensagem[a], enquanto ele e os reis bebiam nos abrigos[b], disse aos seus servos: “Tomem posição”[c]. E eles tomaram posição contra a cidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essa palavra” ou “esse assunto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas cabanas”; tradicionalmente, “nos pavilhões”.
    reason: lexical_alternative
  - marker: c
    text: 'A ordem hebraica diz literalmente: “Ponde!” — uma breve ordem militar, provavelmente para que tomassem posição contra a cidade.'
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: essa mensagem
  rationale: דָּבָר pode significar palavra, assunto ou mensagem. Aqui se refere à resposta comunicada de Acabe; “essa mensagem” é natural em português e mantém a referência narrativa.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: ele e os reis bebiam
  rationale: O particípio indica uma ação em andamento. A formulação plural torna natural em português a construção hebraica que começa no singular e depois explicita “ele e os reis”.
- source_word: בַּסֻּכּוֹת
  choice: nos abrigos
  rationale: סֻכּוֹת designa estruturas temporárias cobertas. “Abrigos” é claro e atual, sem sugerir necessariamente tendas fechadas ou construções permanentes.
- source_word: שִׂימוּ
  choice: Tomem posição
  rationale: שׂים significa literalmente “pôr/colocar”, mas neste contexto é uma ordem militar elíptica. “Tomem posição” conserva a concisão sem acrescentar armamentos ou uma ordem explícita de ataque.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: eles tomaram posição contra a cidade
  rationale: A frase retoma a ordem elíptica, e עַל exprime aqui posicionamento hostil. A tradução preserva tanto a repetição quanto o sentido militar.
