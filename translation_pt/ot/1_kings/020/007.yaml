revisions:
- from: 'Então o rei de Israel convocou todos os anciãos da terra e disse: “Por favor, entendam e vejam que este homem está procurando causar desgraça. Pois mandou exigir de mim minhas mulheres, meus filhos, minha prata e meu ouro, e eu não os recusei a ele.”'
  to: 'Então o rei de Israel convocou todos os anciãos da terra e disse: “Por favor, entendam e vejam que este homem está tramando o mal, pois enviou a mim por minhas mulheres, meus filhos, minha prata e meu ouro, e eu não lhe neguei nada disso.”'
  rationale: A revisão elimina a explicitação de «exigir», preservando a construção deliberadamente concisa do hebraico («enviou a mim por...»), e substitui a retomada pronominal por uma formulação portuguesa natural que abrange todos os itens da lista. «Tramando o mal» representa o propósito hostil de מְבַקֵּשׁ רָעָה sem reduzir o termo a uma única nuance.
