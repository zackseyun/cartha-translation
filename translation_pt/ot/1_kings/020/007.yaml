base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: pt
  text: 'Então o rei de Israel convocou todos os anciãos da terra e disse: “Por favor, entendam e vejam que este homem está tramando o mal, pois enviou a mim por minhas mulheres, meus filhos, minha prata e meu ouro, e eu não lhe neguei nada disso.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: desgraça
  rationale: O substantivo pode indicar mal, dano ou calamidade. Neste contexto, refere-se ao propósito hostil e destrutivo de Ben-Hadade, sem necessariamente fazer uma afirmação abstrata sobre o mal moral.
- source_word: מְבַקֵּשׁ
  choice: está procurando causar
  rationale: Expressa a busca ou intenção contínua; com רָעָה, a formulação idiomática em português comunica que ele procura provocar dano.
- source_word: מָנַעְתִּי
  choice: recusei
  rationale: No contexto de uma exigência, traduz naturalmente a ideia de não reter ou negar aquilo que foi pedido.
- source_word: זִקְנֵי הָאָרֶץ
  choice: anciãos da terra
  rationale: Mantém o título sociopolítico tradicional e preserva a abrangência territorial do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção direta. “Minhas mulheres” preserva o referente amplo de נָשַׁי; “filhos” pode abranger descendentes, mas é a leitura contextual mais natural. A insistência hebraica “saibam, por favor, e vejam” foi vertida como “entendam e vejam” para conservar os dois verbos sem artificialidade excessiva.
