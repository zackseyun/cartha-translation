base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: pt
  text: Ben-Hadade, rei de Arã, reuniu todo o seu exército[a], e trinta e dois reis estavam com ele, além de cavalos e carros de guerra. Então ele subiu, sitiou Samaria e lutou contra ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Ben-Hadade, rei de Arã, reuniu todo o seu exército”. A conjunção inicial pode ser traduzida de modo mais formal por “e”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן הֲדַד
  choice: Ben-Hadade
  rationale: O nome é transliterado em forma corrente e legível em português. A conjunção inicial liga o episódio ao contexto anterior, mas pode ser omitida naturalmente no início desta unidade narrativa sem acrescentar um marcador temporal inexistente.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Mantém diretamente o topônimo hebraico אֲרָם, em vez da identificação tradicional por 'Síria'.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: reuniu todo o seu exército
  rationale: קבץ significa reunir ou ajuntar; חַיִל designa aqui a força militar, expressa naturalmente pelo coletivo 'exército'.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: Trinta e dois reis o acompanhavam
  rationale: Reproduz com clareza a presença dos trinta e dois reis aliados, evitando em português a repetição pouco natural de duas construções com 'com'.
- source_word: וְסוּס וָרָכֶב
  choice: com cavalos e carros de guerra
  rationale: Os singulares hebraicos têm sentido coletivo. Os plurais são naturais em português, e 'de guerra' esclarece o sentido militar de רֶכֶב.
- source_word: וַיַּעַל
  choice: Então ele avançou
  rationale: עלה indica subida ou avanço em direção ao alvo; neste contexto militar, 'avançou' comunica naturalmente o movimento sem exigir uma subida topográfica explícita.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: cercou Samaria
  rationale: A expressão militar צור על significa sitiar ou cercar uma cidade. 'Cercou' é clara, atual e concisa.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: lutou contra ela
  rationale: Preserva o valor verbal de לחם com ב, sem ampliar o sentido para uma conquista efetiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em períodos curtos para evitar uma coordenação pesada. O topônimo 'Arã' segue o hebraico; 'Síria' não foi inserido no texto porque é uma identificação tradicional, não uma variante textual. O marcador [a] aparece no texto principal.
