base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: pt
  text: 'Os homens estavam atentos a um presságio[a] e logo se agarraram ao que ele dissera[b]: “Ben-Hadade é seu irmão”. Acabe respondeu: “Vão buscá-lo”. Então Ben-Hadade saiu ao encontro dele, e Acabe o fez subir no carro de guerra[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “procuravam um presságio” ou “tomavam aquilo como presságio”. O verbo hebraico pode se referir à busca ou interpretação de presságios; aqui, provavelmente indica que eles estavam atentos a algum indício favorável nas palavras de Acabe.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida por “se agarraram ao que ele dissera” é difícil. O sentido parece ser que eles aproveitaram imediatamente as palavras de Acabe como uma concessão favorável.
    reason: lexical_alternative
  - marker: c
    text: 'Ou “mandou que ele subisse no carro de guerra”. O verbo hebraico é causativo: Acabe fez com que Ben-Hadade subisse no carro de guerra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: estavam atentos a um presságio
  rationale: O piel de נחשׁ pode indicar busca ou interpretação de presságios. No contexto, os homens aguardavam nas palavras de Acabe algum indício favorável; a formulação preserva o valor lexical sem sugerir necessariamente um rito formal de adivinhação.
- source_word: וַיְמַהֲרוּ
  choice: logo
  rationale: Expressa de modo natural a rapidez com que eles reagiram ao indício percebido.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: se agarraram ao que ele dissera
  rationale: A expressão hebraica é difícil, mas parece indicar que eles se apoderaram prontamente das palavras de Acabe como uma concessão favorável. O objeto implícito é explicitado pelo contexto.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém o sentido literal da linguagem diplomática que os homens aproveitam em favor de Ben-Hadade.
- source_word: בֹּאוּ קָחֻהוּ
  choice: Vão buscá-lo
  rationale: 'Traduz a sequência imperativa pelo modo mais natural em português no contexto: Acabe ordena que tragam Ben-Hadade à sua presença.'
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: Acabe o fez subir no carro
  rationale: Preserva o valor causativo do hifil de עלה sem afirmar que Acabe o levantou fisicamente.
- source_word: הַמֶּרְכָּבָה
  choice: o carro
  rationale: O hebraico traz o artigo definido, mas não um possessivo explícito. O contexto sugere o carro de Acabe, sem que isso precise ser acrescentado ao texto.
