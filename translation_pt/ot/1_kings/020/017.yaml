  text: וַ/יֵּצְא֗וּ נַעֲרֵ֛י שָׂרֵ֥י הַ/מְּדִינ֖וֹת בָּ/רִֽאשֹׁנָ֑ה וַ/יִּשְׁלַ֣ח בֶּן הֲדַ֗ד וַ/יַּגִּ֤ידוּ ל/וֹ֙ לֵ/אמֹ֔ר אֲנָשִׁ֕ים יָצְא֖וּ מִ/שֹּׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: pt
  text: 'Então os jovens dos comandantes das províncias saíram primeiro, e Ben-Hadade enviou homens[a], e estes lhe informaram: “Homens saíram de Samaria”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “enviou”, sem declarar quem foi enviado. Pelo contexto, trata-se de homens mandados para observar ou averiguar a situação.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: os jovens
  rationale: Preserva o sentido básico de נַעַר, que neste contexto militar também pode designar auxiliares ou servidores ligados aos comandantes.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: dos comandantes das províncias
  rationale: Mantém de forma clara a cadeia construta hebraica; שָׂרִים admite o sentido de chefes ou comandantes, apropriado ao contexto militar, e מְדִינוֹת designa províncias ou distritos administrativos.
- source_word: בָּרִאשֹׁנָה
  choice: primeiro
  rationale: Expressa a prioridade na sequência sem acrescentar a ideia mais específica de uma primeira onda de ataque.
- source_word: וַיִּשְׁלַח
  choice: enviou homens
  rationale: O hebraico diz literalmente apenas que Ben-Hadade 'enviou', omitindo o objeto. 'Homens' explicita minimamente o objeto humano pressuposto pelo relato subsequente, sem identificá-los especificamente como batedores.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: e estes lhe informaram
  rationale: O hifil de נגד significa comunicar ou informar. A forma portuguesa introduz naturalmente o discurso direto sem reproduzir o hebraísmo 'dizendo'.
- source_word: אֲנָשִׁים
  choice: Alguns homens
  rationale: אֲנָשִׁים significa 'homens'; o indefinido 'alguns' torna natural em português a referência não especificada.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: saíram de Samaria
  rationale: Traduz diretamente a ação concluída de sair da cidade; o pretérito perfeito é natural no relato português.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadade
  rationale: Emprega a forma tradicional e amplamente reconhecível do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A explicitação 'homens' evita a frase truncada em português, enquanto a nota preserva a elipse e a ambiguidade do hebraico.
