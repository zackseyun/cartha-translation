base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: pt
  text: 'E ele lhe disse: “Assim diz Yahweh: Visto que você soltou de sua mão o homem que eu havia destinado à destruição,[a] a sua vida será em lugar da vida dele, e o seu povo, em lugar do povo dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem colocado sob a minha interdição”. O hebraico emprega a linguagem de חֵרֶם para alguém destinado à destruição sob o juízo divino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino da aliança, distinguindo-o de títulos como “Senhor”.
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz de modo natural e solene a causa da sentença.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: você soltou das suas mãos
  rationale: Expressa a libertação de alguém que estava sob o poder ou a custódia do rei, sem acrescentar a ideia de fuga.
- source_word: אִישׁ חֶרְמִי
  choice: o homem que eu havia destinado à destruição
  rationale: Representa o sufixo de primeira pessoa e a linguagem de חֵרֶם como uma destinação à destruição sob juízo divino.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: a sua vida responderá pela vida dele
  rationale: נֶפֶשׁ significa aqui “vida”; a formulação comunica a correspondência substitutiva e judicial de תַּחַת em português natural.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: e o seu povo, pelo povo dele
  rationale: Mantém o paralelismo conciso com a sentença anterior, deixando implícito o verbo já expresso.
theological_decisions:
- issue: Terminologia de חֵרֶם em um oráculo de juízo
  choice: destinado à destruição
  alternative: colocado sob a minha interdição
  rationale: Preserva a força do juízo divino e evita que “interdição” seja entendida apenas como uma proibição comum; a nota registra a alternativa técnica.
- issue: Sentido retributivo de תַּחַת
  choice: responderá pela
  alternative: em lugar de
  rationale: Comunica que a vida e o povo do rei serão exigidos em correspondência aos que ele poupou, sem definir além do texto o mecanismo exato do juízo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética “Assim diz Yahweh” e o paralelismo judicial foram preservados.
