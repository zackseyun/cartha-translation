  text: וַ/יֵּצְא֖וּ בַּֽ/צָּהֳרָ֑יִם וּ/בֶן הֲדַד֩ שֹׁתֶ֨ה שִׁכּ֜וֹר בַּ/סֻּכּ֗וֹת ה֧וּא וְ/הַ/מְּלָכִ֛ים שְׁלֹשִֽׁים וּ/שְׁנַ֥יִם מֶ֖לֶךְ עֹזֵ֥ר אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: pt
  text: Eles saíram ao meio-dia, enquanto Ben-Hadade bebia até ficar bêbado nos abrigos[a], ele e os trinta e dois reis que o ajudavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas cabanas” ou “nos pavilhões”. O hebraico diz literalmente “nas cabanas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Eles saíram
  rationale: O qal narrativo de יצא indica a saída deles, no contexto, da cidade, sem acrescentar a ideia mais marcada de uma investida.
- source_word: בַּצָּהֳרָיִם
  choice: ao meio-dia
  rationale: Expressão portuguesa corrente que preserva a indicação temporal específica do hebraico.
- source_word: וּבֶן הֲדַד
  choice: enquanto Ben-Hadade
  rationale: O waw introduz aqui uma circunstância simultânea à saída; “enquanto” torna essa relação natural em português.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: bebia até ficar bêbado
  rationale: O particípio apresenta uma ação em curso, e o adjetivo indica o estado de embriaguez resultante, sem explicitar uma bebida que o texto não nomeia.
- source_word: בַּסֻּכּוֹת
  choice: nos abrigos
  rationale: סֻכּוֹת designa estruturas temporárias cobertas. “Abrigos” é compreensível e preserva a amplitude lexical; a imagem mais literal e as alternativas contextuais são registradas em nota.
- source_word: הוּא וְהַמְּלָכִים
  choice: ele e os ... reis
  rationale: Mantém a inclusão enfática de Ben-Hadade junto aos reis associados.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: os trinta e dois reis
  rationale: A construção numeral hebraica é vertida pelo plural exigido pelo português.
- source_word: עֹזֵר אֹתוֹ
  choice: que o ajudavam
  rationale: O particípio expressa a ajuda contínua prestada pelos reis a Ben-Hadade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. O nome בֶּן־הֲדַד é transliterado como “Ben-Hadade”, forma transparente e legível em português. O marcador da nota foi colocado após “abrigos”, termo ao qual a nota lexical efetivamente se refere.
