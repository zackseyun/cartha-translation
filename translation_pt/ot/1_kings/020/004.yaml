base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: pt
  text: 'O rei de Israel respondeu: “Conforme a tua palavra, meu senhor, ó rei, eu e tudo o que tenho somos teus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A fórmula narrativa hebraica combina ‘respondeu’ e ‘disse’; em português atual, ‘respondeu’ introduz a fala com naturalidade e evita a redundância ‘respondeu e disse’.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: O rei de Israel
  rationale: Reprodução direta e idiomática da cadeia construta hebraica.
- source_word: כִּדְבָרְךָ
  choice: Conforme a tua palavra
  rationale: Preserva a imagem lexical de דָּבָר, ‘palavra’, e o tom formal e deferente da submissão.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, ó rei
  rationale: Trata אֲדֹנִי como título cortês dirigido a um soberano humano; o vocativo ‘ó rei’ torna clara a relação sintática sem sugerir referência divina.
- source_word: לְךָ אֲנִי
  choice: sou teu
  rationale: Expressa de modo conciso a posse ou submissão indicada pelo pronome com לְ.
- source_word: וְכָל אֲשֶׁר לִי
  choice: eu e tudo o que tenho
  rationale: A construção portuguesa integra naturalmente o pronome ‘eu’ e abrange tudo o que pertence ao rei, mantendo o sentido amplo do hebraico.
theological_decisions:
- issue: Sentido de אֲדֹנִי no discurso dirigido a Ben-Hadade
  choice: meu senhor
  alternative: meu soberano
  rationale: O termo funciona aqui como tratamento deferente a um rei humano, sem conotação de título divino.
translation_notes:
  register: Português moderno, digno e claro, com tom cortesão. Mantém-se ‘tua/teu’ pela coerência da segunda pessoa singular presente no hebraico e pela solenidade natural do diálogo real.
