base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: pt
  text: Cada um derrubou o homem que enfrentava[a]. Os arameus fugiram, e Israel os perseguiu. Mas Ben-Hadade, rei de Arã, escapou a cavalo, acompanhado de cavaleiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “cada homem derrubou o seu homem”, isto é, cada um derrubou o adversário que tinha diante de si.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “escapou montado num cavalo e com cavaleiros”. O hebraico pode descrever Ben-Hadade fugindo a cavalo na companhia de homens montados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: derrubou
  rationale: No contexto de combate, נכה indica golpear e derrotar. “Derrubou” comunica a incapacitação do adversário sem afirmar de modo explícito que ele morreu.
- source_word: אִישׁ אִישׁוֹ
  choice: cada um ... o homem que enfrentava
  rationale: A expressão significa literalmente “cada homem, o seu homem” e, neste contexto, designa o adversário que cada combatente tinha diante de si. A formulação escolhida preserva o sentido sem soar artificial em português.
- source_word: אֲרָם
  choice: os arameus / Arã
  rationale: O nome pode designar tanto o reino quanto suas forças. Na fuga coletiva, “os arameus” concorda naturalmente com o verbo hebraico plural; no título do rei, mantém-se o nome geográfico “Arã”.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: Tradução direta e natural do verbo de fuga em contexto militar.
- source_word: וַיִּרְדְּפֵם
  choice: os perseguiu
  rationale: רדף é o verbo habitual para perseguir forças em retirada.
- source_word: וַיִּמָּלֵט
  choice: escapou
  rationale: Expressa que Ben-Hadade conseguiu sair do perigo, sem acrescentar uma causa teológica não explicitada no verso.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadade
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: עַל סוּס
  choice: a cavalo
  rationale: Representa com naturalidade o hebraico “sobre um cavalo”, indicando que o rei fugiu montado.
- source_word: וּפָרָשִׁים
  choice: acompanhado de cavaleiros
  rationale: פָרָשִׁים designa cavaleiros ou homens montados. A formulação entende a conjunção como acompanhamento, leitura provável, mas não exclusiva.
