base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: pt
  text: Os israelitas foram reunidos e abastecidos[a], e saíram ao encontro deles. Os israelitas acamparam em frente deles, como dois pequenos rebanhos de cabras[b], enquanto os arameus encheram a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “receberam provisões” ou “foram sustentados”. O verbo provavelmente se refere ao abastecimento necessário para a campanha.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é incomum e literalmente diz “como dois חֲשִׂפֵי de cabras”. Ela retrata grupos muito pequenos em contraste com o vasto exército arameu.
    reason: cultural_note
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: foram convocados
  rationale: No contexto militar, o verbo indica que os homens foram reunidos ou alistados para a batalha; “convocados” comunica isso em português atual.
- source_word: וְכָלְכְּלוּ
  choice: abastecidos
  rationale: O verbo indica que receberam provisões ou sustento para a campanha; “abastecidos” é natural e preserva a provável referência aos suprimentos.
- source_word: לִקְרָאתָם
  choice: saíram ao encontro deles
  rationale: A expressão descreve o movimento para encontrar o adversário; o contexto deixa claro que se trata de um confronto militar sem exigir que isso seja explicitado no verbo.
- source_word: נֶגְדָּם
  choice: diante deles
  rationale: Indica posição em frente ou defronte do exército inimigo; “diante deles” é claro e idiomático.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: como dois pequenos rebanhos de cabras
  rationale: A expressão hebraica é rara e sua imagem exata é incerta, mas ressalta dois grupos diminutos de cabras; a tradução conserva a comparação e seu contraste visual.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: enquanto os arameus cobriam toda a terra
  rationale: O singular coletivo “Arã” representa o exército arameu. “Cobriam toda a terra” expressa naturalmente a ideia de uma força tão numerosa que enchia a região, em contraste com Israel.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a forma hebraica seja literalmente “os filhos de Israel”, “os israelitas” é o equivalente coletivo natural e amplamente compreensível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formas coletivas naturais (“israelitas”, “arameus”). A conjunção “enquanto” preserva o contraste contextual sem transformar o waw hebraico em uma oposição mais forte do que a forma exige.
