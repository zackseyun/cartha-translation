  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: pt
  text: 'Então ele lhe disse: “Devolverei as cidades que meu pai tomou de seu pai, e você poderá estabelecer para si ruas[a] em Damasco, assim como meu pai estabeleceu em Samaria.” “E eu, mediante este tratado[b], o deixarei ir.” Então ele fez um tratado[c] com ele e o deixou ir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ruas” ou “espaços abertos”. Neste contexto, o termo pode referir-se a mercados, bairros ou setores urbanos concedidos para atividades comerciais.
    reason: lexical_alternative
  - marker: b
    text: Ou “mediante uma aliança” ou “com esta aliança”. Aqui, o termo hebraico se refere a um acordo político entre reis.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “cortou um tratado com ele”, expressão idiomática hebraica para formalizar um acordo vinculante.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עִיר designa cidade ou povoado; no contexto de restituição territorial entre reis, “cidades” é a opção mais adequada.
- source_word: לָקַח ... אָשִׁיב
  choice: tomou ... devolverei
  rationale: O par verbal descreve a tomada de posse e sua reversão. “Devolverei” expressa de modo natural a restituição prometida.
- source_word: וְחוּצוֹת
  choice: áreas comerciais
  rationale: חוּצוֹת significa literalmente ruas ou espaços abertos, mas neste tratado provavelmente designa setores urbanos concedidos para atividade comercial ou administrativa. A tradução explicita a função provável, preservando o sentido literal em nota.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: você poderá estabelecer para si ... em Damasco
  rationale: שׂוּם significa pôr ou estabelecer; aqui se refere à criação de setores urbanos reconhecidos por acordo. A forma com “poderá” comunica a concessão diplomática.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: assim como meu pai estabeleceu em Samaria
  rationale: Mantém a repetição do mesmo verbo hebraico e a reciprocidade entre a concessão atual e o arranjo anterior em Samaria.
- source_word: בַּבְּרִית
  choice: mediante um tratado
  rationale: בְּרִית, neste contexto político entre reis, denota um acordo formal. “Mediante” expressa o tratado como base ou condição da libertação sem restringir indevidamente a força da preposição ב.
- source_word: אֲשַׁלְּחֶךָּ
  choice: eu o deixarei ir
  rationale: No contexto, Acabe promete libertar Ben-Hadade após o acordo; a expressão é corrente e preserva o valor causativo-prático do verbo.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: fez um tratado com ele
  rationale: כרת ברית é o idioma hebraico tradicional “cortar um pacto”; em português atual, “fazer um tratado” comunica naturalmente a formalização do acordo político.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: e o deixou ir
  rationale: Repete na narrativa o conteúdo da promessa anterior e indica que Acabe efetivamente libertou Ben-Hadade.
theological_decisions:
- issue: Sentido de בְּרִית num acordo entre reis
  choice: tratado
  alternative: aliança
  rationale: Embora בְּרִית também seja traduzido por “aliança”, aqui se trata de um pacto político negociado entre dois reis. “Tratado” evita sugerir indevidamente uma aliança divina ou teológica, enquanto a alternativa lexical permanece registrada em nota.
- issue: Mudança de interlocutor antes de “eu o deixarei ir”
  choice: apresentar a frase como uma segunda fala, sem acrescentar uma fórmula de elocução
  alternative: acrescentar “Acabe respondeu” para explicitar o falante
  rationale: O hebraico não traz uma nova fórmula como “Acabe disse”, embora o sentido exija que a promessa de libertação seja de Acabe. A pontuação assinala a mudança sem inserir palavras ausentes do texto-fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais naturais no português brasileiro. “Áreas comerciais” torna inteligível a provável função diplomático-urbana de חוּצוֹת, enquanto a nota conserva seu sentido literal. As duas falas são separadas para refletir a mudança implícita de interlocutor sem acrescentar “Acabe respondeu”, ausente do hebraico.
