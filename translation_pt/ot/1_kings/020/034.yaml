  naturalness: O português é claro e de registro apropriado. “Estabelecer para si ruas” é menos idiomático que a solução interpretativa do rascunho, mas é compreensível no contexto de concessões urbanas e preserva a abertura semântica do hebraico; a nota esclarece a possível referência a bairros ou mercados.
  terminology: “Cidades”, “tratado” e “deixou ir” são escolhas adequadas. “Tratado” traduz bem בְּרִית neste contexto político, sem impor conotação teológica. A repetição de “tratado” também acompanha o texto-fonte.
