  to: 'Enquanto o rei passava, ele clamou ao rei: «Teu servo saiu para o meio da batalha, e eis que um homem se desviou e trouxe-me um homem, dizendo: “Guarda este homem. Se ele de algum modo desaparecer[a], a tua vida será dada em lugar da vida dele[b], ou terás de pesar um talento de prata.”»'
  rationale: A revisão restitui «saiu» para o hebraico יָצָא e melhora a ligação entre o homem que se afasta e o ato de entregar outro homem à custódia do narrador. Mantêm-se a ambiguidade de «se desviou», a ênfase de «de algum modo desaparecer» e a terminologia jurídica e econômica do texto.
