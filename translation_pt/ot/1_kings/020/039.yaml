base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: pt
  text: 'Enquanto o rei passava, ele clamou ao rei: «Teu servo saiu para o meio da batalha, e eis que um homem se desviou e trouxe-me um homem, dizendo: “Guarda este homem. Se ele de algum modo desaparecer[a], a tua vida será dada em lugar da vida dele[b], ou terás de pesar um talento de prata.”»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Se ele vier a faltar» ou «Se de alguma maneira não for encontrado». O hebraico emprega uma construção enfática, com o infinitivo absoluto e uma forma finita do mesmo verbo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «a tua vida em lugar da vida dele», fórmula jurídica de substituição.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: passava
  rationale: O particípio, ligado a וַיְהִי, apresenta uma ação em andamento que serve de pano de fundo.
- source_word: צָעַק
  choice: clamou
  rationale: Expressa um chamado alto e urgente, mantendo um registro narrativo digno.
- source_word: עַבְדְּךָ
  choice: Teu servo
  rationale: É a forma apropriada de autorreferência cortês diante do rei; aqui, ‘servo’ é mais contextual do que ‘escravo’.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: para o meio da batalha
  rationale: Preserva a ideia espacial de estar no interior ou no ponto intenso do combate.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a apresentação vívida e repentina marcada pela partícula hebraica.
- source_word: אִישׁ סָר
  choice: um homem se desviou
  rationale: Conserva o sentido básico de סוּר, sem especificar de onde ou por que ele se afastou.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: trouxe outro homem até mim
  rationale: O segundo אִישׁ funciona como objeto da ação; ‘outro’ esclarece naturalmente em português que se trata de uma segunda pessoa.
- source_word: שְׁמֹר
  choice: Guarda
  rationale: Imperativo conciso que comunica custódia e vigilância no contexto militar.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: Se ele de algum modo desaparecer
  rationale: A expressão transmite a ausência ou perda do homem, enquanto ‘de algum modo’ procura representar a ênfase da construção hebraica.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: a tua vida será dada em lugar da vida dele
  rationale: נֶפֶשׁ significa aqui ‘vida’, e תַּחַת exprime substituição; a formulação preserva o caráter jurídico da ameaça.
- source_word: כִּכַּר כֶּסֶף
  choice: um talento de prata
  rationale: ‘Talento’ é a designação tradicional e reconhecível dessa antiga unidade de peso.
- source_word: תִּשְׁקוֹל
  choice: terás de pesar
  rationale: Preserva a imagem concreta de pagamento de prata por peso, em vez de substituí-la pelo verbo genérico ‘pagar’.
