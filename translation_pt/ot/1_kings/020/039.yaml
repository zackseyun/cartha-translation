  register: Português atual, digno e amplamente compreensível, com leve elevação narrativa em “clamou” e “eis que”. A segunda pessoa singular preserva a linguagem direta e respeitosa dirigida ao rei. Os marcadores de nota foram posicionados junto às expressões hebraicas que explicam.
