base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: pt
  text: 'Então ele disse: “Se eles saíram com intenções pacíficas, capturem-nos vivos; e, se saíram para a batalha, capturem-nos vivos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O wayyiqtol narrativo introduz a fala seguinte; “Então ele disse” expressa com naturalidade a progressão da narrativa em português.
- source_word: אִם
  choice: Se
  rationale: A partícula apresenta cada uma das duas situações condicionais, sem exigir o sentido alternativo de “quer... quer”.
- source_word: לְשָׁלוֹם
  choice: em paz
  rationale: Neste contexto, שָׁלוֹם indica intenção ou disposição pacífica. “Em paz” é natural em português e preserva a formulação nominal do hebraico.
- source_word: יָצָאוּ
  choice: saíram
  rationale: O perfeito descreve a saída já observada. O pretérito perfeito é conciso e idiomático no contexto narrativo.
- source_word: תִּפְשׂוּם
  choice: capturem-nos
  rationale: תפשׂ denota agarrar ou capturar; no contexto militar, “capturar” transmite claramente a ordem de fazer prisioneiros.
- source_word: חַיִּים
  choice: vivos
  rationale: O termo funciona predicativamente, indicando o estado em que os homens devem ser capturados.
- source_word: וְאִם
  choice: e, se
  rationale: Mantém a coordenação simples da segunda condição sem acrescentar um contraste mais forte que o hebraico.
- source_word: לְמִלְחָמָה
  choice: para a batalha
  rationale: מִלְחָמָה designa guerra ou combate; “para a batalha” é idiomático e forma o contraponto a “em paz”.
- source_word: חַיִּים תִּפְשׂוּם
  choice: capturem-nos vivos
  rationale: A tradução conserva a repetição enfática da ordem, embora use a ordem natural das palavras em português.
theological_decisions: []
