  text: וַ/יְמַהֵ֕ר וַ/יָּ֨סַר֙ אֶת הָ֣/אֲפֵ֔ר מ/על עֵינָ֑י/ו וַ/יַּכֵּ֤ר אֹת/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל כִּ֥י מֵֽ/הַ/נְּבִאִ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/041.yaml
  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: pt
  text: Então ele tirou depressa a faixa que cobria seus olhos[a], e o rei de Israel o reconheceu como um dos profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico הָאֲפֵר é tradicionalmente entendido por alguns como “as cinzas”, mas, neste contexto, provavelmente se refere a uma faixa ou cobertura usada sobre os olhos como disfarce.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: depressa
  rationale: O verbo מהר expressa pressa; o advérbio mantém o ritmo imediato da ação em português natural.
- source_word: וַיָּסַר
  choice: tirou
  rationale: Aqui, a forma verbal significa remover ou tirar; “tirou” é direta e idiomática para algo usado sobre os olhos.
- source_word: הָאֲפֵר
  choice: a faixa
  rationale: Embora אֵפֶר normalmente signifique “cinzas”, o contexto de 1 Reis 20:38,41 indica um objeto colocado sobre os olhos como disfarce. “Faixa” comunica essa função sem especificar indevidamente que se tratava de um curativo.
- source_word: מֵעַל עֵינָיו
  choice: que cobria seus olhos
  rationale: A expressão literalmente indica algo retirado de sobre os olhos. A oração relativa reproduz com clareza a relação espacial em português.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: o reconheceu
  rationale: O hifil de נכר significa reconhecer ou identificar; “reconheceu” é a formulação narrativa natural.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta da construção hebraica.
- source_word: כִּי מֵהַנְּבִאִים הוּא
  choice: como um dos profetas
  rationale: A partícula כִּי introduz o conteúdo do reconhecimento, e o מן partitivo indica que ele pertencia ao grupo dos profetas. Em português, “reconheceu como” expressa o conjunto da construção com naturalidade.
