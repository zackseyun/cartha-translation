  text: וַ/יֵּ֧לֶךְ מֶֽלֶךְ יִשְׂרָאֵ֛ל עַל בֵּית֖/וֹ סַ֣ר וְ/זָעֵ֑ף וַ/יָּבֹ֖א שֹׁמְרֽוֹנָ/ה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/043.yaml
  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: pt
  text: Então o rei de Israel foi para a sua casa, contrariado e irado[a], e chegou a Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ressentido e irado». O par hebraico סַר וְזָעֵף reúne ideias de desagrado interior e irritação manifesta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O wayyiqtol de הלך dá continuidade simples à narrativa; «foi» é direto e natural em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reproduz com clareza a cadeia construta hebraica e a designação convencional do personagem.
- source_word: עַל בֵּיתוֹ
  choice: para casa
  rationale: Com verbo de movimento, עַל indica aqui o destino. «Para casa» é idiomático e evita especificar «palácio», algo não expresso pelo substantivo בַּיִת.
- source_word: סַר
  choice: contrariado
  rationale: No par com זָעֵף, comunica uma disposição interior de desagrado e ressentimento; «contrariado» é corrente, claro e não força uma nuance excessivamente específica.
- source_word: וְזָעֵף
  choice: e irado
  rationale: O adjetivo expressa irritação ou ira manifesta. «Irado» preserva a intensidade e combina dignamente com «contrariado».
- source_word: וַיָּבֹא
  choice: e chegou
  rationale: Embora בוא seja literalmente «vir/entrar», diante de um destino geográfico «chegou» expressa naturalmente a conclusão do deslocamento sem alterar o sentido.
- source_word: שֹׁמְרוֹנָה
  choice: a Samaria
  rationale: O hê direcional marca movimento rumo a Samaria; em português, isso é expresso naturalmente por «chegou a Samaria».
