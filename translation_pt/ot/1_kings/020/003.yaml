base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: pt
  text: 'E ele lhe disse: “Assim diz Ben-Hadade: ‘A sua prata e o seu ouro são meus; as suas esposas e os seus filhos, os melhores[a], são meus.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as suas esposas e os seus melhores filhos são meus”. Neste contexto, o adjetivo hebraico pode significar “bons”, “melhores” ou “mais excelentes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: E ele lhe disse
  rationale: Preserva a fórmula narrativa hebraica e o objeto indireto, em português natural.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula solene de mensageiro que introduz uma proclamação citada.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadade
  rationale: Transliteração tradicional e amplamente reconhecível em português, com vogal final que representa a forma hebraica.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: A sua prata e o seu ouro
  rationale: Conserva os bens concretamente nomeados no hebraico, sem generalizar prata como dinheiro.
- source_word: לִי הוּא
  choice: são meus
  rationale: Expressa naturalmente em português a reivindicação de posse sobre os dois substantivos, apesar do pronome singular no hebraico.
- source_word: וְנָשֶׁיךָ
  choice: as suas mulheres
  rationale: No contexto familiar e possessivo, o termo designa as mulheres do rei, isto é, suas esposas; “mulheres” mantém uma formulação bíblica corrente e inteligível.
- source_word: וּבָנֶיךָ
  choice: os seus filhos
  rationale: O substantivo hebraico masculino plural designa aqui os filhos homens; em português, “filhos” preserva essa referência sem a ampliar explicitamente para todas as crianças.
- source_word: הַטּוֹבִים
  choice: os melhores
  rationale: A construção em aposição acompanha a ordem hebraica e preserva o possível sentido de bons, excelentes ou escolhidos, sem reduzir a expressão a qualidade moral.
- source_word: לִי הֵם
  choice: são meus
  rationale: Repete a declaração direta de posse e conserva o paralelismo enfático do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário de circulação internacional. A repetição de “são meus” e a ordem apositiva de “os seus filhos, os melhores” foram mantidas para refletir a ênfase e a estrutura do hebraico.
