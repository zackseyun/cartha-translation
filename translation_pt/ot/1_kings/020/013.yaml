  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: pt
  text: 'E eis que certo profeta se aproximou de Acabe, rei de Israel, e disse: “Assim diz Yahweh: Você viu toda esta grande multidão[a]? Eis que eu a entrego hoje em sua mão, e você saberá que eu sou Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo este vasto exército” ou “toda esta grande horda”. A palavra hebraica pode designar uma grande multidão ou hoste; aqui se refere às forças inimigas.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função discursiva e a vivacidade da partícula hebraica, introduzindo a chegada inesperada do profeta.
- source_word: נָבִיא אֶחָד
  choice: certo profeta
  rationale: A expressão significa literalmente “um profeta”, mas apresenta um indivíduo não identificado; “certo profeta” conserva essa nuance narrativa.
- source_word: נִגַּשׁ אֶל
  choice: se aproximou de
  rationale: Traduz de modo natural o sentido de chegar perto ou aproximar-se de alguém.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional de mensageiro e verte diretamente o nome divino.
- source_word: הֲרָאִיתָ
  choice: Você viu
  rationale: O perfeito interrogativo aponta para a força inimiga já visível diante de Acabe; em português, “Você viu...?” expressa isso com naturalidade.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: toda esta grande multidão
  rationale: Mantém o sentido amplo de uma grande massa de pessoas sem especificar além do hebraico que se trata de um exército.
- source_word: הִנְנִי נֹתְנוֹ
  choice: Eis que hoje eu a entrego
  rationale: “Eis que” conserva a ênfase e a iminência de הִנְנִי; o presente “entrego” comunica uma ação divina iminente e certa.
- source_word: בְיָדְךָ
  choice: nas suas mãos
  rationale: Reproduz em português corrente o idioma hebraico de colocar alguém sob o poder de outra pessoa.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: e você saberá que eu sou Yahweh
  rationale: Preserva a fórmula de reconhecimento e sua força resultativa, sem definir se o conhecimento é apenas intelectual ou também experiencial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome divino e evita substituí-lo por um título.
- issue: Alcance da fórmula de reconhecimento וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: “você saberá que eu sou Yahweh”
  alternative: Explicitar “reconhecerá a soberania de Yahweh”
  rationale: A tradução mantém a formulação aberta do hebraico, permitindo tanto a ideia de reconhecimento pela ação divina quanto implicações relacionais mais amplas, sem resolver a tensão no próprio texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E eis que” e “Assim diz” preservam o tom narrativo-profético; “você” torna clara a fala direta a Acabe sem recorrer a formas regionais ou arcaicas. O marcador da nota foi colocado junto a “multidão”, termo ao qual a nota lexical se refere.
