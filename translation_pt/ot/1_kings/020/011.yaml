  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֣אמֶר דַּבְּר֔וּ אַל יִתְהַלֵּ֥ל חֹגֵ֖ר כִּ/מְפַתֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: pt
  text: 'Então o rei de Israel respondeu: “Digam-lhe: ‘Quem veste a armadura não se gabe como quem a tira.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Quem cinge não se gabe como quem desata”. O provérbio contrapõe quem se prepara para a batalha a quem a termina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A fórmula hebraica literalmente reúne “respondeu e disse”; em português atual, “respondeu” expressa naturalmente a introdução do discurso sem uma duplicação pouco idiomática.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta e natural da identificação do falante.
- source_word: דַּבְּרוּ
  choice: Digam-lhe
  rationale: O imperativo está no plural e se dirige aos mensageiros; o pronome “lhe”, implícito no hebraico, é recuperado do contexto.
- source_word: אַל יִתְהַלֵּל
  choice: não se gabe
  rationale: O hitpael de הלל expressa gloriar-se ou vangloriar-se; “gabar-se” é claro, corrente e mantém a força proverbial.
- source_word: חֹגֵר
  choice: quem veste a armadura
  rationale: Literalmente, “quem cinge”. No contexto militar, indica equipar-se para a batalha; “veste a armadura” comunica a imagem de modo imediato sem apresentar o objeto implícito como se estivesse expresso no hebraico.
- source_word: כִּמְפַתֵּחַ
  choice: como quem a tira
  rationale: O particípio indica quem solta ou desata aquilo que havia cingido; no paralelismo militar, refere-se a retirar o equipamento depois da batalha.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial concisa. A repetição semítica “respondeu e disse” foi suavizada, enquanto o contraste concreto entre equipar-se e retirar o equipamento foi preservado.
