  yaml_path: translation/ot/1_kings/020/002.yaml
  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: pt
  text: E ele enviou mensageiros à cidade[a], a Acabe, rei de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para dentro da cidade”. A forma hebraica de “cidade” tem uma terminação que indica movimento em direção a ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: E ele enviou
  rationale: O wayyiqtol de שׁלח dá continuidade à narrativa com valor passado; a formulação preserva essa sequência sem acrescentar uma relação mais específica.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: No contexto político e militar, designa agentes humanos portadores de uma mensagem, não seres celestiais.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário do envio; em português, “a Acabe” expressa isso de modo claro e natural.
- source_word: אַחְאָב
  choice: Acabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: A cadeia construta identifica o cargo real de Acabe; a aposição sem artigo é natural em português.
- source_word: הָעִירָה
  choice: à cidade
  rationale: O ה direcional indica movimento em direção à cidade. “À cidade” preserva esse valor sem decidir além do hebraico se houve entrada nela.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A repetição de destinos — “à cidade, a Acabe” — acompanha a estrutura do hebraico e preserva a relação entre o local e o destinatário.
