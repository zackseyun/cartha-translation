source:
  edition: WLC
  text: וַ/יֵּצֵא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יַּ֥ךְ אֶת הַ/סּ֖וּס וְ/אֶת הָ/רָ֑כֶב וְ/הִכָּ֥ה בַ/אֲרָ֖ם מַכָּ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: pt
  text: Então o rei de Israel saiu, atacou os cavalos e os carros de guerra e infligiu a Arã[a] um grande golpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos arameus”. Em hebraico, “Arã” pode se referir ao reino ou às suas forças. Traduções tradicionais muitas vezes trazem “Síria”, mas o nome próprio hebraico é Arã.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Traduz naturalmente o verbo יצא na sequência narrativa, sem acrescentar a especificidade militar de “marchou”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reprodução direta e natural da expressão construta que identifica o sujeito.
- source_word: וַיַּךְ
  choice: atacou
  rationale: Neste contexto militar, נכה indica desferir um golpe contra as forças inimigas. “Atacou” evita a leitura excessivamente literal de que o rei golpeou pessoalmente cada animal ou carro, sem afirmar de antemão uma derrota total.
- source_word: הַסּוּס
  choice: os cavalos
  rationale: Embora formalmente singular, סוס tem sentido coletivo militar neste contexto; o plural comunica isso com naturalidade em português.
- source_word: הָרָכֶב
  choice: os carros de guerra
  rationale: רכב designa coletivamente a força de carros. “Carros de guerra” é claro para leitores modernos e evita a possível leitura de veículos comuns.
- source_word: וְהִכָּה
  choice: infligiu
  rationale: A segunda ocorrência de נכה rege o objeto cognato מַכָּה; “infligiu ... um grande golpe” preserva essa construção e soa natural em português.
- source_word: בַאֲרָם
  choice: a Arã
  rationale: Mantém o nome hebraico do reino ou povo, sem substituí-lo pelo tradicional “Síria”; a preposição portuguesa é regida por “infligiu”.
- source_word: מַכָּה גְדוֹלָה
  choice: um grande golpe
  rationale: Preserva a imagem ampla do hebraico e não especifica “massacre” ou “derrota” além do que a expressão declara.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo verbal e a imagem de “grande golpe”, esclarecendo apenas o caráter militar dos carros.
