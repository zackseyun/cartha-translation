source:
  edition: WLC
  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: pt
  text: Mas amanhã, por volta desta hora, enviarei meus servos até você. Eles revistarão a sua casa e as casas dos seus servos; porão as mãos em tudo o que for precioso aos seus olhos[a] e o levarão embora.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tudo aquilo em que seus olhos se deleitam”, isto é, tudo o que você considera muito valioso.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “porão em suas mãos e tomarão”; a expressão descreve tomar posse e levar consigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: No contexto, a expressão introduz uma correção adversativa e intensifica a ameaça anterior. “Mas” comunica essa virada de modo natural, sem impor ao hebraico uma negação independente.
- source_word: כָּעֵת מָחָר
  choice: amanhã, por volta desta hora
  rationale: Reproduz naturalmente a expressão temporal que indica aproximadamente a mesma hora no dia seguinte.
- source_word: עֲבָדַי
  choice: meus servos
  rationale: Refere-se aos agentes do rei enviados para cumprir sua ordem; “servos” preserva o termo amplo sem destacar indevidamente uma condição de escravidão.
- source_word: וְחִפְּשׂוּ
  choice: revistarão
  rationale: O verbo indica uma busca minuciosa. “Revistarão” se ajusta à busca coercitiva em casas sem acrescentar a ideia explícita de saque ou destruição.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: a sua casa e as casas dos seus servos
  rationale: Mantém o paralelo do hebraico. Embora בַּיִת possa designar um palácio, “casa” preserva a ambiguidade lexical e continua clara no contexto régio.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: tudo o que for precioso aos seus olhos
  rationale: Conserva a imagem hebraica dos olhos e comunica aquilo que alguém considera desejável, estimado ou valioso.
- source_word: יָשִׂימוּ בְיָדָם
  choice: porão as mãos em
  rationale: A formulação portuguesa preserva a imagem das mãos e expressa naturalmente a tomada de posse pretendida no contexto.
- source_word: וְלָקָחוּ
  choice: e o levarão embora
  rationale: Explicita, de maneira natural, que os bens tomados serão removidos, sentido exigido pela ameaça de confisco.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “você”. A tradução mantém a imagem idiomática “precioso aos seus olhos” e emprega “porão as mãos em” para conservar a linguagem concreta do hebraico sem produzir uma construção artificial.
