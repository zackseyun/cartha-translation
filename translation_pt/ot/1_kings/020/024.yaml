  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: pt
  text: 'E faça o seguinte: retire os reis, cada um de seu posto, e ponha governadores no lugar deles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: E faça o seguinte
  rationale: Expressa de modo natural a ordem introdutória, preservando a conjunção e o sentido amplo de דָּבָר como ação ou medida a ser tomada.
- source_word: הָסֵר
  choice: retire
  rationale: O imperativo causativo indica fazer sair ou remover. “Retire” mantém aberta a questão de se os reis seriam destituídos por completo ou apenas afastados de seus comandos.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: os reis, cada um de seu posto
  rationale: “Cada um” reproduz o valor distributivo de אִישׁ após o plural. “Posto” comunica a função ou posição ocupada no contexto militar e administrativo sem exigir um local físico.
- source_word: וְשִׂים
  choice: e ponha
  rationale: Equivalente direto e corrente de שׂים, que neste contexto implica colocar os substitutos nas funções antes ocupadas pelos reis.
- source_word: פַּחוֹת
  choice: governadores
  rationale: O termo designa autoridades administrativas ou governadores provinciais; “governadores” é claro e evita restringir indevidamente a função a uma patente militar.
- source_word: תַּחְתֵּיהֶם
  choice: no lugar deles
  rationale: 'A expressão indica substituição: os governadores ocupariam a posição anteriormente exercida pelos reis.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. “Posto” evita a repetição de “lugar” e esclarece que se trata de posição ou função, sem acrescentar uma interpretação denominacional.
