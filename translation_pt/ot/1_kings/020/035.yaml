source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: pt
  text: 'Certo homem dentre os filhos dos profetas[a] disse ao seu companheiro, pela palavra de Yahweh[b]: “Por favor, golpeie-me.” Mas o homem se recusou a golpeá-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do grupo dos profetas” ou “dos discípulos dos profetas”. O hebraico diz literalmente “dos filhos dos profetas”, expressão comum para um grupo profético.
    reason: lexical_alternative
  - marker: b
    text: Ou “por ordem de Yahweh” ou “conforme a palavra de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: Certo homem
  rationale: A expressão introduz um indivíduo não identificado na narrativa. “Certo homem” é natural em português e evita acrescentar um marcador temporal inexistente.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: dentre os filhos dos profetas
  rationale: Preserva a expressão hebraica e sua abertura quanto à natureza exata desse grupo profético; alternativas explicativas aparecem em nota.
- source_word: רֵעֵהוּ
  choice: seu companheiro
  rationale: “Companheiro” expressa a relação contextual sem pressupor a intimidade sugerida por “amigo”.
- source_word: בִּדְבַר יְהוָה
  choice: pela palavra de Yahweh
  rationale: Conserva o idioma hebraico, que aqui comunica autorização ou ordem divina, sem reduzir “palavra” explicitamente a “ordem” no texto principal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הַכֵּינִי נָא
  choice: Por favor, golpeie-me
  rationale: “Golpear” traduz נכה de modo direto; נָא é representado pela fórmula cortês “por favor”. O ferimento resultante não é antecipado neste versículo.
- source_word: וַיְמָאֵן
  choice: se recusou
  rationale: Comunica recusa definida, e não mera hesitação.
- source_word: לְהַכֹּתוֹ
  choice: a golpeá-lo
  rationale: Mantém consistência lexical com o imperativo anterior e não antecipa o resultado mais forte de ferir.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido social de בְּנֵי הַנְּבִיאִים
  choice: filhos dos profetas
  alternative: grupo dos profetas; discípulos dos profetas
  rationale: A expressão provavelmente designa membros de uma comunidade profética, mas o texto principal conserva a forma hebraica e deixa as interpretações em nota.
- issue: Força de בִּדְבַר יְהוָה
  choice: pela palavra de Yahweh
  alternative: por ordem de Yahweh; conforme a palavra de Yahweh
  rationale: A formulação mantém tanto a referência à palavra profética quanto sua força autorizadora, sem resolver a expressão apenas como “ordem”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem dos marcadores foi regularizada para [a] após a expressão sobre os profetas e [b] após a expressão sobre a palavra de Yahweh.
