base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: pt
  text: 'Os mensageiros voltaram e disseram: “Assim diz Ben-Hadade: ‘Embora[a] eu tenha mandado dizer a você: “Você me dará a sua prata, o seu ouro, as suas esposas e os seus filhos.”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois eu mandei dizer a você...” A partícula hebraica כי pode ter vários sentidos; aqui, ela é entendida como concessiva por causa da exigência ainda maior apresentada no versículo seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: Expressa naturalmente a sequência narrativa e o sentido de retorno de שוב.
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: No contexto diplomático e militar, מלאכים designa emissários humanos; “mensageiros” é claro e não acrescenta especialização indevida.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula convencional usada pelo mensageiro para transmitir uma proclamação.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadade
  rationale: Segue a forma tradicional e amplamente reconhecível do nome em português.
- source_word: כִּי
  choice: Embora
  rationale: Entende a partícula em sentido concessivo, preparando a intensificação da exigência no versículo seguinte, sem ocultar a alternativa lexical registrada em nota.
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: eu tenha mandado dizer a você
  rationale: Forma idiomática em português que comunica o envio anterior de uma mensagem sem sugerir necessariamente a presença pessoal do remetente.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: a sua prata, o seu ouro
  rationale: Mantém os bens concretos mencionados no hebraico e distribui o possessivo de modo natural em português.
- source_word: וְנָשֶׁיךָ
  choice: as suas mulheres
  rationale: “Mulheres” pode designar as esposas de Acabe neste contexto e corresponde ao uso bíblico do substantivo, sem estreitar explicitamente uma forma lexical que também significa mulheres.
- source_word: וּבָנֶיךָ
  choice: os seus filhos
  rationale: “Filhos” é a correspondência portuguesa normal para בנים no masculino plural e preserva a referência masculina possível.
- source_word: לִי תִתֵּן
  choice: Você me dará
  rationale: Reproduz a exigência obrigatória do imperfeito hebraico dentro do ultimato, com linguagem atual e firme.
