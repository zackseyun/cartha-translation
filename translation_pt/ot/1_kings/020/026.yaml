base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: pt
  text: Quando o ano completou seu ciclo[a], Ben-Hadade mobilizou Arã[b] e subiu para Afeque, a fim de batalhar contra Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “no retorno do ano”, expressão que indica a chegada de novo do mesmo período do ciclo anual; alguns traduzem “na primavera”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os arameus”. Em hebraico, “Arã” pode designar o reino ou seu povo e exército.
    reason: lexical_alternative
  - marker: c
    text: Ou “com Israel”. A preposição hebraica significa literalmente “com”, mas aqui ocorre em contexto de batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: quando o ano completou seu ciclo
  rationale: A expressão significa literalmente “no retorno do ano” e indica que o ciclo anual chegou novamente ao mesmo período. A formulação preserva a imagem do ciclo sem identificar de modo conclusivo a estação como primavera.
- source_word: וַיִּפְקֹד
  choice: mobilizou
  rationale: Em contexto militar, פקד pode indicar a convocação, inspeção ou reunião das forças. “Mobilizou” comunica de modo natural a preparação militar sem reduzir o verbo a uma simples contagem.
- source_word: אֶת אֲרָם
  choice: Arã
  rationale: Mantém o nome hebraico do reino ou povo, em vez de empregar o nome geopolítico posterior “Síria”. No contexto, Arã representa suas forças militares.
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido básico de עלה e sua possível dimensão topográfica, sem substituí-lo por um verbo militar mais interpretativo.
- source_word: אֲפֵקָה
  choice: para Afeque
  rationale: O hê direcional ligado ao topônimo indica movimento em direção a Afeque; em português, isso é expresso naturalmente por “para Afeque”.
- source_word: לַמִּלְחָמָה
  choice: a fim de batalhar
  rationale: Expressa de maneira corrente a finalidade militar do deslocamento, correspondente a “para a batalha” ou “para a guerra”.
- source_word: עִם יִשְׂרָאֵל
  choice: contra Israel
  rationale: Embora עִם signifique literalmente “com”, em contexto de combate o português idiomático pede “contra”; a nota registra a forma literal e preserva a alternativa.
