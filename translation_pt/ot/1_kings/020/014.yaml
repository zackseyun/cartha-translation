base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: pt
  text: 'Acabe perguntou: “Por meio de quem?” Ele respondeu: “Assim diz Yahweh: Por meio dos jovens dos chefes das províncias[a].” Acabe perguntou ainda: “Quem dará início à batalha?” Ele respondeu: “Você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servidores” ou “auxiliares dos chefes das províncias”. O termo hebraico traduzido como “jovens” também pode se referir a pessoas que serviam autoridades como membros de sua comitiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: Por meio de quem?
  rationale: A preposição בְּ com o interrogativo מִי indica o agente ou meio pelo qual a ação será realizada. “Por meio de quem?” expressa claramente essa instrumentalidade em português.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Conserva a fórmula solene de mensageiro profético e representa o nome divino יְהוָה como nome próprio.
- source_word: בְּנַעֲרֵי
  choice: Por meio dos jovens
  rationale: נַעַר pode designar um jovem e, por extensão, um servidor, auxiliar ou membro da comitiva. O texto principal mantém o sentido lexical mais direto, enquanto a nota registra o sentido funcional possível no contexto.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: dos chefes das províncias
  rationale: שָׂרִים designa autoridades ou chefes, e מְדִינוֹת, unidades administrativas. A expressão é clara sem atribuir a essas autoridades um cargo militar mais específico do que o hebraico permite.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: Quem dará início à batalha?
  rationale: Embora אָסַר signifique literalmente “amarrar”, com מִלְחָמָה forma uma expressão idiomática referente a iniciar ou travar o combate.
- source_word: אָתָּה
  choice: Você
  rationale: O pronome independente de segunda pessoa masculina singular fornece uma resposta direta e enfática a Acabe.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva sua função de nome pessoal, sem substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A repetição hebraica de “disse” foi variada discretamente com “perguntou” e “respondeu”, conforme a função de cada fala, sem identificar além do texto o interlocutor de Acabe. A formulação “jovens dos chefes” mantém a ambiguidade entre idade e função de serviço, esclarecida em nota.
