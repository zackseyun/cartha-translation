base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: pt
  text: 'Então o profeta se aproximou do rei de Israel e lhe disse: “Vá, fortaleça-se, saiba e veja o que deve fazer[a], pois, quando o ano voltar[b], o rei de Arã[c] subirá contra você”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que fará”. A forma hebraica é literalmente futura, mas, neste contexto, provavelmente indica o que o rei deve fazer para se preparar.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no retorno do ano”, expressão que muitas vezes se refere à época em que as campanhas militares eram retomadas; algumas traduções dizem “na próxima primavera”.'
    reason: cultural_note
  - marker: c
    text: 'Tradicionalmente: “o rei da Síria”; o hebraico traz “Arã”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: Expressa de modo natural o movimento de chegar perto indicado por נגשׁ.
- source_word: הִתְחַזַּק
  choice: fortaleça-se
  rationale: Preserva a força reflexiva do imperativo hitpael e, no contexto, sugere preparar-se para o conflito vindouro.
- source_word: וְדַע וּרְאֵה
  choice: saiba e veja
  rationale: Mantém os dois imperativos distintos do hebraico, sem reduzi-los silenciosamente a um único verbo interpretativo.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: o que deve fazer
  rationale: 'Embora a forma hebraica seja literalmente futura, no contexto tem força prática e deliberativa: o rei deve avaliar as providências necessárias.'
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: na virada do ano
  rationale: Preserva a imagem do retorno ou giro do ano e evita substituir o idioma por uma estação específica no texto principal.
- source_word: מֶלֶךְ אֲרָם
  choice: o rei de Arã
  rationale: Translitera diretamente o nome hebraico אֲרָם, em vez de empregar a identificação tradicional posterior 'Síria'.
- source_word: עֹלֶה עָלֶיךָ
  choice: subirá contra você
  rationale: Comunica o valor preditivo do particípio no contexto e conserva a imagem militar de marchar ou subir contra alguém.
