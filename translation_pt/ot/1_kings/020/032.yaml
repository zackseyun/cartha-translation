base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: pt
  text: 'Então eles cingiram-se de panos de saco à cintura e puseram cordas na cabeça; foram ao rei de Israel e disseram: “Seu servo Ben-Hadade diz: ‘Por favor, deixe-me viver[a].’” O rei perguntou: “Ele ainda está vivo? É meu irmão[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Poupe a minha vida, por favor.” Literalmente: “Que a minha vida viva, por favor.”'
    reason: lexical_alternative
  - marker: b
    text: “É meu irmão” provavelmente expressa fraternidade política ou pactual, não parentesco literal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  choice: cingiram
  rationale: O verbo חגר indica prender ou cingir algo ao corpo. “Cingiram” preserva a ação concreta e combina naturalmente com “a cintura com pano de saco” em registro digno.
- source_word: שַׂקִּים בְּמָתְנֵיהֶם
  choice: a cintura com pano de saco
  rationale: מָתְנַיִם designa a cintura ou os lombos, e שַׂקִּים refere-se ao tecido grosseiro usado como sinal de luto ou humilhação. A formulação é clara em português moderno sem perder a imagem.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: e puseram cordas sobre a cabeça
  rationale: חֲבָלִים significa “cordas” ou “cordões”. A preposição permite descrevê-las sobre a cabeça, sem especificar além do texto como estavam dispostas.
- source_word: עַבְדְּךָ
  choice: Seu servo
  rationale: Em discurso diplomático dirigido a um rei, עבד funciona como autodesignação de submissão. “Servo” preserva essa fórmula sem enfatizar indevidamente a condição jurídica de escravo.
- source_word: בֶן הֲדַד
  choice: Ben-Hadade
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: Por favor, deixe-me viver
  rationale: A expressão significa literalmente algo como “Viva, por favor, a minha vida”, mas funciona idiomaticamente como súplica para que a vida seja poupada. A tradução comunica seu sentido com naturalidade.
- source_word: הַעוֹדֶנּוּ חַי
  choice: Ele ainda está vivo?
  rationale: A construção interrogativa com עוֹד pergunta se Ben-Hadade permanece vivo. A formulação é direta e corrente.
- source_word: אָחִי הוּא
  choice: É meu irmão
  rationale: A tradução mantém o termo de parentesco אָחִי e sua força retórica, sem decidir no corpo do texto se a relação é literal ou política.
theological_decisions:
- issue: Sentido de “irmão” na resposta do rei
  choice: Manter literalmente “É meu irmão”.
  alternative: “É meu aliado” ou “É como um irmão para mim”.
  rationale: Embora o contexto sugira fraternidade política ou pactual, o hebraico emprega o termo comum para “irmão”. Preservá-lo mantém a ambiguidade e a tensão narrativa sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “cingiram a cintura” conserva a imagem antiga sem recorrer a “lombos”, menos corrente. As falas mantêm a deferência diplomática e a ambiguidade do termo “irmão”.
