base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: pt
  text: 'Então ele lhe disse: “Já que você não obedeceu à voz do SENHOR, eis que, quando se afastar de mim, o leão o matará”. Depois que ele se afastou dele, o leão o encontrou e o matou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא שָׁמַעְתָּ בְּקוֹל
  choice: não obedeceu à voz
  rationale: A expressão hebraica significa literalmente ‘não ouviu a voz’, mas, neste contexto, indica não atender ou não obedecer à ordem; ‘à voz’ preserva a forma e a ênfase do original.
- source_word: הִנְּךָ הוֹלֵךְ מֵאִתִּי
  choice: assim que sair daqui
  rationale: 'Expressa naturalmente em português a circunstância iminente indicada pelo hebraico: ao deixar a presença do profeta.'
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: o matará / o matou
  rationale: Embora נכה possa significar ‘ferir’ ou ‘golpear’, o contexto narrativo indica um ataque fatal; ‘matar’ comunica o resultado sem a expressão pouco natural ‘golpear para baixo’.
- source_word: הָאַרְיֵה
  choice: um leão
  rationale: O artigo hebraico pode apontar para o leão anunciado e depois encontrado; em português, a primeira menção pede naturalmente o indefinido, repetido na realização da profecia.
theological_decisions:
- issue: A consequência de desobedecer à palavra profética como desobediência ao SENHOR
  choice: “não obedeceu à voz do SENHOR”
  alternative: “não ouviu a voz do SENHOR”
  rationale: O profeta identifica sua ordem com a voz do SENHOR. A tradução preserva essa afirmação narrativa sem acrescentar uma teoria geral sobre autoridade profética.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O nome divino é vertido por SENHOR em versaletes convencionais. A repetição entre anúncio e cumprimento foi mantida.
