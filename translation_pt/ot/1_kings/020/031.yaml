    rationale: Há uma após 'eis/veja' e outra na proposta dos servos. Embora possam ser parcialmente absorvidas pelo tom, 'por favor' as transmite naturalmente sem artificialidade.
  - severity: low
    issue: '''Sair ao encontro do rei'' pode sugerir que o rei se aproxima ou que haverá um encontro combinado.'
    rationale: וְנֵצֵא אֶל significa mais literalmente 'sair e ir até o rei'. A formulação revista conserva a direção sem essa possível inferência.
