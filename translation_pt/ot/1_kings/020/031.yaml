revisions:
- from: 'Então os servos dele lhe disseram: “Veja, ouvimos dizer que os reis da casa de Israel são reis misericordiosos. Vamos pôr pano de saco em volta da cintura e cordas na cabeça, e sair ao encontro do rei de Israel. Talvez ele poupe a sua vida.”'
  to: 'Então os servos dele lhe disseram: “Veja, por favor, ouvimos dizer que os reis da casa de Israel são reis misericordiosos. Vamos, por favor, pôr pano de saco em volta da cintura e cordas sobre a cabeça e ir até o rei de Israel. Talvez ele poupe a sua vida.”'
  rationale: A revisão explicita as duas partículas hebraicas de cortesia, ajusta a localização das cordas para uma formulação portuguesa mais natural e substitui 'sair ao encontro' por 'ir até', que não acrescenta uma circunstância ao texto-fonte. O restante da redação é preservado.
