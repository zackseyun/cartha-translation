  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: pt
  text: 'Então os servos dele lhe disseram: “Veja, por favor, ouvimos dizer que os reis da casa de Israel são reis misericordiosos. Vamos, por favor, pôr pano de saco em volta da cintura e cordas sobre a cabeça e ir até o rei de Israel. Talvez ele poupe a sua vida.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Veja
  rationale: Introduz e enfatiza a informação de modo natural em português; a nuance cortês de נָא fica suficientemente expressa pelo tom da proposta, sem o artificial 'veja, por favor'.
- source_word: מַלְכֵי חֶסֶד
  choice: reis misericordiosos
  rationale: חֶסֶד aqui descreve clemência ou misericórdia esperada de reis vitoriosos; 'misericordiosos' preserva a formulação predicativa hebraica.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: pano de saco em volta da cintura
  rationale: Expressa o sinal externo de humilhação e súplica, com linguagem corrente e clara.
- source_word: וַחֲבָלִים בְּרֹאשֵׁנוּ
  choice: cordas na cabeça
  rationale: Mantém literalmente a imagem incomum do hebraico, sem explicar além do texto.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: poupe a sua vida
  rationale: Equivalente idiomático natural para a expressão hebraica 'deixar viva a sua vida/pessoa', dirigida ao rei.
theological_decisions:
- issue: Sentido de חֶסֶד aplicado aos reis de Israel
  choice: misericordiosos
  alternative: leais / bondosos
  rationale: Neste contexto de rendição, a esperança é de clemência para com o inimigo derrotado, não de fidelidade pactual; a escolha evita importar uma leitura teológica especializada.
- issue: Simbolismo das cordas sobre a cabeça
  choice: preservar sem interpretação
  alternative: explicitar que eram sinal de submissão ou disposição para execução
  rationale: O texto relata o gesto, mas não define explicitamente seu simbolismo; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição enfática do hebraico em 'reis... reis misericordiosos' foi mantida. 'Vamos pôr' transmite naturalmente a proposta cohortativa marcada por נָא.
