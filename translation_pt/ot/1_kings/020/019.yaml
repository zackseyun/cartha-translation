  text: וְ/אֵ֨לֶּה֙ יָצְא֣וּ מִן הָ/עִ֔יר נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וְ/הַ/חַ֖יִל אֲשֶׁ֥ר אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: pt
  text: 'Estes saíram da cidade: os jovens dos comandantes das províncias[a] e o exército que vinha atrás deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os servos” ou “os auxiliares dos comandantes das províncias”. O termo hebraico נַעֲרֵי pode se referir tanto a jovens quanto a servos ou auxiliares pessoais; neste contexto, as duas ideias podem estar presentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes
  rationale: O demonstrativo plural retoma o grupo mencionado e contado no versículo anterior. A conjunção pode ser omitida em português sem perder a ligação narrativa.
- source_word: יָצְאוּ
  choice: saíram
  rationale: Tradução direta do verbo comum para sair, sem acrescentar a ideia mais específica de marchar.
- source_word: מִן הָעִיר
  choice: da cidade
  rationale: Expressa de modo natural e conciso o ponto de partida.
- source_word: נַעֲרֵי
  choice: os jovens
  rationale: נַעַר pode indicar jovens, servos ou auxiliares. “Jovens” preserva o sentido lexical básico, enquanto a acepção funcional é registrada em nota.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: dos comandantes das províncias
  rationale: שַׂר pode designar chefe, autoridade ou comandante; o contexto militar favorece “comandantes”. A construção com “das províncias” reflete claramente a relação genitiva hebraica.
- source_word: וְהַחַיִל
  choice: e o exército
  rationale: Neste contexto, חַיִל designa a força militar que os acompanhava; “exército” é claro e corrente.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: que vinha atrás deles
  rationale: Reproduz tanto a posição posterior quanto o movimento da força que seguia o primeiro grupo, sem tornar o verbo excessivamente militar.
