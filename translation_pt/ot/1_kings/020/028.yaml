  source_fidelity: 'O conteúdo corresponde ao hebraico: o homem de Deus aproxima-se, a fala é dirigida ao rei, Aram/os arameus atribui a Yahweh domínio sobre os montes, a grande multidão é entregue ao rei, e o verbo final está no plural. A revisão preserva de modo mais claro a alternância hebraica entre o singular em בְּיָדְךָ e o plural em וִידַעְתֶּם.'
