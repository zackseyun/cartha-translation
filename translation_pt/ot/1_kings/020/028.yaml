source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: pt
  text: 'Então o homem de Deus se aproximou e disse ao rei de Israel: “Assim diz Yahweh: Visto que os arameus disseram que Yahweh é deus dos montes, mas não é deus dos vales, entregarei toda esta grande multidão em sua mão; e vocês saberão[a] que eu sou Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em “em sua mão”, o hebraico se dirige ao rei no singular; em “vocês saberão”, passa ao plural, incluindo Israel coletivamente.
    reason: grammatical_number
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: A expressão é definida e, no contexto narrativo, designa um porta-voz profético já identificável.
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: Expressa de modo natural o movimento concreto de chegar perto, sem acrescentar circunstâncias.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética solene e verte diretamente o nome divino.
- source_word: אֲרָם
  choice: os arameus
  rationale: Embora a forma hebraica seja o nome coletivo Aram, aqui ele funciona como sujeito plural de 'disseram'; 'os arameus' torna isso claro e natural em português.
- source_word: אֱלֹהֵי הָרִים ... אֱלֹהֵי עֲמָקִים
  choice: deus dos montes ... deus dos vales
  rationale: Preserva o contraste topográfico e a concepção equivocada dos arameus de que Yahweh seria uma divindade limitada a determinado terreno.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: toda esta grande multidão
  rationale: Conserva a amplitude lexical de הָמוֹן, embora o contexto seja militar.
- source_word: בְּיָדֶךָ
  choice: nas suas mãos
  rationale: Preserva a imagem idiomática hebraica de entregar alguém ao poder de outro; o pronome continua dirigido ao rei.
- source_word: וִידַעְתֶּם
  choice: vocês saberão
  rationale: Torna explícito em português que o verbo hebraico passa ao plural, abrangendo os israelitas e não apenas o rei.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Mantém sem substituição titular a fórmula de autoidentificação por meio do nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e é aplicada de modo uniforme nas três ocorrências.
- issue: Concepção arameia de uma divindade territorial
  choice: Yahweh é deus dos montes, mas não é deus dos vales
  alternative: Yahweh é o Deus dos montes, mas não o Deus dos vales
  rationale: A ausência de artigo em 'deus' comunica naturalmente que os arameus tratavam Yahweh como uma divindade localizada entre outras, sem endossar essa afirmação.
- issue: Mudança do singular para o plural no destinatário
  choice: nas suas mãos; vocês saberão
  alternative: na tua mão; saberás
  rationale: O hebraico dirige 'tua mão' no singular ao rei, mas emprega 'vocês saberão' no plural, estendendo o reconhecimento de Yahweh à coletividade de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a solenidade profética, explicita a mudança de número exigida pelo hebraico e evita identificar Aram com um nome geopolítico posterior.
