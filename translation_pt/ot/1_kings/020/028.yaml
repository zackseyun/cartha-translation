  terminology: “Yahweh”, “o homem de Deus”, “os arameus”, “montes” e “vales” são escolhas adequadas. “Em sua mão” é mais próximo do singular hebraico e soa idiomático em português; a nota esclarece a posterior mudança para o plural.
