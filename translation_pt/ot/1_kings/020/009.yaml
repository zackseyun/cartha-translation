  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: pt
  text: 'Então ele disse aos mensageiros de Ben-Hadade: “Digam ao meu senhor, o rei: ‘Tudo o que mandaste ao teu servo da primeira vez, farei; mas isto[a] não posso fazer’”. Os mensageiros foram e lhe levaram a resposta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser traduzido por “esta coisa”, “esta questão” ou “esta matéria”.
    reason: Preserva a amplitude semântica de דָּבָר sem introduzir como alternativa lexical direta a interpretação contextual «exigência».
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: mensageiros
  rationale: No contexto diplomático, designa representantes humanos enviados pelo rei, não seres sobrenaturais.
- source_word: בֶן הֲדַד
  choice: Ben-Hadade
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: ao meu senhor, o rei
  rationale: Preserva a fórmula diplomática de deferência sem sugerir referência divina.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ אֶל עַבְדְּךָ בָרִאשֹׁנָה
  choice: Tudo o que mandaste ao teu servo da primeira vez
  rationale: Mantém a referência ao primeiro recado de Ben-Hadade e a autodesignação diplomática de submissão, sem transformar explicitamente o conteúdo em uma exigência.
- source_word: אֶעֱשֶׂה
  choice: farei
  rationale: Reproduz de modo direto e natural a forma verbal hebraica.
- source_word: וְהַדָּבָר הַזֶּה
  choice: mas isto
  rationale: Em português, “isto” retoma naturalmente a nova exigência e evita a formulação pouco idiomática “esta coisa”; a nota registra a amplitude lexical de דָּבָר.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: não posso fazer
  rationale: Expressa diretamente a incapacidade ou recusa formulada com יכל mais infinitivo, preservando a repetição de “fazer”.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: lhe levaram a resposta
  rationale: Traduz idiomaticamente a ação dos mensageiros de transmitir de volta a Ben-Hadade a resposta recebida.
