  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém a deferência da fala dirigida ao rei e o tom jurídico da resposta, sem explicitar na linha principal que o homem fugiu, pois o hebraico afirma apenas sua ausência.
