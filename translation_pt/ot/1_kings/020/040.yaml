base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: pt
  text: 'Enquanto o seu servo estava ocupado aqui e ali[a], ele já não estava ali[b]. Então o rei de Israel lhe disse: “Assim será a sua sentença[c]; você mesmo a determinou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava fazendo isto e aquilo”. A expressão hebraica indica estar ocupado com várias coisas ou em vários lugares.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e ele não está”. Isto é, o homem que estava sob guarda já não se encontrava ali.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o seu julgamento” ou “o seu veredito”. O rei aplica ao homem o padrão de julgamento que ele próprio apresentou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: Forma deferente de autorreferência diante do rei; preserva a linguagem social e política sem impor a ideia mais específica de escravidão.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: estava ocupado aqui e ali
  rationale: Reproduz de modo natural o idioma hebraico que indica estar atarefado em várias direções ou tarefas.
- source_word: וְהוּא אֵינֶנּוּ
  choice: o homem desapareceu
  rationale: A expressão significa literalmente que ele já não estava presente; “desapareceu” comunica sua ausência repentina sem especificar além do contexto como saiu.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta do título hebraico.
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: Essa é a sua sentença
  rationale: Expressa a conclusão judicial do rei em português natural; מִשְׁפָּט pode designar aqui a decisão ou sentença aplicável ao próprio homem.
- source_word: אַתָּה חָרָצְתָּ
  choice: você mesmo a determinou
  rationale: Preserva a ênfase do pronome explícito אַתָּה e o sentido judicial de חרץ, decidir ou determinar.
