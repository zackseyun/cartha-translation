  text: וַ/יִּפְקֹ֗ד אֶֽת נַעֲרֵי֙ שָׂרֵ֣י הַ/מְּדִינ֔וֹת וַ/יִּהְי֕וּ מָאתַ֖יִם שְׁנַ֣יִם וּ/שְׁלֹשִׁ֑ים וְ/אַחֲרֵי/הֶ֗ם פָּקַ֧ד אֶת כָּל הָ/עָ֛ם כָּל בְּנֵ֥י יִשְׂרָאֵ֖ל שִׁבְעַ֥ת אֲלָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: pt
  text: 'Então ele passou em revista os jovens dos chefes das províncias; eram duzentos e trinta e dois. Depois deles, passou em revista todo o povo, todos os filhos de Israel[a]: sete mil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os israelitas”. O hebraico diz literalmente “todos os filhos de Israel”, expressão familiar masculina usada para designar o povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: passou em revista
  rationale: No contexto de mobilização militar, o verbo indica reunir e contabilizar os homens para o serviço. A expressão portuguesa comunica esse sentido sem reduzi-lo a uma simples contagem.
- source_word: נַעֲרֵי
  choice: os jovens
  rationale: נַעַר pode designar jovem, servo ou auxiliar. “Os jovens” conserva o sentido mais direto e evita definir uma função social que o texto não explicita.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: dos chefes das províncias
  rationale: שַׂר designa um líder ou alto oficial, e מְדִינָה uma divisão administrativa. “Chefes das províncias” mantém a relação genitiva do hebraico e não impõe uma função estritamente militar.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: duzentos e trinta e dois
  rationale: Tradução direta e natural do numeral em português.
- source_word: וְאַחֲרֵיהֶם
  choice: Depois deles
  rationale: Preserva tanto a sequência quanto a referência concreta ao primeiro grupo mobilizado.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Mantém o substantivo abrangente do hebraico, embora o contexto seja militar, sem substituí-lo por “exército” ou “tropas”.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Reproduz a expressão familiar masculina do hebraico; a nota oferece a formulação coletiva mais corrente em português.
- source_word: שִׁבְעַת אֲלָפִים
  choice: sete mil
  rationale: Tradução direta do total indicado para o segundo grupo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. A repetição de “passou em revista” preserva a repetição verbal do hebraico. O marcador da nota foi colocado após “filhos de Israel”, expressão à qual a alternativa se refere.
