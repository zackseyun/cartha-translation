  yaml_path: translation/ot/1_kings/020/038.yaml
  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: pt
  text: Então o profeta foi postar-se à beira do caminho, à espera do rei, e se disfarçou com uma faixa sobre os olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «com cinzas sobre os olhos». A expressão pode referir-se a cinzas literais ou, neste contexto, a uma faixa ou cobertura usada como disfarce.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ... foi
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Tradução direta do substantivo definido.
- source_word: וַיַּעֲמֹד לַמֶּלֶךְ עַל הַדָּרֶךְ
  choice: foi postar-se à beira do caminho, à espera do rei
  rationale: “Postar-se” comunica uma posição deliberadamente assumida, e “à espera do rei” explicita de modo natural a relação expressa por לַמֶּלֶךְ no contexto, sem afirmar que o profeta já estivesse diante dele.
- source_word: וַיִּתְחַפֵּשׂ
  choice: se disfarçou
  rationale: O hitpael indica que o profeta tornou a si mesmo irreconhecível ou assumiu um disfarce.
- source_word: בָּאֲפֵר
  choice: com uma faixa
  rationale: O vocábulo é lexicalmente incerto neste contexto. Embora possa ser associado a “cinzas”, a colocação sobre os olhos, sua remoção em 1 Reis 20:41 e a função de disfarce favorecem uma cobertura ou faixa no texto principal; a alternativa é preservada em nota.
- source_word: עַל עֵינָיו
  choice: sobre os olhos
  rationale: Mantém a referência anatômica direta e descreve naturalmente a posição da faixa.
