base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: pt
  text: Estes acamparam diante daqueles durante sete dias. No sétimo dia, a batalha se aproximou, e os filhos de Israel[a] abateram, num só dia, cem mil soldados de infantaria de Aram[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Em hebraico, literalmente, “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os arameus”. “Aram” pode designar o reino ou o povo arameu.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “combatentes a pé”. O hebraico se refere literalmente a tropas “a pé”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: ficaram acampados
  rationale: O verbo חנה indica estabelecer acampamento. A formulação é natural em português e mantém a duração indicada no contexto.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: estes ... diante daqueles
  rationale: Preserva o contraste conciso entre os dois exércitos e o sentido espacial de נֹכַח, isto é, um grupo em frente ao outro.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressa de modo idiomático a duração do acampamento.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: A fórmula narrativa ויהי é representada naturalmente pela progressão temporal, sem expressão arcaizante desnecessária.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: começou a batalha
  rationale: קרב significa literalmente aproximar-se; neste contexto, a expressão assinala que os exércitos entraram em combate. A nota conserva a imagem literal.
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: נכה é um verbo amplo de golpear ou abater. “Feriram” preserva sua amplitude sem transformar explicitamente cada ocorrência em “mataram”, embora o contexto descreva uma derrota devastadora.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão hebraica masculina e corporativa, apropriada aqui à força combatente de Israel.
- source_word: אֲרָם
  choice: Aram
  rationale: Conserva o nome próprio hebraico, evitando o rótulo geopolítico posterior “Síria”.
- source_word: מֵאָה אֶלֶף רַגְלִי
  choice: cem mil soldados de infantaria
  rationale: רַגְלִי designa combatentes a pé; “soldados de infantaria” é claro e corrente em português.
- source_word: בְּיוֹם אֶחָד
  choice: num só dia
  rationale: Expressa com naturalidade tanto o intervalo temporal quanto a ênfase de אֶחָד.
theological_decisions:
- issue: Linguagem masculina em בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A expressão-fonte é masculina e, no contexto militar, refere-se à força combatente de Israel. A forma literal preserva essa característica sem ampliar ou restringir além do texto.
- issue: Nome próprio אֲרָם
  choice: Aram
  alternative: os arameus; a Síria
  rationale: O hebraico emprega o nome próprio do reino ou povo. “Aram” mantém a forma histórica do texto; a nota esclarece o possível sentido coletivo.
- issue: Resultado de וַיַּכּוּ
  choice: feriram
  alternative: abateram; mataram; derrotaram
  rationale: O verbo pode envolver golpe, derrota ou morte conforme o contexto. A tradução preserva sua amplitude lexical e não explicita além da forma hebraica, embora o número subsequente indique graves baixas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem narrativa e o contraste conciso do hebraico foram preservados, enquanto a expressão idiomática sobre o começo da batalha foi naturalizada e documentada em nota.
