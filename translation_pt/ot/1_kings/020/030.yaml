base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: pt
  text: Os sobreviventes fugiram para Afeca, para a cidade, e a muralha caiu sobre vinte e sete mil dos homens restantes. Ben-Hadade também fugiu e entrou na cidade, indo para um aposento interior[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um aposento dentro de outro aposento”, expressão que indica um cômodo interior ou muito recôndito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: os sobreviventes / os homens restantes
  rationale: O particípio de נותר designa os que ficaram vivos depois da batalha. “Sobreviventes” é natural na primeira ocorrência; “restantes” preserva o sentido na segunda sem repetição pesada.
- source_word: אֲפֵקָה
  choice: para Afeca
  rationale: O ה direcional indica movimento rumo a Afeca; o topônimo segue a forma portuguesa tradicional.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: a muralha caiu
  rationale: O artigo definido foi preservado. “Muralha” comunica naturalmente a fortificação urbana, sem especificar além do hebraico.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: sobre vinte e sete mil dos homens
  rationale: A expressão numérica foi vertida de modo idiomático; “homens” corresponde a אִישׁ no contexto militar.
- source_word: וּבֶן הֲדַד נָס
  choice: Ben-Hadade também fugiu
  rationale: “Também” expressa naturalmente a coordenação narrativa e “fugiu” mantém a ligação lexical com o verbo inicial.
- source_word: חֶדֶר בְּחָדֶר
  choice: num aposento interior
  rationale: A expressão literal “aposento dentro de aposento” indica um cômodo mais interno e oculto. A tradução corrente comunica essa interioridade, e a forma literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluência brasileira. “Afeca” e “Ben-Hadade” seguem formas portuguesas reconhecíveis. O marcador da nota foi colocado junto à expressão חֶדֶר בְּחָדֶר, à qual a nota efetivamente se refere.
