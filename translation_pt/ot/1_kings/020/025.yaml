base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: pt
  text: “E você, reúna para si um exército igual ao exército que você perdeu, cavalo por cavalo e carro de guerra por carro de guerra. Então, lutemos contra eles na planície. Com certeza seremos mais fortes do que eles.” O rei deu ouvidos ao que disseram e fez assim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: reúna para si um exército
  rationale: O verbo מנה, neste contexto militar, indica levantar ou organizar uma força correspondente à anterior; “reúna” comunica isso naturalmente, sem sugerir mera contagem.
- source_word: הַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: o exército que você perdeu
  rationale: A expressão hebraica descreve literalmente o exército que “caiu de junto de” Ben-Hadade; em português, “que você perdeu” transmite com clareza a derrota e a perda de suas tropas.
- source_word: סוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: cavalo por cavalo e carro de guerra por carro de guerra
  rationale: Preserva a construção distributiva e explicita o sentido militar de רֶכֶב.
- source_word: בַּמִּישׁוֹר
  choice: na planície
  rationale: Designa terreno plano ou região de planície, em contraste com os montes mencionados no contexto.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: Com certeza seremos mais fortes do que eles
  rationale: A fórmula hebraica אִם־לֹא funciona aqui como uma afirmação enfática, não como uma condição aberta.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: O rei deu ouvidos ao que disseram
  rationale: A locução portuguesa reproduz o sentido idiomático de aceitar o conselho; o referente implícito é explicitado como “o rei” para evitar ambiguidade.
