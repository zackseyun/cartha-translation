  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: pt
  text: 'E os servos do rei de Arã lhe disseram[a]: “Os deuses deles são deuses das montanhas; por isso foram mais fortes do que nós. Mas, se lutarmos contra eles na planície, certamente seremos mais fortes do que eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Deus deles é um deus das montanhas…”. O hebraico emprega formas plurais (“deuses”), refletindo a maneira pagã dos arameus de falar sobre o Deus de Israel.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: É a correspondência mais direta e preserva a expressão da corte, sem especificar em excesso que se tratava de oficiais.
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome próprio antigo, em vez do rótulo geopolítico posterior “Síria”.
- source_word: אֱלֹהֵי הָרִים / אֱלֹהֵיהֶם
  choice: deuses das montanhas / os deuses deles
  rationale: As formas plurais reproduzem a perspectiva politeísta dos arameus e sua interpretação equivocada do Deus de Israel.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Expressa de modo natural e digno a relação causal do hebraico.
- source_word: חָזְקוּ מִמֶּנּוּ / נֶחֱזַק מֵהֶם
  choice: foram mais fortes do que nós / seremos mais fortes do que eles
  rationale: Preserva a comparação de força e a repetição lexical entre as duas afirmações.
- source_word: בַּמִּישׁוֹר
  choice: na planície
  rationale: Designa terreno plano e mantém o contraste geográfico com as montanhas.
- source_word: אִם לֹא
  choice: certamente
  rationale: No contexto, a expressão funciona como asseveração enfática da confiança dos falantes.
theological_decisions:
- issue: Descrição arameia da divindade de Israel
  choice: “Os deuses deles são deuses das montanhas”
  alternative: “O Deus deles é um deus das montanhas”
  rationale: A fala relata a concepção politeísta dos arameus, não uma afirmação teológica do narrador. O plural preserva as formas hebraicas e a tensão narrativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Arã” segue a forma tradicional portuguesa do nome antigo; “planície” mantém o contraste com “montanhas”.
