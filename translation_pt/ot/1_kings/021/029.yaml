source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: pt
  text: Você viu que Acabe se humilhou diante de mim? Visto que ele se humilhou diante de mim, não trarei o desastre[a] nos seus dias; nos dias de seu filho, trarei o desastre sobre a sua casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a calamidade”. O hebraico diz literalmente “o mal/desastre”; neste contexto de juízo, refere-se a uma calamidade punitiva, não ao mal moral.
    reason: lexical_alternative
  - marker: b
    text: “Casa” pode significar a família, a casa real ou a dinastia de Acabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Você viu
  rationale: O qal perfeito, em uma pergunta direta de Deus a Elias, aponta para algo observado e agora destacado. “Você viu” é natural em português e preserva a força da pergunta.
- source_word: נִכְנַע
  choice: se humilhou
  rationale: O nifal de כנע expressa humilhação ou submissão diante de Deus. A forma reflexiva evita acrescentar ao texto a ideia mais específica de arrependimento pleno.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: diante de mim
  rationale: A expressão idiomática indica a postura de Acabe na presença de Deus; “diante de mim” é corrente, clara e próxima da imagem hebraica.
- source_word: יַעַן כִּי
  choice: Visto que
  rationale: Introduz a razão pela qual o juízo será adiado. “Visto que” comunica de modo claro a relação causal e evita repetir imediatamente “como/porque”.
- source_word: לֹא אָבִיא
  choice: não trarei
  rationale: O hifil de בוא com רָעָה como objeto significa trazer ou fazer sobrevir. “Não trarei” é conciso e preserva a ação divina explícita.
- source_word: הָרָעָה
  choice: o desastre
  rationale: Neste contexto de juízo, רָעָה designa calamidade punitiva, não mal moral. “Desastre” comunica essa distinção com clareza.
- source_word: בְּיָמָיו
  choice: nos seus dias
  rationale: Mantém o paralelismo temporal do hebraico e se refere ao período de vida de Acabe.
- source_word: בִּימֵי בְנוֹ
  choice: nos dias de seu filho
  rationale: Preserva a estrutura e o contraste com “nos seus dias”, sem identificar além do que o versículo afirma.
- source_word: עַל בֵּיתוֹ
  choice: sobre a sua casa
  rationale: Conserva a imagem concreta de “casa”, que em contexto régio pode abranger a família, a casa real ou a dinastia.
theological_decisions:
- issue: Natureza da resposta de Acabe
  choice: se humilhou
  alternative: se arrependeu; se submeteu
  rationale: O versículo afirma que Acabe se humilhou diante de Deus e que, por isso, o juízo foi adiado. Não emprega vocabulário explícito de arrependimento, portanto a tradução não amplia a afirmação teológica.
- issue: Sentido de רָעָה quando Deus a traz
  choice: o desastre
  alternative: o mal; a calamidade
  rationale: O contexto trata de juízo punitivo. “Desastre” evita sugerir maldade moral em Deus, sem atenuar a calamidade judicial anunciada.
- issue: Alcance de בֵּיתוֹ
  choice: a sua casa
  alternative: a sua família; a sua dinastia
  rationale: “Casa” preserva a amplitude do termo hebraico, que pode designar a família ou a linhagem dinástica de Acabe, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “se humilhou diante de mim” e o paralelismo entre “nos seus dias” e “nos dias de seu filho” foram mantidos por sua função retórica. Os marcadores de nota foram posicionados junto aos termos que explicam.
