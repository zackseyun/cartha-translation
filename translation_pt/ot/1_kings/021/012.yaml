  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: pt
  text: Proclamaram um jejum e sentaram Nabote à frente do povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do povo” ou “no lugar de maior destaque entre o povo”. A expressão hebraica diz literalmente “à cabeça do povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: Proclamaram
  rationale: Com צֹום como objeto, o verbo קרא indica a convocação ou declaração pública de um jejum; “proclamaram” é natural e preserva o caráter oficial da ação.
- source_word: צֹום
  choice: um jejum
  rationale: O substantivo designa um jejum formal e público; a construção nominal é idiomática em português.
- source_word: וְהֹשִׁיבוּ
  choice: e fizeram ... sentar-se
  rationale: 'O hifil de ישב é causativo: fizeram Nabote ocupar determinado lugar. A formulação conserva essa nuance sem sugerir força física.'
- source_word: אֶת נָבוֹת
  choice: Nabote
  rationale: אֶת marca o objeto direto definido; o nome próprio recebe a forma tradicional e amplamente reconhecida em português.
- source_word: בְּרֹאשׁ
  choice: à frente de
  rationale: A expressão significa literalmente “na cabeça/no topo de” e, neste contexto público, indica posição dianteira ou proeminente. “À frente de” preserva a imagem espacial com naturalidade.
- source_word: הָעָם
  choice: o povo
  rationale: עם refere-se ao povo reunido; “povo” é a correspondência direta, enquanto “assembleia” explicitaria mais do que o hebraico.
