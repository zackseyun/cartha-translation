base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: pt
  text: “Eis que trarei desgraça sobre você; exterminarei a sua descendência e eliminarei de Acabe todo homem[a], sem exceção[b], em Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “todo aquele que urina contra a parede”, expressão grosseira que significa todo homem do sexo masculino.'
    reason: lexical_alternative
  - marker: b
    text: O sentido exato deste par hebraico é incerto. Na fórmula, ele parece enfatizar que ninguém será poupado; tradicionalmente, é traduzido como “escravo e livre”.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva a fórmula solene e imediata de anúncio profético, em linguagem reconhecível no português bíblico atual.
- source_word: מבי ... רָעָה
  choice: trarei desgraça
  rationale: Neste contexto de juízo, רָעָה designa calamidade ou desgraça, não necessariamente maldade moral.
- source_word: אֵלֶיךָ
  choice: sobre você
  rationale: Expressa de modo natural o movimento hostil da calamidade anunciada contra Acabe.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: varrerei o que vier depois de você
  rationale: Mantém a imagem de remoção completa e a indeterminação do objeto implícito em אַחֲרֶיךָ, sem inserir diretamente “descendência” no texto.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: eliminarei de Acabe
  rationale: Comunica o sentido destrutivo de כרת e conserva a construção que indica os homens pertencentes à casa ou linhagem de Acabe sem acrescentar “casa” ao texto principal.
- source_word: מַשְׁתִּין בְּקִיר
  choice: todo homem
  rationale: Traduz o sentido do idiomatismo hebraico grosseiro de maneira clara e digna; a expressão literal é registrada em nota.
- source_word: וְעָצוּר וְעָזוּב
  choice: tanto o que está confinado como o que está solto
  rationale: Preserva mais de perto a forma e a ambiguidade do par hebraico, que funciona como expressão abrangente, sem fixar a interpretação tradicional “escravo e livre” como se fosse inequívoca.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: É a tradução locativa direta e natural.
theological_decisions:
- issue: Sentido de רָעָה no anúncio do juízo divino
  choice: desgraça
  alternative: mal / maldade
  rationale: O contexto aponta para calamidade punitiva. “Desgraça” preserva a severidade do juízo sem sugerir que Deus pratica maldade moral.
- issue: Identidade do que será varrido depois de Acabe
  choice: o que vier depois de você
  alternative: sua descendência
  rationale: A descendência é uma inferência contextual provável, mas o objeto não aparece de modo explícito na expressão hebraica; a tradução mantém essa relativa abertura.
- issue: Interpretação de וְעָצוּר וְעָזוּב
  choice: o que está confinado ... o que está solto
  alternative: escravo e livre
  rationale: O par provavelmente exprime totalidade, mas seu referente exato é discutido. A formulação escolhida evita transformar uma interpretação tradicional em certeza lexical.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” conserva a força profética; “você” evita arcaísmo. As notas preservam a crueza do primeiro idiomatismo e a incerteza real do segundo.
