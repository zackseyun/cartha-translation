  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּתְעֵ֣ב מְאֹ֔ד לָ/לֶ֖כֶת אַחֲרֵ֣י הַ/גִּלֻּלִ֑ים כְּ/כֹל֙ אֲשֶׁ֣ר עָשׂ֣וּ הָ/אֱמֹרִ֔י אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: pt
  text: Ele agiu de modo extremamente abominável, seguindo os ídolos[a], conforme tudo o que haviam feito os amorreus, que Yahweh expulsou de diante dos filhos de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é fortemente depreciativo; também pode ser traduzido por “ídolos detestáveis” ou, mais literalmente, “ídolos de esterco”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os israelitas” ou “o povo de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: agiu de modo extremamente abominável
  rationale: Expressa a força verbal reflexiva do hitpael e conserva a intensa avaliação moral marcada por מְאֹד, sem transformar a frase em mera descrição de estado.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: seguindo
  rationale: Forma natural em português para a ideia hebraica de ir atrás de algo em lealdade e prática, ligando a idolatria ao modo como ele agiu.
- source_word: הַגִּלֻּלִים
  choice: os ídolos
  rationale: É a formulação mais clara no texto principal; o tom fortemente depreciativo do termo hebraico é preservado em nota.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: conforme tudo o que haviam feito
  rationale: Conserva a amplitude de כְּכֹל e estabelece a comparação com a conduta anterior dos amorreus; o mais-que-perfeito explicita naturalmente a anterioridade contextual.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: Embora a forma hebraica seja singular coletiva, o plural é a expressão natural em português para esse povo.
- source_word: הוֹרִישׁ
  choice: expulsou
  rationale: No contexto, o hifil de ירשׁ indica que Yahweh removeu os antigos habitantes da terra; 'expulsou' é claro e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִפְּנֵי
  choice: de diante de
  rationale: Mantém de perto a imagem espacial hebraica da remoção dos amorreus da presença ou do avanço de Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão masculina e genealógica do hebraico; a alternativa idiomática referente ao povo inteiro aparece em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. 'Yahweh' o representa diretamente e evita substituí-lo por um título, sem acrescentar interpretação teológica.
- issue: Referência coletiva em בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução principal conserva a forma do original, que designa coletivamente o povo da aliança; a nota oferece uma equivalência portuguesa mais idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a severidade moral do hebraico, o nome divino transliterado e a construção coletiva 'filhos de Israel'. Todos os marcadores de nota aparecem no texto principal.
