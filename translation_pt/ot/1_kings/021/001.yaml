  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כֶּ֧רֶם הָיָ֛ה לְ/נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י אֲשֶׁ֣ר בְּ/יִזְרְעֶ֑אל אֵ֚צֶל הֵיכַ֣ל אַחְאָ֔ב מֶ֖לֶךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: pt
  text: Depois desses acontecimentos, Nabote, o jezreelita, tinha uma vinha[a] em Jezreel, ao lado do palácio de Acabe, rei de Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «havia uma vinha que pertencia a Nabote, o jezreelita». O hebraico expressa a posse literalmente por meio da construção «havia uma vinha para Nabote».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois desses acontecimentos
  rationale: A fórmula hebraica introduz um novo episódio e estabelece uma transição temporal. A tradução preserva o plural e soa natural em português moderno, sem recorrer ao arcaizante «E aconteceu que».
- source_word: כֶּרֶם
  choice: vinha
  rationale: É o sentido comum do termo hebraico e a designação portuguesa natural para um terreno cultivado com videiras.
- source_word: הָיָה לְנָבוֹת
  choice: Nabote ... tinha
  rationale: A construção existencial com לְ expressa posse; «tinha» reproduz essa relação de modo claro e idiomático.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabote, o jezreelita
  rationale: Emprega as formas portuguesas tradicionais do nome e do gentílico, que identifica Nabote por sua ligação com Jezreel.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: em Jezreel
  rationale: A expressão localiza a vinha; a oração relativa pode ser condensada em português sem perda de conteúdo.
- source_word: אֵצֶל
  choice: ao lado de
  rationale: Expressa proximidade imediata com clareza maior que o sentido mais amplo de «perto de».
- source_word: הֵיכַל
  choice: palácio
  rationale: No contexto da residência de um rei, o termo designa adequadamente o palácio, não um templo.
- source_word: אַחְאָב מֶלֶךְ שֹׁמְרוֹן
  choice: Acabe, rei de Samaria
  rationale: Conserva a aposição hebraica em português natural e usa as formas tradicionais dos nomes.
