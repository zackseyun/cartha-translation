  to: 'Façam sentar diante dele dois homens perversos, e que eles testemunhem contra ele, dizendo: “Você amaldiçoou Deus e o rei.” Depois, levem-no para fora e apedrejem-no, para que morra.'
  rationale: A revisão conserva todas as decisões lexicais e a nota da proposta, mas ajusta a relação sintática entre as instruções e traduz o verbo final como resultado/propósito, sem a nuance temporal adicional de «até que».
