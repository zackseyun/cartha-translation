  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: pt
  text: 'Façam sentar diante dele dois homens perversos, e que eles testemunhem contra ele, dizendo: “Você amaldiçoou Deus e o rei.” Depois, levem-no para fora e apedrejem-no, para que morra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: Façam ... sentar-se
  rationale: Preserva o sentido causativo do hifil de ישׁב e soa natural em português.
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: dois homens perversos
  rationale: Mantém o número e o gênero explícitos e traduz o idiomatismo como descrição de homens moralmente corruptos, sem transformar Belial em nome próprio.
- source_word: נֶגְדּוֹ
  choice: diante dele
  rationale: Expressa a posição formal dos falsos testemunhos perante Nabote; em português, é mais natural do que uma tradução espacial rígida como “opostos a ele”.
- source_word: וִיעִדֻהוּ
  choice: testemunhar contra ele
  rationale: Comunica com clareza o sentido forense do hifil de עוד neste contexto judicial.
- source_word: בֵּרַכְתָּ
  choice: amaldiçoou
  rationale: Embora ברך normalmente signifique “abençoar”, aqui funciona como eufemismo reverencial para “amaldiçoar”; a forma literal é registrada em nota.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: Deus e o rei
  rationale: O contexto apresenta uma acusação conjunta contra Deus e a autoridade real; אֱלֹהִים tem referente singular aqui.
- source_word: וְהוֹצִיאֻהוּ
  choice: levem-no para fora
  rationale: Reproduz diretamente a ordem de retirar Nabote, provavelmente da cidade, para a execução.
- source_word: וְסִקְלֻהוּ
  choice: apedrejem-no
  rationale: É o termo jurídico e narrativo corrente em português para a execução por pedras.
- source_word: וְיָמֹת
  choice: até que morra
  rationale: Expressa naturalmente o resultado pretendido do apedrejamento, sem suavizar a ordem de execução.
theological_decisions:
- issue: Uso eufemístico de ברך quando Deus é o objeto
  choice: Traduzir “amaldiçoou” no texto principal
  alternative: Traduzir literalmente “abençoou” e explicar apenas em nota
  rationale: A acusação forjada é de uma ofensa capital contra Deus e o rei. “Abençoou” comunicaria o oposto ao leitor moderno; a nota preserva a forma hebraica e sua tensão eufemística.
- issue: Sentido de בְּנֵי בְלִיַּעַל
  choice: homens perversos
  alternative: filhos de Belial
  rationale: Aqui a expressão hebraica caracteriza pessoas corruptas e sem escrúpulos; não exige referência a um ser demoníaco chamado Belial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe imperativa reproduz as instruções da carta, e a terminologia jurídica permanece clara sem arcaísmos.
