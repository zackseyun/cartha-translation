  naturalness: O registro é claro, moderno e adequado. «Sentaram-se em frente dele» é natural e preserva melhor a disposição espacial. «Apedrejaram-no com pedras» é levemente enfático, mas aceitável num texto narrativo formal e reflete a expressão hebraica.
  terminology: «Homens perversos», «testemunharam contra», «perante o povo», «Deus e o rei» e «amaldiçoou» são escolhas adequadas. A nota sobre o eufemismo reverencial é necessária e deve estar ancorada na palavra a que se refere, não no fim do versículo.
