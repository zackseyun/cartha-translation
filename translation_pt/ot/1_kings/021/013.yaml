base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: pt
  text: 'Então os dois homens perversos entraram e se sentaram em frente dele. Os homens perversos testemunharam contra Nabote perante o povo, dizendo: “Nabote amaldiçoou[a] Deus e o rei”. Então o levaram para fora da cidade, apedrejaram-no com pedras, e ele morreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “abençoou”, empregado aqui como eufemismo reverencial para “amaldiçoou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: homens perversos
  rationale: As expressões idiomáticas descrevem homens moralmente corruptos ou sem escrúpulos, não descendência biológica nem necessariamente o nome próprio posterior “Belial”. “Homens perversos” é claro e natural em português.
- source_word: נֶגְדּוֹ
  choice: diante dele
  rationale: A preposição indica que os homens se posicionaram de frente para Nabote; “diante dele” preserva o sentido espacial e se ajusta ao cenário judicial.
- source_word: וַיְעִדֻהוּ
  choice: testemunharam contra
  rationale: O hifil de עוּד tem aqui sentido jurídico, indicando depoimento formal contra Nabote.
- source_word: נֶגֶד הָעָם
  choice: perante o povo
  rationale: A expressão assinala o caráter público da acusação.
- source_word: בֵּרַךְ
  choice: amaldiçoou
  rationale: Embora a forma lexical signifique “abençoou”, neste contexto ela funciona como eufemismo reverencial para “amaldiçoou”; traduzir o sentido torna inteligível a acusação.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: Deus e o rei
  rationale: No contexto israelita, אֱלֹהִים se refere ao Deus de Israel, e a conjunção liga os dois alvos da acusação.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: o levaram para fora da cidade
  rationale: A formulação comunica de modo natural a remoção de Nabote da cidade para a execução.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: apedrejaram-no
  rationale: Em português, “apedrejar” já incorpora o uso de pedras; acrescentar “com pedras” seria redundante sem acrescentar conteúdo.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: A coordenação direta preserva a progressão narrativa e o resultado final.
theological_decisions:
- issue: O eufemismo reverencial בֵּרַךְ na acusação de blasfêmia
  choice: 'Traduzir no texto principal segundo o sentido: “amaldiçoou”'
  alternative: Traduzir formalmente como “abençoou” e explicar que se trata de eufemismo
  rationale: A acusação é de maldição contra Deus e o rei. O sentido contextual deve ficar claro no texto, enquanto a forma literal eufemística é registrada em nota para transparência.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém a repetição de “homens perversos” do hebraico e usa vocabulário jurídico comum. A única nota esclarece o eufemismo textual; seu marcador aparece após a frase para não interromper a acusação.
