base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: pt
  text: 'Acabe disse a Elias: “Você me encontrou, meu inimigo?” Elias respondeu: “Encontrei você, porque você se vendeu para fazer o que é mau aos olhos de Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido por “o SENHOR”; outras formas incluem “Yahweh” e “Jeová”.'
    reason: Registra as principais convenções de representação do Tetragrama.
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: Você me encontrou
  rationale: Mantém o sentido direto de מצא e o tom confrontador da pergunta, em português natural.
- source_word: אֹיְבִי
  choice: meu inimigo
  rationale: Traduz diretamente o substantivo com sufixo de primeira pessoa e funciona naturalmente como vocativo.
- source_word: מָצָאתִי
  choice: Encontrei você
  rationale: Repete o verbo מצא da pergunta de Acabe, preservando o eco verbal do diálogo.
- source_word: יַעַן
  choice: porque
  rationale: Expressa com clareza a relação causal introduzida por יַעַן.
- source_word: הִתְמַכֶּרְךָ
  choice: você se vendeu
  rationale: Preserva a forma reflexiva e a metáfora forte de alguém que se entrega voluntariamente ao mal.
- source_word: לַעֲשׂוֹת הָרַע
  choice: para fazer o que é mau
  rationale: Verte de modo idiomático o infinitivo seguido do termo substantivado para o mal, sem enfraquecer sua força moral.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Conserva a imagem hebraica da avaliação divina, plenamente compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem impor a substituição tradicional por um título.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O pronome “você” mantém clareza no diálogo; a repetição de “encontrou/Encontrei” e a metáfora “se vendeu” preservam características marcantes do hebraico.
