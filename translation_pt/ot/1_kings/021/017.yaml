  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Elias, o tisbita, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O wayyiqtol de היה dá continuidade à sequência narrativa. Em português atual, “Então ... veio” expressa naturalmente essa progressão sem recorrer ao mais solene “E aconteceu que”.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: A tradução mantém a fórmula profética tradicional e a força revelatória de דָּבָר, evitando o termo mais interpretativo “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Com o verbo “vir” e uma pessoa como destinatária, “veio a Elias” é uma construção portuguesa direta e digna.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome bíblico.
- source_word: הַתִּשְׁבִּי
  choice: o tisbita
  rationale: Preserva de modo compacto o gentílico hebraico, conforme o uso bíblico consolidado em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz de maneira formalmente transparente o infinitivo que introduz o conteúdo da fala divina no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto e segue a transliteração indicada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural. A formulação conserva a linguagem profética tradicional (“a palavra de Yahweh”) e o introdutor de discurso “dizendo”. Não se acrescentou nota, pois a alternativa “E aconteceu que” reflete sobretudo uma diferença estilística na representação de וַיְהִי, sem alterar o sentido.
