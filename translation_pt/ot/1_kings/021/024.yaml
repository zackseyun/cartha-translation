base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: pt
  text: Quem for da casa de Acabe e morrer na cidade, os cães o comerão; e quem morrer no campo, as aves do céu o comerão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “o morto de Acabe”. A expressão se refere a qualquer pessoa pertencente à casa de Acabe que morrer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: Quem da casa de Acabe morrer
  rationale: O particípio com artigo tem sentido genérico, e לְאַחְאָב indica relação ou pertencimento. “Da casa de Acabe” expressa naturalmente em português a referência aos membros de sua casa ou dinastia.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Uso locativo direto, preservando o contraste com o campo.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: os cães o comerão
  rationale: Mantém o sentido comum de אכל, “comer”, e conserva a imagem de desonra após a morte.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: e quem morrer no campo
  rationale: Repete de modo natural o valor genérico do particípio e preserva o paralelismo entre cidade e campo.
- source_word: עוֹף הַשָּׁמָיִם
  choice: as aves do céu
  rationale: Tradução natural e tradicional da expressão hebraica, mantendo a imagem genitiva; “aves do céu” aqui significa aves que voam no céu.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. “Casa de Acabe” explicita de forma concisa a relação familiar ou dinástica indicada pelo hebraico, sem restringi-la indevidamente.
