  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: pt
  text: Então ela escreveu cartas em nome de Acabe, selou-as com o selo dele e enviou as cartas aos anciãos e aos nobres que estavam na cidade de Nabote[a] e moravam com Nabote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na cidade de Acabe”. O sufixo hebraico traduzido por “de Nabote” pode referir-se tanto a Nabote quanto a Acabe.'
    reason: Leitura alternativa causada pela ambiguidade do referente do sufixo pronominal hebraico.
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Então ela escreveu
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então” expressa naturalmente a sequência, e o sujeito feminino singular retoma Jezabel no contexto.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: cartas / as cartas
  rationale: סֵפֶר pode designar um documento escrito; neste contexto de comunicação oficial enviada a autoridades locais, “cartas” é a opção mais natural e precisa.
- source_word: בְּשֵׁם אַחְאָב
  choice: em nome de Acabe
  rationale: A expressão indica que Jezabel escreveu sob a autoridade ou identidade oficial de Acabe; a formulação portuguesa preserva esse sentido sem explicá-lo em excesso.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: selou-as com o selo dele
  rationale: O verbo חתם com חותם descreve o ato de autenticar documentos por meio de um selo oficial. “Dele” mantém explícita a referência a Acabe no fluxo da frase.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: זקנים designa aqui os líderes cívicos da comunidade; “anciãos” é a forma bíblica corrente e inteligível em português.
- source_word: הַחֹרִים
  choice: os nobres
  rationale: חֹרִים designa pessoas de posição social elevada ou proeminentes; “nobres” é conciso e adequado ao contexto.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: que estavam na cidade de Nabote
  rationale: A tradução explicita Nabote como referente adotado para o sufixo masculino singular, de acordo com o cenário local indicado pela oração seguinte, sem ocultar em nota a possibilidade de referência a Acabe.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: e moravam com ele
  rationale: ישב com אֶת comunica residência junto de alguém. “Moravam com ele” evita a repetição pesada de “Nabote” e, no contexto, indica que essas autoridades residiam na mesma cidade que ele, não necessariamente na mesma casa.
theological_decisions:
- issue: Referente do sufixo pronominal em בְּעִירוֹ
  choice: “sua cidade” entendida como a cidade de Nabote
  alternative: “sua cidade” entendida como a cidade de Acabe
  rationale: A descrição subsequente dos líderes como moradores junto de Nabote favorece a referência à cidade de Nabote e se ajusta ao cenário narrativo. Como o sufixo hebraico também pode remeter a Acabe, essa alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “selou-as” preserva concisão e tom literário sem soar arcaica. A frase mantém a sequência do hebraico e assinala a ambiguidade genuína por meio de nota.
