id: 1KI.21.23
reference: 1 Kings 21:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: pt
  text: 'E também a respeito de Jezabel, Yahweh falou: “Os cães comerão Jezabel no território de Jezreel[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto à fortificação de Jezreel”. O termo hebraico é difícil e talvez se refira mais especificamente à área externa fortificada da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: E também
  rationale: Mantém tanto a coordenação com o juízo anterior quanto a força aditiva de גַם.
- source_word: לְאִיזֶבֶל
  choice: a respeito de Jezabel
  rationale: Com דִּבֶּר, a preposição לְ pode indicar a pessoa sobre a qual se fala; no contexto, trata-se de um oráculo acerca de Jezabel, não necessariamente dirigido a ela.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: Yahweh falou
  rationale: Traduz diretamente o verbo דִּבֶּר e apresenta a fala citada de modo natural em português; os dois-pontos exprimem idiomaticamente a função introdutória de לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הַכְּלָבִים
  choice: Os cães
  rationale: Preserva naturalmente o artigo definido presente no hebraico.
- source_word: יֹאכְלוּ אֶת אִיזֶבֶל
  choice: comerão Jezabel
  rationale: Reproduz o sentido simples e concreto do verbo אָכַל, sem intensificá-lo para “devorar”.
- source_word: בְּחֵל יִזְרְעֶאל
  choice: no território de Jezreel
  rationale: חֵל é difícil neste contexto. “Território” preserva o sentido locativo geral sem impor uma identificação arquitetônica incerta; a alternativa mais específica é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome próprio divino. A transliteração “Yahweh” preserva essa função sem substituir o nome por um título.
- issue: Sentido de לְאִיזֶבֶל com דִּבֶּר
  choice: a respeito de Jezabel
  alternative: a Jezabel; contra Jezabel
  rationale: O contexto apresenta Elias relatando um pronunciamento divino sobre o destino de Jezabel; esta formulação evita sugerir, sem necessidade, que ela tenha sido a destinatária direta.
- issue: Sentido de בְּחֵל יִזְרְעֶאל
  choice: no território de Jezreel
  alternative: junto à fortificação de Jezreel
  rationale: Como o substantivo חֵל é incerto aqui, o texto principal mantém uma localização ampla e inteligível, enquanto a nota conserva a leitura arquitetônica possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase conserva a ligação com o juízo precedente, e os dois-pontos tornam natural a introdução da citação sem perder conteúdo semântico.
