base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: pt
  text: 'Ele lhe disse: “É que falei com Nabote, o jezreelita, e lhe disse: ‘Dê-me a sua vinha por dinheiro ou, se você preferir, eu lhe darei outra vinha em troca.’ Mas ele respondeu: ‘Não lhe darei a minha vinha.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: É porque
  rationale: Mantém o valor causal da resposta de Acabe e produz uma construção natural em português após ‘Ele lhe disse’.
- source_word: בְּכֶסֶף
  choice: por dinheiro
  rationale: Embora כֶּסֶף designe literalmente ‘prata’, neste contexto funciona como meio de pagamento; ‘por dinheiro’ comunica naturalmente o sentido econômico.
- source_word: אִם חָפֵץ אַתָּה
  choice: se você preferir
  rationale: Expressa de modo corrente a disposição ou preferência de Nabote indicada pelo hebraico, sem acrescentar motivação.
- source_word: כֶרֶם תַּחְתָּיו
  choice: outra vinha em troca
  rationale: Comunica que Acabe oferece uma vinha no lugar daquela, conforme o sentido substitutivo de תַּחְתָּיו.
- source_word: וַיֹּאמֶר
  choice: respondeu
  rationale: No diálogo relatado, ‘respondeu’ torna explícita a função discursiva do verbo comum ‘disse’, sem alterar o conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A forma ‘É porque’ preserva a ligação causal incomum do texto hebraico, enquanto as falas encaixadas mantêm claramente os diferentes níveis do discurso.
