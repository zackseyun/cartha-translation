base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/014.yaml
  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: pt
  text: 'Então mandaram dizer a Jezabel: “Nabote foi apedrejado e morreu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Então mandaram dizer
  rationale: O consecutivo narrativo faz a ação avançar; em português, “Então” expressa naturalmente essa progressão. “Mandaram dizer” comunica de modo idiomático o envio da mensagem introduzida por לֵאמֹר.
- source_word: אֶל אִיזֶבֶל
  choice: a Jezabel
  rationale: A preposição indica o destinatário, e o nome próprio segue a forma tradicional em português.
- source_word: לֵאמֹר
  choice: dizer
  rationale: A fórmula hebraica introduz o conteúdo da mensagem e integra-se naturalmente à locução portuguesa “mandaram dizer”.
- source_word: סֻקַּל
  choice: foi apedrejado
  rationale: O pual é passivo. A tradução preserva essa voz sem acrescentar “até a morte”, ideia que só se torna explícita na oração seguinte.
- source_word: נָבוֹת
  choice: Nabote
  rationale: Emprega-se a forma tradicional portuguesa do nome próprio.
- source_word: וַיָּמֹת
  choice: e morreu
  rationale: 'O wayyiqtol descreve formalmente o acontecimento subsequente: “e morreu”. A formulação é natural em português e preserva mais diretamente a sequência verbal hebraica.'
