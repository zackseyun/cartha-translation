id: 1KI.21.25
reference: 1 Kings 21:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: pt
  text: De fato, não houve ninguém como Acabe, que se vendeu para fazer o que era mau aos olhos de Yahweh, a quem Jezabel, sua mulher, incitou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: De fato
  rationale: Neste contexto, a partícula introduz uma afirmação enfática. “De fato” comunica essa força em português natural sem impor um sentido meramente restritivo.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: não houve ninguém como Acabe
  rationale: A expressão hebraica declara que Acabe foi incomparável nesse aspecto; a inclusão de “ninguém” torna o sentido idiomático e claro em português.
- source_word: הִתְמַכֵּר
  choice: se vendeu
  rationale: Preserva a metáfora forte do hitpael de מכר, segundo a qual Acabe se entregou ao mal como alguém que vende a si mesmo.
- source_word: לַעֲשׂוֹת הָרַע
  choice: para fazer o que era mau
  rationale: Expressa de modo corrente a prática daquilo que recebe avaliação moral negativa, sem transformar o artigo hebraico numa formulação artificial.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora avaliativa hebraica numa expressão natural e conhecida em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הֵסַתָּה
  choice: incitou
  rationale: O hifil de סות indica provocar ou instigar alguém a determinada conduta, com sentido negativo neste contexto.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: a quem Jezabel, sua mulher, incitou
  rationale: Preserva a forma relativa do hebraico e deixa Acabe como referente do objeto, sem converter explicitamente a oração em causal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa diretamente, enquanto “SENHOR” o substituiria por um título.
- issue: Relação de Jezabel com a responsabilidade de Acabe
  choice: 'oração relativa: “a quem Jezabel, sua mulher, incitou”'
  alternative: 'oração causal: “porque Jezabel, sua mulher, o incitou”'
  rationale: A construção com אֲשֶׁר e o objeto אֹתוֹ apresenta Acabe como aquele a quem Jezabel incitou. A tradução relativa preserva essa estrutura e evita explicitar uma causalidade que o conector, por si só, não exige; ao mesmo tempo, “se vendeu” mantém a responsabilidade do próprio Acabe.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação “Jezabel, sua mulher” conserva a identificação hebraica sem soar arcaica; a oração relativa mantém a tensão e a estrutura do original.
