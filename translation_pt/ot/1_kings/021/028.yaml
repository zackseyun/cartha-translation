  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a Elias, o tisbita, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “SENHOR”.'
    reason: Explica a forma hebraica do nome divino e informa a tradução tradicional. O marcador foi colocado após “Yahweh”, termo ao qual a nota corresponde.
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: Na fórmula profética ויהי דבר־יהוה אל, o português natural expressa o início do acontecimento com “Então” e o recebimento da revelação com “veio”, sem reproduzir de modo rígido “e aconteceu”.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: דָּבָר pode significar “palavra” ou “mensagem”; “a palavra de Yahweh” preserva o sentido lexical e a fórmula profética recorrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário a quem a revelação foi dirigida; “veio a Elias” é uma construção clara e corrente em português.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַתִּשְׁבִּי
  choice: o tisbita
  rationale: Mantém o gentílico aposto usado para identificar Elias, com a forma bíblica consagrada em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém explicitamente o infinitivo hebraico que introduz a fala divina no versículo seguinte e preserva a ligação entre os versículos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma vocalização tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A estrutura conserva a fórmula profética e a transição para a fala do versículo seguinte.
