  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: pt
  text: 'Então Jezabel, sua mulher, lhe disse[a]: “Você agora governa Israel como rei? Levante-se, coma e que seu coração fique alegre[b]; eu lhe darei a vinha de Nabote, o jezreelita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você agora é quem governa Israel como rei!” O hebraico permite entender as palavras de Jezabel como afirmação ou provocação, em vez de pergunta.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida por “coma” diz literalmente “coma pão” e pode referir-se a tomar uma refeição.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Então ... lhe disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluência natural em português.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: Jezabel, sua mulher
  rationale: Mantém a identificação relacional em aposição, de modo claro e digno.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: É assim que você exerce a realeza sobre Israel?
  rationale: Expressa a provável pergunta retórica e o tom de censura, enquanto “exerce a realeza” representa de perto a expressão hebraica literalmente ligada a “fazer/exercer realeza”.
- source_word: קוּם
  choice: Levante-se
  rationale: Imperativo corrente e natural em português, adequado ao registro narrativo.
- source_word: אֱכָל לֶחֶם
  choice: coma
  rationale: A expressão hebraica literalmente diz “coma pão”, mas funciona idiomaticamente como convite a tomar uma refeição; em português, “coma” comunica naturalmente o sentido.
- source_word: וְיִטַב לִבֶּךָ
  choice: anime o coração
  rationale: Preserva “coração” como sede da disposição interior e comunica a ideia de recuperar o ânimo.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: Eu lhe darei
  rationale: Conserva o pronome explícito e, assim, a ênfase de Jezabel em que ela própria resolverá a questão.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: a vinha de Nabote, o jezreelita
  rationale: Reproduz naturalmente a relação possessiva e mantém o gentílico do texto hebraico.
theological_decisions:
- issue: Força da frase inicial de Jezabel
  choice: 'Pergunta retórica: “É assim que você exerce a realeza sobre Israel?”'
  alternative: 'Afirmação ou provocação: “Agora é você quem exerce a realeza sobre Israel!”'
  rationale: O hebraico não traz partícula interrogativa explícita. O contexto favorece uma pergunta retórica que censura a passividade de Acabe, mas a possibilidade assertiva ou irônica é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por “você” torna clara a provocação dirigida a Acabe; a formulação permanece digna e evita arcaísmos. A ambiguidade sintática da fala inicial é indicada em nota.
