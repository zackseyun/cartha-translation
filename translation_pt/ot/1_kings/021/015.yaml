  source_fidelity: 'A tradução transmite corretamente os elementos centrais do hebraico: Jezabel recebe a notícia, Nabote foi apedrejado e morreu, Acabe é mandado a tomar posse da vinha, e a declaração final conserva a ênfase de que Nabote não está vivo, mas morto. Contudo, “estava morto” enfraquece a sequência verbal de וַיָּמֹת (“e morreu”), e “já não” acrescenta uma nuance temporal não expressa no texto.'
  naturalness: O português é claro, moderno e adequado ao registro narrativo. “Levante-se”, “tome posse” e “vinha” são escolhas naturais. “Tinha sido apedrejado e tinha morrido” é mais fluente e reproduz melhor a notícia de dois acontecimentos concluídos.
  terminology: “Jezabel”, “Nabote”, “Acabe”, “jezreelita”, “vinha” e “prata” são adequados. A nota preserva corretamente a alternativa interpretativa “vendê-la ... por dinheiro”, distinguindo-a da formulação literal hebraica.
