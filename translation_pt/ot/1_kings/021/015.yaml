  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: pt
  text: 'Quando Jezabel soube que Nabote tinha sido apedrejado e tinha morrido, disse a Acabe: “Levante-se e tome posse da vinha de Nabote, o jezreelita, que se recusou a entregá-la a você por prata[a], pois Nabote não está vivo; está morto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se recusou a vendê-la a você por dinheiro”. Literalmente, o hebraico diz: “que se recusou a entregá-la a você por prata”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... soube
  rationale: A fórmula narrativa hebraica introduz o acontecimento seguinte. Em português atual, a oração temporal transmite naturalmente essa função sem reproduzir de modo rígido ‘e aconteceu que’.
- source_word: סֻקַּל
  choice: tinha sido apedrejado
  rationale: O passivo de סקל designa concretamente o apedrejamento. O mais-que-perfeito composto situa o fato antes da fala de Jezabel.
- source_word: וַיָּמֹת
  choice: estava morto
  rationale: Neste contexto, a sequência informa a Jezabel o resultado fatal do apedrejamento. ‘Estava morto’ evita a possível leitura de que apenas sofreu apedrejamento sem morrer e prepara a repetição enfática no fim do versículo.
- source_word: קוּם
  choice: Levante-se
  rationale: Equivalente contemporâneo e direto do imperativo, preservando a urgência da ordem.
- source_word: רֵשׁ
  choice: tome posse
  rationale: ירש pode indicar possuir, herdar ou tomar posse. Aqui, Jezabel manda Acabe assumir a propriedade após a morte de Nabote, sem explicitar no verbo uma base jurídica como herança.
- source_word: כֶּרֶם
  choice: vinha
  rationale: Termo português comum e exato para a propriedade cultivada com videiras.
- source_word: הַיִּזְרְעֵאלִי
  choice: o jezreelita
  rationale: Reproduz o gentílico hebraico que identifica Nabote por sua ligação com Jezreel.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: se recusou a entregá-la a você por prata
  rationale: Preserva a formulação concreta do hebraico, ‘dar/entregar ... por prata’, sem resolver implicitamente a transação como venda.
- source_word: אֵין נָבוֹת חַי כִּי מֵת
  choice: Nabote já não está vivo; está morto
  rationale: Mantém a estrutura enfática em duas partes e a repetição deliberadamente brusca da declaração de Jezabel.
theological_decisions:
- issue: Natureza da tomada da vinha
  choice: tome posse
  alternative: herde; apodere-se
  rationale: O verbo ירש admite essas nuances, mas o texto não esclarece aqui o mecanismo jurídico nem exige que o ato seja caracterizado lexicalmente como herança ou apreensão violenta. A tradução conserva essa abertura contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Vinha’, ‘apedrejado’ e ‘tomar posse’ mantêm precisão bíblica sem arcaísmo. A repetição ‘já não está vivo; está morto’ foi preservada por seu efeito enfático.
