revisions:
- from: 'Quando Jezabel soube que Nabote tinha sido apedrejado e estava morto, disse a Acabe: “Levante-se e tome posse da vinha de Nabote, o jezreelita, que se recusou a entregá-la a você por prata[a], pois Nabote já não está vivo; está morto.”'
  to: 'Quando Jezabel soube que Nabote tinha sido apedrejado e tinha morrido, disse a Acabe: “Levante-se e tome posse da vinha de Nabote, o jezreelita, que se recusou a entregá-la a você por prata[a], pois Nabote não está vivo; está morto.”'
  rationale: 'A revisão substitui a descrição estática “estava morto” por “tinha morrido”, que representa mais precisamente o evento expresso pelo hebraico e se ajusta à anterioridade da notícia recebida por Jezabel. Também remove “já”, preservando sem acréscimo a dupla afirmação enfática do original: Nabote não está vivo; está morto. A nota e os demais termos permanecem adequados.'
