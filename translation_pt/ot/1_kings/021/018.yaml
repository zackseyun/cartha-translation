  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: pt
  text: 'Levante-se e desça ao encontro de Acabe, rei de Israel, que está em Samaria. Veja: ele está na vinha de Nabote, aonde desceu para tomar posse dela[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para possuí-la” ou “para herdá-la”. O verbo hebraico pode indicar tomar posse, possuir ou herdar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: Levante-se
  rationale: O imperativo de קום exprime a ordem de se levantar; esta forma é natural em português atual e mantém o tom incisivo da ordem profética.
- source_word: רֵד
  choice: desça
  rationale: O imperativo de ירד conserva o sentido direcional de descer, relevante para o movimento até a vinha.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: A expressão indica ir encontrar alguém. Evita traduzir por “confrontar”, que anteciparia o caráter do encontro além do que esta locução afirma.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta e natural do título real em estado construto.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: que está em Samaria
  rationale: A oração hebraica não tem verbo expresso; “está” é naturalmente suprido em português para indicar a localização de Acabe.
- source_word: הִנֵּה
  choice: Veja
  rationale: A partícula chama a atenção para a localização atual de Acabe. “Veja” preserva a vivacidade sem recorrer ao arcaizante “eis”.
- source_word: בְּכֶרֶם נָבוֹת
  choice: na vinha de Nabote
  rationale: A preposição marca localização, e a construção nominal é vertida de modo direto.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: aonde desceu
  rationale: A oração relativa retoma a vinha como destino do movimento. “Aonde” expressa esse movimento e torna desnecessário reproduzir separadamente o advérbio שָׁם.
- source_word: לְרִשְׁתּוֹ
  choice: para tomar posse dela
  rationale: ירשׁ pode indicar herdar, possuir ou tomar posse. Neste contexto, Acabe foi à vinha para assumi-la como propriedade; a formulação preserva o sentido possessório sem acrescentar violência não expressa pelo verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. As formas “Levante-se”, “desça” e “Veja” mantêm o caráter direto da fala divina; “Nabote” segue a forma portuguesa tradicional do nome.
