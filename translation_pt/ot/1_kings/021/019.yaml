    issue: «Depois lhe dirá»
    rationale: «Depois» explicita uma sucessão temporal que o hebraico não marca; a segunda ocorrência de וְדִבַּרְתָּ apenas retoma a fórmula introdutória.
  - severity: low
    issue: Escopo potencialmente ambíguo de «também o seu próprio sangue»
    rationale: Embora o destinatário seja recuperável pelo contexto, «seu próprio sangue» após «os cães» pode causar uma momentânea ambiguidade de referente. «Também o seu sangue» conserva a ênfase de גַּם אָתָּה com maior clareza.
