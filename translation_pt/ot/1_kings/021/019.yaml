  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: pt
  text: 'Você lhe dirá: “Assim diz Yahweh: ‘Você assassinou e também tomou posse?’” E lhe dirá: “Assim diz Yahweh: ‘No lugar onde os cães lamberam o sangue de Nabote, os cães lamberão também o seu sangue[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o seu sangue, você também”. A expressão final é enfática e destaca que a mesma desonra sofrida por Nabote recairia sobre o próprio Acabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: Você lhe dirá / Depois lhe dirá
  rationale: Traduz naturalmente a fórmula de incumbência e conserva sua repetição, importante para a estrutura solene da fala profética.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional e representa o nome divino como nome próprio, não como título.
- source_word: הֲרָצַחְתָּ
  choice: Você assassinou
  rationale: רצח normalmente indica homicídio ilícito; “assassinou” preserva a força moral e jurídica da acusação no contexto.
- source_word: וְגַם יָרָשְׁתָּ
  choice: e também tomou posse
  rationale: ירש pode significar herdar ou tomar posse. Aqui descreve a apropriação da vinha após a morte de Nabote, sem explicitar no verbo o objeto já conhecido pelo contexto.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: No lugar onde
  rationale: Correspondência locativa direta e idiomática em português.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: lamberam ... lamberão
  rationale: Repete o mesmo verbo no passado e no futuro, preservando o paralelismo e a imagem concreta do hebraico.
- source_word: הַכְּלָבִים
  choice: os cães
  rationale: Tradução direta da imagem central ao anúncio de juízo.
- source_word: דַּם נָבוֹת
  choice: o sangue de Nabote
  rationale: Reproduz diretamente a relação construta hebraica e usa a forma portuguesa corrente do nome.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: também o seu próprio sangue
  rationale: A colocação de “também” e “próprio” mantém a aplicação pessoal enfática a Acabe de modo claro e natural em português.
theological_decisions:
- issue: Força moral de הֲרָצַחְתָּ
  choice: “Você assassinou”
  alternative: “Você matou”
  rationale: O verbo רצח comporta aqui a ideia mais forte de homicídio ilícito. A tradução preserva a acusação profética sem acrescentar uma interpretação alheia ao contexto.
- issue: Ênfase final de גַּם אָתָּה
  choice: “também o seu próprio sangue”
  alternative: “o seu sangue — você também”
  rationale: A formulação escolhida conserva a enfática aplicação pessoal do juízo a Acabe, mas evita em português uma construção abrupta e potencialmente ambígua.
- issue: Relação de Acabe com a morte de Nabote
  choice: Preservar a acusação direta de assassinato
  alternative: Atenuar para participação indireta ou mera cumplicidade
  rationale: A pergunta profética atribui responsabilidade a Acabe sem explicar nesta frase os diferentes graus de participação; a tradução não deve suavizar essa tensão narrativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição da fórmula profética foi preservada, enquanto construções hebraicas excessivamente rígidas foram naturalizadas sem perda de conteúdo ou ênfase.
