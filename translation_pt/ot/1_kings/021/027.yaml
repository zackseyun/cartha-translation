base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: pt
  text: Quando Acabe ouviu essas palavras, rasgou as roupas, pôs pano de saco sobre a pele, jejuou, deitou-se vestido de pano de saco e andava devagar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “andava em silêncio”, “caminhava suavemente” ou “andava abatido”. O hebraico sugere uma maneira de andar lenta e contida, no contexto de sua humilhação.
    reason: Alternativas lexicais para אַט e esclarecimento de sua nuance contextual.
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A construção temporal portuguesa comunica com naturalidade a fórmula narrativa hebraica e o infinitivo temporal, sem acrescentar peso estilístico desnecessário.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: דְּבָרִים pode significar palavras, assuntos ou coisas; aqui se refere ao juízo que Elias acabara de pronunciar.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: rasgou as roupas
  rationale: Expressa de modo atual e claro o gesto convencional de luto e humilhação.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: vestiu pano de saco sobre o corpo
  rationale: Preserva o pano de saco como veste de luto e a imagem concreta de sua colocação sobre a carne ou o corpo.
- source_word: וַיָּצֹם
  choice: jejuou
  rationale: Equivalente direto e natural do verbo צום.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: deitou-se vestido de pano de saco
  rationale: Comunica que Acabe se deitou usando o pano de saco, sem especificar que dormiu.
- source_word: וַיְהַלֵּךְ אַט
  choice: passou a andar devagar
  rationale: A forma verbal sugere conduta continuada, e אַט indica movimento lento, suave ou contido. A tradução mantém esse sentido básico e deixa as nuances contextuais para a nota.
theological_decisions:
- issue: Natureza da reação de Acabe
  choice: Descrever apenas seus atos visíveis de luto e humilhação
  alternative: Declarar que Acabe se arrependeu sinceramente ou que apenas encenou arrependimento
  rationale: O versículo relata ações exteriores, mas não resolve por si só a sinceridade interior de Acabe. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Pano de saco” conserva o termo bíblico tradicional e inteligível; a sequência de atos mantém o ritmo cumulativo do hebraico.
