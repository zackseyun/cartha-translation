base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: pt
  text: 'Ela escreveu nas cartas[a]: “Proclamem um jejum e façam Nabote sentar-se à frente do povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos documentos”. Aqui, a palavra hebraica se refere a mensagens escritas enviadas às autoridades da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Ela escreveu
  rationale: O wayyiqtol na terceira pessoa feminina singular dá sequência à narrativa e retoma Jezabel pelo contexto; o pronome explicita naturalmente o gênero em português.
- source_word: בַּסְּפָרִים
  choice: nas cartas
  rationale: Neste contexto, סְפָרִים designa as mensagens escritas enviadas às autoridades da cidade, não livros; “nas cartas” é idiomático em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo introduz o conteúdo escrito; em português atual, os dois-pontos expressam essa função de modo mais natural do que “dizendo”.
- source_word: קִרְאוּ צוֹם
  choice: Proclamem um jejum
  rationale: O imperativo plural קִרְאוּ tem força pública e oficial, e “proclamar um jejum” é expressão clara e corrente para convocar essa observância comunitária.
- source_word: וְהוֹשִׁיבוּ אֶת נָבוֹת
  choice: e façam Nabote sentar-se
  rationale: A construção causativa (hifil) de ישב é preservada explicitamente por “façam ... sentar-se”, sem sugerir que Nabote ocupava legitimamente uma função de liderança.
- source_word: בְּרֹאשׁ הָעָם
  choice: à frente do povo
  rationale: A expressão literalmente envolve a “cabeça” do povo e pode indicar uma posição diante da assembleia ou um lugar conspícuo. “À frente do povo” conserva a imagem espacial sem decidir que se tratava de liderança.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural (“proclamem”, “façam”). A formulação mantém a posição de Nabote espacialmente conspícua sem atribuir-lhe necessariamente liderança. O marcador [a] aparece junto a “cartas” no texto.
