base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: pt
  text: 'Acabe falou a Nabote:


    — Dê-me o seu vinhedo, para que ele se torne a minha horta, pois fica perto da minha casa. Em troca dele, darei a você um vinhedo melhor do que ele; ou, se isso lhe parecer bem[a], darei a você o preço dele em prata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “se for bom aos seus olhos”, expressão que significa “se isso lhe parecer bem” ou “se você aprovar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת
  choice: Acabe falou a Nabote
  rationale: Mantém o verbo comum de fala e a construção narrativa com אֶל, sem acrescentar tom ou intenção não expressos.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: Dê-me o seu vinhedo
  rationale: Reproduz de modo natural e direto o imperativo de נתן com o objeto indireto de primeira pessoa; כֶּרֶם é o termo comum para vinhedo.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: para que ele se torne a minha horta
  rationale: Expressa o propósito ou resultado indicado pela forma verbal de היה. 'Horta' comunica naturalmente גַּן יָרָק, um jardim destinado ao cultivo de verduras.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: pois fica perto da minha casa
  rationale: Conserva a justificativa espacial de Acabe em português corrente.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: Em troca dele, darei a você
  rationale: תַּחְתָּיו indica substituição ou troca; a formulação portuguesa torna essa relação explícita sem ampliar o conteúdo.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: um vinhedo melhor
  rationale: O comparativo com מִן indica que o vinhedo oferecido seria melhor do que o de Nabote; o referente permanece claro no contexto.
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: se isso lhe parecer bem
  rationale: Traduz de forma natural a expressão idiomática hebraica, preservando sua imagem em nota.
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: darei a você o preço dele em prata
  rationale: Representa tanto o pagamento monetário quanto a menção explícita à prata, sem modernizar o texto para uma moeda específica.
