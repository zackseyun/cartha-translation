  source_fidelity: 'A tradução reproduz com precisão o pedido de Acabe, a finalidade de transformar o vinhedo em horta, a proximidade da casa e a alternativa de pagamento em prata. Contudo, o comparativo explícito em כֶּרֶם טוֹב מִמֶּנּוּ deve ser expresso integralmente: o vinhedo oferecido é melhor do que o de Nabote.'
  naturalness: O português é moderno, claro e adequado ao registro narrativo. “Horta”, “perto da minha casa” e “isso lhe parecer bem” são formulações naturais e amplamente compreensíveis.
  terminology: “Vinhedo” traduz adequadamente כֶּרֶם; “horta” comunica bem גַּן יָרָק; e “prata” preserva a referência explícita a כֶּסֶף. Os nomes Acabe e Nabote estão adequados.
