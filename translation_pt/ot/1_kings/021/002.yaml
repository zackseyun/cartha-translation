    issue: O comparativo está apenas implícito em “um vinhedo melhor”.
    rationale: O hebraico inclui מִמֶּנּוּ, “do que ele/do que este”. Embora o referente seja inferível no contexto, “melhor do que ele” preserva explicitamente a comparação presente no texto-fonte.
