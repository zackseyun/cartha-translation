  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: pt
  text: Farei com que a sua casa[a] seja como a casa de Jeroboão, filho de Nebate, e como a casa de Baasa, filho de Aías, por causa da provocação com que você me provocou e porque levou Israel a pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dinastia”. Aqui, “casa” se refere à linhagem real de Acabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Farei com que ... seja
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, nesta fórmula de juízo indica o estado ao qual a casa de Acabe será reduzida; esta construção exprime naturalmente o resultado em português.
- source_word: בֵּיתְךָ
  choice: a sua casa
  rationale: בַּיִת pode designar casa, família ou dinastia. “Casa” preserva a metáfora hebraica da linhagem real, esclarecida em nota.
- source_word: כְּבֵית ... וּכְבֵית
  choice: como a casa de ... e como a casa de
  rationale: A preposição comparativa כְּ é traduzida diretamente por “como”, de modo natural e fiel.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Empregam-se as formas tradicionais portuguesas dos nomes e a fórmula patronímica hebraica é preservada.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasa, filho de Aías
  rationale: Empregam-se as formas tradicionais portuguesas dos nomes e traduz-se diretamente o patronímico.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: por causa da provocação com que você me provocou
  rationale: O substantivo e o verbo compartilham a raiz כעס. A formulação mantém essa repetição enfática e expressa o fundamento causal do juízo.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: e porque levou Israel a pecar
  rationale: O hifil de חטא comunica causação. “Levou Israel a pecar” é natural em português e evita sugerir coerção absoluta.
theological_decisions:
- issue: Objeto divino implícito em אֲשֶׁר הִכְעַסְתָּ
  choice: Explicitar “me”
  alternative: 'Manter o objeto implícito: “com que você provocou”'
  rationale: O próprio SENHOR fala no contexto, e o verbo refere-se claramente a provocá-lo. A explicitação é necessária para uma frase natural e clara em português.
- issue: Sentido dinástico de בֵּית
  choice: Manter “casa” no texto e explicar “dinastia” em nota
  alternative: Traduzir diretamente como “dinastia”
  rationale: “Casa” conserva a metáfora hebraica e a ressonância literária da fórmula de juízo, enquanto a nota elimina possível ambiguidade para o leitor moderno.
- issue: Causalidade em levar Israel ao pecado
  choice: “levou Israel a pecar”
  alternative: “fez Israel pecar”
  rationale: A escolha preserva a responsabilidade causal atribuída ao rei sem transformar a construção em uma afirmação de coerção irresistível.
translation_notes:
  register: Português moderno, digno e acessível, com formas nominais bíblicas correntes no Brasil. A repetição “provocação ... provocou” conserva deliberadamente a figura etimológica do hebraico; o tratamento “você” favorece ampla compreensão brasileira sem reduzir a solenidade do oráculo.
