base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: pt
  text: 'Então Acabe entrou em sua casa contrariado e irritado por causa do que Nabote, o jezreelita, lhe havia dito[a]: “Não lhe darei a herança de meus pais[b]”. Ele se deitou na cama, virou o rosto e não quis comer pão.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da palavra que Nabote, o jezreelita, lhe havia falado”. O termo hebraico pode significar “palavra”, “assunto” ou “coisa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a herança de meus antepassados”. Hebraico: “de meus pais”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “não comeu pão”. A expressão pode se referir a comer alimento em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: mal-humorado e indignado
  rationale: A combinação comunica tanto o retraimento obstinado quanto o forte desagrado de Acabe em português atual, sem recorrer a termos arcaicos.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: por causa do que ... lhe havia dito
  rationale: Expressa naturalmente o sentido contextual de דָּבָר como aquilo que foi dito, mantendo a relação causal.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabote, o jezreelita
  rationale: Emprega a forma portuguesa tradicional do nome e traduz o gentílico de modo claro.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: a herança de meus pais
  rationale: Preserva o caráter familiar e patrimonial de נַחֲלָה e mantém o plural masculino explícito אֲבוֹתַי.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: Ele se deitou na cama
  rationale: Verte naturalmente a ação narrativa ingressiva em português moderno.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: virou o rosto
  rationale: Mantém o gesto físico de afastamento sem explicitar uma direção que o hebraico não declara.
- source_word: וְלֹא אָכַל לָחֶם
  choice: e não quis comer
  rationale: Comunica a recusa implícita no contexto e traduz o uso idiomático de לֶחֶם para alimento em geral.
theological_decisions:
- issue: Linguagem ancestral masculina na fala de Nabote
  choice: meus pais
  alternative: meus antepassados
  rationale: O hebraico usa explicitamente o plural masculino אֲבוֹתַי. “Meus pais” preserva a ênfase patrimonial da linhagem masculina, enquanto a nota registra a alternativa portuguesa mais abrangente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a concisão narrativa e evita explicar no corpo do texto a atitude petulante de Acabe. Os marcadores seguem a ordem de ocorrência no texto.
