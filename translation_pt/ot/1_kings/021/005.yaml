base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: pt
  text: 'Então Jezabel, sua mulher, foi até ele e lhe disse[a]: “Por que você está tão abatido que não come pão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “O que é isto? Seu espírito está abatido, e você não come pão?”'
    reason: Registra a forma mais literal da pergunta, incluindo “espírito” e a construção coordenada do hebraico.
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: Então ... foi até ele
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a progressão, e “foi até ele” traduz naturalmente o movimento em direção a Acabe.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: Jezabel, sua mulher
  rationale: Mantém a forma tradicional do nome em português e identifica de modo direto a relação de Jezabel com Acabe.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: lhe perguntou
  rationale: Embora o verbo signifique literalmente “falou”, aqui introduz uma pergunta direta; “lhe perguntou” é natural e preciso no contexto.
- source_word: מַה זֶּה
  choice: Por que
  rationale: A expressão literalmente “O que é isto?” introduz idiomaticamente uma pergunta sobre o estado de Acabe; “Por que” comunica essa função em português atual.
- source_word: רוּחֲךָ סָרָה
  choice: você está tão abatido
  rationale: A construção descreve a disposição interior de Acabe como desviada, sombria ou mal-humorada. “Abatido” comunica o estado emocional sem impor a referência literal ao “espírito”, pouco natural nesta pergunta em português.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: que não come
  rationale: “Comer pão” funciona aqui como expressão hebraica para tomar alimento ou fazer uma refeição. O português natural pode dizer simplesmente “comer”, enquanto a relação com o abatimento é preservada por “que”.
