base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: pt
  text: Assim, os homens da cidade de Nabote — os anciãos e os nobres[a] que moravam naquela cidade — fizeram o que Jezabel lhes havia mandado, conforme estava escrito nas cartas que ela lhes havia enviado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os dignitários”; o termo hebraico pode designar homens socialmente proeminentes ou autoridades de alta posição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: O verbo עשה expressa aqui o cumprimento das instruções de Jezabel; “fizeram” mantém a força narrativa simples e direta.
- source_word: אַנְשֵׁי עִירוֹ
  choice: os homens da cidade de Nabote
  rationale: A expressão significa literalmente “os homens da cidade dele”. O referente contextual do pronome é Nabote; explicitar o nome evita a ambiguidade que “sua cidade” teria em português.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: No contexto cívico, o termo designa líderes reconhecidos da comunidade, não apenas homens idosos.
- source_word: הַחֹרִים
  choice: os nobres
  rationale: Neste contexto administrativo e judicial, o termo se refere a homens de posição social elevada; a alternativa “dignitários” é indicada em nota.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: que moravam naquela cidade
  rationale: ישב significa aqui residir ou morar. “Naquela cidade” retoma naturalmente a cidade de Nabote sem introduzir ambiguidade possessiva.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: o que Jezabel lhes havia mandado
  rationale: O objeto de “enviar” está implícito no hebraico e é esclarecido pelas cartas mencionadas em seguida. Em português, esta formulação comunica naturalmente que eles cumpriram as instruções enviadas por Jezabel.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: conforme estava escrito nas cartas
  rationale: סְפָרִים designa aqui a correspondência enviada por Jezabel; “cartas” é mais preciso no contexto do que “livros”, “documentos” ou “rolos”.
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: que ela lhes havia enviado
  rationale: A oração relativa identifica as cartas e preserva com naturalidade a anterioridade do envio.
