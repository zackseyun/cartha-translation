  text: וַ/יְהִ֛י כִּ/שְׁמֹ֥עַ אַחְאָ֖ב כִּ֣י מֵ֣ת נָב֑וֹת וַ/יָּ֣קָם אַחְאָ֗ב לָ/רֶ֛דֶת אֶל כֶּ֛רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י לְ/רִשְׁתּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: pt
  text: Quando Acabe ouviu que Nabote estava morto[a], levantou-se para descer até a vinha de Nabote, o jezreelita, e tomar posse dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tinha morrido”. O hebraico pode indicar tanto o estado resultante (“estava morto”) como o acontecimento já concluído (“tinha morrido”).
    reason: lexical_alternative
  - marker: b
    text: Ou “possuí-la” ou “herdá-la”. O verbo hebraico pode significar tomar posse, possuir ou herdar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A construção introduz uma transição narrativa com uma oração temporal. Em português atual, “Quando Acabe ouviu” comunica naturalmente essa função sem a rigidez de “E aconteceu que”.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo da notícia ouvida por Acabe.
- source_word: מֵת
  choice: estava morto
  rationale: O perfeito de מות pode apresentar tanto o estado resultante quanto o acontecimento concluído. “Estava morto” preserva em primeiro plano o estado comunicado a Acabe.
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: קום marca o início de uma ação deliberada. “Levantou-se” mantém o tom narrativo digno e corresponde diretamente ao hebraico.
- source_word: לָרֶדֶת
  choice: para descer
  rationale: ירד contém uma indicação direcional explícita, preservada por “descer”.
- source_word: כֶּרֶם
  choice: vinha
  rationale: “Vinha” é o equivalente português corrente e preciso para uma plantação de videiras.
- source_word: הַיִּזְרְעֵאלִי
  choice: o jezreelita
  rationale: O gentílico identifica Nabote por sua ligação com Jezreel; a forma portuguesa direta preserva essa identificação.
- source_word: לְרִשְׁתּוֹ
  choice: tomar posse dela
  rationale: ירשׁ pode significar tomar posse, possuir ou herdar. Neste contexto, a expressão descreve Acabe assumindo o domínio da vinha, sem acrescentar ao verbo uma nuance específica de violência.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para evitar a repetição pouco natural de “Acabe”, sem perder a clareza do sujeito. Os marcadores de nota aparecem imediatamente após as expressões a que se referem.
