  terminology: «Yahweh», «Nabote» e «Acabe» são adequados. «Herança» mantém o sentido de posse familiar transmitida por linhagem; a nota esclarece que a expressão inicial é uma fórmula enfática, em vez de impor uma paráfrase doutrinária.
