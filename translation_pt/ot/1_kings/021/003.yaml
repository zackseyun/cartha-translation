source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר נָב֖וֹת אֶל אַחְאָ֑ב חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/תִּתִּ֛/י אֶת נַחֲלַ֥ת אֲבֹתַ֖/י לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: pt
  text: 'Mas Nabote disse a Acabe: “Que Yahweh me livre de dar a você a herança de meus pais!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica é uma fórmula de forte repúdio; mais literalmente: “Longe de mim, por Yahweh, dar a você a herança de meus pais!”'
    reason: Esclarece o caráter idiomático da tradução principal e registra uma representação mais próxima da forma hebraica, preservando a referência explícita a Yahweh.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “Mas” explicita o contraste imediato entre a proposta de Acabe e a recusa de Nabote.
- source_word: נָבוֹת
  choice: Nabote
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: אֶל־אַחְאָב
  choice: a Acabe
  rationale: A preposição introduz o destinatário da fala; “Acabe” é a forma tradicional do nome em português.
- source_word: חָלִילָה לִּי
  choice: Longe de mim
  rationale: Expressão portuguesa natural de repúdio enfático, que preserva a força do idioma hebraico sem introduzir diretamente o verbo “proibir”.
- source_word: מֵיהוָה
  choice: por Yahweh
  rationale: Mantém explícito o nome divino e conserva a construção de caráter solene ou juramentado, sem fundi-la totalmente na expressão idiomática “Yahweh não permita”.
- source_word: מִתִּתִּי
  choice: dar
  rationale: O infinitivo expressa a ação repudiada; em português, “Longe de mim ... dar” reproduz a construção de modo conciso.
- source_word: נַחֲלַת
  choice: a herança
  rationale: No contexto fundiário, designa uma propriedade familiar herdada, preservando tanto o aspecto legal quanto o familiar.
- source_word: אֲבֹתַי
  choice: dos meus pais
  rationale: Reproduz o plural masculino explícito do hebraico e comunica a linhagem familiar, sem neutralizá-lo como “antepassados”.
- source_word: לָךְ
  choice: a você
  rationale: Expressa de forma clara e corrente o objeto indireto do verbo “dar”, com ampla inteligibilidade em português moderno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de חָלִילָה לִּי מֵיהוָה
  choice: Longe de mim, por Yahweh
  alternative: Que Yahweh não permita que eu dê; Longe de mim, diante de Yahweh
  rationale: A formulação principal conserva o forte repúdio de Nabote, mantém explícita a relação da recusa com Yahweh e evita resolver de modo excessivo a função precisa da preposição מִן. A nota oferece a expressão portuguesa mais idiomática.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas bíblicas reconhecíveis nos nomes próprios. A construção “Longe de mim, por Yahweh” é deliberadamente mais próxima da forma hebraica; a nota fornece a equivalência idiomática natural.
