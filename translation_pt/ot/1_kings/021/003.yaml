  source_fidelity: A recusa enfática de Nabote, a referência explícita a Yahweh, o infinitivo «dar» e a ideia de propriedade hereditária familiar são preservados. Contudo, «Longe de mim, por Yahweh, dar...» não é uma construção portuguesa suficientemente natural e torna obscura a relação da invocação a Yahweh com a recusa. «Que Yahweh me livre de...» é uma fórmula portuguesa idiomática que comunica adequadamente o repúdio solene sem alegar resolver de forma técnica a função discutida de מִן.
