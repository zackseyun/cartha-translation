base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: pt
  text: Então Hirão, rei de Tiro, enviou seus servos a Salomão, porque tinha ouvido que o haviam ungido rei no lugar de seu pai, pois Hirão sempre amara Davi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois Hirão era amigo de Davi por toda a vida”. O hebraico diz literalmente: “pois Hirão amava Davi todos os dias”, uma expressão que indica uma relação favorável e duradoura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Forma narrativa de שלח; o pretérito perfeito é a maneira natural de dar sequência ao relato em português.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: Hirão, rei de Tiro
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português, mantendo a aposição do hebraico.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עבד pode designar servos, súditos ou oficiais. “Servos” preserva a amplitude do termo sem especificar indevidamente a função ou a condição deles.
- source_word: אֶל שְׁלֹמֹה
  choice: a Salomão
  rationale: A preposição אֶל indica direção; a tradução não acrescenta uma finalidade diplomática que o texto não explicita.
- source_word: כִּי שָׁמַע
  choice: porque tinha ouvido
  rationale: כִּי introduz a razão do envio, e o mais-que-perfeito composto deixa claro que a notícia chegou antes dessa ação.
- source_word: מָשְׁחוּ לְמֶלֶךְ
  choice: o haviam ungido rei
  rationale: No contexto régio, משׁח indica a unção que reconhece ou instala alguém como rei. A terceira pessoa do plural indefinida é preservada.
- source_word: תַּחַת אָבִיהוּ
  choice: no lugar de seu pai
  rationale: תחת, neste contexto de sucessão, indica que Salomão passou a ocupar a posição real de seu pai.
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד
  choice: pois Hirão sempre amara Davi
  rationale: A construção com particípio e היה expressa uma disposição contínua. “Amara” preserva a força relacional de אהב e situa essa relação como antecedente ao envio.
- source_word: כָּל הַיָּמִים
  choice: sempre
  rationale: É uma expressão idiomática de continuidade; “sempre” comunica naturalmente em português a duração da relação.
