translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “pedras” foi mantida para refletir a ênfase e a estrutura apositiva do hebraico. “Casa” recebe inicial maiúscula para sinalizar seu uso contextual como designação do templo, sem substituir a palavra concreta do texto-fonte.
