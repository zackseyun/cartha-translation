  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: pt
  text: Então o rei ordenou que extraíssem grandes pedras, pedras de grande valor, pedras talhadas[a], para lançar os alicerces da casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras lavradas” ou “pedras aparelhadas”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo; o hebraico diz “a casa”.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Então o rei deu ordem
  rationale: O wayyiqtol dá continuidade à sequência narrativa. “Então” expressa essa progressão, e “deu ordem” traduz צוה de modo natural e direto em português.
- source_word: וַיַּסִּעוּ
  choice: eles extraíram
  rationale: A forma causativa de נסע pode indicar remover ou arrancar. No contexto da obtenção de pedras para construção, “extraíram” comunica a retirada das pedras da pedreira sem tornar explícito no verbo um local não mencionado.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: grandes pedras
  rationale: Tradução direta do substantivo com adjetivo, em linguagem corrente e digna.
- source_word: אֲבָנִים יְקָרוֹת
  choice: pedras de alto valor
  rationale: יקר denota algo valioso ou dispendioso. A expressão evita que “pedras preciosas” seja entendida como gemas e preserva a ideia de material de construção selecionado e caro.
- source_word: לְיַסֵּד הַבָּיִת
  choice: para lançar os alicerces da Casa
  rationale: יסד, neste contexto arquitetônico, refere-se ao estabelecimento dos fundamentos. “Lançar os alicerces” é uma formulação portuguesa natural. “Casa” preserva o hebraico בַּיִת, com o referente contextual esclarecido em nota.
- source_word: אַבְנֵי גָזִית
  choice: pedras lavradas
  rationale: גזית designa pedras talhadas ou aparelhadas. “Lavradas” é uma expressão consagrada na construção, compreensível em português e mantém a frase como terceira descrição apositiva das pedras.
