  text: 'Então[a] Salomão mandou dizer a Hirão[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Salomão mandou dizer a Hirão”. A conjunção narrativa hebraica pode ser traduzida aqui por “e” ou “então”.'
