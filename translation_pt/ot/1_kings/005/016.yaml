lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... mandou dizer
  rationale: O wayyiqtol de שׁלח apresenta a ação seguinte na narrativa. “Então” expressa naturalmente a sequência; com לֵאמֹר, a construção idiomática portuguesa é “mandou dizer”.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da mensagem; em “mandou dizer a Hirão”, “a” é a regência natural em português.
- source_word: חִירָם
  choice: Hirão
  rationale: Forma tradicional portuguesa correspondente à grafia hebraica חִירָם neste versículo.
- source_word: לֵאמֹר
  choice: dizer
  rationale: O infinitivo introduz a fala após o verbo de envio. Integrado a וַיִּשְׁלַח, “mandou dizer” é natural e mantém a função introdutória da expressão hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla. A construção “mandou dizer” evita o pouco natural “enviou a Hirão, dizendo” e comunica de modo fiel que Salomão lhe enviou uma mensagem. Os dois marcadores foram colocados no texto principal; o segundo esclarece que a fórmula introdutória aponta para a fala subsequente.
