  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
translation:
  language: pt
  text: O rei Salomão recrutou de todo o Israel um contingente para trabalho obrigatório[a], e o contingente era de trinta mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “impôs a todo o Israel uma convocação para trabalho obrigatório”. O termo hebraico se refere à prestação compulsória de trabalho, não principalmente a um imposto em dinheiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: recrutou
  rationale: No hifil, junto de מַס e neste contexto administrativo, o verbo descreve a imposição ou mobilização de um contingente. “Recrutou” comunica isso com naturalidade em português atual.
- source_word: מַס
  choice: trabalhadores para serviço obrigatório
  rationale: Aqui מַס designa prestação compulsória de trabalho, não principalmente um imposto em dinheiro. A formulação explicita tanto as pessoas recrutadas quanto o caráter obrigatório do serviço.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: dentre todo o Israel
  rationale: Indica a população da qual o contingente foi recrutado e preserva a abrangência expressa por כָּל.
- source_word: וַיְהִי הַמַּס
  choice: e o contingente era
  rationale: A segunda ocorrência de מַס pode designar coletivamente o grupo mobilizado. “O contingente era” evita repetição pesada e introduz de modo natural seu total numérico.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: trinta mil homens
  rationale: אִישׁ conta aqui trabalhadores adultos do sexo masculino; “homens” preserva essa especificidade.
