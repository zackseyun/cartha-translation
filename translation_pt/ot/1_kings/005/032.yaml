  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: pt
  text: Assim, os construtores de Salomão, os construtores de Hirão e os homens de Gebal[a] cortaram e prepararam a madeira e as pedras para construir a casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gebalitas” ou “os giblitas”, isto é, trabalhadores de Gebal (Biblos).
    reason: lexical_alternative
  - marker: b
    text: Isto é, a casa do SENHOR, o templo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: cortaram
  rationale: O verbo פסל indica cortar ou lavrar materiais. “Cortaram” é atual, claro e pode abranger tanto a madeira quanto as pedras mencionadas no contexto.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: os construtores de Salomão
  rationale: A expressão designa os trabalhadores de Salomão envolvidos na construção. A formulação é natural e conserva o sentido ocupacional.
- source_word: וּבֹנֵי חִירוֹם
  choice: os construtores de Hirão
  rationale: Mantém o paralelismo com “os construtores de Salomão” e usa a forma portuguesa tradicional e reconhecível do nome Hirão.
- source_word: וְהַגִּבְלִים
  choice: os homens de Gebal
  rationale: O gentílico identifica trabalhadores provenientes de Gebal, também conhecida como Biblos. A expressão evita um gentílico pouco transparente no texto principal.
- source_word: וַיָּכִינוּ
  choice: prepararam
  rationale: No hifil, כון tem aqui o sentido de preparar ou deixar pronto, adequado aos materiais de construção.
- source_word: הָעֵצִים
  choice: a madeira
  rationale: No contexto de construção, “madeira” expressa naturalmente o material empregado, sem especificar além do hebraico.
- source_word: וְהָאֲבָנִים
  choice: as pedras
  rationale: Tradução direta que preserva a generalidade do substantivo hebraico, embora o contexto pressuponha pedras trabalhadas para construção.
- source_word: לִבְנוֹת הַבָּיִת
  choice: para construir a casa
  rationale: Preserva o termo hebraico “casa” e sua referência contextual ao templo, esclarecida em nota sem substituir a imagem do texto-fonte.
theological_decisions:
- issue: Referente de הַבָּיִת (“a casa”)
  choice: Manter “a casa” no texto e esclarecer em nota que se trata da casa do SENHOR, o templo.
  alternative: Traduzir diretamente por “o templo”.
  rationale: O contexto identifica claramente o edifício, mas a manutenção de “casa” preserva a linguagem e a imagem teológica do hebraico sem tornar implícita a interpretação no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível a leitores brasileiros e compreensível internacionalmente. A repetição de “os construtores” conserva o paralelismo hebraico; “casa” permanece em minúscula como substantivo comum no texto-fonte, com a referência ao templo explicitada em nota.
