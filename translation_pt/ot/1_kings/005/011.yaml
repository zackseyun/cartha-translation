  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: pt
  text: Ele foi mais sábio do que todos os homens[a] — mais do que Etã, o ezraíta[b], e do que Hemã, Calcol e Darda, filhos de Maol — e seu nome era conhecido entre todas as nações ao redor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do que toda a humanidade”. O hebraico adam pode referir-se tanto a um homem quanto à humanidade em geral; neste contexto, a menção de sábios homens pelo nome favorece “todos os homens”.
    reason: lexical_alternative
  - marker: b
    text: “Ezraíta” pode ser uma designação étnica ou familiar; alguns a relacionam a “zeraíta”.
    reason: lexical_alternative
  - marker: c
    text: Ou “sua fama se espalhou entre todas as nações ao redor”. Literalmente, “seu nome estava em todas as nações ao redor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: foi mais sábio
  rationale: O verbo חכם, construído aqui comparativamente com מִן, indica superioridade em sabedoria. “Foi mais sábio” expressa essa comparação de modo natural em português.
- source_word: מִכָּל הָאָדָם
  choice: do que qualquer homem
  rationale: אָדָם pode designar um homem ou a humanidade em geral. A sequência de sábios homens nomeados favorece aqui a referência masculina, sem eliminar a alternativa coletiva, registrada em nota.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: mais do que Etã, o ezraíta
  rationale: A expressão é entendida como nome pessoal seguido de designação familiar ou étnica. “Ezraíta” translitera a forma hebraica sem decidir sua origem incerta.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: e do que Hemã, Calcol e Darda
  rationale: Os nomes são apresentados em formas portuguesas reconhecíveis e próximas do hebraico. A repetição de “do que” deixa clara a continuidade da comparação.
- source_word: בְּנֵי מָחוֹל
  choice: filhos de Maol
  rationale: A leitura mais direta é patronímica ou familiar. Leituras como uma referência a dança ou a uma corporação profissional são possíveis, mas menos naturais nesta lista de nomes.
- source_word: וַיְהִי שְׁמוֹ
  choice: seu nome era conhecido
  rationale: Literalmente, “seu nome estava/era”. O acréscimo idiomático de “conhecido” comunica em português o sentido hebraico de reputação, sem substituir “nome” por “fama” no texto principal.
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: entre todas as nações ao redor
  rationale: גּוֹיִם refere-se aqui aos povos ou nações vizinhos, e não traz necessariamente o sentido teológico posterior de “gentios”. “Entre” é idiomático com a ideia de ser conhecido.
theological_decisions:
- issue: Alcance de אָדָם na comparação
  choice: qualquer homem
  alternative: toda a humanidade / qualquer pessoa
  rationale: A forma hebraica admite sentido coletivo, mas o contexto imediato compara Salomão com sábios homens nomeados. A tradução mantém essa referência contextual e registra em nota a amplitude lexical possível.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Os travessões organizam a longa comparação sem alterar sua estrutura; os nomes próprios seguem formas portuguesas usuais.
