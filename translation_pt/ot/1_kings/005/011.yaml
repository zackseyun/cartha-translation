  naturalness: O registro é claro e moderno. Contudo, a vírgula imediatamente após o travessão de fechamento (“—, e”) é pontuação inadequada; a frase flui melhor sem ela. “Entre todas as nações ao redor” é natural, embora “nas nações vizinhas” pudesse ser mais conciso; a primeira preserva a imagem espacial do hebraico.
  terminology: Etã, ezraíta, Hemã, Calcol, Darda e Maol são formas portuguesas aceitáveis e suficientemente próximas do hebraico. “Nações” traduz corretamente גּוֹיִם neste contexto, sem importar o sentido teológico posterior de “gentios”.
