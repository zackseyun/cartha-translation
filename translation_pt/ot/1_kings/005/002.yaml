  text: Solomon’s provision for one day was thirty cors of fine flour and sixty cors of meal[b][a],
translation:
  language: pt
  text: A provisão[b] de Salomão para cada dia era de trinta coros[a] de farinha fina e sessenta coros de farinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um coro era uma grande medida de volume para produtos secos. O hebraico diz “trinta coros” e “sessenta coros”.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “pão”; neste contexto, a palavra se refere de modo mais amplo à provisão diária de alimentos de Salomão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: era
  rationale: O verbo היה na sequência narrativa apresenta a quantidade habitual da provisão; o imperfeito português expressa naturalmente esse quadro administrativo sem acrescentar um marcador temporal explícito.
- source_word: לֶחֶם שְׁלֹמֹה
  choice: A provisão diária de Salomão
  rationale: Embora לֶחֶם signifique literalmente “pão”, aqui designa de modo mais amplo o suprimento alimentar da casa real. A formulação com “diária” integra naturalmente לְיוֹם אֶחָד.
- source_word: לְיוֹם אֶחָד
  choice: diária
  rationale: A expressão indica a quantidade necessária para um dia, isto é, por dia; “diária” é clara e idiomática em português.
- source_word: שְׁלֹשִׁים כֹּר
  choice: trinta coros
  rationale: Mantém a antiga unidade hebraica em transliteração portuguesa, sem impor uma conversão moderna incerta.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Designa farinha de moagem refinada e de qualidade superior.
- source_word: וְשִׁשִּׁים כֹּר
  choice: e sessenta coros
  rationale: Repete de maneira coerente a mesma unidade de medida.
- source_word: קָמַח
  choice: farinha comum
  rationale: Distingue קָמַח da farinha refinada סֹלֶת sem recorrer a “fubá”, termo que em português brasileiro sugeriria especificamente milho.
theological_decisions: []
