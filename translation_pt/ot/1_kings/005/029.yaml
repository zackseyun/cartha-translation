  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: pt
  text: Salomão tinha setenta mil carregadores e oitenta mil cortadores de pedra nas montanhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trabalhadores que extraíam pedra na região montanhosa”. O hebraico diz literalmente “cortadores na montanha”.
