lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomão tinha
  rationale: A construção היה + ל expressa posse ou disponibilidade; “Salomão tinha” é a forma natural em português.
- source_word: שִׁבְעִים אֶלֶף נֹשֵׂא סַבָּל
  choice: setenta mil carregadores
  rationale: נֹשֵׂא סַבָּל designa trabalhadores encarregados de transportar cargas; “carregadores” comunica isso com clareza e concisão.
- source_word: וּשְׁמֹנִים אֶלֶף חֹצֵב
  choice: e oitenta mil cortadores de pedra
  rationale: חֹצֵב significa aquele que corta ou extrai; o contexto de construção e pedreira sustenta a explicitação natural do objeto “pedra”.
- source_word: בָּהָר
  choice: nas montanhas
  rationale: Embora esteja no singular em hebraico, הַר pode ter sentido topográfico ou coletivo; “nas montanhas” preserva diretamente o cenário montanhoso sem identificar uma montanha específica.
