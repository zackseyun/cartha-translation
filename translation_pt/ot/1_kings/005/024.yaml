  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: pt
  text: E Hirão fornecia a Salomão madeira de cedro e madeira de cipreste[a], segundo tudo o que Salomão desejava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “madeira de zimbro”; tradicionalmente, “madeira de abeto”. A espécie exata indicada pelo termo hebraico beroshim é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... נֹתֵן
  choice: E Hirão fornecia
  rationale: A combinação de וַיְהִי com o particípio נֹתֵן apresenta uma ação contínua ou habitual no passado. O imperfeito português “fornecia” expressa naturalmente essa duração no contexto de suprimentos para a construção.
- source_word: חִירוֹם
  choice: Hirão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לִשְׁלֹמֹה
  choice: a Salomão
  rationale: Mantém explicitamente a preposição hebraica e identifica Salomão como destinatário.
- source_word: עֲצֵי אֲרָזִים
  choice: madeira de cedro
  rationale: No contexto de materiais de construção, “madeira” comunica melhor o sentido do que uma referência a árvores vivas.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: e madeira de cipreste[a]
  rationale: “Cipreste” é uma identificação moderna comum, mas a espécie exata de בְּרוֹשׁ permanece incerta; a nota preserva as alternativas relevantes.
- source_word: כָּל חֶפְצוֹ
  choice: conforme tudo o que ele desejava
  rationale: Reproduz a ideia da plena medida do desejo ou pedido de Salomão de modo claro e digno em português.
