  text: וְ/כִלְכְּלוּ֩ הַ/נִּצָּבִ֨ים הָ/אֵ֜לֶּה אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/אֵ֧ת כָּל הַ/קָּרֵ֛ב אֶל שֻׁלְחַ֥ן הַ/מֶּֽלֶךְ שְׁלֹמֹ֖ה אִ֣ישׁ חָדְשׁ֑/וֹ לֹ֥א יְעַדְּר֖וּ דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: pt
  text: Esses administradores[a] forneciam mantimentos ao rei Salomão e a todos os que se aproximavam da mesa do rei Salomão[b], cada um no mês que lhe cabia; não deixavam faltar coisa alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oficiais” ou “governadores”; o hebraico se refere a administradores nomeados para supervisionar distritos.
    reason: lexical_alternative
  - marker: b
    text: A expressão indica os que tinham acesso à mesa real ou dela participavam.
    reason: cultural_context
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: forneciam mantimentos
  rationale: O piel de כלכל, neste contexto administrativo, indica sustentar ou abastecer com as provisões necessárias. A formulação explicita naturalmente em português o abastecimento da casa real.
- source_word: הַנִּצָּבִים
  choice: administradores
  rationale: O termo designa homens nomeados para exercer autoridade sobre distritos e organizar o abastecimento real. “Administradores” comunica a função sem sugerir necessariamente o cargo político moderno de governador.
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: ao rei Salomão
  rationale: Forma idiomática em português para a construção hebraica com título e nome próprio.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: e a todos os que se aproximavam da mesa do rei Salomão
  rationale: Preserva a imagem hebraica de aproximar-se da mesa, que no contexto se refere aos que tinham acesso à mesa real ou dela participavam.
- source_word: אִישׁ חָדְשׁוֹ
  choice: cada um no mês que lhe cabia
  rationale: A expressão distributiva indica que cada administrador assumia a responsabilidade durante o mês de sua escala. A redação é natural e mantém a ideia de rodízio mensal.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: não deixavam faltar coisa alguma
  rationale: A expressão afirma que os administradores não permitiam que nenhuma provisão necessária faltasse. Esta tradução preserva o sujeito plural e exprime claramente o resultado do abastecimento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução preserva a imagem da aproximação à mesa real e torna explícito, sem excesso interpretativo, o rodízio mensal dos administradores.
