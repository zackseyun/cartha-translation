  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: pt
  text: Salomão governava todos os reinos desde o Rio[a] até a terra dos filisteus e até a fronteira do Egito. Eles traziam tributo[b] e serviam a Salomão todos os dias da sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o rio Eufrates.
    reason: cross_reference
  - marker: b
    text: Ou “presentes”. O termo hebraico minḥah pode indicar presente, oferta ou tributo; neste contexto político, “tributo” é o sentido mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: governava
  rationale: O particípio com הָיָה descreve uma situação contínua no passado; “governava” expressa naturalmente essa duração e o domínio político.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: todos os reinos
  rationale: Com מוֹשֵׁל, a preposição assinala o âmbito do domínio. Em português, “governava todos os reinos” é mais natural do que “governava sobre todos os reinos” e mantém a pluralidade das unidades políticas subordinadas.
- source_word: מִן הַנָּהָר
  choice: desde o Rio
  rationale: No contexto geopolítico, “o Rio” é uma designação convencional do Eufrates. A forma do hebraico é preservada no texto, com a identificação explícita em nota.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: a terra dos filisteus
  rationale: Tradução transparente da construção hebraica, clara para leitores atuais.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: e até a fronteira do Egito
  rationale: Expressa claramente o limite territorial indicado pelo hebraico sem especificar além do texto.
- source_word: מַגִּשִׁים מִנְחָה
  choice: traziam tributo
  rationale: מִנְחָה pode designar presente, oferta ou tributo. O contexto de reinos submetidos favorece “tributo”, enquanto “traziam” preserva o sentido concreto de apresentação.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: serviam a Salomão
  rationale: A expressão descreve serviço prestado a um superior, aqui com sentido político, sem exigir que se especifique trabalho forçado.
- source_word: כָּל יְמֵי חַיָּיו
  choice: todos os dias da sua vida
  rationale: Reproduz com clareza e naturalidade o idiomatismo hebraico referente à duração de toda a vida de Salomão.
