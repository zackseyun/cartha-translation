  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: pt
  text: A cevada e a palha para os cavalos e os animais de montaria[a] eram levadas ao lugar onde estivesse cada responsável[b], conforme o que lhe cabia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar mais especificamente animais selecionados para montaria, talvez mulas ou cavalos de carros de guerra.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cada homem”, em sentido distributivo, referindo-se a cada encarregado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים וְהַתֶּבֶן
  choice: A cevada e a palha
  rationale: Os termos designam cevada e palha usadas aqui como provisão para os animais; a formulação é direta e natural em português.
- source_word: לַסּוּסִים וְלָרָכֶשׁ
  choice: para os cavalos e os animais de montaria
  rationale: סוּסִים são cavalos; רֶכֶשׁ parece indicar animais selecionados para montaria ou transporte real, mas sua identificação mais específica é incerta.
- source_word: יָבִיאוּ
  choice: eram levadas
  rationale: A forma hebraica é ativa e plural, literalmente 'levavam', mas o agente permanece implícito. O passivo impessoal em português mantém o foco nas provisões e expressa naturalmente a entrega habitual no contexto administrativo.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: onde estivesse cada responsável
  rationale: 'אִישׁ, literalmente ''homem'', tem força distributiva neste contexto: cada encarregado recebia as provisões no lugar em que estivesse.'
- source_word: כְּמִשְׁפָּטוֹ
  choice: conforme o que lhe cabia
  rationale: מִשְׁפָּטוֹ indica aqui a obrigação, cota ou atribuição prescrita de cada responsável, não uma decisão judicial. A expressão portuguesa preserva essa amplitude administrativa.
