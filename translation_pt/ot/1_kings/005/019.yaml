  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: pt
  text: '“E eis que pretendo construir uma casa[a] para o nome de Yahweh, meu Deus,[b] conforme Yahweh falou a Davi, meu pai: ‘Seu filho, a quem colocarei em seu lugar no seu trono,[c] ele construirá a casa para o meu nome’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um templo”. O hebraico diz literalmente “uma casa”.'
    reason: lexical_alternative
  - marker: b
    text: “Para o nome de Yahweh, meu Deus” é uma fórmula ligada ao templo e indica uma casa dedicada ao nome de Yahweh.
    reason: cultural_note
  - marker: c
    text: 'Ou: “a quem nomearei para suceder a você”. O hebraico diz literalmente “a quem colocarei em seu lugar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: Agora, pretendo
  rationale: O marcador de atenção הִנֵּה, seguido do particípio אֹמֵר e do infinitivo, introduz a resolução presente de Salomão. “Agora, pretendo” comunica essa força discursiva em português atual, sem reduzir אֹמֵר a simples ato de falar.
- source_word: לִבְנוֹת בַּיִת
  choice: construir uma casa
  rationale: בַּיִת significa literalmente “casa”. Embora se refira ao templo, manter “casa” preserva a formulação hebraica e sua ressonância teológica; uma nota esclarece o referente.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: para o nome de Yahweh, meu Deus
  rationale: Preserva a fórmula do templo “para o nome de”, em vez de explicá-la apenas como homenagem, e mantém o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal divino, de acordo com a evidência direta do texto hebraico.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme ... falou
  rationale: Expressa naturalmente a correspondência entre o propósito de Salomão e a promessa anterior de Yahweh.
- source_word: אֶל דָּוִד אָבִי
  choice: a Davi, meu pai
  rationale: Segue de perto a ordem hebraica e permanece natural em português.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ עַל כִּסְאֶךָ
  choice: a quem colocarei em seu lugar no seu trono
  rationale: Comunica a sucessão régia sem apagar a imagem hebraica de ser posto no lugar de Davi e em seu trono.
- source_word: הוּא יִבְנֶה
  choice: ele construirá
  rationale: Mantém o pronome explícito e enfático, destacando que o filho designado seria o construtor.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal, em vez de substituí-lo por um título.
- issue: Sentido da fórmula לְשֵׁם (“para o nome”)
  choice: Preservar literalmente a fórmula “para o nome”
  alternative: “em honra de Yahweh” ou “dedicada a Yahweh”
  rationale: A formulação hebraica associa o templo ao nome e à presença de Yahweh. Uma paráfrase exclusivamente honorífica reduziria essa densidade teológica.
- issue: Ênfase no filho prometido
  choice: Manter o pronome explícito “ele”
  alternative: Omitir o pronome, como permite o português
  rationale: O hebraico usa הוּא enfaticamente; sua retenção destaca o filho divinamente designado sem identificar além do que o contexto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Agora, pretendo” evita o arcaísmo de “eis que eu digo”, mas conserva a função de introduzir a resolução de Salomão. As repetições de “casa” e “nome” foram mantidas por serem estruturais no hebraico.
