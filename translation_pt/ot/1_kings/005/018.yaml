id: 1KI.5.18
reference: 1 Kings 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: pt
  text: Mas agora Yahweh, meu Deus, deu-me descanso de todos os lados; não há adversário[a] nem acontecimento ruim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “opositor”. Aqui, o hebraico שָׂטָן é um substantivo comum, não necessariamente o nome próprio Satanás.
    reason: lexical_alternative
  - marker: b
    text: Ou “infortúnio”, “calamidade” ou “desastre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Expressa a transição contrastiva entre as dificuldades anteriores e a situação presente de Salomão.
- source_word: הֵנִיחַ ... לִי
  choice: deu-me descanso
  rationale: Preserva o sentido causativo do hifil de נוח e traduz naturalmente a ideia de proporcionar repouso ou alívio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Reproduz de modo direto e natural a construção possessiva hebraica.
- source_word: מִסָּבִיב
  choice: de todos os lados
  rationale: Comunica que o descanso alcança toda a região ao redor, especialmente em relação às ameaças circundantes.
- source_word: אֵין שָׂטָן
  choice: não há adversário
  rationale: שָׂטָן funciona aqui como substantivo comum referente a um opositor, de acordo com o contexto político e militar.
- source_word: וְאֵין פֶּגַע רָע
  choice: nem acontecimento ruim
  rationale: Mantém a amplitude da expressão hebraica, que pode designar um evento nocivo, infortúnio, calamidade ou desastre, sem restringi-la indevidamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico apresenta o nome divino diretamente; mantê-lo como Yahweh preserva essa referência pactual.
- issue: Se שָׂטָן é nome próprio ou substantivo comum
  choice: adversário
  alternative: Satanás
  rationale: Neste contexto, o termo se refere a oposição humana ou política e não identifica necessariamente o ser espiritual chamado Satanás.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal em “deu-me” conserva um tom bíblico moderado sem recorrer a linguagem arcaica; as notas preservam a amplitude lexical e evitam identificar indevidamente שָׂטָן como nome próprio.
