  text: וּ/שְׁלֹמֹה֩ נָתַ֨ן לְ/חִירָ֜ם עֶשְׂרִים֩ אֶ֨לֶף כֹּ֤ר חִטִּים֙ מַכֹּ֣לֶת לְ/בֵית֔/וֹ וְ/עֶשְׂרִ֥ים כֹּ֖ר שֶׁ֣מֶן כָּתִ֑ית כֹּֽה יִתֵּ֧ן שְׁלֹמֹ֛ה לְ/חִירָ֖ם שָׁנָ֥ה בְ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: pt
  text: Salomão deu a Hirão vinte mil coros de trigo como alimento para a casa dele[a] e vinte coros de azeite de olivas esmagadas[b]. Era isso que Salomão dava a Hirão ano após ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como provisões para a casa dele”. A expressão hebraica provavelmente se refere ao alimento fornecido à casa real de Hirão.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, azeite de alta qualidade produzido de olivas batidas ou esmagadas, em vez de obtido por um processo posterior de prensagem.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: deu / dava
  rationale: O qatal apresenta a concessão, e o imperfeito, junto de שָׁנָה בְשָׁנָה, descreve sua repetição habitual no passado.
- source_word: כֹּר
  choice: coros
  rationale: Mantém a unidade antiga específica, em vez de substituí-la pelo impreciso 'medidas'.
- source_word: חִטִּים
  choice: trigo
  rationale: O substantivo designa especificamente trigo, não cereais em geral.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: como alimento para a casa dele
  rationale: מַכֹּלֶת significa alimento ou provisões; 'casa' preserva a amplitude de בֵּית, que pode abranger a família e a corte de Hirão.
- source_word: שֶׁמֶן כָּתִית
  choice: azeite de olivas esmagadas
  rationale: Expressa de modo compreensível o óleo obtido de olivas batidas ou esmagadas, sem reduzir כָּתִית simplesmente a uma indicação genérica de qualidade.
- source_word: כֹּה
  choice: Era isso que
  rationale: Retoma as quantidades e apresenta esse fornecimento como o padrão repetido.
- source_word: שָׁנָה בְשָׁנָה
  choice: ano após ano
  rationale: Reproduz naturalmente a ideia de repetição anual regular.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome 'dele' evita a possível ambiguidade de 'sua casa'. A unidade antiga 'coro' foi preservada, e a explicação do método de produção do azeite aparece em nota.
