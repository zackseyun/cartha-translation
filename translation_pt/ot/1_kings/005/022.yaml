base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: pt
  text: 'Então Hirão enviou uma mensagem a Salomão, dizendo: “Ouvi o que você me enviou[a]. Farei tudo o que você deseja quanto à madeira de cedro e à madeira de cipreste[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que você me pediu”. O hebraico diz mais literalmente “o que você me enviou”, podendo referir-se à mensagem de Salomão ou ao pedido que ela comunicava.
    reason: lexical_alternative
  - marker: b
    text: Hebraico בְּרוֹשִׁים (beroshim); a espécie de árvore é incerta. O termo também é traduzido como “zimbro” ou “abeto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִירָם אֶל שְׁלֹמֹה לֵאמֹר
  choice: Então Hirão mandou dizer a Salomão
  rationale: A forma narrativa faz a ação avançar. A expressão idiomática portuguesa “mandou dizer” comunica com naturalidade o envio da mensagem e introduz a fala direta.
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito hebraico indica que Hirão recebeu e tomou conhecimento da mensagem; o pretérito perfeito é natural e claro em português.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלָי
  choice: o que você me enviou
  rationale: Mantém a formulação abrangente do hebraico sem decidir explicitamente se o referente é a mensagem ou o pedido transmitido por ela.
- source_word: אֲנִי אֶעֱשֶׂה
  choice: Farei
  rationale: Preserva o sentido amplo de עשה e a ênfase do compromisso pessoal de Hirão sem restringi-lo a “fornecerei”.
- source_word: אֶת כָּל חֶפְצְךָ
  choice: tudo o que você deseja
  rationale: Expressão atual e natural que comunica o desejo ou vontade de Salomão sem a rigidez de “todo o seu desejo”.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: quanto à madeira de cedro
  rationale: A preposição indica a esfera em que Hirão atenderá ao desejo de Salomão; “madeira” se ajusta ao contexto de material de construção.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: e à madeira de cipreste
  rationale: “Cipreste” é uma identificação tradicional e corrente, mas a espécie indicada pelo termo hebraico permanece incerta, o que é registrado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O tratamento “você” torna a fala natural sem introduzir distinções sociais ausentes no hebraico. As notas foram posicionadas junto às expressões a que efetivamente se referem.
