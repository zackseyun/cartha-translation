  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: pt
  text: Meus servos levarão os troncos do Líbano até o mar, e eu os reunirei em jangadas sobre o mar e os conduzirei até o lugar que você me indicar. Ali desmancharei as jangadas, e você levará os troncos. Você, por sua vez, fará o que desejo, fornecendo alimento à minha casa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dando pão à minha casa”. Aqui, “pão” provavelmente significa alimento ou provisões, e “casa” pode se referir à casa real de Hirão.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: meus servos
  rationale: No contexto administrativo da corte de Hirão, designa trabalhadores ou servidores sob sua autoridade; “servos” mantém a amplitude do termo sem afirmar que fossem escravizados.
- source_word: יֹרִדוּ מִן־הַלְּבָנוֹן יָמָּה
  choice: levarão os troncos do Líbano até o mar
  rationale: O hifil de ירד expressa fazer descer. Em português, “levarão ... até o mar” comunica naturalmente o transporte descendente do Líbano à costa; “os troncos” explicita o referente implícito do contexto anterior.
- source_word: אֲשִׂימֵם דֹּבְרוֹת
  choice: eu os reunirei em jangadas
  rationale: A construção indica dispor os troncos como jangadas para transporte marítimo. “Reunirei em jangadas” é preciso e idiomático.
- source_word: בַּיָּם
  choice: sobre o mar
  rationale: Preserva a imagem das jangadas flutuando na superfície do mar.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: até o lugar que você me indicar
  rationale: O envio dirigido a Hirão refere-se provavelmente à comunicação ou designação do destino. “Indicar” expressa essa função sem especificar o meio da mensagem.
- source_word: וְנִפַּצְתִּים
  choice: desmancharei as jangadas
  rationale: נפץ pode significar quebrar, dispersar ou separar. Neste contexto, descreve a desmontagem das jangadas no destino, não a destruição da madeira.
- source_word: וְאַתָּה תִשָּׂא
  choice: você levará os troncos
  rationale: נשא tem o sentido amplo de levantar, carregar ou levar. A formulação explicita que Salomão assumiria o transporte dos troncos depois da desmontagem das jangadas.
- source_word: חֶפְצִי
  choice: o que desejo
  rationale: Mantém o sentido pessoal de desejo, vontade ou satisfação presente no substantivo.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: fornecendo alimento à minha casa
  rationale: “Pão” funciona aqui como metonímia de alimento ou provisões, e “casa” pode abranger a casa real de Hirão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para leitura ampla no Brasil. Os referentes implícitos foram explicitados como “troncos” e “jangadas” para evitar pronomes ambíguos, sem alterar a sequência logística do hebraico.
