  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: pt
  text: Sem contar os chefes dos encarregados de Salomão que estavam à frente da obra[a] — três mil e trezentos — e que exerciam autoridade sobre o povo[b] que fazia o trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes dos oficiais” ou “chefes dos supervisores”. Os termos administrativos hebraicos combinam ideias de posição hierárquica, nomeação e supervisão.
    reason: lexical_alternative
  - marker: b
    text: “Exerciam autoridade sobre” traduz um verbo que pode significar governar ou dominar; neste contexto, refere-se à direção dos trabalhadores.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: além de
  rationale: Introduz um grupo adicional aos números mencionados anteriormente e é natural em português.
- source_word: שָּׂרֵי הַנִּצָּבִים
  choice: chefes dos encarregados
  rationale: Conserva tanto a ideia de hierarquia expressa por שׂרי quanto a de função designada ou supervisora em הנצבים, sem fundir inteiramente os dois termos.
- source_word: לִשְׁלֹמֹה
  choice: de Salomão
  rationale: Expressa naturalmente a relação administrativa indicada pelo ל.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: que estavam à frente da obra
  rationale: Comunica responsabilidade e supervisão sobre o empreendimento, mantendo proximidade com a construção hebraica.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: três mil e trezentos
  rationale: Reproduz por extenso o total hebraico com clareza literária.
- source_word: הָרֹדִים
  choice: os quais exerciam autoridade sobre
  rationale: Preserva a força de רדה, que envolve domínio ou exercício de autoridade, ao mesmo tempo que se ajusta ao contexto administrativo do trabalho.
- source_word: בָּעָם
  choice: o povo
  rationale: Mantém o termo amplo do hebraico em vez de substituí-lo diretamente por 'trabalhadores'; o contexto esclarece que se trata da força de trabalho.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: que fazia o trabalho
  rationale: Tradução direta e idiomática da oração participial que identifica o povo envolvido na obra.
