base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: pt
  text: A sabedoria de Salomão superou a sabedoria de todos os povos do Oriente[a] e toda a sabedoria do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todos os filhos do Oriente”; expressão regional que também pode ser traduzida por “todos os habitantes do Oriente” ou “todos os orientais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: superava
  rationale: O verbo רבה, seguido da preposição comparativa מִן, indica superioridade em grau. “Superava” expressa essa comparação de modo natural em português.
- source_word: חָכְמַת
  choice: sabedoria
  rationale: חָכְמָה abrange aqui sabedoria, conhecimento e excelência intelectual; “sabedoria” é a correspondência ampla e convencional.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כָּל בְּנֵי קֶדֶם
  choice: todos os povos do Oriente
  rationale: A expressão idiomática בְּנֵי קֶדֶם, literalmente “filhos do Oriente”, designa coletivamente os povos ou habitantes das regiões orientais. A forma escolhida é natural e conserva o sentido regional e coletivo.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: e toda a sabedoria do Egito
  rationale: A segunda expressão comparativa depende do mesmo verbo. “Toda” preserva a força abrangente de כֹּל, sem repetir desnecessariamente o verbo.
- source_word: מִצְרָיִם
  choice: Egito
  rationale: Forma portuguesa convencional do topônimo.
