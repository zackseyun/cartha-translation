  terminology: «Povos», «sabedoria», «reis da terra» e «ouvido falar da sua sabedoria» são escolhas adequadas. «Da parte de todos os reis da terra» preserva prudentemente a expressão hebraica condensada, sem afirmar que todos os visitantes foram formalmente enviados.
