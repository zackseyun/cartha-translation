base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: pt
  text: Vieram pessoas de todos os povos[a] para ouvir a sabedoria de Salomão, da parte de todos os reis da terra[b] que tinham ouvido falar da sua sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de todas as nações». O hebraico עַמִּים está no plural e pode designar povos ou nações.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «da parte de todos os reis da terra». A expressão condensada pode indicar que essas pessoas vinham dos reis ou eram enviadas por eles, depois que estes ouviram falar da sabedoria de Salomão.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinham
  rationale: Embora seja formalmente um wayyiqtol, o contexto descreve a afluência de visitantes resultante da fama contínua de Salomão; o imperfeito português expressa com naturalidade essa ocorrência reiterada, sem mudar seu enquadramento narrativo.
- source_word: מִכָּל הָעַמִּים
  choice: de todos os povos
  rationale: Preserva o plural de עַמִּים e a referência a diversos grupos humanos; «nações» permanece alternativa contextual possível.
- source_word: לִשְׁמֹעַ
  choice: para ouvir
  rationale: Traduz diretamente o infinitivo de propósito e soa natural em português.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: a sabedoria de Salomão
  rationale: Reproduz de modo transparente a cadeia construta hebraica.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: da parte de todos os reis da terra
  rationale: «Da parte de» conserva a ideia de origem ou procedência associada a מֵאֵת e permite entender que os visitantes provinham dos reis ou eram enviados por eles, sem explicitar uma agência que o hebraico deixa comprimida.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: que tinham ouvido falar da sua sabedoria
  rationale: Em português, «ouvir falar de» expressa naturalmente que os reis tinham recebido notícias da sabedoria de Salomão, em vez de necessariamente a terem ouvido pessoalmente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a repetição de «sabedoria», presente no hebraico, e preserva por meio de nota a expressão comprimida relativa aos reis.
