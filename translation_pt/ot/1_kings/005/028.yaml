base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: pt
  text: 'Ele os enviou ao Líbano, dez mil por mês, em turnos[a]: ficavam um mês no Líbano e dois meses em casa[b]. Adonirão estava encarregado do trabalho compulsório[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em grupos alternados”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em sua casa”; isto é, cada trabalhador passava dois meses em casa entre os períodos de um mês no Líbano.
    reason: lexical_alternative
  - marker: c
    text: Ou “do tributo de trabalho”; o termo hebraico se refere a trabalho obrigatório imposto pelo Estado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Ele os enviava
  rationale: O verbo significa literalmente “ele os enviou”; o imperfeito narrativo em português comunica naturalmente o envio recorrente dentro do sistema mensal de revezamento.
- source_word: לְבָנוֹנָה
  choice: ao Líbano
  rationale: O he locale indica movimento em direção ao Líbano; “ao Líbano” é idiomático e exato.
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: dez mil por mês
  rationale: 'A construção tem sentido distributivo: um contingente de dez mil a cada mês.'
- source_word: חֲלִיפוֹת
  choice: em turnos
  rationale: O substantivo expressa alternância ou sucessão de grupos; “em turnos” torna claro o sistema de revezamento.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: ficavam um mês no Líbano
  rationale: O singular “mês” tem valor adverbial de duração; acrescentar “um” é necessário e natural em português.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: e dois meses em casa
  rationale: Literalmente, “em sua casa”; o sufixo singular tem sentido distributivo e se refere à casa de cada trabalhador.
- source_word: וַאֲדֹנִירָם
  choice: Adonirão
  rationale: Forma portuguesa tradicional e inteligível do nome hebraico אֲדֹנִירָם.
- source_word: עַל הַמַּס
  choice: estava encarregado do trabalho compulsório
  rationale: מַס designa serviço ou trabalho imposto pelo Estado; “trabalho compulsório” preserva claramente o caráter coercitivo.
