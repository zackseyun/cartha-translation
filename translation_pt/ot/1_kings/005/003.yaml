base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/003.yaml
  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: pt
  text: dez cabeças de gado engordado, vinte cabeças de gado criado no pasto, cem animais do rebanho[a], além de veados, gazelas, gamos[b] e aves engordadas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar coletivamente ovelhas e cabras.
    reason: lexical_alternative
  - marker: b
    text: A identificação exata do animal indicado pelo termo hebraico יַחְמוּר é incerta; outra tradução possível é “corços”.
    reason: lexical_alternative
  - marker: c
    text: A espécie exata das aves é incerta; outra tradução possível é “gansos engordados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: gado engordado
  rationale: בָקָר é coletivo para gado bovino, e בְּרִאִים descreve animais gordos ou bem alimentados. “Gado engordado” é natural e comunica que eram preparados especialmente para o consumo.
- source_word: בָּקָר רְעִי
  choice: gado criado no pasto
  rationale: רְעִי está relacionado ao pastoreio. A expressão contrasta claramente esses animais com o gado engordado e é compreensível em português corrente.
- source_word: צֹאן
  choice: animais do rebanho
  rationale: צֹאן pode abranger ovelhas e cabras. A formulação evita restringir indevidamente o referente, embora seja menos específica que “ovelhas”.
- source_word: לְבַד
  choice: além de
  rationale: Introduz itens adicionais aos já enumerados e reproduz de modo idiomático a função de לְבַד.
- source_word: אַיָּל
  choice: veados
  rationale: O termo designa um cervídeo, frequentemente o macho. “Veados” é uma categoria moderna e acessível, adequada a esta lista de caça.
- source_word: צְבִי
  choice: gazelas
  rationale: צְבִי normalmente designa a gazela; o plural português corresponde ao sentido coletivo da enumeração.
- source_word: יַחְמוּר
  choice: gamos
  rationale: A identificação zoológica exata é incerta. “Gamos” é uma possibilidade tradicional e plausível, mantendo-se a incerteza em nota.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: aves engordadas
  rationale: בַרְבֻּרִים indica aves, mas a espécie exata é discutida; אֲבוּסִים significa engordadas ou alimentadas no cocho. A tradução evita precisão zoológica indevida.
