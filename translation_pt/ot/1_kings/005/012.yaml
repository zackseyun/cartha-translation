  language: pt
  text: Ele proferiu três mil provérbios[a], e seus cânticos foram mil e cinco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “três mil ditos” ou “três mil parábolas”; o hebraico מָשָׁל tem sentido mais amplo do que “provérbio”.
