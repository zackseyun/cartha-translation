lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: proferiu
  rationale: O piel de דבר significa falar ou declarar. “Proferiu” preserva a ideia de expressão oral sem afirmar explicitamente que Salomão os escreveu ou compôs.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: três mil
  rationale: Construção cardinal direta, vertida segundo a ordem natural do português.
- source_word: מָשָׁל
  choice: provérbios
  rationale: Embora a forma hebraica esteja no singular após o numeral, tem valor contável coletivo. “Provérbios” se ajusta ao contexto da sabedoria de Salomão, enquanto a nota preserva a amplitude semântica de מָשָׁל.
- source_word: וַיְהִי
  choice: foram
  rationale: Neste enunciado numérico, היה funciona como verbo copulativo que indica o total; “foram” é natural e conciso em português.
- source_word: שִׁירוֹ
  choice: seus cânticos
  rationale: O substantivo singular com sufixo tem sentido coletivo diante do número. O plural português explicita corretamente a contagem, e “cânticos” mantém um registro digno.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: mil e cinco
  rationale: O hebraico diz literalmente “cinco e mil”; a ordem foi ajustada ao uso natural do português, preservando o total exato de 1.005.
