base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: pt
  text: Você sabe que Davi, meu pai, não pôde construir uma casa para o nome de Yahweh, seu Deus, por causa das guerras que o cercavam, até que Yahweh os[a] pôs debaixo das plantas dos pés de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “os”; o objeto plural não tem antecedente nominal expresso no versículo. No contexto, refere-se aos adversários submetidos por Yahweh.
    reason: ambiguity
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: Você sabe
  rationale: O perfeito qal de ידע, em discurso direto, expressa aqui conhecimento presente; o pronome explícito é conservado naturalmente em português.
- source_word: בַּיִת
  choice: uma casa
  rationale: Preserva a expressão hebraica para o futuro templo sem substituir de imediato a metáfora por “templo”.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: para o nome de Yahweh, seu Deus
  rationale: Mantém o idioma teológico “para o nome de”, sem reduzi-lo a “em honra de”.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: por causa das guerras que o cercavam
  rationale: O singular coletivo “guerra/conflito”, combinado com o verbo no plural, aponta para os conflitos militares recorrentes em torno de Davi; o plural soa natural em português.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: até que Yahweh pôs os inimigos
  rationale: O objeto plural hebraico não tem antecedente plural expresso inequívoco; “os inimigos” explicita o referente humano sugerido pela imagem de subjugação, e a nota registra a forma literal.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: debaixo das plantas dos pés dele
  rationale: Conserva a imagem hebraica completa de domínio e evita possível ambiguidade, em português, sobre de quem são os pés.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- issue: Referente do objeto plural em אֹתָם
  choice: os inimigos
  alternative: eles/os, com referente não explicitado
  rationale: O contexto de guerras e a imagem de serem postos debaixo dos pés indicam os adversários de Davi, mas a nota preserva a falta de um antecedente nominal explícito no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conservou-se a expressão bíblica “para o nome de Yahweh” e a imagem concreta “debaixo das plantas dos pés”.
