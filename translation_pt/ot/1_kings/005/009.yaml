base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: pt
  text: E Deus deu a Salomão sabedoria, entendimento em grande abundância e uma mente ampla[a], como a areia que está à beira-mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “largueza de coração” ou “amplitude de coração”. Em hebraico, “coração” também pode se referir à mente ou ao entendimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: Tradução direta e natural de נתן neste contexto; mantém a ação divina sem acrescentar nuances não expressas.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui rege verbo no singular e designa o Deus de Israel.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente consagrado e semanticamente adequado ao contexto de Salomão.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: entendimento muito grande
  rationale: Preserva o sentido amplo de תבונה e a forte intensificação de הַרְבֵּה מְאֹד, em português claro.
- source_word: וְרֹחַב לֵב
  choice: amplitude de mente
  rationale: Comunica a imagem de grande capacidade intelectual; לֵב pode designar o centro do pensamento e do entendimento. A nota conserva a forma mais literal.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: como a areia que está à beira-mar
  rationale: Reproduz a comparação e a imagem hebraica com formulação natural em português.
theological_decisions:
- issue: Sentido antropológico de לֵב em וְרֹחַב לֵב
  choice: amplitude de mente no texto principal
  alternative: amplitude de coração; largueza de coração
  rationale: No hebraico bíblico, לֵב abrange pensamento, compreensão e capacidade interior, não apenas emoção. 'Mente' evita uma leitura moderna excessivamente afetiva, enquanto a nota registra a metáfora literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada do hebraico foi mantida, e o idiomatismo antropológico foi esclarecido sem eliminar sua forma literal, preservada em nota.
