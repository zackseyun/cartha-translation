base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: pt
  text: Ele falou sobre as árvores, desde o cedro que há no Líbano até o hissopo[a] que brota do muro; falou também sobre os animais, as aves, os seres rastejantes e os peixes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “uma pequena planta aromática”. A identificação botânica exata do hebraico אֵזוֹב é incerta, embora “hissopo” seja a tradução tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: falou sobre
  rationale: A construção com עַל indica o assunto do discurso. “Falou sobre” é natural e não acrescenta a ideia mais técnica de que ele os descreveu ou ensinou formalmente a respeito deles.
- source_word: הָעֵצִים
  choice: as árvores
  rationale: O plural עֵצִים designa aqui árvores ou plantas lenhosas, dentro de uma exposição botânica cujos extremos são o cedro e o hissopo.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: o cedro que há no Líbano
  rationale: “Cedro” é a identificação usual de אֶרֶז, e a formulação explicita naturalmente em português sua ocorrência no Líbano sem alterar o sentido.
- source_word: מִן ... וְעַד
  choice: desde ... até
  rationale: A correlação hebraica expressa uma extensão entre dois extremos; “desde ... até” preserva bem esse merismo.
- source_word: הָאֵזוֹב
  choice: o hissopo
  rationale: “Hissopo” é a tradução tradicional e reconhecível, embora a identificação botânica exata seja incerta; essa incerteza é registrada em nota.
- source_word: יֹצֵא בַּקִּיר
  choice: cresce no muro
  rationale: Literalmente, a planta “sai” no muro. No contexto botânico, “cresce no muro” transmite essa imagem com naturalidade, sem determinar se brota de dentro ou de uma fenda.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: Aqui o termo tem sentido coletivo amplo e integra uma classificação ao lado de aves, seres rastejantes e peixes; “animais” evita restringi-lo a gado.
- source_word: הָעוֹף
  choice: as aves
  rationale: Neste catálogo, עוֹף refere-se naturalmente às criaturas voadoras, representadas de modo corrente por “aves”.
- source_word: הָרֶמֶשׂ
  choice: os seres rastejantes
  rationale: O termo abrange criaturas que rastejam ou se movem rente ao chão e é mais amplo que “répteis”; “seres rastejantes” preserva essa amplitude.
- source_word: הַדָּגִים
  choice: os peixes
  rationale: É o termo comum para peixes como categoria de seres aquáticos.
theological_decisions: []
