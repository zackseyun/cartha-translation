base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: pt
  text: E Yahweh deu sabedoria a Salomão, conforme lhe havia dito.[a] Havia paz entre Hirão e Salomão, e os dois fizeram uma aliança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme lhe havia prometido”. O verbo hebraico significa literalmente “falou” ou “disse”, mas, neste contexto, pode referir-se à palavra anterior de Yahweh a Salomão.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “cortaram uma aliança”, expressão idiomática que significa fazer ou firmar uma aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando a distinção presente no hebraico.
- source_word: נָתַן חָכְמָה
  choice: deu sabedoria
  rationale: Reproduz de modo direto e natural o sentido do verbo נָתַן e do substantivo חָכְמָה.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: conforme lhe havia dito
  rationale: Mantém o sentido lexical de דִּבֶּר, “falar/dizer”, e a anterioridade da palavra divina, sem defini-la obrigatoriamente como promessa.
- source_word: וַיְהִי שָׁלֹם
  choice: havia paz
  rationale: Expressa em português natural a existência de relações pacíficas, sem ampliar o termo para “amizade”.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: fizeram uma aliança
  rationale: Traduz naturalmente o idiomatismo hebraico “cortar uma aliança” e preserva o termo-chave בְרִית como “aliança”, em vez de restringi-lo a “tratado”.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Indica de forma clara a participação mútua de Hirão e Salomão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico sem substituí-lo por um título.
- issue: Sentido da palavra anterior de Yahweh a Salomão
  choice: conforme lhe havia dito
  alternative: conforme lhe havia prometido
  rationale: “Prometido” é contextualmente possível, mas explicita a natureza do ato de fala; “dito” conserva a formulação mais aberta do hebraico.
- issue: Tradução de בְרִית no contexto das relações entre reis
  choice: aliança
  alternative: tratado
  rationale: Embora o contexto seja político, “aliança” mantém a terminologia pactual do hebraico e sua continuidade em outros contextos bíblicos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural tanto no Brasil quanto em outros contextos lusófonos. “Hirão” segue a forma portuguesa tradicional do nome. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
