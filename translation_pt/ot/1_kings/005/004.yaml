  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: pt
  text: Pois ele dominava toda a região além do Rio[a], desde Tifsa até Gaza, sobre todos os reis além do Rio; e tinha paz por todos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: dominava
  rationale: O particípio expressa domínio contínuo. “Dominava” preserva esse aspecto e comunica com naturalidade a autoridade política exercida.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: toda a região além do Rio
  rationale: A expressão designa o território do outro lado do Eufrates. “Região” explicita de modo idiomático o sentido territorial sem substituir, no texto principal, a designação hebraica “o Rio”.
- source_word: הַנָּהָר
  choice: o Rio
  rationale: O hebraico emprega o substantivo definido como designação convencional do Eufrates. A tradução conserva essa forma, esclarecendo o referente em nota.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: desde Tifsa até Gaza
  rationale: A frase indica os limites geográficos do domínio. “Tifsa” é uma transliteração portuguesa clara de תִּפְסַח.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: e todos os reis além do Rio
  rationale: No encadeamento com “dominava”, a expressão indica a soberania exercida sobre todos os reis daquela região. Evita-se repetir “sobre” porque a regência de “dominava” continua naturalmente em português.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: e tinha paz
  rationale: A expressão se refere à paz e segurança política de que ele desfrutava, e “tinha paz” reproduz isso de maneira direta.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: por todos os lados
  rationale: A formulação portuguesa transmite de modo natural a ideia de paz procedente de todas as direções ao redor, sem interpretar עֲבָרָיו especificamente como “vizinhos” ou “territórios”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluida. Conserva-se “o Rio” no texto para refletir a forma hebraica, com esclarecimento em nota. “Dominava” mantém o caráter contínuo do particípio sem recorrer ao registro mais solene de “exercia domínio”.
