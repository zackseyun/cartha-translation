  terminology: «Rio» com inicial maiúscula e a nota identificando o Eufrates preservam adequadamente a designação hebraica. «Tifsa» e «Gaza» são formas portuguesas adequadas. «Dominava» comunica bem o valor durativo de רֹדֶה.
