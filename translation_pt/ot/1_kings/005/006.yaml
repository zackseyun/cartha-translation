  yaml_path: translation/ot/1_kings/005/006.yaml
  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: pt
  text: Salomão tinha quarenta mil baias para os cavalos dos seus carros de guerra[a] e doze mil cavaleiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «estábulos» em vez de «baias»; o hebraico se refere mais precisamente a baias ou lugares onde os cavalos eram alimentados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomão tinha
  rationale: A construção ויהי ל com possuidor expressa posse ou existência; em português corrente, «Salomão tinha» comunica o sentido com naturalidade.
- source_word: אַרְבָּעִים אֶלֶף
  choice: quarenta mil
  rationale: Tradução direta da expressão numérica cardinal.
- source_word: אֻרְוֺת
  choice: baias
  rationale: O substantivo designa mais precisamente compartimentos ou lugares de alimentação para cavalos, e não necessariamente edifícios inteiros.
- source_word: סוּסִים
  choice: cavalos
  rationale: Equivalente português comum e direto do substantivo plural.
- source_word: לְמֶרְכָּבוֹ
  choice: para os cavalos de seus carros de guerra
  rationale: A formulação portuguesa explicita a relação natural entre as baias, os cavalos e a força de carros; «carros de guerra» evita que «carros» seja entendido no sentido moderno de automóveis.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: e doze mil
  rationale: Tradução direta da expressão numérica coordenada.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: O termo normalmente designa homens montados ou integrantes da cavalaria; «cavaleiros» é a equivalência portuguesa mais direta.
