  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: pt
  text: Agora, dê ordem para que cortem para mim cedros do Líbano, e que os meus servos estejam com os seus servos. Eu lhe pagarei o salário dos seus servos conforme tudo o que você disser, pois você sabe que entre nós não há ninguém que saiba cortar madeira como os sidônios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saiba cortar árvores como os sidônios”. O hebraico diz literalmente “cortar árvores/madeira”; neste contexto, refere-se ao corte de madeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Funciona como marcador discursivo que introduz o pedido; “Agora” é natural e preserva a transição.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: dê ordem para que cortem para mim
  rationale: Preserva o imperativo dirigido ao rei e a construção volitiva subsequente, com expressão corrente em português.
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: cedros do Líbano
  rationale: Forma concisa e tradicional para indicar tanto a madeira quanto sua procedência.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: que os meus servos trabalhem com os seus servos
  rationale: O verbo “trabalhem” explicita naturalmente a cooperação laboral indicada pelo contexto, sem alterar a relação entre os dois grupos.
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: Eu lhe pagarei o salário dos seus servos
  rationale: שׂכר designa remuneração; “pagarei o salário” comunica claramente que se trata do pagamento pelo trabalho.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: conforme tudo o que você disser
  rationale: Mantém a abrangência da expressão hebraica e deixa a fixação dos termos com o destinatário.
- source_word: אֵין בָּנוּ אִישׁ
  choice: entre nós não há ninguém
  rationale: אִישׁ nesta construção negativa pode ter sentido representativo de pessoa; “ninguém” evita sugerir uma afirmação social sobre gênero e expressa com naturalidade a ausência de trabalhador comparavelmente capacitado.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: saiba cortar madeira
  rationale: A construção indica capacidade ou perícia; no contexto, עֵצִים se refere à madeira destinada à construção, não apenas ao ato genérico de cortar árvores.
- source_word: כַּצִּדֹנִים
  choice: como os sidônios
  rationale: Preserva diretamente a comparação com a reconhecida perícia dos sidônios.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” para a segunda pessoa singular régia, evitando formas excessivamente arcaicas. A repetição de “servos” preserva עבד, enquanto “trabalhem” torna explícita a função laboral indicada pelo contexto.
