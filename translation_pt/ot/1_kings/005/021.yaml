base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: pt
  text: 'Quando Hirão ouviu as palavras de Salomão, alegrou-se muito e disse: “Bendito seja o SENHOR hoje, que deu a Davi um filho sábio para governar este grande povo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: Reproduz de modo natural em português a construção temporal hebraica.
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: as palavras de Salomão
  rationale: Mantém a referência direta ao que Salomão havia comunicado.
- source_word: וַיִּשְׂמַח מְאֹד
  choice: alegrou-se muito
  rationale: Expressa com clareza a intensidade marcada por מְאֹד.
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: Bendito seja o SENHOR hoje
  rationale: Preserva o valor explícito de הַיּוֹם e representa o nome divino segundo a convenção portuguesa em versalete textual.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: para governar este grande povo
  rationale: A preposição עַל indica aqui a posição régia de autoridade sobre o povo; o verbo 'governar' torna essa relação idiomática e explícita em português.
theological_decisions:
- issue: Representação do Tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção bíblica portuguesa amplamente reconhecida sem acrescentar uma forma vocalizada ao texto principal.
- issue: Sentido da afirmação de que Deus deu a Davi um filho sábio
  choice: que deu a Davi um filho sábio
  alternative: por ter dado a Davi um filho sábio
  rationale: Mantém a forma relativa e a atribuição direta da dádiva a Deus, sem reformular a nuance do louvor.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente naturalizada, preservando o conteúdo e a progressão do hebraico.
