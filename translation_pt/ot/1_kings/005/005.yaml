source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: pt
  text: Judá e Israel viviam em segurança, cada homem[a] debaixo da sua videira e debaixo da sua figueira[b], desde Dã até Berseba, durante todos os dias de Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada um”. O hebraico diz literalmente “cada homem”, usando uma forma masculina singular em sentido distributivo.
    reason: lexical_alternative
  - marker: b
    text: “Debaixo da sua videira e debaixo da sua figueira” é uma imagem tradicional de paz, segurança e prosperidade na terra.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: viviam
  rationale: O verbo pode significar “sentar-se”, “habitar” ou “viver”. Com o sujeito coletivo e לָבֶטַח, descreve uma vida estabelecida e segura; “viviam” comunica naturalmente esse sentido durativo.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Judá e Israel
  rationale: Preserva diretamente as duas entidades territoriais e políticas nomeadas no hebraico, sem generalizá-las como “o povo”.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: Expressa a ideia de segurança e ausência de ameaça, além de se integrar naturalmente à imagem de estabilidade que domina o versículo.
- source_word: אִישׁ
  choice: cada homem
  rationale: O substantivo masculino singular é empregado distributivamente. A tradução conserva tanto a forma masculina quanto o sentido de cada integrante representativo da população.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: debaixo da sua videira e debaixo da sua figueira
  rationale: Mantém a imagem concreta e convencional de paz, prosperidade e posse sem ameaça, em vez de substituí-la por uma explicação abstrata.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: desde Dã até Berseba
  rationale: Conserva o merismo geográfico que indica toda a extensão do território, do extremo norte ao sul, usando formas correntes dos topônimos em português.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: durante todos os dias de Salomão
  rationale: Reproduz a duração expressa pelo hebraico e indica que essa condição caracterizou o período de Salomão.
theological_decisions:
- issue: Tradução do masculino distributivo אִישׁ
  choice: cada homem
  alternative: cada pessoa; cada um
  rationale: O hebraico emprega o masculino singular de maneira distributiva. “Cada homem” preserva a forma e a força representativa do original, enquanto a nota esclarece seu uso.
- issue: Tratamento da expressão “debaixo da sua videira e debaixo da sua figueira”
  choice: manter literalmente a imagem no texto principal
  alternative: parafrasear como “vivendo em paz e prosperidade”
  rationale: A imagem tradicional possui força literária e evoca paz, segurança, prosperidade e posse estável da terra. Mantê-la evita reduzir ou resolver em excesso suas associações.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe conserva o fluxo do hebraico, enquanto “viviam em segurança” e “desde Dã até Berseba” soam naturais em português. Os marcadores foram colocados junto aos termos efetivamente explicados.
