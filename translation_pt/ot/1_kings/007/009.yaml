translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário arquitetônico comum. “Tudo isso era feito de” explicita de modo natural a relação predicativa do hebraico sem alterar o referente. As notas preservam as duas incertezas lexicais relevantes.
