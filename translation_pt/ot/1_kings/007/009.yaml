  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: pt
  text: Tudo isso era de pedras de grande valor[a], lavradas sob medida e serradas com serra por dentro e por fora, desde o alicerce até o acabamento superior[b]; e, do lado de fora, até o grande pátio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras preciosas”. Aqui, o sentido provável é o de pedras de construção caras e de alta qualidade, não pedras preciosas como gemas.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “até os tefahot”. A parte arquitetônica exata é incerta; talvez se refira ao remate superior, como o capeamento ou a fiada de cima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: pedras de alto valor
  rationale: יְקָרֹת pode significar preciosas, valiosas ou dispendiosas. No contexto arquitetônico, refere-se mais provavelmente a pedras de construção caras e de alta qualidade, não a pedras preciosas ornamentais.
- source_word: כְּמִדֹּת גָּזִית
  choice: lavradas sob medida
  rationale: A expressão reúne a noção de dimensões determinadas (מִדּוֹת) e de pedra lavrada (גָּזִית). A formulação portuguesa comunica com naturalidade tanto o acabamento quanto o dimensionamento preciso.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: serradas com serra
  rationale: Mantém a formulação concreta e enfática do hebraico, que emprega o particípio e também nomeia o instrumento.
- source_word: מִבַּיִת וּמִחוּץ
  choice: por dentro e por fora
  rationale: Reproduz de perto a expressão hebraica e permite que ela se refira tanto aos lados ou às faces da alvenaria quanto ao âmbito interior e exterior, sem especificar além do texto.
- source_word: מִמַּסָּד
  choice: desde o alicerce
  rationale: מַסָּד designa a base ou fundação de uma construção; “alicerce” é claro e idiomático em português.
- source_word: עַד הַטְּפָחוֹת
  choice: até o acabamento superior
  rationale: O referente arquitetônico exato de הַטְּפָחוֹת é incerto. A escolha indica uma parte superior de remate sem identificar de modo excessivamente específico se era capeamento, fiada superior ou outro elemento.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: e, do lado de fora, até o grande pátio
  rationale: Preserva a extensão espacial da descrição até חָצֵר הַגְּדוֹלָה, traduzido pelo termo arquitetônico corrente “grande pátio”.
