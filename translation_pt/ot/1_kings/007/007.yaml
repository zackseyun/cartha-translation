translation_notes:
  register: Português moderno, claro e digno, com terminologia arquitetônica acessível. A construção parentética preserva o segundo nome do recinto sem apagar sua relação explicativa com o Salão do Trono. A nota foi posicionada junto à expressão a que se refere.
