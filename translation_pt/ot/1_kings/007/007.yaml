base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: pt
  text: Fez também o Salão do Trono, onde julgaria — o Salão do Julgamento —, e o revestiu de cedro do chão ao chão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em tradução mais interpretativa, “do chão ao teto”. O hebraico diz literalmente “do chão ao chão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: Fez também o Salão do Trono
  rationale: אוּלָם designa um salão ou pórtico amplo; “Salão” se ajusta ao contexto palaciano. כִּסֵּא significa “trono/assento” e aqui conserva naturalmente o sentido régio. A ordem foi ajustada para o português, mantendo “fez” como tradução de עָשָׂה.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: onde julgaria
  rationale: O imperfeito יִשְׁפָּט pode indicar a função prevista ou habitual do recinto. “Onde julgaria” é natural e preserva essa abertura sem especificar uma única ocasião.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: o Salão do Julgamento
  rationale: A expressão construta nomeia o salão por sua função. “Julgamento” permanece mais próximo de מִשְׁפָּט do que a opção mais interpretativa “justiça”.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: e o revestiu de cedro
  rationale: סָפוּן descreve uma superfície coberta ou revestida. “Revestiu de cedro” é corrente em descrição arquitetônica; o objeto pronominal retoma o salão.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: do chão ao chão
  rationale: O texto hebraico massorético repete קַרְקַע, “chão/solo”. A formulação preserva essa repetição incomum, enquanto a possível interpretação arquitetônica é registrada em nota.
