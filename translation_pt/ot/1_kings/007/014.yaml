source:
  edition: WLC
  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: pt
  text: Ele era filho de uma viúva da tribo de Naftali, e seu pai era um homem de Tiro[a], artesão em bronze. Ele era dotado de sabedoria, entendimento e conhecimento para realizar todo tipo de trabalho em bronze[b]. Veio, então, ao rei Salomão e fez todo o seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um tírio”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico neḥóshet pode designar cobre ou bronze; “bronze” se ajusta ao contexto dos utensílios do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: filho de uma viúva
  rationale: Reproduz com clareza a relação construta e mantém a ênfase do hebraico na condição da mãe.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: da tribo de Naftali
  rationale: מַטֶּה designa aqui a tribo; a formulação é natural e explícita em português.
- source_word: אִישׁ צֹרִי
  choice: um homem de Tiro
  rationale: O gentílico צֹרִי indica origem ou identidade tíria; a formulação locativa preserva esse sentido sem soar rebuscada.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: artesão em bronze
  rationale: חֹרֵשׁ indica um trabalhador especializado, e 'artesão' comunica melhor a perícia envolvida do que o termo genérico 'trabalhador'.
- source_word: וַיִּמָּלֵא
  choice: era dotado
  rationale: Expressa a condição passiva de alguém provido dessas capacidades e evita a possível impressão, em português, de que o artesão foi literalmente preenchido por entidades abstratas.
- source_word: הַחָכְמָה וְהַתְּבוּנָה וְהַדַּעַת
  choice: sabedoria, entendimento e conhecimento
  rationale: Mantém a tríade de capacidades práticas e intelectuais do texto hebraico.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: para realizar todo tipo de trabalho em bronze
  rationale: Comunica naturalmente tanto a amplitude de כָּל מְלָאכָה quanto o material empregado.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: Veio, então, ao rei Salomão
  rationale: O conector 'então' representa a progressão narrativa do wayyiqtol sem impor uma causalidade forte.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: e fez todo o seu trabalho
  rationale: Conserva a referência potencialmente ambígua do sufixo possessivo, sem acrescentar que o trabalho lhe foi designado ou que foi concluído.
theological_decisions:
- issue: Origem das capacidades do artesão na forma passiva וַיִּמָּלֵא
  choice: era dotado de sabedoria, entendimento e conhecimento
  alternative: estava cheio de sabedoria, entendimento e conhecimento
  rationale: A tradução mantém a recepção passiva das capacidades, mas não explicita um agente divino que o versículo não nomeia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Artesão' preserva a ideia de trabalho especializado; 'era dotado' mantém o valor passivo sem tornar a frase artificial. Todos os marcadores de nota aparecem no texto.
