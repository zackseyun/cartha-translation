base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: pt
  text: Ergueu as colunas no pórtico do templo. Ergueu a coluna da direita e lhe deu o nome de Jaquim; depois ergueu a coluna da esquerda e lhe deu o nome de Boaz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jaquim e Boaz são formas portuguesas tradicionais dos nomes hebraicos das colunas, não traduções de seus possíveis significados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ergueu
  rationale: No hifil, קום significa fazer ficar de pé, levantar ou instalar. “Ergueu” é natural no contexto arquitetônico e mantém a repetição do hebraico.
- source_word: הָעַמֻּדִים
  choice: as colunas
  rationale: עַמּוּד designa colunas ou pilares. “Colunas” é claro e corrente para os elementos monumentais do pórtico.
- source_word: לְאֻלָם הַהֵיכָל
  choice: no pórtico do templo
  rationale: אוּלָם é o pórtico ou vestíbulo frontal; הֵיכָל refere-se aqui ao edifício do templo. A preposição לְ tem valor locativo no contexto.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: a coluna da direita
  rationale: יְמָנִי significa literalmente “do lado direito”. A tradução preserva a orientação espacial sem convertê-la em direção geográfica.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: lhe deu o nome de
  rationale: A expressão hebraica é literalmente “chamou o seu nome”. A formulação escolhida reproduz naturalmente em português o ato de nomear.
- source_word: יָכִין
  choice: Jaquim
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecível em português, sem traduzir seu possível significado.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: a coluna da esquerda
  rationale: שְׂמָאלִי significa “do lado esquerdo”; a expressão forma um paralelo natural com “a coluna da direita”.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Nome próprio transliterado na forma consagrada em português, sem traduzir seu possível significado.
