base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/022.yaml
  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: pt
  text: No topo das colunas havia ornamentação em forma de lírio[a], e o trabalho das colunas foi concluído.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ornamentação de lírios”, “ornamentação com desenho de lírios” ou, possivelmente, “ornamentação em forma de lótus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a execução das colunas foi concluída”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: alto
  rationale: No contexto arquitetônico, indica a parte superior das colunas. “Alto” é natural em português e evita especificar além do texto o termo técnico “capitel”.
- source_word: הָעַמּוּדִים
  choice: as colunas
  rationale: עַמּוּדִים designa pilares ou colunas. “Colunas” é claro e apropriado à descrição arquitetônica do templo.
- source_word: מַעֲשֵׂה
  choice: ornamentação
  rationale: Embora o termo signifique amplamente “obra” ou “trabalho”, aqui designa o elemento decorativo em forma de lírio; “ornamentação” comunica esse sentido de modo natural.
- source_word: שׁוֹשָׁן
  choice: lírio
  rationale: O termo normalmente designa o lírio e, neste contexto, descreve a forma do elemento ornamental. A possível identificação como lótus não é imposta ao texto.
- source_word: וַתִּתֹּם
  choice: ficou concluído
  rationale: O verbo תמם exprime conclusão. A formulação passiva é idiomática em português e mantém o sentido de que a obra chegou ao fim.
- source_word: מְלֶאכֶת
  choice: o trabalho
  rationale: מְלָאכָה pode indicar trabalho, obra ou execução artesanal. “O trabalho das colunas” preserva a amplitude da expressão hebraica.
