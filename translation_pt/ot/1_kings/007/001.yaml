base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/001.yaml
  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: pt
  text: Salomão levou treze anos para construir sua própria casa[a] e a terminou por completo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu palácio”. Neste contexto, a palavra hebraica traduzida como “casa” pode designar uma residência real ou um complexo palaciano.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: sua própria casa
  rationale: בַּיִת significa normalmente “casa”, mas, em contexto régio, pode designar uma residência real ou um complexo palaciano. “Própria” expressa naturalmente o contraste com a construção do templo no contexto anterior.
- source_word: בָּנָה
  choice: levou treze anos para construir
  rationale: O Qal perfeito descreve a construção como fato concluído; integrado à expressão temporal, esta formulação é natural em português e deixa claro que os treze anos correspondem à duração da obra.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: treze anos
  rationale: A expressão indica a duração do projeto de construção.
- source_word: וַיְכַל
  choice: a terminou
  rationale: A forma narrativa de כלה faz a ação avançar e indica que Salomão concluiu a obra.
- source_word: כָּל בֵּיתוֹ
  choice: por completo
  rationale: כָּל assinala a totalidade da casa ou complexo. Em português, “a terminou por completo” evita a construção pouco natural “terminou toda a sua casa”, sem perder a ideia de conclusão integral.
- source_word: וְאֶת
  choice: '[contraste expresso por “sua própria casa”]'
  rationale: A conjunção com o marcador de objeto introduz um tópico relacionado, mas contrastante com o templo. Em português, esse valor discursivo é comunicado naturalmente por “sua própria casa”.
