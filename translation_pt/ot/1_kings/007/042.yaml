  text: וְ/אֶת הָ/רִמֹּנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנֵֽי טוּרִ֤ים רִמֹּנִים֙ לַ/שְּׂבָכָ֣ה הָֽ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: pt
  text: e as quatrocentas romãs para as duas treliças[a], duas fileiras de romãs para cada treliça, a fim de cobrir as duas partes arredondadas dos capitéis[b] que ficavam no alto das colunas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “redes ornamentais”. O termo hebraico designa uma obra aberta, semelhante a uma rede, nos capitéis.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as duas taças dos capitéis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: romãs
  rationale: O substantivo designa literalmente romãs; no contexto, são elementos ornamentais, mas a tradução preserva o termo concreto do hebraico.
- source_word: שְׂבָכוֹת
  choice: treliças
  rationale: O termo se refere a uma obra ornamental aberta, semelhante a uma rede; “treliças” é claro e natural em português.
- source_word: טוּרִים
  choice: fileiras
  rationale: Expressa a disposição ordenada das romãs em duas fileiras.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: para cada treliça
  rationale: Embora literalmente diga “para a treliça uma”, a construção tem sentido distributivo no contexto das duas treliças.
- source_word: לְכַסּוֹת
  choice: a fim de cobrir
  rationale: O infinitivo indica a finalidade das fileiras de romãs.
- source_word: גֻּלֹּת הַכֹּתָרֹת
  choice: partes arredondadas dos capitéis
  rationale: גֻּלֹּת descreve formas arredondadas, semelhantes a taças; esta formulação comunica a imagem arquitetônica sem identificar as formas inteiras com os capitéis.
- source_word: כֹּתָרֹת
  choice: capitéis
  rationale: No contexto arquitetônico, refere-se às peças ornamentais no topo das colunas.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: no alto das colunas
  rationale: A expressão indica a posição dos capitéis sobre as colunas; “no alto” comunica naturalmente essa relação espacial.
