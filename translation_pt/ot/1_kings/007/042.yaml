  source_fidelity: 'A tradução preserva os elementos e a sintaxe distributiva do hebraico: quatrocentas romãs, duas treliças, duas fileiras para cada treliça e a finalidade de cobrir as duas formas arredondadas associadas aos capitéis. “No alto das colunas” comunica adequadamente a localização arquitetônica de עַל־פְּנֵי הָעַמּוּדִים.'
