  text: וּ/מַֽעֲשֵׂה֙ הָ/א֣וֹפַנִּ֔ים כְּ/מַעֲשֵׂ֖ה אוֹפַ֣ן הַ/מֶּרְכָּבָ֑ה יְדוֹתָ֣/ם וְ/גַבֵּי/הֶ֗ם וְ/חִשֻּׁקֵי/הֶ֛ם וְ/חִשֻּׁרֵי/הֶ֖ם הַ/כֹּ֥ל מוּצָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: pt
  text: 'A construção das rodas era como a de uma roda de carro de guerra: seus eixos, aros, raios e cubos[a] eram todos de metal fundido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos para algumas dessas peças são raros, e seu sentido técnico exato é incerto. “Eixos” também pode ser entendido como “suportes”; “raios”, como “faixas”; e “cubos”, como “encaixes” ou “travessas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: construção
  rationale: No contexto, designa a forma ou o modo de fabricação das rodas; “construção” é claro e natural em português.
- source_word: הָאֹפַנִּים / אוֹפַן
  choice: rodas / roda
  rationale: É o sentido comum do termo neste contexto técnico, preservando o plural inicial e o singular na comparação.
- source_word: כְּמַעֲשֵׂה
  choice: era como a de
  rationale: Preserva a comparação marcada por כְּ e evita a repetição pouco natural de “construção”.
- source_word: הַמֶּרְכָּבָה
  choice: carro de guerra
  rationale: Expressa o veículo antigo designado pelo hebraico e evita a associação moderna de “carro” com automóvel.
- source_word: יְדוֹתָם
  choice: eixos
  rationale: Embora o termo se relacione literalmente a “mãos” e possa indicar peças de apoio, “eixos” se ajusta melhor à enumeração das partes das rodas.
- source_word: גַבֵּיהֶם
  choice: aros
  rationale: Neste contexto de rodas, refere-se provavelmente à parte externa elevada; “aros” é a designação moderna e acessível.
- source_word: חִשֻּׁקֵיהֶם
  choice: raios
  rationale: O termo raro parece designar elementos que ligam o centro à parte externa da roda; “raios” comunica essa inferência com clareza.
- source_word: חִשֻּׁרֵיהֶם
  choice: cubos
  rationale: Provavelmente designa as peças centrais das rodas; “cubos” é o termo técnico corrente em português.
- source_word: הַכֹּל מוּצָק
  choice: eram todos de metal fundido
  rationale: Comunica de modo natural que todas as partes enumeradas foram produzidas por fundição, deixando explícito o sentido material implícito em מוּצָק.
