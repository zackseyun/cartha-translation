lexical_decisions:
- source_word: פְּתָחִים
  choice: entradas
  rationale: O termo designa aberturas ou acessos; «entradas» é natural no contexto arquitetônico e não sugere folhas móveis de portas.
- source_word: מְּזוּזוֹת
  choice: ombreiras
  rationale: Refere-se aos elementos laterais de uma porta ou abertura; «ombreiras» é o termo arquitetônico preciso em português.
- source_word: רְבֻעִים
  choice: quadradas
  rationale: Indica formato de quatro lados ou cantos; «quadradas» expressa de modo conciso a forma descrita.
- source_word: שָׁקֶף
  choice: molduras
  rationale: É um termo arquitetônico de sentido incerto, possivelmente referente à parte superior da armação ou ao lintel. «Molduras» comunica a estrutura sem restringi-la indevidamente à peça superior.
- source_word: מוּל מֶחֱזָה אֶל מֶחֱזָה
  choice: uma janela ficava diante de outra
  rationale: מוּל indica correspondência ou posição oposta, e מֶחֱזָה provavelmente designa uma janela ou abertura de visão neste contexto.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: em três níveis
  rationale: Literalmente, «três vezes»; no contexto da descrição do edifício, a expressão provavelmente indica a repetição vertical do arranjo em três níveis.
