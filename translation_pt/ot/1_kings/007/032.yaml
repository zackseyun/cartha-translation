base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: pt
  text: E as quatro rodas estavam debaixo dos painéis[a], e os eixos das rodas estavam na base[b]. A altura de cada roda era de um côvado e meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “molduras” ou “bordas”; o termo hebraico מִסְגְּרוֹת pode designar as estruturas emolduradas ou as seções laterais da base.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “as mãos das rodas”; neste contexto, a expressão provavelmente se refere aos eixos ou às hastes que sustentavam as rodas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: rodas / roda
  rationale: O termo designa rodas literais ligadas à base de bronze; “roda(s)” é o equivalente natural em português.
- source_word: לְמִתַּחַת
  choice: debaixo de
  rationale: Expressa claramente a posição inferior das rodas em relação aos painéis.
- source_word: הַמִּסְגְּרוֹת
  choice: os painéis
  rationale: No contexto artesanal, refere-se às seções laterais emolduradas da base. “Painéis” é claro e natural, embora “molduras” ou “bordas” também sejam possíveis.
- source_word: וִידוֹת
  choice: os eixos
  rationale: Embora o substantivo signifique literalmente “mãos”, neste contexto mecânico indica as peças salientes que prendiam ou sustentavam as rodas.
- source_word: בַּמְּכוֹנָה
  choice: estavam presos à base
  rationale: מְכוֹנָה designa a estrutura móvel de bronze; a formulação explicita naturalmente em português que os eixos pertenciam ou estavam fixados a ela, sem alterar a relação mecânica indicada pelo hebraico.
- source_word: קוֹמַת
  choice: a altura de
  rationale: Introduz a medida vertical da roda.
- source_word: הָאֶחָד
  choice: cada
  rationale: O singular definido tem aqui valor distributivo; “cada roda” comunica esse sentido de modo idiomático.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: um côvado e meio
  rationale: Mantém a unidade antiga do texto e emprega sua forma consagrada e inteligível em português.
