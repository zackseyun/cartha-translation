base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: pt
  text: Fez dez bacias de bronze. Cada bacia comportava quarenta batos[a] e media quatro côvados[b]. Sobre cada uma das dez bases havia uma bacia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O bato era uma unidade hebraica de capacidade para líquidos.
    reason: cultural_note
  - marker: b
    text: 'O hebraico diz apenas: «quatro côvados»; provavelmente se refere à medida de uma borda à outra, isto é, ao diâmetro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: bacias
  rationale: Designa grandes recipientes usados nas instalações do templo. “Bacias” é claro e atual; “lavatórios” poderia sugerir uma instalação moderna.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos utensílios do templo, a tradução convencional e provável para o metal ou liga é “bronze”.
- source_word: בַּת
  choice: batos
  rationale: Mantém a unidade hebraica de capacidade, evitando uma conversão moderna falsamente precisa; a nota explica o termo.
- source_word: יָכִיל
  choice: comportava
  rationale: O verbo expressa capacidade; “comportava” transmite isso com naturalidade em português.
- source_word: אַרְבַּע בָּאַמָּה
  choice: media quatro côvados de uma borda à outra
  rationale: O hebraico diz literalmente apenas “quatro côvados”, mas o contexto requer uma dimensão da bacia. “De uma borda à outra” comunica a provável medida transversal sem impor o termo geométrico técnico “diâmetro”.
- source_word: מְכוֹנָה
  choice: bases
  rationale: Refere-se às estruturas móveis de sustentação descritas no contexto. “Bases” exprime sua função e corresponde bem ao uso arquitetônico em português.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: Sobre cada uma das dez bases havia uma bacia
  rationale: 'Torna explícito, em português natural, o valor distributivo da construção hebraica: uma bacia para cada base.'
