  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: pt
  text: 'E esta era a estrutura do suporte: ele tinha molduras[a], e havia molduras entre as travessas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «painéis»; o termo hebraico pode designar seções emolduradas do suporte.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser entendido como «montantes», «barras» ou «trilhos»; não se sabe ao certo qual era o elemento estrutural referido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: E esta
  rationale: Mantém a continuidade discursiva da conjunção hebraica e introduz naturalmente a descrição.
- source_word: מַעֲשֵׂה
  choice: estrutura
  rationale: No contexto arquitetônico, designa a forma construída ou configuração do objeto; «estrutura» é clara e natural em português.
- source_word: הַמְּכוֹנָה
  choice: o suporte
  rationale: Designa a base móvel destinada às bacias. «Suporte» comunica sua função sem pressupor detalhes além do contexto.
- source_word: מִסְגְּרֹת
  choice: painéis
  rationale: O termo parece indicar seções enquadradas nas laterais do suporte. «Painéis» oferece uma descrição compreensível, mantendo «molduras» como alternativa em nota.
- source_word: לָהֶם
  choice: ele tinha
  rationale: A construção preposicional expressa posse. O pronome singular concorda naturalmente com «o suporte», embora o sufixo hebraico seja formalmente plural, possivelmente por referência distributiva aos suportes descritos no conjunto.
- source_word: וּמִסְגְּרֹת
  choice: e havia painéis
  rationale: Repete o substantivo, como no hebraico, e acrescenta «havia» para produzir uma frase portuguesa natural.
- source_word: בֵּין
  choice: entre
  rationale: Expressa diretamente a posição espacial dos painéis em relação aos elementos estruturais.
- source_word: הַשְׁלַבִּים
  choice: as travessas
  rationale: O substantivo indica elementos estruturais de ligação. «Travessas» é arquitetonicamente plausível e inteligível, mas a identificação exata permanece incerta e é registrada em nota.
