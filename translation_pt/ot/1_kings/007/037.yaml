lexical_decisions:
- source_word: כָּזֹאת
  choice: Assim
  rationale: Retoma de modo conciso o projeto e o trabalho descritos anteriormente, preservando a força demonstrativa do hebraico.
- source_word: עָשָׂה
  choice: ele fez
  rationale: Tradução direta e natural no contexto de fabricação artesanal.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: os dez suportes
  rationale: Neste contexto, מְכֹנוֹת designa as estruturas móveis que sustentavam as bacias; “suportes” comunica sua função sem reduzi-las simplesmente a carros.
- source_word: מוּצָק אֶחָד
  choice: todos tinham a mesma fundição
  rationale: מוּצָק pertence ao campo da metalurgia e indica trabalho de metal fundido; a formulação portuguesa explicita que a uniformidade se aplica aos dez suportes.
- source_word: מִדָּה אַחַת
  choice: as mesmas medidas
  rationale: Embora literalmente seja “uma medida”, o plural idiomático em português comunica que os objetos tinham dimensões idênticas.
- source_word: קֶצֶב אֶחָד
  choice: a mesma forma
  rationale: קֶצֶב pode indicar forma, padrão ou proporção; “forma” mantém a concisão sem definir em excesso o aspecto técnico exato.
- source_word: לְכֻלָּהְנָה
  choice: todos tinham
  rationale: Integra naturalmente em português a aplicação distributiva das três características a todos os dez suportes.
