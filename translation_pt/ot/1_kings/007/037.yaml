  footnotes:
  - marker: a
    text: 'Ou: “uma mesma obra fundida, uma mesma medida e uma mesma forma para todos eles”. O hebraico emprega três expressões breves e paralelas para enfatizar que os dez suportes foram feitos segundo as mesmas especificações.'
