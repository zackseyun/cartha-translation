base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/036.yaml
  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: pt
  text: Nos painéis dos seus suportes e nas suas molduras, ele gravou querubins, leões e palmeiras, conforme o espaço disponível para cada figura,[a] com grinaldas[b] ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico de sentido incerto; outra tradução possível é: “dispostos cada um em seu espaço”. A expressão provavelmente descreve como os entalhes foram distribuídos de acordo com o espaço disponível.'
    reason: lexical_alternative
  - marker: b
    text: Ou “festões”. O termo hebraico provavelmente se refere a ornamentos decorativos que circundavam as figuras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: ele gravou
  rationale: No contexto de ornamentação artesanal, o verbo indica entalhar ou incisar figuras; “gravou” comunica isso de modo natural.
- source_word: הַלֻּחֹת
  choice: os painéis
  rationale: Aqui o substantivo designa superfícies estruturais decoradas, e não tábuas de escrita.
- source_word: יְדֹתֶיהָ
  choice: seus suportes
  rationale: Embora signifique literalmente “suas mãos”, neste contexto arquitetônico refere-se provavelmente a peças laterais ou salientes de sustentação.
- source_word: מַסְגְּרֹתֶיהָ
  choice: suas molduras
  rationale: O termo designa elementos delimitadores que emolduravam os painéis; “molduras” é claro no contexto artesanal.
- source_word: כְּרוּבִים
  choice: querubins
  rationale: Mantém a designação tradicional dos seres guardiões associados à presença e ao trono divinos, sem introduzir a imagem popular de anjos infantis.
- source_word: אֲרָיוֹת
  choice: leões
  rationale: Equivalente direto para as figuras animais gravadas.
- source_word: תִמֹרֹת
  choice: palmeiras
  rationale: No contexto da decoração do templo, refere-se a motivos em forma de palmeira.
- source_word: כְּמַעַר אִישׁ
  choice: conforme o espaço disponível para cada figura
  rationale: A expressão hebraica é difícil; esta tradução expressa a interpretação provável de que os motivos eram distribuídos segundo o espaço disponível, sem ocultar a incerteza, registrada em nota.
- source_word: לֹיֹת
  choice: grinaldas
  rationale: O substantivo raro parece indicar ornamentos curvos ou festões; “grinaldas” é uma equivalência adequada, com alternativa em nota.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa de modo natural a disposição circundante dos ornamentos.
