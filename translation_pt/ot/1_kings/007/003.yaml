  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: pt
  text: 'O edifício era revestido de cedro na parte superior[a], sobre as estruturas laterais que estavam sobre as colunas: quarenta e cinco ao todo, quinze em cada fileira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Era revestido de cedro acima, sobre as estruturas laterais que estavam sobre as colunas”. Os termos arquitetônicos hebraicos são difíceis; צְלָעוֹת pode significar “lados”, “nervuras”, “câmaras laterais” ou “estruturas laterais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: O teto foi revestido
  rationale: O particípio passivo de ספן indica cobertura ou revestimento. O sujeito não é expresso no hebraico; no contexto arquitetônico e em ligação com מִמַּעַל, explicitar “o teto” produz uma frase portuguesa natural, sem excluir a ideia mais geral de cobertura indicada na nota.
- source_word: בָּאֶרֶז
  choice: de cedro
  rationale: A preposição ב marca o material empregado; “revestido de cedro” é a construção idiomática em português.
- source_word: מִמַּעַל
  choice: por cima
  rationale: Preserva o sentido locativo da parte superior da estrutura e se integra naturalmente à descrição do teto.
- source_word: עַל הַצְּלָעוֹת
  choice: sobre as estruturas laterais
  rationale: צלעות pode designar lados, vigas, nervuras, câmaras ou outras estruturas laterais. “Estruturas laterais” mantém a necessária cautela diante da terminologia arquitetônica incerta.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: apoiadas nas colunas
  rationale: Exprime de modo natural a relação estrutural indicada por עַל, embora o hebraico diga mais literalmente “que estavam sobre as colunas”.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: quarenta e cinco ao todo
  rationale: O numeral apresenta o total dos elementos mencionados; “ao todo” esclarece sua relação com as três fileiras de quinze.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: quinze em cada fileira
  rationale: 'טוּר significa fileira ou carreira. A formulação comunica naturalmente a distribuição: quarenta e cinco elementos, quinze por fileira.'
