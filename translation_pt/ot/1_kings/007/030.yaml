revisions:
- from: Cada base tinha quatro rodas de bronze e eixos de bronze. Nos seus quatro cantos havia suportes; debaixo da bacia, esses suportes eram fundidos, cada um ao lado de uma grinalda.[a]
  to: Cada uma das bases tinha quatro rodas de bronze e eixos de bronze; seus quatro cantos tinham suportes. Debaixo da bacia, os suportes eram fundidos, cada um ao lado de elementos decorativos.[a]
  rationale: A revisão mantém as opções lexicais seguras do rascunho, torna mais direta a relação dos suportes com os quatro pontos estruturais e evita singularizar o termo hebraico raro לֹיוֹת. A expressão genérica “elementos decorativos”, esclarecida pela nota, preserva a incerteza lexical sem impor uma reconstrução ornamental específica.
  reviewer_model: gpt-5.6-terra
