  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: pt
  text: Cada uma das bases tinha quatro rodas de bronze e eixos de bronze; seus quatro cantos tinham suportes. Debaixo da bacia, os suportes eram fundidos, cada um ao lado de elementos decorativos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e pode indicar grinaldas, guirlandas ou festões decorativos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: rodas de bronze
  rationale: אוֹפַנִּים designa rodas; no contexto dos utensílios do templo, נְחֹשֶׁת é tradicional e plausivelmente entendido como bronze.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: cada base
  rationale: מְכוֹנָה é a estrutura móvel que sustenta a bacia. A construção com numeral descreve cada unidade individual; em português, 'cada base' transmite isso com naturalidade.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: eixos de bronze
  rationale: No contexto imediato das rodas, סַרְנִים provavelmente designa os componentes que funcionavam como eixos.
- source_word: פַעֲמֹתָיו
  choice: seus quatro cantos
  rationale: Embora o termo possa significar 'pés' ou 'passos', aqui parece indicar quatro pontos estruturais da base; 'cantos' produz uma descrição coerente sem sugerir pés independentes.
- source_word: כְּתֵפֹת
  choice: suportes
  rationale: Literalmente 'ombros'; na descrição arquitetônica, refere-se provavelmente a peças salientes que sustentavam a bacia.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: debaixo da bacia
  rationale: Preserva a relação espacial, e 'bacia' é uma designação moderna e clara para כִּיּוֹר.
- source_word: יְצֻקוֹת
  choice: eram fundidos
  rationale: Forma passiva de יצק em contexto de metalurgia, indicando peças produzidas por fundição.
- source_word: מֵעֵבֶר אִישׁ
  choice: cada um ao lado de
  rationale: A expressão distribui os suportes individualmente em relação ao elemento decorativo, sem definir com segurança uma geometria mais precisa.
- source_word: לֹיוֹת
  choice: grinalda
  rationale: Termo raro, provavelmente referente a ornamentação semelhante a guirlandas ou festões; 'grinalda' conserva esse provável sentido decorativo.
