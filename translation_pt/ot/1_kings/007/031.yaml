base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: pt
  text: A abertura[a] se projetava um côvado para cima, de dentro do capitel. Ela era redonda, como obra de um pedestal[b], e media um côvado e meio. Também havia entalhes[c] sobre a abertura, e seus painéis eram quadrados, não redondos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “boca”; o hebraico emprega uma metáfora arquitetônica para a abertura.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é tecnicamente difícil; outras traduções possíveis são “trabalho de um suporte” ou “feita como uma base”.
    reason: lexical_alternative
  - marker: c
    text: Ou “trabalho gravado”, “grinaldas” ou “guirlandas”; o tipo exato de decoração é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: abertura
  rationale: No contexto arquitetônico, פֶּה é uma metáfora para a boca ou abertura da estrutura; “abertura” é natural e preserva a referência espacial.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: de dentro do capitel
  rationale: A expressão indica procedência ou posição a partir do interior do elemento superior chamado capitel.
- source_word: וָמַעְלָה בָּאַמָּה
  choice: se projetava um côvado para cima
  rationale: O hebraico exprime extensão ascendente de um côvado sem explicitar um verbo; “se projetava” fornece em português a ideia verbal exigida pelo contexto.
- source_word: עָגֹל
  choice: redonda
  rationale: Representa diretamente a forma circular descrita no hebraico.
- source_word: מַעֲשֵׂה כֵן
  choice: obra semelhante à de um pedestal
  rationale: Mantém a construção técnica e difícil do hebraico, entendendo כֵּן como pedestal, base ou suporte, sem transformar a comparação em identificação inequívoca.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: media um côvado e meio
  rationale: Acréscimo verbal mínimo e natural para introduzir a dimensão dada no texto.
- source_word: מִקְלָעוֹת
  choice: entalhes
  rationale: O termo designa decoração trabalhada ou gravada, mas o motivo exato é incerto; “entalhes” evita especificar guirlandas ou grinaldas.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: seus painéis
  rationale: Nas descrições do mobiliário do templo, o termo pode indicar seções emolduradas ou painéis; a forma quadrada favorece “painéis”.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: eram quadrados, não redondos
  rationale: Reproduz de modo direto o contraste explícito entre formas quadradas e redondas.
