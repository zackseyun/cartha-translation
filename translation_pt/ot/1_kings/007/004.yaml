  rationale: O termo designa aberturas emolduradas ou caixilhos; no contexto arquitetônico, «molduras de janelas» preserva melhor o sentido estrutural do que simplesmente «janelas».
- source_word: שְׁלֹשָׁה טוּרִים
  choice: três fileiras
  rationale: טוּר indica uma sequência ou disposição em linha; «três fileiras» é uma expressão arquitetônica natural e mantém a forma do hebraico.
- source_word: מֶחֱזָה
  choice: janela
  rationale: O vocábulo se refere a uma abertura para visão ou luz; «janela» é claro e adequado no contexto.
- source_word: אֶל מֶחֱזָה
  choice: em frente a outra
  rationale: A construção indica correspondência ou orientação entre as janelas; a formulação portuguesa comunica que uma janela ficava defronte da outra.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: três vezes
  rationale: Esta é a tradução formal da expressão hebraica e evita decidir no texto principal se ela descreve especificamente três níveis.
