base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: pt
  text: Sua casa, onde ele moraria[a], ficava no outro pátio, mais para dentro, além do Salão, e tinha o mesmo tipo de construção. Salomão também fez para a filha do faraó[b], com quem havia se casado, uma casa semelhante a esse Salão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficava em outro pátio, mais para dentro, depois do Salão”. A expressão espacial hebraica é difícil, e as traduções divergem quanto à posição da residência em relação ao Salão.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “a quem Salomão havia tomado”, isto é, tomado por esposa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: Sua casa
  rationale: O substantivo com sufixo possessivo introduz a residência de Salomão; a conjunção é absorvida naturalmente no fluxo em português.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: onde ele moraria
  rationale: יָשַׁב pode significar sentar-se, habitar ou morar. Neste contexto arquitetônico, indica a finalidade residencial prevista.
- source_word: חָצֵר הָאַחֶרֶת
  choice: no outro pátio
  rationale: חָצֵר designa um pátio; o artigo aponta para um pátio específico distinto no complexo.
- source_word: מִבֵּית לָאוּלָם
  choice: mais para dentro, além do Salão
  rationale: A expressão espacial hebraica é difícil. A tradução comunica uma localização interior ou posterior em relação ao Salão sem impor uma reconstrução arquitetônica excessivamente precisa.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: tinha o mesmo tipo de construção
  rationale: מַעֲשֶׂה se refere aqui à obra, ao modo de execução ou à construção; a formulação preserva a comparação com a estrutura já descrita.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: Salomão também fez ... uma casa
  rationale: O yiqtol funciona como continuação descritiva da narrativa de construção; o sujeito é explicitado em português para evitar ambiguidade.
- source_word: לְבַת פַּרְעֹה
  choice: para a filha do faraó
  rationale: Tradução direta da relação construta e natural em português.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: com quem havia se casado
  rationale: Literalmente, 'a quem Salomão tomou'; com uma mulher como objeto, לָקַח frequentemente expressa tomá-la em casamento. A nota preserva a forma literal.
- source_word: כָּאוּלָם הַזֶּה
  choice: semelhante a esse Salão
  rationale: אוּלָם pode ser vestíbulo, pórtico ou salão. Neste complexo palaciano, 'Salão' comunica uma estrutura substancial e mantém coerência com o contexto.
