  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: pt
  text: Salomão deixou todos os utensílios sem os pesar, porque eram muitíssimos[a]; o peso do bronze não foi determinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Salomão deixou todos os utensílios, porque eram muitíssimos; o peso do bronze não foi investigado nem apurado”.'
    reason: Alternativa lexical que preserva uma tradução menos explícita de וַיַּנַּח e o sentido mais literal de לֹא נֶחְקַר.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: deixou ... sem pesar
  rationale: O verbo indica que Salomão deixou de prosseguir com determinada ação; a oração seguinte esclarece que o peso não foi apurado. A formulação torna explícito, de modo natural, o que ficou por fazer.
- source_word: כָּל הַכֵּלִים
  choice: todos os utensílios
  rationale: כֵּלִים é um termo amplo para objetos, instrumentos ou utensílios. No contexto dos objetos do templo, “utensílios” é claro e concreto em português.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: porque eram muitíssimos
  rationale: מִן com רֹב expressa causa ligada à enorme quantidade, e a repetição de מְאֹד produz forte intensificação. “Muitíssimos” preserva a ênfase com concisão.
- source_word: לֹא נֶחְקַר
  choice: não foi determinado
  rationale: O nifal de חקר indica que algo não foi apurado ou determinado. Referindo-se ao peso, a expressão comunica que não se chegou a uma medida final.
- source_word: מִשְׁקַל
  choice: o peso
  rationale: O substantivo designa o peso ou a quantidade medida pelo peso; “o peso” é o equivalente mais direto.
- source_word: הַנְּחֹשֶׁת
  choice: do bronze
  rationale: No contexto dos utensílios do templo, נְחֹשֶׁת é convencionalmente entendido como bronze, em vez de cobre puro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A tradução principal explicita pelo contexto que os utensílios foram deixados sem pesar, enquanto a nota preserva a ambiguidade lexical do hebraico.
