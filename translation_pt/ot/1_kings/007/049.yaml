  text: וְ/אֶת הַ֠/מְּנֹרוֹת חָמֵ֨שׁ מִ/יָּמִ֜ין וְ/חָמֵ֧שׁ מִ/שְּׂמֹ֛אול לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֣ב סָג֑וּר וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּרֹ֛ת וְ/הַ/מֶּלְקַחַ֖יִם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: pt
  text: e os lampadários, cinco à direita e cinco à esquerda, diante do santuário interno[a], de ouro puro[b]; e as flores, as lâmpadas e as tenazes[c], de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do Lugar Santíssimo”. O termo hebraico דְּבִיר refere-se ao recinto mais interior do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “ouro refinado”.
    reason: lexical_alternative
  - marker: c
    text: Ou “apagadores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: lampadários
  rationale: Designa suportes para lâmpadas a óleo, não as lâmpadas individuais. “Lampadários” evita sugerir velas e mantém uma expressão natural no contexto do templo.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: à direita ... à esquerda
  rationale: Preserva a linguagem espacial relativa do hebraico sem convertê-la interpretativamente em “ao sul ... ao norte”.
- source_word: לִפְנֵי הַדְּבִיר
  choice: diante do santuário interno
  rationale: דְּבִיר designa o recinto mais interior do templo. A tradução é clara e não depende de uma designação técnica posterior.
- source_word: זָהָב סָגוּר
  choice: de ouro puro
  rationale: A expressão indica ouro de alta qualidade ou refinado; “ouro puro” comunica esse sentido de modo idiomático.
- source_word: הַפֶּרַח
  choice: as flores
  rationale: Embora a forma hebraica seja singular, ela funciona aqui coletivamente e se refere aos elementos ornamentais em forma de flor dos lampadários.
- source_word: הַנֵּרֹת
  choice: as lâmpadas
  rationale: Refere-se às lâmpadas individuais colocadas nos lampadários.
- source_word: הַמֶּלְקַחַיִם
  choice: as tenazes
  rationale: É o equivalente lexical direto para o utensílio usado no cuidado das lâmpadas; “apagadores” explicitaria uma função possível, mas menos certa.
- source_word: זָהָב
  choice: de ouro
  rationale: Mantém a construção nominal e o estilo de inventário, aplicando o material às flores, às lâmpadas e às tenazes.
theological_decisions: []
