  text: בְּ/כִכַּ֤ר הַ/יַּרְדֵּן֙ יְצָקָ֣/ם הַ/מֶּ֔לֶךְ בְּ/מַעֲבֵ֖ה הָ/אֲדָמָ֑ה בֵּ֥ין סֻכּ֖וֹת וּ/בֵ֥ין צָרְתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: pt
  text: Na planície do Jordão[a], o rei os fundiu[b], em solo argiloso[c], entre Sucote e Zaretã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no vale do Jordão”. O hebraico se refere literalmente à região ou planície do Jordão.
    reason: lexical_alternative
  - marker: b
    text: Ou “os derramou”; o verbo se refere aqui à fundição de objetos de metal.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “na espessura da terra”, provavelmente uma referência a solo denso e argiloso, apropriado para a fundição.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: Na planície do Jordão
  rationale: Em contexto geográfico, כִּכָּר designa a região plana do Jordão. “Planície do Jordão” conserva a imagem do hebraico e é natural em português; “vale do Jordão” seria possível, mas um pouco mais interpretativo.
- source_word: יְצָקָם
  choice: os fundiu
  rationale: יצק pode significar derramar ou fundir metal. No contexto dos utensílios de bronze, “fundiu” expressa de modo idiomático a fabricação por fundição; o pronome “os” representa o sufixo masculino plural e retoma os objetos mencionados no contexto.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O hebraico traz o substantivo comum definido, não o nome próprio. “O rei” preserva essa forma, deixando que o contexto identifique Salomão.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: em solo argiloso
  rationale: מַעֲבֶה indica espessura ou densidade; nesta construção, provavelmente se refere a terra compacta e argilosa adequada à confecção de moldes. “Solo argiloso” comunica o sentido contextual sem transformar a inferência em detalhe técnico explícito.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: entre Sucote e Zaretã
  rationale: Os topônimos são transliterados em formas correntes e legíveis em português, próximas aos nomes hebraicos סֻכּוֹת e צָרְתָן.
