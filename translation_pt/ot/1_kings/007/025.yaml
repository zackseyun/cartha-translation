  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: pt
  text: 'Ele ficava sobre doze bois: três voltados para o norte, três voltados para o oeste[a], três voltados para o sul e três voltados para o leste. O Mar estava sobre eles, por cima, e todas as suas partes traseiras estavam voltadas para dentro[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, «oeste» é literalmente «em direção ao mar», maneira bíblica comum de indicar o oeste.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «todos os seus quartos traseiros ficavam voltados para o interior».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: ficava
  rationale: O particípio qal tem função predicativa e descreve a posição do Mar mencionado no versículo anterior; «ficava» é natural em uma descrição arquitetônica no passado.
- source_word: בָּקָר
  choice: bois
  rationale: O substantivo designa bovinos; no contexto, são as doze figuras bovinas que sustentavam o grande recipiente. «Bois» preserva a formulação tradicional sem especificar além do hebraico.
- source_word: פֹנִים
  choice: voltados para
  rationale: Embora ligado literalmente a «faces», o particípio descreve a orientação das figuras e se traduz naturalmente por «voltados para».
- source_word: צָפוֹנָה / יָמָּה / נֶגְבָּה / מִזְרָחָה
  choice: norte / oeste / sul / leste
  rationale: As formas direcionais indicam os quatro pontos cardeais. No caso de יָמָּה, «oeste» comunica o valor direcional idiomático, enquanto a nota preserva a imagem literal associada ao mar.
- source_word: הַיָּם
  choice: o Mar
  rationale: No contexto, é a designação do grande recipiente de bronze do templo; a inicial maiúscula sinaliza esse uso específico sem substituir a imagem hebraica por «bacia».
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: estava sobre eles, por cima
  rationale: A formulação mantém os dois elementos espaciais do hebraico, sem acrescentar explicitamente um verbo como «apoiava-se» ou «fora colocado».
- source_word: אֲחֹרֵיהֶם
  choice: toda a parte traseira deles
  rationale: Traduz de modo claro e digno as partes posteriores das figuras bovinas, preservando o coletivo hebraico sem optar pela expressão mais anatômica «quartos traseiros».
- source_word: בָּיְתָה
  choice: voltada para dentro
  rationale: A forma direcional indica orientação para o interior, isto é, para o centro sob o Mar.
theological_decisions: []
