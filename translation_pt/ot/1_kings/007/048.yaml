source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: pt
  text: 'Salomão fez todos os utensílios que havia na casa de Yahweh: o altar de ouro e a mesa de ouro sobre a qual ficava o pão da Presença[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamado tradicionalmente de “pães da proposição”. Literalmente, “pão da Presença”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה é amplo, com o sentido de fazer ou produzir; “fez” é natural e não acrescenta uma especificidade artesanal ausente do hebraico.
- source_word: כָּל הַכֵּלִים
  choice: todos os utensílios
  rationale: כֵּלִים designa objetos, utensílios ou peças; no inventário do templo, “utensílios” é claro e preserva o sentido material e cultual.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de YHWH” e representa diretamente o nome divino, sem substituí-lo por um título.
- source_word: מִזְבַּח הַזָּהָב
  choice: altar de ouro
  rationale: Tradução direta e idiomática da construção hebraica, sem decidir além do texto se era inteiramente feito de ouro ou revestido dele.
- source_word: הַשֻּׁלְחָן אֲשֶׁר עָלָיו
  choice: a mesa ... sobre a qual ficava
  rationale: “Sobre a qual ficava” expressa com naturalidade a relação locativa e a disposição habitual do pão.
- source_word: לֶחֶם הַפָּנִים
  choice: pão da Presença
  rationale: Preserva de modo transparente o termo cultual hebraico ligado à presença divina, em vez de recorrer a uma designação tradicional menos imediatamente compreensível.
- source_word: זָהָב
  choice: mesa de ouro
  rationale: O זָהָב final qualifica naturalmente a mesa. Antecipá-lo para junto de “mesa” produz português claro e evita a leitura absurda de que o pão seria de ouro.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio da aliança, não o título אֲדֹנָי; “Yahweh” o representa diretamente.
- issue: Sentido cultual de לֶחֶם הַפָּנִים
  choice: pão da Presença
  alternative: pães da proposição
  rationale: “Pão da Presença” conserva a imagem hebraica sem impor uma explicação doutrinária específica; a nota registra a expressão tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem do último “ouro” foi ajustada para deixar claro que ele qualifica a mesa. O singular coletivo “pão” foi preservado.
