  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: pt
  text: Os capitéis sobre as duas colunas também ficavam acima, diante da parte arredondada[a] que estava junto à treliça[b]; e havia duzentas romãs, dispostas em fileiras ao redor, sobre o segundo capitel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o ventre”; provavelmente a parte bojuda ou arredondada do capitel.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a rede ou treliça ornamental presa aos capitéis.
    reason: cultural_note
  - marker: c
    text: 'Ou: “o outro capitel”. O hebraico “o segundo” pode simplesmente distinguir o capitel correspondente da segunda coluna nesta descrição arquitetônica.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת
  choice: capitéis
  rationale: No contexto arquitetônico, o termo designa os remates ornamentais no alto das colunas; “capitéis” é a expressão técnica corrente em português.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: sobre as duas colunas
  rationale: Reproduz de modo natural a relação espacial indicada pelo hebraico.
- source_word: גַּם מִמַּעַל
  choice: também ficavam acima
  rationale: Conserva tanto o valor aditivo de גַּם quanto a indicação vertical de מִמַּעַל, acrescentando apenas o verbo necessário para uma frase natural em português.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: diante da parte arredondada
  rationale: לְעֻמַּת indica posição diante de ou em correspondência com algo. הַבֶּטֶן significa literalmente “o ventre”, mas aqui descreve a parte bojuda ou arredondada do capitel.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: que estava junto à treliça
  rationale: שבכה designa uma rede ou treliça ornamental. Como a relação espacial expressa por לְעֵבֶר é difícil de determinar neste contexto, “junto a” mantém a descrição coerente sem impor precisão indevida.
- source_word: הָרִמּוֹנִים
  choice: romãs
  rationale: Refere-se a figuras ornamentais em forma de romã, como deixa claro o contexto arquitetônico.
- source_word: מָאתַיִם
  choice: duzentas
  rationale: Tradução direta do numeral, com concordância com “romãs”.
- source_word: טֻרִים
  choice: dispostas em fileiras
  rationale: O substantivo indica fileiras ou séries; a formulação explicita naturalmente em português a disposição dos ornamentos.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa a disposição circular dos ornamentos em torno do capitel.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: sobre o segundo capitel
  rationale: É a tradução mais direta de הַשֵּׁנִית. No contexto do par de colunas, “o outro capitel” também é possível e foi registrado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com terminologia arquitetônica corrente. A sintaxe foi levemente regularizada para legibilidade, mas foram preservadas a difícil relação espacial entre a parte arredondada e a treliça e a referência ambígua ao “segundo” capitel.
