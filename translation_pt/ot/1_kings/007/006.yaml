  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: pt
  text: Ele fez o Salão das Colunas, com vinte e cinco metros de comprimento e quinze metros de largura[a]. Diante delas havia um pórtico, e diante delas havia colunas e uma cobertura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: cinquenta côvados de comprimento e trinta côvados de largura.'
    reason: measurement_conversion
  - marker: b
    text: O termo hebraico traduzido como “cobertura” é incerto neste contexto arquitetônico. Também pode indicar uma soleira, um vigamento ou outro elemento estrutural coberto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: Salão das Colunas
  rationale: Distingue a grande estrutura principal do pórtico frontal e expressa naturalmente o genitivo hebraico.
- source_word: עָשָׂה
  choice: fez
  rationale: Preserva o sentido amplo e direto do verbo hebraico, sem especificar além do texto que ele a construiu.
- source_word: חֲמִשִּׁים אַמָּה ... וּשְׁלֹשִׁים אַמָּה
  choice: vinte e cinco metros ... quinze metros
  rationale: Converte os côvados em medidas métricas arredondadas, mais compreensíveis ao leitor moderno, registrando os valores literais em nota.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: Diante delas havia um pórtico
  rationale: O segundo אוּלָם parece indicar uma estrutura frontal vinculada às colunas; 'pórtico' é arquitetonicamente adequado e a formulação preserva o referente plural ambíguo.
- source_word: וְעַמֻּדִים
  choice: e diante delas havia colunas
  rationale: Mantém explicitamente as colunas adicionais e a coordenação terse do hebraico.
- source_word: וְעָב
  choice: uma cobertura
  rationale: O termo é incerto neste contexto arquitetônico. 'Cobertura' conserva a provável ideia de elemento coberto ou saliente sem impor uma reconstrução técnica específica.
