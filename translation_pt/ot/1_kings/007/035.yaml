base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: pt
  text: No alto da base havia uma peça circular em toda a volta[a], com meio côvado de altura; e, no alto da base, seus apoios[b] e seus painéis[c] eram parte dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “circular em toda a volta”, sem nomear explicitamente a peça.
    reason: source_ambiguity
  - marker: b
    text: Ou “suas alças” ou “seus braços”. A palavra hebraica significa literalmente “suas mãos” e pode designar partes salientes da base.
    reason: lexical_alternative
  - marker: c
    text: Ou “suas molduras” ou “suas armações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: No alto da base
  rationale: רֹאשׁ indica o alto ou topo; מְכוֹנָה designa aqui a base móvel de bronze. “No alto da base” é natural em português e adequado ao contexto arquitetônico.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: com meio côvado de altura
  rationale: קוֹמָה expressa a dimensão vertical. A formulação preserva a medida antiga e soa clara em português atual.
- source_word: עָגֹל סָבִיב
  choice: uma peça circular em toda a volta
  rationale: עָגֹל significa “circular/redondo”, e סָבִיב, “ao redor/em toda a volta”. Como o hebraico não explicita o substantivo da estrutura, “peça” foi suprido de modo neutro para tornar a frase inteligível.
- source_word: יְדֹתֶיהָ
  choice: seus apoios
  rationale: יָד significa literalmente “mão”, mas, em descrições de objetos, pode indicar uma parte saliente, alça, braço ou apoio. “Apoios” se ajusta ao contexto estrutural, sem ocultar a alternativa em nota.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: seus painéis
  rationale: מִסְגְּרוֹת pode designar molduras, armações ou seções emolduradas. “Painéis” comunica bem as seções visíveis descritas neste contexto, enquanto “molduras” permanece possível.
- source_word: מִמֶּנָּה
  choice: formavam uma só peça com ela
  rationale: A expressão indica que esses elementos saíam da própria base ou lhe eram estruturalmente integrados, e não peças separadas. A tradução explicita essa relação construtiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário arquitetônico acessível. “Côvado” foi mantido como medida histórica bíblica; a sintaxe evita tecnicismo excessivo e preserva as incertezas lexicais por meio de notas.
