  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: pt
  text: Ele fez dez suportes de bronze.[a] Cada suporte tinha quatro côvados de comprimento, quatro côvados de largura e três côvados de altura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bases”. O termo hebraico refere-se aos suportes de bronze feitos para as bacias no complexo do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa. O pretérito perfeito expressa naturalmente a ação seguinte em português, sem exigir a explicitação de “e” ou “então”.
- source_word: הַמְּכֹנוֹת
  choice: suportes
  rationale: Neste contexto, מְכוֹנוֹת designa as estruturas móveis de bronze que sustentavam as bacias. “Suportes” comunica com clareza sua função; a alternativa tradicional “bases” é preservada em nota.
- source_word: עֶשֶׂר
  choice: dez
  rationale: Número cardinal que quantifica os suportes.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No inventário dos utensílios do templo, נְחֹשֶׁת designa convencionalmente bronze trabalhado, embora o termo possa abranger cobre e suas ligas.
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: Cada suporte
  rationale: A expressão literal “o suporte único” tem aqui sentido distributivo, isto é, refere-se às dimensões de cada peça.
- source_word: אַמָּה
  choice: côvados
  rationale: Mantém a unidade antiga do texto hebraico, cujo equivalente moderno exato é incerto.
- source_word: אֹרֶךְ ... רָחְבָּהּ ... קוֹמָתָהּ
  choice: de comprimento ... de largura ... de altura
  rationale: Formulação portuguesa natural que preserva as três dimensões e seus respectivos valores.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e preservação da unidade antiga “côvado”. O marcador da nota foi colocado após “suportes de bronze”, termo ao qual a alternativa lexical efetivamente se refere.
