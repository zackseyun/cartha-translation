  text: וּ/מְיֻסָּ֕ד אֲבָנִ֥ים יְקָר֖וֹת אֲבָנִ֣ים גְּדֹל֑וֹת אַבְנֵי֙ עֶ֣שֶׂר אַמּ֔וֹת וְ/אַבְנֵ֖י שְׁמֹנֶ֥ה אַמּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: pt
  text: E o alicerce era de pedras de grande valor[a], pedras grandes, pedras de dez côvados e pedras de oito côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras preciosas”. O hebraico destaca o grande valor ou a elevada qualidade das pedras; neste contexto de construção, é menos provável que se refira a gemas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: E o alicerce era
  rationale: O particípio passivo de יסד aparece em contexto arquitetônico. A formulação explicita naturalmente em português o elemento implícito sem acrescentar informação indevida.
- source_word: אֲבָנִים יְקָרוֹת
  choice: de pedras de alto valor
  rationale: יְקָרוֹת indica grande valor, custo ou qualidade. “De alto valor” preserva essa amplitude e, no contexto de construção, evita sugerir pedras preciosas no sentido de gemas.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: pedras grandes
  rationale: גְּדֹלוֹת descreve aqui o tamanho físico; “pedras grandes” é direto, natural e fiel.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: pedras de dez côvados
  rationale: A cadeia construta indica uma dimensão das pedras, mas o hebraico não especifica o eixo medido; a tradução mantém essa indeterminação.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: e pedras de oito côvados
  rationale: Mantém o paralelismo sintático da expressão anterior e não especifica qual dimensão está em vista.
- source_word: אַמּוֹת
  choice: côvados
  rationale: “Côvado” é o termo português convencional para a antiga unidade אַמָּה e preserva a medida original sem conversão interpretativa no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “pedras” foi preservada por refletir a estrutura enfática do hebraico. A dimensão exata indicada pelos côvados permanece sem especificação, como no texto-fonte.
