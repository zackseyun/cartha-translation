base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: pt
  text: Ele fez as colunas e duas fileiras ao redor de uma das treliças, para cobrir os capitéis que estavam sobre as romãs[a]; e fez o mesmo com o segundo capitel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico deste versículo é difícil. “Romãs” provavelmente se refere a ornamentos em forma de romã, e alguns entendem que as duas fileiras desses ornamentos circundavam a treliça de cada capitel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O verbo עשה é comum na sequência narrativa e, neste contexto artesanal, “fez” é direto e natural.
- source_word: הָעַמּוּדִים
  choice: as colunas
  rationale: No contexto arquitetônico do templo, “colunas” é claro e natural em português; o substantivo hebraico designa os suportes verticais.
- source_word: שְׁנֵי טוּרִים
  choice: duas fileiras
  rationale: טוּר indica elementos dispostos em sequência; “fileiras” comunica adequadamente a organização dos ornamentos.
- source_word: סָבִיב
  choice: ao redor
  rationale: Preserva a ideia espacial de elementos que circundavam a estrutura.
- source_word: הַשְּׂבָכָה הָאֶחָת
  choice: uma das treliças
  rationale: “Treliça” expressa a obra ornamental em forma de rede; “uma das” torna natural em português a referência hebraica a uma entre duas estruturas correspondentes.
- source_word: לְכַסּוֹת
  choice: para cobrir
  rationale: O infinitivo expressa finalidade, e “cobrir” mantém seu sentido lexical mais direto.
- source_word: הַכֹּתָרֹת
  choice: os capitéis
  rationale: כותרת é o termo arquitetônico para a parte ornamental superior de uma coluna; “capitel” é a designação portuguesa precisa.
- source_word: אֲשֶׁר עַל רֹאשׁ
  choice: que ficavam acima de
  rationale: A expressão localiza os capitéis na parte superior; “acima de” preserva a relação espacial sem tornar a frase excessivamente rígida.
- source_word: הָרִמֹּנִים
  choice: as romãs
  rationale: O hebraico diz literalmente “romãs”; neste contexto, trata-se provavelmente de ornamentos em forma de romã, esclarecidos em nota.
- source_word: וְכֵן עָשָׂה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: e fez o mesmo com o segundo capitel
  rationale: A formulação indica que o trabalho foi repetido na estrutura correspondente; esta tradução é concisa e idiomática.
