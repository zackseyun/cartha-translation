  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: pt
  text: 'Havia redes[a] reticuladas e cordões trançados como correntes para os capitéis no alto das colunas: sete para um capitel e sete para o outro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “redes, trabalho de rede, e cordões trançados, trabalho de correntes”. O hebraico emprega pares de termos artesanais para descrever a ornamentação metálica dos capitéis das colunas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: trançados em forma de rede
  rationale: A expressão hebraica combina termos da mesma raiz para descrever uma peça ornamental reticulada. A formulação portuguesa conserva a imagem concreta sem recorrer à repetição pouco natural “redes de trabalho de rede”.
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: cordões entrelaçados em forma de correntes
  rationale: גְּדִלִים indica elementos torcidos ou trançados, e מַעֲשֵׂה שַׁרְשְׁרוֹת caracteriza sua feitura como correntes. A tradução mantém ambos os aspectos do ornamento metálico.
- source_word: כֹּתָרֹת
  choice: capitéis
  rationale: Neste contexto arquitetônico, o termo designa os remates ornamentais no topo das colunas. “Capitéis” é o equivalente técnico moderno e claro em português.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: no alto das colunas
  rationale: רֹאשׁ significa literalmente “cabeça”, mas aqui indica a parte superior das colunas. “No alto” comunica naturalmente a relação espacial.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: sete para um capitel e sete para o outro
  rationale: Preserva a contagem distributiva explícita do hebraico e evita a repetição pesada de “capitel” em português.
