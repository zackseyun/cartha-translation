  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: pt
  text: Fez dois capitéis de bronze fundido para colocar no topo das colunas. A altura de um capitel era de cinco côvados[a], e a altura do segundo capitel também era de cinco côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um côvado equivalia aproximadamente a 45 centímetros; cinco côvados correspondiam a cerca de 2,25 metros.
    reason: Esclarece para o leitor moderno a medida antiga preservada no texto.
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: capitéis / capitel
  rationale: No contexto arquitetônico, designa a parte ornamental superior de uma coluna. “Capitel” é o termo técnico moderno e claro em português; “coroa” seria literal, mas poderia induzir a uma imagem inadequada.
- source_word: עָשָׂה
  choice: fez
  rationale: O verbo comum e direto corresponde ao sentido do hebraico sem acrescentar elaboração estilística.
- source_word: לָתֵת
  choice: para colocar
  rationale: 'O infinitivo expressa finalidade: os capitéis foram feitos para serem posicionados sobre as colunas.'
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: no topo das colunas
  rationale: “Topo” transmite naturalmente o sentido arquitetônico de רָאשֵׁי; “colunas” é corrente e preciso neste contexto.
- source_word: מֻצַק נְחֹשֶׁת
  choice: de bronze fundido
  rationale: Preserva tanto o material quanto o processo de fabricação indicado pelo hebraico.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: Mantém a antiga unidade de medida do texto-fonte, em vez de impor uma conversão moderna aproximada.
- source_word: קוֹמַת
  choice: a altura de
  rationale: É o equivalente natural e preciso no contexto de medidas arquitetônicas.
- source_word: הָאֶחָת
  choice: um
  rationale: Conserva a referência hebraica a “um” dos dois capitéis sem transformá-la explicitamente em “primeiro”.
- source_word: הַשֵּׁנִית
  choice: o segundo
  rationale: Reflete a designação explícita do segundo elemento do par.
