  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: pt
  text: e o único Mar[a], e os doze bois debaixo do Mar;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a única bacia, e os doze bois debaixo da bacia”. O hebraico usa “Mar” para designar o grande reservatório.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Mar
  rationale: Neste inventário dos utensílios do templo, יָם designa o grande reservatório de metal fundido tradicionalmente chamado de “Mar”. A inicial maiúscula o apresenta como objeto reconhecido e preserva a imagem hebraica.
- source_word: הָאֶחָד
  choice: o único
  rationale: O numeral/adjetivo definido distingue esse único Mar dos vários suportes e recipientes mencionados no contexto. “O único” expressa com naturalidade a definitude e o contraste numérico.
- source_word: הַבָּקָר
  choice: bois
  rationale: No contexto arquitetônico, בָּקָר se refere às figuras bovinas que sustentavam o Mar. “Bois” é a designação portuguesa tradicional e clara, sem a amplitude genérica de “gado”.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Correspondência direta do numeral cardinal hebraico.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Indica a posição física das figuras bovinas sob o reservatório; “debaixo de” é corrente e claro em português.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção unida ao marcador de objeto direto dá continuidade à lista. O português não representa separadamente esse marcador, mas preserva a conjunção “e”.
