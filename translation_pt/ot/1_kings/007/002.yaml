  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: pt
  text: Ele construiu a Casa da Floresta do Líbano, com cem côvados de comprimento, cinquenta côvados de largura e trinta côvados de altura, sobre quatro fileiras de colunas de cedro[a], com vigas de cedro sobre as colunas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com quatro fileiras de colunas de cedro”; a preposição pode indicar tanto sustentação (“sobre”) quanto disposição ou composição (“com”).
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “vigas” significa literalmente “peças cortadas” de cedro e pode designar vigas, caibros ou outro elemento estrutural de cedro lavrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O waw consecutivo dá continuidade à narrativa e é expresso naturalmente pelo pretérito perfeito, sem necessidade de iniciar com “E”.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: a Casa da Floresta do Líbano
  rationale: Preserva o sentido literal de בֵּית, “casa”, e a cadeia construta como nome próprio do edifício, sem especificar sua função como palácio.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: com cem côvados de comprimento, cinquenta côvados de largura e trinta côvados de altura
  rationale: Expressa as dimensões em português corrente, preservando a unidade antiga e o paralelismo das três medidas.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: sobre quatro fileiras de colunas de cedro
  rationale: “Fileiras” representa טוּרֵי, e “colunas” é um equivalente arquitetônico natural de עַמּוּדִים. “Sobre” mantém o sentido espacial mais direto de עַל, enquanto a nota registra a possibilidade de disposição ou composição.
- source_word: וּכְרֻתוֹת אֲרָזִים
  choice: com vigas de cedro
  rationale: O termo raro deriva da ideia de peças cortadas; no contexto arquitetônico, “vigas” comunica a interpretação estrutural mais provável sem ocultar a incerteza lexical.
- source_word: עַל הָעַמּוּדִים
  choice: sobre as colunas
  rationale: Mantém de modo claro a relação espacial indicada pelo hebraico.
