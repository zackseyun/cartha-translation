base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: pt
  text: E os capitéis que estavam no alto das colunas tinham a forma de uma flor de lírio[b] no pórtico[a] e mediam quatro côvados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no vestíbulo” ou “sobre o pórtico”. O termo hebraico designa o recinto de entrada do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “tinham a forma de um lírio”. Alguns entendem o termo hebraico como um motivo floral em forma de lótus.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “quatro côvados”. É provável que a medida se refira à altura da parte dos capitéis que tinha forma de lírio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת
  choice: capitéis
  rationale: É o termo arquitetônico moderno e preciso para os remates superiores das colunas.
- source_word: רֹאשׁ
  choice: no alto
  rationale: Transmite naturalmente o sentido espacial de 'cabeça/topo' neste contexto arquitetônico.
- source_word: הָעַמּוּדִים
  choice: das colunas
  rationale: '''Colunas'' é claro e idiomático em português para os elementos arquitetônicos descritos.'
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: tinham a forma de uma flor de lírio
  rationale: Expressa a construção nominal hebraica como descrição do formato, sem sugerir apenas o processo de fabricação.
- source_word: בָּאוּלָם
  choice: no pórtico
  rationale: אוּלָם designa o recinto de entrada do templo; 'pórtico' é uma designação arquitetônica corrente e digna.
- source_word: אַרְבַּע אַמּוֹת
  choice: mediam quatro côvados
  rationale: A frase portuguesa explicita idiomaticamente que se trata de uma medida, sem determinar no texto principal qual dimensão era medida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia arquitetônica acessível. A ordem das notas acompanha as expressões a que se referem, e a possível altura permanece apenas como explicação em nota, pois o hebraico não especifica a dimensão.
