base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: pt
  text: Então ele fez o Mar de metal fundido[a], com dez côvados de uma borda à outra, inteiramente redondo. Sua altura era de cinco côvados, e uma linha[b][c] de trinta côvados o circundava por completo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a bacia”. O hebraico chama esse grande recipiente do templo de “Mar”, designação formal preservada no texto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “uma linha de trinta côvados”; isto é, a medida ao redor era de trinta côvados.'
    reason: cultural_note
  - marker: c
    text: A forma escrita aqui é קוה; a tradição massorética a lê com o sentido de “linha” ou “cordão de medir”. Compare 2 Crônicas 4:2.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: o Mar
  rationale: Embora o termo designe a grande bacia do templo, o hebraico a chama formalmente de “Mar”. A manutenção desse nome preserva a imagem do texto-fonte.
- source_word: מוּצָק
  choice: de metal fundido
  rationale: O particípio indica um objeto produzido pela fundição de metal. A expressão explicita isso com naturalidade em português, sem especificar um metal que o versículo não nomeia.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: com dez côvados de uma borda à outra
  rationale: שָׂפָה designa aqui a borda do recipiente; a formulação comunica naturalmente a medida transversal.
- source_word: עָגֹל סָבִיב
  choice: inteiramente redondo
  rationale: Expressa tanto a forma circular quanto a ênfase de סָבִיב, evitando uma repetição pouco natural em português.
- source_word: קוֹמָתוֹ
  choice: sua altura
  rationale: “Altura” é a equivalência direta e adequada ao contexto arquitetônico.
- source_word: וקוה
  choice: uma linha
  rationale: A forma textual é tradicionalmente entendida como uma linha ou cordão de medir. “Linha” preserva a concisão do hebraico; a nota esclarece sua função e a questão textual.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: o circundava por completo
  rationale: Reproduz o sentido de rodear inteiramente o objeto e transmite a ênfase da repetição hebraica de modo idiomático.
- source_word: אַמָּה
  choice: côvado
  rationale: É o termo português tradicional e preciso para essa antiga unidade de comprimento, sem impor uma conversão moderna incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. “Mar” recebe inicial maiúscula por funcionar como designação do grande recipiente do templo. A ordem das notas [b][c] liga primeiro a explicação da medida e depois a observação textual à expressão “uma linha”.
