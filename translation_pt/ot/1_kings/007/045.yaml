  text: וְ/אֶת הַ/סִּיר֨וֹת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַ/מִּזְרָק֗וֹת וְ/אֵת֙ כָּל הַ/כֵּלִ֣ים ה/אהל אֲשֶׁ֨ר עָשָׂ֥ה חִירָ֛ם לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מְמֹרָֽט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: pt
  text: e os caldeirões[a], as pás, as bacias[b] e todos esses utensílios que Hirão fez para o rei Salomão, para a casa de Yahweh, eram de bronze polido.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “panelas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigelas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “bronze brunido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: os caldeirões
  rationale: O termo designa recipientes grandes, como panelas ou caldeirões. No inventário dos utensílios do templo, “caldeirões” comunica de modo natural sua provável função sem acrescentar uma finalidade não expressa.
- source_word: הַיָּעִים
  choice: as pás
  rationale: Designa instrumentos empregados para retirar cinzas ou manusear materiais junto ao altar; “pás” é claro e adequado ao contexto.
- source_word: הַמִּזְרָקוֹת
  choice: as bacias
  rationale: Refere-se a recipientes usados para conter ou aspergir líquidos. “Bacias” preserva o sentido cultual, embora “tigelas” também seja possível.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: todos esses utensílios
  rationale: כֵּלִים é um termo amplo para objetos, instrumentos ou recipientes; “utensílios” é natural em português para o conjunto de peças do templo. הָאֵלֶּה remete aos objetos enumerados.
- source_word: עָשָׂה
  choice: fez
  rationale: O verbo comum “fez” reproduz o hebraico com clareza, sem a coloração estilística adicional de “confeccionou” ou “moldou”.
- source_word: חִירָם
  choice: Hirão
  rationale: “Hirão” é a forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: para o rei Salomão
  rationale: A preposição לְ indica naturalmente o destinatário ou beneficiário do trabalho.
- source_word: בֵּית יְהוָה
  choice: para a casa de Yahweh
  rationale: “Casa” mantém a imagem hebraica, e a preposição “para” explicita em português que os objetos se destinavam ao santuário, sentido indicado pelo contexto e pela relação sintática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino יהוה; a transliteração “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: “Bronze” é a designação convencional e historicamente plausível do metal neste contexto de mobiliário do templo.
- source_word: מְמֹרָט
  choice: polido
  rationale: O termo descreve metal alisado e lustrado. “Polido” é corrente e claro em português; “brunido” preserva um registro mais técnico e elevado.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. Manter “Yahweh” conserva o nome pessoal e evita substituí-lo silenciosamente pelo título tradicional.
- issue: Função de נְחֹשֶׁת מְמֹרָט no fim da frase
  choice: 'predicado de toda a lista: “eram de bronze polido”'
  alternative: 'expressão nominal anexada: “de bronze polido”'
  rationale: A oração nominal hebraica permite entender a expressão final como predicado dos objetos enumerados. A inserção de “eram” torna essa relação natural em português sem mudar o conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a abertura coordenada “e”, pois o versículo continua a lista anterior. A repetição de “para” distingue com clareza o patrono real e o destino cultual dos utensílios.
