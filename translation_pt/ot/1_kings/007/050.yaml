base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: pt
  text: e as bacias, as tesouras para pavios, as tigelas[a], as taças e os braseiros, de ouro puro; e os encaixes[b] das portas do santuário interior, isto é, do Lugar Santíssimo[c], e das portas do templo, isto é, do salão principal, eram de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tigelas para aspersão”.'
    reason: lexical_alternative
  - marker: b
    text: Provavelmente encaixes para pivôs ou ferragens semelhantes, e não dobradiças laterais modernas.
    reason: cultural_note
  - marker: c
    text: 'Tradução tradicional: “Santo dos Santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: as bacias
  rationale: No contexto de uma lista de utensílios do templo, o termo designa provavelmente recipientes ou bacias; esta escolha também o distingue de מִזְרָקוֹת.
- source_word: הַמְזַמְּרוֹת
  choice: as tesouras para pavios
  rationale: No contexto do santuário, refere-se a instrumentos usados para aparar os pavios das lâmpadas; a formulação é clara em português moderno.
- source_word: הַמִּזְרָקוֹת
  choice: as tigelas
  rationale: Designa recipientes associados ao manejo ritual de líquidos, possivelmente para aspersão; a alternativa mais específica é preservada em nota.
- source_word: הַכַּפּוֹת
  choice: as taças
  rationale: O substantivo indica pequenos recipientes côncavos; 'taças' evita a imagem imprecisa de colheres modernas.
- source_word: הַמַּחְתּוֹת
  choice: os braseiros
  rationale: Eram recipientes usados para transportar brasas ou fogo no serviço do santuário; 'braseiros' é natural e não restringe indevidamente o uso ao incenso.
- source_word: זָהָב סָגוּר
  choice: de ouro puro
  rationale: A expressão indica ouro de alta qualidade ou refinado; 'ouro puro' é a formulação portuguesa mais natural.
- source_word: הַפֹּתוֹת
  choice: os encaixes
  rationale: O termo parece designar as ferragens ou cavidades nas quais as portas giravam, provavelmente encaixes para pivôs, e não dobradiças modernas.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: o santuário interior
  rationale: Embora literalmente seja 'a casa interior', no contexto arquitetônico do templo a expressão identifica claramente o recinto interior.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: do Lugar Santíssimo
  rationale: Expressa em português corrente o superlativo hebraico e identifica o recinto mais sagrado sem depender da fórmula tradicional.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: das portas do templo, isto é, do salão principal
  rationale: הֵיכָל designa aqui o salão principal do edifício, distinto do santuário interior; 'isto é' explicita a aposição implícita.
- source_word: זָהָב
  choice: eram de ouro
  rationale: A oração nominal hebraica é expressa naturalmente em português com o verbo 'eram', retomando o material dos encaixes.
theological_decisions:
- issue: Tradução do superlativo קֹדֶשׁ הַקֳּדָשִׁים
  choice: Lugar Santíssimo
  alternative: Santo dos Santos
  rationale: A escolha comunica de modo claro o sentido superlativo; a forma tradicional é mantida em nota, sem impor uma terminologia confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da lista e a distinção entre o recinto interior e o salão principal foram preservadas; termos técnicos foram esclarecidos sem modernizar indevidamente os objetos.
