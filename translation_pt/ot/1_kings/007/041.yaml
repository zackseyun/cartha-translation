  text: עַמֻּדִ֣ים שְׁנַ֔יִם וְ/גֻלֹּ֧ת הַ/כֹּתָרֹ֛ת אֲשֶׁר עַל רֹ֥אשׁ הָֽ/עַמֻּדִ֖ים שְׁתָּ֑יִם וְ/הַ/שְּׂבָכ֣וֹת שְׁתַּ֔יִם לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל רֹ֥אשׁ הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: pt
  text: as duas colunas, as duas tigelas[a] dos capitéis[b] que ficavam no alto das colunas, e as duas treliças[c] para cobrir as duas tigelas dos capitéis que ficavam no alto das colunas;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “globos” ou “formas arredondadas”; o termo hebraico se refere a elementos arredondados dos capitéis, cuja forma arquitetônica exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as peças ornamentais colocadas no topo das colunas.
    reason: clarification
  - marker: c
    text: Ou “redes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: colunas
  rationale: No contexto arquitetônico do templo, “colunas” é o termo corrente e preciso em português para as duas grandes estruturas verticais.
- source_word: גֻלֹּת
  choice: tigelas
  rationale: O termo designa elementos arredondados associados aos capitéis. “Tigelas” comunica a forma provável sem eliminar a incerteza arquitetônica, explicitada em nota.
- source_word: כֹּתָרֹת
  choice: capitéis
  rationale: É o termo arquitetônico moderno para os elementos ornamentais situados no topo das colunas.
- source_word: רֹאשׁ
  choice: alto
  rationale: Embora o sentido literal seja “cabeça”, “no alto das colunas” é natural em português e adequado ao contexto arquitetônico.
- source_word: שְּׂבָכוֹת
  choice: treliças
  rationale: Expressa uma estrutura ornamental aberta e entrelaçada, preservando a imagem de trabalho semelhante a uma rede.
- source_word: לְכַסּוֹת
  choice: para cobrir
  rationale: Reproduz de maneira direta o valor de finalidade do infinitivo hebraico.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: duas
  rationale: Mantém a repetição dos numerais que organiza esta lista de peças.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: que ficavam no alto das colunas
  rationale: Preserva a oração relativa e sua repetição no hebraico, com formulação natural em português.
