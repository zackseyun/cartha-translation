base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/029.yaml
  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: pt
  text: Nos painéis que ficavam entre as armações havia leões, bois e querubins; e, também sobre as armações, acima, havia essas figuras. Debaixo dos leões e dos bois havia grinaldas[a], obra de relevo pendente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festões”. O termo hebraico é raro, e não se conhece com certeza a forma exata desse ornamento.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida como “obra de relevo pendente” é difícil; talvez se refira a um trabalho ornamental suspenso ou descendente sob as figuras.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: painéis
  rationale: No contexto da estrutura dos suportes, designa as seções decorativas inseridas entre os elementos estruturais; “painéis” distingue essas partes das armações.
- source_word: שְׁלַבִּים
  choice: armações
  rationale: Refere-se aos elementos estruturais entre os quais os painéis estavam colocados. “Armações” mantém o contraste com “painéis” e é claro em português.
- source_word: אֲרָיוֹת
  choice: leões
  rationale: Equivalente direto e natural para as figuras decorativas de leões.
- source_word: בָּקָר
  choice: bois
  rationale: O coletivo hebraico designa bovinos; “bois” é idiomático na descrição das figuras ornamentais do templo sem especificar além do necessário.
- source_word: כְרוּבִים
  choice: querubins
  rationale: Forma tradicional em português para essa classe específica de seres celestiais, evitando a conotação diminutiva que “querubins” não possui no uso bíblico.
- source_word: כֵּן
  choice: uma base
  rationale: 'Aqui foi entendido como substantivo, “base” ou “pedestal”, leitura favorecida pela sintaxe: sobre as armações havia uma base na parte superior. A possível leitura adverbial, “também”, é registrada como alternativa.'
- source_word: מִמָּעַל
  choice: na parte superior
  rationale: Expressa de modo natural a localização elevada da base em relação às armações.
- source_word: מִתַּחַת
  choice: abaixo
  rationale: Indica diretamente a posição dos ornamentos sob as figuras de leões e bois.
- source_word: לֹיוֹת
  choice: grinaldas
  rationale: O termo raro parece indicar ornamentos pendentes ou festonados. “Grinaldas” é natural no contexto, e a incerteza quanto à forma exata é preservada em nota.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: feitas em relevo pendente
  rationale: A expressão difícil provavelmente descreve trabalho ornamental descendente ou suspenso. A tradução comunica tanto a técnica decorativa quanto sua orientação espacial, sem ocultar a incerteza.
