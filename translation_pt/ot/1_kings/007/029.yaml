  naturalness: “Painéis”, “armações”, “leões, bois e querubins” e “grinaldas” são naturais e adequados ao registro descritivo. A construção revista conserva a concisão algo elíptica do original, mas explicita de modo moderado que a decoração das armações corresponde à dos painéis.
  terminology: “Querubins” é a forma bíblica estabelecida; “bois” é apropriado para as figuras bovinas. “Grinaldas” é uma escolha defensável para o termo ornamental raro, desde que a incerteza permaneça em nota. “Relevo pendente” traduz prudentemente a expressão difícil, também com nota.
