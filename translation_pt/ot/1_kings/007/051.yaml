  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: pt
  text: Assim, foi concluída toda a obra que o rei Salomão fez para a casa de Yahweh. Então Salomão trouxe as coisas consagradas[a] de Davi, seu pai — a prata, o ouro e os utensílios — e as colocou nos depósitos da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas santas”. O hebraico se refere a bens separados como santos para Yahweh.'
    reason: Registra uma tradução alternativa direta para קָדְשֵׁי e esclarece o sentido cultual sem restringir a natureza dos bens.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: foi concluída
  rationale: O verbo da raiz שלם expressa que a obra chegou à sua conclusão; a construção passiva é natural em português e mantém a concordância com “obra”.
- source_word: כָּל הַמְּלָאכָה
  choice: toda a obra
  rationale: מְלָאכָה abrange aqui o conjunto do trabalho de construção e preparação da casa de Yahweh.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a imagem hebraica de “casa” e verte diretamente o nome divino.
- source_word: וַיָּבֵא
  choice: levou para dentro
  rationale: O hifil de בוא indica fazer entrar ou levar para dentro; a expressão explicita naturalmente o movimento para o interior da casa.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: as coisas santas de Davi, seu pai
  rationale: קָדְשֵׁי designa bens separados como santos; a formulação direta preserva o vínculo lexical com santidade, enquanto a nota registra a alternativa idiomática “coisas consagradas”.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: a prata, o ouro e os utensílios
  rationale: כֵּלִים é um termo amplo para objetos ou implementos; “utensílios” é claro no contexto do templo sem especificar uma função não expressa no texto.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: as colocou nos tesouros
  rationale: נתן pode significar “pôr/colocar”, e אֹצְרוֹת indica depósitos ou câmaras de tesouro; a expressão portuguesa comunica que os bens foram armazenados ali.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o tetragrama como nome próprio. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de קָדְשֵׁי aplicado aos bens de Davi
  choice: coisas santas
  alternative: coisas consagradas; ofertas consagradas
  rationale: A expressão indica objetos separados para uso sagrado. “Coisas santas” mantém a forma ampla do hebraico, sem pressupor além do texto a maneira exata de sua consagração.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém “casa” em vez de explicitar “templo”, usa “seu pai” para evitar rigidez e conserva a enumeração em aposto marcada por travessões.
