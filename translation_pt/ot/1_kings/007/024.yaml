base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: pt
  text: Sob a borda havia, ao redor, ornamentos em forma de cabaça[a], dez por côvado, circundando o Mar por todos os lados. Esses ornamentos estavam em duas fileiras, fundidos numa só peça com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “botões” ou “saliências”; o termo hebraico designa formas ornamentais semelhantes a cabaças.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: frutos em forma de cabaça
  rationale: O termo designa formas ornamentais semelhantes a cabaças. A expressão concreta preserva a imagem sem identificar com certeza uma espécie botânica.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: debaixo da borda
  rationale: שָׂפָה significa literalmente “lábio” ou “beira”; para uma grande bacia, “borda” é natural e preciso.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: ao redor ... circundando
  rationale: Mantém de modo natural a repetição enfática de raízes cognatas presente no hebraico.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dez por côvado
  rationale: Expressa a quantidade ou densidade dos ornamentos ao longo da circunferência sem impor um esquema de medição mais específico.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: circundando o Mar por todos os lados
  rationale: “Mar” funciona como nome da grande bacia; a formulação conserva a ênfase espacial do hebraico.
- source_word: שְׁנֵי טוּרִים
  choice: dispostos em duas fileiras
  rationale: טוּרִים significa “fileiras”; “dispostos” torna clara em português a relação sintática.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: fundidos numa só peça com o Mar
  rationale: A repetição da raiz de “fundir” indica que os ornamentos foram formados juntamente com a bacia, e não acrescentados depois.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mar” recebe maiúscula por ser a designação técnica da grande bacia. A repetição espacial do hebraico foi parcialmente preservada sem tornar a frase artificial.
