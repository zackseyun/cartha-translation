lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: E, por cima
  rationale: No contexto arquitetônico, a expressão indica o que havia na parte superior da estrutura e funciona naturalmente como transição.
- source_word: אֲבָנִים יְקָרוֹת
  choice: pedras de alto valor
  rationale: O adjetivo descreve pedras caras ou de qualidade superior; esta formulação evita sugerir pedras preciosas no sentido de gemas.
- source_word: כְּמִדּוֹת גָּזִית
  choice: lavradas sob medida
  rationale: A expressão combina a ideia de dimensões determinadas com a de pedra trabalhada ou aparelhada. A tradução comunica ambas de modo natural e conciso.
- source_word: וָאָרֶז
  choice: e madeira de cedro
  rationale: Embora o hebraico diga literalmente 'e cedro', acrescentar 'madeira' torna claro em português que se trata do material de construção.
