source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: pt
  text: O grande pátio, em toda a volta, tinha três fileiras de pedras lavradas e uma fileira de vigas de cedro, assim como o pátio interno da casa de Yahweh e o vestíbulo da casa.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e para o pátio interno da casa de Yahweh e para o vestíbulo da casa”. A preposição hebraica pode indicar correspondência ou relação; no texto, foi traduzida em sentido comparativo: “assim como”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “três fiadas de pedras lavradas e uma fiada de vigas de cedro”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, o salão de entrada do edifício do templo.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: o grande pátio
  rationale: חָצֵר designa um espaço fechado ou pátio; “pátio” é natural e claro em português no contexto arquitetônico.
- source_word: סָבִיב
  choice: em toda a volta
  rationale: Preserva a ideia espacial de algo que circunda todo o pátio em linguagem corrente.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: três fileiras
  rationale: טוּר pode indicar uma fileira ou fiada em construção; “fileiras” é mais acessível, enquanto “fiadas” fica registrado como alternativa técnica.
- source_word: גָּזִית
  choice: pedras lavradas
  rationale: Refere-se a pedras trabalhadas ou talhadas para uso em alvenaria; “pedras lavradas” mantém precisão e dignidade.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: e uma fileira de vigas de cedro
  rationale: A expressão é paralela às fileiras de pedra; כְּרֻתֹת indica peças cortadas, entendidas no contexto como elementos estruturais de cedro.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: assim como o pátio interno da casa de Yahweh
  rationale: O לְ pode indicar correspondência ou relação. A tradução comparativa torna inteligível a construção elíptica sem ocultar a leitura mais literal, registrada em nota.
- source_word: אֻלָם
  choice: vestíbulo
  rationale: Designa o espaço ou salão de entrada do edifício; “vestíbulo” é arquitetonicamente preciso e compreensível.
- source_word: הַבָּיִת
  choice: a casa
  rationale: Preserva o termo hebraico para o edifício do templo e a repetição arquitetônica do contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” representa o nome próprio, em vez de substituí-lo por um título.
- issue: Função da preposição לְ diante do pátio interno e do vestíbulo
  choice: 'valor comparativo: “assim como”'
  alternative: 'valor relacional: “e para o pátio interno... e para o vestíbulo...”'
  rationale: No contexto arquitetônico, a comparação fornece uma ligação sintática coerente com a construção do grande pátio, mas o hebraico admite uma leitura mais literal ou relacional, preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O registro é digno e acessível; termos arquitetônicos técnicos são oferecidos em nota. Os marcadores foram colocados junto à oração relevante, sem interromper excessivamente a leitura.
