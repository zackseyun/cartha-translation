  text: and the ten stands[a], and the ten basins on the stands,
translation:
  language: pt
  text: e os dez suportes[a], e as dez bacias sobre os suportes;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bases». Tradicionalmente, «lavatórios» para «bacias».
    reason: 'Registra alternativas lexicais legítimas: «bases» para מְכוֹנוֹת e o termo tradicional «lavatórios» para כִּיּוֹרוֹת.'
lexical_decisions:
- source_word: וְ/אֶת
  choice: e
  rationale: אֵת marca o objeto direto definido e não recebe tradução própria; וְ preserva a estrutura aditiva da lista com «e».
- source_word: הַ/מְּכֹנוֹת
  choice: os suportes
  rationale: No contexto dos utensílios do templo, מְכוֹנוֹת designa as estruturas móveis que sustentavam as bacias. «Suportes» expressa com clareza sua função sem especificar em excesso sua mobilidade.
- source_word: עָשֶׂר
  choice: dez
  rationale: Número cardinal que quantifica מְכוֹנוֹת.
- source_word: הַ/כִּיֹּרֹת
  choice: as bacias
  rationale: כִּיּוֹרוֹת designa recipientes usados para lavagem. «Bacias» é uma equivalência atual e compreensível.
- source_word: עֲשָׂרָה
  choice: dez
  rationale: Número cardinal que quantifica כִּיּוֹרוֹת.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica que as bacias ficavam colocadas em cima dos respectivos suportes.
- source_word: הַ/מְּכֹנוֹת
  choice: os suportes
  rationale: A repetição do mesmo termo hebraico é mantida de modo consistente no versículo.
