base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: pt
  text: Sua espessura era de um palmo[a], e sua borda era feita como a borda de um cálice, como uma flor de lírio[b]. Sua capacidade era de dois mil batos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um palmo correspondia aproximadamente à largura de uma mão. A descrição paralela em 2 Crônicas 4:5 atribui à bacia a capacidade de três mil batos. Isso pode refletir uma diferença textual, de transmissão ou de interpretação entre a capacidade e o conteúdo habitual.
    reason: measurement_clarification; cross_reference
  - marker: b
    text: 'Ou: «seu lábio [...] como o lábio de um cálice».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְיוֹ
  choice: sua espessura
  rationale: O substantivo designa a espessura do material da bacia, e o sufixo masculino singular se refere ao Mar; a formulação é concreta e natural em português.
- source_word: טֶפַח
  choice: um palmo
  rationale: Tefaḥ é a medida da largura de uma mão; «palmo» é a designação bíblica corrente e compreensível em português.
- source_word: שְׂפָתוֹ
  choice: sua borda
  rationale: No contexto de uma grande bacia, «borda» comunica claramente a extremidade superior; «lábio» permanece possível e é registrado em nota.
- source_word: כְּמַעֲשֵׂה
  choice: era feita como
  rationale: A expressão introduz uma comparação de forma ou trabalho artesanal; esta tradução preserva o sentido de maneira idiomática.
- source_word: שְׂפַת כּוֹס
  choice: a borda de um cálice
  rationale: Mantém a repetição lexical de שׂפה e representa um recipiente moldado com borda característica; «cálice» oferece registro digno e natural.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: uma flor de lírio
  rationale: A expressão descreve uma forma floral, provavelmente aberta ou alargada como a flor do lírio, sem especificar além do hebraico.
- source_word: אַלְפַּיִם בַּת
  choice: dois mil batos
  rationale: O bato é uma antiga medida de líquidos; a transliteração preserva a unidade original sem impor uma conversão moderna incerta.
- source_word: יָכִיל
  choice: sua capacidade era de
  rationale: O hifil de כול expressa capacidade do recipiente, não necessariamente o volume que ele continha em determinado momento.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe mantém a descrição concreta e digna. «Batos» preserva a antiga unidade de volume, e «capacidade» explicita o valor potencial de יָכִיל sem confundi-lo com o conteúdo efetivo.
