base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: pt
  text: Fundiu as duas colunas de bronze. A primeira coluna tinha dezoito côvados de altura, e um cordão de doze côvados contornava a segunda coluna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּצַר
  choice: Fundiu
  rationale: No contexto da fabricação de grandes peças de bronze, o verbo designa a moldagem do metal por fundição, não apenas a ideia geral de formar.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: as duas colunas
  rationale: “Colunas” é natural em português para estes elementos arquitetônicos monumentais e distingue-os de pilares maciços.
- source_word: נְחֹשֶׁת
  choice: de bronze
  rationale: Neste contexto arquitetônico e metalúrgico, o termo hebraico indica naturalmente bronze; “latão” seria anacrônico e “cobre” excessivamente específico.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: dezoito côvados
  rationale: Mantém a antiga unidade de medida sem introduzir uma conversão moderna aproximada no texto.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: A primeira coluna tinha ... de altura
  rationale: Expressa em português natural a altura de uma das duas colunas e prepara o contraste textual com “a segunda coluna” no fim do versículo.
- source_word: וְחוּט
  choice: e um cordão
  rationale: חוּט significa fio, cordão ou linha; “cordão” conserva a imagem concreta do objeto usado ao redor da coluna.
- source_word: יָסֹב
  choice: contornava
  rationale: Reproduz a ideia literal de dar a volta ou circundar, permitindo que o contexto comunique a medição da circunferência.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: a segunda coluna
  rationale: Segue diretamente o texto hebraico massorético, que contém o ordinal “segunda”, em vez de substituí-lo pelo pronome “a” ou por “a outra”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. Conservou-se “côvados” como unidade histórica e a referência explícita do hebraico à segunda coluna. Não foi acrescentada nota, pois o texto hebraico fornecido é inequívoco nessa expressão.
