  text: וַ/יִּתֵּן֙ אֶת הַ/מְּכֹנ֔וֹת חָמֵ֞שׁ עַל כֶּ֤תֶף הַ/בַּ֨יִת֙ מִ/יָּמִ֔ין וְ/חָמֵ֛שׁ עַל כֶּ֥תֶף הַ/בַּ֖יִת מִ/שְּׂמֹאל֑/וֹ וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֨תֶף הַ/בַּ֧יִת הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: pt
  text: Ele colocou cinco suportes no lado direito da Casa e cinco no lado esquerdo da Casa, e colocou o Mar no lado sudeste da Casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do lado direito da Casa, para o leste, defronte do sul” — uma descrição espacial compacta que indica o lado sudeste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: suportes
  rationale: No contexto dos utensílios do templo, refere-se às estruturas móveis de bronze que sustentavam as bacias. “Suportes” expressa sua função sem enfatizar excessivamente as rodas.
- source_word: כֶּתֶף
  choice: lado
  rationale: Embora signifique literalmente “ombro”, na descrição arquitetônica indica o lado de um edifício.
- source_word: הַבַּיִת
  choice: a Casa
  rationale: O hebraico diz “a casa”, aqui em referência ao templo. “Casa”, com inicial maiúscula, preserva a expressão da fonte e deixa claro seu uso como designação do santuário.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: do lado direito / do lado esquerdo
  rationale: Preserva a orientação corporal empregada no hebraico, sem convertê-la desnecessariamente em sul e norte.
- source_word: הַיָּם
  choice: o Mar
  rationale: É a designação convencional da grande bacia de bronze do complexo do templo; a inicial maiúscula indica que se trata de um utensílio específico, não de um corpo natural de água.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: no lado sudeste da Casa
  rationale: A sequência espacial compacta — lado direito, para o leste, diante do sul — indica de modo natural a localização sudeste.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “Casa” e “Mar” como designações contextuais do templo e de seu grande reservatório. A formulação preserva direita/esquerda na primeira oração e traduz a descrição final por sua localização geográfica natural.
