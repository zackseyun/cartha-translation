base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: pt
  text: Hirão fez as bacias, as pás e as tigelas[a]. Assim, Hirão terminou toda a obra que realizou para o rei Salomão, destinada à casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bacias de aspersão”, isto é, recipientes usados nos ritos sacrificiais.
    reason: Registra a função ritual possivelmente específica de מִּזְרָקוֹת sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: bacias
  rationale: O termo designa grandes recipientes, aqui entre os utensílios do templo. “Bacias” é uma tradução clara e atual, sem o caráter arcaico de alternativas como “lavatórios”.
- source_word: יָּעִים
  choice: pás
  rationale: Refere-se a utensílios usados para retirar cinzas ou brasas; “pás” é natural e adequado ao contexto do culto.
- source_word: מִּזְרָקוֹת
  choice: tigelas[a]
  rationale: Designa recipientes empregados nos ritos sacrificiais, inclusive para receber ou aspergir sangue e outros líquidos. “Tigelas” é amplo e acessível; a função ritual mais específica fica registrada em nota.
- source_word: וַיְכַל
  choice: terminou
  rationale: O verbo indica a conclusão da tarefa; “terminou” expressa isso de modo conciso e idiomático.
- source_word: כָּל הַמְּלָאכָה
  choice: toda a obra
  rationale: מְלָאכָה abrange trabalho, obra ou execução artesanal. “Toda a obra” é natural neste resumo e mantém a amplitude do termo.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de YHWH” e verte diretamente o nome divino conforme a orientação fornecida.
- source_word: חִירוֹם / חִירָם
  choice: Hirão
  rationale: As duas grafias hebraicas se referem à mesma pessoa; “Hirão” é a forma portuguesa convencional.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: realizou para o rei Salomão
  rationale: No resumo, עשה tem o sentido amplo de executar ou realizar uma obra. A escolha evita repetição pesada de “fez” sem alterar o sentido.
- source_word: לַעֲשׂוֹת ... לַמֶּלֶךְ שְׁלֹמֹה בֵּית יְהוָה
  choice: que realizou para o rei Salomão, destinada à casa de Yahweh
  rationale: A formulação natural em português preserva tanto o trabalho prestado ao rei quanto sua destinação ao templo, evitando sugerir apenas o local em que foi executado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama. “Yahweh” preserva o nome divino pessoal de maneira direta, de acordo com a orientação teológica fornecida, sem substituir o nome por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva “casa de Yahweh” em vez de explicitar “templo” e emprega vocabulário comum para os utensílios. O marcador da nota foi colocado após “tigelas”, correspondente a מִּזְרָקוֹת.
