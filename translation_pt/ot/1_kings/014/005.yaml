  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: pt
  text: 'E Yahweh disse a Aías: “Veja, a mulher de Jeroboão está vindo consultar você a respeito do filho dela, pois ele está doente. Você lhe dirá isto e aquilo.[a] Quando ela chegar, estará disfarçada.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “assim e assim”, fórmula que indica uma mensagem específica cujo conteúdo ainda não é declarado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estará se fazendo passar por outra pessoa”. O verbo hebraico indica que ela ocultaria a própria identidade para não ser reconhecida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: Mantém o nome divino como nome próprio e preserva a ligação narrativa expressa pelo waw.
- source_word: הִנֵּה
  choice: Veja
  rationale: Expressa o chamado de atenção e a iminência da situação em português atual, sem o tom arcaico de “eis”.
- source_word: בָּאָה
  choice: está vindo
  rationale: Reproduz o sentido presente e iminente da forma hebraica no contexto.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: consultar você a respeito do filho dela
  rationale: “Consultar” se ajusta ao contexto de busca de uma palavra profética, enquanto “a respeito” explicita naturalmente o assunto da consulta.
- source_word: כִּי חֹלֶה הוּא
  choice: pois ele está doente
  rationale: Preserva a relação explicativa ou causal da conjunção כי em português natural.
- source_word: כָּזֹה וְכָזֶה תְּדַבֵּר אֵלֶיהָ
  choice: Você lhe dirá isto e aquilo
  rationale: Conserva a fórmula hebraica que aponta para uma mensagem específica ainda não reproduzida, com sintaxe corrente em português.
- source_word: וִיהִי כְבֹאָהּ
  choice: Quando ela chegar
  rationale: Transmite com naturalidade a construção temporal hebraica sem reproduzir mecanicamente a fórmula narrativa.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: estará disfarçada
  rationale: Expressa o sentido reflexivo de tornar-se irreconhecível ou ocultar a própria identidade no momento da chegada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: Trata o tetragrama como nome próprio, em conformidade com a política fornecida, sem substituir o nome por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Veja” evita arcaísmo; “consultar” preserva o contexto profético; “isto e aquilo” mantém a indeterminação deliberada da fórmula hebraica. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
source_grounding:
  english_pob_role: consult_only
