  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: pt
  text: Quem da família de Jeroboão morrer na cidade[a], os cães comerão; e quem morrer no campo, as aves do céu comerão[b], pois Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o morto de Jeroboão”; isto é, qualquer pessoa da família ou casa de Jeroboão que morrer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as aves dos céus”; tradicionalmente, “as aves do ar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: Quem da família de Jeroboão morrer
  rationale: A construção hebraica significa idiomaticamente qualquer pessoa pertencente à casa ou linhagem de Jeroboão. A formulação distributiva em português torna essa relação clara sem restringi-la ao próprio Jeroboão.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Tradução locativa direta; o substantivo definido singular é mantido.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: os cães comerão
  rationale: Preserva o sentido básico de אָכַל, “comer”, e a imagem severa do texto sem intensificação interpretativa como “devorar”.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: e quem morrer no campo
  rationale: Reproduz o paralelismo distributivo da primeira oração. “Campo” é o equivalente direto e mantém o contraste com “cidade”.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves do céu
  rationale: O coletivo עוֹף refere-se às criaturas voadoras, normalmente aves; “do céu” traduz diretamente הַשָּׁמַיִם e soa natural em português bíblico atual.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: pois Yahweh falou
  rationale: כִּי apresenta o fundamento e a certeza do juízo. O perfeito דִּבֵּר é vertido naturalmente por “falou”, indicando um pronunciamento já feito e definitivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e segue a decisão editorial indicada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela e a repetição de “comerão” foram preservadas para refletir a estrutura e a força retórica do hebraico.
