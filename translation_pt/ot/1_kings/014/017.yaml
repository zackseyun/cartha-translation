base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: pt
  text: Então a mulher de Jeroboão se levantou, foi e chegou a Tirza. Quando ela chegou à soleira da casa, o menino morreu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: se levantou
  rationale: O qatal consecutivo de קום dá continuidade à narrativa. “Se levantou” preserva o modo hebraico de introduzir a ação seguinte sem reduzi-lo apenas à ideia de partir.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: a mulher de Jeroboão
  rationale: A cadeia construta indica a relação conjugal; em português bíblico atual, “a mulher de Jeroboão” é natural e clara.
- source_word: וַתֵּלֶךְ
  choice: partiu
  rationale: הלך descreve o deslocamento seguinte. “Partiu” evita a sequência menos fluida “foi e chegou” e expressa naturalmente o início da viagem sem acrescentar detalhes.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: chegou a Tirza
  rationale: בוא e o he direcional em תִרְצָתָה indicam movimento até Tirza. “Chegou a” comunica com precisão o destino.
- source_word: הִיא בָּאָה
  choice: Quando ela chegou
  rationale: O pronome independente seguido do particípio forma uma oração circunstancial ou temporal. “Quando ela chegou” preserva a relação temporal sem impor uma duração específica.
- source_word: בְסַף הַבַּיִת
  choice: à soleira da casa
  rationale: סַף designa a soleira ou limiar. “Soleira” é o equivalente concreto mais preciso, e a contração “à” expressa o ponto alcançado no movimento.
- source_word: וְהַנַּעַר
  choice: o menino
  rationale: נַעַר possui amplitude semântica, mas neste contexto se refere ao filho de Jeroboão; “menino” é claro e natural sem especificar uma idade não dada.
- source_word: מֵת
  choice: morreu
  rationale: Embora a forma seja qatal, o contexto narrativo apresenta o acontecimento no momento anunciado no versículo anterior; “morreu” transmite adequadamente esse valor eventivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação hebraica foi tornada fluida em “se levantou, partiu e chegou”, sem eliminar a sequência narrativa. Não se acrescentou nota porque “quando” representa diretamente a leitura temporal natural de הִיא בָּאָה; a alternativa aspectual “ao chegar” não altera materialmente o sentido.
