- from: e você fez o mal mais do que todos os que vieram antes de você. Você foi e fez para si outros deuses e imagens de metal fundido, para me provocar à ira, e me lançou para trás das costas.
  to: e você fez mais mal do que todos os que vieram antes de você. Você foi e fez para si outros deuses e imagens de metal fundido, para me provocar à ira, e me lançou para trás de si.
  rationale: A revisão limita-se a corrigir a expressão final para uma formulação portuguesa natural que reproduz precisamente a metáfora hebraica. Também se emprega 'fez mais mal', que exprime de modo mais direto a comparação exigida por מִכֹּל. Não é necessária nota de rodapé.
