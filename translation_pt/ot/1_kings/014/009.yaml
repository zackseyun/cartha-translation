base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: pt
  text: e você fez mais mal do que todos os que vieram antes de você. Você foi e fez para si outros deuses e imagens de metal fundido, para me provocar à ira, e me lançou para trás de si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  choice: fez o mal mais do que todos
  rationale: Expressa de modo natural o sentido idiomático de fazer o mal e conserva explicitamente a comparação introduzida por מִכֹּל.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: os que vieram antes de você
  rationale: Torna claro o sentido temporal de לְפָנֶיךָ sem reduzir a referência apenas aos reis, algo não especificado no texto.
- source_word: וַתֵּלֶךְ
  choice: Você foi
  rationale: Preserva a força sequencial enfática do verbo hebraico, embora a expressão seja ligeiramente marcada em português.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: fez para si
  rationale: Conserva o valor reflexivo e benefactivo do dativo hebraico.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a correspondência direta e reconhecível da expressão pactual, sem acrescentar a ideia de origem estrangeira.
- source_word: וּמַסֵּכוֹת
  choice: imagens de metal fundido
  rationale: Explicita de maneira compreensível que se trata de imagens produzidas por fundição, sem reduzir o termo ao genérico 'ídolos'.
- source_word: לְהַכְעִיסֵנִי
  choice: para me provocar à ira
  rationale: Mantém a força causativa do verbo e seu objeto pessoal.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: me lançou para trás das costas
  rationale: Preserva a metáfora corporal forte de rejeição desdenhosa, em vez de substituí-la por uma abstração como 'me desprezou'.
theological_decisions:
- issue: Linguagem da idolatria e natureza dos objetos cultuais
  choice: outros deuses e imagens de metal fundido
  alternative: deuses estrangeiros e ídolos
  rationale: Mantém tanto a categoria teológica de outros deuses quanto a referência concreta a objetos fabricados por fundição, sem acrescentar origem estrangeira nem generalizar o objeto.
- issue: Metáfora da rejeição de Deus
  choice: me lançou para trás das costas
  alternative: não fez caso de mim
  rationale: Conserva a imagem severa e deliberadamente física do hebraico, sem resolver sua força em uma paráfrase abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção 'Você foi e fez' e a imagem 'para trás das costas' permanecem intencionalmente marcadas para conservar a ênfase e a metáfora do hebraico. Não há marcadores de nota porque nenhuma nota é necessária no texto proposto.
