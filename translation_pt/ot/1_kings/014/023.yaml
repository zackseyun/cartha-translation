source:
  edition: WLC
  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: pt
  text: Eles também construíram para si lugares altos, colunas sagradas e postes de Aserá[a] sobre toda colina elevada e debaixo de toda árvore verdejante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “asherins” ou “símbolos sagrados”; o termo hebraico se refere a objetos de culto associados a Aserá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: construíram
  rationale: בנה significa normalmente “construir”. Aqui rege instalações de culto e mantém seu sentido direto e natural em português.
- source_word: גַם הֵמָּה
  choice: eles também
  rationale: Preserva a força aditiva e enfática da expressão, ligando as práticas de Judá aos pecados mencionados no contexto anterior.
- source_word: לָהֶם
  choice: para si
  rationale: 'Expressa o valor reflexivo da preposição com o pronome: eles estabeleceram esses locais e objetos para seu próprio uso.'
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Equivalente tradicional e reconhecível para santuários locais de culto; preserva a terminologia recorrente sem restringi-los necessariamente a simples elevações geográficas.
- source_word: מַצֵּבוֹת
  choice: colunas sagradas
  rationale: O termo designa pedras erguidas com função cultual. “Colunas sagradas” torna essa função explícita e evita que sejam entendidas como meros elementos arquitetônicos.
- source_word: אֲשֵׁרִים
  choice: postes de Aserá
  rationale: Neste conjunto de instalações cultuais, o plural provavelmente se refere a objetos associados à deusa Aserá. A expressão comunica tanto a natureza material provável quanto a associação religiosa, enquanto a nota preserva a incerteza lexical.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: sobre toda colina elevada
  rationale: Reproduz de modo natural a localização topográfica e a força abrangente da fórmula hebraica.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: e debaixo de toda árvore verdejante
  rationale: רַעֲנָן indica uma árvore viçosa, frondosa ou luxuriantemente verde; “verdejante” é atual, digno e mais preciso que apenas “verde”.
theological_decisions:
- issue: Se אֲשֵׁרִים designa a deusa Aserá ou objetos cultuais associados a ela
  choice: objetos cultuais traduzidos como “postes de Aserá”
  alternative: aserins; símbolos sagrados; imagens de Aserá
  rationale: Ao lado de “lugares altos” e “colunas sagradas”, a referência mais provável é a objetos físicos de culto. A tradução mantém a ligação com Aserá, sem identificar dogmaticamente a forma exata desses objetos; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lugares altos” conserva a expressão bíblica técnica; “colunas sagradas” esclarece o caráter cultual; “árvore verdejante” comunica a ideia de viço contida no hebraico.
