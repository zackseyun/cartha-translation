  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: pt
  text: E Yahweh levantará para si um rei sobre Israel, que eliminará a casa de Jeroboão neste mesmo dia[a]. Mas o quê? Mesmo agora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O final hebraico é abrupto e difícil; literalmente, algo como: “e o quê? mesmo agora”. Alguns o entendem como uma exclamação que ressalta a iminência do juízo: “e o quê? mesmo agora!” ou “mas o que mais? já agora”.'
    reason: Leitura alternativa e esclarecimento da sintaxe hebraica incerta.
lexical_decisions:
- source_word: וְהֵקִים
  choice: levantará
  rationale: O hifil de קום pode significar levantar, estabelecer ou suscitar. “Levantará” conserva a imagem hebraica de Deus fazer surgir um governante sem especificar o modo de sua entronização.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לּוֹ
  choice: para si
  rationale: O sufixo pronominal refere-se mais naturalmente ao sujeito, Yahweh; “para si” reproduz a construção reflexiva idiomática.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: um rei sobre Israel
  rationale: Com o vocabulário de governo, עַל expressa domínio e corresponde naturalmente a “sobre”.
- source_word: אֲשֶׁר יַכְרִית
  choice: que eliminará
  rationale: No hifil, כרת pode indicar cortar, exterminar ou eliminar. “Eliminará” comunica com naturalidade a remoção completa aqui anunciada, sem restringi-la a um mecanismo específico.
- source_word: בֵּית יָרָבְעָם
  choice: a casa de Jeroboão
  rationale: “Casa” conserva o termo dinástico da narrativa bíblica e permanece compreensível em português.
- source_word: זֶה הַיּוֹם
  choice: neste mesmo dia
  rationale: Expressa a força enfática de “este dia” em português natural, preservando sua ligação possível com o juízo anunciado.
- source_word: וּמֶה גַּם עָתָּה
  choice: Mas o quê? Até mesmo agora.
  rationale: A formulação mantém o encerramento abrupto e elíptico do hebraico. “Mas” dá voz à possível inflexão adversativa, enquanto “até mesmo agora” representa diretamente גַּם עָתָּה.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da cláusula final וּמֶה גַּם עָתָּה
  choice: 'Preservar a formulação abrupta: “Mas o quê? Até mesmo agora.”'
  alternative: “Mas o que mais? Já agora”; “o juízo já começa agora”
  rationale: A sintaxe é comprimida e de interpretação incerta. Manter a ruptura evita resolver no corpo do texto aquilo que o hebraico deixa ambíguo.
- issue: Alcance de בֵּית יָרָבְעָם
  choice: a casa de Jeroboão
  alternative: a dinastia de Jeroboão
  rationale: “Casa” mantém simultaneamente os sentidos familiar e dinástico, sem explicitar além do necessário.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. Conservou-se “casa” como expressão dinástica bíblica e a estranheza deliberada da cláusula final; a nota apresenta possibilidades sem fixar uma interpretação incerta.
