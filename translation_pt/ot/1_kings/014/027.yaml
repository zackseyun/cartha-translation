  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתָּ֔/ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: pt
  text: Assim, o rei Roboão fez escudos de bronze no lugar deles e os confiou aos comandantes dos corredores[a], que guardavam a entrada da casa do rei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “os comandantes da guarda”. O hebraico diz literalmente “os comandantes dos corredores”, provavelmente um corpo real de guardas ou mensageiros.
    reason: lexical_alternative
  - marker: b
    text: A expressão “casa do rei” refere-se ao palácio real.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה, neste contexto narrativo, significa de modo direto “fazer” ou “produzir”; “fez” é natural e fiel.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: o rei Roboão
  rationale: Esta é a ordem idiomática usual em português para título seguido de nome próprio.
- source_word: תַּחְתָּם
  choice: no lugar deles
  rationale: O sufixo retoma os escudos de ouro levados no versículo anterior e expressa substituição.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: escudos de bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze; “bronze” é a designação contextual mais adequada para esse tipo de artefato antigo.
- source_word: וְהִפְקִיד עַל יַד
  choice: os confiou aos
  rationale: A combinação expressa colocar os escudos sob a responsabilidade de alguém. “Confiou aos” preserva esse sentido em português natural, sem reproduzir mecanicamente o idioma “sobre a mão de”.
- source_word: שָׂרֵי הָרָצִים
  choice: os comandantes dos corredores
  rationale: Mantém a transparência lexical de שָׂרֵי, “comandantes”, e הָרָצִים, literalmente “os corredores”, sem definir de modo excessivo a função desse corpo real.
- source_word: הַשֹּׁמְרִים
  choice: que guardavam
  rationale: A oração relativa reproduz naturalmente o particípio hebraico e sua ideia de função contínua.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: a entrada da casa do rei
  rationale: Preserva a formulação concreta do hebraico; no contexto, “casa do rei” designa o palácio real.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém “corredores” no texto para preservar a expressão hebraica e esclarece sua provável função em nota. Os marcadores foram posicionados junto às expressões que explicam.
