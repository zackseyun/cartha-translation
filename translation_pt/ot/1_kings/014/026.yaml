base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: pt
  text: Ele tomou os tesouros da casa de Yahweh[a] e os tesouros da casa do rei; tomou tudo. Tomou também todos os escudos de ouro que Salomão havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “casa de Yahweh”, isto é, o templo.
    reason: Esclarece a referência da expressão hebraica literal sem apagá-la do texto principal.
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: tomou / levou
  rationale: O verbo לקח significa basicamente “tomar”. A primeira ocorrência e a cláusula resumitiva são vertidas por “tomou”; na última ocorrência, “levou” expressa naturalmente que os escudos foram carregados como despojo, sem intensificar o sentido para “saqueou” ou “apoderou-se”.
- source_word: אֹצְרוֹת
  choice: tesouros
  rationale: No contexto, o que foi tomado foram os bens valiosos guardados, não os depósitos ou edifícios em si.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica literal e o nome divino; a nota esclarece que se trata do templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּית הַמֶּלֶךְ
  choice: casa do rei
  rationale: Mantém a formulação concreta do hebraico; no contexto, refere-se à residência ou ao palácio real.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: tomou tudo
  rationale: Reproduz de modo conciso a força totalizante e enfática da cláusula.
- source_word: מָגִנֵּי הַזָּהָב
  choice: escudos de ouro
  rationale: É uma tradução direta e natural da construção hebraica, sem decidir além do texto se eram objetos cerimoniais.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: que Salomão havia feito
  rationale: O mais-que-perfeito situa adequadamente a fabricação dos escudos antes do saque narrado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição enfática de לקח é preservada em parte, enquanto “levou também” evita rigidez e comunica naturalmente a progressão narrativa.
