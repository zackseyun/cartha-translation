base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: pt
  text: Judá fez o que era mau aos olhos de Yahweh e eles provocaram o seu ciúme[a] mais do que tudo o que seus antepassados haviam feito, com os pecados que cometeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “despertaram o seu ciúme” ou “fizeram com que ele tivesse ciúme”. O hebraico emprega a linguagem do ciúme da aliança para descrever a reação de Yahweh à infidelidade de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Judá
  rationale: Nome próprio do reino e de seu povo, usado coletivamente; isso explica a passagem do verbo no singular para o plural no hebraico.
- source_word: הָרַע
  choice: o que era mau
  rationale: Expressa com naturalidade a construção idiomática hebraica עשה + הרע, preservando seu caráter avaliativo.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica de avaliação divina e representa diretamente o nome próprio יהוה.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: provocou o seu ciúme
  rationale: O sujeito coletivo 'Judá' permite o singular natural em português; a formulação conserva a linguagem de ciúme da aliança, sem reduzi-la a mera ira.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: mais do que tudo o que seus antepassados haviam feito
  rationale: Transmite a comparação marcada por מן e entende אבות no sentido contextual de antepassados, mais claro no português atual.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: com os pecados que cometeram
  rationale: Preserva o valor instrumental de בְּ e verte naturalmente a combinação enfática de substantivo e verbo cognatos.
theological_decisions:
- issue: Linguagem do ciúme divino
  choice: provocou o seu ciúme
  alternative: despertou o seu ciúme; fez com que ele tivesse ciúme
  rationale: Conserva a categoria bíblica do ciúme de Yahweh diante da infidelidade da aliança, sem substituí-la por ira nem sugerir inveja pecaminosa.
- issue: Representação do tetragrama יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A forma pessoal 'Yahweh' representa o nome divino no texto hebraico e evita confundi-lo com o título 'Senhor'.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. 'Antepassados' é preferido a 'pais' para evitar ambiguidade; a mudança hebraica de Judá singular para verbos plurais é harmonizada naturalmente pelo uso coletivo do nome.
