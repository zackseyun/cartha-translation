  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: pt
  text: 'Vá e diga a Jeroboão: “Assim diz Yahweh, o Deus de Israel: ‘Visto que eu te elevei[a] do meio do povo e te constituí governante[b] sobre o meu povo Israel,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exaltei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “te designei líder”. O hebraico diz literalmente: “eu te dei como governante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: Vá e diga
  rationale: Os dois imperativos femininos dirigem a destinatária a levar a mensagem; a forma de tratamento com “vá” e “diga” é natural e coerente em português moderno.
- source_word: לְיָרָבְעָם
  choice: a Jeroboão
  rationale: A preposição לְ marca o destinatário da mensagem, e o nome recebe sua forma tradicional em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética solene e reconhecível, sem deixar de ser clara em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção que identifica Yahweh como o Deus de Israel.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz com clareza a causa que fundamenta a declaração de juízo subsequente e mantém a frase aberta para sua continuação.
- source_word: הֲרִימֹתִיךָ
  choice: eu o elevei
  rationale: O hifil de רום descreve a elevação de Jeroboão a uma posição superior; “elevei” conserva tanto a metáfora vertical quanto o sentido político.
- source_word: מִתּוֹךְ הָעָם
  choice: do meio do povo
  rationale: Mantém de modo natural a ideia de que Jeroboão foi escolhido dentre o próprio povo.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: e o constituí governante
  rationale: A expressão significa literalmente que Deus o “deu como governante”; “constituí governante” comunica naturalmente a nomeação para uma função de autoridade.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sobre o meu povo Israel
  rationale: Preserva a autoridade exercida sobre Israel e o possessivo divino “meu povo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Sentido político de נָגִיד
  choice: governante
  alternative: líder; príncipe
  rationale: O termo designa alguém posto em autoridade por nomeação divina. “Governante” expressa a função oficial sem sugerir necessariamente um título dinástico específico.
- issue: Forma de tratamento na fala dirigida a Jeroboão
  choice: o elevei; o constituí
  alternative: te elevei; fiz de você
  rationale: A forma pronominal escolhida concorda com os imperativos formais “vá” e “diga”, mantendo dignidade e ampla inteligibilidade sem alterar a segunda pessoa do discurso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a fórmula profética “Assim diz” e a estrutura sintática incompleta do versículo, que prossegue no contexto. Os marcadores foram colocados junto às expressões a que suas notas realmente se referem.
