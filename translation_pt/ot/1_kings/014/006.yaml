base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: pt
  text: 'Quando Aías ouviu o som dos passos dela ao chegar à entrada, disse: “Entre, esposa de Jeroboão. Por que você está se disfarçando?[a] Eu fui enviado a você com uma mensagem dura[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que você está fingindo ser outra pessoa?”'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Eu fui enviado a você [com algo] duro”. O hebraico não expressa o substantivo, mas sugere uma mensagem ou notícia severa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: o som dos passos dela
  rationale: Expressa naturalmente em português o ruído produzido pelos pés ao caminhar, preservando a imagem concreta do hebraico.
- source_word: בָּאָה בַפֶּתַח
  choice: ao chegar à entrada
  rationale: Representa a ação simultânea e entende פֶּתַח como entrada ou abertura, sem pressupor a porta física.
- source_word: בֹּאִי
  choice: Entre
  rationale: Imperativo feminino singular, claro e natural no contexto de alguém que chega à entrada.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: mulher de Jeroboão
  rationale: Na forma de tratamento, identifica diretamente a esposa do rei e mantém de perto a construção hebraica; em português bíblico corrente, “mulher de” pode significar “esposa de” sem soar excessivamente técnico.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: Por que você está se disfarçando?
  rationale: O hitpael de נכר indica fazer-se irreconhecível ou passar por outra pessoa; “disfarçando” corresponde ao contexto narrativo e é imediatamente compreensível.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: Eu fui enviado a você
  rationale: O particípio passivo apresenta Aías como alguém enviado ou incumbido de uma missão. A formulação portuguesa é natural e não explicita o remetente, que permanece implícito no versículo.
- source_word: קָשָׁה
  choice: com uma mensagem dura
  rationale: O adjetivo feminino aparece sem substantivo expresso. “Mensagem” torna a elipse inteligível em português, enquanto “dura” preserva a concisão e a severidade do hebraico.
theological_decisions:
- issue: Objeto implícito depois de קָשָׁה (“dura”)
  choice: 'Suprir “mensagem”: “com uma mensagem dura”'
  alternative: “com notícias dolorosas” ou “para uma tarefa difícil”
  rationale: O contexto profético favorece uma comunicação severa dirigida à mulher de Jeroboão. “Mensagem” é uma explicitação mínima e evita definir o pronunciamento por uma categoria teológica mais estreita que o texto.
- issue: Agente não expresso de שָׁלוּחַ (“enviado”)
  choice: Manter o agente implícito
  alternative: “Deus me enviou a você”
  rationale: Embora o contexto indique origem divina, este enunciado não nomeia quem enviou Aías; a tradução conserva essa característica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita solenidade artificial; “Jeroboão” segue a forma tradicional portuguesa. A redação conserva a elipse hebraica por meio de nota e não explicita indevidamente quem enviou o profeta.
