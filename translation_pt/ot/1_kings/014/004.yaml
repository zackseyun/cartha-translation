revisions:
- from: A mulher de Jeroboão fez o que ele havia dito. Levantou-se, foi a Siló e chegou à casa de Aías. Aías não conseguia enxergar, pois seus olhos haviam perdido a visão por causa da velhice.[a]
  to: A mulher de Jeroboão fez isso. Levantou-se, foi a Siló e chegou à casa de Aías. Aías não conseguia enxergar, pois seus olhos haviam enfraquecido por causa da velhice.[a]
  rationale: A revisão elimina a explicitação indevida de “ele” e substitui uma expressão portuguesa pouco natural por uma formulação que transmite o efeito do idiomatismo hebraico. A nota mantém a imagem literal e indica com cautela seu sentido contextual.
