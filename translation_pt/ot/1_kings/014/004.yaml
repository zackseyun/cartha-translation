base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: pt
  text: A mulher de Jeroboão fez isso. Levantou-se, foi a Siló e chegou à casa de Aías. Aías não conseguia enxergar, pois seus olhos haviam enfraquecido por causa da velhice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “seus olhos tinham parado por causa da velhice”, uma expressão que descreve o enfraquecimento ou a perda da visão na idade avançada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: fez o que ele havia dito
  rationale: A fórmula narrativa significa que ela agiu conforme a instrução anterior. A explicitação do referente de 'assim' produz português natural sem acrescentar conteúdo substancial.
- source_word: וַתָּקָם
  choice: levantou-se
  rationale: Preserva a sequência narrativa e corresponde de modo natural ao verbo de levantar-se antes de partir.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: foi a Siló
  rationale: Tradução direta do verbo de movimento e do destino, em linguagem corrente e digna.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: chegou à casa de Aías
  rationale: O sintagma indica a chegada à casa, sem exigir que a tradução afirme explicitamente a entrada no interior.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: não conseguia enxergar
  rationale: Expressa naturalmente em português a incapacidade visual contínua de Aías no contexto.
- source_word: קָמוּ עֵינָיו
  choice: seus olhos haviam perdido a visão
  rationale: O hebraico diz literalmente que os olhos 'pararam/ficaram', expressão contextual de perda da capacidade visual na velhice. A formulação comunica o sentido sem sugerir apenas visão turva.
- source_word: מִשֵּׂיבוֹ
  choice: por causa da velhice
  rationale: O מִן marca aqui a causa ligada à idade avançada; a expressão é clara e idiomática em português.
