base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: pt
  text: No quinto ano do rei Roboão, Sisaque, rei do Egito, subiu contra Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “avançou contra Jerusalém”. O idioma hebraico usa “subir” para um avanço militar, especialmente em direção a uma cidade importante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[não expresso separadamente]'
  rationale: A forma narrativa introduz o acontecimento; em português moderno, sua função discursiva é transmitida naturalmente pela própria oração, sem acrescentar “e aconteceu”.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית
  choice: No quinto ano
  rationale: É a forma corrente e digna de reproduzir a datação pelo ano de reinado.
- source_word: לַמֶּלֶךְ רְחַבְעָם
  choice: do rei Roboão
  rationale: O lamed integra a fórmula de datação e remete ao reinado de Roboão; a expressão portuguesa comunica isso sem explicitação desnecessária.
- source_word: עָלָה
  choice: subiu contra
  rationale: Preserva a imagem direcional do hebraico e, com “contra”, comunica o avanço militar sem afirmar mais especificamente que o ataque já havia começado.
- source_word: שושק
  choice: Sisaque
  rationale: Emprega a forma tradicional portuguesa correspondente ao nome hebraico, em vez da reconstrução histórica egípcia “Shoshenq”.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: rei do Egito
  rationale: Reproduz naturalmente a aposição que identifica o cargo e o reino de Sisaque.
- source_word: עַל יְרוּשָׁלִָם
  choice: contra Jerusalém
  rationale: Com o verbo de movimento neste contexto militar, עַל tem sentido adversativo; “contra” preserva claramente essa hostilidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com pontuação em aposição para “Sisaque, rei do Egito”. A formulação mantém o idioma espacial hebraico sem recorrer ao arcaísmo “sucedeu que” nem tornar o verbo mais específico como “atacou”.
