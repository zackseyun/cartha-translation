  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: pt
  text: E Yahweh ferirá Israel, como o junco se agita nas águas; arrancará Israel desta boa terra que deu aos antepassados deles e os espalhará para além do Rio[a], porque fizeram seus asherim[b], provocando a ira de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para além do Eufrates”; neste contexto, “o Rio” se refere ao rio Eufrates.
    reason: cross_reference
  - marker: b
    text: 'Hebraico “seus asherim”, plural de “asherah”: objetos de culto associados à deusa Aserá, muitas vezes entendidos como postes de madeira ou imagens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: ferirá
  rationale: O perfeito com waw em discurso profético tem sentido futuro. “Ferirá” expressa de modo claro e digno o juízo divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: fazendo-o oscilar como o junco nas águas
  rationale: A construção liga o golpe contra Israel à imagem do junco instável. “Oscilar” preserva o movimento sem especificar uma causa que o hebraico não explicita.
- source_word: וְנָתַשׁ
  choice: Arrancará
  rationale: O verbo descreve retirar pela raiz; “arrancar” conserva a imagem agrícola e se ajusta à expulsão da terra.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: desta boa terra
  rationale: Reproduz de forma natural a referência à terra concedida por Deus e mantém sua qualificação como boa.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: que deu aos antepassados deles
  rationale: “Antepassados” comunica naturalmente o sentido coletivo de אָבוֹת no português atual, sem limitar a referência aos pais imediatos.
- source_word: וְזֵרָם
  choice: e os espalhará
  rationale: Expressa a dispersão decorrente do exílio sem introduzir a imagem mais específica e incerta de joeirar.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: para além do Rio
  rationale: Mantém a designação hebraica convencional “o Rio”; a nota identifica seu referente histórico.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: fizeram seus asherim
  rationale: A transliteração preserva a indefinição quanto à forma exata desses objetos de culto associados a Aserá; a nota fornece a explicação necessária.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: provocando Yahweh à ira
  rationale: Torna explícito em português o componente de ira contido no verbo הכעיס e mantém a relação causal com a idolatria.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o nome pactual; a transliteração o preserva sem substituí-lo por um título.
- issue: Identificação de “o Rio”
  choice: Manter “o Rio” no texto e identificar o Eufrates em nota
  alternative: Traduzir diretamente “o Eufrates”
  rationale: A redação principal conserva a expressão do hebraico, enquanto a nota dá ao leitor moderno a referência geográfica.
- issue: Natureza dos אֲשֵׁרִים
  choice: asherim, com explicação em nota
  alternative: postes de Aserá; imagens de Aserá; símbolos de Aserá
  rationale: A forma material exata dos objetos pode variar ou permanecer incerta. A transliteração evita apresentar “postes” ou “imagens” como identificação incontestável.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “Israel” acompanha a ênfase do hebraico; o pronome em “fazendo-o oscilar” explicita que Israel é comparado ao junco. Os termos técnicos inevitáveis são explicados em notas.
