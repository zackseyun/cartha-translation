base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: pt
  text: 'Jeroboão disse à sua esposa: “Por favor, levante-se, disfarce-se para que não saibam que você é a esposa de Jeroboão e vá a Siló. Lá está o profeta Aías. Foi ele quem falou a meu respeito[a], que eu seria rei sobre este povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falou a meu respeito para eu ser rei sobre este povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” é natural e fiel em português.
- source_word: לְאִשְׁתּוֹ
  choice: à sua mulher
  rationale: A expressão indica claramente a esposa de Jeroboão; “mulher” é corrente no português bíblico e moderno nesse contexto.
- source_word: קוּמִי נָא
  choice: Por favor, levante-se
  rationale: Preserva o imperativo e a nuance de pedido expressa por נָא, sem arcaísmo.
- source_word: וְהִשְׁתַּנִּית
  choice: disfarce-se
  rationale: O hitpael de שנה indica aqui alterar a própria aparência para não ser reconhecida.
- source_word: וְלֹא יֵדְעוּ
  choice: para que não saibam
  rationale: Expressa naturalmente a finalidade do disfarce e mantém indefinido o sujeito plural do hebraico.
- source_word: כִּי אַתְּ אֵשֶׁת יָרָבְעָם
  choice: que você é a mulher de Jeroboão
  rationale: Reproduz a construção relacional do hebraico em português claro.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: e vá a Siló
  rationale: O perfeito consecutivo tem força instrutiva após os imperativos; a forma imperativa é natural em português.
- source_word: הִנֵּה שָׁם
  choice: Lá está
  rationale: A construção chama a atenção para a presença do profeta naquele lugar; “Lá está” preserva a deixis com naturalidade.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: o profeta Aías
  rationale: Usa a forma portuguesa tradicional e amplamente reconhecível do nome, com o título em ordem natural.
- source_word: הוּא דִבֶּר
  choice: Foi ele quem falou
  rationale: A construção clivada preserva a ênfase do pronome independente הוּא.
- source_word: עָלַי
  choice: a meu respeito
  rationale: 'Com דבר, a preposição על pode indicar o assunto da fala: “acerca de mim” ou “a meu respeito”.'
- source_word: לְמֶלֶךְ
  choice: que eu seria rei
  rationale: No contexto da palavra profética, a expressão indica a condição ou resultado de Jeroboão tornar-se rei; esta formulação é clara sem eliminar a ligação sintática alternativa.
theological_decisions:
- issue: Relação sintática de עָלַי לְמֶלֶךְ
  choice: “falou a meu respeito, que eu seria rei”
  alternative: “falou que eu seria rei sobre este povo” ou “falou a meu respeito para ser rei”
  rationale: O texto hebraico é compacto, e לְמֶלֶךְ pode ser entendido como conteúdo ou resultado ligado à palavra profética acerca de Jeroboão. A tradução principal mantém a formulação próxima do hebraico, e a nota registra uma alternativa natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Evitaram-se formas arcaicas como “ergue-te” e “eis”. O sujeito indefinido de וְלֹא יֵדְעוּ foi mantido em “não saibam”. O único marcador [a] aparece no texto principal.
