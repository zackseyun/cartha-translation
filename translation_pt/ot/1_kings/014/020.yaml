base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: pt
  text: Jeroboão reinou durante vinte e dois anos. Depois, deitou-se com seus antepassados[a], e seu filho Nadabe tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “dormiu com seus antepassados”. Esta expressão hebraica refere-se à morte numa fórmula de sucessão real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: reinou durante
  rationale: A fórmula hebraica resume a duração do reinado. Em português corrente, a construção verbal direta comunica naturalmente o sentido sem reproduzir de modo rígido «os dias em que reinou».
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: vinte e dois anos
  rationale: Forma numeral idiomática no português moderno.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: Mantém a imagem eufemística da fórmula hebraica de morte, com linguagem digna e compreensível, sem acrescentar sepultamento nem formular uma doutrina sobre o estado dos mortos.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: No contexto da sucessão, expressa claramente a ascensão ao trono, não apenas o exercício continuado do reinado.
- source_word: נָדָב בְּנוֹ
  choice: seu filho Nadabe
  rationale: Ordem natural em português, preservando explicitamente a relação filial.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa de maneira clara a substituição e sucessão reais indicadas pelo hebraico.
theological_decisions:
- issue: Expressão idiomática de morte na fórmula régia
  choice: descansou com seus antepassados
  alternative: morreu; dormiu com seus antepassados
  rationale: A tradução conserva o caráter figurado da expressão hebraica sem reduzi-la simplesmente a «morreu». «Dormiu com» seria mais literal e tradicional, mas pode soar ambíguo no português atual; a nota registra essa forma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação direta evita um decalque pouco natural da abertura hebraica, enquanto a nota preserva sua metáfora tradicional.
