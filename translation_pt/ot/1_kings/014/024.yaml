  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: pt
  text: Também havia prostitutos cultuais na terra[a]. Eles agiam de acordo com todas as abominações das nações que Yahweh havia expulsado de diante dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prostituto cultual” ou, possivelmente, “homem ligado a um culto pagão”. O hebraico קָדֵשׁ está no singular masculino e pode ter sentido coletivo neste contexto. Tradicionalmente é entendido como alguém associado a práticas sexuais cultuais ilícitas, embora a natureza exata dessas práticas seja debatida.
    reason: Preserva o singular masculino e o provável sentido coletivo, ao mesmo tempo que registra a incerteza histórica e lexical quanto à natureza precisa da função ou prática indicada.
lexical_decisions:
- source_word: וְגַם
  choice: Também havia
  rationale: Integra o elemento aditivo à construção existencial em português natural, mantendo a ideia de mais uma acusação contra Judá.
- source_word: קָדֵשׁ
  choice: prostitutos cultuais
  rationale: O substantivo masculino singular aparece numa construção existencial e pode representar coletivamente uma classe de pessoas ligadas a práticas cultuais ilícitas. O plural é mais natural em português; a nota preserva o singular e as alternativas lexicais.
- source_word: הָיָה בָאָרֶץ
  choice: havia ... na terra
  rationale: Expressa de modo idiomático o valor existencial de היה com a indicação de lugar.
- source_word: עָשׂוּ
  choice: Eles praticaram
  rationale: Em português, “praticaram” combina naturalmente com “abominações” e comunica ação habitual ou efetiva sem especificar práticas além do que o contexto afirma.
- source_word: כְּכֹל הַתּוֹעֲבֹת
  choice: todas as abominações
  rationale: A formulação portuguesa comunica que eles se conformaram ao conjunto das práticas condenadas; “abominações” preserva o forte peso moral e religioso de תּוֹעֲבֹת.
- source_word: הַגּוֹיִם
  choice: das nações
  rationale: Refere-se aos povos não israelitas de Canaã sem introduzir as conotações posteriores de “gentios”.
- source_word: הוֹרִישׁ
  choice: havia expulsado
  rationale: O hifil de ירשׁ indica que Yahweh removeu e desapossou os habitantes anteriores; “expulsado” é claro e adequado ao contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino da aliança, em conformidade com a prática do projeto.
- source_word: מִפְּנֵי
  choice: de diante de
  rationale: Preserva a imagem hebraica de remoção da presença ou do caminho de alguém e permanece compreensível em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma familiar e masculina do hebraico, que funciona aqui como designação étnica tradicional.
theological_decisions:
- issue: Sentido de קָדֵשׁ no contexto de culto ilícito
  choice: prostitutos cultuais
  alternative: prostituto cultual; prostituto de templo
  rationale: A tradução comunica a associação dessas pessoas com práticas cultuais e sexuais proibidas, sem recorrer ao tradicional “sodomitas”, que introduziria associações não exigidas pelo termo hebraico. A nota conserva a forma singular e alternativas possíveis.
- issue: Referente do plural עָשׂוּ
  choice: Eles praticaram
  alternative: Praticaram
  rationale: O plural retoma de modo amplo os habitantes de Judá no contexto, não necessariamente apenas os prostitutos cultuais. A tradução mantém o pronome sem resolver mais precisamente um referente que o versículo não explicita.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A expressão familiar do original foi mantida, embora funcione como etnônimo coletivo.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração distingue o nome próprio divino e segue a convenção do projeto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Prostitutos cultuais” evita tanto o arcaísmo quanto a tradução tradicional enganosa “sodomitas”. A construção “de diante dos filhos de Israel” conserva deliberadamente a imagem e a forma familiar do hebraico.
