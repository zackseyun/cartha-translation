  yaml_path: translation/ot/1_kings/014/030.yaml
  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: pt
  text: Houve guerra entre Roboão e Jeroboão durante todos os seus dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “todos os dias”. A expressão indica que o conflito persistiu ao longo da vida ou do reinado deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Houve guerra
  rationale: A construção com מִלְחָמָה e a forma de היה expressa a existência de um estado de guerra. “Houve guerra” é direto e natural em português; o ו inicial pode ser representado pela continuidade narrativa sem a necessidade de um “e” explícito neste versículo isolado.
- source_word: בֵין ... וּבֵין
  choice: entre ... e
  rationale: A preposição correlativa indica oposição recíproca entre duas partes; “entre ... e” é seu equivalente natural em português.
- source_word: רְחַבְעָם
  choice: Roboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כָּל הַיָּמִים
  choice: durante todos os seus dias
  rationale: Literalmente, “todos os dias”. O possessivo plural é inferido do contexto, que menciona os dois reis, e mantém aberta a referência aos dias de sua vida ou de seu reinado.
