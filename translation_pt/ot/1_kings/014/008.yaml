id: 1KI.14.8
reference: 1 Kings 14:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: pt
  text: e arranquei o reino da casa de Davi e o dei a você. Mas você não foi como o meu servo Davi, que guardou os meus mandamentos e me seguiu de todo o coração[a], fazendo somente o que era certo aos meus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “andou após mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: arranquei
  rationale: Preserva a imagem vigorosa de קרע, aqui aplicada à retirada do reino, e soa natural em português.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: Designa naturalmente o domínio político ou reino no contexto.
- source_word: מִבֵּית דָּוִד
  choice: da casa de Davi
  rationale: Mantém a expressão dinástica hebraica; uma nota esclarece seu sentido.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: e o dei a você
  rationale: Expressa a ação passada da sequência narrativa; o pronome retoma 'o reino'.
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: Mas você não foi como o meu servo Davi
  rationale: A forma passada é natural no contexto da acusação e 'servo' preserva o título honorífico e pactual.
- source_word: שָׁמַר מִצְוֺתַי
  choice: guardou os meus mandamentos
  rationale: Formulação portuguesa corrente para a obediência aos mandamentos, conservando o valor pactual de שׁמר.
- source_word: הָלַךְ אַחֲרַי
  choice: me seguiu
  rationale: Traduz naturalmente o idioma hebraico literal 'andou após mim'; a forma literal é registrada em nota.
- source_word: בְּכָל לְבָבוֹ
  choice: de todo o coração
  rationale: Equivalente idiomático natural para devoção interior integral.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינַי
  choice: fazendo somente o que era certo aos meus olhos
  rationale: Conserva רַק ('somente') e a imagem avaliativa 'aos meus olhos', enquanto liga o infinitivo de modo natural à descrição anterior.
theological_decisions:
- issue: A avaliação de Davi como exemplo apesar dos pecados narrados em outros textos
  choice: Manter sem ressalvas a avaliação pactual expressa neste versículo.
  alternative: Acrescentar qualificações como 'em geral' ou 'na maior parte das vezes'.
  rationale: O versículo contrapõe diretamente Davi a Jeroboão. Inserir ressalvas harmonizadoras reduziria a força retórica e resolveria uma tensão que o próprio texto bíblico deixa presente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A metáfora forte de arrancar o reino e o idioma 'aos meus olhos' foram preservados; o hebraísmo menos natural 'andou após mim' foi traduzido no texto e registrado em nota.
