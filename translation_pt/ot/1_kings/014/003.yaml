translation:
  language: pt
  text: Leve na mão dez pães, alguns bolos e um frasco de mel, e vá até ele. Ele lhe dirá o que acontecerá com o menino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: dez pães
  rationale: A expressão indica dez unidades de pão; em português, “dez pães” é natural e preserva a contagem do hebraico.
- source_word: נִקֻּדִים
  choice: alguns bolos
  rationale: O termo designa produtos de panificação, provavelmente bolos ou pães marcados; “alguns bolos” comunica a categoria sem alegar uma forma específica incerta.
- source_word: בַקְבֻּק דְּבַשׁ
  choice: um pote de mel
  rationale: “Pote” traduz naturalmente o recipiente, enquanto “mel” mantém a designação ampla do hebraico.
- source_word: לַנָּעַר
  choice: com o menino
  rationale: Neste contexto, נַעַר se refere ao filho jovem cuja sorte seria anunciada.
theological_decisions:
- issue: Caráter da declaração profética
  choice: “Ele lhe dirá o que acontecerá”
  alternative: “Ele lhe declarará o que será”
  rationale: A formulação mantém a afirmação direta do texto sobre o conhecimento do profeta, sem explicar o mecanismo nem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. “Leve com você” expressa de modo idiomático a instrução hebraica literalmente formulada como levar “em sua mão”.
