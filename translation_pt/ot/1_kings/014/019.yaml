base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: pt
  text: Os demais atos de Jeroboão[a], como guerreou e como reinou, eis que estão escritos[b] no Livro das Crônicas dos Reis de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “o restante dos assuntos de Jeroboão”. Nesta fórmula de encerramento de reinado, “atos” indica seus feitos e assuntos registrados.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz uma expressão apresentativa: “eis que estão escritos”, chamando a atenção para o registro escrito.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, anais oficiais da monarquia, não o livro bíblico de 1–2 Crônicas.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: O restante dos atos
  rationale: Na fórmula de encerramento de reinado, דִּבְרֵי abrange os feitos e assuntos registrados do rei; “atos” comunica esse sentido de modo natural, enquanto וְיֶתֶר indica o restante.
- source_word: אֲשֶׁר נִלְחַם
  choice: como guerreou
  rationale: נלחם descreve a atividade militar de Jeroboão. “Como guerreou” preserva a formulação resumitiva e o paralelismo com a oração seguinte.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: e como reinou
  rationale: מלך significa aqui exercer o reinado; a tradução mantém o paralelismo sintático do hebraico.
- source_word: הִנָּם כְּתוּבִים
  choice: está escrito
  rationale: Em português, o sujeito coletivo singular “o restante” pede naturalmente “está escrito”. A força apresentativa de הִנָּם não recebe um equivalente lexical rígido, evitando o pouco natural “eis que eles estão escritos”; ela é explicada em nota.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa ser literalmente “sobre”, a expressão documental portuguesa idiomática é “escrito no livro”.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Livro das Crônicas dos Reis de Israel
  rationale: A expressão designa os anais históricos da monarquia de Israel. A forma titular tradicional é clara e natural, desde que uma nota evite confusão com o livro bíblico de Crônicas.
