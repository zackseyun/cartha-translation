  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais atos de Roboão e tudo o que ele fez não estão escritos no Livro das Crônicas[a] dos Reis de Judá?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos Anais dos Reis de Judá”. A expressão hebraica traduzida por “Crônicas” se refere a um registro régio de acontecimentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: Os demais atos de Roboão
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula historiográfica, refere-se aos atos ou assuntos do reinado, não apenas a palavras faladas. “Os demais atos” é natural e preserva o sentido.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta que mantém a amplitude de עָשָׂה sem acrescentar avaliação moral ou ideia específica de realização.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica negativa, que espera resposta afirmativa, e mantém o valor passivo de כְתוּבִים.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora a expressão seja literalmente “sobre/no rolo”, “no Livro” é a forma idiomática em português para referência documental.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: das Crônicas dos Reis de Judá
  rationale: Nesta fórmula de citação de fonte régia, דִּבְרֵי הַיָּמִים designa um registro cronístico ou analístico. A construção com לְ é adequadamente expressa pelo título “dos Reis de Judá”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada ao uso natural do português, sem acrescentar um marcador temporal inexistente no hebraico. O marcador da nota foi colocado junto a “Crônicas”, termo ao qual a alternativa lexical se refere.
