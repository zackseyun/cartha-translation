base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: pt
  text: E sempre que o rei entrava na casa de Yahweh[a], os guardas[b] levavam os escudos e depois os devolviam à sala dos guardas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh é o nome pessoal de Deus representado no hebraico pelas quatro consoantes YHWH.
    reason: divine_name
  - marker: b
    text: 'Hebraico: “os corredores”; neste contexto da corte real, o termo se refere aos guardas ou à escolta pessoal do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: E, sempre que ... entrava
  rationale: A construção מִדֵּי com o infinitivo expressa ocorrência habitual e repetida; “sempre que ... entrava” reproduz naturalmente esse valor no passado.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica para o santuário e translitera o nome divino pessoal יהוה.
- source_word: יִשָּׂאוּם
  choice: levavam os escudos
  rationale: O imperfeito tem valor habitual neste contexto. O objeto pronominal retoma os escudos de bronze do versículo anterior; explicitá-lo evita uma referência pouco clara em português.
- source_word: הָרָצִים
  choice: os guardas
  rationale: Literalmente “os corredores”, mas, no contexto da corte real, o termo designa guardas ou membros da escolta do rei.
- source_word: וֶהֱשִׁיבוּם
  choice: e depois os devolviam
  rationale: O hifil de שוב indica fazer voltar ou devolver. “Depois” torna clara a sequência repetida sem alterar seu sentido.
- source_word: אֶל תָּא הָרָצִים
  choice: à sala dos guardas
  rationale: תָּא designa um aposento ou sala; a formulação mantém a relação possessiva do hebraico em português natural.
