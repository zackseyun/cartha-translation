base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: pt
  text: Roboão descansou com seus antepassados e foi sepultado com eles na Cidade de Davi. O nome de sua mãe era Naamá, a amonita[a]. E Abião[b], seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega um gentílico feminino, identificando Naamá explicitamente como amonita.
    reason: lexical_alternative
  - marker: b
    text: Em outras passagens, o mesmo rei é chamado Abias; neste versículo, o texto hebraico traz especificamente a forma Abião.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão hebraica é uma fórmula de morte régia. “Descansou” conserva a imagem e o caráter solene sem a possível ambiguidade moderna de “dormiu com”; “antepassados” comunica o alcance dinástico de אֲבֹתָיו.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: foi sepultado com eles
  rationale: Traduz diretamente a forma passiva de קבר; “com eles” evita repetição pesada e retoma claramente os antepassados.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Forma consagrada e clara do topônimo régio.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Reproduz de modo natural a fórmula que identifica a mãe do rei.
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: Naamá, a amonita
  rationale: O gentílico hebraico está no feminino; “a amonita” expressa naturalmente em português tanto a origem quanto o gênero, sem acrescentar “mulher”.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Equivalente direto de מלך na fórmula de sucessão régia.
- source_word: אֲבִיָּם
  choice: Abião
  rationale: Reflete a forma específica Abijam presente no texto hebraico deste versículo, distinguindo-a da forma Abias encontrada em outras passagens.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa com naturalidade a substituição e a sucessão no trono.
theological_decisions: []
