  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula régia hebraica foi preservada sem recorrer ao pouco natural e potencialmente ambíguo “dormiu com seus pais”. Os marcadores foram posicionados junto aos termos efetivamente explicados pelas notas.
