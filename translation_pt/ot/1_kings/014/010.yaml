  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: pt
  text: Por isso, eis que trarei desgraça sobre a casa de Jeroboão. Eliminarei da casa de Jeroboão todo homem[a], escravo ou livre[b], em Israel, e varrerei a casa de Jeroboão, como se varre o esterco até não sobrar nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “o que urina contra a parede”, expressão grosseira que se refere aos indivíduos do sexo masculino.
    reason: lexical_alternative
  - marker: b
    text: O sentido exato da expressão hebraica é incerto. Pode significar “escravo e livre” e provavelmente abrange todos, sem exceção.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: desgraça
  rationale: No contexto do oráculo de juízo, indica calamidade trazida contra a dinastia, e não maldade moral; “desgraça” conserva a gravidade e soa natural em português.
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: כרת expressa a extinção das pessoas e da linhagem; “eliminarei” comunica com clareza o resultado do juízo, sem enfraquecê-lo.
- source_word: מַשְׁתִּין בְּקִיר
  choice: todo homem
  rationale: A expressão hebraica, literalmente grosseira, designa os indivíduos do sexo masculino; a tradução comunica o referente, e a nota preserva a forma do idioma.
- source_word: עָצוּר וְעָזוּב
  choice: tanto escravo como livre
  rationale: A fórmula é obscura e provavelmente constitui um merismo de totalidade. Esta opção conserva a distinção social tradicionalmente entendida, deixando a incerteza explícita em nota.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: varrerei os que restarem da casa de Jeroboão
  rationale: A construção inclui אַחֲרֵי, aqui entendida como “o que resta depois de”; “varrerei” se ajusta à comparação com a remoção completa do esterco e evita o sentido pouco natural de queimá-lo.
- source_word: הַגָּלָל
  choice: esterco
  rationale: Mantém a imagem gráfica e depreciativa do hebraico sem suavizar o oráculo.
- source_word: עַד תֻּמּוֹ
  choice: até não sobrar nada
  rationale: Expressa de modo natural a remoção total indicada pela locução hebraica.
theological_decisions:
- issue: Preservação da severidade do juízo divino
  choice: 'Linguagem direta: “trarei desgraça”, “eliminarei” e “até não sobrar nada”'
  alternative: Suavizar com termos como “dificuldade” ou “afastarei”
  rationale: O hebraico apresenta um anúncio deliberadamente severo de extinção dinástica; a tradução não deve atenuar sua força.
- issue: Alcance da fórmula עָצוּר וְעָזוּב
  choice: “tanto escravo como livre”, com nota de incerteza
  alternative: “preso e solto”, “protegido e abandonado” ou uma generalização sem distinções
  rationale: A expressão é debatida. A formulação escolhida preserva a leitura merística tradicional, enquanto a nota evita apresentá-la como indiscutível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com clareza brasileira. A ordem foi dividida em duas frases para legibilidade. A imagem depreciativa do esterco foi mantida; ambiguidades lexicais relevantes foram registradas em notas.
