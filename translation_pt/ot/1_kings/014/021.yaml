source:
  edition: WLC
  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: pt
  text: Roboão, filho de Salomão, reinou em Judá[a]. Roboão tinha quarenta e um anos quando se tornou rei e reinou dezessete anos em Jerusalém, a cidade que Yahweh havia escolhido dentre todas as tribos de Israel para pôr ali o seu nome[b]. O nome de sua mãe era Naamá, a amonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reinou sobre Judá”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pôr o seu nome ali”, expressão pactual referente ao lugar especialmente associado à presença e ao culto de Yahweh.'
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo descreve o exercício do governo real; “reinou” é a forma portuguesa natural e precisa nas duas ocorrências.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: Preserva o valor comum da preposição ב e é natural em português; “sobre Judá” continua sendo uma alternativa contextual possível.
- source_word: בְּמָלְכוֹ
  choice: quando se tornou rei
  rationale: A construção com infinitivo marca o momento da ascensão ao trono, distinguindo-o da duração do reinado.
- source_word: הָעִיר אֲשֶׁר בָּחַר יְהוָה
  choice: a cidade que Yahweh havia escolhido
  rationale: A oração identifica Jerusalém pela escolha divina; o mais-que-perfeito composto expressa naturalmente a anterioridade dessa escolha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: para ali estabelecer o seu nome
  rationale: Mantém a imagem hebraica e seu sentido cultual e pactual, com formulação natural em português, sem expandi-la para “fazer habitar”.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dentre todas as tribos de Israel
  rationale: A preposição indica seleção a partir do conjunto das tribos; “dentre” explicita esse valor com precisão.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Reproduz de modo digno e natural a fórmula biográfica recorrente em Reis.
- source_word: הָעַמֹּנִית
  choice: a amonita
  rationale: O gentílico feminino identifica a origem étnica de Naamá de forma concisa e corrente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e representa melhor a vocalização acadêmica amplamente aceita.
- issue: Expressão לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: estabelecer o seu nome ali
  alternative: pôr o seu nome ali
  rationale: A tradução conserva a expressão pactual que associa o lugar à presença e ao culto de Yahweh, sem convertê-la numa explicação teológica mais específica do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a repetição do nome Roboão e a fórmula materna próprias do estilo historiográfico de Reis; evita um conectivo inicial sem correspondente explícito no hebraico.
