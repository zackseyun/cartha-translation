  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: pt
  text: Todo Israel lamentará por ele e o sepultará, pois somente ele, da casa de Jeroboão, chegará à sepultura[a], porque nele se encontrou algo bom para com Yahweh, o Deus de Israel[b], na casa de Jeroboão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “somente este virá para Jeroboão, à sepultura”; a expressão é elíptica. Isto é, somente ele, dentre os membros da casa de Jeroboão, receberá sepultura.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser entendida como “uma coisa boa em relação a Yahweh” ou “algo agradável a Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ
  choice: lamentará
  rationale: O verbo ספד indica luto ou lamentação pelos mortos. “Lamentará” é natural, digno e adequado ao luto público.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: e o sepultará
  rationale: Expressa diretamente o ato de dar sepultura. O sujeito coletivo “Todo o Israel” admite o verbo no singular em português.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: pois somente ele
  rationale: Preserva a ênfase exclusiva do hebraico e o contraste com os demais membros da casa de Jeroboão.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: da casa de Jeroboão, chegará à sepultura
  rationale: A formulação hebraica é compacta e incomum. O contexto indica que ele será o único pertencente a Jeroboão que receberá sepultura; a nota conserva a forma literal e explicita a inferência contextual.
- source_word: קָבֶר
  choice: sepultura
  rationale: Traduz o substantivo como o lugar ou condição de sepultamento sem recorrer à expressão potencialmente ambígua “túmulo”.
- source_word: יַעַן
  choice: porque
  rationale: Introduz de modo claro e natural a razão da declaração anterior.
- source_word: נִמְצָא בוֹ
  choice: nele se encontrou
  rationale: Mantém a construção passiva/reflexiva impessoal do nifal e o aspecto perfectivo do hebraico.
- source_word: דָּבָר טוֹב
  choice: algo bom
  rationale: Preserva a indefinição e a amplitude da expressão hebraica, sem determinar se se trata de ato, qualidade ou disposição.
- source_word: אֶל יְהוָה
  choice: para com Yahweh
  rationale: “Para com” conserva a orientação relacional de אֶל e evita decidir se o bem estava dirigido a Yahweh ou era agradável diante dele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּבֵית יָרָבְעָם
  choice: na casa de Jeroboão
  rationale: “Casa” preserva a nuance de família, linhagem ou dinastia presente na narrativa bíblica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de דָּבָר טוֹב אֶל יְהוָה
  choice: algo bom para com Yahweh
  alternative: algo agradável a Yahweh; uma boa disposição para com Yahweh
  rationale: A tradução escolhida mantém a ambiguidade entre qualidade, disposição ou ação relacionada a Yahweh, sem desenvolver uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém “casa” no sentido familiar e dinástico, usa “sepultará” em registro bíblico natural e conserva por nota as ambiguidades sintáticas e relacionais do hebraico.
