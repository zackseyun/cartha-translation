source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: pt
  text: Ele entregará Israel por causa dos pecados de Jeroboão, os quais ele cometeu e com os quais levou Israel a pecar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתֵּן
  choice: Ele entregará
  rationale: O verbo נתן significa literalmente “dar”, mas, neste contexto de juízo, “entregar” expressa naturalmente a ideia de deixar Israel sujeito à calamidade ou aos inimigos, sem especificar o instrumento do juízo.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: O marcador de objeto direto introduz o nome nacional; aqui, Israel designa coletivamente o reino do norte e seu povo.
- source_word: בִּגְלַל
  choice: por causa de
  rationale: A locução prepositiva indica a causa do juízo; “por causa de” é clara e corrente.
- source_word: חַטֹּאות יָרָבְעָם
  choice: dos pecados de Jeroboão
  rationale: Mantém o plural “pecados” e identifica Jeroboão como seu autor.
- source_word: אֲשֶׁר חָטָא
  choice: os quais ele cometeu
  rationale: Em português, “cometer pecados” transmite de modo idiomático o sentido da oração relativa hebraica e preserva a culpa pessoal de Jeroboão.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: e com os quais levou Israel a pecar
  rationale: O hifil de חטא tem força causativa. “Levou Israel a pecar” preserva essa causalidade; “com os quais” liga a ação aos pecados ou práticas anteriormente mencionados.
theological_decisions:
- issue: Agência e linguagem do juízo
  choice: Ele entregará Israel
  alternative: Ele abandonará Israel; Ele dará Israel
  rationale: “Entregará” conserva o sentido judicial contextual de נתן sem acrescentar quem ou o que executará o juízo.
- issue: Culpa de Jeroboão e sua influência sobre Israel
  choice: os quais ele cometeu e com os quais levou Israel a pecar
  alternative: com que pecou e fez Israel pecar
  rationale: A formulação mantém tanto a culpa pessoal de Jeroboão quanto seu papel causativo no pecado nacional, sem amenizar a força do hifil.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A conjunção inicial hebraica não foi vertida por “E” porque o versículo isolado soa mais natural sem ela, enquanto a continuidade narrativa permanece implícita. “Jeroboão” segue a forma portuguesa tradicional do nome.
