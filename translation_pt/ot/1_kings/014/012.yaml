  text: וְ/אַ֥תְּ ק֖וּמִי לְכִ֣י לְ/בֵיתֵ֑/ךְ בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ הָ/עִ֖ירָ/ה וּ/מֵ֥ת הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: pt
  text: Quanto a você, levante-se e vá para a sua casa. Quando seus pés entrarem na cidade[a], a criança morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quando seus pés entrarem na cidade”. O hebraico usa “seus pés” de modo idiomático para indicar o momento da chegada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: Quanto a você
  rationale: A conjunção seguida do pronome independente feminino singular introduz uma mudança enfática dirigida especificamente à mulher. “Quanto a você” preserva essa ênfase de modo natural em português.
- source_word: ק֖וּמִי
  choice: levante-se
  rationale: O imperativo de קום pede que a mulher se ponha de pé. “Levante-se” mantém o tom digno e é mais corrente em português moderno do que “erga-se”.
- source_word: לְכִ֣י
  choice: vá
  rationale: O imperativo feminino singular de הלך é traduzido diretamente por “vá”, adequado à sequência de ordens.
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: para a sua casa
  rationale: בַּיִת designa aqui a casa ou lar da mulher, e a preposição indica direção. “Para a sua casa” é claro, natural e próximo da forma hebraica.
- source_word: בְּ/בֹאָ֥ה
  choice: Quando ... entrarem
  rationale: A preposição בְּ com o infinitivo construto de בוא forma uma oração temporal, aqui expressa naturalmente por “Quando”.
- source_word: רַגְלַ֛יִ/ךְ
  choice: seus pés
  rationale: O hebraico menciona literalmente os pés como modo concreto e idiomático de indicar a chegada. A imagem foi preservada no texto.
- source_word: הָ/עִ֖ירָ/ה
  choice: na cidade
  rationale: O ה direcional indica movimento para dentro da cidade. Com o verbo “entrar”, “na cidade” comunica naturalmente esse sentido em português.
- source_word: וּ/מֵ֥ת
  choice: morrerá
  rationale: O perfeito de מות com conjunção, no contexto profético, anuncia um resultado futuro. “Morrerá” preserva de forma concisa a certeza solene da declaração.
- source_word: הַ/יָּֽלֶד
  choice: a criança
  rationale: יֶלֶד pode significar criança ou menino. Como o foco é a criança em questão, e não seu sexo, “a criança” é a opção contextual mais adequada.
theological_decisions: []
