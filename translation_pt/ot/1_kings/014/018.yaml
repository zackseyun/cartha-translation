base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: pt
  text: Eles o sepultaram, e todo Israel lamentou por ele, conforme a palavra de Yahweh que ele havia falado por meio de seu servo Aías, o profeta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de seu servo Aías, o profeta”, expressão que significa “por meio de seu servo Aías, o profeta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Eles o sepultaram
  rationale: O verbo קבר no qal indica sepultar. A construção com pronome oblíquo é natural em português e mantém o referente masculino do contexto.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: pranteou por ele
  rationale: ספד descreve luto ou lamentação pública por um morto. “Pranteou” preserva essa dimensão melhor que o simples “chorou”, sem especificar indevidamente a forma do lamento.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Expressão coletiva tradicional e compreensível para o povo ou a nação de Israel; por isso, o verbo permanece no singular em português.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: A preposição כְּ expressa conformidade, e דָּבָר conserva a formulação de cumprimento da palavra profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ele havia falado
  rationale: A oração relativa remete à palavra de Yahweh; o mais-que-perfeito composto deixa clara a anterioridade da declaração profética em relação ao sepultamento.
- source_word: בְּיַד עַבְדּוֹ
  choice: por meio de seu servo
  rationale: A expressão hebraica literalmente menciona a “mão”, mas funciona aqui como fórmula de mediação ou agência. “Por meio de” comunica o sentido em português atual.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: Aías, o profeta
  rationale: Emprega a forma portuguesa corrente do nome e mantém o título definido que identifica sua função.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título ou adotar outra forma tradicional.
- issue: Fórmula de mediação profética בְּיַד עַבְדּוֹ
  choice: por meio de seu servo
  alternative: pela mão de seu servo
  rationale: A tradução comunica que a palavra de Yahweh foi transmitida mediante Aías, sem ampliar a afirmação do texto nem transformar o idiomatismo hebraico em uma expressão pouco natural.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Pranteou” é ligeiramente elevado, mas preciso no contexto de luto público; “sepultaram” é corrente e adequado ao registro bíblico. A repetição narrativa do waw hebraico foi vertida com uma única conjunção natural em português.
