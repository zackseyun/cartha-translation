source:
  edition: WLC
  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: pt
  text: Que os teus olhos estejam abertos para a súplica[a] do teu servo e para a súplica do teu povo Israel, a fim de escutá-los[b] sempre que clamarem a ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedido de misericórdia”. O termo hebraico indica um pedido insistente por favor ou misericórdia.
    reason: lexical_alternative
  - marker: b
    text: Ou “ouvi-los” ou “atendê-los”. O verbo hebraico pode expressar ouvir, escutar com atenção ou atender, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Que ... estejam
  rationale: O infinitivo com ל dá continuidade à petição de Salomão. Em português, a construção optativa com subjuntivo expressa naturalmente esse valor.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: os teus olhos estejam abertos
  rationale: Preserva a metáfora antropomórfica hebraica de atenção favorável e prontidão para acolher a oração.
- source_word: תְּחִנַּת
  choice: súplica
  rationale: תְּחִנָּה designa um pedido insistente por favor ou misericórdia. “Súplica” é corrente, digna e mantém a intensidade do termo.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: Neste contexto, é a autodesignação de Salomão diante de Deus; “servo” é mais adequado que “escravo” e preserva a postura de submissão.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: teu povo Israel
  rationale: Reproduz de modo natural a identificação de Israel como povo pertencente a Deus.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: a fim de escutá-los
  rationale: שׁמע pode significar ouvir, escutar ou atender. “Escutá-los” comunica atenção deliberada sem resolver completamente a possível nuance de resposta favorável.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: sempre que clamarem a ti
  rationale: A combinação de בְּ com כֹל e a forma verbal nominal produz sentido temporal distributivo. “Clamarem” corresponde ao contexto de oração insistente.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus
  choice: Manter “os teus olhos estejam abertos” no texto principal
  alternative: Parafrasear como “estejas atento”
  rationale: O hebraico emprega explicitamente a imagem corporal para falar da atenção de Deus. Preservá-la mantém a textura literária e teológica sem afirmar, por si só, corporeidade divina.
- issue: Amplitude semântica de שׁמע no contexto da oração
  choice: Traduzir por “escutá-los” e registrar alternativa em nota
  alternative: “atendê-los” ou “ouvi-los”
  rationale: “Escutar” preserva o sentido básico de atenção; “atender” poderia antecipar a ideia de resposta favorável, enquanto “ouvir” pode sugerir mera percepção auditiva no português atual.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com o registro bíblico amplamente compreensível. A repetição de “súplica” foi mantida por corresponder à repetição enfática do hebraico.
