  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: pt
  text: Então Salomão ficou de pé diante do altar de Yahweh, na presença de toda a assembleia de Israel, e estendeu as mãos para o céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: ficou em pé
  rationale: O verbo עמד na sequência narrativa descreve Salomão em posição ereta; “ficou em pé” é natural em português e não acrescenta ênfase indevida.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: diante do altar de Yahweh
  rationale: לִפְנֵי conserva seu sentido espacial normal, e a cadeia construta é reproduzida diretamente. O nome divino é transliterado como “Yahweh”.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: na presença de toda a assembleia de Israel
  rationale: נֶגֶד indica a posição pública de Salomão perante o grupo reunido; esta formulação evita repetir “diante de” e comunica bem a cena. קהל é vertido como “assembleia”.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: estendeu as mãos
  rationale: No gesto de oração, פרשׂ com כפים significa abrir ou estender as mãos. “Estendeu as mãos” é idiomático e claro em português; traduzir כף literalmente por “palmas” seria menos natural.
- source_word: הַשָּׁמָיִם
  choice: o céu
  rationale: Embora a forma hebraica seja morfologicamente plural, “o céu” é a expressão portuguesa natural para a direção do gesto de oração; a forma mais literal é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva diretamente o nome divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção mantém a progressão narrativa e o gesto público de oração sem tornar a sintaxe excessivamente literal.
