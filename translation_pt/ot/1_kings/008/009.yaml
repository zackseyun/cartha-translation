source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: pt
  text: Na arca não havia nada, a não ser as duas tábuas de pedra[a] que Moisés havia colocado ali, em Horebe, onde Yahweh fez[b] uma aliança com os filhos de Israel[c], quando eles saíram da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as duas tábuas das pedras”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cortou”; no idioma hebraico, “cortar uma aliança” significa fazer ou estabelecer uma aliança.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os israelitas” ou “os descendentes de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Na arca não havia nada, a não ser
  rationale: 'Reproduz de modo natural em português a negação existencial seguida da partícula de exceção: “nada... a não ser”.'
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: as duas tábuas de pedra
  rationale: Expressão clara e corrente para as tábuas da aliança, preservando tanto o número quanto o material indicado no hebraico.
- source_word: אֲשֶׁר הִנִּיחַ שָׁם מֹשֶׁה
  choice: que Moisés havia colocado ali
  rationale: O mais-que-perfeito composto expressa naturalmente a anterioridade da ação de Moisés em relação à descrição do conteúdo da arca.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: Forma tradicional e reconhecível do topônimo em português; a preposição “em” é idiomática com nomes de lugar.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: onde Yahweh fez uma aliança com
  rationale: O verbo כרת, literalmente “cortar”, integra o conhecido idioma de estabelecer uma aliança. “Onde” liga naturalmente o acontecimento a Horebe, e “uma aliança” explicita o substantivo elíptico no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar hebraica de forma inteligível e tradicional em português.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: quando eles saíram da terra do Egito
  rationale: Transforma a construção infinitiva temporal em uma oração portuguesa natural, preservando a referência ao êxodo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A opção conserva a forma familiar e corporativa do hebraico, sem impedir que o contexto se refira ao povo de Israel como um todo.
- issue: Idioma da celebração da aliança
  choice: fez uma aliança
  alternative: cortou uma aliança
  rationale: “Cortar uma aliança” reproduziria formalmente o idioma hebraico, mas não comunicaria seu sentido com naturalidade ao leitor comum de português; a nota preserva a imagem lexical original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem produzir rigidez. “Horebe”, “arca” e “tábuas de pedra” mantêm o vocabulário bíblico reconhecível; “fez uma aliança” comunica de modo corrente o idioma hebraico.
