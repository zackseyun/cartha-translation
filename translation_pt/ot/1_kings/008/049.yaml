base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
translation:
  language: pt
  text: então ouve, nos céus, no lugar da tua habitação[a], a oração e a súplica deles, e faze-lhes justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tua morada”. A expressão hebraica ressalta um lugar estabelecido ou fixo de habitação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “defende a causa deles” ou “reconhece-lhes o direito”. Literalmente, o hebraico diz “faze o julgamento deles”, expressão que significa agir em favor de sua causa judicial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: então ouve
  rationale: O perfeito qal de שׁמע, numa sequência de petições dirigidas a Deus, tem força de pedido. “Então” expressa naturalmente a progressão das condições anteriores.
- source_word: הַשָּׁמַיִם
  choice: nos céus
  rationale: Mantém o plural hebraico tradicional e a linguagem bíblica da esfera celestial, sem acrescentar a preposição “desde”, ausente no texto.
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: lugar da tua habitação
  rationale: מָכוֹן indica lugar estabelecido ou fixo; a formulação conserva o sentido sem produzir uma expressão pouco natural em português.
- source_word: תְּפִלָּתָם וְאֶת תְּחִנָּתָם
  choice: a oração e a súplica deles
  rationale: Distingue a oração em geral da petição insistente por favor ou misericórdia; “súplica” é corrente e digna em português bíblico moderno.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: e faze-lhes justiça
  rationale: O idioma hebraico, literalmente “fazer o julgamento/direito deles”, significa agir judicialmente em favor de sua causa. “Faze-lhes justiça” preserva com clareza o teor forense.
theological_decisions:
- issue: Linguagem sobre a habitação celestial de Deus
  choice: Conservar “nos céus, lugar da tua habitação”
  alternative: “desde os céus, tua morada”
  rationale: A tradução mantém a imagem da oração do templo sem afirmar que Deus esteja espacialmente limitado aos céus.
- issue: Sentido forense de מִשְׁפָּטָם
  choice: “faze-lhes justiça”
  alternative: “defende a causa deles” ou “reivindica o direito deles”
  rationale: A expressão comunica ação judicial favorável, mas não pressupõe além do texto qual será o resultado do julgamento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O imperativo “ouve” e a forma “faze-lhes” preservam o tom solene da oração sem recorrer a vocabulário excessivamente arcaico.
