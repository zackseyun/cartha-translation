source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: pt
  text: 'E agora, Yahweh, Deus de Israel, cumpre em favor do teu servo Davi, meu pai, aquilo que lhe disseste: “Nunca te faltará diante de mim um homem que se assente no trono de Israel[a], somente se os teus filhos cuidarem do seu caminho, andando diante de mim como tu andaste diante de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Não será eliminado de diante de mim, para ti, um homem que se assente no trono de Israel”. A expressão significa que Davi não ficaria sem um descendente para ocupar o trono.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função de nome pessoal no texto hebraico.
- source_word: שְׁמֹר
  choice: cumpre
  rationale: Com uma palavra divina como objeto, o imperativo tem o sentido de guardar no sentido de levar a efeito; “cumpre” comunica isso naturalmente em português.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: em favor do teu servo Davi, meu pai
  rationale: “Servo” é adequado ao contexto régio e pactual; “em favor de” expressa o לְ sem sugerir que Davi ainda esteja vivo, e a ordem hebraica é preservada de modo legível.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: aquilo que lhe disseste
  rationale: Mantém o verbo geral “dizer/falar” sem converter explicitamente a declaração em “promessa”, embora o contexto tenha força promissória.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: Nunca te faltará diante de mim um homem
  rationale: Traduz naturalmente o sentido dinástico do idioma hebraico. A imagem literal de “ser eliminado/cortado” e o valor explícito de לְךָ são registrados na nota.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: que se assente no trono de Israel
  rationale: 'Expressa em português corrente a função do particípio hebraico: o sucessor que ocupa o trono.'
- source_word: רַק אִם
  choice: somente se
  rationale: Preserva com clareza a condição enfática introduzida pela expressão hebraica.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: os teus filhos cuidarem do seu caminho
  rationale: Conserva a metáfora hebraica do caminho como conduta e o sentido de vigiar ou guardar essa maneira de viver.
- source_word: לָלֶכֶת לְפָנַי
  choice: andando diante de mim
  rationale: O gerúndio apresenta o andar diante de Deus como explicação ou modo de cuidar do caminho.
- source_word: כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: como tu andaste diante de mim
  rationale: Mantém a comparação direta com a conduta passada de Davi e conserva a expressão relacional “diante de mim”.
theological_decisions:
- issue: Condicionalidade da promessa davídica neste versículo
  choice: A continuidade dinástica é apresentada aqui com uma condição explícita ligada à conduta dos filhos de Davi.
  alternative: Entender a promessa como incondicional e limitar a condição apenas à experiência histórica de suas bênçãos.
  rationale: A construção רַק אִם, traduzida por “somente se”, introduz diretamente a condição. A tradução preserva essa tensão sem harmonizá-la com antecedência a partir de outros textos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. Emprega “teu/tu” de modo coerente na oração e na fala divina. A formulação principal privilegia a clareza idiomática, enquanto a nota preserva a estrutura e a imagem mais literais do hebraico.
