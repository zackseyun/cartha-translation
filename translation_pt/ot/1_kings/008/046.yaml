base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: pt
  text: Quando pecarem contra ti — pois não há ninguém que não peque — e ficares irado com eles e os entregares a um inimigo, e aqueles que os capturarem os levarem cativos para a terra do inimigo, seja ela distante ou próxima,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Quando pecarem contra ti
  rationale: A primeira ocorrência de כִּי introduz um cenário condicional esperado dentro da oração de Salomão; “quando” preserva bem o fluxo do discurso, enquanto חטא com ל indica pecado cometido contra Deus.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: pois não há ninguém que não peque
  rationale: A segunda ocorrência de כִּי é causal. “Ninguém” expressa de modo natural e inclusivo o uso genérico de אָדָם, sem restringi-lo ao sexo masculino.
- source_word: וְאָנַפְתָּ בָם
  choice: e ficares irado com eles
  rationale: O verbo denota o despertar da ira; “ficares irado” mantém a força verbal e se encaixa na sequência condicional.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: e os entregares a um inimigo
  rationale: Neste contexto hostil, נתן לפני comunica entrega ao poder de outro. אוֹיֵב está no singular e sem artigo, justificando “um inimigo”.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: e aqueles que os capturarem os levarem cativos
  rationale: A formulação preserva tanto a identidade dos captores quanto a ideia explícita de condução ao cativeiro presente na construção hebraica.
- source_word: אֶל אֶרֶץ הָאוֹיֵב רְחוֹקָה אוֹ קְרוֹבָה
  choice: para a terra do inimigo, seja ela distante ou próxima
  rationale: “Do inimigo” reflete o artigo definido nesta segunda ocorrência; “seja ela” deixa claro que os adjetivos qualificam “terra”.
theological_decisions:
- issue: Uso genérico de אָדָם
  choice: ninguém
  alternative: nenhum ser humano
  rationale: אָדָם é singular genérico e abrange toda a humanidade. “Ninguém” é idiomático em português e mantém a universalidade da afirmação sem introduzir distinção de gênero.
- issue: Ira divina
  choice: ficares irado com eles
  alternative: te irares contra eles
  rationale: A opção conserva a afirmação direta da ira de Deus sem suavizá-la nem intensificá-la além do verbo hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a estrutura de uma oração condicional longa e a vírgula final, pois o versículo continua sintaticamente no seguinte.
