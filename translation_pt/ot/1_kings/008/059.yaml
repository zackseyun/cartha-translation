  source_fidelity: A tradução reproduz adequadamente a construção volitiva inicial («E que ... estejam»), a súplica já feita diante de Yahweh, a imagem de as palavras permanecerem perto de Deus «dia e noite» e o propósito jurídico de defender a causa do servo e de Israel. «Conforme cada dia exigir» transmite de modo idiomático o sentido distributivo de דְּבַר־יוֹם בְּיוֹמוֹ, sem alegar uma precisão maior que a do hebraico.
  naturalness: O português é moderno, solene e fluente, com boa legibilidade internacional e brasileira. «Estas minhas palavras» e «defenda a causa» são naturais no registro de oração régia. A repetição de «causa» preserva apropriadamente o paralelismo hebraico.
  terminology: «Yahweh» é aplicado de maneira consistente ao tetragrama. «Servo», «povo Israel» e «defenda a causa» são escolhas contextualmente apropriadas e não introduzem interpretação confessional. As notas esclarecem as alternativas lexicais relevantes.
