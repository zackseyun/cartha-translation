  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: pt
  text: E que estas minhas palavras, com as quais supliquei diante de Yahweh, estejam perto de Yahweh, nosso Deus,[a] dia e noite, para que ele defenda a causa[b] do seu servo e a causa do seu povo Israel, conforme cada dia exigir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estejam próximos de Yahweh, nosso Deus”. O hebraico retrata estas palavras de oração permanecendo continuamente perto de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “faça justiça a” ou “sustente o direito de”. O idioma hebraico se refere a defender judicialmente a causa de alguém.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a questão de um dia no seu dia”, isto é, aquilo que cada dia requer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: E que ... estejam
  rationale: A forma volitiva expressa o desejo ou a oração de Salomão, não uma simples afirmação sobre o futuro.
- source_word: דְבָרַי אֵלֶּה
  choice: estas minhas palavras
  rationale: Reproduz de modo direto e natural o demonstrativo e o possessivo do hebraico.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי
  choice: com as quais supliquei
  rationale: O verbo no hitpael indica súplica insistente; a construção instrumental liga a súplica às palavras mencionadas.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Mantém o idioma que descreve a oração feita na presença de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, distinguindo-o de um título.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: estejam perto de Yahweh, nosso Deus
  rationale: Conserva a imagem concreta e incomum das palavras da oração permanecendo próximas de Deus.
- source_word: יוֹמָם וָלָיְלָה
  choice: dia e noite
  rationale: Preserva o idioma hebraico de continuidade.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: para que ele defenda a causa
  rationale: Expressa em português corrente o idioma jurídico de fazer justiça ou sustentar o direito de alguém.
- source_word: עַבְדּוֹ
  choice: do seu servo
  rationale: No contexto da oração régia, 'servo' comunica adequadamente a posição de Salomão perante Deus.
- source_word: וּמִשְׁפַּט עַמּוֹ יִשְׂרָאֵל
  choice: e a causa do seu povo Israel
  rationale: Mantém o paralelismo e a repetição do sentido jurídico de מִשְׁפָּט.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: conforme cada dia exigir
  rationale: Comunica naturalmente o sentido distributivo da expressão literal 'a questão de um dia no seu dia'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Sentido de לַעֲשׂוֹת מִשְׁפַּט
  choice: defenda a causa
  alternative: faça justiça a; sustente o direito de
  rationale: A formulação conserva o caráter jurídico e protetor do idioma sem decidir além do necessário entre justiça, direito e causa legal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe mantém o tom de oração solene sem arcaísmos; a imagem incomum de as palavras estarem perto de Deus e a tensão jurídica de מִשְׁפָּט foram preservadas e esclarecidas em notas.
