  naturalness: “Dirigir ... oração” é possível, mas, nessa ordem e com “terminou de”, soa artificial. “Onde estava de joelhos” também introduz uma oração relativa desnecessária. “De sua posição de joelhos” mantém o sentido de origem expresso pelo hebraico e flui melhor.
  terminology: “Yahweh”, “oração”, “súplica”, “altar” e “palmas das mãos” são adequados. A nota a deve evitar introduzir “graça” como explicação principal, pois o termo abrange sobretudo um apelo por favor ou misericórdia.
