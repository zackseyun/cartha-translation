source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת שְׁלֹמֹ֗ה לְ/הִתְפַּלֵּל֙ אֶל יְהוָ֔ה אֵ֛ת כָּל הַ/תְּפִלָּ֥ה וְ/הַ/תְּחִנָּ֖ה הַ/זֹּ֑את קָ֞ם מִ/לִּ/פְנֵ֨י מִזְבַּ֤ח יְהוָה֙ מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: pt
  text: Quando Salomão terminou de orar a Yahweh com toda esta oração e súplica[a], levantou-se de diante do altar de Yahweh, de sua posição de joelhos, com as palmas das mãos[b] estendidas para o céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedido de favor”. O termo hebraico indica um apelo intenso por favor ou misericórdia.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode designar especificamente as “palmas” ou, por extensão, as “mãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Quando ... terminou
  rationale: A construção introduz uma oração temporal. Em português, “Quando ... terminou” comunica isso com naturalidade, sem reproduzir o hebraísmo “e aconteceu que”.
- source_word: לְהִתְפַּלֵּל אֶל־יְהוָה
  choice: de dirigir a Yahweh ... oração
  rationale: O verbo expressa o ato de orar a Yahweh. A formulação evita a sequência pouco natural “terminou de orar a Yahweh toda esta oração” e mantém explícito o destinatário.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵת כָּל־הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: toda essa oração e súplica
  rationale: “Oração” traduz o termo geral, enquanto “súplica” preserva o sentido de um apelo intenso por graça ou misericórdia. “Toda essa” abrange os dois substantivos coordenados.
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: levantou-se de diante do altar de Yahweh
  rationale: Mantém tanto a mudança de postura indicada por קום quanto o sentido espacial formal de “diante do altar”.
- source_word: מִכְּרֹעַ עַל־בִּרְכָּיו
  choice: onde estava de joelhos
  rationale: Expressa com clareza a postura da qual Salomão se levantou. “De joelhos” é a forma idiomática portuguesa correspondente ao hebraico explícito “ajoelhado sobre seus joelhos”.
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: com as palmas das mãos estendidas para o céu
  rationale: 'כַּף designa especificamente a palma ou, por extensão, a mão. A tradução mantém a imagem corporal precisa e entende הַשָּׁמָיִם direcionalmente: “para o céu”.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo pelo título “SENHOR”.
- issue: Nuance de תְּחִנָּה
  choice: súplica
  alternative: pedido de favor; pedido de misericórdia
  rationale: “Súplica” conserva o caráter intenso do apelo sem especificar além do necessário se o favor pedido deve ser formulado como graça ou misericórdia.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva o nome Yahweh e os detalhes físicos da postura, mas evita reproduzir de modo rígido construções hebraicas pouco naturais em português.
