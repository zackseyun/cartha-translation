  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: pt
  text: Ouve a súplica do teu servo e do teu povo Israel quando orarem voltados para este lugar[a]. Ouve nos céus — o lugar da tua habitação —; ouve e perdoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a este lugar». A expressão hebraica pode ser traduzida mais literalmente assim, mas «voltados para este lugar» explicita que a oração é dirigida em direção ao templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: súplica
  rationale: Expressa um pedido insistente por favor ou misericórdia e preserva o tom solene da oração sem soar excessivamente técnico.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: No contexto de uma oração régia dirigida a Deus, é uma autodesignação humilde de submissão; «servo» comunica esse sentido adequadamente.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: teu povo Israel
  rationale: Mantém de modo direto a identificação de Israel como povo de Deus.
- source_word: יִתְפַּלְלוּ
  choice: orarem
  rationale: O hitpael de פלל é o verbo hebraico habitual para orar; a forma portuguesa integra naturalmente a oração temporal.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: voltados para este lugar
  rationale: No contexto, a preposição indica que a oração é dirigida em direção ao templo. «Voltados para» torna clara essa orientação espacial sem afirmar que os suplicantes estejam no templo.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: o lugar da tua habitação
  rationale: Preserva a relação de construção do hebraico e o registro elevado, permanecendo compreensível em português moderno.
- source_word: אֶל הַשָּׁמַיִם
  choice: nos céus
  rationale: Embora אֶל costume significar «a/para», com «ouvir» e «lugar da tua habitação» a expressão tem sentido locativo. O plural «céus» reflete a forma hebraica e é natural no registro bíblico português.
- source_word: וְשָׁמַעְתָּ
  choice: ouve
  rationale: Aqui שׁמע implica escuta atenta e resposta à oração. «Ouve» conserva a linguagem tradicional de súplica e se associa naturalmente a «perdoa».
- source_word: וְסָלָחְתָּ
  choice: perdoa
  rationale: סלח é o verbo hebraico padrão para o perdão concedido por Deus; «perdoa» é claro e teologicamente transparente.
theological_decisions:
- issue: A habitação de Deus e os céus na teologia do templo
  choice: Conservar tanto a oração orientada para o templo («voltados para este lugar») quanto os céus como lugar da habitação divina.
  alternative: Traduzir dinamicamente como «quando orarem neste templo» ou usar «ouve desde os céus» para enfatizar a ação divina vinda do alto.
  rationale: O versículo mantém em conjunto o templo terreno como foco da oração e os céus como habitação de Deus. A tradução preserva essa tensão, sem identificar a presença divina exclusivamente com o templo nem explicá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do singular («teu», «tua») coerentes com a oração dirigida diretamente a Deus. A repetição de «ouve» reproduz a ênfase do hebraico. A pontuação com ponto e vírgula mantém unidos os dois imperativos finais sem apagar sua força própria.
