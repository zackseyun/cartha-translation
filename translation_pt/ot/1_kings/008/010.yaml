id: 1KI.8.10
reference: 1 Kings 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: pt
  text: Quando os sacerdotes saíram do lugar santo[a], a nuvem encheu a casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do santuário” ou “do Santo Lugar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Quando ... saíram
  rationale: A construção וַיְהִי seguida do infinitivo com בְּ introduz a circunstância temporal. Em português, “Quando ... saíram” expressa naturalmente a transição narrativa sem a formulação mais pesada “E aconteceu que, ao saírem”.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Correspondência direta e natural para o substantivo definido no plural.
- source_word: מִן הַקֹּדֶשׁ
  choice: do lugar santo
  rationale: קֹדֶשׁ designa aqui o espaço sagrado de onde os sacerdotes saíram. “Lugar santo” preserva a formulação concreta e a possibilidade de referência técnica, sem tornar o sentido mais específico que o hebraico.
- source_word: וְהֶעָנָן
  choice: a nuvem
  rationale: O substantivo definido é traduzido diretamente. A conjunção não precisa ser reproduzida antes da oração principal, pois a construção temporal portuguesa já liga naturalmente as duas ações.
- source_word: מָלֵא
  choice: encheu
  rationale: O perfeito qal masculino singular descreve a ação da nuvem sobre a casa; o pretérito perfeito reproduz de modo claro a progressão narrativa.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: “Casa” preserva a imagem concreta de בֵּית, enquanto “Yahweh” representa o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico contém diretamente o Tetragrama. “Yahweh” procura representar o nome próprio da aliança, enquanto “SENHOR” o substitui pela leitura tradicional e “Jeová” reflete uma forma posterior.
- issue: Identificação de הַקֹּדֶשׁ como termo técnico
  choice: lugar santo
  alternative: santuário; Santo Lugar
  rationale: O hebraico significa literalmente “o santo” e pode designar a área sagrada do templo. A tradução mantém essa abertura sem impor capitalização técnica ou delimitação arquitetônica além do contexto.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. O início hebraico formulaico foi condensado numa oração temporal idiomática, sem perda do vínculo narrativo. A expressão “casa de Yahweh” conserva tanto a metáfora arquitetônica quanto o nome divino.
