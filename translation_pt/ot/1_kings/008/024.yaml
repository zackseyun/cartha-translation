  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: pt
  text: que cumpriste em favor de teu servo Davi, meu pai, aquilo que lhe disseste[a]. Falaste com tua boca e, com tua mão, o realizaste[b], como se vê hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que disseste ao teu servo Davi, meu pai”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “falaste com tua boca e, com tua mão, o realizaste” — modo vívido de dizer que Deus realizou aquilo que havia declarado.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: cumpriste
  rationale: No contexto, o verbo se refere a Deus guardar fielmente sua palavra dada a Davi. “Cumpriste” comunica isso com naturalidade em português; o verbo posterior é diferenciado por “realizaste”.
- source_word: לְעַבְדְּךָ
  choice: para com teu servo
  rationale: Preserva a possível ideia de compromisso assumido em favor de Davi e mantém sua designação pactual e humilde como “servo”.
- source_word: דָּוִד אָבִי
  choice: Davi, meu pai
  rationale: Segue a ordem hebraica e usa pontuação natural em português para marcar o aposto.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: aquilo que lhe disseste
  rationale: Traduz o ato de falar sem convertê-lo explicitamente em “prometer”, preservando a repetição retórica ligada à boca de Deus.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Falaste com tua boca
  rationale: Mantém a imagem concreta e enfática do hebraico e o paralelismo entre a boca que fala e a mão que age.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: e, com tua mão, o realizaste
  rationale: “Realizaste” expressa levar a palavra à execução, enquanto “com tua mão” conserva a metáfora antropomórfica e o contraste retórico.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê neste dia
  rationale: Expressa o sentido idiomático de um cumprimento presente e observável, em português atual.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus (“boca” e “mão”)
  choice: Conservar as expressões concretas no texto principal.
  alternative: Parafrasear como “prometeste e cumpriste”.
  rationale: O hebraico associa intencionalmente a fala e a ação divinas por meio dessas imagens. Preservá-las mantém a força poética e teológica do texto sem impor uma explicação doutrinária externa.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes (“teu”, “tua”, “disseste”, “falaste”). Mantêm-se o paralelismo hebraico e as imagens de “boca” e “mão”, enquanto a expressão final é vertida idiomaticamente.
