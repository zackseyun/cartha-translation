  text: וַֽ/יַּעְמֹ֕ד וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל ק֥וֹל גָּד֖וֹל לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: pt
  text: 'Então ele se levantou e abençoou toda a assembleia de Israel[a], em alta voz[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a congregação de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com grande voz”, isto é, “em alta voz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: Então ele se levantou
  rationale: O waw consecutivo dá sequência à narrativa. Neste contexto, עמד indica que Salomão passou à posição de pé; “se levantou” é natural em português e se harmoniza com o contexto imediato.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: ברך descreve aqui o ato público de proferir uma bênção sobre o povo reunido. “Abençoou” é conciso e preserva o termo teologicamente aberto sem explicar além do texto.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: toda a assembleia de Israel
  rationale: קהל designa a comunidade reunida. “Assembleia” conserva o caráter coletivo e público, enquanto כָּל é expresso naturalmente por “toda a”.
- source_word: קוֹל גָּדוֹל
  choice: em alta voz
  rationale: A expressão hebraica, literalmente “com grande voz”, é um idiomatismo de volume. “Em alta voz” comunica isso de modo corrente e digno em português.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo introduz o conteúdo do discurso nos versículos seguintes. “Dizendo:” mantém a ligação formal com a fala que vem a seguir.
theological_decisions:
- issue: Natureza da bênção dirigida a Israel
  choice: O texto afirma que Salomão abençoou a assembleia, sem definir um mecanismo pelo qual ele conferisse graça divina.
  alternative: Explicitar que Salomão apenas pronunciou uma fórmula de bênção, ou atribuir ao ato um sentido sacramental ou causativo mais forte.
  rationale: ברך pode indicar o pronunciamento formal de uma bênção. A tradução mantém “abençoou”, preservando a formulação do hebraico e evitando impor uma explicação teológica que o versículo não fornece.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Assembleia” evita uma conotação eclesiástica excessiva; “em alta voz” traduz naturalmente o idiomatismo hebraico. Os marcadores aparecem junto às expressões correspondentes no texto.
