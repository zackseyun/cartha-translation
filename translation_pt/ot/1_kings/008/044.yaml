source:
  edition: WLC
  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: pt
  text: Quando o teu povo sair à guerra contra o seu inimigo, pelo caminho pelo qual os enviares, e eles orarem a Yahweh na direção da cidade que escolheste e da casa que construí para o teu nome[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo; em hebraico, “a casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste trecho da oração, introduz uma situação possível ou esperada. “Quando” mantém o fluxo natural das petições, sem impor um sentido causal.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: o teu povo sair à guerra
  rationale: Preserva o verbo concreto “sair” e expressa de modo idiomático o contexto militar.
- source_word: עַל אֹיְבוֹ
  choice: contra o seu inimigo
  rationale: Mantém o sufixo singular do hebraico e sua referência coletiva ao povo.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: pelo caminho pelo qual tu o enviares
  rationale: Conserva a imagem hebraica de caminho ou percurso e representa o envio determinado por Deus. O objeto coletivo “povo” é retomado no singular em português.
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: e orar a Yahweh
  rationale: O plural hebraico é vertido de acordo com o sujeito coletivo singular “povo”; o nome divino é transliterado como Yahweh.
- source_word: דֶּרֶךְ הָעִיר
  choice: na direção da cidade
  rationale: Aqui דֶּרֶךְ indica orientação espacial da oração, não outro percurso.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: a cidade que escolheste
  rationale: Segue a formulação concisa do hebraico sem acrescentar a finalidade da escolha.
- source_word: וְהַבַּיִת
  choice: e da casa
  rationale: Traduz literalmente בַּיִת e preserva a expressão bíblica da casa edificada para o nome de Deus; uma nota esclarece o referente.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: que construí para o teu nome
  rationale: Mantém a expressão teologicamente significativa “para o teu nome”, sem a reduzir a uma paráfrase como “em tua honra”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não um título. “Yahweh” o representa diretamente e evita substituí-lo por “SENHOR”.
- issue: Terminologia do templo em הַבַּיִת
  choice: casa
  alternative: templo
  rationale: “Casa” preserva a escolha lexical e o idioma teológico do hebraico, enquanto a nota identifica claramente o edifício referido.
- issue: Concordância com o coletivo עַמְּךָ
  choice: verbos e pronomes no singular em referência a “povo”
  alternative: concordância semântica no plural
  rationale: O hebraico alterna o substantivo coletivo singular com formas semanticamente plurais. Em português, a concordância gramatical no singular produz leitura mais natural sem apagar o sentido coletivo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa do singular para preservar a oração dirigida diretamente a Deus. A repetição “pelo caminho pelo qual” é deliberadamente próxima do hebraico; “na direção da cidade” distingue o segundo uso direcional de דֶּרֶךְ.
