base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: pt
  text: 'Então Salomão disse: “Yahweh disse que habitaria na densa escuridão[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na nuvem escura”. O termo hebraico עֲרָפֶל pode indicar escuridão densa ou uma nuvem escura, sobretudo em descrições da presença manifesta de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marcador temporal e discursivo natural em português, preservando a sequência narrativa.
- source_word: אָמַר
  choice: disse / declarou
  rationale: O primeiro uso introduz diretamente a fala de Salomão; no segundo, “declarou” evita repetição pesada e comunica naturalmente uma afirmação divina, sem alterar o sentido básico de אמר.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לִשְׁכֹּן
  choice: que habitaria
  rationale: Depois do verbo de dizer, expressa em português idiomático o conteúdo da declaração; “habitaria” preserva a ideia de residir ou estabelecer presença.
- source_word: בָּעֲרָפֶל
  choice: na escuridão densa
  rationale: Preserva a imagem de obscuridade intensa e seu peso teofânico, mantendo em nota a possibilidade lexical de uma nuvem escura.
theological_decisions:
- issue: A habitação divina em עֲרָפֶל
  choice: Yahweh declarou que habitaria na escuridão densa
  alternative: Yahweh declarou que habitaria na nuvem escura
  rationale: A formulação mantém o paradoxo da presença manifesta de Deus em meio à obscuridade, sem reduzi-la apenas a um fenômeno meteorológico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sem produzir uma frase artificial.
