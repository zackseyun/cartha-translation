  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: pt
  text: Davi, meu pai, tinha no coração construir uma casa para o nome de Yahweh[a], o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “construir um templo para o nome de Yahweh”. O hebraico diz literalmente “construir uma casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Estava
  rationale: A forma narrativa de היה introduz aqui um estado passado; “Estava” expressa isso naturalmente sem acrescentar um marcador temporal inexistente.
- source_word: עִם לְבַב
  choice: no coração de
  rationale: Preserva a metáfora hebraica para uma intenção ou desejo presente no íntimo, sem reduzi-la simplesmente a “pretendia”.
- source_word: דָּוִד אָבִי
  choice: Davi, meu pai
  rationale: Mantém a ordem do hebraico e usa vírgulas para deixar clara, em português natural, a aposição “meu pai”.
- source_word: לִבְנוֹת
  choice: construir
  rationale: Equivalente corrente de בנה neste contexto de edificação do santuário.
- source_word: בַּיִת
  choice: uma casa
  rationale: O referente é o templo, mas o hebraico diz literalmente “casa”; a tradução conserva essa imagem teologicamente significativa.
- source_word: לְשֵׁם
  choice: para o nome de
  rationale: Preserva a formulação bíblica que indica dedicação ao nome, à identidade revelada e à honra de Yahweh, sem explicitação excessiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: A expressão identifica Yahweh em aposição; o artigo produz português natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Tradução de בַּיִת no contexto do templo
  choice: casa
  alternative: templo
  rationale: “Casa” traduz diretamente o termo hebraico e conserva a imagem do templo como casa de Yahweh; “templo” explicita corretamente o referente, mas é mais interpretativo.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A formulação conserva a metáfora do coração, a imagem da casa e a expressão “para o nome de”, sem eliminar a tensão própria do texto.
