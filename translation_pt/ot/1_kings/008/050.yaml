source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: pt
  text: e perdoa o teu povo, que pecou contra ti, e todas as suas transgressões[a] cometidas contra ti; concede que encontrem compaixão diante dos que os levaram cativos, para que estes tenham compaixão deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Transgressões” também pode ser traduzido por “rebeliões”, ressaltando a ideia de infidelidade e ruptura da aliança com Deus.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e eles terão compaixão deles”. A oração final pode indicar resultado, além de propósito.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: e perdoa
  rationale: O perfeito qal de segunda pessoa masculina singular ocorre no contexto de oração e tem força de pedido. O imperativo português comunica naturalmente essa função discursiva.
- source_word: לְעַמְּךָ
  choice: o teu povo
  rationale: A expressão significa literalmente “ao teu povo”; em português, o verbo “perdoar” admite aqui objeto direto, que resulta numa formulação clara e idiomática.
- source_word: חָטְאוּ לָךְ
  choice: que pecou contra ti
  rationale: Com חטא, a preposição ל marca a parte ofendida. “Pecar contra” é a correspondência idiomática em português. O singular concorda coletivamente com “povo”.
- source_word: וּלְכָל פִּשְׁעֵיהֶם
  choice: e todas as suas transgressões
  rationale: פשע pode designar transgressão ou rebelião, especialmente como violação da aliança. “Transgressões” preserva o peso moral e teológico sem restringir o sentido à rebelião política.
- source_word: אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: cometidas contra ti
  rationale: A formulação evita a repetição pouco natural “transgressões que transgrediram”, conserva a direção da ofensa contra Deus e mantém o paralelismo com o pecado mencionado antes.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: concede-lhes compaixão
  rationale: A construção נתן + ל + רחמים pede que Deus coloque o povo em condição de receber compaixão. “Concede-lhes compaixão” é conciso e mantém Deus como aquele de quem depende esse tratamento compassivo.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: diante dos que os levaram cativos
  rationale: O particípio de שבה identifica os captores. A expansão verbal é mais transparente para leitores comuns e preserva o sentido de estar perante ou na presença deles.
- source_word: וְרִחֲמוּם
  choice: para que estes tenham compaixão deles
  rationale: A oração pode expressar propósito ou resultado. “Para que” representa naturalmente o propósito no contexto da súplica, enquanto “estes” esclarece que o sujeito são os captores e a repetição de “compaixão” preserva o vínculo lexical com רחמים.
theological_decisions:
- issue: Relação entre o perdão divino e a compaixão demonstrada pelos captores
  choice: O versículo pede que Deus perdoe Israel e lhe conceda favor perante os captores, para que estes tratem o povo com compaixão.
  alternative: 'A oração final também pode ser entendida como resultado futuro: “e eles terão compaixão deles”.'
  rationale: A sequência hebraica relaciona o perdão pedido a Deus com a compaixão recebida em terra estrangeira, sem definir de modo técnico o mecanismo dessa relação. A nota conserva a abertura sintática entre propósito e resultado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Emprega-se “tu” em continuidade com o discurso dirigido a Deus. O ponto e vírgula organiza a longa coordenação hebraica sem romper sua unidade. Os marcadores foram posicionados junto aos trechos a que suas respectivas notas se referem.
