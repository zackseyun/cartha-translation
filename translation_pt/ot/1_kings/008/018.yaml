  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: pt
  text: 'Mas Yahweh disse a Davi, meu pai: “Já que você teve no coração o desejo de construir uma casa para o meu nome[a], fez bem em ter isso no coração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “construir um templo para o meu nome”. O hebraico diz literalmente “construir uma casa para o meu nome”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” introduz naturalmente o discurso direto em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל דָּוִד אָבִי
  choice: a Davi, meu pai
  rationale: Preserva o destinatário marcado por אֶל e identifica Davi como pai de Salomão.
- source_word: יַעַן אֲשֶׁר
  choice: já que
  rationale: Introduz com naturalidade a razão da declaração divina, sem tornar a frase excessivamente formal.
- source_word: הָיָה עִם לְבָבְךָ
  choice: você teve no coração o desejo
  rationale: Expressa a intenção indicada pelo idioma hebraico e mantém a metáfora do coração em português compreensível.
- source_word: לִבְנוֹת בַּיִת
  choice: construir uma casa
  rationale: בַּיִת significa literalmente “casa”; no contexto, refere-se ao templo, mas a formulação preserva o idioma do texto-fonte.
- source_word: לִשְׁמִי
  choice: para o meu nome
  rationale: Mantém a expressão teológica hebraica que associa o santuário ao nome de Deus.
- source_word: הֱטִיבֹתָ
  choice: fez bem
  rationale: O hifil de יטב expressa aprovação; “fez bem” é claro, conciso e natural.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: em ter isso no coração
  rationale: Retoma a intenção de Davi sem uma repetição pesada, preservando a base da aprovação divina.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal presente no hebraico, sem substituí-lo por um título.
- issue: Sentido de בַּיִת no contexto do santuário
  choice: casa
  alternative: templo
  rationale: A escolha mantém o termo concreto do hebraico e sua linguagem teológica, enquanto a nota esclarece o referente contextual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “você” no discurso direto. A redação preserva “casa” e “para o meu nome”, mas explicita idiomaticamente que o que estava no coração era um desejo ou propósito.
