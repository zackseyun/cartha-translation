source:
  edition: WLC
  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: pt
  text: E também quanto ao estrangeiro[a], que não pertence ao teu povo Israel e vem de uma terra distante por causa do teu nome—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forasteiro” ou “alguém de fora”. O hebraico se refere a uma pessoa não israelita, não apenas a um viajante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: E também
  rationale: Preserva tanto a ligação com as petições anteriores quanto a força aditiva do hebraico, em português natural.
- source_word: אֶל
  choice: quanto ao
  rationale: No contexto da oração, introduz o caso que Salomão passa a considerar, e não uma direção física.
- source_word: הַנָּכְרִי
  choice: o estrangeiro
  rationale: Designa aqui uma pessoa não israelita; “estrangeiro” comunica com clareza essa distinção étnica e pactual.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: que não pertence ao teu povo Israel
  rationale: Expressa de modo natural em português que a pessoa está fora do povo de Israel, preservando a referência a Israel como povo de Deus.
- source_word: וּבָא
  choice: mas vem
  rationale: A conjunção faz avançar a descrição e permite um contraste moderado entre não pertencer a Israel e, ainda assim, vir de longe.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: de uma terra distante
  rationale: Reproduz a expressão geográfica hebraica em linguagem atual e digna.
- source_word: לְמַעַן שְׁמֶךָ
  choice: por causa do teu nome
  rationale: Indica a motivação da vinda e mantém o peso bíblico de “nome” como a reputação e manifestação conhecidas de Deus.
theological_decisions:
- issue: Distinção pactual entre Israel e o não israelita que vem por causa do nome de Deus
  choice: o estrangeiro, que não pertence ao teu povo Israel
  alternative: o forasteiro, que não é do teu povo Israel
  rationale: A formulação conserva explicitamente a condição não israelita da pessoa sem reduzi-la à ideia de mero viajante ou visitante.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O travessão final foi mantido porque a frase continua na petição dos versículos seguintes.
