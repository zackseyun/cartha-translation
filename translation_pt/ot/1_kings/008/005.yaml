source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: pt
  text: O rei Salomão e toda a assembleia de Israel, que se reunira junto dele,[a] estavam com ele diante da arca, sacrificando ovelhas e bois que, por serem tão numerosos, não podiam ser contados nem enumerados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se havia reunido diante dele”. A expressão hebraica indica que a assembleia se reuniu em relação a Salomão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: assembleia
  rationale: “Assembleia” expressa o corpo nacional reunido para uma ocasião pública e cultual, sem introduzir associações eclesiásticas posteriores.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: que se reunira em torno dele
  rationale: O particípio nifal de יעד indica os que se reuniram ou foram congregados em relação a Salomão; “em torno dele” conserva essa relação sem impor uma direção espacial excessivamente precisa.
- source_word: אִתּוֹ
  choice: estavam com ele
  rationale: A oração hebraica não tem verbo expresso; o português requer uma forma verbal, e “estavam com ele” preserva a relação de acompanhamento.
- source_word: לִפְנֵי הָאָרוֹן
  choice: diante da arca
  rationale: É uma tradução natural da expressão espacial e mantém “arca” sem acrescentar “da aliança”, ausente neste versículo.
- source_word: מְזַבְּחִים
  choice: sacrificando
  rationale: O particípio descreve a ação ritual em curso de oferecer os animais em sacrifício.
- source_word: צֹאן וּבָקָר
  choice: ovelhas e bois
  rationale: A expressão distingue animais de pequeno e grande porte; esta formulação concreta e corrente comunica claramente as espécies sacrificiais no contexto, embora צֹאן possa, em outros contextos, abranger também cabras.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: que ... não podiam ser contados nem enumerados
  rationale: A tradução mantém os dois verbos paralelos do hebraico e, assim, sua ênfase retórica na quantidade incontável.
- source_word: מֵרֹב
  choice: por serem tão numerosos
  rationale: 'A formulação explicita de modo natural a relação causal: não era possível contar os animais por causa de sua enorme quantidade.'
theological_decisions:
- issue: Identificação da arca
  choice: arca
  alternative: arca da aliança
  rationale: O hebraico deste versículo diz apenas “a arca”; a expansão acrescentaria informação do contexto mais amplo em vez de traduzir somente o texto presente.
- issue: Relação da assembleia com Salomão
  choice: que se reunira em torno dele
  alternative: que havia sido convocada diante dele
  rationale: A construção hebraica indica que a assembleia se reuniu em relação a Salomão, mas não determina com absoluta precisão se a ênfase recai na aproximação, na posição diante dele ou na convocação; a nota preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a repetição semântica de “contados nem enumerados” por refletir a ênfase do hebraico, e mantém-se a aparente redundância entre a assembleia reunida em torno de Salomão e sua presença com ele diante da arca.
