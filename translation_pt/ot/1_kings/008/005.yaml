- from: O rei Salomão e toda a assembleia de Israel, que se reunira em torno dele,[a] estavam com ele diante da arca, sacrificando ovelhas e bois que, por serem tão numerosos, não podiam ser contados nem enumerados.
  to: O rei Salomão e toda a assembleia de Israel, que se reunira junto dele,[a] estavam com ele diante da arca, sacrificando ovelhas e bois que, por serem tão numerosos, não podiam ser contados nem enumerados.
  rationale: A revisão retira a especificação espacial indevida de «em torno dele» e substitui a alternativa de nota que sugeria uma convocação não necessariamente expressa no hebraico. Preservam-se a ambiguidade da relação com Salomão, a repetição «junto dele ... com ele» e todas as demais escolhas fiéis ao texto-fonte.
