source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: pt
  text: então ouve no céu, o lugar onde habitas, perdoa, age e dá a cada um segundo todos os seus caminhos, cujo coração conheces — porque somente tu conheces o coração de todos os filhos do homem[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “todos os filhos do homem” refere-se a todos os seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: ouve
  rationale: No contexto da oração de Salomão, o imperfeito tem força de pedido. O imperativo português transmite com naturalidade a súplica dirigida a Deus.
- source_word: הַשָּׁמַיִם
  choice: no céu
  rationale: A expressão seguinte, “o lugar onde habitas”, esclarece o valor locativo. O singular coletivo “céu” é a forma mais natural em português neste contexto.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: o lugar onde habitas
  rationale: מָכוֹן indica um lugar estabelecido ou fixo; esta formulação preserva o sentido locativo sem rigidez.
- source_word: וְסָלַחְתָּ
  choice: perdoa
  rationale: O perfeito com waw prossegue a sequência de ações divinas solicitadas; o imperativo mantém em português a força da petição.
- source_word: וְעָשִׂיתָ
  choice: age
  rationale: O verbo é amplo, “fazer”, mas aqui denota a resposta efetiva de Deus. “Age” é conciso e não especifica indevidamente a ação.
- source_word: וְנָתַתָּ לָאִישׁ
  choice: dá a cada um
  rationale: O singular אִישׁ tem sentido distributivo no contexto. “A cada um” expressa isso de maneira clara e corrente.
- source_word: כְּכָל דְּרָכָיו
  choice: segundo todos os seus caminhos
  rationale: “Caminhos” preserva a metáfora hebraica para conduta e modo de vida, bem como sua ressonância bíblica.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: pois conheces o seu coração
  rationale: A oração relaciona a retribuição divina ao conhecimento que Deus tem do interior de cada pessoa. “Pois” exprime naturalmente essa relação sem restringi-la mais do que o hebraico.
- source_word: לְבָב / לְבָבוֹ
  choice: coração
  rationale: Embora inclua pensamento, vontade e interioridade, “coração” continua sendo o equivalente principal e preserva a imagem bíblica.
- source_word: לְבַדְּךָ
  choice: somente tu
  rationale: A formulação enfatiza de modo natural o conhecimento exclusivo de Deus.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: todos os filhos do homem
  rationale: A tradução conserva a expressão antropológica masculina e representativa do hebraico; a nota esclarece que ela abrange todos os seres humanos.
theological_decisions:
- issue: Expressão antropológica כָּל בְּנֵי הָאָדָם
  choice: todos os filhos do homem
  alternative: toda a humanidade
  rationale: A expressão hebraica é masculina e representativa. Mantê-la preserva a textura e a formulação antropológica do texto, enquanto a nota explicita seu alcance coletivo e inclusivo.
- issue: Relação entre o conhecimento do coração e a retribuição segundo os caminhos
  choice: pois conheces o seu coração
  alternative: cujo coração conheces
  rationale: O hebraico permite uma ligação relativa ou explicativa. “Pois” conserva a ideia de que a ação justa de Deus se fundamenta em seu conhecimento do interior humano, sem transformar o coração em fundamento separado dos caminhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “coração” e “caminhos” por sua força metafórica e bíblica. A sequência de imperativos comunica o caráter de súplica; os travessões preservam a continuidade da frase no contexto maior da oração.
