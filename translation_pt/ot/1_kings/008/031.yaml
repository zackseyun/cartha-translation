  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: pt
  text: Se um homem pecar contra o seu próximo, e lhe for imposto um juramento[a] para fazê-lo jurar, e o juramento vier diante do teu altar nesta casa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “maldição”; o termo hebraico pode se referir ao próprio juramento ou à maldição invocada em caso de violação do juramento.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: pecar
  rationale: Preserva a força moral e religiosa do verbo חטא, que neste contexto descreve uma falta cometida contra outra pessoa.
- source_word: אִישׁ
  choice: um homem
  rationale: Reproduz o masculino singular genérico do hebraico sem impedir sua aplicação representativa.
- source_word: לְרֵעֵהוּ
  choice: contra o seu próximo
  rationale: רֵעַ designa o semelhante, companheiro ou próximo; “próximo” é natural no registro bíblico e mantém o caráter interpessoal da falta.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: e lhe for imposto um juramento
  rationale: A formulação passiva conserva o sentido de colocar alguém sob juramento sem explicitar quem o impõe; “juramento” exprime o procedimento judicial, enquanto a possível nuance de maldição é registrada em nota.
- source_word: לְהַאֲלֹתוֹ
  choice: para fazê-lo jurar
  rationale: Preserva separadamente a força causativa do infinitivo hifil de אלה, em vez de fundi-la com a expressão anterior.
- source_word: וּבָא אָלָה
  choice: e o juramento chegar
  rationale: Mantém אָלָה como sujeito da oração e conserva a imagem jurídica e cultual de o juramento chegar à presença de Deus.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: diante do teu altar
  rationale: Tradução direta e idiomática da expressão espacial, que também possui valor judicial no contexto.
- source_word: בַּבַּיִת הַזֶּה
  choice: nesta casa
  rationale: Mantém o sentido literal de בַּיִת e sua ressonância teológica como a casa edificada para o SENHOR, embora o referente seja o templo.
theological_decisions:
- issue: Sentido de אָלָה no contexto judicial do templo
  choice: juramento
  alternative: maldição
  rationale: O contexto imediato descreve um ato judicial diante do altar, favorecendo “juramento”. Como אָלָה também pode indicar a maldição invocada como sanção do juramento, essa tensão lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “juramento” e a expressão “para fazê-lo jurar” foram mantidas para refletir os dois elementos distintos do hebraico. A vírgula final preserva a continuidade sintática com o versículo seguinte.
