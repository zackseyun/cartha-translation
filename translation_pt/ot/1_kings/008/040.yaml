base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: pt
  text: para que te temam todos os dias em que viverem[a] na terra[b] que deste aos nossos pais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto viverem” ou “por toda a vida”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre a face da terra”. A expressão hebraica também pode referir-se ao solo ou à terra em sentido mais amplo; aqui, o contexto aponta para a terra dada aos antepassados de Israel.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “aos nossos antepassados”. Hebraico: “aos nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado esperado no contexto da oração de Salomão, preservando naturalmente a força do hebraico.
- source_word: יִרָאוּךָ
  choice: te temam
  rationale: Preserva o sentido forte de ירא aplicado a Deus, que abrange temor, reverência e submissão, sem reduzi-lo a mero respeito.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: durante todos os dias em que viverem
  rationale: Mantém a imagem temporal do hebraico e comunica de modo claro que o temor deve perdurar por toda a vida.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face da terra
  rationale: Conserva a imagem idiomática hebraica. Em português, “terra” pode designar tanto a superfície terrestre quanto o território, e a oração relativa seguinte favorece aqui a referência à terra dada aos antepassados de Israel.
- source_word: אֲשֶׁר נָתַתָּה
  choice: que deste
  rationale: O pretérito perfeito expressa com naturalidade a dádiva divina já realizada na história de Israel.
- source_word: לַאֲבֹתֵינוּ
  choice: aos nossos pais
  rationale: Reproduz diretamente a expressão hebraica tradicional e seu peso pactual; “antepassados” permanece uma alternativa legítima em português.
theological_decisions:
- issue: Sentido de ירא em relação a Deus
  choice: te temam
  alternative: te reverenciem
  rationale: “Temer” preserva a categoria teológica bíblica do temor de Deus, que inclui reverência sem eliminar a força própria do termo.
- issue: Âmbito de הָאֲדָמָה
  choice: terra
  alternative: solo ou terra em sentido universal
  rationale: A oração relativa “que deste aos nossos pais” aponta contextualmente para a terra concedida a Israel, embora o substantivo hebraico e a expressão idiomática possam ter sentido mais amplo.
- issue: Referência de לַאֲבֹתֵינוּ
  choice: aos nossos pais
  alternative: aos nossos antepassados
  rationale: A tradução mantém a forma masculina explícita do hebraico e a linguagem pactual tradicional, sem negar que o termo possa funcionar coletivamente como referência aos antepassados.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a imagem hebraica “sobre a face da terra” e a expressão bíblica “temer” a Deus, esclarecendo em notas as alternativas idiomáticas e lexicais.
