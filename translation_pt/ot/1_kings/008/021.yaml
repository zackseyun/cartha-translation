reference: 1 Kings 8:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: pt
  text: E ali preparei um lugar para a arca, na qual está a aliança de Yahweh, que ele fez[a] com nossos pais[b] quando os tirou da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “cortou uma aliança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com nossos antepassados”. Hebraico: “com nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: E ali preparei um lugar
  rationale: שׂוּם significa pôr, colocar ou estabelecer. Com מָקוֹם לָאָרוֹן, “preparei um lugar” expressa em português natural a ação concluída de destinar um lugar para a arca, sem alterar o sentido locativo de שָׁם.
- source_word: לָאָרוֹן
  choice: para a arca
  rationale: אָרוֹן designa aqui a arca associada à aliança; “arca” é a forma bíblica corrente e o contexto torna desnecessário acrescentar “da aliança” neste ponto.
- source_word: אֲשֶׁר שָׁם
  choice: na qual está
  rationale: A construção hebraica é locativa, literalmente próxima de “na qual/onde está”. A formulação mantém a relação com a arca e não explicita além do hebraico o modo como a aliança está nela.
- source_word: בְּרִית יְהוָה
  choice: a aliança de Yahweh
  rationale: Preserva a relação de pertencimento do construto hebraico e verte o nome divino como nome próprio.
- source_word: כָּרַת
  choice: fez
  rationale: Embora o verbo signifique literalmente “cortou”, “fazer uma aliança” é o equivalente idiomático corrente em português; a imagem literal é registrada em nota.
- source_word: עִם אֲבֹתֵינוּ
  choice: com nossos pais
  rationale: אֲבוֹתֵינוּ é masculino plural e significa literalmente “nossos pais”; a possível abrangência no sentido de antepassados é indicada em nota.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: quando os tirou
  rationale: O infinitivo construto com בְּ tem valor temporal, e o hifil de יצא indica fazer sair ou tirar; “quando os tirou” é direto e natural.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Reproduz de modo idiomático a fórmula do êxodo e, com “tirou”, comunica claramente o movimento para fora do Egito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o translitera, em vez de substituí-lo por um título.
- issue: Sentido de אֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: A tradução principal conserva a forma masculina explícita do hebraico, enquanto a nota registra a extensão semântica possível.
- issue: Localização da aliança na arca
  choice: na qual está a aliança
  alternative: onde está a aliança; na qual estão as tábuas da aliança
  rationale: A redação mantém a formulação compacta e a ambiguidade do hebraico, sem inserir “tábuas”, palavra que não aparece neste versículo.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para fluência, mantendo o destaque locativo de “ali”. O nome Yahweh foi preservado, e não se acrescentou “tábuas” à referência compacta à aliança dentro da arca.
