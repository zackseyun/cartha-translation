  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: pt
  text: Se houver fome na terra, se houver peste, crestamento ou ferrugem, gafanhotos ou gafanhotos devoradores[a]; se o inimigo o sitiar na sua terra, em suas cidades[b]; qualquer praga, qualquer doença —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lagartas”; o termo hebraico pode indicar mais amplamente um gafanhoto devorador ou uma fase ou espécie particular de gafanhoto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na terra das suas portas”; aqui, “portas” representa as cidades ou localidades fortificadas da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: fome
  rationale: No catálogo de calamidades, indica fome generalizada, não mera fome individual.
- source_word: דֶּבֶר
  choice: peste
  rationale: Designa doença epidêmica; distingue-se do termo mais amplo נֶגַע no fim do versículo.
- source_word: שִׁדָּפוֹן
  choice: crestamento
  rationale: Refere-se a danos agrícolas causados por calor ou vento abrasador; é um termo português preciso para a queima e secagem das plantas.
- source_word: יֵרָקוֹן
  choice: ferrugem
  rationale: No contexto agrícola, refere-se ao amarelamento ou a uma doença das plantas; “ferrugem” é uma formulação tradicional e compreensível em português.
- source_word: אַרְבֶּה
  choice: gafanhotos
  rationale: É o termo comum para gafanhoto; o singular hebraico tem sentido coletivo, expresso naturalmente pelo plural em português.
- source_word: חָסִיל
  choice: gafanhotos devoradores
  rationale: A espécie ou fase exata do inseto é incerta. A expressão conserva sua natureza destrutiva sem identificá-lo categoricamente como lagarta.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: se o inimigo o cercar
  rationale: O verbo no Hifil comunica a ideia de encurralar ou sitiar; “cercar” preserva o sentido militar e funciona com o objeto pronominal singular do hebraico.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: na terra das suas cidades
  rationale: “Portas” funciona metonimicamente para cidades fortificadas. A tradução no texto comunica o sentido, e a imagem literal é preservada em nota.
- source_word: כָּל נֶגַע
  choice: qualquer praga
  rationale: נֶגַע é um termo abrangente para golpe, aflição ou praga; “qualquer” reproduz a força inclusiva de כָּל.
- source_word: כָּל מַחֲלָה
  choice: qualquer doença
  rationale: Termo geral para enfermidade, mantido distinto de “praga”.
