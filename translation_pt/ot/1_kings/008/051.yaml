id: 1KI.8.51
reference: 1 Kings 8:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: pt
  text: Pois eles são o teu povo e a tua herança[a], que tiraste do Egito, do meio da fornalha de ferro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tua propriedade” ou “teu patrimônio”.
    reason: lexical_alternative
  - marker: b
    text: “Fornalha de ferro” é uma metáfora que descreve o Egito como lugar de intensa opressão e aflição; compare Deuteronômio 4:20.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta o pedido de Salomão no contexto da oração, preservando o valor explicativo da conjunção.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Reproduz de maneira direta e natural a designação pactual de Israel.
- source_word: וְנַחֲלָתְךָ
  choice: e a tua herança
  rationale: Mantém a linguagem hebraica de herança ou porção atribuída, segundo a qual o povo pertence a Deus, sem reduzir o sentido à mera propriedade.
- source_word: הֵם
  choice: eles são
  rationale: Expressa o pronome independente e a predicação de modo natural em português.
- source_word: אֲשֶׁר
  choice: que
  rationale: Retoma o povo mencionado e introduz naturalmente a oração relativa em português.
- source_word: הוֹצֵאתָ
  choice: tiraste
  rationale: 'O hifil de יצא tem aqui sentido causativo: fazer sair. “Tiraste do Egito” é idiomático e preserva a fórmula do êxodo.'
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Com “tiraste”, indica com clareza a origem do movimento para fora do Egito.
- source_word: מִתּוֹךְ
  choice: do meio da
  rationale: Preserva a imagem espacial de ser retirado de dentro de algo.
- source_word: כּוּר הַבַּרְזֶל
  choice: fornalha de ferro
  rationale: Conserva a metáfora bíblica compacta para um lugar de opressão e aflição intensas, sem explicá-la dentro do texto.
theological_decisions:
- issue: Designação pactual de Israel como herança de Deus
  choice: Manter “tua herança” no texto principal
  alternative: “tua propriedade” ou “teu patrimônio”
  rationale: O hebraico contém linguagem de herança, porção atribuída e pertencimento. “Herança” preserva essa densidade teológica sem acrescentar uma interpretação doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura permanece próxima do hebraico, e a metáfora é preservada no texto, sendo esclarecida apenas em nota.
