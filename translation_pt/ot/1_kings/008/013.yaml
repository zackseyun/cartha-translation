  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: pt
  text: De fato, construí para ti uma casa majestosa[a], um lugar permanente para habitares para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma morada elevada/sublime”. O hebraico זְבֻל designa uma morada elevada ou exaltada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um lugar fixo para a tua habitação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: Sim, eu construí
  rationale: O infinitivo absoluto antes do verbo finito intensifica a afirmação. “Sim” comunica essa ênfase de modo natural em português.
- source_word: בֵּית זְבֻל
  choice: uma casa elevada
  rationale: Mantém “casa”, em vez de explicitar “templo”, e entende זְבֻל como qualificando uma morada alta, sublime ou majestosa.
- source_word: לָךְ
  choice: para ti
  rationale: Expressa o benefício ou a destinação e preserva a fala dirigida pessoalmente a Deus.
- source_word: מָכוֹן
  choice: um lugar estabelecido
  rationale: O substantivo indica um lugar firme, fixado ou estabelecido, destacando estabilidade e permanência.
- source_word: לְשִׁבְתְּךָ
  choice: para habitares
  rationale: ישׁב pode significar sentar-se, habitar ou, em certos contextos, estar entronizado. “Habitares” é claro e preserva a imagem da casa sem excluir totalmente a ressonância régia.
- source_word: עוֹלָמִים
  choice: para sempre
  rationale: A expressão comunica duração contínua ou indefinidamente longa; “para sempre” é a forma corrente e digna em português.
theological_decisions:
- issue: A linguagem do templo como morada permanente de Deus
  choice: Preservar sem qualificação a afirmação de que o lugar foi construído para Deus habitar para sempre
  alternative: Parafrasear como lugar para o nome de Deus ou como lugar onde Deus seria adorado
  rationale: O hebraico deste versículo fala diretamente de uma casa e de um lugar para Deus habitar. A tradução não deve inserir aqui qualificações teológicas oriundas do contexto mais amplo.
- issue: Possível sentido de entronização em לְשִׁבְתְּךָ
  choice: para habitares
  alternative: para te assentares ou para seres entronizado
  rationale: O contexto do templo admite uma ressonância de entronização, mas o sentido comum de habitar se ajusta diretamente à imagem de uma casa e deixa a tensão sem impor uma leitura exclusivamente régia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes (“ti”, “habitares”). A estrutura conserva o paralelismo e a linguagem concreta do hebraico.
