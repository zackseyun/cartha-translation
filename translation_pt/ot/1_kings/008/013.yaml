    issue: «Sim» para o infinitivo absoluto enfático
    rationale: Embora possível, «Sim» tem em português uma força conversacional de assentimento. «De fato» expressa mais diretamente a intensificação de בָּנֹה בָנִיתִי.
  - severity: low
    issue: Possível ambiguidade espacial em «casa elevada»
    rationale: «Elevada» pode sugerir principalmente altura física. «Majestosa» preserva melhor, em português corrente, o valor de morada elevada/exaltada de זְבֻל.
  - severity: low
    issue: «Lugar estabelecido» é menos idiomático
    rationale: «Lugar permanente» é mais fluente e conserva o sentido de lugar firme ou fixo de מָכוֹן.
