lexical_decisions:
- source_word: וַיִּקָּהֲלוּ אֶל
  choice: se reuniram diante de
  rationale: O verbo indica reunir-se em assembleia, e a preposição אֶל orienta a reunião para a presença do rei; “diante de” expressa naturalmente esse sentido no contexto.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: Mantém a formulação distributiva do hebraico e identifica os homens israelitas convocados para a assembleia.
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: no mês de Etanim
  rationale: Preserva por transliteração o antigo nome próprio do mês, em vez de substituí-lo por uma identificação não presente no texto.
- source_word: בֶּחָג
  choice: para a festa
  rationale: No contexto, a preposição pode situar a reunião por ocasião da festa; “para a festa” comunica de modo natural sua finalidade e ocasião.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: que é o sétimo mês
  rationale: Reproduz diretamente a explicação calendárica fornecida pelo texto hebraico.
