source:
  edition: WLC
  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: pt
  text: para inclinar o nosso coração para si, a fim de andarmos em todos os seus caminhos e guardarmos os seus mandamentos, os seus estatutos e os seus juízos, que ele ordenou aos nossos pais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos nossos antepassados”. O hebraico diz “aos nossos pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: inclinar
  rationale: O infinitivo hifil de נטה expressa fazer voltar ou inclinar. “Inclinar” preserva a metáfora de Deus direcionar o interior humano e soa natural em português bíblico atual.
- source_word: לְבָבֵנוּ
  choice: o nosso coração
  rationale: לֵבָב abrange vontade, pensamento e afetos. O singular hebraico com sufixo plural é preservado por “o nosso coração”, expressão coletiva compreensível em português.
- source_word: אֵלָיו
  choice: para si
  rationale: A preposição indica direção para Deus; “para si” preserva a referência reflexiva ao sujeito divino.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: andarmos em todos os seus caminhos
  rationale: Mantém a metáfora pactual de הלך e a expressão “em todos os seus caminhos”, sem reduzir seu sentido a uma paráfrase como “vivermos”.
- source_word: וְלִשְׁמֹר
  choice: e guardarmos
  rationale: שׁמר, empregado com mandamentos, significa guardar ou observar. “Guardar” conserva o vocabulário pactual e é corrente em português.
- source_word: מִצְוֺתָיו
  choice: os seus mandamentos
  rationale: מִצְוָה designa obrigações ordenadas; “mandamentos” mantém o registro formal e a distinção entre os três termos jurídicos.
- source_word: וְחֻקָּיו
  choice: os seus estatutos
  rationale: חֹק/חֻקָּה refere-se a prescrições estabelecidas. “Estatutos” é preciso e distingue o termo de mandamentos e juízos.
- source_word: וּמִשְׁפָּטָיו
  choice: os seus juízos
  rationale: מִשְׁפָּט pode denotar juízos, decisões ou ordenanças legais. “Juízos” preserva a nuance jurídica e a tríade lexical.
- source_word: אֲשֶׁר צִוָּה
  choice: que ele ordenou
  rationale: Traduz diretamente a oração relativa e o verbo צוה, sem substituir a ideia explícita de ordenar pela mais geral de dar.
- source_word: אֶת אֲבֹתֵינוּ
  choice: aos nossos pais
  rationale: אָבוֹתֵינוּ é uma expressão masculina que se refere aos antepassados de Israel. “Nossos pais” corresponde formalmente ao hebraico; “nossos antepassados” é uma alternativa contextual.
theological_decisions:
- issue: Terminologia da lei da aliança em uma tríade
  choice: os seus mandamentos, os seus estatutos e os seus juízos
  alternative: as suas ordens, os seus decretos e as suas ordenanças
  rationale: O hebraico emprega três termos jurídicos distintos. Preservá-los evita nivelar a textura pactual do texto.
- issue: Referência ancestral marcada pelo gênero
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O hebraico usa explicitamente o substantivo masculino אָבוֹת. A tradução principal conserva essa forma, enquanto a nota esclarece a alternativa abrangente possível no contexto.
- issue: Ação divina sobre o coração humano
  choice: para inclinar o nosso coração para si
  alternative: para voltar o nosso coração para ele
  rationale: “Inclinar” preserva a metáfora causativa sem explicar além do texto como a ação divina se relaciona com a resposta humana, mantendo a tensão teológica da oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se os idiomas bíblicos “inclinar o coração” e “andar nos caminhos”, bem como a tríade jurídica do hebraico. A construção “a fim de andarmos... e guardarmos” explicita naturalmente em português a relação de finalidade dos infinitivos hebraicos.
