id: 1KI.8.20
reference: 1 Kings 8:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: pt
  text: E Yahweh cumpriu a palavra que tinha falado[a], e eu sucedi a Davi, meu pai, e me assentei no trono de Israel, conforme Yahweh tinha falado, e construí a casa[b] para o nome de Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confirmou a palavra que tinha falado” ou “fez cumprir a palavra que tinha falado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a casa”; isto é, o templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: cumpriu
  rationale: No hifil, tendo como objeto “palavra”, קום indica fazer valer ou levar a efeito aquilo que foi dito; “cumpriu” expressa naturalmente esse sentido no contexto de uma promessa realizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: a palavra que tinha falado
  rationale: Conserva a repetição lexical de דבר e evita substituir explicitamente “palavra” por “promessa”, embora o contexto seja promissório.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: Eu sucedi a Davi, meu pai
  rationale: A combinação de קום com תחת descreve Salomão levantando-se para ocupar o lugar de Davi; “sucedi” comunica com clareza a sucessão dinástica em português corrente.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: e me assentei no trono de Israel
  rationale: Expressa a entronização resultante, mantendo a imagem concreta de sentar-se no trono.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: conforme Yahweh tinha falado
  rationale: Mantém a correspondência com o que Yahweh havia declarado e preserva a repetição do verbo “falar”.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: e construí o templo
  rationale: הַבַּיִת significa literalmente “a casa”, mas, neste contexto imediato, designa inequivocamente o templo; a nota conserva a forma hebraica.
- source_word: לְשֵׁם יְהוָה
  choice: para o nome de Yahweh
  rationale: Preserva a formulação teologicamente significativa do hebraico, sem reduzi-la a “em honra de”.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e convencional do título pactual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino; “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido de הַבַּיִת
  choice: templo no texto, com nota sobre o literal “a casa”
  alternative: a casa
  rationale: “Templo” identifica com naturalidade o referente para o leitor moderno, enquanto a nota preserva a metáfora hebraica e sua possível ressonância teológica.
- issue: Relação entre קום e תחת na sucessão de Davi
  choice: sucedi a Davi
  alternative: levantei-me no lugar de Davi
  rationale: A tradução explicita o sentido dinástico exigido pelo contexto sem sugerir oposição hostil; a imagem verbal isolada de “levantar-se” não precisa ser reproduzida à custa da clareza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Os tempos passados foram harmonizados como relato de ações já realizadas. Mantiveram-se “Yahweh” e a expressão “para o nome de Yahweh”; evitou-se linguagem denominacional.
