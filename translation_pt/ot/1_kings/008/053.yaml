  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: pt
  text: Pois tu os separaste para ti como herança, dentre todos os povos da terra, assim como falaste por meio de Moisés, teu servo[a], quando tiraste nossos pais[b] do Egito, Senhor Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés, teu servo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nossos antepassados”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Senhor YHWH”; “Yahweh” representa o nome divino יהוה.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: os separaste
  rationale: O hifil de בדל indica separar ou pôr à parte. “Os separaste” é claro e preserva a ideia de distinção de Israel sem acrescentar uma interpretação específica de consagração.
- source_word: לְךָ לְנַחֲלָה
  choice: para ti como herança
  rationale: A expressão comunica que o povo foi separado para pertencer a Deus como sua herança ou porção. A formulação mantém a linguagem pactual de נחלה.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: dentre todos os povos da terra
  rationale: “Dentre” expressa a separação do povo de Israel em relação ao conjunto das nações, e “terra” preserva o alcance amplo do contexto.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: assim como falaste
  rationale: A construção introduz a correspondência entre o ato de Deus e sua palavra anterior; “assim como” conserva essa relação.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: por meio de Moisés, teu servo
  rationale: A expressão hebraica literalmente diz “pela mão de Moisés” e indica mediação ou agência. “Por meio de” transmite naturalmente esse sentido em português, enquanto a alternativa literal é registrada em nota.
- source_word: בְּהוֹצִיאֲךָ
  choice: quando tiraste
  rationale: O infinitivo construto com בְּ tem valor circunstancial temporal. “Quando tiraste” é natural e preserva esse valor.
- source_word: אֶת אֲבֹתֵינוּ
  choice: nossos pais
  rationale: A tradução mantém a forma masculina do hebraico e a referência às gerações anteriores de Israel. “Nossos antepassados” é uma alternativa legítima e mais abrangente em português corrente.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Em português, “tirar do Egito” expressa naturalmente tanto a origem quanto o movimento para fora indicados pela preposição hebraica.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: 'A tradução conserva os dois elementos: o título אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”, sem substituir o nome próprio por outro título.'
theological_decisions:
- issue: Tradução do nome divino יהוה na combinação אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: “Senhor Yahweh” distingue o título אֲדֹנָי do nome pactual יהוה e torna visível a presença do nome divino no texto. “Senhor DEUS” representa uma convenção tradicional, mas encobre o nome próprio.
- issue: Sentido de Israel como נחלה de Deus
  choice: como herança
  alternative: como propriedade
  rationale: “Herança” preserva a metáfora bíblica de uma porção atribuída e pertencente a Deus, sem reduzi-la à noção mais genérica de propriedade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas verbais em segunda pessoa singular coerentes com a oração dirigida a Deus. A ordem da frase acompanha de perto o hebraico, mas “por meio de” substitui o idiomatismo pouco corrente “pela mão de” no texto principal.
