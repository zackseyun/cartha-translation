  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ/ן אִ֚ישׁ נֶ֣גַע לְבָב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: pt
  text: toda oração, toda súplica que qualquer pessoa ou todo o teu povo Israel fizer[a], cada um conhecendo a aflição do próprio coração[b] e estendendo as mãos em direção a esta casa[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que for feita em favor de qualquer pessoa ou de todo o teu povo Israel”. A construção hebraica com a preposição “a/para” admite mais de uma compreensão aqui.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “a praga do seu coração”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, o templo, chamado aqui de “esta casa”.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: toda oração, toda súplica
  rationale: A repetição de כָּל é preservada para manter a abrangência e o paralelismo. “Súplica” expressa o pedido insistente de favor indicado por תְּחִנָּה.
- source_word: אֲשֶׁר תִהְיֶה לְכָל הָאָדָם לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: que qualquer pessoa ou todo o teu povo Israel fizer
  rationale: O verbo “fizer” completa naturalmente em português a ideia de fazer uma oração ou súplica. A preposição לְ admite mais de uma análise; o contexto favorece entender a oração como feita pelo indivíduo ou pelo povo.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: cada um reconhecendo
  rationale: אִישׁ tem força distributiva dentro do conjunto. “Reconhecendo” comunica não apenas conhecimento abstrato, mas consciência pessoal da aflição, sem eliminar a noção básica de saber.
- source_word: נֶגַע לְבָבוֹ
  choice: a aflição do próprio coração
  rationale: נֶגַע pode significar golpe, praga ou aflição. Aqui, “aflição” é natural e preserva a ideia de sofrimento íntimo; “próprio” explicita a referência reflexiva.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: e estendendo as mãos
  rationale: A expressão descreve o gesto de abrir ou estender as palmas em oração. “Estender as mãos” é corrente e digna em português.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: em direção a esta casa
  rationale: אֶל indica orientação. “Casa” mantém o termo hebraico e sua ressonância, enquanto a nota identifica claramente o templo.
theological_decisions:
- issue: Sentido da preposição לְ antes do indivíduo e do povo
  choice: oração ou súplica feita por eles
  alternative: oração ou súplica feita em favor deles
  rationale: A sequência com “cada um” e o gesto de estender as mãos favorece identificar o indivíduo ou o povo como quem ora. Como a preposição permanece ambígua, a alternativa é registrada em nota.
- issue: Representação de הָאָדָם no singular genérico
  choice: qualquer pessoa
  alternative: qualquer homem
  rationale: Neste contexto, אָדָם designa qualquer indivíduo do povo, sem contraste específico entre os sexos. “Pessoa” preserva a referência humana singular e é natural em português moderno.
- issue: Tradução de הַבַּיִת
  choice: casa
  alternative: templo
  rationale: Embora o referente seja o templo, o texto diz literalmente “casa”. A tradução mantém a formulação e sua ressonância teológica, com esclarecimento em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi mantido, e as ambiguidades relevantes foram registradas em notas.
