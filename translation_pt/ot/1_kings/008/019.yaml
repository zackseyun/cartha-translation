base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: pt
  text: Contudo, não será você quem construirá a casa; mas será seu filho, que sairá do seu próprio corpo[a], quem construirá a casa para o meu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que sairá dos seus lombos”, expressão que indica um descendente biológico seu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Introduz uma ressalva à aprovação anterior da intenção de Davi, com força concessiva natural em português.
- source_word: לֹא תִבְנֶה
  choice: não será você quem construirá
  rationale: Expressa a declaração divina solene e mantém aberta a nuance entre determinação e proibição, enquanto o foco contrastivo recai em Davi.
- source_word: הַבָּיִת
  choice: a casa
  rationale: Preserva o termo hebraico e o significativo idioma teológico da casa edificada para o nome do SENHOR, sem substituí-lo interpretativamente por 'templo'.
- source_word: כִּי אִם
  choice: mas
  rationale: 'Marca com clareza o contraste corretivo: não Davi, mas seu filho.'
- source_word: בִּנְךָ
  choice: seu filho
  rationale: O singular com sufixo aponta para um descendente específico no contexto.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: que sairá do seu próprio corpo
  rationale: Comunica de modo atual a descendência física, enquanto a nota preserva a imagem literal dos lombos.
- source_word: הוּא
  choice: ele
  rationale: Mantém o pronome independente enfático, destacando que é o filho, e não Davi, quem construirá.
- source_word: יִבְנֶה הַבַּיִת
  choice: ele construirá a casa
  rationale: Conserva a repetição do hebraico e apresenta a ação como promessa ou decreto futuro.
- source_word: לִשְׁמִי
  choice: para o meu nome
  rationale: Preserva a expressão bíblica e sua significação pactual sem expansão interpretativa.
theological_decisions:
- issue: Traduzir בַּיִת como 'casa' ou interpretativamente como 'templo'
  choice: casa
  alternative: templo
  rationale: O hebraico emprega 'casa'. Embora o referente seja o templo, manter 'casa' preserva a formulação e o idioma teológico do texto.
- issue: Entender לֹא תִבְנֶה como proibição ou predição/decreto
  choice: não será você quem construirá
  alternative: você não deve construir
  rationale: A formulação escolhida evita resolver indevidamente a tensão entre proibição e determinação futura e ressalta o contraste com o filho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção clivada reforça o contraste presente no hebraico, e a repetição de 'casa' e 'construirá' preserva a estrutura do original.
