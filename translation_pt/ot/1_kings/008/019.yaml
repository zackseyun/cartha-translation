  source_fidelity: A tradução preserva bem a ressalva de רַק, o contraste de כִּי אִם, a repetição de «casa» e a expressão «para o meu nome». «Não será você quem construirá» transmite adequadamente a declaração negativa e seu contraste com o filho. A nota conserva de forma apropriada a imagem literal de מֵחֲלָצֶיךָ.
