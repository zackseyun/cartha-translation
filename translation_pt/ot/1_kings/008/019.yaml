  terminology: «Casa» é a escolha correta para manter o vocabulário hebraico, sem antecipar interpretativamente «templo». «Do seu próprio corpo» comunica descendência física de forma contemporânea; a nota com «lombos» fornece a alternativa mais literal. «Descendente físico» é compreensível, mas «descendente biológico» é mais natural em português atual.
