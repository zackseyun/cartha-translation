  source_fidelity: A tradução representa com precisão a fórmula de bênção, o nome divino, a identificação «o Deus de Israel», o paralelismo explícito entre boca e mão, o destinatário «Davi, meu pai» e o cumprimento daquilo que foi dito. «O que disse» explicita legitimamente o objeto subentendido de מִלֵּא.
