  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣ד אָבִ֑/י וּ/בְ/יָד֥/וֹ מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: pt
  text: 'E disse: “Bendito seja Yahweh, o Deus de Israel, que falou com a sua boca a Davi, meu pai, e com a sua mão cumpriu o que disse, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Preserva a fórmula hebraica de bênção em linguagem portuguesa tradicional, digna e ainda corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente a cadeia construta que identifica Yahweh em relação a Israel.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: que falou com a sua boca
  rationale: Mantém a menção explícita à boca e o paralelismo concreto entre falar com a boca e cumprir com a mão.
- source_word: אֵת דָּוִד אָבִי
  choice: a Davi, meu pai
  rationale: Com דִּבֶּר, אֵת introduz aqui a pessoa a quem Deus falou; a construção é natural em português.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: e com a sua mão cumpriu o que disse
  rationale: Conserva a imagem da mão como ação e explicita apenas o objeto implícito, isto é, aquilo que Deus havia falado.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a citação direta continuada no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação conserva o paralelismo hebraico entre “boca” e “mão”. A frase termina em dois-pontos porque לֵאמֹר introduz as palavras citadas no versículo seguinte.
