base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: pt
  text: Quando os céus se fecharem e não houver chuva, porque pecarem contra ti, e orarem voltados para este lugar, louvarem o teu nome[a] e se afastarem do seu pecado, porque tu lhes respondes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “derem graças ao teu nome”, “confessarem o teu nome” ou “reconhecerem o teu nome”. O verbo hebraico pode indicar louvor agradecido ou reconhecimento/confissão pública.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque tu os afliges” ou “os humilhas”. A vocalização massorética lê “porque tu lhes respondes”; as mesmas consoantes, sem essa vocalização, também podem ser entendidas como “porque tu os afliges/humilhas”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: Quando os céus se fecharem
  rationale: O infinitivo nifal com בְּ introduz uma circunstância temporal. “Os céus se fecharem” conserva a imagem hebraica e soa natural no contexto da chuva retida.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: e não houver chuva
  rationale: A forma portuguesa harmoniza com a oração temporal iniciada por “quando” e expressa diretamente o resultado de os céus se fecharem.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: porque pecaram contra ti
  rationale: כִּי é causal, e לָךְ indica que o pecado é cometido contra Deus. O pretérito perfeito apresenta o pecado como causa da seca.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: e eles orarem voltados para este lugar
  rationale: אֶל indica direção neste contexto. “Voltados para” deixa claro que a oração é dirigida a Deus, embora orientada para o templo.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: reconhecerem o teu nome
  rationale: O hifil de ידה pode expressar louvor agradecido, confissão ou reconhecimento público. “Reconhecerem” preserva a amplitude contextual sem reduzir o verbo apenas a agradecimento; a nota registra as alternativas.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: e se afastarem do seu pecado
  rationale: שׁוב com מִן descreve o ato de abandonar ou voltar-se para longe do pecado. A formulação é clara e evita substituir a imagem verbal por um termo teológico mais interpretativo.
- source_word: כִּי תַעֲנֵם
  choice: porque tu os afliges
  rationale: A vocalização massorética favorece o hifil de ענה, “afligir/humilhar”. No contexto, a disciplina da seca leva o povo a abandonar o pecado. A possibilidade de entender as mesmas consoantes em relação a “responder” é indicada em nota.
theological_decisions:
- issue: Direção da oração para o templo
  choice: orarem voltados para este lugar
  alternative: orarem a este lugar
  rationale: O templo é o ponto de orientação da oração, não seu destinatário. A tradução mantém essa distinção sem acrescentar uma explicação doutrinária ao texto.
- issue: Sentido de תַעֲנֵם
  choice: porque tu os afliges
  alternative: porque tu lhes respondes
  rationale: A vocalização e a lógica imediata da seca como disciplina favorecem “afliges”. Como a leitura “respondes” tem apoio na ambiguidade consonantal e na história de interpretação, ela é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A sequência sintática permanece aberta, pois o período continua no versículo seguinte; por isso o texto termina com vírgula.
