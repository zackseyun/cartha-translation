source:
  edition: WLC
  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: pt
  text: para que todos os povos da terra saibam que o SENHOR, ele é Deus; não há outro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: para que ... saibam
  rationale: Expressa naturalmente em português a finalidade indicada por לְמַעַן com o infinitivo construto דַּעַת.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: todos os povos da terra
  rationale: Preserva o plural עַמֵּי e o alcance universal da expressão.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção tradicional portuguesa de representar o nome divino por SENHOR em versaletes, aqui indicado por maiúsculas.
- source_word: הוּא הָאֱלֹהִים
  choice: é Deus
  rationale: Em português, a cópula explícita comunica naturalmente a oração nominal hebraica; o pronome הוּא dá ênfase, mas vertê-lo como 'ele é' seria pouco idiomático neste contexto.
- source_word: אֵין עוֹד
  choice: não há outro
  rationale: Mantém a formulação absoluta e concisa do hebraico, cujo referente implícito é outro Deus.
theological_decisions:
- issue: Exclusividade divina em אֵין עוֹד
  choice: não há outro
  alternative: não existe nenhum outro Deus
  rationale: A tradução preserva a concisão e a elipse do original, sem enfraquecer sua afirmação de exclusividade.
- issue: Ênfase de הוּא em יְהוָה הוּא הָאֱלֹהִים
  choice: o SENHOR é Deus
  alternative: o SENHOR, ele é Deus
  rationale: A forma escolhida é digna e idiomática em português; a identidade enfática permanece clara pela estrutura da declaração, sem introduzir uma duplicação pronominal artificial.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A coordenação com 'e que' torna explícita a continuidade entre os dois conteúdos do conhecimento, sem alterar o sentido.
