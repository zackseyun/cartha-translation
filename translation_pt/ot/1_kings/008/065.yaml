  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: pt
  text: Naquele tempo, Salomão celebrou a festa, e todo o Israel com ele — uma grande assembleia, desde Lebo-Hamate[a] até o ribeiro do Egito[b] — diante de Yahweh, nosso Deus, durante sete dias e sete dias, catorze dias ao todo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde a entrada de Hamate”. O hebraico pode ser entendido como uma expressão descritiva de fronteira ou como o nome do lugar Lebo-Hamate.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o uádi do Egito”. O termo hebraico muitas vezes designa um leito de água sazonal, não um grande rio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: celebrou a festa
  rationale: Embora o verbo signifique literalmente “fez”, junto de חָג forma uma expressão idiomática para celebrar ou observar uma festa. “Celebrou a festa” é natural e mantém o caráter religioso do acontecimento.
- source_word: קָהָל גָּדוֹל
  choice: uma grande assembleia
  rationale: קָהָל designa a comunidade reunida. “Assembleia” conserva o sentido coletivo e formal sem introduzir uma conotação eclesiástica específica.
- source_word: מִלְּבוֹא חֲמָת
  choice: desde Lebo-Hamate
  rationale: A expressão funciona frequentemente como topônimo e marco territorial. A leitura descritiva “entrada de Hamate” é preservada em nota.
- source_word: נַחַל מִצְרַיִם
  choice: o ribeiro do Egito
  rationale: נַחַל costuma indicar um curso de água, muitas vezes sazonal, e não um grande rio. “Ribeiro” evita a possível confusão com o Nilo; a alternativa geograficamente mais técnica aparece em nota.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: diante de Yahweh, nosso Deus
  rationale: “Diante de” expressa diretamente a relação espacial e cultual de לִפְנֵי, enquanto “nosso Deus” conserva a primeira pessoa plural do hebraico.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים ... אַרְבָּעָה עָשָׂר יוֹם
  choice: durante sete dias e sete dias, catorze dias ao todo
  rationale: A tradução mantém a repetição deliberada das duas unidades de sete dias e torna explícita, por meio de “ao todo”, a função resumitiva da expressão final já presente no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio divino sem substituí-lo por um título e segue a convenção indicada pelo projeto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura em travessões organiza a aposição geográfica sem alterar as relações sintáticas. A repetição “sete dias e sete dias” foi mantida para refletir a forma enfática e estrutural do hebraico.
