  terminology: «Yahweh» corresponde ao Tetragrama e à convenção do projeto. «Lebo-Hamate» preserva de modo prudente o possível topônimo, com a leitura descritiva na nota. «Ribeiro do Egito» é uma opção defensável para נחל, e a nota esclarece corretamente a alternativa «uádi» e evita identificar indevidamente o curso de água com um grande rio.
