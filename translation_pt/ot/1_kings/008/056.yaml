source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: pt
  text: Bendito seja Yahweh, que deu descanso ao seu povo Israel, conforme tudo o que falou. Não deixou de se cumprir uma só palavra de todas as suas boas palavras[a], que falou por meio de Moisés, seu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não deixou de se cumprir uma só promessa de todas as suas boas promessas”, pois “palavra” aqui tem o sentido contextual de promessa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Preserva a fórmula exclamativa e doxológica do hebraico em português natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נָתַן מְנוּחָה
  choice: deu descanso
  rationale: Expressa o repouso estável concedido ao povo após conflitos e instabilidade, sem reduzi-lo a uma sensação interior de paz.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: ao seu povo Israel
  rationale: Reproduz de modo natural a relação de aposição e mantém a linguagem da aliança.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: conforme tudo o que havia dito
  rationale: Mantém o verbo de fala do original, sem substituí-lo no texto principal pelo mais interpretativo 'prometido'.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: Não deixou de se cumprir uma só palavra
  rationale: Comunica em português atual o sentido idiomático de que nenhuma palavra pronunciada falhou ou ficou sem realização.
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: de todas as suas boas palavras
  rationale: O plural natural em português comunica o valor coletivo do singular hebraico no contexto, preservando o termo 'palavra'.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Traduz naturalmente a fórmula hebraica de agência, indicando Moisés como mediador da fala divina.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: É a designação honorífica e contextualmente adequada de Moisés como agente comissionado por Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de דָּבָר / דְּבָרוֹ
  choice: palavra
  alternative: promessa
  rationale: O contexto envolve promessas cumpridas, mas o hebraico emprega repetidamente o termo 'palavra'. O texto principal conserva essa forma, e a nota registra a nuance legítima de promessa.
- issue: Valor idiomático de לֹא נָפַל
  choice: Não deixou de se cumprir
  alternative: Não falhou; não caiu
  rationale: A expressão afirma a plena eficácia da palavra divina. A formulação escolhida torna o idioma hebraico claro sem acrescentar uma conclusão doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a repetição temática de “palavra” e a tensão entre a formulação literal e sua nuance de promessa, esclarecida em nota.
