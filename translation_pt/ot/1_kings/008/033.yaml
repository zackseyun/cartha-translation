  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: pt
  text: Quando o teu povo, Israel, for derrotado diante de um inimigo porque pecou contra ti, e voltar para ti, confessar o teu nome[a], orar e suplicar a ti nesta casa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “louvar o teu nome” ou “dar graças ao teu nome”. O verbo hebraico pode indicar confissão, louvor ou ação de graças, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: for derrotado
  rationale: O infinitivo nifal de נָגַף, em contexto militar, indica sofrer derrota. “For derrotado” preserva a voz passiva e soa natural em português.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: o teu povo Israel
  rationale: Mantém tanto o possessivo de aliança quanto a identificação do povo como Israel.
- source_word: לִפְנֵי אוֹיֵב
  choice: diante de um inimigo
  rationale: Reproduz de perto לִפְנֵי, “diante de”, e mantém indefinido o substantivo hebraico sem artigo.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: por ter pecado contra ti
  rationale: 'Expressa naturalmente a relação causal indicada pelo contexto: a derrota decorre do pecado contra Deus.'
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: e eles voltarem para ti
  rationale: Preserva a imagem lexical de retornar a Deus sem ampliar o verbo para uma formulação doutrinária mais específica.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: confessarem o teu nome
  rationale: No contexto de pecado, derrota e retorno, “confessarem” comunica o reconhecimento de Deus; a amplitude semântica do verbo é preservada em nota.
- source_word: וְהִתְפַּלְלוּ
  choice: orarem
  rationale: Equivalente corrente e direto do hitpael de פלל.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: e suplicarem a ti
  rationale: Traduz a súplica insistente dirigida a Deus sem acrescentar explicitamente um objeto, como “favor”, que não aparece separado no texto.
- source_word: בַּבַּיִת הַזֶּה
  choice: nesta casa
  rationale: Mantém a preposição “em” e o termo “casa”; no contexto, trata-se do templo, mas “casa” preserva a forma do hebraico.
theological_decisions:
- issue: Linguagem de retorno após o pecado
  choice: voltarem para ti
  alternative: se arrependerem e voltarem para ti
  rationale: שׁוּב significa voltar ou retornar. A opção escolhida preserva o movimento de restauração sem inserir uma formulação teológica mais ampla do que o verbo, isoladamente, expressa.
- issue: Sentido de וְהוֹדוּ אֶת שְׁמֶךָ
  choice: confessarem o teu nome
  alternative: louvarem o teu nome / derem graças ao teu nome
  rationale: O contexto penitencial favorece “confessarem”, mas o verbo também pode indicar louvor ou ação de graças; por isso, as alternativas legítimas são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “teu/ti” mantém a referência singular a Deus e o paralelismo da oração. A frase permanece aberta com vírgula porque o versículo integra uma construção condicional continuada no versículo seguinte.
