  text: וַֽ/יַּאֲרִכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הַ/קֹּ֨דֶשׁ֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: pt
  text: As varas eram tão compridas que suas pontas podiam ser vistas do Lugar Santo, diante do santuário interior[a], mas não podiam ser vistas de fora; e elas permanecem ali até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do Lugar Santíssimo”. O termo hebraico se refere ao santuário interior do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: eram tão compridas
  rationale: Expressa de modo natural em português o estado ou resultado indicado por ארך e a relação com a visibilidade mencionada em seguida.
- source_word: הַבַּדִּים
  choice: as varas
  rationale: בַּדִּים designa as varas usadas para transportar a arca. “Varas” é corrente e claro no contexto bíblico.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: suas pontas podiam ser vistas
  rationale: רָאשֵׁי, literalmente “cabeças”, refere-se naturalmente às pontas das varas; o nifal de ראה indica que eram visíveis ou podiam ser vistas.
- source_word: מִן הַקֹּדֶשׁ
  choice: do Lugar Santo
  rationale: Aqui הַקֹּדֶשׁ indica o compartimento externo do templo, em contraste com o santuário interior; a forma com maiúsculas preserva a designação arquitetônica tradicional e inteligível.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: diante do santuário interior
  rationale: עַל־פְּנֵי significa idiomaticamente “diante de”, e דְּבִיר designa o recinto interno onde ficava a arca, sem impor no texto principal uma equivalência interpretativa única.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: mas não podiam ser vistas de fora
  rationale: Preserva o contraste entre a visibilidade a partir do Lugar Santo e a impossibilidade de vê-las desde o exterior.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: e elas permanecem ali até o dia de hoje
  rationale: Reproduz o estado continuado visto da perspectiva do narrador em português natural e digno.
