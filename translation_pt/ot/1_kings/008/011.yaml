  text: וְ/לֹֽא יָכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמֹ֥ד לְ/שָׁרֵ֖ת מִ/פְּנֵ֥י הֶֽ/עָנָ֑ן כִּי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: pt
  text: e os sacerdotes não puderam ficar de pé para ministrar[a] por causa da nuvem, pois a glória de Yahweh encheu a casa de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permanecer de pé para servir”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: puderam
  rationale: 'Com a negação לֹא, expressa incapacidade: “não puderam”. É direto e natural em português.'
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente habitual e preciso no contexto do culto de Israel.
- source_word: לַעֲמֹד
  choice: ficar de pé
  rationale: Preserva o sentido concreto de “estar de pé”, podendo também sugerir a incapacidade de permanecer em posição para o serviço.
- source_word: לְשָׁרֵת
  choice: ministrar
  rationale: No contexto sacerdotal, designa o serviço oficial no santuário; “servir” permanece uma alternativa legítima.
- source_word: מִפְּנֵי הֶעָנָן
  choice: por causa da nuvem
  rationale: Traduz idiomaticamente a relação causal expressa pela locução hebraica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da incapacidade dos sacerdotes, mantendo a ligação lógica do hebraico.
- source_word: מָלֵא
  choice: encheu
  rationale: Reproduz naturalmente a ação completa do verbo hebraico na narrativa.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Mantém a imagem teologicamente significativa da glória divina manifesta, sem substituí-la por uma interpretação como “presença”.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Conserva a formulação concreta do hebraico; no contexto, a expressão designa o templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de כְבוֹד יְהוָה
  choice: a glória de Yahweh
  alternative: a presença de Yahweh
  rationale: “Glória” preserva a linguagem e a tensão teológica do texto, sem explicar a manifestação divina por meio de uma paráfrase.
- issue: Identificação de בֵּית יְהוָה
  choice: a casa de Yahweh
  alternative: o templo de Yahweh
  rationale: A tradução principal mantém a metáfora hebraica da “casa”, enquanto a nota esclarece seu referente contextual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Ministrar” conserva o registro sacerdotal sem se tornar excessivamente técnico; “ficar de pé” mantém a imagem concreta do hebraico.
