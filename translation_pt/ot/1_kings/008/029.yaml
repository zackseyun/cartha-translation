base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: pt
  text: 'para que os teus olhos estejam abertos para esta casa, noite e dia, para o lugar do qual disseste: “O meu nome estará ali”[a], a fim de ouvires a oração que o teu servo fizer voltado para este lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O meu nome estará ali” é linguagem ligada ao templo e indica que Deus escolheu associar-se a esse lugar, sugerindo a sua presença de aliança sem reduzir a expressão somente a esse sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: para que ... estejam
  rationale: O infinitivo com לְ tem aqui valor de propósito ou resultado em continuidade com a súplica anterior; uma oração finita soa natural em português.
- source_word: עֵינֶךָ פְתֻחוֹת
  choice: os teus olhos estejam abertos
  rationale: Mantém a imagem antropomórfica hebraica da atenção divina sem a reduzir a uma explicação abstrata.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: para este templo
  rationale: אֶל indica direção. Embora בַּיִת seja literalmente “casa”, neste contexto refere-se inequivocamente ao templo; “templo” torna a referência clara e natural em português.
- source_word: לַיְלָה וָיוֹם
  choice: noite e dia
  rationale: Preserva a expressão hebraica de duração contínua em forma idiomática portuguesa.
- source_word: אֶל הַמָּקוֹם
  choice: para o lugar
  rationale: Conserva o motivo repetido do lugar escolhido, com a preposição indicando orientação.
- source_word: אֲשֶׁר אָמַרְתָּ יִהְיֶה שְׁמִי שָׁם
  choice: 'do qual disseste: “O meu nome estará ali”'
  rationale: Preserva a formulação explícita e teologicamente significativa do hebraico, sem substituí-la por uma paráfrase sobre presença ou habitação.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: Traduz diretamente o hebraico e mantém aberta a amplitude da linguagem pactual e cultual.
- source_word: לִשְׁמֹעַ
  choice: a fim de ouvires
  rationale: Expressa claramente o valor de propósito do infinitivo e explicita o sujeito de segunda pessoa já presente no contexto.
- source_word: אֶל הַתְּפִלָּה
  choice: a oração
  rationale: “Oração” é o equivalente amplo e habitual de תְּפִלָּה neste contexto.
- source_word: יִתְפַּלֵּל
  choice: fizer
  rationale: Na locução portuguesa “fizer oração”, o futuro do subjuntivo comunica adequadamente uma oração futura ou repetida, sem impor uma única ocorrência.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: É a forma convencional e digna de autodesignação humilde diante de Deus neste contexto régio.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: voltado para este lugar
  rationale: Torna natural em português a orientação implícita em אֶל aplicada ao ato de orar, sem alterar a referência ao templo.
theological_decisions:
- issue: Linguagem antropomórfica sobre os olhos de Deus
  choice: Manter “os teus olhos estejam abertos”
  alternative: “a tua atenção esteja sobre este templo” ou “vela por este templo”
  rationale: A imagem corporal comunica a atenção divina e deve ser preservada, em vez de ser dissolvida numa abstração.
- issue: Sentido de “O meu nome estará ali”
  choice: Preservar a expressão no texto principal
  alternative: “a minha presença estará ali” ou “habitarei ali”
  rationale: A linguagem do nome é central à teologia do templo e sugere associação escolhida, autoridade e presença pactual sem se deixar reduzir com segurança a uma única paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “teu” em coerência com a oração dirigida diretamente a Deus. “Templo” esclarece a referência contextual de בַּיִת, enquanto “lugar” preserva a repetição temática de מָקוֹם.
