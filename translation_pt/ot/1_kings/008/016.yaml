source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: pt
  text: Desde o dia em que tirei do Egito o meu povo Israel, não escolhi cidade alguma dentre todas as tribos de Israel para construir uma casa, para que o meu nome estivesse ali[b]; mas escolhi Davi[a] para estar à frente do meu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e escolhi Davi”. A conjunção hebraica pode ser entendida como coordenativa, mas o contexto favorece o contraste: nenhuma cidade havia sido escolhida, ao passo que Davi havia sido escolhido.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “uma casa, para que o meu nome estivesse ali” refere-se a um santuário associado ao nome e à presença do SENHOR, isto é, ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: tirei ... do Egito
  rationale: O hifil de יצא tem sentido causativo e, na fórmula do êxodo, é expresso de modo direto e natural em português por “tirar do Egito”.
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: o meu povo Israel
  rationale: A construção apositiva identifica Israel como o povo de Deus; a formulação preserva essa designação de modo claro e natural.
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: cidade alguma dentre todas as tribos de Israel
  rationale: “Cidade alguma” traduz naturalmente a negação hebraica, enquanto “dentre todas as tribos” conserva a associação comprimida entre uma cidade e as tribos de Israel.
- source_word: לִבְנוֹת בַּיִת
  choice: para construir uma casa
  rationale: Mantém o sentido literal de בַּיִת e preserva a expressão teológica hebraica, sem substituí-la antecipadamente por “templo”.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: onde estivesse o meu nome
  rationale: Expressa em português natural a ideia literal de o nome estar ali, sem introduzir o verbo interpretativo “habitar”.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: mas escolhi Davi
  rationale: O waw admite valor coordenativo, mas o contraste contextual entre não escolher uma cidade e escolher Davi favorece “mas”; a alternativa é registrada em nota.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: para estar à frente do meu povo Israel
  rationale: “Estar à frente” comunica a posição de autoridade expressa por עַל sem explicitar além do texto a atividade de governar.
theological_decisions:
- issue: Teologia do templo na expressão “casa onde estivesse o meu nome”
  choice: Preservar “casa” e a referência ao nome de Deus.
  alternative: Traduzir diretamente como “templo” ou “casa onde meu nome habitasse”.
  rationale: A formulação mantém a linguagem característica da teologia deuteronomista e evita tanto substituir o idiomatismo por sua referência quanto acrescentar a noção interpretativa de habitação.
- issue: Relação entre a não escolha de uma cidade e a escolha de Davi
  choice: Usar a conjunção adversativa “mas”.
  alternative: Usar a coordenativa “e”.
  rationale: O contexto apresenta um contraste entre a ausência de escolha de uma cidade e a escolha positiva de Davi, embora a coordenação permaneça linguisticamente possível e seja indicada em nota.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução busca equivalência ótima: preserva os principais idiomatismos teológicos hebraicos, mas ajusta a sintaxe para soar natural em português.'
