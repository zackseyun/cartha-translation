  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: pt
  text: Levaram para cima[a] a arca de Yahweh, a tenda do encontro e todos os utensílios sagrados que estavam na tenda; os sacerdotes e os levitas[b] os levaram para cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido como “carregaram para cima”; neste contexto, pode indicar o transporte ascendente em procissão.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os sacerdotes e os levitas”. Alguns entendem a expressão mais especificamente como referência ao sacerdócio levítico, mas o texto hebraico nomeia os dois grupos.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / וַיַּעֲלוּ אֹתָם
  choice: Levaram para o alto / os levaram para o alto
  rationale: O hifil de עלה expressa fazer subir ou levar para cima. A formulação preserva a direção ascendente da procissão rumo ao templo sem afirmar além do texto o modo exato de transporte; a repetição do verbo hebraico também é mantida.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: אֲרוֹן designa aqui a arca sagrada, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome pessoal presente no texto hebraico.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução transparente da designação hebraica do santuário móvel; é clara em português atual e evita substituir a expressão por um termo tradicional menos diretamente ligado aos componentes hebraicos.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: todos os utensílios sagrados
  rationale: כְּלִים é um termo amplo para objetos, instrumentos ou utensílios. “Utensílios sagrados” comunica que se trata de objetos consagrados ao serviço do santuário sem restringi-los a peças de mobiliário.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: que estavam na tenda
  rationale: A oração relativa modifica naturalmente os utensílios sagrados. “Na tenda” retoma de modo claro e sem repetição desnecessária a tenda do encontro.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os sacerdotes e os levitas
  rationale: O hebraico nomeia explicitamente os dois grupos. A tradução conserva essa coordenação sem reduzi-la interpretativamente a “sacerdotes levíticos”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama como nome próprio. A transliteração “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Relação entre os sacerdotes e os levitas na ação de transportar
  choice: Manter explicitamente “os sacerdotes e os levitas”
  alternative: os sacerdotes levíticos
  rationale: A construção hebraica apresenta os dois grupos coordenados. Mantê-los assim preserva a formulação e a possível tensão com outros textos sobre suas atribuições, sem impor uma harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Para o alto” conserva a orientação espacial do verbo sem recorrer à formulação menos natural “fizeram subir”. A ordem e a repetição da ação refletem a estrutura enfática do hebraico.
