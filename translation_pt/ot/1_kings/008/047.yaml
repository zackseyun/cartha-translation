base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: pt
  text: 'e, se caírem em si na terra para onde foram levados cativos, voltarem e suplicarem a ti na terra dos que os levaram cativos, dizendo: “Pecamos, agimos perversamente e procedemos com maldade”,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: caírem em si
  rationale: A expressão hebraica significa literalmente fazer algo voltar ao coração, idiomaticamente refletir, tomar consciência ou cair em si. A formulação escolhida é natural em português e preserva a ideia de recuperação da consciência moral.
- source_word: וְשָׁבוּ
  choice: voltarem
  rationale: Mantém o sentido básico e deliberadamente amplo de שׁוב, sem restringi-lo ao termo teológico “arrepender-se”; no contexto, pode envolver tanto retorno interior quanto mudança de rumo.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: suplicarem a ti
  rationale: O verbo hitpael expressa pedido insistente de favor ou misericórdia; “suplicar” comunica essa força com clareza e dignidade.
- source_word: חָטָאנוּ
  choice: Pecamos
  rationale: Equivalente direto do verbo hebraico comum para pecar.
- source_word: וְהֶעֱוִינוּ
  choice: agimos perversamente
  rationale: Distingue a noção de perversão ou desvio moral do verbo seguinte, ligado à maldade culpável.
- source_word: רָשָׁעְנוּ
  choice: procedemos com maldade
  rationale: Expressa conduta culpável e ímpia, preservando a progressão tripla da confissão sem repetir simplesmente “pecamos”.
theological_decisions:
- issue: Sentido de וְשָׁבוּ
  choice: voltarem
  alternative: se arrependerem
  rationale: O hebraico mantém uma amplitude semântica que pode incluir arrependimento, conversão e retorno. “Voltarem” preserva essa ambiguidade e evita impor uma formulação teológica mais específica do que o texto exige.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sequência verbal foi mantida no modo condicional iniciado pelo contexto (“se”), e a confissão tripla conserva as distinções retóricas do hebraico.
