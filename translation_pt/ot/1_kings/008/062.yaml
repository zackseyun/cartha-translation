base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: pt
  text: E o rei e todo o Israel com ele ofereciam sacrifícios diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: E o rei
  rationale: O waw dá continuidade à narrativa; o artigo definido identifica o rei já em vista, Salomão.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Preserva a designação coletiva nacional do hebraico, em vez de explicitá-la como «todos os israelitas».
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz de modo conciso a relação entre todo o Israel e o rei.
- source_word: זֹבְחִים זֶבַח
  choice: ofereciam sacrifícios
  rationale: A construção cognata hebraica, literalmente «sacrificavam um sacrifício», é idiomática e enfatiza o ato sacrificial. Em português, «ofereciam sacrifícios» comunica naturalmente o sentido e conserva o aspecto contínuo do particípio.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Equivalente português natural para a expressão espacial e cultual «perante/na presença de».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e distingue-o do título אֲדֹנָי.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação idiomática «ofereciam sacrifícios» evita o pouco natural «sacrificavam um sacrifício» sem perder o valor contínuo do particípio hebraico.
