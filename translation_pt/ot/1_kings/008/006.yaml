id: 1KI.8.6
reference: 1 Kings 8:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: pt
  text: Então os sacerdotes levaram a arca da aliança de Yahweh ao seu lugar, ao santuário interior da casa[a], ao Santo dos Santos[b], debaixo das asas dos querubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “Lugar Santíssimo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Então ... levaram
  rationale: O wayyiqtol dá continuidade à sequência narrativa. “Então” expressa esse avanço de modo natural; “levaram” traduz בוא no uso causativo exigido pelo contexto.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do substantivo definido no plural.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Preserva com clareza a relação da cadeia construta hebraica e mantém o nome divino como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
- source_word: מְקוֹמוֹ
  choice: seu lugar
  rationale: O sufixo se refere à arca. A tradução evita acrescentar “devido” ou “próprio”, ideias apenas implícitas.
- source_word: דְּבִיר
  choice: santuário interior
  rationale: No contexto do templo, designa o recinto mais interno; esta expressão é clara e atual.
- source_word: הַבַּיִת
  choice: a casa
  rationale: Mantém a imagem literal hebraica, enquanto uma nota esclarece que a referência contextual é ao templo.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Santo dos Santos
  rationale: Reproduz naturalmente em português a construção superlativa hebraica e é uma designação reconhecível do recinto mais sagrado.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Equivalente espacial natural e direto.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: as asas dos querubins
  rationale: “Asas” preserva o sentido literal, e “querubins” é o plural consagrado e inteligível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido de קֹדֶשׁ הַקֳּדָשִׁים
  choice: Santo dos Santos
  alternative: Lugar Santíssimo
  rationale: A escolha conserva a forma intensiva do hebraico sem alterar sua referência ao recinto mais sagrado do templo; a alternativa explicita o mesmo sentido em linguagem descritiva.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A repetição de “ao” preserva a estrutura explicativa e progressiva do hebraico. Os marcadores foram posicionados junto aos termos efetivamente esclarecidos pelas notas.
