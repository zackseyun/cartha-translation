source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: pt
  text: 'E ele disse: “Ó Yahweh, Deus de Israel, não há Deus semelhante a ti nos céus, lá em cima, nem sobre a terra, aqui embaixo; tu guardas a aliança e o amor leal[a] para com os teus servos que andam diante de ti de todo o coração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico hésed pode indicar amor fiel, lealdade à aliança, bondade constante ou misericórdia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: E ele disse
  rationale: Preserva a sequência narrativa do wayyiqtol hebraico com uma formulação natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Reproduz naturalmente a construção hebraica usada como forma de tratamento.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: não há Deus semelhante a ti
  rationale: Expressa a incomparabilidade de Yahweh sem transformar a frase numa declaração mais ampla do que o texto exige.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: nos céus, lá em cima, nem sobre a terra, aqui embaixo
  rationale: Mantém o plural formal de שָׁמַיִם e a extensão cósmica do merismo; 'nem' é idiomático em português depois de uma oração negativa.
- source_word: שֹׁמֵר
  choice: tu guardas
  rationale: Explicita em português o valor predicativo do particípio que descreve a ação característica de Yahweh.
- source_word: הַבְּרִית
  choice: a aliança
  rationale: Conserva o artigo definido e o termo bíblico corrente para o compromisso pactual.
- source_word: וְהַחֶסֶד
  choice: e o amor leal
  rationale: Comunica tanto o amor quanto a fidelidade duradoura implicados por חֶסֶד no contexto da aliança.
- source_word: לַעֲבָדֶיךָ
  choice: para com os teus servos
  rationale: Expressa com naturalidade a relação para com os beneficiários da fidelidade divina.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: que andam diante de ti
  rationale: Preserva a metáfora hebraica da conduta vivida na presença de Deus.
- source_word: בְּכָל לִבָּם
  choice: de todo o coração
  rationale: Expressão portuguesa natural para devoção interior inteira e indivisa.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal do Deus de Israel em transliteração, sem o substituir por um título.
- issue: Incomparabilidade em אֵין כָּמוֹךָ אֱלֹהִים
  choice: não há Deus semelhante a ti
  alternative: não há ninguém como tu entre os deuses
  rationale: Mantém a formulação de incomparabilidade e a leitura singular contextual de אֱלֹהִים, sem acrescentar uma interpretação denominacional.
- issue: Nuance de חֶסֶד junto de בְּרִית
  choice: amor leal
  alternative: amor fiel; misericórdia; bondade
  rationale: A associação com 'aliança' salienta amor comprometido e fidelidade; a nota preserva a amplitude lexical do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o nome Yahweh, a metáfora 'andar diante de ti' e o plural 'céus'. A segunda pessoa singular usa 'tu' com concordância padrão.
