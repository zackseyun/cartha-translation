base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: pt
  text: e eles voltarem para ti[a] de todo o coração e de toda a alma, na terra dos inimigos que os levaram cativos, e orarem a ti voltados para a sua terra[b], que deste aos seus pais, para a cidade que escolheste e para a casa que construí para o teu nome[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retornarem para ti”. Neste contexto, a expressão também pode incluir a ideia de arrependimento.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na direção da terra deles”; isto é, orando voltados para ela.
    reason: lexical_alternative
  - marker: c
    text: Isto é, a casa — o templo — dedicada ao teu nome.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: e eles voltarem para ti
  rationale: Preserva o sentido básico de שׁוּב, “voltar/retornar”, e sua orientação relacional para Deus, sem explicitar indevidamente “arrepender-se”.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: de todo o coração e de toda a alma
  rationale: Expressão portuguesa natural que mantém as imagens hebraicas de coração e alma e comunica devoção integral.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  choice: na terra dos inimigos que os levaram cativos
  rationale: Mantém o contraste entre a terra do exílio e a terra de Israel; “levaram cativos” expressa com clareza o sentido coercivo de שׁבה.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: e orarem a ti
  rationale: A forma no infinitivo flexionado acompanha naturalmente em português a condição iniciada no contexto do período mais amplo.
- source_word: דֶּרֶךְ אַרְצָם
  choice: voltados para a terra
  rationale: Expressa a orientação física da oração indicada por דֶּרֶךְ sem sugerir deslocamento até a terra.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: que deste aos seus pais
  rationale: Conserva a formulação pactual e a referência textual específica aos pais, em registro digno e compreensível.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: para a cidade que escolheste
  rationale: A repetição de “para” torna clara a orientação sucessiva para a terra, a cidade e a casa, enquanto preserva a linguagem de escolha divina.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: e para a casa que construí para o teu nome
  rationale: “Casa” preserva בַּיִת e sua ressonância, enquanto “construí” retém a primeira pessoa singular adequada à fala de Salomão; “para o teu nome” conserva o idioma teológico hebraico.
theological_decisions:
- issue: Sentido pactual de שׁוּב
  choice: voltarem para ti
  alternative: arrependerem-se diante de ti
  rationale: O contexto inclui arrependimento, mas o hebraico mantém uma imagem relacional e direcional. A tradução conserva essa amplitude sem resolver a tensão interpretativa.
- issue: Pessoa verbal em בנית
  choice: que construí
  alternative: que foi construída / que construíram
  rationale: No contexto da oração de Salomão, a forma consonantal do Texto Massorético é naturalmente entendida como primeira pessoa singular. Essa leitura preserva a situação discursiva.
- issue: Casa construída para o nome divino
  choice: casa que construí para o teu nome
  alternative: templo que construí e dediquei ao teu nome
  rationale: A tradução mantém a expressão hebraica sem substituir “casa” por “templo” nem incorporar “dediquei” ao texto principal.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e as formas “ti”, “deste” e “escolheste” preservam o tratamento singular dirigido a Deus sem recorrer a linguagem excessivamente arcaica. Os marcadores foram posicionados junto às expressões que explicam.
