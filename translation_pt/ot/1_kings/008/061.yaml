base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: pt
  text: Portanto, que o coração de vocês seja inteiramente dedicado a Yahweh, nosso Deus,[a] para andar nos seus estatutos e guardar os seus mandamentos, como neste dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja indiviso para com Yahweh, nosso Deus”. Literalmente, “seja inteiro com Yahweh, nosso Deus”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “como neste dia”; o dia presente é apresentado como exemplo ou testemunho dessa devoção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Portanto, que ... seja
  rationale: No contexto, a forma funciona como exortação. A construção portuguesa com subjuntivo comunica esse valor, enquanto “portanto” explicita a ligação inferencial natural com a exortação conclusiva.
- source_word: לְבַבְכֶם
  choice: o coração de vocês
  rationale: Preserva a imagem hebraica do coração como centro da vontade e da devoção, mantendo o singular coletivo com referente plural.
- source_word: שָׁלֵם עִם
  choice: inteiramente dedicado a
  rationale: Expressa a ideia de lealdade completa ou não dividida em português natural. Evita sugerir perfeição moral absoluta, embora torne explícita a força relacional da expressão hebraica literalmente “inteiro com”.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, nosso Deus
  rationale: Mantém o nome divino pessoal presente no texto hebraico e traduz אֱלֹהֵינוּ de modo direto.
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: para andar nos seus estatutos
  rationale: Conserva a metáfora bíblica de andar como modo de viver e a formulação pactual dos estatutos.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: e guardar os seus mandamentos
  rationale: “Guardar” comunica a observância cuidadosa exigida por שׁמר e mantém o registro bíblico corrente.
- source_word: כַּיּוֹם הַזֶּה
  choice: como hoje
  rationale: Reproduz de maneira concisa e atual o idioma hebraico, que apresenta o dia presente como exemplo ou testemunho da devoção mencionada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Alcance de שָׁלֵם na lealdade pactual
  choice: inteiramente dedicado
  alternative: de coração não dividido
  rationale: A opção comunica devoção completa sem importar a ideia de impecabilidade. A alternativa legítima, que salienta a ausência de lealdades rivais, é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícito o plural hebraico; “andar”, “estatutos” e “mandamentos” preservam o registro e as imagens pactuais do original.
