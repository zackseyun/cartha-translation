source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶת הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: pt
  text: Então, ouve nos céus[a] e perdoa o pecado dos teus servos e do teu povo Israel, quando lhes ensinares[b] o bom caminho em que devem andar. Dá chuva sobre a tua terra, que deste ao teu povo como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouve desde os céus”. O hebraico diz literalmente “ouve os céus”, sem preposição expressa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois lhes ensinas”. A conjunção hebraica pode ser entendida em sentido temporal ou causal.'
    reason: ambiguity
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: ouve nos céus
  rationale: A construção hebraica não traz preposição expressa. “Ouve nos céus” completa a expressão de modo natural em português, preservando “céus” no plural e o cenário da oração.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: e perdoa o pecado
  rationale: Neste contexto, חַטָּאת designa a transgressão que requer perdão, não uma oferta pelo pecado. O imperativo português comunica a força de petição da oração.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: dos teus servos e do teu povo Israel
  rationale: Mantém a conjunção hebraica entre “servos” e “povo” e apresenta Israel como identificação de “teu povo”, sem transformar silenciosamente toda a expressão em simples aposição.
- source_word: כִּי תוֹרֵם
  choice: quando lhes ensinares
  rationale: כִּי pode indicar causa ou circunstância, e o hifil de ירה significa ensinar ou instruir. “Quando lhes ensinares” se integra naturalmente à petição, enquanto a alternativa causal é registrada em nota.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: o bom caminho em que devem andar
  rationale: Preserva tanto a imagem do caminho quanto o uso metafórico de “andar” para a conduta, em linguagem clara e corrente.
- source_word: וְנָתַתָּה מָטָר עַל אַרְצְךָ
  choice: Dá chuva sobre a tua terra
  rationale: Traduz diretamente נתן por “dar” e conserva o sufixo de segunda pessoa em “tua terra”, mantendo a afirmação da propriedade divina.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: que deste ao teu povo como herança
  rationale: “Herança” expressa o sentido pactual e territorial de נַחֲלָה, enquanto o pretérito simples é natural em português para a dádiva já realizada.
theological_decisions:
- issue: Propriedade divina e dádiva da terra
  choice: a tua terra, que deste ao teu povo como herança
  alternative: a terra que deste ao teu povo como herança
  rationale: O hebraico chama a terra explicitamente de propriedade de Deus e, ao mesmo tempo, declara que ele a deu a Israel por herança. A tradução conserva essa tensão.
- issue: Relação entre o ensino divino, o perdão e a restauração
  choice: quando lhes ensinares
  alternative: pois lhes ensinas
  rationale: כִּי admite leitura temporal ou causal. A leitura temporal funciona bem no fluxo da súplica, mas a alternativa causal não é excluída e aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. Mantêm-se as imagens bíblicas de “caminho” e “andar”, sem arcaísmos desnecessários.
