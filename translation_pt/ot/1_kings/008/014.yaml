  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: pt
  text: Então o rei se virou[a] e abençoou toda a assembleia de Israel[b], enquanto toda a assembleia de Israel permanecia em pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “virou o rosto”. Também pode ser traduzido por “voltou-se”.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a congregação de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: se virou
  rationale: A expressão hebraica diz literalmente que o rei fez seu rosto voltar-se. Em português, “se virou” comunica de modo natural o movimento físico sem introduzir uma direção ausente do texto.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: É o equivalente direto e corrente de ברך neste contexto público, podendo designar a bênção pronunciada pelo rei sem explicitação adicional.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: toda a assembleia de Israel
  rationale: קהל designa o povo reunido. “Assembleia” preserva esse sentido coletivo e é claro no português contemporâneo.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: enquanto toda a assembleia de Israel permanecia em pé
  rationale: O particípio descreve a postura contínua da assembleia durante a bênção. “Enquanto” expressa a função circunstancial, e “permanecia em pé” conserva o valor durativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “toda a assembleia de Israel” foi preservada por corresponder à repetição enfática do hebraico. Os marcadores seguem a ordem normal de ocorrência no texto português.
