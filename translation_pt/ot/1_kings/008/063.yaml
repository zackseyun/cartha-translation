  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: pt
  text: 'Salomão sacrificou a Yahweh ofertas de comunhão[a]: vinte e duas mil cabeças de gado e cento e vinte mil animais de rebanho[b]. Assim, o rei e todos os filhos de Israel[c] dedicaram a casa de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por «ofertas pacíficas» ou «ofertas de bem-estar».
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa coletivamente animais de pequeno rebanho, sobretudo ovelhas e cabras.
    reason: lexical_clarification
  - marker: c
    text: Isto é, todos os israelitas, o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrificou
  rationale: Expressa diretamente o ato sacrificial indicado por זבח, sem o tornar no mais genérico «ofereceu».
- source_word: זֶבַח הַשְּׁלָמִים
  choice: ofertas de comunhão
  rationale: Comunica a dimensão relacional de שְׁלָמִים em português corrente. A nota conserva as alternativas tradicionais e semânticas, pois o termo cultual não tem equivalente português exato.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama e mantém a direção do sacrifício marcada pela preposição ל.
- source_word: בָּקָר
  choice: cabeças de gado
  rationale: Representa naturalmente o substantivo coletivo hebraico para bovinos e combina bem com o grande total numérico.
- source_word: צֹאן
  choice: ovelhas e cabras
  rationale: Torna explícita a extensão normal do coletivo hebraico, que pode abranger ambos os tipos de animais de pequeno porte criados em rebanhos.
- source_word: וַיַּחְנְכוּ
  choice: dedicaram
  rationale: No contexto da conclusão da construção, חנך designa a dedicação solene do edifício ao uso sagrado.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão concreta do hebraico em vez de substituí-la interpretativamente por «templo».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Mantém a forma tradicional e formal da designação coletiva hebraica; a nota esclarece seu referente nacional inclusivo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; «Yahweh» preserva-o como nome próprio da aliança, sem o substituir por um título.
- issue: Sentido cultual de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo admite nuances de paz, integridade, bem-estar e participação em comunhão. A tradução principal é inteligível, enquanto a nota evita reduzir a amplitude do hebraico a uma única interpretação.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A forma masculina tradicional foi conservada no texto, mas funciona aqui como designação coletiva do povo, o que é explicitado em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição cognata da construção hebraica («sacrificou o sacrifício... que sacrificou») foi suavizada para evitar artificialidade, sem omitir o caráter sacrificial. Os números e a sequência narrativa foram preservados.
