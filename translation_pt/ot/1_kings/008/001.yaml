revisions:
- from: Então Salomão reuniu em Jerusalém, diante de si, todos os anciãos de Israel, todos os chefes das tribos e os líderes das famílias patriarcais dos filhos de Israel[a], para fazer subir da Cidade de Davi, isto é, Sião, a arca da aliança de Yahweh.
  to: Então o rei Salomão reuniu em Jerusalém, diante de si, todos os anciãos de Israel, todos os chefes das tribos e os líderes das casas paternas dos filhos de Israel[a], para fazer subir da Cidade de Davi, isto é, Sião, a arca da aliança de Yahweh.
  rationale: A revisão conserva a ordem portuguesa fluente e a finalidade de transportar a arca para cima, mas representa com maior precisão a menção hebraica ao rei Salomão e a estrutura das casas ancestrais. A nota permanece corretamente ancorada e necessária para «filhos de Israel».
