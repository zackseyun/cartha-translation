reference: 1 Kings 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: pt
  text: Então o rei Salomão reuniu em Jerusalém, diante de si, todos os anciãos de Israel, todos os chefes das tribos e os líderes das casas paternas dos filhos de Israel[a], para fazer subir da Cidade de Davi, isto é, Sião, a arca da aliança de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de Israel”, expressão familiar e nacional que, neste contexto, se refere coletivamente ao povo de Israel.
    reason: Esclarece o alcance coletivo da expressão hebraica sem apagá-la no texto principal.
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: יַקְהֵל
  choice: reuniu
  rationale: O hifil de קהל indica fazer reunir ou convocar uma assembleia; “reuniu” é claro e adequado ao contexto régio.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Designa os líderes seniores reconhecidos de Israel e preserva a terminologia sociopolítica tradicional.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: todos os chefes das tribos
  rationale: Neste contexto, מַטּוֹת se refere às tribos, não a bastões literais.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: os líderes das famílias patriarcais
  rationale: A expressão indica responsáveis por unidades ancestrais ou casas paternas; a formulação evita o pouco natural “casas dos pais” sem apagar a organização patriarcal.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Preserva a expressão familiar-nacional hebraica e sua forma masculina, esclarecida em nota quanto ao sentido coletivo.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה יְרוּשָׁלִָם
  choice: em Jerusalém, diante de si
  rationale: O hebraico diz literalmente que foram reunidos “ao rei Salomão, a Jerusalém”. Como Salomão é o sujeito que reúne, “diante de si” expressa naturalmente a chegada à presença do rei sem repetir seu nome de forma rígida.
- source_word: לְהַעֲלוֹת
  choice: para fazer subir
  rationale: Preserva o sentido causativo e a subida geográfica e cultual da arca até seu novo local em Jerusalém.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Reproduz com clareza a cadeia construta hebraica e mantém o nome divino.
- source_word: מֵעִיר דָּוִד הִיא צִיּוֹן
  choice: da Cidade de Davi, isto é, Sião
  rationale: Mantém a designação geográfica e torna explícita, sem ampliar, a identificação feita pelo texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Expressão nacional לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel; filhos e filhas de Israel
  rationale: A tradução conserva a metáfora genealógica e a forma do hebraico, enquanto a nota informa que a expressão funciona coletivamente.
- issue: Relação sintática de אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: diante de si
  alternative: ao rei Salomão
  rationale: A preposição indica que os convocados se dirigiram à presença de Salomão. A opção escolhida preserva esse sentido e evita a impressão, em português, de que Salomão reuniu pessoas para outro indivíduo chamado Salomão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem dos constituintes foi ajustada para evitar a repetição rígida de “Salomão” e deixar clara a cena, preservando todos os elementos do hebraico.
