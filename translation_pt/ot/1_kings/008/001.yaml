review_pass:
  verdict: revise
  source_fidelity: A tradução preserva os participantes, o lugar, a finalidade e a identificação de Sião. No entanto, «diante de si» substitui a referência explícita «ao rei Salomão» por uma formulação reflexiva interpretativa e omite o título régio que o hebraico emprega nesse ponto. «Famílias patriarcais» também é mais geral do que «casas paternas/ancestrais», as unidades de descendência e liderança indicadas por נְשִׂיאֵי הָאָבוֹת.
  naturalness: O texto é globalmente claro e de registro adequado. «Então o rei Salomão reuniu ... diante de si» é natural em português e, ao mesmo tempo, permite conservar de modo claro o destino da convocação sem a repetição pouco elegante de «Salomão».
  terminology: «Anciãos», «chefes das tribos», «filhos de Israel», «arca da aliança» e «Yahweh» são adequados. «Líderes das casas paternas» corresponde mais diretamente à terminologia social do hebraico do que «líderes das famílias patriarcais».
  issues:
  - severity: medium
    issue: A expressão «diante de si» não representa explicitamente «ao rei Salomão».
    rationale: O hebraico nomeia Salomão como rei no complemento da convocação. A forma reflexiva é uma inferência legítima do contexto, mas perde o título e a referência expressa; introduzir «o rei Salomão» como sujeito preserva ambos naturalmente.
  - severity: low
    issue: «Famílias patriarcais» é menos preciso do que «casas paternas».
    rationale: אָבוֹת neste contexto se refere às casas ou grupos ancestrais de descendência, não meramente a famílias caracterizadas como patriarcais.
  revised_text: Então o rei Salomão reuniu em Jerusalém, diante de si, todos os anciãos de Israel, todos os chefes das tribos e os líderes das casas paternas dos filhos de Israel[a], para fazer subir da Cidade de Davi, isto é, Sião, a arca da aliança de Yahweh.
  revised_footnotes:
  - marker: a
    text: Literalmente, “filhos de Israel”, expressão familiar e nacional que, neste contexto, se refere coletivamente ao povo de Israel.
    reason: Esclarece o alcance coletivo da expressão hebraica sem apagá-la no texto principal.
  revision_rationale: A revisão conserva a ordem portuguesa fluente e a finalidade de transportar a arca para cima, mas representa com maior precisão a menção hebraica ao rei Salomão e a estrutura das casas ancestrais. A nota permanece corretamente ancorada e necessária para «filhos de Israel».
