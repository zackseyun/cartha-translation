base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: pt
  text: pois eles ouvirão falar do teu grande nome[a], da tua mão forte e do teu braço estendido; e ele virá e orará em direção a esta casa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do plural (“eles ouvirão”) para o singular (“ele virá e orará”), provavelmente indo dos estrangeiros em geral ao estrangeiro individual representativo.
    reason: Preserva e explica a mudança de número gramatical no texto-fonte.
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ligada ao estrangeiro mencionado no versículo anterior, preservando o valor causal-explicativo.
- source_word: יִשְׁמְעוּן
  choice: eles ouvirão falar
  rationale: O imperfeito plural admite sentido futuro ou geral; a formulação natural em português mantém os estrangeiros como classe.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: do teu grande nome
  rationale: Com o verbo 'ouvir', 'ouvir falar de' expressa naturalmente conhecimento da fama; 'nome' é mantido para preservar sua força literária e teológica.
- source_word: יָדְךָ הַחֲזָקָה
  choice: tua mão forte
  rationale: Preserva a imagem antropomórfica concreta e traduz חֲזָקָה de modo claro e digno.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: teu braço estendido
  rationale: Mantém a imagem bíblica da atuação poderosa de Deus sem convertê-la em abstração.
- source_word: וּבָא
  choice: então ele virá
  rationale: Preserva a mudança do plural para o singular no hebraico e torna explícita a progressão da frase.
- source_word: וְהִתְפַּלֵּל
  choice: e orará
  rationale: Continua a construção coordenada com o verbo singular anterior, em português natural.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: voltado para este templo
  rationale: Expressa a orientação da oração para o santuário; 'templo' comunica aqui o referente de הַבַּיִת com clareza contextual, sem sugerir necessariamente entrada física.
theological_decisions:
- issue: Linguagem antropomórfica sobre o poder de Deus
  choice: Manter literalmente 'mão' e 'braço'
  alternative: Traduzir por 'poder' e 'força'
  rationale: As imagens concretas são literária e teologicamente significativas; substituí-las por abstrações reduziria a riqueza do original.
- issue: Mudança do sujeito plural para o singular
  choice: Preservar 'eles ouvirão ... ele virá'
  alternative: Uniformizar tudo no plural
  rationale: O hebraico passa dos estrangeiros em geral ao estrangeiro individual representativo; a tradução conserva essa tensão gramatical em vez de harmonizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por 'tu' acompanha a oração dirigida diretamente a Deus. 'Templo' foi preferido a 'casa' neste contexto cultual para evitar ambiguidade em português corrente; o travessão final preserva a continuidade sintática com o versículo seguinte.
