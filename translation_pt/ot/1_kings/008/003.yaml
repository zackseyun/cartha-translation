translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa natural. “Então” representa a progressão narrativa dos verbos hebraicos sem tornar a coordenação excessivamente repetitiva. A nota reúne a identificação contextual da arca e a alternativa lexical de נשׂא; seu marcador aparece no texto.
