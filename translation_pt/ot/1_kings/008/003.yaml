lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: O wayyiqtol de בוא dá sequência à narrativa; “vieram” é natural e não acrescenta um destino que o hebraico não explicita.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: todos os anciãos de Israel
  rationale: Preserva o quantificador e a expressão tradicional para os líderes reconhecidos de Israel.
- source_word: וַיִּשְׂאוּ
  choice: carregaram
  rationale: נשׂא pode significar levantar ou levar; neste contexto, “carregaram” comunica de modo natural o transporte da arca.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do substantivo definido plural.
- source_word: אֶת הָאָרוֹן
  choice: a arca
  rationale: O verso menciona apenas a arca definida; a identificação como arca da aliança decorre do contexto e não deve ser inserida silenciosamente no texto.
