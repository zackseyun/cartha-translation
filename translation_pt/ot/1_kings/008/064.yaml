source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: pt
  text: Naquele dia, o rei consagrou o centro do pátio[a] que ficava diante da casa de Yahweh[b], pois ali ofereceu o holocausto, a oferta de cereal e as porções de gordura das ofertas de comunhão[c]. Fez isso porque o altar de bronze que estava diante de Yahweh era pequeno demais para comportar o holocausto, a oferta de cereal e as porções de gordura das ofertas de comunhão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a parte interior do pátio”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo de Yahweh.
    reason: clarification
  - marker: c
    text: Ou “as porções de gordura das ofertas de paz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: consagrou
  rationale: O verbo indica separar um espaço para uso sagrado. “Consagrou” é natural em português e conserva o sentido cultual.
- source_word: תּוֹךְ הֶחָצֵר
  choice: o centro do pátio
  rationale: תּוֹךְ designa o meio ou a parte interior de um espaço. “O centro do pátio” preserva aqui o sentido espacial e é claro para leitores modernos.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: diante da casa de Yahweh
  rationale: Mantém tanto o valor espacial de לִפְנֵי quanto a imagem hebraica do templo como a “casa” de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עָשָׂה שָׁם
  choice: ali ofereceu
  rationale: Embora עָשָׂה tenha o sentido geral de “fazer”, neste contexto sacrificial significa realizar ou oferecer os sacrifícios mencionados.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: É o termo tradicional e preciso em português para a oferta inteiramente queimada designada por עֹלָה.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto cultual, מִנְחָה designa a oferta feita de cereal; a tradução evita o sentido excessivamente genérico de “oferta”.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: as porções de gordura das ofertas de comunhão
  rationale: חֶלְבֵי refere-se às porções gordurosas queimadas no altar, e שְׁלָמִים designa sacrifícios associados à paz, ao bem-estar e à comunhão. A nota preserva a alternativa tradicional.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: o altar de bronze
  rationale: נְחֹשֶׁת pode denotar cobre ou bronze; “altar de bronze” é a designação cultual convencional e provável neste contexto.
- source_word: קָטֹן מֵהָכִיל
  choice: era pequeno demais para comportar
  rationale: A construção expressa insuficiência de capacidade. “Pequeno demais para comportar” comunica claramente que o altar não podia receber o volume dos sacrifícios.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e reflete a vocalização acadêmica mais amplamente aceita, sem substituí-lo por “SENHOR”.
- issue: Sentido de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz
  rationale: O termo pode enfatizar paz, bem-estar, integridade e comunhão na refeição sacrificial. “Ofertas de comunhão” é claro no contexto, enquanto a nota mantém a tradução formal tradicional sem eliminar a amplitude do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação conserva a terminologia sacrificial reconhecível, explica apenas por nota a imagem “casa de Yahweh” e divide o longo período hebraico em duas frases para maior clareza sem alterar a relação causal.
