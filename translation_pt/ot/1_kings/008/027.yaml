  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֥ב אֱלֹהִ֖ים עַל הָ/אָ֑רֶץ הִ֠נֵּה הַ/שָּׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: pt
  text: Pois será que Deus de fato habitará na terra? Eis que os céus, até mesmo os céus dos céus[a], não podem conter-te[b]; muito menos esta casa[c] que construí!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os céus e os céus dos céus”, expressão que indica os mais altos céus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “comportar-te”.'
    reason: lexical_alternative
  - marker: c
    text: “Esta casa” se refere ao templo construído por Salomão.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a reflexão explicativa de Salomão em ligação com o contexto anterior, preservando o valor lógico da partícula.
- source_word: הַאֻמְנָם
  choice: de fato
  rationale: Expressa admiração e ênfase na pergunta retórica, com tom solene e natural em português.
- source_word: יֵשֵׁב
  choice: habitará
  rationale: Embora o verbo possa significar sentar-se ou permanecer, aqui se refere à presença divina relacionada ao templo; “habitar” é a expressão contextual mais adequada.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo e o contexto exigem sentido singular, referindo-se ao Deus de Israel a quem Salomão dirige a oração.
- source_word: עַל הָאָרֶץ
  choice: na terra
  rationale: Expressa em português natural o contraste espacial entre a terra e os céus.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Chama enfaticamente a atenção para a declaração seguinte e mantém o registro elevado da oração.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: os céus, até mesmo os céus dos céus
  rationale: Mantém a forma concreta do idioma superlativo hebraico e explicita sua força intensificadora com “até mesmo”.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: não podem conter-te
  rationale: O verbo denota capacidade de conter ou comportar. A escolha preserva a afirmação de que nenhum espaço criado pode circunscrever Deus.
- source_word: אַף כִּי
  choice: muito menos
  rationale: 'Reproduz de modo natural o raciocínio a fortiori: se nem os mais altos céus podem conter Deus, menos ainda o templo.'
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: Preserva o termo hebraico e o motivo do templo como casa, sem substituir a imagem por uma explicação.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: que construí
  rationale: Traduz diretamente a ação concluída de Salomão em português corrente.
theological_decisions:
- issue: Transcendência divina e presença no templo
  choice: Manter a pergunta retórica e a declaração de que nem os céus podem conter Deus, sem negar sua presença pactual no templo.
  alternative: Transformar a pergunta em uma negação absoluta de que Deus habite na terra, ou sugerir que o templo o contenha literalmente.
  rationale: O hebraico preserva a admiração de Salomão diante da presença de Deus na terra e, ao mesmo tempo, afirma que nenhum espaço criado pode contê-lo. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” e “céus dos céus” preservam a solenidade e a imagem hebraica; a sintaxe restante permanece corrente e clara.
