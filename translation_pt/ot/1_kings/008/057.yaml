reference: 1 Kings 8:57
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: pt
  text: Que Yahweh, nosso Deus, esteja conosco, assim como esteve com nossos pais.[a] Que ele não nos deixe nem nos abandone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos antepassados”. O hebraico diz “nossos pais”, referindo-se aos antepassados de Israel.
    reason: alternativa lexical
lexical_decisions:
- source_word: יְהִי
  choice: Que ... esteja
  rationale: O jussivo qal de היה expressa desejo ou oração; em português, “Que ... esteja” comunica naturalmente essa força volitiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: A forma com sufixo de primeira pessoa do plural significa diretamente “nosso Deus”.
- source_word: עִמָּנוּ
  choice: conosco
  rationale: עם com sufixo indica presença ou companhia; “conosco” é a formulação portuguesa mais natural e precisa.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz a comparação com a presença de Deus junto às gerações anteriores e soa natural em português.
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: esteve com nossos pais
  rationale: Mantém o termo masculino אבותינו e a referência aos antepassados de Israel, sem perder a linguagem concreta do hebraico.
- source_word: אַל יַעַזְבֵנוּ
  choice: Que ele não nos deixe
  rationale: O jussivo negativo exprime uma súplica para que Deus não deixe seu povo; “deixe” preserva o sentido básico de עזב em linguagem atual.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: nem nos abandone
  rationale: נטש intensifica a ideia de ser deixado ou desamparado; “abandone” distingue os verbos sem apagar o paralelismo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e pactual em vez de substituí-lo por um título.
- issue: Tradução de אֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O hebraico diz literalmente “nossos pais” e se refere aos pais ou antepassados de Israel. A tradução mantém a forma concreta, enquanto a nota esclarece o alcance contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção optativa “Que ...” preserva o tom de oração, e o paralelismo final mantém dois verbos distintos.
