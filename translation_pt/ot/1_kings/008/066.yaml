base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: pt
  text: No oitavo dia, ele despediu o povo. Eles abençoaram o rei e foram para as suas tendas[a], alegres e com o coração contente por todo o bem que Yahweh havia feito a Davi, seu servo, e a Israel, seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para as suas casas»; literalmente, «para as suas tendas».
    reason: Alternativa lexical e esclarecimento do sentido idiomático de לְאָהֳלֵיהֶם.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Traduz diretamente a expressão temporal sem acrescentar «da festa», ideia fornecida pelo contexto, mas não expressa no versículo.
- source_word: שִׁלַּח אֶת הָעָם
  choice: ele despediu o povo
  rationale: O piel de שלח indica que ele autorizou a partida do povo; «despediu» é natural e preciso neste contexto.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: Eles abençoaram o rei
  rationale: Preserva o sentido normal de ברך. Embora o ato possa integrar uma despedida, o hebraico descreve uma bênção dirigida ao rei.
- source_word: לְאָהֳלֵיהֶם
  choice: para as suas tendas
  rationale: Mantém a imagem literal do hebraico; o sentido idiomático «para as suas casas» é registrado em nota.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: alegres e de coração contente
  rationale: Expressa tanto a alegria quanto o idioma hebraico relativo à disposição interior, preservando a referência ao coração em português corrente.
- source_word: עַל כָּל הַטּוֹבָה
  choice: por todo o bem
  rationale: A preposição indica a razão da alegria, e a formulação preserva a amplitude dos benefícios realizados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְדָוִד עַבְדּוֹ
  choice: a Davi, seu servo
  rationale: «Servo» é a tradução contextualmente adequada de עבד na linguagem régia e pactual aplicada a Davi.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: e a Israel, seu povo
  rationale: Mantém de modo claro a designação pactual em aposição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém o Tetragrama como nome pessoal. «Yahweh» preserva esse nome sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente segmentada em duas frases para clareza, sem alterar as relações do hebraico.
