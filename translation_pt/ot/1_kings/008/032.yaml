  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: pt
  text: então, ouve no céu[a], age e julga os teus servos, declarando culpado o perverso, fazendo a sua conduta recair sobre a própria cabeça[b], e declarando justo o justo[c], dando-lhe conforme a sua retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ouve desde o céu». O hebraico diz literalmente «ouve os céus/o céu», fórmula de oração que pode indicar Deus ouvindo no céu ou desde o céu.
    reason: lexical_alternative
  - marker: b
    text: Fazer a conduta de alguém recair sobre a própria cabeça é uma expressão hebraica que significa retribuir à pessoa segundo os seus atos.
    reason: cultural_note
  - marker: c
    text: Ou «inocenta o justo» ou «faz justiça ao justo».
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: ouve no céu
  rationale: 'A construção funciona como fórmula locativa de oração: Deus ouve no céu. A nota preserva a alternativa contextual «desde o céu».'
- source_word: וְעָשִׂיתָ
  choice: age
  rationale: No contexto da súplica judicial, o amplo verbo עשה pede uma resposta efetiva; «age» é natural e fiel.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: julga os teus servos
  rationale: Mantém o cenário de julgamento sem antecipar o veredito, desenvolvido nas orações seguintes.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: declara culpado o perverso
  rationale: 'O hifil de רשע tem sentido forense: pronunciar a culpa ou condenar. A formulação explicita esse valor jurídico em português corrente.'
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: fazendo a conduta dele recair sobre a sua própria cabeça
  rationale: «Conduta» comunica o sentido moral de דֶּרֶךְ, enquanto «recair sobre a própria cabeça» conserva a imagem hebraica de retribuição.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: declara justo o justo
  rationale: Preserva o paralelismo forense com «declara culpado» e evita sugerir transformação moral não expressa pelo verbo judicial.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: dando-lhe conforme a sua justiça
  rationale: Segue de perto o hebraico e mantém aberta a natureza exata da retribuição, sem acrescentar explicitamente «recompensa».
theological_decisions:
- issue: Sentido forense ou transformativo dos verbos judiciais
  choice: «declara culpado» e «declara justo»
  alternative: «condena» e «recompensa/vindica»
  rationale: O contexto é de adjudicação sob juramento, e os hifis de רשע e צדק designam vereditos jurídicos. A tradução mantém essa oposição sem introduzir uma mudança moral interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Teus servos» preserva o tom direto da oração; os verbos jurídicos são formulados de modo claro, e a imagem hebraica da retribuição é mantida com explicação em nota.
