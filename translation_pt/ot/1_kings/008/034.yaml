  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: pt
  text: então ouve nos céus[a], perdoa o pecado do teu povo Israel e traze-os de volta[b] para a terra que deste aos pais deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouve desde os céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “restaura-os à terra”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, os antepassados a quem Deus deu a terra.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: ouve nos céus
  rationale: Preserva a construção hebraica sem preposição explícita e o plural formal שָׁמַיִם, entendido como a morada divina; em português, “nos céus” é natural neste registro de oração.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: perdoa o pecado
  rationale: סלח expressa o perdão divino, e חטאת designa aqui o pecado de Israel, não uma oferta pelo pecado.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: teu povo Israel
  rationale: Reproduz de modo direto a identificação de Israel como povo de Deus.
- source_word: וַהֲשֵׁבֹתָם
  choice: e traz de volta
  rationale: 'O hifil de שוב tem sentido causativo: fazer voltar. A formulação indica claramente o retorno concreto à terra.'
- source_word: אֶל הָאֲדָמָה
  choice: para a terra
  rationale: Neste contexto, אֲדָמָה se refere ao território dado por Deus, não meramente ao solo.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: que deste aos pais deles
  rationale: Mantém a referência masculina e pactual aos antepassados que receberam a promessa da terra, sem tornar a expressão obscura.
theological_decisions:
- issue: Sentido de לַאֲבוֹתָם na linguagem da promessa da terra
  choice: aos pais deles
  alternative: aos antepassados deles
  rationale: “Pais” preserva a forma masculina e a linguagem da aliança, enquanto a nota esclarece que se trata dos antepassados a quem Deus deu a terra.
- issue: Natureza do retorno em וַהֲשֵׁבֹתָם
  choice: traz de volta para a terra
  alternative: restaura-os à terra
  rationale: A expressão hebraica descreve concretamente fazer o povo retornar ao território, não apenas uma restauração abstrata.
- issue: Local de onde Deus ouve
  choice: ouve nos céus
  alternative: ouve desde os céus
  rationale: A construção hebraica não explicita uma preposição; o texto principal conserva a leitura locativa, e a nota registra a possibilidade de origem sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A ordem coordenada do hebraico foi preservada, evitando explicitações teológicas não exigidas pelo texto.
