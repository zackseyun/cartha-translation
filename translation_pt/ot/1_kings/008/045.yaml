  text: וְ/שָׁמַעְתָּ֙ הַ/שָּׁמַ֔יִם אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/045.yaml
  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: pt
  text: então ouve, nos céus[a], a oração e a súplica deles, e faze justiça em favor deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os céus”. Também pode ser entendido como “do céu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “faze o julgamento/a justiça deles”; também: “defende a causa deles” ou “mantém o direito deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: então ouve
  rationale: O perfeito qal de שׁמע, dirigido a Deus no contexto da oração, tem força de pedido. A conjunção dá continuidade às condições anteriores; “então” expressa naturalmente essa sequência.
- source_word: הַשָּׁמַיִם
  choice: nos céus
  rationale: A expressão hebraica traz literalmente “os céus”, sem a preposição “de”. Em português, “nos céus” conserva o plural da forma hebraica e funciona naturalmente como indicação do lugar onde Deus ouve.
- source_word: תְּפִלָּתָם
  choice: a oração deles
  rationale: תְּפִלָּה é o termo geral para oração. O singular com sufixo plural é entendido coletivamente.
- source_word: תְּחִנָּתָם
  choice: a súplica deles
  rationale: תְּחִנָּה designa um pedido insistente por favor ou misericórdia. “Súplica” mantém a distinção em relação ao termo mais geral “oração” e é corrente no registro bíblico moderno.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: e faze justiça em favor deles
  rationale: Literalmente, “e faze o julgamento/a justiça deles”. A expressão idiomática pede que Deus lhes conceda justiça ou defenda sua causa; “em favor deles” comunica essa dimensão sem determinar de antemão o resultado judicial.
theological_decisions:
- issue: Expressão judicial no pedido dirigido a Deus
  choice: faze justiça em favor deles
  alternative: defende a causa deles; mantém o direito deles
  rationale: A formulação preserva o sentido jurídico-relacional de עשה משפט como ação divina que concede justiça, sem importar uma leitura doutrinária mais estreita nem presumir que a expressão simplesmente declare inocência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “nos céus” para refletir o plural hebraico; “súplica” mantém a distinção lexical, e “faze justiça em favor deles” reproduz de modo natural o idioma judicial.
