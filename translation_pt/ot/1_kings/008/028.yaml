  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: pt
  text: Contudo, volta-te para a oração do teu servo e para a sua súplica[a], ó Yahweh, meu Deus, para ouvir o clamor[b] e a oração que o teu servo faz hoje diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu pedido insistente”. O termo hebraico indica uma súplica por misericórdia ou favor.
    reason: lexical_alternative
  - marker: b
    text: Ou “o grito ressoante”. A palavra hebraica pode indicar um grito forte; aqui se refere a um clamor dirigido a Deus em oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Contudo, volta-te para
  rationale: Preserva a imagem concreta de פנה, “voltar-se para”, enquanto “contudo” expressa a transição levemente adversativa após o reconhecimento da transcendência de Deus no versículo anterior.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: a oração
  rationale: Equivalente direto e natural de תפלה; a repetição foi mantida para refletir o paralelismo hebraico.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: No modo de dirigir-se a Deus, expressa serviço humilde; a mesma tradução foi mantida nas duas ocorrências.
- source_word: תְּחִנָּתוֹ
  choice: a sua súplica por favor
  rationale: תחנה designa um pedido insistente por misericórdia ou favor. A formulação explicita essa nuance sem eliminar a alternativa tradicional “súplica”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Tradução direta do substantivo com sufixo possessivo em vocativo.
- source_word: לִשְׁמֹעַ
  choice: e ouve
  rationale: O infinitivo pode exprimir o propósito do pedido anterior. Em português, a coordenação imperativa comunica naturalmente a súplica sem alterar seu sentido.
- source_word: הָרִנָּה
  choice: o clamor
  rationale: רנה pode indicar um grito forte ou ressoante. No paralelismo com oração e súplica, “clamor” exprime uma invocação urgente dirigida a Deus.
- source_word: מִתְפַּלֵּל
  choice: faz
  rationale: Com “oração” como objeto, “faz” produz português natural e conserva a ação em curso no momento indicado por “hoje”.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Equivalente formal e idiomático da expressão hebraica, adequado ao contexto de oração.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Forma moderna e direta que preserva a referência temporal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Relação sintática de לִשְׁמֹעַ com o pedido anterior
  choice: e ouve
  alternative: para ouvires
  rationale: O infinitivo apresenta aquilo que se pede a Deus ao voltar-se para a oração. A coordenação em português é natural e mantém a força petitória; “para ouvires” permanece possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração (“teu”, “ti”). A imagem hebraica de Deus voltar-se para a oração e a repetição de “oração” foram preservadas.
