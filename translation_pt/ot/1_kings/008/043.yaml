source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: pt
  text: Ouve, nos céus, lugar da tua habitação, e age conforme tudo o que o estrangeiro te pedir[a], para que todos os povos da terra conheçam o teu nome, te temam como o teu povo Israel te teme e saibam que esta casa que construí leva o teu nome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «clamar a ti para obter» ou «invocar-te para obter».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «o teu nome é invocado sobre esta casa», expressão que indica que a casa pertence a Deus ou leva o nome dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: Ouve tu
  rationale: O imperfeito hebraico tem força volitiva no contexto da oração de Salomão. O imperativo português com o pronome expresso comunica a súplica solene e destaca o destinatário.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: nos céus, lugar da tua habitação
  rationale: Mantém a referência aos céus e a aposição que os identifica como o lugar da habitação divina, sem impor a leitura alternativa «desde os céus».
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: e faze tudo o que
  rationale: Reproduz a amplitude do verbo עשה e a totalidade da expressão hebraica em português natural.
- source_word: יִקְרָא אֵלֶיךָ
  choice: te pedir
  rationale: No contexto de oração, קרא אל descreve o estrangeiro dirigindo seu clamor ou pedido a Deus. «Te pedir» torna explícito o objeto implícito sem restringir o conteúdo da petição; a nota preserva as alternativas mais formais.
- source_word: הַנָּכְרִי
  choice: o estrangeiro
  rationale: Designa uma pessoa pertencente a outro povo, não apenas alguém desconhecido; «estrangeiro» é claro e atual.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: todos os povos da terra
  rationale: Preserva o plural «povos» e o alcance universal de הָאָרֶץ neste contexto.
- source_word: לְיִרְאָה אֹתְךָ
  choice: e te temam
  rationale: «Temer» conserva a tensão bíblica entre reverência, assombro e temor diante de Deus, sem reduzi-la a mero respeito.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: esta casa ... leva o teu nome
  rationale: Expressa em português natural o idioma hebraico de pertencimento e associação, enquanto a nota registra sua forma literal.
theological_decisions:
- issue: O sentido de ירא na resposta dos povos a Deus
  choice: te temam
  alternative: te reverenciem
  rationale: «Temer» preserva toda a extensão teológica do termo hebraico — reverência, assombro e santo temor — sem suavizá-lo.
- issue: O idioma שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: esta casa leva o teu nome
  alternative: o teu nome é invocado sobre esta casa
  rationale: A formulação escolhida comunica claramente que o templo pertence a Deus e está associado a ele. A alternativa literal pode sugerir em português apenas uma oração feita sobre o edifício, por isso foi preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A sintaxe foi levemente ajustada para fluidez, preservando o paralelismo de conhecer, temer e saber.
