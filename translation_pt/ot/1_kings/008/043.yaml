  naturalness: O registro é digno e claro. A revisão torna explícita, sem peso excessivo, a comparação elíptica em «como o teu povo Israel te teme» e ajusta a construção de «conforme tudo o que».
  terminology: «Estrangeiro», «povos da terra», «temam» e «leva o teu nome» são escolhas adequadas. A nota mantém de modo útil a formulação literal do idioma hebraico.
