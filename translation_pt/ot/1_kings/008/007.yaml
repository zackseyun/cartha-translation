base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: pt
  text: Pois os querubins estendiam as asas sobre o lugar da arca[a], e os querubins cobriam a arca e suas varas por cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em direção ao lugar da arca”. A preposição hebraica pode ter sentido direcional mais literal, embora o contexto favoreça a ideia de que as asas se estendiam sobre o lugar da arca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação para a afirmação anterior, preservando a força causal-explicativa do hebraico.
- source_word: הַכְּרוּבִים
  choice: os querubins
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para as figuras associadas à arca.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: estendiam as asas
  rationale: O particípio descreve uma disposição contínua; o imperfeito português expressa naturalmente esse estado no contexto narrativo.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: sobre o lugar da arca
  rationale: No contexto espacial, indica que as asas se estendiam por cima do local ocupado pela arca; a possibilidade direcional mais literal é preservada em nota.
- source_word: וַיָּסֹכּוּ
  choice: cobrindo
  rationale: O verbo סכך comunica a ideia de cobrir ou abrigar. O gerúndio liga naturalmente a ação à postura descrita na primeira oração.
- source_word: בַּדָּיו
  choice: suas varas
  rationale: Refere-se às varas usadas para transportar a arca; 'varas' é claro, corrente e tradicional nesse contexto.
- source_word: מִלְמָעְלָה
  choice: por cima
  rationale: Expressa de modo natural a posição superior a partir da qual os querubins cobriam a arca e suas varas.
