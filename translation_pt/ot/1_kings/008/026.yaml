  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: pt
  text: E agora, Deus de Israel, por favor, que a tua palavra[a], que disseste ao teu servo Davi, meu pai, seja confirmada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se estabeleça», «se mostre verdadeira» ou, de modo mais dinâmico, «se cumpra».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que dá continuidade à oração de Salomão quanto o advérbio temporal, em português natural.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Traduz diretamente a construção usada como vocativo; dispensa a interjeição solene «ó» sem perder a dignidade.
- source_word: יֵאָמֶן
  choice: que se confirme
  rationale: O nifal de אמן expressa o pedido de que a palavra de Deus seja demonstrada firme ou estabelecida. A construção mantém o valor passivo e a forma de súplica.
- source_word: נָא
  choice: por favor
  rationale: Transmite em linguagem contemporânea a força cortês e suplicante da partícula.
- source_word: דבריך
  choice: a tua palavra
  rationale: O singular coletivo é natural em português para uma declaração divina, embora a forma consonantal hebraica também permita ser representada literalmente por «as tuas palavras».
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: que disseste
  rationale: Reproduz a oração relativa e o verbo comum «falar/dizer» sem antecipar interpretativamente a ideia de promessa.
- source_word: לְעַבְדְּךָ
  choice: ao teu servo
  rationale: No contexto da relação de Davi com Deus, «servo» comunica melhor o sentido relacional e honorífico de עבד.
- source_word: דָּוִד אָבִי
  choice: Davi, meu pai
  rationale: Mantém a sequência apositiva do hebraico e esclarece naturalmente em português a relação de Salomão com Davi.
theological_decisions:
- issue: Natureza do pedido acerca da declaração anterior de Deus a Davi
  choice: Pedido para que a palavra de Deus seja confirmada
  alternative: Pedido mais dinâmico para que a promessa de Deus se cumpra
  rationale: «Que se confirme» preserva a noção de firmeza do verbo hebraico e deixa implícita, sem a ampliar doutrinariamente, a ideia contextual de cumprimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação de «por favor» conserva o tom de súplica sem recorrer a fórmulas arcaicas. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
