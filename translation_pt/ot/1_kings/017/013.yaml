  to: 'Então Elias lhe disse: “Não tenha medo. Vá e faça como você disse. Mas primeiro faça para mim, com o que você tem aí, um pequeno pão assado[a] e traga-o para mim. Depois, faça um para você e para o seu filho.”'
  rationale: A revisão limita-se a substituir “algo” por “um”, de modo que a elipse portuguesa retome claramente o pequeno pão assado, como faz o hebraico. O restante mantém de modo fiel e natural a ordem temporal e o sentido do versículo.
