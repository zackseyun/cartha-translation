base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: pt
  text: 'Então Elias lhe disse: “Não tenha medo. Vá e faça como você disse. Mas primeiro faça para mim, com o que você tem aí, um pequeno pão assado[a] e traga-o para mim. Depois, faça um para você e para o seu filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um pequeno bolo”. O termo hebraico pode designar um pequeno pão ou bolo assado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: Expressa naturalmente em português moderno a proibição dirigida à mulher, sem alterar a força do hebraico.
- source_word: בֹּאִי
  choice: Vá
  rationale: Embora o sentido lexical básico seja “venha”, aqui o imperativo funciona idiomaticamente como incentivo para prosseguir com a ação; “vá” se ajusta ao contexto.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: faça como você disse
  rationale: Reproduz de modo claro e natural a ideia de agir conforme o plano que ela acabara de declarar.
- source_word: אַךְ
  choice: Mas
  rationale: Introduz a ressalva de Elias à ação proposta pela mulher.
- source_word: מִשָּׁם
  choice: com o que você tem aí
  rationale: O literal “de lá” remete contextualmente aos mantimentos disponíveis; esta formulação explicita apenas o referente imediato sem especificar além do texto.
- source_word: עֻגָה קְטַנָּה
  choice: um pequeno pão assado
  rationale: עֻגָה designa um alimento de massa assado, semelhante a um pão ou bolo; “pão assado” evita a associação moderna de “bolo” com um alimento doce.
- source_word: בָרִאשֹׁנָה
  choice: primeiro
  rationale: Mantém inequivocamente a prioridade temporal exigida no texto.
- source_word: וְהוֹצֵאתְ לִי
  choice: e traga-o para mim
  rationale: Transmite de forma idiomática o hifil de יצא, literalmente “faça sair/traga para fora”, sem inserir um local não declarado.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: faça algo para você e para o seu filho
  rationale: O objeto está elíptico no hebraico. “Algo” preserva essa generalidade com naturalidade em português.
- source_word: בָאַחֲרֹנָה
  choice: Depois
  rationale: Indica a ordem subsequente da preparação com clareza e concisão.
theological_decisions:
- issue: Possível dificuldade ética ou teológica no pedido de Elias para ser alimentado primeiro
  choice: Preservar explicitamente a prioridade temporal com “primeiro” e “depois”
  alternative: Suavizar ou explicar moralmente o pedido dentro do versículo
  rationale: O hebraico apresenta claramente essa sequência. A tradução mantém a tensão narrativa sem justificá-la nem atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea e mantém os imperativos no tratamento feminino indicado pelo hebraico.
