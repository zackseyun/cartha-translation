  source_fidelity: 'A sequência imperativa, a proibição de temer, a prioridade dada à porção de Elias e a ordem posterior para a mulher e seu filho estão bem preservadas. Contudo, “faça algo” deixa o objeto excessivamente indeterminado: no hebraico, o objeto é elíptico, mas retoma a pequena porção assada mencionada imediatamente antes.'
  naturalness: O português é moderno, claro e de registro apropriado. “Não tenha medo”, “Vá” e “Depois” soam naturais para o público-alvo. A substituição de “algo” por “um” torna a retomada mais idiomática e precisa.
  terminology: “Elias” e “pequeno pão assado” são adequados. A nota que informa a alternativa “pequeno bolo” representa legitimamente a amplitude de עֻגָה, sem impor uma conotação moderna de alimento doce.
