    issue: “Depois, faça algo para você e para o seu filho”
    rationale: “Algo” pode sugerir que ela prepararia qualquer outro alimento. A elipse hebraica retoma o pequeno pão/bolo acabado de ordenar; em português, “faça um” preserva essa retomada sem repetir desnecessariamente o substantivo.
