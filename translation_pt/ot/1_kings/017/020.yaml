  terminology: “Yahweh” é mantido de forma consistente para o Tetragrama. “Meu Deus”, “viúva” e “filho” correspondem corretamente aos termos hebraicos e preservam o registro do texto. As notas explicam alternativas reais sem impor interpretação doutrinária.
