  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י הֲ֠/גַם עַל הָ/אַלְמָנָ֞ה אֲשֶׁר אֲנִ֨י מִתְגּוֹרֵ֥ר עִמָּ֛/הּ הֲרֵע֖וֹתָ לְ/הָמִ֥ית אֶת בְּנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: pt
  text: 'Então ele clamou a Yahweh e disse: “Ó Yahweh, meu Deus, será que também trouxeste desgraça sobre a viúva com quem estou hospedado[b], fazendo o filho dela morrer[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “matando o filho dela”. O infinitivo hebraico atribui a morte à ação causadora mencionada na oração.
    reason: lexical_alternative
  - marker: b
    text: Ou “com quem resido como estrangeiro”. O hebraico sugere morar temporariamente como hóspede ou dependente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: clamou a Yahweh
  rationale: No contexto de oração e aflição, קרא אֶל expressa um apelo intenso; “clamou” transmite essa força sem acrescentar conteúdo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְהוָה אֱלֹהָי
  choice: Ó Yahweh, meu Deus
  rationale: Preserva a invocação direta e o possessivo da expressão hebraica, com pontuação natural em português.
- source_word: הֲגַם
  choice: será que também
  rationale: Reproduz a pergunta carregada de espanto e o sentido aditivo de גם, pelo qual esta calamidade se soma ao sofrimento anterior.
- source_word: עַל הָאַלְמָנָה
  choice: sobre a viúva
  rationale: Com o verbo רעע, עַל indica que a ação adversa recai sobre a viúva.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: com quem estou hospedado
  rationale: O hitpael de גור sugere residência temporária na condição de hóspede ou dependente; “estou hospedado” é claro e atual.
- source_word: הֲרֵעוֹתָ
  choice: trouxeste desgraça
  rationale: O hiphil de רעע pode indicar causar dano ou calamidade. A formulação mantém a atribuição ousada da oração sem necessariamente acusar Deus de maldade moral.
- source_word: לְהָמִית
  choice: fazendo ... morrer
  rationale: Expressa a causação, o meio ou o resultado indicado pelo infinitivo, sem suavizar a atribuição do acontecimento à ação divina.
- source_word: בְּנָהּ
  choice: o filho dela
  rationale: בן designa especificamente o filho do sexo masculino; “dela” evita ambiguidade em português.
theological_decisions:
- issue: Se a oração de Elias acusa Deus de praticar mal moral ou lamenta uma calamidade causada por ele
  choice: trouxeste desgraça ... fazendo o filho dela morrer
  alternative: fizeste mal à viúva ... matando o filho dela
  rationale: O hebraico permite a linguagem de dano, desgraça ou calamidade e atribui a morte à ação de Deus, mas não exige que Elias o acuse de maldade moral. A tradução conserva tanto a ousadia quanto a tensão teológica da oração.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. “Ó” marca a invocação solene; “clamou” conserva a intensidade da oração. A sintaxe mantém a pergunta chocada de Elias e evita resolver a tensão do texto.
