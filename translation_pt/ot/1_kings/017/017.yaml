  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: pt
  text: Depois dessas coisas, o filho da mulher que era dona da casa adoeceu, e sua doença se agravou muito, até que não lhe restou fôlego algum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até que não lhe restou vida alguma». O hebraico diz literalmente: «até que não restou nele fôlego».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: Preserva o plural e a transição temporal da fórmula narrativa hebraica, sem recorrer ao pouco natural «e aconteceu depois destas coisas».
- source_word: חָלָה
  choice: adoeceu
  rationale: 'Expressa de modo natural e conciso o sentido ingressivo do verbo: o filho passou a estar doente.'
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: o filho da mulher que era dona da casa
  rationale: Comunica claramente que a mulher era a proprietária ou senhora da casa, evitando tanto uma formulação arcaica quanto a possível leitura meramente doméstica de «dona de casa».
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: sua doença se agravou muito
  rationale: Reproduz naturalmente a progressão narrativa e a intensidade indicada por חָזָק מְאֹד.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: até que não lhe restou fôlego algum
  rationale: Mantém נְשָׁמָה como «fôlego» e preserva a expressão hebraica, que implica a cessação da vida sem substituí-la diretamente por «morreu».
theological_decisions:
- issue: Se a cláusula final deve ser explicitada como uma declaração direta de morte
  choice: 'Preservar a imagem hebraica: «não lhe restou fôlego algum»'
  alternative: «até que morreu» ou «até que não lhe restou vida alguma»
  rationale: O texto afirma que nenhuma נְשָׁמָה restou nele. A tradução conserva essa formulação e sua tensão sem impor no texto principal uma explicitação interpretativa mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «mulher que era dona da casa» evita a ambiguidade de «dona de casa», e «se agravou muito» apresenta com naturalidade o avanço da enfermidade.
