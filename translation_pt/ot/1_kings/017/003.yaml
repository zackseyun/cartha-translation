  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: pt
  text: Vá embora daqui, siga para o leste e esconda-se junto ao ribeiro[a] de Querite, que fica diante do Jordão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode designar um vale, barranco ou curso de água sazonal; por isso, também se pode traduzir por “wadi de Querite”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “em frente ao Jordão”. Alguns entendem: “a leste do Jordão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: Vá embora daqui
  rationale: Expressa de modo natural a ordem de deixar o lugar presente, sem acrescentar um destino não indicado.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: siga para o leste
  rationale: O verbo פנה com o dativo idiomático לְךָ e o direcional קֵדְמָה indica tomar a direção leste; uma formulação reflexiva seria pouco natural em português.
- source_word: וְנִסְתַּרְתָּ
  choice: esconda-se
  rationale: Preserva o sentido reflexivo/contextual do nifal de סתר e a força da ordem.
- source_word: בְּנַחַל
  choice: junto ao ribeiro
  rationale: נחל designa um curso de água ou vale por onde ela corre, muitas vezes sazonal. 'Ribeiro' é claro em português, enquanto a nota conserva a amplitude lexical.
- source_word: כְּרִית
  choice: Querite
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: que fica diante do Jordão
  rationale: Mantém a expressão espacial hebraica sem decidir de maneira indevida que o local ficava necessariamente a leste do Jordão.
theological_decisions:
- issue: Localização de Querite em relação ao Jordão
  choice: diante do Jordão
  alternative: a leste do Jordão; em frente ao Jordão
  rationale: A expressão עַל־פְּנֵי admite mais de uma relação espacial. O versículo manda Elias seguir para o leste, mas isso não basta para tornar 'a leste do Jordão' uma tradução certa da oração relativa; a ambiguidade geográfica foi preservada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Evitou-se o pouco idiomático 'volte-se para si mesmo' e preservou-se na nota a incerteza lexical e geográfica.
