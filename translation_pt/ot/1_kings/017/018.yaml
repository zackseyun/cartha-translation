base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: pt
  text: 'Ela disse a Elias: “O que eu tenho a ver com você, homem de Deus? Você veio até mim para trazer à memória a minha iniquidade[a] e fazer meu filho morrer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu pecado” ou “minha culpa”. O termo hebraico pode se referir à transgressão, à culpa ou ao peso e às consequências da culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: O que você tem contra mim
  rationale: Expressa em português natural a distância, a queixa e o protesto da fórmula idiomática hebraica, sem enfraquecer seu tom confrontador.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título hebraico estabelecido para um profeta ou mensageiro divino e sua ressonância bíblica.
- source_word: בָּאתָ אֵלַי
  choice: Você veio até mim
  rationale: A forma verbal, em pergunta retórica, tem força acusatória; o pretérito perfeito é idiomático e claro em português.
- source_word: לְהַזְכִּיר
  choice: trazer à memória
  rationale: 'Preserva a nuance causativa do Hifil: fazer com que algo seja lembrado ou trazido à atenção.'
- source_word: עֲוֺנִי
  choice: minha iniquidade
  rationale: Mantém o peso moral do termo sem decidir indevidamente entre o ato errado, a culpa resultante e sua consequência.
- source_word: וּלְהָמִית
  choice: fazer meu filho morrer
  rationale: Reflete a forma causativa do Hifil de מות, em vez de convertê-la diretamente em 'matar'.
- source_word: בְּנִי
  choice: meu filho
  rationale: Traduz especificamente o substantivo hebraico masculino 'filho'.
theological_decisions:
- issue: Sentido de עֲוֺנִי na acusação da viúva
  choice: minha iniquidade
  alternative: meu pecado; minha culpa
  rationale: A viúva relaciona a morte do filho à própria responsabilidade moral. O hebraico pode indicar tanto a transgressão quanto a culpa ou o peso decorrente dela; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. O tratamento por “você” torna a fala natural sem eliminar o tom acusatório; “homem de Deus” e “iniquidade” preservam o registro bíblico e solene.
