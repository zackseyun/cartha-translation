base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: pt
  text: 'Levante-se, vá a Sarepta, que pertence a Sidom,[a] e fique ali. Veja: ordenei a uma viúva ali que o sustente.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que fica em Sidom” ou “que fica perto de Sidom”. O hebraico relaciona Sarepta a Sidom, provavelmente indicando uma associação regional ou política.
    reason: lexical_alternative
  - marker: b
    text: Ou “designei uma viúva ali para sustentá-lo”. O hebraico diz “ordenei”, o que pode descrever a direção soberana de Deus mesmo que a narrativa ainda não apresente a viúva como conscientemente informada dessa ordem.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: Levante-se
  rationale: O imperativo de קום manda que Elias se ponha em ação. “Levante-se” é natural no português atual e preserva a força da ordem.
- source_word: לֵ֤ךְ
  choice: vá
  rationale: O imperativo de הלך, em uma ordem de deslocamento, é traduzido de modo direto e idiomático por “vá”.
- source_word: צָרְפַתָה
  choice: Sarepta
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do topônimo bíblico.
- source_word: אֲשֶׁר לְצִידוֹן
  choice: que pertence a Sidom
  rationale: A preposição ל relaciona Sarepta a Sidom, provavelmente em sentido regional ou político. “Pertence a Sidom” preserva essa associação sem reduzi-la necessariamente a mera localização.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: e fique ali
  rationale: O perfeito com waw continua a sequência de ordens. “Fique ali” comunica de maneira natural a permanência ou residência exigida, sem tom arcaico.
- source_word: הִנֵּה
  choice: 'Veja:'
  rationale: A partícula chama a atenção para a declaração seguinte. “Veja” mantém essa função discursiva em linguagem contemporânea; os dois-pontos introduzem naturalmente o conteúdo destacado.
- source_word: צִוִּיתִי
  choice: ordenei
  rationale: O piel perfeito de צוה significa diretamente “ordenar”. A tradução mantém essa força verbal e não explica antecipadamente como a viúva recebeu ou cumpriria a ordem.
- source_word: אִשָּׁה אַלְמָנָה
  choice: uma viúva
  rationale: A expressão literalmente próxima de “uma mulher, uma viúva” é representada com naturalidade e sem perda semântica por “uma viúva”.
- source_word: לְכַלְכְּלֶךָ
  choice: que sustente você
  rationale: כלכל denota sustentar ou prover o necessário. “Sustente você” preserva o sentido amplo de manutenção contínua e se ajusta ao contexto de alimento e cuidado.
theological_decisions:
- issue: Sentido da afirmação divina de que Deus havia “ordenado” à viúva
  choice: Manter a formulação direta “ordenei”.
  alternative: “designei” ou “preparei” uma viúva
  rationale: O hebraico emprega צוה, cujo sentido normal é “ordenar”. Como a narrativa seguinte não mostra claramente que a viúva já tivesse consciência dessa ordem, a tradução preserva a tensão textual e teológica em vez de resolvê-la por interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. Evitou-se “eis que” por seu tom mais marcado, bem como “habite” e “prover” quando formas mais correntes comunicam adequadamente o sentido. Os marcadores de nota foram colocados junto às expressões efetivamente comentadas.
