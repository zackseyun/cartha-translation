  text: וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל אֵ֣לִיָּ֔הוּ עַתָּה֙ זֶ֣ה יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים אָ֑תָּה וּ/דְבַר יְהוָ֥ה בְּ/פִ֖י/ךָ אֱמֶֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: pt
  text: 'Então a mulher disse a Elias: “Agora sei que você é um homem de Deus e que a palavra de Yahweh em sua boca é verdade[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é verdadeira”. O substantivo hebraico pode destacar verdade, veracidade ou confiabilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Mantém o sentido lexical imediato sem substituir a expressão por “a viúva”, embora ela já tenha sido identificada assim no contexto.
- source_word: אֶל אֵלִיָּהוּ
  choice: a Elias
  rationale: Forma corrente em português para indicar a pessoa a quem ela falou.
- source_word: עַתָּה זֶה
  choice: Agora
  rationale: A combinação hebraica é enfática e marca a certeza adquirida neste momento; “Agora” comunica isso sem literalismo estranho.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: O perfeito expressa aqui um reconhecimento agora estabelecido como resultado do acontecimento anterior.
- source_word: אִישׁ אֱלֹהִים
  choice: homem de Deus
  rationale: Expressão hebraica reconhecida para alguém que pertence a Deus e fala em seu nome; a formulação tradicional continua clara em português.
- source_word: וּדְבַר יְהוָה
  choice: e que a palavra de Yahweh
  rationale: “Palavra” preserva a fórmula profética e sua ressonância, enquanto “Yahweh” representa diretamente o nome divino no texto hebraico.
- source_word: בְּפִיךָ
  choice: em sua boca
  rationale: Conserva a imagem hebraica da palavra divina proferida pelo profeta e é compreensível em português.
- source_word: אֱמֶת
  choice: é verdade
  rationale: Preserva o substantivo predicativo hebraico e a afirmação enfática, sem limitar o termo apenas à correção factual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Valor de אֱמֶת como predicativo
  choice: é verdade
  alternative: é verdadeira
  rationale: A forma substantiva mantém a força da declaração e permite a amplitude semântica de verdade, veracidade e confiabilidade; a alternativa adjetiva é português mais convencional, mas explicita menos essa forma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento “você/sua” é natural e acessível; a sintaxe retém a imagem profética “em sua boca”. O marcador [a] aparece no texto principal junto à expressão anotada.
