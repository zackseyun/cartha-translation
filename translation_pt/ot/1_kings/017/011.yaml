base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: pt
  text: 'Enquanto ela ia buscá-la, ele a chamou[a] e disse: “Por favor, traga-me um pedaço de pão[b] em sua mão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chamou atrás dela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um bocado de pão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: Enquanto ela ia buscá-la
  rationale: A sequência narrativa apresenta a mulher a caminho de buscar a água mencionada no contexto anterior. “Enquanto ela ia” expressa naturalmente que Elias a chamou durante essa ação, e o pronome feminino retoma “água” sem repetição desnecessária.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: ele a chamou
  rationale: קרא com אֶל indica chamar alguém. A formulação é corrente em português e não acrescenta a ideia mais interpretativa de que ele chamou atrás dela.
- source_word: לִקְחִי נָא לִי
  choice: Por favor, traga-me
  rationale: O imperativo לקח, neste contexto de obter algo e levá-lo ao falante, é bem representado por “traga”. נָא suaviza o pedido e corresponde naturalmente a “por favor”; לִי marca o destinatário ou beneficiário.
- source_word: פַּת לֶחֶם
  choice: um pedaço de pão
  rationale: A expressão designa uma porção pequena de pão. “Um pedaço de pão” é claro, atual e preserva o sentido sem o tom mais literário de “um bocado de pão”.
- source_word: בְּיָדֵךְ
  choice: em sua mão
  rationale: Mantém a imagem concreta do hebraico, literalmente “em tua mão”, embora a expressão também possa funcionar de modo idiomático, indicando aquilo que a mulher levaria consigo.
