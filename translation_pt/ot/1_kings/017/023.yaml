base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: pt
  text: 'Então Elias pegou o menino, levou-o para baixo, do quarto de cima para dentro da casa, e o entregou à sua mãe. E Elias disse: “Veja, seu filho está vivo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu filho vive”.'
    reason: Alternativa lexical e sintática para חַי בְּנֵךְ, preservando a possibilidade de expressar a declaração com verbo em vez de adjetivo predicativo.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: O verbo לקח é comum na narrativa e, neste contexto, “pegou” expressa de modo natural que Elias tomou o menino consigo, sem especificar além do hebraico como o transportou.
- source_word: הַיֶּלֶד
  choice: o menino
  rationale: יֶלֶד pode significar “criança” ou “menino”; o contexto de mãe e filho permite “menino”, expressão natural e sem implicar que fosse bebê.
- source_word: וַיֹּרִדֵהוּ
  choice: desceu com ele
  rationale: A forma causativa de ירד indica fazê-lo descer ou levá-lo para baixo. “Desceu com ele” comunica o movimento de forma idiomática sem afirmar explicitamente que Elias o carregou.
- source_word: הָעֲלִיָּה
  choice: o quarto de cima
  rationale: עֲלִיָּה designa um aposento superior. “Quarto de cima” é claro, atual e preserva a referência arquitetônica.
- source_word: הַבַּיְתָה
  choice: para dentro da casa
  rationale: A terminação direcional em בַּיְתָה indica movimento para a casa ou para seu interior; “para dentro da casa” torna essa direção explícita em português natural.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: o entregou à sua mãe
  rationale: נתן com destinatário significa literalmente dar. Em português, “entregou” é mais natural para uma pessoa e não acrescenta a noção interpretativa de “devolveu”.
- source_word: רְאִי
  choice: Veja
  rationale: Imperativo feminino singular de ראה, dirigido à mãe. “Veja” preserva a força direta e demonstrativa sem tom arcaico.
- source_word: חַי בְּנֵךְ
  choice: seu filho está vivo
  rationale: A construção com adjetivo predicativo declara o estado de vida do filho. “Está vivo” é idiomático e mantém a formulação simples e enfática do hebraico.
theological_decisions:
- issue: Grau de explicitação do milagre de retorno à vida
  choice: “seu filho está vivo”
  alternative: “seu filho voltou a viver” ou “seu filho foi restaurado à vida”
  rationale: O hebraico declara diretamente que o filho está vivo, sem incluir “de novo” nem descrever o mecanismo do milagre. A tradução preserva essa concisão e deixa o contexto comunicar o retorno à vida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência narrativa foi mantida clara, e evitou-se vocabulário arcaico como “câmara superior” ou “eis que”.
