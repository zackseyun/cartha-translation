source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: pt
  text: 'Pois assim diz Yahweh, o Deus de Israel: “A farinha do pote não se acabará, e o azeite da vasilha não faltará, até o dia em que Yahweh der chuva sobre o solo[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sobre a face do solo”.'
    reason: Nota o idiomatismo concreto do texto hebraico, traduzido de maneira mais natural no corpo do versículo.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz de modo direto e natural a cadeia construta hebraica.
- source_word: כַּד הַקֶּמַח
  choice: a farinha do pote
  rationale: כַּד designa um recipiente doméstico. Em português, dizer que a farinha do pote não se acabará transmite naturalmente a ideia hebraica de que o suprimento contido nele não chegará ao fim.
- source_word: לֹא תִכְלָה
  choice: não se acabará
  rationale: O verbo כלה indica chegar ao fim ou ser consumido; esta formulação é clara e idiomática para um suprimento de farinha.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: o azeite da vasilha
  rationale: צַפַּחַת é um recipiente pequeno. “Vasilha” diferencia este objeto do pote mencionado antes, sem especificar uma forma que o hebraico não determina com certeza. “Azeite” é a designação portuguesa natural para o óleo alimentar pressuposto pelo contexto.
- source_word: לֹא תֶחְסָר
  choice: não faltará
  rationale: חסר significa faltar ou diminuir. A tradução mantém esse sentido sem converter a expressão em uma descrição mais específica, como “não secará”.
- source_word: עַד יוֹם
  choice: até o dia em que
  rationale: Preserva explicitamente a expressão temporal hebraica e introduz a oração seguinte com naturalidade em português.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: Yahweh der chuva
  rationale: Mantém o sentido básico de נתן, “dar”, e a ordem conceitual do hebraico.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre o solo
  rationale: Expressa com naturalidade a ideia de chuva sobre a superfície do terreno, deixando o idiomatismo literal para a nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título nem adotar outra forma portuguesa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela foi preservada, enquanto os conteúdos dos recipientes foram apresentados como sujeitos para evitar a impressão inadequada de que os próprios recipientes deixariam de existir.
