  terminology: «Yahweh» segue a decisão estabelecida para o Tetragrama. «Pote», «vasilha», «farinha», «azeite» e «solo» são compreensíveis e adequados ao contexto doméstico e agrícola. «Azeite» é aceitável para שֶׁמֶן neste contexto, sem exigir uma nota que especifique oliveira.
