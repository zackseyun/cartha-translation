  source_fidelity: 'O texto traduz com fidelidade a fórmula profética: preserva Yahweh, «o Deus de Israel», a negação paralela do esgotamento da farinha e da falta de azeite, o limite temporal e a concessão de chuva por Yahweh. A opção por fazer da farinha e do azeite os sujeitos explicita naturalmente em português o sentido contextual das expressões hebraicas referentes aos recipientes, sem alterar a promessa.'
