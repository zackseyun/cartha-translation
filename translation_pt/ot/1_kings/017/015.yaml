base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: pt
  text: Então ela foi e fez conforme a palavra de Elias. E comeu — ele, ela e os de sua casa — durante muitos dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente, a construção hebraica diz: “e comeu — ele, ela e os de sua casa — dias”. O verbo está no singular e é seguido pela enumeração explícita dos que comeram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Então ela foi
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência resultante da instrução anterior.
- source_word: וַתַּעֲשֶׂה
  choice: e fez
  rationale: עשה indica aqui que ela cumpriu a instrução de Elias; “fez” mantém a formulação ampla e direta do hebraico.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: conforme a palavra de Elias
  rationale: דבר designa a palavra ou instrução falada. A formulação preserva a expressão hebraica sem reduzir o sentido apenas a “como Elias disse”.
- source_word: וַתֹּאכַל
  choice: E comeu
  rationale: O verbo hebraico está no singular, embora venha seguido de uma enumeração dos participantes. A ordem verbal portuguesa permite conservar essa construção marcada.
- source_word: הוא וְהִיא וּבֵיתָהּ
  choice: ele, ela e os de sua casa
  rationale: Mantém a ordem explícita “ele e ela” e entende בַּיִת, neste contexto de alimentação, como as pessoas pertencentes à casa, sem identificar “ele” além do que o contexto permite.
- source_word: יָמִים
  choice: durante muitos dias
  rationale: O plural adverbial indica uma duração prolongada; “durante muitos dias” é idiomático e corresponde ao sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação destaca a sintaxe incomum do hebraico sem transformar o verbo singular em plural; “os de sua casa” evita sugerir que a construção física comeu e preserva o sentido de grupo doméstico.
