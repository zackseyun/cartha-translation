  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: pt
  text: Depois de algum tempo, o riacho secou[a], porque não havia chuva na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «curso de água sazonal». O termo hebraico pode indicar um riacho ou o leito de uma torrente, que pode ficar seco em certas épocas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Depois de algum tempo,
  rationale: A fórmula narrativa introduz o acontecimento seguinte; em português atual, seu valor é expresso naturalmente pela progressão da frase, sem o arcaísmo «e aconteceu que».
- source_word: מִקֵּץ יָמִים
  choice: depois de algum tempo
  rationale: O idioma indica o fim de um período não especificado. A expressão mantém essa indefinição de modo natural, sem sugerir necessariamente poucos dias.
- source_word: וַיִּיבַשׁ
  choice: secou
  rationale: No contexto de um curso de água, o verbo descreve de modo direto que ele ficou sem água.
- source_word: הַנָּחַל
  choice: o riacho
  rationale: נַחַל pode designar um curso de água sazonal ou o vale por onde corre. «Riacho» é claro para leitores de diferentes regiões lusófonas; a nota registra a precisão geográfica alternativa.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz explicitamente a causa de o riacho ter secado.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: não chovia
  rationale: A formulação portuguesa expressa com naturalidade a ausência persistente de chuva que causou a seca do riacho.
- source_word: בָּאָרֶץ
  choice: naquela terra
  rationale: O referente é a terra ou região do relato, não o planeta inteiro. «Naquela» torna esse alcance contextual claro sem especificar além do hebraico.
