  text: And the word of Yahweh came to him[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh[a] veio a ele, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido como “SENHOR”.'
    reason: Esclarece a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O wayyiqtol de היה dá continuidade à narrativa. “Então ... veio” expressa com naturalidade a progressão do relato sem recorrer ao pouco idiomático “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: No estado construto com o nome divino, integra a fórmula profética “a palavra de Yahweh”. “Palavra” preserva melhor o caráter formulaico e revelatório do que a opção mais interpretativa “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֵלָיו
  choice: a ele
  rationale: A preposição אֶל com sufixo pronominal indica direção ao destinatário; “a ele” é claro e natural nesta fórmula de revelação.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta. “Dizendo” mantém a fórmula hebraica de maneira corrente e digna em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama יְהוָה. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título e “Jeová” representa uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. O marcador foi colocado imediatamente após “Yahweh”, termo ao qual a nota se refere.
