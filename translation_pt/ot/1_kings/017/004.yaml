base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: pt
  text: Você beberá do riacho[a], e eu ordenei aos corvos[b] que sustentem você[c] ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da torrente” ou “do uádi”. O termo hebraico também pode designar um curso de água sazonal ou seu leito.
    reason: lexical_alternative
  - marker: b
    text: Alguns propuseram aqui uma leitura que não se refere a aves, mas o sentido comum do hebraico é “corvos”, e o contexto seguinte favorece essa leitura.
    reason: alternative_reading
  - marker: c
    text: Ou “que alimentem você” ou “que cuidem do seu sustento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Você beberá
  rationale: A fórmula hebraica introduz a circunstância futura; em português, incorporá-la diretamente ao verbo produz uma frase natural sem perder o valor preditivo.
- source_word: מֵהַנַּחַל
  choice: da torrente
  rationale: נַחַל pode indicar uma torrente, um riacho ou o leito de um curso sazonal. “Torrente” é corrente em português bíblico e se ajusta ao cenário, sem exigir o termo geográfico menos conhecido “uádi”.
- source_word: תִּשְׁתֶּה
  choice: Você beberá
  rationale: O imperfeito na segunda pessoa masculina singular indica aqui uma ação futura.
- source_word: הָעֹרְבִים
  choice: os corvos
  rationale: O sentido comum do substantivo é o de aves da família dos corvídeos; “corvos” é a equivalência portuguesa natural e é confirmado pelo contexto seguinte.
- source_word: צִוִּיתִי
  choice: eu ordenei
  rationale: O perfeito apresenta a ordem divina como já dada. O pretérito perfeito é idiomático em português e mantém essa anterioridade.
- source_word: לְכַלְכֶּלְךָ
  choice: que sustentem você
  rationale: O verbo abrange sustentar, alimentar e prover o necessário. “Sustentem você” preserva essa amplitude sem restringir o sentido apenas à alimentação.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio aponta para o lugar anteriormente indicado; “ali” é a forma direta e natural em português.
theological_decisions:
- issue: Identidade dos agentes encarregados de sustentar Elias
  choice: Corvos literais, entendidos como aves
  alternative: Um nome de lugar ou um grupo humano, conforme propostas minoritárias
  rationale: O sentido lexical comum de הָעֹרְבִים é “corvos”, e o contexto subsequente descreve essas aves trazendo pão e carne. A tradução mantém a leitura simples sem eliminar a existência de propostas alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada à sintaxe natural do português. “Torrente” conserva o caráter geográfico do cenário, enquanto as alternativas mais específicas aparecem em nota.
