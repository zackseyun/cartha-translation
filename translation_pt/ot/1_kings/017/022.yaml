  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: pt
  text: E Yahweh deu ouvidos à voz de Elias, e a vida[a] do menino voltou para dentro dele, e ele viveu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a alma do menino voltou para dentro dele”. O hebraico néfesh pode significar “vida”, “alma” ou “ser”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: deu ouvidos
  rationale: No contexto da oração, שׁמע indica não apenas ouvir, mas acolher e atender favoravelmente. “Deu ouvidos” preserva essa nuance e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּקוֹל
  choice: à voz
  rationale: Mantém a expressão concreta do hebraico, sem explicá-la como “oração” ou “súplica”.
- source_word: וַתָּשָׁב
  choice: voltou
  rationale: Expressa diretamente o retorno ou a restauração indicada por שׁוב neste contexto.
- source_word: נֶפֶשׁ
  choice: a vida
  rationale: No relato da revivificação do menino, נֶפֶשׁ designa naturalmente sua vida. A tradução evita impor uma antropologia dualista, sem excluir a alternativa tradicional “alma”, registrada em nota.
- source_word: הַיֶּלֶד
  choice: do menino
  rationale: יֶלֶד pode significar “criança” ou “menino”; o contexto identifica uma criança do sexo masculino, e “menino” é claro e natural em português.
- source_word: עַל קִרְבּוֹ
  choice: ao seu interior
  rationale: Preserva a referência de קֶרֶב à parte interna ou ao íntimo da pessoa, em vez de reduzi-la ao mais genérico “a ele”.
- source_word: וַיֶּחִי
  choice: e ele viveu
  rationale: Reproduz de modo conciso e próximo ao hebraico o resultado declarado pelo verbo חיה.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto da volta à vida
  choice: a vida
  alternative: a alma
  rationale: “A vida” comunica o sentido narrativo imediato sem definir além do texto a relação entre corpo e alma. “A alma” continua sendo uma leitura lexical plausível e tradicional, por isso é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “deu ouvidos à voz” conserva tanto a imagem hebraica quanto a ideia de resposta favorável; “ao seu interior” mantém a formulação corporal e interior do original.
