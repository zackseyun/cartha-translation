  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa introduz o acontecimento seguinte. “Então” expressa com naturalidade a progressão, enquanto “veio” completa a construção idiomática com “a palavra de Yahweh”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na expressão profética דְבַר יְהוָה, “a palavra” preserva a fórmula tradicional e seu peso teológico sem explicitar interpretativamente “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלָיו
  choice: a ele
  rationale: Reproduz diretamente a preposição אֶל com o sufixo masculino singular, cujo referente é Elias no contexto.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o discurso direto que começa no versículo seguinte; “dizendo” mantém de modo transparente a estrutura hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo pelo título “SENHOR”; “Jeová” reflete uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A fórmula profética foi mantida próxima do hebraico; os dois-pontos indicam que o conteúdo da fala vem no versículo seguinte.
