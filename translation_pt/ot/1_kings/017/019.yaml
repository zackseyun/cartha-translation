base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: pt
  text: 'Ele lhe disse: “Dê-me o seu filho.” Então o tomou do colo dela[a], levou-o ao aposento de cima onde estava hospedado[b] e o deitou em sua própria cama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “junto ao peito dela” ou “do regaço dela”. O termo hebraico se refere à região do peito ou do colo e sugere que a mãe segurava o filho bem perto de si.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao quarto do andar de cima” ou “ao aposento sobre o terraço”. A expressão também pode ser entendida como “onde ele estava morando”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: Dê-me
  rationale: O imperativo de נתן com לִי expressa diretamente o pedido de que ela lhe entregue o menino; “Dê-me” é natural, conciso e não acrescenta aspereza.
- source_word: בְּנֵךְ
  choice: o seu filho
  rationale: בֵּן designa especificamente um filho do sexo masculino; a tradução preserva essa precisão.
- source_word: מֵחֵיקָהּ
  choice: do colo dela
  rationale: חֵיק abrange a região do colo, regaço ou peito. “Do colo dela” comunica com naturalidade a proximidade física e materna sem recorrer a linguagem arcaica.
- source_word: וַיַּעֲלֵהוּ
  choice: levou-o para cima
  rationale: A forma verbal indica movimento ascendente com o menino como objeto. A expressão preserva esse movimento sem especificar além do texto o modo exato de carregá-lo.
- source_word: הָעֲלִיָּה
  choice: o quarto
  rationale: עֲלִיָּה é um aposento superior, possivelmente no andar de cima ou sobre o terraço. Com “levou-o para cima”, “o quarto” resulta natural e evita repetição, enquanto a nota registra a alternativa arquitetônica.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: onde estava hospedado
  rationale: Embora ישב possa significar “sentar-se”, aqui indica permanência ou residência. “Estava hospedado” se ajusta à condição de Elias como hóspede na casa.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: o deitou
  rationale: O hifil de שׁכב significa fazer alguém ficar deitado; “o deitou” é direto e idiomático.
- source_word: עַל מִטָּתוֹ
  choice: na própria cama
  rationale: O sufixo possessivo remete naturalmente a Elias, sujeito da sequência verbal. “Na própria cama” esclarece o referente sem alterar o sentido.
