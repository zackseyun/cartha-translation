  text: וַ/יִּתְמֹדֵ֤ד עַל הַ/יֶּ֨לֶד֙ שָׁלֹ֣שׁ פְּעָמִ֔ים וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י תָּ֥שָׁב נָ֛א נֶֽפֶשׁ הַ/יֶּ֥לֶד הַ/זֶּ֖ה עַל קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: pt
  text: 'Então ele se estendeu sobre o menino três vezes e clamou a Yahweh, dizendo: “Yahweh, meu Deus, que a vida deste menino volte para ele, por favor”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh, meu Deus, que a alma deste menino volte para ele, por favor”. Em hebraico: “que a נֶפֶשׁ deste menino volte ao seu interior”.'
    reason: Alternativa lexical que preserva a amplitude de נֶפֶשׁ e a formulação concreta do hebraico.
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: se estendeu
  rationale: O verbo reflexivo raro descreve Elias estendendo o próprio corpo sobre o menino; a formulação é natural em português e preserva a ação física.
- source_word: עַל הַיֶּלֶד
  choice: sobre o menino
  rationale: A preposição indica a posição física de Elias em relação ao menino.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: três vezes
  rationale: Equivalente idiomático direto do numeral com o substantivo que indica ocorrências.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: clamou a Yahweh
  rationale: No contexto de oração urgente, קרא אל comunica uma invocação intensa; “clamou” expressa essa força sem exagerá-la.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, meu Deus
  rationale: Preserva tanto o nome divino quanto a relação pessoal expressa pelo possessivo, com pontuação vocativa natural.
- source_word: תָּשָׁב נָא
  choice: por favor, faze ... voltar
  rationale: O jussivo com נָא exprime uma súplica urgente e cortês. Em português, “por favor, faze ... voltar” comunica claramente o pedido para que Deus restaure a vida.
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Neste contexto, refere-se à vida que anima o menino. “Vida” evita impor uma antropologia técnica, enquanto “alma” permanece registrada na nota como alternativa lexical legítima.
- source_word: הַיֶּלֶד הַזֶּה
  choice: deste menino
  rationale: Mantém a referência concreta e masculina do hebraico; a contração com “de” resulta naturalmente da sintaxe portuguesa.
- source_word: עַל קִרְבּוֹ
  choice: para dentro dele
  rationale: Preserva mais da imagem hebraica, literalmente relacionada ao interior do menino, sem recorrer a linguagem anatômica artificial.
theological_decisions:
- issue: Tradução de נֶפֶשׁ no contexto de restauração à vida
  choice: vida
  alternative: alma
  rationale: “Vida” comunica melhor a função narrativa da expressão sem decidir uma questão de antropologia teológica. A nota preserva “alma” como tradução tradicional e lexicalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “Yahweh” para o nome divino e conserva na nota a ambiguidade entre “vida” e “alma”.
