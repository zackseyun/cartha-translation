  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: pt
  text: Então ele foi e fez conforme a palavra de Yahweh; foi e ficou junto ao ribeiro[a] de Querite, que fica em frente ao Jordão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto à torrente de Querite” ou “no vale de Querite”. O termo hebraico pode designar um ribeiro, um vale ou um curso de água sazonal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que está diante da face do Jordão”; também pode ser entendido como “defronte do Jordão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ele foi
  rationale: O wayyiqtol dá continuidade à narrativa e, neste contexto, apresenta a resposta de Elias à ordem anterior; “então” expressa essa sequência com naturalidade.
- source_word: וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: fez conforme a palavra de Yahweh
  rationale: Mantém a ideia formal de agir em obediência à palavra ou ordem que Yahweh havia dado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Foi e ficou
  rationale: Preserva a repetição verbal do hebraico e traduz יָשַׁב segundo o contexto de permanência temporária, sem sugerir necessariamente residência definitiva.
- source_word: בְּנַחַל
  choice: junto ao ribeiro
  rationale: נַחַל pode designar um ribeiro, vale ou curso de água sazonal. “Junto ao ribeiro” é claro e natural, enquanto a nota registra a amplitude do termo.
- source_word: כְּרִית
  choice: Querite
  rationale: Forma portuguesa tradicional e reconhecível do nome geográfico hebraico.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: que fica em frente ao Jordão
  rationale: Conserva a noção espacial de עַל־פְּנֵי sem introduzir a direção “a leste”, que não está explicitada no texto hebraico.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma portuguesa convencional do nome do rio; não é necessário acrescentar “rio” neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal sem substituí-lo por um título.
- issue: Sentido geográfico de עַל פְּנֵי הַיַּרְדֵּן
  choice: em frente ao Jordão
  alternative: a leste do Jordão; diante do Jordão; defronte do Jordão
  rationale: A expressão hebraica admite mais de uma relação espacial. A tradução conserva essa relativa indeterminação, evitando transformar uma inferência geográfica em informação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “foi” acompanha deliberadamente a progressão do hebraico. “Ribeiro” evita o tecnicismo estrangeiro “wadi”, enquanto a nota preserva a variedade geográfica de נַחַל.
