  text: וְ/הָ/עֹרְבִ֗ים מְבִיאִ֨ים ל֜/וֹ לֶ֤חֶם וּ/בָשָׂר֙ בַּ/בֹּ֔קֶר וְ/לֶ֥חֶם וּ/בָשָׂ֖ר בָּ/עָ֑רֶב וּ/מִן הַ/נַּ֖חַל יִשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: pt
  text: E os corvos lhe traziam pão e carne pela manhã, e pão e carne ao entardecer; e ele bebia do ribeiro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “torrente” ou “curso de água”. O hebraico נַחַל pode designar um curso de água sazonal, como um uádi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: E os corvos
  rationale: עֹרְבִים designa normalmente corvos; a tradução mantém o sentido lexical comum e preserva a conjunção narrativa.
- source_word: מְבִיאִים לוֹ
  choice: lhe traziam
  rationale: O particípio, neste contexto narrativo, indica ação contínua ou habitual; o pretérito imperfeito expressa isso naturalmente em português.
- source_word: לֶחֶם וּבָשָׂר
  choice: pão e carne
  rationale: Mantém os substantivos concretos do hebraico, sem ampliar לֶחֶם para o sentido genérico de alimento.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Expressão temporal corrente e fiel ao hebraico.
- source_word: וְלֶחֶם וּבָשָׂר בָּעָרֶב
  choice: e pão e carne ao entardecer
  rationale: Preserva a repetição enfática da provisão e traduz עֶרֶב como o período do entardecer, sem restringi-lo necessariamente à noite.
- source_word: וּמִן הַנַּחַל
  choice: do ribeiro
  rationale: נַחַל refere-se a um curso de água, muitas vezes sazonal. “Ribeiro” é natural e compreensível em português; a nota registra alternativas e a nuance geográfica.
- source_word: יִשְׁתֶּה
  choice: ele bebia
  rationale: O imperfeito hebraico expressa ação habitual no contexto; o pretérito imperfeito português comunica essa repetição com naturalidade.
theological_decisions:
- issue: Identidade dos עֹרְבִים que sustentavam Elias
  choice: corvos em sentido literal
  alternative: árabes, mercadores ou outros agentes humanos
  rationale: O sentido lexical ordinário de עֹרְבִים é “corvos”, e o contexto imediato não exige uma interpretação alternativa que elimine o caráter extraordinário do relato.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição do hebraico foi mantida, e os pretéritos imperfeitos comunicam o caráter habitual das ações.
