base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: pt
  text: A farinha no pote não se esgotou, e o azeite na botija não diminuiu, conforme a palavra de Yahweh que ele havia falado pela mão de Elias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “pela mão de Elias” significa “por meio de Elias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: a farinha do pote
  rationale: Expressa de modo natural em português o recipiente doméstico com sua farinha, preservando a ideia de que a provisão armazenada não se esgotou.
- source_word: לֹא כָלָתָה
  choice: não acabou
  rationale: כלה indica chegar ao fim ou ser consumido; “não acabou” é claro, corrente e adequado à provisão contínua.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: o azeite da botija
  rationale: צַפַּחַת designa uma vasilha pequena, apropriada para óleo. “Botija” distingue esse recipiente do pote de farinha, enquanto “azeite” é a designação doméstica mais natural neste contexto.
- source_word: לֹא חָסֵר
  choice: não faltou
  rationale: Preserva a distinção lexical em relação a כלה e comunica que o suprimento de azeite não se tornou insuficiente.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Mantém a relação explícita entre o acontecimento e a palavra previamente proferida por Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ele havia falado
  rationale: O mais-que-perfeito composto indica naturalmente que a palavra divina precedeu seu cumprimento contínuo.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: pela mão de Elias
  rationale: Preserva a fórmula hebraica de mediação profética; a nota esclarece seu sentido idiomático.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Fórmula de agência na mediação profética
  choice: que ele havia falado pela mão de Elias
  alternative: que ele havia falado por meio de Elias
  rationale: A formulação mantém Yahweh como autor da palavra e Elias como seu agente humano, sem explicitar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pote” e “botija” mantêm a cena doméstica e distinguem os dois recipientes; a expressão hebraica de mediação é preservada no texto e explicada em nota.
