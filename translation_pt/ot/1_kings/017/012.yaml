  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: pt
  text: 'Ela respondeu: “Tão certo como vive Yahweh, seu Deus, não tenho nenhum pão[a]; só tenho um punhado de farinha no pote e um pouco de azeite na jarra. Veja, estou juntando dois gravetos; vou entrar e prepará-lo para mim e para meu filho. Nós o comeremos e morreremos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhum pãozinho” ou “nenhum pão assado”. O termo hebraico מָעוֹג se refere a um pequeno pão, provavelmente redondo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Tão certo como vive Yahweh, seu Deus
  rationale: Preserva a fórmula solene de juramento e o nome divino, em português natural.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: não tenho nenhum pão
  rationale: Neste contexto de juramento, אִם expressa negação enfática; מָעוֹג designa especificamente um pequeno pão ou bolo de pão, distinção registrada em nota.
- source_word: מְלֹא כַף קֶמַח
  choice: um punhado de farinha
  rationale: Equivalente idiomático da medida literal, que ressalta a quantidade mínima.
- source_word: כַּד
  choice: pote
  rationale: Recipiente doméstico em que se guardava a farinha; a escolha também o distingue do recipiente de azeite.
- source_word: צַפַּחַת
  choice: jarra
  rationale: Recipiente pequeno apropriado para líquidos, aqui o azeite.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת
  choice: Veja, estou juntando
  rationale: Conserva a partícula que chama a atenção e o aspecto de ação em andamento do particípio.
- source_word: שְׁנַיִם עֵצִים
  choice: dois gravetos
  rationale: Comunica pequenos pedaços de lenha e reforça a extrema escassez retratada.
- source_word: וּבָאתִי
  choice: para levar para casa
  rationale: No contexto, o verbo de movimento indica sua entrada ou retorno ao lugar onde preparará a comida.
- source_word: וַעֲשִׂיתִיהוּ
  choice: preparar algo
  rationale: O pronome masculino singular retoma de forma não inteiramente explícita o alimento feito com farinha e azeite; a formulação portuguesa evita uma referência artificialmente precisa.
theological_decisions:
- issue: Representação do nome divino יהוה na fórmula de juramento
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. A transliteração preserva essa função sem substituí-lo por um título.
- issue: Força da declaração final וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: Então comeremos e morreremos
  alternative: para que comamos e morramos
  rationale: A formulação conserva a expectativa sombria da viúva sem sugerir que morrer seja a finalidade deliberada do preparo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Seu Deus” acompanha o tratamento comum no português do Brasil; “gravetos” comunica melhor a pequena quantidade de combustível. A sequência final foi dividida para soar natural sem perder o caráter abrupto e trágico do hebraico.
