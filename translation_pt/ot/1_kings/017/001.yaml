  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: pt
  text: 'E Elias, o tisbita[a], um dos moradores de Gileade, disse a Acabe: “Tão certo como vive Yahweh, o Deus de Israel, diante de quem estou, não haverá orvalho nem chuva nestes anos, a não ser segundo a minha palavra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Elias, o homem de Tisbe”. A forma hebraica é um gentílico, mas a localização de Tisbe é incerta; a expressão seguinte também pode ser traduzida por “dentre os residentes de Gileade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conforme a minha palavra” ou “quando eu der a palavra”. No hebraico, a expressão é literalmente “segundo a boca da minha palavra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: o tisbita
  rationale: Preserva o gentílico ou título ligado à origem de Elias, sem substituir a forma hebraica por uma localização incerta como “homem de Tisbe”.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: um dos moradores de Gileade
  rationale: תּוֹשָׁב pode indicar morador ou residente; esta formulação natural preserva a construção partitiva introduzida por מִן.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Expressa em português corrente a força solene da fórmula hebraica de juramento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção hebraica e sua relevância pactual no contexto.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: diante de quem estou
  rationale: Mantém a imagem concreta de estar na presença de Deus, sem reduzir implicitamente a expressão a “a quem sirvo”.
- source_word: אִם יִהְיֶה
  choice: não haverá
  rationale: No contexto da fórmula de juramento, אִם introduz uma negação enfática; torná-la explícita comunica corretamente o sentido em português.
- source_word: טַל וּמָטָר
  choice: orvalho nem chuva
  rationale: Distingue os dois fenômenos e usa a coordenação negativa natural em português.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: nestes anos
  rationale: Representa de forma concisa a referência temporal demonstrativa do hebraico.
- source_word: כִּי אִם
  choice: a não ser
  rationale: Marca naturalmente a exceção à declaração negativa.
- source_word: לְפִי דְבָרִי
  choice: segundo a minha palavra
  rationale: Preserva mais diretamente a ideia de conformidade ou condição expressa pela locução hebraica, sem explicar além do texto a natureza da autoridade profética.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pactual, não apenas um título. “Yahweh” o representa de maneira explícita e evita inserir uma substituição tradicional no corpo do versículo.
- issue: Força da palavra profética em לְפִי דְבָרִי
  choice: a não ser segundo a minha palavra
  alternative: a não ser por minha palavra; a não ser quando eu ordenar
  rationale: A opção escolhida preserva a relação entre a ocorrência de chuva ou orvalho e a palavra de Elias, sem decidir se a expressão enfatiza instrumento, autorização ou ocasião.
- issue: Sentido de estar diante de Deus
  choice: diante de quem estou
  alternative: a quem sirvo
  rationale: A tradução mantém a imagem e sua possível implicação de serviço, sem transformar essa implicação em significado exclusivo.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A fórmula de juramento foi vertida idiomaticamente, enquanto as imagens hebraicas teologicamente relevantes foram preservadas.
