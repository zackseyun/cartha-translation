base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: pt
  text: 'Então ele se levantou e foi a Sarepta. Ao chegar à entrada da cidade[a], eis que havia ali uma viúva recolhendo gravetos. Ele a chamou e disse: “Por favor, traga-me um pouco de água num recipiente, para que eu beba.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à abertura da cidade”. O hebraico usa פֶּתַח, termo que significa “entrada” ou “abertura” e é menos específico que a palavra usual para “portão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: ele se levantou e foi
  rationale: Preserva a sequência narrativa dos dois verbos hebraicos e soa natural em português, sem fundi-los simplesmente em “partiu”.
- source_word: צָרְפַתָה
  choice: a Sarepta
  rationale: O hê direcional indica movimento para o lugar; “a Sarepta” o expressa de modo idiomático. Sarepta é a forma tradicional e amplamente reconhecida em português.
- source_word: וַיָּבֹא אֶל פֶּתַח הָעִיר
  choice: Ao chegar à entrada da cidade
  rationale: פֶּתַח significa propriamente abertura ou entrada, sendo menos específico que o termo hebraico usual para portão. A construção temporal torna a sequência natural em português.
- source_word: וְהִנֵּה
  choice: viu ali
  rationale: No contexto narrativo, הִנֵּה chama a atenção para o que Elias encontra. “Viu ali” comunica essa descoberta vívida em português atual, evitando o arcaísmo de “eis que”.
- source_word: אִשָּׁה אַלְמָנָה
  choice: uma viúva
  rationale: A expressão literalmente appositiva, “uma mulher, uma viúva”, é expressa de modo idiomático e completo por “uma viúva”.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: recolhendo gravetos
  rationale: קשׁשׁ descreve juntar pequenos pedaços de material combustível; “gravetos” evita sugerir madeira de grande porte.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: Ele a chamou
  rationale: קרא אֶל indica chamar ou dirigir a voz a alguém. “Ele a chamou” é claro e natural no contexto.
- source_word: קְחִי נָא
  choice: Por favor, traga-me
  rationale: Embora לקח signifique literalmente “tomar/pegar”, numa solicitação para obter algo para o falante, “trazer” é o equivalente idiomático. נָא acrescenta cortesia, expressa por “por favor”.
- source_word: מְעַט מַיִם
  choice: um pouco de água
  rationale: Reproduz diretamente a pequena quantidade indicada por מְעַט.
- source_word: בַּכְּלִי
  choice: num recipiente
  rationale: כְּלִי é um termo genérico para utensílio ou recipiente. A tradução mantém essa generalidade sem especificar indevidamente jarro, cântaro ou vaso.
- source_word: וְאֶשְׁתֶּה
  choice: para que eu beba
  rationale: O cohortativo expressa o propósito desejado da solicitação; a oração final preserva esse valor.
