base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: pt
  text: Mas, se vocês e seus filhos se desviarem de me seguir, não guardarem os meus mandamentos e os meus estatutos que coloquei diante de vocês, e forem servir a outros deuses e se curvarem diante deles,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: se
  rationale: Introduz diretamente a condição; «mas» expressa a contraposição discursiva com a promessa anterior.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: deixarem de me seguir
  rationale: A construção intensiva, juntamente com מֵאַחֲרַי, indica afastamento enfático do seguimento do SENHOR; a formulação é natural e preserva o sentido de apostasia.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: vocês ou seus filhos
  rationale: No contexto régio, refere-se a Salomão e à sua descendência dinástica. «Ou» explicita a aplicação condicional a qualquer uma das gerações, enquanto a nota registra a coordenação hebraica literal.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: não guardarem
  rationale: No uso pactual, שׁמר significa guardar ou observar mandamentos; «guardar» conserva o registro bíblico sem deixar de ser compreensível.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: os meus mandamentos e os meus estatutos
  rationale: Mantém distintos os dois termos jurídicos e pactuais do hebraico.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: que coloquei diante de vocês
  rationale: נתן com לִפְנֵי tem o sentido idiomático de pôr ou colocar algo diante de alguém.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: e forem servir a outros deuses
  rationale: «Forem servir» traduz naturalmente a sequência verbal sem converter עבד em simples culto e mantém a distinção em relação ao ato seguinte de prostração.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: e se curvarem diante deles
  rationale: Preserva a imagem concreta de inclinar-se ou prostrar-se em reverência, distinta de «servir».
theological_decisions:
- issue: Alcance dinástico da advertência
  choice: 'A advertência se dirige a Salomão e aos filhos de sua linhagem real: «vocês ou seus filhos».'
  alternative: Traduzir literalmente «vocês e seus filhos», ou entender a referência de forma mais ampla como dirigida ao povo e a seus descendentes.
  rationale: O contexto imediato é a resposta do SENHOR a Salomão acerca da casa davídica e do templo. A tradução principal explicita a força distributiva possível da condição, sem ocultar na nota que o hebraico emprega a conjunção «e».
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário pactual reconhecível. A frase permanece aberta ao versículo seguinte, como no texto-fonte.
