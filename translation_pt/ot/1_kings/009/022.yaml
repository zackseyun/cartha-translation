  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no slaves[a], for they were the men of war, his slaves, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: pt
  text: Mas, dentre os filhos de Israel, Salomão não fez escravo algum, pois eles eram homens de guerra, seus servos, seus comandantes, seus oficiais[a], os comandantes dos seus carros de guerra e seus cavaleiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus ajudantes de campo”. O termo hebraico provavelmente designa uma categoria específica de auxiliares militares de alta patente, talvez ligada aos carros de guerra.
    reason: Alternativa lexical para um título militar cujo referente histórico exato é incerto.
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: Mas, dentre os filhos de Israel
  rationale: Preserva a expressão hebraica e explicita o contraste com os povos não israelitas submetidos ao trabalho forçado no versículo anterior. “Dentre” comunica naturalmente a ideia partitiva de מִן.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: Salomão não fez escravo algum
  rationale: O hebraico emprega עָבֶד no singular coletivo numa construção que indica colocar alguém na condição de escravo. A formulação evita suavizar essa condição como mera prestação de serviço.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Reproduz de modo direto a expressão militar masculina do hebraico, sem generalizá-la nem torná-la mais técnica que o original.
- source_word: וַעֲבָדָיו
  choice: seus servos
  rationale: No contexto da corte real, עֲבָדִים pode designar servidores ou oficiais do rei. “Servos” conserva a amplitude do termo e a ligação lexical com עָבֶד, sem impor aqui a condição de escravidão afirmada na oração anterior.
- source_word: וְשָׂרָיו
  choice: seus comandantes
  rationale: שָׂרִים designa chefes ou autoridades; nesta enumeração de funções militares e régias, “comandantes” se ajusta ao contexto.
- source_word: וְשָׁלִשָׁיו
  choice: seus oficiais
  rationale: O referente histórico exato de שָׁלִישׁ é incerto, embora provavelmente indique um auxiliar militar de alta patente, por vezes associado aos carros. “Oficiais” mantém a tradução clara sem fingir uma precisão inexistente.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: os comandantes dos seus carros de guerra
  rationale: Expressa os chefes da força de carros de Salomão; “de guerra” esclarece em português moderno o sentido militar de רֶכֶב neste contexto.
- source_word: וּפָרָשָׁיו
  choice: seus cavaleiros
  rationale: Tradução direta e corrente para as tropas montadas mencionadas pelo hebraico.
theological_decisions:
- issue: Condição social expressa por עָבֶד na primeira oração
  choice: escravo
  alternative: servo ou trabalhador forçado
  rationale: O contexto imediato contrasta os israelitas com populações submetidas ao trabalho compulsório. “Escravo” conserva a dureza da condição expressa, sem reduzi-la a serviço voluntário.
- issue: Sentido de עֲבָדָיו na lista de funções israelitas
  choice: seus servos
  alternative: seus escravos ou seus oficiais
  rationale: A mesma raiz possui amplitude semântica e, com sufixo possessivo em ambiente régio, pode indicar servidores do rei. Traduzir mecanicamente como “escravos” criaria tensão com a afirmação de que Salomão não fez escravos dentre Israel; “oficiais” seria específico demais, sobretudo porque categorias mais precisas vêm em seguida.
- issue: Designação masculina em אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  alternative: guerreiros ou combatentes
  rationale: A expressão hebraica é explicitamente masculina e descreve funções militares e régias no Israel antigo; a tradução preserva essa forma sem neutralização.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da enumeração hebraica foi preservada. Empregou-se “carros de guerra” em vez de apenas “carros” para evitar ambiguidade no português atual.
