base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: pt
  text: Seus filhos, que permaneceram na terra depois deles e a quem os israelitas não conseguiram consagrar à destruição[a], Salomão os submeteu a trabalhos forçados, até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “consagrar à destruição”; também pode ser traduzido por “colocar sob anátema” ou “destruir completamente”. O verbo se refere a colocar pessoas ou coisas sob חרם (ḥerem), uma dedicação irrevogável ao juízo.'
    reason: alternativa lexical
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: seus filhos
  rationale: Mantém o sentido filial do hebraico, que neste contexto também pode abranger os descendentes da geração anterior.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: ficaram depois deles
  rationale: Reproduz tanto a ideia de remanescentes quanto a relação temporal com a geração anterior, sem explicitar além do texto que eles sobreviveram a ela.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: É a expressão corrente para a terra de Canaã/Israel neste contexto histórico.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: não tinham conseguido consagrar à destruição
  rationale: Preserva simultaneamente as noções de dedicação irrevogável e destruição ligadas a חרם, em vez de reduzir o verbo a simples extermínio.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Equivalente português natural e claro para a expressão hebraica, sem alteração do referente.
- source_word: וַיַּעֲלֵם
  choice: Salomão os recrutou
  rationale: No contexto de לְמַס, o hifil expressa a imposição administrativa do serviço; “recrutou” comunica essa ação de modo idiomático.
- source_word: לְמַס עֹבֵד
  choice: para trabalhos forçados
  rationale: Expressa com clareza a prestação compulsória de trabalho, sem pressupor uma condição jurídica específica de escravidão.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Conserva a fórmula temporal hebraica de modo corrente e digno em português.
theological_decisions:
- issue: Tradução de החרים no contexto de conquista e juízo
  choice: consagrar à destruição
  alternative: destruir completamente; colocar sob anátema
  rationale: A escolha mantém a tensão entre dedicação irrevogável e destruição judicial presente no termo hebraico, sem convertê-lo em mero ato militar nem recorrer no texto principal a jargão pouco transparente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção acompanha a sequência do hebraico, enquanto “israelitas” e “trabalhos forçados” evitam rigidez desnecessária. O marcador da nota foi colocado junto à expressão que ela explica.
