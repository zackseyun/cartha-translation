  text: וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: pt
  text: também todas as cidades de armazenamento[a] que pertenciam a Salomão, as cidades dos carros de guerra, as cidades dos cavaleiros[b] e tudo o que Salomão desejou construir[c] em Jerusalém, no Líbano e em toda a terra sob o seu domínio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidades-armazém” ou “cidades de provisões”. O hebraico se refere a cidades destinadas ao armazenamento de bens ou provisões.
    reason: lexical_alternative
  - marker: b
    text: Ou “cidades da cavalaria”. O termo hebraico se refere mais especificamente a cavaleiros do que a cavalos em geral.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “o desejo de Salomão que ele desejou construir”, uma expressão enfática em hebraico para aquilo que Salomão desejava intensamente construir.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: cidades de armazenamento
  rationale: Expressa de modo claro que eram cidades destinadas a armazenar provisões ou outros bens, preservando o caráter administrativo da expressão hebraica.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: que pertenciam a Salomão
  rationale: A construção com לְ pode indicar posse ou atribuição; esta formulação natural preserva o sentido possessivo sem excluir a ideia de cidades destinadas ao serviço real.
- source_word: עָרֵי הָרֶכֶב
  choice: as cidades dos carros de guerra
  rationale: רֶכֶב designa aqui carros, no contexto das forças militares. A especificação 'de guerra' evita a leitura moderna de veículos comuns.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: as cidades dos cavaleiros
  rationale: פָּרָשִׁים refere-se mais propriamente a cavaleiros ou tropas montadas, e não simplesmente a cavalos.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: tudo o que Salomão desejou
  rationale: A expressão hebraica combina substantivo e verbo cognatos para dar ênfase. Esta tradução comunica de modo natural tanto a abrangência quanto a intensidade, explicitada em nota.
- source_word: לִבְנוֹת
  choice: construir
  rationale: Equivalente corrente e direto de בנה no contexto dos projetos reais.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: em Jerusalém, no Líbano
  rationale: Mantém o valor locativo das preposições e entende Líbano como o lugar ou região da atividade construtiva.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: em toda a terra sob o seu domínio
  rationale: Conserva o aspecto territorial de אֶרֶץ e a noção de governo ou domínio de מֶמְשָׁלָה em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Carros de guerra” esclarece o referente militar; “terra sob o seu domínio” evita a rigidez de “terra do seu domínio”. Os marcadores foram posicionados junto às expressões que explicam.
