source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: pt
  text: 'E Yahweh lhe disse: “Ouvi a sua oração e a sua súplica[a], com que você implorou diante de mim. Consagrei esta casa[b], que você construiu, para pôr ali o meu nome para sempre. Meus olhos e meu coração estarão ali todos os dias[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedido de favor” ou “apelo”; o termo hebraico indica uma súplica humilde por favor.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “esta casa”; isto é, o templo que Salomão construiu.'
    reason: cultural_note
  - marker: c
    text: “Meus olhos e meu coração estarão ali” é uma expressão antropomórfica da atenção e do cuidado contínuos de Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal conforme a forma adotada pelo projeto, sem substituí-lo por um título.
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito hebraico indica a ação concluída, relevante para a resposta divina; o pretérito perfeito é natural em português.
- source_word: תְּפִלָּתְךָ
  choice: a sua oração
  rationale: Equivalente corrente e claro para a oração de petição neste contexto.
- source_word: תְּחִנָּתְךָ
  choice: a sua súplica
  rationale: Distingue o termo de “oração” e conserva a ideia de um apelo humilde por favor.
- source_word: אֲשֶׁר הִתְחַנַּנְתָּה
  choice: que você apresentou
  rationale: Produz uma construção natural com “súplica”, enquanto a força de pedido insistente permanece no substantivo.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Reproduz naturalmente o idioma espacial e relacional do hebraico.
- source_word: הִקְדַּשְׁתִּי
  choice: Consagrei
  rationale: Expressa que a casa foi separada como santa para uso divino, mantendo a força cultual do verbo.
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: Mantém o termo concreto do hebraico e sua ressonância teológica, embora a referência seja ao templo construído por Salomão.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: para pôr ali o meu nome
  rationale: Preserva a fórmula pactual ligada ao templo sem transformá-la em uma explicação doutrinária.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português natural para a expressão hebraica de permanência duradoura.
- source_word: עֵינַי וְלִבִּי
  choice: Meus olhos e meu coração
  rationale: Conserva a imagem antropomórfica deliberada, em vez de reduzi-la abstratamente a atenção e cuidado.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Mantém a expressão concreta do hebraico, com formulação idiomática em português.
theological_decisions:
- issue: Linguagem antropomórfica em “meus olhos e meu coração estarão ali”
  choice: Manter literalmente a imagem dos olhos e do coração de Deus
  alternative: Parafrasear como “minha atenção e meu cuidado estarão ali”
  rationale: A linguagem corpórea comunica a atenção e o interesse pactual contínuos de Yahweh. Preservá-la mantém a textura e a tensão teológica do texto sem impor uma limitação física a Deus.
- issue: Sentido de “pôr ali o meu nome para sempre”
  choice: Preservar a fórmula do nome divino ligada ao templo
  alternative: Expandir como “habitar ali para sempre” ou “ser adorado ali para sempre”
  rationale: O hebraico fala especificamente de Deus pôr ali o seu nome. Uma paráfrase doutrinária resolveria indevidamente uma fórmula que o próprio texto deixa carregada de significado pactual.
translation_notes:
  register: Português moderno, digno e acessível, com construções naturais ao leitor brasileiro e amplamente compreensíveis no espaço lusófono. O tratamento por “você/sua” evita formas verbais arcaizantes; “Yahweh” preserva o nome divino. As imagens e fórmulas teológicas do hebraico foram mantidas sem expansão interpretativa.
