  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הָ/אֱמֹרִ֜י הַ/חִתִּ֤י הַ/פְּרִזִּי֙ הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: pt
  text: Todo o povo que restou dos amorreus, dos hititas, dos perizeus, dos heveus e dos jebuseus, que não eram dos filhos de Israel —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעָם
  choice: Todo o povo
  rationale: A construção totalizante com כָּל antes do substantivo definido é expressa naturalmente por “todo o povo”, mantendo o sentido coletivo.
- source_word: הַנּוֹתָר
  choice: que restou
  rationale: O particípio nifal de יתר indica o grupo remanescente; a oração relativa é clara e natural em português.
- source_word: מִן הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: dos amorreus, dos hititas, dos perizeus, dos heveus e dos jebuseus
  rationale: מִן indica aqui procedência ou pertencimento ao remanescente das etnias enumeradas. Foram usadas as formas portuguesas bíblicas amplamente reconhecidas dos gentílicos.
- source_word: אֲשֶׁר
  choice: os quais
  rationale: O relativo retoma o povo remanescente; “os quais” evita uma ligação momentaneamente ambígua com apenas o último gentílico.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל
  choice: não pertenciam aos filhos de Israel
  rationale: A formulação preserva explicitamente בְּנֵי יִשְׂרָאֵל como “filhos de Israel”, enquanto “pertenciam a” comunica de modo natural a ideia de não serem dentre esse grupo.
- source_word: הֵמָּה
  choice: —
  rationale: O pronome independente confere ênfase ao sujeito, mas uma reprodução explícita ao final seria artificial em português. O travessão conserva a continuidade sintática com o versículo seguinte.
theological_decisions:
- issue: Expressão identitária בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: “Filhos de Israel” mantém transparente a forma masculina e genealógica do hebraico; “israelitas” seria mais compacto, mas reduziria essa correspondência formal.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas étnicas tradicionais e correntes. O versículo termina com travessão porque a frase prossegue no versículo 21.
