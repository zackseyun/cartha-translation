base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: pt
  text: Então Yahweh apareceu a Salomão pela segunda vez[a], assim como lhe havia aparecido em Gibeão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “novamente”; literalmente, “uma segunda vez”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה indica aqui uma manifestação perceptível; “apareceu” é natural em português e mantém o paralelo com נִרְאָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Preserva explicitamente a ideia de sequência e soa natural em português.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Expressa com clareza a comparação com a manifestação anterior.
- source_word: נִרְאָה
  choice: havia aparecido
  rationale: O mais-que-perfeito composto situa a aparição em Gibeão antes da aparição narrada na oração principal.
- source_word: אֵלָיו
  choice: lhe
  rationale: O pronome dativo português traduz de modo conciso e natural a relação indicada por אֶל com sufixo.
- source_word: בְּגִבְעוֹן
  choice: em Gibeão
  rationale: A preposição “em” é a forma idiomática em português para indicar o local dessa aparição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem o substituir por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem e o paralelismo do hebraico foram preservados sem tornar a frase artificial.
