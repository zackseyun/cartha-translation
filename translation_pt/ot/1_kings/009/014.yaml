  text: E Hirão enviou ao rei cento e vinte talentos de ouro[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O talento era uma grande unidade de peso; a expressão se refere a cento e vinte talentos de ouro.
