lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O imperfeito com waw consecutivo faz a narrativa avançar e, neste contexto, corresponde naturalmente ao pretérito perfeito em português.
- source_word: חִירָם
  choice: Hirão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לַמֶּלֶךְ
  choice: ao rei
  rationale: Reproduz o hebraico com artigo definido, sem inserir no texto principal o nome de Salomão, embora ele seja o referente contextual.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: cento e vinte
  rationale: Equivalente cardinal direto e natural em português moderno.
- source_word: כִּכַּר
  choice: talentos
  rationale: Termo convencional para a antiga unidade de peso; o plural é exigido pelo numeral.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do substantivo hebraico, que especifica o material pesado.
