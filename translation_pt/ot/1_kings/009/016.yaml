base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: pt
  text: O faraó, rei do Egito, havia subido, tomado Gezer e a incendiado. Matou os cananeus que moravam na cidade e a deu como presente de casamento[a] à sua filha, esposa de Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como dote”. O termo hebraico designa um presente ligado ao casamento; sua nuance social exata pode abranger o que hoje se chama de dote.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: havia subido
  rationale: O mais-que-perfeito situa a ação como antecedente explicativo no contexto, enquanto “subido” preserva o modo hebraico de descrever o deslocamento militar.
- source_word: וַיִּלְכֹּד
  choice: tomado
  rationale: “Tomar” expressa com naturalidade a conquista militar de uma cidade e mantém a concisão do hebraico.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: a queimado pelo fogo
  rationale: Conserva a menção explícita ao fogo e o pronome feminino que retoma a cidade de Gezer.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora a forma hebraica seja singular, ela tem sentido coletivo neste contexto; o plural comunica isso naturalmente em português.
- source_word: הַיֹּשֵׁב בָּעִיר
  choice: que moravam na cidade
  rationale: Tradução corrente da expressão participial que identifica os habitantes cananeus de Gezer.
- source_word: הָרָג
  choice: matou
  rationale: Equivalente direto, claro e não eufemístico do verbo hebraico.
- source_word: וַיִּתְּנָהּ
  choice: a deu
  rationale: O pronome feminino retoma Gezer, entendida como cidade, sem repetição desnecessária do nome.
- source_word: שִׁלֻּחִים
  choice: como presente de casamento
  rationale: Expressa de maneira acessível a dádiva ligada ao casamento sem fixar como única a nuance técnica de “dote”; a alternativa é registrada em nota.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: à sua filha, mulher de Salomão
  rationale: Preserva a aposição que identifica a filha do faraó como esposa de Salomão, em linguagem digna e clara.
