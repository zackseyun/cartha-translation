  naturalness: O português é claro e de registro apropriado. «Porque abandonaram...» é uma resposta plenamente natural ao հարցamento implícito do versículo anterior e é mais conciso. «Antepassados» evita a leitura portuguesa comum de «pais» como os progenitores imediatos, sem alterar o referente histórico.
  terminology: «Yahweh», «outros deuses», «serviram-nos» e «calamidade» são escolhas adequadas. A nota sobre calamidade explica corretamente que רָעָה neste contexto não designa mal moral.
