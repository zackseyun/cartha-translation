source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: pt
  text: 'E dirão: “Porque abandonaram Yahweh, seu Deus, que tirou seus antepassados[a] da terra do Egito, apegaram-se a outros deuses, inclinaram-se diante deles e serviram-nos, por isso Yahweh trouxe sobre eles toda esta calamidade[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seus pais”; aqui, seus antepassados.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido como “desgraça” ou, literalmente, “mal”; aqui se refere à calamidade trazida como juízo, não ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: E dirão
  rationale: No contexto da pergunta do versículo anterior, a forma introduz a resposta futura dos observadores; a tradução mantém a ligação discursiva e o valor prospectivo.
- source_word: עַל אֲשֶׁר
  choice: Isso aconteceu porque
  rationale: A expressão hebraica introduz a causa do juízo. A explicitação de “Isso aconteceu” produz uma resposta natural em português sem acrescentar conteúdo substantivo.
- source_word: עָזְבוּ
  choice: abandonaram
  rationale: Expressa claramente a deserção deliberada e pactual, sem recorrer ao arcaísmo “desampararam”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, refere-se aqui ao Deus de Israel e exige sentido singular.
- source_word: הוֹצִיא אֶת אֲבֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: tirou seus pais da terra do Egito
  rationale: Preserva de perto a fórmula do êxodo. “Pais” reproduz o termo masculino hebraico, com alternativa semântica indicada em nota.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: se apegaram a outros deuses
  rationale: חזק com ב descreve agarrar-se ou manter forte ligação; “apegaram-se” comunica em português natural a adesão deliberada a outros deuses.
- source_word: וישתחו לָהֶם
  choice: inclinaram-se diante deles
  rationale: Mantém o gesto concreto de prostração ou reverência, sem fundi-lo semanticamente com o verbo seguinte.
- source_word: וַיַּעַבְדֻם
  choice: os serviram
  rationale: Conserva a distinção lexical entre inclinar-se e prestar serviço religioso, preservando a progressão dos atos idolátricos.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca de modo claro e idiomático a consequência da apostasia.
- source_word: הֵבִיא יְהוָה עֲלֵיהֶם אֵת כָּל הָרָעָה הַזֹּאת
  choice: Yahweh trouxe sobre eles toda esta calamidade
  rationale: Neste contexto, רָעָה designa desgraça ou calamidade judicial, não maldade moral; “calamidade” preserva esse sentido e o tom solene.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de רָעָה no juízo divino
  choice: calamidade
  alternative: mal; desgraça
  rationale: O contexto fala do desastre imposto em juízo, não de mal moral praticado por Deus. A escolha mantém essa distinção sem atenuar a causalidade teológica expressa no hebraico.
- issue: Termo ancestral אֲבֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução principal retém a forma masculina concreta do hebraico; a nota registra o sentido coletivo possível de antepassados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das ações idolátricas foi preservada, assim como a relação explícita entre abandono, apego, reverência, serviço e juízo.
