source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: pt
  text: então tirarei Israel da terra que lhes dei; e a casa que consagrei ao meu nome[a], eu a lançarei para longe da minha presença[b]. Israel se tornará motivo de provérbio e de zombaria[c] entre todos os povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ao meu nome” é uma expressão hebraica para aquilo que foi dedicado a levar e honrar o nome de Deus.
    reason: cultural_note
  - marker: b
    text: 'Ou: “eu a mandarei para longe da minha presença”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um provérbio e um dito de desprezo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: O hifil de כרת expressa cortar, excluir ou eliminar. “Eliminarei ... da face da terra” comunica afastamento severo sem afirmar necessariamente aniquilação total.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face da terra
  rationale: Preserva a imagem hebraica; no contexto, “terra” é o território dado a Israel, não o planeta inteiro.
- source_word: הַבַּיִת
  choice: a casa
  rationale: Mantém o termo concreto do hebraico e o motivo teológico da casa dedicada ao nome de Deus; trata-se do templo.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: consagrei ao meu nome
  rationale: “Consagrar” expressa separar como santo, enquanto “ao meu nome” conserva o importante idioma de Reis.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: eu a expulsarei da minha presença
  rationale: שלח pode significar mandar embora ou expulsar. Com a expressão ligada à face divina, a formulação transmite rejeição e afastamento da presença de Deus de modo natural em português.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: motivo de provérbio e de zombaria
  rationale: A construção explicita naturalmente que Israel será tema de ditos proverbiais e de fala zombeteira, preservando a distinção entre os dois substantivos.
- source_word: בְּכָל הָעַמִּים
  choice: entre todos os povos
  rationale: “Povos” representa adequadamente o plural étnico e evita a associação exclusiva com Estados modernos.
theological_decisions:
- issue: Linguagem de juízo da aliança sem pressupor aniquilação
  choice: eliminarei Israel da face da terra
  alternative: destruirei Israel; arrancarei Israel da terra
  rationale: A ameaça envolve exclusão da terra e juízo severo. A opção escolhida não transforma a linguagem em uma afirmação inequívoca de extermínio total.
- issue: Identificação de הַבַּיִת
  choice: a casa
  alternative: o templo
  rationale: O texto-fonte diz literalmente “a casa”. A referência ao templo permanece clara pelo contexto, sem apagar o motivo da casa consagrada ao nome divino.
- issue: Idioma do nome divino
  choice: consagrei ao meu nome
  alternative: consagrei para levar e honrar o meu nome
  rationale: A expressão hebraica é mantida no texto, e seu sentido cultural é esclarecido em nota sem impor uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Conserva as imagens da “face da terra”, da “casa” e do “nome”, mas traduz מֵעַל פָּנָי pela expressão portuguesa mais idiomática “da minha presença”.
