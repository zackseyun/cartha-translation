base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: pt
  text: Assim, Hirão saiu de Tiro para ver as cidades que Salomão lhe havia dado, mas elas não lhe agradaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não foram retas aos seus olhos”, expressão hebraica que significa que não lhe pareceram boas ou aceitáveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא, na sequência narrativa, indica sair ou partir; “saiu de Tiro” conserva de modo natural a direção marcada no hebraico.
- source_word: מִצֹּר
  choice: de Tiro
  rationale: A preposição מן marca a origem do deslocamento; “de Tiro” é a formulação portuguesa natural.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: ראה tem o sentido amplo de “ver”. Embora o contexto possa sugerir inspeção ou avaliação, “ver” evita acrescentar uma nuance não explicitada.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עיר pode designar cidade ou povoação; “cidades” é adequado ao contexto territorial e preserva a formulação tradicional sem arcaísmo.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: que Salomão lhe havia dado
  rationale: O mais-que-perfeito composto deixa clara, em português corrente, a anterioridade da entrega das cidades em relação à visita de Hirão.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: mas elas não lhe agradaram
  rationale: A expressão idiomática significa que as cidades não foram aceitáveis ou agradáveis ao julgamento de Hirão. A tradução natural comunica o sentido, enquanto a nota registra a forma concreta do hebraico.
theological_decisions: []
