source:
  edition: WLC
  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: pt
  text: Este é o relato do trabalho forçado[a] que o rei Salomão impôs para construir a casa de Yahweh, seu próprio palácio, o Milo[b], a muralha de Jerusalém, Hazor, Megido e Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “serviço compulsório” ou “corveia”; refere-se a mão de obra obrigatória requisitada pelo Estado, não a um imposto em dinheiro.
    reason: lexical_alternative
  - marker: b
    text: O Milo provavelmente era uma estrutura conhecida de Jerusalém, talvez uma fortificação, um aterro ou um conjunto de terraços; a identificação exata do termo hebraico é incerta.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: relato
  rationale: Na expressão זֶה דְבַר הַמַּס, introduz uma explicação ou registro a respeito da mobilização de trabalhadores. “Relato” é claro e natural, sem reduzir o termo a uma mera declaração.
- source_word: הַמַּס
  choice: trabalho forçado
  rationale: Neste contexto, מַס designa trabalho compulsório requisitado pelo poder real, não um imposto em dinheiro. “Trabalho forçado” comunica isso de modo direto ao leitor comum.
- source_word: הֶעֱלָה
  choice: mobilizou
  rationale: O hifil de עלה, associado a מַס, indica levantar ou impor uma mobilização de mão de obra. “Mobilizou” preserva o sentido administrativo e combina naturalmente com “trabalho forçado” em português.
- source_word: לִבְנוֹת
  choice: para construir
  rationale: O infinitivo expressa a finalidade da mobilização.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a imagem hebraica de “casa” e translitera o nome divino יְהוָה, em vez de substituí-lo por um título.
- source_word: בֵּיתוֹ
  choice: seu próprio palácio
  rationale: A expressão significa literalmente “sua casa”, mas aqui se refere à residência ou ao complexo real de Salomão. “Seu próprio palácio” torna claro o contraste com a casa de Yahweh sem perder o referente contextual.
- source_word: הַמִּלּוֹא
  choice: o Milo
  rationale: Trata-se de um termo topográfico ou arquitetônico específico de Jerusalém cuja identificação exata é incerta. A transliteração evita escolher indevidamente entre “aterro”, “terraços” ou uma fortificação.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: a muralha de Jerusalém
  rationale: Tradução direta e idiomática da construção hebraica.
- source_word: חָצֹר
  choice: Hazor
  rationale: Transliteração portuguesa reconhecível do topônimo.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Forma portuguesa corrente do topônimo.
- source_word: גָּזֶר
  choice: Gezer
  rationale: Transliteração corrente do topônimo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança, enquanto “SENHOR” o substitui por um título.
- issue: Identificação de בֵּיתוֹ
  choice: seu próprio palácio
  alternative: sua casa
  rationale: O referente é o complexo residencial real de Salomão. A formulação escolhida explicita esse referente contextual, sem introduzir uma distinção teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém “casa de Yahweh” por fidelidade à imagem hebraica, mas usa “palácio” para esclarecer o referente de “sua casa”. Os marcadores de nota foram posicionados junto aos termos que efetivamente explicam.
