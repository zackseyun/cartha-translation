base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: pt
  text: Foram[a] a Ofir, tomaram de lá quatrocentos e vinte talentos de ouro e os trouxeram ao rei Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Chegaram”.'
    reason: O verbo hebraico pode ser traduzido por “chegaram” ou, conforme o ponto de vista do relato, por “foram”.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Foram
  rationale: Embora בוא tenha normalmente o sentido de “vir/chegar”, o contexto narrativo descreve o deslocamento da expedição até Ofir; “foram” expressa de modo natural esse ponto de vista em português, enquanto a alternativa mais literal é preservada em nota.
- source_word: אוֹפִירָה
  choice: a Ofir
  rationale: O nome próprio אוֹפִיר recebe o ה direcional, que indica movimento rumo ao lugar; em português, isso é expresso pela preposição “a”.
- source_word: וַיִּקְחוּ
  choice: pegaram
  rationale: לקח é um verbo comum de tomar ou pegar. “Pegaram” é claro e corrente neste relato de obtenção e transporte do ouro.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Preserva explicitamente a preposição מן e a referência ao local de origem.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto e padrão do substantivo hebraico.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים
  choice: quatrocentos e vinte
  rationale: Mantém a quantidade exata, escrita por extenso para fluidez literária.
- source_word: כִּכָּר
  choice: talentos
  rationale: “Talento” é a designação tradicional e amplamente reconhecida da antiga unidade de peso ככר; o plural concorda com a quantidade.
- source_word: וַיָּבִאוּ
  choice: os trouxeram
  rationale: A forma hifil de בוא significa “trazer”. O pronome plural retoma naturalmente os talentos de ouro.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: ao rei Salomão
  rationale: Reproduz naturalmente em português o título definido seguido do nome próprio.
