review_pass:
  verdict: revise
  source_fidelity: A primeira oração está bem representada. Contudo, “prometi a Davi” interpreta o verbo “falei” (דִּבַּרְתִּי) e a preposição “a respeito de” (עַל), e “nunca lhe faltará um descendente” substitui a imagem verbal explícita de não ser eliminado/cortado do trono. Uma formulação mais próxima preserva ambas as expressões sem perder clareza.
  naturalness: A redação revisada mantém registro solene, natural e compreensível em português moderno. “Nenhum dos seus será afastado do trono” comunica de modo idiomático a construção hebraica sem introduzir “descendente” como explicação.
  terminology: “Trono do seu reino”, “para sempre” e “trono de Israel” são adequados. “Falei a respeito de Davi” corresponde melhor ao texto hebraico e ao audit trail em inglês do que “prometi a Davi”.
  issues:
  - severity: medium
    issue: “prometi a Davi” é mais interpretativo que o hebraico.
    rationale: O texto diz literalmente que Deus “falou a respeito de Davi, seu pai”; embora o contexto seja promissório, “prometi” e a troca de “a respeito de” por “a” estreitam e reformulam a expressão fonte.
  - severity: medium
    issue: “Nunca lhe faltará um descendente” altera a imagem da cláusula final.
    rationale: A fonte afirma que um homem “dos seus” não será cortado/afastado de sobre o trono. “Descendente” explicita uma inferência dinástica válida no contexto, mas não traduz diretamente o referente, e “não faltará” deixa de expressar a imagem de remoção.
  revised_text: 'Então estabelecerei para sempre o trono do seu reino sobre Israel, assim como falei a respeito de Davi, seu pai, dizendo: ‘Nenhum dos seus será afastado do trono de Israel.’'
