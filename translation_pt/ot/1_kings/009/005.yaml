  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: pt
  text: 'Então estabelecerei para sempre o trono do seu reino sobre Israel, assim como falei a respeito de Davi, seu pai, dizendo: ‘Nenhum dos seus será afastado do trono de Israel.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: então estabelecerei
  rationale: O perfeito consecutivo expressa a consequência futura da condição anterior; “estabelecerei” comunica a ideia de firmar ou confirmar.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: o trono do seu reino
  rationale: Preserva a imagem régia e a construção possessiva do hebraico.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: É a equivalência direta e natural para a duração indefinida ou perpétua indicada no contexto.
- source_word: כַּאֲשֶׁר דִּבַּרְתִּי עַל דָּוִד אָבִיךָ
  choice: conforme prometi a Davi, seu pai
  rationale: Neste contexto pactual, דִּבַּרְתִּי denota uma declaração de compromisso; “prometi” torna sua força pragmática clara, enquanto “a Davi” expressa naturalmente עַל com verbo de fala.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: Nunca lhe faltará um descendente no trono de Israel
  rationale: A expressão idiomática literalmente fala de um homem que não será eliminado para Davi de sobre o trono; a formulação escolhida comunica em português corrente a continuidade dinástica pretendida.
theological_decisions:
- issue: Natureza da promessa davídica
  choice: Preservar a formulação perpétua e dinástica sem explicar como ela se cumpre
  alternative: Explicitar um cumprimento messiânico ou condicionar diretamente esta frase
  rationale: O versículo afirma a permanência do trono e cita a promessa a Davi; a tradução não deve acrescentar uma resolução teológica que o próprio texto não explicita aqui.
- issue: Sentido de אִישׁ na promessa
  choice: descendente
  alternative: homem
  rationale: No idioma da sucessão real, “um descendente” expressa naturalmente a referência a alguém da linhagem de Davi, sem restringi-la a uma única pessoa nem importar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. Mantém a imagem do trono e a força da promessa, traduzindo idiomaticamente a fórmula hebraica de continuidade dinástica.
