source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: pt
  text: Três vezes por ano, Salomão oferecia holocaustos e ofertas de comunhão sobre o altar que havia construído para Yahweh e, diante de Yahweh, fazia subir fumaça junto a ele.[a] Assim, completou a Casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “queimava incenso junto a ele”. O hebraico é sintaticamente difícil e também pode se referir, de modo mais amplo, a fazer uma oferta subir em fumaça.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a casa”, isto é, o templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: oferecia
  rationale: No contexto sacrificial, o hifil de עלה significa apresentar ou oferecer um sacrifício; o imperfeito habitual em português combina com a frequência anual indicada.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo cultual consagrado em português para sacrifícios inteiramente queimados no altar.
- source_word: שְׁלָמִים
  choice: ofertas de comunhão
  rationale: Expressa a categoria de sacrifícios ligados à comunhão e ao bem-estar sem pressupor que fossem ofertas destinadas a obter paz.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: três vezes por ano
  rationale: Equivalente português natural da expressão temporal hebraica.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: sobre o altar que havia construído para Yahweh
  rationale: Mantém a relação sintática e deixa claro que a construção do altar precedeu os atos recorrentes.
- source_word: וְהַקְטֵיר
  choice: fazia subir fumaça
  rationale: Preserva a amplitude do verbo קטר, que pode indicar queimar incenso ou fazer uma oferta produzir fumaça, sem resolver indevidamente a ambiguidade.
- source_word: אִתּוֹ
  choice: sobre ele
  rationale: Entende o sufixo difícil como referência ao altar, em conformidade com uma leitura antiga e contextualmente plausível.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Conserva a localização cultual perante Yahweh sem impor em português uma ligação sintática mais específica do que a forma hebraica permite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: Assim, completou a Casa
  rationale: O piel de שלם pode significar completar ou concluir. 'Casa', com inicial maiúscula contextual, mantém a imagem hebraica e indica o templo.
theological_decisions:
- issue: Natureza da participação de Salomão nos ritos
  choice: Atribuir os atos a Salomão conforme a forma superficial do hebraico
  alternative: Explicitar que Salomão mandava os sacerdotes realizar os ritos, ou afirmar que ele os executava pessoalmente
  rationale: O resumo régio pode descrever tanto ação pessoal quanto patrocínio ou autorização. A tradução não resolve essa tensão além do que o texto permite.
- issue: Sentido de וְהַקְטֵיר
  choice: Manter a noção ampla de fazer subir fumaça
  alternative: Traduzir especificamente como 'queimava incenso'
  rationale: O verbo pode referir-se ao incenso, mas também à produção de fumaça sacrificial em sentido mais amplo; a escolha evita uma especificação incerta.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. 'Casa' preserva a designação hebraica do templo; 'holocaustos' mantém o vocabulário cultual reconhecível. A posição de 'três vezes por ano' no início reduz a possibilidade de vinculá-la apenas à construção do altar.
