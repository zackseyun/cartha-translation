  naturalness: O português é fluente e de registro apropriado. «Fazia subir fumaça com ele» é compreensível, mas «fazia subir fumaça junto a ele» soa mais natural e evita sugerir que o altar seja o objeto direto da fumaça.
  terminology: «Holocaustos», «ofertas de comunhão» e «Yahweh» são escolhas adequadas. «Casa» conserva o termo hebraico; a nota esclarece de modo suficiente que se trata do templo.
