  to: Três vezes por ano, Salomão oferecia holocaustos e ofertas de comunhão sobre o altar que havia construído para Yahweh e, diante de Yahweh, fazia subir fumaça junto a ele.[a] Assim, completou a Casa.[b]
  rationale: A única revisão necessária substitui «sobre ele» por «junto a ele», para não transformar a relação ambígua expressa por אִתּוֹ em uma afirmação locativa inequívoca. Mantêm-se a formulação ampla para וְהַקְטֵיר, a atribuição superficial das ações a Salomão e as âncoras das notas.
