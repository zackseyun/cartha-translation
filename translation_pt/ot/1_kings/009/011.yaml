source:
  edition: WLC
  text: חִירָ֣ם מֶֽלֶךְ צֹ֠ר נִשָּׂ֨א אֶת שְׁלֹמֹ֜ה בַּ/עֲצֵי֩ אֲרָזִ֨ים וּ/בַ/עֲצֵ֧י בְרוֹשִׁ֛ים וּ/בַ/זָּהָ֖ב לְ/כָל חֶפְצ֑/וֹ אָ֡ז יִתֵּן֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֤ה לְ/חִירָם֙ עֶשְׂרִ֣ים עִ֔יר בְּ/אֶ֖רֶץ הַ/גָּלִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: pt
  text: Hirão, rei de Tiro, havia fornecido a Salomão madeira de cedro, madeira de cipreste[a] e ouro, tudo quanto ele desejava. Então o rei Salomão deu a Hirão vinte cidades na terra da Galileia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zimbro”, “abeto” ou outra conífera; não se sabe ao certo qual espécie é designada pelo hebraico berosh.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: havia fornecido
  rationale: Embora נָשָׂא normalmente signifique “levantar, carregar, levar”, nesta construção, com Salomão como objeto e os materiais introduzidos por ב, o sentido contextual é o de fornecer recursos. O mais-que-perfeito apresenta esse fornecimento como antecedente à ação principal.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: madeira de cedro
  rationale: עֵץ em construção com uma espécie de árvore pode designar a madeira usada como material, e não árvores vivas.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: madeira de cipreste[a]
  rationale: בְּרוֹשׁ designa uma conífera de identificação incerta. “Cipreste” é uma tradução comum e adequada ao contexto de construção, com a incerteza registrada em nota.
- source_word: וּבַזָּהָב
  choice: e ouro
  rationale: Tradução direta do termo hebraico, sem ampliação interpretativa.
- source_word: לְכָל חֶפְצוֹ
  choice: tudo quanto ele desejava
  rationale: חֵפֶץ pode indicar desejo, vontade ou aquilo em que alguém tem prazer. A formulação expressa a extensão completa do que Salomão desejava, em português natural.
- source_word: אָז יִתֵּן
  choice: Então ... deu
  rationale: אָז marca a sequência temporal; embora יִתֵּן seja formalmente imperfeito, aqui funciona como evento passado na narrativa.
- source_word: עֶשְׂרִים עִיר
  choice: vinte cidades
  rationale: עִיר pode ser “cidade” ou “povoado”; “cidades” é apropriado ao contexto territorial e político.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: na terra da Galileia
  rationale: Mantém de modo transparente tanto אֶרֶץ, “terra”, quanto o topônimo tradicional em português.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: Hirão ... Salomão ... Tiro ... Galileia
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas nominais tradicionais. A relação temporal entre o fornecimento de Hirão e a concessão das cidades é expressa naturalmente pelo mais-que-perfeito seguido de “Então”. O marcador [a] aparece junto ao termo lexicalmente incerto.
