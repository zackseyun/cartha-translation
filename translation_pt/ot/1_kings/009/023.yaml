  text: אֵ֣לֶּה שָׂרֵ֣י הַ/נִּצָּבִ֗ים אֲשֶׁ֤ר עַל הַ/מְּלָאכָה֙ לִ/שְׁלֹמֹ֔ה חֲמִשִּׁ֖ים וַ/חֲמֵ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: pt
  text: 'Estes eram os chefes dos encarregados que estavam à frente da obra de Salomão: quinhentos e cinquenta, que exerciam autoridade sobre o povo que realizava a obra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: os chefes dos encarregados
  rationale: Preserva a relação de construção entre שָׂרֵי e הַנִּצָּבִים. “Encarregados” comunica funcionários designados e evita tanto uma leitura militar quanto a redundância de “chefes dos supervisores”.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: que estavam à frente da obra de Salomão
  rationale: “Estar à frente” expressa naturalmente a responsabilidade indicada por עַל, e “obra de Salomão” comunica a relação de serviço expressa por לִשְׁלֹמֹה sem sugerir necessariamente propriedade pessoal.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: quinhentos e cinquenta
  rationale: Forma numérica corrente e inequívoca em português.
- source_word: הָרֹדִים
  choice: que exerciam autoridade sobre
  rationale: O verbo רדה pode indicar governar, dominar ou exercer autoridade. Esta formulação mantém a força administrativa do termo no contexto do trabalho sem introduzir linguagem excessivamente dura.
- source_word: בָּעָם
  choice: o povo
  rationale: Mantém o sentido amplo do substantivo hebraico; a oração seguinte identifica esse povo como os que realizavam o trabalho.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: que realizava a obra
  rationale: Tradução clara do particípio e da expressão בַּמְּלָאכָה; a concordância no singular segue o coletivo “povo” em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva a estrutura administrativa do hebraico e evita termos militares ou denominacionais.
