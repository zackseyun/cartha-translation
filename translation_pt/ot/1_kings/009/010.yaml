reference: 1 Kings 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ עֶשְׂרִ֣ים שָׁנָ֔ה אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה אֶת שְׁנֵ֣י הַ/בָּתִּ֑ים אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֥ית הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: pt
  text: E aconteceu que, ao fim de vinte anos[a], durante os quais Salomão construiu as duas casas[b] — a casa de Yahweh e a casa do rei —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de vinte anos”. A expressão hebraica indica que o período de vinte anos havia chegado ao fim.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “as duas casas”, isto é, a casa de Yahweh e a casa do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz a transição narrativa de modo natural e digno, sem recorrer à fórmula arcaica “e sucedeu”.
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: ao fim de vinte anos
  rationale: Expressa o ponto alcançado quando se completou o período de vinte anos; “depois de vinte anos” também é possível.
- source_word: אֲשֶׁר
  choice: durante os quais
  rationale: Liga a oração relativa ao período de vinte anos e indica que as obras se deram ao longo desse intervalo.
- source_word: בָּנָה
  choice: construiu
  rationale: O pretérito perfeito é natural em português dentro da moldura temporal e não acrescenta um aspecto verbal mais específico do que o hebraico exige.
- source_word: שְׁנֵי הַבָּתִּים
  choice: as duas casas
  rationale: Preserva o sentido literal e a ligação lexical com a identificação das duas construções logo em seguida.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de” e verte o Tetragrama como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: Preserva o paralelismo lexical com “a casa de Yahweh”; “palácio real” seria uma explicitação contextual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva sua função como nome pessoal sem substituir o nome por um título.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A frase permanece aberta com travessão final porque o versículo continua sintaticamente no contexto seguinte.
