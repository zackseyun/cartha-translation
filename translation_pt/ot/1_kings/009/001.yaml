  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: pt
  text: Quando Salomão terminou de construir a casa de Yahweh, a casa do rei e tudo o que desejava realizar,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os projetos que Salomão desejava executar”; literalmente, “todo o desejo de Salomão que ele desejou realizar”.
    reason: Preserva a amplitude e a construção enfática de חֵשֶׁק ... חָפֵץ, que pode designar tanto o desejo de Salomão quanto aquilo que ele desejava fazer.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Quando ... terminou
  rationale: A fórmula narrativa וַיְהִי seguida da construção temporal pode ser expressa naturalmente em português pela oração com “quando”, sem o artificial “e aconteceu que”.
- source_word: לִבְנוֹת
  choice: de construir
  rationale: Depois de “terminou”, o infinitivo introduzido por “de” é a construção idiomática em português.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a imagem literal e o paralelismo com a casa do rei, evitando substituir interpretativamente “casa” por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: Reproduz a expressão hebraica e preserva seu paralelismo com “a casa de Yahweh”; “palácio real” seria uma explicitação contextual.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: tudo o que desejava realizar
  rationale: Expressa em português natural a ideia de tudo aquilo que Salomão quis executar, sem restringir o referente apenas a construções.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta o nome próprio divino; “Yahweh” o representa diretamente, enquanto “SENHOR” segue uma tradição de substituição por título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A frase permanece aberta com vírgula porque o versículo introduz a ação que continua no versículo seguinte.
