  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: pt
  text: Quanto a você, se andar diante de mim como Davi, seu pai, andou, com integridade de coração[a] e retidão, agindo de acordo com tudo o que lhe ordenei, e se guardar os meus estatutos e os meus juízos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com inteireza de coração”. O termo hebraico destaca plenitude e integridade, não necessariamente ausência absoluta de pecado.
    reason: lexical_alternative
  - marker: b
    text: Ou “as minhas ordenanças”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: Marca a mudança para a interpelação direta de Salomão e preserva a leve ênfase contrastiva do hebraico.
- source_word: תֵּלֵךְ לְפָנַי
  choice: andar diante de mim
  rationale: Conserva a metáfora hebraica de conduzir a vida na presença de Deus, sem a transformar numa paráfrase.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: como Davi, seu pai, andou
  rationale: Mantém tanto a comparação com Davi quanto a repetição do verbo 'andar' presente no texto hebraico.
- source_word: בְּתָם לֵבָב
  choice: com integridade de coração
  rationale: Expressa inteireza, sinceridade e coerência moral, sem sugerir necessariamente ausência absoluta de pecado.
- source_word: וּבְיֹשֶׁר
  choice: e retidão
  rationale: Traduz a ideia moral de ser reto de maneira concisa, digna e corrente em português.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: agindo de acordo com tudo o que lhe ordenei
  rationale: Liga o modo de andar à obediência prática e conserva a abrangência de כְּכֹל, 'tudo'.
- source_word: חֻקַּי
  choice: os meus estatutos
  rationale: Termo adequado ao contexto legal e pactual, preservando a distinção em relação a מִשְׁפָּטַי.
- source_word: וּמִשְׁפָּטַי
  choice: e os meus juízos
  rationale: Conserva a nuance jurídica do termo hebraico e sua distinção lexical em relação a 'estatutos'.
- source_word: תִּשְׁמֹר
  choice: se guardar
  rationale: No contexto da aliança, שׁמר significa observar ou cumprir fielmente. A repetição de 'se' torna clara em português a coordenação das condições.
theological_decisions:
- issue: A caracterização de Davi como modelo
  choice: Davi é apresentado como alguém que andou com 'integridade de coração e retidão'.
  alternative: Traduzir תָּם com uma expressão mais forte, como 'irrepreensibilidade de coração'.
  rationale: O hebraico elogia a devoção íntegra de Davi sem exigir a conclusão de que ele tenha sido absolutamente impecável. A tradução mantém essa tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A metáfora bíblica 'andar diante de mim' e a terminologia pactual foram preservadas. A vírgula final mantém o caráter incompleto da oração condicional, cuja consequência aparece no versículo seguinte.
