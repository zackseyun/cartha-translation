  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: pt
  text: O rei Salomão também construiu uma frota de navios em Eziom-Geber, que fica junto a Elote, às margens do mar Vermelho[a], na terra de Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mar de Juncos”; tradicionalmente traduzido como “mar Vermelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: também... uma frota de navios
  rationale: O substantivo אֳנִי pode designar navio ou frota; neste contexto de empreendimento marítimo, “frota de navios” explicita naturalmente o sentido coletivo. “Também” representa a ligação narrativa da conjunção וָ.
- source_word: עָשָׂה
  choice: construiu
  rationale: Embora o verbo tenha o sentido geral de “fazer”, combinado com navios indica sua construção; “construiu” é claro e idiomático em português.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: em Eziom-Geber
  rationale: A preposição בְּ marca o local onde a frota foi construída; “em” é a forma natural em português. O topônimo é transliterado segundo uso bíblico corrente.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: que fica junto a Elote
  rationale: A construção expressa associação espacial ou proximidade. “Junto a” mantém essa relação sem definir uma distância mais precisa do que o hebraico.
- source_word: עַל שְׂפַת יַם סוּף
  choice: às margens do mar Vermelho
  rationale: שְׂפַת, literalmente “lábio/borda”, indica a margem. “Mar Vermelho” é a designação tradicional e geograficamente reconhecível; a alternativa lexical de יַם סוּף é preservada em nota.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: na terra de Edom
  rationale: Preserva a formulação geográfica completa do hebraico, em vez de reduzi-la simplesmente a “em Edom”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os topônimos seguem formas bíblicas portuguesas correntes. A nota foi colocada após “mar Vermelho”, expressão à qual se refere.
