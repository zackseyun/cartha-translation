base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: pt
  text: Mas a filha do faraó subiu da Cidade de Davi para a casa que ele havia construído para ela; então ele construiu o Milo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o aterro” ou “os terraços”. O termo hebraico Milo provavelmente designa uma fortificação ou uma estrutura de aterro ou terraços de sustentação.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: A partícula introduz aqui uma transição ou ressalva no fluxo narrativo; “Mas” é natural e preserva seu possível valor adversativo.
- source_word: בַּת פַּרְעֹה
  choice: a filha do faraó
  rationale: O construto hebraico indica diretamente a relação familiar. Em português corrente, “a filha do faraó” é claro e natural.
- source_word: עָלְתָה
  choice: subiu
  rationale: Preserva o sentido básico de עלה e a provável referência ao deslocamento topográfico.
- source_word: מֵעִיר דָּוִד
  choice: da Cidade de Davi
  rationale: Mantém o nome próprio do lugar e traduz de modo direto a preposição de origem.
- source_word: אֶל בֵּיתָהּ
  choice: para a casa
  rationale: בַּיִת pode referir-se a casa ou palácio; “casa” evita especificar além do texto hebraico, embora o contexto seja régio.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: que ele havia construído para ela
  rationale: O mais-que-perfeito composto torna natural em português a anterioridade da construção em relação à mudança, sem alterar a relação expressa pelo contexto.
- source_word: אָז
  choice: então
  rationale: Expressa de maneira concisa a sequência temporal da narrativa.
- source_word: בָּנָה
  choice: ele construiu
  rationale: Traduz o verbo de forma simples, sem acrescentar a ideia não expressa de que apenas começou a construir.
- source_word: הַמִּלּוֹא
  choice: o Milo
  rationale: O termo parece designar uma estrutura ou local específico de Jerusalém, mas sua natureza exata é discutida; a transliteração preserva o referente sem impor uma reconstrução arquitetônica.
