  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: pt
  text: 'E ele disse: “Que cidades são estas que você me deu, meu irmão?” Então chamou aquelas cidades de terra de Cabul, até o dia de hoje.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cabul provavelmente é um nome de lugar, mas o hebraico também pode sugerir um jogo de palavras depreciativo, talvez com o sentido de “sem valor” ou de algo “preso” ou “limitado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: Que cidades são estas
  rationale: A pergunta tem força qualitativa e expressa desagrado. A formulação natural em português preserva a reclamação sem explicá-la em excesso.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: que você me deu
  rationale: O perfeito hebraico indica uma ação concluída; o pretérito perfeito é a forma mais natural em português neste discurso direto.
- source_word: אָחִי
  choice: meu irmão
  rationale: Preserva tanto o sufixo possessivo explícito quanto a linguagem relacional e diplomática entre reis.
- source_word: וַיִּקְרָא לָהֶם
  choice: Por isso, chamou aquela região
  rationale: O pronome plural retoma as cidades, mas o nome seguinte designa a terra ou região. Esta formulação comunica naturalmente a referência sem sugerir que cada cidade recebeu individualmente o mesmo nome.
- source_word: אֶרֶץ כָּבוּל
  choice: terra de Cabul
  rationale: כָּבוּל funciona provavelmente como topônimo. A transliteração preserva a incerteza e deixa o possível jogo depreciativo para a nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: nome que permanece até hoje
  rationale: Expressa de modo corrente a fórmula temporal hebraica e esclarece que a permanência se refere à designação.
theological_decisions: []
