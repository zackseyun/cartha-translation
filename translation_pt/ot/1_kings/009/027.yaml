lexical_decisions:
- source_word: בָּאֳנִי
  choice: no navio
  rationale: A construção com בְּ indica que os servos foram enviados a bordo do navio; o singular definido foi preservado.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: marinheiros
  rationale: Literalmente, “homens de navios”; em português atual, “marinheiros” comunica naturalmente a ocupação e a experiência náutica.
- source_word: יֹדְעֵי הַיָּם
  choice: que conheciam o mar
  rationale: Preserva a formulação concreta do hebraico e sua ideia de conhecimento prático do mar.
- source_word: עִם עַבְדֵי שְׁלֹמֹה
  choice: junto com os servos de Salomão
  rationale: Expressa com clareza a associação indicada por עִם sem sugerir subordinação.
