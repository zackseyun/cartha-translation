source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: pt
  text: 'E esta casa se tornará uma ruína[a]. Todos os que passarem por ela ficarão horrorizados e assobiarão[b], e dirão: “Por que Yahweh fez isso com esta terra e com esta casa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “esta casa será alta/exaltada”. Neste contexto, muitos entendem que o sentido é que ela se tornará uma ruína ou motivo de horror; compare 2 Crônicas 7:21.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “sibilarão”. O verbo hebraico indica a produção de um som agudo como expressão de espanto ou desprezo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: E esta casa
  rationale: “Casa” preserva o sentido básico de בַּיִת e a repetição literária do hebraico; no contexto, refere-se claramente ao templo.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: se tornará uma ruína
  rationale: Embora o texto massorético diga literalmente “será alta/exaltada”, o contexto de juízo e a passagem paralela de 2Crônicas 7:21 favorecem o sentido contextual de ruína ou desolação. A dificuldade textual é explicitada em nota.
- source_word: כָּל עֹבֵר עָלָיו
  choice: Todos os que passarem por ela
  rationale: Expressa naturalmente em português o sentido distributivo da expressão hebraica e concorda com o referente feminino “casa”.
- source_word: יִשֹּׁם
  choice: ficarão horrorizados
  rationale: O verbo comunica espanto acompanhado de horror diante da devastação, mais do que simples surpresa.
- source_word: וְשָׁרָק
  choice: e assobiarão
  rationale: O verbo descreve a emissão de um som agudo como reação de espanto ou desprezo; “assobiarão” é a correspondência lexical direta, com “sibilarão” registrado em nota como alternativa.
- source_word: וְאָמְרוּ
  choice: e dirão
  rationale: Mantém de modo natural o plural hebraico, em concordância com “todos os que passarem”.
- source_word: עַל מֶה
  choice: Por que
  rationale: É a forma idiomática e direta de perguntar em português pela razão do juízo.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh fez isso
  rationale: “Fez isso” traduz de maneira corrente o demonstrativo de modo כָּכָה sem recorrer ao mais solene “fez assim”.
- source_word: לָאָרֶץ הַזֹּאת
  choice: com esta terra
  rationale: “Terra” designa aqui o território atingido pelo juízo; a preposição “com” é natural em português na pergunta “fazer isso com”.
- source_word: וְלַבַּיִת הַזֶּה
  choice: e com esta casa
  rationale: Preserva a repetição de בַּיִת e a construção paralela da pergunta hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de עֶלְיוֹן no contexto de juízo
  choice: se tornará uma ruína
  alternative: será alta/exaltada
  rationale: A tradução principal comunica o sentido exigido pelo contexto de devastação, enquanto a nota conserva a forma difícil do texto massorético e evita ocultar a tensão textual.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e a repetição do hebraico foram preservadas quando naturais; a dificuldade em עֶלְיוֹן e a amplitude semântica de וְשָׁרָק foram mantidas em notas.
