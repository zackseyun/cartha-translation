lexical_decisions:
- source_word: וְ/אֶת
  choice: e
  rationale: אֵת marca o objeto direto definido e não precisa ser traduzido; וְ coordena este item com a lista anterior.
- source_word: בַּעֲלָת
  choice: Baalate
  rationale: Nome próprio de lugar, transliterado em forma natural para leitores de português.
- source_word: וְ/אֶת
  choice: e
  rationale: Como na ocorrência anterior, אֵת fica sem representação explícita, enquanto וְ mantém a coordenação da lista.
- source_word: תמר
  choice: Tamar
  rationale: O texto consonantal massorético traz תמר, transliterado como “Tamar”; a variante do paralelo é preservada em nota.
- source_word: בַּ/מִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa região desértica ou erma; “deserto” é claro, natural e geograficamente adequado.
- source_word: בָּ/אָֽרֶץ
  choice: naquela terra
  rationale: אֶרֶץ tem aqui sentido territorial amplo. O demonstrativo torna natural em português a expressão definida sem especificar além do hebraico.
