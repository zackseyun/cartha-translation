lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O qal wayyiqtol de בנה tem o sentido básico de “construir”. Neste contexto de obras reais, pode abranger reconstrução ou fortificação, mas o texto não explicita essas nuances.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: גָּזֶר
  choice: Gezer
  rationale: Transliteração convencional do topônimo hebraico.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: Bete-Horom de Baixo
  rationale: A expressão distingue esta localidade da Bete-Horom de Cima. “De Baixo” preserva a identificação geográfica e soa natural como parte do topônimo em português.
- source_word: אֶת / וְאֶת
  choice: '[sem tradução separada]'
  rationale: São marcadores do objeto direto; sua função é expressa pela sintaxe portuguesa, sem palavra correspondente.
