base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: pt
  text: 'Ao meio-dia, Elias zombou deles e disse: “Gritem bem alto, pois ele é um deus! Pois está absorto em seus pensamentos, ou se retirou[a], ou está viajando. Talvez esteja dormindo e acorde.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “foi fazer suas necessidades”. A rara expressão hebraica provavelmente é eufemística.
    reason: Alternativa lexical para uma expressão hebraica rara e provavelmente eufemística.
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: Ao meio-dia
  rationale: A fórmula narrativa introduz o momento da cena; em português, a indicação temporal direta é natural e evita uma construção desnecessariamente pesada como “E aconteceu que, ao meio-dia”.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: zombou deles
  rationale: O verbo expressa escárnio ou ridicularização; “zombou” conserva com clareza o tom mordaz de Elias.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: Gritem bem alto
  rationale: Reproduz a força do imperativo e o sentido concreto de chamar com voz forte, em português atual e natural.
- source_word: כִּי אֱלֹהִים הוּא
  choice: pois ele é um deus
  rationale: No contexto, Elias fala ironicamente de Baal. O artigo indefinido evita identificar Baal com o Deus de Israel e preserva o sarcasmo.
- source_word: שִׂיחַ
  choice: esteja absorto em seus pensamentos
  rationale: Expressa a provável ideia de reflexão ou preocupação mental sem especificar demais a natureza da atividade.
- source_word: שִׂיג לוֹ
  choice: tenha se retirado
  rationale: A expressão hebraica é rara e indireta, provavelmente eufemística. A tradução mantém essa indiretividade, enquanto a provável interpretação é registrada em nota.
- source_word: דֶרֶךְ לוֹ
  choice: esteja viajando
  rationale: Traduz de maneira idiomática a ideia de estar a caminho ou ausente em viagem.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: Talvez esteja dormindo e acorde
  rationale: Mantém o caráter intransitivo do verbo final e a sugestão sarcástica de que o deus poderia despertar.
theological_decisions:
- issue: Tradução de אֱלֹהִים em referência a Baal
  choice: um deus
  alternative: Deus
  rationale: A frase faz parte da zombaria de Elias e se refere a uma divindade pagã, não ao Deus de Israel. “Um deus” preserva essa distinção e a ironia contextual.
- issue: Tratamento da expressão eufemística שִׂיג לוֹ
  choice: tenha se retirado
  alternative: tenha ido fazer suas necessidades
  rationale: Como o hebraico é indireto e seu sentido exato não é totalmente seguro, o texto principal conserva o eufemismo; a interpretação mais explícita aparece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala conserva o tom sarcástico de Elias sem recorrer a formulações arcaicas; a ambiguidade da expressão rara é mantida no texto e esclarecida em nota.
