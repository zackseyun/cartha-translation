  text: וְ/יַד יְהוָ֗ה הָֽיְתָה֙ אֶל אֵ֣לִיָּ֔הוּ וַ/יְשַׁנֵּ֖ס מָתְנָ֑י/ו וַ/יָּ֨רָץ֙ לִ/פְנֵ֣י אַחְאָ֔ב עַד בֹּאֲ/כָ֖ה יִזְרְעֶֽאלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: pt
  text: A mão de Yahweh esteve sobre Elias[a]. Ele prendeu a roupa à cintura[b] e correu à frente de Acabe até a entrada de Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em formulação mais tradicional: “A mão de Yahweh veio sobre Elias”. O verbo hebraico significa literalmente “esteve”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cingiu os lombos”; isto é, recolheu e prendeu a veste para correr.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal e preserva sua distinção em relação ao título “Senhor”.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: A mão de Yahweh esteve sobre
  rationale: Mantém a imagem hebraica de ação e capacitação divina sem definir se se tratou de força milagrosa, impulso profético ou ambos; “esteve” corresponde ao verbo hebraico, que significa literalmente “ser/estar”.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: prendeu a roupa à cintura
  rationale: 'Expressa em português atual a ação culturalmente pressuposta: recolher e prender a veste longa para poder correr, evitando a expressão pouco transparente “cingiu os lombos”.'
- source_word: וַיָּרָץ לִפְנֵי
  choice: correu à frente de
  rationale: Preserva claramente o sentido espacial da expressão sem acrescentar a ideia de uma função cerimonial.
- source_word: עַד בֹּאֲכָה
  choice: até a entrada de
  rationale: Neste uso com um topônimo, indica o ponto de chegada ou acesso à localidade; a formulação é natural em português.
- source_word: יִזְרְעֶאלָה
  choice: Jezreel
  rationale: Forma tradicional e amplamente reconhecível do nome da localidade em português.
theological_decisions:
- issue: Natureza da capacitação de Elias
  choice: A expressão é mantida como imagem de ação e capacitação divina, sem especificar seu mecanismo.
  alternative: Explicitar que Elias recebeu força milagrosa para alcançar velocidade sobre-humana, ou interpretar a expressão apenas como inspiração profética.
  rationale: O hebraico atribui a ação de Elias à atuação de Yahweh, mas não esclarece se a capacitação foi força física milagrosa, urgência profética ou ambas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A imagem teológica da “mão de Yahweh” foi preservada, enquanto o gesto ligado à roupa foi tornado compreensível no texto principal e documentado literalmente em nota.
