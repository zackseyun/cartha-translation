base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: pt
  text: Responde-me, Yahweh, responde-me, para que este povo saiba que tu, Yahweh, és Deus[a] e que fizeste o coração deles voltar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “és o Deus”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “o coração deles” no singular, como expressão coletiva. A frase não explicita para onde o coração volta; no contexto, pode indicar sua volta para Yahweh.
    reason: ambiguity_and_collective_expression
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Responde-me
  rationale: No contexto da oração, ענה pede uma resposta divina manifestada em ação. “Responde-me” é natural e mantém a repetição enfática do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando a distinção entre o nome pessoal e אֱלֹהִים, “Deus”.
- source_word: וְיֵדְעוּ
  choice: para que ... saiba
  rationale: O waw com o imperfeito expressa aqui o propósito ou resultado desejado da petição de Elias. O singular “saiba” concorda com o coletivo “este povo”.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Reproduz de modo claro e natural o substantivo coletivo singular do hebraico.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: que tu, Yahweh, és Deus
  rationale: Identifica Yahweh como Deus em contraste com Baal. O artigo de הָאֱלֹהִים pode ter força definida, mas em português “és Deus” é a formulação mais natural; a alternativa mais formalmente explícita é registrada em nota.
- source_word: הֲסִבֹּתָ
  choice: fizeste ... voltar
  rationale: O hifil de סבב é causativo. A formulação preserva a ação atribuída a Deus e o aspecto perfeito sem acrescentar o destino do movimento.
- source_word: אֶת לִבָּם
  choice: o coração deles
  rationale: Mantém o singular coletivo hebraico, que apresenta o povo como um todo, sem tornar a frase ininteligível em português.
- source_word: אֲחֹרַנִּית
  choice: voltar
  rationale: O advérbio indica movimento de retorno ou para trás. “Voltar” é idiomático e deixa o destino implícito, como no texto hebraico.
theological_decisions:
- issue: Ação divina na volta do coração do povo
  choice: e que fizeste o coração deles voltar
  alternative: e que estás fazendo o coração deles voltar; e que fizeste o coração deles voltar para trás
  rationale: O perfeito é traduzido como ação realizada e a construção causativa mantém a forte agência divina. Não se acrescenta “para ti”, embora o contexto favoreça essa compreensão, pois o destino não está expresso no hebraico; assim, preserva-se a tensão do enunciado.
- issue: Identificação de Yahweh como Deus
  choice: tu, Yahweh, és Deus
  alternative: tu, Yahweh, és o Deus
  rationale: A leitura principal comunica naturalmente a confissão contrastiva do versículo sem transformar o artigo hebraico em uma formulação portuguesa artificial. A alternativa que explicita o artigo é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a repetição enfática, o nome Yahweh e o singular coletivo “o coração deles”; evita-se acrescentar “para ti”, ausente do hebraico.
