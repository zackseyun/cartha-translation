source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֜הוּ לִ/נְבִיאֵ֣י הַ/בַּ֗עַל בַּחֲר֨וּ לָ/כֶ֜ם הַ/פָּ֤ר הָֽ/אֶחָד֙ וַ/עֲשׂ֣וּ רִאשֹׁנָ֔ה כִּ֥י אַתֶּ֖ם הָ/רַבִּ֑ים וְ/קִרְאוּ֙ בְּ/שֵׁ֣ם אֱלֹהֵי/כֶ֔ם וְ/אֵ֖שׁ לֹ֥א תָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: pt
  text: 'Então Elias disse aos profetas de Baal: “Escolham para vocês um dos touros e preparem-no primeiro, pois vocês são muitos. Depois, invoquem o nome do seu deus[a], mas não ponham fogo[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “invocar o nome” significa invocar a divindade ou apelar a ela.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “não ponham fogo”, sem declarar “debaixo dele”, embora isso esteja implícito no contexto do sacrifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Elias disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa naturalmente a sequência em português.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: aos profetas de Baal
  rationale: A cadeia construta indica de modo direto os profetas vinculados a Baal.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: Escolham para vocês um dos touros
  rationale: O artigo com “um” aponta, no contexto, para um dos dois touros já mencionados. “Para vocês” conserva לָכֶם, e “touro” é claro e corrente.
- source_word: וַעֲשׂוּ
  choice: preparem-no
  rationale: No contexto sacrificial, o verbo se refere a preparar o animal, não apenas a “fazê-lo” nem necessariamente a já oferecê-lo.
- source_word: רִאשֹׁנָה
  choice: primeiro
  rationale: A forma funciona adverbialmente e indica que os profetas de Baal devem agir antes.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: pois vocês são muitos
  rationale: A oração apresenta a razão para eles começarem; a expressão se refere naturalmente à superioridade numérica.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: Depois, invoquem o nome do seu deus
  rationale: קרא בשם é uma expressão para invocar ou apelar à divindade. “O nome” preserva a forma do hebraico, enquanto “invoquem” comunica o sentido idiomático.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: mas não ponham fogo
  rationale: A tradução mantém a proibição direta sem acrescentar “debaixo dele”, expressão implícita no contexto sacrificial, mas ausente do hebraico.
theological_decisions:
- issue: אֱלֹהֵיכֶם em referência a Baal
  choice: seu deus
  alternative: seus deuses
  rationale: Embora אֱלֹהִים possa ter forma plural, o referente imediato é Baal, singular. “Seu deus” preserva essa referência sem introduzir uma pluralidade que o versículo não afirma neste ponto.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de terceira pessoa plural e “vocês” para ampla legibilidade brasileira. A redação evita arcaísmos, preserva o idioma hebraico relativo ao “nome” e não explicita no corpo do texto o local do fogo, que o original deixa implícito.
source_grounding:
  english_pob_role: consult_only
