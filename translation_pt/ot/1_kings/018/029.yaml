  text: וַֽ/יְהִי֙ כַּ/עֲבֹ֣ר הַֽ/צָּהֳרַ֔יִם וַ/יִּֽתְנַבְּא֔וּ עַ֖ד לַ/עֲל֣וֹת הַ/מִּנְחָ֑ה וְ/אֵֽין ק֥וֹל וְ/אֵין עֹנֶ֖ה וְ/אֵ֥ין קָֽשֶׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: pt
  text: E aconteceu que, depois que o meio-dia passou, eles continuaram profetizando[a] até a oferta de cereal ser apresentada[b]; mas não houve voz, ninguém respondeu e ninguém deu atenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «continuaram delirando». O hebraico usa o verbo habitual para profetizar, aqui descrevendo o comportamento extático dos profetas de Baal.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como «até a hora da oferta regular da tarde».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Reproduz a fórmula narrativa hebraica de transição sem recorrer ao arcaísmo «e sucedeu que».
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: depois de passar o meio-dia
  rationale: Expressa com naturalidade a relação temporal marcada por כ com o infinitivo construto e indica que o meio-dia já havia passado.
- source_word: וַיִּתְנַבְּאוּ
  choice: eles continuaram profetizando
  rationale: Mantém o verbo hebraico usual para profetizar e, pelo aspecto e pelo contexto, comunica a continuidade da atividade extática dos profetas de Baal sem substituí-la por uma interpretação pejorativa.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: até a oferta de cereal ser apresentada
  rationale: Conserva o sentido cultual de מִנְחָה e verte idiomaticamente a ideia de a oferta «subir» ou ser oferecida, sem inserir «da tarde», que não está explícito no hebraico.
- source_word: וְאֵין קוֹל
  choice: mas não houve voz
  rationale: Preserva קוֹל como «voz», apropriado à expectativa de uma resposta divina, e introduz com «mas» o contraste contextual.
- source_word: וְאֵין עֹנֶה
  choice: ninguém respondeu
  rationale: Comunica de modo natural em português a ausência de qualquer pessoa ou divindade que respondesse.
- source_word: וְאֵין קָשֶׁב
  choice: e ninguém deu atenção
  rationale: 'Expressa o sentido de atenção ou escuta atenta e mantém a progressão: nenhuma voz, nenhuma resposta e nenhum sinal de atenção.'
theological_decisions:
- issue: Descrição da atividade extática dos profetas de Baal
  choice: continuaram profetizando
  alternative: continuaram delirando
  rationale: O hebraico emprega o verbo comum para profetizar. A tradução principal preserva esse vínculo lexical e deixa que o contexto produza a ironia; a alternativa explicita o caráter extático, mas é mais interpretativa.
- issue: Identificação temporal da oferta
  choice: até a oferta de cereal ser apresentada
  alternative: até a hora da oferta regular da tarde
  rationale: מִנְחָה designa uma oferta, frequentemente de cereal, e a expressão pode funcionar como indicação da hora da oferta regular. Como «tarde» não aparece explicitamente, a tradução principal conserva a formulação cultual e registra a leitura temporal em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a repetição enfática das três negações finais e evita tanto linguagem arcaica quanto explicações confessionais inseridas no texto.
