base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: pt
  text: Pouco depois[a], o céu escureceu com nuvens e vento, e caiu uma chuva forte[b]. Acabe subiu no seu carro e foi para Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “até aqui e até aqui”, expressão idiomática que indica um breve intervalo de tempo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma grande chuva”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: Pouco depois
  rationale: A expressão idiomática hebraica indica um breve intervalo de tempo. A formulação é natural em português e preserva a ideia de que isso aconteceu logo em seguida.
- source_word: הַשָּׁמַיִם הִתְקַדְּרוּ
  choice: o céu escureceu
  rationale: Neste contexto meteorológico, הַשָּׁמַיִם designa o céu visível, e o verbo descreve seu escurecimento com a chegada da tempestade.
- source_word: עָבִים וְרוּחַ
  choice: com nuvens e vento
  rationale: Mantém de forma concisa os elementos que acompanharam ou causaram o escurecimento do céu, sem acrescentar uma intensidade não explicitada.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: e caiu uma chuva forte
  rationale: Embora גָּדוֹל signifique literalmente 'grande', 'chuva forte' é a expressão portuguesa corrente para precipitação intensa.
- source_word: וַיִּרְכַּב אַחְאָב
  choice: Acabe subiu no seu carro
  rationale: O verbo indica montar para viajar; o carro está implícito no contexto narrativo. Explicitá-lo produz português claro e natural sem alterar o sentido.
- source_word: יִזְרְעֶאלָה
  choice: para Jezreel
  rationale: O ה direcional indica movimento em direção a Jezreel, expresso naturalmente pela preposição 'para'.
