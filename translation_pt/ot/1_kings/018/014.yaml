  text: וְ/עַתָּה֙ אַתָּ֣ה אֹמֵ֔ר לֵ֛ךְ אֱמֹ֥ר לַֽ/אדֹנֶ֖י/ךָ הִנֵּ֣ה אֵלִיָּ֑הוּ וַ/הֲרָגָֽ/נִי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: pt
  text: 'E agora você me diz: ‘Vá dizer ao seu senhor: “Elias está aqui”, e ele vai me matar.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Reproduz a transição enfática do hebraico de modo natural em português.
- source_word: אַתָּה אֹמֵר
  choice: você me diz
  rationale: O pronome explícito dá ênfase ao interlocutor; o objeto indireto ‘me’ é exigido naturalmente pelo contexto e está implícito na fala dirigida a Obadias.
- source_word: לֵךְ אֱמֹר
  choice: Vá dizer
  rationale: Preserva a sequência de imperativos e soa corrente em português.
- source_word: לַאדֹנֶיךָ
  choice: ao seu senhor
  rationale: Aqui אָדוֹן designa o superior humano de Obadias, o rei Acabe, não o nome divino.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Elias está aqui
  rationale: Nesse anúncio, הִנֵּה chama a atenção para a presença de Elias; ‘está aqui’ comunica essa função com naturalidade, sem o arcaísmo de ‘eis’.
- source_word: וַהֲרָגָנִי
  choice: Então ele vai me matar
  rationale: Expressa o resultado temido por Obadias. O sujeito masculino singular não é nomeado no hebraico, mas o contexto aponta para o senhor mencionado, Acabe.
theological_decisions:
- issue: Identidade de ‘senhor’
  choice: senhor em minúscula
  alternative: Senhor, como título divino
  rationale: O sufixo ‘seu’ e o contexto identificam o referente como o senhor humano de Obadias, o rei Acabe.
- issue: Valor discursivo de הִנֵּה
  choice: incorporado em ‘está aqui’
  alternative: ‘Eis Elias’ ou ‘Olhe, Elias está aqui’
  rationale: A tradução mantém a afirmação da presença de Elias em linguagem moderna e evita acrescentar uma ordem literal para olhar, embora essa seja uma possível maneira de representar a partícula.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantida a fala direta em níveis de citação distintos e a apreensão de Obadias no fechamento.
