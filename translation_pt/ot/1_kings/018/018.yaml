  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: pt
  text: 'Ele respondeu: “Não fui eu que trouxe desgraça sobre Israel, mas você e a casa de seu pai, porque vocês abandonaram os mandamentos de Yahweh e você seguiu os Baals[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os Baals”, no plural, possivelmente em referência às diversas manifestações ou formas locais do culto a Baal.'
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: trouxe desgraça sobre
  rationale: O verbo עכר indica causar perturbação, calamidade ou desgraça a uma comunidade. A expressão mantém a acusação forte do contexto e soa natural em português.
- source_word: כִּי אִם
  choice: mas
  rationale: As partículas contrapõem a negação de Elias à responsabilização de Acabe e da casa de seu pai.
- source_word: וּבֵית אָבִיךָ
  choice: e a casa de seu pai
  rationale: Preserva o idioma hebraico que abrange a família, a dinastia e os que estão ligados à linhagem paterna.
- source_word: בַּעֲזָבְכֶם
  choice: porque vocês abandonaram
  rationale: A preposição com o infinitivo expressa a causa da desgraça; a segunda pessoa do plural inclui Acabe e a casa de seu pai.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: Mantém o peso pactual e normativo do termo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: e você seguiu
  rationale: O idioma hebraico descreve seguir alguém em lealdade ou culto. O singular é preservado para dirigir a acusação especificamente a Acabe.
- source_word: הַבְּעָלִים
  choice: os baalins
  rationale: A forma portuguesa tradicional preserva o plural explícito do hebraico, que pode abranger diferentes manifestações ou cultos locais de Baal.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o nome próprio divino. A transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Plural הַבְּעָלִים
  choice: os baalins
  alternative: Baal; os ídolos de Baal
  rationale: Preserva o plural do texto e evita reduzi-lo silenciosamente a uma única designação singular.
- issue: Alternância entre plural e singular na acusação
  choice: “vocês abandonaram” e “você seguiu”
  alternative: Uniformizar toda a frase no singular ou no plural
  rationale: O hebraico passa do plural בַּעֲזָבְכֶם, que inclui Acabe e sua casa, ao singular וַתֵּלֶךְ, que responsabiliza diretamente Acabe. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Casa de seu pai” conserva o caráter familiar e dinástico da expressão hebraica. A alternância intencional entre “vocês” e “você” reproduz a mudança de número do original.
