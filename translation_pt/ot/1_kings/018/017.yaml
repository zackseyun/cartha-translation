  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: pt
  text: 'Quando Acabe viu Elias, disse-lhe: “É você, o perturbador de Israel[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que traz desgraça sobre Israel” ou “aquele que traz desastre sobre Israel”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְהִי
  choice: Quando
  rationale: A fórmula narrativa introduz o acontecimento e, combinada com a expressão temporal seguinte, é representada naturalmente em português sem o arcaísmo “aconteceu que”.
- source_word: כִּרְאוֹת
  choice: Quando ... viu
  rationale: O infinitivo construto com כִּי־/כְּ expressa aqui uma circunstância temporal; “quando Acabe viu” é claro e natural.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: O marcador hebraico de objeto direto não possui equivalente independente em português; sua função é expressa pela sintaxe.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: É o equivalente narrativo direto e corrente do verbo hebraico de fala.
- source_word: אֵלָיו
  choice: lhe
  rationale: O pronome oblíquo representa de modo conciso o destinatário da fala, “a ele”.
- source_word: הַאַתָּה זֶה
  choice: É você
  rationale: A pergunta hebraica é enfática e confrontadora. “É você” preserva essa identificação direta em português atual; a aposição seguinte mantém a força acusatória.
- source_word: עֹכֵר
  choice: perturbador
  rationale: O particípio designa quem causa perturbação, desgraça ou desastre. “Perturbador” mantém a forma compacta e acusatória, enquanto a nota registra sentidos mais fortes possíveis.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se a forma consagrada do nome nacional em português.
theological_decisions:
- issue: Tom e alcance da acusação de Acabe
  choice: “o perturbador de Israel” como acusação direta
  alternative: “aquele que traz desgraça sobre Israel” ou “o causador do desastre de Israel”
  rationale: Acabe atribui a Elias a aflição de Israel. A tradução preserva a acusação e sua tensão narrativa sem endossar o juízo de Acabe nem decidir se עֹכֵר deve ser entendido apenas como perturbação ou, mais fortemente, como desgraça ou desastre.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A repetição explícita de “Acabe” na segunda oração foi representada pelo sujeito elíptico, natural em português, sem perda de referência. O marcador da nota foi colocado junto de “perturbador de Israel”, termo ao qual a alternativa lexical se refere.
