  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: pt
  text: Que nos deem dois touros. Que eles escolham para si um dos touros, cortem-no em pedaços e o coloquem sobre a lenha, mas não ponham fogo. Eu prepararei o outro touro, o colocarei sobre a lenha e não porei fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: Que nos deem
  rationale: O imperfeito com valor volitivo introduz a proposta de Elias. “Que nos deem” preserva de modo direto tanto a ideia de provisão quanto o pronome de primeira pessoa do plural.
- source_word: שְׁנַיִם פָּרִים
  choice: dois touros
  rationale: פַּר designa um bovino macho, especialmente em contexto sacrificial. “Touros” é claro e evita acrescentar uma indicação de idade que não está explícita no versículo.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: Que eles escolham para si um dos touros
  rationale: בחר significa “escolher”, e לָהֶם assinala que a escolha é feita para o próprio grupo. “Um dos touros” expressa naturalmente que se trata de um entre os dois já mencionados.
- source_word: וִינַתְּחֻהוּ
  choice: cortem-no em pedaços
  rationale: נתח, na preparação sacrificial, indica dividir o animal em partes. A formulação é precisa sem especificar um número de cortes.
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: e o coloquem sobre a lenha
  rationale: שׂים é “pôr/colocar”, e הָעֵצִים designa coletivamente a madeira usada como combustível. “Lenha” comunica esse uso com naturalidade em português.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: mas não ponham fogo por baixo dele
  rationale: O hebraico diz literalmente que não coloquem fogo. “Por baixo dele” explicita a disposição implícita no cenário sacrificial, em que o animal está sobre a lenha; a explicitação é indicada em nota.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: Eu prepararei o outro touro
  rationale: עשה, aplicado aqui ao animal sacrificial, refere-se ao seu preparo. Como um dos dois já foi destinado ao outro grupo, הַפָּר הָאֶחָד aponta naturalmente para “o outro touro”.
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: o colocarei sobre a lenha
  rationale: נתן tem aqui o sentido concreto de pôr ou colocar. A escolha mantém o paralelismo com a ação atribuída ao outro grupo.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: e não porei fogo por baixo dele
  rationale: A tradução mantém o paralelismo com a proibição anterior e explicita da mesma forma a localização contextual do fogo.
theological_decisions:
- issue: Linguagem de preparação sacrificial sem acréscimo de categorias teológicas posteriores
  choice: 'Descrever as ações concretas: cortar em pedaços, colocar sobre a lenha e não pôr fogo'
  alternative: Empregar sistematicamente termos técnicos como “oferecer”, “imolar” ou “dispor como sacrifício”
  rationale: O versículo apresenta os preparativos práticos da prova no Carmelo, sem desenvolver uma interpretação teológica do sacrifício. A tradução conserva as ações expressas no hebraico e não introduz uma doutrina que o texto não formula.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Lenha” foi preferido a “madeira” por indicar com precisão o combustível preparado; “touros” evita regionalismo e especificação indevida de idade.
