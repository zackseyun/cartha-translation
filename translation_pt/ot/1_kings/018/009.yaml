base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: pt
  text: 'Então ele disse: “Que pecado cometi, que você entrega o seu servo nas mãos de Acabe para me matar?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O wayyiqtol dá continuidade à narrativa e introduz a resposta; “Então ele disse” soa natural em português sem acrescentar interpretação indevida.
- source_word: מֶה חָטָאתִי
  choice: Que pecado cometi
  rationale: Reproduz a pergunta idiomática e mantém a força moral e religiosa de חטא, evitando reduzi-la a mero erro ou ofensa.
- source_word: כִּי
  choice: para
  rationale: Neste contexto, introduz o resultado ou propósito implícito na queixa. “Para” expressa com naturalidade a relação entre o suposto pecado e a entrega a Acabe.
- source_word: אַתָּה נֹתֵן
  choice: você entregar
  rationale: O pronome explícito mantém a ênfase em “você”, e “entregar” comunica o sentido contextual do particípio נֹתֵן junto da expressão “nas mãos de Acabe”.
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: É a forma respeitosa e idiomática de autodepreciação diante de um superior; “escravo” destacaria uma condição social que não está em primeiro plano.
- source_word: בְּיַד אַחְאָב
  choice: nas mãos de Acabe
  rationale: Preserva a metáfora hebraica de ficar sob o poder ou controle de alguém, usando a forma idiomática corrente em português.
- source_word: לַהֲמִיתֵנִי
  choice: a fim de me levar à morte
  rationale: Expressa o valor causativo do hifil de מות e o propósito letal, mantendo um registro digno; a formulação direta “me matar” é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala conserva a deferência de “seu servo” e a intensidade da pergunta sem tornar a sintaxe excessivamente literal.
