source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: pt
  text: 'Pela vida de Yahweh, seu Deus, não há nação nem reino em que o meu senhor não tenha mandado procurar você. Quando diziam: “Ele não está aqui”, fez o reino e a nação jurarem que não conseguiam encontrar você.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Tão certo como vive Yahweh, seu Deus
  rationale: Expressa em português natural a fórmula hebraica de juramento que invoca a vida de Yahweh, preservando sua solenidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: não há nação nem reino aonde ... não
  rationale: No contexto do juramento, אִם tem força enfática e elíptica; a formulação nega que exista algum território não vasculhado.
- source_word: גּוֹי וּמַמְלָכָה
  choice: nação nem reino
  rationale: Mantém o par geopolítico do hebraico em linguagem corrente.
- source_word: שָׁלַח ... לְבַקֶּשְׁךָ
  choice: tenha mandado procurar você
  rationale: Reproduz a sequência 'mandar + procurar' sem acrescentar agentes que o texto não explicita.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Designa respeitosamente o rei Acabe, e não Deus; conserva o registro cortesão.
- source_word: וְאָמְרוּ אָיִן
  choice: 'Quando diziam: “Ele não está aqui”'
  rationale: Explicita de modo natural o referente masculino implícito, Elias, e traduz אָיִן como ausência no lugar procurado.
- source_word: וְהִשְׁבִּיעַ
  choice: fazia ... jurarem
  rationale: O hifil de שבע significa obrigar alguém a jurar; o imperfeito iterativo 'fazia' condiz com buscas repetidas.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: que não tinham encontrado você
  rationale: Após o verbo de jurar, כִּי introduz o conteúdo do juramento; o contexto aponta para o resultado de cada busca já realizada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome próprio no texto-fonte e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Força de אִם dentro da fórmula de juramento
  choice: 'Declaração enfática: “não há”'
  alternative: 'Condição literal: “se há”'
  rationale: Aqui a construção de juramento emprega אִם elipticamente para reforçar a negação, não para manifestar incerteza real.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por clareza na referência singular a Elias e “meu senhor” como tratamento régio. Não há marcadores de nota, pois nenhuma nota foi necessária.
