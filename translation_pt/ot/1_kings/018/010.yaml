    issue: Aspecto verbal de וְהִשְׁבִּיעַ
    rationale: '''Fazia ... jurarem'' apresenta a ação como habitual ou iterativa. O verbo hebraico está no perfeito narrativo e, na sequência, é melhor traduzido por ''fez ... jurar'', sem alterar a força causal do hifil.'
  - severity: low
    issue: Uso de 'aonde'
    rationale: Embora o verbo 'mandar' possa admitir destino, a construção dada não expressa esse destino de modo explícito. 'Em que' relaciona com clareza cada nação ou reino ao âmbito da busca e evita uma leitura espacial menos fluente.
  revised_text: 'Pela vida de Yahweh, seu Deus, não há nação nem reino em que o meu senhor não tenha mandado procurar você. Quando diziam: “Ele não está aqui”, fez o reino e a nação jurarem que não conseguiam encontrar você.'
