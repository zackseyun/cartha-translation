id: 1KI.18.22
reference: 1 Kings 18:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: pt
  text: 'Então Elias disse ao povo: “Eu, somente eu, fiquei como profeta de Yahweh[a], mas os profetas de Baal são quatrocentos e cinquenta homens.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Só eu permaneço como profeta de Yahweh”. A declaração de Elias reflete sua posição pública naquele confronto, embora em outros pontos a narrativa mencione profetas que Obadias havia escondido (1Rs 18:4,13).'
    reason: Registra uma tradução alternativa para נוֹתַרְתִּי e preserva a tensão narrativa sem alterar a fala no texto principal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa essa sequência de modo natural em português.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל הָעָם
  choice: ao povo
  rationale: עָם designa aqui o povo de Israel reunido para o confronto.
- source_word: אֲנִי נוֹתַרְתִּי ... לְבַדִּי
  choice: Eu, somente eu, fiquei
  rationale: O pronome explícito אֲנִי, normalmente dispensável na forma verbal hebraica, e לְבַדִּי dão ênfase ao isolamento de Elias. A construção portuguesa preserva essa ênfase sem parecer acidentalmente redundante.
- source_word: נָבִיא לַיהוָה
  choice: como profeta de Yahweh
  rationale: A formulação identifica Elias como profeta pertencente a Yahweh e que fala em seu nome; “como profeta de” representa a relação de modo idiomático.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: mas os profetas de Baal
  rationale: Embora ו possa significar “e”, o contexto estabelece contraste entre o único profeta de Yahweh presente e os numerosos profetas de Baal; “mas” torna explícita essa relação discursiva.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: quatrocentos e cinquenta homens
  rationale: Conserva o número por extenso e representa אִישׁ, termo individualizador usado na contagem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração preserva o nome próprio, sem substituí-lo por um título.
- issue: Afirmação de Elias de que ficou sozinho
  choice: Eu, somente eu, fiquei como profeta de Yahweh
  alternative: Só eu permaneço como profeta de Yahweh
  rationale: A fala de Elias é preservada como aparece neste confronto, sem harmonizá-la no corpo do texto com a informação de 1 Reis 18:4, 13 sobre outros profetas escondidos por Obadias.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição enfática “Eu, somente eu” reproduz a força combinada do pronome explícito e de לְבַדִּי. O nome “Yahweh” é mantido como nome próprio.
