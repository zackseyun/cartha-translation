  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: pt
  text: Quando Jezabel estava exterminando os profetas de Yahweh[a], Obadias tomou cem profetas, escondeu-os, cinquenta homens por caverna[b], e lhes forneceu pão e água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estava eliminando”; mais literalmente, “estava cortando fora” os profetas de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cinquenta homens na caverna”. É provável que o hebraico indique dois grupos de cinquenta, aparentemente escondidos em cavernas separadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: Quando ... estava exterminando
  rationale: A construção com וַיְהִי e infinitivo introduz a circunstância temporal. O hifil de כרת significa literalmente “cortar, eliminar” e, neste contexto, descreve a ação de matar ou exterminar os profetas. A forma progressiva comunica que isso estava em curso.
- source_word: אִיזֶבֶל
  choice: Jezabel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: נְבִיאֵי יְהוָה
  choice: os profetas de Yahweh
  rationale: A cadeia construta é expressa naturalmente em português, preservando o nome divino presente no hebraico.
- source_word: וַיִּקַּח עֹבַדְיָהוּ מֵאָה נְבִאִים
  choice: Obadias tomou cem profetas
  rationale: Mantém o sentido direto de לקח sem acrescentar uma finalidade não expressa; “Obadias” é a forma portuguesa tradicional do nome.
- source_word: וַיַּחְבִּיאֵם
  choice: escondeu-os
  rationale: Tradução direta e natural do hifil de חבא, “esconder, ocultar”.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: cinquenta homens por caverna
  rationale: 'Expressa de maneira concisa a provável força distributiva da frase: os cem profetas foram escondidos em grupos de cinquenta, cada grupo em uma caverna. A forma literal e sua ambiguidade são registradas em nota.'
- source_word: וְכִלְכְּלָם
  choice: e lhes forneceu
  rationale: כלכל denota sustentar ou prover. “Forneceu” combina naturalmente com os dois itens seguintes, pão e água, sem restringir a ação apenas a alimentar.
- source_word: לֶחֶם וָמָיִם
  choice: pão e água
  rationale: Preserva a expressão concreta e direta do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome próprio e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas reconhecíveis no Brasil. A sintaxe mantém o movimento narrativo do hebraico, enquanto as notas preservam a imagem lexical de כרת e a ambiguidade gramatical da referência à caverna.
