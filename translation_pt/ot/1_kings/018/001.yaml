  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: pt
  text: 'Depois de muitos dias, no terceiro ano, a palavra de Yahweh veio a Elias, dizendo: “Vá, apresente-se a Acabe, e eu darei chuva sobre a face da terra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e farei chover sobre a terra”. O hebraico diz literalmente: “e darei chuva sobre a face da terra”.'
    reason: Registra a alternativa idiomática sem ocultar a formulação e a imagem do texto hebraico.
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: Depois de muitos dias
  rationale: Reproduz de modo natural a abertura narrativa e o sentido de um longo intervalo, sem recorrer à fórmula arcaica “e aconteceu que”.
- source_word: וּדְבַר יְהוָה הָיָה אֶל אֵלִיָּהוּ
  choice: a palavra de Yahweh veio a Elias
  rationale: Mantém a fórmula profética tradicional e apresenta o tetragrama como o nome pessoal Yahweh.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: no terceiro ano
  rationale: Tradução direta da expressão temporal, preservando a referência cronológica sem explicitar de que ponto começa a contagem.
- source_word: לֵךְ הֵרָאֵה אֶל אַחְאָב
  choice: Vá, apresente-se a Acabe
  rationale: “Apresente-se” expressa naturalmente o imperativo nifal de ראה, literalmente “seja visto”, no sentido de comparecer diante de Acabe.
- source_word: וְאֶתְּנָה מָטָר
  choice: e eu darei chuva
  rationale: Conserva o verbo נתן, “dar”, e sua apresentação da chuva como dádiva divina, embora “farei chover” seja mais idiomático em português.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face da terra
  rationale: Preserva a imagem hebraica e permite que אֲדָמָה seja entendido como terra ou solo no contexto da seca.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama como nome próprio; “Yahweh” o translitera em vez de substituí-lo por um título.
- issue: Referência temporal de “no terceiro ano”
  choice: Manter a expressão sem explicar o ponto inicial da contagem
  alternative: Explicitar que se trata do terceiro ano da seca ou da permanência de Elias em Sarepta
  rationale: O hebraico não identifica expressamente o marco inicial; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A ordem temporal foi levemente ajustada para soar natural, sem mudar o conteúdo. A formulação “sobre a face da terra” conserva deliberadamente a imagem do original.
