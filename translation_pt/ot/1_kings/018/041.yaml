base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: pt
  text: 'Então Elias disse a Acabe: “Suba, coma e beba, pois se ouve o estrondo da chuva[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o som de uma chuva abundante”. A expressão hebraica é compacta e pode transmitir tanto o estrondo da chuva como a sua grande intensidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade essa sequência em português.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לְאַחְאָב
  choice: a Acabe
  rationale: A preposição לְ marca o destinatário da fala; “Acabe” é a forma tradicional do nome em português.
- source_word: עֲלֵה
  choice: Suba
  rationale: O imperativo de עלה conserva o sentido espacial de subir, adequado ao contexto.
- source_word: אֱכֹל וּשְׁתֵה
  choice: coma e beba
  rationale: Tradução direta e natural dos dois imperativos.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão dada por Elias e mantém o vínculo lógico de modo conciso.
- source_word: קוֹל
  choice: se ouve
  rationale: קוֹל designa som ou ruído. A formulação verbal é idiomática em português e não especifica indevidamente quem o ouve.
- source_word: הֲמוֹן
  choice: estrondo
  rationale: O termo pode indicar tumulto, rugido ou abundância. “Estrondo” preserva a imagem auditiva ligada a קוֹל, enquanto a nota registra a alternativa quantitativa.
- source_word: הַגָּשֶׁם
  choice: da chuva
  rationale: Tradução direta de גֶּשֶׁם, sem ampliar necessariamente o termo para “tempestade”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos. A construção “se ouve” conserva a vividez auditiva do hebraico sem acrescentar “já”, que não aparece explicitamente no texto-fonte.
