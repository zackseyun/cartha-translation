  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: pt
  text: 'Então, dividiram entre si a terra para percorrê-la: Acabe seguiu sozinho por um caminho, e Obadias seguiu sozinho por outro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete literalmente a mesma expressão para os dois: “Acabe seguiu sozinho por um caminho, e Obadias seguiu sozinho por um caminho”. A tradução usa “por outro” na segunda oração para deixar clara, em português natural, a distinção entre as rotas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: dividiram entre si
  rationale: O piel de חלק expressa divisão ou repartição ativa, e לָהֶם, neste contexto distributivo, indica que os dois repartiram a área entre si.
- source_word: אֶת הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ designa aqui a região a ser examinada; “terra” é amplo, corrente e não sugere necessariamente o planeta.
- source_word: לַעֲבָר בָּהּ
  choice: que percorreriam
  rationale: O infinitivo de עבר com בָּהּ indica atravessar ou passar pela região. A oração relativa produz português natural e mantém a ideia de percorrê-la.
- source_word: הָלַךְ
  choice: seguiu
  rationale: הלך descreve o deslocamento de cada homem por sua rota. “Seguiu” combina naturalmente com “por um caminho” sem determinar se iam a pé.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: por um caminho / por outro
  rationale: A expressão hebraica repete literalmente “por um caminho” para cada homem. Em português, “um... outro” explicita de modo natural a distribuição por rotas distintas.
- source_word: לְבַדּוֹ
  choice: sozinho
  rationale: לְבַדּוֹ enfatiza que cada um foi separadamente; “sozinho” é claro, atual e fiel ao contexto.
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
