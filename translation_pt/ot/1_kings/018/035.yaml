base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: pt
  text: A água correu ao redor do altar[a] e também encheu de água a vala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fluiu ao redor do altar”. O verbo hebraico significa literalmente “foi”, empregado aqui para o movimento da água.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “canal” ou “fosso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: correu
  rationale: Embora o verbo hebraico signifique literalmente “foi/andou”, tendo “a água” como sujeito descreve seu movimento; “correu” é idiomático e vívido em português.
- source_word: הַמַּיִם
  choice: a água
  rationale: O substantivo hebraico tem forma plural, mas é naturalmente vertido como substantivo massivo singular em português.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: ao redor do altar
  rationale: Expressa de modo natural o movimento da água em torno do altar, sem acrescentar uma precisão ausente do texto.
- source_word: וְגַם
  choice: e também
  rationale: Preserva a adição enfática da segunda oração.
- source_word: אֶת־הַתְּעָלָה
  choice: a vala
  rationale: No contexto, תְּעָלָה designa a escavação feita em torno do altar; “vala” é claro e corrente em português.
- source_word: מִלֵּא מָיִם
  choice: encheu de água
  rationale: Reproduz o sentido do verbo “encher” com construção idiomática em português.
