  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: pt
  text: 'Então ele disse: “Encham quatro jarros[a] de água e derramem a água sobre o holocausto e sobre a lenha.” Então ele disse: “Façam isso pela segunda vez”, e eles fizeram isso pela segunda vez. Então ele disse: “Façam isso pela terceira vez”, e eles fizeram isso pela terceira vez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cântaros”; o termo hebraico se refere a um recipiente usado para transportar líquidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse / Depois disse / Então disse
  rationale: O waw consecutivo faz a narrativa avançar. A variação discreta entre “então” e “depois” evita repetição pesada sem perder a sequência das ordens.
- source_word: מִלְאוּ
  choice: Encham
  rationale: Imperativo masculino plural de מלא; “encham” transmite de modo direto e natural a ordem dirigida a várias pessoas.
- source_word: אַרְבָּעָה כַדִּים
  choice: quatro jarros[a]
  rationale: כַּדִּים designa recipientes para transportar líquidos. “Jarros” é claro em português contemporâneo e não define em excesso o formato; a nota registra uma alternativa possível.
- source_word: מַיִם
  choice: água
  rationale: Correspondência direta do substantivo comum hebraico.
- source_word: וְיִצְקוּ
  choice: e derramem a água
  rationale: A forma dá continuidade à ordem no plural. Repetir “a água” é mais natural e inequívoco em português do que empregar um pronome potencialmente ambíguo.
- source_word: עַל הָעֹלָה
  choice: sobre o holocausto
  rationale: עַל indica aqui o destino físico da água, e “holocausto” é o termo sacrificial tradicional e conciso em português para עֹלָה.
- source_word: וְעַל הָעֵצִים
  choice: e sobre a lenha
  rationale: No contexto do altar, עֵצִים refere-se à madeira preparada para o sacrifício; “lenha” é a formulação portuguesa mais natural.
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: Façam isso pela segunda vez / e eles o fizeram pela segunda vez
  rationale: A tradução explicita a segunda execução da ação e conserva o paralelismo entre ordem e cumprimento.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: Façam isso pela terceira vez / e eles o fizeram pela terceira vez
  rationale: As formas de שלשׁ indicam realizar a ação pela terceira vez; a redação preserva claramente a progressão numérica hebraica.
theological_decisions:
- issue: Tradução do termo sacrificial עֹלָה
  choice: holocausto
  alternative: oferta queimada por inteiro
  rationale: “Holocausto” é o equivalente bíblico consagrado em português para o sacrifício inteiramente consumido no altar. A alternativa é explicativa, mas acrescentaria palavras não expressas neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos no plural mantêm a fala direta, e a repetição intencional de “pela segunda vez” e “pela terceira vez” conserva o ritmo narrativo do hebraico.
