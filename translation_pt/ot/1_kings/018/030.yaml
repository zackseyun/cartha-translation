base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: pt
  text: 'Então Elias disse a todo o povo: “Aproximem-se de mim.” Todo o povo se aproximou dele, e ele reparou[a] o altar de Yahweh que havia sido derrubado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “restaurou”; o verbo hebraico significa literalmente “curou”.
    reason: Registra tanto uma alternativa idiomática quanto a metáfora lexical de רפא, que não pode ser reproduzida literalmente aqui sem soar estranha.
lexical_decisions:
- source_word: גְּשׁוּ
  choice: Aproximem-se de mim
  rationale: O imperativo de נגשׁ pede que o povo se achegue fisicamente a Elias; “aproximem-se” preserva o sentido direcional em português natural.
- source_word: וַיִּגְּשׁוּ
  choice: se aproximou dele
  rationale: Repete a mesma raiz portuguesa usada na ordem de Elias, mostrando seu cumprimento imediato; o verbo no singular concorda naturalmente com o coletivo “todo o povo”.
- source_word: וַיְרַפֵּא
  choice: reparou
  rationale: רפא significa literalmente “curar”, mas, tendo um altar como objeto, indica torná-lo novamente íntegro. “Reparou” é claro e concreto, sem apagar a metáfora hebraica, registrada em nota.
- source_word: מִזְבַּח יְהוָה
  choice: o altar de Yahweh
  rationale: Reproduz a relação construta e conserva o nome divino como nome pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama em vez de substituí-lo por um título, preservando o nome divino presente no texto hebraico.
- source_word: הֶהָרוּס
  choice: que havia sido derrubado
  rationale: O particípio passivo de הרס descreve algo demolido ou posto abaixo; a forma composta expressa com clareza que a destruição precedeu o reparo.
- source_word: וַיֹּאמֶר
  choice: Então Elias disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” comunica essa sequência em português corrente.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: É a forma idiomática portuguesa para o coletivo hebraico e mantém sua abrangência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto, sem substituí-lo por um título ou adotar outra forma tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “aproximem-se / se aproximou” conserva a correspondência narrativa do hebraico. A colocação do marcador após “reparou” liga corretamente a nota ao termo comentado.
