  terminology: «Jezabel», «Yahweh», «profetas» e «pão e água» são adequados. «Meu senhor» mantém o tratamento deferente sem transformar o termo em título divino. «Cinquenta homens em cada caverna» exprime naturalmente a distribuição; a nota preserva as possibilidades de formulação associadas ao singular hebraico.
