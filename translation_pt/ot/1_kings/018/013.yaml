base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: pt
  text: Não foi contado ao meu senhor o que fiz quando Jezabel estava matando os profetas de Yahweh — como escondi cem homens dentre os profetas de Yahweh, cinquenta homens em cada caverna[a], e lhes forneci pão e água?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cinquenta homens numa caverna” ou “em duas turmas de cinquenta, em cavernas”. O hebraico expressa uma distribuição em grupos de cinquenta, mas usa “caverna” no singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: Por acaso não contaram ao meu senhor
  rationale: A pergunta retórica espera resposta afirmativa. A construção ativa impessoal com “contaram” é natural em português e preserva o sentido do passivo hebraico; “meu senhor” é tratamento respeitoso dirigido a Elias.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי
  choice: o que fiz
  rationale: Tradução direta e idiomática da oração relativa objetiva.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: quando Jezabel estava matando
  rationale: A preposição com o infinitivo construto tem valor temporal; a forma progressiva comunica uma ação em curso no período em que Obadias interveio.
- source_word: נְבִיאֵי יְהוָה
  choice: os profetas de Yahweh
  rationale: Mantém a relação de posse e translitera o nome divino expresso no texto hebraico.
- source_word: וָאַחְבִּא מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: Escondi cem homens dentre os profetas de Yahweh
  rationale: “Dentre” preserva o valor partitivo de מִן, e “homens” representa explicitamente אִישׁ.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: em grupos de cinquenta numa caverna
  rationale: A repetição do numeral expressa distribuição em grupos de cinquenta. A formulação conserva o singular “caverna” sem decidir silenciosamente se havia uma ou mais cavernas.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: e lhes forneci pão e água
  rationale: O verbo denota sustentar ou prover; “forneci” é natural e mantém os itens concretos mencionados no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” o representa de modo transparente, sem substituí-lo por um título.
- issue: Número de cavernas
  choice: manter a formulação ambígua no texto e explicá-la em nota
  alternative: em cada caverna; em duas cavernas
  rationale: O hebraico emprega o singular בַּמְּעָרָה junto de uma expressão distributiva. Especificar “cada” ou “duas” resolveria uma questão que a forma hebraica não explicita plenamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A pergunta retórica foi mantida; a fala respeitosa de Obadias a Elias usa “meu senhor”. A pontuação em duas frases evita uma construção excessivamente longa sem alterar o conteúdo do discurso.
