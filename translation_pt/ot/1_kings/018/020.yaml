  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: pt
  text: Então Acabe mandou uma mensagem a todos os filhos de Israel e reuniu os profetas no monte Carmelo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a todos os israelitas”. O hebraico diz literalmente “a todos os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou uma mensagem
  rationale: O verbo significa literalmente “enviou/mandou”; como o destinatário é introduzido por בְּ, o contexto indica o envio de uma comunicação. Esta formulação é natural em português sem transformar o verbo em “convocou”.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: a todos os filhos de Israel
  rationale: Preserva a expressão familiar masculina do hebraico, enquanto a preposição é expressa naturalmente como indicação dos destinatários.
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: Expressa de modo direto e idiomático a ação de juntar ou congregar pessoas.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Equivalente padrão e preciso do substantivo hebraico plural.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: no monte Carmelo
  rationale: Em português, “reunir alguém no monte Carmelo” exprime naturalmente o destino e local da reunião indicados por אֶל; “monte Carmelo” é a designação geográfica convencional.
