base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: pt
  text: 'Enquanto Obadias seguia pelo caminho, eis que Elias vinha ao encontro dele. Ao reconhecê-lo, Obadias prostrou-se com o rosto em terra e disse: “É você mesmo, meu senhor Elias?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva o marcador hebraico de atenção e a súbita aparição de Elias, em linguagem bíblica ainda compreensível.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: Expressa o movimento de Elias em direção a Obadias sem reduzir a construção a um encontro meramente estático.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: prostrou-se com o rosto em terra
  rationale: Comunica naturalmente o gesto corporal de reverência indicado literalmente por cair sobre o rosto.
- source_word: הַאַתָּה זֶה
  choice: É você mesmo
  rationale: Reproduz a pergunta de reconhecimento enfático de modo natural em português, sem transformá-la numa simples pergunta de identidade.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Mantém o título respeitoso dirigido a Elias, distinguindo-o do nome divino.
theological_decisions:
- issue: Natureza da reverência de Obadias diante de Elias
  choice: Descrever o gesto como prostração, sem qualificá-lo teologicamente
  alternative: Interpretá-lo explicitamente como adoração ou apenas como saudação
  rationale: O texto relata uma postura de profunda deferência, mas não determina por si só que se trate de culto; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência bíblica em “eis que”. O nome “Obadias” é repetido na segunda frase para evitar ambiguidade pronominal em português.
