  text: Then he arranged the wood, cut the bull into pieces, and placed it on the wood.
translation:
  language: pt
  text: Então ele dispôs a lenha, cortou o touro em pedaços e o colocou sobre a lenha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: arrumou
  rationale: O verbo ערך indica dispor ou pôr em ordem. “Arrumou” é natural em português e expressa adequadamente a preparação da lenha sobre o altar.
- source_word: הָעֵצִים
  choice: a lenha
  rationale: Embora a forma hebraica seja plural, “lenha” é o coletivo idiomático em português para a madeira usada como combustível no altar.
- source_word: וַיְנַתַּח
  choice: cortou ... em pedaços
  rationale: נתח descreve a divisão de um animal em partes, especialmente na preparação sacrificial. A expressão escolhida é clara e preserva a ação específica.
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho usado em sacrifício. “Novilho” é uma tradução corrente e digna no contexto cultual, sem exigir a ideia de um animal plenamente adulto.
- source_word: וַיָּשֶׂם
  choice: o colocou
  rationale: שׂים significa pôr ou colocar. O pronome retoma naturalmente o novilho já cortado em pedaços, enquanto “colocou” comunica a ação deliberada.
- source_word: עַל הָעֵצִים
  choice: sobre a lenha
  rationale: עַל expressa aqui uma relação espacial direta. “Sobre a lenha” é natural e levemente mais preciso no registro narrativo do que apenas “na lenha”.
