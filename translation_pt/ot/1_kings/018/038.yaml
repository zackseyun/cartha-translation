  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּפֹּ֣ל אֵשׁ יְהוָ֗ה וַ/תֹּ֤אכַל אֶת הָֽ/עֹלָה֙ וְ/אֶת הָ֣/עֵצִ֔ים וְ/אֶת הָ/אֲבָנִ֖ים וְ/אֶת הֶ/עָפָ֑ר וְ/אֶת הַ/מַּ֥יִם אֲשֶׁר בַּ/תְּעָלָ֖ה לִחֵֽכָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: pt
  text: Então o fogo de Yahweh[a] caiu e consumiu o holocausto, a lenha, as pedras e o pó; e lambeu a água que estava na vala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fogo vindo de Yahweh». O hebraico também pode ser entendido como uma ênfase na procedência divina do fogo.'
    reason: alternativa lexical
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: o fogo de Yahweh
  rationale: A justaposição associa diretamente o fogo a Yahweh. A formulação preserva essa relação sem decidir se a ênfase recai sobre posse, caráter ou procedência; a alternativa de procedência é registrada em nota.
- source_word: וַתִּפֹּל
  choice: caiu
  rationale: Mantém a imagem concreta do verbo נפל e sugere naturalmente fogo vindo do alto.
- source_word: וַתֹּאכַל
  choice: consumiu
  rationale: Embora o sentido básico seja «comeu», «consumiu» é a expressão idiomática em português para a ação do fogo.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: No contexto sacrificial, עֹלָה designa a oferta inteiramente queimada. «Holocausto» é o termo bíblico tradicional e conciso em português.
- source_word: הָעֵצִים
  choice: a lenha
  rationale: O plural hebraico refere-se à madeira disposta sobre o altar; «lenha» é coletivo natural e específico neste contexto.
- source_word: הָאֲבָנִים
  choice: as pedras
  rationale: Tradução direta, preservando a intensidade extraordinária da cena.
- source_word: הֶעָפָר
  choice: o pó
  rationale: Preserva a imagem vívida de עָפָר como terra solta ou pó, sem generalizá-la para «solo».
- source_word: לִחֵכָה
  choice: lambeu
  rationale: Conserva a metáfora vigorosa do verbo לָחַך, em vez de repeti-lo como «consumiu».
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: a água que estava na vala
  rationale: תְּעָלָה indica a vala ou canal aberto ao redor do altar; «vala» é concreto e natural em português.
- source_word: וַ
  choice: Então
  rationale: Comunica de modo natural o avanço e o clímax da sequência narrativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pactual יְהוָה. «Yahweh» o representa como nome próprio, sem substituí-lo por um título.
- issue: Relação expressa por אֵשׁ יְהוָה
  choice: o fogo de Yahweh
  alternative: fogo vindo de Yahweh
  rationale: A construção hebraica associa o fogo a Yahweh, mas não marca explicitamente uma preposição de procedência. O texto principal mantém a formulação mais formal, e a nota registra a leitura que destaca a origem divina.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. «Holocausto» preserva a terminologia sacrificial consolidada; «lambeu» mantém a imagem poética e dramática do hebraico.
