  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: pt
  text: Agora, mande reunir junto a mim todo o Israel no monte Carmelo[a], bem como os quatrocentos e cinquenta profetas de Baal e os quatrocentos profetas de Aserá[b], que comem à mesa de Jezabel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao monte Carmelo”. A preposição hebraica indica movimento em direção ao lugar da reunião.'
    reason: lexical_alternative
  - marker: b
    text: “Aserá” pode designar a deusa Aserá ou, em alguns contextos, um objeto de culto associado a ela. Aqui, o paralelo com “Baal” favorece a referência à divindade.
    reason: cultural_note
  - marker: c
    text: A expressão também pode ser traduzida por “que fazem suas refeições à mesa de Jezabel”; indica que eram sustentados por seu patrocínio real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a ordem imediata de Elias com naturalidade em português moderno; a conjunção inicial não precisa ser reproduzida mecanicamente.
- source_word: שְׁלַח קְבֹץ
  choice: mande reunir
  rationale: A sequência de imperativos indica que Acabe deve enviar ordens ou mensageiros para efetuar a reunião; esta construção preserva essa relação de modo idiomático.
- source_word: אֵלַי
  choice: diante de mim
  rationale: Expressa que a assembleia deve comparecer perante Elias. A alternativa mais formal e estritamente direcional seria “até mim”.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a designação coletiva e nacional, sem reduzir sua força retórica nem exigir que cada indivíduo esteja presente.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: no monte Carmelo
  rationale: Indica em português o local previsto para a reunião; o hebraico usa uma preposição direcional, razão pela qual a alternativa “ao monte Carmelo” é registrada em nota.
- source_word: נְבִיאֵי הַבַּעַל
  choice: profetas de Baal
  rationale: Reproduz claramente a relação dos profetas com a divindade Baal.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: profetas de Aserá
  rationale: O paralelismo com Baal favorece aqui o nome da divindade, sem eliminar em nota a ambiguidade lexical presente em outros contextos.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: que comem à mesa de Jezabel
  rationale: Preserva a imagem concreta do hebraico e sugere, sem explicitação excessiva, que esses profetas eram sustentados pelo patrocínio real de Jezabel.
theological_decisions:
- issue: Sentido de אֲשֵׁרָה neste versículo
  choice: Aserá como nome da divindade
  alternative: Aserá como objeto ou símbolo de culto associado à divindade
  rationale: O paralelismo com “profetas de Baal” favorece uma referência pessoal/divina. A nota preserva a ambiguidade lexical mais ampla sem inserir no texto uma identificação debatida.
- issue: Alcance de “todo o Israel”
  choice: Manter a expressão coletiva nacional
  alternative: Explicitar “todos os israelitas” ou “representantes de todo o Israel”
  rationale: O hebraico emprega uma designação nacional retoricamente abrangente. A tradução não a transforma nem em uma afirmação distributiva rígida nem em uma representação explicitada que o texto não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão da ordem, a designação coletiva “todo o Israel” e a imagem de comer à mesa de Jezabel. Os números são escritos por extenso, em estilo literário.
