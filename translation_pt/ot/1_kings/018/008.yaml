base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: pt
  text: 'E ele lhe disse: “Sou eu[a]. Vá dizer ao seu senhor: ‘Elias está aqui.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou eu mesmo.” O hebraico traz o pronome enfático “eu”, usado aqui como autoidentificação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: E ele lhe disse
  rationale: O wayyiqtol dá sequência à narrativa, e לֹו marca o destinatário. A formulação preserva o fluxo hebraico em português natural.
- source_word: אָנִי
  choice: Sou eu
  rationale: O pronome independente funciona como identificação enfática em resposta ao reconhecimento de Obadias. “Sou eu” é a forma idiomática e direta em português.
- source_word: לֵךְ אֱמֹר
  choice: Vá dizer
  rationale: Os dois imperativos são mantidos; em português, “vá dizer” expressa naturalmente a ordem sequencial.
- source_word: לַאדֹנֶיךָ
  choice: ao seu senhor
  rationale: אָדוֹן designa Acabe como superior humano de Obadias. “Senhor” comunica essa relação com naturalidade; a minúscula evita confusão com o título divino.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Elias está aqui
  rationale: הִנֵּה chama a atenção para a presença de Elias. A construção existencial “está aqui” transmite sua força de modo corrente, sem o arcaísmo de “eis”.
theological_decisions:
- issue: Sentido de אָדוֹן para um superior humano
  choice: senhor
  alternative: amo
  rationale: O referente é Acabe, autoridade terrena de Obadias. “Senhor”, em minúscula, é digno e corrente, enquanto “amo” pode sugerir de forma excessivamente específica uma relação de escravidão.
- issue: Forma elíptica de autoidentificação em אָנִי
  choice: Sou eu
  alternative: Eu
  rationale: O hebraico traz apenas o pronome enfático, mas sua função contextual é de autoidentificação. A formulação portuguesa fornece a cópula exigida pelo idioma sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a concisão e a sequência imperativa do hebraico; usa “senhor” em minúscula para a autoridade humana e verte הִנֵּה por uma expressão de presença natural no contexto.
