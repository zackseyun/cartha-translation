base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/002.yaml
  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: pt
  text: Então Elias foi se apresentar a Acabe.[a] A fome era severa em Samaria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aparecer diante de Acabe” ou “mostrar-se a Acabe”.
    reason: lexical_alternative
  - marker: b
    text: Ou “A fome era intensa em Samaria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ... foi
  rationale: O waw consecutivo faz a narrativa avançar e, neste contexto, dá continuidade ao resultado da ordem divina no versículo anterior. “Então” expressa essa progressão com naturalidade.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: se apresentar a Acabe
  rationale: O infinitivo nifal de ראה tem aqui sentido de aparecer, mostrar-se ou apresentar-se. “Se apresentar a” é natural em português e preserva a ação voluntária de comparecer diante de Acabe.
- source_word: וְהָרָעָב
  choice: A fome
  rationale: O waw introduz uma informação circunstancial de pano de fundo, não necessariamente outra ação sucessiva. Uma nova frase sem conectivo explicita isso naturalmente em português.
- source_word: חָזָק
  choice: era severa
  rationale: Embora חָזָק tenha o sentido básico de “forte”, aplicado à fome descreve sua gravidade ou intensidade. “Severa” é idiomático e preciso.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição ב marca localização. “Em Samaria” mantém aberta a possibilidade contextual de referência à cidade ou ao território associado a ela.
