  text: וַ/יַּעֲלֶ֥ה אַחְאָ֖ב לֶ/אֱכֹ֣ל וְ/לִ/שְׁתּ֑וֹת וְ/אֵ֨לִיָּ֜הוּ עָלָ֨ה אֶל רֹ֤אשׁ הַ/כַּרְמֶל֙ וַ/יִּגְהַ֣ר אַ֔רְצָ/ה וַ/יָּ֥שֶׂם פָּנָ֖י/ו בֵּ֥ין ברכ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: pt
  text: Então Acabe subiu para comer e beber. Elias, porém,[a] subiu ao topo do Carmelo[b] e, curvando-se até o chão, pôs o rosto entre os joelhos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “E Elias”; a conjunção hebraica é simplesmente “e”, embora o contexto contraste a ação de Elias com a de Acabe.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao cume do Carmelo” ou “ao topo do monte Carmelo”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico descreve a postura física de Elias. O contexto mais amplo sugere oração, mas este versículo não diz isso explicitamente.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: subiu
  rationale: O verbo עלה indica movimento para cima; “subiu” é natural e preserva o sentido direcional.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: para comer e beber
  rationale: Os infinitivos expressam finalidade. Em português, não é necessário repetir “para” diante do segundo verbo.
- source_word: וְאֵלִיָּהוּ
  choice: Elias, porém
  rationale: A conjunção hebraica é literalmente “e”, mas aqui coordena ações contrastantes. “Porém” torna esse contraste natural em português sem alterar o conteúdo.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: subiu ao topo do Carmelo
  rationale: רֹאשׁ, literalmente “cabeça”, designa aqui o topo ou cume. “Carmelo” mantém o nome próprio sem acrescentar “monte”, ausente nesta expressão hebraica.
- source_word: וַיִּגְהַר אַרְצָה
  choice: curvando-se até o chão
  rationale: O verbo raro גהר descreve a ação de inclinar-se ou curvar-se para baixo. A formulação comunica a postura física sem interpretá-la explicitamente como oração.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: pôs o rosto entre os joelhos
  rationale: Tradução concreta e idiomática da postura descrita no hebraico.
theological_decisions:
- issue: Se a postura de Elias deve ser identificada explicitamente como oração
  choice: Manter apenas a descrição física
  alternative: “curvou-se em oração” ou “orou com o rosto entre os joelhos”
  rationale: O contexto mais amplo sugere oração, mas este versículo não a menciona expressamente. A tradução evita transformar uma inferência contextual em afirmação textual.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada com “Elias, porém” para expressar o contraste discursivo. Evitou-se acrescentar “monte” e “oração” ao texto principal.
