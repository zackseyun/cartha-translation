revisions:
- from: 'Acabe disse a Obadias: “Percorra a terra, indo a todas as fontes de água e a todos os cursos de água sazonais.[a] Talvez encontremos capim e consigamos manter vivos os cavalos e as mulas, para não termos de eliminar parte dos animais.”[b]'
  to: 'Acabe disse a Obadias: “Percorra a terra e vá a todas as fontes de água e a todos os uádis.[a] Talvez encontremos pasto e consigamos manter vivos os cavalos e as mulas, para não termos de eliminar parte dos animais.[b]”'
  rationale: A revisão emprega “uádis” com explicação lexical para manter a amplitude geográfica de נחל no cenário de seca. Também reposiciona as âncoras junto aos termos a que se referem e corrige a distinção entre tradução literal e explicação na nota b. “Pasto” comunica de forma internacional e natural a vegetação usada para alimentar os animais, sem pressupor feno cortado.
