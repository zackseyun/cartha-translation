  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל עֹ֣בַדְיָ֔הוּ לֵ֤ךְ בָּ/אָ֨רֶץ֙ אֶל כָּל מַעְיְנֵ֣י הַ/מַּ֔יִם וְ/אֶ֖ל כָּל הַ/נְּחָלִ֑ים אוּלַ֣י נִמְצָ֣א חָצִ֗יר וּ/נְחַיֶּה֙ ס֣וּס וָ/פֶ֔רֶד וְ/ל֥וֹא נַכְרִ֖ית מֵ/הַ/בְּהֵמָֽה־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: pt
  text: 'Acabe disse a Obadias: “Percorra a terra e vá a todas as fontes de água e a todos os uádis.[a] Talvez encontremos pasto e consigamos manter vivos os cavalos e as mulas, para não termos de eliminar parte dos animais.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “riachos” ou “leitos de torrentes”. O termo hebraico pode indicar um curso de água, muitas vezes sazonal, ou o seu leito; “uádis” designa esses cursos ou leitos sazonais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para que não eliminemos/cortemos do rebanho [ou dos animais]”. A expressão provavelmente se refere à necessidade de reduzir o número de animais por falta de alimento.
    reason: lexical_clarification
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: Percorra a terra
  rationale: Com o verbo de movimento, ב indica deslocamento pela região; “percorrer” comunica naturalmente a busca por toda a terra.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: fontes de água
  rationale: Preserva a referência concreta a nascentes ou fontes naturais de água em português corrente.
- source_word: הַנְּחָלִים
  choice: cursos de água sazonais
  rationale: נחל pode designar tanto o leito quanto o curso de água, frequentemente sazonal. A expressão comunica o dado geográfico sem depender do termo técnico “uádi”.
- source_word: אוּלַי נִמְצָא
  choice: Talvez encontremos
  rationale: Mantém a incerteza e a intenção conjunta expressas pela forma hebraica.
- source_word: חָצִיר
  choice: capim
  rationale: No contexto, refere-se à vegetação usada como alimento para animais; “capim” é natural e claro para leitores brasileiros, sem sugerir feno já cortado e seco.
- source_word: וּנְחַיֶּה סוּס וָפֶרֶד
  choice: e consigamos manter vivos os cavalos e as mulas
  rationale: O hifil de חיה expressa conservar com vida. O plural coletivo é mais natural em português do que os singulares hebraicos.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: para não termos de eliminar parte dos animais
  rationale: כרת significa literalmente “cortar/eliminar”, e מן tem valor partitivo. A formulação preserva a ideia de reduzir o rebanho sem afirmar além do texto o meio exato dessa eliminação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Cursos de água sazonais” explicita o provável sentido contextual de נחל; “eliminar parte dos animais” conserva tanto a força de כרת quanto o valor partitivo de מן.
