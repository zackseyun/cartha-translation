base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: pt
  text: Acabe chamou Obadias, que era responsável pela casa real.[a] Obadias temia muito a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «que estava sobre a casa»; expressão que designa um alto funcionário responsável pela casa real. Também pode ser traduzida por «que estava encarregado do palácio».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: chamou
  rationale: קרא com אֶל indica que Acabe mandou chamar Obadias. “Chamou” é natural e não acrescenta a força coercitiva de “convocou”.
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: que estava encarregado da administração do palácio
  rationale: A expressão literalmente diz “que estava sobre a casa” e designa um alto oficial responsável pela casa real; a formulação torna a função clara sem reduzi-la ao cuidado do edifício.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: temia ... a Yahweh
  rationale: O imperfeito de estado com ירא descreve uma característica constante de Obadias. “Temia” preserva tanto o sentido de temor quanto o de reverência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְאֹד
  choice: muito
  rationale: Reproduz de modo simples e natural a forte intensificação adverbial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” preserva esse fato textual sem substituí-lo pelo título “Senhor”.
- issue: Sentido de ירא em relação a Yahweh
  choice: temia
  alternative: reverenciava
  rationale: “Temia” conserva a tensão semântica do hebraico, que inclui temor reverente; “reverenciava” explicaria apenas uma parte do sentido.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação funcional no primeiro período evita o pouco claro “sobre a casa”; o segundo mantém a linguagem bíblica direta e a intensidade do hebraico.
