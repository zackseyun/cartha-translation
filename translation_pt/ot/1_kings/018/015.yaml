id: 1KI.18.15
reference: 1 Kings 18:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: pt
  text: 'E Elias disse: “Tão certo como vive Yahweh dos Exércitos, em cuja presença estou, hoje certamente me apresentarei a ele[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aparecerei diante dele” ou “me deixarei ver por ele”. O verbo hebraico pode significar ser visto, aparecer ou apresentar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz em português natural e solene a fórmula hebraica de juramento, deixando claro que a afirmação seguinte é garantida pela vida de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Conserva a amplitude do título divino hebraico, que pode abranger hostes ou exércitos sem especificar aqui se são terrenos ou celestiais.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: em cuja presença estou
  rationale: Mantém a imagem de estar diante de um superior e comunica naturalmente a posição de Elias como servo e profeta na presença divina.
- source_word: כִּי הַיּוֹם
  choice: hoje certamente
  rationale: O juramento introduz uma garantia enfática; “certamente” torna explícita essa força asseverativa sem alterar o conteúdo temporal de “hoje”.
- source_word: אֵרָאֶה אֵלָיו
  choice: me apresentarei a ele
  rationale: 'Expressa o sentido contextual do nifal de ראה: deixar-se ver, comparecer ou apresentar-se diante de Acabe, por iniciativa deliberada.'
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” preserva-o como nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: das hostes; dos exércitos celestiais
  rationale: A tradução não restringe o título exclusivamente a seres celestiais, pois o termo hebraico conserva maior amplitude.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A fórmula “Tão certo como vive” comunica o juramento de modo idiomático; “em cuja presença estou” preserva a linguagem de corte ligada ao ministério profético. O marcador da nota foi colocado junto à expressão ambígua a que se refere.
