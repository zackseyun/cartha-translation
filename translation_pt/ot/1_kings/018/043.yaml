  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: pt
  text: 'Então, ele disse ao seu servo[a]: “Por favor, suba e olhe na direção do mar[b].” Ele subiu, olhou e disse: “Não há nada.” Então ele disse: “Volte sete vezes[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu moço” ou “seu atendente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “olhe para o mar”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, volte e olhe novamente, repetindo a ação até completar sete vezes.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: seu ajudante
  rationale: נַעַר pode designar um jovem, servo ou assistente. Neste contexto, trata-se de alguém que acompanha Elias e cumpre suas instruções; “ajudante” comunica essa função em português corrente sem definir além do texto sua condição social.
- source_word: עֲלֵה נָא
  choice: Por favor, suba
  rationale: O imperativo עֲלֵה indica movimento para cima, e נָא suaviza ou reforça o pedido. A formulação preserva tanto o movimento quanto o tom cortês.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: olhe na direção do mar
  rationale: הַבֵּט significa “olhe”, enquanto דֶּרֶךְ יָם expressa orientação espacial em direção ao mar. A tradução é clara e próxima da forma hebraica.
- source_word: אֵין מְאוּמָה
  choice: Não há nada
  rationale: A expressão constitui uma negação enfática de que algo esteja visível. “Não há nada” é natural, conciso e fiel ao contexto.
- source_word: שֻׁב
  choice: Volte
  rationale: שׁוּב significa voltar ou retornar. Aqui, a ordem exige que o ajudante repita o percurso e a observação, sentido que a nota explicita sem substituir o verbo do texto.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Expressão numérica direta que indica repetição; a tradução mantém a concisão do hebraico.
