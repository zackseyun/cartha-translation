  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: pt
  text: Quando eu me afastar de você, o Espírito de Yahweh poderá levar você para algum lugar que eu não conheça.[a] Então, quando eu for informar Acabe e ele não encontrar você, ele me matará. E o seu servo teme Yahweh desde a minha juventude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o vento de Yahweh poderá levar você”. O termo hebraico רוּחַ pode significar “espírito”, “vento” ou “sopro”; neste contexto, “Espírito” parece ser o sentido mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: E acontecerá que, quando eu me afastar de você
  rationale: Preserva a introdução contingente e futura de וְהָיָה, enquanto traduz a partida da presença de Elias em português natural.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: רוּחַ admite 'espírito', 'vento' ou 'sopro'; no contexto de ação divina que transporta o profeta, 'Espírito' é a leitura principal, sem ocultar a alternativa lexical na nota.
- source_word: יִשָּׂאֲךָ
  choice: poderá levar você
  rationale: נשא significa erguer, carregar ou levar. O modal 'poderá' expressa o temor contingente de Obadias no contexto, embora a forma hebraica seja um imperfeito simples.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: para algum lugar que eu não conheça
  rationale: Explicita de modo idiomático o destino desconhecido indicado pela expressão hebraica.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: Então irei contar a Acabe
  rationale: Representa a ação sequencial de Obadias ir informar Acabe, sem sobrecarregar a frase em português.
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: mas ele não encontrará você e me matará
  rationale: Mantém a consequência futura temida por Obadias; 'mas' comunica naturalmente o contraste pragmático da sequência.
- source_word: וְעַבְדְּךָ
  choice: E o seu servo
  rationale: É uma autodesignação respeitosa dirigida a Elias; 'servo' preserva o registro de deferência.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: teme Yahweh desde a juventude
  rationale: O particípio/adjetivo יָרֵא descreve uma disposição contínua de temor reverente, iniciada na juventude e ainda vigente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  alternative: o vento de Yahweh
  rationale: A agência divina no transporte de Elias favorece 'Espírito', mas a polissemia real de רוּחַ é preservada em nota.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio presente no texto hebraico, sem convertê-lo em título.
- issue: Valor temporal de יָרֵא ... מִנְּעֻרָי
  choice: teme Yahweh desde a juventude
  alternative: temeu Yahweh desde a juventude
  rationale: A construção apresenta o temor reverente como característica iniciada no passado e ainda válida no momento da fala.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de ampla compreensão internacional e boa legibilidade brasileira. Mantém 'Yahweh' como nome próprio e evita linguagem denominacional.
