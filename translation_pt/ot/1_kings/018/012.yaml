revisions:
- from: E acontecerá que, quando eu me afastar de você, o Espírito de Yahweh poderá levar você para algum lugar que eu não conheça.[a] Então irei contar a Acabe, mas ele não encontrará você e me matará. E o seu servo teme Yahweh desde a juventude.
  to: Quando eu me afastar de você, o Espírito de Yahweh poderá levar você para algum lugar que eu não conheça.[a] Então, quando eu for informar Acabe e ele não encontrar você, ele me matará. E o seu servo teme Yahweh desde a minha juventude.
  rationale: A revisão restaura o possessivo exigido por מִנְּעֻרָי, torna explícita a ida de Obadias para informar Acabe e substitui uma construção excessivamente literal por sintaxe portuguesa natural. Mantêm-se a tradução principal “Espírito de Yahweh” e a alternativa lexical na nota, sem resolver além do necessário a ambiguidade de רוּחַ.
  reviewer_model: gpt-5.6-terra
