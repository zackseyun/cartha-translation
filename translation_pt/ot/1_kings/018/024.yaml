base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: pt
  text: '“Então invoquem o nome do seu deus[a], e eu invocarei o nome de Yahweh; e o deus que responder com fogo, esse é Deus.” Todo o povo respondeu e disse: “A proposta é boa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus deuses”, caso אֱלֹהֵיכֶם seja entendido como plural verdadeiro, e não como referência singular à divindade representada no confronto.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “A palavra é boa” ou “A questão é boa”. O hebraico דָּבָר pode significar “palavra”, “questão”, “assunto” ou, neste contexto, “proposta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְשֵׁם
  choice: invoquem o nome de
  rationale: A construção קרא בְשֵׁם indica invocar uma divindade pelo nome. “Invoquem o nome de” é natural em português e conserva o sentido religioso.
- source_word: אֱלֹהֵיכֶם
  choice: seu deus
  rationale: Embora a forma possa ser entendida como plural, אֱלֹהִים frequentemente designa uma só divindade; aqui, o confronto imediato é com Baal. A nota preserva a alternativa gramatical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: o deus que responder com fogo
  rationale: A primeira expressão refere-se à divindade, entre as reivindicadas, que responder ao teste. בָאֵשׁ admite naturalmente o valor instrumental “com fogo”.
- source_word: הוּא הָאֱלֹהִים
  choice: esse é Deus
  rationale: O demonstrativo enfático “esse” reproduz a força de הוּא, e “Deus” expressa a identificação culminante da verdadeira divindade.
- source_word: וַיַּעַן כָּל הָעָם וַיֹּאמְרוּ
  choice: Todo o povo respondeu, dizendo
  rationale: Conserva os dois verbos hebraicos sem produzir uma coordenação excessivamente pesada em português.
- source_word: טוֹב הַדָּבָר
  choice: A proposta é boa
  rationale: Neste contexto, דָּבָר é a proposta de Elias para decidir o confronto. A formulação comunica o sentido de modo natural, enquanto a nota registra alternativas mais literais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino; “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Singular ou plural em אֱלֹהֵיכֶם
  choice: seu deus
  alternative: seus deuses
  rationale: O contexto apresenta os profetas invocando Baal como a divindade de seu lado, mas a morfologia permite a leitura plural, registrada em nota.
- issue: Capitalização nas duas ocorrências de הָאֱלֹהִים
  choice: “o deus” na referência condicional e “Deus” na identificação final
  alternative: “o Deus” nas duas ocorrências
  rationale: A primeira ocorrência ainda abrange qualquer divindade reivindicada que responda; a segunda declara qual delas é verdadeiramente Deus. Essa distinção mantém a progressão retórica sem decidir antecipadamente o teste.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Invoquem” mantém o contexto religioso sem soar arcaico; “a proposta é boa” transmite naturalmente a aprovação popular. As notas preservam as ambiguidades lexicais reais.
