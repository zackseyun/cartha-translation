  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: pt
  text: Com as pedras, ele construiu um altar em nome de Yahweh e fez uma vala ao redor do altar, como a medida de duas seás de semente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como a medida de duas seás de semente”. A expressão é elíptica e pode indicar a capacidade da vala ou, mais amplamente, suas dimensões. A seá era uma antiga medida de volume.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: Com as pedras, ele construiu um altar
  rationale: Expressa em português natural a construção hebraica, literalmente próxima de “construiu as pedras como altar”, sem acrescentar a ideia de reconstrução, que vem do contexto anterior.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Preserva o sentido mais direto da preposição com “nome” e mantém a importância cultual e pactual da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: fez ... uma vala
  rationale: “Vala” é uma designação clara e corrente para o sulco ou canal cavado ao redor do altar.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: com capacidade para cerca de duas seás de semente
  rationale: Comunica de forma inteligível a expressão hebraica elíptica e difícil. “Cerca de” representa o valor aproximativo de כְּ, enquanto a nota preserva a incerteza entre capacidade e dimensão.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: ao redor do altar
  rationale: É a forma portuguesa mais natural e concisa de indicar que a vala circundava o altar.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título e sem impor uma forma denominacional tradicional.
- issue: Sentido de בְּשֵׁם na construção do altar
  choice: em nome de Yahweh
  alternative: para o nome de Yahweh; pela autoridade de Yahweh
  rationale: “Em nome de” conserva a formulação hebraica e sua tensão sem restringi-la exclusivamente a dedicação, posse ou autoridade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a unidade antiga “seá” e explica-a em nota, evitando uma conversão moderna incerta. O pronome “ele” retoma Elias do contexto imediato.
