  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: pt
  text: 'E aconteceu que, na sétima vez, ele disse: “Veja! Uma pequena nuvem, como a palma da mão de um homem[a], está subindo do mar.” Então ele disse: “Suba e diga a Acabe: ‘Atrele o seu carro[b] e desça, para que a chuva não o detenha[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica pode designar a palma ou a mão; a comparação pode se referir ao tamanho ou à forma.
    reason: lexical_alternative
  - marker: b
    text: Isto é, prender os animais ao carro e deixá-lo pronto para a viagem.
    reason: cultural_note
  - marker: c
    text: 'Ou: “não o impeça” ou “não o retarde”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: E aconteceu que, na sétima vez
  rationale: Mantém a progressão narrativa de וַיְהִי e explicita que בַּשְּׁבִעִית se refere à sétima ocasião em que o servo foi observar, não a um sétimo dia.
- source_word: הִנֵּה
  choice: Veja!
  rationale: Reproduz de modo atual e imediato a partícula que chama a atenção para algo visível.
- source_word: עָב קְטַנָּה
  choice: uma pequena nuvem
  rationale: Tradução direta, clara e idiomática do sintagma nominal.
- source_word: כְּכַף אִישׁ
  choice: como a palma da mão de um homem
  rationale: Preserva a comparação concreta e o masculino singular do hebraico, sem determinar no texto se o ponto principal é o tamanho ou a forma.
- source_word: עֹלָה מִיָּם
  choice: está subindo do mar
  rationale: O particípio apresenta uma ação em andamento; a formulação descreve naturalmente a nuvem surgindo sobre o mar.
- source_word: עֲלֵה
  choice: Suba
  rationale: Conserva a direção expressa pelo imperativo, provavelmente dirigida ao servo que devia levar a mensagem.
- source_word: אֱמֹר אֶל אַחְאָב
  choice: diga a Acabe
  rationale: Formulação direta e natural para a ordem de transmitir a mensagem.
- source_word: אֱסֹר
  choice: Atrele o seu carro
  rationale: O verbo significa literalmente prender ou atar e, neste contexto, é uma ordem para atrelar ou preparar o carro. O objeto implícito foi expresso para clareza em português.
- source_word: וָרֵד
  choice: e desça
  rationale: Mantém o sentido direcional e topográfico do imperativo.
- source_word: וְלֹא יַעַצָרְכָה הַגָּשֶׁם
  choice: para que a chuva não o detenha
  rationale: עצר pode significar deter, reter ou impedir. A tradução conserva a advertência prática sem especificar exatamente como a chuva dificultaria a viagem.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Os dois sujeitos permanecem como “ele”, conforme o hebraico; o contexto identifica primeiro o servo e depois Elias. As notas acompanham seus marcadores em ordem natural no texto.
