base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: pt
  text: Então eles clamaram em alta voz e se cortaram, conforme o seu costume, com espadas e lanças, até o sangue escorrer sobre eles[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se retalharam”. O hebraico se refere a cortes rituais feitos no próprio corpo.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme a sua prática” ou “como era seu costume”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: clamaram
  rationale: Neste contexto de invocação ritual a Baal, קרא indica clamor intenso, não um simples chamado.
- source_word: בְּקוֹל גָּדוֹל
  choice: em alta voz
  rationale: Mantém de modo natural em português a expressão concreta do hebraico.
- source_word: וַיִּתְגֹּדְדוּ
  choice: se cortaram
  rationale: A forma reflexiva descreve a prática ritual de fazer cortes no próprio corpo; a tradução é clara e evita intensificação desnecessária.
- source_word: כְּמִשְׁפָּטָם
  choice: conforme o seu costume
  rationale: מִשְׁפָּט aqui se refere à prática ritual estabelecida deles, e não primariamente a uma decisão judicial ou lei.
- source_word: בַּחֲרָבוֹת
  choice: com espadas
  rationale: A preposição marca o instrumento empregado.
- source_word: וּבָרְמָחִים
  choice: e lanças
  rationale: רְמָחִים designa lanças; esta é uma palavra comum e clara em português moderno.
- source_word: עַד שְׁפָךְ דָּם
  choice: até o sangue escorrer
  rationale: Expressa o limite ou resultado da ação e preserva a imagem do sangue derramando-se sem acrescentar a intensidade de 'jorrar'.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: Preserva a relação espacial expressa por עַל e indica que o sangue corria sobre o corpo deles.
