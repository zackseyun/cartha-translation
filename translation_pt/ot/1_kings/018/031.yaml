  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: pt
  text: E Elias tomou doze pedras, conforme o número das tribos dos filhos de Jacó[a], a quem a palavra de Yahweh tinha sido dirigida, dizendo:[b] “Israel será o seu nome.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Jacó”. O hebraico diz literalmente “filhos de Jacó”.
    reason: lexical_alternative
  - marker: b
    text: Isto recorda quando Deus deu a Jacó o nome Israel em Gênesis 32:28 e 35:10.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: Traduz naturalmente o wayyiqtol narrativo de לקח e descreve de modo claro a ação de Elias sobre as pedras.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: doze pedras
  rationale: Correspondência direta e natural ao numeral e ao substantivo hebraicos.
- source_word: כְּמִסְפַּר
  choice: conforme o número de
  rationale: Preserva o sentido comparativo da preposição כְּ e soa natural em português.
- source_word: שִׁבְטֵי
  choice: tribos
  rationale: Termo português consagrado para שׁבט neste contexto genealógico e nacional.
- source_word: בְנֵי יַעֲקֹב
  choice: filhos de Jacó
  rationale: Mantém de perto a expressão hebraica, sem substituir silenciosamente o vínculo familiar por uma interpretação mais ampla.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: a quem a palavra de Yahweh tinha vindo
  rationale: O pronome hebraico singular remete a Jacó; o mais-que-perfeito expressa que essa palavra divina já lhe havia sido dirigida anteriormente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israel será o seu nome
  rationale: Conserva a ênfase inicial do hebraico em “Israel” e mantém o tom declarativo da mudança de nome.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Referente da oração אֲשֶׁר הָיָה דְבַר־יְהוָה אֵלָיו
  choice: Jacó, a quem veio a palavra de Yahweh
  alternative: os filhos de Jacó, aos quais veio a palavra de Yahweh
  rationale: A forma pronominal אֵלָיו é singular e a declaração seguinte trata da mudança do nome de Jacó para Israel.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe próxima do hebraico sem rigidez excessiva. “Pegou” é corrente e claro; “conforme o número” conserva a correspondência simbólica entre as doze pedras e as doze tribos. O marcador [a] foi colocado junto de “filhos de Jacó”, expressão à qual a nota lexical efetivamente se refere.
