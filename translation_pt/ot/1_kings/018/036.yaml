  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: pt
  text: 'Na hora de apresentar a oferta de cereal, o profeta Elias se aproximou e disse: “Ó Yahweh, Deus de Abraão, Isaque e Israel[a], que hoje se saiba que tu és Deus em Israel, que eu sou teu servo e que foi por tua palavra[b] que fiz todas estas coisas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Israel”. Muitos leitores talvez esperem “Jacó”, por ser essa a forma mais conhecida da fórmula patriarcal, mas aqui o texto diz especificamente “Israel”.'
    reason: alternative_reading
  - marker: b
    text: Também pode ser entendido como “segundo a tua palavra” ou “por ordem tua”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: Na hora de apresentar a oferta de cereal
  rationale: A expressão usa o infinitivo de עלה de modo sacrificial, indicando a apresentação da oferta. מִנְחָה designa mais precisamente uma oferta de cereal; a formulação evita acrescentar “da tarde”, que não aparece explicitamente no versículo.
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: נגשׁ indica aproximar-se ou chegar perto; “se aproximou” conserva o movimento concreto e se ajusta ao tom solene da cena.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Deus de Abraão, Isaque e Israel
  rationale: O texto hebraico traz explicitamente “Israel”, não “Jacó”; a tradução evita harmonizar a fórmula com passagens mais conhecidas.
- source_word: הַיּוֹם יִוָּדַע
  choice: que hoje se saiba
  rationale: O imperfeito nifal tem aqui força volitiva em uma oração. A construção portuguesa comunica naturalmente o pedido de Elias.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Deus em Israel
  rationale: Mantém o sentido mais direto da preposição ב sem definir além do texto se a relação pretendida é espacial, comunitária ou de domínio.
- source_word: עַבְדֶּךָ
  choice: teu servo
  rationale: No contexto profético, עבד designa alguém a serviço e sob a autoridade de Deus; “servo” é natural e apropriado em português.
- source_word: וּבִדְבָרֶךָ
  choice: por tua palavra
  rationale: A preposição ב pode indicar meio, fundamento ou conformidade. “Por tua palavra” preserva essa amplitude, podendo significar que Elias agiu mediante, por ordem ou de acordo com a palavra de Yahweh.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: fiz todas estas coisas
  rationale: Neste contexto, דְּבָרִים se refere a fatos, ações ou assuntos, não apenas a palavras faladas. O perfeito hebraico apresenta as ações como realizadas.
theological_decisions:
- issue: Tradução do nome da aliança יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino diretamente. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: A fórmula patriarcal usa “Israel” em vez de “Jacó”
  choice: Deus de Abraão, Isaque e Israel
  alternative: Deus de Abraão, Isaque e Jacó
  rationale: A leitura do texto hebraico é “Israel”. Mantê-la preserva a forma específica do versículo e evita harmonização com fórmulas presentes em outros textos.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração conserva o tratamento em segunda pessoa singular (“tu”), comum no registro bíblico e coerente com as formas hebraicas. A redação privilegia equivalência ótima: mantém “oferta de cereal”, “Israel” e “Yahweh” por precisão textual, mas evita calques pouco naturais como “na subida da oferta”.'
