base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/016.yaml
  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: pt
  text: Então Obadias foi ao encontro de Acabe e lhe contou[a]. E Acabe foi ao encontro de Elias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe informou” ou “lhe relatou”. O verbo hebraico admite esses sentidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O wayyiqtol de הלך faz a narrativa avançar com o sentido simples de movimento; “foi” é direto e natural em português.
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: A construção indica movimento em direção a alguém com o propósito de encontrá-lo; a mesma expressão foi mantida nas duas ocorrências.
- source_word: אַחְאָב
  choice: Acabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיַּגֶּד לוֹ
  choice: lhe contou
  rationale: O hifil de נגד pode significar contar, comunicar ou informar. “Lhe contou” preserva a concisão do hebraico e não explicita indevidamente o conteúdo omitido.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: E Acabe foi
  rationale: A coordenação dá continuidade à sequência narrativa. Uma nova frase conserva a clareza sem perder essa ligação.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
