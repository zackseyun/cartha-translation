source:
  edition: WLC
  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: pt
  text: 'Quando todo o povo viu isso, caiu com o rosto em terra e disse: “Yahweh, ele é Deus![a] Yahweh, ele é Deus!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “o Deus”. O artigo hebraico identifica Yahweh como o verdadeiro Deus, em contraste com Baal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu isso
  rationale: O verbo significa “ver”. O pronome “isso” explicita em português o objeto implícito, isto é, o fogo e o acontecimento narrado imediatamente antes.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Equivalente direto e natural para a expressão coletiva hebraica.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: caiu com o rosto em terra
  rationale: Preserva a imagem concreta da prostração, em linguagem portuguesa natural, sem substituir a ação por uma interpretação.
- source_word: וַיֹּאמְרוּ
  choice: disse
  rationale: O verbo hebraico comum de fala não indica por si só volume ou intensidade; “disse” evita acrescentar “gritou” ou “declarou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הוּא
  choice: ele é
  rationale: Mantém o pronome explícito e enfático do hebraico.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Em português, “Deus” expressa naturalmente a identificação predicativa; o artigo hebraico ressalta Yahweh como o verdadeiro Deus em contraste com Baal.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: Yahweh, ele é Deus!
  rationale: Conserva o pronome enfático, a repetição e a força culminante da confissão do povo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de הָאֱלֹהִים com artigo
  choice: Deus
  alternative: o Deus; o verdadeiro Deus
  rationale: O artigo distingue Yahweh de Baal e o identifica como o verdadeiro Deus. A tradução principal preserva a expressão idiomática portuguesa sem inserir “verdadeiro”, deixando a forma mais literal na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A concordância no singular em “caiu” e “disse” acompanha o substantivo coletivo “todo o povo”. A repetição integral da aclamação foi preservada.
