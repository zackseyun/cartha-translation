source:
  edition: WLC
  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: pt
  text: 'Então eles pegaram o novilho que lhes tinha sido dado, prepararam-no e invocaram o nome de Baal desde a manhã até o meio-dia, dizendo: “Ó Baal, responde-nos!” Mas não houve voz alguma, e ninguém respondeu. E eles manquejavam[a] ao redor do altar que havia sido feito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dançavam” ou “saltitavam ao redor do altar”. O verbo hebraico provavelmente descreve um movimento ritual de mancar ou saltitar e talvez faça eco da mesma raiz empregada por Elias no versículo 21.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: pegaram
  rationale: Expressa de modo direto e natural o sentido narrativo básico de לקח.
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho, frequentemente jovem, destinado ao sacrifício; “novilho” é corrente e adequado ao contexto cultual.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: que lhes tinha sido dado
  rationale: A forma passiva mantém a referência ao animal entregue a eles sem tornar explícito, em português, o sujeito apenas implícito pelo contexto.
- source_word: וַיַּעֲשׂוּ
  choice: prepararam-no
  rationale: Neste contexto sacrificial, עשה é elíptico e indica preparar o animal; “ofereceram-no” anteciparia uma ação que o relato ainda não descreve.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: invocaram o nome de Baal
  rationale: Preserva o idioma cultual קרא בשם de forma clara e natural em português, sem atribuir legitimidade à invocação.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: desde a manhã até o meio-dia
  rationale: Reproduz com clareza o intervalo temporal indicado pelo hebraico.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: Ó Baal, responde-nos!
  rationale: Mantém a força vocativa e traduz diretamente o pedido expresso por ענה.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: não houve voz alguma, e ninguém respondeu
  rationale: 'Conserva a negação enfática em duas partes: ausência de voz e ausência de quem respondesse.'
- source_word: וַיְפַסְּחוּ
  choice: manquejavam
  rationale: Preserva o provável movimento ritual de mancar ou saltitar e a possível ligação literária com o uso da mesma raiz no versículo 21.
- source_word: עַל הַמִּזְבֵּחַ
  choice: ao redor do altar
  rationale: No contexto de movimento ritual, עַל indica plausivelmente movimento junto ao altar ou em torno dele, não necessariamente sobre sua superfície.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia sido feito
  rationale: Embora o hebraico tenha verbo ativo no singular, a construção passiva evita identificar indevidamente o sujeito, que não é nomeado no próprio versículo.
theological_decisions:
- issue: Expressão usada para a invocação de Baal
  choice: invocaram o nome de Baal
  alternative: invocaram Baal
  rationale: Mantém o idioma bíblico de invocar o nome de uma divindade sem sugerir que a invocação seja legítima ou eficaz.
- issue: Sentido de וַיְפַסְּחוּ
  choice: manquejavam ao redor do altar
  alternative: dançavam ao redor do altar; saltitavam ao redor do altar
  rationale: A opção conserva a nuance lexical e a possível ironia associada à mesma raiz em 1 Reis 18:21, sem reduzir o gesto a uma dança genérica.
- issue: Sujeito de אֲשֶׁר עָשָׂה
  choice: que havia sido feito
  alternative: que ele havia feito
  rationale: A passiva preserva a indeterminação referencial do contexto em português e evita identificar silenciosamente quem fez o altar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a repetição enfática da ausência de resposta e a estranheza literariamente significativa de “manquejavam”; a nota registra as principais alternativas.
