base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: pt
  text: 'Então Elias lhes disse: “Prendam os profetas de Baal! Não deixem escapar nenhum deles.[a]” Eles os prenderam, e Elias os fez descer até o ribeiro de Quisom[b] e ali os degolou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não escape um homem dentre eles”; a expressão tem sentido distributivo: nem sequer um deles deveria escapar.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico נַחַל pode designar um ribeiro, o leito de um curso d’água ou um uádi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ
  choice: Prendam
  rationale: O imperativo plural de תפשׂ exige a captura enérgica dos profetas. “Prendam” é natural em português e comunica apreensão sob custódia.
- source_word: נְבִיאֵי הַבַּעַל
  choice: os profetas de Baal
  rationale: Reproduz naturalmente a cadeia construta hebraica e identifica o grupo sem paráfrase.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: Não deixem escapar nenhum deles
  rationale: 'Expressa em português corrente o valor distributivo de אִישׁ com a negação volitiva אַל: nem um único integrante do grupo deve fugir.'
- source_word: וַיִּתְפְּשׂוּם
  choice: Eles os prenderam
  rationale: Mantém a continuidade lexical com a ordem anterior e descreve sua execução imediata.
- source_word: וַיּוֹרִדֵם
  choice: os fez descer
  rationale: Preserva o sentido causativo da forma hifil de ירד sem especificar indevidamente se foram conduzidos ou levados à força.
- source_word: נַחַל קִישׁוֹן
  choice: o ribeiro de Quisom
  rationale: “Ribeiro” é uma designação geográfica clara e tradicional em português; a nota registra a amplitude semântica de נַחַל.
- source_word: וַיִּשְׁחָטֵם
  choice: os degolou
  rationale: שׁחט designa o abate, normalmente por corte da garganta. “Degolou” conserva a força concreta e violenta do verbo, sem suavizá-lo para o genérico “matou”.
- source_word: שָׁם
  choice: ali
  rationale: Equivalente locativo natural, retomando o ribeiro de Quisom como o lugar da ação.
theological_decisions:
- issue: A ação violenta de Elias contra os profetas de Baal
  choice: Narrar diretamente que Elias os degolou
  alternative: Suavizar com “executou”, “mandou matar” ou acrescentar que agiu por autorização divina
  rationale: O hebraico atribui diretamente a ação a Elias e emprega um verbo forte de abate. A tradução não deve suavizar a violência nem acrescentar uma justificativa teológica ausente deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Prendam” evita o tom menos idiomático de “agarrem”; “ribeiro” mantém uma designação geográfica reconhecível, e “degolou” preserva a severidade concreta do relato.
