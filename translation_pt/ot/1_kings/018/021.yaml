base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: pt
  text: 'Então Elias se aproximou de todo o povo e disse: “Até quando vocês vão ficar mancando entre dois galhos?[a] Se Yahweh é Deus, sigam-no; mas, se é Baal, sigam-no”. O povo, porém, não lhe respondeu uma só palavra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vacilando entre dois lados”. O hebraico fala mais literalmente de mancar ou saltitar sobre ou entre duas ramificações, imagem de lealdade dividida.'
    reason: Alternativa lexical e esclarecimento da metáfora hebraica incomum.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: Expressa naturalmente o movimento de Elias em direção ao povo e preserva o sentido comum de נגשׁ.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Mantém a abrangência coletiva da expressão hebraica em português corrente.
- source_word: עַד מָתַי
  choice: Até quando
  rationale: É a forma idiomática portuguesa para a pergunta temporal de censura.
- source_word: פֹּסְחִים
  choice: vão ficar mancando
  rationale: Preserva a imagem concreta e contínua do particípio hebraico, em vez de substituí-la diretamente pela interpretação abstrata 'vacilando'.
- source_word: עַל שְׁתֵּי הַסְּעִפִּים
  choice: entre dois galhos
  rationale: Conserva a metáfora incomum do hebraico, em que סְעִפִּים pode designar ramificações ou galhos; a nota explicita a ideia de lealdade dividida sem apagá-la do texto.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: Se Yahweh é Deus
  rationale: Mantém o nome divino presente no texto hebraico e traduz naturalmente a construção predicativa.
- source_word: לְכוּ אַחֲרָיו
  choice: sigam-no
  rationale: Transmite de modo conciso o idioma de ir após alguém, aqui com sentido de lealdade e adesão.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Trata Baal como nome próprio em português, sem reproduzir o artigo hebraico de maneira artificial.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: O povo, porém, não lhe respondeu uma só palavra
  rationale: Preserva a ênfase hebraica no silêncio completo; 'porém' comunica adequadamente o contraste contextual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pactual e evita substituí-lo por um título.
- issue: Metáfora de lealdade dividida em פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: man­cando entre dois galhos
  alternative: vacilando entre duas opiniões; oscilando entre dois lados
  rationale: A redação mantém a imagem concreta e a ambiguidade do hebraico, enquanto a nota esclarece seu provável valor metafórico sem convertê-lo silenciosamente em interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. A metáfora estranha do original foi deliberadamente preservada no texto e esclarecida em nota.
