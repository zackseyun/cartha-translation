source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: pt
  text: porque Davi fizera o que era reto aos olhos de Yahweh e não se desviara de nada do que Yahweh lhe ordenara todos os dias de sua vida, exceto na questão de Urias, o hitita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no caso de Urias, o hitita”.
    reason: Alternativa lexical para בִּדְבַר, que pode significar “na questão de” ou “no caso de”.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: porque
  rationale: No contexto, o relativo introduz a razão da afirmação precedente; a forma causal é clara e natural em português.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: havia feito o que era reto
  rationale: Preserva o sentido do idioma hebraico e situa a conduta de Davi como fundamento da declaração anterior.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora avaliativa hebraica em uma expressão corrente e compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino conforme o padrão do projeto.
- source_word: וְלֹא סָר
  choice: e não se desviou
  rationale: Comunica naturalmente a ideia de afastar-se do caminho da obediência.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: de nada do que Yahweh lhe havia ordenado
  rationale: A construção negativa com “nada” preserva a totalidade de כֹּל; repetir “Yahweh” esclarece o sujeito do mandamento sem acrescentar conteúdo.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: durante todos os dias de sua vida
  rationale: Reproduz de modo transparente a expressão temporal hebraica.
- source_word: רַק
  choice: exceto
  rationale: Introduz diretamente a única exceção declarada à avaliação positiva.
- source_word: בִּדְבַר אוּרִיָּה
  choice: na questão de Urias
  rationale: דָּבָר nesta construção pode indicar questão, assunto ou caso; “na questão de” é conciso e mantém a abrangência do hebraico.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Urias, o hitita
  rationale: Emprega a forma portuguesa tradicional do nome e traduz diretamente a designação étnica.
theological_decisions:
- issue: Avaliação da obediência de Davi apesar de outros pecados conhecidos
  choice: Manter o amplo elogio do texto com sua única exceção expressamente declarada.
  alternative: Explicar que Davi foi apenas fiel em termos gerais ou acrescentar referências interpretativas ao arrependimento e à fidelidade à aliança.
  rationale: O versículo combina uma avaliação abrangente da obediência de Davi com uma exceção explícita. A tradução preserva essa tensão sem harmonizá-la ou explicá-la teologicamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o encadeamento causal com o versículo anterior e mantém a metáfora hebraica “aos olhos de”. O marcador foi colocado junto à expressão lexical a que a nota se refere.
