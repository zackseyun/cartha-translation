- from: porque Davi havia feito o que era reto aos olhos de Yahweh e não se desviou de nada do que Yahweh lhe havia ordenado durante todos os dias de sua vida, exceto na questão[a] de Urias, o hitita.
  to: porque Davi fizera o que era reto aos olhos de Yahweh e não se desviara de nada do que Yahweh lhe ordenara todos os dias de sua vida, exceto na questão de Urias, o hitita[a].
  rationale: A revisão harmoniza os dois verbos coordenados no mais-que-perfeito, de acordo com sua função como fundamento da afirmação precedente, e reposiciona o marcador para não interromper a expressão «na questão de Urias, o hitita». Não altera o sentido, a ambiguidade nem a avaliação teológica do texto.
