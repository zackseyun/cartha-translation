  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: pt
  text: Baasa o matou no terceiro ano de Asa, rei de Judá,[a] e reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o fez morrer”. O verbo hebraico está na forma causativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: o matou
  rationale: O hifil de מות tem sentido causativo, “fazer morrer”. Em português narrativo, “matou” expressa esse sentido de modo natural e direto; a alternativa mais formal é registrada em nota.
- source_word: בַעְשָׁא
  choice: Baasa
  rationale: Transliteração tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: no terceiro ano
  rationale: A construção temporal com ב indica o terceiro ano do reinado usado como referência cronológica.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: O ל integra a fórmula de datação régia; a vírgula apresenta “rei de Judá” naturalmente como título explicativo de Asa.
- source_word: וַיִּמְלֹךְ
  choice: e reinou
  rationale: O qal de מלך, na sequência narrativa, indica que Baasa passou a exercer o reinado; “reinou” preserva a concisão do hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: תחת com sufixo pronominal denota substituição ou sucessão, aqui especificamente no trono.
