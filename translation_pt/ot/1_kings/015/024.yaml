base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: pt
  text: Asa descansou com seus pais[a] e foi sepultado com seus pais na Cidade de Davi, seu antepassado[b]. E Josafá, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com seus antepassados». O hebraico diz literalmente «com seus pais», fórmula régia tradicional referente à morte e ao sepultamento.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente «seu pai». Davi era antepassado régio de Asa, não seu pai imediato.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: descansou com seus pais
  rationale: Preserva a fórmula régia hebraica de morte sem usar o pouco natural «dormiu com seus pais», que em português pode causar ambiguidade indevida. «Descansou» mantém o caráter eufemístico e solene.
- source_word: עִם אֲבֹתָיו
  choice: com seus pais
  rationale: Mantém de perto a imagem hebraica e a ressonância dinástica; a nota esclarece que a expressão abrange os antepassados.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Reproduz naturalmente em português a forma passiva do hebraico e conserva o registro régio.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: na Cidade de Davi, seu antepassado
  rationale: «Cidade de Davi» é a designação tradicional e clara. Neste contexto, אָבִיו identifica Davi como antepassado dinástico de Asa, e não como seu pai imediato; explicitar «antepassado» evita uma afirmação historicamente enganosa, enquanto a nota registra a forma literal.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: É a equivalência concisa e convencional para a fórmula de sucessão real.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa substituição e sucessão régia, não apenas sequência temporal.
