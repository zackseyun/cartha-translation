  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: pt
  text: Nadabe, filho de Jeroboão, tornou-se rei de Israel no segundo ano de Asa, rei de Judá, e reinou sobre Israel durante dois anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב
  choice: Nadabe
  rationale: O nome próprio é transliterado segundo a forma portuguesa consagrada; a conjunção inicial apenas dá continuidade à narrativa e não exige um conectivo explícito em português.
- source_word: בֶּן יָרָבְעָם
  choice: filho de Jeroboão
  rationale: Reproduz de modo direto e natural a identificação genealógica.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste primeiro uso, o verbo indica a ascensão ao trono, em contraste com o uso seguinte, que apresenta a duração do reinado.
- source_word: עַל יִשְׂרָאֵל
  choice: de Israel / sobre Israel
  rationale: Na fórmula de ascensão, “rei de Israel” é o modo mais natural de expressar o domínio real; na indicação da duração, “reinou sobre Israel” preserva mais diretamente a construção hebraica.
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: no segundo ano
  rationale: A fórmula cronológica hebraica com o numeral cardinal é expressa idiomaticamente em português com o ordinal.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: A preposição estabelece Asa como referência para a data do reinado; a aposição identifica seu reino.
- source_word: וַ/יִּמְלֹךְ
  choice: e reinou
  rationale: Como o verbo vem acompanhado da duração, “reinou” comunica o período de governo, e não a ascensão.
- source_word: שְׁנָתָיִם
  choice: durante dois anos
  rationale: Expressa claramente a duração de dois anos indicada pelo dual hebraico.
