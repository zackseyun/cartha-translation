  text: וּ/בִ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לַ/מֶּ֖לֶךְ יָרָבְעָ֣ם בֶּן נְבָ֑ט מָלַ֥ךְ אֲבִיָּ֖ם עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: pt
  text: No décimo oitavo ano do rei Jeroboão, filho de Nebate, Abião[a] tornou-se rei sobre Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Abião”; em outras passagens, o mesmo rei é chamado “Abias”.'
    reason: A nota preserva a forma específica do nome no hebraico deste versículo e informa a variante nominal encontrada em outros textos.
lexical_decisions:
- source_word: וּבִשְׁנַת
  choice: No ... ano
  rationale: A conjunção e a preposição introduzem uma fórmula cronológica régia. Em português natural, «No ... ano» comunica a data sem reproduzir mecanicamente o «e» narrativo hebraico.
- source_word: שְׁמֹנֶה עֶשְׂרֵה
  choice: décimo oitavo
  rationale: Embora o hebraico empregue uma expressão cardinal, a fórmula de ano de reinado pede naturalmente o ordinal em português.
- source_word: לַמֶּלֶךְ
  choice: do rei
  rationale: Na fórmula cronológica, a expressão indica o ano de reinado do monarca mencionado.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Empregam-se as formas tradicionais e reconhecíveis dos nomes em português, preservando-se o patronímico hebraico.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste aviso de entronização, o verbo indica a ascensão ao trono, não todo o período do reinado. A formulação escolhida explicita esse valor sem acrescentar informação.
- source_word: אֲבִיָּם
  choice: Abião
  rationale: A forma portuguesa «Abião» representa o nome específico אֲבִיָּם presente no Texto Massorético deste versículo, distinguindo-o de «Abias», usado em outras passagens para o mesmo rei.
- source_word: עַל יְהוּדָה
  choice: sobre Judá
  rationale: Com o verbo «reinar», a preposição hebraica marca o povo ou território submetido ao governo; «sobre Judá» preserva diretamente essa relação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos amplamente reconhecíveis no uso lusófono. A sintaxe mantém a concisão da fórmula cronológica hebraica sem soar mecânica.
