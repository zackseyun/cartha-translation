source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י אֲבִיָּם֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ם וּ/בֵ֥ין יָרָבְעָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: pt
  text: Os demais atos de Abião[a] e tudo o que ele fez não estão escritos no Livro das Crônicas dos Reis de Judá[b]? Houve guerra entre Abião e Jeroboão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em algumas passagens paralelas ou relacionadas, Abião é chamado Abias; o texto hebraico aqui traz Abijam.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “no Livro dos Anais dos Reis de Judá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: os demais atos
  rationale: Na fórmula de conclusão dos relatos régios, a expressão se refere aos feitos e acontecimentos restantes do reinado; “os demais atos” é natural e preserva o sentido historiográfico.
- source_word: אֲבִיָּם
  choice: Abião
  rationale: Translitera em forma portuguesa o nome hebraico Abijam presente neste versículo, sem harmonizá-lo com a forma alternativa Abias encontrada em passagens relacionadas.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta que preserva a generalidade do verbo hebraico.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica do hebraico e concorda naturalmente em português com os dois elementos coordenados, “atos” e “tudo”.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Livro das Crônicas dos Reis de Judá
  rationale: Expressa de modo claro o título do registro histórico régio; “Anais” continua sendo uma alternativa lexical legítima.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Houve guerra
  rationale: Representa diretamente a oração existencial, sem acrescentar uma ideia explícita de continuidade.
- source_word: בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: entre Abião e Jeroboão
  rationale: Reproduz a construção recíproca padrão e emprega as formas portuguesas dos nomes.
