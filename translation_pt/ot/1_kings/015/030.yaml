  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: pt
  text: por causa dos pecados que Jeroboão cometeu e com os quais fez Israel pecar, e por causa da sua provocação[a], com a qual provocou Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua ira”. O substantivo hebraico pode indicar ira ou provocação; aqui, “provocação” corresponde melhor ao verbo seguinte, “provocou”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: עַל חַטֹּאות
  choice: por causa dos pecados
  rationale: A preposição עַל tem sentido causal neste contexto, e o plural חַטֹּאות é preservado diretamente.
- source_word: אֲשֶׁר חָטָא
  choice: que Jeroboão cometeu
  rationale: Como o antecedente já é “pecados”, “cometeu” evita a repetição pouco natural “pecados que pecou”, sem perder o sentido.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: e com os quais fez Israel pecar
  rationale: Preserva a força causativa do hifil הֶחֱטִיא e liga os pecados de Jeroboão aos pecados a que ele induziu Israel.
- source_word: בְּכַעְסוֹ
  choice: por causa da sua provocação
  rationale: כַּעַס pode indicar ira ou provocação. Neste contexto, “provocação” se harmoniza com o verbo seguinte e apresenta o ato ofensivo de Jeroboão como causa do juízo.
- source_word: אֲשֶׁר הִכְעִיס
  choice: com a qual provocou
  rationale: O hifil de כעס significa provocar à ira; “provocou” é conciso e mantém a correspondência lexical com “provocação”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz de modo claro e convencional a construção hebraica e sua identificação pactual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o nome divino; “Yahweh” preserva esse nome em vez de substituí-lo pelo título tradicional.
- issue: Agência de Jeroboão no pecado de Israel
  choice: fez Israel pecar
  alternative: levou Israel a pecar
  rationale: A forma causativa hebraica é mantida sem especificar além do texto o modo pelo qual Jeroboão exerceu essa influência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “provocação... provocou” foi mantida por refletir o vínculo lexical e retórico do hebraico. O marcador da nota foi colocado junto ao termo ambíguo a que ela efetivamente se refere.
