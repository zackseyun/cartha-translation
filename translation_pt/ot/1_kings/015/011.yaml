reference: 1 Kings 15:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: pt
  text: Asa fez o que era certo aos olhos de Yahweh, como Davi, seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como Davi, seu antepassado”. Aqui, “pai” indica ascendência dinástica, não paternidade imediata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה significa comumente “fazer”. Nesta fórmula de avaliação régia, “fez o que era certo” é natural em português.
- source_word: אָסָא
  choice: Asa
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: יָשָׁר pode significar “reto”, “correto” ou “justo”. Com עשה, a expressão idiomática “fez o que era certo” comunica naturalmente a avaliação moral.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a metáfora do idioma hebraico que expressa avaliação segundo a perspectiva de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כְּדָוִד
  choice: como Davi
  rationale: A preposição כְּ introduz uma comparação; “como Davi” é a forma natural em português.
- source_word: אָבִיו
  choice: seu pai
  rationale: Mantém o termo hebraico אָב e sua linguagem dinástica, embora aqui ele designe um antepassado, não o pai imediato de Asa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Sentido de “Davi, seu pai” em relação a Asa
  choice: manter “pai” no texto principal como linguagem ancestral e dinástica
  alternative: Davi, seu antepassado
  rationale: O hebraico usa אָבִיו. Na linguagem régia bíblica, “pai” pode designar um antepassado da linhagem; a nota esclarece esse sentido sem apagar o idioma da fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preservação do idioma hebraico “aos olhos de” e da linguagem dinástica “seu pai”. O comparativo elíptico do hebraico foi mantido naturalmente, sem acrescentar “havia feito”.
