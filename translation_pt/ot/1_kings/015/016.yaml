  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: pt
  text: E houve guerra entre Asa e Baasa, rei de Israel, durante todos os seus dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todos os dias deles”. Também pode ser traduzido como “ao longo de todos os seus dias” ou entendido como “durante toda a vida deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: E houve guerra
  rationale: A construção existencial com היה expressa naturalmente que houve guerra; a conjunção וּ mantém a continuidade narrativa.
- source_word: בֵּין אָסָא וּבֵין בַּעְשָׁא
  choice: entre Asa e Baasa
  rationale: A construção preposicional correlativa indica oposição mútua entre os dois reis; os nomes seguem formas portuguesas tradicionais e reconhecíveis.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: A cadeia construta identifica o cargo de Baasa e funciona naturalmente como aposto em português.
- source_word: כָּל יְמֵיהֶם
  choice: durante todos os dias de ambos
  rationale: Preserva a referência plural do sufixo hebraico e a abrangência temporal da expressão, sem decidir se ela se refere especificamente à vida ou ao reinado de cada um.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A formulação mantém a ambiguidade do idioma hebraico quanto a “dias” designar a vida, o reinado ou o período em que ambos estiveram ativos.
