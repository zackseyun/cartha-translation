base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: pt
  text: Então, o rei Asa convocou todo Judá — ninguém ficou isento[a] —, e eles levaram as pedras de Ramá e sua madeira, que Baasa havia usado para construir Ramá. Com esses materiais, o rei Asa construiu Geba de Benjamim e Mispá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não havia isento”, isto é, ninguém foi dispensado do trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמִיעַ אֶת כָּל יְהוּדָה
  choice: convocou todo o povo de Judá
  rationale: O hifil de שׁמע tem aqui a força contextual de fazer circular uma ordem ou convocação. A inclusão de “o povo de” deixa claro, em português natural, que Judá designa seus habitantes.
- source_word: אֵין נָקִי
  choice: ninguém ficou isento
  rationale: Neste contexto de mobilização para trabalho, נָקִי indica alguém dispensado ou livre da obrigação, e não inocência moral.
- source_word: וַיִּשְׂאוּ
  choice: levaram
  rationale: נשא descreve o transporte dos materiais retirados de Ramá. “Levaram” expressa naturalmente o deslocamento sem acrescentar destino não declarado.
- source_word: אַבְנֵי הָרָמָה וְאֶת עֵצֶיהָ
  choice: as pedras e a madeira de Ramá
  rationale: עֵצֶיהָ refere-se à madeira empregada na construção. Em português, coordenar ambos os materiais sob “de Ramá” evita o pouco natural “sua madeira” e conserva a relação com o local.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: que Baasa havia usado na construção
  rationale: A formulação explicita de modo idiomático que a oração relativa se refere aos materiais usados por Baasa, evitando sugerir que ele teria “construído” as próprias pedras ou a madeira.
- source_word: וַיִּבֶן בָּם
  choice: Com esses materiais ... fortificou
  rationale: A preposição בָּם retoma pedras e madeira como materiais. Embora בנה signifique literalmente “construiu”, o contexto de Geba e Mispá favorece a construção ou reforço defensivo; a alternativa literal é preservada em nota.
- source_word: גֶּבַע בִּנְיָמִן
  choice: Geba de Benjamim
  rationale: Mantém de perto a relação hebraica que identifica Geba por sua localização ou associação tribal.
- source_word: הַמִּצְפָּה
  choice: Mispá
  rationale: Emprega a forma portuguesa tradicional do topônimo e omite o artigo hebraico, como é natural com nomes de lugares em português.
theological_decisions: []
