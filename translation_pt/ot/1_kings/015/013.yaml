base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: pt
  text: Também destituiu Maaca, sua mãe[a], da posição de rainha-mãe, porque ela havia feito um objeto repugnante para Aserá[c][b]. Asa cortou o objeto dela e o queimou no vale do Cedrom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sua mãe”. No uso dinástico, o termo também pode se referir à avó ou a outra ancestral feminina.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma coisa horrenda”. Não se sabe ao certo qual era a forma desse objeto de culto.'
    reason: lexical_alternative
  - marker: c
    text: “Aserá” pode se referir à deusa Aserá ou ao símbolo cultual associado a ela, muitas vezes chamado de “poste de Aserá”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Expressa a força aditiva que liga esta medida às reformas mencionadas anteriormente.
- source_word: מַעֲכָה אִמּוֹ
  choice: Maaca, sua mãe
  rationale: Mantém a formulação literal do hebraico; uma nota registra que, no uso dinástico, o termo pode designar a avó ou outra ancestral feminina.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: destituiu ... da posição de rainha-mãe
  rationale: O hifil de סור indica remoção, e גְּבִירָה designa aqui a principal dignitária feminina da corte, normalmente a rainha-mãe. 'Destituiu' comunica com clareza a perda do cargo.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: porque ela havia feito
  rationale: No contexto, a oração apresenta a razão da destituição; o mais-que-perfeito explicita naturalmente que a fabricação antecedeu a medida de Asa.
- source_word: מִפְלֶצֶת
  choice: uma imagem repugnante
  rationale: Preserva a forte avaliação negativa do objeto cultual sem determinar indevidamente sua forma exata.
- source_word: לָאֲשֵׁרָה
  choice: para Aserá
  rationale: A transliteração preserva a possibilidade de referência à deusa ou ao símbolo cultual associado a ela.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: derrubou a imagem dela
  rationale: כרת tem sentido concreto de cortar ou abater. 'Derrubou' é natural em português para um objeto possivelmente erguido, sem afirmar além do texto que se tratava de um poste.
- source_word: וַיִּשְׂרֹף
  choice: a queimou
  rationale: Tradução direta e natural do verbo 'queimar', com pronome retomando a imagem.
- source_word: בְּנַחַל קִדְרוֹן
  choice: no vale do Cedrom
  rationale: נחל pode indicar vale, ravina, leito de torrente ou uádi; 'vale do Cedrom' é uma designação geográfica clara e tradicional em português.
theological_decisions:
- issue: Referente de אֲשֵׁרָה
  choice: Aserá, sem especificar se o termo designa a deusa ou seu símbolo cultual
  alternative: a deusa Aserá; um poste de Aserá; um símbolo cultual de Aserá
  rationale: O hebraico admite mais de um referente, e o versículo já menciona separadamente um objeto fabricado. A transliteração evita resolver uma ambiguidade real.
- issue: Relação familiar de Maaca com Asa
  choice: sua mãe
  alternative: sua avó ou ancestral feminina
  rationale: O texto hebraico diz literalmente 'sua mãe'. A possibilidade de uso dinástico mais amplo é preservada em nota, sem harmonizar silenciosamente o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Rainha-mãe' explicita a função cortesã de גְּבִירָה; 'imagem repugnante' mantém a censura enfática do hebraico sem definir a forma do objeto. As notas preservam as ambiguidades genealógica e cultual.
