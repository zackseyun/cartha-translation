  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Nadabe e tudo o que ele fez não estão escritos no Livro das Crônicas dos Reis de Israel[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Livro dos Anais dos Reis de Israel”. A expressão hebraica se refere a um registro real, não necessariamente ao livro bíblico de Crônicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: Os demais atos de Nadabe
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula historiográfica, designa os atos ou feitos registrados, não apenas palavras. O וְ inicial é expresso naturalmente pela continuidade do discurso, sem acrescentar um marcador temporal.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta e natural da oração relativa, preservando o paralelismo formular do hebraico.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica que espera resposta afirmativa e conserva o sentido literal de כְּתוּבִים, “escritos”.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל seja literalmente “sobre”, em referência a um documento ou registro escrito o português idiomático pede “no”. “Livro” mantém a designação convencional, ainda que o suporte antigo pudesse ser um rolo.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: das Crônicas dos Reis de Israel
  rationale: A expressão funciona como título de uma fonte analística da corte. “Crônicas” preserva a formulação tradicional, enquanto a nota evita confundi-la necessariamente com o livro bíblico de Crônicas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção interrogativa preserva a fórmula retórica do hebraico; o marcador da nota foi colocado após o título da fonte, ao qual a nota efetivamente se refere.
