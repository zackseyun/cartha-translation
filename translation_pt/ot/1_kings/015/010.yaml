id: 1KI.15.10
reference: 1 Kings 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: pt
  text: Reinou quarenta e um anos em Jerusalém, e o nome de sua mãe era Maaca, filha[a] de Abishalom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “filha” também pode designar, em contextos genealógicos, uma descendente de geração posterior.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: Abishalom; muitas traduções usam a forma “Absalão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: quarenta e um anos
  rationale: A construção hebraica diz literalmente “quarenta e um ano”, mas o plural é a forma idiomática e natural em português para indicar a duração do reinado.
- source_word: מָלַךְ
  choice: reinou
  rationale: Neste contexto, o verbo descreve a duração do governo real, não o momento da ascensão ao trono.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição בְּ indica localização; “em Jerusalém” é a formulação natural em português.
- source_word: וְשֵׁם אִמּוֹ
  choice: e o nome de sua mãe era
  rationale: Mantém de modo claro e digno a estrutura e o sentido da expressão hebraica.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Forma tradicional e reconhecível do nome em português, correspondente ao hebraico Ma‘akhah.
- source_word: בַּת
  choice: filha de
  rationale: “Filha” é o sentido lexical direto. Como o termo pode ter sentido genealógico mais amplo, essa possibilidade é indicada em nota sem substituir a expressão do texto.
- source_word: אֲבִישָׁלוֹם
  choice: Abishalom
  rationale: Preserva a forma específica do nome encontrada no texto hebraico; a forma portuguesa mais conhecida, “Absalão”, é registrada em nota.
theological_decisions:
- issue: Designação de parentesco de Maaca
  choice: Manter “filha de Abishalom” no texto principal.
  alternative: “descendente de Abishalom” ou, conforme uma harmonização genealógica, “neta de Abishalom”
  rationale: O hebraico afirma explicitamente “filha de”. A tradução conserva essa formulação e não resolve silenciosamente a questão histórica ou genealógica; a amplitude possível do termo é informada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Conserva-se a expressão genealógica literal no texto, enquanto as alternativas relevantes são apresentadas em notas. Os marcadores foram posicionados junto aos termos a que se referem.
