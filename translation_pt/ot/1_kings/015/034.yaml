  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh e andou no caminho de Jeroboão e no pecado de Jeroboão, pelo qual ele levou Israel a pecar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Fez o que era mau
  rationale: A fórmula hebraica significa praticar aquilo que é mau; esta forma conserva a avaliação moral e soa natural em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica da avaliação divina e verte diretamente o nome divino.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: andou no caminho de Jeroboão
  rationale: Mantém a metáfora recorrente de conduta e imitação presente na linguagem de Reis.
- source_word: וּבְחַטָּאתוֹ
  choice: e no pecado
  rationale: O sufixo hebraico se refere a Jeroboão, já mencionado imediatamente antes; em português, omitir o possessivo evita uma possível atribuição ambígua ao sujeito principal sem perder o referente contextual.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com que ele levou Israel a pecar
  rationale: Expressa a força causativa do hifil de חטא e liga a oração relativa ao pecado de Jeroboão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração Yahweh preserva o nome divino segundo a orientação do projeto.
- issue: Agência de Jeroboão no pecado de Israel
  choice: levou Israel a pecar
  alternative: fez Israel pecar
  rationale: A formulação conserva a causalidade expressa pelo verbo hebraico sem especificar além do texto o modo de influência ou coerção.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e preservação das metáforas formulaicas de Reis.
