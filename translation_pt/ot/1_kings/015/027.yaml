reference: 1 Kings 15:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: pt
  text: Então Baasa, filho de Aías, da casa de Issacar, conspirou contra ele[a] e o abateu[b] em Gibetom, que pertencia aos filisteus[c], enquanto Nadabe e todo o Israel sitiavam Gibetom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tramou contra ele” ou “formou uma conspiração contra ele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o matou”; literalmente, “o feriu”.
    reason: lexical_alternative
  - marker: c
    text: Ou “que estava sob o domínio dos filisteus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: conspirou contra ele
  rationale: A construção קשר com עַל designa uma conspiração contra alguém, especialmente em contexto político; a formulação portuguesa é natural e preserva esse sentido.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasa, filho de Aías
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis, e בֶּן recebe sua tradução filial normal.
- source_word: לְבֵית יִשָּׂשכָר
  choice: da casa de Issacar
  rationale: A expressão identifica a linhagem tribal ou familiar e mantém o sentido genealógico de בַּיִת.
- source_word: וַיַּכֵּהוּ
  choice: o abateu
  rationale: O verbo נכה significa literalmente golpear ou ferir; no contexto, o golpe é fatal. 'Abateu' conserva a imagem verbal e comunica com naturalidade o resultado.
- source_word: בְּגִבְּתוֹן
  choice: em Gibetom
  rationale: A preposição local בְּ é adequadamente expressa por 'em' diante do nome da cidade.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: que pertencia aos filisteus
  rationale: A construção com לְ indica posse ou domínio; a tradução direta preserva a possibilidade de se tratar de controle político-militar.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: enquanto Nadabe e todo o Israel
  rationale: O waw introduz aqui a circunstância simultânea em que ocorreu o atentado; 'enquanto' torna clara essa relação temporal.
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: sitiavam Gibetom
  rationale: צור על, em contexto militar, significa cercar ou sitiar; o particípio indica uma ação em andamento.
