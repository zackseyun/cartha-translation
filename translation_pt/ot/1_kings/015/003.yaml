  text: וַ/יֵּ֕לֶךְ בְּ/כָל חַטֹּ֥אות אָבִ֖י/ו אֲשֶׁר עָשָׂ֣ה לְ/פָנָ֑י/ו וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥ד אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: pt
  text: Ele andou em todos os pecados que seu pai havia cometido diante dele[a], e seu coração não era inteiramente dedicado a Yahweh[c], seu Deus[b], como o coração de Davi, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “diante dele” pode significar “em sua presença” ou “antes dele”. A formulação também pode sugerir que os pecados do pai estavam diante do filho como exemplo que ele seguiu.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu coração não era plenamente leal a Yahweh, seu Deus”.'
    reason: alternative_reading
  - marker: c
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: andou em todos os pecados
  rationale: Preserva a metáfora hebraica de andar como modo de conduta. Embora seja uma formulação de sabor bíblico, continua clara em português moderno e evita acrescentar uma paráfrase como “seguiu os caminhos pecaminosos”.
- source_word: אָבִיו אֲשֶׁר עָשָׂה לְפָנָיו
  choice: que seu pai havia cometido diante dele
  rationale: “Cometido” explicita o sentido natural de עשה quando o objeto são pecados, e o mais-que-perfeito marca a anterioridade em relação à conduta do filho. “Diante dele” mantém aberta a possível nuance espacial, temporal ou exemplar de לְפָנָיו.
- source_word: לְבָבוֹ
  choice: seu coração
  rationale: Mantém a imagem hebraica do centro interior da vontade, da lealdade e das decisões, plenamente compreensível em português.
- source_word: שָׁלֵם עִם
  choice: inteiramente dedicado a
  rationale: Expressa a ideia contextual de devoção integral e lealdade não dividida, sem sugerir perfeição absoluta. A preposição “a” é a regência natural em português com “dedicado”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: como o coração de Davi, seu pai
  rationale: Conserva a comparação explícita entre os corações e mantém “pai” no sentido genealógico amplo empregado pelo texto hebraico.
theological_decisions:
- issue: Sentido de coração שָׁלֵם para com Yahweh
  choice: não era inteiramente dedicado a Yahweh
  alternative: não era plenamente leal a Yahweh; não era íntegro para com Yahweh
  rationale: O contexto avalia a fidelidade pactual e a devoção não dividida, não uma condição de impecabilidade. “Inteiramente dedicado” comunica essa orientação sem eliminar a força da censura.
- issue: Representação do tetragrama יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A forma escolhida representa o nome pessoal presente no texto hebraico e evita substituí-lo silenciosamente por um título.
- issue: Davi chamado de “pai”
  choice: Davi, seu pai
  alternative: Davi, seu antepassado
  rationale: A tradução conserva a linguagem genealógica do hebraico, na qual “pai” pode designar um ancestral, sem estreitar o termo por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “andou em” preserva deliberadamente a metáfora ética hebraica; “inteiramente dedicado” evita tanto o arcaísmo quanto uma leitura de perfeição sem pecado. A pontuação distingue naturalmente o nome divino e a expressão “seu Deus”.
