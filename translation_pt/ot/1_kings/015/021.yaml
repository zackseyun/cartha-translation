base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/021.yaml
  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: pt
  text: Quando Baasa soube disso, parou de construir Ramá e permaneceu em Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... soube disso
  rationale: A fórmula narrativa introduz uma oração temporal. Em português atual, “Quando” comunica naturalmente essa função; “disso” explicita de modo idiomático o conteúdo ouvido, recuperado do contexto anterior.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio hebraico.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: parou de fortificar
  rationale: חדל com מן e infinitivo indica interrupção de uma atividade. Embora בנה signifique literalmente “construir”, no contexto trata-se das obras defensivas de Ramá; “fortificar” comunica com clareza a ação contextual sem alterar seu sentido.
- source_word: אֶת הָרָמָה
  choice: Ramá
  rationale: O termo é aqui o nome do lugar, vertido segundo a forma portuguesa corrente, sem artigo.
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: ישׁב pode significar sentar-se, habitar, ficar ou permanecer. Neste contexto narrativo, “permaneceu” evita sugerir, sem necessidade, uma nova residência definitiva.
- source_word: בְּתִרְצָה
  choice: em Tirza
  rationale: O nome do lugar recebe a forma portuguesa corrente, e a preposição ב é naturalmente traduzida por “em”.
