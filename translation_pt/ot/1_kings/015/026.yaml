source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh e andou no caminho de seu pai e no pecado de seu pai, com o qual seu pai levou Israel a pecar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: fez o que era mau
  rationale: Mantém a fórmula de avaliação régia e verte naturalmente o adjetivo substantivado hebraico.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora avaliativa hebraica em uma expressão corrente e digna em português, mantendo o nome divino.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: andou no caminho de seu pai
  rationale: Conserva a metáfora moral de andar em um caminho e a referência ao padrão de conduta paterno.
- source_word: וּבְחַטָּאתוֹ
  choice: e no pecado
  rationale: Preserva o substantivo singular e sua ligação com a oração relativa; em português, omitir aqui o possessivo evita atribuir antecipadamente o pecado ao filho, embora o sufixo hebraico seja formalmente ambíguo quanto ao antecedente.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com que ele levou Israel a pecar
  rationale: Expressa o valor causativo do hifil de חטא em português natural e conserva a relação instrumental com o pecado mencionado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal; a transliteração Yahweh o preserva sem substituí-lo por um título.
- issue: Referente dos sufixos em אָבִיו, חַטָּאתוֹ e sujeito de הֶחֱטִיא
  choice: A redação mantém a sequência compacta e permite que o contexto identifique o pai como aquele que levou Israel a pecar.
  alternative: 'Explicitar: “no pecado de seu pai, com o qual seu pai levou Israel a pecar”'
  rationale: A sintaxe hebraica emprega pronomes masculinos singulares cuja referência depende do contexto. A tradução evita uma expansão interpretativa excessiva, embora o contexto de 1 Reis indique Jeroboão, o pai.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Registro narrativo digno; metáforas hebraicas centrais preservadas sem rigidez desnecessária.
