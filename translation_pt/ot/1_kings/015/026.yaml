    issue: O possessivo de «no pecado» foi omitido, e «ele» pode ser entendido como Nadabe.
    rationale: O hebraico traz «seu pecado», e a construção formulaica, confirmada pelo contexto de 1 Reis 15, atribui o pecado e a ação de levar Israel a pecar ao pai, Jeroboão. A versão atual perde o possessivo e cria uma ambiguidade portuguesa que não corresponde ao referente contextual.
  revised_text: Ele fez o que era mau aos olhos de Yahweh e andou no caminho de seu pai e no pecado de seu pai, com o qual seu pai levou Israel a pecar.
