  source_fidelity: A tradução preserva a fórmula régia, o nome Yahweh, a metáfora de caminhar e o sentido causativo de הֶחֱטִיא. Contudo, a omissão do possessivo em «no pecado» não representa o sufixo de חַטָּאתוֹ e enfraquece a ligação contextual desse pecado com o pai, Jeroboão. No contexto imediato, os pronomes da segunda parte referem-se ao pai.
  naturalness: O texto é claro e de registro adequado. Uma explicitação moderada do referente evita que «ele» seja naturalmente entendido como Nadabe, o sujeito principal da frase.
  terminology: «Yahweh», «mau aos olhos de», «andou no caminho» e «levou Israel a pecar» são escolhas adequadas, fiéis e naturais. «Com o qual» expressa bem a relação instrumental.
  issues:
