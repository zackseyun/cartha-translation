  yaml_path: translation/ot/1_kings/015/009.yaml
  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: pt
  text: No vigésimo ano de Jeroboão, rei de Israel, Asa tornou-se rei de Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: No vigésimo ano
  rationale: A combinação da conjunção e preposição com שָׁנָה introduz uma fórmula cronológica. Em português, a conjunção inicial não precisa ser expressa separadamente, e o cardinal hebraico tem naturalmente valor ordinal neste contexto.
- source_word: לְ/יָרָבְעָם
  choice: de Jeroboão
  rationale: A preposição לְ marca o reinado usado como referência para a contagem cronológica; a construção idiomática em português é “ano de Jeroboão”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta e natural do título real hebraico.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Nesta fórmula régia, o qatal de מָלַךְ assinala a ascensão ao trono, não simplesmente toda a duração do reinado.
- source_word: אָסָא
  choice: Asa
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reproduz com naturalidade a construção hebraica e identifica o reino sobre o qual Asa passou a reinar.
