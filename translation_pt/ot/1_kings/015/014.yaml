source:
  edition: WLC
  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: pt
  text: Mas os lugares altos não foram removidos. Ainda assim, o coração de Asa foi inteiramente dedicado a Yahweh durante toda a sua vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o coração de Asa foi íntegro para com Yahweh todos os seus dias”. Literalmente, o hebraico diz: “o coração de Asa foi inteiro com Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: os altares nos lugares altos
  rationale: בָּמוֹת designa locais elevados de culto, muitas vezes com santuários ou altares. A formulação evita que o leitor entenda apenas acidentes geográficos e continua concisa.
- source_word: לֹא סָרוּ
  choice: não foram removidos
  rationale: Com בָּמוֹת como sujeito, סוּר tem aqui o sentido contextual de eliminar ou abolir locais de culto.
- source_word: רַק
  choice: ainda assim
  rationale: Neste contexto, רַק introduz contraste concessivo entre a permanência dos lugares altos e a avaliação positiva da lealdade de Asa.
- source_word: לְבַב אָסָא
  choice: o coração de Asa
  rationale: לֵבָב refere-se à pessoa interior, incluindo vontade, disposição e lealdade; a construção nominal foi mantida naturalmente em português.
- source_word: שָׁלֵם
  choice: inteiramente dedicado
  rationale: Com 'coração' e עִם יהוה, שָׁלֵם exprime inteireza ou lealdade não dividida, sem necessariamente afirmar perfeição moral absoluta.
- source_word: עִם יְהוָה
  choice: a Yahweh
  rationale: Embora עִם signifique literalmente 'com', a expressão portuguesa 'dedicado a' comunica naturalmente a relação de lealdade indicada no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo tetragrama.
- source_word: כָּל יָמָיו
  choice: durante toda a sua vida
  rationale: Transmite em português corrente o alcance temporal da expressão hebraica literal 'todos os seus dias'.
theological_decisions:
- issue: O sentido do coração 'inteiro' de Asa apesar da permanência dos lugares altos
  choice: O versículo afirma a lealdade fundamental e integral de Asa a Yahweh, sem declarar que sua conduta ou suas reformas foram perfeitas.
  alternative: Entender שָׁלֵם como uma declaração de perfeição moral absoluta ou, no extremo oposto, enfraquecê-lo para uma aprovação apenas genérica.
  rationale: A justaposição entre os lugares altos não removidos e o coração שָׁלֵם preserva a tensão entre uma reforma incompleta e uma lealdade de fundo afirmada pelo narrador.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Altares nos lugares altos' explicita a natureza cultual de בָּמוֹת sem recorrer ao termo menos comum 'santuários de colina'. A nota preserva a imagem hebraica de um coração 'inteiro' e sua ambiguidade legítima.
