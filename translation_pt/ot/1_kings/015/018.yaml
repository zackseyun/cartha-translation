  source_fidelity: 'A redação do primeiro segmento funde sintaticamente os dois complementos: no hebraico, Asa toma (1) toda a prata e o ouro restantes nos tesouros da casa de Yahweh e (2) os tesouros da casa do rei. A repetição de אֶת antes de “os tesouros da casa do rei” indica um segundo objeto coordenado, não um segundo local onde a prata e o ouro restantes se encontravam.'
  naturalness: A revisão preserva um português moderno e claro. “Tomou” é mais adequado ao registro narrativo bíblico do que “pegou”, sem ser arcaico; “bem como” torna explícita a coordenação presente no hebraico.
  terminology: “Yahweh”, “Arã”, “Ben-Hadade”, “Tabrimom”, “Heziom” e “Damasco” são adequados. As notas mantêm alternativas legítimas e estão ancoradas nas expressões pertinentes.
