source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: pt
  text: 'Então Asa tomou toda a prata e o ouro que restavam nos tesouros da casa de Yahweh, bem como os tesouros da casa do rei[a], e os entregou nas mãos de seus servos. Depois, o rei Asa os enviou a Ben-Hadade, filho de Tabrimom, filho de Heziom, rei de Arã[b], que residia em Damasco, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do palácio real”, em vez de “da casa do rei”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Arã”; tradicionalmente, “Síria”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח אָסָא
  choice: Então Asa pegou
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa a sequência, e “pegou” comunica de modo natural o sentido básico de לקח.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: toda a prata e todo o ouro que restavam
  rationale: Mantém a ideia totalizante de כָּל, distingue os dois metais e traduz o particípio de יתר como aquilo que ainda restava.
- source_word: בְּאוֹצְרוֹת בֵּית יְהוָה
  choice: nos tesouros da casa de Yahweh
  rationale: “Tesouros” é adequado ao contexto de metais preciosos; “casa de Yahweh” preserva a expressão hebraica para o templo e translitera o nome divino.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: e nos tesouros da casa do rei
  rationale: Conserva a forma concreta do hebraico, embora no contexto a “casa do rei” seja o palácio; a alternativa é registrada em nota.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: e os entregou nas mãos dos seus servos
  rationale: Reproduz de maneira idiomática e ainda reconhecível a imagem hebraica de colocar algo sob a responsabilidade de alguém.
- source_word: וַיִּשְׁלָחֵם הַמֶּלֶךְ אָסָא
  choice: Depois, o rei Asa os enviou
  rationale: “Depois” marca a etapa seguinte da narrativa. O pronome masculino plural retoma naturalmente a prata e o ouro em português.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: Ben-Hadade, filho de Tabrimom, filho de Heziom
  rationale: Translitera os nomes e mantém a cadeia genealógica repetitiva do hebraico, sem convertê-la silenciosamente em “neto de”.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Preserva o nome histórico-geográfico hebraico em vez de substituí-lo pelo termo posterior “Síria”.
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: que residia em Damasco
  rationale: O particípio de ישב indica residência; “residia” é atual, claro e compatível com o registro narrativo.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz diretamente a fala que começa no versículo seguinte e preserva a ligação sintática do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa por transliteração, em vez de substituí-lo por um título.
- issue: Identificação de אֲרָם
  choice: Arã
  alternative: Síria
  rationale: “Arã” mantém a designação histórica do texto hebraico; “Síria” é a equivalência tradicional posterior e fica indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva as etapas da narrativa e parte do colorido concreto do hebraico, evitando arcaísmos desnecessários. Os marcadores de nota foram colocados imediatamente após as expressões às quais se referem.
