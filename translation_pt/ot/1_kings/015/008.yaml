  terminology: “Cidade de Davi”, “sepultaram” e “tornou-se rei em seu lugar” são escolhas naturais e fiéis. Convém acrescentar uma nota para a variante nominal, seguindo o dado textual relevante do hebraico e a trilha de auditoria inglesa.
