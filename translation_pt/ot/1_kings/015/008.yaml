base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: pt
  text: Abiam[b] descansou com seus antepassados[a], e o sepultaram na Cidade de Davi. Então Asa, seu filho, tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “descansou com seus antepassados”; fórmula hebraica tradicional para se referir à morte.
    reason: cultural_note
  - marker: b
    text: Em algumas passagens paralelas ou relacionadas, ele é chamado Abias; neste versículo, o hebraico traz Abiam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com os seus antepassados
  rationale: A fórmula hebraica é um eufemismo convencional para a morte, associado à reunião com as gerações anteriores. Em português, “descansou com os seus antepassados” preserva a imagem sem a ambiguidade moderna de uma tradução estritamente literal com “deitou-se”.
- source_word: אֲבִיָּם
  choice: Abião
  rationale: Representa em português a forma nominal Abijam presente no texto hebraico deste versículo, distinguindo-a de Abias, forma encontrada em passagens paralelas ou relacionadas.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: e o sepultaram
  rationale: Mantém a construção ativa no plural do hebraico, com sujeito indeterminado natural em português.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Emprega a forma consagrada e clara do topônimo bíblico em português.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: No contexto da fórmula de sucessão, o verbo assinala a ascensão ao trono, não apenas a duração do reinado.
- source_word: אָסָא בְנוֹ
  choice: Asa, seu filho
  rationale: A pontuação torna explícita a aposição e produz uma ordem natural em português, preservando todas as informações do hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa precisamente a substituição no cargo real indicada pela fórmula hebraica.
