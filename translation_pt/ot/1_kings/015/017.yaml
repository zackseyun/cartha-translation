  text: וַ/יַּ֨עַל בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: pt
  text: Então Baasa, rei de Israel, avançou contra Judá e construiu Ramá[a], para impedir que alguém fosse ou viesse a Asa, rei de Judá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortificou Ramá”. O verbo hebraico significa literalmente “construiu”, mas o contexto indica uma obra militar estratégica.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para não dar [que alguém] saísse e entrasse para Asa”. A expressão hebraica “sair e entrar” pode referir-se à circulação ou ao acesso em geral; Baasa procurava bloquear o movimento de pessoas relacionado a Asa, rei de Judá.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְהוּדָה
  choice: avançou contra Judá
  rationale: No contexto militar, עלה com עַל indica um avanço hostil. “Avançou contra” preserva esse sentido sem afirmar explicitamente que o ataque já se consumou.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta da cadeia construta que identifica o cargo e o reino de Baasa.
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: construiu Ramá
  rationale: O verbo בנה significa literalmente “construir”. O contexto sugere obras militares, mas isso é mantido em nota, sem substituir a formulação do texto hebraico.
- source_word: לְבִלְתִּי תֵּת
  choice: para não permitir
  rationale: Expressa naturalmente em português a finalidade preventiva da construção hebraica.
- source_word: יֹצֵא וָבָא
  choice: saísse nem entrasse
  rationale: Conserva o par verbal hebraico, que neste contexto abrange circulação e acesso. A negação dupla com “nem” é idiomática em português.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: em direção a Asa, rei de Judá
  rationale: A preposição לְ relaciona o movimento a Asa. “Em direção a” mantém a orientação do bloqueio sem acrescentar explicitamente um ponto de origem não expresso.
