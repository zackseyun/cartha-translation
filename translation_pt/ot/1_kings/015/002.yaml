base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: pt
  text: Reinou três anos em Jerusalém, e sua mãe se chamava Maaca, filha de Abisalão[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abisalão reflete a forma do nome no hebraico deste versículo; muitas traduções usam «Absalão».
    reason: lexical_alternative
  - marker: b
    text: Em certos contextos genealógicos, o hebraico «filha de» pode designar de modo mais amplo uma descendente.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: três anos
  rationale: O numeral cardinal com o substantivo no plural expressa a duração do reinado; esta é a formulação natural em português.
- source_word: מָלַךְ
  choice: reinou
  rationale: O qal de מלך indica aqui o exercício do governo real, não o momento da ascensão ao trono.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição ב marca localização; «em Jerusalém» é a expressão corrente em português.
- source_word: וְשֵׁם אִמּוֹ
  choice: e sua mãe se chamava
  rationale: Reproduz com naturalidade em português a fórmula régia hebraica, literalmente «e o nome de sua mãe era».
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Forma tradicional e reconhecível em português para a transliteração do nome hebraico.
- source_word: בַּת
  choice: filha de
  rationale: Preserva no texto principal o sentido lexical direto de בת, sem decidir se a expressão genealógica tem alcance mais amplo neste contexto.
- source_word: אֲבִישָׁלוֹם
  choice: Abisalão
  rationale: Representa em forma portuguesa o nome hebraico Abishalom e mantém sua distinção formal em relação a Absalão.
theological_decisions:
- issue: Alcance genealógico de בַּת אֲבִישָׁלוֹם
  choice: Manter «filha de Abisalão» no texto principal.
  alternative: «descendente de Abisalão» ou, conforme a reconstrução genealógica, «neta de Abisalão».
  rationale: O hebraico diz literalmente «filha de». Como termos de parentesco podem ocasionalmente indicar descendência mais ampla, a tradução preserva a expressão textual e registra a possibilidade em nota, sem resolver a tensão histórica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega-se a forma onomástica portuguesa «Maaca» e «Abisalão»; a sintaxe da fórmula régia é levemente naturalizada sem perda de conteúdo.
