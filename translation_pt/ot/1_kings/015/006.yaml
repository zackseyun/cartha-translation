base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: pt
  text: E houve guerra entre Roboão e Jeroboão durante todos os dias da vida dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante todos os dias da vida de Roboão”. Alguns intérpretes, à luz do contexto e da discussão textual, entendem que o pronome se refere, em vez disso, a Abias (Abião).'
    reason: Leitura alternativa quanto ao referente do pronome masculino singular.
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: E houve guerra
  rationale: מִלְחָמָה significa “guerra” ou “conflito armado”; a conjunção וּ preserva a ligação narrativa com “E”.
- source_word: הָיְתָה
  choice: houve
  rationale: O perfeito qal de היה, nesta construção existencial, é expresso naturalmente em português por “houve”, sem acrescentar a ideia lexical de continuidade.
- source_word: בֵין ... וּ/בֵין
  choice: entre ... e
  rationale: As preposições correlatas indicam as duas partes do conflito; a formulação portuguesa natural é “entre ... e”.
- source_word: רְחַבְעָם
  choice: Roboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כָּל יְמֵי
  choice: durante todos os dias de
  rationale: Preserva com clareza o idioma hebraico que expressa toda a duração da vida da pessoa.
- source_word: חַיָּיו
  choice: a vida dele
  rationale: O plural hebraico com sufixo masculino singular é idiomaticamente “a vida dele”; essa forma mantém a referência pronominal sem fixar seu antecedente.
theological_decisions:
- issue: Referente do pronome em “todos os dias da vida dele”
  choice: Manter “dele” sem identificar o antecedente no texto principal.
  alternative: Explicitar “da vida de Roboão” ou entender a referência como sendo a Abias (Abião).
  rationale: O sufixo hebraico é masculino singular, mas a oração não identifica explicitamente seu referente. O contexto e a discussão textual permitem entendimentos diferentes; por isso, a tradução conserva a ambiguidade genuína e a nota apresenta as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Houve guerra” mantém a construção existencial do hebraico; “a vida dele” é natural no português corrente e preserva a ambiguidade do pronome.
