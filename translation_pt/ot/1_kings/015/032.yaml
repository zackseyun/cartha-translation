base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/032.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: pt
  text: E houve guerra entre Asa e Baasa, rei de Israel, todos os seus dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais idiomaticamente: “por toda a vida deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: E houve guerra
  rationale: Reproduz de modo natural a construção existencial hebraica e mantém a ligação narrativa indicada pela conjunção, sem acrescentar a ideia de continuidade ao verbo.
- source_word: בֵּין ... וּ/בֵין
  choice: entre ... e
  rationale: É a forma idiomática em português para as preposições correlativas hebraicas.
- source_word: אָסָא
  choice: Asa
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Transliteração tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Traduz diretamente a construção nominal que identifica Baasa; a aposição dispensa artigo em português.
- source_word: כָּל יְמֵי/הֶם
  choice: durante todos os dias deles
  rationale: Preserva a expressão hebraica e a referência pronominal plural, deixando em aberto seu alcance exato; uma formulação com 'vida' seria mais idiomática, porém mais interpretativa.
theological_decisions:
- issue: Alcance de כָּל יְמֵיהֶם ('todos os dias deles')
  choice: durante todos os dias deles
  alternative: enquanto ambos viveram
  rationale: O texto hebraico usa um sufixo plural, mas o contexto pode suscitar questões cronológicas sobre o alcance da expressão. A tradução mantém a ambiguidade e não a resolve por interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a expressão temporal literal e sua ambiguidade.
