source:
  edition: WLC
  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: pt
  text: Contudo, por causa de Davi, Yahweh, seu Deus, deu-lhe uma lâmpada[a] em Jerusalém, para suscitar seu filho depois dele e manter Jerusalém de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma luz”. A expressão “deu-lhe uma lâmpada em Jerusalém” é uma metáfora da preservação da linhagem real de Davi naquela cidade.
    reason: alternativa lexical e esclarecimento da metáfora
lexical_decisions:
- source_word: כִּי
  choice: Contudo
  rationale: No contexto, a oração explica por que Abias não foi eliminado apesar de seu pecado; o conector adversativo-concessivo comunica essa relação melhor do que um simples “pois”.
- source_word: לְמַעַן דָּוִד
  choice: por causa de Davi
  rationale: A expressão indica que Yahweh agiu em consideração a Davi; esta formulação é natural em português e preserva a motivação pactual sem acrescentar explicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Preserva a construção possessiva e sua possível referência contextual sem explicitação indevida.
- source_word: נִיר
  choice: lâmpada
  rationale: Mantém a imagem concreta hebraica, usada metaforicamente para a continuidade da linhagem real de Davi.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Tradução natural da preposição locativa ב.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: levantando seu filho depois dele
  rationale: Expressa a ação de fazer surgir o sucessor dinástico e conserva a formulação “depois dele” do hebraico.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: e mantendo Jerusalém firme
  rationale: O hifil de עמד indica fazer permanecer ou sustentar; a formulação distingue este verbo de קום e comunica a preservação de Jerusalém.
theological_decisions:
- issue: Sentido metafórico de נִיר em relação à aliança davídica
  choice: Conservar “lâmpada” no texto principal
  alternative: linhagem; dinastia; luz
  rationale: A metáfora alude à continuidade da casa de Davi. Preservá-la mantém as ressonâncias intertextuais e evita transformar a interpretação em tradução.
- issue: Referente de “seu Deus”
  choice: Preservar o pronome sem explicitar o referente
  alternative: “o Deus de Abias” ou “o Deus de Davi”
  rationale: O contexto favorece o rei então em foco, mas a forma hebraica não nomeia o referente; a tradução conserva essa formulação.
- issue: Relação dos infinitivos com o ato de dar uma lâmpada
  choice: Traduzir como ações que concretizam a concessão da lâmpada
  alternative: “para levantar... e estabelecer...”
  rationale: Os infinitivos hebraicos podem exprimir propósito ou resultado. O gerúndio português preserva essa abertura melhor do que uma formulação exclusivamente final.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o nome Yahweh e a metáfora hebraica; evita vocabulário denominacional.
