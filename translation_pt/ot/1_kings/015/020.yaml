  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: pt
  text: Ben-Hadade atendeu ao rei Asa[a] e enviou os comandantes dos seus exércitos contra as cidades de Israel. Ele atacou Ijom, Dã, Abel-Bete-Maaca e toda Quinerote[b], bem como toda a terra de Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deu ouvidos ao rei Asa”. A expressão hebraica transmite a ideia de ouvir favoravelmente e agir conforme o pedido.'
    reason: lexical_alternative
  - marker: b
    text: Quinerote é aqui um nome de lugar, provavelmente de um distrito ou uma região, e não o substantivo comum “harpas”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: atendeu a
  rationale: O idioma hebraico indica ouvir favoravelmente e agir de acordo com o pedido. “Atendeu a” expressa essa resposta sem sugerir que Asa tivesse autoridade para dar ordens a Ben-Hadade.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: os comandantes dos seus exércitos
  rationale: שָׂרֵי designa chefes ou comandantes, e חֲיָלִים, neste contexto militar, refere-se a exércitos ou forças. O possessivo português traduz naturalmente אֲשֶׁר לוֹ.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: contra as cidades de Israel
  rationale: Com o verbo “enviar” em contexto militar, עַל indica o alvo hostil da expedição.
- source_word: וַיַּךְ
  choice: atacou
  rationale: נכה pode significar golpear, atacar ou derrotar. “Atacou” comunica com naturalidade a ação militar sem afirmar explicitamente uma derrota total.
- source_word: עִיּוֹן
  choice: Ijom
  rationale: Forma aportuguesada corrente do topônimo hebraico, com terminação que representa o nun final.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Bete-Maaca
  rationale: Transliteração aportuguesada e legível do topônimo composto.
- source_word: כָּל כִּנְרוֹת
  choice: toda Quinerote
  rationale: כִּנְרוֹת funciona aqui como topônimo, provavelmente uma região ou distrito; “toda” preserva כָּל sem inserir “região” no texto principal.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: bem como toda a terra de Naftali
  rationale: Aqui עַל pode estender o alcance geográfico da lista. “Bem como” produz português natural e apresenta a terra de Naftali como o território mais amplo atingido pela campanha.
