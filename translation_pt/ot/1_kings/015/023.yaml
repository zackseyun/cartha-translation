source:
  edition: WLC
  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: pt
  text: Quanto aos demais atos de Asa, a todo o seu poder, a tudo o que fez e às cidades que construiu, não estão registrados no Livro das Crônicas dos Reis de Judá?[a] Contudo, na velhice, ele adoeceu dos pés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não estão escritos no Livro dos Anais dos Reis de Judá?”'
    reason: Registra a alternativa mais formal para כְתוּבִים e דִּבְרֵי הַיָּמִים, que podem ser traduzidos como “escritos” e “anais”.
  - marker: b
    text: 'Ou: “ele ficou doente dos pés”. O hebraico indica a parte do corpo afetada, mas não identifica a doença.'
    reason: Preserva a indeterminação do texto quanto à natureza exata da enfermidade.
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: Quanto aos demais atos de Asa
  rationale: Reproduz a fórmula de encerramento dos relatos régios de modo natural em português. דְּבָרִים, neste contexto historiográfico, refere-se a atos e acontecimentos, não apenas a palavras.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: a todo o seu poder
  rationale: גְּבוּרָה pode indicar força, poder ou feitos poderosos. “Poder” preserva o substantivo abstrato e o distingue da oração seguinte.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: a tudo o que fez
  rationale: Tradução direta e abrangente da oração relativa.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: e às cidades que construiu
  rationale: Mantém o sentido explícito de בנה, “construir”; não explicita “fortificar”, embora isso possa estar implícito no contexto.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: não estão registrados
  rationale: Preserva a pergunta retórica da fórmula hebraica; “registrados” é natural para informações contidas em anais oficiais.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: no Livro das Crônicas dos Reis de Judá
  rationale: Expressa de forma clara o título da fonte régia mencionada, sem confundi-la necessariamente com o livro bíblico de Crônicas.
- source_word: רַק לְעֵת זִקְנָתוֹ
  choice: Contudo, na velhice
  rationale: רַק introduz aqui uma ressalva ou nota contrastante; “Contudo” comunica essa função, e “na velhice” traduz naturalmente a expressão temporal.
- source_word: חָלָה אֶת רַגְלָיו
  choice: ele adoeceu dos pés
  rationale: Conserva a referência específica aos pés sem identificar uma doença que o hebraico não nomeia.
