base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: pt
  text: “Há uma aliança entre mim e você, entre meu pai e seu pai. Veja, enviei-lhe um suborno de prata e ouro. Vá e rompa sua aliança com Baasa, rei de Israel, para que ele se afaste de mim.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: aliança
  rationale: Mantém o termo pactual recorrente e preserva o paralelismo entre as duas relações políticas mencionadas.
- source_word: שֹׁחַד
  choice: suborno
  rationale: O termo normalmente designa pagamento destinado a influenciar uma decisão; aqui, a prata e o ouro procuram induzir o rompimento de uma aliança existente. A tradução preserva a avaliação negativa implícita no vocábulo.
- source_word: הָפֵרָה
  choice: rompa
  rationale: O hifil imperativo de פרר expressa tornar inválida ou quebrar uma aliança; “rompa” é natural e preciso em português.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: para que ele se retire de cima de mim
  rationale: Preserva a imagem espacial e a força opressiva do hebraico, em vez de reduzi-la apenas a “afastar-se de mim”.
theological_decisions:
- issue: Avaliação do pagamento enviado ao rei arameu
  choice: suborno
  alternative: presente
  rationale: A escolha segue o sentido comum de שֹׁחַד e não suaviza moralmente a ação política de Asa.
- issue: Relação entre as alianças familiares
  choice: “como houve entre meu pai e seu pai”
  alternative: “entre meu pai e seu pai”
  rationale: O hebraico coordena as duas relações sem verbo explícito. A inserção de “como houve” explicita naturalmente em português a elipse, sem afirmar que a aliança anterior ainda estava em vigor.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” adequado à legibilidade brasileira ampla. A formulação conserva o tom diplomático direto e a metáfora final do hebraico.
