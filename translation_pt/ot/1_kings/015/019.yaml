  verdict: revise
  source_fidelity: A tradução transmite corretamente a aliança, o suborno e a ordem para que Ben-Hadade rompa sua aliança com Baasa. Contudo, “como houve” introduz uma relação comparativa e temporal que o hebraico apenas justapõe, e “estou lhe enviando” enfraquece o perfeito “enviei”. A expressão idiomática hebraica final deve ser vertida naturalmente como afastamento, sem uma imagem espacial opaca em português.
  naturalness: “De cima de mim” é pouco idiomático em português moderno neste contexto e pode sugerir uma posição física literal. “Se afaste de mim” comunica de modo claro a retirada da pressão/hostilidade pretendida.
  terminology: “Aliança”, “suborno” e “rompa” são escolhas adequadas para בְּרִית, שֹׁחַד e o imperativo de פרר. “Baasa” é uma forma portuguesa estabelecida e apropriada.
