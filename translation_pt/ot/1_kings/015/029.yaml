  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: pt
  text: Quando se tornou rei, matou toda a casa de Jeroboão. Não deixou a Jeroboão ninguém com vida, até destruí-la[a], conforme a palavra que Yahweh havia falado por meio de seu servo Aías, o silonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz um sufixo masculino singular: “até destruí-lo”. Pode referir-se a Jeroboão como representante de sua casa, ou à sua casa entendida coletivamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: Assim que se tornou rei
  rationale: A construção narrativa com וַיְהִי e כְ temporal indica o momento da ascensão ao trono; “assim que” exprime com naturalidade a sequência imediata sugerida pelo contexto.
- source_word: הִכָּה
  choice: matou
  rationale: Embora נכה tenha o sentido básico de golpear, neste contexto de eliminação total da dinastia o resultado letal é explícito; “matou” é claro e natural em português.
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: toda a casa de Jeroboão
  rationale: “Casa” preserva o sentido familiar e dinástico da expressão hebraica, sem reduzi-la apenas aos moradores de uma residência.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה
  choice: Não deixou ... ninguém com vida
  rationale: נְשָׁמָה evoca literalmente respiração, mas a expressão idiomática significa que nenhum sobrevivente foi deixado. A formulação portuguesa comunica o sentido com clareza.
- source_word: לְיָרָבְעָם
  choice: a Jeroboão
  rationale: 'Mantém a relação expressa por לְ: não restou a Jeroboão ninguém pertencente à sua linhagem ou casa.'
- source_word: עַד הִשְׁמִידוֹ
  choice: até acabar com ela
  rationale: O sufixo masculino singular pode retomar coletivamente a casa de Jeroboão, cujo gênero em português exige “ela”. A nota registra a possibilidade formal de referência a Jeroboão.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Reproduz a fórmula de cumprimento e translitera o nome divino pessoal.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: que ele havia falado por meio de seu servo
  rationale: “Por meio de” comunica naturalmente a mediação profética indicada pelo idiomatismo literal “pela mão de”.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: Aías, o silonita
  rationale: Emprega as formas portuguesas tradicionais e inteligíveis do nome próprio e do gentílico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o Tetragrama como nome pessoal; “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Referente do sufixo em הִשְׁמִידוֹ
  choice: a casa de Jeroboão como coletivo (“ela”)
  alternative: Jeroboão como cabeça epônima da casa (“ele”)
  rationale: O antecedente discursivo mais próximo e semanticamente adequado é “toda a casa de Jeroboão”. Como o hebraico permite referência coletiva masculina singular, a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva “casa” no sentido dinástico e “Yahweh” como nome divino, enquanto verte os idiomatismos hebraicos em linguagem natural.
