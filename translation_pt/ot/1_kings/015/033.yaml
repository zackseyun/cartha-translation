  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: pt
  text: No terceiro ano de Asa, rei de Judá, Baasa, filho de Aías, tornou-se rei sobre todo o Israel, em Tirza, e reinou vinte e quatro anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שָׁלֹשׁ
  choice: No terceiro ano
  rationale: A construção temporal com בְּ e o numeral expressa a fórmula de datação régia; “No terceiro ano” é natural e fiel em português.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: de Asa, rei de Judá
  rationale: O לְ indica a referência ao reinado de Asa. As vírgulas tornam clara a aposição em português.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste contexto, o verbo introduz a ascensão de Baasa ao trono. Essa formulação evita confundi-la com a duração do reinado, indicada no fim do versículo.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasa, filho de Aías
  rationale: Os nomes seguem formas portuguesas bíblicas amplamente reconhecíveis, e o patronímico hebraico é preservado por “filho de”.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: עַל com מָלַךְ indica domínio régio; “todo o Israel” conserva a extensão expressa no hebraico.
- source_word: בְּ/תִרְצָה
  choice: em Tirza
  rationale: A preposição בְּ marca o local, expresso naturalmente em português por “em”.
- source_word: עֶשְׂרִים וְ/אַרְבַּע שָׁנָה
  choice: vinte e quatro anos
  rationale: A expressão numeral indica a duração do reinado; o verbo “reinou” explicita em português a relação sintática e semântica.
