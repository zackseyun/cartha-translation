  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: pt
  text: 'Ele levou para a casa de Yahweh as coisas consagradas por seu pai e as que ele próprio havia consagrado: prata, ouro e utensílios.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: levou
  rationale: O hifil de בוא significa comumente “levar” ou “trazer para dentro”; como o destino é expresso, “levou para” é natural em português.
- source_word: קָדְשֵׁי אָבִיו
  choice: as coisas consagradas por seu pai
  rationale: O plural construto designa objetos separados ou dedicados ao uso sagrado. A formulação verbal comunica esse sentido com clareza e evita sugerir mera propriedade do pai.
- source_word: וְקָדְשׁוֹ
  choice: e as que ele próprio havia consagrado
  rationale: O substantivo com sufixo masculino singular tem sentido coletivo neste contexto; a tradução mantém o paralelismo e explicita naturalmente que se trata das coisas por ele dedicadas.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: “Casa” preserva a expressão hebraica para o santuário, enquanto “Yahweh” translitera o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: prata, ouro e utensílios
  rationale: Os termos especificam os objetos consagrados. “Utensílios” é suficientemente amplo para כלי no contexto do santuário e soa natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de קָדְשֵׁי אָבִיו וְקָדְשׁוֹ
  choice: coisas que o pai e o próprio rei haviam consagrado
  alternative: coisas santas pertencentes ao pai e ao rei
  rationale: No contexto, קדשׁ designa bens dedicados ao santuário. A tradução verbal expressa essa relação sem definir além do texto a ocasião ou a modalidade da dedicação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada para fluência; os dois grupos de objetos consagrados permanecem paralelos, e a lista final é apresentada como especificação deles.
