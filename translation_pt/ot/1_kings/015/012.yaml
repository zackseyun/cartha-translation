  text: וַ/יַּעֲבֵ֥ר הַ/קְּדֵשִׁ֖ים מִן הָ/אָ֑רֶץ וַ/יָּ֨סַר֙ אֶת כָּל הַ/גִּלֻּלִ֔ים אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: pt
  text: Ele expulsou[a] da terra os prostitutos cultuais[b] e retirou todos os ídolos repugnantes[c] que seus antepassados[d] haviam feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “removeu”. O verbo pode indicar fazer alguém sair de um lugar, isto é, removê-lo ou expulsá-lo.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico קְדֵשִׁים, homens associados a práticas sexuais em cultos ilícitos. Algumas traduções antigas dizem “sodomitas”, mas esse termo não expressa com precisão o sentido lexical neste contexto.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico é depreciativo e também pode ser traduzido por “ídolos detestáveis”; talvez contenha uma comparação insultuosa com excrementos.
    reason: lexical_alternative
  - marker: d
    text: 'Literalmente: “seus pais”; expressão hebraica que pode designar as gerações anteriores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: expulsou
  rationale: O hifil de עבר, com מִן־הָאָרֶץ, indica fazer desaparecer de um lugar, remover ou expulsar. “Expulsou” expressa com naturalidade que essas pessoas foram retiradas do território, sem especificar o método.
- source_word: הַקְּדֵשִׁים
  choice: os prostitutos cultuais
  rationale: O substantivo masculino plural designa aqui homens ligados a práticas sexuais em culto ilícito. “Prostitutos cultuais” preserva tanto o sexo masculino quanto a associação religiosa, sem recorrer ao tradicional, porém lexicalmente impreciso, “sodomitas”.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: Mantém a formulação hebraica e, no contexto, refere-se provavelmente ao território de Judá.
- source_word: וַיָּסַר
  choice: eliminou
  rationale: O hifil de סור significa retirar, afastar ou remover. “Eliminou” é natural no contexto de uma reforma religiosa e evita repetir o verbo da primeira oração.
- source_word: כָּל הַגִּלֻּלִים
  choice: todos os ídolos repugnantes
  rationale: גִּלּוּלִים é uma designação fortemente depreciativa dos ídolos. “Ídolos repugnantes” comunica tanto o referente quanto o tom de desprezo do termo hebraico.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: que seus antepassados haviam feito
  rationale: “Antepassados” transmite naturalmente o uso idiomático de “pais” para gerações anteriores. O mais-que-perfeito composto indica que eles os fizeram antes das medidas tomadas por Asa.
theological_decisions:
- issue: Sentido de הַקְּדֵשִׁים
  choice: prostitutos cultuais
  alternative: consagrados; sodomitas
  rationale: O contexto associa o termo a uma prática cultual ilícita exercida por homens. A tradução evita tanto o sentido etimológico enganoso “consagrados” quanto a categoria moral posterior evocada por “sodomitas”.
- issue: Tradução de אֲבֹתָיו
  choice: seus antepassados
  alternative: seus pais
  rationale: O hebraico diz literalmente “seus pais”, mas emprega a expressão de modo idiomático para predecessores de gerações anteriores. “Antepassados” preserva esse sentido sem determinar que se trate apenas do pai imediato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Prostitutos cultuais” é deliberadamente preciso e conciso; as notas esclarecem o contexto e as alternativas sem importar categorias confessionais posteriores.
