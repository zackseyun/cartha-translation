source:
  edition: WLC
  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: pt
  text: 'Também lhe dei o que você não pediu: tanto riqueza como honra, de modo que não haverá, entre os reis, homem algum como você durante toda a sua vida.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo que não houve, entre os reis, homem algum como você em todos os seus dias”.'
    reason: O perfeito hebraico pode ser entendido retrospectiva ou resultativamente; no contexto, a formulação no futuro expressa naturalmente o alcance da promessa por toda a vida de Salomão.
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Mantém a força aditiva que dá continuidade à fala divina, sem a rigidez de reproduzir separadamente a conjunção e a partícula.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: o que você não pediu
  rationale: Expressão idiomática e direta em português para a oração relativa hebraica.
- source_word: נָתַתִּי לָךְ
  choice: lhe dei
  rationale: O perfeito hebraico apresenta a concessão divina como realizada; o pretérito perfeito é natural em português e preserva esse aspecto.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: tanto riqueza como honra
  rationale: A construção correlativa reproduz os dois גַּם e distingue os dois benefícios. “Honra” expressa adequadamente o prestígio régio de כָּבוֹד neste contexto.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: de modo que ... não haverá ... homem algum como você
  rationale: Entende אֲשֶׁר como introdução do resultado da dádiva. O futuro comunica que a promessa abrange os dias de Salomão, enquanto “homem algum” preserva o substantivo masculino אִישׁ.
- source_word: בַּמְּלָכִים
  choice: entre os reis
  rationale: Expressa naturalmente a comparação de Salomão dentro do grupo dos reis.
- source_word: כָּל יָמֶיךָ
  choice: durante toda a sua vida
  rationale: Traduz o idioma hebraico literalmente relacionado a “todos os seus dias” em português atual e claro.
theological_decisions:
- issue: Valor temporal do perfeito לֹא הָיָה em uma promessa sobre todos os dias de Salomão
  choice: não haverá
  alternative: não houve
  rationale: Embora a forma verbal seja um perfeito, o contexto é uma concessão/promessa cujo efeito cobre toda a vida futura de Salomão. O futuro é, portanto, a leitura contextual mais natural, sem negar a possibilidade de uma formulação mais estritamente pretérita.
- issue: Referência masculina explícita de אִישׁ
  choice: homem algum
  alternative: ninguém
  rationale: A tradução conserva a referência masculina explícita do hebraico sem restringir indevidamente a comparação ao substantivo “rei”, que aparece em seguida.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. Os travessões destacam os dois dons adicionais sem romper a continuidade da frase.
