  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: pt
  text: 'Em Gibeão, Yahweh apareceu a Salomão num sonho durante a noite[a], e Deus disse: “Peça o que devo dar a você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no sonho da noite”, isto é, num sonho ocorrido durante a noite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: Em Gibeão
  rationale: A preposição בְּ marca localização; “em Gibeão” é a forma natural em português.
- source_word: נִרְאָה
  choice: apareceu
  rationale: O nifal de ראה descreve aqui uma manifestação divina; “apareceu” preserva o sentido sem especificar indevidamente seu modo.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama e o distingue de אֱלֹהִים na oração seguinte.
- source_word: אֶל שְׁלֹמֹה
  choice: a Salomão
  rationale: אֶל indica a pessoa a quem se dirige a aparição; a construção é idiomática em português.
- source_word: בַּ/חֲלוֹם הַ/לָּיְלָה
  choice: num sonho durante a noite
  rationale: Expressa naturalmente o hebraico literal “no sonho da noite”, mantendo tanto o meio da revelação quanto seu momento.
- source_word: וַ/יֹּאמֶר
  choice: e ... disse
  rationale: O waw consecutivo faz avançar a narrativa; a coordenação simples reproduz isso sem acrescentar uma nuance temporal.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Preserva a mudança lexical do nome Yahweh para o título אֱלֹהִים presente no hebraico.
- source_word: שְׁאַל
  choice: Peça
  rationale: O imperativo pede que Salomão formule um pedido; em português, “peça” comunica a construção de modo direto e natural.
- source_word: מָה אֶתֶּן לָךְ
  choice: o que devo dar a você
  rationale: A pergunta deliberativa hebraica é integrada naturalmente após o imperativo, sem transformar a oferta em promessa já definida.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio no texto-fonte e evita substituí-lo por um título.
- issue: Mudança de יהוה para אֱלֹהִים no mesmo versículo
  choice: Yahweh ... Deus
  alternative: Harmonizar ambas as ocorrências como “Deus” ou “Yahweh”
  rationale: Manter as duas designações distintas reflete a forma hebraica e não elimina uma possível nuance literária ou teológica.
- issue: Nuance de מָה אֶתֶּן לָךְ
  choice: o que devo dar a você
  alternative: o que lhe darei; o que você quer que eu lhe dê
  rationale: “Devo dar” preserva o caráter deliberativo da expressão sem acrescentar explicitamente desejo ou promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea e mantém o nome divino como Yahweh.
