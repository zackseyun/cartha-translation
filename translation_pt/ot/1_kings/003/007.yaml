  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: pt
  text: E agora, Yahweh, meu Deus, tu fizeste o teu servo reinar no lugar de Davi, meu pai; e eu sou muito jovem[a] e não sei sair nem entrar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser traduzida como “uma criança” ou “um jovem”; é uma autodescrição humilde que ressalta juventude e inexperiência.
    reason: lexical_alternative
  - marker: b
    text: “Sair e entrar” é uma expressão hebraica referente ao desempenho das próprias responsabilidades, especialmente na liderança pública.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando no texto o nome da aliança expresso pelo Tetragrama.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Reproduz diretamente a construção possessiva e sua função vocativa junto ao nome divino.
- source_word: הִמְלַכְתָּ
  choice: fizeste ... reinar
  rationale: Preserva o sentido causativo do hifil de מלך e soa natural em português.
- source_word: עַבְדְּךָ
  choice: o teu servo
  rationale: No contexto da oração régia, expressa serviço e humildade sem impor a ênfase social de 'escravo'.
- source_word: תַּחַת
  choice: no lugar de
  rationale: 'Indica sucessão: Salomão reina ocupando o lugar antes pertencente a Davi.'
- source_word: נַעַר קָטֹן
  choice: ainda sou muito jovem
  rationale: Comunica juventude e inexperiência sem determinar uma idade precisa; a nota preserva a amplitude lexical da expressão.
- source_word: לֹא אֵדַע
  choice: não sei
  rationale: Mantém a formulação direta do hebraico e introduz naturalmente o par verbal seguinte.
- source_word: צֵאת וָבֹא
  choice: sair nem entrar
  rationale: Conserva a imagem do idioma hebraico no texto principal, deixando sua aplicação às responsabilidades de liderança para a nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Idade e inexperiência de Salomão
  choice: ainda sou muito jovem
  alternative: sou uma criança pequena; sou um jovem pequeno
  rationale: A expressão hebraica pode designar desde uma criança até um jovem e funciona aqui como autodescrição humilde. A tradução evita transformar essa humildade em uma afirmação etária excessivamente precisa.
- issue: Sentido de 'sair e entrar'
  choice: manter o idioma no texto principal
  alternative: não sei governar; não sei liderar
  rationale: O contexto sugere o exercício das funções públicas e régias, mas o hebraico conserva uma imagem mais ampla; traduzi-la literalmente evita resolver no texto o que pode ser explicado em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa coerentes. A pontuação explicita a transição da nomeação régia para a confissão de inexperiência, e as notas estão posicionadas junto às expressões que explicam.
