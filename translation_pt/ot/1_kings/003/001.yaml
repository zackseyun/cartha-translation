source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: pt
  text: Salomão fez uma aliança matrimonial com o faraó, rei do Egito[a], tomou a filha do faraó e a levou para a Cidade de Davi, até que ele terminasse de construir sua própria casa, a casa de Yahweh[b] e a muralha ao redor de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se parente do faraó por casamento”. O verbo hebraico destaca a entrada numa relação de parentesco matrimonial, aqui provavelmente com implicações de aliança política.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o templo de Yahweh”. Em hebraico, literalmente, “a casa de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: fez uma aliança matrimonial com
  rationale: O hitpael de חתן indica entrar numa relação de parentesco por casamento; no contexto régio, a formulação também comunica naturalmente a dimensão política sem reduzir o verbo a um casamento direto com o faraó.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: com o faraó, rei do Egito
  rationale: A aposição identifica o faraó como rei do Egito; as vírgulas são naturais em português.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: Tomou a filha do faraó
  rationale: לקח com uma mulher como objeto pode ser expressão idiomática de casamento. A tradução mantém a imagem hebraica, enquanto a frase anterior deixa explícito o contexto matrimonial.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: e a levou para a Cidade de Davi
  rationale: A construção expressa condução até o destino. 'Levou para' é corrente e natural em português; a inicial maiúscula trata 'Cidade de Davi' como designação estabelecida do lugar.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: até que terminasse de construir
  rationale: עַד introduz o limite temporal da permanência dela na Cidade de Davi. O subjuntivo após 'até que' é idiomático em português e preserva a referência a Salomão como sujeito.
- source_word: אֶת בֵּיתוֹ
  choice: seu próprio palácio
  rationale: בית significa literalmente 'casa', mas, no contexto das construções reais de Salomão e em contraste com a casa de Yahweh, refere-se naturalmente ao palácio. 'Próprio' ajuda a marcar o contraste.
- source_word: וְאֶת בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão hebraica 'casa de YHWH' sem substituir imediatamente sua metáfora arquitetônica por 'templo'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: e a muralha ao redor de Jerusalém
  rationale: A formulação portuguesa comunica de modo claro a muralha que circundava a cidade e preserva o singular do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita transformar o nome em título.
- issue: Sentido de בֵּית יְהוָה
  choice: casa de Yahweh
  alternative: templo de Yahweh
  rationale: A opção principal conserva a imagem e a forma lexical do hebraico; a alternativa interpretativa mais explícita é registrada em nota.
- issue: Natureza da relação com o faraó
  choice: aliança matrimonial
  alternative: tornou-se parente do faraó por casamento
  rationale: O contexto régio sugere implicações políticas, mas o verbo propriamente destaca o estabelecimento de parentesco matrimonial. A tradução comunica ambas as dimensões sem afirmar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém 'Yahweh' como nome próprio; emprega 'faraó' como título em minúscula e evita linguagem denominacional.
