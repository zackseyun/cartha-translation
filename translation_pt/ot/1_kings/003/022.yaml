base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: pt
  text: 'Mas a outra mulher disse[a]: “Não! Meu filho é o que está vivo, e o seu filho é o que está morto.” E esta dizia: “Não! Seu filho é o que está morto, e meu filho é o que está vivo.” Assim elas falaram diante do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “Meu filho está vivo, e o seu filho está morto [...] Seu filho está morto, e meu filho está vivo.” O texto principal preserva o contraste hebraico entre “o que está vivo” e “o que está morto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: disse
  rationale: É o verbo narrativo comum para introduzir fala; “disse” é natural e fiel neste confronto verbal.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: a outra mulher
  rationale: Identifica a outra das duas mulheres envolvidas na disputa, sem introduzir um sentido conjugal que o contexto não requer.
- source_word: לֹא כִי
  choice: Não!
  rationale: A combinação expressa uma negação enfática e contradiz diretamente a afirmação anterior.
- source_word: בְּנִי הַחַי
  choice: meu filho é o que está vivo
  rationale: Preserva o contraste definido entre os dois filhos — o vivo e o morto — e soa mais natural em português do que “é o vivo”.
- source_word: וּבְנֵךְ הַמֵּת
  choice: e o seu filho é o que está morto
  rationale: Mantém a estrutura paralela e contrastiva do hebraico, com clareza em português moderno.
- source_word: וְזֹאת אֹמֶרֶת
  choice: E esta dizia
  rationale: “Esta” conserva a força dêitica de זֹאת, enquanto o imperfeito “dizia” apresenta a réplica no embate verbal e harmoniza com o resumo final.
- source_word: וַתְּדַבֵּרְנָה
  choice: Assim elas falavam
  rationale: O plural feminino resume a discussão das duas mulheres; “falavam” comunica naturalmente a troca contínua de acusações diante do rei.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: Tradução literal e idiomática; não acrescenta o nome de Salomão, ausente desta expressão hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo enfático do hebraico foi preservado sem tornar a formulação artificial; “seu” segue o uso brasileiro corrente, e o contexto elimina ambiguidade quanto ao referente.
