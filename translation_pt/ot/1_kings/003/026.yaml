  text: וַ/תֹּ֣אמֶר הָ/אִשָּׁה֩ אֲשֶׁר בְּנָ֨/הּ הַ/חַ֜י אֶל הַ/מֶּ֗לֶךְ כִּֽי נִכְמְר֣וּ רַחֲמֶי/הָ֮ עַל בְּנָ/הּ֒ וַ/תֹּ֣אמֶר בִּ֣י אֲדֹנִ֗/י תְּנוּ לָ/הּ֙ אֶת הַ/יָּל֣וּד הַ/חַ֔י וְ/הָמֵ֖ת אַל תְּמִיתֻ֑/הוּ וְ/זֹ֣את אֹמֶ֗רֶת גַּם לִ֥/י גַם לָ֛/ךְ לֹ֥א יִהְיֶ֖ה גְּזֹֽרוּ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: pt
  text: 'Então a mulher cujo filho estava vivo disse ao rei, pois se comoveu profundamente por seu filho[a]: “Por favor, meu senhor, deem a ela o menino vivo; de modo nenhum o matem!”[b] Mas a outra disse: “Ele não será nem meu nem seu. Cortem-no ao meio!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suas compaixões se aqueceram por seu filho”; expressão hebraica de intensa compaixão materna.
    reason: cultural_note
  - marker: b
    text: 'O hebraico emprega uma construção enfática: “de modo nenhum o matem”.'
    reason: lexical_note
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: se comoveu profundamente
  rationale: Expressa em português natural a intensa compaixão materna do idioma hebraico, sem reproduzir literalmente a imagem visceral.
- source_word: בִּי אֲדֹנִי
  choice: Por favor, meu senhor
  rationale: בִּי funciona aqui como interjeição de súplica; a formulação preserva tanto a urgência quanto a deferência.
- source_word: הַיָּלוּד הַחַי
  choice: o menino vivo
  rationale: יַלוּד designa a criança nascida; “menino” mantém o referente masculino e o contraste com a criança morta sem soar técnico.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: de modo nenhum o matem
  rationale: A construção com infinitivo absoluto intensifica a proibição; “de modo nenhum” preserva essa ênfase, e o plural corresponde à forma verbal hebraica.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Mas a outra disse
  rationale: O demonstrativo identifica contrastivamente a segunda mulher; “a outra” torna essa referência clara e natural.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: Ele não será nem meu nem seu
  rationale: O menino é o sujeito implícito; o pronome masculino o explicita sem alterar a disputa de posse expressa no hebraico.
- source_word: גְּזֹרוּ
  choice: Cortem-no ao meio
  rationale: O imperativo plural é abrupto; “ao meio” explicita o sentido já estabelecido pelo contexto imediato.
