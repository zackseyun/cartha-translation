  text: וַ/יִּשְׁמְע֣וּ כָל יִשְׂרָאֵ֗ל אֶת הַ/מִּשְׁפָּט֙ אֲשֶׁ֣ר שָׁפַ֣ט הַ/מֶּ֔לֶךְ וַ/יִּֽרְא֖וּ מִ/פְּנֵ֣י הַ/מֶּ֑לֶךְ כִּ֣י רָא֔וּ כִּֽי חָכְמַ֧ת אֱלֹהִ֛ים בְּ/קִרְבּ֖/וֹ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: pt
  text: Todo o Israel ouviu falar da sentença que o rei havia proferido e temeu o rei[a], pois viu que nele estava a sabedoria de Deus para exercer a justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reverenciou o rei” ou “ficou tomado de assombro diante do rei”. O hebraico pode indicar medo, reverência ou assombro perante uma autoridade reconhecida.
    reason: lexical_alternative
  - marker: b
    text: Ou “para fazer justiça” ou “para proferir julgamentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ouviu falar
  rationale: O verbo significa literalmente “ouvir”; com “sentença” como objeto, “ouviu falar da sentença” expressa em português corrente que a notícia da decisão chegou ao povo.
- source_word: כָל יִשְׂרָאֵל
  choice: Todo o Israel
  rationale: Mantém a expressão coletiva hebraica para a nação; por isso, os verbos aparecem no singular em português.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: a sentença que o rei havia proferido
  rationale: No contexto judicial, מִשְׁפָּט designa a decisão do caso, e “proferir uma sentença” transmite de modo natural a construção hebraica com שׁפט.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: temeu o rei
  rationale: Preserva o sentido básico e forte de ירא, sem eliminar as possíveis nuances de reverência e assombro diante da autoridade reconhecida.
- source_word: חָכְמַת אֱלֹהִים
  choice: a sabedoria de Deus
  rationale: Reproduz diretamente a construção hebraica e mantém a atribuição explícita da sabedoria a Deus.
- source_word: בְּקִרְבּוֹ
  choice: nele estava
  rationale: Expressa naturalmente a ideia de que essa sabedoria residia no rei.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: para exercer a justiça
  rationale: A construção infinitiva indica a capacidade ou finalidade judicial de Salomão; “exercer a justiça” é idiomático e conserva a abrangência da expressão.
theological_decisions:
- issue: Referência de אֱלֹהִים no contexto da sabedoria régia
  choice: Deus
  alternative: divina
  rationale: O texto nomeia Deus explicitamente e atribui a ele a sabedoria do rei; uma forma adjetival tornaria essa referência menos direta.
- issue: Nuance de וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: temeu o rei
  alternative: reverenciou o rei / ficou admirado diante do rei
  rationale: “Temeu” mantém a força lexical e a tensão entre medo, reverência e assombro, enquanto a nota registra as nuances legítimas sem decidir por apenas uma delas.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A expressão coletiva “Todo o Israel” conserva o estilo narrativo hebraico; “sentença” e “exercer a justiça” mantêm o registro judicial sem soar excessivamente técnico.
