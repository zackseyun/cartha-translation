base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: pt
  text: 'Então o rei disse[a]: “Esta diz: ‘Este é o meu filho, o que está vivo, e o seu filho é o que está morto’, e esta diz: ‘Não! Pois o seu filho é o que está morto, e o meu filho é o que está vivo’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Esta mulher diz... e a outra mulher diz...”. O hebraico emprega demonstrativos femininos, literalmente “esta... e esta”, referindo-se às duas mulheres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido usado no hebraico, sem substituí-lo pelo nome próprio.
- source_word: זֹאת ... וְזֹאת
  choice: Esta ... e esta
  rationale: Os demonstrativos femininos apontam para as duas mulheres e preservam a forma dêitica e contrastiva do hebraico.
- source_word: אֹמֶרֶת
  choice: diz
  rationale: O particípio resume vividamente, no presente, a alegação de cada mulher.
- source_word: זֶה בְּנִי הַחַי
  choice: Este é o meu filho, o que está vivo
  rationale: Preserva o demonstrativo e a construção apositiva do hebraico, distinguindo “o que está vivo” de “o que está morto”.
- source_word: בְּנִי / בְּנֵךְ
  choice: meu filho / seu filho
  rationale: בֵּן significa normalmente “filho”, e o contexto identifica a criança como menino; “seu” funciona como tratamento direto feminino em português moderno.
- source_word: הַחַי
  choice: o que está vivo
  rationale: Reproduz o valor substantivado da forma hebraica e mantém o contraste explícito com “o que está morto” em linguagem natural.
- source_word: הַמֵּת
  choice: o que está morto
  rationale: Mantém o valor substantivado e o paralelismo lexical com “o que está vivo”.
- source_word: לֹא כִי
  choice: Não! Pois
  rationale: “Não!” expressa a contradição enfática, enquanto “Pois” conserva a força assertiva ou explicativa de כִּי sem eliminar a tensão da construção.
