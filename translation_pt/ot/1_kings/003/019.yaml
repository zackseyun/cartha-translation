  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: pt
  text: E o filho desta mulher morreu durante a noite[a], porque ela se deitou sobre ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à noite”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que ela se deitou sobre ele”. A partícula hebraica também pode ser entendida em sentido temporal; aqui a oração é traduzida causalmente, pois o contexto indica que o fato de ela ter se deitado sobre ele provocou a morte do menino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: E ... morreu
  rationale: O wayyiqtol de מוּת relata um acontecimento passado; o pretérito perfeito é natural na narrativa portuguesa.
- source_word: בֶּן
  choice: filho
  rationale: O substantivo hebraico especifica um filho do sexo masculino, distinção preservada na tradução.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: o filho desta mulher
  rationale: Reproduz com clareza e naturalidade a relação construta do hebraico.
- source_word: לָיְלָה
  choice: durante a noite
  rationale: O acusativo temporal indica quando ocorreu a morte; esta formulação é natural em português e mantém a ideia de período noturno.
- source_word: אֲשֶׁר
  choice: porque
  rationale: O contexto permite entender a oração como explicação causal da morte, embora a forma hebraica também possa ser vertida de maneira temporal ou relativa.
- source_word: שָׁכְבָה עָלָיו
  choice: ela se deitou sobre ele
  rationale: Mantém o sentido físico de שָׁכַב com עַל e comunica de modo digno e claro que a mulher ficou por cima do menino.
