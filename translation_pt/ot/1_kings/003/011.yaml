  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: pt
  text: 'E Deus lhe disse: “Já que você pediu isso e não pediu para si muitos anos de vida, nem riquezas, nem a vida de seus inimigos, mas pediu discernimento para ouvir causas judiciais,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: muitos anos de vida
  rationale: A expressão literalmente significa “muitos dias”, mas neste contexto designa longevidade; a formulação escolhida comunica isso naturalmente em português.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: a vida de seus inimigos
  rationale: נֶפֶשׁ aqui se refere à vida/pessoa dos inimigos, isto é, à sua morte; “vida” preserva a forma do hebraico sem explicitar além do texto.
- source_word: הָבִין לִשְׁמֹעַ
  choice: discernimento para compreender
  rationale: A construção combina entendimento e escuta perceptiva. “Discernimento para compreender” evita a expressão pouco natural “entendimento para ouvir” e mantém a ideia de percepção judicial.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: No contexto do governo e julgamento de Salomão, o termo abrange justiça e decisão judicial. “Justiça” mantém o foco ético-jurídico sem limitar o sentido a uma sentença específica.
theological_decisions:
- issue: Sentido de מִשְׁפָּט
  choice: a justiça
  alternative: o juízo / as causas judiciais
  rationale: A escolha conserva a amplitude do termo hebraico e não impõe uma leitura doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para ampla compreensão brasileira. A frase permanece aberta ao versículo seguinte, como no texto-fonte.
