base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/024.yaml
  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: pt
  text: 'Então o rei disse: “Tragam-me uma espada.” E levaram a espada à presença do rei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido.
- source_word: קְחוּ לִי
  choice: Tragam-me
  rationale: Embora לקח tenha o sentido básico de “tomar/pegar”, neste contexto o imperativo seguido de לִי pede que se obtenha e leve o objeto ao falante; “Tragam-me” é idiomático e preciso.
- source_word: חָרֶב
  choice: uma espada
  rationale: A primeira ocorrência não tem artigo e introduz o objeto de modo indefinido.
- source_word: וַיָּבִאוּ
  choice: E levaram
  rationale: O verbo בוא no causativo significa fazer vir, trazer ou levar à presença; “levaram ... à presença do rei” evita a combinação menos natural “trouxeram ... à presença” e mantém a progressão narrativa.
- source_word: הַחֶרֶב
  choice: a espada
  rationale: A segunda ocorrência tem artigo e retoma a espada que acabara de ser solicitada.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: à presença do rei
  rationale: Expressa com naturalidade o sentido cortesão de levar algo diante do rei, preservando mais claramente a ideia de presença do que apenas “perante”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo lexical entre “uma espada” e “a espada” foi preservado, assim como a sequência rápida da narrativa.
