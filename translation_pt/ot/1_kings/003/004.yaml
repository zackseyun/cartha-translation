  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: pt
  text: O rei foi a Gibeom para oferecer sacrifícios ali, pois aquele era o grande lugar alto[a]. Salomão ofereceu mil holocaustos sobre aquele altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o principal lugar alto”. O adjetivo hebraico pode indicar grandeza em tamanho ou destaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O verbo הלך, nesta sequência narrativa, indica simplesmente que o rei se dirigiu a Gibeom; “foi” é natural e não acrescenta a ideia de subida.
- source_word: גִּבְעֹנָה
  choice: a Gibeom
  rationale: O hê direcional ligado ao topônimo expressa movimento em direção à cidade.
- source_word: לִזְבֹּחַ
  choice: para oferecer sacrifícios
  rationale: O infinitivo de זבח designa a ação sacrificial em sentido geral; a formulação é clara e idiomática em português.
- source_word: כִּי הִיא הַבָּמָה הַגְּדוֹלָה
  choice: pois aquele era o grande lugar alto
  rationale: “Lugar alto” preserva o termo histórico-religioso בָּמָה. “Grande” mantém a amplitude semântica de גָּדוֹל, que pode indicar grandeza, destaque ou importância.
- source_word: אֶלֶף עֹלוֹת
  choice: mil holocaustos
  rationale: עֹלוֹת são ofertas totalmente queimadas; “holocaustos” é o termo bíblico português consagrado e mantém a especificidade do sacrifício.
- source_word: יַעֲלֶה
  choice: ofereceu
  rationale: O hifil de עלה, com עֹלוֹת, significa oferecer holocaustos. Neste comentário narrativo, o passado simples comunica adequadamente o acontecimento sem impor uma leitura habitual.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: sobre aquele altar
  rationale: A expressão reproduz naturalmente a relação espacial e preserva a ênfase do demonstrativo hebraico.
theological_decisions:
- issue: Tradução de בָּמָה no contexto do culto anterior à construção do templo
  choice: lugar alto
  alternative: santuário
  rationale: “Lugar alto” conserva a terminologia cultual e a tensão canônica ligada ao culto nesses locais, sem neutralizá-la com um termo mais genérico.
- issue: Valor aspectual de יַעֲלֶה
  choice: ofereceu
  alternative: costumava oferecer
  rationale: O contexto permite entender o imperfeito hebraico como parte da narração de um acontecimento passado. O passado simples evita introduzir uma habitualidade que o versículo não exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se “lugar alto” como termo bíblico histórico, embora menos comum na fala cotidiana, para preservar a precisão cultual e a tensão do texto.
