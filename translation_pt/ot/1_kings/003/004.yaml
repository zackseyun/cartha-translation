  source_fidelity: 'O texto traduz com precisão os elementos centrais do hebraico: o deslocamento do rei a Gibeom, o propósito sacrificial, a designação cultual de Gibeom como o grande lugar alto, as mil ofertas totalmente queimadas e o altar determinado. «Holocaustos» corresponde adequadamente a עֹלוֹת no uso bíblico português. O perfeito português «ofereceu» é uma leitura contextual defensável de יַעֲלֶה e não introduz indevidamente um valor habitual.'
