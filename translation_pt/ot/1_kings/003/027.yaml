  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: pt
  text: 'Então o rei respondeu: “Deem a ela o menino vivo e de modo algum o matem. Ela é a mãe dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: Então o rei respondeu
  rationale: A fórmula narrativa hebraica combina ‘respondeu’ e ‘disse’. Em português atual, ‘respondeu’ comunica naturalmente o sentido sem a redundância pouco idiomática de ‘respondeu e disse’.
- source_word: תְּנוּ לָהּ
  choice: Deem a ela
  rationale: O imperativo está no plural e o pronome marca a destinatária. A formulação é clara e amplamente compreensível em português.
- source_word: הַיָּלוּד הַחַי
  choice: o menino vivo
  rationale: יַלוּד designa aqui a criança recém-nascida, e הַחַי a distingue da que morreu. ‘Menino vivo’ é natural no contexto e mantém a referência masculina indicada depois pelo sufixo hebraico.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: e de modo algum o matem
  rationale: A combinação do infinitivo absoluto com a forma causativa intensifica a proibição. ‘De modo algum’ preserva essa ênfase sem tornar a frase artificial.
- source_word: הִיא אִמּוֹ
  choice: Ela é a mãe dele
  rationale: Mantém diretamente a identificação enfática da verdadeira mãe e representa o sufixo masculino singular.
