  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A fala régia conserva força imperativa sem arcaísmo. Não foi necessária nota de rodapé, pois a ênfase hebraica está expressa no próprio texto por ‘de modo algum’.
