base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: pt
  text: E se você andar nos meus caminhos, guardando os meus estatutos e os meus mandamentos, como Davi, seu pai, andou, prolongarei os seus dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, prolongarei a sua vida.
    reason: Esclarece o sentido idiomático de “prolongarei os seus dias” sem substituir a imagem hebraica no texto principal.
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a continuação do discurso marcada por וְ quanto a condição introduzida por אִם.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: você andar nos meus caminhos
  rationale: Mantém a metáfora pactual de conduzir a vida segundo os caminhos de Deus, em formulação natural e reconhecível em português.
- source_word: לִשְׁמֹר
  choice: guardando
  rationale: O gerúndio expressa naturalmente o modo ou conteúdo de andar nos caminhos de Deus.
- source_word: חֻקַּי
  choice: os meus estatutos
  rationale: Conserva o termo jurídico-pactual e o distingue de מִצְוֺתַי.
- source_word: וּמִצְוֺתַי
  choice: e os meus mandamentos
  rationale: É a equivalência corrente e digna para os mandamentos divinos, preservando a distinção lexical em relação a 'estatutos'.
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: como andou
  rationale: Preserva a comparação e repete o verbo 'andar', refletindo o eco verbal do hebraico.
- source_word: דָּוִיד אָבִיךָ
  choice: Davi, seu pai
  rationale: Segue de perto a ordem hebraica e usa aposição clara e natural em português.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: prolongarei os seus dias
  rationale: Expressa diretamente o Hifil de ארך e conserva o idioma hebraico 'seus dias', cujo sentido é prolongar a vida.
theological_decisions:
- issue: Promessa condicional de vida longa vinculada à obediência pactual
  choice: Manter explicitamente a condição e a promessa concreta de prolongamento dos dias de Salomão.
  alternative: Transformar a declaração em promessa incondicional, promessa dinástica ou bênção geral.
  rationale: A construção אִם... וְהַאַרַכְתִּי apresenta uma condição real seguida da promessa de vida prolongada; a tradução não deve suavizar nem reinterpretar essa relação.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O tratamento por “você/seu” torna a fala direta clara e corrente; “estatutos”, “mandamentos” e a metáfora de andar nos caminhos preservam o registro pactual e bíblico sem arcaísmo excessivo.
