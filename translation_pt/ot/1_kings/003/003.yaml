  terminology: «Yahweh», «estatutos», «lugares altos», «oferecia sacrifícios» e «queimava incenso» são escolhas adequadas. A nota de «lugares altos» é útil. A alternativa para קטר fica mais idiomática como «fazia ofertas subir em fumaça».
