  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: pt
  text: Salomão amava Yahweh, seguindo os estatutos de seu pai Davi; contudo, oferecia sacrifícios e queimava incenso[c] nos lugares altos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Os «lugares altos» eram locais elevados ou santuários locais usados para o culto.
    reason: Explica a referência cultural de בָּמוֹת.
  - marker: c
    text: 'Ou: «fazia ofertas subir em fumaça».'
    reason: Preserva a amplitude de sentido de קטר no contexto do culto.
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: amava
  rationale: O verbo אהב expressa amor ou afeição. O imperfeito narrativo, junto ao contexto descritivo, permite o português natural «amava», que mantém a avaliação positiva do narrador.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָלֶכֶת
  choice: andava
  rationale: O infinitivo descreve a maneira pela qual o amor de Salomão se manifestava. «Andava» conserva a metáfora hebraica de conduta habitual e soa natural em português bíblico moderno.
- source_word: בְּחֻקּוֹת
  choice: segundo os estatutos
  rationale: חֻקּוֹת designa prescrições ou decretos. «Segundo os estatutos» comunica tanto o sentido normativo quanto a ideia idiomática de viver em conformidade com eles.
- source_word: דָּוִד אָבִיו
  choice: de Davi, seu pai
  rationale: Preserva a relação sintática e identifica Davi de maneira clara e natural em português.
- source_word: רַק
  choice: só que
  rationale: Introduz uma ressalva à avaliação positiva anterior. «Só que» expressa limitação e contraste sem transformar o versículo numa condenação absoluta.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: בָּמוֹת refere-se a locais de culto situados em elevações ou santuários locais; «lugares altos» é a forma tradicional, concisa e explicada em nota.
- source_word: מְזַבֵּחַ
  choice: oferecia sacrifícios
  rationale: O particípio indica prática habitual ou contínua. A locução verbal é mais clara em português do que o possível, porém menos corrente, «sacrificava».
- source_word: וּמַקְטִיר
  choice: e queimava incenso
  rationale: O particípio Hifil de קטר pode indicar queimar incenso ou fazer uma oferta subir em fumaça. A tradução principal adota o sentido cultual comum, enquanto a nota preserva a amplitude lexical.
theological_decisions:
- issue: Avaliação narrativa da prática de culto de Salomão
  choice: O versículo afirma genuinamente que Salomão amava Yahweh, mas qualifica esse elogio ao mencionar seu culto nos lugares altos.
  alternative: Ler o elogio como irônico ou, no extremo oposto, entender que a prática nos lugares altos recebe aprovação irrestrita.
  rationale: A primeira oração é positiva, enquanto רַק introduz uma limitação. A tradução conserva essa tensão, sem converter o texto em aprovação plena nem em condenação total.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Andava segundo» mantém a metáfora hebraica sem soar excessivamente arcaica; «só que» comunica de modo natural a ressalva narrativa.
