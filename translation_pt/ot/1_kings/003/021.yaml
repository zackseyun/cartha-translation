base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: pt
  text: Quando me levantei de manhã para amamentar meu filho, eis que ele estava morto. Mas, quando o examinei atentamente pela manhã, eis que não era o meu filho que eu tinha dado à luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם
  choice: Quando me levantei
  rationale: O wayyiqtol de קום relata a ação da mulher; “quando” expressa naturalmente a relação temporal com o infinitivo seguinte.
- source_word: בַּבֹּקֶר
  choice: de manhã / pela manhã
  rationale: A expressão temporal aparece duas vezes no hebraico e foi mantida nas duas ocorrências, com leve variação idiomática em português.
- source_word: לְהֵינִיק
  choice: para amamentar
  rationale: O infinitivo hifil de ינק, neste contexto, significa dar de mamar a uma criança; “amamentar” é claro e corrente.
- source_word: אֶת־בְּנִי
  choice: meu filho
  rationale: בֵּן com sufixo de primeira pessoa do singular designa especificamente “meu filho”.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: A partícula assinala uma descoberta súbita e intensifica o relato. A repetição do original foi preservada.
- source_word: מֵת
  choice: ele estava morto
  rationale: O termo descreve o estado em que a mulher encontrou a criança; a formulação é direta e natural em português.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: quando o examinei atentamente
  rationale: A forma verbal de בין/בון comunica observação cuidadosa ou inspeção atenta, seguida do reconhecimento da identidade da criança.
- source_word: לֹא הָיָה בְנִי
  choice: não era o meu filho
  rationale: Reproduz de modo idiomático a afirmação hebraica de que a criança observada não era o filho da mulher.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: que eu tinha dado à luz
  rationale: ילד na primeira pessoa refere-se ao ato de dar à luz; o mais-que-perfeito deixa clara a anterioridade em relação ao reconhecimento.
