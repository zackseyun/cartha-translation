base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: pt
  text: E o teu servo está no meio do teu povo que escolheste, um povo tão numeroso que não se pode contar nem enumerar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: E o teu servo
  rationale: עֶבֶד pode significar servo ou escravo; na oração deferente de Salomão a Deus, “servo” é natural e preserva sua posição subordinada.
- source_word: בְּתוֹךְ עַמְּךָ
  choice: está no meio do teu povo
  rationale: בְּתוֹךְ indica que Salomão se encontra entre o povo; “no meio de” conserva a imagem espacial e soa natural em português.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: que escolheste
  rationale: Traduz diretamente a oração relativa e mantém explícita a escolha do povo por Deus.
- source_word: עַם רָב
  choice: um povo tão numeroso
  rationale: Neste contexto, רַב se refere à grande quantidade de pessoas, como confirma a impossibilidade de contá-las; “tão” liga naturalmente a expressão à oração seguinte.
- source_word: אֲשֶׁר לֹא יִמָּנֶה וְלֹא יִסָּפֵר מֵרֹב
  choice: que não pode ser contado nem enumerado
  rationale: Os dois verbos hebraicos formam um paralelismo sobre contagem, e מֵרֹב indica que a impossibilidade decorre da multidão; “tão numeroso que” expressa essa relação causal em português corrente.
theological_decisions:
- issue: Israel como povo escolhido de Deus
  choice: teu povo, que escolheste
  alternative: teu povo escolhido
  rationale: A redação conserva tanto a pertença do povo a Deus quanto o ato verbal explícito de sua escolha, sem acrescentar desenvolvimentos teológicos posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” coerente com a oração dirigida diretamente a Deus. A formulação preserva o paralelismo hebraico sem recorrer a uma expressão excessivamente literal ou artificial.
