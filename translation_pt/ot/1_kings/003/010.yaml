  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אֲדֹנָ֑/י כִּ֚י שָׁאַ֣ל שְׁלֹמֹ֔ה אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: pt
  text: E isso foi bom aos olhos do Senhor[a], porque Salomão havia pedido isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso agradou ao Senhor”.'
    reason: Alternativa idiomática para וַיִּיטַב ... בְּעֵינֵי, que pode ser expressa em português como uma declaração de agrado.
lexical_decisions:
- source_word: וַיִּיטַב
  choice: foi bom
  rationale: Preserva o valor avaliativo de יטב e a formulação concreta do hebraico, sem transformá-la diretamente em uma declaração sobre o sentimento do Senhor.
- source_word: הַדָּבָר
  choice: isso
  rationale: No contexto, refere-se ao pedido de Salomão. Em português, o pronome retoma naturalmente o conteúdo anterior e evita o pouco idiomático «o assunto foi bom».
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém a metáfora avaliativa hebraica, que também é clara e corrente em português.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz diretamente אֲדֹנָי; não se emprega a convenção «SENHOR», reservada ao tetragrama יהוה.
- source_word: כִּי
  choice: porque
  rationale: Expressa naturalmente o sentido causal da conjunção neste contexto.
- source_word: שָׁאַל
  choice: havia pedido
  rationale: «Pedir» comunica o sentido contextual de solicitar, e o mais-que-perfeito composto esclarece que o pedido precedeu a avaliação narrada.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: isso
  rationale: Representa de modo natural «esta coisa/este assunto» em português, sem acrescentar uma preposição ausente nem tornar a frase pesada.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: SENHOR
  rationale: O texto massorético traz אֲדֹנָי, não יהוה. A distinção lexical é preservada mediante «Senhor», sem as versaletes convencionalmente usadas para o tetragrama.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preservação da metáfora hebraica «aos olhos». O primeiro הַדָּבָר é vertido por «isso» para manter naturalidade, enquanto a nota registra a alternativa mais idiomática.
