id: 1KI.3.2
reference: 1 Kings 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: pt
  text: O povo, porém, oferecia sacrifícios nos lugares altos, pois, até aquela época, ainda não havia sido construída uma casa[a] para o nome de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo”. O termo hebraico é “casa”; aqui se refere ao templo que seria construído em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: porém
  rationale: A partícula introduz uma ressalva à avaliação anterior. Em português, “porém” expressa naturalmente esse valor concessivo sem sugerir que somente o povo, e não Salomão, sacrificava nesses lugares.
- source_word: הָעָם
  choice: o povo
  rationale: Designa de modo amplo a população, sem impor um contraste técnico entre o povo comum e seus líderes.
- source_word: מְזַבְּחִים
  choice: oferecia sacrifícios
  rationale: O particípio indica uma prática contínua ou habitual; o pretérito imperfeito reproduz bem esse aspecto em português.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: Refere-se a locais de culto, muitas vezes elevados, onde se ofereciam sacrifícios. “Lugares altos” conserva a designação cultual tradicional sem substituí-la interpretativamente por “santuários locais”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual os sacrifícios eram oferecidos nos lugares altos.
- source_word: לֹא נִבְנָה בַיִת
  choice: ainda não havia sido construída uma casa
  rationale: Mantém o substantivo concreto “casa” e expressa que sua construção ainda não ocorrera até aquele período.
- source_word: לְשֵׁם יְהוָה
  choice: para o nome de Yahweh
  rationale: Preserva a formulação teológica característica de Reis, segundo a qual a casa seria construída para o nome divino, sem reduzi-la simplesmente a “para Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַד הַיָּמִים הָהֵם
  choice: até aquela época
  rationale: Reproduz o limite temporal da expressão hebraica em português natural; “época” comunica idiomaticamente o sentido contextual de “aqueles dias”.
theological_decisions:
- issue: Sentido cultual de בַיִת
  choice: casa no texto principal, com esclarecimento em nota
  alternative: templo
  rationale: O hebraico diz literalmente “casa”; o contexto identifica essa casa como o futuro templo. A tradução mantém a imagem original sem deixar o leitor sem esclarecimento.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome próprio divino. “Yahweh” preserva essa distinção em relação ao título “Senhor”.
- issue: Valor de רַק
  choice: porém
  alternative: somente
  rationale: A leitura concessiva liga o versículo à avaliação anterior e evita uma exclusão absoluta potencialmente enganosa, já que o contexto imediato também apresenta Salomão sacrificando num lugar alto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito imperfeito comunica prática habitual; a ordem da frase mantém a ressalva inicial e a explicação causal do hebraico.
