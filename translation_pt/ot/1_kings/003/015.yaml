base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: pt
  text: Então Salomão acordou e percebeu que era um sonho. Ele foi a Jerusalém, apresentou-se diante da arca da aliança do SENHOR, ofereceu holocaustos e ofertas de comunhão[a] e deu um banquete para todos os seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de paz”; o termo hebraico pode destacar a comunhão expressa na refeição sacrificial compartilhada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: acordou
  rationale: Equivalente narrativo direto e natural para o despertar do sono.
- source_word: וְהִנֵּה חֲלוֹם
  choice: e percebeu que era um sonho
  rationale: Expressa em português corrente a súbita constatação marcada por הִנֵּה, sem exigir o pouco natural 'e eis um sonho'.
- source_word: וַיָּבֹא יְרוּשָׁלִַם
  choice: foi a Jerusalém
  rationale: Em português, 'foi' é a forma dêitica natural neste relato; evita acrescentar 'voltou', ideia não explicitada pelo verbo.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: apresentou-se diante de
  rationale: Reproduz naturalmente o sentido idiomático de comparecer e permanecer na presença da arca.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: a arca da aliança do SENHOR
  rationale: Preserva com clareza a cadeia construta e segue a convenção bíblica portuguesa para a referência divina.
- source_word: וַיַּעַל עֹלוֹת
  choice: ofereceu holocaustos
  rationale: Holocausto é o termo sacrificial consolidado em português para a oferta totalmente queimada; 'ofereceu' comunica naturalmente o hifil neste contexto.
- source_word: שְׁלָמִים
  choice: ofertas de comunhão
  rationale: Comunica a dimensão de participação e refeição compartilhada ligada a essa categoria sacrificial, mantendo em nota a alternativa tradicional.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: Designa naturalmente uma refeição festiva, inclusive com bebida, adequada ao contexto celebrativo.
- source_word: לְכָל עֲבָדָיו
  choice: para todos os seus servos
  rationale: Mantém o sentido lexical amplo; 'oficiais' seria possível no contexto régio, mas mais restritivo.
theological_decisions:
- issue: Forma portuguesa da referência divina em אֲרוֹן בְּרִית אֲדֹנָי
  choice: SENHOR
  alternative: Senhor
  rationale: A forma em versaletes, aqui representada por maiúsculas, mantém a convenção bíblica de referência ao Deus da aliança sem introduzir uma interpretação denominacional.
- issue: Sentido sacrificial de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz
  rationale: A escolha destaca a participação comunitária associada ao sacrifício, mas a alternativa tradicional é preservada em nota porque o termo hebraico admite essas nuances e não deve ser reduzido a uma só explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sequência narrativa foi suavizada sem eliminar nenhuma ação do hebraico; termos cultuais consolidados foram mantidos ou explicados em nota.
