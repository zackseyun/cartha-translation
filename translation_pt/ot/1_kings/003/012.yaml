id: 1KI.3.12
reference: 1 Kings 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: pt
  text: Eis que fiz conforme as suas palavras. Eis que lhe dei um coração[a] sábio e capaz de discernir, de modo que antes de você não houve ninguém como você, nem depois de você surgirá alguém como você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “coração” inclui a faculdade interior de pensar, julgar e discernir, e não apenas as emoções. Também se pode entender a expressão como “mente sábia e discernidora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a partícula que chama a atenção e preserva o tom solene e declarativo da fala divina, sem omiti-la.
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: fiz conforme as suas palavras
  rationale: Reproduz de perto o sentido de ação divina realizada em resposta ao que Salomão disse; “palavras” conserva o substantivo explícito do hebraico, sem substituí-lo interpretativamente por “pedido”.
- source_word: נָתַתִּי לְךָ
  choice: lhe dei
  rationale: Expressa de modo natural em português a dádiva apresentada como já concedida.
- source_word: לֵב
  choice: coração
  rationale: Preserva a antropologia hebraica, na qual o coração abrange pensamento, juízo, vontade e discernimento, e não apenas emoção.
- source_word: חָכָם וְנָבוֹן
  choice: sábio e capaz de discernir
  rationale: “Sábio” traduz diretamente חָכָם; a formulação “capaz de discernir” comunica com naturalidade a percepção e o bom juízo de נָבוֹן no contexto do governo e da justiça.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: de modo que antes de você não houve ninguém como você
  rationale: Apresenta a cláusula como resultado ou caracterização da dádiva, sem sugerir finalidade, e conserva a comparação pessoal do hebraico.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: nem depois de você surgirá alguém como você
  rationale: “Surgirá” preserva a imagem de יָקוּם no sentido de aparecer na história, enquanto “nem” liga naturalmente as duas afirmações negativas.
theological_decisions:
- issue: Natureza da superioridade prometida a Salomão
  choice: A afirmação de que ninguém seria como Salomão permanece ligada, no contexto imediato, ao coração sábio e capaz de discernir que Deus lhe concedeu.
  alternative: Entender a declaração como superioridade absoluta de Salomão em todos os aspectos.
  rationale: A tradução mantém a sequência e a tensão do texto sem ampliar a promessa para além do tema explícito da sabedoria e do discernimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” foi mantido por seu valor discursivo solene; o tratamento por “você” evita formas regionais e conserva clareza para o público geral.
