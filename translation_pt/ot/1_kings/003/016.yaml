lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marcador temporal que introduz o episódio seguinte e mantém de modo natural a sequência narrativa.
- source_word: תָּבֹאנָה
  choice: vieram
  rationale: O imperfeito qal de בוא, neste contexto narrativo, indica uma ação passada; “vieram” expressa o movimento em direção ao rei.
- source_word: שְׁתַּיִם נָשִׁים
  choice: duas mulheres
  rationale: Tradução direta e idiomática da construção com numeral e substantivo.
- source_word: זֹנוֹת
  choice: que eram prostitutas
  rationale: O particípio descreve as mulheres. A oração relativa é natural em português e preserva explicitamente o referente feminino, sem recorrer ao termo antiquado “meretrizes”.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: אֶל indica movimento em direção ao rei; “vieram ao rei” preserva esse sentido direcional.
- source_word: וַתַּעֲמֹדְנָה לְפָנָיו
  choice: e se apresentaram diante dele
  rationale: Embora עמד signifique literalmente “ficar de pé”, no contexto de uma audiência judicial a expressão comunica comparecimento formal. “Apresentaram-se diante dele” é natural e mantém a postura de comparecer perante o rei.
