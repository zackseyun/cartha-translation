  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: pt
  text: Dá, pois, ao teu servo um coração que escuta[a], para julgar o teu povo e discernir entre o bem e o mal; pois quem seria capaz de julgar este teu povo tão grande[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um coração compreensivo”; literalmente, “um coração que ouve/escuta”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico significa literalmente “pesado” ou “de peso”. Aqui pode expressar a grandeza ou importância do povo e também o peso de governá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Dá, pois
  rationale: A conjunção seguida do perfeito introduz aqui uma petição decorrente do contexto anterior. “Dá, pois” expressa essa consequência em português natural.
- source_word: לְעַבְדְּךָ
  choice: ao teu servo
  rationale: Na oração de Salomão, é uma autodesignação humilde diante de Deus; “servo” preserva adequadamente o uso régio e devocional.
- source_word: לֵב שֹׁמֵעַ
  choice: um coração que escuta
  rationale: Preserva a imagem hebraica de um coração receptivo, atento e responsivo, sem reduzi-la apenas à capacidade intelectual.
- source_word: לִשְׁפֹּט
  choice: para julgar
  rationale: Mantém o núcleo lexical de שפט e permite que suas dimensões judicial e governamental permaneçam presentes.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Tradução direta que conserva tanto a relação de pertencimento a Deus quanto o contexto político.
- source_word: לְהָבִין
  choice: discernir
  rationale: O hiphil de בין indica compreensão discriminadora; “discernir” se ajusta especialmente ao contexto judicial.
- source_word: בֵּין טוֹב לְרָע
  choice: entre o bem e o mal
  rationale: Conserva a formulação moral e avaliativa do hebraico, sem estreitá-la para “certo e errado”.
- source_word: כִּי מִי יוּכַל
  choice: pois quem seria capaz
  rationale: Introduz a razão da petição e comunica naturalmente a insuficiência humana diante da tarefa.
- source_word: הַכָּבֵד
  choice: tão importante
  rationale: O adjetivo significa literalmente “pesado” e, por extensão, “de peso, importante, grande”. “Tão importante” preserva a ideia de peso e relevância sem soar artificial em português; a amplitude é registrada em nota.
theological_decisions:
- issue: Idioma antropológico no pedido de Salomão
  choice: um coração que escuta
  alternative: um coração compreensivo
  rationale: No hebraico bíblico, o coração é o centro da cognição, da vontade e da resposta. Manter “coração” e a imagem da escuta preserva essa antropologia e a receptividade implicada, enquanto a alternativa explicita legitimamente o sentido idiomático.
- issue: Sentido de הַכָּבֵד aplicado ao povo
  choice: tão importante
  alternative: tão grande; tão numeroso; tão difícil de governar
  rationale: O termo admite as ideias de peso, importância, magnitude e carga. A tradução evita definir exclusivamente se a ênfase recai no tamanho do povo, em sua importância ou no peso de governá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com “teu”. A redação conserva a imagem hebraica do coração que escuta e mantém aberta a polissemia de הַכָּבֵד por meio de nota.
