base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: pt
  text: Ela se levantou no meio da noite, tomou meu filho de junto de mim enquanto esta sua serva dormia, deitou-o no colo dela[a] e deitou o filho morto dela no meu colo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no seio dela ... no meu seio”. O hebraico חֵיק pode se referir à região do colo ou do peito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: no meio da noite
  rationale: Expressa naturalmente a ideia de estar no interior ou no ponto médio da noite, e não apenas em algum momento noturno.
- source_word: מֵאֶצְלִי
  choice: de junto de mim
  rationale: Preserva a noção espacial de proximidade ao lado da mulher enquanto ela dormia.
- source_word: וַאֲמָתְךָ
  choice: esta sua serva
  rationale: Mantém a forma feminina e respeitosa de autorreferência diante do rei; o demonstrativo torna claro em português que a mulher fala de si mesma.
- source_word: יְשֵׁנָה
  choice: dormia
  rationale: Representa o estado ou ação contínua que servia de pano de fundo para a troca das crianças.
- source_word: וַתַּשְׁכִּיבֵהוּ
  choice: deitou-o
  rationale: O hifil de שׁכב significa fazer alguém deitar; a formulação é concisa e adequada ao contexto do leito.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: junto ao peito dela / junto ao meu peito
  rationale: חֵיק pode indicar o peito ou o colo. “Junto ao peito” conserva a proximidade corporal e o ambiente materno sem recorrer ao pouco corrente “seio” neste uso.
- source_word: הַמֵּת
  choice: morto
  rationale: O particípio funciona como qualificativo de “filho”, formando naturalmente “o filho morto dela”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e narrativamente claro, com boa legibilidade brasileira. A expressão cortês “esta sua serva” preserva a situação de audiência diante do rei; “junto ao peito” mantém a intimidade corporal do original, enquanto a nota registra a alternativa lexical genuína.
