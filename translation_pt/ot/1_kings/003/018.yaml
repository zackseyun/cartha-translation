base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: pt
  text: No terceiro dia depois de eu dar à luz, esta mulher também deu à luz. Estávamos juntas; não havia ninguém de fora conosco na casa[a]; somente nós duas estávamos na casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia nenhum estranho conosco na casa”. A palavra hebraica pode indicar alguém que não pertencia ao grupo ou à casa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: No terceiro dia depois de eu dar à luz
  rationale: A construção introduz a etapa seguinte da narrativa e situa o nascimento no terceiro dia contado a partir do parto da mulher que fala. A formulação portuguesa é natural e mantém a relação temporal explícita.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: esta mulher também deu à luz
  rationale: “Esta mulher” preserva a referência dêitica e incisiva do discurso diante do rei; “também” representa גַּם.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: Estávamos juntas
  rationale: יַחְדָּו significa “juntas”. A ausência de outras pessoas é declarada na oração seguinte, sem necessidade de antecipar “sozinhas”.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: não havia nenhuma pessoa de fora conosco na casa[a]
  rationale: זָר designa alguém alheio ao grupo ou à casa. “Pessoa de fora” comunica esse sentido com mais precisão contextual do que “estranho”, que em português pode sugerir apenas uma pessoa desconhecida ou incomum.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: somente nós duas estávamos na casa
  rationale: A expressão ressalta a exclusividade das duas mulheres como presentes. A repetição de “na casa” foi mantida por corresponder à ênfase do hebraico.
