  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: pt
  text: 'Então o rei disse: “Cortem o menino vivo em dois e deem metade a uma e metade à outra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “a uma... e a uma”, com formas femininas que se referem às duas mulheres da narrativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido.
- source_word: גִּזְרוּ
  choice: Cortem
  rationale: O imperativo plural de גזר ordena aqui um corte físico; “Cortem” conserva a força direta e concreta da ordem.
- source_word: הַיֶּלֶד הַחַי
  choice: o menino vivo
  rationale: O adjetivo distingue esse menino daquele que morreu no contexto; a formulação é concisa e natural.
- source_word: לִשְׁנָיִם
  choice: em dois
  rationale: Indica divisão em duas partes. A expressão preserva de perto a forma hebraica e é idiomática com “cortar”.
- source_word: וּתְנוּ
  choice: e deem
  rationale: Mantém o segundo imperativo plural coordenado ao primeiro e a sequência da ordem.
- source_word: הַחֲצִי
  choice: metade
  rationale: Em português, o artigo pode ser omitido naturalmente nesta construção distributiva sem alterar o sentido.
- source_word: לְאַחַת ... לְאֶחָת
  choice: a uma ... à outra
  rationale: As formas femininas remetem às duas mulheres já presentes na narrativa. “A uma ... à outra” comunica com clareza a distribuição sem precisar acrescentar “mulher” ao texto.
