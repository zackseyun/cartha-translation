source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: pt
  text: 'E Salomão disse: “Tu demonstraste grande amor leal[a] ao teu servo Davi, meu pai, pois ele andou diante de ti com fidelidade[b], justiça e retidão de coração para contigo. Tu lhe preservaste esse grande amor leal e lhe deste um filho que se assenta no trono dele, como se vê neste dia[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor constante”, “fidelidade à aliança” ou “bondade leal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com verdade” ou “com integridade”.
    reason: lexical_alternative
  - marker: c
    text: Expressão hebraica que indica que a situação presente confirma visivelmente o que foi dito.
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa a lealdade firme de Deus em seu relacionamento com Davi e preserva também a dimensão afetiva do termo; a nota registra alternativas que explicitam seu possível teor pactual.
- source_word: עָשִׂיתָ עִם
  choice: demonstraste ... a
  rationale: Equivalente português natural para a expressão hebraica de praticar ou manifestar חֶסֶד para com alguém.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: No contexto da oração régia, indica a posição de Davi diante de Deus, sem exigir a conotação de escravidão como propriedade.
- source_word: כַּאֲשֶׁר
  choice: pois
  rationale: Apresenta com naturalidade a relação explicativa ou causal entre a conduta de Davi e o amor leal mencionado.
- source_word: הָלַךְ לְפָנֶיךָ
  choice: andou diante de ti
  rationale: Conserva a metáfora hebraica tradicional para a maneira de viver na presença de Deus.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: Neste contexto de conduta relacional, אֱמֶת pode designar fidelidade, embora 'verdade' e 'integridade' permaneçam possibilidades legítimas.
- source_word: בִּצְדָקָה
  choice: justiça
  rationale: Designa a retidão moral da conduta de Davi diante de Deus.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: retidão de coração
  rationale: Mantém a imagem hebraica de inteireza e correção interior em expressão portuguesa clara.
- source_word: עִמָּךְ
  choice: para contigo
  rationale: Preserva o valor relacional da preposição 'com', distinguindo-a do anterior 'diante de ti'.
- source_word: וַתִּשְׁמָר לוֹ
  choice: lhe preservaste
  rationale: Comunica que Deus manteve em vigor, em favor de Davi, o amor leal já mencionado.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: um filho que se assenta no trono dele
  rationale: O particípio retrata o filho atualmente entronizado; a formulação mantém a imagem concreta e evita que 'seu' tenha referente ambíguo.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê neste dia
  rationale: Torna natural em português o idioma hebraico que aponta para a situação presente como confirmação visível.
theological_decisions:
- issue: Sentido de חֶסֶד no contexto régio e pactual
  choice: amor leal
  alternative: fidelidade à aliança; amor constante
  rationale: A expressão abrange lealdade relacional, compromisso firme e benevolência. 'Amor leal' preserva essa amplitude sem transformar em explícita uma referência à aliança que está contextual, mas não lexicalmente formulada no termo isolado.
- issue: Relação entre a conduta de Davi e a ação divina
  choice: pois
  alternative: assim como; conforme
  rationale: A conjunção admite nuance causal ou correspondente. 'Pois' apresenta a leitura contextual mais natural, sem formular uma doutrina de mérito; a frase apenas relaciona a conduta de Davi ao trato leal de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. Mantém a metáfora bíblica 'andou diante de ti', mas verte o idioma final de modo natural. Os marcadores seguem a ordem de ocorrência no texto.
