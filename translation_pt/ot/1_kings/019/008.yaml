base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: pt
  text: Então ele se levantou, comeu e bebeu e foi, com a força daquele alimento,[a] durante quarenta dias e quarenta noites, até Horebe, o monte de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fortalecido por aquele alimento”. A expressão hebraica refere-se à força ou ao vigor que ele recebeu do que havia comido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Então ele se levantou
  rationale: O qal narrativo de קום indica a ação seguinte na sequência. “Levantou-se” é natural em português, e “então” comunica o avanço narrativo do waw consecutivo.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: comeu e bebeu
  rationale: Tradução direta e corrente dos verbos אכל e שׁתה na sequência narrativa.
- source_word: וַיֵּלֶךְ
  choice: caminhou
  rationale: הלך significa basicamente “ir/andar”. Diante da duração de quarenta dias e quarenta noites, “caminhou” expressa naturalmente o deslocamento prolongado sem acrescentar uma ideia alheia ao texto.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: fortalecido por aquele alimento
  rationale: A expressão indica que o alimento ingerido lhe deu forças. Esta formulação idiomática preserva tanto כֹחַ, “força”, quanto a referência de אֲכִילָה ao que foi comido.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: quarenta dias e quarenta noites
  rationale: Equivalente direto e tradicional da expressão hebraica de duração.
- source_word: עַד
  choice: até
  rationale: Aqui עַד marca o ponto final do deslocamento; “até” é a equivalência portuguesa mais natural.
- source_word: הַר הָאֱלֹהִים
  choice: o monte de Deus
  rationale: Mantém a estrutura e a solenidade da expressão hebraica, sem interpretar além do que está explícito.
- source_word: חֹרֵב
  choice: Horebe
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים em הַר הָאֱלֹהִים
  choice: Deus
  alternative: divino
  rationale: Na designação estabelecida de Horebe, o termo refere-se naturalmente a Deus. “O monte de Deus” preserva a referência pessoal e a associação bíblica sem impor elaboração doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “fortalecido por aquele alimento” evita o literalismo pouco natural de “na força daquela comida”, enquanto a nota registra mais de perto a forma hebraica.
