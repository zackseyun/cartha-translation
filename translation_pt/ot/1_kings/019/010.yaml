source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: pt
  text: 'Ele respondeu: “Tenho sido muito zeloso por Yahweh, o Deus dos Exércitos, pois os israelitas abandonaram a tua aliança, derrubaram os teus altares e mataram os teus profetas à espada. Só eu fiquei, e procuram tirar a minha vida.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Tenho sido muito zeloso
  rationale: A construção hebraica com infinitivo absoluto intensifica o verbo. A formulação comunica ênfase de modo natural e preserva o sentido de zelo, sem sugerir inveja.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: A preposição expressa o objeto do zelo de Elias, e o nome divino é transliterado para preservar o nome pactual presente no hebraico.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: צְבָאוֹת designa hostes ou exércitos. A escolha é clara em português e não substitui o título por outro, como 'Todo-Poderoso'.
- source_word: כִּי
  choice: pois
  rationale: Introduz a justificativa apresentada por Elias e mantém uma ligação natural com a declaração anterior.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: abandonaram a tua aliança
  rationale: עָזַב significa abandonar ou deixar. 'Abandonaram' é atual, claro e mantém a gravidade da ruptura da aliança.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a expressão seja literalmente 'filhos de Israel', aqui ela identifica coletivamente o povo de Israel; 'os israelitas' transmite isso com naturalidade e precisão.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: derrubaram os teus altares
  rationale: הָרַס indica demolir ou derrubar; a escolha é concreta e idiomática para altares.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: mataram os teus profetas à espada
  rationale: Preserva tanto a morte violenta quanto o instrumento expresso no hebraico, em formulação portuguesa consagrada e compreensível.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Só eu fiquei
  rationale: Comunica de maneira direta a ênfase na alegada sobrevivência solitária de Elias.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: e agora procuram tirar a minha vida
  rationale: נֶפֶשׁ refere-se aqui à vida, não a uma 'alma' em sentido técnico. A expressão completa significa que procuram matá-lo; 'agora' torna natural a progressão, refletindo o valor contextual da sequência narrativa sem alterar o conteúdo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva sua condição de nome próprio e evita substituir o nome por um título.
- issue: Natureza do zelo de Elias
  choice: muito zeloso por Yahweh
  alternative: extremamente ciumento por Yahweh
  rationale: O hebraico pode associar zelo e ciúme ardente, mas, neste contexto, Elias descreve sua devoção pactual e sua defesa da honra de Deus. 'Zeloso' preserva o sentido sem introduzir a ideia comum de inveja; não se avalia aqui se a percepção de Elias sobre si mesmo era plenamente correta.
- issue: Afirmação de Elias de que ficou sozinho
  choice: Só eu fiquei
  alternative: Eu, somente eu, fui deixado
  rationale: A tradução mantém a afirmação enfática do próprio Elias sem endossá-la como avaliação objetiva; a resposta posterior de Deus preservará a tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'tu' nos possessivos dirigidos a Deus porque a fala direta distingue claramente a segunda pessoa; evita arcaísmos como 'desampararam' e construções excessivamente literais. Nenhuma nota foi necessária, portanto não há marcadores no texto.
