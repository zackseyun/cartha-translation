  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּבֵּ֕ט וְ/הִנֵּ֧ה מְרַאֲשֹׁתָ֛י/ו עֻגַ֥ת רְצָפִ֖ים וְ/צַפַּ֣חַת מָ֑יִם וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖שָׁב וַ/יִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: pt
  text: Ele olhou, e eis que junto à sua cabeça havia um pão assado sobre pedras quentes[a] e uma bilha de água. Ele comeu, bebeu e tornou a deitar-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um pão sobre brasas”. O termo hebraico רְצָפִים pode se referir a pedras aquecidas usadas para assar, embora também seja traduzido de modo mais geral como “brasas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: Ele olhou
  rationale: נבט indica olhar ou dirigir o olhar; a tradução preserva a ação sem acrescentar uma direção ausente do hebraico.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: A partícula הִנֵּה chama a atenção para o que Elias vê e dá vivacidade à narrativa; “e eis que” preserva essa função em português digno e corrente.
- source_word: מְרַאֲשֹׁתָיו
  choice: junto à sua cabeça
  rationale: A expressão designa o lugar próximo à cabeça de quem está deitado. Esta formulação é clara e evita transformar o termo em um objeto específico, como “travesseiro”.
- source_word: עֻגַת רְצָפִים
  choice: um pão assado sobre pedras quentes
  rationale: עֻגָה é um pão ou bolo arredondado, e רְצָפִים provavelmente se refere a pedras aquecidas usadas para assar. “Pão” evita em português a ideia moderna de um bolo doce.
- source_word: וְצַפַּחַת מָיִם
  choice: e uma bilha de água
  rationale: צַפַּחַת designa um pequeno recipiente para líquidos; “bilha” comunica de modo natural um vaso portátil para água.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: Ele comeu, bebeu
  rationale: Mantém a sucessão simples e direta dos dois verbos narrativos hebraicos.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: e tornou a deitar-se
  rationale: A combinação de שׁוב com שׁכב indica que ele voltou a se deitar; a formulação portuguesa expressa naturalmente a repetição da ação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva a vivacidade narrativa do hebraico; “pão”, em vez de “bolo”, evita uma associação indevida com alimento doce.
