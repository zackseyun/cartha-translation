base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: pt
  text: E depois do terremoto, um fogo; Yahweh não estava no fogo. E depois do fogo, o som de um silêncio tênue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma voz mansa e delicada”, “um suave sussurro” ou “um sussurro baixo”. Em hebraico, literalmente, “som/voz de silêncio tênue”, uma expressão intencionalmente delicada e difícil.
    reason: Leitura alternativa de uma expressão hebraica ambígua.
lexical_decisions:
- source_word: וְאַחַר
  choice: E depois
  rationale: Preserva a coordenação e a progressão sequencial da narrativa hebraica.
- source_word: הָרַעַשׁ
  choice: do terremoto
  rationale: רַעַשׁ denota aqui um terremoto ou forte abalo; “terremoto” é claro e natural no contexto teofânico.
- source_word: אֵשׁ
  choice: veio um fogo
  rationale: O substantivo sem artigo introduz o fenômeno seguinte. O verbo “veio”, suprido em português, torna natural a oração nominal elíptica do hebraico.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: mas Yahweh não estava no fogo
  rationale: A preposição ב é mantida em sentido locativo, sem definir além do texto a natureza da presença divina; “mas” explicita o contraste inerente à sequência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: קוֹל
  choice: o som
  rationale: “Som” preserva a amplitude de קוֹל e evita afirmar inequivocamente que se trata de uma voz articulada.
- source_word: דְּמָמָה דַקָּה
  choice: de um suave sussurro
  rationale: Expressa em português natural a delicadeza extrema do sintagma, enquanto a nota registra sua formulação hebraica incomum e as alternativas possíveis.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva sem trocá-lo por um título.
- issue: Interpretação de קוֹל דְּמָמָה דַקָּה
  choice: o som de um suave sussurro
  alternative: uma voz mansa e delicada; o som de um silêncio tênue; um sussurro baixo
  rationale: A expressão hebraica é deliberadamente delicada e difícil. A leitura principal busca inteligibilidade moderna sem identificar necessariamente o som como fala, e a nota preserva sua ambiguidade lexical e tensão paradoxal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “E depois” conserva o ritmo narrativo hebraico; a nota mantém a conhecida ambiguidade da frase final.
