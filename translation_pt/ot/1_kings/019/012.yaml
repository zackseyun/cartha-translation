  source_fidelity: A tradução acrescenta «veio» e «mas», que não estão expressos no hebraico. Embora o primeiro possa suprir a elipse em português, a construção nominal com ponto e vírgula reproduz melhor a sequência concisa do original. Sobretudo, «suave sussurro» resolve de modo excessivo a tensão deliberada de קוֹל דְּמָמָה דַקָּה, cujo sentido mais literal envolve som/voz e silêncio/quietude.
  naturalness: '«O som de um suave sussurro» é redundante e pouco idiomático: um sussurro já é um som suave. «O som de um silêncio tênue» mantém um português poético, claro e deliberadamente paradoxal, apropriado ao registro do versículo.'
  terminology: «Yahweh» reproduz adequadamente o tetragrama. «Terremoto» é uma boa opção para הָרַעַשׁ. A nota deve apresentar «voz» e «sussurro» como alternativas, sem substituir no texto principal a ambiguidade de קוֹל.
