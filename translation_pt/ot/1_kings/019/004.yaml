base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: pt
  text: 'Ele, porém, foi deserto adentro, numa jornada de um dia. Chegou e sentou-se debaixo de uma retama.[a] Então pediu para morrer, dizendo: “Basta! Agora, Yahweh, tira a minha vida, pois não sou melhor do que os meus antepassados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico רֹתֶם designa um arbusto do deserto, provavelmente uma espécie de retama ou giesta; tradicionalmente, também é traduzido por “zimbro” ou “giesteira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר דֶּרֶךְ יוֹם
  choice: foi deserto adentro, numa jornada de um dia
  rationale: Expressa tanto o movimento para o interior da região desértica quanto a distância percorrida em um dia, sem reduzir a expressão a mera duração.
- source_word: רֹתֶם אַחַת
  choice: um arbusto de giesta
  rationale: רֹתֶם designa uma planta arbustiva do deserto, provavelmente uma retama/giesta. “Arbusto de giesta” é mais informativo e botanicamente mais adequado do que o tradicional “zimbro”; o singular indefinido transmite naturalmente אַחַת.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: pediu para morrer
  rationale: Reproduz em português natural o sentido do pedido feito por Elias a respeito da própria vida, evitando a formulação literal e pouco idiomática “pediu que sua alma morresse”.
- source_word: רַב עַתָּה
  choice: Já basta! Agora
  rationale: Mantém a exclamação enfática de רַב e dá expressão própria a עַתָּה, preservando a urgência da fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico em vez de substituí-lo por um título.
- source_word: קַח נַפְשִׁי
  choice: tira a minha vida
  rationale: Neste contexto, נֶפֶשׁ significa a vida da pessoa; Elias pede a morte, sem que o texto exija uma distinção antropológica entre corpo e alma.
- source_word: כִּי לֹא־טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: pois não sou melhor do que os meus antepassados
  rationale: O comparativo com מִן significa “melhor do que”. “Antepassados” comunica o referente de אֲבֹתַי em português atual sem acrescentar uma identificação mais específica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o nome próprio do Deus de Israel. “Yahweh” conserva esse caráter nominal, enquanto “SENHOR” é a substituição tradicional por um título.
- issue: Sentido de נֶפֶשׁ no pedido de Elias
  choice: vida
  alternative: alma
  rationale: O contexto imediato é um pedido para morrer; portanto, “vida” expressa o sentido contextual sem impor ao termo uma concepção posterior de alma separável.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e alcance internacional. A estrutura breve da súplica mantém o esgotamento e a urgência de Elias. Evitou-se “zimbro” no texto principal por ser uma identificação botânica tradicional, mas provavelmente incorreta.
