base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: pt
  text: 'Yahweh lhe disse: “Vá, retome o seu caminho até o deserto de Damasco[a]. Quando chegar, unja Hazael como rei sobre Arã[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em direção ao deserto de Damasco”. A forma hebraica de “deserto” contém uma terminação que indica direção.
    reason: lexical_alternative
  - marker: b
    text: Arã é o nome hebraico da região muitas vezes chamada de Síria.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵךְ שׁוּב
  choice: Vá, volte
  rationale: Preserva os dois imperativos hebraicos e sua força de ordem, com formulação natural em português.
- source_word: לְדַרְכְּךָ
  choice: pelo caminho por onde veio
  rationale: Expressa de modo idiomático a ordem de retomar o caminho anterior, sentido indicado pelo contexto.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: até o deserto de Damasco
  rationale: A terminação direcional de מִדְבָּרָה indica movimento rumo à região desértica associada a Damasco.
- source_word: וּבָאתָ
  choice: Quando chegar
  rationale: Traduz naturalmente a ação que antecede a ordem seguinte, sem perder a sequência do hebraico.
- source_word: וּמָשַׁחְתָּ
  choice: unja
  rationale: A forma verbal, ligada à sequência de ordens, tem força imperativa neste contexto.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Segue a transliteração portuguesa convencional do nome pessoal.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: como rei sobre Arã
  rationale: Reproduz com naturalidade a fórmula hebraica de nomeação e mantém o nome próprio histórico Arã.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração conserva seu caráter de nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta conserva o tom conciso da ordem. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
