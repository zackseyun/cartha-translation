  text: וַ/תִּשְׁלַ֤ח אִיזֶ֨בֶל֙ מַלְאָ֔ךְ אֶל אֵלִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה יַעֲשׂ֤וּ/ן אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִפ֔וּ/ן כִּֽי כָ/עֵ֤ת מָחָר֙ אָשִׂ֣ים אֶֽת נַפְשְׁ/ךָ֔ כְּ/נֶ֖פֶשׁ אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: pt
  text: 'Então Jezabel enviou um mensageiro a Elias, dizendo: “Que os deuses me castiguem, e ainda mais, se amanhã, a esta hora, eu não fizer com que a sua vida seja como a vida de um deles”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que Deus me castigue, e ainda mais”. O hebraico אֱלֹהִים pode ser entendido como singular, “Deus”, ou plural, “deuses”; aqui, o contexto de Jezabel e os verbos no plural favorecem “os deuses”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: Então ... enviou
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa sequência de modo natural em português.
- source_word: מַלְאָךְ
  choice: mensageiro
  rationale: Neste contexto da corte, trata-se claramente de um emissário humano, não de um ser celestial.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente e digna de introduzir discurso direto.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: Que os deuses me castiguem, e ainda mais
  rationale: A expressão é uma fórmula de juramento que invoca punição divina sobre quem fala. “Castiguem” explicita idiomaticamente em português o sentido elíptico de “façam assim”, e “me” representa o alvo implícito da maldição na fórmula.
- source_word: אֱלֹהִים
  choice: os deuses
  rationale: Embora o substantivo possa designar o Deus de Israel no singular, aqui os verbos estão no plural e o contexto de Jezabel favorece a leitura plural.
- source_word: כִּי
  choice: se
  rationale: Na fórmula de juramento, introduz a condição sob a qual a maldição deve cumprir-se.
- source_word: כָעֵת מָחָר
  choice: amanhã, a esta hora
  rationale: Reproduz diretamente o momento correspondente no dia seguinte, sem acrescentar a ideia de prazo contida em “até”.
- source_word: אָשִׂים אֶת־נַפְשְׁךָ כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: eu não fizer com a sua vida o mesmo que foi feito com a vida de cada um deles
  rationale: Comunica naturalmente a ameaça de dar a Elias o mesmo destino dos mortos, preservando a repetição de “vida” e o referente distributivo de אַחַד מֵהֶם.
theological_decisions:
- issue: Referente de אֱלֹהִים no juramento de Jezabel
  choice: 'plural: “os deuses”'
  alternative: 'singular: “Deus”'
  rationale: Os verbos plurais יַעֲשׂוּן e יוֹסִפוּן, juntamente com o contexto religioso de Jezabel, favorecem a leitura plural. A alternativa singular permanece textualmente possível devido à amplitude semântica de אֱלֹהִים e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula hebraica de juramento foi vertida idiomaticamente, sem eliminar sua solenidade nem a ambiguidade de אֱלֹהִים, preservada em nota.
