  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: pt
  text: 'Quando Elias ouviu isso[a], envolveu o rosto no seu manto, saiu e ficou de pé à entrada da caverna. E eis que uma voz lhe disse: “O que você está fazendo aqui[b], Elias?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não expressa o objeto de “ouviu”. Pelo contexto, trata-se do que foi mencionado imediatamente antes, possivelmente o som ou a voz.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Por que você está aqui?” O idiomatismo hebraico pergunta o que Elias faz nesse lugar ou qual é o propósito de estar ali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: quando ... ouviu isso
  rationale: A construção com כְּ e o infinitivo forma uma oração temporal. O objeto não é expresso no hebraico; “isso” retoma de modo discreto o que acaba de ser narrado sem definir se era o som ou a voz.
- source_word: וַיָּלֶט פָּנָיו
  choice: envolveu o rosto
  rationale: O verbo descreve o ato de cobrir ou envolver bem de perto; o sentido corporal de פָּנִים é claro neste contexto.
- source_word: בְּאַדַּרְתּוֹ
  choice: no seu manto
  rationale: אַדֶּרֶת designa aqui uma peça exterior característica. “Manto” é corrente, digno e adequado ao ato de envolver o rosto.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Indica o movimento de Elias para fora do interior da caverna.
- source_word: וַיַּעֲמֹד
  choice: ficou de pé
  rationale: Expressa que Elias assumiu e manteve uma posição junto à entrada; esta formulação é natural em português.
- source_word: פֶּתַח הַמְּעָרָה
  choice: à entrada da caverna
  rationale: פֶּתַח é a abertura ou entrada; “entrada da caverna” comunica o local com clareza e naturalidade.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função de apresentação vívida de הִנֵּה sem acrescentar a ideia não explícita de que o acontecimento foi súbito.
- source_word: אֵלָיו קוֹל
  choice: uma voz veio a ele
  rationale: A oração nominal hebraica apresenta uma voz dirigida a Elias. A formulação portuguesa mantém essa apresentação sem identificar além do texto quem fala.
- source_word: מַה לְּךָ פֹה
  choice: O que você está fazendo aqui
  rationale: O idiomatismo pergunta qual é a ocupação, o propósito ou a razão da presença de Elias naquele lugar. Esta tradução é natural e conserva uma amplitude maior que “Por que você está aqui?”.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Objeto implícito do verbo “ouvir”
  choice: ouviu isso
  alternative: ouviu o som; ouviu a voz; ouviu
  rationale: O hebraico não declara o objeto, embora o contexto anterior forneça o referente. O pronome neutro evita decidir se Elias ouviu especificamente o som mencionado antes ou uma voz divina.
- issue: Amplitude da pergunta מַה לְּךָ פֹה
  choice: O que você está fazendo aqui?
  alternative: Por que você está aqui?; Que há para você aqui?
  rationale: A expressão pergunta pela presença, atividade ou propósito de Elias. A opção escolhida preserva essa amplitude e não reduz a pergunta apenas à causa ou ao motivo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva a vivacidade narrativa do hebraico, enquanto “você” torna a pergunta direta e natural sem alterar seu teor.
