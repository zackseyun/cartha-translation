base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: pt
  text: 'Então ele deixou os bois, correu atrás de Elias e disse[a]: “Por favor, deixe-me beijar meu pai e minha mãe; depois, seguirei você”. Elias lhe respondeu: “Vá, volte[b], pois o que eu fiz a você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais geral: “Por favor, deixe-me despedir-me de meu pai e de minha mãe”. O verbo hebraico significa literalmente “beijar”.'
    reason: lexical_alternative
  - marker: b
    text: A resposta de Elias é difícil. Também pode ser entendida como “Volte, pois o que fiz por você?” ou como uma maneira elíptica de deixar a decisão com Eliseu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: deixou
  rationale: עזב significa comumente deixar ou abandonar; no contexto narrativo, “deixou” é natural e não sugere mais do que o hebraico afirma.
- source_word: הַבָּקָר
  choice: os bois
  rationale: בקר pode designar gado em geral, mas o contexto imediato de arar com juntas aponta para bois de trabalho.
- source_word: וַיָּרָץ אַחֲרֵי
  choice: correu atrás de
  rationale: Preserva de modo idiomático a ideia direta de correr no encalço de alguém.
- source_word: אֶשְּׁקָה נָּא
  choice: Por favor, deixe-me beijar
  rationale: נשק significa literalmente “beijar”, e נָא dá ao pedido um tom cortês; mantém-se a ação concreta, sem reduzi-la a uma despedida genérica.
- source_word: לְאָבִי וּלְאִמִּי
  choice: meu pai e minha mãe
  rationale: Mantém a menção explícita e individual dos dois pais presente no hebraico.
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: depois, seguirei você
  rationale: הלך אחרי pode expressar tanto ir atrás como seguir alguém. “Seguirei você” é português natural e, no contexto, conserva a noção de acompanhar Elias sem explicitar uma relação técnica de discipulado.
- source_word: לֵךְ שׁוּב
  choice: Vá, volte
  rationale: Reproduz os dois imperativos breves e a formulação abrupta do hebraico, em vez de fundi-los interpretativamente em um só comando.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: pois o que eu fiz a você?
  rationale: É a tradução mais direta da pergunta difícil, preservando sua ambiguidade quanto a permissão, censura ou lembrança do gesto profético.
theological_decisions:
- issue: Sentido da resposta de Elias em כִּי מֶה עָשִׂיתִי לָךְ
  choice: Manter a pergunta literal “pois o que eu fiz a você?” sem resolver sua força no texto principal.
  alternative: “pois o que fiz por você?”, “o que eu fiz a você que o impediria?” ou uma formulação que deixe explicitamente a decisão com Eliseu.
  rationale: A frase hebraica é genuinamente ambígua e pode ser entendida como permissão, censura ou referência ao chamado simbolizado pelo manto. Uma paráfrase interpretativa eliminaria essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome “Elias” é repetido na segunda fala para evitar a sequência ambígua de pronomes. A formulação incomum “Vá, volte” é mantida deliberadamente para refletir os dois imperativos do hebraico; a nota registra a dificuldade interpretativa.
