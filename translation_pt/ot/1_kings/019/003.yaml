base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: pt
  text: E ele viu, levantou-se e partiu para salvar a própria vida. Chegou a Berseba, que pertence a Judá, e deixou ali o seu servo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: E ele viu
  rationale: Preserva a leitura do texto consonantal vocalizado no WLC, em vez da variante antiga 'teve medo'. O objeto do ato de ver fica implícito, como no hebraico.
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: partiu para salvar a própria vida
  rationale: A expressão idiomática indica que Elias foi embora visando preservar a vida; a tradução comunica naturalmente esse sentido em português.
- source_word: בְּאֵר שֶׁבַע
  choice: Berseba
  rationale: Forma tradicional e amplamente reconhecida do topônimo bíblico em português.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: que pertence a Judá
  rationale: Reproduz de modo direto a indicação territorial do hebraico.
- source_word: נַעֲרוֹ
  choice: seu servo
  rationale: No contexto, נַעַר designa o auxiliar pessoal de Elias, não necessariamente alguém jovem.
theological_decisions:
- issue: Leitura de וַיַּרְא em contraste com a variante 'teve medo'
  choice: E ele viu
  alternative: E ele teve medo
  rationale: Segue o texto massorético do WLC fornecido e preserva sua ambiguidade, sem adotar no corpo do texto a leitura variante refletida por algumas testemunhas antigas.
translation_notes:
  register: Português moderno, digno e acessível, com coordenação narrativa natural. Mantém explicitamente 'E ele viu', embora a ausência de objeto seja incomum em português, porque essa forma representa a evidência textual fornecida.
