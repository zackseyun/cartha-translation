  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: pt
  text: Você ungirá Jeú, filho de Ninsi, como rei sobre Israel; e ungirá Eliseu, filho de Safate, de Abel-Meolá, como profeta em seu lugar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de você” ou “em substituição a você”; o hebraico pode expressar sucessão ou substituição.
    reason: alternativa lexical
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: você ungirá
  rationale: O Qal imperfeito na segunda pessoa masculina singular tem força diretiva neste contexto de comissionamento. A forma futura preserva tanto a estrutura hebraica quanto o tom solene, sendo clara em português moderno.
- source_word: לְמֶלֶךְ
  choice: como rei
  rationale: A preposição לְ introduz a função para a qual Jeú é designado; “como rei” expressa essa nomeação de maneira natural.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com referência ao governo real, עַל indica autoridade sobre um povo; “sobre Israel” preserva essa relação.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Jeú, filho de Ninsi
  rationale: Os nomes seguem as formas portuguesas bíblicas correntes, e o patronímico בֶן é mantido explicitamente como “filho de”.
- source_word: אֱלִישָׁע בֶּן שָׁפָט
  choice: Eliseu, filho de Safate
  rationale: Os nomes seguem as formas portuguesas bíblicas correntes, preservando a identificação patronímica.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: de Abel-Meolá
  rationale: A preposição מִן indica procedência. Em português, “de Abel-Meolá” identifica de modo conciso e natural a localidade de origem de Eliseu.
- source_word: לְנָבִיא
  choice: como profeta
  rationale: A preposição לְ marca a função para a qual Eliseu é designado; “como profeta” comunica claramente a nomeação.
- source_word: תַּחְתֶּיךָ
  choice: em seu lugar
  rationale: תַּחַת pode indicar substituição ou sucessão. “Em seu lugar” preserva a transferência da função sem definir de maneira excessiva se a ênfase é cronológica ou substitutiva.
- source_word: וְאֵת ... וְאֶת
  choice: e ... e
  rationale: אֵת marca os objetos diretos e não recebe tradução independente; as conjunções coordenam as duas incumbências.
theological_decisions:
- issue: Relação de Eliseu com Elias em תַּחְתֶּיךָ
  choice: Eliseu é designado profeta “em seu lugar”.
  alternative: “depois de você” ou “em substituição a você”
  rationale: A expressão aponta para sucessão ou substituição no ofício profético. A tradução principal mantém essa tensão sem impor uma cronologia estrita nem sugerir um afastamento abrupto de Elias.
translation_notes:
  register: Português moderno, claro e solene, com formas nominais bíblicas correntes no Brasil e amplamente reconhecíveis. O ponto e vírgula torna nítida a coordenação das duas nomeações, e o marcador da nota foi colocado junto à expressão ambígua que explica.
