  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: pt
  text: 'Então o anjo de Yahweh voltou pela segunda vez, tocou nele e disse[a]: “Levante-se e coma, pois a viagem é demais para você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mensageiro de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: Neste contexto narrativo, שוב indica que o mensageiro retornou; “voltou” é natural e conciso em português.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar “mensageiro” ou “anjo”; neste cenário de emissário divino, “anjo” é a formulação mais natural, enquanto Yahweh preserva o nome divino יְהוָה.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Preserva a indicação explícita de que esta foi a segunda ocorrência, em vez do menos específico “novamente”.
- source_word: וַיִּגַּע בּוֹ
  choice: tocou nele
  rationale: Traduz diretamente o verbo נגע com a preposição e o pronome; não é necessário acrescentar “de novo”, pois a repetição já foi indicada.
- source_word: קוּם אֱכֹל
  choice: Levante-se e coma
  rationale: Imperativos diretos em linguagem moderna, natural e digna.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem de modo claro e fluente em português.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: a viagem será demais para você
  rationale: A expressão hebraica apresenta o caminho como superior às forças ou à capacidade de Elias. “Será demais para você” preserva esse sentido sem reduzi-lo apenas à distância; o futuro contextual soa natural porque a viagem ainda está diante dele.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido de מַלְאָךְ
  choice: anjo
  alternative: mensageiro
  rationale: O referente é um emissário divino, para o qual “anjo” é a leitura tradicional e contextual mais natural; a alternativa lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A sintaxe narrativa é fluente, sem arcaísmos; o tratamento “você” comunica claramente que a viagem excederia a capacidade de Elias.
