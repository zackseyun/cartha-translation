base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: pt
  text: 'Então ele se deitou e dormiu debaixo de um pé de giesta. E eis que um anjo[a] tocou nele e lhe disse: “Levante-se e coma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”. A palavra hebraica מַלְאָךְ pode designar tanto um mensageiro humano quanto um ser angelical; neste contexto, “anjo” parece mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: Então ele se deitou e dormiu
  rationale: Os dois wayyiqtol dão sequência à narrativa. A formulação preserva os verbos simples שׁכב, “deitar-se”, e ישׁן, “dormir”, em português natural.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: debaixo de um pé de giesta
  rationale: תַּחַת significa “debaixo de”. רֹתֶם designa a giesta do deserto; “pé de giesta” comunica naturalmente uma planta individual, enquanto אֶחָד tem aqui valor indefinido.
- source_word: וְהִנֵּה זֶה
  choice: De repente, um
  rationale: A construção apresentativa introduz um acontecimento inesperado e vívido. “De repente” reproduz essa função narrativa com clareza, sem o arcaísmo de “e eis que”.
- source_word: מַלְאָךְ
  choice: anjo
  rationale: Embora o termo possa significar “mensageiro”, o contexto de provisão sobrenatural favorece “anjo”; a alternativa lexical é preservada em nota.
- source_word: נֹגֵעַ בּוֹ
  choice: tocou nele
  rationale: O particípio expressa a ação percebida na cena. O pretérito perfeito é a forma narrativa mais natural em português.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: Mantém a fórmula narrativa e o objeto indireto explícito do hebraico, sem redundância.
- source_word: קוּם אֱכֹל
  choice: Levante-se e coma
  rationale: Os dois imperativos breves são preservados. A conjunção torna a sequência idiomática em português sem alterar seu conteúdo.
theological_decisions:
- issue: Se מַלְאָךְ deve ser traduzido como “anjo” ou “mensageiro”
  choice: anjo
  alternative: mensageiro
  rationale: O termo hebraico admite ambos os sentidos, mas a visita e a provisão sobrenaturais no contexto favorecem “anjo”. A nota mantém visível a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pé de giesta” evita a classificação excessivamente rígida da planta como árvore ou arbusto. O marcador [a] aparece imediatamente após “anjo”, ao qual a nota se refere.
