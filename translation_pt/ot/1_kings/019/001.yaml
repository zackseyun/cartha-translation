lexical_decisions:
- source_word: וַיַּגֵּד
  choice: contou
  rationale: Expressa naturalmente o sentido narrativo de informar ou relatar.
- source_word: בֶחָרֶב
  choice: à espada
  rationale: Mantém a imagem e o meio de execução indicados no hebraico, em formulação idiomática portuguesa.
- source_word: הָרַג
  choice: havia matado
  rationale: Representa diretamente o verbo hebraico e, com o mais-que-perfeito composto, situa a ação antes do relato de Acabe.
theological_decisions:
- issue: Referente do sujeito implícito em הָרַג
  choice: como havia matado
  alternative: e tudo sobre ter matado
  rationale: O sujeito gramatical mais natural continua sendo Elias, embora o hebraico formule literalmente 'e tudo o que matou'. A tradução segue a leitura contextual sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'à espada' preserva o tom bíblico sem soar arcaica.
