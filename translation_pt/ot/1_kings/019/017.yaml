  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: pt
  text: E acontecerá que quem escapar da espada de Hazael, Jeú o matará; e quem escapar da espada de Jeú, Eliseu o matará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico está na forma causativa e também pode ser traduzido por “fará morrer”. A redação apresenta Eliseu diretamente como agente; no contexto mais amplo, sua ação pode ser entendida como o julgamento realizado por meio de seu ministério profético.
    reason: Esclarecer a forma causativa do verbo e preservar, sem resolver no texto principal, a possível natureza direta ou mediada da ação de Eliseu.
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: A fórmula hebraica introduz um resultado futuro declarado. Esta expressão conserva seu caráter narrativo e prospectivo em português natural.
- source_word: הַנִּמְלָט
  choice: quem escapar
  rationale: O particípio com artigo tem função substantivada e sentido genérico; “quem escapar” comunica isso com clareza e naturalidade.
- source_word: מֵחֶרֶב
  choice: da espada de
  rationale: Mantém a imagem concreta da espada, que neste contexto representa julgamento letal ou violência armada, sem reduzi-la a uma interpretação abstrata.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Transliteração tradicional e amplamente reconhecível do nome próprio em português.
- source_word: יָמִית
  choice: o matará
  rationale: O hifil de מות é causativo, literalmente “fará morrer”. Em português, “matará” expressa de modo natural a ação causativa e permite que o pronome explicite o objeto retomado por “quem”.
- source_word: יֵהוּא
  choice: Jeú
  rationale: Forma tradicional do nome próprio em português.
- source_word: וְהַנִּמְלָט
  choice: e quem escapar
  rationale: Repete de modo consistente e natural a construção genérica da primeira oração.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Forma tradicional do nome próprio em português.
theological_decisions:
- issue: A agência de Eliseu em “matará”
  choice: Manter no texto principal Eliseu como agente gramatical direto da morte dos que escaparem de Jeú.
  alternative: Entender que Eliseu provoca esse julgamento por sua palavra ou por seu ministério profético, e não necessariamente matando pessoalmente.
  rationale: A sintaxe hebraica apresenta Hazael, Jeú e Eliseu em construções paralelas como agentes do julgamento. A tradução não deve suavizar essa tensão; a possibilidade de agência profética ou mediada é indicada na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela do hebraico foi preservada, assim como a imagem da espada e a tensão quanto à atuação de Eliseu.
