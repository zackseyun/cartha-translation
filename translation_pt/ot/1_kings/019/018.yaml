base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: pt
  text: 'Contudo, deixei em Israel sete mil: todos os joelhos que não se dobraram diante de Baal e toda boca que não o beijou.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beijar uma imagem de culto era um gesto de homenagem ou adoração.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Contudo, deixarei
  rationale: O hifil perfeito de שׁאר significa fazer restar ou preservar. No contexto da resposta divina, o perfeito pode apresentar uma decisão certa com referência futura; “deixarei” preserva essa leitura natural sem acrescentar “para mim”, que não está expresso no hebraico.
- source_word: בְיִשְׂרָאֵל
  choice: em Israel
  rationale: Expressão locativa direta.
- source_word: שִׁבְעַת אֲלָפִים
  choice: sete mil
  rationale: Forma portuguesa idiomática para o numeral cardinal hebraico.
- source_word: כָּל הַבִּרְכַּיִם
  choice: todos os joelhos
  rationale: Mantém a imagem corporal coletiva do hebraico, empregada metonimicamente para as pessoas.
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: que não se dobraram diante de Baal
  rationale: כרע denota dobrar-se ou ajoelhar-se. A formulação mantém o gesto de submissão cultual e soa natural em português.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Embora o hebraico use artigo, em português Baal é convencionalmente tratado como nome próprio, sem artigo.
- source_word: וְכָל הַפֶּה
  choice: e toda boca
  rationale: Preserva o singular distributivo e a imagem concreta, em paralelo com “todos os joelhos”.
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: que não o beijou
  rationale: Traduz literalmente נשׁק e conserva o pronome cujo antecedente é Baal; o contexto indica homenagem ou culto.
theological_decisions:
- issue: Declaração sobre os fiéis restantes sem importar terminologia doutrinária posterior
  choice: Contudo, deixarei em Israel sete mil
  alternative: Contudo, preservei para mim sete mil em Israel
  rationale: A tradução mantém a ação soberana de Deus em fazer restar um grupo fiel, mas evita inserir “para mim”, ausente do texto massorético. O futuro português representa a leitura contextual tradicional do perfeito como ação determinada, sem excluir a nuance de preservação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. As imagens corporais do hebraico foram mantidas; evitou-se vocabulário teológico técnico.
