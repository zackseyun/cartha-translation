    rationale: A construção וְהוּא בִּשְׁנֵים הֶעָשָׂר situa Eliseu “com/na décima segunda” parelha, sem declarar expressamente que ele a conduzia. A revisão conserva a elipse e a ambiguidade controlada do hebraico.
  - severity: medium
    issue: A âncora [b] está associada à “décima segunda”, embora a nota trate de “manto”.
    rationale: A âncora deve seguir o termo a que a nota lexical se refere.
  - severity: low
    issue: A nota [b] inclui uma explicação interpretativa do simbolismo profético.
    rationale: Embora seja compatível com o contexto mais amplo, essa explicação não é exigida pela tradução lexical de אַדֶּרֶת neste versículo. Uma nota lexical neutra evita impor interpretação.
