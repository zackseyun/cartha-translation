base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: pt
  text: Então ele saiu dali e encontrou Eliseu, filho de Safate. Eliseu estava arando com doze parelhas[a] à sua frente e estava com a décima segunda. Elias passou por ele e lançou sobre ele o seu manto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “doze juntas de bois”. O hebraico se refere a doze pares de animais usados para arar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “capa”. O termo hebraico designa uma veste externa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Então ele saiu dali
  rationale: O consecutivo hebraico dá continuidade à narrativa; “então” e “saiu dali” exprimem essa progressão em português natural.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: e encontrou Eliseu, filho de Safate
  rationale: Traduz מָצָא diretamente por “encontrou” e emprega as formas portuguesas correntes dos nomes.
- source_word: וְהוּא חֹרֵשׁ
  choice: Eliseu estava arando
  rationale: O particípio apresenta uma ação em andamento. A repetição do nome evita ambiguidade pronominal em português.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: doze parelhas
  rationale: צֶמֶד designa um par ou uma junta de animais. “Parelhas” preserva a ideia de equipes emparelhadas sem inserir “bois” no texto principal.
- source_word: לְפָנָיו
  choice: à sua frente
  rationale: Mantém a relação espacial expressa pelo hebraico em formulação corrente.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: e conduzia a décima segunda
  rationale: A expressão hebraica é elíptica e situa Eliseu com a décima segunda parelha. “Conduzia” torna a cena agrícola inteligível sem eliminar essa informação.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: Elias passou por ele
  rationale: Representa de modo idiomático o movimento de Elias em direção a Eliseu e junto dele.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: e lançou sobre ele o seu manto
  rationale: אַדֶּרֶת é a veste externa distintiva de Elias. “Manto” é digno, claro e tradicional em português, sem transformar o gesto em uma explicação teológica.
theological_decisions:
- issue: Significado simbólico do manto de Elias
  choice: Narrar literalmente que Elias lançou seu manto sobre Eliseu
  alternative: Parafrasear o gesto como nomeação de Eliseu para profeta ou sucessor
  rationale: O versículo relata o ato simbólico, mas não explicita nele próprio todo o seu significado. A tradução preserva o gesto e deixa sua interpretação decorrer do contexto.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. A sintaxe foi levemente desambiguada pela repetição de “Eliseu”, e a elipse hebraica referente à décima segunda parelha foi expressa de modo natural.
