base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: pt
  text: 'E ele disse: “Saia e fique de pé no monte, diante de Yahweh.” E eis que Yahweh passava, e um vento grande e forte fendia os montes e despedaçava as rochas diante de Yahweh; mas Yahweh não estava no vento.[a] Depois do vento, houve um terremoto; mas Yahweh não estava no terremoto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Yahweh não estava no vento”. A frase pode indicar que ele não se revelou nele, mas a tradução conserva a formulação mais literal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Yahweh não estava no terremoto”. O texto não nega que Yahweh governasse o acontecimento; apenas afirma que ele não estava nele, no sentido próprio desta narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: צֵא וְעָמַדְתָּ
  choice: Saia e fique de pé
  rationale: Reproduz os dois verbos de movimento e posição de modo claro e natural em português.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Mantém o sentido espacial e relacional da expressão hebraica sem explicitação interpretativa.
- source_word: וְהִנֵּה
  choice: Então
  rationale: Marca a transição vívida da narrativa em português corrente; evita o pouco natural 'e eis que' sem perder a mudança de cena.
- source_word: עֹבֵר
  choice: passava por ali
  rationale: O particípio comunica ação em curso; a formulação conserva a ideia de passagem sem impor futuridade.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: um vento grande e forte
  rationale: O contexto exige o sentido meteorológico de רוּחַ, e os dois qualificativos hebraicos são preservados separadamente.
- source_word: מְפָרֵק הָרִים וּמְשַׁבֵּר סְלָעִים
  choice: que fendia os montes e despedaçava as rochas
  rationale: Expressa a ação contínua e violenta dos particípios, mantendo o paralelismo e a imagem concreta.
- source_word: רַעַשׁ
  choice: terremoto
  rationale: No contexto da sequência de fenômenos naturais, designa de modo claro um abalo sísmico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome próprio em vez de o substituir por um título.
- issue: Sentido de לֹא בָרוּחַ יְהוָה e לֹא בָרַעַשׁ יְהוָה
  choice: Yahweh não estava no vento / no terremoto
  alternative: Yahweh não se revelou no vento / no terremoto
  rationale: Mantém a formulação locativa e a tensão teológica do hebraico, sem definir se a frase trata de presença, revelação ou modo de manifestação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem narrativa e as imagens concretas do hebraico foram preservadas, enquanto construções excessivamente literais e pouco naturais foram evitadas.
