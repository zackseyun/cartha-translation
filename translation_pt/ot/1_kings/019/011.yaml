    issue: «ia adiante de Yahweh» para לִפְנֵי יְהוָה
    rationale: A locução hebraica significa «diante de Yahweh»/«perante Yahweh». A redação atual comunica que o vento se movia à frente de Yahweh, acrescentando uma relação direcional que o texto não afirma.
  - severity: low
    issue: «Então» e «por ali»
    rationale: וְהִנֵּה é um marcador de destaque narrativo mais bem representado por «e eis que». «Por ali» não tem correspondente explícito no hebraico e pode ser omitido sem perda de naturalidade.
