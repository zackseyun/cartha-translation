base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: pt
  text: Então ele voltou de seguir Elias, tomou a parelha de bois[a] e os sacrificou. Com os apetrechos dos bois[b], cozinhou a carne, deu-a ao povo, e eles comeram. Depois, levantou-se, foi atrás de Elias e o serviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a junta de bois”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Com o jugo dos bois” ou “com os utensílios dos bois”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: Então ele voltou de junto de Elias
  rationale: A expressão hebraica significa literalmente que Eliseu voltou de detrás dele. A formulação portuguesa comunica de modo natural que ele retornou após ter ido ao encontro de Elias, sem sugerir que o abandonou definitivamente.
- source_word: צֶמֶד הַבָּקָר
  choice: a parelha de bois
  rationale: צֶמֶד pode designar uma parelha, especialmente dois animais atrelados. “Parelha de bois” identifica com clareza os animais que são sacrificados e conserva a ideia de trabalho conjunto.
- source_word: וַיִּזְבָּחֵהוּ
  choice: e os sacrificou
  rationale: זבח costuma indicar abate sacrificial. O plural em português concorda semanticamente com os dois bois, embora o sufixo hebraico retome a parelha como unidade coletiva.
- source_word: וּבִכְלִי הַבָּקָר
  choice: Com os apetrechos dos bois
  rationale: כְּלִי é um termo amplo para utensílio, instrumento ou equipamento. “Apetrechos” abrange a aparelhagem usada com os bois sem restringi-la indevidamente a uma única peça.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: cozinhou a carne
  rationale: בשל pode significar cozinhar ou, mais especificamente, cozer em líquido. “Cozinhou” é corrente e não impõe um método culinário mais preciso do que o contexto permite.
- source_word: לָעָם
  choice: ao povo
  rationale: עם se refere às pessoas da comunidade presentes, e “ao povo” mantém a referência coletiva e direta.
- source_word: וַיָּקָם
  choice: Depois, levantou-se
  rationale: Mantém a sequência narrativa do hebraico em português natural, sem fundir este verbo com o deslocamento expresso em seguida.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: foi atrás de Elias
  rationale: Reproduz a imagem concreta de ir atrás de Elias e ecoa a expressão direcional do início do versículo.
- source_word: וַיְשָׁרְתֵהוּ
  choice: e o serviu
  rationale: שרת descreve serviço, muitas vezes na função de auxiliar ou atendente. “Serviu” preserva a amplitude do termo sem definir além do texto a natureza exata desse serviço.
theological_decisions:
- issue: Se זבח deve conservar linguagem explicitamente sacrificial
  choice: “os sacrificou”
  alternative: “os abateu” ou “os matou”
  rationale: O verbo hebraico possui normalmente conotação sacrificial, e a refeição comunitária é compatível com ela. A tradução mantém essa nuance, mas não especifica o destinatário nem o contexto cultual do sacrifício, pois o texto não o faz.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros e inteligíveis internacionalmente. A repetição coordenada preserva o ritmo narrativo hebraico sem produzir rigidez excessiva.
