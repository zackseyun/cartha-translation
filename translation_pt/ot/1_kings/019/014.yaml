reference: 1 Kings 19:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: pt
  text: 'Ele respondeu: “Tenho sido muito zeloso[a] por Yahweh, o Deus dos Exércitos, porque os filhos de Israel[b] abandonaram a tua aliança, derrubaram os teus altares e mataram os teus profetas à espada. Só eu fiquei, e eles procuram tirar a minha vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Tenho ardido de ciúme por Yahweh”. O hebraico repete a mesma raiz verbal para intensificar a afirmação.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, “os israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Tenho sido muito zeloso
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a afirmação. “Muito zeloso” comunica em português atual o ardor de Elias pela fidelidade à aliança, sem reduzir o termo à ideia moderna de inveja.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: A preposição ל indica o objeto do zelo de Elias. O nome divino יהוה é transliterado como “Yahweh”, preservando seu caráter de nome próprio.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: O título mantém a amplitude de צְבָאוֹת, que pode abranger exércitos celestes e terrenos. “Deus dos Exércitos” é claro e digno em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz a explicação dada por Elias para seu zelo.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: abandonaram a tua aliança
  rationale: עָזַב significa abandonar ou deixar. A formulação conserva a gravidade da ruptura da aliança e soa natural em português moderno.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a designação coletiva e pactual do hebraico, permanecendo inteligível em português; a nota registra a equivalência idiomática “os israelitas”.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: derrubaram os teus altares
  rationale: הָרַס descreve demolir ou pôr abaixo. “Derrubaram” é vívido, preciso e corrente.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: mataram os teus profetas à espada
  rationale: Conserva tanto a ação violenta quanto o instrumento expresso no hebraico.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Só eu fiquei
  rationale: Reproduz de modo conciso e enfático a alegação de isolamento de Elias.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: eles procuram tirar a minha vida
  rationale: 'נֶפֶשׁ, nesta expressão, significa a vida da pessoa. A formulação portuguesa reúne naturalmente a busca e seu propósito explícito: tomá-la.'
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome da aliança, יהוה. “Yahweh” o apresenta como nome próprio, sem substituí-lo por um título.
- issue: Sentido de קנא na declaração de Elias
  choice: zeloso
  alternative: ciumento
  rationale: No contexto, Elias afirma ardente lealdade a Yahweh, não inveja. A nota conserva a possibilidade lexical de “ciúme” sem impor ao texto conotações inadequadas do português moderno.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A opção preserva a expressão pactual e gramatical do hebraico; a alternativa idiomática é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “tu” por coerência com a fala direta dirigida a Deus e mantém “Yahweh” como nome próprio. A sintaxe é natural, mas preserva a intensidade, o título divino e a alegação enfática de isolamento presentes no hebraico.
