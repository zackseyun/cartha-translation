  text: וַ/יָּבֹא שָׁ֥ם אֶל הַ/מְּעָרָ֖ה וַ/יָּ֣לֶן שָׁ֑ם וְ/הִנֵּ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: pt
  text: 'Ele chegou ali, à caverna, e passou a noite ali. E eis que a palavra de Yahweh veio a ele e lhe disse: “O que você está fazendo aqui, Elias?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que você está aqui, Elias?” A expressão hebraica diz literalmente: “O que [há] para você aqui, Elias?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: Ali ele chegou à caverna
  rationale: בוא é um verbo comum de movimento, e a preposição אֶל indica direção para a caverna. “Chegou à caverna” preserva isso sem afirmar explicitamente que ele entrou nela, embora o contexto permita essa compreensão.
- source_word: וַיָּלֶן שָׁם
  choice: e passou a noite
  rationale: O verbo לון/לין significa alojar-se ou passar a noite. “Passou a noite” é claro, natural e atual em português.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: הִנֵּה chama a atenção para um acontecimento repentino ou significativo. “E eis que” conserva essa força narrativa em registro bíblico digno e compreensível.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética reconhecível e traduz diretamente o nome divino presente no texto hebraico.
- source_word: אֵלָיו
  choice: veio a ele
  rationale: A preposição אֶל com o sufixo pronominal expressa direção. A construção portuguesa preserva a ideia de que a palavra foi dirigida a Elias.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: Conserva a sequência do hebraico, no qual o sujeito gramatical é “a palavra de Yahweh”, sem repetir desnecessariamente “a ele” em português.
- source_word: מַה לְּךָ פֹה
  choice: O que você está fazendo aqui
  rationale: A expressão hebraica é literalmente “O que [há] para você aqui?”. No contexto, a formulação escolhida comunica naturalmente a pergunta sobre a presença e a situação de Elias, sem restringi-la apenas ao motivo.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” translitera o nome divino em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Formulação דְבַר יְהוָה
  choice: a palavra de Yahweh
  alternative: uma palavra da parte de Yahweh; a mensagem de Yahweh
  rationale: A escolha preserva a fórmula profética tradicional e seu peso teológico, sem transformar “palavra” em uma paráfrase interpretativa.
- issue: A palavra como sujeito de “disse”
  choice: a palavra de Yahweh veio a ele e lhe disse
  alternative: a palavra de Yahweh veio a ele, dizendo
  rationale: A redação acompanha de perto a sintaxe hebraica e preserva sua possível personificação da palavra divina, em vez de suavizá-la silenciosamente.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” torna a pergunta direta e natural; “eis que” preserva a vivacidade narrativa e o tom bíblico sem recorrer a linguagem arcaica. A nota registra a ambiguidade genuína da pergunta hebraica.
