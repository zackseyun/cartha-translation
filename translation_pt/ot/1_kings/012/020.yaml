  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: pt
  text: Quando todo o Israel soube que Jeroboão tinha voltado, mandaram chamá-lo à assembleia e o fizeram rei sobre todo o Israel. Ninguém seguiu a casa de Davi[a], a não ser a tribo de Judá somente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ninguém permaneceu com a casa de Davi, a não ser a tribo de Judá somente”. O hebraico diz literalmente: “não havia [ninguém] atrás da casa de Davi”; neste contexto, a expressão indica lealdade ou alinhamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... soube
  rationale: A construção introduz uma transição temporal na narrativa. Em português atual, “Quando ... soube” preserva essa função sem a formulação rígida “E aconteceu que, ao ouvir”.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva nacional do hebraico, natural no contexto histórico.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: que Jeroboão tinha voltado
  rationale: שׁוּב indica retorno; “tinha voltado” situa naturalmente esse retorno antes das ações seguintes.
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: mandaram chamá-lo à assembleia
  rationale: A locução portuguesa comunica de modo natural o envio implícito para chamar ou convocar Jeroboão, sem especificar “mensageiros”, que o texto não nomeia.
- source_word: הָעֵדָה
  choice: a assembleia
  rationale: No contexto, designa o corpo reunido de Israel para uma ação política; “assembleia” evita uma conotação eclesiástica indevida.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: o fizeram rei
  rationale: O hifil de מלך significa fazer alguém reinar ou constituí-lo rei; a tradução não acrescenta uma coroação ou proclamação não mencionada.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: Preserva a construção que expressa o âmbito do governo real de Jeroboão.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: Ninguém seguiu a casa de Davi
  rationale: O idioma “estar atrás de” expressa aqui seguimento, alinhamento ou lealdade política. “Seguiu” conserva a imagem hebraica e é compreensível em português.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: a não ser a tribo de Judá somente
  rationale: זוּלָתִי introduz a exceção, e לְבַדּוֹ reforça sua exclusividade. “Somente” preserva essa ênfase deliberada.
theological_decisions:
- issue: Fórmula de lealdade política após a divisão do reino
  choice: Ninguém seguiu a casa de Davi
  alternative: Ninguém permaneceu com a casa de Davi
  rationale: A declaração descreve primariamente alinhamento histórico-político. “Seguiu” reflete o idioma hebraico sem transformar “casa de Davi” em uma explicação interpretativa como “dinastia davídica”; a alternativa legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jeroboão”, “Davi” e “Judá” seguem formas bíblicas correntes. A sintaxe narrativa foi naturalizada sem apagar a ênfase hebraica na exclusividade da tribo de Judá.
