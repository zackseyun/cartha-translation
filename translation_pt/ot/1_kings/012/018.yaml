  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת אֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמ֨וּ כָל יִשְׂרָאֵ֥ל בּ֛/וֹ אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: pt
  text: Então o rei Roboão enviou Adorão[a], que era o responsável pelos trabalhos forçados. Todo o Israel o apedrejou[b], e ele morreu. O rei Roboão apressou-se[c] a subir na carruagem para fugir para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Adorão”; algumas passagens relacionadas usam a forma “Adonirão”.'
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “apedrejou-o com pedras”.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “esforçou-se” ou “fortaleceu-se” para subir na carruagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Forma narrativa comum de שׁלח, indicando que Roboão encarregou Adorão de uma missão.
- source_word: אֲדֹרָם
  choice: Adorão
  rationale: Reproduz em forma portuguesa o nome lido pelo texto massorético neste versículo; a forma relacionada Adonirão é registrada em nota.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: que era o responsável pelos trabalhos forçados
  rationale: Identifica Adorão como o oficial encarregado do trabalho compulsório imposto pelo Estado, em linguagem clara e atual.
- source_word: הַמַּס
  choice: trabalhos forçados
  rationale: Neste contexto, מַס designa mão de obra compulsória, não simplesmente tributo monetário.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: o apedrejou
  rationale: Expressa naturalmente em português o ato descrito pelo idioma hebraico; a formulação mais explícita, 'apedrejou com pedras', é preservada em nota.
- source_word: כָל יִשְׂרָאֵל
  choice: Todo o Israel
  rationale: Mantém a designação coletiva e político-pactual empregada pela narrativa para as tribos do norte.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Conserva a simples progressão narrativa e declara diretamente o resultado do apedrejamento.
- source_word: הִתְאַמֵּץ
  choice: apressou-se
  rationale: No contexto da fuga, o hitpael de אמץ comunica esforço decidido e urgente; 'apressou-se' transmite esse sentido com naturalidade, enquanto a forma mais literal é indicada em nota.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: a subir no carro
  rationale: עלה com מֶרְכָּבָה significa montar ou subir no carro; a tradução conserva a nuance direcional sem soar excessivamente técnica.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: para fugir para Jerusalém
  rationale: נוּס denota fuga e ressalta a retirada urgente de Roboão.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução prioriza equivalência ótima: usa construções naturais como “apedrejou” e “apressou-se”, mas registra em notas as formulações hebraicas mais literais. “Carro” é mantido no sentido antigo de carro de guerra ou carruagem, conforme o contexto narrativo.'
