  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Não subam nem lutem contra seus irmãos, os filhos de Israel.[a] Voltem, cada um para sua casa, pois isso vem de mim.[b]” Eles ouviram a palavra de Yahweh e voltaram, conforme a palavra de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra seus irmãos israelitas”. O hebraico diz literalmente “com seus irmãos, os filhos de Israel”; com o verbo “lutar”, a preposição tem o sentido de “contra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois esta questão procede de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa diretamente o nome divino.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: Não subam nem lutem
  rationale: Mantém o sentido básico de עלה e verte naturalmente a sequência coordenada de proibições.
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: contra seus irmãos, os filhos de Israel
  rationale: Com o verbo 'lutar', עִם indica o adversário; 'irmãos' conserva a linguagem de parentesco, e 'filhos de Israel' preserva a aposição hebraica.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Volte cada um para sua casa
  rationale: O singular distributivo em português expressa de modo claro e natural a ordem dirigida a cada homem do grupo.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: pois isso vem de mim
  rationale: Expressa a procedência divina sem definir além do hebraico a natureza exata da causalidade.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: Eles ouviram a palavra de Yahweh
  rationale: Preserva a amplitude de שׁמע entre ouvir e atender; a ação seguinte deixa implícita a obediência.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: e voltaram, conforme a palavra de Yahweh
  rationale: Produz português natural e conserva tanto o retorno quanto sua conformidade com a ordem divina.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino; a transliteração 'Yahweh' o distingue de títulos e segue a orientação fornecida.
- issue: Força da linguagem de parentesco em אֲחֵיכֶם
  choice: seus irmãos
  alternative: seus compatriotas israelitas
  rationale: Mantém a imagem familiar que ressalta a gravidade de uma guerra entre membros do mesmo povo da aliança.
- issue: Agência divina em מֵאִתִּי נִהְיָה
  choice: isso vem de mim
  alternative: isso aconteceu por minha causa
  rationale: A formulação escolhida preserva a afirmação de origem divina sem resolver de modo excessivo a tensão entre origem, permissão e causação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem distributiva foi formulada no singular ('Volte cada um') para soar natural. A linguagem de parentesco e a repetição do nome divino foram preservadas.
