base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: pt
  text: Seu pai tornou pesado o nosso jugo[a]. Agora, alivie o trabalho duro[b] imposto por seu pai e o pesado jugo que ele colocou sobre nós, e nós o serviremos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou duro o nosso jugo”. O hebraico usa a imagem do jugo para representar obrigações opressivas.'
    reason: lexical_alternative
  - marker: b
    text: “Trabalho duro” também pode ser traduzido como “serviço duro” ou “serviço severo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: tornou pesado o nosso jugo
  rationale: Preserva o sentido causativo de הִקְשָׁה e a metáfora concreta do jugo. Embora הִקְשָׁה possa significar tornar duro ou severo, “pesado” é natural em português e antecipa a descrição explícita do jugo como pesado no mesmo versículo.
- source_word: עֻלֵּנוּ
  choice: nosso jugo
  rationale: Mantém a imagem hebraica de obrigações opressivas, em vez de substituí-la pela explicação mais genérica “fardo”.
- source_word: עַתָּה הָקֵל
  choice: Agora, alivie
  rationale: O imperativo הָקֵל pede que o peso seja reduzido. “Alivie” é claro e idiomático em português atual.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: o trabalho duro imposto por seu pai
  rationale: עֲבֹדָה pode indicar trabalho ou serviço obrigatório. “Trabalho duro” comunica a carga exigida, e “imposto por” explicita de modo natural a relação genitiva contextual sem introduzir uma entidade nova.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: e o pesado jugo
  rationale: Conserva a metáfora e o contraste entre aliviar e pesado. A construção portuguesa coordena naturalmente os dois objetos da redução solicitada.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: que ele colocou sobre nós
  rationale: Tradução direta e idiomática de נתן על no contexto da imposição de um jugo.
- source_word: וְנַעַבְדֶךָּ
  choice: e nós o serviremos
  rationale: Preserva a promessa resultante do pedido. O pronome “o” é amplamente compreensível e mantém registro digno.
