lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: se rebelou ... e continua assim
  rationale: Em contexto político, פשע indica rebelião contra uma autoridade. O pretérito traduz o acontecimento narrado, enquanto “e continua assim” explicita a permanência indicada por “até hoje”, sem reduzir o verbo a uma referência genérica ao pecado.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome próprio e seu sentido coletivo, que neste contexto designa as tribos do norte em contraste com a dinastia davídica.
- source_word: בְּבֵית דָּוִד
  choice: contra a casa de Davi
  rationale: Com פשע, a preposição בְּ marca aquele contra quem ocorre a rebelião. “Casa de Davi” preserva o sentido dinástico da expressão hebraica.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: É a forma portuguesa natural do idioma hebraico que indica continuidade desde o acontecimento narrado até o tempo do escritor.
