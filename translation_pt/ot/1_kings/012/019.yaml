  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: pt
  text: Assim, Israel se rebelou contra a casa de Davi até hoje[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, Israel tem estado em rebelião contra a casa de Davi até hoje.”'
