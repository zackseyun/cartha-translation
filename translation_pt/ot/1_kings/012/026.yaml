  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: pt
  text: 'Jeroboão disse em seu coração[a]: “Agora o reino voltará para a casa de Davi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consigo mesmo”. O hebraico diz literalmente “em seu coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O waw consecutivo faz a narrativa avançar. Em português, a simples sequência verbal é natural e evita um “e” desnecessário no início do versículo isolado.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּלִבּוֹ
  choice: em seu coração
  rationale: Preserva literalmente a imagem antropológica hebraica, ao mesmo tempo que a nota esclarece que se trata de pensamento interior.
- source_word: עַתָּה
  choice: Agora
  rationale: Mantém de modo conciso a força temporal e a urgência da preocupação de Jeroboão.
- source_word: תָּשׁוּב
  choice: voltará
  rationale: O verbo שוב expressa retorno. O futuro do português comunica naturalmente a previsão de que o reino reverterá à dinastia anterior.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: Designa aqui o domínio político ou a monarquia; “reino” é claro, natural e contextualmente adequado.
- source_word: לְבֵית דָּוִד
  choice: para a casa de Davi
  rationale: Conserva a expressão dinástica bíblica e suas ressonâncias, sem substituí-la pela explicação interpretativa “dinastia de Davi”.
theological_decisions:
- issue: Tradução do idioma de fala interior בְּלִבּוֹ
  choice: em seu coração
  alternative: consigo mesmo
  rationale: A formulação mantém a imagem hebraica e a textura literária sem resolver além do texto o modo do pensamento interior; a nota fornece o equivalente idiomático moderno.
translation_notes:
  register: Português moderno, digno e de leitura natural, com terminologia bíblica reconhecível. A ordem foi levemente ajustada à sintaxe portuguesa, e a expressão hebraica “em seu coração” foi preservada e esclarecida em nota.
