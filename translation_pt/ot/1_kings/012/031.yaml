base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: pt
  text: Ele fez um santuário nos lugares altos[a] e nomeou sacerdotes dentre todo o povo, os quais não eram dos filhos de Levi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “uma casa de lugares altos”, expressão que designa um santuário associado aos lugares altos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não eram levitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez / nomeou
  rationale: O verbo עשה é amplo. Na primeira oração, “fez” conserva essa generalidade; diante de “sacerdotes”, “nomeou” expressa em português natural o ato de constituí-los no ofício sem especificar um rito de ordenação.
- source_word: בֵּית בָּמוֹת
  choice: santuários nos lugares altos
  rationale: A expressão, literalmente “casa de lugares altos”, designa instalações de culto ligadas aos lugares altos. “Santuários” comunica o sentido cultual de modo claro, enquanto a nota preserva a forma hebraica.
- source_word: כֹּהֲנִים
  choice: sacerdotes
  rationale: Equivalente português corrente e preciso neste contexto cultual.
- source_word: מִקְצוֹת הָעָם
  choice: dentre todo o povo
  rationale: A expressão indica recrutamento no conjunto da população. Esta formulação evita a leitura espacial e conserva o alcance amplo do hebraico.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: os quais não eram dos filhos de Levi
  rationale: Mantém explicitamente a linguagem de descendência e a distinção levítica do texto hebraico.
theological_decisions:
- issue: Caracterização das instituições de culto estabelecidas por Jeroboão
  choice: santuários nos lugares altos
  alternative: uma casa de lugares altos
  rationale: A tradução comunica a natureza cultual da expressão idiomática sem acrescentar uma condenação teológica que não esteja expressa neste versículo; a literalidade é registrada em nota.
- issue: Condição não levítica dos sacerdotes
  choice: não eram dos filhos de Levi
  alternative: não eram levitas
  rationale: A opção preserva a formulação genealógica explícita do hebraico, sem ampliar suas implicações doutrinárias.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por clareza brasileira sem regionalismos marcados. A redação mantém a coordenação simples do hebraico e usa notas apenas onde a forma literal ou uma alternativa relevante merece ser preservada.
