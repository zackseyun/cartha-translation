  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: pt
  text: Então Jeroboão edificou Siquém, na região montanhosa de Efraim, e morou ali; depois saiu dali e edificou Penuel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Penuel também aparece como Peniel em algumas traduções e em passagens bíblicas relacionadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: edificou
  rationale: O verbo בנה significa normalmente “construir” ou “edificar”. Em referência a uma cidade, pode envolver reconstrução ou fortificação, mas “edificou” preserva o sentido básico sem especificar mais do que o hebraico.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma portuguesa consagrada do nome geográfico hebraico.
- source_word: בְּהַר אֶפְרַיִם
  choice: na região montanhosa de Efraim
  rationale: הַר pode designar não apenas um monte isolado, mas uma região de montes. A expressão escolhida comunica com naturalidade o sentido geográfico.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: e passou a morar ali
  rationale: ישב pode significar sentar-se, habitar, morar ou estabelecer-se. O valor narrativo da forma verbal sugere o início ou estabelecimento da residência; “ali” representa naturalmente o sufixo feminino que retoma a cidade.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: Depois saiu dali
  rationale: A tradução conserva o sentido concreto de יצא, “sair”, e entende מִשָּׁם como referência a Siquém. “Depois” expressa de modo natural a progressão narrativa sem alterar a relação entre as ações.
- source_word: פְּנוּאֵל
  choice: Penuel
  rationale: Transliteração correspondente à forma consonantal presente neste versículo; “Peniel” é uma forma alternativa conhecida e é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de uso bíblico corrente. A coordenação narrativa hebraica foi vertida com “Então” e “Depois” para fluidez, sem eliminar a sequência das ações. O marcador da nota foi colocado junto a “Penuel”, termo ao qual a nota se refere.
