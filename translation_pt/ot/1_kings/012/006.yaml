base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: pt
  text: 'Então o rei Roboão consultou os anciãos que tinham servido na presença de Salomão, seu pai, enquanto Salomão ainda vivia, e perguntou: “Como vocês me aconselham a responder a este povo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: consultou
  rationale: O nifal de יעץ indica buscar conselho de outras pessoas; “consultou” é natural e preciso em português.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: No contexto da corte, refere-se a homens experientes e conselheiros veteranos, não apenas a homens idosos.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: que tinham servido na presença de Salomão
  rationale: A expressão idiomática hebraica “estar de pé diante de” denota comparecer perante alguém e servi-lo; a tradução comunica a função cortesã sem produzir uma imagem enganosa em português.
- source_word: בִּהְיֹתוֹ חַי
  choice: enquanto ele ainda vivia
  rationale: A oração temporal se refere a Salomão e contrasta o período de sua vida com o momento narrado após sua morte.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Como vocês me aconselham
  rationale: A pergunta solicita o conselho dos anciãos; “me” explicita em português o destinatário implícito da orientação.
- source_word: לְהָשִׁיב אֶת־הָעָם הַזֶּה דָּבָר
  choice: a responder a este povo
  rationale: Literalmente, a construção fala em “responder a este povo uma palavra”, expressão hebraica que significa dar-lhe uma resposta. A formulação escolhida é clara e idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas correntes no Brasil. “Anciãos” preserva o termo institucional tradicional; “servido na presença de” torna explícito o sentido cortesão do idioma hebraico. A repetição literal de “palavra” foi evitada por não acrescentar conteúdo em português.
