  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: pt
  text: O rei respondeu duramente ao povo e abandonou o conselho dos anciãos que o haviam aconselhado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O qal de ענה, com referente humano, significa “responder”; a escolha mantém a ligação narrativa com o pedido anterior do povo.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido se refere ao rei já conhecido no contexto.
- source_word: הָעָם
  choice: ao povo
  rationale: עָם designa aqui o povo de Israel que se apresentou ao rei; a preposição “a”, exigida naturalmente por “responder” em português, contrai-se com o artigo.
- source_word: קָשָׁה
  choice: duramente
  rationale: A forma funciona adverbialmente e descreve a maneira severa da resposta do rei; “duramente” é claro, natural e digno.
- source_word: וַיַּעֲזֹב
  choice: rejeitou
  rationale: עזב pode significar deixar, abandonar ou pôr de lado. No contexto, “rejeitou” comunica com naturalidade que o rei decidiu não seguir o conselho.
- source_word: עֲצַת
  choice: o conselho
  rationale: עֵצָה denota conselho ou orientação resultante de deliberação, especialmente apropriado no contexto da corte real.
- source_word: הַזְּקֵנִים
  choice: dos anciãos
  rationale: זְקֵנִים indica os homens mais velhos que exerciam uma função reconhecida de conselheiros; “anciãos” preserva essa dimensão social e política.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: que o haviam aconselhado
  rationale: A oração relativa identifica os anciãos como aqueles que deram conselho ao rei. O mais-que-perfeito composto deixa clara a anterioridade desse conselho em relação à rejeição.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo narrativo hebraico sem arcaísmos. “Anciãos” mantém o papel institucional dos זְקֵנִים; “duramente” expressa a força de קָשָׁה de modo corrente.
