base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: pt
  text: 'E a palavra de Deus veio a Semaías, o homem de Deus, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי דְּבַר ... אֶל
  choice: a palavra ... veio a
  rationale: A fórmula profética hebraica indica que uma comunicação divina foi dirigida a alguém. Esta construção preserva a expressão bíblica tradicional e soa natural em português.
- source_word: דְּבַר
  choice: palavra
  rationale: No contexto de revelação divina, o termo designa uma comunicação ou mensagem; “palavra” preserva melhor a forma e a ressonância da expressão hebraica.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O texto traz אֱלֹהִים, referindo-se ao Deus de Israel, e não o nome divino YHWH; por isso, não se traduz por “SENHOR”.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Expressão titular que identifica Semaías em sua função profética; em português, a construção sem artigo é natural como aposto.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente a fala divina do versículo seguinte e mantém a ligação discursiva do hebraico.
theological_decisions:
- issue: Tradução de אֱלֹהִים na fórmula de revelação
  choice: Deus
  alternative: o SENHOR
  rationale: A tradução segue o termo efetivamente presente no texto massorético, אֱלֹהִים, sem harmonizá-lo com a fórmula mais frequente que emprega YHWH.
translation_notes:
  register: Português moderno, claro e digno, com manutenção do conhecido idioma profético “a palavra de Deus veio a”. “Então” representa o valor narrativo de וַיְהִי sem recorrer à forma mais pesada “e aconteceu que”.
