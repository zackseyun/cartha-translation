translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “no terceiro dia” foi mantida por corresponder à repetição enfática do hebraico. Não se reproduziu a nota da camada inglesa porque ela não apresenta uma alternativa textual ou lexical pertinente ao ponto em que foi marcada.
