  terminology: “Jeroboão” e “Roboão” são formas portuguesas estabelecidas. “Todo o povo”, “rei” e “Voltem a mim” são escolhas consistentes, compreensíveis e adequadas ao registro bíblico sem arcaísmo desnecessário.
