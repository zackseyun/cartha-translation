  source_fidelity: 'O texto traduz com fidelidade todos os elementos relevantes do hebraico: a vinda de Jeroboão e de todo o povo a Roboão, a indicação temporal repetida e a referência à instrução prévia do rei. “Foram até Roboão” é uma opção idiomática legítima para וַיָּבֹאוּ אֶל, embora “vieram a Roboão” também fosse possível. O mais-que-perfeito em “havia dito” representa adequadamente a anterioridade da fala do rei.'
