base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: pt
  text: 'Assim, Jeroboão e todo o povo foram até Roboão no terceiro dia, conforme o rei lhes havia dito: “Voltem a mim no terceiro dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: foram
  rationale: בוא pode significar “vir” ou “ir”, conforme o ponto de vista. “Foram até Roboão” expressa naturalmente o movimento em direção ao rei no contexto narrativo.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: Tradução direta e natural de עָם, referindo-se coletivamente aos que haviam apresentado o pedido ao rei.
- source_word: אֶל־רְחַבְעָם
  choice: até Roboão
  rationale: אֶל indica movimento em direção a uma pessoa; com “foram”, “até Roboão” é idiomático em português.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Preserva a expressão temporal hebraica em formulação portuguesa corrente.
- source_word: כַּאֲשֶׁר דִּבֶּר הַמֶּלֶךְ
  choice: conforme o rei lhes havia dito
  rationale: “Conforme” comunica a correspondência exata entre a ação e a instrução anterior; o mais-que-perfeito composto explicita a anterioridade da fala. O pronome “lhes” fica implícito no contexto hebraico e torna a frase natural em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem diretamente a citação e evitam o pouco natural “dizendo” após “havia dito”, sem perda de conteúdo.
- source_word: שׁוּבוּ אֵלַי
  choice: Voltem a mim
  rationale: שׁוּב expressa retorno; “Voltem a mim” mantém o imperativo plural e o registro digno, próximo da forma hebraica.
