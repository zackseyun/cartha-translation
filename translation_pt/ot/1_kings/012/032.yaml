  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: pt
  text: Jeroboão celebrou uma festa no oitavo mês[a], no décimo quinto dia do mês, como a festa que se celebrava em Judá, e subiu ao altar[b]. Assim fez em Betel, oferecendo sacrifícios aos bezerros que havia feito; e designou em Betel os sacerdotes dos lugares altos que havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A festa celebrada em Judá provavelmente era a Festa das Cabanas (ou dos Tabernáculos), realizada no décimo quinto dia do sétimo mês; Jeroboão marcou sua festa rival para um mês depois.
    reason: cross_reference
  - marker: b
    text: 'Ou: “subiu sobre o altar”. A expressão hebraica pode ser traduzida de forma mais literal, mas, neste contexto, pode indicar a subida ou aproximação ao altar para oficiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: celebrou uma festa
  rationale: A combinação de עשה com חג significa idiomaticamente realizar ou celebrar uma festa. “Celebrou uma festa” é natural em português e preserva o caráter cultual do evento.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: no oitavo mês
  rationale: Reprodução direta e natural da expressão temporal hebraica.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: no décimo quinto dia do mês
  rationale: Forma corrente em português para a fórmula hebraica de data.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: como a festa que se celebrava em Judá
  rationale: Mantém a comparação explícita sem identificar pelo nome uma festa que o versículo não nomeia. O verbo “se celebrava” explicita naturalmente a elipse do hebraico sem acrescentar conteúdo substantivo.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: e subiu ao altar
  rationale: A expressão pode indicar subir ou aproximar-se do altar para oficiar. “Ao altar” é idiomático em português e evita sugerir necessariamente que Jeroboão pisou na superfície do altar; a alternativa mais literal é registrada em nota.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: Assim fez em Betel
  rationale: כֵּן assinala correspondência com a ação precedente. “Assim fez” preserva a concisão e o tom narrativo.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: sacrificando aos bezerros
  rationale: O infinitivo expressa propósito ou ação associada. O gerúndio produz uma ligação clara em português e mantém os bezerros como destinatários do sacrifício.
- source_word: הָעֲגָלִים
  choice: os bezerros
  rationale: Tradução literal do substantivo. O contexto evidencia seu caráter idolátrico, sem necessidade de inserir “ídolos” no texto.
- source_word: וְהֶעֱמִיד
  choice: e estabeleceu
  rationale: No contexto de pessoal cultual, “estabeleceu” comunica a colocação formal dos sacerdotes em sua função sem forçar a ideia específica de nomeação nem reduzi-la a mero posicionamento físico.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: os sacerdotes dos lugares altos
  rationale: “Lugares altos” é a designação tradicional e semanticamente adequada para os santuários locais chamados בָּמוֹת.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia feito
  rationale: Preserva a repetição do hebraico e atribui ao próprio Jeroboão tanto a fabricação dos bezerros quanto o estabelecimento dos lugares altos.
theological_decisions:
- issue: Identificação da “festa que se celebrava em Judá”
  choice: Manter a referência genérica no texto principal.
  alternative: Identificá-la explicitamente como a Festa das Cabanas ou dos Tabernáculos.
  rationale: A data e o contexto apontam fortemente para a Festa das Cabanas, mas o hebraico deste versículo não a nomeia. A provável identificação fica na nota, sem eliminar a reserva do texto.
- issue: Avaliação religiosa das ações de Jeroboão
  choice: Traduzir de modo descritivo, usando “bezerros” e “sacerdotes dos lugares altos”.
  alternative: Acrescentar no texto principal termos avaliativos como “ídolos” ou “sacerdotes ilegítimos”.
  rationale: A narrativa mais ampla condena o culto instituído por Jeroboão, mas este versículo descreve suas ações sem esses qualificativos. A tradução deixa a avaliação decorrer do contexto.
- issue: Sentido de subir ao altar
  choice: Usar “subiu ao altar” no texto e preservar a leitura espacial mais literal em nota.
  alternative: Traduzir “subiu sobre o altar”.
  rationale: A preposição עַל admite a formulação mais literal “sobre”, mas a expressão cultual pode referir-se à aproximação ou subida até o altar para oficiar. A nota mantém aberta a possibilidade formal do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “Jeroboão”, “Judá” e “Betel” nas formas bíblicas correntes. Mantém a repetição deliberada de “que havia feito” e evita linguagem denominacional ou condenatória acrescentada.
