revisions:
- from: Assim, o rei não deu ouvidos ao povo, pois essa reviravolta[a] vinha de Yahweh, a fim de confirmar a palavra que Yahweh havia falado por meio de Aías, o silonita,[b] a Jeroboão, filho de Nebate.
  to: Assim, o rei não deu ouvidos ao povo, pois havia uma circunstância da parte de Yahweh, a fim de estabelecer sua palavra, que Yahweh havia falado por meio de Aías, o silonita,[a] a Jeroboão, filho de Nebate.
  rationale: A revisão substitui “essa reviravolta” por “uma circunstância da parte de Yahweh”, preservando a amplitude de סִבָּה e a atribuição textual da situação a Yahweh, sem especificar a mecânica da causalidade divina. Também emprega “estabelecer sua palavra”, equivalente mais direto de הָקִים com “palavra”. A nota lexical anterior deixa de ser necessária, pois a tradução não seleciona uma nuance restrita que exija alternativa; a nota de idioma para “por meio de” permanece ancorada no ponto pertinente.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:28:55Z'
