source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: pt
  text: Assim, o rei não deu ouvidos ao povo, pois havia uma circunstância da parte de Yahweh, a fim de estabelecer sua palavra, que Yahweh havia falado por meio de Aías, o silonita,[a] a Jeroboão, filho de Nebate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Aías, o silonita”, expressão que significa “por meio de Aías, o silonita”.'
    reason: source_idiom
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: deu ouvidos a
  rationale: Neste contexto, o verbo com אֶל indica acolher ou atender ao pedido, não apenas ouvir sons. A expressão portuguesa comunica naturalmente a recusa do rei em atender ao povo.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente corrente e abrangente para o grupo de israelitas que apresentou o pedido ao rei.
- source_word: סִבָּה
  choice: reviravolta
  rationale: O substantivo pode indicar causa, motivo ou mudança no curso dos acontecimentos. “Reviravolta” se ajusta à narrativa e mantém a ideia de um desdobramento providencial sem especificar além do hebraico o mecanismo da causalidade divina.
- source_word: מֵעִם יְהוָה
  choice: vinha de Yahweh
  rationale: A preposição marca fonte ou origem. “Vinha de Yahweh” é natural em português e preserva a atribuição explícita do acontecimento a Deus.
- source_word: לְמַעַן הָקִים
  choice: a fim de confirmar
  rationale: לְמַעַן introduz propósito, e הֵקִים, tendo “palavra” como objeto, pode significar estabelecer, confirmar ou fazer cumprir. “Confirmar” preserva a relação entre o acontecimento e a validade efetiva da palavra profética.
- source_word: דְּבָרוֹ
  choice: a palavra
  rationale: Mantém o idioma bíblico da palavra divina sem estreitar o sentido para “promessa” ou “profecia”.
- source_word: דִּבֶּר
  choice: havia falado
  rationale: O mais-que-perfeito composto deixa claro em português que a fala de Yahweh por meio de Aías antecedeu o acontecimento narrado.
- source_word: בְּיַד
  choice: por meio de
  rationale: A expressão hebraica literalmente diz “pela mão de”, mas aqui funciona como idioma de mediação ou agência. “Por meio de” comunica seu sentido com clareza no português atual.
- source_word: הַשִּׁילֹנִי
  choice: o silonita
  rationale: Reproduz o gentílico hebraico associado a Aías; a vírgula o apresenta naturalmente como aposto em português.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais dos nomes e expressa com clareza o patronímico hebraico.
theological_decisions:
- issue: Causalidade divina e ação humana
  choice: A recusa do rei é narrada como parte de uma reviravolta cuja origem vinha de Yahweh e cujo propósito era confirmar sua palavra anterior.
  alternative: Tratar o acontecimento apenas como permitido por Yahweh, ou declarar que Yahweh causou diretamente a recusa do rei mediante um mecanismo específico.
  rationale: O hebraico atribui explicitamente a סִבָּה a Yahweh e acrescenta uma oração de propósito, mas não explica o modo exato da relação entre a ação divina e a decisão humana. A tradução preserva essa tensão.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa diretamente e de modo consistente, sem substituí-lo por um título.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. “Dar ouvidos” conserva o sentido de atender; “reviravolta” mantém a dimensão narrativa; e “por meio de” traduz com naturalidade o idioma hebraico de agência. Os marcadores foram posicionados junto aos termos efetivamente explicados pelas notas.
