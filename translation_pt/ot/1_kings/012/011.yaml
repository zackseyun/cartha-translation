base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: pt
  text: E agora, meu pai tornou pesado o jugo de vocês, mas eu aumentarei o jugo de vocês. Meu pai disciplinou vocês com chicotes, mas eu os disciplinarei com escorpiões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com chicotes-escorpião”, isto é, chicotes ou açoites especialmente dolorosos; o hebraico diz literalmente “com escorpiões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: tornou pesado
  rationale: O hifil de עמס expressa a imposição de uma carga. Com עֹל (“jugo”), “tornou pesado o jugo” preserva de modo claro e natural a metáfora hebraica.
- source_word: עֹל / עֻלְּכֶם
  choice: jugo
  rationale: Mantém a imagem concreta de submissão e trabalho opressivo, bem como a repetição enfática do hebraico, em vez de reduzi-la ao sentido abstrato de “fardo”.
- source_word: כָּבֵד
  choice: pesado
  rationale: Reproduz o sentido direto do adjetivo e combina naturalmente com a metáfora do jugo; “duro” ou “opressivo” explicariam a implicação em vez de traduzir a palavra.
- source_word: אוֹסִיף עַל
  choice: acrescentarei ao
  rationale: Traduz de perto a construção “acrescentar a/sobre”, preservando a formulação hebraica e deixando que o contexto comunique o agravamento da opressão.
- source_word: יִסַּר / אֲיַסֵּר
  choice: disciplinou / disciplinarei
  rationale: יסר pode indicar disciplinar, corrigir ou castigar. A repetição verbal foi mantida, e “disciplinar” preserva a amplitude lexical sem transformar explicitamente a ameaça em uma categoria judicial.
- source_word: בַּשּׁוֹטִים
  choice: com chicotes
  rationale: שׁוֹט designa chicote ou açoite; “chicotes” é direto, concreto e facilmente compreendido no português atual.
- source_word: בָּעַקְרַבִּים
  choice: com escorpiões
  rationale: O hebraico diz literalmente “escorpiões”. A imagem foi preservada no texto principal, enquanto a possível referência a chicotes especialmente dolorosos é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preservaram-se a metáfora do jugo, as repetições retóricas e a imagem literal dos escorpiões. O pronome “vocês” oferece compreensão ampla e natural; a alternância para “os” na última oração evita repetição excessivamente pesada sem alterar o referente.
