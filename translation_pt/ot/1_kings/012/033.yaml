base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: pt
  text: Ele subiu ao altar que havia feito em Betel, no décimo quinto dia do oitavo mês, no mês que havia concebido em seu próprio coração[a]; realizou uma festa para os filhos de Israel[b] e subiu ao altar para queimar incenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “que havia inventado por conta própria” ou “de sua própria escolha”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”, designação nacional comum para o povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido comum de עלה, “subir”, e sua repetição narrativa no versículo; no contexto, indica a aproximação ou subida ao altar.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente padrão e direto de מִזְבֵּחַ no contexto cultual.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: que havia feito em Betel
  rationale: Reproduz naturalmente a oração relativa e a localização expressa pela preposição בְּ.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: no décimo quinto dia do oitavo mês
  rationale: Forma idiomática em português para a data hebraica, sem perder nenhum de seus elementos.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: no mês que havia idealizado em seu próprio coração
  rationale: “Idealizado” comunica a ideia de conceber ou inventar, enquanto “em seu próprio coração” conserva a força avaliativa do idioma hebraico e a iniciativa pessoal de Jeroboão.
- source_word: וַיַּעַשׂ חָג
  choice: instituiu uma festa
  rationale: No contexto, עשה + חג descreve a realização ou instituição de uma celebração religiosa; esta formulação é natural em português e preserva o caráter deliberado do ato.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Mantém a forma da designação nacional hebraica, embora ela se refira coletivamente ao povo de Israel.
- source_word: לְהַקְטִיר
  choice: para queimar incenso
  rationale: No uso cultual, הקטיר designa fazer subir fumaça sacrificial e frequentemente se refere à queima de incenso; esta é a tradução concisa mais natural no contexto.
theological_decisions:
- issue: A avaliação implícita na expressão sobre a origem do mês festivo
  choice: em seu próprio coração
  alternative: por conta própria; de sua própria escolha
  rationale: A formulação conserva a ideia de que o calendário foi concebido por Jeroboão, e não estabelecido por ordem divina, sem tornar explícita uma interpretação além do texto.
- issue: A designação nacional בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A expressão formal foi preservada por ser uma designação tradicional da nação; a nota esclarece que seu referente é coletivo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. A repetição de “subiu ao altar” foi mantida por refletir a estrutura enfática do hebraico. “Betel” segue a forma corrente em português.
