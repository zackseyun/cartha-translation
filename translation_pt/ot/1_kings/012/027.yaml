source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: pt
  text: Se este povo subir para oferecer sacrifícios na casa de Yahweh, em Jerusalém,[a] o coração deste povo voltará para o seu senhor,[b] Roboão, rei de Judá; eles me matarão e voltarão para Roboão, rei de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando este povo subir...”. A partícula hebraica também pode assumir sentido temporal em certos contextos, mas aqui provavelmente apresenta a condição temida por Jeroboão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para o seu mestre”. O termo hebraico pode indicar um senhor ou mestre; aqui se refere a Roboão, como deixa claro a expressão seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a força condicional do temor de Jeroboão; embora o termo possa ter sentido temporal em certos contextos, aqui a condição temida é a leitura mais adequada.
- source_word: יַעֲלֶה
  choice: subir
  rationale: Mantém o sentido comum de עלה e a expressão tradicional da peregrinação a Jerusalém, com sua nuance topográfica e cultual.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: para oferecer sacrifícios
  rationale: Traduz naturalmente o idiomatismo hebraico de fazer sacrifícios sem alterar seu sentido ritual.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Conserva a imagem hebraica de 'casa', que neste contexto designa o templo, e mantém o nome divino.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: o coração deste povo voltará
  rationale: Preserva a metáfora do coração como centro da lealdade e também a repetição lexical de שׁוב no fim do versículo.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: para o seu senhor
  rationale: A forma hebraica pode significar senhor ou mestre; a aposição seguinte identifica claramente o referente singular como Roboão.
- source_word: וַהֲרָגֻנִי
  choice: eles me matarão
  rationale: Expressa de modo direto, atual e fiel o sentido de הרג.
- source_word: וְשָׁבוּ
  choice: e voltarão
  rationale: Mantém a repetição de שׁוב, reforçando a temida reversão da lealdade política.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' representa diretamente o nome próprio divino sem substituí-lo por um título.
- issue: Sentido de 'o coração voltará'
  choice: preservar a metáfora e a ambiguidade entre disposição interior e lealdade política
  alternative: explicitar como 'este povo voltará a ser leal'
  rationale: O contexto aponta para fidelidade política a Roboão, mas o hebraico formula isso por meio do coração; a tradução não deve eliminar essa dimensão interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva 'casa de Yahweh' e a metáfora do coração, enquanto a pontuação torna clara a sequência do temor de Jeroboão.
