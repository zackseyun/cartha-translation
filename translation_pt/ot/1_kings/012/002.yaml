  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ יָרָבְעָ֣ם בֶּן נְבָ֗ט וְ/הוּא֙ עוֹדֶ֣/נּוּ בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֵּ֥שֶׁב יָרָבְעָ֖ם בְּ/מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: pt
  text: Quando Jeroboão, filho de Nebate, ouviu isso[a] — ele ainda estava no Egito, para onde havia fugido do rei Salomão —, Jeroboão permanecia no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “ouviu”; o objeto está implícito no contexto, provavelmente a notícia mencionada na narrativa ao redor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A construção narrativa com כְּ + infinitivo introduz uma oração temporal. Em português, “Quando ... ouviu” expressa naturalmente essa relação sem acrescentar um marcador temporal inexistente no texto.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português, preservando a identificação filial.
- source_word: שְׁמֹעַ
  choice: ouviu isso
  rationale: O hebraico não explicita o objeto de “ouvir”; “isso” retoma de modo discreto a notícia indicada pelo contexto, sem determinar além do que o texto permite.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: ele ainda estava no Egito
  rationale: A oração circunstancial informa que Jeroboão permanecia no Egito no momento em que ouviu a notícia.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: para onde havia fugido do rei Salomão
  rationale: O relativo remete ao Egito como destino da fuga; o mais-que-perfeito composto deixa clara a anterioridade, e “fugido do rei” traduz idiomaticamente a fuga da presença ou do poder de Salomão.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: continuou morando no Egito
  rationale: ישׁב pode significar morar ou permanecer. Aqui, “continuou morando” transmite a residência continuada e evita a repetição pesada do nome próprio.
