base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/017.yaml
  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: pt
  text: Mas Roboão reinou sobre os israelitas que moravam nas cidades de Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: A expressão literalmente significa “filhos de Israel”, mas aqui funciona como designação nacional. “Os israelitas” comunica esse sentido de modo natural e preciso em português.
- source_word: הַ/יֹּשְׁבִים
  choice: que moravam
  rationale: O particípio de ישׁב indica residência contínua. “Que moravam” é claro, atual e adequado ao contexto narrativo.
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: Mantém diretamente o valor locativo e territorial da expressão hebraica sem acrescentar uma delimitação política não explicitada.
- source_word: וַ/יִּמְלֹךְ
  choice: reinou
  rationale: Neste contexto, מלך descreve o exercício da realeza; “reinou” é a forma portuguesa mais concisa e idiomática.
- source_word: עֲלֵי/הֶם
  choice: sobre
  rationale: 'A preposição expressa domínio régio. Em português, seu complemento é naturalmente o grupo já mencionado: “os israelitas”.'
- source_word: רְחַבְעָם
  choice: Roboão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: וּ
  choice: Mas
  rationale: Embora a conjunção possa ser traduzida por “e”, o contexto estabelece contraste entre a revolta das tribos do norte e os israelitas de Judá que permaneceram sob Roboão; “mas” torna essa relação explícita sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura corrente, com sintaxe simples. A tradução preserva a identificação dessas pessoas como israelitas, embora residissem nas cidades de Judá, sem harmonizar nem explicar além do que o texto afirma.
