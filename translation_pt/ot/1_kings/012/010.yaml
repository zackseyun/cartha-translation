base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: pt
  text: 'Os jovens que haviam crescido com ele lhe disseram: “Assim você dirá a este povo que lhe disse: ‘Seu pai tornou pesado o nosso jugo, mas você, torne-o mais leve para nós.’ Assim você lhes dirá: ‘Meu dedo mínimo é mais grosso que a cintura de meu pai.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: os jovens
  rationale: No contexto, designa os homens da mesma geração de Roboão que cresceram com ele; “jovens” é natural e não sugere crianças.
- source_word: עֻלֵּנוּ
  choice: nosso jugo
  rationale: Preserva a metáfora hebraica para o peso das exigências e do serviço imposto pelo rei.
- source_word: קָטָנִּי
  choice: meu dedo mínimo
  rationale: A expressão elíptica hebraica é tradicionalmente entendida como referência ao menor dedo; a explicitação produz português claro sem perder a imagem comparativa.
- source_word: מָתְנֵי אָבִי
  choice: a cintura de meu pai
  rationale: מָתְנַיִם indica a região dos lombos ou da cintura; “cintura” comunica naturalmente a comparação corporal em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantiveram-se a repetição retórica de “Assim você dirá” e a metáfora do jugo. A fala citada foi organizada com aspas e pontuação naturais em português.
