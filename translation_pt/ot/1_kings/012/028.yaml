base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: pt
  text: 'Então o rei se aconselhou, fez dois bezerros de ouro e disse-lhes: “É demais para vocês subirem a Jerusalém.[a] Aqui estão os seus deuses, ó Israel,[b] que tiraram vocês da terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês já subiram a Jerusalém por tempo suficiente.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Aqui está o seu Deus, ó Israel”. A forma hebraica pode designar Deus no singular, e a frase remete a Êxodo 32:4; neste versículo, porém, os dois bezerros e o verbo no plural favorecem “os seus deuses”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: se aconselhou
  rationale: O nifal de יעץ indica que o rei buscou conselho ou deliberou. “Se aconselhou” é conciso, natural e mantém a ideia de consulta.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: dois bezerros de ouro
  rationale: Reproduz de perto a construção hebraica e conserva a alusão aos bezerros de Êxodo 32.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: É demais para vocês subir a Jerusalém
  rationale: Expressa a leitura segundo a qual a peregrinação era apresentada como um fardo excessivo. A formulação hebraica também pode indicar que o povo já havia subido por tempo suficiente; essa possibilidade é preservada em nota.
- source_word: הִנֵּה
  choice: Aqui estão
  rationale: No contexto, introduz os objetos que o rei apresenta ao povo. “Aqui estão” comunica naturalmente a força dêitica do hebraico e concorda com a leitura plural adotada.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: os seus deuses, ó Israel
  rationale: Embora אֱלֹהִים possa designar o Deus de Israel no singular, os dois bezerros e o verbo plural seguinte favorecem aqui a tradução plural. O vocativo “ó Israel” mantém o tom solene da proclamação.
- source_word: אֲשֶׁר הֶעֱלוּךָ
  choice: que tiraram vocês
  rationale: Em português corrente, “tirar da terra do Egito” comunica com clareza o movimento de libertação expresso pelo causativo hebraico, embora “fizeram vocês subir” seja mais formalmente literal.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém a fórmula hebraica tradicional e a forte evocação do êxodo.
theological_decisions:
- issue: Se אֱלֹהֶיךָ deve ser traduzido no singular ou no plural na proclamação de Jeroboão
  choice: 'plural: “os seus deuses, ó Israel”'
  alternative: 'singular: “o seu Deus, ó Israel”'
  rationale: A forma nominal pode ter referência singular, mas o contexto imediato menciona dois bezerros e emprega o verbo plural הֶעֱלוּ. O plural foi mantido no texto, enquanto a possibilidade singular e a ambiguidade da expressão são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícito o plural de לָכֶם e distingue a fala dirigida ao povo do vocativo coletivo singular “Israel”. “Disse ao povo” explicita o referente contextual de “disse-lhes” sem alterar o sentido.
