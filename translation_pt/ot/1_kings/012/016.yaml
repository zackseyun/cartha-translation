  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: pt
  text: 'Quando todo o Israel viu que o rei não lhes tinha dado ouvidos, o povo respondeu ao rei: “Que parte temos nós em Davi? Não temos herança no filho de Jessé. Às suas tendas, Israel![a] Agora cuide da sua própria casa[b], Davi.” Então Israel foi para as suas tendas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para suas casas, Israel!” O hebraico diz literalmente “às suas tendas”, expressão que aqui convoca o povo a dispersar-se e retirar sua lealdade.'
    reason: lexical_alternative
  - marker: b
    text: '“Casa” também pode ter aqui o sentido de “dinastia”: “Agora cuide da sua própria dinastia, Davi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  choice: Quando todo o Israel viu
  rationale: Mantém o verbo concreto “ver” e a expressão coletiva nacional “todo o Israel”; no contexto, ver também implica reconhecer a recusa do rei.
- source_word: לֹא שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: o rei não lhes tinha dado ouvidos
  rationale: שׁמע com אֶל significa escutar e atender. “Dar ouvidos” expressa naturalmente em português que o rei recusou o pedido, e o mais-que-perfeito composto situa essa recusa antes da reação popular.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: o povo respondeu ao rei
  rationale: Traduz de modo idiomático a construção hebraica literal “fez voltar uma palavra ao rei”.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: Que parte temos nós com Davi?
  rationale: “Parte” preserva a imagem de participação ou porção política, enquanto “com Davi” comunica em português a rejeição de vínculo com sua casa sem reduzir a frase a uma paráfrase.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: Não temos herança no filho de Jessé
  rationale: “Herança” mantém a ressonância de posse e porção tribal; “filho de Jessé” conserva a forma deliberadamente não régia de designar Davi.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: Às suas tendas, Israel!
  rationale: Preserva a expressão histórica literal e seu valor de chamado à dispersão e à retirada da lealdade política. O possessivo “suas” é claro e natural na variedade internacional com legibilidade brasileira.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: Agora cuide da sua própria casa, Davi
  rationale: ראה tem aqui o sentido de ocupar-se ou cuidar. “Casa” mantém aberta a referência tanto à casa real quanto à dinastia; “própria” explicita o contraste enfático implícito na ruptura.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: Então Israel foi para as suas tendas
  rationale: Mantém Israel como sujeito coletivo e repete a imagem das tendas, como no hebraico.
theological_decisions:
- issue: Slogan político contra a casa de Davi
  choice: Apresentar a rejeição da monarquia davídica em linguagem política direta, sem acrescentar julgamento teológico posterior.
  alternative: Intensificar a fala como rejeição messiânica ou da aliança, ou reduzi-la a um conflito meramente doméstico.
  rationale: O versículo narra a revolta histórica contra Roboão e a casa de Davi. A tradução conserva a força da ruptura e a ambiguidade de “casa” sem determinar implicações teológicas além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa é fluida, mas as imagens hebraicas centrais — parte, herança, tendas e casa — foram preservadas. Os marcadores [a] e [b] aparecem no texto principal junto às expressões que explicam.
