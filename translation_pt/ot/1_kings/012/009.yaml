    issue: Formulação interrogativa pouco natural
    rationale: Em português moderno internacional, especialmente para legibilidade brasileira, «O que vocês aconselham?» é a forma mais corrente e clara; «Que vocês aconselham?» é possível em registros limitados, mas menos idiomática.
  - severity: low
    issue: Introdução redundante e pouco idiomática da citação
    rationale: A construção hebraica «falar... dizendo» pode ser traduzida naturalmente por «disse», pois a fala direta subsequente já transmite a função de לֵאמֹר.
  - severity: low
    issue: Âncora da nota distante do termo explicado
    rationale: A nota explica especificamente «jugo»; a âncora deve seguir essa palavra para manter a associação semântica imediata.
