  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: pt
  text: 'E ele lhes disse: “O que vocês aconselham, para que respondamos a este povo, que me disse: ‘Alivie o jugo[a] que seu pai colocou sobre nós’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “jugo” é uma metáfora para o trabalho pesado e as obrigações impostos pelo rei.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Que vocês aconselham
  rationale: Reproduz a pergunta direta pelo conselho presente dos assessores, em português natural e digno.
- source_word: וְנָשִׁיב דָּבָר
  choice: para que respondamos
  rationale: Expressa de modo idiomático a finalidade sugerida pela construção hebraica; literalmente, a expressão fala em ‘responder uma palavra’ ou ‘dar uma resposta’.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o substantivo coletivo singular e o demonstrativo, inclusive seu possível tom de distanciamento.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: que me falou, dizendo
  rationale: Conserva a oração relativa e a fórmula introdutória do discurso, ajustando o verbo ao coletivo singular ‘povo’ em português.
- source_word: הָקֵל
  choice: Alivie
  rationale: O imperativo pede que a carga seja tornada mais leve; ‘alivie’ é atual e combina naturalmente com o sentido metafórico de ‘jugo’.
- source_word: מִן הָעֹל
  choice: o jugo
  rationale: Preserva a imagem concreta do hebraico em vez de reduzi-la simplesmente a ‘fardo’.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: que seu pai colocou sobre nós
  rationale: Mantém a imagem de um jugo colocado sobre o povo e traduz de forma direta a construção נתן על.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe conserva a solenidade narrativa sem arcaísmos. O pronome ‘vocês’ torna explícito o plural dos conselheiros; ‘este povo’ preserva o coletivo e o possível distanciamento do hebraico.
