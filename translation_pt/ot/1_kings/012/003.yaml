  text: וַֽ/יִּשְׁלְחוּ֙ וַ/יִּקְרְאוּ ל֔/וֹ ו/יבאו יָרָבְעָ֖ם וְ/כָל קְהַ֣ל יִשְׂרָאֵ֑ל וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: pt
  text: 'Então mandaram chamá-lo[a]. Jeroboão e toda a assembleia de Israel[b] vieram e falaram a Roboão, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mandaram convocá-lo”. O hebraico diz literalmente que enviaram e o chamaram, no sentido de fazê-lo vir.'
    reason: lexical_alternative
  - marker: b
    text: “Assembleia” também pode ser traduzido por “congregação”; aqui se refere ao corpo reunido de Israel em caráter público e político.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: mandaram chamá-lo
  rationale: A combinação dos dois verbos descreve o envio de alguém para convocar Jeroboão. A expressão portuguesa comunica esse sentido de modo natural e conciso, sem acrescentar um objeto não expresso no hebraico.
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: O plural concorda com Jeroboão e toda a assembleia e mantém a sequência narrativa simples do hebraico.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: e toda a assembleia de Israel
  rationale: קָהָל designa o corpo reunido de Israel. “Assembleia” é claro e adequado ao contexto público e político, sem sugerir necessariamente uma instituição religiosa.
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם
  choice: falaram a Roboão
  rationale: Mantém o verbo “falar” e a direção do discurso indicada por אֶל, preparando a fala direta do versículo seguinte.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: A fórmula hebraica introduz a citação que vem a seguir; “dizendo:” preserva de maneira transparente essa estrutura discursiva.
