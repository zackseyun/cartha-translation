  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: pt
  text: Quando Roboão chegou[a] a Jerusalém, reuniu toda a casa de Judá e a tribo de Benjamim — cento e oitenta mil guerreiros escolhidos[b] — para lutar contra a casa de Israel e devolver o reino a Roboão, filho de Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico consonantal traz uma forma plural, literalmente “chegaram”; pelo contexto, entende-se o verbo no singular, em referência a Roboão.
    reason: textual_note
  - marker: b
    text: Ou “cento e oitenta mil homens selecionados, aptos para a guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: chegou
  rationale: Embora a forma consonantal transmitida pareça plural, Roboão é o sujeito singular, e o verbo seguinte também está no singular. “Chegou a Jerusalém” é natural em português narrativo e expressa o movimento até o destino.
- source_word: וַיַּקְהֵל
  choice: reuniu
  rationale: 'O hifil de קהל tem sentido causativo: fazer reunir ou convocar. “Reuniu” é claro e corrente.'
- source_word: כָּל בֵּית יְהוּדָה
  choice: toda a casa de Judá
  rationale: Mantém a expressão político-coletiva hebraica e seu paralelismo com “casa de Israel” no mesmo versículo.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: a tribo de Benjamim
  rationale: Traduz explicitamente שֵׁבֶט e preserva a identificação tribal.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: cento e oitenta mil
  rationale: Forma numérica natural no português moderno.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: guerreiros escolhidos
  rationale: No contexto de mobilização militar, בָּחוּר indica homens selecionados, enquanto עֹשֵׂה מִלְחָמָה os caracteriza como combatentes. A formulação é concisa e natural.
- source_word: לְהִלָּחֵם עִם
  choice: para lutar contra
  rationale: O contexto é de confronto hostil; “contra” explicita corretamente a relação adversativa.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva o coletivo político e o paralelismo deliberado com “casa de Judá”.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: devolver o reino
  rationale: O hifil de שׁוב expressa fazer voltar ou restituir. “Devolver o reino a Roboão” comunica naturalmente que se pretendia recolocá-lo sob seu domínio.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: a Roboão, filho de Salomão
  rationale: A preposição ל marca o destinatário ou beneficiário da restituição; a aposição com vírgula é idiomática em português.
theological_decisions:
- issue: Sentido político de הַמְּלוּכָה
  choice: o reino
  alternative: a realeza; o domínio real
  rationale: O contexto trata do território e do povo sob o governo de Roboão depois da divisão, mas o termo também pode ressaltar a condição ou autoridade régia. “Reino” é a opção mais natural sem excluir essa nuance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se “casa de Judá” e “casa de Israel” para preservar o paralelismo político do hebraico. Os travessões destacam naturalmente o número e a qualificação das tropas sem alterar a sintaxe do versículo.
