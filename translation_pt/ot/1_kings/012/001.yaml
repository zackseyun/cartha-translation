lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ... foi
  rationale: Expressa naturalmente a sequência narrativa do wayyiqtol hebraico, sem tornar a conjunção excessivamente explícita.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: כִּי
  choice: porque
  rationale: Preserva a relação causal direta entre a ida de Roboão e a reunião de todo o Israel em Siquém.
- source_word: כָל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva do hebraico, que designa o povo reunido em sua capacidade política.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: para fazê-lo rei
  rationale: 'Comunica com clareza o infinitivo causativo de מלך: reconhecer ou estabelecer Roboão como rei.'
theological_decisions:
- issue: Natureza da ação de Israel na entronização
  choice: fazê-lo rei
  alternative: proclamá-lo rei / coroá-lo
  rationale: A formulação preserva a força causativa do hebraico sem especificar um rito de coroação que o texto não menciona nem reduzir o ato a mera proclamação verbal.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural da frase e repetição de “Siquém” preservada como no hebraico.
