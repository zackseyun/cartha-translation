base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: pt
  text: 'E eles[a] lhe disseram: “Se hoje você se fizer servo deste povo, se o servir, lhe responder e lhe falar palavras bondosas, eles serão seus servos para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico escrito traz «ele falou»; a leitura tradicional e o contexto trazem «eles falaram».
    reason: textual_variant
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו לֵאמֹר
  choice: E eles lhe disseram
  rationale: Embora o texto apresentado tenha forma consonantal singular, וידבר, o sujeito contextual são os anciãos (v. 6), e a tradição massorética indica a leitura plural por meio do qere וידברו. A tradução explicita o plural exigido pelo contexto e evita a fórmula hebraica redundante 'falou... dizendo'.
- source_word: עֶבֶד
  choice: servo
  rationale: Preserva a metáfora política e a reciprocidade com עֲבָדִים no fim do versículo, sem a conotação mais estreita de 'escravo' em português atual.
- source_word: וַעֲבַדְתָּם
  choice: servi-lo
  rationale: Mantém a ligação lexical com 'servo' e expressa naturalmente a ideia de prestar serviço ao povo, tratado como coletivo singular em português.
- source_word: וַעֲנִיתָם
  choice: responder-lhe
  rationale: Neste contexto, ענה significa responder à solicitação do povo, e não afligir.
- source_word: דְּבָרִים טוֹבִים
  choice: palavras bondosas
  rationale: Comunica o sentido contextual de palavras favoráveis e conciliadoras; 'boas palavras' seria possível, mas menos natural neste conselho político.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: eles serão seus servos
  rationale: 'Conserva o substantivo e o contraste recíproco: o rei serve o povo agora, e o povo será seu servo depois.'
- source_word: כָּל הַיָּמִים
  choice: para sempre
  rationale: É a forma idiomática natural em português para 'todos os dias' no sentido de continuidade permanente.
- source_word: אִם הַיּוֹם
  choice: Se hoje
  rationale: Retém a ênfase temporal e a urgência da decisão presente.
theological_decisions:
- issue: Metáfora política do rei como servo
  choice: Preservar 'servo/servir' nos dois lados da relação
  alternative: Empregar termos políticos como 'governar em benefício do povo' ou 'ser favorável ao povo'
  rationale: A repetição do campo lexical de עבד produz o contraste central do conselho e não deve ser suavizada nem transformada em formulação doutrinária.
- issue: Número do verbo introdutório
  choice: 'Seguir a leitura plural contextual e massorética: ''eles disseram'''
  alternative: 'Traduzir literalmente a forma escrita singular: ''ele disse'''
  rationale: O antecedente no versículo anterior é 'os anciãos', e o qere tradicional lê o verbo no plural. O plural oferece um texto coerente sem apagar a existência da variante textual, que pode ser registrada em nota quando o aparato editorial comportar variantes.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com colocação pronominal natural e o povo entendido como coletivo singular. 'Palavras bondosas' evita rigidez excessiva, enquanto 'servo/servir' preserva a estrutura retórica hebraica. Nenhum marcador de nota é usado porque esta versão não inclui notas.
