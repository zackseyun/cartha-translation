lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Ele lhes disse
  rationale: Reproduz de modo natural a introdução narrativa e identifica os destinatários, sem necessidade de explicitar o waw consecutivo em português.
- source_word: לְכוּ
  choice: Vão embora
  rationale: O imperativo plural de הלך indica que a delegação deve retirar-se temporariamente da presença do rei; “vão embora” torna esse sentido contextual claro.
- source_word: עֹוד שְׁלֹשָׁה יָמִים
  choice: daqui a três dias
  rationale: No contexto da ordem de voltar, a expressão indica o intervalo de três dias até o retorno. Esta formulação é idiomática em português e evita a possível impressão de que deveriam passar três dias viajando.
- source_word: וְשׁוּבוּ אֵלָי
  choice: e voltem a mim
  rationale: Mantém o imperativo plural de שוב e a direção expressa por אֵלַי. A coordenação simples preserva a sequência das ordens.
- source_word: וַיֵּלְכוּ הָעָם
  choice: Então o povo foi embora
  rationale: “Então” apresenta naturalmente a continuação narrativa; “o povo” conserva o coletivo singular hebraico, e “foi embora” retoma a ordem anterior.
