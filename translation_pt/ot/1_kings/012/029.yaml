  text: וַ/יָּ֥שֶׂם אֶת הָ/אֶחָ֖ד בְּ/בֵֽית אֵ֑ל וְ/אֶת הָ/אֶחָ֖ד נָתַ֥ן בְּ/דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: pt
  text: Pôs um em Betel[a] e o outro em Dã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, um dos dois bezerros mencionados no versículo anterior. Outra tradução possível: “Pôs um bezerro em Betel e o outro em Dã.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Pôs
  rationale: O verbo שׂוּם/שִׂים significa pôr, colocar ou estabelecer. “Pôs” é natural na narrativa e expressa adequadamente a ação locativa.
- source_word: אֶת הָאֶחָד
  choice: um
  rationale: Embora a forma seja literalmente “o um”, ela integra uma construção distributiva que distingue os dois objetos já mencionados; em português, “um” é a formulação idiomática.
- source_word: בְּבֵית אֵל
  choice: em Betel
  rationale: A preposição בְּ tem sentido locativo, e Betel é mantido como nome próprio consagrado.
- source_word: וְאֶת הָאֶחָד
  choice: e o outro
  rationale: Na oposição entre dois elementos, o segundo “o um” hebraico corresponde idiomaticamente a “o outro” em português.
- source_word: נָתַן
  choice: pôs
  rationale: Neste contexto locativo, נָתַן tem o sentido de pôr ou colocar. A repetição de “pôs” é clara e natural em português, sem criar uma diferença semântica indevida entre os verbos hebraicos.
- source_word: בְּדָן
  choice: em Dã
  rationale: A preposição בְּ é vertida diretamente por “em”, e Dã é a forma portuguesa tradicional do topônimo.
theological_decisions:
- issue: Referente de “um” e “o outro”
  choice: Manter implícitos os objetos, remetendo aos dois bezerros mencionados no versículo anterior.
  alternative: “Pôs um dos bezerros em Betel e o outro em Dã.”
  rationale: O antecedente é claro no contexto, mas o hebraico deste versículo não repete o substantivo. A tradução preserva essa elipse, enquanto a nota esclarece o referente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A frase concisa preserva a estrutura distributiva e a elipse do hebraico.
