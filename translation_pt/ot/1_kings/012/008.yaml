base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: pt
  text: Mas ele deixou de lado o conselho que os anciãos lhe haviam dado e consultou os jovens que tinham crescido com ele e estavam diante dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estavam a seu serviço” ou “o assistiam”. A expressão hebraica “estar diante de alguém” pode indicar serviço na corte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: deixou de lado
  rationale: O verbo עזב significa deixar, abandonar ou rejeitar. “Deixou de lado” expressa de modo natural a decisão consciente de não seguir o conselho, sem intensificar indevidamente o hebraico.
- source_word: עֲצַת
  choice: conselho
  rationale: עֵצָה designa conselho, orientação ou plano; aqui se refere à orientação dada ao rei. “Conselho” é claro e adequado ao contexto.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: Embora o termo esteja ligado à idade, neste contexto designa homens mais velhos que atuavam como conselheiros reconhecidos; “anciãos” preserva idade e função social.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: que ... lhe haviam dado
  rationale: Com “conselho”, a formulação idiomática em português é “o conselho que lhe haviam dado”; o mais-que-perfeito composto esclarece que isso ocorreu antes da decisão narrada.
- source_word: וַיִּוָּעַץ
  choice: consultou
  rationale: A forma verbal aqui indica buscar conselho ou consultar. “Consultou” é direta e natural em português, e o objeto pessoal deixa claro com quem o rei se aconselhou.
- source_word: הַיְלָדִים
  choice: os jovens
  rationale: Embora יֶלֶד possa designar criança ou rapaz, estes são contemporâneos do rei que cresceram com ele e participam do ambiente da corte. “Jovens” mantém o contraste com os anciãos sem sugerir crianças.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: que tinham crescido com ele
  rationale: A expressão indica crescimento ou criação em comum. A tradução preserva essa relação e se encaixa naturalmente na sequência narrativa.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: estavam diante dele
  rationale: A tradução mantém a imagem hebraica de estar diante de alguém. Como essa expressão também pode indicar serviço ou assistência na corte, a nota registra o sentido funcional possível sem o impor ao texto.
