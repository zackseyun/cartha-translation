base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: pt
  text: E isso se tornou pecado, e o povo foi perante um deles até Dã[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “diante do um”. A expressão provavelmente se refere a um dos dois bezerros que Jeroboão colocou, especialmente ao que estava em Dã.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: se tornou
  rationale: 'Com לְחַטָּאת, o verbo expressa resultado ou mudança de condição: aquilo veio a ser pecado.'
- source_word: הַדָּבָר הַזֶּה
  choice: isso
  rationale: Retoma de modo natural, em português, o arranjo cultual descrito nos versículos anteriores, sem acrescentar uma caracterização ausente do hebraico.
- source_word: לְחַטָּאת
  choice: pecado
  rationale: Neste contexto, חַטָּאת designa pecado, não oferta pelo pecado; a formulação mantém o substantivo e a condenação concisa da narrativa.
- source_word: וַיֵּלְכוּ הָעָם
  choice: o povo foi
  rationale: הלך indica movimento no relato. O singular coletivo é idiomático em português.
- source_word: לִפְנֵי
  choice: para se apresentar diante de
  rationale: A expressão conserva a ideia espacial e cultual de estar diante de alguém ou algo, enquanto a construção final evita uma formulação artificial em português.
- source_word: הָאֶחָד
  choice: um deles
  rationale: O hebraico traz literalmente 'o um', com o substantivo elíptico. 'Um deles' mantém a referência implícita aos dois bezerros sem inserir 'bezerro' no texto principal.
- source_word: עַד דָּן
  choice: até Dã
  rationale: עַד marca o limite do deslocamento, e Dã é o destino geográfico mencionado.
theological_decisions:
- issue: Natureza do pecado no culto instituído por Jeroboão
  choice: O arranjo se tornou pecado.
  alternative: O arranjo se tornou ocasião de pecado.
  rationale: O contexto condena o culto, mas o versículo não desenvolve uma categoria doutrinária mais específica. A tradução preserva a afirmação direta do texto.
- issue: Referente de הָאֶחָד, 'o um'
  choice: '''um deles'' remete provavelmente a um dos dois bezerros, em especial ao que estava em Dã.'
  alternative: Explicitar 'um dos bezerros' no texto principal.
  rationale: Como o substantivo está omitido no hebraico, a tradução mantém certa elipse e deixa a identificação provável para a nota, sem eliminar a concisão incomum do original.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe natural. A ordem foi ajustada para ligar claramente o deslocamento até Dã à apresentação diante de 'um deles', enquanto a nota registra a formulação elíptica e incomum do hebraico.
