base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: pt
  text: 'Diga a Roboão, filho de Salomão, rei de Judá, e a toda a casa de Judá e Benjamim, e ao restante do povo, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: Fale
  rationale: Imperativo de אמר que ordena a transmissão de uma mensagem. “Fale com” é natural em português e mantém o caráter direto da ordem.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Roboão, filho de Salomão
  rationale: Emprega as formas tradicionais dos nomes bíblicos em português e traduz diretamente a relação de filiação.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e idiomática do título real em relação de construção com Judá.
- source_word: כָּל בֵּית יְהוּדָה
  choice: toda a casa de Judá
  rationale: Preserva a expressão coletiva e político-comunitária do hebraico, sem reduzi-la simplesmente ao território.
- source_word: וּבִנְיָמִין
  choice: e com Benjamim
  rationale: O nome da tribo aparece de modo independente no hebraico; a repetição de “com” torna clara em português sua função como destinatário.
- source_word: וְיֶתֶר הָעָם
  choice: e com o restante do povo
  rationale: Mantém o sentido básico de יֶתֶר, “restante”, e de הָעָם, “o povo”, sem explicitar “exército”, ideia apenas contextual.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Fórmula introdutória que liga a ordem ao conteúdo da mensagem no versículo seguinte; “dizendo” conserva essa continuidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão tradicional “casa de Judá” foi mantida por seu valor coletivo, e “povo” evita tornar explícita uma referência ao exército que o hebraico apenas pode sugerir pelo contexto.
