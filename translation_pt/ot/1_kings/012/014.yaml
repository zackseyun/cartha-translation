base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: pt
  text: 'Ele lhes falou conforme o conselho dos jovens: “Meu pai tornou pesado o jugo de vocês, e eu aumentarei o jugo de vocês. Meu pai os disciplinou com chicotes, mas eu os disciplinarei com escorpiões[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com chicotes providos de pontas ou farpas”; literalmente, o hebraico diz “com escorpiões”.
    reason: 'Alternativa lexical: explica o possível sentido idiomático sem substituir a imagem literal do hebraico no texto principal.'
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ele lhes falou
  rationale: O piel de דבר significa normalmente “falar”. A formulação preserva o verbo hebraico sem especificar além do texto que se tratava de uma resposta formal.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: conforme o conselho dos jovens
  rationale: עֵצָה designa conselho ou orientação, e כ indica conformidade. “Jovens” identifica naturalmente os conselheiros mais novos, em contraste com os anciãos, sem tratá-los como crianças.
- source_word: הִכְבִּיד
  choice: tornou pesado
  rationale: O hiphil de כבד significa “tornar pesado”. A tradução direta conserva a imagem concreta do jugo.
- source_word: עֻלְּכֶם
  choice: o jugo de vocês
  rationale: עוֹל é literalmente “jugo” e funciona aqui como metáfora do trabalho e domínio impostos. A imagem foi mantida em vez de ser reduzida a “fardo”.
- source_word: אֹסִיף עַל
  choice: aumentarei
  rationale: יסף com על expressa acrescentar ou aumentar. Em português, “aumentarei o jugo” comunica com naturalidade a intensificação pretendida, preservando o objeto metafórico.
- source_word: יִסַּר / אֲיַסֵּר
  choice: disciplinou / disciplinarei
  rationale: יסר pode abranger disciplinar, corrigir ou castigar. “Disciplinar” mantém essa amplitude lexical, embora o contexto indique coerção severa.
- source_word: בַּשּׁוֹטִים
  choice: com chicotes
  rationale: שׁוֹט designa um chicote ou açoite; “chicotes” é claro e corrente.
- source_word: בָּעַקְרַבִּים
  choice: com escorpiões
  rationale: O hebraico traz literalmente o substantivo “escorpiões”. A provável referência a chicotes providos de pontas ou farpas é apresentada em nota, sem eliminar a imagem nem resolver à força sua ambiguidade.
theological_decisions:
- issue: Natureza da imagem punitiva de “escorpiões”
  choice: Manter a imagem literal “escorpiões” no texto principal
  alternative: Traduzir interpretativamente como “chicotes de escorpião”
  rationale: Embora não envolva uma controvérsia doutrinária, o substantivo concreto hebraico admite uma leitura literal e uma provável referência figurada a chicotes farpados. O texto principal conserva a forma da fonte, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A fórmula hebraica “dizendo” foi representada naturalmente por dois-pontos antes da fala direta. A conjunção da primeira declaração foi vertida por “e”, enquanto “mas” explicita o contraste natural na segunda.
