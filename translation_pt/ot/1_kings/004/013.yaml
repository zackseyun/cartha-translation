base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: pt
  text: 'Ben-Geber, em Ramote-Gileade. Sob sua responsabilidade estavam os povoados de Jair[a], filho de Manassés, que ficam em Gileade; sob sua responsabilidade estava também a região de Argobe[b], que fica em Basã: sessenta cidades grandes, cercadas de muralhas e com barras de bronze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os acampamentos de Jair”; por transliteração, “Havote-Jair”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o distrito de Argobe” ou “o território de Argobe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: Ben-Geber
  rationale: No contexto da lista administrativa, a expressão funciona como designação do oficial. A transliteração preserva esse uso nominal, sem resolver à força como simples patronímico.
- source_word: בְּרָמֹת גִּלְעָד
  choice: em Ramote-Gileade
  rationale: A preposição é locativa, e esta forma do topônimo é clara e reconhecível em português bíblico contemporâneo.
- source_word: לֹו
  choice: a ele estavam confiados
  rationale: No contexto administrativo, a construção indica território sob responsabilidade ou jurisdição. A formulação portuguesa evita sugerir necessariamente propriedade pessoal.
- source_word: חַוֺּת יָאִיר
  choice: os povoados de Jair
  rationale: O termo designa assentamentos associados a Jair. “Povoados” é natural e abrangente, enquanto a nota preserva alternativas mais literais e a transliteração tradicional.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: que ficam em Gileade
  rationale: A oração relativa localiza os povoados; o presente funciona naturalmente em descrição geográfica.
- source_word: חֶבֶל אַרְגֹּב
  choice: a região de Argobe
  rationale: חֶבֶל pode indicar uma faixa delimitada, distrito ou território. “Região” é claro e adequado ao contexto, com outras nuances registradas em nota.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: que fica em Basã
  rationale: A oração identifica a localização geográfica de Argobe de modo direto.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: sessenta cidades grandes
  rationale: Mantém o valor concreto de גְּדֹלוֹת, sem especificar se a grandeza é apenas física ou também política.
- source_word: חוֹמָה
  choice: cercadas de muralhas
  rationale: O substantivo singular tem sentido distributivo/coletivo ao descrever as sessenta cidades; a formulação explicita sua condição fortificada.
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: e com trancas de bronze
  rationale: בְרִיחַ designa a barra ou tranca que reforça portas, não os portões propriamente ditos. “Trancas de bronze” preserva a imagem defensiva.
