  text: King Solomon was king over all Israel.
translation:
  language: pt
  text: O rei Salomão era rei sobre todo Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: era
  rationale: A forma de היה introduz a afirmação narrativa e, neste contexto, é expressa naturalmente pelo verbo copulativo no pretérito imperfeito, sem acrescentar um marcador temporal como “então” ou “ora”.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: O substantivo definido funciona como título em aposição ao nome próprio. Em português, “o rei Salomão” é uma construção natural e preserva o artigo hebraico.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: מֶלֶךְ
  choice: rei
  rationale: A segunda ocorrência é predicativa. Manter o substantivo “rei”, em vez de usar apenas “reinava”, preserva a repetição deliberada de מלך.
- source_word: עַל
  choice: sobre
  rationale: No contexto de governo, indica autoridade exercida sobre um povo; “sobre” é o equivalente português direto e natural.
- source_word: כָּל
  choice: todo o
  rationale: Expressa a totalidade de Israel; em português, o artigo é natural antes do nome nacional neste contexto.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa consagrada do nome nacional.
theological_decisions:
- issue: Repetição de מלך na construção hebraica
  choice: 'Preservar as duas ocorrências: “O rei Salomão era rei sobre todo o Israel.”'
  alternative: “Salomão reinava sobre todo o Israel.”
  rationale: A repetição apresenta primeiro o título de Salomão e depois afirma sua condição régia sobre a totalidade de Israel. Mantê-la conserva a ênfase do texto sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “rei” é intencional e reproduz a estrutura enfática do hebraico, embora seja menos variada estilisticamente em português.
