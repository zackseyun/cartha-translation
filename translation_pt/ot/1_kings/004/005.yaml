base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: pt
  text: Azarias, filho de Natã, estava encarregado dos governadores, e Zabude, filho de Natã, era sacerdote[a] e amigo do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “ministro principal” ou “conselheiro real”; neste contexto da corte, a palavra traduzida por “sacerdote” pode designar um alto oficial.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: Azarias
  rationale: Adota a forma tradicional e reconhecível em português para o nome hebraico, cuja terminação -yahu não costuma ser reproduzida integralmente na tradição portuguesa.
- source_word: בֶן
  choice: filho de
  rationale: Equivalente normal em português para indicar filiação em listas administrativas e genealógicas.
- source_word: עַל
  choice: estava encarregado de
  rationale: Neste contexto administrativo, a preposição indica autoridade ou supervisão; a formulação é natural em português e explicita essa relação sem acrescentar um cargo específico.
- source_word: הַנִּצָּבִים
  choice: os governadores
  rationale: O termo designa oficiais nomeados para exercer autoridade administrativa; “governadores” comunica de modo claro sua função no sistema de Salomão.
- source_word: זָבוּד
  choice: Zabude
  rationale: Transliteração adaptada às convenções ortográficas e à pronúncia corrente do português.
- source_word: כֹּהֵן
  choice: sacerdote
  rationale: Preserva o sentido lexical básico do hebraico. A possível acepção de alto oficial da corte é registrada em nota, pois o contexto administrativo permite essa leitura sem exigi-la.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: amigo do rei
  rationale: Tradução direta e idiomática da expressão, que também pode indicar um companheiro íntimo ou confidente real.
theological_decisions:
- issue: Sentido de כֹּהֵן em contexto administrativo da corte
  choice: sacerdote no texto principal
  alternative: ministro principal ou conselheiro real
  rationale: O sentido usual da palavra é “sacerdote”, e o contexto não justifica substituir essa leitura por uma interpretação funcional. A possível acepção cortesã é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O ponto e vírgula separa os dois nomes da lista, e a conjunção “e” mantém distintos os dois títulos atribuídos a Zabude. O marcador da nota foi colocado imediatamente após “sacerdote”, termo ao qual a alternativa lexical se refere.
