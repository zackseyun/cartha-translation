  text: וַ/אֲחִישָׁ֖ר עַל הַ/בָּ֑יִת וַ/אֲדֹנִירָ֥ם בֶּן עַבְדָּ֖א עַל הַ/מַּֽס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/006.yaml
  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: pt
  text: e Aisar estava encarregado da casa real[a]; e Adonirão, filho de Abda, estava encarregado dos trabalhos forçados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do palácio” ou “da casa”. O hebraico diz literalmente “sobre a casa”, título da corte que indicava a supervisão da casa real.
    reason: lexical_alternative
  - marker: b
    text: Ou “da prestação obrigatória de trabalho”. O termo hebraico se refere ao trabalho compulsório exigido pelo Estado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִישָׁר
  choice: e Aisar
  rationale: O nome próprio hebraico é transliterado em forma natural para leitores de língua portuguesa; a conjunção prefixada é representada por “e”.
- source_word: עַל הַ/בָּיִת
  choice: estava encarregado da casa real
  rationale: Em uma lista administrativa, עַל indica autoridade ou supervisão. Embora הַבַּיִת signifique literalmente “a casa”, aqui designa a casa do rei, isto é, a administração doméstica ou palaciana; “casa real” preserva essa amplitude melhor que uma referência apenas ao edifício.
- source_word: וַ/אֲדֹנִירָם
  choice: e Adonirão
  rationale: O nome próprio é transliterado segundo uma forma portuguesa clara, e a conjunção hebraica é expressa por “e”.
- source_word: בֶּן עַבְדָּא
  choice: filho de Abda
  rationale: Tradução direta da fórmula patronímica que identifica o oficial.
- source_word: עַל הַ/מַּס
  choice: estava encarregado dos trabalhos forçados
  rationale: No contexto da administração real, מַס se refere à prestação compulsória de trabalho ao Estado, não simplesmente a imposto. A expressão escolhida é clara e corrente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe administrativa clara. “Casa real” mantém a ambiguidade entre a residência palaciana e sua administração; as notas registram as alternativas literais. Os marcadores aparecem junto às expressões correspondentes e em ordem alfabética.
