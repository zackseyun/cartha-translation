- source_word: בְּ/אָשֵׁר
  choice: em Aser
  rationale: Mantém o sentido básico da preposição ב e identifica o território administrativo sem explicitar além do hebraico a ideia de autoridade sobre ele.
- source_word: וּ/בְעָלֽוֹת
  choice: e Bealote
  rationale: Trata a forma como um segundo topônimo e preserva o estilo conciso da lista, sem inserir uma preposição que não se repete no hebraico.
