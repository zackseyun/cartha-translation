  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: pt
  text: Eliorefe e Aías, filhos de Sisa[c], eram secretários[a]; Josafá, filho de Ailude, era o encarregado dos registros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escribas»; o termo hebraico se refere aqui a funcionários reais encarregados da escrita e da documentação.
    reason: lexical_alternative
  - marker: b
    text: Ou «cronista»; tratava-se de um funcionário da corte que mantinha registros e levava assuntos à atenção do rei.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: «filhos de Sisa». A passagem paralela em 2 Samuel 8:17 traz uma forma relacionada do nome, frequentemente transliterada «Savsa».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: Eliorefe
  rationale: Nome próprio transliterado segundo formas correntes em português, preservando a identificação hebraica.
- source_word: וַאֲחִיָּה
  choice: e Aías
  rationale: O waw foi traduzido por «e»; o nome recebeu a forma portuguesa tradicional e legível.
- source_word: בְּנֵי שִׁישָׁא
  choice: filhos de Sisa
  rationale: Tradução direta da relação filial e transliteração da forma do nome presente no texto massorético deste versículo.
- source_word: סֹפְרִים
  choice: secretários
  rationale: No contexto da administração real, designa funcionários encarregados da escrita e de documentos; «secretários» comunica essa função melhor que o mais amplo «escribas» e a distingue do cargo seguinte.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: בֶּן אֲחִילוּד
  choice: filho de Ailude
  rationale: Tradução natural da designação de filiação, com transliteração portuguesa do nome.
- source_word: הַמַּזְכִּיר
  choice: o encarregado dos registros
  rationale: Expressa em linguagem atual o cargo palaciano ligado à preservação de registros e à apresentação de assuntos ao rei, sem confundi-lo com os secretários mencionados antes.
