base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: pt
  text: Aimaás[a], em Naftali; ele também tomou Basemate, filha de Salomão, por mulher.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre Naftali” ou “para Naftali”; a preposição hebraica pode indicar o território atribuído a Aimaás nesta lista de administradores distritais.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “tomou Basemate, filha de Salomão, por mulher” é uma fórmula comum que significa que ele se casou com ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: Aimaás
  rationale: Nome próprio transliterado segundo a forma portuguesa corrente, preservando a identificação hebraica.
- source_word: בְּנַפְתָּלִי
  choice: em Naftali
  rationale: A preposição בְ com o nome tribal ou geográfico indica aqui o território da jurisdição do oficial; “em Naftali” mantém o sentido locativo sem precisar além do hebraico.
- source_word: גַּם הוּא
  choice: ele também
  rationale: Reproduz de modo natural o valor aditivo da expressão hebraica.
- source_word: לָקַח
  choice: tomou
  rationale: Mantém o verbo hebraico dentro da expressão idiomática matrimonial “tomou ... por mulher”.
- source_word: בָּשְׂמַת
  choice: Basemate
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: בַּת שְׁלֹמֹה
  choice: filha de Salomão
  rationale: Reproduz diretamente a relação filial expressa pela cadeia construta hebraica.
- source_word: לְאִשָּׁה
  choice: por mulher
  rationale: Completa a expressão idiomática hebraica de casamento de forma digna e inteligível em português.
