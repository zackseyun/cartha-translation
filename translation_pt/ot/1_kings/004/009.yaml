  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: pt
  text: Ben-Dequer[a], em Macaz, em Saalbim, em Bete-Semes e em Elom-Bete-Hanã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “filho de Dequer”; aqui, a forma hebraica de nomeação é preservada como a designação pessoal “Ben-Dequer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: Ben-Dequer
  rationale: Nesta lista administrativa, a forma hebraica בֶּן + nome próprio funciona como designação pessoal. A transliteração preserva essa forma, enquanto a nota registra a tradução formal possível.
- source_word: בְּ/מָקַץ
  choice: em Macaz
  rationale: A preposição בְ introduz a localidade vinculada ao oficial; “em” traduz diretamente o sentido locativo sem acrescentar por si só a ideia administrativa de autoridade.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: em Saalbim
  rationale: O nome geográfico é transliterado, e a preposição locativa é mantida em português.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: em Bete-Semes
  rationale: Embora a preposição não seja repetida no hebraico, sua força locativa continua na série. O topônimo é transliterado, não traduzido literalmente.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: em Elom-Bete-Hanã
  rationale: A expressão é entendida como topônimo composto. “Em” explicita em português a força locativa herdada dos elementos anteriores da lista.
