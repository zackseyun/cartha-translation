base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/002.yaml
  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: pt
  text: 'E estes eram os altos funcionários que ele tinha: Azarias, filho de Zadoque, o sacerdote[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Azarias, filho de Zadoque, o sacerdote”. “O sacerdote” pode identificar Zadoque ou ser o título de Azarias. O texto não diz explicitamente “sumo sacerdote”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes eram
  rationale: Preserva a ligação narrativa e introduz naturalmente a lista em português.
- source_word: הַשָּׂרִים
  choice: os altos funcionários
  rationale: No contexto da administração real, שָׂרִים designa governantes ou oficiais de alto escalão; a expressão evita sugerir nobreza hereditária.
- source_word: אֲשֶׁר לוֹ
  choice: que ele tinha
  rationale: Expressa de modo natural a relação de pertença ou associação com a administração de Salomão, sem definir além do texto a função deles.
- source_word: עֲזַרְיָהוּ
  choice: Azarias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶן צָדוֹק
  choice: filho de Zadoque
  rationale: Tradução direta e idiomática da construção filial hebraica.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Reproduz o substantivo definido hebraico sem ampliá-lo para 'sumo sacerdote', título que o texto não explicita.
theological_decisions:
- issue: Referente e força de הַכֹּהֵן ('o sacerdote')
  choice: Manter «Azarias, filho de Zadoque, o sacerdote», preservando a ambiguidade do referente.
  alternative: «Azarias, filho do sacerdote Zadoque» ou «Azarias, filho de Zadoque, era o sacerdote»
  rationale: A sintaxe pode relacionar «o sacerdote» a Zadoque ou apresentá-lo como título de Azarias. Como o hebraico não diz explicitamente «sumo sacerdote», a tradução não resolve a ambiguidade nem amplia o título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Altos funcionários» comunica o contexto administrativo de שָׂרִים; a pontuação e a nota preservam a ambiguidade sintática da frase final.
