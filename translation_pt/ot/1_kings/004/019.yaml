base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: pt
  text: Geber, filho de Uri, na terra de Gileade — a terra de Seom, rei dos amorreus, e de Ogue, rei de Basã. Ele era o único governador que estava naquela terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que governava aquela terra”. O hebraico diz literalmente “que estava na terra”, mas alguns entendem a expressão em sentido administrativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: Geber
  rationale: Nome próprio, transliterado segundo sua forma tradicional e reconhecível em português.
- source_word: בֶּן אֻרִי
  choice: filho de Uri
  rationale: Forma natural em português para o patronímico hebraico.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: na terra de Gileade
  rationale: Mantém explicitamente אֶרֶץ, cuja repetição introduz em seguida uma explicação territorial.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: a terra de Seom, rei dos amorreus, e de Ogue, rei de Basã
  rationale: Conserva a estrutura apositiva e apresenta Gileade como o antigo território associado aos dois reis.
- source_word: נְצִיב
  choice: governador
  rationale: No contexto administrativo de 1 Reis 4, designa um oficial regional nomeado; “governador” é claro e corrente.
- source_word: אֶחָד
  choice: único
  rationale: Expressa naturalmente o valor enfático de “um só” neste contexto, indicando um único governador para a região.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: que estava naquela terra
  rationale: Preserva o sentido locativo mais direto da preposição ב sem convertê-lo silenciosamente em uma relação administrativa.
