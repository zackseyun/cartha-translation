base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: pt
  text: 'Baaná, filho de Ailude: Taanaque e Megido, e toda a região de Bete-Seã, que fica perto de Zaretã, abaixo de Jezreel, desde Bete-Seã até Abel-Meolá, até além de Jocmeão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a região além de Jocmeão”. A expressão hebraica que demarca esse limite é concisa e um tanto difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: Baaná, filho de Ailude
  rationale: Os nomes pessoais são transliterados segundo formas naturais em português; a construção hebraica de filiação é reproduzida diretamente.
- source_word: תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ
  choice: Taanque e Megido
  rationale: Topônimos transliterados em formas correntes e legíveis em português.
- source_word: וְ/כָל בֵּ֣ית שְׁאָ֡ן
  choice: e toda a região de Bete-Seã
  rationale: Neste contexto administrativo, כָל com o topônimo abrange a localidade e seu território; explicitar “região” evita sugerir apenas a cidade.
- source_word: אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה
  choice: que fica perto de Zaretã
  rationale: אֵצֶל expressa proximidade espacial, sem definir uma distância exata.
- source_word: מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל
  choice: abaixo de Jezreel
  rationale: Mantém a expressão topográfica do hebraico sem convertê-la de modo interpretativo em um ponto cardeal.
- source_word: מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה
  choice: desde Bete-Seã até Abel-Meolá
  rationale: Reproduz naturalmente em português os limites territoriais indicados pela construção מן...עד.
- source_word: עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם
  choice: chegando ao outro lado de Jocmeão
  rationale: A expressão limítrofe hebraica é concisa e difícil; esta formulação preserva a noção espacial de עֵבֶר e produz português inteligível sem ocultar a incerteza, registrada em nota.
