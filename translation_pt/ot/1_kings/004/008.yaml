lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes
  rationale: Introduz diretamente a lista dos administradores. Em português, omitir o conectivo inicial produz uma abertura mais natural sem perder a função discursiva do hebraico.
- source_word: שְׁמוֹתָם
  choice: eram os nomes deles
  rationale: A oração hebraica não tem verbo expresso; o imperfeito português situa naturalmente a lista na narrativa passada e preserva a referência explícita a 'deles'.
- source_word: בֶּן חוּר
  choice: Ben-Hur
  rationale: É apresentado no texto principal como nome próprio, conforme o provável uso na lista administrativa, mantendo em nota a possibilidade de ser um patronímico.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: Nesta expressão territorial, הַר designa as terras altas ou a região montanhosa, não necessariamente um monte isolado.
