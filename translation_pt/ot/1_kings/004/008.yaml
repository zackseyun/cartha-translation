  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
translation:
  language: pt
  text: 'E estes eram seus nomes: Ben-Hur[a], na região montanhosa de Efraim;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filho de Hur”, caso a expressão seja entendida como patronímico, e não como nome próprio.
