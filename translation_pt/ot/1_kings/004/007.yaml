base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: pt
  text: Salomão tinha doze administradores sobre todo o Israel[a], que forneciam mantimentos para o rei e sua casa. Cada um tinha a responsabilidade de abastecer o rei e sua casa durante um mês por ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encarregados”, “governadores” ou “oficiais”. O termo hebraico designa de maneira ampla administradores nomeados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: Salomão tinha
  rationale: O לְ marca posse ou relação dativa neste contexto; em português natural, essa construção é expressa por “Salomão tinha”. O וְ funciona como ligação narrativa e não precisa ser vertido mecanicamente.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal direto.
- source_word: נִצָּבִים
  choice: administradores
  rationale: O termo designa pessoas nomeadas para uma função administrativa. “Administradores” é claro e não sugere uma autoridade provincial mais específica do que o hebraico exige.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: A preposição עַל, junto ao substantivo administrativo, indica âmbito de autoridade ou responsabilidade.
- source_word: וְכִלְכְּלוּ
  choice: que forneciam mantimentos para
  rationale: Neste contexto, כלכל se refere ao suprimento ou sustento material da corte; a formulação explicita naturalmente o caráter concreto da provisão.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: o rei e sua casa
  rationale: “Casa” preserva a amplitude de בַּיִת, que pode abranger a família, os servos e todo o estabelecimento real, sem reduzi-lo ao edifício.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: durante um mês por ano
  rationale: A expressão indica o período anual de serviço atribuído a cada administrador.
- source_word: יִהְיֶה עַל אֶחָד
  choice: Cada um tinha a responsabilidade
  rationale: Literalmente, a obrigação “estava sobre um”; a tradução comunica de modo idiomático o sentido distributivo da responsabilidade.
- source_word: לְכַלְכֵּל
  choice: de abastecê-los
  rationale: O infinitivo retoma o verbo de provisão anterior. “Abastecer” evita repetição pesada e mantém o sentido de fornecer o necessário.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. “Sua casa” preserva a abrangência institucional do hebraico; o pronome em “abastecê-los” retoma o rei e sua casa.
