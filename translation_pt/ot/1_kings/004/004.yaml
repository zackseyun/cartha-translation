  text: וּ/בְנָיָ֥הוּ בֶן יְהוֹיָדָ֖ע עַל הַ/צָּבָ֑א וְ/צָד֥וֹק וְ/אֶבְיָתָ֖ר כֹּהֲנִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: pt
  text: Benaia, filho de Joiada, estava à frente do exército; e Zadoque e Abiatar eram sacerdotes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo aqui “sacerdotes” em sentido administrativo mais amplo: “altos ministros” ou “principais oficiais”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: estava à frente do exército
  rationale: A construção com עַל indica autoridade ou supervisão. A expressão portuguesa comunica a função sem acrescentar um título militar que o hebraico não explicita.
- source_word: הַצָּבָא
  choice: o exército
  rationale: Neste contexto, צָבָא designa as forças militares organizadas; “exército” é o equivalente moderno mais claro.
- source_word: כֹּהֲנִים
  choice: sacerdotes
  rationale: Este é o sentido normal do termo hebraico e corresponde às funções conhecidas de Zadoque e Abiatar. O possível sentido administrativo mais amplo é preservado em nota.
- source_word: בְנָיָהוּ
  choice: Benaia
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: יְהוֹיָדָע
  choice: Joiada
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
theological_decisions:
- issue: Se כֹּהֲנִים deve ser entendido no sentido cultual ou como designação mais ampla de altos oficiais da corte.
  choice: sacerdotes
  alternative: altos ministros; principais oficiais
  rationale: O sentido lexical comum é “sacerdotes”, e Zadoque e Abiatar são identificados como sacerdotes em outras passagens. O contexto administrativo não exige abandonar esse sentido, embora justifique registrar a alternativa.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas onomásticas tradicionais em português. A formulação “à frente do exército” preserva o caráter administrativo da expressão hebraica sem especificar indevidamente o título de comandante.
