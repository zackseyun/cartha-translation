lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: Ben-Hesede
  rationale: No contexto desta lista administrativa, a expressão funciona provavelmente como nome pessoal. A transliteração preserva essa leitura, enquanto a nota registra a análise formal alternativa, “filho de Hesede”.
- source_word: בָּאֲרֻבּוֹת
  choice: em Arubote
  rationale: A preposição בְּ é locativa (“em”), e o topônimo é transliterado em forma natural para leitores de português.
- source_word: לוֹ
  choice: a ele pertenciam
  rationale: A construção indica a área atribuída ao oficial no contexto administrativo. A formulação preserva o pronome e apresenta com clareza a relação territorial.
- source_word: שֹׂכֹה
  choice: Socó
  rationale: Topônimo transliterado conforme uma forma corrente e legível em português.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: e toda a terra de Héfer
  rationale: אֶרֶץ designa aqui uma região ou território; “terra de Héfer” preserva a expressão hebraica, e “toda” representa כָל.
