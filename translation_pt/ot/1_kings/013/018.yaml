  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: pt
  text: 'E ele lhe disse: “Eu também sou profeta como você, e um anjo[a] me falou pela palavra de Yahweh: ‘Leve-o de volta com você para a sua casa, para que ele coma pão e beba água.’” Mas ele mentiu para ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”. A palavra hebraica pode designar tanto um anjo como um mensageiro humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: profeta
  rationale: Termo corrente e preciso para quem fala como representante de Deus.
- source_word: מַלְאָךְ
  choice: anjo
  rationale: No contexto da alegação de uma revelação recebida pela palavra de Yahweh, “anjo” é uma leitura natural; a amplitude lexical do hebraico é preservada em nota.
- source_word: דִּבֶּר אֵלַי
  choice: me falou
  rationale: Formulação natural em português para comunicação direta, sem alterar o sentido.
- source_word: בִּדְבַר יְהוָה
  choice: pela palavra de Yahweh
  rationale: Preserva o valor instrumental da preposição e a expressão profética do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente pelo Tetragrama.
- source_word: הֲשִׁבֵהוּ
  choice: Leve-o de volta
  rationale: Expressa de modo idiomático a força causativa do hifil de שוב.
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: com você para a sua casa
  rationale: Mantém tanto a companhia quanto o destino indicados no hebraico.
- source_word: וְיֹאכַל לֶחֶם
  choice: para que ele coma pão
  rationale: Comunica a finalidade da ordem e conserva a imagem concreta de comer pão.
- source_word: וְיֵשְׁתְּ מָיִם
  choice: e beba água
  rationale: Mantém o paralelismo e o sentido direto da segunda ação pretendida.
- source_word: כִּחֵשׁ לוֹ
  choice: Mas ele estava mentindo para ele
  rationale: Expõe claramente, como faz o narrador, que a alegação era falsa; o imperfeito perifrástico soa natural no contexto narrativo português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Identidade de מַלְאָךְ
  choice: anjo
  alternative: mensageiro
  rationale: O contexto favorece um mensageiro sobrenatural, mas o substantivo hebraico não determina por si só essa identidade; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala direta conserva a sequência e a concretude do hebraico; a nota preserva a ambiguidade lexical de מַלְאָךְ.
