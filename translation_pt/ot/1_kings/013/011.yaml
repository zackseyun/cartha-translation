base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: pt
  text: Um profeta idoso[a] morava em Betel. Seu filho veio e lhe contou tudo o que o homem de Deus havia feito naquele dia em Betel e as palavras que havia dito ao rei; eles contaram essas coisas ao pai deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certo profeta idoso morava em Betel”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa do singular (“seu filho veio e lhe contou”) para o plural (“eles contaram essas coisas ao pai deles”). Isso pode indicar mais de um filho ou refletir uma irregularidade textual ou narrativa; a tradução preserva essa mudança em vez de uniformizá-la.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: um profeta idoso
  rationale: אֶחָד pode individualizar de modo indefinido ('um certo'), mas o artigo indefinido português já transmite isso naturalmente. 'Idoso' evita a possível conotação depreciativa de 'velho' sem apagar a idade.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: morava em Betel
  rationale: O particípio יֹשֵׁב, neste contexto narrativo, indica residência, não simplesmente a postura de estar sentado.
- source_word: וַיָּבֹא בְנוֹ
  choice: seu filho veio
  rationale: בְנוֹ é morfologicamente singular; a tradução o preserva, sem harmonizá-lo com o plural no fim do versículo.
- source_word: וַיְסַפֶּר לוֹ
  choice: lhe contou
  rationale: O piel de ספר significa contar ou relatar; 'lhe contou' é natural e mantém o destinatário expresso.
- source_word: אֶת כָּל הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה
  choice: tudo o que ... havia feito
  rationale: Embora מַעֲשֶׂה esteja no singular, esta formulação portuguesa transmite naturalmente a totalidade do feito sem a rigidez de 'todo o feito'.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva o título profético tradicional e recorrente nos livros históricos.
- source_word: הַיּוֹם
  choice: naquele dia
  rationale: No relato passado, esta é a equivalência temporal natural de הַיּוֹם.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: e as palavras que havia dito ao rei
  rationale: Mantém דְּבָרִים como 'palavras', distinguindo o pronunciamento profético da ação anteriormente mencionada.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: depois, eles contaram essas coisas ao pai deles
  rationale: Preserva o verbo plural, o objeto plural e o possessivo plural do hebraico. 'Depois' sinaliza em português a retomada narrativa da forma verbal final, sem resolver a irregularidade de número.
