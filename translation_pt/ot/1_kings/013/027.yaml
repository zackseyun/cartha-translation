  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: pt
  text: 'Então ele falou aos seus filhos: “Selem o jumento para mim.” E eles o selaram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ele disse
  rationale: O waw consecutivo faz a narrativa avançar, naturalmente expresso por “Então”; embora דִּבֵּר corresponda literalmente a “falou”, “disse” introduz com naturalidade a fala direta em português.
- source_word: אֶל בָּנָיו
  choice: aos seus filhos
  rationale: O substantivo masculino plural com sufixo de terceira pessoa masculina singular designa os filhos homens do profeta no contexto.
- source_word: לֵאמֹר
  choice: introduzido por dois-pontos
  rationale: O infinitivo que introduz o discurso direto é representado idiomaticamente pela pontuação, evitando a construção pesada “dizendo” sem perda de sentido.
- source_word: חִבְשׁוּ לִי
  choice: Selem ... para mim
  rationale: חבשׁ, quando usado com um jumento, significa colocar-lhe a sela; “para mim” preserva o valor benefactivo de לִי.
- source_word: אֶת הַחֲמוֹר
  choice: o jumento
  rationale: חֲמוֹר é o termo comum para esse animal; “jumento” é claro, atual e amplamente compreensível em português.
- source_word: וַיַּחֲבֹשׁוּ
  choice: E eles o selaram
  rationale: A repetição de חבשׁ é preservada por “selaram”; o pronome “o” retoma naturalmente “o jumento”, embora o objeto esteja implícito no hebraico.
