  yaml_path: translation/ot/1_kings/013/013.yaml
  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: pt
  text: 'E ele disse aos seus filhos: “Selem o jumento para mim.” Então eles selaram o jumento para ele, e ele montou no jumento.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a progressão narrativa do wayyiqtol sem tornar a relação temporal mais específica do que o hebraico.
- source_word: בָּנָיו
  choice: aos seus filhos
  rationale: O substantivo hebraico está no masculino plural e designa especificamente os filhos homens.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: Selem o jumento para mim
  rationale: Neste contexto, חבש significa selar ou preparar um animal para ser montado; a formulação é clara e idiomática em português.
- source_word: הַחֲמוֹר
  choice: o jumento
  rationale: חמור é o termo comum para esse animal; “jumento” é corrente, preciso e amplamente compreensível em português.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: Então eles selaram o jumento para ele
  rationale: Repete o verbo da ordem e mostra naturalmente seu cumprimento; “então” expressa a progressão narrativa sem acrescentar uma relação causal forte.
- source_word: וַיִּרְכַּב עָלָיו
  choice: e ele montou nele
  rationale: רכב על indica montar ou cavalgar sobre o animal. “Montou nele” reproduz com naturalidade a ação e mantém a referência masculina de “jumento”.
