base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: pt
  text: 'E ele disse[a]: “Não posso voltar com você nem ir com você. Não comerei pão nem beberei água com você neste lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, as duas primeiras ocorrências de “com você” estão no feminino, enquanto a ocorrência ligada a comer e beber está no masculino. O português não preserva essa distinção de gênero.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico sem atribuir à conjunção uma força adversativa ou conclusiva não explicitada.
- source_word: לֹא אוּכַל
  choice: Não posso
  rationale: A forma de יכל com negação expressa incapacidade; esta é a formulação portuguesa mais natural e direta.
- source_word: לָשׁוּב
  choice: voltar
  rationale: שׁוב indica voltar ou retornar; “voltar” é corrente e adequado ao contexto.
- source_word: אִתָּךְ
  choice: com você
  rationale: A preposição traz sufixo de segunda pessoa feminina singular. O português não marca gênero em “você”, por isso a distinção é registrada em nota.
- source_word: וְלָבוֹא
  choice: nem ir
  rationale: בוא pode significar vir, ir ou entrar conforme a perspectiva. Aqui designa acompanhar o interlocutor; “ir com você” é natural e não acrescenta a ideia não exigida de entrar.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: Não comerei pão
  rationale: Mantém “pão” literalmente e conserva a formulação recorrente no contexto. O futuro português expressa adequadamente a recusa declarada.
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: nem beberei água
  rationale: “Nem” coordena naturalmente as duas negações em português, mantendo “água” de forma literal.
- source_word: אִתְּךָ
  choice: com você
  rationale: A preposição traz aqui sufixo de segunda pessoa masculina singular, em contraste com as formas femininas anteriores; a nota preserva essa particularidade textual.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Tradução locativa direta e digna, mais próxima da forma hebraica que o simples advérbio “aqui”.
