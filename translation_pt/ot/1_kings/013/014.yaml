  text: וַ/יֵּ֗לֶךְ אַֽחֲרֵי֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יִּ֨מְצָאֵ֔/הוּ יֹשֵׁ֖ב תַּ֣חַת הָ/אֵלָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו הַ/אַתָּ֧ה אִישׁ הָ/אֱלֹהִ֛ים אֲשֶׁר בָּ֥אתָ מִֽ/יהוּדָ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: pt
  text: 'Então ele foi atrás do homem de Deus e o encontrou sentado debaixo do terebinto[a]. Ele lhe perguntou: “Você é o homem de Deus que veio de Judá?” Ele respondeu: “Sou eu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “debaixo do carvalho”. O termo hebraico אֵלָה refere-se mais especificamente ao terebinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: foi atrás de
  rationale: Expressa com naturalidade o movimento de seguir alguém nesse contexto de busca, preservando o sentido concreto do hebraico.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém o título hebraico tradicional e recorrente no relato, sem substituí-lo pela interpretação mais específica “profeta de Deus”.
- source_word: וַיִּמְצָאֵהוּ
  choice: o encontrou
  rationale: É o equivalente direto e natural do verbo מצא na narrativa.
- source_word: יֹשֵׁב
  choice: sentado
  rationale: Indica a postura do homem no momento em que foi encontrado.
- source_word: תַּחַת הָאֵלָה
  choice: debaixo do terebinto
  rationale: אֵלָה designa mais especificamente o terebinto; “debaixo de” é idiomático em português para a posição sob a copa da árvore.
- source_word: הַאַתָּה
  choice: Você é
  rationale: Introduz de modo claro e corrente a pergunta direta de identificação.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: que veio de Judá
  rationale: Preserva a oração relativa e exprime naturalmente a procedência indicada por מִן.
- source_word: אָֽנִי
  choice: Sou eu
  rationale: Reproduz de maneira natural em português a resposta nominal e elíptica “eu”, afirmando a identidade perguntada.
theological_decisions:
- issue: Tradução de אִישׁ הָאֱלֹהִים como título
  choice: homem de Deus
  alternative: profeta de Deus
  rationale: A tradução direta preserva o título reconhecido no texto hebraico e evita restringi-lo interpretativamente a um ofício específico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Você” mantém o diálogo natural; “tere­binto” conserva a precisão botânica, acompanhado de nota com a alternativa tradicional.
