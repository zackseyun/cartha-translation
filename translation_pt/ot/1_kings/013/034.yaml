  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: pt
  text: E esse fato se tornou pecado para a casa de Jeroboão, para eliminá-la e destruí-la da face da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da face do solo”; expressão que indica remoção completa da terra ou do território.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: se tornou
  rationale: 'O wayyiqtol de היה expressa aqui o resultado do que foi narrado: esse fato veio a constituir pecado para a casa de Jeroboão.'
- source_word: בַּדָּבָר הַזֶּה
  choice: esse fato
  rationale: דָּבָר designa aqui o fato ou acontecimento anteriormente narrado, e não apenas uma palavra falada; “fato” é natural em português e mantém a referência ampla.
- source_word: לְחַטַּאת
  choice: pecado
  rationale: A construção indica que o fato se tornou pecado, ou motivo de condenação, para a casa de Jeroboão; “pecado” preserva de modo conciso a formulação hebraica.
- source_word: בֵּית יָרָבְעָם
  choice: a casa de Jeroboão
  rationale: “Casa” conserva a metáfora hebraica, que neste contexto abrange a família e a dinastia; usa-se a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: וּלְהַכְחִיד
  choice: ser eliminada
  rationale: O hifil de כחד comunica fazer desaparecer ou eliminar. A voz passiva em português permite retomar claramente “a casa de Jeroboão” sem inserir um pronome potencialmente ambíguo.
- source_word: וּלְהַשְׁמִיד
  choice: destruída
  rationale: שמד no hifil exprime destruição completa. O termo permanece distinto de “eliminada”, preservando o par enfático de verbos hebraicos.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face da terra
  rationale: A expressão conserva o idioma solene hebraico e comunica a remoção completa da terra ou do território.
theological_decisions:
- issue: Referente dos verbos de eliminação e destruição
  choice: A casa de Jeroboão, isto é, sua linhagem ou dinastia
  alternative: O próprio fato pecaminoso
  rationale: Embora o hebraico deixe o objeto dos infinitivos implícito, “a casa de Jeroboão” é o antecedente sintaticamente mais próximo e se harmoniza com o contexto de juízo dinástico. A construção “levando-a” explicita essa relação sem acrescentar uma afirmação teológica independente.
- issue: Relação expressa pelos infinitivos לְהַכְחִיד e לְהַשְׁמִיד
  choice: 'Resultado ou consequência: “levando-a a”'
  alternative: 'Finalidade: “para eliminá-la e destruí-la”'
  rationale: O לְ pode admitir nuance de finalidade ou resultado. No contexto, a consequência judicial do pecado parece mais natural, mas a tradução evita identificar diretamente um agente e não resolve além do necessário a causalidade teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil. “Casa de Jeroboão” preserva o idioma dinástico bíblico; “da face da terra” mantém a solenidade da expressão hebraica sem soar artificial.
