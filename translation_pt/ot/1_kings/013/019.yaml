  yaml_path: translation/ot/1_kings/013/019.yaml
  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: pt
  text: Então o homem de Deus voltou com ele, comeu pão[a] na casa dele e bebeu água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “comeu pão”, expressão que também pode significar fazer uma refeição. A formulação mais literal foi mantida porque “pão” e “água” são importantes no contexto da narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב אִתּוֹ
  choice: voltou com ele
  rationale: Expressa de modo natural o retorno e o acompanhamento indicados pelo verbo שוב e pela preposição אֵת com sufixo.
- source_word: וַיֹּאכַל לֶחֶם
  choice: comeu pão
  rationale: Mantém a formulação concreta do hebraico. Embora possa significar de modo idiomático fazer uma refeição, “pão” é tematicamente importante no contexto.
- source_word: בְּבֵיתוֹ
  choice: na casa dele
  rationale: Tradução clara da expressão hebraica; no contexto, a casa pertence ao profeta idoso. “Dele” evita a possível leitura reflexiva que “sua” pode ter em português.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: bebeu água
  rationale: Reproduz diretamente a ação e conserva “água”, elemento específico e recorrente na proibição narrada.
theological_decisions:
- issue: Sujeito não expresso no hebraico
  choice: o homem de Deus
  alternative: ele
  rationale: O verbo hebraico traz sujeito implícito. A identificação contextual torna a referência clara em português e evita uma sequência ambígua de dois pronomes masculinos, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa foi preservada; “na casa dele” esclarece a posse sem recorrer ao ambíguo “sua casa”.
