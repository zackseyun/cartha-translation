base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: pt
  text: 'E colocou o cadáver dele em seu próprio túmulo. Então prantearam por ele, dizendo: “Ai, meu irmão!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meu irmão” provavelmente é uma fórmula de lamentação que expressa vínculo ou solidariedade, não necessariamente parentesco biológico.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: colocou
  rationale: O hifil de נוח significa aqui pôr ou depositar algo. “Colocou” é natural em português e mantém o sentido concreto no contexto do sepultamento.
- source_word: נִבְלָתוֹ
  choice: o cadáver dele
  rationale: נְבֵלָה designa o corpo sem vida, com força mais explícita que “corpo”. “Cadáver” preserva essa precisão sem a conotação animal de “carcaça”.
- source_word: בְּקִבְרוֹ
  choice: em seu próprio túmulo
  rationale: קֶבֶר pode ser sepultura ou túmulo. O sufixo possessivo se refere ao túmulo do profeta idoso; “próprio” torna isso claro sem alterar o referente.
- source_word: וַיִּסְפְּדוּ
  choice: prantearam
  rationale: ספד indica prantear ou lamentar uma pessoa morta, muitas vezes mediante uma lamentação formal. “Prantearam” exprime de modo conciso tanto o luto quanto sua manifestação verbal.
- source_word: עָלָיו
  choice: por ele
  rationale: Com ספד, עַל introduz a pessoa que é objeto do pranto. “Por ele” é a construção idiomática natural em português.
- source_word: הוֹי
  choice: Ai
  rationale: הוֹי é uma interjeição de lamento. “Ai” conserva o caráter exclamativo e doloroso sem acrescentar necessariamente a ideia de juízo associada a “ai de”.
- source_word: אָחִי
  choice: meu irmão
  rationale: אָח significa literalmente “irmão” e pode funcionar aqui como expressão convencional de vínculo e solidariedade no lamento. A tradução mantém a imagem familiar do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leve solenidade adequada à narrativa funerária. “Prantearam” foi preferido a “lamentaram” para comunicar claramente o luto pelos mortos. O marcador de nota aparece após toda a fala porque a nota explica a expressão “meu irmão”.
