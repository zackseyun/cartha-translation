  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: pt
  text: E eis que um homem de Deus veio de Judá a Betel pela palavra de Yahweh[a], enquanto Jeroboão estava junto ao altar para queimar incenso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ordem de Yahweh” ou “segundo a palavra de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e Jeroboão estava junto ao altar”. A conjunção hebraica também pode ser traduzida simplesmente por “e”, e a expressão vertida como “junto ao altar” também pode ser entendida como “sobre o altar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva tanto a ligação narrativa de וְ quanto a força apresentativa e vívida de הִנֵּה, em linguagem elevada, mas compreensível.
- source_word: אִישׁ אֱלֹהִים
  choice: um homem de Deus
  rationale: Mantém a expressão hebraica, que designa um mensageiro ou profeta de Deus, sem substituí-la pela interpretação mais específica “profeta”.
- source_word: מִיהוּדָה ... אֶל־בֵּית־אֵל
  choice: de Judá a Betel
  rationale: Expressa diretamente a origem e o destino do movimento; “Betel” é a forma portuguesa consagrada do topônimo.
- source_word: בִּדְבַר יְהוָה
  choice: pela palavra de Yahweh
  rationale: A preposição ב pode indicar que a vinda ocorreu por ordem, autorização ou ação da palavra divina. “Pela palavra” conserva essa amplitude sem explicá-la em excesso.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: enquanto Jeroboão estava
  rationale: O particípio apresenta uma circunstância em andamento. “Enquanto” torna clara a simultaneidade, embora o וְ também possa ser traduzido simplesmente por “e”.
- source_word: עַל הַמִּזְבֵּחַ
  choice: junto ao altar
  rationale: Neste contexto ritual, עַל com o verbo “estar de pé” indica posição junto ao altar, e não necessariamente sobre sua superfície.
- source_word: לְהַקְטִיר
  choice: para queimar incenso
  rationale: No contexto cúltico, o verbo frequentemente descreve a queima de incenso ou a transformação de uma oferta em fumaça; aqui, “queimar incenso” é a leitura contextual mais precisa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente reconhecíveis no Brasil e em outros contextos lusófonos. “E eis que” preserva a vivacidade narrativa do hebraico; “homem de Deus” conserva a formulação tradicional sem interpretação adicional.
