base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: pt
  text: 'Quando o profeta que o havia feito voltar do caminho soube disso, disse: “É o homem de Deus que se rebelou contra a palavra de Yahweh[a]. Por isso, Yahweh o entregou ao leão, que o dilacerou e o matou, conforme a palavra que Yahweh lhe havia falado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se rebelou contra a ordem de Yahweh” ou “desafiou a palavra de Yahweh”. O hebraico diz literalmente “se rebelou contra a boca de Yahweh”.
    reason: Alternativas lexicais e preservação do idiomatismo hebraico.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: o havia feito voltar do caminho
  rationale: Preserva o sentido causativo do Hifil de שׁוב e o motivo narrativo recorrente do caminho, em português claro.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém a designação hebraica tradicional de uma pessoa comissionada por Deus e assegura continuidade com o contexto.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: se rebelou contra a palavra de Yahweh
  rationale: מרה expressa rebeldia, enquanto “boca de Yahweh” é um idiomatismo para sua palavra ou ordem falada. A formulação principal é natural; a imagem literal é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: Yahweh o entregou ao leão
  rationale: “Entregou” comunica naturalmente que o homem foi posto sob o poder do leão, preservando a ação atribuída explicitamente a Yahweh.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: o dilacerou
  rationale: Embora שׁבר signifique literalmente “quebrar”, no contexto de um ataque de leão descreve a destruição violenta do corpo; “dilacerou” é vívido e idiomático.
- source_word: וַיְמִתֵהוּ
  choice: o matou
  rationale: Traduz diretamente o Hifil de מות, “fazer morrer, matar”.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: conforme a palavra que Yahweh lhe havia falado
  rationale: Expressa o cumprimento da palavra divina anteriormente dirigida ao homem de Deus e conserva o verbo de fala do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico apresenta o nome próprio divino; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Sentido do idiomatismo פִּי יְהוָה
  choice: a palavra de Yahweh
  alternative: a boca de Yahweh; a ordem de Yahweh
  rationale: “Palavra” comunica em português a ordem falada à qual o homem desobedeceu, enquanto a nota preserva a forma concreta e as alternativas legítimas do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “caminho” para manter o motivo narrativo, “soube disso” para o objeto implícito de “ouviu” e uma nota breve para explicar o idiomatismo sem tornar o texto principal artificial.
