base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: pt
  text: Enquanto estavam sentados à mesa, aconteceu que a palavra de Yahweh veio ao profeta que o havia trazido de volta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: aconteceu que
  rationale: Reproduz a progressão narrativa do hebraico em português atual, sem recorrer ao arcaico «sucedeu».
- source_word: הֵם יֹשְׁבִים
  choice: enquanto estavam sentados
  rationale: O pronome acompanhado do particípio apresenta uma ação em curso; a construção portuguesa preserva esse valor durativo.
- source_word: אֶל הַשֻּׁלְחָן
  choice: à mesa
  rationale: Com o verbo «sentar», a expressão hebraica indica estar à mesa, provavelmente durante a refeição; esta é a formulação idiomática natural em português.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e o nome divino expresso no texto hebraico.
- source_word: אֶל הַנָּבִיא
  choice: ao profeta
  rationale: Indica naturalmente o destinatário da revelação divina.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: que o havia trazido de volta
  rationale: O hifil de שוב com sufixo masculino singular expressa que o profeta fez o homem de Deus voltar; o mais-que-perfeito composto esclarece que isso ocorreu antes da cena à mesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome da aliança sem substituí-lo por um título.
- issue: Identidade do profeta que recebe a palavra
  choice: o profeta que o havia trazido de volta
  alternative: explicitar «o velho profeta» ou «o homem de Deus»
  rationale: A tradução conserva a referência relativa e a tensão narrativa do original, sem acrescentar identificações que não aparecem explicitamente neste versículo.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência: a oração temporal vem primeiro, seguida do acontecimento principal. Não são necessárias notas de rodapé neste versículo.'
