  - severity: low
    issue: «Seus pais» pode sugerir os progenitores imediatos
    rationale: No contexto funerário, אֲבֹתֶיךָ se refere mais naturalmente aos antepassados da linhagem e ao sepultamento familiar. «Antepassados» evita essa ambiguidade em português contemporâneo.
