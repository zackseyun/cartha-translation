review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a acusação, as ações de comer pão e beber água, e a sentença concreta acerca do cadáver e do sepultamento familiar. Contudo, «Por isso» introduz uma conjunção causal que não está expressa no hebraico; embora a consequência seja contextual, a justaposição deve ser preservada. «Pais» também pode ser lido em português como os progenitores imediatos, enquanto אֲבֹתֶיךָ neste contexto aponta para os antepassados e seu túmulo familiar.
  naturalness: O português é claro e de registro apropriado. «No lugar a respeito do qual ele lhe disse» é compreensível, mas «no lugar sobre o qual ele lhe disse» é mais idiomático sem enfraquecer a ligação do lugar com a ordem.
  terminology: «Cadáver» representa bem נִבְלָתְךָ. «Túmulo de seus antepassados» comunica o sentido de קֶבֶר אֲבֹתֶיךָ com menos ambiguidade moderna do que «túmulo de seus pais». A nota preserva a formulação literal com «pais» e explica seu sentido contextual.
  issues:
