base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: pt
  text: 'mas você voltou, comeu pão e bebeu água no lugar sobre o qual ele lhe disse: “Não coma pão nem beba água”. Seu cadáver não chegará ao túmulo de seus antepassados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “seu cadáver não chegará ao túmulo de seus pais”. Aqui, “pais” designa os antepassados da linhagem familiar.'
    reason: Preserva a expressão literal hebraica e esclarece que “pais”, neste contexto, não se limita necessariamente aos progenitores imediatos.
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: você voltou
  rationale: Expressa naturalmente o retorno indicado por שוב e mantém a acusação direta ao homem de Deus.
- source_word: וַתֹּאכַל לֶחֶם
  choice: comeu pão
  rationale: Conserva o objeto concreto do hebraico e repete a formulação da proibição anterior.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: bebeu água
  rationale: Tradução direta que preserva a repetição verbal da proibição.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: no lugar a respeito do qual ele lhe disse
  rationale: Mantém a relação entre o lugar e a ordem pronunciada, em português claro e formal.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: Não coma pão nem beba água
  rationale: O imperativo negativo é natural em português; “nem” une as proibições sem perder a repetição dos substantivos.
- source_word: נִבְלָתְךָ
  choice: seu cadáver
  rationale: Representa a referência explícita ao corpo morto com a sobriedade e a força do hebraico.
- source_word: לֹא תָבֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: seu cadáver não chegará ao túmulo de seus pais
  rationale: Preserva a imagem hebraica do cadáver que não “chega” ao sepulcro familiar, sem introduzir uma voz passiva ausente do texto.
- source_word: אֲבֹתֶיךָ
  choice: seus pais
  rationale: Mantém o masculino plural e a ideia de antepassados paternos ou da linhagem familiar, embora em português também possa ser entendido no sentido imediato de progenitores.
theological_decisions:
- issue: Natureza da sentença de juízo
  choice: Pronunciamento literal de que o cadáver do homem de Deus não chegará ao túmulo de seus pais
  alternative: Declaração figurada mais ampla de desonra após a morte
  rationale: A formulação hebraica se concentra concretamente no cadáver e no túmulo familiar. A tradução mantém essa imagem sem ampliar suas implicações teológicas.
- issue: Relação lógica da sentença final com a desobediência
  choice: Por isso
  alternative: Justaposição sem conectivo explícito
  rationale: Embora o hebraico não empregue aqui uma conjunção causal separada, a sentença final apresenta a consequência judicial da conduta descrita. O conectivo torna essa relação clara em português sem alterar o conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “pão” e “água” preserva a força retórica da acusação. O marcador [a] aparece no texto principal.
