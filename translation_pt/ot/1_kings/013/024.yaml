  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: pt
  text: Ele partiu, e um leão o encontrou no caminho e o matou. Seu cadáver estava jogado no caminho[a]; o jumento estava parado ao lado dele, e o leão estava parado ao lado do cadáver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu cadáver jazia lançado no caminho”. O particípio passivo hebraico ressalta que o corpo havia sido lançado ou derrubado ali, e não apenas que estava deitado no local.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Ele partiu
  rationale: O wayyiqtol faz a narrativa avançar; “partiu” expressa naturalmente que ele prosseguiu viagem, sem acrescentar uma relação causal.
- source_word: וַיִּמְצָאֵהוּ
  choice: o encontrou
  rationale: מצא significa normalmente “encontrar”; a formulação direta preserva o encontro súbito na narrativa.
- source_word: אַרְיֵה
  choice: um leão
  rationale: É a primeira menção do animal neste episódio, por isso o sentido é indefinido.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: “Caminho” é natural no contexto de viagem e permite conservar a repetição hebraica.
- source_word: וַיְמִיתֵהוּ
  choice: o matou
  rationale: O hifil de מות indica causar a morte; “matou” é a equivalência clara e idiomática.
- source_word: נִבְלָתוֹ
  choice: seu cadáver
  rationale: נבלה designa o corpo morto; “cadáver” é preciso, digno e adequado para uma pessoa.
- source_word: מֻשְׁלֶכֶת
  choice: estava jogado
  rationale: O particípio passivo de שלך descreve o cadáver em estado resultante, lançado ou derrubado ali; “estava jogado” preserva essa força com naturalidade em português.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: o jumento estava parado ao lado dele
  rationale: O particípio עֹמֵד descreve uma cena estática e contínua; o pronome retoma “cadáver” segundo o gênero natural do substantivo em português.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: e o leão estava parado ao lado do cadáver
  rationale: A repetição de “cadáver” acompanha o substantivo explícito no hebraico, e “estava parado” representa o valor descritivo do particípio.
