  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: pt
  text: 'E naquele dia ele deu um sinal[a], dizendo: “Este é o sinal de que Yahweh falou: eis que o altar se partirá, e as cinzas[b] que estão sobre ele serão derramadas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prodígio” ou “presságio” (hebraico מוֹפֵת).
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode designar mais especificamente as cinzas gordurosas ou os resíduos dos sacrifícios.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: ele deu
  rationale: O verbo נתן significa “dar, pôr, estabelecer”; com מוֹפֵת, “deu um sinal” expressa naturalmente a apresentação de um sinal confirmador.
- source_word: מוֹפֵת
  choice: sinal
  rationale: O termo pode indicar sinal, prodígio ou presságio. Neste contexto, trata-se de uma ocorrência que confirma a palavra profética; “sinal” preserva essa função sem ampliar indevidamente o aspecto miraculoso.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh falou
  rationale: O perfeito hebraico se refere à palavra divina já pronunciada. O pretérito perfeito é direto e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: הִנֵּה
  choice: expresso pela apresentação direta da previsão
  rationale: A força de הִנֵּה chama atenção para o sinal anunciado. Em português moderno, a construção direta após os dois-pontos comunica essa ênfase sem o arcaísmo de “eis que”.
- source_word: הַמִּזְבֵּחַ נִקְרָע
  choice: o altar se partirá
  rationale: O nifal apresenta o altar sendo rompido. O futuro decorre do caráter preditivo do sinal, e “se partirá” é claro e idiomático.
- source_word: וְנִשְׁפַּךְ הַדֶּשֶׁן
  choice: as cinzas serão derramadas
  rationale: O nifal de שׁפך tem sentido passivo, “ser derramado”. “Cinzas” é a forma comum e inteligível, enquanto a nuance sacrificial mais específica é registrada em nota.
- source_word: אֲשֶׁר עָלָיו
  choice: que estão sobre ele
  rationale: Mantém explicitamente a relação das cinzas com o altar e conserva o registro digno do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino; “Yahweh” preserva sua condição de nome pessoal sem substituí-lo por um título.
- issue: Valor temporal de נִקְרָע e נִשְׁפַּךְ
  choice: 'futuro preditivo: “se partirá” e “serão derramadas”'
  alternative: 'presente vívido: “se parte” e “são derramadas”'
  rationale: Embora as formas hebraicas possam apresentar vividamente o acontecimento, o contexto identifica um sinal ainda por ocorrer, favorecendo o futuro em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução mantém a repetição de “sinal”, preserva o nome Yahweh e evita formulações excessivamente arcaicas. Todos os marcadores de nota aparecem no texto.
