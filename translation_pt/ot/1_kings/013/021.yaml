source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: pt
  text: 'E ele clamou ao homem de Deus que tinha vindo de Judá, dizendo: “Assim diz Yahweh: Porque você se rebelou contra a palavra de Yahweh[a] e não guardou a ordem que Yahweh, seu Deus, lhe ordenou,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a boca de Yahweh”, expressão idiomática que se refere ao que Yahweh disse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: clamou
  rationale: O verbo קרא pode significar chamar, proclamar ou clamar. Neste anúncio profético de condenação, “clamou” comunica a força da declaração sem ampliar indevidamente o sentido.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém o título hebraico tradicional e evita substituí-lo pela interpretação mais específica “profeta de Deus”.
- source_word: מִיהוּדָה
  choice: de Judá
  rationale: Expressa de modo natural e direto a procedência geográfica.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e verte o nome divino como nome próprio.
- source_word: יַעַן כִּי
  choice: Porque
  rationale: Introduz de maneira clara e concisa o motivo da sentença divina.
- source_word: מָרִיתָ
  choice: você se rebelou
  rationale: מרה indica rebeldia ou desafio, sentido mais forte que uma simples falha em obedecer.
- source_word: פִּי יְהוָה
  choice: a palavra de Yahweh
  rationale: A expressão significa literalmente “a boca de Yahweh”, mas funciona como referência ao que Yahweh falou. “A palavra de Yahweh” conserva o sentido de forma idiomática.
- source_word: שָׁמַרְתָּ
  choice: não guardou
  rationale: Com uma ordem como objeto, שׁמר significa guardar, observar ou cumprir; “guardar” preserva a linguagem bíblica de obediência e continua compreensível.
- source_word: הַמִּצְוָה
  choice: a ordem
  rationale: Representa o substantivo singular e soa mais natural no português atual do que “o mandamento” neste contexto imediato.
- source_word: צִוְּךָ
  choice: lhe deu
  rationale: Na expressão portuguesa “dar uma ordem”, comunica naturalmente o sentido de צוה sem a repetição pouco elegante “a ordem que... lhe ordenou”.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Mantém a expressão pactual e identifica Yahweh como o Deus do destinatário.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome divino. “Yahweh” o preserva como nome próprio, em vez de substituí-lo por um título.
- issue: Força de מָרִיתָ no contexto da obediência pactual
  choice: você se rebelou
  alternative: você desobedeceu; você desafiou
  rationale: A escolha conserva a gravidade moral e relacional da acusação hebraica sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta e a fórmula profética foram mantidas. O versículo termina com a oração ainda em andamento, como no contexto hebraico.
