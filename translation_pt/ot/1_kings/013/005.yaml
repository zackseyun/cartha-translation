  text: וְ/הַ/מִּזְבֵּ֣חַ נִקְרָ֔ע וַ/יִּשָּׁפֵ֥ךְ הַ/דֶּ֖שֶׁן מִן הַ/מִּזְבֵּ֑חַ כַּ/מּוֹפֵ֗ת אֲשֶׁ֥ר נָתַ֛ן אִ֥ישׁ הָ/אֱלֹהִ֖ים בִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: pt
  text: E o altar se rompeu, e as cinzas foram derramadas do altar, conforme o sinal[a] que o homem de Deus havia dado pela palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como o sinal» ou «de acordo com o prodígio/portento». O termo hebraico מוֹפֵת pode designar um sinal, prodígio ou portento.
    reason: alternativa lexical
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Tradução corrente e suficiente de מִזְבֵּחַ no contexto de culto, sem explicitação desnecessária.
- source_word: נִקְרָע
  choice: se rompeu
  rationale: O nifal de קרע descreve a ruptura física do altar. «Se rompeu» é natural em português e mantém o valor passivo-resultativo sem especificar além do hebraico se ele se abriu ou se partiu em pedaços.
- source_word: וַיִּשָּׁפֵךְ
  choice: se derramaram
  rationale: שׁפך significa derramar. A construção pronominal é idiomática em português para o conteúdo que cai para fora, com concordância plural com «cinzas».
- source_word: הַדֶּשֶׁן
  choice: as cinzas
  rationale: No contexto do altar, דֶּשֶׁן designa as cinzas ou o resíduo gorduroso dos sacrifícios. «As cinzas» é claro, natural e não excessivamente técnico.
- source_word: מִן הַמִּזְבֵּחַ
  choice: do altar
  rationale: Expressa diretamente a origem espacial indicada por מִן.
- source_word: כַּמּוֹפֵת
  choice: conforme o sinal
  rationale: כְּ indica correspondência ou cumprimento, e מוֹפֵת pode designar sinal, prodígio ou portento. «Conforme o sinal» funciona naturalmente no contexto, enquanto a nota preserva a amplitude lexical.
- source_word: אֲשֶׁר נָתַן
  choice: que ... havia dado
  rationale: Preserva o sentido comum de נתן, «dar», e o mais-que-perfeito situa o anúncio do sinal antes de seu cumprimento.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém o título hebraico tradicional sem interpretá-lo de maneira mais restrita como «profeta».
- source_word: בִּדְבַר יְהוָה
  choice: pela palavra de Yahweh
  rationale: Preserva a expressão formular com דָּבָר e sua possível nuance de palavra ou ordem, além de representar diretamente o nome divino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. «Yahweh» representa o nome próprio sem substituí-lo por um título e sem adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial com «E» preserva o encadeamento narrativo hebraico. A nota foi ligada a «sinal», termo ao qual pertence a ambiguidade lexical.
