base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: pt
  text: E eis que homens passavam, viram o cadáver jogado no caminho e o leão em pé ao lado do cadáver. Então foram à cidade onde morava o profeta idoso e relataram o ocorrido[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falaram disso na cidade”. O verbo hebraico significa simplesmente “falaram”, mas, no contexto, refere-se a relatar o ocorrido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o marcador narrativo de atenção e a vivacidade repentina do hebraico, em linguagem bíblica ainda compreensível.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: alguns homens passavam por ali
  rationale: Mantém o referente masculino plural e expressa com o imperfeito a ação em andamento indicada pelo particípio.
- source_word: הַנְּבֵלָה מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: o cadáver jogado no caminho
  rationale: “Cadáver” é preciso para um corpo humano, e “jogado” preserva a força do particípio passivo de שׁלך, em vez de reduzi-lo a “caído” ou “estendido”.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: o leão parado ao lado do cadáver
  rationale: Reproduz claramente a posição incomum do leão junto ao corpo e conserva a repetição de “cadáver” presente no hebraico.
- source_word: וַיָּבֹאוּ
  choice: Então foram à cidade
  rationale: Embora o verbo hebraico seja literalmente “vieram”, o movimento para a cidade é expresso naturalmente em português por “foram”; “à cidade” é inferido da oração seguinte.
- source_word: וַיְדַבְּרוּ בָעִיר
  choice: e relataram o ocorrido
  rationale: O verbo significa literalmente “falaram”, mas o contexto indica a comunicação daquilo que haviam presenciado. A nota registra a formulação mais literal.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: onde morava o velho profeta
  rationale: O particípio de ישׁב com בָּהּ indica residência; “morava” é corrente e preserva “velho profeta” sem interpretação adicional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade narrativa em “E eis que”. A sintaxe foi ajustada para fluência em português sem eliminar a repetição enfática de “cadáver” nem explicitar além do necessário o conteúdo do relato.
