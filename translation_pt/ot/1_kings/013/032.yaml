source:
  edition: WLC
  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: pt
  text: Pois certamente se cumprirá a palavra que ele proclamou pela palavra de Yahweh contra o altar que está em Betel e contra todos os santuários dos lugares altos[a] que estão nas cidades de Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todas as casas dos lugares altos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o pedido anterior acerca do sepultamento e preserva a força explicativa do hebraico.
- source_word: הָיֹה יִהְיֶה
  choice: certamente se cumprirá
  rationale: A combinação do infinitivo absoluto com o verbo no imperfeito intensifica a certeza; em português, esta formulação é natural no contexto de uma palavra profética.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: No contexto profético, refere-se à mensagem pronunciada, não apenas a uma coisa ou acontecimento.
- source_word: אֲשֶׁר קָרָא
  choice: que ele proclamou
  rationale: Comunica uma declaração pública e solene. 'Clamou' seria mais formalmente próximo, mas poderia sugerir sobretudo volume ou súplica em português atual.
- source_word: בִּדְבַר יְהוָה
  choice: pela palavra de Yahweh
  rationale: Preserva a repetição de 'palavra' e expressa que a proclamação ocorreu com base na revelação ou determinação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַל
  choice: contra
  rationale: No contexto de juízo profético, indica os alvos da denúncia.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר בְּבֵית אֵל
  choice: o altar que está em Betel
  rationale: Tradução direta e natural da referência cultual e geográfica.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: todos os santuários dos lugares altos
  rationale: '''Santuários'' comunica naturalmente a função dos literalmente chamados ''edifícios/casas dos lugares altos'', sem eliminar a referência explícita aos lugares altos.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: nas cidades de Samaria
  rationale: Preserva a designação geográfica do texto canônico sem tentar corrigir sua perspectiva histórica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Certeza do cumprimento profético em הָיֹה יִהְיֶה
  choice: certamente se cumprirá
  alternative: sem falta acontecerá; com certeza se realizará
  rationale: Mantém a ênfase gramatical na certeza do cumprimento, sem acrescentar uma explicação teológica que não esteja expressa no versículo.
- issue: Sentido cultual de בָּתֵּי הַבָּמוֹת
  choice: santuários dos lugares altos
  alternative: casas dos lugares altos
  rationale: A opção principal torna inteligível a função cultual das construções; a forma literal é registrada em nota para preservar a particularidade da expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para iniciar com a ênfase na certeza do cumprimento. Conservam-se 'Yahweh', 'Betel', 'Samaria' e o termo bíblico 'lugares altos'.
