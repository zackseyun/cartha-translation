base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: pt
  text: 'Quando o rei ouviu a palavra do homem de Deus, que clamou contra o altar em Betel, Jeroboão estendeu a mão de sobre o altar e ordenou: “Agarrem-no!” Mas a mão que ele havia estendido contra o homem ficou seca[a], e ele não conseguiu recolhê-la.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “definhou”. O hebraico diz literalmente “secou”.
    reason: Registra uma alternativa lexical natural e esclarece a imagem literal de יבש.
lexical_decisions:
- source_word: דְּבַר
  choice: a palavra
  rationale: Preserva o singular concreto e o uso profético de דָּבָר, sem substituir o termo por uma paráfrase como “mensagem”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém o título hebraico tradicional e não o interpreta de modo mais específico como “profeta de Deus”.
- source_word: קָרָא עַל
  choice: clamado contra
  rationale: “Clamar” expressa a força vocal de קרא, enquanto “contra” conserva o sentido adversativo de על nesta denúncia profética.
- source_word: בְּבֵית אֵל
  choice: em Betel
  rationale: Emprega a forma portuguesa consagrada do topônimo e uma preposição natural para indicar o local do altar.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: estendeu a mão de sobre o altar
  rationale: “Estendeu a mão” traduz naturalmente o gesto hostil, e “de sobre o altar” conserva a indicação espacial incomum de מֵעַל sem apagá-la.
- source_word: תִּפְשֻׂהוּ
  choice: Agarrem-no!
  rationale: O imperativo plural dirige-se aos presentes e transmite uma ordem enérgica sem acrescentar a nuance jurídica moderna de “prendam-no”.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: a mão ... ressecou-se
  rationale: “Ressecou-se” retém a imagem literal de יבש, “secar”, e comunica o dano súbito; “atrofiou-se” ou “paralisou” acrescentariam uma descrição médica ausente do texto.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: que ele havia estendido contra o homem
  rationale: A formulação conserva a repetição do gesto e seu caráter hostil. “O homem” esclarece o referente de עָלָיו em português sem mudar o sentido.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: não conseguiu recolhê-la
  rationale: Expressa de modo natural a incapacidade de fazer a mão voltar para junto de si, sentido causativo do hebraico, sem repetição pouco idiomática.
theological_decisions:
- issue: Natureza do juízo sobre a mão de Jeroboão
  choice: Descrever diretamente a mão como ressecada e impossibilitada de ser recolhida.
  alternative: Traduzir de forma mais interpretativa como “atrofiou-se”, “definhou” ou “ficou paralisada”.
  rationale: A narrativa apresenta um dano físico súbito em resposta ao gesto hostil, mas não fornece diagnóstico. A tradução preserva o caráter extraordinário do acontecimento sem acrescentar explicação médica ou teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura narrativa foi suavemente ajustada à sintaxe portuguesa, mantendo os títulos, a força da ordem, a repetição significativa do gesto e a imagem concreta do hebraico.
