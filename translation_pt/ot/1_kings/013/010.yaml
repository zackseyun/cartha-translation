  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: pt
  text: Assim, ele seguiu por outro caminho e não voltou pelo caminho por onde tinha vindo a Betel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Assim, ele seguiu
  rationale: O wayyiqtol faz a narrativa avançar; “Assim” também liga a ação à ordem recebida, enquanto “seguiu” expressa naturalmente o deslocamento.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: por outro caminho
  rationale: דֶּרֶךְ pode designar caminho, estrada ou rota; esta formulação natural preserva o contraste com o percurso de ida.
- source_word: וְלֹא שָׁב
  choice: e não voltou
  rationale: שׁוּב significa aqui voltar ou retornar, e a formulação concisa corresponde ao contexto de viagem.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: pelo caminho por onde tinha vindo
  rationale: A oração relativa identifica o trajeto anterior; “tinha vindo” marca com clareza a anterioridade, e “por onde” incorpora naturalmente o sufixo feminino que retoma דֶּרֶךְ.
- source_word: אֶל בֵּית אֵל
  choice: a Betel
  rationale: בֵּית אֵל é o topônimo Betel; a preposição indica o destino de sua vinda anterior.
