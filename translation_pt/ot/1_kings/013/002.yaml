source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: pt
  text: 'E ele clamou contra o altar pela palavra de Yahweh[a] e disse: “Altar, altar! Assim diz Yahweh: Eis que nascerá um filho à casa de Davi, chamado Josias. Ele sacrificará sobre você os sacerdotes dos lugares altos que queimam incenso sobre você[b], e ossos humanos serão queimados sobre você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ordem de Yahweh” ou “segundo a palavra de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode abranger os que fazem subir sobre o altar a fumaça de ofertas, não apenas os que queimam incenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: clamou contra o altar
  rationale: Em contexto profético, קרא com עַל expressa uma proclamação enfática dirigida contra alguém ou algo. “Clamou contra” preserva tanto a intensidade quanto o sentido adversativo.
- source_word: בִּדְבַר יְהוָה
  choice: pela palavra de Yahweh
  rationale: A expressão indica autorização ou agência profética. “Pela palavra” mantém essa relação sem excluir completamente as nuances de “segundo” ou “por ordem de”.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: Altar, altar!
  rationale: A repetição foi mantida para conservar a força vocativa, solene e profética.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Fórmula profética reconhecível, formal e natural em português bíblico atual.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz com solenidade e ênfase o anúncio profético.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: nascerá um filho à casa de Davi
  rationale: O particípio passivo tem valor de anúncio profético futuro. A formulação preserva a referência dinástica de לְבֵית דָּוִד.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: chamado Josias
  rationale: Expressa naturalmente em português a fórmula hebraica de nomeação, mantendo a especificidade da profecia.
- source_word: וְזָבַח עָלֶיךָ
  choice: Ele sacrificará sobre você
  rationale: זבח possui tom sacrificial. “Sacrificará” preserva a ironia cultual e a profanação deliberada do altar, em vez de reduzir o sentido a simples matança.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: os sacerdotes dos lugares altos
  rationale: “Lugares altos” é a designação bíblica estabelecida para os santuários locais chamados בָּמוֹת.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: que queimam incenso sobre você
  rationale: No Hifil, קטר pode indicar fazer subir fumaça sacrificial, frequentemente pela queima de incenso. A opção é clara no contexto, enquanto a nota registra a amplitude possível.
- source_word: וְעַצְמוֹת אָדָם
  choice: ossos humanos
  rationale: אָדָם é genérico neste contexto; “humanos” comunica o sentido sem sugerir que se trate necessariamente de um indivíduo masculino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa o nome divino diretamente, sem substituí-lo por um título.
- issue: Natureza da ação expressa por זבח contra os sacerdotes
  choice: sacrificará
  alternative: matará; imolará
  rationale: 'O verbo tem caráter sacrificial, que reforça a inversão e a profanação cultual: os próprios sacerdotes são tratados como vítimas sobre o altar.'
- issue: Sentido genérico de אָדָם
  choice: humanos
  alternative: de homem
  rationale: Aqui אָדָם designa seres humanos de modo genérico, não especificamente um homem nem o personagem Adão.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a repetição retórica, a personificação do altar e o vocabulário cultual. Os pronomes dirigidos ao altar usam “você” para naturalidade internacional com legibilidade brasileira, sem perder a dignidade do discurso.
