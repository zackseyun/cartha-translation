source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: pt
  text: Depois disso, Jeroboão não se afastou do seu mau caminho, mas voltou a constituir sacerdotes dos lugares altos dentre o povo em geral. Qualquer um que desejasse, ele o consagrava[a], e esse se tornava um dos sacerdotes dos lugares altos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ele enchia a mão dele”, expressão hebraica usada para instalar ou consagrar alguém ao serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: Depois disso
  rationale: דָּבָר pode significar palavra, assunto, coisa ou acontecimento. Neste resumo narrativo, “Depois disso” retoma naturalmente o episódio anterior sem especificar além do hebraico.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: não se afastou do seu mau caminho
  rationale: שׁוּב significa voltar ou mudar de direção. Com a preposição מִן e “seu mau caminho”, “não se afastou” preserva a metáfora concreta e evita substituir o verbo pelo termo teológico mais interpretativo “arrepender-se”.
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: voltou a constituir
  rationale: Aqui, שׁוּב seguido de outro verbo indica repetição ou retomada da ação. “Voltou a” expressa essa função de maneira natural, enquanto “constituir” comunica a designação para o ofício.
- source_word: מִקְצוֹת הָעָם
  choice: dentre pessoas de todo o povo
  rationale: A expressão é difícil e, literalmente, envolve as “extremidades” ou o conjunto do povo. No contexto de Reis, indica recrutamento amplo e indiscriminado entre o povo, não uma classe sacerdotal devidamente delimitada. A formulação mantém essa amplitude sem introduzir a interpretação discutível de “os mais baixos do povo”.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: sacerdotes dos lugares altos
  rationale: בָּמוֹת designa os santuários locais elevados, considerados ilegítimos neste contexto. “Lugares altos” conserva a expressão tradicional e a imagem espacial do hebraico.
- source_word: הֶחָפֵץ
  choice: Qualquer um que desejasse
  rationale: 'O particípio singular com artigo tem sentido genérico: “aquele que desejasse”. “Qualquer um” torna explícito o caráter indiscriminado sem restringir o referente.'
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: ele o consagrava
  rationale: A expressão idiomática “encher a mão” denota instalar ou consagrar alguém para o serviço sacerdotal. “Consagrava” comunica a função em português atual, e a forma literal é preservada em nota.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: e esse se tornava um dos sacerdotes dos lugares altos
  rationale: O verbo singular seguido do predicativo plural indica ingresso na classe dos sacerdotes dos lugares altos. “Um dos sacerdotes” reproduz esse sentido em português gramatical e claro.
theological_decisions:
- issue: Se שׁוּב deve ser vertido pelo termo religioso “arrepender-se”
  choice: não se afastou do seu mau caminho
  alternative: não se arrependeu do seu mau caminho
  rationale: Embora haja uma dimensão moral e religiosa, o hebraico apresenta a imagem concreta de mudar de direção em relação a um caminho. A tradução mantém essa metáfora e não antecipa uma formulação teológica mais específica.
- issue: Como traduzir a fórmula sacerdotal יְמַלֵּא אֶת יָדוֹ
  choice: ele o consagrava
  alternative: ele enchia a mão dele / ele o ordenava
  rationale: A expressão descreve a instalação no serviço sacerdotal. “Consagrava” é clara e adequada ao contexto sem vincular o ato a uma tradição posterior específica; a nota registra literalmente o idioma hebraico.
- issue: Como entender מִקְצוֹת הָעָם
  choice: dentre pessoas de todo o povo
  alternative: dentre os mais baixos do povo
  rationale: A leitura pejorativa “os mais baixos” é possível em versões tradicionais, mas não é exigida pela expressão hebraica. A opção adotada preserva a ênfase contextual na escolha indiscriminada entre o povo sem inserir uma distinção social incerta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “lugares altos” para conservar a imagem e o vocabulário bíblico do hebraico, e evita tanto arcaísmos desnecessários quanto terminologia denominacional específica.
