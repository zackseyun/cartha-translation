base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: pt
  text: 'Pois me foi dito pela palavra do SENHOR: “Não coma pão nem beba água ali; não volte pelo caminho por onde você foi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: me foi dito pela palavra do SENHOR
  rationale: Expressa em português natural a recepção de uma mensagem cuja origem e autoridade são a palavra divina, preservando a repetição conceitual de דָבָר sem recorrer à formulação pouco idiomática “uma palavra veio a mim”.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Não coma pão
  rationale: Mantém o sentido direto da proibição, com o imperativo negativo natural em português.
- source_word: וְלֹא תִשְׁתֶּה שָׁם מָיִם
  choice: nem beba água ali
  rationale: Preserva a coordenação negativa, o objeto explícito e a referência local de שָׁם.
- source_word: לֹא תָשׁוּב לָלֶכֶת בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: não volte pelo caminho por onde você foi
  rationale: Reproduz de modo claro e idiomático a proibição de regressar pela mesma rota, sem a redundância artificial de “voltar indo”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes, sem acrescentar interpretação denominacional.
- issue: Força verbal das proibições
  choice: imperativo negativo direto
  alternative: 'futuro normativo: “não comerás”'
  rationale: No discurso direto, o português moderno comunica mais naturalmente a ordem divina com “não coma... nem beba... não volte”, preservando sua força obrigatória.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” implícito nas formas verbais. A formulação conserva o discurso direto e a solenidade do contexto sem sintaxe excessivamente literal.
