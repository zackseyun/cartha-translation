  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: pt
  text: Então o profeta levantou o cadáver do homem de Deus, colocou-o sobre o jumento e o levou de volta. Depois, foi à cidade do velho profeta para pranteá-lo[a] e sepultá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lamentá-lo”. O verbo hebraico se refere ao luto expresso por meio de lamentação, especialmente em contexto funerário.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: levantou
  rationale: נשא pode significar levantar, carregar ou tomar. “Levantou” preserva a ação concreta que antecede a colocação do cadáver sobre o jumento.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: A expressão definida aponta, no contexto, para o velho profeta que encontrou o cadáver.
- source_word: נִבְלַת
  choice: o cadáver
  rationale: נבלה designa um corpo morto. “Cadáver” é preciso e natural, sem a conotação predominantemente animal de “carcaça”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém o título bíblico tradicional e inteligível de alguém comissionado por Deus.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: colocou-o sobre o jumento
  rationale: O hifil de נוח significa aqui pôr ou colocar. O pronome retoma naturalmente “cadáver” em português.
- source_word: הַחֲמוֹר
  choice: o jumento
  rationale: Equivalente corrente e amplamente compreensível para חמור.
- source_word: וַיְשִׁיבֵהוּ
  choice: o levou de volta
  rationale: O hifil de שוב expressa fazer voltar ou trazer/levar de volta. Em português, “levou de volta” acompanha naturalmente o movimento subsequente até a cidade.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: Depois, foi à cidade do velho profeta
  rationale: A cadeia nominal significa a cidade onde vivia o velho profeta. “Foi à” é natural na perspectiva narrativa em português, sem alterar o sentido de chegada expresso por בוא.
- source_word: הַזָּקֵן
  choice: velho
  rationale: No contexto, indica idade e distingue esse profeta do homem de Deus; não designa o cargo de ancião.
- source_word: לִסְפֹּד
  choice: para pranteá-lo
  rationale: ספד denota luto expresso, especialmente lamentação fúnebre. “Prantear” conserva essa especificidade.
- source_word: וּלְקָבְרוֹ
  choice: e sepultá-lo
  rationale: קבר significa enterrar ou sepultar. “Sepultar” é claro, digno e apropriado ao contexto funerário.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A repetição de pronomes mantém claros os referentes sem suavizar “cadáver”; “velho profeta” descreve idade, não ofício.
