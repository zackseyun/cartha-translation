base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: pt
  text: 'Mas o homem de Deus disse ao rei: “Se o senhor me desse metade da sua casa[a], eu não iria com o senhor, nem comeria pão, nem beberia água neste lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “metade da sua casa”. A expressão pode indicar, de modo idiomático, uma recompensa ou um patrimônio muito grande, mas a tradução mantém a formulação literal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva a expressão hebraica tradicional para um mensageiro comissionado por Deus, sem substituí-la pela interpretação mais específica “profeta de Deus”.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: Mesmo que me desse metade da sua casa
  rationale: A construção concessivo-condicional comunica naturalmente em português a recusa enfática. “Metade da sua casa” mantém a imagem hebraica, que pode abranger casa, patrimônio ou bens.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: eu não iria com o senhor
  rationale: Embora o verbo hebraico seja literalmente “vir”, “ir com” é a equivalência dêitica mais natural no contexto do convite. “O senhor” mantém clareza e respeito ao dirigir-se ao rei.
- source_word: לֹא אֹכַל לֶחֶם
  choice: nem comeria pão
  rationale: Mantém o termo concreto “pão”, que no hebraico também pode representar alimento ou uma refeição, sem eliminar a textura do original.
- source_word: לֹא אֶשְׁתֶּה מַיִם
  choice: nem beberia água
  rationale: Tradução direta, coordenada com a oração anterior de modo natural em português.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Preserva a ênfase demonstrativa do hebraico de maneira clara e corrente.
