base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: pt
  text: 'Então o rei respondeu e disse ao homem de Deus: “Por favor, implore o favor de Yahweh[a], seu Deus, e ore por mim, para que minha mão seja restaurada.” O homem de Deus implorou o favor de Yahweh, e a mão do rei foi restaurada e voltou a ser como antes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “busque o favor de Yahweh”. A expressão hebraica diz literalmente “suplicar a face de Yahweh”.'
    reason: Registra a alternativa lexical e explica a expressão idiomática hebraica, sem impor uma formulação literal pouco natural ao texto principal.
lexical_decisions:
- source_word: חַל נָא אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: busque o favor de Yahweh / buscou o favor de Yahweh
  rationale: A expressão idiomática hebraica significa procurar ou suplicar o favor de alguém. A formulação preserva a imagem do favor sem traduzir literalmente “o rosto”, o que seria pouco natural em português. “Aplacar” sugeriria uma ideia de propiciação mais forte do que o contexto exige.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Mantém a segunda pessoa singular e a maneira como o rei se refere ao Deus do homem de Deus, sem mudar a expressão para “nosso Deus”.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: e ore por mim
  rationale: Comunica de modo natural a oração em favor de outra pessoa indicada pelo verbo no hitpael com בַּעֲדִי.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: para que minha mão seja restaurada / a mão do rei foi restaurada
  rationale: Expressa a recuperação da mão mencionada no contexto anterior e mantém o paralelismo entre o pedido e seu cumprimento.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: e ficou como antes
  rationale: Formulação clara e atual para a restauração da mão à condição anterior.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título profético empregado pelo texto, sem substituí-lo pela interpretação “profeta”.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu e disse
  rationale: Conserva os dois verbos da fórmula narrativa hebraica, numa construção ainda compreensível e digna em português.
theological_decisions:
- issue: Referência a Yahweh como “seu Deus” na fala do rei
  choice: Manter “Yahweh, seu Deus”
  alternative: “Yahweh, nosso Deus”
  rationale: O hebraico traz explicitamente a segunda pessoa singular. A tradução mantém a possível distância expressa pelo rei e não introduz uma solidariedade pactual ausente da fala.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição “respondeu e disse” é mantida por refletir a fórmula narrativa do hebraico; a expressão idiomática sobre o rosto é traduzida pelo sentido e explicada em nota.
