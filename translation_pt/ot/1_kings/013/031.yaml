base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: pt
  text: 'E aconteceu que, depois de sepultá-lo, ele disse a seus filhos: “Quando eu morrer, sepultem-me no túmulo em que o homem de Deus está sepultado; ponham os meus ossos junto aos ossos dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a abertura narrativa hebraica e sua cadência, usando uma formulação atual e digna em português.
- source_word: אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: depois de sepultá-lo
  rationale: Reproduz naturalmente a construção temporal e deixa claro que o sepultamento ocorreu antes da fala.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Mantém a referência masculina plural específica do hebraico, sem ampliá-la para descendentes ou crianças em geral.
- source_word: בְּמוֹתִי
  choice: Quando eu morrer
  rationale: Expressa de modo natural o sentido temporal e prospectivo da construção hebraica.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: sepultem-me
  rationale: Transmite a força instrutiva do verbo no contexto como uma ordem direta aos filhos.
- source_word: בַּקֶּבֶר
  choice: no túmulo
  rationale: Indica um local específico de sepultamento capaz de receber mais de um conjunto de ossos.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Traduz diretamente o título recorrente na passagem, sem interpretá-lo de maneira mais estreita como “profeta”.
- source_word: קָבוּר בּוֹ
  choice: está sepultado
  rationale: Representa com clareza o estado expresso pelo particípio passivo hebraico.
- source_word: אֵצֶל
  choice: junto aos
  rationale: Comunica proximidade espacial de forma natural no português contemporâneo.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: os ossos dele ... os meus ossos
  rationale: Conserva a imagem concreta dos “ossos”, importante para o sepultamento e para o desenvolvimento posterior da narrativa.
- source_word: הַנִּיחוּ
  choice: ponham
  rationale: Verbo corrente e claro que mantém a força imperativa da instrução.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. O registro é narrativo e solene sem arcaísmos; “sepultar” foi preferido a “enterrar” por se ajustar ao contexto de um túmulo compartilhado.
