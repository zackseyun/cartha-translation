  text: וַ/יְדַבֵּ֤ר הַ/מֶּ֨לֶךְ֙ אֶל אִ֣ישׁ הָ/אֱלֹהִ֔ים בֹּאָ/ה אִתִּ֥/י הַ/בַּ֖יְתָ/ה וּֽ/סְעָ֑דָ/ה וְ/אֶתְּנָ֥ה לְ/ךָ֖ מַתָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/007.yaml
  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: pt
  text: 'Então o rei disse ao homem de Deus: “Venha comigo para casa e alimente-se[a], e eu lhe darei um presente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recupere as forças” ou “coma alguma coisa”; o verbo hebraico pode significar fortalecer ou sustentar a si mesmo, muitas vezes por meio de uma refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então ... disse” expressa naturalmente a sequência em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva a expressão hebraica tradicional sem substituí-la pela interpretação mais específica “profeta de Deus”.
- source_word: בֹּאָה
  choice: Venha
  rationale: Imperativo natural em português; o he paragógico não exige que se acrescente uma fórmula explícita de cortesia.
- source_word: אִתִּי הַבַּיְתָה
  choice: comigo para casa
  rationale: A terminação direcional de הַבַּיְתָה indica movimento para a casa; a formulação escolhida é idiomática em um convite.
- source_word: וּסְעָדָה
  choice: e alimente-se
  rationale: O verbo סעד comunica fortalecer ou sustentar alguém, muitas vezes por meio de alimento. “Alimente-se” conserva essa ideia e deixa claro o contexto de uma refeição.
- source_word: וְאֶתְּנָה לְךָ
  choice: e eu lhe darei
  rationale: Expressa de modo claro e natural a oferta do rei, refletindo a forma volitiva de primeira pessoa no contexto.
- source_word: מַתָּת
  choice: um presente
  rationale: É a opção portuguesa mais neutra para uma dádiva; “recompensa” acrescentaria uma ideia de pagamento não explicitada no hebraico.
theological_decisions:
- issue: Identidade do אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  alternative: profeta de Deus
  rationale: A tradução mantém o título efetivamente usado no texto hebraico e evita explicitar uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “lhe” como objeto indireto e preserva a forma tradicional “homem de Deus”. O marcador da nota foi colocado junto ao verbo a que a alternativa lexical se refere.
