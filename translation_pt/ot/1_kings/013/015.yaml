  text: Then he said to him[a], “Come home with me and eat bread.”
translation:
  language: pt
  text: 'Então ele lhe disse: “Venha comigo para casa e coma pão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Então ele lhe disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente essa sequência. “Lhe disse” representa אֵלָיו de modo claro e idiomático.
- source_word: לֵךְ אִתִּי
  choice: Venha comigo
  rationale: Embora לֵךְ signifique literalmente “vá”, em português o convite feito para acompanhar o próprio falante é expresso naturalmente por “venha comigo”.
- source_word: הַבָּיְתָה
  choice: para casa
  rationale: O substantivo com ה direcional indica movimento rumo à casa. “Para casa” preserva essa direção sem acrescentar explicitamente o possessivo “minha”, que está apenas implícito no contexto.
- source_word: וֶאֱכֹל לָחֶם
  choice: e coma pão
  rationale: Mantém a simplicidade dos imperativos e conserva o sentido básico de לֶחֶם, embora o termo também possa designar alimento ou uma refeição em sentido amplo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A formulação conserva “pão”, importante no contexto narrativo imediato, e emprega “venha” como equivalência idiomática do convite.
