base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: pt
  text: 'O pai deles lhes perguntou: “Que caminho ele tomou?” Pois seus filhos tinham visto o caminho que o homem de Deus, que veio de Judá, tinha tomado.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: lhes perguntou
  rationale: Embora o verbo signifique literalmente “falou/disse”, a fala introduz uma pergunta direta; “perguntou” expressa naturalmente sua função narrativa em português.
- source_word: אֲבִיהֶם
  choice: o pai deles
  rationale: O sufixo é masculino plural e se refere aos filhos mencionados no contexto.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: por qual caminho
  rationale: A expressão interrogativa pede a identificação da rota seguida; esta formulação é clara e idiomática em português.
- source_word: וַיִּרְאוּ
  choice: tinham visto
  rationale: O mais-que-perfeito composto deixa claro que os filhos viram o caminho antes da pergunta do pai.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva a expressão hebraica tradicional sem interpretá-la de modo mais restrito como “profeta”.
- source_word: אֲשֶׁר בָּא מִיהוּדָה
  choice: que viera de Judá
  rationale: Indica de modo natural a procedência e a anterioridade da vinda em relação à cena narrada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A conjunção antes de “seus filhos” foi vertida como “Pois” para representar sua função explicativa. A repetição de “caminho” foi mantida por corresponder à repetição do hebraico.
