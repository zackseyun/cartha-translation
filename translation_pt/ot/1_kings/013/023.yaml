  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י אָכְל֥/וֹ לֶ֖חֶם וְ/אַחֲרֵ֣י שְׁתוֹת֑/וֹ וַ/יַּחֲבָשׁ ל֣/וֹ הַ/חֲמ֔וֹר לַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: pt
  text: E aconteceu que, depois de ele comer pão e beber, selou o jumento para ele, para o profeta que havia trazido de volta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que havia feito voltar”.'
    reason: Alternativa mais literal para o valor causativo do hifil de שוב.
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa hebraica de transição sem recorrer ao arcaísmo «e sucedeu que».
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: depois de ele comer pão
  rationale: Reproduz a construção temporal e conserva «pão», expresso no hebraico, embora possa designar a refeição de modo geral.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: e beber
  rationale: Preserva o paralelismo temporal e não acrescenta uma bebida específica, pois o objeto não é declarado.
- source_word: וַיַּחֲבָשׁ
  choice: selou
  rationale: Neste contexto, חבש descreve o ato de pôr a sela e preparar o animal para ser montado.
- source_word: לוֹ
  choice: para ele
  rationale: Expressa o beneficiário da ação sem transformar o pronome em indicação de posse.
- source_word: הַחֲמוֹר
  choice: o jumento
  rationale: Equivalente corrente e amplamente compreensível de חמור.
- source_word: לַנָּבִיא
  choice: para o profeta
  rationale: Traduz o substantivo empregado nesta oração, sem substituí-lo pelo título «homem de Deus» usado no contexto mais amplo.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: que havia trazido de volta
  rationale: O hifil de שוב indica fazer alguém retornar; «trazido de volta» comunica isso de forma idiomática, enquanto a nota registra a formulação mais causativa.
theological_decisions:
- issue: Identidade dos referentes pronominais e mudança implícita de sujeito
  choice: Manter os pronomes e o sujeito não expresso, sem identificar nominalmente quem comeu, bebeu ou selou o jumento
  alternative: Explicitar «o homem de Deus» e «o profeta idoso» com base no contexto narrativo
  rationale: O hebraico depende do contexto e não repete esses referentes no versículo; explicitá-los eliminaria uma ambiguidade real da forma do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com proximidade à sequência sintática hebraica. A repetição «para ele, para o profeta» foi mantida para refletir לוֹ לַנָּבִיא sem introduzir referentes que o versículo não nomeia.
