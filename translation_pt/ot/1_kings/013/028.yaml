base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: pt
  text: Ele foi e encontrou o cadáver[a] dele lançado na estrada; o jumento e o leão estavam parados ao lado do cadáver. O leão não tinha comido o cadáver, nem tinha despedaçado[b] o jumento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corpo morto” ou “carcaça”. O termo hebraico נְבֵלָה é incisivo e ressalta a realidade da morte.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “quebrado o jumento”; neste contexto, o sentido é que o leão não o despedaçou nem o dilacerou.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: cadáver
  rationale: נְבֵלָה designa um corpo morto. “Cadáver” é natural para um ser humano e conserva a crueza do hebraico, ao passo que “corpo” seria menos explícito e “carcaça” tenderia a sugerir um animal.
- source_word: מֻשְׁלֶכֶת
  choice: lançado
  rationale: O particípio passivo de שׁלך indica que o cadáver havia sido lançado ou jogado. “Lançado” preserva essa força sem reduzi-la a simplesmente “caído” ou “deitado”.
- source_word: בַּדֶּרֶךְ
  choice: na estrada
  rationale: דֶּרֶךְ refere-se aqui à via onde o cadáver foi encontrado; “na estrada” é claro e idiomático em português amplo.
- source_word: עֹמְדִים אֵצֶל
  choice: estavam parados ao lado de
  rationale: A construção retrata os dois animais permanecendo de pé junto ao cadáver. “Estavam parados ao lado de” comunica naturalmente tanto a posição quanto a cena incomum.
- source_word: לֹא אָכַל
  choice: não tinha comido
  rationale: אָכַל é o verbo comum para “comer”. O mais-que-perfeito composto apresenta o fato anterior constatado quando o homem chegou, sem intensificá-lo como “devorar”.
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: tinha despedaçado o jumento
  rationale: שׁבר significa literalmente “quebrar”, mas, tendo um animal como objeto neste contexto, transmite a ideia de quebrá-lo, dilacerá-lo ou despedaçá-lo. “Despedaçado” preserva a imagem forte e é compreensível em português.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: Ele foi e encontrou
  rationale: Os verbos narrativos consecutivos exprimem progressão direta; a formulação mantém o fluxo simples do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição de “cadáver” foi mantida por refletir a repetição enfática do hebraico; o ponto e vírgula evita uma coordenação excessivamente pesada sem alterar a progressão narrativa.
