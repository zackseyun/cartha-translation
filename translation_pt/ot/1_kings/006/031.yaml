  yaml_path: translation/ot/1_kings/006/031.yaml
  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: pt
  text: Para a entrada do santuário interior, ele fez portas de madeira de oliveira; a moldura e as ombreiras tinham cinco lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a moldura e as ombreiras constituíam uma quinta parte”. Essa tradução tradicional da frase final é arquitetonicamente obscura.'
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: entrada
  rationale: Designa a abertura ou via de acesso, distinguindo-a das folhas da porta mencionadas em seguida.
- source_word: הַדְּבִיר
  choice: santuário interior
  rationale: No contexto do templo, refere-se ao recinto mais interno; a expressão é clara e evita impor terminologia litúrgica posterior.
- source_word: דַּלְתֹות
  choice: portas
  rationale: O plural representa naturalmente as folhas emparelhadas da porta em português corrente.
- source_word: עֲצֵי שָׁמֶן
  choice: madeira de oliveira
  rationale: A construção hebraica designa idiomaticamente madeira de oliveira.
- source_word: הָאַיִל
  choice: a moldura
  rationale: O termo arquitetônico pode indicar a armação ou um elemento estrutural da entrada; 'moldura' mantém distinção em relação às ombreiras.
- source_word: מְזוּזוֹת
  choice: as ombreiras
  rationale: Refere-se aos elementos verticais laterais do vão da porta; 'ombreiras' é o termo arquitetônico português apropriado.
- source_word: חֲמִשִׁית
  choice: tinham cinco lados
  rationale: O hebraico é elíptico e obscuro; esta formulação expressa a leitura arquitetônica provável, preservando em nota a alternativa tradicional.
