base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: pt
  text: 'As duas folhas da porta eram de madeira de oliveira. Ele esculpiu nelas entalhes de querubins, palmeiras e flores abertas[a], revestiu-as de ouro e aplicou[b] o ouro sobre os querubins e sobre as palmeiras.


    [a] Ou: “figuras esculpidas de querubins, palmeiras e flores desabrochadas”.


    [b] Literalmente, “fez descer”; o verbo descreve a aplicação do ouro sobre as figuras esculpidas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “figuras esculpidas de querubins, palmeiras e flores desabrochadas”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fez descer”; o verbo descreve a aplicação do ouro sobre as figuras esculpidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: As duas folhas da porta eram de madeira de oliveira
  rationale: דַּלְתוֹת designa aqui os dois painéis ou folhas da porta; עֲצֵי שֶׁמֶן é a expressão hebraica tradicionalmente entendida como madeira de oliveira. O verbo “eram” é suprido em português, como exige a frase nominal hebraica.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: Ele esculpiu nelas entalhes
  rationale: O verbo e o substantivo cognato descrevem a execução de trabalho ornamental entalhado. A combinação mantém a ideia concreta sem produzir repetição pouco natural em português.
- source_word: כְּרוּבִים
  choice: querubins
  rationale: Mantém o termo bíblico convencional para os seres representados na decoração do templo, evitando associações diminutivas.
- source_word: תִמֹרוֹת
  choice: palmeiras
  rationale: No contexto da ornamentação do templo, refere-se a representações ou motivos de palmeiras.
- source_word: פְּטוּרֵי צִצִּים
  choice: flores abertas
  rationale: A expressão indica ornamentação floral, provavelmente flores desabrochadas; a nota preserva outra possibilidade visual sem especificar indevidamente a espécie.
- source_word: וְצִפָּה זָהָב
  choice: revestiu-as de ouro
  rationale: צפה, nesta construção, significa cobrir ou revestir uma superfície com metal; “revestiu” é claro e apropriado ao contexto arquitetônico.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: estendeu o ouro sobre
  rationale: Embora ירד signifique normalmente “descer”, nesta construção incomum descreve a aplicação do ouro sobre os relevos. “Estendeu” comunica a ação, enquanto a nota conserva a forma literal.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: sobre os querubins e sobre as palmeiras
  rationale: A repetição de “sobre” reproduz a repetição de עַל e ressalta que o ouro foi aplicado especificamente aos dois tipos de figura.
