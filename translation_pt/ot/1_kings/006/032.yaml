revisions:
- from: 'As duas folhas da porta eram de madeira de oliveira. Ele esculpiu nelas entalhes de querubins, palmeiras e flores abertas[a], revestiu-as de ouro e estendeu[b] o ouro sobre os querubins e sobre as palmeiras.


