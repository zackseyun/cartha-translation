  to: 'As duas folhas da porta eram de madeira de oliveira. Ele esculpiu nelas entalhes de querubins, palmeiras e flores abertas[a], revestiu-as de ouro e aplicou[b] o ouro sobre os querubins e sobre as palmeiras.


    [a] Ou: “figuras esculpidas de querubins, palmeiras e flores desabrochadas”.


    [b] Literalmente, “fez descer”; o verbo descreve a aplicação do ouro sobre as figuras esculpidas.'
  rationale: A revisão elimina uma alternativa de nota contrária ao sentido visual de «flores abertas» e substitui «estendeu» por «aplicou», formulação mais idiomática para o douramento, sem resolver além do necessário o uso incomum do verbo hebraico; a nota conserva sua literalidade.
