source:
  edition: WLC
  text: וְ/אֶת כָּל הַ/בַּ֛יִת צִפָּ֥ה זָהָ֖ב עַד תֹּ֣ם כָּל הַ/בָּ֑יִת וְ/כָל הַ/מִּזְבֵּ֥חַ אֲֽשֶׁר לַ/דְּבִ֖יר צִפָּ֥ה זָהָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: pt
  text: Revestiu de ouro toda a Casa, até que toda ela estivesse terminada; também revestiu de ouro todo o altar ligado ao santuário interno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o altar pertencente ao santuário interno”. O hebraico indica uma relação entre o altar e o santuário interno, mas pode ser entendido em termos de pertencimento ou de localização.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: a Casa
  rationale: O substantivo significa literalmente “casa” e, neste contexto, designa o templo. “Casa” preserva a expressão hebraica recorrente para a Casa do SENHOR; a inicial maiúscula ajuda a indicar esse referente específico.
- source_word: צִפָּה
  choice: revestiu
  rationale: Neste contexto de construção, o verbo descreve a aplicação de uma camada de ouro sobre uma superfície. “Revestiu” é claro, natural e mais preciso do que o genérico “cobriu”.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do termo hebraico para o material.
- source_word: עַד תֹּם כָּל הַבָּיִת
  choice: até que toda ela estivesse terminada
  rationale: A formulação verbal comunica naturalmente em português a ideia de levar a obra de toda a Casa à conclusão, sem reduzir a expressão a um mero advérbio.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: É o equivalente comum e contextualmente adequado para o termo hebraico.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: ligado ao santuário interno
  rationale: A preposição ל marca uma relação entre o altar e o santuário interno, mas não determina de modo inequívoco se essa relação é de pertencimento ou localização. “Ligado a” preserva essa abertura.
- source_word: דְּבִיר
  choice: santuário interno
  rationale: A expressão identifica o recinto mais interior do templo de maneira clara e arquitetonicamente adequada, sem recorrer ao arcaico “oráculo” nem impor como tradução principal a designação interpretativa “Lugar Santíssimo”.
theological_decisions:
- issue: Relação do altar com o דְּבִיר
  choice: ligado ao santuário interno
  alternative: pertencente ao santuário interno; situado junto ao santuário interno; do santuário interno
  rationale: O hebraico expressa associação por meio da preposição ל, sem especificar plenamente a relação espacial ou funcional. A tradução evita decidir além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Casa” mantém a imagem hebraica do templo; “santuário interno” oferece clareza contemporânea. A repetição de “toda” conserva a ênfase do original.
