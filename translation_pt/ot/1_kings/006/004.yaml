translation:
  language: pt
  text: Fez para o templo janelas com molduras recuadas e fechadas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos usados aqui são arquitetônicos, raros e de sentido incerto. A expressão é tradicionalmente traduzida como “janelas com molduras recuadas e fechadas”, mas também pode ser entendida como “janelas com molduras chanfradas”, “janelas com ombreiras que se estreitavam” ou “janelas largas por dentro e estreitas por fora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה expressa a ação narrativa simples; em português, o sujeito Salomão permanece claro pelo contexto, sem necessidade de repetir o pronome.
- source_word: לַבָּיִת
  choice: para o templo
  rationale: A preposição ל indica aquilo para o qual as janelas foram feitas. Embora בית signifique literalmente “casa”, neste contexto designa inequivocamente o templo, e “templo” evita ambiguidade em português corrente.
- source_word: חַלּוֹנֵי
  choice: janelas
  rationale: Plural construto de חלון, termo comum para janelas ou aberturas de janela.
- source_word: שְׁקֻפִים אֲטֻמִים
  choice: com molduras recuadas
  rationale: Os dois termos arquitetônicos formam uma expressão rara e incerta. A tradução oferece uma reconstrução plausível e legível, sem tratar אֲטֻמִים como uma oração predicativa independente; a incerteza e outras possibilidades são preservadas na nota.
