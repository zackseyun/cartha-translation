  text: וַ/יִּבֶן֩ עַל קִ֨יר הַ/בַּ֤יִת יצוע סָבִ֔יב אֶת קִיר֤וֹת הַ/בַּ֨יִת֙ סָבִ֔יב לַֽ/הֵיכָ֖ל וְ/לַ/דְּבִ֑יר וַ/יַּ֥עַשׂ צְלָע֖וֹת סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: pt
  text: Ele construiu uma estrutura[a] junto à parede do templo, ao redor das paredes do templo, ao redor do salão principal[b] e do santuário interno[c]; e fez salas laterais ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um anexo circundante”. O termo hebraico é raro e se refere à construção feita ao redor das paredes do templo.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico refere-se ao salão principal do templo, distinto do santuário interno.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Lugar Santíssimo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O wayyiqtol de בנה dá continuidade à narrativa e é expresso naturalmente pelo pretérito perfeito em português.
- source_word: עַל קִיר הַבַּיִת
  choice: junto à parede do templo
  rationale: Neste contexto arquitetônico, עַל indica uma construção adjacente à parede. 'Templo' comunica o referente de הַבַּיִת com clareza neste contexto.
- source_word: יצוע
  choice: uma estrutura
  rationale: O substantivo é raro e seu formato arquitetônico exato é incerto; a tradução genérica preserva essa incerteza, esclarecida em nota.
- source_word: סָבִיב
  choice: ao redor
  rationale: Preserva a ênfase reiterada na disposição circundante, com formulação natural em português.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: encostada às paredes do templo
  rationale: Mantém o plural explícito 'paredes' e torna clara a relação espacial da estrutura com o edifício.
- source_word: לַהֵיכָל
  choice: ao redor do salão principal
  rationale: הֵיכָל designa aqui o recinto principal, em contraste com o santuário interno; 'salão principal' é claro e evita o possível anacronismo de 'nave'.
- source_word: וְלַדְּבִיר
  choice: como do santuário interno
  rationale: דְּבִיר designa o recinto mais interior do templo; a expressão mantém a distinção arquitetônica sem impor terminologia litúrgica posterior.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: e fez salas laterais
  rationale: Embora צְלָעוֹת possa significar literalmente 'lados' ou 'costelas', no contexto arquitetônico refere-se a compartimentos laterais.
theological_decisions:
- issue: Designação do דְּבִיר
  choice: santuário interno
  alternative: Lugar Santíssimo
  rationale: A escolha traduz a função e a localização do recinto sem importar uma designação litúrgica mais interpretativa; a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição de 'ao redor' do hebraico, mas organiza a sintaxe para evitar obscuridade. 'Templo' é usado para o edifício neste contexto, enquanto 'salão principal' e 'santuário interno' preservam a distinção entre הֵיכָל e דְּבִיר.
