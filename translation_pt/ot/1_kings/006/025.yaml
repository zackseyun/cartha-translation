  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: pt
  text: O segundo querubim media dez côvados; os dois querubins tinham a mesma medida e a mesma forma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: também media dez côvados
  rationale: A expressão indica a dimensão do segundo querubim em continuidade com o versículo anterior. “Media” é natural em português, enquanto não acrescenta “de altura”, dimensão que o hebraico não explicita aqui; “também” comunica a correspondência com o primeiro querubim indicada pelo contexto e pela oração seguinte.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: o segundo querubim
  rationale: Tradução direta do substantivo definido seguido do ordinal, preservando o singular.
- source_word: מִדָּה אַחַת
  choice: a mesma medida
  rationale: Embora literalmente seja “uma medida”, a construção afirma que uma única medida era comum aos dois querubins. “A mesma medida” exprime essa relação com clareza e naturalidade.
- source_word: וְקֶצֶב אֶחָד
  choice: e a mesma forma
  rationale: קֶצֶב pode designar forma, proporção ou configuração. “Forma” mantém a amplitude do termo e é clara no contexto da correspondência entre as duas figuras.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: os dois querubins tinham
  rationale: A expressão significa literalmente “para os dois querubins”. A reestruturação com “tinham” produz português natural e conserva a ideia de que medida e forma eram comuns a ambos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém “côvados” como medida bíblica tradicional e tecnicamente precisa; evita inferir que os dez côvados indiquem especificamente a altura.
