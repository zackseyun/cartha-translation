base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/010.yaml
  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: pt
  text: Construiu a estrutura lateral ao longo de todo o templo[a], com cinco côvados de altura, e ela foi ligada ao templo com vigas de cedro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os aposentos laterais”. O termo hebraico provavelmente se refere à construção anexa que se estendia junto ao templo.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “e ele a ligou ao templo com madeiramento de cedro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Construiu
  rationale: O wayyiqtol de בנה indica a ação seguinte na narrativa. Em português, o sujeito pode permanecer implícito e a conjunção pode ser omitida com naturalidade.
- source_word: היצוע
  choice: a estrutura lateral
  rationale: O termo designa a construção anexa que acompanhava o edifício do templo. A expressão é abrangente e não limita indevidamente a referência a aposentos individuais.
- source_word: עַל כָּל הַבַּיִת
  choice: ao longo de todo o templo
  rationale: עַל tem aqui sentido espacial, indicando que a construção ficava junto ao edifício principal. 'Templo' torna explícito o referente contextual de הַבַּיִת, e 'todo' preserva כָּל.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: com cinco côvados de altura
  rationale: Reproduz de forma idiomática a medida e entende o sufixo de 'altura' como referência à estrutura lateral.
- source_word: וַיֶּאֱחֹז אֶת הַבַּיִת
  choice: e ela ficou presa ao templo
  rationale: אחז significa literalmente 'agarrar, segurar', mas neste contexto arquitetônico descreve uma ligação estrutural. A formulação evita sugerir que a estrutura perfurava as paredes do templo.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: por meio de vigas de cedro
  rationale: Em contexto de construção, עֲצֵי אֲרָזִים indica elementos estruturais de madeira de cedro; 'vigas' é claro e natural, embora 'madeiramento' também seja possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. 'Templo' foi usado para o edifício designado contextualmente como 'a casa'. A ambiguidade arquitetônica de היצוע é preservada em nota, e a alternativa de construção verbal em וַיֶּאֱחֹז também é registrada.
