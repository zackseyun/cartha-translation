  text: וְ/אֵת֩ כָּל קִיר֨וֹת הַ/בַּ֜יִת מֵסַ֣ב קָלַ֗ע פִּתּוּחֵי֙ מִקְלְעוֹת֙ כְּרוּבִ֣ים וְ/תִֽמֹרֹ֔ת וּ/פְטוּרֵ֖י צִצִּ֑ים מִ/לִּ/פְנִ֖ים וְ/לַ/חִיצֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: pt
  text: Em todas as paredes da Casa, ao redor, ele esculpiu figuras de querubins, palmeiras e flores abertas[a], tanto na parte interior como na exterior[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “flores desabrochadas”; o hebraico descreve motivos florais, mas sua forma artística exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir de modo mais literal: “por dentro e por fora”. No contexto, a expressão provavelmente se refere às partes interior e exterior do santuário.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: paredes da Casa
  rationale: “Casa” preserva o sentido literal de בַּיִת e seu uso, neste contexto, como designação do templo; a inicial maiúscula ajuda o leitor a reconhecer essa referência sem substituir o termo hebraico por “templo”.
- source_word: מֵסַב
  choice: ao redor
  rationale: Expressa de modo natural a extensão circundante da decoração.
- source_word: קָלַע פִּתּוּחֵי מִקְלְעוֹת
  choice: esculpiu figuras
  rationale: A combinação verbal e nominal descreve trabalho ornamental entalhado; a formulação evita uma repetição pouco natural em português e conserva a ideia de formas representadas em relevo ou entalhe.
- source_word: כְּרוּבִים
  choice: querubins
  rationale: É a forma bíblica tradicional e corrente em português para esses seres associados ao santuário.
- source_word: תִמֹרֹת
  choice: palmeiras
  rationale: O termo indica formas ou motivos de palmeira na ornamentação; “palmeiras” é claro e direto.
- source_word: פְטוּרֵי צִצִּים
  choice: flores abertas
  rationale: Reproduz a imagem provável de flores ou botões desabrochados, sem afirmar uma identificação botânica que o hebraico não permite.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: tanto na parte interior como na exterior
  rationale: Mantém a oposição espacial do hebraico sem especificar indevidamente se se trata de salas, faces das paredes ou setores do edifício.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e ampla compreensão internacional. “Casa” conserva o vocabulário cultual de Reis; “figuras” evita a redundância pouco idiomática de “entalhou entalhes”, e a nota final preserva a ambiguidade arquitetônica do hebraico.
