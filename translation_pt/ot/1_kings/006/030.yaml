base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: pt
  text: Ele revestiu de ouro o piso da casa[a], tanto no interior como no exterior.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o piso do templo”. Em hebraico, literalmente, “o piso da casa”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “no interior como no exterior” provavelmente indica que o piso foi revestido de ouro por toda a extensão, desde a parte interna até a externa.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: piso
  rationale: No contexto arquitetônico da construção do templo, o termo indica a superfície sobre a qual se anda; “piso” é a forma mais natural em português.
- source_word: הַבַּיִת
  choice: da casa
  rationale: Preserva a designação hebraica literal e contextual para o templo, sem substituir no texto principal pela interpretação “templo”.
- source_word: צִפָּה
  choice: revestiu
  rationale: O verbo descreve cobrir uma superfície com outro material; “revestiu de ouro” é expressão corrente e apropriada ao trabalho arquitetônico.
- source_word: זָהָב
  choice: de ouro
  rationale: Tradução direta do material mencionado, integrada naturalmente à regência portuguesa de “revestir”.
- source_word: לִפְנִימָה
  choice: na parte interior
  rationale: Expressa o âmbito interno e mantém o contraste espacial com o termo seguinte.
- source_word: וְלַחִיצוֹן
  choice: como na exterior
  rationale: Mantém o contraste entre interior e exterior. A construção correlativa “tanto... como...” comunica com clareza que o revestimento abrangia ambas as partes, sem eliminar a concisão do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Casa” preserva a formulação hebraica, enquanto a nota esclarece que se trata do templo. A ordem dos marcadores foi ajustada para que cada nota apareça junto da expressão que explica.
