base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/023.yaml
  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: pt
  text: No santuário interno,[a] ele fez dois querubins de madeira de oliveira, cada um com dez côvados de altura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Lugar Santíssimo”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “sua altura era de dez côvados”; o singular é entendido em sentido distributivo, referindo-se a cada um dos dois querubins.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: No santuário interno
  rationale: דְּבִיר designa o recinto mais interior do templo. “Santuário interno” é claro, natural e preserva a referência espacial sem impor terminologia técnica posterior.
- source_word: כְרוּבִים
  choice: querubins
  rationale: É o plural português consagrado de “querubim” e preserva o termo específico para esses seres bíblicos.
- source_word: עֲצֵי שָׁמֶן
  choice: de madeira de oliveira
  rationale: A expressão designa madeira da árvore de oliveira; esta formulação é clara e idiomática em português.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dez côvados
  rationale: “Côvado” é o equivalente português tradicional e preciso para a antiga unidade אַמָּה.
- source_word: קוֹמָתוֹ
  choice: cada um com dez côvados de altura
  rationale: O hebraico traz literalmente o singular “sua altura”, embora se refira a dois querubins. O singular é entendido distributivamente, aplicando a medida a cada um.
- source_word: וַיַּעַשׂ
  choice: ele fez
  rationale: Tradução direta e natural do verbo comum עשה neste contexto.
