  text: וְ/הָ/אוּלָ֗ם עַל פְּנֵי֙ הֵיכַ֣ל הַ/בַּ֔יִת עֶשְׂרִ֣ים אַמָּה֙ אָרְכּ֔/וֹ עַל פְּנֵ֖י רֹ֣חַב הַ/בָּ֑יִת עֶ֧שֶׂר בָּ/אַמָּ֛ה רָחְבּ֖/וֹ עַל פְּנֵ֥י הַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: pt
  text: O pórtico diante do salão principal do templo tinha vinte côvados de comprimento, acompanhando a largura do templo, e dez côvados de profundidade diante do templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sua largura”; neste contexto, refere-se à profundidade do pórtico, da frente para trás.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: o pórtico
  rationale: אוּלָם designa a estrutura de entrada diante do salão principal. “Pórtico” é um termo arquitetônico atual e apropriado; “vestíbulo” poderia sugerir um espaço interno fechado.
- source_word: עַל־פְּנֵי
  choice: diante de
  rationale: A expressão indica posição espacial em relação à frente do edifício.
- source_word: הֵיכַל הַבַּיִת
  choice: o salão principal do templo
  rationale: הֵיכַל refere-se aqui ao recinto principal do edifício, distinto do pórtico e do santuário interior. A formulação é mais acessível que o tecnicismo “nave” e explicita o referente contextual de הַבַּיִת.
- source_word: עֶשְׂרִים אַמָּה
  choice: vinte côvados
  rationale: Mantém-se a unidade antiga presente no hebraico, sem conversão aproximativa.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: Expressa naturalmente em português a dimensão longitudinal indicada pelo substantivo hebraico com sufixo pronominal.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: acompanhando a largura do templo
  rationale: A frase indica que o comprimento frontal do pórtico correspondia à largura do edifício. “Acompanhando” transmite essa relação sem sugerir que o pórtico atravessava o interior.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dez côvados
  rationale: O ב prefixado integra a expressão idiomática de medida; em português, basta indicar a dimensão.
- source_word: רָחְבּוֹ
  choice: de profundidade
  rationale: Literalmente, o termo significa “sua largura”, mas, na orientação do pórtico diante do templo, corresponde à extensão da frente para trás. “Profundidade” esclarece a geometria arquitetônica.
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: diante do templo
  rationale: Preserva a localização espacial da medida de dez côvados em frente ao edifício.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário arquitetônico acessível. “Templo” traduz contextual e naturalmente הַבַּיִת (“a casa”), evitando a possível ambiguidade de “casa” nesta descrição. A repetição final de “diante do templo” foi preservada por refletir a estrutura e a orientação espacial do hebraico.
