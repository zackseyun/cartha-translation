    issue: A nota b propõe «flores em botão» como alternativa a «flores abertas».
    rationale: Isso introduz um sentido contrário ao de פְּטוּרֵי צִצִּים, provavelmente flores abertas ou desabrochadas. A alternativa deve ser «flores desabrochadas» ou «flores em plena abertura».
