  text: וְ/אֶ֤רֶז אֶל הַ/בַּ֨יִת֙ פְּנִ֔ימָה מִקְלַ֣עַת פְּקָעִ֔ים וּ/פְטוּרֵ֖י צִצִּ֑ים הַ/כֹּ֣ל אֶ֔רֶז אֵ֥ין אֶ֖בֶן נִרְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: pt
  text: O revestimento de cedro no interior do templo era entalhado com cabaças[a] e flores abertas[b]. Tudo era cedro; não se via pedra alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «botões». O termo hebraico se refere a formas ornamentais arredondadas e, neste contexto, pode indicar entalhes semelhantes a cabaças.
    reason: lexical_alternative
  - marker: b
    text: Ou «flores desabrochadas». O hebraico provavelmente descreve ornamentos florais entalhados em plena abertura.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: cedro
  rationale: O substantivo designa a madeira ou o revestimento de cedro; em português, «cedro» expressa naturalmente o material.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: Por dentro, o templo era revestido
  rationale: A expressão localiza o cedro na superfície interior do edifício. «Era revestido» torna explícita a função arquitetônica indicada pelo contexto, sem sugerir apenas madeira guardada no interior.
- source_word: מִקְלַעַת
  choice: entalhado com
  rationale: O termo descreve trabalho decorativo talhado ou gravado. «Entalhado» é corrente e apropriado para ornamentação em madeira.
- source_word: פְּקָעִים
  choice: formas de frutos
  rationale: O termo designa ornamentos arredondados, tradicionalmente entendidos como semelhantes a frutos ou cabaças. A formulação preserva a incerteza quanto à forma botânica exata e evita a leitura moderna indesejada de «cabaças» como pessoas tolas.
- source_word: וּפְטוּרֵי צִצִּים
  choice: e flores abertas
  rationale: A expressão provavelmente descreve flores em plena abertura ou ornamentos florais. «Flores abertas» conserva a imagem e é clara em português moderno.
- source_word: הַכֹּל אֶרֶז
  choice: Tudo era cedro
  rationale: Reproduz de modo conciso a afirmação de que toda a superfície interior visível estava coberta de cedro.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: não se via pedra alguma
  rationale: Formulação portuguesa natural que preserva o sentido de que nenhuma parte da estrutura de pedra permanecia visível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com «templo» para deixar claro o referente contextual de «casa». A sintaxe apresenta primeiro o revestimento interior e depois os motivos entalhados, evitando uma leitura em que o próprio edifício fosse feito inteiramente de cedro.
