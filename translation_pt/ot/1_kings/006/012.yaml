base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: pt
  text: Quanto a esta casa que você está construindo, se andar nos meus estatutos, cumprir os meus juízos e guardar todos os meus mandamentos, andando neles, então confirmarei com você a minha palavra[a], a qual falei a Davi, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «estabelecerei com você a minha palavra» ou «cumprirei com você a minha promessa». A expressão hebraica «estabelecer a palavra» indica confirmar ou levar a efeito aquilo que foi dito anteriormente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר אַתָּה בֹנֶה
  choice: Quanto a esta casa que você está construindo
  rationale: “Casa” preserva o sentido literal de בַּיִת, embora o contexto identifique o edifício como o templo. A construção inicial funciona como tópico destacado, e o particípio בֹנֶה indica uma ação em andamento.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: se andar nos meus estatutos
  rationale: Mantém a metáfora pactual de הלך, que descreve a conduta de vida, e traduz חֻקִּים pelo termo jurídico tradicional e ainda compreensível “estatutos”.
- source_word: וְאֶת מִשְׁפָּטַי תַּעֲשֶׂה
  choice: cumprir os meus juízos
  rationale: “Cumprir” expressa de modo natural a prática exigida por תַּעֲשֶׂה, enquanto “juízos” conserva a força jurídico-pactual de מִשְׁפָּטִים.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: e guardar todos os meus mandamentos
  rationale: “Guardar” é uma equivalência corrente de שׁמר no contexto da obediência à aliança e preserva a distinção lexical entre mandamentos, estatutos e juízos.
- source_word: לָלֶכֶת בָּהֶם
  choice: andando neles
  rationale: Reproduz a segunda ocorrência da metáfora de andar e apresenta a obediência prática como modo de guardar os mandamentos.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: então estabelecerei com você a minha palavra
  rationale: Conserva a imagem do idioma hebraico הקים דבר e a relação expressa por אִתָּךְ, sem reduzir דָּבָר explicitamente a “promessa”. “Então” torna clara em português a consequência da condição antecedente.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: a qual falei a Davi, seu pai
  rationale: Mantém a ligação lexical entre “palavra” e “falei”, evitando explicitar no texto principal um sentido promissório que está implícito no contexto.
theological_decisions:
- issue: Relação condicional entre a construção do templo, a obediência de Salomão e a palavra dada a Davi
  choice: Preservar a estrutura explícita “se... então”, pela qual o estabelecimento da palavra com Salomão está ligado à obediência pactual.
  alternative: Tratar a declaração apenas como reafirmação incondicional da aliança davídica, ou como condição que elimina qualquer dimensão incondicional anterior.
  rationale: A sintaxe hebraica apresenta claramente uma condição e sua consequência. A tradução mantém essa tensão sem impor uma harmonização teológica externa ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” corresponde ao singular hebraico dirigido a Salomão. A pontuação destaca a abertura topicalizada do hebraico. Preservam-se os termos pactuais distintos e a repetição da metáfora de andar.
