  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: pt
  text: e duas portas de madeira de cipreste[a]; a primeira porta tinha duas folhas articuladas[b], e a segunda porta também tinha duas folhas articuladas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “madeira de abeto”; o hebraico provavelmente se refere ao cipreste ou a uma conífera semelhante.
    reason: lexical_alternative
  - marker: b
    text: Ou “duas partes laterais [...] giratórias”. Os termos arquitetônicos hebraicos são raros, e seu sentido exato é incerto; em geral, entende-se que se trata de folhas articuladas de uma porta.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: portas
  rationale: O plural designa as duas estruturas da entrada; “portas” é natural em português, enquanto as partes móveis de cada uma são chamadas de “folhas” na sequência.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: de madeira de cipreste
  rationale: בְּרוֹשׁ provavelmente indica cipreste ou outra conífera semelhante. “Madeira de cipreste” expressa de modo claro a construção hebraica.
- source_word: צְלָעִים / קְלָעִים
  choice: folhas
  rationale: Esses termos arquitetônicos raros parecem designar as duas partes ou painéis móveis de cada porta. “Folhas” é o termo português usual para as partes móveis de uma porta.
- source_word: גְּלִילִים
  choice: dobráveis
  rationale: O termo sugere movimento de girar, enrolar ou articular. No contexto, “folhas dobráveis” comunica a interpretação funcional mais comum sem tornar a frase obscura; a incerteza é preservada em nota.
- source_word: הַדֶּלֶת הָאַחַת / הַדֶּלֶת הַשֵּׁנִית
  choice: a primeira porta / a segunda porta
  rationale: A formulação explicita em português o contraste entre as duas portas, mantendo a progressão do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia arquitetônica comum. A conjunção inicial foi mantida porque o versículo continua a descrição anterior. A repetição de “porta” e “folhas dobráveis” conserva o paralelismo do hebraico.
