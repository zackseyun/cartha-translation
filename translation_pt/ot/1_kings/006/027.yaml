  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: pt
  text: 'Ele colocou os querubins no interior da parte mais interna do templo[a]. Os querubins estenderam as asas: a asa de um dos querubins tocava uma parede, e a asa do segundo querubim tocava a outra parede; as asas voltadas para o centro do templo tocavam-se, asa com asa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no santuário interior”. O hebraico diz literalmente “no interior da casa interna”, referindo-se à parte mais interna do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ele colocou
  rationale: נתן pode significar “dar”, “pôr” ou “colocar”; no contexto arquitetônico, “colocou” expressa naturalmente o posicionamento dos querubins.
- source_word: הַכְּרוּבִים
  choice: os querubins
  rationale: Mantém o termo tradicional para esses seres celestiais e o registro religioso do texto.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: no interior da parte mais interna do templo
  rationale: Preserva a ideia literal de uma “casa interior”, mas usa “templo” para tornar claro o referente arquitetônico; a formulação não identifica tecnicamente o recinto sem nota.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: Os querubins estenderam as asas
  rationale: Embora a forma hebraica possa ser lida literalmente como “estenderam as asas dos querubins”, o contexto apresenta naturalmente os próprios querubins como sujeito.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: tocava / tocavam
  rationale: נגע indica contato físico; o imperfeito descritivo em português apresenta adequadamente a disposição espacial resultante.
- source_word: כְּנַף הָאֶחָד
  choice: a asa de um
  rationale: Reflete o hebraico “a asa de um”, sem introduzir a noção de “primeiro”.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: o segundo querubim
  rationale: Conserva explicitamente o ordinal hebraico.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: a outra parede
  rationale: Em um contraste entre duas paredes, “a outra parede” é português natural e transmite o sentido do hebraico “a segunda parede”.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: as asas voltadas para o meio do templo
  rationale: תּוֹךְ denota interior ou meio; o encontro das asas mostra que aqui se trata da direção do centro do recinto.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: tocavam uma na outra, asa com asa
  rationale: A formulação mantém tanto a reciprocidade quanto a imagem literal e vívida de “asa com asa”.
