  text: וַ/יִּבֶן֩ אֶת קִיר֨וֹת הַ/בַּ֤יִת מִ/בַּ֨יְתָ/ה֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִ/קַּרְקַ֤ע הַ/בַּ֨יִת֙ עַד קִיר֣וֹת הַ/סִּפֻּ֔ן צִפָּ֥ה עֵ֖ץ מִ/בָּ֑יִת וַ/יְצַ֛ף אֶת קַרְקַ֥ע הַ/בַּ֖יִת בְּ/צַלְע֥וֹת בְּרוֹשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: pt
  text: Ele construiu as paredes do templo, por dentro, com tábuas de cedro. Desde o piso do templo até as paredes do teto[a], cobriu o interior com madeira; e revestiu o piso do templo com tábuas de cipreste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é incomum e provavelmente se refere ao teto interno ou ao revestimento sob o telhado.
    reason: cultural_note
  - marker: b
    text: Ou “tábuas de junípero”; tradicionalmente, “tábuas de abeto”. A identificação exata da árvore hebraica é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: Mantém o sentido básico do verbo בנה e a sequência narrativa, sem tornar obrigatório em português o conectivo inicial do hebraico.
- source_word: קִירוֹת הַבַּיִת
  choice: as paredes do templo
  rationale: קִירוֹת significa “paredes”; embora הַבַּיִת seja literalmente “a casa”, o referente contextual é o templo, e “templo” evita ambiguidade para o leitor moderno.
- source_word: מִבַּיְתָה
  choice: por dentro
  rationale: Expressa de modo natural a localização interior indicada pela forma direcional/local hebraica.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: com tábuas de cedro
  rationale: Neste contexto arquitetônico, צְלָעוֹת designa peças ou pranchas de madeira; אֲרָזִים é cedro.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: desde o piso do templo
  rationale: קַרְקַע, no interior de um edifício, refere-se naturalmente ao piso.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: até as paredes do teto
  rationale: A tradução conserva a construção incomum do hebraico, que parece indicar o limite superior do revestimento interno, sem resolver de modo excessivamente específico a referência arquitetônica.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: cobriu o interior com madeira
  rationale: צפה aqui significa cobrir ou revestir; a formulação portuguesa explicita naturalmente que o revestimento era interno.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: e revestiu o piso do templo
  rationale: “Revestiu” comunica a aplicação de uma camada de madeira sobre a superfície do piso.
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: com tábuas de cipreste
  rationale: צְלָעוֹת volta a designar tábuas; בְּרוֹשִׁים é um nome de árvore conífera cuja identificação exata é incerta, sendo “cipreste” uma opção moderna plausível.
theological_decisions: []
