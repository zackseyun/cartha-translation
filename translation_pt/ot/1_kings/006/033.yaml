base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/033.yaml
  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: pt
  text: E, do mesmo modo, fez para a entrada do salão principal ombreiras de madeira de oliveira, de quatro lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico obscuro; literalmente, “de uma quarta parte”. Talvez descreva uma moldura de quatro lados ou uma entrada quadrada.
    reason: Preserva a dificuldade textual e apresenta as principais interpretações arquitetônicas sem decidir além da evidência.
lexical_decisions:
- source_word: וְכֵן
  choice: E, do mesmo modo
  rationale: Expressa a continuidade e a correspondência com a construção descrita no versículo anterior.
- source_word: עָשָׂה
  choice: fez
  rationale: Equivalente simples e natural em um contexto de construção.
- source_word: לְפֶתַח הַהֵיכָל
  choice: para a entrada do salão principal
  rationale: Aqui, הֵיכָל designa o recinto principal do templo, distinto do santuário interior; 'salão principal' é claro sem recorrer ao termo técnico 'nave'.
- source_word: מְזוּזוֹת
  choice: ombreiras
  rationale: Designa os elementos verticais laterais que compõem o vão da porta.
- source_word: עֲצֵי שָׁמֶן
  choice: madeira de oliveira
  rationale: Tradução idiomática da expressão hebraica que, neste contexto, se refere à madeira de oliveira.
- source_word: מֵאֵת רְבִעִית
  choice: formando quatro lados
  rationale: A expressão hebraica é arquitetonicamente obscura. Esta formulação comunica a interpretação provável de uma estrutura em quatro lados sem afirmar que as próprias ombreiras eram quadrangulares.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Salão principal' evita o tecnicismo menos comum 'nave'; 'ombreiras' mantém a precisão arquitetônica.
