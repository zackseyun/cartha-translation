base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: pt
  text: A entrada da câmara lateral intermediária ficava no lado direito do templo. Por escadas sinuosas[a], subia-se ao pavimento intermediário e, deste, ao terceiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escadas em espiral». O termo hebraico é raro e provavelmente se refere a uma escada sinuosa ou em espiral.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «e do intermediário ao terceiro», isto é, do pavimento intermediário ao terceiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: entrada
  rationale: Designa a abertura ou via de acesso; «entrada» é natural e adequada à descrição arquitetônica.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: a câmara lateral intermediária
  rationale: No contexto do templo, צֵלָע se refere a uma câmara ou estrutura lateral, não a uma «costela» literal; תִּיכֹנָה significa «intermediária».
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: ficava no lado direito do templo
  rationale: כֶּתֶף, literalmente «ombro», indica aqui o lado da construção. «Direito» preserva o valor espacial de יְמָנִית sem convertê-lo de modo interpretativo em «sul».
- source_word: וּבְלוּלִּים
  choice: por escadas em espiral
  rationale: O termo raro é tradicionalmente entendido, neste contexto arquitetônico, como escadas sinuosas ou em espiral; a nota conserva a incerteza lexical.
- source_word: יַעֲלוּ
  choice: subia-se
  rationale: A terceira pessoa do plural tem sentido impessoal no contexto; a construção com «se» é idiomática em português.
- source_word: עַל הַתִּיכֹנָה
  choice: ao pavimento intermediário
  rationale: A sequência de níveis indica que o termo designa aqui o pavimento intermediário da estrutura lateral.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: e, deste, ao terceiro
  rationale: Expressa de modo natural a sequência arquitetônica, deixando «pavimento» subentendido no último membro, como no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário arquitetônico acessível. «Templo» traduz בַּיִת pelo referente contextual, evitando a possível impressão de uma residência comum. A formulação mantém a referência hebraica à câmara «intermediária», apesar da dificuldade arquitetônica do texto.
