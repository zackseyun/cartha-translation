base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: pt
  text: Ele construiu vinte côvados na parte posterior da Casa com tábuas de cedro, desde o piso até as paredes[a]; e construiu no interior um santuário interno[b], o Santo dos Santos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o piso até as vigas (ou os caibros)”. O texto hebraico diz literalmente “até as paredes”, leitura mantida aqui.'
    reason: alternative_reading
  - marker: b
    text: Hebraico debir, o recinto mais interior do templo.
    reason: cultural_note
  - marker: c
    text: Também traduzido como “Lugar Santíssimo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: da parte posterior da Casa
  rationale: Expressa a parte mais remota ou traseira do edifício; “Casa” designa aqui o templo no contexto.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: uma divisória de tábuas de cedro
  rationale: צלעות pode indicar elementos laterais, pranchas ou tábuas. O contexto mostra que esses elementos formavam a separação do recinto interno; “divisória” explicita naturalmente a função arquitetônica sem abandonar o material indicado.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: desde o piso até as paredes
  rationale: Mantém a leitura do texto massorético, embora a formulação seja arquitetonicamente difícil. A interpretação “até as vigas/caibros” fica registrada em nota.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: Assim, formou no interior
  rationale: A expressão hebraica é condensada e descreve a construção de um espaço interno. A formulação portuguesa esclarece a relação com a divisória mencionada sem acrescentar uma localização externa ao texto.
- source_word: לִדְבִיר
  choice: o santuário interno
  rationale: דביר é o termo técnico para o recinto mais interior do templo. “Santuário interno” comunica sua função em português atual.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: o Santo dos Santos
  rationale: Reproduz a expressão superlativa hebraica de modo tradicional, inteligível e culticamente preciso.
- source_word: אַמָּה
  choice: côvados
  rationale: Conserva a unidade antiga usada no texto hebraico, sem introduzir uma conversão aproximada no corpo do versículo.
