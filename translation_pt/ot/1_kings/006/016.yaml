revisions:
- from: Ele construiu, nos vinte côvados da parte posterior da Casa, uma divisória de tábuas de cedro, desde o piso até as paredes[a]. Assim, formou no interior o santuário interno[b], o Santo dos Santos[c].
  to: Ele construiu vinte côvados na parte posterior da Casa com tábuas de cedro, desde o piso até as paredes[a]; e construiu no interior um santuário interno[b], o Santo dos Santos[c].
  rationale: A revisão evita definir excessivamente os elementos de cedro como uma «divisória», conserva os dois verbos de construção do hebraico e apresenta com maior naturalidade os vinte côvados como a extensão da obra na parte posterior da Casa. As ambiguidades arquitetônicas e terminológicas relevantes permanecem registradas nas notas.
