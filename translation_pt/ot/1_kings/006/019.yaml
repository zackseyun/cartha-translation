base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: pt
  text: No interior da casa, ele preparou o santuário interior para colocar ali a arca da aliança de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבִיר
  choice: santuário interior
  rationale: No contexto do templo, designa o recinto mais interno, onde ficaria a arca. «Santuário interior» comunica com clareza tanto sua função como sua localização, sem recorrer ao tradicional, porém obscuro, «oráculo».
- source_word: בְּתוֹךְ הַבַּיִת
  choice: no interior da Casa
  rationale: Reproduz a expressão locativa e mantém «Casa» como correspondente de בַּיִת; a inicial maiúscula sinaliza que se trata da Casa de Yahweh, isto é, o templo, já identificado pelo contexto.
- source_word: מִפְּנִימָה
  choice: interior
  rationale: O advérbio reforça a localização interna. Em português, seu sentido é expresso naturalmente na combinação «No interior da Casa» e «santuário interior».
- source_word: הֵכִין
  choice: preparou
  rationale: O verbo indica tornar pronto ou dispor algo para determinada finalidade; «preparou» se liga naturalmente à oração de propósito seguinte sem especificar indevidamente o modo de construção.
- source_word: לְתִתֵּן
  choice: para colocar
  rationale: O infinitivo introduz a finalidade da preparação. «Colocar» é claro, natural e apropriado à instalação da arca no santuário.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Preserva de modo transparente a cadeia construta hebraica e mantém a relação entre a arca, a aliança e Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. «Yahweh» preserva o nome da aliança e corresponde de forma mais direta à transliteração adotada pelo projeto.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A ordem «No interior da Casa» evita uma sequência pesada de complementos, enquanto a repetição de «interior» preserva a ênfase espacial do hebraico. «Casa» mantém o termo-fonte, e a inicial maiúscula deixa claro seu uso como designação do templo.
