lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O qal wayyiqtol de בנה apresenta uma ação passada na sequência narrativa. “Construiu” é natural e preciso em português.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַבַּיִת
  choice: a casa
  rationale: בַּיִת significa literalmente “casa”. Neste contexto designa o templo, mas manter “a casa” preserva a expressão hebraica e a terminologia recorrente do capítulo.
- source_word: וַיְכַלֵּהוּ
  choice: e a terminou
  rationale: A forma piel de כלה, com sufixo pronominal masculino singular, significa concluir ou terminar algo. Em português, o pronome feminino “a” retoma naturalmente “a casa”.
