  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: pt
  text: Nelas esculpiu querubins, palmeiras e flores abertas, e revestiu-as de ouro ajustado ao trabalho entalhado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouro uniformemente estendido sobre o trabalho entalhado”. O sentido preciso da expressão hebraica final admite mais de uma compreensão.'
    reason: Preserva a ambiguidade de מְיֻשָּׁר quanto à maneira pela qual o ouro cobria ou acompanhava os entalhes.
lexical_decisions:
- source_word: וְקָלַע
  choice: esculpiu
  rationale: O verbo descreve aqui a execução de figuras em relevo ou entalhe nas portas; “esculpiu” é natural e preserva o caráter artesanal.
- source_word: כְרוּבִים
  choice: querubins
  rationale: Equivalente tradicional e claro para as figuras celestiais representadas na decoração do templo.
- source_word: וְתִמֹרוֹת
  choice: palmeiras
  rationale: Traduz diretamente o motivo ornamental de palmeiras.
- source_word: וּפְטֻרֵי צִצִּים
  choice: flores abertas
  rationale: A expressão designa flores desabrochadas ou abertas, em consonância com o vocabulário ornamental do contexto.
- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: ajustado sobre o trabalho entalhado
  rationale: Preserva a ideia de que o ouro foi aplicado de modo a acompanhar ou se conformar aos entalhes, sem resolver excessivamente o sentido preciso de מְיֻשָּׁר.
