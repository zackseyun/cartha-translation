  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: pt
  text: A casa que o rei Salomão construiu para Yahweh tinha sessenta côvados de comprimento, vinte côvados de largura[a] e trinta côvados de altura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, a palavra “côvados” não se repete nesta medida, mas fica subentendida pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: A casa
  rationale: בַּיִת significa literalmente “casa” e, neste contexto, designa o templo; “casa” preserva tanto a forma hebraica quanto sua ressonância teológica. A conjunção inicial não precisa ser expressa em português neste enunciado descritivo.
- source_word: אֲשֶׁר בָּנָה הַמֶּלֶךְ שְׁלֹמֹה
  choice: que o rei Salomão construiu
  rationale: A oração relativa e o perfeito de בָּנָה são traduzidos de forma direta e natural; o título seguido do nome mantém a ordem idiomática do português.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica aqui destinação ou dedicação, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: sessenta côvados de comprimento
  rationale: Reproduz com clareza o número, a unidade e a dimensão indicada por אָרְכּוֹ.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: vinte côvados de largura
  rationale: Embora “côvados” não seja repetido no hebraico, a unidade está elipticamente subentendida pela sequência de medidas e deve ser explicitada para clareza natural em português.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: trinta côvados de altura
  rationale: קוֹמָה indica altura; a formulação nominal é corrente e precisa em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação fornecida, enquanto “SENHOR” representa a tradição de substituição na leitura e “Javé” é outra forma portuguesa difundida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva “casa” em vez de substituir por “templo”, explicita a unidade elíptica na segunda medida e usa “tinha ... de comprimento” como formulação idiomática sem alterar o sentido.
