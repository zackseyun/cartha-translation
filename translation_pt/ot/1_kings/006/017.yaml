base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: pt
  text: E a casa[a], isto é, o salão principal diante do santuário interno, tinha quarenta côvados de comprimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O edifício, isto é, o salão principal à frente dele”. O hebraico identifica mais precisamente “a casa” como o הֵיכָל, o recinto principal diante do santuário interno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: E ... quarenta
  rationale: A conjunção liga o versículo à descrição arquitetônica anterior; o numeral é traduzido diretamente.
- source_word: בָּ/אַמָּה
  choice: côvados de comprimento
  rationale: אַמָּה é a medida linear padrão, o côvado; acrescentar “de comprimento” expressa naturalmente a dimensão indicada pelo contexto.
- source_word: הָיָה
  choice: tinha
  rationale: Em português, “tinha quarenta côvados de comprimento” comunica de modo natural o valor dimensional da construção.
- source_word: הַ/בָּיִת
  choice: a Casa
  rationale: בַּיִת significa literalmente “casa” e designa aqui o edifício do templo. A maiúscula ajuda a indicar esse uso referencial, enquanto a explicação seguinte especifica a parte em vista.
- source_word: ה֖וּא
  choice: isto é
  rationale: O pronome tem força apositiva ou explicativa, identificando mais precisamente “a Casa”.
- source_word: הַ/הֵיכָל
  choice: o salão principal
  rationale: הֵיכָל designa aqui o recinto principal do edifício, distinto do santuário interno. “Salão principal” é claro e arquitetonicamente adequado em português, sem importar terminologia técnica posterior.
- source_word: לִ/פְנָֽ/י
  choice: diante do santuário interno
  rationale: A expressão significa “diante de/à frente de”; o referente contextual, mencionado no versículo anterior, é explicitado para tornar clara a relação espacial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Salão principal” foi preferido a “nave”, que pode soar excessivamente técnico ou associado à arquitetura eclesiástica posterior. A ordem foi levemente ajustada ao idioma receptor, preservando a aposição explicativa e a relação espacial do hebraico.
