  language: pt
  text: Assim, ele construiu o templo e o terminou; cobriu o templo com vigas e fileiras de cedro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת (habáyit)
  choice: o templo
  rationale: Embora o termo signifique literalmente “a casa”, neste contexto designa o templo que Salomão estava construindo; “templo” comunica naturalmente o referente ao leitor moderno.
- source_word: וַיְכַלֵּהוּ (vayekhallêhu)
  choice: e o terminou
  rationale: Expressa de modo direto a conclusão da construção, preservando o objeto pronominal masculino.
- source_word: וַיִּסְפֹּן (vayyispón)
  choice: cobriu
  rationale: O verbo indica cobrir ou revestir a construção; “cobriu” mantém a formulação abrangente e evita especificar indevidamente se a referência é apenas ao teto ou também ao revestimento.
- source_word: גֵּבִים (gevím)
  choice: vigas
  rationale: No contexto arquitetônico, o substantivo se refere aos elementos estruturais de madeira, adequadamente expressos como “vigas”.
- source_word: שְׂדֵרֹת (sederót)
  choice: fileiras
  rationale: O termo denota filas ou disposições alinhadas. “Fileiras” preserva a imagem do hebraico sem substituí-la pela interpretação mais específica “tábuas”.
- source_word: בָּאֲרָזִים (ba’arazím)
  choice: de cedro
  rationale: O plural hebraico refere-se à madeira de cedro empregada na estrutura; em português, o singular coletivo é a forma idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “templo” para identificar naturalmente o referente contextual de “casa”. A coordenação e a repetição de “templo” acompanham a estrutura enfática do hebraico. Não foram necessárias notas de rodapé.
