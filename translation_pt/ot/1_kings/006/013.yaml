  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: pt
  text: Habitarei no meio dos israelitas[a] e não abandonarei o meu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Habitarei
  rationale: O verbo שׁכן expressa habitar ou estabelecer presença. “Habitarei” conserva a ressonância da presença pactual de Deus e é natural em português bíblico moderno.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: A expressão indica presença dentro da comunidade. “No meio de” preserva mais diretamente a imagem hebraica sem sugerir localização metafísica exclusiva.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora literalmente signifique “filhos de Israel”, aqui é uma designação coletiva do povo; “os israelitas” é claro, inclusivo e corrente em português.
- source_word: וְלֹא אֶעֱזֹב
  choice: e não abandonarei
  rationale: עזב tem aqui força relacional e pactual. “Abandonarei” comunica com clareza a promessa de que Deus não deixará seu povo desamparado.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Reproduz naturalmente a fórmula possessiva pactual do hebraico.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada do nome próprio em português.
theological_decisions:
- issue: Linguagem da presença divina no contexto do templo
  choice: “Habitarei no meio dos israelitas”
  alternative: “Morarei entre os filhos de Israel”
  rationale: A formulação expressa a presença pactual de Deus com o povo sem restringi-la metafisicamente ao templo. Mantém a ênfase do texto na presença no meio de Israel.
translation_notes:
  register: Português moderno, digno e de ampla compreensão. “Habitarei” preserva a solenidade teológica; “israelitas” evita que a expressão coletiva seja entendida como referente apenas a descendentes masculinos. O marcador [a] aparece no texto principal.
