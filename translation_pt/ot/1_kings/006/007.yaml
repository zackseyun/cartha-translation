base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: pt
  text: A Casa, quando estava sendo construída, foi edificada com pedras inteiras, previamente preparadas[a]; não se ouviu na Casa, durante a construção, nem martelo, nem machado, nem qualquer ferramenta de ferro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pedras inteiras, preparadas na pedreira” ou “pedras inteiras, trazidas da pedreira”. O termo hebraico מַסָּע é técnico e pode se referir à pedreira, à extração ou ao transporte de pedras já preparadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: a Casa
  rationale: O substantivo hebraico significa literalmente “casa” e, no contexto, designa o templo. Mantém-se “Casa”, com inicial maiúscula para tornar clara essa referência sem substituir o termo fonte por “templo”.
- source_word: בְּהִבָּנֹתוֹ
  choice: quando estava sendo construída / durante a construção
  rationale: O infinitivo construto com בְּ expressa circunstância temporal. As duas ocorrências são vertidas de modo idiomático, preservando na primeira o aspecto processual e tornando a segunda concisa.
- source_word: אֶבֶן שְׁלֵמָה
  choice: pedras inteiras
  rationale: שְׁלֵמָה indica aquilo que está inteiro ou completo. “Pedras inteiras” preserva esse sentido básico sem especificar, além do texto, uma técnica de acabamento.
- source_word: מַסָּע
  choice: preparadas na pedreira
  rationale: O termo técnico e raro parece indicar a pedreira, a extração ou o transporte de pedras já prontas. A tradução comunica que a preparação ocorreu antes de elas chegarem ao local da obra, enquanto a nota registra a incerteza lexical.
- source_word: נִבְנָה
  choice: foi edificada
  rationale: O nifal perfeito descreve como a Casa foi construída. “Foi edificada” é natural no contexto arquitetônico e evita repetição imediata de “construída”.
- source_word: מַקָּבוֹת
  choice: martelo
  rationale: Embora a forma hebraica seja plural, ela integra uma enumeração de tipos de ferramentas; o singular genérico é idiomático em português.
- source_word: הַגַּרְזֶן
  choice: machado
  rationale: “Machado” é o equivalente mais direto, embora um instrumento semelhante, como a enxó, seja possível.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: qualquer ferramenta de ferro
  rationale: כָּל tem aqui sentido distributivo e abrangente. A expressão portuguesa é clara e preserva essa totalidade.
- source_word: לֹא נִשְׁמַע
  choice: não se ouviu
  rationale: O nifal de שׁמע é passivo (“não foi ouvido”); a construção impessoal com “se” é mais natural em português e conserva o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Casa” preserva o termo hebraico e recebe inicial maiúscula por designar o templo neste contexto. A formulação mantém a ênfase do versículo na preparação prévia das pedras e no silêncio das ferramentas de ferro no local da construção.
