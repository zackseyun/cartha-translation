  text: וְ/לִ/פְנֵ֣י הַ/דְּבִ֡יר עֶשְׂרִים֩ אַמָּ֨ה אֹ֜רֶךְ וְ/עֶשְׂרִ֧ים אַמָּ֣ה רֹ֗חַב וְ/עֶשְׂרִ֤ים אַמָּה֙ קֽוֹמָת֔/וֹ וַ/יְצַפֵּ֖/הוּ זָהָ֣ב סָג֑וּר וַ/יְצַ֥ף מִזְבֵּ֖חַ אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: pt
  text: O santuário interior tinha vinte côvados de comprimento, vinte de largura e vinte de altura.[a] Ele o revestiu de ouro puro[b] e revestiu também o altar de cedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O início do texto hebraico é condensado e pode ser entendido mais literalmente como: “Diante do santuário interior havia vinte côvados de comprimento...”. Pelo contexto, as medidas são as do próprio santuário interior.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Ou: “ouro fino”. A expressão hebraica indica ouro de alta qualidade ou refinado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: O santuário interior tinha
  rationale: A construção hebraica é comprimida e literalmente começa com algo como “e diante da câmara interior”. No contexto, porém, as medidas descrevem o recinto interior. A formulação portuguesa comunica esse sentido sem introduzir o título teológico mais específico “Santo dos Santos”; a ambiguidade sintática é registrada em nota.
- source_word: הַדְּבִיר
  choice: o santuário interior
  rationale: דְּבִיר designa a câmara mais interna do templo. “Santuário interior” é claro, digno e próximo do valor arquitetônico do termo.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ וְעֶשְׂרִים אַמָּה רֹחַב וְעֶשְׂרִים אַמָּה קוֹמָתוֹ
  choice: vinte côvados de comprimento, vinte de largura e vinte de altura
  rationale: Preserva a unidade antiga e a forma cúbica indicada pelo texto, evitando repetição desnecessária de “côvados” em português.
- source_word: וַיְצַפֵּהוּ
  choice: Ele o revestiu
  rationale: O verbo צפה, neste contexto, indica cobrir ou revestir uma superfície com metal. O pronome retoma o santuário interior.
- source_word: זָהָב סָגוּר
  choice: ouro puro
  rationale: A expressão indica ouro de alta qualidade ou refinado. “Ouro puro” é natural em português; “ouro fino” permanece uma alternativa legítima e é indicada em nota.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: revestiu também o altar de cedro
  rationale: A sequência aponta para um altar feito de cedro que recebeu revestimento. O artigo definido é adequado ao altar conhecido no contexto; “também” expressa naturalmente a coordenação hebraica.
theological_decisions:
- issue: Identificação de הַדְּבִיר
  choice: santuário interior
  alternative: Santo dos Santos
  rationale: A escolha preserva a referência arquitetônica do termo sem impor como tradução principal uma designação teológica posterior ou mais interpretativa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém “côvados” como unidade antiga, usa linguagem arquitetônica clara e evita terminologia confessional desnecessária.
