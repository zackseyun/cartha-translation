  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Salomão, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A construção narrativa com וַיְהִי faz avançar o relato. Em português atual, “Então ... veio” mantém a sequência sem o literalismo pouco natural de “E aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula דְּבַר יְהוָה, “a palavra” preserva a expressão bíblica recorrente para uma comunicação divina; “mensagem” seria possível, mas menos formalmente próxima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Indica naturalmente em português o destinatário da comunicação divina.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz o conteúdo do discurso divino no versículo seguinte e preserva de modo conciso a ligação formal do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título; “Javé” é uma forma portuguesa conhecida, mas “Yahweh” representa mais diretamente a transliteração adotada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi ajustada à narrativa natural em português, mantendo a fórmula profética “a palavra de Yahweh” e o particípio introdutório “dizendo” para conectar o versículo à fala seguinte.
