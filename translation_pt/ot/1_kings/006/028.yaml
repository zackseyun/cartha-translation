  rationale: “Querubins” é o plural consagrado e amplamente compreendido em português para כְּרוּבִים, apropriado ao mobiliário sagrado do templo.
- source_word: זָהָב
  choice: de ouro
  rationale: O substantivo designa o material do revestimento; após “revestiu”, a construção portuguesa idiomática é “de ouro”.
