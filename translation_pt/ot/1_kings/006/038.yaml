reference: 1 Kings 6:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָה֩ הָ/אַחַ֨ת עֶשְׂרֵ֜ה בְּ/יֶ֣רַח בּ֗וּל ה֚וּא הַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י כָּלָ֣ה הַ/בַּ֔יִת לְ/כָל דְּבָרָ֖י/ו וּ/לְ/כָל משפט/ו וַ/יִּבְנֵ֖/הוּ שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: pt
  text: No décimo primeiro ano, no mês de Bul[a] — isto é, o oitavo mês —, a Casa foi concluída em todos os seus detalhes e de acordo com todas as suas especificações[b]. Assim, ele levou sete anos para construí-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bul era o antigo nome do oitavo mês do calendário israelita.
    reason: cultural_note
  - marker: b
    text: 'Ou: “conforme todos os seus detalhes e todo o seu plano prescrito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: No décimo primeiro ano
  rationale: Emprega a forma ordinal natural em português e preserva a informação cronológica do hebraico.
- source_word: בְּיֶרַח בּוּל
  choice: no mês de Bul
  rationale: Traduz יֶרַח por “mês” e translitera o antigo nome próprio do mês.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: isto é, o oitavo mês
  rationale: Expressa naturalmente o valor explicativo da aposição hebraica.
- source_word: כָּלָה הַבַּיִת
  choice: a Casa foi concluída
  rationale: כלה indica a conclusão da construção; “Casa”, com inicial maiúscula, conserva a designação hebraica do edifício e sinaliza no contexto que se trata do templo.
- source_word: לְכָל דְּבָרָיו
  choice: em todos os seus detalhes
  rationale: Neste contexto de construção, דְּבָרָיו se refere aos detalhes ou elementos da obra, não a palavras faladas.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: de acordo com todas as suas especificações
  rationale: No contexto arquitetônico, מִשְׁפָּטוֹ denota a forma prescrita, o plano ou as especificações da construção, e não um julgamento jurídico.
- source_word: וַיִּבְנֵהוּ שֶׁבַע שָׁנִים
  choice: Assim, ele levou sete anos para construí-la
  rationale: Formulação portuguesa idiomática que comunica o resumo da duração total da construção sem alterar o sujeito implícito do hebraico.
theological_decisions:
- issue: Identificação de הַבַּיִת como o templo
  choice: a Casa
  alternative: o templo
  rationale: “Casa” preserva a metáfora e a designação do texto hebraico, enquanto a inicial maiúscula ajuda o leitor a reconhecer o edifício sagrado no contexto sem substituir explicitamente o termo por “templo”.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. Os travessões destacam a explicação calendárica sem quebrar o fluxo. O pronome “ele” preserva o sujeito implícito e contextual, sem inserir o nome de Salomão no versículo.
