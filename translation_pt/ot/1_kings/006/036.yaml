lexical_decisions:
- source_word: וַיִּבֶן
  choice: E ele construiu
  rationale: O wayyiqtol de בנה dá continuidade à sequência narrativa; esta formulação preserva essa ligação sem acrescentar uma nuance temporal específica.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: o pátio interior
  rationale: חָצֵר designa um pátio ou átrio, e פְּנִימִית o qualifica como interior; “pátio interior” é claro e natural no contexto do templo.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: três fileiras de
  rationale: טוּר pode indicar uma fileira ou fiada numa construção. “Fileiras” é acessível ao leitor comum, enquanto a alternativa arquitetônica “fiadas” é preservada em nota.
- source_word: גָזִית
  choice: pedras lavradas
  rationale: גָזִית refere-se a pedra trabalhada ou talhada para uso em alvenaria; “pedras lavradas” comunica essa ideia em português bíblico atual e inteligível.
- source_word: וְטוּר
  choice: e uma fileira de
  rationale: O substantivo singular indica uma fileira adicional, embora o numeral “uma” não esteja expresso separadamente no hebraico; o artigo indefinido é natural em português.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: vigas de cedro
  rationale: A expressão denota peças cortadas de cedro usadas na construção. “Vigas de cedro” transmite de modo natural sua provável função arquitetônica sem redundância.
