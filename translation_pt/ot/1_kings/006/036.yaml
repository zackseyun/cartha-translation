  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: pt
  text: E ele construiu o pátio interior com três fileiras de pedras lavradas e uma fileira de vigas de cedro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “três fiadas de pedra lavrada e uma fiada de vigas de cedro”.'
