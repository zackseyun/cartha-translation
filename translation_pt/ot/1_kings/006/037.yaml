  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: pt
  text: No quarto ano, foram lançados os alicerces da casa de Yahweh, no mês de Ziv.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: No quarto ano
  rationale: Reproduz a expressão temporal hebraica sem acrescentar “do reinado de Salomão”, informação dada pelo contexto, mas não repetida neste versículo.
- source_word: יֻסַּד
  choice: foram lançados os alicerces
  rationale: O passivo de יסד indica fundar ou lançar os alicerces. Esta formulação é natural em português no contexto de uma construção e preserva o sentido concreto.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: “Casa” preserva a imagem do hebraico בַּיִת, embora o referente seja o templo; Yahweh translitera o nome divino יְהוָה.
- source_word: בְּיֶרַח זִו
  choice: no mês de zive
  rationale: Traduz diretamente יֶרַח como “mês” e apresenta זִו como o nome próprio do mês, sem acrescentar a identificação contextual como segundo mês.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama; “Yahweh” preserva o nome próprio e segue a orientação do projeto sem inserir uma forma substitutiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção concreta “foram lançados os alicerces” evita o pouco natural “a casa foi fundada” e expressa adequadamente o passivo hebraico. O nome do mês é grafado “zive”, forma aportuguesada e legível.
