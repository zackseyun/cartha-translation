base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: pt
  text: Salomão revestiu de ouro puro[a] o interior do templo. Estendeu correntes de ouro diante do santuário interior[b][c] e o revestiu de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouro refinado”. A expressão hebraica diz literalmente “ouro fechado” e parece ser uma designação de ouro de alta qualidade.
    reason: lexical_alternative
  - marker: b
    text: 'Também é possível entender: “estendeu correntes de ouro atravessando a frente do santuário interior”. O hebraico indica que Salomão fez as correntes passar diante dele, mas não define claramente sua disposição.'
    reason: alternative_reading
  - marker: c
    text: O “santuário interior” era o recinto mais interno do templo, mais tarde chamado de Lugar Santíssimo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: revestiu
  rationale: No contexto da construção do templo, צפה indica cobrir uma superfície com uma camada de metal; “revestiu” é natural e preciso em português.
- source_word: הַבַּיִת
  choice: o templo
  rationale: Embora o hebraico diga literalmente “a casa”, no contexto a referência é inequívoca ao edifício do templo; “templo” oferece clareza imediata ao leitor moderno.
- source_word: מִפְּנִימָה
  choice: o interior
  rationale: A forma adverbial aponta para a parte interna do edifício; “o interior” preserva com clareza o sentido espacial.
- source_word: זָהָב סָגוּר
  choice: ouro puro
  rationale: A expressão incomum, literalmente associada a ouro “fechado”, designa provavelmente ouro de alta qualidade ou refinado; “ouro puro” comunica o sentido provável, com a incerteza registrada em nota.
- source_word: וַיְעַבֵּר
  choice: estendeu
  rationale: O hifil de עבר tem o sentido de fazer passar; com correntes como objeto, “estendeu” descreve naturalmente sua colocação diante do santuário interior sem definir em excesso a disposição exata.
- source_word: בְּרַתּוּקוֹת
  choice: correntes
  rationale: O substantivo raro é mais provavelmente uma referência a correntes ou elos; “correntes” é a tradução contextual mais bem sustentada.
- source_word: לִפְנֵי הַדְּבִיר
  choice: diante do santuário interior
  rationale: לִפְנֵי significa literalmente “diante de” ou “em frente de”. Esta formulação preserva a ambiguidade sobre se as correntes atravessavam toda a frente, possibilidade explicada em nota.
- source_word: הַדְּבִיר
  choice: o santuário interior
  rationale: דְּבִיר designa o recinto mais interno do templo. “Santuário interior” é claro e evita substituir o termo por uma designação técnica posterior no texto principal.
- source_word: וַיְצַפֵּהוּ
  choice: o revestiu
  rationale: Mantém o pronome masculino singular do hebraico e sua referência potencialmente ambígua, provavelmente ao santuário interior ou à estrutura diante dele.
