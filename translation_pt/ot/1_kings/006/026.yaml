  register: Português moderno, claro e digno, com sintaxe natural e vocabulário bíblico amplamente reconhecido. A repetição parcial de «querubim» preserva a identificação explícita dos dois elementos, enquanto «era igual» comunica de forma concisa que ambos tinham a mesma altura.
