  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: pt
  text: A altura de um querubim era de dez côvados[a], e a do segundo querubim era igual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O côvado era uma antiga unidade de comprimento, aproximadamente a distância do cotovelo à ponta dos dedos.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: A altura de
  rationale: קוֹמָה indica altura ou estatura; no contexto das dimensões dos objetos do templo, «altura» é a opção mais natural e precisa.
- source_word: הַכְּרוּב הָאֶחָד
  choice: um querubim
  rationale: A expressão distingue um dos dois querubins. Em português corrente, «um querubim» transmite essa referência de modo mais natural do que o literal «o querubim, o um».
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dez côvados
  rationale: A expressão fornece diretamente a medida; como «altura» já aparece no início, não é necessário repetir «de altura».
- source_word: וְכֵן
  choice: era igual
  rationale: וְכֵן estabelece que a mesma medida se aplicava ao segundo querubim. «Era igual» expressa com clareza essa equivalência no contexto.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: o segundo querubim
  rationale: O hebraico emprega explicitamente o ordinal «segundo», preservado na tradução.
