base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: pt
  text: Uma asa do querubim media cinco côvados, e a segunda asa do querubim media cinco côvados; da ponta de uma de suas asas até a ponta da outra havia dez côvados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a envergadura completa, da ponta de uma asa à ponta da outra.
    reason: Esclarece que a expressão hebraica mede toda a distância entre as extremidades das duas asas.
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: Expressão padrão de medida; “côvado” é o equivalente tradicional e claro de אַמָּה em descrições arquitetônicas bíblicas.
- source_word: כְּנַף
  choice: asa
  rationale: No contexto das figuras de querubins, o termo designa claramente uma asa.
- source_word: הַכְּרוּב
  choice: o querubim
  rationale: O substantivo singular refere-se a uma das figuras celestiais esculpidas; “querubim” é a forma portuguesa consagrada.
- source_word: הָאֶחָת
  choice: uma
  rationale: Preserva o sentido hebraico de “uma”, sem transformá-lo explicitamente em “primeira”.
- source_word: הַשֵּׁנִית
  choice: a segunda
  rationale: Tradução direta do ordinal feminino, que concorda com “asa”.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dez côvados
  rationale: Indica a medida total da envergadura.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: de uma ponta ... até a outra ponta
  rationale: Comunica naturalmente em português a extensão entre as duas extremidades, sem deixar a repetição hebraica sugerir que se trata da mesma ponta.
- source_word: כְּנָפָיו
  choice: suas asas
  rationale: O possessivo retoma naturalmente o querubim em português e preserva o referente singular do sufixo hebraico.
