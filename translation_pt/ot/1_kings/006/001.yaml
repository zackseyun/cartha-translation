source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: pt
  text: Aconteceu que, no ano quatrocentos e oitenta depois que os filhos de Israel[a] saíram da terra do Egito, no quarto ano do reinado de Salomão sobre Israel, no mês de Zive — isto é, o segundo mês[b] —, ele construiu[c] a casa para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os israelitas» ou «o povo de Israel». O hebraico diz literalmente «os filhos de Israel».'
    reason: lexical_alternative
  - marker: b
    text: Zive era o antigo nome do segundo mês do calendário hebraico.
    reason: cultural_note
  - marker: c
    text: 'Pelo contexto, também se pode expressar: «começou a construir». O verbo hebraico, porém, diz simplesmente «construiu».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz a notícia cronológica e preserva a transição narrativa do hebraico sem recorrer à fórmula arcaica «sucedeu».
- source_word: בִשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: no quadringentésimo octogésimo ano
  rationale: A construção hebraica indica o 480º ano como ponto cronológico específico, não apenas um período aproximado de 480 anos.
- source_word: לְצֵאת
  choice: depois que ... saíram
  rationale: O infinitivo com ל estabelece a saída como ponto de referência temporal; a oração finita é natural em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar e corporativa do hebraico; uma nota registra a alternativa idiomática «israelitas».
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Preserva o substantivo אֶרֶץ, explicitamente presente no texto.
- source_word: בְּחֹדֶשׁ זִו
  choice: no mês de Zive
  rationale: Conserva o nome histórico do mês, com grafia adaptada ao português.
- source_word: הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: isto é, o segundo mês
  rationale: Reproduz de modo natural a explicação parentética dada pelo próprio texto.
- source_word: לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: do reinado de Salomão sobre Israel
  rationale: Expressa com concisão a datação pelo quarto ano em que Salomão reinava sobre Israel.
- source_word: וַיִּבֶן
  choice: construiu
  rationale: Traduz diretamente o verbo simples בנה. O contexto indica o início da obra, mas isso não é lexicalmente explicitado pelo verbo.
- source_word: הַבַּיִת
  choice: a casa
  rationale: Preserva a designação hebraica literal e tradicional do santuário, em vez de substituir o termo por «templo».
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Mantém o nome divino pessoal יהוה e o valor da preposição ל, que apresenta Yahweh como aquele para quem a casa é construída.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o tetragrama como nome próprio. «Yahweh» o representa diretamente, sem substituí-lo por um título.
- issue: Sentido aspectual de וַיִּבֶן no contexto da construção do templo
  choice: construiu
  alternative: começou a construir
  rationale: Embora o marco cronológico se refira ao início da obra, o hebraico emprega simplesmente «construiu». A tradução mantém essa forma e registra em nota a leitura contextual possível.
- issue: Designação do santuário por הַבַּיִת
  choice: a casa
  alternative: o templo
  rationale: «Casa» conserva a metáfora teológica e a terminologia do texto hebraico; «templo» esclareceria o referente, mas eliminaria essa formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se «filhos de Israel», «casa» e o nome histórico «Zive» para refletir a textura do hebraico; notas breves esclarecem as alternativas idiomáticas e contextuais.
