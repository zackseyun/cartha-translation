revisions:
- from: O andar inferior tinha cinco côvados de largura; o intermediário, seis côvados; e o terceiro, sete côvados. Isso porque Salomão fez saliências[a] ao redor de toda a parte externa do templo, para que as vigas não fossem encaixadas nas paredes do templo.[b]
  to: O andar inferior tinha cinco côvados de largura; o intermediário, seis côvados; e o terceiro, sete côvados. Pois ele fez recuos[a] em toda a parte externa do templo, para que as vigas não fossem fixadas nas paredes do templo.[b]
  rationale: A revisão substitui “saliências” por “recuos”, termo mais compatível com a função arquitetônica indicada pela oração final, e melhora a fluidez da frase. Mantém-se a explicitação contextual de “vigas”, devidamente qualificada na nota, e remove-se “Salomão” para refletir mais de perto o sujeito implícito do hebraico.
