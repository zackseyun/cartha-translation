  - severity: low
    issue: Formulação “ao redor de toda a parte externa”
    rationale: É redundante e pouco fluida em português moderno; “em toda a parte externa” conserva o sentido de סביב חוצה com maior naturalidade.
  - severity: low
    issue: “Encaixadas” especifica excessivamente o modo de fixação
    rationale: O hebraico expressa a finalidade de não se prender/firmar nas paredes. “Fixadas” é mais abrangente e natural, enquanto a nota pode preservar a formulação literal e a explicitação contextual de “vigas”.
