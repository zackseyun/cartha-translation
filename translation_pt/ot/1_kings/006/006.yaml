base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: pt
  text: O andar inferior tinha cinco côvados de largura; o intermediário, seis côvados; e o terceiro, sete côvados. Pois ele fez recuos[a] em toda a parte externa do templo, para que as vigas não fossem fixadas nas paredes do templo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ressaltos” ou “degraus”. O termo hebraico designa um elemento arquitetônico escalonado na parede, provavelmente recuos que permitiam apoiar a estrutura lateral sem fixá-la nas paredes do templo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para não se prender às paredes da casa”. Pelo contexto, o sentido parece ser que as vigas da estrutura lateral não eram fixadas nas paredes do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: היצוע הַתַּחְתֹּנָה
  choice: o andar inferior
  rationale: No contexto da construção do templo, היצוע designa a estrutura lateral disposta em níveis; “andar inferior” comunica com clareza o primeiro desses níveis.
- source_word: בָּאַמָּה
  choice: côvados
  rationale: Mantém a antiga unidade de medida, sem conversão conjectural para uma medida moderna.
- source_word: רָחְבָּהּ
  choice: tinha ... de largura
  rationale: Expressa de maneira natural em português a construção hebraica que indica a largura de cada andar.
- source_word: הַתִּיכֹנָה
  choice: o intermediário
  rationale: Retoma “andar” e preserva a sequência entre o nível inferior e o terceiro.
- source_word: הַשְּׁלִישִׁית
  choice: o terceiro
  rationale: Mantém a designação ordinal do terceiro nível da estrutura lateral.
- source_word: כִּי
  choice: Isso porque
  rationale: Introduz a explicação arquitetônica para o aumento progressivo da largura dos andares.
- source_word: מִגְרָעוֹת
  choice: saliências
  rationale: O termo descreve recuos ou ressaltos escalonados na face externa da parede. “Saliências” apresenta de modo acessível o efeito estrutural, enquanto a nota registra alternativas possíveis.
- source_word: נָתַן לַבַּיִת סָבִיב חוּצָה
  choice: Salomão fez saliências ao redor de toda a parte externa do templo
  rationale: “Fez” traduz idiomaticamente נתן neste contexto construtivo; “Salomão” explicita o sujeito implícito pelo contexto, e “templo” esclarece o referente de הבית.
- source_word: לְבִלְתִּי אֲחֹז
  choice: para que as vigas não fossem encaixadas
  rationale: A construção indica finalidade. “As vigas” é uma explicitação contextual do elemento implícito que não deveria prender-se às paredes; a nota preserva a formulação mais literal.
- source_word: בְּקִירוֹת הַבָּיִת
  choice: nas paredes do templo
  rationale: “Templo” identifica naturalmente a construção em vista, e “nas paredes” combina com o verbo “encaixar” em português.
