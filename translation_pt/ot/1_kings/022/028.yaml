base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: pt
  text: 'Micaías disse: “Se você de fato voltar em paz, Yahweh não falou por meu intermédio[a].” E Micaías disse: “Ouçam, todos os povos![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “em mim”; no contexto, isto é, por meio de mim como profeta.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega o plural “povos”, numa convocação pública de alcance amplo, não dirigida apenas a um único grupo.
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Se você de fato voltar
  rationale: A combinação do infinitivo absoluto com o verbo conjugado intensifica a condição; “de fato” conserva essa ênfase em português natural.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Preserva a expressão idiomática hebraica, que neste contexto indica voltar ileso e em segurança.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Yahweh não falou por meu intermédio
  rationale: A preposição בְּ apresenta Micaías como o instrumento da fala profética; “por meu intermédio” comunica o sentido sem excluir a formulação mais literal indicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural que convoca publicamente os ouvintes a prestar atenção.
- source_word: עַמִּים כֻּלָּם
  choice: todos os povos
  rationale: Mantém o plural de עַמִּים e o alcance amplo da convocação profética.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o nome divino; “Yahweh” preserva sua identidade como nome próprio.
- issue: Sentido instrumental de בִּי na fala profética
  choice: por meu intermédio
  alternative: em mim
  rationale: A construção pode ser reproduzida literalmente como “em mim”, mas no contexto descreve Yahweh falando mediante o profeta. A nota preserva a forma hebraica sem tornar obscuro o texto principal.
- issue: Identidade do falante na última oração
  choice: Micaías continua sendo o falante
  alternative: Entender a oração como comentário editorial ou fala de outra voz
  rationale: A continuidade do sujeito é a leitura narrativa mais direta e não exige reatribuição conjectural da fala.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a solenidade da declaração profética sem recorrer a construções arcaicas; “você” explicita naturalmente o destinatário singular indicado pela forma verbal hebraica.
