  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: pt
  text: Acazias, filho de Acabe, tornou-se rei de Israel em Samaria no décimo sétimo ano de Josafá, rei de Judá, e reinou sobre Israel durante dois anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste contexto, o qatal assinala a ascensão de Acazias ao trono; a formulação distingue esse início do resumo posterior da duração do reinado.
- source_word: עַל יִשְׂרָאֵל
  choice: de Israel / sobre Israel
  rationale: Com מָלַךְ, a preposição עַל indica o povo ou território governado. Na primeira ocorrência, 'rei de Israel' é o português idiomático; na segunda, 'reinou sobre Israel' mantém de modo natural a relação de governo.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição בְּ indica o local da sede régia; 'em Samaria' é claro e natural em português.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה
  choice: no décimo sétimo ano
  rationale: Reproduz com naturalidade a fórmula cronológica dos anos de reinado.
- source_word: לִיהוֹשָׁפָט
  choice: de Josafá
  rationale: Na fórmula de sincronismo régio, לְ marca o rei cujos anos servem de referência; em português, essa relação é expressa por 'de'.
- source_word: וַיִּמְלֹךְ
  choice: e reinou
  rationale: Depois da notícia da ascensão, o verbo introduz o resumo da duração do governo, sem repetir 'tornou-se rei'.
- source_word: שְׁנָתָיִם
  choice: durante dois anos
  rationale: O dual significa 'dois anos'; 'durante' explicita de maneira idiomática que se trata da duração do reinado, sem alterar o sentido.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Acazias, filho de Acabe
  rationale: Os nomes seguem suas formas portuguesas tradicionais e a relação filial do construto hebraico é preservada.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Mantém o título em aposição que identifica Josafá no sincronismo cronológico.
