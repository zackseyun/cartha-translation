base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: pt
  text: 'E o rei de Israel disse a seus servos: “Vocês sabem que Ramote-Gileade nos pertence e que, mesmo assim, não fazemos nada para tomá-la das mãos do rei de Arã?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: O termo pode designar servos ou oficiais da corte. “Servos” preserva o idioma régio hebraico sem especificar indevidamente a função deles.
- source_word: הַיְדַעְתֶּם
  choice: Vocês sabem
  rationale: A forma interrogativa introduz uma pergunta retórica dirigida ao grupo; o hebraico não contém negação explícita.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: que Ramote-Gileade nos pertence
  rationale: A construção com לָנוּ expressa posse ou reivindicação territorial; “nos pertence” comunica isso naturalmente.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Transliteração portuguesa reconhecível do topônimo composto.
- source_word: מַחְשִׁים
  choice: não fazemos nada
  rationale: Embora o verbo se relacione literalmente a ficar calado, neste contexto ele indica inércia diante da reivindicação territorial; a formulação comunica a omissão censurável.
- source_word: מִקַּחַת אֹתָהּ
  choice: para tomá-la
  rationale: Expressa de modo natural a ação que está sendo negligenciada, mantendo o referente feminino da cidade.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Preserva a imagem hebraica de mão como posse ou controle, ainda natural em português.
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome hebraico do povo e território, em vez do equivalente geopolítico posterior “Síria”.
theological_decisions: []
