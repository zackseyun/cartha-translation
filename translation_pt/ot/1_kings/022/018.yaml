source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לוֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֽוֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: pt
  text: 'Então o rei de Israel disse a Josafá: “Eu não lhe disse que ele não profetizaria o bem a meu respeito, mas somente o mal?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mas somente a desgraça”. O hebraico diz literalmente “o bem... mas somente o mal”, num contraste incisivo que aqui pode se referir a uma profecia desfavorável ou desastrosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reproduz diretamente a cadeia construta e mantém o título usado no texto, sem substituir pelo nome Acabe.
- source_word: אֶל יְהוֹשָׁפָט
  choice: a Josafá
  rationale: A preposição introduz o destinatário da fala; o hebraico traz apenas o nome, sem acrescentar o título de rei.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: Eu não lhe disse
  rationale: A pergunta retórica espera concordância e tem tom de censura; esta formulação é natural e clara em português.
- source_word: לֹא יִתְנַבֵּא
  choice: ele não profetizaria
  rationale: O imperfeito é entendido em relação ao anterior “disse”, como futuro do pretérito, descrevendo o que o rei já afirmara sobre a mensagem previsível de Micaías.
- source_word: עָלַי
  choice: a meu respeito
  rationale: Com fala ou profecia, עַל pode significar “acerca de”; a expressão escolhida conserva esse sentido em registro digno e corrente.
- source_word: טוֹב
  choice: o bem
  rationale: O adjetivo é usado substantivamente. O artigo torna a expressão idiomática em português sem especificar além do hebraico.
- source_word: כִּי אִם
  choice: mas somente
  rationale: 'Depois da negação, a construção marca contraste exclusivo: “mas, antes/somente”.'
- source_word: רָע
  choice: o mal
  rationale: Mantém o contraste lexical direto entre טוֹב e רָע, sem restringir antecipadamente o sentido a calamidade ou desastre.
theological_decisions:
- issue: Sentido de רָע na queixa do rei sobre a profecia
  choice: o mal
  alternative: a desgraça; o desastre
  rationale: “O mal” preserva o contraste hebraico incisivo entre “bem” e “mal”. Neste contexto, porém, o termo pode apontar para uma mensagem desfavorável ou para uma calamidade anunciada, possibilidade registrada na nota sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “lhe” evita regionalismo excessivo; a sintaxe mantém a solenidade narrativa sem soar arcaica.
