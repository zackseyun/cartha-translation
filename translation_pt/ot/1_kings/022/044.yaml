base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: pt
  text: Contudo, os lugares altos[a] não foram removidos; o povo ainda oferecia sacrifícios e queimava incenso nos lugares altos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuários”. O termo hebraico designa locais de culto, frequentemente situados em elevações e tradicionalmente chamados de “lugares altos”.
    reason: lexical_alternative
  - marker: b
    text: O versículo não especifica se esses sacrifícios eram oferecidos ao SENHOR em locais não autorizados ou se faziam parte de práticas idólatras mais amplas.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca o contraste com a avaliação positiva anterior do rei, em português natural e digno.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Preserva o termo tradicional para locais de culto, muitas vezes situados em elevações, sem reduzi-lo simplesmente a 'santuários'.
- source_word: לֹא סָרוּ
  choice: não foram eliminados
  rationale: Com 'lugares altos' como sujeito, a expressão indica que esses locais de culto permaneceram; a formulação passiva comunica o sentido idiomático.
- source_word: עוֹד
  choice: ainda
  rationale: Indica a continuidade da prática apesar das medidas atribuídas ao rei.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente coletivo direto e natural.
- source_word: מְזַבְּחִים
  choice: oferecia sacrifícios
  rationale: O particípio hebraico descreve prática contínua ou habitual; o pretérito imperfeito preserva esse aspecto em português.
- source_word: וּמְקַטְּרִים
  choice: e queimava incenso
  rationale: Em contexto cultual, o verbo normalmente se refere à queima de incenso ou à produção de fumaça sacrificial; esta é a expressão portuguesa mais natural no contexto.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: Repete o local cultual e emprega a preposição portuguesa idiomática sem forçar a imagem espacial de estar literalmente sobre uma elevação.
theological_decisions:
- issue: Natureza do culto nos lugares altos
  choice: Descrever a prática sem identificar a divindade à qual eram oferecidos os sacrifícios.
  alternative: Especificar que era culto ilegítimo ao SENHOR, ou culto sincrético/idólatra a outras divindades.
  rationale: O hebraico censura a permanência dos lugares altos, mas não declara neste versículo a quem os sacrifícios e o incenso eram oferecidos. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno de ampla compreensão, com boa legibilidade brasileira. O pretérito imperfeito em “oferecia” e “queimava” expressa a prática contínua ou habitual dos particípios hebraicos. “Lugares altos” mantém a terminologia bíblica tradicional, esclarecida em nota.
