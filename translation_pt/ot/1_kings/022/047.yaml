  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: pt
  text: Ele também removeu da terra os prostitutos cultuais que restavam desde os dias de Asa, seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega um termo masculino singular, provavelmente em sentido coletivo: “prostituto cultual”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Também ... o restante dos
  rationale: יֶתֶר designa aquilo que restou. “O restante dos” expressa naturalmente em português o grupo remanescente; “também” liga a ação ao contexto anterior.
- source_word: הַקָּדֵשׁ
  choice: prostitutos cultuais
  rationale: Neste contexto histórico, קָדֵשׁ é um termo masculino para pessoas associadas a práticas sexuais cultuais ilícitas. O plural traduz o valor coletivo do singular hebraico e evita termos tradicionais imprecisos ou ofensivos que acrescentariam sentidos alheios ao texto.
- source_word: אֲשֶׁר נִשְׁאַר
  choice: que ainda havia
  rationale: A expressão identifica os membros desse grupo que continuavam presentes. “Ainda havia” é corrente em português e conserva o sentido resultativo de permanência.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: desde os dias de Asa, seu pai
  rationale: Embora בִּימֵי signifique formalmente “nos dias de”, neste contexto o grupo é apresentado como remanescente daquele período. “Desde os dias de” torna clara essa relação temporal sem alterar o referente.
- source_word: בִּעֵר
  choice: eliminou
  rationale: בער pode significar consumir, expurgar ou remover. Com מִן־הָאָרֶץ, “eliminou da terra” comunica a retirada completa sem afirmar que houve queima ou execução.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: Aqui הָאָרֶץ se refere ao território do reino, não ao planeta. “Da terra” preserva a expressão geográfica concisamente.
theological_decisions:
- issue: Tradução de קָדֵשׁ em contexto moral e culturalmente sensível
  choice: prostitutos cultuais
  alternative: prostitutos de culto; homens ligados à prostituição cultual
  rationale: A escolha conserva tanto o componente cultual quanto o sexual indicado pelo uso contextual, sem importar polêmicas doutrinárias posteriores. A forma masculina do hebraico é explicitada na nota, e o plural no texto representa seu uso coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e vocabulário denominacional, preservando a referência masculina e cultual do hebraico.
