base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: pt
  text: 'Então ele chegou ao rei, e o rei lhe perguntou: “Micaías, devemos ir a Ramote-Gileade para a batalha ou devemos deixar de ir?” Ele respondeu: “Suba e tenha sucesso! Yahweh a entregará na mão do rei”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, a resposta de Micaías provavelmente é irônica; o hebraico, porém, não marca explicitamente o sarcasmo.
    reason: Preserva a provável força contextual sem inseri-la como certeza no texto principal.
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: Então ele foi até
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הֲנֵלֵךְ
  choice: devemos ir
  rationale: O imperfeito interrogativo na primeira pessoa do plural pede orientação sobre a decisão a tomar.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Transliteração tradicional do topônimo em português, com hífen para representar a unidade do nome composto.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: A preposição com o substantivo indica finalidade, aqui a campanha militar.
- source_word: אִם נֶחְדָּל
  choice: ou devemos desistir
  rationale: Apresenta a alternativa de não empreender a campanha; “desistir” é claro e natural sem acrescentar uma razão.
- source_word: עֲלֵה
  choice: Suba
  rationale: Preserva o verbo de movimento עלה e sua forma imperativa singular, dirigida ao rei.
- source_word: וְהַצְלַח
  choice: e tenha sucesso
  rationale: O hifil de צלח expressa êxito no empreendimento; a formulação permanece semanticamente direta, sem tornar explícita a ironia sugerida pelo contexto.
- source_word: וְנָתַן יְהוָה
  choice: Yahweh a entregará
  rationale: O perfeito com waw após os imperativos expressa o resultado futuro apresentado como certo. O pronome feminino retoma naturalmente Ramote-Gileade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: nas mãos do rei
  rationale: Equivalente idiomático em português para a entrega de algo ao poder ou domínio de alguém.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de o substituir por um título.
- issue: Tom da resposta inicial de Micaías
  choice: Traduzir diretamente as palavras e explicar a provável ironia em nota
  alternative: Inserir no texto marcas explícitas de sarcasmo ou reformular a fala como zombaria
  rationale: O contexto torna provável uma leitura irônica, mas o hebraico não contém uma marca lexical inequívoca de sarcasmo. A tradução conserva essa tensão narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com formas reconhecíveis internacionalmente e boa legibilidade brasileira. A pergunta deliberativa foi vertida de modo natural, e a resposta mantém a concisão e a ambiguidade tonal do hebraico.
