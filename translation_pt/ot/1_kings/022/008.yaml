  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: pt
  text: 'O rei de Israel disse a Josafá: “Ainda há outro homem por meio de quem se pode consultar Yahweh, mas eu o odeio, porque ele não profetiza o bem a meu respeito, mas somente o mal: Micaías, filho de Inlá”. Josafá respondeu: “Que o rei não fale assim”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עוֹד אִישׁ אֶחָד
  choice: Ainda há um homem
  rationale: Comunica naturalmente que resta outra pessoa a ser consultada, sem tornar a frase desnecessariamente pesada.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: por meio de quem podemos consultar Yahweh
  rationale: דָּרַשׁ, neste contexto profético, significa consultar ou buscar uma resposta de Yahweh; מֵאֹתוֹ apresenta o profeta como intermediário da consulta.
- source_word: שְׂנֵאתִיו
  choice: eu o odeio
  rationale: O perfeito expressa aqui a atitude estabelecida e presente do rei; o presente em português é direto e natural.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: ele não profetiza o bem a meu respeito, mas somente o mal
  rationale: Mantém a negação sem acrescentar a frequência absoluta de “nunca”; “mal” preserva a amplitude de רָע, que pode envolver algo ruim ou calamitoso sem definir antecipadamente seu sentido.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: Micaías, filho de Inlá
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis dos nomes, mantendo o patronímico.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Não fale o rei assim
  rationale: Preserva a proibição respeitosa e o tratamento cortês em terceira pessoa, adequado ao contexto da corte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o tetragrama; a transliteração preserva a referência ao nome pessoal da aliança sem substituí-la por um título.
- issue: Sentido de רָע na queixa de Acabe
  choice: mal
  alternative: desgraça
  rationale: “Mal” conserva a ambiguidade lexical entre algo ruim e uma calamidade anunciada, sem resolver a tensão de modo interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala de Josafá conserva deliberadamente um tom cortês e régio. Não há notas de rodapé, portanto nenhum marcador é necessário no texto.
