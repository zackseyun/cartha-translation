  to: 'O rei de Israel disse a Josafá: “Ainda há outro homem por meio de quem se pode consultar Yahweh, mas eu o odeio, porque ele não profetiza o bem a meu respeito, mas somente o mal: Micaías, filho de Inlá”. Josafá respondeu: “Que o rei não fale assim”.'
