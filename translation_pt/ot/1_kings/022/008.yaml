  source_fidelity: 'O texto traduz com precisão os elementos principais: a consulta a Yahweh por meio do profeta, a hostilidade do rei, o contraste entre bem e mal, o patronímico e a repreensão cortês de Josafá. Contudo, “Ainda há um homem” pode sugerir meramente que ainda existe um homem, sem transmitir com clareza o valor aditivo de עוֹד אִישׁ אֶחָד (“ainda há outro/mais um homem”).'
  naturalness: O português é claro, moderno e de registro apropriado. “Que o rei não fale assim” soa um pouco mais idiomático em português atual, mantendo a deferência régia e a força proibitiva/exortativa do hebraico.
  terminology: “Yahweh”, “consultar”, “profetiza”, “bem”, “mal”, “Micaías” e “Inlá” são escolhas adequadas. “Mal” preserva corretamente a amplitude de רָע, sem antecipar se se trata de mal moral ou de calamidade.
