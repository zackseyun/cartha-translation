  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: pt
  text: E agora, eis que Yahweh pôs um espírito mentiroso[a] na boca de todos esses seus profetas, e Yahweh anunciou desgraça[b] contra você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito de falsidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Yahweh anunciou calamidade contra você”. O termo hebraico pode indicar desgraça ou calamidade em contextos de juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que dá continuidade ao discurso quanto a força temporal e imediata da expressão hebraica.
- source_word: הִנֵּה
  choice: eis que
  rationale: Chama enfaticamente a atenção e mantém o tom solene da declaração profética, sem deixar de ser compreensível em português atual.
- source_word: נָתַן
  choice: pôs
  rationale: No contexto de algo colocado 'na boca' de alguém, 'pôs' é natural em português e traduz diretamente a ação expressa pelo verbo hebraico, sem atenuá-la para mera permissão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico.
- source_word: רוּחַ שֶׁקֶר
  choice: um espírito mentiroso
  rationale: Expressa de modo conciso um espírito caracterizado pela mentira e preserva a percepção de um agente pessoal; 'um espírito de falsidade' continua sendo uma alternativa possível.
- source_word: בְּפִי
  choice: na boca de
  rationale: Mantém a imagem hebraica da fala posta na boca de alguém. O singular funciona distributivamente em relação ao grupo plural de profetas.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: todos esses seus profetas
  rationale: Conserva a totalidade, a ênfase demonstrativa de 'esses' e o possessivo dirigido ao rei.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: pronunciou desgraça contra você
  rationale: '''Pronunciou'' preserva o ato declarativo de falar, enquanto ''desgraça'' comunica o dano ou juízo anunciado por רָעָה neste contexto, sem sugerir maldade moral em Yahweh.'
theological_decisions:
- issue: A ação de Yahweh em relação ao espírito mentiroso
  choice: Yahweh pôs um espírito mentiroso
  alternative: Yahweh permitiu que um espírito mentiroso agisse
  rationale: O verbo hebraico atribui diretamente a ação a Yahweh. A tradução não a reduz a simples permissão, preservando a tensão teológica do texto.
- issue: O sentido de רָעָה na declaração de Yahweh
  choice: desgraça
  alternative: mal; calamidade
  rationale: Neste contexto de juízo, רָעָה designa dano, desastre ou calamidade vindoura, e não necessariamente maldade moral. 'Desgraça' transmite essa força em português corrente, enquanto a nota registra 'calamidade' como alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom solene por meio de “eis que” e mantém a imagem hebraica “na boca”, sem suavizar a atribuição explícita da ação a Yahweh.
