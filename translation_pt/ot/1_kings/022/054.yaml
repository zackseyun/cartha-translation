  text: וַֽ/יַּעֲבֹד֙ אֶת הַ/בַּ֔עַל וַ/יִּֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יַּכְעֵ֗ס אֶת יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: pt
  text: Ele serviu a Baal e se prostrou diante dele[a], e provocou Yahweh, o Deus de Israel, exatamente como seu pai havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o adorou”; o verbo hebraico se refere literalmente ao ato de inclinar-se ou prostrar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: serviu
  rationale: עבד significa literalmente servir e, neste contexto, descreve o serviço religioso prestado a Baal. “Serviu” preserva a distinção em relação ao ato concreto expresso pelo verbo seguinte.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Embora o hebraico use o artigo, em português o nome da divindade é expresso naturalmente como “Baal”, sem artigo.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: se prostrou diante dele
  rationale: שׁחה denota inclinar-se ou prostrar-se e, neste contexto, constitui um ato de adoração. A formulação preserva a imagem concreta e não a reduz ao sentido genérico de “adorou”.
- source_word: וַיַּכְעֵס
  choice: provocou a ira de
  rationale: O hifil de כעס indica causar ira ou provocar à ira. Esta formulação explicita de maneira natural em português o sentido causativo do verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e idiomática da cadeia construta, identificando Yahweh como o Deus de Israel.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: exatamente como seu pai havia feito
  rationale: Expressa com naturalidade a força comparativa da frase hebraica e usa o mais-que-perfeito composto para indicar a ação anterior do pai.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O versículo contrasta diretamente o Deus de Israel com Baal. “Yahweh” preserva o nome pessoal do texto hebraico e evita substituí-lo por um título.
- issue: Natureza do ato expresso por וַיִּשְׁתַּחֲוֶה
  choice: se prostrou diante dele
  alternative: o adorou
  rationale: A tradução mantém o gesto concreto do hebraico, embora no contexto ele seja inequivocamente um ato de culto, sem apagar a relação entre ação corporal e adoração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “se prostrou diante dele” mantém a imagem concreta do hebraico; “provocou a ira de” comunica de modo natural o valor causativo de כעס.
