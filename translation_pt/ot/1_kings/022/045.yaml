  text: E Josafá fez as pazes com o rei de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Josafá estava em paz com o rei de Israel”. O verbo hebraico pode ser entendido tanto como o ato de estabelecer a paz quanto como o estado de estar em paz; o texto principal favorece o sentido de ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יַּשְׁלֵם
  choice: fez as pazes
  rationale: O hifil de שׁלם com waw consecutivo pode indicar o estabelecimento de relações pacíficas. “Fez as pazes” é uma expressão natural em português e preserva no texto principal o sentido eventivo, sem excluir a leitura estativa registrada na nota.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: עִם
  choice: com
  rationale: Preposição que aqui introduz a outra parte da relação de paz.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta da cadeia construta, com sentido definido natural no contexto.
