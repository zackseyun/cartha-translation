base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: pt
  text: 'E Yahweh disse: “Quem induzirá[a] Acabe para que ele suba e caia em Ramote-Gileade?” E um disse uma coisa, e outro disse outra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “persuadirá”; o verbo também pode ter o sentido de “enganará”, conforme o contexto.
    reason: alternative_lexical_sense
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְפַתֶּה
  choice: induzirá
  rationale: O piel de פתה pode expressar persuadir, seduzir ou enganar. “Induzirá” preserva a ideia de levar alguém a agir sem determinar no texto principal se o meio é mera persuasão ou engano.
- source_word: וְיַעַל וְיִפֹּל
  choice: a subir e cair
  rationale: A construção expressa o resultado pretendido da ação. “Subir” conserva a linguagem geográfica e militar, e “cair” mantém o verbo básico, com sua implicação contextual de derrota e morte.
- source_word: בְּרָמֹת גִּלְעָד
  choice: em Ramote-Gileade
  rationale: Emprega a forma portuguesa reconhecível do topônimo e traduz a preposição de modo natural para o local da batalha.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: Então um dizia uma coisa, e outro dizia outra
  rationale: Reproduz de maneira idiomática as diferentes propostas apresentadas pelos participantes do conselho, sem acrescentar seu conteúdo.
theological_decisions:
- issue: Participação divina na queda de Acabe
  choice: Manter Yahweh perguntando diretamente quem induzirá Acabe.
  alternative: Atenuar a agência divina com uma formulação como “quem influenciará Acabe”.
  rationale: O hebraico apresenta Yahweh iniciando a questão no conselho celestial. A tradução conserva essa tensão entre soberania, juízo e os meios empregados, sem explicá-la ou suavizá-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação hebraica foi vertida com fluidez, sem perder a sequência da ação nem a concisão narrativa.
