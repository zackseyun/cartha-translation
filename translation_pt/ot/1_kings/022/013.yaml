base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: pt
  text: 'O mensageiro que tinha ido chamar Micaías lhe disse: “Veja, as palavras dos profetas são, a uma só voz[a], favoráveis ao rei. Por favor, que a sua palavra seja como a de um deles e fale favoravelmente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “com uma só boca”, isto é, unanimemente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: No contexto narrativo, trata-se do agente humano enviado para chamar Micaías, não de um ser celestial.
- source_word: לִקְרֹא
  choice: chamar
  rationale: Expressa de modo natural o ato de mandar buscar Micaías; o contexto já comunica o caráter oficial da convocação.
- source_word: הִנֵּה נָא
  choice: Veja
  rationale: Mantém a função de chamar a atenção e introduzir o apelo, com linguagem corrente e digna.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: os profetas estão falando
  rationale: Reformula naturalmente em português a expressão nominal hebraica sem perder a referência às declarações dos profetas.
- source_word: פֶּה אֶחָד
  choice: a uma só voz
  rationale: Reproduz de forma idiomática e ainda imagética a ideia hebraica literal de 'uma só boca', isto é, unanimidade.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: em favor do rei
  rationale: Comunica naturalmente que as declarações são favoráveis ao rei, sem sugerir necessariamente que sejam verdadeiras ou moralmente boas.
- source_word: יְהִי נָא דבריך
  choice: Por favor, que a sua palavra seja
  rationale: Preserva o pedido cortês e mantém o singular coletivo 'palavra' para a mensagem de Micaías.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: como a de um deles
  rationale: Mantém a comparação singular do hebraico e evita repetição desnecessária em português.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: fale também em favor do rei
  rationale: Expressa o sentido adverbial de טוֹב e torna explícito o referente já estabelecido; 'também' comunica a pressão para que Micaías se alinhe aos demais.
theological_decisions: []
