  text: וּ/מֶ֥לֶךְ אֵ֛ין בֶּ/אֱד֖וֹם נִצָּ֥ב מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: pt
  text: E não havia rei em Edom; um governador nomeado[a] servia como rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um representante nomeado” ou “um oficial nomeado”. O hebraico נִצָּב refere-se literalmente a alguém posto ou nomeado para uma função.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֵין
  choice: E não havia rei
  rationale: A conjunção וּ liga a informação ao contexto narrativo, enquanto אֵין expressa inexistência; o passado é natural no relato histórico.
- source_word: בֶּ/אֱדוֹם
  choice: em Edom
  rationale: A preposição בְּ com o topônimo é diretamente locativa.
- source_word: נִצָּב
  choice: representante nomeado
  rationale: O particípio de נצב designa alguém posto ou nomeado para uma função. Neste contexto político, indica uma autoridade designada, sem impor um título administrativo mais específico do que o hebraico permite.
- source_word: מֶלֶךְ
  choice: governava como rei
  rationale: O substantivo final tem força predicativa e descreve a função exercida pelo representante. A formulação portuguesa evita a impressão contraditória de que havia, ao mesmo tempo, um rei pleno e nenhum rei em Edom.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário político não técnico. A tradução preserva a distinção entre um rei próprio de Edom e uma autoridade nomeada que exercia funções régias.
