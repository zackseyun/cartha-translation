  yaml_path: translation/ot/1_kings/022/025.yaml
  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: pt
  text: 'E Micaías disse: “Você verá, naquele dia, quando entrar de quarto em quarto para se esconder.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “E ... disse” conserva esse fluxo sem tornar a sequência mais explícita do que o hebraico.
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הִנְּךָ רֹאֶה
  choice: Você verá isso
  rationale: A construção com הִנְּךָ e o particípio, ligada a “naquele dia”, tem força preditiva. “Verá isso” é natural em português e explicita apenas o objeto implícito da percepção no contexto.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal idiomática e direta em português.
- source_word: אֲשֶׁר תָּבֹא
  choice: quando entrar
  rationale: אֲשֶׁר introduz aqui a circunstância temporal, e בוא, associado a um aposento, é naturalmente traduzido por “entrar”.
- source_word: חֶדֶר בְּחֶדֶר
  choice: no quarto mais interior
  rationale: A repetição de חֶדֶר indica movimento para um recinto mais interno. A tradução comunica esse sentido e a nota preserva as alternativas formais possíveis.
- source_word: לְהֵחָבֵה
  choice: para se esconder
  rationale: O infinitivo expressa finalidade; a forma pronominal é a maneira natural de transmitir em português que o próprio interlocutor buscará esconderijo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade ampla. A formulação evita o arcaísmo “eis que” e conserva por nota a ambiguidade da expressão hebraica repetida.
