base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: pt
  text: Josafá descansou com seus antepassados[a] e foi sepultado junto deles na Cidade de Davi, seu pai[b]. E Jeorão, seu filho, tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dormiu com seus pais”, expressão tradicional que indica a morte.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “pai” é usado no sentido genealógico amplo de “antepassado”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: Reproduz de modo natural em português a fórmula régia que indica a morte, mantendo sua imagem e seu caráter dinástico sem reduzi-la simplesmente a “morreu”.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: foi sepultado junto deles
  rationale: Mantém a voz passiva do hebraico e evita a repetição pouco natural de “com seus antepassados”; “deles” retoma claramente os antepassados.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Emprega a forma consagrada e clara do topônimo em português.
- source_word: אָבִיו
  choice: seu pai
  rationale: Preserva a linguagem genealógica ampla do hebraico, na qual “pai” pode designar um antepassado; uma nota esclarece que Davi não era o pai imediato de Josafá.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Expressa a ascensão ao trono e a sucessão, em vez de resumir todo o reinado.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Comunica de maneira idiomática a ideia de ocupar o lugar do antecessor.
