base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Quanto aos demais feitos de Acabe, a tudo o que ele fez, à casa de marfim que construiu e a todas as cidades que construiu[a], não está tudo isso escrito no Livro das Crônicas dos Reis de Israel[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “casa do marfim”. A expressão provavelmente se refere a uma residência real decorada com marfim, não a uma construção feita inteiramente desse material.
    reason: lexical_alternative
  - marker: b
    text: O “Livro das Crônicas dos Reis de Israel” era uma fonte de registros reais citada em Reis; não se trata necessariamente do livro bíblico de Crônicas.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: Quanto aos demais feitos de Acabe
  rationale: A fórmula historiográfica refere-se aos outros atos ou feitos do rei. “Quanto aos” introduz naturalmente o resumo final, sem acrescentar uma noção temporal ausente no hebraico.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: a tudo o que ele fez
  rationale: Mantém o sentido amplo de עשה e, com a preposição, integra a expressão à pergunta sobre o que está escrito.
- source_word: בֵית הַשֵּׁן
  choice: à casa de marfim
  rationale: Reproduz de perto a expressão hebraica sem especificá-la como “palácio”; provavelmente designa uma residência real ornamentada com marfim.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: e a todas as cidades que construiu
  rationale: “Cidades” é o sentido normal de עָרִים, e “construiu” preserva a repetição do verbo בנה.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Conserva a pergunta retórica hebraica, que pressupõe resposta afirmativa, e traduz literalmente o particípio passivo “escritos”.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: no Livro das Crônicas dos Reis de Israel
  rationale: Usa a formulação historiográfica reconhecível em português; “no” é a forma idiomática de indicar o registro escrito, e o título expressa a relação com os reis de Israel.
