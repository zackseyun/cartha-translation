translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a cadência de um resumo régio e a pergunta retórica do hebraico. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
