base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: pt
  text: Josafá fez navios de Társis[a] para irem a Ofir buscar ouro, mas não partiram[b], porque os navios naufragaram em Eziom-Geber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão talvez designe uma classe de grandes embarcações marítimas, e não necessariamente navios procedentes de Társis.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “não foi”, no singular; o sentido é coletivo e se refere aos navios ou à frota.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: fez
  rationale: O texto consonantal é entendido contextualmente como forma verbal com o sentido de fazer ou preparar; isso se ajusta a Josafá como sujeito e aos navios como objeto.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: navios de Társis
  rationale: Mantém a construção hebraica tradicional e deixa aberta a possibilidade de associação geográfica ou de designação de uma classe de grandes embarcações marítimas.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: para irem a Ofir
  rationale: Expressa naturalmente em português tanto a finalidade como o destino indicados pelo infinitivo e pela terminação direcional.
- source_word: לַזָּהָב
  choice: buscar ouro
  rationale: Torna explícito de modo natural o propósito da viagem indicado pela preposição ל, sem acrescentar uma finalidade estranha ao contexto.
- source_word: וְלֹא הָלָךְ
  choice: mas eles não chegaram a partir
  rationale: 'O verbo hebraico está no singular, mas seu referente contextual é coletivo: os navios ou a frota. A formulação evita sugerir que Josafá pessoalmente não viajou e harmoniza com o naufrágio no porto.'
- source_word: נשברה
  choice: naufragaram
  rationale: O nifal de שבר significa ser quebrado ou destroçado; no contexto marítimo, 'naufragaram' comunica de forma idiomática que as embarcações foram destruídas.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: em Eziom-Geber
  rationale: A preposição ב indica o local do desastre; 'em' é natural em português para a localidade portuária.
