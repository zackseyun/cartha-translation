lexical_decisions:
- source_word: וַיַּעַל
  choice: subiram
  rationale: O verbo עלה expressa subir ou ir para cima. Em português, o plural explicita naturalmente que os dois reis foram juntos, sem especificar além do texto que se tratava de uma marcha militar.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Mantém o título empregado pelo hebraico, que não dá aqui o nome pessoal do rei.
- source_word: וִיהוֹשָׁפָט
  choice: e Josafá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Preserva o título em aposição ao nome próprio, com pontuação natural em português.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Usa a forma portuguesa tradicional do topônimo composto, com hífen para indicar sua unidade.
