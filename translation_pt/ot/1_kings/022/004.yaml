base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: pt
  text: 'E ele perguntou a Josafá: “Você irá comigo à batalha em Ramote-Gileade?” Josafá respondeu ao rei de Israel: “Eu sou como você; meu povo é como o seu povo, e meus cavalos, como os seus.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “como eu, como você; como meu povo, como seu povo; como meus cavalos, como seus cavalos”. O hebraico emprega uma expressão breve, sem verbos explícitos, que comunica solidariedade e aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ
  choice: Você irá
  rationale: A partícula interrogativa com o imperfeito qal forma uma pergunta direta sobre a disposição de Josafá. “Irá” preserva o verbo de movimento sem acrescentar a nuance de “vir”.
- source_word: אִתִּי
  choice: comigo
  rationale: Expressa acompanhamento com sufixo de primeira pessoa do singular.
- source_word: לַמִּלְחָמָה
  choice: à batalha
  rationale: No contexto de הלך, indica ir participar de combate; a formulação é natural e mantém o sentido militar.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Forma portuguesa tradicional e reconhecível do topônimo composto.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reproduz naturalmente a cadeia construta e seu sentido definido no contexto.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Eu sou como você
  rationale: Supre a cópula ausente, necessária em português, e preserva a declaração concisa de solidariedade.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: meu povo é como o seu povo
  rationale: Mantém a comparação paralela; a cópula é explicitada para clareza em português.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: meus cavalos, como os seus
  rationale: Preserva o substantivo concreto “cavalos” sem interpretá-lo de modo mais específico como “cavalaria”; a elipse verbal conserva a concisão hebraica.
