source:
  edition: WLC
  text: אָ֠ז אָמַ֞ר אֲחַזְיָ֤הוּ בֶן אַחְאָב֙ אֶל יְה֣וֹשָׁפָ֔ט יֵלְכ֧וּ עֲבָדַ֛/י עִם עֲבָדֶ֖י/ךָ בָּ/אֳנִיּ֑וֹת וְ/לֹ֥א אָבָ֖ה יְהוֹשָׁפָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: pt
  text: 'Então Acazias, filho de Acabe, disse a Josafá: “Que os meus servos vão com os seus servos nos navios[a]”. Josafá, porém, não quis[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a bordo dos navios”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Josafá, porém, recusou-se”. O hebraico diz mais literalmente que ele “não quis” ou “não esteve disposto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência temporal da narrativa de modo natural e direto em português.
- source_word: אָמַר
  choice: disse
  rationale: Equivalente usual de אמר na introdução de discurso direto.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Acazias, filho de Acabe
  rationale: Emprega as formas tradicionais dos nomes bíblicos em português e traduz בֶן pela relação familiar explícita.
- source_word: אֶל יְהוֹשָׁפָט
  choice: a Josafá
  rationale: A preposição introduz o destinatário da fala; a construção é idiomática em português.
- source_word: יֵלְכוּ
  choice: Que ... vão
  rationale: Expressa o valor volitivo/propositivo do imperfeito hebraico sem transformá-lo numa ordem categórica.
- source_word: עֲבָדַי ... עֲבָדֶיךָ
  choice: os meus servos ... os seus servos
  rationale: “Servos” conserva a amplitude de עֶבֶד, que neste contexto pode designar pessoal a serviço dos reis, sem impor a ideia mais específica de escravidão ou de altos oficiais.
- source_word: עִם
  choice: com
  rationale: Reproduz de forma direta a relação comitativa.
- source_word: בָּאֳנִיּוֹת
  choice: nos navios
  rationale: Traduz o substantivo como “navios” e conserva de modo natural a preposição ב; “a bordo dos navios” é uma alternativa idiomática.
- source_word: וְלֹא אָבָה יְהוֹשָׁפָט
  choice: Josafá, porém, não quis
  rationale: Mantém o sentido lexical de não estar disposto ou não consentir, evitando reforçá-lo silenciosamente como uma recusa formal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas bíblicas correntes no Brasil. A proposta de Acazias é expressa pelo volitivo natural “Que ... vão”, e a negativa final preserva a formulação sucinta e deliberadamente menos enfática do hebraico.
