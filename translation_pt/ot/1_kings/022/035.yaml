base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: pt
  text: Naquele dia, a batalha se intensificou[a]. O rei foi mantido em pé[b] no carro de guerra, diante de Arã, e morreu ao entardecer. O sangue da ferida escorreu para o fundo do carro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a batalha se agravou”; mais literalmente, “a batalha subiu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o rei permaneceu em pé no carro”. A forma hebraica pode indicar que ele foi posto ou mantido de pé.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “para o seio” ou “colo do carro”, expressão que indica sua parte interna ou inferior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: a batalha se intensificou
  rationale: O uso de עלה com “batalha” descreve o aumento ou acirramento do combate; “se intensificou” comunica o sentido idiomático em português atual.
- source_word: מָעֳמָד
  choice: foi mantido em pé
  rationale: A forma passiva sugere que o rei foi posto ou mantido de pé, nuance importante no contexto de seu ferimento, sem especificar como isso ocorreu.
- source_word: בַּמֶּרְכָּבָה
  choice: no carro de guerra
  rationale: “Carro de guerra” torna explícito o tipo de veículo no contexto militar e é natural em português.
- source_word: נֹכַח אֲרָם
  choice: diante de Arã
  rationale: נֹכַח indica posição em frente ou face a face; “diante de Arã” conserva o nome próprio antigo sem substituí-lo por um referente geopolítico posterior.
- source_word: וַיָּמָת בָּעֶרֶב
  choice: e morreu ao entardecer
  rationale: Tradução temporal natural e digna para בָּעֶרֶב.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: O sangue da ferida escorreu
  rationale: Embora יצק possa significar “derramar”, “escorreu” expressa naturalmente o movimento do sangue procedente da ferida.
- source_word: חֵיק הָרָכֶב
  choice: o fundo do carro
  rationale: A expressão literal “seio/colo do carro” designa metaforicamente sua parte interna ou inferior; “fundo” comunica com clareza o referente concreto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em três frases evita uma cadeia excessiva de coordenações sem alterar a progressão narrativa. “Arã” preserva o nome histórico; “carro de guerra” evita a possível ambiguidade moderna de “carro”.
