  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: O restante dos atos de Josafá, seu poder demonstrado[a] e como combateu, não estão escritos no Livro das Crônicas dos Reis de Judá?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus feitos poderosos”. O hebraico combina “seu poder” com “que realizou”, expressão que indica poder ou valentia demonstrados em ações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: O restante dos atos
  rationale: Na fórmula de encerramento dos reinados, דִּבְרֵי designa os feitos ou atos do rei, não apenas suas palavras; וְיֶתֶר indica o restante.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: seu poder demonstrado
  rationale: A expressão combina literalmente o poder ou valor do rei com aquilo que ele fez. A formulação portuguesa comunica capacidade manifestada em ações sem reduzir o termo apenas a feitos militares.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: e as guerras que travou
  rationale: O verbo נלחם significa lutar ou guerrear. Esta substantivação é idiomática em português e resume sua atividade bélica sem especificar campanhas não mencionadas.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não está escrito
  rationale: Preserva a pergunta retórica da fórmula historiográfica. O singular concorda naturalmente com a enumeração entendida como conjunto de informações.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: no Livro das Crônicas dos Reis de Judá
  rationale: É uma tradução natural do título do registro real, em que לְ indica que as crônicas dizem respeito aos reis de Judá.
