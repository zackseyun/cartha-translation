  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh e andou no caminho de seu pai, no caminho de sua mãe e no caminho de Jeroboão, filho de Nebate, que levou Israel a pecar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Fez o que era mau
  rationale: Reproduz de modo natural em português a expressão idiomática hebraica de praticar aquilo que é moralmente mau.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora avaliativa hebraica e mantém o nome divino explícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: andou no caminho
  rationale: Conserva a metáfora hebraica de conduta e modo de vida, com formulação compreensível em português.
- source_word: אָבִיו ... אִמּוֹ
  choice: seu pai ... sua mãe
  rationale: Mantém explicitamente os dois vínculos familiares e a repetição enfática do original.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português, preservando o patronímico.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: levou Israel a pecar
  rationale: Expressa a força causativa do hifil de חטא em português natural, sem sugerir coerção absoluta.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Força causativa de הֶחֱטִיא
  choice: levou Israel a pecar
  alternative: fez Israel pecar; induziu Israel ao pecado
  rationale: A escolha conserva a responsabilidade causal atribuída a Jeroboão, sem resolver além do texto a relação entre sua influência e a responsabilidade de Israel.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A repetição de “no caminho” foi preservada para refletir a ênfase retórica hebraica, evitando apenas repetir a preposição antes do último membro de modo pouco natural em português.
