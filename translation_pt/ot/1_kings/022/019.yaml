  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: pt
  text: 'Então ele disse: “Por isso, ouça a palavra de Yahweh: Eu vi Yahweh sentado em seu trono, e todo o exército dos céus[a] em pé junto dele[b], à sua direita e à sua esquerda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a hoste celestial” ou “todo o exército do céu”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre ele”; neste contexto, provavelmente significa que estavam junto dele, servindo em sua presença, como esclarece a expressão “à sua direita e à sua esquerda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a transição consequencial ligada ao diálogo anterior e soa natural em português, sem enfraquecer a solenidade profética.
- source_word: שְׁמַע
  choice: ouça
  rationale: Imperativo singular dirigido diretamente ao rei; preserva a força da convocação profética.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e verte diretamente o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
- source_word: רָאִיתִי
  choice: Eu vi
  rationale: O pretérito perfeito apresenta de modo direto o conteúdo da visão de Micaías.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: sentado em seu trono
  rationale: Reproduz de maneira clara e natural a postura contínua retratada pelo particípio hebraico.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: todo o exército dos céus
  rationale: Conserva o valor coletivo e a possível dimensão militar ou cortesã de צבא, sem restringir o grupo explicitamente a anjos.
- source_word: עֹמֵד עָלָיו
  choice: em pé junto dele
  rationale: No cenário da corte celestial, comunica presença próxima e serviço, enquanto a nota preserva o sentido espacial mais literal da preposição.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: à sua direita e à sua esquerda
  rationale: Mantém a simetria espacial do hebraico em português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Identidade de כָל צְבָא הַשָּׁמַיִם na cena do trono celestial
  choice: todo o exército dos céus
  alternative: todos os anjos do céu; toda a hoste celestial
  rationale: A expressão pode apresentar a corte ou o exército celestial de modo amplo. A tradução não define seus integrantes com precisão maior que a do hebraico.
- issue: Relação espacial expressa por עָלָיו
  choice: junto dele
  alternative: sobre ele; ao redor dele
  rationale: O contexto — especialmente “à sua direita e à sua esquerda” — favorece a ideia de assistentes posicionados junto ao trono, mas a nota registra a forma mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Preserva a fórmula profética, o nome Yahweh e a imagem da corte celestial sem especificar além do hebraico.
