  text: וַ/יֵּשְׁב֖וּ שָׁלֹ֣שׁ שָׁנִ֑ים אֵ֚ין מִלְחָמָ֔ה בֵּ֥ין אֲרָ֖ם וּ/בֵ֥ין יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/001.yaml
  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: pt
  text: Durante três anos, permaneceram sem guerra entre Arã e Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Durante três anos, não houve guerra entre Arã e Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: permaneceram
  rationale: Embora o verbo יָשַׁב possa significar literalmente “sentar-se” ou “habitar”, nesta construção histórica com uma duração indica a continuidade de uma situação.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: durante três anos
  rationale: Expressa em português natural o acusativo hebraico de duração.
- source_word: אֵין מִלְחָמָה
  choice: sem guerra
  rationale: Preserva de modo conciso a afirmação hebraica de que não havia guerra durante esse período.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e ...
  rationale: A repetição hebraica da preposição é representada pela construção portuguesa idiomática correspondente.
- source_word: אֲרָם
  choice: Arã
  rationale: Emprega a forma portuguesa tradicional do nome hebraico, em vez do equivalente geopolítico posterior “Síria”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada em português para o nome próprio hebraico.
