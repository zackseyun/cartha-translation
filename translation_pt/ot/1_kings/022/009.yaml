  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: pt
  text: 'Então o rei de Israel chamou um oficial[a] e disse: “Traga depressa Micaías, filho de Inlá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico saris pode significar “eunuco” ou, em sentido mais amplo, “oficial da corte”. Aqui, o sentido mais geral provavelmente está em vista.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: No contexto narrativo, קרא indica chamar ou convocar alguém. “Chamou” é natural em português e não intensifica desnecessariamente a ação.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta da construção que identifica o sujeito.
- source_word: אֶל סָרִיס אֶחָד
  choice: um oficial
  rationale: סָרִיס pode designar um eunuco ou, de modo mais amplo, um oficial da corte. Aqui, a função administrativa é a informação contextual mais relevante; a alternativa literal é preservada em nota.
- source_word: מַהֲרָה
  choice: Traga depressa
  rationale: A forma expressa urgência, literalmente algo como “apressa-te”. Como o hebraico não explicita outro verbo antes do nome de Micaías, “traga” é suprido em português para tornar clara e idiomática a ordem implícita.
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: בֶן יִמְלָה
  choice: filho de Inlá
  rationale: Reproduz naturalmente em português a construção patronímica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “Traga depressa” comunica naturalmente a urgência da ordem; a vírgula em “Micaías, filho de Inlá” apresenta o patronímico com clareza.
