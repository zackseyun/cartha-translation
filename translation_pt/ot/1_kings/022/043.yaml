id: 1KI.22.43
reference: 1 Kings 22:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֛רֶךְ אָסָ֥א אָבִ֖י/ו לֹא סָ֣ר מִמֶּ֑/נּוּ לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: pt
  text: Ele andou em todo o caminho de Asa, seu pai,[a] e não se desviou dele, fazendo o que era certo aos olhos de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seguiu todo o caminho de Asa, seu pai» ou «viveu de acordo com todo o caminho de Asa, seu pai».'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica «aos olhos de Yahweh» significa «segundo a avaliação de Yahweh» ou «à vista de Yahweh».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: andou
  rationale: Preserva a metáfora hebraica de caminhar como modo de viver e agir, comum nas avaliações da conduta dos reis.
- source_word: בְּכָל דֶּרֶךְ
  choice: em todo o caminho
  rationale: Mantém o substantivo singular דֶּרֶךְ e a imagem de um padrão ou curso de vida, sem reduzi-la a uma afirmação genérica como «em tudo».
- source_word: אָסָא אָבִיו
  choice: de Asa, seu pai
  rationale: Expressa com clareza e naturalidade a relação filial indicada pelo hebraico.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: não se desviou dele
  rationale: סור indica desviar-se ou afastar-se; «dele» retoma o singular «caminho» e conserva a metáfora do percurso.
- source_word: לַעֲשׂוֹת
  choice: fazendo
  rationale: O gerúndio liga naturalmente a avaliação resultante à conduta descrita na oração anterior, sem excluir a nuance de propósito ou resultado do infinitivo hebraico.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: Forma corrente e clara de traduzir a expressão idiomática עשה הישר, referente ao que é reto ou correto.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a imagem hebraica da avaliação divina, ao mesmo tempo que a expressão permanece inteligível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Fórmula de avaliação da conduta do rei
  choice: O versículo afirma que ele permaneceu no padrão de vida de Asa e fez o que era certo perante Yahweh.
  alternative: Parafrasear a frase como uma aprovação geral de sua fidelidade ou de seu governo.
  rationale: A tradução conserva a fórmula hebraica de avaliação régia e sua dimensão moral diante de Deus, sem acrescentar afirmações doutrinárias ou políticas que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a metáfora do caminho e a expressão «aos olhos de Yahweh». O singular do hebraico foi mantido em «caminho» e retomado por «dele».
