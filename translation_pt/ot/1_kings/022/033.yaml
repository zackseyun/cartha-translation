  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: pt
  text: E aconteceu que, quando os comandantes dos carros de guerra viram que ele não era o rei de Israel, voltaram atrás e deixaram de persegui-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «voltaram de após ele»; expressão hebraica que, neste contexto, indica que deixaram de segui-lo ou persegui-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a progressão narrativa marcada por וַיְהִי sem recorrer à fórmula arcaica «e sucedeu que».
- source_word: כִּרְאוֹת
  choice: quando ... viram
  rationale: O infinitivo construto com כְּ exprime circunstância temporal; «quando ... viram» é claro e natural em português.
- source_word: שָׂרֵי הָרֶכֶב
  choice: os comandantes dos carros de guerra
  rationale: שָׂרֵי designa chefes militares, e הָרֶכֶב refere-se aos carros ou à força de carros. «Carros de guerra» evita a possível leitura moderna de simples veículos.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: que ele não era o rei de Israel
  rationale: A oração apresenta aquilo que os comandantes perceberam; o pronome masculino singular הוּא refere-se ao homem que perseguiam.
- source_word: וַיָּשׁוּבוּ מֵאַחֲרָיו
  choice: deixaram de persegui-lo
  rationale: A expressão descreve os comandantes voltando atrás e cessando a perseguição. A formulação portuguesa comunica naturalmente o sentido contextual do idioma hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Carros de guerra» explicita o sentido militar de רֶכֶב, e a formulação final traduz idiomaticamente a interrupção da perseguição.
