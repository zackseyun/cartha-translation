base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: pt
  text: 'Então o rei de Israel reuniu os profetas, cerca de quatrocentos homens, e lhes perguntou: “Devo subir para guerrear contra Ramote-Gileade ou devo desistir?” Eles responderam: “Suba, e o Senhor[a] a entregará na mão do rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Suba, e meu senhor a entregará na mão do rei”. O hebraico אֲדֹנָי pode, em certos contextos, ser entendido como “meu senhor”, embora aqui seja mais provável o título divino “o Senhor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: O qal consecutivo de קבץ descreve o ato de juntar pessoas; “reuniu” é natural e adequado a uma consulta real.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Equivalente português direto e consagrado de נְבִיאִים, sem acrescentar avaliação sobre a legitimidade deles.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: cerca de quatrocentos homens
  rationale: O prefixo כְּ indica aproximação; “cerca de” preserva essa nuance.
- source_word: הַאֵלֵךְ
  choice: Devo subir
  rationale: A forma interrogativa com o imperfeito na primeira pessoa expressa deliberação. “Subir” também mantém o verbo עלה, repetido na resposta.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: para guerrear contra Ramote-Gileade
  rationale: Expressa naturalmente em português a ação militar dirigida contra Ramote-Gileade, preservando explicitamente a ideia de guerra.
- source_word: אִם אֶחְדָּל
  choice: ou devo desistir
  rationale: חדל significa cessar ou abster-se; “desistir” comunica de modo corrente a alternativa de não empreender a campanha.
- source_word: עֲלֵה
  choice: Suba
  rationale: Preserva o imperativo de עלה e sua formulação militar, além da ligação verbal com a pergunta do rei.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: A vocalização massorética favorece aqui o título divino “o Senhor”, sem confundi-lo com o nome YHWH. A leitura possível “meu senhor” é mantida em nota.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: nas mãos do rei
  rationale: O idioma hebraico indica entrega ao poder ou controle do rei. A expressão portuguesa “nas mãos” conserva a imagem e soa natural.
theological_decisions:
- issue: Sentido de אֲדֹנָי na resposta dos profetas
  choice: o Senhor
  alternative: meu senhor
  rationale: No contexto de uma garantia profética, a vocalização massorética é mais provavelmente um título divino. Como não se trata do nome YHWH, emprega-se “Senhor”, não uma forma distintiva reservada ao tetragrama. A ambiguidade genuína é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ramote-Gileade” segue a forma tradicional portuguesa do topônimo. A repetição de “subir/Suba” preserva a coesão lexical hebraica; a imagem de entrega “nas mãos” foi mantida sem tornar a frase artificial.
