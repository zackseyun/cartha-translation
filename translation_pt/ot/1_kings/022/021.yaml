base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: pt
  text: 'Então o espírito avançou, pôs-se diante de Yahweh e disse: “Eu o induzirei.”[a] Yahweh lhe disse: “De que maneira?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o persuadirei”, “Eu o atrairei” ou “Eu o enganarei”. O verbo hebraico pode expressar persuasão, atração ou engano; o versículo seguinte esclarece o meio empregado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: o espírito
  rationale: O artigo definido favorece uma referência específica no cenário do conselho celestial. A inicial minúscula evita identificar o ser necessariamente com o Espírito Santo.
- source_word: וַיֵּצֵא
  choice: avançou
  rationale: Embora o sentido básico seja ‘sair’, aqui o verbo descreve naturalmente o espírito saindo dentre os presentes para se apresentar no conselho.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: pôs-se diante de
  rationale: Expressa de modo natural e digno o ato de tomar posição na presença de um superior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲפַתֶּנּוּ
  choice: Eu o induzirei
  rationale: פתה no piel pode indicar persuadir, seduzir, enganar ou induzir. ‘Induzirei’ preserva a amplitude do verbo sem antecipar o método enganoso explicitado no versículo seguinte.
- source_word: בַּמָּה
  choice: De que maneira?
  rationale: A pergunta solicita o modo ou meio pelo qual o plano será realizado; esta formulação é clara, corrente e adequada ao contexto deliberativo.
theological_decisions:
- issue: Identidade de הָרוּחַ no conselho celestial
  choice: um ser espiritual específico, traduzido como “o espírito”
  alternative: “o Espírito” (o Espírito Santo) ou “um espírito”
  rationale: O artigo aponta para uma figura específica na cena, mas o contexto não exige identificá-la com o Espírito Santo. A tradução mantém essa tensão sem impor uma conclusão doutrinária.
- issue: Nuance moral e semântica de אֲפַתֶּנּוּ
  choice: “Eu o induzirei”
  alternative: “Eu o enganarei”, “Eu o seduzirei” ou “Eu o persuadirei”
  rationale: O verbo permite essas nuances, e o versículo seguinte esclarece que o meio será um espírito de mentira. A escolha evita resolver antecipadamente a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa hebraica foi preservada sem rigidez; ‘avançou’ e ‘pôs-se diante de’ comunicam naturalmente a cena de conselho celestial. O marcador [a] aparece imediatamente após a frase a que se refere.
