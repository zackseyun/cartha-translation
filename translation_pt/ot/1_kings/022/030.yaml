  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶל יְהוֹשָׁפָ֗ט הִתְחַפֵּשׂ֙ וָ/בֹ֣א בַ/מִּלְחָמָ֔ה וְ/אַתָּ֖ה לְבַ֣שׁ בְּגָדֶ֑י/ךָ וַ/יִּתְחַפֵּשׂ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יָּב֖וֹא בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: pt
  text: 'Então o rei de Israel disse a Josafá: “Eu me disfarçarei[a] e entrarei na batalha, mas você vista as suas vestes”. Assim, o rei de Israel se disfarçou e entrou na batalha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica também pode ser entendida formalmente como uma ordem: “Disfarce-se e entre na batalha”. No entanto, o contraste com “mas você vista as suas vestes” e a declaração seguinte, de que o rei de Israel se disfarçou, favorecem o sentido “Eu me disfarçarei”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Eu me disfarçarei
  rationale: A forma isolada admite mais de uma análise, mas o pronome contrastivo וְאַתָּה (“mas você”) e a ação narrada em seguida indicam que o rei descreve o próprio plano. O futuro em português expressa com naturalidade essa intenção.
- source_word: וָבֹא
  choice: e entrarei
  rationale: Continua a intenção do rei e preserva o movimento de בוא para o cenário do combate.
- source_word: בַמִּלְחָמָה
  choice: na batalha
  rationale: Com o verbo “entrar”, “entrar na batalha” é uma formulação natural e mantém o sentido de ingresso no combate.
- source_word: וְאַתָּה
  choice: mas você
  rationale: O pronome é enfático e estabelece contraste entre o disfarce do rei de Israel e as vestes que Josafá deveria usar.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: vista as suas vestes
  rationale: Mantém o imperativo e traduz בְּגָדִים sem acrescentar explicitamente “reais”, ideia sugerida pelo contexto, mas não expressa pelo substantivo.
- source_word: וַיִּתְחַפֵּשׂ
  choice: se disfarçou
  rationale: Tradução reflexiva direta da ação que confirma o plano anteriormente anunciado.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: entrou na batalha
  rationale: Preserva a repetição lexical e apresenta de modo natural a entrada do rei no combate.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. Conservou-se “vestes” por ser corrente no registro bíblico sem ser excessivamente arcaico; evitou-se acrescentar “reais”, que é contextual, mas não lexicalmente explícito.
