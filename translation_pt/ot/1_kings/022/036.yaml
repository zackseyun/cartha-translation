  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: pt
  text: 'Ao pôr do sol, um grito percorreu o acampamento[a], dizendo: “Cada homem para a sua cidade, e cada homem para a sua terra!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um brado” ou “um clamor percorreu o acampamento”. O termo hebraico רִנָּה pode indicar um grito forte ou um brado; aqui se refere ao anúncio feito em todo o acampamento.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Cada homem para a sua cidade, e cada homem para a sua terra”. Trata-se de uma fórmula de dispensa após a batalha.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר הָרִנָּה בַּמַּחֲנֶה
  choice: um grito percorreu o acampamento
  rationale: O verbo עבר com בַּמַּחֲנֶה descreve o grito ou anúncio propagando-se pelo acampamento. “Percorreu o acampamento” preserva a imagem concreta e soa natural em português.
- source_word: הָרִנָּה
  choice: um grito
  rationale: רִנָּה pode indicar grito forte, clamor ou brado. Neste contexto militar, apresenta um anúncio audível em todo o acampamento, sem necessariamente expressar alegria.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: Ao pôr do sol
  rationale: A expressão com בוא e “sol” é um modo hebraico comum de indicar o pôr do sol. A tradução é concisa e idiomática.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo do grito e mantém de modo transparente a estrutura hebraica.
- source_word: אִישׁ אֶל עִירוֹ וְאִישׁ אֶל אַרְצוֹ
  choice: Cada homem volte para a sua cidade, e cada um para a sua terra
  rationale: A repetição distributiva de אִישׁ é representada por “cada homem” e “cada um”. O verbo “volte”, implícito na ordem nominal hebraica, torna a fórmula de dispersão inteligível em português sem mudar seu sentido.
