  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: pt
  text: Lavaram o carro junto ao tanque de Samaria, e os cães lamberam o sangue de Acabe, e as prostitutas lavaram-se ali[a], conforme a palavra que Yahweh havia falado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as prostitutas se banharam». O verbo hebraico não declara explicitamente o objeto da lavagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף
  choice: Lavaram
  rationale: O verbo hebraico está no singular, mas tem agente não especificado; o plural impessoal é natural em português e evita introduzir um sujeito inexistente no texto.
- source_word: הָרֶכֶב
  choice: o carro
  rationale: No contexto, refere-se ao carro de guerra ensanguentado de Acabe; «carro» é a designação bíblica corrente e natural em português.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: junto ao tanque de Samaria
  rationale: A preposição indica aqui o local da lavagem; «junto ao» expressa com naturalidade a proximidade, e «tanque» designa adequadamente o reservatório.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת דָּמוֹ
  choice: os cães lamberam o sangue de Acabe
  rationale: Traduz diretamente a ação vívida. O referente do sufixo pronominal é explicitado como Acabe para clareza em um versículo isolado.
- source_word: וְהַזֹּנוֹת רָחָצוּ
  choice: enquanto as prostitutas se lavavam ali
  rationale: «Prostitutas» é moderno e exato. O verbo pode significar lavar-se ou banhar-se, mas não traz objeto expresso; a formulação principal segue a leitura reflexiva tradicional sem especificar além disso o tipo de lavagem.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: conforme a palavra que Yahweh havia falado
  rationale: Preserva a fórmula profética de cumprimento, o nome divino e a anterioridade da palavra pronunciada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de וְהַזֹּנוֹת רָחָצוּ
  choice: as prostitutas se lavavam ali
  alternative: as prostitutas se banhavam; e lavaram as prostitutas
  rationale: A sintaxe faz de «as prostitutas» o sujeito, mas o verbo não expressa objeto. A tradução conserva a estranheza da observação e registra em nota a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «tanque», «prostitutas» e «Yahweh» sem arcaísmos; mantém concisão narrativa e a tensão da cláusula final.
