revisions:
- from: Lavaram o carro junto ao tanque de Samaria, e os cães lamberam o sangue de Acabe, enquanto as prostitutas se lavavam ali[a], conforme a palavra que Yahweh havia falado.
  to: Lavaram o carro junto ao tanque de Samaria, e os cães lamberam o sangue de Acabe, e as prostitutas lavaram-se ali[a], conforme a palavra que Yahweh havia falado.
  rationale: A revisão elimina a simultaneidade inferida por «enquanto» e restitui o valor perfectivo de רָחָצוּ. Mantém-se a leitura reflexiva natural em português, assinalando em nota que o hebraico não explicita o objeto, bem como o nome divino e os demais referentes do texto.
