revisions:
- from: 'Então Zedequias, filho de Quenaaná, fez para si chifres de ferro e disse: “Assim diz o SENHOR: ‘Com estes você golpeará os arameus até exterminá-los’”.'
  to: 'Então Zedequias, filho de Quenaaná, fez para si chifres de ferro e disse: “Assim diz o SENHOR: Com estes você investirá contra os arameus até exterminá-los.”'
  rationale: A revisão substitui o verbo genérico por “investirá contra”, expressão idiomática que preserva a ação de ataque associada aos chifres sem introduzir um termo técnico pouco corrente. Mantêm-se o destinatário singular implícito, os arameus como referente de Arã e a destruição completa indicada pela cláusula final.
