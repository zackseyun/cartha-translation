base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: pt
  text: 'Então Zedequias, filho de Quenaaná, fez para si chifres de ferro e disse: “Assim diz o SENHOR: Com estes você investirá contra os arameus até exterminá-los.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: chifres de ferro
  rationale: Preserva a imagem concreta e simbólica do hebraico, sem explicá-la no corpo do texto.
- source_word: תְּנַגַּח
  choice: golpeará
  rationale: O verbo descreve o ataque de um animal com os chifres; “golpeará” soa natural em português e mantém a ligação com os chifres usados como sinal profético.
- source_word: אֲרָם
  choice: os arameus
  rationale: Neste contexto, o nome territorial representa o povo ou exército de Arã; a forma gentílica torna explícito o referente humano exigido pelo sufixo plural seguinte.
- source_word: עַד כַּלֹּתָם
  choice: até exterminá-los
  rationale: Expressa a ação completa e destrutiva indicada pela construção hebraica, mantendo Acabe como sujeito implícito da ação.
theological_decisions:
- issue: Fórmula profética com o nome divino יהוה
  choice: Assim diz o SENHOR
  alternative: Assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional, clara e amplamente reconhecida em português, representando o tetragrama por SENHOR em versaletes.
- issue: Discurso apresentado como palavra divina por um profeta que depois será desmentido
  choice: Preservar a afirmação direta sem qualificação editorial
  alternative: Acrescentar que Zedequias alegava falar em nome do SENHOR
  rationale: O narrador registra exatamente a reivindicação de Zedequias; antecipar um juízo sobre sua veracidade reduziria a tensão narrativa e teológica do capítulo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A fala divina foi marcada por aspas internas para distinguir a fórmula introdutória da mensagem citada.
