  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: pt
  text: Acabe dormiu com seus pais[a], e Acazias, seu filho, tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dormiu com seus pais”, fórmula régia habitual que significa que ele morreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia שׁכב עם־אבותיו, indica a morte. “Descansou” preserva a imagem e o caráter formulaico do hebraico de modo mais natural em português moderno do que “dormiu”, sem reduzi-la simplesmente a “morreu”.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: Expressa naturalmente em português a referência aos predecessores ancestrais da fórmula régia. “Com seus pais” seria mais literal na forma, mas poderia ser entendido de maneira demasiadamente restrita como referência apenas aos genitores.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Neste aviso de sucessão, o verbo assinala a ascensão de Acazias ao trono, não apenas a duração posterior de seu reinado.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Preserva a ideia hebraica de substituição e sucessão no mesmo ofício.
- source_word: אַחְאָב
  choice: Acabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲחַזְיָהוּ
  choice: Acazias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Mantém explicitamente a relação filial e dinástica presente no hebraico.
