  text: וְ/אָמַרְתָּ֗ כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ אֶת זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִילֻ֨/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד בֹּאִ֥/י בְ/שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: pt
  text: 'e diga: “Assim diz o rei: Ponham este homem na prisão e deem-lhe pão de aflição e água de aflição[a], até que eu volte em paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pão de angústia” e “água de angústia”; a expressão provavelmente se refere a rações prisionais duras ou escassas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Assim diz o rei
  rationale: Preserva a fórmula solene de proclamação, em português natural e digno.
- source_word: שִׂימוּ אֶת זֶה
  choice: Ponham este homem
  rationale: O demonstrativo refere-se a Micaías; “este homem” explicita o referente de modo idiomático sem acrescentar conteúdo indevido.
- source_word: בֵּית הַכֶּלֶא
  choice: na prisão
  rationale: Expressa naturalmente o sentido literal de “casa de confinamento”.
- source_word: וְהַאֲכִילֻהוּ
  choice: e deem-lhe
  rationale: No contexto de pão e água, esta formulação transmite naturalmente a ordem de alimentá-lo e evita a construção pouco idiomática “alimentem-no com água”.
- source_word: לֶחֶם לַחַץ
  choice: pão de aflição
  rationale: Mantém a construção hebraica e sua força expressiva, sem reduzir o sentido apenas a rações escassas.
- source_word: וּמַיִם לַחַץ
  choice: água de aflição
  rationale: Conserva o paralelismo com “pão de aflição” e a ambiguidade entre sofrimento, privação e ração severa.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: até que eu volte em paz
  rationale: “Volte” é natural no contexto de retorno da batalha, enquanto “em paz” preserva o idioma hebraico e a ironia narrativa.
theological_decisions:
- issue: Sentido de בְשָׁלוֹם na declaração de Acabe
  choice: em paz
  alternative: em segurança; são e salvo; vitorioso
  rationale: A expressão pode indicar um retorno seguro e ileso. “Em paz” mantém a amplitude semântica, a confiança do rei e a tensão irônica da narrativa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso real conserva solenidade, enquanto os imperativos permanecem claros e correntes.
