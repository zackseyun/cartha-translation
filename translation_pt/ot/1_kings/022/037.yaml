  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: pt
  text: Assim, o rei morreu e foi levado para Samaria[a], e sepultaram o rei em Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “e o rei morreu, e ele veio para Samaria”. O sentido é que o corpo do rei foi levado para Samaria depois de sua morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O qal wayyiqtol de מות expressa o acontecimento da morte na sequência narrativa; “morreu” é a forma natural e direta em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido se refere ao rei já conhecido no contexto, Acabe. Mantém-se “o rei” em vez de inserir o nome próprio.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: foi levado para Samaria
  rationale: A forma hebraica é literalmente singular ativa, “e ele veio para Samaria”, mas ocorre depois da morte do rei. O contexto indica a chegada de seu corpo; a formulação passiva comunica naturalmente em português o transporte implícito, enquanto a nota preserva a forma literal.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma consagrada em português para o topônimo hebraico.
- source_word: וַיִּקְבְּרוּ
  choice: sepultaram
  rationale: A terceira pessoa do plural tem agentes não especificados. Em português, o sujeito indeterminado pode ser preservado naturalmente pela forma verbal sem pronome expresso.
- source_word: אֶת הַמֶּלֶךְ
  choice: o rei
  rationale: A repetição do substantivo no hebraico é mantida, em vez de ser substituída por “o”, preservando a clareza e o relevo narrativo.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição בְּ marca aqui o local do sepultamento; “em Samaria” é o equivalente mais direto.
