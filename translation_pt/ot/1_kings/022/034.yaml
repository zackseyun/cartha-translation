  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּכֶּה֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לְ/רַכָּב֗/וֹ הֲפֹ֥ךְ יָדְ/ךָ֛ וְ/הוֹצִיאֵ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: pt
  text: 'Um homem, porém, retesou o arco ao acaso[a] e atingiu o rei de Israel entre as peças da armadura e a couraça[b]. Então o rei disse ao condutor do seu carro: “Dê meia-volta[c] e tire-me do campo de batalha, pois estou ferido[d]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como “sem mirar” ou, mais literalmente, “em sua inocência”; aqui, provavelmente indica que o arqueiro não tinha um alvo específico em mente.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “entre os debaqim e a shiryan”. Provavelmente se refere a uma abertura entre partes da armadura, mas a identificação exata desses termos técnicos é incerta.'
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “Vire a sua mão”, expressão que, neste contexto, significa manobrar o carro.'
    reason: lexical_alternative
  - marker: d
    text: O verbo hebraico pode significar “estar doente” ou “estar ferido”; neste contexto, refere-se ao ferimento causado pela flecha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Um homem, porém
  rationale: Introduz naturalmente o arqueiro anônimo e usa “porém” para marcar a reviravolta narrativa em contraste com a tentativa do rei de evitar ser reconhecido.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: retesou o arco
  rationale: Expressa em português corrente o ato de puxar a corda e preparar o arco para o disparo, sem acrescentar um verbo explícito de atirar que não consta da expressão hebraica.
- source_word: לְתֻמּוֹ
  choice: ao acaso
  rationale: No contexto da batalha, indica que o homem não mirava deliberadamente no rei. A nota conserva as outras nuances possíveis da expressão.
- source_word: וַיַּכֶּה
  choice: e atingiu
  rationale: Traduz o golpe efetivo sem antecipar além do necessário a declaração posterior de que o rei estava ferido.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: entre as peças da armadura e a couraça
  rationale: Representa uma abertura entre componentes da proteção corporal sem atribuir precisão indevida aos dois termos técnicos hebraicos, cuja identificação exata é incerta.
- source_word: לְרַכָּבוֹ
  choice: ao condutor do seu carro
  rationale: Identifica com clareza a pessoa que conduzia o carro de guerra; é mais imediatamente compreensível do que um termo técnico pouco frequente.
- source_word: הֲפֹךְ יָדְךָ
  choice: Dê meia-volta
  rationale: Comunica naturalmente a ordem para manobrar o carro; a imagem hebraica literal, “vire a sua mão”, é preservada em nota.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: e tire-me do campo de batalha
  rationale: No contexto do combate em andamento, מַחֲנֶה designa o espaço ou formação militar, não apenas um acampamento estático.
- source_word: כִּי הָחֳלֵיתִי
  choice: pois estou ferido
  rationale: Embora o verbo também possa indicar estar doente ou debilitado, o ferimento causado pela flecha determina o sentido contextual. Não se acrescenta “gravemente”, pois esse grau não é expresso.
theological_decisions: []
