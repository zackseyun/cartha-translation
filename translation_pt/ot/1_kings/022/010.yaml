  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: pt
  text: O rei de Israel e Josafá, rei de Judá, estavam sentados, cada um em seu trono, vestidos com trajes, na eira, à entrada do portão de Samaria, e todos os profetas profetizavam diante deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: O rei de Israel
  rationale: O waw liga esta cena ao contexto anterior, mas não exige um marcador temporal como «então» ou «ora»; em português, a conexão pode ficar implícita no fluxo narrativo.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: e Josafá, rei de Judá
  rationale: Mantém o nome tradicional em português e apresenta o título como aposto natural.
- source_word: יֹשְׁבִים
  choice: estavam sentados
  rationale: O particípio hebraico descreve uma situação em curso e serve de pano de fundo para a cena.
- source_word: אִישׁ עַל־כִּסְאוֹ
  choice: cada um em seu trono
  rationale: אִישׁ tem sentido distributivo neste contexto, e כִּסֵּא designa adequadamente o trono de cada rei.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: vestidos com seus trajes
  rationale: A expressão hebraica diz literalmente que estavam vestidos com roupas, sem qualificá-las explicitamente como reais. «Trajes» evita uma redundância pouco natural sem acrescentar a ideia de vestes régias.
- source_word: בְּגֹרֶן
  choice: na eira
  rationale: גֹּרֶן é o espaço onde se debulhavam ou trilhavam cereais; «eira» é o equivalente português preciso e conciso.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: junto à entrada do portão de Samaria
  rationale: Expressa de modo natural a localização da eira na abertura ou entrada do portão urbano, preservando a cadeia locativa hebraica.
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים
  choice: e todos os profetas profetizavam
  rationale: Retém a totalidade indicada por כָּל e a ação contínua do particípio hitpael de נבא.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Equivalente formal e natural para uma atuação realizada na presença dos dois reis.
theological_decisions:
- issue: Natureza dos trajes dos reis
  choice: vestidos com seus trajes
  alternative: vestidos com trajes reais
  rationale: Embora o cenário régio possa sugerir vestimenta cerimonial, o hebraico menciona apenas «roupas/trajes». A tradução não explicita uma qualidade que o texto deixa implícita.
- issue: Caracterização dos profetas
  choice: todos os profetas profetizavam
  alternative: todos os falsos profetas profetizavam
  rationale: Neste ponto, o narrador os chama simplesmente de «profetas». A tradução preserva essa designação e não antecipa o julgamento fornecido pelo contexto mais amplo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação separa a configuração da cena da ação dos profetas. «Eira» preserva a precisão histórica; «portão» comunica melhor do que «porta» a entrada pública e monumental da cidade.
