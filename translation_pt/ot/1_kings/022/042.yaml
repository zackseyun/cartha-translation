base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: pt
  text: Josafá tinha trinta e cinco anos quando começou a reinar e reinou vinte e cinco anos em Jerusalém. Sua mãe se chamava Azuba e era filha de Sili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Adota a forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: tinha trinta e cinco anos
  rationale: Expressa naturalmente em português o idiomatismo hebraico de idade, literalmente 'filho de trinta e cinco anos'.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: No contexto da fórmula régia, indica a idade de Josafá quando assumiu o reinado.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: reinou vinte e cinco anos
  rationale: Reproduz com clareza a duração do reinado, mantendo o verbo régio מָלַךְ.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Tradução direta da expressão locativa com a forma portuguesa consagrada do topônimo.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Forma natural no português atual para a fórmula hebraica 'e o nome de sua mãe era'.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Transliteração portuguesa simples do nome próprio hebraico.
- source_word: בַּת שִׁלְחִי
  choice: era filha de Silí
  rationale: Traduz diretamente a relação genealógica e translitera o nome próprio de maneira legível em português.
