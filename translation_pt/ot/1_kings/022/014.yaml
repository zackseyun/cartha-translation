  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: pt
  text: 'Micaías disse: “Tão certo como vive Yahweh, o que Yahweh me disser, isso falarei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מִיכָיְהוּ
  choice: Micaías respondeu
  rationale: O wayyiqtol introduz a fala de Micaías. No diálogo imediato, “respondeu” expressa naturalmente a função narrativa sem alterar o conteúdo.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz de modo claro e solene a fórmula hebraica de juramento, corrente em português bíblico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי אֵת אֲשֶׁר
  choice: somente o que
  rationale: No contexto do juramento, a construção introduz aquilo que Yahweh comunicar; “somente” torna explícita a força restritiva já indicada pelo pronome resumptivo e pela ordem enfática da frase.
- source_word: יֹאמַר יְהוָה אֵלַי
  choice: Yahweh me disser
  rationale: O imperfeito tem referência futura no contexto, e “me disser” é a formulação idiomática em português.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: direi
  rationale: O pronome retomador aponta para “o que” foi dito. Em português, a retomada pode permanecer implícita; “direi” comunica naturalmente o ato profético de falar a mensagem recebida.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva-o por transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Força exclusiva da declaração profética
  choice: direi somente o que Yahweh me disser
  alternative: o que Yahweh me disser, isso falarei
  rationale: A formulação comunica que Micaías se compromete a transmitir apenas a mensagem divina. Não acrescenta uma teoria sobre inspiração, mas preserva a ênfase do objeto antecipado e retomado no hebraico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem foi ajustada ao uso natural do português, preservando a fórmula de juramento e a ênfase na fidelidade à mensagem recebida.
