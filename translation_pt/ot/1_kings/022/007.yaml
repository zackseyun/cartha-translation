  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: pt
  text: 'Mas Josafá disse[a]: “Não há aqui ainda um profeta de Yahweh, para que o consultemos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há aqui ainda outro profeta de Yahweh, para que o consultemos?”'
    reason: A posição e o alcance de עוֹד permitem entender a pergunta como uma busca por mais um profeta além dos já presentes.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... perguntou
  rationale: O wayyiqtol dá continuidade à narrativa, enquanto “mas” explicita o contraste contextual com os profetas já consultados. Em português, “perguntou” é natural antes de uma pergunta direta, embora o verbo hebraico signifique literalmente “disse”.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַאֵין
  choice: Não há
  rationale: Conserva a pergunta negativa, que busca confirmação, em português natural e digno.
- source_word: פֹּה
  choice: aqui
  rationale: Equivalente locativo direto e corrente.
- source_word: נָבִיא לַיהוָה
  choice: um profeta de Yahweh
  rationale: “Profeta” é a correspondência habitual de נָבִיא; o ל marca relação ou pertencimento, expresso naturalmente por “de”. O nome divino é transliterado como “Yahweh”.
- source_word: עוֹד
  choice: ainda
  rationale: Indica que se procura um profeta que ainda esteja disponível. A possibilidade contextual de “outro” é preservada em nota.
- source_word: וְנִדְרְשָׁה מֵאוֹתוֹ
  choice: para que o consultemos
  rationale: O cohortativo plural expressa intenção ou propósito. “Consultá-lo” comunica de modo idiomático a ação de buscar, por meio do profeta, uma resposta divina, sem tornar a frase excessivamente literal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Agência na consulta profética
  choice: para que o consultemos
  alternative: para que consultemos por meio dele
  rationale: A formulação concisa mantém o profeta como a pessoa consultada, conforme a construção hebraica, sem negar que a resposta buscada procede de Yahweh.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente naturalizada, e “perguntou” foi preferido a “disse” por introduzir diretamente uma pergunta.
