  to: 'Aconteceu que, quando os comandantes da força de carros de guerra viram Josafá, disseram: “Certamente ele é o rei de Israel!” Então se voltaram contra ele para combatê-lo[a], e Josafá gritou.'
  rationale: A revisão substitui uma formulação interpretativamente mais estreita («atacá-lo») por «combatê-lo», que corresponde de modo mais direto a לְהִלָּחֵם, e troca a adversativa «mas» pela coordenação «e», conforme o encadeamento do hebraico. «Força de carros de guerra» explicita o valor coletivo-militar de הָרֶכֶב.
