  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: pt
  text: 'Aconteceu que, quando os comandantes da força de carros de guerra viram Josafá, disseram: “Certamente ele é o rei de Israel!” Então se voltaram contra ele para combatê-lo[a], e Josafá gritou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para lutar contra ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Preserva a introdução narrativa hebraica sem recorrer à fórmula arcaica “e sucedeu que”.
- source_word: כִּרְאוֹת
  choice: quando ... viram
  rationale: Expressa naturalmente o valor temporal da construção hebraica.
- source_word: שָׂרֵי הָרֶכֶב
  choice: os comandantes das tropas de carros de guerra
  rationale: שָׂרֵי designa chefes militares, e הָרֶכֶב pode referir-se à força de carros, não apenas aos veículos individualmente.
- source_word: אַךְ
  choice: Certamente
  rationale: Neste contexto, a partícula assinala a identificação enfática e confiante feita pelos comandantes.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: ele é o rei de Israel
  rationale: Mantém a referência masculina explícita do hebraico e soa natural em português, embora a identificação seja equivocada.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: se voltaram contra ele
  rationale: Conserva o movimento expresso por סור e deixa claro, por meio de “contra”, o sentido hostil da ação.
- source_word: לְהִלָּחֵם
  choice: para atacá-lo
  rationale: No contexto de comandantes que convergem sobre um alvo identificado, “atacá-lo” comunica naturalmente a intenção de entrar em combate; a formulação mais literal é registrada em nota.
- source_word: וַיִּזְעַק
  choice: gritou
  rationale: Expressa o clamor alto e urgente indicado por זעק sem acrescentar palavras ou conteúdo ausentes do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tropas de carros de guerra” evita que “comandantes dos carros” seja entendido apenas como condutores dos veículos. A exclamação representa a identificação enfática expressa por אַךְ.
