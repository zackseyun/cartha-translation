base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: pt
  text: 'E ele disse: “Sairei e serei um espírito de mentira[a] na boca de todos os seus profetas.” E ele disse: “Tu o induzirás[b] e também terás êxito. Sai e faz assim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito de falsidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tu o enganarás”, “tu o seduzirás” ou “tu o persuadirás”. O verbo hebraico pode indicar indução, persuasão, sedução ou engano, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Sairei
  rationale: O imperfeito qal na primeira pessoa singular expressa a ação pretendida pelo espírito; “sairei” é direto e mantém a ligação com o imperativo posterior “saia”.
- source_word: וְהָיִיתִי
  choice: e serei
  rationale: O verbo היה indica aqui o papel que o espírito assumirá. “Serei” preserva naturalmente a forma verbal futura no contexto da proposta.
- source_word: רוּחַ שֶׁקֶר
  choice: um espírito de mentira
  rationale: A expressão caracteriza o espírito pela falsidade. “Espírito de mentira” é clara, digna e mais transparente em português do que uma formulação excessivamente interpretativa.
- source_word: בְּפִי
  choice: na boca de
  rationale: Mantém a imagem hebraica da fala que procede pela boca dos profetas, uma expressão compreensível em português.
- source_word: כָּל נְבִיאָיו
  choice: todos os seus profetas
  rationale: Reproduz o sentido abrangente de כָּל e o sufixo possessivo masculino singular.
- source_word: תְּפַתֶּה
  choice: Você o induzirá
  rationale: O piel de פתה pode envolver indução, sedução, persuasão ou engano. “Induzirá” preserva a ideia central de levar Acabe ao curso proposto sem restringir indevidamente a amplitude do verbo; o objeto implícito é explicitado como “o” para clareza em português.
- source_word: וְגַם תּוּכָל
  choice: e também terá êxito
  rationale: יכל pode indicar capacidade ou sucesso. Neste comissionamento, a expressão comunica que a tentativa efetivamente alcançará seu objetivo.
- source_word: צֵא
  choice: Saia
  rationale: O imperativo retoma verbalmente “Sairei” e preserva a coesão do diálogo.
- source_word: וַעֲשֵׂה כֵן
  choice: e faça assim
  rationale: Tradução direta da ordem idiomática עשה כן, em registro natural e digno.
theological_decisions:
- issue: Permissão ou comissionamento divino em uma cena que envolve engano
  choice: 'Manter a fala direta: o espírito propõe tornar-se “um espírito de mentira”, e recebe a ordem “Saia e faça assim”.'
  alternative: Suavizar a fala como mera permissão ou reformulá-la para afastar a ação enganosa da cena celestial.
  rationale: O hebraico apresenta proposta, confirmação do êxito e ordem de modo direto. A tradução preserva a tensão teológica entre soberania divina, juízo e agência secundária, sem resolvê-la por paráfrase doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural para brasileiros. O diálogo conserva solenidade sem arcaísmos. As imagens hebraicas “espírito de mentira” e “na boca” foram mantidas por serem claras e importantes para a forma do texto.
