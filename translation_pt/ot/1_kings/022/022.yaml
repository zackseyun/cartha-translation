  source_fidelity: A tradução preserva bem a sequência verbal hebraica, a imagem de «espírito de mentira» «na boca» dos profetas e a tensão direta do comissionamento. «Ter êxito» comunica adequadamente וְגַם תּוּכָל. A repetição de «E ele disse» reflete melhor os dois וַיֹּאמֶר do que «Então ele disse».
