  terminology: «Espírito de mentira» é uma escolha fiel e idiomática. «Induzir» preserva a amplitude de פתה sem fixá-lo exclusivamente como enganar, seduzir ou persuadir. As alternativas da nota devem concordar com o tratamento por «tu» adotado no texto.
