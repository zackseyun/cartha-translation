  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קַ֚ח אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֵ֖/הוּ אֶל אָמֹ֣ן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: pt
  text: 'Então o rei de Israel disse: “Leve Micaías de volta a Amom, o governador[a] da cidade, e a Joás, filho do rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comandante da cidade” ou “principal autoridade da cidade”. O título hebraico pode designar um alto oficial civil ou militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reprodução direta do título hebraico, sem substituir pelo nome Acabe.
- source_word: קַח
  choice: Levem
  rationale: O imperativo de לקח significa normalmente “tomar/levar”. O plural é natural em português quando a ordem é dirigida aos encarregados presentes, sem acrescentar a ideia mais forte de agarrar ou prender.
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: וַהֲשִׁיבֵהוּ
  choice: de volta
  rationale: O hifil de שוב indica fazer alguém retornar; junto de “Levem”, a expressão natural “Levem ... de volta” conserva esse sentido causativo.
- source_word: אָמֹן
  choice: Amom
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
- source_word: שַׂר הָעִיר
  choice: o governador da cidade
  rationale: שַׂר designa uma autoridade, dirigente ou comandante. “Governador” comunica bem uma função cívico-administrativa, enquanto a nota preserva outras possibilidades legítimas.
- source_word: וְאֶל יוֹאָשׁ
  choice: e a Joás
  rationale: Mantém o segundo אֶל, coordenando Joás com Amom como destinatário ou responsável pela custódia.
- source_word: בֶּן הַמֶּלֶךְ
  choice: filho do rei
  rationale: Tradução direta e natural da construção hebraica, sem transformá-la no título adicional “príncipe”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “Levem Micaías de volta” é idiomática e preserva a força causativa do verbo hebraico. A ambiguidade funcional de שַׂר é mantida por meio da nota.
