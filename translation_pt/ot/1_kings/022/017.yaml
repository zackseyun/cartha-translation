  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: pt
  text: 'E ele disse: “Vi todo o Israel espalhado pelos montes, como ovelhas que não têm pastor. E Yahweh disse: ‘Estes não têm senhor[a]; que cada homem volte para sua casa em paz[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não têm senhores”, conforme a forma plural do hebraico; no contexto, a expressão indica que Israel está sem sua autoridade governante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que cada um volte em paz para sua casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: espalhado
  rationale: O particípio de פוץ descreve dispersão. “Espalhado” é natural em português e preserva a imagem de um exército desbaratado e sem liderança; o singular concorda idiomaticamente com o coletivo “todo o Israel”.
- source_word: אֶל הֶהָרִים
  choice: pelos montes
  rationale: Embora אֶל normalmente indique direção, neste quadro visionário a expressão descreve onde Israel se encontra disperso. “Pelos montes” comunica de modo natural a distribuição por toda a região montanhosa.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: como ovelhas que não têm pastor
  rationale: Mantém diretamente a conhecida comparação bíblica e a força existencial de אֵין, em linguagem clara e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲדֹנִים
  choice: senhor
  rationale: Embora a forma hebraica seja plural, o contexto aponta para a ausência da autoridade governante, especialmente o rei. O singular coletivo “senhor” é idiomático e permanece mais próximo do campo lexical do que “líder”.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: que cada homem volte para sua casa
  rationale: O imperfeito tem força volitiva ou jussiva no discurso divino. “Que ... volte” expressa essa determinação, e “cada homem” conserva o distributivo masculino אִישׁ.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: É a equivalência habitual e preserva tanto o idioma hebraico quanto a tensão de um exército sem rei que pode regressar sem continuar a batalha.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Número e sentido de אֲדֹנִים
  choice: Estes não têm senhor
  alternative: Estes não têm senhores; Estes não têm líder
  rationale: A forma hebraica é plural, mas o contexto imediato apresenta Israel privado de sua cabeça governante, o rei. O texto principal usa o singular idiomático, enquanto a nota preserva a ambiguidade formal.
- issue: Distributivo masculino אִישׁ
  choice: cada homem
  alternative: cada um; todos
  rationale: A expressão mantém o substantivo masculino singular do hebraico e seu sentido distributivo, sem neutralizá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo da visão e evita explicar no corpo do texto que o “senhor” ausente é o rei; essa inferência contextual fica aberta. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
