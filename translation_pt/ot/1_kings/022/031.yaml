base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: pt
  text: 'O rei de Arã[a] tinha dado a seguinte ordem aos trinta e dois comandantes de carros de guerra que estavam a seu serviço: “Não lutem contra ninguém, pequeno ou grande,[b] mas somente contra o rei de Israel, e contra mais ninguém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arã” é o nome do lugar em hebraico; tradicionalmente, é traduzido como “Síria”.
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica “pequeno ou grande” refere-se a pessoas de qualquer posição ou importância.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: O rei de Arã
  rationale: O waw introduz a continuação narrativa e não precisa ser representado mecanicamente por “e” em português. אֲרָם é mantido como o nome histórico Arã, em vez da identificação tradicional “Síria”.
- source_word: צִוָּה
  choice: tinha dado a seguinte ordem
  rationale: O mais-que-perfeito composto apresenta a ordem como anterior à ação subsequente da batalha; a formulação é natural em português e preserva o sentido de comando.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: comandantes dos seus carros de guerra
  rationale: שָׂרֵי designa chefes ou comandantes militares, e הָרֶכֶב refere-se à força de carros. O possessivo “seus” representa de modo conciso אֲשֶׁר לוֹ.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: trinta e dois
  rationale: Representação direta do número cardinal.
- source_word: לֵאמֹר
  choice: 'a seguinte ordem:'
  rationale: A fórmula hebraica introduz o conteúdo da ordem. Em português, os dois-pontos após “a seguinte ordem” são mais naturais que o literal “dizendo”.
- source_word: לֹא תִּלָּחֲמוּ אֶת קָטֹן וְאֶת גָּדוֹל
  choice: Não lutem contra ninguém, seja pequeno ou grande
  rationale: A proibição está no plural. “Pequeno ou grande” é um merismo referente a pessoas de qualquer posição; “ninguém” explicita o valor idiomático sem eliminar a imagem hebraica.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: mas somente contra o rei de Israel, e contra mais ninguém
  rationale: “Mas somente” expressa a exceção enfática de כִּי אִם, enquanto “e contra mais ninguém” preserva a força exclusiva adicional de לְבַדּוֹ.
