revisions:
- from: 'O rei de Arã[a] tinha dado a seguinte ordem aos trinta e dois comandantes dos seus carros de guerra: “Não lutem contra ninguém, seja pequeno ou grande,[b] mas somente contra o rei de Israel, e contra mais ninguém”.'
  to: 'O rei de Arã[a] tinha dado a seguinte ordem aos trinta e dois comandantes de carros de guerra que estavam a seu serviço: “Não lutem contra ninguém, pequeno ou grande,[b] mas somente contra o rei de Israel, e contra mais ninguém.”'
  rationale: A revisão esclarece que os comandantes, e não meramente os carros, estão vinculados ao rei, e ajusta levemente a construção do merismo para maior naturalidade. Mantém a exclusividade enfática do alvo («somente ... e contra mais ninguém»), sem alterar o sentido.
