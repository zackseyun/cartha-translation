  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: pt
  text: E Josafá, filho de Asa, tornou-se rei de Judá no quarto ano de Acabe, rei de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: E Josafá
  rationale: A conjunção ו preserva a ligação narrativa com o contexto anterior. Usa-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן אָסָא
  choice: filho de Asa
  rationale: A construção hebraica identifica diretamente a linhagem de Josafá; a formulação é natural e exata em português.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste informe cronológico, o perfeito qal assinala a ascensão ao trono, e não apenas a duração do reinado.
- source_word: עַל יְהוּדָה
  choice: de Judá
  rationale: Embora עַל expresse governo sobre Judá, em português a locução idiomática 'rei de Judá' comunica naturalmente a autoridade régia sem sugerir mera localização.
- source_word: בִּ/שְׁנַת אַרְבַּע
  choice: no quarto ano
  rationale: Mantém a fórmula usual de datação régia em português claro e corrente.
- source_word: לְ/אַחְאָב
  choice: de Acabe
  rationale: Na fórmula cronológica, ל relaciona o quarto ano ao reinado de Acabe; o contexto torna desnecessário acrescentar 'do reinado'.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Reproduz com clareza o título em aposição que identifica Acabe.
