base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/002.yaml
  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: pt
  text: No terceiro ano, Josafá, rei de Judá, desceu até o rei de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «foi até o rei de Israel». O verbo hebraico significa literalmente «desceu» e pode refletir a diferença de altitude, além de simplesmente indicar a viagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: No terceiro ano
  rationale: A forma narrativa de היה introduz a indicação temporal; em português natural, seu valor é expresso diretamente pela locução temporal, sem o formulaico “E aconteceu”.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva o sentido direcional e possivelmente topográfico de ירד, ao mesmo tempo que soa natural em português no contexto de uma viagem.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reproduz de modo direto a cadeia construta que identifica o cargo real de Josafá; a aposição fica delimitada por vírgulas em português.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: para encontrar-se com o rei de Israel
  rationale: אֶל indica movimento em direção a uma pessoa. Neste contexto, a formulação explicita naturalmente que o destino da viagem era a presença do rei, sem identificar o monarca, que permanece sem nome no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se “desceu” no texto para conservar a perspectiva espacial do hebraico; “para encontrar-se com” evita a possível impressão, em português, de que Josafá apenas se deslocou até um território ou edifício.
