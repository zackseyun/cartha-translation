id: 1KI.22.12
reference: 1 Kings 22:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: pt
  text: 'E todos os profetas profetizavam da mesma forma, dizendo: “Suba a Ramote-Gileade e tenha êxito[a], e Yahweh a entregará nas mãos do rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja bem-sucedido”.'
    reason: Alternativa lexical para וְהַצְלַח, que expressa prosperar ou alcançar sucesso.
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: E todos os profetas
  rationale: Preserva a coordenação narrativa, a ideia coletiva de כָּל e o artigo definido de הַנְּבִאִים.
- source_word: נִבְּאִים כֵּן
  choice: profetizavam da mesma forma
  rationale: O particípio נִבְּאִים indica ação em andamento, enquanto כֵּן caracteriza a maneira uniforme pela qual eles profetizavam.
- source_word: לֵ/אמֹר
  choice: dizendo
  rationale: Forma corrente e direta de introduzir o discurso citado.
- source_word: עֲלֵה
  choice: Suba
  rationale: Mantém o sentido básico de עלה, ‘subir’, sem explicitar como ataque militar aquilo que permanece implícito no contexto.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Transliteração tradicional e reconhecível do topônimo em português.
- source_word: וְ/הַצְלַח
  choice: e tenha êxito
  rationale: Expressa o resultado bem-sucedido indicado pelo hifil de צלח e soa natural como exortação no contexto militar.
- source_word: וְ/נָתַן
  choice: e ... entregará
  rationale: O perfeito com waw, após os imperativos, é entendido como promessa de resultado futuro. ‘Entregará’ comunica naturalmente a transferência de controle expressa pelo idioma hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: nas mãos do rei
  rationale: Reproduz em português corrente o idioma hebraico que indica entrega ao poder ou controle do rei, preservando o título em vez de substituí-lo por pronome.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; ‘Yahweh’ preserva essa distinção sem convertê-lo em título.
- issue: Objeto não expresso de וְנָתַן
  choice: a entregará
  alternative: entregará isso
  rationale: O hebraico deixa o objeto implícito. O pronome feminino retoma naturalmente Ramote-Gileade em português, sem definir se a promessa focaliza a cidade ou, por extensão, sua conquista.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa clara. O imperativo ‘Suba’ conserva a imagem verbal hebraica; ‘nas mãos do rei’ mantém o idioma bíblico ainda compreensível em português atual.
