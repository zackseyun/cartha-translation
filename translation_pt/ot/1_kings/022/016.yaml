  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: pt
  text: 'Então o rei lhe disse: “Quantas vezes terei de fazer você jurar[a] que não me dirá nada além da verdade em nome de Yahweh?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quantas vezes terei de colocar você sob juramento...?” O verbo hebraico significa fazer alguém jurar ou colocá-lo sob juramento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o substantivo definido e o título usados no hebraico, sem substituí-los pelo nome próprio.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Quantas vezes
  rationale: Expressão idiomática que comunica a impaciência diante de algo repetido.
- source_word: מַשְׁבִּעֶךָ
  choice: terei de fazer você jurar
  rationale: O hifil de שׁבע significa fazer alguém jurar ou colocá-lo sob juramento; a construção com “terei de” transmite a força exasperada da pergunta retórica.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: que não me dirá nada além da verdade
  rationale: Preserva a forma negativa e restritiva do hebraico, ao mesmo tempo que emprega uma expressão clara e natural em português.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Expressa que a fala ocorre sob a invocação e autoridade do nome divino, mantendo o nome próprio do texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva sua função como nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A forma “você” evita a rigidez de “tu” em variedades que não o empregam correntemente, sem tornar a fala coloquial demais.
