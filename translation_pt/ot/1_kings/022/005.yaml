  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: pt
  text: 'Então Josafá disse ao rei de Israel: “Por favor, busque hoje a palavra de Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “consulte Yahweh hoje, pedindo uma palavra”; também: “procure hoje a palavra de Yahweh”.'
    reason: 'Alternativa lexical para דָּרַשׁ e ambiguidade natural da construção hebraica: buscar a palavra divina ou consultar Yahweh para recebê-la.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ao rei de Israel
  rationale: Reproduz diretamente a relação preposicional e mantém o título régio.
- source_word: דְּרָשׁ
  choice: consulte
  rationale: Neste contexto, o verbo significa buscar orientação ou revelação divina; “consultar” é natural em português e preserva esse sentido.
- source_word: נָא
  choice: Por favor
  rationale: Representa o valor de súplica ou cortesia da partícula hebraica em linguagem moderna.
- source_word: כַיּוֹם
  choice: hoje
  rationale: Preserva a referência temporal e a possível urgência do pedido sem ampliá-la interpretativamente.
- source_word: אֶת דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém “palavra” e a construção hebraica como objeto da consulta, sem substituí-la por uma interpretação como “vontade” ou “conselho”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Objeto da consulta profética
  choice: consulte ... a palavra de Yahweh
  alternative: busque a palavra de Yahweh; consulte Yahweh para receber uma palavra
  rationale: A formulação conserva “palavra” como objeto gramatical e não resolve além do necessário se Josafá pede que se busque uma mensagem ou que se consulte o próprio Deus em busca dela.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Josafá” segue a forma portuguesa consagrada; “Por favor” evita uma súplica arcaizante. O marcador de nota foi colocado após a fala a que se refere.
