  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּכֶּ֥ה אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֕אמֶר אֵי זֶ֨ה עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אוֹתָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: pt
  text: 'Então Zedequias, filho de Quenaaná, aproximou-se, golpeou Micaías na bochecha e disse: “Por onde[a] foi que o Espírito de Yahweh passou de mim para falar com você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De que maneira o Espírito de Yahweh passou de mim para falar com você?”'
    reason: Registra a possível nuance modal de אֵי זֶה, além do sentido espacial expresso no texto principal.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: aproximou-se
  rationale: Expressa de modo natural o movimento de Zedequias em direção a Micaías e mantém o tom de confronto.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedequias, filho de Quenaaná
  rationale: Emprega as formas portuguesas correntes dos nomes e conserva a construção patronímica hebraica.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: bateu em Micaías no rosto
  rationale: Mantém o sentido amplo de נכה, sem especificar indevidamente que o golpe foi uma bofetada; “no rosto” comunica em português corrente a região indicada por לֶחִי.
- source_word: אֵי זֶה
  choice: Por onde foi que
  rationale: Reproduz a pergunta sarcástica sobre o suposto caminho pelo qual o Espírito teria saído de Zedequias e ido falar com Micaías, preservando também a possibilidade de uma pergunta sobre o modo.
- source_word: עָבַר
  choice: passou
  rationale: Conserva a imagem espacial do verbo hebraico, que pode indicar passar, atravessar ou ir de um lugar a outro.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: No contexto da disputa profética, a expressão designa o Espírito divino associado à fala profética.
- source_word: מֵאִתִּי
  choice: de mim
  rationale: Representa diretamente a origem ou o ponto de partida indicado pela preposição hebraica.
- source_word: לְדַבֵּר אוֹתָךְ
  choice: para falar com você
  rationale: É uma formulação natural em português para a construção hebraica, sem ampliar o conteúdo da fala.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- issue: Sentido e grafia de רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  alternative: o espírito de Yahweh
  rationale: O contexto de reivindicações proféticas favorece a referência ao Espírito divino; a inicial maiúscula torna isso claro sem acrescentar uma formulação doutrinária ao versículo.
- issue: Força da pergunta de Zedequias
  choice: pergunta sarcástica sobre por onde o Espírito teria passado
  alternative: pergunta sobre de que maneira o Espírito teria passado
  rationale: A formulação principal preserva a imagem espacial de עָבַר e מֵאִתִּי, enquanto a nota registra a possível nuance modal sem eliminar a ironia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Bateu ... no rosto” evita tanto o formalismo de “feriu na face” quanto a especificação excessiva de “deu uma bofetada”. A fala mantém deliberadamente a imagem incomum de o Espírito “passar de mim”, presente no hebraico e essencial ao sarcasmo de Zedequias.
