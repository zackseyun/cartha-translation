  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: pt
  text: Depois, subam atrás dele. Ele virá, se sentará no meu trono e reinará em meu lugar, e eu o designei[a] para ser governante sobre Israel e sobre Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a ele ordenei que fosse líder sobre Israel e sobre Judá”. O verbo hebraico costuma significar “ordenar”, e נָגִיד também pode ser traduzido como “líder” ou “príncipe”.'
    reason: Alternativa lexical para צִוִּיתִי e נָגִיד.
lexical_decisions:
- source_word: וַעֲלִיתֶם
  choice: subam
  rationale: עלה expressa subir. O imperativo em português acompanha naturalmente a sequência de instruções do contexto e preserva o movimento em direção à cidade.
- source_word: אַחֲרָיו
  choice: atrás dele
  rationale: A expressão indica que os participantes devem seguir Salomão na procissão. “Atrás dele” é claro e natural em português.
- source_word: וּבָא
  choice: ele virá
  rationale: בוא tem o sentido amplo de vir ou entrar. “Virá” preserva a formulação menos interpretativa, enquanto a oração seguinte esclarece o destino do movimento.
- source_word: וְיָשַׁב עַל כִּסְאִי
  choice: se sentará no meu trono
  rationale: A expressão descreve a entronização. A forma pronominal “se sentará” é idiomática em português e mantém a imagem concreta do texto hebraico.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: e reinará em meu lugar
  rationale: תַּחְתָּי indica substituição ou sucessão no cargo. “Em meu lugar” comunica que Salomão exercerá a realeza antes exercida por Davi, sem reduzir a expressão a uma simples sequência temporal.
- source_word: וְאֹתוֹ צִוִּיתִי
  choice: pois foi ele que designei
  rationale: O pronome objeto antecipado dá ênfase a Salomão. Neste contexto régio, צוה tem força de designação para um ofício; a nota preserva o sentido lexical mais comum, “ordenar”.
- source_word: לִהְיוֹת נָגִיד
  choice: para ser governante
  rationale: נָגִיד designa alguém posto à frente do povo, podendo ser traduzido como governante, líder ou príncipe. “Governante” é acessível e mantém distinção em relação ao verbo מלך, “reinar”.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: sobre Israel e sobre Judá
  rationale: A repetição de “sobre” reflete a repetição de עַל e conserva a apresentação de Israel e Judá como âmbitos distintos da autoridade régia.
theological_decisions:
- issue: O termo régio נָגִיד em relação ao verbo מלך
  choice: “governante” para נָגִיד e “reinará” para מלך
  alternative: “príncipe” ou “líder” para נָגִיד
  rationale: O versículo emprega dois termos distintos para a autoridade régia. A tradução evita nivelá-los como “rei” e preserva a nuance entre o ato de reinar e a designação como alguém posto à frente do povo.
- issue: Sentido de צִוִּיתִי na designação de Salomão
  choice: “designei” no texto principal
  alternative: “ordenei”
  rationale: O contexto favorece uma declaração de nomeação para o governo, mas o sentido habitual do verbo é “ordenar”. A alternativa é mantida em nota para não eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação divide a longa cadeia hebraica em duas frases sem alterar sua sequência. O tratamento no plural é expresso por “subam”; os demais verbos passam a ter Salomão como sujeito.
