  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: pt
  text: 'Então informaram a Salomão: “Adonias está com medo do rei Salomão e se agarrou às pontas do altar, dizendo: ‘Que o rei Salomão me jure hoje que não matará seu servo à espada.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה לֵאמֹר
  choice: Então informaram a Salomão
  rationale: A construção passiva impessoal hebraica é expressa naturalmente em português por sujeito indeterminado; לֵאמֹר introduz o conteúdo da informação e não precisa ser traduzido por um segundo verbo redundante.
- source_word: הִנֵּה
  choice: — / está ... e se agarrou
  rationale: As duas ocorrências chamam atenção para a situação. Em português corrente, esse destaque é transmitido pela apresentação direta dos fatos, evitando o artificialismo de repetir “eis que”.
- source_word: יָרֵא
  choice: está com medo
  rationale: No contexto, descreve o temor imediato de Adonias diante do rei, e não reverência religiosa.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: pontas do altar
  rationale: “Pontas” comunica em linguagem comum as projeções nos quatro cantos do altar; “chifres” seria mais literal, mas menos claro sem explicação.
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: me jure hoje
  rationale: כַיּוֹם tem aqui valor temporal enfático, pedindo uma garantia imediata.
- source_word: אִם יָמִית אֶת עַבְדּוֹ בֶּחָרֶב
  choice: que não matará seu servo à espada
  rationale: Após uma fórmula de juramento, אִם introduz o conteúdo negativo implícito; a tradução explicita essa negação exigida pela sintaxe e pelo sentido.
theological_decisions:
- issue: Sentido da ação junto ao altar
  choice: Manter apenas a ação concreta de agarrar-se às pontas do altar
  alternative: Explicitar que Adonias buscava asilo ou proteção sagrada
  rationale: O texto relata o gesto sem formular uma doutrina geral de asilo; a tradução preserva essa contenção.
- issue: Autodesignação de Adonias
  choice: seu servo
  alternative: a mim
  rationale: Preserva a linguagem cortesã e a postura de submissão presentes em עַבְדּוֹ.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A ordem narrativa e a fala encaixada foram preservadas, mas redundâncias formulares pouco naturais em português foram reduzidas sem perda de conteúdo.
