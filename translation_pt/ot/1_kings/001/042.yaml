base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: pt
  text: 'Enquanto ele ainda falava, eis que chegou Jônatas, filho do sacerdote Abiatar. Adonias lhe disse: “Entre, pois você é um homem de valor[a] e traz boas notícias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem valente”, “homem capaz” ou “homem respeitável”. A expressão hebraica אִישׁ חַיִל pode indicar valentia, capacidade ou posição social, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Enquanto ele ainda falava
  rationale: Expressa de modo natural a ação em andamento quando ocorre a chegada de Jônatas.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva o marcador discursivo que chama a atenção para uma chegada súbita ou significativa.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: filho do sacerdote Abiatar
  rationale: A formulação deixa claro que o título “sacerdote” qualifica Abiatar, conforme a construção hebraica e o contexto.
- source_word: בֹּא
  choice: Entre
  rationale: O imperativo é um convite para Jônatas entrar no local da reunião; “Entre” é direto e natural em português.
- source_word: אִישׁ חַיִל
  choice: um homem de valor
  rationale: Mantém a amplitude da expressão hebraica, que pode indicar valor, capacidade, respeitabilidade ou posição, sem restringi-la à valentia militar.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: e traz boas notícias
  rationale: Reproduz naturalmente a expectativa de Adonias de que um mensageiro respeitável traria notícias favoráveis.
