base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: pt
  text: Mas não convidou[a] nem a mim, seu servo, nem o sacerdote Zadoque, nem Benaia, filho de Joiada, nem Salomão, seu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não chamou” ou “não convocou”. O verbo hebraico pode indicar chamar, convocar ou convidar; “convidou” se ajusta ao contexto imediato do banquete sacrificial de Adonias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: nem a mim, seu servo
  rationale: A construção anteposta é enfática e contrasta Natã com os convidados mencionados antes; em português, “nem a mim” liga naturalmente este primeiro elemento aos demais sob a negação, enquanto “seu servo” preserva a linguagem deferente da corte.
- source_word: וּלְצָדֹק הַכֹּהֵן
  choice: nem o sacerdote Zadoque
  rationale: A repetição de לְ introduz outro objeto de קָרָא; sob a negação, a coordenação portuguesa com “nem” torna clara a abrangência da lista. O título definido é preservado.
- source_word: וְלִבְנָיָהוּ בֶן יְהוֹיָדָע
  choice: nem Benaia, filho de Joiada
  rationale: Mantém o patronímico hebraico em formulação portuguesa natural e segue a coordenação negativa da lista.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: nem Salomão, seu servo
  rationale: Preserva a designação cortesã de Salomão em relação ao rei, sem confundi-la com a autodesignação anterior de Natã.
- source_word: לֹא קָרָא
  choice: não convidou
  rationale: Embora קרא possa significar chamar ou convocar, no contexto imediato do banquete sacrificial de Adonias o sentido idiomático é convidar. O verbo no singular mantém Adonias como sujeito implícito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes segundo formas bíblicas correntes em português. A lista hebraica anteposta foi reorganizada de modo moderado para evitar uma construção truncada, mantendo sua ênfase contrastiva e a repetição enfática por meio de “nem... nem”.
