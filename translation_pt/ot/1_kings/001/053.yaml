  - severity: low
    issue: A nota de rodapé não apresenta de modo completo o valor da expressão hebraica
    rationale: A nota afirma que o hebraico diz literalmente “de sobre o altar”, mas não explica que se trata da alternativa espacial à formulação idiomática “do altar”. Uma redação mais precisa esclarece a nuance sem alegar que Adonias estivesse necessariamente em pé sobre a estrutura.
