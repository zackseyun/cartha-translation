base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: pt
  text: 'Então, o rei Salomão mandou buscá-lo, e eles o fizeram descer do altar.[a] Adonias veio e se prostrou diante do rei Salomão. E Salomão lhe disse: “Vá para a sua casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles o fizeram descer de sobre o altar”. O hebraico diz literalmente “de sobre o altar”; no contexto, Adonias estava agarrado às pontas do altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou buscá-lo
  rationale: O hebraico diz literalmente que Salomão “enviou”, sem explicitar o objeto ou os agentes. Em português, “mandou buscá-lo” expressa naturalmente a ordem implícita e liga a ação ao resultado narrado na oração seguinte.
- source_word: וַיֹּרִדֻהוּ
  choice: eles o fizeram descer
  rationale: 'A forma causativa de ירד tem agentes não nomeados e Adonias como objeto: fizeram com que ele descesse. A formulação preserva esse valor causativo sem especificar se o conduziram ou retiraram à força.'
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: de junto do altar
  rationale: מֵעַל pode significar literalmente “de sobre”, mas o contexto anterior mostra Adonias agarrado às pontas do altar, não necessariamente em cima dele. “De junto do altar” evita uma imagem espacial enganosa.
- source_word: וַיָּבֹא
  choice: Adonias veio
  rationale: בוא significa “vir/chegar”. A explicitação do sujeito, identificado pelo contexto, evita em português a momentânea ambiguidade criada pela sequência de sujeitos no hebraico.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prostrou
  rationale: A forma verbal descreve inclinar-se profundamente ou prostrar-se em homenagem. “Se prostrou” conserva a força do gesto sem o interpretar como adoração religiosa.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: diante do rei Salomão
  rationale: Com o verbo de prostração, ל marca a pessoa a quem se presta homenagem. “Diante de” é natural em português e descreve a relação sem sugerir oração dirigida ao rei.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: Vá para a sua casa
  rationale: Tradução direta do imperativo e da expressão de destino, mantendo o tom sóbrio de uma dispensa real.
