  source_fidelity: A expressão espacial hebraica מֵעַל exige uma tradução que mantenha a ideia de afastamento de cima/sobre o altar; “de junto do altar” a enfraquece e pode indicar mera proximidade. “Mandou buscá-lo” é uma explicitação idiomática aceitável de “enviou”, dado o resultado imediato da ordem e os agentes não nomeados.
  naturalness: O texto é claro e de registro apropriado. “Do altar” é a formulação portuguesa natural no corpo do texto, com a nuance mais literal preservada em nota. A identificação explícita de Adonias evita ambiguidade de sujeito sem alterar o sentido.
  terminology: “Rei Salomão”, “se prostrou” e “Vá para a sua casa” são adequados, sóbrios e fiéis ao contexto de homenagem e dispensa real. “Diante do rei Salomão” traduz naturalmente a relação expressa com o verbo de prostração.
