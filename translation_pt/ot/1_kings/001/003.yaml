language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: pt
  text: Assim, procuraram por todo o território de Israel uma jovem bonita[a]. Encontraram Abisague, a sunamita[b], e a levaram ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscaram uma jovem bonita em todo o território de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Sunamita” significa que ela era uma mulher de Suném.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: procuraram
  rationale: O verbo בקשׁ expressa a ação de procurar ou buscar. “Procuraram” é natural em português e comunica uma busca ativa.
- source_word: נַעֲרָה
  choice: uma jovem
  rationale: נַעֲרָה designa uma pessoa do sexo feminino ainda jovem, muitas vezes em idade de casar. “Uma jovem” evita tanto a possível conotação infantil de “menina” quanto o tom arcaico de “donzela”.
- source_word: יָפָה
  choice: bonita
  rationale: O adjetivo descreve diretamente a beleza física. “Bonita” é claro, corrente e adequado ao registro narrativo.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: por todo o território de Israel
  rationale: גְּבוּל pode indicar fronteira ou território; aqui se refere a toda a extensão da terra de Israel, não apenas às linhas de fronteira.
- source_word: וַיִּמְצְאוּ
  choice: Encontraram
  rationale: Equivalente narrativo simples e direto para o verbo מצא.
- source_word: אֶת אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abisague, a sunamita
  rationale: O nome é transliterado na forma portuguesa corrente “Abisague”. O gentílico “sunamita” preserva a designação hebraica e indica sua procedência.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: e a levaram ao rei
  rationale: No hifil, בוא significa aqui “levar/trazer”. Como o movimento é apresentado da perspectiva dos que conduzem a jovem ao rei, “levaram ao rei” soa natural em português sem acrescentar informação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem da primeira oração foi ajustada para fluidez, sem alterar o alcance da busca. O gentílico tradicional “sunamita” foi mantido e explicado em nota.
