base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: pt
  text: Então, o sacerdote Zadoque, o profeta Natã, Benaia, filho de Joiada, os quereteus e os peleteus[a] desceram, fizeram Salomão montar na mula do rei Davi[b][c] e o conduziram até Giom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “a guarda real”. O hebraico emprega os próprios nomes dos grupos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a mula do rei Davi”.'
    reason: lexical_alternative
  - marker: c
    text: O substantivo hebraico traduzido como “mula” é gramaticalmente feminino e pode indicar especificamente uma fêmea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceram
  rationale: Preserva o sentido direcional de ירד e concorda naturalmente com o sujeito composto em português.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente de כהן, mantido como título em aposição a Zadoque.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Equivalente direto e corrente de נביא, preservando o título de Natã.
- source_word: בֶן יְהוֹיָדָע
  choice: filho de Joiada
  rationale: Traduz de modo direto o patronímico hebraico.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: os quereteus e os peleteus
  rationale: Mantém os nomes dos grupos, pois sua identidade ou função exata é discutida; 'guarda real' seria uma interpretação funcional.
- source_word: וַיַּרְכִּבוּ
  choice: fizeram Salomão montar
  rationale: Expressa claramente o valor causativo do hifil de רכב em português natural.
- source_word: פִּרְדַּת
  choice: mula
  rationale: O substantivo designa uma mula e tem forma feminina; 'mula' preserva naturalmente ambas as informações em português.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: do rei Davi
  rationale: Reproduz a relação possessiva da cadeia construta sem alterar a associação régia do animal.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: o conduziram
  rationale: Representa o sentido causativo de הלך e se ajusta à procissão de Salomão montado, sem sugerir necessariamente que ele caminhava.
- source_word: עַל גִּחוֹן
  choice: até Giom
  rationale: No contexto de movimento, apresenta Giom como destino de maneira idiomática em português.
