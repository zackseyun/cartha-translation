id: 1KI.1.27
reference: 1 Kings 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: pt
  text: Se[a] este assunto[b] veio da parte do meu senhor, o rei, não informaste aos teus servos quem se sentará no trono do meu senhor, o rei, depois dele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que”. A construção hebraica pode introduzir uma condição ou uma pergunta retórica direta.'
    reason: ambiguity
  - marker: b
    text: 'Ou: “esta coisa” ou “este caso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Mantém a forma condicional do hebraico e deixa intacta a força retórica da pergunta, sem convertê-la silenciosamente numa afirmação direta.
- source_word: מֵאֵת ... נִהְיָה
  choice: veio da parte de
  rationale: 'Expressa origem ou autorização: o assunto teria partido do rei ou ocorrido por sua determinação.'
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Reproduz de modo natural e digno a fórmula deferente usada na corte.
- source_word: הַדָּבָר הַזֶּה
  choice: este assunto
  rationale: Neste contexto, דָּבָר se refere à ação ou decisão real em discussão; “assunto” é claro e natural sem especificar além do hebraico.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: não informaste
  rationale: O hifil de ידע significa fazer saber ou informar. A formulação concisa conserva a acusação implícita na pergunta.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: Trata-se de uma autodesignação deferente de oficiais da corte; “servos” comunica subordinação sem destacar escravidão como se esse fosse o ponto do contexto.
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: quem se sentará no trono
  rationale: Preserva a imagem explícita de sentar-se no trono, em vez de reduzi-la interpretativamente a “quem reinará”.
- source_word: אַחֲרָיו
  choice: depois dele
  rationale: Mantém a referência direta à sucessão após o rei, sem ampliá-la para “em seu lugar”.
theological_decisions:
- issue: Sentido de עבד na linguagem cortesã
  choice: teus servos
  alternative: teus escravos
  rationale: A expressão funciona aqui como fórmula de deferência dos oficiais diante do rei. O texto não põe em primeiro plano a condição jurídica de escravidão.
- issue: Força de אִם no início da pergunta
  choice: Se
  alternative: Será que / Foi por ordem de
  rationale: “Se” preserva a estrutura condicional e a possível nuance retórica. Uma pergunta direta seria mais fluente, mas resolveria uma ambiguidade real do hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. Conservou-se a repetição solene de “meu senhor, o rei” e a estrutura retórica do hebraico, esclarecida em nota.
