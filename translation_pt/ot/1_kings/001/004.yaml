  text: וְ/הַֽ/נַּעֲרָ֖ה יָפָ֣ה עַד מְאֹ֑ד וַ/תְּהִ֨י לַ/מֶּ֤לֶךְ סֹכֶ֨נֶת֙ וַ/תְּשָׁ֣רְתֵ֔/הוּ וְ/הַ/מֶּ֖לֶךְ לֹ֥א יְדָעָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: pt
  text: A jovem era muito bonita e tornou-se assistente do rei, e o servia; mas o rei não teve relações sexuais com ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não a conheceu”; aqui, “conhecer” é um eufemismo para ter relações sexuais.'
    reason: Registra a forma idiomática do original e explica seu sentido.
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: a jovem
  rationale: Expressa naturalmente uma mulher jovem em português atual, sem o tom arcaico de “donzela” nem a possível conotação infantil de “menina”.
- source_word: יָפָה עַד מְאֹד
  choice: era muito bonita
  rationale: Reproduz de modo idiomático a forte intensificação da beleza, com linguagem clara e corrente.
- source_word: סֹכֶנֶת
  choice: assistente
  rationale: Designa sua função de apoio junto ao rei sem especificar indevidamente cuidados médicos nem sugerir relação romântica.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: ela cuidava dele
  rationale: Distingue esta ação do cargo já indicado por “assistente” e comunica naturalmente o serviço pessoal prestado ao rei nesse contexto.
- source_word: יְדָעָהּ
  choice: não teve relações sexuais com ela
  rationale: Embora o hebraico diga literalmente “não a conheceu”, aqui “conhecer” é um eufemismo inequívoco para relações sexuais. A formulação explícita evita que o sentido seja perdido no português moderno.
theological_decisions:
- issue: Eufemismo sexual na descrição narrativa
  choice: Explicitar no texto principal que o rei não teve relações sexuais com ela.
  alternative: Preservar literalmente “o rei não a conheceu”, esclarecendo o sentido em nota.
  rationale: Em português moderno, “não a conheceu” normalmente seria entendido como falta de contato ou apresentação, e não como eufemismo sexual. A tradução explícita preserva o sentido narrativo sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência pesada de orações coordenadas. O pronome “ela” torna claro que é a jovem quem cuida do rei.
