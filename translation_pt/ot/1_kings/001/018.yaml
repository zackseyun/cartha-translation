base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: pt
  text: E agora, eis que Adonias se tornou rei; e agora, meu senhor, o rei, não sabe disso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: veja
  rationale: Mantém o valor de chamada de atenção da partícula hebraica em linguagem portuguesa natural.
- source_word: מָלָךְ
  choice: se tornou rei
  rationale: No contexto, o perfeito indica que Adonias assumiu ou reivindicou a realeza; esta formulação preserva o foco no novo estado sem acrescentar legitimidade.
- source_word: לֹא יָדָעְתָּ
  choice: não está sabendo disso
  rationale: Expressa a falta presente de conhecimento do rei e usa 'disso' para tornar explícita, sem alterar o sentido, a referência ao fato recém-declarado.
theological_decisions:
- issue: Legitimidade da realeza de Adonias
  choice: se tornou rei
  alternative: é rei / reina
  rationale: A tradução relata a ascensão reivindicada por Adonias sem afirmar que sua realeza era legítima diante de Deus ou de Davi.
translation_notes:
  register: Português moderno, digno e acessível, com vocativo natural ('o senhor, meu rei') e preservação da repetição enfática de וְעַתָּה por meio de 'E agora' no início e da transição direta ao vocativo na segunda oração.
