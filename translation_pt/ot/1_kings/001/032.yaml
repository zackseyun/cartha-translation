  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem “o sacerdote Zadoque, o profeta Natã” é natural em português e preserva os títulos definidos do hebraico. Não há ambiguidades teológicas relevantes nem necessidade de notas.
