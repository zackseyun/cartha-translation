base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: pt
  text: 'Então o rei Davi disse: “Chamem à minha presença o sacerdote Zadoque, o profeta Natã e Benaia, filho de Joiada”. E eles vieram à presença do rei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Reproduz de modo natural a construção que identifica Davi por seu título real.
- source_word: קִרְאוּ לִי
  choice: Chamem à minha presença
  rationale: O imperativo plural com לִי ordena que essas pessoas sejam chamadas para comparecer diante do rei; a formulação evita a possível leitura moderna de contato à distância.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: o sacerdote Zadoque
  rationale: Mantém o nome tradicional em português e apresenta com naturalidade o cargo definido de Zadoque.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Traduz diretamente o nome acompanhado de seu título definido.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: e Benaia, filho de Joiada
  rationale: Translitera os nomes conforme o uso bíblico corrente em português e preserva a identificação patronímica.
- source_word: וַיָּבֹאוּ
  choice: E eles vieram
  rationale: Preserva o movimento narrativo simples e sequencial do waw consecutivo.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: à presença do rei
  rationale: Expressa idiomaticamente que os homens compareceram diante do rei, sentido contextual de לִפְנֵי.
