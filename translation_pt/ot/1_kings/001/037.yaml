id: 1KI.1.37
reference: 1 Kings 1:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: pt
  text: Assim como Yahweh esteve com o meu senhor, o rei, que ele também esteja com Salomão[a] e torne o trono dele maior do que o trono do meu senhor, o rei Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que Yahweh também esteja com Salomão”. No hebraico, o sujeito de “esteja” está implícito e retoma Yahweh na oração anterior.'
    reason: alternativa lexical e esclarecimento do sujeito implícito
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Assim como ... também
  rationale: Preserva a correlação comparativa entre a presença de Yahweh com Davi e o desejo referente a Salomão, em português natural.
- source_word: הָיָה ... עִם
  choice: esteve com
  rationale: Expressa de modo claro a presença e o acompanhamento divinos experimentados por Davi até esse momento.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Mantém a fórmula respeitosa da linguagem da corte e identifica o senhor como o rei.
- source_word: יהי
  choice: que ele ... esteja
  rationale: Reproduz o valor volitivo do jussivo. O sujeito permanece implícito, como no hebraico, e retoma Yahweh.
- source_word: וִיגַדֵּל
  choice: e torne ... maior
  rationale: Traduz o causativo de גדל e forma naturalmente a comparação exigida pela construção seguinte.
- source_word: כִּסְאוֹ
  choice: o trono dele
  rationale: Conserva a imagem concreta do trono, que também representa a autoridade e o reinado de Salomão.
- source_word: מִכִּסֵּא
  choice: maior do que o trono
  rationale: A preposição מן introduz o padrão de comparação depois do verbo causativo.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: meu senhor, o rei Davi
  rationale: Preserva tanto a deferência a Davi quanto seu título régio, com sintaxe natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de o substituir por um título.
- issue: Sujeito implícito de יהי
  choice: que ele também esteja com Salomão
  alternative: que Yahweh também esteja com Salomão
  rationale: O jussivo hebraico não repete o sujeito, mas o contexto o identifica como Yahweh. A tradução conserva essa retomada implícita e a nota explicita a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo hebraico, a linguagem respeitosa da corte e a referência ambígua apenas gramaticalmente implícita no jussivo.
