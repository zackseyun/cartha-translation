  text: הִנֵּ֗ה עוֹדָ֛/ךְ מְדַבֶּ֥רֶת שָׁ֖ם עִם הַ/מֶּ֑לֶךְ וַ/אֲנִי֙ אָב֣וֹא אַחֲרַ֔יִ/ךְ וּ/מִלֵּאתִ֖י אֶת דְּבָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: pt
  text: 'Veja: enquanto você ainda estiver falando ali com o rei, eu entrarei depois de você e confirmarei as suas palavras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “completarei as suas palavras” ou “acrescentarei o que falta ao que você disser”; o idioma hebraico pode indicar que alguém acrescenta detalhes que confirmam a declaração de outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Enquanto
  rationale: A partícula chama atenção para a coordenação imediata do plano; em português, sua força é transmitida naturalmente pela construção temporal, sem acrescentar um imperativo pouco idiomático como “Veja”.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: enquanto você ainda estiver falando
  rationale: Expressa a ação contínua e simultânea indicada pelo advérbio com sufixo feminino singular e pelo particípio.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: ali com o rei
  rationale: Mantém tanto o advérbio locativo quanto o sentido normal de עִם, em linguagem natural para uma conversa na presença do rei.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: eu entrarei depois de você
  rationale: No contexto palaciano, בוא implica entrar na presença do rei; “depois de você” preserva a sequência planejada.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: confirmarei as suas palavras
  rationale: O idioma pode significar completar ou preencher as palavras de alguém mediante informação corroborante; “confirmarei” comunica com clareza sua função no contexto, enquanto a nota preserva a amplitude lexical.
theological_decisions: []
