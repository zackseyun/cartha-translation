id: 1KI.1.21
reference: 1 Kings 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּ/שְׁכַ֥ב אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ עִם אֲבֹתָ֑י/ו וְ/הָיִ֗יתִי אֲנִ֛י וּ/בְנִ֥/י שְׁלֹמֹ֖ה חַטָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: pt
  text: Quando meu senhor, o rei, repousar com seus antepassados, eu e meu filho Salomão seremos considerados culpados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pecadores”. O termo hebraico pode designar pessoas vistas como culpadas ou passíveis de punição; aqui, o contexto sugere uma condição jurídica e política, não apenas uma descrição moral geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: seremos
  rationale: A construção introduz o resultado futuro temido por Bate-Seba; em português, esse valor é expresso naturalmente pelo futuro do verbo na oração principal.
- source_word: כִּשְׁכַב
  choice: quando ... repousar
  rationale: שׁכב, junto de 'com seus antepassados', é um eufemismo convencional para morrer. 'Repousar' preserva a imagem sem soar excessivamente literal.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Mantém o tratamento deferente e cortesão dirigido a Davi, com pontuação natural em português.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: '''Antepassados'' comunica claramente a referência aos familiares falecidos e preserva o sentido do idioma hebraico.'
- source_word: וְהָיִיתִי אֲנִי וּבְנִי שְׁלֹמֹה
  choice: eu e meu filho Salomão seremos considerados
  rationale: O verbo 'ser' com חטאים descreve aqui a condição atribuída a Bate-Seba e Salomão; 'seremos considerados' explicita esse valor social e político sem afirmar que sejam de fato culpados.
- source_word: חַטָּאִים
  choice: culpados
  rationale: No contexto da disputa sucessória, o termo indica pessoas tidas como culpadas e sujeitas a punição. 'Culpados' preserva a dimensão moral-jurídica e a ambiguidade melhor que opções mais específicas como 'criminosos'.
theological_decisions:
- issue: O caráter da culpa de Bate-Seba e Salomão
  choice: seremos considerados culpados
  alternative: seremos pecadores
  rationale: A formulação não declara culpa moral real, mas conserva a perspectiva de que, após a morte de Davi, eles seriam tratados como culpados no conflito político.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão funerária hebraica foi mantida em forma natural como 'repousar com seus antepassados', e o tom respeitoso do discurso cortesão foi preservado.
