  text: וַ/יִּקַּח֩ צָד֨וֹק הַ/כֹּהֵ֜ן אֶת קֶ֤רֶן הַ/שֶּׁ֨מֶן֙ מִן הָ/אֹ֔הֶל וַ/יִּמְשַׁ֖ח אֶת שְׁלֹמֹ֑ה וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּֽאמְרוּ֙ כָּל הָ/עָ֔ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: pt
  text: 'Então o sacerdote Zadoque pegou da tenda[a] o chifre com óleo e ungiu Salomão. Em seguida, tocaram o chifre[b], e todo o povo exclamou: “Viva o rei Salomão!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do Tabernáculo”; em hebraico, literalmente “da tenda”.
    reason: alternative_reading
  - marker: b
    text: Ou “tocaram a trombeta”. O hebraico usa shofar, uma trombeta feita de chifre, muitas vezes de carneiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: Expressa de modo natural a ação narrativa de tomar o objeto, sem acrescentar a ideia mais específica de buscá-lo.
- source_word: צָדוֹק הַכֹּהֵן
  choice: o sacerdote Zadoque
  rationale: Ordem idiomática em português para o nome acompanhado de seu título; preserva diretamente a identificação do personagem.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: o chifre com óleo
  rationale: Mantém a imagem concreta do recipiente feito de chifre, enquanto “com óleo” comunica naturalmente seu conteúdo em português.
- source_word: מִן הָאֹהֶל
  choice: da Tenda
  rationale: Traduz literalmente o substantivo comum definido, sem substituí-lo no texto principal pelo termo técnico “Tabernáculo”; a inicial maiúscula sinaliza o referente conhecido no contexto cultual.
- source_word: וַיִּמְשַׁח
  choice: ungiu
  rationale: É o verbo português tradicional, exato e ainda corrente para a unção ritual e régia.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: tocaram o chifre
  rationale: Preserva o instrumento concreto indicado por שׁוֹפָר e usa um verbo português idiomático para fazê-lo soar.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Equivalência direta e natural que conserva o caráter coletivo da aclamação.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Viva o rei Salomão!
  rationale: Fórmula portuguesa natural de aclamação régia, reproduzindo adequadamente a força volitiva do jussivo hebraico.
theological_decisions:
- issue: Especificidade de הָאֹהֶל no contexto da unção régia
  choice: da Tenda
  alternative: do Tabernáculo; da tenda sagrada
  rationale: O hebraico diz literalmente “a tenda”. A tradução evita impor no texto principal um termo técnico mais específico, mas reconhece por meio da nota que o referente provavelmente é a tenda-santuário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador acompanhe a expressão a que de fato se refere no texto. “Em seguida” evita repetição pesada de “então”, sem perder a sequência narrativa.
