base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: pt
  text: 'Seu pai nunca o havia contrariado em nenhum momento da vida dele, dizendo: “Por que você fez isso?” Adonias também era muito bonito, e sua mãe o havia dado à luz depois de Absalão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: o havia contrariado
  rationale: O verbo pode indicar causar dor, tristeza ou desgosto. No contexto, descreve a omissão de Davi em contestar ou corrigir Adonias; “contrariado” preserva a ideia de causar-lhe desagrado sem transformar o verbo diretamente em “repreender”.
- source_word: מִיָּמָיו
  choice: em toda a sua vida
  rationale: A expressão significa literalmente “desde seus dias” e funciona aqui como um idiomatismo para nunca, em nenhum momento da vida.
- source_word: לֵאמֹר
  choice: perguntando
  rationale: Introduz as palavras de correção que o pai nunca dirigiu ao filho. Em português, “perguntando” liga naturalmente a oração à pergunta direta.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: Por que você fez isso?
  rationale: Expressa de modo natural e atual a pergunta de censura, sem perder a referência ao ato praticado.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: muito bonito
  rationale: A expressão descreve a boa aparência física de Adonias; “muito bonito” é claro, idiomático e adequado a um homem em português contemporâneo.
- source_word: וְאֹתוֹ יָלְדָה
  choice: sua mãe o havia dado à luz
  rationale: O sujeito feminino está implícito no hebraico. Explicitá-lo como “sua mãe” produz clareza natural em português sem acrescentar informação substantiva.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: depois de Absalão
  rationale: A formulação preserva a concisão e a provável referência à ordem de nascimento, sem especificar além do que o hebraico afirma.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome Adonias foi repetido na segunda frase para evitar a possível ambiguidade do pronome. A tradução mantém a tensão entre o sentido lexical de causar desgosto e a implicação contextual de falta de correção paterna.
