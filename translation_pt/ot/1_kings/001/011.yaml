  text: וַ/יֹּ֣אמֶר נָתָ֗ן אֶל בַּת שֶׁ֤בַע אֵם שְׁלֹמֹה֙ לֵ/אמֹ֔ר הֲ/ל֣וֹא שָׁמַ֔עַתְּ כִּ֥י מָלַ֖ךְ אֲדֹנִיָּ֣הוּ בֶן חַגִּ֑ית וַ/אֲדֹנֵ֥י/נוּ דָוִ֖ד לֹ֥א יָדָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: pt
  text: 'Então Natã disse a Bate-Seba, mãe de Salomão: “Você não ouviu dizer que Adonias, filho de Hagite, se tornou rei[a] e que o nosso senhor Davi não sabe disso?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “começou a reinar” ou “se fez rei”. O hebraico diz literalmente que Adonias “se tornou rei/reinou”; o contexto pode sugerir que ele se exaltou por iniciativa própria, mas a expressão deste versículo não o declara explicitamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: בַּת שֶׁבַע
  choice: Bate-Seba
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֵם שְׁלֹמֹה
  choice: mãe de Salomão
  rationale: Reproduz diretamente a relação expressa pela construção hebraica e soa natural em português.
- source_word: לֵאמֹר
  choice: não explicitado
  rationale: A fórmula hebraica de introdução da fala fica naturalmente representada pelos dois-pontos e pelas aspas.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Você não ouviu dizer
  rationale: Conserva a pergunta retórica que espera confirmação e exprime naturalmente o recebimento de uma notícia.
- source_word: מָלַךְ
  choice: se tornou rei
  rationale: Preserva o sentido eventivo de assumir ou passar a exercer a realeza sem afirmar explicitamente que Adonias se proclamou rei por iniciativa própria.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: Adonias, filho de Hagite
  rationale: Emprega as formas tradicionais dos nomes em português e traduz diretamente a filiação.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: e que o nosso senhor Davi
  rationale: “Senhor”, em minúscula, mantém o título humano e cortesão dado ao rei; a repetição de “que” esclarece em português a coordenação do conteúdo ouvido.
- source_word: לֹא יָדָע
  choice: não sabe disso
  rationale: O perfeito hebraico tem relevância presente no contexto; “disso” explicita de forma natural o objeto implícito.
theological_decisions:
- issue: Sentido de מָלַךְ na tomada de poder por Adonias
  choice: se tornou rei
  alternative: se fez rei / começou a reinar
  rationale: O contexto sugere uma tentativa autônoma de tomar o trono, mas o verbo deste versículo não declara explicitamente que Adonias se proclamou rei. A tradução mantém essa tensão, e a nota registra a alternativa contextual.
- issue: Título אֲדֹנֵינוּ aplicado a Davi
  choice: nosso senhor Davi
  alternative: nosso soberano Davi
  rationale: Trata-se de um título humano de respeito dirigido ao rei, não do nome divino nem de um título exclusivamente teológico; por isso, usa-se “senhor” com inicial minúscula.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas nominais tradicionais de boa legibilidade brasileira. A pergunta retórica e o tom cortesão foram preservados sem arcaísmos.
