  text: וַ/תָּבֹ֨א בַת שֶׁ֤בֶע אֶל הַ/מֶּ֨לֶךְ֙ הַ/חַ֔דְרָ/ה וְ/הַ/מֶּ֖לֶךְ זָקֵ֣ן מְאֹ֑ד וַֽ/אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית מְשָׁרַ֖ת אֶת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: pt
  text: Então Bate-Seba entrou no aposento onde estava o rei.[a] O rei estava muito velho, e Abisague, a sunamita, o servia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entrou no aposento do rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: entrou
  rationale: O wayyiqtol de בוא faz a narrativa avançar; “entrou” expressa naturalmente o movimento de Bate-Seba para o espaço privado do rei.
- source_word: בַת שֶׁבַע
  choice: Bate-Seba
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל הַמֶּלֶךְ הַחַדְרָה
  choice: entrou no aposento onde estava o rei
  rationale: A construção indica movimento para dentro do חֶדֶר, um quarto ou aposento interior, na direção do rei. A formulação portuguesa evita a sequência pouco natural “entrou até o rei no aposento” sem perder a relação espacial.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: O rei estava muito velho
  rationale: O waw introduz aqui informação de fundo. Uma nova oração em português transmite isso com clareza; זָקֵן מְאֹד significa diretamente “muito velho”.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: e Abisague, a sunamita
  rationale: Usa a forma portuguesa tradicional do nome e identifica a mulher como natural de Suném.
- source_word: מְשָׁרַת אֶת הַמֶּלֶךְ
  choice: o servia
  rationale: O particípio indica serviço contínuo naquele momento. “Servia” é natural, amplo e preserva o sentido sem especificar além do hebraico a natureza exata dos cuidados.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Aposento” conserva o caráter interior e privado de חֶדֶר sem soar excessivamente arcaico. A repetição final de “rei” foi evitada por meio do pronome “o”, de modo natural em português, sem alterar o referente.
