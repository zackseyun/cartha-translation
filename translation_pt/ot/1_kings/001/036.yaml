  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: pt
  text: 'Benaia, filho de Joiada, respondeu ao rei: “Amém! Assim o diga Yahweh, o Deus do rei, meu senhor.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que Yahweh, o Deus do rei, meu senhor, confirme isso”. Lit. “Assim diga Yahweh”; no contexto, a fala divina expressa a confirmação ou ratificação do desejo do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: É o uso narrativo comum de ענה para introduzir uma resposta e soa natural no diálogo da corte.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Emprega as formas portuguesas correntes dos nomes e preserva o patronímico hebraico.
- source_word: אֶת הַמֶּלֶךְ
  choice: ao rei
  rationale: O marcador de objeto direto não é traduzido lexicalmente; a regência portuguesa de “responder” pede “ao rei”.
- source_word: וַיֹּאמֶר
  choice: incorporado nos dois-pontos após “respondeu”
  rationale: A fórmula hebraica “respondeu... e disse” é redundante em português atual; os dois-pontos introduzem naturalmente a fala sem perda de conteúdo.
- source_word: אָמֵן
  choice: Amém!
  rationale: Preserva a aclamação enfática de assentimento e desejo, conhecida e transparente em português.
- source_word: כֵּן יֹאמַר
  choice: confirme isso
  rationale: Embora יֹאמַר signifique literalmente “diga”, neste contexto optativo a fala divina tem o sentido de ratificar ou ordenar o propósito expresso pelo rei; a nota conserva a formulação literal e sua ambiguidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי
  choice: o Deus de
  rationale: Representa naturalmente em português a forma construta seguida da expressão possessiva.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: do rei, meu senhor
  rationale: Preserva a deferência cortesã e evita a possível leitura inicial de “meu Senhor” como título divino.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico traz o nome próprio divino; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Força da fala atribuída a Yahweh em כֵּן יֹאמַר
  choice: confirme isso
  alternative: diga isso
  rationale: O contexto expressa o desejo de que Deus ratifique o plano do rei. Como o verbo é literalmente “dizer” e pode manter essa imagem, a alternativa é registrada em nota, sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição formular hebraica “respondeu... e disse” foi condensada de modo idiomático; a linguagem cortesã foi preservada em “o rei, meu senhor”.
