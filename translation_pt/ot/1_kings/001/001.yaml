  text: וְ/הַ/מֶּ֤לֶךְ דָּוִד֙ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יְכַסֻּ֨/הוּ֙ בַּ/בְּגָדִ֔ים וְ/לֹ֥א יִחַ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: pt
  text: O rei Davi era velho[a], avançado em dias; cobriram-no com roupas, mas ele não conseguia se aquecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “avançado em dias”, expressão que significa muito idoso ou de idade bem avançada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: O rei Davi
  rationale: Traduz diretamente o título e o nome. O וְ inicial funciona como ligação narrativa e não exige um marcador temporal explícito em português.
- source_word: זָקֵן
  choice: estava velho
  rationale: Expressa de modo direto e natural o estado de idade avançada indicado pelo hebraico.
- source_word: בָּא בַּ/יָּמִים
  choice: avançado em dias
  rationale: Preserva a forma concreta do idioma hebraico, cuja significação é esclarecida em nota.
- source_word: וַ/יְכַסֻּהוּ
  choice: cobriam-no
  rationale: O plural sem sujeito expresso é mantido de forma indeterminada; o imperfeito português comunica a ação realizada na tentativa de aquecê-lo.
- source_word: בַּ/בְּגָדִים
  choice: com roupas
  rationale: בְּגָדִים designa roupas ou vestes; 'roupas' é atual, claro e evita a interpretação mais específica 'cobertores'.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: mas ele não conseguia se aquecer
  rationale: Expressa naturalmente que o calor não lhe sobrevinha, enquanto 'mas' comunica o contraste contextual sem alterar o conteúdo principal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o hebraísmo “avançado em dias” no texto e explica-se seu sentido em nota; evita-se o arcaísmo “vestes” e a especificação não textual “cobertores”.
