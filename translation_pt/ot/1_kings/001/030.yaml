source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: pt
  text: 'Assim como jurei a você por Yahweh, o Deus de Israel: “Salomão, seu filho, reinará depois de mim e se assentará no meu trono em meu lugar”, assim farei hoje.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר ... כִּי כֵן
  choice: Assim como... assim
  rationale: Preserva a estrutura correlativa do hebraico, ligando o juramento anterior ao cumprimento imediato.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: jurei a você
  rationale: O perfeito indica um juramento já feito; o pretérito perfeito é natural e exato em português.
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: por Yahweh, o Deus de Israel
  rationale: A preposição indica aquele por quem se jurou, e o nome divino é transliterado diretamente.
- source_word: לֵאמֹר כִּי
  choice: ':'
  rationale: Os dois-pontos introduzem com naturalidade em português o conteúdo direto do juramento; a força asseverativa decorre do próprio contexto solene.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Salomão, seu filho
  rationale: A aposição marcada por vírgulas é clara e idiomática em português.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: reinará depois de mim
  rationale: Conserva tanto o sentido régio do verbo quanto a linguagem de sucessão.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: e se assentará no meu trono em meu lugar
  rationale: Traduz a expressão régia sem explicá-la em excesso; תַּחְתָּי expressa substituição ou sucessão no lugar de Davi.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente moderno e natural que mantém a urgência temporal do hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de תַּחְתָּי na sucessão real
  choice: em meu lugar
  alternative: depois de mim; em vez de mim
  rationale: A formulação mantém a ideia de substituição no trono sem sugerir indevidamente oposição entre Davi e Salomão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe correlativa próxima do hebraico. Emprega “se assentará” para o ato régio de ocupar o trono e evita arcaísmos desnecessários.
