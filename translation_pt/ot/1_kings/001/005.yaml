source:
  edition: WLC
  text: וַ/אֲדֹנִיָּ֧ה בֶן חַגִּ֛ית מִתְנַשֵּׂ֥א לֵ/אמֹ֖ר אֲנִ֣י אֶמְלֹ֑ךְ וַ/יַּ֣עַשׂ ל֗/וֹ רֶ֚כֶב וּ/פָ֣רָשִׁ֔ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: pt
  text: 'Adonias, filho de Hagite, exaltou-se[a], dizendo: “Eu reinarei”.[b] Então providenciou para si uma carruagem, cavaleiros e cinquenta homens que corriam à sua frente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se engrandeceu” ou “se promoveu”. O verbo hebraico comunica a ideia de autoexaltação.
    reason: lexical_alternative
  - marker: b
    text: Ou “Eu serei rei”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: exaltou a si mesmo
  rationale: Preserva a força reflexiva do hitpael e a nuance crítica de autopromoção, sem acrescentar uma condenação explícita que o hebraico não formula.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: 'dizendo: “Eu reinarei”'
  rationale: Mantém a forma verbal e expressa diretamente a pretensão régia de Adonias; “Eu serei rei” permanece uma alternativa legítima.
- source_word: וַיַּעַשׂ לוֹ
  choice: Então providenciou para si
  rationale: No contexto, עשה indica que Adonias fez com que os elementos de sua comitiva estivessem à sua disposição. “Providenciou” é natural em português e não define indevidamente se ele os fabricou, comprou ou convocou.
- source_word: רֶכֶב
  choice: um carro
  rationale: Conserva o singular hebraico e, no contexto da exibição régia, designa o veículo de Adonias. “Carro” é a forma bíblica tradicional e suficientemente clara no contexto.
- source_word: פָרָשִׁים
  choice: cavaleiros
  rationale: Representa naturalmente o plural referente a homens montados, sem a conotação técnico-militar mais forte de “cavalaria”.
- source_word: חֲמִשִּׁים אִישׁ
  choice: cinquenta homens
  rationale: Mantém a referência masculina explícita do hebraico e a expressão numérica direta.
- source_word: רָצִים לְפָנָיו
  choice: que corriam à sua frente
  rationale: Expressa de modo natural a função contínua dos corredores que precediam Adonias em sua comitiva.
theological_decisions:
- issue: Caracterização da pretensão de Adonias
  choice: exaltou a si mesmo
  alternative: promoveu a si mesmo; declarou-se rei
  rationale: A tradução conserva a crítica implícita na forma reflexiva sem transformar a ação em uma declaração formal de realeza nem inserir juízo moral adicional.
- issue: Forma da reivindicação régia
  choice: Eu reinarei
  alternative: Eu serei rei
  rationale: As duas formas refletem adequadamente אֶמְלֹךְ. A opção principal mantém o valor verbal de מלך, enquanto a nota preserva a alternativa idiomática.
- issue: Linguagem de gênero na comitiva
  choice: cinquenta homens
  alternative: cinquenta pessoas; cinquenta corredores
  rationale: אִישׁ é explicitamente masculino e, neste contexto, refere-se aos integrantes homens da comitiva régia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi mantida sem acrescentar um marcador temporal inexistente no hebraico. As vírgulas em torno de “filho de Hagite” tratam a expressão como identificação de Adonias.
