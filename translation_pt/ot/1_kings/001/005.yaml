  naturalness: “Exaltou a si mesmo” é compreensível, mas “exaltou-se” é mais idiomático em português moderno e conserva plenamente o valor reflexivo. “Carruagem” é mais claro para leitores contemporâneos. A pontuação da fala deve situar o ponto final antes das aspas; a âncora da nota alternativa pode seguir a frase citada.
  terminology: Adonias e Hagite são formas portuguesas estabelecidas. “Cavaleiros” e “cinquenta homens” correspondem bem a פָרָשִׁים e חֲמִשִּׁים אִישׁ. “Reinarei” mantém de modo apropriado a força verbal de אֶמְלֹךְ.
