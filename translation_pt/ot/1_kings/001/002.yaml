    issue: A construção impessoal singular “Que se procure” não preserva o plural ativo de יְבַקְשׁוּ.
    rationale: Embora o agente não seja nomeado além da forma verbal, o hebraico efetivamente usa a terceira pessoa do plural. “Que procurem” mantém a proposta volitiva e o número sem especificar indevidamente quem executará a busca.
  - severity: low
    issue: “Junto ao seu peito” enfraquece e torna menos exata a expressão בְחֵיקֶךָ.
    rationale: חֵיק designa o colo ou regaço; além disso, o sufixo é de segunda pessoa. “No teu regaço” preserva a proximidade corporal e a referência direta ao rei.
  - severity: low
    issue: A nota b oferece “ama” como alternativa para סֹכֶנֶת.
    rationale: Em português moderno, “ama” costuma ter sentidos mais delimitados do que o termo hebraico raro permite. “Atendente” e “assistente” preservam melhor a incerteza lexical.
