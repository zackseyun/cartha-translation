base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: pt
  text: 'Então seus servos lhe disseram: “Que procurem para o meu senhor, o rei, uma jovem virgem. Que ela esteja diante do rei para servi-lo[a] e seja sua cuidadora[b]; que se deite no teu regaço[c], para que o meu senhor, o rei, se aqueça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “esteja de pé diante do rei”; a expressão hebraica pode indicar estar diante de alguém para servi-lo.
    reason: lexical_alternative
  - marker: b
    text: Ou “atendente” ou “assistente”; o termo hebraico é raro e designa alguém que serve ou cuida de outra pessoa.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “no teu regaço”; ou “no teu colo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto da corte real, o termo designa servos ou auxiliares do rei; “servos” preserva a forma tradicional sem afirmar mais precisamente uma condição de escravidão.
- source_word: יְבַקְשׁוּ
  choice: Que se procure
  rationale: O imperfeito plural tem força volitiva. A construção impessoal em português transmite naturalmente a proposta sem identificar como sujeito os próprios interlocutores, algo que o hebraico não explicita.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: para o meu senhor, o rei
  rationale: Preserva a fórmula deferente da corte, com o possessivo de primeira pessoa e “o rei” em aposição.
- source_word: נַעֲרָה בְתוּלָה
  choice: uma jovem virgem
  rationale: “Jovem” representa נַעֲרָה e “virgem” representa בְתוּלָה, preservando os dois elementos de modo natural em português.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: Que ela fique a serviço do rei
  rationale: A expressão significa literalmente “ficar de pé diante do rei”, mas, em contexto cortesão, denota estar presente para servi-lo. A formulação conserva esse sentido funcional sem produzir uma imagem estática enganosa.
- source_word: סֹכֶנֶת
  choice: cuidadora
  rationale: O termo raro parece indicar uma mulher que presta assistência ou cuidados. “Cuidadora” se ajusta ao contexto imediato sem acrescentar conotação sexual.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: que se deite junto ao seu peito
  rationale: חֵיק pode indicar peito, colo ou regaço. “Junto ao seu peito” mantém a proximidade corporal destinada a aquecer o rei e soa natural no português atual.
- source_word: וְחַם
  choice: para que ... se aqueça
  rationale: A oração expressa a finalidade ou o resultado pretendido; a construção com “para que” comunica isso claramente.
