  source_fidelity: A tradução comunica corretamente a proposta dos servos, a condição de jovem virgem, o serviço prestado ao rei, o cuidado e a finalidade de aquecê-lo. Contudo, o hebraico emprega um imperfeito plural ativo em יְבַקְשׁוּ; a forma impessoal singular “Que se procure” elimina esse traço. Além disso, “junto ao seu peito” torna menos preciso o hebraico בְחֵיקֶךָ, que indica repousar no colo/regaço do interlocutor.
  naturalness: O registro é claro e apropriado. “Que procurem” é uma proposta natural em português e preserva melhor o plural. “Que ela esteja diante do rei para servi-lo” mantém a imagem e o sentido cortesão sem soar excessivamente literal. “Deite-se no teu regaço” é natural, concreto e condizente com a proximidade física explicitada pelo texto.
  terminology: “Servos”, “meu senhor, o rei”, “jovem virgem” e “cuidadora” são escolhas adequadas. A alternativa “ama” na nota para סֹכֶנֶת é indevidamente específica e pode sugerir ama de leite ou governanta; “atendente” ou “assistente” são alternativas mais seguras.
  issues:
