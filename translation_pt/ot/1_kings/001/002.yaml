  to: 'Então seus servos lhe disseram: “Que procurem para o meu senhor, o rei, uma jovem virgem. Que ela esteja diante do rei para servi-lo[a] e seja sua cuidadora[b]; que se deite no teu regaço[c], para que o meu senhor, o rei, se aqueça.”'
