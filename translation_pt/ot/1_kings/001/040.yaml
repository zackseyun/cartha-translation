base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: pt
  text: Todo o povo subiu atrás dele, e o povo tocava flautas[a] e se alegrava com grande alegria, e a terra se fendeu ao som deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pífaros”; o termo hebraico pode designar, de modo geral, instrumentos de sopro semelhantes a flautas.
    reason: lexical_alternative
  - marker: b
    text: A afirmação de que a terra se fendeu provavelmente é uma hipérbole que descreve o volume ensurdecedor da celebração.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiu
  rationale: Preserva o sentido concreto de עלה, subir, adequado ao movimento da procissão.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Tradução direta e natural do coletivo hebraico com כָל.
- source_word: אַחֲרָיו
  choice: atrás dele
  rationale: Expressa de modo claro que o povo seguia Salomão em procissão.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: tocando flautas
  rationale: Verte naturalmente a ação de tocar חלילים, instrumentos de sopro semelhantes a flautas ou pífaros.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: alegrando-se com grande alegria
  rationale: Mantém a construção cognata e sua ênfase, sem reduzir a intensidade do hebraico.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: a terra se fendia
  rationale: Conserva a imagem vívida de בקע, fender-se ou partir-se; o aspecto narrativo em português permite representar o estrondo contínuo da celebração.
- source_word: בְּקוֹלָם
  choice: com o som deles
  rationale: Som abrange tanto a música dos instrumentos quanto o ruído ou as vozes da multidão, sem estreitar קוֹל a um único elemento.
