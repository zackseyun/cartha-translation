  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: pt
  text: Agora, venha[a], por favor, deixe-me aconselhá-la[b] e salve a sua vida[c] e a vida de seu filho Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “vá”; aqui a expressão funciona idiomaticamente como uma convocação urgente em discurso direto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “eu lhe darei um conselho”, uma construção com palavras da mesma raiz que significa “dar um conselho” ou “aconselhar”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “salve a sua נֶפֶשׁ”; neste contexto, נֶפֶשׁ significa “vida”, não “alma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz uma transição urgente no discurso; a conjunção funciona como ligação discursiva e não precisa ser expressa separadamente em português.
- source_word: לְכִי
  choice: venha
  rationale: Embora o verbo signifique literalmente “ir/andar”, aqui funciona idiomaticamente como convocação urgente dirigida à interlocutora; “venha” é natural em português.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: por favor, deixe-me aconselhá-la
  rationale: Expressa a partícula de súplica נָא e traduz de modo natural a construção cognata hebraica, literalmente “aconselhar conselho”.
- source_word: וּמַלְּטִי
  choice: e salve
  rationale: O imperativo feminino conclama Bate-Seba a agir para preservar a vida diante da ameaça política; “salve” comunica com clareza essa força.
- source_word: נַפְשֵׁךְ
  choice: a sua vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida da pessoa, não uma alma imaterial.
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: e a vida de seu filho Salomão
  rationale: Preserva o paralelismo com “a sua vida” e mantém Salomão explicitamente nomeado.
