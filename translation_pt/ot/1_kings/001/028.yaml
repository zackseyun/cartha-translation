base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: pt
  text: 'Então o rei Davi respondeu e disse[a]: “Chamem Bate-Seba à minha presença.” Ela veio à presença do rei e pôs-se diante do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico frequentemente usa «respondeu» como fórmula narrativa para introduzir uma fala, mesmo sem uma pergunta expressa imediatamente antes.
    reason: translator_note
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Preserva a fórmula narrativa hebraica de introdução da fala; em português, o verbo também pode ocorrer sem uma pergunta expressa imediatamente antes.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Forma natural em português para o título seguido do nome próprio.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Tradução direta do verbo comum de fala אמר, preservando a fórmula dupla do hebraico.
- source_word: קִרְאוּ לִי לְבַת שָׁבַע
  choice: Chamem Bate-Seba para vir até mim
  rationale: Expressa com naturalidade a ordem de convocar Bate-Seba à presença do rei, sem elevar desnecessariamente o registro.
- source_word: לְבַת שָׁבַע
  choice: Bate-Seba
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: Ela veio à presença do rei
  rationale: Comunica o sentido de entrar ou comparecer perante o rei em linguagem portuguesa clara.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: ficou em pé diante dele
  rationale: Traduz עמד como postura física e preserva a segunda referência à presença real sem uma repetição pesada em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A coordenação “respondeu e disse” mantém a forma enfática da narrativa hebraica; a variação entre “à presença do rei” e “diante dele” evita rigidez sem perder o cenário formal da corte.
