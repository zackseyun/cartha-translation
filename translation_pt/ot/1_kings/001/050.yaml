  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: pt
  text: Adonias teve medo por causa de Salomão[a]. Então se levantou, foi e agarrou as pontas do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Agarrar as pontas do altar era um gesto de quem buscava proteção ou misericórdia no santuário.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי שְׁלֹמֹה
  choice: ficou com medo por causa de Salomão
  rationale: Expressa em português natural o estado de medo e conserva o valor causal da construção com מִפְּנֵי, sem reduzi-la a uma indicação espacial.
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Equivalente corrente do verbo narrativo, mantendo a sequência das ações.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Tradução direta e idiomática do verbo de movimento.
- source_word: וַיַּחֲזֵק
  choice: agarrou
  rationale: Comunica que Adonias se apoderou firmemente das pontas do altar, sem acrescentar ao texto a interpretação de que buscava refúgio.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: as pontas do altar
  rationale: Em português atual, “pontas” descreve com clareza as projeções nos cantos do altar; a nota esclarece o significado cultural do gesto.
- source_word: וַאֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
theological_decisions:
- issue: Gesto cultual junto ao altar
  choice: Manter no texto principal a ação física de agarrar as pontas do altar.
  alternative: Parafrasear como “refugiou-se junto ao altar” ou “foi ao altar pedir misericórdia”.
  rationale: O hebraico relata diretamente o gesto, mas não explicita nesta frase seu estatuto legal ou sua intenção. A interpretação cultural cabe na nota, preservando a distinção entre texto e explicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases torna natural a sucessão narrativa sem eliminar nenhuma relação do hebraico.
