  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֔ה אִ֚ם יִהְיֶ֣ה לְ/בֶן חַ֔יִל לֹֽא יִפֹּ֥ל מִ/שַּׂעֲרָת֖/וֹ אָ֑רְצָ/ה וְ/אִם רָעָ֥ה תִמָּצֵא ב֖/וֹ וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: pt
  text: 'E Salomão disse: “Se ele se mostrar um homem digno[a], nem um só fio de cabelo dele cairá por terra[b]; mas, se nele for encontrada maldade, ele morrerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filho de valor/força”. A expressão hebraica pode designar um homem digno, capaz ou valente, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “nem um só fio de cabelo dele cairá por terra” significa que ele não sofrerá dano algum.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: um homem digno
  rationale: A expressão significa literalmente “filho de valor/força”, mas aqui descreve caráter e conduta confiáveis, não necessariamente valentia militar. “Homem digno” comunica o sentido moral em português natural.
- source_word: יִהְיֶה
  choice: se mostrar
  rationale: Embora o verbo possa ser traduzido formalmente por “for” ou “vier a ser”, a condição diz respeito ao caráter que Adonias demonstrará dali em diante. “Se mostrar” expressa essa força contextual sem eliminar a condição.
- source_word: מִשַּׂעֲרָתוֹ
  choice: nem um só fio de cabelo dele
  rationale: O hebraico usa “seu cabelo” em sentido coletivo. A formulação portuguesa preserva a imagem idiomática e enfatiza que ele não sofrerá dano algum.
- source_word: לֹא יִפֹּל ... אָרְצָה
  choice: cairá por terra
  rationale: “Por terra” é uma expressão portuguesa natural e mantém de perto a imagem hebraica de cair em direção ao chão.
- source_word: רָעָה
  choice: maldade
  rationale: Neste contexto judicial, o substantivo aponta para mal moral ou conduta culpável. “Maldade” preserva essa amplitude sem especificar uma infração concreta.
- source_word: תִמָּצֵא בוֹ
  choice: nele for encontrada
  rationale: A construção passiva apresenta a maldade como algo descoberto nele ou pertencente à sua conduta. A ordem escolhida é natural em português e conserva a formulação hebraica.
- source_word: וָמֵת
  choice: ele morrerá
  rationale: A oração declara solenemente a consequência caso se descubra maldade nele. O futuro mantém a força judicial sem definir além do texto se se trata de previsão ou sentença.
