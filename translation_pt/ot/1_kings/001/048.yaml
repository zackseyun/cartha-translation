source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: pt
  text: 'O rei disse ainda: “Bendito seja Yahweh, o Deus de Israel, que hoje deu alguém para sentar-se no meu trono, e meus olhos veem isso[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que hoje deu alguém sentado no meu trono, e meus olhos estão vendo”. O hebraico não explicita o objeto de “veem”; “isso” foi acrescentado no texto por clareza.'
    reason: Preserva a ambiguidade do particípio יֹשֵׁב e informa que o objeto de רֹאוֹת está implícito.
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: O rei disse ainda
  rationale: “Ainda” preserva a força aditiva de וְגַם, enquanto os dois-pontos e a citação tornam natural em português a função de כָּכָה, que introduz as palavras seguintes.
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Fórmula doxológica corrente e digna em português, adequada ao predicado nominal hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz de modo claro e convencional a construção hebraica.
- source_word: אֲשֶׁר נָתַן הַיּוֹם
  choice: que hoje deu
  rationale: Mantém o verbo comum נתן e a ênfase temporal de הַיּוֹם sem acrescentar explicitamente a ideia de nomeação.
- source_word: יֹשֵׁב עַל כִּסְאִי
  choice: alguém para se assentar no meu trono
  rationale: Expressa de maneira natural o particípio substantivado e, no contexto, o resultado da dádiva divina, sem inserir o nome de Salomão.
- source_word: וְעֵינַי רֹאוֹת
  choice: e meus olhos veem isso
  rationale: Conserva a coordenação simples e a imagem concreta dos olhos de Davi; “isso” explicita em português o objeto deixado implícito no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Sentido de יֹשֵׁב após נָתַן
  choice: alguém para se assentar
  alternative: alguém sentado; alguém que está sentado
  rationale: A formulação principal comunica naturalmente a concessão de um sucessor ao trono, mas a nota conserva a possibilidade de entender o particípio como estado presente.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A abertura foi levemente reorganizada para evitar o pouco idiomático “também disse assim”, sem perder sua função aditiva e introdutória.
