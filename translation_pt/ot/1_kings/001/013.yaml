  naturalness: O registro é claro e apropriado. “Vá e entre na presença do rei Davi” é natural em português moderno e conserva melhor a sequência verbal hebraica. “Meu senhor, o rei” reproduz de modo mais próximo a forma de tratamento sem perder a dignidade cortesã.
  terminology: “Serva” é uma boa tradução deferente de אֲמָתְךָ e preserva o gênero feminino. A nota, porém, não deve definir o termo como “escrava”, pois isso é mais restritivo do que o necessário; “serva”/“criada” conserva melhor sua amplitude contextual.
