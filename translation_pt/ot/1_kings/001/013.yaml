  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: pt
  text: 'Vá e entre na presença do rei Davi e diga-lhe: “Meu senhor, o rei, não foi o senhor que jurou à sua serva[a], dizendo: ‘Salomão, seu filho, reinará depois de mim e se assentará no meu trono’? Então, por que Adonias se tornou rei?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à tua criada”. O termo hebraico é feminino e aqui é a maneira respeitosa como Bate-Seba se refere a si mesma diante do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: Vá até
  rationale: Os dois imperativos femininos singulares têm o sentido conjunto de ir e entrar à presença do rei; em português natural, “Vá até” comunica a instrução sem reproduzir uma redundância pouco idiomática.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: Mantém o título e o nome em ordem natural no português.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: e diga-lhe
  rationale: Expressa naturalmente a continuação imperativa do hebraico.
- source_word: הֲלֹא
  choice: não foi o senhor que
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa e se refere ao juramento passado.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Ó rei, meu senhor
  rationale: Preserva a forma respeitosa de tratamento da corte e deixa claro que “senhor” é um título humano.
- source_word: נִשְׁבַּעְתָּ
  choice: jurou
  rationale: Conserva o sentido específico de prestar juramento, e não apenas fazer uma promessa.
- source_word: לַאֲמָתְךָ
  choice: à sua serva
  rationale: O substantivo hebraico é explicitamente feminino e constitui a autodesignação deferente de Bate-Seba diante do rei.
- source_word: לֵאמֹר כִּי
  choice: '[introdução direta da citação]'
  rationale: O infinitivo “dizendo” introduz o conteúdo do juramento, enquanto כִּי aqui pode funcionar como marcador da citação; a pontuação portuguesa transmite isso sem acrescentar uma ênfase como “certamente”.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Salomão, seu filho
  rationale: Segue de perto a ordem hebraica e permanece natural em português.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: reinará depois de mim
  rationale: Preserva tanto o exercício da realeza quanto a ideia de sucessão.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: e se assentará no meu trono
  rationale: Mantém a linguagem concreta de entronização do hebraico.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: Então, por que Adonias se tornou rei?
  rationale: “Então” explicita a relação lógica da pergunta com o juramento anterior; o perfeito de מלך descreve Adonias como tendo assumido ou passado a exercer a realeza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento respeitoso coerente com uma audiência real. A tradução evita acrescentar “certamente”, não exigido por כִּי neste contexto, e preserva o gênero feminino da autodesignação de Bate-Seba.
