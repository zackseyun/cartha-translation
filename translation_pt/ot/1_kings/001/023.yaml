base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: pt
  text: 'Então anunciaram ao rei, dizendo: “O profeta Natã está aqui.” Ele veio à presença do rei e se curvou diante dele, com o rosto em terra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: está aqui
  rationale: No contexto, a partícula chama a atenção para a chegada ou presença de Natã; em português corrente, “está aqui” comunica isso naturalmente.
- source_word: וַיִּשְׁתַּחוּ
  choice: se curvou
  rationale: Expressa o gesto de reverência diante do rei sem recorrer ao menos corrente “prostrou-se”; a frase seguinte preserva a intensidade física do gesto.
- source_word: עַל־אַפָּיו אָרְצָה
  choice: com o rosto em terra
  rationale: Reproduz de modo claro e idiomático a postura descrita literalmente no hebraico.
