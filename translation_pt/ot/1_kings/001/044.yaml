base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: pt
  text: O rei enviou com ele o sacerdote Zadoque, o profeta Natã, Benaia, filho de Joiada, e os queretitas e peletitas; e eles o fizeram montar na mula do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico está no feminino e designa especificamente uma mula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: O rei enviou com ele
  rationale: Mantém a ordem narrativa e a ideia de acompanhamento expressa por אִתּוֹ, sem substituir o título explícito “o rei” pelo nome de Davi.
- source_word: צָדוֹק הַכֹּהֵן
  choice: o sacerdote Zadoque
  rationale: A ordem com o título antes do nome é mais natural em português e preserva a relação apositiva do hebraico.
- source_word: נָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Traduz o título e emprega a forma portuguesa corrente do nome.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Reproduz com clareza o patronímico hebraico em português moderno.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: os queretitas e peletitas
  rationale: Mantém as designações tradicionais desses grupos sem impor uma identificação interpretativa como guarda real ou mercenários.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: eles o fizeram montar
  rationale: Preserva o valor causativo do hifil de רכב e identifica naturalmente como sujeito os acompanhantes anteriormente enumerados.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: na mula do rei
  rationale: פִּרְדָּה designa uma mula, especificamente em forma feminina; “mula” é a correspondência direta e idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais correntes no uso bíblico lusófono. A coordenação e o ponto e vírgula conservam o fluxo da narrativa hebraica sem tornar a frase artificial.
