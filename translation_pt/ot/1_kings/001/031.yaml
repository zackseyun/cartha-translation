base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: pt
  text: 'Então Bate-Seba inclinou-se com o rosto em terra e prostrou-se diante do rei. E disse: “Viva para sempre o meu senhor, o rei Davi!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais próxima da estrutura hebraica: “Que o meu senhor, o rei Davi, viva para sempre!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: inclinou-se
  rationale: קָדַד descreve o ato de curvar-se profundamente; “inclinou-se” é natural em português e evita especificar que ela se ajoelhou.
- source_word: אַפַּיִם אֶרֶץ
  choice: com o rosto em terra
  rationale: A expressão hebraica combina “rosto/nariz” e “terra” para indicar profunda reverência; a formulação preserva a imagem de modo claro e digno.
- source_word: וַתִּשְׁתַּחוּ
  choice: prostrou-se
  rationale: O verbo שׁחה indica prostração ou reverência profunda; “prostrou-se” distingue este gesto do verbo anterior e conserva sua intensidade.
- source_word: לַמֶּלֶךְ
  choice: diante do rei
  rationale: Embora a preposição seja literalmente “ao rei”, em português o gesto de reverência é naturalmente feito “diante do rei”.
- source_word: יְחִי
  choice: Viva
  rationale: O jussivo expressa um desejo ou aclamação; “Viva” reproduz de forma idiomática e direta a fórmula régia.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: No contexto da corte, אֲדֹנִי é uma forma respeitosa de tratamento; “meu senhor” mantém esse valor sem introduzir conotação divina.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: o rei Davi
  rationale: A construção conserva o artigo presente no hebraico e soa natural no português moderno.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: עוֹלָם exprime aqui a duração ilimitada desejada numa aclamação régia; “para sempre” é a equivalência portuguesa corrente.
theological_decisions: []
