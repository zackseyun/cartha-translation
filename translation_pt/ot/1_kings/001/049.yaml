  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: pt
  text: Então todos os convidados de Adonias tremeram, levantaram-se e cada um seguiu o seu caminho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “um homem para o seu caminho”, expressão que indica que eles se dispersaram, cada um por si.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: tremeram
  rationale: O verbo חרד expressa tremor causado por medo ou alarme. “Tremeram” preserva tanto a reação física quanto a emocional, sem explicitar além do hebraico.
- source_word: וַיָּקֻמוּ
  choice: levantaram-se
  rationale: קום significa levantar-se ou pôr-se de pé. “Levantaram-se” é natural na sequência narrativa e comunica a reação imediata dos convidados.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: todos os convidados de Adonias
  rationale: O particípio passivo הַקְּרֻאִים designa “os convidados”. No contexto do banquete, a construção com לַאֲדֹנִיָּהוּ é expressa naturalmente em português por “de Adonias”.
- source_word: וַיֵּלְכוּ
  choice: seguiu
  rationale: הלך é o verbo comum para ir. Com a expressão distributiva seguinte, o singular “seguiu” concorda naturalmente com “cada um” e transmite a partida dos convidados.
- source_word: אִישׁ לְדַרְכּוֹ
  choice: cada um seguiu o seu caminho
  rationale: A construção distributiva significa literalmente “um homem para o seu caminho”. A formulação escolhida conserva a ideia de que os convidados se dispersaram individualmente e soa natural em português.
