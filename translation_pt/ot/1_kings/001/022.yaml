base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: pt
  text: E eis que[a], enquanto ela ainda falava com o rei, o profeta Natã chegou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E vejam». A expressão hebraica chama a atenção para um novo e repentino desenvolvimento na cena.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: A expressão introduz e destaca um novo acontecimento na cena. “E eis que” preserva essa função de chamar a atenção e o tom digno da narrativa, embora seja uma construção marcada no português atual.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: enquanto ela ainda falava
  rationale: O advérbio com sufixo feminino e o particípio indicam uma ação em andamento; a formulação explicita naturalmente que a chegada ocorreu durante a fala dela.
- source_word: עִם הַמֶּלֶךְ
  choice: com o rei
  rationale: Traduz diretamente a preposição עִם e conserva a ideia de interação pessoal com o rei.
- source_word: וְנָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: A ordem portuguesa mais natural coloca o título antes do nome, sem alterar a identificação de Natã como profeta.
- source_word: בָּא
  choice: chegou
  rationale: O verbo expressa a vinda ou chegada de Natã. “Chegou” evita acrescentar explicitamente a ideia espacial de entrar em um recinto, que o verbo isolado não exige.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “E eis que” mantém deliberadamente uma marca narrativa bíblica para refletir a força discursiva do hebraico; a nota oferece uma alternativa mais corrente.
