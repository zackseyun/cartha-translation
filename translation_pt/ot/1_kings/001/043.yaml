  yaml_path: translation/ot/1_kings/001/043.yaml
  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: pt
  text: 'Jônatas respondeu a Adonias: “Pelo contrário, nosso senhor, o rei Davi, fez Salomão rei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: respondeu
  rationale: A combinação hebraica literalmente diz “respondeu e disse”, fórmula narrativa que em português atual é expressa de modo natural e completo por “respondeu”.
- source_word: לַאֲדֹנִיָּהוּ
  choice: a Adonias
  rationale: O prefixo ל é representado pela preposição “a”, e o nome pessoal recebe sua forma portuguesa tradicional.
- source_word: אֲבָל
  choice: Pelo contrário
  rationale: Neste contexto, a conjunção não apenas contrasta, mas corrige a expectativa de Adonias; “Pelo contrário” comunica claramente essa força adversativa.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: nosso senhor, o rei Davi
  rationale: Preserva o substantivo reverencial “nosso senhor” e a aposição definida “o rei Davi”, com ordem e pontuação naturais em português.
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: fez Salomão rei
  rationale: O hifil de מלך indica causar que alguém seja rei ou estabelecê-lo como rei. A formulação evita especificar indevidamente apenas unção ou proclamação.
