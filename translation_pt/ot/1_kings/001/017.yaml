base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: pt
  text: 'Ela lhe disse: “Meu senhor, tu juraste à tua serva pelo SENHOR, teu Deus: ‘Certamente Salomão, teu filho, reinará depois de mim e se assentará no meu trono.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Meu senhor
  rationale: Forma respeitosa e natural de tratamento, preservando a relação de submissão indicada pelo hebraico.
- source_word: בַּיהוָה
  choice: pelo SENHOR
  rationale: A preposição introduz aquele por quem o juramento foi feito; SENHOR representa convencionalmente o nome divino יהוה.
- source_word: לַאֲמָתֶךָ
  choice: à tua serva
  rationale: Traduz a autodesignação feminina humilde de Bate-Seba sem recorrer ao menos natural 'escrava' neste contexto cortesão.
- source_word: כִּי
  choice: Certamente
  rationale: No conteúdo do juramento, a partícula pode ter força asseverativa; 'certamente' preserva essa ênfase.
- source_word: יִמְלֹךְ אַחֲרָי
  choice: reinará depois de mim
  rationale: Mantém diretamente a sucessão temporal e régia expressa no hebraico.
- source_word: יֵשֵׁב עַל־כִּסְאִי
  choice: se assentará no meu trono
  rationale: Conserva a imagem concreta de ocupar o trono, em linguagem digna e corrente.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida e a camada inglesa auditada, sem introduzir uma vocalização discutida no texto principal.
- issue: Força de כִּי na fórmula citada do juramento
  choice: Certamente
  alternative: omitir uma palavra asseverativa
  rationale: A partícula admite valor enfático neste contexto; a tradução explicita essa força sem alterar a substância da promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento em segunda pessoa singular coerente dentro da fala. A ordem foi levemente ajustada para fluidez, preservando o conteúdo e a ênfase do hebraico.
