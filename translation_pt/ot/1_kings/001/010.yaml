    text: 'Ou: “não chamou o profeta Natã, Benaia, os guerreiros valentes nem seu irmão Salomão”. O verbo hebraico significa literalmente “chamar”; aqui, tem o sentido de convidar ou convocar para a festa de Adonias.'
