lexical_decisions:
- source_word: וְאֶת
  choice: Mas
  rationale: A conjunção dá continuidade à narrativa, mas o contraste com os convidados do versículo anterior justifica o valor adversativo natural em português; a partícula de objeto direto não é traduzida.
- source_word: נָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Traduz o título נָבִיא de modo direto e emprega a ordem idiomática mais natural em português.
- source_word: וּבְנָיָהוּ
  choice: Benaia
  rationale: O nome próprio segue a forma portuguesa tradicional; a conjunção prefixada é incorporada à enumeração.
- source_word: הַגִּבּוֹרִים
  choice: os guerreiros valentes
  rationale: No contexto régio e militar, גִּבּוֹרִים designa homens de reconhecido valor bélico; a expressão é clara e evita que 'poderosos' soe apenas social ou político.
- source_word: שְׁלֹמֹה אָחִיו
  choice: seu irmão Salomão
  rationale: A ordem portuguesa é natural, e o possessivo remete contextualmente a Adonias.
- source_word: לֹא קָרָא
  choice: não convidou
  rationale: Embora קרא signifique literalmente 'chamar', no contexto da festa dos versículos 9–10 expressa o ato de convidar.
