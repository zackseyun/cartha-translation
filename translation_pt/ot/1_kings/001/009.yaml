revisions:
- from: Adonias sacrificou ovelhas, bois e animais cevados junto à pedra de Zoelete[a], que fica perto de En-Rogel, e convidou todos os seus irmãos, os filhos do rei, e todos os homens de Judá, servos do rei.[b][c]
  to: Adonias sacrificou ovelhas, gado e animais cevados junto à pedra de Zoelete[a], que fica perto de En-Rogel, e convidou[b] todos os seus irmãos, os filhos do rei, e todos os homens de Judá, servos do rei.[c]
  rationale: A revisão substitui “bois” por “gado” para refletir o sentido coletivo de בָּקָר sem especificar sexo ou função dos animais. Também posiciona as notas imediatamente após as expressões a que dizem respeito. Não altera a ambiguidade de “servos do rei” nem a construção apositiva do hebraico.
