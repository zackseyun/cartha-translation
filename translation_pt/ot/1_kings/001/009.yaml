source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: pt
  text: Adonias sacrificou ovelhas, gado e animais cevados junto à pedra de Zoelete[a], que fica perto de En-Rogel, e convidou[b] todos os seus irmãos, os filhos do rei, e todos os homens de Judá, servos do rei.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zoelete é um nome de lugar; seu significado exato é incerto.
    reason: cultural_note
  - marker: b
    text: Ou “chamou” ou “convocou”, em vez de “convidou”.
    reason: lexical_alternative
  - marker: c
    text: “Servos do rei” pode referir-se a auxiliares da corte ou a oficiais régios.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrificou
  rationale: O verbo זבח indica aqui abate sacrificial ligado a um banquete, preservando a dimensão ritual e política da ação.
- source_word: צֹאן
  choice: ovelhas
  rationale: Embora o termo possa abranger pequenos animais de rebanho, especialmente ovelhas e cabras, “ovelhas” é uma representação natural neste catálogo sacrificial.
- source_word: וּבָקָר
  choice: bois
  rationale: O coletivo hebraico designa gado bovino; “bois” é corrente e adequado ao contexto sacrificial.
- source_word: וּמְרִיא
  choice: animais cevados
  rationale: O substantivo denota animais engordados para consumo especial, sem restringi-los especificamente a bezerros.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: junto à pedra de Zoelete
  rationale: A preposição tem sentido locativo neste contexto; o nome incerto é transliterado, não traduzido.
- source_word: עֵין רֹגֵל
  choice: En-Rogel
  rationale: Trata-se de um topônimo conhecido, por isso é preservado em transliteração.
- source_word: וַיִּקְרָא
  choice: convidou
  rationale: No contexto de um banquete sacrificial, o verbo expressa chamar pessoas para participar, naturalmente vertido por “convidou”.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: todos os seus irmãos, os filhos do rei
  rationale: Mantém a aposição hebraica, que identifica os irmãos como filhos do rei.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: os homens de Judá
  rationale: Reproduz o substantivo masculino do hebraico sem ampliá-lo silenciosamente para “povo”.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: servos do rei
  rationale: É a tradução direta; no ambiente da corte, pode abranger auxiliares ou oficiais régios.
theological_decisions:
- issue: Linguagem de gênero em אַנְשֵׁי יְהוּדָה
  choice: os homens de Judá
  alternative: o povo de Judá
  rationale: O hebraico diz literalmente “homens de Judá”. A tradução conserva essa especificidade, embora a expressão possa ter referência social mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Os topônimos seguem formas portuguesas usuais; a sintaxe conserva a aposição e a possível ambiguidade funcional de “servos do rei”.
