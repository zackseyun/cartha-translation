source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: pt
  text: 'Também vieram os servos do rei para abençoar nosso senhor, o rei Davi, dizendo: “Que o seu Deus torne o nome de Salomão melhor do que o seu nome[b] e faça o trono dele maior do que o seu trono.” Então o rei curvou-se[a] sobre a cama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rei adorou sobre a cama”. O verbo hebraico pode significar tanto “curvar-se” quanto “adorar”, conforme o contexto.'
    reason: alternative_reading
  - marker: b
    text: Aqui, “nome” tem o sentido de reputação ou renome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Preserva a força aditiva que liga este relato ao anterior, com formulação natural em português.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: os servos do rei
  rationale: No contexto da corte, pode designar servidores ou oficiais reais; “servos” mantém a amplitude do termo hebraico.
- source_word: לְבָרֵךְ
  choice: para abençoar
  rationale: Mantém o sentido de uma bênção formal pronunciada diante de Davi, sem reduzi-la a mera felicitação.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: nosso senhor, o rei Davi
  rationale: Reproduz o tratamento honorífico da corte em português claro e digno.
- source_word: יֵיטֵב ... אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: torne o nome de Salomão melhor do que o seu nome
  rationale: Conserva a imagem hebraica do “nome” e a comparação associada ao verbo causativo, deixando a nota esclarecer que “nome” envolve reputação e renome.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: e faça o trono dele maior do que o seu trono
  rationale: Preserva a imagem dinástica e política do trono e a força comparativa do hebraico.
- source_word: וַיִּשְׁתַּחוּ
  choice: se inclinou
  rationale: Expressa o gesto de reverência sem decidir se o verbo indica explicitamente adoração, possibilidade mantida em nota.
- source_word: עַל הַמִּשְׁכָּב
  choice: na cama
  rationale: É uma forma natural em português de indicar que Davi realizou o gesto enquanto estava sobre o leito.
theological_decisions:
- issue: Se וַיִּשְׁתַּחוּ deve ser traduzido como adoração explícita ou como gesto de inclinação reverente
  choice: o rei se inclinou
  alternative: o rei adorou
  rationale: O verbo hebraico pode indicar tanto inclinar-se/prostrar-se quanto adorar. Como o objeto do gesto não é declarado nesta oração, a tradução conserva a ação física e mantém a possível dimensão de adoração em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo para o público brasileiro. Mantêm-se as imagens hebraicas de “nome” e “trono”, e a ambiguidade do gesto final é preservada por meio de nota.
