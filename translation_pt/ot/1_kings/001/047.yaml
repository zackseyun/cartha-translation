review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a bênção comparativa sobre o nome e o trono de Salomão e preserva, com nota, a ambiguidade de וַיִּשְׁתַּחוּ. Contudo, «na cama» é menos preciso para עַל־הַמִּשְׁכָּב, que descreve o gesto realizado sobre o leito; «sobre a cama» conserva melhor a imagem.
