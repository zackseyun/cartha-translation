  to: 'Também vieram os servos do rei para abençoar nosso senhor, o rei Davi, dizendo: “Que o seu Deus torne o nome de Salomão melhor do que o seu nome[b] e faça o trono dele maior do que o seu trono.” Então o rei curvou-se[a] sobre a cama.'
  rationale: 'A revisão limita-se ao sintagma final: «curvou-se sobre a cama» representa com maior precisão o gesto reverencial e a preposição do hebraico, sem decidir se o gesto é adoração. A nota alternativa foi ajustada de modo correspondente e sua âncora foi posicionada junto ao verbo ambíguo.'
