  naturalness: O registro é em geral claro e apropriado. “Ponham Salomão, meu filho, sobre a mula” é uma formulação portuguesa mais natural e precisa para a ação solicitada. “Façam-no descer até Giom” também é mais fluente do que “levem-no para baixo, até Giom”.
  terminology: “Servos”, “senhor de vocês”, “mula”, “Salomão” e “Giom” são escolhas adequadas ao contexto cortesão e à variante-alvo. A expressão “que me pertence” preserva de modo claro a oração relativa de posse e sua ênfase na autorização real.
