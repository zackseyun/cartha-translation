  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: pt
  text: 'Então o rei lhes disse: “Levem com vocês os servos do senhor de vocês, ponham Salomão, meu filho, sobre a mula que me pertence[a] e façam-no descer até Giom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façam Salomão, meu filho, montar na mula que me pertence”. O verbo hebraico está na forma causativa: os auxiliares devem providenciar que Salomão monte no animal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: No contexto da corte, designa os servidores ou oficiais do rei; “escravos” especificaria uma condição jurídica que o versículo não destaca.
- source_word: אֲדֹנֵיכֶם
  choice: senhor de vocês
  rationale: Preserva a referência formal do rei a si mesmo na terceira pessoa e mantém o registro de corte sem soar arcaico.
- source_word: וְהִרְכַּבְתֶּם
  choice: façam ... montar
  rationale: 'Expressa naturalmente o valor causativo da forma hifil: os destinatários devem providenciar que Salomão monte no animal.'
- source_word: הַפִּרְדָּה
  choice: a mula
  rationale: O substantivo designa uma mula; o sexo do animal não tem relevância contextual além da forma lexical feminina.
- source_word: אֲשֶׁר לִי
  choice: que me pertence
  rationale: Mantém a estrutura relativa e realça que a mula pertence especificamente ao rei, sinal de autorização régia.
- source_word: וְהוֹרַדְתֶּם
  choice: levem-no para baixo
  rationale: Preserva o sentido causativo e a noção topográfica de descida em direção a Giom.
- source_word: גִּחוֹן
  choice: Giom
  rationale: Transliteração portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: בְנִי
  choice: meu filho
  rationale: Conserva o possessivo explícito e a relação filial relevante no contexto da sucessão.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei lhes disse
  rationale: “Então” comunica com naturalidade o avanço da narrativa marcado pelo waw consecutivo.
