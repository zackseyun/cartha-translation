  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação “senhor de vocês” conserva o tratamento régio na terceira pessoa; “que me pertence” mantém a ênfase da oração relativa hebraica sobre a posse real.
