  text: וַ/יִּמְשְׁח֣וּ אֹת֡/וֹ צָד֣וֹק הַ/כֹּהֵ֣ן וְ/נָתָן֩ הַ/נָּבִ֨יא לְ/מֶ֜לֶךְ בְּ/גִח֗וֹן וַ/יַּעֲל֤וּ מִ/שָּׁם֙ שְׂמֵחִ֔ים וַ/תֵּהֹ֖ם הַ/קִּרְיָ֑ה ה֥וּא הַ/קּ֖וֹל אֲשֶׁ֥ר שְׁמַעְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: pt
  text: O sacerdote Zadoque e o profeta Natã o ungiram rei em Giom. Depois, subiram de lá com alegria, e a cidade ficou em alvoroço.[a] Esse é o som que vocês ouviram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cidade ressoou” ou “a cidade se agitou”; o verbo hebraico indica uma comoção ruidosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: o ungiram
  rationale: Em contexto régio, משׁח designa a unção para o exercício do cargo. O pretérito perfeito é natural no relato explicativo em português.
- source_word: צָדוֹק הַכֹּהֵן
  choice: o sacerdote Zadoque
  rationale: Emprega a forma portuguesa tradicional do nome e a ordem mais natural em português para título seguido de nome.
- source_word: נָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Emprega a forma portuguesa tradicional do nome e traduz נָבִיא pelo termo comum e direto “profeta”.
- source_word: לְמֶלֶךְ
  choice: rei
  rationale: Indica o cargo para o qual ele foi ungido; “ungiram rei” é uma construção portuguesa compacta e idiomática.
- source_word: בְּגִחוֹן
  choice: em Giom
  rationale: Translitera o topônimo segundo uso português corrente; “em” expressa naturalmente o local da unção.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: subiram de lá
  rationale: Preserva o sentido espacial de עלה, provavelmente em direção à parte mais elevada da cidade, sem acrescentar um destino ausente do hebraico.
- source_word: שְׂמֵחִים
  choice: com alegria
  rationale: Expressa de modo natural o estado ou a maneira alegre do grupo durante a subida.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: a cidade ficou em alvoroço
  rationale: O verbo הום comunica agitação ruidosa; “ficou em alvoroço” preserva tanto a comoção quanto sua dimensão sonora.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: Esse é o som que vocês ouviram
  rationale: הוּא tem força demonstrativa no contexto, e קוֹל é mantido pelo termo amplo “som”. “Vocês” oferece legibilidade brasileira sem perder compreensão internacional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução mantém a sequência narrativa do hebraico, mas divide o período para evitar uma cadeia excessiva de orações coordenadas. O marcador [a] foi colocado imediatamente após a expressão explicada.
