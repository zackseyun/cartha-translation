id: 1KI.1.20
reference: 1 Kings 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: pt
  text: Quanto a ti, meu senhor, o rei, os olhos de todo o Israel estão voltados para ti,[a] para que lhes digas quem se sentará no trono do meu senhor, o rei, depois dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “os olhos de todo o Israel estão sobre ti”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, depois do rei Davi.
    reason: referent_clarification
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a ti
  rationale: A construção destaca o rei como aquele de quem se espera a decisão. “Quanto a ti” preserva essa ênfase sem exigir uma ligação rígida com o versículo anterior.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Mantém tanto a deferência de אֲדֹנִי quanto o título real, em linguagem apropriada ao contexto de corte.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: os olhos de todo o Israel estão voltados para ti
  rationale: Conserva a imagem hebraica dos olhos dirigidos ao rei e comunica naturalmente atenção e expectativa.
- source_word: לְהַגִּיד לָהֶם
  choice: para que lhes digas
  rationale: O infinitivo Hifil de נגד expressa tornar algo conhecido ou anunciá-lo; a formulação indica que Israel aguarda a declaração do rei.
- source_word: מִי יֵשֵׁב
  choice: quem se sentará
  rationale: No contexto do trono, ישׁב descreve quem ocupará o lugar real; o futuro em português expressa a sucessão esperada sem explicitação adicional.
- source_word: עַל כִּסֵּא
  choice: no trono
  rationale: כִּסֵּא significa “trono”, e a combinação com עַל é naturalmente expressa em português por “no trono”.
- source_word: אַחֲרָיו
  choice: depois dele
  rationale: Preserva o sufixo pronominal masculino singular e o sentido sucessório, sem substituí-lo diretamente pelo nome de Davi no texto.
theological_decisions:
- issue: Referente do pronome em אַחֲרָיו
  choice: “dele”, referindo-se ao rei Davi
  alternative: “depois disso” ou simplesmente “depois”
  rationale: A forma hebraica contém um sufixo masculino singular, cujo referente mais natural no contexto é o rei Davi. O texto principal conserva o pronome, enquanto a nota esclarece o referente contextual.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento em segunda pessoa (“ti”, “digas”) adequado à fala solene dirigida ao rei. A imagem dos “olhos” foi preservada, e a repetição de “meu senhor, o rei” acompanha a deferência formal do hebraico.
