base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: pt
  text: Ele conversou com Joabe, filho de Zeruia, e com Abiatar, o sacerdote; e eles apoiaram Adonias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ajudaram seguindo Adonias”, isto é, seguiram ou apoiaram Adonias.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: consultou
  rationale: A expressão hebraica, literalmente relacionada a ter palavras ou assuntos com alguém, indica aqui comunicação e deliberação. “Consultou” transmite de modo natural e conciso a ideia de tratar do assunto com Joabe e Abiatar, sem especificar além do texto o conteúdo da conversa.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joabe, filho de Zeruia
  rationale: Mantém o nome próprio e a identificação patronímica segundo a forma tradicional e amplamente reconhecível em português.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: o sacerdote Abiatar
  rationale: Reproduz o título definido de Abiatar em ordem natural no português.
- source_word: וַיַּעְזְרוּ אַחֲרֵי
  choice: apoiaram
  rationale: 'O verbo “ajudar”, seguido de “atrás/depois de”, forma no contexto uma expressão de adesão: Joabe e Abiatar deram apoio a Adonias. “Apoiaram” comunica claramente essa lealdade política, enquanto a construção literal é registrada em nota.'
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Usa a forma portuguesa tradicional e reconhecível do nome hebraico.
