base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: pt
  text: 'Ali, o sacerdote Zadoque e o profeta Natã o ungirão rei sobre Israel. Depois, vocês tocarão a trombeta[a] e dirão: “Viva o rei Salomão!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: shofar, um instrumento de sopro feito de chifre, usado para sinais e proclamações públicas; tradicionalmente traduzido por “trombeta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח אֹתוֹ שָׁם
  choice: Ali ... o ungirão
  rationale: O advérbio שָׁם retoma o local indicado anteriormente. O perfeito com waw, nesta sequência de instruções, tem força diretiva; o futuro em português expressa naturalmente a ordem solene.
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: o sacerdote Zadoque e o profeta Natã
  rationale: Mantém os nomes e traduz os títulos de modo corrente e digno em português.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: O לְ marca a função ou o resultado da unção, e עַל indica o âmbito da autoridade real.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: vocês tocarão a trombeta[a]
  rationale: O plural explícito é vertido por “vocês”, de ampla compreensão, e “tocar a trombeta” é a expressão idiomática tradicional; a nota preserva a especificidade de שׁוֹפָר.
- source_word: וַאֲמַרְתֶּם
  choice: e dirão
  rationale: Continua a cadeia de instruções na segunda pessoa do plural.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Viva o rei Salomão!
  rationale: O jussivo יְחִי constitui uma fórmula de aclamação; “Viva” é seu equivalente idiomático natural em português.
