base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: pt
  text: 'Adonias e todos os convidados que estavam com ele ouviram o barulho quando terminavam de comer.[a] Joabe ouviu o som da trombeta[b] e perguntou: “Por que se ouve esse alvoroço na cidade?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim que terminaram de comer”. A construção hebraica pode indicar tanto o término da refeição quanto o momento em que eles estavam acabando de comer.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: shofar, um chifre usado para sinais públicos.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviram o barulho
  rationale: O verbo significa “ouvir”. O objeto implícito é explicitado como “o barulho”, retomando de modo natural em português a celebração audível no contexto.
- source_word: הַקְּרֻאִים
  choice: os convidados
  rationale: O particípio passivo de קרא designa os que haviam sido chamados ou convidados; no contexto de uma refeição festiva, “os convidados” é claro e idiomático.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: quando terminavam de comer
  rationale: A oração situa o momento em que ouviram o barulho. O imperfeito “terminavam” preserva a possibilidade de que estivessem concluindo a refeição, sem afirmar rigidamente que já a haviam concluído.
- source_word: קוֹל הַשּׁוֹפָר
  choice: o som da trombeta
  rationale: שׁוֹפָר é uma trombeta de chifre usada para sinalização pública. “Trombeta” é corrente e compreensível; a nota registra a natureza do instrumento.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente interrogativo direto, natural e conciso em português.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: a cidade está nesse alvoroço
  rationale: A formulação portuguesa expressa naturalmente o ruído agitado da cidade. “Alvoroço” conserva a ideia de comoção ruidosa de הוֹמָה, sem determinar se era tumulto hostil ou celebração.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas onomásticas bíblicas correntes no Brasil. A sintaxe foi levemente reorganizada para evitar repetição pesada de “ouviu” e para tornar a pergunta final idiomática, preservando a ambiguidade do alvoroço e do momento em que a refeição terminava.
