  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: pt
  text: 'Então o rei jurou e disse: “Tão certo como vive Yahweh, que resgatou a minha vida de toda aflição,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: O nifal de שׁבע indica prestar juramento; “jurou” é a forma narrativa mais direta e natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Preserva o substantivo definido e o título empregado pelo hebraico, sem substituí-lo pelo nome de Davi.
- source_word: וַיֹּאמַר
  choice: introduzido pelos dois-pontos
  rationale: Em português, depois de “jurou”, os dois-pontos introduzem naturalmente as palavras do juramento; traduzir também como “e disse” seria fiel à forma, mas menos fluente e algo redundante.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz de maneira idiomática e solene a fórmula hebraica de juramento, mantendo explícita a afirmação de que Yahweh vive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר פָּדָה
  choice: que resgatou
  rationale: A oração relativa qualifica Yahweh, e o perfeito de פדה recorda sua ação consumada de livrar Davi. “Resgatou” conserva a força própria do verbo sem exigir que haja aqui referência explícita a pagamento.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Neste contexto de preservação em meio a perigos, נֶפֶשׁ designa naturalmente a vida ou a própria pessoa, não necessariamente uma alma imaterial.
- source_word: מִכָּל צָרָה
  choice: de toda aflição
  rationale: Expressa o alcance abrangente de כָּל e o sentido de צָרָה como angústia, adversidade ou situação aflitiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome pessoal diretamente. “Yahweh” o preserva e evita substituí-lo pelo título “Senhor”.
- issue: Sentido de נַפְשִׁי
  choice: a minha vida
  alternative: a minha alma; a mim
  rationale: A referência é à preservação de Davi diante de perigos. “Vida” comunica o sentido contextual sem impor uma distinção antropológica entre corpo e alma.
- issue: Força de פָדָה
  choice: resgatou
  alternative: livrou; redimiu
  rationale: “Resgatou” mantém a imagem de libertação própria do verbo, mas não especifica um preço nem transforma a frase numa afirmação técnica sobre expiação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação hebraica “jurou e disse” foi condensada em “jurou:” para evitar redundância sem perder conteúdo discursivo. Mantém-se a vírgula final porque o juramento continua no versículo seguinte.
