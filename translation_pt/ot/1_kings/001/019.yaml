base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: pt
  text: Ele sacrificou bois, gado cevado e ovelhas[a] em grande quantidade e convidou[b] todos os filhos do rei, o sacerdote Abiatar e Joabe, comandante do exército; mas não convidou Salomão, teu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar de modo mais amplo animais de rebanho menor, incluindo ovelhas e cabras.
    reason: lexical_alternative
  - marker: b
    text: Ou “chamou” nas duas ocorrências do verbo; “convidou” foi usado porque o contexto é o comparecimento a uma festa sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrificou
  rationale: O verbo זבח, neste contexto, indica abate sacrificial, não simples matança de animais.
- source_word: שׁוֹר
  choice: bois
  rationale: Termo bovino de sentido coletivo; “bois” é natural em português e evita especificar indevidamente que eram touros.
- source_word: מְרִיא
  choice: animais cevados
  rationale: Designa animais engordados para alimentação ou sacrifício; a formulação preserva a categoria sem limitar o termo a um único bezerro.
- source_word: צֹאן
  choice: ovelhas
  rationale: Tradução corrente e natural, com nota registrando que o hebraico pode abranger animais de rebanho menor, inclusive cabras.
- source_word: לָרֹב
  choice: em grande quantidade
  rationale: Expressa de modo claro a abundância dos animais sacrificados.
- source_word: וַיִּקְרָא / לֹא קָרָא
  choice: convidou / não convidou
  rationale: Embora קרא signifique literalmente “chamar”, no contexto de uma festa sacrificial descreve o convite para comparecer; a mesma escolha foi mantida nas duas ocorrências.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: todos os filhos do rei
  rationale: Mantém a referência especificamente masculina e reproduz com naturalidade a relação de posse.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: o sacerdote Abiatar
  rationale: A ordem título-nome é natural em português, preservando tanto o nome quanto a função.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: Joabe, comandante do exército
  rationale: Comunica claramente a função militar indicada por שַׂר הַצָּבָא.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: mas não convidou Salomão, seu servo
  rationale: “Mas” torna explícito o contraste contextual, e “seu servo” conserva a forma deferente com que Bate-Seba apresenta Salomão perante Davi.
