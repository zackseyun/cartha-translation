base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: pt
  text: 'Bate-Seba curvou-se e prostrou-se diante do rei. Então o rei lhe perguntou: “O que você deseja?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Que há para você?” A expressão também pode significar “O que a preocupa?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: curvou-se
  rationale: קָדַד descreve o ato físico de inclinar-se profundamente; “curvou-se” é natural em português e não especifica, sem base suficiente, que ela tenha se ajoelhado.
- source_word: בַּת שֶׁבַע
  choice: Bate-Seba
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַתִּשְׁתַּחוּ
  choice: prostrou-se
  rationale: A forma verbal de שׁחה indica prostração ou reverência profunda. A escolha distingue este gesto do verbo anterior e preserva a intensificação da sequência.
- source_word: לַמֶּלֶךְ
  choice: diante do rei
  rationale: Neste contexto de reverência cortesã, “diante do rei” expressa naturalmente a direção e a posição do gesto.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Então o rei lhe perguntou
  rationale: Embora o hebraico diga literalmente “e o rei disse”, o conteúdo é interrogativo; “perguntou” é idiomático em português, e “então” representa com naturalidade a progressão narrativa do wayyiqtol.
- source_word: מַה לָּךְ
  choice: O que você deseja?
  rationale: A expressão significa literalmente “Que há para você?” e, no contexto da audiência real, funciona como uma pergunta cortês sobre o pedido ou a preocupação de Bate-Seba. “O que você deseja?” é claro e natural, sem o tom potencialmente hostil de “O que há com você?”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de dois gestos distintos foi preservada. A divisão em duas frases evita uma coordenação longa sem alterar a sequência narrativa.
