base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: pt
  text: Mas o sacerdote Zadoque, Benaia, filho de Joiada, o profeta Natã, Simei, Reí e os guerreiros que eram de Davi[a] não estavam com Adonias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os guerreiros de Davi”. Hebraico, mais literalmente, “os homens valentes que eram/pertenciam a Davi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָדוֹק הַכֹּהֵן
  choice: Mas o sacerdote Zadoque
  rationale: A conjunção וְ assume valor contrastivo diante da lista anterior dos partidários de Adonias; “mas” torna esse contraste natural em português. O título foi anteposto ao nome, conforme o uso idiomático português.
- source_word: וּבְנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Mantém o patronímico hebraico em formulação corrente e clara em português.
- source_word: וְנָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Preserva a identificação funcional de Natã, com ordem nominal natural em português.
- source_word: וְשִׁמְעִי וְרֵעִי
  choice: Simei, Reí
  rationale: Os nomes próprios são transliterados segundo formas portuguesas usuais; a enumeração evita repetir a conjunção sem perda de conteúdo.
- source_word: וְהַגִּבּוֹרִים אֲשֶׁר לְדָוִד
  choice: e os guerreiros que serviam a Davi
  rationale: גִּבּוֹרִים designa homens valentes ou guerreiros. A expressão relacional אֲשֶׁר לְדָוִד é aberta; “que serviam a Davi” comunica a vinculação ao rei sem transformá-la necessariamente em posse, enquanto a nota registra alternativas mais literais.
- source_word: לֹא הָיוּ עִם
  choice: não estavam com
  rationale: Reproduz a formulação simples do hebraico e preserva a contenção do texto; o contexto permite entender que não apoiavam Adonias sem explicitar isso na tradução.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas reconhecíveis dos nomes próprios. A tradução conserva a oposição política apenas implícita em “não estavam com” e assinala a ambiguidade da relação expressa por אֲשֶׁר לְדָוִד.
