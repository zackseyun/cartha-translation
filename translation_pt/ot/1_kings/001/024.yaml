base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: pt
  text: 'Então Natã disse: “Meu senhor, ó rei, foi você quem disse: ‘Adonias reinará depois de mim e se assentará no meu trono’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Meu senhor, o rei
  rationale: Preserva tanto o tratamento respeitoso quanto o título real, com pontuação natural em português.
- source_word: אַתָּה אָמַרְתָּ
  choice: foi você quem disse
  rationale: O pronome explícito אַתָּה recebe destaque e, no contexto interrogativo, Natã pergunta se a ordem realmente partiu de Davi. A construção portuguesa conserva essa ênfase sem decidir indevidamente entre perfeito presente e passado simples.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: יִמְלֹךְ
  choice: reinará
  rationale: Traduz diretamente o verbo “reinar, ser rei” no contexto da sucessão.
- source_word: אַחֲרָי
  choice: depois de mim
  rationale: Mantém a expressão hebraica concisa e sua referência natural à sucessão.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: se assentará no meu trono
  rationale: Preserva a imagem régia do hebraico em linguagem digna e corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ênfase do pronome hebraico foi reproduzida por “foi você quem disse”, evitando a necessidade de uma nota sobre a distinção verbal específica do inglês.
