base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: pt
  text: 'Pois hoje ele desceu e sacrificou bois, animais cevados e ovelhas em grande quantidade. Convidou todos os filhos do rei, os comandantes do exército e o sacerdote Abiatar. E eis que estão comendo e bebendo diante dele e proclamando: “Viva o rei Adonias!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Viva o rei, Adonias!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta o relato anterior, sem tornar a relação causal mais rígida do que o hebraico exige.
- source_word: יָרַד הַיּוֹם
  choice: hoje ele desceu
  rationale: Preserva explicitamente a ideia direcional de יָרַד e usa o pretérito perfeito, natural em português para um acontecimento recente no relato.
- source_word: וַיִּזְבַּח
  choice: e sacrificou
  rationale: Conserva o sentido cultual de abater animais para sacrifício e banquete, evitando o sentido meramente culinário de 'matou'.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: bois, animais cevados e ovelhas
  rationale: Mantém distintos os três termos hebraicos. 'Animais cevados' preserva a relativa amplitude de מְרִיא, sem restringi-lo necessariamente a bezerros; 'ovelhas' é a forma convencional e concisa para צֹאן neste tipo de lista.
- source_word: לָרֹב
  choice: em grande quantidade
  rationale: Expressa de modo claro e atual a abundância dos animais sacrificados.
- source_word: וַיִּקְרָא לְ
  choice: Convidou
  rationale: Neste contexto de banquete, קרא com ל indica convocar ou convidar pessoas, não apenas chamá-las verbalmente.
- source_word: שָׂרֵי הַצָּבָא
  choice: os comandantes do exército
  rationale: Comunica de forma moderna e precisa a função militar dos שָׂרִים.
- source_word: וְהִנָּם
  choice: E eis que
  rationale: Retém a função apresentativa e enfática da expressão hebraica em registro digno e ainda corrente na linguagem bíblica portuguesa.
- source_word: וַיֹּאמְרוּ
  choice: proclamando
  rationale: No contexto, a fala repetida ou coletiva funciona como aclamação pública; o gerúndio liga naturalmente essa ação ao quadro presente de comer e beber.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: Viva o rei Adonias!
  rationale: É a fórmula idiomática portuguesa correspondente à aclamação volitiva hebraica, preservando o título e o nome.
