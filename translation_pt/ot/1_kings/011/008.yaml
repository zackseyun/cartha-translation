  text: וְ/כֵ֣ן עָשָׂ֔ה לְ/כָל נָשָׁ֖י/ו הַ/נָּכְרִיּ֑וֹת מַקְטִיר֥וֹת וּֽ/מְזַבְּח֖וֹת לֵ/אלֹהֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/008.yaml
  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: pt
  text: E assim fez para todas as suas esposas estrangeiras[a], que queimavam incenso e ofereciam sacrifícios aos seus deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E do mesmo modo fez para todas as suas esposas estrangeiras”. O hebraico deixa implícita a ação específica, retomando o versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: E assim
  rationale: Retoma o versículo anterior e indica que Salomão agiu do mesmo modo, sem explicitar além do hebraico qual foi a ação.
- source_word: עָשָׂה
  choice: fez
  rationale: Preserva o sentido amplo e elíptico de “fazer”, deixando que o contexto anterior forneça o complemento.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: para todas as suas mulheres estrangeiras
  rationale: “Mulheres” é natural no contexto matrimonial já estabelecido, enquanto “estrangeiras” indica sua origem fora de Israel.
- source_word: מַקְטִירוֹת
  choice: queimavam incenso
  rationale: O particípio feminino plural descreve uma prática cultual contínua realizada pelas mulheres.
- source_word: וּמְזַבְּחוֹת
  choice: e ofereciam sacrifícios
  rationale: Expressa com clareza a atividade sacrificial e mantém o aspecto habitual dos particípios coordenados.
- source_word: לֵאלֹהֵיהֶן
  choice: aos seus deuses
  rationale: O plural com sufixo feminino refere-se naturalmente às divindades cultuadas pelas mulheres; a minúscula distingue-as do Deus de Israel.
theological_decisions:
- issue: Referente dos particípios מַקְטִירוֹת וּמְזַבְּחוֹת
  choice: As mulheres estrangeiras são as que queimavam incenso e ofereciam sacrifícios.
  alternative: Os particípios poderiam descrever de modo mais geral o culto associado aos santuários feitos por Salomão.
  rationale: Os particípios femininos plurais concordam diretamente com “mulheres estrangeiras”; a tradução preserva essa relação gramatical.
- issue: Elipse daquilo que Salomão “fez”
  choice: Manter a ação implícita em “fez”.
  alternative: Explicitar “construiu lugares altos” ou traduzir “fez o mesmo”.
  rationale: O hebraico depende do versículo anterior para completar o sentido. A formulação escolhida conserva essa elipse e evita acrescentar conteúdo ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mulheres estrangeiras” evita a possível redundância de “esposas” após o possessivo e permanece claro no contexto; os verbos no imperfeito comunicam atividade cultual contínua ou habitual.
