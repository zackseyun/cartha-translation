id: 1KI.11.14
reference: 1 Kings 11:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: pt
  text: Então Yahweh levantou contra Salomão um adversário[a], Hadade, o edomita; ele era da linhagem real de Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico satan; aqui significa “adversário” ou “opositor”, não o nome próprio Satanás.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: levantou
  rationale: O hifil de קום indica que Yahweh fez surgir alguém em oposição a Salomão. “Levantou” preserva a ação divina e é natural no registro bíblico português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שָׂטָן
  choice: um adversário
  rationale: Aqui o termo é um substantivo comum que designa um opositor humano, identificado em seguida como Hadade, e não o nome próprio Satanás.
- source_word: לִשְׁלֹמֹה
  choice: contra Salomão
  rationale: Com שָׂטָן, a preposição לְ assinala a pessoa que sofre a oposição; “contra” expressa claramente essa relação.
- source_word: הֲדַד הָאֲדֹמִי
  choice: Hadade, o edomita
  rationale: Emprega a forma portuguesa corrente do nome e traduz o gentílico de maneira natural; as vírgulas marcam Hadade como aposto identificador de “um adversário”.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: da linhagem real
  rationale: A expressão literal “da descendência do rei” é um idioma genealógico que indica pertencimento à casa real. “Da linhagem real” comunica isso com clareza.
- source_word: הוּא בֶּאֱדוֹם
  choice: de Edom
  rationale: O segmento especifica o âmbito edomita da descendência real. Integrá-lo como “da linhagem real de Edom” produz português natural sem acrescentar informação.
theological_decisions:
- issue: Sentido de שָׂטָן neste versículo
  choice: 'substantivo comum: “adversário”'
  alternative: 'nome próprio: “Satanás”'
  rationale: A sintaxe identifica Hadade, um opositor político humano, como o שָׂטָן levantado contra Salomão. A tradução evita importar uma identificação demonológica que o contexto não sustenta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém “Yahweh” como nome divino e usa ponto e vírgula para conservar a progressão sintática do hebraico.
