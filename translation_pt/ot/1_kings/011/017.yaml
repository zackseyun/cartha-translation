id: 1KI.11.17
reference: 1 Kings 11:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּבְרַ֣ח אֲדַ֡ד הוּא֩ וַ/אֲנָשִׁ֨ים אֲדֹמִיִּ֜ים מֵ/עַבְדֵ֥י אָבִ֛י/ו אִתּ֖/וֹ לָ/ב֣וֹא מִצְרָ֑יִם וַ/הֲדַ֖ד נַ֥עַר קָטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: pt
  text: Hadade fugiu para o Egito[a] com alguns homens edomitas dentre os servos de seu pai; e Hadade ainda era um menino muito novo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “para chegar ao Egito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um menino pequeno”. A expressão hebraica enfatiza que Hadade ainda tinha pouca idade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: O qal de ברח significa normalmente “fugir”. “Fugiu” é direto, natural e adequado ao contexto de escape.
- source_word: אֲדַד
  choice: Hadade
  rationale: Transliteração tradicional e reconhecível do nome próprio em português.
- source_word: הוּא
  choice: Hadade… com
  rationale: O pronome independente destaca Hadade como sujeito junto de seus acompanhantes. A construção portuguesa mantém o foco nele sem reproduzir de modo artificial “ele e”.
- source_word: וַאֲנָשִׁים אֲדֹמִיִּים
  choice: com alguns homens edomitas
  rationale: A expressão designa homens de Edom em número indefinido. “Alguns” evita sugerir que se tratava de todos os edomitas.
- source_word: מֵעַבְדֵי אָבִיו
  choice: dentre os servos de seu pai
  rationale: “Dentre” expressa a força partitiva de מִן, e “servos” conserva o sentido amplo de עֶבֶד no ambiente doméstico ou régio.
- source_word: אִתּוֹ
  choice: com
  rationale: Integra naturalmente em português a informação de que os homens acompanhavam Hadade.
- source_word: לָבוֹא מִצְרָיִם
  choice: para o Egito
  rationale: Depois de “fugiu”, o português expressa a meta de modo natural apenas com “para o Egito”; a ideia de chegada contida em בוא permanece implícita e é indicada em nota.
- source_word: נַעַר קָטָן
  choice: um menino muito novo
  rationale: נַעַר indica menino ou jovem, e קָטָן ressalta sua pouca idade. “Muito novo” comunica essa ênfase sem sugerir principalmente baixa estatura.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com fluência brasileira. A ordem foi ajustada para evitar a construção pouco natural “Hadade, ele e…”, mas o protagonismo de Hadade e a presença dos acompanhantes foram preservados. Os dois marcadores de nota aparecem junto aos trechos correspondentes.
