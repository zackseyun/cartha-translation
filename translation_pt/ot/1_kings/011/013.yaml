source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: pt
  text: Contudo[a], não arrancarei o reino inteiro; darei uma tribo ao seu filho, por causa de Davi, meu servo, e por causa de Jerusalém, que escolhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Só que não arrancarei o reino inteiro”.'
    reason: Alternativa lexical para רַק, que pode introduzir a frase como limitação ou ressalva.
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Introduz uma ressalva ao juízo anunciado anteriormente. “Contudo” comunica com naturalidade a força adversativa, sem eliminar o sentido alternativo de limitação indicado na nota.
- source_word: כָּל הַמַּמְלָכָה
  choice: o reino inteiro
  rationale: Expressa a totalidade do domínio real em português corrente e preserva a abrangência de כָּל.
- source_word: אֶקְרָע
  choice: arrancarei
  rationale: Mantém a imagem vívida de rasgar ou separar à força e se ajusta naturalmente à remoção política do reino.
- source_word: שֵׁבֶט אֶחָד
  choice: uma tribo
  rationale: Neste contexto, שֵׁבֶט designa uma unidade tribal de Israel, e não um bastão ou cetro literal.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: darei ao seu filho
  rationale: Reproduz de maneira direta e clara a linguagem hebraica de concessão futura.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: por causa de Davi, meu servo
  rationale: Comunica o motivo ou a consideração expressa por לְמַעַן sem explicitar um mecanismo teológico além do texto.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: e por causa de Jerusalém
  rationale: Preserva o paralelismo e a repetição da expressão hebraica, apresentando Jerusalém como uma segunda consideração explícita.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: que escolhi
  rationale: Traduz diretamente o perfeito hebraico e apresenta a escolha divina de Jerusalém como um ato estabelecido, sem acrescentar elementos não expressos.
theological_decisions:
- issue: Motivo da preservação de uma tribo
  choice: A preservação parcial do reino ocorre por causa de Davi, servo de Deus, e de Jerusalém, escolhida por Deus.
  alternative: A preservação decorreria exclusivamente da aliança davídica, ou teria como razão principal o templo e a cidade.
  rationale: O hebraico apresenta duas razões paralelas e coordenadas. A tradução mantém ambas, sem subordinar uma à outra nem importar uma formulação doutrinária externa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Contudo” conserva o tom solene sem soar arcaico; “arrancarei” mantém a metáfora forte do hebraico. A repetição de “por causa de” reflete deliberadamente o paralelismo do original.
