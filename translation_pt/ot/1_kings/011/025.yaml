base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: pt
  text: Ele foi adversário de Israel durante todos os dias de Salomão, além do dano que Hadade causou.[a] Ele detestou Israel e reinou sobre Arã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “juntamente com o dano causado por Hadade”. A frase hebraica é elíptica e pode indicar que esse adversário se levantou em acréscimo ao dano causado por Hadade.'
    reason: Leitura alternativa de uma construção hebraica difícil e elíptica.
lexical_decisions:
- source_word: שָׂטָן
  choice: adversário
  rationale: Neste relato político, o substantivo comum designa um oponente humano; “adversário” evita importar a figura sobrenatural de Satanás.
- source_word: לְיִשְׂרָאֵל
  choice: de Israel
  rationale: Com “adversário”, a construção idiomática portuguesa “adversário de Israel” expressa naturalmente a relação hostil indicada pela preposição hebraica.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: durante todos os dias de Salomão
  rationale: Conserva a expressão temporal abrangente do hebraico sem restringi-la explicitamente à vida ou ao reinado.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: além do mal causado por Hadade
  rationale: A frase é elíptica e difícil. “Além de” comunica a provável força aditiva, enquanto “causado por” supre com clareza o verbo implícito. “Mal” preserva a amplitude semântica de רָעָה, aqui entendida como dano ou desgraça, não necessariamente maldade moral.
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: Ele detestou Israel
  rationale: “Detestou” transmite a forte aversão do verbo קוץ e permite que Israel apareça como objeto direto, conforme o uso natural do português.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: reinou sobre Arã
  rationale: Mantém o verbo régio e translitera o nome histórico Arã, sem substituí-lo pelo nome geográfico posterior “Síria”.
theological_decisions:
- issue: Se שָׂטָן deve ser traduzido como o nome próprio “Satanás”
  choice: adversário humano
  alternative: Satanás
  rationale: O contexto trata de opositores políticos de Salomão, e o termo funciona como substantivo comum. “Satanás” introduziria uma identificação sobrenatural ausente do texto.
- issue: Sentido de רָעָה na frase elíptica
  choice: mal no sentido contextual de dano ou desgraça
  alternative: maldade moral
  rationale: A referência é ao prejuízo ou transtorno causado a Israel por Hadade; a tradução não deve transformar automaticamente o termo em juízo sobre sua qualidade moral.
translation_notes:
  register: Português atual, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A estrutura conserva a concisão narrativa e a ambiguidade genuína da cláusula sobre Hadade.
