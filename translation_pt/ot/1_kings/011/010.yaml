  text: וְ/צִוָּ֤ה אֵלָי/ו֙ עַל הַ/דָּבָ֣ר הַ/זֶּ֔ה לְ/בִ֨לְתִּי לֶ֔כֶת אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹ֣א שָׁמַ֔ר אֵ֥ת אֲשֶׁר צִוָּ֖ה יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: pt
  text: e lhe havia ordenado, a respeito disso, que não fosse atrás de outros deuses[a]; mas ele não cumpriu o que Yahweh havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica «ir atrás de outros deuses» é uma fórmula comum da linguagem da aliança para se voltar a outras divindades e adorá-las.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: e lhe havia ordenado
  rationale: O mais-que-perfeito situa a ordem antes da desobediência mencionada no contexto; «lhe havia ordenado» expressa naturalmente o destinatário em português.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: a respeito disso
  rationale: Neste contexto, דָּבָר indica o assunto ou questão já mencionado; «disso» evita a formulação excessivamente literal «desta coisa».
- source_word: לְבִלְתִּי לֶכֶת
  choice: que não fosse
  rationale: A construção expressa o conteúdo proibitivo da ordem. O subjuntivo imperfeito é natural depois de «havia ordenado».
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: atrás de outros deuses
  rationale: Mantém a imagem da expressão hebraica de aliança, compreensível em português e esclarecida em nota.
- source_word: וְלֹא שָׁמַר
  choice: mas ele não cumpriu
  rationale: O waw tem valor contrastivo no contexto. שׁמר, aplicado a uma ordem, significa observá-la ou cumpri-la; «cumpriu» comunica isso com naturalidade.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: o que Yahweh havia ordenado
  rationale: A oração refere-se ao conteúdo da ordem divina, e o mais-que-perfeito mantém sua anterioridade em relação à desobediência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. «Yahweh» preserva o nome pessoal da aliança sem o substituir por um título.
- issue: Sentido de «ir atrás de outros deuses»
  choice: preservar a imagem hebraica
  alternative: adorar outros deuses
  rationale: A expressão pode abranger adesão e culto a outras divindades. Preservar a metáfora evita reduzir silenciosamente sua amplitude; a nota explica seu uso pactual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a relação temporal e o contraste do hebraico sem rigidez excessiva.
