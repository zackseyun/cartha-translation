  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: pt
  text: Mas não tirarei da mão dele todo o reino, pois farei dele governante durante todos os dias de sua vida, por causa de Davi, meu servo, a quem escolhi e que guardou meus mandamentos e meus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: governante
  rationale: O termo designa alguém elevado à liderança — chefe, príncipe ou governante. Aqui, “governante” expressa naturalmente a função de Salomão sem impor um título político mais específico do que o hebraico exige.
- source_word: אֲשִׁתֶנּוּ
  choice: o manterei como
  rationale: Literalmente, o verbo significa “eu o porei/farei”. No contexto, Salomão já reina, de modo que a formulação explicita a continuidade de sua posição durante toda a vida.
- source_word: מִצְוֺתַי וְחֻקֹּתָי
  choice: meus mandamentos e meus estatutos
  rationale: Mantém a distinção lexical entre ordens divinas e prescrições estabelecidas, usando terminologia bíblica clara e corrente.
theological_decisions:
- issue: A afirmação de que Davi guardou os mandamentos e estatutos de Deus
  choice: Preservar a afirmação sem qualificá-la
  alternative: Acrescentar uma ressalva sobre os pecados de Davi
  rationale: O versículo apresenta a avaliação em termos de fidelidade de aliança e não inclui ressalva; inserir uma explicação resolveria uma tensão teológica que o próprio texto deixa intacta.
- issue: Alcance de “todo o reino”
  choice: Manter “todo o reino”
  alternative: Explicitar que uma parte do reino seria tirada
  rationale: A formulação negativa antecipa a divisão descrita no contexto e deve conservar sua força e sua relação com os versículos adjacentes.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente naturalizada sem apagar as relações causais do hebraico.
