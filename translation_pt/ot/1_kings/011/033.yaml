  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: pt
  text: porque me abandonaram e se prostraram diante de Astarote[a], o deus dos sidônios, diante de Quemos, o deus de Moabe, e diante de Milcom[b], o deus dos amonitas, e não andaram nos meus caminhos, fazendo o que é certo aos meus olhos e cumprindo os meus estatutos e as minhas ordenanças, como Davi, seu pai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a deusa dos sidônios”. A expressão hebraica diz literalmente “o deus dos sidônios”, embora Astarote seja uma divindade feminina.'
    reason: lexical_alternative
  - marker: b
    text: Milcom é a forma encontrada aqui no texto hebraico; alguns associam esse nome a Moloque.
    reason: alternative_reading
  - marker: c
    text: Aqui, “pai” refere-se a Davi como antepassado dinástico, não como pai biológico imediato.
    reason: cultural_note
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: porque
  rationale: Expressa de modo natural e direto a relação causal que explica a divisão do reino.
- source_word: עֲזָבוּנִי
  choice: me abandonaram
  rationale: Preserva a força de ruptura e infidelidade da raiz עזב em contexto de aliança, com linguagem portuguesa atual.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prostraram diante de
  rationale: Mantém tanto o gesto físico de prostração quanto seu sentido cultual, sem reduzi-lo simplesmente a 'adoraram'.
- source_word: לְעַשְׁתֹּרֶת
  choice: diante de Astarote
  rationale: Astarote é a forma bíblica portuguesa corrente para o nome hebraico עַשְׁתֹּרֶת.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: o deus dos sidônios
  rationale: Segue formalmente a expressão hebraica, embora Astarote seja uma divindade feminina; a dificuldade é indicada em nota.
- source_word: לִכְמוֹשׁ
  choice: diante de Quemos
  rationale: Emprega a transliteração tradicional e reconhecível em português para o nome da divindade moabita.
- source_word: וּלְמִלְכֹּם
  choice: e diante de Milcom
  rationale: Representa a leitura do texto massorético sem substituí-la pela associação tradicional com Moloque.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: o deus dos amonitas
  rationale: '''Amonitas'' traduz naturalmente o gentílico hebraico literal ''filhos de Amom''.'
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: não andaram nos meus caminhos
  rationale: Conserva a metáfora hebraica de conduta e fidelidade, ainda clara em português.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: fazendo o que é certo aos meus olhos e cumprindo os meus estatutos e as minhas ordenanças
  rationale: Torna natural em português a regência do único verbo hebraico sobre três objetos, sem perder a ligação entre andar nos caminhos de Deus, fazer o que ele considera certo e observar suas normas.
- source_word: כְדָוִד אָבִיו
  choice: como fez Davi, antepassado dele
  rationale: Explicita de forma concisa a comparação verbal e traduz אָב no sentido dinástico adequado, evitando sugerir que Davi fosse o pai biológico imediato do referente.
theological_decisions:
- issue: Gênero de אֱלֹהֵי em referência a Astarote
  choice: o deus dos sidônios
  alternative: a deusa dos sidônios
  rationale: O texto hebraico emprega literalmente a designação 'deus dos sidônios'. A tradução principal preserva essa forma textual, enquanto a nota informa o sexo tradicionalmente atribuído à divindade.
- issue: Identidade de מִלְכֹּם
  choice: Milcom
  alternative: Moloque
  rationale: O texto massorético traz Milcom neste versículo. A possível associação com Moloque é mantida como informação de nota, não imposta ao texto principal.
- issue: Sentido de אָבִיו aplicado a Davi
  choice: antepassado dele
  alternative: pai dele
  rationale: Aqui אָב indica o antepassado dinástico de quem se fala, e não necessariamente o pai biológico imediato. A tradução evita uma identificação referencial enganosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preservam-se a metáfora 'andar nos caminhos', a descrição formal de Astarote como 'deus' no hebraico e a leitura Milcom. A coordenação legal foi levemente ajustada com 'cumprindo' para evitar o pouco natural 'fazer os estatutos e as ordenanças' em português.
