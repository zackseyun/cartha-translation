source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: pt
  text: E acontecerá que, se você ouvir tudo o que eu lhe ordenar, andar nos meus caminhos e fizer o que é certo aos meus olhos, guardando os meus estatutos e os meus mandamentos, como fez Davi, meu servo, então estarei com você, construirei para você uma casa duradoura[a], como construí para Davi, e lhe darei Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma casa firme”, “uma casa segura” ou “uma casa fiel”; isto é, uma dinastia duradoura.
    reason: Alternativas lexicais para בַיִת נֶאֱמָן e esclarecimento do sentido dinástico de “casa”.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: ouvir
  rationale: O verbo pode significar ouvir, escutar ou obedecer. “Ouvir” preserva a imagem auditiva, enquanto as orações seguintes deixam claro que se trata de uma resposta obediente.
- source_word: אֲצַוֶּךָ
  choice: eu lhe ordenar
  rationale: No contexto condicional, o imperfeito tem sentido presente ou prospectivo. “Ordenar” comunica naturalmente a autoridade da instrução divina.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: andar nos meus caminhos
  rationale: Preserva a metáfora pactual tradicional e continua compreensível em português moderno.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: o que é certo aos meus olhos
  rationale: Mantém o idioma hebraico e expressa que Deus é quem avalia o que é moralmente correto.
- source_word: לִשְׁמֹר
  choice: guardando
  rationale: O gerúndio indica o modo pelo qual se faz o que é certo, sem tornar a relação sintática excessivamente explícita.
- source_word: חֻקּוֹתַי
  choice: meus estatutos
  rationale: “Estatutos” é uma tradução reconhecível e formalmente adequada em contexto legal e pactual.
- source_word: מִצְוֺתַי
  choice: meus mandamentos
  rationale: Preserva o registro pactual e distingue o substantivo do verbo “ordenar” usado anteriormente.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Aqui o termo funciona como título honroso de Davi no serviço pactual a Deus; “servo” se ajusta melhor ao contexto régio do que “escravo”.
- source_word: בַיִת נֶאֱמָן
  choice: uma casa duradoura
  rationale: “Casa” conserva a metáfora bíblica da linhagem real, enquanto “duradoura” comunica a firmeza, estabilidade e continuidade expressas por נֶאֱמָן. A nota registra alternativas mais literais e esclarece o sentido dinástico.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: e lhe darei Israel
  rationale: Reproduz de modo direto e natural a concessão de Israel por Deus a Jeroboão.
theological_decisions:
- issue: Sentido de “casa” na promessa
  choice: Manter “casa” no texto com sentido de linhagem real duradoura
  alternative: Traduzir diretamente como “dinastia” ou entender como casa ou palácio físico
  rationale: A comparação com a casa edificada para Davi e o contexto da sucessão régia indicam uma dinastia. A manutenção de “casa” preserva a metáfora e sua ligação com a promessa davídica; a nota esclarece o referente.
- issue: Caráter condicional da promessa
  choice: Apresentar a promessa como dependente da obediência de Jeroboão
  alternative: Interpretá-la como concessão incondicional
  rationale: A partícula אִם e a sequência de exigências de obediência tornam explícita a condição. A formulação “se... então” preserva essa estrutura sem harmonização teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se as metáforas bíblicas “andar nos meus caminhos”, “aos meus olhos” e “casa”, mas a sintaxe foi ajustada para soar natural. O pronome “você” comunica diretamente o singular hebraico sem regionalismo excessivamente marcado.
