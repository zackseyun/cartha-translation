base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: pt
  text: Mas tirarei o reino da mão do filho dele e o darei a você — as dez tribos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e o darei a você, as dez tribos”. A expressão “as dez tribos” especifica em que consiste o reino que será dado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Mas tirarei
  rationale: O perfeito qal com conjunção tem valor futuro no discurso profético. “Mas” expressa o contraste com o contexto anterior, e “tirarei” comunica naturalmente a retirada do domínio.
- source_word: הַמְּלוּכָה
  choice: o reino
  rationale: Designa o domínio real que será retirado da linhagem de Salomão; “reino” é claro, corrente e adequado ao contexto.
- source_word: מִיַּד בְּנוֹ
  choice: das mãos do filho dele
  rationale: Preserva a imagem hebraica de poder, posse ou controle. O plural “das mãos” é idiomático em português, e “dele” remete a Salomão no contexto.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: e o darei a você
  rationale: O sufixo feminino retoma מְּלוּכָה, “reino”; em português, o pronome correspondente é masculino. A repetição do sujeito torna explícito o valor futuro e soa natural.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: as dez tribos
  rationale: A expressão em aposição especifica em que consiste o reino entregue. Os dois-pontos tornam essa relação clara sem acrescentar conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A imagem hebraica das mãos foi preservada, enquanto a aposição final foi sinalizada por dois-pontos para evitar ambiguidade sintática.
