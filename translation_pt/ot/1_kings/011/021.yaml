base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: pt
  text: 'Quando Hadade soube, no Egito, que Davi havia se deitado com seus pais[a] e que Joabe, comandante do exército, estava morto[b], Hadade disse ao faraó: “Deixe-me partir, para que eu vá para a minha terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica tradicional para a morte; literalmente, “havia se deitado com seus pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “havia morrido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: soube
  rationale: No contexto, o verbo indica que Hadade recebeu a notícia; “soube” comunica isso com naturalidade, sem acrescentar informação.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: havia repousado com seus antepassados
  rationale: Preserva a imagem do conhecido eufemismo hebraico para a morte, em linguagem portuguesa digna e compreensível.
- source_word: מֵת
  choice: estava morto
  rationale: Expressa o estado resultante indicado pela forma hebraica; “havia morrido” também é possível.
- source_word: שַׂר הַצָּבָא
  choice: comandante do exército
  rationale: Equivalente moderno e claro para o título militar hebraico.
- source_word: שַׁלְּחֵנִי
  choice: Deixe-me partir
  rationale: No contexto da corte, o imperativo é um pedido para que o faraó libere Hadade e permita sua partida; esta formulação é natural em português.
- source_word: וְאֵלֵךְ
  choice: para que eu vá
  rationale: Transmite o valor volitivo e de finalidade da forma hebraica sem introduzir explicitamente a ideia de “voltar”, embora o contexto implique retorno.
- source_word: אַרְצִי
  choice: minha terra
  rationale: Traduz diretamente o substantivo com o sufixo possessivo, de maneira natural em português.
