language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: pt
  text: 'Então Yahweh disse a Salomão: “Visto que você tem agido assim[a] e não guardou a minha aliança nem os meus estatutos que lhe ordenei, certamente arrancarei de você o reino e o darei ao seu servo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “isto esteve com você”. A expressão hebraica é elíptica e pode indicar a conduta persistente ou a condição estabelecida de Salomão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz de modo natural e digno a causa do juízo anunciado.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: você tem agido assim
  rationale: Expressa em português corrente o idioma hebraico elíptico, que aponta para a conduta ou condição estabelecida de Salomão, sem especificar além do contexto.
- source_word: שָׁמַרְתָּ
  choice: guardou
  rationale: Preserva a linguagem pactual de observar e manter fielmente tanto a aliança quanto os estatutos.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: Mantém o sentido jurídico e teológico de בְּרִית.
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: Equivalente reconhecível e formal para determinações divinas no contexto legal e pactual.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: que lhe ordenei
  rationale: Reproduz idiomaticamente em português o ato de impor mandamentos a Salomão.
- source_word: קָרֹעַ אֶקְרַע
  choice: certamente arrancarei
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica e assegura a ação futura; “certamente” conserva essa ênfase.
- source_word: הַמַּמְלָכָה מֵעָלֶיךָ
  choice: arrancarei de você o reino
  rationale: Comunica a retirada violenta do domínio real de Salomão, preservando a metáfora de rasgar ou arrancar.
- source_word: וּנְתַתִּיהָ לְעַבְדֶּךָ
  choice: e o darei ao seu servo
  rationale: O pronome retoma o reino, e “servo” se ajusta ao sentido político de um subordinado real.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido do idioma הָיְתָה זֹּאת עִמָּךְ
  choice: você tem agido assim
  alternative: isto esteve com você; esta tem sido a sua condição
  rationale: O contexto relaciona a expressão à conduta persistente de Salomão. A tradução escolhida torna o sentido inteligível, enquanto a nota registra a forma mais literal e a ambiguidade entre conduta e condição.
- issue: Força de קָרֹעַ אֶקְרַע
  choice: certamente arrancarei
  alternative: arrancarei por completo; sem falta tirarei
  rationale: A construção hebraica marca ênfase e certeza, sem exigir que a tradução defina o alcance do reino além do que o próprio contexto estabelece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” por naturalidade contemporânea e mantém termos bíblico-jurídicos transparentes, como “aliança” e “estatutos”. A nota preserva a forma e a ambiguidade do idioma hebraico.
