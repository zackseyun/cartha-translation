  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: pt
  text: E o tempo que Salomão reinou em Jerusalém sobre todo o Israel foi de quarenta anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים
  choice: E o tempo
  rationale: A conjunção mantém a ligação narrativa; o idiomatismo hebraico literalmente expresso por “os dias” designa aqui a duração total do reinado, vertida naturalmente como “o tempo”.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo preserva de modo natural a estrutura da oração hebraica.
- source_word: מָלַךְ
  choice: reinou
  rationale: O Qal de מלך indica o exercício da realeza; “reinou” é o equivalente português conciso e convencional em sumários régios.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בִ/ירוּשָׁלִַם
  choice: em Jerusalém
  rationale: A preposição ב tem sentido locativo neste contexto.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: עַל expressa o domínio régio, e “Israel” conserva a referência coletiva à nação.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarenta anos
  rationale: Tradução direta da expressão numeral mais substantivo que indica a duração do reinado.
