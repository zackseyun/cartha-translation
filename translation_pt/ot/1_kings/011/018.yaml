base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: pt
  text: Eles partiram de Midiã e chegaram a Parã. Levaram consigo homens de Parã e foram ao Egito, ao faraó, rei do Egito. O faraó lhe deu uma casa, destinou-lhe alimento[a] e lhe deu terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e pão disse para ele”; o sentido parece ser que o faraó ordenou ou destinou provisões para ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: Eles partiram de Midiã
  rationale: Em narrativa de viagem, קום pode funcionar idiomaticamente como pôr-se a caminho ou partir; a formulação natural em português comunica o movimento sem reproduzir de modo rígido o sentido literal de levantar-se.
- source_word: פָּארָן
  choice: Parã
  rationale: Forma portuguesa tradicional e transparente do topônimo hebraico.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: Levaram consigo alguns homens de Parã
  rationale: Mantém o referente masculino de אֲנָשִׁים e expressa naturalmente que homens de Parã se juntaram ao grupo; 'alguns' é idiomático em português e não pretende fixar uma quantidade específica.
- source_word: אֶל־פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ao faraó, rei do Egito
  rationale: Preserva a construção apositiva hebraica em português corrente; 'faraó' é tratado como título.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: Ele deu a Hadade uma casa
  rationale: O pronome hebraico retoma Hadade, mencionado no contexto anterior. Repetir o nome evita a ambiguidade excessiva que 'lhe' criaria após a menção ao faraó, sem acrescentar um novo referente.
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: destinou-lhe alimento
  rationale: A expressão hebraica é incomum, literalmente 'e pão disse para ele'. No contexto, comunica uma ordem ou concessão de provisões; 'alimento' preserva o sentido amplo de לֶחֶם e 'destinou' expressa a ação administrativa provável.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: e lhe deu terras
  rationale: אֶרֶץ, neste contexto de concessão real, indica terra ou propriedade. O plural idiomático 'terras' evita sugerir que o faraó lhe tenha dado um país inteiro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A coordenação narrativa hebraica foi dividida em frases para fluidez. O nome 'Hadade', fornecido pelo contexto imediato, esclarece o referente do pronome sem resolver qualquer questão teológica.
