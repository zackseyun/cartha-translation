base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: pt
  text: 'dentre as nações a respeito das quais Yahweh havia dito aos filhos de Israel[a]: “Vocês não devem entrar no meio delas, nem elas devem entrar no meio de vocês, pois certamente elas inclinarão o coração de vocês para os deuses delas”. Foi a elas que Salomão se apegou com amor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito neste contexto: “Vocês não devem se casar com elas, nem elas com vocês”. O hebraico diz, mais literalmente: “Vocês não devem entrar no meio delas, nem elas devem entrar no meio de vocês”.'
    reason: Alternativa lexical que esclarece o sentido matrimonial contextual sem substituir no texto principal a expressão mais ampla do hebraico.
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: dentre as nações
  rationale: גּוֹיִם designa nações ou povos estrangeiros; “dentre as nações” liga naturalmente este fragmento às mulheres mencionadas no contexto anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a forma hebraica tradicional e sua referência coletiva ao povo da aliança.
- source_word: לֹא תָבֹאוּ בָהֶם ... לֹא יָבֹאוּ בָכֶם
  choice: Vocês não devem entrar no meio delas, nem elas devem entrar no meio de vocês
  rationale: Mantém a expressão ampla e recíproca do hebraico, sem inserir diretamente “casar-se”, embora esse seja o sentido contextual.
- source_word: אָכֵן
  choice: pois certamente
  rationale: “Certamente” conserva a ênfase da partícula, enquanto “pois” explicita a função causal natural da declaração no contexto.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: elas inclinarão o coração de vocês
  rationale: Preserva a metáfora de נטה e o singular coletivo “coração”, ainda que os destinatários sejam plurais.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: para os deuses delas
  rationale: Em português, “inclinar o coração para” comunica com naturalidade a orientação religiosa expressa pelo hebraico “atrás de”.
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה
  choice: Foi a elas que Salomão se apegou
  rationale: A construção destacada reproduz a retomada enfática. “A elas” preserva uma referência que, no contexto, aponta para as mulheres dessas nações sem repeti-las explicitamente.
- source_word: לְאַהֲבָה
  choice: com amor
  rationale: Mantém o vínculo lexical explícito com amor e expressa a natureza da forte ligação de Salomão.
theological_decisions:
- issue: Se a proibição deve ser explicitada como proibição de casamento misto
  choice: Manter no texto principal a expressão mais ampla “entrar no meio delas”
  alternative: “Vocês não devem se casar com elas, nem elas com vocês”
  rationale: O contexto é claramente matrimonial, mas a formulação hebraica é mais geral. A tradução preserva essa formulação e registra a interpretação contextual em nota.
- issue: Como traduzir בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas / povo de Israel
  rationale: A escolha conserva a forma masculina plural e a expressão pactual do hebraico sem excluir o sentido coletivo.
- issue: Como representar a imagem de seguir outros deuses
  choice: “inclinarão o coração de vocês para os deuses delas”
  alternative: “desviarão o coração de vocês para seguir os deuses delas”
  rationale: A opção escolhida mantém a metáfora hebraica de inclinar o coração e evita acrescentar explicitamente o verbo “seguir”, embora essa ideia esteja implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa plural. A sintaxe preserva o caráter de continuação do versículo anterior. A formulação evita linguagem denominacional e mantém a tensão entre a expressão literal ampla e seu sentido matrimonial no contexto.
