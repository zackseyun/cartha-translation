    issue: «para que queira ir» traduz inadequadamente וְהִנְּךָ מְבַקֵּשׁ.
    rationale: Em português, «para que» introduz normalmente propósito; o hebraico apresenta o fato de que Hadade busca/deseja partir. A redação revisada evita essa mudança de relação sintática e semântica.
  - severity: medium
    issue: A nota define o hebraico שַׁלֵּחַ תְּשַׁלְּחֵנִי como «deixar ir».
    rationale: O radical שלח significa primariamente «enviar/mandar embora». «Deixe-me ir» é uma tradução contextual aceitável, mas a glosa da nota deve refletir o verbo-fonte.
