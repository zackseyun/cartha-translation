base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: pt
  text: 'Então Faraó lhe disse: “Mas o que lhe falta comigo, se você quer ir para a sua terra?” Ele respondeu: “Nada; mas, por favor, deixe-me ir[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “certamente me mandarás embora”; construção enfática que combina o infinitivo absoluto com uma forma finita do mesmo verbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mas
  rationale: Na pergunta de Faraó, introduz uma reação levemente adversativa ao pedido de Hadade e soa natural no diálogo.
- source_word: מָה אַתָּה חָסֵר עִמִּי
  choice: o que lhe falta ao meu lado
  rationale: Expressa a ideia de carecer de algo enquanto se está com Faraó, evitando o pouco natural ‘o que lhe falta comigo’.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: para que queira
  rationale: Comunica de modo idiomático a atenção dada ao desejo presente de Hadade, sem acrescentar um advérbio temporal ausente do texto.
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: ir para a sua terra
  rationale: Mantém o verbo simples ‘ir’ e o sufixo possessivo, sem explicitar ‘voltar’, embora o contexto permita essa inferência.
- source_word: לֹא
  choice: Nada
  rationale: A resposta negativa é elíptica; ‘Nada’ explicita naturalmente que Hadade não sente falta de coisa alguma.
- source_word: כִּי
  choice: mas
  rationale: Introduz o ponto principal do pedido em contraste com a resposta ‘Nada’.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: por favor, deixe-me ir
  rationale: Transmite como pedido enfático e idiomático a construção hebraica intensiva formada pelo infinitivo absoluto e pelo verbo finito.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Ao meu lado’ preserva o sentido relacional de עִמִּי em formulação natural; ‘queira’ evita o artificial ‘esteja buscando’ sem apagar o desejo expresso por מְבַקֵּשׁ.
