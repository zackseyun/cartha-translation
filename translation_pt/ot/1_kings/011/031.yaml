  source_fidelity: 'A tradução preserva todos os elementos relevantes do hebraico: o imperativo com a nuance pessoal («Tome para você»), os dez pedaços, a fórmula profética, o nome Yahweh, «o Deus de Israel», a chamada de atenção, a ação vívida de retirar o reino da esfera de poder de Salomão e a concessão de dez tribos a Jeroboão. «Estou arrancando» comunica adequadamente tanto a remoção quanto a força imagética de קֹרֵעַ, sem converter indevidamente o particípio em futuro simples.'
