source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: pt
  text: 'E ele disse a Jeroboão: “Tome para você dez pedaços[a], pois assim diz Yahweh, o Deus de Israel: ‘Veja, estou arrancando o reino da mão de Salomão e darei a você dez tribos’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dez pedaços rasgados”. O substantivo hebraico se refere a pedaços produzidos ao rasgar, ligando as palavras à ação simbólica de Aías com a veste.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: Tome para você
  rationale: Preserva tanto o imperativo קַח quanto a nuance pessoal de לְךָ, em português natural e digno.
- source_word: קְרָעִים
  choice: pedaços
  rationale: O substantivo, derivado de קרע, designa os pedaços resultantes de rasgar a veste. “Pedaços” é natural no texto principal, enquanto a ligação explícita com o ato de rasgar é indicada na nota.
- source_word: כִּי כֹה אָמַר
  choice: pois assim diz
  rationale: Mantém de modo conciso e reconhecível a fórmula profética hebraica, sem prejudicar a compreensão em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente a construção que identifica Yahweh como o Deus de Israel.
- source_word: הִנְנִי
  choice: Veja, estou
  rationale: “Veja” funciona como chamada de atenção atual e preserva a vivacidade de הִנְנִי sem recorrer ao mais arcaizante “eis que”.
- source_word: קֹרֵעַ
  choice: estou arrancando
  rationale: O particípio apresenta a ação profética de maneira vívida. “Arrancando” comunica tanto a imagem de rasgar quanto a remoção do reino do poder de Salomão.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: Equivalente direto e suficiente para o domínio político referido.
- source_word: מִיַּד שְׁלֹמֹה
  choice: da mão de Salomão
  rationale: Conserva a imagem hebraica da mão como poder ou posse, ainda inteligível em português.
- source_word: וְנָתַתִּי לְךָ
  choice: e darei a você
  rationale: Expressa de forma natural o verbo com seu objeto indireto e mantém explícito o destinatário.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: dez tribos
  rationale: Após numeral, o português normalmente dispensa o artigo; a expressão identifica as dez unidades tribais destinadas a Jeroboão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar outra forma tradicional de transliteração.
- issue: Aspecto da ação divina em קֹרֵעַ
  choice: estou arrancando
  alternative: arrancarei; estou prestes a arrancar
  rationale: A forma participial permite uma apresentação vívida ou iminente. A tradução escolhida preserva essa tensão sem reduzi-la silenciosamente a um futuro simples.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno sem arcaísmos marcados; “Tome” e “Veja” mantêm solenidade e clareza. O marcador da nota foi colocado imediatamente após a expressão a que se refere.
