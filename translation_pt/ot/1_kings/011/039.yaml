  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: pt
  text: E afligirei a descendência de Davi por causa disso, mas não para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: afligirei
  rationale: O piel de ענה expressa aqui a imposição de aflição ou humilhação. “Afligirei” se ajusta ao contexto de juízo sem especificar em excesso a natureza do sofrimento.
- source_word: זֶרַע דָּוִד
  choice: a descendência de Davi
  rationale: זֶרַע é um singular coletivo. “Descendência” preserva o caráter coletivo e soa natural em português, ao contrário do literal “semente”.
- source_word: לְמַעַן זֹאת
  choice: por causa disso
  rationale: A expressão indica a causa do juízo e remete ao que foi dito anteriormente. Esta formulação é clara e próxima do hebraico.
- source_word: אַךְ
  choice: mas
  rationale: Aqui a partícula introduz uma limitação adversativa ao juízo anunciado; “mas” é a ligação mais natural em português.
- source_word: לֹא כָל הַיָּמִים
  choice: não para sempre
  rationale: Embora a expressão signifique literalmente “não todos os dias”, seu sentido idiomático é que a aflição não será perpétua. “Não para sempre” comunica esse limite com naturalidade e precisão.
theological_decisions:
- issue: Duração do juízo sobre a linhagem de Davi
  choice: O juízo é limitado e não durará para sempre.
  alternative: Traduzir mais literalmente como “não todos os dias”.
  rationale: O hebraico limita explicitamente a duração da aflição. A tradução mantém a tensão entre um juízo real e seu caráter não permanente, sem acrescentar ao versículo uma explicação teológica externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução privilegia naturalidade sem perder o sentido coletivo de זֶרַע nem o limite explícito imposto à duração do juízo.
