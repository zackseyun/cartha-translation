  verdict: revise
  source_fidelity: A tradução transmite corretamente a relação familiar, o desmame e a inserção de Genubate na casa real. Contudo, «vivia» torna mais explícita uma permanência contínua que o simples וַיְהִי («estava/era») não requer; «estava» reproduz melhor a formulação hebraica sem perda de naturalidade.
  naturalness: «Lhe deu à luz seu filho Genubate» é compreensível, mas a combinação de «lhe» com «seu» cria uma referência possessiva menos nítida em português. «Lhe deu à luz um filho, Genubate» é idiomático e deixa clara a relação por meio do dativo.
  terminology: «Tafnes», «Genubate», «desmamou», «casa do faraó» e «filhos do faraó» são adequados. A repetição de «casa do faraó» preserva de modo apropriado a repetição do hebraico.
  issues:
