  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: pt
  text: A irmã de Tafnes lhe deu à luz um filho, Genubate[a], e Tafnes o desmamou na casa do faraó[b]. Genubate estava na casa do faraó, entre os filhos do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “A irmã de Tafnes lhe deu à luz Genubate, seu filho”. A ordem das palavras no hebraico permite as duas formulações, sem mudança de sentido.'
    reason: lexical_alternative
  - marker: b
    text: “Desmamou” indica que ela cuidou da criança até que deixasse de mamar.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לֹו
  choice: lhe deu à luz
  rationale: 'Expressa naturalmente em português o verbo ילד com o dativo לֹו: a irmã de Tafnes deu um filho a Hadade.'
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: A irmã de Tafnes
  rationale: Reproduz diretamente a relação de construção hebraica em linguagem narrativa clara.
- source_word: גְּנֻבַת
  choice: Genubate
  rationale: Transliteração portuguesa tradicional e legível do nome próprio hebraico.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Mantém a relação filial explicitada pelo sufixo hebraico, cujo referente contextual é Hadade.
- source_word: וַתִּגְמְלֵהוּ
  choice: o desmamou
  rationale: O verbo גמל, neste contexto e nessa forma, designa levar a criança ao desmame.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: na casa do faraó
  rationale: Conserva a imagem hebraica de 'casa', que pode abranger tanto o palácio quanto a família ou corte real.
- source_word: וַיְהִי
  choice: vivia
  rationale: No resumo narrativo, comunica de modo natural a presença continuada de Genubate na casa real, sem acrescentar mudança de estado.
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: entre os filhos do faraó
  rationale: Preserva o masculino plural בְּנֵי e a posição de Genubate no convívio dos filhos reais.
