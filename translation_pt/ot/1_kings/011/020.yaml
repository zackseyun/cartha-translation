    issue: Ambiguidade estilística em «lhe deu à luz seu filho Genubate».
    rationale: O possessivo «seu» pode ter antecedente menos imediatamente claro em português. A construção com «um filho, Genubate» expressa naturalmente o valor do dativo hebraico e identifica o menino.
  - severity: low
    issue: «Genubate vivia» é mais interpretativo que o verbo hebraico היה.
    rationale: No contexto, וַיְהִי afirma a presença/situação de Genubate na casa do faraó. «Estava» é mais próximo e não acrescenta a noção de residência duradoura.
