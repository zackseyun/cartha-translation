  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: pt
  text: Salomão seguiu Astorete[a], a deusa dos sidônios[b], e Milcom[c], a abominação dos amonitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Astarte”, forma mais amplamente conhecida do nome dessa divindade.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “deus(es) dos sidônios”; como o nome Astorete designa uma divindade feminina, o sentido aqui é “a deusa dos sidônios”.'
    reason: lexical_alternative
  - marker: c
    text: Alguns associam Milcom a Moloque, mas o texto hebraico aqui diz “Milcom”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: seguiu
  rationale: Neste contexto, a expressão idiomática hebraica indica adesão ou lealdade religiosa, não mero deslocamento físico. “Seguiu” preserva a formulação do texto sem explicitar além dele “adorou”.
- source_word: עַשְׁתֹּרֶת
  choice: Astorete
  rationale: Translitera a forma hebraica do nome de modo consagrado e reconhecível em português; “Astarte” é preservado em nota como forma alternativa amplamente conhecida.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: a deusa dos sidônios
  rationale: Embora אֱלֹהֵי tenha forma de plural construto e possa ser vertido formalmente como “deus/deuses de”, aqui está em aposição ao nome singular de uma divindade feminina. “A deusa” comunica naturalmente o referente em português, enquanto a peculiaridade formal do hebraico é registrada em nota.
- source_word: מִלְכֹּם
  choice: Milcom
  rationale: O texto consonantal deste versículo traz Milcom. A possível associação com Moloque não justifica substituir o nome no texto principal.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: a abominação dos amonitas
  rationale: שִׁקֻּץ é um termo fortemente pejorativo para algo detestável, muitas vezes um ídolo. “Abominação” conserva o peso avaliativo e a formulação compacta do hebraico.
theological_decisions:
- issue: Se a ação de Salomão deve ser explicitada como adoração idólatra
  choice: seguiu
  alternative: adorou
  rationale: O contexto caracteriza apostasia, mas o versículo emprega a expressão “ir/andar atrás de”. “Seguiu” comunica lealdade religiosa sem substituir a expressão do texto por uma explicação.
- issue: Como representar o gênero de אֱלֹהֵי em aposição a Astorete
  choice: a deusa dos sidônios
  alternative: o deus dos sidônios
  rationale: Astorete é uma divindade feminina, e a aposição identifica essa figura singular. A tradução por “deusa” torna o referente claro, enquanto a forma incomum do hebraico permanece documentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém os gentílicos tradicionais “sidônios” e “amonitas”, translitera os nomes próprios segundo formas reconhecíveis em português e conserva a linguagem avaliativa forte do original.
