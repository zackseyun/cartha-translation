id: 1KI.11.9
reference: 1 Kings 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: pt
  text: Yahweh ficou irado com Salomão, porque o coração dele havia se afastado de Yahweh, o Deus de Israel, que lhe havia aparecido duas vezes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: ficou irado
  rationale: O verbo expressa o surgimento ou a manifestação da ira. “Ficou irado” preserva essa força verbal em português natural, sem intensificá-la para além do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בִּשְׁלֹמֹה
  choice: com Salomão
  rationale: Com um verbo de ira, a preposição בְּ indica a pessoa contra quem a ira se dirige; “irado com Salomão” é a formulação idiomática em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a causa da ira de Yahweh.
- source_word: נָטָה לְבָבוֹ
  choice: o coração dele havia se afastado
  rationale: Mantém a linguagem hebraica do coração e comunica de modo natural a mudança de lealdade. O mais-que-perfeito situa esse afastamento antes da ira narrada.
- source_word: מֵעִם
  choice: de
  rationale: Marca separação relacional; o sentido de afastamento já está presente no verbo, evitando redundância.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e transparente da construção hebraica, preservando a identificação pactual.
- source_word: הַנִּרְאָה אֵלָיו
  choice: que lhe havia aparecido
  rationale: O particípio com artigo funciona como oração relativa referente a Yahweh. O mais-que-perfeito aponta naturalmente para aparições anteriores.
- source_word: פַּעֲמָיִם
  choice: duas vezes
  rationale: Equivalente idiomático do dual hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
- issue: Linguagem da ira divina
  choice: ficou irado
  alternative: irou-se; ficou indignado
  rationale: Preserva a atribuição explícita de ira a Yahweh e o aspecto ingressivo ou manifestativo do verbo, sem suavizar nem exagerar a expressão.
- issue: Referente da oração הַנִּרְאָה אֵלָיו
  choice: Yahweh, o Deus de Israel, é quem havia aparecido a Salomão
  alternative: Tratar a expressão apenas como referência distante a “Deus”
  rationale: A oração relativa concorda com o referente divino da expressão precedente; em português, “que” preserva naturalmente essa referência sem acrescentar interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O coração dele” evita a possível ambiguidade de “seu coração”, enquanto mantém a imagem antropológica do hebraico. Não são necessárias notas de rodapé neste versículo.
