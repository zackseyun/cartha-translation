  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: pt
  text: Quando Salomão envelheceu, suas esposas fizeram seu coração voltar-se para outros deuses, e seu coração não era plenamente dedicado a Yahweh, seu Deus,[a] como o coração de Davi, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu coração não era inteiro para com Yahweh, seu Deus”. O hebraico descreve literalmente um coração “inteiro” com Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: Quando Salomão envelheceu
  rationale: Expressa de modo idiomático a circunstância temporal do hebraico, literalmente “no tempo da velhice de Salomão”.
- source_word: נָשָׁיו
  choice: suas mulheres
  rationale: No contexto, refere-se às mulheres de Salomão, isto é, suas esposas; “suas mulheres” é natural em português e mantém a referência direta do texto.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: fizeram seu coração voltar-se
  rationale: Preserva a construção causativa e a imagem hebraica do coração que é levado a mudar de direção, sem intensificá-la para “desviaram” ou “corromperam”.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: para outros deuses
  rationale: Comunica naturalmente em português a orientação do coração para seguir outros deuses; evita reduzir a expressão a deuses meramente estrangeiros.
- source_word: לְבָבוֹ
  choice: seu coração
  rationale: Mantém a linguagem antropológica bíblica, na qual o coração abrange vontade, pensamento e lealdade.
- source_word: שָׁלֵם עִם
  choice: plenamente dedicado a
  rationale: Traduz de forma clara e natural a ideia de inteireza e lealdade não dividida na relação com Deus, enquanto a nota registra a imagem hebraica literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: como o coração de Davi, seu pai
  rationale: Mantém explicitamente a comparação entre os corações, conforme o hebraico, e não apenas entre Salomão e Davi.
theological_decisions:
- issue: A inteireza do coração de Salomão perante Yahweh
  choice: plenamente dedicado a Yahweh
  alternative: inteiro para com Yahweh
  rationale: A opção principal comunica em português corrente a lealdade integral da expressão שָׁלֵם עִם. A nota conserva a metáfora de um coração “inteiro”, sem definir essa lealdade segundo uma formulação denominacional.
- issue: Referência a אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  alternative: deuses estrangeiros
  rationale: “Outros deuses” corresponde diretamente à expressão hebraica e preserva o foco teológico na idolatria, sem transformá-lo numa categoria étnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a imagem repetida do coração e usa “Yahweh” para o nome divino. A nota foi colocada junto à expressão que esclarece.
