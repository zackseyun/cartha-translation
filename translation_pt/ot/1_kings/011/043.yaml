base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: pt
  text: Salomão descansou com seus antepassados[a] e foi sepultado na Cidade de Davi, seu pai. E Roboão, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deitou-se com seus pais”, expressão tradicional que indica a morte e a reunião com os antepassados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão hebraica é uma fórmula tradicional para a morte e a união do falecido aos seus ancestrais. “Descansou” preserva o eufemismo sem a estranheza que “dormiu com seus pais” teria no português atual; “antepassados” comunica claramente o sentido genealógico de אֲבֹתָיו.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: O nifal tem sentido passivo neste contexto. “Foi sepultado” é natural, digno e adequado à fórmula régia.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: na Cidade de Davi, seu pai
  rationale: Mantém tanto o local tradicionalmente designado “Cidade de Davi” quanto a identificação explícita de Davi como pai de Salomão, preservando a ênfase dinástica.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: É a tradução concisa e convencional do verbo em relatos de sucessão real, sem restringir o sentido apenas ao momento da entronização.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa a substituição sucessória indicada pelo hebraico com mais precisão do que a formulação meramente temporal “depois dele”.
