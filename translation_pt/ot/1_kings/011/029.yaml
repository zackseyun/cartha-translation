  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: pt
  text: Naquele tempo, quando Jeroboão saiu de Jerusalém, o profeta Aías, o silonita, encontrou-o pelo caminho. Ele[a] estava envolto num manto novo, e os dois estavam sozinhos no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas “ele”; provavelmente se refere a Aías, embora também possa ser entendido como referência a Jeroboão.
    reason: ambiguity
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: A fórmula narrativa introduz a cena e seu enquadramento temporal. A forma escolhida é natural em português e evita a rigidez de “E aconteceu naquele tempo” sem perder o sentido.
- source_word: יָצָא מִירוּשָׁלָם
  choice: saiu de Jerusalém
  rationale: Traduz diretamente o movimento expresso por יָצָא e soa corrente em português.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: encontrou-o
  rationale: מָצָא pode significar “achar” ou “encontrar”; neste contexto de encontro no caminho, “encontrou-o” é preciso e idiomático.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: o profeta Aías, o silonita
  rationale: Preserva tanto a identificação profética quanto o gentílico referente a Siló, em ordem natural no português.
- source_word: בַּדֶּרֶךְ
  choice: pelo caminho
  rationale: Expressa naturalmente o local do encontro; “na estrada” seria possível, mas tornaria o cenário mais específico do que o hebraico exige.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: Ele estava envolto
  rationale: O particípio descreve uma condição em curso ou estado de vestimenta. O pronome mantém a ambiguidade do antecedente presente no hebraico.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: num manto novo
  rationale: שַׂלְמָה designa uma peça exterior de roupa. “Manto” é claro, digno e adequado ao objeto rasgado simbolicamente no versículo seguinte.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: os dois estavam sozinhos
  rationale: Reproduz com concisão a ênfase de que não havia outras pessoas com eles.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Mantém o sentido básico de שָׂדֶה sem acrescentar “aberto”, ideia contextual possível, mas não lexicalmente explícita.
theological_decisions:
- issue: Referente do pronome em וְהוּא מִתְכַּסֶּה
  choice: Manter “Ele” no texto e registrar a ambiguidade em nota
  alternative: Explicitar “Aías estava envolto” ou “Jeroboão estava envolto”
  rationale: O hebraico usa apenas o pronome masculino singular. Aías é o referente mais próximo e provavelmente o portador do manto nos versículos seguintes, mas o versículo isolado não elimina formalmente a possibilidade de referência a Jeroboão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A construção evita literalismo excessivo, preserva a ambiguidade pronominal do hebraico e não acrescenta a qualificação interpretativa “aberto” a “campo”.
