  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: pt
  text: E Deus levantou contra ele um adversário[a], Rezom, filho de Eliada, que havia fugido de seu senhor Hadadezer, rei de Zobá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico satan; aqui, um substantivo comum que significa “adversário” ou “oponente”, e não o nome próprio Satanás.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: levantou
  rationale: O hifil de קום indica que Deus fez surgir alguém no cenário; “levantou” é natural em português e preserva a ação divina sem especificar além do hebraico como isso ocorreu.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto narrativo, o termo se refere ao Deus de Israel.
- source_word: לוֹ
  choice: contra ele
  rationale: Embora לֹו seja literalmente “para ele”, junto de “levantou” e “adversário” expressa a relação hostil com Salomão. “Contra ele” torna essa força contextual clara e natural em português.
- source_word: שָׂטָן
  choice: um adversário
  rationale: Aqui é substantivo comum que designa um oponente humano e político, não o nome próprio Satanás.
- source_word: רְזוֹן
  choice: Rezom
  rationale: Transliteração portuguesa corrente do nome hebraico, com -m final para representar o nun final sem sugerir pronúncia inglesa.
- source_word: בֶּן אֶלְיָדָע
  choice: filho de Eliada
  rationale: Tradução direta da construção filial, com transliteração do nome próprio.
- source_word: אֲשֶׁר בָּרַח
  choice: que havia fugido
  rationale: O mais-que-perfeito composto expressa naturalmente a ação anterior que serve de pano de fundo ao surgimento de Rezom como adversário.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: de seu senhor Hadadezer
  rationale: מֵאֵת marca afastamento de uma pessoa. A colocação de אֲדֹנָיו junto ao nome em português esclarece naturalmente que Hadadezer era o senhor de Rezom, sem alterar a relação sintática.
- source_word: מֶלֶךְ צוֹבָה
  choice: rei de Zobá
  rationale: Tradução direta da cadeia construta, usando a forma portuguesa tradicional e legível do topônimo.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: No contexto político e servil, “senhor” comunica autoridade pessoal. A referência é Hadadezer, e não Deus.
theological_decisions:
- issue: Sentido de שָׂטָן no contexto
  choice: substantivo comum “adversário”
  alternative: nome próprio “Satanás”
  rationale: O próprio versículo identifica o adversário como o ser humano Rezom, filho de Eliada. Traduzir como nome próprio introduziria uma identificação demonológica ausente do texto.
- issue: Agência divina no surgimento do adversário
  choice: “Deus levantou”
  alternative: “Deus permitiu que surgisse”
  rationale: O hifil atribui diretamente a Deus a ação de fazer surgir o adversário. A tradução mantém essa tensão teológica e não a atenua com linguagem meramente permissiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada em “de seu senhor Hadadezer, rei de Zobá” para evitar a ambiguidade pouco natural de uma aposição final, preservando todo o conteúdo do hebraico.
