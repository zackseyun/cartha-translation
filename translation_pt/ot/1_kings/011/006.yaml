  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: pt
  text: Salomão fez o que era mau aos olhos de Yahweh e não seguiu Yahweh plenamente[a], como Davi, seu pai, o fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não foi inteiramente fiel a Yahweh” ou “não seguiu Yahweh completamente”. O idioma hebraico expressa lealdade ou obediência incompleta.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה introduz a conduta de Salomão; “fez” é a forma natural no português para a construção “fez o que era mau”.
- source_word: הָרַע
  choice: o que era mau
  rationale: O adjetivo com artigo tem função substantiva. Esta formulação comunica uma avaliação moral, não apenas algo de má qualidade ou uma desventura.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora avaliativa hebraica em uma expressão clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִלֵּא אַחֲרֵי
  choice: seguiu ... plenamente
  rationale: O idioma hebraico indica seguir com inteireza ou lealdade completa. A formulação conserva a ideia de seguimento incompleto sem a restringir apenas a um estado interior.
- source_word: כְּדָוִד אָבִיו
  choice: como Davi, seu pai
  rationale: Mantém de modo natural a comparação com Davi como pai de Salomão e exemplo implícito de fidelidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança em transliteração.
- issue: Grau do fracasso de Salomão em מִלֵּא אַחֲרֵי יְהוָה
  choice: não seguiu Yahweh plenamente
  alternative: não foi inteiramente dedicado a Yahweh; não foi completamente após Yahweh
  rationale: A expressão ressalta que o seguimento de Salomão não foi completo. Evita transformar esta oração, por si só, numa afirmação mais forte de apostasia absoluta ou limitar seu sentido à devoção interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “seguiu Yahweh plenamente” soa natural e conserva o alcance do idioma hebraico. A marca da nota foi colocada junto à expressão que ela esclarece.
