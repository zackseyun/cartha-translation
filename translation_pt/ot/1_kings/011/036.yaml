base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: pt
  text: Mas ao filho dele darei uma tribo, para que Davi, meu servo, tenha sempre uma lâmpada[a] diante de mim em Jerusalém, a cidade que escolhi para mim, a fim de pôr ali o meu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «luz». O hebraico «lâmpada» é uma metáfora para a continuidade da linhagem davídica ou da presença real duradoura.
    reason: Alternativa lexical e esclarecimento da metáfora de נִיר, ancorados no termo correto.
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: Mas ao filho dele
  rationale: O waw assume valor adversativo no contexto da divisão do reino; “dele” retoma Salomão sem inserir o nome interpretativamente.
- source_word: שֵׁבֶט אֶחָד
  choice: uma tribo
  rationale: No contexto, שֵׁבֶט designa uma unidade tribal e política, não um cetro.
- source_word: לְמַעַן הֱיוֹת
  choice: para que ... tenha
  rationale: Expressa naturalmente a finalidade da concessão, preservando a força da construção hebraica.
- source_word: נִיר
  choice: lâmpada
  rationale: Mantém a metáfora concreta da continuidade da linhagem ou presença real davídica, sem reduzi-la à explicação.
- source_word: לְדָוִיד עַבְדִּי
  choice: Davi, meu servo
  rationale: Reproduz com naturalidade e dignidade a identificação honorífica e a relação possessiva.
- source_word: כָּל הַיָּמִים
  choice: sempre
  rationale: Transmite de modo conciso o sentido idiomático de continuidade ao longo do tempo.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Preserva a imagem espacial e relacional do hebraico, inclusive suas possíveis ressonâncias pactuais.
- source_word: בָּחַרְתִּי לִי
  choice: escolhi para mim
  rationale: Conserva o dativo reflexivo לִי, importante para indicar a escolha da cidade por Deus para si mesmo.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: a fim de pôr ali o meu nome
  rationale: Mantém a fórmula teológica do “nome” sem convertê-la em uma explicação sobre presença ou culto.
theological_decisions:
- issue: Metáfora dinástica em נִיר
  choice: “lâmpada” como metáfora não explicada no texto principal
  alternative: “luz” ou uma paráfrase como “descendente no trono”
  rationale: “Lâmpada” conserva a imagem hebraica e a tensão entre linhagem, reinado e presença contínua de Davi diante de Deus.
- issue: Teologia do nome divino em לָשׂוּם שְׁמִי שָׁם
  choice: “pôr ali o meu nome”
  alternative: “estabelecer ali a minha presença” ou “ser adorado ali”
  rationale: A fórmula do nome é teologicamente significativa e não deve ser reduzida a uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Davi, meu servo” é natural em português e próxima da estrutura hebraica. Não se acrescentou nota, pois o texto-fonte fornecido marca indevidamente “tribo” enquanto a nota inglesa explica “lâmpada”; uma nota assim violaria a correspondência exigida entre marcador e conteúdo.
