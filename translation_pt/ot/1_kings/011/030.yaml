  text: וַ/יִּתְפֹּ֣שׂ אֲחִיָּ֔ה בַּ/שַּׂלְמָ֥ה הַ/חֲדָשָׁ֖ה אֲשֶׁ֣ר עָלָ֑י/ו וַ/יִּ֨קְרָעֶ֔/הָ שְׁנֵ֥ים עָשָׂ֖ר קְרָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/030.yaml
  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: pt
  text: Então Aías pegou o manto novo que estava sobre ele[a] e o rasgou em doze pedaços.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ele estava vestindo”. O hebraico diz literalmente “que estava sobre ele” e não deixa explícito se o manto estava sobre Aías ou sobre Jeroboão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: pegou
  rationale: Expressa de modo natural o ato concreto de tomar o manto, sem sugerir necessariamente a violência que “agarrou” poderia transmitir.
- source_word: שַׂלְמָה
  choice: manto
  rationale: Designa uma veste exterior e se ajusta ao contexto narrativo em que a peça é rasgada simbolicamente.
- source_word: הַחֲדָשָׁה
  choice: novo
  rationale: Reproduz diretamente o adjetivo hebraico e preserva um detalhe significativo da narrativa.
- source_word: אֲשֶׁר עָלָיו
  choice: que estava sobre ele
  rationale: Mantém a formulação concreta e a ambiguidade referencial do hebraico, sem decidir explicitamente quem vestia o manto.
- source_word: וַיִּקְרָעֶהָ
  choice: e o rasgou
  rationale: Representa diretamente o verbo de rasgar e o sufixo pronominal feminino que retoma a veste.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: em doze pedaços
  rationale: Comunica em português corrente o resultado da ação, preservando o número e sua força simbólica.
