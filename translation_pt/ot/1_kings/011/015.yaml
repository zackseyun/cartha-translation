base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: pt
  text: Aconteceu[a] que, quando Davi estava em Edom[b], Joabe, comandante do exército, subiu para sepultar os mortos em combate e matou todos os do sexo masculino em Edom —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “E aconteceu”. O hebraico emprega uma fórmula narrativa comum para introduzir uma explicação de fundo.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “quando Davi estava com Edom”. No contexto, a expressão parece referir-se à presença ou à campanha de Davi em relação a Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu
  rationale: Fórmula narrativa comum que introduz uma explicação de fundo. Em português, “Aconteceu que” conserva sua função sem produzir uma ligação artificial.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: quando Davi estava em Edom
  rationale: A construção com infinitivo estabelece uma oração temporal. Embora אֶת torne a expressão incomum e permita entender uma relação de presença ou campanha com respeito a Edom, “estava em Edom” comunica naturalmente o cenário militar sem definir além do necessário a natureza da ação.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: Joabe ... subiu
  rationale: O infinitivo temporal descreve a subida de Joabe dentro da situação passada. O pretérito perfeito é natural em português e não exige uma forma composta.
- source_word: שַׂר הַצָּבָא
  choice: comandante do exército
  rationale: Título militar claro, atual e equivalente à função oficial indicada pelo hebraico.
- source_word: לְקַבֵּר
  choice: para sepultar
  rationale: O infinitivo com לְ expressa a finalidade da subida de Joabe.
- source_word: הַחֲלָלִים
  choice: os mortos em combate
  rationale: O substantivo designa mortos por violência, especialmente em batalha. A expressão preserva essa nuance melhor do que o termo geral “mortos”.
- source_word: וַיַּךְ
  choice: matou
  rationale: Neste contexto militar, נכה indica um golpe letal. “Matou” torna explícito o sentido contextual sem recorrer ao arcaico “feriu de morte”.
- source_word: כָּל זָכָר
  choice: todos os do sexo masculino
  rationale: זָכָר especifica sexo masculino, não apenas homens adultos. A formulação mantém a abrangência severa da afirmação hebraica.
- source_word: בֶּאֱדוֹם
  choice: em Edom
  rationale: Tradução locativa direta da preposição בְּ, sem ampliar o alcance para “por todo Edom”.
theological_decisions:
- issue: Relato de violência militar extrema
  choice: Manter a afirmação direta de que foram mortos todos os do sexo masculino em Edom
  alternative: Atenuar para “derrotou os edomitas” ou ampliar para uma explicação de extermínio total
  rationale: O texto relata violência grave de maneira direta. A tradução não deve suavizar o hebraico nem acrescentar uma interpretação que o versículo não formula.
- issue: Sujeito de וַיַּךְ
  choice: Vincular a ação a Joabe na sintaxe portuguesa
  alternative: Usar “ele matou”, deixando o pronome formalmente aberto entre Davi e Joabe
  rationale: Joabe é o sujeito expresso mais próximo, e a continuação imediata em 1 Reis 11:16 confirma seu papel na campanha. A coordenação verbal produz português claro sem introduzir uma identificação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva o travessão final porque o período e a explicação prosseguem no versículo seguinte.
