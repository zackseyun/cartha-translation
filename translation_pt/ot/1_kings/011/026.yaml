translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões preservam a informação parentética sobre a mãe de Jeroboão; o ponto e vírgula evita uma coordenação excessivamente longa. Todos os marcadores de nota aparecem no texto principal.
