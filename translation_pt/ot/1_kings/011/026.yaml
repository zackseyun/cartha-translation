base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: pt
  text: Jeroboão, filho de Nebate, efraimita[a] de Zeredá, cuja mãe se chamava Zerua e era viúva, era servo de Salomão e levantou a mão contra o rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “efratita”; aqui, porém, o sentido mais provável é “efraimita”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “rebelou-se contra o rei”. Hebraico: “levantou a mão contra o rei”.'
    reason: idiom_clarification
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: efraimita
  rationale: Neste contexto de Reis, o termo provavelmente indica a origem tribal de Jeroboão em Efraim. A possibilidade formal de referência a Efrata é preservada em nota.
- source_word: הַצְּרֵדָה
  choice: Zeredá
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: צְרוּעָה
  choice: Zerua
  rationale: O nome próprio é transliterado de modo natural em português.
- source_word: אִשָּׁה אַלְמָנָה
  choice: era viúva
  rationale: O hebraico diz literalmente 'uma mulher viúva'; em português atual, 'era viúva' comunica naturalmente os dois elementos sem redundância artificial.
- source_word: עֶבֶד
  choice: servo
  rationale: O termo pode designar escravo, servo ou subordinado real. Aqui, o contexto administrativo da corte favorece 'servo', sem especificar além do texto a natureza exata da condição.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: ele se levantou contra o rei
  rationale: A expressão idiomática significa agir em oposição ou rebelião contra o rei. 'Levantou-se contra' conserva parte da imagem e soa natural em português; a formulação literal é indicada em nota.
- source_word: וְ
  choice: coordenação sem palavra inicial explícita
  rationale: O waw introduz o novo personagem no fluxo narrativo. Em português, não é necessário acrescentar 'Ora' ou 'Então'.
