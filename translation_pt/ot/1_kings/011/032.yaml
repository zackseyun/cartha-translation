source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: pt
  text: Mas uma tribo ficará com ele[a], por causa do meu servo Davi e por causa de Jerusalém, a cidade que escolhi dentre todas as tribos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “uma tribo”. Muitas vezes se entende que Benjamim está incluído com Judá, especialmente por causa da localização de Jerusalém, mas o próprio texto diz “uma tribo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: Mas uma tribo
  rationale: שֵׁבֶט designa aqui uma unidade tribal, e a conjunção introduz contraste com a divisão do reino mencionada no contexto.
- source_word: יִהְיֶה לּוֹ
  choice: ficará com ele
  rationale: A expressão hebraica literalmente significa 'será para ele'; no contexto, indica que essa tribo continuará sob seu domínio. A formulação mantém a referência pronominal ambígua como no hebraico.
- source_word: לְמַעַן
  choice: por causa de
  rationale: Expressa o motivo da preservação dessa tribo, fundamentado na consideração por Davi e por Jerusalém.
- source_word: עַבְדִּי דָוִד
  choice: meu servo Davi
  rationale: Preserva a designação régia e pactual natural no contexto.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: Jerusalém, a cidade
  rationale: A vírgula representa com clareza a construção apositiva hebraica.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: que escolhi
  rationale: O perfeito hebraico apresenta a escolha divina como ato realizado; em português, o pretérito perfeito é natural e suficiente. O pronome locativo é incorporado idiomaticamente ao verbo escolher.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dentre todas as tribos de Israel
  rationale: A preposição com בחר indica seleção no interior de um conjunto; 'dentre' expressa isso de modo claro e conciso.
theological_decisions:
- issue: Tensão numérica entre 'uma tribo' e passagens que associam Judá e Benjamim sob Roboão
  choice: Traduzir literalmente o hebraico como 'uma tribo'
  alternative: Interpretar a expressão como referência ao reino de Judá, incluindo Benjamim, ou harmonizá-la como 'duas tribos'
  rationale: O texto hebraico declara explicitamente 'uma tribo'. A tradução preserva essa formulação e deixa a explicação histórica ou interpretativa para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Ficará com ele' comunica posse continuada sem tornar explícito além do texto o referente do pronome.
