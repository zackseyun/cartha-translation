  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: pt
  text: Ele tinha setecentas esposas, princesas[a], e trezentas concubinas; e suas esposas desviaram o coração dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulheres de alta posição”.
    reason: Alternativa lexical para שָׂרוֹת, que pode designar princesas, nobres ou mulheres de posição elevada.
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ele tinha
  rationale: A construção hebraica היה + ל expressa posse; “ele tinha” é a forma natural e direta em português.
- source_word: נָשִׁים
  choice: esposas
  rationale: No contexto dos casamentos reais de Salomão, o termo designa esposas, não simplesmente mulheres.
- source_word: שָׂרוֹת
  choice: princesas
  rationale: O termo indica mulheres de posição elevada; “princesas” se ajusta ao contexto de casamentos reais e preserva a leitura tradicional, sem excluir a acepção mais ampla registrada na nota.
- source_word: שְׁבַע מֵאוֹת
  choice: setecentas
  rationale: Tradução direta do numeral, com concordância de gênero em português.
- source_word: וּפִלַגְשִׁים
  choice: e trezentas concubinas
  rationale: “Concubinas” é o equivalente convencional para parceiras reconhecidas de condição conjugal inferior; a conjunção e o número são integrados naturalmente à frase.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: trezentas
  rationale: Tradução direta do numeral, com concordância de gênero em português.
- source_word: וַיַּטּוּ
  choice: desviaram
  rationale: O verbo נטה comunica mudança de direção; neste contexto, “desviaram” expressa o afastamento moral e religioso sem acrescentar explicitamente um complemento ausente neste versículo.
- source_word: נָשָׁיו
  choice: suas esposas
  rationale: Retoma especificamente as esposas e conserva a ênfase narrativa do hebraico.
- source_word: אֶת לִבּוֹ
  choice: o coração dele
  rationale: “Coração” preserva o rico sentido hebraico de interioridade, vontade e lealdade; “dele” evita a possível ambiguidade de “seu” em português.
theological_decisions:
- issue: Sentido de “o coração dele” no contexto
  choice: Preservar “coração” como referência ao centro da vontade, lealdade e devoção de Salomão.
  alternative: Entender a expressão apenas como mudança emocional ou afetiva.
  rationale: Na antropologia hebraica, o coração abrange pensamento, vontade e lealdade, não apenas emoções. A tradução mantém a formulação concreta e sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da enumeração hebraica é preservada. “O coração dele” foi preferido a “seu coração” para eliminar ambiguidade referencial.
