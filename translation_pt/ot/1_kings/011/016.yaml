  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: pt
  text: Pois Joabe e todo o Israel[a] permaneceram ali por seis meses, até que ele eliminou todos os indivíduos do sexo masculino em Edom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Todo o Israel” provavelmente se refere à força militar israelita que acompanhava Joabe, não necessariamente a cada pessoa da nação.
    reason: cultural_note
  - marker: b
    text: Ou “exterminou todos os indivíduos do sexo masculino”. O verbo hebraico significa literalmente “cortar” ou “cortar fora”; neste contexto, é uma expressão para eliminar e pode descrever a destruição de uma população.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação ligada ao contexto anterior, preservando a força explicativa ou causal do hebraico.
- source_word: שֵׁשֶׁת חֳדָשִׁים יָשַׁב שָׁם
  choice: permaneceram ali seis meses
  rationale: יָשַׁב indica permanência neste contexto militar; a concordância no plural em português acomoda naturalmente o sujeito composto que segue.
- source_word: יוֹאָב וְכָל יִשְׂרָאֵל
  choice: Joabe e todo o Israel
  rationale: Mantém a expressão coletiva do hebraico e a forma portuguesa tradicional do nome próprio; uma nota esclarece seu provável sentido militar.
- source_word: עַד הִכְרִית
  choice: até que ele eliminou
  rationale: עַד marca o limite temporal, e o hifil de כרת expressa a eliminação de um grupo; 'eliminou' comunica em português corrente o sentido do idioma sem amenizar sua gravidade.
- source_word: כָּל זָכָר
  choice: todos os indivíduos do sexo masculino
  rationale: Preserva a referência abrangente ao sexo masculino sem restringi-la indevidamente a homens adultos.
- source_word: בֶּאֱדוֹם
  choice: em Edom
  rationale: 'A preposição ב tem sentido locativo: a ação ocorreu em Edom.'
