language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּמְצָא֙ הֲדַ֥ד חֵ֛ן בְּ/עֵינֵ֥י פַרְעֹ֖ה מְאֹ֑ד וַ/יִּתֶּן ל֤/וֹ אִשָּׁה֙ אֶת אֲח֣וֹת אִשְׁתּ֔/וֹ אֲח֖וֹת תַּחְפְּנֵ֥יס הַ/גְּבִירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: pt
  text: Hadade encontrou grande favor aos olhos do faraó. Então o faraó lhe deu por esposa a irmã de sua própria esposa[a], a irmã de Tafnes, a grande dama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente, “a irmã da esposa dele” poderia referir-se à esposa de Hadade, e não à esposa do faraó.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “a grande dama”; trata-se de um título para uma mulher de elevada posição real, talvez a rainha ou a principal dama da corte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: encontrou grande favor aos olhos de
  rationale: Preserva o conhecido idiomatismo hebraico e expressa naturalmente em português a intensificação feita por מְאֹד.
- source_word: פַרְעֹה
  choice: faraó
  rationale: Forma portuguesa consagrada para o título real egípcio.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: lhe deu por esposa
  rationale: Comunica de maneira natural e concisa que a mulher foi dada a Hadade em casamento.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: a irmã de sua própria esposa
  rationale: O contexto favorece o faraó como referente do sufixo; “própria” reduz a ambiguidade na leitura principal, enquanto a nota registra a alternativa gramatical.
- source_word: תַּחְפְּנֵיס
  choice: Tafnes
  rationale: Transliteração portuguesa clara e tradicionalmente reconhecível do nome hebraico.
- source_word: הַגְּבִירָה
  choice: a grande dama
  rationale: Reproduz com cautela o sentido de uma mulher de altíssima posição, sem impor ao contexto egípcio a função israelita mais específica de rainha-mãe.
theological_decisions:
- issue: Referente do pronome em אֲחוֹת אִשְׁתּוֹ (“a irmã de sua esposa”)
  choice: 'O pronome se refere ao faraó: ele deu a Hadade a irmã da própria esposa.'
  alternative: 'O pronome se refere a Hadade: o faraó lhe deu a irmã da esposa de Hadade.'
  rationale: A frase seguinte, “a irmã de Tafnes”, funciona naturalmente como identificação da esposa do faraó e favorece a leitura principal, embora a forma hebraica isolada permita a alternativa.
- issue: Sentido do título הַגְּבִירָה
  choice: a grande dama
  alternative: a rainha-mãe; a rainha; a principal dama da corte
  rationale: O termo designa uma mulher real de posição elevada. Como Tafnes é apresentada no contexto como esposa do faraó, “rainha-mãe” seria específico demais e poderia criar uma relação incoerente; “grande dama” conserva a amplitude do título.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário de ampla compreensão internacional e boa legibilidade brasileira. A repetição “a irmã... a irmã...” foi mantida por refletir a aposição enfática do hebraico. O segundo sujeito foi explicitado como “o faraó” para evitar ambiguidade narrativa.
