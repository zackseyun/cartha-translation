base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: pt
  text: Ele reuniu homens em torno de si e tornou-se chefe de um bando, quando Davi os matou. Eles foram a Damasco[a], estabeleceram-se ali e reinaram em Damasco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No hebraico, os verbos de toda a parte final do versículo estão no plural: “foram... estabeleceram-se... reinaram”. Algumas traduções os ajustam para o singular (“ele”), porque o contexto se concentra em Rezom.'
    reason: Leitura alternativa decorrente da tensão entre a gramática plural do hebraico e o foco narrativo em Rezom.
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: Ele reuniu homens em torno de si
  rationale: A construção קבץ com עַל e sufixo pronominal descreve pessoas que se agrupam em torno de alguém. A formulação preserva essa direção e soa natural em português.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O substantivo é masculino plural e, neste contexto militar, refere-se a homens que integravam um bando, não genericamente a pessoas.
- source_word: שַׂר גְּדוּד
  choice: chefe de um bando
  rationale: שַׂר designa um chefe ou comandante, enquanto גְּדוּד pode indicar um bando ou destacamento. “Bando” preserva o caráter possivelmente irregular do grupo sem acrescentar explicitamente a ideia de incursões.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: quando Davi os matou
  rationale: A preposição בְּ com o infinitivo construto exprime aqui circunstância temporal. O pronome objeto permanece no plural, conforme o hebraico, sem esclarecer interpretativamente seu referente.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: Eles foram a Damasco
  rationale: Mantém o verbo no plural e expressa de modo natural o movimento em direção a Damasco.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: estabeleceram-se ali
  rationale: ישב pode significar habitar ou estabelecer-se. A escolha se ajusta ao contexto de chegada e permanência na cidade.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: e reinaram em Damasco
  rationale: מלך no qal significa reinar ou exercer realeza. O plural do texto hebraico é mantido, apesar de o contexto mais amplo se concentrar em Rezom.
theological_decisions:
- issue: Formas verbais plurais nas orações finais, embora a narrativa mais ampla se concentre em Rezom
  choice: 'Manter o sujeito plural: “Eles foram... estabeleceram-se... reinaram”'
  alternative: 'Regularizar para o singular, tomando Rezom como sujeito implícito: “Ele foi... estabeleceu-se... reinou”'
  rationale: O texto hebraico traz verbos no plural em toda a parte final do versículo. Preservar o plural mantém a forma e a tensão narrativa da fonte, sem resolvê-la por interpretação.
- issue: Referente do pronome plural em “quando Davi os matou”
  choice: Preservar o pronome plural sem identificar expressamente seu antecedente
  alternative: Explicitar um grupo, como os companheiros de Rezom ou os homens de Hadadezer
  rationale: O hebraico apresenta o objeto plural אֹתָם, mas o referente não é plenamente explícito neste versículo. A tradução conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “chefe de um bando” como expressão natural e relativamente neutra. Conserva os plurais e as ambiguidades do hebraico, sem harmonização interpretativa.
