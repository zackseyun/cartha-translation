base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: pt
  text: Os demais atos de Salomão, tudo o que ele fez e sua sabedoria, não estão escritos no Livro dos Atos de Salomão[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livro das Crônicas de Salomão”. Em hebraico, o título contém literalmente “livro das palavras/coisas de Salomão”, expressão que aqui se refere ao registro de seus atos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: Os demais atos de Salomão
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula de encerramento régio, designa os atos ou acontecimentos registrados, não apenas palavras.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tudo o que ele fez
  rationale: Tradução direta que preserva o sentido amplo do verbo עשה sem especificar realizações ou êxitos.
- source_word: וְחָכְמָתוֹ
  choice: e sua sabedoria
  rationale: Mantém a sabedoria de Salomão como categoria destacada ao lado de seus atos.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica hebraica, que espera resposta afirmativa, e a construção passiva de כתב.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa ser literalmente 'sobre', em referência documental o português idiomático pede 'escritos no Livro'.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: Livro dos Atos de Salomão
  rationale: O título provavelmente designa um documento sobre os atos de Salomão. 'Atos' comunica o valor historiográfico de דִּבְרֵי e evita confusão direta com o livro bíblico de Crônicas.
theological_decisions: []
