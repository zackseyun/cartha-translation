  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: pt
  text: Então Salomão construiu um lugar alto para Camos, a abominação de Moabe, no monte em frente a Jerusalém, e para Moloque[a], a abominação dos amonitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Milcom”, em vez de “Moloque”; a forma hebraica aqui é tradicionalmente lida como “Moloque”, mas alguns a relacionam à divindade amonita Milcom.
    reason: Leitura alternativa ligada à identificação da divindade mencionada.
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a progressão temporal da narrativa de modo natural e direto em português.
- source_word: יִבְנֶה
  choice: construiu
  rationale: Embora a forma hebraica seja imperfeita, com אָז ela relata um acontecimento passado na sequência narrativa; o pretérito perfeito comunica essa função com clareza.
- source_word: בָּמָה
  choice: lugar alto
  rationale: Preserva o sentido técnico de um local de culto, frequentemente elevado, sem reduzi-lo apenas a um santuário ou altar.
- source_word: לִכְמוֹשׁ
  choice: para Camos
  rationale: A preposição indica que o local de culto foi dedicado à divindade moabita; Camos é uma forma portuguesa reconhecível do nome.
- source_word: שִׁקֻּץ מוֹאָב
  choice: a abominação de Moabe
  rationale: Mantém o forte juízo religioso e moral expresso pelo termo hebraico, sem acrescentar ao texto a palavra 'deus'.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: no monte que fica diante de Jerusalém
  rationale: Traduz diretamente a relação espacial como 'diante de', preservando a possibilidade de entender o monte como situado em frente ou voltado para Jerusalém, sem inserir no texto a identificação geográfica 'a leste'.
- source_word: וּלְמֹלֶךְ
  choice: e para Moloque
  rationale: Segue a vocalização massorética e apresenta o nome tradicionalmente associado à forma hebraica, registrando em nota a alternativa Milcom.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: a abominação dos amonitas
  rationale: '''Amonitas'' é a forma portuguesa natural para o gentílico literalmente expresso como ''filhos de Amom'' e mantém o paralelismo com Moabe.'
theological_decisions:
- issue: Designação pejorativa das divindades estrangeiras
  choice: Traduzir שִׁקֻּץ por 'abominação' nas duas ocorrências
  alternative: '''coisa detestável'' ou ''deus detestável'''
  rationale: O próprio narrador emprega uma designação condenatória. 'Abominação' conserva essa avaliação teológica forte sem explicitar além do hebraico se o referente é a divindade, o ídolo ou seu culto.
- issue: Identidade de מֹלֶךְ
  choice: Moloque no texto principal
  alternative: Milcom
  rationale: A vocalização massorética apoia 'Moloque', enquanto há uma conhecida associação textual e interpretativa com Milcom, divindade amonita. A leitura principal segue a forma recebida, e a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Mantém-se 'lugar alto' como termo cultual e 'abominação' para conservar a força avaliativa do hebraico. A nota foi colocada após 'Moloque', termo ao qual efetivamente se refere.
