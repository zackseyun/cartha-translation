  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: pt
  text: Jeroboão era um homem de grande capacidade[a]. Salomão viu que o jovem era trabalhador e o encarregou de todos os trabalhos forçados da casa de José[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um homem valente” ou “um homem vigoroso”. A expressão hebraica pode indicar força, valentia ou capacidade notável.
    reason: lexical_alternative
  - marker: b
    text: A “casa de José” se refere às tribos descendentes de José, especialmente Efraim e Manassés.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: Jeroboão era um homem
  rationale: Reformula a ordem hebraica em português natural, preservando a apresentação de Jeroboão como indivíduo em destaque; o וְ narrativo não exige um advérbio temporal como “ora”.
- source_word: גִּבּוֹר חָיִל
  choice: homem de grande capacidade
  rationale: No contexto administrativo, a expressão indica qualidades notáveis, força ou competência, sem exigir que Jeroboão seja apresentado especificamente como guerreiro. A nota preserva as alternativas ligadas a valentia e vigor.
- source_word: וַיַּרְא
  choice: viu
  rationale: Mantém o sentido básico de ראה; no contexto, equivale a perceber ou notar, explicado pela oração seguinte.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר pode designar rapaz, jovem ou servo. Aqui se refere a alguém apto a receber responsabilidade administrativa, por isso “o jovem” é adequado e não define sua função como servo.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: que o jovem era trabalhador
  rationale: A construção significa literalmente que ele fazia trabalho ou era alguém que trabalhava. “Era trabalhador” transmite de modo natural a diligência ou aptidão observada por Salomão.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: o encarregou
  rationale: O hifil de פקד neste contexto significa designar ou colocar alguém à frente de uma responsabilidade.
- source_word: לְכָל סֵבֶל
  choice: de todos os trabalhos forçados
  rationale: סֵבֶל designa trabalho pesado imposto, associado ao serviço compulsório em obras reais. O plural é idiomático em português e comunica a extensão da incumbência.
- source_word: בֵּית יוֹסֵף
  choice: da casa de José
  rationale: Preserva a designação tribal hebraica, esclarecida em nota como referência aos descendentes de José.
