  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: pt
  text: Então Salomão procurou matar Jeroboão[a]. Mas Jeroboão se levantou e fugiu para o Egito, para junto de Sisaque, rei do Egito, e permaneceu no Egito até a morte de Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “procurou mandar matar Jeroboão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: procurou
  rationale: Preserva o sentido de buscar ou intentar, sem afirmar que a tentativa chegou a ser executada.
- source_word: לְהָמִית
  choice: matar
  rationale: Expressa de modo natural e direto em português o infinitivo causativo de מות neste contexto de ameaça de morte.
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Mantém a fórmula narrativa hebraica que introduz uma ação decidida, sem precisar reduzi-la ao sentido físico de ficar em pé.
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: Traduz com precisão a fuga diante do perigo.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: para o Egito, para junto de Sisaque, rei do Egito
  rationale: Conserva a repetição de Egito e distingue o destino geográfico da busca de refúgio junto ao rei.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: permaneceu no Egito
  rationale: Embora literalmente seja 'esteve no Egito', o complemento temporal até a morte de Salomão comunica permanência; esta formulação é natural em português.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: até a morte de Salomão
  rationale: Reproduz diretamente a construção nominal hebraica e soa natural em português.
