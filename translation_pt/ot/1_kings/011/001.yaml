  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: pt
  text: 'O rei Salomão amou muitas mulheres estrangeiras[a], incluindo a filha do faraó: moabitas, amonitas, edomitas, sidônias e hititas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitas esposas estrangeiras”. O hebraico diz “muitas mulheres estrangeiras”; o contexto indica que eram mulheres que Salomão tomou como esposas ou consortes.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: O rei Salomão
  rationale: Traduz diretamente o título e o nome. O וְ inicial dá continuidade à narrativa, mas não exige um marcador explícito em português neste versículo.
- source_word: אָהַב
  choice: amava
  rationale: O verbo significa “amar”. O imperfeito português expressa com naturalidade a afeição contínua de Salomão, desenvolvida nos versículos seguintes, sem enfraquecer o sentido lexical.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: muitas mulheres estrangeiras
  rationale: 'Mantém os três elementos do hebraico: “mulheres”, “estrangeiras” e “muitas”. O contexto indica relações conjugais ou de consórcio, mas o substantivo empregado neste ponto é “mulheres”.'
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: entre elas a filha do faraó
  rationale: A construção acrescenta a filha do faraó ao conjunto das mulheres mencionadas. “Entre elas” comunica essa inclusão de modo claro e natural.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: moabitas, amonitas, edomitas, sidônias e hititas
  rationale: Emprega os gentílicos portugueses usuais, preservando a referência específica a Sidom e deixando “mulheres” subentendido na enumeração, como no hebraico.
theological_decisions:
- issue: Traduzir נָשִׁים por “mulheres” ou “esposas”
  choice: mulheres
  alternative: esposas
  rationale: O hebraico diz literalmente “mulheres”. Embora o contexto mostre que Salomão as tomou como esposas ou consortes, a tradução principal não restringe o termo além do que este versículo explicita.
- issue: Relação da filha do faraó com as “mulheres estrangeiras”
  choice: incluída entre elas
  alternative: apresentada como categoria separada
  rationale: A sintaxe aditiva favorece sua inclusão entre as mulheres que Salomão amava. “Entre elas” preserva essa leitura sem acrescentar uma avaliação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Faraó” permanece em minúscula por funcionar como título, e os gentílicos seguem a grafia corrente em português.
