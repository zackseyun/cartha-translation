id: 1KI.11.12
reference: 1 Kings 11:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: pt
  text: Contudo, não farei isso[a] nos seus dias, por amor a Davi, seu pai; da mão de seu filho eu o arrancarei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, tirar-lhe o reino, conforme anunciado no versículo anterior.
    reason: cross_reference
  - marker: b
    text: A expressão hebraica “da mão de seu filho” indica que o reino será tirado do poder ou domínio dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca a ressalva adversativa que limita o juízo anunciado no versículo anterior, em português natural e digno.
- source_word: בְּיָמֶיךָ
  choice: nos seus dias
  rationale: Preserva a expressão temporal hebraica e, no contexto, refere-se ao período de vida e reinado de Salomão.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: não farei isso
  rationale: Mantém a referência anafórica ao ato anteriormente anunciado sem explicitar no corpo do texto mais do que o hebraico.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: por amor a Davi, seu pai
  rationale: Expressa consideração ou favor em razão de Davi, evitando reduzir לְמַעַן a uma causalidade meramente mecânica.
- source_word: מִיַּד בִּנְךָ
  choice: da mão de seu filho
  rationale: Conserva a imagem hebraica da mão como esfera de posse, poder ou domínio.
- source_word: אֶקְרָעֶנָּה
  choice: eu o arrancarei
  rationale: Comunica a retirada violenta e decisiva indicada por קָרַע, com o pronome masculino retomando naturalmente 'o reino' em português.
theological_decisions:
- issue: Adiamento do juízo pronunciado contra Salomão
  choice: O ato de tirar o reino não ocorrerá durante os dias de Salomão, mas atingirá o domínio de seu filho.
  alternative: Explicitar no texto 'durante a sua vida' e repetir 'o reino'.
  rationale: A tradução preserva a dependência do contexto anterior e o motivo da consideração por Davi, sem acrescentar uma interpretação teológica além do que o hebraico afirma.
- issue: Referente dos sufixos pronominais femininos hebraicos
  choice: Traduzir anaforicamente por 'isso' e 'o', sendo 'o' uma retomada portuguesa de 'reino'.
  alternative: Repetir explicitamente 'o reino' nas duas orações.
  rationale: O hebraico deixa o referente implícito; a concordância portuguesa exige o masculino quando se retoma 'reino', sem alterar o referente contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a expressão bíblica “nos seus dias” e a imagem hebraica “da mão”, enquanto “arrancarei” transmite de modo natural a força do verbo קָרַע.
