  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: pt
  text: Eu o tomarei, e você reinará sobre tudo o que a sua alma desejar[a] e será rei sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que você desejar”; literalmente, “tudo o que a sua alma desejar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקַּח
  choice: Eu o tomarei
  rationale: O verbo לָקַח significa normalmente “tomar”. No contexto da designação divina de Jeroboão, “tomarei” preserva a força concreta do hebraico sem explicá-la apenas como “escolherei”.
- source_word: וּמָלַכְתָּ
  choice: você reinará
  rationale: O verbo מָלַךְ descreve o exercício da realeza, e não somente o momento de tornar-se rei.
- source_word: בְּכֹל אֲשֶׁר
  choice: sobre tudo o que
  rationale: Com o verbo “reinar”, a preposição בְּ indica aqui o âmbito do governo; “sobre” expressa essa relação com naturalidade em português.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: a sua alma desejar
  rationale: Mantém a imagem antropológica explícita do hebraico, embora em português corrente também se possa dizer simplesmente “você desejar”.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: e será rei
  rationale: A construção com הָיָה e o substantivo “rei” declara a condição ou função que Jeroboão passará a ocupar.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com a realeza, עַל indica autoridade exercida sobre o povo de Israel.
theological_decisions:
- issue: Expressão antropológica נֶפֶשׁ
  choice: a sua alma desejar
  alternative: você desejar
  rationale: Neste contexto, נֶפֶשׁ não formula necessariamente uma doutrina técnica sobre a alma; faz parte de uma expressão hebraica para o desejo pessoal. A tradução conserva a imagem sem lhe acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eu o tomarei” preserva o objeto antecipado e o sentido concreto do hebraico; “você” torna explícito o sujeito nas orações seguintes. A formulação literal “a sua alma desejar” é mantida no texto, com a expressão idiomática corrente apresentada em nota.
