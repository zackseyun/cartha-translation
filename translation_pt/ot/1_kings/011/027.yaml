  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: pt
  text: 'E este foi o motivo pelo qual ele levantou a mão contra o rei: Salomão havia construído o Milo e fechado a brecha da Cidade de Davi, seu pai.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “rebelou-se contra o rei”. A expressão hebraica diz literalmente “levantou a mão contra o rei”.
    reason: alternative_reading
  - marker: b
    text: O “Milo” provavelmente era uma fortificação ou uma estrutura de aterro em terraços em Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: o motivo
  rationale: Embora o sentido básico seja “a questão/coisa”, a construção introduz a explicação do ato de Jeroboão; “o motivo” expressa essa função naturalmente em português.
- source_word: הֵרִים יָד
  choice: levantou a mão contra
  rationale: Preserva a imagem do idioma hebraico e continua compreensível em português; o sentido interpretativo “rebelou-se contra” fica registrado em nota.
- source_word: בַּמֶּלֶךְ
  choice: contra o rei
  rationale: A preposição, com o idioma precedente, indica o alvo da ação hostil. O hebraico diz “o rei”, e Salomão é identificado na oração seguinte.
- source_word: הַמִּלּוֹא
  choice: o Milo
  rationale: Trata-se de um termo topográfico ou arquitetônico específico de Jerusalém, de identificação exata incerta; por isso, translitera-se o nome e explica-se em nota.
- source_word: סָגַר
  choice: fechado
  rationale: Reproduz o sentido básico de “fechar” e se ajusta à imagem de uma brecha nas defesas urbanas sem recorrer ao mais interpretativo “reparado”.
- source_word: פֶּרֶץ
  choice: a brecha
  rationale: Em contexto de fortificações, designa uma abertura ou ruptura na muralha; “brecha” é preciso e natural.
- source_word: עִיר דָּוִד
  choice: a Cidade de Davi
  rationale: É a designação convencional da fortaleza de Jerusalém associada a Davi; a capitalização sinaliza o topônimo.
- source_word: אָבִיו
  choice: seu pai
  rationale: Refere-se a Davi como pai de Salomão; a proximidade sintática mantém claro esse referente em português.
