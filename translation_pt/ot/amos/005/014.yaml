id: AMO.5.14
reference: Amos 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דִּרְשׁוּ ט֥וֹב וְ/אַל רָ֖ע לְמַ֣עַן תִּֽחְי֑וּ וִ/יהִי כֵ֞ן יְהוָ֧ה אֱלֹהֵֽי צְבָא֛וֹת אִתְּ/כֶ֖ם כַּ/אֲשֶׁ֥ר אֲמַרְתֶּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/014.yaml
  text: Seek good and not evil[a], so that you may live; and so Yahweh, the God of hosts, will be with you, as you have said.
translation:
  language: pt
  text: Busquem o bem, e não o mal, para que vocês vivam; e assim Yahweh, o Deus dos Exércitos, estará com vocês, como vocês têm dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como vocês dizem”. O perfeito hebraico pode se referir ao que eles já haviam afirmado sobre a presença de Yahweh.
    reason: alternativa lexical e aspecto verbal
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Busquem
  rationale: O imperativo de דרשׁ transmite a ideia de buscar ou procurar com empenho. “Busquem” é natural, direto e preserva tanto a força moral quanto a ressonância pactual da exortação.
- source_word: טוֹב וְאַל רָע
  choice: o bem, e não o mal
  rationale: Os adjetivos funcionam substantivamente e formam uma antítese moral concisa. A tradução mantém o paralelismo e a brevidade do hebraico.
- source_word: לְמַעַן תִּחְיוּ
  choice: para que vocês vivam
  rationale: לְמַעַן introduz propósito ou resultado. A formulação preserva essa amplitude, sem explicar “viver” como mera sobrevivência nem ampliá-lo explicitamente para prosperidade pactual.
- source_word: וִיהִי כֵן
  choice: e assim ... estará
  rationale: A construção expressa o estado desejado ou a consequência ligada à busca do bem. “E assim ... estará” comunica de modo natural a relação consequencial, sem transformá-la em afirmação incondicional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: “Exércitos” comunica de forma corrente o sentido amplo de צְבָאוֹת, que pode abranger hostes celestiais e forças terrenas, sem restringir indevidamente o referente.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: A preposição indica presença junto ao povo. “Com vocês” é a correspondência mais direta e idiomática.
- source_word: כַּאֲשֶׁר אֲמַרְתֶּם
  choice: como vocês têm dito
  rationale: O perfeito hebraico pode apontar para uma afirmação já feita e ainda sustentada. O perfeito composto em português conserva essa nuance melhor do que um simples presente, sem tornar explícita uma acusação de falsa pretensão.
theological_decisions:
- issue: Se a presença de Yahweh é declarada incondicionalmente ou apresentada como consequência da busca do bem
  choice: 'A presença é formulada como consequência: “e assim ... estará com vocês”.'
  alternative: “E assim Yahweh ... está com vocês.”
  rationale: No contexto, a exortação ao arrependimento liga a vida e a presença divina à resposta do povo. A sequência hebraica favorece essa relação consequencial, enquanto a cláusula final mantém a tensão com a alegação do próprio povo de que Deus estava com ele.
- issue: Como representar a alegação do povo sobre a presença de Yahweh
  choice: “como vocês têm dito”
  alternative: “como vocês dizem”
  rationale: O perfeito אֲמַרְתֶּם sugere algo afirmado anteriormente, mas pode descrever uma afirmação que continua sendo repetida. O texto principal destaca a nuance retrospectiva, e a nota registra a alternativa habitual sem decidir além do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural e sintaxe de ampla legibilidade brasileira. A antítese concisa do hebraico foi mantida, e o título divino foi traduzido sem limitar “Exércitos” apenas a forças celestiais ou humanas.
