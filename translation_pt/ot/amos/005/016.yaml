  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֲדֹנָ֔/י בְּ/כָל רְחֹב֣וֹת מִסְפֵּ֔ד וּ/בְ/כָל חוּצ֖וֹת יֹאמְר֣וּ הוֹ ה֑וֹ וְ/קָרְא֤וּ אִכָּר֙ אֶל אֵ֔בֶל וּ/מִסְפֵּ֖ד אֶל י֥וֹדְעֵי נֶֽהִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/016.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the Lord: In all the squares there will be wailing, and in all the streets they will say, “Alas! Alas!” They will call the farmer to mourning[b], and those who know lamentation to wailing.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh, Deus dos Exércitos, o Senhor: “Em todas as praças haverá pranto, e em todas as ruas dirão: ‘Ai! Ai!’[a] Convocarão o lavrador para o luto e chamarão para o pranto os que conhecem o lamento.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Oh! Oh!” O hebraico הוֹ הוֹ é um grito de lamento; “Ai! Ai!” destaca aqui a dor, não uma declaração de condenação.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que conhecem o lamento”, provavelmente pessoas experientes ou profissionais na condução de lamentações fúnebres.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência do juízo anunciado anteriormente e expressa com naturalidade a relação inferencial do hebraico.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética de mensageiro em registro solene e conciso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Preserva a expressão tradicional sem restringir צְבָאוֹת exclusivamente a forças terrenas ou celestes.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Representa o título divino em aposição aos títulos precedentes.
- source_word: בְּכָל רְחֹבוֹת
  choice: Em todas as praças
  rationale: רְחֹבוֹת designa os espaços públicos amplos das cidades, distinguindo-os das ruas mencionadas em seguida.
- source_word: מִסְפֵּד
  choice: pranto
  rationale: Comunica uma manifestação pública e audível de luto; a mesma escolha é mantida nas duas ocorrências do substantivo.
- source_word: בְכָל חוּצוֹת
  choice: em todas as ruas
  rationale: No contexto urbano, חוּצוֹת refere-se às vias e espaços exteriores, em contraste com as praças.
- source_word: הוֹ הוֹ
  choice: Ai! Ai!
  rationale: É uma exclamação portuguesa natural de dor e lamento, sem transformá-la numa fórmula explícita de condenação.
- source_word: אִכָּר
  choice: o lavrador
  rationale: Designa genericamente quem trabalha no cultivo da terra; 'lavrador' conserva o cenário agrário e o tom digno.
- source_word: אֶל אֵבֶל
  choice: para o luto
  rationale: Expressa a convocação para participar das práticas de luto.
- source_word: יֹדְעֵי נֶהִי
  choice: os que sabem entoar lamentos
  rationale: Conserva a ideia literal de pessoas que conhecem a lamentação, ao mesmo tempo que torna clara sua atuação no rito fúnebre.
theological_decisions:
- issue: Sequência dos títulos divinos יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי
  choice: Yahweh, Deus dos Exércitos, o Senhor
  alternative: SENHOR, Deus dos Exércitos, o Soberano Senhor
  rationale: Mantém distintos o nome próprio Yahweh e os títulos que o seguem, sem fundi-los nem acrescentar uma interpretação teológica não expressa no hebraico.
- issue: Natureza do clamor הוֹ הוֹ
  choice: Ai! Ai!
  alternative: Pobre de nós! Pobre de nós!
  rationale: Preserva a brevidade e a força do grito de dor, sem especificar indevidamente se é apenas lamento ou também reconhecimento de calamidade.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição de “pranto” reproduz a repetição de מִסְפֵּד, e a inversão “para o pranto, os que...” conserva a estrutura paralela do hebraico sem tornar a frase obscura.
