translation:
  language: pt
  text: Vocês que transformam o direito em absinto[a] e lançam a justiça por terra![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amargura” em vez de “absinto”; o hebraico nomeia uma planta amarga e aqui a emprega como metáfora.
    reason: lexical_alternative
  - marker: b
    text: Ou “e lançam a retidão por terra”. Os termos hebraicos traduzidos por “direito” e “justiça” têm sentidos parcialmente sobrepostos.
    reason: alternative_reading
lexical_decisions:
- source_word: הַהֹפְכִים
  choice: vocês que transformam
  rationale: O particípio com artigo tem força de interpelação no contexto. A segunda pessoa preserva a denúncia profética direta, em português natural.
- source_word: לַעֲנָה
  choice: absinto
  rationale: O termo hebraico designa uma planta conhecida por seu forte amargor e empregada aqui como metáfora. “Absinto” conserva a imagem concreta; “amargura” fica registrada como alternativa.
- source_word: מִשְׁפָּט
  choice: direito
  rationale: Neste contexto social e jurídico, “direito” comunica a ordem justa que deveria reger a comunidade e permite distingui-la do termo hebraico seguinte, semanticamente relacionado.
- source_word: וּצְדָקָה
  choice: justiça
  rationale: O termo abrange justiça, retidão e conduta correta. “Justiça” é claro e natural no contexto profético, sem eliminar a alternativa “retidão”.
- source_word: לָאָרֶץ
  choice: por terra
  rationale: A expressão portuguesa preserva a imagem espacial de rebaixamento e transmite de modo idiomático o sentido de lançar algo ao chão.
- source_word: הִנִּיחוּ
  choice: lançam ... por terra
  rationale: O hifil de נוח pode significar pôr ou deixar em certo lugar. No contexto negativo, “lançam ... por terra” expressa com clareza a humilhação da justiça, mantendo a imagem espacial.
theological_decisions:
- issue: Distinção entre מִשְׁפָּט e צְדָקָה na ética profética
  choice: direito ... justiça
  alternative: justiça ... retidão
  rationale: Os dois termos têm campos semânticos parcialmente sobrepostos. A tradução principal mantém dois conceitos relacionados sem reduzi-los a uma única palavra; a nota preserva a possibilidade de verter צְדָקָה por “retidão” e reconhece a sobreposição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” sustenta a interpelação direta; “por terra” é idiomático sem perder a imagem hebraica. A exclamação marca a força da denúncia profética.
