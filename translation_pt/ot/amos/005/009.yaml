  text: הַ/מַּבְלִ֥יג שֹׁ֖ד עַל עָ֑ז וְ/שֹׁ֖ד עַל מִבְצָ֥ר יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/009.yaml
  text: He who brings sudden destruction upon the strong[b][a], so that destruction comes upon the fortress.
translation:
  language: pt
  text: Aquele que traz destruição repentina sobre o poderoso[a], e a destruição vem sobre a fortaleza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que faz a devastação irromper sobre o poderoso”. O verbo hebraico é raro e difícil, e admite outras interpretações.'
    reason: lexical_alternative
  - marker: b
    text: “Fortaleza” também pode ser traduzido como “baluarte” ou “lugar fortificado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבְלִיג
  choice: Aquele que traz ... repentina
  rationale: O particípio hifil substantivado significa “aquele que...”. Como o verbo é raro e difícil, a tradução expressa a ideia contextual mais provável de fazer irromper subitamente a ruína, sem usar em português uma metáfora pouco natural.
- source_word: שֹׁד
  choice: destruição
  rationale: Neste paralelismo, o substantivo indica devastação ou ruína violenta, não apenas saque.
- source_word: עַל
  choice: sobre
  rationale: A preposição marca o alvo da ação destrutiva e conserva a imagem do hebraico.
- source_word: עָז
  choice: o forte
  rationale: O adjetivo é usado substantivamente e pode indicar uma pessoa ou poder forte; o singular preserva a forma hebraica.
- source_word: וְשֹׁד
  choice: de modo que a destruição
  rationale: A conjunção liga a segunda oração à primeira. A formulação explicita com naturalidade a progressão resultativa provável, embora o hebraico também possa ser lido simplesmente como “e”.
- source_word: מִבְצָר
  choice: a fortaleza
  rationale: O substantivo designa um lugar fortificado ou baluarte; “fortaleza” é claro e mantém a imagem militar.
- source_word: יָבוֹא
  choice: alcança
  rationale: O sentido básico é “vem”. Com “destruição” como sujeito e “fortaleza” como alvo, “alcança” soa natural em português e evita a construção menos idiomática “vem sobre”.
theological_decisions:
- issue: Identificação do sujeito
  choice: Manter “Aquele que...”, com referência implícita a Deus pelo contexto.
  alternative: Entender a expressão como referência impessoal a uma força destrutiva.
  rationale: Amós 5:8–9 descreve o poder do SENHOR, mas o próprio versículo emprega uma expressão participial; a tradução preserva essa forma sem inserir explicitamente o nome divino.
- issue: Relação entre as orações
  choice: 'Traduzir וְ com sentido resultativo: “de modo que”.'
  alternative: Traduzir simplesmente “e”.
  rationale: O contexto permite perceber a segunda oração como resultado da primeira, mas essa nuance não é gramaticalmente obrigatória; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e a repetição de “destruição” foram preservadas. As notas mantêm visível a incerteza do verbo raro e a possível leitura coordenativa da segunda oração.
