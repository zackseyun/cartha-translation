base_translation:
  language: en
  yaml_path: translation/ot/amos/005/019.yaml
  text: It will be as when a man flees from before the lion[a], and the bear meets him; then he enters the house and leans his hand on the wall[b], and the snake bites him.
translation:
  language: pt
  text: É como quando um homem foge de um leão, e um urso o encontra[a]; então entra em casa, apoia a mão na parede, e uma cobra o morde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depara-se com ele” ou “o acomete”. O verbo hebraico pode indicar encontrar, deparar-se ou acometer, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “serpente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: É como quando
  rationale: Introduz a comparação ligada ao contexto anterior e preserva a força do hebraico de modo natural em português.
- source_word: יָנוּס אִישׁ מִפְּנֵי הָאֲרִי
  choice: um homem foge de um leão
  rationale: Mantém o sujeito masculino singular e a urgência de נוּס; em português, 'fugir de' comunica naturalmente מִפְּנֵי. Embora os animais tenham artigo no hebraico, o valor representativo da cena pede artigo indefinido em português.
- source_word: וּפְגָעוֹ הַדֹּב
  choice: mas um urso o encontra
  rationale: פגע pode indicar encontrar, deparar-se ou acometer. 'Encontra' preserva a ambiguidade lexical, enquanto 'mas' explicita o contraste adversativo já inerente à sequência.
- source_word: וּבָא הַבַּיִת
  choice: então entra em casa
  rationale: בוא, neste contexto, descreve a entrada na casa; 'então' dá fluidez à progressão narrativa.
- source_word: וְסָמַךְ יָדוֹ עַל הַקִּיר
  choice: apoia a mão na parede
  rationale: סמך denota apoiar ou encostar; esta formulação é concreta, natural e mantém a aparente sensação de segurança.
- source_word: וּנְשָׁכוֹ הַנָּחָשׁ
  choice: e uma cobra o morde
  rationale: Preserva a ação súbita e a ordem natural do português. 'Cobra' é a designação moderna e comum para נָחָשׁ.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência rápida dos perigos foi mantida, assim como a ironia de escapar de uma ameaça apenas para encontrar outra. Os artigos definidos hebraicos diante dos animais foram vertidos por indefinidos, forma mais idiomática para uma cena representativa em português.
