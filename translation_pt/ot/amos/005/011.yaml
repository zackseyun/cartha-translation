  text: לָ֠/כֵן יַ֣עַן בּוֹשַׁסְ/כֶ֞ם עַל דָּ֗ל וּ/מַשְׂאַת בַּר֙ תִּקְח֣וּ מִמֶּ֔/נּוּ בָּתֵּ֥י גָזִ֛ית בְּנִיתֶ֖ם וְ/לֹא תֵ֣שְׁבוּ בָ֑/ם כַּרְמֵי חֶ֣מֶד נְטַעְתֶּ֔ם וְ/לֹ֥א תִשְׁתּ֖וּ אֶת יֵינָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/011.yaml
  text: Therefore[a], because you trample on the poor and take a grain tax from him, you have built houses of cut stone, but you will not live in them; you have planted delightful vineyards[c][b], but you will not drink their wine.
translation:
  language: pt
  text: Por isso, visto que vocês pisoteiam o pobre e dele cobram um tributo de cereal[a], vocês construíram casas de pedra lavrada[b], mas não morarão nelas; plantaram vinhedos agradáveis[c], mas não beberão o vinho deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dele exigem uma prestação de cereal”. A expressão hebraica indica um encargo ou tributo pago em cereal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “casas de pedra talhada”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “vinhedos desejáveis” ou “vinhedos preciosos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן יַעַן
  choice: Por isso, visto que
  rationale: Preserva tanto a consequência judicial marcada por לָכֵן quanto a causa introduzida por יַעַן, sem tornar a frase excessivamente pesada em português.
- source_word: בּוֹשַׁסְכֶם עַל דָּל
  choice: vocês pisoteiam o pobre
  rationale: Mantém a metáfora concreta de esmagamento e abuso social, mais vívida do que a formulação genérica 'oprimem'.
- source_word: וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ
  choice: e dele cobram um tributo de cereal
  rationale: Comunica uma exação imposta em cereal e conserva o pobre singular como pessoa diretamente explorada; a nota registra a amplitude lexical de מַשְׂאַת.
- source_word: בָּתֵּי גָזִית
  choice: casas de pedra lavrada
  rationale: גָזִית designa pedra cortada ou aparelhada; 'pedra lavrada' é claro, digno e não acrescenta a ideia interpretativa de mansões.
- source_word: בְּנִיתֶם ... וְלֹא תֵשְׁבוּ בָם
  choice: vocês construíram ... mas não morarão nelas
  rationale: O passado simples soa natural em português para a ação concluída, enquanto o futuro preserva o anúncio profético de que seus construtores não desfrutarão das casas.
- source_word: כַּרְמֵי חֶמֶד
  choice: vinhedos agradáveis
  rationale: חֶמֶד exprime aquilo que é desejável ou agradável. A escolha preserva a qualidade atraente dos vinhedos sem exagerá-la.
- source_word: וְלֹא תִשְׁתּוּ אֶת יֵינָם
  choice: mas não beberão o vinho deles
  rationale: Mantém a formulação direta e a ironia do fruto produzido, mas não desfrutado.
theological_decisions:
- issue: Natureza da linguagem de juízo
  choice: 'Anúncio profético de reversão: quem acumula riqueza explorando o pobre não desfrutará dela'
  alternative: Máxima moral geral sobre a injustiça
  rationale: O contexto e a segunda pessoa do plural indicam um pronunciamento específico de juízo, não apenas uma observação proverbial.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês”, amplamente compreensível no Brasil e em contexto internacional. A metáfora social de pisotear foi preservada, e os paralelos entre construir/não morar e plantar/não beber foram mantidos.
