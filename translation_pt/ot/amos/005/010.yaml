  text: שָׂנְא֥וּ בַ/שַּׁ֖עַר מוֹכִ֑יחַ וְ/דֹבֵ֥ר תָּמִ֖ים יְתָעֵֽבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/010.yaml
  text: They hate the one who reproves in the gate[b][a], and they abhor the one who speaks with integrity.
translation:
  language: pt
  text: Odeiam aquele que repreende no portão da cidade[a] e detestam aquele que fala com integridade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O portão da cidade era o lugar habitual de processos legais, julgamentos públicos e deliberações cívicas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “aquele que fala o que é irrepreensível” ou “aquele que fala com retidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנְאוּ
  choice: Odeiam
  rationale: O perfeito qal descreve aqui uma conduta característica e contínua; o presente comunica naturalmente essa realidade social em português.
- source_word: בַשַּׁעַר
  choice: à porta da cidade
  rationale: A expressão preserva o cenário público e judicial do portão da cidade, evitando que o leitor moderno pense apenas em uma porta doméstica.
- source_word: מוֹכִיחַ
  choice: aquele que repreende
  rationale: O particípio substantivado designa quem corrige ou apresenta uma censura, possivelmente em contexto judicial; a formulação mantém a ação sem acrescentar um objeto ausente no hebraico.
- source_word: וְדֹבֵר
  choice: e aquele que fala
  rationale: Mantém o paralelismo entre os dois particípios substantivados.
- source_word: תָּמִים
  choice: com integridade
  rationale: Expressa inteireza, retidão ou irrepreensibilidade moral em português natural, sem restringir indevidamente o termo à ideia de ausência absoluta de pecado.
- source_word: יְתָעֵבוּ
  choice: detestam
  rationale: O verbo piel comunica forte aversão; “detestam” é intenso, corrente e natural quando o objeto é uma pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “aquele que” conserva o paralelismo hebraico; “à porta da cidade” explicita apenas o referente cultural implícito no hebraico.
