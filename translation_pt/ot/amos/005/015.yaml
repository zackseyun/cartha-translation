id: AMO.5.15
reference: Amos 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׂנְאוּ רָע֙ וְ/אֶ֣הֱבוּ ט֔וֹב וְ/הַצִּ֥יגוּ בַ/שַּׁ֖עַר מִשְׁפָּ֑ט אוּלַ֗י יֶֽחֱנַ֛ן יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁאֵרִ֥ית יוֹסֵֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/015.yaml
  text: Hate evil[a], and love good, and establish justice in the gate; perhaps Yahweh, the God of hosts[c][b], will be gracious to the remnant of Joseph.
translation:
  language: pt
  text: Odeiem o mal e amem o bem; estabeleçam a justiça no portão da cidade[a][b]. Talvez Yahweh, o Deus dos Exércitos, seja favorável ao remanescente de José[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O portão da cidade era o lugar público onde anciãos e autoridades ouviam causas e administravam a justiça civil.
    reason: cultural_note
  - marker: b
    text: Ou “à porta da cidade”. A expressão hebraica indica o lugar onde se realizavam os julgamentos públicos da cidade.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “José” se refere aos descendentes de José, especialmente ao povo do reino do norte; o “remanescente de José” são os que restaram depois do juízo.
    reason: cross_reference
lexical_decisions:
- source_word: שִׂנְאוּ רָע
  choice: Odeiem o mal
  rationale: Preserva a força do imperativo plural e o contraste ético direto com amar o bem, sem suavizar שׂנא para simples rejeição.
- source_word: וְאֶהֱבוּ טוֹב
  choice: e amem o bem
  rationale: Tradução direta e natural do imperativo, mantendo o paralelismo antitético entre o mal e o bem.
- source_word: וְהַצִּיגוּ ... מִשְׁפָּט
  choice: estabeleçam a justiça
  rationale: O causativo הַצִּיגוּ comunica a ideia de fazer a justiça ficar firmemente estabelecida; מִשְׁפָּט tem aqui sentido jurídico e social.
- source_word: בַשַּׁעַר
  choice: no portão da cidade
  rationale: Explicita de modo natural em português que se trata do portão urbano, local público de julgamentos e administração cívica, sem reduzir a expressão a uma porta doméstica.
- source_word: אוּלַי
  choice: Talvez
  rationale: Mantém a esperança sem garantia e preserva a tensão profética do hebraico.
- source_word: יֶחֱנַן
  choice: conceda favor
  rationale: Expressa o favor gracioso indicado por חנן sem restringi-lo à compaixão emocional nem transformar a resposta divina em certeza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Emprega uma forma moderna e inteligível do título divino, preservando sua imagem coletiva e poderosa.
- source_word: שְׁאֵרִית יוֹסֵף
  choice: o remanescente de José
  rationale: Mantém o termo profético para os que restam após o juízo e o uso coletivo de José para o povo do reino do norte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; a transliteração conserva essa função sem substituí-la por um título.
- issue: Incerteza expressa por אוּלַי diante da resposta divina
  choice: Talvez ... conceda favor
  alternative: para que ... conceda favor; certamente concederá favor
  rationale: A formulação conserva a possibilidade esperançosa, mas não garantida, de favor após o chamado ao arrependimento.
- issue: Sentido coletivo de José
  choice: remanescente de José
  alternative: sobreviventes da tribo de José
  rationale: José designa coletivamente sobretudo o reino do norte; a tradução preserva essa metonímia e sua ressonância profética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais no plural para refletir os imperativos hebraicos. “Portão da cidade” evita a possível leitura doméstica de “porta”, e “Deus dos Exércitos” mantém um título reconhecível sem recorrer ao arcaísmo “hostes” no texto principal.
