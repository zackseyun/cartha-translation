  text: ה֥וֹי הַ/מִּתְאַוִּ֖ים אֶת י֣וֹם יְהוָ֑ה לָ/מָּה זֶּ֥ה לָ/כֶ֛ם י֥וֹם יְהוָ֖ה הוּא חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
translation:
  language: pt
  text: Ai dos que anseiam pelo dia de Yahweh! Para que vocês querem o dia de Yahweh?[a] Ele é trevas, e não luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Por que isto para vocês?” A expressão hebraica é elíptica e retórica; também pode ser entendida como: “Por que vocês querem o dia de Yahweh?”'
    reason: Registra a construção elíptica do hebraico e a principal explicitação idiomática em português, sem eliminar a força retórica da pergunta.
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Introduz uma lamentação e, ao mesmo tempo, um anúncio profético de juízo. “Ai” conserva essa força em português bíblico atual.
- source_word: הַמִּתְאַוִּים
  choice: os que anseiam
  rationale: O particípio caracteriza pessoas que desejam intensamente e de modo contínuo; “anseiam” expressa essa expectativa e mantém a ironia da repreensão.
- source_word: יוֹם יְהוָה
  choice: dia de Yahweh
  rationale: Mantém a expressão profética e representa diretamente o nome divino יהוה como “Yahweh”.
- source_word: לָמָּה זֶּה לָכֶם
  choice: Para que lhes serviria
  rationale: A formulação hebraica é elíptica e retórica. Esta tradução comunica naturalmente a pergunta sobre que benefício os ouvintes esperam obter desse dia, sem eliminar a alternativa mais literal registrada em nota.
- source_word: הוּא חֹשֶׁךְ וְלֹא אוֹר
  choice: Ele será trevas, e não luz
  rationale: Preserva literalmente o contraste profético central entre trevas e luz. O futuro é natural em português por se tratar do dia esperado, enquanto “ele” retoma explicitamente “o dia de Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva a referência ao nome divino, sem substituí-lo por um título.
- issue: Natureza do dia de Yahweh para os ouvintes
  choice: Ele será trevas, e não luz
  alternative: Ele é trevas, e não luz
  rationale: O hebraico usa uma oração nominal que pode ser vertida no presente, mas o contexto olha para um dia aguardado. O futuro comunica essa orientação temporal sem explicar além do texto a metáfora de juízo.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no espaço lusófono. Conserva “Ai”, “trevas” e “luz” por sua força profética, evitando linguagem arcaica.
