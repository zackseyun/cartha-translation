source:
  edition: WLC
  text: נָֽפְלָה֙ לֹֽא תוֹסִ֣יף ק֔וּם בְּתוּלַ֖ת יִשְׂרָאֵ֑ל נִטְּשָׁ֥ה עַל אַדְמָתָ֖/הּ אֵ֥ין מְקִימָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/002.yaml
  text: Fallen[a], virgin Israel will not rise again; abandoned on her own land[b], she has no one to raise her up.
translation:
  language: pt
  text: Caiu[a] a virgem Israel[b]; não voltará a se levantar. Abandonada em sua própria terra, não há quem a levante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Caiu para não mais se levantar”. O hebraico diz literalmente: “não tornará a levantar-se”.'
    reason: lexical_alternative
  - marker: b
    text: “A virgem Israel” é uma personificação poética da nação, não uma afirmação sobre condição sexual literal.
    reason: cultural_note
lexical_decisions:
- source_word: נָפְלָה
  choice: Caiu
  rationale: O qal perfeito na 3ª pessoa feminina singular abre a lamentação de modo abrupto e apresenta a queda como fato consumado. A anteposição de “Caiu” preserva a força poética do hebraico.
- source_word: לֹא תוֹסִיף קוּם
  choice: não voltará a se levantar
  rationale: A construção com o hifil de יסף seguido do infinitivo קום significa não tornar a fazer algo. A formulação portuguesa comunica a finalidade da queda e mantém o verbo reflexivo natural para quem se ergue.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: a virgem Israel
  rationale: בְּתוּלָה designa literalmente uma virgem ou jovem mulher e aqui personifica poeticamente a nação. “A virgem Israel” conserva a metáfora profética sem interpretá-la como afirmação sobre condição sexual literal.
- source_word: נִטְּשָׁה
  choice: Abandonada
  rationale: O nifal perfeito de נטש exprime ter sido deixada ou abandonada. “Abandonada” é atual, claro e adequado à imagem de Israel prostrada e desamparada.
- source_word: עַל אַדְמָתָהּ
  choice: em sua própria terra
  rationale: אַדָמָה pode significar solo, chão ou terra. O sufixo possessivo e o contexto nacional favorecem “sua própria terra”, ressaltando naturalmente que a queda ocorre no território de Israel.
- source_word: אֵין מְקִימָהּ
  choice: não há quem a levante
  rationale: אֵין com o particípio hifil de קום e o sufixo feminino indica a inexistência de alguém que a faça levantar. A tradução preserva tanto o desamparo quanto a repetição de קום presente no verso.
theological_decisions:
- issue: Designação metafórica de Israel como “virgem” em um oráculo de juízo
  choice: Manter diretamente “a virgem Israel”.
  alternative: “a jovem Israel” ou uma paráfrase afetiva
  rationale: O texto personifica a nação em linguagem de lamentação. A metáfora deve ser preservada por transmitir vulnerabilidade, honra e queda trágica sem acrescentar doutrina alheia ao verso.
- issue: Finalidade do juízo em לֹא תוֹסִיף קוּם
  choice: Traduzir “não voltará a se levantar”.
  alternative: “não se levantará mais”
  rationale: A expressão hebraica apresenta a queda como decisiva no horizonte do oráculo. A formulação escolhida mantém essa força sem resolver tensões com outras passagens nem ampliar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem inicial “Caiu a virgem Israel” conserva o impacto da lamentação hebraica; a repetição “se levantar / a levante” reproduz o jogo verbal com קום.
