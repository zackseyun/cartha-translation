id: AMO.5.27
reference: Amos 5:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִגְלֵיתִ֥י אֶתְ/כֶ֖ם מֵ/הָ֣לְאָה לְ/דַמָּ֑שֶׂק אָמַ֛ר יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/027.yaml
  text: Therefore I will send you into exile beyond Damascus,” says Yahweh[a], whose name is the God of hosts.
translation:
  language: pt
  text: Por isso, mandarei vocês para o exílio[a], para além de Damasco — diz Yahweh, cujo nome é Deus dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exilarei vocês”.'
    reason: Alternativa lexical mais compacta para o hifil de גלה.
lexical_decisions:
- source_word: וְהִגְלֵיתִי
  choice: Por isso, mandarei ... para o exílio
  rationale: O hifil de גלה expressa causar o exílio. A formulação é natural em português e preserva a força causativa; a conjunção וְ é traduzida contextualmente como conclusão da sentença de juízo anterior.
- source_word: אֶתְכֶם
  choice: vocês
  rationale: O sufixo de segunda pessoa masculina plural é expresso pelo plural corrente e amplamente compreensível “vocês”.
- source_word: מֵהָלְאָה לְדַמָּשֶׂק
  choice: para além de Damasco
  rationale: A expressão indica deslocamento a um lugar mais distante que Damasco; “para além de” comunica claramente essa direção.
- source_word: אָמַר
  choice: diz
  rationale: Na fórmula profética, o perfeito hebraico funciona como marcador performativo de fala; o presente mantém o oráculo vívido e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Deus dos Exércitos
  rationale: Preserva a amplitude de צְבָאוֹת no título divino sem restringi-lo explicitamente a exércitos terrenos ou celestiais.
- source_word: שְׁמוֹ
  choice: cujo nome é
  rationale: Retém a referência explícita ao nome e integra a oração nominal hebraica em português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Alcance de צְבָאוֹת no título divino
  choice: Exércitos
  alternative: hostes ou exércitos celestiais
  rationale: “Exércitos” é compreensível no português moderno e mantém o sentido amplo do termo, sem acrescentar a especificação “celestiais”, ausente do hebraico.
- issue: Relação sintática de אֱלֹהֵי צְבָאוֹת שְׁמוֹ
  choice: cujo nome é Deus dos Exércitos
  alternative: Deus dos Exércitos é o seu nome
  rationale: A forma relativa produz português fluente e conserva a oração nominal explícita, sem eliminar a afirmação de que esse título é seu nome.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa plural. “Para além de” conserva com clareza o sentido espacial, e a pontuação com travessão distingue a fórmula profética.
