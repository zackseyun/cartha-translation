base_translation:
  language: en
  yaml_path: translation/ot/amos/005/005.yaml
  text: But do not seek Bethel[a], and do not enter Gilgal, and do not cross over to Beersheba; for Gilgal will surely go into exile, and Bethel will become nothingness.
translation:
  language: pt
  text: Mas não busquem Betel[a], não entrem em Gilgal nem vão até Berseba; pois Gilgal certamente irá para o exílio, e Betel se reduzirá a nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente, “Betel se tornará Bete-Áven”, preservando um jogo de palavras hebraico: Betel (“casa de Deus”) é reduzida a áven (“nada”, “perversidade” ou “desgraça”).'
    reason: Alternativa lexical e preservação de jogo de palavras hebraico.
lexical_decisions:
- source_word: תִּדְרְשׁוּ
  choice: busquem
  rationale: O verbo דרשׁ pode significar “buscar” ou “consultar”. Aqui, tendo um santuário como objeto, “buscar” preserva o sentido religioso de recorrer ao local para culto ou auxílio e mantém a ligação com a exortação próxima a buscar o SENHOR.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: É o nome próprio da cidade-santuário; usa-se a forma tradicional em português, sem traduzir literalmente “casa de Deus”.
- source_word: תָבֹאוּ
  choice: entrem
  rationale: Com Gilgal como destino, “entrem” expressa naturalmente a ideia de chegar e ingressar no centro de culto.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Nome próprio de lugar, mantido na forma tradicional em português.
- source_word: תַעֲבֹרוּ
  choice: atravessem até
  rationale: עבר tem o sentido concreto de atravessar ou passar. A formulação conserva essa força, em vez de reduzi-la simplesmente a “ir”, embora o percurso exato não seja especificado.
- source_word: בְאֵר שֶׁבַע
  choice: Berseba
  rationale: Forma tradicional portuguesa do nome próprio do lugar.
- source_word: גָּלֹה יִגְלֶה
  choice: certamente irá para o exílio
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza. A tradução conserva tanto a ênfase quanto o tema profético do exílio.
- source_word: יְהִיֶה לְאָוֶן
  choice: se tornará em nada
  rationale: אָוֶן pode indicar nulidade, perversidade ou desgraça. “Em nada” comunica a ruína e a perda de valor sem restringir indevidamente a ambiguidade lexical; o possível jogo de palavras é registrado em nota.
theological_decisions:
- issue: O destino de Betel na expressão לְאָוֶן
  choice: Betel se tornará em nada
  alternative: Betel se tornará perversidade; Betel se tornará desgraça; Betel se tornará Bete-Áven
  rationale: O hebraico provavelmente combina a ideia de nulidade, maldade ou desgraça com uma alusão polêmica a Bete-Áven. O texto principal mantém uma leitura clara de juízo e ruína, enquanto a nota preserva o jogo de palavras e a amplitude semântica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os imperativos no plural são vertidos pela forma corrente com “vocês” subentendido. Mantêm-se os nomes geográficos tradicionais Betel, Gilgal e Berseba.
