  text: הֲ/לֹא חֹ֛שֶׁךְ י֥וֹם יְהוָ֖ה וְ/לֹא א֑וֹר וְ/אָפֵ֖ל וְ/לֹא נֹ֥גַֽהּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/020.yaml
  text: Is not the day of Yahweh darkness[a], and not light, and gloom with no brightness in it?
translation:
  language: pt
  text: Não é o dia de Yahweh escuridão, e não luz; trevas, sem brilho algum nele?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: Não é
  rationale: Mantém a forma de pergunta retórica, que espera resposta afirmativa, sem convertê-la numa afirmação explícita.
- source_word: חֹשֶׁךְ
  choice: escuridão
  rationale: Reproduz o substantivo hebraico e estabelece naturalmente o contraste com “luz”.
- source_word: יוֹם יְהוָה
  choice: o dia de Yahweh
  rationale: Preserva a expressão profética e apresenta יְהוָה como nome próprio, sem substituí-lo por um título.
- source_word: וְלֹא אוֹר
  choice: e não luz
  rationale: Conserva a negação repetida e o paralelismo enfático do hebraico.
- source_word: וְאָפֵל
  choice: trevas densas
  rationale: Expressa a intensificação de אָפֵל em português natural; a coordenação assindética após a primeira oração evita uma sequência artificial de conjunções.
- source_word: וְלֹא נֹגַהּ לוֹ
  choice: sem nenhum clarão nele
  rationale: “Clarão” comunica brilho ou luminosidade perceptível, e “nele” retoma naturalmente “o dia”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal e segue a camada de consulta fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação conserva a pergunta retórica, a antítese escuridão/luz e o acúmulo poético de imagens sombrias.
