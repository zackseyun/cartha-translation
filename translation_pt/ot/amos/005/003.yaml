  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָ/עִ֛יר הַ/יֹּצֵ֥את אֶ֖לֶף תַּשְׁאִ֣יר מֵאָ֑ה וְ/הַ/יּוֹצֵ֥את מֵאָ֛ה תַּשְׁאִ֥יר עֲשָׂרָ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/003.yaml
  text: 'For thus says the Lord GOD: The city that marches out a thousand will have a hundred left[a], and the one that marches out a hundred will have ten left, for the house of Israel.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: A cidade que sair com mil homens ficará com cem[a], e a que sair com cem ficará com dez, para a casa de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A cidade que sai mil ... e a que sai cem”. O verbo hebraico significa literalmente “sair” e, neste contexto, provavelmente se refere à saída de um contingente para a batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Preserva a ligação discursiva de כִּי e a fórmula profética corrente, em português natural e solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico e mantém Yahweh como nome divino, sem produzir a repetição artificial «Senhor SENHOR».
- source_word: הָעִיר
  choice: A cidade
  rationale: O substantivo é definido no hebraico e designa a comunidade urbana responsável pelo contingente militar.
- source_word: הַיֹּצֵאת אֶלֶף
  choice: que sair com mil homens
  rationale: O particípio significa literalmente «que sai»; o contexto numérico indica uma saída militar. «Com mil homens» torna explícito que se trata do contingente, sem atribuir ao verbo o sentido mais específico de marchar.
- source_word: תַּשְׁאִיר מֵאָה
  choice: ficará com cem
  rationale: O hifil de שׁאר exprime deixar/restar. Com «cidade» como sujeito, «ficará com cem» comunica naturalmente o número de sobreviventes restantes.
- source_word: וְהַיּוֹצֵאת מֵאָה
  choice: e a que sair com cem
  rationale: Mantém a elipse do substantivo «cidade» presente no hebraico e usa a forma feminina para retomar seu referente.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: Conserva a designação nacional e pactual «casa de Israel» e a relação ampla expressa pela preposição לְ.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: Mantém distintamente o título אֲדֹנָי e o nome pactual יהוה. A alternativa tradicional evita a duplicação de «Senhor», mas substitui o nome divino por um título.
- issue: Natureza dos números restantes
  choice: ficará com cem / ficará com dez
  alternative: deixará cem / deixará dez
  rationale: O contexto anuncia devastação militar e sugere sobreviventes, mas o texto diz apenas que esses números serão deixados. A formulação escolhida preserva essa tensão sem acrescentar explicitamente «sobreviventes».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «sair com mil homens» explicita apenas o referente militar implícito nos números; a nota registra uma tradução mais formal. O marcador [a] aparece no texto principal.
