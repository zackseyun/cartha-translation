source:
  edition: WLC
  text: הָסֵ֥ר מֵ/עָלַ֖/י הֲמ֣וֹן שִׁרֶ֑י/ךָ וְ/זִמְרַ֥ת נְבָלֶ֖י/ךָ לֹ֥א אֶשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/023.yaml
  text: Take away from me the noise of your songs[a], and I will not listen to the melody of your harps.
translation:
  language: pt
  text: Afaste de mim o barulho das suas canções! Não ouvirei a música das suas harpas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liras”; o hebraico menciona um antigo instrumento de cordas cuja correspondência moderna exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Afaste
  rationale: O imperativo causativo exige que o som seja retirado da presença do falante. “Afaste” é direto, natural e preserva a força da ordem.
- source_word: מֵעָלַי
  choice: de mim
  rationale: Embora a expressão seja literalmente “de sobre mim”, “de mim” comunica com naturalidade a rejeição pessoal em português.
- source_word: הֲמוֹן
  choice: o barulho
  rationale: No contexto de culto rejeitado, o termo descreve som abundante e incômodo, não uma simples multidão. “Barulho” preserva a carga depreciativa.
- source_word: שִׁרֶיךָ
  choice: das suas canções
  rationale: Tradução direta do plural em construção, em linguagem corrente e digna.
- source_word: וְזִמְרַת
  choice: a música
  rationale: O substantivo pode indicar música, melodia ou execução musical. “Música” soa natural no paralelismo e evita repetir “canções”.
- source_word: נְבָלֶיךָ
  choice: das suas harpas
  rationale: נבל designa um antigo instrumento de cordas. “Harpa” é uma aproximação conhecida, mas a identificação moderna exata permanece incerta e é indicada em nota.
- source_word: לֹא אֶשְׁמָע
  choice: Não ouvirei
  rationale: A forma verbal negada expressa a recusa divina de dar ouvidos à música. “Não ouvirei” mantém a concisão e a força volitiva do hebraico.
theological_decisions:
- issue: Tom da rejeição divina ao culto
  choice: Repúdio direto, marcado por “barulho” e “Não ouvirei”
  alternative: Empregar termos mais neutros, como “som”, e traduzir apenas como incapacidade de ouvir
  rationale: O contexto imediato condena um culto separado da justiça. A formulação preserva a força profética sem acrescentar uma explicação doutrinária ao versículo.
translation_notes:
  register: Português moderno de ampla compreensão, com boa legibilidade brasileira. A ordem é enfática, mas não coloquial; a segunda frase conserva a recusa categórica do texto hebraico.
