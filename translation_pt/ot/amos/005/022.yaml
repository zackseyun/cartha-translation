reference: Amos 5:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אִם תַּעֲלוּ לִ֥/י עֹל֛וֹת וּ/מִנְחֹתֵי/כֶ֖ם לֹ֣א אֶרְצֶ֑ה וְ/שֶׁ֥לֶם מְרִיאֵי/כֶ֖ם לֹ֥א אַבִּֽיט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/022.yaml
  text: For even if you offer up to me burnt offerings and your grain offerings[a], I will not accept them; and I will not look upon the peace offerings of your fattened animals.
translation:
  language: pt
  text: Pois, ainda que vocês me ofereçam holocaustos e suas ofertas de cereal, não os aceitarei; nem olharei para as ofertas de comunhão[a] de seus animais cevados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de paz”. O termo hebraico designa uma categoria específica de sacrifício associada ao bem-estar e à comunhão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, ainda que
  rationale: Mantém tanto a ligação explicativa com o contexto anterior quanto o valor concessivo da expressão hebraica.
- source_word: תַּעֲלוּ לִי
  choice: vocês me ofereçam
  rationale: Expressa naturalmente em português o uso causativo e sacrificial de עלה, sem reduzir a ação ao simples ato de trazer.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo consagrado em português para a oferta inteiramente queimada, preservando a categoria cultual específica.
- source_word: וּמִנְחֹתֵיכֶם
  choice: e suas ofertas de cereal
  rationale: No contexto sacrificial, מִנְחָה designa uma oferta vegetal, normalmente de cereal; a formulação é clara e específica.
- source_word: לֹא אֶרְצֶה
  choice: não os aceitarei
  rationale: Comunica a recusa do favor ou da aceitação divina em relação aos sacrifícios; o pronome retoma naturalmente os holocaustos e as ofertas.
- source_word: וְשֶׁלֶם
  choice: nem ... as ofertas de comunhão
  rationale: Representa a categoria sacrificial ligada ao bem-estar e à refeição compartilhada, em linguagem mais transparente ao leitor moderno do que uma tradução puramente tradicional.
- source_word: מְרִיאֵיכֶם
  choice: de seus animais cevados
  rationale: O substantivo se refere a animais engordados para o sacrifício; “cevados” é preciso, digno e corrente em contexto agropecuário.
- source_word: לֹא אַבִּיט
  choice: nem olharei para
  rationale: Preserva a metáfora visual do hebraico e, no contexto, implica que Deus não lhes dará atenção favorável.
theological_decisions:
- issue: Preservação das categorias sacrificiais específicas sem importar uma interpretação doutrinária posterior
  choice: Manter “holocaustos”, “ofertas de cereal” e “ofertas de comunhão”.
  alternative: Generalizar como “sacrifícios” ou empregar “ofertas pacíficas”.
  rationale: O texto menciona categorias cultuais distintas e declara que Deus as rejeita neste contexto. Mantê-las preserva a precisão e a tensão profética; a nota registra a alternativa lexical legítima para שֶׁלֶם.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção concessiva natural. “Vocês” favorece legibilidade brasileira sem regionalismo excessivo; “holocaustos” conserva a terminologia bíblica estabelecida, e a nota esclarece a alternativa para a oferta de comunhão.
