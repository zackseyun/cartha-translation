id: AMO.5.12
reference: Amos 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י יָדַ֨עְתִּי֙ רַבִּ֣ים פִּשְׁעֵי/כֶ֔ם וַ/עֲצֻמִ֖ים חַטֹּֽאתֵי/כֶ֑ם צֹרְרֵ֤י צַדִּיק֙ לֹ֣קְחֵי כֹ֔פֶר וְ/אֶבְיוֹנִ֖ים בַּ/שַּׁ֥עַר הִטּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/012.yaml
  text: For I know how many your transgressions are, and how great your sins are—oppressors of the righteous[a], takers of a bribe[b], and those who turn aside the needy in the gate.
translation:
  language: pt
  text: Pois eu sei como são numerosas as suas transgressões e como são graves os seus pecados — vocês oprimem o justo, aceitam suborno e afastam os necessitados[a] no portão da cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “negam justiça aos necessitados no portão da cidade”.'
    reason: lexical_alternative
  - marker: b
    text: O portão da cidade era o lugar onde se tratavam processos judiciais e se tomavam decisões públicas.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência precedente e preserva com naturalidade a função explicativa da conjunção.
- source_word: יָדַעְתִּי
  choice: eu sei
  rationale: O perfeito qal expressa aqui o conhecimento seguro e presente de Deus; o presente é a forma natural em português.
- source_word: רַבִּים פִּשְׁעֵיכֶם
  choice: como são numerosas as suas transgressões
  rationale: Mantém a construção enfática com o adjetivo anteposto no hebraico e traduz פשׁע como violações deliberadas, sem reduzi-lo ao termo mais geral 'pecados'.
- source_word: וַעֲצֻמִים חַטֹּאתֵיכֶם
  choice: e como são graves os seus pecados
  rationale: עֲצֻמִים indica força, peso ou magnitude; 'graves' comunica a severidade dos pecados, e não apenas sua quantidade.
- source_word: צֹרְרֵי צַדִּיק
  choice: vocês que oprimem o justo
  rationale: O particípio descreve ação hostil contínua no contexto de injustiça social. 'O justo' preserva o singular genérico e a dimensão moral e judicial de צַדִּיק.
- source_word: לֹקְחֵי כֹפֶר
  choice: aceitam suborno
  rationale: Embora כֹפֶר também possa significar resgate ou pagamento, o contexto judicial favorece 'suborno'. A forma verbal é mais natural em português dentro da série paralela.
- source_word: וְאֶבְיוֹנִים
  choice: os necessitados
  rationale: Designa pessoas pobres e socialmente vulneráveis; 'necessitados' conserva essa amplitude.
- source_word: בַּשַּׁעַר
  choice: no portão da cidade
  rationale: 'Explicita de modo breve o referente cultural: o portão urbano era local de julgamentos e decisões públicas.'
- source_word: הִטּוּ
  choice: afastam
  rationale: Preserva a imagem básica do hiphil de נטה, 'fazer desviar/afastar', sem resolver no corpo do texto toda a implicação jurídica; a alternativa contextual é registrada em nota.
theological_decisions:
- issue: Sentido de צַדִּיק no contexto profético de injustiça social e judicial
  choice: o justo
  alternative: o inocente; aquele que tem razão
  rationale: '''O justo'' conserva o alcance moral e jurídico do termo, enquanto ''o inocente'' restringiria a referência apenas à situação forense.'
- issue: Implicação jurídica de הִטּוּ
  choice: afastam os necessitados
  alternative: negam justiça aos necessitados
  rationale: A tradução principal preserva a metáfora verbal e sua relativa abertura semântica; a nota apresenta a leitura jurídica fortemente sugerida pelo contexto do portão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção enfática 'como são numerosas... como são graves' reflete a ordem marcada do hebraico. O travessão introduz a caracterização dos responsáveis sem transformar os particípios em um vocativo isolado. A expressão cultural 'portão da cidade' é mantida e explicada em nota.
