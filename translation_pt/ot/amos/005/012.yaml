revisions:
- from: Pois eu sei como são numerosas as suas transgressões e como são graves os seus pecados — vocês que oprimem o justo, aceitam suborno e afastam os necessitados[b] no portão da cidade.[a]
  to: Pois eu sei como são numerosas as suas transgressões e como são graves os seus pecados — vocês oprimem o justo, aceitam suborno e afastam os necessitados[a] no portão da cidade.[b]
  rationale: A revisão resolve a transição sintática criada por “vocês que”, mantendo a acusação direta e a força dos particípios hebraicos por meio de verbos paralelos no presente. Os marcadores foram renumerados conforme a ordem em que aparecem. Não há alteração interpretativa material.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:01Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a conjunção explicativa, o conhecimento divino, a multiplicidade das transgressões, a gravidade dos pecados e a sequência de abusos sociais e judiciais. “O justo”, “suborno”, “necessitados” e “portão da cidade” são escolhas apropriadas. “Afastam os necessitados” preserva a imagem verbal de הִטּוּ, e a nota registra legitimamente a implicação judicial.
  naturalness: A formulação “— vocês que oprimem ...” após uma declaração sobre “as suas transgressões” produz uma mudança sintática pouco estável entre caracterização e vocativo. Convém explicitar a sequência verbal dirigida aos destinatários. Também é preferível que os marcadores sejam apresentados em ordem de ocorrência no versículo.
  terminology: A terminologia é consistente e não impõe leitura doutrinária. “Transgressões” para פשעים e “pecados” para חטאות preservam a distinção geral do hebraico; “graves” é uma boa representação contextual de עצומים. “O justo” mantém a amplitude moral e forense de צדיק.
  issues:
  - severity: low
    issue: Construção sintática após o travessão
    rationale: “Vocês que oprimem...” funciona de modo algo fragmentário depois de “eu sei como são...”. A forma verbal explícita conserva o valor participial habitual e produz português mais claro.
  - severity: low
    issue: Ordem dos marcadores de nota
    rationale: A nota lexical aparece antes da nota cultural no corpo, mas recebe o marcador b; renumerar os marcadores melhora a navegação sem alterar o sentido.
  revised_text: Pois eu sei como são numerosas as suas transgressões e como são graves os seus pecados — vocês oprimem o justo, aceitam suborno e afastam os necessitados[a] no portão da cidade.[b]
  revised_footnotes:
