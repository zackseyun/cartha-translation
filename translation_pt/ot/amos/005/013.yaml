  text: לָ/כֵ֗ן הַ/מַּשְׂכִּ֛יל בָּ/עֵ֥ת הַ/הִ֖יא יִדֹּ֑ם כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/013.yaml
  text: Therefore the prudent man keeps silent at that time[a], for it is an evil time.
translation:
  language: pt
  text: Por isso, naquele tempo, o prudente[a] se cala, pois é um tempo mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sábio” ou “aquele que tem discernimento”; o hebraico está no masculino singular e é usado aqui em sentido representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferida da denúncia anterior.
- source_word: הַמַּשְׂכִּיל
  choice: o prudente
  rationale: O particípio hifil de שכל designa alguém que demonstra entendimento e age com discernimento; “o prudente” preserva o caráter substantivado e o masculino singular do hebraico.
- source_word: בָּעֵת הַהִיא
  choice: naquele tempo
  rationale: Retoma o período específico descrito no contexto e corresponde de modo idiomático à expressão temporal hebraica.
- source_word: יִדֹּם
  choice: se cala
  rationale: O verbo דמם indica ficar ou permanecer em silêncio; o presente português comunica a conduta característica ou esperada nesse tempo.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira concisa a razão pela qual o prudente se cala.
- source_word: עֵת רָעָה
  choice: um tempo mau
  rationale: Mantém a formulação compacta do hebraico e o peso moral e calamitoso de רָעָה, sem reduzi-lo a mero inconveniente.
- source_word: הִיא
  choice: é
  rationale: O pronome feminino retoma עֵת; em português, a referência é naturalmente incorporada em “é um tempo mau”.
theological_decisions:
- issue: Representação de gênero em הַמַּשְׂכִּיל
  choice: o prudente
  alternative: a pessoa prudente; quem tem discernimento
  rationale: O hebraico emprega o masculino singular com provável sentido representativo. A tradução conserva a forma masculina sem restringir a afirmação exclusivamente aos homens, e a nota explicita esse alcance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Por isso” e “pois” preservam a progressão lógica sem arcaísmo; “tempo mau” mantém a concisão e a tensão moral do original.
