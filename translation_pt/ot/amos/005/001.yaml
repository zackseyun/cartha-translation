  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר אָנֹכִ֜י נֹשֵׂ֧א עֲלֵי/כֶ֛ם קִינָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/001.yaml
  text: 'Hear this word that I am taking up over you as a lament[a], O house of Israel:'
translation:
  language: pt
  text: 'Ouçam esta palavra que entoo sobre vocês como lamentação[a], ó casa de Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que profiro a respeito de vocês como canto fúnebre”. O hebraico diz literalmente: “que levanto sobre vocês uma lamentação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע. “Ouçam” conserva de modo natural e direto a força da convocação profética.
- source_word: הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: דבר pode significar “palavra” ou “mensagem”; “esta palavra” preserva a fórmula profética e a construção do original.
- source_word: אֲשֶׁר אָנֹכִי נֹשֵׂא
  choice: que levanto
  rationale: נשא significa literalmente “levantar” ou “carregar” e, com קינה, forma a expressão idiomática de entoar uma lamentação. “Levanto” mantém a imagem hebraica, explicada na nota.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: A preposição על, no contexto de uma lamentação, pode indicar algo pronunciado sobre alguém e também sugerir força adversativa. “Sobre vocês” conserva a ambiguidade sem intensificá-la para “contra vocês”.
- source_word: קִינָה
  choice: como lamentação
  rationale: קינה designa uma lamentação, muitas vezes um canto fúnebre. “Como lamentação” produz sintaxe portuguesa clara com “levanto” e mantém o tom solene.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: A expressão funciona como vocativo. “Ó” marca claramente a interpelação solene, e “casa de Israel” preserva a metáfora coletiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, solene e acessível, com vocabulário profético tradicional sem arcaísmo excessivo. A formulação conserva a imagem hebraica de “levantar” uma lamentação e mantém a possível nuance entre algo pronunciado sobre Israel e contra Israel.
