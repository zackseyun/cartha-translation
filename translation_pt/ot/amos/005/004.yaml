base_translation:
  language: en
  yaml_path: translation/ot/amos/005/004.yaml
  text: 'For thus says Yahweh to the house of Israel: Seek me and live[a].'
translation:
  language: pt
  text: 'Pois assim diz Yahweh à casa de Israel: “Busquem-me e vivam[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Busquem-me para que vivam”, ou: “Busquem-me, e vocês viverão”. O hebraico pode ser entendido como uma ordem urgente acompanhada de um resultado prometido.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação ligada ao contexto anterior e conserva com naturalidade a força conectiva do hebraico.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Reproduz a fórmula profética de mensageiro em registro solene e corrente; o perfeito אָמַר tem aqui função performativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à casa de Israel
  rationale: Mantém a expressão corporativa e pactual do original, enquanto a crase expressa naturalmente o destinatário em português.
- source_word: דִּרְשׁוּנִי
  choice: Busquem-me
  rationale: Neste contexto profético, דרש indica voltar-se para Yahweh e buscá-lo, não apenas consultá-lo ou pedir informações.
- source_word: וִחְיוּ
  choice: e vivam
  rationale: Conserva a sequência hebraica de imperativo com waw mais imperativo e não define em excesso se a vida é ordem, finalidade ou resultado prometido.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal e pactual em vez de substituí-lo por um título.
- issue: Força de “Busquem-me e vivam”
  choice: Convocação direta que mantém aberta a relação entre buscar Yahweh e viver
  alternative: “Busquem-me para que vivam” ou “Busquem-me, e vocês viverão”
  rationale: A construção hebraica admite uma ordem urgente associada à vida como finalidade ou resultado, sem delimitar aqui se a vida é apenas sobrevivência física ou possui alcance mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “busquem/vivam” corresponde ao destinatário coletivo, a casa de Israel. As aspas demarcam a fala divina introduzida pela fórmula profética.
