    rationale: A decisão lexical registra «sombra da morte» como alternativa relevante para צַלְמָוֶת, e as notas de tradução indicam expressamente que o marcador [b] deve acompanhar essa expressão. A nota atual sobre YHWH está corretamente ancorada em «Yahweh», mas não substitui essa nota lexical.
  - severity: low
    issue: «Fez» destoa da cadeia de particípios e presentes.
    rationale: עֹשֵׂה é um particípio que introduz a caracterização contínua de Yahweh, paralela a «transforma», «escurece», «convoca» e «derrama». «Faz» preserva melhor esse efeito em português.
