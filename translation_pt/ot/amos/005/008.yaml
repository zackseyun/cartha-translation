revisions:
- from: Aquele que fez as Plêiades e Órion, que transforma a escuridão profunda em manhã e escurece o dia até virar noite, que convoca as águas do mar e as derrama sobre a face da terra — Yahweh é o seu nome.[a]
  to: Aquele que faz as Plêiades e Órion, que transforma a escuridão profunda[b] em manhã e escurece o dia até fazê-lo noite, que convoca as águas do mar e as derrama sobre a face da terra — Yahweh é o seu nome.[a]
  rationale: A revisão restaura a nota lexical ausente e harmoniza o primeiro verbo com a série de particípios hebraicos. A formulação para a passagem do dia à noite conserva o valor causativo de הֶחְשִׁיךְ e o tom poético do versículo.
