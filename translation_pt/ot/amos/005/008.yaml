  source_fidelity: A tradução transmite adequadamente a sequência de ações divinas, os referentes astronômicos, a imagem das águas do mar derramadas sobre a terra e o nome divino. Convém, porém, manter em português a força descritiva dos particípios hebraicos com «faz», em vez de iniciar com o pretérito «fez», que quebra a série de presentes.
  naturalness: O português é claro, poético e amplamente compreensível. «Escurece o dia até virar noite» é inteligível, mas «até fazê-lo noite» deixa mais explícita a ação causativa sem perder a naturalidade.
  terminology: «Plêiades», «Órion», «escuridão profunda», «águas do mar», «face da terra» e «Yahweh» são escolhas adequadas. A alternativa lexical tradicional para צַלְמָוֶת deve constar em nota, conforme a própria decisão lexical do rascunho e a trilha de auditoria.
  issues:
