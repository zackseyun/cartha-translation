  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֹשֵׂ֨ה כִימָ֜ה וּ/כְסִ֗יל וְ/הֹפֵ֤ךְ לַ/בֹּ֨קֶר֙ צַלְמָ֔וֶת וְ/י֖וֹם לַ֣יְלָה הֶחְשִׁ֑יךְ הַ/קּוֹרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/008.yaml
  text: He who made the Pleiades and Orion[a], and turns deep darkness into morning, and darkens day into night[b], who calls for the waters of the sea and pours them out over the face of the earth—Yahweh is his name.
translation:
  language: pt
  text: Aquele que faz as Plêiades e Órion, que transforma a escuridão profunda[b] em manhã e escurece o dia até fazê-lo noite, que convoca as águas do mar e as derrama sobre a face da terra — Yahweh é o seu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também vertido como «Javé».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «a sombra da morte».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: Aquele que fez
  rationale: O particípio qal masculino singular é substantivado e introduz uma descrição de Deus. O pretérito comunica naturalmente sua ação criadora, embora o particípio também possa sugerir atividade característica.
- source_word: כִימָה וּכְסִיל
  choice: as Plêiades e Órion
  rationale: No paralelismo astronômico, os termos designam plausivelmente o aglomerado das Plêiades e a constelação de Órion; os nomes correntes em português tornam os referentes claros.
- source_word: וְהֹפֵךְ
  choice: que transforma
  rationale: Preserva a ideia de reversão expressa pelo particípio e soa natural com a passagem da escuridão para a manhã.
- source_word: צַלְמָוֶת
  choice: a escuridão profunda
  rationale: Neste contexto cósmico de manhã, dia e noite, o termo indica trevas intensas. A expressão também pode carregar a ideia tradicional de 'sombra da morte', registrada em nota.
- source_word: וְיוֹם לַיְלָה הֶחְשִׁיךְ
  choice: e escurece o dia até virar noite
  rationale: Mantém o valor causativo de החשיך e expressa de modo idiomático a transformação do dia em noite.
- source_word: הַקּוֹרֵא לְמֵי הַיָּם
  choice: que convoca as águas do mar
  rationale: '''Convoca'' comunica a autoridade divina de chamar ou ordenar que as águas venham, sem sugerir mero ato de nomeá-las.'
- source_word: וַיִּשְׁפְּכֵם
  choice: e as derrama
  rationale: O pronome feminino plural retoma naturalmente 'as águas' em português, e o presente harmoniza com a cadeia descritiva de ações divinas.
- source_word: עַל־פְּנֵי הָאָרֶץ
  choice: sobre a face da terra
  rationale: Conserva a imagem hebraica em linguagem elevada, mas facilmente compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal indicado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título; 'Javé' é uma adaptação portuguesa possível, mas a forma escolhida mantém a transliteração especificada pela camada editorial.
- issue: Sentido de צַלְמָוֶת
  choice: escuridão profunda
  alternative: sombra da morte
  rationale: A oposição cósmica entre manhã, dia e noite favorece o sentido de trevas densas, sem excluir a associação tradicional com morte, preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência poética. A sintaxe encadeia os atos divinos e culmina na declaração do nome. O marcador [b] deve acompanhar 'escuridão profunda' no texto principal.
