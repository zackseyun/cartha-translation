  text: הַ/זְּבָחִ֨ים וּ/מִנְחָ֜ה הִֽגַּשְׁתֶּם לִ֧/י בַ/מִּדְבָּ֛ר אַרְבָּעִ֥ים שָׁנָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/025.yaml
  text: Did you bring me sacrifices and offerings in the wilderness for forty years[a], O house of Israel?
translation:
  language: pt
  text: Vocês me trouxeram sacrifícios e ofertas no deserto durante quarenta anos,[a] ó casa de Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrifícios e ofertas de cereal”. A palavra hebraica traduzida como “ofertas” pode designar especificamente ofertas de cereal em contextos de culto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּבָחִים
  choice: sacrifícios
  rationale: זֶבַח designa normalmente um sacrifício, muitas vezes envolvendo abate; “sacrifícios” é natural e suficientemente preciso em português.
- source_word: וּמִנְחָה
  choice: e ofertas
  rationale: מִנְחָה pode significar dádiva ou tributo e, em contexto cultual, uma oferta de cereal. “Ofertas” preserva no texto a amplitude lexical, enquanto a nota registra a acepção mais específica.
- source_word: הִגַּשְׁתֶּם
  choice: vocês trouxeram
  rationale: O hifil de נגשׁ indica trazer ou apresentar ofertas. “Trouxeram” é idiomático e mantém a ação da pergunta retórica.
- source_word: לִי
  choice: a mim
  rationale: A colocação enfática “Foi a mim que...” expressa com naturalidade o destinatário e ajuda a preservar a força contestadora da pergunta sem explicitar uma resposta.
- source_word: בַמִּדְבָּר
  choice: no deserto
  rationale: No contexto da peregrinação de Israel, “deserto” é a forma corrente e imediatamente compreensível em português para מִדְבָּר.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: “Durante” torna clara a duração indicada pela expressão hebraica.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Mantém a fórmula profética tradicional e sua função vocativa, sem substituí-la interpretativamente por “povo de Israel”.
theological_decisions:
- issue: Força retórica da pergunta no contexto
  choice: Manter uma pergunta retórica incisiva, sem declarar a resposta implícita.
  alternative: 'Traduzir como pergunta neutra ou parafrasear: “Vocês não me trouxeram...”'
  rationale: A construção interrogativa hebraica e a repreensão no contexto sugerem uma resposta negativa ou contestadora, mas o texto não a formula. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação “Foi a mim que...” mantém a ênfase retórica; “ó casa de Israel” preserva o tom profético. O marcador [a] aparece no texto principal.
