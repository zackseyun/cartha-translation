source:
  edition: WLC
  text: דִּרְשׁ֥וּ אֶת יְהוָ֖ה וִֽ/חְי֑וּ פֶּן יִצְלַ֤ח כָּ/אֵשׁ֙ בֵּ֣ית יוֹסֵ֔ף וְ/אָכְלָ֥ה וְ/אֵין מְכַבֶּ֖ה לְ/בֵֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/006.yaml
  text: Seek Yahweh and live[a], lest he break out like fire in the house of Joseph, and it consume[b], with no one to quench it for Bethel.
translation:
  language: pt
  text: Busquem a Yahweh e vivam,[a] para que ele não irrompa como fogo na casa de José e a consuma, sem que haja em Betel quem o apague.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Busquem a Yahweh para que vivam”. A sequência hebraica também pode apresentar a vida como resultado da busca.
    reason: alternative_reading
  - marker: b
    text: 'O sujeito do verbo “irromper” não está expresso no hebraico; provavelmente é Yahweh, mencionado na oração anterior, mas também se pode entender: “para que não irrompa como fogo”. Betel era um importante santuário do reino do norte. Mais literalmente, o final diz: “e não haja quem apague para Betel”.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Busquem
  rationale: O imperativo plural de דרשׁ, neste contexto profético e pactual, indica voltar-se para Deus e procurá-lo, não apenas consultá-lo. “Busquem” é direto e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וִחְיוּ
  choice: e vivam
  rationale: Preserva a sequência breve de imperativos do hebraico e sua força de resultado ou consequência.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz de modo idiomático em português a consequência indesejada contra a qual se adverte.
- source_word: יִצְלַח
  choice: ele não irrompa
  rationale: Com a comparação ao fogo, o verbo tem o sentido de avançar ou romper impetuosamente. O pronome explicita a leitura mais provável de Yahweh como sujeito, sem esconder a alternativa na nota.
- source_word: כָּאֵשׁ
  choice: como fogo
  rationale: Reproduz de maneira natural a comparação hebraica.
- source_word: בֵּית יוֹסֵף
  choice: a casa de José
  rationale: Mantém a designação profética da população ou do reino do norte, especialmente Efraim.
- source_word: וְאָכְלָה
  choice: e a consuma
  rationale: O verbo feminino concorda com “fogo” no hebraico; o objeto elíptico é naturalmente entendido como a casa de José e é expresso pelo pronome para clareza em português.
- source_word: וְאֵין מְכַבֶּה
  choice: sem que haja ... quem o apague
  rationale: Comunica a ausência de alguém que possa extinguir o fogo; “apagar” é corrente e claro em português.
- source_word: לְבֵית אֵל
  choice: em Betel
  rationale: Betel é aqui o nome do importante santuário do reino do norte. Embora o hebraico use לְ e permita uma tradução mais formal como “para Betel”, “em Betel” comunica naturalmente a provável esfera em que não haverá quem apague o fogo.
theological_decisions:
- issue: Sujeito implícito de יִצְלַח
  choice: 'Yahweh é o sujeito: “ele não irrompa como fogo”'
  alternative: 'O fogo é o sujeito: “não irrompa um fogo” ou “não irrompa como fogo”'
  rationale: Yahweh é o referente explícito mais próximo, e a linguagem profética frequentemente o apresenta irrompendo em juízo como fogo. A ambiguidade gramatical genuína é registrada em nota.
- issue: Sentido de Betel
  choice: Nome geográfico do centro religioso do reino do norte
  alternative: A expressão comum “casa de Deus”
  rationale: No contexto de Amós, Betel é repetidamente um lugar histórico e religioso específico sujeito ao juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva a concisão e a imagem profética do hebraico; as ambiguidades relevantes são preservadas em notas.
