source:
  edition: WLC
  text: שָׂנֵ֥אתִי מָאַ֖סְתִּי חַגֵּי/כֶ֑ם וְ/לֹ֥א אָרִ֖יחַ בְּ/עַצְּרֹֽתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/021.yaml
  text: I hate[a], I reject your festivals, and I will not delight in your solemn assemblies.
translation:
  language: pt
  text: Odeio e rejeito as suas festas; não me agrado das suas assembleias solenes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não sentirei o cheiro”; isto é, não as aceitarei nem terei prazer nelas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Odeio
  rationale: O perfeito qal na declaração profética expressa a forte aversão pessoal de YHWH; o presente comunica naturalmente em português a força atual e enfática da afirmação.
- source_word: מָאַסְתִּי
  choice: rejeito
  rationale: O verbo indica recusar algo por considerá-lo inaceitável. “Rejeito” preserva essa repudiação deliberada sem duplicar a nuance emocional já expressa por “odeio”.
- source_word: חַגֵּיכֶם
  choice: as suas festas
  rationale: חַג designa celebrações religiosas, muitas vezes festas de peregrinação. “Festas” é claro, natural e suficientemente amplo no contexto.
- source_word: וְלֹא
  choice: não
  rationale: A negação introduz a última afirmação da denúncia. O ponto e vírgula torna natural em português a ligação coordenada que o hebraico faz com וְ.
- source_word: אָרִיחַ
  choice: não me agrado
  rationale: O verbo significa literalmente “cheirar”, mas, na linguagem cultual, comunica aceitar ou apreciar o aroma. Como o complemento aqui são as assembleias, “não me agrado” transmite o sentido idiomático sem tornar a frase obscura; a imagem literal fica registrada em nota.
- source_word: בְּעַצְּרֹתֵיכֶם
  choice: das suas assembleias solenes
  rationale: עֲצֶרֶת denota uma reunião formal, especialmente cultual. “Assembleias solenes” preserva tanto o caráter coletivo quanto o religioso.
theological_decisions:
- issue: Linguagem cultual antropomórfica sobre a aceitação divina
  choice: Traduzir o idioma de cheirar como “não me agrado” no texto principal
  alternative: Traduzir literalmente como “não sentirei o cheiro nas suas assembleias solenes”
  rationale: A imagem do olfato vem da linguagem sacrificial e expressa prazer ou aceitação divina. A tradução idiomática mantém a força da rejeição sem obscurecer o sentido, enquanto a nota preserva a formulação concreta do hebraico.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A coordenação enfática “Odeio e rejeito” mantém a contundência do hebraico; “assembleias solenes” conserva o registro cultual.
