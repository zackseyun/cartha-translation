  text: וְ/יִגַּ֥ל כַּ/מַּ֖יִם מִשְׁפָּ֑ט וּ/צְדָקָ֖ה כְּ/נַ֥חַל אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/024.yaml
  text: But let justice roll down like waters[b][a], and righteousness like an ever-flowing stream.
translation:
  language: pt
  text: 'Mas corra a justiça como as águas,

    e a retidão, como um ribeiro perene.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִגַּל
  choice: Mas corra
  rationale: O imperfeito de valor volitivo é expresso naturalmente pelo presente do subjuntivo em português. “Corra” preserva o movimento vigoroso da imagem aquática; “mas” comunica o contraste com o culto rejeitado nos versículos anteriores.
- source_word: כַּמַּיִם
  choice: como as águas
  rationale: Mantém o plural morfológico hebraico e sua imagem de abundância e movimento, em linguagem poética natural.
- source_word: מִשְׁפָּט
  choice: o juízo
  rationale: “Juízo” conserva a dimensão de decisões e práticas públicas conformes ao direito, além de distinguir o termo de צְדָקָה. “Justiça” também seria possível, mas repetiria lexicalmente o segundo membro em português.
- source_word: וּצְדָקָה
  choice: a justiça
  rationale: Expressa a conduta reta e a ordem moral e social requerida, sem restringir o termo a uma formulação doutrinária específica.
- source_word: כְּנַחַל
  choice: como um ribeiro
  rationale: “Ribeiro” comunica com clareza um curso de água e combina naturalmente com a ideia contextual de permanência. Evita o tecnicismo “uádi” e a força excessiva de “torrente”.
- source_word: אֵיתָן
  choice: que nunca seca
  rationale: No contexto de נַחַל, explicita de modo idiomático a ideia de um curso de água duradouro ou perene, em contraste com os cursos sazonais que secam.
theological_decisions:
- issue: Tradução do par ético מִשְׁפָּט / צְדָקָה
  choice: juízo ... justiça
  alternative: justiça ... retidão
  rationale: A opção mantém distintos os dois termos hebraicos e preserva tanto a dimensão pública e jurídica quanto a dimensão moral do chamado profético, sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão internacional. O paralelismo hebraico foi preservado em dois versos; evitou-se vocabulário técnico.
