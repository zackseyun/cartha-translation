  text: וּ/בְ/כָל כְּרָמִ֖ים מִסְפֵּ֑ד כִּֽי אֶעֱבֹ֥ר בְּ/קִרְבְּ/ךָ֖ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/017.yaml
  text: And in all the vineyards there will be wailing[b][a], for I will pass through your midst," says Yahweh.
translation:
  language: pt
  text: E em todas as vinhas haverá lamentação[a], pois passarei pelo meio de vocês[b] — diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pranto” ou “luto”. O termo hebraico se refere à manifestação pública de pesar, muitas vezes expressa em voz alta.
    reason: lexical_alternative
  - marker: b
    text: A expressão “passarei pelo meio de vocês” pode evocar linguagem bíblica de visitação divina em juízo; compare Êxodo 12:12. O próprio versículo não torna explícita essa alusão.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל
  choice: E em todas
  rationale: Mantém a conjunção, a localização e a abrangência distributiva da expressão hebraica.
- source_word: כְּרָמִים
  choice: as vinhas
  rationale: O plural designa os locais de cultivo da uva; o artigo soa natural em português neste contexto.
- source_word: מִסְפֵּד
  choice: haverá lamentação
  rationale: O substantivo indica luto ou lamentação pública, muitas vezes audível; a forma verbal é suprida para produzir uma oração natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da lamentação, preservando de modo conciso o valor explicativo.
- source_word: אֶעֱבֹר
  choice: passarei
  rationale: Com a expressão locativa seguinte, comunica movimento através do meio do povo e conserva a possível ressonância de visitação divina em juízo.
- source_word: בְּקִרְבְּךָ
  choice: pelo meio de vocês
  rationale: Expressa naturalmente em português a ideia espacial. O sufixo hebraico é singular coletivo, dirigido a Israel; 'vocês' torna claro o referente coletivo sem perder o sentido.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: Emprega o presente convencional da fórmula profética e translitera o nome divino expresso no texto hebraico.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama; 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
- issue: Movimento divino em contexto de juízo
  choice: passarei pelo meio de vocês
  alternative: passarei entre vocês
  rationale: A formulação preserva a imagem espacial e a tensão de uma possível evocação do juízo do êxodo, sem declarar no texto principal uma alusão que não é explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos marcadores acompanha as expressões às quais cada nota se refere. 'Lamentação' preserva o caráter público do pesar sem soar excessivamente coloquial; 'pelo meio de vocês' comunica de modo natural o singular coletivo hebraico.
