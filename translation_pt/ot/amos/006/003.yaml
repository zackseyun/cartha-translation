  text: you who put far away the evil day and bring near the seat of violence[a][b].
translation:
  language: pt
  text: vocês que afastam o dia mau[a] e aproximam o assento da violência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adiam o dia da calamidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aproximam a sede da violência”, “o trono da violência” ou “o reinado da violência”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְנַדִּים
  choice: vocês que afastam
  rationale: O particípio dirige a acusação aos ouvintes e expressa a ação de pôr à distância ou relegar; “afastam” conserva a imagem concreta e a força acusatória.
- source_word: לְיוֹם רָע
  choice: o dia mau
  rationale: A expressão designa um dia vindouro de aflição ou calamidade. A formulação próxima ao hebraico mantém implícito o sentido profético de juízo.
- source_word: וַתַּגִּישׁוּן
  choice: e aproximam
  rationale: A forma causativa indica fazer chegar perto. “Aproximam” preserva o contraste irônico com “afastam”.
- source_word: שֶׁבֶת
  choice: o domínio
  rationale: Neste contexto, o termo pode indicar assento, sede ou exercício de governo. “Domínio” comunica naturalmente em português uma ordem estabelecida, sem especificar indevidamente um trono literal.
- source_word: חָמָס
  choice: da violência
  rationale: O substantivo denota violência, crueldade ou grave injustiça; “violência” é direto e apropriado ao contexto social de Amós.
theological_decisions:
- issue: A ironia e a relação entre o dia mau e o domínio da violência
  choice: Os ouvintes tentam relegar o dia de calamidade, mas aproximam ou instauram o domínio da violência.
  alternative: Eles julgam adiar o juízo, mas na realidade aproximam o dia em que a violência os atingirá.
  rationale: O hebraico é condensado e não define se a segunda expressão aponta principalmente para a opressão que eles estabelecem ou para o juízo violento que provocam. O texto principal preserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo entre “afastam” e “aproximam” reproduz a ironia do hebraico; “domínio” evita a estranheza de “assento” no corpo do texto, enquanto a nota preserva a imagem e as alternativas lexicais.
