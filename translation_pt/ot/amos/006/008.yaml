source:
  edition: WLC
  text: נִשְׁבַּע֩ אֲדֹנָ֨/י יְהוִ֜ה בְּ/נַפְשׁ֗/וֹ נְאֻם יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת מְתָאֵ֤ב אָֽנֹכִי֙ אֶת גְּא֣וֹן יַֽעֲקֹ֔ב וְ/אַרְמְנֹתָ֖י/ו שָׂנֵ֑אתִי וְ/הִסְגַּרְתִּ֖י עִ֥יר וּ/מְלֹאָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/008.yaml
  text: 'The Lord GOD has sworn by himself—oracle of Yahweh[a], the God of Armies: I abhor the pride of Jacob, and I hate his citadels[c][b]; and I will hand over the city and all that fills it.'
translation:
  language: pt
  text: 'O Senhor Yahweh jurou por si mesmo — oráculo de Yahweh, o Deus dos Exércitos[a]: “Eu detesto o orgulho de Jacó[b] e odeio seus palácios[c]; entregarei a cidade e tudo o que nela há.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente: “o Deus das hostes”. O termo hebraico se refere a exércitos ou hostes, inclusive no âmbito celestial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a majestade de Jacó”. O termo hebraico pode indicar tanto grandeza e majestade quanto orgulho e arrogância; o contexto de juízo favorece aqui o sentido negativo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “suas cidadelas” ou “suas fortalezas”. O termo hebraico pode referir-se a palácios, inclusive a complexos palacianos fortificados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: O Senhor Yahweh
  rationale: Traduz אֲדֹנָי por “Senhor” e conserva o nome divino יהוה como “Yahweh”, distinguindo título e nome sem recorrer à forma híbrida “Senhor DEUS”.
- source_word: נִשְׁבַּע ... בְּנַפְשׁוֹ
  choice: jurou por si mesmo
  rationale: O hebraísmo “jurar por sua própria vida/alma” expressa um juramento por si mesmo; esta formulação é natural em português e mantém a força solene do autojuramento divino.
- source_word: נְאֻם יְהוָה אֱלֹהֵי צְבָאוֹת
  choice: oráculo de Yahweh, o Deus dos Exércitos
  rationale: “Oráculo” preserva o caráter técnico e solene da fórmula profética נְאֻם; “Exércitos” comunica de modo atual a imagem de צְבָאוֹת.
- source_word: מְתָאֵב
  choice: detesto
  rationale: Expressa forte repulsa em português corrente e digno, sem soar excessivamente arcaico.
- source_word: גְּאוֹן יַעֲקֹב
  choice: o orgulho de Jacó
  rationale: No contexto de condenação, גָּאוֹן provavelmente tem sentido negativo de orgulho ou arrogância, embora sua possível acepção de majestade seja preservada em nota.
- source_word: אַרְמְנֹתָיו
  choice: suas cidadelas
  rationale: O termo pode designar palácios ou complexos fortificados; “cidadelas” reúne as ideias de grandeza e poder defensivo no contexto do juízo contra a elite urbana.
- source_word: שָׂנֵאתִי
  choice: odeio
  rationale: O presente comunica em português a atitude firme e vigente expressa pelo perfeito hebraico.
- source_word: וְהִסְגַּרְתִּי
  choice: entregarei
  rationale: No hifil, סגר pode significar entregar algo ao poder de outro. O futuro é adequado ao anúncio de juízo, e a coordenação simples evita acrescentar uma relação causal não explicitada.
- source_word: עִיר וּמְלֹאָהּ
  choice: a cidade e tudo o que nela há
  rationale: Formulação portuguesa clara que abrange os habitantes, bens e demais conteúdos da cidade sem restringir indevidamente o alcance da expressão.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o caráter de nome próprio do tetragrama. Em אֲדֹנָי יְהוִה, “O Senhor Yahweh” mantém distintos o título e o nome divino.
- issue: Sentido de גְּאוֹן יַעֲקֹב
  choice: o orgulho de Jacó
  alternative: a majestade de Jacó
  rationale: A repulsa e o juízo no contexto favorecem o sentido negativo, mas a polissemia real do substantivo hebraico é explicitada em nota em vez de ser ocultada.
- issue: Referente de מְלֹאָהּ
  choice: tudo o que nela há
  alternative: tudo o que a enche
  rationale: A expressão permanece abrangente, sem decidir se o juízo tem em vista especificamente pessoas, riquezas ou ambos.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e compreensão internacional. A fala divina foi marcada por aspas para tornar clara a transição entre a fórmula profética e o conteúdo do juramento. Os marcadores aparecem imediatamente após os termos a que se referem.
