  naturalness: O registro é claro e apropriado. «Vão até Calné» é mais idiomático no português internacional de boa legibilidade brasileira, e «São elas melhores?» é mais natural e direto que o futuro.
  terminology: Calné, Hamate, Gate e «filisteus» seguem formas bíblicas portuguesas reconhecíveis. «Território» traduz bem גבול neste contexto. A nota preserva de modo adequado a ambiguidade do sujeito implícito de «melhores».
  issues:
