    issue: Tempo verbal futuro em «Serão elas melhores».
    rationale: O hebraico apresenta uma pergunta com o adjetivo טובים, sem marcador de futuro. O presente português («São elas melhores») mantém a força retórica sem acrescentar uma referência temporal.
