source:
  edition: WLC
  text: עִבְר֤וּ כַֽלְנֵה֙ וּ/רְא֔וּ וּ/לְכ֥וּ מִ/שָּׁ֖ם חֲמַ֣ת רַבָּ֑ה וּ/רְד֣וּ גַת פְּלִשְׁתּ֗ים הֲ/טוֹבִים֙ מִן הַ/מַּמְלָכ֣וֹת הָ/אֵ֔לֶּה אִם רַ֥ב גְּבוּלָ֖/ם מִ/גְּבֻלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/002.yaml
  text: Cross over to Calneh and see[a]; and from there go to Hamath the great; then go down to Gath of the Philistines[b]. Are they better than these kingdoms? Or is their territory greater than your territory?
translation:
  language: pt
  text: Vão até Calné e vejam[a]; dali, sigam para Hamate, a Grande; depois desçam até Gate dos filisteus. São elas melhores do que estes reinos? Ou será o território delas maior do que o território de vocês?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “São vocês melhores do que estes reinos?” No hebraico, o adjetivo traduzido como “melhores” não tem sujeito explícito; a comparação pode referir-se tanto às cidades ou aos reinos mencionados quanto às pessoas a quem o profeta se dirige.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִבְרוּ
  choice: Passem
  rationale: O imperativo plural de עבר indica deslocar-se ou atravessar. Em português, “passem a” expressa com naturalidade o movimento até o lugar mencionado sem acrescentar um obstáculo geográfico não especificado.
- source_word: כַּלְנֵה
  choice: Calné
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: וּרְאוּ
  choice: e vejam
  rationale: Tradução direta do imperativo de ראה, preservando o convite retórico a observar a cidade.
- source_word: וּלְכוּ מִשָּׁם
  choice: dali, sigam
  rationale: Mantém a sequência espacial indicada por “de lá” e traduz o imperativo plural de forma natural.
- source_word: חֲמַת רַבָּה
  choice: Hamate, a Grande
  rationale: Preserva o nome próprio e o qualificativo רַבָּה, que distingue a cidade como “a Grande”.
- source_word: וּרְדוּ
  choice: depois desçam
  rationale: O verbo ירד denota descida geográfica; “depois” torna clara a progressão dos imperativos.
- source_word: גַּת פְּלִשְׁתִּים
  choice: Gate dos filisteus
  rationale: Reproduz com clareza a construção que identifica Gate pelo povo filisteu.
- source_word: הֲטוֹבִים מִן הַמַּמְלָכוֹת הָאֵלֶּה
  choice: Serão elas melhores do que estes reinos?
  rationale: O adjetivo masculino plural “melhores” não traz sujeito explícito. O pronome “elas” retoma naturalmente as cidades ou entidades políticas recém-mencionadas, enquanto a ambiguidade é registrada em nota.
- source_word: אִם
  choice: Ou
  rationale: Neste par de perguntas retóricas, אִם introduz a segunda alternativa e é idiomaticamente traduzido por “Ou”.
- source_word: רַב גְּבוּלָם מִגְּבֻלְכֶם
  choice: será o território delas maior do que o território de vocês
  rationale: גְּבוּל designa aqui a extensão territorial, não apenas a linha de fronteira. A repetição de “território” preserva a comparação explícita do hebraico.
theological_decisions:
- issue: Sujeito implícito de הֲטוֹבִים (“melhores”)
  choice: As cidades ou entidades políticas mencionadas, retomadas por “elas”
  alternative: Os destinatários, isto é, “vocês”
  rationale: O hebraico não expressa o sujeito. A leitura principal segue os referentes imediatos, mas a nota conserva a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” para a segunda pessoa plural e conservaram-se formas tradicionais dos topônimos bíblicos. A nota cultural sobre a identificação incerta de Calné, presente na camada inglesa, não foi mantida porque seu marcador estava associado ali a Gate, criando desencontro; apenas a ambiguidade efetivamente relevante ao texto hebraico foi anotada.
