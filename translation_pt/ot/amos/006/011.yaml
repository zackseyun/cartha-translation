  text: כִּֽי הִנֵּ֤ה יְהוָה֙ מְצַוֶּ֔ה וְ/הִכָּ֛ה הַ/בַּ֥יִת הַ/גָּד֖וֹל רְסִיסִ֑ים וְ/הַ/בַּ֥יִת הַ/קָּטֹ֖ן בְּקִעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/011.yaml
  text: For behold[a], Yahweh commands, and the great house will be struck into fragments, and the small house into pieces.
translation:
  language: pt
  text: Pois eis que Yahweh dá a ordem, e a casa grande será reduzida[a] a estilhaços, e a casa pequena, a pedaços.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e ele ferirá a casa grande em estilhaços, e a casa pequena em fendas”. O agente do verbo singular não é repetido explicitamente nesta oração; “fendas” ou “rachaduras” é também uma possível tradução de “pedaços”.'
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do que precede, mantendo clara a ligação discursiva.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a chamada enfática à atenção e o tom profético em português digno e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מְצַוֶּה
  choice: dá a ordem
  rationale: Expressa de modo natural a ação autoritativa e iminente do particípio hebraico.
- source_word: וְהִכָּה
  choice: e ferirão
  rationale: O hebraico traz uma forma verbal masculina singular sem agente expresso. O plural impessoal é idiomático em português e evita identificar indevidamente Yahweh como o executor imediato; a nota registra mais literalmente a forma singular.
- source_word: הַבַּיִת הַגָּדוֹל
  choice: a casa grande
  rationale: Mantém 'casa' sem convertê-la em 'palácio' e conserva a possível referência tanto ao tamanho quanto à importância social.
- source_word: רְסִיסִים
  choice: estilhaços
  rationale: Comunica a fragmentação violenta em partes pequenas e preserva a distinção poética em relação ao termo seguinte.
- source_word: וְהַבַּיִת הַקָּטֹן
  choice: a casa pequena
  rationale: Mantém o paralelismo direto com 'a casa grande'.
- source_word: בְּקִעִים
  choice: pedaços
  rationale: No contexto de destruição, expressa com clareza o resultado de partir ou fender, sem impor a leitura mais estreita de 'rachaduras'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva a referência ao nome divino sem substituí-lo por um título.
- issue: Agência em וְהִכָּה
  choice: agente não especificado, expresso pelo plural impessoal 'ferirão'
  alternative: Yahweh ferirá; ele ferirá; será golpeada
  rationale: Embora o verbo hebraico esteja no masculino singular, seu agente imediato não é nomeado após a declaração de que Yahweh ordena. A formulação impessoal evita resolver essa ambiguidade, enquanto o contexto mantém a destruição sob a ordem divina.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” conserva a força profética; “dá a ordem” soa mais natural que “ordena” neste encadeamento. A construção explicita os resultados com “até reduzi-la” para evitar a leitura instrumental de “com estilhaços”.
