revisions:
- from: 'Então seu tio[a], aquele que o queima[b], o levará para retirar os ossos da casa. Ele perguntará à pessoa que estiver no lugar mais recôndito da casa: “Ainda há alguém com você?” Ela responderá: “Ninguém”. Então ele dirá: “Silêncio! Pois não devemos mencionar o nome de Yahweh”.[c]'
  to: 'Então seu tio e aquele que o queima o carregarão para tirar os ossos da casa. Ele dirá àquele que estiver na parte mais recôndita da casa: “Ainda há alguém com você?” Ele responderá: “Ninguém”. Então ele dirá: “Silêncio! Pois não devemos mencionar o nome de Yahweh[c]”.'
  rationale: A revisão restaura a coordenação e o plural do sujeito inicial, preservando uma dificuldade sintática importante do hebraico em vez de tratá-lo como aposição. Também mantém o interlocutor masculino, melhora ligeiramente o verbo de transporte e reposiciona a âncora da nota explicativa. As notas a e b permanecem disponíveis para os dois termos iniciais, embora as âncoras correspondentes devam ser inseridas no texto publicado como «tio[a]» e «queima[b]».
