  text: וּ/נְשָׂא֞/וֹ דּוֹד֣/וֹ וּ/מְסָרְפ֗/וֹ לְ/הוֹצִ֣יא עֲצָמִים֮ מִן הַ/בַּיִת֒ וְ/אָמַ֞ר לַ/אֲשֶׁ֨ר בְּ/יַרְכְּתֵ֥י הַ/בַּ֛יִת הַ/ע֥וֹד עִמָּ֖/ךְ וְ/אָמַ֣ר אָ֑פֶס וְ/אָמַ֣ר הָ֔ס כִּ֛י לֹ֥א לְ/הַזְכִּ֖יר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/010.yaml
  text: Then his uncle[a], the one who burns him, will carry him out to bring the bones out of the house, and he will say to the one who is in the innermost part of the house, “Is there still anyone with you?” And he will say, “No one.” Then he will say[c][b], “Hush! For we must not mention the name of Yahweh.”
translation:
  language: pt
  text: 'Então seu tio e aquele que o queima o carregarão para tirar os ossos da casa. Ele dirá àquele que estiver na parte mais recôndita da casa: “Ainda há alguém com você?” Ele responderá: “Ninguém”. Então ele dirá: “Silêncio! Pois não devemos mencionar o nome de Yahweh[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Ou: “Não mencione o nome de Yahweh”. A expressão hebraica é concisa e pode ser entendida como uma proibição direta ou como uma declaração de necessidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: seu tio
  rationale: No contexto da retirada de cadáveres e da responsabilidade familiar, דּוֹד provavelmente designa um parente próximo do sexo masculino, em especial um tio; a nota preserva a opção menos específica, “parente”.
- source_word: וּמְסָרְפוֹ
  choice: aquele que o queima
  rationale: O particípio deriva de שׂרף, “queimar”. Embora a prática indicada seja incomum e a expressão difícil, a tradução mantém a estranheza concreta do hebraico sem substituí-la por uma referência genérica ao sepultamento.
- source_word: לְהוֹצִיא עֲצָמִים
  choice: para retirar os ossos
  rationale: עֲצָמִים significa literalmente “ossos”; “retirar” expressa com naturalidade o movimento para fora indicado por הוציא.
- source_word: בְּיַרְכְּתֵי הַבַּיִת
  choice: no lugar mais recôndito da casa
  rationale: יַרְכָּה designa a parte remota, interior ou afastada de um espaço. “Lugar mais recôndito” transmite essa localização em português atual.
- source_word: הַעוֹד עִמָּךְ
  choice: Ainda há alguém com você?
  rationale: A pergunta busca saber se resta mais alguém na casa; explicitar “alguém” produz uma formulação natural sem acrescentar uma identidade ao sobrevivente.
- source_word: אָפֶס
  choice: Ninguém
  rationale: Aqui אָפֶס funciona como resposta elíptica negando que reste qualquer pessoa.
- source_word: הָס
  choice: Silêncio!
  rationale: A interjeição abrupta exige que se pare de falar e preserva o tom temeroso da cena.
- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: não devemos mencionar o nome de Yahweh
  rationale: A construção infinitiva é concisa e pode exprimir proibição ou necessidade. “Não devemos” mantém essa força sem explicar o motivo do temor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração comunica o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e segue a orientação lexical fornecida.
- issue: Força de כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: Pois não devemos mencionar o nome de Yahweh
  alternative: Pois não mencione o nome de Yahweh
  rationale: O hebraico é elíptico e admite tanto uma proibição direta quanto uma declaração de necessidade. A tradução principal adota a segunda possibilidade, e a nota registra a primeira sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O diálogo foi tornado natural por meio de “perguntará” e “responderá”, sem apagar a sequência narrativa. Mantiveram-se a imagem concreta dos ossos, a formulação incomum sobre queimar o morto, o tom abrupto de “Silêncio!” e a ambiguidade da proibição final.
