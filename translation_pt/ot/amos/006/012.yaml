id: AMO.6.12
reference: Amos 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/יְרֻצ֤וּ/ן בַּ/סֶּ֨לַע֙ סוּסִ֔ים אִֽם יַחֲר֖וֹשׁ בַּ/בְּקָרִ֑ים כִּֽי הֲפַכְתֶּ֤ם לְ/רֹאשׁ֙ מִשְׁפָּ֔ט וּ/פְרִ֥י צְדָקָ֖ה לְ/לַעֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/012.yaml
  text: Do horses run on rock? Does one plow there with oxen? Yet you have turned justice into poison[c][b][a], and the fruit of righteousness into wormwood.
translation:
  language: pt
  text: Acaso os cavalos correm sobre a rocha? Será que alguém lavra ali com bois? No entanto, vocês transformaram o direito em veneno[a] e o fruto da justiça em absinto[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em fel» ou «em planta venenosa». O termo hebraico pode designar uma substância ou planta amarga e venenosa.'
    reason: lexical_alternative
  - marker: b
    text: O absinto é uma planta muito amarga, usada aqui como imagem de corrupção moral e de suas consequências amargas.
    reason: cultural_note
  - marker: c
    text: 'Ou: «o fruto da retidão». O termo hebraico também pode destacar a conduta correta e íntegra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְרֻצוּן
  choice: Acaso ... correm
  rationale: O interrogativo com o imperfeito expressa uma pergunta retórica sobre algo absurdo ou impraticável; o presente e a partícula «acaso» preservam a força proverbial em português.
- source_word: בַּסֶּלַע
  choice: sobre a rocha
  rationale: סֶלַע designa rocha ou penhasco; a expressão comunica uma superfície rochosa imprópria para a ação mencionada, sem tratá-la como lugar específico.
- source_word: סוּסִים
  choice: os cavalos
  rationale: Equivalente direto e natural do substantivo plural.
- source_word: אִם
  choice: Será que alguém
  rationale: Aqui אִם introduz a segunda pergunta retórica paralela, não uma condição; esta formulação torna isso claro em português.
- source_word: יַחֲרֹשׁ
  choice: lavra
  rationale: Expressa o sentido básico de arar ou cultivar com arado, mantendo implícito o objeto, como no hebraico.
- source_word: בַּבְּקָרִים
  choice: com bois
  rationale: Embora בָּקָר possa designar gado em geral, no contexto de lavrar «bois» é a referência natural.
- source_word: כִּי
  choice: No entanto
  rationale: Introduz a aplicação acusatória após as perguntas sobre ações absurdas; a locução preserva a contundência adversativa no discurso profético.
- source_word: הֲפַכְתֶּם
  choice: vocês transformaram
  rationale: O perfeito na segunda pessoa masculina plural apresenta uma acusação direta de ação consumada, com efeito presente.
- source_word: מִשְׁפָּט
  choice: o direito
  rationale: No contexto público e judicial, «direito» designa a ordem e a prática da justiça, além de formar contraste natural com sua perversão.
- source_word: לְרֹאשׁ
  choice: em veneno
  rationale: רֹאשׁ pode indicar substância ou planta amarga e venenosa; «veneno» comunica claramente a imagem em linguagem atual, enquanto a alternativa é registrada em nota.
- source_word: וּפְרִי צְדָקָה
  choice: e o fruto da justiça
  rationale: Preserva a metáfora concreta e traduz צְדָקָה de modo compatível com seu alcance moral e social no contexto profético.
- source_word: לְלַעֲנָה
  choice: em absinto
  rationale: לַעֲנָה é uma planta proverbialmente amarga; «absinto» conserva a imagem botânica e seu valor metafórico.
theological_decisions:
- issue: Relação semântica entre מִשְׁפָּט e צְדָקָה
  choice: «o direito» e «a justiça»
  alternative: «a justiça» e «a retidão»
  rationale: A opção distingue em português a dimensão jurídico-social de מִשְׁפָּט e o campo moral/social de צְדָקָה, sem negar a sobreposição entre os termos; a alternativa é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. As perguntas retóricas mantêm o tom proverbial e acusatório. «Lavra» preserva a imagem agrícola sem soar excessivamente técnica; «absinto» conserva a metáfora concreta, explicada em nota.
