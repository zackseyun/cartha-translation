  text: הַ/שֹּׁתִ֤ים בְּ/מִזְרְקֵי֙ יַ֔יִן וְ/רֵאשִׁ֥ית שְׁמָנִ֖ים יִמְשָׁ֑חוּ וְ/לֹ֥א נֶחְל֖וּ עַל שֵׁ֥בֶר יוֹסֵֽף־
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/006.yaml
  text: who drink wine from bowls and anoint themselves with the finest oils[b][a], but are not grieved over the ruin of Joseph—
translation:
  language: pt
  text: os que bebem vinho em taças e se ungem com os melhores óleos,[a] mas não se afligem com a ruína de José[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os óleos mais seletos”; literalmente, “o primeiro dos óleos”.'
    reason: lexical_alternative
  - marker: b
    text: “José” refere-se aqui poeticamente ao povo de Israel, em especial ao reino do norte.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׁתִים
  choice: os que bebem
  rationale: O particípio com artigo continua a descrição iniciada no contexto anterior; a construção relativa é natural em português e preserva essa continuidade.
- source_word: בְּמִזְרְקֵי יַיִן
  choice: bebem vinho em grandes taças
  rationale: מִזְרָק designa uma taça ou bacia, frequentemente grande. A explicitação de 'grandes' comunica a imagem de consumo extravagante sem recorrer à paráfrase 'aos cântaros'.
- source_word: וְרֵאשִׁית שְׁמָנִים
  choice: os melhores óleos
  rationale: רֵאשִׁית significa literalmente 'primeiro' ou 'principal' e, neste contexto, indica a porção mais excelente ou seleta.
- source_word: יִמְשָׁחוּ
  choice: se ungem com
  rationale: Preserva o sentido básico de משׁח, 'ungir', e torna explícito o valor reflexivo exigido pelo contexto de cuidados pessoais luxuosos.
- source_word: וְלֹא נֶחְלוּ
  choice: mas não se afligem
  rationale: O nifal de חלה pode expressar adoecer ou enfraquecer e, neste contexto, dor solidária ou pesar. 'Não se afligem' comunica a força moral e emocional sem impor enfermidade física.
- source_word: עַל שֵׁבֶר יוֹסֵף
  choice: com a ruína de José
  rationale: שֵׁבֶר, literalmente 'quebra' ou 'fratura', estende-se a desastre, colapso ou ruína. 'Ruína' é idiomático e mantém a gravidade da metáfora profética.
- source_word: יוֹסֵף
  choice: José
  rationale: Mantém o nome próprio e a imagem poética do hebraico; seu referente coletivo é explicado em nota, em vez de ser substituído interpretativamente no texto.
theological_decisions:
- issue: Uso metonímico de “José”
  choice: Manter “José” no texto principal como designação poética coletiva.
  alternative: Traduzir interpretativamente como “Israel” ou “a casa de José”.
  rationale: A retenção do nome preserva a linguagem profética e suas ressonâncias tribais e pactuais, enquanto a nota esclarece o referente sem eliminar a imagem do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom acusatório da descrição profética e preserva a metonímia “José”. Os marcadores foram colocados imediatamente após os termos que esclarecem.
