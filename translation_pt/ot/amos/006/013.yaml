  text: you who rejoice over nothing[a], who say[b], “Have we not by our own strength taken horns for ourselves?”
translation:
  language: pt
  text: 'vocês que se alegram com o que não é nada[a] e dizem: “Não foi por nossa própria força que obtivemos chifres para nós?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como “o que não é nada” também pode aludir ao nome Lo-Debar, formando um jogo de palavras sobre a alegria pela conquista de uma cidade cujo nome soa como “nada” ou “coisa nenhuma”.
    reason: lexical_alternative
  - marker: b
    text: 'Também é possível traduzir: “Não foi por nossa própria força que obtivemos Carnaim para nós?” A palavra hebraica traduzida como “chifres” também pode evocar Carnaim, provavelmente num jogo de palavras que associa poder militar e conquista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: vocês que se alegram
  rationale: O particípio masculino plural continua a acusação direta do contexto; a forma vocativa é natural em português.
- source_word: לְלֹא דָבָר
  choice: por nada
  rationale: Reproduz o sentido simples de algo sem valor ou de coisa alguma, preservando em nota a possível alusão ao topônimo Lo-Debar.
- source_word: הָאֹמְרִים
  choice: e dizem
  rationale: Mantém o segundo particípio paralelo e liga diretamente a alegria censurada à declaração arrogante.
- source_word: הֲלוֹא
  choice: Não foi... que
  rationale: Expressa de modo idiomático a pergunta retórica que espera resposta afirmativa.
- source_word: בְחָזְקֵנוּ
  choice: com a nossa própria força
  rationale: Conserva a ideia de força com o sufixo de primeira pessoa plural; “própria” explicita, sem alterar o sentido, a autossuficiência da vanglória.
- source_word: לָקַחְנוּ
  choice: conquistamos
  rationale: No contexto de poder militar e possível captura de cidades, “conquistamos” comunica melhor que o genérico “tomamos” o provável sentido do verbo.
- source_word: קַרְנָיִם
  choice: chifres
  rationale: Mantém a imagem hebraica dos chifres como símbolo de poder, enquanto a possível referência à cidade de Carnaim fica preservada em nota.
