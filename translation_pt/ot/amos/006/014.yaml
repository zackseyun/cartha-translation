  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
translation:
  language: pt
  text: Pois eis que estou levantando contra vocês uma nação, ó casa de Israel, declara Yahweh, o Deus dos Exércitos; ela os oprimirá desde Lebo-Hamate[a] até o ribeiro da Arabá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde a entrada de Hamate”. A expressão hebraica pode ser entendida como o topônimo Lebo-Hamate ou como uma descrição desse limite territorial.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o uádi da Arabá”. O termo hebraico pode indicar um curso de água sazonal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação do anúncio de juízo precedente, preservando a ligação causal com o contexto.
- source_word: הִנְנִי מֵקִים
  choice: eis que estou levantando
  rationale: Mantém tanto a fórmula profética de chamada de atenção quanto a ação divina apresentada como iminente ou já em curso.
- source_word: עֲלֵיכֶם
  choice: contra vocês
  rationale: O contexto militar e judicial exige o sentido adversativo da preposição.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Conserva a designação coletiva tradicional e funciona naturalmente como vocativo em português.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e translitera o nome divino conforme a política do projeto.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Expressão reconhecível que preserva a imagem de hostes ou forças sob o comando divino sem especificar apenas exércitos terrenos ou celestes.
- source_word: גּוֹי
  choice: uma nação
  rationale: Designa uma potência estrangeira que Deus fará surgir como instrumento de juízo.
- source_word: וְלָחֲצוּ
  choice: ela oprimirá vocês
  rationale: O verbo indica pressão aflitiva e subjugação prolongada. O singular em português retoma naturalmente o substantivo coletivo “nação”, embora o hebraico passe ao verbo no plural.
- source_word: מִלְּבוֹא חֲמָת
  choice: desde Lebo-Hamate
  rationale: Trata a expressão como topônimo ou marco geográfico conhecido, sem ocultar em nota a possibilidade de leitura descritiva.
- source_word: נַחַל הָעֲרָבָה
  choice: o ribeiro da Arabá
  rationale: “Ribeiro” comunica de modo acessível um curso de água que pode ser sazonal, enquanto “Arabá” preserva o nome regional.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o nome próprio do texto hebraico e segue a convenção declarada do projeto, sem substituir o nome por um título.
- issue: Identidade da nação levantada contra Israel
  choice: manter sem identificação
  alternative: identificá-la explicitamente como a Assíria
  rationale: Embora o contexto histórico possa apontar para a Assíria, o versículo diz apenas “uma nação”; a tradução não acrescenta uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Eis que” preserva a força profética; “vocês” torna claro o plural do destinatário. Os travessões isolam a fórmula oracular sem alterar a estrutura do anúncio.
