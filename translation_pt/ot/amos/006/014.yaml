  to: Pois eis que estou levantando contra vocês uma nação, ó casa de Israel, declara Yahweh, o Deus dos Exércitos; ela os oprimirá desde Lebo-Hamate[a] até o ribeiro da Arabá[b].
  rationale: A revisão explicita o vocativo e reorganiza a oração para que «uma nação» seja complemento imediato de «estou levantando». «Ela os oprimirá» mantém em português a retomada natural de «nação», sem acrescentar identificação histórica. As notas e seus marcadores são preservados.
