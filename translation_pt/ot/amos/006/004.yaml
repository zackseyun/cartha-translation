  text: those who lie on beds of ivory and sprawl on their couches[b][a], and eat lambs from the flock and calves from the stall—
translation:
  language: pt
  text: os que se deitam em camas de marfim, se estendem em seus divãs[a] e comem cordeiros do rebanho e bezerros do curral de engorda[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
