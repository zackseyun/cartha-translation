lexical_decisions:
- source_word: הַשֹּׁכְבִים
  choice: os que se deitam
  rationale: O particípio com artigo tem função substantiva e prossegue a descrição dos destinatários do ai; a formulação preserva o sentido habitual.
- source_word: מִטּוֹת שֵׁן
  choice: camas de marfim
  rationale: Reproduz de modo conciso a expressão hebraica, provavelmente referente a camas ornamentadas ou incrustadas com marfim.
- source_word: וּסְרֻחִים
  choice: e se esparramam
  rationale: Expressa a ideia de estender-se folgadamente, com a conotação contextual de luxo e complacência, sem reduzi-la ao simples ato de reclinar-se.
- source_word: עַל עַרְשׂוֹתָם
  choice: em seus divãs
  rationale: עֶרֶשׂ pode designar cama ou divã; “divãs” mantém a distinção em relação a מִטּוֹת e se ajusta ao cenário de luxo.
- source_word: וְאֹכְלִים
  choice: que comem
  rationale: O presente traduz naturalmente o particípio e seu caráter habitual.
- source_word: כָּרִים
  choice: cordeiros
  rationale: Designa ovinos jovens, apropriados para refeições requintadas; “cordeiros” é o equivalente corrente mais claro.
- source_word: מִצֹּאן
  choice: do rebanho
  rationale: Tradução direta que conserva a imagem da seleção dos animais dentre o rebanho.
- source_word: וַעֲגָלִים
  choice: e bezerros
  rationale: Equivalente direto para os bovinos jovens mencionados no texto.
- source_word: מִתּוֹךְ מַרְבֵּק
  choice: do curral de engorda
  rationale: מַרְבֵּק indica recinto onde animais são mantidos e alimentados; a expressão explicita com naturalidade a criação especial ligada ao consumo luxuoso.
