  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência participial foi vertida como descrição habitual. “Divãs” preserva a distinção lexical entre os dois móveis, e “se esparramam” mantém a censura implícita à indolência luxuosa.
