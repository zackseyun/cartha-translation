  text: ה֚וֹי הַ/שַּׁאֲנַנִּ֣ים בְּ/צִיּ֔וֹן וְ/הַ/בֹּטְחִ֖ים בְּ/הַ֣ר שֹׁמְר֑וֹן נְקֻבֵי֙ רֵאשִׁ֣ית הַ/גּוֹיִ֔ם וּ/בָ֥אוּ לָ/הֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
translation:
  language: pt
  text: Ai dos que vivem despreocupados em Sião e dos que se sentem seguros no monte de Samaria, os notáveis[a], os principais entre as nações[b], a quem a casa de Israel se dirige![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os designados”, “os nomeados” ou “os assinalados”. O termo hebraico se refere a pessoas reconhecidas ou destacadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “os primeiros entre as nações” ou “os chefes entre as nações”. A construção hebraica é condensada e pode também ser entendida como “os notáveis da principal das nações”.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “e a casa de Israel vem a eles”.'
    reason: literal_rendering
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética que combina lamento, denúncia e anúncio de juízo; “Ai” é a forma portuguesa tradicional e ainda clara.
- source_word: הַשַּׁאֲנַנִּים
  choice: os que vivem despreocupados
  rationale: O particípio de שׁאנן comunica tranquilidade indolente ou complacente, não apenas descanso legítimo; a expressão mantém o tom moral do contexto.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: Expressão locativa natural em português, preservando a referência explícita a Sião.
- source_word: וְהַבֹּטְחִים
  choice: os que se sentem seguros
  rationale: בטח pode indicar confiar ou estar seguro. Neste contexto de falsa confiança, “sentem seguros” evita atribuir valor positivo à atitude.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: no monte de Samaria
  rationale: Tradução próxima da expressão geográfica hebraica, sem transformá-la indevidamente em nome próprio formal.
- source_word: נְקֻבֵי
  choice: os notáveis
  rationale: Literalmente, os “designados”, “nomeados” ou “assinalados”; no contexto, a palavra aponta para pessoas de destaque. A alternativa literal é preservada em nota.
- source_word: רֵאשִׁית הַגּוֹיִם
  choice: da primeira entre as nações
  rationale: Mantém a ideia de primazia expressa por רֵאשִׁית e a forma plural “nações”, sem decidir se a expressão é elogio autoproclamado, posição política ou descrição irônica.
- source_word: וּבָאוּ לָהֶם
  choice: a quem ... se dirige
  rationale: A cláusula hebraica é condensada e diz literalmente que a casa de Israel “vem a eles”. “Se dirige” expressa em português natural o movimento ou recurso a essas pessoas, com a forma literal registrada em nota.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão nacional e pactual do hebraico, em vez de simplificá-la para apenas “Israel” ou “o povo de Israel”.
theological_decisions:
- issue: Destinatários em Sião e Samaria
  choice: Manter os dois centros explicitamente como alvos da denúncia
  alternative: Entender toda a denúncia como dirigida apenas à liderança do reino do Norte, considerando Sião uma referência retórica ou textualmente problemática
  rationale: O paralelismo do texto recebido menciona naturalmente Sião e o monte de Samaria. A tradução não elimina nenhum dos dois nem restringe silenciosamente o alcance da denúncia.
- issue: Sentido de “primeira entre as nações”
  choice: Preservar a afirmação ambígua de primazia
  alternative: Explicitar que Israel seria “a principal nação”, ou interpretar a expressão como referência direta aos líderes das nações mais importantes
  rationale: A construção hebraica é compacta e admite mais de uma relação sintática e retórica. A tradução conserva essa tensão em vez de impor uma leitura teológica ou política específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Ai” preserva o tom profético; “vivem despreocupados” e “se sentem seguros” comunicam complacência sem linguagem excessivamente arcaica. As notas mantêm as ambiguidades lexicais e sintáticas reais do hebraico.
