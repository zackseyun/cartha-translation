revisions:
- from: Ai dos que vivem despreocupados em Sião e dos que se sentem seguros no monte de Samaria, os notáveis[a] da primeira entre as nações[b], a quem a casa de Israel se dirige![c]
  to: Ai dos que vivem despreocupados em Sião e dos que se sentem seguros no monte de Samaria, os notáveis[a], os principais entre as nações[b], a quem a casa de Israel se dirige![c]
