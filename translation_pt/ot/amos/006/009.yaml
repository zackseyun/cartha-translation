  text: וְ/הָיָ֗ה אִם יִוָּ֨תְר֜וּ עֲשָׂרָ֧ה אֲנָשִׁ֛ים בְּ/בַ֥יִת אֶחָ֖ד וָ/מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/009.yaml
  text: And it will happen that if ten men remain in one house[a], they will die.
translation:
  language: pt
  text: E acontecerá que, se restarem dez homens numa só casa[a], eles morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “forem deixados”. O verbo hebraico indica ficar ou restar depois que outros se foram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: O waw seguido da forma de היה introduz uma circunstância futura ou o desdobramento da situação; a formulação é direta e digna em português atual.
- source_word: אִם
  choice: se
  rationale: A partícula introduz naturalmente uma condição. Traduzir por “quando” tornaria a realização mais categórica do que a sintaxe exige.
- source_word: יִוָּתְרוּ
  choice: restarem
  rationale: O nifal de יתר indica ficar, restar ou ser deixado depois que outros se foram. “Restarem” conserva esse sentido sem sugerir, como “sobreviverem”, que tenham escapado definitivamente do perigo.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: dez homens
  rationale: O hebraico emprega um substantivo masculino plural e o numeral na forma correspondente; “dez homens” preserva essa especificidade.
- source_word: בְּבַיִת אֶחָד
  choice: numa só casa
  rationale: A expressão é concreta e espacial. “Numa só casa” comunica com naturalidade que todos se encontram em uma única casa, sem transformar “casa” em “família” ou “grupo doméstico”.
- source_word: וָמֵתוּ
  choice: eles morrerão
  rationale: A forma verbal apresenta o resultado futuro. O pronome explícito torna clara e natural a retomada dos dez homens.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção condicional e a concisão severa do hebraico foram preservadas; “numa só casa” soa mais idiomático do que “em uma casa” neste contexto.
