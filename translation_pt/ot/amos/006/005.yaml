  yaml_path: translation/ot/amos/006/005.yaml
  text: who strum on the mouth of the harp, and like David invent for themselves instruments of song—
translation:
  language: pt
  text: os que dedilham ao som da harpa e, como Davi, inventam para si instrumentos musicais—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֹּרְטִים
  choice: os que dedilham
  rationale: O particípio descreve o ato de tocar ou tanger as cordas; “dedilham” é natural em português e preserva a imagem musical.
- source_word: עַל־פִּי הַנָּבֶל
  choice: ao som da harpa
  rationale: A expressão literalmente envolve a “boca” do instrumento, mas idiomaticamente indica tocar conforme ou ao som dele. “Harpa” mantém o termo tradicional para נבל, embora a identificação exata do instrumento antigo seja incerta.
- source_word: חָשְׁבוּ
  choice: inventam
  rationale: Neste contexto, o verbo expressa conceber ou criar instrumentos, em paralelo com a atividade atribuída a Davi.
- source_word: כְּלֵי שִׁיר
  choice: instrumentos musicais
  rationale: Literalmente, “instrumentos de canto/canção”; em português atual, “instrumentos musicais” comunica naturalmente os objetos usados para produzir música.
theological_decisions:
- issue: Comparação com Davi
  choice: como Davi
  alternative: à semelhança de Davi
  rationale: Mantém a comparação direta do hebraico sem decidir se ela é sincera, irônica ou crítica no contexto profético.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada à continuação da sentença dos versículos ao redor. O travessão final preserva a continuidade retórica indicada no texto de consulta.
