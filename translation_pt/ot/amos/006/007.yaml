base_translation:
  language: en
  yaml_path: translation/ot/amos/006/007.yaml
  text: Therefore now they will go into exile at the head of the exiles[a], and the revelry of those who sprawl will pass away.
translation:
  language: pt
  text: Por isso, agora eles irão para o exílio à frente dos exilados, e cessará o festim dos que se esparramam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o banquete dos que se estendem” ou “a farra dos que se esparramam”. A expressão hebraica é compacta e provavelmente retoma a imagem daqueles que se reclinam em divãs no versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão consequente da denúncia anterior.
- source_word: עַתָּה
  choice: agora
  rationale: Preserva o advérbio temporal e a iminência do juízo.
- source_word: יִגְלוּ
  choice: irão para o exílio
  rationale: Traduz o sentido de גלה de maneira ativa e idiomática.
- source_word: בְּרֹאשׁ גֹּלִים
  choice: à frente dos exilados
  rationale: Mantém a imagem da cabeça ou dianteira e a ironia de que os integrantes da elite serão os primeiros a partir.
- source_word: וְסָר
  choice: cessará
  rationale: No contexto, indica o fim da celebração indulgente; é conciso e natural em português.
- source_word: מִרְזַח
  choice: farra
  rationale: Comunica uma celebração marcada por bebida e excesso, preservando o tom condenatório, embora o termo também possa designar banquete ou festim.
- source_word: סְרוּחִים
  choice: os que vivem esparramados
  rationale: Retoma a imagem, no versículo anterior, dos ricos reclinados em divãs e ressalta sua indolência autocomplacente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Farra” é deliberadamente vívido, mas não vulgar; a nota preserva as alternativas semânticas de מִרְזַח. A aliteração hebraica entre o verbo e o particípio ligados ao exílio não pode ser reproduzida integralmente sem artificialidade.
