id: AMO.3.11
reference: Amos 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צַ֖ר וּ/סְבִ֣יב הָ/אָ֑רֶץ וְ/הוֹרִ֤ד מִמֵּ/ךְ֙ עֻזֵּ֔/ךְ וְ/נָבֹ֖זּוּ אַרְמְנוֹתָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/011.yaml
  text: 'Therefore[a], thus says the Lord GOD: An adversary shall surround the land, and he shall bring down your strength from you[b], and your citadels shall be plundered.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh:


    “Um inimigo[a] cercará a terra;

    tirará de você a sua força,

    e suas cidadelas[b] serão saqueadas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adversário”.
    reason: lexical_alternative
  - marker: b
    text: Ou “palácios”. A palavra hebraica pode indicar palácios ou fortalezas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva o título אֲדֹנָי como “Senhor” e representa diretamente o nome divino יהוה como “Yahweh”, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: צַר
  choice: um inimigo
  rationale: No contexto de invasão e saque, designa uma força hostil concreta. “Inimigo” é atual e amplamente compreensível; “adversário” permanece possível.
- source_word: וּסְבִיב הָאָרֶץ
  choice: cercará a terra
  rationale: A expressão hebraica é breve e elíptica, literalmente relacionada a estar “ao redor da terra”. A forma verbal explicita em português a ameaça de cerco sem identificar indevidamente o invasor.
- source_word: וְהוֹרִיד מִמֵּךְ עֻזֵּךְ
  choice: tirará de você a sua força
  rationale: Comunica a perda imposta do poder ou vigor nacional. A segunda pessoa feminina singular do hebraico, dirigida à cidade/comunidade, é preservada por “você”.
- source_word: וְנָבֹזּוּ
  choice: serão saqueadas
  rationale: A forma passiva indica que os edifícios serão despojados por invasores; “saqueadas” é natural no contexto militar.
- source_word: אַרְמְנוֹתָיִךְ
  choice: suas cidadelas
  rationale: O termo pode indicar palácios ou complexos fortificados. “Cidadelas” conserva melhor, neste contexto de cerco, as ideias de residência da elite e segurança defensiva.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução mantém distintos o título אֲדֹנָי e o nome pessoal יהוה, sem substituir silenciosamente o nome por outro título.
- issue: Identidade do inimigo anunciado
  choice: não identificar o inimigo pelo nome
  alternative: identificá-lo como a Assíria
  rationale: Embora o contexto histórico possa apontar para uma potência invasora específica, o texto deste versículo diz apenas צַר, “inimigo/adversário”; a tradução preserva essa indefinição.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A estrutura poética foi mantida em linhas breves. Os marcadores foram colocados junto aos termos a que suas notas realmente se referem.
