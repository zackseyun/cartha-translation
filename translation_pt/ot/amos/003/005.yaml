base_translation:
  language: en
  yaml_path: translation/ot/amos/003/005.yaml
  text: Does a bird fall into a trap on the ground when there is no snare for it? Does a trap spring up from the ground when it has caught nothing at all?[a][b]
translation:
  language: pt
  text: Acaso cai um pássaro numa armadilha no chão sem que haja um laço para ele?[a] Acaso salta do chão uma armadilha sem ter apanhado coisa alguma?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sem que haja isca ou gatilho para ele»; o termo hebraico traduzido por «laço» pode designar mais especificamente aquilo que atrai a ave ou aciona a armadilha.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «e, quanto a apanhar, não apanha»; a construção hebraica é enfática e significa «sem apanhar coisa alguma» ou «certamente não apanha nada».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִפֹּל
  choice: cai
  rationale: Preserva o sentido básico de נפל e, em português, «cair numa armadilha» comunica naturalmente a ideia de ser apanhado sem substituí-la pela interpretação «ser capturado».
- source_word: צִפּוֹר
  choice: pássaro
  rationale: O termo é genérico neste contexto e não identifica uma espécie particular.
- source_word: פַּח
  choice: armadilha
  rationale: Designa um dispositivo para capturar aves ou animais. «Armadilha» é corrente e funciona nas duas ocorrências, mantendo distinção em relação a מוֹקֵשׁ.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: no chão / do chão
  rationale: No quadro concreto de caça, «chão» expressa de modo natural o lugar onde a armadilha está posta e de onde ela salta.
- source_word: מוֹקֵשׁ
  choice: laço
  rationale: Mantém a distinção lexical em relação a פַּח («armadilha») e representa o elemento que enlaça ou aciona a captura; sentidos mais específicos são registrados em nota.
- source_word: אֵין לָהּ
  choice: sem que haja um laço para ele
  rationale: Expressa a inexistência do elemento de captura destinado ao pássaro e conserva a referência do sufixo pronominal feminino, cujo antecedente é צִפּוֹר.
- source_word: יַעֲלֶה
  choice: salta
  rationale: O verbo significa literalmente «subir». Aplicado à ativação de uma armadilha, «salta» comunica com naturalidade o movimento ascendente sem apagar a imagem.
- source_word: וְלָכוֹד לֹא יִלְכּוֹד
  choice: sem ter apanhado coisa alguma
  rationale: A combinação do infinitivo absoluto com o verbo finito reforça a ideia de captura. A formulação portuguesa transmite que a armadilha não salta sem efetivamente apanhar algo.
