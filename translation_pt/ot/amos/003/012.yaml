id: AMO.3.12
reference: Amos 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ כַּ/אֲשֶׁר֩ יַצִּ֨יל הָ/רֹעֶ֜ה מִ/פִּ֧י הָ/אֲרִ֛י שְׁתֵּ֥י כְרָעַ֖יִם א֣וֹ בְדַל אֹ֑זֶן כֵּ֣ן יִנָּצְל֞וּ בְּנֵ֣י יִשְׂרָאֵ֗ל הַ/יֹּֽשְׁבִים֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/פְאַ֥ת מִטָּ֖ה וּ/בִ/דְמֶ֥שֶׁק עָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/012.yaml
  text: 'Thus says Yahweh: As the shepherd rescues from the mouth of the lion two legs or a piece of an ear[b][a], so will the sons of Israel who dwell in Samaria be rescued—with the corner of a bed and the cover of a couch.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Como o pastor resgata da boca do leão duas pernas ou um pedaço de orelha, assim serão resgatados os filhos de Israel[a] que vivem em Samaria — no canto de uma cama e num divã de Damasco[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os israelitas”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: A frase final é difícil. O hebraico diz literalmente “no canto de uma cama e num divã de Damasco”. Também pode ser entendida como “sobre um divã em Damasco”; outras propostas incluem “num divã revestido de damasco” ou “com a cobertura de um divã”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função de nome pessoal no texto hebraico.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Como ... assim
  rationale: Mantém de modo natural em português a estrutura comparativa explícita do hebraico.
- source_word: יַצִּיל / יִנָּצְלוּ
  choice: resgata / serão resgatados
  rationale: Preserva a ligação lexical entre as duas formas do verbo נצל e o contraste entre a ação do pastor e o destino anunciado a Israel.
- source_word: הָרֹעֶה
  choice: o pastor
  rationale: Reflete o artigo hebraico e funciona naturalmente como personagem genérico da comparação.
- source_word: מִפִּי הָאֲרִי
  choice: da boca do leão
  rationale: Reproduz com clareza e vivacidade a expressão hebraica.
- source_word: שְׁתֵּי כְרָעַיִם
  choice: duas pernas
  rationale: Comunica de maneira direta os escassos restos do animal recuperados pelo pastor.
- source_word: בְדַל אֹזֶן
  choice: um pedaço de orelha
  rationale: בְדַל indica um fragmento ou parte separada; “pedaço” é concreto e natural.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão coletiva tradicional do hebraico; uma nota esclarece a equivalência idiomática “os israelitas”.
- source_word: הַיֹּשְׁבִים בְּשֹׁמְרוֹן
  choice: que vivem em Samaria
  rationale: Expressa em português atual o sentido habitual do particípio ישׁב neste contexto, sem a rigidez de “habitam”.
- source_word: בִּפְאַת מִטָּה
  choice: no canto de uma cama
  rationale: Mantém a imagem concreta e a preposição locativa, sem definir de forma especulativa a relação exata entre os sobreviventes e o móvel.
- source_word: וּבִדְמֶשֶׁק עָרֶשׂ
  choice: e num divã de Damasco
  rationale: Conserva a leitura consonantal e vocalizada do Texto Massorético, distinguindo עָרֶשׂ da cama mencionada antes; a nota registra a obscuridade e outras análises possíveis.
theological_decisions:
- issue: Se a comparação deve ser suavizada como promessa ampla de livramento ou mantida como imagem de sobrevivência mínima
  choice: Manter a imagem contundente de um resgate reduzido a restos mínimos
  alternative: Generalizar como sobrevivência do juízo sem destacar quão pequeno é o remanescente
  rationale: O pastor tira da boca do leão apenas fragmentos do animal. A formulação concreta preserva a força irônica e judicial da comparação, sem transformar o anúncio em promessa de livramento substancial.
- issue: Como traduzir a obscura expressão final
  choice: Manter no texto principal a leitura massorética “num divã de Damasco” e explicar a incerteza em nota
  alternative: Traduzir como “num divã revestido de damasco”, “sobre um divã em Damasco” ou “com a cobertura de um divã”
  rationale: A sintaxe e o sentido da expressão são incertos. Preservar a leitura hebraica atestada no texto principal, acompanhada de nota, evita apresentar como certa uma interpretação conjectural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe profética foi preservada sem artificialidade. O travessão destaca a expressão final obscura, enquanto as notas tornam transparentes tanto o hebraísmo “filhos de Israel” quanto a incerteza textual e sintática do encerramento.
