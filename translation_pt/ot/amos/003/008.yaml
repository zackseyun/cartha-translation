base_translation:
  language: en
  yaml_path: translation/ot/amos/003/008.yaml
  text: A lion has roared—who will not fear? The Lord GOD has spoken—who will not prophesy?[a][b]
translation:
  language: pt
  text: Um leão rugiu — quem não temerá? O Senhor Yahweh falou[a] — quem não profetizará?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Senhor YHWH”. Também se pode traduzir: “o Senhor Javé”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, de forma mais idiomática: “quem poderá deixar de profetizar?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: o leão
  rationale: O substantivo comum designa o animal; o artigo definido soa natural em português na formulação proverbial desta pergunta retórica.
- source_word: שָׁאָג
  choice: rugiu
  rationale: O perfeito qal indica a ação já ocorrida. O pretérito perfeito português preserva com naturalidade a relação entre o rugido e a reação inevitável.
- source_word: מִי לֹא יִירָא
  choice: quem não terá medo?
  rationale: A pergunta retórica espera que todos sintam medo. O futuro traduz adequadamente a força modal ou consequente do imperfeito hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: O Senhor Yahweh
  rationale: Mantém tanto o título אֲדֹנָי, “Senhor”, como o nome divino יהוה, sem fundi-lo com o substantivo “Deus”. A nota registra a forma litúrgica tradicional.
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito piel apresenta a fala como fato consumado e mantém o paralelismo com “rugiu”.
- source_word: מִי לֹא יִנָּבֵא
  choice: quem não profetizará?
  rationale: Traduz diretamente a pergunta retórica e o verbo נבא, preservando o paralelismo e a ideia de resposta inevitável à fala divina.
theological_decisions:
- issue: Representação do nome divino יהוה no título composto אֲדֹנָי יְהוִה
  choice: O Senhor Yahweh
  alternative: O Senhor DEUS; o Senhor Javé
  rationale: A forma escolhida distingue o título “Senhor” do nome próprio divino e evita apagar essa distinção. “O Senhor DEUS” representa a convenção tradicional de leitura, enquanto “Javé” é uma adaptação portuguesa corrente da mesma reconstrução do nome.
- issue: Força da pergunta “quem não profetizará?”
  choice: Manter a pergunta retórica sem explicitar incapacidade ou compulsão
  alternative: quem poderá deixar de profetizar?
  rationale: O hebraico expressa uma consequência inevitável por meio de pergunta retórica, mas não declara diretamente qual é a natureza dessa necessidade. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo compacto. O pretérito perfeito nos dois primeiros verbos e o futuro nas perguntas preservam a sequência de causa e resposta do hebraico.
