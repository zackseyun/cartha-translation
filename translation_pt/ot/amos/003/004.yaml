base_translation:
  language: en
  yaml_path: translation/ot/amos/003/004.yaml
  text: Does a lion roar in the forest when it has no prey? Does a young lion raise its voice from its den unless it has caught something?[a][b]
translation:
  language: pt
  text: Acaso o leão ruge na floresta quando não tem presa? Acaso o leão jovem faz ouvir sua voz de sua toca, a menos que tenha capturado algo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a menos que tenha capturado”. O objeto é subentendido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁאַג
  choice: ruge
  rationale: O verbo designa o bramido forte do leão; “rugir” é o equivalente português natural e preciso.
- source_word: אַרְיֵה
  choice: leão
  rationale: Equivalência direta, adequada à imagem e ao paralelismo.
- source_word: בַּיַּעַר
  choice: na floresta
  rationale: יַעַר denota floresta ou região arborizada; “floresta” é claro e corrente.
- source_word: טֶרֶף
  choice: presa
  rationale: No contexto da caça do leão, o substantivo indica o animal capturado ou alimento obtido pela predação.
- source_word: אֵין לוֹ
  choice: sem ter
  rationale: Expressa ausência ou falta; esta formulação torna a pergunta retórica fluente em português.
- source_word: כְּפִיר
  choice: leão jovem
  rationale: O termo se refere a um leão novo e vigoroso, não necessariamente a um filhote pequeno.
- source_word: יִתֵּן קוֹלוֹ
  choice: solta a voz
  rationale: O hebraico diz literalmente “dá sua voz”; “solta a voz” conserva a imagem e soa natural em português.
- source_word: מִמְּעֹנָתוֹ
  choice: de sua toca
  rationale: O substantivo indica a habitação do animal; “toca” é uma designação natural em português.
- source_word: בִּלְתִּי אִם
  choice: sem
  rationale: Na pergunta retórica, a locução introduz a condição excepcional; “sem ter” comunica de modo idiomático o valor de “a menos que”.
- source_word: לָכָד
  choice: ter capturado alguma coisa
  rationale: O verbo significa apanhar ou capturar. O objeto não aparece no hebraico, mas é inferido do contexto; “alguma coisa” explicita essa elipse sem restringi-la além do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com perguntas retóricas paralelas. “Acaso” sinaliza naturalmente a resposta negativa esperada. A formulação preserva a progressão entre o leão que tem presa e o leão jovem que já capturou algo.
