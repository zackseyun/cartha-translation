id: AMO.3.6
reference: Amos 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם יִתָּקַ֤ע שׁוֹפָר֙ בְּ/עִ֔יר וְ/עָ֖ם לֹ֣א יֶחֱרָ֑דוּ אִם תִּהְיֶ֤ה רָעָה֙ בְּ/עִ֔יר וַ/יהוָ֖ה לֹ֥א עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/006.yaml
  text: If a trumpet is blown in a city[a], do not the people tremble? If disaster happens in a city, has not Yahweh done it?
translation:
  language: pt
  text: Se a trombeta soar numa cidade, o povo não ficará alarmado? Se uma calamidade[a] acontecer numa cidade, não foi o SENHOR quem a fez?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desastre”. O termo hebraico também pode significar “mal”, mas aqui se refere a calamidade ou juízo, não ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַע שׁוֹפָר
  choice: a trombeta soar
  rationale: שׁוֹפָר designa uma trombeta ou corneta, muitas vezes de chifre, usada aqui como sinal público de alarme. “A trombeta soar” é natural em português e comunica essa função sem exigir uma explicação no texto.
- source_word: בְּעִיר
  choice: numa cidade
  rationale: עִיר é o termo comum para cidade ou povoado. “Numa cidade” preserva o cenário cívico repetido e o paralelismo do versículo.
- source_word: וְעָם
  choice: o povo
  rationale: Refere-se naturalmente aos habitantes da cidade. O artigo definido exigido pelo uso idiomático em português torna clara essa referência.
- source_word: יֶחֱרָדוּ
  choice: ficará alarmado
  rationale: חרד expressa tremor, medo ou sobressalto diante de um perigo. “Ficará alarmado” comunica com naturalidade a reação coletiva à trombeta de advertência.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste contexto, רָעָה indica um acontecimento danoso ou juízo, não maldade moral. “Calamidade” preserva a gravidade e evita atribuir perversidade moral ao SENHOR; a amplitude lexical é indicada em nota.
- source_word: תִּהְיֶה
  choice: acontecer
  rationale: Com רָעָה como sujeito, o verbo היה descreve a ocorrência da calamidade. “Acontecer” é claro e idiomático em português atual.
- source_word: וַיהוָה
  choice: o SENHOR
  rationale: A forma em versaletes segue a convenção reverencial estabelecida para representar o nome divino יהוה.
- source_word: עָשָׂה
  choice: a causou
  rationale: עשה é amplo, “fazer” ou “realizar”. Neste contexto, “a causou” expressa de modo natural que o SENHOR é o agente da calamidade, sem suavizar a afirmação incisiva da pergunta retórica.
theological_decisions:
- issue: Sentido de רָעָה em relação à ação do SENHOR
  choice: calamidade
  alternative: mal; desastre
  rationale: O contexto de alarme urbano e juízo profético aponta para calamidade, não para maldade moral. A escolha mantém a soberania divina sobre o juízo sem dizer que o SENHOR pratica o mal moral.
- issue: Agência divina na segunda pergunta
  choice: não foi o SENHOR quem a causou?
  alternative: não foi o SENHOR quem a fez?; não foi o SENHOR quem a trouxe?
  rationale: O hebraico atribui diretamente ao SENHOR a ação relacionada à calamidade. A formulação portuguesa preserva essa tensão teológica e a força retórica, sem transformar a afirmação em mera permissão passiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “numa cidade” conserva o paralelismo hebraico; as duas perguntas retóricas mantêm a progressão entre o sinal de alarme e a ação divina.
