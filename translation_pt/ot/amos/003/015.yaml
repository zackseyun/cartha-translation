source:
  edition: WLC
  text: וְ/הִכֵּיתִ֥י בֵית הַ/חֹ֖רֶף עַל בֵּ֣ית הַ/קָּ֑יִץ וְ/אָבְד֞וּ בָּתֵּ֣י הַ/שֵּׁ֗ן וְ/סָפ֛וּ בָּתִּ֥ים רַבִּ֖ים נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
translation:
  language: pt
  text: E ferirei a casa de inverno juntamente com a casa de verão; as casas de marfim[a] desaparecerão, e muitas casas chegarão ao fim — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “as casas ornamentadas com marfim”. Provavelmente eram casas luxuosas decoradas com incrustações de marfim, não construídas literalmente de marfim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: E ferirei
  rationale: Traduz נכה de modo direto e solene, preservando a força do juízo divino sem acrescentar que as casas serão necessariamente arrasadas já neste verbo.
- source_word: בֵית הַחֹרֶף
  choice: a casa de inverno
  rationale: Expressa naturalmente uma residência usada no inverno e preserva a implicação socioeconômica de residências sazonais.
- source_word: עַל
  choice: juntamente com
  rationale: Neste paralelismo, liga as duas casas como objetos do mesmo golpe; evita o sentido espacial que uma tradução como “sobre” poderia sugerir.
- source_word: בֵּית הַקָּיִץ
  choice: a casa de verão
  rationale: Mantém o paralelismo com “casa de inverno” e a referência a uma residência sazonal.
- source_word: וְאָבְדוּ
  choice: desaparecerão
  rationale: Preserva o valor intransitivo de אבד, que pode significar perecer, perder-se ou desaparecer, e soa natural quando o sujeito são casas.
- source_word: בָּתֵּי הַשֵּׁן
  choice: as casas de marfim
  rationale: Conserva a imagem concisa do hebraico; provavelmente se trata de casas luxuosas ornamentadas com incrustações de marfim, esclarecimento mantido em nota.
- source_word: וְסָפוּ
  choice: chegarão ao fim
  rationale: Comunica o sentido resultativo de סוף sem especificar um mecanismo de destruição que o texto não declara.
- source_word: בָּתִּים רַבִּים
  choice: muitas casas
  rationale: רַבִּים tem aqui seu sentido quantitativo mais direto, “muitas”, em vez de uma inferência contextual como “grandes” ou “suntuosas”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética com dignidade e mantém o nome divino pessoal presente no texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal e é uma transliteração amplamente reconhecida, sem substituí-lo por um título.
- issue: Sentido de בָּתִּים רַבִּים
  choice: muitas casas
  alternative: casas grandes
  rationale: A tradução quantitativa preserva o sentido lexical mais comum de רַבִּים e evita introduzir no corpo do texto uma caracterização socioeconômica inferida do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo das residências sazonais e a progressão dos verbos de juízo foram preservados; o travessão destaca naturalmente a fórmula profética final.
