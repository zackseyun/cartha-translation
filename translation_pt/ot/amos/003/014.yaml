source:
  edition: WLC
  text: כִּ֗י בְּ/י֛וֹם פָּקְדִ֥/י פִשְׁעֵֽי יִשְׂרָאֵ֖ל עָלָ֑י/ו וּ/פָֽקַדְתִּי֙ עַל מִזְבְּח֣וֹת בֵּֽית אֵ֔ל וְ/נִגְדְּעוּ֙ קַרְנ֣וֹת הַ/מִּזְבֵּ֔חַ וְ/נָפְל֖וּ לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/014.yaml
  text: For on the day when I punish Israel for his transgressions[a], I will also punish the altars of Bethel[b]; the horns of the altar will be cut off and fall to the ground.
translation:
  language: pt
  text: Pois, no dia em que eu castigar Israel por suas rebeliões[a], também castigarei os altares de Betel; os chifres do altar serão cortados e cairão por terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedir contas a Israel por suas rebeliões” ou “visitar Israel por suas rebeliões”. O verbo hebraico pode indicar uma visita no sentido de chamar alguém a prestar contas ou de puni-lo.
    reason: lexical_alternative
  - marker: b
    text: Os “chifres” eram saliências em forma de chifre nos cantos do altar, associadas à sua santidade e ao seu uso ritual.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da declaração anterior, preservando a força causal do hebraico.
- source_word: בְּיוֹם פָּקְדִי
  choice: no dia em que eu pedir contas
  rationale: Mantém a expressão temporal e traduz פקד no contexto judicial como ação de chamar à responsabilidade, sem reduzir toda a amplitude do verbo a uma única ideia.
- source_word: פִשְׁעֵי
  choice: rebeliões
  rationale: פשע designa transgressões entendidas como revolta contra a autoridade legítima; “rebeliões” comunica claramente essa força moral e pactual.
- source_word: יִשְׂרָאֵל עָלָיו
  choice: a Israel por suas rebeliões
  rationale: O sufixo singular retoma Israel como coletividade. Em português, “suas” é natural e mantém a referência sem impor gênero ao povo.
- source_word: וּפָקַדְתִּי עַל
  choice: também pedirei contas aos
  rationale: A repetição de פקד vincula o julgamento de Israel ao dos altares; “também” explicita naturalmente a força aditiva da conjunção.
- source_word: מִזְבְּחוֹת בֵּית אֵל
  choice: os altares de Betel
  rationale: Reprodução direta da cadeia construta, usando a forma portuguesa corrente do topônimo bíblico.
- source_word: וְנִגְדְּעוּ
  choice: serão cortados
  rationale: גדע expressa cortar ou decepar; a forma passiva preserva a estrutura e o efeito violento da imagem.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: os chifres do altar
  rationale: Mantém literalmente o elemento arquitetônico e ritual específico, sem achatar a imagem em uma paráfrase.
- source_word: וְנָפְלוּ לָאָרֶץ
  choice: e cairão por terra
  rationale: Expressão portuguesa natural e digna para a queda física ao chão.
theological_decisions:
- issue: Sentido judicial do verbo פקד
  choice: pedir contas
  alternative: punir; visitar
  rationale: “Pedir contas” preserva o caráter judicial da visita divina e parte da amplitude semântica do verbo. A nota registra alternativas legítimas, evitando ocultar a ambiguidade lexical.
- issue: Referência coletiva a Israel
  choice: a Israel por suas rebeliões
  alternative: a Israel pelas rebeliões dele
  rationale: O hebraico trata Israel como coletivo singular. O possessivo “suas” é idiomático em português, preserva a relação com Israel e evita uma formulação artificial.
- issue: Preservação da imagem cultual
  choice: os chifres do altar
  alternative: as pontas salientes do altar
  rationale: Os chifres são partes literais e ritualmente significativas do altar. Conservar o termo mantém o foco do juízo sobre o aparato cultual de Betel.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Pedir contas” preserva o tom judicial e a repetição verbal do hebraico; “por terra” mantém concisão profética. Todos os marcadores de nota aparecem no texto.
