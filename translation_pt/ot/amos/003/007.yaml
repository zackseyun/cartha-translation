  text: כִּ֣י לֹ֧א יַעֲשֶׂ֛ה אֲדֹנָ֥/י יְהוִ֖ה דָּבָ֑ר כִּ֚י אִם גָּלָ֣ה סוֹד֔/וֹ אֶל עֲבָדָ֖י/ו הַ/נְּבִיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/007.yaml
  text: For the Lord GOD does nothing unless he reveals his secret to his servants the prophets[a].
translation:
  language: pt
  text: Pois o Senhor Yahweh não faz coisa alguma sem revelar seu segredo aos seus servos, os profetas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu conselho secreto” ou “seu plano confidencial”. A palavra hebraica pode indicar conselho confidencial, deliberação íntima ou assunto secreto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da afirmação anterior e mantém com naturalidade o encadeamento do discurso.
- source_word: לֹא ... כִּי אִם
  choice: não faz coisa alguma sem
  rationale: A construção negativa com exceção indica que Yahweh não age sem realizar primeiro a revelação mencionada; esta formulação é clara e idiomática em português.
- source_word: יַעֲשֶׂה ... דָּבָר
  choice: faz coisa alguma
  rationale: Preserva a amplitude de עשה e דבר sem sugerir apenas um ato específico; sob negação, 'coisa alguma' é natural em português.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois componentes do título hebraico, distinguindo אֲדֹנָי, 'Senhor', do nome divino יהוה, 'Yahweh'.
- source_word: גָּלָה
  choice: revelar
  rationale: Expressa o sentido de descobrir ou tornar conhecido; o infinitivo após 'sem' corresponde naturalmente à relação verbal no português.
- source_word: סוֹדוֹ
  choice: seu segredo
  rationale: Mantém a formulação ampla do hebraico סוד, que pode abranger assunto confidencial, conselho íntimo ou plano reservado, sem restringi-la no corpo do texto.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto profético, designa pessoas a serviço e sob comissão divina; 'servos' é digno e contextualmente adequado.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Equivalente direto do substantivo definido no plural.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução explicita tanto o título אֲדֹנָי quanto o nome próprio יהוה, evitando que os dois elementos se confundam e preservando o nome pactual presente no texto.
- issue: Amplitude semântica de סוֹד
  choice: seu segredo
  alternative: seu conselho secreto / seu plano confidencial
  rationale: A escolha preserva a ambiguidade lexical e a tensão teológica do original, sem definir o conteúdo como decreto determinista ou mero plano; a nota registra as nuances possíveis.
- issue: Alcance da afirmação negativa
  choice: não faz coisa alguma sem revelar
  alternative: não faz nada, a não ser que revele
  rationale: Mantém a afirmação abrangente do provérbio profético sem acrescentar qualificações temporais como 'antes', que não estão expressas lexicalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o tom proverbial e solene do hebraico sem arcaísmos desnecessários.
