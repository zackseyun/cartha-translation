id: AMO.3.13
reference: Amos 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֥וּ וְ/הָעִ֖ידוּ בְּ/בֵ֣ית יַֽעֲקֹ֑ב נְאֻם אֲדֹנָ֥/י יְהוִ֖ה אֱלֹהֵ֥י הַ/צְּבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/013.yaml
  text: Hear and testify against the house of Jacob[a], declares the Lord GOD[b], the God of hosts.
translation:
  language: pt
  text: Ouçam e deem testemunho contra a casa de Jacó[a] — declara o Senhor Yahweh[b], o Deus dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deem testemunho na casa de Jacó” ou “à casa de Jacó”; o verbo hebraico pode indicar testemunho em sentido judicial, e a preposição admite mais de uma relação.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o título composto “Adonai Yahweh”, isto é, “Senhor Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural mantém a convocação profética dirigida a mais de um ouvinte; “ouçam” é natural, solene e direto em português atual.
- source_word: וְהָעִידוּ
  choice: deem testemunho contra
  rationale: O hifil imperativo de עוד tem aqui sentido forense de prestar testemunho. A formulação preserva melhor essa nuance judicial do que “avisem”.
- source_word: בְּבֵית יַעֲקֹב
  choice: contra a casa de Jacó
  rationale: Embora בְּ possa admitir “na” ou “à”, o contexto de juízo e o valor forense do verbo favorecem “contra”; “casa de Jacó” conserva a designação coletiva e pactual de Israel.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente e digno da fórmula profética que apresenta a fala como pronunciamento divino autorizado.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: “Senhor” representa אֲדֹנָי, enquanto “Yahweh” preserva o nome divino יהוה e evita a expressão pouco natural “Senhor SENHOR”.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Mantém a amplitude e o peso tradicional do título hebraico sem restringir os exércitos a referentes apenas terrenos ou apenas celestes.
theological_decisions:
- issue: Representação do nome divino יהוה no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome pactual יהוה, preservando este último como “Yahweh” sem confundir ambos como simples títulos.
- issue: Direção do testemunho indicado por בְּ
  choice: contra a casa de Jacó
  alternative: na casa de Jacó / à casa de Jacó
  rationale: O contexto judicial e condenatório favorece testemunho acusatório, mas a nota registra a amplitude possível da preposição e do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural explícitas. A construção forense é mantida sem eliminar a ambiguidade hebraica, registrada em nota. “Deus dos Exércitos” conserva a forma tradicional e intertextualmente reconhecível do título.
