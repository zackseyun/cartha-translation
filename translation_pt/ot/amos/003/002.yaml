  text: רַ֚ק אֶתְ/כֶ֣ם יָדַ֔עְתִּי מִ/כֹּ֖ל מִשְׁפְּח֣וֹת הָ/אֲדָמָ֑ה עַל כֵּן֙ אֶפְקֹ֣ד עֲלֵי/כֶ֔ם אֵ֖ת כָּל עֲוֺנֹֽתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/002.yaml
  text: You only have I known from among all the families of the earth[b][a]; therefore I will punish you for all your iniquities.
translation:
  language: pt
  text: Só a vocês conheci[a] entre todas as famílias da terra; por isso, castigarei vocês[b] por todas as suas iniquidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Só a vocês escolhi” ou “reconheci entre todas as famílias da terra”. O verbo hebraico traduzido como “conheci” pode indicar uma relação especial de aliança.'
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “farei recair sobre vocês todas as suas iniquidades”, isto é, “pedirei contas a vocês por elas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Só
  rationale: Expressa de modo natural e enfático a exclusividade indicada pelo termo hebraico no início da oração.
- source_word: יָדַעְתִּי
  choice: conheci
  rationale: Preserva o sentido lexical básico de ידע e sua riqueza relacional, permitindo que o contexto comunique as implicações de reconhecimento e eleição ligados à aliança.
- source_word: מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה
  choice: entre todas as famílias da terra
  rationale: “Famílias” mantém o caráter coletivo e humano de מִשְׁפְּחוֹת, enquanto “da terra” indica aqui a humanidade em toda a terra, não apenas uma região local.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: 'Marca com clareza e naturalidade a consequência: a relação singular de Israel com Deus aumenta sua responsabilidade diante do juízo.'
- source_word: אֶפְקֹד עֲלֵיכֶם
  choice: castigarei vocês
  rationale: No contexto de juízo pelas iniquidades, פקד significa responsabilizar e punir. “Castigarei” comunica diretamente essa força judicial em português atual.
- source_word: עֲוֺנֹתֵיכֶם
  choice: suas iniquidades
  rationale: “Iniquidades” preserva o peso moral e judicial de עָוֹן, que pode abranger tanto a perversidade quanto a culpa decorrente dela.
theological_decisions:
- issue: Nuance de aliança em יָדַע (“conhecer”)
  choice: Manter “conheci” no texto principal, com nota sobre as nuances “escolhi” e “reconheci”.
  alternative: Traduzir diretamente como “escolhi” ou “reconheci”.
  rationale: O verbo hebraico é “conhecer”, mas neste contexto descreve uma relação singular com Israel e pode ter conotações de aliança e eleição. A tradução literal preserva essa tensão sem restringir prematuramente o sentido.
- issue: Força judicial de פקד
  choice: Traduzir como “castigarei”.
  alternative: Traduzir mais literalmente como “visitarei sobre vocês” ou interpretativamente como “pedirei contas a vocês”.
  rationale: A menção explícita às iniquidades estabelece um contexto de juízo. “Castigarei” transmite o sentido contextual com clareza, enquanto a nota registra a expressão hebraica e sua ideia de prestação de contas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem inicial “Só a vocês” conserva a ênfase do hebraico sem soar artificial. Emprega-se “vocês” para o plural dirigido ao povo, evitando a ambiguidade regional de “vós” e mantendo distinção clara em relação ao singular.
