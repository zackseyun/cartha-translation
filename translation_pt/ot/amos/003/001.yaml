id: AMO.3.1
reference: Amos 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל עַ֚ל כָּל הַ/מִּשְׁפָּחָ֔ה אֲשֶׁ֧ר הֶעֱלֵ֛יתִי מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/001.yaml
  text: 'Hear this word that Yahweh has spoken against you[a], sons of Israel, against the whole family that I brought up from the land of Egypt, saying:'
translation:
  language: pt
  text: 'Ouçam esta palavra que Yahweh falou contra vocês, filhos de Israel[a], contra toda a família que fiz subir da terra do Egito, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas” ou “povo de Israel”. O hebraico diz literalmente “filhos de Israel”, preservando a linguagem familiar da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural preserva a convocação profética e é natural no português atual.
- source_word: הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: Mantém a formulação profética de uma palavra divina, sem reduzi-la apenas a uma mensagem.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh falou
  rationale: O perfeito hebraico introduz a declaração divina; o pretérito perfeito é direto e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עֲלֵיכֶם
  choice: contra vocês
  rationale: No contexto de juízo profético, על comunica direção adversa, embora 'a respeito de vocês' seja lexicalmente possível.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz o idioma familiar e pactual do hebraico, com uma nota que esclarece seu sentido coletivo.
- source_word: עַל כָּל הַמִּשְׁפָּחָה
  choice: contra toda a família
  rationale: Preserva tanto a repetição de על quanto a imagem corporativa de parentesco.
- source_word: הֶעֱלֵיתִי
  choice: fiz subir
  rationale: Reflete o causativo e o idioma hebraico tradicional do êxodo, embora 'tirei' seja mais idiomático em português.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Tradução direta da fórmula geográfica ligada ao êxodo.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula de introdução do discurso que prossegue no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; 'Yahweh' conserva o nome próprio e evita substituí-lo por um título.
- issue: Designação pactual בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A opção principal preserva a metáfora familiar e a forma masculina do hebraico, enquanto a nota explicita o referente coletivo.
- issue: Força de עֲלֵיכֶם e עַל
  choice: contra
  alternative: a respeito de; acerca de
  rationale: O contexto de acusação e juízo favorece a leitura adversativa, sem negar a amplitude semântica da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a convocação profética, o tom judicial, o nome divino e a imagem familiar do texto hebraico.
