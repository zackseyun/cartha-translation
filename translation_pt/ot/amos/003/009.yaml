source:
  edition: WLC
  text: הַשְׁמִ֨יעוּ֙ עַל אַרְמְנ֣וֹת בְּ/אַשְׁדּ֔וֹד וְ/עַֽל אַרְמְנ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אִמְר֗וּ הֵאָֽסְפוּ֙ עַל הָרֵ֣י שֹׁמְר֔וֹן וּ/רְא֞וּ מְהוּמֹ֤ת רַבּוֹת֙ בְּ/תוֹכָ֔/הּ וַ/עֲשׁוּקִ֖ים בְּ/קִרְבָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/009.yaml
  text: Proclaim to the citadels of Ashdod and to the citadels in the land of Egypt[a], and say, “Assemble on the mountains of Samaria, and see the many tumults within her[d][c][b], and the oppressed in her midst.”
translation:
  language: pt
  text: 'Proclamem nos palácios de Asdode e nos palácios da terra do Egito[a] e digam: “Reúnam-se nos montes de Samaria[b] e vejam os muitos tumultos dentro dela[c] e os oprimidos em seu meio[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidadelas”. O termo hebraico pode indicar palácios ou residências grandiosas com caráter fortificado.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas montanhas de Samaria”.
    reason: lexical_alternative
  - marker: c
    text: Ou “muitas agitações” ou “grande desordem”.
    reason: lexical_alternative
  - marker: d
    text: Ou “as opressões” ou “os atos de opressão”. A forma hebraica também pode ser entendida de modo abstrato, embora “os oprimidos” corresponda bem à sua forma passiva e ao contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: Proclamem
  rationale: O imperativo hifil de שׁמע funciona aqui como ordem para fazer um anúncio público; “Proclamem” mantém a força imperativa em português natural.
- source_word: אַרְמְנוֹת
  choice: palácios fortificados
  rationale: O termo pode designar residências grandiosas com caráter defensivo. A expressão conserva tanto a ideia palaciana quanto a de fortificação, sem reduzi-la apenas a “palácios” ou “fortalezas”.
- source_word: בְּאַשְׁדּוֹד
  choice: nos palácios fortificados de Asdode
  rationale: Embora a preposição seja locativa, em português a relação com os edifícios da cidade é expressa naturalmente por “de Asdode”.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém a formulação plena do hebraico e concorda naturalmente com “palácios fortificados”.
- source_word: הֵאָסְפוּ
  choice: Reúnam-se
  rationale: O imperativo nifal convoca os destinatários a se ajuntarem como testemunhas; “Reúnam-se” é claro e corrente.
- source_word: הָרֵי שֹׁמְרוֹן
  choice: os montes de Samaria
  rationale: הַר pode denotar monte ou montanha; “montes” preserva a elevação e soa natural na geografia bíblica em português.
- source_word: מְהוּמוֹת רַבּוֹת
  choice: as muitas agitações
  rationale: A expressão indica tumulto, desordem ou perturbação social. “Muitas agitações” mantém o plural e evita especificar indevidamente a natureza dos distúrbios.
- source_word: בְּתוֹכָהּ
  choice: dentro dela
  rationale: Refere-se à cidade de Samaria em gênero feminino e preserva sua personificação.
- source_word: עֲשׁוּקִים
  choice: os oprimidos
  rationale: A forma passiva é tomada substantivamente, designando pessoas submetidas à opressão; essa leitura se ajusta à forma gramatical e ao contexto social de Amós.
- source_word: בְּקִרְבָּהּ
  choice: em seu meio
  rationale: Expressa o interior da cidade e varia naturalmente em relação ao precedente “dentro dela”, sem alterar o sentido espacial.
theological_decisions:
- issue: Referente de עֲשׁוּקִים no que deve ser visto em Samaria
  choice: Pessoas oprimidas dentro de Samaria
  alternative: Atos de opressão ou opressões como condição abstrata
  rationale: A forma hebraica admite leitura substantivada e passiva, “os oprimidos”, que destaca as vítimas visíveis da injustiça. A alternativa abstrata permanece registrada em nota para preservar a questão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a cadência profética foram preservados; as ambiguidades de אַרְמְנוֹת, הָרֵי e עֲשׁוּקִים são documentadas em notas.
