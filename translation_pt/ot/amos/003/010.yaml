source:
  edition: WLC
  text: וְ/לֹֽא יָדְע֥וּ עֲשׂוֹת נְכֹחָ֖ה נְאֻם יְהוָ֑ה הָ/אֽוֹצְרִ֛ים חָמָ֥ס וָ/שֹׁ֖ד בְּ/אַרְמְנֽוֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/010.yaml
  text: They do not know how to do what is right—oracle of Yahweh—those who store up violence and destruction in their citadels[a][b].
translation:
  language: pt
  text: Não sabem fazer o que é certo — oráculo de Yahweh — os que acumulam violência e destruição[a] em suas cidadelas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saque”.
    reason: lexical_alternative
  - marker: b
    text: Ou “palácios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדְעוּ
  choice: não sabem
  rationale: O verbo ידע denota conhecer ou saber; com o infinitivo עֲשׂוֹת, exprime aqui a falta de saber moral prático, não apenas desconhecimento abstrato.
- source_word: עֲשׂוֹת נְכֹחָה
  choice: fazer o que é certo
  rationale: A expressão comunica conduta reta ou correta. Esta formulação é idiomática em português e preserva o sentido moral.
- source_word: נְאֻם יְהוָה
  choice: oráculo de Yahweh
  rationale: נְאֻם é uma fórmula profética solene que identifica a declaração divina; “oráculo” mantém esse registro formal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָאֹצְרִים
  choice: os que acumulam
  rationale: O particípio de אצר descreve aqueles que armazenam ou ajuntam continuamente o produto da opressão.
- source_word: חָמָס
  choice: violência
  rationale: חָמָס designa violência, injustiça violenta ou opressão; “violência” é direto e adequado à denúncia profética.
- source_word: שֹׁד
  choice: destruição
  rationale: שֹׁד pode indicar destruição violenta ou saque. “Destruição” forma um par natural com “violência”, enquanto “saque” é mantido em nota como alternativa plausível.
- source_word: בְּאַרְמְנוֹתֵיהֶם
  choice: em suas cidadelas
  rationale: אַרְמוֹן pode designar palácio, residência fortificada ou cidadela. “Cidadelas” realça a segurança fortificada das elites sem excluir a alternativa “palácios”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, sem trocá-lo por um título.
- issue: Incapacidade moral ou simples ignorância em וְלֹא יָדְעוּ עֲשׂוֹת נְכֹחָה
  choice: Não sabem fazer o que é certo
  alternative: Não sabem o que é certo; não aprenderam a agir corretamente
  rationale: A construção denuncia uma sociedade cuja prática moral foi corrompida, mas a tradução não transforma essa acusação em uma afirmação sistemática de incapacidade absoluta.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A interrupção “oráculo de Yahweh” conserva a forma enfática da declaração profética, e “cidadelas” mantém a associação entre riqueza, poder e proteção fortificada.
