  language: pt
  text: Será que dois caminham juntos sem terem combinado encontrar-se?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem terem entrado em acordo” ou “sem terem marcado um encontro”. O verbo hebraico pode transmitir a ideia de combinar ou marcar previamente um encontro.'
