lexical_decisions:
- source_word: הֲ/יֵלְכוּ
  choice: Será que ... caminham
  rationale: A partícula interrogativa com o imperfeito introduz uma pergunta retórica de valor geral; esta formulação preserva o caráter proverbial sem sugerir apenas futuro ou capacidade.
- source_word: שְׁנַיִם
  choice: dois
  rationale: O numeral refere-se simplesmente a duas pessoas; em português, o masculino não marcado é natural neste contexto.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Expressa a ideia adverbial de agir ou caminhar em conjunto, de modo conciso e idiomático.
- source_word: בִּלְתִּי אִם
  choice: sem
  rationale: Na construção interrogativa, transmite naturalmente a condição de exceção equivalente a “a menos que”, evitando uma frase pesada.
- source_word: נוֹעָדוּ
  choice: terem combinado encontrar-se
  rationale: O nifal de יעד pode indicar um encontro previamente marcado ou combinado; a tradução explicita a noção recíproca e o arranjo anterior implicado pelo verbo.
