id: AMO.1.2
reference: Amos 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָה֙ מִ/צִיּ֣וֹן יִשְׁאָ֔ג וּ/מִ/ירוּשָׁלִַ֖ם יִתֵּ֣ן קוֹל֑/וֹ וְ/אָֽבְלוּ֙ נְא֣וֹת הָ/רֹעִ֔ים וְ/יָבֵ֖שׁ רֹ֥אשׁ הַ/כַּרְמֶֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
translation:
  language: pt
  text: 'E ele disse:


    “Yahweh ruge de Sião

    e faz ouvir a sua voz desde Jerusalém;[a]

    os pastos dos pastores lamentam,[b]

    e o cume do Carmelo seca.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “dá a sua voz”. Outra tradução possível: “solta a sua voz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as pastagens dos pastores ficam de luto”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a cabeça do Carmelo”, isto é, seu cume ou parte mais alta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: E ele disse
  rationale: Mantém a introdução narrativa e o encadeamento do hebraico sem identificar além do texto o referente de “ele”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִשְׁאָג
  choice: ruge
  rationale: Preserva a imagem vívida do rugido de um leão e a força verbal do anúncio profético.
- source_word: יִתֵּן קוֹלוֹ
  choice: faz ouvir a sua voz
  rationale: Expressa em português natural o idioma hebraico literalmente “dá a sua voz”, sem explicitar de modo interpretativo que a voz troveja.
- source_word: נְאוֹת הָרֹעִים
  choice: os pastos dos pastores
  rationale: No contexto rural, נְאוֹת designa áreas de pastagem; a formulação conserva a relação explícita com os pastores.
- source_word: אָבְלוּ
  choice: lamentam
  rationale: Preserva a personificação poética da terra; “murcham” expressaria o efeito físico, mas enfraqueceria a imagem de luto.
- source_word: רֹאשׁ הַכַּרְמֶל
  choice: o cume do Carmelo
  rationale: Traduz idiomaticamente “a cabeça do Carmelo” como sua parte mais elevada, sem acrescentar “monte” ao nome próprio.
- source_word: וְיָבֵשׁ
  choice: seca
  rationale: Reproduz diretamente a devastação física anunciada e mantém o paralelismo com o lamento dos pastos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva no corpo do texto o caráter de nome próprio, sem substituí-lo por um título.
- issue: Imagem da voz divina
  choice: ruge … faz ouvir a sua voz
  alternative: troveja
  rationale: A formulação mantém a comparação implícita com o rugido de um leão e o paralelismo hebraico, evitando resolver a imagem especificamente como trovão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A disposição poética evidencia o paralelismo. “Ruge” e “lamentam” conservam as personificações e imagens do hebraico; “faz ouvir a sua voz” evita o literalismo pouco natural de “dá a sua voz” sem impor a interpretação “troveja”.
