  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י דַמֶּ֔שֶׂק וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל דּוּשָׁ֛/ם בַּ/חֲרֻצ֥וֹת הַ/בַּרְזֶ֖ל אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/003.yaml
  text: 'Thus says Yahweh: “For three transgressions of Damascus[a], and for four, I will not revoke it, because they threshed Gilead with threshing sledges of iron.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões de Damasco, e por quatro, não o revogarei[a], porque trilharam Gileade com trenós de debulha de ferro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não voltarei atrás”; isto é, não reverterei o juízo.'
    reason: Alternativa para a expressão hebraica, cujo objeto é expresso apenas por um pronome e permanece sem antecedente explícito.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa diretamente o nome divino יהוה como Yahweh.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל אַרְבָּעָה
  choice: Por três transgressões de Damasco, e ainda por quatro
  rationale: Mantém a escalada numérica hebraica; “ainda” expressa em português natural que o quarto número intensifica o anterior sem reduzir a fórmula a uma contagem literal.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não voltarei atrás
  rationale: Reproduz o sentido idiomático de não reverter o juízo anunciado, sem inserir no texto principal um objeto explícito que o hebraico deixa apenas implícito no sufixo.
- source_word: עַל דּוּשָׁם
  choice: porque trilharam
  rationale: O segundo עַל introduz a causa do juízo. דושׁ designa o ato de trilhar ou debulhar; “trilharam” conserva a imagem agrícola aplicada metaforicamente à violência.
- source_word: בַּחֲרֻצוֹת הַבַּרְזֶל
  choice: com trilhos de ferro
  rationale: חֲרֻצוֹת são instrumentos pesados de debulha, providos de partes cortantes; “trilhos de ferro” é uma designação portuguesa concisa para esses implementos, sem confundi-los com caminhos ferroviários no contexto agrícola.
- source_word: אֶת הַגִּלְעָד
  choice: Gileade
  rationale: Emprega a forma tradicional e amplamente reconhecível do topônimo em português; a região representa coletivamente sua terra e seus habitantes.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de לֹא אֲשִׁיבֶנּוּ
  choice: não voltarei atrás
  alternative: não o revogarei; não retirarei o castigo
  rationale: A formulação escolhida comunica que Yahweh não reverterá a sentença, mas evita especificar como “castigo” o referente que permanece elíptico no hebraico.
- issue: Referente de Gileade na metáfora da debulha
  choice: manter simplesmente “Gileade”
  alternative: o povo de Gileade; a região de Gileade
  rationale: O original nomeia a região diretamente e permite que a violência contra sua população ou território permaneça coletivamente expressa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe profética concisa. “Transgressões” conserva o caráter de rebelião de פֶּשַׁע; “trilharam” e “trilhos de ferro” mantêm a metáfora agrícola brutal do original.
