id: AMO.1.1
reference: Amos 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דִּבְרֵ֣י עָמ֔וֹס אֲשֶׁר הָיָ֥ה בַ/נֹּקְדִ֖ים מִ/תְּק֑וֹעַ אֲשֶׁר֩ חָזָ֨ה עַל יִשְׂרָאֵ֜ל בִּ/ימֵ֣י עֻזִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה וּ/בִ/ימֵ֞י יָרָבְעָ֤ם בֶּן יוֹאָשׁ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל שְׁנָתַ֖יִם לִ/פְנֵ֥י הָ/רָֽעַשׁ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/001.yaml
  text: The words of Amos[a], who was among the shepherds from Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah and in the days of Jeroboam son of Joash, king of Israel[b], two years before the earthquake.
translation:
  language: pt
  text: Palavras de Amós, que estava entre os criadores de ovelhas[a] de Tecoa, as quais ele viu a respeito de Israel[b], nos dias de Uzias, rei de Judá, e nos dias de Jeroboão, filho de Joás, rei de Israel, dois anos antes do terremoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pastores”. O termo hebraico provavelmente se refere, de modo mais específico, a criadores de ovelhas.
    reason: lexical_alternative
  - marker: b
    text: Ou “contra Israel”. Em contextos proféticos, a preposição hebraica pode ter qualquer um desses sentidos; “a respeito de” foi adotado aqui como formulação mais ampla para a abertura do livro.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Palavras de
  rationale: O plural construto introduz o livro profético; “Palavras de” é uma fórmula de abertura natural e próxima do hebraico.
- source_word: בַנֹּקְדִים
  choice: entre os criadores de ovelhas
  rationale: נֹקֵד parece designar mais especificamente alguém que cria ou mantém rebanhos de ovelhas, não apenas um pastor; a preposição בַּ é representada por “entre os”.
- source_word: מִתְּקוֹעַ
  choice: de Tecoa
  rationale: A preposição מן indica procedência; “de Tecoa” é a forma idiomática em português.
- source_word: חָזָה
  choice: viu
  rationale: Mantém o verbo profético “ver” sem explicitar na tradução principal “recebeu em visão”.
- source_word: עַל יִשְׂרָאֵל
  choice: a respeito de Israel
  rationale: עַל pode significar “a respeito de” ou “contra” neste contexto. A primeira opção é mais ampla e menos interpretativamente restritiva numa abertura de livro.
- source_word: בִּימֵי ... וּבִימֵי
  choice: nos dias de ... e nos dias de
  rationale: Preserva a fórmula temporal hebraica de modo natural e digno em português.
- source_word: שְׁנָתַיִם לִפְנֵי הָרָעַשׁ
  choice: dois anos antes do terremoto
  rationale: Tradução direta da expressão temporal, mantendo a referência definida a um terremoto conhecido.
theological_decisions:
- issue: Relação, na abertura profética, entre “palavras” e “viu”
  choice: Mantida a construção “Palavras ... as quais ele viu”
  alternative: Reformular como “As palavras de Amós... Esta é a visão que ele teve” ou “A mensagem que Amós recebeu em visão”
  rationale: O hebraico associa formalmente o ato de ver às “palavras”, combinando mensagem verbal e revelação visionária. A tradução preserva essa tensão incomum sem impor uma explicação.
- issue: Sentido de עַל em relação a Israel
  choice: a respeito de Israel
  alternative: contra Israel
  rationale: Ambos os sentidos são possíveis em contexto profético. “A respeito de” conserva maior amplitude na abertura, enquanto a alternativa é registrada em nota.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com legibilidade brasileira. Os nomes seguem as formas bíblicas portuguesas usuais: Amós, Tecoa, Uzias, Jeroboão e Joás. A construção relativamente marcada “as quais ele viu” foi mantida deliberadamente para refletir a formulação profética do hebraico.'
