id: AMO.1.12
reference: Amos 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/תֵימָ֑ן וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בָּצְרָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/012.yaml
  text: So I will send fire upon Teman[a], and it will consume the citadels of Bozrah.
translation:
  language: pt
  text: Por isso, enviarei fogo contra Temã, e ele consumirá as fortalezas de Bozra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os palácios de Bozra”. O termo hebraico pode indicar residências palacianas ou estruturas fortificadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שִׁלַּחְתִּי
  choice: Por isso, enviarei
  rationale: O hifil de שׁלח significa normalmente “enviar”. A conjunção liga esta sentença à acusação anterior; “Por isso” expressa de modo natural em português a consequência própria do oráculo, sem perder a conexão.
- source_word: אֵשׁ
  choice: fogo
  rationale: É o sentido literal e usual, adequado à fórmula recorrente de juízo profético em Amós; não há razão textual para transformar a imagem em uma abstração.
- source_word: בְּ/תֵימָן
  choice: contra Temã
  rationale: Temã é topônimo. Embora ב possa significar “em”, com o verbo “enviar” e no contexto de juízo dirigido, “contra” comunica naturalmente o alvo do fogo em português.
- source_word: וְ/אָכְלָה
  choice: e ele consumirá
  rationale: אכל significa literalmente “comer”, mas, tendo o fogo como sujeito, significa idiomaticamente “consumir”. O pronome retoma “fogo” com clareza.
- source_word: אַרְמְנוֹת
  choice: as fortalezas
  rationale: O termo pode designar palácios, residências fortificadas ou cidadelas. “Fortalezas” preserva de modo legível a dimensão defensiva, enquanto a nota registra a alternativa “palácios”.
- source_word: בָּצְרָה
  choice: de Bozra
  rationale: Bozra é topônimo; a construção hebraica indica que as fortalezas pertencem à cidade ou nela se situam.
theological_decisions:
- issue: Fórmula profética de juízo
  choice: 'Manter o anúncio como ação divina direta: “enviarei fogo”.'
  alternative: Interpretar “fogo” de forma explícita como metáfora de destruição em geral.
  rationale: O hebraico apresenta uma imagem concreta e recorrente de juízo divino. A tradução não a suaviza nem define além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Temã” e “Bozra” seguem formas portuguesas usuais dos topônimos. A construção mantém o paralelismo simples e incisivo do oráculo.
