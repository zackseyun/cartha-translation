  text: וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מֵֽ/אַשְׁדּ֔וֹד וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מֵֽ/אַשְׁקְל֑וֹן וַ/הֲשִׁיב֨וֹתִי יָדִ֜/י עַל עֶקְר֗וֹן וְ/אָֽבְדוּ֙ שְׁאֵרִ֣ית פְּלִשְׁתִּ֔ים אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/008.yaml
  text: And I will cut off the inhabitant from Ashdod[a], and the one who holds the scepter from Ashkelon; I will turn my hand against Ekron[b], and the remnant of the Philistines shall perish,” says the Lord GOD.
translation:
  language: pt
  text: Eliminarei de Asdode o habitante e de Ascalom aquele que empunha o cetro; voltarei a minha mão contra Ecrom[a], e o remanescente dos filisteus perecerá — diz o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farei minha mão voltar-se contra Ecrom”. A expressão hebraica retrata a mão de Deus dirigida contra alguém em juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Eliminarei
  rationale: O hifil de כרת expressa cortar, remover ou exterminar. “Eliminarei” comunica naturalmente o juízo total no português atual sem perder a força do verbo.
- source_word: יוֹשֵׁב
  choice: o habitante
  rationale: Mantém o singular representativo do hebraico, que pode designar o morador ou, coletivamente, a população, sem restringi-lo a “governante”.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: aquele que empunha o cetro
  rationale: Preserva a imagem concreta de quem segura o símbolo da autoridade e deixa perceptível o sentido idiomático de governante.
- source_word: וַהֲשִׁיבוֹתִי יָדִי עַל
  choice: voltarei minha mão contra
  rationale: Reproduz de perto a metáfora hebraica de dirigir ou tornar a dirigir a mão em ação hostil, sem substituí-la pela expressão distinta “estenderei a mão”.
- source_word: וְאָבְדוּ
  choice: perecerá
  rationale: Conserva a construção intransitiva e o tom solene do anúncio profético.
- source_word: שְׁאֵרִית פְּלִשְׁתִּים
  choice: o remanescente dos filisteus
  rationale: “Remanescente” preserva o tema bíblico daquilo que resta após o juízo; aqui, esse restante também perece.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa os dois elementos do título hebraico: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”.'
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR / o Senhor DEUS
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome próprio יהוה e evita ocultar o nome divino, sem acrescentar uma interpretação denominacional.
- issue: Identidade de יוֹשֵׁב em Asdode
  choice: o habitante
  alternative: o governante
  rationale: O termo significa literalmente quem habita. Embora o paralelismo com o portador do cetro possa sugerir uma autoridade, a tradução mantém a ambiguidade lexical em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e de leitura natural, com topônimos tradicionais em português (Asdode, Ascalom, Ecrom). A estrutura paralela e a metáfora da mão foram preservadas. O único marcador de nota, [a], aparece no texto principal.
