source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/בֵ֣ית חֲזָאֵ֑ל וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/004.yaml
  text: So I will send fire upon the house of Hazael[a], and it will consume the citadels of Ben-hadad.
translation:
  language: pt
  text: E enviarei fogo contra a casa de Hazael, que consumirá as cidadelas[a] de Ben-Hadade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palácios”; o termo hebraico pode designar edifícios palacianos ou fortalezas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Por isso, enviarei
  rationale: O piel de שׁלח significa “enviar”. A conjunção וְ liga a sentença ao veredito anterior; “Por isso” expressa naturalmente em português a consequência própria do oráculo de juízo.
- source_word: אֵשׁ
  choice: fogo
  rationale: Mantém a imagem concreta do hebraico, sem substituí-la por uma explicação como guerra, destruição ou juízo.
- source_word: בְּבֵית חֲזָאֵל
  choice: contra a casa de Hazael
  rationale: Após “enviar fogo”, a preposição בְּ indica o alvo. “Casa” preserva a possível referência tanto à residência real quanto à casa dinástica de Hazael.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Transliteração corrente do nome próprio hebraico.
- source_word: וְאָכְלָה
  choice: e ele consumirá
  rationale: Embora אכל signifique literalmente “comer”, quando o fogo é o sujeito o sentido idiomático é “consumir”. O pronome retoma “fogo” sem enfraquecer a imagem.
- source_word: אַרְמְנוֹת
  choice: as cidadelas
  rationale: O termo pode designar palácios ou edifícios fortificados. “Cidadelas” ressalta a dimensão defensiva sem eliminar totalmente a associação com centros reais; a alternativa é registrada em nota.
- source_word: בֶּן הֲדָד
  choice: Ben-Hadade
  rationale: Forma portuguesa clara do nome ou título dinástico apresentado pelo hebraico como nome próprio.
theological_decisions:
- issue: Sentido de “casa de Hazael”
  choice: Manter “casa”, permitindo a leitura de casa real ou dinastia sob juízo
  alternative: Restringir a expressão ao palácio ou edifício literal de Hazael
  rationale: A linguagem profética pode empregar “casa” para uma linhagem governante, mas o substantivo também admite referência arquitetônica. A tradução preserva essa amplitude.
- issue: Natureza do fogo
  choice: Conservar literalmente a imagem profética de fogo
  alternative: Parafrasear como destruição militar ou juízo divino
  rationale: O texto apresenta fogo como instrumento de destruição. Preservar a figura evita impor no texto principal uma identificação interpretativa específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Por isso” explicita a relação consequencial com o versículo anterior; “casa” mantém a ambiguidade institucional e arquitetônica do hebraico. O marcador da nota foi colocado junto a “cidadelas”, termo ao qual a alternativa lexical se refere.
