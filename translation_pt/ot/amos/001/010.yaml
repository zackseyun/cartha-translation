  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/ח֣וֹמַת צֹ֑ר וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/010.yaml
  text: So I will send fire upon the wall of Tyre[a], and it will consume her citadels.
translation:
  language: pt
  text: Mandarei fogo contra a muralha de Tiro, e ele consumirá seus palácios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas fortalezas”. O termo hebraico pode designar palácios ou estruturas fortificadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Por isso, enviarei
  rationale: A conjunção prefixada dá continuidade à sentença de julgamento decorrente da acusação anterior. “Por isso” explicita naturalmente essa relação no discurso profético, enquanto o futuro preserva o anúncio divino em primeira pessoa.
- source_word: אֵשׁ
  choice: fogo
  rationale: Equivalente direto e natural, que mantém a imagem profética de destruição sem definir se o fogo é literal, militar ou metafórico.
- source_word: בְּחוֹמַת
  choice: contra a muralha
  rationale: A preposição ב, nesta fórmula de julgamento, admite o sentido de ação dirigida contra um alvo. “Muralha” comunica com precisão a fortificação urbana.
- source_word: צֹר
  choice: Tiro
  rationale: Forma portuguesa consagrada do nome da cidade fenícia.
- source_word: וְאָכְלָה
  choice: e ele consumirá
  rationale: O verbo significa literalmente “comer”, mas, tendo “fogo” como sujeito, “consumir” é a expressão idiomática natural em português. O pronome retoma claramente “fogo”.
- source_word: אַרְמְנֹתֶיהָ
  choice: suas cidadelas
  rationale: O termo pode designar palácios ou estruturas fortificadas. No contexto da muralha de uma cidade sob julgamento, “cidadelas” preserva melhor a possível dimensão palaciana e militar sem restringir o sentido a residências reais.
theological_decisions:
- issue: Natureza do fogo no anúncio profético de julgamento
  choice: Manter o fogo como imagem do julgamento divino sem especificar seu mecanismo
  alternative: Entendê-lo explicitamente como incêndio literal ou como metáfora de invasão militar
  rationale: O hebraico afirma que Deus enviará fogo e que este consumirá as cidadelas, mas não explica aqui como isso se cumprirá. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A formulação conserva o paralelismo conciso e o tom solene do anúncio profético.
