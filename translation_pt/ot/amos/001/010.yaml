  - severity: medium
    issue: «Cidadelas» é excessivamente específico para אַרְמְנוֹתֶיהָ.
    rationale: O substantivo se refere sobretudo a palácios, podendo também ter associação com edifícios fortificados. «Cidadelas» desloca o sentido principal e limita a alternativa lexical.
  revised_text: Mandarei fogo contra a muralha de Tiro, e ele consumirá seus palácios.[a]
