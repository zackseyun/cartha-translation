  naturalness: A redação é clara e solene. «Mandarei fogo» é uma formulação profética natural e amplamente compreensível, e «palácios» é mais idiomático e lexicalmente direto neste contexto do que «cidadelas».
  terminology: «Tiro», «fogo», «muralha» e «consumirá» são adequados. «Palácios» deve ser a tradução principal de אַרְמְנוֹתֶיהָ; a possibilidade de sentido fortificado pode permanecer em nota.
