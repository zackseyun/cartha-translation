base_translation:
  language: en
  yaml_path: translation/ot/amos/001/014.yaml
  text: I will kindle a fire in the wall of Rabbah[a], and it will consume her citadels, with a battle cry on the day of war[c][b], with a storm on the day of tempest.
translation:
  language: pt
  text: Porei fogo na muralha de Rabá, e ele consumirá suas fortalezas[a], com grito de guerra[b] no dia da batalha, com tempestade no dia do vendaval[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus palácios” ou “suas cidadelas”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode indicar um forte clamor de alarme, às vezes associado ao toque de trombeta.
    reason: lexical_alternative
  - marker: c
    text: A imagem da tempestade pode evocar o juízo do SENHOR como guerreiro divino, embora também se encaixe na descrição imediata da destruição em tempos de guerra.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִצַּתִּי אֵשׁ
  choice: Porei fogo
  rationale: A construção causativa anuncia uma ação futura de juízo. “Porei fogo” é natural em português e preserva tanto a ação de acender quanto o fogo como instrumento da destruição.
- source_word: בְּחוֹמַת רַבָּה
  choice: na muralha de Rabá
  rationale: A preposição ב pode indicar localização ou contato; “na muralha” expressa de modo idiomático o lugar onde o fogo será ateado. רַבָּה é transliterado como “Rabá”, nome da capital amonita.
- source_word: וְאָכְלָה
  choice: e ele consumirá
  rationale: O sujeito implícito é “fogo”. O pronome masculino segue o gênero de “fogo” em português, e “consumirá” mantém a imagem destrutiva do verbo hebraico.
- source_word: אַרְמְנוֹתֶיהָ
  choice: suas fortalezas
  rationale: אַרְמוֹן pode designar palácio, cidadela ou estrutura fortificada. No contexto de ataque contra uma cidade, “fortalezas” comunica bem a dimensão defensiva sem excluir construções monumentais.
- source_word: בִּתְרוּעָה
  choice: com grito de guerra
  rationale: תְּרוּעָה pode indicar aclamação, clamor de alarme ou sinal estridente, por vezes ligado à trombeta. A proximidade de “dia da batalha” favorece “grito de guerra”, sem eliminar totalmente essas ressonâncias.
- source_word: בְּיוֹם מִלְחָמָה
  choice: no dia da batalha
  rationale: A expressão temporal situa a destruição no contexto militar. “Batalha” soa mais natural junto de “grito de guerra” e corresponde adequadamente a מִלְחָמָה neste contexto.
- source_word: בְּסַעַר בְּיוֹם סוּפָה
  choice: com tempestade no dia do vendaval
  rationale: סַעַר e סוּפָה pertencem ao campo semântico de tempestade, tormenta e vento devastador. Empregar dois termos próximos preserva o paralelismo poético sem reduzir ambos a uma repetição idêntica.
theological_decisions:
- issue: Natureza das imagens de juízo
  choice: Manter juntas a devastação militar e as imagens de tempestade, sem definir a tempestade exclusivamente como fenômeno literal ou teofania.
  alternative: Interpretar explicitamente a tempestade como manifestação do SENHOR guerreiro.
  rationale: O hebraico combina linguagem clara de guerra com imagens de tempestade. A tradução conserva a tensão e permite que a tempestade evoque o juízo soberano de Deus sem impor essa leitura como único sentido.
- issue: Referência do sufixo feminino em אַרְמְנוֹתֶיהָ
  choice: Traduzir de modo natural por “suas”, referindo-se a Rabá.
  alternative: Explicitar “as fortalezas dela”, preservando formalmente a personificação feminina da cidade.
  rationale: Em hebraico, a cidade é tratada no feminino. Como o possessivo português “suas” não marca gênero, ele mantém a referência à cidade com maior naturalidade, embora torne a personificação menos explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Rabá” segue a forma portuguesa tradicional do topônimo. O paralelismo e a força poética do anúncio profético foram preservados sem arcaísmos.
