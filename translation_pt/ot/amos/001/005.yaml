  text: וְ/שָֽׁבַרְתִּי֙ בְּרִ֣יחַ דַּמֶּ֔שֶׂק וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מִ/בִּקְעַת אָ֔וֶן וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מִ/בֵּ֣ית עֶ֑דֶן וְ/גָל֧וּ עַם אֲרָ֛ם קִ֖ירָ/ה אָמַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/005.yaml
  text: I will break the gate-bar of Damascus[a], and I will cut off the inhabitant from the Valley of Aven and the one who holds the scepter from Beth-eden[b]; and the people of Aram will go into exile to Kir,” says Yahweh.
translation:
  language: pt
  text: “Quebrarei a barra do portão de Damasco e eliminarei o habitante do vale de Áven[a] e aquele que segura o cetro de Bete-Éden[b]. O povo de Arã irá para o exílio, para Quir”, diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico “Áven” pode evocar uma palavra que significa “maldade” ou “aflição”. Provavelmente é usado aqui como nome de lugar, talvez com um jogo profético de palavras.
    reason: lexical_alternative
  - marker: b
    text: “Bete-Éden” também pode ser traduzido literalmente como “casa de Éden”; alguns estudiosos identificam historicamente o lugar com Bit-Adini.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Quebrarei
  rationale: O perfeito qal com waw, neste contexto profético de juízo, tem sentido futuro. “Quebrarei” preserva de modo claro a imagem da destruição da defesa da cidade.
- source_word: בְּרִיחַ דַּמֶּשֶׂק
  choice: a tranca de Damasco
  rationale: בְּרִיחַ designa a barra ou tranca que fechava portões e portas. A formulação mantém a metáfora militar sem acrescentar ao texto a palavra “portão”.
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: O verbo expressa remoção decisiva, muitas vezes por destruição. “Eliminarei” comunica esse sentido em português atual sem exigir uma leitura estritamente literal da metáfora “cortar”.
- source_word: יוֹשֵׁב
  choice: o habitante
  rationale: O particípio singular pode representar coletivamente os moradores ou a população. A tradução conserva o singular representativo e não o redefine como “governante”.
- source_word: מִבִּקְעַת אָוֶן
  choice: do vale de Áven
  rationale: בִּקְעָה significa vale ou planície, enquanto אָוֶן provavelmente funciona aqui como topônimo, talvez com jogo profético de palavras. O nome é preservado e sua possível conotação é indicada em nota.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: e aquele que segura o cetro
  rationale: 'A expressão mantém os elementos concretos do hebraico: תמך, “segurar/sustentar”, e שֵׁבֶט, aqui o cetro ou bastão de autoridade.'
- source_word: מִבֵּית עֶדֶן
  choice: de Bete-Éden
  rationale: A expressão é tratada como nome de lugar no texto principal. A tradução literal e a possível identificação histórica são mantidas em nota, sem decidir entre elas.
- source_word: וְגָלוּ
  choice: irá para o exílio
  rationale: O verbo indica partida ou deportação para o exílio. A expressão portuguesa preserva o movimento sem explicitar um agente que não aparece na oração.
- source_word: עַם אֲרָם
  choice: o povo de Arã
  rationale: Mantém o antigo nome etnogeográfico hebraico, em sua forma portuguesa, em vez de substituí-lo pelo nome geopolítico posterior “Síria”.
- source_word: קִירָה
  choice: em Quir
  rationale: O sufixo direcional indica movimento rumo a Quir. Em português, a construção completa “irá para o exílio em Quir” expressa Quir como destino e lugar do exílio.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente é natural na fórmula profética de mensageiro, e o nome divino é representado diretamente como Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem o substituir por um título nem adotar a forma híbrida posterior “Jeová”.
- issue: Identidade do “habitante” e daquele que segura o cetro
  choice: Manter as duas descrições concretas do hebraico
  alternative: Interpretá-las explicitamente como população e governante
  rationale: Embora a segunda expressão provavelmente designe o governante e a primeira possa ser coletiva, o texto não exige que essas implicações sejam incorporadas à tradução. A formulação conserva a tensão e a imagem profética.
translation_notes:
  register: 'Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. Os topônimos seguem formas portuguesas usuais: Damasco, Áven, Bete-Éden, Arã e Quir. A estrutura paralela do oráculo e suas imagens concretas foram preservadas.'
