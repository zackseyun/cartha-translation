  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י אֱד֔וֹם וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל רָדְפ֨/וֹ בַ/חֶ֤רֶב אָחִי/ו֙ וְ/שִׁחֵ֣ת רַחֲמָ֔י/ו וַ/יִּטְרֹ֤ף לָ/עַד֙ אַפּ֔/וֹ וְ/עֶבְרָת֖/וֹ שְׁמָ֥רָ/ה נֶֽצַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/011.yaml
  text: 'Thus says Yahweh: “For three transgressions of Edom[a], and for four, I will not revoke its punishment, because he pursued his brother with the sword and destroyed his compassion; his anger tore continually[c][b], and he kept his wrath forever.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões de Edom, e ainda por quatro, não revogarei seu castigo[a], porque ele perseguiu seu irmão à espada[b] e destruiu sua compaixão; sua ira dilacerou sem cessar[c], e ele guardou seu furor para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o farei voltar”, isto é, não anularei o juízo anunciado.'
    reason: lexical_alternative
  - marker: b
    text: “Seu irmão” provavelmente evoca o parentesco entre Edom e Israel por meio de Esaú e Jacó.
    reason: cross_reference
  - marker: c
    text: 'Ou: “ele continuou dilacerando em sua ira”. O hebraico emprega uma vívida imagem de um predador que dilacera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: פִּשְׁעֵי
  choice: transgressões
  rationale: Preserva o sentido moral e pactual de violações graves na fórmula acusatória de Amós.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não revogarei seu castigo
  rationale: 'Expressa em português claro o objeto implícito: Yahweh não retirará o juízo anunciado.'
- source_word: רָדְפוֹ בַחֶרֶב אָחִיו
  choice: ele perseguiu seu irmão à espada
  rationale: Mantém a personificação singular de Edom, a linguagem familiar e o meio violento da perseguição.
- source_word: שִׁחֵת רַחֲמָיו
  choice: destruiu sua compaixão
  rationale: Conserva a imagem forte da supressão violenta da compaixão natural.
- source_word: וַיִּטְרֹף לָעַד אַפּוֹ
  choice: sua ira continuou dilacerando
  rationale: Preserva a vívida imagem predatória do verbo e a duração persistente indicada por לָעַד, sem normalizá-la como simples ira.
- source_word: וְעֶבְרָתוֹ שְׁמָרָה נֶצַח
  choice: ele guardou seu furor para sempre
  rationale: Reproduz a ideia de conservar persistentemente o furor e mantém o paralelismo da conclusão.
theological_decisions:
- issue: Mudança entre Edom como nação e as formas masculinas singulares
  choice: 'Manter a personificação masculina singular: “ele”, “seu”.'
  alternative: 'Empregar formas coletivas ou plurais: “eles”, “deles”.'
  rationale: O hebraico personifica Edom no singular; preservar isso mantém tanto a retórica profética quanto a acusação de violência entre irmãos.
- issue: Identidade do “irmão” de Edom
  choice: Traduzir literalmente “seu irmão” e explicar a provável alusão em nota.
  alternative: Explicitar no texto “Israel, seu povo irmão”.
  rationale: A formulação literal preserva a alusão a Esaú e Jacó sem transformar uma inferência contextual em identificação explícita no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fórmula profética e a personificação de Edom foram preservadas; a metáfora predatória foi mantida apesar de sua aspereza deliberada.
