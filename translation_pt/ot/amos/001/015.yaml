  text: וְ/הָלַ֥ךְ מַלְכָּ֖/ם בַּ/גּוֹלָ֑ה ה֧וּא וְ/שָׂרָ֛י/ו יַחְדָּ֖ו אָמַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/015.yaml
  text: And their king shall go into exile[a], he and his officials together, says Yahweh.
translation:
  language: pt
  text: E o rei deles irá para o exílio[a], ele e seus oficiais, juntos, diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Milcom”, o deus dos amonitas; alguns entendem que o deus dos amonitas irá para o exílio junto com seus sacerdotes ou oficiais.
    reason: Leitura alternativa de מַלְכָּם, cujas consoantes também podem representar o nome Milcom.
lexical_decisions:
- source_word: וְהָלַךְ
  choice: irá
  rationale: O perfeito qal com conjunção, no discurso profético, anuncia aqui uma ação futura; “irá” é natural em português e preserva o tom de juízo.
- source_word: מַלְכָּם
  choice: o rei deles
  rationale: A vocalização massorética e o sufixo pronominal favorecem “o rei deles”, em paralelo com “seus oficiais”; a possível leitura como nome da divindade Milcom é preservada em nota.
- source_word: בַּגּוֹלָה
  choice: para o exílio
  rationale: A expressão indica deportação como resultado da conquista; “para o exílio” comunica naturalmente o movimento.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente retoma o rei com ênfase e é mantido na construção apositiva.
- source_word: וְשָׂרָיו
  choice: e seus oficiais
  rationale: שָׂרִים pode designar príncipes, chefes ou altos funcionários; “oficiais” é claro, atual e adequado ao contexto da corte.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Expressa que o rei e seus oficiais serão deportados conjuntamente.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente reproduz de modo natural a fórmula profética, e o nome divino é transliterado como “Yahweh” para representar o hebraico יְהוָה.
theological_decisions:
- issue: Se מַלְכָּם se refere a um rei humano ou à divindade amonita Milcom/Moloque
  choice: o rei deles
  alternative: Milcom, a divindade dos amonitas
  rationale: A vocalização do texto massorético e a sequência “ele e seus oficiais” favorecem a referência ao governante humano. Contudo, as consoantes permitem a leitura “Milcom”, relevante no contexto de Amom; por isso, a ambiguidade textual é explicitada em nota, sem ser eliminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “ele e seus oficiais juntos” conserva a ênfase e a estrutura do hebraico sem recorrer a linguagem arcaica.
