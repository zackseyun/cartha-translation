review_pass:
  verdict: revise
  source_fidelity: A fórmula profética, a progressão numérica, a designação de Amom e a finalidade de expansão territorial refletem bem o hebraico. Contudo, em português, «rasgaram as mulheres grávidas» pode não comunicar com suficiente clareza que o verbo descreve a abertura violenta do ventre; a explicitação idiomática de «o ventre» torna o sentido atroz do hebraico inequívoco sem acrescentar um detalhe historicamente independente.
  naturalness: 'O texto é geralmente claro e de registro adequado. A nota b, porém, traz uma alternativa pouco natural e semanticamente inadequada: «não o farei voltar atrás» normalmente significa fazer alguém voltar, e não retirar/revogar algo.'
  terminology: «Yahweh», «transgressões», «filhos de Amom» e «Gileade» são escolhas defensáveis e consistentes. «Território» comunica adequadamente o sentido contextual de גבול.
  issues:
  - severity: medium
    issue: A redação «rasgaram as mulheres grávidas» é ambígua em português.
    rationale: Embora reproduza a construção concisa do hebraico, pode ser entendida apenas como agressão ou dilaceração geral. No contexto e no uso de בקע com grávidas, trata-se de abrir-lhes violentamente o ventre.
  - severity: medium
    issue: A alternativa da nota b, «não o farei voltar atrás», não expressa corretamente a alternativa idiomática.
    rationale: A construção sugere que Yahweh faria um referente pessoal voltar atrás. O hebraico emprega o verbo «fazer voltar/retirar» para o juízo ou decisão implícitos.
  revised_text: 'Assim diz Yahweh: “Por três transgressões dos filhos de Amom[a], e por quatro, não o revogarei[b], porque rasgaram o ventre das mulheres grávidas de Gileade para ampliar o seu território.”'
