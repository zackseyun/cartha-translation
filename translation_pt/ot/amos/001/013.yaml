source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י בְנֵֽי עַמּ֔וֹן וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל בִּקְעָ/ם֙ הָר֣וֹת הַ/גִּלְעָ֔ד לְמַ֖עַן הַרְחִ֥יב אֶת גְּבוּלָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/013.yaml
  text: 'Thus says Yahweh: “For three transgressions of the sons of Ammon[a], and for four, I will not revoke it[b], because they ripped open the pregnant women of Gilead in order to enlarge their border.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões dos filhos de Amom[a], e por quatro, não o revogarei[b], porque rasgaram o ventre das mulheres grávidas de Gileade para ampliar o seu território.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os amonitas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não o retirarei”; isto é, não revogarei o juízo anunciado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa diretamente o nome divino.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  choice: Por três transgressões... e por quatro
  rationale: Mantém a progressão numérica característica de Amós e a força moral e rebelde de פֶּשַׁע.
- source_word: בְנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Reproduz a construção hebraica; a forma gentílica mais corrente é indicada em nota.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não o revogarei
  rationale: Conserva o objeto pronominal não explicitado no hebraico, sem inserir diretamente 'castigo' ou 'sentença'; a nota esclarece o referente provável.
- source_word: בִּקְעָם הָרוֹת הַגִּלְעָד
  choice: rasgaram as mulheres grávidas de Gileade
  rationale: Expressa de forma direta a violência do verbo בּקע e entende הָרוֹת como adjetivo substantivado, sem acrescentar uma parte específica do corpo ausente do texto.
- source_word: לְמַעַן הַרְחִיב אֶת גְּבוּלָם
  choice: para ampliar o seu território
  rationale: Comunica naturalmente a finalidade e o sentido territorial de גְּבוּל neste contexto, embora o termo denote literalmente fronteira ou limite.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome pessoal divino de modo transparente, sem substituí-lo por um título.
- issue: Referente de לֹא אֲשִׁיבֶנּוּ
  choice: Manter o pronome em 'não o revogarei'
  alternative: não revogarei o castigo; não voltarei atrás
  rationale: O hebraico não nomeia expressamente o objeto; a tradução preserva essa concisão e a nota registra a interpretação contextual como juízo anunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva o paralelismo numérico de Amós, a designação hebraica formal “filhos de Amom” e a ambiguidade do objeto pronominal em “não o revogarei”.
