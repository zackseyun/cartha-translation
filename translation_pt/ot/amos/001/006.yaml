  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י עַזָּ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל הַגְלוֹתָ֛/ם גָּל֥וּת שְׁלֵמָ֖ה לְ/הַסְגִּ֥יר לֶ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Gaza[a], and for four, I will not revoke its punishment[b], because they carried away an entire population into exile to hand them over to Edom.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões de Gaza, e ainda por quatro, não revogarei seu castigo[a], porque levaram para o exílio uma população inteira, a fim de entregá-la a Edom[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não o farei voltar”. Nesta fórmula de julgamento, o sentido é que Yahweh não revogará o castigo anunciado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porque exilaram um grupo inteiro de cativos para entregá-lo a Edom”. A expressão hebraica ressalta que a deportação foi completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando sua identificação pessoal e seguindo o padrão do projeto.
- source_word: פִּשְׁעֵי
  choice: transgressões
  rationale: Preserva a força moral e pactual do termo sem restringi-lo a crimes políticos ou jurídicos.
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  choice: Por três ... e ainda por quatro
  rationale: Mantém a progressão numérica característica de Amós; “ainda” expressa naturalmente em português a intensificação sem transformar os números em mera contagem literal.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não revogarei seu castigo
  rationale: Explicita em português o objeto implícito do idioma hebraico dentro da fórmula de julgamento, sem alterar seu sentido contextual.
- source_word: הַגְלוֹתָם גָּלוּת שְׁלֵמָה
  choice: levaram para o exílio uma população inteira
  rationale: Comunica de modo claro a deportação completa de um grupo ou povo, evitando a expressão pouco natural “exilaram um exílio inteiro”.
- source_word: לְהַסְגִּיר
  choice: a fim de entregá-la
  rationale: Expressa a transferência deliberada dos deportados ao domínio de outra nação; o pronome retoma coletivamente “população”.
- source_word: לֶאֱדוֹם
  choice: a Edom
  rationale: Emprega a forma portuguesa tradicional do nome da nação.
theological_decisions:
- issue: Objeto implícito de לֹא אֲשִׁיבֶנּוּ
  choice: Seu castigo não será revogado.
  alternative: “Não o farei voltar” ou “não voltarei atrás”.
  rationale: O hebraico diz literalmente que Yahweh não o fará voltar, sem nomear expressamente o referente. No contexto da fórmula de Amós 1–2, trata-se do julgamento anunciado. A explicitação favorece a compreensão, enquanto a nota preserva a forma e a ambiguidade do original.
- issue: Extensão de גָּלוּת שְׁלֵמָה
  choice: Uma população inteira foi levada ao exílio.
  alternative: “Um grupo inteiro de cativos” ou, mais literalmente, “um exílio completo”.
  rationale: A expressão enfatiza a totalidade da deportação, mas não define de maneira inequívoca se abrange toda uma população nacional ou um conjunto completo de cativos; a nota registra essa amplitude lexical.
translation_notes:
  register: Português moderno, digno e de leitura corrente, com ampla legibilidade brasileira. Conserva a fórmula profética e sua progressão numérica. Os marcadores [a] e [b] aparecem no texto e correspondem às respectivas notas.
