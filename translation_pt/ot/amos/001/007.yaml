  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/חוֹמַ֣ת עַזָּ֑ה וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/007.yaml
  text: So I will send fire upon the wall of Gaza[a], and it will consume her citadels.
translation:
  language: pt
  text: Por isso, enviarei fogo contra a muralha de Gaza, e ele consumirá suas cidadelas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus palácios». O termo hebraico pode designar edifícios palacianos, muitas vezes com caráter fortificado ou associado às elites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Por isso, enviarei
  rationale: O piel na primeira pessoa do singular expressa a ação direta de enviar; a conjunção é vertida como «Por isso» para ligar naturalmente esta sentença à sequência de juízo no contexto.
- source_word: אֵשׁ
  choice: fogo
  rationale: Sentido literal e usual, adequado à imagem profética de juízo.
- source_word: בְּחוֹמַת
  choice: contra a muralha de
  rationale: Neste contexto hostil, בְּ indica o alvo sobre o qual o fogo é enviado; «contra» comunica isso com naturalidade em português.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forma consagrada do nome geográfico em português.
- source_word: וְאָכְלָה
  choice: e ele consumirá
  rationale: O verbo descreve o efeito destrutivo do fogo; o perfeito hebraico recebe valor futuro dentro do anúncio profético. O pronome retoma «fogo» com o gênero exigido em português.
- source_word: אַרְמְנֹתֶיהָ
  choice: suas cidadelas
  rationale: O termo pode designar edifícios palacianos fortificados; «cidadelas» preserva especialmente a nuance defensiva apropriada ao contexto militar, sem excluir o caráter monumental ou régio.
theological_decisions:
- issue: Sufixo pronominal feminino referente à cidade
  choice: suas cidadelas
  alternative: as cidadelas dela
  rationale: O hebraico personifica Gaza por meio de um sufixo feminino singular. Como «Gaza» não exige pronome expresso em português, «suas» preserva a referência à cidade de modo natural, sem impor uma personificação artificial nem apagar a relação possessiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a concisão e a força do oráculo profético.
