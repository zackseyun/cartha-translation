id: AMO.1.9
reference: Amos 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões de Tiro, e por quatro, não revogarei seu castigo[a], porque entregaram a Edom uma população inteira de exilados[b] e não se lembraram de uma aliança entre irmãos[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “não o farei voltar”; o objeto não é declarado no hebraico. Pelo contexto, o sentido é que o castigo anunciado não será revogado.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma comunidade inteira de exilados” ou “todo um grupo de cativos”. A expressão hebraica se refere à entrega de um grupo completo de cativos ou exilados.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “uma aliança de irmãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética solene e verte diretamente o nome divino.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי צֹר וְעַל אַרְבָּעָה
  choice: Por três transgressões de Tiro, e por quatro
  rationale: Preserva a progressão numérica característica de Amós e o peso moral de פֶּשַׁע.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não revogarei seu castigo
  rationale: Expressa em português natural o sentido judicial provável da construção, enquanto a nota registra que o objeto não é explicitado no hebraico.
- source_word: הַסְגִּירָם
  choice: entregaram
  rationale: O hifil de סגר indica entregar pessoas ao poder de outro; a forma é grave, clara e natural.
- source_word: גָּלוּת שְׁלֵמָה
  choice: uma população inteira de exilados
  rationale: Comunica o caráter coletivo e completo do grupo entregue, sem reduzi-lo a indivíduos isolados.
- source_word: לֶאֱדוֹם
  choice: a Edom
  rationale: Reproduz o sentido direcional ou dativo após o verbo de entrega.
- source_word: וְלֹא זָכְרוּ
  choice: e não se lembraram
  rationale: Conserva o sentido lexical de זכר e permite que o contexto comunique a implicação de desconsiderar a aliança.
- source_word: בְּרִית אַחִים
  choice: uma aliança entre irmãos
  rationale: Mantém tanto o conceito de aliança quanto a linguagem concreta de fraternidade do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Objeto implícito em לֹא אֲשִׁיבֶנּוּ
  choice: explicitar o sentido judicial como “não revogarei seu castigo”
  alternative: “não o farei voltar” ou “não o revogarei”
  rationale: No refrão de Amós, a expressão aponta para a sentença ou o castigo anunciado, mas o hebraico não nomeia explicitamente esse referente; a nota conserva essa ambiguidade formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo profético, evita vocabulário denominacional e usa notas para preservar alternativas e ambiguidades genuínas do hebraico.
