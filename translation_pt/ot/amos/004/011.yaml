source:
  edition: WLC
  text: הָפַ֣כְתִּי בָ/כֶ֗ם כְּ/מַהְפֵּכַ֤ת אֱלֹהִים֙ אֶת סְדֹ֣ם וְ/אֶת עֲמֹרָ֔ה וַ/תִּהְי֕וּ כְּ/א֖וּד מֻצָּ֣ל מִ/שְׂרֵפָ֑ה וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/011.yaml
  text: I overthrew some among you as God overthrew Sodom and Gomorrah[a], and you became like a brand snatched from the burning; yet you did not return to me[c][b], declares Yahweh.
translation:
  language: pt
  text: Destruí alguns de vocês[a], como Deus destruiu Sodoma e Gomorra[b]. Vocês ficaram como um tição arrancado do incêndio[c]. Mesmo assim, não voltaram para mim — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Causei destruição entre vocês”. A preposição hebraica permite que o sentido partitivo, “alguns de vocês”, fique implícito.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “como a destruição de Deus [sobre] Sodoma e Gomorra”, isto é, como a destruição que Deus trouxe sobre essas cidades.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “como um pedaço de lenha resgatado das chamas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַכְתִּי
  choice: Destruí
  rationale: No contexto de juízo e na alusão a Sodoma e Gomorra, הפך indica destruição catastrófica. “Destruí” é natural em português e comunica claramente o resultado do ato de subverter ou arrasar.
- source_word: בָכֶם
  choice: alguns de vocês
  rationale: 'A preposição בְּ com o sufixo plural admite aqui sentido partitivo: o juízo atingiu pessoas no meio do povo. A explicitação evita a expressão pouco natural “destruí em vocês”, sem ocultar a alternativa em nota.'
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: como Deus destruiu
  rationale: 'A construção nominal hebraica, literalmente “como a destruição de Deus”, é expressa verbalmente para produzir português claro. O genitivo é entendido como subjetivo: a destruição realizada por Deus.'
- source_word: סְדֹם וְאֶת עֲמֹרָה
  choice: Sodoma e Gomorra
  rationale: Formas tradicionais e amplamente reconhecidas dos topônimos em português.
- source_word: וַתִּהְיוּ
  choice: Vocês ficaram
  rationale: O verbo היה apresenta o estado resultante após o juízo. “Ficaram” é idiomático em português e preserva essa transição.
- source_word: כְּאוּד
  choice: como um tição
  rationale: אוּד designa um pedaço de madeira que queima ou foi retirado do fogo. “Tição” conserva a imagem concreta e é uma palavra bíblica ainda inteligível em português.
- source_word: מֻצָּל
  choice: arrancado
  rationale: O particípio passivo de נצל descreve algo retirado do perigo. “Arrancado” comunica a retirada rápida e dramática sugerida pela imagem.
- source_word: מִשְּׂרֵפָה
  choice: do incêndio
  rationale: שְׂרֵפָה refere-se à queima ou conflagração. “Incêndio” é natural e mantém a intensidade da cena.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Mesmo assim, não voltaram para mim
  rationale: שׁוב com עַד descreve o retorno do povo a Deus e abrange arrependimento e restauração da relação. “Mesmo assim” explicita o contraste contextual expresso pela conjunção.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם introduz a fórmula profética solene, e o nome divino יהוה é transliterado como “Yahweh” para preservar o nome da aliança.
theological_decisions:
- issue: Tradução de יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome divino, em vez de substituí-lo por um título.
- issue: Sentido de שׁוב no contexto profético da aliança
  choice: voltaram para mim
  alternative: se arrependeram diante de mim
  rationale: “Voltar” conserva a metáfora relacional e a amplitude do chamado profético, que inclui arrependimento sem reduzi-lo apenas a remorso interior.
- issue: Agente em כְּמַהְפֵּכַת אֱלֹהִים
  choice: Deus como agente da destruição
  alternative: “uma destruição divina”, em sentido superlativo
  rationale: 'A alusão à destruição de Sodoma e Gomorra favorece a leitura do genitivo como subjetivo: Deus realizou a destruição. A forma hebraica mais literal é registrada em nota.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais para leitores brasileiros. “Tição” foi mantido por sua precisão imagética, acompanhado de alternativa mais transparente em nota. A repetição profética “não voltaram para mim” conserva a linguagem relacional do original.
