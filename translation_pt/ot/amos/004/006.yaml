  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם אֲנִי֩ נָתַ֨תִּי לָ/כֶ֜ם נִקְי֤וֹן שִׁנַּ֨יִם֙ בְּ/כָל עָ֣רֵי/כֶ֔ם וְ/חֹ֣סֶר לֶ֔חֶם בְּ/כֹ֖ל מְקוֹמֹֽתֵי/כֶ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/006.yaml
  text: And I also gave you cleanness of teeth in all your cities[a], and lack of bread in all your places; yet you did not return to me, declares Yahweh.
translation:
  language: pt
  text: “Eu também deixei vocês com os dentes limpos[a] em todas as suas cidades e com falta de pão em todos os seus lugares. Contudo, vocês não voltaram para mim”, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “limpeza de dentes”, expressão que indica não ter nada para comer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Eu também
  rationale: Preserva a força aditiva e enfática da expressão hebraica, com ordem natural em português.
- source_word: נָתַתִּי לָכֶם
  choice: deixei vocês com
  rationale: Neste contexto de juízo, expressa naturalmente o resultado causado por Yahweh, evitando o português pouco idiomático de “dei a vocês limpeza de dentes”.
- source_word: נִקְיוֹן שִׁנַּיִם
  choice: os dentes limpos
  rationale: Mantém a imagem concreta do hebraico; a nota esclarece que se trata de uma expressão para não ter alimento.
- source_word: בְּכָל עָרֵיכֶם
  choice: em todas as suas cidades
  rationale: Tradução locativa direta de עָרִים, preservando a abrangência de כָּל.
- source_word: וְחֹסֶר לֶחֶם
  choice: e sem pão
  rationale: Reproduz de modo claro e natural a escassez concreta indicada por חֹסֶר לֶחֶם, sem substituí-la pela interpretação mais ampla “fome”.
- source_word: בְּכֹל מְקוֹמֹתֵיכֶם
  choice: em todos os lugares onde moram
  rationale: Torna natural em português o sentido abrangente de מְקוֹמוֹת sem reduzi-lo apenas a cidades ou assentamentos.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Mesmo assim, vocês não voltaram para mim
  rationale: “Mesmo assim” explicita a relação adversativa contextual, e “voltaram para mim” conserva a linguagem relacional e pactual de שׁוּב עַד sem reduzi-la apenas a arrependimento interior.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Emprega uma fórmula profética digna e corrente e translitera diretamente o nome divino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pactual diretamente; “Yahweh” o representa sem substituí-lo por um título.
- issue: Interpretação de נִקְיוֹן שִׁנַּיִם
  choice: Manter no texto a imagem “dentes limpos”
  alternative: nada para comer; fome
  rationale: A imagem profética é inteligível à luz da frase paralela sobre a falta de pão. A nota preserva a clareza sem eliminar a metáfora.
- issue: Sentido de שׁוּב עַד dirigido a Deus
  choice: voltaram para mim
  alternative: se arrependeram; tornaram para mim
  rationale: “Voltaram para mim” preserva tanto a mudança de rumo quanto a dimensão relacional, sem impor uma formulação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O pronome “vocês” representa o plural hebraico; a metáfora original é mantida e esclarecida em nota.
