base_translation:
  language: en
  yaml_path: translation/ot/amos/004/003.yaml
  text: And through the breaches you will go out[a], each woman straight ahead of her[b], and you will be cast out toward Harmon,” declares Yahweh.
translation:
  language: pt
  text: Vocês sairão pelas brechas, cada mulher seguindo em frente[a], e serão lançadas para Harmon[b]”, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada mulher diante de si” ou “à sua frente”; provavelmente, cada uma sairá diretamente pela brecha que estiver diante dela.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico הַהַרְמוֹנָה é obscuro. Também se propõe “para a fortaleza” ou “para Hermon”; não se sabe ao certo qual é o destino referido.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפְרָצִים
  choice: pelas brechas
  rationale: פְרָצִים designa aberturas ou rupturas, provavelmente na muralha; a preposição portuguesa expressa naturalmente o movimento através delas.
- source_word: תֵּצֶאנָה
  choice: vocês sairão
  rationale: O qal imperfeito na segunda pessoa feminina plural de יצא tem sentido ativo, “sair”; o contexto sugere expulsão, mas não se transforma o verbo em passivo.
- source_word: אִשָּׁה נֶגְדָּהּ
  choice: cada mulher seguindo em frente
  rationale: אִשָּׁה tem valor distributivo, enquanto נֶגְדָּהּ indica o espaço diante de cada mulher; a formulação comunica que cada uma segue diretamente pela abertura à sua frente.
- source_word: וְהִשְׁלַכְתֶּנָה
  choice: e serão lançadas
  rationale: A forma é difícil; o contexto favorece um sentido passivo ou impessoal de expulsão. A tradução mantém essa força sem identificar o agente.
- source_word: הַהַרְמוֹנָה
  choice: para Harmom
  rationale: O termo é obscuro e pode indicar um destino ou topônimo. A transliteração evita decidir indevidamente entre propostas como “fortaleza” e “Hermom”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida de modo natural, e o tetragrama é representado pelo nome pessoal Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Agência na expulsão
  choice: serão lançadas
  alternative: vocês lançarão; alguém as lançará
  rationale: A forma verbal é textual e gramaticalmente difícil. A construção passiva preserva a expulsão implícita sem atribuir explicitamente a ação a Deus ou a outro agente.
translation_notes:
  register: Português moderno, claro e digno, com concordância feminina plural para refletir as destinatárias do contexto. “Harmom” conserva a incerteza do termo hebraico, explicada em nota.
