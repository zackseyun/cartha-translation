id: AMO.4.1
reference: Amos 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֞וּ הַ/דָּבָ֣ר הַ/זֶּ֗ה פָּר֤וֹת הַ/בָּשָׁן֙ אֲשֶׁר֙ בְּ/הַ֣ר שֹֽׁמְר֔וֹן הָ/עֹשְׁק֣וֹת דַּלִּ֔ים הָ/רֹצְצ֖וֹת אֶבְיוֹנִ֑ים הָ/אֹמְרֹ֥ת לַ/אֲדֹֽנֵי/הֶ֖ם הָבִ֥יאָ/ה וְ/נִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/001.yaml
  text: Hear this word[a], you cows of Bashan, who are on the mountain of Samaria, who oppress the poor, who crush the needy, who say to their masters, “Bring[b], that we may drink.”
translation:
  language: pt
  text: 'Ouçam esta palavra, vacas de Basã[b], vocês que estão no monte de Samaria, que oprimem os pobres, esmagam os necessitados e dizem aos seus senhores[a]: “Traga, para que bebamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus maridos”. O termo hebraico pode designar senhores, donos ou maridos, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: Basã era uma região fértil a leste do Jordão, famosa por seu gado bem alimentado. A imagem é um insulto mordaz contra pessoas que viviam no luxo à custa dos pobres.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע; “Ouçam” mantém a convocação profética e soa natural em português atual.
- source_word: הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: Em contexto profético, “palavra” preserva a ressonância formal de um pronunciamento anunciado.
- source_word: פָּרוֹת הַבָּשָׁן
  choice: vacas de Basã
  rationale: פָּרוֹת designa bovinos fêmeas. A expressão preserva a metáfora incisiva ligada ao gado bem alimentado de Basã.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: no monte de Samaria
  rationale: Traduz de perto o singular הַר e expressa naturalmente a localização.
- source_word: הָעֹשְׁקוֹת דַּלִּים
  choice: que oprimem os pobres
  rationale: עשק denota opressão ou exploração, frequentemente econômica; “oprimem” conserva a amplitude do termo.
- source_word: הָרֹצְצוֹת אֶבְיוֹנִים
  choice: esmagam os necessitados
  rationale: “Esmagam” preserva a metáfora violenta de רצץ, enquanto “necessitados” distingue אֶבְיוֹנִים de דַּלִּים.
- source_word: הָאֹמְרֹת לַאֲדֹנֵיהֶם
  choice: dizem aos seus senhores
  rationale: אֲדֹנֵיהֶם pode significar senhores, donos ou maridos. “Senhores” mantém a amplitude lexical sem fixar a relação conjugal.
- source_word: הָבִיאָה
  choice: Tragam algo
  rationale: O imperativo de בוא é usado transitivamente, mas seu objeto fica implícito. “Algo” torna a frase idiomática em português sem identificar indevidamente o que deve ser trazido.
- source_word: וְנִשְׁתֶּה
  choice: para bebermos
  rationale: Expressa de modo natural a finalidade do pedido, preservando o sentido do imperfeito coortativo em contexto.
theological_decisions:
- issue: Referente do tratamento feminino “vacas de Basã”
  choice: Metáfora profética dirigida às mulheres abastadas e opressoras de Samaria.
  alternative: Metáfora mais ampla para a elite luxuosa de Samaria, sem referência exclusiva a mulheres.
  rationale: Os substantivos, particípios e formas verbais femininas plurais sustentam uma interpelação direta a mulheres. A tradução mantém a imagem ofensiva sem suavizá-la.
- issue: Sentido de לַאֲדֹנֵיהֶם
  choice: aos seus senhores
  alternative: aos seus maridos
  rationale: O hebraico admite ambos os sentidos, e o contexto não elimina totalmente a ambiguidade. O texto principal mantém o termo mais amplo, e a nota registra a leitura conjugal.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora profética foi mantida sem eufemismo. As duas notas foram posicionadas junto aos elementos que explicam: [a] após “senhores” e [b] ao fim da declaração, referente à imagem das vacas de Basã.'
