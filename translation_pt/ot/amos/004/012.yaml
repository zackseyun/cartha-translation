base_translation:
  language: en
  yaml_path: translation/ot/amos/004/012.yaml
  text: Therefore[a], thus I will do to you, Israel; because I will do this to you, prepare to meet your God, Israel.
translation:
  language: pt
  text: Portanto, assim farei com você, Israel; porque farei isso com você, prepare-se para encontrar-se com o seu Deus[a], Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prepare-se para se defrontar com o seu Deus”. No contexto, esse encontro é uma confrontação temível após o anúncio do juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão decorrente dos juízos anteriores e mantém com naturalidade a transição profética.
- source_word: כֹּה אֶעֱשֶׂה לְּךָ
  choice: assim farei com você
  rationale: Preserva a força deíctica de כֹּה e a formulação ampla de עשה sem explicitar além do hebraico qual será a ação, embora o contexto indique juízo.
- source_word: עֵקֶב כִּי
  choice: e, porque
  rationale: Apresenta a ação divina anunciada como fundamento da ordem seguinte; a conjunção acrescentada liga naturalmente as orações em português.
- source_word: זֹאת אֶעֱשֶׂה לָּךְ
  choice: farei isso com você
  rationale: Mantém o demonstrativo e entende ל no contexto como ação dirigida a Israel, evitando a leitura benefativa inadequada ao contexto de juízo.
- source_word: הִכּוֹן
  choice: prepare-se
  rationale: Expressa de modo direto e idiomático a ordem de ficar pronto.
- source_word: לִקְרַאת אֱלֹהֶיךָ
  choice: para encontrar-se com o seu Deus
  rationale: Comunica o movimento rumo a um encontro; a forma pronominal distingue a ideia de encontrar-se com alguém da de simplesmente encontrar algo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome próprio e as duas interpelações enfáticas do texto hebraico.
theological_decisions:
- issue: Tom de “prepare-se para encontrar-se com o seu Deus”
  choice: Convocação ameaçadora para comparecer diante de Deus em juízo
  alternative: Convite neutro ou esperançoso à adoração ou ao arrependimento
  rationale: Os juízos recordados no contexto imediato e a nova ação anunciada tornam o encontro ameaçador. A tradução, porém, não acrescenta a palavra “juízo”, preservando a formulação aberta do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Com você” evita a ambiguidade regional de “lhe” e conserva a ação dirigida a Israel. O ponto e vírgula mantém unido o anúncio solene e sua consequência.
