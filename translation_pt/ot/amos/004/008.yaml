  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָע֡וּ שְׁתַּיִם֩ שָׁלֹ֨שׁ עָרִ֜ים אֶל עִ֥יר אַחַ֛ת לִ/שְׁתּ֥וֹת מַ֖יִם וְ/לֹ֣א יִשְׂבָּ֑עוּ וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/008.yaml
  text: So two or three cities staggered to one city to drink water[a], but they were not satisfied; yet you did not return to me[b], declares Yahweh.
translation:
  language: pt
  text: Assim, duas ou três cidades vaguearam até uma só cidade para beber água[a], mas não se saciaram; mesmo assim, vocês não voltaram para mim[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cambalearam” ou “foram de um lado para outro até uma só cidade”. O verbo hebraico sugere movimento instável ou errante, na busca por água.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se voltaram para mim”. Em Amós, “voltar” também pode transmitir a ideia de voltar-se novamente para Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: cambalearam
  rationale: O verbo נוע indica movimento instável, de um lado para outro. “Cambalearam” comunica a busca desesperada por água e preserva a personificação das cidades no hebraico.
- source_word: שְׁתַּיִם שָׁלֹשׁ עָרִים
  choice: duas ou três cidades
  rationale: O par numérico hebraico expressa um pequeno número indefinido; “duas ou três” é a formulação natural em português.
- source_word: אֶל עִיר אַחַת
  choice: até uma só cidade
  rationale: Preserva a ideia de várias cidades convergindo para uma única cidade onde ainda havia água.
- source_word: לִשְׁתּוֹת מַיִם
  choice: para beber água
  rationale: Expressa diretamente a finalidade indicada pelo infinitivo hebraico.
- source_word: וְלֹא יִשְׂבָּעוּ
  choice: mas não se saciaram
  rationale: שׂבע denota ficar satisfeito ou saciado. No contexto de água insuficiente, “não se saciaram” é natural e mantém o sentido de insuficiência.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Mesmo assim, vocês não voltaram para mim
  rationale: “Voltaram para mim” conserva tanto o sentido básico de retorno quanto a dimensão profética de arrependimento e restauração da relação com Deus. “Mesmo assim” torna clara a força adversativa da frase.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Formula profética solene e concisa, com o nome divino transliterado.
theological_decisions:
- issue: Nuance de arrependimento em שׁוב
  choice: vocês não voltaram para mim
  alternative: vocês não se converteram a mim
  rationale: “Voltaram” preserva a ambiguidade entre retorno e arrependimento pactual, sem tornar explícita uma interpretação que o verbo apenas sugere no contexto.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome divino, não um título; a transliteração preserva essa distinção.
- issue: Personificação metonímica das cidades
  choice: duas ou três cidades cambalearam
  alternative: os moradores de duas ou três cidades foram cambaleando
  rationale: A tradução mantém a imagem marcante do hebraico, em que as cidades representam seus habitantes, sem inserir uma explicação no corpo do versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide a descrição da seca da acusação divina. A personificação das cidades e a tensão semântica de “voltar” foram preservadas.
