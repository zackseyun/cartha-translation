  verdict: revise
  source_fidelity: A tradução reproduz adequadamente o juramento, a santidade divina, o anúncio de juízo e a imagem de remoção forçada. Contudo, “até” acrescenta uma força inclusiva que não está expressa no hebraico, e “as últimas de vocês” fica elíptico e pouco natural como objeto da segunda ação. A formulação revista conserva a incerteza de אַחֲרִיתְכֶן sem transformar a alternativa em certeza.
  naturalness: “Vejam!” é atual e apropriado ao anúncio profético. “Dias virão sobre vocês” é mais idiomático e mais próximo da fórmula hebraica do que “Estão chegando dias contra vocês”. “O que restar de vocês” torna clara a construção paralela sem o acréscimo interpretativo de “até”.
  terminology: “O Senhor Yahweh” representa de modo direto e natural אֲדֹנָי יְהוִה, preservando tanto o título quanto o nome divino. “Ganchos” e “anzóis” são opções aceitáveis, desde que a nota mantenha a reconhecida dificuldade lexical.
  issues:
  - severity: medium
    issue: “até as últimas de vocês” introduz “até” e produz uma construção elíptica.
    rationale: O hebraico traz simplesmente “e [o] vosso אחרית com/por instrumentos de pesca”; não contém um equivalente explícito de “até”. Além disso, “as últimas de vocês” não explicita naturalmente em português o referente coletivo da expressão.
  - severity: low
    issue: “Estão chegando dias contra vocês” é menos fluente e menos formalmente próximo da fórmula profética.
    rationale: “Dias virão sobre vocês” expressa com naturalidade o particípio de iminência e preserva o valor de עֲלֵיכֶם, sem enfraquecer o tom ameaçador.
  - severity: low
    issue: “O Soberano Yahweh” é compreensível, mas “O Senhor Yahweh” é a representação portuguesa mais direta do título composto.
    rationale: Senhor traduz normalmente אֲדֹנָי; combinado com “Yahweh”, evita a duplicação artificial e mantém a identificação transparente dos dois elementos hebraicos.
