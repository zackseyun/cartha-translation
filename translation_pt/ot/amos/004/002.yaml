  text: נִשְׁבַּ֨ע אֲדֹנָ֤/י יְהוִה֙ בְּ/קָדְשׁ֔/וֹ כִּ֛י הִנֵּ֥ה יָמִ֖ים בָּאִ֣ים עֲלֵי/כֶ֑ם וְ/נִשָּׂ֤א אֶתְ/כֶם֙ בְּ/צִנּ֔וֹת וְ/אַחֲרִיתְ/כֶ֖ן בְּ/סִיר֥וֹת דּוּגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/002.yaml
  text: 'The Lord GOD has sworn by his holiness: For behold[a], days are coming upon you when they will lift you away with hooks[b], and your posterity with fishhooks.'
translation:
  language: pt
  text: 'O Senhor Yahweh jurou por sua santidade: “Vejam! Dias virão sobre vocês, quando serão levadas com ganchos, e o que restar de vocês, com anzóis.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos traduzidos por “ganchos” e “anzóis” são difíceis. Podem indicar, de modo mais geral, instrumentos pontiagudos semelhantes a utensílios de pesca. A expressão traduzida por “o que restar de vocês” também pode referir-se ao fim, ao futuro ou à posteridade de vocês.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: O Soberano Yahweh
  rationale: Preserva os dois elementos do título hebraico sem a repetição pouco natural de “Senhor SENHOR”; “Soberano” comunica אֲדֹנָי, e “Yahweh” representa o nome divino.
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O perfeito hebraico apresenta o juramento solene como fato estabelecido e vigente no anúncio profético.
- source_word: בְּקָדְשׁוֹ
  choice: por sua santidade
  rationale: Neste contexto, קֹדֶשׁ denota mais naturalmente a santidade de Deus, invocada como garantia do juramento, e não seu santuário.
- source_word: כִּי הִנֵּה
  choice: Vejam!
  rationale: Expressa de modo atual e enfático a função de הִנֵּה; o caráter afirmativo e introdutório de כִּי é absorvido naturalmente na pontuação e no anúncio que segue.
- source_word: יָמִים בָּאִים עֲלֵיכֶם
  choice: Estão chegando dias contra vocês
  rationale: Mantém a fórmula profética e explicita o valor ameaçador de עַל neste contexto de juízo.
- source_word: וְנִשָּׂא אֶתְכֶם
  choice: serão levadas
  rationale: A forma singular pode ter sujeito impessoal; a passiva portuguesa reproduz essa indeterminação sem inventar um agente. O feminino concorda com as mulheres de Samaria interpeladas no contexto.
- source_word: בְּצִנּוֹת
  choice: com ganchos
  rationale: O paralelo com apetrechos de pesca favorece instrumentos pontiagudos usados para arrastar ou conduzir cativas, embora o termo hebraico seja difícil.
- source_word: וְאַחֲרִיתְכֶן
  choice: e até as últimas de vocês
  rationale: No contexto de deportação total, אַחֲרִית aponta de modo mais provável para as que restarem ou forem as últimas, não para descendentes futuros. “Até” torna explícita em português a força inclusiva contextual sem alterar o referente.
- source_word: בְּסִירוֹת דּוּגָה
  choice: com anzóis
  rationale: A expressão difícil parece indicar instrumentos ligados à pesca; “anzóis” preserva o paralelismo com “ganchos” e a imagem de remoção forçada.
theological_decisions:
- issue: Representação de יְהוִה no título אֲדֹנָי יְהוִה
  choice: O Soberano Yahweh
  alternative: O Senhor DEUS
  rationale: A forma escolhida preserva diretamente o nome da aliança e distingue os dois componentes do título, sem produzir “Senhor Senhor”.
- issue: Referente de וְאַחֲרִיתְכֶן
  choice: as últimas de vocês
  alternative: sua posteridade
  rationale: A ameaça descreve a remoção completa das mulheres interpeladas; por isso, a leitura referente às últimas ou restantes se ajusta melhor ao contexto imediato, embora o substantivo também possa denotar futuro ou posteridade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas femininas para refletir as mulheres de Samaria interpeladas no contexto. Evitou-se o arcaísmo “eis que”; “Vejam!” conserva a urgência profética. A ambiguidade lexical dos instrumentos e de אַחֲרִית foi registrada em nota.
