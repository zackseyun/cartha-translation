revisions:
- from: 'O Soberano Yahweh jurou por sua santidade: “Vejam! Estão chegando dias contra vocês, em que serão levadas com ganchos, e até as últimas de vocês, com anzóis.[a]”'
  to: 'O Senhor Yahweh jurou por sua santidade: “Vejam! Dias virão sobre vocês, quando serão levadas com ganchos, e o que restar de vocês, com anzóis.[a]”'
  rationale: A revisão elimina o acréscimo interpretativo de “até”, melhora a sintaxe portuguesa da segunda metade do versículo e preserva em nota a amplitude semântica disputada de אַחֲרִיתְכֶן. Também torna a fórmula profética e o título divino mais diretos e naturais em português, sem alterar o sentido do anúncio.
