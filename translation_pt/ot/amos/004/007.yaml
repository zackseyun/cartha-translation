source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִי֩ מָנַ֨עְתִּי מִ/כֶּ֜ם אֶת הַ/גֶּ֗שֶׁם בְּ/ע֨וֹד שְׁלֹשָׁ֤ה חֳדָשִׁים֙ לַ/קָּצִ֔יר וְ/הִמְטַרְתִּי֙ עַל עִ֣יר אֶחָ֔ת וְ/עַל עִ֥יר אַחַ֖ת לֹ֣א אַמְטִ֑יר חֶלְקָ֤ה אַחַת֙ תִּמָּטֵ֔ר וְ/חֶלְקָ֛ה אֲשֶֽׁר לֹֽא תַמְטִ֥יר עָלֶ֖י/הָ תִּיבָֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/007.yaml
  text: And I also withheld the rain from you when there were still three months until the harvest; and I caused it to rain on one city[a], but on another city I did not cause it to rain. One field received rain, but the field on which it did not rain dried up.
translation:
  language: pt
  text: Também eu retive de vocês a chuva quando ainda faltavam três meses para a colheita. Fiz chover sobre uma cidade, mas sobre outra cidade não fiz chover. Uma parcela de terra recebeu chuva, mas a parcela sobre a qual não choveu secou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אָנֹכִי
  choice: Também eu
  rationale: Preserva tanto o valor aditivo de וְגַם, que liga este juízo aos anteriores, quanto a ênfase do pronome independente אָנֹכִי, sem tornar a frase pesada.
- source_word: מָנַעְתִּי מִכֶּם אֶת־הַגֶּשֶׁם
  choice: retive de vocês a chuva
  rationale: Expressa naturalmente a ideia de impedir ou reter algo de alguém e mantém explícita a ação divina.
- source_word: בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר
  choice: quando ainda faltavam três meses para a colheita
  rationale: Comunica com clareza o período ainda restante e a importância agrícola do momento.
- source_word: וְהִמְטַרְתִּי
  choice: Fiz chover
  rationale: Reproduz de modo idiomático e explícito o sentido causativo do hifil de מטר.
- source_word: עַל עִיר אֶחָת ... וְעַל עִיר אַחַת לֹא אַמְטִיר
  choice: sobre uma cidade, mas sobre outra cidade não fiz chover
  rationale: Mantém o contraste deliberado e a repetição de 'cidade' presentes no paralelismo hebraico.
- source_word: חֶלְקָה אַחַת
  choice: Uma parcela de terra
  rationale: חֶלְקָה designa uma porção ou lote de terreno; 'parcela de terra' evita sugerir mais especificamente do que o hebraico que se tratava de um campo cultivado.
- source_word: תִּמָּטֵר
  choice: recebeu chuva
  rationale: Representa de forma natural em português o sentido passivo, evitando a construção pouco idiomática 'foi chovida'.
- source_word: וְחֶלְקָה אֲשֶׁר לֹא תַמְטִיר עָלֶיהָ
  choice: mas a parcela sobre a qual não choveu
  rationale: Segue o sentido da oração relativa hebraica e preserva a mudança para uma formulação em que a chuva simplesmente não cai sobre a parcela.
- source_word: תִּיבָשׁ
  choice: secou
  rationale: Traduz diretamente o resultado expresso por יבש e se aplica naturalmente ao terreno.
theological_decisions:
- issue: Ação divina na distribuição seletiva da chuva e na seca
  choice: Manter a primeira pessoa e a ação divina explícitas em 'retive' e 'fiz chover'.
  alternative: Empregar formulações impessoais, como 'a chuva foi retida' ou 'choveu'.
  rationale: O hebraico enfatiza que o próprio Deus controla a chuva como ato de juízo; a tradução não deve atenuar essa afirmação.
- issue: Mudança de agência na última oração relativa
  choice: Traduzir literalmente o sentido como 'sobre a qual não choveu', sem inserir novamente 'eu'.
  alternative: 'Harmonizar com a ação divina anterior: ''sobre a qual não fiz chover''.'
  rationale: Embora o contexto continue atribuindo a distribuição da chuva a Deus, a forma hebraica da oração relativa permite e favorece uma expressão menos explícita; preservá-la evita uniformizar silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Vocês' representa o plural de מִכֶּם sem regionalismo excessivo. A redação preserva a repetição retórica e a ação divina explícita, mas mantém a mudança de formulação na última oração.
