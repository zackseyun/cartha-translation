  naturalness: O texto é claro, fluente e digno em português moderno. «Parcela de terra» é compreensível internacionalmente e evita restringir חלקה a um campo já cultivado. A repetição de «cidade» e «parcela» funciona bem como reflexo do paralelismo do original.
  terminology: «Retive ... a chuva», «fiz chover», «colheita» e «secou» são escolhas precisas e naturais. «Vocês» é apropriado para a legibilidade brasileira e permanece amplamente compreensível. Não há termos teológicos que exijam padronização adicional neste versículo.
