source:
  edition: WLC
  text: הִכֵּ֣יתִי אֶתְ/כֶם֮ בַּ/שִּׁדָּפ֣וֹן וּ/בַ/יֵּרָקוֹן֒ הַרְבּ֨וֹת גַּנּוֹתֵי/כֶ֧ם וְ/כַרְמֵי/כֶ֛ם וּ/תְאֵנֵי/כֶ֥ם וְ/זֵיתֵי/כֶ֖ם יֹאכַ֣ל הַ/גָּזָ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/009.yaml
  text: I struck you with blight and mildew; your many gardens and your vineyards[a], your fig trees and your olive trees, the locust devoured; yet you did not return to me, declares Yahweh.
translation:
  language: pt
  text: Eu os feri com crestamento e ferrugem; seus muitos jardins e suas vinhas, suas figueiras e suas oliveiras, o gafanhoto[a] devorou. Mesmo assim, vocês não voltaram para mim — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o gafanhoto cortador” (ou “roedor”); o hebraico nomeia um inseto que devora plantações, tradicionalmente entendido como uma espécie ou fase de gafanhoto.
    reason: Alternativa lexical para הַגָּזָם, cuja identificação zoológica exata é incerta.
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: Eu os feri
  rationale: O hifil de נכה expressa ação direta de ferir ou atingir. “Eu os feri” mantém a primeira pessoa divina e o caráter judicial da ação, em linguagem atual e solene.
- source_word: בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן
  choice: com crestamento e ferrugem
  rationale: Os termos designam danos agrícolas ligados ao ressecamento ou queima das plantas e ao seu amarelecimento ou doença. “Crestamento e ferrugem” é uma formulação agrícola reconhecível em português e preserva a distinção entre as duas calamidades.
- source_word: הַרְבּוֹת גַּנּוֹתֵיכֶם
  choice: seus muitos jardins
  rationale: הַרְבּוֹת indica abundância ou multiplicidade, e גַּנּוֹת significa jardins ou terrenos cultivados. A escolha acompanha de perto a construção hebraica sem restringi-la a pomares.
- source_word: וְכַרְמֵיכֶם
  choice: e suas vinhas
  rationale: כֶּרֶם designa uma vinha ou vinhedo; “vinhas” é natural em português no contexto de propriedades agrícolas.
- source_word: וּתְאֵנֵיכֶם וְזֵיתֵיכֶם
  choice: suas figueiras e suas oliveiras
  rationale: Neste inventário agrícola, os substantivos se referem naturalmente às árvores, não apenas aos frutos.
- source_word: יֹאכַל הַגָּזָם
  choice: o gafanhoto devorou
  rationale: גָּזָם nomeia um inseto destruidor de plantações, tradicionalmente entendido como um tipo ou estágio de gafanhoto. O imperfeito é traduzido como passado por integrar a retrospectiva das calamidades. “Devorou” comunica a intensidade destrutiva.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Mesmo assim, vocês não voltaram para mim
  rationale: שׁוּב com עַד exprime retorno a Deus em sentido relacional e pactual. “Voltaram para mim” conserva essa amplitude sem reduzir o sentido apenas a arrependimento interior; “mesmo assim” explicita a relação concessiva indicada no contexto.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é uma fórmula profética solene, bem representada por “declara”; o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de שַׁבְתֶּם עָדַי no contexto profético
  choice: vocês não voltaram para mim
  alternative: vocês não se arrependeram diante de mim; vocês não retornaram a mim
  rationale: A expressão abrange arrependimento, mudança de rumo e restauração da lealdade a Deus. A formulação escolhida mantém essa amplitude teológica.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem marcada “seus muitos jardins... o gafanhoto devorou” preserva a topicalização e a sequência do hebraico. O travessão antes da fórmula profética favorece clareza sem alterar seu valor solene.
