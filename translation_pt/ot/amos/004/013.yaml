id: AMO.4.13
reference: Amos 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֡י הִנֵּה֩ יוֹצֵ֨ר הָרִ֜ים וּ/בֹרֵ֣א ר֗וּחַ וּ/מַגִּ֤יד לְ/אָדָם֙ מַה שֵּׂח֔/וֹ עֹשֵׂ֥ה שַׁ֨חַר֙ עֵיפָ֔ה וְ/דֹרֵ֖ךְ עַל בָּ֣מֳתֵי אָ֑רֶץ יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/013.yaml
  text: For behold[a], the one who forms the mountains and creates the wind, and declares to man what his thought is, who makes the dawn darkness and treads on the heights of the earth—Yahweh, the God of hosts[c][b], is his name.
translation:
  language: pt
  text: Pois eis aquele que forma os montes, cria o vento[a] e declara ao ser humano[b] qual é o seu pensamento[c]; aquele que faz da aurora escuridão e pisa sobre as alturas da terra — Yahweh, o Deus dos Exércitos, é o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o espírito” ou “o sopro”; o termo hebraico רוּחַ pode ter esses sentidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao homem”; o hebraico usa אָדָם no singular como representante da humanidade.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser entendido como “qual é o pensamento dele” ou “o que ele está pensando”. O hebraico não torna totalmente explícito se o pensamento é de Deus ou do ser humano.
    reason: ambiguity
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Pois eis
  rationale: כִּי fundamenta a advertência anterior, enquanto הִנֵּה introduz com solenidade e vivacidade aquele que será identificado.
- source_word: יוֹצֵר הָרִים
  choice: forma os montes
  rationale: O particípio de יצר comunica formação intencional; “forma” conserva essa imagem de atividade criadora. “Montes” é natural e digno em português.
- source_word: וּבֹרֵא רוּחַ
  choice: cria o vento
  rationale: No conjunto de atos cósmicos, “vento” é o sentido contextual mais provável de רוּחַ, sem excluir seus sentidos de “espírito” ou “sopro”, registrados em nota.
- source_word: וּמַגִּיד לְאָדָם
  choice: declara ao ser humano
  rationale: מגיד tem o sentido formal de anunciar ou declarar. אָדָם é singular representativo e, neste contexto genérico, “ser humano” comunica naturalmente a referência à humanidade sem convertê-la em plural.
- source_word: מַה שֵּׂחוֹ
  choice: qual é o seu pensamento
  rationale: שֵׂחַ pode designar pensamento, meditação, reflexão ou fala. A formulação mantém a referência pronominal do hebraico e sua possível ambiguidade.
- source_word: עֹשֵׂה שַׁחַר עֵיפָה
  choice: faz da aurora escuridão
  rationale: A construção expressa o poder de transformar a aurora em escuridão; “faz da aurora escuridão” é clara em português e preserva a imagem profética de reversão.
- source_word: וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ
  choice: pisa sobre as alturas da terra
  rationale: דרך com עַל transmite a ideia de pisar ou caminhar sobre algo. Aqui, בָּמוֹת refere-se mais naturalmente às alturas topográficas, reforçando a soberania cósmica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Preserva a imagem hebraica das hostes ou forças sob o comando divino, usando uma expressão corrente e inteligível em português.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: A cópula, implícita no hebraico, é necessária para uma identificação culminante natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de רוּחַ no contexto da criação
  choice: vento
  alternative: espírito; sopro
  rationale: A sequência de montes, aurora e alturas da terra favorece o fenômeno natural “vento”, mas a amplitude semântica do termo é mantida em nota.
- issue: Referente do sufixo em שֵּׂחוֹ
  choice: seu pensamento, com referente não explicitado
  alternative: o pensamento de Deus; o pensamento do ser humano
  rationale: O pronome hebraico pode ser entendido de maneiras diferentes. A tradução conserva a ambiguidade em vez de decidir silenciosamente entre o pensamento divino e o humano.
- issue: Valor genérico de אָדָם
  choice: ser humano
  alternative: homem; humanidade
  rationale: O singular hebraico é representativo. “Ser humano” mantém o singular e comunica a referência genérica com naturalidade no português atual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois eis” conserva a solenidade profética; a sequência participial foi organizada com pontuação clara, sem eliminar a cadência acumulativa do hebraico.
