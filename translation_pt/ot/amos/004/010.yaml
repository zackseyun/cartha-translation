  terminology: “Peste”, “à espada”, “jovens”, “acampamentos”, “voltaram para mim” e “Yahweh” são escolhas adequadas. “Voltaram para mim” mantém a metáfora de שוב sem impor a paráfrase teológica “arrependeram-se”. As notas estão corretamente ancoradas e correspondem às dificuldades lexicais assinaladas.
