  source_fidelity: 'A tradução transmite com fidelidade a sequência do hebraico: Yahweh envia uma peste, mata os jovens à espada no contexto da captura dos cavalos, faz subir o mau odor dos acampamentos e constata que o povo não retornou a ele. “Como a do Egito” é uma forma idiomática adequada para a expressão alusiva בְּדֶרֶךְ מִצְרַיִם, e a nota preserva a alternativa mais próxima da forma hebraica. A formulação “os seus cavalos foram capturados” explicita de modo natural a construção condensada עִם שְׁבִי סוּסֵיכֶם, sem alegar além do que o contexto permite.'
