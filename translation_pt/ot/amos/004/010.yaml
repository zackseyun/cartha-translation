  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁלַּ֨חְתִּי בָ/כֶ֥ם דֶּ֨בֶר֙ בְּ/דֶ֣רֶךְ מִצְרַ֔יִם הָרַ֤גְתִּי בַ/חֶ֨רֶב֙ בַּח֣וּרֵי/כֶ֔ם עִ֖ם שְׁבִ֣י סֽוּסֵי/כֶ֑ם וָ/אַעֲלֶ֞ה בְּאֹ֤שׁ מַחֲנֵי/כֶם֙ וּֽ/בְ/אַפְּ/כֶ֔ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/010.yaml
  text: I sent among you a plague in the manner of Egypt[a]; I killed your young men with the sword, along with your captured horses, and I made the stench of your camps rise even into your nostrils; yet you did not return to me[b], declares Yahweh.
translation:
  language: pt
  text: Enviei entre vocês uma peste como a do Egito[a]; matei à espada os seus jovens, e os seus cavalos foram capturados[b]. Fiz o fedor dos seus acampamentos subir até as narinas de vocês. Mesmo assim, vocês não voltaram para mim — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à maneira do Egito”. A expressão provavelmente alude às pragas ou aos juízos ligados ao Egito, e não a uma rota geográfica.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “junto com o cativeiro dos seus cavalos”. A expressão condensada provavelmente descreve uma derrota militar na qual os cavalos foram tomados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלַּחְתִּי בָכֶם דֶּבֶר
  choice: Enviei entre vocês uma peste
  rationale: Mantém o sentido direto de שׁלח e entende בָכֶם como a introdução da calamidade no meio do povo. “Peste” é atual, clara e apropriada para uma epidemia mortal.
- source_word: בְּדֶרֶךְ מִצְרַיִם
  choice: como a do Egito
  rationale: Expressa de modo natural a comparação provável com as pragas ou os juízos sofridos pelo Egito, sem tratar דֶּרֶךְ como uma estrada literal. A nota registra a alternativa mais formal.
- source_word: הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם
  choice: matei à espada os seus jovens
  rationale: Reproduz a força direta de הָרַגְתִּי, conserva a imagem bélica da espada e não restringe בַּחוּרֵיכֶם a “guerreiros”, embora o contexto seja militar.
- source_word: עִם שְׁבִי סוּסֵיכֶם
  choice: e os seus cavalos foram capturados
  rationale: A expressão hebraica é condensada e literalmente associa a morte dos jovens ao “cativeiro” ou à captura dos cavalos. A formulação portuguesa comunica a derrota militar sem sugerir que os cavalos também foram mortos.
- source_word: וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּבְאַפְּכֶם
  choice: Fiz o fedor dos seus acampamentos subir até as narinas de vocês
  rationale: Preserva a construção causativa, a imagem forte do odor repugnante e o sentido físico de אַף neste contexto. “Fedor” é mais intenso e preciso que o eufemismo “mau cheiro”.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Mesmo assim, vocês não voltaram para mim
  rationale: שׁוב tem aqui força relacional e pactual, podendo implicar arrependimento; “voltaram para mim” conserva essa amplitude sem inserir uma explicação doutrinária no texto.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto contém explicitamente o Tetragrama. “Yahweh” preserva o nome próprio e mantém continuidade com a política editorial indicada, sem substituí-lo por um título.
- issue: Sentido teológico de וְלֹא שַׁבְתֶּם עָדַי
  choice: vocês não voltaram para mim
  alternative: vocês não se arrependeram e voltaram para mim
  rationale: O verbo pode abranger arrependimento, mas sua imagem lexical é a de voltar ou retornar. A tradução mantém a convocação teológica sem tornar explícito mais do que o hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de “vocês” e “seus”. A pontuação divide a longa sequência hebraica em frases naturais sem enfraquecer a progressão do juízo. “Mesmo assim” comunica com clareza o contraste de וְלֹא, e o travessão antes da fórmula profética produz uma conclusão solene.
