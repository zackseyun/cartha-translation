id: AMO.4.4
reference: Amos 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֹּ֤אוּ בֵֽית אֵל֙ וּ/פִשְׁע֔וּ הַ/גִּלְגָּ֖ל הַרְבּ֣וּ לִ/פְשֹׁ֑עַ וְ/הָבִ֤יאוּ לַ/בֹּ֨קֶר֙ זִבְחֵי/כֶ֔ם לִ/שְׁלֹ֥שֶׁת יָמִ֖ים מַעְשְׂרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/004.yaml
  text: Come to Bethel—and transgress; to Gilgal—and multiply transgression. Bring your sacrifices every morning[a], your tithes every three days,
translation:
  language: pt
  text: Venham a Betel e transgridam; venham a Gilgal e multipliquem as suas transgressões. Tragam, todas as manhãs, os seus sacrifícios e, a cada três dias[a], os seus dízimos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no terceiro dia” ou “depois de três dias”.
    reason: A expressão hebraica לִשְׁלֹשֶׁת יָמִים admite mais de uma relação temporal, e a ambiguidade deve permanecer acessível ao leitor.
lexical_decisions:
- source_word: בֹּאוּ
  choice: Venham
  rationale: O imperativo plural preserva a convocação profética direta e vívida; em português, “venham” exprime naturalmente o movimento em direção aos santuários.
- source_word: בֵית אֵל
  choice: Betel
  rationale: Mantém o nome próprio tradicional do lugar, sem traduzi-lo como “casa de Deus”.
- source_word: וּפִשְׁעוּ
  choice: e transgridam
  rationale: “Transgredir” conserva a ideia de violação e rebeldia presente em פשע, além da força irônica do imperativo.
- source_word: הַגִּלְגָּל
  choice: venham a Gilgal
  rationale: O verbo foi repetido por elipse a partir da primeira oração, tornando explícito em português o movimento paralelo em direção a Gilgal.
- source_word: הַרְבּוּ לִפְשֹׁעַ
  choice: multipliquem as suas transgressões
  rationale: Reproduz a intensificação expressa pelo imperativo hifil seguido do infinitivo, preservando a concisão e a ironia profética.
- source_word: וְהָבִיאוּ
  choice: Tragam
  rationale: Mantém o imperativo plural que dá continuidade à convocação irônica.
- source_word: לַבֹּקֶר
  choice: todas as manhãs
  rationale: Expressa o provável sentido distributivo da frase no contexto da crítica à assiduidade ritual.
- source_word: זִבְחֵיכֶם
  choice: os seus sacrifícios
  rationale: É a expressão cultual clara e corrente para זבח com o sufixo possessivo plural.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: a cada três dias
  rationale: Comunica a leitura distributiva mais provável no contexto da sátira contra o zelo ritual, sem ocultar em nota as outras possibilidades temporais.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: os seus dízimos
  rationale: “Dízimos” é o termo português estabelecido e exato para as ofertas correspondentes à décima parte.
theological_decisions:
- issue: Ironia profética dos imperativos
  choice: 'Manter os comandos em forma direta: “Venham... transgridam... multipliquem”.'
  alternative: Explicitar a ironia com algo como “Vão em frente e transgridam”.
  rationale: O hebraico emprega imperativos reais numa denúncia sarcástica. A forma direta deixa que a ironia surja do contexto, sem acrescentar interpretação ao texto.
- issue: Sentido temporal de לִשְׁלֹשֶׁת יָמִים
  choice: “a cada três dias” no texto principal
  alternative: “no terceiro dia” ou “depois de três dias”
  rationale: A expressão é genuinamente ambígua. A leitura distributiva se ajusta bem à sátira de Amós sobre a frequência ritual, enquanto as demais possibilidades são preservadas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “venham” explicita a elipse hebraica sem alterar o paralelismo; a pontuação preserva o ritmo incisivo da denúncia profética.
