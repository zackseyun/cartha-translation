source:
  edition: WLC
  text: וְ/קַטֵּ֤ר מֵֽ/חָמֵץ֙ תּוֹדָ֔ה וְ/קִרְא֥וּ נְדָב֖וֹת הַשְׁמִ֑יעוּ כִּ֣י כֵ֤ן אֲהַבְתֶּם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/005.yaml
  text: And burn a thank offering from leavened bread[a], and proclaim freewill offerings—announce them! For this is what you have loved, O sons of Israel[b], declares the Lord GOD.
translation:
  language: pt
  text: Queimem uma oferta de gratidão com pão fermentado[a]; proclamem ofertas voluntárias — anunciem-nas! Pois é disso que vocês gostam, filhos de Israel[b] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma oferta de gratidão com fermento” ou “uma oferta de gratidão feita de pão fermentado”. O hebraico liga algo fermentado à oferta de gratidão, mas a relação exata é concisa e pode ser entendida de mais de uma maneira.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַטֵּר
  choice: Queimem
  rationale: O imperativo piel de קטר descreve fazer a oferta subir em fumaça no altar. “Queimem” é claro e preserva a convocação irônica do profeta.
- source_word: מֵחָמֵץ תּוֹדָה
  choice: pão fermentado como oferta de gratidão
  rationale: חָמֵץ pode indicar fermento ou algo fermentado, e תּוֹדָה é aqui uma oferta sacrificial de gratidão. A formulação conserva a ligação sintática difícil entre o material fermentado e a oferta, sem decidir além do necessário se ele constitui toda a oferta ou a acompanha.
- source_word: וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ
  choice: proclamem ofertas voluntárias — anunciem-nas!
  rationale: קרא indica proclamação pública; נְדָבוֹת é o termo cultual para ofertas dadas voluntariamente; e o hiphil de שמע intensifica a ideia de fazê-las ouvir ou torná-las públicas.
- source_word: כִּי כֵן אֲהַבְתֶּם
  choice: Pois é disso que vocês gostam
  rationale: A expressão aponta acusadoramente para as práticas anteriores. Em português corrente, “é disso que vocês gostam” transmite a disposição arraigada expressa pelo perfeito sem produzir uma construção artificial.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma hebraica do vocativo coletivo e sua ressonância histórica.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética “declara”; אֲדֹנָי é vertido por “Senhor”, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome pessoal יהוה e torna explícito o nome divino presente no texto hebraico.
- issue: Tom das ordens cultuais
  choice: imperativos preservados como convocação irônica
  alternative: paráfrase condenatória explícita
  rationale: O contexto indica sarcasmo profético, mas o versículo formula ordens. Preservar os imperativos mantém a tensão sem inserir uma explicação interpretativa no corpo do texto.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais no plural adequadas à leitura brasileira. O paralelismo e a força irônica foram preservados; o travessão marca a intensificação de “anunciem-nas!” e a fórmula profética final.
