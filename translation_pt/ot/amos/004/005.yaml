    issue: O objeto de «Queimem» é apresentado como «pão fermentado», e não como a oferta de gratidão.
    rationale: Em מחמץ תודה, תודה é o termo sacrificial central; a relação de מחמץ com ele é deliberadamente concisa. A formulação atual pode sugerir, de maneira mais definida do que o hebraico, que o pão é simplesmente identificado com toda a oferta. Convém reconstituir «oferta de gratidão» como objeto e conservar a relação sob nota.
