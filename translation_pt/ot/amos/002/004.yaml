source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יְהוּדָ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל מָאֳסָ֞/ם אֶת תּוֹרַ֣ת יְהוָ֗ה וְ/חֻקָּי/ו֙ לֹ֣א שָׁמָ֔רוּ וַ/יַּתְעוּ/ם֙ כִּזְבֵי/הֶ֔ם אֲשֶׁר הָלְכ֥וּ אֲבוֹתָ֖/ם אַחֲרֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/004.yaml
  text: 'Thus says Yahweh: “For three transgressions of Judah[a], and for four, I will not turn it back, because they have rejected the law of Yahweh and have not kept his statutes; and their lies have led them astray[c][b], after which their fathers walked.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões de Judá, e ainda por quatro, não voltarei atrás[a], porque rejeitaram a lei[b] de Yahweh e não guardaram os seus estatutos. Suas mentiras[c] os desviaram, aquelas que seus antepassados seguiram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não revogarei isso”, isto é, o juízo ou castigo anunciado.'
    reason: lexical_alternative
  - marker: b
    text: “A lei de Yahweh” também pode ser traduzida por “a instrução de Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: “Suas mentiras” pode referir-se mais especificamente a deuses falsos ou ídolos — objetos enganosos de culto que seus antepassados seguiram.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פִּשְׁעֵי
  choice: transgressões
  rationale: Expressa violações graves de caráter moral e pactual e mantém a fórmula recorrente de Amos.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não voltarei atrás
  rationale: Reproduz de modo natural a concisão da fórmula hebraica sem explicitar como objeto o juízo ou o castigo.
- source_word: מָאֳסָם
  choice: rejeitaram
  rationale: Comunica claramente o repúdio deliberado à instrução de Yahweh.
- source_word: תּוֹרַת יְהוָה
  choice: a lei de Yahweh
  rationale: “Lei” é reconhecível e apropriado ao contexto pactual, embora תּוֹרָה também possa significar “instrução”.
- source_word: חֻקָּיו
  choice: os seus estatutos
  rationale: Mantém o sentido jurídico-pactual do termo com registro digno e compreensível.
- source_word: שָׁמָרוּ
  choice: não guardaram
  rationale: Verbo tradicional, claro e idiomático em português para observar ou cumprir mandamentos pactuais.
- source_word: וַיַּתְעוּם
  choice: os desviaram
  rationale: 'Expressa o valor causativo do verbo: as mentiras fizeram que eles se extraviassem.'
- source_word: כִּזְבֵיהֶם
  choice: suas mentiras
  rationale: Conserva o sentido lexical direto e a ambiguidade entre falsidades em geral e possíveis deuses falsos ou ídolos.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם
  choice: aquelas que seus antepassados seguiram
  rationale: Retém a ligação da oração relativa com “mentiras” e verte naturalmente o idioma hebraico “andar atrás” como “seguir”.
theological_decisions:
- issue: Sentido da fórmula de juízo לֹא אֲשִׁיבֶנּוּ
  choice: não voltarei atrás
  alternative: não revogarei o castigo; não desistirei de punir
  rationale: O objeto do sufixo permanece implícito no hebraico. A formulação escolhida conserva a tensão, sem acrescentar “castigo”, “sentença” ou “ira” ao texto principal.
- issue: Referente de כִּזְבֵיהֶם
  choice: suas mentiras
  alternative: seus falsos deuses; seus ídolos
  rationale: Embora o termo possa aludir metonimicamente à idolatria, o hebraico diz literalmente “mentiras/falsidades”; a tradução principal não restringe indevidamente o referente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para soar natural sem eliminar a concisão profética, a fórmula numérica nem as ambiguidades do hebraico.
