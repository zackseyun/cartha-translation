source:
  edition: WLC
  text: וָ/אָקִ֤ים מִ/בְּנֵי/כֶם֙ לִ/נְבִיאִ֔ים וּ/מִ/בַּחוּרֵי/כֶ֖ם לִ/נְזִרִ֑ים הַ/אַ֥ף אֵֽין זֹ֛את בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/011.yaml
  text: And I raised up some of your sons to be prophets[a], and some of your young men to be Nazirites. Is this not so[b], O sons of Israel? declares Yahweh.
translation:
  language: pt
  text: E suscitei, dentre os filhos de vocês, profetas e, dentre os jovens de vocês, nazireus[a]. Acaso não é assim, ó filhos de Israel[b]? — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nazireus” eram pessoas especialmente consagradas a Deus; também se pode traduzir por “consagrados”.
    reason: Nota cultural e alternativa lexical para o termo técnico נְזִרִים.
  - marker: b
    text: Literalmente, “filhos de Israel”; isto é, os israelitas ou o povo de Israel.
    reason: Esclarece que a expressão hebraica funciona como designação coletiva da nação.
lexical_decisions:
- source_word: וָאָקִים
  choice: suscitei
  rationale: O hifil de קום expressa fazer surgir ou levantar alguém para uma função. “Suscitei” é conciso, digno e comunica a iniciativa divina.
- source_word: מִבְּנֵיכֶם לִנְבִיאִים
  choice: profetas dentre os filhos de vocês
  rationale: A construção com מִן tem sentido partitivo, e לְ indica a função para a qual foram levantados. A formulação preserva tanto a origem no meio do povo quanto o papel profético.
- source_word: וּמִבַּחוּרֵיכֶם לִנְזִרִים
  choice: e nazireus dentre os seus jovens
  rationale: בָּחוּר designa jovens do sexo masculino, e נָזִיר é o termo específico para quem assumia uma consagração nazireia. “Nazireus” conserva essa instituição israelita sem reduzi-la a uma consagração genérica.
- source_word: הַאַף אֵין זֹאת
  choice: Não é mesmo assim
  rationale: A pergunta retórica espera concordância; “mesmo” representa a força enfática de אַף sem tornar a frase artificial em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: A expressão é literalmente “filhos de Israel” e funciona como vocativo dirigido à nação. A forma tradicional permanece clara em português.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם introduz uma declaração solene e profética. O nome próprio divino é representado diretamente como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz o nome divino, não o título אֲדֹנָי. “Yahweh” o apresenta como nome próprio e evita substituí-lo silenciosamente por um título; “Javé” é uma forma portuguesa possível.
- issue: Sentido de נְזִרִים
  choice: nazireus
  alternative: consagrados; pessoas sob voto de nazireado
  rationale: O contexto aponta para a condição específica do nazireado em Israel. O termo técnico preserva essa referência, enquanto a nota fornece a explicação necessária.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A tradução mantém a imagem genealógica e pactual do hebraico sem negar que o vocativo se dirige coletivamente à nação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” adequado tanto ao uso brasileiro quanto a uma leitura internacional clara. A ordem foi levemente ajustada para fluidez, preservando o paralelismo entre profetas e nazireus. Os marcadores foram colocados junto aos termos que efetivamente explicam.
