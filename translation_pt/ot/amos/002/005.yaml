id: AMO.2.5
reference: Amos 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בִּֽ/יהוּדָ֑ה וְ/אָכְלָ֖ה אַרְמְנ֥וֹת יְרוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/005.yaml
  text: So I will send fire upon Judah[a], and it will devour the citadels of Jerusalem.
translation:
  language: pt
  text: Por isso, enviarei fogo sobre Judá, e ele devorará as cidadelas de Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palácios” ou “fortalezas”. O termo hebraico pode referir-se a edifícios palacianos fortificados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Por isso, enviarei
  rationale: O hifil de שׁלח significa normalmente “enviar”. A conjunção liga esta sentença de juízo ao motivo apresentado no versículo anterior; “Por isso” expressa de modo natural a relação consequencial, mantendo a primeira pessoa e o sentido futuro.
- source_word: אֵשׁ
  choice: fogo
  rationale: Correspondência direta ao hebraico אֵשׁ. No contexto profético, pode designar tanto fogo concreto quanto uma imagem de juízo destrutivo; a tradução não restringe o sentido.
- source_word: בִּיהוּדָה
  choice: sobre Judá
  rationale: Embora ב possa ser traduzida por “em” ou, contextualmente, “contra”, a expressão portuguesa “enviar fogo sobre” comunica com naturalidade a direção hostil do juízo sem explicar além do texto.
- source_word: וְאָכְלָה
  choice: e ele devorará
  rationale: אכל significa literalmente “comer”, mas, tendo o fogo como sujeito, “devorar” é idiomático e preserva a força da metáfora hebraica.
- source_word: אַרְמְנוֹת
  choice: as cidadelas
  rationale: אַרְמְנוֹת pode indicar edifícios palacianos fortificados ou fortalezas. “Cidadelas” preserva bem o componente defensivo e monumental, enquanto a nota registra alternativas legítimas.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
theological_decisions:
- issue: Natureza do fogo anunciado
  choice: Manter a imagem direta do juízo divino sem definir o mecanismo.
  alternative: Entender exclusivamente como incêndio literal ou exclusivamente como metáfora de invasão militar.
  rationale: O versículo anuncia que Deus enviará fogo e que este devorará as cidadelas, mas não determina se o fogo deve ser entendido como estritamente literal, metafórico ou mediado por uma invasão. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Por isso” torna explícita a ligação consequencial com o versículo anterior; “cidadelas” conserva a combinação de caráter palaciano e defensivo do termo hebraico.
