  yaml_path: translation/ot/amos/002/014.yaml
  text: Flight will perish from the swift[a], and the strong will not strengthen his power[d][c][b], and the warrior will not save his life.
translation:
  language: pt
  text: O veloz ficará sem possibilidade de fuga[a]; o forte não conseguirá mobilizar sua força[b], e o guerreiro não salvará a própria vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A fuga faltará ao veloz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não tornará firme a sua força” ou “não reunirá forças”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não salvará a sua néfesh”; neste contexto, o termo hebraico significa “vida” ou “a si mesmo”, não especificamente “alma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד מָנוֹס מִקָּל
  choice: A possibilidade de fuga desaparecerá para o veloz
  rationale: A construção anuncia que até a pessoa veloz perderá qualquer possibilidade de fugir. “Desaparecerá” preserva a imagem de אָבַד, enquanto “possibilidade de fuga” expressa naturalmente o sentido abstrato de מָנוֹס em português.
- source_word: וְחָזָק
  choice: o forte
  rationale: O adjetivo substantivado designa uma pessoa forte. A formulação concisa também mantém a progressão entre o veloz, o forte e o guerreiro.
- source_word: לֹא יְאַמֵּץ כֹּחוֹ
  choice: não conseguirá mobilizar sua força
  rationale: O piel de אמץ com כֹּח descreve tornar efetiva, reunir ou pôr em ação a própria força. “Mobilizar sua força” evita uma repetição artificial e comunica que a força existente não lhe servirá para escapar.
- source_word: וְגִבּוֹר
  choice: e o guerreiro
  rationale: No contexto de juízo e incapacidade militar, גִּבּוֹר denota naturalmente um combatente valente ou poderoso; “guerreiro” distingue-o do “forte” anterior.
- source_word: לֹא יְמַלֵּט נַפְשׁוֹ
  choice: não salvará a própria vida
  rationale: מלט no piel significa fazer escapar, livrar ou salvar. Aqui נֶפֶשׁ se refere à vida ou à própria pessoa ameaçada, não especificamente a uma alma imaterial.
