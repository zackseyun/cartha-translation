id: AMO.2.8
reference: Amos 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַל בְּגָדִ֤ים חֲבֻלִים֙ יַטּ֔וּ אֵ֖צֶל כָּל מִזְבֵּ֑חַ וְ/יֵ֤ין עֲנוּשִׁים֙ יִשְׁתּ֔וּ בֵּ֖ית אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/008.yaml
  text: And on garments taken in pledge they stretch themselves out beside every altar[c][b][a], and in the house of their God they drink the wine of those they have fined.
translation:
  language: pt
  text: Sobre roupas tomadas como penhor, eles se estendem junto a todo altar[a]; e, na casa de seu Deus[b], bebem o vinho dos que foram multados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre roupas dadas em penhor, eles se deitam junto a todo altar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na casa de seus deuses”. A forma hebraica pode ser entendida como singular ou plural neste contexto.'
    reason: alternative_reading
  - marker: c
    text: Literalmente, “o vinho dos multados” ou “o vinho dos punidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים חֲבֻלִים
  choice: roupas tomadas como penhor
  rationale: Mantém o sentido amplo de בְּגָדִים e explicita a força jurídica do particípio חֲבֻלִים, que descreve peças de roupa retidas como garantia.
- source_word: יַטּוּ
  choice: eles se estendem
  rationale: Preserva a imagem física de pessoas que se estiram ou reclinam sobre as roupas, bem como o tom de indulgência abusiva.
- source_word: אֵצֶל כָּל מִזְבֵּחַ
  choice: junto a todo altar
  rationale: Expressa naturalmente a relação espacial de אֵצֶל e conserva a força distributiva de כָּל com o substantivo singular.
- source_word: יֵין עֲנוּשִׁים
  choice: o vinho dos que foram multados
  rationale: עֲנוּשִׁים deriva de uma raiz ligada à imposição de pena, muitas vezes pecuniária. A formulação preserva a relação genitiva sem afirmar além do texto exatamente como o vinho foi obtido.
- source_word: יִשְׁתּוּ
  choice: bebem
  rationale: O presente português comunica adequadamente a ação habitual denunciada no contexto profético.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: na casa de seu Deus
  rationale: Embora אֱלֹהִים tenha forma plural e possa admitir leitura plural, essa forma também designa regularmente o Deus de Israel; o singular 'casa' e o contexto permitem 'seu Deus'. A alternativa plural é preservada em nota.
theological_decisions:
- issue: Se אֱלֹהֵיהֶם deve ser entendido como singular ('seu Deus') ou plural ('seus deuses')
  choice: seu Deus
  alternative: seus deuses
  rationale: A forma אֱלֹהִים é morfologicamente plural, mas frequentemente funciona como designação singular do Deus de Israel, inclusive com sufixo possessivo. Como o contexto não elimina por completo a leitura plural, a tradução principal adota o singular idiomático sem apagar a alternativa, registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem das duas acusações e as imagens concretas do hebraico foram mantidas; as ambiguidades lexical e teológica relevantes aparecem em notas.
