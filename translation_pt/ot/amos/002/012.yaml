  text: וַ/תַּשְׁק֥וּ אֶת הַ/נְּזִרִ֖ים יָ֑יִן וְ/עַל הַ/נְּבִיאִים֙ צִוִּיתֶ֣ם לֵ/אמֹ֔ר לֹ֖א תִּנָּבְאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/012.yaml
  text: But you made the Nazirites drink wine[a], and you commanded the prophets, saying[b], ‘Do not prophesy.’
translation:
  language: pt
  text: 'Mas vocês fizeram os nazireus[a] beber vinho e ordenaram aos profetas, dizendo[b]: “Não profetizem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os consagrados”. Os nazireus eram pessoas submetidas a um voto especial de consagração, que incluía a abstinência de vinho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Vocês não profetizarão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּשְׁקוּ
  choice: fizeram ... beber
  rationale: O hifil de שׁקה tem sentido causativo. A construção preserva essa força de maneira natural em português, sem decidir além do texto se houve coerção física.
- source_word: הַנְּזִרִים
  choice: os nazireus
  rationale: O termo técnico preserva a categoria israelita específica de pessoas consagradas por voto, em vez de reduzi-la a uma descrição genérica.
- source_word: יָיִן
  choice: vinho
  rationale: Equivalente direto de יַיִן; sua menção é decisiva porque os nazireus deviam abster-se de vinho.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Tradução direta e corrente para os porta-vozes proféticos de Deus.
- source_word: צִוִּיתֶם
  choice: ordenaram
  rationale: Expressa com clareza a imposição autoritativa contida em צוה.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém explicitamente a fórmula hebraica que introduz o discurso direto.
- source_word: לֹא תִּנָּבְאוּ
  choice: Não profetizem
  rationale: Em contexto, a forma verbal negada comunica uma proibição dirigida aos profetas; o imperativo negativo é a formulação portuguesa mais direta e natural.
theological_decisions:
- issue: Preservação da identidade específica dos נזירים e da gravidade da transgressão
  choice: nazireus
  alternative: consagrados
  rationale: “Nazireus” mantém a referência histórico-religiosa ao voto especial que incluía abstinência de vinho, enquanto “consagrados” poderia generalizar indevidamente o grupo.
- issue: Força da proibição dirigida aos profetas
  choice: “Não profetizem”
  alternative: “Vocês não profetizarão”
  rationale: O contexto favorece uma ordem proibitiva. A alternativa conserva formalmente o imperfeito hebraico, mas pode soar em português como simples previsão, enfraquecendo a ordem.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O pronome “vocês” torna explícito o plural presente nos verbos hebraicos; “nazireus” retém o termo cultural específico, explicado em nota.
