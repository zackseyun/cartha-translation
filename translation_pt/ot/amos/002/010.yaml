  text: וְ/אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אוֹלֵ֨ךְ אֶתְ/כֶ֤ם בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה לָ/רֶ֖שֶׁת אֶת אֶ֥רֶץ הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/010.yaml
  text: Yet I brought you up from the land of Egypt[a], and I led you in the wilderness forty years, to take possession of the land of the Amorites.
translation:
  language: pt
  text: Mas fui eu que os fiz sair da terra do Egito e os conduzi pelo deserto durante quarenta anos, para que tomassem posse da terra dos amorreus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a terra do amorreu”; o singular é usado em sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Mas fui eu quem
  rationale: A conjunção, junto do pronome independente enfático, marca contraste com as acusações anteriores e realça a ação de Deus. A formulação é natural em português e preserva essa ênfase.
- source_word: הֶעֱלֵיתִי
  choice: fez vocês saírem
  rationale: O hifil de עלה descreve Deus fazendo Israel subir do Egito. Em português corrente, “fez vocês saírem” comunica naturalmente o êxodo; “fez subir” poderia sugerir apenas deslocamento vertical.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém o substantivo אֶרֶץ e reproduz com clareza a expressão hebraica.
- source_word: וָאוֹלֵךְ
  choice: os conduziu
  rationale: O hifil de הלך com objeto direto expressa fazer ir ou conduzir. “Conduziu” comunica de modo idiomático a direção divina.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: Embora בְּ possa ser vertido por “no”, o contexto de uma condução que durou quarenta anos favorece o português natural “pelo deserto”, sem alterar o sentido.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: “Durante” explicita de modo natural em português a extensão temporal indicada pela expressão hebraica.
- source_word: לָרֶשֶׁת
  choice: para que tomassem posse de
  rationale: O infinitivo de ירשׁ indica a finalidade da condução e, neste contexto, a apropriação da terra. A oração final preserva o sujeito Israel e soa natural em português.
- source_word: אֶרֶץ הָאֱמֹרִי
  choice: a terra dos amorreus
  rationale: O hebraico emprega o singular הָאֱמֹרִי coletivamente. O plural “amorreus” transmite esse valor de maneira clara e idiomática em português.
theological_decisions:
- issue: Singular coletivo em הָאֱמֹרִי
  choice: a terra dos amorreus
  alternative: a terra do amorreu
  rationale: O singular hebraico tem sentido coletivo. O plural português evita a impressão de que a terra pertencia a um único indivíduo, enquanto a nota registra a forma da fonte sem introduzir uma interpretação doutrinária.
- issue: Relação de finalidade em לָרֶשֶׁת
  choice: para que tomassem posse
  alternative: para possuir / para herdarem
  rationale: A tradução conserva a finalidade histórica da condução e o sentido ativo de ירשׁ, sem impor à expressão a conotação teológica mais específica que “herdar” poderia adquirir.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. “Vocês” representa de forma transparente o objeto plural de segunda pessoa; a ênfase divina é preservada por “fui eu quem”.
