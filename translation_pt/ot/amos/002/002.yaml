id: AMO.2.2
reference: Amos 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מוֹאָ֔ב וְ/אָכְלָ֖ה אַרְמְנ֣וֹת הַ/קְּרִיּ֑וֹת וּ/מֵ֤ת בְּ/שָׁאוֹן֙ מוֹאָ֔ב בִּ/תְרוּעָ֖ה בְּ/ק֥וֹל שׁוֹפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/002.yaml
  text: So I will send fire upon Moab[a], and it will consume the citadels of Kerioth; and Moab will die amid tumult, amid shouting[c][b], amid the sound of a trumpet.
translation:
  language: pt
  text: Por isso, enviarei fogo contra Moabe, e ele consumirá as fortalezas de Queriote[a]. Moabe morrerá em meio ao tumulto, aos gritos de guerra[b] e ao toque da trombeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os palácios de Queriote» ou «as cidadelas de Queriote». Queriote também pode ser entendido como «as cidades», embora provavelmente seja aqui o nome de um lugar.
    reason: lexical_alternative
  - marker: b
    text: Ou «aos brados»; o termo pode indicar um grito ou brado de guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Por isso, enviarei
  rationale: O verbo na primeira pessoa mantém a ação divina direta. «Por isso» expressa naturalmente a ligação conclusiva com a sentença do versículo anterior.
- source_word: אֵשׁ בְּמוֹאָב
  choice: fogo contra Moabe
  rationale: Mantém a imagem profética do fogo e apresenta ב como direção hostil do juízo.
- source_word: וְאָכְלָה
  choice: e ele consumirá
  rationale: O pronome retoma «fogo», e «consumirá» traduz de modo natural sua ação destrutiva.
- source_word: אַרְמְנוֹת
  choice: as fortalezas
  rationale: O termo pode indicar palácios fortificados ou cidadelas; «fortalezas» preserva com clareza sua dimensão defensiva.
- source_word: הַקְּרִיּוֹת
  choice: de Queriote
  rationale: É mais provável que seja o nome de uma localidade moabita, embora a leitura comum «das cidades» continue possível e seja registrada em nota.
- source_word: וּמֵת מוֹאָב
  choice: Moabe morrerá
  rationale: Preserva o sentido direto de «morrer» e a personificação da nação, com valor futuro na sequência profética.
- source_word: בְּשָׁאוֹן
  choice: em meio ao tumulto
  rationale: Comunica o ambiente de estrondo, agitação e caos ligado à destruição militar.
- source_word: בִּתְרוּעָה
  choice: aos gritos de guerra
  rationale: Neste contexto bélico, תְּרוּעָה provavelmente indica brado ou grito de guerra; essa opção também evita confundi-lo com o toque da trombeta mencionado em seguida.
- source_word: בְּקוֹל שׁוֹפָר
  choice: ao toque da trombeta
  rationale: Expressão portuguesa clara para o som do שׁוֹפָר, instrumento de chifre usado, entre outras funções, em contexto militar.
theological_decisions: []
