id: AMO.2.6
reference: Amos 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יִשְׂרָאֵ֔ל וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל מִכְרָ֤/ם בַּ/כֶּ֨סֶף֙ צַדִּ֔יק וְ/אֶבְי֖וֹן בַּ/עֲב֥וּר נַעֲלָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Israel[a], and for four, I will not revoke the punishment, because they sell the righteous for silver, and the needy for a pair of sandals.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões de Israel, e por quatro, não revogarei o castigo[a], porque vendem o justo por prata e o necessitado por um par de sandálias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não o farei voltar”; o objeto está implícito, provavelmente o juízo anunciado.
    reason: Preservar a elipse e a ambiguidade da expressão hebraica.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética de mensageiro e translitera o nome divino pessoal de acordo com a prática do projeto.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  choice: Por três transgressões... e por quatro
  rationale: Preserva a fórmula de progressão numérica característica de Amós e a força moral e pactual de פֶּשַׁע.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não revogarei o castigo
  rationale: Expressa em português natural o sentido contextual de não retirar a sentença anunciada; a nota registra a formulação mais literal e a elipse do objeto.
- source_word: מִכְרָם
  choice: porque vendem
  rationale: Converte naturalmente o infinitivo hebraico com sufixo em uma oração causal, sem alterar sua função.
- source_word: בַּכֶּסֶף
  choice: por prata
  rationale: Conserva o termo concreto do hebraico, que pode indicar o valor pago, em vez de generalizá-lo como dinheiro.
- source_word: צַדִּיק
  choice: o justo
  rationale: Preserva a ligação lexical com a justiça e também permite o sentido contextual de alguém que está com a razão ou é inocente.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: Comunica a condição de carência e vulnerabilidade indicada pelo termo, com maior precisão que uma referência genérica ao pobre.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: por um par de sandálias
  rationale: Reflete a forma dual de נַעֲלַיִם e comunica de modo idiomático o preço trivial e degradante da transação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: Usa uma transliteração amplamente reconhecível do nome da aliança, sem substituí-lo por um título.
- issue: Sentido de לֹא אֲשִׁיבֶנּוּ no refrão de Amós
  choice: não revogarei o castigo
  alternative: não o farei voltar; não voltarei atrás
  rationale: O objeto do verbo está elíptico no hebraico. O texto principal comunica a referência contextual provável ao castigo, enquanto a nota preserva a forma mais literal e explicita a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura retórica de Amós e o paralelismo foram preservados.
