source:
  edition: WLC
  text: וְ/הִכְרַתִּ֥י שׁוֹפֵ֖ט מִ/קִּרְבָּ֑/הּ וְ/כָל שָׂרֶ֛י/הָ אֶהֱר֥וֹג עִמּ֖/וֹ אָמַ֥ר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/003.yaml
  text: And I will cut off the judge from her midst[a], and I will kill all her officials with him,” says Yahweh.
translation:
  language: pt
  text: Eliminarei do meio dela o governante[a] e matarei com ele todos os seus oficiais, diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o juiz”; o termo hebraico pode indicar um oficial judicial ou, de modo mais amplo neste contexto, uma autoridade governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Eliminarei
  rationale: O hifil de כרת expressa remoção decisiva, podendo implicar extermínio. “Eliminarei” comunica isso com clareza e naturalidade em português, sem reduzir o sentido ao simples ato de afastar.
- source_word: שׁוֹפֵט
  choice: o governante
  rationale: Embora o sentido básico seja “juiz”, aqui o termo provavelmente designa a autoridade que governa Moabe, especialmente por seu paralelismo com os oficiais. A nota preserva a alternativa lexical genuína.
- source_word: מִקִּרְבָּהּ
  choice: do meio dela
  rationale: Mantém o sufixo feminino singular, que personifica Moabe, e traduz naturalmente a ideia de remoção de seu interior.
- source_word: וְכָל שָׂרֶיהָ
  choice: todos os seus oficiais
  rationale: שׂרים designa integrantes da liderança política. “Oficiais” evita sugerir necessariamente príncipes hereditários e é compreensível no português atual.
- source_word: אֶהֱרֹג
  choice: matarei
  rationale: Tradução direta e atual do verbo הרג, sem suavizar a violência do anúncio de juízo.
- source_word: עִמּוֹ
  choice: com ele
  rationale: O pronome masculino singular retoma naturalmente “o governante” e indica que os oficiais terão o mesmo destino.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: A fórmula profética é vertida naturalmente no presente, enquanto o nome divino é transliterado para preservar o nome próprio do texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome divino. “Yahweh” preserva sua função de nome próprio sem substituí-lo por um título.
- issue: Função de שׁוֹפֵט em Moabe
  choice: governante
  alternative: juiz
  rationale: O contexto de juízo contra a liderança política de Moabe e o paralelismo com “oficiais” favorecem o sentido mais amplo de autoridade governante; a possibilidade mais literal é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A personificação feminina de Moabe foi preservada em “dela”, e a formulação concisa acompanha a força do oráculo hebraico.
