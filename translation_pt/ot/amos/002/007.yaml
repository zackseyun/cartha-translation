  text: הַ/שֹּׁאֲפִ֤ים עַל עֲפַר אֶ֨רֶץ֙ בְּ/רֹ֣אשׁ דַּלִּ֔ים וְ/דֶ֥רֶךְ עֲנָוִ֖ים יַטּ֑וּ וְ/אִ֣ישׁ וְ/אָבִ֗י/ו יֵֽלְכוּ֙ אֶל הַֽ/נַּעֲרָ֔ה לְמַ֥עַן חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/007.yaml
  text: those who trample the head of the poor into the dust of the earth[a], and turn aside the way of the humble; and a man and his father go in to the same girl[d][c][b], so as to profane my holy name.
translation:
  language: pt
  text: os que pisoteiam a cabeça dos pobres no pó da terra[a] e desviam o caminho dos humildes[b]. Um homem e seu pai têm relações com a mesma jovem[c][d], a fim de profanar o meu santo nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que anseiam pelo pó da terra sobre a cabeça dos pobres”. O verbo hebraico pode indicar literalmente um desejo intenso ou o ato de ofegar, mas, neste contexto, provavelmente descreve opressão cruel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “desviam a vereda dos aflitos” ou “dos mansos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “vão à jovem”; neste contexto, trata-se de um eufemismo sexual. “Jovem” também pode ser traduzido por “moça”.'
    reason: lexical_alternative
  - marker: d
    text: O versículo não identifica explicitamente a jovem como prostituta cultual, serva ou escrava, embora alguns intérpretes entendam que o contexto sugere alguma forma específica de exploração.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁאֲפִים עַל עֲפַר אֶרֶץ בְּרֹאשׁ דַּלִּים
  choice: os que esmagam a cabeça dos pobres contra o pó da terra
  rationale: שׁאף pode expressar o ato de ofegar ou desejar intensamente, mas, neste contexto de opressão, a construção provavelmente retrata humilhação violenta. “Esmagam... contra o pó” comunica essa força em português natural, preservando as imagens da cabeça e do pó.
- source_word: וְדֶרֶךְ עֲנָוִים יַטּוּ
  choice: e desviam o caminho dos humildes
  rationale: Mantém a metáfora de דֶּרֶךְ, “caminho”, e traduz o Hifil de נטה como “desviam”. עֲנָוִים admite os sentidos de humildes, mansos ou aflitos; “humildes” preserva uma amplitude semelhante.
- source_word: וְאִישׁ וְאָבִיו
  choice: Um homem e seu pai
  rationale: Reproduz diretamente os substantivos singulares sem acrescentar que agem simultaneamente.
- source_word: יֵלְכוּ אֶל הַנַּעֲרָה
  choice: têm relações com a mesma jovem
  rationale: “Ir à jovem” funciona aqui como eufemismo sexual. “Têm relações” torna o sentido compreensível sem vulgaridade; “jovem” representa נַעֲרָה, e “a mesma” esclarece que ambos se dirigem à mulher definida pelo artigo, sem especificar sua condição social.
- source_word: לְמַעַן חַלֵּל
  choice: profanando assim
  rationale: A formulação portuguesa expressa a ligação de finalidade ou resultado entre a conduta e a profanação, sem determinar rigidamente qual dessas nuances predomina.
- source_word: אֶת שֵׁם קָדְשִׁי
  choice: o meu santo nome
  rationale: É a expressão idiomática portuguesa que preserva o peso teológico e pactual do hebraico.
theological_decisions:
- issue: Sentido de הַשֹּׁאֲפִים na denúncia da opressão
  choice: A imagem principal é apresentada como esmagar a cabeça dos pobres contra o pó.
  alternative: “Os que anseiam pelo pó da terra sobre a cabeça dos pobres” ou “os que ofegam pelo pó...”.
  rationale: A leitura mais literal do verbo é lexicalmente possível, mas resulta obscura em português. A tradução principal comunica a provável violência social do contexto, enquanto a nota preserva a ambiguidade real.
- issue: Natureza da transgressão sexual em וְאִישׁ וְאָבִיו יֵלְכוּ אֶל הַנַּעֲרָה
  choice: Um homem e seu pai mantêm relações sexuais com a mesma jovem, profanando o santo nome de Deus.
  alternative: Pode haver alusão a exploração de uma serva ou escrava, prostituição cultual ou outra forma específica de abuso sexual.
  rationale: O texto hebraico não identifica a jovem como prostituta cultual, serva ou escrava. Essas possibilidades não devem ser incorporadas ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e explicita discretamente o eufemismo sexual. As notas preservam as ambiguidades lexicais e impedem que hipóteses sobre a identidade da jovem sejam apresentadas como fatos.
