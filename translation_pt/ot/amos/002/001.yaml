  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י מוֹאָ֔ב וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל שָׂרְפ֛/וֹ עַצְמ֥וֹת מֶֽלֶךְ אֱד֖וֹם לַ/שִּֽׂיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/001.yaml
  text: 'Thus says Yahweh: “For three transgressions of Moab[a], and for four, I will not revoke it[b], because he burned the bones of the king of Edom to lime.”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Por três transgressões de Moabe, e ainda por quatro, não revogarei isso[a], porque ele queimou os ossos do rei de Edom até reduzi-los a cal[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não o farei voltar”, isto é, não voltarei atrás nem anularei o juízo anunciado. O referente de “isso” não é declarado expressamente no hebraico.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “para fazer cal” ou “para reboco”; o hebraico indica que os ossos foram queimados tão completamente que se reduziram a cal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Reproduz a fórmula profética de mensageiro em português natural e mantém o nome divino representado pelo tetragrama.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל אַרְבָּעָה
  choice: Por três transgressões de Moabe, e ainda por quatro
  rationale: Preserva a progressão numérica característica de Amós; “transgressões” mantém a ideia de delitos que também constituem rebelião, enquanto “e ainda” torna a escalada clara em português.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: não revogarei isso
  rationale: Mantém um objeto não especificado, como no hebraico, sem definir explicitamente se se trata da sentença ou do castigo; a nota registra o sentido mais literal do verbo.
- source_word: עַל שָׂרְפוֹ
  choice: porque ele queimou
  rationale: עַל introduz o motivo do juízo. O sufixo do infinitivo é singular; “ele” conserva a personificação corporativa de Moabe, sem normalizá-la para o plural.
- source_word: עַצְמוֹת מֶלֶךְ אֱדוֹם
  choice: os ossos do rei de Edom
  rationale: Tradução direta da cadeia construta, identificando com clareza os restos mortais profanados.
- source_word: לַשִּׂיד
  choice: até reduzi-los a cal
  rationale: שִׂיד designa cal ou material de reboco, não simplesmente cinzas. A formulação comunica que os ossos foram queimados de modo extremo até se tornarem cal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama; “Yahweh” representa o nome próprio, em vez de substituí-lo por um título.
- issue: Referente do objeto em לֹא אֲשִׁיבֶנּוּ
  choice: Manter o referente aberto com “isso”
  alternative: não revogarei a sentença; não retirarei o castigo
  rationale: O sufixo masculino singular tem referente implícito. Não se explicita “sentença” ou “castigo” no texto principal, evitando resolver uma ambiguidade que o hebraico preserva.
- issue: Sujeito singular do ato de queimar
  choice: ele, referindo-se corporativamente a Moabe
  alternative: eles, os moabitas
  rationale: A morfologia hebraica é singular. A tradução mantém a personificação corporativa, embora o agente histórico possa ter sido coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a fórmula numérica de Amós, o singular corporativo aplicado a Moabe e a ambiguidade do objeto de “revogar”. Evitou-se “cinzas”, pois seria lexicalmente menos preciso.
