  text: וְ/אַמִּ֥יץ לִבּ֖/וֹ בַּ/גִּבּוֹרִ֑ים עָר֛וֹם יָנ֥וּס בַּ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/016.yaml
  text: Even the stouthearted among the warriors will flee naked on that day,” declares Yahweh[a].
translation:
  language: pt
  text: Até o mais valente entre os guerreiros fugirá nu naquele dia”, declara Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַמִּיץ לִבּוֹ
  choice: o mais valente
  rationale: A expressão hebraica, literalmente ligada à força ou firmeza do coração, designa alguém corajoso e resoluto. “O mais valente” comunica naturalmente o superlativo contextual sem reproduzir de modo artificial o possessivo hebraico.
- source_word: בַּגִּבּוֹרִים
  choice: entre os guerreiros
  rationale: Neste contexto militar, גִּבּוֹרִים se refere a combatentes fortes ou valorosos; “guerreiros” preserva esse sentido com clareza em português atual.
- source_word: עָרוֹם
  choice: nu
  rationale: Mantém o sentido direto e incisivo do hebraico, sugerindo fuga em pânico, vulnerabilidade e humilhação, sem acrescentar a interpretação de que tenha sido despido.
- source_word: יָנוּס
  choice: fugirá
  rationale: É o equivalente direto e idiomático do verbo hebraico para fugir.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal profética natural em português, correspondente à fórmula hebraica.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” preserva o caráter solene da fórmula profética, e “Yahweh” representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Força comparativa da expressão אַמִּיץ לִבּוֹ בַּגִּבּוֹרִים
  choice: o mais valente entre os guerreiros
  alternative: o valente de coração entre os guerreiros
  rationale: A construção aponta para aquele que se destaca em coragem no grupo. A tradução principal explicita essa força contextual em português natural, sem alterar o sentido teológico do juízo universal sobre a capacidade militar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e o impacto do anúncio profético, inclusive a imagem forte de o guerreiro fugir nu.
