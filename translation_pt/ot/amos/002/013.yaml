base_translation:
  language: en
  yaml_path: translation/ot/amos/002/013.yaml
  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
translation:
  language: pt
  text: 'Amós 2:13


    Eis que faço pressão sob vocês[a], como uma carroça cheia de feixes faz pressão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farei o chão ceder sob vocês” ou “vou pressionar vocês onde estão”. O verbo hebraico pode indicar pressão ou peso, e a construção é difícil. A forma verbal também pode descrever uma ação presente ou um futuro iminente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Introduz com ênfase o anúncio divino. O plural concorda com os destinatários e soa natural no português atual, sem o caráter arcaizante de “Eis que”.
- source_word: אָנֹכִי
  choice: Eu
  rationale: O pronome independente dá ênfase ao sujeito divino; sua expressão explícita em português preserva essa força.
- source_word: מֵעִיק
  choice: exerço pressão
  rationale: O particípio causativo comunica pressão ou peso. A formulação conserva a imagem sem impor como objeto explícito nem Israel nem o chão, ambos interpretações possíveis na construção difícil.
- source_word: תַּחְתֵּיכֶם
  choice: debaixo de vocês
  rationale: Mantém o sentido espacial mais direto de תַּחַת e evita substituir a expressão hebraica pela interpretação mais livre “no lugar de vocês”.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz claramente a comparação e preserva sua correspondência enfática.
- source_word: תָּעִיק
  choice: exerce pressão
  rationale: Repete a mesma expressão usada para מֵעִיק, refletindo a repetição lexical hebraica entre o anúncio e a imagem da carroça.
- source_word: הָעֲגָלָה
  choice: uma carroça
  rationale: Em uma comparação genérica, o artigo hebraico é representado de modo idiomático pelo indefinido português. “Carroça” comunica claramente o veículo agrícola.
- source_word: הַמְלֵאָה לָהּ
  choice: cheia
  rationale: Expressa naturalmente o estado da carroça; o dativo pronominal não requer representação separada em português.
- source_word: עָמִיר
  choice: feixes
  rationale: Designa os molhos de cereal ou talos colhidos e preserva com concisão a imagem agrícola.
theological_decisions:
- issue: Objeto e direção da pressão no anúncio de juízo
  choice: Conservar “debaixo de vocês” sem acrescentar um objeto explícito
  alternative: “Eu esmagarei vocês onde estão” ou “farei o chão ceder debaixo de vocês”
  rationale: A sintaxe e o raro verbo hebraico admitem leituras diferentes. A opção principal preserva a tensão da imagem e evita decidir sem necessidade se Deus pressiona Israel diretamente ou o que está sob seus pés.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Vejam” dá força atual ao marcador discursivo; “exerce pressão” preserva a repetição e a ambiguidade do hebraico, embora sua formulação deliberadamente aberta seja menos idiomática que algumas paráfrases interpretativas.
