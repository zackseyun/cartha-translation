  naturalness: «Vejam!» é compreensível, mas «Eis que» é a forma portuguesa mais natural para introduzir um anúncio solene profético, sem sugerir que os destinatários devem olhar para algo. «Fazer pressão sob vocês» é mais fluente que «exercer pressão debaixo de vocês», e «carroça cheia de feixes» deve manter a mesma elipse verbal da comparação.
  terminology: «Carroça» e «feixes» são adequados. A repetição de «fazer pressão» representa de maneira clara a repetição do verbo hebraico, sem impor que Israel seja o objeto direto da ação.
