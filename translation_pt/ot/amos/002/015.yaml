source:
  edition: WLC
  text: וְ/תֹפֵ֤שׂ הַ/קֶּ֨שֶׁת֙ לֹ֣א יַעֲמֹ֔ד וְ/קַ֥ל בְּ/רַגְלָ֖י/ו לֹ֣א יְמַלֵּ֑ט וְ/רֹכֵ֣ב הַ/סּ֔וּס לֹ֥א יְמַלֵּ֖ט נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/015.yaml
  text: And the one who grasps the bow will not stand[a], and the swift of foot will not escape[c][b], and the rider of the horse will not save his life.
translation:
  language: pt
  text: Quem empunha o arco não ficará firme[a]; quem é veloz nos pés não escapará; e quem monta o cavalo não salvará a própria vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não permanecerá de pé” ou “não manterá sua posição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não escapará com vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹפֵשׂ הַקֶּשֶׁת
  choice: quem empunha o arco
  rationale: A expressão participial significa literalmente quem segura ou maneja o arco. “Empunha” preserva a imagem concreta e, no contexto militar, soa natural em português sem reduzir a expressão simplesmente a “arqueiro”.
- source_word: לֹא יַעֲמֹד
  choice: não ficará firme
  rationale: עמד significa literalmente ficar de pé ou permanecer. Aqui, no contexto de derrota militar, indica não conseguir manter a posição ou resistir; “não ficará firme” conserva tanto a imagem quanto a força contextual.
- source_word: קַל בְּרַגְלָיו
  choice: quem é veloz nos pés
  rationale: Reproduz com clareza a construção hebraica, que descreve alguém rápido para correr, em linguagem compreensível e digna.
- source_word: לֹא יְמַלֵּט
  choice: não escapará
  rationale: O piel de מלט, nesta cláusula, comunica livrar-se do perigo ou fugir com êxito. “Não escapará” é o equivalente português mais natural.
- source_word: רֹכֵב הַסּוּס
  choice: quem monta o cavalo
  rationale: Mantém o singular e a formulação explícita do hebraico, evitando transformar a expressão em uma designação técnica como “cavaleiro”.
- source_word: לֹא יְמַלֵּט נַפְשׁוֹ
  choice: não salvará a própria vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida da pessoa. A formulação expressa claramente que nem o homem montado conseguirá preservar a própria vida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O paralelismo hebraico foi preservado por meio de três orações coordenadas. A tradução mantém as imagens concretas do arco, dos pés e do cavalo, sem arcaísmos nem terminologia militar excessivamente técnica.
