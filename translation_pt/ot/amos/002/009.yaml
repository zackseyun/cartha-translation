  text: וְ/אָ֨נֹכִ֜י הִשְׁמַ֤דְתִּי אֶת הָֽ/אֱמֹרִי֙ מִ/פְּנֵי/הֶ֔ם אֲשֶׁ֨ר כְּ/גֹ֤בַהּ אֲרָזִים֙ גָּבְה֔/וֹ וְ/חָסֹ֥ן ה֖וּא כָּֽ/אַלּוֹנִ֑ים וָ/אַשְׁמִ֤יד פִּרְי/וֹ֙ מִ/מַּ֔עַל וְ/שָׁרָשָׁ֖י/ו מִ/תָּֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/009.yaml
  text: Yet I destroyed the Amorite before them[a], whose height was like the height of cedars, and he was strong like the oaks[b]; I destroyed his fruit above and his roots beneath.
translation:
  language: pt
  text: Contudo, fui eu que destruí o amorreu diante deles[a], cuja altura era como a dos cedros e que era forte como os carvalhos. Destruí seu fruto acima e suas raízes abaixo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os amorreus”. O hebraico usa o singular “o amorreu” coletivamente para designar o povo.
    reason: lexical_alternative
  - marker: b
    text: “Fruto” e “raízes” dão continuidade à imagem da árvore e expressam destruição completa, de cima a baixo.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Contudo, fui eu
  rationale: A conjunção e o pronome enfático marcam contraste no contexto; a construção portuguesa preserva com naturalidade tanto o contraste quanto a ênfase no agente divino.
- source_word: הִשְׁמַדְתִּי
  choice: destruí
  rationale: O hifil de שׁמד expressa causar destruição ou eliminar; “destruí” é forte, claro e não excede a imagem do versículo.
- source_word: הָאֱמֹרִי
  choice: o amorreu
  rationale: Mantém-se o singular coletivo hebraico, que personifica o povo amorreu como um único adversário.
- source_word: מִפְּנֵיהֶם
  choice: diante deles
  rationale: Reproduz de modo idiomático a expressão espacial hebraica, indicando que Deus removeu o amorreu da presença de Israel.
- source_word: אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ
  choice: embora ele fosse alto como os cedros
  rationale: Comunica a estatura extraordinária por meio da comparação explícita com os cedros. “Embora” torna claro o valor concessivo da descrição no fluxo da afirmação, sem alterar seu conteúdo.
- source_word: וְחָסֹן הוּא כָּאַלּוֹנִים
  choice: e forte como os carvalhos
  rationale: חָסֹן indica vigor ou robustez; “forte” é natural. “Carvalhos” é a identificação tradicional e acessível de אַלּוֹנִים neste contexto.
- source_word: וָאַשְׁמִיד
  choice: Destruí
  rationale: A repetição do mesmo verbo conserva a força retórica e vincula a derrota do povo à imagem da árvore inteiramente destruída.
- source_word: פִּרְיוֹ מִמַּעַל
  choice: seu fruto no alto
  rationale: Preserva a metáfora arbórea sem interpretá-la no corpo do texto como descendência ou resultado.
- source_word: וְשָׁרָשָׁיו מִתָּחַת
  choice: e suas raízes embaixo
  rationale: Completa a imagem de destruição total, dos extremos superiores aos inferiores, em português atual e facilmente compreensível.
theological_decisions:
- issue: Singular coletivo aplicado ao amorreu
  choice: Manter “o amorreu”, “ele”, “seu” e “suas” no singular.
  alternative: Pluralizar como “os amorreus”, “eles” e “seus”.
  rationale: O hebraico emprega deliberadamente o singular coletivo e apresenta o povo como uma grande árvore individual; preservar esse recurso mantém a personificação e a unidade da metáfora.
- issue: Força lógica da descrição da altura e da robustez
  choice: Usar a ligação concessiva “embora”.
  alternative: 'Manter apenas uma relativa coordenada: “cuja altura era... e ele era forte...”.'
  rationale: No contexto, a grandeza do amorreu realça que ela não impediu sua destruição por Deus. A formulação explicita essa relação discursiva sem resolver qualquer controvérsia doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O singular coletivo e a metáfora arbórea foram preservados; evitou-se o literalismo pouco natural de repetir “altura” e preferiu-se “no alto... embaixo” para conservar o contraste espacial em linguagem corrente.
