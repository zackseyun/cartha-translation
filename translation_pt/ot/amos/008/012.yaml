id: AMO.8.12
reference: Amos 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָעוּ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/צָּפ֖וֹן וְ/עַד מִזְרָ֑ח יְשֽׁוֹטְט֛וּ לְ/בַקֵּ֥שׁ אֶת דְּבַר יְהוָ֖ה וְ/לֹ֥א יִמְצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/012.yaml
  text: They will wander from sea to sea[a], and from north to east; they will roam about seeking the word of Yahweh[b], but they will not find it.
translation:
  language: pt
  text: Eles vaguearão de mar a mar e do norte até o leste; andarão de um lado para outro[a] em busca da palavra de Yahweh[b], mas não a encontrarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correrão de um lado para outro”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a palavra de Yahweh”; isto é, uma mensagem ou revelação divina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: Eles vaguearão
  rationale: O verbo נוּעַ pode indicar vaguear, cambalear ou andar errante. Neste contexto de uma busca extensa e frustrada, “vaguearão” preserva o movimento inquieto sem introduzir necessariamente a imagem de embriaguez.
- source_word: מִיָּם עַד יָם
  choice: de mar a mar
  rationale: Tradução direta da expressão geográfica hebraica, preservando sua amplitude sem especificar mares que o texto não identifica.
- source_word: וּמִצָּפוֹן וְעַד מִזְרָח
  choice: e do norte até o leste
  rationale: מִזְרָח designa o leste, literalmente a direção do nascer do sol. A formulação mantém a sequência direcional incomum do hebraico.
- source_word: יְשׁוֹטְטוּ
  choice: andarão de um lado para outro
  rationale: O verbo expressa movimento repetido e inquieto em várias direções. A expressão é natural em português e comunica a busca insistente; a alternativa mais intensa é registrada em nota.
- source_word: לְבַקֵּשׁ
  choice: em busca de
  rationale: Expressa naturalmente em português a finalidade indicada pelo infinitivo hebraico.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” preserva a formulação profética tradicional e a amplitude semântica de דָּבָר, que aqui se refere a uma mensagem ou revelação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְלֹא יִמְצָאוּ
  choice: mas não a encontrarão
  rationale: 'O pronome retoma naturalmente “a palavra de Yahweh”. “Mas” torna explícito o contraste contextual da conjunção hebraica: apesar da busca, não haverá êxito.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título, sem acrescentar uma interpretação denominacional.
- issue: Sentido de דְּבַר יְהוָה no contexto profético
  choice: a palavra de Yahweh
  alternative: a mensagem de Yahweh
  rationale: “Palavra” mantém a expressão hebraica e sua tensão teológica, enquanto a nota esclarece que se trata de mensagem ou revelação divina, sem reduzir o termo a apenas uma dessas possibilidades.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A construção “de mar a mar” conserva a imagem geográfica hebraica, e “do norte até o leste” mantém a direção incomum do original sem harmonizá-la.
