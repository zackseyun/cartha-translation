review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a reversão das celebrações em luto, os sinais públicos de pesar e a comparação final. Contudo, “Farei disso um luto como por...” enfraquece a estrutura comparativa de וְשַׂמְתִּיהָ כְּאֵבֶל (“farei que isso seja como o luto”), e “deixarei calva” pode sugerir apenas um estado permitido, não a ação causativa expressa no hebraico.
  naturalness: O português é claro, moderno e de registro profético apropriado. “Farei com que isso seja como o luto por um filho único” é mais idiomático e reproduz melhor a comparação. “Farei com que toda cabeça fique calva” explicita naturalmente a ação sem introduzir o meio específico de raspar.
  terminology: “Festas”, “luto”, “cânticos”, “lamentação” e “pano de saco” são escolhas adequadas. “Filho único” comunica com naturalidade o valor contextual de יָחִיד, enquanto a nota preserva a formulação hebraica mais aberta. As notas permanecem bem ancoradas.
  issues:
  - severity: medium
    issue: A formulação “Farei disso um luto como por um filho único” altera levemente a construção comparativa.
    rationale: O hebraico diz literalmente que o referente feminino será feito “como o luto por um único”. A redação proposta pode ser entendida como transformar algo em um luto, em vez de compará-lo ao luto extremo evocado pela expressão.
  - severity: low
    issue: “Deixarei calva toda cabeça” pode atenuar a ação divina.
    rationale: O verbo hebraico apresenta Deus como agente que traz esses sinais de luto. “Farei com que toda cabeça fique calva” preserva essa causação sem especificar indevidamente que as cabeças serão raspadas.
