  text: וְ/הָפַכְתִּ֨י חַגֵּי/כֶ֜ם לְ/אֵ֗בֶל וְ/כָל שִֽׁירֵי/כֶם֙ לְ/קִינָ֔ה וְ/הַעֲלֵיתִ֤י עַל כָּל מָתְנַ֨יִם֙ שָׂ֔ק וְ/עַל כָּל רֹ֖אשׁ קָרְחָ֑ה וְ/שַׂמְתִּ֨י/הָ֙ כְּ/אֵ֣בֶל יָחִ֔יד וְ/אַחֲרִיתָ֖/הּ כְּ/י֥וֹם מָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/010.yaml
  text: I will turn your feasts into mourning[a], and all your songs into lamentation; I will bring sackcloth on every waist and baldness on every head; I will make it like mourning for an only son[d][c][b], and its end like a bitter day.
translation:
  language: pt
  text: Transformarei as suas festas em luto[a] e todos os seus cânticos em lamentação[b]. Porei pano de saco em toda cintura e farei com que toda cabeça fique calva. Farei com que isso[c] seja como o luto por um filho único[d], e o seu fim será como um dia amargo[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festividades”.
    reason: lexical_alternative
  - marker: b
    text: Ou “canto fúnebre”.
    reason: lexical_alternative
  - marker: c
    text: O referente no hebraico não é explícito; pode ser entendido como a terra, a cidade ou toda a situação descrita.
    reason: textual_ambiguity
  - marker: d
    text: 'Hebraico: “como o luto por um único”; o sentido é geralmente entendido como o luto por um filho único.'
    reason: lexical_alternative
  - marker: e
    text: Ou “como um dia de amargura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: Transformarei
  rationale: Expressa de modo direto a mudança radical de celebração para luto indicada por הָפַךְ.
- source_word: חַגֵּיכֶם
  choice: as suas festas
  rationale: חַגִּים são celebrações festivas, frequentemente religiosas; “festas” é claro e natural, enquanto a nota registra “festividades”.
- source_word: לְאֵבֶל
  choice: em luto
  rationale: אֵבֶל designa sobretudo o luto ligado à morte e preserva tanto a dimensão emocional quanto os sinais públicos de pesar.
- source_word: שִׁירֵיכֶם
  choice: os seus cânticos
  rationale: “Cânticos” conserva o caráter coletivo e possivelmente cultual dos שִׁירִים sem restringi-los apenas ao culto.
- source_word: לְקִינָה
  choice: em lamentação
  rationale: קִינָה é uma lamentação formal, muitas vezes de caráter fúnebre; a escolha mantém o tom elevado da profecia.
- source_word: וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק
  choice: Porei pano de saco em toda cintura
  rationale: A formulação portuguesa comunica a ação divina e mantém a imagem concreta do pano de saco usado na cintura como sinal de luto.
- source_word: וְעַל כָּל רֹאשׁ קָרְחָה
  choice: e deixarei calva toda cabeça
  rationale: Preserva a imagem enfática de calvície ou cabeça raspada como sinal público de luto, com sintaxe natural em português.
- source_word: וְשַׂמְתִּיהָ
  choice: Farei disso
  rationale: “Disso” aponta para a situação descrita sem identificar de maneira indevida o referente feminino implícito como terra, cidade ou festa.
- source_word: כְּאֵבֶל יָחִיד
  choice: um luto como por um filho único
  rationale: יָחִיד significa literalmente “único”; neste contexto, a expressão evoca a dor extrema pela morte de um filho único.
- source_word: וְאַחֲרִיתָהּ
  choice: o seu fim
  rationale: Mantém o sentido temporal ou resultativo de אַחֲרִית e também a referência pronominal não especificada do hebraico.
- source_word: כְּיוֹם מָר
  choice: como um dia amargo
  rationale: Reproduz com concisão a metáfora hebraica de um dia marcado por amargura e sofrimento.
theological_decisions:
- issue: Referente dos sufixos femininos em וְשַׂמְתִּיהָ e וְאַחֲרִיתָהּ
  choice: “disso” e “o seu fim”, referindo-se de maneira ampla à situação de luto e juízo anunciada
  alternative: “dela”, entendido especificamente como referência à terra, à cidade ou à festa
  rationale: O hebraico não explicita o antecedente. A tradução mantém a referência aberta e evita impor uma identificação teológica ou literária mais específica que o texto.
- issue: Sentido de יָחִיד na comparação do luto
  choice: “filho único”, com nota sobre a forma literal
  alternative: “único” ou “filho unigênito”
  rationale: No contexto de luto, “filho único” comunica naturalmente a perda extrema evocada pela expressão, sem empregar “unigênito”, termo carregado de associações teológicas alheias ao contexto imediato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo profético e as imagens concretas de luto, evitando arcaísmos como “lombos” e sem eliminar a ambiguidade dos sufixos hebraicos.
