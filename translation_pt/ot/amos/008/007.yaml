source:
  edition: WLC
  text: נִשְׁבַּ֥ע יְהוָ֖ה בִּ/גְא֣וֹן יַעֲקֹ֑ב אִם אֶשְׁכַּ֥ח לָ/נֶ֖צַח כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/007.yaml
  text: 'Yahweh has sworn by the pride of Jacob: Surely I will never forget any of their deeds[a][b].'
translation:
  language: pt
  text: 'Yahweh jurou pelo orgulho de Jacó[a]: “Certamente, jamais me esquecerei de nenhum de seus atos.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela glória de Jacó” ou “pela excelência de Jacó”. A expressão hebraica pode referir-se ironicamente àquilo de que Jacó se orgulha ou, talvez, a Deus como a verdadeira glória de Jacó.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “se eu me esquecer para sempre de qualquer um dos atos deles” — fórmula de juramento que significa: “certamente, jamais me esquecerei de nenhum de seus atos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O nifal de שׁבע é a expressão comum para prestar juramento. O pretérito perfeito comunica em português a solenidade e o caráter consumado da declaração profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בִּגְאוֹן
  choice: pelo orgulho de
  rationale: גָּאוֹן pode significar orgulho, glória, excelência ou majestade. “Orgulho” é lexicalmente direto e mantém aberta a possível ironia, sem excluir outros sentidos.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Preserva o nome próprio e sua função profética e pactual como designação da nação.
- source_word: אִם
  choice: Certamente, jamais
  rationale: Depois da fórmula de juramento, אִם introduz uma condição autoimprecatória elíptica. A formulação positiva em português expressa sua força enfática, enquanto a nota conserva a forma literal.
- source_word: אֶשְׁכַּח
  choice: me esquecerei
  rationale: A primeira pessoa do singular tem Yahweh como sujeito e, no contexto do juramento, é expressa naturalmente pelo futuro do presente em português.
- source_word: לָנֶצַח
  choice: jamais
  rationale: Embora signifique literalmente “para sempre”, junto ao verbo esquecer a construção idiomática equivalente é “jamais me esquecerei”.
- source_word: כָּל
  choice: nenhum
  rationale: Sob negação semântica, “nenhum dos atos” transmite naturalmente o valor distributivo de כָּל.
- source_word: מַעֲשֵׂיהֶם
  choice: atos deles
  rationale: מַעֲשֶׂה designa ato, ação ou obra. “Atos” é claro no contexto de julgamento e evita possível carga teológica indevida de “obras”.
theological_decisions:
- issue: Sentido de “o orgulho de Jacó” na fórmula de juramento
  choice: Manter “o orgulho de Jacó” sem expansão interpretativa.
  alternative: “a Glória de Jacó” como título de Deus, ou “a excelência/majestade de Jacó” como referência à condição, ao esplendor ou à terra de Israel.
  rationale: A expressão hebraica é ambígua e talvez deliberadamente polivalente. A tradução conserva a tensão entre uma referência irônica àquilo de que Israel se orgulha e uma possível referência a Deus como a verdadeira glória de Jacó.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. As aspas marcam a fala divina introduzida pela fórmula de juramento. “Jacó” é mantido como nome pactual da nação, e a ambiguidade de גאון é preservada no texto e explicitada em nota.
