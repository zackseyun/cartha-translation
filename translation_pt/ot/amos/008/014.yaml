  text: הַ/נִּשְׁבָּעִים֙ בְּ/אַשְׁמַ֣ת שֹֽׁמְר֔וֹן וְ/אָמְר֗וּ חֵ֤י אֱלֹהֶ֨י/ךָ֙ דָּ֔ן וְ/חֵ֖י דֶּ֣רֶךְ בְּאֵֽר שָׁ֑בַע וְ/נָפְל֖וּ וְ/לֹא יָק֥וּמוּ עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/014.yaml
  text: Those who swear by the guilt of Samaria and say[a], ‘As your god, Dan, lives,’ and[c][b], ‘As the way of Beer-sheba lives,’ will fall and never rise again.
translation:
  language: pt
  text: 'Os que juram pela culpa de Samaria[a] e dizem: “Tão certo como vive o teu deus, ó Dã”[b], e: “Tão certo como vive o caminho de Berseba”[c], cairão e nunca mais se levantarão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo pecado de Samaria”; alguns entendem a expressão como referência a um ídolo ou a uma divindade associada a Samaria.
    reason: lexical_alternative
  - marker: b
    text: 'A construção hebraica também pode ser entendida como: “Tão certo como vive o teu deus de Dã”.'
    reason: alternative_reading
  - marker: c
    text: “O caminho de Berseba” pode referir-se à rota de peregrinação para Berseba ou à prática cultual associada à cidade.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנִּשְׁבָּעִים
  choice: Os que juram
  rationale: O particípio substantivado identifica o grupo sujeito ao juízo; a oração relativa é natural e clara em português.
- source_word: בְּאַשְׁמַת שֹׁמְרוֹן
  choice: pela culpa de Samaria
  rationale: אַשְׁמָה normalmente indica culpa; no contexto, pode designar metonimicamente o culto culpável de Samaria sem especificar além do hebraico.
- source_word: חֵי
  choice: Tão certo como vive
  rationale: Expressa em português corrente e solene a fórmula hebraica de juramento pela vida de alguém ou de algo cultualmente invocado.
- source_word: אֱלֹהֶיךָ דָּן
  choice: o seu deus, ó Dã
  rationale: 'A terminação de segunda pessoa em אֱלֹהֶיךָ favorece entender Dã como vocativo: literalmente, ''o teu deus, Dã''. A formulação preserva essa sintaxe sem convertê-la silenciosamente em ''deus de Dã''.'
- source_word: דֶּרֶךְ בְּאֵר שָׁבַע
  choice: o caminho de Berseba
  rationale: Mantém o sentido literal de דֶּרֶךְ e preserva a ambiguidade entre rota de peregrinação e prática cultual associada a Berseba.
- source_word: וְנָפְלוּ
  choice: cairão
  rationale: O futuro comunica naturalmente o anúncio profético de juízo.
- source_word: וְלֹא יָקוּמוּ עוֹד
  choice: e nunca mais se levantarão
  rationale: Reproduz com naturalidade a finalidade enfática de לֹא ... עוֹד.
theological_decisions:
- issue: Natureza da “culpa de Samaria”
  choice: Referência metonímica ao culto culpável ou idólatra de Samaria, traduzida literalmente como “culpa de Samaria”
  alternative: “pecado de Samaria” ou um possível nome divino, “Ashimá de Samaria”
  rationale: A tradução mantém o sentido lexical comum e não identifica de modo indevido o referente como uma divindade específica.
- issue: Sintaxe de אֱלֹהֶיךָ דָּן
  choice: 'Entender Dã como vocativo: “o seu deus, ó Dã”'
  alternative: “o seu deus de Dã” ou “o seu deus, Dã”
  rationale: O sufixo masculino singular de segunda pessoa em “seu/teu deus” pode dirigir a declaração à cidade de Dã. Como a construção é comprimida e discutida, a nota registra a leitura locativa tradicional.
- issue: Sentido do “caminho de Berseba”
  choice: Conservar a expressão literal no texto principal
  alternative: A peregrinação a Berseba ou a prática cultual de Berseba
  rationale: O hebraico é ambíguo; manter “caminho” evita resolver silenciosamente a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras reconhecíveis. “Berseba” segue a grafia bíblica tradicional em português. A fórmula “Tão certo como vive” preserva o caráter solene do juramento sem soar arcaica. Todos os marcadores aparecem no texto na ordem correspondente.
