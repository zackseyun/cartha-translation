  text: הִנֵּ֣ה יָמִ֣ים בָּאִ֗ים נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִשְׁלַחְתִּ֥י רָעָ֖ב בָּ/אָ֑רֶץ לֹֽא רָעָ֤ב לַ/לֶּ֨חֶם֙ וְ/לֹֽא צָמָ֣א לַ/מַּ֔יִם כִּ֣י אִם לִ/שְׁמֹ֔עַ אֵ֖ת דִּבְרֵ֥י יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/011.yaml
  text: Behold[a], days are coming, declares the Lord GOD, when I will send a famine on the land—not a famine for bread, nor a thirst for water, but for hearing the words of Yahweh.
translation:
  language: pt
  text: “Eis que vêm dias”, declara o Senhor Yahweh, “em que enviarei fome sobre a terra — não fome de pão nem sede de água, mas de ouvir[a] as palavras de Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas para ouvir as palavras de Yahweh”. O infinitivo hebraico admite essa formulação mais direta; “de ouvir” preserva melhor o paralelo com “de pão” e “de água”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força solene e convocatória da fórmula profética em português corrente e digno.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de perto a expressão profética hebraica e conserva sua indefinição, sem acrescentar artigo ausente no texto.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Traduz נְאֻם como fórmula de declaração profética e distingue o título אֲדֹנָי do nome divino יְהוָה.
- source_word: וְהִשְׁלַחְתִּי
  choice: em que enviarei
  rationale: Liga naturalmente os dias vindouros à ação divina anunciada, preservando a agência na primeira pessoa.
- source_word: רָעָב
  choice: fome
  rationale: No contexto, designa escassez coletiva ou fome generalizada, não apenas a sensação individual de fome; em português, a forma sem artigo funciona naturalmente na construção.
- source_word: בָּאָרֶץ
  choice: sobre a terra
  rationale: Preserva a possível referência à terra ou região submetida ao juízo, sem ampliar obrigatoriamente o sentido para o mundo inteiro.
- source_word: לֹא רָעָב לַלֶּחֶם
  choice: não fome de pão
  rationale: Conserva a imagem concreta do pão e a estrutura paralela do hebraico.
- source_word: וְלֹא צָמָא לַמַּיִם
  choice: nem sede de água
  rationale: Mantém o paralelismo negativo e a formulação natural em português.
- source_word: כִּי אִם
  choice: mas
  rationale: Expressa com clareza o contraste entre a privação literal negada e a privação efetivamente anunciada.
- source_word: לִשְׁמֹעַ
  choice: de ouvir
  rationale: O infinitivo define o objeto da fome metafórica; a construção preserva o paralelo com “de pão” e “de água” sem explicar além do texto.
- source_word: דִּבְרֵי יְהוָה
  choice: as palavras de Yahweh
  rationale: Mantém o plural דִּבְרֵי e verte diretamente o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino no texto; em אֲדֹנָי יְהוִה, “Senhor Yahweh” também evita a duplicação “Senhor SENHOR”.
- issue: Natureza da fome anunciada
  choice: privação metafórica ligada a ouvir as palavras de Yahweh
  alternative: fome literal acompanhada de privação espiritual
  rationale: O próprio versículo nega explicitamente fome de pão e sede de água e identifica o objeto da fome como ouvir as palavras divinas; a tradução mantém essa formulação sem desenvolver uma interpretação doutrinária.
- issue: Alcance de אֶרֶץ
  choice: terra, com referência geográfica deixada aberta pelo contexto
  alternative: mundo inteiro
  rationale: O termo pode significar terra, território ou país. A tradução não universaliza o juízo além do que o versículo afirma.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. As aspas delimitam a fala divina, e os travessões destacam o contraste explicativo sem alterar a estrutura do anúncio profético.
