id: AMO.8.1
reference: Amos 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֥ה הִרְאַ֖/נִי אֲדֹנָ֣/י יְהוִ֑ה וְ/הִנֵּ֖ה כְּל֥וּב קָֽיִץ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], a basket of summer fruit.'
translation:
  language: pt
  text: 'Foi isto que o Senhor Yahweh me mostrou: eis um cesto de frutas de verão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um cesto de frutas maduras”. O hebraico diz literalmente “frutas de verão”, expressão que prepara um jogo sonoro com “fim” no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Foi isto que
  rationale: Introduz o relato da visão de modo natural em português, preservando a força demonstrativa do hebraico.
- source_word: הִרְאַנִי
  choice: me mostrou
  rationale: O hifil de ראה significa “fazer ver” ou “mostrar”; nesta fórmula profética, “me mostrou” é claro e idiomático.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי, “Senhor”, como o nome divino יהוה, transliterado “Yahweh”, sem produzir a repetição “Senhor SENHOR”.
- source_word: וְהִנֵּה
  choice: eis
  rationale: Mantém a apresentação súbita e vívida do objeto visto, além do tom profético, sem exigir um “e” redundante depois dos dois-pontos.
- source_word: כְּלוּב
  choice: cesto
  rationale: Embora o termo também possa designar uma gaiola, o conteúdo mencionado no contexto indica um recipiente para frutas.
- source_word: קָיִץ
  choice: frutas de verão
  rationale: Traduz literalmente a produção colhida no verão e conserva a base semântica do jogo sonoro com קֵץ, “fim”, no versículo seguinte; “frutas maduras” é uma alternativa contextual.
theological_decisions:
- issue: Tradução do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução mantém o título “Senhor” e representa explicitamente o nome da aliança, Yahweh, em vez de substituí-lo por outro título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis” foi mantido por sua concisão e por preservar a vivacidade da fórmula visionária; a construção geral evita arcaísmo excessivo.
