  text: וַ/יֹּ֗אמֶר מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר כְּל֣וּב קָ֑יִץ וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בָּ֤א הַ/קֵּץ֙ אֶל עַמִּ֣/י יִשְׂרָאֵ֔ל לֹא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/002.yaml
  text: And he said[a], “What do you see, Amos?” And I said, “A basket of summer fruit.” Then Yahweh said to me, “The end has come upon my people Israel[b]; I will not again pass by them.”
translation:
  language: pt
  text: 'E ele disse: “O que você vê, Amós?” Eu disse: “Um cesto de frutas de verão[a].” Então Yahweh me disse: “Chegou o fim sobre o meu povo Israel; não voltarei a passar por ele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “frutas de verão” (qáyits) soa de modo semelhante a “o fim” (qets), formando um jogo de palavras que liga a visão ao anúncio do julgamento.
    reason: cultural_note
  - marker: b
    text: 'Ou: “não voltarei a poupá-lo” ou “não voltarei a passar por ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém o encadeamento narrativo do wayyiqtol hebraico sem acrescentar uma relação temporal mais específica.
- source_word: מָה אַתָּה רֹאֶה
  choice: O que você vê
  rationale: Forma direta e natural em português para a pergunta com o particípio רֹאֶה, preservando a imediação da visão.
- source_word: עָמוֹס
  choice: Amós
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: כְּלוּב קָיִץ
  choice: um cesto de frutas de verão
  rationale: כְּלוּב designa um recipiente semelhante a cesto, e קָיִץ se refere a frutas do verão. A formulação conserva o sentido lexical necessário para explicar o jogo sonoro com קֵץ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בָּא הַקֵּץ
  choice: Chegou o fim
  rationale: 'O perfeito בָּא apresenta a chegada como realizada na proclamação profética, e הַקֵּץ é definido: “o fim”.'
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: para o meu povo Israel
  rationale: Com a ideia de chegada expressa por בָּא, “para” comunica naturalmente que o fim alcançou Israel, sem tornar a preposição explicitamente hostil.
- source_word: לֹא אוֹסִיף עוֹד
  choice: não voltarei a
  rationale: Expressa de modo idiomático em português a cessação definitiva de uma ação repetida.
- source_word: עֲבוֹר לוֹ
  choice: passar por ele
  rationale: Preserva a metáfora do verbo עבר e a referência coletiva ao povo no singular, deixando em nota os sentidos contextuais mais explícitos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido judicial de עֲבוֹר לוֹ
  choice: não voltarei a passar por ele
  alternative: não voltarei a poupá-lo; não voltarei a deixar sua culpa passar
  rationale: A expressão provavelmente anuncia o fim da tolerância divina, mas a redação principal conserva a imagem hebraica e sua tensão; a nota apresenta o sentido contextual possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe narrativa permanece próxima do hebraico, enquanto o diálogo soa natural. O jogo de palavras intraduzível e a ambiguidade judicial da frase final são preservados por notas.
