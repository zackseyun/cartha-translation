revisions:
- from: 'E ele disse: “O que você vê, Amós?” Eu respondi: “Um cesto de frutas de verão[a].” Então Yahweh me disse: “Chegou o fim para o meu povo Israel; não voltarei a passar por ele[b].”'
  to: 'E ele disse: “O que você vê, Amós?” Eu disse: “Um cesto de frutas de verão[a].” Então Yahweh me disse: “Chegou o fim sobre o meu povo Israel; não voltarei a passar por ele[b].”'
  rationale: A revisão torna explícita em português a força contextual de «sobre» para אֶל, conserva o paralelismo narrativo de «eu disse» e corrige a nota lexical para que ela apresente alternativas sustentadas pelo hebraico, sem acrescentar «culpa». O texto principal preserva a ambiguidade metafórica de עֲבוֹר לוֹ.
