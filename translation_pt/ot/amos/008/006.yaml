  text: לִ/קְנ֤וֹת בַּ/כֶּ֨סֶף֙ דַּלִּ֔ים וְ/אֶבְי֖וֹן בַּ/עֲב֣וּר נַעֲלָ֑יִם וּ/מַפַּ֥ל בַּ֖ר נַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/006.yaml
  text: to buy the poor for silver[a], and the needy for a pair of sandals, and sell the sweepings of the grain.
translation:
  language: pt
  text: para comprarmos os pobres por prata e o necessitado por um par de sandálias, e vendermos o refugo do cereal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as sobras do cereal” ou “os grãos caídos”; o hebraico provavelmente se refere a restos de cereal de qualidade inferior vendidos como mercadoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְנוֹת
  choice: para comprarmos
  rationale: O infinitivo construto expressa a finalidade dos comerciantes e dá continuidade à intenção declarada no versículo anterior. “Comprarmos” mantém o sentido econômico e a provável alusão à servidão por dívida.
- source_word: בַּכֶּסֶף
  choice: por prata
  rationale: A preposição indica o preço pago. “Prata” conserva o termo concreto do hebraico e o tom profético.
- source_word: דַּלִּים
  choice: os pobres
  rationale: Neste contexto de exploração econômica, דַּלִּים designa pessoas pobres e socialmente vulneráveis.
- source_word: וְאֶבְיוֹן
  choice: e o necessitado
  rationale: O singular hebraico foi preservado. “Necessitado” mantém a distinção lexical em relação a “pobres” sem eliminar o paralelismo.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: por um par de sandálias
  rationale: A expressão apresenta o preço irrisório pelo qual o necessitado é explorado. O dual נַעֲלָיִם é expresso naturalmente como “um par de sandálias”.
- source_word: וּמַפַּל בַּר
  choice: até as sobras do cereal
  rationale: מַפַּל indica aquilo que cai ou resta, e בַּר significa cereal ou grão. “Sobras do cereal” comunica a qualidade inferior da mercadoria; “até” torna explícito em português o caráter extremo da prática denunciada.
- source_word: נַשְׁבִּיר
  choice: e vendermos
  rationale: O hifil de שׁבר tem sentido comercial de vender cereal. A forma coordenada com “comprarmos” produz uma frase natural em português e conserva a sequência das intenções dos comerciantes.
theological_decisions:
- issue: Natureza da compra dos pobres e necessitados
  choice: Manter a linguagem econômica concreta, sem explicitar “escravizar” no texto
  alternative: Traduzir como “comprarmos como escravos”
  rationale: O contexto provavelmente envolve servidão por dívida, mas o hebraico diz literalmente “comprar”. A formulação preserva a força e também a amplitude da denúncia sem resolver além do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A estrutura “para comprarmos... e vendermos” liga o versículo à fala iniciada no contexto anterior. O marcador da nota foi colocado junto à expressão lexicalmente ambígua a que de fato se refere.
