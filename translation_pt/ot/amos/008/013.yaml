  yaml_path: translation/ot/amos/008/013.yaml
  text: In that day the beautiful virgins and the young men will faint from thirst[a].
translation:
  language: pt
  text: Naquele dia, as belas virgens e os rapazes desmaiarão de sede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desfalecerão de sede”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética e a ênfase demonstrativa do hebraico em português natural.
- source_word: תִּתְעַלַּפְנָה
  choice: desmaiarão
  rationale: O hitpael de עלף indica ficar sem forças ou perder os sentidos; “desmaiarão” é claro, conciso e adequado ao contexto.
- source_word: הַבְּתוּלֹת
  choice: as virgens
  rationale: Mantém a especificidade lexical de בְּתוּלָה, em vez de generalizar como “jovens” ou “moças”.
- source_word: הַיָּפוֹת
  choice: belas
  rationale: Expressa diretamente a qualidade atribuída às virgens, em linguagem atual e dignificada.
- source_word: וְהַבַּחוּרִים
  choice: e os jovens
  rationale: בָּחוּר designa normalmente homens jovens no vigor da idade; no paralelismo, “os jovens” é natural e não exige acrescentar “homens”.
- source_word: בַּצָּמָא
  choice: de sede
  rationale: A preposição indica a causa do desmaio; “de sede” é a formulação idiomática em português.
