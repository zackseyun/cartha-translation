  - severity: medium
    issue: “Abrirmos a venda do trigo” é expressão pouco natural.
    rationale: O hebraico descreve abrir o cereal/estoque para venda. “Pormos o trigo à venda” transmite o sentido comercial sem introduzir detalhes desnecessários.
  - severity: low
