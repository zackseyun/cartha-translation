base_translation:
  language: en
  yaml_path: translation/ot/amos/008/005.yaml
  text: saying[a], “When will the new moon be over, so that we may sell grain, and the Sabbath, so that we may offer wheat for sale—making the ephah small and the shekel large[b], and distorting deceitful scales?”
translation:
  language: pt
  text: 'dizendo[a]: “Quando passará a lua nova, para vendermos cereal, e o sábado, para pormos o trigo à venda — diminuindo a efa, aumentando o siclo[b] e distorcendo balanças fraudulentas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mês”, em vez de “a lua nova”; neste contexto, é mais provável que se trate da celebração da lua nova, não apenas do mês civil.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “diminuir a efa e aumentar o siclo”, isto é, entregar menos produto e exigir mais pagamento.'
    reason: cultural_note
lexical_decisions:
- source_word: הַחֹדֶשׁ
  choice: a lua nova
  rationale: Neste contexto comercial e religioso, o termo se refere à celebração da lua nova, cuja conclusão os comerciantes aguardam para retomar as vendas, e não meramente ao mês civil.
- source_word: וְנַשְׁבִּירָה שֶּׁבֶר
  choice: para vendermos cereal
  rationale: O hifil de שׁבר pode indicar a venda de mantimentos ou cereais; a formulação é clara e natural em português.
- source_word: וְהַשַּׁבָּת
  choice: o sábado
  rationale: Designa o dia sagrado semanal, cuja interrupção do comércio é ressentida pelos negociantes denunciados pelo profeta.
- source_word: וְנִפְתְּחָה בָּר
  choice: para abrirmos a venda do trigo
  rationale: פתח com בָּר expressa a abertura dos estoques ou sacos para a venda. A formulação comunica o sentido comercial e mantém alguma distinção em relação à oração anterior.
- source_word: בָּר
  choice: trigo
  rationale: O termo denota cereal limpo e pode referir-se concretamente ao trigo neste contexto de mercado.
- source_word: לְהַקְטִין אֵיפָה
  choice: diminuiremos a efa
  rationale: 'Preserva a antiga unidade de medida e a imagem concreta da fraude: reduzir a quantidade entregue.'
- source_word: וּלְהַגְדִּיל שֶׁקֶל
  choice: aumentaremos o siclo
  rationale: Mantém o paralelismo com a efa e representa a manipulação do peso ou padrão de pagamento para cobrar mais.
- source_word: וּלְעַוֵּת מֹאזְנֵי מִרְמָה
  choice: distorceremos balanças fraudulentas
  rationale: “Distorcer” conserva a imagem física de entortar ou perverter, enquanto “fraudulentas” exprime o caráter enganoso das balanças.
theological_decisions:
- issue: Representação dos tempos sagrados na denúncia da ganância econômica
  choice: 'Traduzir חֹדֶשׁ e שַׁבָּת como observâncias religiosas reconhecíveis: “lua nova” e “sábado”.'
  alternative: Entender חֹדֶשׁ apenas como “mês”, em sentido calendárico.
  rationale: A crítica profética recai sobre pessoas que consideram os tempos sagrados um obstáculo ao lucro. A tradução preserva essa dimensão cultual sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se “efa” e “siclo” no texto para preservar a concretude histórica e o paralelismo, com explicação em nota. As perguntas reproduzem a impaciência dos comerciantes; as formas verbais seguintes explicitam suas intenções fraudulentas.
