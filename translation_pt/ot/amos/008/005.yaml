revisions:
- from: 'dizendo[a]: “Quando passará a lua nova, para vendermos cereal? E o sábado, para abrirmos a venda do trigo? Diminuiremos a efa, aumentaremos o siclo[b] e distorceremos balanças fraudulentas.”'
  to: 'dizendo[a]: “Quando passará a lua nova, para vendermos cereal, e o sábado, para pormos o trigo à venda — diminuindo a efa, aumentando o siclo[b] e distorcendo balanças fraudulentas?”'
  rationale: A revisão conserva as escolhas lexicais e o sentido cultual do rascunho, mas restabelece a estrutura de uma só pergunta para os dois tempos sagrados. Substitui-se a expressão pouco idiomática “abrirmos a venda do trigo” por “pormos o trigo à venda” e vinculam-se as práticas de fraude à intenção comercial por meio de gerúndios.
