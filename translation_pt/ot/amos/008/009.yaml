  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הֵבֵאתִ֥י הַ/שֶּׁ֖מֶשׁ בַּֽ/צָּהֳרָ֑יִם וְ/הַחֲשַׁכְתִּ֥י לָ/אָ֖רֶץ בְּ/י֥וֹם אֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/009.yaml
  text: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
translation:
  language: pt
  text: 'Naquele dia acontecerá isto — declara o Senhor Yahweh: farei o sol se pôr ao meio-dia e escurecerei a terra[a] em plena luz do dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a região». O hebraico אֶרֶץ pode referir-se tanto à terra em sentido amplo quanto a uma terra ou região específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: acontecerá
  rationale: Expressa de modo natural a fórmula hebraica que introduz um acontecimento profético futuro, sem recorrer ao arcaísmo «sucederá».
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Preserva a expressão temporal profética tradicional e seu alcance deliberadamente não especificado.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: «Declara» comunica a fórmula profética נְאֻם; «Senhor Yahweh» distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição artificial «Senhor SENHOR».
- source_word: וְהֵבֵאתִי הַשֶּׁמֶשׁ
  choice: farei o sol se pôr
  rationale: O hifil de בוא com «sol» indica que Deus fará o sol baixar ou se pôr; a formulação é idiomática e mantém explícita a ação divina.
- source_word: בַּצָּהֳרָיִם
  choice: ao meio-dia
  rationale: Tradução direta e corrente do substantivo que designa o meio do dia.
- source_word: וְהַחֲשַׁכְתִּי
  choice: escurecerei
  rationale: 'Reproduz de forma concisa o sentido causativo do hifil: fazer ficar escuro.'
- source_word: לָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma região específica. A imagem cósmica favorece «a terra», mantendo-se a alternativa em nota.
- source_word: בְּיוֹם אוֹר
  choice: em plena luz do dia
  rationale: Comunica naturalmente a ênfase do hebraico, literalmente «num dia de luz», ressaltando a inversão extraordinária entre luz e escuridão.
theological_decisions:
- issue: Tradução do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva separadamente o título אֲדֹנָי («Senhor») e o nome próprio יהוה («Yahweh»), sem substituir o nome por outro título nem produzir «Senhor Senhor».
- issue: Alcance da escuridão anunciada
  choice: a terra
  alternative: a região
  rationale: A referência ao sol ao meio-dia admite uma leitura de alcance cósmico, mas o termo hebraico também pode apontar para uma terra ou região particular; a nota preserva essa ambiguidade sem decidir seu alcance teológico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe profética fluente. Os travessões destacam a fórmula de declaração sem interromper a compreensão. «Em plena luz do dia» traduz idiomaticamente a ênfase do hebraico, e a nota mantém a ambiguidade geográfica de אֶרֶץ.
