id: AMO.8.8
reference: Amos 8:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ֤/עַל זֹאת֙ לֹֽא תִרְגַּ֣ז הָ/אָ֔רֶץ וְ/אָבַ֖ל כָּל יוֹשֵׁ֣ב בָּ֑/הּ וְ/עָלְתָ֤ה כָ/אֹר֙ כֻּלָּ֔/הּ וְ/נִגְרְשָׁ֥ה ו/נשקה כִּ/יא֥וֹר מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/008.yaml
  text: Because of this[a], will not the land tremble, and every one who dwells in it mourn? All of it will rise like the Nile[b]; it will be driven along and sink like the Nile of Egypt.
translation:
  language: pt
  text: Por causa disso, não tremerá a terra[a], e não se lamentará todo aquele que nela habita? Toda ela subirá como o Nilo[b]; será revolvida e baixará como o Nilo do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico אֶרֶץ pode significar “terra”, “território” ou “país”. Aqui, o contexto destaca o território julgado e seus habitantes, sem eliminar por completo o sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “como o Nilo... como o Nilo do Egito”. A imagem é a subida e a descida das águas do Nilo, usadas aqui para retratar um abalo avassalador.
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל זֹאת
  choice: Por causa disso
  rationale: Preserva a força causal de עַל com o demonstrativo e introduz, em português corrente, o motivo do juízo anunciado.
- source_word: תִרְגַּז
  choice: tremerá
  rationale: רגז pode expressar tremor, abalo ou agitação. Com “a terra” como sujeito, “tremerá” mantém tanto a imagem física quanto o tom de terror diante do juízo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar a terra, um território ou um país. “A terra” conserva em português boa parte dessa amplitude, embora o contexto aponte especialmente para o território julgado e seus habitantes.
- source_word: וְאָבַל
  choice: e não se lamentará
  rationale: אבל denota luto ou lamentação. A repetição de “não” deixa claro, em português, que a pergunta retórica abrange também esta oração.
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: todo aquele que nela habita
  rationale: Reproduz a força distributiva de כָּל e o sentido participial de יוֹשֵׁב em registro natural e digno.
- source_word: וְעָלְתָה כָאֹר כֻּלָּהּ
  choice: Toda ela subirá como o Nilo
  rationale: כֻּלָּהּ retoma a terra inteira. אֹר, no contexto e à luz da referência explícita ao Egito, designa o Nilo; “subirá” preserva a imagem de sua cheia.
- source_word: וְנִגְרְשָׁה
  choice: será revolvida
  rationale: O nifal de גרשׁ comunica algo impelido ou agitado. “Será revolvida” mantém a violência do movimento no quadro da cheia sem transformar a imagem em expulsão literal.
- source_word: וְנשקה
  choice: e baixará
  rationale: A forma textual representa o verbo entendido no contexto como afundar ou baixar. “Baixará” contrasta naturalmente com “subirá” e expressa o recuo das águas depois da cheia.
- source_word: כִּיאוֹר מִצְרָיִם
  choice: como o Nilo do Egito
  rationale: Identifica diretamente o rio cuja subida e descida fornecem a comparação, seguindo de perto a construção hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom solene da pergunta retórica, repete “não” para evitar ambiguidade sintática em português e conserva a personificação da terra. Os marcadores [a] e [b] aparecem no texto principal.
