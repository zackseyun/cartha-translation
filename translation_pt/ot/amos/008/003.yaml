  text: וְ/הֵילִ֜ילוּ שִׁיר֤וֹת הֵיכָל֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה רַ֣ב הַ/פֶּ֔גֶר בְּ/כָל מָק֖וֹם הִשְׁלִ֥יךְ הָֽס־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/003.yaml
  text: And the songs of the palace will become wailing in that day[a], declares the Lord GOD. Many will be the corpses[b]; in every place they will throw them out—silence!
translation:
  language: pt
  text: Naquele dia, os cânticos do palácio[a] se transformarão em lamentos — declara o Senhor Yahweh. Haverá muitos cadáveres; em todo lugar serão lançados fora. Silêncio![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os cânticos do templo se transformarão em lamentos”. A palavra hebraica הֵיכָל pode significar tanto “palácio” quanto “templo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Calem-se!” / “Fiquem em silêncio!” A palavra hebraica הָס é uma ordem brusca para fazer silêncio, provavelmente expressando choque ou pavor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵילִילוּ שִׁירוֹת
  choice: os cânticos ... se transformarão em lamentos
  rationale: A forma verbal de ילל, tendo שִׁירוֹת como sujeito, apresenta os cânticos convertidos em expressão de lamento. A formulação conserva essa transformação de alegria em pranto em português natural.
- source_word: הֵיכָל
  choice: palácio
  rationale: O substantivo pode designar tanto um palácio quanto um templo. “Palácio” se ajusta ao cenário de juízo contra a vida pública e a elite do reino, enquanto “templo” permanece como alternativa legítima em nota.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão profética temporal corrente, preservada de modo idiomático e solene.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם introduz uma declaração profética; o título composto mantém אֲדֹנָי como “Senhor” e representa explicitamente o nome divino יהוה como “Yahweh”.
- source_word: רַב הַפֶּגֶר
  choice: Haverá muitos cadáveres
  rationale: A construção nominal quantitativa é expressa naturalmente em português por uma oração existencial, sem atenuar a imagem de numerosos mortos.
- source_word: בְּכָל מָקוֹם הִשְׁלִיךְ
  choice: em todo lugar serão lançados fora
  rationale: O verbo no singular pode ter força impessoal no contexto. A voz passiva evita especificar agentes não identificados e explicita que os cadáveres são o objeto subentendido.
- source_word: הָס
  choice: Silêncio!
  rationale: A interjeição é uma ordem abrupta para calar-se, apropriada ao choque e ao horror da cena.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יהוה e preserva explicitamente o nome pactual como “Yahweh”, evitando a forma redundante “Senhor SENHOR”.
- issue: Identificação de הֵיכָל como palácio ou templo
  choice: palácio no texto, com “templo” em nota
  alternative: templo no texto, com “palácio” em nota
  rationale: O hebraico admite genuinamente os dois sentidos. O contexto de juízo social favorece “palácio”, mas a possível referência ao culto não é eliminada e fica registrada na nota.
translation_notes:
  register: 'Português moderno, claro e digno, com cadência profética. “Cânticos” preserva um registro bíblico amplamente compreensível; “cadáveres” mantém a crueza do hebraico. A ordem final foi deixada isolada e abrupta. Os marcadores foram posicionados junto aos termos que explicam: [a] após a leitura de הֵיכָל e [b] após הָס.'
