  text: שִׁמְעוּ זֹ֕את הַ/שֹּׁאֲפִ֖ים אֶבְי֑וֹן וְ/לַ/שְׁבִּ֖ית ענוי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/004.yaml
  text: Hear this[a], you who trample the needy and bring the poor of the land to an end,
translation:
  language: pt
  text: 'Ouçam isto, vocês que pisoteiam[a] o necessitado e fazem desaparecer os pobres da terra:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofegam atrás do necessitado” ou “engolem o necessitado”. O particípio hebraico apresenta uma imagem vívida de opressão movida pela cobiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural de שׁמע convoca diretamente os opressores a prestar atenção e preserva o tom profético solene.
- source_word: זֹאת
  choice: isto
  rationale: 'É o objeto demonstrativo direto do imperativo: “Ouçam isto”.'
- source_word: הַשֹּׁאֲפִים
  choice: vocês que pisoteiam
  rationale: O particípio de שאף evoca opressão ávida e violenta; “pisoteiam” comunica com clareza a exploração social no contexto, enquanto as imagens lexicais alternativas são preservadas em nota.
- source_word: אֶבְיוֹן
  choice: o necessitado
  rationale: אֶבְיוֹן designa quem vive em necessidade econômica; “necessitado” também o distingue do termo seguinte.
- source_word: וְלַשְׁבִּית
  choice: e fazem desaparecer
  rationale: O infinitivo causativo de שבת expressa fazer cessar ou eliminar. “Fazem desaparecer” é natural em português e mantém o valor causativo sem restringi-lo à ideia de morte física.
- source_word: ענוי
  choice: os pobres
  rationale: No contexto de exploração econômica em Amós, o termo se refere aos socialmente pobres e oprimidos; “pobres” expressa esse sentido de modo claro.
- source_word: אָרֶץ
  choice: da terra
  rationale: Aqui אָרֶץ aponta para a terra em seu contexto social e político concreto, não para o planeta inteiro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o referente já presente no particípio hebraico. Os dois termos socioeconômicos foram diferenciados como “necessitado” e “pobres”. O versículo termina com dois-pontos porque a denúncia prossegue no versículo seguinte.
