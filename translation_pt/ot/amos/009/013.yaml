source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/נִגַּ֤שׁ חוֹרֵשׁ֙ בַּ/קֹּצֵ֔ר וְ/דֹרֵ֥ךְ עֲנָבִ֖ים בְּ/מֹשֵׁ֣ךְ הַ/זָּ֑רַע וְ/הִטִּ֤יפוּ הֶֽ/הָרִים֙ עָסִ֔יס וְ/כָל הַ/גְּבָע֖וֹת תִּתְמוֹגַֽגְנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/013.yaml
  text: Behold[a], days are coming, declares Yahweh, when the plowman will overtake the reaper, and the one who treads grapes the one who sows the seed; the mountains will drip sweet wine[c][b], and all the hills will melt.
translation:
  language: pt
  text: “Eis que vêm dias”, declara Yahweh, “em que aquele que ara alcançará o que colhe[c], e quem pisa as uvas alcançará quem semeia[a]. Os montes gotejarão vinho doce[b], e todas as colinas se derreterão.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quem puxa a semente” ou “quem faz sair a semente”; provavelmente uma expressão referente ao ato de semear.
    reason: lexical_alternative
  - marker: b
    text: Ou “vinho novo”.
    reason: lexical_alternative
  - marker: c
    text: A imagem é de tamanha abundância que o trabalho de uma estação começa antes que o da estação anterior tenha terminado.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a fórmula profética que chama a atenção, em linguagem elevada, mas ainda corrente e compreensível.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de modo natural a expressão profética que anuncia uma futura ação divina, sem acrescentar artigo ausente no hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a solenidade da fórmula profética e representa o Tetragrama pelo nome próprio Yahweh, não por um título substitutivo.
- source_word: וְנִגַּשׁ
  choice: alcançará
  rationale: No contexto de colheitas extraordinariamente abundantes, comunica que uma atividade agrícola chegará à anterior antes que ela termine, e não apenas que se aproximará dela.
- source_word: חוֹרֵשׁ
  choice: aquele que ara
  rationale: Expressão concreta, clara e atual para a pessoa que lavra a terra com o arado.
- source_word: בַּקֹּצֵר
  choice: o que colhe
  rationale: Forma natural em português que mantém o contraste agrícola com aquele que ara.
- source_word: וְדֹרֵךְ עֲנָבִים
  choice: quem pisa as uvas
  rationale: Preserva a imagem concreta do antigo processo de pisar uvas para produzir vinho.
- source_word: בְּמֹשֵׁךְ הַזָּרַע
  choice: quem semeia
  rationale: Expressa naturalmente a atividade indicada pelo idiomatismo hebraico, cuja forma literal envolve ‘puxar’ ou ‘fazer sair’ a semente; a nota registra essa particularidade.
- source_word: וְהִטִּיפוּ
  choice: gotejarão
  rationale: Mantém de perto a imagem poética dos montes que deixam o produto escorrer em gotas.
- source_word: עָסִיס
  choice: vinho doce
  rationale: Designa vinho fresco ou doce e comunica riqueza e abundância sem reduzir necessariamente o termo a simples suco.
- source_word: תִּתְמוֹגַגְנָה
  choice: se derreterão
  rationale: Preserva a metáfora forte do hebraico, que literalmente sugere derreter-se ou dissolver-se, sem explicá-la dentro do texto.
theological_decisions:
- issue: Imagens proféticas de restauração
  choice: Manter as imagens concretas e hiperbólicas de abundância agrícola na restauração de Israel.
  alternative: Interpretá-las na tradução como uma previsão agrícola estritamente literal ou como bênçãos exclusivamente espirituais.
  rationale: O hebraico apresenta poesia profética concreta. A tradução conserva suas imagens e deixa em aberto o alcance e a forma do cumprimento, sem impor um esquema escatológico ou uma espiritualização denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela “aquele que ara... o que colhe” e “quem pisa... quem semeia” conserva o ritmo agrícola. Mantiveram-se “Yahweh”, a metáfora de montes que gotejam e colinas que se derretem, evitando explicações interpretativas no corpo do versículo.
