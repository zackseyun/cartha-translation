  naturalness: O português é moderno, claro e de registro profético apropriado. «Eis que vêm dias» e «declara Yahweh» soam naturais nesse registro. As construções paralelas agrícolas são compreensíveis e preservam o andamento do versículo.
  terminology: «Yahweh» segue a opção nominal do projeto. «Vinho doce» para עָסִיס é adequado, com «vinho novo» devidamente registrado como alternativa. A nota sobre a expressão literal ligada à semente é útil e não impõe uma interpretação além da necessária.
