source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא אָקִ֛ים אֶת סֻכַּ֥ת דָּוִ֖יד הַ/נֹּפֶ֑לֶת וְ/גָדַרְתִּ֣י אֶת פִּרְצֵי/הֶ֗ן וַ/הֲרִֽסֹתָי/ו֙ אָקִ֔ים וּ/בְנִיתִ֖י/הָ כִּ/ימֵ֥י עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/011.yaml
  text: In that day I will raise up the fallen shelter of David[a], and I will wall up its breaches[c][b], and I will raise up its ruins and rebuild it as in the days of old.
translation:
  language: pt
  text: Naquele dia, levantarei a tenda caída de Davi[a]; fecharei suas brechas[b], levantarei suas ruínas e a reconstruirei como nos dias antigos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cabana de Davi”; tradicionalmente, “tabernáculo de Davi”. A imagem hebraica é a de um abrigo temporário, usado aqui metaforicamente para a casa ou dinastia caída de Davi.
    reason: lexical_alternative
  - marker: b
    text: Ou “repararei suas brechas” ou “vedarei suas aberturas”.
    reason: lexical_alternative
  - marker: c
    text: “Nos dias antigos” se refere aos tempos passados ou remotos, não necessariamente à eternidade em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética em português natural e solene, sem determinar além do texto quando ela se cumprirá.
- source_word: אָקִים
  choice: levantarei
  rationale: Mantém a imagem concreta do hifil de קום, isto é, fazer ficar de pé, e permite reproduzir a repetição verbal do hebraico.
- source_word: סֻכַּת דָּוִיד
  choice: a tenda de Davi
  rationale: סֻכָּה designa uma cabana, abrigo ou estrutura temporária. “Tenda” conserva em português a fragilidade da imagem sem substituí-la interpretativamente por “dinastia” ou “casa”.
- source_word: הַנֹּפֶלֶת
  choice: caída
  rationale: Embora seja formalmente um particípio, no contexto de restauração descreve naturalmente o estado de colapso da estrutura.
- source_word: וְגָדַרְתִּי
  choice: fecharei
  rationale: Com “brechas” como objeto, comunica a ação de vedar ou reparar as aberturas, preservando a imagem arquitetônica em linguagem corrente.
- source_word: פִּרְצֵיהֶן
  choice: suas brechas
  rationale: “Brechas” representa com precisão as aberturas produzidas pelo rompimento da estrutura. O possessivo português evita forçar a oscilação morfológica dos sufixos hebraicos.
- source_word: וַהֲרִסֹתָיו
  choice: suas ruínas
  rationale: Expressa de modo conciso os lugares derrubados ou demolidos e se integra à sequência figurativa de restauração.
- source_word: וּבְנִיתִיהָ
  choice: e a reconstruirei
  rationale: Embora o verbo básico seja “construir”, o contexto de uma estrutura caída e arruinada torna “reconstruir” a equivalência natural em português.
- source_word: כִּימֵי עוֹלָם
  choice: como nos dias antigos
  rationale: Aqui עוֹלָם aponta para a antiguidade ou para tempos remotos, e não necessariamente para a eternidade em sentido abstrato.
theological_decisions:
- issue: Referente de “a tenda de Davi”
  choice: Manter a metáfora concreta de uma frágil estrutura davídica caída, que sugere a casa ou dinastia de Davi em estado de humilhação.
  alternative: Explicitar no texto “a dinastia de Davi”, entender uma tenda cultual literal associada a Davi ou generalizar a expressão como simples símbolo de Israel.
  rationale: O hebraico conserva simultaneamente a imagem física da סֻכָּה e seu peso régio-davídico. A tradução não deve resolver essa tensão por meio de uma paráfrase messiânica, eclesiológica ou cultual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha a progressão hebraica de levantar, fechar, levantar e reconstruir. “Tenda” mantém a metáfora frágil e temporária, enquanto as notas registram alternativas tradicionais e esclarecem a expressão temporal final.
