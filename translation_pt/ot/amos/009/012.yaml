  terminology: «Remanescente», «Edom», «nações» e «Yahweh» estão consistentes e adequados. A nota lexical, porém, chamava a construção literalmente de «invocado», o que introduz uma nuance devocional que não está explicitada pelo hebraico; a formulação literal deve conservar «chamado».
  issues:
