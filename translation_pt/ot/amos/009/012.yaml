  source_fidelity: 'O texto principal segue fielmente o Texto Massorético: preserva a finalidade de לְמַעַן, o sentido possessivo de יירשו, «remanescente de Edom», «todas as nações» e a fórmula profética com Yahweh. A variante grega citada em Atos 15:17 é adequadamente mantida em nota, sem substituir a leitura hebraica.'
