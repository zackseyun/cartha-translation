  text: לְמַ֨עַן יִֽירְשׁ֜וּ אֶת שְׁאֵרִ֤ית אֱדוֹם֙ וְ/כָל הַ/גּוֹיִ֔ם אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עֲלֵי/הֶ֑ם נְאֻם יְהוָ֖ה עֹ֥שֶׂה זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/012.yaml
  text: so that they may possess the remnant of Edom and all the nations who are called by my name,” declares Yahweh[b][a], who does this.
translation:
  language: pt
  text: para que eles tomem posse do remanescente de Edom e de todas as nações que são chamadas pelo meu nome[a][b] — declara Yahweh, que faz isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “sobre as quais o meu nome é chamado”. Essa expressão hebraica indica que tais nações pertencem a Yahweh ou são reivindicadas por ele.'
    reason: lexical_alternative
  - marker: b
    text: 'A forma grega deste versículo citada em Atos 15:17 difere de modo significativo e diz, em linhas gerais: “para que o remanescente da humanidade busque o Senhor, e todas as nações sobre as quais o meu nome foi chamado”.'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa de modo natural em português a finalidade ou o resultado da restauração anunciada no contexto anterior.
- source_word: יִירְשׁוּ
  choice: tomem posse
  rationale: O verbo ירשׁ pode indicar herdar ou tomar posse. Aqui, com Edom e as nações como objeto, “tomem posse” é claro e conserva a dimensão de domínio presente no hebraico.
- source_word: שְׁאֵרִית
  choice: remanescente
  rationale: Mantém o termo profético para aquilo ou aqueles que restam depois do juízo, sem o reduzir a uma paráfrase.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo e território.
- source_word: וְכָל הַגּוֹיִם
  choice: e de todas as nações
  rationale: “Nações” representa adequadamente os povos além de Israel e evita a carga interpretativa mais específica de “gentios”.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: que são chamadas pelo meu nome
  rationale: Tradução idiomática que conserva a voz passiva e a ideia de povos identificados como pertencentes a Yahweh; a formulação mais literal é registrada em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com clareza a fórmula profética e mantém o nome divino em vez de substituí-lo por um título.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama hebraico.
- source_word: עֹשֶׂה זֹּאת
  choice: que faz isso
  rationale: O particípio apresenta Yahweh como aquele que realiza o ato prometido; a expressão portuguesa conserva a formulação concisa e ativa.
theological_decisions:
- issue: Relação de Israel restaurado com Edom e as demais nações
  choice: Conservar a afirmação do texto hebraico de que eles tomarão posse do remanescente de Edom e das nações.
  alternative: Traduzir segundo a forma grega refletida em Atos 15:17, na qual o remanescente da humanidade busca o Senhor.
  rationale: O Texto Massorético fala diretamente de tomar posse de Edom e das nações. A tradução principal segue essa evidência hebraica sem espiritualizar a linguagem nem importar para o texto a leitura da tradição grega; a variante é informada em nota para preservar a tensão textual e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Tomem posse” evita a possível rigidez de “possuam”; “remanescente” preserva a linguagem profética tradicional. A ordem das notas acompanha primeiro a expressão hebraica e depois a variante textual grega.
