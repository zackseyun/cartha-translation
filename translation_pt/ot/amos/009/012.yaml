    rationale: O hebraico diz literalmente que o nome de Yahweh «é chamado sobre» essas nações. Embora «invocado» ocorra em traduções tradicionais de construções semelhantes, aqui pode sugerir que as nações invocam Yahweh, em vez de preservar diretamente a expressão de nomeação/reivindicação. A nota deve dizer «sobre as quais o meu nome é chamado».
