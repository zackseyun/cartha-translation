  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/ל֣וֹא כִ/בְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛/י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֶת יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/פְלִשְׁתִּיִּ֥ים מִ/כַּפְתּ֖וֹר וַ/אֲרָ֥ם מִ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/007.yaml
  text: Are you not like the Cushites to me[a], O sons of Israel? declares Yahweh. Did I not bring up Israel from the land of Egypt, and the Philistines from Caphtor[c][b], and Aram from Kir?
translation:
  language: pt
  text: “Acaso vocês não são para mim como os cuxitas[a], ó filhos de Israel?”, declara Yahweh. “Acaso não fiz subir Israel da terra do Egito, os filisteus de Caftor[b] e Arã[c] de Quir?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “etíopes”. O hebraico diz “cuxitas”, isto é, o povo de Cuxe.'
    reason: lexical_alternative
  - marker: b
    text: Caftor é um topônimo tradicionalmente associado por muitos a Creta, embora sua identificação exata seja debatida.
    reason: cultural_note
  - marker: c
    text: 'Ou: “os arameus de Quir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Acaso ... não
  rationale: Expressa em português uma pergunta retórica que espera resposta afirmativa, preservando sua força nas duas ocorrências.
- source_word: כִבְנֵי כֻשִׁיִּים
  choice: como os cuxitas
  rationale: O כ marca comparação, e בְּנֵי funciona aqui como designação idiomática de um povo. “Cuxitas” mantém o referente etnogeográfico hebraico sem substituí-lo por uma identificação posterior.
- source_word: אַתֶּם לִי
  choice: vocês ... para mim
  rationale: Preserva a relação expressa pelo dativo לִי e a franqueza da perspectiva divina, sem restringi-la à ideia de aparência ou avaliação visual.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ó filhos de Israel
  rationale: Mantém o vocativo e a forma lexical masculina plural do hebraico, que aqui funciona como designação nacional.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com dignidade e naturalidade a fórmula profética solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino conforme a forma adotada pelo projeto.
- source_word: הֶעֱלֵיתִי
  choice: fiz ... subir
  rationale: Conserva o sentido causativo do hifil de עלה e permite que um só verbo governe paralelamente Israel, os filisteus e Arã.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém o substantivo explícito “terra” e o paralelismo formal da frase hebraica.
- source_word: פְלִשְׁתִּיִּים
  choice: os filisteus
  rationale: É o etnônimo português corrente para esse povo.
- source_word: כַּפְתּוֹר
  choice: Caftor
  rationale: Translitera o topônimo hebraico, cuja identificação histórica exata permanece debatida.
- source_word: אֲרָם
  choice: Arã
  rationale: Preserva o nome próprio e a ambiguidade entre a região e seu povo, evitando substituí-lo pelo termo geopolítico posterior “Síria”.
- source_word: קִיר
  choice: Quir
  rationale: Emprega a forma portuguesa tradicional do topônimo sem propor uma identificação não expressa no texto.
theological_decisions:
- issue: Força da comparação entre Israel e os cuxitas
  choice: A tradução conserva a afirmação de que Israel, diante de Yahweh, pode ser comparado aos cuxitas, enquanto a sequência coloca o êxodo de Israel em paralelo com deslocamentos de outros povos.
  alternative: Entender a comparação somente como referência a deslocamento geográfico, sem implicações para a condição de Israel diante de Deus.
  rationale: As perguntas retóricas relativizam qualquer apelo automático de Israel ao privilégio étnico ou à tradição do êxodo. A tradução mantém essa tensão sem explicá-la ou reduzi-la no corpo do versículo.
- issue: Sentido nacional de בְּנֵי יִשְׂרָאֵל
  choice: ó filhos de Israel
  alternative: ó povo de Israel; ó israelitas
  rationale: A expressão é uma designação nacional, mas sua forma lexical é masculina plural. A tradução retém essa forma e o tom vocativo sem acrescentar uma interpretação denominacional.
- issue: Referente de אֲרָם
  choice: Arã
  alternative: os arameus
  rationale: O hebraico pode designar a região ou o povo. O nome próprio no texto principal preserva a ambiguidade, e a alternativa etnonímica é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Acaso ... não” comunica a retórica solene sem soar arcaico; “vocês” dá clareza ao plural. Os topônimos seguem formas portuguesas reconhecíveis, e a sintaxe paralela conserva a provocação teológica do hebraico.
