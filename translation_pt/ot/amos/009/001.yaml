source:
  edition: WLC
  text: רָאִ֨יתִי אֶת אֲדֹנָ֜/י נִצָּ֣ב עַֽל הַ/מִּזְבֵּ֗חַ וַ/יֹּאמֶר֩ הַ֨ךְ הַ/כַּפְתּ֜וֹר וְ/יִרְעֲשׁ֣וּ הַ/סִּפִּ֗ים וּ/בְצַ֨עַ/ם֙ בְּ/רֹ֣אשׁ כֻּלָּ֔/ם וְ/אַחֲרִיתָ֖/ם בַּ/חֶ֣רֶב אֶהֱרֹ֑ג לֹֽא יָנ֤וּס לָ/הֶם֙ נָ֔ס וְ/לֹֽא יִמָּלֵ֥ט לָ/הֶ֖ם פָּלִֽיט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/001.yaml
  text: 'I saw the Lord standing beside the altar[a], and he said: Strike the capital, so that the thresholds may shake; shatter them on the heads of all of them. And I will kill their survivors with the sword; not one who flees among them will get away[d][c][b], and not one who escapes among them will be delivered.'
translation:
  language: pt
  text: 'Vi o Senhor de pé junto ao altar[a], e ele disse:


    “Golpeie o capitel[b],


    para que os umbrais estremeçam;


    quebre-os sobre a cabeça de todos eles.[c]


    Matarei à espada os que restarem[d].


    Nenhum dos que fugirem escapará;


    nenhum dos que tentarem escapar se salvará.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre o altar”. A preposição hebraica pode indicar “sobre”, mas, nesta cena, também pode significar que o Senhor estava junto ao altar, pronto para julgar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a parte superior da coluna”. O termo hebraico designa provavelmente um elemento arquitetônico no alto da estrutura.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico é difícil; mais literalmente: “quebre-os sobre a cabeça de todos eles”. A imagem pode ser a da estrutura despedaçada caindo sobre todos os presentes.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “o restante deles”. Aqui, o contexto aponta para os que sobreviverem à destruição inicial, e não para um remanescente apresentado de maneira esperançosa.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino de soberania de modo tradicional e claro, sem empregar a forma reservada ao nome YHWH.
- source_word: נִצָּב עַל הַמִּזְבֵּחַ
  choice: de pé junto ao altar
  rationale: נִצָּב indica estar de pé ou postado; עַל admite aqui proximidade espacial. A nota preserva a alternativa literal «sobre o altar».
- source_word: הַךְ הַכַּפְתּוֹר
  choice: Golpeie o capitel
  rationale: O imperativo exige uma ação forte; כַּפְתּוֹר provavelmente designa o elemento arquitetônico superior da estrutura.
- source_word: הַסִּפִּים
  choice: os umbrais
  rationale: O termo pode designar partes do vão da entrada, como umbrais ou soleiras. «Umbrais» é natural no cenário do santuário e mantém a imagem arquitetônica.
- source_word: וּבְצַעַם בְּרֹאשׁ כֻּלָּם
  choice: faça-os desabar sobre a cabeça de todos eles
  rationale: O hebraico é difícil. A tradução comunica a provável imagem da estrutura quebrada caindo sobre os presentes, sem esconder a dificuldade, registrada em nota.
- source_word: וְאַחֲרִיתָם
  choice: os que restarem
  rationale: No contexto de juízo, refere-se aos sobreviventes da destruição inicial, sem a conotação positiva que «remanescente» pode adquirir.
- source_word: בַּחֶרֶב אֶהֱרֹג
  choice: Matarei à espada
  rationale: Formulação direta e digna para a declaração de juízo, preservando o instrumento expresso no hebraico.
- source_word: לֹא יָנוּס לָהֶם נָס וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  choice: Nenhum dos que fugirem escapará; nenhum dos que tentarem escapar se salvará
  rationale: Reproduz as duas negações enfáticas e o paralelismo, embora a repetição cognata hebraica não possa ser mantida com naturalidade plena em português.
theological_decisions:
- issue: Título divino na visão profética
  choice: o Senhor
  alternative: o Soberano
  rationale: אֲדֹנָי é um título de soberania, não o Tetragrama. «O Senhor» é claro e tradicional, sem confundi-lo graficamente com a convenção usada para YHWH.
- issue: Alcance do juízo anunciado
  choice: negação enfática de qualquer fuga ou livramento entre os alvos do oráculo
  alternative: atenuar a linguagem como uma generalização
  rationale: O paralelismo hebraico exprime juízo total sobre o grupo em vista; a tradução mantém essa tensão sem acrescentar qualificações teológicas externas ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso poético foi disposto em linhas para evidenciar os imperativos e o paralelismo final. Evitaram-se formas arcaicas como «ferir de espada» e termos confessionais não exigidos pelo hebraico.
