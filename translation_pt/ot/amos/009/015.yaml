id: AMO.9.15
reference: Amos 9:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/נְטַעְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹ֨א יִנָּתְשׁ֜וּ ע֗וֹד מֵ/עַ֤ל אַדְמָתָ/ם֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם אָמַ֖ר יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/015.yaml
  text: I will plant them on their land[a], and they will never again be uprooted from the land that I have given them, says Yahweh your God.
translation:
  language: pt
  text: Eu os plantarei na terra deles, e nunca mais serão arrancados da terra que lhes dei — diz Yahweh, teu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz «teu Deus», no singular. Alguns entendem o singular como dirigido a Israel coletivamente; outros vertem a expressão como «Deus deles», em harmonia com os pronomes plurais anteriores.
    reason: Explica a mudança inesperada do plural para o singular e registra alternativas interpretativas sem alterar o texto hebraico recebido nem favorecer uma explicação.
lexical_decisions:
- source_word: וּנְטַעְתִּים
  choice: Eu os plantarei
  rationale: Preserva o sentido literal de נטע, “plantar”, e mantém a metáfora agrícola que continua em “arrancados”.
- source_word: עַל אַדְמָתָם
  choice: na terra deles
  rationale: אדמה pode indicar solo, chão ou terra. Aqui, “terra” expressa naturalmente o contexto de restauração, enquanto “deles” torna explícito o sufixo possessivo plural.
- source_word: וְלֹא יִנָּתְשׁוּ עוֹד
  choice: e nunca mais serão arrancados
  rationale: O nifal de נתש indica ser arrancado ou desarraigado. “Arrancados” preserva a ligação com a imagem de plantar e comunica a remoção forçada da terra.
- source_word: מֵעַל אַדְמָתָם
  choice: da terra
  rationale: A preposição מֵעַל significa literalmente “de sobre”, mas “da terra” é a forma natural em português; evita-se repetir “deles” porque a relação já está clara no contexto imediato.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: que lhes dei
  rationale: O perfeito hebraico é traduzido naturalmente pelo pretérito perfeito, apresentando a terra como dádiva realizada de Yahweh.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente português comunica bem a força vigente da fórmula profética, e o nome divino é transliterado em vez de substituído por um título.
- source_word: אֱלֹהֶיךָ
  choice: teu Deus
  rationale: Mantém o sufixo de segunda pessoa masculina singular do Texto Massorético, apesar da mudança em relação aos referentes plurais anteriores.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva de modo transparente, sem substituí-lo pelo título “SENHOR”.
- issue: Mudança para o singular em אֱלֹהֶיךָ
  choice: teu Deus
  alternative: Deus deles
  rationale: A forma hebraica recebida é singular, “teu Deus”. Embora “Deus deles” harmonize o pronome com os plurais do restante do versículo, não há justificativa para introduzir essa regularização no texto principal; a tensão é preservada e explicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Na terra deles” evita a ambiguidade de “em sua terra”; “plantarei” e “arrancados” conservam a metáfora unificadora do hebraico. O travessão destaca naturalmente a fórmula profética final.
