id: AMO.9.10
reference: Amos 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/חֶ֣רֶב יָמ֔וּתוּ כֹּ֖ל חַטָּאֵ֣י עַמִּ֑/י הָ/אֹמְרִ֗ים לֹֽא תַגִּ֧ישׁ וְ/תַקְדִּ֛ים בַּעֲדֵ֖י/נוּ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/010.yaml
  text: By the sword all the sinners of my people will die—those who say, ‘The disaster will not overtake us or come against us.’
translation:
  language: pt
  text: 'Todos os pecadores do meu povo morrerão à espada — os que dizem: “A calamidade não se aproximará nem nos alcançará[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem virá ao nosso encontro”.'
    reason: O verbo קדם no hifil pode transmitir a ideia de ir ao encontro, confrontar ou alcançar; a nota preserva essa nuance lexical sem tornar o texto principal pouco natural.
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Expressa de modo natural em português o instrumento ou meio de morte indicado pela preposição בְּ.
- source_word: חַטָּאֵי עַמִּי
  choice: os pecadores do meu povo
  rationale: Preserva a relação construta e identifica os culpados como pertencentes ao povo do próprio Deus, sem generalizar para todo o povo.
- source_word: הָרָעָה
  choice: a calamidade
  rationale: No contexto profético de juízo, רָעָה designa uma desgraça ou calamidade, não maldade moral.
- source_word: לֹא תַגִּישׁ וְתַקְדִּים בַּעֲדֵינוּ
  choice: não se aproximará nem nos alcançará
  rationale: Reproduz os dois verbos de movimento e confronto em português corrente; o segundo descreve a calamidade chegando até eles ou indo ao encontro deles.
theological_decisions:
- issue: Alcance de “todos”
  choice: Todos os pecadores do meu povo
  alternative: Todo o meu povo pecador
  rationale: A sintaxe liga “todos” a “os pecadores”, distinguindo os culpados dentro do povo, em vez de caracterizar necessariamente cada integrante do povo como pecador condenado neste enunciado.
- issue: Falsa segurança dos pecadores
  choice: A fala é mantida como negação enfática da aproximação e do alcance da calamidade
  alternative: Explicitar que eles não criam no juízo de Deus
  rationale: O texto apresenta a alegação deles sem acrescentar uma explicação teológica que, embora plausível, não está expressa no versículo.
translation_notes:
  register: Português moderno, claro e solene, com pontuação que mantém a relação explicativa entre a sentença e a fala dos pecadores. “À espada” conserva a formulação profética tradicional sem soar arcaica.
