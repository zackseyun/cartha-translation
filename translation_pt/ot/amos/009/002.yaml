id: AMO.9.2
reference: Amos 9:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם יַחְתְּר֣וּ בִ/שְׁא֔וֹל מִ/שָּׁ֖ם יָדִ֣/י תִקָּחֵ֑/ם וְ/אִֽם יַעֲלוּ֙ הַ/שָּׁמַ֔יִם מִ/שָּׁ֖ם אוֹרִידֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/002.yaml
  text: Though they dig into Sheol[a], from there my hand will take them; and though they climb up to the heavens, from there I will bring them down.
translation:
  language: pt
  text: Ainda que escavem até o Sheol[a], de lá a minha mão os tomará; e, ainda que subam aos céus, de lá eu os farei descer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “o mundo dos mortos”.
    reason: Alternativas lexicais para Sheol.
lexical_decisions:
- source_word: יַחְתְּרוּ
  choice: escavem
  rationale: Preserva a imagem concreta de cavar ou abrir caminho por escavação, adequada à tentativa poética de alcançar o mundo inferior.
- source_word: בִשְׁאוֹל
  choice: até o Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos e usa uma construção natural em português para indicar o destino da escavação.
- source_word: יָדִי
  choice: a minha mão
  rationale: Conserva a imagem antropomórfica do alcance e do poder de Deus, em vez de substituí-la por uma abstração.
- source_word: תִּקָּחֵם
  choice: os tomará
  rationale: Representa de modo direto e relativamente neutro o sentido amplo de tomar ou apoderar-se, sem intensificar desnecessariamente a violência.
- source_word: יַעֲלוּ
  choice: subam
  rationale: É a correspondência portuguesa natural para o movimento ascendente e mantém o paralelismo com a descida imposta por Deus.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Reflete naturalmente o plural hebraico e preserva o contraste cósmico entre o Sheol e os céus.
- source_word: אוֹרִידֵם
  choice: eu os farei descer
  rationale: Expressa claramente a forma causativa do verbo hebraico sem acrescentar a ideia mais forte de lançá-los abaixo.
- source_word: אִם ... וְאִם
  choice: Ainda que ... e, ainda que
  rationale: 'Comunica o valor concessivo das duas hipóteses extremas: nenhuma tentativa de fuga poderá ter êxito.'
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração preserva o conceito hebraico e o contraste cosmológico com os céus, sem restringi-lo à sepultura nem defini-lo segundo categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo poético e as imagens concretas do hebraico foram preservados.
