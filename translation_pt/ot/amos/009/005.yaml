id: AMO.9.5
reference: Amos 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אדֹנָ֨/י יְהוִ֜ה הַ/צְּבָא֗וֹת הַ/נּוֹגֵ֤עַ בָּ/אָ֨רֶץ֙ וַ/תָּמ֔וֹג וְ/אָבְל֖וּ כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/עָלְתָ֤ה כַ/יְאֹר֙ כֻּלָּ֔/הּ וְ/שָׁקְעָ֖ה כִּ/יאֹ֥ר מִצְרָֽיִם־
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/005.yaml
  text: And the Lord GOD of hosts is the one who touches the earth[a], and it melts, and all who dwell in it mourn; and all of it rises like the Nile and sinks like the Nile of Egypt.
translation:
  language: pt
  text: E o Senhor Yahweh dos Exércitos[a] é quem toca a terra, e ela se derrete, e todos os que nela habitam lamentam; e toda ela sobe como o Nilo e baixa como o Nilo do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Senhor Yahweh dos Exércitos”. Algumas traduções substituem o nome divino Yahweh por “DEUS” neste título.'
    reason: Explica a composição do título divino e registra a alternativa reverencial sem apagar a forma do texto hebraico.
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa os dois elementos do título hebraico: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”, sem produzir a repetição pouco natural “Senhor SENHOR”.'
- source_word: הַצְּבָאוֹת
  choice: dos Exércitos
  rationale: Mantém o título tradicional e sua amplitude, que abrange as forças sob o comando divino, sem restringi-lo explicitamente apenas a exércitos humanos ou celestiais.
- source_word: הַנּוֹגֵעַ
  choice: é quem toca
  rationale: O particípio caracteriza a ação divina, e “toca” preserva o sentido simples de נגע; o efeito devastador é expresso pelo verbo seguinte.
- source_word: בָּאָרֶץ
  choice: a terra
  rationale: Neste quadro teofânico de alcance abrangente, “terra” comunica melhor o provável sentido do que a alternativa localizada “região” ou “país”.
- source_word: וַתָּמוֹג
  choice: ela se derrete
  rationale: Preserva a metáfora vívida de dissolução ou colapso contida em מוג, em vez de reduzi-la a um simples tremor.
- source_word: וְאָבְלוּ
  choice: lamentam
  rationale: אבל descreve o luto ou a lamentação diante de calamidade; “lamentam” é atual e mantém esse peso sem intensificação indevida.
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: todos os que nela habitam
  rationale: Conserva a forma participial de “os que habitam nela” e soa natural em português.
- source_word: וְעָלְתָה כַיְאֹר כֻּלָּהּ
  choice: Ela inteira sobe como o Nilo
  rationale: O pronome retoma “a terra”, os verbos permanecem no feminino singular, e יְאֹר neste contexto designa o Nilo e sua cheia.
- source_word: וְשָׁקְעָה
  choice: e torna a baixar
  rationale: No paralelo com a cheia do Nilo, שקע indica afundar ou baixar. “Torna a baixar” exprime com clareza o movimento inverso sem sugerir necessariamente submersão permanente.
- source_word: כִּיאֹר מִצְרָיִם
  choice: como o Nilo do Egito
  rationale: Identifica explicitamente o rio referido pelo hebraico e conserva a associação geográfica expressa no texto.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A transliteração “Yahweh” distingue o nome divino do título אֲדֹנָי e evita ocultar a presença simultânea dos dois termos. A nota registra a forma hebraica e a alternativa reverencial tradicional.
- issue: Alcance de אֶרֶץ
  choice: terra
  alternative: região/país
  rationale: A linguagem teofânica e a referência a todos os seus habitantes favorecem o alcance amplo de “terra”, embora o substantivo hebraico também possa designar uma região ou país em outros contextos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e as imagens concretas do hebraico foram mantidas, enquanto “torna a baixar” torna natural em português a imagem do ciclo do Nilo.
