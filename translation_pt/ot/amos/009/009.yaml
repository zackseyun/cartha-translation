source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה אָֽנֹכִי֙ מְצַוֶּ֔ה וַ/הֲנִע֥וֹתִי בְ/כָֽל הַ/גּוֹיִ֖ם אֶת בֵּ֣ית יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֤ר יִנּ֨וֹעַ֙ בַּ/כְּבָרָ֔ה וְ/לֹֽא יִפּ֥וֹל צְר֖וֹר אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/009.yaml
  text: For look, I am commanding, and I will shake the house of Israel among all the nations, as one shakes with a sieve, yet not a pebble will fall to the ground.
translation:
  language: pt
  text: Pois eis que estou dando a ordem e sacudirei a casa de Israel entre todas as nações, como se sacode numa peneira; mas nem uma pedrinha cairá no chão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva o marcador enfático e de chamada de atenção em registro bíblico digno, sem acrescentar conteúdo.
- source_word: מְצַוֶּה
  choice: darei a ordem
  rationale: Expressa naturalmente em português o particípio hebraico no contexto de uma ação divina iminente e soberana.
- source_word: וַהֲנִעוֹתִי
  choice: e sacudirei
  rationale: Mantém a imagem física de agitação que é desenvolvida pela comparação com a peneira.
- source_word: בְכָל הַגּוֹיִם
  choice: entre todas as nações
  rationale: Representa o âmbito da dispersão e agitação de Israel entre os povos, preservando a preposição sem explicitação excessiva.
- source_word: בַּכְּבָרָה
  choice: numa peneira
  rationale: Traduz o instrumento de peneiração de modo claro e corrente; a construção hebraica permite compreender que aquilo que é sacudido está na peneira.
- source_word: צְרוֹר
  choice: pedrinha
  rationale: No quadro da peneiração, designa uma pequena pedra ou seixo; evita o sentido mais amplo e contextualmente improvável de 'feixe' ou 'embrulho'.
- source_word: אָרֶץ
  choice: chão
  rationale: Neste contexto concreto, indica o solo para onde algo poderia cair; 'chão' é mais natural que 'terra' em português.
theological_decisions:
- issue: Alcance da preservação retratada pela pedrinha que não cai
  choice: Manter a imagem sem identificar explicitamente a pedrinha com cada israelita, com um remanescente ou com os pecadores.
  alternative: Explicitar que nenhum fiel/remanescente se perderá, ou que nenhum pecador escapará do juízo.
  rationale: O versículo isolado conserva tensão interpretativa na metáfora; o contexto seguinte contribui para sua leitura, mas a tradução não deve incorporar uma conclusão teológica na própria imagem.
- issue: Agência divina no abalo de Israel
  choice: Traduzir Deus como aquele que dá a ordem e sacode Israel.
  alternative: Usar formulação passiva ou atribuir diretamente a ação às nações.
  rationale: Os verbos hebraicos estão na primeira pessoa e apresentam a ação como determinada e executada por Deus.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se 'eis que' como fórmula enfática amplamente reconhecível. A pontuação destaca o contraste final sem explicar além do hebraico.
