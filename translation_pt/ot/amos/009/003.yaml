  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם יֵחָֽבְאוּ֙ בְּ/רֹ֣אשׁ הַ/כַּרְמֶ֔ל מִ/שָּׁ֥ם אֲחַפֵּ֖שׂ וּ/לְקַחְתִּ֑י/ם וְ/אִם יִסָּ֨תְר֜וּ מִ/נֶּ֤גֶד עֵינַ/י֙ בְּ/קַרְקַ֣ע הַ/יָּ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/נָּחָ֖שׁ וּ/נְשָׁכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/003.yaml
  text: And if they hide themselves on the summit of Carmel[a], from there I will search them out and take them; and if they conceal themselves from before my eyes on the floor of the sea, from there I will command the serpent[b], and it will bite them.
translation:
  language: pt
  text: E, se se esconderem no topo do Carmelo, de lá os procurarei e os tomarei; e, se se ocultarem de diante dos meus olhos, no fundo do mar[a], de lá darei ordem à serpente[b], e ela os morderá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no leito do mar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “à cobra”. O substantivo hebraico pode significar “cobra” ou “serpente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵחָבְאוּ
  choice: se escondam
  rationale: O nifal de חבא admite sentido reflexivo ou passivo; no contexto, “se escondam” expressa com naturalidade a tentativa deliberada de ocultação.
- source_word: בְּרֹאשׁ הַכַּרְמֶל
  choice: no topo do Carmelo
  rationale: רֹאשׁ designa aqui a parte mais alta. “Topo” preserva a imagem espacial e mantém Carmelo como nome próprio, sem acrescentar “monte” ao texto.
- source_word: אֲחַפֵּשׂ
  choice: eu os procurarei
  rationale: O piel de חפשׂ indica busca ativa e cuidadosa. Em português corrente, “procurarei” comunica adequadamente essa perseguição; o objeto pronominal explicita quem será buscado.
- source_word: וּלְקַחְתִּים
  choice: e os apanharei
  rationale: לקח tem o sentido amplo de tomar. “Apanharei” preserva esse alcance e, no contexto de juízo, sugere captura sem especificar além do hebraico.
- source_word: יִסָּתְרוּ
  choice: se ocultem
  rationale: A escolha mantém a distinção lexical em relação a חבא, traduzido antes por “se escondam”, e expressa naturalmente a tentativa de fugir à vista divina.
- source_word: מִנֶּגֶד עֵינַי
  choice: de diante dos meus olhos
  rationale: Preserva a expressão antropomórfica concreta do hebraico, em vez de reduzi-la ao mais abstrato “da minha vista”.
- source_word: בְּקַרְקַע הַיָּם
  choice: no solo do mar
  rationale: קַרְקַע significa chão ou solo. A formulação conserva a imagem concreta do hebraico; “no fundo do mar” é registrado como alternativa mais idiomática.
- source_word: אֲצַוֶּה
  choice: ordenarei
  rationale: צוה expressa ordem ou comando e afirma diretamente a autoridade divina sobre a criatura.
- source_word: הַנָּחָשׁ
  choice: a serpente
  rationale: נחשׁ pode designar cobra ou serpente. “Serpente” convém ao registro profético elevado sem impor, por si só, uma identificação simbólica.
- source_word: וּנְשָׁכָם
  choice: e ela os morderá
  rationale: נשׁך significa “morder”. O pronome feminino retoma naturalmente “a serpente” e preserva a oração coordenada do hebraico.
theological_decisions:
- issue: Onisciência divina e juízo inevitável expressos em linguagem antropomórfica
  choice: Manter “de diante dos meus olhos”.
  alternative: “da minha vista” ou “fora da minha vista”
  rationale: A expressão concreta ressalta que nenhum esconderijo escapa ao olhar e ao alcance judicial de Deus, sem transformar a imagem em formulação teológica abstrata.
- issue: Continuidade da fala divina sem acréscimo do nome divino
  choice: Conservar a primeira pessoa (“eu...”) sem inserir “o SENHOR”.
  alternative: Acrescentar “o SENHOR” para explicitar o falante
  rationale: O hebraico continua a fala divina do contexto e não repete aqui o sujeito nominal; acrescentá-lo excederia o texto deste versículo.
- issue: Identidade da criatura marinha
  choice: Traduzir הַנָּחָשׁ por “a serpente” sem explicação simbólica no texto.
  alternative: “a cobra” ou uma identificação com monstro marinho
  rationale: O substantivo permite “cobra/serpente”, mas o versículo não define uma identidade mitológica ou demoníaca específica. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe paralela do hebraico foi preservada, bem como as imagens concretas do topo do Carmelo, dos olhos divinos e do solo do mar. O marcador [a] foi colocado junto à expressão a que sua nota lexical efetivamente se refere.
