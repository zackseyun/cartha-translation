revisions:
- from: Mesmo que se escondam no topo do Carmelo, de lá eu os procurarei e os apanharei; e, mesmo que se ocultem de diante dos meus olhos no solo do mar[a], de lá ordenarei à serpente[b], e ela os morderá.
  to: E, se se esconderem no topo do Carmelo, de lá os procurarei e os tomarei; e, se se ocultarem de diante dos meus olhos, no fundo do mar[a], de lá darei ordem à serpente[b], e ela os morderá.
  rationale: A revisão conserva o sentido e o paralelismo do hebraico, mas substitui escolhas menos idiomáticas por formulações naturais e neutras. A nota [a] foi ajustada porque o texto principal agora usa “no fundo do mar”; “no leito do mar” registra a alternativa mais concreta para a imagem de chão/piso. Não há alteração doutrinária nem resolução artificial de qualquer ambiguidade.
