base_translation:
  language: en
  yaml_path: translation/ot/amos/009/004.yaml
  text: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
translation:
  language: pt
  text: E, se forem para o cativeiro diante de seus inimigos, de lá ordenarei à espada que os mate. Porei os olhos sobre eles para o mal, e não para o bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a desgraça, e não para o bem”. Aqui, o termo hebraico traduzido como “mal” indica calamidade ou dano decorrente do juízo, não maldade moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mesmo que
  rationale: No encadeamento de cenários inevitáveis, a conjunção condicional tem força concessiva; “Mesmo que” expressa naturalmente que nem o cativeiro permitirá escapar do juízo.
- source_word: יֵלְכוּ בַשְּׁבִי
  choice: vão para o cativeiro
  rationale: Preserva o verbo de movimento הלך e traduz שבי como a condição de cativeiro, sem convertê-lo desnecessariamente em voz passiva.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: diante de seus inimigos
  rationale: Reproduz de modo natural o idioma espacial hebraico, que aqui descreve o cativeiro na presença e sob o poder dos inimigos.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Mantém a referência enfática ao próprio lugar do cativeiro como ponto de onde o juízo divino ainda os alcançará.
- source_word: אֲצַוֶּה אֶת־הַחֶרֶב וַהֲרָגָתַם
  choice: ordenarei à espada que os mate
  rationale: Conserva a personificação da espada como agente sujeito à ordem divina e verte em português natural a concordância do verbo feminino com “espada”.
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Porei os meus olhos sobre eles
  rationale: Preserva a metáfora hebraica da atenção divina deliberadamente dirigida a eles; a frase seguinte esclarece que essa atenção visa ao juízo.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: para o mal, e não para o bem
  rationale: Mantém a antítese lexical direta entre רָעָה e טוֹבָה e a tensão do original; a nota esclarece que “mal” designa dano ou calamidade, não maldade moral.
theological_decisions:
- issue: Sentido de רָעָה quando atribuído à ação judicial de Deus
  choice: para o mal
  alternative: para a desgraça / para lhes fazer mal
  rationale: A tradução principal conserva a oposição formal “mal/bem” e evita resolver no corpo do texto a amplitude de רָעָה. A nota delimita o sentido contextual como calamidade ou dano judicial, sem sugerir maldade moral em Deus.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação mantém a imagem concreta da espada obedecendo a uma ordem e o idioma dos olhos de Deus postos sobre o povo. O marcador [a] aparece no texto e corresponde à nota lexical.
