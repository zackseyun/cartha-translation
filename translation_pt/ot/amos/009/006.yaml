base_translation:
  language: en
  yaml_path: translation/ot/amos/009/006.yaml
  text: He who builds his upper chambers in the heavens[a], and has founded his vault upon the earth[b], who calls for the waters of the sea and pours them out upon the face of the earth—Yahweh is his name.
translation:
  language: pt
  text: Aquele que constrói suas câmaras superiores nos céus[a] e estabeleceu sua abóbada sobre a terra[b], que convoca as águas do mar e as derrama sobre a face da terra — Yahweh é o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas subidas” ou “seus degraus”. O termo hebraico pode designar alturas, escadarias ou aposentos superiores; aqui provavelmente se refere a estruturas celestes elevadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua faixa”, “sua estrutura” ou “sua cúpula”. A palavra hebraica se refere a algo unido ou atado e aqui faz parte de uma imagem de arquitetura cósmica.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנֶה
  choice: Aquele que constrói
  rationale: O particípio qal com artigo tem função substantivada e descreve Yahweh por sua ação característica. A oração relativa conserva essa força e o tom doxológico.
- source_word: מַעֲלוֹתָיו
  choice: suas câmaras superiores
  rationale: O substantivo pode indicar subidas, degraus ou aposentos elevados. No contexto cósmico e arquitetônico, “câmaras superiores” comunica de modo natural as estruturas celestes elevadas, sem ocultar as alternativas, registradas em nota.
- source_word: וַאֲגֻדָּתוֹ
  choice: sua abóbada
  rationale: O termo básico se relaciona a algo unido ou atado. Neste contexto, parece integrar a imagem da arquitetura cósmica; “abóbada” expressa uma estrutura abrangente, enquanto a nota preserva a incerteza lexical.
- source_word: יְסָדָהּ
  choice: estabeleceu
  rationale: O verbo יסד significa fundar ou estabelecer. O perfeito apresenta a obra como realizada; “estabeleceu” é natural em português e mantém a ideia de criação e firmeza.
- source_word: הַקֹּרֵא לְמֵי הַיָּם
  choice: que convoca as águas do mar
  rationale: O particípio paralelo descreve outra ação característica. Com לְ, o verbo retrata Deus chamando ou convocando as águas para agir; “convoca” expressa claramente sua autoridade.
- source_word: וַיִּשְׁפְּכֵם
  choice: e as derrama
  rationale: שפך significa derramar. O pronome feminino plural retoma “águas”, e o presente acompanha em português a descrição da ação característica iniciada pelo particípio.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: sobre a face da terra
  rationale: A formulação conserva a imagem e a cadência do idioma hebraico, permanecendo compreensível em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido como nome próprio, em vez de ser substituído por um título, preservando a identificação pessoal e culminante do texto.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: A oração nominal encerra o verso com a identificação solene de Yahweh.
theological_decisions:
- issue: Imagens cosmológicas em מַעֲלוֹתָיו e אֲגֻדָּתוֹ
  choice: Manter imagens de arquitetura cósmica com “câmaras superiores” e “abóbada”.
  alternative: Traduzir de forma mais lexical como “subidas/degraus” e “feixe/faixa/estrutura”.
  rationale: O verso exalta Yahweh como criador e soberano mediante imagens antigas. A tradução conserva esse quadro sem transformá-lo numa descrição científica moderna nem definir com falsa precisão os elementos incertos.
- issue: Nome divino יהוה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o tetragrama; a transliteração preserva o nome divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o movimento poético e a identificação climática no fim. As notas registram a genuína incerteza dos dois termos cosmológicos.
