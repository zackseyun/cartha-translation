  text: וְ/שַׁבְתִּי֮ אֶת שְׁב֣וּת עַמִּ֣/י יִשְׂרָאֵל֒ וּ/בָנ֞וּ עָרִ֤ים נְשַׁמּוֹת֙ וְ/יָשָׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/שָׁת֖וּ אֶת יֵינָ֑/ם וְ/עָשׂ֣וּ גַנּ֔וֹת וְ/אָכְל֖וּ אֶת פְּרִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/014.yaml
  text: I will restore the fortunes of my people Israel[a], and they will rebuild ruined cities and inhabit them; they will plant vineyards and drink their wine; they will make gardens and eat their fruit.
translation:
  language: pt
  text: Restaurarei a sorte do meu povo Israel[a]. Eles reconstruirão as cidades devastadas e habitarão nelas; plantarão vinhas e beberão o vinho delas; farão jardins e comerão os seus frutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Trarei de volta os cativos do meu povo Israel” ou “restaurarei o cativeiro do meu povo Israel”. A fórmula hebraica pode indicar tanto a volta do cativeiro quanto uma reversão mais ampla da aflição.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: Restaurarei a sorte
  rationale: A fórmula hebraica indica a reversão da situação adversa e pode também evocar o retorno do cativeiro. “Restaurarei a sorte” conserva o sentido amplo da restauração no contexto.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: meu povo Israel
  rationale: Preserva de modo natural a designação pactual e a relação apositiva do hebraico.
- source_word: וּבָנוּ עָרִים נְשַׁמּוֹת
  choice: reconstruirão as cidades devastadas
  rationale: Embora o verbo signifique literalmente “construir”, o estado devastado das cidades e o contexto de restauração justificam “reconstruirão”. “Devastadas” comunica que foram assoladas e ficaram em ruínas.
- source_word: וְיָשָׁבוּ
  choice: habitarão nelas
  rationale: Expressa o sentido contextual de morar nas cidades reconstruídas, em registro digno e corrente.
- source_word: וְנָטְעוּ כְרָמִים
  choice: plantarão vinhas
  rationale: Equivalência direta e idiomática para a atividade agrícola descrita.
- source_word: וְשָׁתוּ אֶת יֵינָם
  choice: beberão o vinho delas
  rationale: O sufixo remete naturalmente às vinhas. A formulação portuguesa explicita essa referência sem alterar a imagem.
- source_word: וְעָשׂוּ גַנּוֹת
  choice: farão pomares
  rationale: “Farão” preserva o verbo amplo עשה; “pomares” representa jardins cultivados produtores de fruto e evita a possível ideia ornamental de “jardins”.
- source_word: וְאָכְלוּ אֶת פְּרִיהֶם
  choice: comerão os seus frutos
  rationale: Mantém o termo concreto “frutos” e sua referência aos pomares.
theological_decisions:
- issue: Sentido da fórmula שׁוּב שְׁבוּת
  choice: Restaurarei a sorte
  alternative: Trarei de volta os cativos / restaurarei o povo do cativeiro
  rationale: A expressão pode denotar tanto a volta do cativeiro quanto uma reversão mais abrangente da aflição. As referências seguintes às cidades, vinhas e pomares favorecem no texto principal o sentido amplo, enquanto a nota preserva a ressonância do exílio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide a promessa divina da descrição de seus resultados e conserva o paralelismo agrícola do versículo.
