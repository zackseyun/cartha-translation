  to: Eis que os olhos do Senhor Yahweh estão sobre o reino pecador, e eu o destruirei da face da terra. Contudo, não destruirei completamente[a] a casa de Jacó — declara Yahweh.
  rationale: Mantém-se o texto principal, que é fiel e idiomático. A nota é corrigida para que a ênfase gramatical hebraica recaia na negação da destruição total, sem dar a entender que não haverá juízo ou destruição alguma.
