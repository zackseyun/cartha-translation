source:
  edition: WLC
  text: הִנֵּ֞ה עֵינֵ֣י אֲדֹנָ֣/י יְהוִ֗ה בַּ/מַּמְלָכָה֙ הַֽ/חַטָּאָ֔ה וְ/הִשְׁמַדְתִּ֣י אֹתָ֔/הּ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה אֶ֗פֶס כִּ֠י לֹ֣א הַשְׁמֵ֥יד אַשְׁמִ֛יד אֶת בֵּ֥ית יַעֲקֹ֖ב נְאֻם יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/008.yaml
  text: Look[a], the eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob," declares Yahweh.
translation:
  language: pt
  text: Eis que os olhos do Senhor Yahweh estão sobre o reino pecador, e eu o destruirei da face da terra. Contudo, não destruirei completamente[a] a casa de Jacó — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente não destruirei por completo a casa de Jacó”. O hebraico emprega um infinitivo absoluto com o verbo finito para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: A partícula dêitica introduz uma declaração solene e chama a atenção do ouvinte. “Eis que” preserva essa força em português bíblico claro e ainda corrente.
- source_word: עֵינֵי
  choice: os olhos de
  rationale: Mantém a imagem hebraica concreta da atenção concentrada de Deus, que neste contexto se dirige ao reino para julgá-lo.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: “Senhor” traduz אֲדֹנָי, enquanto “Yahweh” representa diretamente o nome divino, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: בַּמַּמְלָכָה הַחַטָּאָה
  choice: sobre o reino pecador
  rationale: A preposição, ligada à imagem dos olhos, indica atenção dirigida; “reino pecador” reproduz de modo conciso o adjetivo hebraico sem explicitar além do texto que essa atenção é hostil.
- source_word: וְהִשְׁמַדְתִּי אֹתָהּ
  choice: e eu o destruirei
  rationale: O hifil de שׁמד expressa destruição ou eliminação. “Destruirei” conserva a intensidade sem especificar indevidamente o modo.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face da terra
  rationale: Preserva a conhecida imagem hebraica de remoção total da superfície da terra, com formulação natural e intertextualmente reconhecível em português.
- source_word: אֶפֶס כִּי
  choice: Contudo
  rationale: A expressão introduz uma forte ressalva à sentença anterior. “Contudo” comunica claramente a virada adversativa.
- source_word: לֹא הַשְׁמֵיד אַשְׁמִיד
  choice: não destruirei completamente
  rationale: A construção com infinitivo absoluto e verbo finito enfatiza a negação da destruição total. A formulação preserva tanto a realidade do juízo quanto o limite declarado por Deus.
- source_word: אֶת בֵּית יַעֲקֹב
  choice: a casa de Jacó
  rationale: Mantém a expressão nacional e pactual tradicional para os descendentes de Jacó, preservando suas ressonâncias em outros textos bíblicos.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” comunica de forma digna e atual a fórmula profética, e “Yahweh” representa o nome divino presente no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה nas duas construções do versículo
  choice: Usar “Senhor Yahweh” em אֲדֹנָי יְהוִה e “Yahweh” em נְאֻם יְהוָה.
  alternative: Usar “Senhor DEUS” no primeiro caso e “o SENHOR” no segundo.
  rationale: A tradução distingue o título אֲדֹנָי do nome próprio יְהוָה e torna visível o nome divino sem produzir a repetição “Senhor SENHOR”.
- issue: Relação entre o juízo contra o reino e a preservação da casa de Jacó
  choice: Afirmar a destruição do reino pecador, mas negar a destruição completa da casa de Jacó.
  alternative: Entender a segunda afirmação apenas como redução da severidade do juízo, sem destaque para a preservação do povo.
  rationale: O hebraico contrapõe diretamente a destruição do reino à negação enfática da aniquilação total da casa de Jacó. A tradução conserva essa tensão entre juízo e preservação.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Conservam-se imagens hebraicas importantes (“os olhos”, “a face da terra”, “a casa de Jacó”) sem tornar a sintaxe artificial. O travessão antes da fórmula profética favorece a fluidez e identifica claramente o encerramento do oráculo.
