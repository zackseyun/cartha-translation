base_translation:
  language: en
  yaml_path: translation/ot/amos/007/007.yaml
  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
translation:
  language: pt
  text: 'Foi isto que ele me mostrou: e eis que o Senhor estava de pé junto a uma muralha feita com prumo[a], e tinha um prumo na mão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sobre uma muralha de prumo». A expressão hebraica é difícil. O substantivo אֲנָךְ provavelmente indica um prumo ou seu peso, embora também tenham sido propostos os materiais «chumbo» ou «estanho».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Foi isto que ele me mostrou
  rationale: Expressa de modo natural a fórmula de introdução da visão, preservando tanto a força demonstrativa de כֹּה quanto o sentido causativo do hifil de ראה.
- source_word: וְהִנֵּה
  choice: apresentação direta da cena após os dois-pontos
  rationale: A partícula chama a atenção para o que surge na visão. Em português atual, os dois-pontos seguidos da descrição direta comunicam essa vivacidade sem recorrer ao menos corrente «eis».
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino, distinguindo-o de um nome próprio e mantendo a forma consagrada e inteligível em português.
- source_word: נִצָּב
  choice: estava em pé
  rationale: O particípio apresenta uma situação em andamento dentro da visão; a locução preserva essa dimensão visual.
- source_word: עַל
  choice: junto a
  rationale: A preposição pode ter valor espacial amplo. «Junto a» produz uma cena natural sem decidir que o Senhor estivesse necessariamente sobre o topo da muralha.
- source_word: חוֹמַת אֲנָךְ
  choice: uma muralha feita com prumo
  rationale: Mantém a associação difícil entre a muralha e אֲנָךְ, entendendo o instrumento como empregado em sua construção, sem explicar excessivamente no corpo do texto.
- source_word: אֲנָךְ
  choice: prumo
  rationale: No contexto, designa provavelmente o instrumento ou peso usado para verificar o alinhamento vertical. «Prumo» é conciso, corrente na construção civil e permite representar as duas ocorrências pelo mesmo termo.
- source_word: וּבְיָדוֹ אֲנָךְ
  choice: e tinha um prumo na mão
  rationale: Formulação portuguesa natural que conserva claramente a imagem do objeto na mão do Senhor.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: Senhor
  rationale: O hebraico traz um título divino, não o Tetragrama. O artigo torna a frase natural em português e não acrescenta uma identificação denominacional.
- issue: Função simbólica do prumo
  choice: não explicitar no versículo
  alternative: parafrasear como instrumento de julgamento ou inspeção
  rationale: O versículo apresenta a imagem antes de sua interpretação no contexto seguinte. Explicitar aqui seu significado resolveria prematuramente a tensão da visão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Muralha» distingue חוֹמָה de uma parede comum; «prumo» conserva a repetição hebraica e o vocabulário concreto da construção.
