  source_fidelity: O texto traduz com fidelidade o hebraico. “Pois” introduz adequadamente a explicação de Amazias; “assim disse Amós” preserva a fórmula כֹה אָמַר; “morrerá à espada” comunica o instrumental בַּחֶרֶב; e “certamente partirá de sua terra para o exílio” conserva tanto a ênfase de גָּלֹה יִגְלֶה quanto o afastamento da terra indicado por מֵעַל אַדְמָתוֹ. A formulação não transforma indevidamente a voz ativa em passiva nem explicita um agente do exílio.
