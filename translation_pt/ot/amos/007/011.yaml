id: AMO.7.11
reference: Amos 7:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר עָמ֔וֹס בַּ/חֶ֖רֶב יָמ֣וּת יָרָבְעָ֑ם וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/011.yaml
  text: 'For this is what Amos has said: ‘Jeroboam will die by the sword[a], and Israel will surely go into exile from its land.’'
translation:
  language: pt
  text: 'Pois assim disse Amós: “Jeroboão morrerá à espada, e Israel certamente partirá de sua terra para o exílio[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certamente será exilado” ou “certamente será levado para o exílio”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.
    reason: Registra alternativas naturais para a construção enfática hebraica e explica sua forma.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Amazias e liga naturalmente esta declaração à acusação do versículo anterior.
- source_word: כֹה אָמַר
  choice: assim disse
  rationale: Preserva a fórmula hebraica de citação e, neste contexto, apresenta uma declaração anterior de Amós.
- source_word: עָמוֹס
  choice: Amós
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בַּחֶרֶב יָמוּת
  choice: morrerá à espada
  rationale: Expressão portuguesa natural que mantém o sentido instrumental de morte violenta.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional do nome em português.
- source_word: וְיִשְׂרָאֵל
  choice: e Israel
  rationale: Mantém o nome da entidade coletiva e política sem explicitação interpretativa desnecessária.
- source_word: גָּלֹה יִגְלֶה
  choice: certamente partirá ... para o exílio
  rationale: O advérbio transmite a ênfase da combinação hebraica de infinitivo absoluto com verbo finito, enquanto 'partirá para o exílio' conserva o movimento expresso pela forma ativa.
- source_word: מֵעַל אַדְמָתוֹ
  choice: de sua terra
  rationale: Tradução idiomática de מֵעַל com אַדָמָה; o possessivo singular acompanha Israel como entidade coletiva.
theological_decisions:
- issue: Referente de Israel e do sufixo possessivo em אַדְמָתוֹ
  choice: Israel como entidade nacional coletiva; “sua terra”
  alternative: “o povo de Israel ... a terra deles”
  rationale: O hebraico trata Israel como coletivo singular. A formulação portuguesa preserva essa característica sem individualizar nem ampliar o referente.
- issue: Voz e força enfática de גָּלֹה יִגְלֶה
  choice: “certamente partirá ... para o exílio”
  alternative: “certamente será exilado” ou “certamente será levado para o exílio”
  rationale: A escolha conserva tanto a ênfase da construção hebraica quanto sua forma ativa, sem determinar além do texto o agente responsável pelo exílio.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada em “partirá de sua terra para o exílio” para evitar uma sequência pouco natural em português, sem alterar as relações semânticas do hebraico.
