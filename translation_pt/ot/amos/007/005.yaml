  yaml_path: translation/ot/amos/007/005.yaml
  text: Then I said[a], “Lord GOD, please cease[b]. How can Jacob stand? For he is small.”
translation:
  language: pt
  text: 'Então eu disse: “Ó Senhor Yahweh[a], por favor, para! Como Jacó poderá ficar de pé?[b] Pois ele é pequeno.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Senhor Yahweh” (אֲדֹנָי יְהוִה), combinação do título “Senhor” com o nome divino Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Quem fará Jacó ficar de pé?” A expressão hebraica é concisa e permite esta leitura alternativa; no contexto, a pergunta também pode ser entendida como uma súplica porque Jacó não consegue permanecer de pé diante do juízo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então eu disse” expressa a sequência de modo natural em português.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: 'Preserva os dois elementos do título divino: אֲדֹנָי, “Senhor”, e o nome pessoal יהוה, transliterado “Yahweh”.'
- source_word: חֲדַל נָא
  choice: para, por favor
  rationale: O imperativo חֲדַל pede que a ação cesse, e נָא acrescenta o tom de súplica. A formulação é direta e natural na fala de intercessão.
- source_word: מִי יָקוּם יַעֲקֹב
  choice: Como Jacó poderá resistir?
  rationale: No contexto do juízo, “resistir” comunica a ideia de permanecer de pé ou sobreviver. A construção hebraica é incomum e admite outra análise, preservada em nota.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome empregado no hebraico como designação coletiva e personificada de Israel.
- source_word: כִּי קָטֹן הוּא
  choice: Pois ele é pequeno
  rationale: Conserva tanto a relação explicativa de כִּי quanto a imagem literal de pequenez em קָטֹן, sem substituí-la interpretativamente por “fraco”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: “Senhor Yahweh” torna explícitos o título אֲדֹנָי e o nome da aliança יהוה, sem produzir a repetição “Senhor SENHOR” nem ocultar o nome próprio.
- issue: Sentido da pergunta מִי יָקוּם יַעֲקֹב
  choice: Como Jacó poderá resistir?
  alternative: Quem levantará Jacó?
  rationale: O contexto favorece uma súplica sobre a incapacidade de Jacó suportar o juízo, mas a forma hebraica começa literalmente com “quem” e permite entender um agente que levanta Jacó; a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Para, por favor” mantém a urgência pessoal da intercessão; “pequeno” preserva a metáfora hebraica, e a ordem “Senhor Yahweh” conserva o título composto.
