  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּה֙ יוֹצֵ֣ר גֹּבַ֔י בִּ/תְחִלַּ֖ת עֲל֣וֹת הַ/לָּ֑קֶשׁ וְ/הִ֨נֵּה לֶ֔קֶשׁ אַחַ֖ר גִּזֵּ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], he was forming locusts at the beginning of the spring crop''s coming up, and behold[b], it was the spring crop after the king''s mowings.'
translation:
  language: pt
  text: 'Foi isto que o Senhor Yahweh me mostrou: eis que ele formava gafanhotos no começo da brotação da vegetação tardia; e eis que era a vegetação tardia depois dos cortes do rei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Vegetação tardia» também pode ser entendida como «crescimento posterior» ou «segunda brotação»: refere-se ao crescimento que vinha após um primeiro corte. Os «cortes do rei» provavelmente eram uma primeira colheita de capim ou forragem reservada como tributo real.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Assim me mostrou
  rationale: Reproduz de modo natural e digno a fórmula que introduz a visão, mantendo tanto a força demonstrativa de כֹּה como o sentido causativo de הִרְאַנִי.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e representa o nome divino como Yahweh, sem produzir a repetição artificial «Senhor SENHOR».
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a apresentação vívida e solene da cena profética; a segunda ocorrência foi conservada.
- source_word: יוֹצֵר
  choice: formava
  rationale: O particípio descreve uma ação em andamento dentro da visão.
- source_word: גֹּבַי
  choice: gafanhotos
  rationale: Designa insetos devoradores e, neste contexto de dano agrícola, «gafanhotos» é a opção portuguesa mais clara.
- source_word: בִּתְחִלַּת עֲלוֹת
  choice: quando ... começava a brotar
  rationale: Expressa naturalmente o início do surgimento ou crescimento da plantação.
- source_word: הַלָּקֶשׁ / לֶקֶשׁ
  choice: a plantação tardia / a plantação tardia
  rationale: לקש refere-se ao crescimento posterior, surgido após um corte anterior. A repetição do substantivo hebraico foi preservada, e «tardia» evita restringir o texto a uma estação cuja correspondência pode variar entre regiões.
- source_word: גִּזֵּי הַמֶּלֶךְ
  choice: os cortes do rei
  rationale: A expressão se refere provavelmente ao primeiro corte de capim ou forragem destinado ao rei; «cortes» é mais natural em português do que uma tradução formal como «tosquias».
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha conserva distintamente o título אֲדֹנָי e o nome próprio יְהוִה, em vez de substituir o nome divino por um título.
- issue: Agente de יוֹצֵר
  choice: ele formava gafanhotos
  alternative: formavam-se gafanhotos
  rationale: A forma masculina singular aponta naturalmente para o Senhor como agente. A tradução mantém essa relação gramatical sem ampliar sua interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eis que» foi mantido por sua função visionária; «plantação tardia» comunica o sentido agrícola sem empregar regionalismos ou linguagem excessivamente técnica.
