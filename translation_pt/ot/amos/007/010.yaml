  text: וַ/יִּשְׁלַ֗ח אֲמַצְיָה֙ כֹּהֵ֣ן בֵּֽית אֵ֔ל אֶל יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר קָשַׁ֨ר עָלֶ֜י/ךָ עָמ֗וֹס בְּ/קֶ֨רֶב֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹא תוּכַ֣ל הָ/אָ֔רֶץ לְ/הָכִ֖יל אֶת כָּל דְּבָרָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/010.yaml
  text: Then Amaziah[a], the priest of Bethel, sent word to Jeroboam king of Israel, saying, “Amos has conspired against you in the midst of the house of Israel[c][b]; the land is not able to bear all his words.”
translation:
  language: pt
  text: 'Então Amazias, sacerdote de Betel, mandou dizer a Jeroboão, rei de Israel: “Amós conspirou contra ti em meio à casa de Israel. A terra não pode suportar todas as suas palavras.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou dizer
  rationale: O verbo significa “enviou”; como לֵאמֹר introduz a mensagem e o objeto enviado fica implícito, “mandou dizer” expressa naturalmente em português o ato de enviar uma comunicação.
- source_word: כֹּהֵן בֵּית אֵל
  choice: sacerdote de Betel
  rationale: Preserva a cadeia construta e a associação institucional e cultual de Amazias com Betel.
- source_word: קָשַׁר עָלֶיךָ
  choice: conspirou contra ti
  rationale: קשר, com עַל indicando o alvo, formula uma acusação política de conspiração contra o rei. O pretérito perfeito é natural no discurso acusatório em português.
- source_word: בְּקֶרֶב בֵּית יִשְׂרָאֵל
  choice: no meio da casa de Israel
  rationale: Mantém tanto o sentido de atuação dentro da comunidade quanto a expressão profética e nacional “casa de Israel”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto, refere-se ao território ou país de Israel, não ao mundo inteiro; “terra” conserva a formulação hebraica sem perder clareza.
- source_word: לְהָכִיל
  choice: suportar
  rationale: O verbo denota capacidade de conter ou aguentar. “Suportar” comunica aqui tanto o peso retórico das palavras quanto a incapacidade alegada de tolerá-las.
- source_word: כָּל דְּבָרָיו
  choice: todas as suas palavras
  rationale: Preserva o plural דְּבָרִים e a abrangência de כָּל, em linguagem clara e digna.
theological_decisions:
- issue: Natureza da acusação de Amazias contra Amós
  choice: “Amós conspirou contra ti” como conteúdo da denúncia de Amazias
  alternative: “Amós tramou contra ti”
  rationale: O texto relata a caracterização hostil feita por Amazias ao rei; não afirma pela voz do narrador que Amós realmente tenha cometido traição. A tradução mantém a força política da acusação sem endossá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se “Betel”, “casa de Israel” e “todas as suas palavras” por seu valor textual e profético. O pronome “ti” combina naturalmente com a fala dirigida ao rei e evita alternância pronominal.
