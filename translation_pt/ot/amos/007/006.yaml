  text: נִחַ֥ם יְהוָ֖ה עַל זֹ֑את גַּם הִיא֙ לֹ֣א תִֽהְיֶ֔ה אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/006.yaml
  text: 'Yahweh relented concerning this also: “It too shall not happen,” said the Lord GOD[a].'
translation:
  language: pt
  text: Yahweh desistiu disso. “Isso também não acontecerá”, disse o Senhor Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mudou de ideia a respeito disso”. O hebraico usa linguagem humana para descrever a resposta de Yahweh à intercessão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: desistiu
  rationale: No nifal, o verbo pode indicar que alguém volta atrás ou desiste de uma ação anunciada. “Desistiu” expressa com naturalidade a resposta de Yahweh à intercessão, sem sugerir culpa moral e sem eliminar a força relacional do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: עַל זֹאת
  choice: disso
  rationale: Retoma de modo natural em português o juízo apresentado na visão e mantém o sentido de “a respeito disso”.
- source_word: גַּם הִיא
  choice: isso também
  rationale: Conserva tanto a referência anafórica ao juízo quanto a força aditiva de גַּם.
- source_word: לֹא תִהְיֶה
  choice: não acontecerá
  rationale: Embora a forma seja literalmente “não será”, o contexto exige o sentido idiomático de que o acontecimento anunciado não se realizará.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa de forma transparente a combinação do título אֲדֹנָי com o nome divino יְהוָה e a distingue da ocorrência isolada de Yahweh no início do versículo.
theological_decisions:
- issue: Linguagem antropopática acerca de Deus em נִחַם
  choice: Manter a linguagem relacional com “desistiu”.
  alternative: “mudou de ideia” ou “teve compaixão”
  rationale: O hebraico apresenta Yahweh respondendo à intercessão profética. A tradução preserva essa tensão sem impor uma explicação doutrinária sobre a imutabilidade divina nem enfraquecer o sentido direto do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “também” reflete a estrutura enfática do hebraico.
