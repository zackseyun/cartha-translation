  text: וַ/יֹּ֤אמֶר אֲמַצְיָה֙ אֶל עָמ֔וֹס חֹזֶ֕ה לֵ֥ךְ בְּרַח לְ/ךָ֖ אֶל אֶ֣רֶץ יְהוּדָ֑ה וֶ/אֱכָל שָׁ֣ם לֶ֔חֶם וְ/שָׁ֖ם תִּנָּבֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/012.yaml
  text: Then Amaziah said to Amos[a], “Seer, go, flee away to the land of Judah, and eat bread there, and prophesy there.”
translation:
  language: pt
  text: 'Então Amazias disse a Amós: “Vidente, vá, fuja para a terra de Judá, coma pão ali e profetize ali.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹזֶה
  choice: Vidente
  rationale: Preserva o termo específico para alguém que recebe visões, sem o nivelar ao termo mais comum para “profeta”.
- source_word: לֵךְ בְּרַח לְךָ
  choice: vá embora! Fuja
  rationale: Expressa a sequência enfática de imperativos e a força idiomática de afastamento pessoal presente em לְךָ, em português natural.
- source_word: אֶרֶץ יְהוּדָה
  choice: a terra de Judá
  rationale: Mantém o sentido geográfico e político explícito de אֶרֶץ.
- source_word: וֶאֱכָל שָׁם לֶחֶם
  choice: coma ali o seu pão
  rationale: Conserva a imagem concreta do hebraico, ao mesmo tempo que o possessivo torna a expressão natural em português; o provável sentido de sustento é indicado em nota.
- source_word: תִּנָּבֵא
  choice: profetize
  rationale: É o equivalente português claro e corrente do verbo hebraico padrão para exercer a fala profética.
- source_word: וַיֹּאמֶר
  choice: Então Amazias disse
  rationale: “Então” comunica naturalmente o avanço da narrativa marcado pela forma verbal hebraica.
theological_decisions:
- issue: Se a fala de Amazias deve explicitar que Amós ganhava a vida profetizando
  choice: Manter no texto a imagem “coma ali o seu pão”
  alternative: “ganhe ali o seu sustento” ou “vá ganhar a vida ali”
  rationale: O contexto provavelmente contém desprezo e apresenta Amós como alguém que deveria obter seu sustento em Judá. Contudo, o hebraico diz literalmente “comer pão”; preservar essa formulação evita tornar explícita uma acusação que permanece implícita, enquanto a nota esclarece o provável valor idiomático.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vidente” preserva a distinção lexical do hebraico; a pontuação dá força à ordem de expulsão sem introduzir conteúdo alheio ao texto.
