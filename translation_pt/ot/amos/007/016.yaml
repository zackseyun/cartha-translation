id: AMO.7.16
reference: Amos 7:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע דְּבַר יְהוָ֑ה אַתָּ֣ה אֹמֵ֗ר לֹ֤א תִנָּבֵא֙ עַל יִשְׂרָאֵ֔ל וְ/לֹ֥א תַטִּ֖יף עַל בֵּ֥ית יִשְׂחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/016.yaml
  text: 'And now[a], hear the word of Yahweh: You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’'
translation:
  language: pt
  text: 'E agora, ouça a palavra de Yahweh: “Você diz: ‘Não profetize contra Israel e não pregue[a] contra a casa de Isaque.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não derrame palavras contra a casa de Isaque”. O verbo hebraico significa literalmente “gotejar” e é usado aqui de modo figurado para a fala profética.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o advérbio temporal e introduz de modo natural a resposta imediata de Amós.
- source_word: שְׁמַע
  choice: ouça
  rationale: Imperativo singular dirigido a Amazias; é direto, atual e adequado ao registro profético.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética e o peso revelatório de דָּבָר, além de transliterar diretamente o nome divino.
- source_word: אַתָּה אֹמֵר
  choice: Você diz
  rationale: O pronome explícito dá ênfase ao destinatário, e o presente expressa naturalmente a declaração atribuída a Amazias.
- source_word: לֹא תִנָּבֵא עַל יִשְׂרָאֵל
  choice: Não profetize contra Israel
  rationale: A construção negativa tem força proibitiva, e עַל assume sentido adversativo no contexto de denúncia profética.
- source_word: וְלֹא תַטִּיף
  choice: e não pregue
  rationale: O hifil de נטף, literalmente associado a gotejar ou derramar, funciona aqui como expressão idiomática para proferir discurso profético; “pregue” comunica essa função sem repetir “profetize”.
- source_word: עַל בֵּית יִשְׂחָק
  choice: contra a casa de Isaque
  rationale: “Contra” mantém o paralelismo adversativo, enquanto “casa de Isaque” preserva a designação poética e pactual de Israel.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Relação da profecia com Israel
  choice: contra Israel / contra a casa de Isaque
  alternative: a Israel / acerca de Israel
  rationale: No contexto, Amazias procura impedir uma mensagem profética de denúncia. “Contra” preserva essa força, embora עַל possa ter outros sentidos em contextos diferentes.
- issue: Sentido figurado de תַטִּיף
  choice: pregue, com nota sobre a metáfora
  alternative: derrame palavras; profetize
  rationale: A tradução principal comunica a função idiomática em português corrente, e a nota conserva a imagem hebraica sem torná-la artificial no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna explícito o pronome enfático e mantém o singular dirigido a Amazias. “Isaque” segue a forma bíblica corrente em português. A pontuação distingue a fala de Amós da citação das palavras de Amazias.
