source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר יְהוָ֗ה אִשְׁתְּ/ךָ֞ בָּ/עִ֤יר תִּזְנֶה֙ וּ/בָנֶ֤י/ךָ וּ/בְנֹתֶ֨י/ךָ֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/אַדְמָתְ/ךָ֖ בַּ/חֶ֣בֶל תְּחֻלָּ֑ק וְ/אַתָּ֗ה עַל אֲדָמָ֤ה טְמֵאָה֙ תָּמ֔וּת וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/017.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘Your wife will prostitute herself in the city, and your sons and your daughters will fall by the sword, and your land will be divided by measuring line; and you yourself will die on unclean land[c][b], and Israel will surely go into exile from its land.’'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh: “Sua mulher se prostituirá[a] na cidade; seus filhos e suas filhas cairão à espada; sua terra será repartida por linha de medir[b]; você mesmo morrerá em terra impura; e Israel certamente irá para o exílio de sua terra[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agirá como prostituta”. O verbo hebraico descreve prostituição de forma direta.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “será repartida por linha/cordel”, isto é, pelo cordel usado para medir e distribuir terras.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica repete a raiz verbal para dar ênfase ou certeza ao exílio.
    reason: source_form
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Preserva a relação de consequência judicial e soa natural no português atual.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Mantém a fórmula profética solene e verte diretamente o nome divino conforme a prática do projeto.
- source_word: תִּזְנֶה
  choice: se prostituirá
  rationale: Expressa de modo direto e atual o verbo hebraico זנה, sem suavizar a severidade do anúncio.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: seus filhos e suas filhas
  rationale: Conserva o par explicitamente expresso no hebraico, em vez de generalizá-lo como “seus filhos” ou “seus descendentes”.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: cairão à espada
  rationale: Preserva a conhecida expressão hebraica para morte violenta em guerra, com tom solene e compreensível.
- source_word: בַּחֶבֶל תְּחֻלָּק
  choice: será repartida com uma linha de medir
  rationale: Torna claro que חֶבֶל é o cordel usado para medir e repartir a terra conquistada, sem transformar a imagem em mera paráfrase.
- source_word: וְאַתָּה
  choice: você mesmo
  rationale: Reproduz a ênfase do pronome pessoal explícito no hebraico.
- source_word: עַל אֲדָמָה טְמֵאָה
  choice: em terra impura
  rationale: Mantém a caracterização teológica da terra estrangeira como impura sem explicar ou restringir seu sentido no corpo do texto.
- source_word: גָּלֹה יִגְלֶה
  choice: certamente irá para o exílio
  rationale: A construção com infinitivo absoluto intensifica a forma verbal; “certamente” comunica sua ênfase ou certeza em português natural.
- source_word: מֵעַל אַדְמָתוֹ
  choice: para longe de sua terra
  rationale: Expressa o afastamento indicado pela preposição composta מֵעַל no contexto do exílio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Usa a forma adotada pelo projeto e conserva o caráter pessoal e pactual do nome na fórmula profética.
- issue: Sentido de “terra impura”
  choice: Preservar literalmente a descrição sem explicá-la no texto principal
  alternative: Explicitar “terra estrangeira” ou “terra ritualmente impura”
  rationale: O contexto associa a expressão ao exílio fora da terra de Israel, mas a tradução não elimina a tensão entre as dimensões territorial, ritual e moral do termo.
- issue: Força da construção גָּלֹה יִגְלֶה
  choice: certamente irá para o exílio
  alternative: será levado para o exílio; irá para o exílio
  rationale: A formulação escolhida conserva a ênfase ou certeza da construção hebraica sem atribuir explicitamente uma voz passiva que o original não exige.
translation_notes:
  register: Português moderno, solene e de ampla compreensão, com boa legibilidade brasileira. Mantiveram-se o paralelismo da sentença, a dureza do juízo e as imagens concretas do hebraico. Os pontos e vírgulas tornam clara a sequência de anúncios sem fragmentá-la excessivamente.
