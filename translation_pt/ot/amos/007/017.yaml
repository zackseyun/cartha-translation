  to: 'Por isso, assim diz Yahweh: “Sua mulher se prostituirá[a] na cidade; seus filhos e suas filhas cairão à espada; sua terra será repartida por linha de medir[b]; você mesmo morrerá em terra impura; e Israel certamente irá para o exílio de sua terra[c].”'
  rationale: A revisão elimina a expansão interpretativa “para longe”, ajustando-a a “de sua terra”, e torna mais natural e fiel a formulação referente ao cordel de medição. As demais escolhas preservam adequadamente o sentido, o registro profético e a força do original.
