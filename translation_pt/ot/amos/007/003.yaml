  text: נִחַ֥ם יְהוָ֖ה עַל זֹ֑את לֹ֥א תִהְיֶ֖ה אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/003.yaml
  text: 'Yahweh relented concerning this: “It will not happen,” said Yahweh[a].'
translation:
  language: pt
  text: 'Yahweh voltou atrás quanto a isso: “Isso não acontecerá”, disse Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Yahweh mudou de ideia quanto a isso” ou “Yahweh lamentou isso”. O verbo hebraico pode expressar voltar atrás, lamentar ou mudar uma ação pretendida, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: voltou atrás
  rationale: No contexto da intercessão profética, o nifal de נחם indica que Yahweh revoga a ação de juízo anunciada. “Voltou atrás” expressa em português corrente a mudança da ação pretendida, sem sugerir arrependimento por pecado ou erro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל זֹאת
  choice: quanto a isso
  rationale: Retoma de modo natural a calamidade apresentada na visão anterior, sem especificar além do que o hebraico diz.
- source_word: לֹא תִהְיֶה
  choice: Isso não acontecerá
  rationale: A forma feminina singular refere-se ao acontecimento ou à calamidade implícita na visão. A formulação é clara e idiomática em português moderno.
- source_word: אָמַר יְהוָה
  choice: disse Yahweh
  rationale: Reproduz de maneira direta o qatal simples de אמר, sem transformá-lo na fórmula mais forte “declara Yahweh”.
theological_decisions:
- issue: Linguagem antropopática sobre Deus em נִחַם יְהוָה
  choice: “Yahweh voltou atrás”, preservando a descrição de que ele retirou o juízo anunciado em resposta à intercessão.
  alternative: “Yahweh mudou de ideia”; “Yahweh se arrependeu”; “Yahweh teve compaixão”.
  rationale: “Voltou atrás” mantém a tensão teológica e o sentido contextual de mudança na ação pretendida, sem implicar pecado ou erro da parte de Deus. A nota registra outras possibilidades legítimas do verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Voltou atrás quanto a isso” equilibra naturalidade e proximidade ao hebraico; o pronome “Isso” retoma a calamidade implícita. O marcador [a] aparece no texto principal.
