base_translation:
  language: en
  yaml_path: translation/ot/amos/007/013.yaml
  text: But at Bethel you must not prophesy any longer[a], for it is the king’s sanctuary[b], and it is a royal house.
translation:
  language: pt
  text: Em Betel, porém, não continue mais a profetizar[a], pois este é o santuário do rei[b] e a casa do reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não profetize mais” ou “não profetize outra vez”. Literalmente, o hebraico diz: “não acrescente mais profetizar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um santuário real”. A expressão indica um santuário pertencente ou ligado ao rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵית אֵל
  choice: Mas ... em Betel
  rationale: A conjunção dá continuidade à fala de Amazias com valor adversativo em relação à ordem anterior de ir para Judá; a preposição é locativa.
- source_word: לֹא תוֹסִיף עוֹד לְהִנָּבֵא
  choice: não volte a profetizar
  rationale: A construção com יסף, עוד e infinitivo exprime repetição ou continuação. Esta formulação natural preserva aqui a proibição de profetizar novamente, sem tentar decidir entre todas as nuances possíveis.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada por Amazias para a proibição.
- source_word: מִקְדַּשׁ מֶלֶךְ
  choice: o santuário do rei
  rationale: Mantém de modo direto a relação de posse ou associação expressa pelo construto hebraico, sem legitimar teologicamente o culto de Betel.
- source_word: וּ/בֵית מַמְלָכָה
  choice: e a casa do reino
  rationale: Preserva a metáfora e a forma construta do hebraico, que designa Betel como instituição ligada ao poder monárquico, evitando a interpretação mais explícita 'templo estatal'.
- source_word: הוּא ... הוּא
  choice: este é ... e [é]
  rationale: O primeiro pronome foi explicitado de modo natural; a cópula do segundo predicado fica elíptica em português, sem perda da dupla caracterização enfática.
theological_decisions:
- issue: Natureza da designação de Betel na fala de Amazias
  choice: Apresentar Betel como 'o santuário do rei' e 'a casa do reino', descrevendo a alegação político-religiosa de Amazias sem endossar a legitimidade desse culto.
  alternative: Interpretar de forma mais explícita como 'santuário real' e 'templo do Estado'.
  rationale: O versículo relata a justificativa de Amazias para silenciar Amós. A tradução deve manter tanto o vínculo com o rei quanto com o reino, mas não deve introduzir aprovação teológica nem substituir a imagem hebraica por uma explicação institucional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. 'Não volte a profetizar' é idiomático sem perder a nuance de repetição; 'casa do reino' conserva deliberadamente a metáfora política do original.
