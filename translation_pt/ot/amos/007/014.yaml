  text: וַ/יַּ֤עַן עָמוֹס֙ וַ/יֹּ֣אמֶר אֶל אֲמַצְיָ֔ה לֹא נָבִ֣יא אָנֹ֔כִי וְ/לֹ֥א בֶן נָבִ֖יא אָנֹ֑כִי כִּֽי בוֹקֵ֥ר אָנֹ֖כִי וּ/בוֹלֵ֥ס שִׁקְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
translation:
  language: pt
  text: 'Então Amós respondeu e disse a Amazias: “Eu não sou profeta nem filho de profeta[a]; pelo contrário, sou criador de gado e trato de figos de sicômoro[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “filho de profeta” pode indicar um membro de um grupo de profetas, e não necessariamente um descendente literal de profeta.
    reason: lexical_alternative
  - marker: b
    text: Ou “cultivo figos de sicômoro” ou “faço incisões em figos de sicômoro”. O termo hebraico raro provavelmente se refere ao cultivo ou preparo do fruto da figueira-sicômoro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Na fórmula narrativa, ענה significa responder; a tradução mantém a sequência hebraica com o verbo seguinte.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Equivalente corrente de אמר na introdução do discurso direto; preservar os dois verbos reproduz a cadência do hebraico sem prejudicar a clareza.
- source_word: לֹא נָבִיא אָנֹכִי
  choice: Eu não sou profeta
  rationale: Tradução direta da oração nominal, mantendo a negação e a ênfase do pronome explícito.
- source_word: וְלֹא בֶן נָבִיא אָנֹכִי
  choice: nem filho de profeta
  rationale: Preserva o idioma hebraico e sua possível referência tanto à descendência literal quanto à vinculação a um grupo profético.
- source_word: כִּי
  choice: pelo contrário
  rationale: Neste contexto, כִּי introduz a autodescrição que contrasta com as duas negações anteriores.
- source_word: בוֹקֵר
  choice: criador de gado
  rationale: O termo designa alguém que trabalha com gado bovino ou rebanhos, não especificamente um pastor de ovelhas; esta expressão é clara em português internacional.
- source_word: וּבוֹלֵס שִׁקְמִים
  choice: trato de figos de sicômoro
  rationale: O raro particípio בולס parece indicar o cuidado ou preparo do fruto, talvez por incisões; a formulação principal comunica a ocupação agrícola sem impor a técnica exata.
- source_word: שִׁקְמִים
  choice: figos de sicômoro
  rationale: Refere-se ao fruto da figueira-sicômoro, e não ao plátano ou a outras árvores chamadas sicômoro em contextos modernos.
theological_decisions:
- issue: Se Amós nega absolutamente ser profeta ou apenas ser profeta profissional ou membro de um grupo profético
  choice: 'Manter a negação literal: “Eu não sou profeta nem filho de profeta”.'
  alternative: Explicitar “não sou profeta profissional” ou entender a frase como referência apenas à ocupação anterior de Amós.
  rationale: O contexto apresenta Amós proclamando a palavra de Deus, mas o hebraico não resolve diretamente a tensão. A tradução, portanto, não acrescenta uma qualificação institucional ou temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Criador de gado” evita regionalismos como “boieiro” ou “vaqueiro”; “trato de figos de sicômoro” conserva a incerteza quanto à atividade agrícola específica.
