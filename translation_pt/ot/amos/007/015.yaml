source:
  edition: WLC
  text: וַ/יִּקָּחֵ֣/נִי יְהוָ֔ה מֵ/אַחֲרֵ֖י הַ/צֹּ֑אן וַ/יֹּ֤אמֶר אֵלַ/י֙ יְהוָ֔ה לֵ֥ךְ הִנָּבֵ֖א אֶל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
translation:
  language: pt
  text: 'Mas Yahweh me tirou de trás do rebanho[a], e Yahweh me disse: “Vá, profetize ao meu povo Israel[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de cuidar do rebanho”. A expressão hebraica diz literalmente “de trás do rebanho”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “ao meu povo Israel”, não “contra o meu povo Israel”. Embora o contexto inclua uma mensagem de juízo, este versículo não explicita essa ideia na preposição.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵנִי
  choice: me tirou
  rationale: O verbo לקח significa normalmente “tomar”; com a expressão de origem introduzida por מִן, “me tirou” comunica de modo natural que Yahweh retirou Amós de sua ocupação anterior e o chamou ao serviço profético, sem sugerir violência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando seu caráter de nome próprio em vez de substituí-lo por um título.
- source_word: מֵאַחֲרֵי הַצֹּאן
  choice: de detrás do rebanho
  rationale: Reproduz de perto a imagem espacial do idioma hebraico, segundo a qual o pastor vai atrás do rebanho, sem restringir צֹאן apenas a ovelhas.
- source_word: וַיֹּאמֶר אֵלַי
  choice: me disse
  rationale: Equivalente português direto e natural de אמר seguido de אֶל.
- source_word: לֵךְ
  choice: Vá
  rationale: Preserva de forma concisa a força do imperativo que inicia a comissão.
- source_word: הִנָּבֵא
  choice: profetize
  rationale: O imperativo de נבא designa o ato de proclamar como profeta; “profetize” é preciso, corrente e conciso.
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: ao meu povo Israel
  rationale: A preposição אֶל indica aqui a direção da proclamação, “a/para”, enquanto “meu povo” conserva a afirmação de pertencimento pactual. A formulação evita inserir “contra”, ideia não expressa por esta frase.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz explicitamente o nome divino. A transliteração “Yahweh” preserva o nome próprio, sem substituí-lo por um título.
- issue: Direção ou caráter da profecia dirigida a Israel
  choice: ao meu povo Israel
  alternative: contra o meu povo Israel
  rationale: Embora o contexto inclua juízo, אֶל significa naturalmente “a/para”. A tradução não antecipa nem acrescenta uma força hostil que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega próclise em “me tirou” e “me disse”, natural no português brasileiro, e mantém a repetição de “Yahweh” presente no hebraico. A construção “de detrás do rebanho” conserva a imagem pastoral, esclarecida em nota.
