id: AMO.7.9
reference: Amos 7:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָשַׁ֨מּוּ֙ בָּמ֣וֹת יִשְׂחָ֔ק וּ/מִקְדְּשֵׁ֥י יִשְׂרָאֵ֖ל יֶחֱרָ֑בוּ וְ/קַמְתִּ֛י עַל בֵּ֥ית יָרָבְעָ֖ם בֶּ/חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/009.yaml
  text: The high places of Isaac will be made desolate[a], and the sanctuaries of Israel will be laid waste[c][b]; and I will rise against the house of Jeroboam with the sword.
translation:
  language: pt
  text: Os lugares altos de Isaque ficarão desolados[a], e os santuários de Israel serão devastados; eu me levantarei contra a casa de Jeroboão com a espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão devastados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: ficarão desolados
  rationale: O nifal de שׁמם indica entrar em estado de desolação ou ser devastado. A formulação é natural em português e preserva o sentido resultativo, sem decidir entre processo e agente implícito.
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Expressão bíblica corrente e compreensível para os locais de culto situados em elevações ou assim designados.
- source_word: יִשְׂחָק
  choice: Isaque
  rationale: Mantém o nome próprio presente no hebraico, usado aqui poeticamente para o povo do reino do norte, sem substituí-lo interpretativamente por Israel.
- source_word: וּמִקְדְּשֵׁי
  choice: e os santuários de
  rationale: מקדשׁ designa um lugar sagrado ou santuário; esta escolha preserva com clareza o sentido cultual.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Preserva o nome do texto, que neste contexto se refere ao reino do norte.
- source_word: יֶחֱרָבוּ
  choice: serão devastados
  rationale: O verbo חרב comunica ruína e desolação. A escolha exprime julgamento severo e evita uma repetição estilisticamente pesada de 'desolados'.
- source_word: וְקַמְתִּי עַל
  choice: eu me levantarei contra
  rationale: Reproduz a imagem hebraica de Deus se erguendo em oposição ativa e hostil, em linguagem portuguesa natural e solene.
- source_word: בֵּית יָרָבְעָם
  choice: a casa de Jeroboão
  rationale: Conserva o idioma dinástico e familiar de בית. 'Dinastia de Jeroboão' seria mais explícito, porém interpretativo.
- source_word: בֶּחָרֶב
  choice: com a espada
  rationale: Tradução direta do instrumento ou meio do juízo violento, preservando a imagem concreta do hebraico.
theological_decisions:
- issue: Referente de “Isaque”
  choice: Manter “Isaque” no texto principal como designação poética do povo ligado ao reino do norte.
  alternative: Substituir por “Israel” para explicitar o referente.
  rationale: O hebraico emprega intencionalmente o nome Isaque. Substituí-lo eliminaria uma característica literária e pactual do texto.
- issue: Natureza da ação divina em “eu me levantarei contra”
  choice: Expressar oposição e juízo divinos diretos.
  alternative: Empregar a formulação mais fraca “agirei contra”.
  rationale: קום על apresenta Deus tomando pessoalmente posição contra a casa de Jeroboão; a imagem judicial e militar não deve ser atenuada.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. A tradução conserva o paralelismo, a designação poética “Isaque”, a imagem de Deus se levantando contra a dinastia e a metáfora concreta da espada.
