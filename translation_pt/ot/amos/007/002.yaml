  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם כִּלָּה֙ לֶֽ/אֱכוֹל֙ אֶת עֵ֣שֶׂב הָ/אָ֔רֶץ וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ סְֽלַֽח נָ֔א מִ֥י יָק֖וּם יַֽעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/002.yaml
  text: And when it had finished eating the vegetation of the land[a], I said, “Lord GOD, please forgive! How can Jacob stand? For he is small.”
translation:
  language: pt
  text: 'Quando o enxame acabou de devorar a vegetação da terra, eu disse: “Senhor DEUS, perdoa, por favor! Como Jacó poderá ficar de pé?[a] Pois ele é pequeno.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem levantará Jacó?”'
    reason: O hebraico permite entender קום com uma nuance restauradora, embora o contexto favoreça a pergunta sobre a capacidade de Jacó permanecer de pé.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Quando
  rationale: A expressão introduz temporalmente o acontecimento seguinte da visão; aqui אִם tem sentido de “quando”, não de condição.
- source_word: כִּלָּה לֶאֱכוֹל
  choice: acabou de devorar
  rationale: כלה com infinitivo indica a conclusão da ação. “Devorar” comunica naturalmente a destruição causada pelo enxame, sem perder o sentido básico de comer.
- source_word: עֵשֶׂב הָאָרֶץ
  choice: a vegetação da terra
  rationale: עֵשֶׂב abrange capim, ervas e plantas; “vegetação” evita restringir indevidamente o alcance. No contexto, הָאָרֶץ designa a terra do povo, não necessariamente o planeta.
- source_word: וָאֹמַר
  choice: eu disse
  rationale: Tradução direta e natural da forma narrativa.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e apresenta o nome divino distintamente, evitando a repetição artificial “Senhor SENHOR”.
- source_word: סְלַח נָא
  choice: perdoa, por favor
  rationale: Mantém tanto o pedido de perdão quanto a força suplicante de נָא em português atual.
- source_word: מִי יָקוּם יַעֲקֹב
  choice: Como Jacó poderá ficar de pé?
  rationale: No contexto da devastação, a pergunta expressa a incapacidade de Jacó de resistir ou sobreviver. “Ficar de pé” preserva a imagem do verbo קום.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome pactual empregado no hebraico, em vez de substituí-lo interpretativamente por “Israel”.
- source_word: כִּי קָטֹן הוּא
  choice: Pois ele é pequeno
  rationale: “Pequeno” conserva a amplitude da metáfora, que pode envolver fraqueza numérica, política ou existencial.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A tradução distingue o título אֲדֹנָי do nome pactual יהוה e evita ocultar este último sob um título genérico.
- issue: Sentido de מִי יָקוּם יַעֲקֹב
  choice: Como Jacó poderá ficar de pé?
  alternative: Quem levantará Jacó?
  rationale: A leitura principal entende a pergunta como lamento pela incapacidade de Jacó resistir ao juízo. A possível nuance restauradora ou causativa permanece em nota, sem eliminar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma verbal “perdoa” dirige-se diretamente a Deus sem arcaísmo excessivo. O sujeito de “acabou” permanece implícito, como no hebraico, e é recuperável do enxame mencionado no versículo anterior.
