base_translation:
  language: en
  yaml_path: translation/ot/amos/007/004.yaml
  text: 'This is what the Lord GOD showed me: behold[a], the Lord GOD was calling for a judgment by fire[b], and it consumed the great deep and was consuming the land.'
translation:
  language: pt
  text: 'Foi isto que o Senhor Yahweh me mostrou: eis que o Senhor Yahweh chamava para uma contenda[a] por meio do fogo. O fogo consumiu o grande abismo e estava consumindo a porção[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chamava para contender por meio do fogo»; o termo hebraico também pode ter o sentido judicial de uma causa ou julgamento.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o quinhão ou território; provavelmente se refere à terra destinada como porção.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Assim me mostrou
  rationale: Reproduz de modo natural a fórmula que introduz o relato da visão profética, mantendo a força demonstrativa de כֹּה e o sentido causativo de הִרְאַנִי.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Preserva os dois elementos do título composto: אֲדֹנָי como «Senhor» e o nome divino יְהוִה como «Yahweh», sem produzir a repetição artificial «Senhor SENHOR».'
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a vivacidade e o caráter de apresentação imediata da visão em registro bíblico digno e ainda corrente.
- source_word: קֹרֵא לָרִב בָּאֵשׁ
  choice: convocava uma contenda por meio do fogo
  rationale: O particípio קֹרֵא apresenta a ação em andamento; ריב conserva a ideia de disputa ou procedimento judicial, e בָּאֵשׁ indica o fogo como meio.
- source_word: וַתֹּאכַל
  choice: O fogo consumiu
  rationale: O verbo feminino retoma אֵשׁ no hebraico. A repetição explícita de «o fogo» evita ambiguidade em português e «consumiu» expressa naturalmente a imagem de devorar.
- source_word: תְּהוֹם רַבָּה
  choice: o grande abismo
  rationale: Conserva a expressão bíblica para as águas profundas ou o abismo, sem restringi-la a uma interpretação cosmológica específica.
- source_word: וְאָכְלָה
  choice: e estava consumindo
  rationale: Apresenta a segunda ação como ainda em curso no desenvolvimento da visão, em contraste com o consumo já efetuado do grande abismo.
- source_word: הַחֵלֶק
  choice: a porção
  rationale: Traduz diretamente o sentido de «parte, porção, quinhão» e evita identificar sem indicação explícita o referente como toda a terra; a nota registra a provável referência territorial.
theological_decisions:
- issue: Forma portuguesa do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR / o Senhor Deus
  rationale: A tradução mantém tanto o título אֲדֹנָי quanto o nome da aliança יְהוִה, sem ocultar este último sob um título substituto.
- issue: Caráter judicial de ריב
  choice: uma contenda
  alternative: um julgamento / contender
  rationale: «Contenda» preserva a amplitude do termo hebraico, que pode descrever disputa, acusação ou ação judicial, sem resolver a imagem exclusivamente como sentença já pronunciada.
- issue: Referente de הַחֵלֶק
  choice: a porção
  alternative: a terra / o território
  rationale: O hebraico não nomeia diretamente a terra. A tradução conserva essa indeterminação, enquanto a nota informa a provável referência a uma porção territorial.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. «Eis que» conserva o tom visionário sem arcaísmo excessivo. A repetição de «o fogo» torna explícito o referente exigido pela diferença de gênero gramatical entre o hebraico e o português. Todos os marcadores de nota aparecem junto aos termos pertinentes.
