  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר אֲנָ֑ךְ וַ/יֹּ֣אמֶר אֲדֹנָ֗/י הִנְ/נִ֨י שָׂ֤ם אֲנָךְ֙ בְּ/קֶ֨רֶב֙ עַמִּ֣/י יִשְׂרָאֵ֔ל לֹֽא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
translation:
  language: pt
  text: 'E Yahweh me disse: “O que você vê, Amós?” Eu respondi: “Um prumo[a]”. Então o Senhor disse: “Veja! Estou pondo um prumo no meio do meu povo Israel; não voltarei a passar por ele[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “estanho”, “chumbo” ou “peso de prumo”. O termo hebraico provavelmente se refere a um instrumento de medição ou ao material associado a um prumo.
    reason: lexical_alternative
  - marker: b
    text: “Não voltarei a passar por ele” provavelmente significa “não tornarei a poupá-lo” ou “não continuarei relevando seus pecados”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal e o distingue do título אֲדֹנָי empregado mais adiante no mesmo versículo.
- source_word: מָה אַתָּה רֹאֶה
  choice: O que você vê
  rationale: Expressa de modo natural em português a pergunta no presente feita no contexto imediato da visão.
- source_word: אֲנָךְ
  choice: prumo
  rationale: No contexto de Amós 7:7-8, designa mais provavelmente o instrumento, ou sua linha com peso, usado para verificar o alinhamento vertical. A referência exata do termo hebraico é discutida e fica indicada em nota.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino e mantém sua distinção em relação ao nome Yahweh no início do versículo.
- source_word: הִנְנִי
  choice: Veja! Estou
  rationale: Conserva a função de chamar a atenção para a declaração divina, em linguagem portuguesa atual.
- source_word: שָׂם
  choice: pondo
  rationale: Reproduz o valor participial e a vivacidade da cena; “pôr um prumo” é uma combinação natural em português.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: Preserva a imagem espacial de colocar o padrão de medição dentro do próprio povo de Israel.
- source_word: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: não voltarei a passar por ele
  rationale: Mantém a imagem e a forma idiomática do hebraico. O pronome singular retoma coletivamente “meu povo Israel”; a implicação de não mais poupar ou relevar é esclarecida em nota.
theological_decisions:
- issue: Distinção entre o nome e o título divinos
  choice: Traduzir יְהוָה por “Yahweh” e אֲדֹנָי por “o Senhor”
  alternative: Traduzir ambos por “o Senhor”
  rationale: O texto usa deliberadamente duas formas diferentes. Mantê-las distintas preserva uma nuance do original sem acrescentar interpretação denominacional.
- issue: Expressão de juízo em לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: Conservar no texto a expressão “não voltarei a passar por ele” e explicar sua provável implicação em nota
  alternative: Traduzir diretamente por “não tornarei a poupá-lo” ou “não continuarei relevando seus pecados”
  rationale: A tradução conserva a metáfora e a tensão do hebraico, enquanto a nota torna acessível seu provável sentido no contexto de juízo iminente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” torna natural a pergunta direta; “Veja!” comunica a força de הִנְנִי sem recorrer ao arcaizante “eis”. A repetição mecânica de todas as conjunções narrativas foi suavizada, mas a sequência do diálogo e a distinção entre Yahweh e o Senhor foram preservadas.
