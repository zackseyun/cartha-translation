  source_fidelity: 'O texto traduz fielmente a sequência narrativa e os elementos principais do hebraico: Hamã relata os acontecimentos a Zeres e aos amigos; seus sábios e Zeres respondem; a condição relativa à descendência judaica de Mardoqueu, o início da queda, a incapacidade de prevalecer e a certeza da queda final são todos preservados. A repetição retórica de «cair» e de «diante» foi mantida.'
