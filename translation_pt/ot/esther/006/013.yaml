  terminology: «Hamã», «Zeres» e «Mardoqueu» são formas bíblicas portuguesas reconhecíveis. «Seus sábios» preserva de modo apropriado o termo hebraico para os homens sábios de Hamã, sem impor a interpretação mais específica «conselheiros». «Descendência dos judeus» comunica corretamente o sentido de linhagem; a nota registra a imagem literal de «semente».
