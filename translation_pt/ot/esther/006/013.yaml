base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: pt
  text: 'Então Hamã contou a Zeres, sua mulher, e a todos os seus amigos tudo o que lhe havia acontecido. Seus sábios e Zeres, sua mulher, lhe disseram: “Se Mardoqueu, diante de quem você começou a cair, é da descendência dos judeus[a], você não conseguirá vencê-lo; certamente cairá diante dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit., “da semente dos judeus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: contou
  rationale: O verbo introduz o relato feito por Hamã; “contou” é natural em português e comunica adequadamente que ele narrou os acontecimentos.
- source_word: אֹהֲבָיו
  choice: seus amigos
  rationale: Embora o termo designe literalmente os que o amavam, neste contexto social e cortesão refere-se aos amigos ou companheiros de Hamã.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: tudo o que lhe havia acontecido
  rationale: A construção indica tudo o que sobreveio a Hamã; o mais-que-perfeito composto esclarece que esses fatos antecederam o relato.
- source_word: חֲכָמָיו
  choice: seus sábios
  rationale: Preserva o sentido lexical e a ambientação cortesã, sem reduzir necessariamente essas figuras a meros conselheiros administrativos.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: se é da descendência dos judeus
  rationale: Neste contexto, זֶרַע denota linhagem ou descendência. A formulação escolhida é clara e natural; a imagem literal de “semente” é registrada em nota.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: diante de quem você começou a cair
  rationale: Mantém tanto o aspecto inicial expresso por החל quanto a imagem de queda, cuja repetição é retoricamente importante no restante da fala.
- source_word: לֹא תוּכַל לוֹ
  choice: você não conseguirá vencê-lo
  rationale: יכל com ל expressa incapacidade em relação a alguém; no contexto de conflito, significa não conseguir prevalecer contra Mardoqueu.
- source_word: נָפוֹל תִּפּוֹל
  choice: certamente cairá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da queda; “certamente” reproduz essa ênfase de modo idiomático.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: A expressão repetida retrata a derrota de Hamã em relação a Mardoqueu e preserva a ligação verbal com a oração anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “cair” e “diante” foi preservada por seu valor retórico, enquanto “descendência” evita uma formulação excessivamente literal no texto principal.
