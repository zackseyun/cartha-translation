  to: 'Que o manto e o cavalo sejam confiados a um dos nobres oficiais do rei. Que vistam o homem a quem o rei deseja honrar com o manto, façam-no montar no cavalo e o levem sobre o cavalo pela praça da cidade, proclamando diante dele: “Assim se fará ao homem a quem o rei deseja honrar!”'
