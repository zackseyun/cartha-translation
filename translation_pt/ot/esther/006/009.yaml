  text: וְ/נָת֨וֹן הַ/לְּב֜וּשׁ וְ/הַ/סּ֗וּס עַל יַד אִ֞ישׁ מִ/שָּׂרֵ֤י הַ/מֶּ֨לֶךְ֙ הַֽ/פַּרְתְּמִ֔ים וְ/הִלְבִּ֨ישׁוּ֙ אֶת הָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּֽ/יקָר֑/וֹ וְ/הִרְכִּיבֻ֤/הוּ עַל הַ/סּוּס֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/קָרְא֣וּ לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: pt
  text: 'Que o manto e o cavalo sejam confiados a um dos nobres oficiais do rei. Que vistam o homem a quem o rei deseja honrar com o manto, façam-no montar no cavalo e o levem sobre o cavalo pela praça da cidade, proclamando diante dele: “Assim se fará ao homem a quem o rei deseja honrar!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתוֹן ... עַל־יַד
  choice: sejam confiados a
  rationale: A expressão indica entregar o manto e o cavalo aos cuidados e à responsabilidade de alguém; esta formulação preserva o sentido sem reproduzir literalmente o idiomatismo hebraico “na mão de”.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ הַפַּרְתְּמִים
  choice: um dos nobres oficiais do rei
  rationale: שָׂרֵי designa altos oficiais ou príncipes, e הַפַּרְתְּמִים especifica sua condição nobre. “Nobres oficiais” comunica ambas as ideias com naturalidade.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: deseja honrar
  rationale: O rei tem prazer ou vontade no “valor/honra” do homem. Em português, “deseja honrar” expressa de modo claro e idiomático o sentido contextual.
- source_word: וְהִרְכִּיבֻהוּ עַל־הַסּוּס
  choice: façam-no montar no cavalo
  rationale: O causativo hebraico significa fazer o homem cavalgar ou colocá-lo montado no cavalo; a escolha preserva essa ação sem confundi-la com simplesmente conduzi-lo a pé.
- source_word: בִּרְחוֹב הָעִיר
  choice: pela praça da cidade
  rationale: רְחוֹב normalmente designa um espaço urbano amplo e aberto, como praça, e não apenas uma rua.
- source_word: וְקָרְאוּ לְפָנָיו
  choice: proclamando diante dele
  rationale: A expressão descreve uma proclamação pública feita à frente ou na presença do homenageado durante o cortejo; “diante dele” conserva a formulação espacial sem especificar além do hebraico.
