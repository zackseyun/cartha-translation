    issue: Ambiguidade em "o conduzam pela praça da cidade"
    rationale: Depois de "façam-no montar no cavalo", a expressão pode sugerir que conduzam o homem a pé. וְהִרְכִּיבֻהוּ עַל־הַסּוּס בִּרְחוֹב העיר requer que ele seja levado sobre o cavalo pelo espaço público da cidade.
  - severity: low
    issue: Objeto elidido em "Que vistam com o manto o homem"
    rationale: A formulação é compreensível, mas "que vistam o homem com o manto" reproduz mais claramente a relação sintática de וְהִלְבִּישׁוּ אֶת־הָאִישׁ e soa mais idiomática.
  revised_text: 'Que o manto e o cavalo sejam confiados a um dos nobres oficiais do rei. Que vistam o homem a quem o rei deseja honrar com o manto, façam-no montar no cavalo e o levem sobre o cavalo pela praça da cidade, proclamando diante dele: “Assim se fará ao homem a quem o rei deseja honrar!”'
