base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: pt
  text: 'Então o rei disse a Hamã: “Depressa! Pegue o manto e o cavalo, exatamente como você disse, e faça isso por Mardoqueu, o judeu[a], que está sentado à porta do rei. Não omita nada de tudo o que você disse[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O judeu” também pode ser traduzido como “o judeano”; aqui, porém, o termo provavelmente identifica Mardoqueu por sua pertença étnica e religiosa.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “Não deixe cair coisa alguma de tudo o que você disse”, expressão idiomática que significa não omitir nada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Depressa!
  rationale: O imperativo exige ação imediata. A formulação breve e exclamativa transmite a urgência em português atual.
- source_word: קַח
  choice: Pegue
  rationale: Equivalente direto e natural do imperativo de לקח nesta sequência de ordens.
- source_word: הַלְּבוּשׁ
  choice: o traje
  rationale: No contexto, refere-se à veste real mencionada no versículo anterior. “Traje” é natural, mantém a referência definida e evita especificar indevidamente um tipo exato de peça.
- source_word: הַסּוּס
  choice: o cavalo
  rationale: O substantivo diz simplesmente “o cavalo”. Embora o contexto indique o cavalo real, não se acrescenta aqui um modificador ausente do hebraico.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: exatamente como você disse
  rationale: Preserva a ênfase irônica de o rei ordenar a Hamã que execute sua própria proposta em favor de Mardoqueu.
- source_word: וַעֲשֵׂה כֵן
  choice: e faça isso
  rationale: Tradução compacta e idiomática da ordem, retomando todas as ações propostas anteriormente.
- source_word: לְמָרְדֳּכַי
  choice: por Mardoqueu
  rationale: 'A preposição tem valor benefactivo: Hamã deve realizar essas honras em favor de Mardoqueu.'
- source_word: הַיְּהוּדִי
  choice: o judeu
  rationale: Em Ester, o termo normalmente identifica a pertença étnico-religiosa judaica, embora sua origem também permita a leitura histórica “judeano”.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: que está sentado à porta do rei
  rationale: Reproduz o particípio descritivo e a localização de Mardoqueu. “Porta do rei” designa o complexo de entrada do palácio, podendo também estar ligado à sua função ali.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: Não omita nada de tudo o que você disse
  rationale: Expressa claramente o sentido idiomático da construção com נפל, sem impor ao texto português a imagem pouco natural de deixar algo cair.
theological_decisions: []
