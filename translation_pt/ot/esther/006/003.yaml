base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: pt
  text: 'Então o rei perguntou[a]: “Que honra e distinção foram concedidas a Mardoqueu por isso?” Os jovens do rei que o serviam responderam: “Nada foi feito em seu favor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que honra e grandeza foram dadas a Mardoqueu por causa disso?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: foram concedidas
  rationale: O passivo de עשה pergunta o que foi feito; com “honra e distinção”, “foram concedidas” é uma formulação portuguesa natural e conserva o sentido passivo.
- source_word: יְקָר
  choice: honra
  rationale: No contexto da corte, indica a honra pública prestada a alguém, e não preciosidade material.
- source_word: וּגְדוּלָּה
  choice: distinção
  rationale: Em paralelo com “honra”, refere-se ao reconhecimento elevado ou à posição pública conferida; “distinção” comunica esse valor melhor do que a forma mais abstrata “grandeza”.
- source_word: לְמָרְדֳּכַי
  choice: a Mardoqueu
  rationale: A preposição ל marca o destinatário ou beneficiário; “concedidas a Mardoqueu” é idiomático em português.
- source_word: עַל זֶה
  choice: por isso
  rationale: Retoma o ato de Mardoqueu mencionado no contexto anterior e preserva de modo conciso a relação causal.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: Os jovens do rei
  rationale: Mantém o sentido lexical de נערים, “jovens”, sem o fundir com a ideia de serviço expressa pelo particípio seguinte.
- source_word: מְשָׁרְתָיו
  choice: que o serviam
  rationale: O particípio de שרת designa os que prestavam serviço pessoal ao rei; a oração relativa é clara e natural.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: Nada foi feito por ele
  rationale: A expressão significa que nenhuma medida ou recompensa havia sido realizada em benefício de Mardoqueu; “por ele” comunica isso naturalmente.
