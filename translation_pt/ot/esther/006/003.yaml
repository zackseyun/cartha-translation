    issue: «Nada foi feito por ele» é ambíguo e não expressa com clareza o sentido beneficiativo.
    rationale: No português moderno, «feito por ele» tende a ser entendido como ação realizada por Mardoqueu, ou motivada por ele. A expressão hebraica comunica que nenhuma honraria ou medida foi tomada em favor dele; «Nada foi feito em seu favor» transmite esse sentido sem ambiguidade.
