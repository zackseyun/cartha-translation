base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: pt
  text: 'Hamã entrou, e o rei lhe disse: “Que se deve fazer ao homem a quem o rei tem prazer em honrar?” E Hamã disse em seu coração[a]: “A quem o rei teria mais prazer em honrar do que a mim?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “disse consigo mesmo”. Em hebraico, literalmente, “disse em seu coração”.'
    reason: Alternativa idiomática para a expressão hebraica de fala interior.
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: Hamã entrou
  rationale: O wayyiqtol dá continuidade à narrativa, e “entrou” expressa de modo natural a entrada de Hamã na presença do rei.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: e o rei lhe disse
  rationale: Mantém o sentido básico de אָמַר, embora a fala introduzida seja uma pergunta.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: O que se deve fazer pelo homem
  rationale: A construção com infinitivo indica o que convém fazer; “se deve fazer” preserva a formulação impessoal, e “pelo homem” comunica que a ação será realizada em benefício dele.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: a quem o rei tem prazer em honrar
  rationale: חָפֵץ comunica prazer ou agrado, e יְקָר, neste contexto cortesão, refere-se à honra concedida pelo rei.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: Hamã disse em seu coração
  rationale: Preserva a imagem hebraica de uma fala interior sem deixar de ser compreensível em português; a nota apresenta a formulação idiomática alternativa.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: A quem o rei teria mais prazer em honrar
  rationale: Repete “ter prazer” para representar a recorrência de חָפֵץ e traduz a expressão לַעֲשׂוֹת יְקָר como concessão de honra.
- source_word: יוֹתֵר מִמֶּנִּי
  choice: do que a mim
  rationale: Expressa com naturalidade a comparação e evidencia, sem acréscimo interpretativo, a presunção de Hamã.
