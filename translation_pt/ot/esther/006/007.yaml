base_translation:
  language: en
  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: pt
  text: 'E Hamã disse ao rei: “O homem[a] a quem o rei tem prazer em honrar—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um homem a quem o rei tem prazer em honrar”. O hebraico אִישׁ está no masculino singular e pode ter sentido indefinido; neste contexto, “o homem” antecipa uma pessoa específica, embora ainda não nomeada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “E ... disse” preserva a ligação com o contexto e soa natural em narrativa portuguesa.
- source_word: הָמָן
  choice: Hamã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: Equivalência direta e idiomática para o destinatário da fala.
- source_word: אִישׁ אֲשֶׁר
  choice: Quanto ao homem ... a quem
  rationale: אִישׁ é masculino singular e pode ser indefinido, mas aqui funciona naturalmente como tópico do enunciado. “Quanto ao homem” preserva a construção suspensa, que continua no versículo seguinte.
- source_word: הַמֶּלֶךְ חָפֵץ
  choice: o rei tem prazer
  rationale: חָפֵץ expressa agrado ou prazer, não apenas vontade; “tem prazer” conserva essa nuance em português corrente e digno.
- source_word: בִּיקָרוֹ
  choice: em honrar
  rationale: O substantivo יְקָר indica honra, estima ou distinção. A formulação verbal “honrar” é idiomática em português e adequada ao contexto da corte.
