  text: וַ/יִּקַּ֤ח הָמָן֙ אֶת הַ/לְּב֣וּשׁ וְ/אֶת הַ/סּ֔וּס וַ/יַּלְבֵּ֖שׁ אֶֽת מָרְדֳּכָ֑י וַ/יַּרְכִּיבֵ֨/הוּ֙ בִּ/רְח֣וֹב הָ/עִ֔יר וַ/יִּקְרָ֣א לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: pt
  text: 'Então Hamã pegou o manto e o cavalo, vestiu Mardoqueu, fez com que ele cavalgasse pela praça da cidade e proclamou diante dele: “Assim se fará ao homem a quem o rei deseja honrar!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: o manto
  rationale: O substantivo definido retoma a veste régia mencionada no contexto imediato; “manto” é natural, específico e digno em português.
- source_word: הַסּוּס
  choice: o cavalo
  rationale: O hebraico traz apenas o substantivo definido. A ligação com o rei já está estabelecida no versículo anterior, por isso não se acrescenta “real”.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: vestiu Mardoqueu
  rationale: O Hifil de לבש significa vestir alguém. A formulação direta reproduz naturalmente a construção hebraica.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: fez com que ele cavalgasse
  rationale: A forma causativa de רכב indica que Hamã fez Mardoqueu montar ou cavalgar. Esta tradução preserva explicitamente a causatividade sem acrescentar ações não declaradas.
- source_word: בִּרְחוֹב הָעִיר
  choice: pela praça da cidade
  rationale: רְחוֹב designa com frequência um espaço público amplo, como praça ou largo, e não apenas uma rua comum. “Pela” exprime naturalmente o percurso da procissão.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: e proclamou diante dele
  rationale: קרא descreve aqui um anúncio público; “proclamou” preserva o caráter formal, enquanto “diante dele” mantém a expressão espacial sem especificar indevidamente a posição exata de Hamã.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Assim se fará
  rationale: Mantém o advérbio demonstrativo, a voz passiva e o valor formular e prospectivo da declaração, em português corrente e solene.
- source_word: לָאִישׁ
  choice: ao homem
  rationale: Conserva o singular masculino definido e genérico da fórmula cortesã.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: a quem o rei deseja honrar
  rationale: חפץ expressa vontade, agrado ou prazer, e יקר, neste contexto, refere-se à honra concedida. “Deseja honrar” comunica ambos de modo conciso, sem intensificar indevidamente para “se deleita”.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro narrativo é digno e claro; a proclamação conserva solenidade moderada. A coordenação hebraica foi mantida sem tornar a frase artificialmente repetitiva.
