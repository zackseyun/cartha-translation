  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נָדְדָ֖ה שְׁנַ֣ת הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר לְ/הָבִ֞יא אֶת סֵ֤פֶר הַ/זִּכְרֹנוֹת֙ דִּבְרֵ֣י הַ/יָּמִ֔ים וַ/יִּהְי֥וּ נִקְרָאִ֖ים לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: pt
  text: Naquela noite, o rei não conseguiu dormir[a]. Então mandou trazer o livro dos registros, isto é, as crônicas[b], e elas foram lidas diante do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o sono do rei fugiu”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o livro das memórias, os anais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Naquela noite
  rationale: Expressão temporal natural em português que preserva a referência específica indicada pelo demonstrativo hebraico.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: o rei não conseguiu dormir
  rationale: Comunica de modo claro e idiomático o sentido da imagem hebraica, literalmente, de que o sono do rei fugiu; a imagem é preservada em nota.
- source_word: וַיֹּאמֶר
  choice: Então mandou
  rationale: Embora o verbo signifique formalmente 'disse', aqui introduz uma ordem; 'mandou' expressa naturalmente a força do ato de fala, e 'então' mantém a progressão narrativa.
- source_word: לְהָבִיא
  choice: trazer
  rationale: Depois de 'mandou', o infinitivo português exprime de forma idiomática a ordem dada a servos não identificados.
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: o livro dos registros
  rationale: Designa registros preservados para memória, adequando-se ao contexto dos arquivos reais sem impor uma formulação excessivamente literal.
- source_word: דִּבְרֵי הַיָּמִים
  choice: as crônicas
  rationale: A expressão hebraica designa anais ou registros de acontecimentos e funciona em aposição ao 'livro dos registros'; 'isto é' torna essa relação clara em português.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: e elas foram lidas
  rationale: Mantém o plural e a construção passiva do hebraico, tomando 'as crônicas' como antecedente natural.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: Preserva o sentido literal de leitura na presença do rei, em formulação corrente e digna.
