base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: pt
  text: 'Os assistentes do rei lhe disseram: “Veja, Hamã está de pé no pátio.” E o rei disse: “Que ele entre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: os assistentes do rei
  rationale: No contexto do palácio, נַעַר designa servidores ou assistentes, sem que a idade seja necessariamente destacada. “Assistentes” comunica naturalmente sua função na corte.
- source_word: הִנֵּה
  choice: Veja
  rationale: A interjeição chama a atenção para a presença de Hamã. “Veja” preserva a vivacidade do hebraico em português atual e digno.
- source_word: עֹמֵד
  choice: está
  rationale: O particípio apresenta Hamã em situação presente no pátio. Em português, “está no pátio” exprime isso naturalmente; traduzir a postura como “está de pé” acrescentaria uma ênfase desnecessária no contexto.
- source_word: בֶּחָצֵר
  choice: no pátio
  rationale: חָצֵר designa o pátio ou átrio do palácio. “Pátio” é claro para leitores modernos e evita a possível confusão de “corte” com o corpo de conselheiros ou a residência real em sentido amplo.
- source_word: יָבֹא
  choice: Que ele entre
  rationale: A forma verbal tem força volitiva e, na fala do rei, comunica uma ordem ou autorização. “Que ele entre” mantém essa força sem decidir rigidamente entre comando e permissão.
- source_word: הָמָן
  choice: Hamã
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A tradução mantém a concisão narrativa do hebraico e usa “Então” para representar a progressão marcada pelo segundo וַיֹּאמֶר.
