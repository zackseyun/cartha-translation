  text: יָבִ֨יאוּ֙ לְב֣וּשׁ מַלְכ֔וּת אֲשֶׁ֥ר לָֽבַשׁ בּ֖/וֹ הַ/מֶּ֑לֶךְ וְ/ס֗וּס אֲשֶׁ֨ר רָכַ֤ב עָלָי/ו֙ הַ/מֶּ֔לֶךְ וַ/אֲשֶׁ֥ר נִתַּ֛ן כֶּ֥תֶר מַלְכ֖וּת בְּ/רֹאשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: pt
  text: Que tragam uma veste real que o rei já tenha usado, e um cavalo no qual o rei já tenha montado e sobre cuja cabeça tenha sido colocada uma coroa real.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e sobre cuja cabeça foi colocada uma coroa real”. O pronome se refere mais naturalmente ao cavalo, embora alguns o entendam como referência ao rei.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: Que tragam
  rationale: O imperfeito hifil de בוא tem aqui força volitiva, dentro do discurso direto; “Que tragam” expressa a instrução com naturalidade.
- source_word: לְבוּשׁ מַלְכוּת
  choice: uma veste real
  rationale: A expressão construta designa uma peça de vestuário ligada à realeza. “Veste real” é clara, digna e não especifica além do hebraico o tipo exato de roupa.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: que o rei já tenha usado
  rationale: A oração identifica a veste como uma que foi efetivamente usada pelo rei. O advérbio “já” comunica a relevância dessa experiência anterior sem reproduzir de modo artificial o pronome preposicionado hebraico.
- source_word: וְסוּס
  choice: e um cavalo
  rationale: O substantivo sem artigo introduz o segundo objeto solicitado; o artigo indefinido é natural em português.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: no qual o rei já tenha montado
  rationale: A formulação preserva a preposição עַל e indica que o próprio rei utilizou o cavalo.
- source_word: וַאֲשֶׁר נִתַּן
  choice: e em cuja cabeça tenha sido colocada
  rationale: A construção passiva é mantida, enquanto a oração relativa é reorganizada de forma idiomática. No texto principal, “cuja” retoma o cavalo, o antecedente sintaticamente mais natural.
- source_word: כֶּתֶר מַלְכוּת
  choice: uma coroa real
  rationale: A expressão indica uma coroa associada à realeza; “uma coroa real” é concisa e respeita a ausência do artigo no hebraico.
- source_word: בְּרֹאשׁוֹ
  choice: em cuja cabeça
  rationale: O sufixo masculino singular retoma mais naturalmente o cavalo no encadeamento sintático, embora também possa ser entendido como referência ao rei; a ambiguidade é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A repetição de “já tenha” reforça o paralelismo entre a veste usada e o cavalo montado pelo rei. O marcador da nota foi colocado junto à oração que contém a ambiguidade pronominal.
