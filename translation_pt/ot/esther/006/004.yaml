base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: pt
  text: 'O rei perguntou: “Quem está no pátio?” Hamã havia entrado no pátio externo do palácio real para falar ao rei sobre pendurar Mardoqueu na estrutura de madeira[a] que ele havia preparado para Mardoqueu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico עֵץ significa literalmente “árvore” ou “madeira”. Neste contexto, refere-se à estrutura preparada para executar Mardoqueu; o texto não especifica se era uma forca ou um poste.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: no pátio / no pátio
  rationale: חָצֵר designa um espaço cercado ou pátio. A repetição do substantivo foi mantida; na segunda ocorrência, הַחִיצוֹנָה o qualifica como o pátio externo.
- source_word: וְהָמָן בָּא
  choice: Hamã havia entrado
  rationale: A oração fornece a circunstância de fundo para a pergunta do rei. O mais-que-perfeito expressa naturalmente em português que a entrada de Hamã antecedeu a pergunta.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palácio real
  rationale: Embora a expressão signifique literalmente 'casa do rei', no contexto régio refere-se ao palácio; 'palácio real' é claro e idiomático.
- source_word: הַחִיצוֹנָה
  choice: externo
  rationale: O adjetivo distingue esse pátio de um pátio interior. 'Externo' transmite diretamente essa relação espacial.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: a fim de pedir ao rei
  rationale: O infinitivo indica a finalidade da vinda de Hamã para falar ao rei. Pelo contexto, essa fala seria um pedido; a formulação portuguesa torna a relação sintática natural sem alterar o propósito.
- source_word: לִתְלוֹת
  choice: que Mardoqueu fosse pendurado
  rationale: תלה significa suspender ou pendurar. A voz passiva produz uma construção natural em português e evita especificar além do hebraico se o método era enforcamento ou empalamento.
- source_word: הָעֵץ
  choice: a estrutura de madeira
  rationale: עֵץ significa literalmente 'árvore' ou 'madeira', mas aqui designa o objeto preparado para a execução. 'Estrutura de madeira' comunica o referente sem impor o formato específico de uma forca moderna.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: que ele havia preparado para Mardoqueu
  rationale: O antecedente contextual de לוֹ é Mardoqueu. Repetir o nome evita em português a ambiguidade indesejada de dois pronomes masculinos na mesma oração.
theological_decisions:
- issue: Método de execução indicado por תלה על העץ
  choice: pendurado na estrutura de madeira
  alternative: enforcado na forca; empalado no poste
  rationale: O hebraico descreve suspensão em ou sobre עֵץ, mas não define com precisão a forma do instrumento nem o mecanismo da morte. A tradução preserva essa abertura histórica e lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pátio externo” e “palácio real” situam a cena naturalmente; “estrutura de madeira” evita tanto o arcaísmo de “madeiro” quanto uma precisão histórica não presente no hebraico.
