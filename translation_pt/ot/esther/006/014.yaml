base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: pt
  text: Enquanto ainda falavam com ele, chegaram os eunucos do rei[a] e se apressaram em levar Hamã ao banquete que Ester havia preparado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os oficiais do rei», pois o termo hebraico pode designar funcionários da corte, além de eunucos.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: Enquanto ainda falavam com ele
  rationale: A construção marca uma ação em andamento e ainda não concluída. A formulação portuguesa preserva tanto o valor temporal quanto a relação expressa por עִם, «com».
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: os eunucos do rei
  rationale: סָרִיס pode designar eunucos ou funcionários da corte. «Eunucos» mantém o sentido mais concreto e tradicional no contexto da corte persa, enquanto a alternativa é registrada em nota.
- source_word: הִגִּיעוּ
  choice: chegaram
  rationale: O verbo indica a chegada dos agentes à cena; «chegaram» é direto e natural em português.
- source_word: וַיְבַהִלוּ לְהָבִיא
  choice: se apressaram em levar
  rationale: O hifil de בהל comunica aqui pressa urgente. Em português, «se apressaram em levar» expressa a rapidez sem sugerir necessariamente pânico ou terror.
- source_word: הַמִּשְׁתֶּה
  choice: o banquete
  rationale: מִשְׁתֶּה designa uma refeição festiva, muitas vezes associada ao vinho; «banquete» é natural no ambiente régio de Ester.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: que Ester havia preparado
  rationale: Embora עשה signifique literalmente «fazer», «preparar um banquete» é a expressão idiomática em português. O mais-que-perfeito composto deixa claro que o banquete já estava preparado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. Conserva-se «eunucos» no texto principal e registra-se em nota a amplitude lexical do termo hebraico. A urgência de וַיְבַהִלוּ é comunicada por «se apressaram», sem acrescentar a ideia de pânico.
