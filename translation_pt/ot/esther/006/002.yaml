  register: Português moderno, digno e acessível, com sintaxe narrativa natural. “Achou-se registrado” conserva o tom dos anais reais; “atentar contra” traduz idiomaticamente a expressão hebraica de ação hostil. Todos os marcadores de nota aparecem no texto.
