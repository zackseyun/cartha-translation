  text: וַ/יִּמָּצֵ֣א כָת֗וּב אֲשֶׁר֩ הִגִּ֨יד מָרְדֳּכַ֜י עַל בִּגְתָ֣נָא וָ/תֶ֗רֶשׁ שְׁנֵי֙ סָרִיסֵ֣י הַ/מֶּ֔לֶךְ מִ/שֹּׁמְרֵ֖י הַ/סַּ֑ף אֲשֶׁ֤ר בִּקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: pt
  text: E achou-se registrado que Mardoqueu havia denunciado Bigtana e Teres[a], dois eunucos do rei, dentre os que guardavam a entrada[b], os quais haviam procurado atentar contra o rei Assuero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste versículo, o texto hebraico traz Bigtana; em outros lugares, o nome aparece como Bigtã.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “dois oficiais do rei”; o termo hebraico pode designar especificamente eunucos ou, de modo mais amplo, oficiais da corte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: E achou-se registrado
  rationale: Reproduz a construção passiva impessoal e expressa naturalmente, no contexto de anais reais, que a informação foi encontrada por escrito.
- source_word: הִגִּיד
  choice: havia denunciado
  rationale: No contexto de uma conspiração comunicada à corte, “denunciado” transmite que Mardoqueu revelou oficialmente a conduta dos envolvidos.
- source_word: עַל
  choice: '[objeto direto após “denunciado”]'
  rationale: O sentido temático ou adversativo da preposição é incorporado naturalmente pela regência de “denunciar”, sem acrescentar uma preposição artificial.
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: Bigtana e Teres
  rationale: Translitera as formas hebraicas deste versículo de modo legível em português; a variante Bigtã é registrada em nota.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: dois eunucos do rei
  rationale: Preserva o sentido concreto frequente de סָרִיס em ambiente palaciano, sem ocultar em nota seu possível sentido mais amplo de oficial da corte.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: dentre os que guardavam a entrada
  rationale: “Dentre” representa o מִן partitivo, e “entrada” comunica em português corrente a função de סַף, literalmente o limiar ou soleira.
- source_word: בִּקְשׁוּ
  choice: haviam procurado
  rationale: Mantém o sentido de buscar ou intentar, sem especificar indevidamente se o plano chegou à fase de tentativa concreta.
- source_word: לִשְׁלֹחַ יָד
  choice: atentar contra
  rationale: Equivalente idiomático português para estender a mão hostilmente contra alguém; preserva a intenção violenta sem determinar o ato exato.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: contra o rei Assuero
  rationale: A preposição “contra” é exigida naturalmente pela expressão portuguesa “atentar contra” e conserva o sentido hostil.
