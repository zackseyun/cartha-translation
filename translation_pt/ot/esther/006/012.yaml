    rationale: O hebraico inicia a sequência com o conectivo narrativo «e/então»; «Depois disso» explicita uma relação temporal que não é necessária no texto-fonte.
  - severity: medium
    issue: Forma do nome «Mordecai»
    rationale: Em português, a forma tradicional e amplamente reconhecível é «Mardoqueu». A manutenção da forma inglesa reduz a naturalidade e a consistência onomástica.
  - severity: low
    issue: «Foi impelido para casa»
    rationale: A formulação reflete legitimamente o nifal de נִדְחַף, mas é menos natural em português. Uma redação idiomática pode expressar a pressa no texto e registrar em nota a força passiva possível.
