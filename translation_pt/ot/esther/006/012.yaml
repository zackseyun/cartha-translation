- from: Depois disso, Mordecai voltou para o portão do rei, mas Hamã foi impelido para casa[a], de luto e com a cabeça coberta[b].
  to: Então Mardoqueu voltou ao portão do rei, mas Hamã foi para casa às pressas[a], de luto e com a cabeça coberta[b].
  rationale: A revisão substitui o conectivo temporal excessivamente específico por «Então», adota a forma portuguesa usual «Mardoqueu» e torna a ação de Hamã mais natural em português. A nota em [a] preserva explicitamente a ambiguidade e a possível força passiva do hebraico, sem atribuir um agente não expresso.
