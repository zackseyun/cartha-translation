base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: pt
  text: Então Mardoqueu voltou ao portão do rei, mas Hamã foi para casa às pressas[a], de luto e com a cabeça coberta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi impelido para casa”. O verbo hebraico pode indicar movimento apressado e também conservar a ideia passiva de alguém impelido.'
    reason: lexical_alternative
  - marker: b
    text: Cobrir a cabeça era um sinal cultural de pesar, humilhação ou luto.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוּב, nesta forma narrativa, indica retorno ao lugar ou posto anterior; “voltou” é natural e preciso.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: o portão do rei
  rationale: A cadeia construta designa o portão ligado ao rei ou ao complexo palaciano; “portão do rei” conserva a expressão concreta.
- source_word: נִדְחַף
  choice: foi impelido
  rationale: O nifal de דחף tem força passiva e sugere que Hamã seguiu para casa como alguém compelido ou arrastado pelas circunstâncias; a formulação preserva essa nuance sem declarar um agente.
- source_word: בֵּיתוֹ
  choice: para casa
  rationale: Embora literalmente seja “para sua casa”, o português atual emprega naturalmente “para casa” neste contexto.
- source_word: אָבֵל
  choice: de luto
  rationale: O adjetivo descreve Hamã em estado de pesar ou lamentação; “de luto” mantém a concisão e o sentido.
- source_word: חֲפוּי רֹאשׁ
  choice: com a cabeça coberta
  rationale: A tradução conserva a imagem concreta do hebraico, em vez de substituí-la por uma interpretação como “humilhado”.
