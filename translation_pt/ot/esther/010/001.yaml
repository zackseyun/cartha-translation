base_translation:
  language: en
  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: pt
  text: O rei Assuero impôs tributo[b] sobre a terra e as ilhas do mar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «regiões costeiras», em vez de «ilhas do mar». O termo hebraico pode designar ilhas ou terras costeiras.
    reason: lexical_alternative
  - marker: b
    text: Ou «imposto». Em alguns contextos, a palavra hebraica também pode referir-se a trabalho compulsório (corveia).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: impôs
  rationale: Na expressão שׂוּם מַס עַל, o verbo indica impor ou lançar um tributo, e não apenas “colocar”.
- source_word: הַמֶּלֶךְ אחשרש
  choice: O rei Assuero
  rationale: A construção é natural em português, mantém o artigo hebraico e usa a forma tradicional portuguesa do nome.
- source_word: מַס
  choice: tributo
  rationale: O termo pode designar tributo, imposto ou trabalho compulsório; neste contexto imperial e territorial, “tributo” expressa melhor a obrigação política sem eliminar as alternativas lexicais.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se ao território sob o domínio do rei, sem exigir que se especifique “país” ou “império”.
- source_word: וְאִיֵּי הַיָּם
  choice: e às ilhas do mar
  rationale: Preserva a expressão geográfica hebraica e sua amplitude, enquanto uma nota registra o possível sentido de regiões costeiras.
