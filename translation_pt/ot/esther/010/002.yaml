  revision_rationale: 'Apenas a formulação da oração relativa foi ajustada: «a quem o rei engrandeceu» é natural em português e reproduz de modo direto a ação expressa pelo piel de גדל, preservando a ligação com a grandeza de Mardoqueu. O restante do texto e a nota foram mantidos.'
