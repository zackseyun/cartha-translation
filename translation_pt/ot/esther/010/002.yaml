revisions:
- from: E todos os feitos de seu poder e de sua força, e o relato completo da grandeza à qual o rei elevou Mardoqueu — não estão escritos no Livro das Crônicas dos Reis da Média e da Pérsia[a]?
  to: E todos os feitos de seu poder e de sua força, e o relato completo da grandeza de Mardoqueu, a quem o rei engrandeceu — não estão escritos no Livro das Crônicas dos Reis da Média e da Pérsia[a]?
  rationale: 'Apenas a formulação da oração relativa foi ajustada: «a quem o rei engrandeceu» é natural em português e reproduz de modo direto a ação expressa pelo piel de גדל, preservando a ligação com a grandeza de Mardoqueu. O restante do texto e a nota foram mantidos.'
