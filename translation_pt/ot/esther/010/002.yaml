base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: pt
  text: E todos os feitos de seu poder e de sua força, e o relato completo da grandeza de Mardoqueu, a quem o rei engrandeceu — não estão escritos no Livro das Crônicas dos Reis da Média e da Pérsia[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livro dos Anais dos Reis da Média e da Pérsia”.'
    reason: Alternativa lexical para סֵפֶר דִּבְרֵי הַיָּמִים, expressão que pode designar um livro oficial de registros ou anais.
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: feitos
  rationale: Termo amplo para aquilo que foi realizado; “feitos” é natural no resumo histórico e combina bem com poder e força.
- source_word: תָקְפּוֹ
  choice: seu poder
  rationale: Neste contexto régio, indica poder efetivo ou autoridade; “poder” evita restringir o sentido à força física.
- source_word: גְבוּרָתוֹ
  choice: sua força
  rationale: Ao lado de תָקְפּוֹ, acrescenta a ideia de vigor ou capacidade poderosa, preservando o paralelismo sem identificar totalmente os dois termos.
- source_word: וּפָרָשַׁת
  choice: o relato completo
  rationale: O substantivo designa uma exposição ou descrição detalhada; “relato completo” comunica isso com clareza em português corrente.
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: a grandeza ... de Mardoqueu
  rationale: Mantém a noção de grandeza, elevada posição ou proeminência de Mardoqueu sem reduzi-la apenas a um cargo específico.
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: à qual o rei elevou Mardoqueu
  rationale: O piel de גדל expressa fazer grande ou elevar. A formulação explicita o referente do pronome para evitar ambiguidade pouco natural em português, preservando a ligação relativa com “grandeza”.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica convencional da historiografia bíblica e sua forma literária.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Livro das Crônicas
  rationale: Expressão reconhecível para o registro histórico oficial; “Livro dos Anais” permanece como alternativa em nota.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: dos Reis da Média e da Pérsia
  rationale: No título da fonte, “dos” expressa de modo idiomático que o registro pertence aos reinados ou trata dos reis da Média e da Pérsia.
