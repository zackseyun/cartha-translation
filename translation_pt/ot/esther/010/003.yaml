revisions:
- from: Pois o judeu Mardoqueu era o segundo depois do rei Assuero, importante entre os judeus e estimado pela maioria de seus irmãos[a], buscando o bem de seu povo e promovendo a paz de toda a sua descendência[b].
  to: Pois Mardoqueu, o judeu, era o segundo depois do rei Assuero, grande entre os judeus e estimado pela maioria de seus irmãos[a], buscando o bem de seu povo e falando de paz a toda a sua descendência[b].
  rationale: A revisão corrige somente a última oração para refletir com maior precisão o particípio «falando» e a expressão idiomática hebraica «falando paz a». Também ajusta levemente a ordem de «Mardoqueu, o judeu» e restaura «grande», que corresponde mais diretamente a גדול, sem sacrificar a naturalidade.
