  source_fidelity: 'A primeira metade reproduz bem o hebraico: Mardoqueu é apresentado como o segundo em posição depois de Assuero, grande entre os judeus e aceito pela maior parte de seus compatriotas. Contudo, «promovendo a paz de toda a sua descendência» altera a construção verbal: o hebraico diz literalmente que ele «falava paz a» toda a sua descendência/linhagem. A revisão preserva a imagem e a direção do verbo, sem resolver além do necessário o alcance coletivo de זרע.'
  naturalness: A redação é clara e de registro apropriado. «Mardoqueu, o judeu» e «grande entre os judeus» soam naturais em registro bíblico moderno. «Falando de paz a» conserva um hebraísmo inteligível e solene; a nota esclarece o uso coletivo de «descendência».
  terminology: «Judeu», «rei Assuero», «bem», «povo» e «paz» são escolhas adequadas. «Irmãos» é mantido no texto, com nota que explicita corretamente o sentido de compatriotas judeus. «Maioria» é uma opção legítima para רֹב, com a alternativa «multidão» preservada em nota.
  issues:
