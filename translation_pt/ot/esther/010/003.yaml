    rationale: ודבר שלום לכל זרעו significa literalmente «falando paz a toda a sua descendência/linhagem». «Promovendo a paz de» torna a descendência um possuidor da paz e interpreta a expressão mais livremente. «Falando de paz a» preserva a construção e sua ressonância de bem-estar.
  revised_text: Pois Mardoqueu, o judeu, era o segundo depois do rei Assuero, grande entre os judeus e estimado pela maioria de seus irmãos[a], buscando o bem de seu povo e falando de paz a toda a sua descendência[b].
  revised_footnotes:
