  text: כִּ֣י מָרְדֳּכַ֣י הַ/יְּהוּדִ֗י מִשְׁנֶה֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וְ/גָדוֹל֙ לַ/יְּהוּדִ֔ים וְ/רָצ֖וּי לְ/רֹ֣ב אֶחָ֑י/ו דֹּרֵ֥שׁ טוֹב֙ לְ/עַמּ֔/וֹ וְ/דֹבֵ֥ר שָׁל֖וֹם לְ/כָל זַרְעֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: pt
  text: Pois Mardoqueu, o judeu, era o segundo depois do rei Assuero, grande entre os judeus e estimado pela maioria de seus irmãos[a], buscando o bem de seu povo e falando de paz a toda a sua descendência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela multidão de seus irmãos”. A expressão hebraica pode indicar tanto a maioria como um grande número. Aqui, “irmãos” se refere aos seus compatriotas judeus, não apenas a irmãos de sangue.
    reason: lexical_alternative
  - marker: b
    text: Ou “a todos os seus descendentes”. No hebraico, “descendência” é um termo coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa do conectivo em relação ao resumo precedente e soa natural em português.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: o judeu Mardoqueu
  rationale: Expressa a identidade étnico-religiosa destacada no contexto persa; a ordem escolhida é idiomática e digna em português.
- source_word: מִשְׁנֶה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: o segundo depois do rei Assuero
  rationale: Comunica que Mardoqueu ocupava a posição imediatamente inferior à do rei sem importar o título específico de 'vizir'.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: importante entre os judeus
  rationale: '''Importante'' comunica com clareza a elevada posição social indicada por גָּדוֹל, enquanto ''entre os judeus'' explicita naturalmente a relação marcada pela preposição.'
- source_word: וְרָצוּי לְרֹב אֶחָיו
  choice: e estimado pela maioria de seus irmãos
  rationale: רָצוּי indica aceitação ou aprovação; רֹב pode significar maioria ou multidão. O texto principal adota a leitura contextualmente provável 'maioria', preservando em nota a alternativa genuína.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: buscando o bem de seu povo
  rationale: Reproduz de perto a construção participial e a procura ativa do benefício do povo.
- source_word: וְדֹבֵר שָׁלוֹם לְכָל זַרְעוֹ
  choice: e promovendo a paz de toda a sua descendência
  rationale: No contexto de atuação pública, 'promovendo a paz' transmite idiomaticamente o sentido de falar em favor da paz, do bem-estar e da prosperidade. זֶרַע é coletivo e aqui designa a posteridade ou descendência do povo.
