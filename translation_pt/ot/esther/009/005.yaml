source:
  edition: WLC
  text: וַ/יַּכּ֤וּ הַ/יְּהוּדִים֙ בְּ/כָל אֹ֣יְבֵי/הֶ֔ם מַכַּת חֶ֥רֶב וְ/הֶ֖רֶג וְ/אַבְדָ֑ן וַ/יַּֽעֲשׂ֥וּ בְ/שֹׂנְאֵי/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: pt
  text: Assim, os judeus feriram todos os seus inimigos a golpes de espada, com matança e destruição, e fizeram aos que os odiavam o que quiseram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a sua vontade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: O verbo נכה tem sentido amplo de golpear ou ferir. “Feriram” preserva a ação verbal sem reduzi-la antecipadamente a “mataram”, pois os substantivos seguintes explicitam os resultados letais.
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: Em Ester, o termo designa o povo judeu no contexto da diáspora persa; “os judeus” é a forma natural e historicamente adequada em português.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: todos os seus inimigos
  rationale: Conserva o alcance total expresso por כָּל e emprega uma formulação idiomática em português.
- source_word: מַכַּת חֶרֶב
  choice: a golpes de espada
  rationale: A expressão construta significa literalmente “golpe de espada”. O plural idiomático “a golpes de espada” mantém a imagem concreta e se liga naturalmente a “feriram”.
- source_word: וְהֶרֶג
  choice: com matança
  rationale: O substantivo הֶרֶג denota matança ou morticínio. “Matança” preserva a severidade do texto sem acrescentar uma noção mais específica do que o hebraico.
- source_word: וְאַבְדָן
  choice: e destruição
  rationale: אַבְדָן indica destruição ou ruína. “Destruição” é forte, natural e não exagera o alcance lexical como poderia fazer “aniquilação”.
- source_word: בְשֹׂנְאֵיהֶם
  choice: aos que os odiavam
  rationale: Preserva a forma participial e a distinção lexical em relação a “inimigos” na primeira parte do versículo.
- source_word: כִּרְצוֹנָם
  choice: o que quiseram
  rationale: Expressa de modo corrente o sentido literal de agir segundo a própria vontade ou desejo, sem transformar a frase numa avaliação moral.
theological_decisions:
- issue: Descrição de violência em contexto de conflito
  choice: Manter de forma direta a sequência “golpes de espada, matança e destruição”
  alternative: Atenuar como “derrotaram” ou intensificar uniformemente como “aniquilaram”
  rationale: O hebraico acumula termos violentos e letais. A tradução deve conservar essa gravidade sem suavizar o relato nem ampliá-lo além dos dados lexicais.
- issue: Alcance de כִּרְצוֹנָם
  choice: “o que quiseram”, com nota para a formulação literal
  alternative: “segundo a sua vontade” no corpo do texto
  rationale: A expressão hebraica descreve liberdade de ação segundo a vontade deles. A formulação natural mantém o sentido, enquanto a nota registra a estrutura literal e sua possível nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a repetição enfática e a violência explícita do hebraico, evitando tanto eufemismo quanto intensificação interpretativa.
