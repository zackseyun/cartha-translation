  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: pt
  text: Por isso, chamaram esses dias de Purim[a], por causa do nome de Pur. Por isso, em razão de todas as palavras desta carta, do que haviam visto a esse respeito e do que lhes havia acontecido[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de Pur”. Em hebraico, literalmente: “por causa do nome de Pur”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do que lhes havia sobrevindo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לַיָּמִים הָאֵלֶּה פוּרִים
  choice: chamaram esses dias de Purim
  rationale: A construção de nomeação com קרא é expressa naturalmente em português por “chamar ... de”; “Purim” é preservado como nome próprio da festa.
- source_word: עַל שֵׁם הַפּוּר
  choice: por causa do nome Pur
  rationale: Mantém a referência explícita ao “nome” e o vínculo etimológico entre Pur e Purim, ao mesmo tempo que dá a עַל valor causal adequado ao contexto.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa a força causal-conclusiva e preserva a repetição da locução hebraica nas duas ocorrências.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: em razão de todas as palavras desta carta
  rationale: Conserva דִּבְרֵי como “palavras” e comunica o valor causal de עַל sem transformar o texto em uma paráfrase sobre o conteúdo escrito.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: do que haviam visto a esse respeito
  rationale: Traduz רָאוּ de maneira direta e verte עַל כָּכָה idiomaticamente, sem especificar além do hebraico qual aspecto da situação foi visto.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: e do que lhes havia acontecido
  rationale: הִגִּיעַ אֶל pode descrever aquilo que alcança ou sobrevém a alguém; “acontecido” é natural em português e adequado à retrospectiva narrativa.
