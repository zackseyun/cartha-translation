  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: pt
  text: Pois Hamã, filho de Hamedata, o agagita, inimigo de todos os judeus, havia tramado contra os judeus para destruí-los e havia lançado o Pur[a] — isto é, a sorte — para confundi-los[b] e destruí-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pur é um termo estrangeiro que o próprio texto explica como “a sorte”. Sua conservação mantém a ligação com o nome da festa de Purim no contexto.
    reason: cultural_note
  - marker: b
    text: Ou “para aterrorizá-los” ou “para esmagá-los”; o verbo hebraico pode expressar confusão, pânico, perturbação ou derrota esmagadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a observância descrita no contexto; “Pois” mantém a ligação discursiva natural em português.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: Hamã, filho de Hamedata, o agagita
  rationale: Translitera os nomes de modo corrente em português e preserva “agagita” como designação étnica ou dinástica, sem interpretá-la além do texto.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: inimigo de todos os judeus
  rationale: O particípio caracteriza Hamã como adversário ativo; “inimigo” é claro, forte e natural.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: havia tramado contra os judeus
  rationale: A construção expressa uma intenção hostil deliberada, não mero pensamento; o mais-que-perfeito situa o plano antes dos acontecimentos recordados.
- source_word: לְאַבְּדָם
  choice: para destruí-los
  rationale: O infinitivo causativo comunica a intenção de fazê-los perecer; “destruir” conserva a força do hebraico sem acrescentar especificidade.
- source_word: וְהִפִּיל פּוּר
  choice: e lançado o Pur
  rationale: Mantém o empréstimo persa presente no hebraico e sua ligação explícita com o nome Purim no contexto próximo.
- source_word: הוּא הַגּוֹרָל
  choice: isto é, a sorte
  rationale: Reproduz a glosa explicativa do próprio texto, que identifica o termo estrangeiro Pur com a sorte lançada.
- source_word: לְהֻמָּם
  choice: para lançá-los em confusão
  rationale: O verbo pode denotar causar confusão, pânico, perturbação ou derrota. A formulação preserva o sentido causativo e deixa a amplitude semântica indicada em nota.
- source_word: וּלְאַבְּדָם
  choice: e destruí-los
  rationale: Preserva a repetição de “destruir” e o reforço da intenção de Hamã presentes no hebraico.
