lexical_decisions:
- source_word: בָּא ... לִפְנֵי הַמֶּלֶךְ
  choice: chegou ao conhecimento do rei
  rationale: A expressão hebraica diz literalmente que o número 'veio diante do rei'; em português, esta formulação natural preserva o sentido de que a informação chegou ao rei sem acrescentar explicitamente um agente.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Susã, a cidadela
  rationale: Mantém a designação do lugar e traduz הַבִּירָה como 'a cidadela', isto é, o complexo fortificado ou sede real de Susã.
- source_word: הַהֲרוּגִים
  choice: os mortos
  rationale: Refere-se às pessoas que foram mortas; 'os mortos' é claro e natural no contexto imediato.
