base_translation:
  language: en
  yaml_path: translation/ot/esther/009/006.yaml
  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: pt
  text: E na cidadela[a] de Susã, os judeus mataram e destruíram quinhentos homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fortaleza». O termo hebraico pode designar um complexo palaciano fortificado ou uma cidadela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: E, em Susã
  rationale: A conjunção e a preposição ligam o versículo à narrativa anterior e preservam o sentido locativo; «Susã» é a forma tradicional e reconhecível do topônimo em português.
- source_word: הַ/בִּירָה
  choice: a cidadela
  rationale: בִּירָה designa a área fortificada ou acrópole da capital; «cidadela» preserva tanto o aspecto defensivo quanto o administrativo, sem restringir o termo ao palácio real.
- source_word: הָרְגוּ
  choice: mataram
  rationale: O verbo הרג significa diretamente «matar»; a forma escolhida é atual, clara e digna.
- source_word: הַ/יְּהוּדִים
  choice: os judeus
  rationale: Em Ester, o termo identifica o grupo étnico-religioso; «os judeus» é a tradução convencional e natural em português.
- source_word: וְ/אַבֵּד
  choice: e destruíram
  rationale: O piel de אבד expressa causar destruição ou fazer perecer. A tradução mantém o segundo verbo, em vez de fundi-lo com «mataram», preservando a expressão enfática hebraica.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: quinhentos homens
  rationale: A expressão hebraica conta literalmente quinhentos homens; a tradução mantém o substantivo masculino explícito, sem generalizá-lo como «pessoas».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem «na cidadela de Susã» é natural em português e mantém a localização em destaque. Os dois verbos coordenados foram preservados para refletir a formulação hebraica.
