base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: pt
  text: Mas, quando ela compareceu diante do rei, ele ordenou por escrito[a] que o plano perverso que Hamã havia tramado contra os judeus recaísse sobre a própria cabeça de Hamã, e penduraram Hamã e seus filhos no madeiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “disse com o escrito” ou “disse com o documento”; pelo contexto, trata-se de uma ordem real emitida por escrito.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser entendido como “empalar”; “madeiro” pode referir-se a uma estaca ou a um poste de madeira, e não necessariamente a uma forca no sentido moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: quando ela compareceu
  rationale: O sufixo feminino singular retoma naturalmente Ester no contexto. “Compareceu” expressa de modo idiomático sua entrada na presença real sem repetir desnecessariamente o nome.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: Equivalente corrente e digno para a expressão que indica comparecer à presença do rei.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: ele ordenou por escrito
  rationale: A construção hebraica é condensada, literalmente algo como “disse com o escrito/documento”. No contexto, refere-se à ordem real formalizada por escrito; a nota conserva a forma mais literal.
- source_word: יָשׁוּב
  choice: recaísse
  rationale: Expressa a reversão do plano contra seu autor e se integra naturalmente à ordem introduzida no período.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה
  choice: o plano perverso
  rationale: O substantivo designa aqui um plano ou propósito deliberado, e não apenas um pensamento; “perverso” comunica sua natureza moral e hostil.
- source_word: אֲשֶׁר חָשַׁב
  choice: que Hamã havia tramado
  rationale: “Tramado” preserva a ligação semântica com “plano” e explicita de modo natural o referente masculino no contexto, evitando uma sequência pronominal ambígua em português.
- source_word: עַל הַיְּהוּדִים
  choice: contra os judeus
  rationale: A preposição tem sentido hostil neste contexto.
- source_word: עַל רֹאשׁוֹ
  choice: sobre a própria cabeça dele
  rationale: Mantém a imagem hebraica de retribuição que recai sobre o próprio responsável, com referência inequívoca em português.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו
  choice: Então penduraram Hamã e seus filhos
  rationale: O verbo indica suspensão em uma estrutura de madeira e pode envolver exposição ou empalamento. “Penduraram” conserva a amplitude lexical melhor que uma especificação inequívoca do método de execução.
- source_word: עַל הָעֵץ
  choice: no madeiro
  rationale: הָעֵץ significa literalmente árvore, madeira ou estrutura de madeira. “Madeiro” é compreensível, digno e menos específico que “forca”, preservando a incerteza sobre a forma exata da estrutura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “Hamã” esclarece os referentes em um versículo com vários pronomes masculinos. “Madeiro” e a nota preservam a ambiguidade histórica quanto ao instrumento e ao modo de execução.
