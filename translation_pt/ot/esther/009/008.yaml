  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo continua a lista dos filhos de Hamã iniciada no versículo anterior; o verbo “mataram” é subentendido com base em Ester 9:7.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֵת
  choice: e a
  rationale: A conjunção וְ mantém a sequência da lista; אֵת marca cada nome como objeto direto do verbo subentendido do versículo anterior. Em português, isso é expresso naturalmente por “e” e, quando cabível, pelo artigo que acompanha o nome.
- source_word: פּוֹרָתָא
  choice: Porata
  rationale: Nome próprio transliterado segundo uma forma natural em português, sem o “th” da tradição inglesa.
- source_word: אֲדַלְיָא
  choice: Adalia
  rationale: Nome próprio transliterado de forma transparente e corrente em português.
- source_word: אֲרִידָתָא
  choice: Aridata
  rationale: Nome próprio transliterado segundo a fonologia e a ortografia portuguesas, sem o “th” da tradição inglesa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A estrutura fragmentária do hebraico foi preservada como continuação direta da lista do versículo anterior; os nomes foram adaptados à transliteração portuguesa.
