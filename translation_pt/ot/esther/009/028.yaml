base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: pt
  text: Estes dias são lembrados e observados em cada geração, em cada família, em cada província e em cada cidade; estes dias de Purim não desaparecerão do meio dos judeus, e sua memória não cessará entre seus descendentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִזְכָּרִים וְנַעֲשִׂים
  choice: serão lembrados e celebrados
  rationale: O primeiro verbo indica que os dias permanecem na memória; o segundo significa literalmente “feitos” e, no contexto festivo, aponta para sua realização prática. “Celebrados” é natural em português e adequado à observância de uma festa.
- source_word: בְּכָל דּוֹר וָדוֹר מִשְׁפָּחָה וּמִשְׁפָּחָה מְדִינָה וּמְדִינָה וְעִיר וָעִיר
  choice: em cada geração, em cada família, em cada província e em cada cidade
  rationale: As repetições de substantivos no singular têm força distributiva. A repetição de “em cada” comunica essa abrangência com clareza e cadência natural.
- source_word: יְמֵי הַפּוּרִים
  choice: dias de Purim
  rationale: Preserva a relação construta e emprega a forma tradicional e inteligível do nome da festa.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: jamais deixarão de ser observados entre os judeus
  rationale: No contexto, a expressão significa que esses dias não desaparecerão da prática da comunidade. A formulação explicita de modo natural em português o sentido contextual do hebraico.
- source_word: וְזִכְרָם לֹא יָסוּף מִזַּרְעָם
  choice: e sua memória jamais se extinguirá entre seus descendentes
  rationale: “Memória” retoma os dias de Purim; יסוף exprime cessar ou chegar ao fim, e זרע refere-se aqui à posteridade. “Descendentes” é inequívoco e corrente.
