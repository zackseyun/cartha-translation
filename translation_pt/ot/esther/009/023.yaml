base_translation:
  language: en
  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: pt
  text: Assim, os judeus aceitaram o que haviam começado a fazer[a] e o que Mardoqueu lhes havia escrito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assumiram o que haviam começado a fazer”. O verbo hebraico pode transmitir a ideia de aceitar algo ou tomá-lo sobre si.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: aceitaram
  rationale: Neste contexto, o verbo קבל expressa aceitar ou tomar sobre si uma prática. “Aceitaram” preserva essa ideia sem tornar o ato excessivamente passivo nem explicitar mais obrigação do que o hebraico.
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: Tradução natural e direta da designação definida.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: o que já haviam começado a fazer
  rationale: Expressa o objeto de “aceitaram” e mantém a anterioridade narrativa do início da prática; “já” torna clara essa sequência em português.
- source_word: וְאֵת אֲשֶׁר
  choice: e o que
  rationale: Mantém de forma idiomática o paralelismo entre os dois objetos do verbo.
- source_word: כָּתַב
  choice: havia escrito
  rationale: O mais-que-perfeito composto esclarece que a escrita de Mardoqueu precedeu a aceitação relatada.
- source_word: מָרְדֳּכַי
  choice: Mardoqueu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲלֵיהֶם
  choice: lhes
  rationale: Equivale naturalmente a “a eles” no contexto de uma comunicação escrita e evita uma construção pesada.
