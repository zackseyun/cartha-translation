base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: pt
  text: Os judeus estabeleceram e aceitaram para si mesmos, para seus descendentes e para todos os que se unissem a eles[a] não deixar de observar[b] estes dois dias, conforme o que estava escrito e no tempo determinado, ano após ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os que se ligassem a eles”. O hebraico se refere aos que se juntavam ou se associavam aos judeus.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “sem que isso cessasse” ou “sem que fosse negligenciado”. O sentido é que a observância não deveria ser interrompida.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ וְקִבֵּל
  choice: estabeleceram e aceitaram sobre si mesmos
  rationale: Mantém a formulação de dois verbos e o sentido jurídico de confirmar uma prática e assumir sua obrigação. A forma consonantal massorética apresenta uma particularidade de leitura, mas o sentido contextual permanece claro.
- source_word: זַרְעָם
  choice: seus descendentes
  rationale: Expressa naturalmente em português o alcance geracional de זֶרַע neste contexto.
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: todos os que se unissem a eles
  rationale: O particípio de לוה designa os que se ligam ou se juntam aos judeus; a forma verbal em português acomoda naturalmente o grupo aberto e futuro abrangido pela obrigação.
- source_word: וְלֹא יַעֲבוֹר
  choice: como obrigação que não deveria deixar de ser cumprida
  rationale: Explicita de modo legível a construção idiomática de não passar ou não cessar, ligando-a à observância anual sem sugerir que os dias em si deixariam de existir.
- source_word: לִהְיוֹת עֹשִׂים
  choice: observar
  rationale: No contexto de dias festivos, 'observar' comunica a prática continuada requerida, sem acrescentar elementos celebratórios ausentes da expressão literal.
- source_word: כִּכְתָבָם
  choice: conforme o que estava escrito a respeito deles
  rationale: Preserva a referência ambígua do sufixo masculino plural, que pode apontar para os dias e suas determinações escritas, sem especificar além do hebraico.
- source_word: וְכִזְמַנָּם
  choice: no tempo determinado para eles
  rationale: Mantém o sufixo plural e a noção de tempo fixado, evitando reduzir indevidamente os dois dias a um único momento.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: ano após ano
  rationale: Reproduz com naturalidade a força distributiva e reiterativa da expressão hebraica.
