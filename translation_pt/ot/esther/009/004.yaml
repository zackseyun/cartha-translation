source:
  edition: WLC
  text: כִּֽי גָ֤דוֹל מָרְדֳּכַי֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/שָׁמְע֖/וֹ הוֹלֵ֣ךְ בְּ/כָל הַ/מְּדִינ֑וֹת כִּֽי הָ/אִ֥ישׁ מָרְדֳּכַ֖י הוֹלֵ֥ךְ וְ/גָדֽוֹל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: pt
  text: Pois Mardoqueu ocupava uma posição de destaque no palácio do rei[a], e sua fama se espalhava por todas as províncias, porque Mardoqueu se tornava cada vez mais importante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na casa do rei”; a expressão pode referir-se ao palácio ou à corte real.
    reason: literal_rendering
  - marker: b
    text: Literalmente, “ia e se engrandecia”, expressão hebraica que indica aumento contínuo de importância e destaque.
    reason: idiom
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: A conjunção introduz a explicação do que ocorre no contexto; “pois” preserva essa função causal-explicativa em português natural.
- source_word: גָדוֹל
  choice: ocupava uma posição de destaque
  rationale: No contexto da corte, o adjetivo indica grandeza em posição, prestígio ou autoridade, não tamanho físico. A formulação comunica essa amplitude sem restringi-la apenas ao poder político.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: no palácio do rei
  rationale: A expressão significa literalmente “na casa do rei”, mas, no contexto administrativo persa, refere-se naturalmente ao palácio ou à corte real.
- source_word: שָׁמְעוֹ
  choice: sua fama
  rationale: O substantivo pode designar notícia, relato, reputação ou fama. Aqui, aquilo que se difunde pelas províncias é a notoriedade de Mardoqueu; “fama” expressa isso com clareza e concisão.
- source_word: הוֹלֵךְ בְּכָל הַמְּדִינוֹת
  choice: se espalhava por todas as províncias
  rationale: Com “fama” como sujeito, o particípio de movimento indica propagação contínua. “Províncias” corresponde ao contexto administrativo do livro de Ester.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: Mardoqueu
  rationale: O hebraico diz literalmente “o homem Mardoqueu”, com efeito enfático. Em português, repetir o nome preserva a ênfase sem produzir uma expressão artificial.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: se tornava cada vez mais importante
  rationale: A construção idiomática hebraica exprime crescimento contínuo em grandeza, destaque ou influência. “Cada vez mais importante” transmite essa progressão de modo natural.
theological_decisions:
- issue: Natureza da grandeza de Mardoqueu
  choice: Linguagem ampla de destaque e importância
  alternative: “poderoso” ou “influente”
  rationale: O hebraico não limita a grandeza de Mardoqueu a poder político, influência pessoal ou fama. A tradução mantém o sentido abrangente de sua crescente proeminência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Emprega “Mardoqueu”, forma tradicional e reconhecível do nome, e evita uma tradução excessivamente literal que pudesse sugerir tamanho físico.
