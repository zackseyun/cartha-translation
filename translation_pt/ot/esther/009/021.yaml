base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: pt
  text: para estabelecer entre eles que celebrassem o décimo quarto dia do mês de adar e o décimo quinto dia desse mês, ano após ano,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקַיֵּם
  choice: para estabelecer
  rationale: O infinitivo piel de קום expressa aqui o ato de estabelecer ou confirmar uma obrigação comunitária; “estabelecer” preserva o tom administrativo da carta.
- source_word: עֲלֵיהֶם
  choice: entre eles
  rationale: Embora literalmente possa ser “sobre eles”, no contexto indica o estabelecimento da celebração no âmbito da comunidade judaica; “entre eles” é natural sem eliminar a força normativa.
- source_word: לִהְיוֹת עֹשִׂים
  choice: que celebrassem
  rationale: A construção significa literalmente “que estivessem fazendo”; aplicada a dias festivos, “celebrassem” comunica de modo idiomático a prática comemorativa anual.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: o décimo quarto dia
  rationale: Forma portuguesa corrente e fiel para a expressão hebraica de data.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: do mês de adar
  rationale: Reproduz naturalmente em português a fórmula calendárica hebraica.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: e o décimo quinto dia desse mês
  rationale: O pronome בּוֹ retoma o mês mencionado. A repetição de “mês” elimina uma possível ambiguidade e soa mais natural que “dele”.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: ano após ano
  rationale: A repetição distributiva de שָׁנָה enfatiza a recorrência anual; “ano após ano” preserva essa ênfase em português corrente.
