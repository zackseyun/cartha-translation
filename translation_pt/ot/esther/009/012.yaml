base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: pt
  text: 'Então o rei disse à rainha Ester: “Na cidadela de Susã, os judeus mataram e exterminaram quinhentos homens, além dos dez filhos de Hamã. O que, então,[a] fizeram nas demais províncias do rei? Qual é o seu pedido? Ele lhe será concedido. E qual é ainda a sua solicitação? Ela será atendida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplesmente: “O que fizeram nas demais províncias do rei?” A pergunta hebraica também pode ser entendida sem a nuance inferencial expressa por “então”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: Na cidadela de Susã
  rationale: בִּירָה designa a cidadela ou complexo real fortificado; a formulação é natural em português e adequada ao contexto imperial persa.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: mataram e exterminaram
  rationale: A tradução mantém os dois verbos e sua força cumulativa. “Exterminaram” expressa o sentido intensivo de אבד no contexto hostil sem enfraquecer a construção.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: quinhentos homens
  rationale: אִישׁ, usado distributivamente após o numeral, refere-se diretamente a homens; a escolha preserva essa especificidade.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: além dos dez filhos de Hamã
  rationale: A expressão apresenta os filhos de Hamã como objeto adicional dos verbos; “além de” explicita com naturalidade essa relação aditiva.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: nas demais províncias do rei
  rationale: “Províncias” corresponde ao contexto administrativo persa, e “demais” comunica o restante delas de modo idiomático.
- source_word: מֶה עָשׂוּ
  choice: O que, então, fizeram
  rationale: “Então” torna perceptível a inferência retórica baseada no que ocorreu em Susã, sem alterar o conteúdo básico da pergunta.
- source_word: שְּׁאֵלָתֵךְ
  choice: seu pedido
  rationale: No livro de Ester, שאלה costuma indicar um pedido formal dirigido ao rei; “pedido” é claro, digno e natural em português.
- source_word: וְיִנָּתֵן לָךְ
  choice: Ele lhe será concedido
  rationale: O passivo de נתן significa idiomaticamente que o pedido será concedido; o pronome retoma explicitamente “pedido”.
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: ainda a sua solicitação
  rationale: “Solicitação” preserva a proximidade semântica com שאלה sem apagar a variação lexical, enquanto “ainda” expressa a ideia adicional de עוֹד.
- source_word: וְתֵעָשׂ
  choice: Ela será atendida
  rationale: No contexto de uma solicitação real, “ser atendida” comunica naturalmente que ela será levada a efeito, preservando a construção passiva.
