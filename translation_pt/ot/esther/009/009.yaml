  rationale: Transliteração direta do nome próprio hebraico, natural e reconhecível em português.
- source_word: אֲרִדַי
  choice: Aridai
  rationale: Transliteração direta do nome próprio hebraico.
- source_word: וַיְזָתָא
  choice: Vaizata
  rationale: Transliteração adaptada ao português, preservando a sequência sonora do nome hebraico sem recorrer a uma forma inglesa.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: lista separada por vírgulas, com «e» antes do último nome
  rationale: O hebraico repete a conjunção e o marcador de objeto antes de cada nome; em português corrente, vírgulas e um «e» final expressam naturalmente a mesma função enumerativa. A repetição original é registrada em nota.
