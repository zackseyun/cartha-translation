lexical_decisions:
- source_word: פַּרְמַשְׁתָּא
  choice: Parmasta
  rationale: Nome próprio transliterado em forma adaptada à ortografia e à pronúncia portuguesas; o grupo hebraico שְׁת é representado de modo legível como «st».
- source_word: אֲרִיסַי
