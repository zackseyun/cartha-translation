base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: pt
  text: Então Ester, a rainha, filha de Abiail, e Mardoqueu, o judeu, escreveram com plena autoridade[a] para confirmar esta segunda carta de Purim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com toda a autoridade”; ou: “com plena força”. A expressão hebraica ressalta a força oficial da carta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Então ... escreveram
  rationale: O waw consecutivo faz a narrativa avançar, por isso “Então” expressa naturalmente a progressão. Embora o hebraico empregue o verbo no singular antes do sujeito composto, o português requer normalmente o plural com Ester e Mardoqueu como sujeitos.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ester, a rainha
  rationale: Preserva a aposição hebraica e a identificação formal de Ester, em linguagem portuguesa natural.
- source_word: בַת אֲבִיחַיִל
  choice: filha de Abiail
  rationale: Reproduz diretamente a identificação genealógica presente no texto.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: e Mardoqueu, o judeu
  rationale: “Judeu” é a designação étnica convencional e contextualmente adequada em Ester; “judeano” seria possível, mas poderia sugerir uma delimitação sobretudo geográfica.
- source_word: אֶת כָּל תֹּקֶף
  choice: com plena autoridade
  rationale: תֹּקֶף pode indicar força, vigor ou poder. No contexto de uma carta oficial de confirmação, “plena autoridade” comunica melhor sua força institucional, sem excluir em nota as alternativas lexicais.
- source_word: לְקַיֵּם
  choice: para confirmar
  rationale: O infinitivo indica a finalidade da escrita. “Confirmar” é adequado para uma comunicação formal que ratifica uma observância já estabelecida.
- source_word: אֵת אִגֶּרֶת הַפּוּרִים
  choice: carta de Purim
  rationale: Mantém de modo conciso e formal a relação de construção entre “carta” e “Purim”.
- source_word: הַזֹּאת הַשֵּׁנִית
  choice: esta segunda
  rationale: Preserva o demonstrativo e a qualificação definida da carta como a segunda.
