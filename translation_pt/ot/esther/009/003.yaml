base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: pt
  text: Todos os oficiais das províncias, os sátrapas, os governadores e os encarregados dos negócios do rei apoiavam[a] os judeus, porque o medo de Mardoqueu havia caído sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ajudavam”; o verbo hebraico também pode transmitir a ideia de “erguiam” ou “favoreciam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: oficiais das províncias
  rationale: שָׂרִים designa autoridades ou dirigentes; “oficiais” é claro, atual e adequado à lista administrativa que se segue.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: sátrapas
  rationale: Empréstimo persa que designa altos administradores provinciais; o termo histórico preserva a ambientação e o distingue dos governadores mencionados em seguida.
- source_word: פַּחוֹת
  choice: governadores
  rationale: Título administrativo regional distinto de “sátrapas”; “governadores” é o equivalente português mais claro e corrente.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: os encarregados dos negócios do rei
  rationale: A expressão significa literalmente os que realizavam o trabalho pertencente ao rei. A formulação portuguesa comunica com naturalidade a ideia ampla de funcionários a serviço da administração real.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: apoiavam os judeus
  rationale: O hifil de נָשָׂא pode expressar levantar, sustentar ou favorecer. No contexto, “apoiavam” comunica assistência prática sem afirmar de modo excessivo que os exaltavam socialmente; a nota preserva a amplitude lexical.
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa do apoio prestado pelos oficiais.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: o medo de Mardoqueu havia caído sobre eles
  rationale: Preserva a metáfora hebraica de o medo cair sobre alguém e representa o aspecto concluído do verbo no contexto narrativo.
- source_word: מָרְדֳּכַי
  choice: Mardoqueu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
