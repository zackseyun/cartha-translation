  text: עֲ֠שֶׂרֶת בְּנֵ֨י הָמָ֧ן בֶּֽן הַמְּדָ֛תָא צֹרֵ֥ר הַ/יְּהוּדִ֖ים הָרָ֑גוּ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/010.yaml
  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: pt
  text: Mataram os dez filhos de Hamã, filho de Hamedata, inimigo dos judeus; porém, não puseram a mão nos despojos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saque”.'
    reason: Alternativa lexical para בִּזָּה, que pode designar os bens saqueados ou o próprio saque.
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: os dez filhos de Hamã
  rationale: O numeral em estado construto forma uma expressão definida com os filhos homens de Hamã enumerados no contexto. A ordem foi ajustada para uma frase natural em português.
- source_word: בֶּן הַמְּדָתָא
  choice: filho de Hamedata
  rationale: Mantém a aposição genealógica e translitera o nome próprio segundo a forma portuguesa corrente.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: inimigo dos judeus
  rationale: צֹרֵר designa alguém hostil ou opressor; “inimigo” é claro, preciso e natural neste aposto.
- source_word: הָרָגוּ
  choice: mataram
  rationale: Tradução direta do qatal na terceira pessoa do plural de הרג, em linguagem moderna e sem eufemismo.
- source_word: וּבַבִּזָּה
  choice: porém ... nos despojos
  rationale: בִּזָּה indica bens tomados do inimigo. “Despojos” é uma equivalência portuguesa clara no contexto bélico, e o waw recebe valor adversativo por causa do contraste discursivo.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: não puseram a mão
  rationale: A expressão idiomática significa não tomar nem se apropriar de algo. Esta formulação preserva a imagem concreta do hebraico e soa natural em português.
