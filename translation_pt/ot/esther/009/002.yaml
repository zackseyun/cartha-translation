  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: pt
  text: Os judeus se reuniram em suas cidades, em todas as províncias do rei Assuero, para atacar os que procuravam causar-lhes mal[a]. Ninguém conseguiu resistir-lhes[b], pois o temor que inspiravam caiu sobre todos os povos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estender a mão contra”; a expressão hebraica indica aqui uma ação hostil.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e ninguém ficou de pé diante deles”.
    reason: lexical_alternative
  - marker: c
    text: “Povos” provavelmente se refere aos diversos grupos étnicos ou às diferentes populações do império, e não apenas a uma única nação.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: se reuniram
  rationale: O nifal de קהל expressa reunião coletiva; “se reuniram” é natural em português e preserva o sentido ativo-reflexivo do contexto.
- source_word: בְּעָרֵיהֶם
  choice: em suas cidades
  rationale: עִיר significa normalmente “cidade”; o sufixo pronominal foi preservado.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: em todas as províncias do rei Assuero
  rationale: מְדִינוֹת designa as divisões administrativas do Império Persa. “Assuero” é a forma portuguesa bíblica tradicional e amplamente reconhecida.
- source_word: לִשְׁלֹחַ יָד
  choice: para atacar
  rationale: A expressão, literalmente “estender/enviar a mão contra”, indica ação hostil. “Atacar” comunica seu sentido contextual com clareza, enquanto a forma literal é registrada em nota.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: os que procuravam causar-lhes mal
  rationale: Preserva a construção participial, “os que buscavam o mal deles”, em português natural, sem especificar além do texto a forma desse mal.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: Ninguém conseguiu resistir-lhes
  rationale: A formulação hebraica, literalmente “nenhum homem ficou de pé diante deles”, tem aqui o sentido idiomático de não conseguir oferecer resistência.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: pois o temor que inspiravam caiu
  rationale: פַּחַד pode indicar medo ou pavor. A formulação mantém a imagem hebraica de o temor “cair sobre” alguém e esclarece que se trata do medo sentido pelos povos diante dos judeus.
- source_word: עַל כָּל הָעַמִּים
  choice: sobre todos os povos
  rationale: O plural עַמִּים aponta para os diversos povos ou grupos populacionais do império, não apenas para uma única nação.
