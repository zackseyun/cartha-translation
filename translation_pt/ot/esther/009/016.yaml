base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: pt
  text: E os demais judeus que estavam nas províncias do rei se reuniram, defenderam a própria vida[a], obtiveram alívio de seus inimigos e mataram setenta e cinco mil dos que os odiavam; mas não lançaram mão dos despojos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomaram posição em defesa da própria vida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “saque”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: E os demais judeus
  rationale: “Os demais” expressa naturalmente o grupo restante e mantém o contraste com os judeus de Susã mencionado no contexto anterior.
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: que estavam nas províncias do rei
  rationale: מְדִינוֹת designa as divisões administrativas do império; “províncias do rei” é claro e natural em português.
- source_word: נִקְהֲלוּ
  choice: se reuniram
  rationale: A forma verbal descreve uma reunião coletiva; o pronome “se” preserva adequadamente seu caráter reflexivo/corporativo.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: defenderam a própria vida
  rationale: O idioma hebraico, literalmente ligado a “tomar posição por sua vida”, indica resistência em defesa da vida. A formulação portuguesa comunica isso com clareza sem apagar a imagem alternativa, registrada em nota.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: obtiveram alívio de seus inimigos
  rationale: נוּחַ aqui indica alcançar descanso ou alívio diante dos inimigos; “obtiveram alívio” é digno e compreensível.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: e mataram ... dos que os odiavam
  rationale: A expressão relata diretamente a morte de integrantes do grupo hostil. “Os que os odiavam” traduz o particípio substantivado sem intensificação.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: setenta e cinco mil
  rationale: A ordem numérica foi ajustada ao uso natural do português.
- source_word: וּבַבִּזָּה
  choice: mas ... dos despojos
  rationale: בִּזָּה designa bens tomados em guerra. “Despojos” é corrente no registro bíblico e a conjunção adversativa explicita o contraste contextual.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: não lançaram mão
  rationale: A locução portuguesa preserva de modo natural o idioma hebraico de estender a mão para tomar ou se apoderar de algo.
theological_decisions:
- issue: Enquadramento moral da ação dos judeus
  choice: defenderam a própria vida
  alternative: tomaram posição por sua vida
  rationale: A tradução conserva o enquadramento de preservação da vida presente no hebraico, sem amenizar a matança relatada nem apresentar a ação como agressão não motivada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe narrativa foi mantida em uma única sequência coordenada, acompanhando o hebraico. “Despojos” preserva o registro bíblico sem ser arcaico; a alternativa mais cotidiana aparece em nota.
