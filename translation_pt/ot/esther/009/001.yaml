  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: pt
  text: 'No décimo segundo mês, isto é, o mês de Adar, no décimo terceiro dia desse mês, quando a palavra do rei e seu decreto deviam ser cumpridos, no dia em que os inimigos dos judeus esperavam dominá-los, aconteceu o contrário[a]: os próprios judeus dominaram os que os odiavam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a situação se inverteu” ou “houve uma reviravolta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: No décimo segundo mês
  rationale: A construção introduz a data; a conjunção inicial funciona como ligação narrativa e não exige um marcador como “então” em português.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: isto é, o mês de adar
  rationale: A expressão identifica de modo explicativo o décimo segundo mês. “Isto é” reproduz naturalmente a aposição.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: no dia treze
  rationale: Forma corrente e clara em português para o décimo terceiro dia do mês; a referência ao mês permanece inequívoca no contexto imediato.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: quando a palavra do rei e seu decreto deviam ser cumpridos
  rationale: Expressa a chegada do momento determinado para a execução. “Palavra” e “decreto” preservam a distinção entre דָּבָר e דָּת.
- source_word: שִׂבְּרוּ
  choice: esperavam
  rationale: O verbo indica expectativa ou esperança; “esperavam” conserva a ironia narrativa sem acrescentar uma avaliação explícita.
- source_word: לִשְׁלֹט בָּהֶם
  choice: dominá-los
  rationale: שׁלט descreve exercer domínio sobre alguém. “Dominar” é direto e adequado ao contexto de conflito.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: aconteceu o contrário
  rationale: A locução hebraica assinala uma inversão dramática. A tradução é idiomática e mantém a possibilidade de uma formulação mais literal em nota.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: os próprios judeus dominaram
  rationale: “Próprios” representa a ênfase de הֵמָּה e reforça o contraste com a expectativa dos inimigos.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: os que os odiavam
  rationale: Mantém a força verbal do particípio hebraico, em vez de reduzi-lo simplesmente a “inimigos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A longa estrutura temporal do hebraico foi preservada, e os dois usos de “dominar” mantêm o contraste deliberado do original. O marcador da nota foi colocado junto à expressão de reversão à qual a nota se refere.
