base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: pt
  text: Então Mardoqueu escreveu essas coisas[a] e enviou cartas a todos os judeus que estavam em todas as províncias do rei Assuero, tanto aos que estavam perto como aos que estavam longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essas palavras”. O hebraico pode se referir tanto aos assuntos ou acontecimentos que acabam de ser narrados como às palavras que Mardoqueu escreveu a respeito deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: O verbo כתב indica diretamente o ato de escrever; a forma narrativa expressa a sequência dos acontecimentos.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas coisas
  rationale: דְּבָרִים pode significar palavras, assuntos ou acontecimentos. “Essas coisas” preserva a amplitude da expressão e sua referência ao que acaba de ser narrado, sem excluir o conteúdo escrito.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: enviou cartas
  rationale: Neste contexto administrativo, סְפָרִים designa comunicações escritas; “cartas” é claro, natural e adequado ao cenário imperial persa.
- source_word: כָּל הַיְּהוּדִים
  choice: todos os judeus
  rationale: Tradução direta da expressão que designa a comunidade judaica espalhada pelo império.
- source_word: בְּכָל מְדִינוֹת
  choice: em todas as províncias
  rationale: מְדִינוֹת refere-se às divisões administrativas do império; “províncias” é o equivalente português mais claro.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: do rei Assuero
  rationale: Mantém a construção titular em ordem natural no português e emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: tanto aos que estavam perto como aos que estavam longe
  rationale: Explicita naturalmente em português os adjetivos substantivados e preserva a abrangência do par hebraico.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo dá continuidade à sequência narrativa; “Então” comunica essa progressão com naturalidade em português moderno.
