  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הֵֽעָשׂ֣וֹת כֵּ֔ן וַ/תִּנָּתֵ֥ן דָּ֖ת בְּ/שׁוּשָׁ֑ן וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן תָּלֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: pt
  text: Então o rei disse que assim se fizesse. Um decreto foi promulgado em Susã, e os dez filhos de Hamã foram pendurados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “empalados”; o verbo hebraico pode se referir a pendurar corpos numa estaca ou num poste, não necessariamente a enforcá-los pelo pescoço no sentido moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ordenou
  rationale: Embora אמר signifique normalmente “dizer”, neste contexto a fala do rei autoriza oficialmente o pedido de Ester; “ordenou que” comunica de modo natural a força pragmática da declaração, sem depender de uma fórmula portuguesa pouco idiomática.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: que assim se fizesse
  rationale: Preserva a construção passiva e o sentido de que o pedido deveria ser executado daquela maneira, em português claro e digno.
- source_word: וַתִּנָּתֵן דָּת
  choice: Um decreto foi promulgado
  rationale: A combinação נתן + דת é uma expressão administrativa do período persa. “Foi promulgado” transmite a emissão oficial do decreto com naturalidade.
- source_word: בְּשׁוּשָׁן
  choice: em Susã
  rationale: “Susã” é a forma tradicional e amplamente reconhecida do topônimo em português bíblico.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: os dez filhos de Hamã
  rationale: Tradução direta da cadeia construta, com o artigo necessário em português.
- source_word: תָּלוּ
  choice: foram pendurados
  rationale: תלה pode indicar suspender ou expor corpos numa estaca ou poste; “pendurados” preserva maior amplitude lexical que “enforcados”, enquanto a nota registra a possibilidade de empalamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A formulação evita identificar com certeza o método de execução ou exposição, que permanece lexicalmente ambíguo no hebraico.
