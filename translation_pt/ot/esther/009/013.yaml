base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: pt
  text: 'Ester disse: “Se for do agrado do rei, que também amanhã seja permitido aos judeus que estão em Susã proceder conforme o decreto de hoje; e que os dez filhos de Hamã sejam pendurados no madeiro[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na árvore”, “na estaca” ou “no poste”. O hebraico diz literalmente “na madeira/árvore” e, neste contexto, refere-se a uma estrutura de execução.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Se for do agrado do rei
  rationale: A expressão idiomática comunica a aprovação ou o consentimento real e preserva o registro cortês da fala de Ester.
- source_word: יִנָּתֵן
  choice: seja concedido
  rationale: O passivo de valor volitivo apresenta o pedido como concessão oficial do rei.
- source_word: גַּם מָחָר
  choice: também amanhã
  rationale: Indica a extensão da autorização por mais um dia, mantendo a ênfase de גַּם.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: aos judeus que estão em Susã
  rationale: Reproduz o beneficiário da concessão e a oração relativa hebraica em português natural.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: fazer conforme o decreto de hoje
  rationale: Mantém deliberadamente amplo o verbo 'fazer', enquanto 'decreto' expressa o sentido oficial de דָּת no contexto persa.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: os dez filhos de Hamã
  rationale: Representa com clareza e naturalidade a cadeia construta hebraica.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: sejam pendurados na estrutura de madeira
  rationale: תלה significa pendurar, e עֵץ designa literalmente árvore ou madeira, podendo no contexto referir-se a uma estaca, poste ou estrutura de execução. A formulação evita definir além da evidência o método preciso.
