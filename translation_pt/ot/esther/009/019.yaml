  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: pt
  text: Por isso, os judeus que viviam nas cidades sem muralhas celebram o décimo quarto dia do mês de adar como dia de alegria, banquete e dia festivo, e enviam porções, cada um ao seu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão ou consequência decorrente da narrativa anterior.
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: Em Ester, designa o povo judeu como grupo étnico-religioso no Império Persa, e não apenas habitantes de Judá.
- source_word: הפרוזים
  choice: das aldeias
  rationale: Identifica os judeus dos povoados abertos ou não fortificados, em contraste contextual com os habitantes de cidades muradas; a nota preserva a nuance lexical.
- source_word: הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: que moram nas cidades não fortificadas
  rationale: Torna explícita a característica geográfica central do hebraico e evita confundir esses locais com a zona rural em sentido estrito.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: celebram o décimo quarto dia
  rationale: Neste uso, עשה aplicado a um dia significa observá-lo ou celebrá-lo; 'celebram' é corrente e adequado ao contexto festivo.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: do mês de adar
  rationale: Reproduz naturalmente a fórmula hebraica de datação.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Preserva o substantivo e o sentido emocional da celebração.
- source_word: וּמִשְׁתֶּה
  choice: banquetes
  rationale: O termo denota refeições festivas, frequentemente acompanhadas de bebida; 'banquetes' comunica isso sem especificar além do texto.
- source_word: וְיוֹם טוֹב
  choice: festa
  rationale: A expressão idiomática indica um dia festivo ou feriado; no encadeamento em português, 'festa' é claro e natural.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: enviando porções
  rationale: Mantém a relativa generalidade do hebraico, embora no contexto provavelmente se trate de porções de comida ou presentes para o banquete.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: cada um ao seu próximo
  rationale: Conserva a construção distributiva e a referência individual, com formulação portuguesa natural e sem restringir indevidamente a prática aos homens.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ לְרֵעֵהוּ
  choice: cada um ao seu próximo
  alternative: cada homem ao seu próximo; uns aos outros
  rationale: O masculino singular hebraico funciona aqui distributivamente e representa os membros da comunidade. A formulação escolhida preserva a estrutura individual sem introduzir exclusão sexual que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a distinção entre assentamentos abertos e cidades muradas e preserva na nota a amplitude de מָנוֹת.
