  terminology: «Mardoqueu» e «Ester» seguem as formas bíblicas correntes em português. «Estabelecer» representa de maneira consistente o valor formal de קִיֵּם; «assumido para si mesmos e para seus descendentes» explicita naturalmente a construção reflexiva final. «Clamores» conserva a amplitude de זַעֲקָתָם, sem defini-la como oração ou lamento.
