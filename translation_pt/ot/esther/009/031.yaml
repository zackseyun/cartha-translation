  text: לְ/קַיֵּ֡ם אֵת יְמֵי֩ הַ/פֻּרִ֨ים הָ/אֵ֜לֶּה בִּ/זְמַנֵּי/הֶ֗ם כַּ/אֲשֶׁר֩ קִיַּ֨ם עֲלֵי/הֶ֜ם מָרְדֳּכַ֤י הַ/יְּהוּדִי֙ וְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וְ/כַ/אֲשֶׁ֛ר קִיְּמ֥וּ עַל נַפְשָׁ֖/ם וְ/עַל זַרְעָ֑/ם דִּבְרֵ֥י הַ/צֹּמ֖וֹת וְ/זַעֲקָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: pt
  text: 'para estabelecer estes dias de Purim em suas datas determinadas[a], conforme Mardoqueu, o judeu, e Ester, a rainha, os haviam estabelecido para eles, e conforme eles os haviam assumido para si mesmos e para seus descendentes: as disposições relativas aos jejuns e aos seus clamores[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «confirmar». O verbo hebraico repetido neste versículo pode indicar estabelecer, confirmar ou ratificar formalmente uma observância.
    reason: lexical_alternative
  - marker: b
    text: «Clamores» também pode ser traduzido como «gritos» ou «lamentos». O hebraico provavelmente se refere aos clamores da comunidade associados aos jejuns.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם אֵת יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: para confirmar a celebração destes dias de Purim
  rationale: O piel de קום tem aqui o sentido de fazer vigorar, ratificar ou estabelecer formalmente. “Confirmar a celebração” expressa em português natural que a observância desses dias estava sendo formalmente fixada, sem reduzir o verbo a simplesmente “celebrar”.
- source_word: בִּזְמַנֵּיהֶם
  choice: nas datas fixadas
  rationale: זְמָן indica tempo determinado ou designado. “Datas fixadas” é claro no contexto da celebração anual dos dois dias de Purim.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: assim como ... haviam determinado para eles
  rationale: A construção com עַל comunica uma determinação tornada válida para a comunidade. “Determinado para eles” preserva o caráter formal sem sugerir necessariamente coerção.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Mordecai, o judeu
  rationale: “O judeu” é a designação étnica tradicional e contextualmente adequada; “judeu” tem leitura mais natural e ampla do que uma designação apenas geográfica.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: a rainha Ester
  rationale: A forma portuguesa idiomática mantém tanto o nome quanto o título da personagem.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: e assim como eles próprios haviam assumido, por si e por seus descendentes
  rationale: Com עַל נַפְשָׁם, קִיְּמוּ descreve assumir sobre si uma obrigação. “Eles próprios haviam assumido” comunica esse valor reflexivo; “descendentes” torna explícito o sentido coletivo de זֶרַע neste contexto.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: a observância dos jejuns e o seu clamor
  rationale: דִּבְרֵי pode indicar os assuntos, disposições ou práticas referentes aos jejuns; “observância” se ajusta ao compromisso assumido. זַעֲקָה é um clamor intenso, sem exigir que se especifique se era lamento, súplica ou oração.
theological_decisions:
- issue: Natureza do clamor associado aos jejuns
  choice: seu clamor
  alternative: sua oração; seu lamento
  rationale: O hebraico זַעֲקָה descreve um grito ou clamor intenso, mas não define sozinho sua natureza precisa. A tradução evita identificá-lo exclusivamente como oração ou lamento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos. A repetição do verbo hebraico קום foi vertida de modo contextual (“confirmar”, “determinar”, “assumir”), preservando sua função formal em cada construção sem produzir repetição artificial em português.
