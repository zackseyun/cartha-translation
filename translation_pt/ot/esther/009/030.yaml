id: EST.9.30
reference: Esther 9:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֶל שֶׁ֨בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מַלְכ֖וּת אֲחַשְׁוֵר֑וֹשׁ דִּבְרֵ֥י שָׁל֖וֹם וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: pt
  text: E ele enviou cartas a todos os judeus nas cento e vinte e sete províncias do reino de Assuero[a], com palavras de paz e verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Assuero é a forma portuguesa tradicional do nome hebraico; alguns o identificam historicamente com Xerxes I.
    reason: cultural_note
  - marker: b
    text: Literalmente, “palavras de paz e verdade”. Neste contexto, “verdade” também pode ter o sentido de “fidelidade” ou “confiabilidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: E ele enviou
  rationale: O wayyiqtol dá continuidade à narrativa; a formulação preserva essa sequência sem acrescentar uma nuance temporal não explícita.
- source_word: סְפָרִים
  choice: cartas
  rationale: No contexto administrativo persa, o plural indica comunicações escritas enviadas pelo império; “cartas” é natural e preciso em português.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: a todos os judeus
  rationale: A expressão abrange coletivamente os judeus espalhados pelo império.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: nas cento e vinte e sete províncias
  rationale: O segundo אֶל indica a extensão geográfica dos destinatários; “nas” esclarece naturalmente que os judeus estavam nessas províncias.
- source_word: מְדִינָה
  choice: províncias
  rationale: Em Ester, o termo designa regiões administrativas do Império Persa; “províncias” é o equivalente corrente mais claro.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: do reino de Assuero
  rationale: Reproduz diretamente a cadeia construta e mantém o tom imperial formal, sem acrescentar “rei”, ausente nesta frase.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuero
  rationale: Emprega a forma tradicional portuguesa baseada no nome hebraico, sem substituí-la por uma identificação histórica.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: com palavras de paz e verdade
  rationale: Preserva a expressão hebraica “palavras de paz e verdade”; “com” integra a frase naturalmente em português, e a nota registra a possível nuance de אֱמֶת.
