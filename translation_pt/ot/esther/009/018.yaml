base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: pt
  text: Mas os judeus que estavam em Susã se reuniram no décimo terceiro dia e no décimo quarto dia daquele mês[a]. No décimo quinto dia, descansaram e fizeram dele um dia de banquete e alegria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “no décimo terceiro dele ... no décimo quarto dele ... no décimo quinto dele”; “dele” se refere ao mês entendido pelo contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um dia de festa e júbilo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: Mas os judeus
  rationale: O waw assinala aqui o contraste com os judeus das províncias mencionados no versículo anterior; “Mas” torna esse contraste claro em português natural.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: que estavam em Susã
  rationale: Identifica o grupo de judeus localizado na capital; “Susã” é a forma tradicional e reconhecível em português.
- source_word: נִקְהֲלוּ
  choice: se reuniram
  rationale: O nifal de קהל indica reunir-se ou congregar-se, sem exigir uma interpretação adicional quanto ao motivo.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: no décimo terceiro e no décimo quarto dias daquele mês
  rationale: Os sufixos em בּוֹ remetem ao mês conhecido pelo contexto. A explicitação de “mês” evita em português a expressão pouco natural “dele”, enquanto a nota registra a forma hebraica.
- source_word: וְנוֹחַ
  choice: descansaram
  rationale: O verbo נוח expressa cessação e repouso após o conflito; “descansaram” é direto e natural.
- source_word: בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: No décimo quinto dia
  rationale: O mês continua subentendido pelo contexto imediato; não é necessário repeti-lo no texto corrente.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: e fizeram dele
  rationale: Reproduz de modo natural o sentido de tratar ou estabelecer aquele dia como uma ocasião específica.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: um dia de banquetes e alegria
  rationale: מִשְׁתֶּה designa banquete ou festa, frequentemente associado a bebidas, e שִׂמְחָה significa alegria; a combinação conserva o caráter festivo.
