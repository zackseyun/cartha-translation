  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: pt
  text: No dia treze do mês de Adar,[a] descansaram no dia catorze do mesmo mês e fizeram dele um dia de banquete e alegria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adar é o décimo segundo mês do calendário judaico; corresponde aproximadamente a fevereiro-março.
    reason: cultural_note
  - marker: b
    text: 'As formas verbais hebraicas também podem ser representadas de modo menos finito: “descansando no dia catorze do mesmo mês e fazendo dele um dia de banquete e alegria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר
  choice: no dia treze
  rationale: A preposição בְּ marca tempo, e o numeral cardinal é usado com valor de data. “No dia treze” é a formulação natural em português.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: do mês de adar
  rationale: Mantém a fórmula hebraica de datação e translitera o nome próprio do mês de forma corrente em português.
- source_word: וְנוֹחַ
  choice: descansaram
  rationale: O verbo נוח indica que cessaram o combate e tiveram descanso. Embora a forma hebraica não seja um verbo finito comum, no contexto ela prossegue a narrativa e pede uma forma finita natural em português.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: no dia catorze do mesmo mês
  rationale: O pronome בּוֹ retoma o mês de adar. Explicitar “do mesmo mês” evita uma referência pouco natural ou ambígua em português sem acrescentar conteúdo.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: e fizeram dele
  rationale: A expressão apresenta o dia como destinado ou celebrado de determinada maneira. A forma finita mantém a sequência narrativa em português.
- source_word: יוֹם מִשְׁתֶּה
  choice: um dia de banquetes
  rationale: מִשְׁתֶּה designa banquete ou festa, frequentemente com comida e bebida. “Banquetes” comunica bem o caráter celebrativo.
- source_word: וְשִׂמְחָה
  choice: e alegria
  rationale: שִׂמְחָה denota alegria e celebração; “alegria” é claro, atual e preserva a construção nominal.
