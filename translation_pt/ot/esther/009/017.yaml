translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A abertura “Isso aconteceu” supre o elo narrativo implícito no fragmento hebraico; as formas finitas refletem sua função contextual, enquanto a nota preserva a possibilidade de uma representação mais formal da sintaxe.
