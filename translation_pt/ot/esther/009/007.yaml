lexical_decisions:
- source_word: וְאֵת
  choice: não traduzido separadamente; expresso pela coordenação e pela pontuação da lista
  rationale: אֵת é o marcador do objeto direto definido. A repetição de וְאֵת organiza os nomes como objetos do verbo “mataram”, no versículo anterior; em português, essa função é transmitida naturalmente por vírgulas e pela conjunção “e”.
- source_word: פַּרְשַׁנְדָּתָא
  choice: Parsandata
  rationale: Nome próprio provavelmente de origem persa, transliterado em forma natural para leitores de língua portuguesa, sem tentar traduzir sua etimologia incerta.
- source_word: דַּלְפוֹן
  choice: Dalfom
  rationale: Nome próprio transliterado segundo convenções fonológicas e ortográficas usuais do português, em que o /n/ final dessa forma é representado naturalmente por “m” após “o”.
- source_word: אַסְפָּתָא
  choice: Aspata
  rationale: Nome próprio de origem persa transliterado em forma clara e natural em português, preservando a sequência consonantal do texto hebraico.
