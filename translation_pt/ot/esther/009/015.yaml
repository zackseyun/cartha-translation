  text: וַ/יִּֽקָּהֲל֞וּ ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן גַּ֠ם בְּ/י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וַ/יַּֽהַרְג֣וּ בְ/שׁוּשָׁ֔ן שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: pt
  text: Os judeus que estavam em Susã também se reuniram no décimo quarto dia do mês de adar e mataram trezentos homens em Susã; mas não tocaram nos despojos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não estenderam a mão aos despojos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: se reuniram
  rationale: Expressa de modo natural o ajuntamento coletivo e intencional indicado pelo verbo קהל.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: Os judeus que estavam em Susã
  rationale: Identifica claramente o grupo judeu localizado na cidade; “Susã” é a forma portuguesa tradicional do topônimo.
- source_word: גַּם
  choice: também
  rationale: Preserva o valor aditivo em relação aos acontecimentos anteriores.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: no décimo quarto dia do mês de adar
  rationale: Mantém a expressão completa da data em linguagem portuguesa clara; “adar” é nome de mês e aparece em minúscula segundo o uso ortográfico moderno.
- source_word: וַיַּהַרְגוּ
  choice: mataram
  rationale: Tradução direta e atual do verbo הרג, sem eufemismo nem arcaísmo.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: trezentos homens
  rationale: Preserva a referência masculina explícita de אִישׁ neste contexto.
- source_word: וּבַבִּזָּה
  choice: mas ... nos despojos
  rationale: “Despojos” designa naturalmente os bens tomados em conflito; “mas” explicita o contraste contextual introduzido pela conjunção.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: não tocaram
  rationale: Equivalente idiomático conciso para a expressão hebraica de não estender a mão para tomar ou apropriar-se de algo.
