base_translation:
  language: en
  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: pt
  text: E a ordem de Ester confirmou estas disposições acerca de Purim[a], e isso foi escrito no livro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estas questões relativas às celebrações de Purim”. O termo hebraico também pode significar “palavras”, “assuntos” ou “determinações”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e isso foi registrado no livro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר
  choice: ordem
  rationale: No contexto, designa a determinação oficial e dotada de autoridade de Ester, não apenas uma palavra falada.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: קִיַּם
  choice: confirmou
  rationale: O verbo expressa fazer permanecer, estabelecer ou ratificar; “confirmou” preserva o tom administrativo e combina naturalmente com “ordem” como sujeito.
- source_word: דִּבְרֵי הַפֻּרִים הָאֵלֶּה
  choice: estas disposições acerca de Purim
  rationale: דִּבְרֵי pode indicar palavras, assuntos ou determinações; “disposições” comunica aqui o conteúdo oficial referente à observância, enquanto “acerca de” evita sugerir que Purim seja o possuidor literal das palavras.
- source_word: וְנִכְתָּב
  choice: e isso foi escrito
  rationale: Mantém a voz passiva do nifal. O pronome neutro retoma naturalmente, em português, o conteúdo confirmado sem definir de modo indevido um antecedente mais específico.
- source_word: בַּסֵּפֶר
  choice: no livro
  rationale: Tradução direta que preserva a indefinição do texto quanto à identidade e ao formato exato do documento.
