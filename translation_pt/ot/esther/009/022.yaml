base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: pt
  text: como os dias em que os judeus descansaram de seus inimigos e como o mês que, para eles, se transformou de tristeza em alegria e de luto em dia de festa[a], que fizessem deles dias de banquete e alegria, de envio de porções[b] uns aos outros[c] e de presentes aos pobres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dia bom”; também pode ser traduzido por “dia de celebração”.
    reason: lexical_alternative
  - marker: b
    text: As “porções” provavelmente eram porções de comida enviadas como presentes festivos.
    reason: cultural_note
  - marker: c
    text: Literalmente, “cada homem ao seu próximo”; é uma expressão distributiva que indica o envio recíproco de porções.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחוּ
  choice: descansaram
  rationale: O verbo נוח indica entrar em descanso ou obter alívio. “Descansaram de seus inimigos” conserva a imagem hebraica e expressa o alívio alcançado.
- source_word: נֶהְפַּךְ
  choice: se transformou
  rationale: O nifal de הפך descreve uma reversão sofrida pelo mês; a construção pronominal é natural em português e mantém essa mudança de estado.
- source_word: יָגוֹן ... שִׂמְחָה
  choice: tristeza ... alegria
  rationale: A dupla portuguesa reproduz com clareza o contraste emocional entre יגון e שמחה.
- source_word: אֵבֶל
  choice: luto
  rationale: אֵבֶל designa lamento ou luto, mais forte e público que a tristeza mencionada anteriormente.
- source_word: לְיוֹם טוֹב
  choice: em dia de festa
  rationale: Embora a expressão seja literalmente “em dia bom”, no contexto יום טוב designa um dia festivo. A nota preserva a forma literal e sua possível amplitude.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: deviam fazer desses dias ocasiões
  rationale: A formulação explicita em português o valor prescritivo dependente do contexto anterior e evita a pouco natural expressão “fazê-los dias”.
- source_word: יְמֵי מִשְׁתֶּה וְשִׂמְחָה
  choice: ocasiões de banquetes e alegria
  rationale: מִשְׁתֶּה é um banquete ou festa com comida e bebida; “banquetes” mantém o caráter celebrativo sem restringi-lo à bebida.
- source_word: מִשְׁלוֹחַ מָנוֹת
  choice: enviar porções
  rationale: A tradução conserva a generalidade de מָנוֹת; no costume festivo, provavelmente se trata de porções de comida, esclarecidas em nota.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: uns aos outros
  rationale: A expressão masculina singular é distributiva, literalmente “um homem ao seu próximo”. Em português, “uns aos outros” comunica naturalmente a reciprocidade sem afirmar que apenas homens participavam.
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: dar presentes aos pobres
  rationale: אֶבְיוֹנִים refere-se a pessoas pobres ou necessitadas; “aos pobres” é direto e preserva a ênfase social.
theological_decisions:
- issue: Alcance da expressão distributiva אִישׁ לְרֵעֵהוּ
  choice: uns aos outros
  alternative: cada homem ao seu próximo
  rationale: O masculino singular funciona aqui como expressão distributiva de reciprocidade. A tradução escolhida reproduz a função do hebraico sem impor uma exclusão de mulheres que o contexto não exige.
- issue: Sentido de יוֹם טוֹב
  choice: dia de festa
  alternative: dia bom
  rationale: O contexto de banquetes e alegria favorece o sentido festivo, mas a nota registra a forma literal para não ocultar a amplitude da expressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção fluente para uma oração que continua o versículo anterior. “Judeus” permanece em minúscula segundo o uso ortográfico corrente; “banquetes”, “alegria” e “presentes aos pobres” preservam o caráter público e festivo da observância.
