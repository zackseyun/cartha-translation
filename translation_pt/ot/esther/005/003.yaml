base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: pt
  text: 'Então o rei lhe disse: “O que você deseja, rainha Ester?[a] E qual é o seu pedido?[b] Até metade do reino lhe será dada.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que a preocupa, rainha Ester?” A expressão hebraica diz literalmente: “Que há para você?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Qual é a sua petição?”'
    reason: lexical_alternative
  - marker: c
    text: Esta era uma fórmula régia convencional de promessa generosa, não necessariamente uma oferta literal de dividir o reino.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהּ הַמֶּלֶךְ
  choice: Então o rei lhe perguntou
  rationale: O waw consecutivo faz a narrativa avançar. Embora וַיֹּאמֶר signifique literalmente “disse”, o conteúdo interrogativo torna “perguntou” natural em português; לָהּ é preservado por “lhe”.
- source_word: מַה לָּךְ
  choice: O que você deseja
  rationale: A expressão idiomática hebraica, literalmente “que há para você?”, pergunta o que Ester quer ou o que a preocupa. A formulação escolhida é clara no contexto sem afirmar que ela esteja aflita.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: rainha Ester
  rationale: Mantém o nome e o título em ordem idiomática no português moderno.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Qual é o seu pedido?
  rationale: בַּקָּשָׁה pode indicar pedido ou petição. “Pedido” é corrente, compreensível e adequado à audiência real.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Até metade do reino
  rationale: Reproduz diretamente o limite declarado na fórmula régia, preservando sua força retórica.
- source_word: וְיִנָּתֵן לָךְ
  choice: lhe será dada
  rationale: O nifal imperfeito expressa aqui uma promessa passiva. O feminino “dada” retoma naturalmente “metade”, sem inserir um objeto indefinido.
