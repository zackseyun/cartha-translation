translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. O tratamento por “você” evita solenidade artificial; a fala permanece respeitosa pelo uso do título “rainha Ester”. Todos os marcadores aparecem junto ao trecho pertinente no texto.
