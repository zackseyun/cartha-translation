base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: pt
  text: Naquele dia, Hamã saiu alegre e de coração contente. Mas, quando Hamã viu Mardoqueu no portão do rei e que ele não se levantou nem tremeu diante dele[a], Hamã ficou cheio de ira contra Mardoqueu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem demonstrou medo diante dele”.'
    reason: Alternativa lexical para זָע, que pode indicar tremer, agitar-se ou manifestar temor.
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: alegre e de coração contente
  rationale: Preserva os dois elementos da expressão hebraica e comunica de modo natural o estado exultante de Hamã.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Mantém a referência temporal específica do hebraico em português corrente.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: no portão do rei
  rationale: A preposição ב pode indicar localização em ou junto ao complexo do portão; “no portão” é natural e preserva a formulação do texto.
- source_word: וְלֹא קָם
  choice: não se levantava
  rationale: Refere-se ao gesto de levantar-se em sinal de deferência; o imperfeito português apresenta a conduta observada por Hamã.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: nem tremia diante dele
  rationale: זוע pode significar tremer, agitar-se ou mostrar medo. A tradução conserva a imagem física e deixa a alternativa contextual em nota.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: ficou cheio de ira
  rationale: Reproduz a construção hebraica de ser enchido de חֵמָה e expressa uma cólera intensa em registro digno e compreensível.
- source_word: עַל מָרְדֳּכַי
  choice: contra Mardoqueu
  rationale: Com um termo de ira, עַל assinala naturalmente o alvo da hostilidade.
