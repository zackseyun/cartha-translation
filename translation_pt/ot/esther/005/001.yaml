  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וַ/תִּלְבַּ֤שׁ אֶסְתֵּר֙ מַלְכ֔וּת וַֽ/תַּעֲמֹ֞ד בַּ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/פְּנִימִ֔ית נֹ֖כַח בֵּ֣ית הַ/מֶּ֑לֶךְ וְ֠/הַ/מֶּלֶךְ יוֹשֵׁ֞ב עַל כִּסֵּ֤א מַלְכוּת/וֹ֙ בְּ/בֵ֣ית הַ/מַּלְכ֔וּת נֹ֖כַח פֶּ֥תַח הַ/בָּֽיִת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: pt
  text: No terceiro dia, Ester vestiu seus trajes reais[a] e pôs-se de pé no pátio interno do palácio do rei, em frente à casa do rei, enquanto o rei estava sentado em seu trono real, no palácio real[b], em frente à entrada da casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vestiu-se de realeza”, isto é, pôs vestes ou insígnias reais.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida aqui e anteriormente como “palácio” significa literalmente “casa” e, neste contexto da corte, pode designar o edifício palaciano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: A fórmula narrativa introduz o acontecimento; em português atual, a expressão temporal basta, sem acrescentar um marcador como “ora” que não corresponde a uma palavra temporal explícita no hebraico.
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: Ester vestiu seus trajes reais
  rationale: Literalmente, Ester “vestiu realeza”. No contexto, a expressão idiomática se refere às vestes ou insígnias próprias de sua condição real; “trajes reais” comunica isso de modo claro sem especificar mais do que o texto.
- source_word: וַתַּעֲמֹד
  choice: ficou de pé
  rationale: Expressa naturalmente a posição assumida por Ester, preservando o sentido do verbo hebraico sem sugerir que ela apenas chegou ao local.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: no pátio interno do palácio do rei
  rationale: בֵּית significa literalmente “casa”, mas aqui designa o complexo palaciano; “palácio” torna o cenário cortesão claro ao leitor moderno.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: diante do edifício real
  rationale: נֹכַח indica posição frontal, “diante de” ou “de frente para”. “Edifício real” evita a impressão de uma residência separada e preserva a referência espacial dentro do complexo palaciano.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: O rei estava sentado
  rationale: O particípio apresenta uma circunstância simultânea e de fundo; o imperfeito português comunica naturalmente esse valor.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: em seu trono real
  rationale: Equivalente português idiomático da construção “trono de sua realeza”, sem alterar seu sentido régio.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: no palácio real
  rationale: A expressão pode ser vertida literalmente como “na casa da realeza”; “palácio real” é clara e adequada ao contexto, mantendo a associação com a realeza.
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: diante da entrada do edifício
  rationale: Preserva a orientação espacial indicada por נֹכַח e traduz פֶּתַח como “entrada”; “edifício” retoma de modo inteligível a ampla acepção contextual de בַּיִת.
