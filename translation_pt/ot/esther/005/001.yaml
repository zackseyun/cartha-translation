translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a disposição espacial repetida do hebraico, mas usa “palácio” e “edifício” para evitar que “casa” sugira ao leitor moderno uma residência comum ou necessariamente separada.
