revisions:
- from: No terceiro dia, Ester vestiu seus trajes reais[a] e ficou de pé no pátio interno do palácio do rei, diante do edifício real. O rei estava sentado em seu trono real, no palácio real[b], diante da entrada do edifício.
  to: No terceiro dia, Ester vestiu seus trajes reais[a] e pôs-se de pé no pátio interno do palácio do rei, em frente à casa do rei, enquanto o rei estava sentado em seu trono real, no palácio real[b], em frente à entrada da casa.
  rationale: 'A revisão preserva a disposição espacial e as repetições do hebraico: Ester está no pátio interno, em frente à casa do rei; o rei está no palácio real, em frente à entrada da casa. “Pôs-se de pé” traduz o avanço narrativo de וַתַּעֲמֹד, e “em frente a” representa mais nitidamente נֹכַח. A alternância entre “palácio” e “casa” conserva a distinção lexical e espacial sem introduzir uma identificação arquitetônica mais específica do que o texto permite.'
