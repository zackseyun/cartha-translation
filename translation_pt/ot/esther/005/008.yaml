  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: pt
  text: Se achei favor aos olhos do rei[a], e se parecer bem ao rei conceder minha petição e atender ao meu pedido, que o rei e Hamã venham ao banquete que prepararei para eles; e amanhã farei conforme a palavra do rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Se obtive o favor do rei”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é um tanto elíptica. Provavelmente significa que Ester atenderia ao pedido do rei e revelaria sua petição no dia seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: achei favor aos olhos de
  rationale: Preserva a imagem do idioma hebraico e continua compreensível em português; no contexto da corte, “favor” é mais adequado que “graça”.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: se parecer bem ao rei
  rationale: Expressa de modo natural e respeitoso aquilo que é aceitável ou agradável ao rei, mantendo a forma condicional do hebraico.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: conceder minha petição
  rationale: “Conceder” comunica naturalmente o sentido de dar o que foi formalmente solicitado, e “petição” corresponde ao registro cortesão.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: atender ao meu pedido
  rationale: O hebraico usa literalmente “fazer” o pedido; “atender ao meu pedido” é o equivalente português natural e preserva a distinção em relação a “petição”.
- source_word: שְׁאֵלָתִי / בַּקָּשָׁתִי
  choice: petição / pedido
  rationale: Emprega dois termos relacionados, mas diferentes, refletindo a variação lexical presente no hebraico sem produzir uma expressão artificial.
- source_word: יָבֹא
  choice: que ... venham
  rationale: O imperfeito tem força volitiva neste contexto; a construção portuguesa transmite um convite respeitoso dirigido ao rei e a Hamã.
- source_word: הַמִּשְׁתֶּה
  choice: banquete
  rationale: O termo designa uma festa com comida e bebida; “banquete” se ajusta ao ambiente real e ao uso recorrente em Ester.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: que prepararei para eles
  rationale: Embora o verbo signifique literalmente “fazer”, em português prepara-se um banquete; a formulação mantém o sentido sem rigidez.
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: e amanhã farei conforme a palavra do rei
  rationale: Mantém a formulação elíptica e ligeiramente aberta do hebraico, sem explicitar que Ester revelará sua petição, embora isso seja sugerido pelo contexto.
