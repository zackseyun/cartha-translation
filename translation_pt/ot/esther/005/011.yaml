base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: pt
  text: Hamã lhes contou sobre o esplendor de sua riqueza[a], seus muitos filhos[b], tudo o que o rei havia feito para engrandecê-lo[c] e como o havia elevado acima dos oficiais e dos servos do rei[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “a glória de sua riqueza”. A expressão hebraica ressalta a magnificência associada às riquezas de Hamã.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz especificamente “filhos”, e não uma expressão mais geral como “filhos e filhas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “tudo o que o rei havia feito para promovê-lo”.
    reason: lexical_alternative
  - marker: d
    text: Ou “como o havia exaltado sobre os oficiais e os servos do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: lhes contou
  rationale: O verbo ספר no wayyiqtol introduz o relato de Hamã. “Lhes contou” é natural em português e mantém tanto a ação de narrar quanto os destinatários expressos por לָהֶם.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: o esplendor de sua riqueza
  rationale: כָּבוֹד pode significar glória, honra ou esplendor; associado a עֹשֶׁר, destaca a magnificência e a ostentação da riqueza. “Esplendor” comunica esse sentido com clareza atual.
- source_word: רֹב בָּנָיו
  choice: seus muitos filhos
  rationale: רֹב indica grande quantidade, e בָּנָיו designa seus filhos. A formulação é corrente e concisa, sem substituir o referente por “descendentes” ou “família”.
- source_word: גִּדְּלוֹ
  choice: havia feito para engrandecê-lo
  rationale: 'O piel de גדל é causativo: tornar grande, elevar ou promover. A expressão preserva a imagem hebraica e a ação do rei, sem reduzi-la apenas a uma promoção administrativa.'
- source_word: נִשְּׂאוֹ עַל
  choice: o havia elevado acima
  rationale: נשא com עַל descreve elevação de posição ou categoria sobre outras pessoas. “Elevado acima” preserva a metáfora espacial e a hierarquia comparativa.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: שָׂרִים pode designar príncipes, chefes ou altos funcionários. No ambiente da corte persa, “oficiais” é claro e não pressupõe nobreza hereditária.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: os servos do rei
  rationale: A expressão refere-se aos servidores ou integrantes subordinados da corte real. “Servos do rei” mantém a amplitude e a relação de serviço presentes no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordena de modo natural os motivos da ostentação de Hamã, preservando a repetição conceitual entre engrandecer e elevar, presente no hebraico.
