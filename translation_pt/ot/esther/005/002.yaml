source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/רְא֨וֹת הַ/מֶּ֜לֶךְ אֶת אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה עֹמֶ֨דֶת֙ בֶּֽ/חָצֵ֔ר נָשְׂאָ֥ה חֵ֖ן בְּ/עֵינָ֑י/ו וַ/יּ֨וֹשֶׁט הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֗ר אֶת שַׁרְבִ֤יט הַ/זָּהָב֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/תִּקְרַ֣ב אֶסְתֵּ֔ר וַ/תִּגַּ֖ע בְּ/רֹ֥אשׁ הַ/שַּׁרְבִֽיט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: pt
  text: Quando o rei viu a rainha Ester de pé no pátio[a], ela achou favor aos olhos dele[b]. Então o rei estendeu para Ester o cetro de ouro que tinha na mão. Ester se aproximou e tocou a ponta do cetro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no átrio».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «ela carregou favor aos olhos dele»; expressão idiomática que indica que recebeu o olhar favorável do rei.
    reason: lexical_alternative
  - marker: c
    text: 'Ou «a extremidade do cetro». Hebraico: «a cabeça do cetro».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: Quando ... viu
  rationale: A construção introduz uma oração temporal no fluxo narrativo; em português, «Quando» comunica isso naturalmente sem a fórmula mais pesada «E aconteceu que, ao ver».
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: a rainha Ester
  rationale: Embora o hebraico apresente o nome antes do título, esta ordem é mais natural no português atual e preserva integralmente a identificação.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: de pé no pátio
  rationale: O particípio descreve a posição de Ester. חָצֵר designa aqui o pátio do complexo real, sentido mais concreto e claro do que «corte» em português.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: ela achou favor aos olhos dele
  rationale: Preserva de modo inteligível a imagem do idioma hebraico, que indica que Ester recebeu o olhar favorável do rei.
- source_word: וַיּוֹשֶׁט
  choice: estendeu
  rationale: Expressa diretamente o gesto de estender o cetro em direção a Ester, em registro digno e corrente.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: o cetro de ouro
  rationale: É a designação portuguesa natural e precisa para o emblema real feito de ouro.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: que tinha na mão
  rationale: Equivalência portuguesa natural da oração relativa hebraica, sem alterar a informação de que o rei segurava o cetro.
- source_word: וַתִּקְרַב
  choice: Ester se aproximou
  rationale: Comunica com clareza o movimento de Ester em resposta ao gesto do rei.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: tocou a ponta do cetro
  rationale: רֹאשׁ é literalmente «cabeça», mas, aplicado a um cetro, «ponta» é a expressão idiomática portuguesa; a nota preserva a forma literal e a possível alternativa «extremidade».
