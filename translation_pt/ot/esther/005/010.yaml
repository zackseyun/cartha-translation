  text: וַ/יִּתְאַפַּ֣ק הָמָ֔ן וַ/יָּב֖וֹא אֶל בֵּית֑/וֹ וַ/יִּשְׁלַ֛ח וַ/יָּבֵ֥א אֶת אֹהֲבָ֖י/ו וְ/אֶת זֶ֥רֶשׁ אִשְׁתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: pt
  text: Hamã, porém, se conteve[a] e foi para casa[b]. Depois, mandou chamar seus amigos e Zeres, sua mulher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se controlou” ou “se segurou”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “foi à sua casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: se conteve
  rationale: O hitpael de אפק expressa domínio de si diante da ira mencionada no contexto. “Se conteve” é natural, conciso e preserva o sentido reflexivo.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: foi para casa
  rationale: A expressão indica deslocamento até a própria casa. “Foi para casa” comunica isso de modo idiomático em português, sem alterar o sentido.
- source_word: וַיִּשְׁלַח וַיָּבֵא
  choice: mandou chamar
  rationale: A sequência literal “enviou e fez vir” descreve a convocação dos amigos e da esposa. “Mandou chamar” reproduz naturalmente em português a relação entre os dois verbos.
- source_word: אֹהֲבָיו
  choice: seus amigos
  rationale: Embora derivado de אהב, o substantivo plural designa aqui pessoas próximas ou associadas a Hamã; “amigos” é a equivalência contextual mais natural.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: Zeres, sua mulher
  rationale: Mantém a ordem hebraica, com o nome próprio antes da identificação relacional, e usa formulação clara e digna em português.
- source_word: וַ
  choice: porém
  rationale: 'O waw narrativo ganha valor levemente adversativo no contexto: apesar de sua ira, Hamã dominou a própria reação. “Porém” torna esse contraste perceptível sem exagerá-lo.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação “mandou chamar” evita a rigidez da sequência hebraica literal sem perder sua força causativa; “sua mulher” preserva de perto אִשְׁתּוֹ.
