    issue: “Além disso” para אַף לֹא
    rationale: A expressão sugere principalmente acréscimo discursivo, enquanto o hebraico aqui enfatiza a exclusividade do privilégio de Hamã. “De fato” comunica melhor essa força sem introduzir conteúdo adicional.
  - severity: medium
    issue: “fui convidado” para קָרוּא
    rationale: O particípio passivo descreve Hamã como alguém que está convidado para o banquete de amanhã. Em português, “estou convidado” conserva melhor esse valor prospectivo e situacional.
