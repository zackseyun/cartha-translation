  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: pt
  text: 'Então Hamã disse: “De fato, a rainha Ester não levou ninguém, junto com o rei, ao banquete que preparou, a não ser a mim; e amanhã também estou convidado por ela, junto com o rei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Hamã disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אַף לֹא
  choice: Além disso, ... ninguém
  rationale: A combinação acrescenta ênfase ao orgulho de Hamã e liga esta vantagem às que ele acaba de enumerar.
- source_word: הֵבִיאָה
  choice: levou
  rationale: Preserva o sentido concreto de “fez vir/levou”, sem substituí-lo diretamente por “convidou”.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: a rainha Ester
  rationale: É a ordem corrente e digna do título em português.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: ao banquete
  rationale: מִשְׁתֶּה designa uma refeição festiva, frequentemente associada a bebida; “banquete” se ajusta ao ambiente da corte.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: que preparou
  rationale: Embora o verbo seja literalmente “fez”, “preparou” é idiomático para um banquete e mantém Ester como anfitriã.
- source_word: כִּי אִם אוֹתִי
  choice: a não ser a mim
  rationale: Reproduz de modo natural a construção hebraica de exceção e exclusividade.
- source_word: וְגַם לְמָחָר
  choice: e amanhã também
  rationale: Mantém tanto a força aditiva de וְגַם quanto a referência temporal.
- source_word: קָרוּא לָהּ
  choice: fui convidado por ela
  rationale: Literalmente, “sou chamado por ela”; no contexto de um banquete, a expressão significa ser convidado.
- source_word: עִם הַמֶּלֶךְ
  choice: para estar com o rei
  rationale: No final do versículo, esta formulação comunica claramente que Hamã participaria na companhia do rei, sem sugerir que o rei fez o convite.
