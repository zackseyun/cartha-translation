  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַהֲרוּ֙ אֶת הָמָ֔ן לַ/עֲשׂ֖וֹת אֶת דְּבַ֣ר אֶסְתֵּ֑ר וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ וְ/הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: pt
  text: 'Então o rei disse[a]: “Depressa, tragam Hamã, para cumprir o pedido de Ester”. Assim, o rei e Hamã foram ao banquete que Ester havia preparado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para cumprir a palavra de Ester”. O hebraico diz literalmente “fazer a palavra de Ester”; nesse contexto, “palavra” pode indicar o pedido ou a instrução que ela expressou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  choice: Depressa, tragam Hamã
  rationale: O imperativo plural de מהר dirige-se aos servos e exige ação imediata; em português, a formulação explicita naturalmente que Hamã deve ser trazido sem demora.
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  choice: para cumprir o pedido de Ester
  rationale: דְּבַר significa literalmente “palavra” ou “assunto”, mas, no contexto, refere-se ao pedido expresso por Ester. “Cumprir o pedido” transmite de modo natural a finalidade do infinitivo לַעֲשׂוֹת.
- source_word: וַיָּבֹא
  choice: foram
  rationale: בוא pode ser traduzido como “vir” ou “ir”, conforme a perspectiva. Como o destino é o banquete preparado por Ester, “foram ao banquete” é natural em português narrativo.
- source_word: הַמִּשְׁתֶּה
  choice: o banquete
  rationale: מִשְׁתֶּה designa uma festa ou refeição festiva, frequentemente com bebidas; “banquete” se ajusta ao ambiente real.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: que Ester havia preparado
  rationale: עשה, aplicado a um banquete, tem o sentido idiomático de preparar ou organizar. O mais-que-perfeito composto deixa claro que a preparação precedeu a chegada.
