  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: pt
  text: Contudo, tudo isso não vale nada para mim toda vez que vejo Mardoqueu, o judeu, sentado à porta do rei.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E tudo isso não tem valor para mim toda vez que vejo Mardoqueu, o judeu, sentado à porta do rei.”'
    reason: lexical_alternative
  - marker: b
    text: “O judeu” também pode ser traduzido por “o judeano”. O termo identifica Mardoqueu em relação a Judá e ao povo judeu, no contexto da corte persa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: Contudo, tudo isso
  rationale: A conjunção וְ pode significar simplesmente “e”, mas aqui introduz um contraste com as honras das quais Hamã acaba de se vangloriar. “Contudo” expressa esse valor adversativo de modo natural.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: não vale nada para mim
  rationale: A expressão nega o valor ou proveito de tudo aquilo para Hamã; esta formulação é clara, idiomática e preserva sua avaliação enfática.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: enquanto
  rationale: A expressão é literalmente “em todo tempo em que”. No contexto, “enquanto” comunica que as honras não têm valor para Hamã durante todo o tempo em que ele continua vendo Mardoqueu ali; a nota registra a alternativa iterativa “toda vez que”.
- source_word: רֹאֶה
  choice: eu vir
  rationale: O particípio com אֲנִי indica ação contínua ou repetida. Depois de “enquanto”, o futuro do subjuntivo é a construção natural em português.
- source_word: מָרְדֳּכַי
  choice: Mardoqueu
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַיְּהוּדִי
  choice: o judeu
  rationale: No cenário da diáspora persa, o termo destaca sobretudo a identidade étnica de Mardoqueu; “judeu” é a forma natural em português, sem excluir a possível nuance de “judeano”.
- source_word: יוֹשֵׁב
  choice: sentado
  rationale: Preserva diretamente a postura e localização de Mardoqueu, bem como a vivacidade da cena.
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: à porta do rei
  rationale: Designa a área do portão ligada à administração real. “À porta do rei” é uma formulação bíblica clara e digna em português.
