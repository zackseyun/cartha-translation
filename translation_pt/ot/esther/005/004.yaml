base_translation:
  language: en
  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: pt
  text: 'Ester disse: “Se for do agrado do rei, que o rei e Hamã venham hoje ao banquete que preparei para ele[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “para ele”, provavelmente referindo-se especificamente ao rei, embora Hamã também tenha sido convidado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Se for do agrado do rei
  rationale: A expressão hebraica introduz um pedido respeitoso. A formulação escolhida é natural em português, mantém o tom cortês da corte e comunica a ideia de aprovação favorável do rei.
- source_word: יָבוֹא
  choice: que ... venham
  rationale: Embora a forma hebraica esteja no singular, ela tem força volitiva neste contexto e introduz o convite dirigido ao rei e a Hamã. O plural é exigido naturalmente pelo sujeito composto em português.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: o rei e Hamã
  rationale: Preserva o título repetido no hebraico e não acrescenta o nome pessoal do rei, ausente no versículo.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto que mantém a imediatidade temporal do convite.
- source_word: הַמִּשְׁתֶּה
  choice: o banquete
  rationale: No contexto da corte, מִשְׁתֶּה designa adequadamente um banquete, com bebida possivelmente implícita, sem necessidade de destacá-la na tradução.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: que preparei para ele
  rationale: Com 'banquete', o verbo português 'preparar' é mais idiomático que 'fazer'. O pronome singular 'ele' conserva o singular hebraico e provavelmente se refere especificamente ao rei.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tom cortês apropriado ao ambiente real. A construção “Se for do agrado do rei” evita tanto arcaísmo excessivo quanto informalidade. O pronome singular do texto-fonte foi preservado e explicado em nota.
