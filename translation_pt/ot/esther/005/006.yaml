- from: 'E, durante o banquete regado a vinho, o rei disse a Ester: “Qual é a sua petição? Ela lhe será concedida. E qual é o seu pedido? Mesmo que seja até a metade do reino[a], será atendido.”'
  to: 'No banquete de vinho, o rei disse a Ester: “Qual é a sua petição? Ela lhe será concedida. E qual é o seu pedido? Mesmo até a metade do reino, ele será atendido.”'
