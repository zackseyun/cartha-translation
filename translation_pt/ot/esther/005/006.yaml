base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: pt
  text: 'No banquete de vinho, o rei disse a Ester: “Qual é a sua petição? Ela lhe será concedida. E qual é o seu pedido? Mesmo até a metade do reino, ele será atendido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: durante o banquete regado a vinho
  rationale: מִשְׁתֶּה designa um banquete marcado pela bebida, e הַיַּיִן especifica o vinho. A formulação é natural em português e mantém explícito o cenário.
- source_word: שְּׁאֵלָתֵךְ
  choice: sua petição
  rationale: Neste contexto cortesão, o substantivo indica algo solicitado, não uma pergunta. “Petição” também preserva alguma distinção em relação a בַּקָּשָׁה.
- source_word: וְיִנָּתֵן לָךְ
  choice: Ela lhe será concedida
  rationale: A forma de נתן transmite a garantia régia de que a petição será dada. “Concedida” expressa idiomaticamente esse sentido em português.
- source_word: בַּקָּשָׁתֵךְ
  choice: seu pedido
  rationale: בַּקָּשָׁה refere-se ao que se busca ou solicita. “Pedido” é corrente e mantém uma leve distinção lexical de “petição”.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Mesmo que seja até a metade do reino
  rationale: A expressão indica o limite enfático da oferta régia. Mantém-se “do reino”, pois o hebraico não traz explicitamente o possessivo “meu”.
- source_word: וְתֵעָשׂ
  choice: será atendido
  rationale: No contexto, a forma refere-se ao cumprimento do pedido. “Será atendido” é natural em português e explicita o referente sem alterar a promessa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. A repetição retórica entre “petição” e “pedido” foi preservada, assim como a ausência do possessivo em “o reino”.
