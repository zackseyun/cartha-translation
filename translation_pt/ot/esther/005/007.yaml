lexical_decisions:
- source_word: וַתַּעַן
  choice: Então ... respondeu
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, enquanto “respondeu” preserva o sentido usual de ענה na introdução de uma fala.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַתֹּאמַר
  choice: e disse
  rationale: Preserva a fórmula hebraica dupla “respondeu e disse”, sem fundir os dois verbos.
- source_word: שְׁאֵלָתִי
  choice: minha petição
  rationale: No contexto da audiência real, o substantivo indica uma súplica ou demanda formal; “petição” conserva esse tom.
- source_word: וּבַקָּשָׁתִי
  choice: e meu pedido
  rationale: “Pedido” expressa o sentido comum de solicitação e mantém alguma distinção em relação a שְׁאֵלָה, traduzido como “petição”.
