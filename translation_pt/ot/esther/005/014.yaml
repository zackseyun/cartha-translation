    rationale: O hebraico afirma simplesmente que Hamã «fez» a estrutura. A causativa portuguesa é uma inferência contextual plausível, mas desnecessária; «ele fez a estrutura» mantém a formulação fonte e ainda pode abranger providenciar sua execução.
