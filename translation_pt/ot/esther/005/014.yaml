base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: pt
  text: 'Então Zeres, sua mulher, e todos os seus amigos lhe disseram: “Que se faça uma estrutura de madeira[a] de cinquenta côvados de altura[b] e, pela manhã, diga ao rei que Mardoqueu seja pendurado nela[c]. Depois, vá alegre com o rei ao banquete.” A proposta agradou a Hamã, e ele fez a estrutura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um poste”. A palavra hebraica pode significar madeira, árvore, poste ou uma estrutura de madeira usada para execução; sua forma exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Cinquenta côvados correspondem a aproximadamente 23 metros.
    reason: cultural_note
  - marker: c
    text: Ou “seja empalado nela”. A expressão hebraica pode indicar suspensão numa estrutura de madeira, mas o método exato de execução é discutido.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: seus amigos
  rationale: Embora signifique literalmente “os que o amavam”, no contexto designa os companheiros ou aliados de Hamã; “seus amigos” é natural e fiel.
- source_word: יַעֲשׂוּ
  choice: Mande fazer
  rationale: O imperfeito com força volitiva apresenta uma proposta e deixa os executores indefinidos. A construção causativa idiomática preserva esse caráter impessoal.
- source_word: עֵץ
  choice: estrutura de madeira
  rationale: O termo pode significar árvore, madeira, poste ou uma estrutura de execução. A escolha evita definir indevidamente tanto a forma do objeto quanto o método de execução.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: de cinquenta côvados de altura
  rationale: Mantém a antiga unidade de medida e a extraordinária altura indicada no texto; a equivalência moderna aparece em nota.
- source_word: וּבַבֹּקֶר
  choice: pela manhã
  rationale: Tradução temporal direta, sem acrescentar explicitamente “amanhã”, embora o contexto indique a manhã seguinte.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: diga ao rei
  rationale: Preserva o sentido direto do imperativo sem transformá-lo no mais interpretativo “peça ao rei”.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: que Mardoqueu seja pendurado nela
  rationale: A passiva natural em português mantém indefinidos os agentes do verbo plural. “Pendurado” preserva a formulação hebraica sem excluir a possibilidade histórica de empalamento, registrada em nota.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: Adequado ao ambiente real e natural no português contemporâneo.
- source_word: שָׂמֵחַ
  choice: alegre
  rationale: O adjetivo tem função circunstancial e descreve o estado de Hamã ao acompanhar o rei.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: A proposta agradou a Hamã
  rationale: Expressa naturalmente o idioma hebraico segundo o qual a ideia pareceu boa ou aceitável aos olhos de Hamã.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: ele mandou fazer a estrutura
  rationale: Embora o hebraico diga literalmente que ele a fez, a causativa idiomática comunica que Hamã providenciou sua construção, sem sugerir necessariamente trabalho manual pessoal.
theological_decisions:
- issue: Método exato de execução
  choice: Texto principal com “pendurado” e “estrutura de madeira”, acompanhado de nota
  alternative: “enforcado numa forca” ou “empalado num poste”
  rationale: O hebraico não determina sem ambiguidade a forma da estrutura nem se o condenado seria suspenso ou empalado. A tradução preserva essa tensão histórica e lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha sua ocorrência no texto, e a formulação evita o anacronismo potencialmente específico de “forca” sem apagar a linguagem concreta da execução.
