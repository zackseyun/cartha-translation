  naturalness: O português é moderno, claro e adequado ao registro narrativo. «Que se faça uma estrutura de madeira» é igualmente natural e conserva melhor a impessoalidade da proposta. «Ele fez a estrutura» é direto e não exige que se entenda trabalho manual pessoal.
  terminology: «Zeres», «Mardoqueu», «Hamã», «côvados», «banquete» e «estrutura de madeira» são escolhas consistentes. As notas preservam adequadamente as alternativas «poste» e «empalado», sem resolver indevidamente uma questão histórica debatida.
