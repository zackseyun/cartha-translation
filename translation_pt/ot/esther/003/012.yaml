  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: pt
  text: Então, no primeiro mês, no décimo terceiro dia do mês, os escribas do rei foram convocados, e foi escrito, conforme tudo o que Hamã ordenou, aos sátrapas do rei, aos governadores de cada província e aos oficiais de cada povo, a cada província em sua própria escrita[a] e a cada povo em sua própria língua. Foi escrito em nome do rei Assuero e selado com o anel-sinete do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Escrita” refere-se ao sistema de escrita usado em cada província.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: os escribas do rei foram convocados
  rationale: O nifal indica que os escribas foram chamados; “convocados” preserva o caráter administrativo e solene do contexto.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: no primeiro mês, no décimo terceiro dia do mês
  rationale: Mantém a data como expressa no hebraico e torna claro, em português natural, o referente pronominal.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: escreveu-se tudo conforme Hamã havia ordenado
  rationale: Preserva a construção passiva sem acrescentar explicitamente “decreto”, e כְּכָל é refletido por “tudo conforme”.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: os sátrapas do rei
  rationale: “Sátrapas” é o título histórico preciso para esses altos administradores persas.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: os governadores de cada província
  rationale: Expressa de modo conciso a jurisdição distributiva indicada pela repetição hebraica.
- source_word: שָׂרֵי עַם וָעָם
  choice: os oficiais de cada povo
  rationale: No contexto burocrático, “oficiais” comunica melhor a função administrativa de שָׂרִים sem restringi-la a príncipes.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: a cada província em sua própria escrita
  rationale: כְּתָב designa aqui a forma ou sistema de escrita usado em cada província; “escrita” é claro em português amplo, com explicação em nota.
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: a cada povo em sua própria língua
  rationale: Reproduz naturalmente a distribuição e o sentido linguístico de לָשׁוֹן.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: selado com o anel-sinete do rei
  rationale: “Anel-sinete” explicita com precisão o objeto usado para autenticar oficialmente o documento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário administrativo historicamente preciso. A sintaxe foi ajustada para legibilidade sem eliminar as repetições distributivas importantes do hebraico. “O documento” na última frase retoma naturalmente aquilo que foi escrito, sem definir seu gênero além do que o contexto permite.
