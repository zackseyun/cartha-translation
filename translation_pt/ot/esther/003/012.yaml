  to: Então, no primeiro mês, no décimo terceiro dia do mês, os escribas do rei foram convocados, e foi escrito, conforme tudo o que Hamã ordenou, aos sátrapas do rei, aos governadores de cada província e aos oficiais de cada povo, a cada província em sua própria escrita[a] e a cada povo em sua própria língua. Foi escrito em nome do rei Assuero e selado com o anel-sinete do rei.
