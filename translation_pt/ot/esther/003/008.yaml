base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: pt
  text: 'Então Hamã disse ao rei Assuero: “Há certo povo espalhado e separado entre os povos, em todas as províncias do seu reino. Suas leis são diferentes das de todos os outros povos, e eles não cumprem as leis do rei. Portanto, não convém ao rei deixá-los em paz.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “permitir que permaneçam” ou “tolerá-los”. O verbo hebraico pode significar deixar alguém quieto ou permitir que continue sem ser perturbado.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: Há certo povo
  rationale: A expressão introduz um grupo não nomeado, mas específico. “Certo povo” preserva o tom vago e insinuante de Hamã melhor do que o literal “um povo”.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: espalhado e separado
  rationale: Mantém os dois particípios e sua acumulação retórica, sem interpretar o segundo como divisão interna do povo.
- source_word: בֵּין הָעַמִּים
  choice: entre os povos
  rationale: “Povos” comunica os diversos grupos étnicos do império com mais precisão que “nações” neste contexto.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: em todas as províncias do seu reino
  rationale: “Províncias” corresponde às divisões administrativas recorrentes em Ester; “seu reino” expressa naturalmente o sufixo de segunda pessoa.
- source_word: דָתֵיהֶם שֹׁנוֹת מִכָּל עָם
  choice: Suas leis são diferentes das de todos os outros povos
  rationale: “Leis” preserva o contraste jurídico com as leis reais. A inserção de “das de” torna explícita em português a comparação entre leis, e “outros” evita sugerir que as leis sejam diferentes dos próprios povos.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: e eles não cumprem as leis do rei
  rationale: Com leis como objeto, עשה tem o sentido de cumprir ou observar. “Cumprem” é corrente, claro e juridicamente apropriado.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: Portanto, não convém ao rei
  rationale: A expressão aponta para vantagem, proveito ou conveniência do rei. “Não convém ao rei” é digna e natural, preservando o apelo pragmático de Hamã.
- source_word: לְהַנִּיחָם
  choice: deixá-los em paz
  rationale: O hifil de נוח pode significar deixar alguém quieto, permitir que permaneça ou não o perturbar. “Deixá-los em paz” preserva essa amplitude melhor que uma formulação que afirme apenas permanência física.
