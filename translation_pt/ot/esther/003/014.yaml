base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: pt
  text: Uma cópia do documento deveria ser promulgada como lei em cada uma das províncias[a] e divulgada a todos os povos, para que estivessem preparados para esse dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em toda província e província”, repetição distributiva que enfatiza cada uma das províncias.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para aquele dia”, isto é, o dia especificado no decreto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: uma cópia
  rationale: O empréstimo persa designa uma cópia ou transcrição de um documento oficial; “uma cópia” é claro e natural em português.
- source_word: הַכְּתָב
  choice: do documento
  rationale: O termo significa literalmente “a escrita” ou “o documento”; no contexto, trata-se do documento oficial cujo conteúdo teria força de lei.
- source_word: לְהִנָּתֵן דָּת
  choice: deveria ser promulgada como lei
  rationale: A construção passiva indica a publicação oficial da cópia com força legal. “Promulgada como lei” preserva tanto o ato administrativo quanto o valor vinculante de דָּת.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: em cada uma das províncias
  rationale: A repetição distributiva hebraica enfatiza totalidade. A formulação portuguesa comunica naturalmente “em cada e toda província”, sem reproduzir uma repetição pouco idiomática.
- source_word: גָּלוּי
  choice: divulgada
  rationale: O particípio expressa publicação ou exposição pública; “divulgada” é corrente e adequado ao contexto administrativo.
- source_word: לְכָל הָעַמִּים
  choice: a todos os povos
  rationale: “Povos” representa os diversos grupos étnicos do império mais precisamente do que “nações”.
- source_word: לִהְיוֹת עֲתִדִים
  choice: para que estivessem preparados
  rationale: 'O infinitivo com o adjetivo expressa propósito: os povos deveriam ficar prontos para agir na data determinada.'
- source_word: לַיּוֹם הַזֶּה
  choice: para esse dia
  rationale: Embora o demonstrativo seja formalmente “este”, no discurso do decreto ele remete ao dia especificado anteriormente; “esse dia” é a referência anafórica natural em português.
