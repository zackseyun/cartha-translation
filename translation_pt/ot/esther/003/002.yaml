  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: pt
  text: E todos os servos do rei que estavam junto ao portão do rei se ajoelhavam e se prostravam diante de Hamã[a], pois assim o rei havia ordenado a respeito dele[b]. Mordecai, porém, não se ajoelhava nem se prostrava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prestavam homenagem a Hamã”. O verbo hebraico também pode significar “adorar” quando o destinatário é divino.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois assim o rei lhe havia ordenado”. É mais provável, porém, que o pronome se refira a Hamã, isto é, que a ordem dissesse respeito à honra que lhe devia ser prestada.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: Preserva o sentido amplo de עֶבֶד no contexto da corte sem restringi-lo a 'oficiais' nem sugerir necessariamente a condição de escravos.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: junto ao portão do rei
  rationale: Mantém o cenário concreto e indica naturalmente, em português, o local público e administrativo ligado ao palácio.
- source_word: כֹּרְעִים
  choice: se ajoelhavam
  rationale: O particípio indica uma prática habitual; o imperfeito português comunica essa ação costumeira. O verbo descreve o primeiro gesto corporal de submissão.
- source_word: וּמִשְׁתַּחֲוִים
  choice: se prostravam
  rationale: Conserva o componente físico e a amplitude semântica do hebraico sem impor a noção especificamente religiosa de 'adorar' diante de um ser humano.
- source_word: לְהָמָן
  choice: diante de Hamã
  rationale: Expressa de modo idiomático em português o destinatário da reverência.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: pois assim o rei havia ordenado a respeito dele
  rationale: Entende לוֹ mais naturalmente como referência a Hamã e à honra que lhe era devida, preservando em nota a possibilidade de o pronome indicar aquele a quem o rei deu a ordem.
- source_word: וּמָרְדֳּכַי
  choice: Mordecai, porém
  rationale: A conjunção introduz forte contraste entre a conduta geral dos servos e a recusa de Mordecai.
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: não se ajoelhava nem se prostrava
  rationale: Os imperfeitos retratam uma recusa persistente ou habitual. A construção 'nem... nem' reproduz com clareza a negação de ambos os gestos.
theological_decisions:
- issue: Se הִשְׁתַּחֲוָה deve ser traduzido com linguagem explicitamente religiosa
  choice: se prostravam / se prostrava
  alternative: adoravam / adorava; prestavam homenagem / prestava homenagem
  rationale: O verbo pode indicar adoração a Deus ou reverência diante de seres humanos. Como Hamã é o destinatário, 'prostrar-se' preserva o gesto e a possível tensão narrativa sem afirmar que o ato era necessariamente culto religioso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'rei' preserva a formulação enfática do hebraico. Os imperfeitos indicam comportamento habitual, e 'porém' explicita o contraste discursivo.
