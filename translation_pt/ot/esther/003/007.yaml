  register: Português moderno, claro e digno, com formas nominais bíblicas de ampla legibilidade brasileira. A sintaxe foi levemente desdobrada para tornar inteligível a progressão temporal, enquanto a nota preserva a formulação hebraica condensada e sua ambiguidade.
