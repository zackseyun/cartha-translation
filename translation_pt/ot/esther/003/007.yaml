base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: pt
  text: No primeiro mês, isto é, no mês de Nisan, no décimo segundo ano do rei Assuero, o Pur, isto é, a sorte, foi lançado diante de Hamã, de dia em dia e de mês em mês, até o décimo segundo mês, isto é, o mês de Adar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «de dia em dia e de mês em mês, doze, isto é, o mês de Adar». O sentido parece ser que o lançamento da sorte percorreu o calendário até o décimo segundo mês.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: No primeiro mês
  rationale: Expressão temporal natural em português, preservando a moldura do calendário.
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: isto é, no mês de nisã
  rationale: A aposição explicativa identifica pelo nome o primeiro mês; a repetição de “mês” acompanha o hebraico.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: no décimo segundo ano do rei Assuero
  rationale: Forma idiomática portuguesa de datação pelo ano de reinado; “Assuero” é a forma tradicional e amplamente reconhecida do nome.
- source_word: הִפִּיל פּוּר
  choice: lançou-se ... o Pur
  rationale: O hifil de נפל forma a expressão de lançar sortes. A construção com “se” mantém o agente não especificado, sem atribuir explicitamente a ação a Hamã.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: o Pur, isto é, a sorte
  rationale: Preserva o empréstimo persa e a explicação hebraica imediata, mantendo também a ligação posterior com o nome Purim.
- source_word: לִפְנֵי הָמָן
  choice: diante de Hamã
  rationale: Equivalente corrente de “perante/na presença de”, sem implicar que Hamã seja necessariamente o agente gramatical.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: passando de dia em dia e de mês em mês
  rationale: Conserva o paralelismo e comunica a progressão da consulta das sortes pelo calendário.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: até o décimo segundo mês, isto é, o mês de adar
  rationale: Explicita a chegada da progressão ao mês doze, sentido contextual da formulação hebraica condensada, e preserva a aposição que nomeia adar.
