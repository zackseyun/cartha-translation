base_translation:
  language: en
  yaml_path: translation/ot/esther/003/003.yaml
  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: pt
  text: 'Então os servos do rei que estavam junto ao portão do rei disseram a Mardoqueu: “Por que você está desobedecendo[a] à ordem do rei?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “transgredindo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: os servos do rei
  rationale: עֶבֶד pode designar servo ou funcionário a serviço do rei. “Servos” preserva o termo hebraico sem especificar indevidamente sua condição jurídica.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: que estavam junto ao portão do rei
  rationale: A expressão identifica os servos por sua localização. “Junto ao portão” é natural em português e evita dar a entender que estavam dentro da estrutura do portão.
- source_word: לְמָרְדֳּכָי
  choice: a Mardoqueu
  rationale: O לְ marca o destinatário da fala; “Mardoqueu” é a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente direto e natural da pergunta pela razão.
- source_word: אַתָּה
  choice: você
  rationale: Pronome masculino singular dirigido a Mardoqueu. “Você” oferece leitura clara e corrente no português brasileiro, sem perda de sentido.
- source_word: עוֹבֵר
  choice: está desobedecendo
  rationale: Com “a ordem do rei” como complemento, o particípio de עבר comunica a violação contínua de uma ordem. “Está desobedecendo” transmite esse sentido de modo claro e atual; a imagem lexical mais formal é registrada em nota.
- source_word: אֵת מִצְוַת הַמֶּלֶךְ
  choice: à ordem do rei
  rationale: מִצְוָה significa ordem ou mandamento. No contexto da corte, “ordem” é natural e evita a conotação predominantemente religiosa que “mandamento” pode assumir.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação mantém a repetição de “rei” presente no hebraico e usa “servos” em vez de interpretar o grupo de modo mais específico como funcionários ou oficiais.
