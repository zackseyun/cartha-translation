  terminology: “Talentos de prata” preserva a unidade antiga de peso; a nota explica adequadamente que não se trata de moeda cunhada. “Tesouros do rei” é uma forma idiomática aceitável para os depósitos ou reservas reais, conservando o plural hebraico. As notas mantêm as alternativas relevantes sem impor identificação específica dos executores.
