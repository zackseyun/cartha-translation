  source_fidelity: O texto reproduz adequadamente a petição condicional ao rei, a ordem escrita para a destruição, a oferta de dez mil talentos de prata e a sua destinação aos tesouros reais. “Pesarei ... e os entregarei nas mãos” explicita de modo natural em português o sentido de pesar a prata para confiá-la aos executores, sem alterar o conteúdo.
