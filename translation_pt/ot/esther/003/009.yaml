  text: אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִכָּתֵ֖ב לְ/אַבְּדָ֑/ם וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים כִּכַּר כֶּ֗סֶף אֶשְׁקוֹל֙ עַל יְדֵי֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה לְ/הָבִ֖יא אֶל גִּנְזֵ֥י הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: pt
  text: Se parecer bem ao rei[a], que se escreva que eles sejam destruídos; e eu pesarei dez mil talentos de prata[b] e os entregarei nas mãos dos que executam o trabalho[c], para que os levem aos tesouros do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se isso agradar ao rei”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “dez mil talentos de prata”, uma soma muito elevada, medida pelo peso, e não em moeda cunhada.
    reason: cultural_note
  - marker: c
    text: A expressão também pode ser entendida como “por meio dos que executam o trabalho”, isto é, pela atuação dos encarregados de realizá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Se parecer bem ao rei
  rationale: A expressão idiomática indica a aprovação ou o agrado do rei. A formulação conserva de perto a imagem hebraica e soa natural em português; a alternativa mais idiomática consta em nota.
- source_word: יִכָּתֵב
  choice: que se escreva
  rationale: Preserva o sentido literal do nifal de כתב. No contexto da corte, trata-se de uma ordem oficial escrita, sem necessidade de explicitar no texto principal a palavra “decreto”.
- source_word: לְאַבְּדָם
  choice: que eles sejam destruídos
  rationale: Expressa o conteúdo da ordem escrita e mantém a força letal do verbo sem intensificação interpretativa.
- source_word: וַעֲשֶׂרֶת אֲלָפִים
  choice: e ... dez mil
  rationale: Reproduz de modo direto o número cardinal e a conjunção do texto hebraico.
- source_word: כִּכַּר כֶּסֶף
  choice: talentos de prata
  rationale: “Talento” é a designação tradicional de uma grande unidade de peso. Evita uma conversão moderna necessariamente incerta.
- source_word: אֶשְׁקוֹל
  choice: pesarei
  rationale: O verbo שקל significa literalmente “pesar”. A escolha preserva a prática antiga de determinar por peso o valor da prata.
- source_word: עַל יְדֵי
  choice: os entregarei nas mãos de
  rationale: Mantém a imagem concreta das “mãos”, embora a expressão também possa marcar a agência pela qual a prata seria transferida.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: os que executam o trabalho
  rationale: Mantém ampla a identidade dessas pessoas, como no hebraico, sem especificá-las necessariamente como trabalhadores comuns ou autoridades.
- source_word: לְהָבִיא
  choice: para que os levem
  rationale: Comunica naturalmente a finalidade do ato. O pronome plural retoma, em português, os “talentos de prata”.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: os tesouros do rei
  rationale: Conserva o plural do substantivo hebraico e sua referência às reservas reais.
