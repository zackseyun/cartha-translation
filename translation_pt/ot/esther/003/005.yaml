base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: pt
  text: Quando Hamã viu que Mardoqueu não se curvava nem se prostrava diante dele[a], ficou cheio de fúria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não se inclinava nem lhe prestava homenagem». O hebraico emprega dois verbos relacionados, mas distintos, para gestos de reverência e submissão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quando Hamã viu
  rationale: O wayyiqtol dá continuidade à narrativa; em contexto, «quando» expressa naturalmente a relação temporal com a reação subsequente.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: que Mardoqueu não se...
  rationale: אֵין com os particípios indica uma ação contínua negada; a formulação verbal é idiomática em português.
- source_word: כֹּרֵעַ
  choice: se curvava
  rationale: כרע descreve dobrar-se ou inclinar-se, possivelmente ajoelhar-se; «curvar-se» preserva a amplitude sem especificar demais o gesto.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: nem se prostrava
  rationale: השתחוה designa prostração ou reverência corporal; «prostrava-se» mantém o sentido físico mais forte e o distingue de «curvava-se».
- source_word: לוֹ
  choice: diante dele
  rationale: Embora literalmente seja «a ele», «diante dele» é a expressão portuguesa natural para indicar a pessoa perante quem se fazem esses gestos.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: ficou cheio de fúria
  rationale: Preserva a imagem hebraica de ser enchido por intensa ira e soa clara e natural em português moderno.
- source_word: חֵמָה
  choice: fúria
  rationale: Comunica uma ira intensa e potencialmente violenta, adequada à reação de Hamã neste contexto.
