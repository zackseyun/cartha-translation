translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência dos três verbos preserva a ênfase hebraica na elevação de Hamã. A expressão “com ele” mantém a ambiguidade referencial do original, embora o rei seja o antecedente mais provável no contexto.
