base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: pt
  text: Depois desses acontecimentos[a], o rei Assuero promoveu Hamã, filho de Hamedata, o agagita[b], exaltou-o e colocou o trono de Hamã[c] acima de todos os oficiais que estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois dessas coisas”.'
    reason: lexical_alternative
  - marker: b
    text: “Agagita” preserva a designação hebraica e pode indicar uma linhagem ou associação ligada a Agague.
    reason: cultural_note
  - marker: c
    text: 'Ou: “assento”; aqui, um assento que representa posição e autoridade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois desses acontecimentos
  rationale: A expressão é uma fórmula temporal narrativa. “Acontecimentos” comunica naturalmente o sentido contextual, enquanto a alternativa mais literal é preservada em nota.
- source_word: גִּדַּל
  choice: promoveu
  rationale: No contexto da corte, o verbo indica elevação de posição ou categoria; “promoveu” expressa com clareza esse sentido administrativo.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: o rei Assuero
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português, com a ordem natural de título e nome.
- source_word: הָמָן בֶּן הַמְּדָתָא
  choice: Hamã, filho de Hamedata
  rationale: Translitera os nomes segundo convenções correntes em português e conserva explicitamente o patronímico.
- source_word: הָאֲגָגִי
  choice: o agagita
  rationale: Preserva a designação hebraica sem decidir no texto principal se ela indica linhagem, etnia ou outra associação com Agague.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: exaltou-o
  rationale: Mantém a segunda expressão de elevação, inclusive sua nuance honorífica, sem fundi-la silenciosamente com “promoveu”.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: colocou seu trono
  rationale: “Trono” comunica posição e autoridade na corte, embora o substantivo hebraico também possa significar “assento”.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: acima de todos os oficiais
  rationale: Expressa a superioridade hierárquica de Hamã sobre os demais altos servidores da corte em linguagem moderna.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: Conserva a formulação e a referência pronominal do hebraico, sem explicitar no texto um antecedente que o original deixa implícito.
