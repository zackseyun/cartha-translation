  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: pt
  text: Foram enviadas cartas pelas mãos dos mensageiros a todas as províncias do rei[a], para destruir, matar e exterminar todos os judeus — dos jovens aos idosos, crianças e mulheres — num só dia, no décimo terceiro dia do décimo segundo mês, isto é, o mês de adar[b], e para saquear os seus bens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pelas mãos dos corredores»; eram mensageiros reais.
    reason: lexical_alternative
  - marker: b
    text: Adar corresponde aproximadamente a fevereiro-março.
    reason: historical_context
  - marker: c
    text: 'Ou: «e tomar os seus bens como despojo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: Foram enviadas cartas
  rationale: Explicita em português o sujeito סְפָרִים da construção passiva e preserva o caráter de comunicação oficial sem recorrer ao mais técnico «documentos».
- source_word: בְּיַד הָרָצִים
  choice: pelas mãos dos mensageiros
  rationale: Conserva a expressão hebraica «pela mão de» em plural português natural; הָרָצִים designa literalmente «os corredores», aqui mensageiros reais.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: para destruir, matar e exterminar
  rationale: Mantém a tríade deliberadamente cumulativa de verbos violentos, usando termos atuais e distintos em português.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: dos jovens aos idosos
  rationale: Reproduz o merismo etário distributivo de modo natural e inclusivo em português; o contexto já explicita crianças e mulheres.
- source_word: טַף וְנָשִׁים
  choice: crianças e mulheres
  rationale: טַף indica crianças ou pequeninos; a formulação deixa clara a inclusão de não combatentes.
- source_word: בְּיוֹם אֶחָד
  choice: num só dia
  rationale: «Só» comunica naturalmente a concentração enfática de toda a ação em um único dia.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: isto é, o mês de adar
  rationale: Traduz a explicação apositiva do nome do décimo segundo mês com sintaxe portuguesa corrente.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: e para saquear os seus bens
  rationale: Expressa com clareza o saque autorizado; «bens» identifica aquilo que seria tomado, evitando em português a redundância pouco natural de «saquear o seu saque».
