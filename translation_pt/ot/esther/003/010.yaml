base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: pt
  text: Então o rei tirou o seu anel de sinete da mão e o deu a Hamã, filho de Hamedata, o agagita, inimigo dos judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos judaítas”. O hebraico יְהוּדִים pode designar o povo judeu de modo mais amplo ou, em certos contextos, pessoas de Judá ou da Judeia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: tirou
  rationale: O verbo expressa remover ou tirar; com “da mão”, esta é uma formulação natural e fiel ao gesto descrito.
- source_word: טַבַּעְתּוֹ
  choice: o seu anel de selar
  rationale: No contexto da corte, trata-se do anel usado como selo oficial, não de um simples adorno. “Anel de selar” comunica essa função em português corrente.
- source_word: מֵעַל יָדוֹ
  choice: da mão
  rationale: Reproduz de modo conciso e natural a imagem hebraica de retirar o anel da mão.
- source_word: וַיִּתְּנָהּ
  choice: e o deu
  rationale: Tradução direta de נתן; o pronome retoma o anel, masculino em português.
- source_word: לְהָמָן
  choice: a Hamã
  rationale: O nome próprio é transliterado segundo a forma portuguesa consagrada.
- source_word: בֶּן הַמְּדָתָא
  choice: filho de Hamedata
  rationale: Mantém literalmente o patronímico, com transliteração legível em português.
- source_word: הָאֲגָגִי
  choice: o agagita
  rationale: Preserva a designação de origem ou linhagem e sua ressonância narrativa sem acrescentar uma identificação interpretativa.
- source_word: צֹרֵר
  choice: inimigo
  rationale: O particípio designa alguém que hostiliza ou se opõe; “inimigo” é claro, forte e natural neste contexto.
- source_word: הַיְּהוּדִים
  choice: dos judeus
  rationale: Em Ester, o termo designa o povo étnico-religioso visado por Hamã; “judeus” é a forma contextual e tradicionalmente compreensível, embora “judaítas” seja lexicalmente possível.
- source_word: וַ
  choice: Então
  rationale: O waw narrativo dá continuidade ao relato e, aqui, também apresenta a ação decorrente da fala anterior; “Então” expressa bem esse fluxo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “tirou da mão o seu anel” evita a possível leitura de que ele removeu algo pertencente à mão, e “anel de selar” explicita naturalmente a função oficial do objeto.
