  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: pt
  text: Mas ele considerou indigno de si atacar somente Mordecai, pois lhe haviam contado a que povo Mordecai pertencia. Por isso, Hamã procurou destruir todos os judeus que viviam em todo o reino de Assuero — o povo de Mordecai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: ele considerou indigno de si
  rationale: A expressão hebraica comunica desprezo e a ideia de que limitar-se a Mordecai seria algo abaixo de Hamã. A formulação natural em português preserva essa avaliação sem sugerir que atacar Mordecai, em si, lhe causasse repulsa moral.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: atacar
  rationale: O idioma hebraico significa agir violentamente contra alguém. “Atacar” transmite com clareza o sentido no português atual, sem a possível ambiguidade de “pôr a mão em”.
- source_word: לְבַדּוֹ
  choice: somente Mordecai
  rationale: Expressa que Mordecai, tomado isoladamente, era um alvo limitado demais diante do plano mais amplo de Hamã.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: pois lhe haviam contado
  rationale: A oração explica por que Hamã ampliou seu alvo; o mais-que-perfeito composto deixa clara a anterioridade da informação.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: a que povo Mordecai pertencia
  rationale: Explicita de maneira natural que “o povo de Mordecai” indica seu pertencimento étnico, e não um povo governado ou possuído por ele.
- source_word: וַיְבַקֵּשׁ
  choice: procurou
  rationale: Preserva a intenção deliberada expressa por בקש sem afirmar que o objetivo chegou a ser realizado.
- source_word: לְהַשְׁמִיד
  choice: destruir
  rationale: Comunica a eliminação pretendida pelo hifil de שׁמד, evitando introduzir um termo técnico moderno não exigido pelo texto.
- source_word: כָּל הַיְּהוּדִים
  choice: todos os judeus
  rationale: No contexto de Ester, o termo designa o povo judeu disperso no Império Persa, não apenas habitantes de Judá.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: que viviam em todo o reino de Assuero
  rationale: Torna natural em português a localização dos judeus por toda a extensão do reino, sem perder o alcance total da expressão hebraica.
- source_word: עַם מָרְדֳּכָי
  choice: o povo de Mordecai
  rationale: Mantém na conclusão a repetição enfática e a aposição do hebraico, agora compreensível à luz da formulação anterior.
