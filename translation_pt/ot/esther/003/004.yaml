revisions:
- from: E aconteceu que, depois de falarem com ele dia após dia, sem que ele lhes desse ouvidos, contaram isso a Hamã, para ver se as palavras de Mardoqueu permaneceriam firmes[a], pois ele lhes havia dito que era judeu.
  to: Quando lhe falavam dia após dia, e ele não lhes dava ouvidos, informaram Hamã, para ver se as palavras de Mardoqueu se sustentariam[a], pois ele lhes havia dito que era judeu.
  rationale: A revisão corrige a relação temporal de 'depois de falarem' para a circunstância simultânea e repetida expressa no hebraico. Também simplifica a abertura narrativa sem perda de sentido e usa 'se sustentariam' para uma formulação portuguesa natural que preserva a ambiguidade de 'as palavras de Mardoqueu permaneceriam de pé'.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:57:22Z'
