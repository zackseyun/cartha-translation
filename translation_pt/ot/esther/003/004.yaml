  source_fidelity: A expressão temporal hebraica בְּאָמְרָם introduz a fala repetida como circunstância simultânea ('quando/enquanto lhe falavam'), não uma ação concluída anterior. Por isso, 'depois de falarem' altera levemente a sequência. O restante transmite adequadamente a recusa de Mardoqueu, a comunicação a Hamã, a finalidade da denúncia e sua identidade judaica.
  naturalness: A redação proposta é moderna, clara e adequada ao português internacional com boa legibilidade brasileira. 'Quando lhe falavam dia após dia' é mais direta e natural do que a fórmula 'E aconteceu que, depois de falarem'.
  terminology: Hamã, Mardoqueu e 'judeu' são formas corretas e usuais. 'Se as palavras de Mardoqueu se sustentariam' conserva a metáfora hebraica de modo idiomático e não resolve a ambiguidade quanto à justificativa dele ou à permanência de sua posição.
