base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: pt
  text: Quando lhe falavam dia após dia, e ele não lhes dava ouvidos, informaram Hamã, para ver se as palavras de Mardoqueu se sustentariam[a], pois ele lhes havia dito que era judeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se a explicação de Mardoqueu se sustentaria”. O hebraico diz literalmente: “se as palavras de Mardoqueu permaneceriam de pé” e pode se referir tanto à razão que ele apresentou para não se prostrar como à possibilidade de ele manter sua posição sob pressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: E aconteceu que, depois de falarem com ele
  rationale: A fórmula narrativa com בְּ mais infinitivo estabelece a circunstância temporal. A formulação preserva o movimento narrativo e expressa que as repetidas advertências precederam a denúncia a Hamã.
- source_word: יוֹם וָיוֹם
  choice: dia após dia
  rationale: O idiomatismo hebraico indica repetição diária persistente; a expressão portuguesa comunica naturalmente essa insistência.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: sem que ele lhes desse ouvidos
  rationale: שׁמע אֶל significa escutar ou atender. 'Dar ouvidos' transmite não apenas audição, mas a recusa contínua em atender ao que diziam.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: contaram isso a Hamã
  rationale: O hifil de נגד significa contar, informar ou relatar. 'Isso' explicita naturalmente em português o conteúdo da denúncia sem acrescentar informação substantiva.
- source_word: לִרְאוֹת הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: para ver se as palavras de Mardoqueu permaneceriam firmes
  rationale: O infinitivo indica propósito, e עמד aplicado a 'palavras' conserva a metáfora de permanecer ou manter-se. A redação deixa aberta tanto a validade da explicação quanto a persistência da posição de Mardoqueu.
- source_word: כִּי הִגִּיד לָהֶם
  choice: pois ele lhes havia dito
  rationale: כִּי introduz a razão da denúncia, enquanto o mais-que-perfeito em português deixa clara a anterioridade da revelação feita por Mardoqueu.
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: que era judeu
  rationale: יְהוּדִי é um termo nominal de identidade étnico-religiosa. 'Era judeu' reproduz diretamente a predicação e é natural em português.
theological_decisions:
- issue: O alcance de 'as palavras de Mardoqueu permaneceriam firmes'
  choice: Manter a metáfora e a ambiguidade no texto, com esclarecimento em nota
  alternative: Traduzir especificamente como 'se a explicação de Mardoqueu seria aceita' ou 'se Mardoqueu manteria sua posição'
  rationale: O hebraico não determina inequivocamente se os servos queriam testar a validade da justificativa de Mardoqueu ou sua perseverança sob pressão. Não se deve resolver no texto uma tensão que o original preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregam-se 'Hamã' e 'Mardoqueu', formas tradicionais e reconhecíveis em português. A construção conserva o encadeamento narrativo e a ambiguidade genuína da expressão hebraica central.
