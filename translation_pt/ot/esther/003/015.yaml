  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: pt
  text: Os mensageiros partiram às pressas por ordem do rei, e o decreto foi promulgado na cidadela de Susã.[a] O rei e Hamã sentaram-se para beber, mas a cidade de Susã ficou perplexa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a lei foi dada na cidadela de Susã”. O verbo hebraico significa literalmente “foi dada”, e דָּת pode ser traduzido como “lei” ou “decreto” neste contexto administrativo persa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficou confusa” ou “ficou em tumulto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: os mensageiros
  rationale: No contexto administrativo persa, designa os portadores oficiais das mensagens reais. “Mensageiros” é claro e natural em português; “corredores” seria literal demais, e “estafetas” tem uso regional.
- source_word: יָצְאוּ דְחוּפִים
  choice: partiram às pressas
  rationale: Expressa de modo natural tanto a saída dos mensageiros como a urgência imposta à missão.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: por ordem do rei
  rationale: דבר indica aqui a determinação autoritativa do rei, não apenas sua palavra ou fala.
- source_word: הַדָּת
  choice: o decreto
  rationale: No ambiente administrativo de Ester, o termo se refere a uma determinação legal oficial; “decreto” é mais específico que “lei”.
- source_word: נִתְּנָה
  choice: foi promulgado
  rationale: Embora o verbo signifique literalmente “foi dado”, neste contexto descreve a publicação oficial do decreto.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: a cidadela de Susã
  rationale: בירה designa a cidadela ou o complexo palaciano fortificado, distinguido no fim do versículo da cidade de Susã em sentido mais amplo.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: sentaram-se para beber
  rationale: Mantém de perto a construção hebraica e preserva o contraste marcante entre a ação dos governantes e a reação da cidade.
- source_word: נָבוֹכָה
  choice: ficou perplexa
  rationale: O verbo descreve desorientação, confusão ou perturbação. “Ficou perplexa” preserva a reação coletiva sem definir em excesso se houve tumulto público.
- source_word: וְ
  choice: mas
  rationale: A conjunção é literalmente “e”, porém aqui introduz um forte contraste narrativo entre o rei e Hamã bebendo e a cidade perplexa.
