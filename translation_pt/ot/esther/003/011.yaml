  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הָמָ֔ן הַ/כֶּ֖סֶף נָת֣וּן לָ֑/ךְ וְ/הָ/עָ֕ם לַ/עֲשׂ֥וֹת בּ֖/וֹ כַּ/טּ֥וֹב בְּ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: pt
  text: 'Então o rei disse a Hamã: “A prata[a] é dada a você, e também o povo, para fazer com ele[b] o que parecer bem aos seus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O dinheiro”. A palavra hebraica כֶּסֶף pode significar literalmente “prata” ou, por extensão, “dinheiro”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega aqui um pronome no singular, pois “o povo” é um substantivo coletivo. Pelo sentido, também se poderia traduzir “fazer com eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez natural em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido empregado pelo hebraico, sem substituí-lo pelo nome do monarca.
- source_word: לְהָמָן
  choice: a Hamã
  rationale: A preposição marca o destinatário da fala; “Hamã” é a forma portuguesa tradicional e clara do nome.
- source_word: הַכֶּסֶף
  choice: A prata
  rationale: כֶּסֶף designa literalmente “prata” e, por extensão, “dinheiro”. A tradução principal conserva o sentido concreto, enquanto a nota registra a alternativa contextual.
- source_word: נָתוּן לָךְ
  choice: é dada a você
  rationale: A construção participial passiva indica que a prata fica entregue ou posta à disposição de Hamã; a formulação preserva tanto a voz quanto a concisão do hebraico.
- source_word: וְהָעָם
  choice: e também o povo
  rationale: A conjunção acrescenta o povo àquilo que é entregue a Hamã. “Também” explicita naturalmente essa relação em português.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: para fazer com ele
  rationale: O infinitivo expressa finalidade, e o pronome hebraico é masculino singular, retomando o substantivo coletivo “povo”. O português permite conservar essa concordância.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: o que parecer bem aos seus olhos
  rationale: Preserva a imagem idiomática hebraica e comunica que Hamã tem permissão para agir segundo seu próprio parecer.
