  text: ח֣וּר כַּרְפַּ֣ס וּ/תְכֵ֗לֶת אָחוּז֙ בְּ/חַבְלֵי ב֣וּץ וְ/אַרְגָּמָ֔ן עַל גְּלִ֥ילֵי כֶ֖סֶף וְ/עַמּ֣וּדֵי שֵׁ֑שׁ מִטּ֣וֹת זָהָ֣ב וָ/כֶ֗סֶף עַ֛ל רִֽצְפַ֥ת בַּהַט וָ/שֵׁ֖שׁ וְ/דַ֥ר וְ/סֹחָֽרֶת׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: pt
  text: Havia cortinas de algodão branco e azul, presas com cordões de linho fino e púrpura a argolas de prata[a] e colunas de mármore. Havia também divãs[b] de ouro e prata sobre um piso de alabastro, mármore, madrepérola e pedras preciosas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hastes de prata”. O termo hebraico pode indicar, de modo mais geral, peças arredondadas ou cilíndricas de prata.
    reason: lexical_alternative
  - marker: b
    text: Os “divãs” eram móveis nos quais os convidados se reclinavam durante o banquete, não camas comuns.
    reason: cultural_note
  - marker: c
    text: A identificação exata dos materiais do piso é incerta. “Alabastro”, “mármore”, “madrepérola” e “pedras preciosas” refletem identificações comuns; outras traduções trazem termos como “pórfiro”, “mármore branco” ou “pedra escura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: cortinas de algodão branco e azul
  rationale: A construção descreve tecidos ornamentais; חוּר é entendido como a cor branca, כַּרְפַּס como algodão e תְכֵלֶת como azul ou azul-arroxeado. A formulação é natural em português e evita sugerir que 'branco' seja um tecido separado.
- source_word: אָחוּז בְּחַבְלֵי בוּץ וְאַרְגָּמָן
  choice: presas com cordões de linho fino e púrpura
  rationale: אָחוּז indica que as cortinas estavam fixadas; בּוּץ designa linho fino e אַרְגָּמָן, púrpura, provavelmente como cor ou material dos cordões.
- source_word: גְּלִילֵי כֶסֶף
  choice: argolas de prata
  rationale: O substantivo designa objetos arredondados ou enrolados; 'argolas' explica bem a fixação das cortinas, embora 'hastes de prata' também seja possível.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: colunas de mármore
  rationale: Neste contexto arquitetônico, שֵׁשׁ designa uma pedra branca, geralmente identificada como mármore, não linho.
- source_word: מִטּוֹת זָהָב וָכֶסֶף
  choice: divãs de ouro e prata
  rationale: Em contexto de banquete, מִטּוֹת são móveis nos quais os convidados se reclinavam, não camas comuns; 'divãs' expressa isso de modo conciso.
- source_word: רִצְפַת
  choice: piso
  rationale: '''Piso'' é uma tradução atual e direta para a superfície pavimentada, sem impor a interpretação mais específica de mosaico.'
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: alabastro, mármore, madrepérola e pedras preciosas
  rationale: São identificações tradicionais e academicamente comuns para uma lista de materiais luxuosos, mas a identificação mineral dos termos raros é incerta e por isso recebe nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase longa do hebraico foi dividida em duas para clareza. 'Divãs' preserva o cenário de banquete, e as incertezas materiais e arquitetônicas foram mantidas em notas.
