  yaml_path: translation/ot/esther/001/002.yaml
  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: pt
  text: Naqueles dias, quando o rei Assuero estava sentado em seu trono real, que ficava em Susã, a cidadela[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na cidadela de Susã”.
    reason: A expressão hebraica pode ser vertida mais literalmente como “em Susã, a cidadela” ou, em português mais idiomático, como “na cidadela de Susã”.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Fórmula narrativa temporal corrente que preserva a força demonstrativa do hebraico em português natural.
- source_word: כְּשֶׁבֶת
  choice: quando ... estava sentado
  rationale: A preposição כְּ com o infinitivo construto de יָשַׁב introduz uma oração temporal. A forma durativa é natural em português e não transforma a expressão numa referência inequívoca ao início do reinado.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: o rei Assuero
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português, com o título na ordem idiomática.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: em seu trono real
  rationale: Expressa de modo conciso e natural o sentido literal de 'sobre o trono de seu reino/realeza', preservando o sufixo possessivo.
- source_word: אֲשֶׁר
  choice: que ficava
  rationale: Introduz a oração relativa ligada ao trono; 'ficava' torna clara a localização sem alterar sua função sintática.
- source_word: בְּשׁוּשַׁן
  choice: na ... de Susã
  rationale: Usa a forma portuguesa consagrada do topônimo e integra a expressão locativa com naturalidade.
- source_word: הַבִּירָה
  choice: cidadela
  rationale: Designa o complexo fortificado, palaciano e administrativo; 'cidadela' é mais preciso aqui do que 'capital' e menos genérico do que 'fortaleza'.
