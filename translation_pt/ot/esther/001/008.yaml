base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: pt
  text: 'E o beber seguia a regra[a]: ninguém era obrigado[b], pois o rei havia determinado a todos os oficiais de sua casa que fizessem conforme a vontade de cada um[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme a lei” ou “conforme o regulamento”; o termo hebraico pode indicar lei, decreto ou regra formal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não havia coerção”; isto é, ninguém era forçado a beber.
    reason: lexical_alternative
  - marker: c
    text: Hebraico, literalmente, “homem e homem”, uma expressão distributiva que significa cada indivíduo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: E o beber
  rationale: Preserva a referência específica ao ato de beber no contexto do banquete, sem ampliá-la para o banquete inteiro.
- source_word: כַדָּת
  choice: seguia a regra
  rationale: דָּת pode indicar lei, decreto ou norma. Neste contexto, trata-se mais naturalmente da regra estabelecida para o serviço das bebidas.
- source_word: אֵין אֹנֵס
  choice: ninguém era obrigado
  rationale: Expressa em português corrente a ausência de coerção, isto é, que ninguém era forçado a beber.
- source_word: כִּי כֵן
  choice: pois
  rationale: Introduz de modo natural a razão da ausência de coerção; o valor demonstrativo adicional é expresso pela determinação descrita na oração.
- source_word: יִסַּד
  choice: havia determinado
  rationale: Embora o sentido básico envolva estabelecer ou fixar, no contexto administrativo indica que o rei havia instituído essa orientação.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: a todos os oficiais de sua casa
  rationale: רַב designa aqui responsáveis ou superiores da administração doméstica real; 'oficiais de sua casa' mantém o cenário cortesão sem restringir indevidamente a mordomos.
- source_word: לַעֲשׂוֹת
  choice: que fizessem
  rationale: Representa o infinitivo hebraico em construção natural com o verbo de determinação em português.
- source_word: כִּרְצוֹן
  choice: conforme a vontade de
  rationale: רָצוֹן denota o desejo ou preferência de alguém; 'vontade' é claro, digno e idiomático.
- source_word: אִישׁ וָאִישׁ
  choice: cada um
  rationale: A repetição hebraica é distributiva e destaca cada indivíduo. 'Cada um' reproduz esse sentido naturalmente em português; a nota registra a forma literal masculina.
