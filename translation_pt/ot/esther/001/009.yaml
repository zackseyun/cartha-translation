base_translation:
  language: en
  yaml_path: translation/ot/esther/001/009.yaml
  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: pt
  text: A rainha Vasti também ofereceu um banquete para as mulheres no palácio real[a] do rei Assuero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «na casa da realeza» ou «na casa do reino».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: também
  rationale: Marca a adição ao banquete do rei descrito anteriormente e soa natural em português.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: a rainha Vasti
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português e apresenta o título em ordem natural.
- source_word: עָשְׂתָה
  choice: ofereceu
  rationale: Embora o verbo signifique literalmente «fez», «ofereceu um banquete» é uma expressão idiomática natural que preserva o sentido.
- source_word: מִשְׁתֵּה נָשִׁים
  choice: um banquete para as mulheres
  rationale: מִשְׁתֵּה designa um banquete, muitas vezes associado à bebida; נָשִׁים identifica as participantes.
- source_word: בֵּית הַמַּלְכוּת
  choice: no palácio real
  rationale: A expressão literal «casa da realeza/do reino» refere-se naturalmente ao palácio; «palácio real» é claro e corrente em português.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: do rei Assuero
  rationale: Expressa de modo conciso e natural a relação possessiva indicada pela oração hebraica.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuero
  rationale: Forma tradicional e amplamente usada em traduções bíblicas portuguesas para o nome hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. «Banquete» comunica melhor neste contexto o מִשְׁתֵּה hebraico do que «festa», embora o termo possa envolver bebida. A nota preserva a imagem literal de בֵּית הַמַּלְכוּת sem tornar o texto principal artificial.
