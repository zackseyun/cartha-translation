base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: pt
  text: Então ele enviou cartas a todas as províncias do rei, a cada província em sua própria escrita e a cada povo em sua própria língua, para que cada homem[a] tivesse autoridade em sua própria casa e falasse a língua de seu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cada marido”. O hebraico diz “cada homem”, mas, neste contexto, o decreto trata da autoridade no lar e no casamento.'
    reason: lexical_alternative
  - marker: b
    text: A cláusula final pode significar simplesmente que cada homem deveria falar a língua de seu próprio povo. Também pode indicar, de modo mais amplo, que a organização do lar deveria seguir a identidade linguística do homem.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ele enviou
  rationale: O wayyiqtol dá continuidade à linha narrativa. “Então” expressa essa progressão de modo natural em português, sem acrescentar uma relação temporal forte.
- source_word: סְפָרִים
  choice: cartas
  rationale: Neste contexto administrativo real, o substantivo designa comunicações escritas oficiais. “Cartas” é claro, corrente e adequado ao contexto.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: todas as províncias do rei
  rationale: Mantém de perto a relação de pertencimento expressa pela construção hebraica e soa natural em português.
- source_word: אֶל מְדִינָה וּמְדִינָה
  choice: a cada província
  rationale: A repetição distributiva do singular significa que a comunicação foi dirigida individualmente a todas as províncias.
- source_word: כִּכְתָבָהּ
  choice: em sua própria escrita
  rationale: Refere-se ao sistema ou forma de escrita própria de cada província. “Escrita” é mais amplamente compreensível que o termo técnico “grafia” e não restringe indevidamente o sentido a um alfabeto específico.
- source_word: וְאֶל עַם וָעָם
  choice: e a cada povo
  rationale: A repetição tem força distributiva. “Povo” convém ao foco étnico-linguístico dos grupos que compunham o império.
- source_word: כִּלְשׁוֹנוֹ
  choice: em sua própria língua
  rationale: לָשׁוֹן significa literalmente “língua” e, neste contexto, designa claramente o idioma de cada povo.
- source_word: לִהְיוֹת
  choice: determinando que ... exercesse
  rationale: O infinitivo introduz o conteúdo ou resultado pretendido pelo decreto. “Determinando que” torna explícita a função administrativa da oração sem alterar seu conteúdo.
- source_word: כָּל אִישׁ
  choice: cada homem
  rationale: Reproduz o masculino singular distributivo. O contexto permite entender “homem” como “marido”, mas essa especificação é mantida em nota para não eliminar a amplitude lexical do hebraico.
- source_word: שֹׂרֵר
  choice: exercesse autoridade
  rationale: O particípio denota governar, dominar ou exercer autoridade. Esta formulação comunica a ideia com clareza e dignidade, sem as conotações modernas potencialmente excessivas de “fosse senhor” ou “fosse o dono”.
- source_word: בְּבֵיתוֹ
  choice: em sua própria casa
  rationale: Preserva tanto a esfera doméstica quanto a possibilidade de “casa” abranger o lar ou a unidade familiar.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: e falasse a língua de seu povo
  rationale: 'Segue a leitura mais direta do texto massorético: o homem deveria falar segundo a língua de seu próprio povo. A dificuldade e possível alcance mais amplo da cláusula são registrados em nota.'
theological_decisions:
- issue: Identidade de כָּל אִישׁ no decreto doméstico
  choice: cada homem
  alternative: cada marido
  rationale: Embora o contexto matrimonial favoreça a referência aos maridos, o hebraico emprega o termo comum para “homem”. A tradução conserva essa forma, e a nota apresenta a leitura contextual sem transformar uma inferência em explicitação obrigatória.
- issue: Sentido da cláusula final sobre a língua
  choice: falasse a língua de seu povo
  alternative: que a ordem da casa refletisse a identidade linguística do homem
  rationale: A tradução principal representa a sintaxe mais direta. Como a relação lógica da cláusula com a autoridade doméstica é incomum e pode ter alcance mais amplo, a nota preserva a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmos como “senhoreasse” e preserva o tom de decreto real. “Sua própria escrita” e “sua própria língua” mantêm o paralelismo administrativo do hebraico; “casa” conserva a amplitude entre residência, lar e unidade familiar.
