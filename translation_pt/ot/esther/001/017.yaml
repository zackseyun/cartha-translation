  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: pt
  text: 'Pois o caso da rainha se tornará conhecido por todas as mulheres, fazendo com que seus maridos sejam desprezados aos olhos delas, quando disserem: “O rei Assuero mandou trazer a rainha Vasti à sua presença, mas ela não veio.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: o caso da rainha
  rationale: דָּבָר tem amplo campo semântico; aqui se refere ao ocorrido ou assunto envolvendo a rainha. “Caso” soa natural em português e evita restringir o sentido apenas à conduta dela.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: se tornará conhecido por todas as mulheres
  rationale: A expressão literalmente descreve o caso “saindo” a todas as mulheres, isto é, divulgando-se ou tornando-se conhecido entre elas.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: levando-as a desprezar seus maridos aos próprios olhos
  rationale: Preserva tanto o infinitivo de resultado/efeito quanto o idiomatismo בְּעֵינֵיהֶן, sem eliminar sua formulação enfática.
- source_word: אָמַר לְהָבִיא
  choice: mandou trazer
  rationale: Literalmente, “disse para trazer”; no contexto régio, a construção comunica uma ordem. “Mandou trazer” é corrente e não acrescenta a força mais específica de “ordenou”.
- source_word: לְפָנָיו
  choice: à sua presença
  rationale: Equivale idiomaticamente a “diante dele” e mantém o registro digno da cena de corte.
