base_translation:
  language: en
  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: pt
  text: A proposta pareceu boa ao rei e aos altos funcionários, e o rei fez o que Memucã havia proposto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o rei fez conforme a palavra de Memucã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: pareceu boa a
  rationale: Reproduz de modo natural o idioma hebraico “foi bom aos olhos de”, preservando seu caráter avaliativo.
- source_word: הַדָּבָר
  choice: a proposta
  rationale: No contexto, דָּבָר se refere ao conselho que Memucã acaba de apresentar; “proposta” explicita esse referente sem alterar o sentido.
- source_word: וְהַשָּׂרִים
  choice: e aos altos funcionários
  rationale: שָׂרִים designa autoridades de elevada posição na corte; esta expressão é clara e evita o sentido dinástico moderno de “príncipes”.
- source_word: וַיַּעַשׂ הַמֶּלֶךְ כִּדְבַר מְמוּכָן
  choice: e o rei fez o que Memucã havia proposto
  rationale: Expressa naturalmente a ação de cumprir a palavra ou proposta de Memucã, enquanto a nota registra a forma mais próxima do hebraico.
- source_word: מְמוּכָן
  choice: Memucã
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
