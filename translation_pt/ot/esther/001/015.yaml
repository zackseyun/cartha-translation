source:
  edition: WLC
  text: כְּ/דָת֙ מַֽה לַּ/עֲשׂ֔וֹת בַּ/מַּלְכָּ֖ה וַשְׁתִּ֑י עַ֣ל אֲשֶׁ֣ר לֹֽא עָשְׂתָ֗ה אֶֽת מַאֲמַר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ בְּ/יַ֖ד הַ/סָּרִיסִֽים־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: pt
  text: Segundo a lei, o que se deve fazer com a rainha Vasti, por ela não ter cumprido[c] a ordem do rei Assuero, transmitida pelos eunucos[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “transmitida por meio dos eunucos”; literalmente, “pela mão dos eunucos”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode designar, de modo mais amplo, oficiais da corte, embora “eunucos” seja a tradução mais direta.
    reason: cultural_note
  - marker: c
    text: Ou “por ela não ter obedecido à ordem do rei Assuero”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  choice: Segundo a lei
  rationale: Em Ester, דָּת designa normalmente uma lei ou norma oficial no contexto da corte persa. “Segundo a lei” preserva o enquadramento jurídico e soa natural em português.
- source_word: מַה לַּעֲשׂוֹת
  choice: o que se deve fazer
  rationale: A construção infinitiva tem força deliberativa e impessoal, adequada a uma consulta jurídica.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: com a rainha Vasti
  rationale: A preposição com עשה indica a medida a ser tomada em relação a alguém. “Fazer com” preserva essa formulação sem acrescentar explicitamente uma ideia de hostilidade ou punição.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: por ela não ter cumprido
  rationale: A expressão apresenta o motivo da medida, e עָשְׂתָה significa literalmente que ela não “fez” o que fora ordenado. “Não ter cumprido” é natural com “ordem” e evita tornar “obedeceu” a única interpretação no texto principal.
- source_word: מַאֲמַר
  choice: a ordem
  rationale: No contexto régio, מַאֲמַר é uma declaração dotada de autoridade; “ordem” comunica essa força melhor do que o sentido genérico de “palavra”.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: o rei Assuero
  rationale: O título é traduzido, e “Assuero” é a forma portuguesa consagrada e amplamente reconhecida para o nome hebraico אֲחַשְׁוֵרוֹשׁ.
- source_word: בְּיַד הַסָּרִיסִים
  choice: transmitida pelos eunucos
  rationale: A expressão, literalmente “pela mão dos eunucos”, indica agência ou mediação. “Transmitida pelos eunucos” explicita de modo natural que eles levaram a ordem, mantendo em nota a forma mais literal e a amplitude possível de סָרִיס.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o tom jurídico e deliberativo da pergunta, conserva “com a rainha Vasti” para não especificar além do hebraico a natureza da medida e usa “cumprido” no texto principal, deixando “obedecido” como alternativa.
