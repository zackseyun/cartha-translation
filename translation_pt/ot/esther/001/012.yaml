  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: pt
  text: Mas a rainha Vasti recusou-se a vir por ordem do rei, transmitida por meio dos eunucos[a]. Então o rei ficou furioso, e sua ira ardia dentro dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela mão dos eunucos”, expressão que indica que a ordem foi transmitida por meio deles.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o rei ficou muito irado”. O hebraico intensifica a ira e, em seguida, a retrata como fogo que ardia dentro dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: recusou-se
  rationale: Expressa de modo direto e natural a recusa deliberada indicada por מאן.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: a rainha Vasti
  rationale: Conserva tanto o título quanto o nome próprio em ordem natural no português.
- source_word: לָבוֹא
  choice: a vir
  rationale: בוא significa normalmente vir ou entrar; no contexto de uma convocação, “vir” é a opção mais natural.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: por ordem do rei
  rationale: דבר, neste contexto, designa a ordem ou determinação real, não apenas uma palavra ou mensagem.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: transmitida por meio dos eunucos
  rationale: 'A expressão idiomática “pela mão de” indica mediação ou agência: os eunucos comunicaram a ordem. “Eunucos” preserva o sentido provável de סריסים no ambiente da corte persa.'
- source_word: וַיִּקְצֹף הַמֶּלֶךְ מְאֹד
  choice: o rei ficou furioso
  rationale: Reproduz a grande intensidade da ira indicada por קצף com o intensificador מְאֹד em português atual e digno.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: sua ira ardia dentro dele
  rationale: Mantém a metáfora hebraica da ira como fogo e entende בוֹ como referência ao interior do rei.
