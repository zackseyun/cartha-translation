revisions:
- from: 'Se parecer bem ao rei[a], que se emita diante dele um decreto real e que seja registrado entre as leis da Pérsia e da Média, para que não possa ser revogado[b]: Vasti não deverá comparecer diante do rei Assuero, e que o rei dê a posição real dela[c] a outra mulher, melhor do que ela.'
  to: 'Se parecer bem ao rei[a], que se emita, da parte dele, um decreto real e que seja registrado entre as leis da Pérsia e da Média, para que não possa ser revogado[b]: Vasti não deverá comparecer diante do rei Assuero, e que o rei dê sua posição de rainha[c] a outra mulher que seja melhor do que ela.'
  rationale: A revisão corrige a nuance direcional e administrativa de מִלְּפָנָיו, substituindo a expressão locativa “diante dele” por “da parte dele”. Também aperfeiçoa a fluência e a sintaxe da transferência da dignidade de Vasti, mantendo o sentido comparativo não especificado de הַטּוֹבָה מִמֶּנָּה. As âncoras e as notas foram preservadas e permanecem alinhadas ao texto.
