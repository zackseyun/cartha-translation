  terminology: “Vasti”, “rei Assuero”, “decreto real”, “Pérsia e Média” e “revogado” são escolhas adequadas. “Posição de rainha” explicita de maneira natural o sentido contextual de מַלְכוּתָהּ como condição/ofício real, sem indicar um território.
