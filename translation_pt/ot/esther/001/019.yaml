base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: pt
  text: 'Se parecer bem ao rei[a], que se emita, da parte dele, um decreto real e que seja registrado entre as leis da Pérsia e da Média, para que não possa ser revogado[b]: Vasti não deverá comparecer diante do rei Assuero, e que o rei dê sua posição de rainha[c] a outra mulher que seja melhor do que ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se isso agradar ao rei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que não seja alterado” ou “para que não seja transgredido”. A expressão hebraica indica que o decreto teria força jurídica permanente.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a realeza dela”; isto é, sua condição ou função de rainha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Se parecer bem ao rei
  rationale: Reproduz a fórmula cortês da corte, indicando a aprovação do rei, em português atual e digno.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: que se emita diante dele um decreto real
  rationale: “Decreto real” comunica a força oficial e jurídica de דְבַר מַלְכוּת; “diante dele” preserva a formulação מִלְּפָנָיו sem sugerir mera localização física.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: e que seja registrado entre as leis da Pérsia e da Média
  rationale: Expressa a incorporação formal do decreto ao corpo jurídico persa e medo, mantendo a ordem dos povos no hebraico.
- source_word: וְלֹא יַעֲבוֹר
  choice: para que não possa ser revogado
  rationale: No contexto jurídico, a expressão indica que o decreto não poderia ser anulado ou deixado sem efeito.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Vasti não deverá comparecer diante do rei Assuero
  rationale: Apresenta com clareza o conteúdo proibitivo do decreto, sem acrescentar “novamente”, termo não explícito no hebraico.
- source_word: וּמַלְכוּתָהּ
  choice: a posição real dela
  rationale: Neste contexto, מַלְכוּת designa a condição ou função régia de Vasti, e não um território governado.
- source_word: לִרְעוּתָהּ
  choice: a outra mulher
  rationale: No contexto da substituição de Vasti, רְעוּתָהּ refere-se naturalmente a outra mulher, em vez de uma companheira específica.
- source_word: הַטּוֹבָה מִמֶּנָּה
  choice: melhor do que ela
  rationale: Mantém a comparação avaliativa do hebraico sem especificar em que sentido a outra mulher seria melhor.
