  text: וַ/יְהִ֖י בִּ/ימֵ֣י אֲחַשְׁוֵר֑וֹשׁ ה֣וּא אֲחַשְׁוֵר֗וֹשׁ הַ/מֹּלֵךְ֙ מֵ/הֹ֣דּוּ וְ/עַד כּ֔וּשׁ שֶׁ֛בַע וְ/עֶשְׂרִ֥ים וּ/מֵאָ֖ה מְדִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: pt
  text: Aconteceu nos dias de Assuero[a] — o mesmo Assuero que reinava da Índia até Cuxe[b], sobre cento e vinte e sete províncias —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Xerxes”, se o nome for entendido como uma identificação histórica do rei persa, em vez de transliterado diretamente do hebraico.
    reason: alternative_reading
  - marker: b
    text: “Cuxe” é o antigo nome da região; algumas traduções trazem “Etiópia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu
  rationale: Forma natural e concisa de abrir uma narrativa em português, preservando o valor do wayyiqtol de היה sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém de perto a expressão temporal hebraica e é compreensível no registro narrativo bíblico moderno.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuero
  rationale: Transliteração portuguesa tradicional da forma hebraica, evitando transformar no texto principal a provável identificação histórica com Xerxes.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: o mesmo Assuero
  rationale: Expressa a função identificadora do pronome seguido da repetição do nome de maneira idiomática em português.
- source_word: הַמֹּלֵךְ
  choice: que reinava
  rationale: O particípio caracteriza Assuero por seu governo; a oração relativa no imperfeito é natural em português e combina com a moldura temporal passada.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: desde a Índia até Cuxe
  rationale: הֹדּוּ é convencionalmente entendido como Índia; Cuxe preserva o antigo nome regional e evita confusão com o Estado moderno da Etiópia.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: cento e vinte e sete
  rationale: Ordem numérica idiomática em português para o total hebraico.
- source_word: מְדִינָה
  choice: províncias
  rationale: Termo claro e consagrado para as divisões administrativas do contexto imperial persa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a abertura narrativa e o travessão final, pois a frase continua no versículo seguinte. Os marcadores de nota foram colocados imediatamente após os termos correspondentes.
