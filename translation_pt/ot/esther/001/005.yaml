  text: וּ/בִ/מְל֣וֹאת הַ/יָּמִ֣ים הָ/אֵ֗לֶּה עָשָׂ֣ה הַ/מֶּ֡לֶךְ לְ/כָל הָ/עָ֣ם הַ/נִּמְצְאִים֩ בְּ/שׁוּשַׁ֨ן הַ/בִּירָ֜ה לְ/מִ/גָּ֧דוֹל וְ/עַד קָטָ֛ן מִשְׁתֶּ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/חֲצַ֕ר גִּנַּ֥ת בִּיתַ֖ן הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: pt
  text: Quando se completaram esses dias, o rei ofereceu um banquete[a] a todo o povo que se encontrava em Susã, a cidadela[b], do maior ao menor[c], durante sete dias, no pátio do jardim do palácio[d] do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma festa”; o termo hebraico muitas vezes se refere a um banquete em que se bebia.
    reason: lexical_alternative
  - marker: b
    text: Ou “na cidadela de Susã”.
    reason: lexical_alternative
  - marker: c
    text: Ou “do mais importante ao menos importante”; é uma expressão que abrange pessoas de todas as posições sociais.
    reason: lexical_alternative
  - marker: d
    text: O termo também pode ser traduzido por “pavilhão” ou “casa”; “palácio” se ajusta bem ao contexto real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות
  choice: Quando se completaram
  rationale: A preposição ב com o infinitivo construto de מלא introduz uma circunstância temporal. A formulação preserva o sentido de conclusão do período e soa natural em português.
- source_word: הַיָּמִים הָאֵלֶּה
  choice: esses dias
  rationale: O demonstrativo remete ao período descrito imediatamente antes. Em português narrativo, “esses dias” estabelece essa retomada com naturalidade.
- source_word: עָשָׂה
  choice: ofereceu
  rationale: Embora o verbo tenha o sentido geral de “fazer”, com מִשְׁתֶּה significa promover ou oferecer um banquete. “Ofereceu” é idiomático e adequado ao contexto régio.
- source_word: מִשְׁתֶּה
  choice: banquete
  rationale: O substantivo designa uma festa ou banquete, frequentemente associado ao consumo de vinho. “Banquete” comunica bem a ocasião real sem enfatizar além do necessário a bebida.
- source_word: לְכָל הָעָם
  choice: a todo o povo
  rationale: Aqui עָם abrange coletivamente as pessoas presentes na capital, sem exigir uma referência étnica específica.
- source_word: הַנִּמְצְאִים
  choice: que se encontrava
  rationale: O particípio nifal de מצא indica quem estava presente em determinado lugar. A concordância coletiva no singular com “povo” é natural em português.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: em Susã, a cidadela
  rationale: בִּירָה designa a cidadela ou acrópole fortificada. A aposição conserva a estrutura hebraica e distingue o complexo fortificado.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: do maior ao menor
  rationale: A expressão idiomática inclui pessoas de todas as posições sociais. A tradução mantém a imagem hebraica sem substituir o idioma por uma explicação.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressa diretamente a duração do banquete em português corrente.
- source_word: בַּחֲצַר
  choice: no pátio
  rationale: חָצֵר pode indicar pátio ou átrio. “Pátio” apresenta com clareza o espaço aberto do complexo real.
- source_word: גִּנַּת
  choice: do jardim
  rationale: A forma construta liga o pátio ao jardim e integra a cadeia espacial do texto hebraico.
- source_word: בִּיתַן
  choice: do palácio
  rationale: O empréstimo persa pode designar palácio, casa ou pavilhão. “Palácio” se ajusta ao cenário real, enquanto a nota conserva a incerteza lexical.
