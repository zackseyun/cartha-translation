- from: Então o rei falou aos sábios que conheciam os tempos — pois assim se tratavam os assuntos do rei diante de todos os que conheciam a lei e o direito —
  to: Então o rei disse aos sábios que conheciam os tempos — pois este era o procedimento do rei perante todos os que conheciam a lei e o direito —
  rationale: A revisão substitui uma paráfrase genérica por «este era o procedimento do rei», que transmite mais fielmente o valor contextual da expressão hebraica e acompanha o audit trail inglês. Também ajusta «falou» para «disse», mantendo o registro narrativo moderno e digno. Conservam-se «os tempos», «lei e direito» e os travessões que indicam a continuação sintática no versículo seguinte.
