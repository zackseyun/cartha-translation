    issue: «assim se tratavam os assuntos do rei» é uma paráfrase excessivamente expansiva de כִּי כֵן דְּבַר הַמֶּלֶךְ.
    rationale: O hebraico apresenta «a questão/palavra do rei» no singular e explica o procedimento seguido perante os conhecedores de lei e julgamento. A formulação proposta introduz «assuntos» no plural e uma construção impessoal que enfraquece a referência ao procedimento régio.
