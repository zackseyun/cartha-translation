lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: que conheciam os tempos
  rationale: Preserva a expressão hebraica e sua possível referência à compreensão das circunstâncias, dos momentos apropriados ou dos costumes da época, sem restringir o sentido.
- source_word: כִּי כֵן דְּבַר הַמֶּלֶךְ
  choice: pois assim se tratavam os assuntos do rei
  rationale: Entende דְּבַר como assunto ou matéria submetida à consideração, e כִּי כֵן como indicação do procedimento habitual; a formulação é natural em português sem transformar a frase em uma declaração abstrata sobre o modo de falar do rei.
- source_word: דָּת וָדִין
  choice: a lei e o direito
  rationale: Distingue a norma legal (דָּת) da decisão, causa ou ordem jurídica (דִּין), usando uma dupla corrente e digna em português.
