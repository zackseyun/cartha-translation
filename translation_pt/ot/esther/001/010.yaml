base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: pt
  text: No sétimo dia, quando o coração do rei estava alegre por causa do vinho[a], ele disse a Meumã, Bizta, Harbona, Bigtá, Abagtá, Zetar e Carcas — os sete eunucos[b] que serviam na presença do rei Assuero —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando o rei estava animado pelo vinho». A expressão hebraica diz que o coração do rei estava alegre por causa do vinho, sem declarar explicitamente que ele estivesse embriagado.'
    reason: lexical_alternative
  - marker: b
    text: Em alguns contextos, o termo traduzido por «eunucos» pode designar, de modo mais amplo, funcionários da corte; aqui foi mantido seu sentido lexical mais direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: Equivalente temporal direto e natural; não acrescenta «da festa», expressão que não aparece explicitamente neste versículo.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: quando o coração do rei estava alegre por causa do vinho
  rationale: Preserva a imagem hebraica do coração alegre e a relação com o vinho, sem afirmar explicitamente que o rei estava embriagado.
- source_word: אָמַר
  choice: ele disse a
  rationale: Mantém o sentido comum do verbo hebraico e deixa a fala ou instrução ser completada no versículo seguinte, sem antecipar «ordenou».
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: a Meumã, Bizta, Harbona, Bigtá, Abagtá, Zetar e Carcas
  rationale: Translitera os nomes em formas legíveis e compatíveis com a fonologia e a ortografia portuguesas.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: os sete eunucos
  rationale: Retém o sentido lexical mais direto de סָרִיס, reconhecendo em nota que o termo também pode designar funcionários da corte.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: que serviam na presença de
  rationale: Reproduz de modo natural a ideia de serviço pessoal diante do rei, preservando a linguagem cortesã do hebraico.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: o rei Assuero
  rationale: Usa a forma portuguesa tradicional e amplamente reconhecida do nome אֲחַשְׁוֵרוֹשׁ.
