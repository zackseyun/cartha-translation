base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: pt
  text: As bebidas eram servidas em recipientes de ouro, cada recipiente diferente do outro, e havia vinho real em abundância, conforme a generosidade do rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: As bebidas eram servidas
  rationale: O infinitivo hebraico descreve o ato de dar de beber; a construção passiva em português expressa com naturalidade o serviço das bebidas no banquete.
- source_word: בִּכְלֵי זָהָב
  choice: em recipientes de ouro
  rationale: “Recipientes” traduz כְּלֵי de modo amplo, sem especificar indevidamente taças ou copos.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: cada recipiente diferente do outro
  rationale: Reproduz de forma idiomática a variedade individual indicada pela repetição de כֵלִים.
- source_word: וְיֵין מַלְכוּת רָב
  choice: e havia vinho real em abundância
  rationale: “Vinho real” conserva a associação com a realeza, enquanto “em abundância” transmite רָב no contexto.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: conforme a generosidade do rei
  rationale: A expressão idiomática associa a “mão” do rei à medida de seus recursos e de sua liberalidade; a tradução comunica esse sentido sem um literalismo obscuro.
theological_decisions: []
