  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: pt
  text: Enquanto exibia as riquezas da glória do seu reino e o esplendor da honra da sua grandeza por muitos dias — cento e oitenta dias —.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהַרְאֹתוֹ
  choice: ele exibiu
  rationale: O infinitivo com sufixo expressa a ação do rei no contexto da frase iniciada no versículo anterior; “exibiu” comunica uma mostra pública e intencional.
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: a riqueza da glória do seu reino
  rationale: Preserva a construção substantiva cumulativa do hebraico e sua linguagem régia elevada.
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: o esplendor da honra da sua grandeza
  rationale: Mantém distintos יְקָר, “honra/preciosidade”, e תִּפְאֶרֶת, “esplendor”, sem reduzir ambos a “glória”.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: durante muitos dias — cento e oitenta dias —
  rationale: Reproduz a duração geral seguida de sua especificação numérica, usando travessões para clareza natural em português.
