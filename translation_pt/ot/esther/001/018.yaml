  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: pt
  text: E ainda hoje as mulheres nobres da Pérsia e da Média que tiverem ouvido a palavra da rainha[a] dirão isso a todos os oficiais do rei; e haverá desprezo e ira de sobra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que a rainha disse” ou “o assunto da rainha”. O termo hebraico pode referir-se tanto às palavras da rainha como ao relato ou ao acontecimento que a envolveu.
    reason: lexical_alternative
  - marker: b
    text: A oração final é elíptica no hebraico, literalmente algo como “e bastante desprezo e ira”. A tradução acrescenta “haverá” para tornar explícito o sentido em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: E ainda hoje
  rationale: Expressa a iminência temporal do hebraico de modo natural em português, sem intensificar indevidamente.
- source_word: תֹּאמַרְנָה
  choice: dirão
  rationale: O imperfeito qal feminino plural tem sentido prospectivo no argumento de Memucã.
- source_word: שָׂרוֹת
  choice: as nobres
  rationale: Designa mulheres de alta posição social ou cortesã sem sugerir necessariamente filiação real, como poderia ocorrer com 'princesas'.
- source_word: פָּרַס וּמָדַי
  choice: da Pérsia e da Média
  rationale: Emprega os nomes geográficos tradicionais e torna clara a relação das mulheres com esses povos ou territórios.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: que ouvirem falar
  rationale: No contexto preditivo, o perfeito pode apresentar como concluído o ato de tomar conhecimento; a formulação portuguesa preserva a sequência prospectiva e indica a divulgação do caso.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: do que a rainha fez
  rationale: דָּבָר pode significar palavra, assunto ou acontecimento; aqui aponta provavelmente para o caso da recusa da rainha, embora a nota preserve as alternativas.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: a todos os oficiais do rei
  rationale: '''Oficiais'' comunica funções elevadas da corte sem a conotação hereditária potencial de ''príncipes''.'
- source_word: וּכְדַי
  choice: e haverá ... de sobra
  rationale: A oração hebraica é elíptica e expressa suficiência ou abundância; 'haverá' explicita apenas o necessário à fluência portuguesa.
- source_word: בִּזָּיוֹן
  choice: desprezo
  rationale: Transmite a ideia de desdém ou tratamento desrespeitoso central ao argumento.
- source_word: וָקָצֶף
  choice: e indignação
  rationale: קֶצֶף indica ira intensa; 'indignação' se ajusta ao contexto de reação ao desrespeito e soa natural no registro narrativo.
