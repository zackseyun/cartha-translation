base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: pt
  text: que trouxessem a rainha Vasti à presença do rei com a coroa real[a], para mostrar aos povos e às autoridades a beleza dela, pois era bela de aparência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “usando a coroa real”. A preposição hebraica pode ser traduzida por “com” ou “em”; o contexto pode indicar que ela deveria estar usando a coroa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: que trouxessem
  rationale: O infinitivo causativo de בוא depende da ordem do versículo anterior; em português, a oração subordinada com subjuntivo exprime naturalmente que os oficiais deveriam fazê-la vir.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: a rainha Vasti
  rationale: Conserva o nome próprio transliterado e o título em construção idiomática portuguesa.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: à presença do rei
  rationale: לִפְנֵי indica estar diante de alguém ou em sua presença; esta formulação é clara e digna em português.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: com a coroa real
  rationale: Preserva a amplitude da preposição ב sem explicitar além do hebraico que a coroa estaria sendo usada na cabeça.
- source_word: לְהַרְאוֹת
  choice: para mostrar
  rationale: O infinitivo causativo de ראה introduz aqui a finalidade de fazê-los ver.
- source_word: הָעַמִּים
  choice: aos povos
  rationale: Mantém o plural hebraico, apropriado ao contexto dos diversos povos do império persa.
- source_word: וְהַשָּׂרִים
  choice: e às autoridades
  rationale: שָׂרִים designa governantes ou altos dignitários; 'autoridades' é atual e evita sugerir especificamente filhos de reis.
- source_word: יָפְיָהּ
  choice: a beleza dela
  rationale: Traduz diretamente o substantivo 'beleza' com sufixo feminino, evitando a possível ambiguidade sonora de 'sua beleza' quanto ao possuidor.
- source_word: כִּי
  choice: pois
  rationale: Marca de modo natural a explicação ou razão apresentada pelo narrador.
- source_word: טוֹבַת מַרְאֶה
  choice: bela de aparência
  rationale: Reproduz com relativa proximidade a expressão hebraica 'boa de aparência', cujo sentido idiomático é beleza física visível.
