base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: pt
  text: 'Então Memucã disse diante do rei e dos altos oficiais: “A rainha Vasti não agiu mal somente contra o rei, mas também contra todos os altos oficiais e todos os povos que estão em todas as províncias do rei Assuero.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: מומכן
  choice: Memucã
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Indica que Memucã falou na presença do rei e dos altos oficiais.
- source_word: הַשָּׂרִים
  choice: os altos oficiais
  rationale: No contexto da corte persa, שׂרים designa autoridades de alta posição; a expressão é atual e mais precisa do que “príncipes”.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ
  choice: não ... somente contra o rei
  rationale: A construção expressa que o dano não se dirigiu exclusivamente ao rei e prepara a ampliação “mas também”.
- source_word: עָוְתָה
  choice: agiu mal
  rationale: Preserva o sentido moral de agir de forma errada ou perversa sem limitar a falta a uma mera ofensa pessoal.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: a rainha Vasti
  rationale: A ordem título-nome é natural em português e mantém o sentido do hebraico.
- source_word: כִּי
  choice: mas também
  rationale: Após a negação com לְבַדּוֹ, introduz a ampliação corretiva característica da construção “não somente... mas também”.
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: contra todos os altos oficiais e todos os povos
  rationale: “Contra” retoma a relação marcada por עַל, enquanto “povos” preserva o plural e o caráter multiétnico do império.
- source_word: אֲשֶׁר בְּכָל מְדִינוֹת
  choice: que vivem em todas as províncias
  rationale: A oração relativa situa os grupos por toda a extensão administrativa do império; “vivem” torna a relação locativa natural em português.
- source_word: מְדִינוֹת
  choice: províncias
  rationale: Termo português usual para as divisões administrativas imperiais em Ester.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuero
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do rei em Ester.
theological_decisions: []
