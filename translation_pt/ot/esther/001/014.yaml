id: EST.1.14
reference: Esther 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: pt
  text: E os mais próximos dele eram Carsena, Setar, Admata, Társis, Meres, Marsena e Memucã, os sete altos oficiais da Pérsia e da Média que viam o rosto do rei[a] e se sentavam nos primeiros lugares do reino.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “viam o rosto do rei”, expressão da corte persa que indica acesso direto à presença do rei.
    reason: cultural_note
  - marker: b
    text: Ou “ocupavam as posições mais elevadas no reino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: E os mais próximos dele eram
  rationale: Embora קָרוֹב esteja formalmente no singular, a expressão introduz coletivamente uma lista de sete cortesãos. O plural é natural em português e torna clara essa função, sem perder a ideia de proximidade ao rei.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: Carsena, Setar, Admata, Társis, Meres, Marsena e Memucã
  rationale: Os nomes próprios são transliterados em formas já reconhecíveis na tradição bíblica em português, com acentuação adequada à leitura moderna.
- source_word: שִׁבְעַת שָׂרֵי
  choice: os sete altos oficiais
  rationale: שָׂרֵי designa dignitários ou governantes de alta posição. “Altos oficiais” comunica a função cortesã sem sugerir necessariamente príncipes de sangue.
- source_word: פָּרַס וּמָדַי
  choice: da Pérsia e da Média
  rationale: A expressão identifica as duas partes do domínio imperial e segue a forma geográfico-política natural em português.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: que viam o rosto do rei
  rationale: A tradução conserva a imagem concreta do hebraico e sua linguagem cortesã; uma nota esclarece que se trata de acesso privilegiado à presença real.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: e se sentavam nos primeiros lugares do reino
  rationale: A formulação preserva a metáfora de assento e precedência do texto hebraico, ao mesmo tempo que soa compreensível em português. A nota registra o sentido administrativo possível.
theological_decisions: []
