  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: pt
  text: Quando o decreto[a] que o rei promulgar for ouvido em todo o seu reino — pois ele é vasto —, todas as mulheres darão honra[b] a seus maridos, do maior ao menor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “edito”. O termo hebraico se refere a um pronunciamento real oficial.
    reason: lexical_alternative
  - marker: b
    text: Ou “demonstrarão respeito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: Quando ... for ouvido
  rationale: O nifal de שׁמע expressa aqui a ideia passiva de o pronunciamento tornar-se conhecido. A construção temporal comunica naturalmente em português a circunstância que conduz ao resultado.
- source_word: פִּתְגָם
  choice: decreto
  rationale: No contexto da corte persa, o termo designa um pronunciamento oficial do rei. “Decreto” é formal, claro e corrente; “edito” permanece como alternativa lexical.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: que o rei promulgar
  rationale: Embora עשה costume significar “fazer”, em combinação com um pronunciamento real indica a emissão do ato oficial. “Promulgar” é natural em português e explicita essa colocação sem mudar seu sentido contextual.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: em todo o seu reino
  rationale: A expressão indica a extensão integral do domínio real. A formulação portuguesa é clara e preserva a abrangência do hebraico.
- source_word: כִּי רַבָּה הִיא
  choice: pois ele é vasto
  rationale: A oração explica a dimensão do reino. “Vasto” comunica sua grande extensão com mais precisão contextual que o genérico “grande”.
- source_word: וְכָל הַנָּשִׁים
  choice: todas as mulheres
  rationale: Mantém o plural genérico do hebraico; a referência posterior aos maridos esclarece que o contexto tem em vista mulheres casadas.
- source_word: יִתְּנוּ יְקָר
  choice: darão honra
  rationale: Reproduz de perto o idioma hebraico de atribuir honra ou valor, mantendo o tom formal da fala de Memucã. A alternativa mais idiomática “demonstrarão respeito” é registrada em nota.
- source_word: לְבַעְלֵיהֶן
  choice: a seus maridos
  rationale: Embora בעל também possa significar “senhor” ou “dono”, o contexto doméstico e a relação com “mulheres” indicam claramente “maridos”.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: do maior ao menor
  rationale: Preserva o modo proverbial e a amplitude social da expressão hebraica sem especificar além do texto o referente preciso da gradação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. “Promulgar” mantém o contexto jurídico da corte; os travessões isolam a explicação parentética sobre a extensão do reino. A expressão final foi mantida de forma concisa para preservar a formulação abrangente do hebraico.
