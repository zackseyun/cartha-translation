  source_fidelity: O texto preserva adequadamente a construção temporal-passiva de וְנִשְׁמַע, o caráter oficial de פִּתְגָם, a emissão futura do decreto, sua divulgação por todo o reino e a consequência expressa no hebraico. “Do maior ao menor” reproduz de modo conciso a fórmula abrangente לְמִגָּדוֹל וְעַד־קָטָן sem impor uma interpretação social mais específica.
