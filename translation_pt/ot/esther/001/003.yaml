base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: pt
  text: No terceiro ano do seu reinado, ele ofereceu um banquete[a] a todos os seus oficiais e servos — o exército[b] da Pérsia e da Média, os nobres e os oficiais das províncias — que estavam diante dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma festa”; o termo hebraico pode indicar um banquete marcado por bebida e celebração.
    reason: lexical_alternative
  - marker: b
    text: Ou “a força da Pérsia e da Média”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, na presença dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: No terceiro ano do seu reinado
  rationale: Expressão temporal natural em português, preservando a referência ao período do reinado.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: ofereceu um banquete
  rationale: A combinação verbal é idiomaticamente expressa como oferecer ou realizar um banquete; “ofereceu” se ajusta ao contexto régio e aos convidados.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: a todos os seus altos funcionários e servos
  rationale: שָׂרִים designa autoridades de posição elevada, enquanto עֲבָדִים, neste contexto cortesão, pode indicar servos ou agentes do rei sem exigir o sentido específico de escravos.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: O exército da Pérsia e da Média
  rationale: חֵיל pode significar força, poder ou contingente militar; “exército” comunica de modo direto o sentido militar provável, mantendo a alternativa em nota.
- source_word: הַפַּרְתְּמִים
  choice: os nobres
  rationale: O empréstimo persa designa membros de alta posição na aristocracia; “nobres” é claro e conciso.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: os altos funcionários das províncias
  rationale: Evita especificar em excesso um cargo como “governadores”, ao mesmo tempo que transmite a autoridade provincial.
- source_word: לְפָנָיו
  choice: estavam diante dele
  rationale: Preserva a imagem hebraica e expressa a presença formal dos dignitários perante o rei.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases reduz a ambiguidade sintática da longa enumeração sem alterar seus participantes; “altos funcionários” distingue שָׂרִים de servos e comunica a hierarquia cortesã.
