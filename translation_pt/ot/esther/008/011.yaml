  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: pt
  text: que o rei concedeu aos judeus que estavam em cada cidade o direito de se reunirem e de defenderem a própria vida, de destruir, matar e exterminar toda força armada de qualquer povo ou província que os atacasse[a], incluindo crianças e mulheres[b], e de saquear os bens deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que lhes fosse hostil”. O particípio hebraico pode designar os que agiam como inimigos contra eles; “que os atacasse” explicita esse sentido hostil no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “crianças e mulheres”. A formulação do decreto inclui explicitamente crianças e mulheres no grupo inimigo descrito.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: que o rei concedia ... o direito
  rationale: A oração relativa dá continuidade ao conteúdo do decreto. Em português, “concedia ... o direito” expressa naturalmente a autorização régia implícita em נָתַן.
- source_word: בְּכָל עִיר וָעִיר
  choice: de cada cidade
  rationale: A repetição distributiva hebraica enfatiza a abrangência total; “de cada cidade” transmite essa força com naturalidade.
- source_word: לְהִקָּהֵל
  choice: se reunirem
  rationale: O infinitivo nifal indica reunir-se em grupo; a forma reflexiva é clara e corrente em português.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: e defenderem a própria vida
  rationale: A expressão é literalmente “manter-se firmes por/sobre sua vida”. A tradução escolhida comunica em português natural sua força contextual de autodefesa, sem eliminar a referência explícita à vida.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: destruir, matar e exterminar
  rationale: Mantém os três verbos cumulativos e a severidade jurídica e violenta da formulação hebraica.
- source_word: כָּל חֵיל
  choice: toda força armada
  rationale: Neste contexto, חֵיל designa força militar ou grupo com capacidade de combate, e não riqueza.
- source_word: עַם וּמְדִינָה
  choice: de qualquer povo ou província
  rationale: A construção abrange grupos étnicos e unidades político-administrativas do império; “qualquer” explicita adequadamente seu alcance indefinido.
- source_word: הַצָּרִים אֹתָם
  choice: que os atacasse
  rationale: O particípio de צרר descreve quem age como inimigo ou hostiliza. “Que os atacasse” torna clara, no contexto do decreto, a ação hostil contra a qual se autoriza a defesa.
- source_word: טַף וְנָשִׁים
  choice: incluindo crianças e mulheres
  rationale: טַף refere-se às crianças ou aos dependentes. “Incluindo” mostra que a expressão pertence ao grupo inimigo visado, sem omitir a difícil abrangência do decreto.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: e de saquear os seus bens
  rationale: A formulação comunica a autorização de tomar como despojo os bens do grupo inimigo; “bens” evita em português a redundância pouco natural de “saquear o despojo”.
theological_decisions:
- issue: Linguagem de violência em um decreto real
  choice: Traduzir diretamente a autorização para destruir, matar, exterminar e saquear, preservando seu enquadramento defensivo.
  alternative: Abrandar a linguagem com termos como “derrotar” ou resumir tudo como simples autodefesa.
  rationale: O hebraico emprega três verbos violentos cumulativos e autoriza expressamente a tomada de bens. A tradução não deve suavizar essa severidade, mas a expressão sobre defender a vida e o particípio hostil preservam o contexto defensivo.
- issue: Alcance de “crianças e mulheres”
  choice: Apresentar crianças e mulheres como incluídas no grupo inimigo abrangido pelo decreto.
  alternative: Omitir, obscurecer ou reinterpretar a expressão de modo a retirar os não combatentes do alcance da ordem.
  rationale: A sintaxe associa naturalmente a expressão ao alvo da autorização. A tradução conserva de modo transparente a tensão moral do texto, sem tentar resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura jurídica do decreto foi mantida por meio da sequência de infinitivos, e a linguagem violenta não foi atenuada. Os pronomes possessivos foram formulados para evitar ambiguidade desnecessária.
