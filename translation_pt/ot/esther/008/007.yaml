base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: pt
  text: 'Então o rei Assuero disse à rainha Ester e a Mardoqueu, o judeu: “Vejam, dei a Ester a casa de Hamã, e ele foi pendurado no madeiro[a] porque atentou contra os judeus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na árvore” ou “na madeira”. O termo pode referir-se à estrutura de madeira usada para executar Hamã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: o rei Assuero
  rationale: Mantém o título e a forma portuguesa tradicional e reconhecível do nome.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: à rainha Ester
  rationale: Ordem natural em português moderno, preservando o título real.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: e a Mardoqueu, o judeu
  rationale: “Judeu” comunica naturalmente a identificação étnica no contexto de Ester; a aposição preserva a estrutura do hebraico.
- source_word: הִנֵּה
  choice: Vejam
  rationale: Conserva a função de chamar a atenção dos dois interlocutores, sem recorrer ao arcaizante “eis”.
- source_word: בֵית הָמָן
  choice: a casa de Hamã
  rationale: Reproduz de perto a expressão hebraica, que no contexto pode abranger a residência, os bens e a propriedade doméstica de Hamã.
- source_word: נָתַתִּי
  choice: dei
  rationale: O perfeito hebraico apresenta uma ação concluída; o pretérito perfeito é direto e idiomático em português.
- source_word: וְאֹתוֹ תָּלוּ
  choice: e ele foi pendurado
  rationale: O hebraico usa a terceira pessoa do plural com agente não especificado. A passiva natural em português mantém o agente indefinido.
- source_word: עַל הָעֵץ
  choice: no madeiro
  rationale: עֵץ pode designar árvore, madeira ou uma estrutura de madeira. “Madeiro” preserva a materialidade e evita determinar além do texto o formato exato do instrumento de execução.
- source_word: עַל אֲשֶׁר
  choice: porque
  rationale: A combinação introduz a causa da punição; “porque” é clara e natural.
- source_word: שָׁלַח יָדוֹ
  choice: atentou contra
  rationale: O idioma hebraico descreve uma ação hostil. “Atentou contra” transmite a intenção agressiva de Hamã sem sugerir necessariamente que ele atacou os judeus com as próprias mãos.
- source_word: בַּיְּהוּדִים
  choice: contra os judeus
  rationale: A preposição tem sentido hostil neste contexto, e “os judeus” é a designação étnica adequada e corrente.
