base_translation:
  language: en
  yaml_path: translation/ot/esther/008/016.yaml
  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: pt
  text: Para os judeus houve luz, alegria, júbilo e honra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os judeus tiveram luz, alegria, júbilo e honra”. A construção hebraica pode ser entendida tanto em sentido existencial (“houve”) quanto possessivo (“tiveram”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: Para os judeus
  rationale: O ל prefixado pode marcar referência ou posse. “Para os judeus” conserva naturalmente a construção hebraica e permite manter a formulação existencial, sem explicitar em excesso a ideia de posse.
- source_word: הָיְתָה
  choice: houve
  rationale: Com a expressão anteposta “para os judeus”, היה é expresso de modo idiomático por “houve”, preservando o sentido existencial simples.
- source_word: אוֹרָה
  choice: luz
  rationale: Mantém a imagem hebraica, que no contexto sugere libertação e bem-estar, sem substituí-la por uma interpretação abstrata.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: É um equivalente corrente e claro. Sua distinção do termo seguinte é preservada pelo uso de “júbilo” para שָׂשׂוֹן.
- source_word: שָׂשֹׂן
  choice: júbilo
  rationale: Comunica alegria intensa e festiva e preserva, em português natural, a acumulação de termos próximos sem repeti-los.
- source_word: יְקָר
  choice: honra
  rationale: No contexto, indica dignidade e estima pública concedidas aos judeus após a reviravolta de sua situação; “honra” expressa melhor essa dimensão social.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência coordenada e a metáfora da luz foram preservadas; “alegria” e “júbilo” distinguem os dois termos hebraicos próximos.
