  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: pt
  text: 'E ela disse: “Se parecer bem ao rei, se encontrei favor diante dele, se o assunto for apropriado diante do rei e se eu for agradável aos seus olhos, que se escreva para revogar[a] as cartas concebidas por Hamã[b], filho de Hamedata, o agagita, as quais ele escreveu para destruir os judeus que estão em todas as províncias do rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reverter as cartas”; o verbo hebraico pode significar “fazer voltar” ou, neste contexto administrativo, “revogar”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as cartas, o plano de Hamã”; a tradução “cartas concebidas por Hamã” explicita que elas incorporavam o plano dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Se parecer bem ao rei
  rationale: Reproduz com naturalidade a fórmula cortês da corte, mantendo seu tom formal e deferente.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: encontrei favor diante dele
  rationale: “Favor” expressa adequadamente חֵן em uma petição real, enquanto “diante dele” conserva a imagem do hebraico.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: se o assunto for apropriado aos olhos do rei
  rationale: “Apropriado” comunica o sentido de algo conveniente ou adequado; “assunto” permanece próximo do amplo דָּבָר.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: se eu for agradável aos seus olhos
  rationale: Mantém a imagem hebraica dos “olhos” e expressa aprovação pessoal sem reduzi-la à fórmula anterior sobre favor.
- source_word: יִכָּתֵב
  choice: que se escreva
  rationale: Preserva a forma passiva e o caráter formal da petição, sem acrescentar explicitamente “uma ordem”.
- source_word: לְהָשִׁיב
  choice: revogar
  rationale: No contexto administrativo, indica tornar sem efeito as cartas anteriores; a alternativa mais literal “reverter” permanece registrada em nota.
- source_word: הַסְּפָרִים
  choice: as cartas
  rationale: Em Ester, o termo designa comunicações oficiais enviadas pelas províncias do império; “cartas” é claro e tradicional.
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: concebidas por Hamã
  rationale: Integra naturalmente a construção hebraica, na qual as cartas incorporavam o plano de Hamã, sem eliminar a forma literal indicada em nota.
- source_word: לְאַבֵּד
  choice: destruir
  rationale: É uma equivalência direta e sóbria para o verbo causativo que descreve a intenção de levar os judeus à morte.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: os judeus que estão em todas as províncias do rei
  rationale: Preserva a oração relativa e o alcance distributivo de “todas”.
theological_decisions: []
translation_notes:
  register: Português atual, formal e inteligível, com cadência apropriada a uma petição diante do rei. A repetição deliberada de “rei” e a expressão “aos seus olhos” preservam a deferência e as imagens do hebraico.
