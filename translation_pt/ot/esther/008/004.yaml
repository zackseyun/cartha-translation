  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: pt
  text: Então o rei estendeu a Ester o cetro de ouro[a], e Ester se levantou e ficou de pé diante do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estendeu o cetro de ouro em direção a Ester”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: estendeu
  rationale: O verbo expressa o ato de estender ou dirigir algo a alguém. “Estendeu” é natural em português e adequado ao gesto cerimonial com o cetro.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: o cetro de ouro
  rationale: A expressão designa o cetro real feito de ouro ou caracterizado por ele. “O cetro de ouro” é claro, natural e preserva a determinação do objeto.
- source_word: וַתָּקָם
  choice: se levantou
  rationale: O verbo significa levantar-se. Essa formulação distingue naturalmente a ação inicial da postura expressa pelo verbo seguinte.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: ficou de pé diante do rei
  rationale: A expressão preserva tanto a ideia de permanecer em pé quanto o sentido de estar diante ou na presença do rei, com linguagem corrente e digna.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica de modo natural a sequência dos acontecimentos.
- source_word: לְאֶסְתֵּר
  choice: a Ester
  rationale: A preposição indica a pessoa em direção à qual o rei estendeu o cetro. Em português, “estendeu a Ester” é uma construção concisa e adequada.
