  text: הָ/רָצִ֞ים רֹכְבֵ֤י הָ/רֶ֨כֶשׁ֙ הָֽ/אֲחַשְׁתְּרָנִ֔ים יָֽצְא֛וּ מְבֹהָלִ֥ים וּ/דְחוּפִ֖ים בִּ/דְבַ֣ר הַ/מֶּ֑לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: pt
  text: Os mensageiros[a], montados nos cavalos reais, partiram depressa, impelidos pela ordem do rei. E o decreto foi promulgado na cidadela de Susã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os correios reais, montados nos animais de transporte do rei”; os termos hebraicos que identificam esses animais são raros, e seu sentido exato é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: os mensageiros
  rationale: Embora o termo esteja ligado literalmente a “corredores”, no contexto do sistema imperial persa designa os portadores oficiais das mensagens; “mensageiros” é claro e natural em português.
- source_word: רֹכְבֵי
  choice: montados
  rationale: O particípio descreve os mensageiros como cavaleiros; “montados” preserva a imagem de transporte a cavalo com fluidez.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: nos cavalos reais
  rationale: Os dois termos raros identificam animais de transporte seletos, provavelmente ligados ao serviço real. A tradução evita determinar com falsa precisão a espécie ou a linhagem, e a nota registra a incerteza.
- source_word: יָצְאוּ
  choice: partiram
  rationale: No contexto de enviados que iniciam uma missão, “partiram” expressa naturalmente o movimento de saída.
- source_word: מְבֹהָלִים וּדְחוּפִים
  choice: depressa, impelidos
  rationale: A formulação conserva tanto a urgência quanto a ideia de pressão externa, sem produzir uma coordenação pouco natural em português.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: pela ordem do rei
  rationale: דבר tem aqui o sentido administrativo de palavra ou ordem autorizada, e a preposição indica a causa que os impele.
- source_word: וְהַדָּת
  choice: e o decreto
  rationale: Em Ester, דת frequentemente designa um decreto imperial oficial; “decreto” é corrente e adequado ao contexto.
- source_word: נִתְּנָה
  choice: foi promulgado
  rationale: Embora o verbo signifique literalmente “foi dado”, no contexto administrativo refere-se à publicação oficial do decreto.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: na cidadela de Susã
  rationale: A construção portuguesa natural comunica que se trata da fortificação ou complexo palaciano de Susã.
