base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: pt
  text: 'em um só dia, em todas as províncias do rei Assuero: no dia treze do décimo segundo mês, isto é, o mês de adar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: em um só dia
  rationale: A preposição בְּ tem sentido temporal. “Em um só dia” preserva o numeral אֶחָד e, no contexto do decreto iniciado no versículo anterior, comunica naturalmente que a ação ocorreria numa única data.
- source_word: בְּכָל מְדִינוֹת
  choice: em todas as províncias
  rationale: מְדִינוֹת designa as divisões administrativas do império; a tradução locativa é direta e natural.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: do rei Assuero
  rationale: A construção identifica o soberano a quem pertenciam as províncias. “Assuero” é a forma tradicional e amplamente reconhecida em português para o nome hebraico אֲחַשְׁוֵרוֹשׁ.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: no dia treze
  rationale: O cardinal hebraico funciona como data. “No dia treze” é a formulação idiomática corrente em português.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: do décimo segundo mês
  rationale: A expressão literalmente numera o mês como “doze”; o ordinal é exigido pelo uso natural português em fórmulas de datação.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: isto é, o mês de adar
  rationale: הוּא tem aqui função explicativa ou apositiva, identificando pelo nome o décimo segundo mês. A preposição “de” corresponde ao uso idiomático português com nomes de meses.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. O fragmento mantém a continuidade gramatical com o versículo anterior. A expressão “em um só dia” ressalta a unidade da data sem acrescentar conteúdo. “Adar” aparece em minúscula conforme o uso ortográfico corrente para nomes de meses.
