  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: pt
  text: Pois como eu poderia suportar ver a desgraça que atingirá o meu povo? E como eu poderia suportar ver a destruição dos meus parentes?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a aniquilação do meu povo de nascimento” ou “dos meus conterrâneos”. O hebraico מוֹלַדְתִּי pode designar aqueles aos quais alguém está ligado por nascimento ou parentesco, e não apenas o lugar de nascimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do apelo de Ester no contexto anterior, preservando a força causal.
- source_word: אֵיכָכָה אוּכַל
  choice: como eu poderia suportar
  rationale: A pergunta retórica expressa incapacidade emocional, não mera possibilidade; “suportar” comunica isso naturalmente em português.
- source_word: וְרָאִיתִי
  choice: ver
  rationale: Depois de “poderia suportar”, o infinitivo é a construção idiomática natural em português e mantém a ideia de presenciar.
- source_word: בָּרָעָה
  choice: a desgraça
  rationale: Neste contexto, רָעָה indica calamidade ou dano sofrido, e não mal moral.
- source_word: אֲשֶׁר יִמְצָא
  choice: que atingirá
  rationale: O hebraísmo literalmente associado a “encontrar” significa aqui sobrevir ou atingir alguém.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Tradução direta que preserva a identificação de Ester com o povo judeu.
- source_word: בְּאָבְדַן
  choice: a destruição
  rationale: Mantém o sentido amplo do substantivo derivado de אבד, sem intensificá-lo necessariamente para “aniquilação”.
- source_word: מוֹלַדְתִּי
  choice: os meus parentes
  rationale: No contexto, designa os ligados a Ester por nascimento ou parentesco; a escolha evita entendê-lo apenas como lugar de nascimento.
