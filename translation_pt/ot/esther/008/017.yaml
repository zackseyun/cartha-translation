base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: pt
  text: 'Em toda e qualquer província e em toda e qualquer cidade, onde quer que chegassem a palavra do rei e o seu decreto, havia alegria e júbilo para os judeus: um banquete e um dia de festa. E muitos dentre os povos da terra tornavam-se judeus[a], pois o temor dos judeus havia caído sobre eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: declaravam-se judeus; o verbo hebraico pode indicar que assumiam ou professavam identidade judaica.'
    reason: Registra a amplitude semântica do raro verbo מִתְיַהֲדִים e evita resolver indevidamente se houve conversão religiosa plena ou identificação pública motivada pelo medo.
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה וּבְכָל עִיר וָעִיר
  choice: Em toda e qualquer província, e em toda e qualquer cidade
  rationale: A repetição distributiva hebraica enfatiza a totalidade. “Toda e qualquer” preserva essa ênfase de modo natural em português, sem reproduzir literalmente o pouco idiomático “província e província”.
- source_word: שִׂמְחָה וְשָׂשׂוֹן
  choice: alegria e júbilo
  rationale: Mantém o par de termos quase sinônimos e seu efeito cumulativo e celebrativo.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: banquetes e um dia de festa
  rationale: מִשְׁתֶּה designa uma celebração com comida e bebida; יוֹם טוֹב é literalmente um “dia bom”, aqui no sentido de dia festivo.
- source_word: מִתְיַהֲדִים
  choice: se faziam judeus
  rationale: O raro verbo denominativo indica que pessoas assumiam ou professavam identidade judaica. A formulação conserva a possível tensão entre conversão, identificação pública e motivação por medo.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: o medo dos judeus havia caído sobre eles
  rationale: Preserva a imagem hebraica de um medo que “cai” sobre alguém e mantém a referência aos judeus sem explicitação interpretativa desnecessária.
theological_decisions:
- issue: Natureza da identificação dos não judeus com o povo judeu
  choice: se faziam judeus
  alternative: convertiam-se ao judaísmo / declaravam-se judeus
  rationale: O texto não define o grau de convicção religiosa nem descreve um rito formal; além disso, atribui a ação ao medo. A tradução evita transformar essa identificação em uma conversão interior inequivocamente sincera.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. A construção “toda e qualquer” transmite a ênfase distributiva do hebraico; “júbilo”, “dia de festa” e “se faziam judeus” mantêm um tom narrativo elevado sem arcaísmo excessivo.
