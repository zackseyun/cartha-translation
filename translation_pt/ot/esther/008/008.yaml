source:
  edition: WLC
  text: וְ֠/אַתֶּם כִּתְב֨וּ עַל הַ/יְּהוּדִ֜ים כַּ/טּ֤וֹב בְּ/עֵֽינֵי/כֶם֙ בְּ/שֵׁ֣ם הַ/מֶּ֔לֶךְ וְ/חִתְמ֖וּ בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ כִּֽי כְתָ֞ב אֲשֶׁר נִכְתָּ֣ב בְּ/שֵׁם הַ/מֶּ֗לֶךְ וְ/נַחְתּ֛וֹם בְּ/טַבַּ֥עַת הַ/מֶּ֖לֶךְ אֵ֥ין לְ/הָשִֽׁיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: pt
  text: Mas vocês podem escrever a respeito dos judeus como lhes parecer melhor[a], em nome do rei, e selar o documento com o anel de sinete do rei, pois um documento escrito em nome do rei e selado com o anel de sinete do rei não pode ser revogado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como julgarem conveniente”. Literalmente, o hebraico diz “como for bom aos olhos de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não pode ser anulado”. A expressão hebraica indica que esse documento real não pode ser retirado nem desfeito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mas vocês
  rationale: A conjunção e o pronome explícito marcam contraste com a impossibilidade de revogar o decreto anterior. “Mas vocês” expressa naturalmente esse valor adversativo e preserva o plural.
- source_word: כִּתְבוּ
  choice: podem escrever
  rationale: Embora seja formalmente um imperativo plural, no contexto transmite autorização real. “Podem escrever” comunica essa permissão sem transformar a fala em obrigação.
- source_word: עַל הַיְּהוּדִים
  choice: a respeito dos judeus
  rationale: Preserva o sentido amplo da preposição, que introduz o assunto do documento, sem restringi-lo explicitamente a um decreto em favor deles.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: como lhes parecer melhor
  rationale: Expressa de modo natural em português a ideia idiomática de agir segundo o próprio juízo. A imagem hebraica literal, “bom aos seus olhos”, é registrada na nota.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: em nome do rei
  rationale: Equivalente corrente que preserva a forma lexical e comunica a autoridade real envolvida.
- source_word: וְחִתְמוּ
  choice: e selar o documento
  rationale: O objeto está implícito no hebraico e é explicitado como “o documento” para clareza em português.
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  choice: com o anel de sinete do rei
  rationale: Neste contexto administrativo, o termo designa o anel usado para imprimir o selo oficial. “Anel de sinete” mantém precisão histórica e funcional.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da autorização anterior de maneira concisa e adequada ao registro.
- source_word: כְתָב
  choice: um documento
  rationale: O substantivo designa genericamente algo escrito. “Documento” conserva essa amplitude, ao passo que “decreto” seria mais específico.
- source_word: אֲשֶׁר נִכְתָּב
  choice: escrito
  rationale: O particípio passivo integra uma máxima jurídica geral; a construção reduzida é natural em português e mantém o caráter atemporal.
- source_word: וְנַחְתּוֹם
  choice: e selado
  rationale: Mantém o paralelismo passivo com “escrito” de forma clara e concisa.
- source_word: אֵין לְהָשִׁיב
  choice: não pode ser revogado
  rationale: A expressão significa literalmente que não há como fazer o documento voltar, isto é, anulá-lo ou rescindi-lo. “Revogado” é preciso no contexto jurídico-administrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O tratamento plural “vocês” evita formas regionais ou excessivamente solenes. A formulação preserva o contraste, o caráter de autorização real e a generalidade de “documento”, enquanto as notas registram o idioma hebraico e a alternativa jurídica.
