base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: pt
  text: Então Ester tornou a falar diante do rei. Prostrou-se aos pés dele, chorou e lhe implorou que afastasse[a] o mal de Hamã, o agagita, e o plano que ele havia tramado contra os judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “removesse” ou “fizesse passar”; o verbo hebraico transmite a ideia de fazer com que o mal e o plano de Hamã passem ou sejam postos de lado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף ... וַתְּדַבֵּר
  choice: tornou a falar
  rationale: A construção com יסף e um verbo finito seguinte expressa repetição ou continuação. “Tornou a falar” comunica naturalmente que Ester falou de novo.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: Preserva tanto a dimensão espacial quanto o caráter formal da audiência real.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: Prostrou-se aos pés dele
  rationale: A expressão descreve uma queda física em postura de súplica; “prostrou-se aos pés dele” é natural em português e mantém a solenidade da cena.
- source_word: וַתֵּבְךְּ
  choice: chorou
  rationale: בכה designa chorar ou prantear; “chorou” é claro, atual e apropriado ao registro narrativo.
- source_word: וַתִּתְחַנֶּן לוֹ
  choice: lhe implorou
  rationale: O hitpael de חנן expressa súplica insistente por favor ou misericórdia. “Implorou” preserva a intensidade emocional e peticionária.
- source_word: לְהַעֲבִיר
  choice: afastasse
  rationale: O hiphil de עבר significa fazer passar, remover ou pôr de lado. “Afastasse” funciona naturalmente com “o mal” sem especificar além do hebraico o mecanismo jurídico pelo qual isso ocorreria.
- source_word: אֶת רָעַת הָמָן
  choice: o mal de Hamã
  rationale: רָעָה pode indicar maldade, dano ou calamidade. “O mal de Hamã” conserva essa amplitude e não funde a expressão com o “plano” mencionado em seguida.
- source_word: הָאֲגָגִי
  choice: o agagita
  rationale: Mantém a designação gentílica ou dinástica aplicada a Hamã.
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: e o plano que ele havia tramado
  rationale: A combinação do substantivo e do verbo da raiz חשב ressalta a elaboração deliberada. “Plano que havia tramado” evita uma repetição artificial e preserva a ideia de conspiração intencional.
- source_word: עַל הַיְּהוּדִים
  choice: contra os judeus
  rationale: No contexto hostil de uma trama, עַל tem sentido adversativo; “contra” explicita essa força de modo natural.
theological_decisions: []
