  text: וּ/מָרְדֳּכַ֞י יָצָ֣א מִ/לִּ/פְנֵ֣י הַ/מֶּ֗לֶךְ בִּ/לְב֤וּשׁ מַלְכוּת֙ תְּכֵ֣לֶת וָ/ח֔וּר וַ/עֲטֶ֤רֶת זָהָב֙ גְּדוֹלָ֔ה וְ/תַכְרִ֥יךְ בּ֖וּץ וְ/אַרְגָּמָ֑ן וְ/הָ/עִ֣יר שׁוּשָׁ֔ן צָהֲלָ֖ה וְ/שָׂמֵֽחָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: pt
  text: Mardoqueu saiu da presença do rei vestido com trajes reais azuis[a] e brancos, com uma grande coroa de ouro e um manto[b] de linho fino e púrpura; e a cidade de Susã exultou e se alegrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “azul-arroxeados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma veste envolvente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: saiu da presença do rei
  rationale: Expressa naturalmente o movimento para fora da audiência real e preserva o sentido cortesão da expressão hebraica, literalmente 'de diante do rei'.
- source_word: לְבוּשׁ מַלְכוּת
  choice: vestido com trajes reais
  rationale: Traduz o vestuário associado à realeza em português atual e digno, introduzindo naturalmente a descrição de cores e materiais.
- source_word: תְּכֵלֶת וָחוּר
  choice: azuis e brancos
  rationale: Mantém as duas cores em concordância com 'trajes'. תְּכֵלֶת designa um prestigioso corante azul ou azul-arroxeado, enquanto חוּר indica branco ou tecido branco.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: uma grande coroa de ouro
  rationale: Preserva o objeto, o material e sua imponência sem tornar 'grande' uma avaliação abstrata.
- source_word: תַכְרִיךְ
  choice: manto
  rationale: O termo indica uma peça envolvente de vestuário; 'manto' comunica melhor essa forma do que o mais genérico 'veste'.
- source_word: בּוּץ וְאַרְגָּמָן
  choice: linho fino e púrpura
  rationale: Conserva os materiais luxuosos e sua associação contextual com posição e honra.
- source_word: הָעִיר שׁוּשָׁן
  choice: a cidade de Susã
  rationale: Forma natural em português para identificar a cidade pelo nome, usando a grafia bíblica portuguesa amplamente reconhecida.
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: exultou e se alegrou
  rationale: Mantém dois verbos distintos. 'Exultou' comunica a manifestação intensa e possivelmente sonora de alegria, e 'se alegrou' preserva a segunda afirmação de contentamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução acompanha de perto a sequência hebraica, mas emprega concordância e construções naturais em português. As notas preservam incertezas lexicais reais relativas à tonalidade de תְּכֵלֶת e ao formato da peça chamada תַכְרִיךְ.
