revisions:
- from: Naquele mesmo dia, o rei Assuero deu à rainha Ester os bens de Hamã, o inimigo dos judeus. E Mardoqueu apresentou-se diante do rei, porque Ester havia revelado o parentesco que ele tinha com ela.
  to: Naquele dia, o rei Assuero deu à rainha Ester a propriedade de Hamã, o inimigo dos judeus. E Mardoqueu apresentou-se diante do rei, porque Ester havia revelado qual era sua relação com ela.
  rationale: A revisão substitui a explicitação interpretativa «parentesco» por «relação», que conserva a expressão idiomática hebraica e continua plenamente clara no contexto. «Propriedade» comunica o valor patrimonial de בֵּית neste contexto de transferência dos haveres de Hamã.
  reviewer_model: gpt-5.6-terra
