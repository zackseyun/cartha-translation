    issue: «o parentesco que ele tinha com ela» torna explícita uma relação familiar.
    rationale: 'Embora Mardoqueu seja de fato parente de Ester no contexto narrativo, a expressão hebraica é literalmente mais ampla: «o que ele era para ela». Uma formulação que fale de «relação» preserva a forma e a amplitude semântica do original.'
  revised_text: Naquele dia, o rei Assuero deu à rainha Ester a propriedade de Hamã, o inimigo dos judeus. E Mardoqueu apresentou-se diante do rei, porque Ester havia revelado qual era sua relação com ela.
