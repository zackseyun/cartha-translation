  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָתַ֞ן הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה אֶת בֵּ֥ית הָמָ֖ן צֹרֵ֣ר ה/יהודיים וּ/מָרְדֳּכַ֗י בָּ֚א לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ כִּֽי הִגִּ֥ידָה אֶסְתֵּ֖ר מַ֥ה הוּא לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: pt
  text: Naquele dia, o rei Assuero deu à rainha Ester a propriedade de Hamã, o inimigo dos judeus. E Mardoqueu apresentou-se diante do rei, porque Ester havia revelado qual era sua relação com ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: os bens de Hamã
  rationale: Aqui, בַּיִת designa a casa no sentido patrimonial — propriedades e bens pertencentes a Hamã —, não apenas sua residência física.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: o inimigo dos judeus
  rationale: צֹרֵר caracteriza Hamã como adversário ou opressor dos judeus; “inimigo” comunica naturalmente essa função no contexto.
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: apresentou-se diante do rei
  rationale: A expressão indica acesso à presença real, provavelmente com reconhecimento oficial; a tradução evita especificar um cargo que o versículo não nomeia.
- source_word: מַה הוּא לָהּ
  choice: o parentesco que ele tinha com ela
  rationale: A expressão idiomática pergunta literalmente “o que ele era para ela” e, no contexto de Ester 2:7, refere-se à relação familiar entre Mardoqueu e Ester.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Assuero” e “Mardoqueu” seguem as formas bíblicas tradicionais em português. A divisão em duas frases melhora a legibilidade sem alterar a ligação causal expressa por כִּי.
