base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: pt
  text: Ele escreveu em nome do rei Assuero, selou o documento com o anel-sinete do rei e enviou cartas por meio de mensageiros a cavalo, montados em corcéis reais provenientes de linhagem especial.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos usados nesta descrição dos cavalos são raros e de sentido incerto. Mais literalmente, a frase pode ser representada como “os corcéis, os achasteranim, filhos dos ramakim”, talvez uma referência a animais provenientes da coudelaria real ou destinados ao serviço postal do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Ele escreveu
  rationale: O wayyiqtol dá continuidade à sequência narrativa; o pretérito perfeito é a forma natural em português.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: em nome do rei Assuero
  rationale: A expressão בְּשֵׁם indica atuação sob a autoridade oficial do rei. “Assuero” é a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: selou o documento com o anel-sinete do rei
  rationale: O objeto singular implícito é entendido coletivamente como o documento ou decreto. “Anel-sinete” explicita a função de טַבַּעַת no contexto régio.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: e enviou cartas
  rationale: סְפָרִים designa aqui comunicações oficiais escritas; “cartas” é claro, natural e adequado ao contexto.
- source_word: בְּיַד הָרָצִים
  choice: por meio de mensageiros
  rationale: בְּיַד é uma expressão de agência, e הָרָצִים refere-se aos portadores oficiais da mensagem. “Mensageiros” é mais natural do que o literal “corredores” neste contexto equestre.
- source_word: בַּסּוּסִים רֹכְבֵי
  choice: montados em cavalos
  rationale: A formulação reúne de modo natural em português a referência explícita aos cavalos e o particípio “os que cavalgavam”.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: os corcéis reais criados de linhagem selecionada
  rationale: Os três termos formam uma descrição difícil, com dois vocábulos raros e de sentido incerto. A tradução comunica animais especiais ligados ao serviço ou criadouro real, sem reproduzir uma sequência opaca de transliterações nem afirmar uma identificação zoológica excessivamente precisa.
