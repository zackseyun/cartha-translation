  source_fidelity: A tradução preserva adequadamente a sequência narrativa, a autoridade do nome e do sinete real, o envio de cartas e o papel dos mensageiros. A descrição final dos animais é reconhecidamente incerta e a nota registra essa incerteza. Contudo, “linhagem selecionada” introduz uma qualificação mais específica do que o hebraico permite afirmar com segurança.
  naturalness: 'O texto é claro e de registro adequado, mas “os corcéis reais criados de linhagem selecionada” soa pouco idiomático em português: animais não são normalmente descritos como “criados de linhagem”. “Provenientes de linhagem selecionada” é mais natural.'
  terminology: “Assuero”, “anel-sinete”, “cartas” e “mensageiros” são escolhas apropriadas. “Corcéis reais” comunica de maneira prudente o contexto cortesão, desde que a nota mantenha explícita a incerteza dos termos raros.
