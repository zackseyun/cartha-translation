  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: pt
  text: Uma cópia do documento deveria ser promulgada como lei em cada província[a] e tornada pública[b] a todos os povos, para que os judeus estivessem preparados para aquele dia[c], a fim de se vingarem de seus inimigos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em cada província e província”, expressão distributiva que significa “em cada uma das províncias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “publicada” ou “exposta abertamente”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico, literalmente: “para este dia”, isto é, para a data determinada.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “tomarem vingança de seus inimigos”. Algumas traduções trazem “se defenderem”, mas o verbo hebraico significa especificamente “vingar-se” ou “tomar vingança”.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: uma cópia do documento
  rationale: O empréstimo persa פַּתְשֶׁגֶן designa uma cópia ou transcrição oficial, enquanto הַכְּתָב é o texto escrito; “documento” comunica com naturalidade o referente administrativo sem confundi-lo com o exemplar original.
- source_word: לְהִנָּתֵן דָּת
  choice: deveria ser promulgada como lei
  rationale: A construção expressa a emissão oficial do texto com força legal. “Promulgada como lei” preserva essa função administrativa em português claro e digno.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: em cada província
  rationale: A repetição hebraica é distributiva (“província e província”); o português natural exprime o mesmo alcance com “cada província”, registrando-se a forma literal em nota.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: tornada pública a todos os povos
  rationale: גָּלוּי indica algo aberto ou publicamente divulgado. “Povos” mantém o plural étnico de עַמִּים no contexto do império persa.
- source_word: וְלִהְיוֹת הַיְּהוּדִים עֲתוּדִים
  choice: para que os judeus estivessem preparados
  rationale: A construção infinitiva comunica a finalidade do decreto, e עֲתוּדִים significa “prontos” ou “preparados”. “Judeus” designa adequadamente o povo na diáspora persa.
- source_word: לַיּוֹם הַזֶּה
  choice: para aquele dia
  rationale: A expressão é literalmente “para este dia”, mas, no fluxo narrativo, aponta para a data já determinada no decreto; “aquele dia” evita sugerir o dia presente da narração.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: a fim de se vingarem de seus inimigos
  rationale: O nifal de נקם significa vingar-se ou tomar vingança. A formulação preserva essa força lexical e não a reduz interpretativamente a mera defesa.
theological_decisions:
- issue: Possível atenuação da linguagem de vingança
  choice: a fim de se vingarem de seus inimigos
  alternative: a fim de se defenderem de seus inimigos
  rationale: Embora o contexto mais amplo envolva autoproteção, נקם neste versículo denota especificamente vingança. A tradução mantém a tensão moral e teológica do texto sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe administrativa foi mantida sem reproduzir de modo artificial a repetição distributiva hebraica; as alternativas literais e a nuance da linguagem de vingança foram preservadas nas notas.
