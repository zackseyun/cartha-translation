  text: וַ/יִּקָּרְא֣וּ סֹפְרֵֽי הַ/מֶּ֣לֶךְ בָּֽ/עֵת הַ֠/הִיא בַּ/חֹ֨דֶשׁ הַ/שְּׁלִישִׁ֜י הוּא חֹ֣דֶשׁ סִיוָ֗ן בִּ/שְׁלוֹשָׁ֣ה וְ/עֶשְׂרִים֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה מָרְדֳּכַ֣י אֶל הַ/יְּהוּדִ֡ים וְ/אֶ֣ל הָ/אֲחַשְׁדַּרְפְּנִֽים וְ/הַ/פַּחוֹת֩ וְ/שָׂרֵ֨י הַ/מְּדִינ֜וֹת אֲשֶׁ֣ר מֵ/הֹ֣דּוּ וְ/עַד כּ֗וּשׁ שֶׁ֣בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשֹׁנ֑/וֹ וְ/אֶ֨ל הַ/יְּהוּדִ֔ים כִּ/כְתָבָ֖/ם וְ/כִ/לְשׁוֹנָֽ/ם־־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: pt
  text: 'Naquele tempo, os escribas do rei foram convocados, no terceiro mês, isto é, o mês de sivã, no vigésimo terceiro dia do mês. E foi escrito conforme tudo o que Mardoqueu ordenou: aos judeus, aos sátrapas, aos governadores e aos oficiais das províncias — cento e vinte e sete províncias, da Índia até Cuxe[a] —, a cada província em sua própria escrita, a cada povo em sua própria língua e aos judeus em sua própria escrita e em sua própria língua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a Etiópia”. O hebraico traz “Cuxe”, um antigo nome geográfico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: os escribas do rei foram convocados
  rationale: O nifal expressa sentido passivo; “foram convocados” comunica naturalmente o chamado oficial dos escribas no contexto da corte.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Representa explicitamente a expressão temporal hebraica e funciona de modo natural na abertura narrativa.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  choice: no terceiro mês, isto é, o mês de sivã
  rationale: Preserva a aposição explicativa e translitera o nome antigo do mês em forma legível em português.
- source_word: בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: no vigésimo terceiro dia do mês
  rationale: Explicita o referente pronominal, sem alterar o sentido, e evita uma formulação rígida como “no vigésimo terceiro dia dele”.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: Escreveu-se tudo conforme Mordecai havia ordenado
  rationale: A construção impessoal preserva o passivo hebraico; “tudo conforme” representa a abrangência de כְּכָל sem impor a ideia adicional de redação palavra por palavra.
- source_word: הָאֲחַשְׁדַּרְפְּנִים וְהַפַּחוֹת וְשָׂרֵי הַמְּדִינוֹת
  choice: aos sátrapas, aos governadores e aos oficiais das províncias
  rationale: Usa o equivalente histórico consagrado para o primeiro cargo e termos administrativos claros e distintos para os demais.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: da Índia até Cuxe
  rationale: “Índia” é a identificação convencional de הֹדּוּ; “Cuxe” conserva o antigo nome geográfico sem equipará-lo de maneira simplista à Etiópia moderna.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: a cada província em sua própria escrita, a cada povo em sua própria língua
  rationale: Reproduz a distribuição individual enfatizada pelas expressões hebraicas repetidas e distingue escrita de língua.
