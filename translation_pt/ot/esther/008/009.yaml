revisions:
- from: 'Naquele tempo, os escribas do rei foram convocados, no terceiro mês, isto é, o mês de sivã, no vigésimo terceiro dia do mês. Escreveu-se tudo conforme Mordecai havia ordenado: aos judeus, aos sátrapas, aos governadores e aos oficiais das províncias que se estendiam da Índia até Cuxe[a] — cento e vinte e sete províncias —, a cada província em sua própria escrita, a cada povo em sua própria língua, e aos judeus em sua própria escrita e em sua própria língua.'
  to: 'Naquele tempo, os escribas do rei foram convocados, no terceiro mês, isto é, o mês de sivã, no vigésimo terceiro dia do mês. E foi escrito conforme tudo o que Mardoqueu ordenou: aos judeus, aos sátrapas, aos governadores e aos oficiais das províncias — cento e vinte e sete províncias, da Índia até Cuxe[a] —, a cada província em sua própria escrita, a cada povo em sua própria língua e aos judeus em sua própria escrita e em sua própria língua.'
  rationale: A revisão torna inequívoca a voz passiva de וַיִּכָּתֵב, explicita a abrangência de כְּכָל אֲשֶׁר e reposiciona a indicação geográfica e o número das províncias como aposição ao conjunto administrativo. «Mardoqueu» adota a forma portuguesa corrente do nome. A nota foi reduzida ao necessário para a alternativa «Etiópia».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:03:11Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a convocação dos escribas, a data, a cadeia administrativa, a extensão imperial, o total de 127 províncias e a distribuição por escrita e língua. Contudo, «Escreveu-se tudo» pode ser lido como construção ativa impessoal e «províncias que se estendiam» torna a relação geográfica menos direta do que a enumeração hebraica.
  naturalness: O texto é geralmente claro e de registro apropriado. A revisão melhora a construção passiva e organiza a aposição «cento e vinte e sete províncias» sem sugerir indevidamente que as províncias, como unidades individuais, se estendiam da Índia a Cuxe.
  terminology: «Escribas», «sátrapas», «governadores», «oficiais», «Índia» e «Cuxe» são escolhas adequadas. A nota conserva corretamente Cuxe como topônimo antigo e apresenta «Etiópia» somente como alternativa tradicional.
  issues:
  - severity: medium
    issue: «Escreveu-se tudo conforme Mordecai havia ordenado»
    rationale: Embora possível, a construção com «se» é normalmente entendida em português como impessoal ativa; ela não expressa de modo tão claro o passivo hebraico וַיִּכָּתֵב. Além disso, «tudo conforme» é menos explícito que «conforme tudo o que» para כְּכָל אֲשֶׁר.
  - severity: low
    issue: «as províncias que se estendiam da Índia até Cuxe»
    rationale: O hebraico caracteriza o conjunto das províncias pela extensão «da Índia até Cuxe» e logo informa o seu número. A formulação atual pode sugerir que cada província se estendia por toda essa distância. Uma aposição preserva melhor a estrutura e o sentido.
  - severity: low
    issue: Explicação geográfica excessivamente específica na nota
    rationale: «Associado sobretudo à região ao sul do Egito» é informação interpretativa desnecessária para a alternativa lexical. Uma nota mais sucinta preserva o topônimo antigo sem delimitação geográfica adicional.
  revised_text: 'Naquele tempo, os escribas do rei foram convocados, no terceiro mês, isto é, o mês de sivã, no vigésimo terceiro dia do mês. E foi escrito conforme tudo o que Mardoqueu ordenou: aos judeus, aos sátrapas, aos governadores e aos oficiais das províncias — cento e vinte e sete províncias, da Índia até Cuxe[a] —, a cada província em sua própria escrita, a cada povo em sua própria língua e aos judeus em sua própria escrita e em sua própria língua.'
  revised_footnotes:
  - marker: a
    text: 'Ou: “até a Etiópia”. O hebraico traz “Cuxe”, um antigo nome geográfico.'
    reason: lexical_alternative
  revision_rationale: A revisão torna inequívoca a voz passiva de וַיִּכָּתֵב, explicita a abrangência de כְּכָל אֲשֶׁר e reposiciona a indicação geográfica e o número das províncias como aposição ao conjunto administrativo. «Mardoqueu» adota a forma portuguesa corrente do nome. A nota foi reduzida ao necessário para a alternativa «Etiópia».
