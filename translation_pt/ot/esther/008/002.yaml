base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: pt
  text: Então o rei tirou seu anel de sinete, que havia tomado de Hamã, e o deu a Mardoqueu. Ester pôs Mardoqueu à frente da casa de Hamã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a família de Hamã” ou “as propriedades de Hamã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: tirou
  rationale: O hifil de סוּר indica fazer algo sair ou remover. No contexto de um anel que o rei portava, “tirou” é natural e preciso.
- source_word: טַבַּעְתּוֹ
  choice: o seu anel-sinete
  rationale: טַבַּעַת pode designar um anel em geral, mas, no contexto da corte persa em Ester, trata-se do anel real usado para autenticar decretos. “Anel-sinete” explicita essa função sem ampliar indevidamente o sentido.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: que havia tomado de Hamã
  rationale: O hifil de עבר pode significar remover, retirar ou transferir. “Havia tomado de Hamã” expressa com naturalidade a retirada anterior do anel após a queda de Hamã.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: e o deu a Mardoqueu
  rationale: נתן tem o sentido comum de “dar”; o sufixo feminino hebraico retoma טַבַּעַת, “anel”, que em português é masculino.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: Ester pôs Mardoqueu à frente de
  rationale: שׂוּם com עַל pode indicar colocar ou constituir alguém sobre uma área de responsabilidade. “Pôs ... à frente de” transmite o sentido administrativo em português corrente sem tornar explícito mais do que o hebraico.
- source_word: בֵּית הָמָן
  choice: a casa de Hamã
  rationale: בַּיִת pode referir-se à casa, à família ou ao conjunto dos bens e servos. A formulação literal e natural “casa de Hamã” preserva essa amplitude, esclarecida em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos correntes no uso brasileiro. O marcador foi colocado após “casa de Hamã”, pois a nota corresponde à ambiguidade de בֵּית הָמָן, e não a “anel-sinete”.
