base_translation:
  language: en
  yaml_path: translation/ot/esther/004/009.yaml
  text: So Hathach came and told Esther the words of Mordecai[a].
translation:
  language: pt
  text: Então Hataque voltou e contou a Ester as palavras de Mardoqueu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a mensagem de Mardoqueu» ou «o que Mardoqueu disse». Em hebraico, literalmente, «as palavras de Mardoqueu».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֖וֹא
  choice: voltou
  rationale: O verbo בוא pode significar «vir», «ir» ou «chegar». No contexto, Hataque retorna a Ester depois de falar com Mardoqueu; «voltou» torna esse movimento claro e natural em português.
- source_word: הֲתָ֑ךְ
  choice: Hataque
  rationale: Nome próprio transliterado conforme a forma tradicional e reconhecível em português.
- source_word: וַיַּגֵּ֣ד
  choice: transmitiu
  rationale: O hifil de נגד significa «fazer saber, contar, relatar». «Transmitiu» combina naturalmente com «as palavras» e descreve Hataque comunicando a mensagem, sem acrescentar solenidade indevida.
- source_word: לְאֶסְתֵּ֔ר
  choice: a Ester
  rationale: A preposição לְ marca o destinatário; em português, «transmitiu a Ester» expressa naturalmente essa função.
- source_word: אֵ֖ת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico do objeto direto definido, sem conteúdo lexical independente em português.
- source_word: דִּבְרֵ֥י
  choice: as palavras de
  rationale: Plural construto de דָּבָר. A tradução preserva de modo natural a expressão hebraica e sua possível abrangência sem reduzi-la apenas a «mensagem».
- source_word: מָרְדֳּכָֽי
  choice: Mardoqueu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Voltou» recupera o movimento indicado pelo contexto, e «transmitiu» evita a construção pouco natural «contou... as palavras», preservando a relação com a formulação hebraica.
