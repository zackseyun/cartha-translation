  yaml_path: translation/ot/esther/004/010.yaml
  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: pt
  text: Então Ester falou a Hataque e ordenou-lhe que fosse até Mordecai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Então Ester disse a Hataque e ordenou-lhe a Mordecai”. O hebraico dá a entender que ela instruiu Hataque a ir até Mordecai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então Ester falou
  rationale: O wayyiqtol faz a narrativa avançar, por isso וַ é traduzido por “Então”. Embora אמר tenha normalmente o sentido de “dizer”, “falou a” é natural neste contexto e introduz adequadamente a ordem que vem em seguida.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לַהֲתָךְ
  choice: a Hataque
  rationale: A preposição ל marca o destinatário da fala. “Hataque” segue a forma tradicional do nome em português.
- source_word: וַתְּצַוֵּהוּ
  choice: e ordenou-lhe
  rationale: O piel de צוה expressa uma ordem ou incumbência. “Ordenou-lhe” preserva a força verbal, e o pronome retoma Hataque.
- source_word: אֶל
  choice: que fosse até
  rationale: 'A preposição אֶל indica direção, literalmente “a/para”. Depois de “ordenou-lhe”, explicita-se idiomaticamente em português o movimento implícito: “que fosse até” Mordecai.'
- source_word: מָרְדֳּכָי
  choice: Mordecai
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
