  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: pt
  text: Então Mardoqueu foi embora e fez tudo conforme Ester lhe havia ordenado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seguiu adiante» ou «passou adiante»; o verbo hebraico significa literalmente «passar» ou «atravessar», mas aqui provavelmente se refere à partida de Mardoqueu para cumprir as instruções de Ester.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: foi embora
  rationale: O verbo עבר tem o sentido amplo de passar ou atravessar; neste contexto narrativo, indica naturalmente que Mardoqueu partiu para cumprir as instruções de Ester.
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Reproduz de modo direto o verbo comum עשה e preserva o estilo narrativo simples do hebraico.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo conforme
  rationale: Expressa tanto a abrangência de כֹּל quanto a conformidade da ação de Mardoqueu com a ordem recebida, em português natural.
- source_word: צִוְּתָה
  choice: havia ordenado
  rationale: O verbo צוה significa ordenar ou dar uma ordem. O mais-que-perfeito composto deixa clara, com naturalidade, a anterioridade da ordem de Ester.
- source_word: עָלָיו
  choice: lhe
  rationale: Com צוה, a preposição על marca a pessoa que recebe a ordem; o pronome indireto «lhe» é idiomático em português.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
