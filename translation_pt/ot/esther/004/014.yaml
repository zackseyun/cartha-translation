source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you keep silent at this time[a], relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have attained royalty for a time like this?
translation:
  language: pt
  text: Pois, se você ficar calada neste momento, alívio e livramento surgirão para os judeus de outro lugar; mas você e a casa de seu pai perecerão. E quem sabe se foi para um momento como este[a] que você chegou à realeza?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais tradicional: “para um tempo como este”.'
    reason: Alternativa lexical para לְעֵת כָּזֹאת, preservando uma formulação tradicional mais literal.
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Introduz uma explicação condicional ligada ao contexto anterior, preservando tanto o valor explicativo quanto a condição em português natural.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: você ficar calada
  rationale: A construção intensiva indica persistência ou ênfase no silêncio. A formulação é idiomática e concorda com Ester, sem reproduzir artificialmente a repetição hebraica.
- source_word: בָּעֵת הַזֹּאת
  choice: neste momento
  rationale: Refere-se à crise presente. “Neste momento” comunica a urgência contextual com naturalidade.
- source_word: רֶוַח וְהַצָּלָה
  choice: alívio e livramento
  rationale: 'Mantém os dois substantivos: רֶוַח como alívio ou trégua diante do perigo, e הַצָּלָה como resgate da destruição ameaçada.'
- source_word: יַעֲמוֹד
  choice: surgirão
  rationale: Embora o verbo signifique literalmente “ficar de pé”, neste uso indica que o auxílio aparecerá ou se levantará; o plural concorda naturalmente com os dois substantivos em português.
- source_word: לַיְּהוּדִים
  choice: para os judeus
  rationale: No contexto de Ester, designa o povo judeu na diáspora persa; esta é a forma convencional e clara em português.
- source_word: מִמָּקוֹם אַחֵר
  choice: de outro lugar
  rationale: Preserva a expressão deliberadamente indefinida e não explicita a fonte do livramento.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: mas você e a casa de seu pai
  rationale: “Casa de seu pai” conserva a expressão hebraica de parentesco e sua dimensão familiar e dinástica, permanecendo compreensível.
- source_word: תֹּאבֵדוּ
  choice: perecerão
  rationale: Abrange tanto morte quanto ruína, preservando a amplitude e a solenidade da advertência.
- source_word: וּמִי יוֹדֵעַ
  choice: E quem sabe
  rationale: Mantém a possibilidade retórica aberta, sem transformá-la em certeza.
- source_word: אִם לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת
  choice: se não foi para um momento como este que você chegou à realeza
  rationale: Em pergunta retórica, “se não foi” expressa em português natural a possibilidade sugerida por אִם, sem convertê-la em afirmação categórica. “Chegou à realeza” preserva o sentido de alcançar a condição régia.
theological_decisions:
- issue: Providência implícita em “de outro lugar” e “para um momento como este”
  choice: Manter a formulação indireta sem mencionar Deus explicitamente
  alternative: Explicitar “da parte de Deus” ou qualificar o momento como providencial
  rationale: O hebraico sugere fortemente a providência divina, mas não nomeia Deus. A tradução preserva essa tensão e não torna explícito o que o texto deixa implícito.
- issue: Grau de certeza na pergunta final
  choice: 'Preservar a pergunta retórica como possibilidade: “quem sabe se não foi...”'
  alternative: Apresentar como declaração certa de propósito divino
  rationale: A expressão וּמִי יוֹדֵעַ אִם não afirma diretamente o propósito; ela o propõe como possibilidade significativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. A sintaxe busca fluidez brasileira sem regionalismos marcados. Mantêm-se “livramento”, “perecerão”, “casa de seu pai” e “realeza” para conservar a gravidade e os contornos do hebraico.
