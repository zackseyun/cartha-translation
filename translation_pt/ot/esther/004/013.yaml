  source_fidelity: 'A formula de transmissão צריך ser mantida sem transformar o verbo אמר (“disse”) em uma ordem explícita (“mandou”). A advertência final tem valor comparativo: Ester não escapará mais do que os demais judeus. A revisão preserva essa relação sem introduzir uma causalidade que o hebraico apenas pode deixar implícita.'
