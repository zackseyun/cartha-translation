  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: pt
  text: 'Então Mardoqueu disse que respondessem a Ester: “Não pense que, no palácio do rei, você escapará mais do que todos os outros judeus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: Então Mardoqueu mandou que respondessem a Ester
  rationale: A construção hebraica é literalmente ‘Mardoqueu disse para responder a Ester’. Em português, ‘mandou que respondessem’ expressa com naturalidade a instrução de transmitir-lhe a resposta, sem acrescentar um referente específico ausente do texto.
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: Não pense
  rationale: A expressão idiomática significa imaginar ou supor consigo mesma. ‘Não pense’ é direta, atual e preserva o sentido.
- source_word: לְהִמָּלֵט בֵּית־הַמֶּלֶךְ
  choice: por estar no palácio do rei ... escapará
  rationale: ‘Palácio do rei’ comunica naturalmente a casa ou residência real neste contexto. A formulação explicita a relação contextual entre sua posição ali e sua expectativa de escapar.
- source_word: מִכָּל־הַיְּהוּדִים
  choice: só você escapará entre todos os judeus
  rationale: A preposição comparativa/separativa permite a ideia de escapar mais que, ou à parte de, todos os demais judeus. A tradução transmite a advertência de que Ester não seria a única exceção.
theological_decisions:
- issue: A condição de Ester na casa real como possível garantia de livramento
  choice: por estar no palácio do rei, só você escapará
  alternative: escapará no palácio do rei mais do que todos os judeus
  rationale: A opção escolhida torna clara a força retórica sem afirmar qualquer mecanismo providencial não expresso neste versículo. A tensão sobre como virá o livramento permanece para o versículo seguinte.
translation_notes:
  register: Português moderno, digno e acessível, com ‘Mardoqueu’ e ‘Ester’ nas formas bíblicas correntes. A ordem foi ajustada para fluência, preservando a advertência enfática do hebraico.
