lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O wayyiqtol de יצא relata uma ação passada e conserva a ideia de sair do local onde Ester estava.
- source_word: הֲתָךְ
  choice: Hataque
  rationale: Transliteração portuguesa clara do nome hebraico, em forma corrente nas traduções bíblicas em português.
- source_word: אֶל מָרְדֳּכָי
  choice: ao encontro de Mardoqueu
  rationale: Neste contexto narrativo, אֶל indica o destino pessoal de Hataque; a expressão evita a possível leitura de que o segundo אֶל introduza outro destino independente.
- source_word: אֶל רְחוֹב הָעִיר
  choice: na praça da cidade
  rationale: רְחוֹב designa aqui um espaço público amplo e aberto; «praça» comunica isso naturalmente em português, sem sugerir uma rua moderna.
- source_word: אֲשֶׁר לִפְנֵי
  choice: que ficava diante de
  rationale: Expressa de modo natural a localização espacial indicada pela oração relativa hebraica.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: o portão do rei
  rationale: Reproduz diretamente a relação de construção e mantém a designação recorrente desse lugar no livro.
