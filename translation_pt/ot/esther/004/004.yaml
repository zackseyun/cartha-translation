revisions:
- from: As jovens que serviam Ester e os eunucos dela vieram e lhe contaram[a], e a rainha ficou profundamente abalada. Então ela enviou roupas para vestir Mordecai e tirar dele a roupa de pano de saco[b], mas ele não as aceitou.
  to: As jovens de Ester e seus eunucos vieram e lhe contaram[a][b], e a rainha ficou profundamente abalada. Então ela enviou roupas para vestir Mordecai e tirar dele a roupa de pano de saco[c], mas ele não as aceitou.
