  source_fidelity: 'O texto reproduz adequadamente a sequência hebraica: as jovens de Ester e seus eunucos lhe comunicam a notícia; a rainha fica intensamente perturbada; ela manda roupas para Mordecai, a fim de que ele deixe sua veste de pano de saco; ele as recusa. “Eunucos” é uma tradução historicamente bem fundamentada para סָרִיסֶיהָ neste contexto palaciano, sem eliminar a possibilidade lexical mais ampla indicada em nota.'
  naturalness: 'Há uma correção gramatical necessária: o pretérito perfeito plural de “vir” é “vieram” apenas na forma? Em português padrão, “vieram” é de fato o pretérito perfeito plural; portanto o texto está gramatical neste ponto. Contudo, “as jovens que serviam Ester e os eunucos dela” é um pouco explicativo e menos direto que “as jovens de Ester e seus eunucos”. A revisão proposta torna a frase mais fluente e conserva o vínculo de posse/contexto sem acrescentar a função de serviço ao corpo do texto.'
  terminology: “Pano de saco” e “eunucos” são termos adequados e claros com notas breves. “Roupa de pano de saco” comunica corretamente que se trata da veste específica de luto. A nota sobre eunucos preserva a nuance de que o termo pode, em certos usos, abranger oficiais da corte.
