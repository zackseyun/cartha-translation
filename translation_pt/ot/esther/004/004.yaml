base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: pt
  text: As jovens de Ester e seus eunucos vieram e lhe contaram[a][b], e a rainha ficou profundamente abalada. Então ela enviou roupas para vestir Mordecai e tirar dele a roupa de pano de saco[c], mas ele não as aceitou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as jovens assistentes de Ester”.'
    reason: lexical_alternative
  - marker: b
    text: “Eunucos” também pode, em alguns contextos, referir-se a oficiais da corte; neste contexto palaciano, o sentido mais específico é provável.
    reason: cultural_note
  - marker: c
    text: O pano de saco era um tecido áspero usado como sinal de luto, aflição ou humilhação.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת אֶסְתֵּר
  choice: as jovens que serviam Ester
  rationale: נַעֲרוֹת designa jovens mulheres e, no contexto palaciano, elas são servidoras de Ester. A formulação conserva a referência à idade e explicita naturalmente sua função, sem recorrer ao termo potencialmente ambíguo “servas”.
- source_word: וְסָרִיסֶיהָ
  choice: e os eunucos dela
  rationale: סָרִיס designa mais especificamente eunucos em ambientes de corte, embora possa por vezes referir-se de modo mais amplo a oficiais. “Eunucos” preserva a designação histórica mais provável no palácio persa.
- source_word: וַיַּגִּידוּ לָהּ
  choice: vieram e lhe contaram
  rationale: A tradução mantém tanto o movimento narrativo expresso por וַתָּבוֹאינָה quanto o ato de comunicar a notícia, em português corrente.
- source_word: וַתִּתְחַלְחַל ... מְאֹד
  choice: ficou profundamente abalada
  rationale: O verbo descreve agitação intensa, possivelmente com a ideia concreta de estremecer. “Profundamente abalada” comunica a força emocional sem excluir essa intensidade.
- source_word: בְּגָדִים
  choice: roupas
  rationale: “Roupas” é atual, claro e natural em português, mantendo o contraste com a roupa áspera de luto.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: para vestir Mordecai
  rationale: Preserva de modo direto a construção de propósito e o sentido causativo do infinitivo hebraico.
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: e tirar dele a roupa de pano de saco
  rationale: A expressão reproduz a ação concreta de remover a veste de luto. “Roupa de pano de saco” é mais imediatamente compreensível do que apenas “pano de saco” e conserva o referente cultural específico.
- source_word: וְלֹא קִבֵּל
  choice: mas ele não as aceitou
  rationale: O objeto está implícito no hebraico e é retomado em português pelo pronome feminino plural, referindo-se às roupas enviadas. “Não aceitou” expressa claramente a recusa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução mantém o vocabulário histórico da corte e explica o pano de saco em nota, evitando arcaísmos. A possibilidade de סָרִיס significar mais amplamente “oficial da corte” foi considerada, mas o sentido específico “eunuco” é o mais provável neste contexto.
