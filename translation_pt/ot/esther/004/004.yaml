  - severity: low
    issue: Falta de nota para “eunucos”
    rationale: Como o termo hebraico pode em alguns contextos designar oficiais da corte, uma nota cultural breve mantém a precisão histórica e a ambiguidade lexical sem alterar a tradução principal.
