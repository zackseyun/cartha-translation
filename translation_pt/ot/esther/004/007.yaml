- from: Mordecai contou a ele tudo o que lhe havia acontecido e informou a quantia exata que Hamã tinha dito que depositaria, a peso, nos tesouros do rei para destruir os judeus.
  to: Mordecai contou-lhe tudo o que lhe havia acontecido e também a quantia exata de dinheiro que Hamã tinha dito que pesaria para os tesouros do rei, a fim de destruir os judeus.
  rationale: A revisão conserva a estrutura e o sentido do hebraico, explicita que se trata de dinheiro e restabelece «pesaria», mantendo a imagem histórica do pagamento medido por peso. «Para os tesouros do rei» expressa o destino do valor sem introduzir desnecessariamente o verbo «depositar».
