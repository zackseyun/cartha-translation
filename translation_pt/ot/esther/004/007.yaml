  text: וַ/יַּגֶּד ל֣/וֹ מָרְדֳּכַ֔י אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וְ/אֵ֣ת פָּרָשַׁ֣ת הַ/כֶּ֗סֶף אֲשֶׁ֨ר אָמַ֤ר הָמָן֙ לִ֠/שְׁקוֹל עַל גִּנְזֵ֥י הַ/מֶּ֛לֶךְ ב/יהודיים לְ/אַבְּדָֽ/ם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: pt
  text: Mordecai contou-lhe tudo o que lhe havia acontecido e também a quantia exata de dinheiro que Hamã tinha dito que pesaria para os tesouros do rei, a fim de destruir os judeus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: contou
  rationale: O hifil de נגד significa dar a conhecer ou contar; “contou” é natural no contexto narrativo.
- source_word: לוֹ
  choice: a ele
  rationale: O pronome se refere a Hataque no contexto imediato.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: tudo o que lhe havia acontecido
  rationale: Preserva explicitamente o sufixo pronominal de קָרָהוּ e expressa a anterioridade em relação ao relato.
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: a quantia exata
  rationale: פָּרָשָׁה indica aqui uma especificação ou soma determinada, isto é, o valor que Hamã se propôs a entregar.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: tinha dito que depositaria, a peso
  rationale: Mantém tanto o ato de dizer quanto a imagem concreta de pesar o metal usado no pagamento, sem produzir uma construção pouco natural em português.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: nos tesouros do rei
  rationale: Representa o plural גִּנְזֵי e o destino do valor dentro do sistema de tesouros reais.
- source_word: ביהודיים לְאַבְּדָם
  choice: para destruir os judeus
  rationale: Expressa de modo claro o alvo e a finalidade da ação; o sufixo em לְאַבְּדָם retoma os judeus.
