source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: pt
  text: 'Todos os servos do rei e o povo das províncias do rei sabem que, para qualquer homem ou mulher que entre na presença do rei, no pátio interno, sem receber convocação[a], há uma só lei: a pena de morte[b], exceto para a pessoa a quem o rei estender o cetro de ouro; essa pessoa viverá. Quanto a mim, já faz trinta dias que não sou chamada para comparecer diante do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem ser chamado”. O verbo hebraico está na voz passiva; “receber convocação” ressalta o protocolo formal da corte.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “uma é a sua lei: matar”. A expressão indica uma única sentença legal para todos esses casos: a pena de morte.'
    reason: idiom_clarification
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: Abrange os que estão a serviço do rei no contexto da corte persa, sem restringir o termo a oficiais nem sugerir necessariamente condição de escravidão.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: e o povo das províncias do rei
  rationale: Preserva a ampliação do foco, dos servidores da corte para a população das províncias do império.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: qualquer homem ou mulher
  rationale: Mantém a formulação distributiva e a menção explícita a ambos os sexos.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: entrar na presença do rei, no pátio interno
  rationale: Expressa com naturalidade o ato de se aproximar do rei entrando na área interna e restrita da corte.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: sem receber convocação
  rationale: Comunica o caráter oficial do chamado e evita uma concordância de gênero pouco natural depois de 'homem ou mulher'.
- source_word: אַחַת דָּתוֹ
  choice: uma só lei se aplica
  rationale: Reproduz a ideia de uma regra única e invariável para esse caso, em português corrente.
- source_word: לְהָמִית
  choice: essa pessoa deve ser morta
  rationale: Explicita que se trata de uma pena imposta pela autoridade, não apenas do ato de morrer.
- source_word: לְבַד מֵאֲשֶׁר
  choice: a não ser que
  rationale: Introduz claramente a única exceção à pena estabelecida.
- source_word: יוֹשִׁיט לוֹ
  choice: lhe estenda
  rationale: Descreve de modo conciso o gesto régio de estender o cetro em favor da pessoa.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: o cetro de ouro
  rationale: É a expressão portuguesa natural para o emblema de favor e autoridade real.
- source_word: וְחָיָה
  choice: então viverá
  rationale: Apresenta o resultado do gesto favorável do rei sem enfraquecer a relação direta entre o cetro estendido e a preservação da vida.
- source_word: וַאֲנִי לֹא נִקְרֵאתִי ... זֶה שְׁלוֹשִׁים יוֹם
  choice: Quanto a mim, já faz trinta dias que não sou chamada
  rationale: Mantém o contraste enfático de Ester e verte naturalmente a expressão temporal hebraica.
