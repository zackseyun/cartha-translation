  to: 'Todos os servos do rei e o povo das províncias do rei sabem que, para qualquer homem ou mulher que entre na presença do rei, no pátio interno, sem receber convocação[a], há uma só lei: a pena de morte[b], exceto para a pessoa a quem o rei estender o cetro de ouro; essa pessoa viverá. Quanto a mim, já faz trinta dias que não sou chamada para comparecer diante do rei.'
