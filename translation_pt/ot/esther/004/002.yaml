  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: pt
  text: Ele chegou até diante do portão do rei[a], pois ninguém podia entrar pelo portão do rei vestido de pano de saco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até a frente do portão do rei» ou «diante do portão do rei». O hebraico enfatiza que ele se aproximou somente até o ponto diante do portão.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: «pois não se podia entrar pelo portão do rei com roupa de pano de saco». O sentido contextual é que a entrada com vestes de luto era proibida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ele foi
  rationale: O wayyiqtol de בוא descreve o movimento de Mordecai em direção ao portão; «foi» é natural no fluxo narrativo em português.
- source_word: עַד לִפְנֵי
  choice: até diante de
  rationale: A combinação indica aproximação até o ponto imediatamente anterior ao portão, sem entrar; «até diante de» preserva tanto o limite quanto a relação espacial.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: o portão do rei
  rationale: A construção hebraica é vertida de forma clara e idiomática, mantendo a referência específica ao acesso do complexo real.
- source_word: כִּי אֵין לָבוֹא
  choice: pois ninguém podia entrar
  rationale: אין com infinitivo comunica impossibilidade ou proibição no contexto. A formulação explicita naturalmente em português a regra que impediu Mordecai de avançar.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: pelo portão do rei
  rationale: Embora אֶל possa significar «para» ou «em», aqui a ideia contextual é passar para dentro pelo acesso real; «entrar pelo portão» é idiomático em português.
- source_word: בִּלְבוּשׁ שָׂק
  choice: vestido de pano de saco
  rationale: A expressão significa literalmente estar em vestimenta de saco. «Vestido de pano de saco» mantém a imagem concreta da roupa de luto em linguagem compreensível.
