  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy of the written decree that had been issued in Susa for their destruction[a], to show Esther and tell her[c][b], and to instruct her to go in to the king to implore his favor and seek from before him concerning her people.
translation:
  language: pt
  text: Também lhe deu uma cópia[a] do texto do decreto que havia sido promulgado em Susã para exterminá-los, a fim de mostrá-la a Ester e informá-la, e de ordenar-lhe que entrasse na presença do rei, implorasse o seu favor e dirigisse diante dele uma petição em favor do seu povo.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma cópia do decreto”. O empréstimo persa פַּתְשֶׁגֶן refere-se ao texto ou à cópia de um documento oficial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “buscasse da presença dele”, expressão cortesã para apresentar uma petição na presença do rei.
    reason: cultural_note
  - marker: c
    text: Ou “a respeito do seu povo”. A preposição hebraica pode indicar tanto o assunto do pedido quanto a atuação em favor do povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב הַדָּת
  choice: uma cópia do decreto escrito
  rationale: O empréstimo persa פַּתְשֶׁגֶן designa o texto ou a cópia de um documento oficial; הַדָּת, no contexto da corte persa em Ester, refere-se a um decreto real.
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: havia sido promulgado em Susã
  rationale: Embora נִתַּן signifique literalmente “foi dado”, no contexto administrativo indica a emissão ou promulgação oficial do decreto.
- source_word: לְהַשְׁמִידָם
  choice: para exterminá-los
  rationale: O infinitivo com sufixo expressa a finalidade do decreto e mantém de modo direto sua intenção letal.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: a fim de mostrá-la a Ester e informá-la
  rationale: O objeto de “mostrar” é a cópia do decreto, recuperada naturalmente pelo pronome; הִגִּיד comunica o ato de informar ou relatar sem exigir a ideia adicional de explicar.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: e de ordenar-lhe
  rationale: צוה expressa uma ordem ou incumbência firme. “Ordenar-lhe” preserva a força do verbo sem acrescentar autoridade institucional não declarada no texto.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: que entrasse na presença do rei
  rationale: A formulação comunica o acesso à presença real, elemento decisivo no contexto imediato, em português corrente e digno.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: implorasse seu favor
  rationale: O hitpael de חנן indica súplica insistente por graça ou favor.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: e lhe apresentasse um pedido em favor do seu povo
  rationale: A tradução torna natural em português a expressão cortesã “pedir da presença dele” e representa עַל como ação em benefício do povo, sem ocultar a alternativa semântica registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Entrasse na presença do rei” e “lhe apresentasse um pedido” preservam o cenário formal da corte sem reproduzir de modo artificial a sintaxe hebraica. A ambiguidade de עַל entre assunto e representação em favor de alguém é mantida por meio de nota.
