revisions:
- from: Também lhe deu uma cópia[a] do decreto escrito que havia sido promulgado em Susã para exterminá-los, a fim de mostrá-la a Ester e informá-la, e de ordenar-lhe que entrasse na presença do rei, implorasse seu favor e lhe apresentasse um pedido em favor do seu povo.[b][c]
  to: Também lhe deu uma cópia[a] do texto do decreto que havia sido promulgado em Susã para exterminá-los, a fim de mostrá-la a Ester e informá-la, e de ordenar-lhe que entrasse na presença do rei, implorasse o seu favor e dirigisse diante dele uma petição em favor do seu povo.[b][c]
  rationale: A revisão resolve a ambiguidade gramatical de «mostrá-la a Ester» ao tornar «-la» inequivocamente referente à cópia mediante «uma cópia do texto do decreto». Também ajusta a nota literal para refletir o verbo בקש (“buscar/procurar; pedir”) e formula a petição de maneira natural, mantendo o tom da corte e a duplicidade do hebraico entre suplicar favor e fazer um pedido pelo povo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:57:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente a sequência de ações de Mardoqueu e o teor letal do decreto. Contudo, «mostrá-la a Ester» altera sintaticamente o referente: em português, o pronome feminino tende a retomar Ester, quando o objeto a ser mostrado é a cópia/documento. A formulação deve explicitar ou deixar sem pronome o objeto documental.'
  naturalness: O registro é moderno e apropriado ao contexto cortesão. «Cópia do texto do decreto» é mais transparente do que «cópia do decreto escrito», e «dirigisse uma petição diante dele» preserva melhor a distinção entre suplicar favor e apresentar um pedido.
  terminology: «Susã», «decreto», «exterminá-los», «na presença do rei» e «favor» são escolhas adequadas. «Ordenar-lhe» reproduz com segurança a força de וּלְצַוּוֹת. As notas preservam a alternativa semântica de עַל e explicam a expressão cortesã.
  issues:
  - severity: medium
    issue: Referente ambíguo/incorreto em «mostrá-la a Ester»
    rationale: O hebraico manda mostrar a Ester a cópia do decreto (o objeto documental implícito). Em português, «mostrá-la a Ester» faz «-la» concordar naturalmente com Ester e sugere que alguém deve mostrar Ester a outra pessoa. É necessário dizer «mostrar a Ester» ou «mostrar-lhe a cópia».
  - severity: low
    issue: «cópia do decreto escrito» é menos nítido do que a construção documental do hebraico
    rationale: פַּתְשֶׁגֶן כְּתָב הַדָּת aponta para uma cópia/texto de um decreto. «uma cópia do texto do decreto» expressa essa relação de modo mais claro e natural.
