  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: pt
  text: Vá, reúna todos os judeus que estão em Susã e jejuem por mim.[a] Não comam nem bebam durante três dias, noite e dia. Eu e minhas servas[b] também jejuaremos da mesma forma. Depois disso, irei ao rei, embora isso seja contrário à lei.[c] Se eu perecer, perecerei.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jejuem em meu favor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “minhas jovens mulheres” ou “minhas atendentes”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “embora isso não esteja de acordo com a lei”.'
    reason: lexical_alternative
  - marker: d
    text: 'O hebraico repete de forma concisa e enfática o verbo “perecer” (literalmente, algo como “quando/como pereci, pereci”). A expressão comunica a aceitação resoluta do risco; também pode ser traduzida: “E, se eu morrer, morrerei”.'
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: Vá, reúna
  rationale: Mantém os dois imperativos dirigidos a Mordecai em português natural e direto.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: todos os judeus que estão em Susã
  rationale: O particípio הנמצאים pode significar literalmente 'que são encontrados' ou, de modo idiomático, 'que estão/presentes'; a formulação escolhida é clara e preserva o alcance total.
- source_word: וְצוּמוּ עָלַי
  choice: e jejuem por mim
  rationale: A preposição על relaciona o jejum à pessoa e à situação de Ester; 'por mim' comunica isso de modo conciso, deixando a alternativa 'em meu favor' em nota.
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ
  choice: Não comam nem bebam
  rationale: Reproduz naturalmente em português as duas proibições coordenadas.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: durante três dias, noite e dia
  rationale: Preserva a sequência hebraica e a ênfase na duração contínua.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי
  choice: Eu e minhas jovens assistentes também
  rationale: נערות pode designar jovens mulheres, servas ou atendentes; 'jovens assistentes' é atual, dignificante e adequado ao contexto cortesão sem especificar demais sua posição.
- source_word: אָצוּם כֵּן
  choice: jejuaremos da mesma forma
  rationale: Embora o hebraico use a primeira pessoa singular, o sujeito composto 'eu e minhas jovens assistentes' requer naturalmente o plural em português; כן remete ao modo de jejum já descrito.
- source_word: וּבְכֵן
  choice: Depois disso
  rationale: 'Expressa a progressão temporal e consequencial: Ester irá ao rei após o jejum.'
- source_word: אָבוֹא אֶל הַמֶּלֶךְ
  choice: irei ao rei
  rationale: בוא אל indica aqui aproximar-se ou dirigir-se ao rei; 'irei ao rei' é direto e natural.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: embora isso não esteja de acordo com a lei
  rationale: Explicita de maneira natural o valor concessivo contextual sem apagar a formulação hebraica 'não segundo a lei'.
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: E, se eu perecer, pereci
  rationale: Preserva a repetição lexical, a concisão e a mudança formal do hebraico para o perfeito na segunda ocorrência, evitando resolver a ambiguidade como simples futuro.
theological_decisions:
- issue: Sentido da declaração final de Ester
  choice: E, se eu perecer, pereci
  alternative: E, se eu tiver de perecer, perecerei
  rationale: A construção hebraica é breve e enfática, podendo exprimir aceitação resoluta do risco. A tradução principal conserva sua tensão e a forma verbal da segunda ocorrência; a alternativa idiomática é registrada em nota, sem transformar a fala numa certeza absoluta de morte.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento no singular para Mordecai ('Vá, reúna') contrasta corretamente com o plural dirigido aos judeus ('jejuem', 'não comam nem bebam'). 'Susã' segue a forma portuguesa tradicional do topônimo. A formulação final mantém deliberadamente a aspereza e a tensão verbal do hebraico, com uma alternativa mais idiomática em nota.
