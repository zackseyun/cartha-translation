revisions:
- from: Vá, reúna todos os judeus que estão em Susã e jejuem por mim.[a] Não comam nem bebam durante três dias, noite e dia. Eu e minhas jovens assistentes[b] também jejuaremos da mesma forma. Depois disso, irei ao rei, embora isso não esteja de acordo com a lei.[c] E, se eu perecer, pereci.[d]
  to: Vá, reúna todos os judeus que estão em Susã e jejuem por mim.[a] Não comam nem bebam durante três dias, noite e dia. Eu e minhas servas[b] também jejuaremos da mesma forma. Depois disso, irei ao rei, embora isso seja contrário à lei.[c] Se eu perecer, perecerei.[d]
  rationale: A revisão limita-se a corrigir a expressão final, cuja forma anterior não era idiomática nem semanticamente adequada em português, e a tornar a designação das mulheres de Ester mais direta no contexto histórico. Mantêm-se o sentido de presença em Susã, o jejum contínuo, a ilegalidade da aproximação ao rei e a ambiguidade idiomática da declaração final.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:57:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem os imperativos, o jejum total por três dias e a transição para a aproximação do rei. Contudo, «E, se eu perecer, pereci» introduz em português uma oposição temporal/pessoal pouco natural e dá à segunda ocorrência um sentido de passado concluído que não comunica adequadamente a fórmula hebraica resoluta. A repetição hebraica, embora formalmente em perfeito, funciona idiomaticamente como aceitação do risco: «Se eu perecer, perecerei».'
  naturalness: O texto é moderno e claro em geral. «Minhas jovens assistentes» é compreensível, mas soa burocrático e não representa tão diretamente a designação de mulheres sob o serviço de Ester. «Minhas servas» é natural no contexto narrativo antigo e permanece menos especificador do que títulos cortesãos. A frase final necessita ajuste para fluência e sentido em português.
  terminology: «Susã», «judeus», «jejuar» e «lei» são adequados. Para נַעֲרוֹת, «servas» é uma opção principal mais precisa no contexto, com «atendentes» preservada como alternativa em nota. «Perecer» mantém o registro solene e a repetição da fala final sem impor interpretação doutrinária.
  issues:
  - severity: medium
    issue: A cláusula final «E, se eu perecer, pereci» usa «pereci» como passado em português.
    rationale: Embora o hebraico repita uma forma perfeita, a expressão idiomática comunica a disposição de Ester de aceitar a morte caso ela ocorra. Em português, «pereci» sugere que a morte já aconteceu e quebra a lógica condicional. «Se eu perecer, perecerei» preserva a repetição e a resolução sem alegar que o hebraico determine um simples futuro gramatical.
  - severity: low
    issue: «Minhas jovens assistentes» é menos direto para נַעֲרוֹת.
    rationale: O termo pode designar jovens mulheres em serviço, servas ou atendentes. «Minhas servas» é mais natural no quadro doméstico/cortesão antigo; a nota registra alternativas menos marcadas.
