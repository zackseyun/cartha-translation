lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então Ester mandou
  rationale: O waw consecutivo faz a narrativa avançar. Em português, “Então” expressa naturalmente a sequência, e “mandou” introduz de modo idiomático a instrução de transmitir a resposta.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְהָשִׁיב
  choice: que respondessem
  rationale: O infinitivo hifil de שוב, ligado a אמר, tem aqui o sentido idiomático de fazer uma resposta voltar, isto é, mandar responder. O plural indeterminado corresponde aos mensageiros implícitos no contexto sem identificá-los nominalmente.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da resposta; com “responder”, “a” é a construção natural em português.
- source_word: מָרְדֳּכָי
  choice: Mardoqueu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
