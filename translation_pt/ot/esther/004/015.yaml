  text: Então Ester mandou responder a Mardoqueu:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “E Ester disse para fazer voltar [uma resposta] a Mardoqueu”. O sentido é que ela mandou transmitir-lhe uma resposta.'
