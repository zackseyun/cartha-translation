  source_fidelity: 'O texto traduz com precisão a progressão narrativa e os elementos centrais do hebraico: Ester convoca Hataque, identificado como um dos eunucos do rei; o rei o havia designado para o serviço dela; Ester o encarrega de uma missão relativa a Mardoqueu; e a finalidade é descobrir a natureza da situação e sua causa. “O que estava acontecendo e por quê” expressa de forma idiomática a dupla pergunta מַה זֶּה / וְעַל מַה זֶּה, sem fechar indevidamente o sentido.'
