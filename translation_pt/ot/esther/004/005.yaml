base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: pt
  text: Então Ester chamou Hataque[a], um dos eunucos do rei, a quem ele havia designado para servi-la, e lhe deu ordens a respeito de Mardoqueu, para saber o que estava acontecendo e por quê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dos oficiais da corte do rei”. O termo hebraico pode designar especificamente um eunuco ou, em certos contextos, um oficial real em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: Então Ester chamou
  rationale: O wayyiqtol dá prosseguimento à narrativa; “Então” expressa naturalmente a sequência, e “chamou” comunica que Ester mandou Hataque vir à sua presença.
- source_word: לַהֲתָךְ
  choice: Hataque
  rationale: Transliteração corrente e legível do nome hebraico הֲתָךְ em português.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: um dos eunucos do rei
  rationale: סָרִיס designa com frequência um eunuco no contexto da corte real, embora também possa ter o sentido mais amplo de oficial da corte; a alternativa é preservada em nota.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: a quem ele havia designado para servi-la
  rationale: O rei é o antecedente natural do sujeito implícito de הֶעֱמִיד. A formulação comunica uma designação oficial para estar a serviço de Ester sem reproduzir de modo rígido o idioma “pôr diante dela”.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: e lhe deu ordens a respeito de Mardoqueu
  rationale: “Deu ordens” preserva a força de צוה, enquanto “a respeito de Mardoqueu” representa naturalmente עַל e mantém aberto o conteúdo exato da incumbência.
- source_word: לָדַעַת
  choice: para saber
  rationale: O infinitivo indica propósito; “para saber” é direto, natural e próximo do valor lexical do verbo.
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: o que estava acontecendo e por quê
  rationale: A expressão dupla pergunta tanto pela natureza da situação quanto por sua causa. Esta formulação mantém essa distinção em português corrente, sem impor uma explicação além do texto.
