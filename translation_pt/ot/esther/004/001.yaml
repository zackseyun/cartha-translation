base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: pt
  text: Quando Mardoqueu soube de tudo o que havia sido feito, rasgou as roupas, vestiu pano de saco e cobriu-se de cinzas. Depois, saiu para o meio da cidade e soltou um grito alto e amargo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “gritou um grito grande e amargo”. O hebraico emprega um verbo e um substantivo da mesma raiz para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  choice: soube
  rationale: No contexto narrativo, indica que Mardoqueu tomou conhecimento do que havia sido feito; “soube” comunica isso naturalmente em português.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: tudo o que havia sido feito
  rationale: Preserva a construção passiva e situa a ação anteriormente à reação de Mardoqueu.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: rasgou as roupas
  rationale: Expressa em linguagem atual o gesto convencional de luto, sem recorrer a vocabulário arcaico.
- source_word: שַׂק וָאֵפֶר
  choice: vestiu pano de saco e cobriu-se de cinzas
  rationale: Torna explícitas, de maneira natural em português, as ações de vestir o pano áspero e pôr cinzas sobre o corpo como sinais de luto.
- source_word: בְּתוֹךְ הָעִיר
  choice: pelo meio da cidade
  rationale: Conserva o sentido espacial de estar ou deslocar-se no meio da cidade, sem interpretar a expressão necessariamente como “centro da cidade”.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: soltou um grito alto e amargo
  rationale: Reproduz de modo idiomático a intensidade da construção hebraica com verbo e substantivo cognatos; “alto” comunica a força audível de גְדֹלָה, e “amargo” preserva a caracterização emocional de מָרָה.
