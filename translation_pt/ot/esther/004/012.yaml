  text: And they told Mordecai Esther’s words[a].
translation:
  language: pt
  text: E contaram a Mardoqueu as palavras de Ester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mensagem de Ester” ou “a resposta de Ester”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: Então contaram
  rationale: O hifil wayyiqtol de נגד dá continuidade à narrativa e tem sujeito plural não especificado. “Então contaram” é natural em português e comunica a transmissão da fala sem o tom mais formal de “relataram” ou “declararam”.
- source_word: לְמָרְדֳּכָי
  choice: a Mardoqueu
  rationale: A preposição לְ marca o destinatário da comunicação. “Mardoqueu” é a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֵת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico de objeto direto definido; sua função é expressa pela sintaxe portuguesa.
- source_word: דִּבְרֵי
  choice: as palavras
  rationale: O plural construto de דָּבָר pode indicar “palavras”, “mensagem” ou, no contexto, “resposta”. “As palavras” mantém maior transparência formal e preserva a referência ao que Ester disse.
- source_word: אֶסְתֵּר
  choice: de Ester
  rationale: A relação de construção com דִּבְרֵי é expressa naturalmente em português pela locução possessiva “de Ester”.
