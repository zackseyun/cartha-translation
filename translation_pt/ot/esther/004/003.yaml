base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: pt
  text: Em cada província, onde quer que chegassem a palavra do rei e o seu decreto, havia grande luto entre os judeus, com jejum, choro e lamentação; pano de saco e cinzas eram estendidos para muitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pano de saco e cinzas eram usados por muitos”. O hebraico é conciso e pode indicar tanto o uso generalizado desses sinais de luto como o fato de eles serem estendidos para muitos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: Em cada província
  rationale: A repetição distributiva hebraica, literalmente “província e província”, é expressa com naturalidade e abrangência por “cada província”.
- source_word: מְקוֹם אֲשֶׁר
  choice: onde quer que
  rationale: Preserva a força distributiva da expressão e soa natural em português moderno.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: a palavra do rei e o seu decreto
  rationale: “Palavra” mantém o sentido amplo de דָּבָר, enquanto “decreto” comunica o caráter jurídico de דָּת no contexto persa.
- source_word: מַגִּיעַ
  choice: chegassem
  rationale: Descreve naturalmente a difusão da comunicação real pelas províncias; o plural concorda em português com os dois elementos coordenados.
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: havia grande luto entre os judeus
  rationale: “Luto” corresponde ao sofrimento comunitário e às práticas rituais do contexto; “entre” identifica os que o vivenciavam.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: com jejum, choro e lamentação
  rationale: A preposição “com” apresenta os substantivos como manifestações do grande luto; “lamentação” preserva o aspecto público e intenso de מִסְפֵּד.
- source_word: שַׂק וָאֵפֶר
  choice: pano de saco e cinzas
  rationale: É a expressão tradicional e inteligível para os sinais antigos de humilhação e luto.
- source_word: יֻצַּע לָרַבִּים
  choice: eram estendidos para muitos
  rationale: Mantém a imagem literal do passivo de יצע e a formulação concisa e ambígua de לָרַבִּים, sem transformá-la diretamente no ato de vestir.
theological_decisions: []
