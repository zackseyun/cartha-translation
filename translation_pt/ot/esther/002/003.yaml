id: EST.2.3
reference: Esther 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: pt
  text: Que o rei nomeie oficiais em todas as províncias do seu reino, e que eles reúnam toda jovem virgem de bela aparência na cidadela de Susã, na casa das mulheres[a], sob os cuidados de Hegai, eunuco do rei e responsável pelas mulheres; e que lhes sejam dados os seus cosméticos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no harém”. O hebraico diz mais literalmente “na casa das mulheres”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e que lhes sejam proporcionados os seus tratamentos de beleza”. O termo hebraico pode se referir tanto a preparados cosméticos quanto, de modo mais amplo, a tratamentos de embelezamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד
  choice: nomeie
  rationale: O hifil de פקד indica designar pessoas para uma função; “nomeie” é natural no contexto administrativo.
- source_word: פְּקִידִים
  choice: oficiais
  rationale: Designa agentes da administração real encarregados de uma tarefa, sem necessariamente indicar patente militar.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: províncias do seu reino
  rationale: Expressão administrativa apropriada ao contexto imperial de Ester.
- source_word: וְיִקְבְּצוּ
  choice: que eles reúnam
  rationale: Preserva a sequência volitiva da proposta e expressa o ajuntamento das jovens por ordem real.
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: toda jovem virgem
  rationale: Mantém tanto a ideia de juventude em נַעֲרָה quanto a de virgindade em בְתוּלָה.
- source_word: טוֹבַת מַרְאֶה
  choice: de bela aparência
  rationale: Conserva a ênfase visual da expressão hebraica, literalmente “boa de aparência”, em português natural.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: cidadela de Susã
  rationale: הַבִּירָה refere-se ao complexo real fortificado; a construção portuguesa evita que “Susã” e “cidadela” pareçam dois destinos distintos.
- source_word: בֵּית הַנָּשִׁים
  choice: casa das mulheres
  rationale: Tradução transparente da expressão hebraica, sem introduzir no texto principal o termo mais interpretativo “harém”.
- source_word: אֶל יַד הֵגֶא
  choice: sob os cuidados de Hegai
  rationale: Traduz idiomaticamente “à mão de” como submissão à responsabilidade ou supervisão de alguém.
- source_word: סְרִיס
  choice: eunuco
  rationale: É o sentido lexical mais direto e se ajusta ao contexto dos aposentos das mulheres, embora o termo possa, em certos contextos cortesãos, significar mais amplamente “oficial”.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: responsável pelas mulheres
  rationale: Expressa em linguagem atual a função de guarda ou supervisor indicada pelo particípio hebraico.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: e que lhes sejam dados os seus cosméticos
  rationale: Representa a provisão de preparados destinados ao embelezamento; a nota registra a possível extensão do termo a tratamentos de beleza.
theological_decisions: []
