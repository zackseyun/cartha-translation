base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: pt
  text: A jovem lhe agradou e encontrou favor diante dele. Ele se apressou a fornecer-lhe os tratamentos de beleza e as porções que lhe cabiam, bem como sete jovens do palácio do rei, adequadas para lhe serem dadas. Depois, transferiu-a, junto com suas jovens, para a melhor parte da casa das mulheres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para os melhores aposentos da casa das mulheres”. A expressão indica um lugar privilegiado nos aposentos femininos do palácio, muitas vezes identificados como o harém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: a jovem
  rationale: Expressa naturalmente uma mulher jovem, sem o tom infantil de “menina” nem o caráter arcaico de “donzela”.
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: lhe agradou
  rationale: Traduz de modo idiomático a expressão hebraica literal “foi boa aos olhos dele”, sem acrescentar conotação romântica ou sexual.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: alcançou favor diante dele
  rationale: Conserva a linguagem cortesã e parte da forma hebraica, comunicando que ela recebeu tratamento favorável.
- source_word: וַיְבַהֵל
  choice: se apressou em lhe fornecer
  rationale: Preserva explicitamente a ideia de urgência e liga o verbo com naturalidade aos itens fornecidos.
- source_word: תַּמְרוּקֶיהָ
  choice: os tratamentos de beleza
  rationale: No contexto da preparação das mulheres, o termo designa tratamentos cosméticos ou de embelezamento; esta formulação é clara em português atual.
- source_word: מָנוֹתֶיהָ
  choice: as porções que lhe cabiam
  rationale: Mantém o sentido de porções ou provisões atribuídas, provavelmente alimentares, sem restringir o termo além do que o hebraico afirma.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: sete jovens adequadas
  rationale: Reproduz tanto a juventude das mulheres quanto sua aptidão para a função, sem transformar explicitamente o termo em “servas” antes que sua relação com Ester seja indicada.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: provenientes do palácio do rei
  rationale: Em contexto real, “palácio” transmite melhor do que o literal “casa” o sentido institucional da residência régia.
- source_word: וַיְשַׁנֶּהָ
  choice: transferiu a jovem
  rationale: No contexto, o verbo indica uma mudança de colocação dentro da casa das mulheres. “Transferiu” preserva o caráter administrativo sem afirmar mais claramente uma promoção do que o texto permite.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: para a melhor parte da casa das mulheres
  rationale: Mantém a expressão próxima do hebraico e indica uma localização superior dentro dos aposentos femininos, sem introduzir “harém” diretamente no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa das mulheres” preserva a designação do texto hebraico; “harém” foi reservado à nota por ser uma explicitação histórica. O marcador da nota foi colocado junto à expressão que ela esclarece.
