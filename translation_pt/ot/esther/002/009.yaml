revisions:
- from: A jovem lhe agradou e alcançou favor diante dele. Então ele se apressou em lhe fornecer os tratamentos de beleza e as porções que lhe cabiam, bem como sete jovens adequadas, provenientes do palácio do rei, para serem dadas a ela. E transferiu a jovem e suas servas para a melhor parte da casa das mulheres.[a]
  to: A jovem lhe agradou e encontrou favor diante dele. Ele se apressou a fornecer-lhe os tratamentos de beleza e as porções que lhe cabiam, bem como sete jovens do palácio do rei, adequadas para lhe serem dadas. Depois, transferiu-a, junto com suas jovens, para a melhor parte da casa das mulheres.[a]
  rationale: A revisão preserva a sequência e o sentido do hebraico, melhora a fluência e mantém a designação menos interpretativa «suas jovens» para נערותיה. A nota continua ancorada em «casa das mulheres», expressão que esclarece.
