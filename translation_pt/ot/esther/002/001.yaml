  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: pt
  text: Depois dessas coisas, quando a ira do rei Assuero se acalmou, ele se lembrou de Vasti, do que ela havia feito e do que havia sido decretado contra ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: Preserva de modo natural a fórmula temporal hebraica que introduz a cena seguinte.
- source_word: כְּשֹׁךְ חֲמַת
  choice: quando a ira ... se acalmou
  rationale: שׁכך indica que a intensa indignação diminuiu; a oração temporal reproduz com clareza a construção hebraica.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: o rei Assuero
  rationale: Mantém o título e emprega a forma portuguesa tradicional e reconhecível do nome.
- source_word: זָכַר
  choice: ele se lembrou
  rationale: É a correspondência direta e idiomática do verbo hebraico, sem explicar além do que o texto afirma.
- source_word: וַשְׁתִּי
  choice: Vasti
  rationale: Emprega a forma portuguesa convencional do nome próprio.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: do que ela havia feito
  rationale: O mais-que-perfeito composto expressa naturalmente a ação anterior recordada pelo rei.
- source_word: אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: do que havia sido decretado contra ela
  rationale: A forma passiva de גזר aponta para uma decisão oficial; 'contra ela' conserva o sentido adverso de עָלֶיהָ no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e legível no Brasil. A repetição de 'do que' preserva o paralelismo dos dois objetos da lembrança do rei. Não foram mantidas as notas da camada inglesa porque seus marcadores não correspondem às expressões anotadas e o hebraico não exige nota para uma tradução clara.
