  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: pt
  text: Assim, Ester foi levada ao rei Assuero[a], ao palácio real, no décimo mês, isto é, o mês de tebete[b], no sétimo ano do seu reinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi conduzida ao rei Assuero”. O verbo hebraico está na voz passiva e ressalta que Ester foi objeto da ação.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o mês de tebete”, nome babilônico do décimo mês.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: foi levada
  rationale: Preserva a forma passiva do nifal e o destaque narrativo de que Ester é objeto da ação, sem indicar que ela tomou a iniciativa.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: rei Assuero
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome do rei, mantendo título e nome.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: ao palácio real
  rationale: Expressa em português natural o sentido contextual de 'casa de sua realeza', isto é, a residência real, e mantém a ideia de movimento em direção ao local.
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: isto é, o mês de tebete
  rationale: Torna clara a função explicativa da expressão hebraica, identificando pelo nome o décimo mês.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: no sétimo ano do seu reinado
  rationale: É a formulação portuguesa idiomática para a datação segundo os anos de governo de um rei.
