  text: וַ/יְהִ֗י בְּ/הִשָּׁמַ֤ע דְּבַר הַ/מֶּ֨לֶךְ֙ וְ/דָת֔/וֹ וּֽ/בְ/הִקָּבֵ֞ץ נְעָר֥וֹת רַבּ֛וֹת אֶל שׁוּשַׁ֥ן הַ/בִּירָ֖ה אֶל יַ֣ד הֵגָ֑י וַ/תִּלָּקַ֤ח אֶסְתֵּר֙ אֶל בֵּ֣ית הַ/מֶּ֔לֶךְ אֶל יַ֥ד הֵגַ֖י שֹׁמֵ֥ר הַ/נָּשִֽׁים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: pt
  text: Quando se ouviu a ordem do rei e seu decreto, e muitas jovens foram reunidas na cidadela de Susã sob a custódia de Hegai[a], Ester também foi levada à casa do rei[b], para a custódia de Hegai, encarregado da guarda das mulheres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “à mão de Hegai”; isto é, sob sua autoridade ou custódia.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao palácio do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: ordem
  rationale: No contexto da corte, indica uma determinação oficial do rei; “ordem” é natural e distingue-se bem de “decreto”.
- source_word: דָת
  choice: decreto
  rationale: Designa uma determinação oficial no contexto persa, sem necessariamente implicar uma lei permanente.
- source_word: נְעָרוֹת רַבּוֹת
  choice: muitas jovens
  rationale: Expressa de modo atual e digno mulheres jovens em idade de casamento, sem acrescentar aqui a ideia de virgindade.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: a cidadela de Susã
  rationale: Identifica o complexo real fortificado de Susã com uma formulação idiomática em português.
- source_word: אֶל יַד
  choice: sob os cuidados de / entregue aos cuidados de
  rationale: O idioma literalmente relacionado à “mão” indica autoridade, responsabilidade ou custódia. A variação evita repetição rígida, preservando o sentido institucional.
- source_word: וַתִּלָּקַח
  choice: foi levada
  rationale: Mantém a voz passiva e, com ela, a falta de iniciativa de Ester, sem intensificar indevidamente a força envolvida.
- source_word: בֵּית הַמֶּלֶךְ
  choice: casa do rei
  rationale: Preserva a formulação concreta do hebraico; no contexto, pode designar o palácio ou complexo real.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: responsável pelas mulheres
  rationale: Comunica em português corrente a função de guardar e supervisionar as mulheres, sem sugerir uma benevolência não expressa pelo texto.
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: Quando se ouviu ... e ... foram reunidas
  rationale: Reproduz as circunstâncias temporais coordenadas do hebraico em sintaxe natural portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a passividade de Ester e evita linguagem arcaica. “Casa do rei” conserva a imagem hebraica, enquanto a nota registra o sentido contextual de “palácio”.
