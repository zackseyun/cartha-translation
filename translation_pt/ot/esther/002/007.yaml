translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém tom narrativo digno, preserva os dois nomes da personagem e evita tanto arcaísmos quanto precisão jurídica não explicitada pelo hebraico.
