  text: וַ/יְהִ֨י אֹמֵ֜ן אֶת הֲדַסָּ֗ה הִ֤יא אֶסְתֵּר֙ בַּת דֹּד֔/וֹ כִּ֛י אֵ֥ין לָ֖/הּ אָ֣ב וָ/אֵ֑ם וְ/הַ/נַּעֲרָ֤ה יְפַת תֹּ֨אַר֙ וְ/טוֹבַ֣ת מַרְאֶ֔ה וּ/בְ/מ֤וֹת אָבִ֨י/הָ֙ וְ/אִמָּ֔/הּ לְקָחָ֧/הּ מָרְדֳּכַ֛י ל֖/וֹ לְ/בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: pt
  text: Mordecai criava Hadassa, isto é, Ester, filha do tio de Mordecai[a], pois ela não tinha pai nem mãe. A jovem era bela de figura e de boa aparência. Quando o pai e a mãe dela morreram, Mordecai a tomou como filha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, prima de Mordecai.
    reason: Esclarece a relação de parentesco decorrente da expressão hebraica literal «filha do tio de Mordecai».
  - marker: b
    text: 'Ou: «Mordecai a adotou como filha». O hebraico diz, mais literalmente, que ele «a tomou para si como filha».'
    reason: Registra a alternativa idiomática «adotou» e preserva a formulação menos juridicamente específica do original.
lexical_decisions:
- source_word: אֹמֵן
  choice: criava
  rationale: O particípio descreve o cuidado contínuo de Mordecai ao criar Hadassa. “Criava” é natural e claro em português, sem impor a categoria jurídica mais específica de tutela.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: Hadassa, isto é, Ester
  rationale: A construção identifica a mesma jovem por seus dois nomes; “isto é” comunica naturalmente a aposição explicativa.
- source_word: בַּת דֹּדוֹ
  choice: filha de seu tio
  rationale: Preserva a formulação explícita do hebraico, em vez de reduzi-la à relação derivada “prima”.
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: pois ela não tinha pai nem mãe
  rationale: Reproduz diretamente a ausência de ambos os pais, sem substituir a expressão pelo termo inferido “órfã”.
- source_word: הַנַּעֲרָה
  choice: A jovem
  rationale: Termo moderno e digno, apropriado ao contexto, sem o tom arcaico de “donzela” nem a conotação demasiadamente infantil de “menina”.
- source_word: יְפַת תֹּאַר
  choice: bonita de corpo
  rationale: Comunica de modo corrente o elogio à forma ou figura física expresso por תֹּאַר.
- source_word: טוֹבַת מַרְאֶה
  choice: de aparência
  rationale: Em coordenação com “bonita de corpo”, conserva o segundo aspecto da descrição, referente ao aspecto visível, sem repetição pesada.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: Quando o pai e a mãe dela morreram
  rationale: Expressa de maneira idiomática a circunstância temporal indicada pela construção hebraica.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: Mordecai a tomou como filha
  rationale: Mantém de perto a expressão hebraica “tomou-a para si por filha”, evitando importar necessariamente uma adoção jurídica formal.
