  to: Mordecai criava Hadassa, isto é, Ester, filha do tio de Mordecai[a], pois ela não tinha pai nem mãe. A jovem era bela de figura e de boa aparência. Quando o pai e a mãe dela morreram, Mordecai a tomou como filha[b].
