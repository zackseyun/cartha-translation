base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: pt
  text: Então o rei ofereceu um grande banquete a todos os seus oficiais e servidores — o banquete de Ester — e concedeu alívio às províncias[a], distribuindo presentes conforme a generosidade do rei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “decretou um feriado para as províncias” ou “concedeu remissão às províncias”. O termo hebraico pode indicar, de modo amplo, descanso, alívio ou remissão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “segundo a mão do rei”, expressão que indica generosidade ou uma medida correspondente aos recursos do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: um grande banquete
  rationale: מִשְׁתֶּה designa um banquete, frequentemente com bebida; no contexto da corte, “banquete” é natural e preserva o caráter formal da ocasião. גָדוֹל significa “grande”.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: a todos os seus oficiais e servos
  rationale: שָׂרִים refere-se aqui a altos oficiais da corte, enquanto עֲבָדִים mantém o sentido amplo de servos ou servidores reais. A formulação evita especificar funções não indicadas no texto.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: o banquete de Ester
  rationale: Reproduz naturalmente a relação construta hebraica e preserva certa abertura quanto a ser um banquete associado a Ester ou oferecido em sua honra.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: concedeu alívio às províncias
  rationale: הֲנָחָה pode indicar descanso, alívio ou remissão. “Alívio” preserva a amplitude lexical sem decidir se houve feriado, dispensa de trabalho ou remissão tributária.
- source_word: מַשְׂאֵת
  choice: presentes
  rationale: No contexto de liberalidade régia, o termo indica dádivas ou porções concedidas. “Presentes” é claro, natural e suficientemente abrangente.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: com generosidade digna de um rei
  rationale: A expressão significa literalmente “segundo a mão do rei” e indica uma medida correspondente aos recursos ou à liberalidade real. A tradução comunica o idioma sem reproduzir uma imagem opaca em português.
- source_word: וַיַּעַשׂ
  choice: ofereceu
  rationale: Embora o verbo signifique literalmente “fez”, “ofereceu um banquete” é a expressão idiomática natural em português para o ato de promovê-lo.
