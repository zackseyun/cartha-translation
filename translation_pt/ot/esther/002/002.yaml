base_translation:
  language: en
  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: pt
  text: 'Então os jovens do rei que o serviam disseram[b][a]: “Que se procurem para o rei jovens virgens de bela aparência.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “jovens, virgens, boas de aparência”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais formal: “Que procurem para o rei jovens virgens de bela aparência”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: os jovens do rei
  rationale: נַעַר pode designar um jovem ou um servo. Como מְשָׁרְתָיו explicita que eles serviam ao rei, “jovens” preserva a distinção lexical sem apagar a função indicada em seguida.
- source_word: מְשָׁרְתָיו
  choice: que o serviam
  rationale: O particípio de שׁרת descreve serviço pessoal prestado ao rei; a oração relativa é clara e natural em português.
- source_word: יְבַקְשׁוּ
  choice: Que se procurem
  rationale: Embora a forma hebraica seja ativa, com sujeito indefinido (“que procurem”), a construção passiva sintética comunica de modo natural a proposta sem especificar agentes que o texto não nomeia.
- source_word: לַמֶּלֶךְ
  choice: para o rei
  rationale: Mantém o dativo de benefício ou finalidade sem acrescentar uma interpretação mais específica.
- source_word: נְעָרוֹת
  choice: jovens
  rationale: Em combinação com בְּתוּלוֹת, indica mulheres jovens; “jovens virgens” é claro, atual e evita tanto um sentido infantil quanto linguagem arcaica.
- source_word: בְּתוּלוֹת
  choice: virgens
  rationale: Preserva o sentido específico do termo hebraico sem atenuá-lo.
- source_word: טוֹבוֹת מַרְאֶה
  choice: de bela aparência
  rationale: Reproduz com naturalidade o idioma hebraico “boas de aparência”, mantendo explícita a referência à aparência física.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a distinção entre a juventude dos homens e sua função de servir ao rei, bem como a ordem conceitual “jovens virgens” e “de bela aparência”.
