base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: pt
  text: Quando chegou a vez de Ester — filha de Abiail, tio de Mardoqueu, que a havia tomado por filha[a] — de ir à presença do rei, ela não pediu nada além do que Hegai, eunuco[b] do rei e responsável pelas mulheres, recomendou. E Ester ganhava o favor de todos os que a viam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a havia acolhido como filha”. A expressão hebraica indica que Mardoqueu recebeu Ester sob seus cuidados como filha, sem necessariamente descrever uma adoção legal formal.'
    reason: lexical_alternative
  - marker: b
    text: Em alguns contextos, o termo também pode ser traduzido de modo mais amplo como “oficial da corte”; aqui, o ambiente dos aposentos das mulheres favorece “eunuco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: Quando chegou a vez
  rationale: A preposição com o infinitivo introduz uma oração temporal, e תֹּר designa a vez atribuída a Ester na sequência das mulheres levadas ao rei.
- source_word: דֹּד מָרְדֳּכַי
  choice: tio de Mardoqueu
  rationale: Embora דֹּד possa ter usos mais amplos, o contexto genealógico de Ester 2:7 favorece a relação de tio.
- source_word: לָקַח לוֹ לְבַת
  choice: a havia tomado por filha
  rationale: Preserva de perto a expressão hebraica de acolhimento em relação filial sem afirmar necessariamente um procedimento jurídico formal de adoção.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: ir à presença do rei
  rationale: Expressa naturalmente o movimento para diante do rei e mantém a forma discreta do hebraico, sem explicitar mais do que o texto.
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: não pediu nada além de
  rationale: 'Comunica com clareza a negação seguida da exceção: Ester solicitou somente aquilo que Hegai indicou.'
- source_word: יֹאמַר
  choice: recomendou
  rationale: Embora o verbo signifique literalmente “dizer”, no contexto Hegai determina ou aconselha o que Ester deve levar; “recomendou” torna explícita essa função contextual sem alterar o sentido.
- source_word: סְרִיס
  choice: eunuco
  rationale: É o sentido lexical específico mais provável no ambiente dos aposentos reais das mulheres, embora o termo também possa designar mais amplamente um oficial da corte.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: responsável pelas mulheres
  rationale: Forma corrente e digna de descrever a função de supervisão de Hegai, evitando a rigidez pouco natural de “guardião das mulheres”.
- source_word: נֹשֵׂאת חֵן בְּעֵינֵי כָּל רֹאֶיהָ
  choice: ganhava o favor de todos os que a viam
  rationale: Reproduz o valor idiomático de “portar/encontrar favor” e o aspecto progressivo da construção, em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Os travessões preservam a longa identificação de Ester sem obscurecer a oração principal; “ir à presença do rei” mantém a discrição narrativa do hebraico.
