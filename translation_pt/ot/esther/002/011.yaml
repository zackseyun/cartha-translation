base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: pt
  text: E, dia após dia, Mardoqueu caminhava de um lado para o outro diante do pátio da casa das mulheres, para saber como Ester estava e o que seria feito com ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל־יוֹם וָיוֹם
  choice: E, dia após dia
  rationale: A expressão distributiva e enfática indica uma ação repetida diariamente; esta formulação é natural em português e preserva a insistência do hebraico.
- source_word: מִתְהַלֵּךְ
  choice: caminhava de um lado para o outro
  rationale: A forma sugere movimento habitual ou repetido, não apenas uma caminhada isolada.
- source_word: לִפְנֵי חֲצַר בֵּית הַנָּשִׁים
  choice: diante do pátio da casa das mulheres
  rationale: Mantém as relações espaciais e a designação institucional do hebraico sem acrescentar uma identificação interpretativa como 'harém'.
- source_word: לָדַעַת אֶת־שְׁלוֹם אֶסְתֵּר
  choice: para saber como Ester estava
  rationale: שָׁלוֹם, neste contexto, refere-se ao bem-estar ou estado de Ester; a expressão idiomática portuguesa comunica isso com clareza.
- source_word: וּמַה־יֵּעָשֶׂה בָּהּ
  choice: e o que seria feito com ela
  rationale: Preserva a voz passiva e a abertura quanto ao que ainda aconteceria a Ester.
