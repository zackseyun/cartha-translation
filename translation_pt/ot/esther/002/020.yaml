base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: pt
  text: Ester ainda não tinha revelado sua origem nem seu povo[a], conforme Mordecai lhe havia ordenado; e continuava cumprindo as instruções de Mordecai, como quando estava sob os cuidados dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sua linhagem» ou «sua parentela». O termo hebraico pode se referir ao nascimento, à procedência, à linhagem ou ao grupo familiar.
    reason: lexical_alternative
  - marker: b
    text: Ou «como quando era criada por ele». O hebraico recorda a vida anterior de Ester sob a tutela e os cuidados de Mordecai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... מַגֶּדֶת
  choice: ainda não tinha revelado
  rationale: A construção negativa com particípio indica que, até aquele ponto da narrativa, Ester não havia divulgado a informação; o mais-que-perfeito composto com «ainda não» expressa naturalmente essa continuidade em português.
- source_word: מוֹלַדְתָּהּ
  choice: sua origem
  rationale: O substantivo abrange nascimento, procedência, linhagem ou parentela. «Origem» é claro e natural em português e mantém a amplitude sem restringir o sentido a uma genealogia formal.
- source_word: עַמָּהּ
  choice: seu povo
  rationale: עם designa aqui o povo ao qual Ester pertencia, preservando de modo natural a dimensão coletiva, étnica e nacional.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ
  choice: conforme Mordecai lhe havia ordenado
  rationale: צוה expressa uma ordem, não mero conselho; «conforme» representa a relação indicada por כַּאֲשֶׁר.
- source_word: מַאֲמַר מָרְדֳּכַי
  choice: o que Mordecai dizia
  rationale: מַאֲמַר pode significar palavra, dito ou ordem. A formulação evita repetição rígida de «ordem» e conserva a ideia de atender ao que ele dizia.
- source_word: עֹשָׂה
  choice: continuava fazendo
  rationale: O particípio apresenta uma conduta contínua ou habitual; «continuava fazendo» explicita esse valor durativo sem transformar o verbo em uma interpretação abstrata como «obedecia».
- source_word: בְאָמְנָה אִתּוֹ
  choice: quando estava sob os cuidados dele
  rationale: A expressão ligada a אמן recorda o período em que Mordecai criava ou tutelava Ester. «Sob os cuidados dele» é corrente e preserva a relação de cuidado sem especificar além do texto.
