  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: pt
  text: Ester não havia revelado o seu povo nem a sua linhagem[a], pois Mardoqueu lhe havia ordenado que não revelasse isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a sua parentela» ou «a sua origem». O termo hebraico pode referir-se ao grupo de parentesco, à descendência ou ao lugar de origem; aqui provavelmente indica a ascendência familiar de Ester.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: não havia revelado
  rationale: O hifil de נגד significa dar a conhecer ou declarar. «Revelado» expressa naturalmente a ocultação da identidade, e o mais-que-perfeito situa a informação como pano de fundo narrativo.
- source_word: עַמָּהּ
  choice: o seu povo
  rationale: עַם designa aqui o grupo étnico ou nacional de Ester. «O seu povo» mantém a amplitude comunitária do hebraico sem reduzi-la à cidadania.
- source_word: מוֹלַדְתָּהּ
  choice: a sua linhagem
  rationale: מוֹלֶדֶת pode indicar parentesco, descendência ou origem. Em paralelo com «o seu povo», «linhagem» comunica a ascendência familiar sem mera repetição.
- source_word: צִוָּה עָלֶיהָ
  choice: lhe havia ordenado
  rationale: צוה é um verbo forte de ordem; «ordenado» preserva essa força. A construção com על é vertida idiomaticamente pelo pronome indireto «lhe».
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: que não o revelasse
  rationale: A oração apresenta o conteúdo da ordem. O pronome «o» retoma conjuntamente «o seu povo» e «a sua linhagem», enquanto a repetição de «revelar» preserva a coesão do hebraico.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Forma tradicional e corrente do nome em português.
