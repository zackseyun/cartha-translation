  rationale: A revisão corrige a oração relativa final para que retome Jeconias, como exigem o masculino singular hebraico e a posição sintática após «rei de Judá». Mantém-se em nota a ambiguidade debatida do antecedente da primeira oração relativa. A expressão «ao exílio» melhora a fluência portuguesa e conserva a repetição lexical intencional do verbo de deportação.
