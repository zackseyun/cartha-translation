  text: אֲשֶׁ֤ר הָגְלָה֙ מִ/יר֣וּשָׁלַ֔יִם עִם הַ/גֹּלָה֙ אֲשֶׁ֣ר הָגְלְתָ֔ה עִ֖ם יְכָנְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: pt
  text: o qual fora levado ao exílio de Jerusalém com os exilados que foram levados ao exílio com Jeconias, rei de Judá[a], a quem Nabucodonosor, rei da Babilônia, levou ao exílio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o qual» pode referir-se a Quis, antepassado de Mardoqueu, e não ao próprio Mardoqueu, pois o exílio de Jeconias ocorreu gerações antes.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: o qual
  rationale: Introduz a oração relativa; a forma masculina singular acompanha, no texto principal, o antecedente imediato, Mardoqueu, sem eliminar a alternativa indicada na nota.
- source_word: הָגְלָה
  choice: tinha sido levado para o exílio
  rationale: Expressa a deportação sofrida e conserva o valor passivo do contexto, em português atual e claro.
- source_word: מִירוּשָׁלַיִם
  choice: de Jerusalém
  rationale: Tradução direta da preposição de origem e do topônimo.
- source_word: עִם הַגֹּלָה
  choice: com os exilados
  rationale: Representa o substantivo coletivo como o grupo concreto de deportados, de modo natural em português.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: que tinham sido levados para o exílio
  rationale: O verbo feminino singular concorda em hebraico com o coletivo הַגֹּלָה; o plural português concorda naturalmente com «os exilados».
- source_word: יְכָנְיָה
  choice: Jeconias
  rationale: Forma portuguesa tradicional e reconhecível que representa diretamente o nome hebraico empregado neste versículo.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução normal da construção genitiva hebraica.
- source_word: אֲשֶׁר הֶגְלָה
  choice: os quais ... tinha levado para o exílio
  rationale: Indica Nabucodonosor como agente da deportação; o plural retoma naturalmente «os exilados» e a repetição preserva o encadeamento lexical de גלה.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forma portuguesa convencional e amplamente reconhecida do nome do rei babilônico.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Forma idiomática em português para o título ligado ao nome territorial Babilônia.
theological_decisions:
- issue: Antecedente da oração relativa em Ester 2:6
  choice: No texto principal, a oração é apresentada como referente a Mardoqueu («o qual tinha sido levado...»).
  alternative: A oração pode referir-se a Quis, antepassado de Mardoqueu, pois o exílio de Jeconias ocorreu gerações antes.
  rationale: A sequência sintática favorece o antecedente pessoal mais próximo no versículo anterior, mas a cronologia torna genuína a leitura alternativa; por isso, a tensão é preservada em nota, sem resolução silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de «levado para o exílio» é deliberada para refletir a recorrência do verbo גלה. O longo encadeamento relativo foi mantido por pertencer à estrutura do original, com pontuação que favorece a leitura.
