base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: pt
  text: Quando o assunto chegou ao conhecimento de Mardoqueu[a], ele relatou o assunto à rainha Ester, e Ester o comunicou ao rei em nome de Mardoqueu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi dado a conhecer a Mardoqueu”. A forma passiva hebraica pode destacar tanto que o assunto chegou ao conhecimento dele quanto que alguém o informou.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, Ester apresentou a informação como procedente de Mardoqueu. A expressão também pode ser entendida como “da parte de Mardoqueu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: chegou ao conhecimento
  rationale: O nifal expressa que a informação se tornou conhecida por Mardoqueu sem identificar quem a transmitiu; a formulação portuguesa conserva essa indeterminação.
- source_word: הַדָּבָר
  choice: o assunto
  rationale: דבר é amplo e retoma a conspiração mencionada no contexto, sem nomeá-la de modo mais específico que o hebraico.
- source_word: לְמָרְדֳּכַי
  choice: de Mardoqueu
  rationale: Na expressão portuguesa «chegou ao conhecimento de», assinala naturalmente a pessoa que tomou conhecimento da informação.
- source_word: וַיַּגֵּד
  choice: ele o contou
  rationale: O hifil de נגד indica contar ou comunicar algo; «contou» é claro e natural na sequência narrativa.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: à rainha Ester
  rationale: Reproduz idiomaticamente a aposição hebraica «a Ester, a rainha», preservando o título real.
- source_word: וַתֹּאמֶר ... לַמֶּלֶךְ
  choice: Ester o comunicou ao rei
  rationale: Embora אמר signifique literalmente «disse», o objeto retomado pelo contexto requer em português uma formulação natural como «comunicou»; o pronome «o» explicita apenas o assunto já expresso.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: em nome de Mardoqueu
  rationale: 'Conserva a expressão hebraica e sua ideia de atribuição: Ester apresentou a informação identificando Mardoqueu como sua fonte.'
