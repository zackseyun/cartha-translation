base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: pt
  text: Havia na cidadela de Susã[a] um homem judeu[b] chamado Mardoqueu, filho de Jair, filho de Simei, filho de Quis[c], da tribo de Benjamim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em Susã, a cidadela».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «um homem judaíta».'
    reason: lexical_alternative
  - marker: c
    text: Em contextos genealógicos, o hebraico «filho de» também pode indicar um descendente mais remoto.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: um homem judeu
  rationale: יְהוּדִי pode indicar identidade judaica ou origem judaíta. No contexto da diáspora persa, «judeu» comunica de modo natural a identidade do povo sem restringir o sentido à residência em Judá.
- source_word: הָיָה
  choice: Havia
  rationale: A forma verbal introduz um novo personagem na narrativa; «Havia» reproduz com naturalidade esse uso existencial.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: na cidadela de Susã
  rationale: הַבִּירָה designa a cidadela ou complexo real fortificado. A construção portuguesa explicita naturalmente a relação com a cidade de Susã.
- source_word: וּשְׁמוֹ
  choice: chamado
  rationale: «Chamado Mardoqueu» integra de maneira idiomática a indicação do nome à apresentação do personagem, sem alterar o conteúdo.
- source_word: מָרְדֳּכַי
  choice: Mardoqueu
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: filho de Jair, filho de Simei, filho de Quis
  rationale: בֶּן significa literalmente «filho», embora em genealogias possa indicar descendência mais remota. A repetição preserva a estrutura e a possível ambiguidade do hebraico.
- source_word: אִישׁ יְמִינִי
  choice: da tribo de Benjamim
  rationale: A expressão indica pertencimento tribal. «Da tribo de Benjamim» é claro e corrente em português, evitando a ambiguidade moderna de «benjaminita».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem inicial foi ajustada para fluência narrativa. Mantiveram-se a cadeia genealógica e sua ambiguidade, enquanto «da tribo de Benjamim» comunica de modo natural a afiliação tribal.
