base_translation:
  language: en
  yaml_path: translation/ot/esther/002/019.yaml
  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: pt
  text: Quando as virgens foram reunidas pela segunda vez[a], Mardoqueu estava sentado junto ao portão do rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “novamente”. O hebraico diz literalmente “uma segunda vez”.'
    reason: lexical_alternative
  - marker: b
    text: O “portão do rei” provavelmente se refere à área do portão do palácio real, associada ao serviço oficial e à administração.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: Quando ... foram reunidas
  rationale: A preposição com o infinitivo construto introduz uma oração temporal, e a forma nifal de קבץ é passiva. A conjunção inicial não precisa ser reproduzida separadamente em português.
- source_word: בְּתוּלוֹת
  choice: as virgens
  rationale: O termo assinala especificamente a condição de virgens no contexto da seleção para a corte; esta tradução preserva essa precisão.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Reproduz de maneira explícita e natural o sentido adverbial de 'uma segunda vez', sem reduzi-lo ao menos preciso 'novamente'.
- source_word: וּמָרְדֳּכַי
  choice: Mardoqueu
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: יֹשֵׁב
  choice: estava sentado
  rationale: O particípio qal expressa uma situação contínua; a locução verbal no imperfeito preserva esse caráter durativo.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: junto ao portão do rei
  rationale: A expressão indica a área do portão do complexo real. 'Junto ao portão' é natural em português e evita sugerir que Mardoqueu estivesse literalmente dentro da estrutura.
