  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição comparativa do hebraico foi preservada, assim como a distinção entre “mulheres” e “virgens”. O nome וַשְׁתִּי foi vertido pela forma portuguesa tradicional “Vasti”.
