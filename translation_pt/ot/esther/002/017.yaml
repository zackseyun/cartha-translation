base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: pt
  text: O rei amou Ester mais do que todas as mulheres, e ela alcançou favor e benevolência diante dele[a] mais do que todas as virgens[b]. Então pôs a coroa real sobre a cabeça dela e a fez rainha no lugar de Vasti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “ela levou/carregou favor e benevolência diante dele”, expressão idiomática que indica ter alcançado ou recebido essa disposição favorável.
    reason: lexical_alternative
  - marker: b
    text: “Virgens” traduz um termo hebraico mais específico que “mulheres” na oração anterior; a distinção do texto original foi preservada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: amou
  rationale: O verbo אהב expressa diretamente amor ou afeição; “amou” preserva sua força sem reduzi-lo a mera preferência.
- source_word: מִכָּל הַנָּשִׁים
  choice: mais do que todas as outras mulheres
  rationale: A construção comparativa é explicitada de modo natural em português. “Mulheres” traduz o termo amplo נָשִׁים, e “outras” deixa clara a inclusão lógica de Ester no grupo comparado.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: ela alcançou favor e benevolência
  rationale: “Alcançou” comunica de modo idiomático que Ester passou a desfrutar dessa disposição favorável. “Favor” e “benevolência” mantêm distintos os dois substantivos hebraicos, sem atribuir aqui a חֶסֶד um sentido técnico ou necessariamente pactual.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Preserva a imagem relacional do hebraico, literalmente “diante da face/presença dele”, em português corrente e digno.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: mais do que todas as virgens
  rationale: בְּתוּלֹת é mais específico que נָשִׁים na oração anterior. “Virgens” conserva deliberadamente essa diferença lexical.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: pôs a coroa real
  rationale: A expressão hebraica significa literalmente “coroa de realeza”; “coroa real” é conciso e natural.
- source_word: וַיַּמְלִיכֶהָ
  choice: a fez rainha
  rationale: O Hifil de מלך indica fazer alguém reinar ou constituí-lo rei ou rainha; o contexto exige o feminino “rainha”.
- source_word: תַּחַת וַשְׁתִּי
  choice: no lugar de Vasti
  rationale: Neste contexto de substituição e sucessão, תַּחַת significa “no lugar de”, não uma posição física inferior.
