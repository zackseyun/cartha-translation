base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: pt
  text: Naqueles dias, enquanto Mardoqueu estava sentado junto ao portão do rei, Bigtã e Teres, dois eunucos[a] do rei, dos que guardavam a entrada, ficaram irados e procuraram estender a mão contra o rei Assuero[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oficiais da corte”; o termo hebraico pode ter esse sentido mais amplo, embora “eunucos” seja provável neste contexto palaciano.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “enviar” ou “estender a mão contra”; isto é, atacar ou assassinar o rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Mantém a fórmula temporal ampla e natural da narrativa hebraica.
- source_word: יֹשֵׁב
  choice: estava sentado
  rationale: O particípio descreve uma circunstância em andamento; no contexto do portão real, o sentido concreto de estar sentado é o mais natural.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: junto ao portão do rei
  rationale: Indica a área oficial do portão ligada à administração real; 'junto ao' é natural em português sem apagar o cenário institucional.
- source_word: קָצַף
  choice: ficaram irados
  rationale: Embora o verbo antecedente esteja morfologicamente no singular, rege o sujeito composto Bigtã e Teres; 'irados' preserva a força do termo sem exagerá-la.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: eunucos do rei
  rationale: Em contexto de corte persa, o sentido concreto de eunucos é historicamente provável, embora o termo também possa designar oficiais da corte; a alternativa é registrada em nota.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: dos que guardavam a entrada
  rationale: Traduz a função palaciana com clareza; סַף significa literalmente 'soleira', mas aqui designa a entrada ou porta sob guarda.
- source_word: וַיְבַקְשׁוּ
  choice: procuraram
  rationale: Preserva o sentido básico de 'buscar/procurar' e expressa intenção hostil sem acrescentar explicitamente a ideia de conspiração.
- source_word: לִשְׁלֹחַ יָד
  choice: levantar a mão contra
  rationale: Conserva a imagem do idioma hebraico e comunica ação violenta pretendida, sem restringi-la indevidamente a um método específico.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuero
  rationale: Emprega a forma portuguesa tradicional correspondente ao nome hebraico, sem substituí-la pela identificação histórica comum com Xerxes.
