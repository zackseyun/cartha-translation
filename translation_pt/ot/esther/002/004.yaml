  text: וְ/הַֽ/נַּעֲרָ֗ה אֲשֶׁ֤ר תִּיטַב֙ בְּ/עֵינֵ֣י הַ/מֶּ֔לֶךְ תִּמְלֹ֖ךְ תַּ֣חַת וַשְׁתִּ֑י וַ/יִּיטַ֧ב הַ/דָּבָ֛ר בְּ/עֵינֵ֥י הַ/מֶּ֖לֶךְ וַ/יַּ֥עַשׂ כֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: pt
  text: E que a jovem que agradar ao rei se torne rainha no lugar de Vasti.[a] A proposta agradou ao rei,[b] e ele fez assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reine no lugar de Vasti”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “A proposta foi boa aos olhos do rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: a jovem
  rationale: נַעֲרָה designa uma pessoa jovem do sexo feminino. “A jovem” é natural e atual em português, sem sugerir necessariamente uma criança nem recorrer ao tom arcaico de “donzela”.
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: que agradar ao rei
  rationale: A expressão idiomática com יטב e בְּעֵינֵי indica aquilo que é bom ou agradável no julgamento de alguém. “Agradar ao rei” comunica o sentido com clareza e preserva o valor verbal.
- source_word: תִּמְלֹךְ
  choice: se torne rainha
  rationale: Embora מלך signifique literalmente “reinar”, neste contexto a forma feminina descreve a jovem que substituirá Vasti na posição real. “Se torne rainha” é idiomático e explicita a função contextual sem acrescentar uma ideia estranha ao texto.
- source_word: תַּחַת וַשְׁתִּי
  choice: no lugar de Vasti
  rationale: תַּחַת expressa aqui substituição. “No lugar de” é uma formulação natural e inequívoca em português.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: A proposta agradou ao rei
  rationale: דָּבָר pode significar palavra, assunto ou proposta. Como o contexto imediato apresenta um curso de ação sugerido pelos servos, “a proposta” expressa adequadamente o referente; “agradou ao rei” mantém o paralelo lexical com a primeira oração.
- source_word: וַיַּעַשׂ כֵּן
  choice: e ele fez assim
  rationale: Tradução direta da fórmula narrativa, preservando de modo natural a referência do pronome ao rei e a ideia de que executou o que fora proposto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “agradar” procura refletir a repetição hebraica da raiz יטב, enquanto as notas registram a formulação mais literal e a alternativa para מלך.
