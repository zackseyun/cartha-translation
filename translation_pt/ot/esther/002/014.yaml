source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: pt
  text: À noite, ela entrava[a] e, pela manhã, voltava para a segunda casa das mulheres[b], sob os cuidados de Saasgaz, eunuco do rei e encarregado das concubinas. Ela não tornava a entrar na presença do rei, a menos que o rei tivesse prazer nela e ela fosse chamada pelo nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Entrar” alude à entrada nos aposentos ou na presença do rei; nesse contexto, implica acesso sexual sem declará-lo explicitamente.
    reason: cultural_note
  - marker: b
    text: Ou, de modo mais interpretativo, “o segundo harém”. Literalmente, “a segunda casa das mulheres”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֶרֶב
  choice: À noite
  rationale: A expressão temporal indica o período da tarde-noite. “À noite” é natural em português e se ajusta ao contraste com “pela manhã”.
- source_word: בָאָה
  choice: ela entrava
  rationale: Embora o verbo signifique literalmente “vir/chegar”, o contexto descreve a entrada nos aposentos do rei. O imperfeito expressa adequadamente a ação habitual.
- source_word: וּבַבֹּקֶר
  choice: e pela manhã
  rationale: Mantém a conjunção simples e a sequência temporal sem introduzir contraste adicional.
- source_word: שָׁבָה
  choice: voltava
  rationale: Reproduz o sentido de retornar e, pelo imperfeito, o caráter habitual da descrição.
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: a segunda casa das mulheres
  rationale: Preserva a formulação concreta do hebraico e a distinção entre dois alojamentos femininos, sem substituir no texto principal por “harém”, que é mais interpretativo.
- source_word: אֶל יַד
  choice: ficando aos cuidados de
  rationale: Traduz idiomaticamente a ideia hebraica de ser colocada sob a responsabilidade ou autoridade de alguém.
- source_word: שַׁעֲשְׁגַז
  choice: Saasgaz
  rationale: Transliteração adaptada à ortografia e à leitura correntes em português.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: eunuco do rei
  rationale: “Eunuco” é o sentido específico mais provável no contexto da corte persa, embora o termo também possa designar um oficial em certos contextos.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: encarregado das concubinas
  rationale: Expressa com naturalidade a função de guardar, supervisionar e ter sob responsabilidade.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: não tornava a entrar na presença do rei
  rationale: Conserva a ideia de entrar novamente e comunica em português natural a aproximação aos aposentos ou à presença do rei, sem explicitar além do hebraico a dimensão sexual implícita no contexto.
- source_word: כִּי אִם
  choice: a menos que
  rationale: Introduz com clareza a única exceção à regra descrita.
- source_word: חָפֵץ בָּהּ
  choice: tivesse prazer nela
  rationale: Preserva a amplitude do verbo, que pode envolver agrado, prazer ou desejo, sem o reduzir exclusivamente ao desejo sexual.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: e ela fosse chamada pelo nome
  rationale: Reproduz a expressão hebraica e indica uma convocação pessoal e específica.
