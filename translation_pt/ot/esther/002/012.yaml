  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: pt
  text: 'Quando chegava a vez de cada moça ir ao rei Assuero, depois de cumprir os doze meses prescritos para as mulheres — pois assim se completava o período dos tratamentos de beleza: seis meses com óleo de mirra e seis meses com especiarias e com cosméticos para as mulheres —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר נַעֲרָה וְנַעֲרָה
  choice: a vez de cada moça
  rationale: Reproduz de modo natural a construção distributiva hebraica, que se refere individualmente a cada jovem.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: ir ao rei
  rationale: Mantém a formulação discreta e potencialmente eufemística do hebraico, sem explicitar além do texto a natureza do encontro.
- source_word: כְּדָת הַנָּשִׁים
  choice: prescritos para as mulheres
  rationale: Expressa דָּת como norma ou prescrição oficial neste contexto, sem a rigidez possivelmente enganosa de 'lei'.
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: o período dos tratamentos de beleza
  rationale: Comunica o sentido contextual de cuidados cosméticos e preparação corporal; 'período' representa idiomaticamente o hebraico 'dias'.
- source_word: שֶׁמֶן הַמֹּר
  choice: óleo de mirra
  rationale: Equivalente direto e tradicional, claro em português.
- source_word: בַּבְּשָׂמִים וּבְתַמְרוּקֵי הַנָּשִׁים
  choice: com especiarias e outros cosméticos usados pelas mulheres
  rationale: Distingue as substâncias aromáticas dos demais preparados cosméticos e evita a expressão pouco natural 'cosméticos das mulheres'.
theological_decisions:
- issue: Possível caráter sexual de 'ir ao rei'
  choice: Preservar a expressão indireta 'ir ao rei'
  alternative: Explicitar 'ter relações com o rei' ou suavizar como 'comparecer diante do rei'
  rationale: O hebraico é deliberadamente não explícito; a tradução conserva tanto a implicação narrativa quanto a reserva lexical da fonte.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e legibilidade brasileira. A pontuação mantém o versículo como oração ainda ligada à continuação do versículo 13.
