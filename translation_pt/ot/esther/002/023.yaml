base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: pt
  text: Quando o caso foi investigado e confirmado, os dois foram pendurados numa árvore[a]. E isso foi registrado no livro das crônicas, na presença do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foram pendurados num madeiro» ou «numa estaca». O hebraico diz literalmente «foram pendurados numa árvore», mas o método persa exato de execução pode ter envolvido empalação ou exposição pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר וַיִּמָּצֵא
  choice: Quando o caso foi investigado e confirmado
  rationale: A formulação comunica em português corrente a investigação do relato e sua posterior comprovação, preservando a sequência e a nuance judicial das formas passivas hebraicas.
- source_word: וַיִּתָּלוּ שְׁנֵיהֶם
  choice: os dois foram pendurados
  rationale: Mantém a referência enfática aos dois conspiradores e traduz תלה sem especificar um método de execução mais preciso do que o verbo hebraico permite.
- source_word: עַל עֵץ
  choice: num madeiro
  rationale: עֵץ pode significar árvore, madeira ou uma estrutura de madeira. Neste contexto de execução, “madeiro” é natural, digno e evita sugerir necessariamente uma árvore viva; a possível estaca ou empalação é indicada em nota.
- source_word: וַיִּכָּתֵב
  choice: E isso foi registrado
  rationale: “Registrado” expressa naturalmente o ato de consignar o acontecimento por escrito nos anais oficiais.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: no livro das crônicas
  rationale: Designa de modo reconhecível e fiel o registro oficial dos acontecimentos da corte.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: na presença do rei
  rationale: Reproduz diretamente o sentido espacial e cortesão de לִפְנֵי, sem decidir se o rei supervisionou pessoalmente a redação.
