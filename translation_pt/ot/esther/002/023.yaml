  naturalness: O português é claro, moderno e adequado ao registro narrativo. «Os dois» é natural e preserva a referência explícita aos dois homens. «Numa árvore» pode soar mais literal, mas é apropriado aqui porque a nota esclarece a possível referência a uma estrutura de madeira.
  terminology: «Livro das crônicas» comunica adequadamente o livro de anais oficiais; «na presença do rei» reproduz bem לִפְנֵי הַמֶּלֶךְ. A nota deve apresentar «madeiro» e «estaca» como alternativas interpretativas, não combinar de modo pouco natural «árvore ou estaca» após «empalados».
