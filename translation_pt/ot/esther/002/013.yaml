base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: pt
  text: 'E era assim que a jovem ia ao rei: tudo o que ela pedisse lhe seria dado para levar consigo, desde a casa das mulheres até a casa do rei.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tudo o que ela dissesse». O hebraico diz literalmente «tudo o que ela dissesse», mas, neste contexto, refere-se ao que ela pedisse para levar consigo.'
    reason: lexical_alternative
  - marker: b
    text: «Casa das mulheres» traduz formalmente a expressão hebraica e se refere aos aposentos destinados às mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: E era assim
  rationale: A combinação da preposição ב com o demonstrativo זה introduz aqui o procedimento anteriormente descrito; a formulação portuguesa expressa naturalmente esse valor circunstancial e habitual.
- source_word: הַנַּעֲרָה
  choice: a jovem
  rationale: נַעֲרָה designa uma pessoa jovem do sexo feminino. «A jovem» é atual, digna e evita tanto uma indicação excessivamente infantil quanto um tom arcaico.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: ia ao rei
  rationale: בוא com אֶל pode significar ir ou vir até alguém. Neste relato de um procedimento habitual, «ia ao rei» é claro e idiomático.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: tudo o que ela pedisse
  rationale: Literalmente, a expressão diz «tudo o que ela dissesse», mas o contexto mostra que se trata do que a jovem solicitasse para levar. A tradução explicita o sentido contextual sem acrescentar o objeto do pedido.
- source_word: יִנָּתֵן לָהּ
  choice: lhe seria dado
  rationale: O nifal de נתן é passivo, «ser dado». O imperfeito tem valor habitual ou procedimental, bem representado pelo condicional português.
- source_word: לָבוֹא עִמָּהּ
  choice: para levar consigo
  rationale: O infinitivo de בוא com עִם indica que aquilo que lhe era dado a acompanharia em sua ida. «Levar consigo» comunica naturalmente essa relação em português.
- source_word: מִבֵּית הַנָּשִׁים
  choice: desde a casa das mulheres
  rationale: A tradução mantém a expressão hebraica formal e evita introduzir o termo culturalmente interpretativo «harém» no texto principal.
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: até a casa do rei
  rationale: A preposição עַד marca o ponto de chegada, e בֵּית הַמֶּלֶךְ significa literalmente «casa do rei». A formulação preserva tanto a preposição quanto a correspondência lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O pretérito imperfeito em «era» e «ia», junto do condicional «seria dado», apresenta a prática habitual descrita pelo versículo. Mantiveram-se «casa das mulheres» e «casa do rei» para preservar a imagem lexical hebraica; notas esclarecem a expressão cultural e a leitura mais literal de תֹּאמַר.
