  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: pt
  text: 'Então Harbona, um dos eunucos que serviam diante do rei, disse: “Além disso, veja! A estrutura de madeira[a] que Hamã fez para Mardoqueu, o homem que falou em favor do rei[b], está erguida junto à casa de Hamã; tem cinquenta côvados de altura.” O rei disse: “Pendure Hamã nela.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a madeira” ou “a árvore”. Aqui, o termo se refere a uma estrutura de execução, tradicionalmente chamada de “forca”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que falou bem a respeito do rei” ou “que falou para o bem do rei”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, possivelmente: “Empale Hamã nela”. A terminologia hebraica pode indicar, de modo mais amplo, a suspensão ou exposição de alguém numa estrutura de madeira, não necessariamente o enforcamento numa forca de modelo posterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: Harbona
  rationale: Transliteração corrente e legível do nome hebraico em português.
- source_word: הַסָּרִיסִים
  choice: eunucos
  rationale: No contexto da corte persa, o termo designa diretamente eunucos, embora também possa ter o sentido mais amplo de oficiais da corte.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: que serviam diante do rei
  rationale: Explicita de modo natural que Harbona era um dos atendentes presentes na corte, sem reduzir a expressão a uma localização momentânea.
- source_word: גַּם הִנֵּה
  choice: Além disso, veja!
  rationale: Preserva tanto a força aditiva de גַּם quanto o chamado enfático de atenção expresso por הִנֵּה.
- source_word: הָעֵץ
  choice: estrutura de madeira
  rationale: O substantivo significa literalmente árvore ou madeira; no contexto, refere-se a uma estrutura destinada à execução. A formulação evita impor a imagem de uma forca moderna.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: falou em favor do rei
  rationale: Expressa o sentido benéfico das palavras de Mardoqueu para o rei, mantendo a formulação relativamente aberta.
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: está erguida junto à casa de Hamã
  rationale: Reproduz o estado presente indicado pelo particípio e usa uma expressão locativa natural, sem afirmar que a estrutura ficava dentro do edifício.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: tem cinquenta côvados de altura
  rationale: Mantém a unidade antiga e comunica com clareza que a medida se refere à altura.
- source_word: תְּלֻהוּ עָלָיו
  choice: Pendurem Hamã nela
  rationale: O pronome hebraico se refere a Hamã pelo contexto. Nomeá-lo evita em português uma possível confusão com Mardoqueu, o homem mencionado imediatamente antes; a nota preserva a amplitude do método de execução.
