translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Estrutura de madeira” preserva a ambiguidade histórica do instrumento; “Pendurem” mantém a ligação lexical com o hebraico, enquanto a nota registra a possibilidade de empalamento. Os três marcadores aparecem no texto principal.
