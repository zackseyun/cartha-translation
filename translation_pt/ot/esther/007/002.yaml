base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: pt
  text: 'No segundo dia, no banquete de vinho[a], o rei disse novamente a Ester: “Qual é a sua petição, rainha Ester? Ela lhe será concedida. E qual é o seu pedido? Até a metade do reino[b], ele será atendido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “banquete do vinho”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “até a metade do reino” é uma fórmula régia que manifesta favor extraordinário; não precisa indicar uma proposta literal de dividir o reino.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם
  choice: tornou a dizer
  rationale: No contexto do segundo banquete, גַּם assinala a repetição da pergunta do rei. A locução portuguesa comunica essa continuidade de modo natural.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: No segundo dia
  rationale: Mantém diretamente a expressão temporal hebraica, sem substituí-la por “no dia seguinte”.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: durante o banquete com vinho
  rationale: Expressão clara em português atual que conserva a menção explícita ao vinho e o cenário festivo.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: Qual é a sua petição
  rationale: “Petição” preserva o tom formal de um pedido apresentado à autoridade real.
- source_word: וְתִנָּתֵן לָךְ
  choice: Ela lhe será concedida
  rationale: O passivo corresponde ao hebraico, e “concedida” é idiomático para uma petição real.
- source_word: בַּקָּשָׁתֵךְ
  choice: o seu pedido
  rationale: “Pedido” reproduz a variação vocabular do hebraico em relação a שְׁאֵלָה sem criar uma diferença semântica excessiva.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Até a metade do reino
  rationale: Conserva a forma do hebraico, que diz “o reino”, e a amplitude enfática da oferta.
- source_word: וְתֵעָשׂ
  choice: ele será atendido
  rationale: Em português, atender um pedido exprime naturalmente que ele será realizado, preservando o sentido passivo/resultativo da forma hebraica.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: rainha Ester
  rationale: Esta é a ordem normal do título em português e mantém o tratamento honorífico.
