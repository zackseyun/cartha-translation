revisions:
- from: Então o rei se levantou furioso do banquete de vinho e foi para o jardim do palácio[a]. Hamã, porém, ficou para implorar à rainha Ester pela própria vida[b], pois viu que o rei já havia decidido a sua ruína[c].
  to: Então o rei, tomado de ira, levantou-se do banquete de vinho e foi para o jardim do palácio[a]. Hamã, porém, permaneceu para implorar à rainha Ester por sua vida[b], pois viu que a desgraça contra ele já estava decidida pelo rei[c].
  rationale: 'A revisão mantém o sentido e o registro do rascunho, mas torna mais transparente a relação sintática da oração final com o hebraico: a desgraça contra Hamã, e não apenas uma formulação abstrata de condenação, já estava fixada pelo rei. Também substitui “ficou” por “permaneceu”, mais preciso no contraste narrativo. As notas conservam as alternativas lexicais e culturais relevantes.'
