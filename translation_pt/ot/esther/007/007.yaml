base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: pt
  text: Então o rei, tomado de ira, levantou-se do banquete de vinho e foi para o jardim do palácio[a]. Hamã, porém, permaneceu para implorar à rainha Ester por sua vida[b], pois viu que a desgraça contra ele já estava decidida pelo rei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jardim do pavilhão” ou “jardim do complexo palaciano”. O termo hebraico pode designar um palácio, pavilhão ou edifício do complexo real.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “permaneceu de pé para buscar sua vida da parte da rainha Ester”. A expressão significa pedir que sua vida fosse poupada.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “pois viu que o mal contra ele estava decidido da parte do rei”. O termo traduzido por “desgraça” também pode significar “mal”, “ruína” ou “calamidade”, e a expressão indica que o desfecho adverso vindo do rei já estava definido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: furioso
  rationale: חֵמָה indica ira intensa. “Furioso” comunica essa força em português corrente sem tornar a frase pesada.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: do banquete de vinho
  rationale: Preserva tanto a ideia de banquete quanto a menção explícita ao vinho, importante no vocabulário narrativo de Ester.
- source_word: גִּנַּת הַבִּיתָן
  choice: o jardim do palácio
  rationale: גִּנָּה é “jardim”, e בִּיתָן pode designar o palácio, pavilhão ou complexo palaciano. “Jardim do palácio” é claro e adequado ao contexto persa.
- source_word: עָמַד
  choice: ficou
  rationale: Embora o verbo possa significar literalmente “ficou de pé”, aqui ele contrasta a saída do rei com a permanência de Hamã. “Ficou” expressa naturalmente essa função narrativa.
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: para implorar ... pela própria vida
  rationale: A expressão descreve o pedido desesperado de Hamã para que sua vida fosse poupada. “Implorar pela própria vida” é idiomático e mantém a intensidade.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: à rainha Ester
  rationale: A ordem do título e do nome segue o uso natural do português e preserva o conteúdo do hebraico.
- source_word: כִּי רָאָה
  choice: pois viu
  rationale: כִּי introduz a razão da súplica, e “viu” mantém o valor básico de רָאָה, aqui no sentido de perceber ou reconhecer.
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה
  choice: que ... já havia decidido a sua ruína
  rationale: A construção comunica que a calamidade destinada a Hamã estava resolvida ou fixada. A formulação portuguesa transmite a finalidade da decisão sem reproduzir uma sintaxe pouco natural.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: o rei ... havia decidido
  rationale: A preposição marca a origem da decisão. A reestruturação em voz ativa torna a agência do rei clara e natural em português.
