translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A tradução usa equivalência ótima: mantém os elementos centrais e a intensidade do hebraico, mas reestrutura a oração final para soar natural. As ambiguidades de בִּיתָן e רָעָה, bem como a forma mais literal da súplica de Hamã, são preservadas em notas.'
