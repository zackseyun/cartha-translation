base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male slaves and female slaves, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: pt
  text: Pois fomos vendidos, eu e meu povo, para sermos destruídos, mortos e exterminados. Mas, se tivéssemos sido vendidos como escravos e escravas, eu teria ficado calada, pois o adversário não se compara ao dano causado ao rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois o adversário não compensaria o dano ao rei”. O hebraico pode referir-se ao dano, à perda ou ao incômodo causado ao rei; a relação exata de comparação ou compensação é discutida.'
    reason: Preserva a ambiguidade sintática e lexical de שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ sem fixar no texto principal uma interpretação exclusivamente financeira.
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: fomos vendidos
  rationale: Preserva a metáfora comercial do passivo de מכר e prepara o contraste com a venda literal como escravos.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Expressa naturalmente a identificação étnica e nacional de Ester com o grupo ameaçado.
- source_word: לְהַשְׁמִיד לַהֲרוֹג וּלְאַבֵּד
  choice: para sermos destruídos, mortos e exterminados
  rationale: Mantém a acumulação retórica de três verbos quase sinônimos e apresenta o destino sob a perspectiva das vítimas.
- source_word: וְאִלּוּ
  choice: Se tivéssemos
  rationale: Introduz de modo natural em português a situação hipotética contrária aos fatos, em contraste com a ameaça real.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: como escravos e escravas
  rationale: Preserva tanto a condição de escravidão quanto a distinção explícita entre homens e mulheres.
- source_word: הֶחֱרַשְׁתִּי
  choice: eu teria ficado calada
  rationale: Reproduz o valor contrafactual do perfeito e concorda com a identidade feminina da personagem que fala.
- source_word: הַצָּר
  choice: o adversário
  rationale: Mantém o sentido de agente hostil e se ajusta ao contexto da corte sem tornar o termo mais específico do que o hebraico.
- source_word: שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: não poderia compensar o prejuízo do rei
  rationale: Oferece uma formulação portuguesa inteligível para uma expressão hebraica difícil, preservando a ideia de equivalência entre o adversário e a perda real; a ambiguidade é registrada em nota.
theological_decisions: []
