revisions:
- from: Pois fomos vendidos, eu e o meu povo, para sermos destruídos, mortos e exterminados. Se tivéssemos sido vendidos como escravos e escravas, eu teria ficado calada, pois o adversário não poderia compensar o prejuízo do rei.[a]
  to: Pois fomos vendidos, eu e meu povo, para sermos destruídos, mortos e exterminados. Mas, se tivéssemos sido vendidos como escravos e escravas, eu teria ficado calada, pois o adversário não se compara ao dano causado ao rei.[a]
  rationale: A revisão conserva as escolhas sólidas do rascunho e ajusta a cláusula final para refletir mais precisamente sua ambiguidade e sua função argumentativa. «Dano causado ao rei» não pressupõe perda apenas financeira, e a nota registra a alternativa de compensação. «Mas» explicita o contraste do hebraico.
