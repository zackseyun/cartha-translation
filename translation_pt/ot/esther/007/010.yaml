  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: pt
  text: Então penduraram Hamã no madeiro que ele havia preparado para Mardoqueu[a], e a fúria do rei se acalmou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “empalaram Hamã na estaca que ele havia preparado para Mardoqueu”. O hebraico usa עֵץ (“árvore”, “madeira”, “poste” ou “estaca”), e o verbo pode indicar, de modo mais amplo, que alguém foi pendurado ou suspenso. O método exato de execução é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: penduraram
  rationale: O verbo תלה significa suspender ou pendurar. A escolha preserva a amplitude do hebraico sem definir no texto principal se a execução ocorreu por enforcamento ou empalamento.
- source_word: הָמָן
  choice: Hamã
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: עַל הָעֵץ
  choice: no madeiro
  rationale: עֵץ pode significar árvore, madeira, poste ou instrumento de execução. “Madeiro” é natural no contexto e evita especificar indevidamente uma forca ou uma estaca.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: que ele havia preparado para Mardoqueu
  rationale: Preserva o sentido de הכין, “preparar, deixar pronto”, e a ironia narrativa de Hamã sofrer o destino planejado para Mardoqueu.
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: e a fúria do rei
  rationale: חֵמָה expressa ira intensa; “fúria” comunica essa força em português atual.
- source_word: שָׁכָכָה
  choice: se acalmou
  rationale: שׁכך indica diminuir, aquietar-se ou cessar. “Se acalmou” é claro, idiomático e concorda naturalmente com “fúria”.
