lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: O adversário e inimigo
  rationale: A expressão identifica Hamã como homem hostil, adversário e inimigo. Em português, os substantivos coordenados preservam a força acusatória sem a construção pouco natural “homem adversário e inimigo”.
- source_word: הָמָן הָרָע הַזֶּה
  choice: este homem perverso, Hamã
  rationale: Preserva o demonstrativo enfático e o juízo moral de רָע, ao mesmo tempo que produz uma acusação direta e natural em português.
- source_word: נִבְעַת
  choice: ficou aterrorizado
  rationale: O verbo expressa terror ou consternação súbita e intensa; “ficou aterrorizado” comunica claramente essa reação.
- source_word: מִלִּפְנֵי
  choice: diante de
  rationale: Mantém a ideia espacial e relacional de estar perante o rei e a rainha, cuja presença provoca o terror de Hamã.
