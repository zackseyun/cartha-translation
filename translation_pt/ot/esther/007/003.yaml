base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: pt
  text: 'Então a rainha Ester respondeu: “Se encontrei favor aos teus olhos, ó rei, e se isso parecer bem ao rei, que a minha vida me seja dada[a] em resposta à minha petição, e o meu povo, em resposta ao meu pedido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “que me seja concedida a vida”. O hebraico diz mais literalmente: “que a minha vida me seja dada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן אֶסְתֵּר הַמַּלְכָּה וַתֹּאמַר
  choice: Então a rainha Ester respondeu
  rationale: A forma narrativa introduz a resposta de Ester. Em português, «respondeu» comunica naturalmente a combinação hebraica «respondeu e disse» sem produzir uma construção pesada.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Se achei favor aos teus olhos
  rationale: Preserva a imagem da fórmula cortesã hebraica e permanece clara em português moderno.
- source_word: הַמֶּלֶךְ
  choice: ó rei
  rationale: Expressa o vocativo respeitoso do discurso dirigido ao rei.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: e se isso parecer bem ao rei
  rationale: Equivalente idiomático da fórmula hebraica que apela à aprovação ou ao agrado do monarca, mantendo a referência ao rei na terceira pessoa.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: que a minha vida me seja dada
  rationale: Mantém a forma passiva do hebraico e traduz נֶפֶשׁ segundo o contexto de ameaça de morte, no qual significa a vida de Ester, não uma «alma» imaterial.
- source_word: בִּשְׁאֵלָתִי
  choice: conforme a minha petição
  rationale: שְׁאֵלָה designa uma petição; «conforme» expressa de modo inteligível a relação circunstancial ou referencial marcada pela preposição בְּ.
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: e o meu povo, conforme o meu pedido
  rationale: Preserva a elipse verbal e a variação entre os dois termos hebraicos próximos, vertidos como «petição» e «pedido».
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com a formalidade apropriada ao ambiente da corte. Conserva-se a imagem «favor aos teus olhos», a referência cortesã ao rei na terceira pessoa e o paralelismo elíptico entre a vida de Ester e o seu povo.
