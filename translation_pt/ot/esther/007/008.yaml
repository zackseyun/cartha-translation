base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: pt
  text: 'O rei voltou do jardim do palácio para a sala do banquete de vinho, e Hamã estava se lançando sobre o divã onde Ester se encontrava. Então o rei disse: “Será que ele vai até mesmo atacar a rainha comigo dentro do palácio?” Mal a palavra saiu da boca do rei, cobriram o rosto de Hamã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: sala do banquete de vinho
  rationale: Reproduz os componentes da expressão hebraica em português natural; בֵּית designa aqui o recinto do banquete, e מִשְׁתֵּה הַיַּיִן, um banquete em que se bebia vinho.
- source_word: נֹפֵל עַל הַמִּטָּה
  choice: estava se lançando sobre o divã
  rationale: O particípio נֹפֵל apresenta a ação em curso. 'Se lançando' preserva a possibilidade de Hamã estar prostrando-se para suplicar, sem sugerir apenas uma queda acidental; 'divã' corresponde ao móvel reclinável usado no banquete.
- source_word: לִכְבּוֹשׁ
  choice: atacar
  rationale: O verbo pode significar subjugar, dominar ou violentar. No contexto, a acusação do rei tem conotação de agressão sexual, mas 'atacar' preserva parte da amplitude e evita tornar explícito além do hebraico.
- source_word: עִמִּי בַּבָּיִת
  choice: na minha presença, dentro do palácio
  rationale: Comunica idiomaticamente a indignação expressa por 'comigo na casa'; neste contexto, בַּיִת se refere ao palácio, não a uma residência comum.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: cobriram o rosto de Hamã
  rationale: Embora a forma verbal possa ser lida literalmente como 'o rosto de Hamã foi coberto', o agente implícito é melhor expresso em português pelo plural indeterminado, em consonância com o contexto cortesão.
theological_decisions:
- issue: Natureza da acusação feita pelo rei contra Hamã
  choice: atacar a rainha
  alternative: violentar a rainha / dominar a rainha
  rationale: A tradução mantém a forte acusação de agressão sem decidir de modo excessivamente específico se כבש designa aqui tentativa de estupro, violência física ou domínio coercitivo.
- issue: Postura de Hamã diante de Ester
  choice: estava se lançando sobre o divã
  alternative: estava caído sobre o divã / tinha se lançado sobre o divã
  rationale: 'Preserva o aspecto progressivo do particípio hebraico e a tensão narrativa: Hamã provavelmente suplicava, enquanto o rei interpreta a postura como agressão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a ironia e a ambiguidade narrativa do hebraico sem acrescentar explicações ao versículo.
