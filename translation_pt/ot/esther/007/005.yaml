  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וַ/יֹּ֖אמֶר לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה מִ֣י ה֥וּא זֶה֙ וְ/אֵֽי זֶ֣ה ה֔וּא אֲשֶׁר מְלָא֥/וֹ לִבּ֖/וֹ לַ/עֲשׂ֥וֹת כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: pt
  text: 'Então o rei Assuero perguntou à rainha Ester: “Quem é ele e onde está[a] aquele que teve a ousadia de fazer uma coisa dessas?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente, “e qual deles é?”, se a expressão for entendida como um pedido de identificação, e não de localização.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “cujo coração o encheu para fazer assim”, expressão idiomática que significa ter a ousadia ou a presunção de fazer algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Então ... perguntou
  rationale: A repetição de וַיֹּאמֶר introduz e especifica a fala dirigida a Ester. Em português, “perguntou” expressa naturalmente a função interrogativa da fala sem reproduzir uma repetição pouco idiomática.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: o rei Assuero
  rationale: Mantém o título e a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: à rainha Ester
  rationale: A ordem portuguesa corrente comunica com clareza a aposição hebraica “a Ester, a rainha”.
- source_word: מִי הוּא זֶה
  choice: Quem é ele
  rationale: Preserva a pergunta enfática de identificação sem acrescentar “homem”, termo não explícito no hebraico.
- source_word: וְאֵי זֶה הוּא
  choice: e onde está
  rationale: אֵי normalmente pergunta por localização; no contexto, o rei exige tanto a identidade quanto o paradeiro do responsável.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: aquele que teve a ousadia
  rationale: A expressão hebraica, literalmente relacionada ao coração que enche ou impele a pessoa, é idiomática e indica atrevimento ou presunção. A tradução comunica esse sentido em português natural, enquanto a nota preserva a imagem original.
- source_word: לַעֲשׂוֹת כֵּן
  choice: de fazer uma coisa dessas
  rationale: כֵּן retoma a ação ameaçadora recém-descrita; esta formulação é natural e conserva a indignação implícita na pergunta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. A fala mantém o tom indignado e urgente do rei; as notas registram tanto a possível leitura alternativa quanto a imagem hebraica do coração.
