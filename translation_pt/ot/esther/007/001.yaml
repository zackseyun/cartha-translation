  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ וְ/הָמָ֔ן לִ/שְׁתּ֖וֹת עִם אֶסְתֵּ֥ר הַ/מַּלְכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/001.yaml
  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: pt
  text: Então o rei e Hamã vieram beber com a rainha Ester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E o rei e Hamã vieram beber com Ester, a rainha”.'
    reason: Alternativa lexical e sintática que reproduz mais de perto a conjunção inicial e a ordem do aposto no hebraico.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vieram
  rationale: O wayyiqtol de בוא faz a narrativa avançar e, com o sujeito composto “o rei e Hamã”, requer o plural em português. “Vieram” preserva o sentido básico sem acrescentar a especificidade de “entraram”.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Equivalente direto e natural de מֶלֶךְ com artigo; o contexto já identifica o rei persa.
- source_word: וְהָמָן
  choice: e Hamã
  rationale: A conjunção é traduzida diretamente, e o nome próprio segue a forma portuguesa tradicional.
- source_word: לִשְׁתּוֹת
  choice: beber
  rationale: O infinitivo de שׁתה significa literalmente “beber”. Embora o contexto seja um banquete, o hebraico não explicita “vinho” nem emprega aqui um verbo mais amplo para festejar.
- source_word: עִם
  choice: com
  rationale: Tradução direta da preposição de companhia.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Forma consagrada do nome próprio em português.
- source_word: הַמַּלְכָּה
  choice: a rainha Ester
  rationale: A ordem hebraica é literalmente “Ester, a rainha”, mas em português corrente o título antes do nome é mais natural e preserva o mesmo sentido.
- source_word: וַ
  choice: Então
  rationale: O waw narrativo marca sequência. “Então” comunica com naturalidade o avanço da narrativa, sem tornar a ligação excessivamente pesada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se o verbo literal “beber”, sem explicitar vinho ou transformar a ocasião em “banquete”. O ponto final vem após o marcador da nota para manter o marcador ligado à expressão anotada.
