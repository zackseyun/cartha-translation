base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/018.yaml
  text: Then Jeremiah said to King Zedekiah, “What have I sinned against you, against your servants, and against this people, that you have put me into the prison?”
translation:
  language: pt
  text: 'Então Jeremias disse ao rei Zedequias: “Que pecado cometi contra o senhor, contra os seus servos e contra este povo, para que vocês me colocassem na prisão?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה חָטָאתִי
  choice: Que pecado cometi
  rationale: A construção hebraica é literalmente “que pequei?”, mas em português natural a pergunta pede um complemento nominal; esta formulação preserva a acusação de culpa sem especificar um delito inexistente no texto.
- source_word: לְךָ וְלַעֲבָדֶיךָ וְלָעָם הַזֶּה
  choice: contra o senhor, contra os seus servos ou contra este povo
  rationale: A preposição לְ, ligada ao verbo “pecar”, indica as partes contra as quais teria sido cometida a ofensa. “Ou” torna natural em português a abrangência da pergunta retórica, sem alterar os três grupos do hebraico.
- source_word: כִּי נְתַתֶּם אֹתִי
  choice: para que vocês me tenham colocado
  rationale: כִּי introduz aqui a consequência ou fundamento alegado para a prisão. O verbo está no plural, por isso “vocês” preserva a mudança do tratamento singular ao rei para a responsabilidade plural dos envolvidos.
- source_word: בֵּית הַכֶּלֶא
  choice: na prisão
  rationale: A expressão significa literalmente “casa da prisão”, mas funciona idiomaticamente como “prisão” ou “cárcere”; “na prisão” é claro e atual.
theological_decisions:
- issue: Natureza do suposto pecado de Jeremias
  choice: Que pecado cometi
  alternative: Como pequei
  rationale: O texto não identifica uma transgressão específica nem confirma culpa; mantém-se a pergunta retórica de Jeremias sem absolvição ou condenação editorial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão. “O senhor” marca o tratamento respeitoso singular dirigido ao rei; “vocês” reflete o verbo hebraico plural na cláusula sobre a prisão. Não são necessárias notas de rodapé.
