  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/006.yaml
  text: Then the word of Yahweh came to Jeremiah the prophet[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio ao profeta Jeremias, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa de היה com waw consecutivo introduz o acontecimento seguinte. Em português, “Então ... veio” mantém a progressão sem recorrer ao arcaizante “e aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, “a palavra” é transparente e preserva a expressão tradicional de revelação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da comunicação; na construção “veio a”, esta é a forma natural em português.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: “Profeta” é o equivalente direto de נָבִיא; o artigo é preservado, e a expressão identifica a função de Jeremias.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da fala divina no versículo seguinte; “dizendo” conserva de modo conciso essa função formal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, sem inserir interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a fórmula profética preservada. A ordem “ao profeta Jeremias” é natural em português e corresponde à aposição hebraica. Não se acrescentou nota, pois a diferença entre “Então ... veio” e a forma mais literal “E aconteceu que ...” não altera o sentido e não requer marcação editorial.
