source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ אֶת יְהוּכַ֣ל בֶּן שֶֽׁלֶמְיָ֗ה וְ/אֶת צְפַנְיָ֤הוּ בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר הִתְפַּלֶּל נָ֣א בַעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/003.yaml
  text: Then King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah the priest to Jeremiah the prophet[a], saying, “Please pray to Yahweh our God for us.”
translation:
  language: pt
  text: 'Então o rei Zedequias enviou Jeucal[a], filho de Selemias, e o sacerdote Sofonias, filho de Maaseias, ao profeta Jeremias, dizendo: “Por favor, ore a Yahweh, nosso Deus, em nosso favor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Jeucal; em contexto relacionado, o nome aparece na forma abreviada Jucal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência narrativa em português.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: o rei Zedequias
  rationale: Forma corrente e idiomática em português para o título seguido do nome próprio.
- source_word: יְהוּכַל
  choice: Jeucal
  rationale: Transliteração portuguesa do nome hebraico presente neste versículo; a forma abreviada “Jucal” aparece em contexto relacionado.
- source_word: בֶּן שֶׁלֶמְיָה
  choice: filho de Selemias
  rationale: Mantém de modo claro e formal a relação filial expressa no hebraico.
- source_word: צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: o sacerdote Sofonias, filho de Maaseias
  rationale: A colocação do título antes do nome deixa claro, em português natural, que “o sacerdote” identifica Sofonias, conforme também indica o contexto de Jeremias.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: ao profeta Jeremias
  rationale: Ordem idiomática em português, sem perda do título profético.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente convencional do infinitivo quotativo que introduz discurso direto.
- source_word: הִתְפַּלֶּל נָא
  choice: Por favor, ore
  rationale: O imperativo de פלל significa “orar”, e נָא dá à solicitação um tom cortês e suplicante.
- source_word: בַעֲדֵנוּ
  choice: em nosso favor
  rationale: Expressa explicitamente a ideia de intercessão em benefício dos emissários e daqueles que representam.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta da forma com sufixo de primeira pessoa do plural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Identidade de “o sacerdote”
  choice: O título identifica Sofonias
  alternative: O título poderia ser lido, pela proximidade sintática, como referência a Maaseias
  rationale: Embora a sequência hebraica permita cautela sintática, Jeremias 29:25 e 29:29 identifica Sofonias como sacerdote; a redação portuguesa torna essa referência contextual explícita.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos em formas correntes. A ordem de alguns títulos foi ajustada para evitar ambiguidade involuntária e manter fluidez, sem alterar as relações expressas no texto.
