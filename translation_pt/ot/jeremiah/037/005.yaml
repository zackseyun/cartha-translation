  text: וְ/חֵ֥יל פַּרְעֹ֖ה יָצָ֣א מִ/מִּצְרָ֑יִם וַ/יִּשְׁמְע֨וּ הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עַל יְרוּשָׁלִַ֨ם֙ אֶת שִׁמְעָ֔/ם וַ/יֵּ֣עָל֔וּ מֵ/עַ֖ל יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/005.yaml
  text: Pharaoh’s army had come out from Egypt[a], and when the Chaldeans who were besieging Jerusalem heard the report about them[c][b], they withdrew from Jerusalem.
translation:
  language: pt
  text: O exército do faraó havia saído do Egito. Quando os caldeus[a], que sitiavam Jerusalém, ouviram a notícia sobre o exército do faraó[b], retiraram-se de Jerusalém[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os babilônios”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ouviram a notícia deles”, isto é, a notícia a respeito do exército do faraó.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “subiram de sobre Jerusalém”; neste contexto, a expressão indica que se afastaram do cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל פַּרְעֹה
  choice: o exército do faraó
  rationale: חֵיל, no contexto de movimentação militar, designa uma força armada; “exército” é claro e natural em português. פַּרְעֹה é vertido pelo título tradicional “faraó”.
- source_word: יָצָא מִמִּצְרָיִם
  choice: havia saído do Egito
  rationale: O qatal apresenta a saída do exército como situação anterior à reação subsequente dos caldeus; o mais-que-perfeito composto expressa naturalmente essa relação temporal.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: É a correspondência direta do etnônimo hebraico; “babilônios” é uma identificação contextual possível e fica registrada em nota.
- source_word: הַצָּרִים עַל יְרוּשָׁלִַם
  choice: que sitiavam Jerusalém
  rationale: O particípio de צור com עַל, neste contexto militar, descreve o cerco contínuo à cidade.
- source_word: אֶת שִׁמְעָם
  choice: a notícia a respeito deles
  rationale: שֵׁמַע significa “notícia, relato”; o sufixo masculino plural remete naturalmente ao exército do faraó. A formulação portuguesa explicita apenas a relação já indicada pelo pronome hebraico.
- source_word: וַיֵּעָלוּ מֵעַל יְרוּשָׁלִָם
  choice: retiraram-se de Jerusalém
  rationale: A expressão é literalmente “subiram/afastaram-se de sobre Jerusalém”, mas, no contexto do cerco, comunica que as forças se retiraram de sua posição contra a cidade sem precisar acrescentar que o cerco foi definitivamente encerrado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência foi dividida em duas frases para maior naturalidade sem alterar as relações narrativas. Evitou-se um marcador inicial como “Ora” ou “Então”, pois o hebraico contém apenas a conjunção narrativa וְ, sem uma palavra temporal explícita equivalente a “agora”.
