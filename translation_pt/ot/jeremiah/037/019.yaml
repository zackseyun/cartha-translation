base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/019.yaml
  text: And where are your prophets who prophesied to you[a], saying, ‘The king of Babylon will not come against you or against this land’?”
translation:
  language: pt
  text: 'E onde estão os seus profetas, que profetizaram a vocês[a], dizendo: “O rei da Babilônia não virá contra vocês nem contra esta terra”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre vocês nem sobre esta terra”. A preposição hebraica pode ser traduzida mais literalmente por “sobre”, mas aqui provavelmente indica avanço hostil; por isso, “contra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: E onde estão
  rationale: Preserva a conjunção e a força da pergunta retórica em português natural.
- source_word: נְבִיאֵיכֶם
  choice: os seus profetas
  rationale: Representa diretamente o plural com sufixo de segunda pessoa, com formulação corrente e digna.
- source_word: אֲשֶׁר נִבְּאוּ לָכֶם
  choice: que profetizaram a vocês
  rationale: A oração relativa identifica os profetas por sua atividade anterior; o pretérito perfeito se ajusta ao contexto.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente convencional do infinitivo hebraico que introduz discurso direto.
- source_word: לֹא יָבֹא
  choice: não virá
  rationale: O imperfeito negado expressa aqui uma predição futura.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução transparente da cadeia construta e forma consagrada em português.
- source_word: עֲלֵיכֶם
  choice: contra vocês
  rationale: Com o verbo de movimento e neste contexto militar, a preposição עַל tem sentido hostil; 'contra' comunica isso claramente.
- source_word: וְעַל הָאָרֶץ הַזֹּאת
  choice: nem contra esta terra
  rationale: Na frase negativa, 'nem' coordena naturalmente os dois alvos da alegação, enquanto 'esta terra' preserva a ênfase demonstrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural de segunda pessoa foi vertido por “vocês”, sem regionalismo marcado; a pergunta retórica e o contraste com a falsa profecia foram preservados.
