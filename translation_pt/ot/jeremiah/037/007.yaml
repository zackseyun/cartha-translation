base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/007.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Thus you shall say to the king of Judah, who sent you to me to inquire of me, ‘Behold, Pharaoh’s army, which came out to help you, has returned to its own land[c][b], Egypt.’'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Deus de Israel: Assim vocês dirão ao rei de Judá, que os enviou a mim para me consultar[a]: “Eis que o exército do faraó, que saiu para ajudá-los[b], voltou para a sua terra, o Egito.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para me buscar”. O verbo hebraico pode significar buscar ou consultar; neste contexto, refere-se a pedir uma resposta divina.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que está saindo para ajudá-los”. O hebraico emprega um particípio; o passado adotado no texto se ajusta à situação narrativa.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “voltou para a terra do Egito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética convencional com dignidade e naturalidade em português.
- source_word: לְדָרְשֵׁנִי
  choice: para me consultar
  rationale: Neste contexto profético, o verbo indica buscar de Deus uma resposta por intermédio de Jeremias; a formulação também preserva a primeira pessoa do hebraico.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a função enfática e o tom profético da partícula hebraica.
- source_word: חֵיל פַּרְעֹה
  choice: o exército do faraó
  rationale: חֵיל designa aqui uma força militar; 'exército' é claro e idiomático.
- source_word: הַיֹּצֵא לָכֶם לְעֶזְרָה
  choice: que saiu para ajudá-los
  rationale: O particípio é vertido pelo passado em vista da situação narrativa, sem eliminar em nota a possibilidade aspectual mais literal.
- source_word: שָׁב לְאַרְצוֹ מִצְרָיִם
  choice: voltou para sua terra, o Egito
  rationale: Reproduz o movimento de retorno, o sufixo possessivo e a aposição 'Egito' de modo natural.
theological_decisions:
- issue: Referência de לְדָרְשֵׁנִי na fala divina transmitida por Jeremias
  choice: para me consultar
  alternative: para consultar Yahweh por meu intermédio
  rationale: A tradução conserva a voz direta de Yahweh e não explicita além do hebraico o papel mediador do profeta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega 'vocês' para o plural dirigido aos enviados e mantém fórmulas proféticas reconhecíveis, sem arcaísmo excessivo.
