  naturalness: A redação é clara, moderna e adequada ao registro profético. «Assim vocês dirão» é idiomático para o público-alvo. A pontuação proposta preserva uma fala anunciada dentro da mensagem divina.
  terminology: «Yahweh», «Deus de Israel», «rei de Judá», «faraó» e «exército» são consistentes com o hebraico e com as decisões lexicais. «Consultar» é uma boa tradução contextual de לְדָרְשֵׁנִי.
