  text: וַ/יֵּצֵ֤א יִרְמְיָ֨הוּ֙ מִ/יר֣וּשָׁלִַ֔ם לָ/לֶ֖כֶת אֶ֣רֶץ בִּנְיָמִ֑ן לַ/חֲלִ֥ק מִ/שָּׁ֖ם בְּ/ת֥וֹךְ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/012.yaml
  text: Jeremiah went out from Jerusalem to go to the land of Benjamin[a], to receive his portion there among the people.
translation:
  language: pt
  text: Jeremias saiu de Jerusalém para ir à terra de Benjamim, a fim de receber de lá a sua parte[a] entre o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fim de reivindicar de lá uma parte entre o povo”. O infinitivo hebraico לַחֲלִק é difícil, e pode se referir a receber uma porção atribuída, repartir uma propriedade ou reivindicar uma parte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Preserva o sentido comum de יצא, indicando movimento para fora de Jerusalém, sem acrescentar a ideia mais forte de partida definitiva.
- source_word: מִירוּשָׁלִַם
  choice: de Jerusalém
  rationale: A preposição מִן indica movimento para longe da cidade.
- source_word: לָלֶכֶת
  choice: para ir
  rationale: O infinitivo expressa propósito; esta formulação simples mantém a estrutura do hebraico em português natural.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: à terra de Benjamim
  rationale: אֶרֶץ designa aqui a região tribal de Benjamim; “terra de Benjamim” preserva essa referência sem especificá-la excessivamente.
- source_word: לַחֲלִק
  choice: a fim de receber ali a sua parte
  rationale: O infinitivo é lexicalmente difícil. A tradução apresenta o sentido contextual provável de obter uma porção, enquanto a nota conserva alternativas legítimas.
- source_word: מִשָּׁם
  choice: ali
  rationale: No contexto, a forma aponta para o local em Benjamim. “Ali” é natural em português e evita a expressão pouco idiomática “de lá” após “receber sua parte”.
- source_word: בְּתוֹךְ הָעָם
  choice: entre o povo
  rationale: Traduz naturalmente a ideia de estar no meio do povo, sem restringir עָם a tropas.
