id: JER.37.10
reference: Jeremiah 37:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אִם הִכִּיתֶ֞ם כָּל חֵ֤יל כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים אִתְּ/כֶ֔ם וְ/נִ֨שְׁאֲרוּ בָ֔/ם אֲנָשִׁ֖ים מְדֻקָּרִ֑ים אִ֤ישׁ בְּ/אָהֳל/וֹ֙ יָק֔וּמוּ וְ/שָֽׂרְפ֛וּ אֶת הָ/עִ֥יר הַ/זֹּ֖את בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/010.yaml
  text: For even if you were to strike down the whole army of the Chaldeans who are fighting against you[a], and only wounded men remained among them, each in his tent[b], they would rise up and burn this city with fire.
translation:
  language: pt
  text: Pois, ainda que vocês derrotassem todo o exército dos caldeus que luta contra vocês[a], e entre eles restassem apenas homens gravemente feridos[b], cada um em sua tenda, eles se levantariam e incendiariam esta cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos babilônios”. O hebraico diz “dos caldeus”, designação étnica frequentemente usada em Jeremias para as forças babilônicas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “homens perfurados” ou “homens traspassados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, ainda que
  rationale: Expressa tanto a ligação explicativa de כִּי quanto a força concessiva e hipotética de אִם no contexto.
- source_word: הִכִּיתֶם
  choice: vocês derrotassem
  rationale: No cenário militar hipotético, נכה indica abater ou vencer; “derrotassem” comunica naturalmente a derrota da força inimiga sem arcaísmo.
- source_word: כָּל חֵיל כַּשְׂדִּים
  choice: todo o exército dos caldeus
  rationale: חֵיל designa aqui uma força militar, e a formulação preserva o substantivo coletivo e o etnônimo hebraico.
- source_word: הַנִּלְחָמִים אִתְּכֶם
  choice: que luta contra vocês
  rationale: O particípio concorda com o coletivo “exército”; neste contexto hostil, אֵת com לחם significa oposição.
- source_word: וְנִשְׁאֲרוּ בָם
  choice: e entre eles restassem apenas
  rationale: Mantém o sentido de permanecer ou sobrar; “apenas” explicita a força restritiva implícita no cenário extremo.
- source_word: אֲנָשִׁים מְדֻקָּרִים
  choice: homens gravemente feridos
  rationale: מְדֻקָּרִים denota homens perfurados ou traspassados. A expressão escolhida é natural e comunica a severidade sem especificar indevidamente a arma; a literalidade é registrada em nota.
- source_word: אִישׁ בְּאָהֳלוֹ
  choice: cada um em sua tenda
  rationale: Reproduz o uso distributivo de אִישׁ e preserva a referência singular.
- source_word: יָקֻמוּ
  choice: eles se levantariam
  rationale: O imperfeito prossegue o resultado hipotético e descreve a retomada dramática da ação.
- source_word: וְשָׂרְפוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ
  choice: e incendiariam esta cidade
  rationale: Comunica em português corrente o ato de queimar a cidade. O elemento instrumental “com fogo” é idiomaticamente incorporado em “incendiar”, evitando redundância pouco natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural, preserva “caldeus” no texto e mantém a intensidade do cenário hipotético sem linguagem arcaica.
