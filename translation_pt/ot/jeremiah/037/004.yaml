lexical_decisions:
- source_word: בָּא וְיֹצֵא
  choice: ia e vinha
  rationale: A expressão verbal descreve a liberdade de deslocamento de Jeremias. “Ia e vinha” conserva o paralelismo concreto do hebraico e soa natural em português, sem sugerir necessariamente a entrada e saída de um edifício.
- source_word: בְּתוֹךְ הָעָם
  choice: entre o povo
  rationale: Traduz naturalmente a ideia de estar e circular no meio da população, preservando o sentido de בְּתוֹךְ.
- source_word: וְלֹא נָתְנוּ אֹתוֹ
  choice: pois ainda não o tinham posto
  rationale: O contexto apresenta a ausência de encarceramento como explicação para Jeremias poder circular. “Pois” explicita essa relação discursiva; “ainda” torna clara a situação temporal pressuposta no contexto, e o mais-que-perfeito composto indica que a prisão não ocorrera até aquele momento.
- source_word: בֵּית הַכְּלִיא
  choice: na prisão
  rationale: A expressão significa literalmente “casa do confinamento”. “Na prisão” é a forma corrente, clara e digna em português; a construção concreta do hebraico é preservada em nota.
- source_word: וְיִרְמְיָהוּ
  choice: Jeremias
  rationale: O וְ narrativo liga a declaração ao contexto, mas não exige um marcador como “Ora” ou “Agora” em português. A omissão evita introduzir uma indicação temporal inexistente no texto-fonte.
