  text: Jeremiah was coming and going among the people[a], for they had not yet put him in the prison house.
translation:
  language: pt
  text: Jeremias ia e vinha entre o povo, pois ainda não o tinham posto na prisão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na casa do confinamento”.
