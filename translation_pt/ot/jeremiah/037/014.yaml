source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִרְמְיָ֜הוּ שֶׁ֗קֶר אֵינֶ֤/נִּי נֹפֵל֙ עַל הַ/כַּשְׂדִּ֔ים וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑י/ו וַ/יִּתְפֹּ֤שׂ יִרְאִיָּיה֙ בְּ/יִרְמְיָ֔הוּ וַ/יְבִאֵ֖/הוּ אֶל הַ/שָּׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/014.yaml
  text: But Jeremiah said[a], “That is a lie; I am not defecting to the Chaldeans.” But he would not listen to him[c][b], and Irijah seized Jeremiah and brought him to the officials.
translation:
  language: pt
  text: 'Mas Jeremias disse: “Isso é mentira! Não estou passando para o lado dos caldeus.” Irijá, porém, não lhe deu ouvidos; prendeu Jeremias e o levou às autoridades.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos oficiais”; o termo hebraico também pode designar príncipes ou outros altos governantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Isso é mentira!
  rationale: Reproduz como contestação direta e enfática a acusação feita contra Jeremias, em português natural.
- source_word: אֵינֶנִּי נֹפֵל עַל הַכַּשְׂדִּים
  choice: Não estou passando para o lado dos caldeus
  rationale: Neste contexto político-militar, נפל על significa passar para o lado inimigo, não cair literalmente. A formulação preserva o sentido sem exigir o termo mais interpretativo 'desertar'.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação étnico-política hebraica, tradicional e recorrente em Jeremias, em vez de substituí-la por 'babilônios'.
- source_word: וְלֹא שָׁמַע אֵלָיו
  choice: Irijá, porém, não lhe deu ouvidos
  rationale: O idioma português comunica recusa em aceitar a explicação, e o nome explícito elimina uma possível ambiguidade pronominal.
- source_word: וַיִּתְפֹּשׂ
  choice: prendeu
  rationale: No contexto, a ação é uma detenção. 'Prendeu' é claro e natural, embora o verbo também possa ser traduzido mais concretamente como 'agarrou' ou 'apoderou-se de'.
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: O termo designa aqui os altos responsáveis pelo governo, não necessariamente príncipes de sangue real.
- source_word: וַיְבִאֵהוּ אֶל
  choice: o levou às
  rationale: Expressa de modo natural em português o movimento de conduzir Jeremias até as autoridades.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para identificar Irijá como sujeito de “não lhe deu ouvidos”. O marcador [a] aparece no texto principal junto ao termo anotado.
