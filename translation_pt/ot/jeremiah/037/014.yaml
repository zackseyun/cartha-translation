  source_fidelity: 'O texto traduz com precisão o hebraico: a réplica enfática de Jeremias (שֶׁקֶר), a negação de que estivesse passando para o lado dos caldeus (נֹפֵל עַל), a recusa de Irijá em ouvi-lo e a subsequente apreensão e condução de Jeremias aos שָׂרִים. A explicitação de Irijá como sujeito de “não lhe deu ouvidos” corresponde ao referente contextual e melhora a clareza.'
