base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/002.yaml
  text: But he and his servants and the people of the land did not listen to the words of Yahweh that he spoke through Jeremiah the prophet[a][b][c].
translation:
  language: pt
  text: Mas nem ele, nem os seus servos, nem o povo da terra deram ouvidos às palavras de Yahweh, que ele falou por meio do profeta Jeremias[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedeceram às palavras de Yahweh”. O verbo hebraico pode significar “ouvir”, “dar ouvidos” ou, por implicação, “obedecer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o povo da terra”, expressão que pode se referir de modo amplo à população ou ao povo comum.'
    reason: cultural_note
  - marker: c
    text: 'Literalmente: “pela mão do profeta Jeremias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא שָׁמַע
  choice: Mas ... deram ouvidos
  rationale: A conjunção assume valor adversativo no contexto, e a expressão portuguesa “dar ouvidos” preserva a ideia de escutar com atenção e acatar, sem reduzir o verbo apenas a “ouvir” nem explicitar plenamente “obedecer”.
- source_word: הוּא וַ/עֲבָדָי/ו וְ/עַם הָ/אָרֶץ
  choice: nem ele, nem os seus servos, nem o povo da terra
  rationale: A correlação negativa com “nem” produz português natural e mantém os três grupos enumerados. “Servos” conserva a amplitude do termo cortesão, que também pode designar oficiais.
- source_word: דִּבְרֵי יְהוָה
  choice: as palavras de Yahweh
  rationale: O plural דִּבְרֵי é mantido como “palavras”, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ele falou
  rationale: A oração relativa modifica “as palavras de Yahweh”; o pronome mantém Yahweh como sujeito, conforme a estrutura hebraica.
- source_word: בְּ/יַד יִרְמְיָהוּ הַ/נָּבִיא
  choice: por meio do profeta Jeremias
  rationale: A expressão idiomática “pela mão de” indica mediação ou agência. “Por meio de” comunica esse sentido claramente em português atual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de שׁמע diante das palavras divinas
  choice: deram ouvidos
  alternative: obedeceram; ouviram
  rationale: A formulação preserva a tensão entre escutar e responder obedientemente, sem resolver a polissemia em favor de apenas um desses sentidos.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “nem” esclarece que nenhum dos três grupos deu ouvidos. A ordem “profeta Jeremias” é corrente em português e evita rigidez desnecessária.
