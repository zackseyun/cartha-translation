  source_fidelity: O texto traduz adequadamente a sucessão de Zedequias, a designação filial, a substituição de Conias e o sentido causativo de הִמְלִיךְ («constituiu rei»). A oração relativa refere-se, como no hebraico, a Conias. A nota sobre a forma hebraica de Nabucodonosor, porém, contém uma aproximação transliterativa incorreta.
  naturalness: O português é moderno, claro e de registro apropriado. «Tornou-se rei no lugar de» e «constituiu rei» são formulações naturais e preservam bem as relações do original.
