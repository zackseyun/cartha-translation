base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/001.yaml
  text: And King Zedekiah son of Josiah reigned in place of Coniah son of Jehoiakim[b][a], whom Nebuchadnezzar king of Babylon had made king in the land of Judah.
translation:
  language: pt
  text: Zedequias, filho de Josias, tornou-se rei no lugar de Conias, filho de Jeoaquim,[a] a quem Nabucodonosor,[b] rei da Babilônia, constituiu rei na terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, Conias; também chamado Jeconias em outras passagens.
    reason: alternative_reading
  - marker: b
    text: A grafia hebraica neste versículo corresponde mais de perto a Nabucadrezar; Nabucodonosor é a forma tradicional em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלָךְ
  choice: tornou-se rei
  rationale: No contexto de sucessão, a forma narrativa de מלך descreve a ascensão de Zedequias ao trono; “tornou-se rei” expressa isso com clareza em português.
- source_word: תַּחַת
  choice: no lugar de
  rationale: Marca substituição ou sucessão, e não posição subordinada.
- source_word: כָּנְיָהוּ
  choice: Conias
  rationale: Conserva a forma do nome presente no texto hebraico, sem harmonizá-la silenciosamente com Jeconias.
- source_word: הִמְלִיךְ
  choice: constituiu rei
  rationale: O hifil de מלך é causativo, isto é, fazer alguém rei; “constituiu rei” preserva essa força sem acrescentar a ideia mais administrativa de mera nomeação.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida; uma nota registra que a grafia hebraica deste versículo corresponde mais de perto a Nabucodrosor.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Reproduz diretamente a preposição e o substantivo do hebraico, sem introduzir o sentido de domínio expresso por “sobre”.
