base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/020.yaml
  text: So now[a], please hear, my lord the king; please let my plea fall before you, and do not send me back to the house of Jehonathan the scribe, lest I die there.
translation:
  language: pt
  text: Agora, por favor, ouça, meu senhor, o rei. Por favor, que a minha súplica chegue à sua presença[a]. Não me mande de volta à casa de Jônatas, o escriba, para que eu não morra ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Que a minha súplica caia diante de você”. Trata-se de uma expressão usada para apresentar humildemente uma petição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Introduz o apelo urgente e preserva tanto a progressão do discurso quanto a força conectiva de וְ.
- source_word: שְׁמַע נָא
  choice: ouça-me, por favor
  rationale: O imperativo de שׁמע com נָא expressa um pedido respeitoso e urgente; a inclusão de “me” é natural em português neste contexto de apelo pessoal.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, o rei
  rationale: Mantém o tratamento cortês possessivo e o título real, com formulação digna e inteligível em português atual.
- source_word: תִּפָּל נָא תְחִנָּתִי לְפָנֶיךָ
  choice: Que a minha súplica chegue à sua presença
  rationale: Reproduz de modo natural o idioma cortesão de apresentar uma petição a um superior; a metáfora literal de “cair” é preservada em nota.
- source_word: תְחִנָּתִי
  choice: minha súplica
  rationale: Expressa um pedido humilde e insistente, preservando o registro formal sem se tornar obscuro.
- source_word: וְאַל תְּשִׁבֵנִי
  choice: Não me mande de volta
  rationale: Traduz naturalmente o hifil causativo de שוב no contexto de custódia e retorno ao local de prisão.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: à casa de Jônatas, o escriba
  rationale: “Casa” preserva o termo concreto do hebraico, enquanto “escriba” mantém a identificação pelo ofício. “Jônatas” é a forma portuguesa consagrada do nome.
- source_word: וְלֹא אָמוּת שָׁם
  choice: para que eu não morra ali
  rationale: Explicita em português natural o resultado temido que fundamenta o pedido, sem acrescentar certeza sobre a morte.
