translation_notes:
  register: 'Português moderno, respeitoso e acessível, com tom de apelo perante a realeza. A tradução usa equivalência ótima: mantém os títulos e o conteúdo concreto do hebraico, mas verte de modo idiomático a expressão em que a súplica “cai” diante do rei.'
