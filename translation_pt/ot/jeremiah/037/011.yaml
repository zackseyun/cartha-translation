base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/011.yaml
  text: When the army of the Chaldeans had gone up from Jerusalem because of Pharaoh’s army,[a]
translation:
  language: pt
  text: Quando o exército dos caldeus se afastou de Jerusalém por causa do exército do faraó,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando o exército dos caldeus saiu de Jerusalém”. Neste contexto, a expressão indica que eles levantaram o cerco e se retiraram por causa do exército do faraó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Quando
  rationale: A fórmula narrativa introduz a circunstância temporal da oração; em português moderno, a transição é expressa naturalmente pela construção com “quando”, sem fórmula arcaica adicional.
- source_word: בְּהֵעָלוֹת
  choice: se afastou
  rationale: Embora עלה tenha como sentido básico “subir”, com מֵעַל e no contexto militar descreve o exército levantando sua posição contra a cidade e retirando-se dela. “Se afastou” comunica esse movimento sem explicitar além do texto a suspensão do cerco.
- source_word: חֵיל
  choice: exército
  rationale: Neste contexto, o termo designa uma força militar organizada; “exército” é claro e natural.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva diretamente o etnônimo hebraico, em vez de substituí-lo pela identificação contextual “babilônios”.
- source_word: מֵעַל יְרוּשָׁלִָם
  choice: de Jerusalém
  rationale: Literalmente, “de sobre Jerusalém”; no contexto de cerco, indica afastamento da posição mantida contra a cidade. A forma escolhida é idiomática em português.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Aqui a preposição indica a causa do afastamento diante da força egípcia.
- source_word: חֵיל פַּרְעֹה
  choice: o exército do faraó
  rationale: Expressa naturalmente em português a relação de pertencimento do construto hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a oração temporal incompleta, pois o versículo continua sintaticamente no seguinte. “Caldeus” preserva a designação do texto-fonte; “faraó” fica em minúscula por funcionar como título.
