base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/013.yaml
  text: And when he was at the Benjamin Gate[a], there was a captain of the guard there whose name was Irijah son of Shelemiah, son of Hananiah, and he seized Jeremiah the prophet, saying, “You are deserting to the Chaldeans!”
translation:
  language: pt
  text: 'Quando ele estava na Porta de Benjamim, havia ali um oficial encarregado da guarda, chamado Jerias, filho de Selemias, filho de Hananias. Ele agarrou o profeta Jeremias e disse: “Você está passando para o lado dos caldeus!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Você está desertando para os caldeus!” ou “Você está se entregando aos caldeus!”. A expressão hebraica diz literalmente “caindo para os caldeus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: ao Portão de Benjamim
  rationale: שַׁעַר seguido do nome Benjamim designa um portão da cidade. A formulação com nome próprio é natural em português e mantém a referência geográfica.
- source_word: בַּעַל פְּקִדֻת
  choice: um oficial encarregado da guarda
  rationale: A expressão indica alguém que exerce supervisão ou responsabilidade. No contexto de um portão urbano, trata-se do oficial responsável pela guarda, sem necessariamente especificar uma patente militar.
- source_word: יִרְאִיָּה
  choice: Jerias
  rationale: Forma portuguesa tradicional e inteligível do nome hebraico, preservando-o como nome próprio.
- source_word: וַיִּתְפֹּשׂ
  choice: agarrou
  rationale: O verbo descreve o ato físico e hostil de prender ou segurar alguém. “Agarrou” preserva essa força sem pressupor um procedimento jurídico formal.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Ordem idiomática em português que conserva integralmente a identificação de Jeremias como profeta.
- source_word: אֶל הַכַּשְׂדִּים אַתָּה נֹפֵל
  choice: Você está passando para o lado dos caldeus
  rationale: Neste contexto político-militar, נפל אֶל é uma expressão idiomática para passar ao lado adversário. A tradução comunica claramente a acusação e preserva “caldeus”, o termo étnico-político do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Oficial encarregado da guarda” evita atribuir uma patente não explicitada pelo hebraico; a fala direta mantém o tom abrupto da acusação.
