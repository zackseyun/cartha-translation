  source_fidelity: 'A sequência narrativa e o diálogo são bem transmitidos: Zedequias manda buscar Jeremias, consulta-o reservadamente e recebe a resposta profética. Contudo, «E acrescentou» atribui ao segundo וַיֹּאמֶר uma nuance de acréscimo que o hebraico não explicita; «disse» preserva melhor a simples progressão narrativa. Além disso, o singular de בְּיַד («na mão de») pode ser mantido em português sem prejuízo de naturalidade.'
  naturalness: O português é claro, moderno e de registro apropriado. «Mandou buscar Jeremias», «em sua própria casa» e «em segredo» são formulações naturais. «Então ele disse» é claro pelo antecedente imediato, Jeremias, e evita acrescentar interpretação.
  terminology: «Yahweh», «palavra da parte de Yahweh», «rei da Babilônia» e «será entregue» são escolhas adequadas e fiéis. A expressão «na mão do rei da Babilônia» conserva a imagem idiomática hebraica; a nota explica seu sentido de poder.
