base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/017.yaml
  text: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
translation:
  language: pt
  text: 'Então o rei Zedequias mandou buscar Jeremias e, em sua própria casa, interrogou-o em segredo[a]: “Há alguma palavra da parte de Yahweh?”


    Jeremias respondeu: “Há.” Então ele disse: “Você será entregue na mão do rei da Babilônia[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reservadamente”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, sob o poder do rei da Babilônia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: mandou buscar Jeremias
  rationale: A sequência literal, “enviou e o tomou”, descreve idiomaticamente o rei enviando alguém para trazer Jeremias. “Mandou buscar” comunica a ação com clareza e naturalidade; o nome explícito evita um pronome sem antecedente dentro do versículo isolado.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: interrogou-o
  rationale: שאל significa perguntar ou indagar. No contexto de uma consulta régia reservada, “interrogou-o” preserva a seriedade da pergunta sem implicar necessariamente um interrogatório hostil.
- source_word: בְּבֵיתוֹ
  choice: em sua própria casa
  rationale: בית significa literalmente “casa” e pode designar a residência real. “Casa” evita interpretar o termo especificamente como “palácio”; “própria” esclarece que o referente é o rei.
- source_word: בַּסֵּתֶר
  choice: em segredo
  rationale: O substantivo סֵתֶר denota segredo, ocultação ou lugar escondido. Aqui funciona adverbialmente e indica que a conversa não foi pública.
- source_word: הֲיֵשׁ דָּבָר מֵאֵת יְהוָה
  choice: Há alguma palavra da parte de Yahweh?
  rationale: דָּבָר pode significar “palavra” ou “mensagem”. “Palavra da parte de Yahweh” conserva a formulação profética e deixa o leitor perceber essa ressonância.
- source_word: יֵשׁ
  choice: Há
  rationale: A resposta hebraica é extremamente breve. “Há” mantém sua concisão e seu impacto dramático.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: nas mãos do rei da Babilônia
  rationale: A expressão hebraica literal “na mão de” significa estar sob o poder ou controle de alguém. O plural idiomático em português é natural e ainda conserva a imagem corporal.
- source_word: תִּנָּתֵן
  choice: você será entregue
  rationale: O nifal de נתן é passivo, “ser dado/entregue”. “Será entregue” é claro no contexto de sujeição ao rei babilônico sem especificar um agente que o hebraico não nomeia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino יהוה. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título.
- issue: Agente implícito em תִּנָּתֵן
  choice: 'forma passiva sem agente expresso: “você será entregue”'
  alternative: “Yahweh entregará você”
  rationale: Embora o contexto profético possa sugerir a ação ou permissão divina, o verbo hebraico está no passivo e não identifica explicitamente o agente. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a concisão dramática do diálogo, usa “casa” em vez do interpretativo “palácio” e conserva a fórmula profética “palavra da parte de Yahweh”. Todos os marcadores aparecem junto às expressões que explicam.
