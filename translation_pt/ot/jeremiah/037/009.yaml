base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/009.yaml
  text: 'Thus says Yahweh: Do not deceive yourselves[a], saying[c][b], ‘The Chaldeans will surely go away from us,’ for they will not go away.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Não se enganem[a], dizendo: ‘Os caldeus[b] certamente[c] se afastarão de nós’, pois não se afastarão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se iludam”. O idioma hebraico menciona literalmente “suas almas”, mas aqui expressa autoengano ou falsa confiança.'
    reason: lexical_alternative
  - marker: b
    text: “Caldeus” refere-se aqui às forças babilônicas.
    reason: cultural_note
  - marker: c
    text: 'Ou: “com toda a certeza se afastarão de nós”. O hebraico combina o infinitivo absoluto com o verbo conjugado para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro em linguagem digna e corrente, mantendo o nome divino como nome próprio.
- source_word: אַל תַּשִּׁיאוּ נַפְשֹׁתֵיכֶם
  choice: Não enganem a si mesmos
  rationale: O idioma hebraico, que inclui literalmente “suas almas”, adverte aqui contra o autoengano e a falsa confiança; uma tradução literal seria obscura em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo do autoengano e conserva a construção participial simples do hebraico.
- source_word: הָלֹךְ יֵלְכוּ
  choice: certamente se retirarão
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente” comunica essa ênfase, enquanto “se retirarão” explicita naturalmente o movimento militar no contexto.
- source_word: מֵעָלֵינוּ
  choice: daqui
  rationale: No contexto do cerco, a expressão indica afastamento da presença hostil sobre Judá. “Daqui” é idiomático em português e comunica a retirada da região dos falantes.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação histórica específica do texto hebraico, sem substituí-la interpretativamente por “babilônios”.
- source_word: כִּי לֹא יֵלֵכוּ
  choice: pois eles não se retirarão
  rationale: “Pois” preserva a relação explicativa, e a repetição de “se retirarão” mantém o contraste retórico com a falsa expectativa anterior.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração apresenta o nome pessoal presente no hebraico, em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta foi pontuada em níveis distintos; “se retirarão” mantém o cenário militar sem perder a repetição enfática do original.
