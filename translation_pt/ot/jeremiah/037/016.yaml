  text: כִּ֣י בָ֧א יִרְמְיָ֛הוּ אֶל בֵּ֥ית הַ/בּ֖וֹר וְ/אֶל הַֽ/חֲנֻ֑יוֹת וַ/יֵּֽשֶׁב שָׁ֥ם יִרְמְיָ֖הוּ יָמִ֥ים רַבִּֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/016.yaml
  text: For Jeremiah had come into the dungeon house and into the cells[a], and Jeremiah remained there many days.
translation:
  language: pt
  text: Pois Jeremias tinha entrado na casa da cisterna e nas celas[a], e ficou ali muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nas salas abobadadas» ou «nos compartimentos»; o termo hebraico é raro e provavelmente se refere a recintos fechados dentro da prisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação sobre as circunstâncias da prisão de Jeremias; «pois» preserva essa relação discursiva sem reduzi-la a uma indicação meramente temporal.
- source_word: בָא
  choice: tinha entrado
  rationale: O mais-que-perfeito composto situa a entrada de Jeremias antes de sua permanência prolongada, enquanto «entrado» expressa naturalmente בוא seguido de אֶל neste contexto.
- source_word: בֵּית הַבּוֹר
  choice: a casa da cisterna
  rationale: Preserva a imagem concreta e a construção hebraica, provavelmente referente à parte subterrânea do complexo prisional, sem substituí-la pelo termo mais genérico «prisão».
- source_word: הַחֲנֻיוֹת
  choice: as celas[a]
  rationale: O substantivo raro parece designar compartimentos fechados no complexo prisional. «Celas» é claro no contexto, e a incerteza arquitetônica fica preservada em nota.
- source_word: וַיֵּשֶׁב שָׁם
  choice: ficou ali
  rationale: Neste relato de encarceramento, traduz idiomaticamente a ideia de permanência de ישב, em vez de sugerir apenas a postura de estar sentado.
- source_word: יָמִים רַבִּים
  choice: muitos dias
  rationale: Mantém de modo natural e relativamente formal a expressão hebraica de duração.
