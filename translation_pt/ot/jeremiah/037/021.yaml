source:
  edition: WLC
  text: וַ/יְצַוֶּ֞ה הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יַּפְקִ֣דוּ אֶֽת יִרְמְיָהוּ֮ בַּ/חֲצַ֣ר הַ/מַּטָּרָה֒ וְ/נָתֹן֩ ל֨/וֹ כִכַּר לֶ֤חֶם לַ/יּוֹם֙ מִ/ח֣וּץ הָ/אֹפִ֔ים עַד תֹּ֥ם כָּל הַ/לֶּ֖חֶם מִן הָ/עִ֑יר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/021.yaml
  text: So King Zedekiah gave orders[a], and they committed Jeremiah to the court of the guard, and gave him a loaf of bread daily from the bakers’ street, until all the bread from the city was gone. So Jeremiah remained in the court of the guard.
translation:
  language: pt
  text: Então o rei Zedequias deu ordens, e puseram Jeremias sob custódia no pátio da guarda. Davam-lhe diariamente um pão da rua dos padeiros[a], até que todo o pão da cidade acabou. Assim, Jeremias permaneceu no pátio da guarda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “da rua dos padeiros”; provavelmente uma rua ou área onde os padeiros trabalhavam e vendiam pão.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: deu ordens
  rationale: Expressa naturalmente a emissão de uma ordem real, sem a rigidez de uma tradução excessivamente literal.
- source_word: וַיַּפְקִדוּ
  choice: puseram ... sob custódia
  rationale: Neste contexto, o verbo indica a colocação oficial de Jeremias em confinamento; a formulação torna explícito o sentido custodial sem transformar o local em uma prisão comum.
- source_word: חֲצַר הַמַּטָּרָה
  choice: pátio da guarda
  rationale: Preserva a referência a um pátio ligado à guarda e usado para detenção, sem identificar indevidamente o lugar como um edifício prisional.
- source_word: וְנָתוֹן לוֹ
  choice: Davam-lhe
  rationale: A forma verbal apresenta a provisão como parte da ordem anterior. O imperfeito português comunica adequadamente a entrega diária e repetida.
- source_word: כִכַּר לֶחֶם
  choice: um pão
  rationale: כִּכָּר designa aqui uma unidade ou pão de formato arredondado; 'um pão' é a expressão corrente e clara em português.
- source_word: לַיּוֹם
  choice: diariamente
  rationale: Comunica de modo conciso a distribuição regular de uma unidade por dia.
- source_word: מִחוּץ הָאֹפִים
  choice: da rua dos padeiros
  rationale: חוּץ pode denotar o espaço exterior ou a rua. No contexto urbano, a expressão provavelmente se refere à rua ou zona em que os padeiros trabalhavam; a incerteza é registrada em nota.
- source_word: עַד תֹּם כָּל הַלֶּחֶם מִן הָעִיר
  choice: até que todo o pão da cidade acabou
  rationale: Reproduz com clareza o esgotamento do suprimento de pão disponível na cidade.
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: No contexto de custódia, ישׁב indica a continuação da permanência de Jeremias naquele local.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “pátio da guarda” foi mantida por corresponder à estrutura enfática do hebraico. A mudança para uma nova frase em “Davam-lhe” evita uma longa cadeia de orações e esclarece que a entrega era diária.
