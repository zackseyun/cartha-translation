id: JER.37.15
reference: Jeremiah 37:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְצְפ֧וּ הַ/שָּׂרִ֛ים עַֽל יִרְמְיָ֖הוּ וְ/הִכּ֣וּ אֹת֑/וֹ וְ/נָתְנ֨וּ אוֹת֜/וֹ בֵּ֣ית הָ/אֵס֗וּר בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר כִּֽי אֹת֥/וֹ עָשׂ֖וּ לְ/בֵ֥ית הַ/כֶּֽלֶא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/015.yaml
  text: And the officials were enraged at Jeremiah[a], and they beat him and put him in the prison house, in the house of Jehonathan the scribe[b], for they had made it a prison.
translation:
  language: pt
  text: Os oficiais ficaram furiosos com Jeremias[a], espancaram-no e o puseram na prisão, na casa de Jônatas, o escriba[b], pois a haviam transformado em prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os príncipes ficaram irados com Jeremias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “casa de confinamento”; isto é, uma prisão instalada na casa de Jônatas, o escriba.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְצְפוּ
  choice: ficaram furiosos
  rationale: O verbo קצף expressa ira ou indignação intensa; “ficaram furiosos” conserva essa força em português natural.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: שׂרים designa aqui autoridades governamentais; “oficiais” evita sugerir especificamente filhos do rei, como poderia ocorrer com “príncipes”.
- source_word: וְהִכּוּ אֹתוֹ
  choice: espancaram-no
  rationale: נכה pode significar ferir ou bater; neste contexto hostil, “espancaram-no” comunica claramente os maus-tratos físicos.
- source_word: וְנָתְנוּ אֹתוֹ בֵּית הָאֵסוּר
  choice: e o puseram na prisão
  rationale: A formulação traduz de modo natural נתן, “pôr”, e בית האסור, literalmente uma casa ou lugar de confinamento.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: na casa de Jônatas, o escriba
  rationale: A repetição de בית identifica a prisão como situada na casa de Jônatas. “Escriba” conserva o título סֹפֵר, que também podia indicar um secretário oficial.
- source_word: כִּי אֹתוֹ עָשׂוּ לְבֵית הַכֶּלֶא
  choice: pois a haviam transformado em prisão
  rationale: כי introduz a explicação, e עשה com ל indica que a casa havia sido convertida para servir de prisão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Empregou-se “Jônatas”, forma portuguesa tradicional e reconhecível do nome hebraico יְהוֹנָתָן. A sequência coordenada do hebraico foi preservada sem rigidez excessiva.
