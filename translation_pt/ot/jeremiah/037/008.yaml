  text: וְ/שָׁ֨בוּ֙ הַ/כַּשְׂדִּ֔ים וְ/נִלְחֲמ֖וּ עַל הָ/עִ֣יר הַ/זֹּ֑את וּ/לְכָדֻ֖/הָ וּ/שְׂרָפֻ֥/הָ בָ/אֵֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/008.yaml
  text: Then the Chaldeans will return and fight against this city[a], and they will capture it and burn it with fire.
translation:
  language: pt
  text: Então os caldeus voltarão, lutarão contra esta cidade[a], tomarão a cidade e a queimarão com fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os babilônios”. O hebraico diz “os caldeus”, designação histórica usada ao longo deste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: Então ... voltarão
  rationale: O verbo שׁוּב significa aqui “voltar”. “Então” expressa naturalmente em português a sequência profética indicada pela conjunção, sem acrescentar conteúdo.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação étnico-política literal do hebraico; “babilônios” é um equivalente contextual útil, registrado em nota.
- source_word: וְנִלְחֲמוּ עַל
  choice: lutarão contra
  rationale: נלחם com עַל tem aqui o sentido militar de lutar contra ou atacar; a formulação escolhida é clara e natural.
- source_word: הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: O demonstrativo proximal זֹאת corresponde diretamente a “esta”.
- source_word: וּלְכָדֻהָ
  choice: tomarão a cidade
  rationale: לכד, no contexto militar de uma cidade, significa tomá-la ou capturá-la. A repetição de “a cidade” evita em português a sequência potencialmente ambígua de pronomes femininos.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: e a queimarão no fogo
  rationale: Preserva a expressão enfática hebraica “queimar no fogo” e mantém claro que o objeto é a cidade.
