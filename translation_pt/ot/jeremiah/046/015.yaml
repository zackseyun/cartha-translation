  text: מַדּ֖וּעַ נִסְחַ֣ף אַבִּירֶ֑י/ךָ לֹ֣א עָמַ֔ד כִּ֥י יְהוָ֖ה הֲדָפֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/015.yaml
  text: Why has your mighty one been swept away? He did not stand[a], for Yahweh drove him away.
translation:
  language: pt
  text: Por que o seu poderoso[a] foi arrastado? Ele não permaneceu de pé, pois Yahweh o repeliu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os seus poderosos”. A forma hebraica também pode ser entendida como “o seu touro”, talvez em referência a Ápis, o touro sagrado do Egito.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz uma pergunta retórica e é a equivalência mais natural em português atual.
- source_word: נִסְחַף
  choice: foi arrastado
  rationale: Preserva a voz passiva e a imagem vívida de alguém levado pela força, aqui no contexto de derrota.
- source_word: אַבִּירֶיךָ
  choice: o seu poderoso
  rationale: O contexto imediato traz verbos e sufixo no singular, favorecendo um referente singular; a forma hebraica, porém, admite outras compreensões, preservadas na nota.
- source_word: לֹא עָמַד
  choice: não permaneceu de pé
  rationale: Expressa de modo natural a ideia de não conseguir conservar a posição ou resistir, sem explicitar além do hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da derrota de modo conciso e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הֲדָפוֹ
  choice: o repeliu
  rationale: Comunica o ato de empurrar ou fazer recuar e se ajusta ao contexto de derrota, mantendo o objeto singular.
theological_decisions:
- issue: Referente de אַבִּירֶיךָ no oráculo contra o Egito
  choice: “o seu poderoso” no texto principal
  alternative: “os seus poderosos” ou “o seu touro”, talvez em referência a Ápis, o touro sagrado do Egito
  rationale: A forma lexical pode designar alguém forte ou um touro. Embora a forma hebraica permita uma leitura plural, os verbos e o sufixo seguintes estão no singular. A tradução principal conserva o sentido genérico singular, enquanto a nota mantém abertas as possibilidades plural e histórica sem transformar uma alusão possível em afirmação certa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Permaneceu de pé” conserva a imagem de resistência sem recorrer a linguagem excessivamente técnica ou arcaica.
