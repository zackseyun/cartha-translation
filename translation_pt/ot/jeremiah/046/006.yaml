  text: אַל יָנ֣וּס הַ/קַּ֔ל וְ/אַל יִמָּלֵ֖ט הַ/גִּבּ֑וֹר צָפ֨וֹנָ/ה֙ עַל יַ֣ד נְהַר פְּרָ֔ת כָּשְׁל֖וּ וְ/נָפָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/006.yaml
  text: Let not the swift flee[a], and let not the mighty man escape; in the north, by the bank of the Euphrates River[c][b], they have stumbled and fallen.
translation:
  language: pt
  text: O veloz não fuja, nem o guerreiro escape. Ao norte, às margens do rio Eufrates, tropeçaram e caíram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יָנוּס
  choice: não fuja
  rationale: A partícula אַל com o imperfeito expressa proibição ou valor jussivo; a terceira pessoa preserva a forma hebraica e o tom profético.
- source_word: הַקַּל
  choice: o veloz
  rationale: O adjetivo substantivado significa literalmente aquele que é leve ou rápido; no contexto militar, “o veloz” preserva concisão e paralelismo.
- source_word: וְאַל יִמָּלֵט
  choice: nem escape
  rationale: O nifal de מלט significa escapar ou pôr-se a salvo. “Nem escape” corresponde à segunda proibição e soa natural em português.
- source_word: הַגִּבּוֹר
  choice: o guerreiro
  rationale: גִּבּוֹר pode designar um homem forte, valente ou guerreiro; o contexto de batalha favorece “guerreiro” sem acrescentar uma interpretação alheia ao campo lexical.
- source_word: צָפוֹנָה
  choice: Ao norte
  rationale: A forma com ה direcional pode indicar movimento para o norte ou localização ao norte. A referência seguinte ao Eufrates favorece aqui a leitura locativa, embora a ambiguidade permaneça genuína.
- source_word: עַל יַד
  choice: às margens de
  rationale: A expressão significa literalmente “junto à mão de” e funciona como idioma espacial para “ao lado de” ou “junto de”; com um rio, “às margens de” é natural.
- source_word: נְהַר פְּרָת
  choice: o rio Eufrates
  rationale: Reproduz o substantivo comum e o nome próprio em ordem idiomática no português.
- source_word: כָּשְׁלוּ וְנָפָלוּ
  choice: tropeçaram e caíram
  rationale: Os perfeitos apresentam de modo vívido e conciso o resultado da derrota; o pretérito perfeito é a forma narrativa mais natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. A tradução mantém as proibições na terceira pessoa e evita linguagem excessivamente arcaica. A ambiguidade direcional/locativa de צָפוֹנָה foi ponderada no texto, sem exigir nota para uma diferença que não altera o cenário básico.
