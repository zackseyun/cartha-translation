source:
  edition: WLC
  text: הַגִּ֤ידוּ בְ/מִצְרַ֨יִם֙ וְ/הַשְׁמִ֣יעוּ בְ/מִגְדּ֔וֹל וְ/הַשְׁמִ֥יעוּ בְ/נֹ֖ף וּ/בְ/תַחְפַּנְחֵ֑ס אִמְר֗וּ הִתְיַצֵּב֙ וְ/הָכֵ֣ן לָ֔/ךְ כִּֽי אָכְלָ֥ה חֶ֖רֶב סְבִיבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/014.yaml
  text: Declare it in Egypt[a], and proclaim it in Migdol; proclaim it in Noph and in Tahpanhes. Say, ‘Take your stand and prepare yourself, for the sword has devoured those around you.’
translation:
  language: pt
  text: 'Anunciem no Egito e proclamem em Migdol; proclamem em Nof[a] e em Tafnes. Digam: “Tome posição e prepare-se, pois a espada devorou os que estão ao seu redor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof é o nome hebraico de Mênfis.
    reason: Identifica o topônimo hebraico por seu nome histórico mais conhecido.
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Anunciem
  rationale: O hifil imperativo plural de נגד pede que algo seja tornado público; “anunciem” é natural e mantém o tom público da ordem.
- source_word: וְהַשְׁמִיעוּ
  choice: proclamem
  rationale: O hifil de שמע significa aqui fazer uma mensagem ser ouvida publicamente. “Proclamem” preserva esse sentido e a repetição do hebraico.
- source_word: בְמִצְרַיִם
  choice: no Egito
  rationale: A preposição ב tem sentido locativo direto.
- source_word: בְמִגְדּוֹל
  choice: em Migdol
  rationale: O topônimo hebraico é transliterado em forma corrente e reconhecível.
- source_word: בְנֹף
  choice: em Nof
  rationale: Mantém no texto o topônimo hebraico; sua identificação histórica com Mênfis é indicada em nota.
- source_word: וּבְתַחְפַּנְחֵס
  choice: e em Tafnes
  rationale: Emprega a forma portuguesa tradicional e legível do topônimo hebraico.
- source_word: אִמְרוּ
  choice: Digam
  rationale: Imperativo simples que introduz de modo natural a fala citada.
- source_word: הִתְיַצֵּב
  choice: Tome posição
  rationale: Preserva a ideia reflexiva e deliberada de colocar-se em posição ou ficar pronto.
- source_word: וְהָכֵן לָךְ
  choice: prepare-se
  rationale: A construção com לָךְ tem sentido reflexivo; a forma portuguesa é clara e direta.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão das ordens anteriores em registro digno e corrente.
- source_word: אָכְלָה חֶרֶב
  choice: a espada devorou
  rationale: Mantém a personificação vívida da espada e deixa que o perfeito hebraico apresente a destruição como consumada ou profeticamente certa.
- source_word: סְבִיבֶיךָ
  choice: tudo ao seu redor
  rationale: A expressão denota aquilo que circunda o destinatário sem especificar apenas pessoas; “tudo ao seu redor” conserva essa abertura sem acrescentar um objeto humano.
theological_decisions:
- issue: Mudança de número no destinatário das ordens
  choice: 'Manter os imperativos plurais dirigidos aos proclamadores e o singular dentro da citação: “Tome posição e prepare-se ... ao seu redor”.'
  alternative: Uniformizar toda a passagem no plural ou entender o singular como dirigido explicitamente a uma cidade ou unidade militar.
  rationale: O hebraico muda deliberadamente do plural para o singular. A tradução conserva essa mudança e permite a leitura de um Egito personificado sem torná-la explícita no texto.
- issue: Aspecto de אָכְלָה
  choice: 'Traduzir pelo pretérito perfeito: “devorou”.'
  alternative: “tem devorado” ou “devorará”.
  rationale: O perfeito pode apontar para ação já realizada ou apresentar uma calamidade iminente como certa. O pretérito português mantém a imagem como fato consumado no discurso profético sem convertê-la explicitamente em futuro.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Preserva-se a repetição retórica de “proclamem”, a mudança gramatical do plural para o singular e a metáfora da espada que devora.
