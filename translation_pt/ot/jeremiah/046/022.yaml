base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/022.yaml
  text: Her sound goes like a serpent[a], for they go with an army and come against her with axes[c][b], like woodcutters.
translation:
  language: pt
  text: A voz dela se move como uma serpente[a], pois eles avançam com um exército[b] e vêm contra ela com machados[c], como lenhadores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O som dela se move como uma serpente”; o substantivo hebraico pode significar “voz”, “som” ou “ruído”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “avançam em força”. O termo hebraico חַיִל pode indicar força, poder ou exército.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, “vêm a ela”; neste contexto, o sentido é hostil: “vêm contra ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלָהּ
  choice: O som dela
  rationale: קוֹל pode significar voz, som ou ruído. Como a imagem é auditiva e não apresenta fala articulada, “som” preserva a amplitude do hebraico.
- source_word: כַּנָּחָשׁ
  choice: como o de uma serpente
  rationale: נָחָשׁ significa serpente ou cobra. “Serpente” mantém o registro profético elevado, e “o de” deixa claro que a comparação é com o som da serpente.
- source_word: יֵלֵךְ
  choice: segue
  rationale: הלך significa ir, andar ou seguir. Com “som” como sujeito, “segue” é natural em português e conserva a ideia de movimento ou propagação sem especificá-la excessivamente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação causal para o som comparado ao da serpente.
- source_word: בְחַיִל
  choice: em grande força
  rationale: חַיִל pode designar força, poder ou exército. A formulação preserva a ambiguidade entre uma força militar e o avanço em força, sem perder o contexto bélico.
- source_word: יֵלֵכוּ
  choice: avançam
  rationale: הלך significa ir ou andar; no contexto de invasores armados, “avançam” expressa naturalmente o movimento militar sem acrescentar a imagem específica de marcha.
- source_word: וּבְקַרְדֻּמּוֹת
  choice: com machados
  rationale: קַרְדֹּם designa um machado; o plural com בְּ indica o instrumento levado ou empregado pelos atacantes.
- source_word: בָּאוּ לָהּ
  choice: vêm contra ela
  rationale: Literalmente, a construção pode significar “vêm a ela”, mas o contexto militar torna explícita a direção hostil.
- source_word: כְּחֹטְבֵי עֵצִים
  choice: como lenhadores
  rationale: A expressão significa literalmente “como cortadores de madeira/árvores”. “Lenhadores” é a forma moderna e idiomática de conservar a imagem.
