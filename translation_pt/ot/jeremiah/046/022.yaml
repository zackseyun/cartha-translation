  to: A voz dela se move como uma serpente[a], pois eles avançam com um exército[b] e vêm contra ela com machados[c], como lenhadores.
  rationale: A revisão substitui duas construções calcadas que comprometem a clareza em português. «A voz dela se move como uma serpente» reproduz a comparação e o movimento do hebraico sem determinar que a serpente se arrasta ou sibila. «Com um exército» reflete o sentido militar mais provável de חַיִל neste contexto, enquanto a nota conserva uma alternativa mais ampla. Os marcadores permanecem ancorados nas expressões a que se referem.
