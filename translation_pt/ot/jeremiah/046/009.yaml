  text: עֲל֤וּ הַ/סּוּסִים֙ וְ/הִתְהֹלְל֣וּ הָ/רֶ֔כֶב וְ/יֵצְא֖וּ הַ/גִּבּוֹרִ֑ים כּ֤וּשׁ וּ/פוּט֙ תֹּפְשֵׂ֣י מָגֵ֔ן וְ/לוּדִ֕ים תֹּפְשֵׂ֖י דֹּ֥רְכֵי קָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/009.yaml
  text: Go up, O horses, and rage, O chariots; let the warriors go out—Cush and Put, who grasp the shield, and the Ludim, who grasp and bend the bow.
translation:
  language: pt
  text: 'Subam, cavalos! Lancem-se furiosamente, carros! Que saiam os guerreiros: Cuxe e Pute, que empunham o escudo, e os ludim, que empunham e retesam o arco.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלוּ
  choice: Avancem
  rationale: O verbo significa literalmente “subam”, mas, neste chamado militar dirigido aos cavalos, “avancem” comunica naturalmente o movimento de ataque sem acrescentar uma direção geográfica.
- source_word: וְהִתְהֹלְלוּ
  choice: Lancem-se furiosamente
  rationale: A forma verbal descreve ação descontrolada ou impetuosa. A expressão preserva a força de “agir como louco/enfurecer-se” e se aplica com naturalidade poética aos carros.
- source_word: תֹּפְשֵׂי מָגֵן
  choice: que empunham o escudo
  rationale: תפשׂ é “agarrar, segurar”; no contexto bélico, “empunhar” expressa o manejo ativo do escudo.
- source_word: לוּדִים
  choice: os lídios
  rationale: Emprega a designação portuguesa tradicional do povo chamado Ludim, sem tentar resolver além do texto sua identificação étnica ou geográfica exata.
- source_word: תֹּפְשֵׂי דֹּרְכֵי קָשֶׁת
  choice: que empunham e retesam o arco
  rationale: A construção repete a ideia de agarrar e chama os arqueiros literalmente de “os que pisam o arco”, expressão referente a armá-lo ou tensioná-lo; “retesam” conserva essa ação concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos enérgicos e paralelismo poético. Os etnônimos Cuxe e Pute foram transliterados; “lídios” segue o uso português corrente para Ludim. A personificação dos cavalos e carros foi mantida.
