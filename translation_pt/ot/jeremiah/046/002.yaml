base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/002.yaml
  text: 'Concerning Egypt: concerning the army of Pharaoh Neco king of Egypt[a], which was by the Euphrates River at Carchemish, which Nebuchadnezzar king of Babylon struck down in the fourth year of Jehoiakim son of Josiah[b], king of Judah.'
translation:
  language: pt
  text: 'A respeito do Egito[a]: sobre o exército do faraó Neco, rei do Egito, que estava junto ao rio Eufrates, em Carquemis, e que Nabucodonosor[b], rei da Babilônia, derrotou no quarto ano de Jeoaquim, filho de Josias, rei de Judá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica de abertura também pode ser traduzida como “Contra o Egito”. Aqui, “A respeito do Egito” foi escolhida porque o versículo funciona como título que apresenta o assunto do oráculo.
    reason: alternative_reading
  - marker: b
    text: A forma hebraica do nome neste versículo corresponde mais de perto a “Nabucodrossor”; “Nabucodonosor” é a forma tradicional mais conhecida em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִצְרַיִם
  choice: A respeito do Egito
  rationale: O לְ em uma superscrição profética introduz naturalmente o assunto do oráculo. A formulação preserva essa função sem antecipar o sentido mais hostil de “contra”.
- source_word: עַל חֵיל
  choice: sobre o exército
  rationale: עַל introduz o tópico específico, e חֵיל designa aqui as forças militares; “exército” é claro e corrente.
- source_word: פַּרְעֹה נְכוֹ
  choice: faraó Neco
  rationale: “Neco” é uma transliteração portuguesa reconhecida e próxima da forma hebraica.
- source_word: אֲשֶׁר הָיָה עַל נְהַר פְּרָת
  choice: que estava junto ao rio Eufrates
  rationale: Neste contexto locativo, עַל indica posição junto ao rio; a expressão é natural em português e evita sugerir que o exército estivesse literalmente sobre as águas.
- source_word: בְּכַרְכְּמִשׁ
  choice: em Carquemis
  rationale: A preposição marca o local; “em Carquemis” é a forma idiomática em português.
- source_word: הִכָּה
  choice: derrotou
  rationale: No contexto de uma ação militar contra um exército, o hifil de נכה comunica derrota. “Derrotou” expressa o resultado natural sem linguagem arcaica.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Embora a forma consonantal hebraica corresponda mais de perto a “Nabucodrossor”, “Nabucodonosor” é a forma bíblica portuguesa amplamente reconhecida.
- source_word: בִּשְׁנַת הָרְבִיעִית לִיהוֹיָקִים
  choice: no quarto ano de Jeoaquim
  rationale: A expressão é a fórmula portuguesa natural para uma data de reinado e segue diretamente a construção hebraica.
