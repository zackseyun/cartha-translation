  text: גַּם שְׂכִרֶ֤י/הָ בְ/קִרְבָּ/הּ֙ כְּ/עֶגְלֵ֣י מַרְבֵּ֔ק כִּֽי גַם הֵ֧מָּה הִפְנ֛וּ נָ֥סוּ יַחְדָּ֖יו לֹ֣א עָמָ֑דוּ כִּ֣י י֥וֹם אֵידָ֛/ם בָּ֥א עֲלֵי/הֶ֖ם עֵ֥ת פְּקֻדָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/021.yaml
  text: Even her hired soldiers in her midst are like fattened calves; for even they have turned and fled together; they did not stand[a], for the day of their disaster has come upon them, the time of their punishment.
translation:
  language: pt
  text: Até os mercenários no meio dela são como bezerros cevados; pois eles também se viraram e fugiram juntos; não se mantiveram firmes, pois chegou sobre eles o dia da desgraça deles, o tempo do castigo deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o tempo da visitação deles”; ou: “o tempo do acerto de contas deles”.'
    reason: Alternativas lexicais para פְּקֻדָּה, termo que pode indicar castigo, visitação ou prestação de contas.
lexical_decisions:
- source_word: שְׂכִרֶיהָ
  choice: os mercenários
  rationale: O substantivo designa pessoas contratadas; neste oráculo militar contra o Egito, refere-se às tropas estrangeiras pagas. “Mercenários” expressa esse sentido de modo direto e corrente em português.
- source_word: בְקִרְבָּהּ
  choice: que estão no meio dela
  rationale: Preserva a localização dentro do Egito, retomado no feminino, e produz uma construção natural em português.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: como bezerros cevados
  rationale: A expressão retrata bezerros alimentados no curral para engorda. “Cevados” conserva a imagem de animais bem nutridos, mas vulneráveis.
- source_word: הִפְנוּ
  choice: deram meia-volta
  rationale: No contexto de retirada militar, comunica naturalmente o ato de virar-se, sem fundi-lo com o verbo seguinte, “fugiram”.
- source_word: נָסוּ יַחְדָּו
  choice: fugiram juntos
  rationale: Tradução direta e idiomática da fuga coletiva.
- source_word: לֹא עָמָדוּ
  choice: não ficaram firmes
  rationale: Mantém a imagem hebraica de não permanecer de pé ou firme, sem explicitar além do texto que foram incapazes de resistir.
- source_word: יוֹם אֵידָם
  choice: o dia da desgraça deles
  rationale: אֵיד indica calamidade ou desastre. “Desgraça” é claro e preserva o sufixo plural, que se refere aos mercenários.
- source_word: עֵת פְּקֻדָּתָם
  choice: o tempo de seu castigo
  rationale: No contexto do oráculo de juízo e em paralelo com “dia da desgraça”, פְּקֻדָּה tem sentido punitivo. A nota registra alternativas lexicais legítimas.
theological_decisions:
- issue: Sentido de פְּקֻדָּה no oráculo de juízo
  choice: o tempo de seu castigo
  alternative: o tempo de sua visitação; o tempo de seu acerto de contas
  rationale: O paralelismo com o dia da desgraça favorece o valor punitivo, mas o termo hebraico também pode denotar visitação ou prestação de contas; essas possibilidades são preservadas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a imagem dos bezerros cevados, a sequência da retirada e a referência plural aos mercenários. O marcador foi colocado junto de “castigo”, expressão à qual a nota lexical pertence.
