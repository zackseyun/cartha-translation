revisions:
- from: Até os mercenários que estão no meio dela são como bezerros cevados. Pois também eles deram meia-volta e fugiram juntos; não ficaram firmes, porque o dia da desgraça deles chegou, o tempo de seu castigo.[a]
  to: Até os mercenários no meio dela são como bezerros cevados; pois eles também se viraram e fugiram juntos; não se mantiveram firmes, pois chegou sobre eles o dia da desgraça deles, o tempo do castigo deles.[a]
  rationale: A revisão evita especificar indevidamente a direção do ato de virar-se, traduz a preposição de ‘chegou sobre eles’ e explicita no português a referência plural dos sufixos finais. Mantêm-se a terminologia militar, a metáfora do original e a nota lexical ancorada em “castigo”.
