  revision_rationale: A revisão evita especificar indevidamente a direção do ato de virar-se, traduz a preposição de ‘chegou sobre eles’ e explicita no português a referência plural dos sufixos finais. Mantêm-se a terminologia militar, a metáfora do original e a nota lexical ancorada em “castigo”.
