revisions:
- from: Aquele dia pertence ao Senhor Yahweh dos Exércitos[a], dia de vingança, para se vingar dos seus adversários. A espada devorará, ficará saciada e beberá até se fartar do sangue deles, pois o Senhor Yahweh dos Exércitos tem um sacrifício[b] na terra do norte, junto ao rio Eufrates.
  to: Aquele dia pertence ao Senhor Yahweh dos Exércitos[a]; é um dia de vingança, para ele se vingar de seus adversários. A espada devorará, ficará saciada e beberá até se fartar do sangue deles, pois há um sacrifício para o Senhor Yahweh dos Exércitos[b], na terra do norte, junto ao rio Eufrates.
  rationale: A revisão é limitada a clareza sintática, fluência e à preservação mais direta da ambiguidade da cláusula nominal hebraica. Mantém a linguagem forte da espada personificada, a vingança judicial e a imagem sacrificial, sem introduzir interpretação doutrinária.
