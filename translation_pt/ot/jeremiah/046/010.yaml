source:
  edition: WLC
  text: וְֽ/הַ/יּ֨וֹם הַ/ה֜וּא לַ/אדֹנָ֧/י יְהוִ֣ה צְבָא֗וֹת י֤וֹם נְקָמָה֙ לְ/הִנָּקֵ֣ם מִ/צָּרָ֔י/ו וְ/אָכְלָ֥ה חֶ֨רֶב֙ וְ/שָׂ֣בְעָ֔ה וְ/רָוְתָ֖ה מִ/דָּמָ֑/ם כִּ֣י זֶ֠בַח לַ/אדֹנָ֨/י יְהוִ֧ה צְבָא֛וֹת בְּ/אֶ֥רֶץ צָפ֖וֹן אֶל נְהַר פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/010.yaml
  text: That day belongs to the Lord GOD of Armies[a], a day of vengeance, to avenge himself on his foes. The sword will devour and be satisfied and drink its fill of their blood, for the Lord GOD of Armies has a sacrifice in the land of the north[b], by the Euphrates River.
translation:
  language: pt
  text: Aquele dia pertence ao Senhor Yahweh dos Exércitos[a]; é um dia de vingança, para ele se vingar de seus adversários. A espada devorará, ficará saciada e beberá até se fartar do sangue deles, pois há um sacrifício para o Senhor Yahweh dos Exércitos[b], na terra do norte, junto ao rio Eufrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «SENHOR dos Exércitos». O hebraico traz o título composto «Senhor Yahweh dos Exércitos».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «pois o Senhor Yahweh dos Exércitos tem um sacrifício». A frase nominal hebraica também pode ser entendida como uma construção possessiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַהוּא
  choice: Aquele dia
  rationale: Preserva a referência enfática ao dia anunciado; a conjunção inicial é omitida em português para maior naturalidade sem perda do sentido discursivo.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: pertence ao Senhor Yahweh dos Exércitos
  rationale: 'O לְ marca relação ou posse: o dia é do Senhor. אֲדֹנָי é traduzido por “Senhor”, o nome divino é preservado como “Yahweh”, e צְבָאוֹת recebe uma tradução transparente.'
- source_word: יוֹם נְקָמָה
  choice: dia de vingança
  rationale: Mantém o substantivo נְקָמָה e sua ligação com o infinitivo seguinte, sem suavizar a linguagem judicial e bélica.
- source_word: לְהִנָּקֵם מִצָּרָיו
  choice: para se vingar dos seus adversários
  rationale: Expressa naturalmente em português o valor reflexivo do nifal e traduz צָרִים por um termo apropriado ao contexto militar.
- source_word: וְאָכְלָה חֶרֶב
  choice: A espada devorará
  rationale: Conserva a personificação vívida da espada como agente que consome.
- source_word: וְשָׂבְעָה וְרָוְתָה מִדָּמָם
  choice: ficará saciada e beberá até se fartar do sangue deles
  rationale: Preserva a progressão metafórica de saciedade e ingestão. “Beberá até se fartar” comunica o sentido de רוה sem reduzir a imagem a mero encharcamento.
- source_word: כִּי זֶבַח לַאדֹנָי יְהוִה צְבָאוֹת
  choice: pois o Senhor Yahweh dos Exércitos tem um sacrifício
  rationale: Mantém זֶבַח como “sacrifício”, evocando a matança sacrificial, e verte a construção nominal com לְ como posse idiomática; a alternativa existencial é registrada em nota.
- source_word: בְּאֶרֶץ צָפוֹן
  choice: na terra do norte
  rationale: Tradução próxima e clara da designação geográfica.
- source_word: אֶל נְהַר פְּרָת
  choice: junto ao rio Eufrates
  rationale: Neste contexto, אֶל indica localização ou proximidade; “junto a” comunica isso naturalmente em português.
theological_decisions:
- issue: Forma do título divino אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome pessoal divino יהוה, evitando ocultar o nome sob um título substitutivo.
- issue: Tradução de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos celestiais; dos Poderes; dos Anjos
  rationale: “Exércitos” é transparente, conserva a dimensão militar especialmente relevante neste oráculo e não restringe indevidamente quais forças estão abrangidas pelo título.
- issue: Imagem de זֶבַח aplicada ao juízo
  choice: sacrifício
  alternative: matança
  rationale: A tradução mantém deliberadamente a metáfora cultual e sua tensão teológica, em vez de explicá-la ou neutralizá-la.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A personificação violenta da espada e a metáfora sacrificial foram mantidas sem eufemismo. Os pronomes possessivos foram formulados de modo a permanecer claros no encadeamento do verso.
