  yaml_path: translation/ot/jeremiah/046/003.yaml
  text: Prepare buckler and shield[a], and advance to battle.
translation:
  language: pt
  text: Preparem o escudo pequeno e o escudo grande[a] e avancem para a batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Preparem o broquel e o escudo”.'
    reason: Alternativa lexical que conserva os nomes tradicionais das duas espécies de escudo, embora “broquel” seja menos conhecido hoje.
lexical_decisions:
- source_word: עִרְכוּ
  choice: Preparem
  rationale: O imperativo de ערך significa pôr em ordem ou deixar pronto; com armas como objeto, “Preparem” expressa naturalmente a ordem militar.
- source_word: מָגֵן
  choice: escudo pequeno
  rationale: מָגֵן designa aqui o escudo menor, em contraste com צִנָּה. A expressão é clara para leitores atuais e evita o termo pouco conhecido “broquel”.
- source_word: צִנָּה
  choice: escudo grande
  rationale: צִנָּה costuma designar um escudo maior. A tradução explicita o contraste entre as duas armas defensivas presentes no hebraico.
- source_word: וּגְשׁוּ
  choice: e avancem
  rationale: נגשׁ significa aproximar-se ou chegar-se; no contexto de uma convocação militar, “avancem” comunica de modo natural o movimento rumo ao combate.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: A preposição com מִלְחָמָה indica movimento em direção ao combate; “para a batalha” é idiomático e preserva essa orientação.
theological_decisions: []
