base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/013.yaml
  text: The word that Yahweh spoke to Jeremiah the prophet about the coming of Nebuchadnezzar king of Babylon to strike the land of Egypt:[a]
translation:
  language: pt
  text: A palavra que Yahweh falou a Jeremias, o profeta, sobre a vinda de Nabucodonosor, rei da Babilônia, para atacar a terra do Egito:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma hebraica do nome neste versículo corresponde mais de perto a “Nebucadrezar”; “Nabucodonosor” é a forma tradicional em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Em introduções proféticas, דָּבָר designa a palavra ou mensagem divina. “A palavra” preserva a fórmula hebraica e mantém um registro digno.
- source_word: דִּבֶּר
  choice: falou
  rationale: Com Yahweh como sujeito e Jeremias como destinatário, “falou” reproduz de modo natural a fórmula profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Título em aposição que identifica a função de Jeremias.
- source_word: לָבוֹא
  choice: sobre a vinda de
  rationale: O infinitivo com לְ apresenta o assunto da palavra profética e conserva o sentido prospectivo da chegada do rei babilônico.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: É a forma tradicional e amplamente reconhecida em português; a grafia mais próxima da forma hebraica deste versículo é registrada em nota.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e idiomática da cadeia construta hebraica.
- source_word: לְהַכּוֹת
  choice: para atacar
  rationale: Neste contexto militar, נכה indica desferir um golpe contra um território. “Atacar” comunica naturalmente a ação sem afirmar além do texto que a conquista já se consumou.
- source_word: אֶרֶץ מִצְרָיִם
  choice: a terra do Egito
  rationale: Mantém o substantivo אֶרֶץ e, portanto, o foco territorial explícito no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; o SENHOR
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo pelo título “Senhor”.
translation_notes:
  register: Português moderno, claro e digno, com estrutura adequada a uma introdução profética. As vírgulas delimitam as aposições “o profeta” e “rei da Babilônia”. O marcador [a] aparece no texto principal.
