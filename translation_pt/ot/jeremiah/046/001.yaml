id: JER.46.1
reference: Jeremiah 46:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא עַל הַ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/001.yaml
  text: The word of Yahweh that came to Jeremiah the prophet concerning the nations:[a]
translation:
  language: pt
  text: Palavra de Yahweh que veio a Jeremias, o profeta, a respeito das nações:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra as nações”. A preposição hebraica pode introduzir o assunto de modo geral ou, neste contexto, oráculos hostis dirigidos contra elas.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que qualifica “Palavra de Yahweh”, preservando a estrutura da fórmula profética.
- source_word: הָיָה
  choice: veio
  rationale: Na expressão idiomática דְבַר־יְהוָה הָיָה אֶל־, “veio” é a formulação profética natural em português, em vez do literal e pouco idiomático “foi”.
- source_word: דְבַר יְהוָה
  choice: Palavra de Yahweh
  rationale: “Palavra” preserva o peso formal e teológico de דָּבָר; o nome divino é transliterado como “Yahweh” em vez de ser substituído por um título.
- source_word: אֶל
  choice: a
  rationale: Marca Jeremias como destinatário da palavra divina e integra-se naturalmente à expressão portuguesa “veio a Jeremias”.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Mantém explicitamente o título apositivo presente no hebraico e o tom formal da superscrição.
- source_word: עַל
  choice: a respeito de
  rationale: Na superscrição, pode introduzir de maneira ampla o assunto dos oráculos. A opção contextual “contra” permanece em nota para não eliminar a ambiguidade genuína.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se às nações estrangeiras como povos e entidades políticas; “gentios” daria ao termo uma conotação etnorreligiosa menos adequada neste contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega o nome divino. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “Jeová” é uma forma tradicional, mas menos diretamente ligada à vocalização historicamente reconstruída.
- issue: Sentido de עַל הַגּוֹיִם na superscrição
  choice: a respeito das nações
  alternative: contra as nações
  rationale: עַל pode introduzir o tema de uma declaração, mas os oráculos seguintes têm conteúdo hostil e judicial. A tradução principal conserva a amplitude da superscrição, e a nota registra a leitura contextual mais forte.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A construção nominal sem artigo inicial reproduz bem o caráter de título ou superscrição do hebraico; a vírgula em “Jeremias, o profeta” deixa clara a aposição.
