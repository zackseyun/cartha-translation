  text: הִרְבָּ֖ה כּוֹשֵׁ֑ל גַּם נָפַ֞ל אִ֣ישׁ אֶל רֵעֵ֗/הוּ וַ/יֹּֽאמְרוּ֙ ק֣וּמָ/ה וְ/נָשֻׁ֣בָה אֶל עַמֵּ֗/נוּ וְ/אֶל אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/נוּ מִ/פְּנֵ֖י חֶ֥רֶב הַ/יּוֹנָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/016.yaml
  text: He has multiplied the stumbling; indeed[a], each man falls against his companion, and they say, “Come, and let us return to our people and to the land of our birth, away from the sword of the oppressor.”
translation:
  language: pt
  text: 'Ele fez muitos tropeçarem; sim, cada um caiu sobre o seu companheiro. Então disseram: “Vamos! Voltemos para o nosso povo e para a terra onde nascemos, para longe da espada opressora[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da pomba”. A palavra hebraica pode ser lida literalmente assim, mas, neste contexto, costuma ser entendida como “opressora” ou “devastadora”.
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְבָּה כּוֹשֵׁל
  choice: Ele fez muitos tropeçarem
  rationale: O hifil de רבה tem sentido causativo, e כּוֹשֵׁל designa quem tropeça ou vacila. A formulação expressa naturalmente em português que o sujeito implícito fez muitos cair ou vacilar, sem reproduzir a compressão hebraica de modo obscuro.
- source_word: גַּם
  choice: sim
  rationale: Aqui a partícula reforça a afirmação seguinte, mais do que simplesmente acrescentar outro elemento.
- source_word: נָפַל אִישׁ אֶל רֵעֵהוּ
  choice: caíram uns sobre os outros
  rationale: O singular distributivo אִישׁ descreve o colapso coletivo em que cada homem cai contra o companheiro. A expressão escolhida é idiomática e preserva a cena caótica.
- source_word: קוּמָה
  choice: Vamos!
  rationale: Embora literalmente seja uma convocação a levantar-se, no contexto introduz a exortação coletiva para partir. “Vamos!” comunica essa função de maneira natural.
- source_word: וְנָשֻׁבָה
  choice: Voltemos
  rationale: O coortativo de שוב expressa uma decisão conjunta de regressar.
- source_word: עַמֵּנוּ
  choice: o nosso povo
  rationale: עם indica aqui o povo de origem dos soldados ou aliados estrangeiros.
- source_word: אֶרֶץ מוֹלַדְתֵּנוּ
  choice: a terra onde nascemos
  rationale: Expressa de modo claro e corrente a ideia da terra natal, mantendo a referência explícita ao nascimento.
- source_word: מִפְּנֵי
  choice: para longe de
  rationale: No contexto de fuga, a expressão indica afastamento diante de uma ameaça.
- source_word: חֶרֶב הַיּוֹנָה
  choice: a espada opressora
  rationale: חֶרֶב mantém a imagem concreta da espada, enquanto הַיּוֹנָה é entendido contextualmente como particípio ligado à ideia de oprimir ou violentar e concordando com “espada”.
theological_decisions:
- issue: Interpretação de הַיּוֹנָה na frase final
  choice: opressora
  alternative: da pomba
  rationale: O contexto militar favorece a leitura relacionada ao verbo “oprimir”, descrevendo a espada como opressora ou devastadora. A leitura literal baseada no substantivo “pomba” permanece possível na forma escrita e é registrada em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta usa exortações naturais, e a ambiguidade lexical do encerramento é preservada em nota.
