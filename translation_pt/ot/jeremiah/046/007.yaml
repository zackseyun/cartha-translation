  yaml_path: translation/ot/jeremiah/046/007.yaml
  text: Who is this[a], rising like the Nile[b], like rivers whose waters surge?
translation:
  language: pt
  text: Quem é este que sobe como o Nilo[a] e cujas águas se revolvem como rios[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “rio”, mas, neste contexto egípcio, provavelmente se refere especificamente ao Nilo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rugem” ou “se agitam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Quem é este
  rationale: A combinação do interrogativo מִי com o demonstrativo זֶה introduz uma pergunta retórica vívida e mantém a figura personificada no masculino.
- source_word: כַּיְאֹר
  choice: como o Nilo
  rationale: Embora יְאֹר possa designar um rio, neste oráculo a respeito do Egito a referência natural é ao Nilo.
- source_word: יַעֲלֶה
  choice: sobe
  rationale: O verbo עלה expressa movimento ascendente; no quadro poético, evoca a subida ou cheia das águas.
- source_word: כַּנְּהָרוֹת
  choice: como rios
  rationale: Mantém o plural do hebraico e a comparação poética sem especificar indevidamente o tipo de curso de água.
- source_word: יִתְגָּעֲשׁוּ
  choice: se agitam
  rationale: O hitpael de געש retrata movimento turbulento das águas. “Se agitam” é claro e natural, embora o verbo também possa sugerir rugido ou forte revolvimento.
- source_word: מֵימָיו
  choice: cujas águas
  rationale: A forma significa literalmente “suas águas”. A construção relativa liga naturalmente as águas aos rios em português e conserva o fluxo da imagem poética.
