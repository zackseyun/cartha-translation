source:
  edition: WLC
  text: מַדּ֣וּעַ רָאִ֗יתִי הֵ֣מָּה חַתִּים֮ נְסֹגִ֣ים אָחוֹר֒ וְ/גִבּוֹרֵי/הֶ֣ם יֻכַּ֔תּוּ וּ/מָנ֥וֹס נָ֖סוּ וְ/לֹ֣א הִפְנ֑וּ מָג֥וֹר מִ/סָּבִ֖יב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/005.yaml
  text: Why have I seen this? They are terrified[a], turning back; their warriors are crushed, and they have fled hastily and have not turned back. Terror is on every side[b], declares Yahweh.
translation:
  language: pt
  text: Por que vejo isto? Eles estão apavorados[a] e recuam; seus guerreiros são esmagados. Fogem em debandada[b] e não se voltam. Há terror por todos os lados — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “consternados” ou “abatidos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, o hebraico repete termos da mesma raiz: “fogem em fuga”, uma construção enfática que indica debandada completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ רָאִיתִי
  choice: Por que vejo isto?
  rationale: A pergunta introduz, com espanto, a cena contemplada pelo profeta. O presente comunica em português a vivacidade da visão profética.
- source_word: חַתִּים
  choice: apavorados
  rationale: O termo descreve pessoas quebrantadas em ânimo, consternadas ou aterrorizadas; no contexto de derrota militar, “apavorados” expressa naturalmente o pânico.
- source_word: נְסֹגִים אָחוֹר
  choice: recuam
  rationale: A expressão participial indica movimento para trás em retirada. “Recuam” evita a redundância de “recuam para trás”.
- source_word: גִבּוֹרֵיהֶם
  choice: seus guerreiros
  rationale: No contexto militar, o substantivo designa combatentes valentes ou homens de guerra.
- source_word: יֻכַּתּוּ
  choice: são esmagados
  rationale: A forma passiva comunica que os guerreiros são golpeados e vencidos de maneira decisiva.
- source_word: וּמָנוֹס נָסוּ
  choice: Fogem em debandada
  rationale: O hebraico combina substantivo e verbo cognatos para intensificar a fuga. “Em debandada” transmite uma retirada completa e desordenada sem reproduzir uma construção artificial em português.
- source_word: וְלֹא הִפְנוּ
  choice: e não se voltam
  rationale: Preserva o sentido básico de virar-se ou voltar-se, sem decidir indevidamente se o gesto seria apenas olhar para trás ou tornar a enfrentar o inimigo.
- source_word: מָגוֹר מִסָּבִיב
  choice: Há terror por todos os lados
  rationale: Mantém a fórmula recorrente de Jeremias e expressa de modo idiomático uma ameaça que cerca os fugitivos.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética recebe uma tradução solene e corrente, enquanto o nome divino é representado diretamente.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega o Tetragrama; “Yahweh” representa diretamente o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A pontuação divide a cena em movimentos rápidos, acompanhando o tom de espanto e derrota. As notas preservam a amplitude de חַתִּים e a ênfase da construção cognata וּמָנוֹס נָסוּ.
