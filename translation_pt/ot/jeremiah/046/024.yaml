source:
  edition: WLC
  text: הֹבִ֖ישָׁה בַּת מִצְרָ֑יִם נִתְּנָ֖ה בְּ/יַ֥ד עַם צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/024.yaml
  text: The daughter of Egypt is put to shame[a]; she is given into the hand of a people from the north.
translation:
  language: pt
  text: A filha do Egito foi humilhada; foi entregue nas mãos[a] de um povo vindo do norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão de”, expressão que significa “sob o poder de”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישָׁה
  choice: foi humilhada
  rationale: O hifil de בוש exprime aqui desonra ou humilhação sofrida. O perfeito hebraico é representado naturalmente pelo pretérito perfeito, preservando o tom profético de derrota consumada.
- source_word: בַּת מִצְרָיִם
  choice: a filha do Egito
  rationale: Mantém a personificação profética da nação e a concordância feminina que estrutura o versículo.
- source_word: נִתְּנָה
  choice: foi entregue
  rationale: O nifal de נתן é passivo e, neste contexto hostil, indica que o Egito foi colocado sob o domínio do invasor. 'Foi entregue' é natural e mais claro em português do que o literal 'foi dada'.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Preserva a imagem hebraica da mão como poder ou domínio. O plural 'nas mãos' é a forma idiomática mais corrente em português, embora o hebraico use o singular.
- source_word: עַם צָפוֹן
  choice: um povo vindo do norte
  rationale: Conserva a referência indefinida e geográfica do hebraico sem identificar explicitamente o povo como Babilônia nem reduzi-lo a um exército.
theological_decisions:
- issue: Identidade histórica do povo do norte
  choice: Manter a expressão genérica 'um povo vindo do norte'
  alternative: Identificá-lo como Babilônia ou traduzir como 'o exército do norte'
  rationale: O hebraico não nomeia esse povo neste versículo. A formulação genérica preserva a linguagem profética e evita inserir uma identificação histórica interpretativa no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação 'filha do Egito' e a imagem da mão foram preservadas; a ordem foi ajustada apenas para fluência natural.
