base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/019.yaml
  text: Prepare your baggage for exile[a], O daughter dwelling in Egypt, for Noph will become a desolation, laid waste[c][b], without inhabitant.
translation:
  language: pt
  text: Prepare a sua bagagem para o exílio[a], ó filha do Egito, que aí habita, pois Nof[b] se tornará uma desolação; ficará devastada[c], sem ninguém que nela habite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os objetos para o exílio” ou “os apetrechos para o cativeiro”; a imagem hebraica é a de preparar os pertences para a deportação.
    reason: lexical_alternative
  - marker: b
    text: Nof é o nome hebraico da cidade egípcia mais tarde conhecida como Mênfis.
    reason: cross_reference
  - marker: c
    text: Ou “será incendiada”, caso se entenda o verbo com uma imagem mais específica de fogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: bagagem para o exílio
  rationale: A expressão designa concretamente os pertences preparados para uma deportação. “Bagagem para o exílio” comunica o sentido idiomático em português atual sem perder a imagem dos objetos levados pelo exilado.
- source_word: עֲשִׂי לָךְ
  choice: Prepare sua
  rationale: O imperativo feminino singular com o pronome reflexivo indica que a destinatária deve providenciar para si a bagagem. A formulação possessiva é natural em português e conserva essa força.
- source_word: יוֹשֶׁבֶת בַּת מִצְרָיִם
  choice: ó filha do Egito, que aí habita
  rationale: Mantém tanto a personificação feminina de “filha do Egito” quanto o valor participial de יוֹשֶׁבֶת, sem reduzir a destinatária simplesmente a “Egito”.
- source_word: נֹף
  choice: Nof
  rationale: Translitera a forma hebraica do nome da cidade; sua identificação histórica como Mênfis é informada em nota, em vez de substituir o nome no texto.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: Expressa o núcleo semântico de devastação e ruína, preservando o tom severo do anúncio profético.
- source_word: וְנִצְּתָה
  choice: ficará devastada
  rationale: Comunica claramente o estado resultante de ruína sem impor no texto principal a possível, mas discutível, imagem específica de incêndio.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem ninguém que nela habite
  rationale: Traduz de modo natural e incisivo o idioma hebraico que indica ausência completa de moradores.
