  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י פוֹקֵד֙ אֶל אָמ֣וֹן מִ/נֹּ֔א וְ/עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם וְ/עַל אֱלֹהֶ֖י/הָ וְ/עַל מְלָכֶ֑י/הָ וְ/עַ֨ל פַּרְעֹ֔ה וְ/עַ֥ל הַ/בֹּטְחִ֖ים בּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/025.yaml
  text: 'Yahweh of hosts[a], the God of Israel, says: Behold, I am about to punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings, and Pharaoh[b], and those who trust in him.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: “Eis que estou para castigar Amon de Nô[a], o faraó, o Egito, seus deuses, seus reis, o faraó e os que confiam nele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Amon de Tebas”. Nô é o nome hebraico da cidade egípcia geralmente identificada com Tebas.
    reason: cultural_note
  - marker: b
    text: O pronome pode referir-se ao Egito, em vez de ao faraó; nesse caso, o sentido é “os que confiam no Egito”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz o título de modo tradicional e ainda compreensível, sem restringi-lo apenas a tropas humanas.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e natural da construção hebraica.
- source_word: הִנְנִי פוֹקֵד
  choice: Eis que estou para castigar
  rationale: “Eis que” mantém a solenidade profética; “estou para” comunica a iminência, e “castigar” expressa o sentido judicial de פקד neste contexto.
- source_word: אָמֹון מִנֹּא
  choice: Amon de Nô
  rationale: Mantém a expressão divindade-lugar do hebraico e conserva Nô como nome hebraico da cidade; sua identificação com Tebas fica em nota.
- source_word: וְעַל
  choice: o… e…; sim
  rationale: A lista de alvos do juízo é apresentada com coordenação natural em português; “sim” antes da repetição de “o faraó” conserva sua ênfase sem reproduzir mecanicamente todas as preposições.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Usa o título régio consagrado em português; o artigo torna a formulação natural.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Forma corrente do topônimo em português.
- source_word: אֱלֹהֶיהָ וְעַל מְלָכֶיהָ
  choice: seus deuses e seus reis
  rationale: Os possessivos retomam naturalmente “o Egito” em português e preservam a relação expressa pelos sufixos hebraicos.
- source_word: הַבֹּטְחִים בּוֹ
  choice: os que confiam nele
  rationale: O pronome masculino singular retoma mais provavelmente o faraó, seu antecedente imediato, e a construção é idiomática em português.
theological_decisions:
- issue: Referente do pronome em בּוֹ (“nele/nela”)
  choice: 'O pronome se refere ao faraó: “os que confiam nele”.'
  alternative: 'O pronome pode referir-se ao Egito: “os que confiam nele” em português, ou, com explicitação, “os que confiam no Egito”.'
  rationale: O antecedente masculino singular mais próximo é o faraó, repetido imediatamente antes da expressão. Contudo, o Egito permanece como possível referente no contexto mais amplo; a nota conserva essa ambiguidade interpretativa, que a forma portuguesa “nele” não resolve por si só, pois tanto “faraó” quanto “Egito” são masculinos em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura acumulativa do anúncio de juízo foi preservada, mas as preposições repetidas foram suavizadas segundo o uso natural do português. Os marcadores [a] e [b] aparecem junto às expressões a que suas notas se referem.
