base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/020.yaml
  text: Egypt is a beautiful heifer; destruction from the north has come[a], it has come.
translation:
  language: pt
  text: O Egito é uma bela novilha; uma mutuca do norte chegou, chegou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a destruição do norte chegou”; o substantivo hebraico é raro e também pode ser entendido de maneira mais ampla como “destruição” ou “calamidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶגְלָה
  choice: novilha
  rationale: Designa uma fêmea bovina jovem e preserva a personificação feminina do Egito.
- source_word: יְפֵה פִיָּה
  choice: bela
  rationale: A expressão descreve a beleza ou boa aparência da novilha; “bela” comunica isso de modo natural e conciso em português.
- source_word: מִצְרָיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome do país, aqui personificado como uma novilha.
- source_word: קֶרֶץ
  choice: mutuca
  rationale: O substantivo raro provavelmente indica um inseto que pica. “Mutuca” mantém a imagem concreta de uma novilha importunada por um inseto, embora a identificação exata seja incerta.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Expressa a procedência da ameaça; em Jeremias, o norte é frequentemente a direção de onde vem o invasor.
- source_word: בָּא בָא
  choice: vem, vem chegando
  rationale: Preserva a repetição enfática e a urgência do hebraico. O presente progressivo soa natural em português e mantém aberta a nuance profética de uma ameaça certa e iminente.
theological_decisions:
- issue: Sentido de קֶרֶץ na metáfora de juízo
  choice: Imagem concreta de um inseto que pica (“mutuca”)
  alternative: “destruição” ou “calamidade”
  rationale: A leitura concreta prolonga de modo coerente a imagem da novilha. Como o termo hebraico é raro e seu sentido não é seguro, a interpretação abstrata é registrada em nota sem eliminar a ambiguidade textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Novilha” e “mutuca” preservam a força concreta da poesia; a repetição verbal conserva a insistência do original.
