source:
  edition: WLC
  text: מִצְרַ֨יִם֙ כַּ/יְאֹ֣ר יַֽעֲלֶ֔ה וְ/כַ/נְּהָר֖וֹת יִתְגֹּ֣עֲשׁוּ מָ֑יִם וַ/יֹּ֗אמֶר אַֽעֲלֶה֙ אֲכַסֶּה אֶ֔רֶץ אֹבִ֥ידָה עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/008.yaml
  text: Egypt rises like the Nile[a], and its waters surge like rivers. It says, ‘I will rise, I will cover the earth; I will destroy the city and those who dwell in it.’
translation:
  language: pt
  text: 'O Egito sobe como o Nilo, e suas águas se agitam como os rios. Ele diz: “Subirei, cobrirei a terra[a]; destruirei a cidade e os seus habitantes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o país”. A palavra hebraica אֶרֶץ pode significar “terra” ou “país”; “terra” preserva melhor o alcance amplo e hiperbólico da arrogância do Egito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: O Egito
  rationale: Emprega o nome português consagrado para a nação, aqui personificada como uma potência que avança e fala.
- source_word: כַּיְאֹר
  choice: como o Nilo
  rationale: Em contexto egípcio, יְאֹר designa naturalmente o Nilo; a forma definida em português torna explícita essa referência geográfica.
- source_word: יַעֲלֶה
  choice: sobe
  rationale: O presente vívido retrata tanto a cheia do Nilo quanto o avanço militar do Egito.
- source_word: וְכַנְּהָרוֹת יִתְגֹּעֲשׁוּ מָיִם
  choice: e suas águas se agitam como os rios
  rationale: Mantém a comparação com cursos de água no plural e expressa a turbulência de יתגעשו. O possessivo liga naturalmente as águas à imagem do Egito-Nilo.
- source_word: וַיֹּאמֶר
  choice: Ele diz
  rationale: Preserva a personificação singular do Egito e o caráter vívido da fala poética.
- source_word: אַעֲלֶה
  choice: Subirei
  rationale: Conserva a repetição verbal de יעלה e sustenta simultaneamente as imagens de inundação e avanço militar.
- source_word: אֲכַסֶּה אֶרֶץ
  choice: cobrirei a terra
  rationale: “Terra” conserva a amplitude hiperbólica da arrogância do Egito, sem excluir a possibilidade contextual de “o país”, registrada em nota.
- source_word: אֹבִידָה
  choice: destruirei
  rationale: Equivalente direto e natural do hifil de אבד no contexto de ameaça militar.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: a cidade e os seus habitantes
  rationale: Mantém o singular do hebraico e verte a expressão de modo claro e corrente em português.
