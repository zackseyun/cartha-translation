  text: וְ֠/אַתָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲק֛וֹב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/027.yaml
  text: But as for you[a], do not fear, my servant Jacob, and do not be dismayed, Israel; for behold, I will save you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: pt
  text: Mas você, meu servo Jacó, não tenha medo; não se desanime, Israel. Pois eis que salvarei você de longe e a sua descendência da terra de seu cativeiro.[a] Jacó voltará, terá sossego e viverá tranquilo, sem que ninguém o amedronte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da terra onde estão cativos”.'
    reason: lexical_alternative
  - marker: b
    text: “Jacó” e “Israel” personificam aqui o povo da aliança.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: A conjunção com o pronome independente marca uma mudança enfática e contrastiva em relação ao juízo sobre o Egito; “Mas você” expressa isso naturalmente.
- source_word: אַל תִּירָא
  choice: não tenha medo
  rationale: Forma corrente em português para a proibição, preservando sua força direta.
- source_word: עַבְדִּי יַעֲקֹב
  choice: meu servo Jacó
  rationale: Mantém o título pactual e o possessivo sem introduzir a conotação mais estreita de escravidão.
- source_word: וְאַל תֵּחַת
  choice: não fique aterrorizado
  rationale: O nifal de חתת pode indicar ficar abalado, consternado ou aterrorizado; esta escolha é clara e forma um paralelismo natural com “não tenha medo”.
- source_word: כִּי הִנְנִי מוֹשִׁיעֲךָ
  choice: Pois eis que salvarei você
  rationale: הִנְנִי com o particípio apresenta uma ação divina iminente ou certa. O futuro soa natural numa promessa em português, enquanto “eis que” preserva a ênfase de apresentação.
- source_word: מֵרָחוֹק
  choice: de uma terra distante
  rationale: O hebraico diz literalmente “de longe”; no contexto da libertação do exílio, a formulação espacial explícita é natural sem identificar indevidamente um país específico.
- source_word: וְאֶת זַרְעֲךָ
  choice: e a sua descendência
  rationale: זֶרַע designa coletivamente os descendentes; “descendência” preserva esse valor coletivo e é idiomático.
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: da terra em que está cativa
  rationale: Expressa de modo claro o sentido de “da terra da sua catividade”; a concordância singular coletiva retoma “descendência”.
- source_word: וְשָׁב יַעֲקֹב
  choice: Jacó voltará
  rationale: שׁוּב indica aqui o retorno após o deslocamento ou exílio.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: terá sossego e viverá tranquilo
  rationale: Os dois verbos descrevem repouso, segurança e ausência de perturbação. A dupla expressão preserva o paralelismo sem sugerir mero silêncio.
- source_word: וְאֵין מַחֲרִיד
  choice: sem que ninguém o amedronte
  rationale: Reproduz a ausência de qualquer agente que cause temor, em português natural.
theological_decisions:
- issue: Referente de “Jacó” e “Israel”
  choice: Manter os nomes como personificação coletiva do povo da aliança.
  alternative: Substituir os nomes por “israelitas” ou entendê-los como referência individual ao patriarca.
  rationale: No contexto profético, “Jacó” e “Israel” são nomes paralelos dirigidos corporativamente ao povo. Conservar os nomes mantém a figura e evita transformar a interpretação contextual numa paráfrase no corpo do texto.
- issue: Aspecto temporal de מוֹשִׁיעֲךָ com הִנְנִי
  choice: “salvarei você”
  alternative: “estou salvando você” ou “estou prestes a salvar você”
  rationale: A construção participial pode apresentar a salvação como iminente ou certa. O futuro comunica melhor a promessa no português atual sem negar essa força aspectual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Evitou-se o arcaísmo de “não temas” e “não te assombres”, mantendo a solenidade profética. Os marcadores aparecem junto às expressões a que se referem.
