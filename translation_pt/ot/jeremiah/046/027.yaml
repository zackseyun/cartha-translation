    issue: “de uma terra distante” para מֵרָחוֹק
    rationale: O hebraico não traz o substantivo “terra” nesse trecho; diz simplesmente “de longe”/“de lugares distantes”. “Terra” aparece apenas no membro seguinte (מֵאֶרֶץ שִׁבְיָם).
  - severity: low
    issue: “não fique aterrorizado” para וְאַל תֵּחַת
    rationale: A tradução intensifica desnecessariamente a expressão, que no contexto de consolação significa ser abatido, desalentado ou ficar em desânimo. “Não se desanime” mantém o sentido sem duplicar a ideia de pavor.
