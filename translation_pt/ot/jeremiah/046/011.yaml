  text: עֲלִ֤י גִלְעָד֙ וּ/קְחִ֣י צֳרִ֔י בְּתוּלַ֖ת בַּת מִצְרָ֑יִם לַ/שָּׁוְא֙ הרביתי רְפֻא֔וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/011.yaml
  text: Go up to Gilead and get balm[a], virgin daughter of Egypt. In vain you have multiplied remedies[b]; there is no healing for you.
translation:
  language: pt
  text: Suba a Gileade e obtenha bálsamo[a], ó virgem filha do Egito. Em vão você recorreu a muitos remédios[b]; não há cura para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gileade era conhecida por seu bálsamo medicinal. O comando é irônico: nem mesmo esse remédio famoso poderá curar o Egito.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “Em vão você multiplicou os tratamentos”. A forma verbal do texto consonantal hebraico é textual e morfologicamente difícil; no contexto, porém, o sentido é que os muitos tratamentos do Egito são inúteis.'
    reason: textual_variant
lexical_decisions:
- source_word: עֲלִי
  choice: Suba
  rationale: Imperativo qal feminino singular de עלה. “Suba” preserva a direção e a força do comando em português natural.
- source_word: גִלְעָד
  choice: Gileade
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome geográfico.
- source_word: וּקְחִי
  choice: e obtenha
  rationale: Imperativo qal feminino singular de לקח. No contexto, indica adquirir o bálsamo; “obtenha” é mais natural do que o literal “tome”.
- source_word: צֳרִי
  choice: bálsamo
  rationale: Designa uma resina aromática associada a usos medicinais. “Bálsamo” mantém a conhecida imagem bíblica sem reduzi-la genericamente a “remédio”.
- source_word: בְּתוּלַת בַּת מִצְרָיִם
  choice: ó virgem filha do Egito
  rationale: Preserva a personificação profética feminina e a expressão hebraica, com o vocativo explicitado de modo natural em português.
- source_word: לַשָּׁוְא
  choice: Em vão
  rationale: Expressa de maneira concisa a inutilidade ou falta de resultado indicada pela locução hebraica.
- source_word: הרביתי רְפֻאוֹת
  choice: você usa muitos remédios
  rationale: Representa o sentido contextual de multiplicar ou empregar numerosos tratamentos. A formulação evita uma expressão pouco idiomática como “multiplica remédios”, enquanto a nota registra a dificuldade textual e morfológica.
- source_word: תְּעָלָה אֵין לָךְ
  choice: não há cura para você
  rationale: Preserva a construção existencial negativa e traduz תְּעָלָה como restauração ou cura, adequada à metáfora medicinal.
