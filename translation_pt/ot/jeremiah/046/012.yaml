base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/012.yaml
  text: The nations have heard of your shame[a], and your cry has filled the earth; for warrior has stumbled against warrior; together both of them have fallen.
translation:
  language: pt
  text: As nações ouviram falar da tua vergonha, e o teu clamor encheu a terra[a]; pois um guerreiro tropeçou contra outro, e ambos caíram juntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «encheu o país». A palavra hebraica אֶרֶץ pode significar tanto «terra» quanto «país»; «terra» é preferível aqui porque a frase anterior menciona «as nações».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ גוֹיִם
  choice: As nações ouviram falar
  rationale: O perfeito qal descreve a divulgação já ocorrida da notícia. Em português, «ouviram falar» expressa com naturalidade que as nações tomaram conhecimento da vergonha do Egito.
- source_word: קְלוֹנֵךְ
  choice: da sua vergonha
  rationale: קָלוֹן denota vergonha, desonra ou humilhação pública. «Vergonha» é conciso e mantém a força do termo; o possessivo se refere à interlocutora feminina, o Egito.
- source_word: וְצִוְחָתֵךְ
  choice: e o seu clamor
  rationale: צְוָחָה é um grito de aflição. «Clamor» preserva a intensidade sem especificar indevidamente se se trata de grito, lamento ou pedido de socorro.
- source_word: מָלְאָה הָאָרֶץ
  choice: encheu a terra
  rationale: אֶרֶץ pode significar «terra» em sentido amplo ou «país/território». O contexto das «nações» favorece aqui o alcance amplo, embora a alternativa local permaneça possível e seja registrada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação para a vergonha difundida e o clamor que se espalhou. «Pois» mantém uma ligação causal clara e digna.
- source_word: גִבּוֹר בְּגִבּוֹר כָּשָׁלוּ
  choice: um guerreiro tropeçou no outro
  rationale: גִּבּוֹר tem sentido militar neste contexto. A preposição בְּ indica o choque de um combatente contra outro durante a debandada; «no outro» é idiomático em português. «Tropeçou» permanece distinto do posterior «caíram».
- source_word: יַחְדָּיו נָפְלוּ שְׁנֵיהֶם
  choice: e ambos caíram juntos
  rationale: A formulação conserva tanto a simultaneidade de יַחְדָּו quanto a ênfase explícita de שְׁנֵיהֶם nos dois combatentes.
