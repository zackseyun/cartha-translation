lexical_decisions:
- source_word: קָרְאוּ
  choice: gritam
  rationale: O qal perfeito na 3ª pessoa do plural introduz aquilo que as pessoas proclamam. O presente vívido transmite em português a força imediata e zombeteira da exclamação.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo simples; “ali” é natural no contexto e mantém a referência ao lugar mencionado.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: o faraó, rei do Egito
  rationale: Mantém o título real em aposição e usa a forma corrente em português.
- source_word: שָׁאוֹן
  choice: só barulho
  rationale: O termo pode indicar barulho, tumulto ou estrondo. Neste dito de escárnio, “só barulho” comunica a ideia de ostentação ruidosa sem resultado, sem excluir a imagem básica do ruído.
- source_word: הֶעֱבִיר
  choice: deixou passar
  rationale: O hifil de עבר tem sentido causativo, “fazer/deixar passar”. A tradução preserva essa nuance e sugere que a ocasião decisiva não foi aproveitada.
- source_word: הַמּוֹעֵד
  choice: o tempo determinado
  rationale: מוֹעֵד pode designar um tempo marcado ou determinado. No contexto militar e político, refere-se melhor a uma ocasião decisiva do que a uma festa religiosa.
