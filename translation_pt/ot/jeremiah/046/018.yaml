  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַי אָ֨נִי֙ נְאֻם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ כִּ֚י כְּ/תָב֣וֹר בֶּֽ/הָרִ֔ים וּ/כְ/כַרְמֶ֖ל בַּ/יָּ֥ם יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/018.yaml
  text: As I live[a], declares the King, whose name is Yahweh of Armies, surely as Tabor among the mountains and as Carmel by the sea[b], so he will come.
translation:
  language: pt
  text: “Tão certo como eu vivo” — declara o Rei, cujo nome é Yahweh dos Exércitos[a] —, ele virá certamente como o Tabor entre os montes e como o Carmelo junto ao mar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico não declara quem é o sujeito de “virá”; o contexto aponta para o conquistador anunciado nos versículos próximos.
    reason: implicit_subject
lexical_decisions:
- source_word: חַי אָ֨נִי
  choice: Tão certo como eu vivo
  rationale: Fórmula hebraica de juramento divino. A expressão conserva a referência à vida de Deus e comunica naturalmente a certeza solene da declaração.
- source_word: נְאֻם
  choice: declara
  rationale: Marcador profético de fala solene, vertido de maneira atual e digna.
- source_word: הַמֶּלֶךְ
  choice: o Rei
  rationale: Título definido aplicado a Deus; a inicial maiúscula deixa clara essa referência no português.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo sentido militar transparente de “Exércitos”.
- source_word: שְׁמוֹ
  choice: cujo nome é
  rationale: Construção relativa natural em português que preserva a identificação expressa no hebraico.
- source_word: כִּי
  choice: assim como... ele virá
  rationale: O valor enfático da partícula é comunicado pela fórmula inicial “Tão certo” e pela correlação comparativa da frase, evitando uma repetição pouco natural de “certamente”.
- source_word: כְּתָבוֹר בֶּהָרִים
  choice: assim como o Tabor se destaca entre os montes
  rationale: O verbo “se destaca” explicita com naturalidade a proeminência pressuposta pela comparação, sem identificar o Tabor como sujeito de “virá”.
- source_word: וּכְכַרְמֶל בַּיָּם
  choice: e o Carmelo junto ao mar
  rationale: Preserva a imagem geográfica do monte Carmelo situado junto ao Mediterrâneo e completa a comparação paralela.
- source_word: יָבֹוא
  choice: ele virá
  rationale: O verbo hebraico está na terceira pessoa masculina singular e deixa o sujeito implícito; o pronome mantém essa forma gramatical, enquanto a nota registra a ausência de sujeito expresso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o nome da aliança; “Yahweh” o preserva em vez de substituí-lo por um título.
- issue: Sentido de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos Senhores dos exércitos
  rationale: “Dos Exércitos” conserva a imagem de poder militar sem restringir no texto principal quais exércitos estão em vista.
- issue: Identidade do sujeito implícito de יָבֹוא
  choice: não identificada no texto principal além de “ele”
  alternative: o conquistador; o rei da Babilônia
  rationale: O contexto aponta para o conquistador anunciado nos versículos próximos, mas o hebraico deste versículo não o nomeia; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A correlação “assim como... ele virá” conserva a estrutura comparativa, enquanto “se destaca” torna explícita a proeminência geográfica pressuposta pela imagem.
