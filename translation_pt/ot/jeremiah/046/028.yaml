  text: אַ֠תָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה כִּ֥י אִתְּ/ךָ֖ אָ֑נִי כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הִדַּחְתִּ֣י/ךָ שָׁ֗מָּ/ה וְ/אֹֽתְ/ךָ֙ לֹא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/028.yaml
  text: But you[a], do not fear, my servant Jacob, declares Yahweh, for I am with you. For I will make a full end of all the nations where I have driven you, but of you I will not make a full end. Yet I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: pt
  text: Mas você, meu servo Jacó, não tenha medo — declara Yahweh —, pois eu estou com você. Pois trarei destruição completa sobre todas as nações entre as quais expulsei você, mas não trarei destruição completa sobre você.[a] Eu disciplinarei você com justiça e de modo algum o deixarei impune.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não destruirei você completamente”. O hebraico repete a expressão “fazer um fim completo” para ressaltar o contraste entre as nações e Jacó.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “certamente não o absolverei”. O verbo hebraico pode ter o sentido jurídico de declarar inocente ou absolver, mas aqui também implica não deixar Jacó sem a punição devida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: não tenha medo
  rationale: Expressa de forma natural e direta, em português moderno, a proibição com o imperfeito qal de ירא, preservando o tom de encorajamento.
- source_word: עַבְדִּי יַעֲקֹב
  choice: meu servo Jacó
  rationale: Mantém tanto o título de aliança “meu servo” quanto o nome nacional e pessoal “Jacó”, sem substituí-lo por “Israel”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e mantém o nome divino como Yahweh.
- source_word: כִּי אִתְּךָ אָנִי
  choice: pois eu estou com você
  rationale: Conserva a relação causal e a promessa direta da presença divina.
- source_word: אֶעֱשֶׂה כָלָה
  choice: darei fim completo
  rationale: Comunica a ideia de término ou destruição total e permite repetir a mesma expressão nas duas orações, preservando o contraste retórico do hebraico.
- source_word: אֲשֶׁר הִדַּחְתִּיךָ שָׁמָּה
  choice: para onde expulsei você
  rationale: O hifil de נדח indica que Yahweh fez Jacó ir para longe; “expulsei” conserva a força do exílio sem reduzir o sentido a uma dispersão casual.
- source_word: וְיִסַּרְתִּיךָ לַמִּשְׁפָּט
  choice: Eu o disciplinarei com justiça
  rationale: “Disciplinarei” preserva a dimensão corretiva de יסר, enquanto “com justiça” expressa que a ação será regida pelo que é justo, não arbitrária.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: e de modo algum o deixarei impune
  rationale: A construção com infinitivo absoluto intensifica a negação. “De modo algum” transmite essa ênfase, e “deixarei impune” preserva o sentido contextual sem eliminar a possível nuance forense.
theological_decisions:
- issue: Juízo divino sobre Jacó em contraste com as nações
  choice: Yahweh promete não aniquilar Jacó, embora ainda vá submetê-lo a uma disciplina justa.
  alternative: Entender que Jacó não sofrerá nenhuma forma de juízo, ou que a ação divina será apenas punitiva, sem caráter corretivo.
  rationale: O texto contrasta explicitamente o fim completo das nações com a preservação de Jacó, mas logo afirma que Jacó não ficará impune. A tradução mantém juntas a preservação e a disciplina.
- issue: Sentido jurídico de נקה
  choice: Traduzir no texto como “deixar impune” e registrar “absolver” em nota.
  alternative: Traduzir diretamente como “absolver”, enfatizando o cenário forense.
  rationale: No contexto, a expressão indica que Jacó não será isento das consequências disciplinares; a nota preserva a possível formulação jurídica sem impor exclusivamente esse sentido ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “darei fim completo” foi mantida por sua função retórica, embora seja um pouco mais formal que uma paráfrase como “destruirei completamente”. O tratamento por “você” mantém clareza no discurso direto, e os pronomes átonos preservam um tom escrito solene.
