revisions:
- from: Mas você, meu servo Jacó, não tenha medo — declara Yahweh —, pois eu estou com você. Darei fim completo a todas as nações para onde expulsei você, mas a você não darei fim completo.[a] Eu o disciplinarei com justiça e de modo algum o deixarei impune.[b]
  to: Mas você, meu servo Jacó, não tenha medo — declara Yahweh —, pois eu estou com você. Pois trarei destruição completa sobre todas as nações entre as quais expulsei você, mas não trarei destruição completa sobre você.[a] Eu disciplinarei você com justiça e de modo algum o deixarei impune.[b]
  rationale: A revisão substitui a expressão pouco natural “dar fim completo” por “trazer destruição completa”, preservando a repetição e o contraste do hebraico. Também torna mais precisa a referência às nações do exílio e harmoniza o tratamento pronominal. A nota a foi ajustada para explicar literalmente a construção hebraica, sem exigir que essa formulação seja reproduzida de modo rígido no texto português.
