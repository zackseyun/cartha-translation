source:
  edition: WLC
  text: כָּרְת֤וּ יַעְרָ/הּ֙ נְאֻם יְהוָ֔ה כִּ֖י לֹ֣א יֵֽחָקֵ֑ר כִּ֤י רַבּוּ֙ מֵֽ/אַרְבֶּ֔ה וְ/אֵ֥ין לָ/הֶ֖ם מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/023.yaml
  text: They have cut down her forest[a], declares Yahweh, though it cannot be searched out, because they are more numerous than locusts, and they are without number.
translation:
  language: pt
  text: Derrubaram sua floresta, declara Yahweh, embora não se possa explorá-la[a], pois são mais numerosos do que os gafanhotos e são incontáveis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois não se pode explorá-la”. A conjunção hebraica pode ser entendida em sentido causal (“pois”) ou concessivo (“embora”); o texto adota o sentido concessivo como o mais adequado ao contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְתוּ
  choice: Derrubaram
  rationale: O qal perfeito de כרת descreve a derrubada da floresta pelos invasores como ação consumada ou certa; “derrubaram” é natural e preserva a imagem.
- source_word: יַעְרָהּ
  choice: a floresta dela
  rationale: יַעַר significa “floresta” ou “mata”; o sufixo feminino remete ao Egito personificado. “Dela” conserva essa referência sem introduzir explicitamente um nome ausente do hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e mantém o nome divino pessoal expresso pelo Tetragrama.
- source_word: כִּי לֹא יֵחָקֵר
  choice: embora não se possa explorá-la por completo
  rationale: O nifal de חקר indica que a floresta não pode ser plenamente investigada ou percorrida. A formulação portuguesa comunica sua extensão ou densidade sem reduzir a imagem a uma simples medição.
- source_word: כִּי
  choice: embora
  rationale: 'A primeira ocorrência de כִּי pode ter valor concessivo: apesar de a floresta parecer impossível de explorar por completo, os invasores a derrubam. A leitura causal permanece na nota.'
- source_word: רַבּוּ מֵאַרְבֶּה
  choice: são mais numerosos que gafanhotos
  rationale: רבה expressa a enorme quantidade dos atacantes, e אַרְבֶּה evoca uma multidão destrutiva semelhante a uma praga de gafanhotos.
- source_word: וְאֵין לָהֶם מִסְפָּר
  choice: e não têm conta
  rationale: Equivalente português corrente do hebraísmo literal “não há número para eles”, preservando a ideia de uma multidão incontável.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome próprio. “Yahweh” o translitera em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão “a floresta dela” conserva a personificação feminina do Egito; “não têm conta” comunica de modo natural a incontabilidade dos invasores.
