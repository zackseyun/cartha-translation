  text: וּ/נְתַתִּ֗י/ם בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשָׁ֔/ם וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַד עֲבָדָ֑י/ו וְ/אַחֲרֵי כֵ֛ן תִּשְׁכֹּ֥ן כִּֽ/ימֵי קֶ֖דֶם נְאֻם יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/026.yaml
  text: And I will give them into the hand of those who seek their life[a], and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants. But afterward she will dwell as in days of old[b], declares Yahweh.
translation:
  language: pt
  text: Eu os entregarei nas mãos dos que procuram tirar-lhes a vida[a], nas mãos de Nabucodonosor[b], rei da Babilônia, e nas mãos dos seus servos. Mas, depois disso, ela voltará a habitar como nos tempos antigos, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “os que procuram a vida deles”; isto é, os que procuram matá-los.'
    reason: lexical_alternative
  - marker: b
    text: A forma hebraica neste versículo corresponde mais de perto a “Nebucadrezar”; “Nabucodonosor” é a forma tradicional em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: Eu os entregarei
  rationale: Neste contexto hostil, נתן com o sufixo de objeto significa entregar alguém ao poder de outro. “Entregarei” expressa naturalmente essa ideia em português.
- source_word: בְיַד
  choice: nas mãos de
  rationale: Preserva a imagem do idioma hebraico de cair sob o poder de alguém, usando uma expressão corrente em português.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: os que procuram tirar-lhes a vida
  rationale: Comunica com clareza o sentido ameaçador da expressão hebraica, que literalmente fala dos que “procuram a vida deles”, sem reduzir o alvo a meros perseguidores.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida em português; a forma mais próxima da grafia hebraica deste versículo é registrada em nota.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: “Servos” mantém a amplitude do termo para os subordinados do rei, sem especificá-los indevidamente como escravos ou oficiais.
- source_word: וְאַחֲרֵי כֵן
  choice: Mas, depois disso
  rationale: Marca tanto a sequência temporal quanto a mudança contextual do juízo para a restauração.
- source_word: תִּשְׁכֹּן
  choice: o Egito voltará a ser habitado
  rationale: A forma feminina singular personifica a terra do Egito. Como “Egito” é masculino em português e “ela habitará” seria pouco natural e ambíguo, a construção passiva explicita o referente e transmite a restauração da habitação no país.
- source_word: כִּימֵי קֶדֶם
  choice: como nos tempos antigos
  rationale: Expressão natural e digna que descreve a volta à condição de épocas anteriores.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética e representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o preserva diretamente, sem substituí-lo por um título.
- issue: Personificação feminina do Egito em תִּשְׁכֹּן
  choice: o Egito voltará a ser habitado
  alternative: ela habitará; ela será habitada
  rationale: O hebraico usa o feminino singular para a terra do Egito. A tradução mantém o país como sujeito temático, mas ajusta a expressão ao gênero gramatical e ao uso natural do português, sem impor uma interpretação além da restauração de sua habitação.
translation_notes:
  register: Português atual, amplamente internacional e de leitura natural no Brasil. O período conserva o paralelismo das três expressões “nas mãos de”, enquanto “voltará a ser habitado” evita uma personificação artificial em português e comunica a restauração do Egito.
