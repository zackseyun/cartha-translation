base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/004.yaml
  text: Harness the horses[a]; mount up, you horsemen; take your stand with helmets on. Polish the spears[b]; put on the armor.
translation:
  language: pt
  text: Aparelhem os cavalos; montem, cavaleiros! Tomem posição com capacetes. Polam as lanças; vistam as armaduras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “armaduras” indica proteção para o corpo, talvez cotas de malha ou couraças.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְרוּ הַסּוּסִים
  choice: Preparem os cavalos
  rationale: אסר significa literalmente prender ou atar; neste contexto militar, indica aparelhar os cavalos para a batalha. “Preparem” comunica essa ação com clareza sem especificar um equipamento além do que o hebraico exige.
- source_word: וַעֲלוּ הַפָּרָשִׁים
  choice: montem, cavaleiros
  rationale: עלה significa literalmente “subir”, mas, dirigido aos cavaleiros durante os preparativos militares, expressa a ordem de montar nos cavalos. O vocativo preserva a força direta da sequência de imperativos.
- source_word: וְהִתְיַצְּבוּ
  choice: Tomem posição
  rationale: O hitpael de יצב descreve apresentar-se ou posicionar-se firmemente, aqui em formação militar.
- source_word: בְּכֹובָעִים
  choice: com os capacetes
  rationale: כובע designa capacete ou proteção militar para a cabeça. A expressão portuguesa é natural e preserva a ideia de estarem equipados com eles.
- source_word: מִרְקוּ הָרְמָחִים
  choice: Polam as lanças
  rationale: מרק, neste contexto, indica tornar brilhante ou liso, isto é, polir; רמח designa lança ou arma de haste semelhante.
- source_word: לִבְשׁוּ הַסִּרְיֹנֹת
  choice: vistam as armaduras
  rationale: לבש é “vestir”; סריון designa proteção corporal militar, mas seu tipo exato não é seguro. “Armaduras” mantém a amplitude lexical.
theological_decisions: []
translation_notes:
  register: Sequência breve e enérgica de ordens militares, em português atual e digno. Empregou-se “vocês” implícito nas formas verbais plurais, de ampla legibilidade brasileira, e preservou-se a indefinição do tipo de armadura.
