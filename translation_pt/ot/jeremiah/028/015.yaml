  text: וַ/יֹּ֨אמֶר יִרְמְיָ֧ה הַ/נָּבִ֛יא אֶל חֲנַנְיָ֥ה הַ/נָּבִ֖יא שְׁמַֽע נָ֣א חֲנַנְיָ֑ה לֹֽא שְׁלָחֲ/ךָ֣ יְהוָ֔ה וְ/אַתָּ֗ה הִבְטַ֛חְתָּ אֶת הָ/עָ֥ם הַ/זֶּ֖ה עַל שָֽׁקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
translation:
  language: pt
  text: 'Então o profeta Jeremias disse ao profeta Hananias: “Escute, por favor, Hananias! Yahweh não enviou você, e você fez este povo confiar numa mentira.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: O título definido é mantido tanto para Jeremias como para Hananias, preservando a identificação do hebraico e a tensão decorrente da alegada condição profética de Hananias.
- source_word: שְׁמַע נָא
  choice: Escute, por favor
  rationale: O imperativo שְׁמַע acompanhado de נָא comunica uma exortação urgente, porém atenuada; esta formulação é clara e corrente em português.
- source_word: לֹא שְׁלָחֲךָ יְהוָה
  choice: Yahweh não enviou você
  rationale: O pretérito perfeito traduz naturalmente a negação do envio e sustenta a acusação de que Hananias não foi comissionado por Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הִבְטַחְתָּ
  choice: você fez ... confiar
  rationale: O hifil de בטח é causativo; “fez ... confiar” preserva esse sentido sem reduzi-lo a mero sentimento de segurança.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o coletivo singular com demonstrativo, em linguagem natural e digna.
- source_word: עַל שָׁקֶר
  choice: numa mentira
  rationale: Expressa de maneira idiomática o fundamento ou objeto da confiança indevida e conserva o substantivo concreto singular שֶׁקֶר.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome próprio e não o substitui pelo título tradicional.
- issue: Status profético de Hananias
  choice: ao profeta Hananias
  alternative: a Hananias, que se dizia profeta
  rationale: A tradução conserva o título dado pelo próprio texto, sem resolver por paráfrase a tensão entre essa designação e a declaração de que Yahweh não o enviou.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A colocação “enviou você” evita a ambiguidade regional de “lhe enviou”; “Escute” é corrente, respeitoso e claro. Não foram acrescentadas notas, pois as alternativas não são necessárias para representar uma ambiguidade textual relevante neste versículo.
