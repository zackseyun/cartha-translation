  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר שָׁבַ֞רְתִּי אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos[a], o Deus de Israel: “Quebrei o jugo do rei da Babilônia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título hebraico «Yahweh dos Exércitos» refere-se às forças sob o comando de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética solene e reconhecível, usando o presente idiomático em português para introduzir uma declaração divina autorizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Mantém o título tradicional e abrangente, referente às forças sob o comando de Deus.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta que identifica Yahweh como o Deus de Israel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala; em português atual, os dois-pontos cumprem essa função com naturalidade.
- source_word: שָׁבַרְתִּי
  choice: Quebrei
  rationale: O perfeito hebraico apresenta a ação como concluída. O pretérito perfeito é a forma natural em português e preserva a alegação de realização consumada.
- source_word: עֹל
  choice: jugo
  rationale: Conserva a metáfora concreta e estabelecida de submissão e domínio político.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução direta e natural da construção hebraica, preservando a referência política.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Valor aspectual de שָׁבַרְתִּי na profecia de Hananias
  choice: Quebrei
  alternative: Tenho quebrado; quebrarei
  rationale: A forma hebraica apresenta a ruptura como realizada. A tradução não transforma a afirmação em futuro nem decide por antecipação sua veracidade teológica.
translation_notes:
  register: Português moderno, claro e solene, com a fórmula profética preservada. O pretérito perfeito simples soa natural tanto no Brasil quanto em outras variedades internacionais do português. As aspas delimitam a declaração citada, e o marcador [a] aparece junto ao título correspondente.
