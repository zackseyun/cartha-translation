  yaml_path: translation/ot/jeremiah/028/007.yaml
  text: Yet please hear this word that I am speaking in your hearing and in the hearing of all the people:[a]
translation:
  language: pt
  text: Mas, por favor, ouça esta palavra que estou dizendo, para que você e todo o povo a ouçam:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “aos seus ouvidos e aos ouvidos de todo o povo”; expressão que significa “para que você e todo o povo a ouçam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: A partícula introduz aqui um contraste ou ressalva em relação ao versículo anterior; “Mas” expressa naturalmente essa mudança no discurso.
- source_word: שְׁמַע נָא
  choice: por favor, escute
  rationale: O imperativo שְׁמַע pede atenção, enquanto נָא confere tom de apelo cortês ou insistente. A formulação é clara e atual em português.
- source_word: הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: דָּבָר pode significar palavra, assunto ou mensagem; “palavra” preserva tanto o caráter verbal quanto a ressonância profética.
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר
  choice: que estou dizendo
  rationale: O particípio דֹּבֵר indica a ação em curso no momento da fala; “estou dizendo” a representa de modo natural.
- source_word: בְּאָזְנֶיךָ וּבְאָזְנֵי כָּל הָעָם
  choice: diante de você e de todo o povo
  rationale: A expressão literal “aos seus ouvidos e aos ouvidos de todo o povo” é um idiomatismo que indica fala pública e audível. “Diante de” comunica isso naturalmente, e a nota preserva a imagem hebraica.
