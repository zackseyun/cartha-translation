base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/017.yaml
  text: And Hananiah the prophet died in that year[a], in the seventh month.
translation:
  language: pt
  text: E o profeta Hananias morreu naquele ano, no sétimo mês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מות expressa diretamente a ação narrativa de morrer; a conjunção וַ é representada por “E” no início da frase.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Traduz literalmente o substantivo com artigo, sem acrescentar “falso”, qualificativo que não aparece neste versículo.
- source_word: בַּשָּׁנָה הַהִיא
  choice: naquele ano
  rationale: Reproduz de modo natural a referência anafórica literal a “aquele ano”, sem explicitar a ideia de “mesmo” além do hebraico.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: Tradução direta e idiomática da expressão temporal hebraica.
theological_decisions:
- issue: Se Hananias deve ser chamado explicitamente de falso profeta
  choice: Manter “o profeta”
  alternative: “o falso profeta”
  rationale: Embora o contexto condene a mensagem de Hananias, o hebraico deste versículo usa apenas o título comum “o profeta”; acrescentar “falso” importaria uma explicitação interpretativa ausente da formulação.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Naquele ano” preserva a referência do hebraico sem a expansão “naquele mesmo ano”. Não se incluiu nota, pois a alternativa indicada na camada inglesa coincide em sentido com a tradução direta e não esclareceria uma ambiguidade real em português.
