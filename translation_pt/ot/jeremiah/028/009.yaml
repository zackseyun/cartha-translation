  text: הַ/נָּבִ֕יא אֲשֶׁ֥ר יִנָּבֵ֖א לְ/שָׁל֑וֹם בְּ/בֹא֙ דְּבַ֣ר הַ/נָּבִ֗יא יִוָּדַע֙ הַ/נָּבִ֔יא אֲשֶׁר שְׁלָח֥/וֹ יְהוָ֖ה בֶּ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/009.yaml
  text: As for the prophet who prophesies peace[a], when the word of that prophet comes to pass[c][b], then that prophet will be known as one whom Yahweh has truly sent.
translation:
  language: pt
  text: Quanto ao profeta que profetiza paz[a], quando a palavra desse profeta se cumprir[b], então se reconhecerá que esse profeta foi verdadeiramente enviado por Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bem-estar” ou “prosperidade”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quando vier a palavra desse profeta”; isto é, quando a mensagem profética se realizar.
    reason: lexical_alternative
  - marker: c
    text: Ou “a quem Yahweh enviou em verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: o profeta / esse profeta
  rationale: O artigo definido acompanha o substantivo no hebraico. A alternância em português identifica o profeta em questão e mantém a frase natural.
- source_word: יִנָּבֵא
  choice: profetiza
  rationale: O nifal de נבא é o verbo habitual para falar profeticamente; “profetiza” preserva o registro e não o restringe a mera previsão.
- source_word: לְשָׁלוֹם
  choice: paz
  rationale: שָׁלוֹם abrange paz, bem-estar e prosperidade. “Paz” é claro e adequado ao contraste do contexto, enquanto a nota preserva a amplitude lexical.
- source_word: בְּבֹא דְּבַר הַנָּבִיא
  choice: quando a palavra desse profeta se cumprir
  rationale: Literalmente, a construção fala da vinda da palavra; no contexto, trata-se de sua concretização. “Se cumprir” comunica esse sentido naturalmente.
- source_word: יִוָּדַע
  choice: se reconhecerá
  rationale: O nifal de ידע indica que a identidade ou condição do profeta se tornará conhecida. A forma impessoal preserva o valor passivo sem sugerir quem faz o reconhecimento.
- source_word: שְׁלָחוֹ יְהוָה
  choice: foi ... enviado por Yahweh
  rationale: A formulação portuguesa exprime com clareza a comissão divina e mantém o profeta como referente da oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: בֶּאֱמֶת
  choice: verdadeiramente
  rationale: Neste contexto, o advérbio qualifica como genuíno o envio do profeta. “Verdadeiramente enviado” é natural e preserva a possível relação sintática com o envio.
theological_decisions:
- issue: Critério para reconhecer o verdadeiro profeta
  choice: O cumprimento da mensagem de paz permite reconhecer que o profeta foi verdadeiramente enviado por Yahweh.
  alternative: 'Traduzir mais literalmente: “será reconhecido o profeta que Yahweh enviou em verdade”.'
  rationale: A construção temporal liga a concretização da palavra ao reconhecimento do profeta, sem transformar o versículo numa afirmação doutrinária mais ampla do que o texto.
- issue: Ligação de בֶּאֱמֶת
  choice: “Verdadeiramente” qualifica o envio divino.
  alternative: Entender a expressão mais formalmente como “a quem Yahweh enviou em verdade”.
  rationale: A posição hebraica favorece sua relação com “enviou”; a tradução mantém essa ligação e não a desloca para o ato de reconhecer.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém “Yahweh” como nome próprio e conserva a repetição enfática de “profeta” presente no hebraico.
