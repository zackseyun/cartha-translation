  text: הַ/נְּבִיאִ֗ים אֲשֶׁ֨ר הָי֧וּ לְ/פָנַ֛/י וּ/לְ/פָנֶ֖י/ךָ מִן הָֽ/עוֹלָ֑ם וַ/יִּנָּ֨בְא֜וּ אֶל אֲרָצ֤וֹת רַבּוֹת֙ וְ/עַל מַמְלָכ֣וֹת גְּדֹל֔וֹת לְ/מִלְחָמָ֖ה וּ/לְ/רָעָ֥ה וּ/לְ/דָֽבֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/008.yaml
  text: The prophets who were before me and before you from ancient times prophesied against many lands and against great kingdoms[b][a], of war and disaster and plague.
translation:
  language: pt
  text: Os profetas que vieram antes de mim e antes de você, desde os tempos antigos,[a] profetizaram contra muitas terras e contra grandes reinos, anunciando guerra, calamidade e peste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde muito tempo atrás”. A expressão hebraica se refere aqui ao passado remoto, não necessariamente à eternidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pestilência”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאִים
  choice: Os profetas
  rationale: Substantivo plural definido; tradução direta e natural.
- source_word: אֲשֶׁר הָיוּ לְפָנַי וּלְפָנֶיךָ
  choice: que vieram antes de mim e antes de você
  rationale: A expressão é temporal. “Vieram antes” comunica com naturalidade que esses profetas pertenciam a épocas anteriores.
- source_word: מִן הָעוֹלָם
  choice: desde os tempos antigos
  rationale: Neste contexto, עוֹלָם indica um passado remoto, não necessariamente eternidade.
- source_word: וַיִּנָּבְאוּ
  choice: profetizaram
  rationale: Equivalente padrão e claro para o verbo נבא neste contexto profético.
- source_word: אֶל אֲרָצוֹת רַבּוֹת וְעַל מַמְלָכוֹת גְּדֹלוֹת
  choice: contra muitas terras e contra grandes reinos
  rationale: Embora אֶל possa significar “a”, a sequência de juízos favorece aqui o sentido adversativo; a repetição de “contra” torna a relação clara em português.
- source_word: לְמִלְחָמָה
  choice: anunciando guerra
  rationale: O לְ introduz o conteúdo da profecia. “Anunciando” explicita essa relação de modo natural sem alterar o sentido.
- source_word: וּלְרָעָה
  choice: calamidade
  rationale: Em contextos de juízo, רָעָה designa desgraça ou calamidade, não necessariamente mal moral.
- source_word: וּלְדָבֶר
  choice: peste
  rationale: דָבֶר designa peste ou pestilência; “peste” é corrente, conciso e acessível.
theological_decisions:
- issue: Sentido das preposições na descrição dos oráculos proféticos
  choice: “profetizaram contra muitas terras e contra grandes reinos”
  alternative: “profetizaram a respeito de muitas terras e de grandes reinos”
  rationale: O contexto imediato e a tríade “guerra, calamidade e peste” indicam oráculos de juízo, justificando o sentido adversativo, sem transformar essa leitura contextual em regra absoluta para as preposições.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” representa o singular hebraico e evita uma forma excessivamente regional ou arcaica. A construção com “anunciando” dá fluidez à enumeração e deixa explícito que guerra, calamidade e peste constituem o conteúdo das profecias.
