  yaml_path: translation/ot/jeremiah/028/010.yaml
  text: Then Hananiah the prophet took the yoke from the neck of Jeremiah the prophet and broke it[a].
translation:
  language: pt
  text: Então o profeta Hananias tirou o jugo[a] do pescoço do profeta Jeremias e o quebrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a barra” ou “a barra do jugo”. O termo hebraico pode se referir à barra de madeira de um jugo; aqui se usa “jugo” porque o ato simbólico no contexto gira em torno do jugo colocado sobre Jeremias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tirou
  rationale: Embora לקח tenha o sentido básico de “tomar/pegar”, com מֵעַל e um objeto colocado no pescoço, “tirou” expressa naturalmente em português o ato de removê-lo, sem acrescentar a força de “arrancou”.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Equivalente usual de נָבִיא; a designação é mantida tanto para Hananias como para Jeremias, preservando a repetição enfática do hebraico.
- source_word: הַמּוֹטָה
  choice: o jugo
  rationale: מוֹטָה pode designar uma barra ou haste, inclusive a barra de um jugo. No contexto do ato simbólico de Jeremias, “jugo” comunica com clareza o objeto inteiro, enquanto a alternativa lexical é registrada em nota.
- source_word: מֵעַל צַוַּאר
  choice: do pescoço
  rationale: Expressa de modo natural a remoção de algo que estava sobre o pescoço, sem reproduzir de forma rígida a construção hebraica “de sobre”.
- source_word: יִרְמְיָה
  choice: Jeremias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: e o quebrou
  rationale: שׁבר significa “quebrar”; o pronome “o” retoma “jugo” e evita intensificar indevidamente o verbo com opções como “despedaçou”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa e a repetição de “o profeta” foram preservadas; “tirou ... do pescoço” evita uma construção excessivamente literal e pouco natural.
