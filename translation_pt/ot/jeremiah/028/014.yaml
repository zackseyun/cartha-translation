source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי עַל צַוַּ֣אר כָּל הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה לַ/עֲבֹ֛ד אֶת נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וַ/עֲבָדֻ֑/הוּ וְ/גַ֛ם אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה נָתַ֥תִּי לֽ/וֹ־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/014.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: I have put an iron yoke on the necks of all these nations, to serve Nebuchadnezzar king of Babylon, and they shall serve him[b]. I have also given him the beasts of the field.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel: “Pus um jugo de ferro sobre o pescoço de todas estas nações, para que sirvam a Nabucodonosor, rei da Babilônia; e elas o servirão. Também lhe dei os animais do campo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo título português consagrado e compreensível, sem restringir os exércitos a um único referente.
- source_word: עֹל בַּרְזֶל
  choice: um jugo de ferro
  rationale: Reproduz diretamente a metáfora hebraica e ressalta, no contexto, uma sujeição mais dura que o jugo de madeira quebrado anteriormente.
- source_word: נָתַתִּי עַל צַוַּאר
  choice: Pus ... sobre o pescoço
  rationale: נתן admite o sentido de pôr ou colocar; o perfeito apresenta o ato divino como realizado e vigente. O singular coletivo de צַוַּאר foi preservado naturalmente em português.
- source_word: לַעֲבֹד ... וַעֲבָדֻהוּ
  choice: para que sirvam ... e elas o servirão
  rationale: O verbo עבד indica serviço ou sujeição política. A repetição lexical foi preservada, e וַעֲבָדֻהוּ recebe valor futuro/resultativo no contexto profético.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: É a forma tradicional e amplamente reconhecida do nome em português.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais do campo
  rationale: Preserva a expressão bíblica hebraica em linguagem digna e corrente, com referência ampla à vida animal.
theological_decisions:
- issue: Soberania divina sobre as nações e a criação
  choice: O texto declara diretamente que Yahweh impôs às nações a sujeição a Nabucodonosor e também lhe deu os animais do campo.
  alternative: Suavizar a afirmação como mera previsão política da expansão babilônica.
  rationale: A repetição de נתן atribui explicitamente a Deus tanto o jugo das nações quanto a concessão dos animais, sem exigir comentário doutrinário adicional.
- issue: Força temporal dos verbos
  choice: “Pus ... elas o servirão ... dei”
  alternative: “Ponho ... elas o serviram ... dou”
  rationale: Os perfeitos em primeira pessoa apresentam atos divinos estabelecidos, enquanto וַעֲבָדֻהוּ exprime o resultado futuro e certo no fluxo profético.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Conserva o nome Yahweh, o título tradicional “dos Exércitos”, a metáfora do jugo e a repetição do verbo “servir”. Não foram incluídas notas porque as alternativas registradas no material inglês estavam com marcadores trocados e nenhuma delas é necessária para compreender a tradução portuguesa.
