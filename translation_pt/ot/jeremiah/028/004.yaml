  text: וְ/אֶת יְכָנְיָ֣ה בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְ֠הוּדָה וְ/אֶת כָּל גָּל֨וּת יְהוּדָ֜ה הַ/בָּאִ֣ים בָּבֶ֗לָ/ה אֲנִ֥י מֵשִׁ֛יב אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה נְאֻם יְהוָ֑ה כִּ֣י אֶשְׁבֹּ֔ר אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/004.yaml
  text: And I will bring back to this place Jeconiah son of Jehoiakim[a], king of Judah, and all the exiles of Judah who came to Babylon, declares Yahweh, for I will break the yoke of the king of Babylon.
translation:
  language: pt
  text: Também trarei de volta a este lugar Jeconias, filho de Jeoaquim, rei de Judá, e todos os exilados de Judá que chegaram à Babilônia — declara Yahweh —, pois quebrarei o jugo do rei da Babilônia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְכָנְיָה
  choice: Jeconias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada ao registro bíblico moderno.
- source_word: גָּלוּת
  choice: os exilados
  rationale: O substantivo pode indicar o estado de exílio ou a comunidade deportada; o particípio seguinte favorece aqui a referência às pessoas.
- source_word: הַבָּאִים בָּבֶלָה
  choice: que foram para a Babilônia
  rationale: Embora בוא expresse literalmente movimento de chegada, o ponto de vista de Judá torna 'foram para' natural em português; a formulação não acrescenta a voz passiva de 'foram levados'.
- source_word: מֵשִׁיב
  choice: trarei de volta
  rationale: O hifil de שוב significa fazer voltar ou restaurar; com pessoas como objeto e um destino explícito, 'trarei de volta' preserva o movimento.
- source_word: הַמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Equivalente direto, natural e digno da expressão dêitica hebraica.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a força solene da fórmula profética sem transformá-la em uma explicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֹל
  choice: jugo
  rationale: Mantém a metáfora hebraica de submissão e domínio político, bem compreensível no registro bíblico português.
- source_word: אֶשְׁבֹּר אֶת עֹל מֶלֶךְ בָּבֶל
  choice: quebrarei o jugo do rei da Babilônia
  rationale: Tradução formal e natural que conserva a imagem profética sem explicitar demais seu sentido político.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém diretamente o Tetragrama; 'Yahweh' preserva o nome próprio em vez de substituí-lo por um título.
- issue: Natureza da promessa pronunciada no contexto
  choice: Manter a declaração em discurso direto sem qualificá-la no versículo
  alternative: Identificá-la no próprio texto como profecia falsa
  rationale: Embora o contexto atribua estas palavras a Hananias, o versículo registra a fala sem inserir nela uma avaliação editorial; a tradução preserva essa tensão contextual.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo os dois objetos de 'trarei de volta'. Travessões destacam naturalmente a fórmula profética parentética. Não há marcador de nota porque nenhuma nota é necessária nesta redação.
