id: JER.28.5
reference: Jeremiah 28:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אֶל חֲנַנְיָ֖ה הַ/נָּבִ֑יא לְ/עֵינֵ֤י הַ/כֹּֽהֲנִים֙ וּ/לְ/עֵינֵ֣י כָל הָ/עָ֔ם הָ/עֹמְדִ֖ים בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/005.yaml
  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
translation:
  language: pt
  text: Então o profeta Jeremias disse ao profeta Hananias, diante dos sacerdotes e diante de todo o povo que estava de pé na Casa de Yahweh:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «aos olhos dos sacerdotes e aos olhos de todo o povo»; isto é, na presença deles.
    reason: lexical_alternative
  - marker: b
    text: A «Casa de Yahweh» é o templo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; «Então ... disse» expressa naturalmente a sequência em português.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Mantém o título definido e emprega a ordem mais natural em português, sem perder a identificação de Jeremias como profeta.
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: ao profeta Hananias
  rationale: Preserva a repetição de «profeta» aplicada também a Hananias, importante para o equilíbrio retórico e a tensão narrativa.
- source_word: לְעֵינֵי
  choice: diante de
  rationale: A expressão significa literalmente «aos olhos de» e indica que a fala ocorreu publicamente, na presença das testemunhas. «Diante de» é natural e digno em português; sua repetição acompanha o hebraico.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente direto do substantivo definido no plural.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Neste contexto, עָם designa o povo reunido, e não apenas uma multidão ocasional.
- source_word: הָעֹמְדִים
  choice: que estava de pé
  rationale: O particípio descreve o povo presente naquele momento. A concordância no singular segue naturalmente o coletivo «povo» em português.
- source_word: בְּבֵית יְהוָה
  choice: na Casa de Yahweh
  rationale: Preserva a expressão hebraica «casa» e o nome divino, enquanto a nota esclarece que se trata do templo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» representa o nome divino em vez de substituí-lo por um título, sem acrescentar uma interpretação denominacional.
- issue: Designação de Hananias como profeta
  choice: manter «o profeta»
  alternative: omitir o segundo título ou qualificá-lo como falso profeta
  rationale: O hebraico chama tanto Jeremias quanto Hananias de «o profeta». A tradução conserva essa formulação e não antecipa nem resolve silenciosamente a tensão teológica e narrativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição de «diante de» preserva a estrutura enfática do hebraico; «Casa» recebe inicial maiúscula por funcionar aqui como designação do templo.
