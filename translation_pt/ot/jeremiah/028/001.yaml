id: JER.28.1
reference: Jeremiah 28:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/הִ֗יא בְּ/רֵאשִׁית֙ מַמְלֶ֨כֶת֙ צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֔ה ב/שנת הָֽ/רְבִעִ֔ית בַּ/חֹ֖דֶשׁ הַ/חֲמִישִׁ֑י אָמַ֣ר אֵלַ֡/י חֲנַנְיָה֩ בֶן עַזּ֨וּר הַ/נָּבִ֜יא אֲשֶׁ֤ר מִ/גִּבְעוֹן֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/עֵינֵ֧י הַ/כֹּהֲנִ֛ים וְ/כָל הָ/עָ֖ם לֵ/אמֹֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/001.yaml
  text: And it happened in that year[a], at the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah son of Azzur, the prophet from Gibeon, spoke to me in the house of Yahweh, in the sight of the priests and all the people, saying[b],
translation:
  language: pt
  text: 'E aconteceu, naquele ano, no início do reinado de Zedequias, rei de Judá, no quarto ano[b], no quinto mês, que Hananias, filho de Azur, o profeta de Gibeão, falou comigo na casa de Yahweh, diante dos sacerdotes e de todo o povo[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos olhos dos sacerdotes e de todo o povo”; expressão hebraica que significa publicamente ou na presença deles.
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico diz tanto “no início do reinado de Zedequias” como “no quarto ano”. A tradução preserva as duas expressões sem tentar harmonizá-las.
    reason: textual_difficulty
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: Mantém a fórmula narrativa hebraica de abertura sem recorrer a uma expressão arcaica.
- source_word: בַּשָּׁנָה הַהִיא
  choice: naquele ano
  rationale: Tradução direta e natural da expressão temporal.
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: no início do reinado de
  rationale: Neste contexto, מַמְלֶכֶת designa o período de governo do rei, não o reino como território.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Zedequias, rei de Judá
  rationale: Emprega as formas portuguesas tradicionais do nome e do título, com pontuação natural.
- source_word: בַּשָּׁנָה הָרְבִעִית
  choice: no quarto ano
  rationale: Conserva explicitamente a indicação cronológica do hebraico, sem harmonizá-la com a expressão anterior.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: no quinto mês
  rationale: Preserva o sistema calendárico expresso no texto, sem convertê-lo em nome moderno de mês.
- source_word: אָמַר אֵלַי
  choice: falou comigo
  rationale: Expressa naturalmente o ato de dirigir a palavra ao narrador e evita a repetição pouco elegante de 'disse-me, dizendo'.
- source_word: חֲנַנְיָה בֶן עַזּוּר
  choice: Hananias, filho de Azur
  rationale: Usa formas portuguesas reconhecíveis dos nomes e reproduz a relação de filiação.
- source_word: הַנָּבִיא אֲשֶׁר מִגִּבְעוֹן
  choice: o profeta de Gibeão
  rationale: Mantém o título definido e traduz de modo conciso a procedência indicada pela construção hebraica.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a imagem hebraica de 'casa' e verte diretamente o nome divino.
- source_word: לְעֵינֵי הַכֹּהֲנִים וְכָל־הָעָם
  choice: diante dos sacerdotes e de todo o povo
  rationale: Traduz de maneira idiomática a expressão hebraica que significa publicamente ou na presença de alguém.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula que introduz o discurso direto subsequente.
theological_decisions:
- issue: Tensão cronológica entre 'no início do reinado de Zedequias' e 'no quarto ano'
  choice: Preservar literalmente as duas indicações
  alternative: Parafrasear 'início' de modo mais amplo ou alterar uma das indicações para eliminar a aparente tensão
  rationale: O texto hebraico contém ambas as expressões; a tradução não deve resolver silenciosamente a dificuldade cronológica.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A forma 'Yahweh' representa diretamente o nome divino presente no texto hebraico, em conformidade com a política do projeto.
- issue: Designação de Hananias como הַנָּבִיא
  choice: o profeta
  alternative: um profeta ou o suposto profeta
  rationale: O hebraico emprega o título definido; qualificá-lo como falso ou apenas alegado anteciparia a avaliação narrativa e resolveria uma tensão que o versículo mantém.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a cadência narrativa e a repetição cronológica do hebraico; os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
