  terminology: “Yahweh”, “Amém”, “utensílios da casa de Yahweh” e “exilados” são escolhas consistentes, inteligíveis e fiéis. “Você profetizou” oferece legibilidade ampla sem reduzir indevidamente o tom do discurso.
