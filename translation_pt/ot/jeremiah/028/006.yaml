  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אָמֵ֕ן כֵּ֖ן יַעֲשֶׂ֣ה יְהוָ֑ה יָקֵ֤ם יְהוָה֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֣ר נִבֵּ֗אתָ לְ/הָשִׁ֞יב כְּלֵ֤י בֵית יְהוָה֙ וְ/כָל הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל אֶל הַ/מָּק֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/006.yaml
  text: Then Jeremiah the prophet said[a], “Amen! May Yahweh do so; may Yahweh fulfill your words that you have prophesied, to bring back the vessels of the house of Yahweh and all the exiles from Babylon to this place.”
translation:
  language: pt
  text: 'Então o profeta Jeremias disse: “Amém! Que Yahweh faça assim! Que Yahweh cumpra[a] as palavras que você profetizou, trazendo de volta da Babilônia para este lugar os utensílios da casa de Yahweh e todos os exilados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confirme” ou “estabeleça”. O verbo hebraico pode significar fazer com que as palavras permaneçam firmes, isto é, realizá-las.'
    reason: Alternativa lexical que preserva a imagem verbal hebraica subjacente a “cumpra”.
lexical_decisions:
- source_word: אָמֵן
  choice: Amém
  rationale: Mantém a interjeição hebraica já naturalizada em português e, no contexto, expressa assentimento e desejo, sem transformar a fala de Jeremias em confirmação da profecia.
- source_word: כֵּן יַעֲשֶׂה
  choice: Que ... faça assim
  rationale: O imperfeito tem força volitiva depois de “Amém”; a formulação expressa um desejo, não uma previsão categórica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יָקֵם
  choice: cumpra
  rationale: No hifil de קום, a expressão significa fazer com que as palavras se mantenham, isto é, levá-las a efeito. “Cumpra” comunica esse sentido com naturalidade, enquanto a nota preserva alternativas mais formais.
- source_word: דְּבָרֶיךָ אֲשֶׁר נִבֵּאתָ
  choice: as palavras que você profetizou
  rationale: Preserva a expressão concreta “suas palavras” e apresenta a profecia anterior de Hananias sem endossá-la como verdadeira.
- source_word: לְהָשִׁיב
  choice: trazendo de volta
  rationale: Expressa o conteúdo ou resultado anunciado pelas palavras proféticas e funciona naturalmente tanto para os utensílios quanto para os exilados.
- source_word: כְּלֵי בֵית יְהוָה
  choice: os utensílios da casa de Yahweh
  rationale: “Utensílios” designa adequadamente os objetos usados no templo, e “casa de Yahweh” conserva a designação hebraica sem explicitação indevida.
- source_word: וְכָל הַגּוֹלָה
  choice: e todos os exilados
  rationale: O substantivo singular coletivo designa a comunidade deportada; o plural é a forma mais clara e natural em português.
- source_word: מִבָּבֶל אֶל הַמָּקוֹם הַזֶּה
  choice: da Babilônia para este lugar
  rationale: Mantém o movimento de origem e destino e preserva a referência dêitica sem especificar além do texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto contém diretamente o tetragrama; “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Força da resposta de Jeremias
  choice: 'Desejo ou oração: “Que Yahweh faça... Que Yahweh cumpra...”'
  alternative: 'Afirmação futura: “Yahweh fará... Yahweh cumprirá...”'
  rationale: 'A sequência de “Amém” com formas verbais volitivas favorece um desejo. Assim se preserva a tensão narrativa: Jeremias deseja que a profecia favorável se realize, mas não a declara verdadeira.'
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Você” é usado para a segunda pessoa singular por ser amplamente compreensível; a sintaxe mantém o tom solene sem arcaísmos. O marcador [a] foi colocado junto ao verbo a que a nota lexical realmente se refere.
