id: JER.28.12
reference: Jeremiah 28:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑ה אַ֠חֲרֵי שְׁב֞וֹר חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֗ל צַוַּ֛אר יִרְמְיָ֥ה הַ/נָּבִ֖יא לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/012.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after Hananiah the prophet had broken the yoke from off the neck of Jeremiah the prophet, saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Jeremias, depois que o profeta Hananias quebrou a canga[a] que estava sobre o pescoço do profeta Jeremias, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jugo”; o termo hebraico pode designar mais especificamente a barra de madeira da canga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  choice: Então a palavra de Yahweh veio
  rationale: A construção narrativa introduz o acontecimento seguinte; “Então” expressa a sequência com naturalidade, enquanto “a palavra de Yahweh” preserva a fórmula profética e o nome divino.
- source_word: אַחֲרֵי שְׁבוֹר
  choice: depois que ... quebrou
  rationale: O infinitivo construto após אַחֲרֵי indica uma ação anterior já concluída. Em português, a sequência fica clara sem necessidade de uma forma composta.
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: o profeta Hananias
  rationale: A ordem é natural em português e mantém o título que identifica Hananias no confronto profético.
- source_word: הַמּוֹטָה
  choice: a canga
  rationale: Neste contexto, o termo designa a peça de madeira colocada sobre o pescoço como sinal profético. “Canga” comunica de modo concreto esse objeto; a nota registra a alternativa mais ampla, “jugo”.
- source_word: מֵעַל צַוַּאר
  choice: que estava sobre o pescoço
  rationale: Explicita naturalmente em português a posição da canga antes de ser quebrada, preservando a ideia de מֵעַל sem a construção pouco idiomática “de sobre”.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Mantém a repetição do título presente no hebraico e destaca que o episódio envolve dois homens chamados profetas.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Conserva a fórmula introdutória da fala divina, cujo conteúdo aparece no versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. A transliteração “Yahweh” preserva explicitamente o nome divino sem substituí-lo por um título.
- issue: Designação de Hananias e Jeremias como profetas
  choice: preservar os dois títulos sem qualificar sua legitimidade
  alternative: marcar Hananias como falso profeta
  rationale: O versículo chama ambos de הַנָּבִיא. A tradução preserva a tensão narrativa e não antecipa um juízo interpretativo que o próprio versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a repetição deliberada de “profeta”, usa “Yahweh” para o Tetragrama e termina com dois-pontos porque a fala continua no versículo seguinte.
