  text: וַ/יֹּ֣אמֶר חֲנַנְיָה֩ לְ/עֵינֵ֨י כָל הָ/עָ֜ם לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ כָּ֣כָה אֶשְׁבֹּ֞ר אֶת עֹ֣ל נְבֻֽכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֗ל בְּ/עוֹד֙ שְׁנָתַ֣יִם יָמִ֔ים מֵ/עַ֕ל צַוַּ֖אר כָּל הַ/גּוֹיִ֑ם וַ/יֵּ֛לֶךְ יִרְמְיָ֥ה הַ/נָּבִ֖יא לְ/דַרְכּֽ/וֹ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/011.yaml
  text: 'And Hananiah said in the sight of all the people[a], saying[b], “Thus says Yahweh: In this way I will break the yoke of Nebuchadnezzar king of Babylon from upon the neck of all the nations within two years.” Then Jeremiah the prophet went on his way.'
translation:
  language: pt
  text: 'E Hananias disse diante de todo o povo[a]: “Assim diz Yahweh: Deste modo quebrarei o jugo de Nabucodonosor, rei da Babilônia, do pescoço de todas as nações dentro de dois anos”. Então o profeta Jeremias seguiu seu caminho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença de todo o povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵי
  choice: diante de
  rationale: A expressão idiomática indica que Hananias falou publicamente, na presença de todo o povo. “Diante de” é natural em português e preserva a ideia de visibilidade pública.
- source_word: כֹּה ... כָּכָה
  choice: Assim ... Deste modo
  rationale: 'Distingue os dois advérbios deíticos: o primeiro introduz a fórmula profética, e o segundo provavelmente aponta para o ato simbólico de Hananias ao quebrar o jugo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: אֶשְׁבֹּר
  choice: quebrarei
  rationale: O imperfeito tem sentido futuro na declaração profética e mantém a imagem concreta de quebrar o jugo.
- source_word: עֹל
  choice: jugo
  rationale: É a equivalência tradicional e clara para a peça colocada sobre o pescoço, usada aqui como imagem da sujeição política.
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: dentro de dois anos
  rationale: A expressão hebraica, que inclui literalmente “dias”, indica um prazo que não ultrapassaria dois anos.
- source_word: מֵעַל צַוַּאר
  choice: tirando-o do pescoço de
  rationale: Explicita de modo natural em português a remoção do jugo que repousa sobre o pescoço, sem perder a imagem física.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: No contexto internacional de Jeremias, refere-se às nações submetidas ao domínio babilônico, sem a conotação teológica posterior de “gentios”.
- source_word: וַיֵּלֶךְ ... לְדַרְכּוֹ
  choice: Então o profeta Jeremias seguiu seu caminho
  rationale: Reproduz naturalmente o sentido idiomático de partir e continuar seu caminho, preservando o movimento narrativo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual e segue a prática definida para o projeto.
- issue: Status da declaração de Hananias
  choice: Manter a fórmula “Assim diz Yahweh” sem validar a profecia
  alternative: Qualificar a fala como falsa já neste versículo
  rationale: O versículo relata a reivindicação de Hananias, mas sua avaliação ocorre no contexto mais amplo. Acrescentar uma qualificação aqui resolveria antecipadamente a tensão narrativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção “disse...:” evita reproduzir mecanicamente o infinitivo hebraico לֵאמֹר. “Deste modo” conserva a provável referência ao gesto simbólico anterior sem explicá-la no corpo do versículo.
