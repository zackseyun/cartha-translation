    issue: Construção explicativa “tirando-o do pescoço”
    rationale: O verbo hebraico governa tanto «o jugo de Nabucodonosor» quanto «de sobre o pescoço de todas as nações». Em português, a redação direta evita a expansão sintática e mantém a imagem e a relação gramatical do original.
