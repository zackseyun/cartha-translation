source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁנָתַ֣יִם יָמִ֗ים אֲנִ֤י מֵשִׁיב֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֶֽת כָּל כְּלֵ֖י בֵּ֣ית יְהוָ֑ה אֲשֶׁ֨ר לָקַ֜ח נְבוּכַדנֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה וַ/יְבִיאֵ֖/ם בָּבֶֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/003.yaml
  text: Within two years[a], I will bring back to this place all the vessels of the house of Yahweh[d][c][b], which Nebuchadnezzar king of Babylon took from this place and brought to Babylon.
translation:
  language: pt
  text: Dentro de dois anos[a], trarei de volta a este lugar todos os utensílios da casa de Yahweh[b], que Nabucodonosor, rei da Babilônia, tirou deste lugar e levou para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “dentro de dois anos de dias”, expressão idiomática que significa “dentro de dois anos”.'
    reason: lexical_alternative
  - marker: b
    text: “Utensílios” também pode ser traduzido como “objetos”, “vasos” ou “utensílios sagrados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: Dentro de dois anos
  rationale: A expressão idiomática indica o período ainda restante até o acontecimento. A formulação preserva o prazo profético sem reproduzir literalmente o hebraísmo “dois anos de dias”.
- source_word: מֵשִׁיב
  choice: trarei de volta
  rationale: O particípio hifil tem força futura no discurso profético e descreve o retorno físico dos objetos ao lugar indicado.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: a este lugar
  rationale: Reproduz de modo natural a referência dêitica ao local em que a profecia é pronunciada.
- source_word: כָּל כְּלֵי בֵּית יְהוָה
  choice: todos os utensílios da casa de Yahweh
  rationale: כְּלִים designa os diversos objetos usados no santuário; “utensílios” é abrangente e corrente. “Casa de Yahweh” conserva a expressão hebraica sem substituí-la interpretativamente por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר לָקַח
  choice: que ... tirou
  rationale: No contexto espacial, “tirou deste lugar” expressa naturalmente o sentido de tomar e remover, sem intensificá-lo para “saquear”.
- source_word: נְבוּכַדנֶאצַּר
  choice: Nabucodonosor
  rationale: É a forma tradicional e amplamente reconhecida do nome em português, adequada à grafia hebraica deste versículo.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta da construção hebraica, em aposição ao nome próprio.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: deste lugar
  rationale: Mantém a correspondência espacial com “a este lugar” e traduz diretamente a preposição de origem.
- source_word: וַיְבִיאֵם בָּבֶל
  choice: e levou para a Babilônia
  rationale: Embora o hifil de בוא seja literalmente “fez vir/trouxe”, em português o movimento para longe do ponto de referência é expresso naturalmente por “levou”. O objeto pronominal está semanticamente preservado pelos “utensílios” já mencionados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino. “Yahweh” preserva sua função como nome e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada com vírgulas em torno da aposição “rei da Babilônia”. Mantiveram-se a expressão concreta “casa de Yahweh” e o nome divino transliterado.
