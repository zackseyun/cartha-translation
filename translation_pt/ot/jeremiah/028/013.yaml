base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/013.yaml
  text: 'Go and say to Hananiah, saying, ‘Thus says the LORD: You have broken wooden yoke-bars, but you have made iron yoke-bars in their place.’'
translation:
  language: pt
  text: 'Vá e diga a Hananias: “Assim diz o SENHOR: Você quebrou as barras de madeira do jugo, mas fez barras de ferro no lugar delas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Vá e diga
  rationale: O infinitivo absoluto seguido do verbo finito funciona como uma ordem enfática; em português natural, “Vá e diga” preserva com clareza a força da instrução.
- source_word: לֵאמֹר
  choice: introdução direta da citação
  rationale: O hebraico “dizendo” introduz as palavras seguintes; em português corrente, os dois-pontos cumprem naturalmente essa função sem perder conteúdo.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por “SENHOR” em versaletes/maiúsculas.
- source_word: מוֹטֹת עֵץ
  choice: barras de madeira do jugo
  rationale: מוֹטוֹת designa as barras ou travessas do jugo; a explicitação “do jugo” evita a leitura genérica de simples barras e corresponde ao contexto imediato.
- source_word: וְעָשִׂיתָ
  choice: mas fez
  rationale: Embora a conjunção seja literalmente “e”, o contexto estabelece contraste entre quebrar as barras de madeira e produzir barras de ferro; “mas” expressa essa relação discursiva.
- source_word: תַחְתֵּיהֶן
  choice: no lugar delas
  rationale: Reproduz de modo idiomático o sentido substitutivo da expressão hebraica.
theological_decisions:
- issue: Agência na fabricação das barras de ferro
  choice: “você ... fez”
  alternative: “serão feitas” ou “eu farei”
  rationale: A forma hebraica וְעָשִׂיתָ é segunda pessoa masculina singular, atribuindo retoricamente a Hananias o resultado de seu ato; a tradução preserva essa tensão sem reinterpretá-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a fala profética solene, sem arcaísmos desnecessários.
