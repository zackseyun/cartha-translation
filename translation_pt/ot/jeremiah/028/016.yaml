  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מְשַֽׁלֵּֽחֲ/ךָ֔ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה הַ/שָּׁנָה֙ אַתָּ֣ה מֵ֔ת כִּֽי סָרָ֥ה דִבַּ֖רְתָּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/016.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am sending you away from the face of the earth. This year you will die[b], because you have spoken rebellion against Yahweh.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh: “Eis que vou tirar você da face da terra.[a] Este ano você morrerá, porque falou em rebelião contra Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais formalmente, “tirar você de sobre a face da terra”. A expressão hebraica indica que a pessoa será removida do meio dos vivos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porque falou em apostasia contra Yahweh” ou “porque falou com desafio contra Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente da sentença anunciada no contexto anterior.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Conserva a fórmula profética tradicional em português claro e mantém o nome divino representado pelo Tetragrama.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Mantém a função enfática de chamar a atenção para a ação divina iminente, com registro digno e ainda compreensível.
- source_word: מְשַׁלֵּחֲךָ מֵעַל פְּנֵי הָאֲדָמָה
  choice: vou tirar você da face da terra
  rationale: Reproduz a imagem hebraica de remoção da superfície da terra em português natural; a frase seguinte esclarece que se trata de morte, não apenas de exílio.
- source_word: הַשָּׁנָה אַתָּה מֵת
  choice: Este ano você morrerá
  rationale: O predicado hebraico descreve aqui a morte futura e iminente; o futuro em português comunica claramente essa força contextual.
- source_word: סָרָה דִבַּרְתָּ אֶל יְהוָה
  choice: falou em rebelião contra Yahweh
  rationale: Preserva o caráter verbal da acusação e traduz סָרָה por um termo amplo que inclui desvio e desafio à autoridade divina sem impor um sentido teológico técnico.
theological_decisions:
- issue: Sentido da remoção da face da terra
  choice: Sentença de morte, expressa pela imagem de ser tirado da face da terra
  alternative: Expulsão ou exílio da terra
  rationale: A declaração imediatamente seguinte, “Este ano você morrerá”, identifica a remoção como morte. A tradução mantém a imagem hebraica sem ocultar sua interpretação contextual.
- issue: Amplitude semântica de סָרָה
  choice: rebelião
  alternative: apostasia ou desafio
  rationale: “Rebelião” mantém a acusação de afastamento e insubordinação contra Yahweh, sem restringi-la ao sentido técnico posterior de apostasia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “assim diz Yahweh” preserva a fórmula profética; “Eis que” mantém sua ênfase solene sem tornar o restante do versículo arcaico. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
