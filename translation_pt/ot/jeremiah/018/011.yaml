source:
  edition: WLC
  text: וְ/עַתָּ֡ה אֱמָר נָ֣א אֶל אִישׁ יְהוּדָה֩ וְ/עַל יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤ר עֲלֵי/כֶם֙ רָעָ֔ה וְ/חֹשֵׁ֥ב עֲלֵי/כֶ֖ם מַֽחֲשָׁבָ֑ה שׁ֣וּבוּ נָ֗א אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וְ/הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַעַלְלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/011.yaml
  text: 'Now therefore[a], say to the men of Judah and to the inhabitants of Jerusalem, saying, ‘Thus says Yahweh: Behold, I am shaping disaster against you and devising a plan against you. Turn back, please, each man from his evil way[c][b], and make your ways and your deeds good.’'
translation:
  language: pt
  text: 'Agora, portanto, diga, por favor, aos homens de Judá e aos moradores de Jerusalém: “Assim diz Yahweh: Eis que estou moldando uma desgraça contra vocês e preparando um plano contra vocês. Voltem, por favor, cada um do seu mau caminho[a], e tornem bons os seus caminhos e as suas ações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada homem do seu mau caminho”; o singular é distributivo e dirige o chamado a cada membro da comunidade.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Conserva tanto a transição temporal quanto a consequência derivada da imagem do oleiro no contexto anterior.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: aos homens de Judá
  rationale: O singular hebraico tem sentido coletivo; esta formulação preserva a expressão masculina sem perder a referência ao grupo.
- source_word: וְעַל יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: e aos moradores de Jerusalém
  rationale: Com o verbo 'dizer', a preposição introduz os destinatários; 'moradores' é natural e fiel.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética e translitera o nome divino.
- source_word: הִנֵּה אָנֹכִי
  choice: Eis que estou
  rationale: Preserva a solenidade do anúncio divino em português digno e corrente.
- source_word: יוֹצֵר
  choice: moldando
  rationale: Retém o eco deliberado da imagem do oleiro e o aspecto contínuo do particípio.
- source_word: רָעָה
  choice: uma desgraça
  rationale: Neste contexto, indica calamidade judicial, e não maldade moral praticada por Deus.
- source_word: וְחֹשֵׁב ... מַחֲשָׁבָה
  choice: e preparando um plano
  rationale: Expressa deliberação intencional de modo idiomático, sem a repetição pouco natural de verbo e substantivo cognatos.
- source_word: שׁוּבוּ נָא
  choice: Voltem, por favor
  rationale: Preserva a metáfora concreta de retorno e a força apelativa de נָא, sem restringi-la ao termo teológico 'arrependam-se'.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: cada um do seu mau caminho
  rationale: Comunica o singular distributivo, dirigindo o chamado a cada integrante da comunidade, e conserva 'caminho' como metáfora da conduta.
- source_word: וְהֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: e tornem bons os seus caminhos e as suas ações
  rationale: Preserva o imperativo causativo e a distinção entre os modos de vida e os atos concretos.
theological_decisions:
- issue: Sentido de רָעָה como ação judicial de Yahweh
  choice: desgraça
  alternative: mal; calamidade
  rationale: O contexto fala de juízo que traz dano, não de maldade moral em Deus. 'Desgraça' conserva a gravidade e evita resolver o termo como culpa moral divina.
- issue: Metáfora do oleiro em יוֹצֵר
  choice: moldando
  alternative: formando; preparando
  rationale: '''Moldando'' mantém a ligação verbal e conceitual com o oleiro do contexto imediato, sem transformar a metáfora em uma afirmação doutrinária adicional.'
- issue: Chamado expresso por שׁוּבוּ
  choice: Voltem
  alternative: Retornem; arrependam-se
  rationale: A tradução mantém a imagem espacial e moral do hebraico, preservando sua amplitude em vez de impor uma formulação teológica mais específica.
- issue: Singular distributivo אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: '''Cada um'' comunica com clareza que a comunidade é interpelada membro por membro, sem alterar a força distributiva do original.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Eis que' conserva o tom profético; 'moldando' mantém a imagem do oleiro. O apelo 'por favor' representa נָא sem tornar a fala coloquial.
