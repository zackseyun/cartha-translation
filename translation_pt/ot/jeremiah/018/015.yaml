source:
  edition: WLC
  text: כִּֽי שְׁכֵחֻ֥/נִי עַמִּ֖/י לַ/שָּׁ֣וְא יְקַטֵּ֑רוּ וַ/יַּכְשִׁל֤וּ/ם בְּ/דַרְכֵי/הֶם֙ שְׁבִילֵ֣י עוֹלָ֔ם לָ/לֶ֣כֶת נְתִיב֔וֹת דֶּ֖רֶךְ לֹ֥א סְלוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/015.yaml
  text: For my people have forgotten me[a]; they burn incense to emptiness. They have stumbled in their ways, in the ancient paths, to walk on side roads[d][c][b], on a road not built up.
translation:
  language: pt
  text: Pois o meu povo se esqueceu de mim; queima incenso ao que é vazio.[a] Eles fazem meu povo tropeçar em seus caminhos, nas veredas antigas,[b] para andar por veredas,[c] por uma estrada não preparada.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “ao que é falso”, “à vaidade” ou “aos ídolos”. O hebraico emprega um termo que significa vazio, falsidade ou inutilidade e que muitas vezes caracteriza o culto sem valor.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo hebraico é causativo: literalmente, “eles os fazem/fizeram tropeçar”. O sujeito não é identificado explicitamente; “meu povo” explicita o objeto referido pelo sufixo plural. “Veredas antigas” evoca o caminho estabelecido há muito tempo por Deus diante do seu povo; compare Jeremias 6:16.'
    reason: alternative_reading
  - marker: c
    text: Ou “caminhos secundários” ou “trilhas”.
    reason: lexical_alternative
  - marker: d
    text: Ou “por uma estrada não elevada” ou “por uma estrada não aterrada”. A expressão hebraica retrata uma estrada que não foi preparada ou construída em aterro.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכֵחֻנִי
  choice: se esqueceu de mim
  rationale: O qal perfeito com sufixo de primeira pessoa expressa diretamente o esquecimento de Deus, preservando também a ideia relacional de abandono.
- source_word: לַשָּׁוְא
  choice: ao que é vazio
  rationale: שָׁוְא abrange vazio, falsidade e inutilidade. A formulação mantém a expressão genérica do hebraico sem inserir explicitamente “ídolos” ou “deuses falsos”.
- source_word: יְקַטֵּרוּ
  choice: queima incenso
  rationale: O piel de קטר neste contexto designa naturalmente a queima ou oferta de incenso. O singular concorda com o coletivo “meu povo” em português.
- source_word: וַיַּכְשִׁילוּם
  choice: foi levado a tropeçar
  rationale: A forma hebraica é causativa e tem objeto plural, mas o agente não está expresso de modo claro no contexto imediato. A passiva conserva a causação sem identificar indevidamente o agente; o coletivo “povo” permite o singular em português.
- source_word: בְּדַרְכֵיהֶם
  choice: em seus caminhos
  rationale: Mantém a preposição e a imagem de conduta presente no hebraico, sem transformar a expressão em “para fora de seus caminhos”.
- source_word: שְׁבִילֵי עוֹלָם
  choice: nas veredas antigas
  rationale: A expressão indica caminhos estabelecidos desde tempos antigos; “veredas antigas” é natural, digna e preserva a imagem recorrente em Jeremias.
- source_word: לָלֶכֶת נְתִיבוֹת
  choice: a andar por atalhos
  rationale: “Andar” conserva a metáfora de conduta, e “atalhos” comunica o contraste entre as rotas secundárias e as veredas antigas.
- source_word: דֶּרֶךְ לֹא סְלוּלָה
  choice: por uma estrada não elevada
  rationale: סלל descreve o ato de erguer ou aterrar uma estrada. “Não elevada” preserva a imagem física, embora “não preparada” seja uma alternativa mais idiomática.
theological_decisions:
- issue: Objeto do culto indicado por לַשָּׁוְא
  choice: ao que é vazio
  alternative: aos ídolos; ao que é falso; em vão
  rationale: O contexto denuncia o culto falso, mas o substantivo hebraico é mais amplo que “ídolos”. A tradução evita restringir antecipadamente seu sentido.
- issue: Agência em וַיַּכְשִׁילוּם
  choice: 'construção passiva: “foi levado a tropeçar”'
  alternative: “eles os fizeram tropeçar” ou simplesmente “tropeçou”
  rationale: A forma é causativa, porém o agente permanece implícito. A passiva conserva a causação e a ambiguidade, ao passo que “tropeçou” apagaria a força causativa e uma construção ativa poderia sugerir um agente específico.
translation_notes:
  register: Português moderno, claro e digno, com concordância no singular por tratar “meu povo” como coletivo. A sintaxe poética e a metáfora dos caminhos foram preservadas; as notas registram as principais ambiguidades lexicais e sintáticas.
