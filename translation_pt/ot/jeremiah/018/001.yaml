  yaml_path: translation/ot/jeremiah/018/001.yaml
  text: The word that came to Yirmeyahu from Yahweh[a], saying,
translation:
  language: pt
  text: 'A palavra que veio a Yirmeyahu[a] da parte de Yahweh, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Yirmeyahu; tradicionalmente Jeremias.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: a palavra
  rationale: Em fórmulas proféticas, דָּבָר designa a revelação comunicada por Deus. “A palavra” preserva a formulação tradicional e a ligação direta com a fala profética, sem excluir o sentido de “mensagem”.
- source_word: הָיָה אֶל
  choice: veio a
  rationale: A expressão hebraica indica que a palavra divina chegou ao profeta. “Veio a” reproduz com naturalidade a fórmula profética em português.
- source_word: יִרְמְיָהוּ
  choice: Yirmeyahu
  rationale: Transliteração próxima do nome hebraico, com a forma portuguesa tradicional indicada em nota.
- source_word: מֵאֵת
  choice: da parte de
  rationale: Neste contexto, מֵאֵת marca a fonte ou origem da revelação. “Da parte de” é idiomático em português e deixa claro que Yahweh é quem envia a palavra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala divina que começa no versículo seguinte. “Dizendo” mantém a ligação sintática e discursiva do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome divino, não um título. “Yahweh” o representa por transliteração e evita substituir o nome por “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno. A construção “da parte de” soa natural e explicita a origem da palavra; “dizendo” foi mantido para conservar a conexão com a fala do versículo seguinte.
