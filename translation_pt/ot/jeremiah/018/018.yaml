reference: Jeremiah 18:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְכ֨וּ וְ/נַחְשְׁבָ֣ה עַֽל יִרְמְיָהוּ֮ מַחֲשָׁבוֹת֒ כִּי֩ לֹא תֹאבַ֨ד תּוֹרָ֜ה מִ/כֹּהֵ֗ן וְ/עֵצָה֙ מֵֽ/חָכָ֔ם וְ/דָבָ֖ר מִ/נָּבִ֑יא לְכוּ֙ וְ/נַכֵּ֣/הוּ בַ/לָּשׁ֔וֹן וְ/אַל נַקְשִׁ֖יבָה אֶל כָּל דְּבָרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/018.yaml
  text: Then they said[a], “Come, let us devise plans against Jeremiah, for instruction will not perish from the priest, nor counsel from the wise man, nor word from the prophet. Come, let us strike him with the tongue, and let us not pay attention to any of his words.”
translation:
  language: pt
  text: 'Então eles disseram: “Venham, façamos planos contra Jeremias, pois não faltará instrução da parte do sacerdote, nem conselho da parte do sábio, nem palavra da parte do profeta. Venham, vamos feri-lo com a língua[a] e não prestemos atenção a nenhuma de suas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vamos atacá-lo com a língua”, isto é, por meio de calúnia ou acusação.'
    reason: Alternativa lexical que esclarece o sentido figurado do ataque verbal sem retirar do texto principal a imagem da língua como instrumento de ferimento.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então eles disseram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: לְכוּ
  choice: Venham
  rationale: O imperativo funciona como convite enfático à ação conjunta, não como simples ordem para ir a algum lugar.
- source_word: וְנַחְשְׁבָה ... מַחֲשָׁבוֹת
  choice: façamos planos
  rationale: A construção com verbo e substantivo cognatos enfatiza a elaboração deliberada de um plano; a formulação portuguesa evita repetição artificial e preserva a intenção hostil.
- source_word: עַל יִרְמְיָהוּ
  choice: contra Jeremias
  rationale: No contexto da conspiração, עַל indica que os planos se dirigem contra Jeremias.
- source_word: כִּי
  choice: pois
  rationale: Introduz a justificativa apresentada pelos conspiradores.
- source_word: לֹא תֹאבַד
  choice: não faltará
  rationale: Aqui אָבַד comunica que algo não desaparecerá nem deixará de estar disponível. “Não faltará” é claro e natural em português.
- source_word: תּוֹרָה
  choice: instrução
  rationale: Neste contexto, תּוֹרָה designa o ensino ministrado pelo sacerdote, não apenas uma lei codificada.
- source_word: מִכֹּהֵן
  choice: da parte do sacerdote
  rationale: Expressa com clareza a origem da instrução e preserva o singular representativo do hebraico.
- source_word: וְעֵצָה מֵחָכָם
  choice: nem conselho da parte do sábio
  rationale: A negação inicial governa a série; “nem” torna isso explícito, enquanto “conselho” conserva a ideia de orientação ponderada.
- source_word: וְדָבָר מִנָּבִיא
  choice: nem palavra da parte do profeta
  rationale: “Palavra” mantém a amplitude de דָבָר e sua ressonância no contexto da proclamação profética.
- source_word: וְנַכֵּהוּ בַלָּשׁוֹן
  choice: vamos feri-lo com a língua
  rationale: Preserva a imagem hebraica de golpear ou ferir alguém por meio da língua, deixando a nota esclarecer que se trata de ataque verbal.
- source_word: וְאַל נַקְשִׁיבָה אֶל כָּל דְּבָרָיו
  choice: e não prestemos atenção a nenhuma de suas palavras
  rationale: A negação de “todas as suas palavras” é expressa idiomaticamente em português como “nenhuma de suas palavras”.
theological_decisions:
- issue: Singulares representativos em כֹּהֵן, חָכָם e נָבִיא
  choice: o sacerdote, o sábio, o profeta
  alternative: um sacerdote, uma pessoa sábia, um profeta
  rationale: O hebraico apresenta três funções sociais em singular representativo e em construção paralela. A tradução mantém essa forma e não neutraliza o masculino de חָכָם.
- issue: Sentido da justificativa dos conspiradores
  choice: não faltará instrução, conselho nem palavra
  alternative: a lei, o conselho e a palavra jamais perecerão
  rationale: A fala afirma que as fontes institucionais de orientação continuarão disponíveis sem Jeremias. A tradução preserva essa alegação como fala dos adversários, sem endossá-la nem explicá-la teologicamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “da parte de” preserva o paralelismo das três fontes de orientação. A imagem concreta “feri-lo com a língua” foi mantida no texto, com esclarecimento em nota.
