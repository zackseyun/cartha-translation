  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O wayyiqtol de היה dá sequência à narrativa. Em português atual, “Então” expressa naturalmente essa progressão, enquanto “veio” integra de modo idiomático a força verbal na fórmula completa.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética, דָּבָר pode significar “palavra” ou “mensagem”; “a palavra” preserva a expressão bíblica consagrada e a relação construta com o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo da primeira pessoa indica direção para o profeta; “a mim” é natural na construção portuguesa “veio a mim”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala divina que vem no versículo seguinte. “Dizendo” mantém de forma concisa a transição formal do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e não o substitui por um título; “Jeová” é uma forma tradicional secundária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A fórmula profética foi preservada sem o arcaísmo “e aconteceu que”.
