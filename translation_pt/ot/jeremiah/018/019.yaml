  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַקְשִׁ֥יבָ/ה יְהוָ֖ה אֵלָ֑/י וּ/שְׁמַ֖ע לְ/ק֥וֹל יְרִיבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
translation:
  language: pt
  text: Dá-me atenção, ó Yahweh, e escuta a voz dos meus adversários.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “escuta a voz dos meus adversários”. Isso pode significar tanto ouvir as acusações deles contra Jeremias como tomar conhecimento de seus planos hostis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Dá atenção
  rationale: O imperativo hifil de קשׁב pede atenção deliberada, não mera percepção auditiva. “Dá atenção” é natural, atual e preserva a urgência da súplica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo da primeira pessoa singular tem sentido direcional; com “dá atenção”, “a mim” é idiomático em português.
- source_word: וּשְׁמַע
  choice: e escuta
  rationale: O imperativo qal de שׁמע significa ouvir ou escutar. “Escuta” comunica atenção efetiva e mantém o paralelismo com a primeira oração.
- source_word: לְקוֹל
  choice: a voz
  rationale: קוֹל significa literalmente “voz” ou “som”. A formulação concreta “a voz” preserva a expressão hebraica.
- source_word: יְרִיבָי
  choice: dos meus adversários
  rationale: A forma derivada de ריב designa os que contendem ou disputam com o profeta. “Adversários” expressa oposição ativa sem restringir o sentido a acusadores formais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Natureza da fala dos adversários
  choice: Manter a expressão ampla “a voz dos meus adversários”
  alternative: Explicitar “as acusações” ou “os planos hostis”
  rationale: O hebraico não define se Jeremias pede que Deus ouça acusações dirigidas contra ele ou tome conhecimento da conspiração hostil. A tradução mantém essa abertura, e a nota registra as possibilidades.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com boa legibilidade brasileira. A invocação “ó Yahweh” preserva o tom de oração; “dá atenção” e “escuta” mantêm a progressão enfática dos dois imperativos hebraicos.
