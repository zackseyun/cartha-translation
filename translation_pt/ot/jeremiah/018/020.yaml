base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/020.yaml
  text: Should evil be repaid for good? For they have dug a pit for my life[a]. Remember that I stood before you to speak good on their behalf[b], to turn your wrath away from them.
translation:
  language: pt
  text: Acaso se retribui o bem com o mal? Pois eles cavaram uma cova contra a minha vida[a]. Lembra-te de que estive diante de ti para falar em favor deles[b], a fim de desviar deles a tua ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma cova para a minha alma”. Aqui, a palavra hebraica muitas vezes significa “vida” ou a própria pessoa em contextos de perigo mortal.
    reason: lexical_alternative
  - marker: b
    text: Ou “para falar para o bem deles” ou “para falar bem a respeito deles”. No contexto, Jeremias está intercedendo por eles diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְשֻׁלַּם
  choice: Acaso se paga
  rationale: O pual imperfeito introduz uma pergunta retórica. A construção passiva pronominal é natural em português e preserva a ideia de retribuição.
- source_word: תַּחַת טוֹבָה רָעָה
  choice: o mal em troca do bem
  rationale: “Em troca de” expressa claramente a relação de retribuição, mantendo o forte contraste moral entre bem e mal.
- source_word: כִּי כָרוּ שׁוּחָה
  choice: Pois eles cavaram uma cova
  rationale: A conjunção apresenta o fundamento da queixa, e a expressão hebraica descreve a abertura de uma cova que funciona como armadilha.
- source_word: לְנַפְשִׁי
  choice: para tirar-me a vida
  rationale: Neste contexto de ameaça mortal, נֶפֶשׁ designa a vida ou a própria pessoa. A formulação torna claro o propósito hostil implícito na imagem da cova.
- source_word: זְכֹר עָמְדִי לְפָנֶיךָ
  choice: Lembra-te de que estive diante de ti
  rationale: Mantém o imperativo dirigido a Deus e a linguagem de comparecer diante dele como intercessor.
- source_word: לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: para falar em favor deles
  rationale: A expressão pode indicar falar algo bom a respeito deles ou falar visando o bem deles; no contexto, “em favor deles” comunica a intercessão sem impor uma formulação doutrinária.
- source_word: לְהָשִׁיב אֶת חֲמָתְךָ מֵהֶם
  choice: a fim de desviar deles a tua ira
  rationale: O hifil de שׁוב indica fazer voltar ou afastar. “Desviar deles” é idiomático e preserva a direção da ação, enquanto “ira” comunica adequadamente a gravidade de חֵמָה.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto da conspiração
  choice: vida
  alternative: alma
  rationale: A cova representa uma ameaça à existência de Jeremias; “vida” evita introduzir uma distinção antropológica entre corpo e alma que o contexto não exige.
- issue: Natureza da fala de Jeremias diante de Deus
  choice: falar em favor deles
  alternative: falar bem a respeito deles / falar para o bem deles
  rationale: O contexto sustenta a intercessão, mas a nota conserva as nuances possíveis da construção hebraica.
- issue: Tradução de חֲמָה aplicado à reação divina
  choice: ira
  alternative: furor
  rationale: “Ira” preserva a solenidade do juízo divino sem ampliar indevidamente a intensidade lexical nem transformar o termo em categoria teológica técnica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas pronominais que mantêm o tom de oração. “Acaso” assinala a pergunta retórica; “tirar-me a vida” explicita naturalmente a ameaça representada pela cova. Todos os marcadores de nota aparecem no texto.
