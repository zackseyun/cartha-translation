id: JER.18.16
reference: Jeremiah 18:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/שׂ֥וּם אַרְצָ֛/ם לְ/שַׁמָּ֖ה שרוקת עוֹלָ֑ם כֹּ֚ל עוֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֖ם וְ/יָנִ֥יד בְּ/רֹאשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/016.yaml
  text: making their land a desolation[a], an object of perpetual hissing[b]; everyone who passes by it will be appalled and shake his head.
translation:
  language: pt
  text: fazendo da terra deles uma desolação, motivo de assobios perpétuos[a]. Todo aquele que passar por ela ficará horrorizado e balançará a cabeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objeto de assobio perpétuo”. O assobio representa provavelmente o som de desprezo ou espanto feito por quem contempla a terra arruinada.
    reason: lexical_alternative
  - marker: b
    text: Balançar a cabeça era um gesto que podia expressar desprezo, espanto ou consternação diante da devastação.
    reason: cultural_note
lexical_decisions:
- source_word: לָשׂוּם
  choice: fazendo
  rationale: O infinitivo construto com לְ dá continuidade sintática ao versículo anterior e pode indicar propósito ou resultado; o gerúndio preserva essa ligação sem decidir além do necessário.
- source_word: אַרְצָם
  choice: a terra deles
  rationale: אֶרֶץ designa aqui a terra pertencente ao povo julgado; a formulação é direta e natural em português.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: שַׁמָּה descreve devastação em contextos de juízo. “Desolação” mantém a forma nominal e o registro profético.
- source_word: שרוקת עוֹלָם
  choice: motivo de assobios perpétuos
  rationale: A expressão evoca o som de assobio dirigido com desprezo ou espanto a uma terra arruinada. “Motivo de” torna a relação idiomática inteligível, enquanto “assobios” conserva a imagem sonora e “perpétuos” expressa duração contínua sem impor uma noção metafísica de eternidade.
- source_word: כֹּל עוֹבֵר עָלֶיהָ
  choice: Todo aquele que passar por ela
  rationale: A frase refere-se a quem passa junto da terra devastada. O pronome feminino retoma naturalmente “terra” em português.
- source_word: יִשֹּׁם
  choice: ficará horrorizado
  rationale: No qal, שמם pode descrever a reação de assombro ou horror diante da devastação. “Ficará horrorizado” comunica com clareza a intensidade da reação.
- source_word: וְיָנִיד בְּרֹאשׁוֹ
  choice: e balançará a cabeça
  rationale: A expressão hebraica descreve um gesto que pode comunicar desprezo, espanto ou consternação. A tradução preserva o gesto sem restringir seu sentido a uma só emoção.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O gerúndio inicial mantém a dependência sintática do versículo anterior. As imagens hebraicas do assobio e do movimento da cabeça foram preservadas e esclarecidas em notas, sem eliminar sua amplitude expressiva.
