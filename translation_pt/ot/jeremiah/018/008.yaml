base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/008.yaml
  text: And if that nation turns from its evil[a], against which I spoke[c][b], then I will relent concerning the disaster that I planned to do to it.
translation:
  language: pt
  text: E, se aquela nação, contra a qual falei, se afastar da sua maldade[a], então voltarei atrás[c] quanto à calamidade[b] que planejei causar-lhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltar” ou “arrepender-se”. O verbo hebraico significa literalmente “voltar/retornar”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega a mesma palavra para a “maldade” da nação e para a “calamidade” planejada por Deus; o sentido passa do mal moral para a desgraça ou juízo.
    reason: lexical_alternative
  - marker: c
    text: Ou “mudarei de ideia” ou “desistirei”. A expressão hebraica apresenta Deus retirando, em resposta à mudança da nação, o juízo que havia anunciado.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁב
  choice: E, se ... se afastar
  rationale: O verbo שׁוב significa literalmente “voltar/retornar”, mas aqui descreve o abandono de uma conduta má. A forma condicional explícita decorre do contexto iniciado no versículo anterior; “se afastar” comunica a mudança moral em português atual sem reduzir o verbo ao termo técnico “arrepender-se”.
- source_word: הַגּוֹי הַהוּא
  choice: aquela nação
  rationale: גּוֹי designa uma nação como sujeito coletivo, e o demonstrativo é naturalmente expresso por “aquela”.
- source_word: מֵרָעָתוֹ
  choice: da sua maldade
  rationale: Neste primeiro uso, רָעָה indica mal moral, isto é, a conduta perversa da nação. “Maldade” é claro e natural, enquanto a nota preserva sua relação lexical com o segundo uso do termo.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלָיו
  choice: contra a qual falei
  rationale: A construção דִּבֵּר עַל pode significar falar a respeito de alguém ou contra alguém. O contexto é de juízo anunciado, por isso “contra a qual falei” preserva a força adversativa sem acrescentar “pronunciei juízo” ao texto.
- source_word: וְנִחַמְתִּי
  choice: então voltarei atrás
  rationale: Neste contexto, נחם descreve a desistência responsiva de executar um juízo anunciado. “Voltarei atrás” é linguagem corrente e preserva a tensão do texto sem sugerir arrependimento por culpa moral.
- source_word: עַל הָרָעָה
  choice: quanto à calamidade
  rationale: O segundo emprego de רָעָה refere-se à desgraça ou calamidade punitiva, não ao mal moral. “Calamidade” deixa clara essa mudança de sentido.
- source_word: אֲשֶׁר חָשַׁבְתִּי
  choice: que planejei
  rationale: חשב pode significar pensar, pretender ou planejar. Aqui expressa a intenção deliberada de realizar a ação anunciada.
- source_word: לַעֲשׂוֹת לוֹ
  choice: causar-lhe
  rationale: A expressão significa literalmente “fazer a ela”. Com “calamidade” como objeto, “causar-lhe” é uma formulação portuguesa natural que mantém a direção da ação contra a nação.
theological_decisions:
- issue: Linguagem de נִחַם aplicada a Deus
  choice: então voltarei atrás
  alternative: então mudarei de ideia; então desistirei
  rationale: O versículo apresenta o juízo anunciado por Deus como responsivo à mudança humana. “Voltarei atrás” mantém essa afirmação e sua tensão teológica, sem atribuir a Deus arrependimento por falta moral nem transformar o anúncio em decreto incondicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a relação condicional com o versículo anterior, distingue os dois sentidos de רָעָה e evita tanto terminologia excessivamente técnica quanto a resolução indevida da tensão teológica.
