id: JER.18.12
reference: Jeremiah 18:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמְר֖וּ נוֹאָ֑שׁ כִּֽי אַחֲרֵ֤י מַחְשְׁבוֹתֵ֨י/נוּ֙ נֵלֵ֔ךְ וְ/אִ֛ישׁ שְׁרִר֥וּת לִבּֽ/וֹ הָ/רָ֖ע נַעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/012.yaml
  text: But they will say[a], ‘It is hopeless, for we will follow our own plans, and each of us will act according to the stubbornness of his evil heart.’
translation:
  language: pt
  text: 'Mas eles dirão[a]: “Não há esperança! Pois seguiremos nossos próprios planos, e cada um de nós agirá segundo a obstinação do seu coração mau.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É inútil” ou “Não adianta”. A expressão hebraica pode indicar tanto desespero quanto a rejeição do apelo do profeta como algo inútil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹאָשׁ
  choice: Não há esperança
  rationale: Expressa de modo natural em português a ideia de desesperança, sem excluir o sentido contextual de que o apelo profético é considerado inútil; essa alternativa é preservada em nota.
- source_word: אַחֲרֵי מַחְשְׁבוֹתֵינוּ נֵלֵךְ
  choice: seguiremos nossos próprios planos
  rationale: O hebraísmo “andar/ir atrás de” significa seguir ou perseguir; “planos” comunica a autodeterminação intencional sem acrescentar necessariamente a ideia de astúcia.
- source_word: וְאִישׁ
  choice: e cada um de nós
  rationale: Reproduz o singular distributivo em português natural e deixa claro que os próprios falantes se incluem na declaração coletiva.
- source_word: שְׁרִרוּת
  choice: obstinação
  rationale: Designa teimosia deliberada ou resistência voluntariosa; “obstinação” conserva a força moral da rebeldia no contexto de Jeremias.
- source_word: לִבּוֹ הָרָע
  choice: seu coração mau
  rationale: “Coração” preserva a imagem hebraica do centro interior da vontade e do pensamento, enquanto “mau” mantém a avaliação moral explícita.
- source_word: נַעֲשֶׂה
  choice: agirá
  rationale: No contexto, o verbo amplo “fazer” descreve a conduta orientada pelo coração; “agirá” é claro e idiomático em português.
theological_decisions:
- issue: Entender a resposta do povo como desespero ou rejeição desdenhosa
  choice: Não há esperança
  alternative: É inútil; não adianta
  rationale: A expressão hebraica pode indicar falta de esperança ou declarar inútil o apelo do profeta. O texto principal conserva o tom de desesperança, e a nota preserva a possibilidade de uma rejeição desdenhosa, sem diminuir a responsabilidade do povo por decidir continuar em sua conduta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados onde naturais; “obstinação” mantém o peso moral sem recorrer a linguagem arcaica.
