reference: Jeremiah 18:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֠הוָה יָדַ֜עְתָּ אֶֽת כָּל עֲצָתָ֤/ם עָלַ/י֙ לַ/מָּ֔וֶת אַל תְּכַפֵּר֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תֶּ֑מְחִי ו/היו מֻכְשָׁלִים֙ לְ/פָנֶ֔י/ךָ בְּ/עֵ֥ת אַפְּ/ךָ֖ עֲשֵׂ֥ה בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/023.yaml
  text: But you[a], O Yahweh, know all their counsel against me for death. Do not cover over their iniquity, and do not blot out their sin from before you. Let them be made to stumble before you; in the time of your anger[c][b], act against them.
translation:
  language: pt
  text: Mas tu, ó Yahweh, conheces todos os planos deles contra mim para me matar.[a] Não encubras a iniquidade deles[b] nem apagues o pecado deles de diante de ti. Que sejam levados a tropeçar diante de ti;[c] no tempo da tua ira, age contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “contra mim para a morte”; também pode ser entendido como “contra mim, visando à minha morte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não perdoes a iniquidade deles” ou “não faças expiação pela culpa deles”. O verbo hebraico pode transmitir a ideia de expiar, remover ou encobrir a culpa.
    reason: lexical_alternative
  - marker: c
    text: Ou “Que tropecem diante de ti”. A forma hebraica também pode ressaltar que eles são levados a tropeçar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e seguindo a forma adotada na camada de consulta.
- source_word: עֲצָתָם
  choice: os planos deles
  rationale: עֵצָה pode significar conselho, plano ou propósito; “planos” comunica naturalmente o sentido de conspiração hostil neste contexto.
- source_word: עָלַי לַמָּוֶת
  choice: contra mim para me matar
  rationale: Explicita em português corrente o propósito mortífero da expressão hebraica compacta, literalmente “contra mim para a morte”; a forma literal é preservada em nota.
- source_word: תְּכַפֵּר עַל עֲוֺנָם
  choice: encubras a iniquidade deles
  rationale: “Encobrir” preserva a imagem concreta de כפר e evita reduzir no texto principal sua amplitude semântica a “perdoar” ou “expiar”.
- source_word: עֲוֺנָם
  choice: a iniquidade deles
  rationale: Mantém a ideia de culpa moral e distingue o termo do paralelo חַטָּאתָם, “o pecado deles”.
- source_word: חַטָּאתָם
  choice: o pecado deles
  rationale: Equivalente corrente e direto, preservando o paralelismo com “iniquidade” sem fundir os dois termos.
- source_word: תֶּמְחִי
  choice: apagues
  rationale: Reproduz de modo idiomático a metáfora de remover ou apagar o pecado como algo registrado ou presente diante de Deus.
- source_word: מִלְּפָנֶיךָ
  choice: de diante de ti
  rationale: Conserva a expressão espacial hebraica e sua possível conotação judicial.
- source_word: וְהָיוּ מֻכְשָׁלִים לְפָנֶיךָ
  choice: Que sejam levados a tropeçar diante de ti
  rationale: Expressa a força volitiva da oração e preserva de maneira natural o valor passivo-causativo da forma hophal.
- source_word: בְּעֵת אַפְּךָ
  choice: no tempo da tua ira
  rationale: Traduz o sentido idiomático de אַף e mantém a referência temporal, com registro solene e claro.
- source_word: עֲשֵׂה בָהֶם
  choice: age contra eles
  rationale: A expressão hebraica é concisa, literalmente “faz neles/com eles”; a tradução comunica a força hostil e judicial do contexto sem especificar uma pena não declarada.
theological_decisions:
- issue: Preservação da força imprecatória das petições
  choice: Traduzir como pedido direto para que Deus não encubra nem apague a culpa dos inimigos e aja contra eles em sua ira.
  alternative: Suavizar as frases como descrição, ou substituir a linguagem por um pedido genérico de justiça.
  rationale: As formas volitivas hebraicas apresentam uma oração imprecatória explícita. A tradução conserva sua severidade e tensão teológica sem justificá-la, atenuá-la ou ampliá-la.
- issue: Amplitude de כפר
  choice: Manter no texto a metáfora “encobrir”, com alternativas em nota.
  alternative: Traduzir diretamente como “perdoar” ou “expiar”.
  rationale: O verbo admite sentidos relacionados a expiação, remoção ou cobertura da culpa. A opção principal preserva a imagem e a ambiguidade, enquanto a nota esclarece as leituras possíveis.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Emprega “tu” em concordância consistente para a oração dirigida a Deus. A formulação evita arcaísmos desnecessários, mas conserva as imagens hebraicas de encobrir, apagar e estar diante de Deus.
