lexical_decisions:
- source_word: רֶגַע
  choice: Em certo momento
  rationale: Preserva o valor temporal e a formulação geral, além de combinar com a estrutura paralela do versículo seguinte.
- source_word: אֲדַבֵּר
  choice: posso falar
  rationale: O imperfeito piel introduz uma ação geral ou contingente no desenvolvimento condicional dos vv. 7–10; esta forma evita tratá-la como um único ato passado.
- source_word: עַל
  choice: a respeito de
  rationale: Com o verbo 'falar', pode introduzir o tema ou objeto do pronunciamento. A tradução mantém a amplitude da preposição, enquanto a alternativa adversativa é registrada em nota.
- source_word: גּוֹי
  choice: nação
  rationale: Equivalente corrente para a entidade coletiva e política em vista.
- source_word: מַמְלָכָה
  choice: reino
  rationale: Preserva o sentido político e forma um par natural com 'nação'.
- source_word: לִנְתוֹשׁ
  choice: arrancar
  rationale: Conserva a imagem de retirar uma planta pela raiz, recorrente em Jeremias, em português natural.
- source_word: לִנְתוֹץ
  choice: derrubar
  rationale: Expressa de modo claro a demolição ou queda de uma estrutura, sem especificação excessiva.
- source_word: וּלְהַאֲבִיד
  choice: destruir
  rationale: Traduz diretamente o hifil de אבד, que aqui significa fazer perecer ou destruir.
theological_decisions:
- issue: Força da fórmula de fala divina no contexto geral e condicional
  choice: posso falar
  alternative: falo; declaro
  rationale: O versículo introduz um princípio geral sobre os pronunciamentos de Deus acerca das nações, e não apenas uma declaração passada. A formulação mantém o caráter situacional sem acrescentar uma modalidade teológica mais forte do que o hebraico exige.
- issue: Sentido de עַל diante dos verbos de juízo
  choice: a respeito de
  alternative: contra
  rationale: A preposição pode indicar o assunto do pronunciamento ou adquirir nuance adversativa no contexto. O texto principal preserva o sentido mais amplo, e a nota registra a leitura adversativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência verbal é concisa e mantém o movimento das três ações de juízo.
