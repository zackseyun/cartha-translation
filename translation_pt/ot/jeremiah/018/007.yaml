  text: At one moment I may speak concerning a nation and concerning a kingdom[a], to uproot and to tear down and to destroy.
translation:
  language: pt
  text: Em certo momento, posso falar a respeito de uma nação e de um reino[a], para arrancar, derrubar e destruir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra uma nação e contra um reino”. A preposição pode ter sentido mais adversativo à luz dos verbos de juízo que vêm em seguida.'
