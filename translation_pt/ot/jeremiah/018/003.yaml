  text: וָ/אֵרֵ֖ד בֵּ֣ית הַ/יּוֹצֵ֑ר ו/הנ/הו עֹשֶׂ֥ה מְלָאכָ֖ה עַל הָ/אָבְנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/003.yaml
  text: So I went down to the potter’s house[a], and there he was[b], doing work on the wheel.
translation:
  language: pt
  text: Então desci à casa do oleiro e lá estava ele, trabalhando na roda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa uma forma dual, tradicionalmente entendida como referência às duas rodas do aparelho do oleiro.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Então desci
  rationale: O wayyiqtol de ירד dá continuidade à sequência narrativa, enquanto o verbo “descer” preserva o sentido direcional.
- source_word: בֵּית הַיּוֹצֵר
  choice: à casa do oleiro
  rationale: A construção hebraica significa literalmente “casa do oleiro”; esta forma é natural e clara em português.
- source_word: וְהִנֵּהוּ
  choice: e lá estava ele
  rationale: הִנֵּה chama vividamente a atenção para o que Jeremias viu, e o sufixo pronominal aponta para o oleiro. A expressão evita o tom arcaico de “eis que” sem perder a força de apresentação.
- source_word: עֹשֶׂה מְלָאכָה
  choice: trabalhando
  rationale: Traduz de modo natural a expressão formada pelo particípio de “fazer” e pelo substantivo “trabalho”, sem especificar indevidamente o objeto produzido.
- source_word: עַל הָאָבְנָיִם
  choice: na roda
  rationale: Embora אָבְנַיִם tenha forma dual e designe literalmente “as duas rodas”, refere-se ao aparelho de roda usado pelo oleiro. O singular coletivo é a forma corrente e compreensível em português; a forma do hebraico é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. “Oleiro” mantém a imagem concreta do contexto; “lá estava ele” reproduz a vivacidade de הִנֵּה sem arcaísmo. A expressão técnica é apresentada naturalmente no texto e sua forma dual hebraica é registrada em nota.
