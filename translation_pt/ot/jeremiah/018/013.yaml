base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/013.yaml
  text: 'Therefore thus says Yahweh: Ask now among the nations[b][a], who has heard such things? Virgin Israel has done a very horrible thing.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh: “Perguntem agora entre as nações: quem já ouviu coisa semelhante? A virgem Israel fez algo extremamente horrível.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de modo natural em português a conclusão decorrente da acusação anterior.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética convencional e representa diretamente o nome divino.
- source_word: שַׁאֲלוּ נָא בַּגּוֹיִם
  choice: Perguntem agora entre as nações
  rationale: O imperativo plural é mantido, e “agora” comunica a força discursiva de נָא.
- source_word: מִי שָׁמַע כָּאֵלֶּה
  choice: quem já ouviu coisa semelhante?
  rationale: Expressa naturalmente a pergunta retórica e conserva a ideia comparativa de algo sem precedente.
- source_word: שַׁעֲרֻרִת עָשְׂתָה מְאֹד
  choice: fez algo extremamente horrível
  rationale: “Extremamente” representa מְאֹד, enquanto “horrível” comunica o caráter espantoso e ultrajante do substantivo raro שַׁעֲרֻרִת.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: a virgem Israel
  rationale: Mantém a personificação profética de Israel sem acrescentar “filha”, termo ausente no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Personificação de Israel como בְּתוּלַת יִשְׂרָאֵל
  choice: a virgem Israel
  alternative: Israel virgem; a virgem filha de Israel
  rationale: A escolha conserva a metáfora e evita inserir “filha”, que não ocorre neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A construção mantém a solenidade da fórmula profética sem rigidez excessiva.
