  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/כַ/יּוֹצֵ֨ר הַ/זֶּ֜ה לֹא אוּכַ֨ל לַ/עֲשׂ֥וֹת לָ/כֶ֛ם בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הִנֵּ֤ה כַ/חֹ֨מֶר֙ בְּ/יַ֣ד הַ/יּוֹצֵ֔ר כֵּן אַתֶּ֥ם בְּ/יָדִ֖/י בֵּ֥ית יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/006.yaml
  text: Can I not do with you[a], house of Israel, as this potter does? declares Yahweh. Look, like clay in the hand of the potter, so are you in my hand, house of Israel.
translation:
  language: pt
  text: “Será que não posso fazer com vocês, ó casa de Israel, como faz este oleiro?[a]”, declara Yahweh. “Vejam! Como o barro na mão do oleiro, assim vocês estão na minha mão, ó casa de Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como este oleiro”. A comparação em hebraico é concisa e admite pequenas variações de formulação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכַיּוֹצֵר הַזֶּה ... אוּכַל לַעֲשׂוֹת לָכֶם
  choice: Será que não posso fazer com vocês ... como faz este oleiro?
  rationale: A pergunta retórica expressa capacidade e autoridade. “Fazer com vocês” mantém a amplitude de עשה com ל, sem especificar se a ação é favorável ou punitiva; “como faz este oleiro” explicita naturalmente em português a comparação concisa do hebraico.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Preserva a designação coletiva e o tom de apóstrofe profética; o vocativo “ó” esclarece que Israel está sendo diretamente interpelado.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” mantém a solenidade da fórmula profética, e “Yahweh” translitera o nome divino pessoal.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: A forma plural concorda com o destinatário coletivo expresso por “vocês” e conserva a função enfática de chamar a atenção, em linguagem atual.
- source_word: כַחֹמֶר בְּיַד הַיּוֹצֵר
  choice: Como o barro na mão do oleiro
  rationale: Mantém diretamente a imagem central. Em português, “o barro” é a formulação natural para a matéria que está nas mãos do oleiro.
- source_word: כֵּן אַתֶּם בְּיָדִי
  choice: assim vocês estão na minha mão
  rationale: “Assim” marca a correspondência da comparação, e “na minha mão” preserva literalmente a metáfora de autoridade e poder.
theological_decisions:
- issue: Soberania divina na metáfora do oleiro e do barro
  choice: Conservar a metáfora e a afirmação da autoridade de Yahweh sem explicá-las por um sistema determinista.
  alternative: Interpretar a figura como predestinação absoluta ou, no extremo oposto, reduzi-la apenas a cuidado artesanal.
  rationale: O versículo afirma a autoridade de Yahweh sobre Israel, mas o contexto da metáfora não deve ser sobrecarregado com conclusões doutrinárias que o enunciado, por si só, não formula.
- issue: Amplitude da ação divina em לַעֲשׂוֹת לָכֶם
  choice: fazer com vocês
  alternative: fazer a vocês; tratar vocês
  rationale: A opção escolhida preserva a abertura semântica quanto ao tipo de ação divina e se ajusta à relação entre oleiro e barro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o destinatário coletivo, mantém “casa de Israel” como fórmula profética e usa “Yahweh” para o nome divino. A pontuação apresenta as palavras divinas como discurso direto.
