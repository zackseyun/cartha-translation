base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/002.yaml
  text: Arise and go down to the potter’s house[a], and there I will let you hear my words.
translation:
  language: pt
  text: Levante-se e desça à casa do oleiro[a]. Ali farei você ouvir as minhas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: “Levanta-te e desce à casa do oleiro; e ali farei que ouças as minhas palavras.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Levante-se
  rationale: O imperativo de קום indica levantar-se e iniciar a ação. “Levante-se” conserva o tom digno de uma ordem profética e é natural em português moderno.
- source_word: וְ/יָרַדְתָּ֖
  choice: e desça
  rationale: ירד expressa movimento descendente. “Desça” preserva a direção, possivelmente relacionada à topografia de Jerusalém, sem acrescentar interpretação.
- source_word: בֵּ֣ית הַ/יּוֹצֵ֑ר
  choice: à casa do oleiro
  rationale: Reproduz naturalmente em português a construção hebraica “casa do oleiro” e mantém a imagem concreta do local de trabalho ou residência.
- source_word: הַ/יּוֹצֵר
  choice: oleiro
  rationale: Embora o particípio de יצר possa designar quem forma ou modela, o contexto imediato de trabalho com barro torna “oleiro” a opção precisa.
- source_word: וְ/שָׁ֖מָּ/ה
  choice: Ali
  rationale: O advérbio enfatiza o lugar em que Jeremias ouvirá as palavras divinas. Separá-lo em nova frase produz português claro sem perder a sequência hebraica.
- source_word: אַשְׁמִֽיעֲ/ךָ֥
  choice: farei você ouvir
  rationale: A forma hifil de שמע é causativa. “Farei você ouvir” preserva mais diretamente essa nuance do que “direi a você” ou “anunciarei a você”.
- source_word: אֶת דְּבָרָֽ/י
  choice: as minhas palavras
  rationale: Mantém o plural hebraico e evita reduzi-lo interpretativamente ao singular “minha mensagem”.
theological_decisions: []
