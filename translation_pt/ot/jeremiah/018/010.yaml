  text: וְ/עָשָׂ֤ה ה/רעה בְּ/עֵינַ֔/י לְ/בִלְתִּ֖י שְׁמֹ֣עַ בְּ/קוֹלִ֑/י וְ/נִֽחַמְתִּי֙ עַל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָמַ֖רְתִּי לְ/הֵיטִ֥יב אוֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/010.yaml
  text: but if it does what is evil in my sight[a], not listening to my voice[b], then I will relent concerning the good that I said I would do to it.
translation:
  language: pt
  text: mas, se fizer o que é mau aos meus olhos, não dando ouvidos à minha voz, então voltarei atrás[a] quanto ao bem que eu disse que lhe faria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mudarei de ideia”. O verbo hebraico pode indicar a reversão de uma linha de ação anunciada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que eu disse que faria o bem a ela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה הָרָעָה
  choice: mas, se fizer o que é mau
  rationale: O verbo significa “fazer”, e o contexto iniciado no versículo anterior fornece a condição, expressa naturalmente em português por “se”. A omissão do pronome evita impor gênero ao referente coletivo “nação ou reino”.
- source_word: בְּעֵינַי
  choice: aos meus olhos
  rationale: Conserva a conhecida expressão hebraica de avaliação divina e é natural em português.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלִי
  choice: deixando de ouvir a minha voz
  rationale: Expressa a recusa ou falha em dar ouvidos, preservando a imagem hebraica da voz sem reduzir imediatamente “ouvir” a “obedecer”.
- source_word: וְנִחַמְתִּי
  choice: então voltarei atrás
  rationale: Neste contexto, נחם indica abandonar ou reverter uma ação anunciada. “Voltarei atrás” preserva a contingência real do pronunciamento sem sugerir arrependimento por culpa moral.
- source_word: עַל הַטּוֹבָה
  choice: quanto ao bem
  rationale: A preposição introduz o assunto a respeito do qual haverá reversão, e “o bem” mantém o contraste moral e retórico do texto.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: que eu disse
  rationale: Tradução direta e natural de אמרתי, sem transformar indevidamente a declaração em promessa.
- source_word: לְהֵיטִיב אֹתוֹ
  choice: que lhe faria
  rationale: Em conexão com “o bem”, a formulação evita repetição pesada. O pronome átono “lhe” retoma naturalmente o referente coletivo sem marcar seu gênero.
theological_decisions:
- issue: Linguagem de נחם aplicada a Deus
  choice: voltarei atrás
  alternative: mudarei de ideia; me arrependerei
  rationale: 'A formulação mantém a tensão do texto: o bem anunciado por Deus é apresentado como condicionado à resposta da nação. Ao mesmo tempo, não sugere que Deus tenha cometido um mal moral do qual precise arrepender-se.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita marcar o gênero do referente coletivo e preserva tanto a imagem de ouvir a voz quanto a contingência expressa no pronunciamento divino.
