  text: כְּ/רֽוּחַ קָדִ֥ים אֲפִיצֵ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב עֹ֧רֶף וְ/לֹֽא פָנִ֛ים אֶרְאֵ֖/ם בְּ/י֥וֹם אֵידָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/017.yaml
  text: Like an east wind I will scatter them before the enemy[a]; I will show them the back and not the face in the day of their disaster.
translation:
  language: pt
  text: Como um vento do leste, eu os espalharei diante do inimigo; mostrarei a eles as costas, e não o rosto[a], no dia da calamidade deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a nuca (ou as costas), e não o rosto”. A imagem retrata o SENHOR retirando sua presença favorável, em vez de voltar o rosto para atendê-los.'
    reason: Esclarece o sentido literal de עֹרֶף e a força da expressão antropomórfica sem eliminar a metáfora do texto.
lexical_decisions:
- source_word: כְּרוּחַ קָדִים
  choice: Como um vento do leste
  rationale: Preserva a comparação marcada por כְּ e a imagem do vento oriental, frequentemente destrutivo, sem acrescentar ao texto a ideia explícita de calor abrasador.
- source_word: אֲפִיצֵם
  choice: eu os espalharei
  rationale: 'O hifil de פוץ expressa ação causativa: espalhar ou dispersar. “Espalharei” é direto, natural e adequado ao contexto de juízo.'
- source_word: לִפְנֵי אוֹיֵב
  choice: diante do inimigo
  rationale: Reproduz de modo conciso a expressão hebraica e indica que o povo será disperso diante do adversário.
- source_word: עֹרֶף וְלֹא פָנִים
  choice: as costas, e não o rosto
  rationale: עֹרֶף designa literalmente a nuca ou a parte de trás e, em contraste com “rosto”, retrata alguém que se volta para longe. “As costas” conserva a metáfora concreta com naturalidade em português.
- source_word: אֶרְאֵם
  choice: mostrarei a eles
  rationale: Nesta construção, ראה com objeto e complemento predicativo tem o sentido de fazer ver ou mostrar. A formulação permite conservar o contraste entre costas e rosto.
- source_word: בְּיוֹם אֵידָם
  choice: no dia da calamidade deles
  rationale: אֵיד denota calamidade, desastre ou ruína. A tradução mantém tanto a construção temporal quanto o tom solene da profecia e evita a possível ambiguidade de “sua calamidade”.
theological_decisions:
- issue: Linguagem antropomórfica para a retirada do favor divino
  choice: 'Conservar a imagem concreta: “mostrarei a eles as costas, e não o rosto”.'
  alternative: Explicitar o sentido como “eu me afastarei deles” ou “não lhes mostrarei favor”.
  rationale: O hebraico expressa o juízo divino por meio de uma imagem corporal deliberada. Mantê-la preserva a força poética e a tensão teológica do texto, enquanto a nota esclarece seu sentido sem substituí-la por uma abstração.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Vento do leste” é mais corrente que “vento oriental”; “calamidade” preserva o tom profético. A repetição explícita de “deles” evita ambiguidade pronominal.
