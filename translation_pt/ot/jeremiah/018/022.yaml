id: JER.18.22
reference: Jeremiah 18:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תִּשָּׁמַ֤ע זְעָקָה֙ מִ/בָּ֣תֵּי/הֶ֔ם כִּֽי תָבִ֧יא עֲלֵי/הֶ֛ם גְּד֖וּד פִּתְאֹ֑ם כִּֽי כָר֤וּ שיחה לְ/לָכְדֵ֔/נִי וּ/פַחִ֖ים טָמְנ֥וּ לְ/רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/022.yaml
  text: Let a cry be heard from their houses when you suddenly bring a raiding band upon them[b][a], for they have dug a pit to capture me and hidden traps for my feet.
translation:
  language: pt
  text: Ouça-se um grito vindo das casas deles quando, de repente, trouxeres contra eles um bando de saqueadores[a], pois cavaram uma cova para me capturar e esconderam armadilhas[b] para os meus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma tropa” ou “um grupo de invasores”.
    reason: lexical_alternative
  - marker: b
    text: Ou “laços”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשָּׁמַע
  choice: Ouça-se
  rationale: O nifal imperfeito tem sentido passivo e, no contexto desta oração imprecatória, força jussiva. “Ouça-se” preserva tanto a voz passiva quanto o caráter de petição.
- source_word: זְעָקָה
  choice: um grito
  rationale: Designa um clamor de aflição. “Grito” é natural em português e mantém a intensidade emocional sem especificar demais.
- source_word: מִבָּתֵּיהֶם
  choice: vindo das casas deles
  rationale: Explicita de modo natural a origem espacial do grito, preservando a imagem concreta das casas.
- source_word: כִּי
  choice: quando
  rationale: A primeira ocorrência introduz a circunstância temporal em que o grito será ouvido, e não propriamente a causa.
- source_word: תָבִיא
  choice: trouxeres
  rationale: O hifil de בוא significa “trazer” ou “fazer vir”. A forma verbal se harmoniza com a oração iniciada por “quando” e mantém Deus como sujeito implícito.
- source_word: גְּדוּד
  choice: um bando de saqueadores
  rationale: O termo pode designar tropa ou grupo de incursão. Esta formulação comunica de modo claro o caráter hostil e predatório sem o reduzir a um exército formal.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: Equivalente corrente e idiomático do advérbio, preservando a ideia de irrupção súbita.
- source_word: כִּי
  choice: pois
  rationale: 'A segunda ocorrência introduz a razão da petição de juízo: a conspiração anterior contra Jeremias.'
- source_word: כָרוּ
  choice: cavaram
  rationale: O perfeito hebraico apresenta a ação como realizada. O pretérito perfeito é direto e natural em português, com relevância presente inferida pelo contexto.
- source_word: שיחה
  choice: uma cova
  rationale: O substantivo designa uma cova ou fosso, aqui no contexto de uma armadilha. “Cova” preserva a metáfora concreta.
- source_word: לְלָכְדֵנִי
  choice: para me capturar
  rationale: O infinitivo expressa finalidade; “capturar” combina com a imagem da cova e com a intenção hostil.
- source_word: וּפַחִים טָמְנוּ
  choice: e esconderam armadilhas
  rationale: פַּחִים pode indicar armadilhas ou laços, e טָמְנוּ significa que foram ocultados. A construção é clara e natural em português.
theological_decisions:
- issue: Força imprecatória da oração de Jeremias
  choice: 'Manter a fala como petição direta por juízo: “Ouça-se um grito”.'
  alternative: 'Traduzir como simples previsão: “Um grito será ouvido”.'
  rationale: O imperfeito hebraico possui força jussiva neste contexto. Convertê-lo em mera previsão atenuaria a tensão retórica e teológica da oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a petição solene sem arcaísmo excessivo. Os marcadores de nota aparecem junto aos termos a que se referem.
