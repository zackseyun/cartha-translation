review_pass:
  verdict: revise
  source_fidelity: A estrutura imprecatória e as imagens de fome, espada e guerra são preservadas. Contudo, “ficar sem filhos” em português normalmente pode indicar não ter filhos, e não necessariamente perdê-los; enfraquece a nuance de שַׁכֻּלוֹת, que se refere a ser privada dos filhos por morte. A nota também introduz a peste como possibilidade interpretativa sem apoio suficiente para a apresentar como explicação contextual preferível.
  naturalness: O texto tem registro atual e solene. “Sejam mortos pela morte” é uma formulação propositalmente áspera, mas reproduz adequadamente a expressão hebraica difícil; a nota deve explicá-la sem resolver sua ambiguidade. “Privadas dos filhos” é mais claro e fiel que “sem filhos”.
  terminology: “Fome”, “espada”, “mulheres”, “homens”, “jovens” e “batalha” são escolhas adequadas. “Privadas dos filhos” mantém a distinção entre luto pela perda dos filhos e mera ausência de descendência.
  issues:
  - severity: medium
    issue: “Fiquem sem filhos”
    rationale: A expressão portuguesa pode significar simplesmente ser estéril ou não ter descendentes. O hebraico שַׁכֻּלוֹת descreve mulheres que sofreram a perda dos filhos; convém explicitar essa privação.
  - severity: medium
    issue: A nota sugere especificamente “possivelmente a peste”
    rationale: Embora מָוֶת possa, em certos contextos, relacionar-se a uma calamidade mortal, a expressão difícil não exige nem identifica aqui a peste. A nota deve preservar a incerteza, sem privilegiar essa leitura.
