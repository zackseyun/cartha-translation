  text: לָ/כֵן֩ תֵּ֨ן אֶת בְּנֵי/הֶ֜ם לָ/רָעָ֗ב וְ/הַגִּרֵ/ם֮ עַל יְדֵי חֶרֶב֒ וְ/תִֽהְיֶ֨נָה נְשֵׁי/הֶ֤ם שַׁכֻּלוֹת֙ וְ/אַלְמָנ֔וֹת וְ/אַ֨נְשֵׁי/הֶ֔ם יִֽהְי֖וּ הֲרֻ֣גֵי מָ֑וֶת בַּח֣וּרֵי/הֶ֔ם מֻכֵּי חֶ֖רֶב בַּ/מִּלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/021.yaml
  text: Therefore give their children over to famine[a], and hand them over to the power of the sword. Let their wives become bereaved and widowed, and let their men be slain by death[c][b], their young men struck down by the sword in battle.
translation:
  language: pt
  text: Por isso, entrega os filhos deles à fome e deixa-os à mercê da espada. Que as suas mulheres sejam privadas dos filhos e viúvas; que os seus homens sejam mortos pela morte[a], e os seus jovens, abatidos à espada na batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica incomum, literalmente “mortos da morte”. A formulação intensifica a destruição fatal, sem especificar o meio da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de modo natural e claro a conclusão ou consequência ligada ao pedido anterior.
- source_word: תֵּן אֶת־בְּנֵיהֶם לָרָעָב
  choice: entrega os filhos deles à fome
  rationale: נתן com ל expressa entrega a um destino ou poder; “entrega ... à fome” preserva a força judicial da súplica. בנים é vertido por “filhos”, seu sentido direto, sem excluir o possível uso coletivo para descendentes.
- source_word: וְהַגִּרֵם עַל־יְדֵי חֶרֶב
  choice: deixa-os à mercê da espada
  rationale: A construção difícil comunica exposição ou entrega ao poder da espada. A expressão portuguesa mantém a personificação concreta e soa natural, sem impor a imagem menos segura de “derramá-los”.
- source_word: וְתִהְיֶינָה נְשֵׁיהֶם שַׁכֻּלוֹת וְאַלְמָנוֹת
  choice: Que as suas mulheres fiquem sem filhos e viúvas
  rationale: A forma volitiva é preservada por “Que ... fiquem”. שַׁכֻּלוֹת indica mulheres privadas dos filhos, e não apenas mulheres que nunca os tiveram.
- source_word: וְאַנְשֵׁיהֶם
  choice: os seus homens
  rationale: Refere-se aos homens adultos do grupo, em paralelo com as mulheres e os jovens; “homens” evita restringir o termo somente aos maridos.
- source_word: הֲרֻגֵי מָוֶת
  choice: mortos pela morte
  rationale: Reproduz de maneira deliberadamente marcada a difícil expressão hebraica, literalmente “mortos da/pela morte”, preservando sua ambiguidade e seu efeito intensificador.
- source_word: בַּחוּרֵיהֶם מֻכֵּי חֶרֶב בַּמִּלְחָמָה
  choice: os seus jovens, abatidos à espada na batalha
  rationale: בַּחוּרִים são jovens do sexo masculino, geralmente em idade de lutar. “Abatidos à espada” conserva a imagem violenta do particípio passivo, e “na batalha” expressa o contexto imediato de guerra.
theological_decisions:
- issue: Súplica imprecatória dirigida a Deus
  choice: Preservar os pedidos diretos de juízo, sem suavizar a violência
  alternative: Transformar os pedidos em previsões futuras ou empregar eufemismos
  rationale: O hebraico usa formas imperativas e volitivas na oração de Jeremias. A tradução deve conservar a tensão retórica e teológica do texto, sem apresentar a fala como simples previsão nem atenuá-la.
- issue: Sentido de הֲרֻגֵי מָוֶת
  choice: Manter no texto a expressão paradoxal “mortos pela morte”
  alternative: Interpretar מָוֶת como “peste” ou parafrasear como “mortos de modo fatal”
  rationale: A locução hebraica é incomum e admite que “morte” designe uma calamidade mortal, possivelmente a peste. A formulação principal conserva a dificuldade do original, e a nota registra a interpretação contextual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência poética moderada. A formulação marcada “mortos pela morte” é intencional e vem acompanhada de nota para preservar a dificuldade e a ambiguidade do hebraico.
