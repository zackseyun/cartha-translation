base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/004.yaml
  text: And the vessel that he was making from the clay was spoiled in the potter’s hand[a], and he turned and made it into another vessel[b], as seemed right in the potter’s eyes to make.
translation:
  language: pt
  text: E o vaso que ele fazia de barro se estragou na mão do oleiro[a], e ele voltou a fazer dele outro vaso, conforme pareceu certo aos olhos do oleiro fazer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ficou deformado» ou «ficou arruinado». O verbo hebraico indica que o vaso se tornou defeituoso enquanto era trabalhado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «conforme era certo aos olhos do oleiro fazer», expressão que significa «conforme o oleiro julgou adequado fazer».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁחַת
  choice: se estragou
  rationale: O nifal de שׁחת indica que o vaso ficou defeituoso durante o trabalho. “Se estragou” é natural em português e preserva o sentido resultativo sem especificar indevidamente a causa.
- source_word: הַכְּלִי
  choice: o vaso
  rationale: כְּלִי é um termo amplo para objeto ou recipiente; no contexto da olaria, “vaso” é claro, corrente e apropriado.
- source_word: אֲשֶׁר הוּא עֹשֶׂה בַּחֹמֶר
  choice: que ele fazia de barro
  rationale: O particípio expressa uma ação em andamento, e בַּחֹמֶר identifica o material empregado. “Fazia de barro” é idiomático e mantém o aspecto processual.
- source_word: בְּיַד הַיּוֹצֵר
  choice: nas mãos do oleiro
  rationale: A expressão conserva a imagem concreta do trabalho sob o controle direto do oleiro. O plural idiomático “nas mãos” soa mais natural em português sem alterar a cena.
- source_word: וְשָׁב וַיַּעֲשֵׂהוּ
  choice: então ele tornou a fazer dele
  rationale: שׁוּב marca aqui a retomada ou repetição da ação, não necessariamente um movimento espacial. “Tornou a fazer” preserva essa renovação do trabalho, e “dele” explicita que o mesmo material é retrabalhado.
- source_word: כְּלִי אַחֵר
  choice: outro vaso
  rationale: Tradução direta e natural que indica uma forma ou produto diferente.
- source_word: כַּאֲשֶׁר יָשַׁר בְּעֵינֵי הַיּוֹצֵר לַעֲשׂוֹת
  choice: conforme pareceu certo aos olhos do oleiro fazê-lo
  rationale: A formulação preserva a imagem hebraica “aos olhos” e o valor avaliativo de יָשַׁר, sem reduzir a expressão a mera preferência nem lhe impor exclusivamente um sentido moral.
theological_decisions:
- issue: Imagem antropomórfica do oleiro e possível aplicação divina
  choice: Manter a cena concreta do oleiro sem acrescentar sua interpretação teológica no próprio versículo.
  alternative: Parafrasear como uma afirmação explícita da soberania de Deus para remodelar pessoas ou nações.
  rationale: Neste versículo, a imagem da oficina precede sua aplicação no contexto seguinte. Preservá-la sem expansão evita antecipar ou restringir a interpretação inspirada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a repetição de “vaso” e “oleiro” e conserva a expressão figurada “aos olhos do oleiro”. O ponto e vírgula organiza naturalmente as duas etapas da cena sem introduzir uma relação causal ausente no hebraico.
