  text: הֲ/יַעֲזֹ֥ב מִ/צּ֛וּר שָׂדַ֖י שֶׁ֣לֶג לְבָנ֑וֹן אִם יִנָּתְשׁ֗וּ מַ֛יִם זָרִ֥ים קָרִ֖ים נוֹזְלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/014.yaml
  text: Does the snow of Lebanon leave the rock of the open country? Or are cold[b][a], flowing foreign waters ever uprooted?
translation:
  language: pt
  text: Será que a neve do Líbano deixa o rochedo da região aberta[a]? Ou são arrancadas as águas estrangeiras[b], frias, que correm?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o rochedo do campo”, “o penhasco da região aberta” ou expressão semelhante. A frase hebraica é difícil e provavelmente evoca as alturas rochosas ou a região aberta associadas à neve do Líbano.
    reason: lexical_alternative
  - marker: b
    text: Ou “águas estranhas”. A expressão pode indicar águas vindas de uma fonte distante, e não águas “estrangeiras” em sentido moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲזֹב
  choice: Será que ... deixa
  rationale: A partícula interrogativa e o verbo עזב introduzem uma pergunta retórica. “Deixa” é natural para a neve que não abandona seu lugar e evita personificação excessiva.
- source_word: מִצּוּר שָׂדַי
  choice: do rochedo do campo aberto
  rationale: צוּר designa rocha ou rochedo, e שָׂדַי se relaciona com campo ou região aberta. A expressão hebraica é difícil; esta tradução conserva a imagem concreta sem identificar com certeza o acidente geográfico.
- source_word: שֶׁלֶג לְבָנוֹן
  choice: a neve do Líbano
  rationale: Reproduz diretamente a relação entre a neve e o Líbano, com formulação natural em português.
- source_word: אִם
  choice: Ou
  rationale: No paralelismo poético, introduz uma segunda pergunta retórica, não uma condição.
- source_word: יִנָּתְשׁוּ
  choice: são arrancadas
  rationale: O nifal de נתש traz normalmente a ideia de ser arrancado ou desarraigado. Embora incomum aplicado às águas, “arrancadas” preserva a metáfora marcante em vez de substituí-la por “secam” ou “deixam de correr”.
- source_word: מַיִם
  choice: as águas
  rationale: O plural “águas” combina com a linguagem poética e com a imagem de correntes ou fontes.
- source_word: זָרִים
  choice: estrangeiras
  rationale: זָרִים pode significar “estranhas” ou “estrangeiras”; aqui talvez indique águas provenientes de uma fonte distante. A tradução mantém a força lexical, e a nota esclarece a possível nuance espacial.
- source_word: קָרִים
  choice: frias
  rationale: Expressa diretamente a temperatura das águas, de acordo com a imagem de águas de montanha.
- source_word: נוֹזְלִים
  choice: correntes
  rationale: O particípio descreve águas em movimento. “Correntes” é conciso, natural e poético em português.
