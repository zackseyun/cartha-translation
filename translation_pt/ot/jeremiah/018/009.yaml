  text: וְ/רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/בְנֹ֖ת וְ/לִ/נְטֹֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/009.yaml
  text: And at another moment I may speak concerning a nation and concerning a kingdom[a], to build and to plant.
translation:
  language: pt
  text: E em outro momento posso falar a respeito de uma nação e de um reino[a], para edificar e plantar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E num momento falo a respeito de uma nação e de um reino, para edificar e plantar”. A expressão hebraica com “momento” enquadra as declarações de Deus nos v. 7–10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֶגַע
  choice: E em outro momento
  rationale: רֶגַע significa “momento” ou “instante”. No paralelismo contrastante com o v. 7, “em outro momento” comunica de modo natural a nova situação, sem perder a expressão temporal hebraica.
- source_word: אֲדַבֵּר
  choice: posso falar
  rationale: O imperfeito integra uma situação geral e contingente em 18.7–10. “Posso falar” conserva essa força sem transformar o verbo simples “falar” em “declarar”.
- source_word: עַל
  choice: a respeito de
  rationale: Com דבר, עַל indica aquilo sobre o qual se fala. “A respeito de” é claro e não introduz a hostilidade que “contra” sugeriria neste versículo positivo.
- source_word: גּוֹי
  choice: nação
  rationale: גּוֹי designa uma nação ou povo; “nação” preserva aqui o sentido coletivo e político, em paralelo com “reino”.
- source_word: מַמְלָכָה
  choice: reino
  rationale: מַמְלָכָה denota reino ou domínio. “Reino” é a equivalência direta, corrente e adequada ao par com “nação”.
- source_word: לִ/בְנֹת
  choice: para edificar
  rationale: O infinitivo de בנה significa literalmente “construir/edificar”. “Edificar” preserva a imagem e admite naturalmente como objeto uma nação ou um reino.
- source_word: וְ/לִ/נְטֹעַ
  choice: e plantar
  rationale: נטע significa “plantar”. A tradução mantém a metáfora agrícola e não acrescenta um pronome-objeto ausente do hebraico.
theological_decisions:
- issue: Condicionalidade divina na fala profética
  choice: posso falar
  alternative: falo / falarei
  rationale: Jeremias 18.7–10 formula situações em que o anúncio divino e a resposta de uma nação se relacionam. “Posso falar” preserva o caráter contingente do cenário sem sugerir incerteza em Deus nem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o paralelismo “nação/reino” e as metáforas “edificar/plantar”. O marcador [a] aparece no texto principal.
