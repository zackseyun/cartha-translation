  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אַל תֹּאמַ֖ר נַ֣עַר אָנֹ֑כִי כִּ֠י עַֽל כָּל אֲשֶׁ֤ר אֶֽשְׁלָחֲ/ךָ֙ תֵּלֵ֔ךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר אֲצַוְּ/ךָ֖ תְּדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/007.yaml
  text: But Yahweh said to me[a], “Do not say, ‘I am a youth,’ for to all to whom I send you, you shall go, and all that I command you[b], you shall speak.”
translation:
  language: pt
  text: 'Mas Yahweh me disse: “Não diga: ‘Sou jovem’[a], pois você irá a todos a quem eu o enviar[b] e falará tudo o que eu lhe ordenar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Sou um rapaz”, “Sou um menino”. O termo hebraico נַעַר pode indicar diferentes graus de juventude ou inexperiência.
    reason: lexical_alternative
  - marker: b
    text: Ou “você irá aonde quer que eu o enviar”. A expressão hebraica também pode ser entendida de modo mais geral, referindo-se a todo destino ou missão para a qual Yahweh enviar Jeremias.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O waw narrativo dá continuidade ao relato, enquanto “Mas” expressa naturalmente o contraste com a objeção de Jeremias no versículo anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: Reproduz de modo direto e natural a proibição formada por אַל com a forma verbal prefixada.
- source_word: נַעַר
  choice: jovem
  rationale: Mantém aberta a faixa de idade e a possível ideia de inexperiência expressas por נַעַר, sem definir Jeremias especificamente como criança ou adulto jovem.
- source_word: עַל כָּל אֲשֶׁר אֶשְׁלָחֲךָ
  choice: a todos a quem eu o enviar
  rationale: Conserva a orientação pessoal possível da expressão hebraica, ao mesmo tempo que uma nota registra a leitura mais geral referente ao destino ou à missão.
- source_word: תֵּלֵךְ
  choice: você irá
  rationale: O futuro do indicativo comunica com naturalidade tanto a ação futura quanto o tom autoritativo da comissão divina.
- source_word: וְאֵת כָּל אֲשֶׁר אֲצַוְּךָ
  choice: tudo o que eu lhe ordenar
  rationale: Preserva a abrangência de כָּל e a força de comando de צוה em português corrente.
- source_word: תְּדַבֵּר
  choice: falará
  rationale: Representa o sentido comum de דבר no piel e mantém o paralelismo verbal com “irá”.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz o Tetragrama como nome próprio. A transliteração “Yahweh” preserva explicitamente esse nome sem substituí-lo por um título; “Javé” seria uma adaptação portuguesa possível.
- issue: Natureza da comissão profética
  choice: “você irá” e “falará”
  alternative: “vá” e “fale”; “deverá ir” e “deverá falar”
  rationale: As formas hebraicas podem carregar força imperativa no contexto, mas sua forma verbal também apresenta como certas as ações futuras do profeta. O futuro em português preserva essa combinação sem transformar a declaração em ordens explícitas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de boa legibilidade brasileira. Emprega “você” para evitar formas regionais marcadas e mantém o paralelismo solene entre “irá” e “falará”.
