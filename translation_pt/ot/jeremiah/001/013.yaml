  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
translation:
  language: pt
  text: 'A palavra de Yahweh veio a mim pela segunda vez, dizendo: “O que você vê?” E eu disse: “Vejo uma panela fervendo[a], e sua face está para o norte[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma panela em ebulição”. O particípio hebraico pode sugerir uma panela soprada ou atiçada até ferver.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e sua face, de diante do norte”. “Face” pode indicar o lado exposto ou a abertura da panela. A relação espacial exata com o norte permanece incerta.
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética e traduz o nome divino como Yahweh, sem substituir דָּבָר pelo mais interpretativo “mensagem”.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Expressa com precisão a sequência indicada pelo advérbio hebraico.
- source_word: מָה אַתָּה רֹאֶה
  choice: O que você vê?
  rationale: Forma direta, natural e amplamente compreensível para o particípio hebraico usado no diálogo.
- source_word: סִיר נָפוּחַ
  choice: uma panela fervendo
  rationale: סִיר designa um recipiente de cozinha; נָפוּחַ sugere algo soprado ou atiçado, provavelmente uma panela levada à fervura pelo fogo. A nota preserva a imagem lexical alternativa.
- source_word: וּפָנָיו
  choice: e sua face
  rationale: Conserva a imagem concreta e incomum de פָּנִים, sem decidir se se trata especificamente da abertura, borda ou lado exposto da panela.
- source_word: מִפְּנֵי צָפוֹנָה
  choice: vem do lado norte
  rationale: Reproduz a associação direcional com o norte sem definir de modo excessivo a posição ou inclinação exata da panela.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Emprega uma transliteração reconhecível do nome próprio e mantém a distinção entre o nome divino e títulos.
- issue: Orientação da panela na visão
  choice: sua face vem do lado norte
  alternative: sua abertura está voltada para o norte; está inclinada desde o norte
  rationale: O hebraico é espacialmente ambíguo. A formulação escolhida mantém a ligação com o norte e evita antecipar uma interpretação geométrica que o texto não torna inequívoca.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” no diálogo. O hebraísmo “dizendo” foi omitido diante da fala direta para maior naturalidade. A expressão incomum “sua face” foi mantida deliberadamente para preservar a imagem e a ambiguidade do hebraico, com esclarecimento em nota.
