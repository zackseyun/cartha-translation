revisions:
- from: 'A palavra de Yahweh veio a mim pela segunda vez: “O que você vê?” Eu respondi: “Vejo uma panela fervendo[a], e sua face vem do lado norte[b]”.'
  to: 'A palavra de Yahweh veio a mim pela segunda vez, dizendo: “O que você vê?” E eu disse: “Vejo uma panela fervendo[a], e sua face está para o norte[b].”'
  rationale: A revisão elimina o movimento não expresso em “vem”, restaura “eu disse” e conserva, tanto no texto como na nota, a ambiguidade da imagem espacial hebraica. A formulação “está para o norte” é uma solução portuguesa concisa que não especifica se a “face” é abertura, frente ou lado exposto, nem resolve além do texto a orientação da panela.
