  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלַ֖/י הֵיטַ֣בְתָּ לִ/רְא֑וֹת כִּֽי שֹׁקֵ֥ד אֲנִ֛י עַל דְּבָרִ֖/י לַ/עֲשֹׂתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/012.yaml
  text: Then Yahweh said to me[a], “You have seen well[c][b], for I am watching over my word to perform it.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “Você viu corretamente[a], pois vigio[b] a minha palavra para cumpri-la.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Você viu bem”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, há um jogo de palavras entre o ramo de amendoeira no versículo anterior (shaqed) e “vigio” aqui (shoqed).
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: me disse
  rationale: Com o verbo “dizer”, o complemento indireto pronominal é a formulação corrente e natural em português.
- source_word: הֵיטַבְתָּ לִרְאוֹת
  choice: Você viu corretamente
  rationale: A expressão significa que Jeremias identificou de modo correto o que lhe foi mostrado; esta formulação é clara e idiomática sem ampliar o sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da afirmação anterior de maneira concisa e digna.
- source_word: שֹׁקֵד
  choice: estou atento
  rationale: O particípio comunica vigilância contínua. “Estou atento” é natural em português e permite explicar em nota o jogo sonoro com “amendoeira” no versículo anterior.
- source_word: דְּבָרִי
  choice: minha palavra
  rationale: Mantém o singular e a amplitude semântica do hebraico, sem restringi-lo a “promessa” ou “mensagem”.
- source_word: לַעֲשֹׂתוֹ
  choice: para cumpri-la
  rationale: Expressa a finalidade de tornar efetiva a palavra declarada; “cumprir a palavra” é português natural e adequado ao contexto profético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o nome divino; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Amplitude de דָּבָר no contexto profético
  choice: minha palavra
  alternative: minha promessa; minha mensagem
  rationale: “Palavra” conserva a amplitude do termo hebraico e evita definir antecipadamente se se trata especificamente de promessa, mensagem ou pronunciamento.
- issue: Força de לַעֲשֹׂתוֹ
  choice: para cumpri-la
  alternative: para realizá-la; para executá-la
  rationale: A construção indica que Yahweh vigia sua palavra com o propósito de levá-la a efeito; “cumpri-la” comunica isso sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. A colocação pronominal é corrente; “Yahweh” preserva o nome divino. As notas distinguem a alternativa lexical do jogo de palavras hebraico.
