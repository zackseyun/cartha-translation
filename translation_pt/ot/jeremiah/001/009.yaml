  text: Then the LORD stretched out his hand and touched my mouth, and the LORD said to me, “Look, I have put my words in your mouth.”
translation:
  language: pt
  text: 'Então o SENHOR estendeu a mão e tocou a minha boca. E o SENHOR me disse: “Veja, coloquei as minhas palavras na sua boca.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: estendeu
  rationale: No contexto do gesto de tocar a boca, traduz naturalmente a ideia de enviar ou estender a mão.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino, mantendo-o em versaletes.
- source_word: וַיַּגַּע עַל־פִּי
  choice: tocou a minha boca
  rationale: Expressa com clareza o contato indicado pelo hebraico; a preposição עַל não exige aqui a formulação menos natural “tocou sobre”.
- source_word: הִנֵּה
  choice: Veja
  rationale: Reproduz a função de chamar a atenção para a declaração seguinte em português atual e compreensível.
- source_word: נָתַתִּי דְבָרַי בְּפִיךָ
  choice: coloquei as minhas palavras na sua boca
  rationale: Preserva a imagem concreta da comissão profética e o perfeito hebraico como ação apresentada como realizada.
theological_decisions:
- issue: Origem divina da mensagem profética
  choice: “coloquei as minhas palavras na sua boca”
  alternative: “dei a você as minhas palavras para falar”
  rationale: A formulação escolhida conserva a metáfora hebraica sem explicá-la nem reduzir sua força teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “o SENHOR” foi mantida por corresponder ao texto hebraico e realçar quem age e fala.
