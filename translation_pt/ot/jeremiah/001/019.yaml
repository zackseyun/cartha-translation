  text: וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הַצִּילֶֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/019.yaml
  text: They will fight against you[a], but they will not prevail against you, for I am with you, declares Yahweh[c][b], to deliver you.
translation:
  language: pt
  text: Eles lutarão contra você, mas não prevalecerão contra você, pois eu estou com você — declara Yahweh — para livrá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: Eles lutarão contra você
  rationale: O nifal de לחם com אֶל expressa confronto hostil. “Lutar contra” é natural em português e não exagera o conflito como guerra em grande escala.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: mas não prevalecerão contra você
  rationale: יכל com ל indica que os adversários não conseguirão vencer Jeremias. “Não prevalecerão contra você” comunica o fracasso deles sem prometer ausência de sofrimento.
- source_word: כִּי אִתְּךָ אֲנִי
  choice: pois eu estou com você
  rationale: Mantém tanto a relação causal introduzida por כִּי quanto a fórmula de garantia da presença divina.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” apresenta com clareza a fórmula profética, e “Yahweh” translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְהַצִּילֶךָ
  choice: para livrá-lo
  rationale: O hifil de נצל descreve tirar alguém do perigo. “Livrar” é corrente, digno e adequado ao registro profético.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” preserva sua função como nome da aliança sem substituí-lo por um título.
- issue: Alcance da promessa de proteção
  choice: não prevalecerão contra você
  alternative: não poderão vencê-lo
  rationale: A formulação promete o fracasso final dos adversários por causa da presença e do livramento divinos, sem implicar que Jeremias não enfrentaria oposição ou sofrimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “você” torna explícito o singular masculino dirigido a Jeremias; “livrá-lo” conserva essa referência. Os travessões delimitam naturalmente a fórmula profética.
