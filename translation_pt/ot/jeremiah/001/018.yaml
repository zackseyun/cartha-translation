source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נְתַתִּ֣י/ךָ הַ/יּ֗וֹם לְ/עִ֨יר מִבְצָ֜ר וּ/לְ/עַמּ֥וּד בַּרְזֶ֛ל וּ/לְ/חֹמ֥וֹת נְחֹ֖שֶׁת עַל כָּל הָ/אָ֑רֶץ לְ/מַלְכֵ֤י יְהוּדָה֙ לְ/שָׂרֶ֔י/הָ לְ/כֹהֲנֶ֖י/הָ וּ/לְ/עַ֥ם הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/018.yaml
  text: And I—behold[a], I have made you today a fortified city, an iron pillar, and bronze walls against the whole land—against the kings of Judah, its officials, its priests[b], and the people of the land.
translation:
  language: pt
  text: 'E eu — eis que hoje fiz de você uma cidade fortificada, uma coluna de ferro e muralhas de bronze contra toda a terra[a]: contra os reis de Judá, seus oficiais, seus sacerdotes e o povo da terra[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre toda a terra”. Neste contexto, porém, a preposição provavelmente indica oposição, e “a terra” se refere à terra de Judá, como mostra a enumeração que segue.'
    reason: lexical_alternative
  - marker: b
    text: “O povo da terra” pode, em alguns contextos, designar o povo comum em contraste com os governantes; aqui também pode referir-se de modo mais amplo à população em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: E eu
  rationale: Preserva a progressão do discurso e a ênfase do pronome independente sem impor um valor adversativo que o contexto não exige.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a força dêitica e enfática da partícula, em registro solene, porém ainda compreensível no português bíblico moderno.
- source_word: נְתַתִּיךָ
  choice: fiz de você
  rationale: Embora נתן signifique literalmente dar, pôr ou estabelecer, com os complementos predicativos introduzidos por לְ expressa aqui a constituição de Jeremias como uma presença fortificada.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Reproduz diretamente a referência temporal e a urgência da comissão profética.
- source_word: לְעִיר מִבְצָר
  choice: uma cidade fortificada
  rationale: Expressa naturalmente em português o complemento predicativo e conserva a metáfora defensiva.
- source_word: וּלְעַמּוּד בַּרְזֶל
  choice: uma coluna de ferro
  rationale: Tradução direta e idiomática da metáfora de firmeza e resistência.
- source_word: וּלְחֹמוֹת נְחֹשֶׁת
  choice: muralhas de bronze
  rationale: Preserva o plural hebraico e traduz נְחֹשֶׁת por bronze, metal que comunica adequadamente a imagem de resistência neste contexto.
- source_word: עַל כָּל הָאָרֶץ
  choice: contra toda a terra
  rationale: O contexto de confronto favorece contra para עַל; terra, e não mundo, é delimitada pela enumeração dos grupos de Judá.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: contra os reis de Judá
  rationale: A repetição de contra explicita em português que a lista identifica aqueles diante dos quais Jeremias será fortificado.
- source_word: לְשָׂרֶיהָ
  choice: seus oficiais
  rationale: Oficiais comunica em linguagem atual a função governante ou administrativa dos שׂרים sem restringi-los necessariamente a príncipes dinásticos.
- source_word: לְכֹהֲנֶיהָ
  choice: seus sacerdotes
  rationale: Equivalente português comum e preciso para כֹּהֲנִים.
- source_word: וּלְעַם הָאָרֶץ
  choice: o povo da terra
  rationale: Conserva a expressão hebraica e sua possível amplitude, sem decidir silenciosamente entre a população em geral e o povo comum em contraste com as elites.
theological_decisions:
- issue: Alcance de הָאָרֶץ na oposição a Jeremias
  choice: toda a terra, entendida no contexto como a terra de Judá
  alternative: toda a terra no sentido de toda a terra habitada ou do mundo
  rationale: A enumeração imediata dos reis, oficiais, sacerdotes e povo de Judá delimita o referente ao âmbito nacional, sem eliminar a ideia de totalidade dentro desse âmbito.
- issue: Sentido social de עַם הָאָרֶץ
  choice: povo da terra, preservando a ambiguidade
  alternative: povo comum ou população em geral
  rationale: A expressão pode ter valor social mais específico em certos contextos, mas aqui também pode completar uma enumeração abrangente da sociedade de Judá; a tradução não deve resolver a questão indevidamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” preserva deliberadamente o tom profético solene. “Você” evita regionalizar excessivamente a forma de tratamento; os possessivos plurais referem-se à terra de Judá e aos grupos nela mencionados.
