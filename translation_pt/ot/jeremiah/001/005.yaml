id: JER.1.5
reference: Jeremiah 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/טֶ֨רֶם אצור/ך בַ/בֶּ֨טֶן֙ יְדַעְתִּ֔י/ךָ וּ/בְ/טֶ֛רֶם תֵּצֵ֥א מֵ/רֶ֖חֶם הִקְדַּשְׁתִּ֑י/ךָ נָבִ֥יא לַ/גּוֹיִ֖ם נְתַתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/005.yaml
  text: Before I formed you in the womb[a], I knew you, and before you came out from the womb, I set you apart[b]; I appointed you as a prophet to the nations.
translation:
  language: pt
  text: Antes de eu formar você no ventre, eu conheci você[a]; antes de você sair do ventre materno, eu consagrei você[b]. Eu designei você como profeta para as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico “eu conheci você” também pode transmitir a ideia de consideração pessoal ou escolha, mas a tradução mantém a formulação mais ampla.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu separei você para um propósito santo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Antes de
  rationale: Expressa de modo natural a relação temporal de anterioridade indicada pelo hebraico, sem acrescentar ênfase.
- source_word: אצור/ך (יצר)
  choice: formar você
  rationale: Preserva a imagem concreta de moldar ou formar, frequente para a ação criadora de Deus, sem ampliá-la para o sentido mais geral de “criar”.
- source_word: בַבֶּטֶן
  choice: no ventre
  rationale: Embora בטן também possa designar a barriga, neste contexto pré-natal refere-se ao ventre materno; “ventre” é claro, digno e corrente em português.
- source_word: יְדַעְתִּיךָ (ידע)
  choice: eu o conheci
  rationale: Mantém o sentido lexical amplo de “conhecer”, que pode incluir relação pessoal, consideração ou escolha, sem reduzir no texto principal sua riqueza semântica a “escolhi”.
- source_word: תֵּצֵא (יצא)
  choice: você sair
  rationale: Conserva a imagem concreta hebraica de sair do útero; “nascer” seria uma explicitação contextual possível.
- source_word: מֵרֶחֶם
  choice: do útero
  rationale: רחם designa especificamente o útero ou ventre materno. “Útero” evita a repetição imediata de “ventre” e continua sendo linguagem comum e precisa.
- source_word: הִקְדַּשְׁתִּיךָ (קדש, hifil)
  choice: eu o consagrei
  rationale: Comunica que Jeremias foi separado para um propósito santo. Em português moderno, “consagrar” é conciso, inteligível e reproduz melhor o componente sacro do verbo do que apenas “separar”.
- source_word: נָבִיא
  choice: profeta
  rationale: Equivalente português comum e direto do termo hebraico.
- source_word: לַגּוֹיִם
  choice: para as nações
  rationale: גוים refere-se a nações ou povos. “Nações” preserva o alcance da missão sem importar a nuance neotestamentária específica que “gentios” poderia sugerir.
- source_word: נְתַתִּיךָ (נתן)
  choice: eu o designei
  rationale: Embora נתן signifique literalmente “dar”, nesta construção de comissionamento tem valor de constituir ou nomear. “Designei” comunica essa função com naturalidade.
theological_decisions:
- issue: Sentido de יְדַעְתִּיךָ (“eu o conheci”) em relação à presciência e à eleição divinas
  choice: Manter “eu o conheci” no texto principal.
  alternative: “eu o escolhi” ou “eu o reconheci”
  rationale: ידע pode envolver conhecimento relacional e, neste contexto, sugerir consideração ou escolha divina. Contudo, o hebraico emprega o verbo “conhecer”; mantê-lo preserva a amplitude e a tensão teológica, enquanto a linguagem de consagração e comissionamento esclarece a vocação de Jeremias.
- issue: Sentido de הִקְדַּשְׁתִּיךָ
  choice: Traduzir por “eu o consagrei”.
  alternative: “eu o separei” ou “eu o separei para um propósito santo”
  rationale: O hifil de קדש indica consagrar ou separar como santo. “Consagrei” preserva de forma sucinta tanto a separação quanto a finalidade sagrada; a alternativa mais explicativa fica registrada em nota.
- issue: Alcance de לַגּוֹיִם
  choice: Traduzir por “para as nações”.
  alternative: “para os povos” ou “para os gentios”
  rationale: A expressão inclui as nações para as quais se estenderia o ministério profético de Jeremias. “Nações” mantém o alcance amplo sem restringi-lo a uma categoria teológica posterior.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. O tratamento com “você” evita formas arcaicas; os pronomes “o” mantêm coesão e solenidade moderada. A repetição estrutural de “antes de” reproduz o paralelismo hebraico, e a divisão antes da comissão final favorece clareza sem alterar a progressão do versículo.
