  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/004.yaml
  text: The word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'A palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por «SENHOR»; também conhecido em português pela forma «Jeová».
    reason: Informa a forma hebraica e as principais convenções de tradução do nome divino.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: A forma narrativa de היה introduz o acontecimento; em português, ela se combina naturalmente com דְבַר na expressão «a palavra ... veio», sem acrescentar um marcador temporal ausente do hebraico.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר יְהוָה, «a palavra» preserva de modo claro e tradicional a referência à revelação comunicada por Deus; «a mensagem» seria possível, mas menos formalmente próxima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Traduz diretamente a preposição אֶל com o sufixo da primeira pessoa do singular, em português atual e natural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta que vem em seguida; «dizendo» preserva a fórmula hebraica e sua função.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, enquanto «SENHOR» segue a substituição tradicional por um título e «Jeová» representa outra forma histórica em português.
translation_notes:
  register: Português moderno, claro e digno, com construção próxima da fórmula profética hebraica. O marcador da nota foi colocado junto de «Yahweh», termo ao qual a nota se refere.
