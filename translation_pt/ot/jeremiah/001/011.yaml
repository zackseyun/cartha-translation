id: JER.1.11
reference: Jeremiah 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֵלַ֣/י לֵ/אמֹ֔ר מָה אַתָּ֥ה רֹאֶ֖ה יִרְמְיָ֑הוּ וָ/אֹמַ֕ר מַקֵּ֥ל שָׁקֵ֖ד אֲנִ֥י רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/011.yaml
  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim, dizendo: “O que você vê, Jeremias?” Eu respondi: “Vejo um ramo de amendoeira.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma vara de madeira de amendoeira”. O termo hebraico pode indicar uma vara ou um cajado, além de um ramo. A visão contém um jogo de palavras, desenvolvido no versículo seguinte, entre “amendoeira” (shaqed) e “vigiar” (shoqed).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: E a palavra de Yahweh veio a mim
  rationale: Reproduz de modo natural em português a fórmula profética de revelação, preservando tanto “palavra” quanto o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a estrutura introdutória do discurso direto sem tornar a frase obscura em português.
- source_word: מָה אַתָּה רֹאֶה
  choice: O que você vê
  rationale: Forma direta, atual e amplamente compreensível; o presente traduz naturalmente o particípio hebraico.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma portuguesa consagrada do nome.
- source_word: וָאֹמַר
  choice: Eu respondi
  rationale: No contexto de pergunta e resposta, “respondi” expressa naturalmente a função discursiva de “disse”, sem acrescentar conteúdo interpretativo.
- source_word: מַקֵּל
  choice: ramo
  rationale: No contexto da visão de uma amendoeira, “ramo” comunica com naturalidade o objeto vegetal, embora o termo também possa designar vara ou cajado.
- source_word: שָׁקֵד
  choice: amendoeira
  rationale: Designa a amendoeira ou sua madeira; com “ramo”, a forma portuguesa concisa prepara o jogo sonoro com “vigiando” no versículo seguinte.
- source_word: אֲנִי רֹאֶה
  choice: Vejo
  rationale: É a formulação idiomática em português; o pronome explícito hebraico não exige ênfase artificial na tradução.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva por transliteração, evitando substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e claro, com boa legibilidade brasileira e compreensão internacional. Mantém a fórmula profética e a ambiguidade lexical relevante em nota.
