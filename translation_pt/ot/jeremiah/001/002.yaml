  text: to whom the word of Yahweh came in the days of Josiah son of Amon, king of Judah, in the thirteenth year of his reign.
translation:
  language: pt
  text: a quem veio a palavra de Yahweh nos dias de Josias, filho de Amom, rei de Judá, no décimo terceiro ano do seu reinado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר ... אֵלָיו
  choice: a quem
  rationale: A oração relativa retoma Jeremias no versículo anterior; a combinação com אֵלָיו é expressa naturalmente em português por “a quem”.
- source_word: הָיָה דְבַר יְהוָה
  choice: veio a palavra de Yahweh
  rationale: Fórmula profética convencional. “Veio” comunica de modo idiomático o sentido da construção com הָיָה, enquanto “palavra” preserva o peso revelatório de דָּבָר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Equivalente português natural e próximo da expressão temporal hebraica.
- source_word: יֹאשִׁיָּהוּ בֶן אָמוֹן
  choice: Josias, filho de Amom
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis dos nomes próprios e reproduz diretamente a identificação genealógica.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta do título real e do território governado.
- source_word: בִּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְמָלְכוֹ
  choice: no décimo terceiro ano do seu reinado
  rationale: Forma idiomática em português para a datação hebraica pelo ano régio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada à continuação do versículo 1. Mantém a fórmula profética tradicional sem rigidez excessiva.
