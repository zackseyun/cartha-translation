  naturalness: O texto é claro, moderno e de registro profético apropriado. A fórmula «— declara Yahweh —» integrada à oração mantém mais naturalmente o escopo da declaração divina do que encerrá-la antes de «Eles virão».
  terminology: «Yahweh», «clãs», «trono», «portões», «muralhas» e «Judá» são escolhas consistentes e adequadas. A nota cultural deve evitar especificar além do necessário que a imagem descreve julgamento diretamente «contra Jerusalém»; ela representa tomada de autoridade e julgamento nos portões da cidade.
