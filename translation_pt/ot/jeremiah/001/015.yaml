id: JER.1.15
reference: Jeremiah 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י הִנְ/נִ֣י קֹרֵ֗א לְ/כָֽל מִשְׁפְּח֛וֹת מַמְלְכ֥וֹת צָפ֖וֹנָ/ה נְאֻם יְהוָ֑ה וּ/בָ֡אוּ וְֽ/נָתְנוּ֩ אִ֨ישׁ כִּסְא֜/וֹ פֶּ֣תַח שַׁעֲרֵ֣י יְרוּשָׁלִַ֗ם וְ/עַ֤ל כָּל חוֹמֹתֶ֨י/הָ֙ סָבִ֔יב וְ/עַ֖ל כָּל עָרֵ֥י יְהוּדָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/015.yaml
  text: For behold[a], I am calling all the clans of the kingdoms of the north, declares Yahweh, and they will come, and each will set his throne at the entrance of the gates of Jerusalem, against all her walls all around[b], and against all the cities of Judah.
translation:
  language: pt
  text: Pois eis que estou convocando todos os clãs dos reinos do norte[a] — declara Yahweh —; eles virão, e cada um colocará seu trono à entrada dos portões de Jerusalém, contra todas as muralhas ao redor dela[b] e contra todas as cidades de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «todas as famílias dos reinos do norte». O termo hebraico pode indicar famílias extensas, clãs ou grupos sociais semelhantes.'
    reason: lexical_alternative
  - marker: b
    text: A imagem de cada um colocar seu trono retrata governantes invasores assumindo posições de autoridade e julgamento nos portões de Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הִנְנִי
  choice: Pois eu estou
  rationale: כִּי introduz a explicação da visão anterior, e הִנְנִי enfatiza a ação divina presente e iminente. Em português, «Pois eu estou» preserva o fluxo e a ênfase sem o pouco natural «eis-me» nesta construção.
- source_word: קֹרֵא
  choice: convocando
  rationale: O particípio indica ação em curso ou iminente. «Convocando» comunica melhor que se trata de um chamado soberano para reunir forças, e não de apenas chamar pelo nome.
- source_word: לְכָל מִשְׁפְּחוֹת מַמְלְכוֹת צָפוֹנָה
  choice: todos os clãs dos reinos do norte
  rationale: מִשְׁפְּחוֹת designa grupos extensos de parentesco ou clãs; «clãs» evita o sentido doméstico de «famílias». Mantém-se o plural «reinos» do hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e representa diretamente o nome divino יהוה como Yahweh.
- source_word: וּבָאוּ
  choice: Eles virão
  rationale: O contexto favorece valor futuro simples. A retomada por pronome torna clara e natural em português a referência aos grupos convocados.
- source_word: וְנָתְנוּ אִישׁ כִּסְאוֹ
  choice: e cada um colocará seu trono
  rationale: אִישׁ tem função distributiva («cada um»), e «trono» conserva a imagem régia e judicial de governantes invasores tomando posição.
- source_word: פֶּתַח שַׁעֲרֵי יְרוּשָׁלִַם
  choice: à entrada dos portões de Jerusalém
  rationale: פֶּתַח indica entrada ou abertura. O plural «portões» conserva a forma hebraica e sua referência aos acessos fortificados da cidade.
- source_word: וְעַל כָּל חוֹמֹתֶיהָ סָבִיב
  choice: contra todas as muralhas ao redor dela
  rationale: No contexto militar, עַל tem sentido adversativo, «contra». A formulação preserva סָבִיב, que sugere cerco por todos os lados, e explicita com naturalidade o referente feminino, Jerusalém.
- source_word: וְעַל כָּל עָרֵי יְהוּדָה
  choice: e contra todas as cidades de Judá
  rationale: «Contra» mantém o sentido militar de עַל, e o plural reproduz a abrangência territorial do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. «Yahweh» o representa diretamente, sem substituí-lo por um título.
- issue: Imagem dos tronos junto aos portões
  choice: Preservar literalmente «cada um colocará seu trono» e explicá-la em nota
  alternative: Parafrasear como «cada governante tomará posição para julgar»
  rationale: A imagem pode envolver autoridade, julgamento e domínio militar. Mantê-la evita restringir a tensão semântica a apenas uma dessas dimensões.
- issue: Expressão distributiva masculina אִישׁ ... כִּסְאוֹ
  choice: cada um colocará seu trono
  alternative: cada homem colocará seu trono; cada qual colocará seu trono
  rationale: O hebraico emprega o masculino singular de modo distributivo. «Cada um» mantém essa estrutura sem acrescentar uma ênfase indevida em sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar uma cadeia excessiva de coordenações, sem alterar a progressão hebraica. «Muralhas» é preferido a «muros» pelo contexto de fortificação urbana.
