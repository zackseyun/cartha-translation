base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/001.yaml
  text: The words of Yirmeyahu son of Hilqiyahu[a], one of the priests who were in Anathoth, in the land of Benjamin.
translation:
  language: pt
  text: Palavras de Jeremias, filho de Hilquias, um dos sacerdotes que estavam em Anatote, na terra de Benjamim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Palavras de
  rationale: O plural construto de דָּבָר funciona como título do livro. “Palavras de” é natural em português e preserva a amplitude do termo sem restringi-lo apenas a oráculos falados.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega-se a forma portuguesa tradicional, amplamente reconhecida e natural para leitores de língua portuguesa, sem alterar a identidade do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente genealógico direto e idiomático em português.
- source_word: חִלְקִיָּהוּ
  choice: Hilquias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada ao registro bíblico moderno.
- source_word: מִן הַכֹּהֲנִים
  choice: um dos sacerdotes
  rationale: מִן diante de um grupo plural tem sentido partitivo; a expressão deixa claro que Jeremias pertencia ao grupo dos sacerdotes.
- source_word: אֲשֶׁר
  choice: que viviam
  rationale: O relativo liga os sacerdotes à sua localidade. Como o hebraico não traz verbo expresso, “viviam” fornece em português uma ligação locativa natural, sem afirmar que fossem naturais da cidade.
- source_word: בַּעֲנָתוֹת
  choice: em Anatote
  rationale: Tradução locativa direta, com a forma portuguesa tradicional do topônimo.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: na terra de Benjamim
  rationale: Preserva o sentido territorial de אֶרֶץ e a formulação solene e compreensível do hebraico.
