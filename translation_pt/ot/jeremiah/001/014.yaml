  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י מִ/צָּפוֹן֙ תִּפָּתַ֣ח הָ/רָעָ֔ה עַ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
translation:
  language: pt
  text: 'E Yahweh me disse: “Do norte, a calamidade irromperá contra todos os habitantes da terra.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A terra” provavelmente se refere aqui à terra de Judá; também pode referir-se à terra inteira. O hebraico diz, mais literalmente, “a calamidade será aberta”; também se pode traduzir “a desgraça irromperá” ou “a calamidade será desencadeada”.
    reason: Registra a ambiguidade do alcance de אֶרֶץ e as alternativas lexicais e imagéticas de תִּפָּתַח הָרָעָה em português natural.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר ... אֵלָי
  choice: E ... me disse
  rationale: Reproduz a progressão narrativa do waw consecutivo em português natural e expressa de modo idiomático o destinatário da fala.
- source_word: מִצָּפוֹן
  choice: Do norte
  rationale: Expressa diretamente a origem geográfica da calamidade anunciada.
- source_word: תִּפָּתַח
  choice: irromperá
  rationale: O nifal de פתח significa literalmente “ser aberta”; com רָעָה, a imagem indica uma calamidade que se abre, desencadeia ou irrompe. “Irromperá” mantém a força imagética sem soar artificial em português.
- source_word: הָרָעָה
  choice: a calamidade
  rationale: Neste anúncio de juízo, רָעָה designa desgraça ou calamidade, não necessariamente mal moral. “Calamidade” conserva a gravidade e evita resolver o termo como uma afirmação sobre a produção do mal moral.
- source_word: עַל
  choice: contra
  rationale: No contexto de uma calamidade dirigida aos moradores, “contra” comunica adequadamente a força adversativa.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: “Habitantes” preserva o particípio substantivado; “terra” mantém em português a ambiguidade contextual de אֶרֶץ entre o território local e a terra em sentido mais amplo.
theological_decisions:
- issue: Sentido de הָרָעָה no anúncio do juízo
  choice: “a calamidade”
  alternative: “o mal” ou “a desgraça”
  rationale: O contexto favorece uma calamidade experimentada como juízo. A escolha evita apresentar o verso como afirmação inequívoca sobre mal moral, embora a amplitude lexical seja registrada em nota.
- issue: Alcance de הָאָרֶץ
  choice: “a terra”, com provável referência local
  alternative: “o país” ou “a Terra”
  rationale: O contexto aponta provavelmente para a terra de Judá, mas o substantivo hebraico também pode ter alcance mais amplo. O texto mantém “terra” e a nota explicita a alternativa sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada para fluência natural, mantendo a origem setentrional em posição enfática. O único marcador [a] aparece no texto principal e reúne as duas ambiguidades relevantes.
