  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהֹוִ֔ה הִנֵּ֥ה לֹא יָדַ֖עְתִּי דַּבֵּ֑ר כִּי נַ֖עַר אָנֹֽכִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/006.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I do not know how to speak[c][b], for I am a youth.”
translation:
  language: pt
  text: 'Então eu disse: “Ah, Senhor Yahweh! Veja, não sei falar, pois sou jovem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sou apenas um rapaz” ou “sou uma criança”. O termo hebraico pode designar alguém desde a infância até o início da idade adulta, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então eu disse” expressa em português atual a sequência do relato.
- source_word: אֲהָהּ
  choice: Ah
  rationale: Interjeição de aflição ou protesto, aqui adequada à objeção hesitante de Jeremias.
- source_word: אֲדֹנָי יְהוִה
  choice: Soberano Yahweh
  rationale: “Soberano” distingue אֲדֹנָי do nome divino e evita a combinação pouco natural “Senhor Yahweh”, enquanto “Yahweh” representa explicitamente o tetragrama.
- source_word: הִנֵּה
  choice: — não vertido isoladamente —
  rationale: A partícula chama atenção para a objeção. Em português, sua força discursiva é transmitida naturalmente pela exclamação e pela declaração imediata, sem o artificial “Eis que” nem o coloquial “Olha” dirigido a Deus.
- source_word: לֹא יָדַעְתִּי דַּבֵּר
  choice: Eu não sei falar
  rationale: Reproduz de modo natural o idioma hebraico “não sei falar”, indicando falta de capacidade ou experiência sem especificar eloquência ou mudez.
- source_word: כִּי
  choice: pois
  rationale: Introduz de forma concisa a razão apresentada por Jeremias.
- source_word: נַעַר
  choice: jovem
  rationale: Preserva a amplitude do termo, que pode designar alguém desde a infância até o início da idade adulta, conforme o contexto.
- source_word: אָנֹכִי
  choice: ainda sou
  rationale: O pronome independente dá ênfase à condição pessoal de Jeremias; “ainda” torna natural em português a relevância de sua juventude como motivo da objeção, sem fixar uma idade.
theological_decisions:
- issue: Tradução do título composto אֲדֹנָי יְהוִה
  choice: Soberano Yahweh
  alternative: Senhor DEUS; Senhor Yahweh
  rationale: A escolha conserva os dois componentes do título, representa o nome divino diretamente e evita confundir אֲדֹנָי com יהוה. “Soberano” comunica a autoridade expressa pelo título sem introduzir uma doutrina denominacional.
- issue: Natureza da incapacidade alegada por Jeremias
  choice: não sei falar
  alternative: não tenho habilidade para falar
  rationale: A formulação mantém a concisão e a abertura do hebraico, sem decidir se a dificuldade era retórica, profética ou decorrente apenas da inexperiência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala conserva a hesitação de Jeremias sem arcaísmo excessivo. O marcador [a] aparece no texto principal.
