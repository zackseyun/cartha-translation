  text: וְ/אַתָּה֙ תֶּאְזֹ֣ר מָתְנֶ֔י/ךָ וְ/קַמְתָּ֙ וְ/דִבַּרְתָּ֣ אֲלֵי/הֶ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י אֲצַוֶּ֑/ךָּ אַל תֵּחַת֙ מִ/פְּנֵי/הֶ֔ם פֶּֽן אֲחִתְּ/ךָ֖ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/017.yaml
  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
translation:
  language: pt
  text: Mas você, cinja os lombos[a], levante-se e diga a eles tudo o que eu lhe ordenar. Não se intimide diante deles, senão eu o intimidarei diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expressão idiomática hebraica: “cingir os lombos” significa prender as vestes à cintura e preparar-se para agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: O pronome explícito com a conjunção marca uma transição enfática e contrastiva para a incumbência pessoal de Jeremias.
- source_word: תֶּאְזֹר מָתְנֶיךָ
  choice: cinja os lombos
  rationale: Mantém a imagem corporal do hebraico, em que se prendiam as vestes à cintura a fim de preparar-se para agir. A nota esclarece o sentido idiomático.
- source_word: וְקַמְתָּ
  choice: levante-se
  rationale: A forma verbal integra uma sequência com força de ordem no comissionamento profético; esta escolha é atual, clara e digna.
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: e diga a eles
  rationale: Expressa naturalmente a ordem de comunicar a mensagem aos destinatários sem acrescentar ao verbo a força técnica de “declarar”.
- source_word: אֵת כָּל אֲשֶׁר אָנֹכִי אֲצַוֶּךָּ
  choice: tudo o que eu lhe ordenar
  rationale: Preserva a totalidade da incumbência e entende o imperfeito hebraico como abrangendo aquilo que Deus ainda ordenará ao profeta.
- source_word: אַל תֵּחַת מִפְּנֵיהֶם
  choice: Não se intimide diante deles
  rationale: Traduz o nifal de חתת como estado de temor e abatimento diante dos opositores, mantendo também a expressão espacial e confrontativa “diante deles”.
- source_word: פֶּן אֲחִתְּךָ לִפְנֵיהֶם
  choice: senão eu o intimidarei diante deles
  rationale: “Senão” comunica com naturalidade a advertência introduzida por פן. A repetição de “intimidar” preserva o jogo retórico entre o nifal e o hifil do mesmo verbo hebraico.
theological_decisions:
- issue: Manutenção da imagem corporal no comissionamento profético
  choice: Conservar “cinja os lombos” no texto principal
  alternative: “prepare-se para agir”
  rationale: A metáfora concreta associa prontidão, coragem e vocação solene. Preservá-la mantém a textura do hebraico; uma nota fornece o sentido ao leitor moderno.
- issue: Advertência divina e repetição de חתת
  choice: “Não se intimide... senão eu o intimidarei”
  alternative: “Não fique apavorado... ou eu o aterrorizarei”
  rationale: A escolha mantém a tensa reciprocidade verbal do original sem suavizar a advertência de Deus nem introduzir uma distinção lexical ausente no hebraico.
translation_notes:
  register: Português moderno de leitura ampla, com tom digno e direto. A expressão deliberadamente tradicional “cinja os lombos” preserva a imagem hebraica e é imediatamente esclarecida em nota; “diga a eles” evita solenidade artificial. A repetição de “diante deles” e de “intimidar” conserva a estrutura e o jogo verbal do original.
