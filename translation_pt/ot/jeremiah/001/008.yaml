id: JER.1.8
reference: Jeremiah 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּירָ֖א מִ/פְּנֵי/הֶ֑ם כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הַצִּלֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/008.yaml
  text: Do not be afraid of them[a], for I am with you to deliver you[b], declares Yahweh.
translation:
  language: pt
  text: Não tenha medo deles[a], pois eu estou com você para livrar você[b], declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “de diante deles”; neste contexto, a expressão significa “deles” ou “por causa deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “resgatar você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: A partícula negativa אַל com a forma verbal expressa uma proibição; esta formulação é natural e direta em português.
- source_word: מִפְּנֵיהֶם
  choice: deles
  rationale: Embora a expressão seja literalmente ligada à presença ou face deles, com o verbo ירא ela indica o objeto ou motivo do medo.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a proibição e mantém clara a relação explicativa.
- source_word: אִתְּךָ אֲנִי
  choice: eu estou com você
  rationale: Preserva a garantia enfática da presença pessoal de Deus, em português corrente e digno.
- source_word: לְהַצִּילְךָ
  choice: para livrá-lo
  rationale: O Hifil de נצל denota retirar do perigo, resgatar ou livrar; 'livrar' mantém a amplitude da promessa sem impor uma noção exclusivamente espiritual.
- source_word: נְאֻם
  choice: declaração de
  rationale: Reproduz a fórmula profética solene como frase nominal, de maneira concisa e reconhecível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal sem substituí-lo por um título.
- issue: Alcance de לְהַצִּילְךָ
  choice: livrá-lo
  alternative: resgatá-lo
  rationale: A promessa diz respeito à intervenção protetora de Yahweh na missão de Jeremias; 'livrar' preserva o sentido amplo do verbo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento singular 'você' torna explícita a referência a Jeremias; 'livrá-lo' mantém a concordância masculina. A fórmula final conserva solenidade profética sem linguagem arcaica.
