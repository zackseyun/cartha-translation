  text: וַ/יְהִ֗י בִּ/ימֵ֨י יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַד תֹּם֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/צִדְקִיָּ֥הוּ בֶן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה עַד גְּל֥וֹת יְרוּשָׁלִַ֖ם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִֽׁי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/003.yaml
  text: And it continued in the days of Jehoiakim son of Josiah[a], king of Judah, until the completion of the eleventh year of Zedekiah son of Josiah, king of Judah[b], until the exile of Jerusalem in the fifth month.
translation:
  language: pt
  text: A palavra do SENHOR continuou vindo nos dias de Jeoaquim, filho de Josias, rei de Judá, até o fim[a] do décimo primeiro ano de Zedequias, filho de Josias, rei de Judá, até o exílio de Jerusalém[b], no quinto mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até se completar o décimo primeiro ano”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a deportação dos habitantes de Jerusalém quando a cidade caiu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: A palavra do SENHOR continuou vindo
  rationale: A forma retoma “a palavra do SENHOR” do versículo 2 e estende sua vinda por todo o período indicado. A repetição explícita do antecedente evita um pronome obscuro em português e preserva a função discursiva do hebraico.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém a expressão temporal hebraica em uma formulação tradicional, clara e natural em português.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Forma portuguesa consagrada do nome pessoal.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: filho de Josias
  rationale: Tradução direta da designação filial.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta do título real.
- source_word: עַד תֹּם
  choice: até o fim
  rationale: Expressa de modo natural o limite temporal indicado por תֹּם; a alternativa “até se completar” é registrada em nota.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: do décimo primeiro ano
  rationale: No contexto de datação régia, a construção designa o décimo primeiro ano do reinado.
- source_word: לְצִדְקִיָּהוּ
  choice: de Zedequias
  rationale: O prefixo לְ marca aqui a referência ao ano do reinado de Zedequias.
- source_word: גְּלוֹת יְרוּשָׁלִַם
  choice: o exílio de Jerusalém
  rationale: A construção designa a deportação ligada à queda da cidade; “exílio” é conciso e corrente, enquanto a nota esclarece a metonímia.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: no quinto mês
  rationale: Tradução temporal direta e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas bíblicas amplamente reconhecidas dos nomes próprios. O antecedente “a palavra do SENHOR”, proveniente do versículo 2, foi explicitado para que o período seja compreensível isoladamente; “continuou vindo” conserva a extensão temporal do enunciado sem reduzir וַיְהִי a um simples acontecimento pontual.
