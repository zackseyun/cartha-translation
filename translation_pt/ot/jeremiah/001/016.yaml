  text: וְ/דִבַּרְתִּ֤י מִשְׁפָּטַ/י֙ אוֹתָ֔/ם עַ֖ל כָּל רָעָתָ֑/ם אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לְ/מַעֲשֵׂ֥י יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/016.yaml
  text: And I will pronounce my judgments against them for all their evil[a], because they have forsaken me, burned incense to other gods[b], and bowed down to the works of their own hands.
translation:
  language: pt
  text: E pronunciarei contra eles os meus juízos por toda a sua maldade,[a] porque me abandonaram, queimaram incenso a outros deuses e se prostraram diante das obras de suas próprias mãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falarei contra eles os meus juízos acerca de toda a sua maldade”. O verbo hebraico significa literalmente “falar”, mas aqui provavelmente tem o sentido de pronunciar formalmente um juízo.'
    reason: lexical_alternative
  - marker: b
    text: As “obras de suas próprias mãos” são os ídolos que eles mesmos fizeram.
    reason: cultural_note
lexical_decisions:
- source_word: וְדִבַּרְתִּי מִשְׁפָּטַי אוֹתָם
  choice: E pronunciarei contra eles os meus juízos
  rationale: O verbo דבר significa literalmente “falar”, mas, associado a מִשְׁפָּטַי neste contexto judicial e profético, indica a proclamação formal das decisões divinas. “Pronunciarei” conserva tanto o ato verbal quanto a força forense.
- source_word: עַל כָּל רָעָתָם
  choice: por toda a maldade que praticaram
  rationale: A preposição עַל apresenta o fundamento do juízo. “Maldade” mantém a amplitude moral de רָעָה; “que praticaram” explicita de modo natural em português que se trata da conduta deles, sem reduzir a expressão aos atos idólatras seguintes.
- source_word: אֲשֶׁר עֲזָבוּנִי
  choice: porque me abandonaram
  rationale: Aqui אֲשֶׁר introduz a causa ou conteúdo da acusação. “Abandonaram” comunica com clareza o peso relacional de עזב em português atual.
- source_word: וַיְקַטְּרוּ לֵאלֹהִים אֲחֵרִים
  choice: queimaram incenso a outros deuses
  rationale: No contexto de idolatria, o piel de קטר designa a queima de incenso ou uma oferta feita em fumaça. A formulação preserva a ação concreta e seu destinatário.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prostraram diante de
  rationale: O verbo descreve o ato físico de curvar-se ou prostrar-se, que neste contexto constitui culto. A tradução mantém a imagem concreta em vez de substituí-la pela interpretação mais geral “adoraram”.
- source_word: לְמַעֲשֵׂי יְדֵיהֶם
  choice: diante das obras de suas próprias mãos
  rationale: 'A expressão mantém a imagem hebraica e a ironia profética: eles prestam culto a objetos que eles mesmos fabricaram. “Próprias” torna explícito o valor reflexivo natural em português.'
theological_decisions:
- issue: Natureza da ação divina em וְדִבַּרְתִּי מִשְׁפָּטַי
  choice: Deus pronuncia formalmente seus juízos contra o povo.
  alternative: Deus apenas fala com eles sobre seus preceitos, ou executa juízos sem destaque para sua proclamação verbal.
  rationale: A combinação lexical e o cenário profético favorecem uma declaração judicial. A tradução preserva a dimensão verbal e forense sem acrescentar categorias doutrinárias posteriores.
- issue: Descrição da idolatria
  choice: Manter separadamente o abandono de Deus, a queima de incenso a outros deuses e a prostração diante de objetos feitos por mãos humanas.
  alternative: Resumir as ações como “adoraram ídolos”.
  rationale: O hebraico enumera violações concretas. Preservar cada uma mantém a força e a progressão da acusação profética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Pronunciarei” preserva o tom judicial; “se prostraram” mantém a ação concreta do hebraico. Os marcadores [a] e [b] aparecem no texto principal e correspondem exatamente às notas.
