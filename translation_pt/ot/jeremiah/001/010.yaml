language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/010.yaml
  text: See[a], today I have appointed you over the nations and over the kingdoms, to uproot and to tear down, and to destroy and to demolish[c][b], to build and to plant.
translation:
  language: pt
  text: 'Veja: hoje eu o constituí sobre as nações e sobre os reinos[a], para arrancar e derrubar, destruir e demolir, construir e plantar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito das nações e dos reinos”. Trata-se do encargo profético de Jeremias em relação a eles, não de governo político direto.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: רְאֵה
  choice: Veja
  rationale: O imperativo funciona como chamado enfático à atenção. “Veja” é atual e claro, sem o tom arcaico de “eis”.
- source_word: הִפְקַדְתִּיךָ
  choice: eu o designei
  rationale: O hifil de פקד expressa aqui a designação de Jeremias para um encargo. “Designei” comunica uma comissão formal sem sugerir posse direta de poder político.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente idiomático e natural da expressão temporal hebraica, preservando a imediatez da comissão.
- source_word: עַל הַגּוֹיִם וְעַל הַמַּמְלָכוֹת
  choice: sobre as nações e sobre os reinos
  rationale: Com פקד, עַל indica o âmbito do encargo recebido. “Sobre” preserva a formulação do hebraico; a nota esclarece a natureza profética, não política, dessa autoridade.
- source_word: לִנְתוֹשׁ
  choice: para arrancar
  rationale: Mantém a imagem agrícola de retirar pela raiz e forma contraste intencional com “plantar”.
- source_word: לִנְתוֹץ
  choice: derrubar
  rationale: Expressa o desmantelamento de algo construído e permanece distinto dos dois verbos destrutivos seguintes.
- source_word: וּלְהַאֲבִיד
  choice: para destruir
  rationale: O hifil de אבד tem sentido causativo; “destruir” o comunica de modo direto e natural nesta sequência.
- source_word: וְלַהֲרוֹס
  choice: demolir
  rationale: Preserva a ideia de arrasar ou desfazer uma estrutura e diferencia este verbo de נָתַץ, traduzido como “derrubar”.
- source_word: לִבְנוֹת
  choice: para construir
  rationale: Tradução direta que conserva a imagem de restauração.
- source_word: וְלִנְטוֹעַ
  choice: plantar
  rationale: Tradução direta que preserva o paralelo restaurador e o contraste com “arrancar”.
theological_decisions:
- issue: Natureza da autoridade de Jeremias sobre nações e reinos
  choice: A nomeação é apresentada como autoridade profética referente às nações e aos reinos.
  alternative: Traduzir עַל como “contra” para enfatizar o juízo, ou entender “sobre” como governo político direto.
  rationale: A construção com פקד favorece a ideia de encargo sobre determinado âmbito. Os infinitivos seguintes descrevem os efeitos da palavra profética, tanto de juízo como de restauração, e não o exercício de governo civil.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência paralela de seis infinitivos e o contraste entre juízo e restauração foram preservados.
source_grounding:
  english_pob_role: consult_only
