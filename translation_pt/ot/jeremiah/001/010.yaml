  to: 'Veja: hoje eu o constituí sobre as nações e sobre os reinos[a], para arrancar e derrubar, destruir e demolir, construir e plantar.'
  rationale: Substituiu-se apenas «designei sobre» por «constituí sobre», para corrigir a regência e manter o sentido de nomeação/comissão do hebraico. A nota foi ajustada de «com respeito a» para a formulação mais idiomática «a respeito de», sem alterar sua função interpretativa limitada.
