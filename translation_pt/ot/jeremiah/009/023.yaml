revisions:
- from: 'Mas quem se gloria, glorie-se nisto: em compreender e conhecer a mim — que eu sou Yahweh, que pratico amor leal, justiça e retidão na terra[a], pois é nessas coisas que tenho prazer — declara Yahweh.'
  to: 'Mas quem se gloria, glorie-se nisto: em compreender e conhecer-me, sabendo que eu sou Yahweh, que pratico amor leal, justiça e retidão na terra[a], pois é nessas coisas que tenho prazer, declara Yahweh.'
  rationale: A revisão substitui a construção enfática, porém menos idiomática, «conhecer a mim» por «conhecer-me» e esclarece a relação entre conhecer Yahweh e reconhecer que ele é Yahweh. Mantêm-se a ambiguidade de אֶרֶץ, a primeira pessoa da declaração divina, o paralelismo dos atributos e a formulação não confessional do texto.
