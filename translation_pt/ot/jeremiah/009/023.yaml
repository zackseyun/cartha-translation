source:
  edition: WLC
  text: כִּ֣י אִם בְּ/זֹ֞את יִתְהַלֵּ֣ל הַ/מִּתְהַלֵּ֗ל הַשְׂכֵּל֮ וְ/יָדֹ֣עַ אוֹתִ/י֒ כִּ֚י אֲנִ֣י יְהוָ֔ה עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ כִּֽי בְ/אֵ֥לֶּה חָפַ֖צְתִּי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/023.yaml
  text: 'But let the one who boasts boast in this: that he understands and knows me[a], that I am Yahweh, who practices steadfast love, justice, and righteousness in the earth; for in these I delight[b], declares Yahweh.'
translation:
  language: pt
  text: 'Mas quem se gloria, glorie-se nisto: em compreender e conhecer-me, sabendo que eu sou Yahweh, que pratico amor leal, justiça e retidão na terra[a], pois é nessas coisas que tenho prazer, declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no país” ou “nesta terra”. O hebraico אֶרֶץ pode indicar tanto a terra em sentido amplo quanto uma região ou país específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: No contexto, a expressão introduz a alternativa positiva às razões impróprias para alguém se gloriar; “Mas” comunica com naturalidade essa força contrastiva.
- source_word: בְּזֹאת
  choice: nisto
  rationale: O demonstrativo aponta para o conteúdo que vem em seguida e preserva de modo conciso a construção hebraica.
- source_word: יִתְהַלֵּל / הַמִּתְהַלֵּל
  choice: quem se gloria, glorie-se
  rationale: Mantém a repetição intencional da raiz hebraica e usa uma formulação inclusiva e natural em português.
- source_word: הַשְׂכֵּל
  choice: compreender
  rationale: No par com “conhecer a mim”, indica discernimento ou entendimento verdadeiro acerca de quem Yahweh é, sem reduzir o sentido a mera informação.
- source_word: וְיָדֹעַ אוֹתִי
  choice: e conhecer a mim
  rationale: Preserva o objeto enfático e o caráter pessoal e relacional de ידע.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֹשֶׂה
  choice: que pratico
  rationale: O particípio descreve a atuação característica e contínua de Yahweh; “pratico” comunica essa ideia de forma natural.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa tanto o aspecto afetivo quanto a constância e fidelidade relacional do termo hebraico, sem restringi-lo apenas a misericórdia.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No trio de atributos e ações divinas, designa o juízo justo e a ordem moral estabelecida por Yahweh.
- source_word: וּצְדָקָה
  choice: e retidão
  rationale: Distingue צדקה de מִשְׁפָּט e preserva a ideia de agir de acordo com o que é correto.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Mantém a amplitude possível de אֶרֶץ e soa idiomático em português; a alternativa localizada “no país/na terra de Israel” permanece possível e é indicada em nota.
- source_word: כִּי בְאֵלֶּה חָפַצְתִּי
  choice: pois é nessas coisas que tenho prazer
  rationale: Preserva a força afetiva de חפץ e a referência plural aos três elementos anteriores.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Alcance de בָּאָרֶץ
  choice: na terra
  alternative: no país; nesta terra
  rationale: A declaração caracteriza de modo amplo a atuação de Yahweh, favorecendo o sentido geral, embora o substantivo hebraico também possa designar uma terra ou país específico; a ambiguidade é registrada em nota.
- issue: Relação entre compreender e conhecer Yahweh
  choice: em compreender e conhecer a mim
  alternative: em ter discernimento, isto é, em conhecer a mim
  rationale: A coordenação hebraica permite proximidade semântica, mas não exige que um verbo seja reduzido a mera explicação do outro. A tradução conserva ambos e sua tensão cognitiva e relacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição retórica foi preservada; “amor leal” comunica o conteúdo relacional de חֶסֶד sem recorrer a vocabulário excessivamente técnico. O travessão organiza a oração explicativa sem eliminar a ambiguidade sintática do original.
