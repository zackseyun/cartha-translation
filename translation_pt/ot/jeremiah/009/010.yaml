source:
  edition: WLC
  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
translation:
  language: pt
  text: E farei de Jerusalém montões de ruínas[a], morada de chacais[b]; e farei das cidades de Judá uma desolação, sem nenhum habitante[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “montões de escombros”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico tannim; tradicionalmente também traduzido por “dragões”, mas, neste contexto de desolação, provavelmente se refere a chacais.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sem ninguém morando ali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי / אֶתֵּן
  choice: farei / farei
  rationale: Embora נָתַן signifique literalmente “dar” ou “pôr”, aqui introduz o estado resultante do juízo. “Farei de” expressa esse sentido de modo natural em português.
- source_word: לְגַלִּים
  choice: montões de ruínas
  rationale: O plural גַּלִּים designa montões, especialmente de entulho ou ruínas. A expressão conserva tanto o plural quanto a imagem concreta da cidade arrasada.
- source_word: מְעוֹן
  choice: morada
  rationale: O substantivo significa lugar de habitação. “Morada” é claro, digno e adequado à imagem de animais selvagens ocupando uma cidade abandonada.
- source_word: תַּנִּים
  choice: chacais
  rationale: Neste contexto profético de devastação, o termo provavelmente se refere a chacais, animais associados a lugares abandonados, e não aos tradicionais “dragões”.
- source_word: עָרֵי יְהוּדָה
  choice: as cidades de Judá
  rationale: Tradução direta da construção hebraica, preservando a referência geográfica e política.
- source_word: שְׁמָמָה
  choice: uma desolação
  rationale: Mantém a forma nominal e o forte sentido de devastação do hebraico.
- source_word: מִבְּלִי יוֹשֵׁב
  choice: sem nenhum habitante
  rationale: Expressa de forma concisa e natural a ausência total de quem more no lugar.
theological_decisions:
- issue: Agência divina indicada pela repetição de נָתַן no anúncio de juízo
  choice: Traduzir por “farei de” para deixar clara a ação divina que leva Jerusalém e as cidades de Judá à ruína.
  alternative: Traduzir mais literalmente por “darei” ou “porei”.
  rationale: “Farei de” comunica o valor resultativo da construção hebraica sem acrescentar uma explicação teológica nem enfraquecer a agência expressa no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura paralela e a repetição de “farei” preservam o ritmo do anúncio profético.
