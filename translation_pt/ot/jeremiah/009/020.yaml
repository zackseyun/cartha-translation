base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/020.yaml
  text: For death has climbed in through our windows[a]; it has entered our palaces, to cut off the child from outside[b], the young men from the streets.
translation:
  language: pt
  text: Pois a morte subiu pelas nossas janelas; entrou em nossos palácios, para eliminar a criança que está do lado de fora[a] e os jovens das ruas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a criança de fora». O hebraico usa o singular e pode referir-se a uma criança pequena; a expressão indica que ela está no espaço exterior.
    reason: lexical_alternative
  - marker: b
    text: Ou «das praças». O termo hebraico pode designar ruas largas, praças ou outros espaços públicos abertos da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação causal da convocação anterior ao lamento, de maneira natural em português.
- source_word: עָלָה
  choice: subiu
  rationale: Preserva a imagem vívida de a morte escalar até as janelas; o complemento «pelas nossas janelas» deixa claro o movimento de entrada.
- source_word: מָוֶת
  choice: a morte
  rationale: Mantém a personificação da morte como invasora.
- source_word: בְּחַלּוֹנֵינוּ
  choice: pelas nossas janelas
  rationale: Expressa de modo idiomático a via pela qual a morte entra.
- source_word: בָּא
  choice: entrou
  rationale: No paralelismo, explicita que a morte penetrou nas residências fortificadas.
- source_word: בְּאַרְמְנוֹתֵינוּ
  choice: em nossos palácios
  rationale: «Palácios» é a equivalência mais transparente, embora o termo também possa designar cidadelas ou residências fortificadas.
- source_word: לְהַכְרִית
  choice: para eliminar
  rationale: Comunica a destruição ou supressão completa pretendida pelo Hifil de כרת sem produzir em português a ambiguidade física de «cortar».
- source_word: עוֹלָל
  choice: as crianças
  rationale: Embora formalmente singular, o substantivo tem sentido coletivo neste paralelismo e denota crianças pequenas; o plural é natural em português.
- source_word: מִחוּץ
  choice: das ruas
  rationale: O sentido básico é «de fora/do espaço exterior»; «das ruas» torna natural a referência ao espaço público e evita o português pouco idiomático «eliminar de fora».
- source_word: בַּחוּרִים
  choice: os jovens
  rationale: Designa jovens do sexo masculino, em idade adulta jovem; neste contexto, «os jovens» é claro e natural.
- source_word: מֵרְחֹבוֹת
  choice: das praças
  rationale: O termo designa espaços urbanos largos e abertos, especialmente praças; a escolha mantém a distinção poética em relação ao espaço exterior da linha anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo foi preservado, assim como a personificação da morte e a imagem de sua entrada pelas janelas. A tradução distingue «ruas» e «praças» para evitar a formulação pouco natural «crianças de fora», registrando em nota a forma mais literal e a amplitude lexical.
