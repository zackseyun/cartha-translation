  text: עַל מִצְרַ֣יִם וְ/עַל יְהוּדָ֗ה וְ/עַל אֱד֞וֹם וְ/עַל בְּנֵ֤י עַמּוֹן֙ וְ/עַל מוֹאָ֔ב וְ/עַל֙ כָּל קְצוּצֵ֣י פֵאָ֔ה הַ/יֹּשְׁבִ֖ים בַּ/מִּדְבָּ֑ר כִּ֤י כָל הַ/גּוֹיִם֙ עֲרֵלִ֔ים וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל עַרְלֵי לֵֽב־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/025.yaml
  text: against Egypt[a], and against Judah, and against Edom, and against the sons of Ammon, and against Moab, and against all those with the corners of their hair cut off, who dwell in the wilderness; for all the nations are uncircumcised, and all the house of Israel are uncircumcised in heart.
translation:
  language: pt
  text: contra o Egito, contra Judá, contra Edom, contra os filhos de Amom, contra Moabe e contra todos os que aparam as pontas do cabelo[a] e habitam no deserto; pois todas as nações são incircuncisas, e toda a casa de Israel é incircuncisa de coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os que têm as têmporas rapadas”. O hebraico provavelmente se refere a um penteado distintivo dos povos do deserto.'
    reason: alternativa lexical e incerteza etnográfica
lexical_decisions:
- source_word: עַל
  choice: contra
  rationale: No contexto de juízo iniciado no versículo anterior, a preposição introduz aqueles sobre os quais recairá o castigo; “contra” comunica essa força judicial e hostil em português natural.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Mantém de forma transparente a construção hebraica e sua forma masculina coletiva, sem substituí-la pelo gentílico interpretativo “amonitas”.
- source_word: כָּל קְצוּצֵי פֵאָה
  choice: todos os que aparam as pontas do cabelo
  rationale: Preserva a imagem concreta de pessoas que cortavam as extremidades do cabelo, sem definir com certeza quais partes eram cortadas; a nota esclarece a provável referência a um penteado distintivo dos povos do deserto.
- source_word: הַיֹּשְׁבִים בַּמִּדְבָּר
  choice: habitam no deserto
  rationale: “Habitam” conserva o registro profético digno, enquanto “deserto” expressa de modo claro o sentido contextual de מִדְבָּר.
- source_word: כָל הַגּוֹיִם
  choice: todas as nações
  rationale: O contexto trata dos povos circunvizinhos; “nações” evita impor aqui um contraste teológico posterior entre judeus e gentios.
- source_word: עֲרֵלִים
  choice: incircuncisas
  rationale: A tradução literal mantém a força pactual e polêmica do termo hebraico.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Reproduz o idioma coletivo hebraico numa expressão bíblica ainda clara em português moderno.
- source_word: עַרְלֵי לֵב
  choice: incircuncisa de coração
  rationale: Conserva a metáfora hebraica que contrapõe o sinal externo da aliança à condição interior de Israel.
theological_decisions:
- issue: Força metafórica da condição de Israel
  choice: incircuncisa de coração
  alternative: espiritualmente incircuncisa; de coração endurecido
  rationale: A formulação literal preserva a tensão teológica entre a circuncisão externa e a rebelião interior, sem reduzir a imagem a uma explicação abstrata.
- issue: Identificação dos בני עמון
  choice: os filhos de Amom
  alternative: os amonitas
  rationale: A forma escolhida mantém a expressão masculina e etnicamente específica do hebraico, funcionando coletivamente sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “contra” reproduz a estrutura enfática da lista hebraica; o ponto e vírgula mantém clara a passagem da enumeração para sua justificativa.
