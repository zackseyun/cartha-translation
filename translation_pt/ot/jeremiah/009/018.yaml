source:
  edition: WLC
  text: כִּ֣י ק֥וֹל נְהִ֛י נִשְׁמַ֥ע מִ/צִּיּ֖וֹן אֵ֣יךְ שֻׁדָּ֑דְנוּ בֹּ֤שְׁנֽוּ מְאֹד֙ כִּֽי עָזַ֣בְנוּ אָ֔רֶץ כִּ֥י הִשְׁלִ֖יכוּ מִשְׁכְּנוֹתֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/018.yaml
  text: 'For the sound of wailing is heard from Zion: “How we are devastated! We are utterly ashamed[a], because we have left the land[c][b], because they have cast down our dwellings.”'
translation:
  language: pt
  text: 'Pois de Sião se ouve um som de lamento: “Como fomos devastados![a] Estamos profundamente envergonhados, pois deixamos a terra[b], pois derrubaram as nossas moradas.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fomos saqueados”. O verbo hebraico pode enfatizar tanto a devastação geral quanto o despojo causado por um inimigo.
    reason: lexical_alternative
  - marker: b
    text: Ou “abandonamos a terra”. O hebraico pode descrever tanto a partida forçada quanto o abandono da terra; o contexto de lamento favorece a partida sob juízo.
    reason: lexical_alternative
  - marker: c
    text: Ou “habitações” ou “lares”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da convocação ao lamento no contexto e mantém uma ligação discursiva natural em português.
- source_word: קוֹל נְהִי
  choice: um som de lamento
  rationale: Preserva a dimensão auditiva de קוֹל e traduz נְהִי por uma expressão corrente, digna e adequada ao contexto fúnebre.
- source_word: נִשְׁמַע
  choice: se ouve
  rationale: Expressa naturalmente em português o sentido passivo do nifal, sem determinar em excesso o aspecto verbal.
- source_word: מִצִּיּוֹן
  choice: de Sião
  rationale: Mantém o topônimo e sua ressonância poética e teológica, indicando a origem do lamento.
- source_word: אֵיךְ
  choice: Como
  rationale: Conserva a força exclamativa da lamentação sem acrescentar uma interjeição ausente do hebraico.
- source_word: שֻׁדָּדְנוּ
  choice: fomos devastados
  rationale: O passivo de שׁדד pode indicar devastação, ruína ou saque; esta opção abrange a destruição nacional sem restringir o sentido ao despojo.
- source_word: בֹּשְׁנוּ מְאֹד
  choice: Estamos profundamente envergonhados
  rationale: Comunica a vergonha ou desonra expressa por בושׁ e a intensificação de מְאֹד em português atual.
- source_word: כִּי עָזַבְנוּ אָרֶץ
  choice: pois deixamos a terra
  rationale: Preserva a possibilidade de saída forçada ou abandono, sem resolver silenciosamente a ambiguidade do verbo עזב.
- source_word: אָרֶץ
  choice: a terra
  rationale: No contexto, refere-se à terra natal, especialmente Judá, e não ao planeta; a formulação mantém a concisão do hebraico.
- source_word: כִּי הִשְׁלִיכוּ
  choice: pois derrubaram
  rationale: Com moradas como objeto, comunica o efeito violento de השליך em português idiomático, preservando o sujeito plural não identificado.
- source_word: מִשְׁכְּנוֹתֵינוּ
  choice: as nossas moradas
  rationale: Mantém o sentido coletivo de lugares de habitação e o registro poético do lamento.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva o tom poético e coletivo da lamentação, mantém indefinidos os responsáveis por derrubar as moradas e registra em notas as ambiguidades lexicais relevantes.
