  text: מִֽי יִתְּנֵ֣/נִי בַ/מִּדְבָּ֗ר מְלוֹן֙ אֹֽרְחִ֔ים וְ/אֶֽעֶזְבָה֙ אֶת עַמִּ֔/י וְ/אֵלְכָ֖ה מֵֽ/אִתָּ֑/ם כִּ֤י כֻלָּ/ם֙ מְנָ֣אֲפִ֔ים עֲצֶ֖רֶת בֹּגְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/001.yaml
  text: Oh[a], that I had a travelers' lodging place in the wilderness, so that I might leave my people and go away from them! For all of them are adulterers[d][c][b], an assembly of traitors.
translation:
  language: pt
  text: Quem me dera ter no deserto uma pousada para viajantes,[a] para que eu deixasse o meu povo e me afastasse deles! Pois todos eles são adúlteros,[b] uma reunião de traidores.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Quem me dará no deserto uma pousada para viajantes?” A pergunta expressa um desejo: “Quem me dera ter...”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pessoas adúlteras”. No contexto profético, o termo também pode evocar infidelidade à aliança, além do adultério literal.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “um bando de traidores” ou “uma companhia de gente desleal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Quem me dera ter
  rationale: A expressão, literalmente formulada como pergunta, funciona aqui como desejo intenso. A construção portuguesa preserva naturalmente o valor optativo e o tom de lamento.
- source_word: בַמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é claro e corrente em português e pode designar uma região erma ou inculta, sem exigir a ideia de dunas ou completa aridez.
- source_word: מְלוֹן אֹרְחִים
  choice: um abrigo para viajantes
  rationale: מְלוֹן indica lugar de pernoite ou pousada, e אֹרְחִים, viajantes. “Abrigo para viajantes” comunica uma acomodação provisória em região erma, sem sugerir necessariamente uma hospedaria estruturada.
- source_word: וְאֶעֶזְבָה
  choice: para que eu deixasse
  rationale: O coortativo, após a expressão de desejo, indica a finalidade ou consequência desejada. O subjuntivo em português reproduz essa nuance.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Tradução direta que mantém tanto a relação pessoal do falante quanto a dimensão comunitária e pactual da expressão.
- source_word: וְאֵלְכָה מֵאִתָּם
  choice: e me afastasse deles
  rationale: A formulação comunica a partida e a separação desejada, com naturalidade em português.
- source_word: כִּי כֻלָּם
  choice: Pois todos eles
  rationale: כִּי introduz a razão do desejo precedente, enquanto כֻלָּם enfatiza a totalidade do grupo denunciado.
- source_word: מְנָאֲפִים
  choice: adúlteros
  rationale: Mantém o sentido lexical concreto e permite, sem o resolver na tradução, o possível eco profético de infidelidade à aliança.
- source_word: עֲצֶרֶת
  choice: uma reunião de
  rationale: Preserva o substantivo coletivo e a força irônica de uma comunidade reunida que se caracteriza pela traição.
- source_word: בֹּגְדִים
  choice: traidores
  rationale: Expressa de modo conciso e forte a ideia de pessoas que agem com traição, deslealdade ou perfídia.
theological_decisions:
- issue: Se מְנָאֲפִים deve ser entendido apenas como adultério literal ou convertido explicitamente em metáfora de infidelidade à aliança
  choice: Manter “adúlteros” no texto principal
  alternative: “infiéis” ou “pessoas espiritualmente adúlteras”
  rationale: O termo hebraico designa concretamente adúlteros, mas no discurso profético também pode evocar infidelidade à aliança. A tradução conserva essa tensão, e a nota informa a possível ressonância sem substituir o sentido lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem me dera” preserva o lamento optativo; “abrigo para viajantes” evita a possível impressão moderna de um hotel formal; e “reunião de traidores” conserva o coletivo hebraico e o tom profético contundente.
