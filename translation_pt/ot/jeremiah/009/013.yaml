base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/013.yaml
  text: They went after the stubbornness of their heart and after the Baals[a], which their fathers taught them.
translation:
  language: pt
  text: Seguiram a obstinação do próprio coração e os baalins que seus pais[a] lhes ensinaram a cultuar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus antepassados”. O hebraico diz literalmente “seus pais”, referindo-se aqui às gerações anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: Seguiram
  rationale: A combinação idiomática de הלך com אַחֲרֵי significa ir atrás de ou seguir. “Seguiram” comunica com naturalidade a ideia de orientação e lealdade, sem perder o sentido do hebraico.
- source_word: שְׁרִרוּת
  choice: obstinação
  rationale: O substantivo indica teimosia voluntariosa ou resistência interior. “Obstinação” é atual, digna e adequada ao sentido moral presente em Jeremias.
- source_word: לִבָּם
  choice: do próprio coração
  rationale: O hebraico emprega “coração” no singular com sufixo plural, tratando coletivamente da disposição interior de cada pessoa. “Próprio” torna clara a natureza autocentrada dessa orientação sem pluralizar o substantivo.
- source_word: וְאַחֲרֵי הַבְּעָלִים
  choice: e os baalins
  rationale: O segundo אַחֲרֵי depende do mesmo verbo e introduz outro objeto seguido. “Baalins” é a forma portuguesa tradicional e transparente para o plural hebraico, referente às manifestações ou imagens locais de Baal.
- source_word: אֲשֶׁר לִמְּדוּם אֲבוֹתָם
  choice: conforme seus pais lhes ensinaram
  rationale: O piel de למד significa “ensinar”, e o sufixo verbal indica “lhes”. “Conforme” expressa naturalmente que os pais lhes ensinaram a seguir os baalins, complemento implícito no hebraico.
theological_decisions:
- issue: Sentido de אֲבוֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico diz literalmente “seus pais”, forma masculina plural que também pode designar gerações anteriores. O texto principal preserva a forma explícita, e a nota registra o alcance mais amplo.
- issue: Relação da oração אֲשֶׁר לִמְּדוּם com “os baalins”
  choice: conforme seus pais lhes ensinaram
  alternative: os quais seus pais lhes ensinaram
  rationale: Embora אֲשֶׁר venha depois de “os baalins”, o sentido contextual é que os pais ensinaram o povo a segui-los. A formulação escolhida explicita apenas o complemento elíptico exigido em português, sem atribuir aos baalins a ação de ensinar.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita o coloquial “foram atrás de”, mantém o singular coletivo “coração” e usa “baalins” para o plural cultual hebraico.
