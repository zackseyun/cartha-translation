base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/017.yaml
  text: Let them hurry and raise a lament over us[a], so that our eyes may run down with tears and our eyelids flow with water.
translation:
  language: pt
  text: Que elas se apressem e entoem uma lamentação por nós, para que lágrimas corram dos nossos olhos e água escorra de nossas pálpebras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “água”, em paralelo poético com “lágrimas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְמַהֵרְנָה
  choice: Que elas se apressem
  rationale: Preserva a força volitiva da forma verbal feminina plural e a urgência do chamado, em português natural.
- source_word: וְתִשֶּׂנָה עָלֵינוּ נֶהִי
  choice: e entoem uma lamentação por nós
  rationale: A combinação de נשׂא com נֶהִי significa levantar ou iniciar um lamento. “Entoar uma lamentação” comunica naturalmente o ato público e vocal sem tornar a expressão excessivamente técnica.
- source_word: נֶהִי
  choice: lamentação
  rationale: O substantivo designa pranto ou lamento. “Lamentação” mantém o tom solene e profético e é amplamente compreensível.
- source_word: וְתֵרַדְנָה עֵינֵינוּ דִּמְעָה
  choice: para que lágrimas corram dos nossos olhos
  rationale: A formulação conserva o movimento descendente sugerido por ירד e verte o singular coletivo דִּמְעָה pelo plural idiomático “lágrimas”.
- source_word: וְעַפְעַפֵּינוּ יִזְּלוּ מָיִם
  choice: e água escorra de nossas pálpebras
  rationale: Mantém a imagem concreta de líquido fluindo e o paralelismo poético entre “lágrimas” e “água”, sem substituir explicitamente a metáfora.
- source_word: מָיִם
  choice: água
  rationale: Traduz literalmente o hebraico e preserva sua expressão poética; no contexto, a água se refere às lágrimas.
