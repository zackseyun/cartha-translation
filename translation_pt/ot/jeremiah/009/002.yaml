source:
  edition: WLC
  text: וַֽ/יַּדְרְכ֤וּ אֶת לְשׁוֹנָ/ם֙ קַשְׁתָּ֣/ם שֶׁ֔קֶר וְ/לֹ֥א לֶ/אֱמוּנָ֖ה גָּבְר֣וּ בָ/אָ֑רֶץ כִּי֩ מֵ/רָעָ֨ה אֶל רָעָ֧ה יָצָ֛אוּ וְ/אֹתִ֥/י לֹֽא יָדָ֖עוּ נְאֻם יְהוָֽה־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/002.yaml
  text: They bend their tongue[a] like their bow for falsehood, and not for faithfulness have they grown strong in the land; for from evil to evil they go out, and they do not know me[b], declares Yahweh.
translation:
  language: pt
  text: Retesam a língua como um arco para a mentira; não é pela fidelidade que se fortalecem na terra. Pois avançam de maldade em maldade[a] e não me conhecem[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passam de um mal a outro”.'
    reason: lexical_alternative
  - marker: b
    text: “Conhecer” pode incluir aqui reconhecer Yahweh e relacionar-se com ele em fidelidade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרְכוּ אֶת־לְשׁוֹנָם קַשְׁתָּם
  choice: Retesam a língua como se retesa um arco
  rationale: דרך, no contexto do arco, descreve o ato de armá-lo ou retesá-lo. A formulação explicita em português a comparação elíptica entre a língua e o arco, sem abandonar a metáfora bélica.
- source_word: שֶׁקֶר
  choice: para a mentira
  rationale: שֶׁקֶר abrange mentira, falsidade e engano. “Mentira” é corrente e digna em português e, neste contexto, sugere aquilo que a língua armada lança como projétil.
- source_word: וְלֹא לֶאֱמוּנָה גָּבְרוּ
  choice: não é pela fidelidade que se fortalecem
  rationale: 'אֱמוּנָה indica fidelidade, firmeza ou confiabilidade; גבר comunica tornar-se forte ou prevalecer. A construção mantém a ênfase hebraica: sua força não procede da fidelidade.'
- source_word: בָאָרֶץ
  choice: na terra
  rationale: Em Jeremias, a expressão aponta naturalmente para a terra e a sociedade de Judá, não para o planeta inteiro.
- source_word: מֵרָעָה אֶל־רָעָה יָצָאוּ
  choice: avançam de maldade em maldade
  rationale: O verbo יצא indica movimento, e a locução descreve progressão contínua no mal. “Avançam” comunica esse movimento com naturalidade, enquanto “de maldade em maldade” preserva a repetição do hebraico.
- source_word: וְאֹתִי לֹא יָדָעוּ
  choice: e não me conhecem
  rationale: ידע pode incluir conhecimento relacional e reconhecimento da aliança. “Conhecem” preserva essa amplitude sem reduzir a expressão a informação mental nem explicitar apenas uma de suas dimensões.
- source_word: נְאֻם־יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética solene נְאֻם é bem representada por “declara”; o nome divino יהוה é transliterado como “Yahweh”, em vez de ser substituído por um título.
theological_decisions:
- issue: Amplitude relacional e pactual de יָדָעוּ
  choice: não me conhecem
  alternative: não me reconhecem
  rationale: “Conhecem” mantém simultaneamente o sentido direto e a possível dimensão relacional e pactual do verbo, sem decidir em favor de uma interpretação mais estreita.
- issue: Sentido ético de אֱמוּנָה
  choice: fidelidade
  alternative: verdade
  rationale: No contraste com mentira e no contexto da conduta pública, “fidelidade” preserva a noção de confiabilidade moral, embora “verdade” seja lexicalmente possível.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom profético digno. A sintaxe foi moderadamente ajustada para tornar inteligível a metáfora hebraica elíptica da língua como arco. Preservaram-se a repetição enfática, o nome divino e a amplitude teológica de “conhecer”.
