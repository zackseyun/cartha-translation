id: JER.9.8
reference: Jeremiah 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה לֹֽא אֶפְקָד בָּ֖/ם נְאֻם יְהוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/008.yaml
  text: Shall I not punish them for these things? declares Yahweh[a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: pt
  text: Acaso não os castigarei por causa dessas coisas? — declara Yahweh. Não se vingará a minha alma[a] de uma nação como esta?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “minha alma”, expressão antropopática; alternativamente, “eu mesmo” ou “meu ser”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: Acaso ... por causa dessas coisas?
  rationale: A partícula interrogativa הַ e a preposição עַל introduzem uma pergunta retórica de sentido causal. “Acaso” explicita naturalmente a força retórica, e “por causa dessas coisas” preserva a relação causal.
- source_word: אֶפְקָד
  choice: castigarei
  rationale: Neste contexto de juízo, פקד tem sentido judicial negativo, isto é, punir ou pedir contas. “Castigarei” é claro e preserva a solenidade do enunciado profético.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida de maneira solene e natural. O nome pessoal יְהוָה é transliterado como “Yahweh”, em vez de ser substituído por um título.
- source_word: אִם
  choice: Não ...?
  rationale: Aqui אִם introduz a segunda pergunta retórica, paralela à primeira, e não uma condição. A pergunta negativa comunica a resposta afirmativa esperada.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: de uma nação como esta
  rationale: A formulação conserva a ênfase demonstrativa de כָּזֶה e é idiomática em português com o verbo reflexivo “vingar-se de”.
- source_word: תִתְנַקֵּם
  choice: se vingará
  rationale: O hitpael de נקם tem força reflexiva ou média. “Se vingará” reproduz essa nuance e concorda diretamente com “a minha alma” como sujeito.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: A tradução formal preserva a imagem vívida e a tensão antropopática do hebraico, sem reduzi-la interpretativamente a “eu mesmo”.
theological_decisions:
- issue: A autorreferência divina נַפְשִׁי em contexto de juízo
  choice: a minha alma
  alternative: eu mesmo; o meu ser
  rationale: O hebraico emprega linguagem antropopática. Preservar “a minha alma” mantém a força retórica e emocional da declaração divina, enquanto a nota informa alternativas sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acaso” marca a natureza retórica da primeira pergunta; a segunda mantém a construção negativa e o paralelismo. O travessão destaca com naturalidade a fórmula profética.
