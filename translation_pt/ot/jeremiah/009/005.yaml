  terminology: «Engano» traduz adequadamente מִרְמָה; «conhecer-me»/«me conhecer» conserva o sentido relacional sem interpretação adicional. «Yahweh» corresponde à decisão terminológica fornecida para o Tetragrama. A mudança hebraica do singular possessivo para o verbo plural é preservada.
