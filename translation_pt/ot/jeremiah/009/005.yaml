source:
  edition: WLC
  text: שִׁבְתְּ/ךָ֖ בְּ/ת֣וֹךְ מִרְמָ֑ה בְּ/מִרְמָ֛ה מֵאֲנ֥וּ דַֽעַת אוֹתִ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/005.yaml
  text: Your dwelling is in the midst of deceit[a]; through deceit they refuse to know me[b], declares Yahweh.
translation:
  language: pt
  text: A tua morada está no meio do engano[a]; por meio do engano, eles se recusam a me conhecer[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do singular («a tua morada») ao plural («eles se recusam»), possivelmente dirigindo-se primeiro ao povo ou à cidade como um todo e depois aos seus habitantes.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por meio do engano, eles se recusaram a me conhecer».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְתְּךָ
  choice: Você habita
  rationale: A forma ligada a ישׁב com sufixo masculino singular pode designar morada ou habitação. A construção verbal «você habita» é natural em português e preserva a segunda pessoa do singular.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Expressa localização dentro de uma realidade circundante, não apenas localização genérica.
- source_word: מִרְמָה
  choice: engano
  rationale: Termo corrente que comunica falsidade e fraude moral sem estreitar indevidamente o sentido.
- source_word: בְּמִרְמָה
  choice: por causa do engano
  rationale: O ב pode indicar meio, esfera ou relação causal. Esta formulação preserva a repetição de «engano» e apresenta uma leitura contextual natural, sem excluir a alternativa instrumental registrada em nota.
- source_word: מֵאֲנוּ
  choice: eles se recusam
  rationale: O verbo מאן significa recusar ou não estar disposto. O presente comunica a conduta persistente denunciada pelo profeta, mantendo o plural hebraico.
- source_word: דַעַת
  choice: a me conhecer
  rationale: O infinitivo de ידע é vertido diretamente por «conhecer», deixando que o contexto carregue sua possível dimensão relacional e pactual.
- source_word: אוֹתִי
  choice: me
  rationale: Representa diretamente o marcador de objeto com sufixo da primeira pessoa singular.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: «Declara» conserva a força solene da fórmula profética, e «Yahweh» representa o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; «Yahweh» procura representar o nome próprio, em vez de substituí-lo por um título.
- issue: Mudança de número dentro do versículo
  choice: Segunda pessoa singular («você habita») seguida da terceira pessoa plural («eles se recusam»)
  alternative: Uniformizar toda a frase no singular ou no plural
  rationale: A mudança está no hebraico e pode passar do povo ou da cidade como entidade coletiva para seus habitantes. Preservá-la evita resolver silenciosamente a tensão gramatical.
- issue: Valor da preposição em בְּמִרְמָה
  choice: por causa do engano
  alternative: por meio do engano; no engano
  rationale: O hebraico admite nuances causal, instrumental ou circunstancial. A leitura causal é coerente com o contexto, enquanto a possibilidade instrumental é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a repetição enfática de «engano», a mudança de número do hebraico e a ambiguidade da relação expressa pela preposição ב por meio de nota.
