  source_fidelity: A tradução representa corretamente a dispersão, a falta de familiaridade das pessoas e de seus pais com as nações, o envio da espada em seu encalço e o propósito de pôr fim neles. Contudo, בַּגּוֹיִם traz artigo definido; «entre as nações» o reflete melhor.
  naturalness: O português é claro, moderno e de boa legibilidade internacional. «Até acabar com eles» é uma formulação idiomática, embora forte, e comunica adequadamente a finalidade destrutiva do hebraico. A inclusão de «E» inicial preserva melhor a ligação discursiva da oração.
  terminology: «Espalharei», «pais» e «a espada» preservam de modo adequado a linguagem e as imagens do hebraico. «Pais» mantém o termo familiar masculino do texto, sem antecipar a interpretação mais ampla «antepassados».
