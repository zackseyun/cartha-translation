- from: Eu os espalharei entre nações que nem eles nem seus pais conheceram e enviarei a espada atrás deles, até acabar com eles.[a]
  to: E eu os espalharei entre as nações que nem eles nem seus pais conheceram e enviarei a espada atrás deles, até acabar com eles.[a]
  rationale: Foi acrescentado o artigo em «entre as nações» para corresponder ao hebraico e melhorar a naturalidade. O «E» inicial conserva a conexão da frase no discurso profético. O restante, inclusive a imagem de enviar «a espada atrás deles», foi mantido.
