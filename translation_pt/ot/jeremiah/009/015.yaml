base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/015.yaml
  text: And I will scatter them among the nations that neither they nor their fathers have known[c][b][a], and I will send the sword after them until I have consumed them.
translation:
  language: pt
  text: E eu os espalharei entre as nações que nem eles nem seus pais conheceram e enviarei a espada atrás deles, até acabar com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até dar cabo deles” ou “até destruí-los”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִים
  choice: Eu os espalharei
  rationale: O hifil de פוץ expressa fazer dispersar. “Espalharei” é natural em português e preserva a ação de juízo sem acrescentar a ideia mais específica de expulsão.
- source_word: בַּגּוֹיִם
  choice: entre nações
  rationale: גּוֹיִם designa nações ou povos. “Entre nações” reproduz o plural indefinido do hebraico e evita importar o contraste posterior associado a “gentios”.
- source_word: אֲשֶׁר לֹא יָדְעוּ הֵמָּה וַאֲבוֹתָם
  choice: que nem eles nem seus pais conheceram
  rationale: O verbo ידע indica aqui conhecimento por experiência ou familiaridade. A construção “nem eles nem seus pais” torna claro, em português idiomático, o alcance da negação sobre ambos os grupos.
- source_word: וְשִׁלַּחְתִּי
  choice: e enviarei
  rationale: שלח significa normalmente “enviar”. A escolha mantém a formulação simples do original, sem intensificá-la como faria “desencadearei”.
- source_word: אַחֲרֵיהֶם
  choice: atrás deles
  rationale: Tradução direta que preserva a imagem de perseguição implícita no contexto.
- source_word: אֶת הַחֶרֶב
  choice: a espada
  rationale: Mantém a imagem concreta do hebraico, que pode representar guerra, morte violenta ou juízo, sem resolver a metonímia no texto principal.
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: até acabar com eles
  rationale: כלה nesta construção significa levar ao fim ou dar cabo. “Acabar com eles” é atual, severo e natural, preservando a ideia de eliminação sem introduzir a imagem de consumir, ausente do verbo hebraico.
theological_decisions:
- issue: Sentido de וַאֲבוֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” corresponde diretamente ao substantivo masculino hebraico e preserva sua ressonância familiar e histórica. “Antepassados” é uma alternativa legítima caso o referente mais amplo precise ser explicitado.
- issue: Força metonímica de הַחֶרֶב
  choice: a espada
  alternative: a guerra / a destruição violenta
  rationale: O texto conserva a imagem profética concreta e sua amplitude sem decidir se ela se refere exclusivamente à guerra, à execução ou, de modo mais amplo, ao juízo mortal.
- issue: Alcance de עַד כַּלּוֹתִי אוֹתָם
  choice: até acabar com eles
  alternative: até dar cabo deles / até destruí-los
  rationale: A tradução mantém a gravidade da ameaça e a noção de levá-los ao fim, sem atenuar o juízo nem acrescentar uma metáfora lexicalmente incerta.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e compreensão internacional. A coordenação foi mantida compacta, e as imagens hebraicas da dispersão, da espada em perseguição e do fim dos destinatários foram preservadas.
