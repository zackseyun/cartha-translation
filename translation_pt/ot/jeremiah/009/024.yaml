base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/024.yaml
  text: Look[a], days are coming, declares Yahweh[b], when I will punish everyone circumcised only in foreskin.
translation:
  language: pt
  text: Eis[a] que vêm dias — declaração de Yahweh — em que castigarei todos os que são circuncidados apenas no prepúcio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vede”. A palavra introduz com ênfase um anúncio profético.'
    reason: alternative_rendering
  - marker: b
    text: 'Ou, mais formalmente: “todos os circuncidados juntamente com os incircuncisos”. A expressão hebraica é deliberadamente paradoxal e provavelmente descreve pessoas que trazem exteriormente a circuncisão física, mas continuam incircuncisas em sentido mais profundo; compare os versículos seguintes e Jeremias 4:4.'
    reason: alternative_reading_cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis
  rationale: Introduz com ênfase o anúncio profético e conserva sua força dêitica em português claro e solene.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Mantém de perto a fórmula profética hebraica sem acrescentar o artigo ausente no texto-fonte.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Reproduz a fórmula solene de oráculo e preserva o nome divino יְהוָה como Yahweh.
- source_word: וּפָקַדְתִּי
  choice: castigarei
  rationale: Neste contexto de juízo, פקד com עַל indica uma intervenção punitiva, não mera atenção ou visita.
- source_word: עַל כָּל
  choice: todo
  rationale: Introduz de modo conciso e natural o conjunto de pessoas que será objeto do juízo.
- source_word: מוּל
  choice: circuncidado
  rationale: O particípio é empregado substantivamente para designar quem traz a circuncisão.
- source_word: בְּעָרְלָה
  choice: apenas no prepúcio
  rationale: Conserva a imagem corporal e o paradoxo deliberado da expressão hebraica, enquanto 'apenas' torna inteligível a ideia de uma circuncisão meramente exterior sem explicitar além do texto a referência ao coração.
theological_decisions:
- issue: Sentido da expressão paradoxal מוּל בְּעָרְלָה
  choice: todo circuncidado apenas no prepúcio
  alternative: todos os circuncidados juntamente com os incircuncisos
  rationale: A formulação escolhida mantém a tensão entre o sinal físico da circuncisão e uma incircuncisão mais profunda, sem identificar explicitamente esta última com o coração dentro deste versículo. A alternativa registra uma leitura possível da construção hebraica.
translation_notes:
  register: Português moderno, solene e amplamente compreensível. A ordem e a fórmula profética hebraicas foram preservadas, e travessões destacam naturalmente a declaração divina. O paradoxo final foi mantido em vez de ser substituído por uma explicação teológica.
