  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י צוֹרְפָ֖/ם וּ/בְחַנְתִּ֑י/ם כִּֽי אֵ֣יךְ אֶעֱשֶׂ֔ה מִ/פְּנֵ֖י בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/006.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Behold, I am refining them and testing them[b], for how else can I act because of the daughter of my people?'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh dos Exércitos: “Eis que vou refiná-los e prová-los, pois como agirei[b] por causa da filha do meu povo[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais idiomática, “meu povo” ou “meu querido povo”. O hebraico diz literalmente “a filha do meu povo”, uma expressão profética de ternura e relação de aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou, “pois como poderia agir de outro modo?” ou “pois que mais posso fazer?”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo termo português tradicional e semanticamente amplo, sem restringi-lo apenas a exércitos humanos ou celestiais.
- source_word: הִנְנִי צוֹרְפָם וּבְחַנְתִּים
  choice: Eis que vou refiná-los e prová-los
  rationale: “Eis que” conserva a ênfase de הִנְנִי; “vou refiná-los” expressa naturalmente em português a ação iminente indicada pela construção, e “prová-los” mantém a ideia de submetê-los a teste, em harmonia com a metáfora metalúrgica.
- source_word: כִּי אֵיךְ אֶעֱשֶׂה
  choice: pois como poderia eu agir de outro modo
  rationale: Reproduz como pergunta retórica a ideia de que, diante da condição do povo, não há outra resposta possível, sem acrescentar uma explicação teológica ao texto.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Expressa de maneira clara e idiomática o valor causal da preposição neste contexto.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: Preserva a expressão profética familiar do hebraico e sua carga afetiva e pactual, em vez de substituí-la silenciosamente por uma paráfrase.
theological_decisions:
- issue: Sentido da expressão profética בַּת עַמִּי
  choice: a filha do meu povo
  alternative: meu povo; meu querido povo
  rationale: A tradução mantém a imagem familiar do hebraico e deixa sua relação exata deliberadamente aberta; a nota oferece equivalentes idiomáticos sem apagar a formulação original.
- issue: Força da pergunta כִּי אֵיךְ אֶעֱשֶׂה
  choice: como poderia eu agir de outro modo
  alternative: como agirei; que mais posso fazer
  rationale: A formulação conserva o caráter retórico e a tensão da resposta divina, sem desenvolver uma doutrina de necessidade além do que o verso afirma.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção natural para leitores brasileiros. Conservam-se o nome Yahweh, a solenidade de “Eis que”, a metáfora do refino e a expressão profética “filha do meu povo”.
