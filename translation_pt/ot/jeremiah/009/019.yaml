  text: כִּֽי שְׁמַ֤עְנָה נָשִׁים֙ דְּבַר יְהוָ֔ה וְ/תִקַּ֥ח אָזְנְ/כֶ֖ם דְּבַר פִּ֑י/ו וְ/לַמֵּ֤דְנָה בְנֽוֹתֵי/כֶם֙ נֶ֔הִי וְ/אִשָּׁ֥ה רְעוּתָ֖/הּ קִינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/019.yaml
  text: For hear the word of Yahweh[a], O women, and let your ear receive the word of his mouth; teach your daughters a lament[c][b], and each woman her neighbor a dirge.
translation:
  language: pt
  text: Pois ouçam, mulheres, a palavra de Yahweh, e que seus ouvidos acolham a palavra de sua boca.[a] Ensinem às suas filhas uma lamentação,[b] e cada mulher ensine à sua companheira um canto fúnebre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “que o ouvido de vocês receba”, expressão que indica escuta atenta e receptiva. O português usa naturalmente o plural “ouvidos” para o público coletivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Os dois termos hebraicos de luto neste versículo são relacionados, mas distintos: um indica lamentação ou pranto, e o outro, um canto fúnebre formal.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função conectiva e explicativa do termo no contexto, introduzindo a razão ou fundamento urgente da exortação.
- source_word: שְׁמַעְנָה נָשִׁים
  choice: ouçam, mulheres
  rationale: Reproduz o imperativo dirigido especificamente às mulheres; a ordem adotada é natural em português e conserva o tom de convocação profética.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e verte diretamente o nome divino יהוה como Yahweh.
- source_word: וְתִקַּח אָזְנְכֶם
  choice: e que seus ouvidos recebam
  rationale: Conserva a imagem hebraica do ouvido que recebe, ao mesmo tempo que usa o plural idiomático em português para um público coletivo.
- source_word: דְּבַר פִּיו
  choice: a palavra da sua boca
  rationale: Mantém a imagem concreta e o paralelismo do hebraico, sem reduzir a expressão simplesmente a “o que ele diz”.
- source_word: וְלַמֵּדְנָה בְנוֹתֵיכֶם
  choice: Ensinem às suas filhas
  rationale: Preserva o imperativo dirigido às mulheres, a relação familiar explícita e a transmissão comunitária da prática de luto.
- source_word: נֶהִי
  choice: uma lamentação
  rationale: Designa uma expressão de pranto ou lamento; “lamentação” é clara, digna e adequada a algo que se ensina.
- source_word: וְאִשָּׁה רְעוּתָהּ
  choice: e cada mulher ensine à sua companheira
  rationale: Explicita em português o verbo subentendido no hebraico e preserva o sentido distributivo e relacional da frase.
- source_word: קִינָה
  choice: um canto fúnebre
  rationale: Expressa uma composição formal de luto e a distingue de נֶהִי sem apagar o paralelismo entre os dois termos.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio e segue a orientação do projeto sem substituí-lo por um título.
- issue: Destinatárias especificamente femininas
  choice: mulheres / suas filhas / cada mulher / sua companheira
  alternative: pessoas / seus filhos / cada pessoa
  rationale: Os imperativos hebraicos são femininos, e o versículo menciona explicitamente mulheres e filhas; a tradução mantém essa especificidade.
- issue: Verbo subentendido na última oração
  choice: repetição explícita de “ensine”
  alternative: “e cada mulher à sua companheira um canto fúnebre”
  rationale: O hebraico deixa o verbo elíptico, retomando “ensinem”; explicitá-lo em português transmite a mesma relação sintática com maior clareza, sem acrescentar conteúdo interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as imagens concretas do hebraico, mas explicita o verbo elíptico na oração final para garantir naturalidade. Os marcadores [a] e [b] aparecem no texto principal.
