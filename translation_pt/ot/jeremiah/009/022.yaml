  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל יִתְהַלֵּ֤ל חָכָם֙ בְּ/חָכְמָת֔/וֹ וְ/אַל יִתְהַלֵּ֥ל הַ/גִּבּ֖וֹר בִּ/גְבֽוּרָת֑/וֹ אַל יִתְהַלֵּ֥ל עָשִׁ֖יר בְּ/עָשְׁרֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/022.yaml
  text: 'Thus says Yahweh: Let not the wise man boast in his wisdom[a], and let not the mighty man boast in his might; let not the rich man boast in his riches.'
translation:
  language: pt
  text: 'Assim diz Yahweh[a]: “Não se glorie o sábio em sua sabedoria, nem se glorie o forte em sua força; não se glorie o rico em sua riqueza.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e solene a fórmula profética de mensageiro, usando o presente em português para a proclamação autorizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo silenciosamente por um título.
- source_word: אַל יִתְהַלֵּל
  choice: Não se glorie
  rationale: O hitpael de הלל expressa exaltação de si mesmo ou vanglória; esta formulação preserva tanto a proibição quanto o tom elevado, sendo compreensível em português atual.
- source_word: חָכָם
  choice: o sábio
  rationale: O adjetivo masculino singular substantivado designa representativamente aquele que é sábio; a forma portuguesa é natural e mantém o paralelismo.
- source_word: בְּחָכְמָתוֹ
  choice: em sua sabedoria
  rationale: A preposição בְּ marca aquilo em que a pessoa se gloria; a construção direta também é idiomática em português.
- source_word: הַגִּבּוֹר
  choice: o forte
  rationale: גִּבּוֹר pode designar alguém forte, poderoso ou valente. Neste contexto geral de capacidades humanas, “o forte” evita restringir o sentido a um guerreiro.
- source_word: בִּגְבוּרָתוֹ
  choice: em sua força
  rationale: Traduz a capacidade ou força correspondente a גִּבּוֹר e conserva o paralelismo lexical da cláusula.
- source_word: עָשִׁיר
  choice: o rico
  rationale: O adjetivo masculino singular substantivado é vertido de maneira concisa e natural, em paralelo com “o sábio” e “o forte”.
- source_word: בְּעָשְׁרוֹ
  choice: em sua riqueza
  rationale: Expressa diretamente a riqueza como fundamento da vanglória e mantém a cadência tríplice do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome próprio no corpo do texto, enquanto a nota registra a tradição de substituí-lo pelo título “SENHOR”.
- issue: Natureza da proibição contra gloriar-se
  choice: Não se glorie
  alternative: Não se vanglorie
  rationale: “Gloriar-se” mantém a ressonância teológica e retórica sem determinar além do texto se o problema é orgulho interior, discurso público ou ambos; “vangloriar-se” seria uma alternativa mais explicitamente negativa.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. O paralelismo tríplice e as formas masculinas singulares representativas do hebraico foram preservados. A pontuação realça a progressão sabedoria–força–riqueza.
