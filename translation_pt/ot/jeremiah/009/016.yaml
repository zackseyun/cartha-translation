id: JER.9.16
reference: Jeremiah 9:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִתְבּֽוֹנְנ֛וּ וְ/קִרְא֥וּ לַ/מְקוֹנְנ֖וֹת וּ/תְבוֹאֶ֑ינָה וְ/אֶל הַ/חֲכָמ֥וֹת שִׁלְח֖וּ וְ/תָבֽוֹאנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/016.yaml
  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos:

    “Prestem atenção e chamem as mulheres que entoam lamentos[a], para que venham;

    mandem chamar as mulheres hábeis[b], para que venham.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as pranteadoras”, isto é, mulheres que conduzem a lamentação, possivelmente como ofício.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as mulheres sábias”; aqui, provavelmente mulheres hábeis em conduzir a lamentação.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Assim diz
  rationale: Preserva a fórmula profética de anúncio de maneira corrente e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Reproduz o título divino tradicional sem restringir explicitamente os exércitos aos terrenos ou aos celestiais.
- source_word: הִתְבּוֹנְנוּ
  choice: Prestem atenção
  rationale: Expressa o imperativo plural de considerar atentamente a situação, com linguagem natural no português moderno.
- source_word: וְקִרְאוּ
  choice: e chamem
  rationale: No contexto, indica convocar as mulheres para que venham.
- source_word: לַמְקוֹנְנוֹת
  choice: as mulheres que entoam lamentos
  rationale: Representa o particípio feminino plural ligado à execução de lamentações, sem tornar explícito como certeza que fossem profissionais remuneradas.
- source_word: וּתְבוֹאֶינָה
  choice: para que venham
  rationale: Transmite o sentido volitivo ou resultante do imperfeito após o imperativo.
- source_word: הַחֲכָמוֹת
  choice: as mulheres hábeis
  rationale: Embora o adjetivo possa significar 'sábias', o paralelismo sugere mulheres experientes na arte da lamentação; 'hábeis' preserva essa adequação contextual.
- source_word: שִׁלְחוּ
  choice: mandem chamar
  rationale: Expressa idiomaticamente o ato de enviar alguém para buscá-las ou convocá-las.
- source_word: וְתָבֹאנָה
  choice: para que venham
  rationale: Mantém a repetição e o paralelismo do hebraico, bem como o sentido volitivo ou resultante.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama; a transliteração preserva a distinção entre o nome divino e títulos como 'Senhor'.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Os imperativos foram vertidos com formas correntes na terceira pessoa do plural. O paralelismo e a repetição final do hebraico foram preservados.
