source:
  edition: WLC
  text: דַּבֵּ֗ר כֹּ֚ה נְאֻם יְהוָ֔ה וְ/נָֽפְלָה֙ נִבְלַ֣ת הָֽ/אָדָ֔ם כְּ/דֹ֖מֶן עַל פְּנֵ֣י הַ/שָּׂדֶ֑ה וּ/כְ/עָמִ֛יר מֵ/אַחֲרֵ֥י הַ/קֹּצֵ֖ר וְ/אֵ֥ין מְאַסֵּֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
translation:
  language: pt
  text: 'Fale: Assim diz Yahweh: “O cadáver do ser humano[a] cairá como esterco sobre a superfície do campo e como um feixe atrás do ceifeiro, sem ninguém que o recolha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cadáver do homem” ou “o cadáver da humanidade”. O hebraico usa אָדָם no singular, que aqui pode ter sentido genérico.'
    reason: Alternativa lexical que registra a forma singular e a abrangência possível de אָדָם.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: Imperativo masculino singular que introduz diretamente a proclamação profética; “Fale” preserva a força da ordem em português corrente.
- source_word: כֹּה נְאֻם יְהוָה
  choice: Assim diz Yahweh
  rationale: Reproduz de modo natural e digno a fórmula profética de mensageiro, mantendo o nome divino explícito.
- source_word: וְנָפְלָה
  choice: cairá
  rationale: O perfeito no discurso profético anuncia como futuro certo o juízo vindouro.
- source_word: נִבְלַת הָאָדָם
  choice: o cadáver do ser humano
  rationale: “Cadáver” conserva a crueza de נִבְלָה; o singular genérico אָדָם é expresso por “ser humano”, sem convertê-lo em plural nem restringi-lo ao sexo masculino.
- source_word: כְּדֹמֶן
  choice: como esterco
  rationale: Mantém a comparação agrícola, degradante e deliberadamente forte do hebraico.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: sobre a superfície do campo
  rationale: Transmite com naturalidade o idioma hebraico “sobre a face do campo” e ressalta a exposição do cadáver.
- source_word: וּכְעָמִיר
  choice: e como um feixe
  rationale: עָמִיר designa aqui um feixe de cereal no contexto da colheita; “feixe” preserva a imagem sem especificar além do texto.
- source_word: מֵאַחֲרֵי הַקֹּצֵר
  choice: deixado para trás pelo ceifeiro
  rationale: Explicita em português a relação espacial daquilo que fica atrás do ceifeiro, coerente com a imagem da colheita.
- source_word: וְאֵין מְאַסֵּף
  choice: sem ninguém que o recolha
  rationale: Expressa idiomaticamente a ausência de quem recolha o que ficou abandonado, mantendo a possível alusão à falta de sepultamento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio, sem substituí-lo por um título.
- issue: Sentido genérico do singular הָאָדָם
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: O singular pode representar genericamente a humanidade. “O ser humano” conserva tanto o singular quanto o caráter inclusivo, sem transformar a expressão no abstrato “humanidade”.
- issue: Relação entre o cadáver e o feixe
  choice: como um feixe deixado para trás pelo ceifeiro
  alternative: como um feixe atrás do ceifeiro
  rationale: A formulação mantém a comparação e torna inteligível a condição de abandono, sem identificar explicitamente “feixe” e cadáver além do que a imagem permite.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O registro é profético, direto e digno; preserva-se a linguagem forte do juízo e evita-se tanto o arcaísmo “sobre a face do campo” quanto uma suavização de “esterco”.
