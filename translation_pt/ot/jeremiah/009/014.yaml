source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מַאֲכִילָ֛/ם אֶת הָ/עָ֥ם הַ/זֶּ֖ה לַֽעֲנָ֑ה וְ/הִשְׁקִיתִ֖י/ם מֵי רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/014.yaml
  text: 'Therefore thus says Yahweh of Armies[a], the God of Israel: Behold, I am feeding this people wormwood[b], and I will make them drink poisoned water.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh dos Exércitos, o Deus de Israel: “Eis que farei este povo comer absinto[a] e lhes darei água envenenada para beber[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amargura”; o hebraico designa uma planta muito amarga, usada com frequência como imagem de juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou “água de veneno” ou, tradicionalmente, “água de fel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת pelo sentido concreto e compreensível de forças ou exércitos.
- source_word: הִנְנִי מַאֲכִילָם
  choice: Eis que farei ... comer
  rationale: Mantém a ênfase da fórmula הִנְנִי e expressa de modo natural em português a ação causativa, iminente e certa do particípio hebraico.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Reproduz diretamente o substantivo coletivo e a força demonstrativa do hebraico.
- source_word: לַעֲנָה
  choice: absinto
  rationale: Conserva a imagem concreta da planta intensamente amarga, usada no contexto como símbolo de juízo.
- source_word: וְהִשְׁקִיתִים מֵי רֹאשׁ
  choice: e lhe darei água envenenada para beber
  rationale: Expressa naturalmente o causativo de שקה e entende רֹאשׁ, nesta combinação, como substância venenosa ou nociva.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Senhor dos Exércitos
  rationale: Mantém explícito o nome pactual יְהוָה e traduz o título צְבָאוֹת sem impor uma interpretação denominacional.
- issue: Caráter do juízo anunciado
  choice: A causalidade divina é mantida explicitamente em “farei ... comer” e “darei ... para beber”
  alternative: Formulações que apenas descrevam o sofrimento do povo sem indicar o agente
  rationale: As formas causativas hebraicas apresentam Yahweh como aquele que administra o juízo; a tradução preserva essa tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com construção profética natural. “Eis que” preserva a ênfase do anúncio; “lhe darei ... para beber” evita rigidez excessiva sem apagar o valor causativo.
