base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/007.yaml
  text: Their tongue is a slaughtering arrow[a]; it speaks deceit. With his mouth each man speaks peace to his neighbor[c][b], but within himself he sets his ambush.
translation:
  language: pt
  text: A língua deles é uma flecha que mata[a]; profere engano. Com a boca, cada um fala palavras de paz ao seu próximo[b], mas, no íntimo, prepara uma emboscada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma flecha mortífera” ou “uma flecha preparada para o abate”. O particípio hebraico deriva do verbo “abater, matar” e enfatiza a intenção letal, não apenas a agudeza da flecha.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “fala paz ao seu próximo”; isto é, dirige-lhe palavras amistosas ou pacíficas enquanto planeja o mal interiormente.'
    reason: cultural_note
  - marker: c
    text: Ou “por dentro, arma uma emboscada”. O hebraico deixa implícito o alvo da emboscada.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵץ שוחט
  choice: uma flecha que mata
  rationale: Preserva a metáfora da flecha e a força letal do particípio derivado de שחט, sem sugerir apenas que a flecha esteja afiada.
- source_word: לְשׁוֹנָם
  choice: A língua deles
  rationale: Mantém o singular coletivo hebraico de modo natural em português.
- source_word: מִרְמָה דִבֵּר
  choice: fala engano
  rationale: Conserva a formulação compacta e a personificação da língua; 'engano' expressa a fala fraudulenta sem restringi-la a uma mentira pontual.
- source_word: בְּפִיו
  choice: Com a boca
  rationale: Expressa o valor instrumental da preposição e realça o contraste entre a fala exterior e a intenção interior.
- source_word: שָׁלוֹם אֶת רֵעֵהוּ יְדַבֵּר
  choice: cada um fala de paz ao seu próximo
  rationale: O sujeito distributivo implícito é explicitado por 'cada um'; 'fala de paz' mantém שלום e comunica palavras amistosas ou pacíficas.
- source_word: וּבְקִרְבּוֹ
  choice: mas, por dentro
  rationale: Traduz a interioridade e estabelece naturalmente em português o contraste com 'com a boca'.
- source_word: יָשִׂים אָרְבּוֹ
  choice: prepara-lhe uma emboscada
  rationale: Comunica idiomaticamente a ação de armar ou dispor uma emboscada. O pronome 'lhe' identifica o próximo como alvo provável, enquanto a nota registra que o hebraico não o explicita gramaticalmente.
