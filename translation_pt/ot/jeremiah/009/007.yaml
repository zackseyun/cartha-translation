translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém a imagem violenta da língua como flecha, o contraste entre boca e interior e a ambiguidade do sufixo em אָרְבּוֹ por meio de nota.
