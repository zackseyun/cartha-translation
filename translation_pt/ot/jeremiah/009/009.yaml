  naturalness: O registro é moderno e poético. A revisão torna a relação espacial e a sequência causal mais transparentes, sem perder a concisão do lamento.
  terminology: “Choro e pranto”, “pastagens do deserto”, “lamentação”, “gado”, “aves do céu” e “animais” são escolhas adequadas. “Queimadas” preserva a força concreta provável de נִצְּתוּ, com nota para a alternativa contextual mais ampla.
  issues:
