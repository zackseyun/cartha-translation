    issue: “Pelos montes” é espacialmente ambíguo.
    rationale: Em português, pode significar “através dos montes”; o hebraico עַל indica o lamento erguido “sobre” os montes.
  - severity: low
    issue: “Ficaram sem ninguém que passe por ali” é menos direto que a construção hebraica.
    rationale: A expressão hebraica descreve a ausência de qualquer pessoa que passe; “sem ninguém passar por elas” preserva melhor essa relação e o antecedente “pastagens”.
