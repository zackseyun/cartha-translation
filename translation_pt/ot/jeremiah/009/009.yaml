id: JER.9.9
reference: Jeremiah 9:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל הֶ֨/הָרִ֜ים אֶשָּׂ֧א בְכִ֣י וָ/נֶ֗הִי וְ/עַל נְא֤וֹת מִדְבָּר֙ קִינָ֔ה כִּ֤י נִצְּתוּ֙ מִ/בְּלִי אִ֣ישׁ עֹבֵ֔ר וְ/לֹ֥א שָׁמְע֖וּ ק֣וֹל מִקְנֶ֑ה מֵ/ע֤וֹף הַ/שָּׁמַ֨יִם֙ וְ/עַד בְּהֵמָ֔ה נָדְד֖וּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/009.yaml
  text: Over the mountains I will lift up weeping and wailing[a], and over the pastures of the wilderness a lament, because they are laid waste so that no man passes through, and they do not hear the sound of livestock. From the birds of the heavens to the beasts, they have fled[c][b]; they are gone.
translation:
  language: pt
  text: Sobre os montes levantarei choro e pranto; sobre as pastagens do deserto, uma lamentação, pois foram queimadas[a], sem ninguém passar por elas, e não se ouve o som do gado. Desde as aves do céu até os animais, fugiram; foram embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram devastadas”. O verbo hebraico pode destacar o incêndio ou, por extensão, a devastação resultante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא בְכִי וָנֶהִי
  choice: levantarei choro e pranto
  rationale: נשׂא expressa literalmente levantar ou erguer e, com termos de luto, significa iniciar ou elevar uma expressão de dor. A formulação conserva a imagem hebraica e distingue os dois substantivos.
- source_word: נְאוֹת מִדְבָּר
  choice: pastagens do deserto
  rationale: נְאוֹת designa lugares de pastoreio; a menção posterior ao gado confirma esse sentido no contexto. “Deserto” comunica uma região erma, não necessariamente sem qualquer vegetação.
- source_word: קִינָה
  choice: uma lamentação
  rationale: O termo indica uma lamentação formal, muitas vezes fúnebre. “Lamentação” é claro, digno e distinto de “choro e pranto” na primeira oração.
- source_word: נִצְּתוּ
  choice: foram queimadas
  rationale: O passivo sugere que as pastagens foram incendiadas ou consumidas pelo fogo. A tradução mantém a imagem concreta, enquanto a nota registra o sentido contextual mais amplo de devastação.
- source_word: מִבְּלִי אִישׁ עֹבֵר
  choice: ficaram sem ninguém que passe por ali
  rationale: אִישׁ tem aqui sentido genérico. “Ninguém” comunica naturalmente o abandono total sem restringir a referência a homens adultos.
- source_word: קוֹל מִקְנֶה
  choice: o som do gado
  rationale: קוֹל é som ou voz, e מִקְנֶה abrange os animais domésticos possuídos como rebanho. “Gado” é conciso e natural no contexto pastoril.
- source_word: מֵעוֹף הַשָּׁמַיִם וְעַד בְּהֵמָה
  choice: Tanto as aves do céu como os animais
  rationale: A construção “desde... até...” apresenta uma extensão inclusiva. Em português, “tanto... como...” reproduz com naturalidade a ideia de que desapareceram aves e animais terrestres.
- source_word: נָדְדוּ הָלָכוּ
  choice: fugiram; foram embora
  rationale: Os dois verbos sucessivos reforçam a retirada e o desaparecimento. Mantê-los em duas expressões preserva a ênfase do hebraico.
theological_decisions:
- issue: Identidade de quem fala em primeira pessoa
  choice: Manter apenas a primeira pessoa verbal, sem identificar explicitamente o falante
  alternative: Acrescentar “eu, Jeremias” ou identificar a fala como divina
  rationale: O verso não nomeia o falante nesta frase. A tradução preserva essa abertura contextual e evita resolver uma possível tensão literária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação organiza o paralelismo poético. “Entoarei” explicita de modo idiomático a ação associada à lamentação sem identificar o falante; “já não se ouve” verte naturalmente a ausência completa de ouvintes e de gado no lugar desolado.
