id: JER.9.11
reference: Jeremiah 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִֽי הָ/אִ֤ישׁ הֶֽ/חָכָם֙ וְ/יָבֵ֣ן אֶת זֹ֔את וַ/אֲשֶׁ֨ר דִּבֶּ֧ר פִּֽי יְהוָ֛ה אֵלָ֖י/ו וְ/יַגִּדָ֑/הּ עַל מָה֙ אָבְדָ֣ה הָ/אָ֔רֶץ נִצְּתָ֥ה כַ/מִּדְבָּ֖ר מִ/בְּלִ֖י עֹבֵֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/011.yaml
  text: Who is the wise man who can understand this? To whom has the mouth of Yahweh spoken[a], that he may declare it? Why has the land perished, laid waste like the wilderness[c][b], with no one passing through?
translation:
  language: pt
  text: Quem é o homem sábio que pode compreender isto? A quem a boca de Yahweh falou[a], para que ele o anuncie? Por que a terra pereceu[b], devastada[c] como o deserto, sem ninguém passar por ela?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a boca de Yahweh”, expressão profética que indica a fala direta de Yahweh.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “ficou arruinada”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “queimada”. O verbo hebraico pode destacar a devastação ou, mais especificamente, o incêndio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ הֶחָכָם
  choice: Quem é o homem sábio
  rationale: Mantém o substantivo masculino singular explícito do hebraico e a forma interrogativa, sem neutralizar a expressão.
- source_word: וְיָבֵן אֶת זֹאת
  choice: que pode compreender isto
  rationale: O imperfeito no contexto interrogativo pode expressar capacidade; “pode compreender” comunica essa nuance modal com naturalidade.
- source_word: וַאֲשֶׁר דִּבֶּר פִּי יְהוָה אֵלָיו
  choice: A quem a boca de Yahweh falou
  rationale: Conserva a imagem hebraica “boca de Yahweh”, que realça a procedência direta da palavra divina, e traduz o nome divino como nome próprio.
- source_word: וְיַגִּדָהּ
  choice: para que ele o anuncie
  rationale: O hifil indica tornar algo conhecido. “Anuncie” preserva o caráter público e solene; o pronome retoma aquilo que deve ser compreendido.
- source_word: עַל מָה
  choice: Por que
  rationale: É a forma portuguesa corrente de perguntar pela causa ou razão.
- source_word: אָבְדָה הָאָרֶץ
  choice: a terra pereceu
  rationale: Preserva a força verbal solene de אבד, que pode descrever perecimento, ruína ou destruição, sem necessariamente implicar aniquilação absoluta.
- source_word: נִצְּתָה
  choice: devastada
  rationale: Expressa o estado de desolação da terra no contexto. A possível nuance de ter sido queimada é preservada em nota.
- source_word: כַמִּדְבָּר
  choice: como o deserto
  rationale: מִדְבָּר designa uma região erma ou desértica; “deserto” é claro, corrente e adequado à comparação.
- source_word: מִבְּלִי עֹבֵר
  choice: sem ninguém passar por ela
  rationale: Reproduz naturalmente a ausência total de transeuntes e explicita em português que a passagem seria pela terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino. “Yahweh” preserva sua função de nome e representa de modo amplamente reconhecido a vocalização provável.
- issue: Imagem antropomórfica “boca de Yahweh”
  choice: Mantida no texto principal
  alternative: A quem Yahweh falou
  rationale: A formulação explícita do hebraico enfatiza que se trata da fala direta de Yahweh. Mantê-la evita reduzir a força da imagem profética.
- issue: Expressão masculina הָאִישׁ הֶחָכָם
  choice: o homem sábio
  alternative: a pessoa sábia; o sábio
  rationale: A forma hebraica é masculina singular e explicitamente contém “homem”; a tradução conserva essa forma sem acrescentar uma aplicação doutrinária restritiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe interrogativa foi mantida clara; a imagem hebraica incomum “a boca de Yahweh” foi conservada e explicada em nota.
