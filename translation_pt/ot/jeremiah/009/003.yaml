source:
  edition: WLC
  text: אִ֤ישׁ מֵ/רֵעֵ֨/הוּ֙ הִשָּׁמֵ֔רוּ וְ/עַל כָּל אָ֖ח אַל תִּבְטָ֑חוּ כִּ֤י כָל אָח֙ עָק֣וֹב יַעְקֹ֔ב וְ/כָל רֵ֖עַ רָכִ֥יל יַהֲלֹֽךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/003.yaml
  text: Each man[a], beware of his neighbor, and do not trust any brother; for every brother surely deceives[c][b], and every neighbor goes about as a slanderer.
translation:
  language: pt
  text: Cada um tome cuidado com o seu próximo e não confie em irmão algum, pois todo irmão certamente engana[a], e todo próximo anda espalhando calúnias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “age de modo totalmente traiçoeiro” ou “vive suplantando”. O hebraico intensifica a raiz עקב, que pode indicar enganar, passar alguém para trás ou suplantar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “anda espalhando fofocas” ou “anda como difamador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מֵרֵעֵהוּ הִשָּׁמֵרוּ
  choice: Cada um tome cuidado com o seu próximo
  rationale: O singular אִישׁ tem valor distributivo, enquanto o imperativo plural הִשָּׁמֵרוּ dirige a advertência à coletividade. “Cada um tome cuidado” reproduz essa combinação naturalmente. רֵעַ é traduzido por “próximo”, adequado ao contexto social amplo.
- source_word: וְעַל כָּל אָח אַל תִּבְטָחוּ
  choice: e não confie em irmão algum
  rationale: A preposição עַל com בּטח indica a pessoa em quem se deposita confiança. Em contexto proibitivo, כָּל é expresso naturalmente por “algum”. “Irmão” preserva a possibilidade de parentesco literal ou de vínculo comunitário.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão das advertências anteriores; “pois” mantém a ligação explicativa em português corrente e digno.
- source_word: עָקוֹב יַעְקֹב
  choice: certamente engana
  rationale: A combinação intensifica a ideia verbal da raiz עקב, ligada a enganar, passar alguém para trás ou suplantar. “Certamente engana” comunica a ênfase sem uma repetição artificial em português; a amplitude lexical é registrada em nota.
- source_word: וְכָל רֵעַ רָכִיל יַהֲלֹךְ
  choice: e todo próximo anda espalhando calúnias
  rationale: יַהֲלֹךְ descreve conduta habitual, bem expressa por “anda”. רָכִיל designa quem circula difundindo maledicência ou calúnia; a formulação verbal é mais natural em português do que “anda como caluniador”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A sintaxe evita literalismo rígido, mas conserva o tom incisivo, a generalização do hebraico e a ambiguidade de “irmão”. Os dois usos de רֵעַ são vertidos consistentemente por “próximo”.
