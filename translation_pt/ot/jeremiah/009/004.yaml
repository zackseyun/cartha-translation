base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/004.yaml
  text: And each man deceives his neighbor[a], and they do not speak truth; they have taught their tongue to speak falsehood[b]; they weary themselves committing iniquity.
translation:
  language: pt
  text: Cada um engana o seu próximo[a], e ninguém fala a verdade; todos ensinaram a própria língua a falar mentiras e cansam-se de praticar a perversidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “zomba do seu próximo” ou “age com falsidade para com o seu próximo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esgotam-se praticando o mal”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: cada um
  rationale: O singular tem força distributiva. “Cada um” preserva essa ideia em português natural sem introduzir uma referência exclusivamente masculina que o contexto coletivo não exige.
- source_word: בְּרֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode indicar amigo, companheiro ou próximo. Aqui, “próximo” expressa adequadamente a relação social entre pessoas que agem com falsidade umas para com as outras.
- source_word: יְהָתֵלּוּ
  choice: engana
  rationale: Neste contexto, o verbo no Hifil indica enganar ou iludir, em paralelo com não falar a verdade. A nota registra outras possibilidades lexicais.
- source_word: אֱמֶת
  choice: a verdade
  rationale: O paralelismo com falar mentiras favorece o sentido de veracidade no discurso, e não o sentido mais amplo de fidelidade.
- source_word: לִמְּדוּ לְשׁוֹנָם
  choice: Ensinaram a língua
  rationale: Mantém a imagem hebraica vívida da língua deliberadamente instruída e habituada à falsidade.
- source_word: דַּבֶּר שֶׁקֶר
  choice: a falar mentiras
  rationale: “Mentiras” é claro, atual e natural em português, preservando a força moral de שֶׁקֶר.
- source_word: הַעֲוֵה
  choice: praticarem a perversidade
  rationale: O termo exprime agir perversamente ou fazer o que é errado. “Praticar a perversidade” conserva o peso profético sem soar excessivamente técnico.
- source_word: נִלְאוּ
  choice: ficaram exaustos
  rationale: O Nifal exprime cansaço ou esgotamento. A construção “de tanto...” comunica naturalmente a relação com a prática persistente da perversidade, sem eliminar a possibilidade de outra análise registrada em nota.
