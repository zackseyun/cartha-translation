  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Preserva-se a imagem de ensinar a língua e o tom acusatório do profeta; a ordem final foi ajustada para fluência em português, com a alternativa mais formal indicada em nota.
