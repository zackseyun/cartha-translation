  naturalness: O texto é geralmente claro, mas «Cada um ... e não falam» mistura concordância singular e plural de modo pouco natural em português. A revisão preserva a força distributiva e dá continuidade gramatical mais fluente.
  terminology: «Próximo», «verdade», «língua», «mentiras» e «perversidade» são escolhas adequadas ao registro profético. «Cansam-se de praticar a perversidade» mantém a gravidade moral sem acrescentar uma explicação causal.
