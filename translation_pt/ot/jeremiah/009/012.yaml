source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/012.yaml
  text: And Yahweh said[a], "Because they have forsaken my law that I set before them[b], and have not obeyed my voice or walked in it,"
translation:
  language: pt
  text: 'E Yahweh disse: “Porque abandonaram a minha lei[a], que coloquei diante deles, não deram ouvidos à minha voz[b] nem andaram segundo ela,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha instrução”. O hebraico torá pode designar instrução em sentido amplo, embora aqui tenha forte sentido pactual.
    reason: lexical_alternative
  - marker: b
    text: Ou “não obedeceram à minha voz”. A expressão hebraica “ouvir a minha voz” frequentemente inclui a ideia de obediência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá prosseguimento ao discurso narrativo; “E ... disse” mantém a ligação com o contexto sem acrescentar uma relação temporal mais específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome pessoal da aliança representado pelo Tetragrama, em forma amplamente reconhecível.
- source_word: עַל עָזְבָם
  choice: Porque abandonaram
  rationale: עַל introduz aqui a causa, e עזב expressa abandono com forte peso de infidelidade à aliança.
- source_word: תּוֹרָתִי
  choice: a minha lei
  rationale: Embora תּוֹרָה possa significar instrução em sentido amplo, neste contexto tem força jurídica e pactual; “lei” comunica esse peso de modo natural.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיהֶם
  choice: que coloquei diante deles
  rationale: A expressão indica que Deus pôs sua lei diante do povo para conhecimento e observância; “coloquei diante deles” preserva a imagem e soa natural em português.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: não deram ouvidos à minha voz
  rationale: A locução portuguesa preserva a imagem hebraica de escutar a voz e, ao mesmo tempo, deixa perceptível sua implicação de obediência.
- source_word: וְלֹא הָלְכוּ בָהּ
  choice: nem andaram segundo ela
  rationale: Mantém a metáfora bíblica de andar como modo de conduta, deixando claro que a lei é o padrão seguido.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: a minha lei
  alternative: a minha instrução
  rationale: O contexto trata da ruptura da aliança e da recusa do padrão dado por Deus. “Lei” preserva essa força, enquanto a nota registra a amplitude lexical de תּוֹרָה.
- issue: Explicitação da obediência em שׁמע בקול
  choice: não deram ouvidos à minha voz
  alternative: não obedeceram à minha voz
  rationale: A formulação escolhida conserva a imagem verbal do hebraico e sua implicação de obediência, sem reduzir a expressão a uma única paráfrase interpretativa.
- issue: Metáfora de conduta em הלך ב
  choice: nem andaram segundo ela
  alternative: nem viveram de acordo com ela
  rationale: A tradução mantém a metáfora de andar presente no texto hebraico, mas usa “segundo ela” para tornar clara em português a ideia de conformidade à lei.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução conserva o nome Yahweh, a metáfora de andar e a imagem de dar ouvidos, evitando tanto arcaísmos desnecessários quanto paráfrases que eliminem a ambiguidade do hebraico. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
