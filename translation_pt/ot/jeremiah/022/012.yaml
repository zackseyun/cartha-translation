  text: כִּ֗י בִּ/מְק֛וֹם אֲשֶׁר הִגְל֥וּ אֹת֖/וֹ שָׁ֣ם יָמ֑וּת וְ/אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לֹֽא יִרְאֶ֥ה עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/012.yaml
  text: For in the place where they have exiled him[a], there he will die, and he will never see this land again.
translation:
  language: pt
  text: Pois, no lugar para onde o exilaram[a], ali morrerá e nunca mais verá esta terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o levaram para o exílio”. O verbo hebraico indica especificamente fazer alguém ir para o exílio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e mantém com naturalidade a relação explicativa do hebraico.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: no lugar para onde
  rationale: Em português, esta formulação liga naturalmente o lugar ao movimento implícito no ato de exilar, sem alterar o sentido locativo da oração.
- source_word: הִגְלוּ אֹתוֹ
  choice: o exilaram
  rationale: O hifil de גלה indica fazer alguém ir para o exílio. A forma ativa preserva o sujeito plural indefinido do hebraico.
- source_word: שָׁם
  choice: ali
  rationale: Mantém a ênfase hebraica no próprio lugar do exílio como o lugar onde ele morrerá.
- source_word: יָמוּת
  choice: morrerá
  rationale: Futuro simples, claro e solene, correspondente ao imperfeito hebraico neste anúncio profético.
- source_word: וְאֶת־הָאָרֶץ הַזֹּאת
  choice: e ... esta terra
  rationale: No contexto, אֶרֶץ designa a terra natal de Judá, e não a terra em sentido genérico ou o planeta.
- source_word: לֹא יִרְאֶה עוֹד
  choice: nunca mais verá
  rationale: Expressa de maneira idiomática a negação com עוֹד e comunica a finalidade irreversível do exílio.
