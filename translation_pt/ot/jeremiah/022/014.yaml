  text: הָ/אֹמֵ֗ר אֶבְנֶה לִּ/י֙ בֵּ֣ית מִדּ֔וֹת וַ/עֲלִיּ֖וֹת מְרֻוָּחִ֑ים וְ/קָ֤רַֽע ל/וֹ֙ חַלּוֹנָ֔/י וְ/סָפ֣וּן בָּ/אָ֔רֶז וּ/מָשׁ֖וֹחַ בַּ/שָּׁשַֽׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/014.yaml
  text: who says[a], ‘I will build myself a spacious house with roomy upper chambers,’ and cuts out windows for it, paneling it with cedar and painting it red.
translation:
  language: pt
  text: 'que diz: “Construirei para mim uma casa espaçosa, com amplos aposentos superiores”; abre nela janelas, reveste-a de cedro e a pinta de vermelho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pinta com vermelhão” — possivelmente cinábrio, um pigmento vermelho caro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: que diz
  rationale: O particípio com artigo caracteriza a pessoa denunciada e dá continuidade natural ao oráculo de juízo do versículo anterior.
- source_word: אֶבְנֶה לִּי
  choice: Construirei para mim
  rationale: O לִּי indica benefício ou interesse próprio; a formulação preserva essa ênfase sem soar artificial em português.
- source_word: בֵּית מִדּוֹת
  choice: uma casa espaçosa
  rationale: A expressão descreve uma casa de grandes dimensões; “espaçosa” comunica isso com clareza sem acrescentar a conotação específica de “mansão”.
- source_word: וַעֲלִיּוֹת מְרֻוָּחִים
  choice: com amplos aposentos superiores
  rationale: עֲלִיּוֹת designa cômodos no piso superior, e מְרֻוָּחִים indica amplitude ou espaço; “aposentos superiores” é claro e digno.
- source_word: וְקָרַע לוֹ חַלּוֹנָי
  choice: abre nela janelas
  rationale: קָרַע traz a imagem de rasgar ou recortar aberturas; no contexto arquitetônico, “abre janelas” expressa naturalmente a ação, e “nela” retoma a casa.
- source_word: וְסָפוּן בָּאָרֶז
  choice: reveste-a de cedro
  rationale: סָפוּן indica cobertura ou revestimento; a tradução mantém a imagem arquitetônica sem restringi-la indevidamente ao teto.
- source_word: וּמָשׁוֹחַ בַּשָּׁשַׁר
  choice: e a pinta de vermelho
  rationale: שָׁשַׁר é um pigmento vermelho, possivelmente vermelhão ou cinábrio. O texto principal usa uma expressão acessível e deixa a identificação mais específica para a nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém a continuidade sintática com Jeremias 22:13; por isso começa com “que diz”. O marcador da nota foi colocado junto de “vermelho”, termo ao qual a alternativa lexical se refere.
