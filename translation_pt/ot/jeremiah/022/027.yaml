source:
  edition: WLC
  text: וְ/עַל הָ/אָ֗רֶץ אֲשֶׁר הֵ֛ם מְנַשְּׂאִ֥ים אֶת נַפְשָׁ֖/ם לָ/שׁ֣וּב שָׁ֑ם שָׁ֖מָּ/ה לֹ֥א יָשֽׁוּבוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/027.yaml
  text: But to the land to which they lift up their soul to return[a], there they will not return.
translation:
  language: pt
  text: Mas, quanto à terra para a qual eles anseiam voltar[a], para lá não voltarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “erguem a sua alma para voltar”. A expressão hebraica indica desejo intenso ou anseio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הָאָרֶץ
  choice: Mas, quanto à terra
  rationale: A conjunção com a preposição introduz um tópico em contraste com o versículo anterior. A formulação preserva tanto a relação tópica quanto o valor adversativo.
- source_word: אֲשֶׁר
  choice: para a qual
  rationale: O relativo modifica “terra” e, com o verbo de movimento, indica o destino do retorno.
- source_word: הֵם
  choice: eles
  rationale: Mantém o pronome explícito do hebraico.
- source_word: מְנַשְּׂאִים אֶת־נַפְשָׁם
  choice: anseiam
  rationale: A expressão, literalmente “erguem a sua alma”, é um idiomatismo que comunica desejo intenso. “Anseiam” transmite esse sentido em português natural e digno.
- source_word: לָשׁוּב
  choice: voltar
  rationale: Verbo corrente que preserva a ideia de retorno e permite reproduzir a repetição lexical da oração final.
- source_word: שָׁם
  choice: incorporado em “para a qual ... voltar”
  rationale: O destino já está expresso pelo relativo preposicionado; acrescentar “ali” dentro da oração relativa seria redundante em português.
- source_word: שָׁמָּה
  choice: para lá
  rationale: Mantém de modo explícito e enfático a retomada do destino na oração principal.
- source_word: לֹא יָשׁוּבוּ
  choice: não voltarão
  rationale: Expressa diretamente a negação futura sem acrescentar a ideia mais forte de “nunca”, ausente do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução idiomática “anseiam” evita um decalque obscuro, enquanto a nota preserva a imagem hebraica. A repetição “voltar... voltarão” e a ênfase espacial “para lá” refletem a estrutura do original.
