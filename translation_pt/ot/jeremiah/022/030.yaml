source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כִּתְב֞וּ אֶת הָ/אִ֤ישׁ הַ/זֶּה֙ עֲרִירִ֔י גֶּ֖בֶר לֹא יִצְלַ֣ח בְּ/יָמָ֑י/ו כִּי֩ לֹ֨א יִצְלַ֜ח מִ/זַּרְע֗/וֹ אִ֚ישׁ יֹשֵׁב֙ עַל כִּסֵּ֣א דָוִ֔ד וּ/מֹשֵׁ֥ל ע֖וֹד בִּ/יהוּדָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/030.yaml
  text: 'Thus says Yahweh: Write this man down as childless[a], a man who will not prosper in his days; for none of his offspring will prosper[b] to sit on the throne of David and rule again in Judah.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Registrem este homem como alguém sem filhos[a], um homem que não terá sucesso em seus dias; pois nenhum dos seus descendentes terá sucesso[b] em se assentar no trono de Davi e voltar a governar em Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “registrem este homem como alguém sem herdeiro”. O hebraico diz literalmente “sem filhos”, mas a oração seguinte mostra que o foco é a sucessão dinástica: nenhum dos seus descendentes terá êxito no trono de Davi.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, nenhum descendente de Jeconias reinaria com sucesso como rei da linhagem de Davi em Judá.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título אֲדֹנָי e preservando a referência pactual do hebraico.
- source_word: כִּתְבוּ
  choice: Registrem
  rationale: O imperativo plural sugere uma anotação ou declaração oficial; “registrem” comunica essa força administrativa em português natural.
- source_word: עֲרִירִי
  choice: sem filhos
  rationale: Preserva o sentido lexical direto, enquanto o contexto e a nota esclarecem que a ênfase recai sobre a falta de sucessão dinástica bem-sucedida, não necessariamente sobre a inexistência de descendentes biológicos.
- source_word: לֹא יִצְלַח בְּיָמָיו
  choice: não terá sucesso em seus dias
  rationale: Mantém tanto o valor de צלח, ligado a êxito, quanto a expressão temporal hebraica, sem a tornar excessivamente arcaica.
- source_word: מִזַּרְעוֹ
  choice: dos seus descendentes
  rationale: Expressa com clareza o sentido coletivo de זרע neste contexto genealógico e dinástico.
- source_word: אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד
  choice: nenhum ... em se assentar no trono de Davi
  rationale: Representa אִישׁ com a construção negativa idiomática “nenhum” e liga o êxito à ocupação do trono, sem transformar a frase numa negação absoluta da existência de descendentes.
- source_word: וּמֹשֵׁל עוֹד בִּיהוּדָה
  choice: e voltar a governar em Judá
  rationale: “Voltar a” comunica aqui a ideia de ocorrência futura ou retomada expressa por עוֹד, no contexto do fim da continuidade régia em Judá.
theological_decisions:
- issue: A declaração de que Jeconias seria “sem filhos”, apesar de haver registro de descendentes
  choice: Manter “sem filhos” no texto e esclarecer em nota o enfoque sucessório e dinástico.
  alternative: Traduzir diretamente como “sem herdeiro”.
  rationale: 'O sentido lexical não deve ser apagado, mas a oração seguinte delimita a sentença: nenhum descendente seu teria êxito como rei davídico em Judá. A nota conserva tanto a forma forte da declaração quanto sua explicação contextual.'
- issue: Alcance da negação referente ao trono de Davi
  choice: Entender que nenhum descendente teria sucesso ao ocupar o trono de Davi e governar novamente em Judá.
  alternative: 'Entender como duas negações absolutas e independentes: nenhum descendente se assentaria no trono e nenhum governaria.'
  rationale: A sintaxe associa יִצְלַח ao homem proveniente de sua descendência caracterizado como alguém que se assenta no trono e governa. A tradução preserva a ligação entre sucesso e exercício da realeza, evitando ampliar a sentença além do que o hebraico afirma.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. “Assim diz” preserva a fórmula profética; “em seus dias” mantém o colorido semítico sem comprometer a clareza. O nome divino aparece como “Yahweh”, e as notas evitam resolver silenciosamente a tensão entre “sem filhos” e a existência conhecida de descendentes.
