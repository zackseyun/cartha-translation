base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/007.yaml
  text: And I will set apart destroyers against you[a], each with his weapons[c][b]; they will cut down the choicest of your cedars and cast them into the fire.
translation:
  language: pt
  text: Consagrarei contra você destruidores[a], cada um com seus instrumentos[b]; eles cortarão os melhores dos seus cedros e os lançarão ao fogo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “separarei destruidores contra você”. O hebraico emprega um verbo frequentemente traduzido por “consagrar” ou “santificar”; aqui, ele indica separar agentes para executar o juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cada um com suas armas”. A palavra hebraica pode designar objetos, utensílios, equipamentos, instrumentos ou armas; neste contexto, refere-se aos meios usados para destruir.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “sobre o fogo”. “Ao fogo” expressa de modo natural o sentido pretendido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: E separarei
  rationale: O verbo קדשׁ costuma expressar consagração ou santificação, mas aqui indica que Deus destina agentes a uma tarefa de juízo. “Separarei” preserva essa ressonância sem sugerir que os destruidores sejam moralmente santos.
- source_word: מַשְׁחִתִים
  choice: destruidores
  rationale: O particípio substantivado designa agentes que destroem; “destruidores” é direto e adequado ao contexto de juízo.
- source_word: עָלֶיךָ
  choice: contra você
  rationale: Com ação hostil, עַל assume naturalmente o sentido adversativo de “contra”.
- source_word: אִישׁ וְכֵלָיו
  choice: cada um com seus instrumentos
  rationale: אִישׁ tem valor distributivo após o plural. כְּלִי é amplo e pode indicar utensílios, equipamentos, instrumentos ou armas; “instrumentos” conserva essa amplitude e se ajusta tanto ao ataque quanto ao corte dos cedros.
- source_word: וְכָרְתוּ
  choice: eles cortarão
  rationale: Em referência a árvores ou madeira, כרת significa cortar ou derrubar. “Cortarão” é claro e natural.
- source_word: מִבְחַר אֲרָזֶיךָ
  choice: os melhores dos seus cedros
  rationale: מִבְחַר indica a parte escolhida ou de melhor qualidade. A formulação mantém a imagem concreta dos cedros.
- source_word: וְהִפִּילוּ עַל הָאֵשׁ
  choice: e os lançarão ao fogo
  rationale: A expressão hebraica é literalmente “e os farão cair sobre o fogo”. “Lançarão ao fogo” comunica naturalmente o resultado pretendido, sem perder a imagem.
theological_decisions:
- issue: Manutenção da linguagem de consagração em um oráculo de juízo
  choice: “separarei”
  alternative: “consagrarei” ou “designarei”
  rationale: “Separarei” conserva a ideia de Deus destinar agentes para executar o juízo e parte da tensão do vocabulário de santificação, sem atribuir santidade moral aos destruidores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação preserva a imagem concreta e a ressonância teológica do hebraico, evitando linguagem excessivamente técnica.
