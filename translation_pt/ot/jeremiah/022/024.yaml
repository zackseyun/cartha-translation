id: JER.22.24
reference: Jeremiah 22:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַי אָנִי֮ נְאֻם יְהוָה֒ כִּ֣י אִם יִהְיֶ֞ה כָּנְיָ֤הוּ בֶן יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה חוֹתָ֖ם עַל יַ֣ד יְמִינִ֑/י כִּ֥י מִ/שָּׁ֖ם אֶתְּקֶֽ/נְךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/024.yaml
  text: As I live[a], declares Yahweh, even if Coniah son of Jehoiakim, king of Judah, were a signet ring on my right hand[b], even from there I would tear you off.
translation:
  language: pt
  text: “Tão certo como eu vivo”, declara Yahweh, “ainda que Conias[a], filho de Jeoaquim, rei de Judá, fosse um anel de sinete[b] na minha mão direita, mesmo dali eu arrancaria você.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Conias; em outros lugares, o rei também é chamado Jeconias.'
    reason: alternative_reading
  - marker: b
    text: Ou “selo” ou “sinete”. A imagem é a de um selo real usado na mão como símbolo de autoridade e de grande valor.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Fórmula solene de juramento divino. Esta expressão é natural em português e preserva a força do autojuramento.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com dignidade a fórmula profética e mantém o nome divino expresso no hebraico.
- source_word: כִּי אִם
  choice: ainda que
  rationale: 'Introduz a hipótese concessiva enfática: mesmo admitindo a posição de máxima honra descrita, a sentença permaneceria.'
- source_word: כָּנְיָהוּ
  choice: Conias
  rationale: Translitera em forma portuguesa o nome específico empregado neste versículo, sem harmonizá-lo silenciosamente com Jeconias.
- source_word: חוֹתָם
  choice: anel de selar
  rationale: Comunica o objeto usado para imprimir um selo e preserva a imagem de autoridade, valor e proximidade associada à mão direita.
- source_word: עַל יַד יְמִינִי
  choice: na minha mão direita
  rationale: Forma idiomática e clara em português, preservando a posição de honra e proximidade da imagem.
- source_word: מִשָּׁם
  choice: até dali
  rationale: Retoma enfaticamente a posição hipotética na mão direita e corresponde ao sentido de remoção mesmo daquele lugar privilegiado.
- source_word: אֶתְּקֶנְךָּ
  choice: eu arrancaria você
  rationale: O verbo נתק indica remoção forte ou violenta; 'arrancaria' transmite adequadamente essa força em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
- issue: Forma do nome כָּנְיָהוּ
  choice: Conias
  alternative: Jeconias
  rationale: Mantém a forma nominal efetivamente presente no versículo; a nota identifica a outra forma bíblica sem harmonizar o texto principal.
- issue: Força da construção concessiva
  choice: ainda que ... fosse ... até dali eu arrancaria
  alternative: se ... fosse ... dali eu arrancaria
  rationale: 'A formulação preserva a tensão retórica: nem mesmo uma posição de máxima intimidade e autoridade impediria o juízo anunciado.'
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. As aspas distinguem a declaração divina; a colocação pronominal evita arcaísmo excessivo. Todos os marcadores de nota aparecem no texto principal.
