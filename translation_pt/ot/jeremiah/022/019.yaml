base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/019.yaml
  text: He will be buried with the burial of a donkey—dragged off and thrown out beyond the gates of Jerusalem[a][b].
translation:
  language: pt
  text: 'Ele será sepultado com o sepultamento de um jumento: será arrastado e lançado para além dos portões de Jerusalém.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele será sepultado com sepultura de jumento” ou “com um sepultamento como o de um jumento”.'
    reason: lexical_alternative
  - marker: b
    text: A imagem descreve o descarte desonroso do corpo fora da cidade, em vez de um sepultamento digno.
    reason: cultural_note
lexical_decisions:
- source_word: קְבוּרַת חֲמוֹר
  choice: como se sepulta um jumento
  rationale: O construto hebraico significa literalmente “sepultura de jumento”. A formulação comparativa é natural em português e comunica o modo indigno de disposição do corpo sem transformar a imagem em uma afirmação excessivamente literal.
- source_word: יִקָּבֵר
  choice: será sepultado
  rationale: O nifal imperfeito de קבר tem sentido passivo; o futuro preserva a força profética no contexto.
- source_word: סָחוֹב
  choice: será arrastado
  rationale: O infinitivo absoluto retrata a ação de arrastar o corpo e sua indignidade. A forma verbal explícita produz uma sequência clara e vigorosa em português.
- source_word: וְהַשְׁלֵךְ
  choice: e lançado
  rationale: A raiz שלך no hifil expressa lançar ou jogar. “Lançado” mantém a violência da imagem e combina naturalmente com a construção passiva anterior.
- source_word: מֵהָלְאָה לְשַׁעֲרֵי
  choice: para além dos portões
  rationale: A expressão indica movimento e descarte do lado de fora, além dos portões da cidade. “Para além” preserva a direção de מֵהָלְאָה.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma tradicional e corrente do nome em português.
theological_decisions:
- issue: Natureza da comparação com a sepultura de um jumento
  choice: Uma disposição desonrosa do corpo, comparável à dada a um jumento
  alternative: Uma referência estritamente literal ao tipo de sepultura, sem destaque para a desonra
  rationale: A sequência “sepultura de jumento”, “arrastado” e “lançado para além dos portões” indica privação de sepultamento humano honroso. A tradução mantém a imagem, enquanto a nota explicita sua implicação cultural sem acrescentar uma doutrina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Jumento” é corrente e preserva a imagem concreta; “portões” comunica naturalmente as entradas fortificadas da cidade. Os dois-pontos apresentam as ações seguintes como explicação do modo desse sepultamento.
