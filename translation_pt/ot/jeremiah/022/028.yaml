  text: הַ/עֶ֨צֶב נִבְזֶ֜ה נָפ֗וּץ הָ/אִ֤ישׁ הַ/זֶּה֙ כָּנְיָ֔הוּ אִ֨ם כְּלִ֔י אֵ֥ין חֵ֖פֶץ בּ֑/וֹ מַדּ֤וּעַ הֽוּטֲלוּ֙ ה֣וּא וְ/זַרְע֔/וֹ וְ/הֻ֨שְׁלְכ֔וּ עַל הָ/אָ֖רֶץ אֲשֶׁ֥ר לֹא יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/028.yaml
  text: Is this man Coniah a despised[a], broken vessel[b], or a vessel in which there is no delight? Why have he and his offspring been hurled out and cast into a land that they did not know?
translation:
  language: pt
  text: Será que este homem, Conias[b], é um objeto desprezado e despedaçado[a], ou um utensílio que ninguém deseja? Por que ele e a sua descendência foram arremessados e lançados para uma terra que não conheciam?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma imagem desprezada e despedaçada” ou “um ídolo desprezado e despedaçado”. A palavra hebraica pode indicar um objeto moldado, inclusive uma imagem ou um ídolo; o contexto também sugere algo quebrável, semelhante a um utensílio.'
    reason: lexical_alternative
  - marker: b
    text: Conias é a forma abreviada do nome do rei também chamado Jeconias (ver Jr 24:1; 27:20).
    reason: cross_reference
lexical_decisions:
- source_word: הָעֶצֶב
  choice: objeto
  rationale: O substantivo pode designar algo moldado ou fabricado, inclusive uma imagem ou ídolo. “Objeto” preserva essa amplitude lexical sem impor exclusivamente a imagem de um vaso, embora o contexto seguinte sugira algo quebrável e descartado.
- source_word: נִבְזֶה נָפוּץ
  choice: desprezado e despedaçado
  rationale: “Desprezado” conserva a ideia de rejeição e vergonha; “despedaçado” expressa a ruptura física sugerida pela metáfora do objeto ou utensílio.
- source_word: כָּנְיָהוּ
  choice: Conias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico curto presente no versículo, distinto da forma mais longa Jeconias.
- source_word: אִם
  choice: ou
  rationale: No contexto da pergunta retórica, introduz uma comparação alternativa.
- source_word: כְּלִי אֵין חֵפֶץ בּוֹ
  choice: um utensílio que ninguém deseja
  rationale: Expressa em português natural a ausência de agrado ou desejo pelo objeto, sem acrescentar a ideia de falta de valor intrínseco.
- source_word: הוּטֲלוּ ... וְהֻשְׁלְכוּ
  choice: foram arremessados e lançados
  rationale: Mantém os dois verbos passivos e a força da expulsão violenta, evitando eliminar a repetição enfática do hebraico.
- source_word: זַרְעוֹ
  choice: sua descendência
  rationale: No contexto dinástico, indica os descendentes de Conias, não semente em sentido literal.
- source_word: עַל הָאָרֶץ אֲשֶׁר לֹא יָדָעוּ
  choice: numa terra que não conheciam
  rationale: A preposição é vertida de modo idiomático como destino do exílio; o plural “conheciam” acompanha Conias e sua descendência, sujeitos dos verbos.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A pergunta retórica foi preservada. Empregou-se “objeto” para manter a ambiguidade de הָעֶצֶב, explicitada em nota, e “utensílio” para כְּלִי. Os dois passivos de expulsão foram mantidos. Todos os marcadores de nota aparecem no texto principal.
