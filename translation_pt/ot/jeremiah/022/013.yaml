source:
  edition: WLC
  text: ה֣וֹי בֹּנֶ֤ה בֵית/וֹ֙ בְּֽ/לֹא צֶ֔דֶק וַ/עֲלִיּוֹתָ֖י/ו בְּ/לֹ֣א מִשְׁפָּ֑ט בְּ/רֵעֵ֨/הוּ֙ יַעֲבֹ֣ד חִנָּ֔ם וּ/פֹעֲל֖/וֹ לֹ֥א יִתֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/013.yaml
  text: Woe to him who builds his house without righteousness[a], and his upper rooms without justice[c][b], who makes his neighbor work for nothing and does not give him his wages.
translation:
  language: pt
  text: Ai daquele que constrói a sua casa sem retidão[a] e os seus aposentos superiores sem justiça[b], que faz o seu próximo trabalhar de graça e não lhe paga o salário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem justiça”. Os termos hebraicos traduzidos por “retidão” e “justiça” são próximos e podem ter sentidos sobrepostos.
    reason: lexical_alternative
  - marker: b
    text: “Aposentos superiores” também pode ser traduzido por “câmaras superiores” ou “andares superiores”; refere-se à parte alta de uma construção ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai daquele
  rationale: Introduz uma denúncia profética. A fórmula é natural em português e preserva a força de condenação do hebraico.
- source_word: בֹּנֶה בֵיתוֹ
  choice: que constrói a sua casa
  rationale: O particípio descreve aquele que se dedica à construção; “casa” mantém o sentido básico, sem impor “palácio”, embora o contexto real permita essa conotação.
- source_word: בְּלֹא צֶדֶק
  choice: sem retidão
  rationale: צֶדֶק expressa conformidade com o que é correto. “Retidão” preserva sua distinção relativa em relação a מִשְׁפָּט, traduzido como “justiça” no membro paralelo.
- source_word: וַעֲלִיּוֹתָיו
  choice: e os seus aposentos superiores
  rationale: Designa cômodos situados na parte alta de uma construção ampla. A expressão é clara e evita especificar indevidamente “andares”.
- source_word: בְּלֹא מִשְׁפָּט
  choice: sem justiça
  rationale: No contexto da exploração trabalhista, מִשְׁפָּט indica a justiça ou o direito devido à pessoa.
- source_word: בְּרֵעֵהוּ יַעֲבֹד חִנָּם
  choice: que faz o seu próximo trabalhar de graça
  rationale: A construção indica que alguém se vale do trabalho de outra pessoa sem compensá-la. “Próximo” preserva a relação social expressa por רֵעַ.
- source_word: וּפֹעֲלוֹ לֹא יִתֶּן לוֹ
  choice: e não lhe paga o salário
  rationale: Embora פֹּעַל possa significar “trabalho”, neste contexto denota a remuneração devida. “Paga” torna natural em português a ação expressa literalmente por “dar”.
theological_decisions:
- issue: Tradução do par ético צֶדֶק / מִשְׁפָּט
  choice: sem retidão ... sem justiça
  alternative: sem justiça ... sem direito; injustamente ... sem equidade
  rationale: A escolha mantém dois termos relacionados, mas não idênticos, preservando a textura ética do paralelismo hebraico sem fundi-los nem atribuir-lhes uma distinção doutrinária rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom profético de denúncia e explicita naturalmente a exploração salarial, sem acrescentar conteúdo denominacional.
