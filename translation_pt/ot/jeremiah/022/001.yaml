  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה רֵ֖ד בֵּֽית מֶ֣לֶךְ יְהוּדָ֑ה וְ/דִבַּרְתָּ֣ שָׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/001.yaml
  text: 'Thus says Yahweh: Go down to the house of the king of Judah[c][b][a], and speak there this word:'
translation:
  language: pt
  text: 'Assim diz Yahweh: Desça à casa do rei de Judá[a] e diga ali esta palavra[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “à casa do rei de Judá”; provavelmente se refere ao palácio real.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “esta mensagem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Reproduz com naturalidade e dignidade a fórmula profética de mensageiro, mantendo o nome divino expresso no hebraico.
- source_word: רֵד
  choice: Desça
  rationale: Imperativo singular de ירד; preserva o sentido direcional sem acrescentar uma origem não declarada.
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: à casa do rei de Judá
  rationale: Mantém a formulação concreta do hebraico; no contexto, a expressão provavelmente designa o palácio real.
- source_word: וְדִבַּרְתָּ שָׁם
  choice: e diga ali
  rationale: O perfeito consecutivo continua a ordem iniciada pelo imperativo. 'Diga' é corrente em português e adequado para introduzir o conteúdo que segue.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: Preserva o singular דבר e o idioma profético; 'mensagem' é uma alternativa contextual possível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama; a transliteração preserva o nome próprio e sua força pactual, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A fórmula profética foi mantida em cadência formal, e os dois imperativos dirigidos a uma só pessoa foram traduzidos com tratamento de terceira pessoa ('Desça', 'diga'). As aspas abrem a fala divina, e os dois-pontos finais anunciam as palavras do versículo seguinte.
