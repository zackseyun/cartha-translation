  text: הֲ/תִֽמְלֹ֔ךְ כִּ֥י אַתָּ֖ה מְתַחֲרֶ֣ה בָ/אָ֑רֶז אָבִ֜י/ךָ הֲ/ל֧וֹא אָכַ֣ל וְ/שָׁתָ֗ה וְ/עָשָׂ֤ה מִשְׁפָּט֙ וּ/צְדָקָ֔ה אָ֖ז ט֥וֹב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/015.yaml
  text: Do you reign because you compete in cedar? Did not your father eat and drink and do justice and righteousness? Then it was well with him[a][b].
translation:
  language: pt
  text: Será que você reina porque rivaliza com construções de cedro?[a] Seu pai não comeu e bebeu e praticou a justiça e a retidão?[b] Então tudo lhe ia bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rivaliza pelo cedro” ou “se empenha pelo cedro”. A expressão hebraica é rara e provavelmente se refere à rivalidade entre reis manifestada em construções revestidas de cedro.
    reason: lexical_alternative
  - marker: b
    text: “Justiça e retidão” também podem ser traduzidas como “justiça e o que é certo”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתִמְלֹךְ
  choice: Será que você reina
  rationale: O Qal imperfeito interrogativo questiona retoricamente o fundamento ou a legitimidade do reinado; esta formulação preserva a força desafiadora em português natural.
- source_word: כִּי
  choice: porque
  rationale: Introduz o suposto fundamento do reinado e mantém explícita a lógica da repreensão.
- source_word: מְתַחֲרֶה בָאָרֶז
  choice: rivaliza em cedro
  rationale: A expressão hebraica é rara e provavelmente alude à rivalidade e ostentação régias por meio de construções revestidas de cedro. A tradução conserva sua estranheza e ambiguidade, esclarecidas em nota.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Referência filial direta, provavelmente a Josias no contexto, sem inserir o nome no texto.
- source_word: הֲלוֹא
  choice: não
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa.
- source_word: אָכַל וְשָׁתָה
  choice: comeu e bebeu
  rationale: Mantém a expressão comum referente à vida e ao desfrute ordinários, sem sugerir indevidamente excessos.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: praticou a justiça e a retidão
  rationale: “Praticou” é natural para עשה neste contexto; “justiça e retidão” preserva os dois conceitos da fórmula profética sem fundi-los.
- source_word: אָז טוֹב לוֹ
  choice: Então tudo lhe ia bem
  rationale: Expressa o sentido resultativo de אָז e o estado favorável indicado por טוֹב לוֹ em português corrente.
theological_decisions:
- issue: Tradução de צְדָקָה no par מִשְׁפָּט וּצְדָקָה
  choice: retidão
  alternative: o que é certo
  rationale: “Retidão” preserva a dimensão moral e pactual de צְדָקָה e a distingue de מִשְׁפָּט, traduzido como “justiça”, sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A rara expressão sobre o cedro foi mantida de modo relativamente formal no texto e explicada em nota; o restante emprega sintaxe natural e direta.
