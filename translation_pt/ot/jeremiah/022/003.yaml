id: JER.22.3
reference: Jeremiah 22:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲשׂ֤וּ מִשְׁפָּט֙ וּ/צְדָקָ֔ה וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עָשׁ֑וֹק וְ/גֵר֩ יָת֨וֹם וְ/אַלְמָנָ֤ה אַל תֹּנוּ֙ אַל תַּחְמֹ֔סוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֥וֹם הַ/זֶּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
translation:
  language: pt
  text: 'Assim diz Yahweh: Pratiquem a justiça e a retidão[a] e livrem quem foi roubado das mãos do opressor. Não oprimam nem tratem com violência[c] o estrangeiro residente[b], o órfão e a viúva; não derramem sangue inocente neste lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Façam o que é justo e correto”. O hebraico emprega dois termos, “justiça” e “retidão”, que juntos abrangem a conduta pública e moral fiel.'
    reason: lexical_alternative
  - marker: b
    text: “Estrangeiro residente” traduz um termo que designa o não nativo estabelecido entre os israelitas, geralmente em situação social vulnerável; tradicionalmente, “forasteiro” ou “peregrino”.
    reason: cultural_note
  - marker: c
    text: O verbo hebraico também pode significar “cometam injustiça contra” ou “maltratem violentamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa diretamente o nome divino יהוה como Yahweh.
- source_word: עֲשׂוּ מִשְׁפָּט וּצְדָקָה
  choice: Pratiquem a justiça e a retidão
  rationale: 'O imperativo plural pede conduta contínua e concreta. Mantêm-se distintos os dois termos hebraicos coordenados: justiça no âmbito judicial e social, e retidão moral.'
- source_word: וְהַצִּילוּ גָזוּל
  choice: livrem quem foi roubado
  rationale: O hifil de נצל exige intervenção ativa para libertar a vítima. A expressão 'quem foi roubado' é clara em português e mantém o foco na pessoa despojada.
- source_word: מִיַּד עָשׁוֹק
  choice: das mãos do opressor
  rationale: A imagem hebraica da mão como poder ou domínio é natural em português no plural idiomático, enquanto 'opressor' comunica a exploração social.
- source_word: גֵר
  choice: estrangeiro residente
  rationale: Designa um não israelita estabelecido entre o povo e socialmente vulnerável; a expressão evita tanto o arcaísmo de 'forasteiro' quanto a imprecisão de 'estrangeiro' isoladamente.
- source_word: יָתוֹם
  choice: órfão
  rationale: É a designação portuguesa corrente para a pessoa privada da proteção paterna, dentro da tríade bíblica de grupos vulneráveis.
- source_word: אַל תֹּנוּ אַל תַּחְמֹסוּ
  choice: Não oprimam nem tratem com violência
  rationale: 'Os dois verbos sobrepostos, mas não idênticos, são preservados: o primeiro indica exploração ou maus-tratos; o segundo, violência ou injustiça violenta.'
- source_word: וְדָם נָקִי אַל תִּשְׁפְּכוּ
  choice: não derramem sangue inocente
  rationale: Mantém a expressão concreta e tradicional do hebraico para a morte injusta.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. 'Yahweh' o representa de modo transparente, sem substituí-lo por um título.
- issue: Relação entre מִשְׁפָּט e צְדָקָה
  choice: justiça e retidão
  alternative: o que é justo e direito
  rationale: A tradução preserva os dois substantivos e a tensão entre justiça pública e integridade moral, sem fundi-los em uma única ideia.
- issue: Alcance dos dois verbos negativos sobre os grupos vulneráveis
  choice: Não oprimam nem tratem com violência o estrangeiro residente, o órfão e a viúva
  alternative: Não oprimam o estrangeiro residente, o órfão ou a viúva, e não pratiquem violência
  rationale: A anteposição dos três objetos no hebraico permite que ambos os verbos sejam entendidos como referentes a todos eles. Esta formulação explicita essa leitura natural sem eliminar a sobreposição retórica dos verbos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregam-se imperativos no plural para refletir o destinatário coletivo. A pontuação organiza as ordens sem apagar o paralelismo e a intensidade do hebraico.
