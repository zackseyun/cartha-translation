  text: וְ/עָֽבְרוּ֙ גּוֹיִ֣ם רַבִּ֔ים עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אָֽמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/עִ֥יר הַ/גְּדוֹלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
translation:
  language: pt
  text: 'E muitas nações passarão junto desta cidade[a], e cada homem dirá ao seu companheiro[b]: “Por que Yahweh agiu assim com esta grande cidade?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passarão por esta cidade” ou “passarão ao lado desta cidade”. A construção hebraica pode indicar passagem por um lugar ou junto dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cada homem ao seu companheiro”, expressão distributiva que descreve homens falando uns com os outros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ
  choice: passarão
  rationale: O perfeito com waw, no contexto do anúncio profético, expressa naturalmente uma ação futura. A forma verbal simples preserva o movimento descrito no hebraico.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: Mantém o sentido coletivo e internacional de גּוֹיִם no contexto de juízo, sem introduzir a oposição posterior sugerida por “gentios”.
- source_word: עַל הָעִיר הַזֹּאת
  choice: por esta cidade
  rationale: Depois de עבר, עַל pode indicar movimento junto a um lugar ou passando por ele. “Por esta cidade” é corrente em português e conserva alguma amplitude espacial; a nota registra alternativas mais explícitas.
- source_word: וְאָמְרוּ
  choice: e ... dirá
  rationale: O plural hebraico é seguido pela expressão distributiva singular אִישׁ אֶל־רֵעֵהוּ; a formulação portuguesa “cada um dirá” comunica essa distribuição sem transformar o verbo de fala em “perguntar”.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: cada um dirá ao seu próximo
  rationale: Representa a expressão distributiva hebraica, literalmente masculina singular, de modo compreensível e digno em português.
- source_word: עַל מֶה
  choice: Por que
  rationale: É a forma interrogativa causal mais natural em português e transmite diretamente a busca pela razão do ocorrido.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh fez isso
  rationale: “Fez isso” comunica naturalmente כָּכָה no português atual, mantendo a ação divina explícita sem tornar a frase artificial com “assim”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לָעִיר הַגְּדוֹלָה הַזֹּאת
  choice: com esta grande cidade
  rationale: “Fazer isso com” é idiomático em português para uma ação que recai sobre a cidade. “Grande” pode abranger tanto dimensão quanto importância, preservando a amplitude de גָּדוֹלָה.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Expressão distributiva masculina אִישׁ אֶל רֵעֵהוּ
  choice: cada um dirá ao seu próximo
  alternative: dirão uns aos outros
  rationale: A opção escolhida conserva a forma distributiva singular e o gênero gramatical do hebraico, enquanto a alternativa seria mais fluida, mas menos formalmente correspondente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe conserva a sequência profética e a pergunta solene, mas evita arcaísmos como “destarte” ou “por que razão fez assim”.
