  text: ישבתי בַּ/לְּבָנ֔וֹן מקננתי בָּֽ/אֲרָזִ֑ים מַה נֵּחַנְתְּ֙ בְּ/בֹא לָ֣/ךְ חֲבָלִ֔ים חִ֖יל כַּ/יֹּלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/023.yaml
  text: You who dwell in Lebanon[a], who nest in the cedars, how you will groan when pangs come upon you[b], pain like that of a woman giving birth.
translation:
  language: pt
  text: Você que habita no Líbano[a], que faz seu ninho entre os cedros, como gemerá[b] quando lhe vierem as dores, angústia como a da mulher que dá à luz!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Líbano e os cedros provavelmente evocam o palácio real construído com cedro do Líbano, retratando os governantes de Judá instalados em elevada segurança.
    reason: cultural_note
  - marker: b
    text: 'Ou: “como será objeto de compaixão”. O verbo hebraico traduzido por “gemerá” é difícil, e alguns o entendem no sentido de receber compaixão, e não de soltar gemidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישבתי
  choice: você que habita
  rationale: Embora a forma consonantal possa parecer ambígua isoladamente, o contexto e as formas femininas singulares seguintes mostram que se trata de uma destinatária personificada. Aqui, ישב expressa habitação, não o ato literal de sentar-se.
- source_word: בַּלְּבָנוֹן
  choice: no Líbano
  rationale: Mantém a expressão locativa direta e deixa aberta sua função imagética, provavelmente ligada ao palácio real revestido de cedro do Líbano e à ideia de segurança elevada.
- source_word: מקננתי
  choice: que faz seu ninho
  rationale: Preserva a metáfora vívida de קנן, que retrata a destinatária como instalada com segurança em lugar elevado.
- source_word: בָּאֲרָזִים
  choice: entre os cedros
  rationale: Conserva o plural e a imagem dos cedros sem decidir se a referência é a árvores, a estruturas de madeira de cedro ou a ambas.
- source_word: מַה
  choice: como
  rationale: Tem valor exclamativo e intensifica o verbo seguinte, em vez de introduzir uma pergunta.
- source_word: נֵּחַנְתְּ
  choice: gemerá
  rationale: O verbo é lexicalmente difícil. No contexto das dores de parto, o sentido de gemer ou lamentar-se é o mais natural, mas a alternativa passiva, 'será digna de compaixão', permanece possível e é registrada em nota.
- source_word: בְּבֹא לָךְ
  choice: quando lhe vierem
  rationale: A construção com infinitivo marca a circunstância temporal e a chegada das dores à destinatária.
- source_word: חֲבָלִים
  choice: as dores
  rationale: No contexto da comparação com o parto, designa dores ou contrações, e não 'cordas'.
- source_word: חִיל
  choice: angústia
  rationale: Expressa sofrimento intenso, tremor ou contorção; 'angústia' evita uma repetição pouco expressiva de 'dores' e mantém a intensidade.
- source_word: כַּיֹּלֵדָה
  choice: como a da mulher que dá à luz
  rationale: Torna explícita em português a comparação da angústia com a de uma parturiente, sem acrescentar interpretação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa é expressa por “você”, natural no português brasileiro, enquanto as imagens poéticas do ninho, dos cedros e das dores de parto são preservadas. A exclamação final comunica o valor exclamativo de מַה. As notas foram posicionadas junto aos elementos que de fato explicam.
