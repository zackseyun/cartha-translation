source:
  edition: WLC
  text: כִּ֣י אֵ֤ין עֵינֶ֨י/ךָ֙ וְ/לִבְּ/ךָ֔ כִּ֖י אִם עַל בִּצְעֶ֑/ךָ וְ/עַ֤ל דַּֽם הַ/נָּקִי֙ לִ/שְׁפּ֔וֹךְ וְ/עַל הָ/עֹ֥שֶׁק וְ/עַל הַ/מְּרוּצָ֖ה לַ/עֲשֽׂוֹת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/017.yaml
  text: But your eyes and your heart are set on nothing except your dishonest gain[a], on shedding innocent blood, and on practicing oppression and extortion.
translation:
  language: pt
  text: Mas os seus olhos e o seu coração não estão voltados para nada além do seu lucro desonesto, para derramar sangue inocente e para praticar opressão e violência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “opressão e extorsão”. O termo hebraico traduzido como “violência” é raro e pode indicar, de modo mais específico, extorsão ou ação cruel e impiedosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... כִּי אִם
  choice: não estão voltados para nada além de
  rationale: A construção expressa exclusividade. Esta formulação natural em português preserva a ideia de que a atenção e a intenção do rei se dirigem unicamente a esses males.
- source_word: עֵינֶיךָ
  choice: os seus olhos
  rationale: Mantém a metáfora hebraica de atenção, desejo ou objetivo.
- source_word: לִבְּךָ
  choice: o seu coração
  rationale: Preserva o sentido hebraico amplo do centro da vontade, do pensamento e das intenções, não apenas das emoções.
- source_word: בִּצְעֶךָ
  choice: seu lucro desonesto
  rationale: O substantivo costuma indicar ganho obtido de maneira injusta. A expressão conserva tanto a noção de proveito material quanto sua corrupção moral.
- source_word: דַּם הַנָּקִי
  choice: sangue inocente
  rationale: Expressão bíblica corrente que designa o sangue de quem não é culpado.
- source_word: לִשְׁפּוֹךְ
  choice: para derramar
  rationale: Reproduz naturalmente o infinitivo hebraico e a expressão consagrada para causar a morte de inocentes.
- source_word: הָעֹשֶׁק
  choice: opressão
  rationale: Abrange exploração, fraude e abuso social, sendo apropriado ao uso profético do termo.
- source_word: הַמְּרוּצָה
  choice: violência
  rationale: O substantivo é raro e incerto, mas neste contexto parece designar ação violenta ou impiedosa. A tradução ampla evita limitar indevidamente o sentido a extorsão.
- source_word: לַעֲשׂוֹת
  choice: para praticar
  rationale: Expressa de modo natural a realização habitual das ações mencionadas.
theological_decisions:
- issue: Relação entre olhos, coração e conduta injusta
  choice: Conservar literalmente “olhos” e “coração” e explicitar apenas a orientação por meio de “estão voltados”
  alternative: Substituir a metáfora por “você só se preocupa”
  rationale: A redação conserva a antropologia e a força poética do hebraico sem reduzir o coração à emoção nem resolver a metáfora interpretativamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “seus” evita o uso regionalmente marcado de “teus”; a repetição de “para” preserva a estrutura enfática da lista hebraica.
