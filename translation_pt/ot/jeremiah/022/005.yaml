  text: וְ/אִם֙ לֹ֣א תִשְׁמְע֔וּ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה בִּ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּי לְ/חָרְבָּ֥ה יִֽהְיֶ֖ה הַ/בַּ֥יִת הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/005.yaml
  text: But if you do not listen to these words[a], I swear by myself, declares Yahweh, that this house will become a ruin.
translation:
  language: pt
  text: Mas, se vocês não ouvirem estas palavras, juro por mim mesmo — declara Yahweh — que esta casa[a] se tornará uma ruína.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este palácio”. Neste contexto, “esta casa” provavelmente se refere à casa real, isto é, ao palácio do rei de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com as promessas e advertências anteriores; a formulação é natural em português e preserva a força adversativa contextual.
- source_word: תִשְׁמְעוּ
  choice: vocês não ouvirem
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. “Ouvirem” conserva o sentido auditivo e, neste contexto profético, sugere acolher e atender às palavras sem explicitar demais a ideia de obediência.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: Tradução direta e adequada ao contexto de discurso profético.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: juro por mim mesmo
  rationale: A fórmula de juramento com a preposição e o sufixo de primeira pessoa significa idiomaticamente jurar por si mesmo. O presente comunica bem a força performativa do perfeito hebraico.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Preserva a fórmula profética solene e distingue a declaração parentética do conteúdo do juramento.
- source_word: לְחָרְבָּה
  choice: uma ruína
  rationale: O substantivo indica devastação ou desolação; “uma ruína” é claro e natural como estado resultante.
- source_word: יִהְיֶה הַבַּיִת הַזֶּה
  choice: esta casa se tornará
  rationale: Embora היה seja literalmente “será”, “se tornará uma ruína” expressa naturalmente em português o resultado anunciado. Mantém-se “casa”, o termo do hebraico, com esclarecimento contextual em nota.
theological_decisions:
- issue: Forma temporal da fórmula divina de juramento
  choice: juro por mim mesmo
  alternative: jurei por mim mesmo
  rationale: O perfeito hebraico pode ter função performativa no juramento pronunciado diretamente. O presente preserva a solenidade e a imediaticidade sem mudar o sentido.
- issue: Referente de “esta casa”
  choice: esta casa
  alternative: este palácio
  rationale: O contexto trata da casa do rei de Judá, podendo indicar o palácio real. Contudo, o hebraico emprega “casa”; por isso, o texto conserva a ambiguidade lexical e a nota informa o provável referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário plural do verbo hebraico. A construção parentética “declaração de Yahweh” mantém o tom formal da fórmula profética.
