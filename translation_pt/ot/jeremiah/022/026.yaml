  text: וְ/הֵֽטַלְתִּ֣י אֹתְ/ךָ֗ וְ/אֶֽת אִמְּ/ךָ֙ אֲשֶׁ֣ר יְלָדַ֔תְ/ךָ עַ֚ל הָ/אָ֣רֶץ אַחֶ֔רֶת אֲשֶׁ֥ר לֹֽא יֻלַּדְתֶּ֖ם שָׁ֑ם וְ/שָׁ֖ם תָּמֽוּתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/026.yaml
  text: And I will hurl you and your mother who gave birth to you into another land[a], where you were not born, and there you will die.
translation:
  language: pt
  text: Eu lançarei você e sua mãe, que lhe deu à luz, para outra terra[a], onde vocês não nasceram; e ali vocês morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do singular («você») para verbos no plural («vocês não nasceram», «vocês morrerão»), dirigindo-se ao rei e à sua mãe em conjunto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: Eu lançarei
  rationale: O hifil comunica a ação vigorosa de lançar ou arrojar. “Lançarei” preserva o tom de juízo e mantém linguagem natural e digna.
- source_word: אֹתְךָ וְאֶת אִמְּךָ
  choice: você e sua mãe
  rationale: Traduz diretamente os dois objetos coordenados. “Você” é singular aqui, mas os verbos posteriores passam ao plural por incluírem o rei e sua mãe.
- source_word: אֲשֶׁר יְלָדַתְךָ
  choice: que deu à luz você
  rationale: A oração relativa modifica “sua mãe”. A formulação é clara e atual, além de representar explicitamente o sentido do verbo hebraico.
- source_word: עַל הָאָרֶץ אַחֶרֶת
  choice: em outra terra
  rationale: Com um verbo de lançamento e no contexto do exílio, a preposição indica deslocamento forçado para outra terra. “Terra” preserva a ressonância territorial do hebraico.
- source_word: אֲשֶׁר לֹא יֻלַּדְתֶּם שָׁם
  choice: onde vocês não nasceram
  rationale: O verbo passivo está no plural e abrange conjuntamente o rei e sua mãe. “Onde” evita reproduzir de modo artificial o advérbio locativo hebraico.
- source_word: וְשָׁם תָּמֽוּתוּ
  choice: e ali vocês morrerão
  rationale: O verbo permanece no plural, referindo-se aos dois destinatários, e o futuro comunica naturalmente a certeza do anúncio profético.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A mudança gramatical do singular para o plural foi preservada no texto e explicada em nota.
