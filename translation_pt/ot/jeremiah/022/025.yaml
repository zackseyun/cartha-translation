  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ךָ בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשֶׁ֔/ךָ וּ/בְ/יַ֛ד אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶ֑ם וּ/בְ/יַ֛ד נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַ֥ד הַ/כַּשְׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/025.yaml
  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
translation:
  language: pt
  text: Eu o entregarei nas mãos dos que procuram tirar a sua vida, nas mãos daqueles que você teme, nas mãos de Nabucodonosor[a], rei da Babilônia, e nas mãos dos caldeus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Nabucodrezar”, forma que reflete mais de perto o nome hebraico neste versículo.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “os caldeus” também pode ser traduzido como “os babilônios”, pois o termo pode designar de modo mais amplo as forças da Babilônia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: Eu o entregarei
  rationale: Neste contexto, נתן seguido de בְּיַד expressa a entrega de alguém ao poder de outros. “Entregarei” comunica naturalmente essa transferência de controle.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Preserva a imagem concreta do hebraico e sua repetição enfática ao longo do versículo.
- source_word: מְבַקְשֵׁי נַפְשֶׁךָ
  choice: os que procuram tirar a sua vida
  rationale: נפש aqui significa a vida da pessoa ameaçada, não uma alma imaterial. A formulação explicita em português a intenção hostil sem perder o sentido da expressão hebraica.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: aqueles que você teme
  rationale: יגור denota medo ou pavor. Esta redação é clara e natural, mantendo sem intensificação indevida o sentido da oração relativa.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português; a forma que reproduz mais de perto a grafia hebraica deste versículo é registrada em nota.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e natural da cadeia construta hebraica.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação étnico-histórica do texto hebraico, sem excluir o referente contextual às forças babilônicas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “nas mãos” conserva a estrutura retórica e a imagem do hebraico. Os marcadores das notas foram posicionados junto aos termos a que efetivamente se referem.
