  text: עֲלִ֤י הַ/לְּבָנוֹן֙ וּֽ/צְעָ֔קִי וּ/בַ/בָּשָׁ֖ן תְּנִ֣י קוֹלֵ֑/ךְ וְ/צַֽעֲקִי֙ מֵֽ/עֲבָרִ֔ים כִּ֥י נִשְׁבְּר֖וּ כָּל מְאַהֲבָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/020.yaml
  text: Go up to Lebanon and cry out[a]; raise your voice in Bashan; cry out from Abarim[b], for all your lovers are shattered.
translation:
  language: pt
  text: Suba ao Líbano e clame; erga a voz em Basã; clame desde Abarim[a], pois todos os seus amantes foram despedaçados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde as passagens” ou “desde as regiões do outro lado”. Aqui, provavelmente, Abarim é um nome geográfico, em paralelo com Líbano e Basã.
    reason: lexical_alternative
  - marker: b
    text: “Seus amantes” é uma metáfora profética que, neste contexto, provavelmente se refere aos aliados ou parceiros políticos estrangeiros de Judá/Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  choice: Suba
  rationale: O imperativo qal feminino singular convoca a destinatária personificada a subir; “Suba” preserva a direção e é natural em português.
- source_word: הַלְּבָנוֹן
  choice: ao Líbano
  rationale: Nome geográfico convencional em português; a preposição indica o movimento em direção ao local elevado.
- source_word: וּצְעָקִי / וְצַעֲקִי
  choice: e clame / clame
  rationale: A repetição de “clame” conserva o paralelismo e a urgência de צעק sem restringir o grito a uma emoção específica.
- source_word: וּבַבָּשָׁן
  choice: em Basã
  rationale: Forma portuguesa tradicional e reconhecível do topônimo, com valor locativo direto.
- source_word: תְּנִי קוֹלֵךְ
  choice: erga a voz
  rationale: Equivalente idiomático atual da expressão hebraica literalmente “dê a sua voz”, mantendo a ideia de fazê-la soar com força.
- source_word: מֵעֲבָרִים
  choice: desde Abarim
  rationale: No paralelismo com Líbano e Basã, a expressão provavelmente designa a região montanhosa de Abarim. “Desde” comunica o ponto de onde parte o clamor; a possível leitura comum do termo fica registrada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural a razão do clamor, preservando a relação explicativa.
- source_word: נִשְׁבְּרוּ
  choice: foram despedaçados
  rationale: O nifal perfeito de שבר descreve a ruína já sofrida pelos amantes. “Foram despedaçados” mantém a imagem forte de quebra e o aspecto resultante sem substituí-la pela interpretação “foram destruídos”.
- source_word: כָּל מְאַהֲבָיִךְ
  choice: todos os seus amantes
  rationale: Preserva tanto a totalidade de כָּל quanto a metáfora profética de מְאַהֲבָיִךְ, em vez de explicá-la diretamente como “aliados” no texto.
theological_decisions:
- issue: Referência metafórica de “seus amantes”
  choice: Manter “seus amantes” no texto principal.
  alternative: Traduzir de modo interpretativo como “seus aliados”.
  rationale: A metáfora integra a retórica profética sobre as relações políticas de Judá/Jerusalém e conserva sua força literária e teológica. A provável referência aos aliados estrangeiros é esclarecida em nota, sem eliminar a tensão da imagem.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os imperativos femininos refletem a destinatária personificada. A repetição poética de “clame” e a metáfora “seus amantes” foram preservadas.
