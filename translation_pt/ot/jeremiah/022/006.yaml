  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל בֵּית֙ מֶ֣לֶךְ יְהוּדָ֔ה גִּלְעָ֥ד אַתָּ֛ה לִ֖/י רֹ֣אשׁ הַ/לְּבָנ֑וֹן אִם לֹ֤א אֲשִֽׁיתְ/ךָ֙ מִדְבָּ֔ר עָרִ֖ים לֹ֥א נושבה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/006.yaml
  text: 'For thus says Yahweh concerning the house of the king of Judah: You are Gilead to me[a], the summit of Lebanon; surely I will make you a wilderness[c][b], cities not inhabited.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh a respeito da casa do rei de Judá[a]: “Para mim, você é Gileade, o cume do Líbano[b]. Certamente farei de você um deserto: cidades desabitadas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa” também pode indicar o palácio ou o estabelecimento real; o hebraico mantém essa amplitude.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a cabeça do Líbano”, expressão que indica seu alto ou cume e pode sugerir elevação ou destaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título, de acordo com a forma explícita do texto hebraico.
- source_word: עַל
  choice: a respeito de
  rationale: Introduz naturalmente o assunto e destinatário do oráculo sem acrescentar à preposição um sentido hostil que o contexto já torna evidente.
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: a casa do rei de Judá
  rationale: Mantém a amplitude de בַּיִת, que pode abranger o palácio, a corte e a instituição real, sem restringi-lo antecipadamente à dinastia.
- source_word: גִּלְעָד אַתָּה לִי
  choice: Para mim, você é Gileade
  rationale: Preserva a metáfora nominal direta e o dativo de relação ou estima expresso por לִי.
- source_word: רֹאשׁ הַלְּבָנוֹן
  choice: o cume do Líbano
  rationale: Em imagem geográfica, רֹאשׁ, literalmente “cabeça”, designa de modo natural o alto ou cume, conservando a ideia de elevação e destaque.
- source_word: אִם לֹא
  choice: Certamente
  rationale: A expressão funciona aqui como fórmula enfática semelhante a juramento, e não como condição comum.
- source_word: אֲשִׁיתְךָ מִדְבָּר
  choice: farei de você um deserto
  rationale: Traduz שׂים com um predicativo de resultado e conserva a imagem de devastação de מִדְבָּר.
- source_word: עָרִים לֹא נוֹשָׁבָה
  choice: cidades desabitadas
  rationale: 'Expressa de forma concisa o resultado do juízo: cidades deixadas sem moradores, preservando a construção apositiva do hebraico.'
theological_decisions:
- issue: A elevada imagem de Gileade e do Líbano seguida pelo anúncio de devastação
  choice: Manter a metáfora honorífica e, logo depois, a certeza do juízo, sem explicar a razão da mudança dentro do versículo.
  alternative: Interpretar os nomes apenas como referências às regiões arborizadas de onde vinha a madeira do palácio.
  rationale: O hebraico permite associações com riqueza, altura e vegetação, mas não define uma única delas; a tradução conserva a tensão entre valor ou majestade e julgamento.
- issue: Força da expressão אִם לֹא
  choice: 'Traduzir como afirmação enfática: “Certamente”.'
  alternative: Reproduzir literalmente “se eu não fizer de você”, deixando a fórmula incompleta em português.
  rationale: No discurso divino, a construção tem força asseverativa ou juramentada; vertê-la como certeza comunica sua função sem criar uma condição inexistente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo e a metáfora geográfica do hebraico; “casa” e a aposição final permanecem deliberadamente abertas, com esclarecimento em notas.
