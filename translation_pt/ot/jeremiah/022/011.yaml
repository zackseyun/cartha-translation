source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה אֶל שַׁלֻּ֨ם בֶּן יֹאשִׁיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה הַ/מֹּלֵךְ֙ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו אֲשֶׁ֥ר יָצָ֖א מִן הַ/מָּק֣וֹם הַ/זֶּ֑ה לֹֽא יָשׁ֥וּב שָׁ֖ם עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/011.yaml
  text: 'For thus says Yahweh concerning Shallum son of Josiah[a], king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall never return there again.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh a respeito de Salum, filho de Josias[a], rei de Judá, que reinou no lugar de seu pai Josias e saiu deste lugar: “Ele nunca mais voltará para lá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Salum, filho de Josias”. A preposição hebraica pode indicar discurso dirigido a Salum, embora aqui provavelmente introduza o tema do oráculo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: כִּי introduz a explicação da declaração anterior, e a fórmula profética כֹה אָמַר é expressa naturalmente no presente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a respeito de
  rationale: Embora אֶל normalmente signifique “a/para”, neste contexto introduz provavelmente o tema do oráculo; a possível leitura como discurso direto é preservada em nota.
- source_word: שַׁלֻּם בֶּן יֹאשִׁיָּהוּ
  choice: Salum, filho de Josias
  rationale: Adota as formas portuguesas correntes dos nomes bíblicos e mantém a relação filial explícita.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e idiomática do título real.
- source_word: הַמֹּלֵךְ תַּחַת יֹאשִׁיָּהוּ אָבִיו
  choice: que reinou no lugar de seu pai Josias
  rationale: O particípio com תַּחַת indica que Salum exerceu o reinado no lugar de Josias; a ordem foi ajustada para fluência em português.
- source_word: אֲשֶׁר יָצָא מִן הַמָּקוֹם הַזֶּה
  choice: e saiu deste lugar
  rationale: Mantém o sentido concreto de יָצָא e liga com clareza a oração relativa a Salum.
- source_word: לֹא יָשׁוּב שָׁם עוֹד
  choice: Ele nunca mais voltará para cá
  rationale: A negação com עוֹד exprime ausência permanente de retorno. “Para cá” reproduz naturalmente a perspectiva dêitica de “deste lugar ... ali” em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor ou Jeová
  rationale: O texto hebraico traz o nome próprio divino; a transliteração Yahweh preserva essa distinção sem substituí-lo por um título.
- issue: Função de אֶל antes de Salum
  choice: a respeito de Salum
  alternative: a Salum
  rationale: O contexto favorece a apresentação do tema do oráculo, mas a preposição também admite a leitura mais literal de destinatário; essa ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “Salum” e “Josias”, formas tradicionais em português, e mantém “Yahweh” para o nome divino.
