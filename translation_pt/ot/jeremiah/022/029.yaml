  text: אֶ֥רֶץ אֶ֖רֶץ אָ֑רֶץ שִׁמְעִ֖י דְּבַר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/029.yaml
  text: Land[a], land, land, hear the word of Yahweh.
translation:
  language: pt
  text: Terra[a], terra, terra, ouça a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra” no sentido de uma região ou país; o hebraico אֶרֶץ pode referir-se tanto a uma terra específica quanto à terra em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ / אָרֶץ
  choice: terra
  rationale: O substantivo pode indicar tanto a terra de uma região quanto a terra em sentido amplo. No contexto, a referência provável é à terra de Judá, mas “terra” preserva em português a amplitude e a personificação do hebraico; a repetição tripla mantém a ênfase profética.
- source_word: שִׁמְעִי
  choice: ouça
  rationale: Imperativo feminino singular, em concordância com אֶרֶץ. “Ouça” comunica diretamente o chamado à recepção atenta, sem explicitar como “obedeça” uma implicação que o verbo pode assumir em outros contextos.
- source_word: דְּבַר
  choice: palavra
  rationale: Preserva a fórmula profética tradicional e o peso do construto “palavra de Yahweh”; “mensagem” seria possível, mas mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Identidade ou extensão da terra interpelada
  choice: Manter “terra” e registrar a alternativa em nota
  alternative: país; chão; mundo
  rationale: O contexto favorece a terra de Judá personificada, mas אֶרֶץ não obriga uma delimitação inequívoca; a tradução e a nota preservam essa tensão lexical.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino; “Yahweh” conserva sua função de nome próprio.
translation_notes:
  register: Português moderno, claro e solene. A pontuação exclamativa reproduz a intensidade da invocação tripla e do imperativo profético. O feminino de “ouça” concorda naturalmente com “terra”.
