  text: כִּ֤י אִם עָשׂוֹ֙ תַּֽעֲשׂ֔וּ אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הַ/בַּ֣יִת הַ/זֶּ֡ה מְלָכִים֩ יֹשְׁבִ֨ים לְ/דָוִ֜ד עַל כִּסְא֗/וֹ רֹֽכְבִים֙ בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֔ים ה֥וּא ו/עבד/ו וְ/עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
translation:
  language: pt
  text: Pois, se vocês realmente fizerem isto[a], entrarão pelos portões deste palácio reis que se assentam no trono de Davi, em carruagens e a cavalo — cada rei com seus servos[b] e seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta questão”, “esta coisa” ou “esta palavra”. O termo hebraico דָּבָר pode designar uma palavra, questão, assunto ou coisa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ele, seus servos e seu povo”. Os pronomes no singular são usados distributivamente depois de “reis”, isto é, referem-se a cada rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Mantém tanto a ligação explicativa com o contexto anterior quanto a força condicional da construção.
- source_word: עָשׂוֹ תַּעֲשׂוּ
  choice: vocês realmente fizerem
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “realmente” comunica essa ênfase em português natural.
- source_word: הַדָּבָר הַזֶּה
  choice: isto
  rationale: Retoma de modo natural a conduta ordenada no contexto, sem restringir indevidamente o sentido amplo de דָּבָר; a nota registra as alternativas lexicais.
- source_word: וּבָאוּ בְשַׁעֲרֵי הַבַּיִת הַזֶּה
  choice: entrarão pelos portões deste palácio
  rationale: O movimento pelos portões é adequadamente expresso por “entrarão”; no contexto, הַבַּיִת הַזֶּה designa a casa real, e “palácio” evita que o leitor suponha uma residência comum ou o templo.
- source_word: מְלָכִים יֹשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: reis que se assentam no trono de Davi
  rationale: Preserva a imagem dinástica do texto hebraico sem explicitar uma interpretação messiânica ou substituir a metáfora por “descendentes”.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: andando em carros e montados em cavalos
  rationale: Distingue idiomaticamente em português o deslocamento em carros do ato de montar cavalos; o singular hebraico רֶכֶב tem valor coletivo ou genérico.
- source_word: הוּא וַעֲבָדָיו וְעַמּוֹ
  choice: cada rei com seus servos e seu povo
  rationale: Explicita o valor distributivo dos pronomes hebraicos no singular depois do plural “reis”, preservando a concordância conceitual sem produzir uma construção portuguesa obscura.
theological_decisions:
- issue: Linguagem de promessa dinástica em “reis que se assentam no trono de Davi”
  choice: Conservar a imagem de sucessão davídica e a forma condicional do enunciado.
  alternative: Explicitar “reis da linhagem de Davi” ou interpretar o trecho diretamente como messiânico.
  rationale: O contexto imediato trata da continuidade da monarquia davídica vinculada à obediência. A tradução não exclui desenvolvimentos teológicos posteriores, mas não os introduz onde o versículo não os explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega-se “vocês” para o plural dirigido à casa real e seus oficiais. “Palácio” torna explícito o referente contextual de “esta casa”, enquanto as notas preservam ambiguidades relevantes do hebraico.
