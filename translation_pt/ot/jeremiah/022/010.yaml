  text: אַל תִּבְכּ֣וּ לְ/מֵ֔ת וְ/אַל תָּנֻ֖דוּ ל֑/וֹ בְּכ֤וּ בָכוֹ֙ לַֽ/הֹלֵ֔ךְ כִּ֣י לֹ֤א יָשׁוּב֙ ע֔וֹד וְ/רָאָ֖ה אֶת אֶ֥רֶץ מוֹלַדְתּֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/010.yaml
  text: Do not weep for the dead[a], and do not mourn for him. Weep bitterly for the one going away[b], for he will never return or see the land of his birth.
translation:
  language: pt
  text: Não chorem pelo morto nem lamentem por ele. Chorem amargamente por aquele que está partindo[a], pois ele nunca mais voltará nem verá a terra onde nasceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, “aquele que está partindo” é o governante levado para o exílio.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּבְכּוּ לְמֵת
  choice: Não chorem pelo morto
  rationale: בכה significa “chorar”; לְמֵת é uma expressão singular e concisa, aqui vertida naturalmente como “pelo morto”.
- source_word: וְאַל תָּנֻדוּ לוֹ
  choice: nem lamentem por ele
  rationale: Em contexto de luto, נוד pode indicar lamentar, condoer-se ou manifestar pesar. “Lamentem” comunica o sentido sem especificar um gesto incerto.
- source_word: בְּכוּ בָכוֹ
  choice: Chorem amargamente
  rationale: O imperativo seguido do infinitivo absoluto intensifica a ordem; “amargamente” expressa essa ênfase em português natural.
- source_word: לַהֹלֵךְ
  choice: por aquele que está partindo
  rationale: A forma substantivada de הלך significa literalmente “aquele que vai/está partindo”. A tradução preserva essa imagem, enquanto a nota esclarece o exílio contextual.
- source_word: כִּי לֹא יָשׁוּב עוֹד
  choice: pois ele nunca mais voltará
  rationale: A combinação da negação com עוֹד indica que o retorno não ocorrerá mais; “nunca mais” transmite sua força com naturalidade.
- source_word: וְרָאָה אֶת אֶרֶץ מוֹלַדְתּוֹ
  choice: nem verá a terra onde nasceu
  rationale: Sob o alcance da negação anterior, o waw coordena uma segunda ação negada. מוֹלֶדֶת designa a terra natal ou do nascimento; a formulação escolhida é clara e concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativos no plural. A repetição enfática hebraica foi expressa por “amargamente”; preservou-se no texto principal a descrição literal daquele que parte, sem substituir diretamente por “exilado”.
