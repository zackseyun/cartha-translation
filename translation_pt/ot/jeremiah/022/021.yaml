  text: דִּבַּ֤רְתִּי אֵלַ֨יִ/ךְ֙ בְּ/שַׁלְוֺתַ֔יִ/ךְ אָמַ֖רְתְּ לֹ֣א אֶשְׁמָ֑ע זֶ֤ה דַרְכֵּ/ךְ֙ מִ/נְּעוּרַ֔יִ/ךְ כִּ֥י לֹֽא שָׁמַ֖עַתְּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/021.yaml
  text: I spoke to you in your prosperity[a], but you said, ‘I will not listen.’ This has been your way from your youth[b], for you have not listened to my voice.
translation:
  language: pt
  text: 'Falei com você em sua tranquilidade[a], mas você disse: “Não ouvirei.” Esse tem sido o seu caminho desde a juventude, pois você não tem ouvido a minha voz.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua segurança”, “em seu bem-estar” ou “em sua prosperidade”. O termo hebraico pode indicar tranquilidade, segurança e uma condição próspera.
    reason: lexical_alternative
  - marker: b
    text: Neste versículo, “ouvir” também pode ter o sentido de “atender” ou “obedecer”; o verbo hebraico frequentemente reúne esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי אֵלַיִךְ
  choice: Falei com você
  rationale: Expressa de modo natural em português a fala dirigida à interlocutora; embora אֶל seja literalmente “a/para”, “falar com” é a construção idiomática corrente sem eliminar a direção do discurso.
- source_word: בְּשַׁלְוֺתַיִךְ
  choice: quando vivia em tranquilidade
  rationale: שַׁלְוָה abrange tranquilidade, segurança, bem-estar e prosperidade. A formulação preserva esse campo sem restringi-lo apenas à riqueza material.
- source_word: לֹא אֶשְׁמָע
  choice: Não ouvirei
  rationale: Mantém a metáfora auditiva e a correspondência com a repetição posterior de שׁמע, deixando implícita a dimensão de obediência.
- source_word: זֶה דַרְכֵּךְ
  choice: Esse tem sido o seu caminho
  rationale: O perfeito composto torna natural em português a ideia de um padrão contínuo, esclarecido por “desde a juventude”.
- source_word: מִנְּעוּרַיִךְ
  choice: desde a juventude
  rationale: Equivalente português claro e idiomático para um comportamento persistente desde os primeiros tempos.
- source_word: לֹא שָׁמַעַתְּ בְּקוֹלִי
  choice: você não tem ouvido a minha voz
  rationale: Preserva tanto a repetição lexical de שׁמע quanto a imagem hebraica da voz divina; o perfeito composto comunica persistência até o presente do discurso.
theological_decisions:
- issue: Identidade da interlocutora feminina personificada
  choice: Manter a segunda pessoa singular sem nomear a interlocutora
  alternative: Explicitar “Jerusalém”, “Judá” ou “casa real”
  rationale: As formas hebraicas são femininas singulares, mas o versículo não identifica nominalmente a destinatária. Manter “você” preserva a referência contextual e evita resolver uma ambiguidade legítima.
- issue: Duplo sentido de שׁמע
  choice: Traduzir por “ouvir” e registrar a dimensão de obediência em nota
  alternative: Traduzir diretamente por “obedecer”
  rationale: “Ouvir” conserva a imagem e a repetição do hebraico, enquanto a nota reconhece que, no contexto da resposta à palavra divina, o verbo também implica atender e obedecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A interlocução direta foi preservada, bem como a repetição de “ouvir” e a imagem da “voz”. O valor semântico amplo de שַׁלְוָה foi mantido no texto e explicitado em nota.
