  text: דָּ֛ן דִּין עָנִ֥י וְ/אֶבְי֖וֹן אָ֣ז ט֑וֹב הֲ/לוֹא הִ֛יא הַ/דַּ֥עַת אֹתִ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/016.yaml
  text: He defended the cause of the poor and needy[a]; then it was well[b]. Is not that what it means to know me? declares Yahweh.
translation:
  language: pt
  text: Ele julgava a causa do pobre e do necessitado[a]; então tudo estava bem. Não é isso conhecer-me?[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “defendia a causa do pobre e do necessitado”. A expressão hebraica é forense e se refere a julgar ou sustentar a causa deles.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Não é isso o conhecimento de mim?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן דִּין
  choice: julgava com justiça a causa
  rationale: 'A construção com verbo e substantivo cognatos é forense: trata de julgar ou sustentar devidamente uma causa. A formulação portuguesa conserva o caráter judicial e deixa claro o resultado justo sem reduzir o verbo a mera avaliação.'
- source_word: עָנִי וְאֶבְיוֹן
  choice: do pobre e do necessitado
  rationale: Os dois termos designam pessoas social e materialmente vulneráveis. A dupla portuguesa é corrente e mantém a distinção entre pobreza e necessidade.
- source_word: אָז טוֹב
  choice: então tudo ia bem
  rationale: אָז conserva sua força temporal-resultativa, enquanto טוֹב funciona predicativamente. A expressão é natural em português e comunica a situação favorável resultante.
- source_word: הֲלוֹא הִיא הַדַּעַת אֹתִי
  choice: Não é isso conhecer-me?
  rationale: A pergunta retórica espera concordância. O infinitivo substantivado em português reflete de modo conciso a ideia hebraica de 'o conhecimento de mim', sem acrescentar que esse conhecimento se esgote nessa ação.
- source_word: נְאֻם יְהוָה
  choice: — declara Yahweh
  rationale: Mantém a fórmula profética solene e verte o tetragrama como o nome pessoal Yahweh, em conformidade com a camada inglesa fornecida.
theological_decisions:
- issue: Sentido de conhecer Yahweh no contexto
  choice: Conhecimento relacional e pactual evidenciado pela prática da justiça em favor dos vulneráveis
  alternative: Conhecimento meramente intelectual ou identificação exaustiva do conhecimento de Deus com a ética social
  rationale: O versículo apresenta a justiça para com o pobre e o necessitado como expressão concreta de conhecer Yahweh, mas não afirma que isso esgote todo o conteúdo desse conhecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito imperfeito acompanha naturalmente o retrato habitual do rei no contexto. A formulação preserva o tom judicial, a pergunta retórica e a relação entre conhecer Deus e praticar a justiça.
