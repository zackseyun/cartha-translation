  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם וַ/יִּֽשְׁתַּחֲו֛וּ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/יַּעַבְדֽוּ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/009.yaml
  text: And they will say[b][a], ‘Because they abandoned the covenant of Yahweh their God and bowed down to other gods and served them.’
translation:
  language: pt
  text: 'E dirão: “Porque abandonaram[a] a aliança de Yahweh, o seu Deus, e se prostraram diante de outros deuses e os serviram.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixaram”.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “prostraram-se diante de outros deuses e os serviram”; os dois verbos juntos descrevem o culto idólatra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: E dirão
  rationale: O verbo dá continuidade à resposta futura anunciada no versículo anterior; “E dirão” preserva a ligação hebraica e soa natural em português.
- source_word: עַל אֲשֶׁר
  choice: Porque
  rationale: A expressão introduz a causa do juízo; “Porque” comunica diretamente seu valor causal.
- source_word: עָזְבוּ
  choice: abandonaram
  rationale: Expressa com clareza atual a ruptura e deslealdade em relação à aliança, sem recorrer a formulação arcaica.
- source_word: בְּרִית
  choice: a aliança
  rationale: É o termo português consagrado para a relação pactual entre Yahweh e seu povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: o seu Deus
  rationale: Embora אֱלֹהִים tenha forma plural, aqui designa no singular o Deus de Israel na fórmula da aliança.
- source_word: וַיִּשְׁתַּחֲווּ לֵאלֹהִים אֲחֵרִים
  choice: e se prostraram diante de outros deuses
  rationale: “Prostraram-se diante de” preserva o gesto concreto de reverência e, no contexto, sua função cultual.
- source_word: וַיַּעַבְדוּם
  choice: e os serviram
  rationale: Mantém a distinção lexical entre prostrar-se e servir, enquanto o contexto evidencia o culto idólatra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta o Tetragrama como nome próprio; “Yahweh” preserva essa identificação pessoal em vez de empregar um título substitutivo.
- issue: Relação entre prostrar-se e servir a outros deuses
  choice: Manter os dois verbos distintos
  alternative: Resumir ambos como “adoraram”
  rationale: O texto apresenta duas ações coordenadas. Preservá-las conserva a imagem física da prostração e a noção de serviço religioso sem reduzir a formulação hebraica.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensão internacional. A colocação “o seu Deus” evita possível leitura inicial de que “seu” se refira ao leitor; “diante de” é idiomático com “prostrar-se”.
