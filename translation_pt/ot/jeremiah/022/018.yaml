language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אֶל יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָחִ֖/י וְ/ה֣וֹי אָח֑וֹת לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָד֖וֹן וְ/ה֥וֹי הֹדֹֽ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/018.yaml
  text: 'Therefore thus says Yahweh concerning Jehoiakim son of Josiah[a], king of Judah: They will not lament for him, saying, “Alas, my brother!” or “Alas, sister!” They will not lament for him, saying, “Alas, lord!” or “Alas[d][c][b], his majesty!”'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh a respeito de Jeoaquim, filho de Josias, rei de Judá: “Não prantearão por ele[a], dizendo: ‘Ai, meu irmão!’ ou ‘Ai, irmã!’[b] Não prantearão por ele, dizendo: ‘Ai, senhor!’[c] ou ‘Ai, sua majestade!’[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não farão lamentação por ele”. O verbo hebraico se refere especialmente ao lamento fúnebre formal.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “irmã”, sem o “minha” explícito que aparece em “meu irmão”.
    reason: source_form
  - marker: c
    text: 'Ou: “Ai, amo!”. O título hebraico pode designar um superior, proprietário ou governante.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “Ai, seu esplendor!”. O termo hebraico pode significar majestade, esplendor ou glória.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa a conclusão inferencial do oráculo precedente em português natural.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa diretamente o nome divino.
- source_word: אֶל
  choice: a respeito de
  rationale: Neste contexto, introduz a pessoa que é objeto do pronunciamento, não necessariamente um destinatário diretamente interpelado.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Jeoaquim, filho de Josias, rei de Judá
  rationale: Emprega as formas portuguesas tradicionais dos nomes e mantém toda a identificação régia.
- source_word: לֹא יִסְפְּדוּ לוֹ
  choice: Não prantearão por ele
  rationale: O verbo ספד designa especialmente o pranto ou lamento fúnebre formal; “prantear” conserva essa nuance.
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição portuguesa corrente de dor e lamentação, adequada ao contexto funerário.
- source_word: אָחִי
  choice: meu irmão
  rationale: Mantém o sufixo explícito de primeira pessoa do singular.
- source_word: אָחוֹת
  choice: irmã
  rationale: Segue a forma hebraica, que aqui não traz o sufixo possessivo explícito presente em “meu irmão”.
- source_word: אָדוֹן
  choice: senhor
  rationale: Título aplicável a superior, governante ou soberano; “senhor” é natural no lamento dirigido a um rei.
- source_word: הֹדֹה
  choice: sua majestade
  rationale: Comunica a majestade ou o esplendor régio do falecido e preserva o sufixo de terceira pessoa.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Valor de אָדוֹן no lamento
  choice: senhor
  alternative: amo; meu senhor
  rationale: O termo indica posição superior ou autoridade. Não se acrescenta o possessivo “meu”, ausente da forma hebraica, nem se identifica o título com o nome divino.
- issue: Sentido de הֹדֹה
  choice: sua majestade
  alternative: seu esplendor; sua glória
  rationale: A expressão pode apontar para majestade, esplendor ou glória régia; o texto principal mantém a linguagem cortesã sem definir além do hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência profética preservada. “Prantear” foi escolhido para marcar a lamentação funerária, enquanto “Ai” mantém a espontaneidade das fórmulas de lamento. As aspas distinguem o pronunciamento divino das exclamações fúnebres.
