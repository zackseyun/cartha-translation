  text: וְ/אָֽמַרְתָּ֙ שְׁמַ֣ע דְּבַר יְהוָ֔ה מֶ֣לֶךְ יְהוּדָ֔ה הַ/יֹּשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד אַתָּ֤ה וַ/עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֔ הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/002.yaml
  text: and say[a], ‘Hear the word of Yahweh, O king of Judah, who sits on the throne of David—you, your servants, and your people who enter through these gates.’
translation:
  language: pt
  text: 'e diga: “Ouça a palavra de Yahweh, ó rei de Judá, que está sentado no trono de Davi — você, seus servos[a] e seu povo, que entram por estes portões.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus oficiais”.
    reason: עֲבָדֶיךָ significa literalmente “seus servos”, mas, no contexto da corte real, pode designar os oficiais do rei.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: e diga
  rationale: O perfeito consecutivo dá continuidade à ordem do versículo anterior; “e diga” preserva essa ligação de modo natural.
- source_word: שְׁמַע
  choice: Escute
  rationale: O imperativo introduz a convocação profética para receber a mensagem. “Escute” é corrente em português e não restringe o sentido à obediência.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética e o peso revelatório de דָּבָר, além de verter diretamente o nome divino.
- source_word: מֶלֶךְ יְהוּדָה
  choice: ó rei de Judá
  rationale: O substantivo funciona como vocativo; “ó” torna explícita a interpelação solene sem comprometer a clareza.
- source_word: הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  choice: que está sentado no trono de Davi
  rationale: O particípio singular modifica o rei e a expressão conserva a referência dinástica davídica.
- source_word: אַתָּה וַעֲבָדֶיךָ וְעַמְּךָ
  choice: você, seus servos e seu povo
  rationale: O pronome enfático retoma o rei e amplia os destinatários. “Servos” preserva a amplitude de עֲבָדִים, embora no contexto da corte possa indicar oficiais.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: que entram por estes portões
  rationale: A oração participial caracteriza os destinatários; “entram por” expressa naturalmente o movimento indicado pelo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade profética. Emprega “você” para a retomada enfática do rei, evitando a ambiguidade regional de “tu” com flexão verbal, e “portões” para entradas monumentais.
