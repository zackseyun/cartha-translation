id: JER.22.22
reference: Jeremiah 22:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל רֹעַ֨יִ/ךְ֙ תִּרְעֶה ר֔וּחַ וּֽ/מְאַהֲבַ֖יִ/ךְ בַּ/שְּׁבִ֣י יֵלֵ֑כוּ כִּ֣י אָ֤ז תֵּבֹ֨שִׁי֙ וְ/נִכְלַ֔מְתְּ מִ/כֹּ֖ל רָעָתֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/022.yaml
  text: All your shepherds the wind will shepherd[a], and your lovers will go into captivity[b]; then you will surely be ashamed and humiliated because of all your evil.
translation:
  language: pt
  text: O vento pastoreará todos os teus pastores[a], e os teus amantes irão para o cativeiro[b]. Então ficarás envergonhada e humilhada por causa de toda a tua maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O vento dispersará todos os teus líderes”. O hebraico emprega a mesma raiz em “pastores” e “pastoreará”, formando um jogo de palavras irônico.'
    reason: lexical_alternative
  - marker: b
    text: “Teus amantes” é uma metáfora profética para os aliados políticos e outros vínculos ilícitos de Judá.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעַיִךְ
  choice: teus pastores
  rationale: Mantém a imagem literal dos pastores, usada profeticamente para os governantes e líderes de Judá, sem substituir a metáfora por sua interpretação.
- source_word: תִּרְעֶה רוּחַ
  choice: o vento pastoreará
  rationale: Preserva a repetição irônica da raiz רעה em “pastores” e “pastoreará”. Embora a expressão seja incomum em português, ela reproduz deliberadamente o jogo de palavras hebraico; a nota oferece o sentido contextual mais natural.
- source_word: מְאַהֲבַיִךְ
  choice: teus amantes
  rationale: Conserva a metáfora profética para os vínculos e aliados ilícitos de Judá, bem como sua força moral, em vez de reduzi-la a “aliados”.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: irão para o cativeiro
  rationale: Segue de perto a construção hebraica, literalmente “irão no/para o cativeiro”, e permanece clara em português.
- source_word: כִּי אָז
  choice: Então
  rationale: Expressa com naturalidade a consequência temporal do juízo. O כִּי tem aqui força discursiva que não exige um “porque” explícito.
- source_word: תֵּבֹשִׁי וְנִכְלַמְתְּ
  choice: ficarás envergonhada e humilhada
  rationale: 'Mantém distintos os dois termos hebraicos sobrepostos: בוש indica vergonha, e נכלם acrescenta humilhação ou desonra. As formas femininas refletem a destinatária personificada.'
- source_word: מִכֹּל רָעָתֵךְ
  choice: por causa de toda a tua maldade
  rationale: 'Interpreta a preposição מִן com valor causal no contexto: a vergonha resulta da maldade da destinatária. “Maldade” comunica o sentido moral amplo de רעה.'
theological_decisions:
- issue: Linguagem metafórica para os governantes e as alianças infiéis de Judá
  choice: Manter “pastores” e “amantes” no texto principal.
  alternative: Substituir por “líderes” e “aliados”.
  rationale: As metáforas fazem parte da acusação profética e preservam sua tensão política, moral e espiritual sem impor uma explicação denominacional.
- issue: Identidade e gênero da destinatária
  choice: 'Usar formas femininas: “envergonhada” e “humilhada”.'
  alternative: Neutralizar o gênero ou explicitar “Jerusalém/Judá” no versículo.
  rationale: Os sufixos e verbos hebraicos se dirigem a uma destinatária feminina singular, implicitamente a cidade ou comunidade personificada; a tradução conserva essa forma sem acrescentar um referente ausente do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Empregam-se “teu/tua” para acompanhar a interpelação profética no singular e formas femininas para refletir a gramática hebraica. A estranheza deliberada de “o vento pastoreará” é mantida no texto para conservar o jogo lexical, com esclarecimento em nota.
