base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/024.yaml
  text: But the hand of Ahikam son of Shaphan was with Jeremiah[b][a], so that he was not given into the hand of the people to put him to death.
translation:
  language: pt
  text: Mas a mão de Aicão, filho de Safã, estava com Jeremias[a], de modo que ele não foi entregue na mão do povo[b] para ser morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a mão de Aicão [...] estava com Jeremias”. A expressão indica que Aicão apoiava e protegia Jeremias.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na mão do povo”, expressão que significa sob o poder do povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: A partícula marca contraste com a ameaça anterior contra Jeremias; “Mas” expressa naturalmente essa força adversativa.
- source_word: יַד אֲחִיקָם ... הָיְתָה אֶת יִרְמְיָהוּ
  choice: a mão de Aicão ... estava com Jeremias
  rationale: Mantém a imagem hebraica da mão como apoio e proteção ativos, esclarecida em nota, e preserva o contraste com as “mãos do povo”.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Aicão, filho de Safã
  rationale: Emprega formas portuguesas tradicionais e amplamente reconhecíveis dos nomes, com a identificação genealógica direta de בֶּן.
- source_word: לְבִלְתִּי תֵּת אֹתוֹ
  choice: de modo que ele não foi entregue
  rationale: Reproduz a finalidade ou o resultado negativo sem acrescentar um agente que o hebraico não explicita.
- source_word: בְיַד הָעָם
  choice: nas mãos do povo
  rationale: Conserva o idioma de estar sob o poder de alguém e a repetição intencional da imagem de “mão”; o plural é a formulação idiomática natural em português.
- source_word: לַהֲמִיתוֹ
  choice: para ser morto
  rationale: Expressa de modo claro e digno o causativo de מות, preservando a voz passiva e sem impor a noção técnica de execução judicial.
