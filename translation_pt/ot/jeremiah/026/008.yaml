  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִרְמְיָ֗הוּ לְ/דַבֵּר֙ אֵ֣ת כָּל אֲשֶׁר צִוָּ֣ה יְהוָ֔ה לְ/דַבֵּ֖ר אֶל כָּל הָ/עָ֑ם וַ/יִּתְפְּשׂ֨וּ אֹת֜/וֹ הַ/כֹּהֲנִ֧ים וְ/הַ/נְּבִאִ֛ים וְ/כָל הָ/עָ֥ם לֵ/אמֹ֖ר מ֥וֹת תָּמֽוּת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/008.yaml
  text: And it happened[a], when Yirmeyahu had finished speaking all that Yahweh had commanded him to speak to all the people, that the priests and the prophets and all the people seized him, saying, “You must surely die!”
translation:
  language: pt
  text: 'E aconteceu que, quando Yirmeyahu terminou de dizer a todo o povo tudo o que Yahweh lhe havia ordenado dizer, os sacerdotes, os profetas e todo o povo o agarraram e disseram: “Você certamente morrerá!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você tem de morrer!” O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase à declaração.'
    reason: Registra tanto uma alternativa idiomática quanto a construção enfática do original.
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Reproduz a fórmula narrativa hebraica sem recorrer ao arcaísmo português “e sucedeu que”.
- source_word: כְּכַלּוֹת יִרְמְיָהוּ לְדַבֵּר
  choice: quando Yirmeyahu terminou de dizer
  rationale: A construção temporal com o infinitivo de כלה indica que a ação seguinte ocorreu após ele concluir sua fala.
- source_word: יִרְמְיָהוּ
  choice: Yirmeyahu
  rationale: Translitera diretamente o nome hebraico do profeta, em coerência com a orientação do projeto para nomes próprios.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה יְהוָה לְדַבֵּר אֶל כָּל הָעָם
  choice: de dizer a todo o povo tudo o que Yahweh lhe havia ordenado dizer
  rationale: Mantém tanto a totalidade da mensagem e dos destinatários quanto a repetição de דבר; o mais-que-perfeito composto esclarece que a ordem precedeu a fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּתְפְּשׂוּ אֹתוֹ
  choice: o agarraram
  rationale: Comunica o ato físico e hostil de apoderar-se dele sem pressupor uma prisão formal.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: os sacerdotes, os profetas e todo o povo
  rationale: Identifica claramente os três grupos coordenados, preservando a abrangência de “todo o povo”.
- source_word: לֵאמֹר
  choice: e disseram
  rationale: Converte o infinitivo hebraico introdutor de citação em uma forma natural na narrativa portuguesa.
- source_word: מוֹת תָּמוּת
  choice: Você certamente morrerá!
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a declaração; “certamente” preserva a ênfase e a força da ameaça em português atual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino, e “Yahweh” o representa diretamente sem convertê-lo em título.
- issue: Força da sentença מוֹת תָּמוּת
  choice: Você certamente morrerá!
  alternative: Você tem de morrer!
  rationale: A formulação escolhida conserva a certeza enfática sem decidir de modo excessivo se a fala funciona principalmente como sentença judicial, ameaça ou declaração de intenção.
- issue: Forma do nome יִרְמְיָהוּ
  choice: Yirmeyahu
  alternative: Jeremias
  rationale: A escolha translitera a forma hebraica conforme a orientação nominal do projeto, embora “Jeremias” seja a forma tradicional portuguesa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Preserva-se a repetição deliberada de “dizer” e evita-se linguagem jurídica excessivamente específica.
