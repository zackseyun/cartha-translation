  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ וְ/כָל הָ/עָ֔ם אֶל הַ/כֹּהֲנִ֖ים וְ/אֶל הַ/נְּבִיאִ֑ים אֵין לָ/אִ֤ישׁ הַ/זֶּה֙ מִשְׁפַּט מָ֔וֶת כִּ֗י בְּ/שֵׁ֛ם יְהוָ֥ה אֱלֹהֵ֖י/נוּ דִּבֶּ֥ר אֵלֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/016.yaml
  text: Then the officials and all the people said to the priests and the prophets[a], “This man does not deserve the sentence of death[b], for he has spoken to us in the name of Yahweh our God.”
translation:
  language: pt
  text: 'Então as autoridades e todo o povo disseram aos sacerdotes e aos profetas: “Este homem não merece a pena de morte, pois falou conosco em nome de Yahweh, nosso Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: No contexto judicial, designa os dirigentes ou oficiais investidos de autoridade; “autoridades” é claro e natural em português.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: Preserva a referência coletiva e a participação pública no pronunciamento.
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: aos sacerdotes e aos profetas
  rationale: Tradução direta e corrente dos dois grupos aos quais a declaração é dirigida.
- source_word: אֵין לָאִישׁ הַזֶּה מִשְׁפַּט מָוֶת
  choice: Este homem não merece a pena de morte
  rationale: Expressa em português idiomático o veredito jurídico de que o acusado não está sujeito à condenação capital.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada para o veredito, mantendo um registro digno e natural.
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: em nome de Yahweh, nosso Deus
  rationale: “Em nome de” preserva a ideia de representação ou autoridade divina; a vírgula torna clara a aposição “nosso Deus”.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: falou conosco
  rationale: O perfeito hebraico relata o ato concluído que fundamenta o veredito; o pretérito perfeito é a forma mais natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; a transliteração “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Força jurídica de מִשְׁפַּט מָוֶת
  choice: não merece a pena de morte
  alternative: não há sentença de morte para este homem; este homem não é réu de morte
  rationale: A formulação comunica responsabilidade judicial e não apenas uma avaliação moral, sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o cenário judicial e a solenidade do pronunciamento sem arcaísmos.
