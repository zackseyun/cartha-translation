source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲמֹד֮ בַּ/חֲצַ֣ר בֵּית יְהוָה֒ וְ/דִבַּרְתָּ֞ עַל כָּל עָרֵ֣י יְהוּדָ֗ה הַ/בָּאִים֙ לְ/הִשְׁתַּחֲוֺ֣ת בֵּית יְהוָ֔ה אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/דַבֵּ֣ר אֲלֵי/הֶ֑ם אַל תִּגְרַ֖ע דָּבָֽר׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/002.yaml
  text: 'Thus says Yahweh: Stand in the court of the house of Yahweh[a], and speak to all the cities of Judah that come to worship at the house of Yahweh all the words that I have commanded you to speak to them[c][b]; do not hold back a word.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Ponha-se de pé no pátio[a] da Casa de Yahweh e fale a todos os habitantes das cidades de Judá[b] que vêm adorar na Casa de Yahweh todas as palavras que ordenei que você lhes dissesse. Não omita uma só palavra.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no átrio”. O termo hebraico חָצֵר pode designar um pátio ou átrio.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre todas as cidades de Judá”, expressão que também pode ser entendida como “a todas as cidades de Judá” ou “contra todas as cidades de Judá”. O contexto se refere às pessoas dessas cidades que vêm adorar.'
    reason: lexical_alternative
  - marker: c
    text: Ou “não retire nenhuma palavra”, “não diminua nenhuma palavra” ou “não deixe de dizer uma só palavra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética solene e verte o tetragrama como nome próprio, sem substituí-lo por um título.
- source_word: עֲמֹד
  choice: Fique
  rationale: No contexto, a ordem é ocupar e permanecer no local indicado; “fique” é natural em português e evita sugerir apenas o ato físico de se levantar.
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: no pátio da Casa de Yahweh
  rationale: “Pátio” comunica com clareza o espaço aberto do complexo do templo, enquanto “Casa de Yahweh” preserva a expressão hebraica em vez de substituí-la por “templo”.
- source_word: וְדִבַּרְתָּ
  choice: e anuncie
  rationale: Neste encargo profético, “anuncie” expressa de modo natural a fala pública ordenada, sem acrescentar conteúdo ao verbo.
- source_word: עַל כָּל עָרֵי יְהוּדָה
  choice: a todos os habitantes das cidades de Judá
  rationale: O particípio masculino plural seguinte aponta para pessoas vindas das cidades, não para as cidades como entidades físicas. “Habitantes” torna essa referência implícita inteligível, enquanto a nota preserva a ambiguidade da preposição עַל.
- source_word: הַבָּאִים לְהִשְׁתַּחֲוֺת
  choice: que vêm adorar
  rationale: A expressão descreve pessoas que vêm com a finalidade de culto; “adorar” é a equivalência idiomática adequada, embora o verbo hebraico também evoque o ato de prostrar-se.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: todas as palavras
  rationale: Preserva a ênfase na totalidade e na formulação da mensagem, reforçada pela proibição final.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְדַבֵּר אֲלֵיהֶם
  choice: que ordenei que você lhes anunciasse
  rationale: Construção portuguesa natural que mantém tanto a autoridade da ordem divina quanto os destinatários da proclamação.
- source_word: אַל תִּגְרַע דָּבָר
  choice: Não omita uma só palavra
  rationale: No contexto de proclamar uma mensagem completa, “omitir” exprime com clareza a proibição de retirar ou deixar de dizer qualquer parte dela.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o tetragrama como nome divino. “Yahweh” preserva esse nome em transliteração, em vez de substituí-lo pelo título “SENHOR”.
- issue: Referente de “todas as cidades de Judá”
  choice: os habitantes das cidades que vêm adorar
  alternative: as cidades de Judá como destinatárias coletivas, possivelmente em sentido adversativo (“contra”)
  rationale: A concordância semântica do particípio masculino plural favorece pessoas vindas das cidades. A nota mantém aberta a amplitude semântica de עַל e evita eliminar a possível tonalidade adversativa.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira e compreensão internacional. Emprega “você” para a segunda pessoa singular por naturalidade ampla no português brasileiro; conserva “Casa de Yahweh” para refletir a imagem hebraica e usa “pátio” no texto principal por ser mais corrente que “átrio”.
