revisions:
- from: Eles tiraram Urias do Egito e o levaram ao rei Jeoaquim. Ele o matou à espada e lançou seu cadáver nas sepulturas da gente comum.[a]
  to: Eles tiraram Urias do Egito e o levaram ao rei Jeoaquim. O rei Jeoaquim golpeou Urias com a espada e lançou o cadáver de Urias nas sepulturas da gente comum[a].
  rationale: A revisão explicita os referentes dos verbos singulares e do possessivo, preservando a transição do plural para o singular no hebraico. Também substitui «matou» por «golpeou», equivalente mais direto de נכה, deixando que «o cadáver» comunique o desfecho fatal. A chamada da nota foi posicionada junto à expressão a que se refere.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:32Z'
review_pass:
  verdict: revise
  source_fidelity: A sequência de ações, os sujeitos plural e singular, o instrumento da morte e o destino desonroso do cadáver são preservados. Contudo, em português, «Ele» pode criar uma referência momentaneamente ambígua; explicitar Jeoaquim reproduz com maior segurança a mudança de sujeito do hebraico. «Golpeou-o com a espada» mantém mais de perto o verbo hebraico נכה do que «matou», enquanto a menção imediata ao cadáver deixa claro o resultado mortal.
  naturalness: O texto é claro e moderno. A repetição do nome do rei e a colocação da chamada de nota imediatamente após «gente comum» melhoram a coesão e tornam inequívoco o referente da nota.
  terminology: «Urias», «Jeoaquim», «cadáver», «espada» e «sepulturas da gente comum» são adequados ao registro e ao uso português internacional com boa legibilidade brasileira. A nota conserva corretamente a alternativa lexical sem impor uma interpretação social mais específica do que o texto requer.
  issues:
  - severity: medium
    issue: Referência ambígua de «Ele» e «seu cadáver»
    rationale: Embora o antecedente pretendido seja Jeoaquim, o uso de pronomes após uma oração cujo sujeito é «Eles» pode retardar essa identificação em português. Nomear o rei e Urias explicita a mudança singular já presente no hebraico.
  - severity: low
    issue: «Matou» torna explícito o resultado de נכה
    rationale: O contexto do cadáver confirma a morte, mas o verbo hebraico é literalmente mais amplo («golpear/ferir»). «Golpeou-o com a espada» preserva a formulação verbal, sem perder a consequência contextual.
  revised_text: Eles tiraram Urias do Egito e o levaram ao rei Jeoaquim. O rei Jeoaquim golpeou Urias com a espada e lançou o cadáver de Urias nas sepulturas da gente comum[a].
  revised_footnotes:
  - marker: a
    text: Ou “nos túmulos do povo”. O hebraico pode referir-se mais literalmente às sepulturas pertencentes ao povo comum, em contraste com um sepultamento honroso.
    reason: lexical_alternative
