  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יּוֹצִ֨יאוּ אֶת אוּרִיָּ֜הוּ מִ/מִּצְרַ֗יִם וַ/יְבִאֻ֨/הוּ֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹיָקִ֔ים וַ/יַּכֵּ֖/הוּ בֶּ/חָ֑רֶב וַ/יַּשְׁלֵךְ֙ אֶת נִבְלָת֔/וֹ אֶל קִבְרֵ֖י בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/023.yaml
  text: They brought Uriah out of Egypt and brought him to King Jehoiakim[a], and he struck him down with the sword and threw his corpse into the burial places of the common people.
translation:
  language: pt
  text: Eles tiraram Urias do Egito e o levaram ao rei Jeoaquim. O rei Jeoaquim golpeou Urias com a espada e lançou o cadáver de Urias nas sepulturas da gente comum[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos túmulos do povo”. O hebraico pode referir-se mais literalmente às sepulturas pertencentes ao povo comum, em contraste com um sepultamento honroso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ אֶת־אוּרִיָּהוּ מִמִּצְרַיִם
  choice: tiraram Urias do Egito
  rationale: O hifil de יצא expressa fazer sair ou tirar. Em português, “tiraram ... do Egito” preserva o sentido causativo e soa natural.
- source_word: וַיְבִאֻהוּ אֶל־הַמֶּלֶךְ יְהוֹיָקִים
  choice: o levaram ao rei Jeoaquim
  rationale: O hifil de בוא com sufixo pronominal significa “trazê-lo” ou “levá-lo”. Como o movimento é apresentado da perspectiva dos agentes rumo ao rei, “levaram” é natural em português.
- source_word: וַיַּכֵּהוּ בֶּחָרֶב
  choice: Ele o matou à espada
  rationale: נכה tem sentido amplo de golpear, mas, neste contexto, a menção posterior ao cadáver torna explícito o resultado fatal. “Matou à espada” comunica com clareza tanto o ato quanto o instrumento.
- source_word: נִבְלָתוֹ
  choice: seu cadáver
  rationale: נְבֵלָה designa um corpo morto ou cadáver e pode carregar uma nuance de desonra. “Cadáver” é preciso, corrente e digno em português.
- source_word: קִבְרֵי בְּנֵי הָעָם
  choice: sepulturas da gente comum
  rationale: קִבְרֵי refere-se a sepulturas ou túmulos; בְּנֵי הָעָם, literalmente “filhos do povo”, provavelmente indica pessoas comuns em contraste com um sepultamento honroso ou real. A expressão preserva essa provável distinção social.
theological_decisions:
- issue: Mudança do sujeito entre os verbos no plural e no singular
  choice: 'Manter agentes plurais na retirada e no transporte, seguidos pela ação singular de Jeoaquim: “Eles tiraram... o levaram... Ele o matou... e lançou...”'
  alternative: Entender os verbos no singular como continuação coletiva das ações dos agentes ou usar uma formulação impessoal
  rationale: O hebraico muda de וַיּוֹצִיאוּ/וַיְבִאֻהוּ, no plural, para וַיַּכֵּהוּ/וַיַּשְׁלֵךְ, no singular. O antecedente singular mais próximo é o rei Jeoaquim. A tradução mantém essa mudança gramatical e narrativa sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Gente comum” é corrente e evita o tom potencialmente depreciativo de “plebe”; a nota preserva a alternativa mais literal.
