  text: וְ/עַתָּ֗ה הֵיטִ֤יבוּ דַרְכֵי/כֶם֙ וּ/מַ֣עַלְלֵי/כֶ֔ם וְ/שִׁמְע֕וּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יִנָּחֵ֣ם יְהוָ֔ה אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/013.yaml
  text: So now[a], make your ways and your deeds good, and listen to the voice of Yahweh your God[c][b], and Yahweh will relent concerning the disaster that he has spoken against you.
translation:
  language: pt
  text: Agora, corrijam os seus caminhos e as suas ações[a] e ouçam a voz de Yahweh, o Deus de vocês[b]; e Yahweh deixará de trazer a calamidade que anunciou contra vocês[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tornem bons os seus caminhos e as suas ações”. Também pode ser traduzido por “melhorem os seus caminhos e as suas ações”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “obedeçam à voz de Yahweh, o Deus de vocês”. Em hebraico, “ouvir a voz” frequentemente inclui a ideia de obedecer.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Yahweh desistirá da calamidade” ou “Yahweh reconsiderará a calamidade”. Mais literalmente, “Yahweh se arrependerá quanto à calamidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Expressa a transição conclusiva e urgente que introduz a exortação.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: corrijam os seus caminhos e as suas ações
  rationale: Comunica em português natural o imperativo causativo, preservando tanto a metáfora ética de “caminhos” como a referência concreta às ações.
- source_word: וְשִׁמְעוּ בְּקוֹל
  choice: ouçam a voz
  rationale: Mantém a formulação hebraica e sua força retórica; no contexto, ouvir implica obedecer, nuance registrada em nota.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, o Deus de vocês
  rationale: Representa explicitamente o nome divino e traduz a construção possessiva em linguagem clara e amplamente compreensível.
- source_word: וְיִנָּחֵם יְהוָה אֶל הָרָעָה
  choice: Então Yahweh voltará atrás quanto à calamidade
  rationale: נחם no nifal descreve recuar de um juízo anunciado; “voltará atrás” preserva a mudança quanto à ação ameaçada sem sugerir arrependimento moral. “Calamidade” indica desgraça ou juízo, não maldade moral.
- source_word: אֲשֶׁר דִּבֶּר עֲלֵיכֶם
  choice: que anunciou contra vocês
  rationale: Reproduz o caráter verbal da ameaça judicial e a direção adversa expressa por עֲלֵיכֶם.
theological_decisions:
- issue: O recuo de Deus diante do juízo anunciado
  choice: Yahweh voltará atrás quanto à calamidade
  alternative: Yahweh se arrependerá da calamidade
  rationale: A redação conserva a tensão bíblica entre o anúncio divino de juízo e a possibilidade de não executá-lo após a mudança do povo, sem atribuir erro moral a Deus nem eliminar a contingência apresentada pelo texto.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções de compreensão internacional e boa legibilidade brasileira. A expressão hebraica “ouvir a voz” e a metáfora de “caminhos” foram preservadas, enquanto o causativo de היטיב foi vertido de modo idiomático.
