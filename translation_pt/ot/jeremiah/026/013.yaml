  terminology: «Caminhos», «ações», «ouçam a voz», «Yahweh» e «calamidade» são escolhas adequadas. A nota sobre «ouvir a voz» registra corretamente a força obediencial do idiomatismo hebraico. A alternativa para נחם deve ser formulada como relentar/reconsiderar quanto à calamidade, não como «lamentar a calamidade».
