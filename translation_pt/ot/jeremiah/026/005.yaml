  text: לִ/שְׁמֹ֗עַ עַל דִּבְרֵ֨י עֲבָדַ֣/י הַ/נְּבִאִ֔ים אֲשֶׁ֥ר אָנֹכִ֖י שֹׁלֵ֣חַ אֲלֵי/כֶ֑ם וְ/הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֥א שְׁמַעְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/005.yaml
  text: to listen to the words of my servants the prophets[a], whom I am sending to you, rising early and sending, though you have not listened,
translation:
  language: pt
  text: para escutarem as palavras dos meus servos, os profetas, que eu envio a vocês repetidas vezes[a], embora vocês não tenham escutado,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levantando-me cedo e enviando”, expressão hebraica que indica ação persistente e repetida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: para escutarem
  rationale: O infinitivo com ל depende da condição iniciada no versículo anterior. “Escutar” preserva tanto o ato de ouvir quanto a implicação de dar atenção, sem explicitar demais como “obedecer”.
- source_word: עַל דִּבְרֵי
  choice: as palavras
  rationale: Com שׁמע, עַל introduz aquilo que deve ser escutado. “As palavras” mantém a expressão concreta do hebraico, em vez de interpretá-la como “a mensagem”.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: meus servos, os profetas
  rationale: “Servos” corresponde ao título de agentes comissionados por Deus; “os profetas” está em aposição e identifica esses servos.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אֲלֵיכֶם
  choice: que eu envio a vocês
  rationale: O particípio indica ação em curso ou reiterada. A forma portuguesa no presente, junto de “repetidas vezes”, comunica essa continuidade com naturalidade.
- source_word: וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: repetidas vezes[a]
  rationale: A locução hebraica, literalmente ligada a levantar-se cedo e enviar, funciona idiomaticamente para destacar ação persistente e reiterada. A tradução comunica seu sentido no texto e registra sua forma literal em nota.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: embora vocês não tenham escutado
  rationale: “Embora” expressa a relação concessiva/adversativa com o envio persistente. O pretérito perfeito composto comunica a recusa continuada e relevante até o momento.
theological_decisions:
- issue: Expressão antropomórfica וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: repetidas vezes
  alternative: levantando-me cedo e enviando
  rationale: A expressão salienta a iniciativa persistente de Deus, não necessariamente uma informação literal sobre o horário. A forma idiomática é usada no texto, enquanto a imagem hebraica é preservada em nota.
- issue: Sentido de עֲבָדַי no título profético
  choice: meus servos
  alternative: meus escravos
  rationale: Neste contexto de comissão profética, o termo caracteriza os profetas como agentes a serviço de Deus; “servos” preserva esse foco sem introduzir uma ênfase indevida na condição social.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para ampla legibilidade brasileira. A redação permanece como continuação sintática do versículo anterior e conserva a vírgula final conforme o trecho fornecido.
