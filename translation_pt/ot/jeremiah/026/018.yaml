  text: מיכיה הַ/מּ֣וֹרַשְׁתִּ֔י הָיָ֣ה נִבָּ֔א בִּ/ימֵ֖י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֶל כָּל עַם֩ יְהוּדָ֨ה לֵ/אמֹ֜ר כֹּֽה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת צִיּ֞וֹן שָׂדֶ֤ה תֵֽחָרֵשׁ֙ וִ/ירוּשָׁלַ֨יִם֙ עִיִּ֣ים תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/018.yaml
  text: 'Micah the Morashtite was prophesying in the days of Hezekiah king of Judah[a], and he said to all the people of Judah, saying, “Thus says Yahweh of Armies: Zion will be plowed as a field, and Jerusalem will become ruins[c][b], and the mountain of the house will become wooded heights.”'
translation:
  language: pt
  text: 'Miqueias, de Moresete, profetizava nos dias de Ezequias, rei de Judá, e disse a todo o povo de Judá: “Assim diz Yahweh dos Exércitos: Sião será arada como um campo, Jerusalém se tornará montões de ruínas, e o monte da Casa[a] se tornará alturas cobertas de mata[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o monte do templo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “alturas de floresta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיכיה
  choice: Miqueias
  rationale: Forma portuguesa tradicional do nome do profeta; o contexto identifica o profeta de Moresete.
- source_word: הַמּוֹרַשְׁתִּי
  choice: o morastita
  rationale: Preserva o gentílico hebraico, que indica a procedência de Moresete.
- source_word: הָיָה נִבָּא
  choice: estava profetizando
  rationale: A construção com היה e particípio expressa ação passada em curso ou durativa.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém de modo natural a expressão temporal hebraica.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: Assim diz Yahweh dos Exércitos
  rationale: Conserva o nome divino e traduz צְבָאוֹת pelo sentido concreto e acessível de forças ou exércitos.
- source_word: צִיּוֹן שָׂדֶה תֵחָרֵשׁ
  choice: Sião será lavrada como um campo
  rationale: Reproduz a imagem de Sião transformada em terra cultivada, mantendo a relação predicativa da expressão hebraica.
- source_word: עִיִּים
  choice: montões de ruínas
  rationale: Expressa tanto a ideia de ruínas quanto a forma plural do substantivo hebraico.
- source_word: וְהַר הַבַּיִת
  choice: e o monte da Casa
  rationale: Preserva a formulação literal hebraica; 'Casa' se refere ao templo, esclarecido em nota.
- source_word: לְבָמוֹת יָעַר
  choice: elevações cobertas de mata
  rationale: Comunica os dois componentes da expressão — elevações e vegetação silvestre — sem impor aqui o sentido cultual possível de בָּמוֹת.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos exércitos celestiais; das hostes
  rationale: A escolha mantém o sentido plural e marcial da palavra de maneira compreensível em português moderno.
- issue: Possível sentido cultual de בָּמוֹת
  choice: elevações
  alternative: lugares altos
  rationale: No paralelismo de devastação, o sentido topográfico é adequado, mas a nota preserva a possibilidade lexical de 'lugares altos' sem transformar a ambiguidade em afirmação cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção durativa “estava profetizando” e a expressão “monte da Casa” mantêm traços relevantes do hebraico; as notas esclarecem a referência ao templo e preservam a ambiguidade lexical da cláusula final.
