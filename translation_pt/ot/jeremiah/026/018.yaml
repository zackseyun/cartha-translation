    text: Isto é, o monte do templo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “alturas de floresta”.'
    reason: lexical_alternative
  revision_rationale: A revisão substitui o gentílico artificial por uma expressão portuguesa natural de procedência, torna mais precisa a metáfora agrícola e suaviza a formulação final sem eliminar sua ambiguidade lexical. Mantêm-se o aspecto durativo, o nome divino, o título «dos Exércitos» e as duas âncoras de nota.
