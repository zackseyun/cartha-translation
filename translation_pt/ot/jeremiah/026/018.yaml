revisions:
- from: 'Miqueias, o morastita, estava profetizando nos dias de Ezequias, rei de Judá, e disse a todo o povo de Judá: “Assim diz Yahweh dos Exércitos: Sião será lavrada como um campo, Jerusalém se tornará montões de ruínas, e o monte da Casa[a] se tornará elevações cobertas de mata[b].”'
  to: 'Miqueias, de Moresete, profetizava nos dias de Ezequias, rei de Judá, e disse a todo o povo de Judá: “Assim diz Yahweh dos Exércitos: Sião será arada como um campo, Jerusalém se tornará montões de ruínas, e o monte da Casa[a] se tornará alturas cobertas de mata[b].”'
  rationale: A revisão substitui o gentílico artificial por uma expressão portuguesa natural de procedência, torna mais precisa a metáfora agrícola e suaviza a formulação final sem eliminar sua ambiguidade lexical. Mantêm-se o aspecto durativo, o nome divino, o título «dos Exércitos» e as duas âncoras de nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:37:11Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a profecia de devastação, a construção durativa de היה + particípio e os elementos principais das três cláusulas. Contudo, «morastita» não é um gentílico estabelecido ou suficientemente transparente em português; «de Moresete» expressa com segurança a procedência indicada por הַמּוֹרַשְׁתִּי. «Arada» é a opção portuguesa mais direta para a imagem de תֵחָרֵשׁ.
  naturalness: O registro é digno e claro. «Estava profetizando» é possível, mas «profetizava» conserva o aspecto durativo com maior fluência. «Elevações cobertas de mata» é compreensível, embora «alturas cobertas de mata» seja mais idiomático e mantenha melhor a imagem topográfica, sem tornar «lugares altos» uma interpretação cultual no texto principal.
  terminology: «Miqueias», «Ezequias», «Judá», «Sião» e «Yahweh dos Exércitos» são adequados. «Monte da Casa» preserva deliberadamente a expressão hebraica e a nota identifica com precisão sua referência ao monte do templo. A nota final deve oferecer uma alternativa que corresponda de modo mais próximo a בָּמוֹת יָעַר.
  issues:
  - severity: medium
    issue: «o morastita» é opaco e não corresponde a um gentílico português corrente.
    rationale: O hebraico designa Miqueias por sua procedência, Moresete. «Miqueias, de Moresete» é natural, identificável e preserva o sentido sem criar um gentílico artificial.
  - severity: low
    issue: «lavrada» é menos preciso que «arada» para a ação expressa por חרשׁ.
    rationale: No contexto da conversão de Sião em campo, «arada como um campo» comunica diretamente a imagem de ser revolvida pelo arado.
  - severity: low
    issue: A nota b, «lugares altos de uma floresta», introduz artigo indefinido e uma formulação menos próxima da construção hebraica.
    rationale: «Alturas de floresta» preserva de modo mais enxuto os componentes topográfico e florestal; o texto principal continua evitando decidir o possível matiz cultual de בָּמוֹת.
  revised_text: 'Miqueias, de Moresete, profetizava nos dias de Ezequias, rei de Judá, e disse a todo o povo de Judá: “Assim diz Yahweh dos Exércitos: Sião será arada como um campo, Jerusalém se tornará montões de ruínas, e o monte da Casa[a] se tornará alturas cobertas de mata[b].”'
  revised_footnotes:
