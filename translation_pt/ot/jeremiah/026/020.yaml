base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/020.yaml
  text: And there was also a man prophesying in the name of Yahweh[a], Uriah son of Shemaiah from Kiriath-jearim[b], and he prophesied against this city and against this land according to all the words of Jeremiah.
translation:
  language: pt
  text: 'Havia também um homem que profetizava em nome de Yahweh: Urias, filho de Semaías, de Quiriate-Jearim. Ele profetizou contra esta cidade e contra esta terra[a], de acordo com todas as palavras de Jeremias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito desta cidade e desta terra”. A preposição hebraica pode introduzir de modo mais geral o tema da profecia, embora neste contexto o sentido de juízo, “contra”, seja o mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִישׁ הָיָה מִתְנַבֵּא
  choice: Havia também um homem que profetizava
  rationale: Reproduz naturalmente em português a construção hebraica descritiva e seu aspecto contínuo, preservando também a ideia de um caso adicional.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Mantém o idioma de atuação sob autoridade divina e translitera diretamente o nome divino.
- source_word: אֽוּרִיָּהוּ בֶּן שְׁמַעְיָהוּ
  choice: Urias, filho de Semaías
  rationale: Emprega as formas portuguesas correntes dos nomes bíblicos, com identificação genealógica direta.
- source_word: מִקִּרְיַת הַיְּעָרִים
  choice: de Quiriate-Jearim
  rationale: Translitera o topônimo em forma reconhecível e natural em português.
- source_word: וַיִּנָּבֵא
  choice: Ele profetizou
  rationale: Preserva a repetição lexical do verbo hebraico e expressa a progressão narrativa com clareza.
- source_word: עַל הָעִיר הַזֹּאת וְעַל הָאָרֶץ הַזֹּאת
  choice: contra esta cidade e contra esta terra
  rationale: O sentido adversativo é favorecido pelo contexto de profecia de juízo, sem apagar a possibilidade lexical mais geral indicada em nota.
- source_word: כְּכֹל דִּבְרֵי יִרְמְיָהוּ
  choice: em plena conformidade com todas as palavras de Jeremias
  rationale: Comunica a correspondência integral indicada por כְּכֹל de modo idiomático e claro, sem afirmar dependência literária.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz explicitamente o Tetragrama; a transliteração Yahweh preserva o nome próprio divino sem substituí-lo por um título.
- issue: Valor da preposição עַל na profecia
  choice: contra esta cidade e contra esta terra
  alternative: a respeito desta cidade e desta terra
  rationale: O contexto de Jeremias 26 favorece o teor de juízo, mas a amplitude semântica da preposição é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os nomes foram aportuguesados segundo o uso bíblico corrente. A divisão em duas frases evita uma coordenação excessivamente pesada sem alterar as relações do hebraico.
