id: JER.26.10
reference: Jeremiah 26:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֣וּ שָׂרֵ֣י יְהוּדָ֗ה אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יַּעֲל֥וּ מִ/בֵּית הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה וַ/יֵּֽשְׁב֛וּ בְּ/פֶ֥תַח שַֽׁעַר יְהוָ֖ה הֶ/חָדָֽשׁ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/010.yaml
  text: When the officials of Judah heard these words[c][b][a], they went up from the king’s house to the house of Yahweh and sat at the entrance of the New Gate of Yahweh.
translation:
  language: pt
  text: Quando as autoridades de Judá[a] ouviram essas palavras, subiram do palácio[b] ao templo de Yahweh e se sentaram à entrada do Novo Portão de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os príncipes de Judá”. O termo hebraico pode designar governantes ou altos oficiais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da casa do rei”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, um portão do complexo do templo conhecido como “Novo Portão”.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  choice: as autoridades de Judá
  rationale: O termo שָׂרִים designa governantes ou altos oficiais. “Autoridades” comunica sua função pública em português atual sem sugerir necessariamente nobreza hereditária.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: דְּבָרִים pode significar palavras, coisas ou assuntos; aqui se refere à mensagem falada de Jeremias.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido usual de עלה e o movimento em direção ao recinto elevado do templo.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: do palácio
  rationale: A expressão significa literalmente “da casa do rei”; “palácio” transmite naturalmente o referente em português moderno, enquanto a forma literal é registrada em nota.
- source_word: בֵּית יְהוָה
  choice: ao templo de Yahweh
  rationale: Embora literalmente seja “casa de Yahweh”, no contexto a expressão designa o templo; esta forma evita a repetição potencialmente ambígua de “casa” após a menção ao palácio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּשְׁבוּ
  choice: e se sentaram
  rationale: Tradução direta e natural de ישׁב; qualquer função judicial do ato permanece implícita no contexto.
- source_word: בְּפֶתַח
  choice: à entrada
  rationale: פֶּתַח indica a abertura ou entrada; “à entrada” expressa naturalmente a localização.
- source_word: שַׁעַר יְהוָה הֶחָדָשׁ
  choice: Novo Portão de Yahweh
  rationale: Preserva a relação genitival do hebraico e trata “Novo Portão” como a designação conhecida de um portão do complexo do templo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Autoridades” evita a conotação hereditária de “príncipes”; “palácio” e “templo” tornam claros os referentes institucionais, enquanto as notas preservam a forma hebraica mais literal. O nome divino é mantido como Yahweh.
