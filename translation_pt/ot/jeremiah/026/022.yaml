  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֧לֶךְ יְהוֹיָקִ֛ים אֲנָשִׁ֖ים מִצְרָ֑יִם אֵ֣ת אֶלְנָתָ֧ן בֶּן עַכְבּ֛וֹר וַ/אֲנָשִׁ֥ים אִתּ֖/וֹ אֶל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/022.yaml
  text: 'Then King Jehoiakim sent men to Egypt: Elnathan son of Achbor[a], and men with him, to Egypt.'
translation:
  language: pt
  text: 'Então o rei Jeoaquim enviou homens ao Egito: Elnatã, filho de Acbor, e homens com ele, ao Egito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete «ao Egito» no fim, indicando o destino de Elnatã e dos homens com ele; a tradução preserva essa repetição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O verbo שׁלח indica diretamente o ato de enviar; “Então” expressa de modo natural a sequência narrativa do waw consecutivo.
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: o rei Jeoaquim
  rationale: A forma com título seguido do nome é natural em português e preserva a identificação do hebraico.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: Neste contexto, o plural designa agentes masculinos enviados numa missão oficial; “homens” mantém essa referência.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: אֵת
  choice: ':'
  rationale: Embora אֵת seja o marcador do objeto direto, a construção seguinte especifica os homens enviados; os dois-pontos comunicam essa identificação com clareza em português.
- source_word: אֶלְנָתָן בֶּן עַכְבּוֹר
  choice: Elnatã, filho de Acbor
  rationale: Usam-se formas portuguesas tradicionais e transparentes dos nomes, com o patronímico expresso naturalmente por “filho de”.
- source_word: וַאֲנָשִׁים אִתּוֹ
  choice: e os homens que estavam com ele
  rationale: Reproduz sem acrescentar “outros” a presença de homens acompanhando Elnatã. O artigo torna a expressão idiomática em português no contexto da especificação dos enviados.
- source_word: אֶל מִצְרָיִם
  choice: ao Egito
  rationale: A preposição אֶל indica destino. A repetição final é mantida por corresponder à formulação enfática ou esclarecedora do hebraico.
