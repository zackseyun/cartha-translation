source:
  edition: WLC
  text: הֶ/הָמֵ֣ת הֱ֠מִתֻ/הוּ חִזְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כָל יְהוּדָ֗ה הֲ/לֹא֮ יָרֵ֣א אֶת יְהוָה֒ וַ/יְחַל֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יִּנָּ֣חֶם יְהוָ֔ה אֶל הָ/רָעָ֖ה אֲשֶׁר דִּבֶּ֣ר עֲלֵי/הֶ֑ם וַ/אֲנַ֗חְנוּ עֹשִׂ֛ים רָעָ֥ה גְדוֹלָ֖ה עַל נַפְשׁוֹתֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/019.yaml
  text: Did Hezekiah king of Judah and all Judah put him to death? Did he not fear Yahweh and seek the favor of Yahweh[c][b][a], and Yahweh relented concerning the disaster that he had spoken against them? But we are doing great evil against ourselves.
translation:
  language: pt
  text: Será que Ezequias, rei de Judá, e todo Judá de fato o mataram? Não temeu Yahweh e buscou o favor de Yahweh?[a] Então Yahweh desistiu da calamidade que havia anunciado contra eles.[b][c] Nós, porém, estamos cometendo um grande mal contra nós mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “abrandou/suplicou a face de Yahweh”, expressão idiomática que significa buscar seu favor ou suplicar-lhe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh mudou de ideia quanto à calamidade” ou “Yahweh se arrependeu da calamidade”.'
    reason: alternative_reading
  - marker: c
    text: A mesma palavra hebraica, ra‘ah, é traduzida primeiro por “calamidade”, no sentido de calamidade ou juízo, e depois por “mal”, no sentido moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָמֵת הֱמִתֻהוּ
  choice: de fato o mataram
  rationale: A construção com infinitivo absoluto intensifica a ideia verbal. “De fato o mataram” reproduz a ênfase dentro da pergunta retórica sem recorrer à repetição artificial do hebraico.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Ezequias, rei de Judá
  rationale: Emprega as formas portuguesas consagradas do nome próprio e do título.
- source_word: וְכָל יְהוּדָה
  choice: e todo o Judá
  rationale: Mantém a expressão coletiva do hebraico, que se refere representativamente ao povo ou à comunidade de Judá.
- source_word: הֲלֹא יָרֵא אֶת יְהוָה
  choice: Ele não temeu Yahweh?
  rationale: “Temer” conserva o sentido de temor reverente e a ressonância teológica da expressão hebraica; a pontuação preserva a força retórica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיְחַל אֶת פְּנֵי יְהוָה
  choice: e buscou o favor de Yahweh
  rationale: Traduz de modo natural o idioma hebraico que, literalmente, fala em abrandar ou suplicar a face de Yahweh.
- source_word: וַיִּנָּחֶם יְהוָה
  choice: E Yahweh voltou atrás
  rationale: Expressa a retirada do juízo anunciado sem apagar a força antropopática nem impor uma solução filosófica à tensão do texto.
- source_word: אֶל הָרָעָה אֲשֶׁר דִּבֶּר עֲלֵיהֶם
  choice: quanto à desgraça que havia anunciado contra eles
  rationale: Neste primeiro uso, רָעָה designa calamidade ou juízo, não mal moral; “anunciado contra eles” comunica o uso profético de falar uma sentença contra alguém.
- source_word: וַאֲנַחְנוּ עֹשִׂים רָעָה גְדוֹלָה
  choice: Nós, porém, estamos cometendo um grande mal
  rationale: Aqui רָעָה tem sentido moral. “Porém” torna explícito o contraste discursivo, e “cometendo” é idiomático em português.
- source_word: עַל נַפְשׁוֹתֵינוּ
  choice: contra nós mesmos
  rationale: נפשׁ pode indicar vida, pessoa ou o próprio indivíduo; neste contexto, a expressão descreve uma ação autodestrutiva, bem comunicada por “contra nós mesmos”.
theological_decisions:
- issue: Linguagem antropopática acerca da resposta de Deus
  choice: Yahweh voltou atrás quanto à desgraça
  alternative: Yahweh mudou de ideia quanto à desgraça; Yahweh se arrependeu da desgraça
  rationale: A formulação preserva a afirmação textual de que Yahweh retirou o juízo anunciado em resposta ao temor e à súplica, sem explicar a tensão por meio de uma doutrina particular sobre a imutabilidade divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe mantém a sequência retórica do hebraico, sem introduzir uma relação causal mais explícita do que a indicada pelo texto. “Todo o Judá” conserva deliberadamente a expressão coletiva original.
