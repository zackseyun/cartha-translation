base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/009.yaml
  text: Why have you prophesied in the name of the LORD, saying, ‘This house will become like Shiloh, and this city will be laid waste, with no inhabitant’?” Then all the people gathered against Jeremiah in the house of the LORD.
translation:
  language: pt
  text: '“Por que você profetizou em nome do SENHOR, dizendo: ‘Este templo ficará como Siló, e esta cidade será devastada e ficará sem habitantes’?” Então todo o povo se reuniu contra Jeremias no templo do SENHOR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: este templo
  rationale: Embora בַּיִת signifique literalmente “casa”, o contexto identifica o edifício como o templo do SENHOR; “templo” comunica isso de modo natural e inequívoco em português.
- source_word: כְּשִׁלוֹ יִהְיֶה
  choice: ficará como Siló
  rationale: Preserva a comparação explícita e o valor futuro de יִהְיֶה, sem explicar além do texto a destruição histórica de Siló.
- source_word: תֶּחֱרַב
  choice: será devastada
  rationale: Expressa o sentido de ruína e desolação do verbo חרב, mantendo a voz e a força da ameaça profética.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ficará sem habitantes
  rationale: Formulação portuguesa natural para a ausência total de moradores; o plural genérico é idiomático, embora o hebraico use o singular coletivo “habitante”.
- source_word: וַיִּקָּהֵל ... אֶל
  choice: se reuniu contra
  rationale: O verbo descreve o ajuntamento e a preposição, neste contexto hostil, indica que a multidão se concentrou contra Jeremias.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o tetragrama por SENHOR em versaletes.
theological_decisions:
- issue: Identificação de הַבַּיִת como templo
  choice: este templo
  alternative: esta casa
  rationale: O próprio versículo situa a cena no “templo do SENHOR”; a escolha esclarece o referente sem acrescentar uma interpretação denominacional.
- issue: Força hostil do ajuntamento do povo
  choice: se reuniu contra Jeremias
  alternative: se reuniu junto de Jeremias
  rationale: A cena e a construção אֶל־יִרְמְיָהוּ favorecem um ajuntamento adverso, como também evidencia o contexto imediato, sem especificar uma ação violenta não declarada neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a pergunta acusatória, a fala profética citada e a repetição solene de “SENHOR”. Não são necessárias notas de rodapé neste versículo.
