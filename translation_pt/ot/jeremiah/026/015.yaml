  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֣ךְ יָדֹ֣עַ תֵּדְע֗וּ כִּ֣י אִם מְמִתִ֣ים אַתֶּם֮ אֹתִ/י֒ כִּי דָ֣ם נָקִ֗י אַתֶּם֙ נֹתְנִ֣ים עֲלֵי/כֶ֔ם וְ/אֶל הָ/עִ֥יר הַ/זֹּ֖את וְ/אֶל יֹשְׁבֶ֑י/הָ כִּ֣י בֶ/אֱמֶ֗ת שְׁלָחַ֤/נִי יְהוָה֙ עֲלֵי/כֶ֔ם לְ/דַבֵּר֙ בְּ/אָזְנֵי/כֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/015.yaml
  text: Only know for certain that if you put me to death[a], you are bringing innocent blood on yourselves, on this city, and on its inhabitants[b]; for in truth Yahweh has sent me to you to speak all these words in your hearing.
translation:
  language: pt
  text: 'Só tenham plena certeza de uma coisa: se vocês me executarem[a], farão recair sangue inocente sobre vocês, sobre esta cidade e sobre os seus habitantes; pois, na verdade, Yahweh me enviou a vocês para lhes falar todas estas palavras, para que vocês as ouçam[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me matarem”. O verbo hebraico é causativo; “executarem” ressalta o contexto judicial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em seus ouvidos”. É uma expressão que significa falar diretamente para que ouçam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ יָדֹעַ תֵּדְעוּ
  choice: Só tenham plena certeza de uma coisa
  rationale: אַךְ dá força restritiva ou enfática à advertência, e a construção intensiva יָדֹעַ תֵּדְעוּ exige certeza enfática. A formulação portuguesa preserva ambas sem soar artificial.
- source_word: כִּי אִם מְמִתִים אַתֶּם אֹתִי
  choice: se vocês me executarem
  rationale: O hifil de מות é causativo e, neste contexto judicial, descreve levar Jeremias à morte por decisão oficial. “Executarem” é natural, conciso e mais específico que “matarem”.
- source_word: דָם נָקִי
  choice: sangue inocente
  rationale: Expressão hebraica tradicional para sangue derramado injustamente; o equivalente português preserva a imagem concreta e sua dimensão moral.
- source_word: נֹתְנִים עֲלֵיכֶם וְאֶל הָעִיר הַזֹּאת וְאֶל יֹשְׁבֶיהָ
  choice: farão recair ... sobre vocês, sobre esta cidade e sobre os seus habitantes
  rationale: A formulação comunica que a responsabilidade e as consequências do sangue derramado atingirão os executores, a cidade e seus moradores, mantendo a imagem de algo posto sobre eles.
- source_word: בֶאֱמֶת
  choice: na verdade
  rationale: Preserva a afirmação solene da realidade e autenticidade da missão profética.
- source_word: שְׁלָחַנִי יְהוָה עֲלֵיכֶם
  choice: Yahweh me enviou a vocês
  rationale: O perfeito apresenta o envio já realizado e ainda válido; עַל indica aqui a direção da missão profética ao público.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְדַבֵּר בְּאָזְנֵיכֶם
  choice: para dizer ... aos seus ouvidos
  rationale: Mantém a imagem concreta do hebraico, literalmente “falar aos ouvidos”, numa construção compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar uma vocalização posterior.
- issue: Natureza da responsabilidade por sangue inocente
  choice: Manter a imagem de fazer recair sangue inocente sobre os responsáveis, a cidade e seus habitantes
  alternative: Explicitar “culpa pelo derramamento de sangue inocente”
  rationale: O hebraico diz literalmente “sangue inocente”, não o substantivo abstrato “culpa”. A tradução conserva a imagem e deixa que sua implicação jurídica e teológica emerja do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais ao leitor brasileiro. A abertura enfática evita uma reprodução rígida da construção hebraica, e “aos seus ouvidos” conserva deliberadamente sua imagem concreta.
