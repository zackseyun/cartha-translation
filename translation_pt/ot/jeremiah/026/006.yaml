  text: וְ/נָתַתִּ֛י אֶת הַ/בַּ֥יִת הַ/זֶּ֖ה כְּ/שִׁלֹ֑ה וְ/אֶת הָ/עִ֤יר ה/זאתה אֶתֵּ֣ן לִ/קְלָלָ֔ה לְ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/006.yaml
  text: then I will make this house like Shiloh[b][a], and I will make this city a curse to all the nations of the earth.
translation:
  language: pt
  text: então farei com que esta casa fique como Siló[a], e farei desta cidade uma maldição para todas as nações da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siló havia sido o antigo local do santuário e foi atingida pelo juízo; a comparação indica devastação e rejeição.
    reason: cultural_note
  - marker: b
    text: 'Ou: “farei desta cidade objeto de maldição para todas as nações da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: então farei
  rationale: Embora נתן signifique literalmente “dar, pôr”, nesta construção de juízo exprime fazer com que algo assuma determinada condição. “Então” liga naturalmente a declaração à condição do versículo anterior.
- source_word: הַבַּיִת הַזֶּה
  choice: desta casa
  rationale: Mantém o sentido literal de בַּיִת e sua ressonância como casa do SENHOR, embora o referente contextual seja o templo.
- source_word: כְּשִׁלֹה
  choice: como Siló
  rationale: A preposição כְּ marca comparação; o topônimo é preservado e a nota esclarece a alusão histórica.
- source_word: הָעִיר הַזֹּאת
  choice: desta cidade
  rationale: Tradução direta da expressão demonstrativa, que no contexto se refere a Jerusalém.
- source_word: אֶתֵּן לִקְלָלָה
  choice: farei ... uma maldição
  rationale: Reproduz de modo conciso o idioma hebraico, sem decidir no texto principal se a cidade se torna propriamente uma maldição ou um exemplo citado ao amaldiçoar.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: para todas as nações da terra
  rationale: Aqui הָאָרֶץ tem alcance mundial, e “para” expressa naturalmente a relação ou efeito indicado por לְ.
theological_decisions:
- issue: Designação do templo
  choice: desta casa
  alternative: deste templo
  rationale: O hebraico diz “casa”. Preservar essa forma mantém a imagem teológica da casa do SENHOR sem obscurecer o referente no contexto.
- issue: Sentido da fórmula de juízo sobre a cidade
  choice: farei desta cidade uma maldição
  alternative: farei desta cidade objeto de maldição
  rationale: O idioma pode indicar que a cidade se tornará uma fórmula ou exemplo de maldição, ou objeto de maldições. A tradução principal conserva a expressão compacta, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Casa” preserva o vocabulário hebraico; “Siló” segue a forma tradicional portuguesa. Os marcadores foram posicionados junto aos elementos que explicam.
