  text: אוּלַ֣י יִשְׁמְע֔וּ וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וְ/נִחַמְתִּ֣י אֶל הָ/רָעָ֗ה אֲשֶׁ֨ר אָנֹכִ֤י חֹשֵׁב֙ לַ/עֲשׂ֣וֹת לָ/הֶ֔ם מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/003.yaml
  text: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
translation:
  language: pt
  text: Talvez eles escutem[a], e cada um se volte do seu mau caminho[b]; e desistirei da calamidade[c] que planejo trazer sobre eles por causa da maldade das suas ações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouçam”; em contextos proféticos, o verbo hebraico pode indicar tanto ouvir quanto dar atenção ao que foi dito.
    reason: lexical_alternative
  - marker: b
    text: Ou “volte” ou “se arrependa do seu mau caminho”.
    reason: lexical_alternative
  - marker: c
    text: Ou “mudarei de intenção quanto à calamidade”. O hebraico emprega linguagem humana para descrever Deus deixando de executar o juízo anunciado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Talvez
  rationale: Expressa a possibilidade e a esperança presentes na partícula hebraica, sem acrescentar uma explicação sobre o conhecimento divino.
- source_word: יִשְׁמְעוּ
  choice: escutem
  rationale: No contexto profético, שׁמע pode indicar tanto ouvir quanto dar atenção e obedecer; “escutem” comunica melhor essa amplitude do que o mero ato auditivo.
- source_word: וְיָשֻׁבוּ
  choice: se afaste
  rationale: שׁוב significa voltar ou mudar de direção. Com “do seu mau caminho”, “se afaste” conserva a imagem de abandonar um rumo moralmente mau em português natural.
- source_word: אִישׁ
  choice: cada um
  rationale: Reproduz o uso distributivo do singular hebraico sem introduzir uma especificação masculina desnecessária em português.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: do seu mau caminho
  rationale: Mantém a metáfora profética de דרך como curso de vida e verte רעה em seu sentido moral.
- source_word: וְנִחַמְתִּי
  choice: voltarei atrás
  rationale: Neste contexto de juízo, נחם descreve Deus deixando de executar a calamidade anunciada. A expressão conserva a linguagem relacional e a real condicionalidade do texto sem sugerir arrependimento de uma falta moral.
- source_word: אֶל הָרָעָה
  choice: quanto à calamidade
  rationale: Aqui רעה se refere à desgraça ou calamidade do juízo, não ao mal moral; “quanto a” representa naturalmente a relação expressa por אֶל.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: que planejo trazer sobre eles
  rationale: חשב com infinitivo exprime plano ou intenção; “trazer sobre eles” transmite em português natural a ideia idiomática de fazer-lhes sobrevir a calamidade.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיהֶם
  choice: por causa da maldade das suas ações
  rationale: Preserva a relação causal e distingue a maldade moral das ações da calamidade judicial mencionada antes.
theological_decisions:
- issue: Tradução de נחם quando o sujeito é Deus
  choice: voltarei atrás quanto à calamidade
  alternative: mudarei de intenção quanto à calamidade; desistirei da calamidade
  rationale: A formulação mantém a tensão do texto, no qual Deus declara que não executará o juízo anunciado se o povo mudar de conduta. Evita tanto apagar essa condicionalidade quanto insinuar que Deus precisa arrepender-se de um erro moral.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva as metáforas proféticas centrais e distingue “maldade” moral de “calamidade” como juízo.
