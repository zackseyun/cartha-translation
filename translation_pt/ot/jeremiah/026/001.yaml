id: JER.26.1
reference: Jeremiah 26:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֗ית מַמְלְכ֛וּת יְהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָה֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came from Yahweh, saying[c][b],
translation:
  language: pt
  text: 'No início[a] do reinado de Jeoaquim, filho de Josias, rei de Judá, esta palavra veio[b] da parte de Yahweh[c], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos primeiros tempos do reinado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “esta palavra foi da parte de”; “veio da parte de” expressa a fórmula profética em português natural.'
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” translitera o nome divino יהוה (YHWH); tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: No início
  rationale: A expressão assinala o período inicial de um acontecimento ou estado. “No início” é natural em português e preserva seu valor temporal.
- source_word: מַמְלְכוּת
  choice: reinado
  rationale: Com o nome de um rei, o termo designa o período ou exercício de seu governo, não o território do reino.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: filho de Josias
  rationale: Tradução direta e natural da expressão genealógica hebraica.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Título em aposição que identifica Jeoaquim.
- source_word: הָיָה הַדָּבָר הַזֶּה
  choice: esta palavra veio
  rationale: Embora o hebraico diga literalmente “esta palavra foi/esteve”, “a palavra veio” reproduz de modo natural em português a fórmula de introdução profética.
- source_word: דָּבָר
  choice: palavra
  rationale: No contexto profético, refere-se a uma comunicação divina. “Palavra” conserva o idioma bíblico e seu peso teológico.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: A construção marca a fonte ou origem da palavra; “da parte de” expressa isso com naturalidade em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a estrutura discursiva hebraica e introduz a fala direta que começa no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo silenciosamente por um título.
- issue: Valor profético de דָּבָר
  choice: palavra
  alternative: mensagem
  rationale: “Palavra” preserva tanto o sentido de comunicação divina quanto o caráter tradicional da fórmula profética, sem reduzir o termo a uma paráfrase explicativa.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas reconhecíveis. A ordem da frase acompanha o hebraico sem sacrificar a naturalidade; “dizendo:” foi mantido para ligar este versículo à fala direta subsequente.
