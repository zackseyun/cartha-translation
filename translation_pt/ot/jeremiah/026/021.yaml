base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/021.yaml
  text: When King Jehoiakim[a], and all his mighty men, and all the officials heard his words, the king sought to put him to death. But when Uriah heard[b], he was afraid and fled and went to Egypt.
translation:
  language: pt
  text: Quando o rei Jeoaquim, todos os seus guerreiros[a] e todos os oficiais ouviram as palavras de Urias, o rei procurou matá-lo. Mas quando Urias soube disso, teve medo, fugiu e foi para o Egito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais formal, “seus homens valentes”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “veio ao Egito”; em português, o movimento em direção a esse destino é expresso naturalmente por “foi para o Egito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹרָיו
  choice: seus guerreiros
  rationale: O termo גִּבּוֹר pode designar homens valentes ou combatentes ligados ao rei. “Guerreiros” comunica com clareza o provável sentido militar neste contexto.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: שָׂרִים designa autoridades ou altos membros da administração. “Oficiais” se ajusta ao contexto da corte sem sugerir necessariamente príncipes de sangue real.
- source_word: דְּבָרָיו
  choice: as palavras de Urias
  rationale: O hebraico diz literalmente “as palavras dele”. A explicitação do referente evita em português uma possível associação ambígua com Jeoaquim, sem alterar o conteúdo.
- source_word: וַיְבַקֵּשׁ הַמֶּלֶךְ הֲמִיתוֹ
  choice: o rei procurou matá-lo
  rationale: A construção בִּקֵּשׁ com infinitivo expressa intenção ou tentativa. “Procurou matá-lo” preserva essa nuance e soa natural em português.
- source_word: וַיִּשְׁמַע אוּרִיָּהוּ
  choice: quando Urias soube disso
  rationale: Aqui שׁמע significa tomar conhecimento da intenção do rei, não apenas perceber um som. “Soube disso” expressa naturalmente o objeto implícito no hebraico.
- source_word: וַיִּרָא
  choice: teve medo
  rationale: Forma narrativa corrente e direta para a reação de temor de Urias.
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: Equivalente conciso e natural que conserva a urgência do verbo hebraico.
- source_word: וַיָּבֹא מִצְרָיִם
  choice: foi para o Egito
  rationale: Embora בוא tenha como sentido básico “vir/entrar”, em português o movimento até um destino afastado do ponto narrativo é expresso naturalmente por “foi para”.
- source_word: וַ
  choice: Mas, quando Urias soube disso
  rationale: O waw faz avançar a narrativa; “mas” torna explícito o contraste contextual entre a intenção do rei e a reação de Urias, sem acrescentar uma ideia estranha ao texto.
