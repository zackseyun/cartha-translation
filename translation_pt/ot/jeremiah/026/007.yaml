base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/007.yaml
  text: And the priests and the prophets and all the people heard Jeremiah speaking these words in the house of Yahweh[a].
translation:
  language: pt
  text: Os sacerdotes, os profetas e todo o povo ouviram Jeremias dizer essas palavras na casa de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no templo de Yahweh”. Literalmente: “na casa de Yahweh”.'
    reason: Alternativa lexical e esclarecimento da expressão hebraica.
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ouviram
  rationale: O imperfeito com waw consecutivo narra um acontecimento passado. “Ouviram” expressa o sentido simples de שׁמע sem acrescentar a ideia interpretativa de obedecer.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: os sacerdotes, os profetas e todo o povo
  rationale: Mantém os três grupos coordenados e os artigos do hebraico, com pontuação natural em português.
- source_word: אֶת יִרְמְיָהוּ
  choice: Jeremias
  rationale: O marcador de objeto direto não recebe tradução; o nome assume sua forma portuguesa convencional.
- source_word: מְדַבֵּר
  choice: dizer
  rationale: Depois de “ouviram”, o infinitivo é uma construção natural em português para apresentar Jeremias no ato de proferir as palavras. “Falando” seria mais formalmente próximo, mas menos fluente neste contexto.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: No contexto de uma proclamação, דְּבָרִים designa palavras. “Essas” retoma naturalmente, em português, o discurso precedente.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a expressão hebraica literal “casa de Yahweh”; “templo de Yahweh” é a alternativa contextual explicitada na nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo silenciosamente pelo título “Senhor”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação hebraica foi vertida com pontuação portuguesa natural; a expressão “casa de Yahweh” foi preservada no texto e esclarecida em nota.
