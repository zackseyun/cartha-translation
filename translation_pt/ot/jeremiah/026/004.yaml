  text: 'And you shall say to them, ‘Thus says the LORD: If you do not listen to me, to walk in my law that I have set before you,’'
translation:
  language: pt
  text: 'E você lhes dirá: “Assim diz o SENHOR: Se vocês não me ouvirem, seguindo a minha lei que coloquei diante de vocês,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: E você lhes dirá
  rationale: Preserva a forma verbal dirigida a Jeremias e traduz o pronome plural de modo natural em português.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino pelo título em versaletes.
- source_word: תִשְׁמְעוּ אֵלַי
  choice: vocês não me ouvirem
  rationale: Mantém o sentido básico de ouvir, que no contexto também implica dar atenção e obedecer, sem reduzir a expressão apenas a 'obedecer'.
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: seguindo a minha lei
  rationale: Expressa em português corrente a metáfora hebraica de andar segundo a lei, conservando a relação com o ato de ouvir sem criar uma segunda oração negativa ausente do hebraico.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: que coloquei diante de vocês
  rationale: Reproduz a imagem de algo apresentado ou posto diante do povo.
theological_decisions:
- issue: Relação entre ouvir a Deus e andar em sua lei
  choice: “não me ouvirem, seguindo a minha lei”
  alternative: “não me ouvirem nem seguirem a minha lei”
  rationale: A alternativa é idiomática, mas acrescenta uma segunda negação coordenada e torna mais explícita uma relação que o infinitivo hebraico deixa sintaticamente aberta. A redação escolhida conserva melhor essa tensão.
- issue: Tradução de תּוֹרָה
  choice: “lei”
  alternative: “instrução”
  rationale: Embora o termo possa significar instrução, neste contexto profético a referência é à norma divina já apresentada ao povo; 'lei' é clara, tradicional e não exige restringir o referente a um código específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A oração permanece aberta ao versículo seguinte, por isso termina com vírgula e sem fechar as aspas.
