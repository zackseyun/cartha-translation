base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/012.yaml
  text: Then Yirmeyahu said to all the officials and to all the people, saying, “The LORD sent me to prophesy against this house and against this city all the words that you have heard.”
translation:
  language: pt
  text: 'Então Jeremias disse a todas as autoridades e a todo o povo: “O SENHOR me enviou para profetizar contra este templo e contra esta cidade todas as palavras que vocês ouviram.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: os líderes
  rationale: Designa as autoridades civis presentes; “líderes” é natural e amplamente compreensível em português, sem sugerir necessariamente nobreza hereditária.
- source_word: יְהוָה
  choice: O SENHOR
  rationale: Segue a convenção portuguesa consagrada de representar o nome divino por SENHOR em versaletes.
- source_word: הַבַּיִת הַזֶּה
  choice: este templo
  rationale: Embora בַּיִת signifique literalmente “casa”, no contexto refere-se inequivocamente ao templo do SENHOR; “templo” comunica o referente de modo natural.
- source_word: לְהִנָּבֵא אֶל
  choice: profetizar contra
  rationale: A preposição אֶל pode ser direcional, mas o conteúdo judicial do discurso dirigido ao templo e à cidade justifica “contra”, preservando a força adversativa contextual.
- source_word: לֵאמֹר
  choice: introdução direta omitida
  rationale: O infinitivo formulaico hebraico introduz as palavras citadas; em português, os dois-pontos cumprem naturalmente essa função, evitando o pouco idiomático “dizendo”.
theological_decisions:
- issue: Identificação do remetente divino
  choice: O SENHOR
  alternative: Yahweh
  rationale: A tradução mantém explicitamente o sujeito divino sem introduzir interpretação denominacional; usa a convenção editorial portuguesa para o Tetragrama.
- issue: Direção hostil da profecia
  choice: contra este templo e contra esta cidade
  alternative: a respeito deste templo e desta cidade
  rationale: O contexto imediato é de anúncio de juízo. “Contra” expressa essa força sem acrescentar o teor específico da sentença.
translation_notes:
  register: 'Português moderno, digno e de leitura natural, com tratamento plural “vocês”. A sintaxe hebraica foi levemente ajustada: לֵאמֹר é representado pelos dois-pontos, e o nome Jeremias segue a forma portuguesa tradicional.'
