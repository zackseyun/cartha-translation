  text: וַ/אֲנִ֖י הִנְ/נִ֣י בְ/יֶדְ/כֶ֑ם עֲשׂוּ לִ֛/י כַּ/טּ֥וֹב וְ/כַ/יָּשָׁ֖ר בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/014.yaml
  text: But as for me[a], here I am in your hand[b]. Do to me what is good and right in your eyes.
translation:
  language: pt
  text: Quanto a mim, aqui estou nas mãos de vocês.[a] Façam comigo o que parecer bom e justo aos olhos de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão de vocês”, expressão idiomática que significa estar sob o poder ou controle de alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como vocês acharem melhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: O pronome independente introduz uma mudança contrastiva para a situação de Jeremias; a formulação é natural em português sem tornar explícito demais o valor adversativo do waw.
- source_word: הִנְנִי
  choice: aqui estou
  rationale: Preserva a força apresentativa da fórmula hebraica e comunica disponibilidade ou entrega em linguagem atual e digna.
- source_word: בְיֶדְכֶם
  choice: nas mãos de vocês
  rationale: Embora o hebraico empregue o singular idiomático, o plural é a expressão portuguesa natural para estar sob o poder ou controle de várias pessoas, mantendo a imagem da mão.
- source_word: עֲשׂוּ לִי
  choice: Façam comigo
  rationale: Expressa naturalmente em português a ação dirigida a Jeremias no contexto judicial, sem especificar qual será essa ação.
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: o que parecer bom e justo
  rationale: A construção estabelece o critério segundo a avaliação dos ouvintes. “Bom e justo” preserva tanto o juízo favorável quanto a dimensão moral e judicial de יָשָׁר.
- source_word: בְּעֵינֵיכֶם
  choice: aos olhos de vocês
  rationale: Mantém a metáfora hebraica para julgamento ou avaliação pessoal, em uma expressão compreensível no português moderno.
