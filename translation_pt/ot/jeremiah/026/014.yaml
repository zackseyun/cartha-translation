translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O uso de “vocês” corresponde ao plural hebraico; “nas mãos” naturaliza o idioma sem perder sua imagem. Os marcadores de nota aparecem imediatamente após as expressões pertinentes.
