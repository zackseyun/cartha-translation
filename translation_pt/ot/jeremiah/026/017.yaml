  text: Then some of the elders of the land stood up and said to all the assembly of the people[a], saying,
translation:
  language: pt
  text: 'Então alguns dos anciãos da terra se levantaram e disseram a toda a assembleia do povo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: O qal narrativo de קום indica que eles se ergueram para tomar a palavra ou agir; “se levantaram” é natural e preserva a cena pública.
- source_word: אֲנָשִׁים מִזִּקְנֵי הָאָרֶץ
  choice: alguns dos anciãos da terra
  rationale: A construção מן partitiva indica homens pertencentes ao grupo dos anciãos. Em português, “alguns dos anciãos” expressa isso com naturalidade, sem perder a referência masculina já contida em “anciãos”.
- source_word: וַיֹּאמְרוּ
  choice: disseram
  rationale: אמר introduz a fala que começa no versículo seguinte; “disseram” é a equivalência narrativa corrente.
- source_word: אֶל כָּל קְהַל הָעָם
  choice: a toda a assembleia do povo
  rationale: קהל designa a comunidade reunida em assembleia, e כָּל é representado por “toda”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala seguinte. Em português atual, os dois-pontos desempenham essa função com mais naturalidade do que a reprodução literal “dizendo”.
