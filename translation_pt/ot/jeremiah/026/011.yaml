  text: וַ/יֹּ֨אמְר֜וּ הַ/כֹּהֲנִ֤ים וְ/הַ/נְּבִאִים֙ אֶל הַ/שָּׂרִ֔ים וְ/אֶל כָּל הָ/עָ֖ם לֵ/אמֹ֑ר מִשְׁפַּט מָ֨וֶת֙ לָ/אִ֣ישׁ הַ/זֶּ֔ה כִּ֤י נִבָּא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֥ר שְׁמַעְתֶּ֖ם בְּ/אָזְנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/011.yaml
  text: Then the priests and the prophets said to the officials and to all the people, saying, “A sentence of death is for this man, because he has prophesied against this city, just as you have heard with your own ears.”
translation:
  language: pt
  text: 'Então os sacerdotes e os profetas disseram às autoridades e a todo o povo: “Este homem deve ser condenado à morte, pois profetizou contra esta cidade, como vocês ouviram com os próprios ouvidos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: No contexto judicial, refere-se aos dirigentes ou oficiais com função pública; “autoridades” é natural e suficientemente amplo em português.
- source_word: מִשְׁפַּט מָוֶת לָאִישׁ הַזֶּה
  choice: Este homem deve ser condenado à morte
  rationale: Expressa de modo natural a declaração judicial hebraica, literalmente próxima de “julgamento/sentença de morte para este homem”, sem acrescentar que a execução já tenha sido decretada.
- source_word: נִבָּא אֶל הָעִיר הַזֹּאת
  choice: profetizou contra esta cidade
  rationale: Embora אֶל normalmente indique direção, o conteúdo hostil da profecia neste contexto justifica “contra”, preservando o sentido da acusação.
- source_word: כַּאֲשֶׁר שְׁמַעְתֶּם בְּאָזְנֵיכֶם
  choice: como vocês ouviram com os próprios ouvidos
  rationale: Mantém a ênfase idiomática do hebraico no testemunho auditivo direto.
theological_decisions:
- issue: Natureza da reivindicação de pena capital
  choice: deve ser condenado à morte
  alternative: merece a morte / uma sentença de morte cabe a este homem
  rationale: A formulação preserva a fala como acusação e exigência judicial dos sacerdotes e profetas, sem apresentá-la como veredito divino ou como sentença já formalmente proferida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O infinitivo hebraico לֵאמֹר foi representado naturalmente pelos dois-pontos que introduzem a fala direta, evitando o pouco idiomático “dizendo” após “disseram”.
