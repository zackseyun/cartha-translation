  source_fidelity: A tradução transmite corretamente os participantes, os destinatários, a acusação e a fórmula judicial hebraica. “Deve ser condenado à morte” é uma representação idiomática aceitável de מִשְׁפַּט מָוֶת לָאִישׁ הַזֶּה no contexto de uma acusação pública; não transforma a fala em decreto divino nem afirma que a execução já ocorreu. “Contra esta cidade” é sustentado pelo teor hostil da profecia no contexto.
