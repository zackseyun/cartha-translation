base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/013.yaml
  text: And Johanan son of Kareah[a], and all the commanders of the forces who were in the open country, came to Gedaliah at Mizpah.
translation:
  language: pt
  text: E Joanã, filho de Careá, e todos os comandantes das tropas que estavam na região rural[a] vieram até Gedalias, em Mispá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no campo” ou “nos campos”. A expressão hebraica pode designar literalmente o campo ou, de modo mais amplo, a zona rural.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְ/יֽוֹחָנָן
  choice: E Joanã
  rationale: A conjunção simples mantém a continuidade narrativa sem especificar uma relação temporal, e o nome recebe a forma portuguesa tradicional.
- source_word: בֶּן קָרֵחַ
  choice: filho de Careá
  rationale: Reproduz de modo natural o patronímico hebraico e usa uma transliteração adequada ao português.
- source_word: וְ/כָל שָׂרֵי הַ/חֲיָלִים
  choice: e todos os comandantes das tropas
  rationale: שָׂרֵי designa líderes ou comandantes, enquanto חֲיָלִים se refere aqui às forças militares; “tropas” é claro e corrente em português.
- source_word: אֲשֶׁר בַּ/שָּׂדֶה
  choice: que estavam na região rural[a]
  rationale: A expressão distingue os comandantes que se encontravam fora dos centros urbanos. “Região rural” comunica o sentido geográfico, enquanto a nota preserva a formulação mais literal e sua amplitude lexical.
- source_word: בָּ֥אוּ אֶל גְּדַלְיָהוּ
  choice: vieram até Gedalias
  rationale: בוא expressa movimento em direção a alguém ou algum lugar; “vieram até” preserva esse movimento e soa natural em português.
- source_word: הַ/מִּצְפָּתָ/ה
  choice: em Mispá
  rationale: Embora o ה direcional indique movimento rumo a Mispá, a frase portuguesa apresenta naturalmente Mispá como o lugar onde Gedalias estava, evitando a repetição pouco fluida de “até”.
