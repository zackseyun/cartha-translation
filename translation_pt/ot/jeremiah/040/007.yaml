  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֗ה הֵ֚מָּה וְ/אַנְשֵׁי/הֶ֔ם כִּֽי הִפְקִ֧יד מֶֽלֶךְ בָּבֶ֛ל אֶת גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם בָּ/אָ֑רֶץ וְ/כִ֣י הִפְקִ֣יד אִתּ֗/וֹ אֲנָשִׁ֤ים וְ/נָשִׁים֙ וָ/טָ֔ף וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ מֵ/אֲשֶׁ֥ר לֹֽא הָגְל֖וּ בָּבֶֽלָ/ה־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/007.yaml
  text: When all the commanders of the forces who were in the open country[a], they and their men, heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land, and that he had entrusted to him men, women, children, and some of the poorest of the land, from those who had not been exiled to Babylon[c][b],
translation:
  language: pt
  text: Quando todos os comandantes das tropas que estavam em campo aberto[a], eles e seus homens, ouviram que o rei da Babilônia havia nomeado Gedalias, filho de Aicão, como responsável pelo país e que lhe havia confiado homens, mulheres, crianças e alguns dos pobres da terra[b], dentre os que não haviam sido deportados para a Babilônia[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no campo” ou “na zona rural”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “alguns dos humildes da terra”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico usa um verbo ativo plural sem agente expresso, com o sentido de: “dentre os que não foram deportados para a Babilônia”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: comandantes das tropas
  rationale: Expressa de modo natural a liderança militar indicada por שָׂרֵי e o sentido coletivo militar de חֲיָלִים, sem especificar uma patente não declarada.
- source_word: בַּשָּׂדֶה
  choice: em campo aberto
  rationale: Preserva a imagem de 'campo' e, no contexto, comunica que estavam fora dos centros urbanos ou do controle estabelecido.
- source_word: וְאַנְשֵׁיהֶם
  choice: e seus homens
  rationale: Tradução direta e idiomática; o contexto deixa claro que se trata dos homens ligados aos comandantes, provavelmente seus soldados.
- source_word: הִפְקִיד ... בָּאָרֶץ
  choice: havia nomeado ... sobre a terra
  rationale: A primeira ocorrência do verbo descreve uma nomeação oficial, e 'sobre a terra' preserva a ideia de autoridade jurisdicional.
- source_word: הִפְקִיד אִתּוֹ
  choice: lhe havia confiado
  rationale: Na segunda ocorrência, o verbo indica que pessoas foram colocadas sob a responsabilidade de Gedalias; evita uma repetição artificial de 'nomeado'.
- source_word: אֲנָשִׁים וְנָשִׁים וָטָף
  choice: homens, mulheres, crianças
  rationale: Verte טָף em linguagem contemporânea clara, sem introduzir uma categoria mais ampla e incerta como 'dependentes'.
- source_word: מִדַּלַּת הָאָרֶץ
  choice: alguns dos pobres da terra
  rationale: Comunica tanto a força partitiva de מִן quanto a condição social humilde indicada por דַּלַּת, sem intensificar necessariamente para 'os mais pobres'.
- source_word: מֵאֲשֶׁר לֹא הָגְלוּ בָּבֶלָה
  choice: dentre os que não haviam sido deportados para a Babilônia
  rationale: A forma ativa plural tem agentes não expressos; em português, a passiva mantém o foco nas pessoas e transmite com clareza a remoção forçada.
- source_word: וַיִּשְׁמְעוּ
  choice: Quando ... ouviram
  rationale: O waw narrativo e a construção do período conduzem à continuação no versículo seguinte; 'Quando' preserva essa relação sem acrescentar um marcador como 'Ora'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O versículo permanece como oração subordinada terminada por vírgula, pois a frase continua no versículo 8. A retomada enfática 'eles e seus homens' foi mantida para refletir הֵמָּה וְאַנְשֵׁיהֶם, apesar de ser mais marcada em português.
