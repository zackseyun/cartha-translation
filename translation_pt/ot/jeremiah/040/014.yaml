  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הֲ/יָדֹ֤עַ תֵּדַע֙ כִּ֞י בַּעֲלִ֣יס מֶ֣לֶךְ בְּנֵֽי עַמּ֗וֹן שָׁלַח֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה לְ/הַכֹּתְ/ךָ֖ נָ֑פֶשׁ וְ/לֹא הֶאֱמִ֣ין לָ/הֶ֔ם גְּדַלְיָ֖הוּ בֶּן אֲחִיקָֽם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/014.yaml
  text: And they said to him[b][a], “Do you really know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to strike you down?” But Gedaliah son of Ahikam did not believe them.
translation:
  language: pt
  text: 'E eles lhe disseram: “Você sabe mesmo[a] que Baalis, rei dos amonitas, enviou Ismael, filho de Netanias, para tirar a sua vida[b]?” Mas Gedalias, filho de Aicão, não acreditou neles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Você sabe com certeza...?” O hebraico combina um infinitivo absoluto com um verbo conjugado para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ferir você na vida/alma”, expressão idiomática que significa matar ou tirar a vida de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדֹעַ תֵּדַע
  choice: Você sabe mesmo
  rationale: A combinação do infinitivo absoluto com o verbo conjugado intensifica a pergunta. “Sabe mesmo” transmite essa ênfase em português atual e natural.
- source_word: בַּעֲלִיס
  choice: Baalis
  rationale: Transliteração do nome próprio hebraico.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: rei dos amonitas
  rationale: Forma idiomática e clara de designar o rei do povo de Amom, sem reproduzir literalmente “filhos de Amom”.
- source_word: שָׁלַח
  choice: enviou
  rationale: O pretérito perfeito expressa naturalmente a ação anterior cujo propósito continua relevante no momento da advertência.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismael, filho de Netanias
  rationale: Emprega formas tradicionais e reconhecíveis dos nomes bíblicos em português e explicita a relação filial.
- source_word: לְהַכֹּתְךָ נָפֶשׁ
  choice: para tirar a sua vida
  rationale: A expressão hebraica é literalmente próxima de “ferir você quanto à vida/alma”, mas funciona como um idiomatismo para matar. “Tirar a sua vida” preserva a referência pessoal a נֶפֶשׁ e soa natural em português.
- source_word: הֶאֱמִין לָהֶם
  choice: não acreditou neles
  rationale: Neste contexto, o hifil de אמן indica dar crédito ao que alguém afirma. “Não acreditou neles” se ajusta melhor à rejeição da advertência do que “não confiou neles”.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Gedalias, filho de Aicão
  rationale: Emprega formas portuguesas tradicionais dos nomes e apresenta naturalmente a filiação.
theological_decisions: []
