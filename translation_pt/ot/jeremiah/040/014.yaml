  register: Português moderno, claro e digno, com boa legibilidade brasileira. O discurso direto usa “você” por ser natural e amplamente compreendido; os nomes seguem formas bíblicas correntes em português. A tradução mantém a ênfase da pergunta e verte idiomaticamente a expressão hebraica referente à morte.
