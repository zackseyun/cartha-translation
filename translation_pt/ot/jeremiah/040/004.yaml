source:
  edition: WLC
  text: וְ/עַתָּ֞ה הִנֵּ֧ה פִתַּחְתִּ֣י/ךָ הַ/יּ֗וֹם מִֽן הָ/אזִקִּים֮ אֲשֶׁ֣ר עַל יָדֶ/ךָ֒ אִם ט֨וֹב בְּ/עֵינֶ֜י/ךָ לָ/ב֧וֹא אִתִּ֣/י בָבֶ֗ל בֹּ֚א וְ/אָשִׂ֤ים אֶת עֵינִ/י֙ עָלֶ֔י/ךָ וְ/אִם רַ֧ע בְּ/עֵינֶ֛י/ךָ לָ/בֽוֹא אִתִּ֥/י בָבֶ֖ל חֲדָ֑ל רְאֵה֙ כָּל הָ/אָ֣רֶץ לְ/פָנֶ֔י/ךָ אֶל ט֨וֹב וְ/אֶל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֥כֶת שָׁ֖מָּ/ה לֵֽךְ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/004.yaml
  text: And now, look, today I have freed you from the chains on your hands. If you want to come with me to Babylon, come, and I will look after you[a]. But if you do not want to come with me to Babylon, do not. Look, the whole land is before you; go wherever seems good and right to you[b][c].
translation:
  language: pt
  text: 'E agora, veja: hoje eu o libertei das correntes que prendiam suas mãos. Se você quiser vir comigo para a Babilônia, venha, e eu cuidarei de você[a]. Mas, se não quiser vir comigo para a Babilônia, não venha. Veja, toda a terra está diante de você; vá para onde lhe parecer bom e certo[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “porei meu olho sobre você”, expressão que aqui indica cuidado ou proteção favorável.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “se for bom/mau aos seus olhos”, expressão que significa “se você quiser/não quiser” ou “se lhe parecer bom/mau”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico termina literalmente com “para ir para lá, vá”, forma que enfatiza a permissão concedida.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתַּחְתִּיךָ
  choice: eu o libertei
  rationale: Embora פתח signifique literalmente “abrir”, neste contexto, com a pessoa como objeto e a libertação das correntes, indica soltura ou libertação.
- source_word: הָאזִקִּים אֲשֶׁר עַל־יָדֶךָ
  choice: as correntes que prendiam suas mãos
  rationale: הָאזִקִּים designa as restrições de um prisioneiro; a formulação explicita naturalmente em português a relação indicada pelo hebraico “sobre suas mãos” sem especificar além do texto.
- source_word: אִם־טוֹב בְּעֵינֶיךָ
  choice: Se você quiser
  rationale: O idioma hebraico expressa escolha ou preferência favorável; esta é a equivalência corrente mais clara em português.
- source_word: וְאָשִׂים אֶת־עֵינִי עָלֶיךָ
  choice: eu cuidarei de você
  rationale: Literalmente, “porei meu olho sobre você”; no contexto, a imagem comunica atenção favorável, cuidado e proteção.
- source_word: וְאִם־רַע בְּעֵינֶיךָ
  choice: se não quiser
  rationale: Reproduz de modo natural a preferência negativa que contrasta com a fórmula anterior, sem atribuir ao percurso uma qualidade moral.
- source_word: חֲדָל
  choice: não venha
  rationale: O imperativo manda desistir da ação proposta; o objeto implícito é retomado para produzir português claro.
- source_word: כָּל־הָאָרֶץ לְפָנֶיךָ
  choice: toda a terra está diante de você
  rationale: Preserva a imagem hebraica e comunica liberdade de movimento e escolha.
- source_word: אֶל־טוֹב וְאֶל־הַיָּשָׁר בְּעֵינֶיךָ
  choice: para onde lhe parecer bom e certo
  rationale: Mantém os dois qualificativos do hebraico e a avaliação pessoal, expressando naturalmente o sentido de destino.
- source_word: לָלֶכֶת שָׁמָּה לֵךְ
  choice: vá
  rationale: O infinitivo seguido do imperativo confere ênfase e plena permissão; o imperativo português transmite o núcleo dessa força, documentada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para legibilidade brasileira. “Veja” traduz os marcadores de atenção sem arcaísmo. A ordem de “hoje” foi mantida próxima do hebraico, e as imagens ou construções menos transparentes foram preservadas em notas.
