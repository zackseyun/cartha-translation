  to: Então Jeremias foi até Gedalias, filho de Aicam, em Mispá, e passou a morar com ele entre o povo que restava[a] na terra.
  rationale: A revisão corrige a transliteração de Ahikam para «Aicam», torna a expressão de residência mais natural e preserva, por meio de nota ancorada em «restava», a amplitude lexical de «os que foram deixados/que permaneceram».
