  text: וַ/יָּבֹ֧א יִרְמְיָ֛הוּ אֶל גְּדַלְיָ֥ה בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֵּ֤שֶׁב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם הַ/נִּשְׁאָרִ֖ים בָּ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/006.yaml
  text: So Jeremiah went to Gedaliah son of Ahikam at Mizpah[a], and he lived with him among the people who were left in the land.
translation:
  language: pt
  text: Então Jeremias foi até Gedalias, filho de Aicam, em Mispá, e passou a morar com ele entre o povo que restava[a] na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que havia permanecido»; literalmente, «os que foram deixados/restaram na terra».'
    reason: Alternativa lexical para o particípio nifal הַנִּשְׁאָרִים, sem introduzir «remanescente» como termo técnico.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi
  rationale: No fluxo narrativo, בוא descreve o movimento de Jeremias até Gedalias; “foi” é natural em português a partir da perspectiva do narrador.
- source_word: גְּדַלְיָה בֶן אֲחִיקָם
  choice: Gedalias, filho de Aicão
  rationale: Mantém o patronímico hebraico em formulação natural e clara em português.
- source_word: הַמִּצְפָּתָה
  choice: em Mispá
  rationale: Embora a terminação direcional indique movimento para Mispá, depois de “foi até Gedalias” a expressão identifica naturalmente o lugar onde Gedalias se encontrava.
- source_word: וַיֵּשֶׁב
  choice: ficou morando
  rationale: ישב, neste contexto, indica permanência ou residência; “ficou morando” comunica tanto a permanência subsequente quanto o sentido habitacional.
- source_word: בְּתוֹךְ הָעָם
  choice: no meio do povo
  rationale: Reproduz de modo natural o sentido social e espacial de estar entre o povo.
- source_word: הַנִּשְׁאָרִים
  choice: que havia permanecido
  rationale: O particípio nifal descreve os que ficaram ou restaram; a formulação evita transformar a expressão no termo teológico mais carregado “remanescente”.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Preserva a formulação hebraica sem explicitar “Judá”, que é o referente contextual, mas não aparece nominalmente no versículo.
theological_decisions:
- issue: Possível leitura teológica de הַנִּשְׁאָרִים como “o remanescente”
  choice: o povo que havia permanecido
  alternative: o remanescente; o povo que havia sido deixado
  rationale: O hebraico usa uma descrição participial, não um substantivo técnico. A tradução descritiva mantém o sentido imediato sem acrescentar peso teológico indevido.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Foi até” evita a sequência pouco elegante “foi a... a Mispá”; “ficou morando” expressa residência continuada sem arcaísmo.
