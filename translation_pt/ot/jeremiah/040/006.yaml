    issue: Forma do nome «Aicão»
    rationale: אֲחִיקָם (Ahikam) é usualmente vertido em português como «Aicam». «Aicão» altera indevidamente a forma do nome.
  - severity: low
    issue: Formulação «ficou morando»
    rationale: A expressão é redundante e menos fluente. «Passou a morar» mantém o sentido de residência subsequente de וַיֵּשֶׁב.
  - severity: low
    issue: Nota lexical do texto-audit não foi preservada
    rationale: A alternativa para הַנִּשְׁאָרִים deve permanecer ancorada no termo correspondente, para registrar que a expressão pode ser entendida como os que haviam permanecido ou sido deixados.
  revised_text: Então Jeremias foi até Gedalias, filho de Aicam, em Mispá, e passou a morar com ele entre o povo que restava[a] na terra.
  revised_footnotes:
  - marker: a
    text: 'Ou: «que havia permanecido»; literalmente, «os que foram deixados/restaram na terra».'
