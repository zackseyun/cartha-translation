  to: Então todos os judeus[a] voltaram de todos os lugares para onde tinham sido expulsos[b]. Vieram à terra de Judá, até Gedalias, em Mispá, e reuniram vinho e frutos de verão[c] em enorme quantidade.
  rationale: A única alteração necessária substitui «colheram» por «reuniram». Ela evita sugerir que o vinho era colhido, conserva a amplitude lexical de אסף e mantém a afirmação de que ambos — vinho e frutos de verão — foram reunidos em enorme quantidade.
