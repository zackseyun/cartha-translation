base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/012.yaml
  text: Then all the Judeans returned from all the places where they had been driven[a], and they came to the land of Judah, to Gedaliah at Mizpah[c][b], and gathered a very great abundance of wine and summer fruit.
translation:
  language: pt
  text: Então todos os judeus[a] voltaram de todos os lugares para onde tinham sido expulsos[b]. Vieram à terra de Judá, até Gedalias, em Mispá, e reuniram vinho e frutos de verão[c] em enorme quantidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os judaítas”. O termo hebraico pode designar o povo de Judá e, por extensão, os judeus; “judaítas” ressalta a ambientação histórica ligada à terra de Judá.
    reason: lexical_alternative
  - marker: b
    text: Ou “para onde tinham sido desterrados” ou “dispersos”.
    reason: lexical_alternative
  - marker: c
    text: “Frutos de verão” são os produtos sazonais recolhidos no fim do verão ou na época da colheita.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: O verbo שוב, na sequência narrativa, indica retorno físico; “voltaram” é direto e natural.
- source_word: כָל הַיְּהוּדִים
  choice: todos os judeus
  rationale: O termo designa aqui o povo de Judá. “Judeus” é a forma corrente e amplamente compreensível em português, enquanto a nota preserva a alternativa histórica “judaítas”.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: de todos os lugares
  rationale: Reproduz de modo natural a expressão locativa hebraica.
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: para onde tinham sido expulsos
  rationale: O Nifal de נדח expressa terem sido impelidos ou afastados; “expulsos” mantém a força passiva e o contexto de deslocamento forçado.
- source_word: וַיָּבֹאוּ אֶרֶץ יְהוּדָה
  choice: Vieram à terra de Judá
  rationale: Expressa naturalmente o movimento em direção ao território sem acrescentar uma nuance interpretativa.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּתָה
  choice: até Gedalias, em Mispá
  rationale: A construção indica que foram ao encontro de Gedalias, localizado em Mispá; a formulação evita sugerir que Mispá modifique o nome pessoal.
- source_word: וַיַּאַסְפוּ
  choice: colheram
  rationale: Embora אסף signifique amplamente reunir ou recolher, com vinho e produtos sazonais o português “colheram” comunica naturalmente a atividade da colheita.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente lexical direto e tradicional de יין.
- source_word: וָקַיִץ
  choice: frutos de verão
  rationale: קיץ designa frutos ou produtos sazonais do verão; a tradução direta preserva a imagem, explicada em nota.
- source_word: הַרְבֵּה מְאֹד
  choice: em enorme quantidade
  rationale: Transmite com naturalidade a forte intensificação quantitativa de הַרְבֵּה מְאֹד.
