base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/002.yaml
  text: Then the captain of the guard took Jeremiah and said to him[b][a], “Yahweh your God spoke this disaster against this place.”
translation:
  language: pt
  text: 'Então o capitão da guarda[b] tomou Jeremias consigo e lhe disse: “Yahweh, seu Deus, anunciou esta desgraça[a] contra este lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta calamidade”; o termo hebraico רָעָה pode significar mal, dano, desgraça ou calamidade, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente “chefe dos carrascos”, título geralmente entendido como “capitão da guarda”.
    reason: cultural_note
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: capitão da guarda
  rationale: Trata-se de um título oficial babilônico. Embora טַבָּחִים tenha sentido literal relacionado a carrascos ou executores, “capitão da guarda” é a forma portuguesa consagrada e adequada ao contexto.
- source_word: וַיִּקַּח
  choice: chamou
  rationale: O verbo significa basicamente “tomar”, mas aqui descreve o oficial trazendo Jeremias à sua presença para falar com ele. “Chamou” expressa naturalmente a ação no contexto sem sugerir violência física.
- source_word: לְיִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Mantém a forma de tratamento dirigida pessoalmente a Jeremias e soa natural no português brasileiro moderno.
- source_word: דִּבֶּר
  choice: anunciou
  rationale: Neste contexto profético, o verbo indica que Yahweh havia declarado de antemão o juízo. “Anunciou” é natural e conserva essa força, sem ampliar o conteúdo.
- source_word: הָרָעָה הַזֹּאת
  choice: esta desgraça
  rationale: רָעָה pode indicar mal, dano ou calamidade. Aqui designa o juízo desastroso anunciado contra Jerusalém; “desgraça” é claro e idiomático, enquanto a nota preserva a amplitude lexical.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: contra este lugar
  rationale: Com a declaração de um juízo, אֶל indica sua direção ou alvo. “Contra” comunica adequadamente essa relação em português.
theological_decisions:
- issue: Sentido de רָעָה como objeto do anúncio divino
  choice: esta desgraça
  alternative: este mal; esta calamidade
  rationale: O contexto aponta para uma desgraça histórica resultante do juízo contra Jerusalém, não caracteriza Yahweh como praticante de mal moral. A nota registra alternativas legítimas sem eliminar a amplitude do termo hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação dos marcadores segue diretamente os termos explicados. “Chamou Jeremias” evita o pouco natural “tomou Jeremias”, mas não especifica além do contexto se houve custódia física.
