base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/009.yaml
  text: Gedaliah son of Ahikam[a], son of Shaphan, swore to them and to their men, saying, “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.”
translation:
  language: pt
  text: 'Gedalias, filho de Aicão, filho de Safã, jurou a eles e aos seus homens: “Não tenham medo de servir aos caldeus.[a] Habitem nesta terra e sirvam ao rei da Babilônia, e tudo irá bem para vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os babilônios”. O hebraico diz “os caldeus”, termo frequentemente usado para designar o poder dominante da Babilônia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: O nifal de שׁבע expressa prestar juramento. “Jurou” é conciso, natural e preserva a força solene do ato.
- source_word: לָהֶם ... וּלְאַנְשֵׁיהֶם
  choice: a eles e aos seus homens
  rationale: Mantém a referência ampla aos homens associados a eles, sem restringi-los interpretativamente a soldados.
- source_word: לֵאמֹר
  choice: introdução direta com dois-pontos
  rationale: Em português, os dois-pontos introduzem a fala de modo mais natural que o hebraísmo “dizendo”, sem perda de conteúdo.
- source_word: אַל תִּירְאוּ מֵעֲבֹד
  choice: Não tenham medo de servir
  rationale: Reproduz em português corrente a proibição e a relação de temor com o ato de servir.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva o termo étnico-político específico do hebraico; a equivalência contextual com os babilônios é indicada em nota.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Habitem nesta terra
  rationale: ישׁב pode significar morar, permanecer ou habitar. “Habitem” conserva o sentido residencial; “nesta terra” expressa naturalmente o artigo definido no contexto dêitico.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: e sirvam ao rei da Babilônia
  rationale: עבד, neste contexto político, indica sujeição e serviço a um soberano.
- source_word: וְיִיטַב לָכֶם
  choice: e tudo irá bem com vocês
  rationale: Formulação portuguesa natural para a expressão idiomática que promete resultado favorável ou bem-estar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os nomes seguem formas portuguesas tradicionais. A sintaxe hebraica foi suavemente adaptada ao português, preservando o juramento, a designação “caldeus” e o sentido político de “servir”.
