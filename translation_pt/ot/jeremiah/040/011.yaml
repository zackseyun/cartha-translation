base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/011.yaml
  text: Also[a], all the Judeans who were in Moab, among the Ammonites, in Edom, and in all the other lands heard that the king of Babylon had left a remnant for Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: pt
  text: Também todos os judeus que estavam em Moabe, entre os amonitas, em Edom e em todas as terras ouviram que o rei da Babilônia havia deixado um remanescente[a] para Judá e havia nomeado Gedalias, filho de Aicão, filho de Safã, como responsável por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobreviventes para Judá”. O termo hebraico pode referir-se, de modo mais geral, aos que permaneceram vivos depois de uma calamidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Mantém a força aditiva do hebraico e dá continuidade natural à narrativa em português.
- source_word: כָּל הַיְּהוּדִים
  choice: todos os judeus
  rationale: Em português corrente, “judeus” designa naturalmente o povo ligado a Judá neste contexto; “todos” preserva a abrangência de כָּל.
- source_word: אֲשֶׁר בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם
  choice: que estavam em Moabe, entre os amonitas, em Edom
  rationale: Expressa de modo idiomático os locais da dispersão; בְּנֵי עַמּוֹן é entendido como o povo amonita.
- source_word: וַאֲשֶׁר בְּכָל הָאֲרָצוֹת
  choice: e em todas as outras terras
  rationale: “Outras” explicita naturalmente que a expressão amplia a lista para além das regiões já nomeadas, sem alterar o referente.
- source_word: שָׁמְעוּ
  choice: ouviram
  rationale: Reproduz o sentido simples do verbo narrativo de receber uma notícia.
- source_word: כִּי נָתַן מֶלֶךְ בָּבֶל שְׁאֵרִית לִיהוּדָה
  choice: que o rei da Babilônia havia deixado um remanescente para Judá
  rationale: “Havia deixado” comunica o valor contextual de נָתַן após a destruição, enquanto “remanescente” preserva o termo profético significativo שְׁאֵרִית.
- source_word: וְכִי הִפְקִיד עֲלֵיהֶם
  choice: e havia nomeado ... como governador deles
  rationale: O hifil de פקד indica colocar alguém em posição de autoridade; a formulação explicita de maneira natural a função administrativa implícita no contexto.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: Gedalias, filho de Aicão e neto de Safã
  rationale: Adota formas tradicionais e inteligíveis dos nomes em português; “neto” torna clara a cadeia genealógica sem perda de informação.
theological_decisions:
- issue: Tradução de שְׁאֵרִית
  choice: remanescente
  alternative: sobreviventes
  rationale: O termo pode indicar simplesmente os que permaneceram vivos após a catástrofe, mas “remanescente” conserva sua ressonância lexical e canônica na literatura profética sem impor ao versículo um desenvolvimento teológico adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o fluxo narrativo e evita literalismos desnecessários; a ambiguidade lexical de שְׁאֵרִית é preservada por nota.
