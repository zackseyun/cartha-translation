revisions:
- from: Também todos os judeus que estavam em Moabe, entre os amonitas, em Edom e em todas as outras terras ouviram que o rei da Babilônia havia deixado um remanescente[a] para Judá e havia nomeado Gedalias, filho de Aicão e neto de Safã, como governador deles.
  to: Também todos os judeus que estavam em Moabe, entre os amonitas, em Edom e em todas as terras ouviram que o rei da Babilônia havia deixado um remanescente[a] para Judá e havia nomeado Gedalias, filho de Aicão, filho de Safã, como responsável por eles.
  rationale: 'Foram removidas duas explicitações não exigidas pelo hebraico: “outras”, que não ocorre em “todas as terras”, e o título “governador”, que excede a indicação de que Gedalias foi posto sobre o povo. A fórmula genealógica foi mantida como “filho de Aicão, filho de Safã”. A opção “remanescente” e sua nota lexical permanecem adequadas.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:57Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o sentido geral. Contudo, “outras terras” introduz uma restrição ausente de בְּכָל־הָאֲרָצוֹת (“em todas as terras”); e “como governador deles” explicita um cargo específico que o hebraico não declara, dizendo apenas que Gedalias foi posto/nomeado sobre eles. A cadeia “filho de Aicão, filho de Safã” deve ser preservada na forma do texto.
  naturalness: O português é claro e de registro apropriado. A redação revista conserva a fluência e evita tanto a inferência de “outras” quanto a especificação administrativa de “governador”.
  terminology: “Remanescente” representa adequadamente שְׁאֵרִית e a nota registra de modo útil a alternativa contextual “sobreviventes”. “Judeus”, “amonitas”, “Moabe”, “Edom”, “Gedalias”, “Aicão” e “Safã” são formas compreensíveis e adequadas.
  issues:
  - severity: medium
    issue: “em todas as outras terras”
    rationale: O hebraico diz literalmente “em todas as terras”, sem qualificador equivalente a “outras”. Embora o contexto possa sugerir lugares além dos já mencionados, essa explicitação não é necessária e restringe/define o referente além do texto.
  - severity: medium
    issue: “como governador deles”
    rationale: הִפְקִיד עֲלֵיהֶם expressa que o rei colocou ou nomeou Gedalias sobre eles, mas não nomeia o título formal de “governador”. “Responsável por eles” preserva a autoridade administrativa sem acrescentar um cargo específico.
  - severity: low
    issue: “filho de Aicão e neto de Safã”
    rationale: “Neto” é uma inferência genealógica válida, mas a repetição “filho de ... filho de ...” reproduz com maior precisão a fórmula nominal hebraica e mantém a apresentação do texto-fonte.
  revised_text: Também todos os judeus que estavam em Moabe, entre os amonitas, em Edom e em todas as terras ouviram que o rei da Babilônia havia deixado um remanescente[a] para Judá e havia nomeado Gedalias, filho de Aicão, filho de Safã, como responsável por eles.
  revised_footnotes:
  - marker: a
    text: Ou “sobreviventes para Judá”. O termo hebraico pode referir-se, de modo mais geral, aos que permaneceram vivos depois de uma calamidade.
    reason: lexical_alternative
  revision_rationale: 'Foram removidas duas explicitações não exigidas pelo hebraico: “outras”, que não ocorre em “todas as terras”, e o título “governador”, que excede a indicação de que Gedalias foi posto sobre o povo. A fórmula genealógica foi mantida como “filho de Aicão, filho de Safã”. A opção “remanescente” e sua nota lexical permanecem adequadas.'
