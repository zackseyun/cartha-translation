  text: But Gedaliah son of Ahikam said to Johanan son of Kareah, “Do not do this thing, for you are speaking a lie about Ishmael.”
translation:
  language: pt
  text: 'Mas Gedalias, filho de Aicão, disse a Joanã, filho de Careá: “Não faça isso, pois o que você está dizendo sobre Ismael é mentira.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תעש אֶת־הַדָּבָר הַזֶּה
  choice: Não faça isso
  rationale: A proibição hebraica se refere diretamente à ação proposta no contexto; em português corrente, “isso” comunica o sentido de modo mais natural do que “esta coisa”.
- source_word: כִּי שֶׁקֶר אַתָּה דֹבֵר אֶל־יִשְׁמָעֵאל
  choice: pois o que você está dizendo sobre Ismael é mentira
  rationale: שֶׁקֶר é um substantivo, “mentira” ou “falsidade”. A preposição אֶל, embora normalmente signifique “a/para”, aqui introduz a pessoa a respeito de quem se fala; “sobre” expressa naturalmente essa relação em português.
