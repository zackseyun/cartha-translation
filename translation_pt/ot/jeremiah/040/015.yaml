base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/015.yaml
  text: Then Johanan son of Kareah said privately to Gedaliah at Mizpah[a], saying, “Please let me go and strike down Ishmael son of Nethaniah, and no one will know. Why should he take your life, so that all the Judahites who are gathered to you would be scattered[c][b], and the remnant of Judah would perish?”
translation:
  language: pt
  text: 'Então Joanã, filho de Careá, disse em segredo a Gedalias, em Mispá: “Deixe-me ir, por favor, e matar Ismael, filho de Netanias, sem que ninguém saiba. Por que ele tiraria a sua vida, de modo que todos os judaítas que estão reunidos junto de você se dispersariam, e o remanescente de Judá pereceria?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: em segredo
  rationale: A expressão adverbial comunica que Joanã falou reservadamente, fora do conhecimento público, preservando o sentido de ocultação do substantivo hebraico.
- source_word: בַמִּצְפָּה
  choice: em Mispá
  rationale: Forma natural em português para indicar o local da conversa; o topônimo é transliterado de modo corrente.
- source_word: אֵלְכָה נָּא
  choice: Deixe-me ir, por favor
  rationale: O coortativo com נָא apresenta um pedido ou proposta insistente e cortês; a formulação mantém tanto a volição quanto a deferência.
- source_word: וְאַכֶּה
  choice: e matar
  rationale: Embora נכה tenha o sentido básico de golpear, o contexto deixa claro que Joanã propõe assassinar Ismael. 'Matar' exprime diretamente o resultado pretendido sem obscurecer a ação.
- source_word: וְאִישׁ לֹא יֵדָע
  choice: sem que ninguém saiba
  rationale: אִישׁ é genérico nesta construção negativa. 'Ninguém' é a expressão natural e inclusiva em português, e a subordinada liga fluentemente a ação ao segredo proposto.
- source_word: לָמָּה יַכֶּכָּה נֶּפֶשׁ
  choice: Por que deixar que ele tire a sua vida
  rationale: A expressão hebraica é comprimida, literalmente próxima de 'por que ele golpearia você, vida?'. 'Tirar a sua vida' comunica com clareza a ameaça de morte; a formulação com 'deixar' expressa o apelo retórico no contexto.
- source_word: וְנָפֹצוּ
  choice: sejam dispersos
  rationale: O verbo descreve a dispersão projetada do grupo após a morte de Gedalias. O subjuntivo acompanha naturalmente a relação de consequência em português.
- source_word: כָּל יְהוּדָה
  choice: todos os judeus
  rationale: Neste contexto, Judá designa o povo remanescente, não apenas o território. 'Judeus' é a designação corrente e compreensível em português para os habitantes ou membros do povo de Judá.
- source_word: הַנִּקְבָּצִים אֵלֶיךָ
  choice: que se reuniram ao seu redor
  rationale: A expressão representa pessoas já congregadas sob a liderança de Gedalias. 'Ao seu redor' comunica naturalmente a orientação relacional de אֵלֶיךָ.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: o remanescente de Judá
  rationale: '''Remanescente'' é a equivalência tradicional e semanticamente precisa para שְׁאֵרִית, referindo-se à comunidade sobrevivente depois da catástrofe.'
- source_word: וְאָבְדָה
  choice: pereça
  rationale: אבד pode indicar perecer, perder-se ou ser destruído. 'Pereça' se ajusta à ruína coletiva prevista e forma bom paralelo com 'sejam dispersos'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala foi apresentada diretamente, sem o hebraísmo redundante equivalente a 'disse... dizendo'. A ordem causal do apelo foi preservada em linguagem natural.
