  to: 'Então Joanã, filho de Careá, disse em segredo a Gedalias, em Mispá: “Deixe-me ir, por favor, e matar Ismael, filho de Netanias, sem que ninguém saiba. Por que ele tiraria a sua vida, de modo que todos os judaítas que estão reunidos junto de você se dispersariam, e o remanescente de Judá pereceria?”'
