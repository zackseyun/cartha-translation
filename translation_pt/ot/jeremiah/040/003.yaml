  text: וַ/יָּבֵ֥א וַ/יַּ֛עַשׂ יְהוָ֖ה כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּֽי חֲטָאתֶ֤ם לַֽ/יהוָה֙ וְ/לֹֽא שְׁמַעְתֶּ֣ם בְּ/קוֹל֔/וֹ וְ/הָיָ֥ה לָ/כֶ֖ם דבר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/003.yaml
  text: And Yahweh has brought it about and has done just as he said[a], because you sinned against Yahweh and did not listen to his voice[b]; therefore this thing has happened to you.
translation:
  language: pt
  text: Yahweh fez isso acontecer e agiu exatamente como havia dito, porque vocês pecaram contra Yahweh e não deram ouvidos à sua voz[a]. Por isso, isto lhes aconteceu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedeceram à sua voz”. A expressão hebraica “ouvir a voz” frequentemente inclui a ideia de obedecer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esta calamidade sobreveio a vocês”. No contexto, o hebraico traduzido por “isto” pode referir-se mais especificamente ao desastre que acaba de ser mencionado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: fez isso acontecer
  rationale: 'O hifil de בוא tem aqui sentido causativo: Yahweh fez vir a situação ou calamidade anteriormente anunciada. O pronome “isso” recupera naturalmente o acontecimento do contexto.'
- source_word: וַיַּעַשׂ
  choice: agiu
  rationale: Preserva o sentido simples de עשה e, com “exatamente como havia dito”, expressa que Yahweh executou o juízo anunciado sem fundir completamente os dois verbos iniciais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: exatamente como havia dito
  rationale: Forma portuguesa natural que ressalta a correspondência entre o acontecimento e a palavra profética anterior.
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa do juízo de maneira clara no contexto.
- source_word: חֲטָאתֶם לַיהוָה
  choice: vocês pecaram contra Yahweh
  rationale: “Pecar contra” é a construção idiomática em português para a ofensa dirigida a alguém.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלוֹ
  choice: não deram ouvidos à sua voz
  rationale: Mantém a imagem hebraica de escutar a voz e, ao mesmo tempo, comunica naturalmente a ideia contextual de não atender nem obedecer.
- source_word: וְהָיָה לָכֶם דבר הַזֶּה
  choice: isto aconteceu com vocês
  rationale: Expressa em português corrente que essa situação sobreveio aos ouvintes, sem especificar além do hebraico se דבר significa coisa, acontecimento ou calamidade.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz o nome divino, e a transliteração “Yahweh” o preserva como nome pessoal em vez de substituí-lo por um título.
- issue: Valor de שׁמע בקולו
  choice: não deram ouvidos à sua voz
  alternative: não obedeceram à sua voz; não lhe obedeceram
  rationale: A expressão idiomática inclui a noção de obediência, mas a redação escolhida conserva a imagem da voz e evita eliminar sua amplitude lexical.
- issue: Especificidade de דבר הזה
  choice: isto
  alternative: esta calamidade; este desastre
  rationale: O contexto aponta para a calamidade sofrida, porém o substantivo hebraico é amplo. “Isto” preserva essa abertura, enquanto a nota registra a leitura contextual mais específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de “vocês” adequado à segunda pessoa do plural. A abertura conserva os dois verbos hebraicos sem produzir uma repetição artificial; “deram ouvidos” mantém a imagem original em expressão idiomática portuguesa.
