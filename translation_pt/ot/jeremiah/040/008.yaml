base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
translation:
  language: pt
  text: Então Ismael, filho de Netanias, Joanã e Jônatas, filhos de Careá, Seraías, filho de Tanumete, os filhos de Efai[a], o netofatita, e Jezanias[b], filho do maacatita — eles e seus homens — foram até Gedalias, em Mispa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «Ofi»; a representação desse nome próprio hebraico é incerta.
    reason: lexical_alternative
  - marker: b
    text: O nome também pode ser transliterado «Jezaniasu»; alguns o relacionam a formas que em outras passagens são traduzidas como «Jaazanias».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: foram até
  rationale: O wayyiqtol de בוא dá sequência à narrativa com uma ação passada. Em português, «foram até» expressa naturalmente o movimento dos chefes em direção a Gedalias.
- source_word: אֶל גְּדַלְיָה הַמִּצְפָּתָה
  choice: até Gedalias, em Mispa
  rationale: A construção indica movimento para junto de Gedalias em Mispa. A formulação portuguesa associa com clareza Mispa à localização de Gedalias, sem perder a ideia de deslocamento.
- source_word: בְּנֵי קָרֵחַ
  choice: filhos de Careá
  rationale: O plural construto se refere conjuntamente a Joanã e Jônatas.
- source_word: בְנֵי עופי
  choice: os filhos de Efai
  rationale: Mantém o plural explícito do hebraico e adota «Efai», representação tradicional e inteligível do nome próprio, registrando a incerteza de transliteração em nota.
- source_word: הַנְּטֹפָתִי
  choice: o netofatita
  rationale: Conserva o gentílico geográfico do hebraico; no contexto, ele identifica Efai.
- source_word: וִיזַנְיָהוּ
  choice: Jezanias
  rationale: Usa a forma portuguesa tradicional do nome, enquanto a nota preserva a possibilidade de representação mais próxima da terminação hebraica.
- source_word: בֶן הַמַּעֲכָתִי
  choice: filho do maacatita
  rationale: Reproduz a construção hebraica, que identifica o pai pelo gentílico sem informar seu nome.
- source_word: הֵמָּה וְאַנְשֵׁיהֶם
  choice: acompanhados de seus homens
  rationale: Expressa de modo idiomático a indicação enfática de que os chefes vieram juntamente com os homens sob seu comando.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes já estabelecidas no uso bíblico lusófono. A ordem da frase foi ajustada ao português para evitar uma longa interrupção entre o verbo e seus participantes. «Acompanhados de seus homens» torna natural a expressão final enfática, sem acrescentar uma relação militar mais específica do que o contexto permite.
