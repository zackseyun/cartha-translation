    text: Ou “chefe dos executores”. O título hebraico refere-se literalmente ao chefe dos que executavam ou abatiam e provavelmente designava um oficial da guarda real com responsabilidade por execuções.
    reason: lexical_alternative
  revision_rationale: A revisão restaura a estrutura contínua da frase hebraica e substitui «encontrado» por «tomou», o equivalente semanticamente seguro de לקח. Também verte o destino da deportação de modo mais direto. A nota e os nomes próprios foram mantidos.
