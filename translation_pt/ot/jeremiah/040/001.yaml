revisions:
- from: 'A palavra que veio a Jeremias da parte de Yahweh, depois que Nebuzaradã[a], comandante da guarda, o mandou embora de Ramá. Ele o havia encontrado preso com correntes entre todos os exilados de Jerusalém e de Judá que estavam sendo levados para o exílio na Babilônia:'
  to: 'A palavra que veio a Jeremias da parte de Yahweh, depois que Nebuzaradã[a], comandante da guarda, o mandou embora de Ramá, quando o tomou, estando ele preso em correntes no meio de todos os exilados de Jerusalém e de Judá que estavam sendo deportados para a Babilônia:'
  rationale: A revisão restaura a estrutura contínua da frase hebraica e substitui «encontrado» por «tomou», o equivalente semanticamente seguro de לקח. Também verte o destino da deportação de modo mais direto. A nota e os nomes próprios foram mantidos.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:36:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'A divisão em duas frases rompe indevidamente a sintaxe do versículo: a oração temporal introduzida por «quando» depende de «depois que». Além disso, «havia encontrado» não traduz o hebraico לקח («tomou»); introduz uma ação de encontrar que não está no texto. «Para o exílio na Babilônia» também é menos direto que o destino expresso, «para a Babilônia».'
  naturalness: A redação revista mantém um único período, como no hebraico, mas usa uma construção portuguesa clara. «Estando ele preso em correntes» exprime naturalmente a cláusula circunstancial hebraica.
  terminology: «Yahweh», «Nebuzaradã», «Ramá», «Babilônia» e «comandante da guarda» são adequados. A nota preserva a alternativa lexical mais literal para o título babilônico sem transformar essa alternativa em tradução principal.
  issues:
  - severity: high
    issue: «Ele o havia encontrado» traduz בְּקַחְתּוֹ אֹתוֹ como «encontrar».
    rationale: O verbo לקח significa «tomar/levar», não «encontrar». A opção introduz um evento não expresso no original.
  - severity: medium
    issue: A separação após «Ramá» deixa «Ele o havia encontrado...» como oração independente.
    rationale: No hebraico, a cláusula com «quando o tomou» integra a longa frase iniciada por «A palavra que veio...», e deve permanecer sintaticamente ligada a ela.
  - severity: low
    issue: «Para o exílio na Babilônia» acrescenta a formulação «exílio» e enfraquece o destino explícito.
    rationale: O hebraico diz literalmente que eram deportados «para Babilônia»; «para a Babilônia» é mais direto e fiel.
  revised_text: 'A palavra que veio a Jeremias da parte de Yahweh, depois que Nebuzaradã[a], comandante da guarda, o mandou embora de Ramá, quando o tomou, estando ele preso em correntes no meio de todos os exilados de Jerusalém e de Judá que estavam sendo deportados para a Babilônia:'
  revised_footnotes:
