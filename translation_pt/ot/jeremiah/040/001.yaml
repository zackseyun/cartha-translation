  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה אַחַ֣ר שַׁלַּ֣ח אֹת֗/וֹ נְבוּזַרְאֲדָ֛ן רַב טַבָּחִ֖ים מִן הָֽ/רָמָ֑ה בְּ/קַחְתּ֣/וֹ אֹת֗/וֹ וְ/הֽוּא אָס֤וּר בָּֽ/אזִקִּים֙ בְּ/ת֨וֹךְ כָּל גָּל֤וּת יְרוּשָׁלִַ֨ם֙ וִֽ/יהוּדָ֔ה הַ/מֻּגְלִ֖ים בָּבֶֽלָ/ה־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
translation:
  language: pt
  text: 'A palavra que veio a Jeremias da parte de Yahweh, depois que Nebuzaradã[a], comandante da guarda, o mandou embora de Ramá, quando o tomou, estando ele preso em correntes no meio de todos os exilados de Jerusalém e de Judá que estavam sendo deportados para a Babilônia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe dos executores”. O título hebraico refere-se literalmente ao chefe dos que executavam ou abatiam e provavelmente designava um oficial da guarda real com responsabilidade por execuções.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: A palavra que veio a Jeremias
  rationale: Preserva a fórmula profética tradicional e verte de modo natural a construção idiomática hebraica.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: Indica a origem divina da palavra e translitera o nome pessoal divino expresso no texto hebraico.
- source_word: אַחַר שַׁלַּח אֹתוֹ
  choice: depois que ... o mandou embora
  rationale: Mantém o sentido básico de enviar ou deixar partir sem decidir de modo excessivo se houve uma soltura formal.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: Equivalente funcional claro para o título de um alto oficial ligado à guarda real e às execuções; a forma mais literal é registrada em nota.
- source_word: בְּקַחְתּוֹ אֹתוֹ
  choice: Ele o havia encontrado
  rationale: No contexto, o verbo descreve Nebuzaradã tomando Jeremias sob sua autoridade em Ramá; 'encontrado' produz uma sequência natural em português, sem sugerir que ele próprio o prendeu inicialmente.
- source_word: וְהוּא אָסוּר בָּאזִקִּים
  choice: preso com correntes
  rationale: Expressa de modo corrente a condição de Jeremias, que estava atado por instrumentos de contenção.
- source_word: בְּתוֹךְ כָּל גָּלוּת יְרוּשָׁלִַם וִיהוּדָה
  choice: entre todos os exilados de Jerusalém e de Judá
  rationale: Entende o substantivo coletivo como referência ao conjunto das pessoas deportadas.
- source_word: הַמֻּגְלִים בָּבֶלָה
  choice: que estavam sendo levados para o exílio na Babilônia
  rationale: Torna explícito em português o sentido passivo de deportação presente no particípio hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal sem substituí-lo por um título.
- issue: Relação de Jeremias com o grupo deportado
  choice: preso com correntes entre todos os exilados
  alternative: preso junto com todos os exilados
  rationale: A formulação conserva a descrição narrativa sem concluir que Jeremias já tivesse sido formalmente classificado como um dos deportados.
translation_notes:
  register: Português contemporâneo, digno e de leitura ampla, com estrutura ajustada em duas frases para evitar um período excessivamente pesado. A forma 'Nebuzaradã' segue a adaptação portuguesa tradicional do nome; 'Ramá' e 'Babilônia' usam grafias correntes no português brasileiro.
