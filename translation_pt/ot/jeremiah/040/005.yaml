  text: וְ/עוֹדֶ֣/נּוּ לֹֽא יָשׁ֗וּב וְ/שֻׁ֡בָ/ה אֶל גְּדַלְיָ֣ה בֶן אֲחִיקָ֣ם בֶּן שָׁפָ֡ן אֲשֶׁר֩ הִפְקִ֨יד מֶֽלֶךְ בָּבֶ֜ל בְּ/עָרֵ֣י יְהוּדָ֗ה וְ/שֵׁ֤ב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם א֠וֹ אֶל כָּל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֖כֶת לֵ֑ךְ וַ/יִּתֶּן ל֧/וֹ רַב טַבָּחִ֛ים אֲרֻחָ֥ה וּ/מַשְׂאֵ֖ת וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
translation:
  language: pt
  text: 'Mas, como Jeremias ainda não tinha voltado,[a] Nebuzaradã lhe disse: “Volte para Gedalias, filho de Aicão, filho de Safã, a quem o rei da Babilônia nomeou para governar as cidades de Judá, e viva com ele no meio do povo; ou vá para onde lhe parecer certo ir.” Então o capitão da guarda lhe deu provisões[b] e um presente[c] e o deixou partir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil no início do versículo; também pode ser entendido assim: “Enquanto ele ainda não tinha voltado, disse: ‘Volte para Gedalias…’”'
    reason: alternative_reading
  - marker: b
    text: Ou “rações”.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma dádiva”, “uma ajuda” ou “uma porção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  choice: Mas, como Jeremias ainda não tinha voltado
  rationale: A construção hebraica é difícil e elíptica. A forma verbal indica que a volta ainda não havia ocorrido; explicitar Jeremias evita ambiguidade pronominal em português, sem ocultar a incerteza, que é registrada em nota.
- source_word: וְשֻׁבָה
  choice: Volte
  rationale: O imperativo de שׁוב expressa retorno. “Volte” é direto, atual e natural em português.
- source_word: אֶל גְּדַלְיָה בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: para junto de Gedalias, filho de Aicão e neto de Safã
  rationale: “Para junto de” comunica movimento em direção à pessoa. “Neto de Safã” torna clara e concisa a sequência genealógica hebraica.
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בְּעָרֵי יְהוּדָה
  choice: a quem o rei da Babilônia nomeou sobre as cidades de Judá
  rationale: O hifil de פקד indica nomeação para uma função de autoridade. “Sobre as cidades” preserva o sentido administrativo do hebraico.
- source_word: וְשֵׁב אִתּוֹ בְּתוֹךְ הָעָם
  choice: e viva com ele no meio do povo
  rationale: ישׁב aqui descreve residência ou permanência, não simplesmente o ato de sentar-se. A formulação é natural e preserva “no meio do povo”.
- source_word: אוֹ אֶל כָּל הַיָּשָׁר בְּעֵינֶיךָ לָלֶכֶת לֵךְ
  choice: ou vá para onde lhe parecer certo ir
  rationale: A expressão idiomática “reto aos seus olhos” significa aquilo que a pessoa considera certo ou adequado. A tradução comunica o sentido sem tornar a frase artificial.
- source_word: רַב טַבָּחִים
  choice: o capitão da guarda
  rationale: Título tradicional e contextualmente adequado para o cargo de Nebuzaradã; evita a tradução excessivamente literal “chefe dos executores”.
- source_word: אֲרֻחָה
  choice: provisões
  rationale: O substantivo designa alimento ou suprimento concedido para sustento, especialmente no contexto de uma partida.
- source_word: וּמַשְׂאֵת
  choice: um presente
  rationale: O termo pode indicar dádiva, porção ou concessão. Junto de “provisões”, “presente” expressa bem uma concessão adicional, mantendo em nota as alternativas legítimas.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: e o deixou partir
  rationale: O verbo pode significar mandar embora, despedir ou soltar. No contexto da libertação de Jeremias, “deixou partir” é natural e não sugere hostilidade indevida.
