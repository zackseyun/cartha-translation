translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador acompanhe o termo correspondente. Os nomes seguem formas portuguesas correntes: Gedalias, Aicão, Safã, Judá e Nebuzaradã.'
