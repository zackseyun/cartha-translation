  text: וַ/אֲנִ֗י הִנְ/נִ֤י יֹשֵׁב֙ בַּ/מִּצְפָּ֔ה לַֽ/עֲמֹד֙ לִ/פְנֵ֣י הַ/כַּשְׂדִּ֔ים אֲשֶׁ֥ר יָבֹ֖אוּ אֵלֵ֑י/נוּ וְ/אַתֶּ֡ם אִסְפוּ֩ יַ֨יִן וְ/קַ֜יִץ וְ/שֶׁ֗מֶן וְ/שִׂ֨מוּ֙ בִּ/כְלֵי/כֶ֔ם וּ/שְׁב֖וּ בְּ/עָרֵי/כֶ֥ם אֲשֶׁר תְּפַשְׂתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/010.yaml
  text: As for me[a], behold, I am staying at Mizpah to stand before the Chaldeans who come to us. But you, gather wine, summer fruit, and oil, put them in your containers[b], and dwell in your cities that you have taken.
translation:
  language: pt
  text: Quanto a mim, eis que ficarei em Mispá para estar diante[b] dos caldeus[a] que vierem até nós. Vocês, porém, recolham vinho, frutas de verão e azeite, coloquem tudo em seus recipientes e morem nas cidades das quais tomaram posse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “babilônios”.
    reason: lexical_alternative
  - marker: b
    text: “Estar diante” também pode indicar comparecer, servir ou atuar como representante em função oficial.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ficarei
  rationale: Em conjunto com o particípio יֹשֵׁב, expressa a decisão ou disposição presente de Gedalias de permanecer em Mispá; em português, “ficarei” transmite isso com naturalidade, sem o artificial “eis que estou”.
- source_word: יֹשֵׁב
  choice: ficarei
  rationale: Neste contexto, ישב indica permanência ou residência num lugar, não a postura física de estar sentado.
- source_word: לַעֲמֹד לִפְנֵי
  choice: para estar diante
  rationale: Mantém de forma concisa a imagem hebraica e sua possível nuance administrativa de comparecer, servir ou representar perante uma autoridade, explicitada em nota.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Reproduz diretamente o etnônimo hebraico; no contexto, refere-se ao poder babilônico, alternativa indicada em nota.
- source_word: יָבֹאוּ אֵלֵינוּ
  choice: que vierem até nós
  rationale: O subjuntivo futuro comunica naturalmente em português a chegada esperada ou eventual dos caldeus, sem fixar indevidamente o aspecto temporal.
- source_word: אִסְפוּ
  choice: recolham
  rationale: Imperativo natural para a coleta de vinho, frutas e azeite, sem restringir a ação à colheita agrícola propriamente dita.
- source_word: קַיִץ
  choice: frutas de verão
  rationale: Preserva o sentido sazonal do substantivo, que pode designar frutas ou produtos do verão, frequentemente figos, sem especificar uma espécie não expressa no texto.
- source_word: שִׂימוּ בִּכְלֵיכֶם
  choice: coloquem tudo em seus recipientes
  rationale: כְּלִי é um termo amplo para utensílio, vaso ou recipiente; “recipientes” evita impor material ou formato específico, e “tudo” retoma naturalmente os produtos enumerados.
- source_word: וּשְׁבוּ
  choice: morem
  rationale: Aqui ישב significa residir ou habitar nas cidades, e “morem” é claro, atual e digno em português.
- source_word: תְּפַשְׂתֶּם
  choice: das quais tomaram posse
  rationale: Expressa a aquisição ou ocupação das cidades sem pressupor mais violência militar do que o verbo hebraico exige.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção “Quanto a mim... Vocês, porém” conserva o contraste enfático do hebraico. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
