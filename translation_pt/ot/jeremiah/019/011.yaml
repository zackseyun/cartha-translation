  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת כָּ֣כָה אֶשְׁבֹּ֞ר אֶת הָ/עָ֤ם הַ/זֶּה֙ וְ/אֶת הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֤ר יִשְׁבֹּר֙ אֶת כְּלִ֣י הַ/יּוֹצֵ֔ר אֲשֶׁ֛ר לֹֽא יוּכַ֥ל לְ/הֵרָפֵ֖ה ע֑וֹד וּ/בְ/תֹ֣פֶת יִקְבְּר֔וּ מֵ/אֵ֥ין מָק֖וֹם לִ/קְבּֽוֹר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/011.yaml
  text: 'And you shall say to them[a], ‘Thus says Yahweh of hosts: In this way I will break this people and this city, as one breaks a potter’s vessel, which cannot be repaired again[b]; and in Topheth they will bury because there is no place else to bury.’'
translation:
  language: pt
  text: 'E você lhes dirá: “Assim diz Yahweh dos Exércitos: Deste modo quebrarei este povo e esta cidade, como se quebra uma vasilha de oleiro[a], que não pode mais ser consertada[b]. E em Tofete sepultarão, por falta de lugar para sepultar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “um utensílio do oleiro”, usando um termo amplo que pode designar uma vasilha, um recipiente ou outro objeto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que não pode mais ser curada”; neste contexto, a imagem é a de uma peça de cerâmica que não pode ser consertada.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת por um título português claro, sem restringir necessariamente sua referência a exércitos humanos.
- source_word: כָּכָה
  choice: Deste modo
  rationale: Aponta para o ato simbólico de quebrar a vasilha e mantém distinção em relação a כֹּה, traduzido antes por “Assim”.
- source_word: אֶשְׁבֹּר ... יִשְׁבֹּר
  choice: quebrarei ... se quebra
  rationale: Mantém a repetição da mesma raiz verbal e a ligação direta entre o juízo anunciado e o sinal profético.
- source_word: כְּלִי הַיּוֹצֵר
  choice: uma vasilha feita pelo oleiro
  rationale: Expressa naturalmente o objeto de cerâmica produzido pelo oleiro, sem especificá-lo indevidamente como um jarro.
- source_word: לֹא יוּכַל לְהֵרָפֵה עוֹד
  choice: não pode mais ser consertada
  rationale: Embora רפא signifique literalmente “curar”, no contexto de uma peça quebrada o sentido idiomático é “consertar” ou “restaurar”; “mais” traduz עוֹד.
- source_word: וּבְתֹפֶת יִקְבְּרוּ
  choice: E em Tofete sepultarão
  rationale: Mantém o verbo ativo e o objeto implícito, como no hebraico, e translitera o topônimo em forma corrente em português.
- source_word: מֵאֵין מָקוֹם לִקְבּוֹר
  choice: por não haver outro lugar onde sepultar
  rationale: Comunica a força causal da expressão e torna explícito pelo contexto que falta lugar alternativo para sepultamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. A transliteração “Yahweh” preserva essa função sem substituí-lo por um título.
- issue: Alcance do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos celestiais; das hostes
  rationale: A forma escolhida conserva a amplitude tradicional do título e evita definir no próprio texto se os exércitos são celestiais, terrenos ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você lhes dirá” evita solenidade artificial; “sepultarão” mantém um registro compatível com o anúncio profético. Os marcadores foram colocados junto às expressões que explicam.
