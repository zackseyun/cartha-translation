id: JER.19.12
reference: Jeremiah 19:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֵּֽן אֶעֱשֶׂ֞ה לַ/מָּק֥וֹם הַ/זֶּ֛ה נְאֻם יְהוָ֖ה וּ/לְ/יֽוֹשְׁבָ֑י/ו וְ/לָ/תֵ֛ת אֶת הָ/עִ֥יר הַ/זֹּ֖את כְּ/תֹֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/012.yaml
  text: So I will do to this place[a], declares Yahweh, and to its inhabitants, making this city like Topheth.
translation:
  language: pt
  text: Assim farei com este lugar — declara Yahweh — e com os seus habitantes, tornando esta cidade semelhante a Tofete[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tofete ficava no vale de Ben-Hinom e era associado ao sacrifício de crianças; mais tarde, tornou-se símbolo de profanação e juízo. A comparação indica que Jerusalém se tornaria um lugar de horror e impureza.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Introduz a aplicação do ato simbólico e do anúncio anteriores, preservando o sentido consequencial do hebraico.
- source_word: אֶעֱשֶׂה לַמָּקוֹם הַזֶּה
  choice: farei com este lugar
  rationale: Em português, “fazer com” expressa naturalmente a ação que recairá sobre o lugar sem explicitar além do texto a ideia de “contra”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém o peso da fórmula profética e representa diretamente o nome divino יהוה.
- source_word: וּלְיֹשְׁבָיו
  choice: e com os seus habitantes
  rationale: Retoma de modo natural a construção “farei com” e identifica os moradores do lugar como igualmente afetados.
- source_word: וְלָתֵת
  choice: tornando
  rationale: O infinitivo ligado à oração anterior especifica o resultado ou propósito da ação anunciada; “tornando” preserva essa relação sem forçar uma distinção rígida entre propósito e resultado.
- source_word: הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Tradução direta da expressão demonstrativa, que no contexto se refere a Jerusalém.
- source_word: כְּתֹפֶת
  choice: semelhante a Tofete
  rationale: O prefixo comparativo כְּ estabelece uma comparação; “semelhante a” comunica isso com clareza e evita sugerir identidade literal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico contém diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Natureza da relação expressa por וְלָתֵת
  choice: tornando
  alternative: para tornar; e farei
  rationale: A forma hebraica pode indicar propósito ou resultado em continuidade com a ação principal. O gerúndio mantém essa abertura sem resolver silenciosamente a relação em apenas uma dessas categorias.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com construção idiomática para o complemento afetado (“farei com”) e manutenção da solenidade da fórmula profética.
