  text: Then you shall break the flask before the eyes of the men who are going with you[a].
translation:
  language: pt
  text: Então você quebrará o frasco diante dos olhos dos homens que vão com você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista dos homens que vão com você”.'
    reason: Alternativa idiomática para לְעֵינֵי, preservando o sentido do particípio הַהֹלְכִים («que vão»).
lexical_decisions:
- source_word: וְשָׁבַרְתָּ
  choice: Então você quebrará
  rationale: O perfeito qal na segunda pessoa masculina singular, ligado por וְ, dá sequência às instruções anteriores. O futuro em português expressa naturalmente a ação ordenada na sequência.
- source_word: הַבַּקְבֻּק
  choice: o frasco
  rationale: Designa um recipiente de barro provavelmente de gargalo estreito, usado como objeto simbólico. “Frasco” mantém essa concretude melhor do que o termo mais amplo “vasilha”.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Preserva a imagem vívida da expressão hebraica, que indica uma ação realizada na presença visível de testemunhas.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O substantivo hebraico é especificamente masculino, e o contexto imediato identifica homens escolhidos para acompanhar Jeremias.
- source_word: הַהֹלְכִים אוֹתָךְ
  choice: que forem com você
  rationale: O particípio descreve os homens que acompanham Jeremias nessa ocasião. A formulação é natural em português e mantém a ideia de ir junto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com boa legibilidade brasileira. A expressão “diante dos olhos” conserva a vividez do hebraico; a nota registra uma formulação portuguesa mais idiomática.
