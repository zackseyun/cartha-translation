source:
  edition: WLC
  text: וּ/בָנ֞וּ אֶת בָּמ֣וֹת הַ/בַּ֗עַל לִ/שְׂרֹ֧ף אֶת בְּנֵי/הֶ֛ם בָּ/אֵ֖שׁ עֹל֣וֹת לַ/בָּ֑עַל אֲשֶׁ֤ר לֹֽא צִוִּ֨יתִי֙ וְ/לֹ֣א דִבַּ֔רְתִּי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/005.yaml
  text: They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal—something I did not command or speak[a], nor did it arise in my heart.
translation:
  language: pt
  text: Eles construíram os lugares altos de Baal para queimar no fogo os seus filhos como holocaustos a Baal — algo que eu não ordenei, nem falei[a], e que jamais surgiu em meu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem falei disso”. O hebraico diz simplesmente “nem falei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: Eles construíram
  rationale: O qal perfeito indica uma ação realizada; o pretérito perfeito é natural em português e mantém a força da acusação profética.
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Expressão consagrada para locais de culto, sobretudo idolátrico, preservando o sentido cultual do hebraico.
- source_word: הַבַּעַל / לַבָּעַל
  choice: Baal
  rationale: Em português, o nome da divindade é naturalmente empregado sem artigo neste contexto.
- source_word: לִשְׂרֹף
  choice: para queimar
  rationale: O infinitivo construto expressa a finalidade para a qual os lugares altos foram construídos.
- source_word: בְּנֵיהֶם
  choice: seus filhos
  rationale: Preserva a especificidade lexical de בנים, em vez de generalizar para 'crianças'.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Tradução idiomática da construção preposicional no contexto do sacrifício pelo fogo.
- source_word: עֹלוֹת
  choice: como holocaustos
  rationale: Holocausto é o termo sacrificial técnico para uma oferta inteiramente queimada; 'como' explicita sua relação predicativa com os filhos.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: algo que eu não ordenei
  rationale: A oração relativa retoma toda a prática descrita e é expressa com clareza em português.
- source_word: וְלֹא דִבַּרְתִּי
  choice: nem declarei
  rationale: Mantém o verbo distinto de 'ordenar' e comunica que Deus não proferiu ou enunciou tal prática, sem acrescentar um objeto ausente no hebraico.
- source_word: וְלֹא עָלְתָה עַל לִבִּי
  choice: e que jamais surgiu em meu coração
  rationale: Preserva a imagem antropomórfica do 'coração' e verte o idiomatismo hebraico em português natural; 'jamais' transmite enfaticamente a negação da série coordenada.
theological_decisions:
- issue: Expressão antropomórfica sobre a disposição interior de Deus
  choice: e que jamais surgiu em meu coração
  alternative: nem me veio à mente
  rationale: A tradução conserva 'coração', como no hebraico, sem reduzir a expressão a uma afirmação exclusivamente cognitiva. Ao mesmo tempo, 'surgiu em meu coração' é natural em português e mantém a tensão teológica do original.
- issue: Relação entre 'não ordenei' e 'não falei'
  choice: não ordenei, nem declarei
  alternative: não ordenei, nem mencionei
  rationale: A coordenação conserva as duas afirmações do hebraico sem transformar a segunda apenas em ausência de menção incidental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém os termos bíblico-cultuais tradicionais 'lugares altos' e 'holocaustos', bem como a imagem hebraica do coração.
