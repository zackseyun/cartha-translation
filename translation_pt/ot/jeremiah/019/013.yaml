source:
  edition: WLC
  text: וְ/הָי֞וּ בָּתֵּ֣י יְרוּשָׁלִַ֗ם וּ/בָתֵּי֙ מַלְכֵ֣י יְהוּדָ֔ה כִּ/מְק֥וֹם הַ/תֹּ֖פֶת הַ/טְּמֵאִ֑ים לְ/כֹ֣ל הַ/בָּתִּ֗ים אֲשֶׁ֨ר קִטְּר֜וּ עַל גַּגֹּֽתֵי/הֶם֙ לְ/כֹל֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/הַסֵּ֥ךְ נְסָכִ֖ים לֵ/אלֹהִ֥ים אֲחֵרִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/013.yaml
  text: The houses of Jerusalem and the houses of the kings of Judah will become like the unclean place of Topheth—all the houses on whose rooftops they burned incense to all the host of heaven and poured out drink offerings to other gods[a][b].
translation:
  language: pt
  text: As casas de Jerusalém e as casas dos reis de Judá se tornarão impuras[a] como o lugar de Tofete — todas as casas em cujos terraços queimaram incenso a todo o exército dos céus[b] e derramaram libações a outros deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se tornarão contaminadas”.'
    reason: lexical_alternative
  - marker: b
    text: “Exército dos céus” refere-se aqui aos corpos celestes venerados no culto aos astros.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: ficarão
  rationale: Com a comparação introduzida por כִּ, o verbo descreve o estado resultante anunciado pelo juízo, e não mera existência.
- source_word: בָּתֵּי יְרוּשָׁלִַם וּבָתֵּי מַלְכֵי יְהוּדָה
  choice: As casas de Jerusalém e as casas dos reis de Judá
  rationale: Mantém o paralelismo dos dois sintagmas e conserva o substantivo comum 'casas', sem substituí-lo interpretativamente por 'palácios'.
- source_word: כִּמְקוֹם הַתֹּפֶת
  choice: como o lugar de Tofete
  rationale: Expressa tanto a comparação quanto o substantivo מָקוֹם, explicitamente presente no hebraico; Tofete é mantido como nome geográfico.
- source_word: הַטְּמֵאִים
  choice: impuras
  rationale: O plural masculino no hebraico concorda em sentido com 'casas', também plural, e caracteriza sua condição ritual e moral; em português, o gênero segue 'casas'.
- source_word: לְכֹל הַבָּתִּים אֲשֶׁר
  choice: todas as casas em cujos
  rationale: Entende o לְ como introdutor de especificação ou aposição e liga naturalmente as casas aos terraços onde se praticava o culto.
- source_word: קִטְּרוּ עַל גַּגֹּתֵיהֶם
  choice: em cujos terraços queimaram incenso
  rationale: Traduz o uso cultual de קטר e preserva a localização específica nos terraços das casas.
- source_word: לְכֹל צְבָא הַשָּׁמַיִם
  choice: a todo o exército dos céus
  rationale: Preserva a expressão hebraica tradicional e a totalidade indicada por כֹל, deixando a nota explicar sua referência no contexto idolátrico.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: e derramaram ofertas de bebida
  rationale: Comunica de modo acessível o ato cultual de derramar líquidos como ofertas, preservando a coordenação com a queima de incenso.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Tradução direta da fórmula profética para divindades diferentes do Deus de Israel.
theological_decisions:
- issue: Concordância e alcance de הַטְּמֵאִים
  choice: '''ficarão impuras como o lugar de Tofete'', aplicando ''impuras'' às casas'
  alternative: '''ficarão como o lugar impuro de Tofete'''
  rationale: A forma plural הַטְּמֵאִים favorece a ligação com as casas plurais, enquanto מְקוֹם é singular. A tradução segue essa concordância sem eliminar a possibilidade lexical de contaminação indicada em nota.
- issue: Identidade das 'casas dos reis de Judá'
  choice: manter literalmente 'casas'
  alternative: '''palácios dos reis de Judá'''
  rationale: Embora provavelmente sejam residências reais, o hebraico emprega o substantivo comum 'casas'; a formulação evita uma expansão interpretativa desnecessária.
- issue: Sentido de 'exército dos céus'
  choice: preservar a expressão no texto e explicá-la em nota
  alternative: substituir no texto por 'astros do céu'
  rationale: A expressão pode evocar os corpos celestes concebidos coletivamente como um exército. Mantê-la conserva a imagem hebraica, e a nota esclarece o referente cultual sem apagar sua força literária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura em aposição após o travessão identifica as casas envolvidas, e termos explicativos foram reservados às notas para preservar a imagem e a ambiguidade do hebraico.
