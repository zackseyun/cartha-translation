  text: וְ/יָצָ֨אתָ֙ אֶל גֵּ֣יא בֶן הִנֹּ֔ם אֲשֶׁ֕ר פֶּ֖תַח שַׁ֣עַר ה/חרסות וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דְּבָרִ֖ים אֲשֶׁר אֲדַבֵּ֥ר אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/002.yaml
  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
translation:
  language: pt
  text: e saia para o vale de Ben-Hinom, que fica à entrada da Porta dos Cacos[a], e proclame ali as palavras que eu lhe direi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Porta dos Cacos de Cerâmica”. O nome hebraico dessa porta é incerto; alguns o conservam de forma mais formal como “Porta de Harsite”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָאתָ
  choice: e saia
  rationale: O perfeito qal com waw dá continuidade à sequência de instruções; o imperativo em português transmite naturalmente essa força, enquanto “saia” preserva a ideia de movimento para fora.
- source_word: גֵּיא בֶן הִנֹּם
  choice: o vale de Ben-Hinom
  rationale: Preserva o topônimo sem introduzir as associações posteriores de “Geena”. “Ben-Hinom” é mais natural como nome de lugar do que a tradução estritamente literal “filho de Hinom”.
- source_word: אֲשֶׁר פֶּתַח שַׁעַר הַחַרְסוּת
  choice: que fica à entrada da Porta dos Cacos[a]
  rationale: “À entrada” expressa com naturalidade פֶּתַח שַׁעַר. “Porta dos Cacos” comunica a provável relação de חרסות com cerâmica ou cacos de cerâmica, pertinente à imagem do capítulo, sem esconder em nota a incerteza do nome hebraico.
- source_word: וְקָרָאתָ שָּׁם
  choice: e proclame ali
  rationale: Em contexto profético, קרא denota anúncio público; “proclame” preserva essa força melhor do que o genérico “fale”. “Ali” traduz diretamente o locativo שָׁם.
- source_word: אֶת־הַדְּבָרִים
  choice: as palavras
  rationale: Mantém o sentido concreto de דְּבָרִים e sua ligação formal com a fala divina, em vez de condensá-lo em “mensagem”.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: que eu lhe direi
  rationale: Expressa de modo natural em português a fala futura de Deus dirigida a Jeremias. “Direi” evita a construção menos idiomática “falarei a você” sem alterar o conteúdo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com formas imperativas naturais. O topônimo “Ben-Hinom” e a referência a “palavras” foram preservados para evitar associações posteriores e paráfrases desnecessárias.
