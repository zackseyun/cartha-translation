  text: וַ/יָּבֹ֤א יִרְמְיָ֨הוּ֙ מֵֽ/הַ/תֹּ֔פֶת אֲשֶׁ֨ר שְׁלָח֧/וֹ יְהוָ֛ה שָׁ֖ם לְ/הִנָּבֵ֑א וַֽ/יַּעֲמֹד֙ בַּ/חֲצַ֣ר בֵּית יְהוָ֔ה וַ/יֹּ֖אמֶר אֶל כָּל הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/014.yaml
  text: Then Jeremiah came from Topheth[a], where Yahweh had sent him to prophesy, and he stood in the court of the house of Yahweh and said to all the people,
translation:
  language: pt
  text: 'Então Jeremias veio de Tofete[a], para onde Yahweh o havia enviado a profetizar. Ele se pôs de pé no pátio da casa de Yahweh e disse a todo o povo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tofete era o local ligado ao sinal profético e à mensagem anunciada anteriormente por Jeremias neste capítulo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: voltou
  rationale: Embora בוא possa significar «vir» ou «ir», o contexto descreve Jeremias deixando Tofete e retornando ao recinto do templo; «voltou» expressa naturalmente esse movimento em português.
- source_word: מֵהַתֹּפֶת
  choice: de Tofete
  rationale: Tofete é nome de lugar; a forma portuguesa tradicional preserva o topônimo, e o artigo hebraico não precisa ser reproduzido.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה שָׁם
  choice: para onde Yahweh o havia enviado
  rationale: O relativo e o advérbio שָׁם identificam Tofete como o destino do envio. O mais-que-perfeito marca com clareza a ação anterior ao retorno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְהִנָּבֵא
  choice: a profetizar
  rationale: Reproduz diretamente o infinitivo de נבא em linguagem corrente e digna.
- source_word: וַיַּעֲמֹד
  choice: se pôs de pé
  rationale: Neste contexto de discurso público, a expressão comunica naturalmente que Jeremias assumiu uma posição em pé, sem acrescentar a ideia mais forte de confronto.
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: no pátio da casa de Yahweh
  rationale: «Pátio» é a correspondência moderna e clara de חצר; «casa de Yahweh» preserva a construção hebraica e a referência ao templo.
- source_word: וַיֹּאמֶר אֶל כָּל הָעָם
  choice: e disse a todo o povo
  rationale: Mantém o verbo comum אמר e preserva a abrangência de כָּל הָעָם.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita um período excessivamente longo; os dois-pontos mantêm o versículo aberto para a fala que começa no versículo seguinte.
