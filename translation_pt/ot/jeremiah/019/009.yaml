  text: וְ/הַֽאֲכַלְתִּ֞י/ם אֶת בְּשַׂ֣ר בְּנֵי/הֶ֗ם וְ/אֵת֙ בְּשַׂ֣ר בְּנֹתֵי/הֶ֔ם וְ/אִ֥ישׁ בְּשַׂר רֵעֵ֖/הוּ יֹאכֵ֑לוּ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֧יקוּ לָ/הֶ֛ם אֹיְבֵי/הֶ֖ם וּ/מְבַקְשֵׁ֥י נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/009.yaml
  text: And I will make them eat the flesh of their sons and the flesh of their daughters[b][a], and each will eat the flesh of his neighbor in the siege and in the distress with which their enemies and those who seek their life will afflict them.
translation:
  language: pt
  text: Farei com que comam a carne de seus filhos e a carne de suas filhas; cada um comerá a carne do seu próximo durante o cerco e a aflição[a] com que os oprimirão seus inimigos e os que procuram tirar-lhes a vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante o cerco e a angústia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os que procuram a vida deles”, expressão que significa os que procuram matá-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲכַלְתִּים
  choice: Farei com que comam
  rationale: Preserva o valor causativo do hifil de אכל e a agência divina direta no anúncio de juízo, sem sugerir mera permissão.
- source_word: בְּשַׂר בְּנֵיהֶם וְאֵת בְּשַׂר בְּנֹתֵיהֶם
  choice: a carne de seus filhos e a carne de suas filhas
  rationale: Mantém a repetição enfática de בְּשַׂר e a distinção explícita entre filhos e filhas, preservando a dureza da imagem.
- source_word: וְאִישׁ בְּשַׂר רֵעֵהוּ יֹאכֵלוּ
  choice: cada um comerá a carne do seu próximo
  rationale: אִישׁ tem sentido distributivo neste contexto. “Cada um” é natural em português e evita restringir indevidamente a referência somente a homens; “próximo” traduz adequadamente רֵעַ como membro da mesma comunidade.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: durante o cerco e a aflição
  rationale: “Durante” expressa naturalmente a circunstância temporal de בְּמָצוֹר; “aflição” comunica a pressão e angústia extrema de מָצוֹק.
- source_word: אֲשֶׁר יָצִיקוּ לָהֶם
  choice: com que os oprimirão
  rationale: O verbo יָצִיקוּ denota impor pressão severa ou afligir. “Oprimir” preserva essa força e mantém a relação instrumental com o cerco e a aflição.
- source_word: וּמְבַקְשֵׁי נַפְשָׁם
  choice: e os que procuram tirar-lhes a vida
  rationale: Torna claro o sentido idiomático de “buscar a vida” — procurar matar — sem traduzir נֶפֶשׁ como uma “alma” imaterial neste contexto.
theological_decisions:
- issue: Agência divina no juízo
  choice: “Farei com que comam” apresenta Deus como causa direta do juízo anunciado.
  alternative: “Deixarei que comam” ou “permitirei que comam”.
  rationale: A forma causativa hebraica não deve ser atenuada para um sentido meramente permissivo; a tradução conserva a severidade e a tensão teológica do texto.
- issue: Sentido antropológico de נֶפֶשׁ
  choice: “tirar-lhes a vida”
  alternative: “buscar a sua alma” ou a expressão mais literal “buscar a sua vida”.
  rationale: Neste idioma hebraico, נֶפֶשׁ se refere à vida ameaçada. A formulação escolhida comunica que essas pessoas procuram matá-los, sem introduzir uma concepção específica sobre a alma.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção conserva a repetição e a brutalidade deliberadas do hebraico, sem suavizar o juízo nem acrescentar interpretação denominacional.
