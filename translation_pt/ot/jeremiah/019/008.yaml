base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/008.yaml
  text: And I will make this city a horror and an object of hissing[b][a]; everyone who passes by it will be appalled and will hiss because of all its wounds.
translation:
  language: pt
  text: Farei desta cidade uma desolação e objeto de assobio[a]. Todo aquele que passar por ela ficará espantado e assobiará por causa de todas as suas feridas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um horror e objeto de assobio”. Os substantivos hebraicos podem referir-se tanto à condição arruinada da cidade quanto ao espanto e escárnio que ela provoca.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficará horrorizado e assobiará por causa de todos os golpes que ela sofreu”. No hebraico profético, o assobio pode expressar espanto ou desprezo diante do juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Farei
  rationale: No padrão שׂים + לְ, o verbo expressa o resultado imposto à cidade; “farei” é natural e preserva essa força.
- source_word: הָעִיר הַזֹּאת
  choice: desta cidade
  rationale: Preserva de modo direto a construção demonstrativa “esta cidade”.
- source_word: לְשַׁמָּה
  choice: um lugar de horror
  rationale: שַׁמָּה pode indicar tanto devastação quanto o horror que ela causa. A formulação mantém ambos em vista sem reduzir o termo apenas a “desolação”.
- source_word: וְלִשְׁרֵקָה
  choice: alvo de assobios de desprezo
  rationale: O substantivo ligado a שרק descreve a cidade como objeto de assobio ou silvo diante do juízo. “De desprezo” torna clara para o leitor moderno a função convencional do gesto.
- source_word: כֹּל עֹבֵר עָלֶיהָ
  choice: Todo aquele que passar por ela
  rationale: Reproduz a força universal de כֹּל e verte naturalmente a expressão participial genérica.
- source_word: יִשֹּׁם
  choice: ficará horrorizado
  rationale: Neste contexto, שׁמם descreve a reação de espanto e horror diante da devastação; a escolha também ecoa o primeiro substantivo do versículo.
- source_word: וְיִשְׁרֹק
  choice: assobiará
  rationale: שרק pode significar assobiar ou sibilar. “Assobiará” é inteligível em português, enquanto a nota esclarece seu valor de espanto ou desprezo.
- source_word: עַל כָּל מַכֹּתֶיהָ
  choice: por causa de todas as suas feridas
  rationale: מַכָּה abrange golpe, ferida ou calamidade. “Feridas” conserva a imagem vívida da cidade atingida sem restringi-la a doença.
