translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A repetição entre “horror” e “horrorizado” conserva a ligação lexical do hebraico. “Assobios de desprezo” explicita no texto a imagem cultural, e as notas preservam as alternativas “desolação”, “espantado”, “golpes” e a possível nuance de assobio/silvo.
