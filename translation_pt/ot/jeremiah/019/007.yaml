id: JER.19.7
reference: Jeremiah 19:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ֠/בַקֹּתִי אֶת עֲצַ֨ת יְהוּדָ֤ה וִ/ירוּשָׁלִַ֨ם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הִפַּלְתִּ֤י/ם בַּ/חֶ֨רֶב֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/נָתַתִּ֤י אֶת נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
translation:
  language: pt
  text: E frustrarei o plano de Judá e de Jerusalém neste lugar[a]. Eu os farei cair à espada diante de seus inimigos e pela mão dos que procuram tirar-lhes a vida[b]; entregarei seus cadáveres como alimento às aves dos céus[c] e aos animais da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o conselho de Judá e de Jerusalém”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “procuram a vida deles”, isto é, procuram matá-los.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “às aves do céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַקֹּתִי
  choice: frustrarei
  rationale: O causativo de בקק comunica a ideia de esvaziar ou tornar ineficaz. “Frustrarei” expressa naturalmente, em português, a anulação do plano sem enfraquecer a ação divina.
- source_word: עֲצַת
  choice: o plano
  rationale: עֵצָה pode significar conselho, plano ou estratégia. “Plano” é claro no contexto e mantém aberta em nota a alternativa “conselho”.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: Judá e Jerusalém
  rationale: Formas tradicionais dos nomes geográficos em português, preservando a associação entre o reino e sua capital.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: neste lugar
  rationale: Tradução locativa direta que preserva a referência enfática ao lugar indicado no contexto.
- source_word: וְהִפַּלְתִּים
  choice: Eu os farei cair
  rationale: Preserva a força causativa do hifil de נפל e a agência explícita da primeira pessoa.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Expressão portuguesa corrente para morte por ação bélica, mantendo o valor instrumental do hebraico.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: diante dos seus inimigos
  rationale: Mantém o sentido espacial e relacional de לִפְנֵי de modo natural em português.
- source_word: וּבְיַד מְבַקְשֵׁי נַפְשָׁם
  choice: e pelas mãos dos que procuram matá-los
  rationale: “Pelas mãos” conserva o idioma hebraico de agência; “procuram matá-los” comunica em português atual o sentido contextual de “procuram a vida deles”, cuja forma literal é registrada em nota.
- source_word: וְנָתַתִּי
  choice: entregarei
  rationale: Neste contexto, נתן indica dar ou entregar os cadáveres como alimento. “Entregarei” é natural e preserva a agência deliberada da declaração.
- source_word: נִבְלָתָם
  choice: seus cadáveres
  rationale: נְבֵלָה designa corpos mortos. “Cadáveres” é preciso para seres humanos e mantém a indignidade do destino descrito.
- source_word: לְמַאֲכָל
  choice: como alimento
  rationale: Reproduz com clareza a função predicativa da expressão hebraica.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: às aves dos céus
  rationale: Conserva a imagem e o plural hebraico de שָׁמַיִם em registro bíblico digno; “aves do céu” permanece como alternativa idiomática em nota.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: e aos animais da terra
  rationale: Tradução clara do paralelismo com as aves, sem restringir בְּהֵמָה a uma categoria moderna excessivamente específica.
theological_decisions:
- issue: Agência divina na declaração de juízo
  choice: 'Mantida a sequência em primeira pessoa: “frustrarei”, “farei cair” e “entregarei”.'
  alternative: Formulações permissivas, como “deixarei que caiam”.
  rationale: Os verbos hebraicos apresentam ações divinas explícitas. Uma formulação meramente permissiva suavizaria a agência judicial afirmada pelo texto.
- issue: Sentido do idioma “procurar a vida”
  choice: Traduzido no corpo do texto como “procuram matá-los”, com a forma hebraica indicada em nota.
  alternative: “Procuram a vida deles.”
  rationale: O idioma hebraico significa procurar causar a morte. A tradução escolhida torna o sentido inteligível sem transformar a expressão em uma afirmação teológica mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi dividida em duas frases para clareza, sem alterar a sequência das ações. Mantiveram-se expressões bíblicas naturais como “à espada”, “diante dos seus inimigos” e “aves dos céus”.
