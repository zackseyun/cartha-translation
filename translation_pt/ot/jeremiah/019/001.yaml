source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הָל֛וֹךְ וְ/קָנִ֥יתָ בַקְבֻּ֖ק יוֹצֵ֣ר חָ֑רֶשׂ וּ/מִ/זִּקְנֵ֣י הָ/עָ֔ם וּ/מִ/זִּקְנֵ֖י הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/001.yaml
  text: 'Thus says Yahweh: Go and buy a potter’s earthenware flask[a], and take some of the elders of the people and some of the elders of the priests[b],'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Vá comprar um frasco de barro feito por um oleiro[a] e leve com você alguns dos anciãos do povo e alguns dos anciãos dos sacerdotes[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma vasilha de barro feita por um oleiro” ou “uma garrafa de barro”. O termo hebraico indica um recipiente moldado, provavelmente de gargalo estreito.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dentre os anciãos do povo e dentre os anciãos dos sacerdotes”; isto indica que Jeremias deveria levar representantes dos dois grupos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene em português natural e mantém o nome divino como nome próprio.
- source_word: הָלוֹךְ וְקָנִיתָ
  choice: Vá comprar
  rationale: O infinitivo absoluto tem força imperativa; a construção portuguesa expressa de modo natural a ordem única de ir e comprar.
- source_word: בַקְבֻּק
  choice: frasco
  rationale: Designa um recipiente moldado, provavelmente de gargalo estreito; “frasco” comunica melhor essa forma do que o termo mais amplo “jarro”.
- source_word: יוֹצֵר חָרֶשׂ
  choice: de barro feito por um oleiro
  rationale: Explicita de modo natural tanto o material do recipiente quanto sua produção pelo oleiro, sem sugerir que ainda fosse barro cru.
- source_word: וּמִזִּקְנֵי הָעָם
  choice: e leve com você alguns dos anciãos do povo
  rationale: 'O verbo “levar” está implícito, e מִן tem sentido partitivo: representantes dentre os anciãos devem acompanhar Jeremias.'
- source_word: וּמִזִּקְנֵי הַכֹּהֲנִים
  choice: e alguns dos anciãos dos sacerdotes
  rationale: Mantém o paralelismo e a relação genitiva do hebraico, preservando a possível referência a líderes dentre o corpo sacerdotal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome pessoal divino e evita substituí-lo por um título; “Yahweh” corresponde melhor à reconstrução acadêmica corrente.
- issue: Identidade dos זִקְנֵי הַכֹּהֲנִים
  choice: anciãos dos sacerdotes
  alternative: sacerdotes mais velhos; líderes sacerdotais
  rationale: A tradução formal preserva a ambiguidade entre idade, posição de liderança e representantes reconhecidos do grupo sacerdotal, sem resolver a expressão de maneira interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética conserva solenidade sem arcaísmo. “Leve com você” supre de forma transparente o verbo implícito exigido pelo contexto. As duas notas registram alternativas lexicais e a construção partitiva sem sobrecarregar o versículo.
