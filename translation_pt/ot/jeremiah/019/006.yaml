  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יִקָּרֵא֩ לַ/מָּק֨וֹם הַ/זֶּ֥ה ע֛וֹד הַ/תֹּ֖פֶת וְ/גֵ֣יא בֶן הִנֹּ֑ם כִּ֖י אִם גֵּ֥יא הַ/הֲרֵגָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/006.yaml
  text: Therefore, look, days are coming, declares the LORD, when this place will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter.
translation:
  language: pt
  text: Por isso, eis que vêm dias — declara o SENHOR — em que este lugar já não será chamado Tofete nem Vale de Ben-Hinom, mas Vale da Matança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a conclusão ou consequência introduzida pelo hebraico.
- source_word: הִנֵּה
  choice: vejam
  rationale: Mantém a função enfática e de chamada à atenção do marcador hebraico, em linguagem corrente.
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: Reproduz a fórmula profética de autoridade; SENHOR segue a convenção portuguesa para o nome divino YHWH.
- source_word: הַתֹּפֶת
  choice: Tofete
  rationale: Translitera o topônimo sem lhe impor uma interpretação etimológica.
- source_word: גֵּיא בֶן הִנֹּם
  choice: vale de Ben-Hinom
  rationale: Preserva o nome geográfico hebraico em forma legível em português.
- source_word: גֵּיא הַהֲרֵגָה
  choice: vale da Matança
  rationale: Traduz diretamente o novo nome profético, conservando sua força sombria.
theological_decisions:
- issue: Tratamento do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção bíblica portuguesa amplamente reconhecida, sem acrescentar uma posição denominacional.
- issue: Relação entre os dois nomes anteriores do lugar
  choice: nem
  alternative: e
  rationale: Em português, a estrutura negativa “já não... nem...” comunica com naturalidade que nenhum dos dois nomes continuará a ser usado; não altera o referente nem a força da profecia.
translation_notes:
  register: Português moderno, digno e acessível, com cadência profética. Os travessões destacam a fórmula oracular sem obscurecer a frase principal; os topônimos são preservados por transliteração.
