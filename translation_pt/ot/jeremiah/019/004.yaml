source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָבֻ֗/נִי וַֽ/יְנַכְּר֞וּ אֶת הַ/מָּק֤וֹם הַ/זֶּה֙ וַ/יְקַטְּרוּ ב/וֹ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁ֧ר לֹֽא יְדָע֛וּ/ם הֵ֥מָּה וַ/אֲבֽוֹתֵי/הֶ֖ם וּ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מָֽלְא֛וּ אֶת הַ/מָּק֥וֹם הַ/זֶּ֖ה דַּ֥ם נְקִיִּֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/004.yaml
  text: Because they have forsaken me and made this place unrecognizable[a], and have burned incense in it to other gods whom neither they nor their fathers nor the kings of Judah had known, and they have filled this place with the blood of innocents[b],
translation:
  language: pt
  text: Porque me abandonaram, trataram este lugar como alheio[a] e nele queimaram incenso a outros deuses, que nem eles, nem seus antepassados, nem os reis de Judá haviam conhecido; e encheram este lugar com o sangue de inocentes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornaram este lugar estranho”; também pode ser entendido como “profanaram este lugar”. O verbo hebraico traz a ideia de tornar algo alheio ou estranho.
    reason: lexical_alternative
  - marker: b
    text: Ou “sangue inocente”. O hebraico diz literalmente “sangue de inocentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Porque
  rationale: Expressa de modo claro e natural a causa do juízo anunciado no contexto.
- source_word: עֲזָבֻנִי
  choice: me abandonaram
  rationale: Comunica o sentido relacional e pactual de deixar ou rejeitar o SENHOR, em português moderno e corrente.
- source_word: וַיְנַכְּרוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: trataram este lugar como alheio
  rationale: Preserva a imagem central de tornar o lugar estranho ou alheio à sua dedicação própria, sem adotar no texto principal a interpretação mais específica de que o profanaram.
- source_word: וַיְקַטְּרוּ בוֹ
  choice: nele queimaram incenso
  rationale: קטר neste contexto designa mais naturalmente a queima de incenso ou uma oferta que produz fumaça; a formulação portuguesa é clara e específica.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Equivalente direto e convencional, sem acrescentar a ideia distinta de deuses estrangeiros.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: que ... haviam conhecido
  rationale: Mantém a linguagem de conhecimento ou reconhecimento religioso e o valor retrospectivo da oração.
- source_word: הֵמָּה וַאֲבוֹתֵיהֶם וּמַלְכֵי יְהוּדָה
  choice: nem eles, nem seus antepassados, nem os reis de Judá
  rationale: Estende com clareza a negação aos três grupos enumerados no hebraico.
- source_word: וּמָלְאוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: e encheram este lugar
  rationale: Reproduz diretamente a acusação e a repetição enfática de “este lugar”.
- source_word: דַּם נְקִיִּם
  choice: o sangue de inocentes
  rationale: Preserva a referência pessoal plural do hebraico, em vez de reduzi-la à expressão mais idiomática “sangue inocente”.
theological_decisions:
- issue: Sentido de נכר aplicado a “este lugar”
  choice: trataram este lugar como alheio
  alternative: profanaram este lugar
  rationale: O verbo enfatiza tornar estranho ou alheio. “Profanaram” é uma interpretação contextual plausível, mas mais específica; a opção adotada mantém a imagem hebraica e sua tensão com o culto prestado a outros deuses.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura causal e o encadeamento acusatório foram preservados; o versículo termina com vírgula porque a frase continua no versículo seguinte.
