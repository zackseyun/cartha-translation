id: JER.19.15
reference: Jeremiah 19:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מבי אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל כָּל עָרֶ֔י/הָ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלֶ֑י/הָ כִּ֤י הִקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֖י שְׁמ֥וֹעַ אֶת דְּבָרָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/015.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Behold, I am bringing on this city and on all its towns all the disaster that I have spoken against it[c][b], because they have stiffened their neck so as not to hear my words.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: “Eis que estou trazendo sobre esta cidade e sobre todas as suas cidades[a] toda a calamidade[b] que anunciei contra ela, porque eles endureceram a nuca[c] para não ouvir as minhas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as suas localidades”. O termo hebraico pode designar cidades ou povoações menores.
    reason: lexical_alternative
  - marker: b
    text: Ou “desgraça”; aqui o termo hebraico se refere à calamidade trazida como juízo, não ao mal moral.
    reason: lexical_alternative
  - marker: c
    text: Expressão hebraica que retrata uma recusa obstinada em obedecer.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת por um termo português estabelecido, capaz de abranger os exércitos celestes e terrenos.
- source_word: הִנְנִי מבי
  choice: Eis que estou trazendo
  rationale: Mantém a solenidade e a iminência de הִנְנִי, juntamente com o sentido causativo de fazer a calamidade vir sobre a cidade.
- source_word: כָּל עָרֶיהָ
  choice: todas as suas cidades
  rationale: Reproduz de modo direto o sufixo pronominal e preserva a amplitude de עָרִים, que pode designar cidades ou localidades menores vinculadas a Jerusalém.
- source_word: כָּל הָרָעָה
  choice: toda a calamidade
  rationale: Neste contexto de juízo, רָעָה denota desgraça ou calamidade sofrida, e não maldade moral.
- source_word: דִּבַּרְתִּי עָלֶיהָ
  choice: que anunciei contra ela
  rationale: ‘Anunciei’ expressa naturalmente a declaração profética anterior, enquanto ‘contra ela’ conserva a orientação hostil de עַל neste contexto.
- source_word: הִקְשׁוּ אֶת עָרְפָּם
  choice: endureceram a nuca
  rationale: Conserva a metáfora hebraica de resistência obstinada, sem substituí-la silenciosamente por uma interpretação abstrata.
- source_word: לְבִלְתִּי שְׁמוֹעַ
  choice: para não ouvir
  rationale: Mantém a construção final do hebraico e a ligação direta entre a obstinação e a recusa de escutar.
theological_decisions:
- issue: Forma do nome divino no título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos
  rationale: O texto hebraico contém o nome pessoal יהוה; sua transliteração evita substituí-lo por um título e preserva a identificação pactual.
- issue: Natureza de רָעָה no juízo anunciado
  choice: calamidade
  alternative: mal
  rationale: O contexto trata do desastre que Deus fará vir como juízo, não de atribuir maldade moral a Deus; ‘calamidade’ preserva essa distinção contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva a solenidade profética, o nome divino, a metáfora corporal do hebraico e as ambiguidades lexicais relevantes por meio de notas breves.
