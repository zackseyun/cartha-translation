  text: וְ/אָֽמַרְתָּ֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה מַלְכֵ֣י יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ עַל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר כָּל שֹׁמְעָ֖/הּ תִּצַּ֥לְנָה אָזְנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/003.yaml
  text: 'And say, ‘Hear the word of the LORD, O kings of Judah and inhabitants of Jerusalem. Thus says the LORD of hosts, the God of Israel: Behold, I am bringing disaster on this place, at which everyone who hears of it—his ears will tingle.’'
translation:
  language: pt
  text: 'E diga: “Ouçam a palavra do SENHOR, ó reis de Judá e moradores de Jerusalém. Assim diz o SENHOR dos Exércitos, o Deus de Israel: Eis que trarei uma calamidade sobre este lugar; todo aquele que ouvir falar dela ficará com os ouvidos tinindo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional para o tetragrama, em versaletes, sem apagar que se trata do nome divino.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Preserva o título divino e sua imagem militar/celestial de modo consagrado e inteligível em português.
- source_word: רָעָה
  choice: calamidade
  rationale: Neste anúncio de juízo, o termo indica desgraça ou desastre trazido sobre o lugar, não maldade moral.
- source_word: תִּצַּלְנָה אָזְנָיו
  choice: ficará com os ouvidos tinindo
  rationale: Reproduz a expressão vívida hebraica para o choque causado por uma notícia terrível, em português natural.
- source_word: יֹשְׁבֵי
  choice: moradores
  rationale: Expressa de modo corrente os habitantes de Jerusalém, sem rigidez desnecessária.
theological_decisions:
- issue: Agência divina na calamidade anunciada
  choice: “trarei uma calamidade”
  alternative: “permitirei que uma calamidade venha”
  rationale: O particípio hebraico מֵבִיא atribui diretamente a ação ao SENHOR; a tradução não enfraquece essa tensão teológica.
- issue: Plural “reis de Judá”
  choice: Manter o plural literal
  alternative: Harmonizar para o singular “rei de Judá”
  rationale: O texto massorético traz מַלְכֵי no plural, possivelmente dirigindo-se à casa real ou à sucessão de reis; a ambiguidade deve ser preservada.
- issue: Referente feminino em שֹׁמְעָהּ
  choice: “ouvir falar dela” refere-se à calamidade
  alternative: “ouvir falar disso” refere-se ao acontecimento inteiro
  rationale: O sufixo feminino pode retomar רָעָה, “calamidade”; a formulação portuguesa conserva essa ligação provável sem ampliar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a abertura coordenada “E diga”, o vocativo solene e a imagem idiomática dos ouvidos tinindo.
