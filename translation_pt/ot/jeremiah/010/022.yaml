  text: ק֤וֹל שְׁמוּעָה֙ הִנֵּ֣ה בָאָ֔ה וְ/רַ֥עַשׁ גָּד֖וֹל מֵ/אֶ֣רֶץ צָפ֑וֹן לָ/שׂ֞וּם אֶת עָרֵ֧י יְהוּדָ֛ה שְׁמָמָ֖ה מְע֥וֹן תַּנִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/022.yaml
  text: The sound of a report—look, it is coming!—a great commotion from the land of the north, to make the cities of Judah a desolation, a haunt of jackals.
translation:
  language: pt
  text: 'O som de uma notícia: eis que vem! Um grande estrondo da terra do norte, para tornar as cidades de Judá uma desolação, morada de chacais.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל שְׁמוּעָה֙
  choice: Ouçam! Vem chegando uma notícia
  rationale: A expressão hebraica combina literalmente “som/voz” e “notícia/relato”. Em português, a interjeição “Ouçam!” preserva a força de קוֹל como chamada auditiva, enquanto “vem chegando uma notícia” comunica naturalmente שְׁמוּעָה ... בָאָה.
- source_word: וְרַעַשׁ גָּדוֹל
  choice: um grande estrondo
  rationale: רַעַשׁ pode indicar ruído, tumulto ou abalo. “Estrondo” mantém a imagem sonora e ameaçadora sem determinar além do texto a natureza exata do acontecimento.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: vindo da terra do norte
  rationale: Tradução direta que preserva a fórmula geográfica e teológica característica de Jeremias.
- source_word: לָשׂוּם ... שְׁמָמָה
  choice: para transformar ... em desolação
  rationale: Expressa a construção final com לְ e o sentido causativo de שׂוּם, mantendo שְׁמָמָה como estado de devastação.
- source_word: מְעוֹן תַּנִּים
  choice: morada de chacais
  rationale: תַּנִּים, neste contexto de ruínas desabitadas, é adequadamente entendido como chacais; “morada” traduz מְעוֹן de modo simples e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com ritmo profético e forte imagem auditiva. A abertura foi formulada idiomaticamente para evitar o pouco natural “o som de uma notícia”, sem perder os dois elementos do hebraico.
