id: JER.10.23
reference: Jeremiah 10:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָדַ֣עְתִּי יְהוָ֔ה כִּ֛י לֹ֥א לָ/אָדָ֖ם דַּרְכּ֑/וֹ לֹֽא לְ/אִ֣ישׁ הֹלֵ֔ךְ וְ/הָכִ֖ין אֶֽת צַעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/023.yaml
  text: I know[a], O Yahweh, that a man's way is not his own[b]; it is not for a man who walks to direct his steps.
translation:
  language: pt
  text: Eu sei, ó Yahweh, que o caminho do ser humano não lhe pertence[a]; não cabe ao homem que caminha dirigir[b] os próprios passos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “o caminho do homem não está nele mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “estabelecer” ou “firmar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Eu sei
  rationale: O perfeito qal na primeira pessoa expressa aqui um reconhecimento firme; o presente comunica naturalmente em português essa convicção atual e sentenciosa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָאָדָם
  choice: do ser humano
  rationale: אָדָם tem sentido genérico neste contexto. “Ser humano” comunica essa abrangência com clareza em português moderno.
- source_word: דַּרְכּוֹ
  choice: o caminho
  rationale: דרך designa tanto um caminho quanto, figuradamente, o rumo ou curso da vida; “caminho” preserva ambas as dimensões.
- source_word: לֹא לָאָדָם דַּרְכּוֹ
  choice: o caminho do ser humano não lhe pertence
  rationale: A construção hebraica é elíptica, literalmente próxima de “não é do homem o seu caminho”. A formulação escolhida preserva a ideia de que o ser humano não dispõe autonomamente de seu curso sem acrescentar determinismo.
- source_word: לְאִישׁ הֹלֵךְ
  choice: ao homem que caminha
  rationale: Mantém o substantivo אִישׁ e o particípio הֹלֵךְ, cuja imagem concreta também sugere a pessoa seguindo o curso da vida.
- source_word: וְהָכִין
  choice: dirigir
  rationale: O hifil de כון pode significar estabelecer, firmar, preparar ou dirigir. Com “passos”, “dirigir” expressa de modo idiomático a ordenação do próprio percurso, enquanto a nota registra a alternativa lexical.
- source_word: אֶת צַעֲדוֹ
  choice: os próprios passos
  rationale: Embora צעד esteja no singular, o plural é a forma idiomática em português para o movimento e, figuradamente, para o curso da vida. “Próprios” retoma naturalmente o possuidor indicado pelo sufixo hebraico.
theological_decisions:
- issue: Agência humana e soberania divina na afirmação proverbial
  choice: A tradução afirma que o ser humano não possui domínio autônomo sobre o rumo da própria vida.
  alternative: Ler o versículo como uma afirmação de limitação humana ou como oração de dependência, sem formular uma doutrina completa de determinismo.
  rationale: O hebraico nega que o caminho pertença ao ser humano e que quem caminha possa dirigir os próprios passos. A redação preserva essa dependência, mas não identifica explicitamente o agente que os dirige nem transforma a frase em uma tese determinista abrangente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ó Yahweh” conserva o vocativo solene; “ser humano” explicita o uso genérico de אָדָם, enquanto “homem que caminha” preserva a imagem e o paralelismo de אִישׁ הֹלֵךְ. Todos os marcadores de nota aparecem junto ao trecho correspondente.
