source:
  edition: WLC
  text: כְּ/תֹ֨מֶר מִקְשָׁ֥ה הֵ֨מָּה֙ וְ/לֹ֣א יְדַבֵּ֔רוּ נָשׂ֥וֹא יִנָּשׂ֖וּא כִּ֣י לֹ֣א יִצְעָ֑דוּ אַל תִּֽירְא֤וּ מֵ/הֶם֙ כִּי לֹ֣א יָרֵ֔עוּ וְ/גַם הֵיטֵ֖יב אֵ֥ין אוֹתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/005.yaml
  text: They are like a scarecrow in a cucumber field[a], and they cannot speak; they must be carried, because they cannot walk. Do not fear them, for they cannot do harm[b], nor can they do good.
translation:
  language: pt
  text: Eles são como um espantalho numa plantação de pepinos[a] e não podem falar; precisam ser carregados, pois não podem andar. Não tenham medo deles, porque não podem fazer mal[b], nem podem fazer o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um poste numa plantação de melões”. A imagem hebraica é difícil; muitos entendem que se trata de um espantalho ou poste erguido numa horta.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico também pode ser traduzido: “porque não fazem mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹמֶר מִקְשָׁה
  choice: como um espantalho numa plantação de pepinos
  rationale: A expressão hebraica é difícil. תֹמֶר pode indicar uma forma semelhante a uma palmeira, uma coluna ou outro objeto erguido, enquanto מִקְשָׁה designa uma plantação de pepinos ou melões. No contexto de ídolos imóveis, a formulação comunica com naturalidade a imagem provável, sem ocultar a alternativa na nota.
- source_word: וְלֹא יְדַבֵּרוּ
  choice: e não podem falar
  rationale: Embora a forma negue a ação de falar, o contexto ressalta a incapacidade dos ídolos; “não podem falar” expressa essa força em português corrente.
- source_word: נָשׂוֹא יִנָּשׂוּא
  choice: precisam ser carregados
  rationale: 'O infinitivo absoluto com o verbo finito intensifica a ideia passiva: esses objetos necessariamente têm de ser transportados por outros.'
- source_word: כִּי לֹא יִצְעָדוּ
  choice: pois não podem andar
  rationale: צעד significa dar passos ou andar. A incapacidade de andar explica por que os ídolos precisam ser carregados.
- source_word: אַל תִּירְאוּ מֵהֶם
  choice: Não tenham medo deles
  rationale: Imperativo plural claro e natural, preservando a advertência profética.
- source_word: כִּי לֹא יָרֵעוּ
  choice: porque não podem fazer mal
  rationale: O hifil de רעע pode significar causar mal ou dano. Aqui, a polêmica salienta que os ídolos são incapazes de prejudicar.
- source_word: וְגַם הֵיטֵיב אֵין אוֹתָם
  choice: nem podem fazer o bem
  rationale: A construção nega que haja neles capacidade para fazer o bem. A tradução direta preserva o contraste com “fazer mal” e soa natural em português.
theological_decisions:
- issue: Natureza da polêmica contra os ídolos
  choice: 'Expressar a completa impotência dos ídolos: não podem falar, andar, fazer mal nem fazer o bem.'
  alternative: Traduzir as formas negativas mais literalmente como simples ações que eles não realizam, sem explicitar incapacidade.
  rationale: O contexto apresenta os ídolos como objetos inertes feitos por seres humanos. O uso de “não podem” comunica a impotência destacada pela sequência hebraica sem acrescentar uma doutrina denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Plantação” evita regionalismos de “roça” ou “pepinal”; o plural de tratamento foi mantido sem pronome explícito.
