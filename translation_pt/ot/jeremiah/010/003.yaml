id: JER.10.3
reference: Jeremiah 10:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי חֻקּ֥וֹת הָֽ/עַמִּ֖ים הֶ֣בֶל ה֑וּא כִּֽי עֵץ֙ מִ/יַּ֣עַר כְּרָת֔/וֹ מַעֲשֵׂ֥ה יְדֵ֥י חָרָ֖שׁ בַּֽ/מַּעֲצָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/003.yaml
  text: For the customs of the peoples are vanity[a], for a tree is cut from the forest, the work of the hands of a craftsman with an axe.
translation:
  language: pt
  text: Pois os costumes dos povos são futilidade; pois uma árvore da floresta é cortada — obra das mãos de um artesão com um machado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma enxó”. O termo hebraico indica uma ferramenta usada para cortar ou desbastar madeira, mas não se sabe ao certo qual era o instrumento exato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקּוֹת
  choice: costumes
  rationale: No contexto das práticas religiosas dos povos, o termo designa usos ou costumes estabelecidos, e não principalmente estatutos jurídicos.
- source_word: הָעַמִּים
  choice: dos povos
  rationale: Preserva o plural coletivo e é natural em português, sem a conotação política moderna que “nações” pode sugerir.
- source_word: הֶבֶל
  choice: futilidade
  rationale: Expressa a ideia metafórica de vazio, inconsistência e falta de valor, evitando o sentido moderno predominante de orgulho que “vaidade” pode ter.
- source_word: כִּי ... כִּי
  choice: Pois ... pois
  rationale: Mantém a repetição do conector hebraico e sua função explicativa, ainda que a repetição produza deliberadamente uma construção enfática.
- source_word: עֵץ מִיַּעַר
  choice: uma árvore da floresta
  rationale: Conserva a imagem concreta da árvore e sua procedência, com ordem natural em português.
- source_word: כְּרָתוֹ
  choice: é cortada
  rationale: O hebraico tem literalmente uma forma ativa com agente não identificado e sufixo de objeto; a passiva portuguesa mantém o foco na árvore e não introduz um sujeito específico.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: obra das mãos de um artesão
  rationale: Preserva tanto a cadeia nominal quanto a ênfase polêmica na fabricação humana.
- source_word: חָרָשׁ
  choice: artesão
  rationale: Termo amplo e atual para um trabalhador habilidoso, sem especificar além do que o hebraico permite.
- source_word: בַּמַּעֲצָד
  choice: com um machado
  rationale: “Machado” é uma designação clara e compreensível para a ferramenta de corte ou desbaste; a identificação mais específica como enxó permanece em nota devido à incerteza lexical.
theological_decisions:
- issue: Formulação da crítica à idolatria sem acrescentar terminologia teológica posterior
  choice: os costumes dos povos são futilidade
  alternative: os costumes dos povos são vaidade / as práticas das nações são inúteis
  rationale: A redação conserva a denúncia do vazio e da falta de valor desses costumes e destaca a fabricação humana do objeto, sem inserir conceitos doutrinários ausentes do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula separa as duas afirmações explicativas, e o travessão apresenta “obra das mãos de um artesão” como caracterização enfática da árvore cortada e trabalhada.
