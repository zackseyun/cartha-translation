  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲקֹ֗ב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/יִ֨שְׂרָאֵ֔ל שֵׁ֖בֶט נַֽחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/016.yaml
  text: Not like these is the Portion of Jacob[a], for he is the Former of all things, and Israel is the tribe of his inheritance[b]; Yahweh of hosts is his name.
translation:
  language: pt
  text: A Porção de Jacó não é como essas coisas[a], pois ele é quem formou tudo, e Israel é a tribo que ele possui como herança[b]; Yahweh dos Exércitos é o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a porção que cabe a Jacó”. A expressão hebraica pode ser entendida dessa forma; o sentido é que o Deus de Israel não é como os ídolos descritos anteriormente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Israel é a vara que ele possui como herança” ou “Israel é o cetro que ele possui como herança”. A palavra hebraica pode significar “tribo”, “vara” ou “cetro”; “tribo” se ajusta melhor à referência a Israel como o povo que pertence a Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק יַעֲקֹב
  choice: a Porção de Jacó
  rationale: חֵלֶק significa “porção” ou “parte”. Aqui designa o próprio Deus como a porção pertencente a Jacó, em contraste com os ídolos; a inicial maiúscula preserva discretamente o valor quase titular.
- source_word: כְאֵלֶּה
  choice: como essas coisas
  rationale: O demonstrativo remete aos ídolos descritos no contexto. “Essas coisas” conserva a referência implícita do hebraico sem inserir “ídolos” no texto.
- source_word: יוֹצֵר הַכֹּל
  choice: quem formou tudo
  rationale: O particípio יוֹצֵר ressalta o ato de formar ou modelar. A construção verbal é natural em português e mantém o contraste com objetos fabricados por seres humanos.
- source_word: שֵׁבֶט נַחֲלָתוֹ
  choice: a tribo da sua herança
  rationale: שֵׁבֶט pode significar “tribo”, “vara” ou “cetro”. Com Israel como referente, “tribo” exprime de modo mais coerente o povo que pertence a Deus, preservando-se a alternativa em nota.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino pessoal e verte צְבָאוֹת pela expressão portuguesa tradicional e compreensível “dos Exércitos”, sem restringir a referência apenas a forças celestiais ou terrenas.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Reproduz de forma direta e solene a cláusula nominal hebraica.
theological_decisions:
- issue: Referente de “Porção de Jacó”
  choice: A expressão designa Yahweh como a porção de Jacó/Israel.
  alternative: Entender apenas de maneira abstrata como “a parte que cabe a Jacó”.
  rationale: O contexto contrapõe o Deus vivo aos ídolos. A formulação preserva a imagem de relação pactual sem desenvolver essa interpretação no corpo do versículo.
- issue: Sentido de שֵׁבֶט aplicado a Israel
  choice: “tribo”, entendendo Israel como o povo da herança de Deus.
  alternative: “cetro” ou “vara” da sua herança.
  rationale: A polissemia é real, mas “tribo” apresenta a leitura contextual mais coerente; a tensão lexical permanece documentada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Porção” preserva a imagem do original; “quem formou tudo” evita o pouco natural substantivo “Formador”; “Yahweh dos Exércitos” conserva o nome divino e a fórmula solene.
