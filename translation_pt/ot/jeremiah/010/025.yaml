  source_fidelity: A tradução reproduz com fidelidade o imperativo de petição, a ira dirigida às nações e aos clãs, as duas expressões de falta de relação/invocação a Deus e a sequência intensiva de destruição contra Jacó. «Morada» é uma leitura contextual plenamente defensável de נָוֵהוּ, e a nota preserva adequadamente a alternativa «pastagem».
  naturalness: O português é moderno, claro e de registro orante apropriado. «Derrama a tua ira», «não invocam o teu nome» e «devoraram-no, consumiram-no» soam naturais e mantêm o vigor do paralelismo hebraico. A ênclise é aceitável no registro bíblico contemporâneo.
  terminology: «Nações», «clãs», «ira», «invocam» e «Jacó» são escolhas consistentes, claras e semanticamente adequadas. A nota lexical está ancorada no termo efetivamente esclarecido e não força uma decisão exegética entre habitação e pastagem.
