  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁפֹ֣ךְ חֲמָתְ/ךָ֗ עַל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ךָ וְ/עַל֙ מִשְׁפָּח֔וֹת אֲשֶׁ֥ר בְּ/שִׁמְ/ךָ֖ לֹ֣א קָרָ֑אוּ כִּֽי אָכְל֣וּ אֶֽת יַעֲקֹ֗ב וַ/אֲכָלֻ֨/הוּ֙ וַ/יְכַלֻּ֔/הוּ וְ/אֶת נָוֵ֖/הוּ הֵשַֽׁמּוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/025.yaml
  text: Pour out your wrath on the nations that do not know you[a], and on the clans that do not call on your name; for they have devoured Jacob, they have devoured him and consumed him, and they have laid waste his habitation.
translation:
  language: pt
  text: Derrama a tua ira sobre as nações que não te conhecem e sobre os clãs que não invocam o teu nome, pois devoraram Jacó; devoraram-no, consumiram-no e devastaram a sua morada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua pastagem”.
    reason: נָוֶה pode significar tanto morada ou lugar habitado quanto pastagem, especialmente dentro de imagens pastorais.
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Derrama
  rationale: O imperativo mantém a metáfora hebraica de verter com força a ira divina e soa natural na linguagem de oração.
- source_word: חֲמָתְךָ
  choice: a tua ira
  rationale: חֵמָה expressa ira intensa; “ira” preserva o peso judicial e teológico sem atenuação.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos estrangeiros hostis, sem exigir o sentido técnico posterior de “gentios”.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: que não te conhecem
  rationale: Preserva a formulação direta e a possível dimensão relacional de יָדַע, sem reduzi-la apenas a reconhecimento intelectual ou culto.
- source_word: מִשְׁפָּחוֹת
  choice: os clãs
  rationale: Designa grupos de parentesco; “clãs” mantém essa unidade social e o paralelismo com “nações”.
- source_word: בְּשִׁמְךָ לֹא קָרָאוּ
  choice: que não invocam o teu nome
  rationale: קרא בשם é uma expressão de invocação e culto; “invocar o nome” comunica esse sentido claramente em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da petição e preserva o tom elevado da oração.
- source_word: אָכְלוּ אֶת יַעֲקֹב וַאֲכָלֻהוּ
  choice: devoraram Jacó; devoraram-no
  rationale: A repetição do verbo intensifica a imagem de destruição e é mantida em vez de ser suavizada.
- source_word: וַיְכַלֻּהוּ
  choice: consumiram-no
  rationale: Acrescenta a ideia de levar ao fim ou destruir por completo, marcando a progressão do paralelismo.
- source_word: נָוֵהוּ
  choice: a sua morada
  rationale: נָוֶה pode indicar habitação ou pastagem. Neste contexto, “morada” expressa de modo natural o lugar habitado por Jacó, enquanto a alternativa concreta é registrada em nota.
- source_word: הֵשַׁמּוּ
  choice: devastaram
  rationale: Expressa de modo atual e vigoroso o sentido causativo de tornar desolado.
theological_decisions:
- issue: Petição imprecatória contra povos estrangeiros
  choice: Manter o pedido direto para que Deus derrame a sua ira
  alternative: Suavizar como simples anúncio de juízo ou traduzir “ira” como mero desagrado
  rationale: O hebraico apresenta uma oração explícita por juízo divino em resposta à destruição de Jacó; a tradução preserva essa tensão teológica sem mitigá-la.
- issue: Sentido de não conhecer Deus
  choice: Preservar “não te conhecem”
  alternative: Explicitar como “não te reconhecem” ou “não te adoram”
  rationale: A formulação hebraica pode abranger conhecimento relacional, reconhecimento e fidelidade; a tradução não resolve essa amplitude de forma indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a repetição enfática do hebraico e o tom vigoroso da oração. A colocação pronominal após o verbo conserva um registro bíblico elevado sem recorrer a vocabulário arcaico.
