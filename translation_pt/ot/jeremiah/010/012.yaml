id: JER.10.12
reference: Jeremiah 10:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/012.yaml
  text: He made the earth by his power[a]; he established the world by his wisdom[b], and by his understanding he stretched out the heavens.
translation:
  language: pt
  text: Ele fez a terra com o seu poder[a], estabeleceu o mundo com a sua sabedoria[b] e, com o seu entendimento, estendeu os céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele faz a terra com o seu poder”. O hebraico começa com um particípio, que também pode ter sentido presente ou habitual; aqui ele é traduzido como verbo no passado, em harmonia com os verbos seguintes.'
    reason: lexical_alternative
  - marker: b
    text: “Mundo” traduz o hebraico tevel, que muitas vezes se refere ao mundo habitado ou ordenado.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: fez
  rationale: Embora a forma hebraica seja um particípio, o contexto poético, seguido de verbos finitos, permite expressá-la naturalmente em português como passado, mantendo a referência à ação criadora.
- source_word: אֶרֶץ
  choice: terra
  rationale: O contexto cósmico, em paralelo com o mundo e os céus, favorece 'terra', não 'país' ou 'território'.
- source_word: בְּכֹחוֹ
  choice: com o seu poder
  rationale: A preposição hebraica tem valor instrumental; 'com o seu poder' é natural em português e preserva a ideia do poder divino como meio da criação.
- source_word: מֵכִין
  choice: estabeleceu
  rationale: O Hifil de כון comunica firmar ou estabelecer; 'estabeleceu' combina precisão semântica com linguagem clara e digna.
- source_word: תֵּבֵל
  choice: mundo
  rationale: תבל costuma designar o mundo ordenado ou habitado; 'mundo' é conciso, natural e adequado ao paralelismo cósmico.
- source_word: בְּחָכְמָתוֹ
  choice: com a sua sabedoria
  rationale: Mantém o valor instrumental da preposição e a linguagem sapiencial do texto.
- source_word: וּבִתְבוּנָתוֹ
  choice: e, com o seu entendimento
  rationale: '''Entendimento'' preserva a distinção lexical em relação a ''sabedoria'' sem tornar a frase artificial.'
- source_word: נָטָה
  choice: estendeu
  rationale: Em contextos de criação, o verbo retrata os céus sendo estendidos; esta formulação conserva a imagem espacial e soa natural em português.
- source_word: שָׁמָיִם
  choice: os céus
  rationale: O plural português corresponde à forma hebraica e mantém o alcance cósmico, mais amplo que 'céu' atmosférico.
theological_decisions:
- issue: O sujeito divino está implícito, sem nome ou título expresso neste versículo.
  choice: Usar o pronome 'Ele' para dar continuidade ao referente contextual.
  alternative: Empregar 'Deus' ou 'o SENHOR'.
  rationale: O hebraico não repete aqui um nome ou título divino. O pronome preserva o fluxo do contexto sem acrescentar uma designação ausente da cláusula.
- issue: Valor temporal do particípio עֹשֵׂה.
  choice: 'Traduzir como ação passada: ''fez''.'
  alternative: 'Traduzir com força habitual ou presente: ''faz'', ou de modo nominal: ''aquele que faz''.'
  rationale: A forma participial admite mais de uma nuance. Neste contexto de atos criadores e em paralelo com verbos finitos, o passado produz uma leitura portuguesa natural, enquanto a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem poética e o paralelismo foram preservados sem rigidez excessiva; as vírgulas destacam o terceiro membro sem fragmentar o verso.
