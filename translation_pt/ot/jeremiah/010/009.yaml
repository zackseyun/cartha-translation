id: JER.10.9
reference: Jeremiah 10:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֶּ֣סֶף מְרֻקָּ֞ע מִ/תַּרְשִׁ֣ישׁ יוּבָ֗א וְ/זָהָב֙ מֵֽ/אוּפָ֔ז מַעֲשֵׂ֥ה חָרָ֖שׁ וִ/ידֵ֣י צוֹרֵ֑ף תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ לְבוּשָׁ֔/ם מַעֲשֵׂ֥ה חֲכָמִ֖ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/009.yaml
  text: Beaten silver is brought from Tarshish[a], and gold from Uphaz, the work of a craftsman and of the hands of a goldsmith. Blue and purple are their clothing; all of them are the work of skilled men.
translation:
  language: pt
  text: Prata batida é trazida de Társis, e ouro de Ufaz[a]; são obra de um artesão e das mãos de um ourives. Azul e púrpura são as suas vestes; todos eles são obra de homens habilidosos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Ufaz”; alguns entendem esse nome como uma variante de “Ofir”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּסֶף מְרֻקָּע
  choice: prata batida
  rationale: כֶּסֶף designa a prata como material, e o particípio passivo מְרֻקָּע indica metal martelado ou batido até formar lâminas. “Prata batida” é conciso e preserva a imagem artesanal.
- source_word: מִתַּרְשִׁישׁ יוּבָא
  choice: é trazida de Társis
  rationale: O hofal יוּבָא expressa ação passiva, “é trazida”. Társis é mantido como nome geográfico transliterado.
- source_word: וְזָהָב מֵאוּפָז
  choice: e ouro de Ufaz
  rationale: O Texto Massorético lê אוּפָז, aqui transliterado como “Ufaz”. A possível relação com Ofir é registrada em nota, sem substituir a leitura textual.
- source_word: מַעֲשֵׂה חָרָשׁ וִידֵי צוֹרֵף
  choice: são obra de artesão e das mãos de ourives
  rationale: A formulação conserva tanto מַעֲשֵׂה, “obra”, quanto o idioma וִידֵי, “das mãos de”. חָרָשׁ é um artesão, e צוֹרֵף, neste contexto de metais preciosos, é adequadamente traduzido por “ourives”.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: azul e púrpura
  rationale: Os termos indicam cores ou tecidos tingidos caros. “Azul e púrpura” é uma formulação tradicional, clara e acessível em português.
- source_word: לְבוּשָׁם
  choice: são as suas vestes
  rationale: O substantivo singular pode ter sentido coletivo e se refere à indumentária dos ídolos. “Vestes” soa natural e digno em português, com referente plural.
- source_word: מַעֲשֵׂה חֲכָמִים כֻּלָּם
  choice: todos eles são obra de homens habilidosos
  rationale: Neste contexto artesanal, חֲכָמִים significa pessoas dotadas de perícia, não sábios no sentido moral ou filosófico. “Homens habilidosos” preserva a forma masculina plural do hebraico.
theological_decisions:
- issue: Forma masculina de חֲכָמִים
  choice: homens habilidosos
  alternative: artesãos habilidosos; trabalhadores habilidosos
  rationale: A tradução conserva o masculino plural expresso no hebraico e, ao mesmo tempo, deixa claro pelo adjetivo e pelo contexto que se trata de perícia artesanal, não de sabedoria religiosa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe mantém o paralelismo e a ênfase do hebraico na fabricação humana dos ídolos.
