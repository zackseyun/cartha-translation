reference: Jeremiah 10:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֣י לֹ֤א יִֽרָאֲ/ךָ֙ מֶ֣לֶךְ הַ/גּוֹיִ֔ם כִּ֥י לְ/ךָ֖ יָאָ֑תָה כִּ֣י בְ/כָל חַכְמֵ֧י הַ/גּוֹיִ֛ם וּ/בְ/כָל מַלְכוּתָ֖/ם מֵ/אֵ֥ין כָּמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/007.yaml
  text: Who would not fear you[a], O King of the nations? For this is your due; for among all the wise men of the nations and in all their kingdoms[b], there is none like you.
translation:
  language: pt
  text: Quem não te temeria,[a] ó Rei das nações? Pois isso te é devido, porque, entre todos os sábios das nações e em todos os seus reinos, não há ninguém semelhante a ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem não deveria te temer?” A pergunta retórica hebraica pode indicar tanto o que aconteceria quanto o que é apropriado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרָאֲךָ
  choice: te temeria
  rationale: A construção retórica מִי לֹא com o imperfeito pode indicar tanto o que aconteceria quanto o que seria apropriado. “Quem não te temeria?” é natural em português e conserva a força de “temer”, incluindo seu possível sentido de reverência diante de Deus.
- source_word: מֶלֶךְ הַגּוֹיִם
  choice: Rei das nações
  rationale: Reproduz diretamente o título real no construto hebraico e preserva a afirmação do reinado universal de Deus.
- source_word: יָאָתָה
  choice: isso te é devido
  rationale: O verbo expressa aquilo que convém, cabe ou é devido. O pronome “isso” retoma naturalmente o temor mencionado na pergunta anterior e torna explícita a ligação contextual sem acrescentar uma ideia estranha ao hebraico.
- source_word: חַכְמֵי הַגּוֹיִם
  choice: os sábios das nações
  rationale: “Sábios” designa com clareza pessoas reconhecidas por sabedoria, conselheiros ou eruditos, sem exigir a marcação de gênero que seria menos natural no português contemporâneo.
- source_word: מַלְכוּתָם
  choice: seus reinos
  rationale: No contexto plural possessivo, “seus reinos” comunica de modo claro o sentido usual de domínio ou reino.
- source_word: מֵאֵין כָּמוֹךָ
  choice: não há ninguém semelhante a ti
  rationale: Expressa idiomaticamente a incomparabilidade absoluta afirmada pela locução hebraica, em registro digno e corrente.
- source_word: כִּי ... כִּי
  choice: Pois ... porque ...
  rationale: As duas partículas introduzem a justificação da pergunta retórica e, em seguida, sua fundamentação na incomparabilidade divina. A variação evita repetição rígida sem apagar a estrutura argumentativa.
theological_decisions:
- issue: Reinado divino sobre as nações
  choice: Rei das nações
  alternative: rei sobre as nações
  rationale: A forma escolhida segue de perto a construção hebraica e conserva sem expansão a afirmação de que Deus é rei em relação a todas as nações.
- issue: Sentido de temer a Deus
  choice: te temeria
  alternative: te reverenciaria
  rationale: “Temer” preserva a categoria bíblica mais forte e sua tensão entre medo, assombro e reverência, em vez de reduzi-la antecipadamente a simples respeito.
- issue: Propriedade do temor devido a Deus
  choice: isso te é devido
  alternative: isso te convém
  rationale: A escolha apresenta o temor como resposta que pertence legitimamente a Deus no contexto, sem definir além do texto a natureza exata dessa obrigação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a pergunta retórica, o vocativo solene e a linguagem bíblica forte de temor, evitando arcaísmos como “quem não te temerá” e explicitações doutrinárias.
