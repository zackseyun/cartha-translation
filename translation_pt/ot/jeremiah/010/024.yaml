source:
  edition: WLC
  text: יַסְּרֵ֥/נִי יְהוָ֖ה אַךְ בְּ/מִשְׁפָּ֑ט אַל בְּ/אַפְּ/ךָ֖ פֶּן תַּמְעִטֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/024.yaml
  text: Discipline me[a], Yahweh, but with justice, not in your anger[c][b], lest you diminish me.
translation:
  language: pt
  text: Disciplina-me[a], Yahweh, mas com justiça[b], não na tua ira, para que não me diminuas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Corrige-me” ou “Castiga-me para me corrigir”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com juízo” ou “segundo a justa medida”. O termo hebraico pode indicar juízo, justiça ou medida apropriada.
    reason: lexical_alternative
  - marker: c
    text: Ou “para que não me reduzas a nada” ou, mais literalmente, “para que não me tornes pequeno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְּרֵנִי
  choice: Disciplina-me
  rationale: O piel de יסר expressa ação corretiva ou disciplinadora. “Disciplina-me” conserva tanto a correção quanto o possível sofrimento envolvido, em linguagem atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַךְ
  choice: mas
  rationale: 'Aqui a partícula restringe e qualifica o pedido: o falante aceita a disciplina, mas determina em que termos a pede.'
- source_word: בְּמִשְׁפָּט
  choice: com justiça
  rationale: מִשְׁפָּט pode indicar juízo, justiça ou medida apropriada. No contraste com a ira, “com justiça” comunica um tratamento reto e comedido sem eliminar a seriedade da disciplina.
- source_word: בְּאַפְּךָ
  choice: na tua ira
  rationale: אַף designa aqui ira ou furor. “Ira” mantém a intensidade e o registro digno, sendo amplamente compreensível.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz o resultado temido. A formulação é natural em português e preserva a finalidade preventiva da súplica.
- source_word: תַּמְעִיטֵנִי
  choice: me diminuas
  rationale: O hifil de מעט significa fazer pequeno, reduzir ou diminuir. A tradução preserva a imagem hebraica sem explicitar indevidamente se o resultado seria humilhação, debilitação ou destruição.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa diretamente, enquanto “SENHOR” o substituiria por um título.
- issue: Sentido de מִשְׁפָּט na súplica por disciplina
  choice: com justiça
  alternative: com juízo / segundo a justa medida
  rationale: A frase pede correção reta e comedida em contraste com a ira, sem transformar a disciplina em mera brandura nem em condenação punitiva.
- issue: Alcance de תַּמְעִיטֵנִי
  choice: para que não me diminuas
  alternative: para que não me reduzas a nada
  rationale: A forma verbal indica tornar menor ou reduzir. A opção principal conserva a ambiguidade quanto ao grau e ao resultado, enquanto a alternativa expressa uma leitura contextual mais extrema.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção concisa. O pronome possessivo “tua” acompanha a interpelação direta a Yahweh. A formulação final mantém a imagem hebraica e deixa a possível intensidade destrutiva para a nota.
