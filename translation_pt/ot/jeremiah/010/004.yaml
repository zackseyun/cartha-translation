base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/004.yaml
  text: They decorate it with silver and with gold[b][a]; they fasten it with nails and with hammers so that it will not totter.
translation:
  language: pt
  text: Eles o enfeitam com prata e ouro; com pregos e martelos, firmam-no, para que não cambaleie.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que não se mova” ou “para que não oscile”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “eles os firmam”; o referente do plural é incerto.
    reason: textual_grammar
lexical_decisions:
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: com prata e ouro
  rationale: 'A preposição בְּ tem valor instrumental ou material: o objeto é enfeitado com esses metais. A formulação preserva o paralelismo de modo natural em português.'
- source_word: יְיַפֵּהוּ
  choice: eles o enfeitam
  rationale: O piel de יפה significa tornar belo, adornar. “Enfeitam” é atual, claro e mantém como objeto singular a imagem mencionada no contexto.
- source_word: בְּמַסְמְרוֹת וּבְמַקָּבוֹת
  choice: com pregos e martelos
  rationale: Os substantivos designam pregos ou cravos e martelos ou malhos. As escolhas adotadas são claras e adequadas ao trabalho de fixação descrito.
- source_word: יְחַזְּקוּם
  choice: prendem-no
  rationale: O piel de חזק comunica tornar firme ou fixar. Embora o texto consonantal apresente sufixo plural, o referente contextual é a imagem singular; a tradução segue esse referente sem obscurecer a ação de fixá-la.
- source_word: וְלֹא יָפִיק
  choice: para que não cambaleie
  rationale: A coordenação hebraica expressa aqui finalidade ou resultado. יפיק comunica instabilidade ou oscilação; “cambaleie” preserva a força satírica da imagem que precisa ser firmada.
theological_decisions:
- issue: Força satírica da descrição do ídolo
  choice: Manter a imagem de um objeto fabricado, ornamentado e fisicamente preso para não cambalear.
  alternative: Apresentar apenas uma descrição neutra da fabricação de uma imagem cultual.
  rationale: Jeremias 10:3–5 contrapõe a pretensão religiosa da imagem à sua dependência de artesãos. A tradução conserva essa ironia sem acrescentar uma conclusão doutrinária ao texto.
- issue: Número do objeto em יְחַזְּקוּם
  choice: Usar o singular “prendem-no”, conforme o objeto singular de יְיַפֵּהוּ e o referente contextual.
  alternative: Representar formalmente o sufixo plural como “prendem-nos”, entendendo-o como referência aos elementos de fixação ou como oscilação textual/idiomática.
  rationale: O singular produz coerência referencial em português e corresponde à imagem individual do contexto, enquanto a peculiaridade morfológica é reconhecida na análise lexical, sem criar no texto principal um referente plural obscuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Enfeitam” evita formalismo excessivo; “prendem-no” mantém clareza referencial, e “cambaleie” conserva a ironia concreta do hebraico.
