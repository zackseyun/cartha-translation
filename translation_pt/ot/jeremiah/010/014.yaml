  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צוֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/014.yaml
  text: Every man is stupid[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is a lie[c][b], and there is no breath in them.
translation:
  language: pt
  text: Todo ser humano é insensato, sem conhecimento[a]; todo artesão de metais fica envergonhado por seu ídolo, pois sua imagem fundida é uma mentira[b], e não há sopro[c] neles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todo ser humano está embrutecido por falta de conhecimento”. A preposição hebraica também pode indicar causa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua imagem fundida é falsidade”.'
    reason: lexical_alternative
  - marker: c
    text: “Sopro” também pode ser traduzido como “espírito”; o sentido no contexto é que os ídolos não têm vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: é insensato
  rationale: O nifal de בער expressa embrutecimento ou falta de discernimento. “É insensato” conserva a força da censura em português atual sem recorrer ao menos comum “embrutecido”.
- source_word: כָּל אָדָם
  choice: Todo ser humano
  rationale: אָדָם é genérico neste contexto, e a formulação distributiva “todo ser humano” comunica naturalmente a abrangência de כָּל sem restringir o referente ao sexo masculino.
- source_word: מִדַּעַת
  choice: sem conhecimento
  rationale: A preposição מִן pode ter sentido privativo ou causal diante do substantivo abstrato. “Sem conhecimento” é conciso e preserva a relação com a insensatez sem excluir a leitura causal.
- source_word: הֹבִישׁ
  choice: fica envergonhado
  rationale: O hifil de בוש indica ser levado à vergonha ou ficar desmoralizado. Esta construção é natural em português e mantém o artesão como aquele cuja obra o expõe à vergonha.
- source_word: צוֹרֵף
  choice: artesão de metais
  rationale: O particípio designa quem refina, funde ou trabalha metais. A expressão ampla se ajusta à fabricação de uma imagem fundida sem limitar o ofício a ourives ou refinador.
- source_word: מִפָּסֶל
  choice: por causa do ídolo
  rationale: פֶּסֶל é uma imagem cultual, frequentemente esculpida. “Ídolo” explicita sua função no contexto, e “por causa de” representa o valor causal provável de מִן.
- source_word: שֶׁקֶר
  choice: uma mentira
  rationale: O substantivo significa falsidade ou engano. “Uma mentira” mantém a linguagem concreta e contundente da polêmica profética.
- source_word: נִסְכּוֹ
  choice: a imagem de metal que ele fundiu
  rationale: A forma se refere à imagem produzida por derramamento ou fundição e inclui o sufixo possessivo. A formulação torna claro tanto o processo quanto a relação com o artesão.
- source_word: וְלֹא רוּחַ בָּם
  choice: e não há sopro neles
  rationale: רוּחַ pode significar sopro, espírito ou vento. Aqui “sopro” comunica diretamente que os ídolos não têm vida; “neles” preserva o plural hebraico, que retoma coletivamente as imagens.
theological_decisions:
- issue: Alcance da acusação contra a humanidade e os ídolos
  choice: Manter a afirmação abrangente sobre a insensatez humana dentro da polêmica imediata contra a idolatria.
  alternative: Ler a primeira oração como uma declaração doutrinária abstrata sobre toda a humanidade em todos os aspectos.
  rationale: O texto diz “todo ser humano”, mas a sequência concentra a acusação nos fabricantes e nas imagens sem vida. A tradução preserva tanto a amplitude retórica quanto o contexto, sem ampliar nem restringir indevidamente a afirmação.
- issue: Sentido de רוּחַ nas imagens
  choice: Traduzir como “sopro”, destacando que os ídolos não têm vida.
  alternative: Traduzir como “espírito”, o que poderia sugerir uma afirmação mais específica sobre realidade espiritual.
  rationale: A ambiguidade lexical é registrada em nota. No contexto da imagem fabricada, a ausência de sopro exprime de modo mais imediato sua falta de vida, sem acrescentar uma tese metafísica além do verso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A redação mantém o paralelismo profético, a contundência da denúncia e a mudança do singular para o plural no fim do versículo.
