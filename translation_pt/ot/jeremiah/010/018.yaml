  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י קוֹלֵ֛עַ אֶת יוֹשְׁבֵ֥י הָ/אָ֖רֶץ בַּ/פַּ֣עַם הַ/זֹּ֑את וַ/הֲצֵר֥וֹתִי לָ/הֶ֖ם לְמַ֥עַן יִמְצָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/018.yaml
  text: 'For thus says Yahweh: Behold[a], I am slinging out the inhabitants of the land at this time[c][b], and I will press them hard so that they may be found.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Eis que vou arremessar[a], nesta ocasião, os habitantes da terra[b] e os porei em aperto, para que encontrem[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lançar” ou “expulsar”; o verbo hebraico evoca a ação de arremessar com uma funda.
    reason: lexical_alternative
  - marker: b
    text: Ou “os habitantes do mundo”, caso a expressão seja entendida em sentido mais amplo.
    reason: alternative_reading
  - marker: c
    text: A cláusula final é difícil. O hebraico diz literalmente “para que encontrem”, sem indicar o que; também pode ser entendida como “para que o sintam” ou “para que se vejam apanhados”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando sua referência pactual e distinguindo-o do título “Senhor”.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Mantém a ênfase e a iminência próprias da fórmula profética, em registro digno e reconhecível.
- source_word: קוֹלֵעַ
  choice: lançarei com uma funda
  rationale: Preserva a imagem concreta e vigorosa do verbo hebraico, que evoca arremessar com uma funda, em vez de reduzi-lo a uma expulsão genérica.
- source_word: יוֹשְׁבֵי הָאָרֶץ
  choice: os habitantes da terra
  rationale: No contexto, אֶרֶץ se refere primariamente à terra de Judá; “terra” mantém essa leitura contextual sem impedir a amplitude lexical do termo.
- source_word: בַּפַּעַם הַזֹּאת
  choice: desta vez
  rationale: Expressa de modo natural o caráter temporal desta ocasião específica de juízo.
- source_word: וַהֲצֵרוֹתִי
  choice: os porei em aperto
  rationale: Comunica a ideia causativa de pressão, estreiteza e aflição sem especificar indevidamente um cerco militar.
- source_word: לְמַעַן יִמְצָאוּ
  choice: para que sejam encontrados
  rationale: Conserva a forma tersa e difícil da cláusula, sem acrescentar um objeto inexistente no hebraico nem resolver silenciosamente sua ambiguidade.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: mundo
  rationale: O contexto imediato aponta para os habitantes de Judá; “terra” evita impor ao texto um juízo explicitamente universal, embora a nota registre a possibilidade lexical mais ampla.
- issue: Sentido de לְמַעַן יִמְצָאוּ
  choice: para que sejam encontrados
  alternative: para que o sintam / para que sejam apanhados
  rationale: A cláusula hebraica é difícil e não apresenta objeto explícito. A tradução principal mantém sua ambiguidade formal, enquanto a nota apresenta interpretações possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora da funda foi explicitada para preservar a vivacidade do hebraico; a difícil cláusula final foi mantida deliberadamente ambígua e acompanhada de nota.
