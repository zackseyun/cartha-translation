id: JER.10.21
reference: Jeremiah 10:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י נִבְעֲרוּ֙ הָֽ/רֹעִ֔ים וְ/אֶת יְהוָ֖ה לֹ֣א דָרָ֑שׁוּ עַל כֵּן֙ לֹ֣א הִשְׂכִּ֔ילוּ וְ/כָל מַרְעִיתָ֖/ם נָפֽוֹצָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
translation:
  language: pt
  text: Pois os pastores[b] se tornaram insensatos[a] e não buscaram Yahweh; por isso, não agiram com sabedoria[c], e todo o rebanho deles se dispersou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “embrutecidos” ou “sem entendimento”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, os “pastores” provavelmente representam os líderes do povo.
    reason: cultural_note
  - marker: c
    text: Ou “não foram bem-sucedidos”. O verbo hebraico pode indicar tanto agir com sabedoria quanto alcançar êxito como resultado disso.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעֲרוּ
  choice: se tornaram insensatos
  rationale: O nifal de בער descreve um estado de embrutecimento ou falta de discernimento. “Insensatos” preserva a forte repreensão profética em português natural e digno.
- source_word: הָרֹעִים
  choice: os pastores
  rationale: Mantém a metáfora literal do hebraico, que neste contexto aponta para os responsáveis pela condução do povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: דָרָשׁוּ
  choice: buscaram
  rationale: Abrange tanto o ato de voltar-se para Yahweh quanto o de consultá-lo e procurar sua orientação.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: Expressa com clareza a relação de consequência indicada pela locução hebraica.
- source_word: הִשְׂכִּילוּ
  choice: agiram com sabedoria
  rationale: O hifil de שכל pode indicar agir com discernimento e, por consequência, ser bem-sucedido. A formulação preserva aqui o sentido sapiencial imediato sem excluir a dimensão de êxito.
- source_word: מַרְעִיתָם
  choice: o rebanho deles
  rationale: Embora o substantivo também possa designar pastagem, a associação com “pastores” favorece o sentido coletivo daquilo que está sob seus cuidados.
- source_word: נָפוֹצָה
  choice: se dispersou
  rationale: Reproduz o estado resultante expresso pelo verbo e concorda naturalmente com o substantivo coletivo singular “rebanho”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Identidade dos “pastores”
  choice: manter a metáfora no texto
  alternative: traduzir diretamente como “líderes”
  rationale: Em Jeremias, os pastores frequentemente representam os dirigentes do povo, mas conservar a imagem evita eliminar a força metafórica e deixa a explicação para a nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora pastoral e a ambiguidade entre sabedoria e êxito foram preservadas; a ordem dos marcadores foi ajustada para que cada nota apareça junto à expressão correspondente.
