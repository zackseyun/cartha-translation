id: JER.10.1
reference: Jeremiah 10:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֣וּ אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/001.yaml
  text: Hear the word that Yahweh has spoken concerning you[a], O house of Israel.
translation:
  language: pt
  text: Ouçam a palavra que Yahweh[a] falou a respeito de vocês, ó casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz YHWH, o nome divino, tradicionalmente traduzido como “SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural preserva tanto a convocação profética quanto a exigência de receber a mensagem com atenção, concordando naturalmente com os destinatários plurais.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: Mantém o uso profético consagrado de דָּבָר e permite ao contexto explicitar o conteúdo da mensagem.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ... falou
  rationale: A oração relativa é natural em português, e o pretérito perfeito traduz adequadamente a forma verbal hebraica sem acrescentar uma nuance temporal desnecessária.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: עֲלֵיכֶם
  choice: a respeito de vocês
  rationale: A preposição עַל neste contexto pode indicar aquilo de que se fala. Esta tradução conserva essa leitura sem antecipar o sentido adversativo possível de 'contra vocês'.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Preserva a fórmula profética de vocativo e a imagem corporativa e pactual de Israel como uma casa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome divino, enquanto 'SENHOR' o substitui por um título e 'Jeová' reflete uma forma híbrida posterior.
- issue: Sentido de עֲלֵיכֶם
  choice: a respeito de vocês
  alternative: contra vocês; dirigida a vocês
  rationale: A construção admite mais de uma relação semântica. O contexto introdutório favorece 'a respeito de vocês', evitando transformar antecipadamente a convocação em condenação, embora o sentido adversativo continue possível.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. O plural 'vocês' explicita naturalmente o número dos destinatários; 'ó casa de Israel' conserva o tom profético tradicional sem soar arcaico em excesso.
