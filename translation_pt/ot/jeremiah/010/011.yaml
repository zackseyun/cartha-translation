source:
  edition: WLC
  text: כִּ/דְנָה֙ תֵּאמְר֣וּן לְ/ה֔וֹם אֱלָ֣הַיָּ֔/א דִּֽי שְׁמַיָּ֥/א וְ/אַרְקָ֖/א לָ֣א עֲבַ֑דוּ יֵאבַ֧דוּ מֵֽ/אַרְעָ֛/א וּ/מִן תְּח֥וֹת שְׁמַיָּ֖/א אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/011.yaml
  text: 'Thus you shall say to them: “The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.”[a][b]'
translation:
  language: pt
  text: 'Assim vocês dirão a eles: “Os deuses que não fizeram os céus e a terra desaparecerão da terra e de debaixo destes céus.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perecerão” ou “serão destruídos”. O verbo aramaico pode indicar perecimento, destruição ou desaparecimento.
    reason: lexical_alternative
  - marker: b
    text: “Os deuses” pode se referir a ídolos, a supostas divindades ou a ambos; o texto mantém amplo o alvo da polêmica.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּדְנָה
  choice: Assim
  rationale: Introduz de modo natural, em português, a fórmula exata a ser pronunciada e preserva a força deíctica do advérbio aramaico.
- source_word: תֵּאמְרוּן לְהוֹם
  choice: vocês dirão a eles
  rationale: Reproduz o imperfeito aramaico de segunda pessoa do plural como instrução profética, em português moderno e amplamente compreensível.
- source_word: אֱלָהַיָּא
  choice: os deuses
  rationale: Mantém o substantivo plural determinado e deixa aberta a referência polêmica a ídolos, supostas divindades ou ambos.
- source_word: שְׁמַיָּא וְאַרְקָא
  choice: os céus e a terra
  rationale: Preserva a linguagem bíblica da criação e o merismo que abrange o universo criado.
- source_word: לָא עֲבַדוּ
  choice: não fizeram
  rationale: Tradução direta do perfeito negado, destacando que esses deuses não produziram o cosmos.
- source_word: יֵאבַדוּ
  choice: desaparecerão
  rationale: Comunica o sentido de perecer ou deixar de existir no contexto, sem impor uma causa externa explícita; as alternativas são registradas em nota.
- source_word: מֵאַרְעָא
  choice: da terra
  rationale: O contexto cósmico anterior favorece 'terra', não 'país' ou 'território'.
- source_word: וּמִן תְּחוֹת שְׁמַיָּא אֵלֶּה
  choice: e de debaixo destes céus
  rationale: Mantém a preposição espacial, o plural 'céus' e o demonstrativo אֵלֶּה, apesar da leve estranheza deliberada da formulação.
theological_decisions:
- issue: Alcance da condenação dos deuses
  choice: Conservar 'os deuses' como referente amplo.
  alternative: Interpretar explicitamente o termo apenas como 'ídolos' ou apenas como seres espirituais.
  rationale: O aramaico contrasta esses deuses com o Criador por não terem feito os céus e a terra, mas não determina se a referência é estritamente a imagens, a supostas divindades ou a ambos.
- issue: Natureza do destino anunciado
  choice: Traduzir יֵאבַדוּ por 'desaparecerão'.
  alternative: '''Perecerão'' ou ''serão destruídos''.'
  rationale: A opção conserva a ideia de extinção sem resolver se o verbo descreve perecimento intrínseco ou destruição sofrida.
translation_notes:
  register: Português moderno, digno e de leitura natural, com 'vocês' para a segunda pessoa do plural. A expressão 'destes céus' preserva o demonstrativo do aramaico e a formulação cósmica concreta. Os marcadores [a] e [b] aparecem no texto principal.
