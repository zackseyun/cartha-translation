  text: Gather up your bundle from the land[a], you who dwell under siege.
translation:
  language: pt
  text: Recolha seus pertences da terra[a], ó moradora sob cerco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Recolha da terra a sua trouxa, ó habitante sob cerco”. O termo hebraico pode indicar pertences, mercadorias, bagagem ou um volume de bens; “terra” também pode ser entendido como “país” ou “chão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפִּי
  choice: Recolha
  rationale: Imperativo feminino singular de אסף. “Recolha” expressa de modo natural a ação de juntar os bens, preservando a forma de ordem dirigida a uma destinatária feminina.
- source_word: מֵאֶרֶץ
  choice: do chão
  rationale: 'אֶרֶץ pode significar terra, país ou chão. Neste contexto, “do chão” forma uma imagem concreta e natural: a moradora deve apanhar os pertences antes do cerco culminar em deslocamento.'
- source_word: כִּנְעָתֵךְ
  choice: os seus pertences
  rationale: O termo raro designa bens, mercadorias ou bagagem. “Pertences” comunica com clareza os bens pessoais que devem ser reunidos, sem definir indevidamente como foram embalados.
- source_word: ישבתי
  choice: você que vive
  rationale: A forma consonantal é difícil, mas o sentido contextual é o de uma moradora, em vocativo feminino. “Você que vive” é corrente e compreensível em português, e a concordância de “sitiada” conserva a referência feminina.
- source_word: בַּמָּצוֹר
  choice: sitiada
  rationale: מָצוֹר descreve cerco ou condição de estar cercado. “Vive sitiada” transmite de maneira idiomática a pressão militar sofrida pela destinatária.
