id: JER.10.19
reference: Jeremiah 10:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: א֥וֹי לִ/י֙ עַל שִׁבְרִ֔/י נַחְלָ֖ה מַכָּתִ֑/י וַ/אֲנִ֣י אָמַ֔רְתִּי אַ֛ךְ זֶ֥ה חֳלִ֖י וְ/אֶשָּׂאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/019.yaml
  text: Woe is me because of my brokenness[a]; my wound is grievous. But I said, “Surely this is my sickness[c][b], and I must bear it.”
translation:
  language: pt
  text: 'Ai de mim por causa da minha ruína![a] Minha ferida é grave.[b] Mas eu disse: “De fato, esta é a minha enfermidade, e terei de suportá-la”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da minha fratura”, “por causa do meu dano” ou “por causa da minha desgraça”. O termo hebraico pode indicar quebra, fratura, dano ou ruína.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “Minha ferida está enferma” ou “Minha ferida é severa”. O hebraico transmite a ideia de fraqueza, enfermidade ou gravidade, sem necessariamente afirmar que a ferida é incurável.'
    reason: lexical_alternative
  - marker: c
    text: Ou “e eu a suportarei”. A frase final pode expressar tanto resignação ou necessidade (“terei de suportá-la”) quanto decisão ou futuro simples (“eu a suportarei”).
    reason: lexical_alternative
lexical_decisions:
- source_word: א֥וֹי לִי
  choice: Ai de mim
  rationale: Expressão natural e digna de lamento em português, preservando a força da interjeição hebraica.
- source_word: עַל שִׁבְרִי
  choice: por causa da minha ruína
  rationale: שֶׁבֶר pode indicar fratura, quebra, dano ou ruína. “Ruína” preserva a amplitude da imagem e se ajusta à devastação do contexto; עַל é entendido causalmente.
- source_word: נַחְלָה מַכָּתִי
  choice: Minha ferida é grave
  rationale: O nifal de חלה caracteriza a ferida como enferma, debilitante ou grave. “É grave” comunica a severidade sem impor a ideia mais específica de incurabilidade.
- source_word: אַךְ
  choice: De fato
  rationale: Neste contexto, introduz a aceitação enfática da situação pelo falante, sem resolver além do necessário a nuance entre restrição e asseveração.
- source_word: חֳלִי
  choice: minha enfermidade
  rationale: Mantém a metáfora médica e traduz de modo corrente o substantivo que denota doença ou sofrimento.
- source_word: וְאֶשָּׂאֶנּוּ
  choice: e terei de suportá-la
  rationale: נשא significa levar ou suportar. A formulação expressa a resignação ou necessidade sugerida pelo contexto, enquanto a nota preserva a possibilidade de futuro simples ou resolução.
theological_decisions:
- issue: Identidade da voz que lamenta
  choice: Não identificar explicitamente o falante no versículo
  alternative: Explicitar que fala Jeremias, Jerusalém ou o povo
  rationale: A forma hebraica está na primeira pessoa, mas este versículo isolado não resolve de maneira inequívoca a identidade retórica do falante. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A tradução mantém a imagem médica e o paralelismo do lamento, evitando o termo mais interpretativo “incurável”. Os marcadores de nota aparecem no texto imediatamente após as expressões pertinentes.
