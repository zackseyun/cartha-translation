  text: אָהֳלִ֣/י שֻׁדָּ֔ד וְ/כָל מֵיתָרַ֖/י נִתָּ֑קוּ בָּנַ֤/י יְצָאֻ֨/נִי֙ וְ/אֵינָ֔/ם אֵין נֹטֶ֥ה עוֹד֙ אָהֳלִ֔/י וּ/מֵקִ֖ים יְרִיעוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/020.yaml
  text: My tent is destroyed[a], and all my ropes are torn away. My sons have gone from me, and they are no more[d][c][b]. There is no one left to stretch out my tent again and set up my curtains.
translation:
  language: pt
  text: Minha tenda foi devastada[a], e todas as minhas cordas foram rompidas. Meus filhos partiram de mim e já não estão mais[b]. Não há ninguém para tornar a armar minha tenda e erguer minhas cortinas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi saqueada” ou “foi destruída”. O verbo hebraico pode indicar tanto pilhagem como devastação violenta.
    reason: lexical_alternative
  - marker: b
    text: “Meus filhos” pode referir-se literalmente aos filhos ou, de modo figurado, ao povo ou aos habitantes que partiram. “Já não estão mais” expressa ausência e não determina se morreram ou foram levados para longe.
    reason: cultural_note
lexical_decisions:
- source_word: אָהֳלִי
  choice: minha tenda
  rationale: Preserva a imagem concreta de uma habitação feita de tenda, retomada pelas cordas e lonas.
- source_word: שֻׁדָּד
  choice: foi devastada
  rationale: O passivo descreve ruína violenta e pode também envolver saque; “devastada” comunica o estado resultante sem limitar o sentido apenas à pilhagem.
- source_word: מֵיתָרַי
  choice: minhas cordas
  rationale: Designa as cordas que sustentam uma tenda; a expressão é clara e corrente em português.
- source_word: נִתָּקוּ
  choice: foram rompidas
  rationale: O verbo indica que as cordas foram arrancadas, separadas ou quebradas; “rompidas” mantém a força destrutiva sem especificar indevidamente o mecanismo.
- source_word: בָּנַי
  choice: meus filhos
  rationale: Mantém o masculino plural explícito do hebraico e não decide se a referência é literal ou figurada.
- source_word: יְצָאֻנִי
  choice: partiram de junto de mim
  rationale: Expressa a partida para longe da pessoa que fala, com naturalidade e tom de lamento.
- source_word: וְאֵינָם
  choice: e já não estão aqui
  rationale: Comunica ausência presente sem afirmar necessariamente que morreram.
- source_word: אֵין נֹטֶה עוֹד אָהֳלִי
  choice: Não resta ninguém para tornar a armar minha tenda
  rationale: No contexto, נטה descreve estender ou armar uma tenda; “tornar a” representa עוֹד como repetição e restauração.
- source_word: יְרִיעוֹתַי
  choice: suas lonas
  rationale: Refere-se aos grandes panos que compõem a cobertura da tenda; o possessivo “suas” retoma naturalmente “minha tenda” em português.
- source_word: וּמֵקִים
  choice: e levantar
  rationale: Reproduz a ação de fazer as lonas ficar em pé ou no lugar como parte da montagem da tenda.
theological_decisions:
- issue: Identidade dos “filhos”
  choice: Preservar “meus filhos” sem explicitar o referente no texto
  alternative: Traduzir como “meu povo” ou “meus habitantes”
  rationale: O hebraico diz literalmente “meus filhos”, podendo aludir aos filhos reais ou, na personificação coletiva, ao povo ou aos habitantes. A tradução conserva essa abertura.
- issue: Sentido da ausência em וְאֵינָם
  choice: 'Traduzir como ausência: “já não estão aqui”'
  alternative: 'Entender como morte: “já não existem”'
  rationale: A expressão pode ser forte, mas o contexto não exige decidir entre morte, exílio ou simples ausência; a formulação escolhida evita resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem da tenda foi mantida de modo coerente por “cordas”, “armar” e “lonas”. Evitou-se “tabernáculo”, que poderia introduzir uma conotação cultual não exigida pelo contexto.
