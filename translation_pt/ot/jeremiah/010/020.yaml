  to: Minha tenda foi devastada[a], e todas as minhas cordas foram rompidas. Meus filhos partiram de mim e já não estão mais[b]. Não há ninguém para tornar a armar minha tenda e erguer minhas cortinas.
  rationale: A revisão corrige o possessivo de primeira pessoa exigido pelo hebraico em «minhas cortinas», preservando a coerência da voz poética e da metáfora da tenda. Também simplifica a formulação da partida para português mais natural, sem decidir se a ausência dos filhos se deve à morte, ao exílio ou a outra forma de perda.
