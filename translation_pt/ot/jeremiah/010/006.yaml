  text: מֵ/אֵ֥ין כָּמ֖וֹ/ךָ יְהוָ֑ה גָּד֥וֹל אַתָּ֛ה וְ/גָד֥וֹל שִׁמְ/ךָ֖ בִּ/גְבוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/006.yaml
  text: There is none like you[a], O Yahweh; you are great, and your name is great in might.
translation:
  language: pt
  text: Não há ninguém como tu, ó Yahweh[a]; tu és grande, e grande é o teu nome em poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, o nome divino, tradicionalmente traduzido como “SENHOR”; também transliterado “Yahweh”.'
    reason: Esclarece a forma hebraica do nome divino e a convenção de tradução, em coerência com a forma usada no texto.
lexical_decisions:
- source_word: מֵאֵין כָּמוֹךָ
  choice: Não há ninguém como tu
  rationale: A construção expressa que não existe pessoa ou ser comparável a Yahweh. A formulação é natural em português e preserva o discurso direto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: גָּדוֹל אַתָּה
  choice: tu és grande
  rationale: Reproduz de maneira clara e natural a afirmação enfática da grandeza de Yahweh.
- source_word: וְגָדוֹל שִׁמְךָ
  choice: e grande é o teu nome
  rationale: Mantém o paralelismo e a ênfase poética do hebraico; “nome” também pode envolver reputação e renome, mas o termo concreto é preservado.
- source_word: בִּגְבוּרָה
  choice: em poder
  rationale: Expressa a esfera ou manifestação na qual o nome de Yahweh é grande. “Poder” é corrente, digno e semanticamente adequado a גְּבוּרָה.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto a nota informa a tradição de substituí-lo pelo título “SENHOR”.
- issue: Sentido de “nome”
  choice: Preservar “nome” no texto principal
  alternative: renome; reputação
  rationale: No contexto, “nome” pode abranger a reputação e o caráter manifestado de Deus, mas traduzir literalmente conserva a expressão bíblica e sua amplitude teológica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O pronome “tu” preserva o endereço singular e combina naturalmente com o vocativo. A inversão “grande é o teu nome” mantém o paralelismo e a cadência poética do hebraico.
