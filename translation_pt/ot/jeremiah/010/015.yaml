  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/015.yaml
  text: They are vanity, a work of mockery; at the time of their punishment they will perish.
translation:
  language: pt
  text: Eles são vaidade, obra de zombaria; no tempo do seu castigo, perecerão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: vaidade
  rationale: Preserva a imagem bíblica de algo vazio, inútil e sem substância, aplicada aqui aos ídolos.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: obra de zombaria
  rationale: תַּעְתֻּעִים é raro e admite sentidos ligados a engano, ilusão ou escárnio; “zombaria” segue a leitura adotada e comunica que os ídolos são objeto ou produto de ridículo.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: no tempo do seu castigo
  rationale: פְּקֻדָּה pode indicar visitação, prestação de contas ou punição; no contexto de juízo e destruição dos ídolos, “castigo” expressa naturalmente o sentido.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: Verbo de destruição ou desaparecimento; “perecerão” mantém o tom solene e direto.
theological_decisions:
- issue: Referente do sufixo em פְּקֻדָּתָם
  choice: seu castigo
  alternative: sua visitação / o acerto de contas com eles
  rationale: Mantém o referente plural nos ídolos e expressa a visitação divina como juízo, sem acrescentar explicação doutrinária.
- issue: Natureza dos ídolos descritos como הֶבֶל
  choice: vaidade
  alternative: nada / inutilidade
  rationale: “Vaidade” conserva a linguagem tradicional e a amplitude metafórica de vapor, vazio e falta de valor, sem reduzir a expressão a uma afirmação ontológica única.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe breve paralela ao hebraico. “Vaidade” e “perecerão” preservam o registro bíblico sem comprometer a compreensão comum; “obra de zombaria” mantém a decisão textual auditada.
