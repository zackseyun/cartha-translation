  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּעֲלֶ֥ה נְשִׂאִ֖ים מִ/קְצֵ֣ה ארץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יּ֥וֹצֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/013.yaml
  text: At the sound of his voice[a], there is a roar of waters in the heavens, and he makes clouds rise from the ends of the earth; he makes lightning for the rain[b], and brings out the wind from his storehouses.
translation:
  language: pt
  text: Ao som de sua voz[a], há um estrondo de águas nos céus. Ele faz subir as nuvens[b] desde os confins da terra, produz relâmpagos para a chuva e faz sair o vento de seus depósitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente «ao som de seu dar»; a expressão é condensada e entende-se como ele dar ou emitir sua voz.
    reason: lexical_alternative
  - marker: b
    text: Ou «vapores» ou «névoas».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Ao som de sua voz
  rationale: A expressão hebraica é comprimida e, literalmente, fala do ato de Deus dar ou emitir sua voz. A formulação portuguesa preserva a voz divina e expressa com naturalidade a circunstância temporal.
- source_word: הֲמוֹן מַיִם
  choice: um estrondo de águas
  rationale: הֲמוֹן pode indicar abundância, tumulto ou ruído. No contexto de tempestade e em associação com קוֹל, «estrondo» comunica bem a dimensão sonora.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: שָׁמַיִם pode designar o céu visível ou os céus. O plural mantém o tom elevado e a amplitude da imagem hebraica.
- source_word: וַיַּעֲלֶה נְשִׂאִים
  choice: Ele faz subir as nuvens
  rationale: A forma causativa de עלה indica fazer subir; נְשִׂאִים, neste contexto meteorológico, designa nuvens ou massas de vapor.
- source_word: מִקְצֵה אֶרֶץ
  choice: desde os confins da terra
  rationale: A expressão aponta para as regiões mais distantes do mundo. «Confins da terra» é uma formulação bíblica clara e corrente em português.
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: produz relâmpagos para a chuva
  rationale: A tradução conserva a preposição ל e a relação deliberadamente concisa entre os relâmpagos e a chuva, sem especificar além do hebraico sua relação meteorológica exata.
- source_word: וַיּוֹצֵא רוּחַ
  choice: e faz sair o vento
  rationale: רוּחַ pode significar vento, sopro ou espírito, mas o contexto meteorológico indica «vento». «Faz sair» reflete a ação causativa atribuída a Deus.
- source_word: מֵאֹצְרֹתָיו
  choice: de seus depósitos
  rationale: אֹצָר designa um lugar onde algo é guardado, como depósito, armazém ou tesouro. «Depósitos» comunica de modo compreensível a imagem de forças naturais guardadas sob o domínio de Deus.
theological_decisions:
- issue: Linguagem antropomórfica da manifestação divina na tempestade
  choice: Manter a agência pessoal de Deus em «sua voz», «faz subir», «produz» e «faz sair»
  alternative: Converter o versículo em uma descrição meteorológica impessoal
  rationale: O hebraico atribui diretamente a Deus o governo dos fenômenos naturais. A tradução preserva essa afirmação sem explicar a mecânica da ação divina.
- issue: Relação entre os relâmpagos e a chuva
  choice: Preservar a formulação concisa «para a chuva»
  alternative: Explicitar como «com a chuva» ou «para anunciar a chuva»
  rationale: A preposição hebraica admite uma relação ampla, e o texto não determina com precisão se é associação, finalidade ou acompanhamento. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação divide a longa sequência hebraica sem enfraquecer a unidade da cena. «Estrondo» mantém a força auditiva; «confins» preserva o registro bíblico sem soar arcaico.
