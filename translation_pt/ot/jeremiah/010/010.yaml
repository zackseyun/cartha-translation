  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אֱלֹהִים֙ אֱמֶ֔ת הֽוּא אֱלֹהִ֥ים חַיִּ֖ים וּ/מֶ֣לֶךְ עוֹלָ֑ם מִ/קִּצְפּ/וֹ֙ תִּרְעַ֣שׁ הָ/אָ֔רֶץ וְ/לֹֽא יָכִ֥לוּ גוֹיִ֖ם זַעְמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
translation:
  language: pt
  text: Mas Yahweh é o Deus verdadeiro[a]; ele é o Deus vivo e o Rei eterno[b]. Por causa da sua ira, a terra treme, e as nações não podem suportar a sua indignação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Deus da verdade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o Rei para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Mas Yahweh
  rationale: O nome divino é transliterado como “Yahweh”. A conjunção recebe sentido adversativo, pois o contexto contrasta Yahweh com os ídolos.
- source_word: אֱלֹהִים אֱמֶת
  choice: o Deus verdadeiro
  rationale: A expressão identifica Yahweh como o Deus verdadeiro em contraste com os falsos deuses; “Deus da verdade” continua sendo uma possibilidade lexical.
- source_word: הוּא אֱלֹהִים חַיִּים
  choice: ele é o Deus vivo
  rationale: A formulação explicita a predicação enfática do hebraico e preserva o contraste com ídolos sem vida.
- source_word: וּמֶלֶךְ עוֹלָם
  choice: e o Rei eterno
  rationale: עוֹלָם comunica duração sem fim; “eterno” é natural, solene e mantém a força da realeza permanente.
- source_word: מִקִּצְפּוֹ
  choice: Diante da sua ira
  rationale: A preposição מן indica aqui causa ou reação à ira divina; a expressão portuguesa comunica que a terra treme perante essa ira.
- source_word: תִּרְעַשׁ הָאָרֶץ
  choice: a terra treme
  rationale: רעש descreve forte abalo. “Terra” se ajusta ao alcance universal do contexto.
- source_word: וְלֹא יָכִלוּ גוֹיִם
  choice: e as nações não podem suportar
  rationale: יכל com o objeto seguinte expressa incapacidade de resistir ou aguentar; “suportar” é claro e direto.
- source_word: זַעְמוֹ
  choice: a sua indignação
  rationale: זַעַם denota ira intensa, especialmente divina; “indignação” preserva o tom solene e o possível aspecto judicial.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Valor da conjunção inicial ו
  choice: Mas
  alternative: E
  rationale: O contexto imediato estabelece contraste entre Yahweh e os ídolos; “Mas” torna explícita essa função discursiva sem alterar a afirmação central.
- issue: Sentido de אֱלֹהִים אֱמֶת
  choice: o Deus verdadeiro
  alternative: o Deus da verdade
  rationale: A leitura escolhida ressalta o contraste contextual com deuses falsos, enquanto a alternativa permanece gramaticalmente possível.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “Deus” reproduz a ênfase hebraica, e “ira/indignação” mantém a variação lexical do original.
