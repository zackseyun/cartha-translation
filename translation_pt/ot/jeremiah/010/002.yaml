id: JER.10.2
reference: Jeremiah 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֶל דֶּ֤רֶךְ הַ/גּוֹיִם֙ אַל תִּלְמָ֔דוּ וּ/מֵ/אֹת֥וֹת הַ/שָּׁמַ֖יִם אַל תֵּחָ֑תּוּ כִּֽי יֵחַ֥תּוּ הַ/גּוֹיִ֖ם מֵ/הֵֽמָּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/002.yaml
  text: 'Thus says Yahweh: Do not learn the way of the nations[a], and do not be dismayed at the signs of the heavens, because the nations are dismayed at them.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Não aprendam o caminho[a] das nações, nem se deixem apavorar pelos sinais dos céus, pois as nações se apavoram com eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, o modo de agir ou os costumes das nações; também se pode traduzir: “Não adotem os costumes das nações”.'
    reason: Esclarece o sentido figurado de דֶּרֶךְ e a implicação contextual de למד sem substituir a formulação concreta do texto principal.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética hebraica em uma forma solene, clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דֶּרֶךְ הַגּוֹיִם
  choice: o caminho das nações
  rationale: Preserva a imagem hebraica de דֶּרֶךְ, que aqui se refere ao modo de agir, aos costumes ou às práticas das nações.
- source_word: אַל תִּלְמָדוּ
  choice: Não aprendam
  rationale: Traduz diretamente o verbo למד e deixa implícita, como no hebraico, a ideia contextual de assimilar ou adotar tais práticas.
- source_word: מֵאֹתוֹת הַשָּׁמַיִם
  choice: pelos sinais dos céus
  rationale: Mantém tanto a noção de sinais ou presságios celestes quanto a expressão elevada e literal “dos céus”.
- source_word: תֵּחָתּוּ / יֵחַתּוּ
  choice: se deixem apavorar / se apavoram
  rationale: Comunica a forte reação de medo expressa por חתת e reproduz a repetição verbal do hebraico em português natural.
- source_word: כִּי
  choice: pois
  rationale: Introduz com naturalidade a razão apresentada para a proibição.
- source_word: מֵהֵמָּה
  choice: com eles
  rationale: Retoma claramente “os sinais dos céus” e forma uma construção idiomática com “apavorar-se” em português.
theological_decisions:
- issue: Sentido de גּוֹיִם na condenação de práticas estrangeiras
  choice: nações
  alternative: gentios
  rationale: “Nações” conserva o sentido amplo do hebraico e evita introduzir associações posteriores que “gentios” pode evocar.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva explicitamente, sem substituí-lo pelo título “SENHOR”.
- issue: Força emocional do verbo חתת
  choice: apavorar-se
  alternative: ficar consternado; ficar aterrorizado; deixar-se abalar
  rationale: A escolha expressa medo intenso no contexto de sinais celestes, sem acrescentar uma interpretação específica sobre a natureza desses sinais.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais correntes no plural (“aprendam”, “se deixem”) e preservação da repetição enfática do hebraico. A imagem “caminho das nações” foi mantida no texto e esclarecida em nota.
