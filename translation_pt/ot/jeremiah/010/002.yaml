  source_fidelity: 'O texto traduz com precisão os elementos principais do hebraico: a fórmula profética, o nome Yahweh, a proibição de aprender o “caminho” das nações, os sinais dos céus e a repetição do verbo חתת aplicada primeiro aos destinatários e depois às nações. “Pelos sinais dos céus” e “com eles” expressam adequadamente a relação causal indicada por מִן.'
  naturalness: O português é claro, atual e de registro apropriadamente solene. “Não aprendam o caminho das nações” preserva a imagem hebraica, e a nota torna seu sentido idiomático acessível. “Não se deixem apavorar” é uma formulação natural, embora um pouco mais perifrástica que o hebraico, e funciona bem no contexto.
  terminology: “Yahweh”, “nações”, “sinais dos céus” e “caminho” são escolhas consistentes com o texto-fonte e evitam associações posteriores ou interpretações confessionais indevidas. “Apavorar” comunica legitimamente a força de חתת sem especificar quais seriam os sinais celestes.
