id: JER.10.8
reference: Jeremiah 10:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/אַחַ֖ת יִבְעֲר֣וּ וְ/יִכְסָ֑לוּ מוּסַ֥ר הֲבָלִ֖ים עֵ֥ץ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/008.yaml
  text: But together they are stupid and foolish[b][a]; the instruction of idols is wood.
translation:
  language: pt
  text: Mas todos eles são insensatos e tolos[a]; a instrução dos ídolos[b] é madeira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «juntos, tornam-se irracionais e agem como tolos»; a expressão inicial é idiomática e pode significar «juntos», «todos igualmente» ou «num só aspecto».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «vaidades»; neste contexto, termo profético comum para ídolos ou coisas sem valor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחַת
  choice: Mas todos eles
  rationale: A expressão é difícil e idiomática. Com os verbos no plural, transmite mais naturalmente a ideia de que todos são iguais nesse aspecto. «Mas» expressa o contraste com o versículo anterior.
- source_word: יִבְעֲרוּ
  choice: são insensatos
  rationale: O verbo בער tem aqui o sentido de ser irracional ou sem entendimento, não o homônimo «queimar». «Insensatos» é natural, digno e preserva a dimensão intelectual e moral.
- source_word: וְיִכְסָלוּ
  choice: e tolos
  rationale: Derivado de כסל, «ser tolo». A coordenação de dois adjetivos em português preserva o paralelismo conciso do hebraico.
- source_word: מוּסַר
  choice: instrução
  rationale: מוּסָר pode significar instrução, disciplina ou correção. «Instrução» é amplo e adequado à formulação comprimida deste contexto.
- source_word: הֲבָלִים
  choice: ídolos
  rationale: Literalmente associado a coisas vãs, fugazes ou sem valor, o termo é usado na polêmica profética para designar ídolos como nulidades. A nota conserva o sentido lexical mais literal.
- source_word: עֵץ הוּא
  choice: é madeira
  rationale: A oração nominal hebraica é abrupta e enfatiza a matéria do ídolo. A formulação concisa mantém essa força sem acrescentar «mera» ou «pedaço de».
theological_decisions:
- issue: Referente e sentido da oração final na polêmica contra os ídolos
  choice: A suposta instrução dos ídolos é declarada madeira.
  alternative: O próprio ídolo de madeira é o instrutor; ou a instrução é descrita figuradamente como inerte.
  rationale: O hebraico é comprimido e permite mais de uma relação sintática. O texto principal mantém a formulação abrupta e a crítica contextual aos objetos de madeira, sem desenvolver uma interpretação teológica além do que a frase afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Insensatos e tolos» evita o tom excessivamente coloquial de «estúpidos», enquanto a frase final conserva deliberadamente a concisão e a estranheza do hebraico.
