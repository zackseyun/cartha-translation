  source_fidelity: A tradução reproduz adequadamente a condição, os interlocutores e a ameaça. Contudo, desloca a pergunta final — “o que o rei lhe disse” — para antes da ordem de não ocultar e da promessa de não matar. No hebraico, ela vem depois desses elementos, como complemento final da exigência. A revisão restaura essa sequência e explicita de modo natural em português o imperativo elíptico que rege a pergunta final.
