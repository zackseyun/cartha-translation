source:
  edition: WLC
  text: וְ/כִֽי יִשְׁמְע֣וּ הַ/שָּׂרִים֮ כִּֽי דִבַּ֣רְתִּי אִתָּ/ךְ֒ וּ/בָ֣אוּ אֵלֶ֣י/ךָ וְֽ/אָמְר֪וּ אֵלֶ֟י/ךָ הַגִּֽידָ/ה נָּ֨א לָ֜/נוּ מַה דִּבַּ֧רְתָּ אֶל הַ/מֶּ֛לֶךְ אַל תְּכַחֵ֥ד מִמֶּ֖/נּוּ וְ/לֹ֣א נְמִיתֶ֑/ךָ וּ/מַה דִּבֶּ֥ר אֵלֶ֖י/ךָ הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/025.yaml
  text: But if the officials hear that I have spoken with you[a], and they come to you and say to you, ‘Please tell us what you said to the king; do not hide it from us, and we will not put you to death, and what the king said to you,’
translation:
  language: pt
  text: 'Mas, se as autoridades[a] ouvirem que conversei com você, vierem até você e lhe disserem: “Por favor, conte-nos o que você disse ao rei; não esconda isso de nós, e não mataremos você; conte-nos também o que o rei lhe disse”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os príncipes”; isto é, líderes da corte ou do governo.
    reason: Preserva a alternativa lexical de הַשָּׂרִים e esclarece que o termo se refere a dirigentes oficiais, não necessariamente a filhos do rei.
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz a situação condicional em continuidade com a instrução anterior, com leve nuance adversativa.
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: No contexto, designa os altos líderes governamentais ou da corte, não necessariamente filhos do rei.
- source_word: דִבַּרְתִּי אִתָּךְ
  choice: conversei com você
  rationale: O verbo com אֵת indica aqui uma conversa ou fala mantida com Jeremias; a formulação é natural e preserva a reciprocidade contextual.
- source_word: וּבָאוּ אֵלֶיךָ
  choice: e vierem até você
  rationale: O valor verbal integra a hipótese iniciada por 'se'; o futuro do subjuntivo é a forma portuguesa natural.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Por favor, conte-nos
  rationale: Traduz o imperativo com נָא como pedido insistente, mas cortês.
- source_word: מַה דִּבַּרְתָּ אֶל־הַמֶּלֶךְ
  choice: o que você disse ao rei
  rationale: '''Dizer ao rei'' é a expressão idiomática portuguesa para comunicar o conteúdo da fala.'
- source_word: אַל־תְּכַחֵד מִמֶּנּוּ
  choice: Não esconda nada de nós
  rationale: כחד significa ocultar ou esconder; 'nada' explicita naturalmente o conteúdo subentendido sem alterar o sentido.
- source_word: וְלֹא נְמִיתֶךָ
  choice: e não mataremos você
  rationale: O hifil de מות expressa causar a morte; a forma direta é clara e adequada à ameaça.
- source_word: וּמַה דִּבֶּר אֵלֶיךָ הַמֶּלֶךְ
  choice: e o que o rei lhe disse
  rationale: Completa a exigência das autoridades. A coordenação com a primeira pergunta é preservada, mas reunida antes da ameaça para produzir discurso direto claro em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. 'Autoridades' evita a possível impressão de que שָׂרִים significa necessariamente príncipes de sangue real. A ordem interna da fala foi levemente reorganizada para evitar que a segunda pergunta fique artificialmente separada da primeira; todo o conteúdo semântico do hebraico foi preservado.
