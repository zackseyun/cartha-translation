source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הַ/שָּׂרִ֜ים אֶל הַ/מֶּ֗לֶךְ י֣וּמַת נָא֮ אֶת הָ/אִ֣ישׁ הַ/זֶּה֒ כִּֽי עַל כֵּ֡ן הֽוּא מְרַפֵּ֡א אֶת יְדֵי֩ אַנְשֵׁ֨י הַ/מִּלְחָמָ֜ה הַֽ/נִּשְׁאָרִ֣ים בָּ/עִ֣יר הַ/זֹּ֗את וְ/אֵת֙ יְדֵ֣י כָל הָ/עָ֔ם לְ/דַבֵּ֣ר אֲלֵי/הֶ֔ם כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה כִּ֣י הָ/אִ֣ישׁ הַ/זֶּ֗ה אֵינֶ֨/נּוּ דֹרֵ֧שׁ לְ/שָׁל֛וֹם לָ/עָ֥ם הַ/זֶּ֖ה כִּ֥י אִם לְ/רָעָֽה־־־־־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/004.yaml
  text: Then the officials said to the king[a], “Please let this man be put to death, for in this way he is weakening the hands of the men of war who remain in this city, and the hands of all the people, by speaking to them words like these. For this man is not seeking the welfare of this people[c][b], but their harm.”
translation:
  language: pt
  text: 'Então as autoridades disseram ao rei: “Que este homem seja morto, por favor, pois, desse modo, ele desanima[a] os homens de guerra[b] que ainda restam nesta cidade e todo o povo, falando-lhes palavras como estas. Pois este homem não busca o bem-estar[c] deste povo, mas o seu mal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “enfraquece as mãos de”. Essa expressão hebraica significa desanimar ou tirar a coragem.
    reason: lexical_alternative
  - marker: b
    text: Ou “os soldados”.
    reason: lexical_alternative
  - marker: c
    text: Ou “a paz”. O termo hebraico também pode incluir segurança, prosperidade e tudo o que contribui para o bem de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: as autoridades
  rationale: Designa os altos oficiais civis ou cortesãos que exerciam autoridade. “As autoridades” é atual, natural e não especifica indevidamente uma patente militar nem sugere necessariamente príncipes de sangue.
- source_word: יוּמַת נָא
  choice: Que este homem seja morto, por favor
  rationale: A forma passiva com valor volitivo pede que o homem seja executado; נָא atenua formalmente a exigência como petição. A formulação preserva tanto o pedido quanto a ideia de uma morte decretada pelas autoridades.
- source_word: עַל כֵּן
  choice: pois, desse modo
  rationale: No contexto, introduz a justificativa do pedido e aponta para o efeito da conduta de Jeremias. “Desse modo” expressa essa relação de maneira idiomática.
- source_word: מְרַפֵּא אֶת יְדֵי
  choice: ele desanima
  rationale: A expressão idiomática hebraica significa literalmente tornar frouxas ou fracas as mãos, isto é, tirar a coragem e a disposição de agir. “Desanima” comunica claramente o sentido em português, enquanto a imagem original é preservada em nota.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: os homens de guerra
  rationale: Mantém de perto a expressão hebraica e seu caráter militar, sem modernizar excessivamente o cenário; “soldados” é indicado como alternativa natural.
- source_word: הַנִּשְׁאָרִים
  choice: que ainda restam
  rationale: O particípio descreve os combatentes que permanecem na cidade depois das perdas e partidas. “Ainda restam” exprime naturalmente essa ideia de remanescente.
- source_word: וְאֵת יְדֵי כָל הָעָם
  choice: e todo o povo
  rationale: O verbo idiomático “desanima” rege em português tanto “os homens de guerra” quanto “todo o povo”. Repetir literalmente “as mãos” obscureceria o sentido depois que o idioma foi traduzido funcionalmente.
- source_word: לְדַבֵּר אֲלֵיהֶם כַּדְּבָרִים הָאֵלֶּה
  choice: falando-lhes palavras como estas
  rationale: O infinitivo indica o meio pelo qual Jeremias os desanima. “Como estas” preserva o valor comparativo de כַּ, sem transformar a frase numa fórmula de citação literal.
- source_word: דֹרֵשׁ לְשָׁלוֹם
  choice: busca o bem-estar
  rationale: שָׁלוֹם pode abranger paz, segurança, integridade e prosperidade. “Bem-estar” se ajusta ao contraste com o mal e evita restringir a acusação à ausência de guerra.
- source_word: כִּי אִם לְרָעָה
  choice: mas o seu mal
  rationale: A construção forma um contraste exclusivo com o bem-estar do povo. “O seu mal” conserva a concisão e deixa claro que se trata, segundo a acusação, do mal destinado ao povo.
theological_decisions:
- issue: Alcance de שָׁלוֹם na acusação contra Jeremias
  choice: bem-estar
  alternative: paz
  rationale: O termo admite ambos os sentidos. O texto principal usa a noção mais abrangente exigida pelo contraste com רָעָה, e a nota preserva explicitamente a alternativa “paz”, sem decidir uma questão teológica além do que o hebraico permite.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução adota equivalência ótima: verte funcionalmente o idioma das “mãos enfraquecidas”, registrando a imagem literal em nota; mantém “homens de guerra” para conservar a textura histórica; e preserva em nota a amplitude semântica de שָׁלוֹם.'
