source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אֶֽל יִרְמְיָ֗הוּ שִׂ֣ים נָ֠א בְּלוֹאֵ֨י הַ/סְּחָב֤וֹת וְ/הַ/מְּלָחִים֙ תַּ֚חַת אַצִּל֣וֹת יָדֶ֔י/ךָ מִ/תַּ֖חַת לַ/חֲבָלִ֑ים וַ/יַּ֥עַשׂ יִרְמְיָ֖הוּ כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/012.yaml
  text: Then Ebed-melech the Cushite said to Jeremiah[a], “Please put these worn-out rags and torn clothes under your armpits[c][b], under the ropes.” And Jeremiah did so.
translation:
  language: pt
  text: 'Então Ebede-Meleque, o cuxita[a], disse a Jeremias: “Por favor, ponha estes trapos gastos e estas roupas rasgadas[b] debaixo das axilas[c], por baixo das cordas”. E Jeremias fez assim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o etíope”. O hebraico diz “o cuxita”, isto é, um homem de Cuxe.
    reason: lexical_alternative
  - marker: b
    text: Os termos hebraicos para esses materiais são raros e provavelmente se referem a peças de tecido velhas ou deterioradas, usadas como proteção entre o corpo de Jeremias e as cordas.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “debaixo das articulações das suas mãos ou dos seus braços”; aqui, o sentido é a região debaixo dos braços, onde as cordas fariam pressão ao içá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebede-Meleque
  rationale: Transliteração portuguesa do nome próprio hebraico, em vez de traduzi-lo como “servo do rei”.
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Designa um homem de Cuxe e corresponde diretamente ao termo etnogeográfico hebraico; “etíope” é uma equivalência tradicional mais interpretativa.
- source_word: שִׂים נָא
  choice: Por favor, ponha
  rationale: Reproduz de modo natural o imperativo acompanhado da partícula de súplica נָא.
- source_word: בְּלוֹאֵי הַסְּחָבוֹת וְהַמְּלָחִים
  choice: estes trapos gastos e estas roupas rasgadas
  rationale: Os termos designam provavelmente artigos de tecido velhos ou deteriorados. A formulação comunica sua função como proteção sem ocultar a incerteza lexical, indicada em nota.
- source_word: תַּחַת אַצִּלוֹת יָדֶיךָ
  choice: debaixo das axilas
  rationale: Embora a expressão se refira literalmente às articulações ou regiões dos braços, no contexto das cordas usadas para içar Jeremias indica naturalmente as axilas.
- source_word: מִתַּחַת לַחֲבָלִים
  choice: por baixo das cordas
  rationale: Indica que o tecido deveria ficar entre o corpo de Jeremias e as cordas.
- source_word: וַיַּעַשׂ יִרְמְיָהוּ כֵּן
  choice: E Jeremias fez assim
  rationale: Fórmula narrativa simples que preserva de perto o hebraico e soa natural em português.
