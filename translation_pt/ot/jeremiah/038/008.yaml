  text: וַ/יֵּצֵ֥א עֶֽבֶד מֶ֖לֶךְ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְדַבֵּ֥ר אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/008.yaml
  text: Then Ebed-melech went out from the king’s house and spoke to the king[a], saying,
translation:
  language: pt
  text: 'Então Ebede-Meleque saiu da casa do rei[a] e falou ao rei, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do palácio”. O hebraico diz literalmente “da casa do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O wayyiqtol de יצא indica movimento para fora e dá continuidade à sequência narrativa; “saiu” expressa isso de modo natural em português.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebede-Meleque
  rationale: Neste contexto, trata-se de um nome próprio. A forma transliterada “Ebede-Meleque” é clara e se ajusta à fonologia e à ortografia portuguesas.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: da casa do rei
  rationale: Mantém a expressão hebraica בֵּית הַמֶּלֶךְ e sua possível amplitude sem substituir no texto a formulação concreta por “palácio”.
- source_word: וַיְדַבֵּר אֶל הַמֶּלֶךְ
  choice: foi falar com o rei
  rationale: דבר com אֶל significa falar a/com alguém. A formulação portuguesa liga naturalmente a saída ao encontro com o rei e evita uma repetição rígida de “rei” com duas orações coordenadas.
- source_word: לֵאמֹר
  choice: 'e disse:'
  rationale: A fórmula introduz a fala direta que vem no versículo seguinte. Em português narrativo, “e disse:” cumpre essa função com naturalidade; os dois-pontos sinalizam que a fala continua.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Preserva-se literalmente “casa do rei” no texto e registra-se “palácio” como alternativa contextual em nota.
