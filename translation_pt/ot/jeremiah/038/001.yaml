  text: וַ/יִּשְׁמַ֞ע שְׁפַטְיָ֣ה בֶן מַתָּ֗ן וּ/גְדַלְיָ֨הוּ֙ בֶּן פַּשְׁח֔וּר וְ/יוּכַל֙ בֶּן שֶׁ֣לֶמְיָ֔הוּ וּ/פַשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה אֶ֨ת הַ/דְּבָרִ֔ים אֲשֶׁ֧ר יִרְמְיָ֛הוּ מְדַבֵּ֥ר אֶל כָּל הָ/עָ֖ם לֵ/אמֹֽר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/001.yaml
  text: Shephatiah son of Mattan[a], Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchiah heard the words that Jeremiah was speaking to all the people, saying,
translation:
  language: pt
  text: 'Sefatias, filho de Matã, Gedalias, filho de Pasur, Jucal[a], filho de Selemias, e Pasur, filho de Malquias, ouviram as palavras que Jeremias estava dizendo a todo o povo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, o hebraico traz יוּכַל, “Jucal”; a mesma pessoa aparece em Jeremias 37:3 com a forma mais longa “Jeucal”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviram
  rationale: O qal wayyiqtol de שׁמע introduz diretamente o acontecimento narrativo. O pretérito perfeito é natural em português e concorda com o sujeito composto posposto.
- source_word: שְׁפַטְיָה ... גְדַלְיָהוּ ... יוּכַל ... פַשְׁחוּר
  choice: Sefatias ... Gedalias ... Jucal ... Pasur
  rationale: Os nomes pessoais são transliterados em formas correntes e legíveis em português. Para יוּכַל, “Jucal” reflete a forma consonantal deste versículo; a relação com a forma mais longa em Jeremias 37:3 é indicada em nota.
- source_word: בֶּן
  choice: filho de
  rationale: É a identificação genealógica comum e transparente em português.
- source_word: אֶת הַדְּבָרִים
  choice: as palavras
  rationale: Neste contexto, דְּבָרִים designa o conteúdo falado por Jeremias; “as palavras” preserva a expressão concreta do hebraico.
- source_word: אֲשֶׁר יִרְמְיָהוּ מְדַבֵּר
  choice: que Jeremias estava dizendo
  rationale: O particípio מְדַבֵּר apresenta a fala como contínua no momento em que foi ouvida. “Estava dizendo” comunica esse aspecto progressivo com naturalidade.
- source_word: אֶל כָּל הָעָם
  choice: a todo o povo
  rationale: עָם se refere ao conjunto de pessoas a quem Jeremias falava. “Todo o povo” é claro e idiomático.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo introduz o conteúdo da fala no versículo seguinte. Em português, os dois-pontos cumprem essa função de modo mais natural do que o gerúndio literal “dizendo” no fim do período.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem dos nomes segue o hebraico. Não se acrescentou um marcador inicial como “Ora” ou “Então”, pois o texto-fonte não contém uma palavra temporal explícita. Os dois-pontos preservam a função de לֵאמֹר e ligam este versículo à fala que começa no seguinte.
