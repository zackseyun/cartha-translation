  text: Then you shall say to them[a], ‘I was presenting my plea before the king, that he should not send me back to the house of Jonathan to die there.’
translation:
  language: pt
  text: 'Então você lhes dirá: “Eu estava apresentando minha súplica diante do rei, para que ele não me mandasse de volta à casa de Jônatas, a fim de eu não morrer ali.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Então você lhes dirá
  rationale: A conjunção seguida da forma verbal, dentro de uma instrução, indica a ação seguinte. “Então” explicita naturalmente a sequência, e “você lhes dirá” mantém o valor diretivo futuro.
- source_word: מַפִּיל אֲנִי תְחִנָּתִי לִפְנֵי הַמֶּלֶךְ
  choice: Eu estava apresentando minha súplica diante do rei
  rationale: A expressão hebraica literalmente faz a súplica “cair diante” de alguém, um idioma para formular um pedido insistente. O progressivo no passado se ajusta ao relato solicitado sobre a audiência recém-encerrada.
- source_word: תְחִנָּתִי
  choice: minha súplica
  rationale: O substantivo designa um pedido insistente por favor ou misericórdia. “Súplica” conserva a intensidade e é corrente no registro bíblico moderno.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: Preserva a imagem espacial e o tom formal do hebraico, soando natural em português.
- source_word: לְבִלְתִּי הֲשִׁיבֵנִי
  choice: para que ele não me mandasse de volta
  rationale: A construção apresenta o conteúdo ou propósito da súplica. O agente, expresso por “ele”, é o rei no contexto; “mandasse de volta” traduz idiomaticamente o causativo.
- source_word: בֵּית יְהוֹנָתָן
  choice: à casa de Jônatas
  rationale: Tradução transparente da construção hebraica e coerente com a designação recorrente desse local de prisão.
- source_word: לָמוּת שָׁם
  choice: a fim de eu não morrer ali
  rationale: No contexto, o infinitivo indica o resultado fatal temido caso Jeremias fosse devolvido. A formulação portuguesa torna clara a relação sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o tom de instrução régia e a intensidade do pedido de Jeremias sem reproduzir de modo artificial o idioma hebraico de fazer a súplica “cair diante” do rei.
