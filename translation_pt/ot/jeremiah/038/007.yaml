  text: וַ/יִּשְׁמַ֡ע עֶֽבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אִ֣ישׁ סָרִ֗יס וְ/הוּא֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ כִּֽי נָתְנ֥וּ אֶֽת יִרְמְיָ֖הוּ אֶל הַ/בּ֑וֹר וְ/הַ/מֶּ֥לֶךְ יוֹשֵׁ֖ב בְּ/שַׁ֥עַר בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/007.yaml
  text: Ebed-melech the Cushite[a], a court official who was in the king’s house, heard that they had put Jeremiah into the cistern[c][b], while the king was sitting at the Benjamin Gate.
translation:
  language: pt
  text: Ebede-Meleque, o cuxita[a], um oficial da corte[b] que estava no palácio do rei, ouviu que tinham colocado Jeremias na cisterna[c], enquanto o rei estava sentado à Porta de Benjamim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um homem de Cuxe; traduções tradicionais também trazem “o etíope”.
    reason: Nota cultural para כּוּשִׁי; “cuxita” preserva a designação etnogeográfica hebraica.
  - marker: b
    text: Ou, possivelmente, “um eunuco”. O termo hebraico pode referir-se a um eunuco ou, de modo mais amplo, a um oficial da corte.
    reason: Alternativa lexical para סָרִיס.
  - marker: c
    text: Ou “na cova” ou “no poço”. A palavra hebraica pode designar uma cova, um poço ou uma cisterna; neste contexto, “cisterna” é a opção mais específica.
    reason: Alternativa lexical para בּוֹר.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O verbo שׁמע, na sequência narrativa, é expresso de modo direto e natural por “ouviu”, sem acrescentar um marcador temporal ausente no hebraico.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebede-Meleque
  rationale: O contexto trata a expressão como nome próprio; emprega-se uma transliteração adaptada à ortografia e à pronúncia usuais em português, em vez de traduzi-la como “servo do rei”.
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Designa um homem originário de Cuxe. “Cuxita” preserva a referência etnogeográfica hebraica com mais precisão do que o tradicional “etíope”.
- source_word: אִישׁ סָרִיס
  choice: um oficial da corte
  rationale: סָרִיס pode indicar um eunuco propriamente dito ou, em sentido funcional, um oficial da corte. A tradução principal comunica o papel no contexto, e a alternativa lexical é preservada em nota.
- source_word: וְהוּא בְּבֵית הַמֶּלֶךְ
  choice: que estava no palácio real
  rationale: Embora a forma literal seja “na casa do rei”, neste contexto a expressão se refere ao palácio ou complexo real; a oração relativa produz português natural.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo daquilo que Ebede-Meleque ouviu.
- source_word: נָתְנוּ אֶת־יִרְמְיָהוּ אֶל־הַבּוֹר
  choice: tinham colocado Jeremias na cisterna
  rationale: בּוֹר pode significar poço, cova ou cisterna. O contexto imediato de Jeremias 38 identifica o local como cisterna; “tinham colocado” indica naturalmente que a ação antecedeu o momento em que ele ouviu.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: enquanto o rei estava sentado
  rationale: A oração fornece uma circunstância simultânea de fundo e é expressa naturalmente com “enquanto”.
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: junto ao Portão de Benjamim
  rationale: A preposição בְּ indica localização no portão ou junto dele. “Junto ao” evita sugerir que o rei estivesse literalmente dentro da estrutura, preservando a referência ao portão específico.
