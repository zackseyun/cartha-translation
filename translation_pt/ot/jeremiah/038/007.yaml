  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o nome próprio e a designação etnogeográfica em formas portuguesas correntes; a ambiguidade de סָרִיס e a extensão semântica de בּוֹר são registradas em notas.
