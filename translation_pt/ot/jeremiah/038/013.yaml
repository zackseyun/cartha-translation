  text: וַ/יִּמְשְׁכ֤וּ אֶֽת יִרְמְיָ֨הוּ֙ בַּֽ/חֲבָלִ֔ים וַ/יַּעֲל֥וּ אֹת֖/וֹ מִן הַ/בּ֑וֹר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/013.yaml
  text: So they pulled Jeremiah up with the ropes and brought him up out of the cistern[b][a], and Jeremiah remained in the court of the guard.
translation:
  language: pt
  text: Então eles puxaram Jeremias com as cordas e o tiraram da cisterna[a]. E Jeremias permaneceu no pátio da guarda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do poço” ou “da cova”. A palavra hebraica pode designar poço, cisterna ou cova; neste contexto, “cisterna” corresponde melhor ao cenário narrativo.
    reason: lexical_alternative
  - marker: b
    text: Ou “no pátio da prisão”. A expressão hebraica se refere à área vigiada onde Jeremias estava detido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁכוּ
  choice: puxaram
  rationale: O verbo משׁך descreve o ato físico de puxar; “puxaram” é natural e preciso no contexto do resgate.
- source_word: בַּחֲבָלִים
  choice: com as cordas
  rationale: חֲבָלִים significa cordas ou cabos, e a preposição בְּ tem aqui valor instrumental.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: o tiraram
  rationale: A forma causativa de עלה significa fazê-lo subir ou trazê-lo para cima. Em português, “o tiraram da cisterna” comunica naturalmente o resultado sem repetir de modo pesado a ideia de subir.
- source_word: מִן הַבּוֹר
  choice: da cisterna
  rationale: בּוֹר pode designar poço, cisterna ou cova. O contexto narrativo indica uma cisterna, embora a alternativa lexical seja preservada em nota.
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer; aqui descreve a continuidade da permanência de Jeremias naquele local.
- source_word: בַּחֲצַר
  choice: no pátio
  rationale: חָצֵר designa um pátio ou recinto; “pátio” é claro e corrente em português.
- source_word: הַמַּטָּרָה
  choice: da guarda
  rationale: מַטָּרָה refere-se, em Jeremias, à área vigiada onde o profeta estava detido. “Da guarda” preserva a referência ao recinto sob vigilância sem especificar indevidamente uma construção ou prisão formal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação conserva a sequência narrativa hebraica, mas evita a repetição pouco natural de “puxaram” e “fizeram subir”. Os marcadores de nota aparecem junto aos termos a que se referem.
