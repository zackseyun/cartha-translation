  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לָ/צֵ֑את זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר הִרְאַ֖/נִי יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/021.yaml
  text: 'But if you refuse to go out[a], this is the word that Yahweh has shown me:'
translation:
  language: pt
  text: 'Mas, se você se recusar a sair, esta é a palavra[a] que Yahweh me mostrou:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este é o assunto que Yahweh me mostrou”.'
    reason: Alternativa lexical para דָּבָר, que pode significar “palavra” ou “assunto” neste contexto.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A combinação da conjunção com a partícula condicional contrasta esta possibilidade com a declaração anterior; “Mas, se” expressa esse valor com naturalidade.
- source_word: מָאֵן
  choice: se recusar
  rationale: O verbo indica recusa deliberada, não simples incapacidade ou hesitação.
- source_word: לָצֵאת
  choice: a sair
  rationale: Mantém o sentido literal do infinitivo. Embora no contexto se trate de sair ao encontro das autoridades babilônicas, o texto não explicita aqui a ideia de rendição.
- source_word: זֶה הַדָּבָר
  choice: esta é a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “coisa”. “Palavra” se ajusta ao contexto de revelação profética, enquanto a nota preserva a alternativa lexical genuína.
- source_word: אֲשֶׁר הִרְאַנִי
  choice: que ... me mostrou
  rationale: O hifil de ראה significa “mostrar” ou “fazer ver”; esta formulação natural preserva a dimensão visual da revelação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino e corresponde à transliteração adotada.
- issue: Natureza da revelação em זֶה הַדָּבָר אֲשֶׁר הִרְאַנִי
  choice: “a palavra que Yahweh me mostrou”
  alternative: “o assunto que Yahweh me mostrou”
  rationale: “Palavra” conserva a ressonância profética, mas דָּבָר também pode designar um assunto ou acontecimento; essa ambiguidade é preservada em nota sem definir de modo excessivo a forma da revelação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção “se você se recusar” explicita naturalmente o sujeito e preserva o caráter volitivo do hebraico. O nome divino é mantido como “Yahweh”.
