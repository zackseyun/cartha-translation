base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/015.yaml
  text: Jeremiah said to Zedekiah[a], “If I tell you, will you not surely put me to death? And if I advise you[b], you will not listen to me.”
translation:
  language: pt
  text: 'Jeremias disse a Zedequias: “Se eu lhe contar, você não vai mesmo me matar? E, se eu o aconselhar, você não me dará ouvidos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אַגִּיד לְךָ
  choice: Se eu lhe contar
  rationale: Neste contexto, כִּי introduz a condição expressa por Jeremias, e נגד no hifil significa contar, declarar ou dar a conhecer. A formulação é natural em português e preserva a construção condicional.
- source_word: הֲלוֹא
  choice: por acaso você não
  rationale: A partícula introduz uma pergunta retórica que espera resposta afirmativa. “Por acaso... não” conserva essa força interrogativa sem transformá-la numa afirmação direta.
- source_word: הָמֵת תְּמִיתֵנִי
  choice: me matará
  rationale: O infinitivo absoluto seguido do verbo finito dá ênfase à certeza da ação. Em português, no contexto da pergunta retórica, “por acaso você não me matará?” comunica naturalmente a expectativa enfática de Jeremias.
- source_word: וְכִי אִיעָצְךָ
  choice: E, se eu o aconselhar
  rationale: וְכִי introduz uma segunda condição paralela, e יעץ significa aconselhar. A tradução mantém a estrutura e o paralelismo do hebraico.
- source_word: לֹא תִשְׁמַע אֵלַי
  choice: você não me dará ouvidos
  rationale: שׁמע com אֶל pode significar escutar, atender ou obedecer. “Dar ouvidos” preserva a ideia de escuta atenta ou acatamento sem restringi-la explicitamente à obediência.
- source_word: יִרְמְיָהוּ / צִדְקִיָּהוּ
  choice: Jeremias / Zedequias
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” coerente com a legibilidade brasileira. A pergunta retórica e o paralelismo das duas condições foram preservados; “dar ouvidos” mantém a possível nuance entre escutar e acatar.
