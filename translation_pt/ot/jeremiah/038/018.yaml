base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/018.yaml
  text: But if you do not go out to the officials of the king of Babylon[a], then this city will be given into the hand of the Chaldeans, and they will burn it with fire[b], and you will not escape from their hand.
translation:
  language: pt
  text: Mas, se você não for até os altos oficiais do rei da Babilônia[a], esta cidade será entregue nas mãos dos caldeus; eles a incendiarão, e você não escapará das mãos deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos príncipes do rei da Babilônia” ou “aos comandantes do rei da Babilônia”. O termo hebraico pode designar, de modo amplo, autoridades de alto escalão.
    reason: lexical_alternative
  - marker: b
    text: As expressões “nas mãos dos caldeus” e “das mãos deles” são maneiras hebraicas de falar de estar sob o poder de alguém ou de escapar desse poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֵצֵא
  choice: Mas, se você não sair para se entregar
  rationale: A construção introduz a alternativa contrastante à declaração anterior. תֵצֵא significa literalmente “sair”, mas, neste contexto, sair ao encontro das autoridades babilônicas implica entregar-se; a formulação conserva a imagem concreta e torna clara sua força pragmática.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: aos altos oficiais do rei da Babilônia
  rationale: שָׂרִים designa autoridades de alto escalão e pode abranger oficiais civis, príncipes ou comandantes. “Altos oficiais” é amplo, natural e não restringe indevidamente o cargo.
- source_word: וְנִתְּנָה הָעִיר הַזֹּאת
  choice: esta cidade será entregue
  rationale: O passivo de נתן expressa que a cidade será posta sob o domínio inimigo. “Será entregue” reproduz naturalmente a construção sem precisar explicitar o agente.
- source_word: בְּיַד הַכַּשְׂדִּים
  choice: nas mãos dos caldeus
  rationale: A expressão hebraica “na mão de” é uma metáfora de poder ou controle. O plural idiomático em português soa natural e conserva a imagem do original.
- source_word: וּשְׂרָפוּהָ בָּאֵשׁ
  choice: eles a incendiarão
  rationale: O hebraico diz literalmente “eles a queimarão com fogo”. “Incendiarão” comunica de modo corrente e completo o ato de pôr a cidade em chamas, evitando uma redundância pouco natural em português.
- source_word: וְאַתָּה לֹא תִמָּלֵט מִיָּדָם
  choice: e você não escapará das mãos deles
  rationale: O nifal de מלט significa “escapar”. A expressão “das mãos deles” preserva a metáfora hebraica e forma um paralelo com “nas mãos dos caldeus”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém a metáfora recorrente das “mãos”, mas explicita a implicação contextual de “sair” por meio de “para se entregar”. “Caldeus” preserva a designação étnico-política do hebraico.
