base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/027.yaml
  text: Then all the officials came to Jeremiah and questioned him[a], and he told them all these words that the king had commanded. So they were silent before him, for the matter had not been heard.
translation:
  language: pt
  text: Então todos os oficiais foram até Jeremias e o interrogaram. Ele lhes contou tudo o que o rei havia ordenado. Eles não lhe disseram mais nada, pois o assunto não tinha sido ouvido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois a conversa não tinha sido ouvida”. O hebraico diz literalmente: “pois o assunto não tinha sido ouvido” e não especifica quem não o ouvira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: No contexto da corte real, שָׂרִים designa autoridades ou líderes da administração; “oficiais” é atual e não restringe o termo a príncipes ou militares.
- source_word: וַיִּשְׁאֲלוּ אֹתוֹ
  choice: o interrogaram
  rationale: O contexto mostra uma investigação sobre o encontro com o rei, e não uma pergunta casual.
- source_word: וַיַּגֵּד לָהֶם
  choice: Ele lhes contou
  rationale: O hifil de נגד significa dar a conhecer ou contar; esta formulação é clara e natural na narrativa.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: tudo o que o rei havia ordenado
  rationale: Exprime idiomaticamente que Jeremias repetiu a resposta que o rei lhe mandara dar, preservando a anterioridade e a força da ordem real.
- source_word: וַיַּחֲרִשׁוּ מִמֶּנּוּ
  choice: Eles não lhe disseram mais nada
  rationale: חרשׁ indica que ficaram calados ou cessaram de falar; a expressão comunica naturalmente que os oficiais deixaram de pressioná-lo.
- source_word: כִּי לֹא נִשְׁמַע הַדָּבָר
  choice: pois a conversa não tinha sido ouvida
  rationale: O passivo de שׁמע deixa indefinido quem poderia ter ouvido. “Conversa” explicita o referente contextual de דָּבָר sem identificar um ouvinte.
