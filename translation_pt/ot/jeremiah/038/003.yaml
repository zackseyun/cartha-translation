source:
  edition: WLC
  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנָּתֹ֨ן תִּנָּתֵ֜ן הָ/עִ֣יר הַ/זֹּ֗את בְּ/יַ֛ד חֵ֥יל מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/003.yaml
  text: 'Thus says Yahweh: This city will surely be given into the hand of the army of the king of Babylon[a], and he will capture it.'
translation:
  language: pt
  text: 'Assim diz Yahweh: Esta cidade certamente será entregue nas mãos do exército do rei da Babilônia[a], e ele a conquistará.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao poder do exército do rei da Babilônia”. A expressão hebraica diz literalmente “na mão do exército do rei da Babilônia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Reproduz de modo natural e digno a fórmula profética de mensageiro, mantendo o presente convencional e o nome divino.
- source_word: הִנָּתֹן תִּנָּתֵן
  choice: certamente será entregue
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da forma passiva; “certamente” comunica essa ênfase em português atual.
- source_word: הָעִיר הַזֹּאת
  choice: Esta cidade
  rationale: Equivalência direta e natural para o sintagma demonstrativo hebraico.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a metáfora hebraica de domínio ou controle, usando a forma idiomática mais natural em português.
- source_word: חֵיל
  choice: exército
  rationale: No contexto militar, o termo designa as forças armadas do rei da Babilônia.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução portuguesa corrente da construção hebraica de estado construto.
- source_word: וּלְכָדָהּ
  choice: e ele a conquistará
  rationale: O verbo לָכַד, aplicado a uma cidade, indica conquistá-la ou capturá-la. O sujeito singular implícito é mantido sem explicitar além do hebraico se ele aponta para o rei ou, coletivamente, para o exército.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Referente do sujeito singular em וּלְכָדָהּ
  choice: ele
  alternative: o rei; o exército
  rationale: O hebraico traz um verbo masculino singular, mas permite entender o rei como agente principal ou seu exército como agente coletivo. O pronome preserva essa tensão sem resolvê-la indevidamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a cadência profética, a ênfase enfática do hebraico e sua leve ambiguidade quanto ao agente da conquista.
