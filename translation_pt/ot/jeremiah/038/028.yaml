base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/028.yaml
  text: And Jeremiah remained in the court of the guard until the day Jerusalem was captured[b][a]. And it happened when Jerusalem was captured—
translation:
  language: pt
  text: Jeremias permaneceu no pátio da guarda até o dia em que Jerusalém foi capturada.[a] E aconteceu que, quando Jerusalém foi capturada—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi tomada”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico termina abruptamente: “E aconteceu que, quando Jerusalém foi capturada—”. É provável que estas palavras funcionem como transição para o material seguinte, em vez de constituírem, por si sós, uma frase completa.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: Neste contexto de custódia, expressa a continuidade da permanência de Jeremias sem sugerir residência voluntária.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: no pátio da guarda
  rationale: Preserva o sentido de חָצֵר como pátio e de מַטָּרָה como guarda ou local oficial de detenção, em português natural.
- source_word: עַד יוֹם אֲשֶׁר
  choice: até o dia em que
  rationale: Reproduz com clareza o marco temporal que encerra a permanência de Jeremias sob custódia.
- source_word: נִלְכְּדָה
  choice: foi capturada
  rationale: O nifal de לכד indica que a cidade foi tomada ou capturada; esta escolha mantém o valor passivo e o contexto militar.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e corrente do nome da cidade em português.
- source_word: וְהָיָה
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa e a transição sintaticamente incompleta, sem recorrer a linguagem arcaica.
- source_word: כַּאֲשֶׁר
  choice: quando
  rationale: Equivalente temporal claro e natural neste contexto.
