  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יִּקַּ֞ח אֶֽת יִרְמְיָ֤הוּ הַ/נָּבִיא֙ אֵלָ֔י/ו אֶל מָבוֹא֙ הַ/שְּׁלִישִׁ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶֽל יִרְמְיָ֗הוּ שֹׁאֵ֨ל אֲנִ֤י אֹֽתְ/ךָ֙ דָּבָ֔ר אַל תְּכַחֵ֥ד מִמֶּ֖/נִּי דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/014.yaml
  text: Then King Zedekiah sent and took Jeremiah the prophet to himself[a], to the third entrance that is in the house of Yahweh, and the king said to Jeremiah, “I am asking you something[b]; do not hide anything from me.”
translation:
  language: pt
  text: 'Então o rei Zedequias mandou buscar o profeta Jeremias e o trouxe à sua presença, na terceira entrada da casa de Yahweh[a]. O rei disse a Jeremias: “Quero lhe perguntar uma coisa; não esconda nada de mim[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do templo de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não me oculte coisa alguma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: mandou buscar ... e o trouxe à sua presença
  rationale: Reproduz a sequência dos dois verbos narrativos, שלח e לקח, em português natural. No contexto, o rei envia alguém para buscar Jeremias e assim o faz vir até si.
- source_word: אֵלָיו
  choice: à sua presença
  rationale: Expressa o movimento de Jeremias em direção ao próprio rei, com formulação clara e digna em português.
- source_word: מָבוֹא הַשְּׁלִישִׁי
  choice: a terceira entrada
  rationale: מָבוֹא designa uma entrada ou acesso. Mantém-se literalmente o ordinal “terceira”, sem tentar identificar qual entrada era.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a expressão hebraica literal “casa de YHWH”; “templo de Yahweh” é oferecido em nota como equivalente contextual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, distinguindo-o de um título como “Senhor”.
- source_word: שֹׁאֵל אֲנִי אֹתְךָ דָּבָר
  choice: Quero lhe perguntar uma coisa
  rationale: Transmite de modo idiomático a intenção imediata expressa pelo particípio שֹׁאֵל com o pronome אֲנִי; דָּבָר significa aqui “uma coisa” ou “um assunto”.
- source_word: אַל תְּכַחֵד מִמֶּנִּי דָּבָר
  choice: não esconda nada de mim
  rationale: כחד significa esconder ou ocultar; “nada” comunica naturalmente em português a abrangência negativa de דָּבָר nesta construção.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino, não o título אֲדֹנָי. A transliteração preserva essa distinção, enquanto “SENHOR” representa a tradição de leitura substitutiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe narrativa foi suavemente naturalizada sem identificar de modo especulativo a “terceira entrada” nem eliminar a repetição conceitual do pedido do rei.
