  naturalness: A redação é geralmente clara, mas «serão levados para fora, aos caldeus» soa menos natural em português. «Serão levados para junto dos caldeus» conserva o movimento de saída e melhora a fluência. «Pela mão do rei» é compreensível e permite manter o paralelismo idiomático do hebraico.
  terminology: «Caldeus», «rei da Babilônia», «mulheres» e «filhos» são adequados. «Mulheres» preserva o termo hebraico, embora o contexto seja o das esposas do rei. A nota sobre «mão» deve receber âncora também na segunda ocorrência, onde a expressão é mantida.
