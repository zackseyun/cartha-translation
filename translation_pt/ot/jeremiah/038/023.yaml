base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/023.yaml
  text: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
translation:
  language: pt
  text: Todas as suas mulheres e todos os seus filhos serão levados para junto dos caldeus[a]. Você não escapará das mãos deles[b], pois será capturado pela mão do rei da Babilônia[b], e queimará esta cidade com fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aos babilônios».
    reason: lexical_alternative
  - marker: b
    text: No hebraico, «das mãos deles» e «pela mão do rei da Babilônia» são expressões que indicam poder ou domínio.
    reason: cultural_note
lexical_decisions:
- source_word: נָשֶׁיךָ
  choice: suas mulheres
  rationale: No contexto da casa real, refere-se naturalmente às mulheres do rei, provavelmente suas esposas; “mulheres” preserva a amplitude lexical sem tornar a frase obscura.
- source_word: בָּנֶיךָ
  choice: seus filhos
  rationale: בנים designa aqui os descendentes masculinos; em português, “filhos” é a forma natural e contextualmente adequada.
- source_word: מוֹצִאִים
  choice: serão levados para fora
  rationale: O particípio hofal expressa ação causada e passiva, com valor futuro no contexto da advertência profética.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém o etnônimo específico do hebraico; uma nota esclarece sua referência aos babilônios.
- source_word: לֹא תִמָּלֵט מִיָּדָם
  choice: não escapará das mãos deles
  rationale: Preserva a imagem hebraica da mão como poder ou domínio e continua natural em português.
- source_word: בְיַד מֶלֶךְ בָּבֶל תִּתָּפֵשׂ
  choice: será capturado pelo rei da Babilônia
  rationale: Explicita naturalmente em português a agência indicada pelo idioma hebraico “pela mão de”, sem perder o sentido de sujeição ao poder do rei.
- source_word: הָעִיר הַזֹּאת תִּשְׂרֹף
  choice: esta cidade será queimada
  rationale: Embora a forma consonantal vocalizada seja 2ms, o contexto e versões antigas sustentam uma leitura em que “esta cidade” é que será queimada; a tradução evita atribuir diretamente a ação ao interlocutor.
- source_word: בָּאֵשׁ
  choice: será queimada
  rationale: O português exprime de modo natural a destruição pelo fogo com o verbo “queimar”, tornando redundante acrescentar “com fogo”.
theological_decisions:
- issue: Sujeito de תִּשְׂרֹף e responsabilidade pela queima da cidade
  choice: “esta cidade será queimada”
  alternative: “você queimará esta cidade”
  rationale: A vocalização massorética pode ser entendida como segunda pessoa masculina singular, mas a construção é textualmente difícil e antigas testemunhas apoiam o sentido passivo referente à cidade. A formulação passiva preserva a advertência sem resolver a agência de modo excessivamente específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “caldeus” por precisão histórica, acompanhado de alternativa em nota. A repetição do marcador [b] assinala as duas ocorrências do mesmo idioma hebraico de “mão”.
