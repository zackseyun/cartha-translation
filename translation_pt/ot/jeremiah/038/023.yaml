revisions:
- from: Todas as suas mulheres e os seus filhos serão levados para fora, aos caldeus[a]. E você não escapará das mãos deles[b], pois será capturado pelo rei da Babilônia[b]; e esta cidade será queimada.
  to: Todas as suas mulheres e todos os seus filhos serão levados para junto dos caldeus[a]. Você não escapará das mãos deles[b], pois será capturado pela mão do rei da Babilônia[b], e queimará esta cidade com fogo.
  rationale: 'A revisão restaura a sintaxe e o sentido mais direto do texto massorético: o interlocutor é o sujeito de «queimará», e «esta cidade» é seu objeto. Também restitui «com fogo», melhora a formulação do deslocamento até os caldeus e ancora a nota idiomática nas duas ocorrências relevantes. Não é necessário introduzir uma nota textual adicional, pois a tradução segue o WLC fornecido; a redação passiva proposta no rascunho não deve substituir sua leitura direta.'
