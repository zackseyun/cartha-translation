  text: וַ/יִּקַּ֣ח עֶֽבֶד מֶ֨לֶךְ אֶת הָ/אֲנָשִׁ֜ים בְּ/יָד֗/וֹ וַ/יָּבֹ֤א בֵית הַ/מֶּ֨לֶךְ֙ אֶל תַּ֣חַת הָ/אוֹצָ֔ר וַ/יִּקַּ֤ח מִ/שָּׁם֙ בְּלוֹיֵ֣ ה/סחבות וּ/בְלוֹיֵ֖ מְלָחִ֑ים וַ/יְשַׁלְּחֵ֧/ם אֶֽל יִרְמְיָ֛הוּ אֶל הַ/בּ֖וֹר בַּ/חֲבָלִֽים׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/011.yaml
  text: So Ebed-melech took the men with him and went into the king’s house[a], to a place below the storeroom, and from there took worn-out rags and worn-out garments[c][b], and sent them down by ropes to Jeremiah in the cistern.
translation:
  language: pt
  text: Então Ebede-Meleque levou consigo os homens e entrou no palácio do rei, indo até um lugar debaixo do depósito[a]. Dali, pegou trapos gastos e roupas velhas[b] e os baixou com cordas até Jeremias, na cisterna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “debaixo do tesouro”. A palavra hebraica também pode designar um tesouro ou armazém; neste contexto, “depósito” parece mais provável.
    reason: lexical_alternative
  - marker: b
    text: Ou “tecidos velhos”. O termo hebraico é raro, e seu sentido exato é incerto; o contexto sugere peças antigas de tecido usadas para proteger Jeremias das cordas.
    reason: lexical_alternative
  - marker: c
    text: Ou “na cova”. A palavra hebraica pode designar uma cova, um poço ou uma cisterna; aqui, “cisterna” se ajusta ao cenário da narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebede-Meleque
  rationale: Transliteração do nome próprio segundo a forma natural em português, em vez de traduzi-lo como “servo do rei”.
- source_word: הָאֲנָשִׁים בְּיָדוֹ
  choice: levou consigo os homens
  rationale: A expressão idiomática indica os homens que o acompanhavam ou estavam sob sua direção; “consigo” comunica naturalmente a ação no contexto.
- source_word: בֵית הַמֶּלֶךְ
  choice: palácio do rei
  rationale: Embora a expressão seja literalmente “casa do rei”, “palácio do rei” identifica com clareza e naturalidade a residência real.
- source_word: אֶל תַּחַת הָאוֹצָר
  choice: até um lugar debaixo do depósito
  rationale: תַּחַת aponta para uma área inferior, e אוֹצָר pode designar depósito, armazém ou tesouro. O contexto de recolher tecidos velhos favorece “depósito”, sem eliminar a alternativa em nota.
- source_word: בְּלוֹיֵ הַסְּחָבוֹת
  choice: trapos gastos
  rationale: A combinação descreve retalhos ou trapos deteriorados pelo uso; a formulação é clara e mantém os dois elementos sem redundância excessiva.
- source_word: וּבְלוֹיֵ מְלָחִים
  choice: roupas velhas
  rationale: מְלָחִים é raro e de sentido incerto. Pelo paralelismo e pelo uso desses objetos para proteger Jeremias das cordas, “roupas velhas” é uma representação contextual prudente, com a incerteza registrada em nota.
- source_word: וַיְשַׁלְּחֵם
  choice: os baixou
  rationale: O verbo expressa o envio dos objetos; como Jeremias estava dentro da cisterna e as cordas eram o meio empregado, “baixou” explicita naturalmente a direção exigida pela cena.
- source_word: אֶל יִרְמְיָהוּ אֶל הַבּוֹר
  choice: até Jeremias, na cisterna
  rationale: בּוֹר pode significar cova, poço ou cisterna. A narrativa identifica o local como uma cisterna usada para aprisionar Jeremias, enquanto a nota preserva a alternativa lexical.
- source_word: בַּחֲבָלִים
  choice: com cordas
  rationale: O bet instrumental indica o meio pelo qual os objetos foram baixados; “com cordas” é idiomático e conciso em português.
