  text: וַ/יֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל צִדְקִיָּ֡הוּ כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם יָצֹ֨א תֵצֵ֜א אֶל שָׂרֵ֤י מֶֽלֶךְ בָּבֶל֙ וְ/חָיְתָ֣ה נַפְשֶׁ֔/ךָ וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ וְ/חָיִ֖תָה אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/017.yaml
  text: 'Then Jeremiah said to Zedekiah[a], “Thus says Yahweh, the God of hosts, the God of Israel: If you indeed go out to the officials of the king of Babylon, your life will be spared, and this city will not be burned with fire[c][b]; and you and your household will live.”'
translation:
  language: pt
  text: 'Então Jeremias disse a Zedequias: “Assim diz Yahweh, o Deus dos Exércitos, o Deus de Israel: Se você de fato for até os oficiais do rei da Babilônia[a], sua vida será poupada[b], e esta cidade não será queimada pelo fogo; você e sua casa viverão[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “se você realmente sair para os oficiais”. O hebraico combina um infinitivo absoluto com um verbo finito para enfatizar a ação. No contexto, ir até os oficiais babilônicos implica entregar-se a eles.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “sua vida viverá”. A palavra hebraica também pode ser traduzida por “pessoa” ou, em outros contextos, “alma”; aqui se refere à sobrevivência de Zedequias.
    reason: lexical_alternative
  - marker: c
    text: “Casa” designa aqui a família e os dependentes, não apenas a construção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יִרְמְיָהוּ אֶל צִדְקִיָּהוּ
  choice: Então Jeremias disse a Zedequias
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva como nome próprio o tetragrama presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: o Deus dos Exércitos
  rationale: Mantém a cadeia construta do hebraico e emprega uma expressão portuguesa reconhecível; “exércitos” pode abranger as hostes sob o domínio divino.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta, preservando a identificação pactual.
- source_word: אִם יָצֹא תֵצֵא
  choice: Se você de fato se entregar
  rationale: O infinitivo absoluto seguido do verbo finito dá ênfase à ação. No contexto, “sair até” as autoridades babilônicas significa colocar-se nas mãos delas; “de fato” conserva a ênfase.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: aos oficiais do rei da Babilônia
  rationale: שָׂרִים pode designar oficiais, príncipes ou comandantes. “Oficiais” preserva a amplitude do termo sem impor uma função exclusivamente militar.
- source_word: וְחָיְתָה נַפְשֶׁךָ
  choice: sua vida será poupada
  rationale: נֶפֶשׁ designa aqui a vida ou a própria pessoa em uma promessa de sobrevivência, não necessariamente uma alma imaterial.
- source_word: לֹא תִשָּׂרֵף בָּאֵשׁ
  choice: não será queimada pelo fogo
  rationale: Conserva de modo transparente tanto o passivo de שׂרף como a menção explícita ao fogo.
- source_word: וְחָיִתָה אַתָּה וּבֵיתֶךָ
  choice: você e sua família viverão
  rationale: בַּיִת refere-se neste contexto à casa como grupo familiar e dependentes, não apenas ao edifício; “família” comunica isso com naturalidade.
theological_decisions:
- issue: Tradução do nome divino
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o tetragrama יְהוָה. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na expressão de sobrevivência
  choice: sua vida será poupada
  alternative: sua alma viverá
  rationale: Neste contexto, o termo hebraico se refere à vida ou à pessoa que sobrevive. Essa tradução evita introduzir no verso uma definição antropológica que ele não exige.
- issue: Sentido contextual de “sair até” os oficiais babilônicos
  choice: se entregar
  alternative: sair ao encontro
  rationale: No cenário narrativo, sair até os oficiais do rei da Babilônia implica render-se a eles. A nota conserva a forma mais literal para que a imagem hebraica permaneça acessível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por clareza direta no discurso a Zedequias. A formulação principal comunica o sentido contextual, enquanto as notas registram as formas hebraicas mais literais e possíveis alternativas sem eliminar ambiguidades relevantes.
