base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/005.yaml
  text: Then King Zedekiah said[a], “Look, he is in your hands, for the king can do nothing against you.”
translation:
  language: pt
  text: 'Então o rei Zedequias disse: “Vejam, ele está nas mãos de vocês, pois o rei não pode fazer nada contra vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português atual.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: o rei Zedequias
  rationale: A construção hebraica de título e nome é expressa de modo natural e digno em português.
- source_word: הִנֵּה
  choice: Vejam
  rationale: A partícula chama a atenção dos interlocutores. O plural concorda com o grupo referido por “vocês” e é mais corrente que “Eis” neste diálogo.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente refere-se a Jeremias e funciona como sujeito da oração nominal.
- source_word: בְּיֶדְכֶם
  choice: nas mãos de vocês
  rationale: Preserva a imagem hebraica da mão como poder ou controle e permanece clara em português amplamente compreensível.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da concessão feita pelo rei.
- source_word: אֵין הַמֶּלֶךְ יוּכַל
  choice: o rei não pode fazer nada
  rationale: Expressa a incapacidade e conserva a autorreferência do rei na terceira pessoa, sem substituí-la por “eu”.
- source_word: אֶתְכֶם דָּבָר
  choice: nada contra vocês
  rationale: A construção hebraica é elíptica; no contexto, indica que o rei não consegue opor-se a eles ou contrariar sua decisão.
theological_decisions: []
