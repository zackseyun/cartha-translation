source:
  edition: WLC
  text: אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ הֵרֵ֜עוּ הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ אֵ֣ת כָּל אֲשֶׁ֤ר עָשׂוּ֙ לְ/יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֵ֥ת אֲשֶׁר הִשְׁלִ֖יכוּ אֶל הַ/בּ֑וֹר וַ/יָּ֤מָת תַּחְתָּי/ו֙ מִ/פְּנֵ֣י הָֽ/רָעָ֔ב כִּ֣י אֵ֥ין הַ/לֶּ֛חֶם ע֖וֹד בָּ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/009.yaml
  text: My lord the king[a], these men have done evil in all that they did to Jeremiah the prophet, whom they threw into the cistern, and he will die there because of the famine, for there is no bread left in the city.
translation:
  language: pt
  text: Ó rei, meu senhor, estes homens agiram perversamente em tudo o que fizeram ao profeta Jeremias. Eles o lançaram na cisterna[a], e ele morrerá ali[b] por causa da fome, pois já não há pão na cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cova” ou “poço”. O termo hebraico pode designar uma cova, uma masmorra ou uma cisterna; neste contexto, “cisterna” parece ser o sentido mais adequado.
    reason: lexical_alternative
  - marker: b
    text: 'A forma hebraica também pode ser entendida como uma descrição enfática de sua morte iminente: “ele está morrendo ali”.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Ó rei, meu senhor
  rationale: Preserva tanto o título real quanto o tratamento respeitoso e possessivo, em uma forma natural de dirigir-se ao rei em português.
- source_word: הֵרֵעוּ
  choice: agiram perversamente
  rationale: Mantém a força moral do hifil de רעע e soa mais natural em português do que uma reprodução rígida como “fizeram o mal” nesta construção.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: estes homens
  rationale: Reproduz o substantivo masculino plural específico do hebraico.
- source_word: אֵת כָּל אֲשֶׁר עָשׂוּ לְיִרְמְיָהוּ הַנָּבִיא
  choice: em tudo o que fizeram ao profeta Jeremias
  rationale: Expressa a totalidade dos maus-tratos e conserva o título profético de Jeremias.
- source_word: הִשְׁלִיכוּ אֶל הַבּוֹר
  choice: o lançaram na cisterna
  rationale: בור pode designar poço, cova ou cisterna; o contexto imediato, com lama no fundo de um reservatório sem água, favorece “cisterna”.
- source_word: וַיָּמָת תַּחְתָּיו
  choice: e ele morrerá ali
  rationale: Embora a forma verbal seja formalmente narrativa, no contexto ela apresenta a morte de Jeremias como o resultado iminente de permanecer naquele lugar. “Ali” comunica de modo natural o valor locativo idiomático de תחתיו.
- source_word: מִפְּנֵי הָרָעָב
  choice: por causa da fome
  rationale: Preserva a referência às condições de fome generalizada na cidade sitiada, sem reduzi-la apenas à sensação individual de Jeremias.
- source_word: כִּי אֵין הַלֶּחֶם עוֹד בָּעִיר
  choice: pois já não há pão na cidade
  rationale: Mantém a imagem concreta de “pão” e expressa naturalmente a ideia de que o suprimento se esgotou.
