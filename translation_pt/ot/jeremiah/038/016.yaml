base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/016.yaml
  text: Then King Zedekiah swore secretly to Jeremiah[a], saying, “As Yahweh lives, who made this life for us, I will not put you to death, nor will I give you into the hand of these men who are seeking your life.”
translation:
  language: pt
  text: 'Então o rei Zedequias jurou em segredo a Jeremias: “Tão certo como vive Yahweh, que nos deu esta vida[a], não matarei você, nem o entregarei nas mãos destes homens que procuram tirar a sua vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “que fez para nós esta vida”. A expressão hebraica também pode ser entendida como “que nos deu esta vida”.'
    reason: A construção hebraica com עָשָׂה e נֶפֶשׁ é incomum; a nota preserva sua forma mais literal e a alternativa lexical.
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: Expressa de modo conciso e solene o ato de prestar juramento.
- source_word: בַּסֵּתֶר
  choice: em segredo
  rationale: Preserva a ideia de ocultação e soa natural em português.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz idiomaticamente em português a fórmula hebraica de juramento, mantendo o nome divino.
- source_word: אֵת אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת
  choice: que nos deu esta vida
  rationale: Comunica com clareza o sentido contextual da expressão hebraica incomum; a formulação mais literal é preservada em nota.
- source_word: אִם אֲמִיתֶךָ
  choice: não matarei você
  rationale: Após a fórmula de juramento, אִם tem força negativa elíptica; a negação precisa ser explicitada em português.
- source_word: וְאִם אֶתֶּנְךָ בְּיַד
  choice: nem o entregarei nas mãos
  rationale: Mantém a metáfora hebraica de entregar alguém ao poder de outros e produz português natural.
- source_word: מְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: procuram tirar a sua vida
  rationale: Explicita o sentido idiomático de procurar a vida de alguém, isto é, tentar matá-lo, sem perder a referência à vida.
theological_decisions:
- issue: Representação do nome divino יהוה na fórmula de juramento
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração Yahweh preserva o nome pactual sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala régia conserva solenidade sem recorrer a formas pronominais arcaicas.
