base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
translation:
  language: pt
  text: 'Então Zedequias disse a Jeremias: “Que ninguém saiba destas coisas, e você não morrerá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל יִרְמְיָהוּ
  choice: a Jeremias
  rationale: Equivalência natural para a introdução do destinatário da fala, mantendo a forma tradicional do nome.
- source_word: אִישׁ אַל יֵדַע
  choice: Que ninguém saiba
  rationale: אִישׁ é empregado genericamente, e אַל com o jussivo exprime proibição. A formulação inclusiva é clara, atual e fiel ao sentido.
- source_word: בַּדְּבָרִים הָאֵלֶּה
  choice: destas coisas
  rationale: דְּבָרִים pode significar palavras, assuntos ou coisas. “Destas coisas” preserva a amplitude lexical sem especificar além do hebraico.
- source_word: וְלֹא תָמוּת
  choice: e você não morrerá
  rationale: A coordenação simples reproduz a forma hebraica e mantém aberta a relação de consequência, propósito ou garantia sugerida pelo contexto.
