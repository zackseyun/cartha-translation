base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/006.yaml
  text: So they took Jeremiah and threw him into the cistern of Malkijah the king’s son[a], which was in the court of the guard, and they lowered Jeremiah with ropes. Now there was no water in the cistern, but only mud[c][b], and Jeremiah sank into the mud.
translation:
  language: pt
  text: Então eles pegaram Jeremias e o lançaram na cisterna[a] de Malquias, filho do rei, situada no pátio da guarda[b]. Baixaram Jeremias com cordas. Na cisterna não havia água, mas somente lama[c], e Jeremias afundou na lama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poço”. O termo hebraico pode designar um poço ou uma cisterna; a menção de que não havia água, mas lama, favorece “cisterna” neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “pátio da prisão”. O termo hebraico provavelmente se refere a uma área vigiada de detenção.
    reason: lexical_alternative
  - marker: c
    text: Ou “lodo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: pegaram
  rationale: Traduz o verbo narrativo לקח de modo simples e natural; “agarraram” ou “prenderam” acrescentaria uma nuance de violência não expressa diretamente pelo verbo.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ אֶל הַבּוֹר
  choice: o lançaram na cisterna
  rationale: השליך indica lançar ou jogar, enquanto בור, à luz da ausência de água e da presença de lama, designa aqui provavelmente uma cisterna.
- source_word: מַלְכִּיָּהוּ בֶן הַמֶּלֶךְ
  choice: Malquias, filho do rei
  rationale: Mantém o nome hebraico em forma portuguesa consagrada e traduz literalmente a relação indicada pelo construto, sem inferir que ele fosse herdeiro do trono.
- source_word: אֲשֶׁר בַּחֲצַר הַמַּטָּרָה
  choice: que ficava no pátio da guarda
  rationale: חצר é pátio; מטרה, no contexto de Jeremias, aponta para uma área vigiada de detenção. “Pátio da guarda” preserva a referência sem especificar além do hebraico.
- source_word: וַיְשַׁלְּחוּ אֶת יִרְמְיָהוּ בַּחֲבָלִים
  choice: Desceram Jeremias com cordas
  rationale: Embora שלח costume significar “enviar”, o uso de cordas e o contexto da cisterna mostram que aqui a ação é fazê-lo descer.
- source_word: וּבַבּוֹר אֵין מַיִם כִּי אִם טִיט
  choice: Na cisterna não havia água, mas somente lama
  rationale: Reproduz claramente a inexistência de água e o valor exceptivo de כי אם. “Lama” é corrente e adequado para טיט.
- source_word: וַיִּטְבַּע יִרְמְיָהוּ בַּטִּיט
  choice: Jeremias afundou na lama
  rationale: טבע descreve afundar ou submergir; “afundou” conserva o movimento e o perigo da cena.
