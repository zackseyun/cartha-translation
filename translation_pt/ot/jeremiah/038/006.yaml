  naturalness: “Desceram Jeremias com cordas” é compreensível, mas soa menos natural no português internacional contemporâneo e pode sugerir uma construção elíptica. “Baixaram Jeremias com cordas” é claro e idiomático. Além disso, em “Malquias, filho do rei, que ficava”, o relativo pode, por proximidade, ser lido como referente a Malquias; “situada” elimina essa ambiguidade.
  terminology: “Cisterna”, “pátio da guarda”, “lama” e “afundou” representam adequadamente os termos hebraicos e preservam o registro narrativo. “Malquias” é uma forma portuguesa estabelecida e apropriada.
