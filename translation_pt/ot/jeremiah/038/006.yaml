revisions:
- from: Então eles pegaram Jeremias e o lançaram na cisterna[a] de Malquias, filho do rei, que ficava no pátio da guarda[b]. Desceram Jeremias com cordas. Na cisterna não havia água, mas somente lama[c], e Jeremias afundou na lama.
  to: Então eles pegaram Jeremias e o lançaram na cisterna[a] de Malquias, filho do rei, situada no pátio da guarda[b]. Baixaram Jeremias com cordas. Na cisterna não havia água, mas somente lama[c], e Jeremias afundou na lama.
  rationale: A revisão preserva integralmente o sentido do hebraico e as alternativas registradas nas notas. “Situada” fixa a cisterna como antecedente da localização no pátio da guarda; “baixaram” expressa de modo mais idiomático a descida de Jeremias por cordas.
