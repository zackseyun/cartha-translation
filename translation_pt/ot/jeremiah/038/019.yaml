base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/019.yaml
  text: Then King Zedekiah said to Jeremiah[a], “I am afraid of the Judeans who have defected to the Chaldeans[e][d][c][b], lest they hand me over to them and they mistreat me.”
translation:
  language: pt
  text: 'Então o rei Zedequias disse a Jeremias: “Tenho medo dos judeus[a] que passaram para o lado dos caldeus[b]. Talvez eles me entreguem aos caldeus[c], e os caldeus me maltratem[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judaítas”, isto é, pessoas de Judá.
    reason: lexical_alternative
  - marker: b
    text: Ou “se renderam aos caldeus”. Os caldeus eram os babilônios.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “me entreguem na mão deles”.
    reason: lexical_alternative
  - marker: d
    text: Ou “abusem de mim” ou “me tratem com crueldade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹאֵג
  choice: Tenho medo
  rationale: No contexto, Zedequias expressa temor diante do que poderá acontecer se for entregue; esta formulação é natural e preserva a força emocional do hebraico.
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: O termo designa aqui os habitantes ou membros do povo de Judá. “Judeus” é a forma corrente em português, enquanto a nota registra a alternativa historicamente mais específica.
- source_word: נָפְלוּ אֶל
  choice: passaram para o lado de
  rationale: A expressão idiomática tem sentido político-militar de aderir ao lado inimigo, podendo também implicar rendição, sem exigir que o texto defina precisamente a motivação.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação específica do texto hebraico para as forças neobabilônicas.
- source_word: יִתְּנוּ אֹתִי בְּיָדָם
  choice: me entreguem nas mãos daqueles homens
  rationale: Preserva a imagem hebraica de ser entregue “na mão” de alguém e esclarece que o segundo referente são os caldeus, não os judeus que passaram para o lado deles.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: e estes me maltratem
  rationale: Expressa tratamento cruel ou abusivo sem especificar indevidamente se seria zombaria, violência física ou outra forma de humilhação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem dos referentes foi explicitada por “daqueles homens” e “estes” para evitar a ambiguidade pronominal indesejada em português, sem mudar os participantes da cena. As notas conservam tanto a imagem literal quanto alternativas lexicais relevantes.
