  text: וַ/יְצַוֶּ֣ה הַ/מֶּ֔לֶךְ אֵ֛ת עֶֽבֶד מֶ֥לֶךְ הַ/כּוּשִׁ֖י לֵ/אמֹ֑ר קַ֣ח בְּ/יָדְ/ךָ֤ מִ/זֶּה֙ שְׁלֹשִׁ֣ים אֲנָשִׁ֔ים וְֽ/הַעֲלִ֜יתָ אֶֽת יִרְמְיָ֧הוּ הַ/נָּבִ֛יא מִן הַ/בּ֖וֹר בְּ/טֶ֥רֶם יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/010.yaml
  text: Then the king commanded Ebed-melech the Cushite[a], saying, “Take with you from here thirty men[b], and bring Jeremiah the prophet up from the cistern before he dies.”
translation:
  language: pt
  text: 'Então o rei ordenou a Ebede-Meleque, o cuxita[a]: “Leve daqui com você trinta homens e tire o profeta Jeremias da cisterna[b], antes que ele morra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o etíope”. O hebraico diz “o cuxita”, isto é, um homem de Cuxe.
    reason: lexical_alternative
  - marker: b
    text: Ou “do poço” ou “da cova”. O termo hebraico pode designar uma cisterna ou uma cova; “cisterna” se ajusta ao cenário desta narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem direta e autoritativa do rei; “ordenou” é natural e preserva essa força.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebede-Meleque
  rationale: O contexto trata a expressão como nome próprio. A transliteração adaptada à ortografia portuguesa favorece leitura e pronúncia.
- source_word: הַכּוּשִׁי
  choice: o cuxita
  rationale: Designa um homem de Cuxe. “Cuxita” corresponde diretamente ao termo etnogeográfico hebraico, sem substituí-lo pelo tradicional, mas menos exato, “etíope”.
- source_word: קַח בְּיָדְךָ מִזֶּה שְׁלֹשִׁים אֲנָשִׁים
  choice: Leve daqui com você trinta homens
  rationale: A expressão literalmente relacionada à “mão” é idiomática e indica levar pessoas consigo ou sob sua direção. A formulação conserva também מִזֶּה, “daqui”, e o número trinta.
- source_word: וְהַעֲלִיתָ
  choice: tire
  rationale: O hifil de עלה indica fazer subir. Em português, “tirar da cisterna” comunica naturalmente a ação de retirar Jeremias de baixo para cima, sem tornar a frase pesada.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Mantém tanto o nome quanto o título presentes no hebraico, em ordem idiomática no português.
- source_word: מִן הַבּוֹר
  choice: da cisterna
  rationale: בּוֹר pode significar poço, cova ou cisterna. No cenário narrativo, trata-se de uma estrutura de armazenamento de água com lama no fundo, por isso “cisterna” é a opção contextual mais precisa.
- source_word: בְּטֶרֶם יָמוּת
  choice: antes que ele morra
  rationale: בטרם estabelece o limite temporal “antes que”; o subjuntivo “morra” é a construção natural em português para o desfecho iminente que se pretende evitar.
