  text: כֹּה֮ אָמַ֣ר יְהוָה֒ הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יֹּצֵ֤א אֶל הַ/כַּשְׂדִּים֙ יחיה וְ/הָיְתָה לּ֥/וֹ נַפְשׁ֛/וֹ לְ/שָׁלָ֖ל וָ/חָֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/002.yaml
  text: 'Thus says Yahweh: He who remains in this city will die by the sword[a], by famine, and by pestilence; but he who goes out to the Chaldeans will live, and his life will be to him as spoil, and he will live.'
translation:
  language: pt
  text: 'Assim diz Yahweh: Quem permanecer nesta cidade morrerá pela espada, pela fome e pela peste; mas quem sair para os caldeus viverá. Terá a própria vida como despojo[a] e viverá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, escapará levando consigo apenas a própria vida. A expressão hebraica compara a vida preservada ao despojo obtido numa guerra.
    reason: Explica o sentido da metáfora hebraica sem removê-la do texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, preservando sua referência pactual.
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: Quem permanecer nesta cidade
  rationale: O particípio de ישׁב indica aqui continuar na cidade; «permanecer» é natural e conserva o contraste com sair.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: pela espada, pela fome e pela peste
  rationale: Mantém a tríade recorrente de juízo em Jeremias e um registro solene e compreensível.
- source_word: וְהַיֹּצֵא אֶל הַכַּשְׂדִּים
  choice: mas quem sair e se entregar aos caldeus
  rationale: Literalmente, «quem sair para os caldeus». No contexto do cerco, o movimento implica entregar-se a eles; a formulação explicita essa relação sem substituir o etnônimo hebraico.
- source_word: יִחְיֶה ... וָחָי
  choice: viverá ... e viverá
  rationale: Preserva a repetição enfática da raiz חיה no texto hebraico.
- source_word: וְהָיְתָה לוֹ נַפְשׁוֹ לְשָׁלָל
  choice: Terá a própria vida como despojo
  rationale: נֶפֶשׁ significa aqui a vida preservada, e «despojo» mantém a metáfora bélica do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome sem substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na expressão נַפְשׁוֹ לְשָׁלָל
  choice: a própria vida como despojo
  alternative: a sua alma como despojo; escapará com vida
  rationale: O contexto trata da preservação da vida física durante o cerco. «Vida» evita impor uma distinção antropológica alheia ao verso, enquanto «como despojo» conserva a imagem original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Peste» preserva o vocabulário profético tradicional sem soar excessivamente arcaico. A divisão em duas frases torna clara a promessa e mantém a repetição final do hebraico.
