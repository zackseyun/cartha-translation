source:
  edition: WLC
  text: וְ/הִנֵּ֣ה כָל הַ/נָּשִׁ֗ים אֲשֶׁ֤ר נִשְׁאֲרוּ֙ בְּ/בֵ֣ית מֶֽלֶךְ יְהוּדָ֔ה מוּצָא֕וֹת אֶל שָׂרֵ֖י מֶ֣לֶךְ בָּבֶ֑ל וְ/הֵ֣נָּה אֹמְר֗וֹת הִסִּית֜וּ/ךָ וְ/יָכְל֤וּ לְ/ךָ֙ אַנְשֵׁ֣י שְׁלֹמֶ֔/ךָ הָטְבְּע֥וּ בַ/בֹּ֛ץ רַגְלֶ֖/ךָ נָסֹ֥גוּ אָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/022.yaml
  text: And behold[a], all the women who remain in the house of the king of Judah are being brought out to the officials of the king of Babylon, and they are saying, ‘The men at peace with you have misled you and overcome you; your feet have sunk into the mud[b]; they have turned back.’
translation:
  language: pt
  text: 'E veja: todas as mulheres que restaram no palácio do rei de Judá serão levadas aos oficiais do rei da Babilônia. Elas dirão:


    “Os seus aliados[a] o induziram ao erro

    e prevaleceram contra você.

    Seus pés afundaram na lama;

    eles recuaram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os homens da sua paz”, expressão que indica pessoas em relações amistosas ou de confiança com alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E veja
  rationale: Conserva a função de chamar a atenção e introduzir vividamente a cena, com uma formulação mais natural no português atual do que “e eis que”.
- source_word: נִשְׁאֲרוּ בְּבֵית מֶלֶךְ יְהוּדָה
  choice: que restaram no palácio do rei de Judá
  rationale: O nifal de שׁאר indica as mulheres que ainda ficaram ali. “Palácio” comunica naturalmente o sentido contextual de “casa do rei”.
- source_word: מוּצָאוֹת
  choice: serão levadas
  rationale: O particípio hofal expressa ação causativa passiva. No contexto da advertência profética sobre o resultado futuro da rendição recusada, o futuro em português é natural, embora a forma hebraica apresente a cena com vividez.
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  choice: aos oficiais do rei da Babilônia
  rationale: שׂרים pode designar príncipes, chefes ou oficiais. “Oficiais” evita especificar indevidamente posição nobre ou função militar.
- source_word: הִסִּיתוּךָ
  choice: o induziram ao erro
  rationale: A expressão preserva a ideia causativa de influência enganosa ou desorientadora sem restringir o verbo apenas a engano deliberado ou incitação.
- source_word: וְיָכְלוּ לְךָ
  choice: e prevaleceram contra você
  rationale: יכל com ל indica obter vantagem ou prevalecer sobre alguém. A formulação mantém a força adversativa e é clara em português.
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: Os seus aliados
  rationale: A expressão literal “homens da sua paz” é um idiomatismo para pessoas em relações amistosas ou de confiança com o rei. “Aliados” comunica esse sentido político no texto principal, e a forma hebraica é registrada em nota.
- source_word: הָטְבְּעוּ בַבֹּץ רַגְלֶךָ
  choice: Seus pés afundaram na lama
  rationale: Mantém diretamente a imagem poética de aprisionamento e impotência. “Lama” é corrente e corresponde a בֹּץ.
- source_word: נָסֹגוּ אָחוֹר
  choice: eles recuaram
  rationale: Expressa de modo conciso a retirada dos aliados depois de levarem o rei à situação retratada.
theological_decisions:
- issue: Valor temporal de מוּצָאוֹת e אֹמְרוֹת
  choice: 'Futuro profético: “serão levadas” e “dirão”'
  alternative: 'Presente vívido: “estão sendo levadas” e “estão dizendo”'
  rationale: O contexto apresenta a consequência que ocorrerá se Zedequias não se render. O futuro torna essa relação temporal clara em português, sem negar a vividez dos particípios hebraicos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A fala das mulheres foi disposta em linhas poéticas para refletir o tom de escárnio e o paralelismo da declaração. O pronome objeto “o” mantém a referência masculina ao rei; “você” evita formas verbais regionais e conserva clareza ampla.
