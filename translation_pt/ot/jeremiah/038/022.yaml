  source_fidelity: 'A tradução conserva adequadamente o quadro profético futuro dos particípios passivos e ativos: as mulheres remanescentes serão levadas aos oficiais babilônicos e falarão. “Induziram ao erro” representa bem o valor causativo de הִסִּיתוּךָ, e “prevaleceram contra você” transmite יָכְלוּ לְךָ. A imagem dos pés afundados na lama e a retirada final dos aliados são preservadas.'
