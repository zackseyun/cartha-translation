  terminology: “Palácio”, “oficiais” e “aliados” são escolhas contextualmente adequadas. A nota em “aliados” preserva a expressão hebraica idiomática “homens da sua paz” e evita que a opção mais fluente seja tomada como equivalência estritamente literal.
