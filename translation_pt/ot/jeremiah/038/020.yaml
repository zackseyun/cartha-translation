  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ לֹ֣א יִתֵּ֑נוּ שְֽׁמַֽע נָ֣א בְּ/ק֣וֹל יְהוָ֗ה לַ/אֲשֶׁ֤ר אֲנִי֙ דֹּבֵ֣ר אֵלֶ֔י/ךָ וְ/יִ֥יטַב לְ/ךָ֖ וּ/תְחִ֥י נַפְשֶֽׁ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/020.yaml
  text: Jeremiah said[a], “They will not hand you over. Please listen to the voice of Yahweh in what I am speaking to you, so that it may go well with you and your life may be spared.”
translation:
  language: pt
  text: 'Jeremias disse: “Não o entregarão. Por favor, dê ouvidos à voz de Yahweh, conforme o que lhe digo, para que lhe vá bem e sua vida seja poupada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יִתֵּנוּ
  choice: Eles não entregarão você
  rationale: 'O verbo na terceira pessoa do plural tem objeto implícito recuperado do contexto: o rei. “Entregar” expressa de modo natural a ideia de colocá-lo sob o poder dos inimigos.'
- source_word: שְׁמַע נָא
  choice: Por favor, ouça
  rationale: O imperativo com נָא comunica um apelo insistente e cortês; a formulação preserva tanto a ordem quanto o tom de súplica.
- source_word: בְּקוֹל יְהוָה
  choice: a voz de Yahweh
  rationale: Mantém a imagem hebraica de ouvir a voz, que neste contexto inclui dar ouvidos e agir de acordo com a palavra divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לַאֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ
  choice: no que estou dizendo a você
  rationale: Liga a voz de Yahweh à mensagem que Jeremias transmite sem transformar a frase simplesmente em uma ordem para obedecer ao profeta.
- source_word: וְיִיטַב לְךָ
  choice: para que tudo corra bem com você
  rationale: Expressa em português corrente o resultado favorável indicado pela locução hebraica.
- source_word: וּתְחִי נַפְשֶׁךָ
  choice: e sua vida seja poupada
  rationale: נֶפֶשׁ refere-se aqui à vida física ameaçada; a formulação comunica naturalmente sua preservação, evitando o literalismo pouco idiomático “sua vida viva”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino; “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ num contexto de ameaça de morte
  choice: sua vida seja poupada
  alternative: sua alma viva; você continue vivo
  rationale: Neste contexto, o termo designa a vida da pessoa, não especificamente uma entidade imaterial; a tradução evita introduzir uma afirmação antropológica ausente do texto.
- issue: Relação entre ouvir e obedecer em בְּקוֹל
  choice: ouça a voz
  alternative: obedeça
  rationale: 'A tradução conserva a metáfora e a tensão do hebraico: ouvir aqui implica acolher e seguir a mensagem, mas o texto não é reduzido ao verbo “obedecer”.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a imagem semítica “ouça a voz”, mas verte os resultados prometidos em linguagem portuguesa natural. Não foram incluídas notas porque as alternativas lexicais não são necessárias para compreender o versículo.
