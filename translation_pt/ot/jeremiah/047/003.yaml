  source_fidelity: 'O texto preserva adequadamente a cadeia de causas sonoras do hebraico: o estrépito dos cascos, o ruído dos carros de guerra e o tumulto/rumor das rodas. «Ao som», repetido nas três expressões, comunica bem o valor causal de מִן neste contexto. «Os pais não se voltam para os filhos» mantém os termos de parentesco masculinos do original de maneira idiomática em português. «Porque suas mãos estão sem forças» expressa de modo claro a imagem idiomática de mãos enfraquecidas, sem impor que a causa seja exclusivamente medo.'
  naturalness: A redação é moderna, fluente e apropriada ao registro poético-profético. «Carros de guerra» evita com êxito a leitura moderna de «carros», e a repetição de «ao» dá paralelismo natural à frase. «Rugido de suas rodas» é uma metáfora sonora vigorosa e aceitável no contexto da invasão militar.
  terminology: Os termos militares e de parentesco estão bem escolhidos. «Poderosos cavalos» explicita de forma legítima o referente de אַבִּירָיו no contexto imediato dos cascos. A nota explica de forma equilibrada a expressão «frouxidão das mãos» e preserva sua amplitude sem transformá-la em uma interpretação doutrinária ou psicológica restrita.
