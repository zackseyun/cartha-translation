  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/קּ֗וֹל שַֽׁעֲטַת֙ פַּרְס֣וֹת אַבִּירָ֔י/ו מֵ/רַ֣עַשׁ לְ/רִכְבּ֔/וֹ הֲמ֖וֹן גַּלְגִּלָּ֑י/ו לֹֽא הִפְנ֤וּ אָבוֹת֙ אֶל בָּנִ֔ים מֵֽ/רִפְי֖וֹן יָדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/003.yaml
  text: At the sound of the stamping of the hooves of his mighty horses[a], at the rumbling of his chariots, at the roar of his wheels, fathers do not turn to their sons because of the helplessness of their hands.
translation:
  language: pt
  text: Ao som das batidas dos cascos de seus poderosos cavalos, ao estrondo de seus carros de guerra e ao rugido de suas rodas, os pais não se voltam para os filhos, porque suas mãos estão sem forças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “por causa da frouxidão das mãos”, expressão que indica perda de força, coragem ou capacidade de agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל שַׁעֲטַת פַּרְסוֹת
  choice: Ao som das batidas dos cascos
  rationale: Mantém o foco auditivo de מִקּוֹל e a imagem concreta dos cascos, expressando em português natural o impacto repetido sugerido por שַׁעֲטַת.
- source_word: אַבִּירָיו
  choice: seus poderosos cavalos
  rationale: No contexto imediato dos cascos e do ataque militar, o termo designa cavalos fortes; a explicitação evita a ambiguidade pouco natural de “seus poderosos”.
- source_word: מֵרַעַשׁ לְרִכְבּוֹ
  choice: ao estrondo de seus carros de guerra
  rationale: רַעַשׁ sugere ruído forte ou estrondo, e רֶכֶב tem aqui sentido coletivo militar. “Carros de guerra” deixa claro o referente antigo.
- source_word: הֲמוֹן גַּלְגִּלָּיו
  choice: ao rugido de suas rodas
  rationale: הֲמוֹן pode indicar tumulto ou ruído intenso; “rugido” preserva a força poética e a progressão sonora.
- source_word: לֹא הִפְנוּ אָבוֹת אֶל בָּנִים
  choice: os pais não se voltam para os filhos
  rationale: Reproduz o movimento de voltar-se para alguém e preserva os termos masculinos específicos do hebraico.
- source_word: מֵרִפְיוֹן יָדָיִם
  choice: porque suas mãos estão sem forças
  rationale: Preserva a imagem corporal do hebraico e comunica com clareza a fraqueza ou impotência causada pelo pânico, sem reduzir a expressão a uma emoção específica.
theological_decisions:
- issue: Termos de parentesco marcados por gênero
  choice: os pais ... os filhos
  alternative: os pais ... as crianças
  rationale: O hebraico emprega termos masculinos plurais específicos; a tradução os preserva sem generalizá-los.
- issue: Natureza da fraqueza das mãos
  choice: porque suas mãos estão sem forças
  alternative: por causa do pânico
  rationale: A formulação conserva a metáfora física e não decide se a causa deve ser entendida estritamente como medo, desânimo ou incapacidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. “Carros de guerra” evita que “carros” seja entendido como automóveis. A repetição de “ao” preserva o paralelismo das causas sonoras; a conjunção antes do terceiro elemento torna a enumeração natural em português.
