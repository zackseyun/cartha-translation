  text: בָּ֤אָה קָרְחָה֙ אֶל עַזָּ֔ה נִדְמְתָ֥ה אַשְׁקְל֖וֹן שְׁאֵרִ֣ית עִמְקָ֑/ם עַד מָתַ֖י תִּתְגּוֹדָֽדִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/005.yaml
  text: Baldness has come upon Gaza[a]; Ashkelon has been silenced, the remnant of their valley[c][b]. How long will you gash yourself?
translation:
  language: pt
  text: A calvície veio sobre Gaza; Ascalom foi reduzida ao silêncio[a], o remanescente do vale deles[b]. Até quando você fará cortes em si mesma?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Ascalom foi eliminada» ou «Ascalom pereceu». O verbo hebraico pode indicar ser silenciado, reduzido à inatividade ou destruído.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «o remanescente do vale deles». Algumas versões antigas ou uma vocalização diferente dão origem a outras interpretações, entre elas «o remanescente dos anaquins».'
    reason: alternative_reading
  - marker: c
    text: Fazer cortes no próprio corpo era uma prática de luto no antigo Oriente Próximo.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְחָה
  choice: a calvície
  rationale: Preserva a imagem hebraica de calvície como sinal convencional de luto e calamidade, sem transformar a expressão em ação imperativa.
- source_word: בָּאָה ... אֶל עַזָּה
  choice: veio sobre Gaza
  rationale: Expressa a chegada ameaçadora da calamidade contra Gaza; «sobre» comunica melhor essa força contextual do que o neutro «a».
- source_word: נִדְמְתָה
  choice: foi reduzida ao silêncio
  rationale: Conserva a imagem central de ser silenciada ou aquietada e, no contexto de guerra, deixa implícita a possibilidade de ruína, sem escolher de modo indevido apenas um dos sentidos.
- source_word: שְׁאֵרִית
  choice: o remanescente
  rationale: Equivalente corrente e apropriado para aquilo que resta depois da calamidade.
- source_word: עִמְקָם
  choice: do vale deles
  rationale: Representa diretamente o Texto Massorético, que lê o substantivo «vale» com sufixo de terceira pessoa masculina plural, embora haja tradições textuais alternativas.
- source_word: תִּתְגּוֹדָדִי
  choice: você fará cortes em si mesma
  rationale: Reproduz o sentido reflexivo feminino da forma hebraica e indica com clareza a prática de autolaceração ligada ao luto.
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Forma idiomática e tradicional em português para a pergunta hebraica sobre duração.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e as imagens fortes do hebraico foram preservadas. «Foi reduzida ao silêncio» mantém a ambiguidade entre silêncio, cessação e destruição. Os referentes femininos de «você» e «si mesma» retomam a cidade personificada, Ascalom.
