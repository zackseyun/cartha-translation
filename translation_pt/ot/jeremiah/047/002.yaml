base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/002.yaml
  text: 'Thus says the LORD: Behold, waters are rising from the north, and they will become an overflowing torrent; they will overflow the land and its fullness, the city and those who dwell in it. Then mankind will cry out, and every inhabitant of the land will wail.'
translation:
  language: pt
  text: 'Assim diz o SENHOR: “Eis que águas vêm subindo do norte e se tornarão uma torrente transbordante. Inundarão a terra e tudo o que nela há, a cidade e os que nela habitam. As pessoas clamarão, e todos os habitantes da terra lamentarão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes.
- source_word: נַחַל שׁוֹטֵף (naḥal shoteph)
  choice: torrente transbordante
  rationale: Expressa a imagem de um curso de água impetuoso que transborda, mantendo a metáfora da invasão.
- source_word: אֶרֶץ וּמְלוֹאָהּ (’erets umelo’ah)
  choice: a terra e tudo o que nela há
  rationale: Reproduz de modo natural o merismo hebraico, no qual a terra e sua plenitude abrangem tudo o que ela contém.
- source_word: הָאָדָם (ha’adam)
  choice: as pessoas
  rationale: O singular hebraico tem sentido coletivo; a forma plural evita restringi-lo aos homens do sexo masculino e soa natural em português.
- source_word: הֵילִיל (helil)
  choice: lamentarão
  rationale: Comunica o pranto ou lamento intenso indicado pelo verbo hebraico no contexto de calamidade.
theological_decisions: []
