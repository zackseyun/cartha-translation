  text: אֵ֣יךְ תִּשְׁקֹ֔טִי וַֽ/יהוָ֖ה צִוָּה לָ֑/הּ אֶֽל אַשְׁקְל֛וֹן וְ/אֶל ח֥וֹף הַ/יָּ֖ם שָׁ֥ם יְעָדָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/007.yaml
  text: How can you be quiet when Yahweh has commanded it? Against Ashkelon and against the seacoast—there he has appointed it[a][b].
translation:
  language: pt
  text: Como você pode ficar quieta, se Yahweh lhe deu uma ordem?[a] Contra Ascalom e contra o litoral[b] — foi para lá que ele a designou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No hebraico, os pronomes são femininos: “deu uma ordem a ela” e “designou-a”, referindo-se à espada personificada no versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “A Ascalom e à costa do mar”; a preposição indica literalmente direção, embora, neste contexto, implique a missão hostil da espada contra esses lugares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como ... poderia
  rationale: Introduz uma pergunta retórica sobre possibilidade; a construção com “poderia” comunica essa força de modo natural em português.
- source_word: תִּשְׁקֹטִי
  choice: você ... ficar quieta
  rationale: O verbo שׁקט significa ficar quieto, imóvel ou em repouso. O feminino singular retoma a espada personificada do versículo anterior, o que “quieta” torna perceptível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צִוָּה לָהּ
  choice: lhe deu uma ordem
  rationale: Representa o verbo masculino singular e o sufixo feminino singular, cujo referente é a espada, preservando a continuidade da personificação sem produzir uma construção artificial.
- source_word: אֶל אַשְׁקְלוֹן וְאֶל חוֹף הַיָּם
  choice: Contra Ascalom e contra o litoral
  rationale: Embora אֶל indique basicamente direção, o contexto da missão hostil da espada justifica “contra”; חוֹף הַיָּם designa a costa ou o litoral marítimo.
- source_word: שָׁם
  choice: para lá
  rationale: Retoma os destinos recém-mencionados e se integra naturalmente à construção enfática portuguesa “foi para lá que”.
- source_word: יְעָדָהּ
  choice: ele a designou
  rationale: יעד expressa designar ou destinar para uma missão; o objeto feminino singular continua sendo a espada personificada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Referente dos sufixos femininos singulares
  choice: A espada personificada mencionada em Jeremias 47:6
  alternative: Uma força de julgamento não identificada explicitamente
  rationale: A concordância feminina e o contexto imediato apontam para a espada. O português permite preservar essa ligação por meio de “quieta”, “lhe” e “a”.
- issue: Força da preposição אֶל diante dos alvos
  choice: 'Sentido hostil: “contra”'
  alternative: 'Sentido direcional mais literal: “a/para”'
  rationale: A comissão dada à espada implica ação hostil, mas a alternativa direcional legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação da espada é preservada pela concordância feminina. “Litoral” evita a redundância menos natural de “costa do mar”, enquanto a forma mais literal aparece em nota.
