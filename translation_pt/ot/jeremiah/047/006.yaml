  text: ה֗וֹי חֶ֚רֶב לַֽ/יהוָ֔ה עַד אָ֖נָה לֹ֣א תִשְׁקֹ֑טִי הֵאָֽסְפִי֙ אַל תַּעְרֵ֔/ךְ הֵרָגְעִ֖י וָ/דֹֽמִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/006.yaml
  text: Ah, sword of the LORD, how long will you not be quiet? Return to your sheath; rest and be still.
translation:
  language: pt
  text: Ah, espada do SENHOR, até quando você não se aquietará? Recolha-se para dentro da sua bainha; repouse e fique em silêncio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Ah
  rationale: Interjeição de lamento e consternação dirigida à espada; “Ah” preserva o tom sem impor necessariamente a ideia de condenação que “Ai” pode sugerir.
- source_word: חֶרֶב לַיהוָה
  choice: espada do SENHOR
  rationale: Expressa a relação da espada com YHWH e segue a convenção portuguesa de representar o nome divino por “SENHOR” em versaletes.
- source_word: לֹא תִשְׁקֹטִי
  choice: você não se aquietará
  rationale: Mantém a negação e a personificação feminina da espada, com formulação natural em português.
- source_word: הֵאָסְפִי אֶל־תַּעְרֵךְ
  choice: Recolha-se à sua bainha
  rationale: O imperativo passivo/reflexivo tem o sentido de a espada ser recolhida ou recolher-se para dentro da bainha; “recolha-se” preserva essa imagem melhor que uma simples ordem para voltar.
- source_word: הֵרָגְעִי וָדֹמִּי
  choice: repouse e fique em silêncio
  rationale: 'Reproduz os dois imperativos distintos: cessar a agitação e permanecer calada ou imóvel.'
theological_decisions:
- issue: Relação entre a espada e YHWH
  choice: espada do SENHOR
  alternative: espada para o SENHOR
  rationale: O לְ pode indicar posse, associação ou destinação. Neste contexto, “do SENHOR” comunica naturalmente que a espada executa o juízo divino, sem especificar além do que a construção permite.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com personificação feminina coerente com “espada”. A repetição de ordens breves conserva a força poética do hebraico.
