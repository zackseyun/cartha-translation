translation:
  language: pt
  text: Esta é a palavra de Yahweh que veio a Jeremias, o profeta, a respeito dos filisteus[a][b], antes que o faraó ferisse Gaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que veio a Jeremias, o profeta, a respeito dos filisteus”. O hebraico começa com uma construção relativa que funciona como cabeçalho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “contra os filisteus”. A preposição pode introduzir o assunto de um oráculo e, em contextos de juízo, também pode ter sentido adversativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה
  choice: Esta é a palavra de Yahweh que veio
  rationale: A construção relativa hebraica funciona como cabeçalho profético. “Esta é” produz uma abertura natural em português, enquanto “que veio” preserva a fórmula de revelação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: a Jeremias, o profeta
  rationale: אֶל indica o destinatário da palavra; a aposição é explicitada com pontuação natural em português.
- source_word: אֶל פְּלִשְׁתִּים
  choice: a respeito dos filisteus
  rationale: Em títulos proféticos, אֶל pode indicar o assunto ou alvo do oráculo. A formulação escolhida mantém essa amplitude sem impor de imediato o sentido adversativo.
- source_word: בְּטֶרֶם
  choice: antes que
  rationale: Expressa de modo idiomático a relação temporal anterior no português.
- source_word: יַכֶּה
  choice: atacasse
  rationale: O hifil de נכה pode significar golpear ou atacar. Referido a uma cidade, “atacasse” é natural e evita a imagem pouco idiomática de golpear fisicamente Gaza.
- source_word: פַרְעֹה אֶת עַזָּה
  choice: o faraó atacasse Gaza
  rationale: Emprega as formas portuguesas correntes do título real e do topônimo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal divino sem convertê-lo em título.
- issue: Sentido de אֶל diante de “filisteus”
  choice: a respeito dos filisteus
  alternative: contra os filisteus
  rationale: Embora o contexto posterior seja de juízo, a preposição em um cabeçalho de oráculo pode introduzir de maneira mais ampla seu tema ou destinatário. A alternativa adversativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe explicita a função de cabeçalho do versículo sem apagar a forma relativa do hebraico, registrada em nota.
