id: JER.47.4
reference: Jeremiah 47:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל הַ/יּ֗וֹם הַ/בָּא֙ לִ/שְׁד֣וֹד אֶת כָּל פְּלִשְׁתִּ֔ים לְ/הַכְרִ֤ית לְ/צֹר֙ וּ/לְ/צִיד֔וֹן כֹּ֖ל שָׂרִ֣יד עֹזֵ֑ר כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת פְּלִשְׁתִּ֔ים שְׁאֵרִ֖ית אִ֥י כַפְתּֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/004.yaml
  text: because of the day that is coming to devastate all the Philistines[a], to cut off from Tyre and Sidon every surviving helper. For Yahweh is devastating the Philistines, the remnant of the island of Caphtor.
translation:
  language: pt
  text: por causa do dia que vem para devastar todos os filisteus e eliminar de Tiro e Sidom todo ajudador sobrevivente. Pois Yahweh está devastando os filisteus, o remanescente do litoral[a] de Caftor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilha”.
    reason: Preserva a ambiguidade lexical de אִי, que pode designar uma ilha ou uma região costeira.
lexical_decisions:
- source_word: עַל הַיּוֹם הַבָּא
  choice: por causa do dia que vem
  rationale: O uso de עַל é causal neste contexto, e a formulação preserva a força participial de הַבָּא de maneira natural em português.
- source_word: לִשְׁדֹד / שֹׁדֵד
  choice: devastar / está devastando
  rationale: שׁדד descreve despojo violento ou devastação. A mesma raiz é vertida de modo coerente, e o particípio é expresso como ação vívida em curso.
- source_word: אֶת כָּל פְּלִשְׁתִּים
  choice: todos os filisteus
  rationale: O hebraico emprega o nome plural do povo, não o nome da terra da Filístia.
- source_word: לְהַכְרִית
  choice: eliminar
  rationale: הכרית significa literalmente cortar fora e, neste contexto de juízo, comunica a supressão total dos ajudadores em português corrente.
- source_word: לְצֹר וּלְצִידוֹן
  choice: de Tiro e Sidom
  rationale: 'Com לְהַכְרִית, a relação é entendida como separação: os ajudadores que restavam são eliminados de Tiro e Sidom.'
- source_word: כֹּל שָׂרִיד עֹזֵר
  choice: todo ajudador sobrevivente
  rationale: 'Mantém os dois elementos da expressão hebraica: שָׂרִיד, sobrevivente ou remanescente, e עֹזֵר, aquele que ajuda.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁאֵרִית אִי כַפְתּוֹר
  choice: o remanescente do litoral de Caftor
  rationale: שְׁאֵרִית é remanescente, e אִי pode designar ilha ou região costeira. “Litoral” evita impor uma precisão geográfica que o hebraico não exige.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido geográfico de אִי em אִי כַפְתּוֹר
  choice: litoral
  alternative: ilha
  rationale: Ambos os sentidos pertencem ao alcance lexical de אִי. O texto principal usa a opção geograficamente menos restritiva e registra a alternativa genuína em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi mantida próxima à estrutura hebraica, e o nome divino aparece como Yahweh.
