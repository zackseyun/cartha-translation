  text: הַ/דּ֣וּד אֶחָ֗ד תְּאֵנִים֙ טֹב֣וֹת מְאֹ֔ד כִּ/תְאֵנֵ֖י הַ/בַּכֻּר֑וֹת וְ/הַ/דּ֣וּד אֶחָ֗ד תְּאֵנִים֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵֽאָכַ֖לְנָה מֵ/רֹֽעַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/002.yaml
  text: One basket had very good figs[a], like first-ripe figs, and one basket had very bad figs[b], which could not be eaten because of their badness.
translation:
  language: pt
  text: Um cesto tinha figos muito bons, como os figos que amadurecem primeiro[a]; o outro cesto tinha figos muito ruins, que não podiam ser comidos de tão ruins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como os figos precoces” ou “como os figos da primeira colheita”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “que não podiam ser comidos por causa da ruindade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּד
  choice: cesto
  rationale: Embora o substantivo possa designar outros tipos de recipiente, o contexto de figos colocados diante do templo favorece “cesto”.
- source_word: אֶחָד ... אֶחָד
  choice: um ... o outro
  rationale: Expressa em português natural a contraposição hebraica entre os dois recipientes sem perder sua individualização.
- source_word: תְּאֵנִים
  choice: figos
  rationale: Equivalente direto do fruto mencionado na visão.
- source_word: טֹבוֹת מְאֹד
  choice: muito bons
  rationale: Preserva o adjetivo e o intensificador em linguagem corrente.
- source_word: כִּתְאֵנֵי הַבַּכֻּרוֹת
  choice: como os figos que amadurecem primeiro
  rationale: Comunica o sentido temporal dos primeiros figos maduros da estação sem acrescentar explicitamente uma avaliação não lexicalizada.
- source_word: רָעוֹת מְאֹד
  choice: muito ruins
  rationale: Mantém o contraste direto e enfático com “muito bons”.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: que não podiam ser comidos de tão ruins
  rationale: Reproduz de modo idiomático a impossibilidade de comê-los em razão de sua condição ruim, sem especificar se estavam podres ou tinham outro defeito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Um ... o outro” evita a repetição pouco natural de “um cesto ... um cesto”; “de tão ruins” mantém a força causal do hebraico em expressão corrente. Todos os marcadores de nota aparecem no texto.
