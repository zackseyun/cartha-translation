base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/006.yaml
  text: I will set my eyes on them for good[a], and I will bring them back to this land. I will build them up and not tear them down[c][b]; I will plant them and not uproot them.
translation:
  language: pt
  text: Porei os meus olhos sobre eles para o bem deles[a] e os farei voltar a esta terra[b]. Eu os edificarei e não os derrubarei; eu os plantarei e não os arrancarei pela raiz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em favor deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu os trarei de volta a esta terra”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega dois pares de metáforas de restauração: “edificar... não derrubar” e “plantar... não arrancar pela raiz”.'
    reason: cross_reference
lexical_decisions:
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Porei os meus olhos sobre eles
  rationale: Preserva a imagem concreta do idioma hebraico e, em português, comunica atenção deliberada; a expressão seguinte esclarece que essa atenção é benevolente.
- source_word: לְטוֹבָה
  choice: para o bem
  rationale: Expressa finalidade ou resultado favorável sem explicitar além do hebraico de quem é o bem; no contexto, trata-se naturalmente do bem deles.
- source_word: וַהֲשִׁבֹתִים עַל הָאָרֶץ הַזֹּאת
  choice: e os farei voltar a esta terra
  rationale: O hifil de שוב indica causar o retorno, e a construção com a terra tem sentido direcional. A formulação mantém explícito o retorno geográfico do exílio.
- source_word: וּבְנִיתִים וְלֹא אֶהֱרֹס
  choice: Eu os edificarei e não os derrubarei
  rationale: Mantém o par metafórico construir/derrubar aplicado ao povo. 'Edificarei' é digno e compreensível, sem transformar a metáfora em explicação abstrata.
- source_word: וּנְטַעְתִּים וְלֹא אֶתּוֹשׁ
  choice: eu os plantarei e não os arrancarei pela raiz
  rationale: Preserva a metáfora agrícola. 'Arrancar pela raiz' torna explícita em português corrente a força de נתש e forma contraste natural com 'plantar'.
theological_decisions:
- issue: Linguagem de restauração no contexto de juízo e salvação da aliança
  choice: Apresentar uma promessa concreta de atenção favorável, retorno à terra e estabilidade, conservando as metáforas de edificar e plantar.
  alternative: Interpretar a promessa como prosperidade genérica ou como restauração exclusivamente espiritual.
  rationale: O contexto imediato trata dos exilados e de seu retorno à terra. A tradução mantém essa referência histórica sem restringir possíveis implicações teológicas posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. As metáforas hebraicas foram preservadas; 'fazer voltar' explicita o sentido causativo e espacial sem espiritualizar a promessa.
