  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ יִרְמְיָ֔הוּ וָ/אֹמַ֖ר תְּאֵנִ֑ים הַ/תְּאֵנִ֤ים הַ/טֹּבוֹת֙ טֹב֣וֹת מְאֹ֔ד וְ/הָֽ/רָעוֹת֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/003.yaml
  text: Then Yahweh said to me[a], “What do you see, Jeremiah?” And I said, “Figs—the good figs are very good, and the bad figs are very bad, so bad that they cannot be eaten.”
translation:
  language: pt
  text: 'Então Yahweh me disse: “O que você vê, Jeremias?” Respondi: “Figos. Os figos bons são muito bons, e os ruins são muito ruins, tão ruins que não podem ser comidos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que não podem ser comidos por serem ruins demais”.'
    reason: A expressão מֵרֹעַ pode ser entendida em termos de grau (“tão ruins”) ou de causa (“por serem ruins demais”); a nota preserva essa nuance lexical.
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוָה אֵלַי
  choice: Então Yahweh me perguntou
  rationale: O waw consecutivo faz a narrativa avançar, daí “Então”. Embora אָמַר signifique literalmente “dizer”, o conteúdo interrogativo torna “perguntou” natural em português. O nome divino é transliterado como “Yahweh”.
- source_word: מָה אַתָּה רֹאֶה
  choice: O que você vê
  rationale: Traduz de modo corrente a construção participial, mantendo o caráter imediato da visão. “Você” oferece ampla legibilidade brasileira sem perda de dignidade.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: תְּאֵנִים
  choice: Figos
  rationale: Identifica diretamente, no plural, o que Jeremias vê.
- source_word: הַתְּאֵנִים הַטֹּבוֹת טֹבוֹת מְאֹד
  choice: Os figos bons são muito bons
  rationale: Mantém a repetição enfática de “bons” presente no hebraico, em construção natural em português.
- source_word: וְהָרָעוֹת רָעוֹת מְאֹד
  choice: e os ruins são muito ruins
  rationale: Neste contexto, רָעוֹת indica a péssima qualidade dos figos, não maldade moral. A elipse de “figos” na segunda ocorrência é clara e natural em português.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: tão ruins que não podem ser comidos
  rationale: 'Expressa idiomaticamente a relação de grau ou causa: a condição dos figos é tão ruim que eles são impróprios para consumo, sem especificar “podres”, ideia não explicitada no hebraico.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição enfática do hebraico foi preservada; a fala foi pontuada de modo natural, e nenhuma explicação simbólica dos figos foi antecipada no versículo.
