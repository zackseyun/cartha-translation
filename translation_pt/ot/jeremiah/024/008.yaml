  text: וְ/כַ/תְּאֵנִים֙ הָֽ/רָע֔וֹת אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹ֑עַ כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֤ה וְ/אֶת שָׂרָי/ו֙ וְ/אֵ֣ת שְׁאֵרִ֣ית יְרוּשָׁלִַ֗ם הַ/נִּשְׁאָרִים֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/הַ/יֹּשְׁבִ֖ים בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/008.yaml
  text: 'But like the bad figs that cannot be eaten because they are so bad[a], thus says Yahweh: so I will make Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those who dwell in the land of Egypt.'
translation:
  language: pt
  text: 'Mas, como os figos ruins, que não podem ser comidos de tão ruins, assim diz Yahweh: assim farei[a] com Zedequias, rei de Judá, com seus oficiais, com o remanescente de Jerusalém — os que restam nesta terra — e com os que vivem na terra do Egito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “assim darei Zedequias...”. O hebraico usa “dar”; a comparação com os figos ruins fornece o sentido de fazer com essas pessoas o que corresponde à imagem ou de tratá-las de acordo com ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתְּאֵנִים הָרָעוֹת
  choice: Mas, como os figos ruins
  rationale: “Mas” mantém o contraste com os figos bons do versículo anterior; “como” preserva a comparação, e “ruins” descreve naturalmente a qualidade dos frutos sem moralizar indevidamente a imagem.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: que não podem ser comidos de tão ruins
  rationale: 'Expressa de modo idiomático a consequência ou causa indicada pelo hebraico: a extrema má qualidade dos figos os torna impróprios para consumo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כֵּן אֶתֵּן
  choice: assim farei com
  rationale: 'O verbo נתן significa literalmente “dar”, mas aqui a comparação anterior fornece o complemento implícito: Yahweh fará com essas pessoas o correspondente ao que representam os figos ruins. A formulação portuguesa torna a frase completa sem antecipar os castigos descritos nos versículos seguintes.'
- source_word: שָׂרָיו
  choice: seus oficiais
  rationale: Refere-se aos dirigentes ou membros da administração real; “oficiais” é atual e adequado ao contexto político.
- source_word: שְׁאֵרִית יְרוּשָׁלִַם
  choice: o remanescente de Jerusalém
  rationale: Preserva o termo profético tradicional e sua ressonância, mantendo-se compreensível em português.
- source_word: הַנִּשְׁאָרִים בָּאָרֶץ הַזֹּאת
  choice: que ficou nesta terra
  rationale: O singular concorda naturalmente com o substantivo coletivo “remanescente” e indica os que permaneceram em Judá.
- source_word: וְהַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: e com os que vivem na terra do Egito
  rationale: Traduz o particípio como situação contínua e conserva a expressão hebraica “terra do Egito”.
theological_decisions:
- issue: Sentido da fórmula de juízo כֵּן אֶתֵּן na comparação com os figos ruins
  choice: assim farei com
  alternative: assim entregarei; literalmente, assim darei
  rationale: A formulação mantém a correspondência com os figos ruins e deixa que os versículos seguintes expliquem o juízo, sem especificar prematuramente a quem essas pessoas seriam entregues. A nota registra a forma literal e a elipse do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “assim” preserva a estrutura enfática do hebraico. O nome divino é transliterado como “Yahweh”.
