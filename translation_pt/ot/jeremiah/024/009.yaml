  text: וּ/נְתַתִּי/ם֙ ל/זועה לְ/רָעָ֔ה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ לְ/חֶרְפָּ֤ה וּ/לְ/מָשָׁל֙ לִ/שְׁנִינָ֣ה וְ/לִ/קְלָלָ֔ה בְּ/כָל הַ/מְּקֹמ֖וֹת אֲשֶֽׁר אַדִּיחֵ֥/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/009.yaml
  text: I will make them a horror[a], a calamity, to all the kingdoms of the earth—a reproach, a proverb, a taunt[c][b], and a curse in all the places where I drive them.
translation:
  language: pt
  text: Eu farei deles um horror, uma calamidade para todos os reinos da terra — objeto de afronta, provérbio[b], zombaria e maldição em todos os lugares para onde eu os expulsar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Aqui, “provérbio” pode ter o sentido de “dito depreciativo” repetido a respeito deles.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “eu os desterrar”. O verbo pode significar expulsar ou desterrar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: Eu os farei
  rationale: Com a sequência predicativa introduzida por ל, נתן expressa a condição em que Deus os fará ficar; esta formulação é natural e preserva a força causativa.
- source_word: לְזַוֲעָה
  choice: motivo de horror
  rationale: O substantivo indica aquilo que causa horror ou faz estremecer; a expressão explicita que eles se tornarão objeto dessa reação.
- source_word: לְרָעָה
  choice: de desgraça
  rationale: Neste contexto de juízo e exílio, רעה denota calamidade ou desgraça. A coordenação com 'motivo de horror' preserva a série predicativa sem reduzir o termo a maldade moral.
- source_word: לְכָל מַמְלְכוֹת הָאָרֶץ
  choice: para todos os reinos da terra
  rationale: Mantém o alcance universal e apresenta os reinos como aqueles perante os quais Judá se tornará notório.
- source_word: לְחֶרְפָּה
  choice: objeto de afronta
  rationale: חרפה denota desonra, opróbrio ou afronta; a formulação nominal mantém a condição pública de vergonha.
- source_word: וּלְמָשָׁל
  choice: provérbio
  rationale: משל pode designar um provérbio ou dito repetido; no contexto, trata-se de uma expressão proverbial depreciativa, nuance indicada em nota.
- source_word: לִשְׁנִינָה
  choice: zombaria
  rationale: O substantivo raro se refere à fala hostil e escarnecedora; 'zombaria' é claro, corrente e distinto de 'provérbio'.
- source_word: וְלִקְלָלָה
  choice: maldição
  rationale: קללה designa maldição e pode implicar que o destino deles será citado em fórmulas de maldição.
- source_word: בְּכָל הַמְּקֹמוֹת
  choice: em todos os lugares
  rationale: Tradução locativa direta, que conserva a abrangência do hebraico.
- source_word: אֲשֶׁר אַדִּיחֵם שָׁם
  choice: para onde eu os expulsar
  rationale: O hifil de נדח comunica afastamento forçado ou banimento. 'Expulsar' preserva a ação divina vigorosa sem especificar além do texto o modo da dispersão.
theological_decisions:
- issue: Natureza da fórmula de juízo
  choice: Preservar a sequência de condições e resultados do juízo divino em uma lista cumulativa.
  alternative: 'Resumir a sequência como uma única consequência, por exemplo: ''farei deles uma calamidade entre todos os reinos''.'
  rationale: A repetição hebraica da preposição ל acumula imagens de horror, desonra, escárnio e maldição. Manter a enumeração conserva a intensidade retórica e evita acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'motivo de horror e de desgraça' evita a expressão pouco natural 'um horror, uma calamidade' sem perder a estrutura predicativa. Travessão empregado para marcar a expansão cumulativa da sentença.
