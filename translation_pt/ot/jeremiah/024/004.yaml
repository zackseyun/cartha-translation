  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética ויהי דבר־יהוה אלי, «a palavra de Yahweh veio a mim» é a expressão idiomática e tradicional em português, mais natural do que uma tradução rígida com «foi» ou «aconteceu».
- source_word: דְבַר
  choice: palavra
  rationale: «Palavra» mantém a correspondência lexical e o registro profético da fórmula recorrente, sem reduzir o termo apenas a «mensagem».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Reproduz de modo direto e natural a preposição com o sufixo de primeira pessoa.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a fala direta apresentada no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal divino sem substituí-lo pelo título tradicional «SENHOR»; «Jeová» representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com formulação profética tradicional. «Então» expressa naturalmente o וַ־ narrativo no contexto, e os dois-pontos indicam que a fala continua no versículo seguinte.
