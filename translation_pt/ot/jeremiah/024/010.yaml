base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/010.yaml
  text: And I will send against them the sword[a], the famine, and the pestilence, until they are consumed from the land that I gave to them and to their fathers.
translation:
  language: pt
  text: E enviarei contra eles a espada, a fome e a peste[a], até que sejam eliminados da terra que dei a eles e a seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “doença epidêmica”.'
    reason: דֶּבֶר pode referir-se mais amplamente a uma enfermidade epidêmica.
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי בָם
  choice: E enviarei contra eles
  rationale: O piel de שׁלח com בָם apresenta os agentes de juízo como enviados em direção hostil; “contra eles” expressa essa força com naturalidade.
- source_word: הַחֶרֶב
  choice: a espada
  rationale: Mantém a imagem concreta hebraica, que neste contexto também funciona como metonímia de guerra e morte violenta.
- source_word: הָרָעָב
  choice: a fome
  rationale: Em português bíblico corrente, “fome” designa tanto a privação quanto a calamidade coletiva; aqui o contexto deixa claro o sentido de escassez generalizada.
- source_word: הַדָּבֶר
  choice: a peste
  rationale: דֶּבֶר designa enfermidade epidêmica no tríplice juízo profético; “peste” é a correspondência portuguesa tradicional, clara e abrangente.
- source_word: עַד תֻּמָּם
  choice: até que sejam exterminados
  rationale: A forma de תמם indica que serão levados ao fim. “Sejam exterminados” comunica o resultado destrutivo neste contexto sem a estranheza de uma tradução mecânica.
- source_word: מֵעַל הָאֲדָמָה
  choice: da terra
  rationale: Embora מֵעַל seja literalmente “de sobre”, “da terra” expressa de modo natural em português a remoção completa do território dado por Deus.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם וְלַאֲבוֹתֵיהֶם
  choice: que dei a eles e a seus pais
  rationale: Preserva os dois objetos indiretos e mantém “pais” para אֲבוֹתֵיהֶם, refletindo a referência histórica às gerações anteriores no contexto da dádiva da terra.
theological_decisions:
- issue: Linguagem da dádiva pactual da terra
  choice: a terra que dei a eles e a seus pais
  alternative: a terra que dei a eles e a seus antepassados
  rationale: “Pais” conserva a formulação histórica específica do hebraico e a continuidade geracional da dádiva, sem generalizar o referente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva a tríade profética tradicional “espada, fome e peste” e a agência divina explícita.
