  terminology: “Espada, fome e peste” é uma tríade profética portuguesa estabelecida e adequada. “Pais” preserva de modo fonte-orientado אֲבוֹתֵיהֶם; a nota lexical assinala que “peste” pode ser entendida de modo mais amplo como doença epidêmica.
