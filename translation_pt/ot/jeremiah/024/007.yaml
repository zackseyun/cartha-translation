    issue: Infinitivos sem flexão em «para me conhecer, para saber».
    rationale: Em português, após «eu lhes darei», o sujeito implícito das ações é o destinatário plural. Os infinitivos pessoais «conhecerem» e «saberem» removem a ambiguidade sintática e tornam a formulação mais natural, sem alterar o sentido.
  revised_text: E eu lhes darei um coração para me conhecerem, para saberem que eu sou Yahweh; eles serão o meu povo, e eu serei o seu Deus, pois voltarão para mim de todo o coração.
