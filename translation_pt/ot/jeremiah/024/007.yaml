- from: E eu lhes darei um coração para me conhecer, para saber que eu sou Yahweh; eles serão o meu povo, e eu serei o seu Deus, pois voltarão para mim de todo o coração.
  to: E eu lhes darei um coração para me conhecerem, para saberem que eu sou Yahweh; eles serão o meu povo, e eu serei o seu Deus, pois voltarão para mim de todo o coração.
  rationale: A revisão limita-se à flexão dos infinitivos para explicitar o sujeito plural implícito e melhorar a fluência portuguesa. Mantêm-se a estrutura, a ambiguidade moderada da relação entre conhecer Yahweh e saber que ele é Yahweh, a fórmula da aliança e o valor causal plausível de כִּי na oração final.
