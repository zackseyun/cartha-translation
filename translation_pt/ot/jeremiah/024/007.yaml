base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/007.yaml
  text: And I will give them a heart to know me[a], that I am Yahweh; and they will be my people, and I will be their God[b], for they will return to me with all their heart.
translation:
  language: pt
  text: E eu lhes darei um coração para me conhecerem, para saberem que eu sou Yahweh; eles serão o meu povo, e eu serei o seu Deus, pois voltarão para mim de todo o coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E eu lhes darei
  rationale: O perfeito qal com a conjunção, no discurso profético, expressa uma promessa futura e dá continuidade à sequência do texto.
- source_word: לֵב לָדַעַת אֹתִי
  choice: um coração para me conhecer
  rationale: Preserva a metáfora hebraica do coração como o ser interior, incluindo entendimento e vontade, e mantém o caráter relacional de conhecer a Deus.
- source_word: כִּי אֲנִי יְהוָה
  choice: para saber que eu sou Yahweh
  rationale: Aqui כִּי pode introduzir o conteúdo do conhecimento. A breve explicitação «para saber» torna natural em português a relação com «me conhecer», sem reduzir uma expressão à outra; o nome divino é transliterado como Yahweh.
- source_word: וְהָיוּ לִי לְעָם
  choice: eles serão o meu povo
  rationale: Mantém em forma idiomática a fórmula de aliança e a relação de pertencimento expressa pelo hebraico.
- source_word: וְאָנֹכִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: e eu serei o seu Deus
  rationale: Preserva a metade recíproca da fórmula de aliança em português natural.
- source_word: כִּי יָשֻׁבוּ אֵלַי
  choice: pois voltarão para mim
  rationale: שׁוּב indica retorno ou volta, e כִּי tem aqui valor causal plausível; «voltarão para mim» mantém explícito o movimento de restauração da relação.
- source_word: בְּכָל לִבָּם
  choice: de todo o coração
  rationale: É a expressão portuguesa natural que preserva o sentido hebraico de inteireza da pessoa interior.
theological_decisions:
- issue: Fórmula da aliança
  choice: Manter «eles serão o meu povo, e eu serei o seu Deus».
  alternative: Parafrasear apenas como pertencimento mútuo.
  rationale: A formulação hebraica é central à teologia de Jeremias e deve conservar sua continuidade literária e teológica.
- issue: Natureza de «conhecer» a Deus
  choice: Traduzir literalmente como «me conhecer», seguido do conteúdo «que eu sou Yahweh».
  alternative: Traduzir como «me reconhecer» ou limitar a frase a compreensão intelectual.
  rationale: A expressão comporta conhecimento relacional e pactual, não apenas reconhecimento mental; a tradução mantém essa profundidade sem acrescentar uma interpretação doutrinária.
- issue: Relação sintática de כִּי אֲנִי יְהוָה
  choice: 'Entender כִּי como introdutor do conteúdo do conhecimento: «para saber que eu sou Yahweh».'
  alternative: 'Entender causalmente: «porque eu sou Yahweh».'
  rationale: A leitura de conteúdo se ajusta bem a לָדַעַת, embora a relação exata permita alguma tensão; a redação adotada evita sugerir que «conhecer-me» e saber a identidade divina sejam ideias desconectadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém «coração» e a fórmula da aliança por sua importância imagética e intertextual. Emprega «Yahweh» para o tetragrama, em coerência com a decisão lexical indicada nos dados do projeto.
