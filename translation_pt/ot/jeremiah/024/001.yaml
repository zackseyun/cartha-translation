  naturalness: O registro é moderno e apropriado. «Eis que», «cestos», «autoridades», «artesãos» e «ferreiros» são escolhas naturais. A revisão simplifica a construção inicial e formula a deportação de modo mais fluente, sem perder a sequência histórica.
  terminology: «Yahweh» reproduz consistentemente o Tetragrama. «Jeconias», «Joaquim», «Judá», «Babilônia», «autoridades», «artesãos» e «ferreiros» são adequados. «Nabucodonosor» é a forma portuguesa corrente e reconhecível, embora o hebraico deste livro apresente uma forma mais próxima de «Nabucadrezar».
