source:
  edition: WLC
  text: הִרְאַ/נִי֮ יְהוָה֒ וְ/הִנֵּ֗ה שְׁנֵי֙ דּוּדָאֵ֣י תְאֵנִ֔ים מוּעָדִ֕ים לִ/פְנֵ֖י הֵיכַ֣ל יְהוָ֑ה אַחֲרֵ֣י הַגְל֣וֹת נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֡ל אֶת יְכָנְיָ֣הוּ בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָה֩ וְ/אֶת שָׂרֵ֨י יְהוּדָ֜ה וְ/אֶת הֶ/חָרָ֤שׁ וְ/אֶת הַ/מַּסְגֵּר֙ מִ/יר֣וּשָׁלִַ֔ם וַ/יְבִאֵ֖/ם בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/001.yaml
  text: Yahweh showed me[a], and behold, two baskets of figs were set before the temple of Yahweh, after Nebuchadrezzar king of Babylon had taken into exile Jeconiah son of Jehoiakim, king of Judah, along with the officials of Judah, the craftsmen, and the smiths from Jerusalem[c][b], and had brought them to Babylon.
translation:
  language: pt
  text: Yahweh mostrou-me, e eis que dois cestos de figos estavam colocados diante do templo de Yahweh, depois que Nabucodonosor, rei da Babilônia, levou para o exílio, de Jerusalém para a Babilônia, Jeconias, filho de Joaquim, rei de Judá, juntamente com as autoridades de Judá[a], os artesãos e os ferreiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os príncipes de Judá”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os trabalhadores em metal”. Os dois termos hebraicos parecem designar grupos de trabalhadores especializados levados para o exílio.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאַנִי
  choice: mostrou-me isto
  rationale: O hifil de ראה significa “mostrar” ou “fazer ver”. O pronome “isto”, implícito pelo contexto da visão que se segue, torna a construção natural em português sem acrescentar conteúdo específico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a apresentação vívida e repentina da cena visionária.
- source_word: שְׁנֵי דּוּדָאֵי תְאֵנִים
  choice: dois cestos de figos
  rationale: דּוּד pode designar um recipiente ou cesto; no contexto de figos, “cestos” é a opção portuguesa mais natural.
- source_word: מוּעָדִים
  choice: estavam colocados
  rationale: O particípio passivo indica que os cestos haviam sido postos ou posicionados diante do templo.
- source_word: הֵיכַל יְהוָה
  choice: templo de Yahweh
  rationale: הֵיכָל designa aqui o edifício do templo; a expressão mantém o nome divino.
- source_word: אַחֲרֵי הַגְלוֹת
  choice: depois que ... levou para o exílio
  rationale: Expressa com clareza a ação anterior e o caráter forçado da deportação.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome do rei babilônico.
- source_word: יְכָנְיָהוּ
  choice: Jeconias
  rationale: Forma portuguesa consagrada para esta variante do nome do rei de Judá.
- source_word: שָׂרֵי יְהוּדָה
  choice: as autoridades de Judá
  rationale: שָׂרִים refere-se a pessoas em posição de governo; “autoridades” evita sugerir necessariamente filhos do rei.
- source_word: הֶחָרָשׁ
  choice: os artesãos
  rationale: O substantivo singular coletivo designa uma classe de trabalhadores especializados, vertida naturalmente pelo plural em português.
- source_word: הַמַּסְגֵּר
  choice: os ferreiros
  rationale: O termo provavelmente designa trabalhadores que lidavam com metais, embora sua especialização exata seja incerta.
- source_word: מִירוּשָׁלִַם וַיְבִאֵם בָּבֶל
  choice: tirando-os de Jerusalém, e os levou para a Babilônia
  rationale: Torna explícita em português a ligação sintática dos grupos deportados com Jerusalém e preserva a afirmação de que foram conduzidos à Babilônia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” preserva esse nome em vez de substituí-lo pelo título tradicional.
- issue: Sentido de שָׂרֵי יְהוּדָה
  choice: autoridades de Judá
  alternative: príncipes de Judá
  rationale: O termo pode indicar príncipes ou altos oficiais. “Autoridades” preserva o sentido governamental sem restringi-lo a membros da família real.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa clara. “Eis que” mantém a vivacidade profética sem tornar o restante do versículo excessivamente arcaico. Os nomes próprios seguem formas reconhecíveis em português.
