  naturalness: «Assim diz Javé» e o restante da redação são naturais em português moderno. «Considerarei com favor» é compreensível, mas «olharei com favor» é mais idiomático quando o sentido é uma disposição favorável para com pessoas. A construção final «para o bem» é concisa, natural no registro bíblico e evita explicitar indevidamente «deles».
  terminology: «Javé», «Deus de Israel», «exilados de Judá» e «terra dos caldeus» são escolhas consistentes e adequadas. «Exilados» é especialmente justificado pela oração relativa pessoal «que enviei».
