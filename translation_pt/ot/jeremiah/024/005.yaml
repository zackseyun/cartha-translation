revisions:
- from: 'Assim diz Javé, o Deus de Israel: “Como estes figos bons, assim também considerarei com favor[b] os exilados de Judá[a], que enviei deste lugar para a terra dos caldeus.”'
  to: 'Assim diz Javé, o Deus de Israel: “Como estes bons figos, assim olharei com favor[b] os exilados de Judá[a], que enviei deste lugar para a terra dos caldeus, para o bem.”'
  rationale: A revisão mantém a leitura pessoal de «os exilados de Judá», mas restitui explicitamente o valor de לְטוֹבָה como «para o bem». «Olharei com favor» exprime de forma idiomática em português o valor contextual de אַכִּיר, enquanto a posição final de «para o bem» e a nota preservam a concisão e o beneficiário não expresso no hebraico.
