source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/תְּאֵנִ֥ים הַ/טֹּב֖וֹת הָ/אֵ֑לֶּה כֵּֽן אַכִּ֞יר אֶת גָּל֣וּת יְהוּדָ֗ה אֲשֶׁ֨ר שִׁלַּ֜חְתִּי מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה אֶ֥רֶץ כַּשְׂדִּ֖ים לְ/טוֹבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/005.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Like these good figs, so I will regard the exiles of Judah, whom I sent away from this place to the land of the Chaldeans[b], for good.'
translation:
  language: pt
  text: 'Assim diz Javé, o Deus de Israel: “Como estes bons figos, assim olharei com favor[b] os exilados de Judá[a], que enviei deste lugar para a terra dos caldeus, para o bem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o exílio de Judá” ou “o cativeiro de Judá”. O termo hebraico pode indicar tanto as pessoas exiladas como a condição ou o acontecimento do exílio; aqui, “que enviei” favorece o sentido pessoal.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “para o bem”. O hebraico não explicita o beneficiário; o contexto sugere os exilados.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, preservando o nome pessoal presente no hebraico em vez de substituí-lo por um título.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética concisa e solene, natural em português e próxima da estrutura hebraica.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reprodução direta da construção hebraica e de sua identificação pactual.
- source_word: כַּתְּאֵנִים הַטֹּבוֹת הָאֵלֶּה ... כֵּן
  choice: Como estes figos bons, assim também
  rationale: Mantém a correlação comparativa explícita do hebraico e liga a interpretação à visão precedente.
- source_word: אַכִּיר
  choice: considerarei
  rationale: Neste contexto, o hifil de נכר expressa avaliação ou reconhecimento favorável, não apenas identificação mental.
- source_word: גָּלוּת יְהוּדָה
  choice: os exilados de Judá
  rationale: O substantivo pode designar o exílio ou coletivamente as pessoas exiladas; a oração relativa com referência pessoal favorece aqui o sentido de grupo humano.
- source_word: שִׁלַּחְתִּי
  choice: enviei
  rationale: Preserva de modo sóbrio a agência divina afirmada no texto, sem impor o termo político mais técnico 'deportei'.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: deste lugar
  rationale: Forma direta e idiomática que mantém o ponto de referência local do original.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: para a terra dos caldeus
  rationale: Conserva a designação etnogeográfica do hebraico, sem substituí-la por 'Babilônia'.
- source_word: לְטוֹבָה
  choice: com favor
  rationale: A expressão literal 'para o bem' pode ligar-se ao modo como Deus considera os exilados e, possivelmente, ao propósito de tê-los enviado; 'com favor' comunica a leitura contextual principal sem apagar a alternativa, registrada em nota.
theological_decisions:
- issue: Referente de גָּלוּת יְהוּדָה
  choice: os exilados de Judá
  alternative: o exílio de Judá; o cativeiro de Judá
  rationale: A comparação com os figos bons e a oração 'que enviei' apontam mais naturalmente para as pessoas exiladas, embora o substantivo hebraico também possa designar a condição ou o acontecimento do exílio.
- issue: Relação sintática e nuance de לְטוֹבָה
  choice: considerarei com favor
  alternative: enviei para o bem deles; considerarei para o bem
  rationale: A expressão pode caracterizar o reconhecimento favorável de Deus ou indicar o propósito benéfico do envio. A tradução adota a ligação contextualmente forte com אַכִּיר, enquanto a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formulação profética solene sem arcaísmos. A ordem foi ajustada para a fluidez do português, mantendo a comparação e a agência divina. As notas preservam as ambiguidades lexical e sintática relevantes.
