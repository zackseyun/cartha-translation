source:
  edition: WLC
  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
translation:
  language: pt
  text: Então, a espada que vocês temem os alcançará ali, na terra do Egito, e a fome que os preocupa os seguirá de perto ali no Egito[a]; e ali vocês morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “se apegará atrás de vocês”, imagem de uma perseguição implacável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Então, ...
  rationale: Introduz de modo natural a consequência da advertência anterior, preservando a força preditiva da construção hebraica.
- source_word: הַחֶרֶב
  choice: a espada
  rationale: Mantém a imagem profética concreta, que no contexto pode representar morte violenta pela guerra.
- source_word: יְרֵאִים מִמֶּנָּה
  choice: que vocês temem
  rationale: Equivalente direto e natural de ירא com מן, sem intensificar indevidamente o sentido.
- source_word: תַּשִּׂיג אֶתְכֶם
  choice: os alcançará
  rationale: O hifil de נשׂג indica alcançar ou apanhar alguém em perseguição; a formulação comunica a inevitabilidade da ameaça.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ali, na terra do Egito
  rationale: Conserva tanto שָׁם quanto a designação geográfica completa, enfatizando que o próprio lugar procurado como refúgio será o lugar do juízo.
- source_word: הָרָעָב
  choice: a fome
  rationale: Em português bíblico corrente, 'fome' designa naturalmente a escassez coletiva e preserva o termo concreto do juízo profético.
- source_word: דֹּאֲגִים מִמֶּנּוּ
  choice: que os deixa preocupados
  rationale: דאג expressa inquietação ou preocupação ansiosa; a formulação distingue essa nuance do temor expresso no primeiro membro.
- source_word: יִדְבַּק אַחֲרֵיכֶם
  choice: se agarrará aos seus calcanhares
  rationale: Reproduz de maneira idiomática a imagem de algo que adere por trás e persegue sem dar trégua, sem reduzi-la ao simples verbo 'seguir'.
- source_word: מִצְרַיִם
  choice: ali no Egito
  rationale: Mantém a repetição enfática do lugar presente no hebraico.
- source_word: וְשָׁם תָּמֻתוּ
  choice: e ali vocês morrerão
  rationale: Tradução direta, atual e solene, preservando a terceira repetição enfática de 'ali'.
theological_decisions:
- issue: Natureza dos termos de juízo 'espada' e 'fome'
  choice: Manter as imagens concretas 'espada' e 'fome'.
  alternative: Interpretá-las como 'guerra' e 'inanição' ou 'morte violenta e fome'.
  rationale: O hebraico emprega imagens proféticas tradicionais de juízo. Mantê-las evita explicar além do texto e preserva sua força e amplitude.
- issue: Relação entre a fuga para o Egito e a morte anunciada
  choice: Preservar a repetição locativa de 'ali' sem acrescentar explicação causal ou teológica.
  alternative: Explicitar que o Egito, buscado como refúgio, se tornará lugar de castigo divino.
  rationale: A ironia teológica já emerge da repetição hebraica; explicitá-la no corpo do versículo resolveria por paráfrase algo que o texto comunica retoricamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para a segunda pessoa plural. A ordem e a repetição de 'ali' preservam a ênfase retórica do hebraico. A expressão 'aos seus calcanhares' torna natural a imagem de דבק אחרי sem apagar seu caráter figurado.
