review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a advertência enfática, a tríade «espada, fome e peste» e a condição de residirem como estrangeiros. Contudo, a redação atual absorve o advérbio final «ali» (שָׁם), embora ele seja explicitamente expresso no hebraico; é possível mantê-lo sem perda de naturalidade.
  naturalness: «Agora, portanto» e «saibam com toda a certeza» são claros e adequados ao registro profético. «Para onde desejaram ir» é mais idiomático e preciso do que «aonde desejaram ir» neste contexto de movimento direcional. A construção «a fim de ali viver como estrangeiros» preserva o sentido e soa natural em português formal moderno.
  terminology: «Peste» é uma boa tradução de דֶּבֶר no padrão profético, e a nota oferece apropriadamente «epidemia» como alternativa. «Viver como estrangeiros» comunica de modo acessível a nuance de residência como forasteiros de לָגוּר.
  issues:
