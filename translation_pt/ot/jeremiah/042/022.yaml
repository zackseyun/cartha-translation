  to: Agora, portanto, saibam com toda a certeza que vocês morrerão pela espada, pela fome e pela peste[a] no lugar para onde desejaram ir, a fim de ali viver como estrangeiros.
  rationale: A revisão explicita «ali», correspondente a שָׁם, e ajusta a expressão direcional para «para onde». Mantém-se a tríade profética, a ênfase do imperativo e a nuance de residência como estrangeiros, sem introduzir interpretação adicional.
