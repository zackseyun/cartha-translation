  text: וְ/עַתָּה֙ יָדֹ֣עַ תֵּֽדְע֔וּ כִּ֗י בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר תָּמ֑וּתוּ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר חֲפַצְתֶּ֔ם לָ/ב֖וֹא לָ/ג֥וּר שָֽׁם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/022.yaml
  text: Now therefore[a], know for certain that you will die by the sword, by famine, and by pestilence in the place where you desired to go to sojourn there.
translation:
  language: pt
  text: Agora, portanto, saibam com toda a certeza que vocês morrerão pela espada, pela fome e pela peste[a] no lugar para onde desejaram ir, a fim de ali viver como estrangeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “epidemia”. O termo hebraico pode designar, de modo mais geral, uma doença epidêmica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Marca uma transição conclusiva decorrente da advertência anterior; “portanto” explicita naturalmente a força inferencial do contexto.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: saibam com toda a certeza
  rationale: O infinitivo absoluto junto ao verbo finito intensifica a expressão; esta formulação portuguesa comunica a ênfase de modo natural.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os ouvintes devem saber.
- source_word: בַּחֶרֶב
  choice: pela espada
  rationale: Expressão profética tradicional para morte causada por guerra ou violência, mantendo concisão e solenidade.
- source_word: בָּרָעָב
  choice: pela fome
  rationale: Preserva o paralelismo da tríade de juízos e emprega uma formulação clara em português.
- source_word: וּבַדֶּבֶר
  choice: e pela peste
  rationale: דֶּבֶר, nesta fórmula de juízo, normalmente designa doença epidêmica; “peste” conserva o registro profético sem restringir necessariamente a uma enfermidade específica.
- source_word: תָּמ֑וּתוּ
  choice: vocês morrerão
  rationale: O futuro simples expressa de maneira direta e solene a advertência profética dirigida ao grupo.
- source_word: בַּמָּקוֹם
  choice: no lugar
  rationale: Tradução locativa direta, sem acrescentar uma ênfase ausente do hebraico.
- source_word: אֲשֶׁר חֲפַצְתֶּם
  choice: aonde desejaram
  rationale: חפץ comunica vontade ou desejo; “desejaram” preserva a nuance volitiva e a ironia do destino escolhido.
- source_word: לָבוֹא
  choice: ir
  rationale: No contexto, o grupo pretende deslocar-se até esse lugar; “ir” é a escolha dêitica mais natural em português.
- source_word: לָגוּר
  choice: para viver como estrangeiros
  rationale: גור indica residir como forasteiro ou residente temporário. A formulação torna essa nuance compreensível em português atual.
- source_word: שָׁם
  choice: no lugar aonde... para viver
  rationale: A localização indicada por שָׁם fica naturalmente incorporada à construção portuguesa, evitando o final redundante “ali” sem perder o conteúdo semântico.
theological_decisions:
- issue: Tradução da tríade de juízo חֶרֶב / רָעָב / דֶּבֶר
  choice: pela espada, pela fome e pela peste
  alternative: pela espada, pela fome e pela epidemia
  rationale: Mantém a reconhecível fórmula profética de juízo e seu peso solene, sem acrescentar uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” deixa claro o destinatário coletivo. A cadência solene da tríade profética foi preservada, enquanto “viver como estrangeiros” comunica em linguagem corrente a condição expressa por גור.
