id: JER.42.11
reference: Jeremiah 42:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּֽירְא֗וּ מִ/פְּנֵי֙ מֶ֣לֶךְ בָּבֶ֔ל אֲשֶׁר אַתֶּ֥ם יְרֵאִ֖ים מִ/פָּנָ֑י/ו אַל תִּֽירְא֤וּ מִמֶּ֨/נּוּ֙ נְאֻם יְהוָ֔ה כִּֽי אִתְּ/כֶ֣ם אָ֔נִי לְ/הוֹשִׁ֧יעַ אֶתְ/כֶ֛ם וּ/לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/011.yaml
  text: Do not fear the king of Babylon[a], before whom you are afraid. Do not fear him, declares Yahweh[b], for I am with you to save you and to deliver you from his hand.
translation:
  language: pt
  text: Não tenham medo do rei da Babilônia, de quem vocês têm medo. Não tenham medo dele — declara Yahweh[a] —, pois eu estou com vocês para salvá-los e livrá-los da mão dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, aqui representado como “Yahweh”. Tradicionalmente traduzido por “SENHOR”.'
    reason: Esclarecer a forma e a tradição de tradução do nome divino.
lexical_decisions:
- source_word: תִּירְאוּ / יְרֵאִים
  choice: tenham medo / têm medo
  rationale: Preserva a repetição da raiz ירא e expressa em português natural tanto a proibição quanto o medo que já domina os ouvintes.
- source_word: מִפְּנֵי ... מִפָּנָיו
  choice: do rei da Babilônia, de quem vocês têm medo
  rationale: Depois de ירא, a expressão hebraica com פנים indica a pessoa temida. A tradução evita reproduzir literalmente o idioma facial, que seria pouco natural em português.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: É a forma portuguesa clara e convencional para a construção hebraica.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: A preposição hebraica integra a construção idiomática de temor; em português, 'não tenham medo dele' é a formulação natural.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Traduz a fórmula profética de modo atual e solene, preservando o nome divino presente no texto hebraico.
- source_word: כִּי אִתְּכֶם אָנִי
  choice: pois eu estou com vocês
  rationale: Mantém o fundamento explícito da ordem de não temer e conserva a ênfase do pronome 'eu'.
- source_word: לְהוֹשִׁיעַ
  choice: para salvá-los
  rationale: Expressa o sentido causativo de ישׁע e mantém distinção lexical em relação ao verbo seguinte.
- source_word: וּלְהַצִּיל
  choice: e livrá-los
  rationale: '''Livrar'' traduz naturalmente נצל e preserva o paralelismo sem reduzir os dois verbos a um só termo.'
- source_word: מִיָּדוֹ
  choice: da mão dele
  rationale: Mantém a metáfora hebraica da mão como poder ou domínio, ainda compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituir o nome por um título, enquanto a nota esclarece a tradição textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A repetição enfática de “tenham medo” foi mantida; o idioma hebraico literalmente relacionado a estar “diante da face” de alguém foi expresso de forma natural. O singular metafórico “da mão dele” foi preservado.
