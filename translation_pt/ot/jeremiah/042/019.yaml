source:
  edition: WLC
  text: דִּבֶּ֨ר יְהוָ֤ה עֲלֵי/כֶם֙ שְׁאֵרִ֣ית יְהוּדָ֔ה אַל תָּבֹ֖אוּ מִצְרָ֑יִם יָדֹ֨עַ֙ תֵּֽדְע֔וּ כִּי הַעִידֹ֥תִי בָ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/019.yaml
  text: 'Yahweh has spoken concerning you[a], remnant of Judah: Do not go to Egypt. Know for certain that I have warned you today.'
translation:
  language: pt
  text: 'Yahweh falou a respeito de vocês, remanescente de Judá: “Não vão para o Egito. Saibam com toda a certeza que hoje eu os adverti.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dei testemunho solene contra vocês”. O verbo hebraico pode expressar tanto uma advertência quanto um testemunho formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito hebraico apresenta a declaração divina como proferida e concluída; “falou” é direto e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵיכֶם
  choice: a respeito de vocês
  rationale: Com דִּבֶּר, a preposição עַל indica naturalmente o assunto da fala. “Contra vocês” daria à primeira oração um tom adversativo mais forte do que o contexto exige.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: remanescente de Judá
  rationale: “Remanescente” conserva tanto o sentido histórico dos sobreviventes quanto a ressonância característica da linguagem profética.
- source_word: אַל תָּבֹאוּ מִצְרָיִם
  choice: Não vão para o Egito
  rationale: A construção expressa uma proibição de se deslocar para o Egito. Esta formulação comunica o sentido com naturalidade no português atual.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: Saibam com toda a certeza
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a expressão; “com toda a certeza” torna explícita essa ênfase.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os ouvintes devem saber.
- source_word: הַעִידֹתִי בָכֶם
  choice: eu os adverti
  rationale: O hifil de עוּד pode indicar advertência ou testemunho solene. No contexto, “adverti” expressa com clareza a função da declaração, sem eliminar a alternativa formal registrada em nota.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente corrente e preciso da expressão temporal hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal do texto hebraico, sem substituí-lo por um título.
- issue: Ressonância de שְׁאֵרִית
  choice: remanescente de Judá
  alternative: sobreviventes de Judá
  rationale: “Remanescente” mantém simultaneamente a realidade histórica do grupo sobrevivente e a tensão teológica própria da literatura profética, sem acrescentar uma interpretação doutrinária.
- issue: Sentido de הַעִידֹתִי בָכֶם
  choice: eu os adverti
  alternative: dei testemunho solene contra vocês
  rationale: O contexto favorece a função de advertência, mas o verbo e a preposição também admitem uma formulação forense ou adversativa; essa ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A fala direta foi pontuada para deixar clara a advertência, e a ênfase hebraica foi preservada em “com toda a certeza”.
