id: JER.42.1
reference: Jeremiah 42:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁוּ֙ כָּל שָׂרֵ֣י הַ/חֲיָלִ֔ים וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וִֽ/יזַנְיָ֖ה בֶּן הוֹשַֽׁעְיָ֑ה וְ/כָל הָ/עָ֖ם מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/001.yaml
  text: Then all the commanders of the forces approached[a], along with Yohanan son of Kareah and Yizaniah son of Hoshaiah[b], and all the people from the least to the greatest.
translation:
  language: pt
  text: Então todos os comandantes das forças armadas[a], Joanã, filho de Careá, Jezanias, filho de Hosaías, e todo o povo, do menor ao maior[b], aproximaram-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os chefes das tropas” ou “todos os oficiais do exército”.
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que abrange toda a comunidade, em todos os níveis sociais.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: aproximaram-se
  rationale: O verbo נגשׁ indica chegar perto ou aproximar-se. A forma pronominal é natural em português e conserva o movimento em direção a Jeremias sugerido pelo contexto, sem explicitá-lo além do hebraico.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: todos os comandantes das forças armadas
  rationale: שָׂרֵי designa chefes ou comandantes, e חֲיָלִים, forças ou tropas. A expressão comunica claramente o caráter militar em português atual.
- source_word: וְיוֹחָנָן בֶּן־קָרֵחַ
  choice: Joanã, filho de Careá
  rationale: Empregam-se formas portuguesas reconhecíveis que representam os nomes hebraicos, mantendo a fórmula genealógica simples.
- source_word: וִיזַנְיָה בֶּן־הוֹשַׁעְיָה
  choice: Jezanias, filho de Hosaías
  rationale: Jezanias representa de modo claro em português o nome hebraico יזניה; Hosaías preserva a forma e a acentuação do nome הושעיה.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: Tradução direta e natural do termo coletivo הָעָם.
- source_word: מִקָּטֹן וְעַד־גָּדוֹל
  choice: do menor ao maior
  rationale: Preserva o merismo hebraico, que abrange toda a comunidade e não se limita necessariamente a idade ou tamanho físico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada para evitar ambiguidade quanto ao sujeito plural, mantendo todos os participantes antes do verbo. Os nomes próprios seguem formas portuguesas reconhecíveis sem recorrer a grafias inglesas.
