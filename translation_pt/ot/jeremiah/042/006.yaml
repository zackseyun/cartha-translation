  text: אִם ט֣וֹב וְ/אִם רָ֔ע בְּ/ק֣וֹל יְהוָ֣ה אֱלֹהֵ֗י/נוּ אֲשֶׁ֨ר אנו שֹׁלְחִ֥ים אֹתְ/ךָ֛ אֵלָ֖י/ו נִשְׁמָ֑ע לְמַ֨עַן֙ אֲשֶׁ֣ר יִֽיטַב לָ֔/נוּ כִּ֣י נִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/006.yaml
  text: Whether it is good or whether it is bad, we will obey the voice of the LORD our God, to whom we are sending you, so that it may go well with us when we obey the voice of the LORD our God.
translation:
  language: pt
  text: Seja bom, seja mau, obedeceremos à voz do SENHOR, nosso Deus, a quem estamos enviando você, para que tudo nos vá bem quando obedecermos à voz do SENHOR, nosso Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם טוֹב וְאִם רָע
  choice: Seja bom, seja mau
  rationale: Reproduz de modo natural a construção alternativa hebraica e mantém o sentido de obediência independentemente de a resposta parecer favorável ou desfavorável.
- source_word: בְּקוֹל ... נִשְׁמָע
  choice: obedeceremos à voz de...
  rationale: No hebraico, ouvir a voz neste contexto implica acatar e obedecer; a formulação conserva também a imagem recorrente da 'voz'.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o Tetragrama, em coerência com a camada de consulta auditada.
- source_word: לְמַעַן אֲשֶׁר יִיטַב לָנוּ
  choice: para que tudo nos vá bem
  rationale: Expressa com clareza a finalidade indicada por לְמַעַן e o idiomatismo יִיטַב לָנוּ.
- source_word: כִּי נִשְׁמַע
  choice: quando obedecermos
  rationale: כִּי pode assumir valor temporal ou causal. Aqui, 'quando' mantém a relação entre o bem-estar e a obediência sem reformulá-la como uma explicação doutrinária mais rígida.
theological_decisions:
- issue: Relação entre obediência e bem-estar
  choice: quando obedecermos
  alternative: porque obedeceremos
  rationale: A escolha preserva a leitura temporal contextual de כִּי adotada pela versão de consulta, sem negar que a partícula também possa ser entendida causalmente.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Emprega a convenção tradicional de tradução sem introduzir uma preferência confessional específica; a identidade do nome divino permanece sinalizada pela forma em maiúsculas.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de boa legibilidade brasileira. A repetição de 'à voz do SENHOR, nosso Deus' foi mantida por corresponder à ênfase do hebraico. 'Você' torna explícito o objeto singular masculino indicado por אֹתְךָ, referindo-se a Jeremias.
