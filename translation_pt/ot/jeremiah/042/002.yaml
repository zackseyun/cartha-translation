source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אֶֽל יִרְמְיָ֣הוּ הַ/נָּבִ֗יא תִּפָּל נָ֤א תְחִנָּתֵ֨/נוּ֙ לְ/פָנֶ֔י/ךָ וְ/הִתְפַּלֵּ֤ל בַּעֲדֵ֨/נוּ֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּעַ֖ד כָּל הַ/שְּׁאֵרִ֣ית הַ/זֹּ֑את כִּֽי נִשְׁאַ֤רְנוּ מְעַט֙ מֵֽ/הַרְבֵּ֔ה כַּ/אֲשֶׁ֥ר עֵינֶ֖י/ךָ רֹא֥וֹת אֹתָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/002.yaml
  text: And they said to Jeremiah the prophet[a], “Please let our plea come before you, and pray for us to Yahweh your God, for all this remnant, for we are left as few out of many[b], as your eyes see us.”
translation:
  language: pt
  text: 'E disseram ao profeta Jeremias: “Por favor, que a nossa súplica chegue diante de ti[a], e ora a Yahweh, teu Deus, por nós, por todo este remanescente; pois restamos poucos dentre muitos, como teus olhos nos veem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que a nossa súplica caia diante de ti”, um modo de pedir que uma petição seja apresentada a alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפָּל נָא תְחִנָּתֵנוּ לְפָנֶיךָ
  choice: Por favor, acolhe a nossa súplica
  rationale: A expressão hebraica diz literalmente que a súplica ‘caia diante’ de Jeremias, um modo de pedir que ela seja recebida e atendida. ‘Acolhe a nossa súplica’ comunica com naturalidade a força do idioma em português.
- source_word: וְהִתְפַּלֵּל בַּעֲדֵנוּ
  choice: e ora por nós
  rationale: Expressa diretamente o pedido de oração em favor do grupo sem tornar explícita uma noção técnica de intercessão além do necessário.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: teu Deus
  rationale: 'Preserva a forma significativa usada pelos interlocutores: ‘teu Deus’, e não ‘nosso Deus’.'
- source_word: בְּעַד כָּל הַשְּׁאֵרִית הַזֹּאת
  choice: por todo este remanescente
  rationale: ‘Remanescente’ mantém o vocabulário recorrente e teologicamente relevante de Jeremias; ‘todo este’ representa o alcance de כָּל sobre o grupo restante.
- source_word: כִּי נִשְׁאַרְנוּ מְעַט מֵהַרְבֵּה
  choice: pois de muitos restamos apenas poucos
  rationale: Reproduz de modo claro o contraste entre a multidão anterior e o pequeno número que permaneceu.
- source_word: כַּאֲשֶׁר עֵינֶיךָ רֹאוֹת אֹתָנוּ
  choice: como teus próprios olhos podem ver
  rationale: Conserva a imagem dos olhos de Jeremias como testemunho direto, em formulação idiomática no português atual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Manutenção da linguagem de ‘remanescente’
  choice: remanescente
  alternative: sobreviventes
  rationale: ‘Remanescente’ preserva um termo profético recorrente sem determinar que a palavra se refira apenas à sobrevivência física.
- issue: Distância expressa por ‘teu Deus’
  choice: teu Deus
  alternative: nosso Deus
  rationale: A formulação hebraica atribui a relação diretamente a Jeremias. Alterá-la para ‘nosso’ eliminaria uma tensão potencialmente significativa do relato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ‘tu’ em concordância verbal regular (‘acolhe’, ‘ora’) para manter a segunda pessoa singular do hebraico; evita literalismos pouco naturais, mas conserva ‘Yahweh’, ‘teu Deus’ e ‘remanescente’.
