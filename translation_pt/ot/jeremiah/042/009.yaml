lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética convencional e solene do hebraico.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama por SENHOR em versaletes.
- source_word: לְהַפִּיל תְּחִנַּתְכֶם לְפָנָיו
  choice: apresentar diante dele a súplica de vocês
  rationale: Expressa naturalmente o idiomatismo hebraico de fazer cair/depor uma súplica diante de alguém, mantendo tanto o caráter humilde do pedido quanto a referência explícita à presença de Deus.
theological_decisions:
- issue: Referente de אֲשֶׁר e sequência pronominal
  choice: a quem vocês me enviaram ... diante dele
  alternative: ao qual vocês me enviaram ... perante ele
  rationale: Mantém a referência a SENHOR, o Deus de Israel, sem eliminar a construção pronominal enfática do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural informal respeitoso “vocês” comunica claramente o destinatário coletivo. Os dois-pontos finais preservam o caráter introdutório da fala que continua no versículo seguinte.
