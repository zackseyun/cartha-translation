  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יִרְמְיָ֤הוּ הַ/נָּבִיא֙ שָׁמַ֔עְתִּי הִנְ/נִ֧י מִתְפַּלֵּ֛ל אֶל יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כְּ/דִבְרֵי/כֶ֑ם וְֽ/הָיָ֡ה כָּֽל הַ/דָּבָר֩ אֲשֶׁר יַעֲנֶ֨ה יְהוָ֤ה אֶתְ/כֶם֙ אַגִּ֣יד לָ/כֶ֔ם לֹֽא אֶמְנַ֥ע מִ/כֶּ֖ם דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/004.yaml
  text: Then Jeremiah the prophet said to them[a], “I have heard. Behold, I am praying to Yahweh your God according to your words, and whatever Yahweh answers you, I will tell you[b]. I will not withhold a word from you.”
translation:
  language: pt
  text: 'Então o profeta Jeremias lhes disse: “Ouvi. Eis que vou orar a Yahweh, o Deus de vocês, conforme o que vocês pediram[a]. Tudo o que Yahweh responder a vocês, eu lhes comunicarei; não lhes ocultarei palavra alguma[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “conforme as palavras de vocês”; isto é, de acordo com o que vocês pediram.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não omitirei nada”. Hebraico: “não reterei de vocês palavra alguma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: A ordem é idiomática em português e preserva tanto o nome quanto o título.
- source_word: שָׁמַעְתִּי
  choice: Entendi
  rationale: No contexto de resposta a um pedido, o perfeito de שׁמע indica que Jeremias ouviu e acolheu o que lhe disseram; “Entendi” comunica esse valor pragmático em português atual.
- source_word: הִנְנִי מִתְפַּלֵּל
  choice: Eis que vou orar
  rationale: הִנְנִי com particípio destaca a ação imediata ou iminente. “Eis que vou orar” mantém a ênfase solene sem sugerir necessariamente que a oração já esteja em andamento.
- source_word: אֶל יְהוָה אֱלֹהֵיכֶם
  choice: a Yahweh, o Deus de vocês
  rationale: Mantém o nome divino e o sufixo de segunda pessoa plural; a aposição com artigo é natural e clara em português.
- source_word: כְּדִבְרֵיכֶם
  choice: conforme o que vocês pediram
  rationale: Traduz o sentido contextual de “conforme as palavras de vocês”, isto é, em conformidade com o pedido feito, deixando a forma mais literal em nota.
- source_word: וְהָיָה כָּל הַדָּבָר אֲשֶׁר יַעֲנֶה יְהוָה אֶתְכֶם
  choice: Tudo o que Yahweh responder a vocês
  rationale: A construção hebraica refere-se à totalidade da resposta divina; “Tudo o que” é natural e evita inserir “palavra” de modo pouco idiomático nesta oração.
- source_word: אַגִּיד לָכֶם
  choice: eu lhes comunicarei
  rationale: O hifil de נגד significa tornar conhecido ou declarar. “Comunicarei” convém ao registro profético e permanece compreensível.
- source_word: לֹא אֶמְנַע מִכֶּם דָּבָר
  choice: não esconderei de vocês uma palavra sequer
  rationale: Preserva דָּבָר, reforça a promessa de transmissão integral e emprega uma formulação natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa diretamente o nome próprio e evita substituí-lo por um título.
- issue: Relação expressa por “o Deus de vocês”
  choice: Preservar literalmente a segunda pessoa plural
  alternative: nosso Deus
  rationale: Jeremias repete a formulação dos interlocutores sem explicitar por que diz “de vocês”. A tradução conserva essa possível tensão teológica em vez de harmonizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a ênfase solene de הִנְנִי; “vocês” torna inequívoco o plural dos sufixos hebraicos. Os marcadores [a] e [b] aparecem no texto principal.
