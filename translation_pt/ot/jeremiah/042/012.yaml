  text: וְ/אֶתֵּ֥ן לָ/כֶ֛ם רַחֲמִ֖ים וְ/רִחַ֣ם אֶתְ/כֶ֑ם וְ/הֵשִׁ֥יב אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/012.yaml
  text: And I will show you mercy[a], and he will have mercy on you and restore you to your own land.
translation:
  language: pt
  text: Eu lhes concederei compaixão[a], e ele terá compaixão de vocês e os fará voltar à terra de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lhes darei misericórdia”.'
    reason: Alternativa lexical que reproduz mais literalmente נתן (“dar”) e traduz רַחֲמִים por “misericórdia”.
lexical_decisions:
- source_word: וְאֶתֵּן לָכֶם רַחֲמִים
  choice: Eu lhes concederei compaixão
  rationale: נתן significa literalmente “dar”; com o substantivo abstrato רַחֲמִים, “conceder compaixão” é natural em português e mantém a promessa divina na primeira pessoa, sem apagar a construção hebraica.
- source_word: וְרִחַם אֶתְכֶם
  choice: e ele terá compaixão de vocês
  rationale: Preserva a terceira pessoa masculina singular e o vínculo lexical entre רַחֲמִים e רחם. No contexto, o sujeito é o rei da Babilônia.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: e os fará voltar
  rationale: O hifil de שוב tem sentido causativo, “fazer voltar”. Esta formulação conserva esse valor com clareza e naturalidade.
- source_word: אֶל אַדְמַתְכֶם
  choice: à terra de vocês
  rationale: אֶל indica movimento em direção a um destino, e אֲדָמָה designa aqui a terra à qual o povo pertence. A formulação evita acrescentar ênfase ausente no hebraico.
theological_decisions:
- issue: Mudança de sujeito entre a primeira pessoa divina e a terceira pessoa masculina singular
  choice: 'Manter a mudança: “Eu lhes concederei... e ele terá... e os fará voltar”.'
  alternative: 'Uniformizar os verbos na primeira pessoa: “Eu... terei compaixão... farei voltar”.'
  rationale: O hebraico passa explicitamente de אֶתֵּן, primeira pessoa singular, para רִחַם e הֵשִׁיב, terceira pessoa masculina singular. A tradução preserva essa tensão gramatical e apresenta o governante humano como agente influenciado por Deus, sem harmonizar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna inequívoco o destinatário plural; “os fará voltar” mantém a construção causativa. A repetição de “compaixão” preserva deliberadamente o eco entre o substantivo רַחֲמִים e o verbo cognato רחם.
