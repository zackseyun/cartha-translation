  source_fidelity: 'A tradução conserva com precisão a sequência hebraica: a promessa divina em primeira pessoa (“Eu lhes concederei”) seguida dos verbos em terceira pessoa singular (“ele terá... e os fará voltar”). “Compaixão” para רַחֲמִים e “terá compaixão de vocês” para וְרִחַם אֶתְכֶם preservam adequadamente o eco lexical, e “os fará voltar” expressa o valor causativo do hifil וְהֵשִׁיב.'
