  terminology: “Concederei compaixão” é uma formulação aceitável para נתן com רַחֲמִים; “terra de vocês” traduz adequadamente אַדְמַתְכֶם sem introduzir a ênfase de “própria terra”. A nota lexical é pertinente, corretamente ancorada e não cria alteração de sentido.
