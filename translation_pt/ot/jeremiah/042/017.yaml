  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יִֽהְי֣וּ כָל הָ/אֲנָשִׁ֗ים אֲשֶׁר שָׂ֨מוּ אֶת פְּנֵי/הֶ֜ם לָ/ב֤וֹא מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם יָמ֕וּתוּ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/לֹֽא יִהְיֶ֤ה לָ/הֶם֙ שָׂרִ֣יד וּ/פָלִ֔יט מִ/פְּנֵי֙ הָֽ/רָעָ֔ה אֲשֶׁ֥ר אֲנִ֖י מֵבִ֥יא עֲלֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/017.yaml
  text: Then all the men who have set their faces to go to Egypt to sojourn there shall die by the sword[a], by famine, and by pestilence[b]. None of them shall have a survivor or an escapee from the disaster that I am bringing on them.
translation:
  language: pt
  text: Então, todos os homens que decidiram ir ao Egito para viver ali como estrangeiros[a] morrerão pela espada, pela fome e pela peste. Não haverá entre eles sobrevivente nem quem escape da calamidade que eu estou trazendo sobre eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico pode indicar residir em um lugar como estrangeiro ou forasteiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “remanescente nem fugitivo”. A dupla hebraica ressalta que ninguém ficará vivo nem conseguirá escapar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: Então ... morrerão
  rationale: Expressa naturalmente em português a consequência ou resultado da advertência anterior e mantém a força preditiva do hebraico.
- source_word: כָל הָאֲנָשִׁים
  choice: todos os homens
  rationale: Mantém o substantivo masculino plural do texto hebraico, que se refere ao grupo específico em questão.
- source_word: אֲשֶׁר שָׂמוּ אֶת־פְּנֵיהֶם
  choice: que decidiram
  rationale: O idiomatismo hebraico, literalmente 'puseram o rosto', indica determinação firme; 'decidiram' comunica esse sentido com clareza no português atual.
- source_word: לָבוֹא מִצְרַיִם
  choice: ir ao Egito
  rationale: בוא pode significar vir, ir ou entrar conforme a perspectiva; aqui, 'ir ao Egito' é a formulação portuguesa mais natural.
- source_word: לָגוּר שָׁם
  choice: viver ali como estrangeiros
  rationale: Preserva tanto a ideia de residir quanto a nuance de גור, que frequentemente descreve a permanência de quem vive como estrangeiro.
- source_word: יָמוּתוּ
  choice: morrerão
  rationale: Futuro simples e solene, adequado à declaração profética de juízo.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: pela espada, pela fome e pela peste
  rationale: Mantém a tríade recorrente de juízo em Jeremias e conserva a imagem concreta da espada, juntamente com fome e epidemia.
- source_word: שָׂרִיד וּפָלִיט
  choice: sobrevivente nem fugitivo
  rationale: A dupla hebraica enfatiza que ninguém permanecerá vivo nem conseguirá fugir; a formulação evita atribuir aqui a 'remanescente' um sentido teológico técnico.
- source_word: מִפְּנֵי הָרָעָה
  choice: que escape da calamidade
  rationale: Neste contexto de juízo, רָעָה significa calamidade ou desastre, não mal moral; a oração torna explícita em português a relação de fuga indicada pela construção hebraica.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם
  choice: que eu estou trazendo sobre eles
  rationale: Mantém a agência divina explícita e reproduz o aspecto iminente ou em curso do particípio מֵבִיא.
theological_decisions:
- issue: Linguagem de juízo e agência divina
  choice: a calamidade que eu estou trazendo sobre eles
  alternative: a calamidade que virá sobre eles
  rationale: O hebraico atribui diretamente a Deus a calamidade; a tradução não suaviza nem oculta essa agência.
- issue: Sentido da dupla שָׂרִיד וּפָלִיט
  choice: sobrevivente nem fugitivo
  alternative: remanescente nem aquele que escape
  rationale: A escolha conserva os dois aspectos da afirmação — sobreviver e fugir — sem introduzir uma interpretação doutrinária de 'remanescente' que o contexto imediato não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a solenidade profética, evita literalismos pouco naturais como 'puseram o rosto' e mantém as nuances de residência estrangeira, totalidade do juízo e agência divina.
