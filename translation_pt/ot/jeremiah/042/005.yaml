  text: וְ/הֵ֨מָּה֙ אָמְר֣וּ אֶֽל יִרְמְיָ֔הוּ יְהִ֤י יְהוָה֙ בָּ֔/נוּ לְ/עֵ֖ד אֱמֶ֣ת וְ/נֶאֱמָ֑ן אִם לֹ֡א כְּֽ/כָל הַ֠/דָּבָר אֲשֶׁ֨ר יִֽשְׁלָחֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֵלֵ֖י/נוּ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/005.yaml
  text: And they said to Jeremiah[b][a], “May Yahweh be a true and faithful witness against us if we do not act according to all the word that Yahweh your God sends to us through you.”
translation:
  language: pt
  text: 'E eles disseram a Jeremias: “Que Yahweh seja uma testemunha verdadeira e fiel contra nós[a], se não agirmos de acordo com toda a palavra que Yahweh, seu Deus, enviar a nós por meio de você[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma testemunha verdadeira e fiel entre nós”. A expressão hebraica pode ser entendida mais literalmente como “em nosso meio”, mas, neste contexto de juramento, provavelmente indica uma testemunha contra os falantes caso eles não obedeçam.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “que Yahweh, seu Deus, enviar você a nós”. O hebraico apresenta Jeremias como aquele que Yahweh envia aos falantes; a tradução explicita que ele é o portador da palavra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Que ... seja
  rationale: O jussivo de היה expressa uma invocação solene; esta construção é natural em português para introduzir um juramento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בָּנוּ לְעֵד
  choice: uma testemunha ... contra nós
  rationale: No contexto de juramento, Yahweh é invocado como testemunha que deporia contra os falantes caso descumprissem o compromisso; a nota preserva o sentido espacial mais literal de בָּנוּ.
- source_word: אֱמֶת וְנֶאֱמָן
  choice: verdadeira e fiel
  rationale: 'Preserva os dois aspectos da expressão hebraica: veracidade e confiabilidade.'
- source_word: אִם לֹא
  choice: se não
  rationale: Introduz de maneira direta a condição negativa do juramento.
- source_word: כְּכָל הַדָּבָר
  choice: de acordo com toda a palavra
  rationale: Mantém o singular coletivo דָּבָר e a abrangência indicada por כָּל, podendo 'palavra' designar a mensagem inteira.
- source_word: יִשְׁלָחֲךָ ... אֵלֵינוּ
  choice: enviar a nós por seu intermédio
  rationale: Explicita com naturalidade em português o papel de Jeremias como portador da palavra, que está implícita no verbo 'enviar'.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Conserva o sufixo de segunda pessoa singular dirigido a Jeremias, sem harmonizá-lo para 'nosso Deus'.
- source_word: כֵּן נַעֲשֶׂה
  choice: agirmos de acordo
  rationale: Expressa em português corrente a promessa de proceder exatamente conforme a mensagem recebida.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
- issue: A expressão dos falantes אֱלֹהֶיךָ
  choice: seu Deus
  alternative: nosso Deus
  rationale: O hebraico dirige a Jeremias a forma de segunda pessoa singular; mantê-la evita apagar a tensão relacional presente na fala.
- issue: Força jurídica de בָּנוּ לְעֵד
  choice: testemunha contra nós
  alternative: testemunha entre nós
  rationale: O contexto é o de um juramento no qual Deus testemunharia contra os falantes se eles não obedecessem, mas a alternativa formalmente possível é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a solenidade do juramento, o singular coletivo “palavra” e o pronome “seu” dirigido a Jeremias. Os marcadores aparecem junto às expressões que explicam.
