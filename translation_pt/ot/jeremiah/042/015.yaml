source:
  edition: WLC
  text: וְ/עַתָּ֕ה לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה שְׁאֵרִ֣ית יְהוּדָ֑ה כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם אַ֠תֶּם שׂ֣וֹם תְּשִׂמ֤וּ/ן פְּנֵי/כֶם֙ לָ/בֹ֣א מִצְרַ֔יִם וּ/בָאתֶ֖ם לָ/ג֥וּר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/015.yaml
  text: 'Now therefore hear the word of Yahweh[a], O remnant of Judah. Thus says Yahweh of hosts, the God of Israel: If you are determined to go to Egypt and to go to sojourn there,'
translation:
  language: pt
  text: 'Agora, portanto, ouçam a palavra de Yahweh, remanescente de Judá. Assim diz Yahweh dos Exércitos, o Deus de Israel: Se vocês estiverem firmemente decididos[a] a ir para o Egito e forem para lá a fim de morar como estrangeiros,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “se vocês de fato puserem o rosto para ir ao Egito” — expressão idiomática que indica firme determinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: Agora, portanto
  rationale: Preserva tanto o valor temporal de וְעַתָּה como a força conclusiva de לָכֵן, introduzindo solenemente a consequência do contexto anterior.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: ouçam a palavra de Yahweh
  rationale: “Ouçam” mantém a forma imperativa plural e o peso da convocação profética; “a palavra de Yahweh” reproduz a fórmula profética.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: remanescente de Judá
  rationale: O sintagma funciona como vocativo dirigido à comunidade sobrevivente de Judá; “remanescente” conserva sua terminologia característica.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: É a fórmula tradicional e semanticamente direta de introdução da mensagem profética, com força performativa presente.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo compreensível, preservando as conotações militares e celestiais do título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica, sem expansão interpretativa.
- source_word: אִם אַתֶּם שׂוֹם תְּשִׂמוּן פְּנֵיכֶם
  choice: Se vocês estão firmemente decididos
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação, enquanto “pôr o rosto” é uma expressão idiomática de determinação firme. A tradução comunica ambos os elementos em português natural, e a forma literal é registrada em nota.
- source_word: לָבֹא מִצְרַיִם
  choice: a ir para o Egito
  rationale: Com um destino, בוא pode expressar movimento para um lugar; “ir para o Egito” corresponde naturalmente à perspectiva do discurso.
- source_word: וּבָאתֶם לָגוּר שָׁם
  choice: e forem morar lá como estrangeiros
  rationale: A construção prossegue a condição e גור descreve residência em terra alheia na condição de estrangeiro. A escolha preserva essa condição social sem recorrer ao pouco corrente “peregrinar”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título, sem introduzir interpretação denominacional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento plural por “vocês”. Conservou-se a estrutura de convocação profética e a oração condicional inacabada, que continua no versículo seguinte. O vocativo aparece sem “ó”, forma mais natural no português contemporâneo, e o nome divino foi transliterado como “Yahweh”.
