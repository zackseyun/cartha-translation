review_pass:
  verdict: revise
  source_fidelity: A tradução representa bem as fórmulas proféticas, o vocativo, o nome divino e a intensificação de «pôr o rosto». Contudo, «forem morar lá» deixa implícito o segundo verbo de movimento (וּבָאתֶם, “vierem/entrarem/forem”), que introduz a finalidade de residir como estrangeiros. A revisão o torna explícito sem sacrificar a naturalidade.
  naturalness: O registro é claro e atual. «Se vocês estiverem firmemente decididos» funciona mais naturalmente como condição prospectiva do que o presente «estão ... decididos». «Forem para lá a fim de morar como estrangeiros» preserva a sequência verbal hebraica e continua fluente em português internacional.
  terminology: «Yahweh», «Yahweh dos Exércitos», «remanescente de Judá» e «morar como estrangeiros» são escolhas adequadas. A nota conserva a alternativa idiomática sem impor uma leitura teológica.
