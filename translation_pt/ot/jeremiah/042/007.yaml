  text: וַ/יְהִ֕י מִ/קֵּ֖ץ עֲשֶׂ֣רֶת יָמִ֑ים וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/007.yaml
  text: And it happened[a], at the end of ten days, that the word of Yahweh came to Jeremiah.
translation:
  language: pt
  text: Ao fim de dez dias[a], aconteceu que a palavra de Yahweh veio a Jeremias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do fim de dez dias”; isto é, quando os dez dias chegaram ao fim. Também pode ser traduzido por “depois de dez dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: aconteceu que
  rationale: Preserva a fórmula narrativa hebraica em português atual e digno, evitando o arcaísmo “sucedeu que”.
- source_word: מִקֵּץ
  choice: ao fim de
  rationale: Expressa o ponto em que o período se completou e mantém mais claramente o limite temporal do que a opção mais geral “depois de”.
- source_word: עֲשֶׂרֶת יָמִים
  choice: dez dias
  rationale: Tradução direta e natural da construção com numeral cardinal e substantivo.
- source_word: וַיְהִי דְבַר
  choice: a palavra ... veio
  rationale: A segunda ocorrência de וַיְהִי integra a fórmula profética e é vertida segundo o uso idiomático português, sem repetir de modo rígido “aconteceu”.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Conserva a fórmula profética tradicional e o sentido de revelação divina, sem a explicitação interpretativa “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל יִרְמְיָהוּ
  choice: a Jeremias
  rationale: A preposição indica direção ou destinatário, e “Jeremias” é a forma portuguesa consagrada do nome.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”, sem adotar a forma tradicional “Jeová”.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem foi levemente ajustada para fluência, mantendo a fórmula narrativa e a fórmula profética do hebraico. O marcador [a] aparece junto à expressão temporal que a nota esclarece.
