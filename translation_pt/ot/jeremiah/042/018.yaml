  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֣ה צְבָאוֹת֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ כַּ/אֲשֶׁר֩ נִתַּ֨ךְ אַפִּ֜/י וַ/חֲמָתִ֗/י עַל יֹֽשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם כֵּ֣ן תִּתַּ֤ךְ חֲמָתִ/י֙ עֲלֵי/כֶ֔ם בְּ/בֹאֲ/כֶ֖ם מִצְרָ֑יִם וִ/הְיִיתֶ֞ם לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה וְ/לֹֽא תִרְא֣וּ ע֔וֹד אֶת הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/018.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Just as my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you enter Egypt, and you will become an oath, a horror, a curse, and a reproach, and you will never again see this place.'
translation:
  language: pt
  text: 'Pois assim diz Javé dos Exércitos, o Deus de Israel: “Assim como a minha ira e o meu furor foram derramados sobre os habitantes de Jerusalém, também o meu furor será derramado sobre vocês quando entrarem no Egito. Vocês se tornarão objeto de imprecação[a], de horror, de maldição e de vergonha, e nunca mais verão este lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um juramento de maldição”; o termo hebraico pode designar um juramento que invoca uma maldição.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Javé dos Exércitos
  rationale: Translitera o nome divino em forma consagrada e inteligível em português e preserva a amplitude do título צְבָאוֹת, que pode abranger exércitos celestes e terrenos.
- source_word: נִתַּךְ ... תִּתַּךְ
  choice: foram derramados ... será derramado
  rationale: Preserva a metáfora da ira como líquido vertido e mantém o paralelismo entre o juízo passado sobre Jerusalém e o juízo futuro.
- source_word: אַפִּי ... חֲמָתִי
  choice: a minha ira e o meu furor
  rationale: Representa os dois termos hebraicos correlatos sem os fundir; “furor” comunica a intensidade de חֵמָה e funciona naturalmente no segundo membro, onde apenas esse termo reaparece.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: Equivalente direto, natural e atual da expressão participial hebraica.
- source_word: בְּבֹאֲכֶם מִצְרָיִם
  choice: quando entrarem no Egito
  rationale: Expressa o valor temporal da preposição com o infinitivo e conserva a ideia concreta de entrar no território egípcio.
- source_word: לְאָלָה
  choice: objeto de imprecação
  rationale: No contexto, אָלָה denota uma fórmula de juramento que invoca maldição ou aquilo que passa a ser citado em imprecações; a formulação evita que “juramento” seja entendido como simples promessa.
- source_word: לְשַׁמָּה
  choice: de horror
  rationale: Comunica a reação de espanto horrorizado diante da ruína, sem restringir indevidamente o termo à mera desolação física.
- source_word: לִקְלָלָה
  choice: de maldição
  rationale: Tradução direta do substantivo, aqui indicando que o povo se tornará exemplo ou fórmula de maldição.
- source_word: לְחֶרְפָּה
  choice: de vergonha
  rationale: Expressa de modo corrente a desonra pública e o desprezo contidos no termo, sem limitá-lo apenas à zombaria verbal.
theological_decisions:
- issue: Distinção entre אַף e חֵמָה na linguagem do juízo divino
  choice: a minha ira e o meu furor
  alternative: a minha ira e a minha indignação
  rationale: Mantém os dois termos e a intensidade retórica do hebraico. O sentido literalmente associado ao “nariz” em אַף não é reproduzido porque aqui se trata de um idioma inequívoco para ira.
- issue: Sentido de אָלָה na lista de consequências
  choice: objeto de imprecação
  alternative: juramento de maldição
  rationale: Preserva a conexão entre juramento e maldição sem sugerir que os destinatários se tornarão um juramento comum; a nota registra a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícita a referência coletiva das formas hebraicas. A repetição de “derramado” conserva a imagem e o paralelismo do original.
