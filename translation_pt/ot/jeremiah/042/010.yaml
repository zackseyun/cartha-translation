base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/010.yaml
  text: If you will indeed remain in this land[a], then I will build you up and not tear you down, and I will plant you and not uproot you[c][b]; for I relent concerning the harm that I did to you.
translation:
  language: pt
  text: Se vocês realmente permanecerem nesta terra[a], eu os edificarei e não os derrubarei; eu os plantarei e não os arrancarei[b], pois voltei atrás quanto à calamidade que lhes causei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se vocês de fato ficarem nesta terra”. O hebraico reforça a ideia expressa pelo verbo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não os arrancarei pela raiz”.'
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “pois mudei de ideia quanto à calamidade que lhes causei”. Aqui, “calamidade” significa o desastre do juízo, não maldade moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם שׁוֹב תֵּשְׁבוּ
  choice: Se vocês realmente permanecerem
  rationale: A construção com infinitivo absoluto antes do verbo finito dá ênfase à permanência. “Realmente permanecerem” comunica essa força de modo natural, sem interpretar שׁוֹב como um verbo independente, “voltar”.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: “Terra” preserva a referência geográfica e a ressonância própria da linguagem profética.
- source_word: וּבָנִיתִי אֶתְכֶם
  choice: eu os edificarei
  rationale: Mantém a metáfora de construção e soa digna e compreensível em português; não acrescenta a ideia mais específica de reconstrução.
- source_word: וְלֹא אֶהֱרֹס
  choice: e não os derrubarei
  rationale: Conserva o contraste metafórico com “edificarei” e exprime naturalmente a ideia de demolir ou destruir o que foi construído.
- source_word: וְנָטַעְתִּי אֶתְכֶם
  choice: eu os plantarei
  rationale: Preserva literalmente a metáfora agrícola recorrente em Jeremias.
- source_word: וְלֹא אֶתּוֹשׁ
  choice: e não os arrancarei
  rationale: No paralelismo com “plantarei”, “arrancarei” é claro e natural. A nota registra a alternativa mais explícita “arrancarei pela raiz”.
- source_word: כִּי נִחַמְתִּי
  choice: pois desisti
  rationale: נחם indica aqui uma mudança de curso quanto à calamidade, não arrependimento por culpa moral. “Desisti” comunica a decisão de não prosseguir com ela, preservando a linguagem relacional do texto.
- source_word: אֶל הָרָעָה
  choice: da calamidade
  rationale: רָעָה designa neste contexto dano ou desastre de juízo, não maldade moral. “Calamidade” evita essa possível confusão.
- source_word: אֲשֶׁר עָשִׂיתִי לָכֶם
  choice: que lhes causei
  rationale: É uma expressão natural em português para a calamidade que Deus fez recair sobre o povo, sem atenuar sua agência no texto.
theological_decisions:
- issue: נחם com Deus como sujeito
  choice: desisti da calamidade que lhes causei
  alternative: arrependi-me do mal que lhes fiz
  rationale: A formulação escolhida evita sugerir que Deus confessa uma falha moral, sentido que o hebraico não exige, mas mantém a tensão textual de Deus mudar seu procedimento em relação ao juízo anteriormente executado.
- issue: Sentido moral ou calamitoso de רָעָה
  choice: calamidade
  alternative: mal
  rationale: Neste contexto, רָעָה se refere ao desastre infligido como juízo. “Mal” poderia ser entendido como perversidade moral e atribuir ao texto uma afirmação que ele não faz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. As metáforas paralelas de construir/derrubar e plantar/arrancar foram preservadas. A pontuação explicita os dois pares poéticos sem fragmentar o versículo.
