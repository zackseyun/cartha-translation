id: JER.42.13
reference: Jeremiah 42:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם אֹמְרִ֣ים אַתֶּ֔ם לֹ֥א נֵשֵׁ֖ב בָּ/אָ֣רֶץ הַ/זֹּ֑את לְ/בִלְתִּ֣י שְׁמֹ֔עַ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/013.yaml
  text: But if you say[a], ‘We will not stay in this land,’ not obeying the voice of Yahweh your God—
translation:
  language: pt
  text: 'Mas, se vocês disserem: “Não ficaremos nesta terra”, para não obedecer à voz de Yahweh, seu Deus[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escutar a voz de Yahweh, seu Deus”. Em hebraico, “ouvir/escutar a voz” frequentemente implica responder com obediência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A combinação da conjunção com a partícula condicional introduz uma hipótese em contraste com a orientação anterior; “Mas, se” expressa naturalmente essa função.
- source_word: אֹמְרִים אַתֶּם
  choice: vocês disserem
  rationale: O particípio acompanhado do pronome explícito integra uma condição. Em português, o futuro do subjuntivo é a forma idiomática depois de “se” para uma possibilidade futura.
- source_word: לֹא נֵשֵׁב
  choice: Não ficaremos
  rationale: Aqui יָשַׁב indica permanecer ou estabelecer-se na terra. “Ficaremos” é corrente e adequado à decisão concreta de continuar em Judá.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: “Terra” conserva tanto a referência geográfica quanto as ressonâncias bíblicas de אֶרֶץ.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: para não obedecer
  rationale: לְבִלְתִּי com o infinitivo expressa propósito ou resultado pretendido. No idioma “ouvir a voz”, שׁמע inclui a resposta obediente; a formulação preserva também a relação sintática sem decidir entre propósito e consequência além do necessário.
- source_word: בְּקוֹל
  choice: à voz de
  rationale: A expressão mantém a imagem hebraica da voz divina, embora “obedecer” comunique a força prática do idioma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O possessivo refere-se ao grupo tratado por “vocês”; no português brasileiro corrente, “seu” concorda naturalmente com esse tratamento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido de שׁמע בְקול no contexto da aliança
  choice: obedecer à voz
  alternative: ouvir/escutar a voz
  rationale: A expressão implica escuta acompanhada de resposta obediente. “Obedecer” comunica essa força, enquanto “à voz” conserva a imagem relacional da fala divina; a alternativa mais literal consta em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “vocês” para o plural e mantém a construção suspensa pelo travessão, pois a frase prossegue no versículo seguinte.
