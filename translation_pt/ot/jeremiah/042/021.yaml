base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/021.yaml
  text: I have told you today[a], but you have not obeyed the voice of Yahweh your God or anything for which he sent me to you.
translation:
  language: pt
  text: Eu lhes declarei isso hoje, mas vocês não obedeceram à voz de Yahweh, seu Deus, nem a tudo o que ele me enviou para lhes comunicar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lhes declarei hoje, mas vocês não deram ouvidos à voz de Yahweh, seu Deus, nem a tudo com que ele me enviou a vocês.”'
    reason: Preserva uma tradução mais formal da construção hebraica e registra “dar ouvidos” como alternativa para שמע בְּקוֹל. A expressão final reflete a elipse de “obedecer” antes de “a tudo o que”.
lexical_decisions:
- source_word: וָאַגִּד
  choice: Eu lhes declarei
  rationale: O hifil de נגד significa comunicar, declarar ou dar a conhecer. “Declarei” expressa com dignidade a transmissão formal da resposta divina; o pretérito perfeito é natural em português para a ação realizada hoje.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Preserva diretamente a referência temporal enfática.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹל
  choice: mas vocês não obedeceram à voz
  rationale: A construção שמע בְּקוֹל indica escutar de modo obediente. “Obedecer à voz” conserva tanto a força do idioma quanto a imagem hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O sufixo é de segunda pessoa do plural. No português brasileiro corrente, “seu” concorda com “Deus” e remete naturalmente a “vocês”.
- source_word: וּלְכֹל אֲשֶׁר שְׁלָחַנִי אֲלֵיכֶם
  choice: nem a nada do que ele me enviou para lhes dizer
  rationale: A formulação torna explícito, sem alterar o sentido contextual, que Jeremias foi enviado com uma mensagem. “Nada do que” comunica a negação abrangente resultante de לֹא com כֹל.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” preserva sua função como nome e evita substituí-lo por um título.
- issue: Força de שׁמע בְּקוֹל
  choice: não obedeceram à voz
  alternative: não ouviram a voz
  rationale: No contexto, não se trata de incapacidade auditiva, mas da recusa em acatar a mensagem divina. A tradução conserva “voz” e explicita a dimensão de obediência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural e colocação pronominal natural no português brasileiro. A nota registra a forma mais literal e a leve ambiguidade sintática da oração final.
