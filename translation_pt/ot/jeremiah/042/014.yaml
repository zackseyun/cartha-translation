source:
  edition: WLC
  text: לֵ/אמֹ֗ר לֹ֚א כִּ֣י אֶ֤רֶץ מִצְרַ֨יִם֙ נָב֔וֹא אֲשֶׁ֤ר לֹֽא נִרְאֶה֙ מִלְחָמָ֔ה וְ/ק֥וֹל שׁוֹפָ֖ר לֹ֣א נִשְׁמָ֑ע וְ/לַ/לֶּ֥חֶם לֹֽא נִרְעָ֖ב וְ/שָׁ֥ם נֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/014.yaml
  text: saying[a], ‘No, but we will go into the land of Egypt, where we will not see war, and we will not hear the sound of the trumpet, and we will not be hungry for bread; and there we will live.’
translation:
  language: pt
  text: 'dizendo: “Não! Em vez disso, iremos para a terra do Egito, onde não veremos guerra, nem ouviremos o som da trombeta, nem passaremos fome de pão; e ali moraremos”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ali permaneceremos”. O verbo hebraico pode indicar tanto residência estabelecida como permanência em determinado lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo da fala e mantém a ligação sintática com o versículo anterior.
- source_word: לֹא כִּי
  choice: Não! Em vez disso
  rationale: Expressa a rejeição enfática seguida da decisão contrária, preservando a força adversativa da construção hebraica.
- source_word: אֶרֶץ מִצְרַיִם
  choice: a terra do Egito
  rationale: Conserva o substantivo explícito אֶרֶץ, sem reduzir a expressão simplesmente a “Egito”.
- source_word: נָבוֹא
  choice: iremos para
  rationale: No contexto de deslocamento rumo a um destino, בוא indica ir ou entrar; esta formulação é natural em português e deixa claro o movimento para o Egito.
- source_word: אֲשֶׁר
  choice: onde
  rationale: O relativo retoma um lugar, “a terra do Egito”; “onde” é o equivalente mais natural em português.
- source_word: לֹא נִרְאֶה מִלְחָמָה
  choice: não veremos guerra
  rationale: Mantém a imagem concreta do hebraico, que literalmente fala em “ver guerra”, sem explicá-la como “sofrer” ou “enfrentar” guerra.
- source_word: קוֹל שׁוֹפָר
  choice: o som da trombeta
  rationale: Preserva a construção nominal hebraica. “Trombeta” é compreensível ao leitor moderno e, no contexto, designa o instrumento cujo toque servia de alarme militar.
- source_word: לֹא נִשְׁמָע
  choice: nem ouviremos
  rationale: Verte de modo idiomático a forma contextual de primeira pessoa plural e coordena naturalmente a série de expectativas dos falantes.
- source_word: וְלַלֶּחֶם לֹא נִרְעָב
  choice: nem passaremos fome por falta de pão
  rationale: Comunica naturalmente em português a ideia de não ter fome quanto ao pão, preservando “pão” como imagem concreta de sustento, sem ampliar para o termo genérico “comida”.
- source_word: וְשָׁם נֵשֵׁב
  choice: e ali moraremos
  rationale: ישׁב pode significar sentar-se, permanecer, habitar ou morar. Neste contexto de mudança para o Egito, “moraremos” transmite residência estabelecida em linguagem atual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural. A exclamação após “Não” comunica a rejeição enfática de לֹא כִּי. A repetição hebraica de negações foi reproduzida por “não... nem... nem”, evitando rigidez excessiva. O marcador de nota foi colocado após a oração à qual se refere.
