  text: וְ/יַגֶּד לָ֨/נוּ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֣ר נֵֽלֶךְ בָּ֑/הּ וְ/אֶת הַ/דָּבָ֖ר אֲשֶׁ֥ר נַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/003.yaml
  text: that Yahweh your God may tell us the way in which we should walk[a], and the thing that we should do.
translation:
  language: pt
  text: para que Yahweh, seu Deus, nos diga por que caminho devemos andar e o que devemos fazer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַגֶּד
  choice: para que ... nos diga
  rationale: O imperfeito hifil de נגד, ligado ao pedido do contexto anterior, expressa a finalidade da oração e o pedido de orientação; “nos diga” é natural e mantém a força peticionária.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: O sufixo de segunda pessoa masculina singular dirige-se a Jeremias. “Seu Deus” é claro e corrente no português brasileiro.
- source_word: הַדֶּרֶךְ
  choice: caminho
  rationale: Preserva a imagem hebraica do caminho como curso a seguir e combina naturalmente com “andar”.
- source_word: אֲשֶׁר נֵלֶךְ בָּהּ
  choice: por que ... devemos andar
  rationale: Mantém a metáfora de andar por um caminho; “devemos” comunica que o povo pede orientação, sem transformar a forma verbal em simples previsão.
- source_word: הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: o que devemos fazer
  rationale: דבר tem sentido amplo de coisa ou questão; em paralelo com o caminho a seguir, a formulação idiomática “o que devemos fazer” comunica diretamente a ação solicitada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar uma vocalização híbrida tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção “por que caminho devemos andar” conserva a metáfora hebraica sem soar artificial; o início “para que” mantém a dependência sintática do pedido formulado no versículo anterior.
