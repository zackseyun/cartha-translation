source:
  edition: WLC
  text: כִּ֣י התעתי/ם בְּ/נַפְשֽׁוֹתֵי/כֶם֒ כִּֽי אַתֶּ֞ם שְׁלַחְתֶּ֣ם אֹתִ֗/י אֶל יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לֵ/אמֹ֔ר הִתְפַּלֵּ֣ל בַּעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵ֑י/נוּ וּ/כְ/כֹל֩ אֲשֶׁ֨ר יֹאמַ֜ר יְהוָ֧ה אֱלֹהֵ֛י/נוּ כֵּ֥ן הַגֶּד לָ֖/נוּ וְ/עָשִֽׂינוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/020.yaml
  text: For you have deceived yourselves[a], because you sent me to Yahweh your God, saying, ‘Pray for us to Yahweh our God, and whatever Yahweh our God says, tell us, and we will do it.’
translation:
  language: pt
  text: 'Pois vocês enganaram a si mesmos[a], porque me enviaram a Yahweh, seu Deus, dizendo: “Ore por nós a Yahweh, nosso Deus. Conte-nos tudo o que Yahweh, nosso Deus, disser, e nós o faremos”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês se desviaram, pondo em risco a própria vida”, ressaltando a força autodestrutiva da expressão hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: התעיתם
  choice: enganaram a si mesmos
  rationale: O hifil de תעה, combinado com בְּנַפְשׁוֹתֵיכֶם, admite uma leitura reflexiva ou resultativa. No contexto, Jeremias denuncia a disposição insincera do povo em obedecer; a expressão comunica com clareza a ideia de autoengano culpável.
- source_word: בְּנַפְשׁוֹתֵיכֶם
  choice: a si mesmos
  rationale: נֶפֶשׁ pode significar vida, pessoa ou o próprio ser. Nesta construção, a formulação reflexiva é natural em português, enquanto a possível dimensão de perigo para a própria vida é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Preserva a construção com o sufixo da segunda pessoa do plural; “seu” tem leitura plural natural no português brasileiro.
- source_word: הִתְפַּלֵּל בַּעֲדֵנוּ
  choice: Ore por nós
  rationale: Expressa de modo claro e corrente o sentido de orar ou interceder em favor de alguém.
- source_word: וּכְכֹל אֲשֶׁר יֹאמַר
  choice: tudo o que ... disser
  rationale: Transmite o alcance abrangente da expressão hebraica, literalmente “conforme tudo o que disser”, sem rigidez desnecessária.
- source_word: הַגֶּד לָנוּ
  choice: Conte-nos
  rationale: Equivalente natural do imperativo “declare-nos” ou “relate-nos” no contexto de comunicar uma resposta recebida.
- source_word: וְעָשִׂינוּ
  choice: e nós o faremos
  rationale: O pronome retoma naturalmente tudo o que Deus disser e explicita a promessa de obedecer.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Sentido da acusação התעיתם בנפשותיכם
  choice: vocês enganaram a si mesmos
  alternative: vocês se desviaram, pondo em risco a própria vida
  rationale: O contexto imediato destaca a alegada disposição de obedecer seguida pela recusa; por isso, o autoengano é adequado no texto principal. A construção também pode ressaltar o dano ou risco para a própria vida, possibilidade mantida em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo. A fala citada foi dividida em duas frases para fluidez, sem alterar sua relação lógica.
