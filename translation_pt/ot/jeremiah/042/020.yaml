  source_fidelity: A tradução mantém adequadamente a acusação difícil de התעיתם בנפשותיכם como autoengano culpável (“enganaram a si mesmos”), sem eliminar a possível conotação de dano à própria vida, que é registrada na nota. A cadeia causal com שני כי é preservada por “Pois ... porque”, e a fala citada conserva os imperativos e a promessa de cumprir tudo o que Yahweh disser.
  naturalness: O português é moderno, claro e apropriado ao registro profético. “Vocês”, “Ore por nós”, “Conte-nos” e “nós o faremos” são compreensíveis internacionalmente e especialmente fluidos para leitores brasileiros. A explicitação “a si mesmos” é um pouco enfática, mas é justificável pela expressão hebraica e permanece natural.
  terminology: “Yahweh” reproduz de modo consistente o Tetragrama. “Seu Deus” e “nosso Deus” refletem corretamente a alternância dos sufixos no hebraico. “Ore por nós” e “tudo o que ... disser” correspondem bem às construções verbais e ao escopo inclusivo do original.
