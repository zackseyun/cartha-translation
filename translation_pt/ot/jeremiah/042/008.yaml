  text: וַ/יִּקְרָ֗א אֶל יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֶ֛ל כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וּ/לְ/כָ֨ל הָ/עָ֔ם לְ/מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/008.yaml
  text: Then he called Johanan son of Kareah, all the commanders of the forces who were with him, and all the people, from the least to the greatest,
translation:
  language: pt
  text: Então ele chamou Joanã, filho de Careá, todos os comandantes das tropas que estavam com ele e todo o povo, do menor ao maior,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Então ele chamou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “chamou” preserva o sentido simples de קרא sem a força adicional de “convocou”.
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Joanã, filho de Careá
  rationale: Empregam-se formas portuguesas tradicionais e reconhecíveis dos nomes hebraicos, mantendo explicitamente o patronímico.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: todos os comandantes das tropas
  rationale: No contexto militar, שָׂרֵי designa líderes ou comandantes, e חֲיָלִים refere-se às tropas ou forças; a formulação é clara e atual em português.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: A oração relativa associa naturalmente os comandantes a Joanã; “estavam” é explicitado conforme a sintaxe portuguesa.
- source_word: וּלְכָל הָעָם
  choice: e todo o povo
  rationale: O לְ marca o grupo adicional a quem se dirige o chamado, mas não precisa ser repetido em português depois do verbo transitivo “chamou”.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: do menor ao maior
  rationale: A expressão idiomática abrange todas as camadas do povo. “Do menor ao maior” preserva sua concisão e seu sentido social, sem sugerir tamanho físico.
