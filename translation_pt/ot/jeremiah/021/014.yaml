  text: וּ/פָקַדְתִּ֧י עֲלֵי/כֶ֛ם כִּ/פְרִ֥י מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָ֑ה וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/יַעְרָ֔/הּ וְ/אָכְלָ֖ה כָּל סְבִיבֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/014.yaml
  text: And I will punish you according to the fruit of your deeds[a], declares Yahweh, and I will kindle a fire in her forest[b], and it will consume all that is around her.
translation:
  language: pt
  text: Eu os castigarei conforme o fruto de seus feitos[a], declara Yahweh; acenderei um fogo em sua floresta[b], e ele consumirá tudo ao redor dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cuidarei de vocês”, “visitarei vocês” ou “pedirei contas a vocês”. O verbo hebraico tem sentido mais amplo que o de castigar, embora aqui apareça claramente em um contexto de juízo.'
    reason: lexical_alternative
  - marker: b
    text: “Sua floresta” provavelmente se refere, em linguagem poética, a Jerusalém ou ao seu complexo real ou palaciano; outros entendem “floresta” como metáfora de um emaranhado de edifícios ou defesas.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיכֶם
  choice: Eu os castigarei
  rationale: Embora פקד tenha sentido amplo, incluindo visitar, ocupar-se de e pedir contas, o contexto explícito de juízo favorece “castigarei”; o objeto direto reproduz naturalmente em português a construção com עַל.
- source_word: כִּפְרִי מַעַלְלֵיכֶם
  choice: de acordo com o fruto de seus feitos
  rationale: Preserva tanto a ideia de correspondência expressa por כְּ quanto a metáfora hebraica do “fruto” da conduta; “feitos” mantém a conotação moral de מַעֲלָלִים.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” comunica com clareza a fórmula profética, e “Yahweh” translitera o nome divino expresso pelo tetragrama.
- source_word: וְהִצַּתִּי אֵשׁ
  choice: e atearei fogo
  rationale: Expressão portuguesa natural que comunica o sentido causativo de incendiar ou pôr fogo.
- source_word: בְּיַעְרָהּ
  choice: à sua floresta
  rationale: Traduz diretamente יַעַר como “floresta” e mantém o sufixo feminino por meio de “sua”, sem identificar no corpo do texto o referente poético.
- source_word: וְאָכְלָה
  choice: que consumirá
  rationale: Com o fogo como antecedente, “consumirá” traduz de modo idiomático a imagem de אָכַל, literalmente comer ou devorar.
- source_word: כָּל סְבִיבֶיהָ
  choice: tudo ao redor dela
  rationale: Conserva a abrangência de כֹּל e torna explícito o sufixo feminino, mantendo sua ligação com a entidade personificada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz o tetragrama; a transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Referente dos sufixos femininos em “sua floresta” e “ao redor dela”
  choice: Manter a referência feminina sem identificar expressamente o referente
  alternative: Explicitar Jerusalém, Sião ou o complexo palaciano
  rationale: Os sufixos hebraicos são femininos e provavelmente retomam a cidade personificada, mas o versículo não nomeia o referente; a tradução preserva essa abertura literária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a metáfora do fruto nem a ambiguidade do referente feminino. Os travessões destacam naturalmente a fórmula profética.
