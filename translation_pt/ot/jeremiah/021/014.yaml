  terminology: “Yahweh” reproduz consistentemente o tetragrama. “Castigarei”, “feitos”, “floresta” e “consumirá” são escolhas apropriadas ao registro profético e aos termos hebraicos. Os pronomes possessivos femininos preservam a personificação e a referência não especificada do hebraico.
