revisions:
- from: 'A palavra que veio a Jeremias da parte de Yahweh, quando o rei Zedequias lhe enviou Pasur, filho de Malquias, e Sofonias, filho de Maaseias, o sacerdote,[a] para dizerem:'
  to: 'A palavra que veio a Jeremias da parte de Yahweh, quando o rei Zedequias lhe enviou Pasur, filho de Malquias, e Sofonias, filho de Maaseias, o sacerdote,[a] dizendo:'
  rationale: A revisão substitui «para dizerem» por «dizendo», equivalente mais direto de לֵאמֹר e menos interpretativo quanto ao sujeito gramatical. A nota é ajustada para expor com precisão a ambiguidade de ligação do título sacerdotal, sem decidir a questão no texto principal nem invocar uma leitura confessional.
  reviewer_model: gpt-5.6-terra
