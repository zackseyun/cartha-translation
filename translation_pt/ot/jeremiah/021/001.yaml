  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/שְׁלֹ֨חַ אֵלָ֜י/ו הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ אֶת פַּשְׁחוּר֙ בֶּן מַלְכִּיָּ֔ה וְ/אֶת צְפַנְיָ֧ה בֶן מַעֲשֵׂיָ֛ה הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/001.yaml
  text: The word that came to Jeremiah from Yahweh when King Zedekiah sent to him Pashhur son of Malchiah and Zephaniah son of Maaseiah the priest[a], saying,
translation:
  language: pt
  text: 'A palavra que veio a Jeremias da parte de Yahweh, quando o rei Zedequias lhe enviou Pasur, filho de Malquias, e Sofonias, filho de Maaseias, o sacerdote,[a] dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, «o sacerdote» vem depois de «Maaseias» e pode estar ligado a ele; contudo, também pode identificar Sofonias. Sofonias é chamado sacerdote em Jeremias 29:25; 37:3; 52:24.
    reason: ambiguity
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Preserva a fórmula profética tradicional, na qual דָּבָר designa a palavra ou mensagem revelada.
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: que veio a Jeremias
  rationale: Expressa em português natural o idioma profético segundo o qual a palavra divina chega ao profeta.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: מֵאֵת marca a fonte da palavra; «da parte de» é idiomático em português, e «Yahweh» translitera o nome divino.
- source_word: בִּשְׁלֹחַ אֵלָיו הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: quando o rei Zedequias lhe enviou
  rationale: O infinitivo com בְּ tem valor temporal. A colocação de «lhe» é natural e mantém Jeremias como destinatário.
- source_word: פַּשְׁחוּר בֶּן מַלְכִּיָּה
  choice: Pasur, filho de Malquias
  rationale: Emprega as formas portuguesas correntes dos nomes e traduz בֶּן de maneira transparente.
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: Sofonias, filho de Maaseias, o sacerdote
  rationale: Reproduz a sequência hebraica e conserva, por meio da construção apositiva, a possível ambiguidade quanto ao referente de «o sacerdote».
- source_word: לֵאמֹר
  choice: 'para dizerem:'
  rationale: No contexto, os dois enviados são os portadores da fala introduzida no versículo seguinte; o plural é exigido naturalmente em português, embora esteja implícito no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o caráter de nome próprio sem substituir seu sentido por um título.
- issue: Referente de הַכֹּהֵן («o sacerdote»)
  choice: Manter a aposição potencialmente ambígua
  alternative: Sofonias, o sacerdote, filho de Maaseias
  rationale: A ordem hebraica pode ser lida superficialmente como se o título qualificasse Maaseias, embora outras referências identifiquem Sofonias como sacerdote. A tradução não deve eliminar silenciosamente essa tensão sintática.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas bíblicas correntes dos nomes próprios. A frase permanece aberta com dois-pontos porque a mensagem dos enviados começa no versículo seguinte.
