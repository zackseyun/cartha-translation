  naturalness: O texto é claro e de registro apropriado. “Dirigi o meu rosto contra” conserva a imagem e soa mais natural em português moderno do que um calque rígido, além de expressar melhor a orientação deliberada. “Na mão” mantém a imagem singular do hebraico e continua compreensível.
