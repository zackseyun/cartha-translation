base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/010.yaml
  text: For I have set my face against this city for harm and not for good[a], declares Yahweh. It will be given into the hand of the king of Babylon[b], and he will burn it with fire.
translation:
  language: pt
  text: Pois dirigi o meu rosto contra esta cidade para o mal e não para o bem[a] — declara Yahweh. Ela será entregue na mão do rei da Babilônia[b], e ele a queimará com fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a calamidade” ou “para o dano”. Aqui, o hebraico רָעָה refere-se ao mal que sobrevém como calamidade ou juízo que traz dano, não à prática de mal moral por Deus.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na mão do rei da Babilônia”, expressão que significa ficar sob o poder dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתִּי פָנַי
  choice: voltei o meu rosto contra
  rationale: Preserva a imagem do idioma hebraico e expressa oposição deliberada. Em português, “voltar o rosto contra” soa mais natural do que o calque “pôr o rosto contra”.
- source_word: בָּעִיר הַזֹּאת
  choice: contra esta cidade
  rationale: A preposição “contra” explicita em português a orientação hostil indicada pelo contexto de juízo.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: para o mal, e não para o bem
  rationale: Mantém a antítese ampla e contundente do hebraico. Aqui “mal” designa dano ou calamidade, sem resolver silenciosamente a amplitude lexical de רָעָה.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e clareza a fórmula profética e translitera o nome divino.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: nas mãos do rei da Babilônia
  rationale: Conserva a metáfora hebraica de estar sob o poder de alguém, usando a forma idiomática corrente em português.
- source_word: תִּנָּתֵן
  choice: será entregue
  rationale: Expressa naturalmente o nifal passivo e, no contexto, comunica a entrega da cidade ao poder do conquistador.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: e ele a queimará com fogo
  rationale: Mantém a construção ativa do hebraico, com o rei da Babilônia como referente mais próximo do sujeito masculino implícito, e preserva a expressão enfática “com fogo”.
theological_decisions:
- issue: Sentido do mal atribuído ao propósito judicial de Yahweh em לְרָעָה
  choice: para o mal
  alternative: para a calamidade; para o dano
  rationale: A tradução formal “mal” conserva a tensão e a oposição lexical com “bem”. A nota esclarece que, neste contexto, trata-se do mal sofrido pela cidade — calamidade ou dano judicial — e não de perversidade moral em Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem hebraica do rosto e a antítese “mal/bem” foram preservadas; as notas esclarecem os idiomas e a amplitude lexical sem apagar a tensão do texto.
