id: JER.21.8
reference: Jeremiah 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֤ם הַ/זֶּה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֤י נֹתֵן֙ לִ/פְנֵי/כֶ֔ם אֶת דֶּ֥רֶךְ הַ/חַיִּ֖ים וְ/אֶת דֶּ֥רֶךְ הַ/מָּֽוֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/008.yaml
  text: 'And to this people you shall say[a], ‘Thus says Yahweh: Behold, I am setting before you the way of life and the way of death.’'
translation:
  language: pt
  text: 'E a este povo você dirá: “Assim diz Yahweh: Eis que ponho[a] diante de vocês o caminho da vida e o caminho da morte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dou diante de vocês”. O verbo hebraico significa literalmente “dar”, mas aqui a expressão indica pôr ou colocar alternativas diante de alguém.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְ/אֶל
  choice: E a
  rationale: A conjunção e a preposição ligam a ordem ao contexto anterior e indicam o destinatário da mensagem, sem ampliar o sentido.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o substantivo coletivo singular e o demonstrativo do hebraico.
- source_word: תֹּאמַר
  choice: você dirá
  rationale: O imperfeito tem força diretiva neste contexto; o futuro em português comunica a instrução dada a Jeremias com naturalidade.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética de mensageiro e seu registro solene, vertendo diretamente o nome divino.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Expressa a apresentação enfática e solene da ação divina sem acrescentar uma interpretação.
- source_word: נֹתֵן
  choice: ponho
  rationale: Embora נתן signifique literalmente “dar”, com “diante de vocês” e os dois caminhos apresentados como alternativas, “pôr diante” é a expressão idiomática natural em português.
- source_word: לִפְנֵיכֶם
  choice: diante de vocês
  rationale: Conserva a imagem de alternativas apresentadas perante os destinatários e explicita corretamente o plural.
- source_word: דֶּרֶךְ הַחַיִּים
  choice: o caminho da vida
  rationale: Mantém a metáfora de um curso ou rumo que conduz à vida e conserva a formulação nominal hebraica.
- source_word: דֶּרֶךְ הַמָּוֶת
  choice: o caminho da morte
  rationale: Preserva o paralelismo antitético equilibrado com “o caminho da vida”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o translitera em vez de substituí-lo por um título, sem acrescentar uma interpretação denominacional.
- issue: Sentido dos caminhos da vida e da morte
  choice: Manter a formulação metafórica sem explicar no corpo do versículo
  alternative: Explicitar como escolha moral, salvação ou sobrevivência física
  rationale: O versículo apresenta dois caminhos em tensão, enquanto o contexto subsequente esclarece suas consequências. A tradução não antecipa nem restringe essa explicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a solenidade profética, enquanto “você” e “vocês” tornam explícita a mudança entre o destinatário singular da ordem (Jeremias) e o povo como destinatário plural da declaração.
