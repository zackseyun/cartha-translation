  text: הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב וּ/בָ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יּוֹצֵא֩ וְ/נָפַ֨ל עַל הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עֲלֵי/כֶם֙ יחיה וְ/הָֽיְתָה לּ֥/וֹ נַפְשׁ֖/וֹ לְ/שָׁלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/009.yaml
  text: The one who stays in this city will die by the sword[a], by famine, and by pestilence; but the one who goes out and defects to the Chaldeans who are besieging you will live[b], and his life will be to him as plunder.
translation:
  language: pt
  text: Quem permanecer nesta cidade morrerá pela espada, pela fome e pela peste; mas quem sair e se entregar[a] aos caldeus que estão cercando vocês viverá, e sua vida lhe será como despojo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cair sobre”. No contexto militar, a expressão hebraica significa passar para o lado inimigo ou entregar-se a ele.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua vida lhe será por despojo”; isto é, escapará levando consigo apenas a própria vida.
    reason: idiom_explanation
lexical_decisions:
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: quem permanecer nesta cidade
  rationale: O particípio de ישׁב indica aqui permanecer na cidade sitiada, não simplesmente estar sentado ou morar nela. “Quem permanecer” expressa com naturalidade o sentido contextual e conserva o valor representativo singular.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: pela espada, pela fome e pela peste
  rationale: Mantém a tríade recorrente em Jeremias. “Espada” preserva a imagem concreta de חרב, e “peste” é uma tradução atual e precisa de דבר neste contexto de juízo.
- source_word: וְהַיּוֹצֵא וְנָפַל עַל
  choice: mas quem sair e se entregar
  rationale: O ו inicial introduz contraste com a sentença anterior. No contexto militar, נפל על é uma expressão idiomática para passar ao lado inimigo ou entregar-se a ele; “se entregar” é natural em português e não exige atribuir à pessoa uma motivação política mais ampla, como poderia sugerir “desertar”.
- source_word: הַכַּשְׂדִּים
  choice: aos caldeus
  rationale: Conserva o etnônimo empregado no texto hebraico, em vez de substituí-lo pelo termo histórico mais abrangente “babilônios”.
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: que estão cercando vocês
  rationale: O particípio de צור descreve o cerco militar em curso. “Vocês” reproduz o objeto plural e favorece ampla compreensão no português moderno.
- source_word: יִחְיֶה
  choice: viverá
  rationale: Preserva o sentido lexical direto do verbo חיה; neste contexto, a ideia é sobreviver ao cerco.
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  choice: e terá a própria vida como despojo
  rationale: A formulação conserva a metáfora hebraica do despojo e, ao mesmo tempo, soa compreensível em português. O sentido é escapar da calamidade levando consigo apenas a vida.
- source_word: נַפְשׁוֹ
  choice: a própria vida
  rationale: Neste contexto, נפשׁ designa a vida da pessoa, não especificamente uma alma imaterial. “A própria vida” evita introduzir uma distinção antropológica ausente do texto.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ na expressão de sobrevivência
  choice: Traduzir נַפְשׁוֹ como “a própria vida”.
  alternative: “sua alma”
  rationale: O versículo trata da sobrevivência física durante o cerco. “Alma” poderia sugerir uma afirmação sobre a parte imaterial do ser humano que esta expressão hebraica não pretende fazer.
- issue: Natureza do ato expresso por נפל על no contexto do cerco
  choice: “se entregar aos caldeus”
  alternative: “desertar para os caldeus” ou, literalmente, “cair para o lado dos caldeus”
  rationale: A expressão indica passar para o lado da força sitiante. “Se entregar” comunica o ato militar exigido sem acrescentar uma avaliação moral ou uma motivação política não explicitada no hebraico.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural hebraico e evita formas excessivamente arcaicas. A metáfora final do despojo foi mantida no texto principal e esclarecida em nota.
