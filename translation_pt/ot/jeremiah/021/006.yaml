  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִכֵּיתִ֗י אֶת יֽוֹשְׁבֵי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת הָ/אָדָ֖ם וְ/אֶת הַ/בְּהֵמָ֑ה בְּ/דֶ֥בֶר גָּד֖וֹל יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/006.yaml
  text: And I will strike the inhabitants of this city, both man and beast; they will die by a great pestilence.
translation:
  language: pt
  text: E ferirei os habitantes desta cidade, tanto as pessoas como os animais; morrerão de uma grande epidemia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: E ferirei
  rationale: O hifil de נכה expressa a ação direta de atingir ou ferir. “Ferirei” mantém a solenidade profética sem antecipar desnecessariamente a morte, explicitada na oração seguinte.
- source_word: יֹשְׁבֵי הָעִיר הַזֹּאת
  choice: os habitantes desta cidade
  rationale: O particípio de ישב designa os que moram na cidade; “habitantes” é natural, claro e apropriado ao registro do oráculo.
- source_word: הָאָדָם
  choice: as pessoas
  rationale: Aqui אָדָם tem sentido coletivo e contrasta a população humana com os animais. “As pessoas” comunica esse coletivo de modo corrente em português.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: בְּהֵמָה pode abranger animais, sobretudo os domesticados. “Animais” evita restringir indevidamente o referente a rebanhos ou gado.
- source_word: וְאֶת הָאָדָם וְאֶת הַבְּהֵמָה
  choice: tanto as pessoas como os animais
  rationale: A construção reproduz a inclusão enfática dos dois grupos marcada pela repetição de אֵת com וְ.
- source_word: בְּדֶבֶר גָּדוֹל
  choice: de uma grande epidemia
  rationale: דֶּבֶר denota uma doença epidêmica ou peste como instrumento de juízo. “Epidemia” é claro no português moderno, enquanto “grande” preserva diretamente גָּדוֹל.
- source_word: יָמֻתוּ
  choice: morrerão
  rationale: O imperfeito qal anuncia o resultado futuro do golpe divino; o futuro simples é natural e exato em português.
theological_decisions:
- issue: Sentido de אָדָם na fórmula de juízo que contrapõe seres humanos e animais
  choice: as pessoas
  alternative: o homem
  rationale: O substantivo singular tem aqui força coletiva. “As pessoas” conserva a oposição entre humanos e animais sem sugerir que somente homens do sexo masculino sejam atingidos.
- issue: Agência divina e relação entre ferir e morrer
  choice: “ferirei” seguido de “morrerão”
  alternative: “matarei” ou “abaterei”
  rationale: A formulação mantém a ação divina explícita em וְהִכֵּיתִי e deixa a oração seguinte declarar o resultado mortal, sem fundir as duas afirmações.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Preserva a coordenação direta e o tom de juízo profético do hebraico, sem arcaísmos como “pestilência” ou “bestas”.
