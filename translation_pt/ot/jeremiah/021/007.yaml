revisions:
- from: “Depois disso”, declara Yahweh, “entregarei Zedequias, rei de Judá, seus servos, o povo e os que restarem nesta cidade depois da peste, da espada e da fome nas mãos de Nabucodonosor[a], rei da Babilônia, nas mãos dos inimigos deles e nas mãos dos que procuram tirar-lhes a vida. Ele os matará ao fio da espada; não os poupará, nem terá pena, nem mostrará compaixão.”
  to: “Depois disso”, declara Yahweh, “entregarei Zedequias, rei de Judá, seus servos, o povo e os que sobreviverem nesta cidade à peste, à espada e à fome nas mãos de Nabucodonosor[a], rei da Babilônia, nas mãos dos inimigos deles e nas mãos dos que procuram tirar-lhes a vida. Ele os matará ao fio da espada; não os poupará, nem terá pena, nem mostrará compaixão.”
  rationale: A revisão elimina a ambiguidade gráfica que poderia fazer de Yahweh o sujeito de “matará”, melhora a expressão dos sobreviventes dos três flagelos e corrige a informação lexical da nota. O restante é preservado por refletir bem o hebraico e manter um português moderno e solene.
