  text: וְ/אַחֲרֵי כֵ֣ן נְאֻם יְהוָ֡ה אֶתֵּ֣ן אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֣ה וְ/אֶת עֲבָדָ֣י/ו וְ/אֶת הָ/עָ֡ם וְ/אֶת הַ/נִּשְׁאָרִים֩ בָּ/עִ֨יר הַ/זֹּ֜את מִן הַ/דֶּ֣בֶר מִן הַ/חֶ֣רֶב וּ/מִן הָ/רָעָ֗ב בְּ/יַד֙ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וּ/בְ/יַד֙ אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הִכָּ֣/ם לְ/פִי חֶ֔רֶב לֹֽא יָח֣וּס עֲלֵי/הֶ֔ם וְ/לֹ֥א יַחְמֹ֖ל וְ/לֹ֥א יְרַחֵֽם־־־־־׀־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/007.yaml
  text: And after that[a], declares Yahweh, I will give Zedekiah king of Judah, his servants, the people, and those left in this city from the plague, from the sword, and from the famine into the hand of Nebuchadnezzar king of Babylon, into the hand of their enemies, and into the hand of those seeking their life; and he will strike them down with the edge of the sword. He will not spare them or have pity or compassion.
translation:
  language: pt
  text: “Depois disso”, declara Yahweh, “entregarei Zedequias, rei de Judá, seus servos, o povo e os que sobreviverem nesta cidade à peste, à espada e à fome nas mãos de Nabucodonosor[a], rei da Babilônia, nas mãos dos inimigos deles e nas mãos dos que procuram tirar-lhes a vida. Ele os matará ao fio da espada; não os poupará, nem terá pena, nem mostrará compaixão.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Nabucadrezar”; tradicionalmente vertido em português como “Nabucodonosor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa com naturalidade a transição temporal e preserva a sequência em relação aos atos de juízo anteriores.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a força solene da fórmula profética e representa diretamente o nome divino.
- source_word: אֶתֵּן ... בְּיַד
  choice: entregarei ... nas mãos de
  rationale: O verbo 'entregar' comunica em português o sentido contextual de dar alguém ao poder de outro, enquanto 'nas mãos de' preserva a imagem hebraica repetida.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Conserva o termo amplo do hebraico, que no contexto régio pode abranger servidores e oficiais sem especificar indevidamente a função.
- source_word: הַנִּשְׁאָרִים
  choice: os que restarem
  rationale: Representa o particípio como os sobreviventes restantes, sem introduzir a possível carga teológica de 'remanescente'.
- source_word: מִן הַדֶּבֶר מִן הַחֶרֶב וּמִן הָרָעָב
  choice: depois da peste, da espada e da fome
  rationale: Neste contexto, מן indica aquilo a que os restantes sobreviveram. 'Depois de' torna essa relação clara em português, e a tríade do juízo é preservada.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: os que procuram tirar-lhes a vida
  rationale: Traduz idiomaticamente a expressão hebraica 'os que procuram a vida deles', cujo sentido é buscar matá-los.
- source_word: וְהִכָּם לְפִי חֶרֶב
  choice: Ele os matará ao fio da espada
  rationale: Preserva a imagem tradicional de 'fio da espada' e explicita o resultado letal do verbo no contexto.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida; a forma hebraica mais próxima é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; 'Yahweh' representa o nome próprio sem substituí-lo por um título.
- issue: Tríplice negação final
  choice: não os poupará, nem terá pena, nem mostrará compaixão
  alternative: não terá consideração por eles, não terá dó nem misericórdia
  rationale: Mantém três expressões distintas e cumulativas, preservando a intensidade do juízo sem fundi-las em uma só ideia.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe fluida. Mantêm-se a repetição enfática de “nas mãos de”, a metáfora “ao fio da espada” e a tríade final. As aspas distinguem a declaração divina introduzida pela fórmula profética.
