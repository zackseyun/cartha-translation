  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלַ֜יִ/ךְ יֹשֶׁ֧בֶת הָ/עֵ֛מֶק צ֥וּר הַ/מִּישֹׁ֖ר נְאֻם יְהוָ֑ה הָ/אֹֽמְרִים֙ מִֽי יֵחַ֣ת עָלֵ֔י/נוּ וּ/מִ֥י יָב֖וֹא בִּ/מְעוֹנוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
translation:
  language: pt
  text: '“Eis que estou contra você, habitante do vale, rocha da planície”, declara Yahweh, “vocês que dizem: ‘Quem descerá contra nós[a]? Quem entrará em nossas moradas[b]?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo hebraico é difícil. Também pode ser traduzido: “Quem virá contra nós?” A ideia é a confiança da cidade em que nenhum atacante conseguiria alcançá-la.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “moradas”; no contexto, a palavra pode sugerir habitações seguras ou lugares fortificados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Eis que estou contra você
  rationale: A fórmula introduz solenemente o anúncio divino; neste contexto de juízo, אֵלַיִךְ expressa oposição hostil. O singular feminino é preservado no tratamento da cidade personificada.
- source_word: יֹשֶׁבֶת הָעֵמֶק
  choice: habitante do vale
  rationale: Mantém o particípio feminino singular em sentido vocativo e conserva a imagem topográfica sem explicá-la além do texto.
- source_word: צוּר הַמִּישֹׁר
  choice: rocha da planície
  rationale: Traduz literalmente a imagem de צוּר e o sentido geográfico usual de מִישֹׁר, evitando interpretar antecipadamente a rocha como fortaleza.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética e translitera o nome divino conforme a orientação do projeto.
- source_word: הָאֹמְרִים
  choice: vocês que dizem
  rationale: O plural morfológico se refere aos habitantes que falam dentro do tratamento singular da cidade personificada. A alternância de número é mantida para preservar a tensão retórica do hebraico.
- source_word: מִי יֵחַת עָלֵינוּ
  choice: Quem descerá contra nós?
  rationale: Conserva o sentido espacial e militar provável do verbo difícil, sem eliminar sua ambiguidade lexical.
- source_word: וּמִי יָבוֹא בִּמְעוֹנוֹתֵינוּ
  choice: Quem entrará em nossas moradas?
  rationale: Com בְּ e o substantivo מָעוֹן, 'entrará em' é natural em português; 'moradas' preserva o sentido básico sem impor a interpretação de fortalezas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração identifica explicitamente o nome divino e segue a preferência declarada do projeto, sem introduzir uma formulação denominacional.
- issue: Cidade personificada no singular e habitantes falando no plural
  choice: Manter 'você' para a cidade e 'vocês' para os que dizem
  alternative: Uniformizar todo o tratamento no singular ou todo no plural
  rationale: O hebraico combina uma destinatária feminina singular com um particípio plural referente aos habitantes. A mudança de número preserva essa tensão em vez de a harmonizar.
- issue: Sentido defensivo das imagens topográficas
  choice: Preservar 'rocha', 'planície' e 'moradas' no texto principal
  alternative: Explicitar 'fortaleza' ou 'lugares fortificados'
  rationale: O contexto sugere confiança na segurança da cidade, mas as palavras hebraicas não exigem que a interpretação militar substitua as imagens concretas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Eis que' preserva o tom profético solene; 'você/vocês' torna audível a alternância entre a cidade personificada e seus habitantes. A pontuação apresenta a declaração inteira como fala divina.
