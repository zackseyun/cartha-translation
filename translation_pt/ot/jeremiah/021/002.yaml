  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דְּרָשׁ נָ֤א בַעֲדֵ֨/נוּ֙ אֶת יְהוָ֔ה כִּ֛י נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל נִלְחָ֣ם עָלֵ֑י/נוּ אוּלַי֩ יַעֲשֶׂ֨ה יְהוָ֤ה אוֹתָ֨/נוּ֙ כְּ/כָל נִפְלְאֹתָ֔י/ו וְ/יַעֲלֶ֖ה מֵ/עָלֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/002.yaml
  text: Please inquire of Yahweh on our behalf[a], because Nebuchadnezzar king of Babylon is fighting against us. Perhaps Yahweh will act for us according to all his wondrous acts[c][b], so that he will withdraw from us.
translation:
  language: pt
  text: “Por favor, consulte Yahweh em nosso favor, pois Nabucodonosor, rei da Babilônia, está guerreando contra nós. Talvez Yahweh aja em nosso favor conforme todos os seus feitos maravilhosos[a], e ele se retire de nós.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “conforme todas as suas maravilhas”, isto é, segundo o padrão dos atos extraordinários realizados por Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e ele suba de sobre nós”; no contexto, a expressão indica que Nabucodonosor deixaria de atacar e se retiraria.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָשׁ נָא
  choice: Por favor, consulte
  rationale: O imperativo de דרש com נָא é um pedido cortês para que o profeta busque uma resposta de Deus. “Consulte” comunica esse sentido de consulta profética com naturalidade.
- source_word: בַעֲדֵנוּ
  choice: em nosso favor
  rationale: בְּעַד exprime aqui representação ou intercessão; “em nosso favor” preserva esse valor sem impor uma formulação excessivamente técnica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִלְחָם עָלֵינוּ
  choice: está guerreando contra nós
  rationale: O particípio nifal descreve ação militar hostil em andamento. “Está guerreando” mantém explícito o contexto bélico.
- source_word: אוּלַי
  choice: Talvez
  rationale: Preserva a incerteza esperançosa do pedido.
- source_word: יַעֲשֶׂה יְהוָה אוֹתָנוּ
  choice: Yahweh aja em nosso favor
  rationale: A expressão hebraica é incomum se vertida literalmente como “faça conosco”. No contexto, espera-se uma intervenção favorável de Yahweh; “aja em nosso favor” comunica isso sem especificar como ocorrerá.
- source_word: כְּכָל נִפְלְאֹתָיו
  choice: conforme todos os seus feitos maravilhosos
  rationale: נִפְלָאוֹת designa atos extraordinários de Deus. “Feitos maravilhosos” conserva tanto a ideia de ações quanto seu caráter extraordinário.
- source_word: וְיַעֲלֶה מֵעָלֵינוּ
  choice: e ele se retire de nós
  rationale: Literalmente, o verbo fala em “subir de sobre” eles; no contexto militar, refere-se ao afastamento do rei atacante. O pronome preserva a referência implícita a Nabucodonosor.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: É a forma convencional e amplamente reconhecida em português; a variante “Nabucodreṣar” refletiria mais de perto a grafia hebraica deste versículo, mas seria menos familiar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sujeito implícito de וְיַעֲלֶה מֵעָלֵינוּ
  choice: “ele” refere-se a Nabucodonosor, que se retiraria
  alternative: 'Preservar a formulação mais literal e ambígua: “e suba de sobre nós”'
  rationale: O antecedente contextual natural é Nabucodonosor, rei que está atacando. A tradução explicita apenas por pronome essa referência, evitando transformar a cláusula em uma explicação interpretativa extensa.
- issue: Sentido favorável de יַעֲשֶׂה ... אוֹתָנוּ
  choice: “aja em nosso favor”
  alternative: “faça conosco”; “trate-nos”
  rationale: O contexto manifesta a esperança de uma intervenção salvadora, mas não garante seu cumprimento. “Talvez” mantém plenamente a incerteza do pedido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das cláusulas acompanha de perto o hebraico, mas os idiomas são expressos naturalmente. Os marcadores aparecem no texto junto às expressões que explicam.
