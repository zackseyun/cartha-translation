id: JER.21.12
reference: Jeremiah 21:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֵּ֣ית דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה דִּ֤ינוּ לַ/בֹּ֨קֶר֙ מִשְׁפָּ֔ט וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עוֹשֵׁ֑ק פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מעללי/הם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/012.yaml
  text: 'House of David[a], thus says Yahweh: Administer justice in the morning, and deliver the one who has been robbed from the hand of the oppressor, lest my wrath go out like fire and burn with no one to quench it[c][b], because of the evil of their deeds.'
translation:
  language: pt
  text: 'Casa de Davi, assim diz Yahweh: “Administrem a justiça pela manhã[a] e livrem a pessoa roubada da mão do opressor[b], para que a minha ira não saia como fogo[c] e arda sem que ninguém a apague, por causa da maldade dos atos deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deem uma sentença pela manhã” ou “julguem todas as manhãs com justiça”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “da mão do opressor”, expressão que significa ser liberto do poder ou controle de alguém.
    reason: cultural_note
  - marker: c
    text: 'Ou: “o meu furor não saia como fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית דָּוִד
  choice: Casa de Davi
  rationale: A expressão construta funciona como vocativo dirigido à dinastia ou casa real davídica; a forma tradicional é clara em português e não restringe indevidamente o referente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: דִּינוּ ... מִשְׁפָּט
  choice: Administrem a justiça
  rationale: A combinação do imperativo judicial com מִשְׁפָּט exige ação governamental concreta; a expressão portuguesa comunica tanto a dimensão jurídica quanto a ética.
- source_word: לַבֹּקֶר
  choice: pela manhã
  rationale: Mantém o valor temporal simples do hebraico sem tornar explícita a ideia possível, mas não obrigatória, de repetição diária.
- source_word: וְהַצִּילוּ גָזוּל
  choice: e livrem a pessoa roubada
  rationale: Expressa a intervenção concreta exigida em favor de quem foi despojado, tornando natural em português o particípio passivo substantivado.
- source_word: מִיַּד עוֹשֵׁק
  choice: da mão do opressor
  rationale: Preserva a imagem hebraica da mão como poder ou controle; a nota esclarece o valor idiomático.
- source_word: פֶּן
  choice: para que ... não
  rationale: Forma portuguesa natural para a advertência preventiva ou consequência ameaçada introduzida por פֶּן, sem enfraquecer sua solenidade.
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: a minha ira não saia como fogo
  rationale: Conserva o movimento da ira que sai e a comparação explícita com o fogo, sem converter a imagem em uma explicação.
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: e arda sem que ninguém a apague
  rationale: Dá continuidade natural à metáfora do fogo e preserva a ideia de que não haverá quem o extinga.
- source_word: מִפְּנֵי רֹעַ מעלליהם
  choice: por causa da maldade dos atos deles
  rationale: Reproduz o plural pronominal de terceira pessoa do texto hebraico, embora seu referente imediato permaneça implícito, evitando resolver silenciosamente a ambiguidade.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Preserva o nome pessoal presente no hebraico e segue a convenção do projeto, sem substituí-lo por um título.
- issue: Alcance do mandamento judicial
  choice: Administrem a justiça pela manhã
  alternative: Julguem todas as manhãs com justiça; deem uma sentença pela manhã
  rationale: Mantém unidas a função judicial e a exigência ética, sem impor habitualidade explícita nem limitar a ordem ao ato de pronunciar sentenças.
- issue: Referente do sufixo plural em מעלליהם
  choice: dos atos deles
  alternative: dos atos de vocês
  rationale: A segunda pessoa do discurso poderia levar à adaptação contextual “de vocês”, mas o texto consonantal/vocalizado traz terceira pessoa plural. A tradução preserva essa tensão referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância no plural por causa do vocativo coletivo “Casa de Davi”. A formulação conserva as imagens hebraicas de mão e fogo. Os marcadores aparecem no texto na ordem [a], [b], [c], junto às expressões que explicam.
