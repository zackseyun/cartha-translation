source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֣י מֵסֵב֮ אֶת כְּלֵ֣י הַ/מִּלְחָמָה֮ אֲשֶׁ֣ר בְּ/יֶדְ/כֶם֒ אֲשֶׁ֨ר אַתֶּ֜ם נִלְחָמִ֣ים בָּ֗/ם אֶת מֶ֤לֶךְ בָּבֶל֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים הַ/צָּרִ֣ים עֲלֵי/כֶ֔ם מִ/ח֖וּץ לַֽ/חוֹמָ֑ה וְ/אָסַפְתִּ֣י אוֹתָ֔/ם אֶל תּ֖וֹךְ הָ/עִ֥יר הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/004.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Behold, I am turning back the weapons of war that are in your hands, with which you are fighting against the king of Babylon and against the Chaldeans who are besieging you outside the wall, and I will gather them into the midst of this city.'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Deus de Israel: “Eis que farei voltar as armas de guerra que vocês têm nas mãos e com as quais estão lutando contra o rei da Babilônia e contra os caldeus que estão sitiando vocês do lado de fora da muralha; e eu as reunirei[a] no meio desta cidade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou o pronome pode se referir ao rei da Babilônia e aos caldeus; nesse caso, o sentido é que Deus reunirá as forças inimigas dentro da cidade.
    reason: Leitura alternativa do referente do pronome hebraico, preservando uma ambiguidade contextual genuína.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Mantém a força solene e enfática da declaração profética em português digno e corrente.
- source_word: מֵסֵב
  choice: farei voltar
  rationale: Expressa a ação divina iminente indicada pelo particípio e preserva a imagem de fazer as armas mudarem de direção, sem especificar além do hebraico exatamente como isso ocorre.
- source_word: כְּלֵי הַמִּלְחָמָה
  choice: as armas de guerra
  rationale: É uma formulação natural em português e conserva o sentido militar da expressão hebraica.
- source_word: בְּיֶדְכֶם
  choice: que vocês têm nas mãos
  rationale: Retém a imagem concreta do hebraico e indica que se trata das armas atualmente em poder dos defensores.
- source_word: נִלְחָמִים בָּם
  choice: com as quais estão lutando
  rationale: Torna clara a função instrumental da preposição e preserva o aspecto contínuo do particípio.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Conserva a designação étnico-histórica específica empregada no texto, sem generalizá-la como 'babilônios'.
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: que os cercam
  rationale: No contexto de tropas posicionadas diante da muralha, o verbo descreve um cerco; 'cercam' é natural e claro em português.
- source_word: מִחוּץ לַחוֹמָה
  choice: do lado de fora da muralha
  rationale: Comunica claramente a posição das forças sitiantes e usa 'muralha' para a defesa urbana.
- source_word: וְאָסַפְתִּי אוֹתָם
  choice: e eu as reunirei
  rationale: No texto principal, o pronome é entendido como retomando 'armas de guerra'. A flexão feminina é exigida por 'armas' em português; a possível referência às forças inimigas é preservada em nota.
- source_word: אֶל תּוֹךְ הָעִיר הַזֹּאת
  choice: no meio desta cidade
  rationale: Reproduz de modo natural a ideia de movimento para o interior da cidade.
theological_decisions:
- issue: Referente do pronome em 'eu as reunirei no meio desta cidade'
  choice: O texto principal entende que o pronome se refere às armas de guerra.
  alternative: O pronome pode referir-se ao rei da Babilônia e aos caldeus, indicando que Deus fará as forças inimigas entrarem na cidade.
  rationale: A concordância e a estrutura da frase permitem tomar 'armas de guerra' como antecedente, produzindo a sequência em que Deus desvia e reúne as armas dos defensores dentro da cidade. Como a referência às forças babilônicas também é contextualmente possível, a ambiguidade é registrada em nota, sem ser eliminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural da segunda pessoa, mantém o termo histórico 'caldeus' e conserva o nome divino 'Yahweh'. A nota foi colocada junto ao pronome cuja referência é discutida.
