  text: וְ/נִלְחַמְתִּ֤י אֲנִי֙ אִתְּ/כֶ֔ם בְּ/יָ֥ד נְטוּיָ֖ה וּ/בִ/זְר֣וֹעַ חֲזָקָ֑ה וּ/בְ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֥צֶף גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/005.yaml
  text: And I myself will fight against you with an outstretched hand and a strong arm[b][a], and with anger and wrath and great fury.
translation:
  language: pt
  text: Eu mesmo lutarei contra vocês com mão estendida e braço forte[a], e com ira, com furor e com grande indignação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “com mão estendida e braço forte”, expressão tradicional do poder divino decisivo, muitas vezes associada ao êxodo, mas aqui voltada para o juízo.
    reason: cross_reference
  - marker: b
    text: 'Ou: “e grande ira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחַמְתִּי
  choice: lutarei
  rationale: 'O nifal de לחם, na primeira pessoa do singular, expressa aqui ação futura: “lutarei”. A forma é direta, natural e preserva a ação hostil de Deus.'
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome independente reforça a pessoa já indicada pelo verbo. “Eu mesmo” preserva a ênfase de que o próprio SENHOR agirá.
- source_word: אִתְּכֶם
  choice: contra vocês
  rationale: Com נלחם, a preposição indica oposição hostil. “Vocês” oferece leitura natural e amplamente compreensível no português contemporâneo.
- source_word: בְּיָד נְטוּיָה
  choice: com mão estendida
  rationale: Mantém a imagem antropomórfica hebraica e sua ressonância com fórmulas bíblicas de ação divina poderosa e decisiva.
- source_word: וּבִזְרֹעַ חֲזָקָה
  choice: e braço forte
  rationale: Reproduz de modo claro e direto o paralelismo com “mão estendida”, sem ampliar interpretativamente o adjetivo.
- source_word: וּבְאַף
  choice: com ira
  rationale: אַף significa literalmente “nariz”, mas neste uso idiomático denota ira. A tradução comunica o sentido sem perder o registro solene.
- source_word: וּבְחֵמָה
  choice: furor
  rationale: חֵמָה sugere calor, fúria ou cólera intensa. “Furor” diferencia o termo de אַף e preserva a acumulação enfática.
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: grande indignação
  rationale: קֶצֶף designa ira intensa ou indignação. “Grande indignação” preserva גָּדוֹל e evita uma repetição vocabular que apagaria a sequência de termos hebraicos.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Preservar “mão estendida e braço forte” como imagem do poder direto de Deus no juízo.
  alternative: Parafrasear como “com grande poder”.
  rationale: O hebraico emprega deliberadamente imagens corporais associadas à atuação divina decisiva. Mantê-las conserva a ressonância intertextual, inclusive a inversão de uma fórmula ligada ao êxodo, agora dirigida contra Jerusalém.
- issue: Acumulação de termos para a ira divina
  choice: Traduzir os três termos por “ira, furor e grande indignação”.
  alternative: Uniformizar dois ou mais termos como “ira” ou “cólera”.
  rationale: A sequência אַף, חֵמָה e קֶצֶף גָּדוֹל intensifica o anúncio de juízo. Vocábulos distintos em português preservam melhor essa progressão sem impor distinções técnicas rígidas.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” para o plural. A ordem foi levemente ajustada para fluência, mantendo a ênfase inicial em “Eu mesmo”, as imagens hebraicas e a acumulação solene de termos de juízo.
