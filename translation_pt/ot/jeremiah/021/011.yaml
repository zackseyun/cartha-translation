source:
  edition: WLC
  text: וּ/לְ/בֵית֙ מֶ֣לֶךְ יְהוּדָ֔ה שִׁמְע֖וּ דְּבַר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/011.yaml
  text: 'And to the house of the king of Judah: Hear the word of Yahweh[a].'
translation:
  language: pt
  text: 'E à casa do rei de Judá[a]: “Ouçam a palavra de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E quanto à casa do rei de Judá”. A preposição hebraica pode introduzir uma nova fala dirigida à casa real ou a respeito dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית
  choice: E à casa de
  rationale: Preserva tanto a ligação com o oráculo anterior, expressa por וּ, quanto o sentido de destinatário introduzido por לְ. “Casa” mantém a referência aberta à casa real, isto é, à família, corte ou dinastia, sem reduzi-la ao palácio.
- source_word: מֶלֶךְ יְהוּדָה
  choice: o rei de Judá
  rationale: Tradução direta e natural da cadeia construta, identificando o soberano sem paráfrase desnecessária.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שמע. A forma plural mostra que a ordem se dirige coletivamente à casa real; “ouçam” é corrente e conserva a força da convocação profética.
- source_word: דְּבַר
  choice: a palavra
  rationale: Mantém a fórmula profética tradicional e o caráter de pronunciamento divino, sem restringir o termo a uma simples informação ou mensagem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Referente de בֵית מֶלֶךְ יְהוּדָה
  choice: casa do rei de Judá
  alternative: palácio do rei de Judá; dinastia do rei de Judá
  rationale: “Casa” preserva a amplitude do hebraico, que pode abranger a família real, a corte ou a dinastia. Escolher “palácio” ou “dinastia” resolveria indevidamente essa abertura semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo plural “Ouçam” explicita naturalmente o número do hebraico. Os dois-pontos e as aspas sinalizam que a ordem constitui a fala dirigida à casa real; o marcador da nota aparece após a citação.
