  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֨י פֹקֵ֜ד עַל שְׁמַעְיָ֣ה הַ/נֶּחֱלָמִי֮ וְ/עַל זַרְע/וֹ֒ לֹא יִהְיֶ֨ה ל֜/וֹ אִ֣ישׁ יוֹשֵׁ֣ב בְּ/תוֹךְ הָ/עָ֣ם הַ/זֶּ֗ה וְ/לֹֽא יִרְאֶ֥ה בַ/טּ֛וֹב אֲשֶׁר אֲנִ֥י עֹשֶֽׂה לְ/עַמִּ֖/י נְאֻם יְהוָ֑ה כִּֽי סָרָ֥ה דִבֶּ֖ר עַל יְהוָֽה־־־־׀׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/032.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to punish Shemaiah the Nehelamite and his offspring. He will not have a man dwelling among this people, nor will he see the good that I am doing for my people, declares Yahweh[b], because he has spoken rebellion against Yahweh.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh: “Eis que pedirei contas a Semaías, o neelamita,[a] e à sua descendência. Ele não terá homem algum que habite no meio deste povo, nem verá o bem que farei em favor do meu povo, declara Yahweh, porque proferiu rebeldia contra Yahweh.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o sonhador”. O sentido exato do epíteto hebraico é incerto; por isso, ele foi mantido no texto como designação própria.
    reason: lexical_alternative
  - marker: b
    text: Ou “apostasia” ou “revolta” contra Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Conjunção inferencial natural que apresenta o juízo como consequência do oráculo anterior.
- source_word: הִנְנִי פֹקֵד עַל
  choice: Eis que pedirei contas a
  rationale: Preserva a força enfática de הִנְנִי e expressa פקד על como intervenção judicial punitiva, sem reduzir o verbo apenas a castigo físico.
- source_word: שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: Semaías, o neelamita
  rationale: Translitera o nome pessoal segundo a forma portuguesa consagrada e mantém o epíteto incerto como designação própria; a possível relação com sonhos fica em nota.
- source_word: וְעַל זַרְעוֹ
  choice: e à sua descendência
  rationale: זֶרַע designa aqui a posteridade em sentido coletivo; 'descendência' é claro e natural em português.
- source_word: לֹא יִהְיֶה לוֹ אִישׁ יוֹשֵׁב
  choice: Ele não terá nenhum homem que habite
  rationale: Mantém אִישׁ no masculino singular e comunica a ausência de um representante sobrevivente de sua linhagem.
- source_word: בְּתוֹךְ הָעָם הַזֶּה
  choice: no meio deste povo
  rationale: Reproduz com clareza a imagem espacial e social do hebraico.
- source_word: וְלֹא יִרְאֶה בַטּוֹב
  choice: nem verá o bem
  rationale: Conserva o idiomatismo hebraico sem perder inteligibilidade em português.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה לְעַמִּי
  choice: que farei ao meu povo
  rationale: O particípio pode expressar ação em curso ou iminente; o futuro se ajusta naturalmente ao bem prometido no contexto, sem eliminar essa nuance temporal.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Fórmula profética de encerramento vertida de modo atual e digno.
- source_word: כִּי סָרָה דִבֶּר עַל יְהוָה
  choice: porque falou rebeldia contra Yahweh
  rationale: Preserva a construção incomum com o substantivo סָרָה e sua gama de rebelião, apostasia ou revolta, sem explicitar além do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido teológico de סָרָה
  choice: rebeldia
  alternative: apostasia; revolta
  rationale: '''Rebeldia'' mantém a acusação de oposição a Yahweh sem restringi-la especificamente a abandono religioso formal ou insurreição política.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva imagens e tensões do hebraico, evitando arcaísmos desnecessários. Os marcadores [a] e [b] aparecem no texto principal e correspondem às notas.
