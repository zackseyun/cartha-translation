  text: וְ/נִמְצֵ֣אתִי לָ/כֶם֮ נְאֻם יְהוָה֒ וְ/שַׁבְתִּ֣י אֶת שבית/כם וְ/קִבַּצְתִּ֣י אֶ֠תְ/כֶם מִֽ/כָּל הַ/גּוֹיִ֞ם וּ/מִ/כָּל הַ/מְּקוֹמ֗וֹת אֲשֶׁ֨ר הִדַּ֧חְתִּי אֶתְ/כֶ֛ם שָׁ֖ם נְאֻם יְהוָ֑ה וַ/הֲשִׁבֹתִ֣י אֶתְ/כֶ֔ם אֶל הַ֨/מָּק֔וֹם אֲשֶׁר הִגְלֵ֥יתִי אֶתְ/כֶ֖ם מִ/שָּֽׁם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/014.yaml
  text: And I will let myself be found by you[a], declares Yahweh, and I will restore your fortunes and gather you from all the nations and from all the places where I have driven you, declares Yahweh, and I will bring you back to the place from which I sent you into exile.
translation:
  language: pt
  text: Eu me deixarei encontrar por vocês, declara Yahweh, e restaurarei a sorte de vocês[a]. Eu os reunirei dentre todas as nações e de todos os lugares para onde os expulsei, declara Yahweh, e os trarei de volta ao lugar de onde os mandei para o exílio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “restaurarei o cativeiro de vocês” ou “trarei de volta os seus cativos”. A expressão hebraica é um modo de dizer que Deus reverterá uma condição de exílio e aflição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצֵאתִי לָכֶם
  choice: Eu me deixarei encontrar por vocês
  rationale: Preserva o sentido passivo/reflexivo do nifal de מצא e a iniciativa divina, em português natural, sem ampliar o texto para “eu me revelarei”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a força solene da fórmula profética e representa o tetragrama como nome pessoal, não como título.
- source_word: וְשַׁבְתִּי אֶת שביתכם
  choice: mudarei a sorte de vocês
  rationale: 'Expressa o valor idiomático da locução hebraica: reverter a condição de exílio e desgraça. A possibilidade de leitura mais literal é preservada em nota.'
- source_word: וְקִבַּצְתִּי אֶתְכֶם
  choice: e os reunirei
  rationale: קבץ descreve a reunião de um povo disperso; “reunirei” é claro e natural no contexto de restauração.
- source_word: מִכָּל הַגּוֹיִם וּמִכָּל הַמְּקוֹמוֹת
  choice: dentre todas as nações e de todos os lugares
  rationale: 'Conserva os dois âmbitos paralelos da dispersão: as nações e os diversos lugares.'
- source_word: אֲשֶׁר הִדַּחְתִּי אֶתְכֶם שָׁם
  choice: para onde os expulsei
  rationale: O hifil de נדח comunica afastamento forçado ou banimento; “expulsei” mantém a força do juízo divino.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם
  choice: Eu os trarei de volta
  rationale: Reproduz claramente o valor causativo do hifil de שוב.
- source_word: אֲשֶׁר הִגְלֵיתִי אֶתְכֶם מִשָּׁם
  choice: de onde os mandei para o exílio
  rationale: O hifil de גלה indica deportar ou mandar ao exílio; a formulação é atual e mantém explícito o contexto exílico.
theological_decisions:
- issue: Sentido da expressão de restauração שׁוּב אֶת־שְׁבוּת/שְׁבִית
  choice: mudarei a sorte de vocês
  alternative: restaurarei o cativeiro de vocês; trarei de volta os seus cativos
  rationale: A expressão funciona como idioma para a reversão da calamidade e do exílio. Como as orações seguintes já descrevem a reunião e o retorno concretos, a tradução idiomática evita redundância sem eliminar a alternativa literal, registrada em nota.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A transliteração preserva o caráter de nome pessoal do tetragrama, sem substituí-lo por um título. “Javé” seria uma adaptação portuguesa possível, mas “Yahweh” mantém correspondência transparente com a forma hebraica reconstruída.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural por “vocês”. A colocação pronominal e a pontuação foram ajustadas à fluência brasileira sem perder ampla inteligibilidade internacional. O marcador [a] foi colocado junto à expressão que a nota explica.
