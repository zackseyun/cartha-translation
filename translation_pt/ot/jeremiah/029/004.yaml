reference: Jeremiah 29:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/כָל הַ֨/גּוֹלָ֔ה אֲשֶׁר הִגְלֵ֥יתִי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/004.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel, a todos os exilados que deportei[a] de Jerusalém para a Babilônia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que mandei para o exílio». O verbo hebraico está na forma causativa e significa fazer alguém ir para o exílio, isto é, deportar.'
    reason: Alternativa lexical que explicita a forma causativa do verbo hebraico.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e solene a fórmula profética de mensageiro; o presente em português corresponde ao valor idiomático da fórmula hebraica.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um título tradicional e lexicalmente transparente, sem o substituir pela interpretação «Todo-Poderoso».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica que identifica Yahweh como o Deus de Israel.
- source_word: לְכָל הַגּוֹלָה
  choice: a todos os exilados
  rationale: O substantivo hebraico é coletivo; o plural português comunica claramente que a mensagem se dirige a toda a comunidade deportada.
- source_word: הִגְלֵיתִי
  choice: que deportei
  rationale: O hifil de גלה expressa a ação causativa de levar alguém ao exílio. «Deportei» é conciso, atual e preserva a agência explícita do sujeito divino.
- source_word: מִירוּשָׁלַם בָּבֶלָה
  choice: de Jerusalém para a Babilônia
  rationale: Preserva tanto a origem marcada por מִן quanto o destino indicado pela terminação direcional em בָּבֶלָה.
theological_decisions:
- issue: Agência divina no exílio
  choice: que deportei
  alternative: que permiti que fossem levados para o exílio
  rationale: A primeira pessoa do verbo hebraico atribui diretamente a deportação a Yahweh. A tradução não enfraquece essa afirmação convertendo a ação em mera permissão nem transfere toda a agência para a Babilônia.
- issue: Representação do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de o substituir por um título.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Assim diz» conserva o tom profético; «deportei» evita uma formulação longa sem ocultar a força causativa nem a agência divina. O artigo em «para a Babilônia» segue o uso português corrente.
