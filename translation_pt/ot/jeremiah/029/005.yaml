  text: בְּנ֥וּ בָתִּ֖ים וְ/שֵׁ֑בוּ וְ/נִטְע֣וּ גַנּ֔וֹת וְ/אִכְל֖וּ אֶת פִּרְיָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/005.yaml
  text: Build houses and live in them[a]; plant gardens and eat their fruit.
translation:
  language: pt
  text: Construam casas e morem nelas[a]; plantem jardins e comam do seu fruto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “habitem nelas”. O verbo hebraico pode indicar residência estável.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנ֥וּ
  choice: Construam
  rationale: Imperativo qal masculino plural de בנה. “Construam” transmite de modo direto e natural a ordem, sem acrescentar nuance reflexiva ausente do texto.
- source_word: בָתִּ֖ים
  choice: casas
  rationale: Plural concreto de בית. “Casas” preserva o sentido de edificações destinadas à moradia, sem a conotação afetiva adicional de “lares”.
- source_word: וְשֵׁ֑בוּ
  choice: morem nelas
  rationale: O verbo ישב pode significar sentar-se, habitar, permanecer ou morar. Em relação a casas, “morem nelas” é idiomático e expressa residência estável sem ampliar o texto para “estabeleçam-se”.
- source_word: וְנִטְע֣וּ
  choice: plantem
  rationale: Imperativo qal masculino plural de נטע, verbo comum para plantar. “Plantem” é o equivalente direto em português.
- source_word: גַנּ֔וֹת
  choice: jardins
  rationale: Plural de גן. “Jardins” mantém o valor amplo do termo hebraico e não o restringe a “pomares”, embora o contexto mencione frutos.
- source_word: וְאִכְל֖וּ
  choice: comam
  rationale: Imperativo qal masculino plural de אכל. “Comam” é a forma simples e natural da ordem em português.
- source_word: אֶת פִּרְיָֽן
  choice: do seu fruto
  rationale: פְּרִי significa fruto ou produto da terra, e o sufixo feminino plural retoma “jardins”. “Do seu fruto” preserva a imagem agrícola e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos no plural refletem as formas hebraicas; “morem” foi preferido a “habitem” no texto principal por ser mais corrente, enquanto a alternativa formal foi preservada em nota.
