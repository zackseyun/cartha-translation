  text: שְׁלַ֤ח עַל כָּל הַ/גּוֹלָה֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה אֶל שְׁמַעְיָ֖ה הַ/נֶּחֱלָמִ֑י יַ֡עַן אֲשֶׁר֩ נִבָּ֨א לָ/כֶ֜ם שְׁמַעְיָ֗ה וַֽ/אֲנִי֙ לֹ֣א שְׁלַחְתִּ֔י/ו וַ/יַּבְטַ֥ח אֶתְ/כֶ֖ם עַל שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/031.yaml
  text: 'Send to all the exiles[a], saying, ‘Thus says Yahweh concerning Shemaiah the Nehelamite: Because Shemaiah has prophesied to you, though I did not send him, and has made you trust in a lie,’'
translation:
  language: pt
  text: 'Mande esta mensagem a todos os exilados: “Assim diz Yahweh a respeito de Semaías, o neelamita[a]: Visto que Semaías profetizou a vocês sem que eu o tivesse enviado e fez vocês confiarem numa mentira,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o sonhador”, caso o título derive de uma palavra relacionada a sonhos, e não do nome de um lugar ou clã.
    reason: Alternativa lexical devido à etimologia incerta de הַנֶּחֱלָמִי.
lexical_decisions:
- source_word: שְׁלַח עַל כָּל הַגּוֹלָה
  choice: Mande esta mensagem a todos os exilados
  rationale: O imperativo singular dirige-se a Jeremias. No contexto de comunicação escrita, שלח com עַל indica o envio da mensagem aos destinatários; explicitar “esta mensagem” produz português natural sem alterar o referente.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo introduz o conteúdo da mensagem; em português, os dois-pontos desempenham naturalmente essa função.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética tradicional e translitera diretamente o nome divino.
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: a respeito de Semaías, o neelamita
  rationale: Após a fórmula de mensageiro, אֶל apresenta aqui o assunto do oráculo. O gentílico/título incerto é transliterado, evitando decidir sua derivação.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz claramente a causa que fundamenta o juízo subsequente.
- source_word: נִבָּא לָכֶם
  choice: profetizou a vocês
  rationale: Mantém o sentido profético do nifal e identifica os exilados como destinatários da fala.
- source_word: וַאֲנִי לֹא שְׁלַחְתִּיו
  choice: sem que eu o tivesse enviado
  rationale: 'Expressa de modo natural a circunstância contrastante: Semaías profetizou apesar de não ter sido enviado por Yahweh.'
- source_word: וַיַּבְטַח אֶתְכֶם עַל שָׁקֶר
  choice: e fez vocês confiarem numa mentira
  rationale: Preserva a força causativa do hifil de בטח e apresenta שקר como a base ou o objeto da confiança enganosa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Identidade de הַנֶּחֱלָמִי
  choice: o neelamita
  alternative: o sonhador; o homem de Neelã
  rationale: A derivação do termo é incerta. A transliteração no texto principal mantém essa incerteza, enquanto a nota registra a possibilidade ligada a sonhos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “vocês” para o plural e mantém a oração aberta no fim, como no versículo hebraico, cuja sentença prossegue no contexto seguinte.
