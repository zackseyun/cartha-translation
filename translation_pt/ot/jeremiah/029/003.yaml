base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/003.yaml
  text: 'by the hand of Elasah son of Shaphan and Gemariah son of Hilkiah[a], whom Zedekiah king of Judah sent to Nebuchadnezzar king of Babylon in Babylon[b], saying:'
translation:
  language: pt
  text: 'por intermédio de Elasa, filho de Safã, e de Gemarias, filho de Hilquias[a], os quais Zedequias, rei de Judá, enviou a Nabucodonosor, rei da Babilônia, para a Babilônia, com a seguinte mensagem:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pela mão de Elasa... e Gemarias»; expressão hebraica que aqui significa «por intermédio de» esses mensageiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: por intermédio de
  rationale: 'A expressão hebraica, literalmente «pela mão de», indica aqui agência: Elasa e Gemarias levaram a mensagem. «Por intermédio de» comunica naturalmente esse sentido em português.'
- source_word: אֶלְעָשָׂה בֶן שָׁפָן
  choice: Elasa, filho de Safã
  rationale: Os nomes próprios são transliterados segundo formas correntes e legíveis em português; בֶן é vertido diretamente por «filho de».
- source_word: וּגְמַרְיָה בֶּן חִלְקִיָּה
  choice: e de Gemarias, filho de Hilquias
  rationale: A conjunção é preservada, e os nomes recebem formas portuguesas tradicionais e reconhecíveis. A repetição de «de» liga naturalmente os dois mensageiros a «por intermédio».
- source_word: אֲשֶׁר שָׁלַח
  choice: os quais ... enviou
  rationale: O relativo retoma os dois mensageiros; o plural «os quais» torna essa referência explícita sem acrescentar conteúdo.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Zedequias, rei de Judá
  rationale: A cadeia nominal hebraica é reproduzida de modo direto e idiomático.
- source_word: אֶל נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: a Nabucodonosor, rei da Babilônia
  rationale: אֶל marca o destinatário. «Nabucodonosor» é a forma portuguesa convencional do nome presente no texto hebraico.
- source_word: בָּבֶלָה
  choice: na Babilônia
  rationale: A terminação direcional hebraica aponta para a Babilônia; depois de «enviou a Nabucodonosor», «na Babilônia» expressa em português natural o lugar em que o destinatário se encontrava, evitando a leitura equivocada de dois objetos indiretos coordenados.
- source_word: לֵאמֹר
  choice: 'com a seguinte mensagem:'
  rationale: A fórmula introdutória hebraica, literalmente «dizendo», anuncia o conteúdo da carta. Esta formulação é clara e natural no contexto.
