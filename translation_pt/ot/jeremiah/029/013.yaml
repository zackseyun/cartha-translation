base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/013.yaml
  text: You will seek me and find me[a], when you seek me with all your heart.
translation:
  language: pt
  text: Vocês me buscarão e me encontrarão[a], quando me buscarem de todo o coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois vocês me buscarão e me encontrarão, se me buscarem de todo o coração”. A conjunção hebraica כִּי pode ser entendida aqui de várias maneiras relacionadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Vocês me buscarão
  rationale: O piel perfeito com a conjunção, no contexto de uma promessa futura, é expresso naturalmente pelo futuro. “Buscar” preserva a ideia de procura intencional.
- source_word: אֹתִי
  choice: me
  rationale: A partícula de objeto direto com sufixo da primeira pessoa do singular corresponde diretamente a “me”.
- source_word: וּמְצָאתֶם
  choice: e me encontrarão
  rationale: O qal perfeito com conjunção prossegue a sequência futura. A repetição de “me” torna explícito em português o objeto pessoal.
- source_word: כִּי
  choice: quando
  rationale: Neste contexto, introduz a circunstância ou condição em que a promessa se cumpre. “Quando” é claro e idiomático, embora “pois” e “se” também sejam possíveis.
- source_word: תִדְרְשֻׁנִי
  choice: me buscarem
  rationale: דרשׁ comunica a busca dirigida a Deus, podendo incluir diligência. “Buscar” é natural em português e mantém o paralelismo com בקשׁ sem impor uma distinção artificial.
- source_word: בְּכָל לְבַבְכֶם
  choice: de todo o coração
  rationale: A expressão idiomática portuguesa transmite a totalidade do ser interior indicada por בְּכָל לְבַבְכֶם. O singular coletivo hebraico é preservado naturalmente.
theological_decisions:
- issue: Relação entre buscar e encontrar Deus
  choice: 'O versículo apresenta uma promessa genuína: encontrar Deus acompanha a busca de todo o coração.'
  alternative: A declaração pode ser enfatizada como responsabilidade humana ou situada numa teologia mais ampla da capacitação divina.
  rationale: A tradução conserva a promessa e sua circunstância ou condição sem acrescentar conclusões denominacionais sobre graça, capacidade humana ou salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa explicitamente a segunda pessoa do plural do hebraico; “de todo o coração” é a formulação idiomática corrente.
