base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/002.yaml
  text: after King Jeconiah[a], the queen mother, the court officials, the officials of Judah and Jerusalem[c][b], and the craftsmen and the metalworkers had gone out from Jerusalem—
translation:
  language: pt
  text: depois que o rei Jeconias, a rainha-mãe, os oficiais da corte[a], os oficiais de Judá e de Jerusalém[b], os artesãos e os metalúrgicos[c] saíram de Jerusalém—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os eunucos”; o termo hebraico pode designar especificamente eunucos ou, de modo mais amplo, oficiais reais.
    reason: lexical_alternative
  - marker: b
    text: Ou “os príncipes de Judá e de Jerusalém”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os ferreiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי צֵאת
  choice: depois que ... saíram
  rationale: Expressa naturalmente em português a oração temporal formada pela preposição e pelo infinitivo construto, indicando uma saída anterior ao envio da carta no contexto.
- source_word: יְכָנְיָה הַמֶּלֶךְ
  choice: o rei Jeconias
  rationale: Mantém esta forma hebraica do nome, sem harmonizá-la com variantes usadas em outros textos, e emprega a ordem idiomática do título em português.
- source_word: הַגְּבִירָה
  choice: a rainha-mãe
  rationale: No contexto da corte, o termo designa normalmente a mãe do rei em sua função institucional, não apenas uma mulher nobre.
- source_word: הַסָּרִיסִים
  choice: os oficiais da corte
  rationale: O termo pode designar especificamente eunucos ou, de modo mais amplo, funcionários reais; a tradução principal comunica a provável função administrativa, enquanto a nota preserva a alternativa.
- source_word: שָׂרֵי יְהוּדָה וִירוּשָׁלַם
  choice: os oficiais de Judá e de Jerusalém
  rationale: שׂרים designa governantes ou autoridades. “Oficiais” se ajusta ao contexto administrativo sem sugerir necessariamente príncipes de sangue real.
- source_word: הֶחָרָשׁ
  choice: os artesãos
  rationale: חרש pode designar trabalhadores especializados de forma ampla; “artesãos” preserva essa abrangência diante do termo profissional seguinte.
- source_word: הַמַּסְגֵּר
  choice: os metalúrgicos
  rationale: O termo provavelmente se refere a ferreiros ou trabalhadores de metais. “Metalúrgicos” é claro e suficientemente abrangente, sem restringi-lo a fabricantes de fechaduras.
- source_word: מִירוּשָׁלָם
  choice: de Jerusalém
  rationale: Indica o lugar de onde as pessoas listadas saíram; a repetição de Jerusalém corresponde à estrutura hebraica e permanece natural em português.
