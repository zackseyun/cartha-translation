  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֶל אַחְאָ֤ב בֶּן קֽוֹלָיָה֙ וְ/אֶל צִדְקִיָּ֣הוּ בֶן מַֽעֲשֵׂיָ֔ה הַֽ/נִּבְּאִ֥ים לָ/כֶ֛ם בִּ/שְׁמִ֖/י שָׁ֑קֶר הִנְ/נִ֣י נֹתֵ֣ן אֹתָ֗/ם בְּ/יַד֙ נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/הִכָּ֖/ם לְ/עֵינֵי/כֶֽם־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, concerning Ahab son of Kolaiah and Zedekiah son of Maaseiah, who are prophesying a lie to you in my name: Behold, I am giving them into the hand of Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel, a respeito de Acabe, filho de Colaías, e de Zedequias, filho de Maaseias, que profetizam mentiras a vocês em meu nome: “Eis que vou entregá-los nas mãos de Nabucodonosor[a], rei da Babilônia, e ele os ferirá diante dos olhos de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz uma forma do nome correspondente a “Nebucadrezar” (frequentemente transliterada “Nebuchadrezzar”); aqui se usa a forma tradicional portuguesa “Nabucodonosor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética solene e tradicional, em linguagem portuguesa ainda corrente.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo claro, preservando a ideia de poder soberano e militar sem restringir o referente.
- source_word: אֶל
  choice: a respeito de
  rationale: Neste contexto, introduz as pessoas sobre as quais se pronuncia o oráculo, não seus destinatários diretos.
- source_word: הַנִּבְּאִים לָכֶם בִּשְׁמִי שָׁקֶר
  choice: que profetizam mentiras a vocês em meu nome
  rationale: Expressa a atividade contínua dos falsos profetas e conserva a acusação de que reivindicam falsamente autorização divina. O plural idiomático em português soa mais natural que “uma mentira”.
- source_word: הִנְנִי
  choice: Eis que vou
  rationale: “Eis que” conserva a ênfase solene da fórmula; “vou” comunica naturalmente a ação iminente expressa pela construção participial.
- source_word: נֹתֵן אֹתָם בְּיַד
  choice: entregá-los nas mãos de
  rationale: Traduz o idioma hebraico como transferência ao poder de outra pessoa, preservando parcialmente sua imagem.
- source_word: וְהִכָּם
  choice: e ele os ferirá
  rationale: Mantém o sentido básico de נכה sem explicitar “matar”, conclusão provável no contexto, mas não lexicalmente obrigatória neste verbo isolado.
- source_word: לְעֵינֵיכֶם
  choice: diante dos olhos de vocês
  rationale: Preserva a imagem hebraica e enfatiza que os exilados testemunhariam o juízo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o nome pessoal no texto, em vez de substituí-lo por um título.
- issue: Alcance do verbo de juízo וְהִכָּם
  choice: ele os ferirá
  alternative: ele os matará; ele os abaterá
  rationale: A tradução evita tornar lexicalmente explícita a morte, embora o contexto anuncie um juízo severo e possivelmente fatal.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos exércitos; das hostes
  rationale: “Exércitos” é compreensível no português moderno e retém a imagem de soberania e poder, sem recorrer ao termo menos corrente “hostes”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se a cadência profética de “Assim diz”, o nome Yahweh e as imagens hebraicas que continuam claras em português. A pontuação apresenta a declaração divina como discurso direto.
