  text: וְ/דִרְשׁ֞וּ אֶת שְׁל֣וֹם הָ/עִ֗יר אֲשֶׁ֨ר הִגְלֵ֤יתִי אֶתְ/כֶם֙ שָׁ֔מָּ/ה וְ/הִתְפַּֽלְל֥וּ בַעֲדָ֖/הּ אֶל יְהוָ֑ה כִּ֣י בִ/שְׁלוֹמָ֔/הּ יִהְיֶ֥ה לָ/כֶ֖ם שָׁלֽוֹם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/007.yaml
  text: Seek the welfare of the city where I have sent you into exile[a], and pray to Yahweh on its behalf, for in its welfare you will have welfare.
translation:
  language: pt
  text: Busquem o bem-estar da cidade para onde eu os exilei e orem a Yahweh em favor dela, pois no bem-estar dela vocês terão bem-estar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “paz” ou “prosperidade” em todas as ocorrências neste versículo. A palavra hebraica shalom é repetida tanto para a cidade como para os exilados.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ
  choice: Busquem
  rationale: Preserva a força do imperativo e a ideia ampla de procurar e promover ativamente, sem restringi-la a um programa específico.
- source_word: שְׁלוֹם
  choice: bem-estar
  rationale: Abrange paz, estabilidade e condições favoráveis para a vida; a repetição da mesma expressão mantém a correspondência deliberada entre a cidade e os exilados.
- source_word: הָעִיר
  choice: a cidade
  rationale: Tradução direta e natural do substantivo definido que designa o centro urbano do exílio.
- source_word: הִגְלֵיתִי אֶתְכֶם שָׁמָּה
  choice: para onde eu os exilei
  rationale: Expressa a forma causativa de גלה, conserva explicitamente a ação divina e integra שָׁמָּה de modo idiomático à oração relativa.
- source_word: הִתְפַּלְלוּ
  choice: orem
  rationale: Tradução simples e precisa do imperativo; evita estreitar indevidamente o sentido para apenas intercessão.
- source_word: בַעֲדָהּ
  choice: em favor dela
  rationale: Indica que a oração deve ser feita em benefício da cidade, com referente feminino claro em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão para as ordens anteriores.
- source_word: בִשְׁלוֹמָהּ יִהְיֶה לָכֶם שָׁלוֹם
  choice: no bem-estar dela vocês terão bem-estar
  rationale: Mantém a repetição de שׁלום e a relação entre a condição da cidade e a dos exilados, sem limitar o sentido à prosperidade econômica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Preserva no texto o nome pessoal representado pelo Tetragrama, sem convertê-lo em título.
- issue: Agência divina no exílio
  choice: eu os exilei
  alternative: vocês foram levados ao exílio
  rationale: A forma hebraica apresenta Deus como agente do exílio; a tradução conserva essa afirmação teologicamente tensa sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Bem-estar” é usado de modo consistente para preservar a repetição hebraica; a nota registra a amplitude semântica de shalom.
