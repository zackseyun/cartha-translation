  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֞ה נְתָנְ/ךָ֣ כֹהֵ֗ן תַּ֚חַת יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן לִֽ/הְי֤וֹת פְּקִדִים֙ בֵּ֣ית יְהוָ֔ה לְ/כָל אִ֥ישׁ מְשֻׁגָּ֖ע וּ/מִתְנַבֵּ֑א וְ/נָתַתָּ֥ה אֹת֛/וֹ אֶל הַ/מַּהְפֶּ֖כֶת וְ/אֶל הַ/צִּינֹֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/026.yaml
  text: Yahweh has made you priest in place of Jehoiada the priest[a], to be overseers in the house of Yahweh over every man who is mad and acts as a prophet[c][b], and you should put him into the stocks and the neck iron.
translation:
  language: pt
  text: Yahweh fez de você sacerdote no lugar do sacerdote Joiada, para exercer funções de supervisão[a] na casa de Yahweh sobre todo homem que esteja louco e aja como profeta[b]. Você deve prendê-lo no tronco e no grilhão para o pescoço[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para servir como supervisor” ou “como oficial”. O hebraico emprega um substantivo plural (“encarregados/supervisores”), embora o destinatário seja singular.
    reason: lexical_alternative
  - marker: b
    text: Ou “e profetize”. O particípio hebraico pode ser traduzido de maneira mais neutra, mas o texto principal procura conservar o tom hostil de quem fala.
    reason: alternative_reading
  - marker: c
    text: O sentido exato do termo hebraico é incerto. Provavelmente se refere a um grilhão, aro ou outra peça de contenção presa ao pescoço, usada junto com o tronco.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נְתָנְךָ כֹהֵן
  choice: fez de você sacerdote
  rationale: Neste contexto, נתן com o nome de um cargo expressa designação; a formulação é natural em português e conserva o sentido resultante.
- source_word: תַּחַת יְהוֹיָדָע הַכֹּהֵן
  choice: no lugar do sacerdote Joiada
  rationale: תחת indica aqui substituição ou sucessão no cargo, não subordinação.
- source_word: לִהְיוֹת פְּקִדִים
  choice: para exercer as funções de encarregado
  rationale: A formulação comunica responsabilidade oficial e supervisora sem criar em português uma discordância abrupta entre o destinatário singular e o substantivo hebraico plural; a forma plural do original é registrada em nota.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Conserva a expressão hebraica tradicional para o templo.
- source_word: לְכָל אִישׁ מְשֻׁגָּע
  choice: sobre todo homem que esteja louco
  rationale: Mantém o substantivo masculino singular איש e o caráter hostil de משגע, entendido aqui como qualificação de loucura.
- source_word: וּמִתְנַבֵּא
  choice: e aja como profeta
  rationale: Reproduz o valor participial e o tom depreciativo do remetente sem decidir se a pessoa é ou não um profeta verdadeiro.
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Você deve prendê-lo
  rationale: Expressa a ação oficial esperada no encadeamento verbal e explicita naturalmente a finalidade dos instrumentos mencionados.
- source_word: הַמַּהְפֶּכֶת
  choice: o tronco
  rationale: Designa de modo convencional um instrumento de contenção e punição, sem adotar a interpretação mais específica de uma roda ou instrumento de tortura.
- source_word: הַצִּינֹק
  choice: o grilhão de pescoço
  rationale: Indica uma contenção ligada ao pescoço, mas evita definir com excessiva certeza sua forma material exata.
theological_decisions:
- issue: Descrição hostil da atividade profética
  choice: aja como profeta
  alternative: profetize
  rationale: A fala apresenta essas pessoas de modo depreciativo. A tradução conserva essa perspectiva sem declarar teologicamente que sua atividade profética era necessariamente falsa.
- issue: Gênero de אִישׁ
  choice: todo homem
  alternative: toda pessoa
  rationale: Conserva a forma masculina singular do hebraico, que neste contexto pode ter alcance genérico, sem apagá-la na tradução.
- issue: Natureza dos instrumentos de contenção
  choice: tronco e grilhão de pescoço
  alternative: tronco e coleira de ferro
  rationale: A forma exata do segundo instrumento é incerta; a tradução preserva essa incerteza em vez de fixar uma reconstrução específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para o destinatário masculino singular e “Joiada” segundo a forma portuguesa corrente. A segunda oração foi separada em nova frase para maior clareza, sem alterar a relação lógica do hebraico.
