  text: וּ/קְרָאתֶ֤ם אֹתִ/י֙ וַֽ/הֲלַכְתֶּ֔ם וְ/הִתְפַּלַּלְתֶּ֖ם אֵלָ֑/י וְ/שָׁמַעְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/012.yaml
  text: Then you will call on me and come and pray to me[b][a], and I will hear you.
translation:
  language: pt
  text: Então vocês me invocarão, virão e orarão a mim[a], e eu os ouvirei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irão e orarão a mim”. O verbo hebraico significa literalmente “ir” ou “andar”, mas aqui provavelmente indica aproximar-se para orar.
    reason: lexical_alternative
  - marker: b
    text: Ou “os escutarei” ou “atenderei vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם אֹתִי
  choice: vocês me invocarão
  rationale: קרא com objeto pessoal expressa chamar ou invocar alguém. “Invocar” comunica de modo natural o apelo dirigido a Deus, sem acrescentar conteúdo ao texto.
- source_word: וַהֲלַכְתֶּם
  choice: virão
  rationale: הלך significa literalmente “ir/andar”, mas, antes de “orar a mim”, provavelmente indica aproximar-se para orar. “Virão” reflete o movimento em direção a Deus, que é o falante; a alternativa literal é preservada em nota.
- source_word: וְהִתְפַּלַּלְתֶּם אֵלָי
  choice: orarão a mim
  rationale: O hitpael de פלל designa aqui oração dirigida a Deus, e אֵלַי marca essa direção. “Orarão a mim” é claro e fiel.
- source_word: וְשָׁמַעְתִּי אֲלֵיכֶם
  choice: eu os ouvirei
  rationale: שמע com אֶל pode significar ouvir, escutar ou atender. “Eu os ouvirei” preserva a formulação e a abertura semântica do hebraico.
theological_decisions:
- issue: Resposta divina à oração
  choice: eu os ouvirei
  alternative: eu os escutarei; eu atenderei vocês
  rationale: O contexto sugere uma resposta favorável de Deus, mas “ouvirei” não explicita além do hebraico se a ênfase está em escutar ou atender, preservando a tensão semântica.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural para representar o destinatário coletivo. “Vocês” favorece ampla legibilidade brasileira; “invocarão” mantém o registro bíblico sem ser arcaico.
