id: JER.29.20
reference: Jeremiah 29:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם שִׁמְע֣וּ דְבַר יְהוָ֑ה כָּל הַ֨/גּוֹלָ֔ה אֲשֶׁר שִׁלַּ֥חְתִּי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/020.yaml
  text: But you, all the exiles whom I sent from Jerusalem to Babylon, hear the word of Yahweh.
translation:
  language: pt
  text: Mas vocês, todos os exilados que enviei de Jerusalém para a Babilônia, ouçam a palavra de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mas vocês
  rationale: A conjunção seguida do pronome independente introduz uma mudança contrastiva em relação à denúncia anterior. “Mas vocês” expressa esse contraste de modo natural.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: O imperativo significa “ouçam” ou “escutem”. “Ouçam” preserva a fórmula profética e deixa implícita, sem a impor, a dimensão de obediência.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a expressão profética tradicional e a ressonância da fala divina; o nome pessoal יהוה é transliterado como “Yahweh”.
- source_word: כָּל הַגּוֹלָה
  choice: todos os exilados
  rationale: O substantivo hebraico está no singular coletivo e designa toda a comunidade deportada. O plural é claro e natural em português.
- source_word: אֲשֶׁר שִׁלַּחְתִּי
  choice: que enviei
  rationale: Traduz de forma direta o verbo שלח, sem acrescentar a ideia mais forte de expulsão, que não está lexicalmente explícita.
- source_word: מִירוּשָׁלִַם
  choice: de Jerusalém
  rationale: Representa diretamente a origem marcada pela preposição מִן.
- source_word: בָּבֶלָה
  choice: para a Babilônia
  rationale: O sufixo direcional indica movimento em direção à Babilônia; “para” é a forma idiomática em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título; “Jeová” é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. Emprega-se “vocês” para a segunda pessoa plural e mantém-se a concisão imperativa do hebraico.
