base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/029.yaml
  text: Then Zephaniah the priest read this scroll in the hearing of Jeremiah the prophet[a].
translation:
  language: pt
  text: Então, o sacerdote Sofonias leu esta carta[a] ao profeta Jeremias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este documento”. O hebraico סֵפֶר pode designar um livro, rolo ou documento escrito; neste contexto, refere-se à mensagem escrita de Semaías.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Então ... leu
  rationale: O qal narrativo de קרא, tendo como objeto um documento escrito, significa aqui “ler”. “Então” expressa com naturalidade a sequência narrativa.
- source_word: צְפַנְיָה
  choice: Sofonias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Mantém explicitamente o título definido que identifica a função de Sofonias.
- source_word: הַסֵּפֶר הַזֶּה
  choice: este rolo
  rationale: סֵפֶר pode designar livro, rolo ou documento escrito. “Rolo” representa diretamente o termo sem excluir que, no contexto, o conteúdo seja uma carta.
- source_word: בְּאָזְנֵי
  choice: aos ouvidos de
  rationale: Preserva de modo natural e digno o idioma hebraico, indicando que o documento foi lido em voz alta para Jeremias ouvir.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Conserva o nome e o título definido em formulação idiomática portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A ordem “o profeta Jeremias” é natural em português, e “aos ouvidos de” preserva a imagem do hebraico sem soar obscura.
