revisions:
- from: 'E deles se tomará uma maldição entre todos os exilados de Judá que estão na Babilônia, dizendo: “Que Yahweh faça de você alguém como Zedequias e como Acabe, que o rei da Babilônia assou no fogo[a]”.'
  to: 'E será tomada deles uma maldição por todos os exilados de Judá que estão na Babilônia, dizendo: “Que Yahweh faça você semelhante a Zedequias e a Acabe, os quais o rei da Babilônia assou no fogo[a].”'
  rationale: A revisão melhora a fluência e a clareza sintática sem alterar o sentido. Mantém-se a passiva de וְלֻקַּח (“será tomada”), a fórmula de maldição, o valor imprecatório de יְשִׂמְךָ, a repetição comparativa referente a Zedequias e Acabe e a imagem forte de קָלָם (“assou”).
  reviewer_model: gpt-5.6-terra
