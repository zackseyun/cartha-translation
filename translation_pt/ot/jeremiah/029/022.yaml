  - severity: low
    issue: “Faça de você alguém como” acrescenta e torna pesada a comparação
    rationale: O hebraico diz literalmente que Yahweh faça o destinatário como Zedequias e Acabe. “Faça você semelhante a” comunica isso de modo mais direto, sem introduzir “alguém”.
