  text: וְ/לֻקַּ֤ח מֵ/הֶם֙ קְלָלָ֔ה לְ/כֹל֙ גָּל֣וּת יְהוּדָ֔ה אֲשֶׁ֥ר בְּ/בָבֶ֖ל לֵ/אמֹ֑ר יְשִֽׂמְ/ךָ֤ יְהוָה֙ כְּ/צִדְקִיָּ֣הוּ וּ/כְ/אֶחָ֔ב אֲשֶׁר קָלָ֥/ם מֶֽלֶךְ בָּבֶ֖ל בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/022.yaml
  text: And from them a curse will be taken up by all the exiles of Judah who are in Babylon[a], saying, “May Yahweh make you like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire.”
translation:
  language: pt
  text: 'E será tomada deles uma maldição por todos os exilados de Judá que estão na Babilônia, dizendo: “Que Yahweh faça você semelhante a Zedequias e a Acabe, os quais o rei da Babilônia assou no fogo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “queimou no fogo”. O verbo hebraico pode ser traduzido de maneira mais geral como “queimou”, embora “assou” preserve sua força vívida.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְלֻקַּח
  choice: E deles se tomará
  rationale: Mantém a forma passiva do hebraico e comunica que o destino desses homens dará origem a uma fórmula de maldição.
- source_word: קְלָלָה
  choice: uma maldição
  rationale: É o equivalente português direto e natural; o caráter formular fica claro pela citação introduzida em seguida.
- source_word: לְכֹל גָּלוּת יְהוּדָה אֲשֶׁר בְּבָבֶל
  choice: entre todos os exilados de Judá que estão na Babilônia
  rationale: Neste contexto, לְ identifica a comunidade no meio da qual a fórmula será adotada. “Exilados” traduz concretamente גָּלוּת e é claro em português moderno.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introdução corrente e fiel ao discurso direto.
- source_word: יְשִׂמְךָ יְהוָה
  choice: Que Yahweh faça de você alguém
  rationale: Expressa naturalmente em português o valor volitivo ou imprecatório e o sentido de שׂים no padrão comparativo “fazer de alguém como”.
- source_word: כְּצִדְקִיָּהוּ וּכְאֶחָב
  choice: como Zedequias e como Acabe
  rationale: Conserva a comparação e a repetição enfática da preposição כְּ diante dos dois nomes.
- source_word: קָלָם
  choice: assou
  rationale: O piel de קלה pode indicar assar ou torrar. “Assou” preserva a força vívida e brutal do verbo, enquanto o referente plural permanece claro na oração relativa.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Traduz de modo direto o בְּ e apresenta o fogo como ambiente ou meio da execução.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Força da imprecação יְשִׂמְךָ
  choice: Que Yahweh faça de você alguém como...
  alternative: Yahweh fará de você alguém como...
  rationale: A construção no contexto de uma maldição expressa um desejo imprecatório, não uma simples previsão; a formulação com “Que” preserva essa força.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Se tomará uma maldição” conserva deliberadamente a passiva e o caráter formular do hebraico; “assou no fogo” mantém a imagem severa do texto-fonte.
