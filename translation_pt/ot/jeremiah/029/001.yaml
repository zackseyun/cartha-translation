id: JER.29.1
reference: Jeremiah 29:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׁלַ֛ח יִרְמְיָ֥ה הַ/נָּבִ֖יא מִ/ירוּשָׁלִָ֑ם אֶל יֶ֜תֶר זִקְנֵ֣י הַ/גּוֹלָ֗ה וְ/אֶל הַ/כֹּהֲנִ֤ים וְ/אֶל הַ/נְּבִיאִים֙ וְ/אֶל כָּל הָ/עָ֔ם אֲשֶׁ֨ר הֶגְלָ֧ה נְבֽוּכַדְנֶאצַּ֛ר מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/001.yaml
  text: These are the words of the letter that Jeremiah the prophet sent from Jerusalem to the remaining elders of the exiles[a], and to the priests, the prophets[d][c][b], and all the people whom Nebuchadnezzar had carried away from Jerusalem to Babylon.
translation:
  language: pt
  text: Estas são as palavras da carta[a] que o profeta Jeremias enviou de Jerusalém aos anciãos que restavam entre os exilados[b], aos sacerdotes, aos profetas e a todo o povo que Nabucodonosor havia deportado de Jerusalém para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do documento escrito” ou “do rolo”. A palavra hebraica pode designar vários tipos de texto escrito; “carta” foi escolhida porque Jeremias o enviou a destinatários específicos.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao restante dos anciãos do exílio”. O hebraico pode referir-se aos anciãos que ainda restavam na comunidade deportada, enquanto “exílio” também pode designar coletivamente essa comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: Introduz a nova seção de modo natural. O וְ liga o versículo ao contexto anterior, mas não exige uma conjunção explícita em português.
- source_word: דִּבְרֵי הַסֵּפֶר
  choice: as palavras da carta
  rationale: סֵפֶר pode designar livro, rolo ou documento escrito; como o documento foi enviado a destinatários específicos, “carta” expressa melhor sua função neste contexto, enquanto “as palavras” preserva a construção hebraica.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Ordem idiomática em português para o nome acompanhado de seu título, sem perda de conteúdo.
- source_word: יֶתֶר זִקְנֵי הַגּוֹלָה
  choice: aos anciãos que restavam entre os exilados
  rationale: יֶתֶר indica aquilo ou aqueles que restam, e הַגּוֹלָה pode designar tanto o exílio quanto a comunidade deportada. A formulação escolhida é clara e mantém a referência pessoal aos anciãos.
- source_word: הַכֹּהֲנִים ... הַנְּבִיאִים ... כָּל הָעָם
  choice: aos sacerdotes, aos profetas e a todo o povo
  rationale: Tradução direta das categorias de destinatários, preservando a ampliação dos líderes para toda a comunidade.
- source_word: אֲשֶׁר הֶגְלָה
  choice: que ... havia deportado
  rationale: O hifil de גלה expressa fazer alguém ir para o exílio, isto é, deportar. O mais-que-perfeito composto marca naturalmente que a deportação precedeu o envio da carta.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בָּבֶלָה
  choice: para a Babilônia
  rationale: O ה direcional indica movimento em direção à Babilônia; “para” torna esse valor explícito em português.
