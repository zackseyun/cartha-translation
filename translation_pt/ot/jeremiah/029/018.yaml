base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/018.yaml
  text: And I will pursue them with the sword[a], with famine, and with pestilence, and I will make them a horror to all the kingdoms of the earth, a curse, a desolation, an object of hissing[b], and a reproach among all the nations where I have driven them.
translation:
  language: pt
  text: Eu os perseguirei com a espada, com a fome e com a peste. Farei deles, para todos os reinos da terra, motivo de horror[a], maldição, desolação, objeto de assobios[b] e vergonha entre todas as nações para onde os expulsei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “motivo de terror”. O termo hebraico pode indicar horror, terror ou tremor; aqui descreve aquilo que eles se tornariam para todos os reinos da terra.
    reason: lexical_alternative
  - marker: b
    text: Isto é, alvo de assobios ou silvos de escárnio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדַפְתִּי אַחֲרֵיהֶם
  choice: Eu os perseguirei
  rationale: O verbo רדף com אַחֲרֵי expressa perseguir ou ir no encalço. “Perseguirei” mantém a ação divina direta e persistente sem acrescentar uma finalidade não expressa.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: com a espada, com a fome e com a peste
  rationale: Mantém a conhecida tríade profética de juízo e reproduz o valor instrumental da preposição בְּ. “Fome” designa aqui a calamidade coletiva, e “peste”, uma doença epidêmica.
- source_word: וּנְתַתִּים לְזַוֲעָה
  choice: Farei deles motivo de horror
  rationale: A construção significa fazer deles algo que provoca horror, terror ou tremor. “Motivo de horror” comunica com naturalidade que eles se tornam objeto dessa reação e preserva a amplitude lexical em nota.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: para todos os reinos da terra
  rationale: 'A preposição לְ indica a relação ou o resultado: eles se tornam motivo de horror perante todos os reinos.'
- source_word: לְאָלָה
  choice: uma maldição
  rationale: אָלָה pode indicar uma maldição, inclusive em contexto de juramento. Nesta lista de fórmulas de desgraça pública, “maldição” é claro e conciso.
- source_word: וּלְשַׁמָּה
  choice: uma desolação
  rationale: שַׁמָּה pode denotar desolação ou algo estarrecedor. “Desolação” preserva a distinção em relação ao “horror” já expresso por זַוֲעָה.
- source_word: וְלִשְׁרֵקָה
  choice: objeto de assobios
  rationale: שְׁרֵקָה designa o assobio ou silvo dos observadores, aqui como reação de escárnio ou espanto. “Objeto de assobios” deixa claro que o povo é o alvo da reação.
- source_word: וּלְחֶרְפָּה
  choice: uma vergonha
  rationale: חֶרְפָּה abrange afronta, opróbrio e vergonha pública. “Vergonha” é corrente em português e conserva a dimensão de desonra perante outros povos.
- source_word: בְּכָל הַגּוֹיִם אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: entre todas as nações para as quais os expulsei
  rationale: “Entre” expressa naturalmente a dispersão no meio das nações. O hifil de נדח atribui a Deus a ação de expulsar ou dispersar; “expulsei” preserva sua força e a forma perfeita.
theological_decisions:
- issue: Ação divina no juízo e no exílio
  choice: Manter em primeira pessoa as ações “perseguirei”, “farei” e “expulsei”.
  alternative: Empregar construções passivas ou impessoais que atenuem a agência divina.
  rationale: O hebraico atribui explicitamente a Deus tanto o juízo quanto a dispersão. A tradução conserva essa tensão teológica sem suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “com” preserva o ritmo da tríade hebraica. “Objeto de assobios” mantém a imagem cultural antiga e a explica em nota. O marcador [a] foi colocado junto de “horror”, termo ao qual sua nota lexical corresponde.
