source:
  edition: WLC
  text: יַ֡עַן אֲשֶׁר֩ עָשׂ֨וּ נְבָלָ֜ה בְּ/יִשְׂרָאֵ֗ל וַ/יְנַֽאֲפוּ֙ אֶת נְשֵׁ֣י רֵֽעֵי/הֶ֔ם וַ/יְדַבְּר֨וּ דָבָ֤ר בִּ/שְׁמִ/י֙ שֶׁ֔קֶר אֲשֶׁ֖ר ל֣וֹא צִוִּיתִ֑/ם וְ/אָנֹכִ֛י הו ידע וָ/עֵ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/023.yaml
  text: because they have committed an outrageous act in Israel[a], and have committed adultery with their neighbors’ wives, and have spoken in my name a lie that I did not command them. And I am the one who knows and is a witness[c][b], declares Yahweh.
translation:
  language: pt
  text: 'porque cometeram um ato vergonhoso em Israel[a]: adulteraram com as mulheres dos seus próximos e, em meu nome, disseram uma mentira que eu não lhes ordenei. Eu mesmo sou aquele que sabe e é testemunha[b] — declara Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um ato ultrajante” ou “uma infâmia”. O termo hebraico indica um ato moralmente escandaloso e desonroso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu sei e sou testemunha”. O hebraico é enfático: “Eu, eu sou aquele que sabe e é testemunha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶר
  choice: porque
  rationale: Introduz de modo natural a causa do juízo anunciado no versículo anterior.
- source_word: עָשׂוּ נְבָלָה
  choice: cometeram um ato vergonhoso
  rationale: נְבָלָה designa um ato moralmente infame e escandaloso; esta formulação conserva sua gravidade sem restringir o sentido à mera insensatez.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Preserva a leitura locativa mais direta da preposição ב e também permite entender Israel como o âmbito comunitário da ofensa.
- source_word: וַיְנַאֲפוּ אֶת נְשֵׁי רֵעֵיהֶם
  choice: adulteraram com as mulheres dos seus próximos
  rationale: O verbo נאף denota especificamente adultério; רֵעַ refere-se aqui ao próximo ou membro da mesma comunidade, não necessariamente a um amigo íntimo.
- source_word: וַיְדַבְּרוּ דָבָר בִּשְׁמִי שֶׁקֶר
  choice: em meu nome, disseram uma mentira
  rationale: Expressa com naturalidade a alegação de autoridade divina e a acusação concreta de profecia falsa, sem reproduzir de modo artificial a construção cognata hebraica.
- source_word: אֲשֶׁר לֹא צִוִּיתִם
  choice: que eu não lhes ordenei
  rationale: Mantém de forma direta a ausência de autorização divina.
- source_word: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  choice: Eu mesmo sou aquele que sabe e é testemunha
  rationale: Conserva a forte ênfase de אָנֹכִי הוּא e o tom forense de עֵד, sem transformar 'testemunha' no verbo 'testificar'.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e translitera diretamente o nome divino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' preserva o nome divino pessoal sem substituí-lo por um título.
- issue: Sentido forense de עֵד
  choice: é testemunha
  alternative: testifica
  rationale: O hebraico apresenta 'testemunha' como predicado nominal. A tradução mantém Deus como aquele que possui conhecimento direto e serve de testemunha da culpa, sem acrescentar explicitamente o ato de depor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se 'próximos' a 'vizinhos' porque o hebraico aponta para membros da comunidade, não apenas pessoas que moram perto. A ordem das orações foi levemente ajustada para fluência, preservando a sequência acusatória e a ênfase final do hebraico.
