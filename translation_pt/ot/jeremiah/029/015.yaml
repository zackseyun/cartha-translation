id: JER.29.15
reference: Jeremiah 29:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֖י אֲמַרְתֶּ֑ם הֵקִ֨ים לָ֧/נוּ יְהוָ֛ה נְבִאִ֖ים בָּבֶֽלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/015.yaml
  text: Because you have said[b][a], “Yahweh has raised up prophets for us in Babylon,”
translation:
  language: pt
  text: 'Pois[a] vocês disseram: “Yahweh levantou[b] profetas para nós na Babilônia”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque vocês disseram”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “designou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: A conjunção introduz a razão da resposta divina que segue. “Pois” preserva a ligação causal e funciona naturalmente neste trecho, embora “porque” também seja possível.
- source_word: אֲמַרְתֶּם
  choice: vocês disseram
  rationale: O qatal na segunda pessoa masculina plural relata uma declaração anterior dos destinatários. O pretérito perfeito é claro e natural em português.
- source_word: הֵקִים
  choice: levantou
  rationale: O hifil de קום frequentemente descreve Deus fazendo surgir ou constituindo líderes e profetas. “Levantou” preserva essa expressão bíblica sem excluir a ideia de nomeação.
- source_word: לָנוּ
  choice: para nós
  rationale: A preposição ל com o sufixo expressa aqui benefício ou provisão; “para nós” é a formulação portuguesa mais natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto hebraico traz o nome divino, não um título. A transliteração “Yahweh” conserva o nome pessoal.
- source_word: נְבִאִים
  choice: profetas
  rationale: Equivalente direto e corrente do plural נְבִאִים.
- source_word: בָּבֶלָה
  choice: na Babilônia
  rationale: Embora apresente a terminação direcional/locativa, o nome indica localização neste contexto; “na Babilônia” é a tradução natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A forma hebraica é o Tetragrama. “Yahweh” representa diretamente o nome pessoal e evita substituí-lo por um título.
- issue: Natureza da ação divina expressa por הֵקִים
  choice: levantou
  alternative: designou
  rationale: “Levantou” mantém a formulação tradicionalmente associada à provisão divina de profetas, ao passo que “designou” explicita apenas uma possível nuance funcional. O contexto posterior avaliará a legitimidade desses profetas, sem que este versículo precise resolver a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” comunica naturalmente a segunda pessoa do plural. A vírgula final foi mantida porque o versículo introduz a continuação da fala no contexto.
