  text: תַּ֛חַת אֲשֶֽׁר לֹא שָׁמְע֥וּ אֶל דְּבָרַ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֩ שָׁלַ֨חְתִּי אֲלֵי/הֶ֜ם אֶת עֲבָדַ֤/י הַ/נְּבִאִים֙ הַשְׁכֵּ֣ם וְ/שָׁלֹ֔חַ וְ/לֹ֥א שְׁמַעְתֶּ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/019.yaml
  text: because they did not listen to my words[a], declares Yahweh, which I sent to them by my servants the prophets, rising early and sending them, and you did not listen[b], declares Yahweh.
translation:
  language: pt
  text: porque não deram ouvidos às minhas palavras — declara Yahweh —, pois enviei-lhes repetidas vezes os meus servos, os profetas[a]. E vocês não deram ouvidos[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “levantando-me cedo e enviando-os”, expressão idiomática que comunica iniciativa persistente e repetida; também pode ser traduzida por “enviando-os insistentemente”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa de “eles não deram ouvidos” para “vocês não deram ouvidos”, provavelmente para intensificar a acusação dirigindo-a aos ouvintes. A tradução preserva essa mudança.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: porque
  rationale: A expressão introduz a causa do juízo mencionado no versículo anterior; “porque” conserva essa relação de modo claro e natural.
- source_word: שָׁמְעוּ / שְׁמַעְתֶּם
  choice: deram ouvidos / deram ouvidos
  rationale: Com אֶל, o verbo שׁמע implica escutar com atenção e acolher o que foi dito. “Dar ouvidos” mantém tanto a imagem auditiva quanto a ideia de atender, sem explicitar demais como “obedecer”.
- source_word: אֶל דְּבָרַי
  choice: às minhas palavras
  rationale: Preserva o plural concreto do hebraico e a relação exigida pela expressão portuguesa “dar ouvidos a”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene em português corrente, mantendo o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר שָׁלַחְתִּי אֲלֵיהֶם אֶת עֲבָדַי הַנְּבִאִים
  choice: as quais lhes enviei por meio dos meus servos, os profetas
  rationale: Em português, explicita naturalmente que as palavras chegaram aos destinatários pela atuação dos profetas, preservando “meus servos” e sua aposição, “os profetas”.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: enviando-os repetidas vezes
  rationale: A construção idiomática expressa iniciativa persistente e reiterada. A formulação comunica seu sentido com naturalidade, enquanto a nota preserva a imagem literal.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: E vocês não deram ouvidos
  rationale: Mantém a conjunção e, sobretudo, a mudança enfática da terceira para a segunda pessoa do plural presente no texto massorético.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Mudança da terceira para a segunda pessoa
  choice: manter “não deram ouvidos” e depois “vocês não deram ouvidos”
  alternative: uniformizar ambas as orações na terceira ou na segunda pessoa
  rationale: A mudança está no texto hebraico e intensifica retoricamente a acusação, dirigindo-a aos ouvintes; harmonizá-la eliminaria uma tensão genuína do texto.
- issue: Imagem antropomórfica do envio ao levantar-se cedo
  choice: traduzir o sentido idiomático no texto e registrar a forma literal em nota
  alternative: “levantando-me cedo e enviando-os” no texto principal
  rationale: A expressão hebraica enfatiza a iniciativa persistente e repetida de Yahweh, não uma afirmação doutrinária sobre hábitos físicos; a nota conserva a metáfora original sem tornar o texto principal artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dar ouvidos” preserva a combinação de escuta e acolhimento; “vocês” marca claramente a segunda pessoa plural. Os travessões destacam a fórmula profética sem obscurecer a sintaxe.
