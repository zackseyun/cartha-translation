  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַ֡עַן אֲשֶׁ֣ר אַתָּה֩ שָׁלַ֨חְתָּ בְ/שִׁמְ/כָ֜ה סְפָרִ֗ים אֶל כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירוּשָׁלִַ֔ם וְ/אֶל צְפַנְיָ֤ה בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן וְ/אֶ֥ל כָּל הַ/כֹּהֲנִ֖ים לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/025.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Because you have sent letters in your own name to all the people who are in Jerusalem, and to Zephaniah son of Maaseiah the priest, and to all the priests, saying,'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos, o Deus de Israel: “Visto que você enviou cartas em seu próprio nome[a] a todo o povo que está em Jerusalém, a Sofonias, filho de Maaseias, o sacerdote, e a todos os sacerdotes, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em seu nome”. A expressão provavelmente ressalta que Semaías agiu por autoridade própria, e não em nome de Yahweh.
    reason: Registra a forma mais literal e explica a provável implicação contextual sem incorporá-la como certeza ao texto principal.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem digna, corrente e reconhecível.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um título amplo e tradicional, sem restringi-lo apenas a exércitos humanos ou celestiais.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz naturalmente em português a causa da declaração que prossegue nos versículos seguintes.
- source_word: בְשִׁמְךָ
  choice: em seu próprio nome
  rationale: Expressa o possessivo enfático no contexto e destaca que as cartas foram enviadas sob a autoridade do próprio destinatário, sem substituir a imagem hebraica por uma explicação.
- source_word: סְפָרִים
  choice: cartas
  rationale: O contexto descreve correspondência enviada a destinatários específicos; “cartas” é a equivalência portuguesa mais natural.
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: Sofonias, filho do sacerdote Maaseias
  rationale: Emprega as formas portuguesas correntes dos nomes e torna explícita, de modo natural, a ligação mais provável do aposto הַכֹּהֵן com Maaseias.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Conserva a fórmula que introduz, no versículo seguinte, o conteúdo das cartas.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Autoridade alegada por Semaías em בְשִׁמְךָ
  choice: em seu próprio nome
  alternative: em seu nome; por sua própria autoridade
  rationale: A tradução preserva a linguagem de “nome” e comunica a provável contraposição entre a autoridade de Semaías e a de Yahweh, sem transformar essa inferência contextual em declaração explícita.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A frase permanece aberta porque continua no versículo seguinte. As formas “Sofonias” e “Maaseias” seguem o uso bíblico português corrente.
