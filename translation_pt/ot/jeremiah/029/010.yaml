base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/010.yaml
  text: 'For this is what Yahweh says: When seventy years for Babylon are completed[a], I will attend to you and fulfill my good word to you[c][b], to bring you back to this place.'
translation:
  language: pt
  text: 'Pois assim diz Javé: “Quando se completarem setenta anos em relação à Babilônia[c], voltarei minha atenção para vocês[a] e cumprirei em favor de vocês a minha boa palavra[b], para trazer vocês de volta a este lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “visitarei vocês”. O verbo hebraico pode indicar que alguém dirige sua atenção a outra pessoa, seja para juízo, seja para cuidado; aqui o contexto é favorável.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “confirmarei” ou “estabelecerei para vocês a minha boa palavra”. A expressão se refere a realizar o que Javé havia prometido.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “quando se completarem para a Babilônia setenta anos”. A expressão pode se referir ao período determinado em relação à Babilônia.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma tradicional e amplamente reconhecível em português para o nome divino, preservando-o como nome próprio.
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Reproduz de modo natural e digno a fórmula hebraica que introduz uma declaração divina.
- source_word: כִּי לְפִי מְלֹאת לְבָבֶל שִׁבְעִים שָׁנָה
  choice: Quando se completarem setenta anos para a Babilônia
  rationale: Preserva a associação ampla dos setenta anos com a Babilônia sem defini-los especificamente como o tempo do exílio ou da supremacia babilônica.
- source_word: אֶפְקֹד אֶתְכֶם
  choice: voltarei minha atenção para vocês
  rationale: פקד indica dirigir a atenção a alguém, para juízo ou cuidado. Neste contexto favorável, a expressão comunica intervenção cuidadosa sem tornar explícito mais do que o hebraico.
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם אֶת דְּבָרִי הַטּוֹב
  choice: e cumprirei em favor de vocês a minha boa palavra
  rationale: הקים com דבר significa fazer vigorar ou realizar o que foi declarado. “Cumprirei” exprime o sentido idiomático, enquanto “minha boa palavra” preserva a formulação hebraica.
- source_word: לְהָשִׁיב אֶתְכֶם
  choice: trazendo vocês de volta
  rationale: O hifil de שוב é causativo; a tradução deixa claro que Javé fará o povo retornar.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: a este lugar
  rationale: Mantém o sentido específico de מָקוֹם sem substituir o termo por “terra” nem identificar expressamente Jerusalém ou Judá.
theological_decisions:
- issue: Referência dos setenta anos associados à Babilônia
  choice: setenta anos para a Babilônia
  alternative: setenta anos na Babilônia; os setenta anos da Babilônia
  rationale: A construção hebraica associa o período à Babilônia, mas não determina por si só se se trata da duração do exílio ou do domínio babilônico. A tradução mantém essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. O pronome “vocês” explicita o plural do hebraico. A ordem foi levemente ajustada para fluência, sem eliminar ambiguidades relevantes.
