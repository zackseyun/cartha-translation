id: JER.29.9
reference: Jeremiah 29:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י בְ/שֶׁ֔קֶר הֵ֛ם נִבְּאִ֥ים לָ/כֶ֖ם בִּ/שְׁמִ֑/י לֹ֥א שְׁלַחְתִּ֖י/ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/009.yaml
  text: For they are prophesying falsely to you in my name[a]; I did not send them[c][b], declares Yahweh.
translation:
  language: pt
  text: Pois eles estão profetizando falsamente a vocês em meu nome; eu não os enviei — declara Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência anterior e mantém a força causal do hebraico em português natural.
- source_word: בְשֶׁקֶר
  choice: falsamente
  rationale: A expressão significa literalmente “em falsidade” ou “em mentira”; o advérbio comunica de modo natural que a profecia deles é falsa.
- source_word: נִבְּאִים
  choice: estão profetizando
  rationale: O particípio hebraico apresenta uma ação em curso ou característica; a locução verbal preserva esse aspecto.
- source_word: לָכֶם
  choice: a vocês
  rationale: Marca os destinatários da fala profética e oferece leitura ampla e natural em português contemporâneo.
- source_word: בִשְׁמִי
  choice: em meu nome
  rationale: Preserva o idiomatismo de falar alegando autorização divina e mantém seu peso teológico.
- source_word: לֹא שְׁלַחְתִּים
  choice: eu não os enviei
  rationale: Expressa diretamente a negação divina de que esses profetas tenham sido comissionados.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e verte o tetragrama como nome pessoal.
theological_decisions:
- issue: Autorização divina da profecia
  choice: Os profetas falam falsamente alegando o nome de Deus, mas Yahweh nega tê-los enviado.
  alternative: Entender apenas que a mensagem é falsa, sem destacar a falsa reivindicação de autorização.
  rationale: O contraste explícito entre “em meu nome” e “não os enviei” deve permanecer sem ser atenuado.
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o tetragrama; a transliteração preserva o caráter de nome próprio, enquanto a alternativa tradicional o representa por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil como em outros contextos lusófonos. “A vocês” evita regionalismo excessivo; o travessão realça, sem alterar o sentido, a fórmula profética final.
