  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִי֙ מְשַׁלֵּ֣חַ בָּ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר וְ/נָתַתִּ֣י אוֹתָ֗/ם כַּ/תְּאֵנִים֙ הַ/שֹּׁ֣עָרִ֔ים אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Eis que enviarei contra eles a espada, a fome e a peste. Farei com que sejam como figos estragados[a], que não podem ser comidos de tão ruins.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “figos ruins” ou “figos podres”; o adjetivo hebraico descreve figos tão ruins que são impróprios para consumo.
    reason: alternativa lexical
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pela forma portuguesa tradicional e abrangente, sem limitar a referência a exércitos humanos ou celestiais.
- source_word: הִנְנִי מְשַׁלֵּחַ בָּם
  choice: Eis que enviarei contra eles
  rationale: “Eis que” conserva a força solene e enfática de הִנְנִי; o futuro é natural em português para a ação iminente, e “contra” expressa o sentido hostil da preposição ב neste contexto.
- source_word: הַחֶרֶב אֶת הָרָעָב וְאֶת הַדָּבֶר
  choice: a espada, a fome e a peste
  rationale: Preserva a tríade concreta de juízos proféticos; “peste” é atual, clara e adequada para uma aflição epidêmica.
- source_word: וְנָתַתִּי אוֹתָם
  choice: Farei com que sejam
  rationale: Expressa em português natural o uso resultativo de נתן com a comparação seguinte.
- source_word: כַּתְּאֵנִים הַשֹּׁעָרִים
  choice: como figos estragados
  rationale: Conserva a comparação explícita e comunica de modo concreto que os figos estão em condição péssima e impróprios para consumo.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: que não podem ser comidos de tão ruins
  rationale: Reproduz a inedibilidade resultante e a causa expressa por מֵרֹעַ, sem moralizar “ruins” como “maus”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Translitera o nome divino presente no hebraico e evita substituí-lo por um título, em conformidade com a política indicada para o projeto.
translation_notes:
  register: Português moderno, digno e acessível, com cadência profética. “Eis que” mantém a solenidade sem tornar o restante do versículo arcaico; “peste” tem maior naturalidade contemporânea do que “pestilência”.
