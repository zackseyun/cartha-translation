  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/030.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Jeremias, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O wayyiqtol de היה dá sequência à narrativa; em português atual, a construção com “então” e “veio” preserva essa progressão sem recorrer ao arcaísmo “e aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, “a palavra” é a correspondência tradicional, transparente e reconhecível; “mensagem” seria possível, mas reduziria a ligação formal com o hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da palavra; antes do nome “Jeremias”, “veio a” é uma formulação natural e digna em português.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Emprega a forma portuguesa convencional do nome próprio hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o discurso direto que começa no versículo seguinte; “dizendo” preserva de modo conciso a fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome próprio, enquanto “SENHOR” representa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Mantém-se a fórmula profética “a palavra de Yahweh veio a Jeremias” e o particípio introdutório “dizendo”, sem arcaísmos.
