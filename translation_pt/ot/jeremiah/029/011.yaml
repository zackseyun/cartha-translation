id: JER.29.11
reference: Jeremiah 29:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ אָנֹכִ֨י יָדַ֜עְתִּי אֶת הַ/מַּחֲשָׁבֹ֗ת אֲשֶׁ֧ר אָנֹכִ֛י חֹשֵׁ֥ב עֲלֵי/כֶ֖ם נְאֻם יְהוָ֑ה מַחְשְׁב֤וֹת שָׁלוֹם֙ וְ/לֹ֣א לְ/רָעָ֔ה לָ/תֵ֥ת לָ/כֶ֖ם אַחֲרִ֥ית וְ/תִקְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/011.yaml
  text: For I know the plans that I have for you[a], declares Yahweh, plans for peace and not for harm[b], to give you a future and a hope.
translation:
  language: pt
  text: Pois eu conheço os planos que tenho para vocês, declara Yahweh, planos de paz[a] e não de desgraça[b], para dar a vocês um futuro e uma esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “planos de bem-estar”. O hebraico shalom pode incluir paz, integridade, bem-estar e prosperidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “de calamidade”, “de dano” ou “do mal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação e a promessa anteriores, preservando a ligação discursiva de modo natural em português.
- source_word: יָדַעְתִּי
  choice: eu conheço
  rationale: O perfeito do verbo estativo expressa conhecimento firme; o presente é a forma idiomática em português.
- source_word: הַמַּחֲשָׁבוֹת ... חֹשֵׁב עֲלֵיכֶם
  choice: os planos que tenho para vocês
  rationale: מַחֲשָׁבוֹת pode significar pensamentos, intenções ou planos. No contexto do propósito divino, 'planos' é adequado; a formulação evita a repetição pouco natural 'planos que planejo' sem apagar a orientação para os destinatários.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a força solene da fórmula profética e translitera o nome divino expresso no texto hebraico.
- source_word: מַחְשְׁבוֹת שָׁלוֹם
  choice: planos de paz
  rationale: Traduz שָׁלוֹם diretamente por 'paz', preservando em nota seu alcance mais amplo de bem-estar, integridade e prosperidade.
- source_word: וְלֹא לְרָעָה
  choice: e não de desgraça
  rationale: No contraste com שָׁלוֹם, רָעָה indica adversidade, calamidade ou dano, não necessariamente mal moral. 'Desgraça' expressa naturalmente esse sentido contextual.
- source_word: לָתֵת לָכֶם
  choice: para dar a vocês
  rationale: Expressa claramente a finalidade do infinitivo hebraico e mantém explícitos os destinatários plurais.
- source_word: אַחֲרִית
  choice: um futuro
  rationale: Embora possa significar fim, desfecho ou resultado final, neste contexto de promessa aponta para uma perspectiva futura positiva.
- source_word: תִקְוָה
  choice: uma esperança
  rationale: Preserva o sentido de esperança ou expectativa e forma um par natural com 'um futuro'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; 'Yahweh' o representa por transliteração, em vez de substituí-lo por um título.
- issue: Amplitude semântica de שָׁלוֹם
  choice: paz
  alternative: bem-estar; prosperidade
  rationale: A tradução principal mantém o equivalente lexical direto, enquanto a nota registra que o termo hebraico possui alcance mais amplo.
- issue: Natureza de רָעָה no contraste com שָׁלוֹם
  choice: desgraça
  alternative: mal; dano; calamidade
  rationale: O contexto contrasta bem-estar com adversidade e não exige uma referência ao mal moral; a tradução preserva essa leitura contextual sem excluir as alternativas lexicais.
- issue: Destinatários da promessa
  choice: vocês, no plural
  alternative: vós
  rationale: As formas hebraicas são plurais e, no contexto, dirigem-se à comunidade dos exilados. O português atual 'vocês' torna esse dado claro sem individualizar a promessa.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Emprega 'vocês' para tornar visível o plural hebraico e conserva 'Yahweh' como nome próprio. Os marcadores [a] e [b] aparecem imediatamente após os termos a que se referem.
