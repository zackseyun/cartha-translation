base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/016.yaml
  text: For thus says Yahweh concerning the king who sits on the throne of David[a], and concerning all the people who dwell in this city—your brothers who did not go out with you into exile—
translation:
  language: pt
  text: 'Pois assim diz Yahweh a respeito do rei que está sentado no trono de Davi e de todo o povo que mora nesta cidade — os irmãos de vocês[a], que não saíram com vocês para o exílio —:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os parentes de vocês”. O hebraico diz literalmente “os irmãos de vocês”, termo masculino plural de parentesco que, neste contexto, pode referir-se de modo amplo aos demais judeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou continuação do que foi dito anteriormente, preservando a força causal e discursiva.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética hebraica de modo formal, claro e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a respeito de
  rationale: Neste contexto, introduz o assunto da declaração divina, não seus destinatários diretos.
- source_word: הַיּוֹשֵׁב אֶל כִּסֵּא דָוִד
  choice: que está sentado no trono de Davi
  rationale: Identifica o rei davídico reinante e preserva a imagem concreta do texto hebraico.
- source_word: הַיּוֹשֵׁב בָּעִיר הַזֹּאת
  choice: que mora nesta cidade
  rationale: Expressa em português corrente a residência contínua indicada pelo particípio; a concordância no singular acompanha o coletivo 'povo'.
- source_word: אֲחֵיכֶם
  choice: os irmãos de vocês
  rationale: Preserva o substantivo masculino plural do hebraico e emprega uma forma de segunda pessoa plural amplamente compreensível.
- source_word: אֲשֶׁר לֹא יָצְאוּ אִתְּכֶם בַּגּוֹלָה
  choice: que não saíram com vocês para o exílio
  rationale: Mantém a voz ativa e o sentido básico de 'sair', deixando claro o destino da saída no contexto da deportação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Amplitude referencial de אֲחֵיכֶם
  choice: os irmãos de vocês
  alternative: os parentes de vocês; os compatriotas de vocês
  rationale: A tradução principal conserva a forma masculina plural do hebraico, enquanto a nota registra que o termo pode ter sentido coletivo mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção termina com travessão e dois-pontos porque a declaração introduzida continua no versículo seguinte.
