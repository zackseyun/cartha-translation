base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/028.yaml
  text: For this reason he sent to us in Babylon[a], saying, ‘It will be a long time. Build houses and live in them[b], and plant gardens and eat their fruit.’
translation:
  language: pt
  text: 'Pois foi por isso que ele nos enviou uma mensagem na Babilônia, dizendo: “Isso vai demorar.[a] Construam casas e morem nelas,[b] plantem jardins e comam seus frutos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Ela é longa”. A frase é elíptica e indica que a permanência, ou o exílio, na Babilônia seria prolongado.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e habitem”. “Morem nelas” explicita o complemento sugerido pela menção às casas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַל כֵּן
  choice: Pois foi por isso que
  rationale: Mantém a força causal da expressão e sua ligação com a queixa precedente, em português natural.
- source_word: שָׁלַח אֵלֵינוּ בָּבֶל
  choice: ele nos mandou dizer na Babilônia
  rationale: Explicita de modo idiomático que ele enviou uma mensagem aos destinatários que estavam na Babilônia; o conteúdo enviado é introduzido imediatamente por לֵאמֹר.
- source_word: לֵאמֹר
  choice: dizer
  rationale: Integra naturalmente o infinitivo hebraico à locução portuguesa “mandou dizer”, que introduz a fala citada.
- source_word: אֲרֻכָּה הִיא
  choice: Isso vai demorar
  rationale: Reproduz a expressão elíptica e seu sentido de duração prolongada sem inserir diretamente “exílio”, que não aparece de forma explícita nesta oração.
- source_word: בְּנוּ בָתִּים
  choice: Construam casas
  rationale: Tradução direta e natural do imperativo e seu objeto.
- source_word: וְשֵׁבוּ
  choice: e morem nelas
  rationale: No contexto de casas, “morar” comunica naturalmente o sentido de habitar; “nelas” torna explícito o complemento implícito.
- source_word: וְנִטְעוּ גַנּוֹת
  choice: plantem pomares
  rationale: Como o texto manda comer os frutos dessas plantações, “pomares” expressa com naturalidade o sentido contextual de גַנּוֹת, embora “jardins” também seja lexicalmente possível.
- source_word: וְאִכְלוּ אֶת פְּרִיהֶן
  choice: e comam de seus frutos
  rationale: Preserva a referência plural às plantações e traduz de modo idiomático a ordem de consumir o que elas produzirem.
