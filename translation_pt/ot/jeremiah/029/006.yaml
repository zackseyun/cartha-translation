  source_fidelity: 'O texto preserva com precisão os imperativos sucessivos do hebraico: casamento, geração de filhos e filhas, casamento dos filhos e filhas, crescimento no lugar do exílio e proibição de diminuição numérica. «Gerem» mantém adequadamente a nuance masculina de וְהוֹלִידוּ, e «para que elas deem à luz» expressa de forma fiel a finalidade/resultado de וְתֵלַדְנָה.'
