  terminology: A terminologia matrimonial e familiar está consistente e não introduz leitura doutrinária. «Filhos e filhas» conserva a explicitação do hebraico; «Multipliquem-se» e «não diminuam em número» refletem bem o contraste entre רבה e מעט. A nota em [a] corresponde corretamente à alternativa lexical de «não se tornem poucos».
