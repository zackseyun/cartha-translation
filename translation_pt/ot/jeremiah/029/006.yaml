  text: קְח֣וּ נָשִׁ֗ים וְ/הוֹלִידוּ֮ בָּנִ֣ים וּ/בָנוֹת֒ וּ/קְח֨וּ לִ/בְנֵי/כֶ֜ם נָשִׁ֗ים וְ/אֶת בְּנֽוֹתֵי/כֶם֙ תְּנ֣וּ לַֽ/אֲנָשִׁ֔ים וְ/תֵלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/רְבוּ שָׁ֖ם וְ/אַל תִּמְעָֽטוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
translation:
  language: pt
  text: Tomem mulheres por esposas e gerem filhos e filhas; tomem também mulheres por esposas para os seus filhos e deem suas filhas a homens em casamento, para que elas deem à luz filhos e filhas. Multipliquem-se ali e não diminuam em número.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se tornem poucos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ נָשִׁים
  choice: Tomem mulheres por esposas
  rationale: Explicita o sentido matrimonial da expressão hebraica sem reduzir נָשִׁים simplesmente a “esposas” nem sugerir que se trata apenas de tomar mulheres em geral.
- source_word: וְהוֹלִידוּ
  choice: gerem
  rationale: O hifil de ילד, com homens como sujeitos, indica gerar filhos. “Gerem” preserva essa nuance e soa natural no registro bíblico moderno.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a referência explícita do hebraico aos dois sexos, em vez de generalizá-la como “filhos” ou “crianças”.
- source_word: וּקְחוּ לִבְנֵיכֶם נָשִׁים
  choice: tomem também mulheres por esposas para os seus filhos
  rationale: Conserva a construção e o sentido matrimonial do original, com formulação portuguesa clara.
- source_word: וְאֶת בְּנוֹתֵיכֶם תְּנוּ לַאֲנָשִׁים
  choice: deem suas filhas a homens em casamento
  rationale: “Homens” corresponde lexicalmente a אֲנָשִׁים, enquanto “em casamento” torna explícito o sentido inequívoco no contexto.
- source_word: וְתֵלַדְנָה
  choice: para que elas deem à luz
  rationale: O imperfeito após os imperativos pode indicar finalidade ou resultado pretendido; “para que” preserva essa relação, e “deem à luz” expressa naturalmente o sujeito feminino.
- source_word: וּרְבוּ
  choice: Multipliquem-se
  rationale: Expressa o crescimento populacional e preserva o eco da linguagem bíblica associada a רבה.
- source_word: שָׁם
  choice: ali
  rationale: Retoma de modo natural o lugar do exílio mencionado no contexto.
- source_word: וְאַל תִּמְעָטוּ
  choice: e não diminuam em número
  rationale: Torna claro que מעט se refere à redução numérica da comunidade, em contraste direto com “Multipliquem-se”.
