  text: וְ/עַתָּ֗ה לָ֚/מָּה לֹ֣א גָעַ֔רְתָּ בְּ/יִרְמְיָ֖הוּ הָֽ/עֲנְּתֹתִ֑י הַ/מִּתְנַבֵּ֖א לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/027.yaml
  text: And now[a], why have you not rebuked Jeremiah the Anathothite, who is prophesying to you?
translation:
  language: pt
  text: E agora, por que você não repreendeu Jeremias, o anatotita[a], que está profetizando a vocês?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que é de Anatote”. O hebraico emprega um gentílico, literalmente “o anatotita”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que liga a frase ao contexto quanto o marcador temporal-discursivo.
- source_word: לָמָּה לֹא גָעַרְתָּ
  choice: por que você não repreendeu
  rationale: Expressa a pergunta direta e traduz גָּעַר pelo verbo natural “repreender”, que comunica censura firme. O singular “você” reflete a forma verbal hebraica singular.
- source_word: בְּיִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: הָעֲנְתֹתִי
  choice: o anatotita
  rationale: Mantém o gentílico hebraico, isto é, a designação de Jeremias como natural ou morador de Anatote; a nota oferece a formulação mais transparente.
- source_word: הַמִּתְנַבֵּא
  choice: que está profetizando
  rationale: O particípio com artigo descreve Jeremias em atividade profética contínua ou presente.
- source_word: לָכֶם
  choice: a vocês
  rationale: A preposição indica os destinatários da profecia, e o sufixo é plural, em contraste com o interlocutor singular do verbo anterior.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A distinção entre o destinatário singular (“você”) e o grupo plural (“vocês”) preserva a gramática hebraica. O gentílico pouco comum é mantido no texto por precisão formal e explicado em nota.
