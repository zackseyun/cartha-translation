    text: 'Ou: “aos sonhos que vocês sonham”. A expressão hebraica é difícil: pode referir-se aos sonhos do próprio povo ou a sonhos que eles, de algum modo, fomentavam ou faziam surgir.'
    reason: Preserva a ambiguidade lexical e a força causativa incomum da forma hebraica, enquanto esclarece que “promovem” não resolve definitivamente o sentido.
  revision_rationale: Substituí “fazem sonhar” por “promovem”. Esta opção expressa de modo natural a possível nuance causativa/intensiva do hifil, sem especificar se o povo sonhava, fomentava esses sonhos ou levava outros a sonhá-los. A nota mantém explicitamente a alternativa mais simples e a incerteza interpretativa.
