review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o título divino, a advertência contra profetas e adivinhos internos à comunidade e a difícil construção final com חלם no hifil. Contudo, “os sonhos que vocês fazem sonhar” em português faz de “sonhos” o sujeito semântico de “sonhar” (“fazer os sonhos sonharem”), produzindo uma leitura involuntariamente incoerente e não uma dificuldade equivalente à do hebraico.
  naturalness: O registro é moderno, claro e adequado. “Não deixem que ... os enganem” e “deem ouvidos” são idiomáticos. A cláusula final precisa de ajuste para conservar a indeterminação do hebraico sem criar uma construção semanticamente defeituosa em português.
  terminology: “Yahweh dos Exércitos”, “o Deus de Israel”, “profetas” e “adivinhos” são escolhas fiéis e consistentes. “Vocês” é apropriado ao português internacional de boa legibilidade brasileira.
  issues:
  - severity: medium
    issue: A expressão “os sonhos que vocês fazem sonhar” é semanticamente malformada em português.
    rationale: Com “fazer + infinitivo”, “os sonhos” tende a ser entendido como quem realiza a ação de sonhar. O hebraico tem uma forma hifil incomum e discutida, mas a tradução deve preservar essa dificuldade por meio de uma formulação portuguesa inteligível e de nota, não por uma relação semântica equivocada.
  revised_text: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel: Não deixem que os profetas que estão no meio de vocês e os seus adivinhos os enganem, nem deem ouvidos aos sonhos que vocês promovem.[a]'
  revised_footnotes:
