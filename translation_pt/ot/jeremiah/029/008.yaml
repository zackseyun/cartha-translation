  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַל יַשִּׁ֧יאוּ לָ/כֶ֛ם נְבִֽיאֵי/כֶ֥ם אֲשֶׁר בְּ/קִרְבְּ/כֶ֖ם וְ/קֹֽסְמֵי/כֶ֑ם וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חֲלֹמֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם מַחְלְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/008.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Do not let your prophets who are among you and your diviners deceive you, and do not listen to your dreams that you are causing to be dreamed.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel: Não deixem que os profetas que estão no meio de vocês e os seus adivinhos os enganem, nem deem ouvidos aos sonhos que vocês promovem.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos sonhos que vocês sonham”. A expressão hebraica é difícil: pode referir-se aos sonhos do próprio povo ou a sonhos que eles, de algum modo, fomentavam ou faziam surgir.'
    reason: Preserva a ambiguidade lexical e a força causativa incomum da forma hebraica, enquanto esclarece que “promovem” não resolve definitivamente o sentido.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressão consagrada e compreensível em português para o título divino, sem restringir a referência apenas a exércitos terrenos.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Mantém de modo direto a construção hebraica e a identificação pactual.
- source_word: אַל יַשִּׁיאוּ לָכֶם
  choice: Não deixem que ... os enganem
  rationale: Expressa naturalmente o sentido causativo de levar alguém ao engano.
- source_word: נְבִיאֵיכֶם אֲשֶׁר בְּקִרְבְּכֶם
  choice: os profetas que estão no meio de vocês
  rationale: Preserva a presença desses profetas dentro da comunidade dos exilados em linguagem atual.
- source_word: קֹסְמֵיכֶם
  choice: os seus adivinhos
  rationale: Designa de modo conciso os praticantes de adivinhação.
- source_word: וְאַל תִּשְׁמְעוּ אֶל
  choice: nem deem ouvidos a
  rationale: Equivalente idiomático que comunica escutar com aceitação ou obediência.
- source_word: חֲלֹמֹתֵיכֶם אֲשֶׁר אַתֶּם מַחְלְמִים
  choice: aos sonhos que vocês fazem sonhar
  rationale: Preserva o possessivo e a forma causativa incomum do hebraico, embora a expressão permaneça deliberadamente difícil.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome pessoal; a transliteração preserva essa característica sem substituí-lo por um título.
- issue: Agência na cláusula final sobre os sonhos
  choice: os sonhos que vocês fazem sonhar
  alternative: os sonhos que vocês sonham
  rationale: A forma verbal hebraica é causativa e incomum. A tradução mantém essa tensão sem decidir se o povo apenas sonhava, fomentava tais sonhos ou fazia outros sonhá-los.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. “Yahweh dos Exércitos” conserva o título bíblico; a cláusula final mantém intencionalmente a estranheza do original, esclarecida em nota.
