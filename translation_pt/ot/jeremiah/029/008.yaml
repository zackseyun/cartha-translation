revisions:
- from: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel: Não deixem que os profetas que estão no meio de vocês e os seus adivinhos os enganem, nem deem ouvidos aos sonhos que vocês fazem sonhar.[a]'
  to: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel: Não deixem que os profetas que estão no meio de vocês e os seus adivinhos os enganem, nem deem ouvidos aos sonhos que vocês promovem.[a]'
  rationale: Substituí “fazem sonhar” por “promovem”. Esta opção expressa de modo natural a possível nuance causativa/intensiva do hifil, sem especificar se o povo sonhava, fomentava esses sonhos ou levava outros a sonhá-los. A nota mantém explicitamente a alternativa mais simples e a incerteza interpretativa.
