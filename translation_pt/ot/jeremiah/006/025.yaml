base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/025.yaml
  text: Do not go out into the field[a], and do not walk on the road[b], for the sword of the enemy and terror are on every side.
translation:
  language: pt
  text: Não saia ao campo nem ande pela estrada[a], pois há espada do inimigo[b] e terror por todos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, as duas proibições estão no feminino singular, provavelmente dirigidas a Jerusalém, personificada como mulher ou como a filha de Sião.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “espada para o inimigo”, construção que pode indicar posse: “a espada do inimigo” ou “o inimigo tem uma espada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תצאי
  choice: Não saia
  rationale: A partícula negativa אַל com a forma verbal expressa proibição. A construção portuguesa é direta e natural; o singular corresponde ao hebraico.
- source_word: הַשָּׂדֶה
  choice: para o campo
  rationale: שׂדה designa o campo ou a região aberta fora da cidade. “Para o campo” comunica naturalmente o movimento para fora expresso pelo verbo יצא.
- source_word: וּבַדֶּרֶךְ אַל תלכי
  choice: nem ande pela estrada
  rationale: A coordenação negativa com “nem” é idiomática em português. דרך indica caminho ou estrada, e הלך pode significar andar ou ir.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão das proibições e preserva o tom conciso da advertência profética.
- source_word: חֶרֶב לְאֹיֵב
  choice: o inimigo tem uma espada
  rationale: A construção com לְ pode expressar posse. Esta formulação comunica isso com clareza em português, sem perder a imagem concreta da espada.
- source_word: מָגוֹר מִסָּבִיב
  choice: há terror por todos os lados
  rationale: מָגוֹר significa terror ou pavor, e מִסָּבִיב indica perigo circundante. A expressão também preserva o motivo recorrente em Jeremias.
