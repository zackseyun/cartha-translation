  source_fidelity: A tradução reconhece corretamente as duas proibições no feminino singular, o campo, a estrada e o terror circundante. Contudo, “o inimigo tem uma espada; há terror” transforma as duas expressões nominais hebraicas em duas orações explícitas e privilegia uma análise possível de לְאֹיֵב. Uma formulação mais próxima preserva melhor a concisão e a relação tradicional “espada do inimigo”, deixando a alternativa registrada em nota.
  naturalness: “Não saia ao campo nem ande pela estrada” é português moderno e claro. “Pois há espada do inimigo e terror por todos os lados” mantém um tom profético conciso e é inteligível; a ausência de artigo em “espada” reproduz de modo natural a imagem de ameaça armada sem introduzir um possuidor como sujeito da oração.
  terminology: “Terror por todos os lados” transmite bem מָגוֹר מִסָּבִיב e preserva o motivo recorrente de Jeremias. “Espada do inimigo” é uma representação segura de חֶרֶב לְאֹיֵב; a nota mantém explicitamente a possibilidade de entendê-lo como expressão possessiva idiomática.
