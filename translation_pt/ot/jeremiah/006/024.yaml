base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/024.yaml
  text: We have heard the report of it[a]; our hands hang limp. Distress has seized us[c][b], pain like a woman giving birth.
translation:
  language: pt
  text: Ouvimos a notícia a respeito dele[a]; nossas mãos perderam as forças[b]. A angústia se apoderou de nós; sentimos dores como as de uma mulher em trabalho de parto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a notícia sobre isso” ou “a notícia dele”. O hebraico pode designar a notícia acerca do inimigo ou, menos provavelmente neste contexto, o relato dele.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nossas mãos ficaram frouxas”, expressão que indica perda de força ou coragem.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dor como a de uma mulher que dá à luz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Ouvimos
  rationale: O perfeito qal na primeira pessoa do plural relata o ato de ouvir cujos efeitos se manifestam nas orações seguintes; em português, o pretérito perfeito é natural e suficiente.
- source_word: אֶת שָׁמְעוֹ
  choice: a notícia a respeito dele
  rationale: שֵׁמַע/שֶׁמַע designa notícia ou relato, e o sufixo masculino singular permite entender uma notícia relativa ao inimigo que se aproxima. A formulação mantém explícito o referente pessoal sem sugerir necessariamente que ele próprio transmitiu a notícia.
- source_word: רָפוּ יָדֵינוּ
  choice: nossas mãos perderam as forças
  rationale: A expressão idiomática descreve perda de força ou coragem; a tradução conserva a imagem das mãos e comunica seu sentido em português corrente.
- source_word: צָרָה
  choice: A angústia
  rationale: צָרָה pode indicar aflição, angústia ou situação opressiva; 'angústia' se ajusta à reação de medo retratada no contexto.
- source_word: הֶחֱזִיקַתְנוּ
  choice: se apoderou de nós
  rationale: O hifil de חזק aqui expressa agarrar ou dominar. 'Apoderou-se de nós' é vívido e idiomático.
- source_word: חִיל
  choice: dores
  rationale: חִיל pode indicar contorção, angústia ou dores de parto. O plural 'dores' combina naturalmente com a comparação explícita ao trabalho de parto.
- source_word: כַּיּוֹלֵדָה
  choice: como as de uma mulher em trabalho de parto
  rationale: O particípio de ילד com כ compara a experiência às dores de uma mulher no ato de dar à luz; a expressão é clara, atual e preserva a imagem.
