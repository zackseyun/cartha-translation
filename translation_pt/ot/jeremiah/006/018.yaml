id: JER.6.18
reference: Jeremiah 6:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֖ן שִׁמְע֣וּ הַ/גּוֹיִ֑ם וּ/דְעִ֥י עֵדָ֖ה אֶת אֲשֶׁר בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/018.yaml
  text: Therefore hear[a], O nations, and know, O congregation[b], what is among them.
translation:
  language: pt
  text: Por isso, escutem, ó nações; e saiba, ó assembleia[a], o que há entre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comunidade” ou “congregação”. O termo hebraico é coletivo, e seu referente exato aqui é discutido.
    reason: lexical_alternative
  - marker: b
    text: Ou “o que há neles”. A expressão hebraica é concisa e pode indicar o que se encontra dentro deles ou entre eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência da denúncia anterior de modo natural e mantém a ligação lógica do hebraico.
- source_word: שִׁמְעוּ
  choice: escutem
  rationale: Imperativo plural que expressa uma convocação à escuta atenta; em português atual, “escutem” comunica isso com clareza.
- source_word: הַגּוֹיִם
  choice: nações
  rationale: Equivalente amplo e adequado ao discurso profético, sem acrescentar a conotação mais específica de “gentios”.
- source_word: וּדְעִי
  choice: e saiba
  rationale: Preserva o imperativo feminino singular, em correspondência com o substantivo coletivo feminino “assembleia”, sem uniformizá-lo com o imperativo plural anterior.
- source_word: עֵדָה
  choice: assembleia
  rationale: Representa o substantivo coletivo e permite manter o vocativo singular. “Comunidade” e “congregação” também são possíveis, pois o referente exato é discutido.
- source_word: אֶת אֲשֶׁר בָּם
  choice: o que há entre eles
  rationale: Mantém a concisão e a indeterminação da expressão hebraica, sem especificar indevidamente aquilo que se encontra entre ou dentro deles.
theological_decisions:
- issue: Referente e função de עֵדָה na segunda oração imperativa
  choice: 'Entender עֵדָה como vocativo coletivo singular: “ó assembleia”.'
  alternative: Entendê-lo em aposição às nações (“assembleia das nações”) ou adotar uma reconstrução do texto por causa da dificuldade da frase.
  rationale: A vocalização massorética apresenta um imperativo feminino singular seguido de um substantivo coletivo feminino. O vocativo preserva essa forma e a tensão retórica do texto sem recorrer a emenda conjectural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O contraste entre o imperativo plural “escutem” e o singular “saiba” foi mantido por refletir a forma do hebraico. O ponto e vírgula ajuda a tornar perceptível a mudança de destinatário sem resolver a ambiguidade do verso.
