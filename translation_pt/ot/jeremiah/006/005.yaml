  yaml_path: translation/ot/jeremiah/006/005.yaml
  text: Rise up[a], and let us go up by night, and let us destroy her palaces.
translation:
  language: pt
  text: Levantem-se! Subamos à noite e destruamos os palácios dela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as cidadelas dela” ou “as fortalezas dela”. O termo hebraico pode designar construções fortificadas de destaque, além de edifícios palacianos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמוּ
  choice: Levantem-se!
  rationale: Imperativo masculino plural de קום. A forma transmite uma convocação direta e urgente, com naturalidade no português atual.
- source_word: וְ/נַעֲלֶ֣ה
  choice: Subamos
  rationale: O coortativo na primeira pessoa do plural expressa exortação conjunta. “Subamos” preserva tanto essa força quanto a imagem hebraica de subir, sem explicitar interpretativamente “ataquemos”.
- source_word: בַ/לָּ֔יְלָה
  choice: de noite
  rationale: Expressão temporal corrente e natural, indicando que a ação militar ocorrerá durante a noite.
- source_word: וְ/נַשְׁחִ֖יתָה
  choice: e destruamos
  rationale: O coortativo causativo comunica ação destrutiva deliberada e compartilhada; “destruamos” mantém a força e a clareza do verbo.
- source_word: אַרְמְנוֹתֶֽי/הָ
  choice: os palácios dela
  rationale: O substantivo plural com sufixo feminino singular designa as estruturas proeminentes da cidade personificada. “Palácios” é a tradução principal tradicional e contextual, enquanto “dela” conserva explicitamente a referência feminina.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O primeiro e foi representado pela progressão entre frases, evitando uma coordenação pesada; o segundo foi mantido. O marcador foi colocado junto de “palácios”, termo ao qual a nota lexical efetivamente se refere.
