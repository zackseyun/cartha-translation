id: JER.6.19
reference: Jeremiah 6:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעִ֣י הָ/אָ֔רֶץ הִנֵּ֨ה אָנֹכִ֜י מֵבִ֥יא רָעָ֛ה אֶל הָ/עָ֥ם הַ/זֶּ֖ה פְּרִ֣י מַחְשְׁבוֹתָ֑/ם כִּ֤י עַל דְּבָרַ/י֙ לֹ֣א הִקְשִׁ֔יבוּ וְ/תוֹרָתִ֖/י וַ/יִּמְאֲסוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/019.yaml
  text: 'Hear[a], O earth: behold, I am bringing disaster on this people, the fruit of their thoughts, because they have not listened to my words[b], and they have rejected my law.'
translation:
  language: pt
  text: Ouça, ó terra! Eis que estou trazendo calamidade sobre este povo, o fruto dos seus pensamentos[a], porque não deram atenção às minhas palavras e rejeitaram a minha lei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fruto dos seus planos” ou “o resultado dos seus projetos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a minha instrução”. O termo hebraico torá pode significar “lei” ou “instrução”; aqui, “lei” preserva a força pactual da acusação.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Ouça
  rationale: O imperativo feminino singular dirige-se à terra personificada. “Ouça” preserva a convocação profética em linguagem atual e digna.
- source_word: הָאָרֶץ
  choice: ó terra
  rationale: A forma de vocativo apresenta a terra como testemunha personificada; “terra” é preferível a “país” ou “território” neste contexto.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz solenemente o anúncio divino e preserva a força profética da partícula hebraica.
- source_word: מֵבִיא רָעָה
  choice: estou trazendo calamidade
  rationale: רָעָה designa aqui uma calamidade decorrente do juízo, não o mal moral. A construção progressiva reflete o particípio hebraico.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Reproduz naturalmente o substantivo coletivo singular com demonstrativo e mantém o tom profético de acusação.
- source_word: פְּרִי מַחְשְׁבוֹתָם
  choice: o fruto dos seus pensamentos
  rationale: Preserva a metáfora do fruto como consequência produzida pelo modo de pensar do povo, sem restringir o sentido a planos ou intrigas.
- source_word: עַל דְּבָרַי לֹא הִקְשִׁיבוּ
  choice: não deram atenção às minhas palavras
  rationale: הקשיב com עַל expressa escutar atentamente ou prestar atenção. A tradução evita explicitar “obedecer”, embora a desobediência esteja implícita.
- source_word: וְתוֹרָתִי
  choice: a minha lei
  rationale: No contexto profético da aliança, “lei” conserva a força vinculante da instrução revelada por Deus; a alternativa “instrução” é registrada em nota.
- source_word: וַיִּמְאֲסוּ בָהּ
  choice: rejeitaram
  rationale: מאס comunica repúdio ou recusa. “Rejeitaram” é forte, claro e natural em português; o pronome hebraico é expresso pelo objeto já mencionado, “a minha lei”.
theological_decisions:
- issue: Tradução de תּוֹרָה no contexto profético da aliança
  choice: a minha lei
  alternative: a minha instrução
  rationale: “Lei” preserva o peso jurídico e pactual da acusação contra o povo, sem negar que תּוֹרָה também pode significar ensino ou instrução; essa possibilidade lexical fica indicada em nota.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira e vocabulário amplamente compreensível. “Eis que” mantém a solenidade profética; “calamidade” evita que רָעָה seja entendido como mal moral. Os marcadores de nota foram posicionados junto às expressões efetivamente comentadas.
