id: JER.6.11
reference: Jeremiah 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵת֩ חֲמַ֨ת יְהוָ֤ה מָלֵ֨אתִי֙ נִלְאֵ֣יתִי הָכִ֔יל שְׁפֹ֤ךְ עַל עוֹלָל֙ בַּ/ח֔וּץ וְ/עַ֛ל ס֥וֹד בַּחוּרִ֖ים יַחְדָּ֑ו כִּֽי גַם אִ֤ישׁ עִם אִשָּׁה֙ יִלָּכֵ֔דוּ זָקֵ֖ן עִם מְלֵ֥א יָמִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/011.yaml
  text: But I am full of the wrath of Yahweh[a]; I am weary of holding it in. Pour it out on the child in the street, and on the company of young men together; for both man and woman will be taken[b], the old man along with the very aged.
translation:
  language: pt
  text: Mas eu estou cheio da ira de Yahweh[a]; estou cansado de contê-la. Derrame-a sobre a criança na rua e sobre o grupo de jovens reunidos, pois tanto o homem como a mulher serão capturados, o idoso junto com o muito idoso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do furor de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cheio de dias”, expressão que indica alguém de idade muito avançada.
    reason: idiom_explanation
lexical_decisions:
- source_word: חֲמַת יְהוָה
  choice: a ira de Yahweh
  rationale: חֵמָה indica ira intensa ou furor no contexto de juízo profético; “ira” preserva a força judicial sem soar excessivamente incomum. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: מָלֵאתִי
  choice: estou cheio
  rationale: O perfeito descreve o estado presente do profeta como resultado de ter sido enchido; a formulação mantém a imagem do hebraico.
- source_word: נִלְאֵיתִי הָכִיל
  choice: estou cansado de contê-la
  rationale: A expressão comunica exaustão por reter a ira mencionada. O pronome feminino retoma naturalmente “ira” em português.
- source_word: שְׁפֹךְ
  choice: Derrame-a
  rationale: A forma é traduzida como imperativo, preservando a sequência abrupta do hebraico; o objeto implícito é explicitado pelo pronome que retoma “ira”.
- source_word: עוֹלָל בַּחוּץ
  choice: a criança na rua
  rationale: עוֹלָל designa uma criança pequena, e בַּחוּץ aponta para o espaço público exterior, aqui expresso naturalmente como “na rua”.
- source_word: סוֹד בַּחוּרִים יַחְדָּו
  choice: o grupo de jovens reunidos
  rationale: סוֹד pode indicar círculo, companhia ou grupo; neste contexto não exige a ideia de conselho formal. “Reunidos” representa יַחְדָּו de modo idiomático.
- source_word: יִלָּכֵדוּ
  choice: serão capturados
  rationale: O nifal de לכד denota ser apanhado, tomado ou capturado. “Capturados” comunica claramente a sujeição ao juízo, sem limitar necessariamente a cena a uma prisão formal.
- source_word: אִישׁ עִם אִשָּׁה
  choice: tanto o homem como a mulher
  rationale: O par é genérico e inclui ambos os sexos, sem impor a interpretação específica de marido e esposa.
- source_word: זָקֵן עִם מְלֵא יָמִים
  choice: o idoso junto com aquele que está cheio de dias
  rationale: A tradução preserva a distinção entre o idoso e a expressão idiomática intensiva “cheio de dias”; uma nota esclarece seu sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pactual presente no texto hebraico, sem substituí-lo por um título.
- issue: Identidade do falante e força de שְׁפֹךְ
  choice: O profeta declara estar cheio da ira de Yahweh e em seguida emprega o imperativo “Derrame-a”
  alternative: 'Entender a frase como ordem direta de Yahweh ou como declaração da intenção do profeta: “eu a derramarei”'
  rationale: A sequência hebraica é comprimida e admite mais de uma análise discursiva. A tradução mantém a mudança abrupta para o imperativo sem identificar além do texto o destinatário da ordem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a intensidade e a transição abrupta do hebraico. A expressão “cheio de dias” foi mantida no texto para conservar a imagem original e explicada em nota.
