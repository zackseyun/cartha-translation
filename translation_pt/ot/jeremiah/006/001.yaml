language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָעִ֣זוּ בְּנֵ֣י בִניָמִ֗ן מִ/קֶּ֨רֶב֙ יְר֣וּשָׁלִַ֔ם וּ/בִ/תְק֨וֹעַ֙ תִּקְע֣וּ שׁוֹפָ֔ר וְ/עַל בֵּ֥ית הַכֶּ֖רֶם שְׂא֣וּ מַשְׂאֵ֑ת כִּ֥י רָעָ֛ה נִשְׁקְפָ֥ה מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/001.yaml
  text: Take cover[a], sons of Benjamin, from the midst of Jerusalem! Blow the trumpet in Tekoa, and raise a signal over Beth-haccherem, for disaster is looking down from the north[d][c][b], and great destruction.
translation:
  language: pt
  text: Busquem refúgio[a], filhos de Benjamim, saindo do meio de Jerusalém! Toquem a trombeta em Tecoa e levantem um sinal[c] sobre Bete-Haquerém[b], pois uma calamidade espreita do norte[d], e grande destruição se aproxima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fujam para um lugar seguro” ou “Reúnam-se para fugir”. O imperativo hebraico é difícil e pode indicar a busca urgente por segurança.'
    reason: lexical_alternative
  - marker: b
    text: Bete-Haquerém é o nome de um lugar, provavelmente situado num ponto elevado usado para transmitir sinais de alerta entre Jerusalém e Tecoa.
    reason: cultural_note
  - marker: c
    text: 'Ou: “levantem um farol de aviso” ou “ergam uma fogueira de sinalização”.'
    reason: lexical_alternative
  - marker: d
    text: Literalmente, o hebraico diz que “uma calamidade olha para baixo desde o norte”, personificando a desgraça que se aproxima.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִזוּ
  choice: Busquem refúgio
  rationale: O imperativo hebraico é difícil, mas, no contexto de alarme e invasão iminente, indica uma busca urgente por segurança. A formulação portuguesa é natural e mantém a ação sem reduzi-la a uma simples exortação à coragem.
- source_word: בְּנֵי בִנְיָמִן
  choice: filhos de Benjamim
  rationale: Preserva de perto a expressão filial hebraica e a identidade tribal, embora o grupo seja entendido coletivamente.
- source_word: מִקֶּרֶב יְרוּשָׁלִַם
  choice: saindo do meio de Jerusalém
  rationale: Expressa o movimento para fora indicado por מִן e preserva a ideia de partir do interior da cidade.
- source_word: וּבִתְקוֹעַ תִּקְעוּ שׁוֹפָר
  choice: Toquem a trombeta em Tecoa
  rationale: A repetição sonora entre o nome Tecoa e o verbo hebraico não pode ser reproduzida naturalmente. 'Trombeta' comunica com clareza o instrumento usado como sinal de alarme, embora שׁוֹפָר designe propriamente uma trompa.
- source_word: וְעַל בֵּית הַכֶּרֶם
  choice: sobre Bete-Haquerém
  rationale: Mantém o valor espacial de עַל e translitera o topônimo de modo legível em português.
- source_word: שְׂאוּ מַשְׂאֵת
  choice: levantem um sinal
  rationale: Mantém aberta a natureza exata do objeto erguido, que pode ter sido um marco visual, uma fogueira ou outro sinal de aviso.
- source_word: כִּי רָעָה
  choice: pois uma calamidade
  rationale: Neste contexto profético, רָעָה designa desgraça ou calamidade, não necessariamente mal moral.
- source_word: נִשְׁקְפָה
  choice: espreita
  rationale: Preserva a personificação e a imagem de algo que olha a partir de uma posição elevada, com expressão mais natural em português do que 'olha para baixo'.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Traduz diretamente a direção de onde se aproxima o juízo invasor.
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: e uma grande destruição
  rationale: שֶׁבֶר evoca quebra ou ruína; 'grande destruição' comunica o sentido contextual sem impor a imagem literal de um estrondo ou fratura.
theological_decisions:
- issue: Tratamento da designação tribal masculina
  choice: filhos de Benjamim
  alternative: povo de Benjamim; benjamitas
  rationale: A expressão filial masculina do hebraico foi preservada, sem negar seu funcionamento coletivo como referência ao grupo tribal.
- issue: Linguagem do juízo iminente
  choice: calamidade ... grande destruição
  alternative: mal ... grande ruína
  rationale: Os termos descrevem aqui as consequências calamitosas do juízo, não uma afirmação abstrata sobre o mal moral.
- issue: Personificação da calamidade
  choice: uma calamidade espreita do norte
  alternative: uma calamidade aparece do norte
  rationale: A escolha conserva a imagem hebraica de a calamidade olhar de uma altura, sem explicar teologicamente a identidade ou a agência do invasor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a designação tribal tradicional, a urgência militar e a personificação poética. A coordenação final permanece ligeiramente elíptica, refletindo a tensão sintática do hebraico.
