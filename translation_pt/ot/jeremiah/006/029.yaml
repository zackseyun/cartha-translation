id: JER.6.29
reference: Jeremiah 6:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נָחַ֣ר מַפֻּ֔חַ מ/אשת/ם עֹפָ֑רֶת לַ/שָּׁוְא֙ צָרַ֣ף צָר֔וֹף וְ/רָעִ֖ים לֹ֥א נִתָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/029.yaml
  text: The bellows blow fiercely[a]; the lead is consumed by the fire. In vain the refiner keeps refining[b], but the wicked are not separated out.
translation:
  language: pt
  text: O fole sopra com força[a]; o chumbo é consumido pelo fogo. Em vão o refinador continua refinando, mas os maus não são separados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O fole está chamuscado” ou “O fole se queimou; pelo fogo deles, o chumbo é consumido”. O hebraico desta oração é difícil, e há diferentes entendimentos sobre a relação entre o fole, o fogo e o chumbo.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “os perversos não são removidos”; em sentido mais estritamente metalúrgico: “as impurezas não são retiradas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחַר
  choice: sopra com força
  rationale: O verbo pode descrever bufar, ofegar ou arder. Tendo “fole” como sujeito, “sopra com força” expressa de modo natural a intensa corrente de ar, sem esconder em nota a dificuldade do hebraico.
- source_word: מַפֻּחַ
  choice: fole
  rationale: Designa o instrumento usado para insuflar ar no fogo da fundição; “fole” é o equivalente português claro e tradicional nesse contexto.
- source_word: מֵאִשְׁתָּם
  choice: pelo fogo
  rationale: A forma hebraica é difícil. No contexto, indica a ação do fogo sobre o chumbo; a tradução adota uma leitura instrumental natural, enquanto a nota registra outras relações sintáticas possíveis.
- source_word: עֹפָרֶת
  choice: o chumbo
  rationale: O substantivo designa chumbo, empregado no processo metalúrgico de refinação.
- source_word: לַשָּׁוְא
  choice: Em vão
  rationale: A expressão indica que o esforço de refinação não alcança seu objetivo e mantém a concisão e a força profética do original.
- source_word: צָרַף ... צָרוֹף
  choice: o refinador continua refinando
  rationale: A repetição da raiz intensifica ou prolonga a ação. Esta formulação reproduz o aspecto reiterado em português corrente; “o refinador” é inferido do contexto metalúrgico.
- source_word: וְרָעִים
  choice: os maus
  rationale: O adjetivo pode designar pessoas más e, dentro da metáfora, evocar material ruim ou impurezas. “Os maus” preserva a acusação moral dirigida ao povo sem apagar a imagem metalúrgica.
- source_word: נִתָּקוּ
  choice: não são separados
  rationale: No contexto da refinação, o verbo comunica que os elementos indesejáveis não são retirados ou apartados. “Separados” preserva a metáfora e sua aplicação humana.
theological_decisions:
- issue: Interpretação da metáfora da refinação
  choice: A refinação fracassada retrata a persistência moral dos maus, que não são separados apesar do esforço purificador.
  alternative: Ler a frase apenas como descrição técnica de um processo metalúrgico malsucedido, traduzindo וְרָעִים como “impurezas”.
  rationale: O contexto imediato aplica a linguagem de provar e refinar ao povo. A tradução mantém simultaneamente a cena metalúrgica e seu referente moral, sem reduzir a expressão a uma explicação puramente técnica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Sopra com força” é mais corrente que “bufa furiosamente”; “continua refinando” conserva a intensidade verbal sem soar artificial. As notas preservam a dificuldade textual e a sobreposição entre a metáfora metalúrgica e a denúncia moral.
