source:
  edition: WLC
  text: כֶּ֣סֶף נִמְאָ֔ס קָרְא֖וּ לָ/הֶ֑ם כִּֽי מָאַ֥ס יְהוָ֖ה בָּ/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/030.yaml
  text: They call them rejected silver[a], because Yahweh has rejected them.
translation:
  language: pt
  text: Chamam-nos de prata rejeitada[a], porque Yahweh os rejeitou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “prata imprestável” ou “prata desprezada”. A expressão hebraica retoma a imagem da refinação: metal considerado sem valor depois de provado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: prata
  rationale: O substantivo significa normalmente “prata”; no contexto da refinação, refere-se ao metal, não a dinheiro.
- source_word: נִמְאָס
  choice: rejeitada
  rationale: O particípio passivo de מאס expressa algo recusado após avaliação. “Rejeitada” é natural e permite conservar a repetição da mesma raiz no fim do versículo.
- source_word: קָרְאוּ לָהֶם
  choice: Chamam-nos
  rationale: Mantém diretamente o verbo hebraico na terceira pessoa do plural com sujeito indefinido, sem acrescentar quem lhes dá esse nome.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a causa da designação.
- source_word: מָאַס
  choice: rejeitou
  rationale: 'Traduz pela mesma família lexical usada em נִמְאָס, preservando a repetição deliberada: são “prata rejeitada” porque Yahweh os “rejeitou”.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico.
- source_word: בָּהֶם
  choice: os
  rationale: Com מאס, a preposição assinala idiomaticamente o objeto da rejeição; em português, a construção natural é “rejeitou-os”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem o substituir por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Chamam-nos” preserva a forma ativa e o sujeito indefinido do hebraico; a repetição “rejeitada/rejeitou” conserva o jogo lexical do original.
