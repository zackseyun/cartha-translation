  text: וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ צֹפִ֔ים הַקְשִׁ֖יבוּ לְ/ק֣וֹל שׁוֹפָ֑ר וַ/יֹּאמְר֖וּ לֹ֥א נַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/017.yaml
  text: 'I set watchmen over you: ‘Listen to the sound of the trumpet!’ But they said[b][a], ‘We will not listen.’'
translation:
  language: pt
  text: 'Eu coloquei sentinelas sobre vocês: “Escutem o som do shofar[a]!” Mas eles disseram: “Não escutaremos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Shofar: instrumento feito de chifre, usado aqui como sinal de alarme; tradicionalmente, “trombeta”.'
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Eu coloquei
  rationale: O hifil de קום pode significar fazer ficar de pé, estabelecer ou designar. “Coloquei” preserva a imagem concreta de posicionar sentinelas e soa natural em português.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: A preposição עַל com o sufixo de segunda pessoa plural descreve as sentinelas postas em relação de supervisão sobre o povo, sem sugerir indevidamente hostilidade.
- source_word: צֹפִים
  choice: sentinelas
  rationale: O particípio de צפה designa pessoas que vigiam e dão o alerta. “Sentinelas” comunica de modo claro e digno tanto a vigilância quanto a função de advertência.
- source_word: הַקְשִׁיבוּ
  choice: Escutem
  rationale: O imperativo plural de קשב pede atenção auditiva. “Escutem” é atual, direto e mantém o elo lexical com a recusa posterior.
- source_word: לְקוֹל
  choice: o som do
  rationale: קוֹל pode significar voz ou som; com שׁוֹפָר, “som” é a combinação natural e não restringe a expressão a um tipo específico de toque.
- source_word: שׁוֹפָר
  choice: shofar
  rationale: O termo hebraico designa o instrumento de chifre usado, entre outras funções, para dar alarme. O empréstimo “shofar” preserva a referência cultural específica, esclarecida em nota.
- source_word: וַיֹּאמְרוּ
  choice: Mas eles disseram
  rationale: Embora o waw faça a narrativa avançar, “mas” explicita em português o contraste evidente entre a ordem de escutar e a recusa do povo, sem acrescentar conteúdo estranho ao texto.
- source_word: לֹא נַקְשִׁיב
  choice: Não escutaremos
  rationale: O imperfeito na primeira pessoa do plural com לֹא expressa recusa. O futuro mantém a força volitiva e repete o verbo usado na ordem anterior.
theological_decisions:
- issue: Identidade e função das sentinelas
  choice: Manter a imagem ampla de sentinelas estabelecidas por Deus para advertir o povo, sem identificar explicitamente quem são.
  alternative: Especificá-las como profetas, líderes ou vigias militares em sentido metafórico.
  rationale: O hebraico não resolve a identidade exata. “Sentinelas” preserva a metáfora profética e sua tensão interpretativa sem impor uma leitura denominacional ou excessivamente estreita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o plural do hebraico; “sentinelas” é corrente e inclusivo quanto à identidade dos advertidores. A repetição de “escutem/escutaremos” reproduz o contraste lexical do original.
