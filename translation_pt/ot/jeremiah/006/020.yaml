review_pass:
  verdict: revise
  source_fidelity: A pergunta retórica hebraica, a procedência dos dois aromáticos e a dupla rejeição dos sacrifícios estão corretamente compreendidas. Contudo, לְבוֹנָה designa especificamente olíbano (frankincense), não incenso em sentido geral; a nota não compensa plenamente essa imprecisão no texto principal. A formulação “trazer-me” também introduz uma ação de oferta mais explícita do que o verbo “vir” do hebraico, embora seja inferível no contexto.
  naturalness: A redação é clara e de bom registro. “De que me serve ... que vem de ...?” preserva a pergunta retórica com mais proximidade ao hebraico e continua inteiramente natural em português moderno.
  terminology: “Holocaustos” é o equivalente técnico adequado para עֹלוֹת, e “sacrifícios” traduz bem זִבְחֵיכֶם. “Olíbano” é o termo preciso para לְבוֹנָה; “cana aromática” é uma boa solução acessível para קָנֶה הַטּוֹב.
  issues:
  - severity: medium
    issue: “Incenso” é demasiado genérico para לְבוֹנָה.
    rationale: O hebraico refere-se especificamente ao olíbano, uma resina aromática. Como a precisão do item comercial e cultual é preservável em português, o termo específico deve figurar no texto principal.
  - severity: low
    issue: “Por que trazer-me” explicita uma ação que o hebraico não enuncia diretamente.
    rationale: תָבוֹא significa “vem/virá”; a pergunta trata da utilidade do olíbano vindo de Sabá. Uma formulação com “vem” conserva melhor a imagem verbal sem perder naturalidade.
  revised_text: De que me serve o olíbano que vem de Sabá e a cana aromática de uma terra distante? Os holocaustos de vocês não são aceitáveis, e os seus sacrifícios não me agradam.
