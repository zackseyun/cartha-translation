base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/020.yaml
  text: 'Why is this to me: frankincense comes from Sheba[a], and sweet cane from a distant land? Your burnt offerings are not acceptable[b], and your sacrifices do not please me.'
translation:
  language: pt
  text: De que me serve o olíbano que vem de Sabá e a cana aromática de uma terra distante? Os holocaustos de vocês não são aceitáveis, e os seus sacrifícios não me agradam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה זֶּה לִי
  choice: Por que trazer-me
  rationale: Expressa em português natural a pergunta retórica sobre a inutilidade de trazer esses produtos a Deus, preservando o dativo לִי (“a mim/para mim”).
- source_word: לְבוֹנָה
  choice: incenso
  rationale: Embora o termo designe especificamente olíbano, “incenso” é a forma corrente e compreensível em português; a nota registra a opção mais precisa.
- source_word: מִשְּׁבָא
  choice: de Sabá
  rationale: Mantém o nome geográfico tradicional da região fornecedora do produto importado.
- source_word: תָבֹוא
  choice: trazer-me
  rationale: O imperfeito, dentro da pergunta retórica, descreve a vinda do produto; a formulação portuguesa explicita de modo idiomático a ação pressuposta de trazê-lo a Deus.
- source_word: קָנֶה הַטּוֹב
  choice: cana aromática
  rationale: O substantivo significa cana ou junco, e o adjetivo indica aqui uma variedade valiosa e aromática. A escolha evita o tecnicismo pouco conhecido “cálamo”.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: de uma terra distante
  rationale: Preserva diretamente a ênfase geográfica na procedência remota.
- source_word: עֹלוֹתֵיכֶם
  choice: os holocaustos de vocês
  rationale: “Holocausto” é o termo sacrificial tradicional para a oferta inteiramente queimada; “de vocês” oferece leitura amplamente natural em português brasileiro.
- source_word: לֹא לְרָצוֹן
  choice: não são aceitáveis
  rationale: Comunica claramente que as ofertas não recebem favor nem aceitação diante de Deus.
- source_word: זִבְחֵיכֶם
  choice: os seus sacrifícios
  rationale: Verte o termo sacrificial amplo por seu equivalente português normal.
- source_word: לֹא עָרְבוּ לִי
  choice: não me agradam
  rationale: Reproduz idiomaticamente a ideia de não serem agradáveis ou aprazíveis a Deus.
theological_decisions:
- issue: Rejeição divina do culto sacrificial
  choice: A pergunta retórica e as duas negativas apresentam a rejeição, por Deus, dos produtos cultuais importados e dos sacrifícios.
  alternative: 'Uma formulação mais literal poderia dizer: “Por que isto para mim: incenso vem de Sabá...?”'
  rationale: A tradução conserva a força da rejeição expressa no hebraico sem acrescentar ao versículo uma explicação sobre a causa moral dessa rejeição.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sintaxe retórica foi naturalizada sem eliminar a pergunta do original. “Holocaustos” preserva o vocabulário cultual técnico, enquanto “cana aromática” evita um termo botânico excessivamente raro.
