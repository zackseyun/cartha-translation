id: JER.6.22
reference: Jeremiah 6:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֛ה עַ֥ם בָּ֖א מֵ/אֶ֣רֶץ צָפ֑וֹן וְ/ג֣וֹי גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/022.yaml
  text: 'Thus says Yahweh: Behold[a], a people is coming from the land of the north, and a great nation is stirred up from the farthest parts of the earth.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Eis que um povo vem da terra do norte, e uma grande nação é despertada dos confins da terra.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das extremidades da terra” ou “das regiões remotas do país”. A expressão hebraica se refere aos extremos ou lugares mais distantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e solene a fórmula profética de mensageiro, mantendo o presente idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Conserva a chamada enfática à atenção e a vivacidade do anúncio profético.
- source_word: עַם בָּא
  choice: um povo vem
  rationale: Mantém o sentido coletivo de עַם e apresenta a aproximação do invasor com vivacidade, sem tornar explícito um aspecto verbal além do necessário.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: da terra do norte
  rationale: Preserva tanto o elemento geográfico 'terra' quanto a procedência setentrional; o contexto pode apontar para a região de onde o invasor se aproxima.
- source_word: וְגוֹי גָּדוֹל
  choice: e uma grande nação
  rationale: Mantém a distinção lexical e o paralelismo entre עַם, 'povo', e גּוֹי, 'nação'.
- source_word: יֵעוֹר
  choice: é despertada
  rationale: Expressa o provável sentido passivo do nifal de עור, isto é, uma nação despertada ou incitada para agir, sem identificar uma agência que o hebraico não declara.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: dos confins da terra
  rationale: Comunica de maneira idiomática as extremidades ou regiões muito remotas indicadas por יַרְכְּתֵי, preservando a possibilidade de alcance geográfico amplo.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama יְהוָה. A transliteração preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Agência no despertar da grande nação
  choice: é despertada
  alternative: se levanta; é mobilizada
  rationale: A forma passiva hebraica não nomeia quem desperta a nação. A tradução conserva essa indeterminação e evita explicitar uma agência divina ou humana.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eis que” preserva o tom profético elevado; “confins da terra” é idiomático e digno sem ser obscuro. O marcador da nota foi colocado junto à expressão que ela esclarece.
