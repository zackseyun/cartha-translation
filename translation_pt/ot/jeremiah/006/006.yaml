id: JER.6.6
reference: Jeremiah 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּרְת֣וּ עֵצָ֔ה וְ/שִׁפְכ֥וּ עַל יְרוּשָׁלִַ֖ם סֹלְלָ֑ה הִ֚יא הָ/עִ֣יר הָפְקַ֔ד כֻּלָּ֖/הּ עֹ֥שֶׁק בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/006.yaml
  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos: “Cortem árvores e levantem uma rampa de cerco contra Jerusalém. Esta é a cidade que deve ser castigada[a]; dentro dela só há opressão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta é a cidade que deve ser visitada”, isto é, chamada a prestar contas em juízo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo amplo, tradicional e compreensível, sem restringi-lo apenas a exércitos humanos.
- source_word: כִּרְתוּ עֵצָה
  choice: Cortem árvores
  rationale: O singular עֵצָה tem sentido coletivo neste contexto militar; a formulação é direta e natural em português.
- source_word: וְשִׁפְכוּ ... סֹלְלָה
  choice: levantem uma rampa de cerco
  rationale: Embora o verbo signifique literalmente “derramar”, a expressão descreve a construção de uma obra de terra para o cerco; “levantem” comunica o sentido idiomático.
- source_word: עַל יְרוּשָׁלִַם
  choice: contra Jerusalém
  rationale: No contexto de cerco, עַל expressa ação militar hostil dirigida à cidade.
- source_word: הִיא הָעִיר הָפְקַד
  choice: Esta é a cidade que deve ser castigada
  rationale: Expressa a ênfase identificadora de הִיא e o sentido judicial de פקד neste contexto, mantendo em nota a imagem mais literal da visitação.
- source_word: כֻּלָּהּ עֹשֶׁק בְּקִרְבָּהּ
  choice: dentro dela só há opressão
  rationale: Reproduz de maneira idiomática e enfática a caracterização totalizante da cidade, preservando sua personificação gramatical.
theological_decisions:
- issue: Natureza do juízo divino em הָפְקַד
  choice: deve ser castigada
  alternative: deve ser visitada / chamada a prestar contas
  rationale: No contexto profético de cerco, a visitação é judicial e punitiva. A tradução explicita esse valor contextual sem acrescentar uma doutrina alheia ao texto, enquanto a nota preserva a metáfora hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O nome divino é transliterado como “Yahweh”; “dos Exércitos” mantém a amplitude do título. A sintaxe imperativa e a força da denúncia profética foram preservadas.
