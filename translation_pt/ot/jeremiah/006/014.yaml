  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְרַפְּא֞וּ אֶת שֶׁ֤בֶר עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/014.yaml
  text: They have healed the wound of my people lightly[a], saying, ‘Peace, peace,’ when there is no peace.
translation:
  language: pt
  text: 'Eles tratam superficialmente a ferida do meu povo[a], dizendo: “Paz, paz!”, quando não há paz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tratam como insignificante a fratura do meu povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפְּאוּ
  choice: tratam
  rationale: Embora רפא signifique literalmente “curar”, o contexto denuncia uma intervenção inadequada, não uma cura efetiva. “Tratam” mantém a metáfora médica e a ironia profética.
- source_word: שֶׁבֶר
  choice: ferida
  rationale: O termo pode indicar fratura, ruptura ou dano. “Ferida” combina naturalmente com o campo semântico de tratar/curar e comunica a gravidade da condição.
- source_word: עַמִּי
  choice: meu povo
  rationale: Preserva diretamente a construção possessiva e a força relacional da fala divina.
- source_word: עַל נְקַלָּה
  choice: superficialmente
  rationale: A expressão indica que uma condição grave é tratada como leve ou insignificante. “Superficialmente” expressa com clareza a insuficiência do tratamento; a alternativa na nota preserva a nuance de minimização moral.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Tradução direta e natural do infinitivo que introduz o discurso citado.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Paz, paz!
  rationale: Mantém a repetição enfática e o termo amplo que pode envolver paz, segurança e bem-estar, sem reduzir sua ambiguidade.
- source_word: וְאֵין שָׁלוֹם
  choice: quando não há paz
  rationale: Expressa naturalmente a realidade que contradiz a falsa garantia, sem sobrecarregar a conjunção hebraica.
theological_decisions:
- issue: Acusação profética contra a falsa garantia de bem-estar
  choice: O verso denuncia os que tratam de modo inadequado a grave condição do povo e anunciam uma paz inexistente.
  alternative: Traduzir literalmente o verbo como “curam”, conservando a ironia de uma suposta cura.
  rationale: “Tratam” evita sugerir que houve restauração real, enquanto o advérbio e a cláusula final preservam a ironia e a condenação profética.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A exclamação na fala reproduz a insistência da repetição sem acrescentar conteúdo interpretativo.
