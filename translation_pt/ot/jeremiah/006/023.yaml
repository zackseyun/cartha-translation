  text: קֶ֣שֶׁת וְ/כִיד֞וֹן יַחֲזִ֗יקוּ אַכְזָרִ֥י הוּא֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/023.yaml
  text: They seize bow and javelin; they are cruel and show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Zion.
translation:
  language: pt
  text: Eles empunham arco e lança; são cruéis e não têm compaixão. O seu som ruge como o mar, e eles cavalgam, dispostos como um homem para a batalha contra você, Filha de Sião.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dispostos como um só homem para a batalha». O singular hebraico pode comparar o exército a um homem ou enfatizar que ele avança como uma força unida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: arco
  rationale: O singular hebraico tem valor coletivo ou instrumental na descrição militar; «arco» é natural em português.
- source_word: כִידוֹן
  choice: lança
  rationale: כידון designa uma arma de haste usada para ferir ou arremessar. «Lança» é claro e corrente em português, sem impor a especificidade de «dardo».
- source_word: יַחֲזִיקוּ
  choice: empunham
  rationale: O hifil de חזק descreve aqui segurar ou tomar armas; «empunham» expressa com naturalidade o uso militar.
- source_word: אַכְזָרִי הוּא
  choice: são cruéis
  rationale: Embora a expressão hebraica esteja morfologicamente no singular, refere-se coletivamente ao povo invasor, retomado por verbos plurais.
- source_word: וְלֹא יְרַחֵמוּ
  choice: e não têm compaixão
  rationale: O piel de רחם comunica compaixão ou misericórdia; esta formulação preserva o sentido sem acrescentar a ideia mais específica de poupar.
- source_word: קוֹלָם
  choice: o seu estrondo
  rationale: קול pode ser voz, som ou ruído. Na comparação com o mar e no contexto de um exército, «estrondo» comunica o efeito sonoro coletivo.
- source_word: כַיָּם יֶהֱמֶה
  choice: ruge como o mar
  rationale: המה descreve um som tumultuoso ou rugido; «ruge como o mar» conserva a imagem vívida.
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: e eles vêm montados em cavalos
  rationale: A expressão representa os invasores cavalgando; «vêm montados» é idiomático no movimento contra Sião, embora o verbo hebraico diga literalmente «cavalgam».
- source_word: עָרוּךְ
  choice: dispostos
  rationale: No contexto militar, ערוך indica estar organizado ou posto em ordem para o combate.
- source_word: כְאִישׁ
  choice: como um guerreiro
  rationale: איש significa literalmente «homem», mas na comparação militar «guerreiro» torna explícita a função contextual. A possível leitura coletiva, «como um só homem», é preservada em nota.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: Formulação natural que corresponde ao cenário imediato de combate.
- source_word: עָלַיִךְ בַּת צִיּוֹן
  choice: contra você, filha de Sião
  rationale: Preserva a segunda pessoa feminina e a personificação poética da cidade, em expressão corrente e transparente em português.
theological_decisions:
- issue: Sentido da expressão personificada בַּת צִיּוֹן
  choice: filha de Sião
  alternative: filha Sião
  rationale: A expressão personifica Sião/Jerusalém como filha e não funciona aqui como título doutrinário. «Filha de Sião» é a forma consagrada e inteligível em português.
- issue: Ambiguidade do singular כְאִישׁ
  choice: como um guerreiro
  alternative: como um só homem
  rationale: O contexto permite entender o singular como comparação com um combatente ou como ênfase na unidade da formação. O texto principal adota a comparação guerreira e a nota conserva a leitura coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A linguagem militar é vívida sem ser arcaica; a personificação profética de Sião foi preservada.
