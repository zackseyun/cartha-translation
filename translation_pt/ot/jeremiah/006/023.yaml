revisions:
- from: Eles empunham arco e lança; são cruéis e não têm compaixão. O seu estrondo ruge como o mar, e eles vêm montados em cavalos, dispostos como um guerreiro para a batalha contra você, filha de Sião.[a]
  to: Eles empunham arco e lança; são cruéis e não têm compaixão. O seu som ruge como o mar, e eles cavalgam, dispostos como um homem para a batalha contra você, Filha de Sião.[a]
  rationale: A revisão elimina a explicitação interpretativa de «guerreiro» e a nuance adicional de «vêm», preservando mais exatamente a concisão e a ambiguidade do hebraico. Mantém-se o vocabulário militar claro e o tom poético-profético do versículo.
