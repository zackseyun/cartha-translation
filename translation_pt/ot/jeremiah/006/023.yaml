  source_fidelity: 'A tradução reproduz adequadamente a descrição militar, a crueldade dos invasores, o ruído comparado ao mar, a cavalaria e o ataque dirigido à Filha de Sião. Contudo, «como um guerreiro» explicita além do que o hebraico diz: כְּאִישׁ é literalmente «como um homem» e comporta a leitura alternativa «como um só homem». Além disso, «vêm montados» introduz uma nuance de aproximação que não está expressa no verbo «cavalgam».'
  naturalness: O registro é claro, moderno e apropriado à poesia profética. «Eles cavalgam» é mais direto e mais próximo do hebraico que «eles vêm montados em cavalos». «O seu som ruge como o mar» mantém a imagem sonora intensa do original em português natural o bastante para o contexto poético.
  terminology: «Arco», «lança», «empunham», «cruéis», «compaixão», «batalha» e «Filha de Sião» são escolhas adequadas. «Filha de Sião» preserva a personificação hebraica com formulação estabelecida em português. A comparação principal deve permanecer literalmente aberta como «como um homem», com a leitura de unidade mantida em nota.
