  text: וְ/נָסַ֤בּוּ בָֽתֵּי/הֶם֙ לַ/אֲחֵרִ֔ים שָׂד֥וֹת וְ/נָשִׁ֖ים יַחְדָּ֑ו כִּֽי אַטֶּ֧ה אֶת יָדִ֛/י עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/012.yaml
  text: Their houses will be turned over to others[a], together with their fields and wives; for I will stretch out my hand against the inhabitants of the land[b], declares Yahweh.
translation:
  language: pt
  text: As casas deles passarão para outros, juntamente com seus campos e suas esposas[a]; pois estenderei a minha mão contra os habitantes da terra[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mulheres”. O hebraico נָשִׁים pode significar “mulheres” ou “esposas”; neste contexto de perda da casa e da família, “esposas” é mais provável.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os habitantes de toda a terra”. O hebraico הָאָרֶץ pode significar a terra de uma região ou a terra em sentido universal; neste contexto, o sentido local é mais provável.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָסַבּוּ
  choice: passarão
  rationale: O nifal de סבב indica aqui mudança de posse. “Passarão para outros” expressa de modo natural a transferência resultante da desapropriação, sem sugerir o sentido espacial de “girar”.
- source_word: בָתֵּיהֶם
  choice: as casas deles
  rationale: Tradução direta que mantém o foco em bens concretos e se coordena naturalmente com “campos”.
- source_word: לַאֲחֵרִים
  choice: para outros
  rationale: אֲחֵרִים significa “outros”; “estranhos” acrescentaria uma nuance não exigida pelo hebraico.
- source_word: שָׂדוֹת
  choice: campos
  rationale: Sentido comum do termo para terrenos agrícolas e propriedade rural.
- source_word: וְנָשִׁים
  choice: e as mulheres
  rationale: נָשִׁים pode significar “mulheres” ou “esposas”. Mantém-se no texto a opção lexicalmente mais ampla, sem reduzir as mulheres à categoria de propriedade; a leitura contextual “esposas” é registrada em nota.
- source_word: יַחְדָּו
  choice: juntamente com
  rationale: Liga as perdas anunciadas como parte do mesmo juízo e produz uma coordenação clara em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do anúncio anterior, preservando a força explicativa.
- source_word: אַטֶּה אֶת־יָדִי
  choice: estenderei a minha mão
  rationale: Conserva a expressão hebraica transparente de intervenção ativa, aqui hostil e judicial.
- source_word: עַל
  choice: contra
  rationale: No contexto da mão estendida em juízo, “contra” comunica adequadamente a ação adversa.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: os habitantes da terra
  rationale: O contexto imediato favorece o sentido local de אֶרֶץ, isto é, a terra de Judá, embora “terra” também possa ser entendido em âmbito universal; a alternativa é indicada em nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Escopo de הָאָרֶץ
  choice: a terra, em sentido local
  alternative: a terra, em sentido universal / o mundo
  rationale: O contexto trata do juízo sobre Judá e favorece o referente local, mas a polissemia genuína do hebraico é preservada em nota.
- issue: Sentido de נָשִׁים
  choice: mulheres
  alternative: esposas
  rationale: Ambos os sentidos são lexicalmente possíveis. O contexto doméstico favorece “esposas”, mas “mulheres” mantém a amplitude do termo hebraico e evita apresentar pessoas como simples itens de propriedade; a alternativa contextual consta em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo da lista e a imagem bíblica da mão estendida. A ambiguidade de נָשִׁים é tratada nas decisões lexicais; como o texto principal adota “mulheres”, não foi necessária uma nota específica para essa alternativa.
