  text: הַ/נָּוָה֙ וְ/הַ/מְּעֻנָּגָ֔ה דָּמִ֖יתִי בַּת צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/002.yaml
  text: I have likened daughter Zion to a lovely and delicate woman[a].
translation:
  language: pt
  text: Comparei a filha de Sião a uma mulher bela e delicada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Destruirei a filha de Sião, a bela e delicada.” O verbo hebraico é difícil aqui, e alguns o entendem no sentido de destruir, em vez de comparar.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּוָה
  choice: bela
  rationale: O adjetivo feminino singular descreve mais naturalmente beleza ou encanto neste contexto poético. “Bela” é claro, digno e combina bem com “delicada”.
- source_word: וְהַמְּעֻנָּגָה
  choice: e delicada
  rationale: O termo derivado de ענג comunica delicadeza, suavidade ou refinamento. “Delicada” preserva essa amplitude sem introduzir a censura implícita em “mimada”.
- source_word: דָּמִיתִי
  choice: Comparei
  rationale: A forma verbal na primeira pessoa do singular é entendida segundo o sentido comum de דמה, “comparar/assemelhar”. O pretérito perfeito é natural em português e mantém a voz do falante.
- source_word: בַּת צִיּוֹן
  choice: a filha de Sião
  rationale: Expressão profética que personifica Sião/Jerusalém como filha. A construção “filha de Sião” é natural e reconhecível em português.
- source_word: referente feminino implícito
  choice: uma mulher
  rationale: Os adjetivos hebraicos estão no feminino singular, mas não há substantivo feminino expresso além da personificação. “Mulher” torna a comparação idiomática em português sem acrescentar idade ou estado civil.
theological_decisions:
- issue: Sentido da imagem central e do verbo דָּמִיתִי
  choice: O falante compara a filha de Sião a uma mulher bela e delicada.
  alternative: “Destruirei a filha de Sião, a bela e delicada.”
  rationale: O sentido lexical mais direto de דמה e os dois adjetivos femininos favorecem uma comparação. Como o hebraico é difícil e admite uma interpretação destrutiva, essa possibilidade é preservada em nota, sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a personificação profética e explicita com “mulher” o referente feminino implícito necessário para uma comparação natural em português.
