source:
  edition: WLC
  text: בַּת עַמִּ֤/י חִגְרִי שָׂק֙ וְ/הִתְפַּלְּשִׁ֣י בָ/אֵ֔פֶר אֵ֤בֶל יָחִיד֙ עֲשִׂ֣י לָ֔/ךְ מִסְפַּ֖ד תַּמְרוּרִ֑ים כִּ֣י פִתְאֹ֔ם יָבֹ֥א הַ/שֹּׁדֵ֖ד עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/026.yaml
  text: Daughter of my people[a], put on sackcloth and roll in ashes; make mourning as for an only son, a most bitter lamentation[c][b], for suddenly the destroyer will come upon us.
translation:
  language: pt
  text: Filha do meu povo, vista-se de pano de saco e revolva-se nas cinzas[a]. Faça luto como por um filho único[b], com uma lamentação muito amarga, pois de repente o destruidor virá sobre nós[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «role nas cinzas» ou «cubra-se de cinzas». O verbo hebraico descreve um gesto corporal de luto nas cinzas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «luto de um único»; no contexto, luto como por um filho único.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz «sobre nós», preservando a identificação do profeta com o povo; algumas traduções ajustam para «sobre você» ou «contra vocês».
    reason: alternative_reading
lexical_decisions:
- source_word: בַּת עַמִּי
  choice: Filha do meu povo
  rationale: Preserva o vocativo direto e a personificação profética do povo como filha, sem acrescentar uma interjeição ausente do hebraico.
- source_word: חִגְרִי שָׂק
  choice: vista-se de pano de saco
  rationale: Comunica naturalmente o ato de cingir ou pôr pano de saco como sinal de luto.
- source_word: וְהִתְפַּלְּשִׁי בָאֵפֶר
  choice: e revolva-se nas cinzas
  rationale: O hitpael retrata um gesto corporal intenso de luto, como rolar ou revolver-se nas cinzas; a formulação é vívida e digna em português.
- source_word: אֵבֶל יָחִיד
  choice: luto como por um filho único
  rationale: Explicita com naturalidade a comparação idiomática e preserva a imagem do luto extremo por um único filho.
- source_word: עֲשִׂי לָךְ
  choice: Faça
  rationale: O imperativo é preservado; o dativo reflexivo é entendido como parte da expressão e não precisa ser vertido de modo rígido por 'para você'.
- source_word: מִסְפַּד תַּמְרוּרִים
  choice: uma lamentação muito amarga
  rationale: מִסְפַּד indica pranto ou lamentação fúnebre, e o plural intensivo תַּמְרוּרִים reforça sua extrema amargura.
- source_word: כִּי פִתְאֹם
  choice: pois de repente
  rationale: Mantém tanto a relação causal quanto a chegada súbita anunciada no texto.
- source_word: הַשֹּׁדֵד
  choice: o destruidor
  rationale: Abrange a ideia contextual de alguém que devasta, saqueia e arruína, sem limitar o sentido ao roubo.
- source_word: עָלֵינוּ
  choice: sobre nós
  rationale: Preserva a primeira pessoa do plural e a identificação do profeta com o povo ameaçado.
theological_decisions:
- issue: Mudança do vocativo feminino singular para a primeira pessoa do plural
  choice: Manter «Filha do meu povo ... sobre nós»
  alternative: Uniformizar como «sobre você» ou «contra vocês»
  rationale: A mudança está no hebraico e expressa a solidariedade do profeta com o povo; uniformizá-la eliminaria uma tensão retórica genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem apagar a imagem física do luto nem a mudança pronominal do original.
