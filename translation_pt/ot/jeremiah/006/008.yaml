id: JER.6.8
reference: Jeremiah 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִוָּסְרִי֙ יְר֣וּשָׁלִַ֔ם פֶּן תֵּקַ֥ע נַפְשִׁ֖/י מִמֵּ֑/ךְ פֶּן אֲשִׂימֵ֣/ךְ שְׁמָמָ֔ה אֶ֖רֶץ ל֥וֹא נוֹשָֽׁבָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/008.yaml
  text: Be warned[a], O Jerusalem, lest my soul turn away from you, lest I make you a desolation[b], a land not inhabited.
translation:
  language: pt
  text: Aceite a correção[a], ó Jerusalém, para que a minha alma não se afaste[b] de você, e para que eu não faça de você uma desolação, uma terra desabitada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Deixe-se corrigir”, “Aceite a disciplina” ou “Aceite a advertência”. O verbo hebraico indica receber disciplina ou correção, não apenas tomar conhecimento de um aviso.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é raro e também pode ser entendido como “se desprenda”, “seja arrancada” ou “se aliene”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוָּסְרִי
  choice: Aceite a correção
  rationale: O imperativo nifal feminino singular de יסר é dirigido a Jerusalém e indica receber disciplina, repreensão ou correção. A formulação mantém a força corretiva e soa natural no português atual.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade, aqui em vocativo.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz, nas duas ocorrências, a consequência temida que fundamenta a advertência. Esta construção é natural em português e conserva o valor preventivo do hebraico.
- source_word: תֵּקַע
  choice: se afaste
  rationale: O verbo raro expressa separação, desprendimento ou alienação. Com נַפְשִׁי como sujeito e מִמֵּךְ marcando separação, “se afaste de você” comunica com clareza a ruptura relacional sem eliminar a imagem da alma divina.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Preserva a expressão antropopática explícita do hebraico, em vez de reduzi-la simplesmente a “eu”.
- source_word: מִמֵּךְ
  choice: de você
  rationale: Representa o sufixo preposicional feminino singular, que retoma Jerusalém, com uma forma amplamente compreensível no português moderno.
- source_word: אֲשִׂימֵךְ
  choice: eu não faça de você
  rationale: שׂים com complemento predicativo significa colocar ou tornar alguém em determinado estado. A construção portuguesa expressa naturalmente esse resultado.
- source_word: שְׁמָמָה
  choice: uma desolação
  rationale: Mantém o substantivo hebraico e a solenidade da declaração de juízo, sem reduzi-lo ao mero adjetivo “desolada”.
- source_word: אֶרֶץ לֹא נוֹשָׁבָה
  choice: uma terra desabitada
  rationale: Reproduz de modo conciso e natural a frase que intensifica e explica a desolação.
theological_decisions:
- issue: Expressão antropopática da נֶפֶשׁ divina
  choice: a minha alma não se afaste de você
  alternative: eu não me afaste de você
  rationale: O texto atribui explicitamente uma “alma” a Deus. A tradução conserva essa linguagem vívida e sua tensão teológica, em vez de explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O vocativo “ó Jerusalém” preserva o tom profético solene. As duas ocorrências de פֶּן foram vertidas por construções paralelas com “para que ... não”. O marcador [b] foi colocado junto de “se afaste”, expressão à qual a nota lexical de fato se refere.
