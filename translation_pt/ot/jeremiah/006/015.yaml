reference: Jeremiah 6:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֹבִ֕ישׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵב֗וֹשׁוּ גַּם הַכְלִים֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֧וּ בַ/נֹּפְלִ֛ים בְּ/עֵת פְּקַדְתִּ֥י/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/015.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time I punish them, they will stumble, says Yahweh.
translation:
  language: pt
  text: Sentiram vergonha por terem cometido uma abominação? Não, não sentiram vergonha alguma; nem sequer sabiam corar. Por isso, cairão entre os que caem; quando eu os castigar[a], tropeçarão, diz Javé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu os visitar”. O verbo hebraico pode significar “visitar” ou “tratar de”, mas aqui a visita tem sentido punitivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Sentiram vergonha
  rationale: Entende a forma, no contexto, como pergunta retórica respondida pelas duas negações seguintes. A formulação é natural em português e mantém a ironia profética.
- source_word: תוֹעֵבָה
  choice: uma abominação
  rationale: Preserva a forte carga moral e pactual do termo profético, sem suavizá-lo como mera coisa desagradável.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: não sentiram vergonha alguma
  rationale: A construção intensiva hebraica reforça a negação; “vergonha alguma” comunica essa ênfase com clareza.
- source_word: גַּם הַכְלִים לֹא יָדָעוּ
  choice: nem sequer sabiam corar
  rationale: Mantém o paralelismo e expressa a perda até mesmo da capacidade de manifestar vergonha; “corar” é conciso e idiomático.
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: cairão entre os que caem
  rationale: Conserva a repetição poética da raiz hebraica e evita definir se os demais já caíram ou cairão junto com eles.
- source_word: בְּעֵת פְּקַדְתִּים
  choice: quando eu os castigar
  rationale: Neste contexto de juízo, פקד indica uma visitação punitiva. A tradução explicita o sentido contextual em português corrente, registrando em nota a alternativa mais literal.
- source_word: יִכָּשְׁלוּ
  choice: tropeçarão
  rationale: Reproduz o sentido lexical direto e mantém o paralelismo imagético com “cairão”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: “Javé” representa em português o nome próprio divino no texto hebraico, em vez de substituí-lo por um título, e é amplamente reconhecível.
- issue: Sentido de פקד no contexto de juízo
  choice: castigar
  alternative: visitar
  rationale: A queda e o tropeço descritos no contexto mostram que a visitação tem caráter punitivo. A alternativa lexical é preservada em nota para não ocultar a amplitude do verbo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura retórica e o paralelismo poético foram preservados sem linguagem excessivamente arcaica. O marcador [a] foi colocado junto de “castigar”, termo ao qual a nota efetivamente se refere.
