  text: אֵלֶ֛י/הָ יָבֹ֥אוּ רֹעִ֖ים וְ/עֶדְרֵי/הֶ֑ם תָּקְע֨וּ עָלֶ֤י/הָ אֹהָלִים֙ סָבִ֔יב רָע֖וּ אִ֥ישׁ אֶת יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/003.yaml
  text: To her shepherds will come with their flocks[a]; they will pitch tents against her all around; each will pasture his own place.
translation:
  language: pt
  text: A ela virão pastores com seus rebanhos; armarão suas tendas contra ela por todos os lados; cada um apascentará a área que lhe couber.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “cada um apascentará a sua mão”. A expressão provavelmente significa que cada um apascentará — ou consumirá — a área que lhe couber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: A ela
  rationale: Preserva o sentido direcional básico de אֶל; a hostilidade fica explícita mais adiante em “contra ela”.
- source_word: יָבֹאוּ
  choice: virão
  rationale: Traduz diretamente o imperfeito de בוא com valor futuro no contexto profético.
- source_word: רֹעִים
  choice: pastores
  rationale: Mantém a metáfora pastoril, desenvolvida por “rebanhos” e “apascentará”, embora represente chefes invasores.
- source_word: וְעֶדְרֵיהֶם
  choice: com seus rebanhos
  rationale: O waw é entendido como acompanhamento; “rebanhos” conserva a imagem e sugere metaforicamente as forças dos invasores.
- source_word: תָּקְעוּ ... אֹהָלִים
  choice: armarão suas tendas
  rationale: Expressão portuguesa natural para instalar tendas, correspondente ao uso idiomático do verbo תקע neste contexto.
- source_word: עָלֶיהָ
  choice: contra ela
  rationale: No cenário militar, עַל tem sentido adversativo e comunica o cerco sem apagar a metáfora.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa que os acampamentos cercam a cidade.
- source_word: רָעוּ
  choice: apascentará
  rationale: Mantém a metáfora de pastoreio do hebraico, sem substituí-la pela interpretação mais explícita “devorará”.
- source_word: אִישׁ
  choice: cada um
  rationale: Reproduz o emprego distributivo de אִישׁ.
- source_word: אֶת יָדוֹ
  choice: a área que lhe couber
  rationale: Torna inteligível a expressão hebraica literalmente associada à “mão” de cada um, provavelmente a área destinada a cada pastor ou comandante, sem reduzir a interpretação a posse pessoal.
