  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהֹוָ֣ה צְבָא֔וֹת עוֹלֵ֛ל יְעוֹלְל֥וּ כַ/גֶּ֖פֶן שְׁאֵרִ֣ית יִשְׂרָאֵ֑ל הָשֵׁב֙ יָדְ/ךָ֔ כְּ/בוֹצֵ֖ר עַל סַלְסִלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/009.yaml
  text: 'Thus says Yahweh of hosts: They will thoroughly glean the remnant of Israel as a vine[a]; pass your hand over the branches again like a grape-gatherer.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Eles rebuscarão completamente o remanescente de Israel como uma videira. Passe de novo a mão pelos ramos[a], como quem colhe uvas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “pelas gavinhas”; o termo hebraico é raro, e sua referência exata é discutida. Alguns também o entendem como “cestos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome da aliança de forma explícita e traduz o título צְבָאוֹת pela formulação portuguesa tradicional e inteligível.
- source_word: עוֹלֵל יְעוֹלְלוּ
  choice: rebuscarão completamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “Rebuscar” preserva a imagem agrícola de colher o que ainda resta, e “completamente” expressa a ênfase hebraica.
- source_word: כַגֶּפֶן
  choice: como uma videira
  rationale: Conserva diretamente a comparação e a metáfora vitícola.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: o remanescente de Israel
  rationale: “Remanescente” é natural no registro bíblico português e mantém a possível ressonância teológica sem explicar além do texto.
- source_word: הָשֵׁב יָדְךָ
  choice: Passe de novo a mão
  rationale: Expressa em português corrente a ordem de repetir o gesto da colheita, sem tornar literal demais o idioma hebraico “faz voltar a tua mão”.
- source_word: כְּבוֹצֵר
  choice: como quem colhe uvas
  rationale: Traduz o agente da vindima de modo claro e atual, evitando o menos comum “vindimador”.
- source_word: עַל סַלְסִלּוֹת
  choice: pelos ramos
  rationale: No contexto da videira, “ramos” é uma interpretação contextual plausível do termo raro, cuja referência exata permanece discutida e é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva explicitamente o nome próprio da aliança e segue a decisão do projeto para este termo contestado, sem substituí-lo por um título.
- issue: Identidade dos sujeitos nas duas ações
  choice: Mantém a passagem da terceira pessoa plural (“eles”) para a segunda pessoa singular (“passe”)
  alternative: Uniformizar o sujeito ou explicitar que Yahweh fala diretamente ao invasor
  rationale: O hebraico apresenta essa mudança de pessoa sem identificar expressamente os agentes; a tradução preserva a tensão em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Rebuscar” conserva o vocabulário agrícola necessário à metáfora; a ordem final foi formulada com naturalidade sem eliminar a mudança de pessoa do hebraico. O marcador [a] aparece junto ao termo discutido.
