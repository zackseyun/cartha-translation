base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/028.yaml
  text: All of them are the most stubborn rebels[a], going about as slanderers; they are bronze and iron[d][c][b]; all of them are corrupters.
translation:
  language: pt
  text: Todos eles são rebeldes extremamente obstinados[a], andam por toda parte espalhando calúnias[b]; são bronze e ferro[c]. Todos eles são corruptores[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes dos rebeldes”; mais literalmente, “rebeldes entre rebeldes”. A expressão hebraica é intensiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “espalhando mexericos” ou “como difamadores”.
    reason: lexical_alternative
  - marker: c
    text: “Bronze e ferro” é provavelmente uma imagem figurativa que os retrata como duros, não refinados ou vis em seu caráter.
    reason: cultural_note
  - marker: d
    text: Ou “destruidores”. O termo hebraico pode designar os que corrompem, estragam ou causam ruína.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Preserva a abrangência e a ênfase da expressão hebraica colocada no início do versículo.
- source_word: סָרֵי סוֹרְרִים
  choice: rebeldes dos mais obstinados
  rationale: Comunica em português natural a força intensiva da construção hebraica, sem reduzir a dupla ideia de rebeldia e obstinação.
- source_word: הֹלְכֵי רָכִיל
  choice: andam por toda parte espalhando calúnias
  rationale: O particípio descreve conduta habitual; a formulação expressa tanto o ato de circular quanto a difusão de fala nociva.
- source_word: נְחֹשֶׁת וּבַרְזֶל
  choice: bronze e ferro
  rationale: Mantém a imagem metalúrgica concreta do hebraico, importante no contexto do refinamento, sem explicá-la dentro do texto.
- source_word: מַשְׁחִיתִים
  choice: corruptores
  rationale: Preserva a forma ativa e a amplitude do verbo hebraico, que pode indicar causar corrupção, estrago ou ruína.
- source_word: הֵמָּה
  choice: são
  rationale: A identificação conclusiva é expressa naturalmente pela cópula portuguesa; o sujeito abrangente é retomado por “Todos eles”.
