base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/016.yaml
  text: 'Thus says Yahweh: “Stand by the roads and look[a], and ask for the ancient paths, where the good way is; then walk in it, and find rest for your souls. But they said[b], ‘We will not walk in it.’”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Parem junto aos caminhos e olhem; perguntem pelas veredas antigas[a]: qual é o bom caminho? Andem por ele e encontrem descanso para suas almas[b]. Mas eles disseram: ‘Não andaremos por ele.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelas veredas de outrora” ou “pelas veredas eternas”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz literalmente “para suas almas”; נֶפֶשׁ também pode significar a própria pessoa ou a vida, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִמְדוּ עַל דְּרָכִים
  choice: Parem junto aos caminhos
  rationale: Comunica a ordem de deter-se e observar atentamente diante das possíveis rotas, sem especificar demais a imagem como uma encruzilhada.
- source_word: וּרְאוּ
  choice: e olhem
  rationale: Mantém tanto a imagem concreta de observar os caminhos quanto o chamado implícito ao discernimento.
- source_word: וְשַׁאֲלוּ לִנְתִבוֹת עוֹלָם
  choice: perguntem pelas veredas antigas
  rationale: “Veredas” preserva a imagem de trilhas, e “antigas” expressa aqui o sentido mais provável de עוֹלָם como aquilo que vem de tempos remotos.
- source_word: אֵי זֶה דֶרֶךְ הַטּוֹב
  choice: qual é o bom caminho
  rationale: A expressão pede a identificação da rota boa; esta formulação é direta e natural em português.
- source_word: וּלְכוּ בָהּ
  choice: Andem por ele
  rationale: Conserva a metáfora do caminho como conduta de vida e retoma claramente “o bom caminho”.
- source_word: וּמִצְאוּ מַרְגּוֹעַ
  choice: e encontrem descanso
  rationale: Mantém a forma imperativa da sequência hebraica e traduz מַרְגּוֹעַ pelo termo natural “descanso”.
- source_word: לְנַפְשְׁכֶם
  choice: para suas almas
  rationale: Preserva a força pessoal e interior de נֶפֶשׁ, embora o termo também possa designar a própria pessoa ou a vida.
- source_word: וַיֹּאמְרוּ
  choice: Mas eles disseram
  rationale: A conjunção adversativa explicita em português o contraste contextual entre o convite de Yahweh e a recusa do povo.
- source_word: לֹא נֵלֵךְ
  choice: Não andaremos por ele
  rationale: “Andaremos” retoma a metáfora anterior; “por ele” explicita em português o referente imediatamente subentendido no hebraico.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na promessa de descanso
  choice: para suas almas
  alternative: para vocês mesmos; para suas vidas
  rationale: “Almas” conserva a profundidade pessoal da promessa e sua ressonância bíblica, sem exigir que נֶפֶשׁ seja entendido como termo técnico para uma parte separável do ser humano; a nota registra a amplitude semântica.
translation_notes:
  register: Português atual, digno e acessível, com formas plurais naturais para o discurso dirigido ao povo. “Veredas” mantém o caráter poético da imagem sem tornar a linguagem obscura. Os marcadores foram posicionados junto às expressões a que as notas efetivamente se referem.
