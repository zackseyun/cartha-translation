  source_fidelity: A tradução preserva bem a sequência de imperativos, a imagem dos caminhos antigos, o chamado a andar no bom caminho e a recusa final. «Por ele» esclarece legitimamente o referente implícito. A nota b, porém, descreve incorretamente o hebraico como singular, embora לְנַפְשְׁכֶם signifique «para as suas almas»/«para vocês mesmos», no plural.
  naturalness: O português é atual, claro e adequado ao registro profético. A pontuação revista torna mais nítida a relação entre «veredas antigas» e a identificação do bom caminho, e mantém toda a fala sob a fórmula introdutória divina.
  terminology: «Yahweh», «veredas antigas», «bom caminho», «descanso» e «almas» são escolhas aceitáveis e fiéis. «Almas» é acompanhado de nota que reconhece a amplitude semântica de נֶפֶשׁ sem impor um sentido técnico.
