id: JER.6.10
reference: Jeremiah 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל מִ֨י אֲדַבְּרָ֤ה וְ/אָעִ֨ידָה֙ וְ/יִשְׁמָ֔עוּ הִנֵּה֙ עֲרֵלָ֣ה אָזְנָ֔/ם וְ/לֹ֥א יוּכְל֖וּ לְ/הַקְשִׁ֑יב הִנֵּ֣ה דְבַר יְהוָ֗ה הָיָ֥ה לָ/הֶ֛ם לְ/חֶרְפָּ֖ה לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/010.yaml
  text: To whom shall I speak and give warning[a], that they may hear? Look, their ear is uncircumcised, and they are not able to listen. Look, the word of Yahweh has become a reproach to them[b]; they take no delight in it.
translation:
  language: pt
  text: 'A quem falarei e advertirei[a], para que ouçam? Vejam: o ouvido deles é incircunciso[b], e eles não conseguem escutar. Vejam: a palavra de Yahweh tornou-se para eles motivo de desprezo; eles não têm prazer nela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «e darei testemunho» ou «e testemunharei contra eles».
    reason: Alternativa lexical para וְאָעִידָה, cujo sentido pode ser advertir solenemente ou dar testemunho.
  - marker: b
    text: A expressão hebraica «o ouvido deles é incircunciso» retrata pessoas insensíveis ou indispostas a dar ouvidos.
    reason: Nota cultural e metafórica necessária para esclarecer uma imagem preservada literalmente no texto.
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: falarei
  rationale: O cohortativo/imperfectivo de primeira pessoa integra uma pergunta retórica deliberativa; o futuro em português preserva com naturalidade a ideia de «a quem hei de falar?».
- source_word: וְאָעִידָה
  choice: e advertirei
  rationale: O hifil de עוד pode significar advertir solenemente ou dar testemunho. No contexto profético, «advertirei» comunica melhor a força prática, sem eliminar a alternativa lexical registrada em nota.
- source_word: וְיִשְׁמָעוּ
  choice: para que ouçam
  rationale: A conjunção seguida do imperfeito pode ser entendida como finalidade; esta formulação preserva a relação entre a fala profética e a possibilidade de ouvirem.
- source_word: עֲרֵלָה אָזְנָם
  choice: o ouvido deles é incircunciso
  rationale: Mantém a metáfora corporal e pactual do hebraico e seu singular coletivo, em vez de substituí-la por uma interpretação como «ouvidos fechados».
- source_word: לְהַקְשִׁיב
  choice: escutar
  rationale: Termo corrente que conserva o paralelismo com «ouçam» e pode incluir atenção efetiva sem explicitar demais a ideia de obediência.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Reproduz a expressão profética e apresenta diretamente o nome divino do texto hebraico.
- source_word: הָיָה לָהֶם לְחֶרְפָּה
  choice: tornou-se para eles motivo de desprezo
  rationale: חֶרְפָּה abrange afronta, vergonha e objeto de escárnio. «Motivo de desprezo» expressa de modo natural que eles tratam a palavra como algo desprezível, preservando a direção relacional da frase.
- source_word: לֹא יַחְפְּצוּ בוֹ
  choice: eles não têm prazer nela
  rationale: חפץ pode indicar prazer, agrado ou desejo. A formulação conserva tanto a aversão afetiva quanto a rejeição volitiva e retoma naturalmente «palavra» no feminino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama. A transliteração «Yahweh» preserva o nome pessoal sem substituí-lo por um título.
- issue: Metáfora do «ouvido incircunciso»
  choice: manter explicitamente «o ouvido deles é incircunciso»
  alternative: os ouvidos deles estão fechados; são espiritualmente surdos
  rationale: A imagem hebraica evoca insensibilidade e falta de receptividade em linguagem corporal com ressonância pactual. Mantê-la evita reduzir sua força teológica a uma paráfrase.
- issue: Força de חֶרְפָּה
  choice: motivo de desprezo
  alternative: vergonha; afronta; objeto de zombaria
  rationale: A escolha mantém a tensão de que a palavra divina é tratada por eles como desprezível, sem definir de modo excessivamente estreito se o foco recai em vergonha, insulto ou escárnio.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. «Vejam» reproduz a partícula enfática הִנֵּה de forma direta; a repetição foi mantida. A metáfora incomum foi preservada no corpo do texto e esclarecida em nota.
