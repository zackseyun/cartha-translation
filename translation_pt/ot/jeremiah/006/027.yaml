  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
translation:
  language: pt
  text: Eu o constituí examinador em meio ao meu povo, uma fortaleza,[a] para que você conheça e examine o caminho deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “provador em meio ao meu povo, uma fortaleza”. O hebraico é conciso e de interpretação difícil. “Provador” ressalta a imagem de testar metais presente no contexto ao redor.'
    reason: lexical_alternative
  - marker: b
    text: “Caminho” também pode significar “conduta” ou “modo de viver”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחוֹן
  choice: examinador
  rationale: O substantivo deriva de בחן, “examinar, provar”, e no contexto imediato evoca a avaliação de metais. “Examinador” mantém o sentido com clareza, sem recorrer ao termo técnico e pouco comum “ensaiador”.
- source_word: נְתַתִּיךָ
  choice: Eu o estabeleci
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, aqui designa a nomeação de Jeremias para uma função; “estabeleci” expressa isso naturalmente.
- source_word: בְעַמִּי
  choice: no meio do meu povo
  rationale: A preposição ב indica a colocação do profeta entre o povo. A expressão é idiomática e ligeiramente mais precisa do que simplesmente “em meu povo”.
- source_word: מִבְצָר
  choice: como uma fortaleza
  rationale: O substantivo normalmente significa “fortaleza” ou “lugar fortificado”. A tradução conserva a imagem concreta e a dificuldade do texto massorético, sem emendá-lo.
- source_word: וְתֵדַע
  choice: para que você conheça
  rationale: O imperfeito ligado por ו pode ser sequencial ou final. A construção final expressa naturalmente o propósito da nomeação, embora a nota preserve a alternativa sequencial.
- source_word: וּבָחַנְתָּ
  choice: e examine
  rationale: A tradução repete a ideia da raiz בחן presente em בָּחוֹן e mantém a ligação lexical entre a função do profeta e sua tarefa.
- source_word: דַּרְכָּם
  choice: a conduta deles
  rationale: דרך, literalmente “caminho”, frequentemente indica modo de vida ou comportamento. “Conduta” comunica com clareza o sentido moral neste contexto, enquanto a nota preserva a metáfora hebraica.
