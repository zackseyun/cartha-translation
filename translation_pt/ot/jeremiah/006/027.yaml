translation_notes:
  register: Português moderno, digno e acessível, com formas pronominais amplamente compreensíveis no Brasil. A tradução conserva a metáfora difícil de “fortaleza”, explicando-a em nota, e torna explícito o sentido ético de דֶּרֶךְ no texto principal sem eliminar sua forma literal da nota.
