  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ מִלְחָמָ֔ה ק֖וּמוּ וְ/נַעֲלֶ֣ה בַֽ/צָּהֳרָ֑יִם א֥וֹי לָ֨/נוּ֙ כִּי פָנָ֣ה הַ/יּ֔וֹם כִּ֥י יִנָּט֖וּ צִלְלֵי עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/004.yaml
  text: Consecrate war against her; rise up[a], and let us go up at noon. Woe to us, for the day is turning away, for the shadows of evening are stretching out.
translation:
  language: pt
  text: “Consagrem[a] a guerra contra ela! Levantem-se, e subamos ao meio-dia! Ai de nós, pois o dia está se afastando, e as sombras da tarde estão se estendendo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Preparem-se para a guerra contra ela”. O hebraico emprega literalmente linguagem de consagração para a batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Consagrem
  rationale: O imperativo piel de קדשׁ emprega linguagem de consagração. Em contexto militar, pode significar preparar ou declarar uma guerra sacralizada; “consagrem” preserva essa imagem sem explicitar mais do que o hebraico.
- source_word: עָלֶיהָ
  choice: contra ela
  rationale: Com מִלְחָמָה, a preposição עַל indica direção hostil; o sufixo feminino se refere à cidade.
- source_word: מִלְחָמָה
  choice: a guerra
  rationale: Mantém o sentido militar amplo do substantivo e forma uma expressão compreensível com “consagrem”.
- source_word: קוּמוּ
  choice: Levantem-se
  rationale: Imperativo plural vigoroso que convoca à ação imediata.
- source_word: וְנַעֲלֶה
  choice: e subamos
  rationale: Preserva o sentido básico de “subir” e seu uso militar para avançar contra uma cidade.
- source_word: בַצָּהֳרָיִם
  choice: ao meio-dia
  rationale: Equivalente claro e corrente para o momento central do dia.
- source_word: אוֹי לָנוּ
  choice: Ai de nós
  rationale: Reproduz a exclamação de aflição ou frustração em registro profético digno.
- source_word: כִּי פָנָה הַיּוֹם
  choice: pois o dia está se afastando
  rationale: Conserva a metáfora de פנה, “virar-se/afastar-se”, ao mesmo tempo que comunica o avanço do dia rumo à tarde.
- source_word: יִנָּטוּ צִלְלֵי עָרֶב
  choice: as sombras da tarde estão se estendendo
  rationale: Expressa visualmente o prolongamento das sombras, preservando a imagem verbal de נטה.
theological_decisions:
- issue: Expressão militar-sacral קַדְּשׁוּ ... מִלְחָמָה
  choice: “Consagrem a guerra contra ela”
  alternative: “Preparem-se para a guerra contra ela”
  rationale: A formulação explícita de consagração mantém a textura sacral da linguagem bélica sem afirmar que Deus aprove essa guerra além do que o contexto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas plurais naturais no português brasileiro. A ordem e as imagens poéticas do hebraico foram mantidas quando permanecem claras em português.
