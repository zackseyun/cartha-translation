  naturalness: A redação é geralmente clara e de registro profético apropriado. «Como um poço tira água fresca» é mais idiomático e inteligível do que «uma cisterna mantém frescas as suas águas», mantendo o paralelismo verbal. «Diante de mim há continuamente doença e ferida» soa natural e evita a inversão um pouco rígida «estão continuamente».
  terminology: «Mal», «violência», «devastação», «doença» e «ferida» são escolhas adequadas. «Devastação» corresponde bem a שֹׁד. A nota deve apresentar «cisterna» como alternativa, em vez de fazer dela a leitura principal.
