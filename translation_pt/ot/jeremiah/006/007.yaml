revisions:
- from: Como uma cisterna mantém frescas as suas águas[a], assim ela mantém fresco o seu mal. Violência e devastação se ouvem nela[b]; diante de mim estão continuamente doença e ferida[c].
  to: Como um poço tira água fresca[a], assim ela tira o seu mal. Violência e devastação se ouvem nela[b]; diante de mim há continuamente doença e ferida[c].
  rationale: A revisão adota «poço» e «tira água fresca» para uma imagem portuguesa mais natural e para melhor acomodar a incerteza lexical do hebraico, sem resolver indevidamente se o verbo significa resfriar, conservar ou fazer brotar. A repetição de «tira» mantém o paralelismo enfático. A última oração foi ajustada para fluência, sem alterar seu sentido nem a ambiguidade entre enfermidade literal e imagem da condição da cidade.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:31:12Z'
