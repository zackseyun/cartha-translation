  text: כְּ/הָקִ֥יר בור מֵימֶ֔י/הָ כֵּ֖ן הֵקֵ֣רָה רָעָתָ֑/הּ חָמָ֣ס וָ֠/שֹׁד יִשָּׁ֨מַע בָּ֧/הּ עַל פָּנַ֛/י תָּמִ֖יד חֳלִ֥י וּ/מַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/007.yaml
  text: As a well keeps its waters fresh[a], so she keeps her evil fresh. Violence and destruction are heard in her[c][b]; before me continually are sickness and wounds.
translation:
  language: pt
  text: Como um poço tira água fresca[a], assim ela tira o seu mal. Violência e devastação se ouvem nela[b]; diante de mim há continuamente doença e ferida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como uma cisterna conserva fresca a sua água”. O verbo hebraico é difícil e pode evocar água fresca, água que brota, ou o fornecimento contínuo de água.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “violência e destruição” ou “violência e saque”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “diante da minha face, continuamente, doença e ferida”. As palavras podem descrever males concretos ou retratar a condição da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָקִיר ... הֵקֵרָה
  choice: mantém frescas ... mantém fresco
  rationale: A forma verbal é difícil, mas a vocalização massorética favorece a ideia de tornar ou conservar frio/fresco. A repetição do mesmo verbo em português preserva o paralelismo enfático entre a água da cisterna e o mal da cidade.
- source_word: בּוֹר
  choice: cisterna
  rationale: O termo pode designar poço, cisterna ou cova. Aqui, a associação com águas conservadas frescas favorece “cisterna”, sem excluir em nota a imagem de um poço que fornece água continuamente.
- source_word: מֵימֶיהָ
  choice: as suas águas
  rationale: Mantém o plural formal de מַיִם e explicita naturalmente a relação possessiva com a cisterna.
- source_word: רָעָתָהּ
  choice: o seu mal
  rationale: O contexto de violência e devastação indica o sentido moral. “Mal” conserva a amplitude do hebraico sem especificar uma modalidade particular de perversidade.
- source_word: חָמָס וָשֹׁד
  choice: violência e devastação
  rationale: “Violência” expressa a brutalidade e a opressão de חָמָס; “devastação” comunica a ruína violenta de שֹׁד, embora “destruição” e “saque” também sejam possíveis.
- source_word: יִשָּׁמַע בָּהּ
  choice: se ouvem nela
  rationale: A construção passiva descreve aquilo que é repetidamente ouvido dentro da cidade; “nela” preserva sua personificação feminina.
- source_word: עַל־פָּנַי תָּמִיד
  choice: diante de mim estão continuamente
  rationale: “Diante de mim” é uma expressão portuguesa natural para o hebraico literalmente “diante da minha face”; “continuamente” preserva a ideia de persistência.
- source_word: חֳלִי וּמַכָּה
  choice: doença e ferida
  rationale: Conserva as imagens corporais concretas e o singular de מַכָּה, sem decidir se descrevem males físicos, a condição moral e social da cidade, ou ambos.
theological_decisions:
- issue: Personificação feminina de Jerusalém
  choice: Preservar a referência feminina por meio de “ela” e “nela”
  alternative: Tratar a cidade de modo impessoal ou repetir “Jerusalém”
  rationale: Os sufixos femininos hebraicos personificam a cidade. A formulação mantém a força pessoal da denúncia profética sem acrescentar uma interpretação doutrinária.
- issue: Sentido de חֳלִי וּמַכָּה
  choice: Traduzir concretamente como “doença e ferida”, deixando aberta a força metafórica
  alternative: Explicitar como “aflição e golpes” ou como corrupção moral e social
  rationale: O texto emprega linguagem corporal, mas não obriga o leitor a escolher entre uma condição literal e uma imagem da corrupção da cidade.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição deliberada de “mantém frescas/mantém fresco” conserva o paralelismo do hebraico, apesar da estranheza intencional da imagem. “Ela” e “nela” mantêm a personificação feminina da cidade.
