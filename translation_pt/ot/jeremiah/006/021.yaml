  to: 'Por isso, assim diz Yahweh: “Eis que ponho pedras de tropeço diante deste povo[a], e nelas tropeçarão pais e filhos juntos[b]; o vizinho e seu companheiro perecerão.”'
  rationale: 'A revisão substitui uma expressão pouco natural por “pedras de tropeço”, que traduz de modo mais concreto מִכְשֹׁלִים e mantém o jogo de palavras com “tropeçar”. Também reorganiza levemente a oração para refletir com clareza a coordenação hebraica: os pais e filhos tropeçam, enquanto o vizinho e seu companheiro perecem. As notas mantêm os mesmos âncoras e conteúdo essencial.'
