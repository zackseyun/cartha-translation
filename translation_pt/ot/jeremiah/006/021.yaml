  terminology: “Yahweh”, “Eis que”, “pais e filhos”, “vizinho”, “companheiro” e “perecerão” são escolhas adequadas ao registro profético e ao português internacional. “Pedras de tropeço” é preferível a “tropeços” para מִכְשֹׁלִים.
