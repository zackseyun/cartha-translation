source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י נֹתֵ֛ן אֶל הָ/עָ֥ם הַ/זֶּ֖ה מִכְשֹׁלִ֑ים וְ/כָ֣שְׁלוּ בָ֠/ם אָב֨וֹת וּ/בָנִ֥ים יַחְדָּ֛ו שָׁכֵ֥ן וְ/רֵע֖/וֹ יאבדו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh: “Eis que ponho pedras de tropeço diante deste povo[a], e nelas tropeçarão pais e filhos juntos[b]; o vizinho e seu companheiro perecerão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ponho obstáculos no caminho deste povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz: “pais e filhos juntos; o vizinho e seu companheiro”. A formulação ressalta que o juízo alcançará diferentes relações e gerações.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de modo natural a consequência da denúncia anterior, preservando a relação inferencial do hebraico.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Mantém a fórmula profética solene e representa o tetragrama como nome próprio, não como título.
- source_word: הִנְנִי נֹתֵן
  choice: Eis que ponho
  rationale: Conserva a força enfática e apresentativa de הִנְנִי e expressa a ação iminente ou já decidida do particípio נֹתֵן em português claro.
- source_word: אֶל הָעָם הַזֶּה מִכְשֹׁלִים
  choice: tropeços diante deste povo
  rationale: Preserva a imagem concreta de algo colocado diante do povo sem restringir excessivamente a função da preposição אֶל; a nota oferece uma formulação idiomática alternativa.
- source_word: וְכָשְׁלוּ בָם
  choice: e eles tropeçarão neles
  rationale: Mantém a repetição lexical e a imagem entre מִכְשֹׁלִים e o verbo כשל.
- source_word: אָבוֹת וּבָנִים יַחְדָּו
  choice: pais e filhos juntos
  rationale: Reproduz os termos familiares masculinos do texto e sua ênfase na queda conjunta entre gerações.
- source_word: שָׁכֵן וְרֵעוֹ
  choice: o vizinho e seu companheiro
  rationale: Distingue o morador próximo (שָׁכֵן) de seu associado ou companheiro (רֵעַ), sem reduzir necessariamente este último a amigo íntimo.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: Comunica a gravidade do juízo sem especificar um modo de destruição que o verbo hebraico não explicita.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico traz o tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Agente dos tropeços
  choice: Deus declara que os põe diante do povo
  alternative: Obstáculos surgem de modo impessoal
  rationale: A primeira pessoa explícita em הִנְנִי נֹתֵן deve ser mantida, preservando a tensão do texto quanto ao juízo divino.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. “Eis que” conserva o tom profético sem recorrer a construções arcaicas; “companheiro” evita interpretar רֵעַ estritamente como amizade íntima.
