base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/013.yaml
  text: For from their least to their greatest[a], every one of them is greedy for unjust gain; and from prophet to priest[c][b], every one of them practices falsehood.
translation:
  language: pt
  text: Pois, desde o menor deles até o maior[a], todos são ávidos por lucro desonesto[b]; do profeta ao sacerdote, todos praticam a falsidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o menor até o maior dentre eles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “é ávido por ganho”; no contexto, a expressão provavelmente indica lucro desonesto ou injusto.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “agem com falsidade” ou “praticam o engano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da acusação e do juízo no contexto anterior, de modo natural em português.
- source_word: מִקְּטַנָּם וְעַד גְּדוֹלָם
  choice: desde o menor deles até o maior
  rationale: Preserva o merismo que abrange toda a escala social e mantém a referência expressa pelo sufixo hebraico.
- source_word: כֻּלּוֹ
  choice: todos
  rationale: O singular morfológico tem aqui sentido coletivo e distributivo; 'todos' é claro e natural no contexto.
- source_word: בּוֹצֵעַ בָּצַע
  choice: são ávidos por lucro desonesto
  rationale: A construção com verbo e substantivo cognatos ressalta a busca cobiçosa de ganho, frequentemente com conotação ilícita; a tradução comunica tanto a avidez quanto a censura moral.
- source_word: וּמִנָּבִיא וְעַד כֹּהֵן
  choice: do profeta ao sacerdote
  rationale: Conserva o segundo merismo, que denuncia a corrupção entre as autoridades religiosas.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: praticam a falsidade
  rationale: A expressão descreve conduta habitual marcada por falsidade ou fraude, e não apenas uma mentira isolada.
