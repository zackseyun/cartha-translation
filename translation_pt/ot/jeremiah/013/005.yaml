base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/005.yaml
  text: So I went and hid it by the Euphrates[a], as Yahweh had commanded me.
translation:
  language: pt
  text: Então fui e o escondi junto ao Eufrates[a], como o SENHOR me havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Perate, geralmente entendido como o Eufrates; alguns consideram que seja um topônimo local, “Perate”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָ/אֵלֵךְ
  choice: Então fui
  rationale: O wayyiqtol de הלך faz a narrativa avançar; “Então fui” expressa com naturalidade a sequência da ação.
- source_word: וָ/אֶטְמְנֵ֖/הוּ
  choice: o escondi
  rationale: טמן significa esconder ou ocultar. O pronome masculino retoma o objeto mencionado no contexto anterior; “escondi” evita especificar indevidamente que ele foi enterrado.
- source_word: בִּ/פְרָ֑ת
  choice: junto ao Eufrates
  rationale: פְרָת designa normalmente o Eufrates. Neste contexto, ב indica o lugar junto ao qual o objeto foi escondido; a possibilidade de Perate ser um topônimo local é mantida em nota.
- source_word: כַּ/אֲשֶׁ֛ר
  choice: como
  rationale: 'Introduz conformidade de maneira: Jeremias agiu de acordo com a ordem recebida.'
- source_word: צִוָּ֥ה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto indica naturalmente, em português, que a ordem precedeu a ação narrada.
- source_word: יְהוָ֖ה
  choice: o SENHOR
  rationale: Segue a convenção reverencial consolidada em português para o Tetragrama, sem apagar que o hebraico traz o nome divino.
- source_word: אוֹתִֽ/י
  choice: me
  rationale: A marca de objeto direto com sufixo de primeira pessoa é expressa idiomaticamente por “me” após “ordenado”.
theological_decisions:
- issue: Identificação de פְרָת
  choice: o Eufrates
  alternative: Perate como topônimo não traduzido ou como localidade próxima
  rationale: O valor lexical habitual de פְרָת é “Eufrates”, que permanece no texto principal. Como a identificação com uma localidade chamada Perate é defendida por alguns devido à geografia da narrativa, a alternativa é registrada sem resolver a questão de modo dogmático.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa foi preservada de modo natural, e a ambiguidade geográfica legítima foi mantida em nota.
