base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/021.yaml
  text: What will you say when he appoints over you those whom you yourself taught to be leaders over you? Will not labor pains seize you like a woman giving birth?[a][b]
translation:
  language: pt
  text: O que você dirá quando ele colocar sobre você[a] aqueles que você mesma ensinou a serem seus líderes[b]? Não se apoderarão de você as dores de parto, como se apoderam de uma mulher que dá à luz?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando ele visitar você” ou “quando ele punir você”. O verbo hebraico pode significar cuidar de, visitar, punir ou designar; neste contexto, provavelmente indica colocar governantes sobre Judá.
    reason: lexical_alternative
  - marker: b
    text: Ou “chefes” ou “companheiros íntimos”. O termo hebraico pode designar líderes de clãs ou pessoas próximas; aqui provavelmente se refere àqueles que Judá cultivou como aliados e que agora se tornam seus governantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֹּאמְרִי
  choice: O que você dirá
  rationale: A pergunta retórica dirige-se, no feminino singular, a Judá ou Sião personificada. O futuro traduz naturalmente o imperfeito no contexto.
- source_word: כִּי יִפְקֹד עָלַיִךְ
  choice: quando ele colocar sobre você
  rationale: פקד pode indicar cuidar, visitar, punir ou designar. A continuação, que fala de líderes sobre Judá, favorece aqui o sentido de colocar ou constituir alguém em posição de autoridade, sem eliminar as alternativas em nota.
- source_word: וְאַתְּ לִמַּדְתְּ אֹתָם
  choice: aqueles que você mesma ensinou
  rationale: O piel de למד significa ensinar ou treinar. O pronome independente וְאַתְּ dá ênfase ao sujeito feminino, representada por “você mesma”.
- source_word: עָלַיִךְ אַלֻּפִים לְרֹאשׁ
  choice: a serem seus líderes
  rationale: Com עָלַיִךְ e לְרֹאשׁ, אַלֻּפִים aponta neste contexto para pessoas em posição superior ou governante. “Líderes” é claro e atual, enquanto a amplitude lexical é registrada em nota.
- source_word: הֲלוֹא
  choice: Não se ...?
  rationale: Introduz uma pergunta retórica enfática que espera resposta afirmativa.
- source_word: חֲבָלִים
  choice: dores de parto
  rationale: Embora o substantivo possa ter outros sentidos, a comparação imediata com uma mulher que dá à luz determina aqui o sentido de dores de parto.
- source_word: יֹאחֱזוּךְ
  choice: se apoderarão de você
  rationale: אחז significa agarrar ou apoderar-se. A expressão comunica a força súbita e dominadora das dores.
- source_word: כְּמוֹ אֵשֶׁת לֵדָה
  choice: como de uma mulher que dá à luz
  rationale: Tradução natural da comparação hebraica com uma mulher no processo do parto.
theological_decisions:
- issue: Referente do sujeito masculino singular implícito em יִפְקֹד
  choice: Mantido como “ele”, sem identificar o sujeito
  alternative: Explicitar “o SENHOR”, “o rei inimigo” ou outro agente
  rationale: O hebraico não nomeia o sujeito. Ele pode aludir à ação do SENHOR por meio de potências estrangeiras ou à própria potência hostil. Manter “ele” preserva a ambiguidade e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você mesma” torna explícitos o gênero feminino e a ênfase do hebraico. A formulação conserva o sujeito masculino não identificado e registra em notas a polissemia dos termos centrais.
