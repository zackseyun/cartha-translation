id: JER.13.25
reference: Jeremiah 13:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֶ֣ה גוֹרָלֵ֧/ךְ מְנָת מִדַּ֛יִ/ךְ מֵֽ/אִתִּ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֙ שָׁכַ֣חַתְּ אוֹתִ֔/י וַֽ/תִּבְטְחִ֖י בַּ/שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/025.yaml
  text: This is your lot[a], the portion measured out to you from me, declares Yahweh[b], because you have forgotten me and trusted in falsehood.
translation:
  language: pt
  text: Esta é a sua sorte[a], a porção medida para você, vinda de mim, declara Yahweh, porque você se esqueceu de mim e confiou na falsidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu destino” ou “o seu quinhão”. O hebraico reúne termos ligados à sorte e à porção atribuída, ressaltando aquilo que lhe foi designado.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas mentiras” ou “no engano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה גוֹרָלֵךְ
  choice: Esta é a sua sorte
  rationale: Preserva a imagem concreta do quinhão atribuído e, no contexto de juízo, também sugere o destino resultante.
- source_word: מְנָת מִדַּיִךְ מֵאִתִּי
  choice: a porção que determinei para você
  rationale: Expressa em português natural a ideia de uma porção medida ou designada e mantém Deus como sua fonte.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz de modo corrente e solene a fórmula profética, preservando o nome divino.
- source_word: אֲשֶׁר שָׁכַחַתְּ אוֹתִי
  choice: porque você se esqueceu de mim
  rationale: O relativo introduz aqui a razão do juízo; as formas femininas singulares são mantidas no tratamento direto sem acrescentar um referente ausente no versículo.
- source_word: וַתִּבְטְחִי בַּשָּׁקֶר
  choice: e confiou na falsidade
  rationale: Mantém a acusação direta e a amplitude de שֶׁקֶר, que pode indicar falsidade, mentira ou engano.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; a transliteração preserva essa função sem substituí-lo por um título.
- issue: Referente das formas na segunda pessoa feminina singular
  choice: Manter o tratamento singular por “você”
  alternative: Explicitar “Judá” ou “Jerusalém”
  rationale: A forma hebraica personifica coletivamente a destinatária; não se acrescenta ao corpo do versículo um nome que não aparece nele.
- issue: Amplitude semântica de שֶׁקֶר
  choice: falsidade
  alternative: mentiras; engano
  rationale: “Falsidade” evita limitar a acusação a uma única espécie de mentira ou objeto de confiança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O feminino singular do hebraico não é morfologicamente visível em “você”, mas o discurso direto e a ambiguidade do referente são preservados.
