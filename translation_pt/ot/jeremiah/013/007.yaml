base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/007.yaml
  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
translation:
  language: pt
  text: Então fui a Perate[a], cavei e tirei a faixa[b] do lugar onde a havia escondido. E eis que a faixa estava estragada e não servia para nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perate pode referir-se ao Eufrates; o hebraico traz o nome do lugar, Perate.
    reason: alternative_reading
  - marker: b
    text: Ou “cinto”, “pano de cintura” ou “faixa da cintura”. O termo hebraico indica uma peça usada ao redor da cintura.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָתָה
  choice: Perate
  rationale: Mantém no texto o topônimo hebraico, sem resolver a possível identificação com o Eufrates; essa possibilidade é preservada em nota.
- source_word: אֵזוֹר
  choice: faixa
  rationale: Designa de modo natural e relativamente neutro uma peça usada ao redor da cintura, sem especificar indevidamente que fosse cinto rígido ou roupa íntima.
- source_word: טְמַנְתִּיו
  choice: a havia escondido
  rationale: Preserva o sentido amplo de ocultar; o ato de cavar já sugere que a peça fora enterrada, sem ser necessário explicitar isso no verbo.
- source_word: וְהִנֵּה
  choice: Mas eis que
  rationale: Mantém a força de descoberta e surpresa do marcador hebraico; 'mas' expressa naturalmente o contraste contextual sem eliminar o valor de atenção de 'eis que'.
- source_word: נִשְׁחַת
  choice: estava estragada
  rationale: Comunica em português corrente que a faixa se deteriorara e ficara arruinada.
- source_word: לֹא יִצְלַח לַכֹּל
  choice: não servia para nada
  rationale: Expressão idiomática clara que transmite a completa inutilidade do objeto.
- source_word: וָאֵלֵךְ ... וָאֶחְפֹּר ... וָאֶקַּח
  choice: Então fui ... cavei e peguei
  rationale: Reproduz a progressão narrativa das formas verbais hebraicas em português natural.
