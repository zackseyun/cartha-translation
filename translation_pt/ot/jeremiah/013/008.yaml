  text: 'Então a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O wayyiqtol de היה dá continuidade à sequência narrativa. Em português, “Então” expressa essa progressão naturalmente, enquanto o verbo é incorporado à fórmula profética “a palavra ... veio”.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” preserva o valor lexical de דָּבָר e a força da fórmula profética tradicional, sem explicitar interpretativamente “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente a preposição אֶל com o sufixo da primeira pessoa do singular e soa natural na construção portuguesa.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala divina que vem em seguida; “dizendo” preserva diretamente a fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” preserva sua função nominal sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção mantém a fórmula profética e a correspondência próxima ao hebraico, evitando o arcaísmo “e aconteceu que” e conservando “dizendo” para ligar o versículo à fala seguinte.
