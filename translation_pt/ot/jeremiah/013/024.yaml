  text: וַ/אֲפִיצֵ֖/ם כְּ/קַשׁ עוֹבֵ֑ר לְ/ר֖וּחַ מִדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/024.yaml
  text: So I will scatter them like chaff passing away before the desert wind[a].
translation:
  language: pt
  text: Por isso, eu os espalharei como palha levada pelo vento do deserto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como restolho que passa diante do vento da região selvagem».'
    reason: Alternativas lexicais que preservam mais literalmente o particípio עובר e os sentidos possíveis de קַשׁ e מִדְבָּר.
lexical_decisions:
- source_word: וַאֲפִיצֵם
  choice: Por isso, eu os espalharei
  rationale: O hifil com sujeito na primeira pessoa do singular e objeto na terceira pessoa do plural expressa a ação de dispersar. O futuro convém ao anúncio profético de juízo, e «Por isso» comunica o valor consequencial do waw no contexto.
- source_word: כקש
  choice: como palha
  rationale: קַשׁ pode designar palha, restolho ou resíduos secos. «Palha» preserva a imagem de matéria leve e seca carregada pelo vento e soa natural em português.
- source_word: עובר
  choice: levada
  rationale: O particípio qal de עבר descreve aquilo que passa ou segue adiante. No contexto, «levada» torna explícito, sem alterar a imagem, que o movimento da palha ocorre sob a ação do vento.
- source_word: לרוח
  choice: pelo vento
  rationale: A preposição ל nesta construção apresenta a palha entregue ao movimento do vento. «Pelo vento» é a formulação idiomática mais clara em português.
- source_word: מדבר
  choice: do deserto
  rationale: מִדְבָּר pode significar «deserto» ou «região selvagem». Aqui, «deserto» comunica de modo claro o ambiente árido e o vento forte da imagem de juízo.
