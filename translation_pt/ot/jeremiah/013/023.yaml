  text: הֲ/יַהֲפֹ֤ךְ כּוּשִׁי֙ עוֹר֔/וֹ וְ/נָמֵ֖ר חֲבַרְבֻּרֹתָ֑י/ו גַּם אַתֶּם֙ תּוּכְל֣וּ לְ/הֵיטִ֔יב לִמֻּדֵ֖י הָרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/023.yaml
  text: Can a Cushite change his skin[b][a], or a leopard its spots? Then you also can do good—you who are trained in evil.
translation:
  language: pt
  text: Pode um cuxita[a] mudar sua pele, ou um leopardo, suas manchas? Então vocês também podem fazer o bem, vocês que estão acostumados a fazer o mal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “etíope”. O hebraico diz “cuxita”, isto é, uma pessoa de Cuxe.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ensinados no mal”; também pode ser entendido como “treinados no mal”. A expressão indica pessoas habituadas à prática do mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: cuxita
  rationale: Reproduz diretamente o gentílico hebraico referente a uma pessoa de Cuxe, sem substituí-lo por uma designação geográfica posterior.
- source_word: הֲיַהֲפֹךְ
  choice: Pode ... mudar
  rationale: A pergunta retórica trata da possibilidade de alterar uma característica física; esta formulação é clara e idiomática em português.
- source_word: עוֹרוֹ
  choice: a sua pele
  rationale: Equivalente natural e preciso para a pele da pessoa mencionada.
- source_word: נָמֵר
  choice: leopardo
  rationale: Equivalente lexical corrente do nome do animal.
- source_word: חֲבַרְבֻּרֹתָיו
  choice: as suas manchas
  rationale: Designa as marcas características do leopardo; “manchas” é a expressão convencional e contextualmente adequada.
- source_word: גַּם אַתֶּם תּוּכְלוּ
  choice: Então vocês também poderão
  rationale: 'Mantém a analogia irônica: eles poderão fazer o bem somente se as mudanças impossíveis apresentadas nas perguntas também forem possíveis.'
- source_word: לְהֵיטִיב
  choice: fazer o bem
  rationale: Tradução concisa e natural do infinitivo que significa agir bem ou fazer o que é bom.
- source_word: לִמֻּדֵי הָרֵעַ
  choice: acostumados a fazer o mal
  rationale: Comunica que a prática do mal foi aprendida e se tornou habitual, sem sugerir necessariamente um treinamento formal.
theological_decisions:
- issue: Incapacidade moral expressa por uma analogia retórica
  choice: O versículo apresenta a prática do mal como um hábito profundamente arraigado e compara a possibilidade de fazer o bem à alteração de características físicas fixas.
  alternative: Ler a frase como uma afirmação sistemática e universal sobre toda capacidade humana, ou como mera hipérbole sem verdadeira força de incapacidade moral.
  rationale: A tradução conserva a força da analogia no contexto imediato de Judá, sem ampliá-la para uma formulação doutrinária que o versículo não explicita nem enfraquecê-la.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. A construção “Então vocês também poderão” preserva a ironia da pergunta retórica, e “acostumados a fazer o mal” expressa de modo natural a habitualidade indicada pelo hebraico.
