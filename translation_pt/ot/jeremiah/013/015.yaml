source:
  edition: WLC
  text: שִׁמְע֥וּ וְ/הַאֲזִ֖ינוּ אַל תִּגְבָּ֑הוּ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/015.yaml
  text: Hear and listen; do not be proud[a], for Yahweh has spoken.
translation:
  language: pt
  text: Ouçam e prestem atenção; não sejam arrogantes[a], pois Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não sejam altivos” ou “não se exaltem”. O verbo hebraico pode expressar a ideia de ser elevado no sentido de arrogância.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע. “Ouçam” preserva a primeira ordem e permite manter a duplicação retórica com o segundo imperativo.
- source_word: וְהַאֲזִינוּ
  choice: e prestem atenção
  rationale: O hifil imperativo de אזן expressa escutar atentamente. “Prestem atenção” diferencia naturalmente o segundo verbo e comunica a intensificação.
- source_word: אַל תִּגְבָּהוּ
  choice: não sejam arrogantes
  rationale: A partícula אַל introduz uma proibição, e גבהּ, literalmente associado a ser alto ou elevado, tem aqui sentido moral de arrogância.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a proibição e conserva o tom conciso da declaração profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבֵּר
  choice: falou
  rationale: O perfeito de דבר apresenta a fala divina como realizada. Em português, o pretérito perfeito simples é a forma mais natural neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração sem substituí-lo por um título.
- issue: Sentido moral de תִּגְבָּהוּ
  choice: não sejam arrogantes
  alternative: não se exaltem
  rationale: O contexto favorece a ideia de altivez moral. A nota conserva a imagem e as alternativas possíveis sem restringir indevidamente o verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância no plural. A combinação “Ouçam e prestem atenção” preserva o paralelismo intensificador do hebraico sem recorrer ao pouco natural “deem ouvidos”.
