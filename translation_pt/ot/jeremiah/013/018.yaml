  text: אֱמֹ֥ר לַ/מֶּ֛לֶךְ וְ/לַ/גְּבִירָ֖ה הַשְׁפִּ֣ילוּ שֵׁ֑בוּ כִּ֤י יָרַד֙ מַרְאֲשׁ֣וֹתֵי/כֶ֔ם עֲטֶ֖רֶת תִּֽפְאַרְתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/018.yaml
  text: Say to the king and to the queen mother[a], ‘Humble yourselves; sit down[b], for your glorious crown has come down from your heads.’
translation:
  language: pt
  text: 'Diga ao rei e à rainha-mãe[a]: “Humilhem-se e sentem-se, pois a coroa do esplendor de vocês desceu de sobre suas cabeças.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “rainha-mãe” é um título da corte real e pode designar a mãe do rei, em vez de sua esposa.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמֹר
  choice: Diga
  rationale: Imperativo masculino singular de אמר; introduz a mensagem profética que Jeremias deve transmitir.
- source_word: לַמֶּלֶךְ
  choice: ao rei
  rationale: Substantivo definido com preposição, referente ao rei reinante.
- source_word: וְלַגְּבִירָה
  choice: e à rainha-mãe
  rationale: גְּבִירָה é um título régio que, neste contexto, provavelmente designa a mãe do rei, e não sua esposa.
- source_word: הַשְׁפִּילוּ
  choice: Humilhem-se
  rationale: O imperativo plural causativo de שׁפל ordena que os destinatários assumam uma posição rebaixada; a forma reflexiva comunica tanto rebaixamento social quanto humilhação.
- source_word: שֵׁבוּ
  choice: sentem-se
  rationale: Imperativo plural de ישׁב; mantém a imagem concreta de abandonar uma posição elevada e tomar assento em condição inferior.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para as ordens anteriores de modo natural e digno em português.
- source_word: יָרַד
  choice: desceu
  rationale: O perfeito de ירד significa descer; evita especificar se a coroa caiu ou foi retirada e preserva a imagem do hebraico.
- source_word: מַרְאֲשׁוֹתֵיכֶם
  choice: de sobre a cabeça de vocês
  rationale: Embora a forma seja plural e possa designar o lugar da cabeça, a presença da coroa aponta para a posição sobre a cabeça. Em português, o singular distributivo evita a ideia estranha de várias cabeças por pessoa.
- source_word: עֲטֶרֶת תִּפְאַרְתְּכֶם
  choice: a coroa do esplendor de vocês
  rationale: Reproduz de modo inteligível a cadeia construta, literalmente 'a coroa do esplendor/glória de vocês', sem reduzir a relação à simples qualidade adjetival.
