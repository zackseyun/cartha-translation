base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
translation:
  language: pt
  text: 'Assim me disse Yahweh: “Vá e compre para você uma faixa de linho[a]. Coloque-a em volta da cintura, mas não a ponha na água.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um cinto de linho”, “uma cinta de linho” ou, possivelmente, “uma peça de linho para os lombos”. O termo hebraico designa uma peça usada em volta da cintura.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim me disse
  rationale: Reproduz a fórmula profética de modo solene e natural em português, com אֵלַי expresso pelo pronome “me”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָלוֹךְ וְקָנִיתָ לְּךָ
  choice: Vá e compre para você
  rationale: O infinitivo absoluto seguido da forma verbal comunica uma ordem; “para você” preserva a nuance de לְךָ sem tornar a frase artificial.
- source_word: אֵזוֹר פִּשְׁתִּים
  choice: uma faixa de linho
  rationale: אֵזוֹר designa uma peça usada na região da cintura, e פִּשְׁתִּים indica linho; “faixa” evita especificar além do que o hebraico permite.
- source_word: וְשַׂמְתּוֹ עַל מָתְנֶיךָ
  choice: Coloque-a em volta da cintura
  rationale: Expressa em português corrente a colocação da peça na região dos quadris ou da cintura.
- source_word: וּבַמַּיִם לֹא תְבִאֵהוּ
  choice: mas não a ponha na água
  rationale: A forma causativa de בוא significa fazê-la entrar na água; a tradução conserva a generalidade do hebraico, sem decidir se se trata especificamente de lavar ou mergulhar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva de forma transliterada, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o tom profético e mantém aberta a identificação exata da peça de vestuário.
