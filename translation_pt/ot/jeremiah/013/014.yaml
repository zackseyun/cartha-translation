source:
  edition: WLC
  text: וְ/נִפַּצְתִּי/ם֩ אִ֨ישׁ אֶל אָחִ֜י/ו וְ/הָ/אָב֧וֹת וְ/הַ/בָּנִ֛ים יַחְדָּ֖ו נְאֻם יְהוָ֑ה לֹֽא אֶחְמ֧וֹל וְ/לֹֽא אָח֛וּס וְ/לֹ֥א אֲרַחֵ֖ם מֵ/הַשְׁחִיתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/014.yaml
  text: And I will smash them against each other[a], man against his brother, fathers and sons together, declares Yahweh. I will not spare, nor will I pity, nor will I have compassion[b], from destroying them.
translation:
  language: pt
  text: Eu os despedaçarei uns contra os outros[a], cada homem contra seu irmão, pais e filhos todos juntos[b] — declara Yahweh. Não os pouparei, nem terei piedade, nem mostrarei compaixão a ponto de deixar de destruí-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “eu os arremessarei uns contra os outros” ou “eu os esmagarei uns contra os outros”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico nomeia explicitamente relações masculinas: “homem contra seu irmão” e “pais e filhos”.'
    reason: cultural_note
lexical_decisions:
- source_word: וְנִפַּצְתִּים
  choice: Eu os despedaçarei
  rationale: O verbo נפץ expressa choque violento com quebra ou esmagamento. “Despedaçarei” conserva a força concreta do hebraico; a nota registra alternativas igualmente possíveis.
- source_word: אִישׁ אֶל אָחִיו
  choice: cada homem contra seu irmão
  rationale: A construção distributiva singular foi mantida, assim como o masculino e a relação de fraternidade explicitamente presentes no hebraico.
- source_word: וְהָאָבוֹת וְהַבָּנִים יַחְדָּו
  choice: pais e filhos todos juntos
  rationale: Preserva os vínculos familiares masculinos nomeados no texto e a ênfase de יַחְדָּו, indicando que as duas gerações sofrerão juntas.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética נְאֻם foi vertida de modo natural e solene, e o nome divino foi transliterado como “Yahweh”.
- source_word: לֹא אֶחְמֹל וְלֹא אָחוּס וְלֹא אֲרַחֵם
  choice: Não os pouparei, nem terei piedade, nem mostrarei compaixão
  rationale: A tradução mantém a acumulação retórica de três expressões próximas, mas distintas, sem reduzi-las a uma só ideia.
- source_word: מֵהַשְׁחִיתָם
  choice: a ponto de deixar de destruí-los
  rationale: A construção מן com infinitivo indica que pena, piedade ou compaixão não levarão Yahweh a se abster da destruição. Esta formulação torna esse alcance da negação claro e idiomático em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem masculina de parentesco
  choice: cada homem contra seu irmão, pais e filhos
  alternative: uns contra os outros, pais e filhos; pessoas contra seus parentes, pais e filhos
  rationale: O hebraico emprega אִישׁ, אָחִיו, אָבוֹת e בָּנִים. A versão conserva os referentes masculinos e os vínculos familiares específicos, sem generalizá-los silenciosamente.
- issue: Alcance da negação na cláusula final
  choice: não haverá compaixão que leve Yahweh a deixar de destruí-los
  alternative: 'uma tradução rígida: “não terei compaixão de destruí-los” ou “não terei compaixão, de destruí-los”'
  rationale: A opção preserva o sentido de abstenção expresso por מן com o infinitivo e evita sugerir, de modo equivocado, que a destruição seja o objeto da compaixão.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A violência concreta e a repetição enfática do juízo foram preservadas; a cláusula final foi formulada de maneira idiomática sem apagar sua ligação sintática com os três verbos anteriores.
