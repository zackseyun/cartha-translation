base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/010.yaml
  text: This evil people[a], who refuse to hear my words, who walk in the stubbornness of their heart, and who go after other gods to serve them and to bow down to them, will become like this waistband, which is good for nothing.
translation:
  language: pt
  text: Este povo mau, que se recusa a ouvir as minhas palavras, que segue a obstinação do próprio coração e que foi atrás de outros deuses para servi-los e se curvar diante deles, se tornará como este cinto[a], que não serve para nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faixa”. O hebraico אֵזוֹר designa uma peça usada em torno da cintura; no contexto do ato simbólico de Jeremias 13, sua forma exata não é totalmente definida.
    reason: alternativa lexical e preservação da indeterminação do objeto
lexical_decisions:
- source_word: הָעָם הַזֶּה הָרָע
  choice: Este povo mau
  rationale: Preserva o substantivo coletivo עָם e a severa avaliação moral expressa por רַע, em linguagem portuguesa direta e natural.
- source_word: הַמֵּאֲנִים לִשְׁמוֹעַ אֶת־דְּבָרַי
  choice: que se recusa a ouvir as minhas palavras
  rationale: מָאֵן indica recusa deliberada, e o plural דְּבָרַי é mantido. “Ouvir” conserva também a possível implicação de acolher e obedecer.
- source_word: הַהֹלְכִים בִּשְׁרִרוּת לִבָּם
  choice: que segue a obstinação do próprio coração
  rationale: A formulação comunica conduta contínua; שְׁרִרוּת é obstinação ou teimosia, não mero desejo. “Próprio coração” expressa naturalmente em português a força distributiva do singular coletivo hebraico.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: e que foi atrás de outros deuses
  rationale: O passado traduz a ação verbal que segue os particípios e apresenta a apostasia já praticada, sem reduzir a expressão concreta “ir atrás” a uma paráfrase abstrata.
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: para servi-los e se curvar diante deles
  rationale: 'Mantém distintos os dois verbos hebraicos: serviço ou devoção e o gesto concreto de inclinar-se em reverência.'
- source_word: וִיהִי כָּאֵזוֹר הַזֶּה
  choice: se tornará como este cinto
  rationale: “Se tornará” exprime o resultado anunciado, enquanto “cinto” é uma equivalência clara e corrente para אֵזוֹר no contexto do ato simbólico.
- source_word: אֲשֶׁר לֹא יִצְלַח לַכֹּל
  choice: que não serve para nada
  rationale: Reproduz de modo idiomático e enfático a inutilidade total expressa pelo hebraico.
theological_decisions:
- issue: Distinção entre as ações ligadas à idolatria
  choice: “servi-los e se curvar diante deles”
  alternative: Traduzir os dois verbos genericamente como “adorá-los”
  rationale: O texto hebraico emprega dois verbos distintos. Preservar serviço e inclinação mantém a amplitude retórica da acusação sem impor uma formulação doutrinária adicional.
- issue: Valor de “ouvir”
  choice: Manter “ouvir” sem explicitar “obedecer”
  alternative: “dar ouvidos” ou “obedecer”
  rationale: “Ouvir” preserva a polissemia hebraica entre percepção, acolhimento e resposta obediente, sem resolver no texto principal uma implicação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadeia de orações relativas preserva o desenvolvimento da acusação profética; a repetição é moderada apenas onde a sintaxe portuguesa permite clareza.
