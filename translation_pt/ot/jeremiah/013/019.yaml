source:
  edition: WLC
  text: עָרֵ֥י הַ/נֶּ֛גֶב סֻגְּר֖וּ וְ/אֵ֣ין פֹּתֵ֑חַ הָגְלָ֧ת יְהוּדָ֛ה כֻּלָּ֖/הּ הָגְלָ֥ת שְׁלוֹמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/019.yaml
  text: The cities of the Negev are shut up[a], with no one to open them; all Judah has been carried away into exile[c][b], wholly carried away into exile.
translation:
  language: pt
  text: As cidades do Neguebe[a] estão fechadas, e não há quem as abra; todo Judá foi levado para o exílio, foi levado para o exílio por completo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as cidades do sul”. “Neguebe” pode referir-se especificamente à região sul de Judá.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Judá foi levado para o exílio, todo ele; foi levado para o exílio por completo”. Também é possível entender a última expressão como “foi levado para o exílio em paz”, embora o contexto provavelmente ressalte a totalidade da deportação.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי הַנֶּגֶב
  choice: as cidades do Neguebe
  rationale: נֶגֶב pode designar o sul em geral ou, mais especificamente, a região árida ao sul de Judá. “Neguebe” preserva a referência geográfica, enquanto a nota registra a alternativa lexical.
- source_word: סֻגְּרוּ
  choice: estão fechadas
  rationale: 'O perfeito passivo descreve um estado resultante: as cidades foram fechadas e permanecem inacessíveis, provavelmente no contexto de desastre militar.'
- source_word: וְאֵין פֹּתֵחַ
  choice: e não há quem as abra
  rationale: A formulação portuguesa é natural e mantém a ideia de que ninguém está presente ou é capaz de reverter o fechamento.
- source_word: הָגְלָת
  choice: foi levado para o exílio
  rationale: O hofal de גלה é causativo-passivo e apresenta Judá como alvo de deportação, não como alguém que parte voluntariamente.
- source_word: יְהוּדָה כֻּלָּהּ
  choice: todo o Judá
  rationale: A expressão comunica de modo conciso a abrangência total indicada por כֻּלָּהּ.
- source_word: הָגְלָת שְׁלוֹמִים
  choice: foi levado por completo
  rationale: A repetição é mantida, e שְׁלוֹמִים é entendido adverbialmente como indicação de totalidade. A elipse de “para o exílio” na segunda ocorrência evita peso excessivo sem perder o sentido.
theological_decisions:
- issue: Sentido de שְׁלוֹמִים na fórmula de exílio
  choice: 'indicação adverbial de totalidade: “por completo”'
  alternative: “em paz” ou “pacificamente”
  rationale: O paralelismo com כֻּלָּהּ e a repetição de הָגְלָת favorecem a ideia de deportação completa. Contudo, como a forma se relaciona lexicalmente com שָׁלוֹם, a alternativa “em paz” permanece genuinamente possível e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Neguebe” conserva o topônimo tradicional e específico; “levado para o exílio” explicita a deportação forçada. A repetição hebraica é parcialmente preservada para manter a ênfase, sem produzir uma construção excessivamente rígida em português.
