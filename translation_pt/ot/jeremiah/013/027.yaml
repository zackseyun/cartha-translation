  source_fidelity: 'O texto preserva adequadamente a enumeração acusatória do hebraico: os plurais “adultérios” e “relinchos”, a expressão intensificadora “a perversidade da sua prostituição”, o cenário “sobre as colinas, no campo”, a declaração divina “eu vi”, e “abominações”, com seu peso profético e possivelmente cultual. “Você não será purificada?” reproduz de modo defensável o nifal negativo como pergunta retórica, sem eliminar a ambiguidade indicada em nota; “Até quando ainda?” mantém de forma concisa a elipse temporal de אַחֲרֵי מָתַי עוֹד.'
