id: JER.13.27
reference: Jeremiah 13:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נִֽאֻפַ֤יִ/ךְ וּ/מִצְהֲלוֹתַ֨יִ/ךְ֙ זִמַּ֣ת זְנוּתֵ֔/ךְ עַל גְּבָעוֹת֙ בַּ/שָּׂדֶ֔ה רָאִ֖יתִי שִׁקּוּצָ֑יִ/ךְ א֥וֹי לָ/ךְ֙ יְר֣וּשָׁלִַ֔ם לֹ֣א תִטְהֲרִ֔י אַחֲרֵ֥י מָתַ֖י עֹֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/027.yaml
  text: Your adulteries[a], your lustful neighings, the depravity of your prostitution on the hills in the field—I have seen your abominations. Woe to you, Jerusalem! Will you not be made clean?[d][c][b] How long will it still be?
translation:
  language: pt
  text: Seus adultérios, seus relinchos de desejo[a], a perversidade da sua prostituição sobre as colinas, no campo — eu vi as suas abominações. Ai de você, Jerusalém! Você não será purificada?[b] Até quando ainda?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão evoca a imagem de cavalos relinchando de desejo sexual, usada também em Jeremias 5:8.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Você não ficará pura?”. O hebraico também pode ser entendido de modo menos passivo; sem pontuação interrogativa no texto antigo, alguns leem a frase como declaração: “Você não será purificada”.'
    reason: alternative_reading
  - marker: c
    text: O hebraico é elíptico, literalmente algo como “até depois de quando ainda?”, com o sentido de “até quando isso continuará?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֻפַיִךְ
  choice: seus adultérios
  rationale: Preserva o plural concreto e a metáfora sexual da infidelidade de Jerusalém.
- source_word: וּמִצְהֲלוֹתַיִךְ
  choice: seus relinchos de desejo
  rationale: Mantém a imagem vívida do relincho e explicita sua conotação de desejo sexual no contexto.
- source_word: זִמַּת זְנוּתֵךְ
  choice: a perversidade da sua prostituição
  rationale: Expressa a maldade ou devassidão intensificada por זִמָּה sem suavizar a linguagem profética de זְנוּת.
- source_word: עַל גְּבָעוֹת בַּשָּׂדֶה
  choice: sobre as colinas, no campo
  rationale: Conserva o cenário topográfico ligado às práticas ilícitas e idolátricas.
- source_word: רָאִיתִי שִׁקּוּצַיִךְ
  choice: eu vi as suas abominações
  rationale: Mantém a acusação direta e o termo profético com possíveis conotações cultuais e idolátricas.
- source_word: אוֹי לָךְ
  choice: Ai de você
  rationale: Equivalente português natural da fórmula profética de lamento e juízo.
- source_word: לֹא תִטְהֲרִי
  choice: Você não será purificada?
  rationale: Lê a forma negativa como pergunta retórica, preservando a nuance passiva do nifal e a tensão entre acusação e apelo.
- source_word: אַחֲרֵי מָתַי עוֹד
  choice: Até quando ainda?
  rationale: Reproduz de modo conciso a expressão temporal elíptica, sem acrescentar explicitamente aquilo que o hebraico deixa implícito.
theological_decisions:
- issue: Linguagem sexual como metáfora de infidelidade e idolatria
  choice: Manter no texto os termos concretos “adultérios”, “relinchos de desejo” e “prostituição”.
  alternative: Substituí-los por termos abstratos como “infidelidade” ou “imoralidade”.
  rationale: A imagem sexual deliberadamente forte faz parte da acusação profética e não deve ser neutralizada pela tradução.
- issue: Sentido de לֹא תִטְהֲרִי
  choice: 'Traduzir como pergunta retórica: “Você não será purificada?”'
  alternative: 'Traduzir como declaração: “Você não será purificada” ou, com sentido menos passivo, “Você não ficará pura?”'
  rationale: A sequência com a pergunta temporal favorece uma interpelação angustiada, mas a nota registra a possibilidade de entender a forma de maneira menos passiva.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A linguagem profética forte foi preservada sem arcaísmos; a formulação final mantém deliberadamente a concisão e a elipse do hebraico.
