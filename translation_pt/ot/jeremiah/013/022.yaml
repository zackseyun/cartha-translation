base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/022.yaml
  text: And if you say in your heart[a], ‘Why have these things happened to me?’—because of the greatness of your iniquity your skirts have been uncovered[b], your heels have been violated.
translation:
  language: pt
  text: 'E, se você disser no seu coração: “Por que estas coisas me aconteceram?”[a], por causa da grandeza da sua iniquidade, as abas de suas roupas foram descobertas, e seus calcanhares foram violentados.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que estas coisas vieram sobre mim?”'
    reason: lexical_alternative
  - marker: b
    text: “Seus calcanhares foram violentados” dá continuidade à imagem de exposição humilhante; o hebraico também pode ser entendido, de modo mais geral, como referência a maus-tratos violentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Introduz a objeção prevista e mantém a continuidade do discurso, sem tornar a construção estritamente temporal ou causal.
- source_word: תֹאמְרִי בִּלְבָבֵךְ
  choice: você disser no seu coração
  rationale: Preserva a imagem hebraica da fala interior em linguagem bíblica clara e natural.
- source_word: קְרָאֻנִי אֵלֶּה
  choice: estas coisas me aconteceram
  rationale: 'Expressa o sentido idiomático da construção: calamidades que sobrevêm à pessoa, e não o sentido literal de chamar.'
- source_word: בְּרֹב עֲוֺנֵךְ
  choice: por causa da enormidade da sua iniquidade
  rationale: A preposição indica causa; 'enormidade' comunica רֹב, e 'iniquidade' mantém o peso moral de עָוֹן.
- source_word: נִגְלוּ שׁוּלַיִךְ
  choice: suas saias foram levantadas
  rationale: שׁוּלַיִם designa as partes inferiores da roupa; a formulação preserva a imagem de exposição pública humilhante.
- source_word: נֶחְמְסוּ עֲקֵבָיִךְ
  choice: seus calcanhares foram violentados
  rationale: O nifal de חמס comunica sofrer violência ou violação. A tradução conserva a formulação corporal incomum e sua ambiguidade, sem especificar além do hebraico.
theological_decisions:
- issue: Imagem profética de vergonha e exposição com conotação sexual
  choice: Manter a exposição humilhante e a violência na metáfora, sem amenizá-las nem definir um ato sexual específico.
  alternative: Traduzir de modo eufemístico como 'sua nudez foi exposta' ou explicitar uma agressão sexual.
  rationale: O texto apresenta Jerusalém como uma mulher submetida à vergonha no contexto do juízo por sua iniquidade. A linguagem deve conservar a gravidade da imagem e, ao mesmo tempo, os limites do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma feminina do destinatário não aparece morfologicamente em 'você', mas fica clara nas referências a 'suas saias'; preservou-se a severidade da imagem profética.
