base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: pt
  text: 'E diga-lhes esta palavra: Assim diz o SENHOR, o Deus de Israel: “Todo jarro será cheio de vinho.” E eles lhe dirão: “Por acaso não sabemos que todo jarro será cheio de vinho?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵבֶל
  choice: cântaro
  rationale: Designa um recipiente de barro ou jarro; “cântaro” comunica de modo natural um vaso que pode ser enchido de vinho e preserva a imagem concreta.
- source_word: יִמָּלֵא
  choice: se encherá
  rationale: O nifal imperfeito expressa que o recipiente ficará cheio; o futuro mantém a forma proverbial e prepara o uso figurado nos versículos seguintes.
- source_word: הֲיָדֹעַ לֹא נֵדַע
  choice: Será que não sabemos muito bem
  rationale: A construção combina pergunta retórica, negação e infinitivo absoluto, dando ênfase ao conhecimento dos ouvintes; esta formulação transmite sua resposta segura e algo desdenhosa sem exagerá-la.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama por SENHOR em versaletes, sem introduzir uma vocalização disputada.
- issue: Força modal de יִמָּלֵא
  choice: se encherá
  alternative: deve ser enchido
  rationale: O contexto apresenta uma declaração proverbial cujo sentido pleno será revelado depois; o futuro preserva essa abertura sem transformá-la em mandamento ou obrigação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Portanto, diga-lhes” reproduz a instrução profética de modo natural; a pergunta retórica preserva a ironia dos interlocutores.
