  - severity: low
    issue: “Se encherá” é menos exato que o passivo.
    rationale: יִמָּלֵא é nifal (“será cheio/será preenchido”). Embora a forma reflexiva seja compreensível, a passiva conserva melhor a voz do hebraico.
  - severity: low
