source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמָע֔וּ/הָ בְּ/מִסְתָּרִ֥ים תִּבְכֶּֽה נַפְשִׁ֖/י מִ/פְּנֵ֣י גֵוָ֑ה וְ/דָמֹ֨עַ תִּדְמַ֜ע וְ/תֵרַ֤ד עֵינִ/י֙ דִּמְעָ֔ה כִּ֥י נִשְׁבָּ֖ה עֵ֥דֶר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/017.yaml
  text: But if you will not listen[a], my soul will weep in secret because of pride; my eyes will weep bitterly and run down with tears[e][d][c][b], because the flock of Yahweh has been taken captive.
translation:
  language: pt
  text: Mas, se vocês não lhe derem ouvidos[a], minha alma chorará em segredo[b] por causa do orgulho[c]; meus olhos chorarão copiosamente[d], e lágrimas correrão dos meus olhos, porque o rebanho de Yahweh[e] foi levado cativo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “não a ouvirem” ou “não lhe obedecerem”. O verbo hebraico pode abranger tanto ouvir quanto atender ou obedecer; o pronome retoma a mensagem ou advertência anterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em lugares ocultos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “por causa da arrogância”.
    reason: lexical_alternative
  - marker: d
    text: 'O hebraico intensifica o verbo por meio de uma repetição enfática: literalmente, “chorando, chorará”.'
    reason: lexical_alternative
  - marker: e
    text: Ou “o rebanho do SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמָעוּהָ
  choice: lhe derem ouvidos
  rationale: O verbo שׁמע pode expressar tanto ouvir quanto atender ou obedecer. A locução portuguesa “dar ouvidos” conserva essa ligação entre escuta e resposta, e “lhe” representa o sufixo pronominal feminino, cujo referente contextual é a mensagem ou advertência anterior.
- source_word: בְּמִסְתָּרִים
  choice: em segredo
  rationale: O plural hebraico significa literalmente “em lugares ocultos”; “em segredo” transmite de modo natural a ideia de choro escondido.
- source_word: תִּבְכֶּה נַפְשִׁי
  choice: minha alma chorará
  rationale: Mantém נֶפֶשׁ e a expressão poética da profunda dor interior, sem reduzi-la simplesmente a “eu chorarei”.
- source_word: מִפְּנֵי גֵוָה
  choice: por causa do orgulho
  rationale: A preposição tem valor causal neste contexto, e “orgulho” é uma tradução direta e corrente de גֵוָה; “arrogância” também é possível.
- source_word: וְדָמֹעַ תִּדְמַע
  choice: chorarão copiosamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica o choro. “Copiosamente” comunica essa ênfase em português sem reproduzir mecanicamente a repetição hebraica.
- source_word: וְתֵרַד עֵינִי דִּמְעָה
  choice: e deles correrão lágrimas
  rationale: A formulação preserva a imagem descendente das lágrimas. O singular poético “meu olho” é vertido pelo plural idiomático “meus olhos”.
- source_word: נִשְׁבָּה
  choice: foi levado cativo
  rationale: O nifal de שׁבה indica que alguém foi capturado e levado ao cativeiro; a escolha preserva esse sentido com precisão.
- source_word: עֵדֶר יְהוָה
  choice: o rebanho de Yahweh
  rationale: Conserva a metáfora pastoral e a relação de pertencimento expressa pela construção hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo silenciosamente por um título.
theological_decisions:
- issue: Referente do sufixo feminino em תִשְׁמָעוּהָ
  choice: Representá-lo por “lhe”, entendendo contextualmente a mensagem ou advertência anterior
  alternative: Omitir o pronome e traduzir apenas “se vocês não ouvirem”, ou explicitar “se vocês não ouvirem essa advertência”
  rationale: O hebraico contém um objeto pronominal feminino. “Lhe” o preserva sem definir além do necessário se o referente exato é a mensagem, a palavra ou a advertência.
- issue: Voz do lamento
  choice: Manter o lamento na primeira pessoa como expressão do profeta
  alternative: Entendê-lo também como manifestação da dor de Yahweh por meio do profeta
  rationale: A gramática apresenta a alma e os olhos do falante, naturalmente Jeremias, mas a tradução não impede que a dor divina também ressoe na fala profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A construção conserva o paralelismo poético e a metáfora do rebanho, usando equivalência natural para os idiomas hebraicos e mantendo em nota as alternativas relevantes.
