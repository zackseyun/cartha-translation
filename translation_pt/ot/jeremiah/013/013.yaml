source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י מְמַלֵּ֣א אֶת כָּל יֹשְׁבֵ֣י הָ/אָ֪רֶץ הַ/זֹּ֟את וְ/אֶת הַ/מְּלָכִ֣ים הַ/יֹּשְׁבִים֩ לְ/דָוִ֨ד עַל כִּסְא֜/וֹ וְ/אֶת הַ/כֹּהֲנִ֣ים וְ/אֶת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת כָּל יֹשְׁבֵ֥י יְרוּשָׁלִָ֖ם שִׁכָּרֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/013.yaml
  text: 'Then you shall say to them[a], ‘Thus says Yahweh: Behold, I am about to fill all the inhabitants of this land—and the kings who sit on David’s throne, and the priests, and the prophets[b], and all the inhabitants of Jerusalem—with drunkenness.’'
translation:
  language: pt
  text: 'Então você lhes dirá: “Assim diz Yahweh: Eis que estou prestes a encher de embriaguez todos os habitantes desta terra — os reis que se sentam no trono de Davi[a], os sacerdotes, os profetas e todos os habitantes de Jerusalém —[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “os reis que se sentam por Davi em seu trono”, expressão que ressalta sua sucessão dinástica a Davi.
    reason: lexical_alternative
  - marker: b
    text: “Embriaguez” provavelmente representa, de modo figurado, a desorientação e o juízo impostos por Deus; a imagem concreta, porém, é intencional.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Então você lhes dirá
  rationale: O waw faz avançar a sequência das instruções do versículo anterior. “Então” expressa essa progressão, e o futuro preserva o valor diretivo da forma verbal no contexto profético.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética de mensageiro e representa diretamente o nome divino יהוה como Yahweh.
- source_word: הִנְנִי מְמַלֵּא
  choice: Eis que estou prestes a encher
  rationale: “Eis que” conserva a ênfase solene de הִנְנִי, enquanto “estou prestes a” comunica a iminência contextual da ação expressa pelo particípio.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: todos os habitantes desta terra
  rationale: “Habitantes” traduz naturalmente o particípio substantivado יֹשְׁבֵי; “terra” se refere aqui ao território de Judá, não ao mundo inteiro.
- source_word: הַמְּלָכִים הַיֹּשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: os reis que se sentam no trono de Davi
  rationale: É a forma natural em português de expressar a sucessão dinástica indicada pela construção hebraica incomum com לְדָוִד. A nota registra sua formulação mais literal.
- source_word: הַכֹּהֲנִים וְאֶת הַנְּבִיאִים
  choice: os sacerdotes, os profetas
  rationale: Tradução direta dos dois grupos de liderança religiosa, sem restringir “profetas” apenas aos profetas verdadeiros.
- source_word: כָּל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: todos os habitantes de Jerusalém
  rationale: Mantém de modo natural e consistente o sentido de יֹשְׁבֵי no versículo.
- source_word: שִׁכָּרוֹן
  choice: embriaguez
  rationale: Preserva a imagem concreta da intoxicação e sua ligação com as vasilhas de vinho no contexto, sem reduzi-la no texto principal a uma explicação abstrata como “confusão” ou “entorpecimento”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido metafórico de שִׁכָּרוֹן
  choice: Manter “embriaguez” como imagem principal
  alternative: entorpecimento; confusão
  rationale: No contexto, a embriaguez aponta para desorientação e juízo impostos por Deus, mas a imagem profética permanece deliberadamente concreta e não deve ser silenciosamente explicada no corpo do texto.
- issue: Relação dos reis com Davi
  choice: “no trono de Davi” no texto, com esclarecimento em nota
  alternative: “por Davi em seu trono”
  rationale: A expressão hebraica sugere que esses reis ocupam o trono como sucessores dinásticos de Davi. A tradução corrente evita uma formulação obscura em português, enquanto a nota preserva a peculiaridade do original.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A fórmula “Assim diz Yahweh” e a expressão “Eis que” preservam o tom profético solene. Os travessões organizam a longa enumeração sem alterar seu alcance.
