  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תְּנוּ֩ לַ/יהוָ֨ה אֱלֹהֵי/כֶ֤ם כָּבוֹד֙ בְּ/טֶ֣רֶם יַחְשִׁ֔ךְ וּ/בְ/טֶ֛רֶם יִֽתְנַגְּפ֥וּ רַגְלֵי/כֶ֖ם עַל הָ֣רֵי נָ֑שֶׁף וְ/קִוִּיתֶ֤ם לְ/אוֹר֙ וְ/שָׂמָ֣/הּ לְ/צַלְמָ֔וֶת ישית לַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/016.yaml
  text: Give glory to Yahweh your God before he brings darkness[a], and before your feet stumble on the mountains at twilight. Then you will hope for light, but he will make it deep darkness; he will turn it into gloom.
translation:
  language: pt
  text: Deem glória a Javé, o Deus de vocês, antes que ele traga a escuridão e antes que os pés de vocês tropecem nos montes ao cair da tarde. Vocês esperarão pela luz, mas ele a transformará em trevas profundas[a] e a converterá em trevas espessas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradução tradicional, “sombra da morte”. O termo hebraico pode indicar tanto trevas mortais como trevas muito profundas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ ... כָּבוֹד
  choice: Deem glória
  rationale: A expressão hebraica combina o imperativo plural de נתן com כָּבוֹד no sentido idiomático de atribuir ou dar a Deus a glória que lhe é devida. “Deem glória” é natural, direto e preserva a força do imperativo.
- source_word: לַיהוָה
  choice: a Javé
  rationale: יהוה é o nome próprio divino; “Javé” o representa de forma reconhecível e corrente em português, sem substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Expressa de modo claro o substantivo com sufixo de segunda pessoa do plural e mantém a relação direta entre Deus e os ouvintes.
- source_word: יַחְשִׁךְ
  choice: ele traga a escuridão
  rationale: A forma causativa favorece a ideia de que Deus faz vir a escuridão. A formulação também se harmoniza com as ações divinas que vêm depois no versículo.
- source_word: יִתְנַגְּפוּ רַגְלֵיכֶם
  choice: os pés de vocês tropecem
  rationale: O verbo descreve os pés batendo contra algo ou tropeçando; “tropecem” comunica naturalmente o perigo de caminhar quando falta luz.
- source_word: עַל הָרֵי נָשֶׁף
  choice: nos montes ao cair da tarde
  rationale: נָשֶׁף designa o crepúsculo ou o anoitecer. A tradução entende a expressão como os montes vistos ou percorridos sob a luz que se apaga, sem tratá-la como nome de lugar.
- source_word: וְקִוִּיתֶם לְאוֹר
  choice: Vocês esperarão pela luz
  rationale: קוה inclui esperar com expectativa ou esperança. “Esperarão pela luz” conserva ambos os matizes de maneira natural no contexto.
- source_word: וְשָׂמָהּ לְצַלְמָוֶת
  choice: mas ele a transformará em trevas profundas
  rationale: O pronome retoma “luz”, e צַלְמָוֶת pode indicar escuridão extrema ou mortal. “Trevas profundas” comunica o sentido contextual, enquanto a tradução tradicional é preservada em nota.
- source_word: יָשִׁית לַעֲרָפֶל
  choice: e a tornará densa escuridão
  rationale: עֲרָפֶל denota escuridão espessa, obscuridade ou densas nuvens escuras. A redação mantém o paralelismo e a intensificação da imagem.
theological_decisions:
- issue: A ação divina na vinda da escuridão
  choice: Deus traz a escuridão e transforma a luz esperada em trevas.
  alternative: A escuridão apenas chega naturalmente, como o cair da noite.
  rationale: A forma causativa de יַחְשִׁךְ e os verbos seguintes favorecem Deus como agente. A tradução mantém a advertência profética de que a escuridão representa uma ação de juízo divino.
- issue: O referente do pronome em וְשָׂמָהּ
  choice: O pronome feminino retoma a luz esperada.
  alternative: O pronome poderia ser vertido de maneira menos explícita, sem indicar diretamente o referente.
  rationale: אוֹר é o antecedente imediato no discurso, e a sequência contrasta a luz esperada com as trevas que Deus produzirá.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com construção acessível ao leitor brasileiro. O plural “vocês” torna explícita a segunda pessoa plural do hebraico. “Ao cair da tarde” mantém a imagem do crepúsculo em linguagem corrente, e a repetição de termos ligados à escuridão preserva a intensificação poética do original.
