reference: Jeremiah 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ יִדְבַּ֨ק הָ/אֵז֜וֹר אֶל מָתְנֵי אִ֗ישׁ כֵּ֣ן הִדְבַּ֣קְתִּי אֵ֠לַ/י אֶת כָּל בֵּ֨ית יִשְׂרָאֵ֜ל וְ/אֶת כָּל בֵּ֤ית יְהוּדָה֙ נְאֻם יְהוָ֔ה לִֽ/הְי֥וֹת לִ/י֙ לְ/עָ֔ם וּ/לְ/שֵׁ֥ם וְ/לִ/תְהִלָּ֖ה וּ/לְ/תִפְאָ֑רֶת וְ/לֹ֖א שָׁמֵֽעוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/011.yaml
  text: For as the waistband clings to a man's waist[a], so I made the whole house of Israel and the whole house of Judah cling to me, declares Yahweh, to be for me a people, a name, a praise, and a glory[c][b], but they did not listen.
translation:
  language: pt
  text: Pois, assim como a faixa se apega à cintura de um homem[a], assim fiz com que toda a casa de Israel e toda a casa de Judá se apegassem a mim, declara Yahweh, para serem para mim um povo, um nome, um louvor e uma glória, mas eles não escutaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cinto”, “cinturão” ou, possivelmente, “pano de cintura”, referindo-se à peça usada ao redor da cintura.
    reason: lexical_alternative
  - marker: b
    text: “Não escutaram” também pode ter o sentido de “não obedeceram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵזוֹר
  choice: a faixa
  rationale: Designa a peça usada ao redor da cintura no contexto. “Faixa” é clara e concreta em português; “cinto” e, possivelmente, “tanga” permanecem alternativas lexicais.
- source_word: יִדְבַּק / הִדְבַּקְתִּי
  choice: se apega / fiz com que ... se apegassem
  rationale: Preserva tanto o contato físico estreito da peça com o corpo quanto a força relacional da metáfora; a forma causativa hebraica é expressa por “fiz com que”.
- source_word: מָתְנֵי אִישׁ
  choice: à cintura de um homem
  rationale: “Cintura” é natural no português moderno e mantém a imagem corporal; “um homem” representa o singular masculino do hebraico.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa diretamente a orientação e a vinculação relacional do texto.
- source_word: כָּל בֵּית יִשְׂרָאֵל וְאֶת כָּל בֵּית יְהוּדָה
  choice: toda a casa de Israel e toda a casa de Judá
  rationale: Mantém a linguagem corporativa e familiar de “casa”, bem como a repetição de כָּל.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade a fórmula profética e verte diretamente o nome divino.
- source_word: לִהְיוֹת לִי לְעָם
  choice: para serem para mim um povo
  rationale: Conserva a sintaxe e a ênfase hebraicas no pertencimento, sem substituí-las simplesmente por “meu povo”.
- source_word: לְשֵׁם
  choice: um nome
  rationale: Mantém o substantivo concreto e a sequência poética; no contexto, “nome” também sugere renome ou reputação.
- source_word: לִתְהִלָּה
  choice: um louvor
  rationale: Preserva a construção nominal paralela e o sentido básico do termo hebraico.
- source_word: לְתִפְאָרֶת
  choice: uma glória
  rationale: “Glória” comunica adequadamente honra e esplendor no propósito pactual expresso pelo versículo.
- source_word: וְלֹא שָׁמֵעוּ
  choice: mas eles não escutaram
  rationale: Mantém o sentido primário de ouvir com atenção e deixa presente a implicação de que não obedeceram; “mas” explicita o contraste.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Linguagem masculina representativa em מָתְנֵי אִישׁ
  choice: à cintura de um homem
  alternative: à cintura de uma pessoa
  rationale: A tradução conserva o singular masculino explícito da comparação hebraica sem ampliar nem restringir seu alcance representativo.
- issue: Estrutura da cláusula de propósito pactual
  choice: para serem para mim um povo, um nome, um louvor e uma glória
  alternative: para serem meu povo, meu renome, meu louvor e minha glória
  rationale: A formulação escolhida preserva a sequência compacta e a estrutura preposicional do hebraico, sem impor possessivos adicionais nem resolver “nome” exclusivamente como “renome”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a repetição de “toda a casa”, a metáfora de apego e a sequência nominal do propósito pactual. Os marcadores [a] e [b] aparecem no texto principal.
