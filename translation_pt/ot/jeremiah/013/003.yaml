  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֵלַ֖/י שֵׁנִ֥ית לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/003.yaml
  text: And the word of Yahweh came to me a second time[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim pela segunda vez, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Informa a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética וַיְהִי דְבַר־יְהוָה אֵלַי, o português idiomático expressa a ocorrência como “a palavra de Yahweh veio a mim”, sem reproduzir de modo artificial o literal “e aconteceu/foi”.
- source_word: דְבַר
  choice: a palavra
  rationale: “Palavra” corresponde diretamente ao substantivo hebraico e preserva a fórmula estabelecida para a revelação profética, sem reduzi-la apenas a “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: 'A preposição com o sufixo de primeira pessoa indica diretamente o destinatário da palavra divina: Jeremias.'
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Expressa explicitamente a repetição indicada pelo advérbio hebraico e soa natural em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso divino subsequente; os dois-pontos sinalizam que a fala continua no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título tradicional “SENHOR”; “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem é natural, e “dizendo:” mantém a ligação formal com a fala que segue. O marcador foi colocado imediatamente após “Yahweh”, o termo ao qual a nota se refere.
