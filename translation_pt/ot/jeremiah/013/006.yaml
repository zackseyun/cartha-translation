id: JER.13.6
reference: Jeremiah 13:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ יָמִ֣ים רַבִּ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֚וּם לֵ֣ךְ פְּרָ֔תָ/ה וְ/קַ֤ח מִ/שָּׁם֙ אֶת הָ֣/אֵז֔וֹר אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/טָמְנ/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/006.yaml
  text: And it happened after many days that Yahweh said to me[a], “Arise, go to Perath[c][b], and take from there the waistband that I commanded you to hide there.”
translation:
  language: pt
  text: 'E aconteceu, depois de muitos dias, que Yahweh me disse: “Levante-se, vá a Perate[a] e pegue de lá o cinto[b] que eu lhe ordenei que escondesse ali[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perate pode se referir ao Eufrates; o nome hebraico foi transliterado no texto, sem decidir a identificação.
    reason: alternative_reading
  - marker: b
    text: Ou “pano de cintura” ou “faixa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “enterrasse ali”; o verbo hebraico pode significar esconder ou ocultar, às vezes enterrando.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: Reproduz a abertura narrativa do hebraico sem recorrer à fórmula mais arcaica “E sucedeu”.
- source_word: מִקֵּץ יָמִים רַבִּים
  choice: depois de muitos dias
  rationale: Expressa de modo natural o sentido temporal literal, preservando a ideia de um intervalo prolongado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém como nome próprio o tetragrama hebraico, em vez de substituí-lo por um título.
- source_word: קוּם לֵךְ
  choice: Levante-se, vá
  rationale: Conserva os dois imperativos e seu movimento urgente em português atual.
- source_word: פְּרָתָה
  choice: a Perate
  rationale: Translitera o topônimo hebraico e preserva no texto a incerteza sobre sua identificação com o Eufrates.
- source_word: וְקַח מִשָּׁם
  choice: e pegue de lá
  rationale: Tradução direta e idiomática do imperativo seguido do advérbio de origem.
- source_word: הָאֵזוֹר
  choice: o cinto
  rationale: Designa de maneira clara uma peça usada ao redor da cintura, sem especificar excessivamente sua forma.
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: que eu lhe ordenei
  rationale: Preserva a força autoritativa de צוה e liga naturalmente a oração ao objeto mencionado.
- source_word: לְטָמְנוֹ שָׁם
  choice: que escondesse ali
  rationale: Mantém o sentido amplo de ocultar; a possibilidade mais específica de enterrar fica registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o nome divino. A forma “Yahweh” o preserva como nome pessoal, sem substituí-lo por “SENHOR” nem escolher a vocalização tradicional “Jeová”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para leitores brasileiros. Emprega “lhe” para evitar regionalizar o discurso com “te” ou repetir “você”. A pontuação integra a fórmula narrativa hebraica a uma frase corrente em português.
source_grounding:
  english_pob_role: consult_only
