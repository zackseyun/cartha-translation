base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/020.yaml
  text: Lift up your eyes and see those who are coming from the north. Where is the flock that was given to you[a], your beautiful sheep?
translation:
  language: pt
  text: Erga os olhos e veja os que vêm do norte. Onde está o rebanho que lhe foi dado, suas belas ovelhas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas ovelhas gloriosas”. A expressão hebraica pode indicar beleza, esplendor ou glória.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שאי עֵינֵיכם
  choice: Erga os olhos
  rationale: A expressão idiomática hebraica combina o imperativo feminino singular com “olhos” e significa levantar o olhar. “Erga os olhos” conserva a imagem concreta e soa natural em português; a oscilação de número no hebraico não precisa ser reproduzida.
- source_word: וראי
  choice: e veja
  rationale: Imperativo feminino singular de ראה. “Veja” preserva a forma de ordem e concorda com o destinatário singular sugerido pelo contexto.
- source_word: הבאים מצפון
  choice: os que vêm do norte
  rationale: O particípio substantivado indica pessoas que se aproximam. A formulação mantém tanto o movimento em curso quanto a referência geográfica, sem explicitar que se trata de invasores.
- source_word: איה העדר
  choice: Onde está o rebanho
  rationale: Tradução direta da pergunta locativa e do substantivo pastoral עדר.
- source_word: נתן לך
  choice: que lhe foi dado
  rationale: Mantém a voz passiva do hebraico e a ideia de que o rebanho foi entregue ou confiado à destinatária.
- source_word: צאן תפארתך
  choice: as ovelhas que eram o seu esplendor
  rationale: צאן é vertido por “ovelhas”, evitando repetir “rebanho”. תפארת pode indicar beleza, esplendor ou glória; a construção nominal “seu esplendor” conserva melhor essa amplitude e a força do hebraico do que um simples adjetivo.
theological_decisions:
- issue: Referente metafórico do rebanho
  choice: Manter a metáfora pastoral sem identificar seu referente no texto principal.
  alternative: Explicitar que o rebanho representa o povo de Judá, os habitantes de Jerusalém ou os súditos confiados aos governantes.
  rationale: O hebraico não desfaz a metáfora. Identificar o rebanho na tradução restringiria uma imagem que o próprio versículo deixa aberta.
- issue: Valor de תפארתך
  choice: Traduzir como “o seu esplendor”, preservando o valor positivo e honorífico do rebanho.
  alternative: “suas belas ovelhas” ou “as ovelhas da sua glória”.
  rationale: “Esplendor” abrange beleza, magnificência e glória sem impor uma leitura doutrinária e se liga naturalmente, por oração relativa, às ovelhas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” realizado por formas de terceira pessoa (“erga”, “veja”, “lhe”, “seu”). A metáfora e o tom retórico foram preservados; evitou-se tornar explícita a identidade dos que vêm do norte.
