id: JER.13.4
reference: Jeremiah 13:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קַ֧ח אֶת הָ/אֵז֛וֹר אֲשֶׁ֥ר קָנִ֖יתָ אֲשֶׁ֣ר עַל מָתְנֶ֑י/ךָ וְ/קוּם֙ לֵ֣ךְ פְּרָ֔תָ/ה וְ/טָמְנֵ֥/הוּ שָׁ֖ם בִּ/נְקִ֥יק הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/004.yaml
  text: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
translation:
  language: pt
  text: Pegue a faixa que você comprou, a que está em sua cintura, levante-se, vá a Perate[a] e esconda-a ali numa fenda da rocha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perate é tradicionalmente identificado com o rio Eufrates; por isso, muitas traduções trazem “o Eufrates”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵזוֹר
  choice: faixa
  rationale: Designa uma peça usada em torno da cintura. “Faixa” é natural em português e evita especificar excessivamente “cinto” ou “tanga”.
- source_word: קָנִיתָ
  choice: você comprou
  rationale: O verbo pode significar comprar ou adquirir; o contexto narrativo favorece o sentido concreto de compra.
- source_word: עַל מָתְנֶיךָ
  choice: em sua cintura
  rationale: Expressa de modo claro e atual a região corporal indicada, sem recorrer ao menos natural “lombos”.
- source_word: וְקוּם
  choice: levante-se
  rationale: Mantém a sequência imperativa e o tom digno em português corrente.
- source_word: פְּרָתָה
  choice: a Perate
  rationale: Preserva o topônimo hebraico por transliteração, sem resolver no texto principal sua identificação tradicional com o Eufrates.
- source_word: טָמְנֵהוּ
  choice: esconda-a
  rationale: Traduz o sentido amplo de ocultar sem acrescentar a ideia específica de enterrar.
- source_word: נְקִיק
  choice: fenda
  rationale: Equivalente português natural para uma abertura ou fissura na rocha.
- source_word: הַסָּלַע
  choice: da rocha
  rationale: Tradução direta e idiomática do substantivo no contexto de uma fenda rochosa.
theological_decisions:
- issue: Identificação de פְּרָתָה
  choice: Manter “Perate” no texto principal
  alternative: o Eufrates
  rationale: A forma hebraica é preservada como topônimo, enquanto a identificação tradicional, relevante mas discutida, é indicada em nota para não eliminar a ambiguidade geográfica.
translation_notes:
  register: Português moderno, claro e digno, com construção imperativa natural. O pronome feminino em “esconda-a” retoma “faixa”. O topônimo foi transliterado como “Perate”, forma legível em português.
