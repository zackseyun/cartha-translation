  text: וָ/אֶקְנֶ֥ה אֶת הָ/אֵז֖וֹר כִּ/דְבַ֣ר יְהוָ֑ה וָ/אָשִׂ֖ם עַל מָתְנָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/002.yaml
  text: So I bought the loincloth according to the word of Yahweh[a], and put it on my waist.
translation:
  language: pt
  text: Então comprei a faixa[a], conforme a palavra de Yahweh, e a coloquei em volta da cintura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cinto” ou “pano de cintura”; o termo hebraico indica uma peça usada junto ao corpo, na região da cintura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: Então comprei
  rationale: O wayyiqtol de קנה dá continuidade à sequência narrativa. “Então” liga naturalmente a ação à ordem recebida no versículo anterior, e “comprei” expressa o sentido comum do verbo.
- source_word: הָאֵזוֹר
  choice: a faixa
  rationale: אֵזוֹר designa uma peça usada junto à cintura, podendo ser uma faixa, um cinto ou um pano de cintura. “Faixa” é clara e digna em português e mantém a amplitude lexical sem sugerir apenas um acessório moderno.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: 'Preserva de modo natural o sentido formal da expressão hebraica: Jeremias agiu em conformidade com a ordem divina.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וָאָשִׂם עַל מָתְנָי
  choice: e a coloquei em volta da cintura
  rationale: שׂים significa pôr ou colocar, e מָתְנַיִם refere-se à cintura ou aos lombos. “Em volta da cintura” é a formulação natural em português para o uso dessa peça.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com sequência narrativa natural. A nota preserva a variedade de sentidos de אֵזוֹר sem definir com excesso de precisão o formato da peça.
