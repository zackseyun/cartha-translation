id: JER.13.9
reference: Jeremiah 13:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה כָּ֠כָה אַשְׁחִ֞ית אֶת גְּא֧וֹן יְהוּדָ֛ה וְ/אֶת גְּא֥וֹן יְרוּשָׁלִַ֖ם הָ/רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/009.yaml
  text: 'Thus says Yahweh: In this way I will ruin the pride of Judah and the great pride of Jerusalem[a][b].'
translation:
  language: pt
  text: 'Assim diz Yahweh: Do mesmo modo, arruinarei o orgulho de Judá e o grande orgulho de Jerusalém[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruirei” ou “estragarei”. O verbo hebraico pode indicar arruinar, estragar ou destruir; “arruinarei” se ajusta à imagem imediata do cinto estragado neste capítulo.
    reason: lexical_alternative
  - marker: b
    text: “Orgulho” também pode ser entendido como “soberba” ou, com menor probabilidade neste contexto, “majestade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz com naturalidade e dignidade a fórmula profética de mensageiro, mantendo sua cadência solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּכָה
  choice: Do mesmo modo
  rationale: Remete à ação simbólica do cinto arruinado no contexto e distingue este advérbio da fórmula inicial כֹּה אָמַר.
- source_word: אַשְׁחִית
  choice: arruinarei
  rationale: O hifil de שׁחת pode indicar estragar, arruinar ou destruir. “Arruinarei” mantém a ligação com o cinto estragado sem impor o sentido mais forte de aniquilação.
- source_word: גְּאוֹן
  choice: orgulho
  rationale: Conserva a amplitude do termo, que aqui provavelmente tem sentido negativo de soberba, mas também pode evocar grandeza ou exaltação.
- source_word: גְּאוֹן יְהוּדָה
  choice: o orgulho de Judá
  rationale: Representa diretamente a cadeia construta e preserva o paralelismo com a expressão seguinte.
- source_word: גְּאוֹן יְרוּשָׁלִַם הָרָב
  choice: o grande orgulho de Jerusalém
  rationale: Mantém a intensificação de הָרָב e a ordem semântica do hebraico em português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido de גְּאוֹן no anúncio de juízo
  choice: orgulho
  alternative: soberba; majestade
  rationale: O contexto de juízo favorece o sentido negativo, mas “orgulho” preserva melhor a possível tensão entre arrogância e condição exaltada.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição de “orgulho” preserva o paralelismo hebraico; “Do mesmo modo” conecta explicitamente o juízo à ação simbólica do contexto.
