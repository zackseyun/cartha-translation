  source_fidelity: A tradução preserva a imagem de humilhação por exposição, mas «Por isso» introduz uma relação conclusiva que não está no hebraico. וְגַם significa «e/também» e, com o pronome explícito, enfatiza «também eu». Além disso, «ficou exposta» interpreta aceitavelmente o resultado, porém «foi vista» reproduz mais diretamente o nifal נִרְאָה.
  naturalness: «Também eu levantei...» é moderno, claro e conserva a ênfase sem a inferência indevida de «Por isso». «As barras da tua veste» e «sobre o teu rosto» mantêm a imagem concreta em português compreensível.
  terminology: «Vergonha» traduz adequadamente קָלוֹן no contexto de desonra pública. O tratamento na segunda pessoa («tua/teu») conserva o destinatário feminino singular do hebraico e evita a ambiguidade referencial de «sua/seu».
