base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/026.yaml
  text: So I myself have also lifted up your skirts over your face[c][b][a], and your shame has been seen.
translation:
  language: pt
  text: Também eu levantei as barras da tua veste sobre o teu rosto[a][b], e a tua vergonha foi vista.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “descobri as barras da tua veste sobre o teu rosto”. O verbo hebraico significa descobrir ou expor; “levantei” traduz de modo idiomático o gesto descrito.'
    reason: lexical_alternative
  - marker: b
    text: A imagem retrata humilhação pública por meio de exposição forçada, como metáfora profética da desonra sob o juízo.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Por isso, eu também
  rationale: Dá continuidade à declaração de juízo e conserva a ênfase do pronome explícito, com ordem natural em português.
- source_word: חָשַׂפְתִּי
  choice: ergui
  rationale: O verbo significa descobrir ou expor; com as barras da veste como objeto, “ergui” comunica naturalmente o gesto concreto que produz a exposição.
- source_word: שׁוּלַיִךְ
  choice: as barras de sua veste
  rationale: Refere-se às extremidades inferiores da roupa. “Barras” preserva a imagem do vestuário sem recorrer a termos arcaicos.
- source_word: עַל פָּנַיִךְ
  choice: por cima do seu rosto
  rationale: Mantém o sentido espacial e a imagem vívida da veste erguida sobre o rosto.
- source_word: וְנִרְאָה קְלוֹנֵךְ
  choice: e a sua vergonha ficou exposta
  rationale: 'Expressa o valor passivo e resultativo do nifal: a vergonha tornou-se visível. “Ficou exposta” é mais natural em português que uma reprodução rígida de “foi vista”.'
theological_decisions:
- issue: Exposição pública como imagem do juízo divino
  choice: Conservar a imagem concreta da veste erguida e da vergonha exposta
  alternative: Suavizar a linguagem para uma afirmação geral de desonra
  rationale: O hebraico emprega deliberadamente uma imagem forte de exposição e humilhação pública para representar o juízo. Suavizá-la reduziria a força da denúncia profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem forte do hebraico sem arcaísmo nem suavização; “veste” mantém um registro bíblico corrente, e “barras” esclarece a parte da roupa em questão.
