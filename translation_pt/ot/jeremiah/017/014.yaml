  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְפָאֵ֤/נִי יְהוָה֙ וְ/אֵ֣רָפֵ֔א הוֹשִׁיעֵ֖/נִי וְ/אִוָּשֵׁ֑עָה כִּ֥י תְהִלָּתִ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/014.yaml
  text: Heal me[a], O Yahweh, and I will be healed; save me, and I will be saved[b], for you are my praise.
translation:
  language: pt
  text: Cura-me, ó Yahweh, e serei curado; salva-me[a], e serei salvo, pois tu és o meu louvor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livra-me”; o verbo hebraico pode indicar resgate ou livramento, além de salvação em sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “pois tu és aquele a quem louvo”. Literalmente: “pois tu és o meu louvor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאֵנִי
  choice: Cura-me
  rationale: O imperativo de רפא com sufixo de primeira pessoa é traduzido diretamente, preservando tanto a ideia de cura física quanto possíveis sentidos figurados, sem especificá-los.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאֵרָפֵא
  choice: e serei curado
  rationale: A forma nifal expressa o resultado da ação pedida e mantém o paralelismo conciso do hebraico.
- source_word: הוֹשִׁיעֵנִי
  choice: salva-me
  rationale: O hifil imperativo de ישׁע abrange salvação, socorro e livramento. “Salva-me” conserva essa amplitude sem restringir o pedido a um tipo específico de perigo.
- source_word: וְאִוָּשֵׁעָה
  choice: e serei salvo
  rationale: A forma nifal corresponde ao imperativo anterior e reproduz o paralelismo entre o pedido e seu resultado.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, o fundamento da súplica e confissão.
- source_word: תְהִלָּתִי
  choice: o meu louvor
  rationale: Traduz literalmente o substantivo תְהִלָּה com sufixo possessivo, preservando a expressão compacta e poeticamente aberta do hebraico.
- source_word: אָתָּה
  choice: tu és
  rationale: O pronome independente é mantido para transmitir a ênfase pessoal do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; sua transliteração preserva essa característica e evita substituí-lo por um título.
- issue: Amplitude de ישׁע
  choice: salva-me / serei salvo
  alternative: livra-me / serei liberto
  rationale: “Salvar” mantém tanto a possibilidade de socorro em uma situação concreta quanto o alcance teológico mais amplo do verbo, sem resolver a ambiguidade do contexto.
- issue: Sentido de תְהִלָּתִי
  choice: tu és o meu louvor
  alternative: tu és aquele a quem louvo
  rationale: A formulação literal conserva a metáfora e a concisão hebraicas; a alternativa explicita uma relação que o original deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. O pronome “tu” combina naturalmente com “Yahweh” no vocativo e mantém a ênfase do original. A colocação pronominal enclítica é corrente e apropriada ao registro de oração poética.
