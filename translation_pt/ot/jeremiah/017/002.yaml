id: JER.17.2
reference: Jeremiah 17:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ/זְכֹּ֤ר בְּנֵי/הֶם֙ מִזְבְּחוֹתָ֔/ם וַ/אֲשֵׁרֵי/הֶ֖ם עַל עֵ֣ץ רַֽעֲנָ֑ן עַ֖ל גְּבָע֥וֹת הַ/גְּבֹהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/002.yaml
  text: As their children remember their altars and their Asherim beside every green tree[a], on the high hills,
translation:
  language: pt
  text: Enquanto seus filhos se lembram dos seus altares e dos seus aserins junto às árvores verdejantes[a], nas colinas elevadas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus postes de Aserá” ou “seus postes sagrados”. O termo hebraico se refere a objetos de culto associados a Aserá.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Enquanto
  rationale: Introduz uma circunstância ligada ao versículo anterior. “Enquanto” comunica a ação concomitante sem impor uma relação causal mais forte do que o hebraico exige.
- source_word: זְכֹּר
  choice: se lembram
  rationale: Traduz diretamente a ideia de recordar; em português, a construção pronominal “lembrar-se de” é natural com os objetos seguintes.
- source_word: בְּנֵיהֶם
  choice: seus filhos
  rationale: בנים pode designar filhos ou descendentes em sentido amplo; “filhos” preserva essa amplitude contextual sem restringir a referência a homens.
- source_word: מִזְבְּחוֹתָם
  choice: seus altares
  rationale: Mantém o sentido cultual direto e o sufixo possessivo.
- source_word: וַאֲשֵׁרֵיהֶם
  choice: seus aserins
  rationale: A transliteração adaptada do plural hebraico preserva a ambiguidade quanto à forma exata desses objetos de culto associados a Aserá; a nota explica alternativas mais específicas.
- source_word: עַל
  choice: junto a
  rationale: Neste contexto de locais de culto, a preposição indica proximidade ou localização, não necessariamente posição física sobre as árvores.
- source_word: עֵץ רַעֲנָן
  choice: árvores verdejantes
  rationale: O singular hebraico pode ter valor coletivo. “Verdejantes” expressa árvores viçosas e frondosas, preservando a imagem cultual recorrente.
- source_word: עַל גְּבָעוֹת הַגְּבֹהוֹת
  choice: nas colinas elevadas
  rationale: Reproduz de modo natural tanto a localização topográfica quanto a associação com lugares altos de culto.
theological_decisions:
- issue: Sentido de אֲשֵׁרִים no contexto de idolatria
  choice: seus aserins
  alternative: seus postes de Aserá; seus postes sagrados
  rationale: O termo pode indicar objetos cultuais associados à deusa Aserá, possivelmente postes ou representações de madeira. A transliteração evita definir além da evidência textual a natureza precisa desses objetos.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe ligada ao versículo anterior. A vírgula final foi mantida porque o versículo forma uma unidade incompleta que continua no contexto. “Aserins” é uma forma transliterada deliberadamente técnica, esclarecida em nota.
