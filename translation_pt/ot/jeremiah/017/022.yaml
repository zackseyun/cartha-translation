  text: וְ/לֹא תוֹצִ֨יאוּ מַשָּׂ֤א מִ/בָּֽתֵּי/כֶם֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וְ/כָל מְלָאכָ֖ה לֹ֣א תַֽעֲשׂ֑וּ וְ/קִדַּשְׁתֶּם֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת כַּ/אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/022.yaml
  text: Do not carry a load out of your houses on the Sabbath day[a], and do not do any work, but sanctify the Sabbath day[b], just as I commanded your fathers.
translation:
  language: pt
  text: Não tirem carga alguma de suas casas no dia de sábado[a], nem façam trabalho algum, e santifiquem o dia de sábado, como ordenei a seus pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não levem carga alguma para fora de suas casas”.'
    reason: lexical_alternative
  - marker: b
    text: “Seus pais” refere-se às gerações anteriores de Israel às quais Deus deu essa ordem.
    reason: cultural_note
lexical_decisions:
- source_word: תוֹצִיאוּ
  choice: tirem ... de
  rationale: O hifil de יצא indica fazer sair, isto é, tirar ou levar para fora. Com מַשָּׂא, a formulação expressa naturalmente a retirada física de uma carga da casa.
- source_word: מַשָּׂא
  choice: carga alguma
  rationale: O substantivo designa algo transportado. “Carga” preserva o sentido concreto ligado ao transporte, e “alguma” funciona naturalmente sob a negação portuguesa.
- source_word: מִבָּתֵּיכֶם
  choice: de suas casas
  rationale: A preposição מן marca origem ou procedência; com “tirem”, “de suas casas” é claro e idiomático.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: Mantém a referência explícita ao “dia” e usa a forma corrente em português para o sábado bíblico.
- source_word: מְלָאכָה
  choice: trabalho
  rationale: No contexto das prescrições sabáticas, refere-se ao trabalho ou atividade proibida nesse dia.
- source_word: וְקִדַּשְׁתֶּם
  choice: santifiquem
  rationale: Traduz diretamente o piel de קדש, que significa separar ou tratar como santo, preservando o teor cultual e teológico do verbo.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz a conformidade com a ordem divina anterior; “como” é natural e suficiente em português.
- source_word: צִוִּיתִי
  choice: ordenei
  rationale: Equivalente direto e corrente da primeira pessoa singular de צוה.
- source_word: אֲבוֹתֵיכֶם
  choice: seus pais
  rationale: Preserva o termo masculino de parentesco do hebraico, que neste contexto se refere às gerações anteriores de Israel.
theological_decisions:
- issue: Linguagem da santificação do sábado
  choice: santifiquem o dia de sábado
  alternative: mantenham santo o dia de sábado; tratem o dia de sábado como santo
  rationale: “Santifiquem” reflete mais diretamente וְקִדַּשְׁתֶּם e conserva a ideia de separar o dia como santo, sem especificar além do que o texto afirma.
- issue: Termo ancestral masculino
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução mantém o substantivo masculino אֲבוֹתֵיכֶם, enquanto a nota esclarece que a referência abrange as gerações anteriores de Israel.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa plural hebraica foi vertida por formas de terceira pessoa plural (“tirem”, “façam”, “santifiquem”), naturais no português brasileiro amplo. “Em vez disso” explicita de modo idiomático o contraste do waw antes da ordem positiva, sem alterar sua relação com as proibições anteriores.
