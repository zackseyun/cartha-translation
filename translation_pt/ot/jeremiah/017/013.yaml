id: JER.17.13
reference: Jeremiah 17:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִקְוֵ֤ה יִשְׂרָאֵל֙ יְהוָ֔ה כָּל עֹזְבֶ֖י/ךָ יֵבֹ֑שׁוּ יסור/י בָּ/אָ֣רֶץ יִכָּתֵ֔בוּ כִּ֥י עָזְב֛וּ מְק֥וֹר מַֽיִם חַיִּ֖ים אֶת יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/013.yaml
  text: O Yahweh[a], the hope of Israel, all who forsake you will be put to shame; those who turn away from you will be written in the earth, because they have forsaken Yahweh[c][b], the fountain of living waters.
translation:
  language: pt
  text: Ó Yahweh, esperança de Israel, todos os que te abandonam serão envergonhados; os que se afastam de mim[a] serão escritos na terra[b], porque abandonaram Yahweh, a fonte de águas vivas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que se afastam de ti”. O texto hebraico neste ponto é difícil; o texto principal conserva a leitura em primeira pessoa da tradição massorética.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “no país” ou “no solo”. A frase pode evocar uma inscrição passageira feita na terra, em contraste com uma lembrança duradoura.'
    reason: lexical_alternative
  - marker: c
    text: “Águas vivas” são águas frescas e correntes de uma nascente, não águas paradas.
    reason: cultural_note
lexical_decisions:
- source_word: מִקְוֵה
  choice: esperança
  rationale: Como título de Yahweh em relação a Israel, o sentido figurado “esperança” é o mais adequado; evita o sentido concreto de reservatório ou ajuntamento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de um título como “Senhor”.
- source_word: עֹזְבֶיךָ
  choice: os que te abandonam
  rationale: Expressa de modo natural a ação característica do particípio e conserva a força relacional de עזב.
- source_word: יֵבֹשׁוּ
  choice: serão envergonhados
  rationale: Comunica a desonra resultante do juízo, não apenas um sentimento interior de vergonha.
- source_word: יסורי
  choice: os que se afastam de mim
  rationale: Mantém a leitura em primeira pessoa associada à tradição massorética e preserva a mudança de pessoa, sem harmonizá-la silenciosamente com “te abandonam”.
- source_word: בארץ
  choice: na terra
  rationale: Preserva a imagem de uma inscrição feita na terra; “terra” também mantém a possível referência à região ou ao solo.
- source_word: יִכָּתֵבוּ
  choice: serão escritos
  rationale: Reproduz diretamente a forma passiva e mantém transparente a metáfora da inscrição.
- source_word: מְקוֹר מַיִם חַיִּים
  choice: a fonte de águas vivas
  rationale: “Fonte” representa o manancial ou origem, enquanto o plural “águas vivas” acompanha de perto o hebraico e preserva sua ressonância metafórica.
- source_word: חַיִּים
  choice: vivas
  rationale: Conserva a expressão literal, que no contexto designa água fresca e corrente, sem reduzir sua força poética e teológica.
theological_decisions:
- issue: Mudança de pessoa em “os que se afastam de mim”
  choice: Conservar “de mim” no texto principal
  alternative: “os que se afastam de ti”
  rationale: O texto apresenta dificuldade textual, mas a primeira pessoa deve ser mantida para preservar a tensão entre a fala dirigida a Yahweh e a possível voz de Yahweh ou de seu representante, em vez de harmonizar a passagem.
- issue: Sentido de “águas vivas”
  choice: Manter a expressão metafórica literal
  alternative: “água corrente” ou “águas frescas”
  rationale: A expressão denota água de nascente, fresca e corrente, mas sua forma literal carrega uma dimensão poética e teológica que não deve ser eliminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o paralelismo poético, o nome divino e a dificuldade textual da mudança entre segunda e primeira pessoa.
