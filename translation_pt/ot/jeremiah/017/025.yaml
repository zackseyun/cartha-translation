  text: וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הָ/עִ֣יר הַ/זֹּ֡את מְלָכִ֣ים וְ/שָׂרִ֡ים יֹשְׁבִים֩ עַל כִּסֵּ֨א דָוִ֜ד רֹכְבִ֣ים בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֗ים הֵ֚מָּה וְ/שָׂ֣רֵי/הֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/יָשְׁבָ֥ה הָֽ/עִיר הַ/זֹּ֖את לְ/עוֹלָֽם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/025.yaml
  text: then kings and officials will enter through the gates of this city[a], sitting on the throne of David, riding in chariots and on horses—they and their officials, the men of Judah and the inhabitants of Jerusalem—and this city will be inhabited forever.
translation:
  language: pt
  text: Então entrarão pelos portões desta cidade reis e autoridades que se assentam no trono de Davi, montados em carros e a cavalo — eles e suas autoridades, os homens de Judá[a] e os habitantes de Jerusalém — e esta cidade será habitada para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o povo de Judá”. O hebraico diz literalmente “homem de Judá”, em sentido coletivo.
    reason: Alternativa lexical que esclarece o singular coletivo hebraico e sua possível tradução mais abrangente.
lexical_decisions:
- source_word: וּבָאוּ בְשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: Então entrarão pelos portões desta cidade
  rationale: A conjunção dá continuidade à consequência condicional do versículo anterior; “então” explicita naturalmente essa relação. Com בוא e ב, “entrar pelos portões” expressa o movimento de ingresso na cidade.
- source_word: מְלָכִים וְשָׂרִים
  choice: reis e autoridades
  rationale: שָׂרִים designa dirigentes ou altos oficiais. “Autoridades” é atual, amplo e não sugere necessariamente nobreza hereditária.
- source_word: יֹשְׁבִים עַל כִּסֵּא דָוִד
  choice: que se assentam no trono de Davi
  rationale: Mantém a imagem concreta do texto hebraico e sua referência dinástica, ligando o particípio plural aos reis e autoridades mencionados.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: seguindo em carros e a cavalo
  rationale: A formulação distingue de modo idiomático o deslocamento em carros do deslocamento montado em cavalos, sem criar a impressão anacrônica de automóveis.
- source_word: הֵמָּה וְשָׂרֵיהֶם
  choice: eles e suas autoridades
  rationale: Preserva o pronome enfático e retomador, bem como a repetição de שרים, mantendo coerência lexical.
- source_word: אִישׁ יְהוּדָה
  choice: os homens de Judá
  rationale: Embora אִישׁ esteja no singular, a expressão tem sentido coletivo. “Os homens de Judá” conserva a forma masculina do hebraico; a nota registra a alternativa coletiva mais abrangente.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלָ͏ִם
  choice: e os habitantes de Jerusalém
  rationale: Expressão coletiva natural e digna para os residentes da cidade.
- source_word: וְיָשְׁבָה הָעִיר הַזֹּאת
  choice: e esta cidade será habitada
  rationale: Quando uma cidade é o sujeito de ישב, o sentido é permanecer povoada ou habitada, não que a própria cidade “habite”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente português corrente que comunica continuidade duradoura no contexto da bênção da aliança.
theological_decisions:
- issue: Referência dinástica no “trono de Davi”
  choice: Manter explicitamente “trono de Davi”.
  alternative: Parafrasear como “governo legítimo” ou “trono davídico”.
  rationale: A expressão contém significado real e pactual próprio e deve permanecer transparente, sem receber expansão cristológica nem ser reduzida a uma ideia genérica de governo.
- issue: Gênero e valor coletivo de אִישׁ יְהוּדָה
  choice: Usar “os homens de Judá” no texto principal.
  alternative: “O povo de Judá”.
  rationale: O hebraico emprega o substantivo masculino singular de modo coletivo. A tradução principal preserva essa forma, enquanto a nota informa a alternativa coletiva sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. A ordem da frase preserva a entrada cerimonial pelos portões e a longa enumeração hebraica; travessões ajudam a tornar clara a retomada parentética sem eliminar sua estrutura.
