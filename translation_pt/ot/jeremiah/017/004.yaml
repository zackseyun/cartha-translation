base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/004.yaml
  text: And you[a] yourself will let go of your inheritance that I gave you, and I will make you serve your enemies in a land that you have not known; for you have kindled a fire in my anger[d][c][b]—it will burn forever.
translation:
  language: pt
  text: E você mesmo abrirá mão da herança que eu lhe dei[a]. Farei com que você sirva aos seus inimigos numa terra que você nunca conheceu, pois vocês acenderam um fogo na minha ira[b][c]; ele arderá para sempre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você soltará/deixará escapar a sua herança”. O verbo hebraico traz a imagem de soltar, deixar cair ou renunciar.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa do singular (“você”) para o plural (“vocês acenderam”), provavelmente mudando de Judá personificado para o povo em conjunto.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “no meu furor”. Literalmente, “no meu nariz”, expressão idiomática hebraica para ira.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “por uma era” ou “continuamente”. O termo hebraico עוֹלָם pode indicar duração permanente ou indefinidamente longa, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַטְתָּה וּבְךָ
  choice: E você mesmo abrirá mão
  rationale: שׁמט expressa soltar, deixar cair ou renunciar; “abrirá mão” comunica em português atual a perda ou renúncia forçada da posse. “Você mesmo” conserva a ênfase difícil de וּבְךָ sem impor uma ideia instrumental como “por si mesmo”.
- source_word: מִנַּחֲלָתְךָ
  choice: da herança
  rationale: נחלה designa herança ou posse hereditária e, aqui, inclui a terra concedida por Deus. “Herança” mantém tanto o sentido territorial quanto o pactual.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: que eu lhe dei
  rationale: Tradução direta e natural de נתן, preservando Deus como doador da herança.
- source_word: וְהַעֲבַדְתִּיךָ אֶת אֹיְבֶיךָ
  choice: Farei com que você sirva aos seus inimigos
  rationale: A forma causativa de עבד significa fazer alguém servir. A formulação mantém a causatividade e o destinatário singular.
- source_word: בָּאָרֶץ אֲשֶׁר לֹא יָדָעְתָּ
  choice: numa terra que você não conhece
  rationale: ידע indica conhecimento ou familiaridade pela experiência. A formulação idiomática apresenta a terra estrangeira como desconhecida do destinatário.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do juízo e conecta naturalmente as orações em registro profético.
- source_word: אֵשׁ קְדַחְתֶּם
  choice: vocês acenderam um fogo
  rationale: קדח descreve acender ou atear fogo. “Vocês” torna audível a mudança do singular para o plural no hebraico.
- source_word: בְּאַפִּי
  choice: na minha ira
  rationale: אַף significa literalmente nariz ou narina, mas funciona como expressão idiomática de ira. “Na minha ira” preserva a construção e sua força sem literalismo obscuro.
- source_word: עַד עוֹלָם תּוּקָד
  choice: ele arderá para sempre
  rationale: O pronome retoma “fogo”; a forma passiva/imperfectiva de יקד descreve sua combustão contínua. “Para sempre” expressa a duração aberta e duradoura de עוֹלָם no anúncio de juízo.
theological_decisions:
- issue: Mudança da segunda pessoa do singular para o plural
  choice: Manter “você” nas primeiras orações e “vocês” na acusação final.
  alternative: Uniformizar todo o versículo no singular ou no plural.
  rationale: O hebraico passa deliberadamente do destinatário singular, possivelmente Judá personificado, ao povo coletivamente. A tradução conserva essa tensão retórica sem harmonizá-la.
- issue: Duração expressa por עַד עוֹלָם
  choice: Traduzir “para sempre” no texto principal.
  alternative: “Por uma era”, “continuamente” ou “por tempo indefinido”.
  rationale: No contexto do juízo profético, a expressão comunica duração persistente e sem término indicado. A nota registra a amplitude lexical sem enfraquecer o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento “você/vocês” permite reproduzir claramente a mudança de número do hebraico. “Abrir mão” é idiomático sem eliminar a imagem de relinquimento, explicitada na nota. A pontuação separa o anúncio da perda, a servidão e sua causa, mantendo a solenidade profética.
