  text: עָקֹ֥ב הַ/לֵּ֛ב מִ/כֹּ֖ל וְ/אָנֻ֣שׁ ה֑וּא מִ֖י יֵדָעֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/009.yaml
  text: The heart is more deceitful than anything else[c][b][a], and desperately sick—who can know it?
translation:
  language: pt
  text: O coração[c] é mais enganoso do que qualquer outra coisa[a] e está gravemente doente[b] — quem pode conhecê-lo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O coração é enganoso acima de todas as coisas.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é incurável”. O termo hebraico descreve algo gravemente enfermo ou sem remédio.'
    reason: lexical_alternative
  - marker: c
    text: No hebraico, “coração” se refere ao ser interior, incluindo pensamento, vontade e desejos, não apenas emoções.
    reason: cultural_note
lexical_decisions:
- source_word: עָקֹב
  choice: enganoso
  rationale: Expressa o sentido moral de algo traiçoeiro ou ardiloso, sem reduzir o termo a mera complexidade.
- source_word: הַלֵּב
  choice: o coração
  rationale: Mantém a imagem hebraica do ser interior, que abrange pensamento, vontade e desejos; a nota esclarece que não se trata apenas das emoções.
- source_word: מִכֹּל
  choice: mais ... do que qualquer outra coisa
  rationale: Reproduz de modo natural em português a construção comparativa hebraica e sua força superlativa.
- source_word: וְאָנֻשׁ
  choice: e está gravemente doente
  rationale: Preserva a metáfora de enfermidade profunda. O termo também pode sugerir uma condição incurável, possibilidade registrada em nota.
- source_word: הוּא
  choice: está
  rationale: O pronome predicativo hebraico é representado naturalmente na oração portuguesa, sem repetição desnecessária do sujeito.
- source_word: מִי
  choice: quem
  rationale: Mantém de forma concisa a pergunta retórica do hebraico.
- source_word: יֵדָעֶנּוּ
  choice: pode conhecê-lo
  rationale: Traduz diretamente o verbo ידע e conserva a ideia de conhecer de modo penetrante a verdadeira condição do coração.
theological_decisions:
- issue: Alcance antropológico de “coração”
  choice: Manter “coração” como designação do ser interior.
  alternative: mente; ser interior
  rationale: A opção preserva a antropologia e a imagem bíblicas sem restringir o referente às emoções; a nota explicita seu alcance cognitivo, volitivo e afetivo.
- issue: Sentido de אָנֻשׁ
  choice: Traduzir como enfermidade interior grave.
  alternative: incurável; desesperadamente perverso
  rationale: O hebraico emprega linguagem de doença ou condição sem remédio. “Gravemente doente” mantém essa metáfora e evita converter o termo diretamente em uma categoria moral abstrata.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A formulação mantém a concisão e a tensão metafórica do hebraico.
