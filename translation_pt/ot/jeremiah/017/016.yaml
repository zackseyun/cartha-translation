  text: וַ/אֲנִ֞י לֹא אַ֣צְתִּי מֵ/רֹעֶ֣ה אַחֲרֶ֗י/ךָ וְ/י֥וֹם אָנ֛וּשׁ לֹ֥א הִתְאַוֵּ֖יתִי אַתָּ֣ה יָדָ֑עְתָּ מוֹצָ֣א שְׂפָתַ֔/י נֹ֥כַח פָּנֶ֖י/ךָ הָיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/016.yaml
  text: But as for me[a], I did not hurry away from being a shepherd after you, and I did not desire the day of disaster; you know. What came from my lips was before your face.
translation:
  language: pt
  text: Quanto a mim, não me apressei em deixar de ser pastor que te segue, nem desejei o dia da desgraça[a]; tu o sabes. O que saiu dos meus lábios esteve diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o dia da calamidade” ou “o dia funesto”. A expressão hebraica fala literalmente de um dia gravemente enfermo ou incurável, provavelmente no sentido de um dia de desastre ou juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַצְתִּי
  choice: não me apressei em deixar
  rationale: O verbo אוץ pode indicar apressar-se ou agir sob pressão. Com מִן e o particípio, a formulação comunica afastamento apressado da função, sem substituir o verbo por uma interpretação como “recuar”.
- source_word: מֵרֹעֶה אַחֲרֶיךָ
  choice: de ser pastor seguindo-te
  rationale: Mantém a imagem explícita de רֹעֶה, “pastor”, e expressa אַחֲרֶיךָ, literalmente “atrás de ti”, em português natural como seguimento do Senhor.
- source_word: יוֹם אָנושׁ
  choice: o dia da desgraça
  rationale: אָנושׁ descreve algo gravemente enfermo, incurável ou funesto; no contexto, a expressão aponta para um dia calamitoso. “Desgraça” comunica o sentido contextual, enquanto a imagem lexical é indicada em nota.
- source_word: הִתְאַוֵּיתִי
  choice: desejei
  rationale: O hitpael de אוה expressa desejo ou anseio; “desejei” é direto, atual e não intensifica indevidamente o texto.
- source_word: אַתָּה יָדָעְתָּ
  choice: tu o sabes
  rationale: Embora a forma verbal seja perfeita, a declaração apela ao conhecimento presente de Deus. O pronome explícito recebe a ênfase natural de “tu”.
- source_word: מוֹצָא שְׂפָתַי
  choice: o que saiu dos meus lábios
  rationale: Preserva a imagem concreta de מוֹצָא, “saída”, aplicada às palavras pronunciadas.
- source_word: נֹכַח פָּנֶיךָ
  choice: diante de ti
  rationale: Expressa com naturalidade a ideia de estar perante a face ou na presença de Deus, sem a estranheza da tradução rigidamente literal “diante do teu rosto”.
- source_word: הָיָה
  choice: esteve
  rationale: O perfeito é vertido no passado, apresentando as palavras do profeta como expostas diante de Deus.
theological_decisions:
- issue: Sentido metafórico de רֹעֶה na descrição da função de Jeremias
  choice: Conservar “pastor” como metáfora da função exercida por Jeremias ao seguir o Senhor.
  alternative: Explicitar “profeta” ou traduzir apenas “seguir-te”.
  rationale: O hebraico emprega a imagem do pastor e não nomeia diretamente o ofício profético. Mantê-la evita restringir ou resolver interpretativamente a descrição.
- issue: Referência de יוֹם אָנושׁ
  choice: Traduzir como “dia da desgraça”, sem explicitar no corpo do texto que se trata necessariamente do juízo sobre o povo.
  alternative: “dia da enfermidade”, “dia calamitoso” ou “dia do juízo”.
  rationale: O contexto favorece calamidade ou desastre, mas a expressão não contém por si só o termo técnico “juízo”. A tradução conserva essa tensão sem impor uma formulação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” para preservar a distinção singular e a ênfase do pronome hebraico. A sintaxe foi suavizada apenas o necessário, mantendo as imagens de pastor, lábios e presença divina.
