reference: Jeremiah 17:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֣א שָֽׁמְע֔וּ וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֣י שומע וּ/לְ/בִלְתִּ֖י קַ֥חַת מוּסָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/023.yaml
  text: But they did not listen[a], and they did not incline their ear[c][b], but stiffened their neck so as not to hear and not to accept discipline.
translation:
  language: pt
  text: Mas eles não escutaram[a] nem inclinaram o ouvido; antes, endureceram a cerviz[b] para não ouvir e não aceitar a disciplina[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não ouviram” ou “não obedeceram”. O verbo hebraico pode ter esses sentidos conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “endureceram a cerviz”, expressão que indica resistência obstinada.'
    reason: cultural_note
  - marker: c
    text: Ou “a instrução” ou “a correção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: escutaram
  rationale: O verbo pode significar ouvir, escutar ou obedecer. Neste paralelismo com “inclinar o ouvido”, “escutaram” expressa atenção e resposta implícita sem explicitar em excesso a ideia de obediência.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: inclinaram o ouvido
  rationale: Preserva a imagem hebraica de voltar o ouvido para escutar atentamente e permanece compreensível em português atual.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: endureceram a cerviz
  rationale: Mantém a metáfora corporal hebraica de resistência obstinada. “Cerviz” é de registro bíblico, mas ainda claro e digno em português.
- source_word: לְבִלְתִּי שֹׁמֵעַ
  choice: para não ouvir
  rationale: A construção לְבִלְתִּי pode indicar propósito ou resultado. “Para não ouvir” conserva essa relação sem resolver rigidamente a nuance.
- source_word: וּלְבִלְתִּי קַחַת מוּסָר
  choice: e não aceitar a disciplina
  rationale: “Aceitar” comunica a recepção voluntária da correção, enquanto “disciplina” preserva as dimensões corretiva e formativa de מוּסָר.
- source_word: מוּסָר
  choice: disciplina
  rationale: O termo abrange instrução, correção e formação moral; “disciplina” conserva melhor esse peso no contexto da repreensão profética.
theological_decisions:
- issue: Tradução da expressão de obstinação
  choice: endureceram a cerviz
  alternative: tornaram-se obstinados
  rationale: A metáfora corporal é inteligível e preserva as ligações intertextuais da linguagem profética sobre resistência à palavra de Deus.
- issue: Força de שׁמע na repreensão profética
  choice: escutaram na primeira ocorrência e ouvir na segunda
  alternative: obedeceram nas duas ocorrências
  rationale: A variação preserva a extensão semântica do verbo e evita introduzir explicitamente “obedecer” onde o texto imediato enfatiza a recusa de ouvir e receber correção.
- issue: Nuance de לְבִלְתִּי
  choice: para não ouvir
  alternative: de modo que não ouvissem
  rationale: A formulação mantém aberta a tensão entre propósito e resultado presente na construção hebraica, sem impor uma leitura teológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “nem...; antes...” reproduz o contraste hebraico de modo natural. A imagem “endureceram a cerviz” foi preservada por sua força profética e intertextual; a nota esclarece o sentido idiomático.
