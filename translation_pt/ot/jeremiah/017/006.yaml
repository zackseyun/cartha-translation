  text: וְ/הָיָה֙ כְּ/עַרְעָ֣ר בָּֽ/עֲרָבָ֔ה וְ/לֹ֥א יִרְאֶ֖ה כִּי יָב֣וֹא ט֑וֹב וְ/שָׁכַ֤ן חֲרֵרִים֙ בַּ/מִּדְבָּ֔ר אֶ֥רֶץ מְלֵחָ֖ה וְ/לֹ֥א תֵשֵֽׁב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/006.yaml
  text: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
translation:
  language: pt
  text: Ele será como um arbusto[a] no deserto[c] e não verá quando o bem chegar[b]. Habitará em lugares ressequidos no ermo, numa terra salgada e desabitada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um junípero”, “como uma tamargueira” ou “como um arbusto estéril”; não se sabe ao certo qual planta é designada pelo termo hebraico.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “não perceberá quando a prosperidade chegar”. Em hebraico, literalmente: “não verá quando o bem chegar”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “na Arabá”, caso o termo seja entendido como o nome da região geográfica específica, e não como uma designação geral de terra desértica.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּעַרְעָר
  choice: como um arbusto
  rationale: O termo designa uma planta de região árida, mas sua espécie exata é incerta. “Arbusto” preserva a imagem sem impor uma identificação botânica discutível.
- source_word: בָּעֲרָבָה
  choice: no deserto
  rationale: עֲרָבָה pode indicar a Arabá como região geográfica ou, em sentido comum, uma planície árida/desértica. O contexto poético favorece o sentido ambiental amplo, sem eliminar a alternativa geográfica.
- source_word: וְלֹא יִרְאֶה כִּי יָבוֹא טוֹב
  choice: e não verá quando o bem chegar
  rationale: A formulação conserva a metáfora hebraica de “ver” e o substantivo amplo “bem”, sem restringi-lo a prosperidade, embora esse sentido contextual seja possível.
- source_word: וְשָׁכַן
  choice: Habitará
  rationale: שׁכן significa habitar ou morar. “Habitará” mantém o registro profético-poético e introduz naturalmente as expressões locativas seguintes.
- source_word: חֲרֵרִים
  choice: em lugares ressequidos
  rationale: O termo evoca lugares secos, abrasados ou estéreis. “Ressequidos” comunica com clareza a aridez sem especificar indevidamente o tipo de terreno.
- source_word: בַּמִּדְבָּר
  choice: no ermo
  rationale: מִדְבָּר denota deserto ou região desabitada. “Ermo” evita repetição imediata de “deserto” e preserva a ideia de isolamento e aridez em linguagem digna e compreensível.
- source_word: אֶרֶץ מְלֵחָה
  choice: numa terra salgada
  rationale: A expressão descreve solo marcado pela salinidade e, portanto, pela esterilidade. “Terra salgada” é direta e vívida.
- source_word: וְלֹא תֵשֵׁב
  choice: e desabitada
  rationale: O verbo feminino concorda com “terra” e indica que ela não é habitada. A coordenação adjetival produz português natural sem perder o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência profético-poética. A tradução conserva a repetição semântica do ambiente árido, mas usa “ermo” após “deserto” para fluidez. Mantém literalmente a imagem de não “ver” a chegada do bem e registra em notas as incertezas botânica, idiomática e geográfica.
