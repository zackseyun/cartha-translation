  text: הִנֵּה הֵ֕מָּה אֹמְרִ֖ים אֵלָ֑/י אַיֵּ֥ה דְבַר יְהוָ֖ה יָ֥בוֹא נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/015.yaml
  text: Look[a], they are saying to me, “Where is the word of Yahweh? Let it come now!”
translation:
  language: pt
  text: 'Vejam, eles me dizem: “Onde está a palavra de Yahweh[a]? Que ela venha agora!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mensagem de Yahweh”. A expressão hebraica é a fórmula profética usual para uma palavra ou um oráculo divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Interjeição dêitica que chama a atenção para a situação; “Vejam” comunica sua força em português atual sem o tom mais arcaico de “Eis que”.
- source_word: הֵמָּה אֹמְרִים
  choice: eles estão me dizendo
  rationale: O pronome independente dá ênfase ao sujeito, e o particípio qal apresenta a fala como ação em curso; a construção progressiva é natural em português e não força uma ideia de repetição além do que o contexto permite.
- source_word: אֵלָי
  choice: me
  rationale: Representa naturalmente em português a direção da fala para Jeremias; “contra mim” interpretaria em excesso o tom hostil.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Interrogativo comum de localização ou existência, aqui seguido por uma expressão nominal.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética tradicional para uma palavra, mensagem ou oráculo divino, sem reduzi-la apenas a “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יָבוֹא נָא
  choice: Que ela venha agora
  rationale: O imperfeito tem força volitiva ou jussiva, e נָא intensifica o desafio; a formulação transmite a provocação impaciente, não uma previsão futura nem um pedido cortês.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de דְבַר יְהוָה
  choice: a palavra de Yahweh
  alternative: a mensagem de Yahweh
  rationale: “Palavra” mantém a amplitude da fórmula profética, que pode indicar pronunciamento, mensagem ou oráculo divino, sem resolver indevidamente essa nuance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vejam” conserva a função de chamar a atenção; “estão me dizendo” mantém o aspecto em curso sem impor repetição. A fala direta conserva o tom de desafio dos interlocutores.
