source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/עֵ֣ץ שָׁת֣וּל עַל מַ֗יִם וְ/עַל יוּבַל֙ יְשַׁלַּ֣ח שָֽׁרָשָׁ֔י/ו וְ/לֹ֤א ירא כִּֽי יָבֹ֣א חֹ֔ם וְ/הָיָ֥ה עָלֵ֖/הוּ רַֽעֲנָ֑ן וּ/בִ/שְׁנַ֤ת בַּצֹּ֨רֶת֙ לֹ֣א יִדְאָ֔ג וְ/לֹ֥א יָמִ֖ישׁ מֵ/עֲשׂ֥וֹת פֶּֽרִי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/008.yaml
  text: He will be like a tree planted by water[a], that sends out its roots by a stream; it does not fear when heat comes, and its leaf remains green. In a year of drought it is not anxious[b], and it does not cease from bearing fruit.
translation:
  language: pt
  text: Ele será como uma árvore plantada junto às águas, que lança suas raízes junto ao riacho[a]. Não verá quando vier o calor, e sua folhagem permanecerá verdejante[b]. No ano da seca, não ficará ansiosa nem deixará de dar fruto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “curso de água” ou “canal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua folhagem será viçosa”; o termo hebraico comunica tanto verdor quanto frescor e vigor.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵץ שָׁתוּל
  choice: como uma árvore plantada
  rationale: Preserva de modo natural a comparação e o particípio passivo, que retrata uma árvore intencionalmente estabelecida.
- source_word: עַל מַיִם
  choice: junto às águas
  rationale: Expressa proximidade à fonte de água; o plural mantém a forma hebraica sem soar artificial em português.
- source_word: יוּבַל
  choice: riacho
  rationale: Designa um curso ou canal de água. “Riacho” é claro e natural, enquanto “canal” poderia sugerir de forma indevida uma obra necessariamente artificial.
- source_word: יְשַׁלַּח שָׁרָשָׁיו
  choice: estende suas raízes
  rationale: Comunica o movimento das raízes para fora em português idiomático e preserva a imagem vívida do hebraico.
- source_word: לֹא ירא
  choice: não teme
  rationale: Mantém a personificação da árvore e o sentido lexical de temor, sem reduzi-lo apenas a preocupação.
- source_word: כִּי יָבֹא חֹם
  choice: quando vem o calor
  rationale: Entende כִּי em sentido temporal, como pede o contexto, e conserva a concisão da expressão.
- source_word: עָלֵהוּ רַעֲנָן
  choice: sua folhagem permanece verdejante
  rationale: “Folhagem” funciona coletivamente para o singular hebraico, e “permanece” explicita naturalmente a continuidade sugerida pelo contexto diante do calor. “Verdejante” reúne cor e vitalidade.
- source_word: וּבִשְׁנַת בַּצֹּרֶת
  choice: no ano da seca
  rationale: Formulação proverbial e natural que reproduz a construção hebraica sem rigidez.
- source_word: לֹא יִדְאָג
  choice: não fica ansiosa
  rationale: Preserva a personificação e o sentido de inquietação ou preocupação ansiosa.
- source_word: לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  choice: nem deixa de dar fruto
  rationale: Expressa com clareza a ideia de não cessar uma atividade e usa a colocação portuguesa corrente “dar fruto”.
