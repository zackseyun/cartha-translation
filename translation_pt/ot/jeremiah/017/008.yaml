revisions:
- from: Ele será como uma árvore plantada junto às águas, que estende suas raízes para o riacho[a]. Não teme quando vem o calor, e sua folhagem permanece verdejante[b]. No ano da seca, não fica ansiosa nem deixa de dar fruto.
  to: Ele será como uma árvore plantada junto às águas, que lança suas raízes junto ao riacho[a]. Não verá quando vier o calor, e sua folhagem permanecerá verdejante[b]. No ano da seca, não ficará ansiosa nem deixará de dar fruto.
  rationale: A revisão corrige a tradução do verbo וְלֹא יִרְאֶה de acordo com o hebraico massorético, independentemente da formulação incorreta no audit trail inglês. Também ajusta a expressão relativa às raízes para uma construção portuguesa mais natural e espacialmente fiel. O futuro em “permanecerá” acompanha a sequência verbal hebraica e mantém a imagem poética.
