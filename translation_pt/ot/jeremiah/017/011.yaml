source:
  edition: WLC
  text: קֹרֵ֤א דָגַר֙ וְ/לֹ֣א יָלָ֔ד עֹ֥שֶׂה עֹ֖שֶׁר וְ/לֹ֣א בְ/מִשְׁפָּ֑ט בַּ/חֲצִ֤י ימ/ו יַעַזְבֶ֔/נּוּ וּ/בְ/אַחֲרִית֖/וֹ יִהְיֶ֥ה נָבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/011.yaml
  text: 'Like a partridge that gathers a brood it did not hatch[a], so is one who makes wealth unjustly: in the middle of his days it will leave him, and in his end he will be a fool.'
translation:
  language: pt
  text: 'Como a perdiz que choca ovos que não pôs[a], assim é quem acumula riquezas injustamente: no meio de seus dias, as riquezas o abandonarão e, no fim, ele será um insensato.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como a perdiz que reúne filhotes que não chocou”. O comportamento exato da ave por trás do provérbio é incerto, mas o sentido é que aquilo que não pertence legitimamente a alguém não permanecerá com essa pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא
  choice: perdiz
  rationale: No contexto de incubação e postura, o termo designa tradicionalmente uma ave, provavelmente a perdiz, e não o particípio comum “aquele que chama”.
- source_word: דָגַר
  choice: choca
  rationale: O verbo descreve a ação de uma ave ao incubar ovos ou cuidar da ninhada. “Choca” mantém a imagem de modo natural em português, enquanto a nota registra a alternativa referente à ninhada.
- source_word: וְלֹא יָלָד
  choice: o que não pôs
  rationale: Embora o verbo seja literalmente “gerou/deu à luz”, no contexto de uma ave a formulação idiomática é “não pôs”, referindo-se aos ovos.
- source_word: עֹשֶׂה עֹשֶׁר
  choice: quem acumula riquezas
  rationale: Expressa de modo natural a ideia hebraica de “fazer/obter riqueza”, preservando o caráter ativo da aquisição.
- source_word: וְלֹא בְמִשְׁפָּט
  choice: injustamente
  rationale: מִשְׁפָּט aqui se refere ao que é justo ou legítimo; o advérbio transmite com clareza a força ética da expressão.
- source_word: בַּחֲצִי יָמָיו
  choice: no meio de seus dias
  rationale: Mantém a metáfora temporal do hebraico e indica que a perda ocorrerá antes de se completar a vida.
- source_word: יַעַזְבֶנּוּ
  choice: elas o abandonarão
  rationale: O referente lógico é “riquezas”. Em português, o plural retoma naturalmente “riquezas”, embora o hebraico trate עֹשֶׁר, “riqueza”, como singular.
- source_word: וּבְאַחֲרִיתוֹ
  choice: no fim
  rationale: A expressão indica o desfecho pessoal do homem; o contexto e o pronome “ele” tornam esse referente claro em português.
- source_word: נָבָל
  choice: um insensato
  rationale: O termo denota insensatez moral, e não apenas falta de inteligência. “Insensato” preserva esse peso em registro bíblico natural.
theological_decisions:
- issue: Sentido da imagem proverbial da ave
  choice: A perdiz incuba ovos que não pôs, imagem de uma posse que não lhe pertence e não permanecerá.
  alternative: A perdiz reúne filhotes que não chocou.
  rationale: O comportamento exato da ave pressuposto pelo provérbio é incerto. O texto principal oferece uma leitura plausível, e a nota preserva a alternativa sem transformar uma reconstrução zoológica discutível em certeza.
- issue: Referente de יַעַזְבֶנּוּ
  choice: As riquezas adquiridas injustamente abandonarão a pessoa.
  alternative: A pessoa deixará as riquezas.
  rationale: 'A construção hebraica apresenta mais naturalmente a riqueza como sujeito do verbo e o homem como objeto. Isso também reforça a lógica do provérbio: aquilo que foi obtido ilegitimamente não permanece.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe proverbial foi preservada sem rigidez excessiva. “Insensato” comunica melhor que “tolo” a dimensão moral de נָבָל.
