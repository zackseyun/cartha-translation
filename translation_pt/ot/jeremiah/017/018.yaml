  text: יֵבֹ֤שׁוּ רֹדְפַ/י֙ וְ/אַל אֵבֹ֣שָׁה אָ֔נִי יֵחַ֣תּוּ הֵ֔מָּה וְ/אַל אֵחַ֖תָּה אָ֑נִי הָבִ֤יא עֲלֵי/הֶם֙ י֣וֹם רָעָ֔ה וּ/מִשְׁנֶ֥ה שִׁבָּר֖וֹן שָׁבְרֵֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/018.yaml
  text: Let my pursuers be put to shame[a], but let me not be put to shame; let them be dismayed, but let me not be dismayed. Bring upon them a day of disaster[c][b], and shatter them with double destruction.
translation:
  language: pt
  text: Que os que me perseguem sejam envergonhados[a], mas que eu não seja envergonhado; que eles fiquem consternados, mas que eu não fique consternado. Faz vir sobre eles um dia de calamidade[b] e despedaça-os com dupla destruição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam cobertos de vergonha”. O hebraico diz literalmente “os que me perseguem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um dia de desastre”. Aqui, “calamidade” indica juízo ou ruína, não maldade moral.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “quebra-os com dupla quebra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ / אֵבֹשָׁה
  choice: sejam envergonhados / seja envergonhado
  rationale: בושׁ pode indicar vergonha, desonra ou frustração. A formulação preserva o paralelismo e, pelo contexto, comunica desonra sofrida, não apenas um sentimento interior.
- source_word: רֹדְפַי
  choice: os que me perseguem
  rationale: Traduz diretamente o particípio de רדף e mantém a imagem concreta da perseguição sem restringi-la a um sentido técnico ou religioso.
- source_word: יֵחַתּוּ / אֵחַתָּה
  choice: fiquem aterrorizados / fique aterrorizado
  rationale: No nifal, חתת pode expressar abatimento, consternação ou terror. 'Ficar aterrorizado' comunica de modo natural a desintegração emocional pretendida, preservando a repetição hebraica.
- source_word: הָבִיא
  choice: Faze vir sobre eles
  rationale: O imperativo hifil de בוא com עַל significa causar que algo venha sobre alguém; a opção mantém a petição direta e a construção imagética do hebraico.
- source_word: יוֹם רָעָה
  choice: o dia da calamidade
  rationale: רָעָה aqui designa infortúnio, calamidade ou desastre, e não maldade moral. O artigo definido reflete a forma hebraica e sugere um dia específico de juízo ou ruína.
- source_word: מִשְׁנֶה
  choice: dobrada
  rationale: מִשְׁנֶה denota duplicidade ou porção dupla. 'Dobrada' conserva a intensidade e modifica naturalmente 'destruição' em português.
- source_word: שִׁבָּרוֹן
  choice: destruição
  rationale: O substantivo denota fratura, quebrantamento ou ruína. 'Destruição' comunica o resultado do juízo em português corrente, enquanto a nota preserva a formulação cognata literal.
- source_word: שָׁבְרֵם
  choice: despedaça-os
  rationale: O imperativo de שׁבר é literalmente 'quebra-os'. 'Despedaça-os' preserva a metáfora violenta e a força da súplica, além de ecoar semanticamente o substantivo cognato שִׁבָּרוֹן.
theological_decisions:
- issue: Petição imprecatória por juízo
  choice: Apresentar o versículo como oração direta de Jeremias para que Deus julgue seus perseguidores, sem suavizar sua severidade.
  alternative: Reduzir a imprecação a um pedido geral de vindicação ou proteção.
  rationale: O hebraico emprega formas volitivas e imperativos diretos. A tradução deve conservar a tensão teológica entre a vindicação pessoal do profeta e seu pedido de juízo divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição das duas primeiras linhas foi preservada por sua força retórica. 'Faze vir' mantém solenidade moderada sem recorrer a linguagem arcaica excessiva; 'despedaça-os' conserva a intensidade da imprecação.
