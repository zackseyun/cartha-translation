source:
  edition: WLC
  text: וְ֠/הָיָה אִם שָׁמֹ֨עַ תִּשְׁמְע֤וּ/ן אֵלַ/י֙ נְאֻם יְהוָ֔ה לְ/בִלְתִּ֣י הָבִ֣יא מַשָּׂ֗א בְּ/שַׁעֲרֵ֛י הָ/עִ֥יר הַ/זֹּ֖את בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וּ/לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת לְ/בִלְתִּ֥י עֲשֽׂוֹת ב/ה כָּל מְלָאכָֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/024.yaml
  text: And it shall be[a], if you truly listen to me, declares Yahweh, by not bringing a load through the gates of this city on the Sabbath day, and by keeping the Sabbath day holy, by not doing any work on it[b],
translation:
  language: pt
  text: E acontecerá que, se vocês de fato me ouvirem[a], declara Yahweh, ao não trazerem carga alguma[b] pelas portas desta cidade no dia de sábado e ao santificarem o dia de sábado, sem fazer nele trabalho algum,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se vocês me obedecerem fielmente”. O hebraico repete o verbo “ouvir” para dar ênfase, e a expressão pode indicar uma escuta que resulta em obediência.
    reason: lexical_alternative
  - marker: b
    text: Ou “fardo”. O termo hebraico designa algo carregado; aqui se refere às cargas transportadas pelas portas da cidade no sábado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Preserva a fórmula hebraica que introduz o resultado futuro da condição, em português atual e digno.
- source_word: אִם שָׁמֹעַ תִּשְׁמְעוּן אֵלַי
  choice: se vocês de fato me ouvirem
  rationale: A repetição idiomática do verbo intensifica o ato de ouvir. “De fato” conserva a ênfase, enquanto “ouvirem” mantém tanto o sentido auditivo quanto a possível força de obediência.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e translitera o nome divino expresso no texto hebraico.
- source_word: לְבִלְתִּי הָבִיא מַשָּׂא
  choice: ao não trazerem carga alguma
  rationale: O infinitivo pessoal liga naturalmente a ação aos ouvintes e apresenta a conduta que concretiza sua escuta. “Carga” indica algo transportado, sem sugerir necessariamente um fardo metafórico.
- source_word: בְּשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: pelas portas desta cidade
  rationale: “Pelas” comunica o movimento da carga através das portas da cidade.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: Mantém a referência explícita ao “dia” e usa a designação corrente em português.
- source_word: וּלְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: e ao santificarem o dia de sábado
  rationale: Conserva a coordenação hebraica e expressa o ato de tratar o sábado como santo.
- source_word: לְבִלְתִּי עֲשׂוֹת בָהּ כָּל מְלָאכָה
  choice: sem fazer nele trabalho algum
  rationale: Formula de maneira natural a proibição abrangente; “nele” retoma o dia de sábado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de שׁמע na expressão enfática
  choice: ouvirem
  alternative: obedecerem
  rationale: Embora o verbo possa implicar obediência neste contexto de aliança, “ouvirem” preserva sua forma lexical e deixa que as ações seguintes explicitem a obediência exigida.
- issue: Relação entre ouvir e as práticas sabáticas subsequentes
  choice: orações circunstanciais com “ao” e “sem”
  alternative: 'orações finitas coordenadas: “não trouxerem... e santificarem...”'
  rationale: A construção escolhida conserva a relação instrumental ou explicativa dos infinitivos hebraicos sem transformar silenciosamente “ouvir” em mero sinônimo de “obedecer”.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo. A pontuação mantém o versículo como prótase ainda incompleta, cuja consequência vem no versículo seguinte.
