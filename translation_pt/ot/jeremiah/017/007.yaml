  text: בָּר֣וּךְ הַ/גֶּ֔בֶר אֲשֶׁ֥ר יִבְטַ֖ח בַּֽ/יהוָ֑ה וְ/הָיָ֥ה יְהוָ֖ה מִבְטַחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/007.yaml
  text: Blessed is the man who trusts in Yahweh[b][a], and whose trust is Yahweh.
translation:
  language: pt
  text: Bendito é o homem que confia em Yahweh, e Yahweh é a sua confiança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e a sua segurança é Yahweh». O substantivo hebraico pode indicar aquilo em que alguém deposita confiança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito
  rationale: Preserva o sentido de alguém que recebe favor ou bênção, com maior peso teológico do que «feliz».
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: Mantém o masculino singular do hebraico e seu emprego representativo ou proverbial.
- source_word: יִבְטַח בַּיהוָה
  choice: confia em Yahweh
  rationale: O verbo בטח com a preposição ב expressa depositar confiança em alguém; esta é a formulação direta e natural em português.
- source_word: וְהָיָה יְהוָה מִבְטַחוֹ
  choice: e que tem Yahweh como sua confiança
  rationale: Expressa naturalmente o estado descrito pela oração hebraica, conserva a conjunção e faz de Yahweh o objeto ou fundamento da confiança.
- source_word: מִבְטַחוֹ
  choice: sua confiança
  rationale: Mantém a ligação lexical com o verbo «confia» e preserva a formulação marcante do original, embora o substantivo também possa indicar aquilo em que se deposita confiança.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido da segunda oração
  choice: Yahweh é apresentado como a própria confiança do homem
  alternative: Yahweh será sua segurança; Yahweh é aquele em quem ele confia
  rationale: A tradução preserva a afirmação compacta e teologicamente expressiva do hebraico sem restringir מִבְטָח a uma única paráfrase interpretativa.
- issue: Masculino genérico em גֶּבֶר
  choice: o homem
  alternative: a pessoa; aquele
  rationale: Conserva a forma masculina singular e seu caráter proverbial, sem negar sua aplicação representativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Bendito» conserva o tom bíblico sem arcaísmo excessivo; a construção «tem Yahweh como sua confiança» torna inteligível a formulação hebraica e a nota preserva sua forma mais literal e sua amplitude lexical.
