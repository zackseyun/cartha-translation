source:
  edition: WLC
  text: כִּסֵּ֣א כָב֔וֹד מָר֖וֹם מֵֽ/רִאשׁ֑וֹן מְק֖וֹם מִקְדָּשֵֽׁ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/012.yaml
  text: A glorious throne[a], exalted from the beginning, is the place of our sanctuary.
translation:
  language: pt
  text: Um trono de glória[a], elevado desde o princípio, é o lugar do nosso santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um trono de glória nas alturas desde o princípio é o lugar do nosso santuário”; possivelmente também: “Ó trono de glória, elevado desde o princípio, lugar do nosso santuário!”. O hebraico é muito condensado e permite mais de uma análise sintática.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסֵּא
  choice: trono
  rationale: O substantivo designa normalmente um trono real ou assento de governo; “trono” conserva a força régia e teológica da imagem.
- source_word: כָבוֹד
  choice: de glória
  rationale: Mantém a construção nominal hebraica כִּסֵּא כָבוֹד e seu tom elevado, sem convertê-la necessariamente em adjetivo.
- source_word: מָרוֹם
  choice: elevado
  rationale: O termo se relaciona à altura e, nesta leitura, qualifica predicativamente o trono, comunicando elevação e majestade.
- source_word: מֵרִאשׁוֹן
  choice: desde o princípio
  rationale: Expressa prioridade temporal ou antiguidade primordial em português natural e digno.
- source_word: מְקוֹם
  choice: lugar
  rationale: É o equivalente direto e evita acrescentar a ideia interpretativa de morada.
- source_word: מִקְדָּשֵׁנוּ
  choice: nosso santuário
  rationale: Preserva o sentido de lugar santo e representa claramente o sufixo de primeira pessoa do plural.
theological_decisions:
- issue: Relação sintática entre as orações nominais sem verbo expresso
  choice: A frase identifica o trono de glória, elevado desde o princípio, como o lugar do nosso santuário.
  alternative: “Um trono de glória nas alturas desde o princípio é o lugar do nosso santuário” ou, em leitura vocativa, “Ó trono de glória, elevado desde o princípio, lugar do nosso santuário!”
  rationale: O hebraico é muito condensado e admite mais de uma análise sintática. A redação principal oferece uma leitura coerente sem ocultar as demais possibilidades, registradas em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; registro digno e conciso. A formulação nominal elevada preserva tanto a imagem régia quanto a ambiguidade sintática do hebraico.
