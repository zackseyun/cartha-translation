source:
  edition: WLC
  text: אֲנִ֧י יְהוָ֛ה חֹקֵ֥ר לֵ֖ב בֹּחֵ֣ן כְּלָי֑וֹת וְ/לָ/תֵ֤ת לְ/אִישׁ֙ כ/דרכ/ו כִּ/פְרִ֖י מַעֲלָלָֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/010.yaml
  text: I[a], Yahweh, search the heart[b], testing the kidneys, to give to each man according to his way, according to the fruit of his deeds.
translation:
  language: pt
  text: Eu, Yahweh, sondo o coração e ponho à prova os rins[a], para dar a cada pessoa[b] segundo o seu caminho, segundo o fruto de seus atos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “rins”, imagem usada para os pensamentos e afetos mais íntimos.
    reason: cultural_note
  - marker: b
    text: Ou “a cada homem”; o hebraico emprega uma forma masculina singular com sentido representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֹקֵר
  choice: examino
  rationale: O particípio indica uma investigação penetrante e contínua; “examino” é natural em português e combina bem com o paralelismo seguinte.
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica, que abrange pensamento, vontade e vida interior.
- source_word: בֹּחֵן
  choice: provo
  rationale: Expressa exame avaliativo e preserva a distinção em relação a חֹקֵר.
- source_word: כְּלָיוֹת
  choice: rins
  rationale: Mantém a imagem concreta do hebraico; uma nota explica seu sentido idiomático como o íntimo dos pensamentos e afetos.
- source_word: וְלָתֵת
  choice: para dar
  rationale: Representa naturalmente a relação de propósito ou resultado do infinitivo com o exame divino.
- source_word: לְאִישׁ
  choice: a cada pessoa
  rationale: O substantivo masculino singular tem aqui força representativa; “cada pessoa” comunica com clareza o alcance distributivo sem restringir a afirmação aos homens.
- source_word: כִדְרָכוֹ
  choice: segundo o seu caminho
  rationale: Preserva a metáfora hebraica do caminho como modo de viver ou conduta.
- source_word: כִפְרִי
  choice: segundo o fruto de
  rationale: Conserva a metáfora do fruto como produto ou resultado da vida.
- source_word: מַעֲלָלָיו
  choice: seus atos
  rationale: Expressa de modo atual e conciso ações com peso moral.
theological_decisions:
- issue: Imagem antropológica no juízo divino
  choice: Manter “coração” e “rins” no texto principal.
  alternative: Traduzir de modo abstrato como “mente” e “íntimo”.
  rationale: A linguagem concreta retrata o conhecimento exaustivo de Yahweh sobre a vida interior humana. A nota esclarece o idioma sem apagar a imagem hebraica.
- issue: Alcance de לְאִישׁ
  choice: Traduzir “a cada pessoa”.
  alternative: Traduzir literalmente “a cada homem”.
  rationale: Embora a forma seja masculina singular, seu valor contextual é representativo e distributivo; a nota preserva a transparência gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem inicial “Eu, Yahweh” conserva a ênfase do pronome hebraico; o paralelismo e as metáforas “caminho” e “fruto” foram mantidos.
