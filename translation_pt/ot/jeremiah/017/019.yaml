  text: כֹּה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָלֹ֤ךְ וְ/עָֽמַדְתָּ֙ בְּ/שַׁ֣עַר בְּנֵֽי עם אֲשֶׁ֨ר יָבֹ֤אוּ ב/וֹ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֖ר יֵ֣צְאוּ ב֑/וֹ וּ/בְ/כֹ֖ל שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/019.yaml
  text: 'Thus Yahweh said to me: Go and stand in the gate of the people[a], by which the kings of Judah enter and by which they go out, and in all the gates of Jerusalem.'
translation:
  language: pt
  text: 'Assim Yahweh me disse: “Vá e fique de pé no portão do povo[a], pelo qual entram os reis de Judá e pelo qual saem, e em todos os portões de Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “portão dos filhos do povo”; possivelmente o nome de um portão específico, muitas vezes entendido como “Portão do Povo”.'
    reason: Registra a forma literal e preserva a incerteza lexical da expressão hebraica.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim me disse
  rationale: Preserva de modo natural e digno a fórmula profética que introduz a fala divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָלֹךְ וְעָמַדְתָּ
  choice: Vá e fique de pé
  rationale: Expressa a força imperativa da construção hebraica e mantém a sequência das duas ações.
- source_word: בְּשַׁעַר בְּנֵי עָם
  choice: no Portão do Povo
  rationale: Trata a expressão difícil como provável nome de um portão, sem ocultar no texto corrente a ligação com o povo; a forma hebraica mais literal é registrada em nota.
- source_word: אֲשֶׁר יָבֹאוּ בוֹ ... וַאֲשֶׁר יֵצְאוּ בוֹ
  choice: pelo qual entram ... e pelo qual saem
  rationale: Mantém a repetição das orações relativas e apresenta o portão como via de entrada e saída.
- source_word: מַלְכֵי יְהוּדָה
  choice: os reis de Judá
  rationale: Tradução direta e convencional da cadeia construta hebraica.
- source_word: וּבְכֹל שַׁעֲרֵי יְרוּשָׁלִָם
  choice: e em todos os portões de Jerusalém
  rationale: Preserva a ampliação da ordem ao conjunto dos portões da cidade e a preposição hebraica, compatível com o espaço interno dos complexos de portões antigos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o nome próprio divino; “Yahweh” o representa sem substituí-lo por um título.
- issue: Identificação de בְּשַׁעַר בְּנֵי עָם
  choice: Portão do Povo
  alternative: portão dos filhos do povo; portão do povo
  rationale: A expressão hebraica é incomum e pode designar um portão específico. A tradução emprega um provável nome próprio, mas conserva a incerteza em nota, sem impor uma identificação histórica ou teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto foi pontuado com aspas; “fique de pé” torna explícita a postura ordenada. A capitalização de “Portão do Povo” sinaliza que provavelmente se trata de um nome, enquanto a nota preserva a ambiguidade.
