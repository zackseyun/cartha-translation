source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִשָּׁמְר֖וּ בְּ/נַפְשֽׁוֹתֵי/כֶ֑ם וְ/אַל תִּשְׂא֤וּ מַשָּׂא֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וַ/הֲבֵאתֶ֖ם בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/021.yaml
  text: 'Thus says Yahweh: Take care for yourselves[b][a], and do not carry a load on the Sabbath day or bring it in through the gates of Jerusalem.'
translation:
  language: pt
  text: 'Assim diz Yahweh: Cuidem de vocês mesmos[a] e não carreguem carga alguma[b] no dia de sábado, nem a levem para dentro pelos portões de Jerusalém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cuidem da própria vida” ou “Estejam atentos a vocês mesmos”. A expressão hebraica menciona literalmente “suas vidas” ou “suas pessoas” e indica cuidadosa vigilância de si mesmos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fardo”. Aqui, o sentido mais provável é o de um objeto físico transportado no sábado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em uma construção corrente, solene e reconhecível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הִשָּׁמְרוּ בְּנַפְשׁוֹתֵיכֶם
  choice: Tenham cuidado com vocês mesmos
  rationale: Reproduz o sentido idiomático do imperativo reflexivo — vigiar cuidadosamente a si mesmos — sem fazer com que נֶפֶשׁ pareça referir-se apenas à alma em contraste com o corpo.
- source_word: וְאַל תִּשְׂאוּ
  choice: e não carreguem
  rationale: No contexto da observância do sábado, נשׂא descreve de modo natural o ato concreto de transportar algo.
- source_word: מַשָּׂא
  choice: carga alguma
  rationale: Expressa um objeto físico transportado e evita a possível leitura figurada de “fardo”; “alguma” é idiomático depois da negação.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: Mantém explícito o substantivo “dia” e emprega a formulação natural do português moderno.
- source_word: וַהֲבֵאתֶם
  choice: nem a façam entrar
  rationale: O objeto, subentendido no hebraico, é retomado pelo pronome; “nem” coordena naturalmente a segunda ação abrangida pela proibição.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: pelos portões de Jerusalém
  rationale: Comunica o movimento de entrada na cidade através de seus acessos, de maneira clara em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama. “Yahweh” conserva o nome próprio no corpo do texto, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sentido de נֶפֶשׁ na expressão idiomática
  choice: vocês mesmos
  alternative: a própria vida; a própria alma
  rationale: Neste contexto, נֶפֶשׁ integra uma expressão de vigilância pessoal. A tradução evita impor uma dicotomia teológica entre alma e corpo, enquanto a nota preserva os componentes literais e as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética conserva solenidade sem arcaísmo; a proibição permanece concreta e direta.
