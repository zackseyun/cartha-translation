  text: אַל תִּֽהְיֵה לִ֖/י לִ/מְחִתָּ֑ה מַֽחֲסִ/י אַ֖תָּה בְּ/י֥וֹם רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/017.yaml
  text: Do not be a terror to me[b][a]; you are my refuge in the day of disaster.
translation:
  language: pt
  text: Não sejas para mim motivo de pavor[a]; tu és o meu refúgio no dia da calamidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «causa de consternação», «ruína» ou «objeto de temor».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֵה
  choice: Não sejas
  rationale: 'A partícula negativa com o imperfeito expressa aqui uma súplica: que Deus não seja ou não venha a ser aquilo que o substantivo seguinte descreve. «Não sejas» é natural, dignificado e preserva a força da petição.'
- source_word: לִי
  choice: para mim
  rationale: A preposição ל com o sufixo de primeira pessoa indica relação ou efeito. «Para mim» se encaixa naturalmente com «motivo de pavor».
- source_word: לִמְחִתָּה
  choice: motivo de pavor
  rationale: מְחִתָּה pode indicar terror, consternação ou ruína devastadora. «Motivo de pavor» expressa de modo claro que o profeta suplica que Deus não se torne fonte de temor para ele, sem eliminar as alternativas lexicais.
- source_word: מַחֲסִי
  choice: o meu refúgio
  rationale: מַחֲסֶה designa abrigo ou lugar de proteção. «Meu refúgio» é corrente em português e adequado à linguagem de oração.
- source_word: אַתָּה
  choice: tu és
  rationale: O pronome independente tem valor enfático. A formulação explícita «tu és» conserva essa ênfase no contraste com a súplica anterior.
- source_word: בְּיוֹם רָעָה
  choice: no dia da calamidade
  rationale: Neste contexto, רָעָה descreve adversidade, desgraça ou calamidade, não maldade moral. «No dia da calamidade» é claro e natural em português.
theological_decisions:
- issue: Se רָעָה deve ser traduzido com linguagem moral («mal») ou circunstancial («calamidade»)
  choice: calamidade
  alternative: mal; desgraça; adversidade
  rationale: O contexto trata de um tempo de aflição ou juízo no qual o SENHOR é o refúgio de Jeremias. «Calamidade» evita sugerir que o termo se refere aqui ao mal moral.
- issue: Como representar מְחִתָּה sem resolver indevidamente sua amplitude semântica
  choice: motivo de pavor
  alternative: terror; causa de consternação; ruína
  rationale: A escolha comunica a dimensão relacional da súplica — Deus não seja fonte de pavor para o profeta — enquanto a nota conserva os sentidos próximos de consternação e ruína.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Mantém-se «tu» para a invocação direta e solene, com construção simples e dignificada. A ordem das duas cláusulas preserva o contraste enfático do hebraico.
