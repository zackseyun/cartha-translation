source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִשְׁמְע֜וּ אֵלַ֗/י לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת וּ/לְ/בִלְתִּ֣י שְׂאֵ֣ת מַשָּׂ֗א וּ/בֹ֛א בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/הִצַּ֧תִּי אֵ֣שׁ בִּ/שְׁעָרֶ֗י/הָ וְ/אָֽכְלָ֛ה אַרְמְנ֥וֹת יְרוּשָׁלִַ֖ם וְ/לֹ֥א תִכְבֶּֽה־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/027.yaml
  text: But if you do not listen to me[a], to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem on the Sabbath day, then I will kindle a fire in its gates, and it will consume the palaces of Jerusalem[b], and it will not be quenched.
translation:
  language: pt
  text: Mas, se vocês não me ouvirem e não santificarem o dia de sábado, nem deixarem de carregar cargas[a] e de trazê-las pelas portas de Jerusalém no dia de sábado, então acenderei um fogo em suas portas. O fogo consumirá os palácios[b] de Jerusalém e não se apagará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “fardos”. A expressão hebraica se refere literalmente a levantar ou transportar uma carga.
    reason: lexical_alternative
  - marker: b
    text: Ou “edifícios fortificados” ou “cidadelas”. O termo hebraico pode designar palácios e construções de caráter defensivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: me ouvirem
  rationale: Preserva o idioma auditivo de שׁמע com אֶל, enquanto o sentido contextual de atender e obedecer continua implícito, sem ser imposto na tradução.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: santificando o dia de sábado
  rationale: O piel de קדשׁ significa separar ou tratar como santo. “Santificando” conserva diretamente essa ideia e se integra com naturalidade à condição precedente.
- source_word: וּלְבִלְתִּי שְׂאֵת מַשָּׂא
  choice: deixando de carregar cargas
  rationale: A combinação נשא + מַשָּׂא descreve levantar ou transportar uma carga. O plural genérico é natural em português no contexto da proibição de transportar mercadorias.
- source_word: וּבֹא בְּשַׁעֲרֵי יְרוּשָׁלִַם
  choice: e de trazê-las pelas portas de Jerusalém
  rationale: O objeto implícito de בוא são as cargas mencionadas. “Trazê-las pelas portas” expressa em português natural a entrada delas na cidade.
- source_word: וְהִצַּתִּי אֵשׁ בִּשְׁעָרֶיהָ
  choice: então porei fogo às suas portas
  rationale: O hiphil de יצת indica atear ou pôr fogo. “Então” explicita a consequência da construção condicional, e “suas” retoma naturalmente Jerusalém, substantivo feminino também em português.
- source_word: וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִַם
  choice: O fogo consumirá os palácios de Jerusalém
  rationale: O sujeito do verbo é o fogo. Repeti-lo evita uma referência pronominal ambígua em português. אַרְמְנוֹת pode designar palácios ou edifícios fortificados; “palácios” é a equivalência mais direta.
- source_word: וְלֹא תִכְבֶּה
  choice: e não se apagará
  rationale: כבה no qal significa apagar-se ou extinguir-se. A forma pronominal é idiomática em português e conserva a declaração de que o fogo não cessará.
theological_decisions:
- issue: Terminologia do sábado
  choice: dia de sábado
  alternative: o sábado
  rationale: O hebraico traz explicitamente יוֹם, “dia”; mantê-lo representa integralmente a expressão da fonte sem acrescentar interpretação doutrinária.
- issue: Relação entre ouvir e obedecer
  choice: me ouvirem
  alternative: me obedecerem
  rationale: A formulação conserva a imagem auditiva do hebraico e deixa que a exigência de obediência decorra do contexto, sem eliminar a amplitude semântica.
- issue: Estrutura condicional do juízo
  choice: então porei fogo
  alternative: e porei fogo
  rationale: “Então” torna clara a consequência já indicada pela sequência condicional hebraica, sem alterar o conteúdo do anúncio de juízo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com concordância brasileira natural (“vocês”). A repetição de “dia de sábado” acompanha a fonte. Os marcadores [a] e [b] foram posicionados junto aos termos a que suas notas efetivamente se referem; a personificação gramatical de Jerusalém não exige nota em português, pois “Jerusalém” também recebe normalmente referência feminina.
