  text: וְ/אָמַרְתָּ֣ אֲ֠לֵי/הֶם שִׁמְע֨וּ דְבַר יְהוָ֜ה מַלְכֵ֤י יְהוּדָה֙ וְ/כָל יְהוּדָ֔ה וְ/כֹ֖ל יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/020.yaml
  text: And say to them[a], “Hear the word of Yahweh, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem who enter through these gates.”
translation:
  language: pt
  text: 'E diga a eles: “Ouçam a palavra de Yahweh[a], reis de Judá, todo o povo de Judá e todos os habitantes de Jerusalém que entram por estas portas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma consonantal do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: E diga a eles
  rationale: O perfeito Qal com conjunção, no contexto de instrução profética, tem força de ordem sequencial. A formulação mantém a ligação com a ordem anterior e soa natural em português.
- source_word: שִׁמְעוּ
  choice: Escutem
  rationale: Imperativo plural. “Escutem” comunica tanto a audição quanto a atenção exigida pela proclamação profética, em linguagem atual.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e o peso da fala divina; o nome próprio יהוה é transliterado como “Yahweh” em vez de ser substituído por um título.
- source_word: מַלְכֵי יְהוּדָה
  choice: reis de Judá
  rationale: O sintagma funciona como vocativo após o imperativo. Em português, a colocação direta sem “ó” é clara, digna e contemporânea.
- source_word: וְכָל יְהוּדָה
  choice: todo o povo de Judá
  rationale: Judá é usado metonimicamente para a população do reino. A explicitação de “povo” evita que “todo Judá” seja entendido apenas como território.
- source_word: וְכֹל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: e todos os habitantes de Jerusalém
  rationale: A expressão participial designa os residentes da cidade; “habitantes” é precisa e natural.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: que entram por estes portões
  rationale: O particípio descreve os habitantes que passam pelos acessos indicados. Com verbo de movimento, “por” expressa naturalmente a passagem através dos portões.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal, enquanto a nota registra a substituição tradicional por “SENHOR”.
- issue: Alcance de וְכָל יְהוּדָה
  choice: todo o povo de Judá
  alternative: todo Judá
  rationale: A leitura metonímica referente à população é indicada pelo conjunto de grupos convocados. A explicitação evita ambiguidade geográfica sem acrescentar uma distinção teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Escutem” e o vocativo sem “ó” evitam solenidade arcaizante; “portões” distingue com clareza os acessos urbanos.
