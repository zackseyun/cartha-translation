  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אָר֤וּר הַ/גֶּ֨בֶר֙ אֲשֶׁ֣ר יִבְטַ֣ח בָּֽ/אָדָ֔ם וְ/שָׂ֥ם בָּשָׂ֖ר זְרֹע֑/וֹ וּ/מִן יְהוָ֖ה יָס֥וּר לִבּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/005.yaml
  text: 'Thus says Yahweh: Cursed is the man who trusts in man and makes flesh his strength[b][a], whose heart turns away from Yahweh.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Maldito o homem[a] que confia no ser humano, que faz da carne a sua força[b] e cujo coração se afasta de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O homem” traduz uma forma masculina singular hebraica usada aqui em sentido representativo; a advertência se aplica a qualquer pessoa.
    reason: cultural_note
  - marker: b
    text: Hebraico, literalmente, “faz da carne o seu braço”. “Braço” é uma imagem de força ou poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e verte o tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: אָרוּר
  choice: Maldito
  rationale: Equivalente português direto que mantém a força judicial e pactual da declaração.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: Conserva a forma masculina singular do hebraico, empregada aqui de modo representativo; uma nota esclarece seu alcance.
- source_word: יִבְטַח בָּאָדָם
  choice: confia no ser humano
  rationale: Expressa com naturalidade a confiança depositada em alguém mortal e distingue אָדָם do primeiro substantivo, sem limitar a referência ao sexo masculino.
- source_word: וְשָׂם בָּשָׂר זְרֹעוֹ
  choice: faz da carne a sua força
  rationale: Mantém a imagem bíblica da carne, associada à mortalidade e fragilidade humanas, e comunica o sentido idiomático de ‘braço’ como força ou poder.
- source_word: וּמִן יְהוָה יָסוּר לִבּוֹ
  choice: e cujo coração se afasta de Yahweh
  rationale: Preserva ‘coração’ como centro da vontade e da lealdade e apresenta o afastamento de Yahweh como a realidade interior ligada à confiança humana.
theological_decisions:
- issue: Masculino singular representativo na advertência
  choice: o homem
  alternative: a pessoa
  rationale: O hebraico emprega גֶּבֶר no masculino singular, mas a advertência tem alcance representativo. A tradução conserva a forma, com nota para evitar uma restrição indevida.
- issue: Imagem idiomática de זְרֹעוֹ
  choice: a sua força
  alternative: o seu braço
  rationale: ‘Braço’ é a imagem literal hebraica, mas neste contexto representa força ou poder. A tradução comunica o sentido no texto e registra a imagem literal em nota, evitando uma expressão pouco natural em português.
- issue: Sentido de בָּשָׂר
  choice: carne
  alternative: mortal
  rationale: Aqui ‘carne’ aponta para a fragilidade mortal humana, não necessariamente para uma natureza pecaminosa. O termo foi preservado para não eliminar a tensão imagética do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência profética foi mantida, e as imagens ‘carne’ e ‘coração’ foram preservadas sem lhes impor uma interpretação denominacional.
