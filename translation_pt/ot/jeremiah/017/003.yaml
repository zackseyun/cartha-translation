  text: הֲרָרִ/י֙ בַּ/שָּׂדֶ֔ה חֵילְ/ךָ֥ כָל אוֹצְרוֹתֶ֖י/ךָ לָ/בַ֣ז אֶתֵּ֑ן בָּמֹתֶ֕י/ךָ בְּ/חַטָּ֖את בְּ/כָל גְּבוּלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/003.yaml
  text: My mountain in the field—your wealth[a], all your treasures[c][b], and your high places because of sin throughout all your territory—I will give as plunder.
translation:
  language: pt
  text: Meu monte no campo[a] — sua riqueza[b], todos os seus tesouros e seus lugares altos, por causa do pecado em todo o seu território[c] — entregarei como despojo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ó meu monte no campo”. A frase hebraica é difícil e provavelmente se refere a Sião/Jerusalém, o monte do SENHOR.
    reason: alternative_reading
  - marker: b
    text: Ou “sua força” ou, menos provavelmente neste contexto, “seu exército”.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser entendido como “por pecado em todo o seu território” ou “em pecado por todo o seu território”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָרִי בַּשָּׂדֶה
  choice: Meu monte no campo
  rationale: Mantém a imagem concreta e a dificuldade sintática do hebraico. O possessivo favorece “meu monte”, provavelmente Sião/Jerusalém, enquanto “no campo” preserva a expressão espacial sem a explicar em excesso.
- source_word: חֵילְךָ
  choice: sua riqueza
  rationale: Embora חַיִל também possa significar força ou exército, o paralelismo com “todos os seus tesouros” e o destino como despojo favorecem o sentido econômico.
- source_word: כָל אוֹצְרוֹתֶיךָ
  choice: todos os seus tesouros
  rationale: O substantivo pode designar tesouros ou depósitos do tesouro; aqui, como objeto entregue ao saque, “tesouros” é claro e natural.
- source_word: לָבַז אֶתֵּן
  choice: entregarei como despojo
  rationale: Expressa naturalmente a fórmula de juízo “darei por despojo”. “Entregarei” explicita a transferência aos saqueadores sem alterar o sentido.
- source_word: בָּמֹתֶיךָ
  choice: seus lugares altos
  rationale: É a expressão tradicional e concisa para locais elevados de culto, preservando sua conotação religiosa sem acrescentar uma interpretação denominacional.
- source_word: בְּחַטָּאת בְּכָל גְּבוּלֶיךָ
  choice: por causa do pecado em todo o seu território
  rationale: Entende o primeiro ב como causal e o segundo como locativo/distributivo. A nota conserva outras relações sintáticas possíveis.
theological_decisions:
- issue: Referente de “meu monte no campo”
  choice: Preservar a frase como provável referência ao monte do SENHOR, Sião/Jerusalém
  alternative: Vocativo, “Ó meu monte no campo”, ou referência mais ampla à região montanhosa
  rationale: A expressão hebraica é difícil. O sufixo possessivo e o contexto de Jeremias favorecem Sião/Jerusalém, mas a tradução não substitui a imagem por esse nome e a nota registra a alternativa vocativa.
- issue: Relação de “por causa do pecado em todo o seu território”
  choice: Tratar a expressão como causa do juízo, associada aos lugares altos e à sentença inteira
  alternative: “por pecado em todo o seu território” ou “em pecado por todo o seu território”
  rationale: O valor causal é adequado ao contexto de juízo, mas a construção hebraica permite mais de uma vinculação; por isso, a ambiguidade é assinalada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem marcada por travessões procura conservar a antecipação dos objetos no hebraico e deixar claro que riqueza, tesouros e lugares altos serão entregues como despojo.
