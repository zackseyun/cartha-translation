id: JER.17.26
reference: Jeremiah 17:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָ֣אוּ מֵ/עָרֵֽי יְ֠הוּדָה וּ/מִ/סְּבִיב֨וֹת יְרוּשָׁלִַ֜ם וּ/מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מִן הַ/שְּׁפֵלָ֤ה וּ/מִן הָ/הָר֙ וּ/מִן הַ/נֶּ֔גֶב מְבִאִ֛ים עוֹלָ֥ה וְ/זֶ֖בַח וּ/מִנְחָ֣ה וּ/לְבוֹנָ֑ה וּ/מְבִאֵ֥י תוֹדָ֖ה בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/026.yaml
  text: And they will come from the cities of Judah and from the areas around Jerusalem[a], and from the land of Benjamin, and from the lowland, and from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, grain offerings and frankincense[c][b], and bringing thank offerings to the house of Yahweh.
translation:
  language: pt
  text: Virão das cidades de Judá, dos arredores de Jerusalém, da terra de Benjamim, da Sefelá[a], da região montanhosa e do Neguebe[b], trazendo holocaustos, sacrifícios, ofertas de cereais e olíbano, e trazendo ofertas de ação de graças à casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Sefelá é a região de colinas baixas de Judá, entre a região montanhosa e a planície costeira.
    reason: cultural_note
  - marker: b
    text: Ou “sul”; Neguebe é o nome da região ao sul de Judá.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o templo de Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאוּ
  choice: Virão
  rationale: O perfeito com waw, neste contexto profético e condicionado pelos versículos anteriores, expressa a consequência futura. A coordenação hebraica permanece perceptível na sequência do discurso.
- source_word: מֵעָרֵי יְהוּדָה
  choice: das cidades de Judá
  rationale: עָרִים abrange cidades e povoações; “cidades de Judá” é claro, natural e tradicional em português.
- source_word: וּמִסְּבִיבוֹת יְרוּשָׁלִַם
  choice: dos arredores de Jerusalém
  rationale: סְבִיבוֹת designa as áreas circundantes; “arredores” comunica isso de modo conciso e corrente.
- source_word: וּמֵאֶרֶץ בִּנְיָמִן
  choice: da terra de Benjamim
  rationale: אֶרֶץ refere-se aqui ao território associado à tribo de Benjamim; a formulação preserva a expressão geográfica hebraica.
- source_word: הַשְּׁפֵלָה
  choice: a Sefelá
  rationale: Neste inventário regional, o termo é o nome geográfico da zona de colinas baixas entre a região montanhosa de Judá e a planície costeira. A transliteração preserva essa referência específica.
- source_word: הָהָר
  choice: a região montanhosa
  rationale: Embora literalmente seja “o monte/a montanha”, em listas geográficas designa a região montanhosa de Judá.
- source_word: הַנֶּגֶב
  choice: o Neguebe
  rationale: O termo funciona aqui como nome da região meridional de Judá, não apenas como indicação genérica do sul.
- source_word: מְבִאִים
  choice: trazendo
  rationale: O particípio descreve a ação que acompanha a vinda das pessoas e introduz naturalmente a lista de dádivas cultuais.
- source_word: עוֹלָה
  choice: holocaustos
  rationale: O termo designa ofertas inteiramente queimadas. O plural português transmite o valor coletivo do singular hebraico neste contexto.
- source_word: זֶבַח
  choice: sacrifícios
  rationale: O singular hebraico tem sentido coletivo na enumeração; “sacrifícios” designa de modo natural as ofertas de animais abatidos.
- source_word: מִנְחָה
  choice: ofertas de cereal
  rationale: Em contexto cultual, מִנְחָה designa especificamente a oferta feita de produtos do cereal, não uma oferta genérica.
- source_word: לְבוֹנָה
  choice: olíbano
  rationale: לְבוֹנָה é especificamente a resina aromática conhecida como olíbano; a escolha evita reduzi-la ao sentido mais amplo de “incenso”.
- source_word: מְבִאֵי תוֹדָה
  choice: trazendo ofertas de gratidão
  rationale: A construção refere-se aos que trazem תּוֹדָה, provavelmente ofertas ou sacrifícios de ação de graças. “Ofertas de gratidão” preserva o caráter cultual e o sentido de agradecimento.
- source_word: בֵּית יְהוָה
  choice: à casa de Yahweh
  rationale: A expressão hebraica é preservada no texto, enquanto a nota esclarece que se refere ao templo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio divino. “Yahweh” o representa diretamente, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sentido cultual de תוֹדָה
  choice: ofertas de gratidão
  alternative: ações de graças; sacrifícios de ação de graças
  rationale: O contexto do templo e das ofertas favorece uma referência a dádivas cultuais de agradecimento. A formulação escolhida conserva essa dimensão sem determinar de modo excessivamente específico a modalidade do sacrifício.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os topônimos regionais “Sefelá” e “Neguebe”, esclarecidos em notas. “Olíbano” preserva a precisão botânica e cultual do hebraico; “casa de Yahweh” conserva a imagem original, com explicação cultural em nota.
