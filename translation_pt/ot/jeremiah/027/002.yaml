  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֵלַ֔/י עֲשֵׂ֣ה לְ/ךָ֔ מוֹסֵר֖וֹת וּ/מֹט֑וֹת וּ/נְתַתָּ֖/ם עַל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/002.yaml
  text: 'Thus said Yahweh to me: “Make for yourself bonds and yoke-bars[a], and put them on your neck.”'
translation:
  language: pt
  text: 'Assim me disse Yahweh: “Faça para você correias e barras de jugo[a] e coloque-as sobre o seu pescoço.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “amarras e barras”; isto é, as correias e as barras que formavam ou prendiam um jugo.'
    reason: Esclarece os dois componentes concretos do jugo e registra a amplitude lexical de מוֹסֵרוֹת.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim me disse
  rationale: Mantém a fórmula profética e, com o perfeito hebraico, apresenta a fala como dirigida ao profeta no passado narrativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em conformidade com a orientação do projeto.
- source_word: אֵלַי
  choice: me
  rationale: O pronome átono em “me disse” traduz naturalmente a preposição אֶל com o sufixo de primeira pessoa.
- source_word: עֲשֵׂה לְךָ
  choice: Faça para você
  rationale: Preserva a força imperativa e a nuance dativa/reflexiva de לְךָ em português corrente.
- source_word: מוֹסֵרוֹת
  choice: correias
  rationale: No contexto de um jugo, designa tiras ou amarras que prendem o aparelho; “correias” é concreto e compreensível.
- source_word: מֹטוֹת
  choice: barras de jugo
  rationale: Conserva a referência específica às barras ou travessas do jugo, sem generalizar o termo para o aparelho inteiro.
- source_word: וּנְתַתָּם
  choice: e coloque-as
  rationale: O perfeito com waw dá continuidade à ordem; o pronome feminino plural retoma naturalmente “correias e barras” em português.
- source_word: עַל צַוָּארֶךָ
  choice: sobre o seu pescoço
  rationale: Reproduz de modo claro a relação espacial expressa por עַל.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A fórmula profética permanece solene, enquanto os objetos simbólicos são descritos em linguagem concreta.
