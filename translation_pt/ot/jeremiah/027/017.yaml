  text: אַל תִּשְׁמְע֣וּ אֲלֵי/הֶ֔ם עִבְד֥וּ אֶת מֶֽלֶךְ בָּבֶ֖ל וִֽ/חְי֑וּ לָ֧/מָּה תִֽהְיֶ֛ה הָ/עִ֥יר הַ/זֹּ֖את חָרְבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/017.yaml
  text: Do not listen to them[a]. Serve the king of Babylon and live[b]. Why should this city become a ruin?
translation:
  language: pt
  text: Não deem ouvidos a eles[a]. Sirvam ao rei da Babilônia e vivam. Por que esta cidade haveria de se tornar uma ruína[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não lhes obedeçam”. O verbo hebraico pode significar tanto escutar como dar ouvidos no sentido de acatar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficar devastada”. O substantivo hebraico se refere à devastação ou ruína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֲלֵיהֶם
  choice: Não deem ouvidos a eles
  rationale: שׁמע com אֶל pode significar escutar, dar ouvidos ou obedecer. A expressão escolhida é natural em português e comunica tanto a atenção à mensagem quanto a ideia implícita de acatá-la.
- source_word: עִבְדוּ
  choice: Sirvam
  rationale: O imperativo de עבד, neste contexto, exige sujeição política e serviço ao rei da Babilônia. “Sirvam” preserva a amplitude do termo sem explicitar mais do que o hebraico.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: ao rei da Babilônia
  rationale: Tradução direta e natural da construção hebraica.
- source_word: וִחְיוּ
  choice: e vivam
  rationale: A sequência waw + imperativo coordena a exortação e também sugere resultado. “E vivam” mantém a concisão e a força do hebraico.
- source_word: לָמָּה תִהְיֶה
  choice: Por que ... haveria de se tornar
  rationale: A formulação transmite a pergunta retórica e o resultado futuro evitável indicado pelo contexto.
- source_word: הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Equivalente idiomático direto da construção demonstrativa hebraica.
- source_word: חָרְבָּה
  choice: uma ruína
  rationale: O substantivo designa um estado ou lugar de devastação. “Uma ruína” preserva sua forma nominal e oferece uma imagem concreta e clara.
