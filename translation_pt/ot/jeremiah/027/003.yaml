  text: וְ/שִׁלַּחְתָּ/ם֩ אֶל מֶ֨לֶךְ אֱד֜וֹם וְ/אֶל מֶ֣לֶךְ מוֹאָ֗ב וְ/אֶל מֶ֨לֶךְ֙ בְּנֵ֣י עַמּ֔וֹן וְ/אֶל מֶ֥לֶךְ צֹ֖ר וְ/אֶל מֶ֣לֶךְ צִיד֑וֹן בְּ/יַ֤ד מַלְאָכִים֙ הַ/בָּאִ֣ים יְרוּשָׁלִַ֔ם אֶל צִדְקִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/003.yaml
  text: And send them to the king of Edom[a], the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon, by the hand of the messengers who are coming to Jerusalem to Zedekiah king of Judah.
translation:
  language: pt
  text: Envie-os ao rei de Edom, ao rei de Moabe, ao rei dos amonitas[a], ao rei de Tiro e ao rei de Sidom, por meio dos mensageiros que vêm a Jerusalém, a Zedequias, rei de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Amom”; isto é, os amonitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתָּם
  choice: Envie-os
  rationale: O piel perfeito na sequência de instruções tem força de ordem. O imperativo em português comunica essa função com naturalidade; a conjunção hebraica liga esta ordem ao contexto anterior e não precisa ser reproduzida mecanicamente.
- source_word: מֶלֶךְ
  choice: rei de / rei dos
  rationale: A forma construta indica o rei associado a cada povo ou cidade. As contrações portuguesas dão fluidez à enumeração.
- source_word: בְּנֵי עַמּוֹן
  choice: amonitas
  rationale: Embora literalmente seja “filhos de Amom”, a expressão funciona aqui como designação étnica. “Amonitas” é clara e idiomática, enquanto a forma literal é preservada em nota.
- source_word: בְּיַד
  choice: por meio dos
  rationale: O idioma hebraico expressa agência ou mediação. “Por meio dos” transmite o sentido sem o artificialismo de “pela mão dos” em português contemporâneo.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Mantém o sentido lexical amplo sem especificar além do texto se eram embaixadores ou enviados de outra categoria oficial.
- source_word: הַבָּאִים
  choice: que estão vindo
  rationale: Preserva o valor progressivo do particípio substantivado e apresenta os mensageiros como aqueles que estão a caminho ou chegando.
- source_word: אֶל צִדְקִיָּהוּ
  choice: para se encontrar com Zedequias
  rationale: A repetição de אֶל marca Zedequias como a pessoa a quem os mensageiros se dirigem. A explicitação “para se encontrar com” evita em português a leitura momentânea de que Jerusalém estaria sendo enviada a Zedequias.
theological_decisions:
- issue: Expressão étnica masculina בְּנֵי עַמּוֹן
  choice: amonitas no texto, com a forma literal em nota
  alternative: filhos de Amom
  rationale: Neste contexto geopolítico, a expressão hebraica é uma designação convencional do povo amonita, não uma afirmação teológica sobre sexo ou descendência individual. A nota conserva a forma do original sem tornar a redação principal pouco natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração mantém a solenidade profética, enquanto “por meio dos” e “para se encontrar com” comunicam com clareza os idiomas e relações sintáticas do hebraico.
