source:
  edition: WLC
  text: וְ/אֶל צִדְקִיָּ֤ה מֶֽלֶךְ יְהוּדָה֙ דִּבַּ֔רְתִּי כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה לֵ/אמֹ֑ר הָבִ֨יאוּ אֶת צַוְּארֵי/כֶ֜ם בְּ/עֹ֣ל מֶֽלֶךְ בָּבֶ֗ל וְ/עִבְד֥וּ אֹת֛/וֹ וְ/עַמּ֖/וֹ וִֽ/חְיֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
translation:
  language: pt
  text: 'Também falei a Zedequias, rei de Judá, conforme todas estas palavras, dizendo: “Ponham seus pescoços sob o jugo do rei da Babilônia, sirvam a ele e ao seu povo e vivam[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“E vivam” também pode ser entendido como consequência ou finalidade: “e vocês viverão” ou “para que vivam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: O piel de דבר significa comumente “falar”; “falei” preserva a distinção em relação ao infinitivo לֵאמֹר, aqui expresso naturalmente pelos dois-pontos.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: Preserva o substantivo explícito “palavras” e comunica de modo natural que Jeremias dirigiu a Zedequias a mesma mensagem já apresentada.
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם בְּעֹל
  choice: Ponham o pescoço sob o jugo
  rationale: A tradução idiomática portuguesa conserva a imagem concreta do jugo e exprime submissão sem substituí-la por uma abstração.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Forma corrente em português para o construto hebraico e o nome geográfico.
- source_word: וְעִבְדוּ אֹתוֹ וְעַמּוֹ
  choice: sirvam a ele e ao seu povo
  rationale: “Servir” conserva o sentido político de sujeição; a repetição explícita evita que “sirvam-no e ao seu povo” soe artificial.
- source_word: וִחְיוּ
  choice: e vivam
  rationale: Mantém a forma imperativa e a concisão do hebraico, sem decidir se a relação é apenas coordenada, resultativa ou final.
- source_word: צִדְקִיָּה
  choice: Zedequias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome bíblico em português.
theological_decisions:
- issue: Submissão política ao domínio babilônico
  choice: Apresentar diretamente a ordem de se sujeitar ao rei da Babilônia e servir a ele e ao seu povo.
  alternative: Generalizar a ordem como humildade ou submissão espiritual.
  rationale: O texto trata de uma ordem profética histórica e política; a tradução preserva essa tensão sem espiritualizá-la.
- issue: Relação de וִחְיוּ com as ordens anteriores
  choice: “e vivam”
  alternative: “e vocês viverão” ou “para que vivam”
  rationale: A forma escolhida mantém a sequência imperativa do hebraico e não fixa como exclusiva uma leitura resultativa ou final; as possibilidades são registradas em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Os dois-pontos traduzem naturalmente לֵאמֹר; “o pescoço” funciona de modo distributivo para o grupo, embora o hebraico use o plural “seus pescoços”. O marcador [a] aparece no texto e corresponde à única nota.
