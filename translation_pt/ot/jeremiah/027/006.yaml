  text: וְ/עַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת כָּל הָ/אֲרָצ֣וֹת הָ/אֵ֔לֶּה בְּ/יַ֛ד נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַבְדִּ֑/י וְ/גַם֙ אֶת חַיַּ֣ת הַ/שָּׂדֶ֔ה נָתַ֥תִּי ל֖/וֹ לְ/עָבְדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/006.yaml
  text: And now I have given all these lands into the hand of Nebuchadnezzar king of Babylon[a], my servant[b]; and I have also given him the beasts of the field to serve him.
translation:
  language: pt
  text: E agora eu entreguei todas estas terras nas mãos de Nabucodonosor, rei da Babilônia[a], meu servo[b]; entreguei-lhe também os animais do campo para que o sirvam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também: “Nabucodrezar”, outra forma de transliterar o nome do rei.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “meu servo” indica que Nabucodonosor é usado como instrumento de Deus, não que sua conduta receba aprovação moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o marcador temporal que introduz a declaração divina em ligação com o contexto anterior.
- source_word: אָנֹכִי נָתַתִּי
  choice: eu entreguei
  rationale: O pronome explícito dá ênfase ao agente divino; “entreguei” expressa de modo natural a transferência de domínio indicada pelo perfeito נָתַתִּי.
- source_word: כָּל הָאֲרָצוֹת הָאֵלֶּה
  choice: todas estas terras
  rationale: “Terras” mantém a amplitude territorial do hebraico sem impor a noção política moderna de países.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a imagem hebraica de colocar algo sob o poder ou controle de alguém, usando uma expressão corrente em português.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabucodonosor, rei da Babilônia
  rationale: Emprega a forma consagrada do nome em português e traduz diretamente o título e o reino.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Mantém a designação teologicamente significativa do rei como agente a serviço de Deus; “escravo” destacaria indevidamente uma condição social que não é o foco.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais do campo
  rationale: Traduz a expressão coletiva de maneira clara e digna, preservando sua imagem; no contexto, refere-se especialmente aos animais não domesticados.
- source_word: נָתַתִּי לוֹ לְעָבְדוֹ
  choice: entreguei-lhe ... para que o sirvam
  rationale: Representa o destinatário לוֹ e o propósito ou resultado expresso pelo infinitivo לְעָבְדוֹ, ajustando o número do verbo ao plural natural “animais” em português.
theological_decisions:
- issue: Nabucodonosor chamado de servo de Deus
  choice: meu servo
  alternative: meu escravo
  rationale: A expressão apresenta o rei pagão como instrumento da ação soberana de Deus, sem afirmar aprovação moral de seu caráter ou de todos os seus atos. A tradução preserva essa tensão sem explicá-la dentro do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Nas mãos de” preserva a metáfora hebraica; a repetição de “entreguei” torna clara a estrutura da declaração e evita uma construção pesada.
