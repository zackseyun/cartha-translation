source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/גּ֜וֹי וְ/הַ/מַּמְלָכָ֗ה אֲשֶׁ֨ר לֹֽא יַעַבְד֤וּ אֹת/וֹ֙ אֶת נְבוּכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/אֵ֨ת אֲשֶׁ֤ר לֹֽא יִתֵּן֙ אֶת צַוָּאר֔/וֹ בְּ/עֹ֖ל מֶ֣לֶךְ בָּבֶ֑ל בַּ/חֶרֶב֩ וּ/בָ/רָעָ֨ב וּ/בַ/דֶּ֜בֶר אֶפְקֹ֨ד עַל הַ/גּ֤וֹי הַ/הוּא֙ נְאֻם יְהוָ֔ה עַד תֻּמִּ֥/י אֹתָ֖/ם בְּ/יָדֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/008.yaml
  text: And it shall be that the nation or the kingdom that will not serve him[a], Nebuchadnezzar king of Babylon, and that will not put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, declares Yahweh[c][b], until I have finished them by his hand.
translation:
  language: pt
  text: E acontecerá que a nação ou o reino[a] que não servir a Nabucodonosor, rei da Babilônia, e que não puser o seu pescoço sob o jugo do rei da Babilônia[b], eu castigarei aquela nação com a espada, a fome e a peste — declaração de Yahweh —, até que eu lhes dê fim pela mão dele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nação e o reino”. Os dois termos políticos formam uma advertência distributiva contra qualquer domínio que se recuse a servir à Babilônia.
    reason: lexical_alternative
  - marker: b
    text: “Pôr o pescoço sob o jugo” é uma imagem de submissão ao domínio do rei da Babilônia.
    reason: cultural_note
  - marker: c
    text: Ou “até que eu os consuma pela mão dele”. “Pela mão dele” significa por meio de Nabucodonosor.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Introduz uma consequência futura em registro profético, de modo natural e digno no português atual.
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: a nação ou o reino
  rationale: 'O hebraico liga os termos com ''e'', mas a advertência tem força distributiva: qualquer entidade política que se recuse a submeter-se será castigada. A nota preserva a forma alternativa.'
- source_word: יַעַבְדוּ אֹתוֹ אֶת נְבוּכַדְנֶאצַּר
  choice: não servir a ele, a Nabucodonosor
  rationale: עבד indica aqui serviço ou sujeição política. A repetição da preposição explicita naturalmente a aposição do nome sem eliminar o pronome hebraico.
- source_word: יִתֵּן אֶת צַוָּארוֹ בְּעֹל
  choice: puser o pescoço sob o jugo
  rationale: Mantém a imagem concreta do hebraico e comunica submissão ao domínio imperial.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: com a espada, com a fome e com a peste
  rationale: Preserva a tríade recorrente de juízo em Jeremias, com vocabulário claro e solene.
- source_word: אֶפְקֹד עַל
  choice: castigarei
  rationale: פקד com על, neste contexto de juízo, expressa punição; 'castigarei' comunica diretamente essa força.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Reproduz a fórmula profética nominal de modo conciso, distinguindo-a do simples verbo 'dizer'.
- source_word: עַד תֻּמִּי אֹתָם
  choice: até que eu lhes dê fim
  rationale: Expressa a ideia de levar ao fim ou completar o juízo sem especificar além do hebraico a maneira exata da destruição.
- source_word: בְּיָדוֹ
  choice: pela mão dele
  rationale: Conserva o idioma concreto de agência, referindo-se a Nabucodonosor como instrumento do juízo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
- issue: Alcance de עַד תֻּמִּי אֹתָם no juízo
  choice: até que eu lhes dê fim
  alternative: até que eu os consuma
  rationale: A escolha mantém a severidade e a finalidade do juízo, mas evita determinar que תמם descreva especificamente consumo, em vez de levar ao fim.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A metáfora do jugo e o idioma concreto da mão foram preservados; a ordem foi levemente ajustada para fluência sem eliminar a tensão entre o referente coletivo singular e o pronome plural posterior.
