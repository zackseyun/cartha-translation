  naturalness: «Servir a ele, a Nabucodonosor» soa redundante e pouco idiomático em português moderno. «Servir a Nabucodonosor» é claro, natural e preserva o sentido político de sujeição. Pequenos ajustes na enumeração e no possessivo tornam a frase mais fluente sem reduzir seu registro profético.
  terminology: «Nabucodonosor», «Babilônia», «jugo», «espada», «fome», «peste», «castigarei» e «Yahweh» são apropriados. «Declaração de Yahweh» representa bem a fórmula profética nominal. «Dar-lhes fim» conserva a finalidade destrutiva de תמם sem impor a imagem específica de «consumir».
