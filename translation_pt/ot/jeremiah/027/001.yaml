  text: בְּ/רֵאשִׁ֗ית מַמְלֶ֛כֶת יְהוֹיָקִ֥ם בֶּן יֹאושִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying[b],
translation:
  language: pt
  text: 'No início do reinado de Jeoaquim, filho de Josias, rei de Judá,[a] esta palavra veio a Jeremias da parte de Yahweh, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A referência a Jeoaquim é difícil neste contexto, pois os versículos 3 e 12 situam os acontecimentos no reinado de Zedequias. O texto hebraico deste versículo, porém, traz “Jeoaquim”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: No início do reinado de
  rationale: A expressão indica o período inicial do governo de um rei. “Reinado” comunica naturalmente o sentido temporal de מַמְלֶכֶת neste contexto.
- source_word: יְהוֹיָקִם בֶּן יֹאושִׁיָּהוּ
  choice: Jeoaquim, filho de Josias
  rationale: Emprega as formas dos nomes consagradas em português e mantém explicitamente a relação filial do hebraico.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta do título real e do território governado.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָה
  choice: esta palavra veio a Jeremias
  rationale: Preserva a fórmula profética hebraica e evita interpretar דָּבָר de modo mais específico como “mensagem”.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: מֵאֵת marca a procedência, e “da parte de” é idiomático em português. O nome divino é transliterado como “Yahweh”.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula que introduz o discurso direto a seguir; os dois-pontos sinalizam em português que a fala continua no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Identidade do rei no cabeçalho
  choice: Jeoaquim, conforme o texto massorético
  alternative: Zedequias, por harmonização com Jeremias 27:3 e 27:12
  rationale: A tradução segue o texto hebraico fornecido e não resolve por emenda a tensão histórica e contextual; a dificuldade é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais tradicionais de ampla compreensão. A sintaxe conserva a fórmula profética do hebraico sem deixar de ser legível; “dizendo” foi mantido porque introduz a fala do versículo seguinte.
