  source_fidelity: 'O texto reproduz com fidelidade a sequência instrucional dirigida a Jeremias: ordenar aos enviados que transmitam uma mensagem a seus superiores. Mantém corretamente a alternância hebraica entre “senhores deles” e “senhores de vocês”, bem como a fórmula profética, o título divino e os dois-pontos que introduzem a continuação da fala no versículo seguinte.'
