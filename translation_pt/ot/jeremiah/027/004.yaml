  text: וְ/צִוִּיתָ֣ אֹתָ֔/ם אֶל אֲדֹֽנֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כֹּ֥ה תֹֽאמְר֖וּ אֶל אֲדֹֽנֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/004.yaml
  text: 'And command them to say to their masters[a], ‘Thus says Yahweh of hosts, the God of Israel: Thus you shall say to your masters,’'
translation:
  language: pt
  text: 'Ordene-lhes que digam aos seus senhores[a]: “Assim diz Yahweh dos Exércitos, o Deus de Israel: Assim vocês dirão aos seus senhores:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aos senhores deles”; no fim do versículo, “aos senhores de vocês”. Aqui, o termo se refere a governantes humanos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתָ אֹתָם
  choice: Ordene-lhes
  rationale: O perfeito com waw integra uma sequência de instruções dirigidas a Jeremias; o imperativo comunica naturalmente essa força em português. O pronome retoma os enviados do contexto.
- source_word: אֶל אֲדֹנֵיהֶם / אֶל אֲדֹנֵיכֶם
  choice: aos seus senhores
  rationale: אדון designa aqui os superiores políticos dos enviados, isto é, seus reis. “Senhores” preserva o sentido de autoridade humana e funciona tanto para a terceira como para a segunda pessoa do plural em português.
- source_word: לֵאמֹר
  choice: que digam
  rationale: O infinitivo introduz o conteúdo da ordem; depois de “ordene-lhes”, a oração com “que” é idiomática em português moderno.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética convencional e seu tom solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título fixo, comunica de modo claro e reconhecível a ideia de hostes ou exércitos sob o comando divino.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta e o título pactual.
- source_word: כֹּה תֹּאמְרוּ
  choice: Assim vocês dirão
  rationale: Preserva a segunda pessoa do plural e a força diretiva da forma verbal, com legibilidade ampla no português moderno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o tetragrama como nome pessoal. “Yahweh” o representa diretamente, sem substituí-lo pelo título “Senhor”, e evita confusão com אֲדֹנֵיהֶם, que se refere a governantes humanos.
- issue: Sentido de אֲדֹנֵיהֶם / אֲדֹנֵיכֶם
  choice: senhores
  alternative: mestres; soberanos
  rationale: O contexto aponta para reis como superiores dos enviados. “Senhores” mantém o valor relacional e político do hebraico sem especificar no texto mais do que o original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência brasileira por “vocês”. A repetição de “Assim” e “aos seus senhores” foi mantida por refletir a estrutura deliberada do hebraico. O versículo termina com dois-pontos porque introduz a mensagem que continua no versículo seguinte.
