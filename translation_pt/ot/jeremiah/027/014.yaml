id: JER.27.14
reference: Jeremiah 27:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י הַ/נְּבִאִ֗ים הָ/אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֣לֶךְ בָּבֶ֑ל כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֥ים לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/014.yaml
  text: And do not listen to the words of the prophets who are saying to you[a], ‘You will not serve the king of Babylon,’ for they are prophesying a lie to you.
translation:
  language: pt
  text: 'E não deem ouvidos às palavras dos profetas que estão dizendo a vocês: “Vocês não servirão ao rei da Babilônia”[a], pois eles estão profetizando uma mentira a vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não sirvam ao rei da Babilônia”. A forma hebraica pode ser entendida como uma proibição, mas, neste contexto, é mais provável que expresse a falsa previsão dos profetas de que Judá não teria de servir à Babilônia.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַל
  choice: E não
  rationale: וְ liga a exortação ao contexto anterior, e אַל com o imperfeito expressa proibição; a formulação preserva o fluxo do discurso.
- source_word: תִּשְׁמְעוּ אֶל דִּבְרֵי
  choice: deem ouvidos às palavras
  rationale: שׁמע com אֶל e 'palavras' envolve escutar com atenção e dar crédito; 'dar ouvidos' é natural em português e evita reduzir o sentido à mera audição.
- source_word: הַנְּבִאִים
  choice: os profetas
  rationale: O artigo definido aponta para o grupo conhecido no contexto.
- source_word: הָאֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: que estão dizendo a vocês
  rationale: O particípio sugere fala em andamento ou reiterada; a expressão introduz diretamente o conteúdo citado.
- source_word: לֹא תַעַבְדוּ
  choice: Vocês não servirão
  rationale: Na fala profética citada, o imperfeito é melhor entendido como previsão sobre a sujeição a Babilônia, embora a forma também possa ser lida como proibição.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: ao rei da Babilônia
  rationale: Tradução clara e idiomática da construção hebraica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual o povo não deve dar ouvidos aos profetas.
- source_word: שֶׁקֶר
  choice: uma mentira
  rationale: O substantivo singular caracteriza o conteúdo da profecia como falso; 'uma mentira' conserva a força concreta da expressão.
- source_word: הֵם נִבְּאִים לָכֶם
  choice: eles estão profetizando ... a vocês
  rationale: A forma verbal descreve a atividade profética em curso dirigida aos ouvintes.
theological_decisions:
- issue: Natureza da mensagem dos falsos profetas
  choice: 'Entender לֹא תַעַבְדוּ como a falsa previsão: “Vocês não servirão ao rei da Babilônia”.'
  alternative: 'Entender a forma como uma ordem: “Não sirvam ao rei da Babilônia”.'
  rationale: No contexto, Jeremias combate profetas que negavam a futura sujeição a Babilônia. Ainda assim, a forma hebraica admite leitura proibitiva, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' torna explícito o destinatário plural do hebraico. 'Dar ouvidos' comunica escuta acompanhada de aceitação, adequada ao contexto de advertência.
