  text: וְ/אִם נְבִאִ֣ים הֵ֔ם וְ/אִם יֵ֥שׁ דְּבַר יְהוָ֖ה אִתָּ֑/ם יִפְגְּעוּ נָא֙ בַּֽ/יהוָ֣ה צְבָא֔וֹת לְ/בִלְתִּי בֹ֜אוּ הַ/כֵּלִ֣ים הַ/נּוֹתָרִ֣ים בְּ/בֵית יְהוָ֗ה וּ/בֵ֨ית מֶ֧לֶךְ יְהוּדָ֛ה וּ/בִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/018.yaml
  text: But if they are prophets[a], and if the word of Yahweh is with them, let them now plead with Yahweh of hosts that the vessels remaining in the house of Yahweh, in the house of the king of Judah[c][b], and in Jerusalem may not go to Babylon.
translation:
  language: pt
  text: Mas, se eles são profetas e se a palavra de Yahweh está com eles, que agora intercedam junto a Yahweh dos Exércitos[a], para que os utensílios que restam no templo de Yahweh, no palácio do rei de Judá[b] e em Jerusalém não vão para a Babilônia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «supliquem agora a Yahweh dos Exércitos». O verbo hebraico pode indicar súplica ou intercessão.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «na casa do rei de Judá».'
    reason: literal_rendering
  - marker: c
    text: O hebraico diz literalmente «não venham para a Babilônia»; em português, «não vão» corresponde naturalmente à perspectiva de quem fala em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם נְבִאִים הֵם
  choice: Mas, se eles são profetas
  rationale: A conjunção introduz um desafio condicional em contraste com o contexto anterior; “Mas” torna natural essa força discursiva sem eliminar a condição.
- source_word: וְאִם יֵשׁ דְּבַר יְהוָה אִתָּם
  choice: e se a palavra de Yahweh está com eles
  rationale: Preserva de perto a construção existencial e o idioma hebraico “está com eles”, sem reduzi-lo à ideia menos tensa de simplesmente possuir uma mensagem.
- source_word: יִפְגְּעוּ נָא בַּיהוָה צְבָאוֹת
  choice: que agora intercedam junto a Yahweh dos Exércitos
  rationale: פגע com ב pode indicar súplica ou intercessão. “Intercedam junto a” comunica naturalmente o pedido dirigido a Deus, e “agora” representa a partícula נָא, que acrescenta urgência.
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: os objetos que restam
  rationale: כֵּלִים designa os utensílios ou objetos do templo e do palácio. “Objetos” é claro e abrangente em português atual, sem sugerir apenas recipientes.
- source_word: בְּבֵית יְהוָה
  choice: no templo de Yahweh
  rationale: Embora בֵּית signifique literalmente “casa”, no contexto refere-se claramente ao templo; a formulação escolhida evita ambiguidade para o leitor moderno.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: no palácio do rei de Judá
  rationale: “Palácio” expressa o sentido contextual da “casa do rei” em português natural, embora a repetição hebraica de “casa” seja registrada em nota.
- source_word: לְבִלְתִּי בֹאוּ ... בָּבֶלָה
  choice: para que ... não vão para a Babilônia
  rationale: Reproduz a construção de finalidade ou prevenção e a direção indicada pelo ה locativo. “Vão” é idiomático do ponto de vista de quem fala em Jerusalém, embora o verbo hebraico seja literalmente “venham/cheguem”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a prática do projeto, sem substituí-lo por um título.
- issue: Sentido de יִפְגְּעוּ no contexto profético
  choice: intercedam junto a
  alternative: supliquem a; roguem a
  rationale: O desafio é que os alegados profetas demonstrem que a palavra divina está com eles mediante uma súplica em favor dos objetos restantes. “Intercedam” expressa essa função contextual sem afirmar que sua intercessão será eficaz.
- issue: Título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh Todo-Poderoso; SENHOR dos Exércitos
  rationale: A tradução conserva tanto o nome divino quanto a imagem plural de צְבָאוֹת, sem trocar o título por uma interpretação abstrata de poder.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe mantém o desafio condicional e a tensão do texto. “Templo” e “palácio” esclarecem os referentes de בֵּית, enquanto as notas registram as formas mais literais relevantes.
