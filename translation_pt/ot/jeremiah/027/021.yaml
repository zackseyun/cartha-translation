id: JER.27.21
reference: Jeremiah 27:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עַל הַ/כֵּלִ֗ים הַ/נּֽוֹתָרִים֙ בֵּ֣ית יְהוָ֔ה וּ/בֵ֥ית מֶֽלֶךְ יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/021.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel, concerning the vessels that remain in the house of Yahweh, in the house of the king of Judah[b], and in Jerusalem:'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel, a respeito dos utensílios que ainda restam na casa de Yahweh[a], na casa do rei de Judá[b] e em Jerusalém:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no palácio do rei de Judá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a declaração divina como fundamento do que precede, preservando de modo natural a força conectiva do hebraico.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Reproduz a fórmula profética de mensageiro e sua força performativa no discurso presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressão portuguesa clara para o título divino, abrangendo as hostes sob o comando de Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e natural da construção hebraica.
- source_word: עַל
  choice: a respeito de
  rationale: Aqui introduz o assunto da declaração divina, não uma ação hostil contra os objetos.
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: No contexto do templo e da corte, designa objetos ou artigos de uso; evita o sentido moderno excessivamente estreito de “vasos”.
- source_word: הַנּוֹתָרִים
  choice: que ainda restam
  rationale: Expressa que esses objetos permaneceram depois das remoções anteriores.
- source_word: בֵּית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a expressão literal “casa” e sua repetição no versículo, embora o referente seja o templo.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: na casa do rei de Judá
  rationale: Mantém a repetição lexical de בַּיִת; “palácio” é uma explicitação contextual possível.
- source_word: וִירוּשָׁלִָם
  choice: e em Jerusalém
  rationale: Torna explícitos em português a conjunção e o valor locativo da forma hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Alcance do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh das hostes
  rationale: “Exércitos” comunica em português atual a ideia de forças ou hostes sob o comando divino sem limitar o título a um único grupo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a fórmula profética, o nome Yahweh e a repetição hebraica de “casa”; as notas oferecem as explicitações contextuais “templo” e “palácio”.
