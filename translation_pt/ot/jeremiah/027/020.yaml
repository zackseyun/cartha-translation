  text: אֲשֶׁ֣ר לֹֽא לְקָחָ֗/ם נְבֽוּכַדְנֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל בַּ֠/גְלוֹת/וֹ אֶת יְכָונְיָ֨ה בֶן יְהוֹיָקִ֧ים מֶֽלֶךְ יְהוּדָ֛ה מִ/ירֽוּשָׁלִַ֖ם בָּבֶ֑לָ/ה וְ/אֵ֛ת כָּל חֹרֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/020.yaml
  text: which Nebuchadnezzar king of Babylon did not take when he exiled Jeconiah son of Jehoiakim[a], king of Judah, from Jerusalem to Babylon[c][b], along with all the nobles of Judah and Jerusalem.
translation:
  language: pt
  text: os quais Nabucodonosor, rei da Babilônia, não levou quando deportou Jeconias, filho de Jeoaquim, rei de Judá, de Jerusalém para a Babilônia, juntamente com todos os nobres[a] de Judá e de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Nobres» também pode ser traduzido por «autoridades» ou «homens de destaque».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: os quais
  rationale: Pronome relativo que retoma os utensílios do templo mencionados no versículo anterior; o plural explicita naturalmente o antecedente em português.
- source_word: לֹא לְקָחָם
  choice: não levou
  rationale: O perfeito qal negado descreve uma ação passada; «levou» é natural e mantém o sentido amplo do verbo.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabucodonosor, rei da Babilônia
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português e preserva o título em aposição.
- source_word: בַּגְלוֹתוֹ
  choice: quando deportou
  rationale: O infinitivo construto com ב tem valor temporal, e «deportou» comunica de modo conciso o exílio forçado.
- source_word: יְכָונְיָה
  choice: Jeconias
  rationale: Forma tradicional e reconhecível em português para este nome real hebraico.
- source_word: בֶן יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: filho de Jeoaquim, rei de Judá
  rationale: Preserva diretamente a relação filial e a identificação régia de Jeconias.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: de Jerusalém para a Babilônia
  rationale: Reproduz o movimento desde a origem até o destino indicado pelo hebraico; o artigo com Babilônia é idiomático em português.
- source_word: וְאֵת כָּל חֹרֵי יְהוּדָה וִירוּשָׁלִָם
  choice: juntamente com todos os nobres de Judá e de Jerusalém
  rationale: חֹרֵי designa aqui homens da elite sociopolítica; «nobres» é preciso, enquanto «juntamente com» deixa clara a deportação conjunta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi ajustada para evitar que «de Jerusalém para a Babilônia» parecesse modificar apenas o verbo de maneira obscura, sem alterar as relações sintáticas do hebraico.
