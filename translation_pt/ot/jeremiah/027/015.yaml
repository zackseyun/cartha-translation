  text: כִּ֣י לֹ֤א שְׁלַחְתִּי/ם֙ נְאֻם יְהוָ֔ה וְ/הֵ֛ם נִבְּאִ֥ים בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר לְמַ֨עַן הַדִּיחִ֤/י אֶתְ/כֶם֙ וַ/אֲבַדְתֶּ֔ם אַתֶּ֕ם וְ/הַ/נְּבִאִ֖ים הַֽ/נִּבְּאִ֥ים לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/015.yaml
  text: For I did not send them[a], declares Yahweh, and they are prophesying falsely in my name, so that I may drive you out[b], and you will perish—you and the prophets who are prophesying to you.
translation:
  language: pt
  text: Pois eu não os enviei — declara Yahweh —, e eles estão profetizando falsamente[a] em meu nome, para que eu expulse vocês[b] e vocês pereçam — vocês e os profetas que estão profetizando para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estão profetizando uma mentira em meu nome”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu desterre vocês”; o verbo hebraico pode expressar a ideia de afastar, expulsar ou fazer alguém ser desterrado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a ligação explicativa com a advertência anterior e soa natural no registro profético em português.
- source_word: לֹא שְׁלַחְתִּים
  choice: eu não os enviei
  rationale: Reproduz o qal perfeito na primeira pessoa com sufixo masculino plural, de modo direto e idiomático.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e representa diretamente o nome divino יהוה.
- source_word: נִבְּאִים
  choice: estão profetizando
  rationale: A forma participial indica atividade em andamento; a locução verbal portuguesa conserva esse aspecto.
- source_word: בִּשְׁמִי
  choice: em meu nome
  rationale: Mantém o idioma hebraico que envolve falar sob o nome e a autoridade de Yahweh.
- source_word: לַשָּׁקֶר
  choice: falsamente
  rationale: É uma formulação natural em português para o uso adverbial da expressão, sem perder a alternativa mais literal ‘uma mentira’, registrada em nota.
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva a relação de finalidade ou resultado expressa no hebraico sem resolver a tensão teológica do enunciado.
- source_word: הַדִּיחִי אֶתְכֶם
  choice: eu os expulse
  rationale: No contexto do exílio, o hifil de נדח aponta para afastar ou banir o povo; ‘expulse’ é claro e conciso.
- source_word: וַאֲבַדְתֶּם
  choice: e vocês pereçam
  rationale: O valor prospectivo da forma verbal é mantido após ‘para que’; ‘pereçam’ conserva o sentido amplo de chegar à ruína.
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: os profetas que estão profetizando para vocês
  rationale: Conserva a repetição enfática entre o substantivo e o particípio, bem como o destinatário indicado por לָכֶם.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; ‘Yahweh’ preserva o nome pactual sem substituí-lo por um título.
- issue: Finalidade ou resultado introduzido por לְמַעַן
  choice: para que eu os expulse
  alternative: de modo que eu os expulse
  rationale: A tradução mantém a formulação de finalidade do hebraico e sua tensão teológica, sem explicar ou atenuar a relação entre a falsa profecia e o juízo divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões destacam naturalmente a fórmula profética e a retomada enfática de ‘vocês’. A tradução preserva tanto o aspecto contínuo dos particípios quanto a tensão da oração de finalidade.
