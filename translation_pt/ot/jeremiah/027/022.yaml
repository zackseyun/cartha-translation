base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/022.yaml
  text: They will be brought to Babylon[a], and there they will remain until the day I attend to them, declares Yahweh[b]. Then I will bring them up and restore them to this place.
translation:
  language: pt
  text: Serão levados para a Babilônia e lá permanecerão até o dia em que eu cuidar deles[a] — declara Yahweh. Então eu os farei subir[b] e os trarei de volta a este lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu os visitarei”. O verbo hebraico pode significar voltar a atenção para alguém, visitá-lo ou intervir em relação a ele, seja para juízo, seja para benefício. Aqui, o que vem em seguida indica restauração.'
    reason: lexical_alternative
  - marker: b
    text: “Fazer subir” é a expressão literal hebraica e uma maneira comum de descrever o retorno do exílio para a terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּבֶלָה
  choice: para a Babilônia
  rationale: O he direcional acrescentado ao nome do lugar indica movimento em direção à Babilônia; esta é a formulação natural em português.
- source_word: יוּבָאוּ
  choice: Serão levados
  rationale: 'O hofal de בוא expressa ação passiva: os objetos serão transportados por outros.'
- source_word: וְשָׁמָּה יִהְיוּ
  choice: e lá permanecerão
  rationale: Embora היה signifique literalmente “ser/estar”, com o advérbio locativo a construção indica permanência continuada.
- source_word: פָּקְדִי אֹתָם
  choice: eu cuidar deles
  rationale: פקד pode indicar visitar, voltar a atenção para alguém ou intervir, para juízo ou benefício. A continuação promete restauração, favorecendo aqui um sentido benéfico, sem eliminar a amplitude lexical na nota.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz de modo digno e corrente a fórmula profética e conserva o nome divino.
- source_word: וְהַעֲלִיתִים
  choice: eu os farei subir
  rationale: Preserva a imagem do hifil de עלה, usada para a subida da Babilônia de volta à terra, sem reduzi-la simplesmente a “retornar”.
- source_word: וַהֲשִׁיבֹתִים
  choice: e os trarei de volta
  rationale: O hifil de שוב com objeto significa fazer retornar ou trazer de volta; a formulação também se ajusta naturalmente aos objetos mencionados no contexto.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: a este lugar
  rationale: Mantém o substantivo genérico “lugar” do hebraico, sem explicitar Jerusalém ou Judá além do que o versículo diz.
theological_decisions:
- issue: Sentido de פקד no contexto da restauração
  choice: ação favorável expressa por “cuidar deles”
  alternative: “visitá-los”, que pode admitir intervenção favorável ou punitiva
  rationale: As orações seguintes apresentam a ação divina como retorno e restauração. A tradução principal torna esse sentido contextual inteligível, enquanto a nota conserva a amplitude e a tensão do verbo hebraico.
- issue: Imagem espacial de עלה no retorno do exílio
  choice: preservar “farei subir”
  alternative: “trarei de volta”
  rationale: A imagem da subida tem valor próprio na linguagem hebraica do retorno à terra e é compreensível em português; a oração seguinte já explicita o retorno.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período mantém tom profético digno, conserva o nome Yahweh e preserva a imagem hebraica de “fazer subir”. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
