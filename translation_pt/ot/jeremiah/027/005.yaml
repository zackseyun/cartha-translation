reference: Jeremiah 27:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָנֹכִ֞י עָשִׂ֣יתִי אֶת הָ/אָ֗רֶץ אֶת הָ/אָדָ֤ם וְ/אֶת הַ/בְּהֵמָה֙ אֲשֶׁר֙ עַל פְּנֵ֣י הָ/אָ֔רֶץ בְּ/כֹחִ/י֙ הַ/גָּד֔וֹל וּ/בִ/זְרוֹעִ֖/י הַ/נְּטוּיָ֑ה וּ/נְתַתִּ֕י/הָ לַ/אֲשֶׁ֖ר יָשַׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/005.yaml
  text: I myself made the earth[a], mankind, and the animals that are on the face of the earth, by my great power and by my outstretched arm, and I give it to whomever is right in my eyes.
translation:
  language: pt
  text: Eu mesmo fiz a terra, o ser humano[a] e os animais que estão sobre a face da terra, com o meu grande poder e com o meu braço estendido, e a entrego a quem considero adequado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade”; o singular hebraico pode representar toda a raça humana.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a quem é reto aos meus olhos”; isto é, a quem julgo correto ou apropriado.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: אָנֹכִי
  choice: Eu mesmo
  rationale: O pronome independente dá ênfase ao sujeito já expresso no verbo; “Eu mesmo” preserva essa ênfase em português natural.
- source_word: עָשִׂיתִי
  choice: fiz
  rationale: O verbo עשה significa normalmente “fazer”; “fiz” evita importar o verbo técnico “criar”, que não aparece no texto.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: A enumeração de terra, humanidade e animais aponta para o mundo terrestre em sentido amplo, não apenas para uma região.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: O singular com artigo tem valor representativo e designa a humanidade; “o ser humano” conserva o singular genérico com clareza moderna.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: Embora singular em hebraico, o substantivo é coletivo; o plural é a forma natural em português e evita restringi-lo a gado.
- source_word: אֲשֶׁר עַל־פְּנֵי הָאָרֶץ
  choice: que estão sobre a face da terra
  rationale: Mantém a imagem e o tom elevado da expressão hebraica sem deixar de ser compreensível.
- source_word: בְּכֹחִי הַגָּדוֹל
  choice: com o meu grande poder
  rationale: A preposição instrumental é expressa naturalmente por “com” em português.
- source_word: וּבִזְרוֹעִי הַנְּטוּיָה
  choice: e com o meu braço estendido
  rationale: Preserva a conhecida imagem antropomórfica hebraica da atuação poderosa de Deus.
- source_word: וּנְתַתִּיהָ
  choice: e a entrego
  rationale: O perfeito pode declarar aqui a prerrogativa soberana e vigente de Deus; o presente comunica esse valor no contexto. “Entrego” exprime a concessão de domínio ou posse.
- source_word: לַאֲשֶׁר יָשַׁר בְּעֵינַי
  choice: a quem é reto aos meus olhos
  rationale: Reproduz a construção hebraica sem converter explicitamente o adjetivo em ideia de agrado; a possível referência à pessoa ou à escolha divina é registrada em nota.
theological_decisions:
- issue: Sentido genérico de הָאָדָם no contexto da criação
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: A expressão representa a raça humana coletivamente. “O ser humano” conserva o singular hebraico e comunica o sentido genérico sem sugerir que se trata apenas de um indivíduo masculino.
- issue: Referente de יָשַׁר em לַאֲשֶׁר יָשַׁר בְּעֵינַי
  choice: a quem é reto aos meus olhos
  alternative: a quem me parece certo; àquele que é agradável aos meus olhos
  rationale: A sintaxe permite entender אֲשֶׁר como referente pessoal (“quem é reto”) ou mais amplamente como aquilo que Deus considera certo. A tradução principal segue de perto a forma pessoal, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantêm-se as imagens bíblicas “face da terra”, “braço estendido” e “aos meus olhos”, sem arcaísmos desnecessários.
