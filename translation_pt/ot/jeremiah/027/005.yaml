  naturalness: O texto é claro e de registro bíblico moderno. «Sobre a face da terra» e «braço estendido» são naturais nesse registro. A formulação final proposta torna a frase mais idiomática e evita a leitura moralizante de «reto».
  terminology: «O ser humano» comunica adequadamente o singular genérico הָאָדָם; «animais», «grande poder» e «braço estendido» são escolhas apropriadas. «Entrego» expressa bem a concessão de posse ou domínio.
