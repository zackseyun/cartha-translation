base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/019.yaml
  text: 'For thus says Yahweh of Armies concerning the pillars[a], the Sea, the stands[b], and the rest of the vessels that remain in this city:'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos a respeito das colunas, do Mar[a], dos suportes[b] e dos demais utensílios que ficaram nesta cidade:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mar” era o grande reservatório de bronze do templo.
    reason: cultural_note
  - marker: b
    text: Ou “bases”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da declaração anterior e mantém com naturalidade a ligação discursiva.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem portuguesa corrente e digna.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz o título צְבָאוֹת de modo concreto e inteligível.
- source_word: אֶל
  choice: a respeito de
  rationale: Neste contexto, introduz o assunto da declaração, não destinatários inanimados.
- source_word: הָעַמֻּדִים
  choice: as colunas
  rationale: Designa com clareza as grandes colunas arquitetônicas do templo.
- source_word: הַיָּם
  choice: o Mar
  rationale: Conserva a designação tradicional do grande reservatório do templo; a inicial maiúscula indica um objeto específico.
- source_word: הַמְּכֹנוֹת
  choice: os suportes
  rationale: Termo amplo e natural para as estruturas que sustentavam as bacias, sem especificar além da evidência lexical.
- source_word: יֶתֶר הַכֵּלִים
  choice: os demais utensílios
  rationale: Expressa o restante dos objetos do inventário do templo em português claro.
- source_word: הַנּוֹתָרִים
  choice: que ficaram
  rationale: Transmite o sentido contextual de objetos deixados ou ainda presentes na cidade.
- source_word: בָּעִיר הַזֹּאת
  choice: nesta cidade
  rationale: Tradução locativa direta, referindo-se a Jerusalém sem inserir o nome ausente do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Tradução do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos Senhores dos Exércitos
  rationale: A escolha preserva o plural e a imagem militar do título sem acrescentar “celestiais”, ausente do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação mantém o tom profético solene, a enumeração do hebraico e os termos específicos do mobiliário do templo.
