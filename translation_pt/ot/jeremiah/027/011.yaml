id: JER.27.11
reference: Jeremiah 27:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/גּ֗וֹי אֲשֶׁ֨ר יָבִ֧יא אֶת צַוָּאר֛/וֹ בְּ/עֹ֥ל מֶֽלֶךְ בָּבֶ֖ל וַֽ/עֲבָד֑/וֹ וְ/הִנַּחְתִּ֤י/ו עַל אַדְמָת/וֹ֙ נְאֻם יְהוָ֔ה וַֽ/עֲבָדָ֖/הּ וְ/יָ֥שַׁב בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/011.yaml
  text: But the nation that brings its neck under the yoke of the king of Babylon and serves him[a], I will let remain on its own land, declares Yahweh[b], and it will till it and dwell in it.
translation:
  language: pt
  text: Mas a nação que colocar o pescoço sob o jugo do rei da Babilônia e o servir, eu a deixarei permanecer em sua própria terra[a] — declara Yahweh —, e ela cultivará essa terra[b] e nela habitará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “eu a deixarei em sua terra” ou “eu lhe darei descanso em sua terra”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ela a trabalhará”, isto é, trabalhará a terra; também pode ser traduzido como “ela a lavrará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹי
  choice: a nação
  rationale: No contexto de povos politicamente submetidos à Babilônia, גּוֹי tem sentido coletivo e político; “nação” é claro e natural.
- source_word: יָבִיא אֶת צַוָּארוֹ בְּעֹל
  choice: colocar o pescoço sob o jugo
  rationale: Preserva a imagem concreta hebraica da submissão, sem reduzi-la a uma formulação abstrata.
- source_word: עֹל
  choice: jugo
  rationale: A imagem do jugo é central no capítulo e representa a sujeição política ao domínio babilônico.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução direta e convencional da cadeia construta hebraica.
- source_word: וַעֲבָדוֹ
  choice: e o servir
  rationale: Expressa serviço e submissão ao rei da Babilônia, mantendo a amplitude política de עבד.
- source_word: וְהִנַּחְתִּיו עַל אַדְמָתוֹ
  choice: eu a deixarei permanecer em sua própria terra
  rationale: O hifil comunica que Yahweh permitirá que a nação permaneça em seu território; “própria” explicita naturalmente o sufixo possessivo.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz de modo digno e corrente a fórmula profética e translitera o nome divino.
- source_word: וַעֲבָדָהּ
  choice: ela cultivará essa terra
  rationale: Com a terra como objeto, עבד indica trabalhá-la ou cultivá-la. A explicitação de “essa terra” evita uma sequência pronominal pouco clara em português.
- source_word: וְיָשַׁב בָּהּ
  choice: e nela habitará
  rationale: Mantém a referência à terra e o registro profético digno de ישב.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Agente humano e ação divina na permanência na terra
  choice: A nação se submete ao rei da Babilônia, e Yahweh permite que ela permaneça em sua terra
  alternative: Apresentar a permanência apenas como resultado político da submissão
  rationale: 'A redação conserva a tensão do texto: a nação serve ao rei babilônico, mas é Yahweh quem declara que a deixará permanecer.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem do jugo e a fórmula profética foram preservadas; referentes pronominais foram explicitados apenas onde necessário para evitar ambiguidade artificial em português.
