  text: וְ֠/אַתֶּם אַל תִּשְׁמְע֨וּ אֶל נְבִיאֵי/כֶ֜ם וְ/אֶל קֹֽסְמֵי/כֶ֗ם וְ/אֶל֙ חֲלֹמֹ֣תֵי/כֶ֔ם וְ/אֶל עֹֽנְנֵי/כֶ֖ם וְ/אֶל כַּשָּׁפֵי/כֶ֑ם אֲשֶׁר הֵ֞ם אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֥לֶךְ בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/009.yaml
  text: But you[a], do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who are saying to you, ‘You will not serve the king of Babylon.’
translation:
  language: pt
  text: 'Mas vocês não deem ouvidos aos seus profetas, aos seus adivinhos, aos seus sonhos[a], aos seus agoureiros nem aos seus feiticeiros, que lhes dizem: “Vocês não servirão ao rei da Babilônia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus sonhadores”. O hebraico diz literalmente “aos seus sonhos”, mas, nesta lista, o termo pode representar aqueles que alegam receber mensagens por meio de sonhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mas vocês
  rationale: A conjunção com o pronome independente destaca os destinatários e, no contexto, tem força contrastiva; “Mas vocês” expressa isso naturalmente.
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: não deem ouvidos a
  rationale: A construção significa escutar ou atender alguém. “Não deem ouvidos” comunica a proibição de acolher a mensagem sem reduzir o sentido ao simples ato de ouvir.
- source_word: נְבִיאֵיכֶם
  choice: seus profetas
  rationale: Mantém o termo comum para נביא e o possessivo, que associa esses profetas aos povos destinatários sem acrescentar “falsos”, ausente do hebraico.
- source_word: קֹסְמֵיכֶם
  choice: seus adivinhos
  rationale: קסם designa a prática da adivinhação; “adivinhos” é direto, atual e compreensível.
- source_word: חֲלֹמֹתֵיכֶם
  choice: seus sonhos
  rationale: A forma hebraica significa literalmente “seus sonhos”. Embora o paralelismo possa sugerir pessoas que alegam receber revelações por sonhos, o texto traduzido preserva a forma concreta e a ambiguidade, explicando a possibilidade metonímica em nota.
- source_word: עֹנְנֵיכֶם
  choice: seus agoureiros
  rationale: O termo se refere a praticantes de presságios ou prognósticos ocultos. “Agoureiros” preserva essa ideia sem especificar um método incerto, como observar nuvens.
- source_word: כַּשָּׁפֵיכֶם
  choice: seus feiticeiros
  rationale: כשף se refere à prática de feitiçaria; “feiticeiros” é a correspondência portuguesa clara e contextual.
- source_word: אֲשֶׁר הֵם אֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: que lhes dizem
  rationale: Reproduz de modo natural a oração relativa e introduz diretamente o conteúdo reiterado da mensagem.
- source_word: לֹא תַעַבְדוּ
  choice: Vocês não servirão
  rationale: 'No discurso relatado, o imperfeito é entendido como predição: esses agentes afirmam que a sujeição ao rei da Babilônia não ocorrerá. A tradução evita lê-lo indevidamente como ordem negativa.'
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: ao rei da Babilônia
  rationale: Tradução direta da cadeia construta, com a regência exigida por “servir” em português.
theological_decisions:
- issue: Como apresentar os profetas e demais agentes sem lhes atribuir legitimidade nem acrescentar explicitamente que são falsos
  choice: Manter os títulos do hebraico e deixar que a ordem “não deem ouvidos” indique que sua mensagem não deve ser aceita.
  alternative: Acrescentar “falsos profetas” ou “supostos profetas”.
  rationale: O versículo os chama simplesmente de “seus profetas”. Inserir “falsos” explicitaria uma avaliação contextual verdadeira, mas não lexicalmente presente nesta frase.
- issue: Se לֹא תַעַבְדוּ expressa predição ou proibição
  choice: 'Predição: “Vocês não servirão”.'
  alternative: 'Proibição: “Não sirvam”.'
  rationale: A frase é o conteúdo da mensagem desses agentes. No contexto de Jeremias 27, eles negam que os povos ficarão sujeitos à Babilônia; não estão meramente ordenando resistência.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural. A enumeração mantém o ritmo profético. “Dar ouvidos” é idiomático e amplamente compreensível; “agoureiros” conserva a distinção entre adivinhação, presságios e feitiçaria. A nota preserva a forma literal e a possível metonímia de חֲלֹמֹתֵיכֶם.
