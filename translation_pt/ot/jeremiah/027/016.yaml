  text: וְ/אֶל הַ/כֹּהֲנִים֩ וְ/אֶל כָּל הָ/עָ֨ם הַ/זֶּ֜ה דִּבַּ֣רְתִּי לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י נְבִֽיאֵי/כֶ֗ם הַֽ/נִּבְּאִ֤ים לָ/כֶם֙ לֵ/אמֹ֔ר הִנֵּ֨ה כְלֵ֧י בֵית יְהוָ֛ה מוּשָׁבִ֥ים מִ/בָּבֶ֖לָ/ה עַתָּ֣ה מְהֵרָ֑ה כִּ֣י שֶׁ֔קֶר הֵ֖מָּה נִבְּאִ֥ים לָ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/016.yaml
  text: 'And to the priests and to all this people I spoke[a], saying, “Thus says Yahweh: Do not listen to the words of your prophets who are prophesying to you, saying, ‘Behold, the vessels of the house of Yahweh are being brought back from Babylon now, quickly,’ for they are prophesying falsely to you.”'
translation:
  language: pt
  text: 'E falei aos sacerdotes e a todo este povo: “Assim diz Yahweh: Não deem ouvidos às palavras dos seus profetas, que lhes profetizam: ‘Eis que os objetos da Casa de Yahweh estão sendo trazidos de volta da Babilônia agora, sem demora[a].’ Pois o que eles lhes profetizam é falsidade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão devolvidos da Babilônia muito em breve”. Em hebraico, literalmente, “agora, depressa”, enfatizando a iminência alegada pelos profetas.'
    reason: Alternativa lexical para a forma passiva de “trazidos de volta” e esclarecimento da expressão temporal hebraica.
lexical_decisions:
- source_word: וְאֶל הַכֹּהֲנִים וְאֶל כָּל הָעָם הַזֶּה
  choice: Também falei aos sacerdotes e a todo este povo
  rationale: “Também” dá continuidade ao discurso e representa a conjunção; a repetição das preposições hebraicas é expressa naturalmente em português. “Todo este povo” mantém o coletivo singular com demonstrativo.
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: 'falei ... :'
  rationale: Os dois-pontos introduzem em português atual o conteúdo indicado pelo hebraico “falei, dizendo”, evitando uma construção artificial sem perder sua função.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética tradicional e verte diretamente o nome divino.
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: Não deem ouvidos a
  rationale: Expressão portuguesa idiomática que comunica obedecer ou dar atenção, e não apenas perceber sons.
- source_word: דִּבְרֵי נְבִיאֵיכֶם
  choice: as palavras dos seus profetas
  rationale: Mantém o substantivo concreto “palavras” e a relação possessiva do hebraico.
- source_word: הַנִּבְּאִים לָכֶם
  choice: que profetizam a vocês
  rationale: Conserva a atividade contínua do particípio e os destinatários explícitos.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Interjeição corrente e digna que preserva a força de chamar a atenção do público plural.
- source_word: כְלֵי בֵית יְהוָה
  choice: os utensílios da Casa de Yahweh
  rationale: “Utensílios” abrange os objetos cultuais, enquanto “Casa de Yahweh” conserva a expressão hebraica sem reduzi-la silenciosamente a “templo”.
- source_word: מוּשָׁבִים
  choice: estão sendo trazidos de volta
  rationale: Representa o particípio passivo-causativo e a alegação de uma restauração já iminente.
- source_word: עַתָּה מְהֵרָה
  choice: agora, sem demora
  rationale: Mantém os dois elementos hebraicos e destaca a urgência alegada pelos falsos profetas.
- source_word: כִּי שֶׁקֶר הֵמָּה נִבְּאִים לָכֶם
  choice: O que eles profetizam a vocês é mentira
  rationale: Expressa de modo natural a predicação hebraica de falsidade, sem introduzir uma identificação denominacional dos profetas além do que o texto afirma.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio e segue a decisão terminológica fornecida.
- issue: Natureza da mensagem dos profetas
  choice: O que eles profetizam a vocês é mentira
  alternative: eles profetizam falsamente a vocês
  rationale: A formulação mantém שֶׁקֶר como predicação substantiva e não resolve além do texto como se toda a identidade ou atividade profética dessas pessoas estivesse em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa foi levemente naturalizada, mas a fórmula profética, o nome divino, a expressão “Casa de Yahweh” e a intensidade temporal do hebraico foram preservados. O marcador da nota foi colocado junto à expressão que ela explica.
