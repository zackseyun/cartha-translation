base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/013.yaml
  text: Why will you and your people die by the sword, by famine, and by pestilence, just as the LORD has spoken concerning the nation that will not serve the king of Babylon?
translation:
  language: pt
  text: Por que você e o seu povo haveriam de morrer pela espada, pela fome e pela peste, conforme o SENHOR falou a respeito da nação que não servir ao rei da Babilônia?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה תָמוּתוּ
  choice: Por que ... haveriam de morrer
  rationale: Expressa naturalmente a pergunta retórica e preserva a forma verbal plural, cujo sujeito inclui o rei e seu povo.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: pela espada, pela fome e pela peste
  rationale: Mantém a tríade tradicional de calamidades e o paralelismo do hebraico.
- source_word: יַעֲבֹד אֶת מֶלֶךְ בָּבֶל
  choice: servir ao rei da Babilônia
  rationale: O verbo עבד, neste contexto político, indica sujeição e serviço ao soberano babilônico.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino no texto hebraico.
theological_decisions:
- issue: Força da comparação introduzida por כַּאֲשֶׁר
  choice: conforme o SENHOR falou
  alternative: assim como o SENHOR falou
  rationale: Preserva a ligação explícita entre a advertência e o pronunciamento divino sem acrescentar uma interpretação sobre seu modo de cumprimento.
- issue: Aspecto de אֲשֶׁר לֹא יַעֲבֹד
  choice: a nação que não servir
  alternative: a nação que não serve
  rationale: O futuro do subjuntivo apresenta a formulação como aplicável à nação que se recusar a servir, coerente com a advertência profética, sem restringi-la a uma identificação já consumada.
translation_notes:
  register: Português moderno, digno e de leitura corrente, com tratamento por “você”, adequado ao singular אַתָּה e compreensível no âmbito brasileiro. A formulação conserva a pergunta retórica, a tríade profética e a tensão entre advertência e anúncio divino.
