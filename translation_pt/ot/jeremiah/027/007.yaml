  text: וְ/עָבְד֤וּ אֹת/וֹ֙ כָּל הַ/גּוֹיִ֔ם וְ/אֶת בְּנ֖/וֹ וְ/אֶֽת בֶּן בְּנ֑/וֹ עַ֣ד בֹּא עֵ֤ת אַרְצ/וֹ֙ גַּם ה֔וּא וְ/עָ֤בְדוּ ב/וֹ֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדֹלִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
translation:
  language: pt
  text: Todas as nações o servirão, bem como a seu filho e ao filho de seu filho[a], até que chegue o tempo para a sua própria terra[b]; então muitas nações e grandes reis farão com que até ele lhes sirva[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a seu filho e ao filho de seu filho». A expressão indica a continuidade da dinastia e também pode ser traduzida por «a seu filho e a seu neto».
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, «até que chegue o tempo de sua terra» — isto é, o tempo determinado referente à própria terra da Babilônia.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico provavelmente significa que muitas nações e grandes reis sujeitarão a Babilônia ao serviço. Uma formulação mais literal poderia ser: «servir-se-ão dele» ou «o usarão para serviço».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ אֹתוֹ
  choice: servirão a ele
  rationale: Neste contexto político, עבד indica submissão ou serviço a um governante ou império; «servirão a ele» expressa naturalmente a vassalagem nacional.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם designa aqui entidades políticas sob o domínio babilônico; «nações» preserva o alcance geopolítico sem conotação religiosa indevida.
- source_word: וְאֶת בְּנוֹ וְאֶת בֶּן בְּנוֹ
  choice: a seu filho e ao filho de seu filho
  rationale: A formulação mantém de perto o hebraico e a referência à sucessão dinástica, sem decidir se a expressão deve ser entendida estritamente como «neto».
- source_word: עַד בֹּא עֵת אַרְצוֹ
  choice: até que chegue o tempo de sua própria terra
  rationale: A expressão hebraica é compacta e aponta para o tempo determinado referente à própria terra do rei, isto é, a Babilônia; «própria» torna clara a referência sem inserir explicitamente «juízo» no texto.
- source_word: גַּם הוּא
  choice: até ele
  rationale: 'A expressão enfatiza a inversão: aquele que dominava também ficará sujeito. Em português, «até ele» conserva essa ênfase no interior da oração.'
- source_word: וְעָבְדוּ בוֹ
  choice: farão com que até ele os sirva
  rationale: עבד com ב aqui indica que outros imporão serviço a ele ou o usarão como servo, não que o servirão. A construção escolhida comunica a inversão de poder e preserva o campo lexical de «servir».
- source_word: גּוֹיִם רַבִּים וּמְלָכִים גְּדֹלִים
  choice: muitas nações e grandes reis
  rationale: A tradução mantém o paralelismo e o alcance político da expressão hebraica.
theological_decisions:
- issue: A inversão da sorte da Babilônia na oração final
  choice: O versículo anuncia que, ao chegar o tempo determinado para a terra da Babilônia, ela própria será submetida por muitas nações e grandes reis.
  alternative: Uma tradução mais rígida poderia dizer que muitas nações e grandes reis «se servirão dele» ou «o usarão para serviço».
  rationale: O contexto mais amplo de Jeremias apresenta o domínio babilônico como temporário e seguido pelo juízo sobre a própria Babilônia. A sintaxe de וְעָבְדוּ בוֹ favorece a ideia de serviço imposto, mas a nota registra a forma mais literal e sua ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se «filho de seu filho» no texto para refletir diretamente a forma hebraica, enquanto a nota oferece «neto». A repetição de «servir» preserva o jogo lexical e a inversão política do original.
