  naturalness: 'Há dois ajustes seguros de idiomaticidade: «o servirão» é mais fluente do que «servirão a ele» nesta sequência de objetos, e «lhes sirva» é mais natural e inequívoco do que «os sirva» no português moderno. A formulação «o tempo de sua própria terra» é pouco natural; «o tempo para a sua própria terra» comunica o sentido contextual sem introduzir explicitamente o juízo.'
  terminology: «Nações», «servir», «filho» e «grandes reis» mantêm o registro político e formal do original. A nota final deve evitar apresentar «se servirão dele» como uma tradução literal simples, pois em português pode sugerir apenas tirar proveito dele; convém explicitar o sentido de usar/sujeitar para serviço.
