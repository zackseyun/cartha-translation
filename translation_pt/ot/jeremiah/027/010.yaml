  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֣ים לָ/כֶ֑ם לְמַ֨עַן הַרְחִ֤יק אֶתְ/כֶם֙ מֵ/עַ֣ל אַדְמַתְ/כֶ֔ם וְ/הִדַּחְתִּ֥י אֶתְ/כֶ֖ם וַ/אֲבַדְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/010.yaml
  text: For they are prophesying lies to you[a], in order to remove you from your land; and I will drive you out[c][b], and you will perish.
translation:
  language: pt
  text: Pois eles profetizam mentiras para vocês[a], para afastá-los de sua terra[b]; e eu os expulsarei[c], e vocês perecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falsidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mandá-los para longe de sua terra”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico passa aqui a indicar explicitamente a ação divina: “eu os expulsarei, e vocês perecerão”.'
    reason: textual_clarification
lexical_decisions:
- source_word: שֶׁקֶר
  choice: mentiras
  rationale: O substantivo denota falsidade ou engano. O plural idiomático “mentiras” soa natural em português com “profetizam” e comunica o caráter falso das mensagens sem alterar o sentido coletivo do hebraico.
- source_word: נִבְּאִים לָכֶם
  choice: profetizam a vocês
  rationale: O particípio nifal de נבא expressa aqui uma ação em curso. No contexto, o presente “profetizam” preserva esse valor e é mais natural do que uma perífrase progressiva em português.
- source_word: לְמַעַן
  choice: para
  rationale: A preposição introduz propósito ou resultado pretendido. “Para” preserva essa relação de modo claro e corrente.
- source_word: הַרְחִיק אֶתְכֶם מֵעַל אַדְמַתְכֶם
  choice: afastá-los de sua terra
  rationale: O hifil de רחק é causativo e indica fazer ficar distante ou afastar. “Afastá-los de sua terra” mantém a separação espacial e evita acrescentar uma forma específica de deslocamento.
- source_word: אַדְמַתְכֶם
  choice: sua terra
  rationale: Embora אֲדָמָה possa significar solo ou chão, neste contexto de exílio refere-se naturalmente ao território onde o povo vive.
- source_word: וְהִדַּחְתִּי אֶתְכֶם
  choice: e eu os expulsarei
  rationale: O hifil de נדח transmite a ideia de impelir para longe, expulsar ou banir. “Expulsarei” é vigoroso, natural e adequado ao contexto de exílio.
- source_word: וַאֲבַדְתֶּם
  choice: e vocês perecerão
  rationale: אבד indica perecer ou chegar à ruína. “Perecerão” preserva a gravidade da declaração sem especificar indevidamente o modo da destruição.
theological_decisions:
- issue: Agência na sequência do juízo
  choice: 'Os profetas anunciam mentiras com o propósito ou resultado de afastar o povo de sua terra; em seguida, Deus declara explicitamente: “eu os expulsarei”.'
  alternative: Entender os falsos profetas como agentes implícitos de toda a remoção, sem destacar a ação divina subsequente.
  rationale: A sintaxe hebraica distingue a finalidade introduzida por לְמַעַן הַרְחִיק da primeira pessoa explícita em וְהִדַּחְתִּי. A tradução conserva essa mudança de agência e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. A formulação mantém a progressão sintática do hebraico e distingue a profecia mentirosa da ação divina explicitamente declarada.
