base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/004.yaml
  text: 'This is what you shall say to him: ‘This is what Yahweh says: Behold[a], what I have built I am tearing down, and what I have planted I am uprooting, that is, the whole land.’'
translation:
  language: pt
  text: 'Assim você lhe dirá: “Assim diz Yahweh: Eis que estou derrubando o que construí e arrancando o que plantei, isto é, toda a terra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica אֶרֶץ pode designar uma terra ou região específica, ou a terra em sentido mais amplo, isto é, o mundo inteiro. Aqui, o contexto imediato do juízo sobre Judá favorece o sentido de terra ou região sob julgamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹּאמַר אֵלָיו
  choice: Assim você lhe dirá
  rationale: כֹּה introduz a mensagem a ser transmitida; o imperfeito, no contexto de instrução profética, expressa o que o mensageiro deve dizer. A formulação é natural e digna em português.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e verte o nome divino יְהוָה como nome próprio, em vez de substituí-lo por um título.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Marca atenção e ênfase solene, mantendo o peso profético sem recorrer a uma expressão excessivamente coloquial.
- source_word: אֲשֶׁר בָּנִיתִי אֲנִי הֹרֵס
  choice: estou derrubando o que construí
  rationale: O particípio הֹרֵס indica ação em curso ou iminente. “Derrubando” conserva a imagem da construção e soa natural em português.
- source_word: וְאֵת אֲשֶׁר נָטַעְתִּי אֲנִי נֹתֵשׁ
  choice: e arrancando o que plantei
  rationale: “Arrancando” preserva a imagem agrícola de retirar pela raiz e mantém o contraste recorrente em Jeremias entre construir/plantar e derrubar/arrancar.
- source_word: וְאֶת כָּל הָאָרֶץ הִיא
  choice: isto é, toda esta terra
  rationale: A expressão hebraica é elíptica e provavelmente esclarece o alcance das ações anteriores. “Esta terra” aponta naturalmente para a terra em questão no contexto, embora “toda a terra” ou “o mundo inteiro” sejam possibilidades lexicais conforme o sentido de אֶרֶץ.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Alcance de הָאָרֶץ
  choice: toda esta terra
  alternative: toda a terra; o mundo inteiro
  rationale: No contexto imediato de Jeremias, a referência mais provável é à terra submetida ao juízo, especialmente Judá. A nota preserva a amplitude lexical possível de אֶרֶץ sem impor um alcance universal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, sem perder o paralelismo das imagens. “Eis que” conserva a solenidade profética; “você” evita regionalismo excessivo e mantém clareza internacional.
