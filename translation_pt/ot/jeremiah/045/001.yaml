  text: הַ/דָּבָ֗ר אֲשֶׁ֤ר דִּבֶּר֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֶל בָּר֖וּךְ בֶּֽן נֵֽרִיָּ֑ה בְּ/כָתְב/וֹ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֤לֶּה עַל סֵ֨פֶר֙ מִ/פִּ֣י יִרְמְיָ֔הוּ בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/001.yaml
  text: 'The word that Jeremiah the prophet spoke to Baruch son of Neriah when he wrote these words in a scroll at the mouth of Jeremiah[a], in the fourth year of Jehoiakim son of Josiah, king of Judah, saying:'
translation:
  language: pt
  text: 'A palavra que o profeta Jeremias falou a Baruque, filho de Nerias, quando este escreveu estas palavras num rolo, ditadas por Jeremias[a], no quarto ano de Jeoaquim, filho de Josias, rei de Judá, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da boca de Jeremias”; isto é, sob o ditado de Jeremias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Preserva a fórmula profética tradicional e o campo semântico de דָּבָר, que aqui pode denotar palavra ou mensagem.
- source_word: דִּבֶּר
  choice: falou
  rationale: Equivalente direto e natural do verbo דבר no contexto da introdução narrativa.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Traduz diretamente o título que identifica a função de Jeremias.
- source_word: בְּכָתְבוֹ
  choice: quando este escreveu
  rationale: A construção com infinitivo tem sentido temporal. O demonstrativo “este” esclarece, sem ambiguidade em português, que o sujeito da escrita é Baruque.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: No contexto de ditado e registro escrito, “palavras” expressa melhor o sentido textual do que “coisas” ou “assuntos”.
- source_word: עַל סֵפֶר
  choice: num rolo
  rationale: סֵפֶר designa aqui um documento escrito, provavelmente um rolo; “num rolo” é corrente e evita a possível impressão anacrônica de um livro encadernado.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: ditadas por Jeremias
  rationale: A expressão idiomática significa literalmente “da boca de Jeremias” e, neste contexto, indica que Baruque escreveu sob o ditado oral de Jeremias. A forma literal é preservada na nota.
- source_word: בַּשָּׁנָה הָרְבִעִית
  choice: no quarto ano
  rationale: Tradução direta da fórmula cronológica.
- source_word: לִיהוֹיָקִים
  choice: de Jeoaquim
  rationale: Na fórmula de datação régia, a preposição ל marca o rei cujo reinado fornece a referência cronológica.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula introdutória hebraica e prepara a fala do versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fórmula profética “A palavra” e o fecho “dizendo” preservam o registro formal do hebraico; “ditadas por Jeremias” comunica naturalmente o sentido do idioma hebraico, cuja forma literal consta na nota.
