base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel, concerning you, Baruch:'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Deus de Israel, a seu respeito[a], Baruque:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre você”; menos provavelmente, “contra você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Assim
  rationale: Introduz a fórmula profética de mensageiro de modo corrente, solene e fiel ao hebraico.
- source_word: אָמַר
  choice: diz
  rationale: Embora a forma hebraica seja qatal, na fórmula כֹּה אָמַר ela introduz performativamente o oráculo; o presente é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta e preserva a conhecida designação pactual.
- source_word: עָלֶיךָ
  choice: a seu respeito
  rationale: Expressa o sentido contextual de על com a pessoa a quem se refere a mensagem, sem impor a ideia de hostilidade.
- source_word: בָּרוּךְ
  choice: Baruque
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; sua transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de עָלֶיךָ
  choice: a seu respeito
  alternative: contra você
  rationale: O contexto apresenta uma palavra referente a Baruque; o valor hostil é possível para a preposição em outros contextos, mas é menos provável aqui e não deve ser imposto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Assim diz” conserva o tom da fórmula profética; “a seu respeito” mantém a ambiguidade lexical relevante sem sugerir hostilidade como leitura principal.
