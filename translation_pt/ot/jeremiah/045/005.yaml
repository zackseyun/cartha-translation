base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/005.yaml
  text: And you—are you seeking great things for yourself? Do not seek them, for behold, I am bringing disaster on all flesh, declares the LORD. But I will give you your life as plunder in every place where you go.
translation:
  language: pt
  text: E você — está buscando grandes coisas para si mesmo? Não as busque, pois eis que estou trazendo calamidade sobre toda a humanidade, declara o SENHOR. Mas, por onde quer que você for, eu lhe darei a sua vida como despojo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְדֹלוֹת
  choice: grandes coisas
  rationale: Mantém a expressão ampla e deliberadamente não especificada do hebraico.
- source_word: רָעָה
  choice: calamidade
  rationale: No contexto, denota desgraça ou desastre trazido como juízo, não maldade moral.
- source_word: כָּל־בָּשָׂר
  choice: toda a humanidade
  rationale: A expressão idiomática hebraica refere-se aqui a todos os seres humanos, com maior naturalidade em português do que a tradução literal 'toda carne'.
- source_word: נַפְשְׁךָ
  choice: a sua vida
  rationale: Neste contexto de sobrevivência, נֶפֶשׁ significa a própria vida, e não uma entidade abstrata chamada 'alma'.
- source_word: לְשָׁלָל
  choice: como despojo
  rationale: 'Preserva a metáfora militar: a vida de Baruque lhe será concedida como o ganho que alguém consegue retirar de uma situação de devastação.'
- source_word: עַל כָּל־הַמְּקֹמוֹת אֲשֶׁר תֵּלֶךְ־שָּׁם
  choice: por onde quer que você for
  rationale: Expressa naturalmente em português a abrangência distributiva de 'em todos os lugares aos quais você for'.
theological_decisions:
- issue: Identificação do nome divino יהוה
  choice: o SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida, sem acrescentar uma vocalização ao texto principal.
- issue: Alcance de כָּל־בָּשָׂר
  choice: toda a humanidade
  alternative: toda carne
  rationale: Interpreta a expressão segundo seu uso humano neste oráculo, sem ampliar explicitamente o juízo aos animais nem restringi-lo a um grupo específico.
- issue: Força da promessa de sobrevivência
  choice: eu lhe darei a sua vida como despojo
  alternative: você escapará com vida
  rationale: Mantém a imagem teologicamente significativa e sóbria do hebraico, em vez de reduzi-la a uma paráfrase.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O travessão após 'E você' conserva a ênfase contrastiva do pronome hebraico. A ordem final foi ajustada para soar natural sem perder o sentido abrangente da promessa.
