  text: אָמַ֨רְתָּ֙ אֽוֹי נָ֣א לִ֔/י כִּֽי יָסַ֧ף יְהוָ֛ה יָג֖וֹן עַל מַכְאֹבִ֑/י יָגַ֨עְתִּי֙ בְּ/אַנְחָתִ֔/י וּ/מְנוּחָ֖ה לֹ֥א מָצָֽאתִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/003.yaml
  text: You said[a], ‘Woe is me now, for Yahweh has added sorrow to my pain. I am weary with my groaning, and I have found no rest.’
translation:
  language: pt
  text: 'Você disse: “Ai de mim![a] Pois Yahweh acrescentou tristeza à minha dor. Estou exausto de tanto gemer e não encontrei descanso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Ah, ai de mim!” A partícula hebraica intensifica o grito de lamento e aflição.'
    reason: alternativa lexical
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Você disse
  rationale: O qal perfeito na segunda pessoa masculina singular introduz a queixa de Baruque; o pretérito perfeito é natural no contexto narrativo.
- source_word: אֽוֹי נָא לִי
  choice: Ai de mim!
  rationale: אוי é um grito de lamento e aflição. Aqui, נָא reforça emocionalmente o clamor; em português, a exclamação comunica essa intensidade sem a formulação pouco natural “por favor”.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do lamento e mantém clara a relação explicativa.
- source_word: יָסַף
  choice: acrescentou
  rationale: 'Preserva o sentido concreto do qal perfeito de יסף: somar uma nova aflição ao sofrimento já existente.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יָגוֹן
  choice: tristeza
  rationale: Expressa a dimensão emocional de pesar ou aflição e permanece distinta de מַכְאוֹב, “dor”.
- source_word: עַל מַכְאֹבִי
  choice: à minha dor
  rationale: Após יסף, עַל indica que a tristeza foi acrescentada a uma dor já existente.
- source_word: יָגַעְתִּי
  choice: Estou exausto
  rationale: O perfeito descreve o estado resultante de sofrimento contínuo; esta forma comunica com naturalidade o esgotamento presente.
- source_word: בְּאַנְחָתִי
  choice: de tanto gemer
  rationale: אַנְחָה pode indicar gemido ou suspiro. A expressão portuguesa apresenta o gemer contínuo como causa ou circunstância do esgotamento.
- source_word: וּמְנוּחָה לֹא מָצָאתִי
  choice: e não encontrei descanso
  rationale: Tradução direta que conserva a imagem de procurar e não achar repouso ou alívio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A fala direta conserva o tom pessoal e angustiado da queixa de Baruque.
