  text: חֲמָסִ֤/י וּ/שְׁאֵרִ/י֙ עַל בָּבֶ֔ל תֹּאמַ֖ר יֹשֶׁ֣בֶת צִיּ֑וֹן וְ/דָמִ/י֙ אֶל יֹשְׁבֵ֣י כַשְׂדִּ֔ים תֹּאמַ֖ר יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/035.yaml
  text: “My violence and my flesh be upon Babylon,” says the inhabitant of Zion[b][a]. “And my blood be upon the inhabitants of Chaldea,” says Jerusalem.
translation:
  language: pt
  text: “A violência que sofri e a minha carne caiam sobre a Babilônia”, diz a moradora de Sião.[a] “E o meu sangue caia sobre os habitantes da Caldeia”, diz Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o meu corpo”. O termo hebraico é tradicionalmente entendido aqui como “carne”, embora também tenham sido propostas outras derivações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי
  choice: a violência que sofri
  rationale: Embora a forma seja literalmente «minha violência», no contexto da queixa de Sião ela indica a violência praticada contra ela. A formulação explicita essa relação sem atribuir a violência à própria Sião.
- source_word: וּשְׁאֵרִי
  choice: e a minha carne
  rationale: O sentido tradicional «carne» se ajusta ao paralelismo com «meu sangue» e preserva a imagem corporal do hebraico.
- source_word: עַל בָּבֶל
  choice: caiam sobre a Babilônia
  rationale: 'A cláusula nominal tem força imprecatória: Sião pede que a responsabilidade ou as consequências da violência recaiam sobre a Babilônia. «Caiam sobre» comunica esse valor em português natural.'
- source_word: תֹּאמַר
  choice: diz
  rationale: O imperfeito introduz aqui, em estilo profético, a fala personificada; o presente é a forma natural em português.
- source_word: יֹשֶׁבֶת צִיּוֹן
  choice: a moradora de Sião
  rationale: O particípio feminino singular personifica Sião como mulher que nela habita. «Moradora» conserva o gênero e evita introduzir a expressão diferente «filha de Sião».
- source_word: וְדָמִי
  choice: e o meu sangue
  rationale: Refere-se ao sangue derramado de Jerusalém e mantém o paralelismo com a violência e a carne.
- source_word: אֶל יֹשְׁבֵי כַשְׂדִּים
  choice: caia sobre os habitantes da Caldeia
  rationale: Embora אֶל normalmente signifique «a/para», o paralelismo transmite uma imprecação dirigida aos habitantes da Caldeia. O verbo elíptico é explicitado a partir da primeira linha.
- source_word: כַשְׂדִּים
  choice: Caldeia
  rationale: Depois de «habitantes de», o termo é entendido territorialmente, produzindo uma construção clara e corrente em português.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome próprio.
theological_decisions:
- issue: Força imprecatória das duas declarações
  choice: «caiam/caia sobre»
  alternative: «estejam sobre» ou uma reprodução puramente nominal
  rationale: O contexto e o paralelismo indicam que Sião/Jerusalém pede que a culpa ou as consequências de seu sofrimento recaiam sobre seus opressores. A tradução mantém a imprecação sem definir mais precisamente se o foco é culpa, punição ou vingança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação feminina de Sião e Jerusalém foi preservada. A sintaxe foi levemente explicitada para comunicar a imprecação elíptica do hebraico.
