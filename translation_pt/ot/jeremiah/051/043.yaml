base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/043.yaml
  text: Her cities have become a desolation[a], a dry land and a desert, a land where no one lives[c][b], and through which no son of man passes.
translation:
  language: pt
  text: As cidades dela se tornaram uma desolação[a], uma terra seca e um deserto[b], uma terra em cujas cidades ninguém mora e pelas quais nenhum ser humano passa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma devastação»; o termo hebraico também pode transmitir horror ou espanto diante da ruína.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «terra ressequida e estepe».'
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz literalmente «nenhum homem» e «nenhum filho de ser humano»; ambas são expressões genéricas para habitantes e viajantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֶיהָ
  choice: As cidades dela
  rationale: O sufixo feminino singular retoma Babilônia, personificada como mulher no contexto. A formulação preserva essa referência sem soar artificial em português.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: שַׁמָּה indica aqui devastação e estado de abandono; «desolação» mantém a força do juízo profético.
- source_word: אֶרֶץ צִיָּה וַעֲרָבָה
  choice: terra seca e deserto
  rationale: צִיָּה descreve uma região ressequida, e עֲרָבָה uma planície árida ou região desértica. A tradução é clara e conserva os dois elementos da expressão hebraica.
- source_word: אֶרֶץ לֹא יֵשֵׁב בָּהֵן כָּל אִישׁ
  choice: terra onde ninguém mora
  rationale: A expressão hebraica nega genericamente a presença de qualquer habitante. «Ninguém mora» comunica isso de modo natural e atual.
- source_word: וְלֹא יַעֲבֹר בָּהֵן
  choice: e por onde ... passa
  rationale: עבר com ב expressa atravessar ou passar por um lugar. A oração relativa liga naturalmente a ação à terra descrita.
- source_word: בֶּן אָדָם
  choice: nenhum ser humano
  rationale: Neste paralelismo, a expressão significa genericamente uma pessoa, especialmente alguém que atravessaria a região. «Ser humano» preserva o sentido sem sugerir aqui um título cristológico.
- source_word: הָיוּ
  choice: se tornaram
  rationale: O qatal apresenta as cidades no estado resultante do juízo; «se tornaram» conserva a ideia de mudança para essa condição.
theological_decisions:
- issue: Sentido de בֶּן אָדָם no contexto profético
  choice: ser humano
  alternative: filho do homem
  rationale: A expressão é genérica neste versículo e está em paralelismo com אִישׁ; traduzi-la literalmente como «filho do homem» poderia introduzir uma associação titular que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A personificação feminina de Babilônia foi mantida em «dela»; os dois termos de aridez foram preservados sem tecnicismo no texto principal.
