base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/061.yaml
  text: And Jeremiah said to Seraiah[a], “When you come to Babylon, see that you read all these words.”
translation:
  language: pt
  text: 'E Jeremias disse a Seraías: “Quando você chegar à Babilônia, cuide de ler todas estas palavras.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “E ... disse” preserva esse fluxo de modo natural.
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל שְׂרָיָה
  choice: a Seraías
  rationale: A preposição marca o destinatário, e “Seraías” é a forma portuguesa tradicional do nome.
- source_word: כְּבֹאֲךָ בָבֶל
  choice: Quando você chegar à Babilônia
  rationale: A construção com כְּ e o infinitivo de בוא tem valor temporal. “Chegar” expressa naturalmente a entrada no destino.
- source_word: וְרָאִיתָ
  choice: cuide de
  rationale: 'Embora literalmente seja “e você verá”, no contexto o verbo introduz uma incumbência e tem força idiomática de atenção ou diligência: “cuide de”.'
- source_word: וְקָרָאתָ
  choice: ler
  rationale: No contexto do rolo escrito, קרא significa ler, provavelmente em voz alta; “ler” mantém a formulação simples sem explicitar além do texto.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: דברים refere-se aqui ao conteúdo profético escrito, por isso “palavras” é mais preciso do que “coisas” ou “assuntos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A segunda pessoa masculina singular é vertida por “você”, e a construção idiomática “cuide de ler” preserva a força injuntiva sem tornar a frase artificial.
