  text: פְּלֵטִ֣ים מֵ/חֶ֔רֶב הִלְכ֖וּ אַֽל תַּעֲמֹ֑דוּ זִכְר֤וּ מֵֽ/רָחוֹק֙ אֶת יְהוָ֔ה וִ/ירֽוּשָׁלִַ֖ם תַּעֲלֶ֥ה עַל לְבַבְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/050.yaml
  text: You who have escaped the sword[a], go; do not stand still. Remember Yahweh from far away, and let Jerusalem come upon your heart.
translation:
  language: pt
  text: Vocês que escaparam da espada, vão embora; não parem. De longe, lembrem-se de Yahweh, e que Jerusalém lhes venha ao coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que Jerusalém suba sobre o coração de vocês”, expressão que pode indicar lembrança, afeto ou preocupação interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלֵטִים מֵחֶרֶב
  choice: Vocês que escaparam da espada
  rationale: O particípio passivo plural funciona como vocativo e designa os sobreviventes da violência da guerra. A oração relativa torna a interpelação direta clara e natural em português.
- source_word: הִלְכוּ אַל תַּעֲמֹדוּ
  choice: vão embora; não parem
  rationale: Os imperativos exigem que os sobreviventes prossigam sem se deter. “Vão embora” explicita o movimento para longe do perigo, e “não parem” comunica naturalmente a força contextual da proibição.
- source_word: זִכְרוּ מֵרָחוֹק אֶת יְהוָה
  choice: Mesmo de longe, lembrem-se de Yahweh
  rationale: Mantém a ordem e a relação sintática mais provável do hebraico, em que a expressão de distância qualifica o ato de lembrar. “Mesmo” torna natural em português a concessão implícita na distância sem alterar o sentido central.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, distinguindo-o de um título como “Senhor”.
- source_word: וִירוּשָׁלִַם תַּעֲלֶה עַל לְבַבְכֶם
  choice: e que Jerusalém lhes venha ao coração
  rationale: Preserva de modo inteligível a metáfora hebraica literal de Jerusalém “subir sobre o coração”, indicando lembrança interior, afeto ou preocupação, sem reduzi-la apenas a um ato mental.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino, não o título אֲדֹנָי. “Yahweh” preserva essa distinção e segue a transliteração adotada no projeto.
- issue: Amplitude da expressão sobre Jerusalém e o coração
  choice: que Jerusalém lhes venha ao coração
  alternative: lembrem-se de Jerusalém; que Jerusalém lhes venha à mente
  rationale: A formulação escolhida conserva a metáfora e permite tanto a ideia de lembrança quanto as de afeto e preocupação, evitando resolver a amplitude do idioma hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. O plural “vocês” explicita o destinatário coletivo; “lhes” evita a repetição pesada de “de vocês”. A metáfora do coração foi mantida no texto, com esclarecimento em nota.
