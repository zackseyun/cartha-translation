  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי רָב֙ אֶת רִיבֵ֔/ךְ וְ/נִקַּמְתִּ֖י אֶת נִקְמָתֵ֑/ךְ וְ/הַחֲרַבְתִּי֙ אֶת יַמָּ֔/הּ וְ/הֹבַשְׁתִּ֖י אֶת מְקוֹרָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh: “Eis que vou defender a sua causa[a] e tomar vingança por você; secarei o mar dela[b] e farei secar a fonte dela[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lutar pela sua causa”. O hebraico emprega uma expressão de disputa que também pode ter sentido jurídico.'
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “o seu mar”. O hebraico personifica a Babilônia como mulher; por isso, o texto diz literalmente “o mar dela”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a nascente dela” ou “o manancial dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz a conclusão decorrente do contexto anterior e conserva claramente a relação inferencial.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Mantém a fórmula profética de mensageiro e representa diretamente o nome divino.
- source_word: הִנְנִי
  choice: Eis que vou
  rationale: “Eis que” preserva a apresentação enfática, enquanto “vou” expressa de modo natural em português a ação divina iminente introduzida pela construção.
- source_word: רָב אֶת רִיבֵךְ
  choice: defender a sua causa
  rationale: O verbo e o substantivo cognato formam uma expressão de disputa, frequentemente forense; a formulação comunica que Yahweh assume a causa da destinatária.
- source_word: וְנִקַּמְתִּי אֶת נִקְמָתֵךְ
  choice: e tomar vingança por você
  rationale: Transmite a construção cognata hebraica e deixa claro que Yahweh age em favor da destinatária, sem uma repetição artificial em português.
- source_word: וְהַחֲרַבְתִּי אֶת יַמָּהּ
  choice: secarei o mar dela
  rationale: Com “mar” como objeto, o verbo causativo descreve a eliminação das águas; “dela” preserva a referência feminina à Babilônia personificada e evita confundi-la com a destinatária.
- source_word: וְהֹבַשְׁתִּי אֶת מְקוֹרָהּ
  choice: e farei secar a fonte dela
  rationale: Reproduz o valor causativo do verbo e traduz מָקוֹר como a nascente ou fonte das águas; “dela” mantém explícita a referência à Babilônia.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” representa o nome próprio sem substituí-lo por um título.
- issue: Caráter da vingança divina
  choice: tomar vingança por você
  alternative: vingar você; executar a sua vingança
  rationale: A formulação conserva a ação judicial e retributiva de Yahweh em favor da destinatária, sem resolver além do texto a relação entre defesa forense e vingança.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A distinção entre “sua” (a causa da destinatária) e “dela” (o mar e a fonte da Babilônia personificada) reduz uma ambiguidade pronominal própria do português sem apagar a personificação hebraica.
