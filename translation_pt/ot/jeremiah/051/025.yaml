  terminology: ‘Yahweh’, ‘monte’, ‘destruidor’, ‘terra’ e ‘monte queimado’ são escolhas adequadas. As notas mantêm alternativas lexicais legítimas sem decidir indevidamente a ambiguidade de אֶרֶץ ou de הַר שְׂרֵפָה.
