  text: הִנְ/נִ֨י אֵלֶ֜י/ךָ הַ֤ר הַ/מַּשְׁחִית֙ נְאֻם יְהוָ֔ה הַ/מַּשְׁחִ֖ית אֶת כָּל הָ/אָ֑רֶץ וְ/נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וְ/גִלְגַּלְתִּ֨י/ךָ֙ מִן הַ/סְּלָעִ֔ים וּ/נְתַתִּ֖י/ךָ לְ/הַ֥ר שְׂרֵפָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/025.yaml
  text: Behold, I am against you, O destroying mountain, declares Yahweh, which destroys the whole earth. I will stretch out my hand against you, and roll you down from the crags, and make you a burned mountain.
translation:
  language: pt
  text: Eis que estou contra você, ó monte destruidor — declara Yahweh — que destrói toda a terra.[a] Estenderei a minha mão contra você, farei você rolar dos rochedos abaixo e farei de você um monte queimado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o território”. O hebraico אֶרֶץ pode significar “terra” ou “território”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “um monte em chamas” ou “um monte incendiado”. A expressão hebraica é compacta e pode destacar tanto o processo da queima quanto o estado resultante.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: Eis que estou contra você
  rationale: A construção introduz confronto direto. “Eis que” conserva a força solene do anúncio profético, e “estou contra você” comunica naturalmente a oposição.
- source_word: הַר הַמַּשְׁחִית
  choice: ó monte destruidor
  rationale: Mantém a metáfora do monte aplicada à Babilônia e preserva a força ativa do particípio hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética e apresenta diretamente o nome divino יהוה.
- source_word: הַמַּשְׁחִית אֶת כָּל הָאָרֶץ
  choice: que destrói toda a terra
  rationale: Conserva a repetição do particípio e sua relação com “monte destruidor”. “Terra” expressa a amplitude retórica do oráculo, sem ocultar a alternativa lexical “território”.
- source_word: וְנָטִיתִי אֶת יָדִי עָלֶיךָ
  choice: Estenderei a minha mão contra você
  rationale: Preserva a imagem convencional da ação divina em juízo e soa natural em português atual.
- source_word: וְגִלְגַּלְתִּיךָ מִן הַסְּלָעִים
  choice: farei você rolar para baixo, desde os rochedos
  rationale: O verbo expressa o ato de rolar; “para baixo” explicita o movimento sugerido pela imagem, enquanto “desde os rochedos” mantém o ponto de partida indicado por מִן.
- source_word: וּנְתַתִּיךָ לְהַר שְׂרֵפָה
  choice: farei de você um monte queimado
  rationale: Expressa o resultado produzido por נתן com לְ e mantém a formulação compacta e ambígua de שְׂרֵפָה quanto ao processo de queima ou ao estado resultante.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Extensão de כָּל הָאָרֶץ
  choice: toda a terra
  alternative: todo o território
  rationale: No contexto da devastação ampla causada pela Babilônia, “terra” preserva melhor a retórica abrangente, embora אֶרֶץ também possa designar um território ou uma terra específica.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira. A metáfora profética do monte foi preservada, assim como a repetição de “destruidor/destrói”. O tratamento por “você” evita formas regionais ou excessivamente arcaicas; a pontuação com travessões distingue a fórmula profética sem alterar sua ligação sintática.
