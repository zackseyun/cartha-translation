source:
  edition: WLC
  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת בְּ/נַפְשׁ֑/וֹ כִּ֣י אִם מִלֵּאתִ֤י/ךְ אָדָם֙ כַּ/יֶּ֔לֶק וְ/עָנ֥וּ עָלַ֖יִ/ךְ הֵידָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/014.yaml
  text: 'Yahweh of hosts has sworn by himself: Surely I will fill you with men[a], like locusts[c][b], and they will raise over you a shout.'
translation:
  language: pt
  text: 'Yahweh dos Exércitos jurou por si mesmo: “Certamente encherei você de homens, como gafanhotos[a], e eles soltarão contra você um grito[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar uma espécie ou uma fase do gafanhoto, ou ainda o enxame.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico indica um forte clamor e, neste contexto, pode se referir a um grito de guerra ou de vitória contra a Babilônia.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O nifal de שׁבע é a forma usual de expressar um juramento; o pretérito perfeito comunica um ato concluído cuja força permanece.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת por um título natural em português, mantendo sua dimensão militar sem restringir indevidamente seu alcance.
- source_word: בְּנַפְשׁוֹ
  choice: por si mesmo
  rationale: No juramento, נֶפֶשׁ designa a própria pessoa ou vida; “por si mesmo” transmite naturalmente a autodeclaração solene.
- source_word: כִּי אִם
  choice: Certamente
  rationale: Na fórmula de juramento, a expressão introduz enfaticamente o conteúdo assegurado, e não uma condição comum.
- source_word: מִלֵּאתִיךְ
  choice: encherei você
  rationale: O sufixo feminino singular se refere à Babilônia personificada; o futuro exprime o resultado profético garantido pelo juramento.
- source_word: אָדָם
  choice: homens
  rationale: O substantivo coletivo indica os atacantes humanos comparados aos gafanhotos.
- source_word: כַּיֶּלֶק
  choice: como uma nuvem de gafanhotos
  rationale: יֶלֶק pode indicar uma espécie ou fase do gafanhoto; “nuvem de gafanhotos” torna clara a imagem coletiva de invasão sem definir uma fase específica.
- source_word: וְעָנוּ עָלַיִךְ הֵידָד
  choice: e eles levantarão contra você um grito de triunfo
  rationale: ענה com הֵידָד descreve a emissão de um clamor; “contra você” preserva עָלַיִךְ, e “grito de triunfo” se ajusta ao contexto militar.
theological_decisions:
- issue: Fórmula do juramento divino
  choice: Yahweh dos Exércitos jurou por si mesmo
  alternative: O SENHOR dos Exércitos jurou por sua vida
  rationale: A tradução conserva o nome pessoal יְהוָה e comunica o sentido idiomático de בְּנַפְשׁוֹ sem sugerir que Deus jura por algo distinto de si.
- issue: Natureza do clamor dos invasores
  choice: grito de triunfo
  alternative: grito de guerra
  rationale: O contexto favorece um clamor militar vitorioso, mas הֵידָד pode ter usos mais amplos; a nota registra essa amplitude lexical.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A cidade da Babilônia é tratada por “você”, refletindo o feminino singular hebraico sem exigir marcação de gênero em português. As aspas distinguem o conteúdo do juramento.
