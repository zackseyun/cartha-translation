base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/040.yaml
  text: I will bring them down like lambs to the slaughter[a], like rams with male goats.
translation:
  language: pt
  text: Eu os farei descer como cordeiros para o abate[a], como carneiros junto com bodes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como carneiros jovens» para כָּרִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹרִידֵם
  choice: Eu os farei descer
  rationale: 'O hifil de ירד expressa ação causativa: fazer descer ou levar para baixo. A formulação preserva essa força sem especificar além do hebraico como serão conduzidos.'
- source_word: כְּכָרִים
  choice: como cordeiros
  rationale: כָּרִים pode designar cordeiros ou carneiros jovens. «Cordeiros» é natural na imagem de animais levados ao abate; a alternativa lexical é registrada em nota.
- source_word: לִטְבֹחַ
  choice: para o abate
  rationale: O infinitivo de טבח indica o ato de abater. «Para o abate» comunica com clareza a finalidade ou destino dos animais.
- source_word: כְּאֵילִים
  choice: como carneiros
  rationale: אֵילִים designa diretamente carneiros, mantendo a distinção entre os grupos de animais.
- source_word: עִם עַתּוּדִים
  choice: junto com bodes
  rationale: עַתּוּדִים designa bodes, isto é, cabritos machos. «Bodes» é a expressão portuguesa corrente e já preserva a especificação de sexo.
