  text: בְּ/חֻמָּ֞/ם אָשִׁ֣ית אֶת מִשְׁתֵּי/הֶ֗ם וְ/הִשְׁכַּרְתִּי/ם֙ לְמַ֣עַן יַעֲלֹ֔זוּ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/039.yaml
  text: When they are heated, I will set out their drink and make them drunk, so that they may exult, then sleep an everlasting sleep and not wake up, declares Yahweh.
translation:
  language: pt
  text: Quando estiverem inflamados, servirei a bebida deles[a] e os embriagarei, para que exultem e durmam um sono perpétuo[b] e não despertem — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a festa deles” ou “o banquete deles”; o termo hebraico pode designar uma festa em que se bebe.
    reason: lexical_alternative
  - marker: b
    text: “Sono perpétuo” é uma metáfora hebraica para a morte irreversível sob juízo; literalmente, “sono de perpetuidade”.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחֻמָּם
  choice: Quando estiverem inflamados
  rationale: A construção com בְּ e o substantivo ligado a 'calor' tem valor circunstancial ou temporal. 'Inflamados' preserva a imagem de calor e permite entender agitação, paixão ou excitação de uma celebração, sem restringir o sentido a temperatura física.
- source_word: אָשִׁית אֶת מִשְׁתֵּיהֶם
  choice: servirei a bebida deles
  rationale: שׂים significa pôr ou colocar; em português, com bebida, 'servirei' expressa naturalmente o ato de colocá-la diante deles. מִשְׁתֶּה pode ser bebida ou uma festa marcada por bebida, ambiguidade registrada em nota.
- source_word: וְהִשְׁכַּרְתִּים
  choice: e os embriagarei
  rationale: O hifil de שׁכר indica causar embriaguez. A formulação conserva de modo direto a ação divina no juízo.
- source_word: לְמַעַן יַעֲלֹזוּ
  choice: para que exultem
  rationale: לְמַעַן introduz propósito ou resultado pretendido, e עלז comunica alegria intensa. 'Exultem' mantém o tom elevado e a possível ironia do contexto.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: e durmam um sono perpétuo
  rationale: A tradução conserva tanto a coordenação simples do waw quanto a metáfora hebraica. 'Perpétuo' expressa עוֹלָם neste contexto sem substituir a imagem diretamente por 'morte'.
- source_word: וְלֹא יָקִיצוּ
  choice: sem despertar
  rationale: A expressão traduz naturalmente a negação do verbo 'despertar' e mantém a ligação com a metáfora do sono.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida com solenidade e o nome divino יְהוָה é representado diretamente como 'Yahweh'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. 'Yahweh' o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de שְׁנַת עוֹלָם no contexto de juízo
  choice: sono perpétuo
  alternative: morte sem despertar; sono eterno
  rationale: A opção mantém a metáfora profética e sua força de morte irreversível no contexto, sem convertê-la numa afirmação mais específica sobre o estado após a morte.
- issue: Relação entre exultar e dormir
  choice: e durmam
  alternative: e então durmam
  rationale: O waw hebraico coordena as ações, mas não exige por si só a explicitação de uma sequência temporal. A tradução evita acrescentar 'então', embora a progressão narrativa continue perceptível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Inflamados' conserva a imagem e a ambiguidade do hebraico; 'servirei' evita a construção pouco natural 'porei a bebida', e o travessão dá clareza à fórmula profética final.
