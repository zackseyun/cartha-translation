  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ בָ֨א עָלֶ֤י/הָ עַל בָּבֶל֙ שׁוֹדֵ֔ד וְ/נִלְכְּדוּ֙ גִּבּוֹרֶ֔י/הָ חִתְּתָ֖ה קַשְּׁתוֹתָ֑/ם כִּ֣י אֵ֧ל גְּמֻל֛וֹת יְהוָ֖ה שַׁלֵּ֥ם יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/056.yaml
  text: For a destroyer has come against her[a], against Babylon, and her warriors have been captured; their bows are shattered. For Yahweh is a God of recompense[c][b]; he will surely repay.
translation:
  language: pt
  text: Pois um devastador[a] veio contra ela, contra a Babilônia, e os seus guerreiros foram capturados; os arcos deles foram quebrados. Pois Yahweh é Deus de retribuições;[b] ele certamente retribuirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um saqueador”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Deus de vingança”. O hebraico enfatiza a justa paga ou retribuição.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוֹדֵד
  choice: um devastador
  rationale: O particípio designa quem devasta ou saqueia. “Devastador” preserva a amplitude da ação militar sem restringi-la ao roubo.
- source_word: בָא עָלֶיהָ עַל בָּבֶל
  choice: veio contra ela, contra a Babilônia
  rationale: A repetição de עַל é preservada, e a segunda expressão esclarece enfaticamente que “ela” é a Babilônia.
- source_word: וְנִלְכְּדוּ
  choice: foram capturados
  rationale: O nifal exprime que os guerreiros foram tomados pelo inimigo; a forma passiva mantém essa perspectiva.
- source_word: גִּבּוֹרֶיהָ
  choice: os seus guerreiros
  rationale: Embora o termo possa significar literalmente “seus valentes”, o contexto militar indica os combatentes da Babilônia.
- source_word: חִתְּתָה קַשְּׁתוֹתָם
  choice: os arcos deles foram quebrados
  rationale: A formulação comunica de modo natural a destruição das armas. O verbo pode ter a força de “despedaçar” ou “quebrar”.
- source_word: אֵל גְּמֻלוֹת
  choice: Deus de retribuições
  rationale: O plural גְּמֻלוֹת abrange atos de justa paga ou retribuição. A tradução mantém o plural hebraico e evita reduzir o sentido apenas a vingança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: ele certamente retribuirá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da ação; “certamente” reproduz essa ênfase em português natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa diretamente sem substituí-lo por “Senhor”.
- issue: Nuance do juízo divino em אֵל גְּמֻלוֹת
  choice: Deus de retribuições
  alternative: Deus de vingança
  rationale: “Retribuições” preserva a ideia abrangente de paga justa e deixa aberta a amplitude semântica do hebraico, enquanto “vingança” poderia estreitá-la.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara. Mantém a repetição enfática referente à Babilônia, o nome Yahweh e a intensificação final do hebraico.
