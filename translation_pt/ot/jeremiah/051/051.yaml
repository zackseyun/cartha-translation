  timestamp: '2026-07-13T23:37:17Z'
review_pass:
  verdict: revise
  source_fidelity: A construção בָּאוּ עַל significa literalmente que os estrangeiros «vieram contra/sobre» os lugares santos. Embora «entraram nos» possa refletir uma inferência contextual de profanação, ela especifica uma incursão para dentro que o hebraico não declara inequivocamente. «Vieram contra» preserva a preposição e se alinha à camada de auditoria inglesa. «Nossos rostos» representa mais diretamente פָּנֵינוּ.
  naturalness: A revisão mantém um português moderno, fluente e solene. «Estamos envergonhados» expressa naturalmente o perfeito hebraico com seu estado resultante; «afronta» e «desonra» reproduzem bem o paralelismo sem recorrer a uma formulação excessivamente interpretativa.
  terminology: «SENHOR» é uma convenção adequada para יהוה. «Lugares santos da casa do SENHOR» conserva o plural de מִקְדְּשֵׁי e a imagem de «casa».
  issues:
  - severity: medium
    issue: «Entraram nos lugares santos» resolve de modo excessivo o sentido de בָּאוּ עַל.
    rationale: O hebraico comporta «vieram contra» e não exige afirmar no texto principal que os estrangeiros efetivamente penetraram nos recintos. A nota reconhece a alternativa, mas o texto principal ainda privilegia uma inferência contestável.
  - severity: low
    issue: «O nosso rosto» singular reduz a imagem plural de פָּנֵינוּ.
    rationale: Embora o singular coletivo seja possível em português, «nossos rostos» preserva mais claramente a forma e a imagem do hebraico.
  revised_text: Estamos envergonhados, pois ouvimos afronta; a desonra cobriu nossos rostos, pois estrangeiros vieram contra os lugares santos da casa do SENHOR.
  revised_footnotes: []
