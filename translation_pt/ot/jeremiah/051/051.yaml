  text: בֹּ֚שְׁנוּ כִּֽי שָׁמַ֣עְנוּ חֶרְפָּ֔ה כִּסְּתָ֥ה כְלִמָּ֖ה פָּנֵ֑י/נוּ כִּ֚י בָּ֣אוּ זָרִ֔ים עַֽל מִקְדְּשֵׁ֖י בֵּ֥ית יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/051.yaml
  text: We are ashamed, for we have heard reproach; disgrace has covered our faces, for foreigners have come against the holy places of the house of the LORD.
translation:
  language: pt
  text: Estamos envergonhados, pois ouvimos afronta; a desonra cobriu nossos rostos, pois estrangeiros vieram contra os lugares santos da casa do SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּשְׁנוּ (bōšnû)
  choice: Ficamos envergonhados
  rationale: Expressa de modo natural o estado de vergonha indicado pelo verbo hebraico, sem acrescentar uma causa além da apresentada no próprio versículo.
- source_word: חֶרְפָּה (ḥerpâ)
  choice: insultos
  rationale: O termo pode indicar afronta, escárnio ou desonra. “Insultos” se ajusta ao verbo “ouvimos” e conserva a dimensão pública da afronta.
- source_word: כְלִמָּה (kəlimmâ)
  choice: humilhação
  rationale: Distingue este termo de בֹּשְׁנוּ e transmite a desonra avassaladora figuradamente descrita como cobrindo o rosto.
- source_word: זָרִים (zārîm)
  choice: estrangeiros
  rationale: 'Equivalente direto e contextual: pessoas de fora do povo e do culto de Israel.'
- source_word: מִקְדְּשֵׁי (miqdəšê)
  choice: lugares santos
  rationale: Mantém o plural hebraico e evita reduzir necessariamente a expressão a um único recinto ou objeto.
- source_word: בֵּית יְהוָה (bêt YHWH)
  choice: casa do SENHOR
  rationale: “Casa” preserva a imagem hebraica tradicional do templo, e “SENHOR” segue a convenção portuguesa de representar o nome divino YHWH.
theological_decisions:
- issue: Sentido de עַל após בָּאוּ na descrição da entrada dos estrangeiros
  choice: entraram nos lugares santos
  alternative: vieram contra os lugares santos
  rationale: Neste contexto de profanação do templo, a construção comunica incursão nos recintos sagrados. A tradução principal torna esse sentido claro em português, enquanto a nota registra a amplitude da preposição hebraica.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH ou Javé
  rationale: A forma em versalete é uma convenção bíblica portuguesa amplamente reconhecida e permite distinguir o nome divino do título comum, sem impor uma vocalização específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo poético foi mantido, assim como a repetição semântica entre vergonha, insultos e humilhação. A pontuação conserva as duas causas introduzidas por כִּי.
