revisions:
- from: Ficamos envergonhados, pois ouvimos insultos; a humilhação cobriu o nosso rosto, pois estrangeiros entraram nos lugares santos da casa do SENHOR.[a]
  to: Estamos envergonhados, pois ouvimos afronta; a desonra cobriu nossos rostos, pois estrangeiros vieram contra os lugares santos da casa do SENHOR.
  rationale: A revisão substitui a interpretação espacial específica («entraram nos») por uma formulação que conserva a força adversativa de עַל e a ambiguidade do original. Também ajusta «rostos» ao plural hebraico e usa «afronta/desonra» para refletir mais proximamente os substantivos singulares e o paralelismo do versículo. Não é necessária nota, pois a formulação principal já preserva o sentido menos interpretativo.
