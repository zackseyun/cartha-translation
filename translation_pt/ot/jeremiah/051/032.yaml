translation_notes:
  register: Português atual, digno e claro, com sintaxe coordenada que acompanha o ritmo do hebraico. “Homens de guerra” mantém a transparência formal da expressão original; “incendiados” oferece uma formulação idiomática sem perder a ação do fogo.
