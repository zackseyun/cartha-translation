  text: The crossings have been seized[a], the marshes have been burned with fire[c][b], and the men of war are terrified.
translation:
  language: pt
  text: As travessias foram tomadas[a], os pântanos foram incendiados[b], e os homens de guerra ficaram aterrorizados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os vaus foram tomados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os charcos”; o termo hebraico pode indicar lagoas pantanosas ou áreas alagadiças.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבָּרוֹת
  choice: as passagens
  rationale: מַעְבָּר designa lugares de passagem ou travessia. “Passagens” é natural e amplo em português, preservando sem especificar em excesso a provável referência estratégica a travessias de rios.
- source_word: נִתְפָּשׂוּ
  choice: foram tomadas
  rationale: O nifal de תפש indica que foram capturadas ou ocupadas. “Foram tomadas” conserva a voz passiva e combina com o estilo conciso de um informe militar.
- source_word: הָאֲגַמִּים
  choice: os pântanos
  rationale: אֲגַמִּים pode indicar áreas alagadiças, charcos ou lagoas pantanosas. “Pântanos” se ajusta à geografia e à possibilidade de queimar sua vegetação.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: foram incendiados
  rationale: O hebraico diz literalmente que sujeitos não especificados “queimaram com fogo”. A formulação passiva em português mantém o foco na calamidade e evita a redundância pouco natural de “queimados com fogo”.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: os homens de guerra
  rationale: A expressão significa literalmente “homens da guerra”. A tradução preserva a referência masculina e o registro militar do hebraico.
- source_word: נִבְהָלוּ
  choice: ficaram aterrorizados
  rationale: O nifal de בהל comunica alarme intenso, perturbação ou terror. “Ficaram aterrorizados” expressa o ingresso nesse estado após a notícia da derrota.
