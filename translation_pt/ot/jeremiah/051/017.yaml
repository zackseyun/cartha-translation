  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/017.yaml
  text: Every man is made brutish[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is falsehood, and there is no breath in them.
translation:
  language: pt
  text: Todo ser humano se torna insensato, sem conhecimento; todo artífice de metal é envergonhado por causa da imagem esculpida, pois sua imagem fundida é uma mentira, e não há fôlego[a] nelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espírito”. A palavra hebraica רוּחַ pode significar “fôlego”, “vento” ou “espírito”; aqui, “fôlego” ressalta que os ídolos não têm vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: se mostra insensato
  rationale: O nifal de בער comunica embrutecimento ou falta de discernimento. “Se mostra insensato” preserva a censura moral e cognitiva sem recorrer a uma expressão artificial em português.
- source_word: כָּל אָדָם
  choice: Todo ser humano
  rationale: אָדָם tem aqui sentido genérico e distributivo, referindo-se a cada pessoa, não apenas aos homens do sexo masculino.
- source_word: מִדַּעַת
  choice: sem conhecimento
  rationale: A preposição מִן tem valor privativo neste contexto; a expressão indica ausência de conhecimento.
- source_word: הֹבִישׁ
  choice: é envergonhado
  rationale: A forma hifil de בוש expressa ser levado à vergonha ou ficar desacreditado; a formulação passiva conserva essa nuance causativa.
- source_word: צֹרֵף
  choice: artesão de metais
  rationale: O particípio pode designar quem funde, refina ou trabalha metais. A escolha é abrangente e adequada ao contexto da fabricação de ídolos.
- source_word: מִפָּסֶל
  choice: pelo seu ídolo
  rationale: פֶּסֶל designa uma imagem cultual ou ídolo, e מִן indica aqui aquilo que ocasiona a vergonha.
- source_word: שֶׁקֶר
  choice: uma mentira
  rationale: O substantivo caracteriza a imagem como falsidade ou engano. “Uma mentira” é direto, natural e mantém a força da denúncia profética.
- source_word: נִסְכּוֹ
  choice: a sua imagem de metal fundido
  rationale: A palavra se refere a uma imagem produzida por derramamento de metal. A formulação explicita o processo sem confundi-la com uma imagem meramente esculpida.
- source_word: וְלֹא רוּחַ בָּם
  choice: e não há fôlego neles
  rationale: רוּחַ pode significar fôlego, vento ou espírito. Aqui “fôlego” ressalta que os ídolos não têm vida; o pronome plural retoma coletivamente os ídolos e as imagens.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: Todo ser humano
  alternative: Todo homem
  rationale: A afirmação abrange a humanidade de modo distributivo. “Todo ser humano” comunica essa referência genérica com clareza em português atual, sem restringi-la ao sexo masculino.
- issue: Sentido de רוּחַ na polêmica contra os ídolos
  choice: fôlego
  alternative: espírito
  rationale: O argumento imediato é que as imagens fabricadas são inertes e sem vida. “Fôlego” torna esse contraste explícito, enquanto a nota preserva a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “todo” preserva o paralelismo hebraico; “artesão de metais” evita restringir צֹרֵף a ourives ou refinador. O singular “sua imagem” seguido do plural “neles” conserva a mudança de número do texto hebraico, entendendo os ídolos coletivamente.
