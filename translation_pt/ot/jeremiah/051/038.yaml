  text: Juntos, rugem como leões jovens; rosnam como filhotes de leão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “soltam gritos ásperos como filhotes de leão”. O verbo hebraico pode indicar a emissão de um som animal áspero; “rosnam” foi escolhido por ser a forma mais natural neste paralelismo com o rugido dos leões.'
