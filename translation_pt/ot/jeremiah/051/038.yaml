lexical_decisions:
- source_word: יַחְדָּו
  choice: Juntos
  rationale: O advérbio indica ação coletiva; “juntos” é natural e conserva essa ideia.
- source_word: כְּפִרִים
  choice: leões jovens
  rationale: O termo costuma designar leões jovens, já vigorosos; a expressão é clara e mantém a distinção poética em relação aos filhotes do segundo membro.
- source_word: יִשְׁאָגוּ
  choice: rugem
  rationale: שאג é o verbo habitual para o rugido dos leões; “rugem” traduz diretamente a imagem sem acrescentar intensidade.
- source_word: נָעֲרוּ
  choice: rosnam
  rationale: Neste contexto de sons de animais, o verbo denota a emissão de um som áspero. “Rosnam” é idiomático e se ajusta ao paralelismo com o rugido.
- source_word: גֹרֵי אֲרָיוֹת
  choice: filhotes de leão
  rationale: A construção designa as crias dos leões. A opção é contemporânea e preserva alguma distinção em relação a כְּפִרִים.
