id: JER.51.6
reference: Jeremiah 51:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֻ֣סוּ מִ/תּ֣וֹךְ בָּבֶ֗ל וּ/מַלְּטוּ֙ אִ֣ישׁ נַפְשׁ֔/וֹ אַל תִּדַּ֖מּוּ בַּ/עֲוֺנָ֑/הּ כִּי֩ עֵ֨ת נְקָמָ֥ה הִיא֙ לַֽ/יהוָ֔ה גְּמ֕וּל ה֥וּא מְשַׁלֵּ֖ם לָֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
translation:
  language: pt
  text: Fujam do meio da Babilônia, e cada um salve a própria vida. Não pereçam na iniquidade dela[a], pois este é o tempo da vingança de Yahweh; ele lhe dá a devida retribuição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não pereçam por causa da culpa dela” ou “não sejam destruídos por causa da iniquidade dela”. O hebraico pode indicar tanto ser envolvido no pecado da Babilônia como no juízo que vem por causa dele.
    reason: alternativa lexical e preservação da ambiguidade de בַּעֲוֺנָהּ
lexical_decisions:
- source_word: נֻסוּ
  choice: Fujam
  rationale: O imperativo plural de נוס comunica uma ordem direta e urgente para escapar.
- source_word: מִתּוֹךְ בָּבֶל
  choice: do meio da Babilônia
  rationale: Preserva a ideia espacial de תּוֹךְ, isto é, sair de dentro da Babilônia, em português natural.
- source_word: וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  choice: e cada um salve a própria vida
  rationale: Expressa naturalmente a construção idiomática em que cada pessoa deve pôr sua נֶפֶשׁ a salvo.
- source_word: אַל תִּדַּמּוּ
  choice: Não pereçam
  rationale: No nifal e neste contexto de juízo, דמה indica perecer ou ser destruído; “pereçam” é claro, solene e mantém a força do aviso.
- source_word: בַּעֲוֺנָהּ
  choice: na iniquidade dela
  rationale: Mantém a preposição ב e a amplitude de עָוֹן, que pode envolver iniquidade, culpa e as consequências punitivas da culpa.
- source_word: עֵת נְקָמָה הִיא לַיהוָה
  choice: este é o tempo da vingança de Yahweh
  rationale: Apresenta o período como a ocasião determinada em que Yahweh executa retribuição judicial.
- source_word: גְּמוּל הוּא מְשַׁלֵּם לָהּ
  choice: ele lhe dá a devida retribuição
  rationale: Reproduz a combinação de גְּמוּל com שׁלם sem a repetição pouco natural de “pagar um pagamento”, preservando a ideia de justa correspondência.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio e segue a orientação fornecida.
- issue: Relação entre a iniquidade da Babilônia e o destino dos que permanecem nela
  choice: “Não pereçam na iniquidade dela”, com nota que conserva tanto a participação na culpa quanto a destruição decorrente dela
  alternative: “Não sejam destruídos por causa da iniquidade dela”
  rationale: A combinação de ב com עָוֹן admite referência à esfera da iniquidade, à culpa e ao castigo resultante; o texto principal e a nota evitam resolver indevidamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cada um” evita rigidez desnecessária sem apagar o valor distributivo de אִישׁ; “devida retribuição” mantém o tom judicial e profético.
