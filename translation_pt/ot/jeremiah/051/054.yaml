  text: ק֥וֹל זְעָקָ֖ה מִ/בָּבֶ֑ל וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/אֶ֥רֶץ כַּשְׂדִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/054.yaml
  text: The sound of a cry comes from Babylon[a], and great destruction from the land of the Chaldeans.
translation:
  language: pt
  text: O som de um grito vem da Babilônia[a], e uma grande destruição vem da terra dos caldeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O som de um clamor vem da Babilônia, e uma grande ruína, da terra dos caldeus.”'
    reason: Alternativa mais formal que conserva a estrutura nominal e os sentidos possíveis de זְעָקָה e שֶׁבֶר.
lexical_decisions:
- source_word: ק֥וֹל זְעָקָ֖ה
  choice: Ouve-se um grito
  rationale: A expressão significa literalmente “som de um grito”. A formulação verbal é natural em português, mantém a imagem auditiva e comunica que um clamor de aflição procede da Babilônia.
- source_word: מִ/בָּבֶ֑ל
  choice: vindo da Babilônia
  rationale: A preposição מִן indica a origem do som. “Vindo da Babilônia” torna explícita em português a relação que a frase nominal hebraica deixa sem verbo.
- source_word: וְ/שֶׁ֥בֶר גָּד֖וֹל
  choice: e uma grande destruição
  rationale: שֶׁבֶר pode indicar quebra, colapso, ruína ou destruição. Neste anúncio profético de juízo, “grande destruição” expressa com clareza a calamidade de enormes proporções.
- source_word: מֵ/אֶ֥רֶץ כַּשְׂדִּֽים
  choice: vindo da terra dos caldeus
  rationale: A tradução conserva tanto a ideia de origem marcada por מִן quanto a designação étnico-geográfica literal, “terra dos caldeus”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “vindo” explicita o paralelismo e a origem das duas notícias, sem eliminar a concisão profética.
