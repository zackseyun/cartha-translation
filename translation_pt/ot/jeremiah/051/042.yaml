  yaml_path: translation/ot/jeremiah/051/042.yaml
  text: The sea has come up against Babylon[b][a]; she is covered with the multitude of its waves.
translation:
  language: pt
  text: O mar se levantou contra a Babilônia[a]; ela foi coberta pela multidão de suas ondas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “o mar” é uma imagem da força avassaladora que avança contra a Babilônia; a metáfora foi preservada em vez de ser substituída por sua interpretação.
    reason: cultural_note
  - marker: b
    text: 'Ou: “pelo tumulto de suas ondas” ou “pelo estrondo de suas ondas”. O termo hebraico pode indicar tanto uma grande multidão quanto ruído e tumulto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: se levantou
  rationale: O qal perfeito de עלה pode significar subir ou levantar-se. Em português, “se levantou contra” preserva tanto o movimento ascendente da imagem quanto a ideia de avanço hostil.
- source_word: עַל
  choice: contra
  rationale: No contexto de movimento hostil, עַל é naturalmente expresso por “contra”, em vez de uma formulação meramente espacial como “sobre”.
- source_word: בָּבֶל
  choice: a Babilônia
  rationale: Forma portuguesa consagrada do topônimo; o artigo é natural em português.
- source_word: הַיָּם
  choice: O mar
  rationale: Preserva a definição do substantivo e a metáfora hebraica da força avassaladora, sem substituí-la por uma interpretação.
- source_word: בַּהֲמוֹן
  choice: pela multidão
  rationale: הָמוֹן pode indicar multidão, abundância, tumulto ou estrondo. “Multidão” mantém o sentido quantitativo no contexto das ondas, enquanto a alternativa sonora é registrada em nota.
- source_word: גַּלָּיו
  choice: de suas ondas
  rationale: O sufixo masculino singular retoma “mar”; “suas” é a forma possessiva natural em português.
- source_word: נִכְסָתָה
  choice: ela foi coberta
  rationale: O nifal perfeito feminino singular indica que Babilônia foi coberta. O pronome “ela” conserva a referência feminina à cidade e torna clara a mudança de sujeito.
