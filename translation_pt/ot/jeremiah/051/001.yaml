  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מֵעִ֣יר עַל בָּבֶ֔ל וְ/אֶל יֹשְׁבֵ֖י לֵ֣ב קָמָ֑י ר֖וּחַ מַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/001.yaml
  text: 'Thus says Yahweh: Behold[a], I am stirring up against Babylon, and against the inhabitants of Leb-kamai[b], a destroying wind.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Eis que estou levantando contra a Babilônia e contra os habitantes de Leb-Camai[a] um vento destruidor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Leb-Camai” provavelmente é um nome cifrado, pelo sistema atbash, para a Caldeia. Outra possibilidade é entender a expressão mais literalmente como “o coração dos meus adversários”.
    reason: alternative_reading
  - marker: b
    text: Ou “um espírito destruidor”; a palavra hebraica pode significar “vento”, “espírito” ou “sopro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino pessoal representado pelo Tetragrama, em forma amplamente reconhecível em português.
- source_word: הִנְנִי
  choice: Eis que estou
  rationale: Mantém a fórmula enfática de anúncio e, com o gerúndio, expressa a ação divina apresentada como iminente ou já posta em movimento.
- source_word: מֵעִיר
  choice: levantando
  rationale: O particípio hifil de עור indica suscitar ou pôr em ação um agente; “levantando” é natural no contexto de Deus mobilizar um instrumento de juízo.
- source_word: עַל ... וְאֶל
  choice: contra ... e contra
  rationale: No contexto de juízo, ambas as preposições exprimem direção hostil. A repetição torna essa relação clara e fluente em português.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: יֹשְׁבֵי
  choice: os habitantes de
  rationale: 'Transmite naturalmente o sentido coletivo do particípio: aqueles que moram no lugar referido.'
- source_word: לֵב קָמָי
  choice: Lebe-Camai
  rationale: A expressão provavelmente funciona como nome cifrado de Caldeia/Babilônia. A transliteração preserva esse traço do texto, enquanto a leitura literal é registrada em nota.
- source_word: רוּחַ
  choice: vento
  rationale: No contexto do juízo contra a Babilônia, a imagem de um vento devastador é a leitura mais provável; a possibilidade lexical de “espírito” é preservada em nota.
- source_word: מַשְׁחִית
  choice: destruidor
  rationale: O particípio hifil qualifica o vento por sua ação e efeito destrutivos; “vento destruidor” conserva essa força ativa.
theological_decisions:
- issue: Se רוּחַ deve ser entendido em sentido meteorológico ou espiritual
  choice: vento
  alternative: espírito
  rationale: A imagem de um agente devastador levantado contra a Babilônia favorece “vento”, sem excluir a possibilidade lexical de “espírito”; por isso, a ambiguidade é documentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. “Eis que” preserva a solenidade enfática do anúncio sem tornar o restante da frase arcaico. Os marcadores de nota foram colocados junto às expressões efetivamente explicadas.
