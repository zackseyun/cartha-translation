  source_fidelity: A repetição de “com você despedacei” reproduz bem a construção instrumental בְּךָ e a força do Piel נִפַּצְתִּי. “Pastor”, “rebanho”, “lavrador”, “junta” e “governadores” correspondem adequadamente aos termos hebraicos. Porém, “seus subordinados” introduz um possessivo ausente do hebraico e transforma סְגָנִים em uma relação pessoal de subordinação aos governadores que o texto não especifica; o termo designa antes uma classe de oficiais administrativos.
