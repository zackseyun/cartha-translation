base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/023.yaml
  text: And with you I shattered the shepherd and his flock[a]; and with you I shattered the farmer and his team[c][b]; and with you I shattered governors and deputies.
translation:
  language: pt
  text: E com você despedacei o pastor e o seu rebanho; e com você despedacei o lavrador e a sua junta[a]; e com você despedacei governadores e oficiais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu par de animais atrelados”; o termo hebraico pode indicar uma junta, um jugo ou um par usado no trabalho agrícola.
    reason: lexical_alternative
  - marker: b
    text: Ou “subordinados”, “prefeitos” ou “representantes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: despedacei
  rationale: O verbo נָפַץ expressa quebra violenta ou esmagamento. “Despedacei” conserva essa força e permite manter a repetição enfática do hebraico.
- source_word: בְּךָ
  choice: com você
  rationale: 'A preposição tem valor instrumental no contexto: Babilônia é o instrumento empregado para despedaçar. “Com você” preserva essa ideia e a cadência repetida.'
- source_word: רֹעֶה
  choice: o pastor
  rationale: Aqui designa literalmente quem cuida de rebanhos, dentro de uma lista de funções sociais; não se deve importar um sentido eclesiástico posterior.
- source_word: עֶדְרוֹ
  choice: o seu rebanho
  rationale: עֵדֶר pode indicar rebanho de ovelhas ou de outros animais; junto de “pastor”, “rebanho” é a opção portuguesa mais natural.
- source_word: אִכָּר
  choice: o lavrador
  rationale: O substantivo designa quem cultiva a terra. “Lavrador” é claro, digno e mais próximo da atividade agrícola específica do que um termo genérico.
- source_word: צִמְדּוֹ
  choice: a sua junta
  rationale: צֶמֶד pode designar um par de animais atrelados ou a junta. “Junta” é uma expressão agrícola concisa, embora possa requerer esclarecimento para alguns leitores.
- source_word: פַּחוֹת
  choice: governadores
  rationale: פַּחָה designa governadores ou administradores provinciais; “governadores” é preciso e corrente.
- source_word: סְגָנִים
  choice: seus subordinados
  rationale: סְגָנִים designa oficiais de categoria subordinada. “Seus subordinados” explicita a relação hierárquica sugerida pela sequência, sem fixar um cargo moderno específico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tripla repetição de “com você despedacei” conserva a estrutura retórica e a força do hebraico. Os pronomes possessivos foram formulados de modo natural em português, e as notas preservam a amplitude dos termos administrativos e agrícolas.
