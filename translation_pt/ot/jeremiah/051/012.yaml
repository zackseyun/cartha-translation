  text: אֶל חוֹמֹ֨ת בָּבֶ֜ל שְׂאוּ נֵ֗ס הַחֲזִ֨יקוּ֙ הַ/מִּשְׁמָ֔ר הָקִ֨ימוּ֙ שֹֽׁמְרִ֔ים הָכִ֖ינוּ הָ/אֹֽרְבִ֑ים כִּ֚י גַּם זָמַ֣ם יְהוָ֔ה גַּם עָשָׂ֕ה אֵ֥ת אֲשֶׁר דִּבֶּ֖ר אֶל יֹשְׁבֵ֥י בָבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/012.yaml
  text: Against the walls of Babylon[a], lift up a signal; strengthen the watch; station watchmen; prepare the ambushes[c][b]. For Yahweh has both planned and done what he spoke against the inhabitants of Babylon.
translation:
  language: pt
  text: 'Contra as muralhas da Babilônia, levantem um sinal[a]; reforcem a guarda; posicionem sentinelas; preparem as emboscadas[b]. Pois Yahweh tanto planejou como realizou aquilo que falou aos habitantes da Babilônia[c].


    [a] Ou “levantem um estandarte” ou “ergam uma bandeira”. O termo hebraico indica um sinal elevado, frequentemente de caráter militar.

    [b] Ou “preparem os que ficam de emboscada”. O hebraico pode se referir tanto aos homens que ficam à espreita como às próprias emboscadas.

    [c] Isto é, uma palavra de juízo dirigida contra eles. O hebraico diz literalmente “falou aos habitantes da Babilônia”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levantem um estandarte” ou “ergam uma bandeira”. O termo hebraico indica um sinal elevado, frequentemente de caráter militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “preparem os que ficam de emboscada”. O hebraico pode se referir tanto aos homens que ficam à espreita como às próprias emboscadas.
    reason: lexical_alternative
  - marker: c
    text: Isto é, uma palavra de juízo dirigida contra eles. O hebraico diz literalmente “falou aos habitantes da Babilônia”.
    reason: contextual_clarification
lexical_decisions:
- source_word: אֶל חוֹמֹת בָּבֶל
  choice: Contra as muralhas da Babilônia
  rationale: Embora אֶל normalmente expresse direção (“a”, “para”), a sequência de ordens militares favorece aqui a ideia de ação dirigida contra as muralhas.
- source_word: שְׂאוּ נֵס
  choice: levantem um sinal
  rationale: נֵס designa um sinal visível elevado, muitas vezes uma bandeira ou um estandarte militar. “Sinal” mantém o sentido amplo e é claro em português atual.
- source_word: הַחֲזִיקוּ הַמִּשְׁמָר
  choice: reforcem a guarda
  rationale: O Hifil de חזק comunica fortalecimento ou reforço, e מִשְׁמָר se refere à guarda ou vigilância.
- source_word: הָקִימוּ שֹׁמְרִים
  choice: posicionem sentinelas
  rationale: A construção ordena que pessoas encarregadas de vigiar sejam postadas; “posicionem sentinelas” expressa naturalmente o cenário militar.
- source_word: הָכִינוּ הָאֹרְבִים
  choice: preparem as emboscadas
  rationale: A forma derivada de ארב pode designar os emboscadores ou as emboscadas. A tradução principal é idiomática e a alternativa pessoal é preservada em nota.
- source_word: כִּי גַּם זָמַם יְהוָה גַּם עָשָׂה
  choice: Pois Yahweh tanto planejou como realizou
  rationale: A construção correlativa גַּם...גַּם é reproduzida por “tanto...como”. “Planejou” traduz זמם, e “realizou” comunica que Yahweh executou seu propósito.
- source_word: אֵת אֲשֶׁר דִּבֶּר אֶל יֹשְׁבֵי בָבֶל
  choice: aquilo que falou aos habitantes da Babilônia
  rationale: A tradução mantém o valor comum de אֶל, “aos”, sem apagar a possibilidade contextual de que a fala seja uma declaração de juízo contra os habitantes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando sua função como nome próprio no texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido da fala de Yahweh aos habitantes da Babilônia
  choice: “falou aos”, com nota explicando o contexto de juízo
  alternative: “falou contra”
  rationale: A preposição hebraica permite naturalmente “aos”, enquanto o contexto indica que a mensagem lhes é adversa. Texto e nota preservam simultaneamente a forma e a força contextual.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural e vocabulário militar acessível. A formulação mantém o paralelismo conciso das ordens e preserva em notas as ambiguidades lexicais relevantes.
