  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
translation:
  language: pt
  text: Por meio de você despedacei o cavalo e seu cavaleiro; por meio de você despedacei o carro de guerra e seu condutor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי
  choice: despedacei
  rationale: O piel de נָפַץ expressa quebra violenta, isto é, esmagar ou fazer em pedaços. “Despedacei” preserva a força da imagem bélica e é repetido para refletir o paralelismo hebraico.
- source_word: בְךָ
  choice: com você
  rationale: 'A preposição בְּ tem aqui valor instrumental: o interlocutor é o meio empregado pelo sujeito da primeira pessoa. “Com você” mantém esse sentido sem transformar o interlocutor no agente principal.'
- source_word: סוּס
  choice: cavalo
  rationale: O substantivo significa simplesmente “cavalo”. O contexto militar permite inferir um cavalo de guerra, mas não exige acrescentar essa especificação.
- source_word: רֹכְבוֹ (primeira ocorrência)
  choice: seu cavaleiro
  rationale: O particípio de רכב designa quem monta. Junto de “cavalo”, “seu cavaleiro” expressa naturalmente em português o sufixo possessivo hebraico.
- source_word: רֶכֶב
  choice: carro de guerra
  rationale: רֶכֶב pode designar um carro ou, em certos contextos, a força de carros. A construção singular com seu condutor favorece aqui um carro individual; “de guerra” torna claro o referente militar no português atual.
- source_word: רֹכְבוֹ (segunda ocorrência)
  choice: seu condutor
  rationale: A forma hebraica é a mesma da primeira ocorrência e significa literalmente quem monta ou conduz. Em relação ao carro de guerra, “condutor” comunica o papel com naturalidade, sem recorrer ao termo menos corrente “auriga”.
theological_decisions:
- issue: Instrumentalidade do interlocutor no juízo divino
  choice: “Com você despedacei”, mantendo o sujeito da primeira pessoa como agente e o interlocutor como instrumento.
  alternative: “Por meio de você despedacei” ou “por você despedacei”.
  rationale: Os verbos hebraicos estão na primeira pessoa e as expressões com בְךָ indicam o meio empregado. A formulação preserva essa distinção sem identificar, neste versículo isolado, o interlocutor nem ampliar a interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo próximo ao hebraico. “Carro de guerra” evita a possível ambiguidade moderna de “carro”, e “condutor” é mais corrente do que “auriga”. O marcador [a] aparece no texto principal.
