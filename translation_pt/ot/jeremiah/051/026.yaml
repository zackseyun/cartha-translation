  text: וְ/לֹֽא יִקְח֤וּ מִמְּ/ךָ֙ אֶ֣בֶן לְ/פִנָּ֔ה וְ/אֶ֖בֶן לְ/מֽוֹסָד֑וֹת כִּֽי שִׁמְמ֥וֹת עוֹלָ֛ם תִּֽהְיֶ֖ה נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/026.yaml
  text: And they will not take from you a stone for a corner or a stone for foundations[a], for you will be everlasting desolations[b], declares Yahweh.
translation:
  language: pt
  text: E não tomarão de você uma pedra para uma esquina[a], nem uma pedra para alicerces, pois você será desolações perpétuas[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pedra angular”. Hebraico literalmente: “uma pedra para uma esquina”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma desolação para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִקְחוּ מִמְּךָ
  choice: E não tirarão de você
  rationale: Preserva a negação, o valor futuro do imperfeito e a referência direta à Babilônia personificada no singular.
- source_word: אֶבֶן לְפִנָּה
  choice: pedra para canto
  rationale: Mantém a expressão hebraica concreta sem impor o sentido técnico mais específico de “pedra angular”.
- source_word: וְאֶבֶן לְמוֹסָדוֹת
  choice: nem pedra para alicerces
  rationale: Conserva o paralelismo e o plural de מוֹסָדוֹת; “nem” expressa naturalmente a continuação da negação em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual nenhuma pedra da Babilônia será reaproveitada.
- source_word: שִׁמְמוֹת עוֹלָם
  choice: uma desolação para sempre
  rationale: Comunica com naturalidade o estado permanente de ruína. O plural hebraico admite também uma tradução formal no plural, registrada em nota.
- source_word: תִּהְיֶה
  choice: você será
  rationale: Traduz diretamente o imperfeito de היה e preserva a personificação da cidade.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e translitera o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Duração de שִׁמְמוֹת עוֹלָם
  choice: desolação para sempre
  alternative: desolações perpétuas
  rationale: A tradução mantém a força duradoura de עוֹלָם sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção “pedra para canto” preserva a imagem do original, e o travessão destaca naturalmente a fórmula profética final.
