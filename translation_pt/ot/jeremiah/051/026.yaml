  source_fidelity: A tradução preserva a negação, o futuro, a interlocução direta com Babilônia personificada e a fórmula final com o nome divino. Contudo, “uma desolação para sempre” neutraliza no texto principal o plural hebraico שִׁמְמוֹת, que convém manter. “Pedra para canto” também soa elíptico em português moderno; “pedra para uma esquina” conserva a imagem não técnica do hebraico com maior clareza.
  naturalness: “Não tomarão de você” expressa melhor neste contexto o aproveitamento de pedras de Babilônia do que “não tirarão de você”. A redação revista permanece moderna e legível em português brasileiro, sem perder o tom profético.
  terminology: “Yahweh” reproduz adequadamente o Tetragrama conforme a decisão editorial. “Pedra para uma esquina” evita impor “pedra angular”, que deve ficar como alternativa em nota. “Desolações perpétuas” preserva o plural e a duração de שִׁמְמוֹת עוֹלָם.
