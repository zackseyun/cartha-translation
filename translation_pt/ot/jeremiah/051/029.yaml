  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּרְעַ֥שׁ הָ/אָ֖רֶץ וַ/תָּחֹ֑ל כִּ֣י קָ֤מָה עַל בָּבֶל֙ מַחְשְׁב֣וֹת יְהוָ֔ה לָ/שׂ֞וּם אֶת אֶ֧רֶץ בָּבֶ֛ל לְ/שַׁמָּ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/029.yaml
  text: And the earth quakes and writhes, for the plans of Yahweh have arisen against Babylon, to make the land of Babylon a desolation, without inhabitant.
translation:
  language: pt
  text: A terra treme e se contorce, pois os planos de Yahweh se levantaram contra a Babilônia, para fazer da terra da Babilônia uma desolação, sem nenhum habitante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: treme
  rationale: Expressa o abalo intenso de רעשׁ com linguagem natural e vívida em português.
- source_word: וַתָּחֹל
  choice: se contorce
  rationale: Preserva a imagem corporal e convulsiva de חול, que pode evocar dores de parto ou angústia, sem reduzi-la a mero tremor.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto de reação convulsiva favorece o sentido abrangente de 'terra', em contraste com a referência territorial específica à terra da Babilônia no fim do versículo.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira clara e digna a razão do tremor da terra.
- source_word: קָמָה
  choice: se levantaram
  rationale: Mantém a imagem hebraica dos planos divinos que se erguem contra a Babilônia; a concordância plural é natural em português.
- source_word: מַחְשְׁבוֹת
  choice: os planos
  rationale: Neste contexto de juízo, designa intenções deliberadas prestes a ser executadas, mais claramente do que 'pensamentos'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לָשׂוּם
  choice: para fazer de
  rationale: A construção indica transformar o objeto no estado expresso pelo predicativo seguinte.
- source_word: אֶרֶץ בָּבֶל
  choice: a terra da Babilônia
  rationale: Aqui אֶרֶץ se refere especificamente ao território babilônico.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: Conserva o peso do vocabulário profético de devastação e ruína.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem nenhum habitante
  rationale: Reproduz de modo conciso e idiomático a ausência total de moradores.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: Preserva no texto o nome pessoal representado pelo tetragrama, sem convertê-lo em título nem privilegiar a forma tradicional alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo profético, a personificação da terra e a imagem dos planos de Yahweh que se levantam contra a Babilônia.
