  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֚יךְ נִלְכְּדָ֣ה שֵׁשַׁ֔ךְ וַ/תִּתָּפֵ֖שׂ תְּהִלַּ֣ת כָּל הָ/אָ֑רֶץ אֵ֣יךְ הָיְתָ֧ה לְ/שַׁמָּ֛ה בָּבֶ֖ל בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/041.yaml
  text: How Sheshak has been captured[c][b][a], and the praise of the whole earth seized! How Babylon has become a desolation among the nations!
translation:
  language: pt
  text: Como foi capturada Sesaque[a], e tomada aquela que era o louvor de toda a terra![b] Como Babilônia se tornou uma desolação entre as nações![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sesaque é geralmente entendido como um nome cifrado para Babilônia.
    reason: alternative_reading
  - marker: b
    text: Ou “a glória de toda a terra” ou “o orgulho de toda a terra”.
    reason: lexical_alternative
  - marker: c
    text: Ou “um horror”; o termo hebraico pode indicar tanto a ruína como o horror que ela provoca.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz exclamação de espanto e lamento, não uma pergunta sobre o modo; “Como” preserva essa força retórica em português.
- source_word: נִלְכְּדָה
  choice: foi capturada
  rationale: O nifal perfeito de לכד expressa ser tomada ou capturada; o pretérito perfeito é natural para o acontecimento consumado contemplado com espanto.
- source_word: שֵׁשַׁךְ
  choice: Sesaque
  rationale: Mantém no texto o nome hebraico, tradicionalmente entendido como designação cifrada de Babilônia, identificação explicada em nota.
- source_word: וַתִּתָּפֵשׂ
  choice: tomada
  rationale: תפשׂ significa agarrar, prender ou capturar. “Tomada” evita repetição imediata de “capturada” e conserva o paralelismo.
- source_word: תְּהִלַּת כָּל הָאָרֶץ
  choice: aquela que era o louvor de toda a terra
  rationale: תהלה significa diretamente “louvor”, mas aqui designa de modo metonímico aquela que era louvada. A formulação conserva o termo e produz sentido natural em português sem eliminar alternativas como “glória” ou “orgulho”.
- source_word: הָיְתָה לְשַׁמָּה
  choice: se tornou uma desolação
  rationale: שַׁמָּה pode indicar devastação e também o horror ou espanto que ela provoca. “Desolação” expressa claramente o estado arruinado, deixando a nuance reativa para a nota.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גוים refere-se aqui aos povos ou nações em geral; “nações” é natural e evita um sentido teológico posterior de “gentios”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura exclamativa e o paralelismo poético do hebraico foram preservados; a metonímia de “louvor” foi explicitada apenas o necessário para soar natural.
