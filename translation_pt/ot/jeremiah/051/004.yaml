base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/004.yaml
  text: And the slain will fall in the land of the Chaldeans[b][a], and the pierced in her streets.
translation:
  language: pt
  text: E os mortos cairão na terra dos caldeus[a], e os traspassados, em suas ruas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Caldeia” ou “na terra dos babilônios”. O hebraico diz literalmente “na terra dos caldeus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em suas praças” ou “em seus espaços abertos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפְלוּ
  choice: E cairão
  rationale: O perfeito qal com conjunção, neste anúncio profético de juízo, expressa naturalmente em português o resultado futuro anunciado.
- source_word: חֲלָלִים
  choice: mortos
  rationale: O substantivo designa pessoas mortas ou mortalmente feridas; “mortos” é claro e natural e, com “cairão”, comunica o sentido coletivo sem recorrer ao menos corrente “mortos à espada”.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: na terra dos caldeus
  rationale: Mantém o etnônimo explícito כַּשְׂדִּים e reproduz de perto a construção hebraica, sem substituí-lo interpretativamente por “babilônios”.
- source_word: וּמְדֻקָּרִים
  choice: e os que forem traspassados
  rationale: O particípio passivo de דקר indica pessoas perfuradas por uma arma. “Traspassados” preserva a imagem violenta e o paralelismo com os mortos.
- source_word: בְּחוּצוֹתֶיהָ
  choice: em suas ruas
  rationale: חוּצוֹת pode designar ruas, praças ou espaços abertos públicos; “ruas” é a opção mais natural no contexto urbano. O possessivo feminino retoma a terra personificada.
