  text: וְ/הָיְתָה֩ בָבֶ֨ל לְ/גַלִּ֧ים מְעוֹן תַּנִּ֛ים שַׁמָּ֥ה וּ/שְׁרֵקָ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/037.yaml
  text: And Babylon will become heaps[a], a haunt of jackals, a horror and a hissing[c][b], with no inhabitant.
translation:
  language: pt
  text: E Babilônia se tornará montões de ruínas[a], morada de chacais[b], motivo de horror e de assobios de desprezo[c], sem nenhum habitante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz o substantivo no plural: “montões” ou “montes de escombros”.'
    reason: lexical_alternative
  - marker: b
    text: Traduções antigas trazem “dragões”; neste contexto de desolação, o termo hebraico provavelmente se refere a chacais.
    reason: lexical_alternative
  - marker: c
    text: Ou “assobios”; isto é, uma reação de desprezo, repulsa ou zombaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: se tornará
  rationale: No discurso profético, a forma verbal com a conjunção expressa aqui o resultado futuro; “se tornará” comunica a passagem de Babilônia à condição de ruína.
- source_word: בָבֶל
  choice: Babilônia
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: לְגַלִּים
  choice: montões de ruínas
  rationale: Preserva o plural hebraico e explicita, de modo natural no contexto, que se trata de amontoados de escombros.
- source_word: מְעוֹן
  choice: morada
  rationale: Expressa o lugar ocupado pelos animais após a destruição, mantendo a imagem concreta do hebraico.
- source_word: תַּנִּים
  choice: chacais
  rationale: Em contextos proféticos de cidades desoladas, o termo é mais provavelmente uma referência a chacais, não aos “dragões” de traduções antigas.
- source_word: שַׁמָּה
  choice: motivo de horror
  rationale: Comunica tanto a devastação quanto a reação horrorizada que ela provoca, sem reduzir o termo apenas a “desolação”.
- source_word: וּשְׁרֵקָה
  choice: e de assobios de desprezo
  rationale: Conserva a imagem sonora do substantivo hebraico e esclarece que os assobios expressam escárnio ou repulsa, não admiração.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem nenhum habitante
  rationale: Reproduz de forma concisa a ausência total de quem habite o lugar.
theological_decisions: []
