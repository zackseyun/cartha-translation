  text: חָדְלוּ֩ גִבּוֹרֵ֨י בָבֶ֜ל לְ/הִלָּחֵ֗ם יָֽשְׁבוּ֙ בַּ/מְּצָד֔וֹת נָשְׁתָ֥ה גְבוּרָתָ֖/ם הָי֣וּ לְ/נָשִׁ֑ים הִצִּ֥יתוּ מִשְׁכְּנֹתֶ֖י/הָ נִשְׁבְּר֥וּ בְרִיחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/030.yaml
  text: The warriors of Babylon have stopped fighting; they sit in the strongholds[a]. Their strength has failed; they have become like women. Her dwellings are set on fire; her bars are broken.
translation:
  language: pt
  text: Os guerreiros da Babilônia deixaram de lutar; permanecem nas fortalezas. Sua força se esgotou; tornaram-se como mulheres[a]. Puseram fogo nas moradas dela; as barras de seus portões foram quebradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tornaram-se mulheres”. É uma provocação militar do mundo antigo, que retrata os guerreiros como tendo perdido a coragem e a força para lutar; não descreve uma transformação literal.
    reason: Esclarece a função retórica histórica da expressão hebraica e registra sua formulação literal.
lexical_decisions:
- source_word: חָדְלוּ ... לְהִלָּחֵם
  choice: deixaram de lutar
  rationale: Expressa naturalmente em português a cessação da atividade indicada por חדל seguido do infinitivo com ל.
- source_word: גִבּוֹרֵי בָבֶל
  choice: os guerreiros da Babilônia
  rationale: No contexto militar, גִבּוֹרִים designa combatentes valentes ou poderosos; “guerreiros” é claro e não arcaico.
- source_word: יָשְׁבוּ בַּמְּצָדוֹת
  choice: permanecem nas fortalezas
  rationale: ישׁב pode significar sentar-se, ficar ou permanecer. Aqui descreve a retirada passiva dos combatentes para lugares fortificados; “permanecem” comunica o sentido contextual sem sugerir necessariamente postura física.
- source_word: נָשְׁתָה גְבוּרָתָם
  choice: sua força se esgotou
  rationale: O verbo descreve perda ou exaustão, e גְבוּרָה denota força ou poderio; a formulação preserva a imagem do vigor militar consumido.
- source_word: הָיוּ לְנָשִׁים
  choice: tornaram-se mulheres
  rationale: Mantém a formulação incisiva e genderizada da antiga provocação hebraica, sem introduzir no texto principal uma comparação ausente de forma explícita.
- source_word: הִצִּיתוּ מִשְׁכְּנֹתֶיהָ
  choice: puseram fogo nas moradas dela
  rationale: Preserva o verbo ativo plural do hebraico e deixa seus agentes sem identificação, como no texto-fonte. “Moradas” conserva a abrangência de מִשְׁכָּנוֹת.
- source_word: נִשְׁבְּרוּ בְרִיחֶיהָ
  choice: seus ferrolhos foram quebrados
  rationale: בְּרִיחִים são barras ou ferrolhos que fecham portas e portões; “ferrolhos” comunica a função defensiva, e a voz passiva corresponde ao nifal.
theological_decisions:
- issue: Sentido da expressão הָיוּ לְנָשִׁים
  choice: tornaram-se mulheres
  alternative: tornaram-se como mulheres
  rationale: A expressão funciona como uma provocação profética baseada na imagem marcial de gênero do mundo antigo, apontando para perda de coragem e força em combate. A tradução mantém a retórica literal, enquanto a nota esclarece seu sentido contextual e evita que seja entendida como transformação sexual literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é direta; “permanecem” evita uma leitura excessivamente física de יָשְׁבוּ, e “dela” mantém Babilônia como antecedente feminino. A nota preserva a tensão retórica do hebraico sem endossar como princípio geral sua comparação cultural antiga.
