review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a cessação da luta, o recolhimento às fortificações, o esgotamento da força e a destruição das habitações e dos ferrolhos. Contudo, הָיוּ לְנָשִׁים é literalmente “tornaram-se mulheres”; no contexto, a construção é um insulto/taunt militar antigo e funciona comparativamente em sentido pragmático. Em português atual, “tornaram-se mulheres” pode ser lido como afirmação literal de transformação e desloca indevidamente o foco do oráculo. “Tornaram-se como mulheres” preserva a imagem comparativa e a retórica histórica, com a nota explicativa.
  naturalness: O texto é claro, moderno e de boa legibilidade. “Permanecem nas fortalezas” é uma boa solução contextual para יָשְׁבוּ. “Ferrolhos” é correto, mas “barras dos portões” torna mais visível a função defensiva de בְּרִיחִים e é mais amplamente transparente. A concordância pronominal em “suas” evita uma possível ambiguidade com os ferrolhos de Babilônia.
  terminology: “Guerreiros”, “fortalezas”, “força” e “moradas” são apropriados. A nota deve caracterizar a frase como insulto/imagem marcial antiga, sem apresentar a associação como verdade normativa sobre mulheres. “Como mulheres” corresponde à força contextual da expressão sem alegar uma mudança literal.
  issues:
  - severity: medium
    issue: “tornaram-se mulheres” no texto principal
    rationale: Embora reproduza de perto a forma superficial hebraica, em português moderno pode sugerir uma transformação literal e não comunica de modo seguro a função comparativa da provocação militar antiga. “Tornaram-se como mulheres” preserva a imagem e evita essa falsa implicação.
  - severity: low
    issue: “seus ferrolhos”
    rationale: É fiel, mas o antecedente de “seus” pode ser momentaneamente ambíguo após “moradas dela”. “As barras de seus portões” explicita o referente defensivo de בְּרִיחֶיהָ sem acrescentar sentido material indevido.
