source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וּ/פָקַדְתִּ֖י עַל פְּסִילֶ֑י/הָ וּ/בְ/כָל אַרְצָ֖/הּ יֶאֱנֹ֥ק חָלָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/052.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will punish her carved images, and throughout all her land the wounded will groan.
translation:
  language: pt
  text: Por isso, eis que vêm dias — declara Yahweh — em que castigarei suas imagens esculpidas[a], e, por toda a sua terra, gemerão os traspassados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os ídolos dela”. O termo hebraico designa especificamente imagens cultuais esculpidas.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode referir-se a pessoas traspassadas, feridas ou mortas.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a conclusão inferencial em relação ao juízo anunciado no contexto anterior.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a força dêitica e solene do marcador profético em português corrente e digno.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Mantém o idioma profético hebraico e sua forma indefinida sem acrescentar artigo.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética como ato de fala autorizado e conserva o nome divino.
- source_word: וּפָקַדְתִּי עַל
  choice: castigarei
  rationale: No contexto de juízo, פקד על indica chamar à responsabilidade e aplicar punição.
- source_word: פְּסִילֶיהָ
  choice: as imagens esculpidas dela
  rationale: Preserva o sentido concreto de imagens cultuais talhadas e o sufixo feminino que remete à Babilônia.
- source_word: וּבְכָל אַרְצָהּ
  choice: por toda a sua terra
  rationale: Comunica com naturalidade a extensão distributiva do sofrimento por todo o território dela.
- source_word: יֶאֱנֹק
  choice: gemerão
  rationale: Verte o sofrimento audível indicado pelo verbo, com concordância plural exigida pela expressão coletiva em português.
- source_word: חָלָל
  choice: os feridos
  rationale: Embora o termo frequentemente denote mortos em contexto militar, o verbo 'gemer' favorece aqui o sentido possível de feridos, sem eliminar a ambiguidade lexical em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de חָלָל em combinação com 'gemer'
  choice: os feridos
  alternative: os mortos; os traspassados
  rationale: חָלָל pode designar alguém ferido, traspassado ou morto. Como o sujeito geme, 'os feridos' oferece a leitura contextual mais coerente, enquanto a nota conserva a amplitude e a tensão do hebraico.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com boa legibilidade brasileira. A construção profética 'eis que vêm dias' foi preservada; travessões destacam com clareza a fórmula de declaração. A nota está marcada no texto principal.
