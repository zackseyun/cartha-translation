revisions:
- from: Por isso, eis que vêm dias — declara Yahweh — em que castigarei as imagens esculpidas dela[a], e por toda a sua terra gemerão os feridos.
  to: Por isso, eis que vêm dias — declara Yahweh — em que castigarei suas imagens esculpidas[a], e, por toda a sua terra, gemerão os traspassados[b].
  rationale: A revisão torna a expressão possessiva natural em português e substitui «feridos» por «traspassados», que se aproxima mais de חָלָל sem tornar impossível o ato de gemer. A nova nota explicita a amplitude semântica do hebraico e preserva a tensão contextual, sem impor uma solução interpretativa.
