  text: וּ/פֶן יֵרַ֤ךְ לְבַבְ/כֶם֙ וְ/תִֽירְא֔וּ בַּ/שְּׁמוּעָ֖ה הַ/נִּשְׁמַ֣עַת בָּ/אָ֑רֶץ וּ/בָ֧א בַ/שָּׁנָ֣ה הַ/שְּׁמוּעָ֗ה וְ/אַחֲרָ֤י/ו בַּ/שָּׁנָה֙ הַ/שְּׁמוּעָ֔ה וְ/חָמָ֣ס בָּ/אָ֔רֶץ וּ/מֹשֵׁ֖ל עַל מֹשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/046.yaml
  text: And do not let your heart grow faint[a], and do not fear the report heard in the land; a report will come in one year, and after it in the next year another report, and violence in the land[c][b], ruler against ruler.
translation:
  language: pt
  text: Não deixem que o coração de vocês desfaleça[a], nem tenham medo da notícia[b] que se ouve na terra. Num ano virá uma notícia, e no ano seguinte, outra notícia; haverá violência na terra e governante contra governante[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o coração de vocês se torne brando”. A expressão indica perder o ânimo ou a coragem.
    reason: lexical_alternative
  - marker: b
    text: Ou “relato” ou “rumor”. O termo hebraico שְׁמוּעָה pode designar informações que circulam, confirmadas ou não.
    reason: lexical_alternative
  - marker: c
    text: Ou “governante sobre governante”. A expressão pode retratar conflito entre governantes ou rápida sucessão política.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפֶן
  choice: Não deixem... nem
  rationale: A partícula פן introduz uma advertência negativa. Em português, a formulação direta preserva essa força e rege naturalmente os dois verbos seguintes.
- source_word: יֵרַךְ לְבַבְכֶם
  choice: que o coração de vocês desfaleça
  rationale: רכך significa literalmente tornar-se macio ou fraco; com “coração”, indica perda de ânimo ou coragem. “Desfaleça” conserva a imagem sem soar artificial.
- source_word: וְתִירְאוּ
  choice: nem tenham medo
  rationale: O Qal de ירא significa ter medo. “Nem” prolonga com clareza a advertência negativa iniciada por ופן.
- source_word: בַּשְּׁמוּעָה הַנִּשְׁמַעַת בָּאָרֶץ
  choice: da notícia que se ouve na terra
  rationale: שְׁמוּעָה pode designar notícia, relato ou rumor, enquanto o particípio נִשְׁמַעַת é mantido de modo transparente por “que se ouve”.
- source_word: וּבָא בַשָּׁנָה הַשְּׁמוּעָה
  choice: Num ano virá uma notícia
  rationale: A construção anuncia a chegada de notícias em determinado ano. O artigo hebraico não precisa ser reproduzido como definido, pois a sequência apresenta notícias sucessivas.
- source_word: וְאַחֲרָיו בַּשָּׁנָה הַשְּׁמוּעָה
  choice: e no ano seguinte, outra notícia
  rationale: אַחֲרָיו assinala sequência após a notícia ou o período anterior. “Seguinte” e “outra” tornam natural em português a repetição implícita sem acrescentar conteúdo novo.
- source_word: וְחָמָס בָּאָרֶץ
  choice: haverá violência na terra
  rationale: חָמָס denota violência, injustiça violenta ou opressão. “Violência” é a correspondência mais direta; “haverá” explicita em português a oração nominal dentro do quadro futuro.
- source_word: וּמֹשֵׁל עַל מֹשֵׁל
  choice: e governante contra governante
  rationale: מֹשֵׁל é quem governa. Embora עַל costume significar “sobre”, neste contexto de tumulto pode indicar oposição; a ambiguidade é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural é expresso por “vocês”; “terra” preserva a formulação hebraica, e a repetição de “notícia” mantém o efeito das notícias alarmantes sucessivas.
