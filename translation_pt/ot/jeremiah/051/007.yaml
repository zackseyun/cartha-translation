  to: A Babilônia era um cálice de ouro na mão de Yahweh[a]; ela embriagava toda a terra. As nações beberam do vinho dela; por isso, enlouqueceram[b].
  rationale: A substituição da oração relativa por “ela embriagava” torna inequívoco que Babilônia—identificada metaforicamente com o cálice—é o agente da embriaguez, conforme a concordância feminina e o fluxo do hebraico. O ponto e vírgula organiza naturalmente as duas afirmações nominais/participiais, sem acrescentar explicação ao texto.
