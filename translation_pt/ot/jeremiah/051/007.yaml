base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/007.yaml
  text: Babylon was a golden cup in the hand of Yahweh[a], making all the earth drunk. Nations drank from her wine[b]; therefore the nations have gone mad.
translation:
  language: pt
  text: A Babilônia era um cálice de ouro na mão de Yahweh[a]; ela embriagava toda a terra. As nações beberam do vinho dela; por isso, enlouqueceram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente representado por “SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: Ou “passaram a agir como loucas” ou “foram levadas à loucura”. O verbo hebraico pode indicar delírio, frenesi ou comportamento irracional.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס זָהָב
  choice: um cálice de ouro
  rationale: Reproduz de modo natural a imagem hebraica e preserva a metáfora da Babilônia como instrumento de embriaguez e juízo.
- source_word: בָּבֶל
  choice: a Babilônia
  rationale: Forma portuguesa consagrada do topônimo; o artigo definido é idiomático em português.
- source_word: בְּיַד יְהוָה
  choice: na mão de Yahweh
  rationale: Mantém o idiomatismo de posse e instrumentalidade sem explicitar além do que o hebraico afirma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: מְשַׁכֶּרֶת
  choice: que embriagava
  rationale: O particípio feminino concorda com o cálice ou, por sentido, com a Babilônia; a oração relativa comunica naturalmente a ação causativa e contínua no contexto narrativo.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: O contexto das nações favorece o alcance amplo de 'terra', em vez do sentido mais restrito de 'país'.
- source_word: מִיֵּינָהּ
  choice: do vinho dela
  rationale: Representa a preposição מִן e conserva o sufixo feminino que retoma a Babilônia personificada.
- source_word: שָׁתוּ גוֹיִם
  choice: As nações beberam
  rationale: Tradução direta e idiomática; o artigo é natural em português e prepara a retomada implícita na oração seguinte.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Expressa com clareza e concisão a relação causal-consecutiva.
- source_word: יִתְהֹלְלוּ
  choice: enlouqueceram
  rationale: No contexto da embriaguez, o Hitpolel de הלל indica comportamento delirante, frenesi ou loucura; o pretérito comunica o resultado dos atos anteriores sem resolver indevidamente a nuance entre estado e comportamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal, enquanto a nota informa a tradição de substituí-lo por 'SENHOR'.
- issue: Metáfora da embriaguez causada pela Babilônia
  choice: A Babilônia aparece como cálice na mão de Yahweh, e as nações enlouquecem ao beber de seu vinho.
  alternative: Interpretar explicitamente o cálice apenas como poder político ou definir a natureza exata do juízo.
  rationale: A tradução mantém juntas a atuação da Babilônia e sua condição de instrumento na mão de Yahweh, sem acrescentar uma explicação doutrinária ausente do versículo.
- issue: Agente gramatical de מְשַׁכֶּרֶת
  choice: Usar uma oração relativa que, em português, pode retomar naturalmente o cálice dentro da metáfora.
  alternative: Explicitar 'a Babilônia embriagava' ou 'ele fazia toda a terra embriagar-se'.
  rationale: A forma feminina hebraica permite associação formal com כּוֹס, substantivo feminino, e a metáfora identifica o cálice com a Babilônia; convém não forçar uma distinção.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Cálice” preserva o tom bíblico sem ser obscuro; “enlouqueceram” transmite de forma direta a força contextual do verbo hebraico.
