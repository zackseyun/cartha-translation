source:
  edition: WLC
  text: וְ֠/הִשְׁכַּרְתִּי שָׂרֶ֨י/הָ וַ/חֲכָמֶ֜י/הָ פַּחוֹתֶ֤י/הָ וּ/סְגָנֶ֨י/הָ֙ וְ/גִבּוֹרֶ֔י/הָ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/057.yaml
  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: pt
  text: E embriagarei suas autoridades — seus sábios, seus governadores[a], seus administradores e seus guerreiros — e eles dormirão um sono eterno e não despertarão, declara o Rei, cujo nome é Yahweh dos Exércitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sátrapas”; o termo hebraico designa, de modo mais geral, governadores administrativos.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכַּרְתִּי
  choice: embriagarei
  rationale: O hifil de שׁכר é causativo. “Embriagarei” expressa de modo conciso e natural que Yahweh os fará ficar bêbados como ato de juízo.
- source_word: שָׂרֶיהָ
  choice: os seus líderes
  rationale: שׂר pode indicar príncipes, autoridades ou líderes. “Líderes” abrange a elite governante sem sugerir necessariamente membros da família real.
- source_word: חֲכָמֶיהָ
  choice: os seus sábios
  rationale: Tradução direta e corrente para os homens reconhecidos por sua sabedoria, provavelmente conselheiros da corte.
- source_word: פַּחוֹתֶיהָ
  choice: os seus governadores
  rationale: פּחה designa um governador administrativo. “Governadores” é claro e evita a especificidade histórica potencialmente excessiva de “sátrapas”.
- source_word: סְגָנֶיהָ
  choice: os seus administradores
  rationale: סגן designa autoridades subordinadas. “Administradores” diferencia este grupo dos governadores e comunica sua função oficial sem impor uma hierarquia demasiado específica.
- source_word: גִבּוֹרֶיהָ
  choice: os seus guerreiros
  rationale: גבור, neste contexto, aponta para homens valentes ou poderosos em sentido militar; “guerreiros” é atual e claro.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: eles dormirão um sono eterno
  rationale: Preserva a metáfora hebraica do sono para a morte e mantém a força de עוֹלָם sem explicitar uma doutrina que o texto não formula.
- source_word: וְלֹא יָקִיצוּ
  choice: e não despertarão
  rationale: Mantém literalmente a imagem do sono e exprime a irreversibilidade do juízo em português digno e natural.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente da fórmula profética de pronunciamento autorizado.
- source_word: הַמֶּלֶךְ
  choice: o Rei
  rationale: Funciona como título divino no contexto; a inicial maiúscula assinala esse uso titular.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título tradicional.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: “Exércitos” comunica concretamente o sentido de צבאות; a expressão titular “Yahweh dos Exércitos” é compreensível no português moderno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem o substituir por um título.
- issue: Sentido de “sono eterno”
  choice: preservar a metáfora de dormir e não despertar
  alternative: explicitar como “morrer para sempre” ou “morrer e nunca ressuscitar”
  rationale: O texto descreve a morte sob juízo por meio da imagem do sono irreversível. A tradução retém a imagem e não resolve além do hebraico questões sobre ressurreição ou aniquilação.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. A enumeração administrativa foi mantida, assim como a metáfora solene do sono. Os marcadores [a] e [b] aparecem no texto principal.
