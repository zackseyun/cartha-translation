  terminology: «Autoridades» representa שָׂרֶיהָ com mais precisão administrativa do que «líderes», sem restringir o termo a príncipes. «Administradores» para סְגָנֶיהָ, «governadores» para פַּחוֹתֶיהָ e «Yahweh dos Exércitos» são escolhas aceitáveis. As notas estão corretamente ancoradas.
