source:
  edition: WLC
  text: וּ/פָקַדְתִּ֨י עַל בֵּ֜ל בְּ/בָבֶ֗ל וְ/הֹצֵאתִ֤י אֶת בִּלְע/וֹ֙ מִ/פִּ֔י/ו וְ/לֹֽא יִנְהֲר֥וּ אֵלָ֛י/ו ע֖וֹד גּוֹיִ֑ם גַּם חוֹמַ֥ת בָּבֶ֖ל נָפָֽלָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/044.yaml
  text: And I will punish Bel in Babylon[a], and I will bring out of his mouth what he has swallowed; nations will no longer stream to him[b]. Even the wall of Babylon has fallen.
translation:
  language: pt
  text: Castigarei Bel na Babilônia e tirarei da boca dele aquilo que engoliu. As nações não mais afluirão a ele.[a] Até a muralha da Babilônia caiu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo hebraico retrata as nações movendo-se em direção a Bel como uma corrente. Também poderia ser traduzido: “não mais correrão para ele como um rio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Também poderia ser traduzido: “a muralha da Babilônia cairá”. O hebraico pode empregar aqui o perfeito profético, descrevendo como já realizado um acontecimento futuro considerado certo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָקַדְתִּי עַל
  choice: Castigarei
  rationale: Com עַל em contexto de juízo, פקד comunica punição ou prestação de contas; “castigarei” expressa com clareza essa força judicial.
- source_word: בֵּל בְּבָבֶל
  choice: Bel na Babilônia
  rationale: Bel é o nome ou título da divindade babilônica, e a preposição localiza seu culto na Babilônia.
- source_word: וְהֹצֵאתִי אֶת בִּלְעוֹ מִפִּיו
  choice: e tirarei da boca dele aquilo que engoliu
  rationale: A formulação conserva a imagem concreta de Bel sendo forçado a devolver o que devorou, sem especificar se isso representa tributos, riquezas ou cativos.
- source_word: וְלֹא יִנְהֲרוּ אֵלָיו עוֹד גּוֹיִם
  choice: As nações não mais afluirão a ele
  rationale: “Afluirão” preserva a imagem de povos movendo-se como uma corrente em direção a Bel e mantém o pronome ligado ao antecedente imediato.
- source_word: גַּם חוֹמַת בָּבֶל נָפָלָה
  choice: Até a muralha da Babilônia caiu
  rationale: “Até” comunica o acréscimo enfático de גַּם; o singular “muralha” segue o hebraico, e “caiu” conserva o perfeito profético.
theological_decisions:
- issue: Referente dos pronomes em “da boca dele” e “a ele”
  choice: Os pronomes se referem a Bel, a divindade babilônica.
  alternative: Podem ser entendidos de modo mais amplo como referência à Babilônia personificada.
  rationale: Bel é o antecedente imediato, e as imagens de tirar algo de sua boca e de as nações afluírem a ele dão continuidade ao juízo contra essa divindade, embora também impliquem a queda religiosa e política da Babilônia.
- issue: Valor temporal de נָפָלָה
  choice: “caiu”, como perfeito profético
  alternative: “cairá”, como futuro simples
  rationale: O perfeito pode apresentar um acontecimento futuro como já realizado por causa de sua certeza. A tradução no passado conserva essa força retórica sem eliminar a possibilidade temporal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A metáfora do engolir foi mantida de forma concreta; “afluirão” preserva a imagem fluvial sem soar excessivamente técnica. A ordem e a concisão do anúncio profético foram conservadas.
