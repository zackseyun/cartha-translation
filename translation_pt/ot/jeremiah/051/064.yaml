  text: וְ/אָמַרְתָּ֗ כָּ֠כָה תִּשְׁקַ֨ע בָּבֶ֤ל וְ/לֹֽא תָקוּם֙ מִ/פְּנֵ֣י הָ/רָעָ֗ה אֲשֶׁ֧ר אָנֹכִ֛י מֵבִ֥יא עָלֶ֖י/הָ וְ/יָעֵ֑פוּ עַד הֵ֖נָּה דִּבְרֵ֥י יִרְמְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/064.yaml
  text: And you shall say[a], ‘Thus Babylon will sink and will not rise because of the disaster that I am bringing upon her, and they will grow weary.’ Up to this point are the words of Jeremiah.
translation:
  language: pt
  text: 'E você dirá: “Assim Babilônia afundará e não voltará a se levantar, por causa da calamidade que estou trazendo sobre ela; e eles ficarão exaustos[a]”. Até aqui, as palavras de Jeremias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarão cansados” ou “desfalecerão”. O verbo hebraico pode indicar cansaço, exaustão ou desfalecimento. O plural provavelmente se refere ao povo de Babilônia, não à cidade em si.
    reason: Alternativa lexical e esclarecimento da mudança gramatical de número e gênero.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: E você dirá
  rationale: O perfeito qal na segunda pessoa masculina singular, ligado por וְ na sequência de instruções, tem força prospectiva e injuntiva. A formulação mantém essa força em português natural.
- source_word: כָּכָה
  choice: Assim
  rationale: Advérbio dêitico que introduz a interpretação profética do ato simbólico; “assim” é conciso e preserva o registro solene.
- source_word: תִּשְׁקַע
  choice: afundará
  rationale: O qal imperfeito de שׁקע descreve o movimento de afundar e retoma diretamente o sinal do rolo lançado no Eufrates.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: וְלֹא תָקוּם
  choice: e não voltará a se levantar
  rationale: קום contrasta com o afundamento anterior. “Não voltará a se levantar” explicita naturalmente em português o sentido contextual de não se reerguer.
- source_word: מִפְּנֵי הָרָעָה
  choice: por causa da calamidade
  rationale: מִפְּנֵי expressa causa, e רָעָה designa aqui desgraça ou calamidade de juízo, não maldade moral.
- source_word: אֲשֶׁר אָנֹכִי מֵבִיא עָלֶיהָ
  choice: que estou trazendo sobre ela
  rationale: O particípio מֵבִיא comunica ação iminente ou em curso; a expressão conserva a imagem hebraica do juízo vindo sobre Babilônia.
- source_word: וְיָעֵפוּ
  choice: e eles ficarão exaustos
  rationale: O verbo יעף pode indicar cansaço, exaustão ou desfalecimento. O plural masculino cria uma mudança em relação a Babilônia, tratada no feminino singular, sem identificar expressamente o referente.
- source_word: עַד הֵנָּה
  choice: Até aqui
  rationale: Expressão de encerramento que assinala o fim da coleção ou seção; “Até aqui” é idiomático e conciso.
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: vão as palavras de Jeremias
  rationale: A oração nominal funciona como colofão. O verbo suprido produz um encerramento claro e digno em português.
theological_decisions:
- issue: Sentido de הָרָעָה na linguagem do juízo divino
  choice: calamidade
  alternative: mal; desastre
  rationale: Neste contexto, o substantivo descreve a calamidade punitiva trazida contra Babilônia, e não o mal moral. “Calamidade” preserva a severidade do juízo sem introduzir uma afirmação que o hebraico contextual não faz.
- issue: Referente do plural וְיָעֵפוּ
  choice: manter o pronome plural sem identificar seu referente no texto principal
  alternative: explicitar “os habitantes de Babilônia”
  rationale: A mudança do feminino singular, referente à cidade, para o masculino plural provavelmente aponta para seu povo, mas o hebraico não nomeia o sujeito. A tradução conserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala profética mantém ritmo solene sem arcaísmos; o colofão final é preservado como fórmula distinta de encerramento.
