source:
  edition: WLC
  text: הוֹצִ֥יא יְהוָ֖ה אֶת צִדְקֹתֵ֑י/נוּ בֹּ֚אוּ וּ/נְסַפְּרָ֣ה בְ/צִיּ֔וֹן אֶֽת מַעֲשֵׂ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/010.yaml
  text: Yahweh has brought forth our vindication. Come[a], and let us recount in Zion the work of Yahweh our God.
translation:
  language: pt
  text: Javé trouxe à luz a nossa vindicação.[a] Venham, e vamos contar em Sião a obra de Javé, nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos atos de justiça”, “nossas justiças”, “nossa justiça” ou “nossa justa causa”. O plural hebraico pode designar atos de justiça ou a vindicação pública de uma causa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: trouxe à luz
  rationale: O hifil de יצא significa fazer sair ou trazer para fora; neste contexto, a expressão portuguesa comunica que Javé tornou pública e manifesta a causa justa de seu povo, preservando a imagem concreta do hebraico.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma portuguesa corrente o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צִדְקֹתֵינוּ
  choice: a nossa justa causa
  rationale: O plural de צדקה pode indicar atos de justiça, manifestações de retidão ou a vindicação de uma causa. No contexto da queda da Babilônia e da libertação do povo, 'a nossa justa causa' exprime naturalmente o aspecto público e forense sem atribuir méritos morais ao povo; a nota preserva as alternativas.
- source_word: בֹּאוּ
  choice: Venham
  rationale: Imperativo masculino plural que convoca o grupo; 'Venham' é natural e inequívoco em português moderno.
- source_word: וּנְסַפְּרָה
  choice: e contemos
  rationale: O coortativo da primeira pessoa do plural expressa convite à ação conjunta. 'Contemos' conserva a ideia de narrar ou proclamar o feito de Deus.
- source_word: בְצִיּוֹן
  choice: em Sião
  rationale: Tradução locativa direta e idiomática da preposição ב com o topônimo.
- source_word: מַעֲשֵׂה
  choice: o que ... fez
  rationale: O substantivo singular significa obra, feito ou ação. A construção verbal é mais natural em português comum e mantém a referência abrangente à ação de Javé.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Equivalente possessivo direto que conserva a relação pactual expressa no hebraico.
theological_decisions:
- issue: Sentido de צִדְקֹתֵינוּ no contexto
  choice: a nossa justa causa
  alternative: nossos atos de justiça; nossa justiça; nossa vindicação
  rationale: O contexto celebra a intervenção pública de Javé em favor de seu povo. A opção escolhida mantém o campo semântico de justiça e o aspecto forense, sem sugerir que a libertação exalta as realizações morais de Israel. A nota registra a ambiguidade real do plural hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'Javé' como forma portuguesa do nome divino, 'Venham' para marcar claramente o destinatário plural e uma formulação verbal natural no encerramento.
