  text: הָבֵ֣רוּ הַ/חִצִּים֮ מִלְא֣וּ הַ/שְּׁלָטִים֒ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ מַלְכֵ֣י מָדַ֔י כִּֽי עַל בָּבֶ֥ל מְזִמָּת֖/וֹ לְ/הַשְׁחִיתָ֑/הּ כִּֽי נִקְמַ֤ת יְהוָה֙ הִ֔יא נִקְמַ֖ת הֵיכָלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/011.yaml
  text: Sharpen the arrows[a]; fill the shields. Yahweh has stirred up the spirit of the kings of Media, because his plan is against Babylon, to destroy her; for it is the vengeance of Yahweh[b], vengeance for his temple.
translation:
  language: pt
  text: 'Afiem as flechas;

    encham os escudos.[a]


    Yahweh despertou o espírito dos reis dos medos,

    pois o seu plano é contra a Babilônia,

    para destruí-la.


    Pois esta é a vingança de Yahweh,

    a vingança por seu templo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «encham os escudos». A combinação é incomum e o termo traduzido por «escudos» é discutido; alguns o entendem como «aljavas», resultando em «encham as aljavas».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבֵרוּ הַחִצִּים
  choice: Afiem as flechas
  rationale: O imperativo descreve a preparação das flechas para a batalha e pode envolver poli-las ou torná-las brilhantes. “Afiem” comunica naturalmente a finalidade militar, sem perder o sentido básico de prepará-las.
- source_word: מִלְאוּ הַשְּׁלָטִים
  choice: preparem os escudos
  rationale: הַשְּׁלָטִים designa normalmente escudos, enquanto o uso de מִלְאוּ, literalmente “encham”, é incomum nesta combinação. “Preparem” exprime de modo inteligível a ordem militar sem trocar silenciosamente “escudos” por “aljavas”; a dificuldade lexical é registrada em nota.
- source_word: הֵעִיר
  choice: despertou
  rationale: O hifil de עור indica que Yahweh despertou ou incitou os reis à ação.
- source_word: רוּחַ
  choice: o espírito
  rationale: Mantém a amplitude de רוּחַ, aqui referente à disposição interior, ao impulso ou ânimo dos reis.
- source_word: מַלְכֵי מָדַי
  choice: os reis dos medos
  rationale: Reproduz o plural “reis” e identifica de forma corrente em português o povo de מָדַי.
- source_word: מְזִמָּתוֹ
  choice: seu plano
  rationale: Expressa uma intenção deliberada sem acrescentar a conotação necessariamente negativa de “conspiração”.
- source_word: לְהַשְׁחִיתָהּ
  choice: destruí-la
  rationale: O sufixo feminino retoma Babilônia; em português, o pronome feminino concorda naturalmente com o nome da cidade.
- source_word: נִקְמַת יְהוָה
  choice: a vingança de Yahweh
  rationale: Preserva a formulação solene e deixa que o contexto determine se a expressão enfatiza a vingança pertencente a Yahweh ou executada por ele.
- source_word: נִקְמַת הֵיכָלוֹ
  choice: a vingança por seu templo
  rationale: O contexto indica que a profanação ou destruição do templo é a razão da vingança; “por” torna essa relação clara em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Agência divina na ação dos reis medos
  choice: Yahweh despertou o espírito dos reis dos medos
  alternative: Yahweh permitiu que os reis dos medos agissem
  rationale: O verbo causativo atribui explicitamente a Yahweh o despertar do impulso que move os reis. A tradução não reduz essa agência a mera permissão.
- issue: Referência de הִיא na frase sobre vingança
  choice: Pois esta é a vingança de Yahweh
  alternative: Pois ela é a vingança de Yahweh
  rationale: O pronome feminino retoma de modo natural נִקְמַת, substantivo feminino, e funciona enfaticamente. “Esta é” preserva a ênfase sem sugerir artificialmente que a própria Babilônia seja a vingança.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético em linhas breves. “Despertou o espírito” conserva a imagem hebraica; “preparem os escudos” evita uma formulação portuguesa sem sentido imediato, enquanto a nota preserva a dificuldade do texto.
