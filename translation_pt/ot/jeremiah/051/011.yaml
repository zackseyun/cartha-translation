  - severity: medium
    issue: «preparem os escudos» não traduz o imperativo מִלְאוּ.
    rationale: O verbo significa «encher/fazer cheio». Torná-lo «preparar» elimina uma dificuldade textual real e acrescenta um sentido genérico que não está expresso. A tradução principal deve manter «encham», enquanto a nota registra a incerteza acerca do objeto e a possibilidade de «aljavas».
  - severity: low
    issue: 'A finalidade do plano está apresentada como fragmento isolado: «destruí-la».'
    rationale: O infinitivo לְהַשְׁחִיתָהּ depende de «seu plano»; «para destruí-la» torna essa relação explícita e idiomática em português.
