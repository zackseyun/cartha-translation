id: JER.51.27
reference: Jeremiah 51:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׂאוּ נֵ֣ס בָּ/אָ֗רֶץ תִּקְע֨וּ שׁוֹפָ֤ר בַּ/גּוֹיִם֙ קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ גּוֹיִ֔ם הַשְׁמִ֧יעוּ עָלֶ֛י/הָ מַמְלְכ֥וֹת אֲרָרַ֖ט מִנִּ֣י וְ/אַשְׁכְּנָ֑ז פִּקְד֤וּ עָלֶ֨י/הָ֙ טִפְסָ֔ר הַֽעֲלוּ ס֖וּס כְּ/יֶ֥לֶק סָמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/027.yaml
  text: Raise a banner in the land[a]; blow a trumpet among the nations. Consecrate nations against her; summon against her the kingdoms of Ararat, Minni, and Ashkenaz. Appoint a marshal against her[d][c][b]; bring up horses like bristling locusts.
translation:
  language: pt
  text: Ergam um estandarte na terra[a]; toquem a trombeta entre as nações. Consagrem nações contra ela[b]; convoquem contra ela os reinos de Ararate, Mini e Asquenaz. Nomeiem contra ela um comandante[c]; façam avançar cavalos como gafanhotos eriçados[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ergam um sinal”. A expressão pode designar um estandarte militar ou um sinal elevado para convocação.'
    reason: lexical_alternative
  - marker: b
    text: “Consagrem nações contra ela” emprega linguagem de separar forças para a batalha e pode sugerir preparação para uma guerra sacral.
    reason: cultural_note
  - marker: c
    text: O termo hebraico traduzido por “comandante” é raro e designa algum tipo de oficial; também pode ser entendido como “chefe militar” ou “oficial de recrutamento”.
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “como gafanhotos peludos” ou “como gafanhotos ásperos”. A expressão hebraica é rara e vívida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Ergam um estandarte
  rationale: נֵס designa um sinal elevado, muitas vezes um estandarte militar. “Ergam um estandarte” é natural em português e conserva a ideia de convocação pública.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode significar “terra”, “país” ou “território”. “Na terra” mantém a concisão e a ambiguidade geográfica do hebraico.
- source_word: תִּקְעוּ שׁוֹפָר
  choice: toquem a trombeta
  rationale: שׁוֹפָר é uma trombeta feita de chifre, usada para alarme ou convocação. A formulação comunica claramente sua função militar sem exigir explicação no corpo do versículo.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם refere-se aqui aos povos estrangeiros mobilizados para a guerra; “entre as nações” preserva o alcance internacional da convocação.
- source_word: קַדְּשׁוּ עָלֶיהָ גּוֹיִם
  choice: Consagrem nações contra ela
  rationale: קדשׁ significa tornar santo ou separar, e em contexto militar pode indicar a separação ritual de forças para a batalha. “Consagrem” preserva essa dimensão sacral sem explicitar além do texto.
- source_word: הַשְׁמִיעוּ עָלֶיהָ
  choice: convoquem contra ela
  rationale: O hifil de שמע significa literalmente “façam ouvir” ou “anunciem”. No contexto, introduz os reinos chamados à guerra; “convoquem” expressa essa função militar.
- source_word: מַמְלְכוֹת אֲרָרַט מִנִּי וְאַשְׁכְּנָז
  choice: os reinos de Ararate, Mini e Asquenaz
  rationale: Os nomes regionais são transliterados em formas reconhecíveis em português, e “reinos de” representa a relação construta do hebraico.
- source_word: פִּקְדוּ עָלֶיהָ טִפְסָר
  choice: Nomeiem contra ela um comandante
  rationale: טִפְסָר é um termo raro, provavelmente um título de oficial ou autoridade militar. “Comandante” é compreensível e adequado ao contexto, enquanto a nota registra a incerteza lexical.
- source_word: הַעֲלוּ סוּס
  choice: façam avançar cavalos
  rationale: O hifil de עלה pode indicar fazer subir ou avançar tropas. O singular coletivo סוּס é vertido naturalmente pelo plural “cavalos”.
- source_word: כְּיֶלֶק סָמָר
  choice: como gafanhotos eriçados
  rationale: יֶלֶק designa uma espécie ou fase de gafanhoto, e סָמָר sugere algo eriçado, áspero ou peludo. A tradução conserva a imagem rara e vívida em vez de reduzi-la à ideia de enxame.
theological_decisions:
- issue: Linguagem sacral aplicada à mobilização militar
  choice: Consagrem nações contra ela
  alternative: Preparem nações para a guerra contra ela
  rationale: A opção escolhida preserva a ligação explícita de קדשׁ com consagração e a possível ideia de guerra sacral, sem impor uma interpretação teológica mais específica.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. A ordem rápida das convocações militares e as metáforas concretas do hebraico foram preservadas. Evitaram-se formas excessivamente arcaicas e explicações interpretativas no corpo do texto.
