source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּ֥עַל נְשִׂאִ֖ים מִ/קְצֵה אָ֑רֶץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יֹּ֥צֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/016.yaml
  text: At the sound of his voice, a multitude of waters is in the heavens; he makes clouds rise from the ends of the earth; he makes lightning for the rain, and brings out the wind from his storehouses.
translation:
  language: pt
  text: Ao som de sua voz, há uma multidão de águas nos céus; ele faz subir as nuvens[a] desde os confins da terra, produz relâmpagos para a chuva e faz sair o vento de seus depósitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vapores”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tesouros” ou “tesourarias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Ao som de sua voz
  rationale: O hebraico traz literalmente a ideia de ele 'dar a sua voz'. A formulação portuguesa preserva a circunstância introduzida por לְ e comunica com naturalidade a imagem da voz divina, sem explicá-la como trovão.
- source_word: הֲמוֹן מַיִם
  choice: uma multidão de águas
  rationale: הֲמוֹן pode indicar grande quantidade, massa ou tumulto. 'Multidão de águas' mantém a amplitude da imagem e sua possível dimensão sonora, sem reduzi-la apenas a 'estrondo' ou 'abundância'.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: No contexto meteorológico, שָׁמַיִם também poderia ser 'céu', mas o plural 'céus' conserva a dicção elevada e a imagem cosmológica do texto.
- source_word: וַיַּעַל נְשִׂאִים
  choice: ele faz subir as nuvens
  rationale: A construção apresenta Deus como aquele que faz as massas atmosféricas subirem. 'Nuvens' é a opção contextual mais natural, embora 'vapores' também seja lexicalmente possível.
- source_word: מִקְצֵה אָרֶץ
  choice: desde os confins da terra
  rationale: '''Confins da terra'' é uma expressão portuguesa bíblica natural para as extremidades ou regiões mais distantes do mundo; ''desde'' expressa claramente a origem do movimento.'
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: produz relâmpagos para a chuva
  rationale: '''Produz'' comunica adequadamente עָשָׂה neste enunciado sobre a ação característica de Deus. ''Para a chuva'' preserva a relação aberta expressa por לַ, em vez de defini-la mais estreitamente como ''com a chuva''.'
- source_word: וַיֹּצֵא רוּחַ
  choice: faz sair o vento
  rationale: O contexto de águas, nuvens, relâmpagos e chuva determina רוּחַ como 'vento'. A formulação mantém o movimento causativo sugerido pelo verbo.
- source_word: מֵאֹצְרֹתָיו
  choice: de seus depósitos
  rationale: אוֹצָר designa um lugar onde algo é armazenado e também pode significar tesouro ou tesouraria. 'Depósitos' preserva aqui a metáfora concreta de reservatórios divinos do vento.
theological_decisions:
- issue: Representação da soberania divina por meio de imagens cosmológicas e meteorológicas
  choice: Preservar as águas nos céus, as nuvens que sobem, os relâmpagos e os depósitos do vento como imagens poéticas concretas.
  alternative: Resumir dinamicamente o versículo como uma afirmação de que Deus controla as tempestades.
  rationale: O hebraico expressa a soberania de Deus sobre a criação mediante imagens elevadas, não por uma formulação abstrata. Mantê-las evita tanto transformar poesia em descrição científica quanto diluí-la em paráfrase teológica.
- issue: Valor da preposição em בְּרָקִים לַמָּטָר
  choice: relâmpagos para a chuva
  alternative: relâmpagos com a chuva
  rationale: A preposição לְ permite mais de uma relação entre os relâmpagos e a chuva. A tradução escolhida conserva essa formulação sem resolver silenciosamente a relação como simples simultaneidade.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética moderada. 'Multidão de águas', 'confins da terra' e 'depósitos' preservam as imagens do hebraico; os marcadores [a] e [b] aparecem junto aos termos a que se referem.
