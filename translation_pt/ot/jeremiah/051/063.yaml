base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/063.yaml
  text: And when you finish reading this scroll[a], tie a stone to it and throw it into the midst of the Euphrates[b],
translation:
  language: pt
  text: E quando você terminar de ler este rolo[a], amarre nele uma pedra e lance-o no meio do Eufrates,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este livro”. O termo hebraico סֵפֶר pode designar, de modo geral, um documento escrito, mas aqui provavelmente se refere a um rolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּתְךָ לִקְרֹא
  choice: E, quando você terminar de ler
  rationale: A construção introduz uma circunstância futura; esta formulação preserva a ligação narrativa e expressa o valor temporal de modo natural em português.
- source_word: אֶת־הַסֵּפֶר הַזֶּה
  choice: este rolo
  rationale: סֵפֶר designa um texto escrito e, neste contexto antigo, provavelmente um rolo; a escolha evita a imagem anacrônica de um livro encadernado.
- source_word: תִּקְשֹׁר עָלָיו אֶבֶן
  choice: amarre nele uma pedra
  rationale: קשר indica amarrar ou prender, e עָלָיו apresenta o rolo como o objeto ao qual a pedra deve ser fixada.
- source_word: וְהִשְׁלַכְתּוֹ
  choice: e lance-o
  rationale: O hifil de שלך significa lançar ou atirar; “lance-o” é claro, digno e adequado ao registro narrativo.
- source_word: אֶל־תּוֹךְ פְּרָת
  choice: no meio do Eufrates
  rationale: אֶל־תּוֹךְ indica movimento para o interior ou meio de algo; em português, “no meio do Eufrates” comunica naturalmente que o rolo deve ser lançado para dentro do rio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Rolo” mantém a precisão histórica; “lance-o” evita tanto coloquialismo excessivo quanto linguagem arcaica. A vírgula final foi preservada porque o versículo continua no seguinte.
