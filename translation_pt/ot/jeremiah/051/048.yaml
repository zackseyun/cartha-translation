    issue: O artigo definido de הַשּׁוֹדְדִים não está expresso.
    rationale: Embora o plural sem artigo seja possível em português, o hebraico traz artigo definido. “Os devastadores” preserva melhor essa determinação e soa natural neste contexto.
  - severity: low
    issue: A primeira alternativa da nota a (“soltarão gritos ... sobre a Babilônia”) é pouco idiomática e “sobre” pode sugerir localização física em português.
    rationale: A alternativa lexical relevante pode ser apresentada naturalmente como “cantarão de alegria por causa da Babilônia”, sem introduzir essa ambiguidade portuguesa alheia ao hebraico.
  revised_text: Então os céus e a terra, e tudo o que neles há, gritarão de alegria por causa da Babilônia[a], pois do norte virão contra ela os devastadores — declara Yahweh[c].
