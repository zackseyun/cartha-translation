  text: וְ/רִנְּנ֤וּ עַל בָּבֶל֙ שָׁמַ֣יִם וָ/אָ֔רֶץ וְ/כֹ֖ל אֲשֶׁ֣ר בָּ/הֶ֑ם כִּ֧י מִ/צָּפ֛וֹן יָבוֹא לָ֥/הּ הַ/שּׁוֹדְדִ֖ים נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/048.yaml
  text: Then heaven and earth[a], and all that is in them, will shout for joy over Babylon, for from the north destroyers will come against her[c][b], declares Yahweh.
translation:
  language: pt
  text: Então os céus e a terra, e tudo o que neles há, gritarão de alegria por causa da Babilônia[a], pois do norte virão contra ela os devastadores — declara Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cantarão de alegria por causa da Babilônia”.'
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” representa o nome divino escrito em hebraico com as quatro consoantes YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִנְּנוּ
  choice: gritarão de alegria
  rationale: O verbo רנן expressa uma manifestação vocal e vibrante de júbilo. A escolha preserva tanto a alegria quanto seu caráter audível; o וְ inicial é entendido, no contexto, como progressão da cena e traduzido por “Então”.
- source_word: עַל בָּבֶל
  choice: por causa da Babilônia
  rationale: Com um verbo de júbilo, עַל pode indicar o motivo ou a ocasião da alegria. Em português, “por causa da Babilônia” conserva essa relação sem definir além do texto se a alegria se dirige à cidade ou à sua queda.
- source_word: שָׁמַיִם וָאָרֶץ וְכֹל אֲשֶׁר בָּהֶם
  choice: os céus e a terra, e tudo o que neles há
  rationale: Mantém o merismo hebraico que abrange toda a criação e reproduz de modo natural a oração relativa.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do júbilo cósmico e preserva claramente a relação explicativa.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Tradução direcional direta, preservando o motivo recorrente em Jeremias do juízo que chega do norte.
- source_word: יָבוֹא לָהּ
  choice: virão contra ela
  rationale: Embora לָהּ seja literalmente “a ela”, a presença de devastadores torna hostil o movimento. “Contra ela” comunica naturalmente essa força contextual.
- source_word: הַשּׁוֹדְדִים
  choice: devastadores
  rationale: O particípio de שׁדד designa agentes que saqueiam e assolam. “Devastadores” abrange a destruição e a pilhagem sem restringir o termo apenas ao saque.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e representa diretamente o nome divino יהוה como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico apresenta o Tetragrama; “Yahweh” conserva o caráter de nome próprio, sem substituir o nome por um título.
- issue: Objeto ou motivo do júbilo expresso por עַל בָּבֶל
  choice: por causa da Babilônia
  alternative: sobre a Babilônia
  rationale: A preposição pode marcar o objeto ou a ocasião do júbilo. “Por causa da Babilônia” mantém a tensão do texto e evita sugerir inequivocamente celebração em favor dela.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com ordem sintática natural. “Céus e terra” mantém a amplitude poética; “gritarão de alegria” conserva a força vocal do hebraico. As notas registram ambiguidades lexicais reais sem sobrecarregar o versículo.
