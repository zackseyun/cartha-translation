source:
  edition: WLC
  text: רפאנו אֶת בָּבֶל֙ וְ/לֹ֣א נִרְפָּ֔תָה עִזְב֕וּ/הָ וְ/נֵלֵ֖ךְ אִ֣ישׁ לְ/אַרְצ֑/וֹ כִּֽי נָגַ֤ע אֶל הַ/שָּׁמַ֨יִם֙ מִשְׁפָּטָ֔/הּ וְ/נִשָּׂ֖א עַד שְׁחָקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/009.yaml
  text: We tried to heal Babylon[a], but she was not healed. Leave her, and let each one go to his own land[c][b], for her judgment has reached to heaven and has been lifted up to the skies.
translation:
  language: pt
  text: Tentamos curar a Babilônia, mas ela não foi curada. Abandonem-na, e vamos cada um para a sua terra[a], pois o julgamento dela chegou até os céus e foi elevado até as nuvens altas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “um homem para a sua terra”; a expressão tem sentido distributivo: cada pessoa deve voltar para a própria terra.'
    reason: lexical_alternative
  - marker: b
    text: A segunda expressão hebraica se refere às nuvens altas ou às alturas do céu.
    reason: cultural_note
lexical_decisions:
- source_word: רפאנו אֶת בָּבֶל
  choice: Tentamos curar a Babilônia
  rationale: O perfeito qal na primeira pessoa do plural, seguido da afirmação de que ela não foi curada, descreve naturalmente uma tentativa frustrada; explicitar “tentamos” comunica esse sentido em português corrente.
- source_word: וְלֹא נִרְפָּתָה
  choice: mas ela não foi curada
  rationale: Preserva a forma passiva do nifal e o paralelismo lexical com “curar” na oração anterior.
- source_word: עִזְבוּהָ
  choice: Abandonem-na
  rationale: Imperativo plural com sufixo feminino singular. “Abandonem-na” exprime com clareza o chamado urgente para deixar a Babilônia.
- source_word: וְנֵלֵךְ אִישׁ לְאַרְצוֹ
  choice: e vamos cada um para a sua terra
  rationale: “Vamos” preserva o valor coortativo da primeira pessoa do plural, enquanto “cada um” comunica o uso distributivo de אִישׁ sem tornar a frase artificial.
- source_word: מִשְׁפָּטָהּ
  choice: o julgamento dela
  rationale: מִשְׁפָּט pode indicar julgamento, sentença ou punição. “Julgamento” mantém a amplitude judicial do termo sem decidir indevidamente entre veredito e execução da pena.
- source_word: נָגַע אֶל הַשָּׁמַיִם
  choice: chegou até os céus
  rationale: Reproduz a imagem de algo que alcança ou toca os céus, com uma construção idiomática em português.
- source_word: וְנִשָּׂא עַד שְׁחָקִים
  choice: e se elevou até as altas nuvens
  rationale: O nifal de נשׂא admite o sentido de elevar-se ou ser elevado; שְׁחָקִים designa as nuvens ou as alturas do céu. A formulação preserva a imagem vertical e o paralelismo.
theological_decisions:
- issue: Sentido do “julgamento” da Babilônia que chega aos céus
  choice: Manter “julgamento” como expressão judicial ampla
  alternative: “sentença”, “punição” ou “crime”
  rationale: No contexto, a ruína da Babilônia está decretada, mas o substantivo hebraico não obriga a tradução a identificar exclusivamente o que sobe aos céus como crime, sentença ou punição. “Julgamento” conserva a tensão entre a decisão judicial e suas consequências.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa compreensão no Brasil e em outros contextos lusófonos. O coortativo foi preservado em “vamos”, e a personificação feminina da Babilônia foi mantida por meio de “ela” e “-na”.
