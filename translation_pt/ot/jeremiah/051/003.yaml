source:
  edition: WLC
  text: אֶֽל יִדְרֹ֤ךְ ידרך הַ/דֹּרֵךְ֙ קַשְׁתּ֔/וֹ וְ/אֶל יִתְעַ֖ל בְּ/סִרְיֹנ֑/וֹ וְ/אַֽל תַּחְמְלוּ֙ אֶל בַּ֣חֻרֶ֔י/הָ הַחֲרִ֖ימוּ כָּל צְבָאָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/003.yaml
  text: Let not the archer bend his bow[a], and let him not rise up in his armor. Do not spare her young men[c][b]; devote all her army to destruction.
translation:
  language: pt
  text: Que o arqueiro não arme o seu arco[a], nem se levante com a sua armadura[b]. Não poupem seus jovens; consagrem todo o seu exército à destruição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que aquele que retesa o arco não o retesse”. O início da frase é difícil e repetitivo no hebraico; o sentido parece ser uma proibição dirigida ao arqueiro.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “com a sua cota de malha” ou “com a sua couraça”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico significa colocar sob interdição, destinando pessoas ou coisas à destruição no juízo divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל / וְאֶל / וְאַל
  choice: Que ... não / nem / Não
  rationale: As partículas negativas com formas volitivas expressam proibições neste contexto; a formulação portuguesa reproduz essa força de modo natural.
- source_word: יִדְרֹךְ ... הַדֹּרֵךְ קַשְׁתּוֹ
  choice: o arqueiro ... arme o seu arco
  rationale: דרך com קשת é uma expressão idiomática para encurvar, retesar ou preparar o arco. A redação mantém a imagem militar e sinaliza em nota a dificuldade e repetição do hebraico.
- source_word: יִתְעַל
  choice: se levante
  rationale: O hitpael de עלה indica erguer-se ou avançar; 'se levante' é direto e evita definir além do que o contexto permite.
- source_word: בְּסִרְיֹנוֹ
  choice: com a sua armadura
  rationale: סִרְיוֹן designa proteção corporal, possivelmente cota de malha ou couraça. 'Armadura' é claro e não impõe uma identificação excessivamente específica.
- source_word: תַּחְמְלוּ
  choice: poupem
  rationale: Em contexto bélico, חמל tem a força prática de poupar, embora também possa envolver compaixão ou piedade.
- source_word: בַּחֻרֶיהָ
  choice: os jovens dela
  rationale: בחור denota normalmente homens jovens, em especial os que estão no vigor da idade; o contexto já comunica sua função militar.
- source_word: הַחֲרִימוּ
  choice: consagrem ... à destruição
  rationale: O hifil de חרם indica colocar sob interdição, destinando à destruição. A expressão preserva o peso cultual e judicial do termo sem reduzi-lo a 'destruam'.
- source_word: כָּל צְבָאָהּ
  choice: todo o seu exército
  rationale: צבא refere-se aqui às forças militares; 'exército' é corrente, claro e adequado ao coletivo singular.
theological_decisions:
- issue: Tradução da linguagem de חרם no oráculo de julgamento
  choice: consagrem todo o seu exército à destruição
  alternative: destruam completamente todo o seu exército; coloquem todo o seu exército sob interdição
  rationale: A formulação preserva a ideia de algo destinado à destruição no âmbito do juízo divino, sem acrescentar uma elaboração doutrinária ausente do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A alternância entre a terceira pessoa singular na primeira frase e a segunda pessoa plural nos imperativos seguintes acompanha as formas hebraicas. Mantém-se a referência feminina a Babilônia por meio de 'dela' e 'seu'.
