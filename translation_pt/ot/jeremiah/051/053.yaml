source:
  edition: WLC
  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
translation:
  language: pt
  text: Ainda que Babilônia suba aos céus, e ainda que fortifique sua elevada fortaleza[a], de mim virão devastadores[b] contra ela — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a altura da sua força”.
    reason: lexical_alternative
  - marker: b
    text: Ou “saqueadores”. O termo hebraico pode designar os que devastam tanto pela destruição quanto pelo saque.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי ... וְכִי
  choice: Ainda que ... e ainda que
  rationale: 'As duas partículas introduzem orações concessivas paralelas: nem a exaltação extrema nem as defesas de Babilônia impedirão o juízo anunciado.'
- source_word: תַעֲלֶה ... הַשָּׁמַיִם
  choice: suba aos céus
  rationale: Preserva o movimento ascendente e a imagem hiperbólica do hebraico em português natural.
- source_word: תְבַצֵּר מְרוֹם עֻזָּהּ
  choice: fortifique sua elevada fortaleza
  rationale: O verbo tem sentido militar de fortificar ou tornar inacessível. No contexto, עֹז pode designar concretamente um lugar de força; a formulação mantém tanto a elevação quanto a segurança defensiva.
- source_word: שֹׁדְדִים
  choice: devastadores
  rationale: O termo designa agentes que assolam, destroem e saqueiam. “Devastadores” conserva a amplitude sem restringir a ação apenas ao saque.
- source_word: מֵאִתִּי ... לָהּ
  choice: virão contra ela da minha parte
  rationale: “Da minha parte” expressa a origem ou o envio divino indicado por מֵאִתִּי, enquanto “contra ela” torna explícita em português a relação hostil de לָהּ no contexto.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética de declaração e translitera o nome divino pessoal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Agência divina na vinda dos devastadores
  choice: da minha parte
  alternative: por mim; vindos de mim
  rationale: A expressão mantém Deus como fonte ou remetente dos agentes do juízo sem definir além do que a preposição hebraica exige o modo exato dessa agência.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo concessivo preservado. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem, corrigindo a associação aparente na camada inglesa de consulta.
