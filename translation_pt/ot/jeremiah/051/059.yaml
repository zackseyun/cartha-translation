base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/059.yaml
  text: This is the word that Jeremiah the prophet commanded Seraiah son of Neriah[a], son of Mahseiah, when he went with Zedekiah king of Judah to Babylon, in the fourth year of his reign. Now Seraiah was the quartermaster.
translation:
  language: pt
  text: Esta é a palavra que o profeta Jeremias ordenou a Seraías, filho de Nerias, filho de Maaseias, quando Seraías foi com Zedequias, rei de Judá, para a Babilônia, no quarto ano do reinado de Zedequias. Seraías era o encarregado dos alojamentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oficial responsável pelas paradas”. O título hebraico é raro e pode designar um funcionário encarregado dos alojamentos, dos locais de descanso ou dos preparativos da viagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: Esta é a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “mensagem”. “Palavra” preserva a formulação profética e a ligação formal com o discurso comunicado.
- source_word: אֲשֶׁר צִוָּה
  choice: que ... ordenou
  rationale: צוה expressa ordenar, encarregar ou instruir. “Ordenou” mantém a força da comissão dada por Jeremias.
- source_word: אֶת שְׂרָיָה בֶן נֵרִיָּה בֶן מַחְסֵיָה
  choice: a Seraías, filho de Nerias e neto de Maaseias
  rationale: O primeiro בֶן indica filiação direta; no segundo, “neto” torna a genealogia natural e inequívoca em português, sem alterar a relação ancestral.
- source_word: בְּלֶכְתּוֹ אֶת צִדְקִיָּהוּ
  choice: quando ele foi com Zedequias
  rationale: A construção infinitiva é temporal, e אֶת tem aqui valor comitativo. O pronome retém a referência contextual a Seraías.
- source_word: בָּבֶל
  choice: para a Babilônia
  rationale: O destino é indicado pelo verbo de movimento; em português, a preposição é explicitada naturalmente.
- source_word: בִּשְׁנַת הָרְבִעִית לְמָלְכוֹ
  choice: no quarto ano do reinado de Zedequias
  rationale: É uma fórmula de datação régia. A repetição do nome evita a possível leitura de que o reinado fosse de Seraías.
- source_word: שַׂר מְנוּחָה
  choice: encarregado dos alojamentos
  rationale: O título raro combina “oficial/chefe” com um termo ligado a descanso ou lugar de repouso. No contexto de viagem, a expressão comunica com clareza provável responsabilidade por hospedagem ou locais de parada, sem impor um cargo moderno excessivamente específico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe longa do hebraico foi preservada de modo fluente. “Encarregado dos alojamentos” evita o anglicismo conceitual de “quartermaster” e o tradicional “camareiro”, que pode sugerir uma função palaciana não demonstrada pelo contexto.
