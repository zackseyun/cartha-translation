revisions:
- from: Esta é a palavra que o profeta Jeremias ordenou a Seraías, filho de Nerias e neto de Maaseias, quando ele foi com Zedequias, rei de Judá, para a Babilônia, no quarto ano do reinado de Zedequias. Seraías era o encarregado dos alojamentos.[a]
  to: Esta é a palavra que o profeta Jeremias ordenou a Seraías, filho de Nerias, filho de Maaseias, quando Seraías foi com Zedequias, rei de Judá, para a Babilônia, no quarto ano do reinado de Zedequias. Seraías era o encarregado dos alojamentos.[a]
  rationale: A revisão limita-se a restaurar a dupla expressão genealógica “filho de” e a esclarecer que Seraías é quem acompanha Zedequias. Mantêm-se a datação régia explicitada, a solução cautelosa para o título raro e a nota que assinala sua incerteza.
