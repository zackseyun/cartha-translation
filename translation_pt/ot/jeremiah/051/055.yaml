  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת בָּבֶ֔ל וְ/אִבַּ֥ד מִמֶּ֖/נָּה ק֣וֹל גָּד֑וֹל וְ/הָמ֤וּ גַלֵּי/הֶם֙ כְּ/מַ֣יִם רַבִּ֔ים נִתַּ֥ן שְׁא֖וֹן קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/055.yaml
  text: For Yahweh is devastating Babylon and destroying from her the great sound[a]. Their waves roar like many waters[b]; the noise of their voice is given.
translation:
  language: pt
  text: Pois Yahweh está devastando Babilônia e fazendo desaparecer dela o grande ruído. As ondas deles[a] rugem como muitas águas; o estrondo da voz deles se faz ouvir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente de “deles” não está explícito no hebraico; as ondas podem representar os atacantes de Babilônia e seu avanço tumultuoso.
    reason: ambiguity
  - marker: b
    text: 'Literalmente: “é dado o estrondo da voz deles”, expressão que indica que um som intenso é produzido ou levantado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  choice: está devastando
  rationale: O particípio retrata uma ação em curso ou iminente; “está devastando” comunica naturalmente a força do juízo contra a cidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאִבַּד
  choice: e fazendo desaparecer
  rationale: Coordena a forma verbal com a ação em andamento do particípio anterior e expressa a remoção do ruído de Babilônia sem restringir o sentido a uma destruição física.
- source_word: מִמֶּנָּה
  choice: dela
  rationale: Mantém a referência feminina a Babilônia e a personificação da cidade.
- source_word: קוֹל גָּדוֹל
  choice: o seu grande ruído
  rationale: קוֹל pode significar voz, som ou ruído. Neste contexto, “grande ruído” preserva a amplitude da expressão e sugere o tumulto da cidade sem identificar sua origem de modo excessivamente específico.
- source_word: וְהָמוּ
  choice: rugem
  rationale: Com “ondas” como sujeito, “rugem” expressa tanto o movimento tumultuoso quanto sua dimensão sonora.
- source_word: גַלֵּיהֶם
  choice: as ondas deles
  rationale: Segue o sufixo masculino plural do texto hebraico e conserva a referência pouco explícita, em vez de alterá-la para “as ondas dela”.
- source_word: כְּמַיִם רַבִּים
  choice: como muitas águas
  rationale: Reproduz a conhecida imagem hebraica de águas numerosas e poderosas, mantendo sua força poética sem explicá-la dentro do texto.
- source_word: נִתַּן
  choice: se levanta
  rationale: Traduz de modo idiomático o passivo de נתן, que literalmente diz que o estrondo “é dado”, isto é, produzido ou erguido.
- source_word: שְׁאוֹן קוֹלָם
  choice: o estrondo da voz deles
  rationale: “Estrondo” comunica a intensidade tumultuosa de שְׁאוֹן, enquanto “voz deles” preserva קוֹלָם e a repetição sonora do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional.
- issue: Identidade indicada pelos pronomes masculinos plurais
  choice: manter “deles” sem identificar o referente
  alternative: explicitar “dos invasores” ou harmonizar como “dela”
  rationale: O texto hebraico não nomeia aqui o antecedente de modo inequívoco. A tradução preserva essa ambiguidade, que pode apontar para os atacantes ou para as forças tumultuosas retratadas como ondas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. Conserva a imagem poética das “muitas águas”, a personificação feminina de Babilônia e a ambiguidade dos pronomes plurais. A formulação evita linguagem denominacional e torna idiomática a construção passiva final sem apagar sua nota literal.
