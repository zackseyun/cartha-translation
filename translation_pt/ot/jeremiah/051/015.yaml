  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/015.yaml
  text: He made the earth by his power[a], he established the world by his wisdom, and by his understanding he stretched out the heavens.
translation:
  language: pt
  text: Ele fez a terra com o seu poder, firmou o mundo com a sua sabedoria e, com o seu entendimento, estendeu os céus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹשֵׂה
  choice: fez
  rationale: Embora seja particípio, no paralelismo poético com os verbos seguintes exprime naturalmente o ato criador; o pretérito mantém a sequência coesa em português.
- source_word: אֶרֶץ
  choice: a terra
  rationale: O contexto cósmico, em contraste com os céus, favorece “terra”, não “país” ou “território”.
- source_word: בְּכֹחוֹ
  choice: com o seu poder
  rationale: O ב instrumental pode ser expresso naturalmente por “com”; “poder” comunica de modo direto o sentido de כֹּחַ.
- source_word: מֵכִין
  choice: firmou
  rationale: O hifil de כון indica estabelecer ou tornar firme. “Firmou” preserva essa imagem com concisão poética.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תֵּבֵל designa o mundo ordenado, frequentemente com a nuance de mundo habitado; “o mundo” é claro e natural no verso.
- source_word: בְּחָכְמָתוֹ
  choice: com a sua sabedoria
  rationale: Mantém o valor instrumental da preposição e a correspondência direta de חָכְמָה com “sabedoria”.
- source_word: וּבִתְבוּנָתוֹ
  choice: e, com o seu entendimento
  rationale: “Entendimento” preserva a distinção lexical em relação a “sabedoria” e comunica a ideia de inteligência e discernimento.
- source_word: נָטָה
  choice: estendeu
  rationale: Em contextos de criação, נטה descreve os céus sendo estendidos; “estendeu” é atual, digno e fiel à imagem.
- source_word: שָׁמָיִם
  choice: os céus
  rationale: O plural português corresponde bem à forma hebraica e ao alcance cósmico da expressão.
theological_decisions:
- issue: Valor temporal da sequência formada por particípios e verbo perfeito
  choice: 'Verbos finitos no pretérito: “fez... firmou... estendeu”.'
  alternative: 'Presente ou formulação nominal: “faz... firma... estende” ou “aquele que faz...”.'
  rationale: O hebraico começa com particípios, mas culmina em um perfeito e funciona como declaração poética dos atos criadores de Deus. O pretérito produz uma sequência natural em português sem acrescentar uma afirmação doutrinária além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Dicção poética e digna, sem arcaísmos. O paralelismo triplo e a distinção entre “sabedoria” e “entendimento” foram preservados.
