base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/019.yaml
  text: Not like these is the Portion of Jacob[a], for he is the one who formed everything, and Israel is the tribe of his inheritance[c][b]; Yahweh of Armies is his name.
translation:
  language: pt
  text: A porção de Jacó não é como essas coisas,[a] pois ele é quem formou tudo; e Jacó é a tribo que constitui a sua herança.[b] Yahweh dos Exércitos[c] é o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A porção que pertence a Jacó”. O hebraico pode indicar que Yahweh é a porção concedida a Jacó ou, com menor probabilidade neste contexto, que Jacó possui essa porção.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e a tribo da sua herança”. “Jacó” foi retomado como o referente coletivo, isto é, o povo que constitui a herança de Yahweh. O texto paralelo de Jeremias 10:16 traz explicitamente “Israel”, mas essa palavra não aparece no texto hebraico deste versículo.'
    reason: alternative_reading
  - marker: c
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  choice: não é como essas coisas
  rationale: Mantém o demonstrativo plural e o contraste imediato com os ídolos mencionados no contexto; “essas coisas” soa mais natural em português do que “estes” sem antecedente nominal expresso.
- source_word: חֵלֶק יַעֲקֹב
  choice: a porção de Jacó
  rationale: Preserva a construção hebraica e sua possível ambiguidade, embora o contexto favoreça a ideia de Yahweh como a porção que cabe a Jacó.
- source_word: יוֹצֵר הַכֹּל הוּא
  choice: ele é quem formou tudo
  rationale: Expressa com naturalidade o particípio יוֹצֵר e conserva a ênfase do pronome הוּא, destacando o Criador em contraste com os ídolos fabricados.
- source_word: וְשֵׁבֶט נַחֲלָתוֹ
  choice: e Jacó é a tribo da sua herança
  rationale: “Tribo” é o sentido contextual de שֵׁבֶט, e “herança” mantém נַחֲלָה. A repetição de “Jacó” explicita em português o referente já presente no versículo, sem introduzir “Israel”, palavra ausente do texto massorético fornecido.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Transcreve o nome divino e traduz צְבָאוֹת de modo transparente para leitores modernos, preservando sua imagem militar e celestial.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Completa de maneira idiomática em português a oração nominal hebraica.
theological_decisions:
- issue: Sentido de “a porção de Jacó”
  choice: Preservar a formulação possessiva ambígua no texto principal
  alternative: Explicitar “Yahweh é a porção que coube a Jacó”
  rationale: O contexto favorece Yahweh como a porção de Jacó, em contraste com os ídolos, mas a construção hebraica permite formalmente mais de uma relação possessiva; a nota registra essa tensão.
- issue: Referente de “a tribo da sua herança”
  choice: Retomar Jacó como referente sem acrescentar Israel
  alternative: Traduzir “Israel é a tribo da sua herança”, com base em Jeremias 10:16
  rationale: O texto hebraico fornecido não contém יִשְׂרָאֵל. Retomar “Jacó”, já expresso na mesma frase, produz português completo sem harmonizar silenciosamente com a passagem paralela.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A forma “Yahweh” representa diretamente o nome da aliança presente no texto hebraico, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Evitou-se linguagem excessivamente arcaica; o paralelismo e a tensão do hebraico foram mantidos, com esclarecimentos textuais restritos às notas.
