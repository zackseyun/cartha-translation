id: JER.51.18
reference: Jeremiah 51:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/018.yaml
  text: They are vanity[a], a work of delusion[b]; at the time of their punishment they will perish.
translation:
  language: pt
  text: Eles são inutilidade, obra de engano[a]; no tempo de serem julgados[b], perecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obra ridícula”, “obra enganosa” ou “obra de erros”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no tempo da sua visitação”. Aqui, “visitação” se refere ao momento em que o juízo vem sobre eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: inutilidade
  rationale: No contexto da polêmica contra os ídolos, o termo indica vazio, futilidade e falta de valor. “Inutilidade” comunica isso em português atual sem reduzir a imagem ao sentido literal de “sopro”.
- source_word: הֵמָּה
  choice: Eles são
  rationale: O pronome independente masculino plural tem valor enfático e retoma os ídolos do contexto.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: obra de engano
  rationale: Mantém o singular de מַעֲשֵׂה e entende o plural abstrato תַּעְתֻּעִים como engano ou ilusão. A expressão também pode sugerir algo ridículo ou digno de zombaria, possibilidade registrada em nota.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: no tempo de serem julgados
  rationale: פְּקֻדָּה pode designar visitação, prestação de contas ou punição. Neste oráculo de juízo, a formulação explicita o sentido contextual sem afirmar que o substantivo hebraico significa apenas “castigo”.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: Reproduz de modo direto e intransitivo o sentido de אבד, indicando que deixarão de existir ou serão arruinados.
theological_decisions:
- issue: Natureza da polêmica contra os ídolos
  choice: Os ídolos são apresentados como inúteis e enganadores e perecerão quando forem julgados.
  alternative: “Obra de engano” também pode ser entendida como “obra ridícula”, “objeto de zombaria” ou “obra de erros”.
  rationale: O contexto de Jeremias 51 e o paralelo de Jeremias 10:15 sustentam tanto a falta de valor dos ídolos quanto sua exposição no juízo, sem exigir uma definição dogmática adicional.
- issue: Sentido de פְּקֻדָּה
  choice: julgamento punitivo
  alternative: visitação ou prestação de contas
  rationale: A amplitude lexical foi preservada em nota. No contexto, a visitação resulta na perdição dos ídolos, o que favorece o sentido judicial e punitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Inutilidade” evita o possível arcaísmo ou a ambiguidade moral de “vaidade”; “no tempo de serem julgados” soa mais natural do que “no tempo de sua punição” e conserva em nota a formulação mais literal.
