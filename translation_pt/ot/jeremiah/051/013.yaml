  text: שכנתי עַל מַ֣יִם רַבִּ֔ים רַבַּ֖ת אֽוֹצָרֹ֑ת בָּ֥א קִצֵּ֖/ךְ אַמַּ֥ת בִּצְעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/013.yaml
  text: You who dwell by many waters[a], rich in treasures, your end has come[b], the measure of your greed.
translation:
  language: pt
  text: Você que habita junto a muitas águas[a], rica em tesouros, chegou o seu fim, a medida do seu lucro injusto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre muitas águas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “o côvado do seu lucro injusto”; provavelmente, “a medida” ou “o limite do seu lucro injusto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שכנתי
  choice: Você que habita
  rationale: O particípio feminino singular dirige-se à Babilônia personificada. A formulação mantém o discurso direto e o estado contínuo sem tornar a frase excessivamente solene.
- source_word: עַל מַיִם רַבִּים
  choice: junto a muitas águas
  rationale: עַל pode significar sobre, em ou junto a. No contexto de uma cidade cercada por rios e canais, “junto a” é natural em português; a alternativa mais literal fica registrada em nota.
- source_word: רַבַּת אֹצָרוֹת
  choice: rica em tesouros
  rationale: רַבַּת comunica abundância, e “rica em tesouros” expressa com clareza tanto a grande quantidade quanto a riqueza da cidade.
- source_word: בָּא קִצֵּךְ
  choice: chegou o seu fim
  rationale: O perfeito apresenta a chegada do juízo como certa e já determinada. Esta ordem é idiomática e enfática em português.
- source_word: אַמַּת
  choice: a medida do
  rationale: Embora o sentido concreto seja “côvado”, aqui a palavra provavelmente indica uma medida ou limite fixado. A tradução literal é preservada em nota.
- source_word: בִּצְעֵךְ
  choice: seu lucro injusto
  rationale: בצע costuma designar ganho motivado pela cobiça ou obtido de modo violento ou desonesto. “Lucro injusto” preserva a referência ao ganho e sua carga moral sem reduzi-lo apenas a um sentimento interior.
theological_decisions:
- issue: Destinatária personificada
  choice: O versículo fala diretamente à Babilônia como cidade personificada no feminino.
  alternative: Uma moradora genérica ou a população da cidade tomada coletivamente.
  rationale: As formas femininas singulares e o contexto profético favorecem a personificação da cidade; “rica” torna essa concordância visível em português.
- issue: Relação entre o fim e a medida do ganho injusto
  choice: Manter as duas expressões em justaposição, sem acrescentar um verbo explicativo.
  alternative: Explicitar que o limite do lucro injusto foi atingido.
  rationale: O hebraico é condensado e permite tensão entre a chegada do fim e a imagem da medida. A tradução evita resolver silenciosamente essa relação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O feminino “rica” conserva a personificação gramatical da cidade. A construção final permanece deliberadamente compacta para refletir a ambiguidade do hebraico.
