base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/020.yaml
  text: You are my war club[a], my weapon of battle; with you I shatter nations[b], and with you I destroy kingdoms.
translation:
  language: pt
  text: “Você é o meu instrumento para esmagar[a], minha arma de guerra. Com você despedaço nações[b] e, com você, destruo reinos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha clava de guerra”, “meu martelo” ou “meu machado de batalha”; o termo hebraico designa um instrumento usado para esmagar.
    reason: lexical_alternative
  - marker: b
    text: “Você” está no singular. O referente não é nomeado neste versículo; com base no contexto, ele é identificado de maneiras diversas como Babilônia, Ciro/Medo-Pérsia ou Israel/Jacó.
    reason: alternative_reading
lexical_decisions:
- source_word: מַפֵּץ
  choice: instrumento de esmagar
  rationale: O substantivo designa um instrumento usado para esmagar ou despedaçar. A formulação preserva a amplitude lexical do hebraico sem especificar indevidamente se se trata de uma clava, um martelo ou um machado.
- source_word: לִי
  choice: meu
  rationale: Embora a forma seja literalmente “para mim”, a construção predicativa expressa posse e instrumentação; “meu” é natural em português.
- source_word: כְּלֵי מִלְחָמָה
  choice: minha arma de guerra
  rationale: כְּלִי pode indicar utensílio, instrumento ou arma. No contexto militar e diante do interlocutor singular, “arma de guerra” comunica naturalmente o sentido.
- source_word: נִפַּצְתִּי
  choice: despedaço
  rationale: O Piel expressa quebrar violentamente em pedaços. O presente dá ao perfeito hebraico valor declarativo e vívido, em harmonia com o paralelismo.
- source_word: בְךָ
  choice: com você
  rationale: A preposição marca o meio ou instrumento. “Com você” preserva a repetição hebraica e soa natural em português.
- source_word: גּוֹיִם
  choice: nações
  rationale: No contexto, refere-se a coletividades políticas; “nações” evita restringir o termo a uma categoria religiosa.
- source_word: הִשְׁחַתִּי
  choice: destruo
  rationale: O Hifil de שׁחת indica causar destruição. “Destruo” mantém a força e o paralelismo do enunciado.
- source_word: מַמְלָכוֹת
  choice: reinos
  rationale: É o equivalente político direto do substantivo hebraico e forma um par natural com “nações”.
theological_decisions:
- issue: Identidade do interlocutor singular (“você”)
  choice: Manter a segunda pessoa do singular sem identificar o referente no texto.
  alternative: Identificá-lo como Babilônia, Ciro/Medo-Pérsia ou Israel/Jacó.
  rationale: O versículo hebraico não nomeia o interlocutor, e o contexto mais amplo permite diferentes identificações. A tradução preserva essa ambiguidade em vez de impor uma interpretação disputada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “com você” conserva a estrutura enfática do hebraico. “Instrumento de esmagar” é deliberadamente amplo para preservar a incerteza quanto ao tipo exato de arma.
