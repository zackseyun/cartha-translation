  naturalness: '''Por isso, vejam'' é compreensível, mas ''eis que'' é uma forma mais idiomática e diretamente correspondente a הִנֵּה no anúncio profético. ''Ficará envergonhada'' preserva a personificação e soa mais natural do que ''será envergonhada''.'
