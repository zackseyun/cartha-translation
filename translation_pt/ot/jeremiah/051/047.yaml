  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵן֙ הִנֵּ֣ה יָמִ֣ים בָּאִ֔ים וּ/פָקַדְתִּי֙ עַל פְּסִילֵ֣י בָבֶ֔ל וְ/כָל אַרְצָ֖/הּ תֵּב֑וֹשׁ וְ/כָל חֲלָלֶ֖י/הָ יִפְּל֥וּ בְ/תוֹכָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/047.yaml
  text: Therefore, look, days are coming when I will punish the carved images of Babylon, and all her land will be put to shame, and all her slain will fall in her midst.
translation:
  language: pt
  text: Por isso, eis que vêm dias em que castigarei as imagens esculpidas da Babilônia; toda a sua terra ficará envergonhada, e todos os seus mortos cairão no meio dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a conclusão ou consequência introduzida pelo hebraico.
- source_word: הִנֵּה
  choice: vejam
  rationale: Preserva a função de chamar a atenção para o anúncio profético, em linguagem corrente e digna.
- source_word: וּפָקַדְתִּי עַל
  choice: castigarei
  rationale: Neste contexto de juízo, פקד על indica intervenção punitiva, não mera visita ou inspeção.
- source_word: פְּסִילֵי
  choice: imagens esculpidas
  rationale: Traduz o sentido concreto de imagens talhadas, associadas aqui ao culto idólatra, sem acrescentar 'ídolos' ao texto.
- source_word: תֵּבוֹשׁ
  choice: será envergonhada
  rationale: Mantém a imagem hebraica de vergonha e desonra sofrida por toda a terra.
- source_word: חֲלָלֶיהָ
  choice: seus mortos
  rationale: No contexto bélico, designa os mortos ou abatidos; 'mortos' é claro e não especifica além do hebraico.
theological_decisions:
- issue: O objeto do castigo divino
  choice: castigarei as imagens esculpidas da Babilônia
  alternative: castigarei os ídolos da Babilônia
  rationale: A tradução conserva o referente concreto de פְּסִילִים e deixa que o contexto comunique sua natureza idolátrica.
- issue: Personificação da terra da Babilônia
  choice: Toda a sua terra será envergonhada
  alternative: Toda a sua terra ficará desonrada
  rationale: Preserva a personificação e a linguagem teológica de vergonha sem explicá-las ou reduzi-las a derrota política.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A pontuação divide o anúncio em duas frases para maior clareza, sem alterar a coordenação e a progressão do hebraico. O plural 'vejam' funciona como chamado público à atenção.
