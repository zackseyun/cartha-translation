  text: וְ/אָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ לְ/הַכְרִית֔/וֹ לְ/בִלְתִּ֤י הֱיֽוֹת בּ/וֹ֙ יוֹשֵׁ֔ב לְ/מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה כִּֽי שִׁמְמ֥וֹת עוֹלָ֖ם תִּֽהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/062.yaml
  text: and say[a], ‘O Yahweh, you yourself have spoken concerning this place, to cut it off so that no inhabitant will be in it, from man to beast[c][b]; for it will become everlasting desolations.’
translation:
  language: pt
  text: 'E diga: “Ó Yahweh, tu mesmo falaste a respeito deste lugar, que o destruirias[a], para que nele não restassem habitantes, nem pessoas nem animais[b]; pois ele se tornará desolações perpétuas[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cortá-lo”; também pode ser traduzido por “eliminá-lo”. Neste contexto, a expressão indica destruição decisiva.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desde o ser humano até o animal”, fórmula que indica o despovoamento total de pessoas e animais.'
    reason: cultural_note
  - marker: c
    text: Também pode ser traduzido por “desolações duradouras” ou “desolações para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: E diga
  rationale: O perfeito qal com waw dá continuidade à sequência de instruções; em português atual, o imperativo traduz naturalmente essa força.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אַתָּה דִבַּרְתָּ אֶל
  choice: tu mesmo falaste a respeito de
  rationale: O pronome independente acrescenta ênfase ao sujeito. “A respeito de” preserva a relação ampla de אֶל sem impor o sentido mais hostil de “contra”.
- source_word: לְהַכְרִיתוֹ
  choice: que o exterminarias
  rationale: O hifil de כרת indica aqui a eliminação decisiva do lugar. “Exterminar” comunica o sentido contextual, enquanto a nota registra a imagem literal de cortar/eliminar.
- source_word: לְבִלְתִּי הֱיוֹת בּוֹ יוֹשֵׁב
  choice: para que nele não houvesse habitante algum
  rationale: Expressa de modo natural a finalidade ou o resultado indicado pela construção hebraica, preservando o substantivo participial “habitante”.
- source_word: לְמֵאָדָם וְעַד בְּהֵמָה
  choice: desde o ser humano até os animais
  rationale: Reproduz a fórmula abrangente que indica o despovoamento completo de pessoas e animais, com redação clara no português moderno.
- source_word: שִׁמְמוֹת עוֹלָם
  choice: desolações perpétuas
  rationale: Mantém o plural hebraico שִׁמְמוֹת e traduz עוֹלָם como duração contínua e indefinida neste contexto.
- source_word: תִּהְיֶה
  choice: ele se tornará
  rationale: O verbo היה aponta para o estado futuro resultante do lugar; “se tornará” torna essa progressão explícita e natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original apresenta o tetragrama como nome próprio. A transliteração preserva essa função sem substituí-lo por um título.
- issue: Alcance de אָדָם na fórmula de despovoamento
  choice: ser humano
  alternative: homem
  rationale: Aqui אָדָם tem referência coletiva e genérica, em contraste abrangente com os animais; “ser humano” comunica esse alcance sem restringi-lo ao sexo masculino.
- issue: Duração expressa por עוֹלָם
  choice: perpétuas
  alternative: eternas; para sempre
  rationale: No anúncio de juízo sobre um lugar, עוֹלָם descreve uma duração contínua ou indefinidamente prolongada; “perpétuas” preserva essa força sem resolver além do texto questões sobre duração metafísica absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a ênfase de אַתָּה, o plural “desolações” e a tensão semântica de עוֹלָם; as alternativas relevantes aparecem em notas posicionadas junto às expressões correspondentes.
