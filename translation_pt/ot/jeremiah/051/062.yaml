revisions:
- from: 'E diga: “Ó Yahweh, tu mesmo falaste a respeito deste lugar, que o exterminarias[a], para que nele não houvesse habitante algum, desde o ser humano até os animais[b], pois ele se tornará desolações perpétuas[c]”.'
  to: 'E diga: “Ó Yahweh, tu mesmo falaste a respeito deste lugar, que o destruirias[a], para que nele não restassem habitantes, nem pessoas nem animais[b]; pois ele se tornará desolações perpétuas[c].”'
  rationale: A revisão substitui um verbo pouco natural para um lugar por “destruirias”, preservando o sentido contextual do hifil de כרת e registrando a imagem literal na nota. Também torna mais fluida a expressão da despovoação completa, sem alterar o alcance inclusivo da fórmula hebraica.
