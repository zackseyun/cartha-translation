  text: וְ/שִׁלַּחְתִּ֨י לְ/בָבֶ֤ל זָרִים֙ וְ/זֵר֔וּ/הָ וִ/יבֹקְק֖וּ אֶת אַרְצָ֑/הּ כִּֽי הָי֥וּ עָלֶ֛י/הָ מִ/סָּבִ֖יב בְּ/י֥וֹם רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/002.yaml
  text: And I will send strangers against Babylon, and they will winnow her and empty her land, for they will be against her from every side in the day of disaster.
translation:
  language: pt
  text: E enviarei estrangeiros contra a Babilônia[a]; eles a joeirarão[b] e esvaziarão a sua terra, pois estarão contra ela por todos os lados no dia da calamidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a Babilônia”. A preposição hebraica pode indicar destino, mas o contexto mostra que os estrangeiros são enviados como inimigos.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido como “joeirar” também pode ter o sentido mais geral de “dispersar”, mas a imagem agrícola provavelmente é intencional.
    reason: lexical_alternative
  - marker: c
    text: “No dia da calamidade” significa quando a desgraça cair sobre a Babilônia; não se refere à maldade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: E enviarei
  rationale: O perfeito qal com a conjunção, no discurso profético, expressa aqui uma ação futura anunciada com certeza.
- source_word: לְבָבֶל
  choice: contra a Babilônia
  rationale: Embora a preposição possa indicar destino, o contexto hostil mostra que os agentes são enviados contra a Babilônia.
- source_word: זָרִים
  choice: estrangeiros
  rationale: O termo designa pessoas de fora; “estrangeiros” é claro e natural em português, enquanto o contexto explicita sua função hostil.
- source_word: וְזֵרוּהָ
  choice: eles a joeirarão
  rationale: O verbo זרה evoca o ato de joeirar ou dispersar grãos; a tradução conserva a imagem agrícola provável no hebraico.
- source_word: וִיבֹקְקוּ אֶת־אַרְצָהּ
  choice: e esvaziarão a sua terra
  rationale: בקק comunica o esvaziamento causado pela devastação. A formulação mantém a imagem concreta e o objeto “sua terra”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ou razão do juízo anunciado.
- source_word: הָיוּ עָלֶיהָ
  choice: estarão contra ela
  rationale: Apesar da forma perfeita, o contexto profético favorece referência futura, em harmonia com o anúncio precedente.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: Expressa cerco e pressão vindos de toda parte em linguagem portuguesa corrente.
- source_word: בְּיוֹם רָעָה
  choice: no dia da calamidade
  rationale: רָעָה indica aqui desastre ou calamidade, não maldade moral.
