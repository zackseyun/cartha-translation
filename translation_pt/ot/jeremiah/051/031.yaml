  yaml_path: translation/ot/jeremiah/051/031.yaml
  text: Runner runs to meet runner[a], and messenger to meet messenger[b], to tell the king of Babylon that his city has been captured from end to end.
translation:
  language: pt
  text: Um corredor corre ao encontro de outro corredor[a], e um mensageiro, ao encontro de outro mensageiro, para informar ao rei da Babilônia que sua cidade foi tomada de ponta a ponta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais concisa: “Um corredor encontra outro corredor”. A repetição no hebraico torna vívida a rápida sucessão dos portadores da notícia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua cidade foi tomada a partir de uma extremidade”. A expressão hebraica pode indicar uma captura iniciada por uma das extremidades, embora o contexto provavelmente descreva a queda da cidade inteira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָץ / יָרוּץ
  choice: Um corredor corre
  rationale: Preserva a repetição vívida entre o particípio substantivado e o verbo, que comunica urgência e movimento rápido, sem acrescentar a ideia específica de um atleta.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: Expressa naturalmente em português o movimento em direção a outra pessoa para encontrá-la.
- source_word: וּמַגִּיד ... מַגִּיד
  choice: e um mensageiro, ao encontro de outro mensageiro
  rationale: מַגִּיד designa quem comunica ou anuncia uma notícia. “Mensageiro” é claro no contexto; a elipse do verbo na segunda oração acompanha a concisão do hebraico.
- source_word: לְהַגִּיד
  choice: para informar
  rationale: Traduz o ato de transmitir oficialmente a notícia ao rei de maneira natural e atual.
- source_word: לְמֶלֶךְ בָּבֶל
  choice: ao rei da Babilônia
  rationale: Mantém de forma direta o destinatário explícito da notícia.
- source_word: נִלְכְּדָה
  choice: foi conquistada
  rationale: O nifal de לכד indica que a cidade foi tomada ou capturada; “foi conquistada” é idiomático para a queda militar de uma cidade.
- source_word: עִירוֹ
  choice: sua cidade
  rationale: Conserva o sufixo pronominal hebraico sem explicitar além do texto que se trata da capital.
- source_word: מִקָּצֶה
  choice: de ponta a ponta
  rationale: No contexto da queda da Babilônia, comunica naturalmente a extensão completa da captura, embora a expressão hebraica possa ser entendida mais literalmente como “desde uma extremidade”.
