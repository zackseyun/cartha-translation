id: JER.51.8
reference: Jeremiah 51:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פִּתְאֹ֛ם נָפְלָ֥ה בָבֶ֖ל וַ/תִּשָּׁבֵ֑ר הֵילִ֣ילוּ עָלֶ֗י/הָ קְח֤וּ צֳרִי֙ לְ/מַכְאוֹבָ֔/הּ אוּלַ֖י תֵּרָפֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/008.yaml
  text: Suddenly Babylon has fallen and been shattered[a]. Wail over her! Take balm for her pain; perhaps she may be healed.
translation:
  language: pt
  text: De repente, Babilônia caiu e foi despedaçada. Lamentem por ela! Peguem bálsamo[a] para a sua dor; talvez ela seja curada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resina medicinal”. O termo hebraico indica uma substância aromática usada como remédio.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְאֹם
  choice: De repente
  rationale: Expressa de modo natural a brusquidão e o caráter inesperado da queda.
- source_word: נָפְלָה
  choice: caiu
  rationale: O perfeito qal feminino singular anuncia a queda de Babilônia como fato consumado; o pretérito perfeito é vívido e idiomático em português.
- source_word: בָבֶל
  choice: Babilônia
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: וַתִּשָּׁבֵר
  choice: e foi despedaçada
  rationale: O nifal de שׁבר apresenta Babilônia como quebrada ou destroçada; a formulação passiva preserva a força catastrófica da imagem.
- source_word: הֵילִילוּ
  choice: Lamentem
  rationale: O imperativo plural convoca ao lamento intenso. “Lamentem” é claro, digno e natural, sem a possível conotação animal de “uivem”.
- source_word: עָלֶיהָ
  choice: por ela
  rationale: Com verbo de lamentação, עַל indica que Babilônia é o objeto do lamento.
- source_word: קְחוּ
  choice: Peguem
  rationale: Equivalente corrente do imperativo plural, adequado à ação de tomar um remédio para aplicá-lo.
- source_word: צֳרִי
  choice: bálsamo
  rationale: Designa uma resina medicinal usada para tratamento; “bálsamo” é corrente em português e mantém a imagem terapêutica.
- source_word: לְמַכְאוֹבָהּ
  choice: para a sua dor
  rationale: מַכְאוֹב pode denotar dor, sofrimento ou ferimento. “Dor” é a correspondência mais direta sem restringir indevidamente o sentido a uma ferida física.
- source_word: אוּלַי
  choice: talvez
  rationale: Preserva a possibilidade incerta expressa pelo advérbio.
- source_word: תֵּרָפֵא
  choice: ela seja curada
  rationale: O nifal imperfeito feminino singular, sob o escopo de “talvez”, expressa uma possível cura ou restauração.
theological_decisions:
- issue: Personificação de Babilônia no feminino singular
  choice: Manter a personificação feminina com “ela” e “sua”
  alternative: Tratar a cidade ou o império de modo impessoal
  rationale: As formas hebraicas se referem consistentemente a Babilônia no feminino singular. Manter essa personificação preserva a imagem e a retórica do texto.
- issue: Possibilidade de cura de Babilônia
  choice: Preservar a incerteza com “talvez ela seja curada”
  alternative: Traduzir como certeza de cura ou recuperação
  rationale: אוּלַי torna a cura apenas possível. A tradução não decide se a tentativa será eficaz nem suaviza a tensão irônica no contexto do juízo contra Babilônia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe breve conserva a urgência dos imperativos e o impacto súbito do anúncio. O marcador da nota foi colocado junto de “bálsamo”, termo ao qual a nota lexical efetivamente se refere.
