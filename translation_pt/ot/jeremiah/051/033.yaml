source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בַּת בָּבֶ֕ל כְּ/גֹ֖רֶן עֵ֣ת הִדְרִיכָ֑/הּ ע֣וֹד מְעַ֔ט וּ/בָ֥אָה עֵֽת הַ/קָּצִ֖יר לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/033.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: The daughter of Babylon is like a threshing floor at the time it is trodden; yet a little while, and the time of harvest will come for her.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh dos Exércitos, o Deus de Israel: A filha da Babilônia é como uma eira quando a pisam[a]. Mais um pouco, e virá para ela o tempo da colheita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no tempo de pisá-la”; o hebraico traz “pisá-la”, com sujeito não expresso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת pelo termo português claro e tradicional “Exércitos”, sem restringir indevidamente a referência a forças apenas humanas ou celestes.
- source_word: בַּת בָּבֶל
  choice: a filha da Babilônia
  rationale: Mantém a personificação profética de Babilônia como filha, em vez de reduzi-la simplesmente ao nome da cidade ou do império.
- source_word: כְּגֹרֶן
  choice: é como uma eira
  rationale: Conserva tanto a comparação marcada por כְּ quanto a imagem agrícola concreta do local onde os cereais eram debulhados.
- source_word: עֵת הִדְרִיכָהּ
  choice: quando chega o tempo de pisá-la
  rationale: Expressa naturalmente a ideia temporal e mantém o sufixo feminino como objeto do ato de pisar; a referência pode oscilar entre a eira na metáfora e Babilônia personificada.
- source_word: עוֹד מְעַט
  choice: mais um pouco
  rationale: Forma portuguesa corrente e digna que comunica a iminência indicada pela expressão hebraica.
- source_word: וּבָאָה עֵת הַקָּצִיר לָהּ
  choice: e chegará para ela o tempo da colheita
  rationale: Preserva a metáfora da colheita, a orientação futura no contexto profético e o pronome dativo לָהּ.
theological_decisions:
- issue: Força metafórica das imagens de debulha e colheita
  choice: Manter as imagens agrícolas como anúncio implícito do juízo iminente sobre Babilônia.
  alternative: Explicitar no texto que se trata da destruição ou punição de Babilônia.
  rationale: O contexto indica juízo, mas o versículo o comunica metaforicamente; a tradução não deve substituir a imagem inspirada por uma interpretação explícita.
- issue: Referente do sufixo feminino em הִדְרִיכָהּ
  choice: “pisá-la”, preservando a referência feminina e a sobreposição entre Babilônia e a eira.
  alternative: “quando ela é pisada”, entendendo diretamente a eira como referente gramatical.
  rationale: O hebraico admite uma formulação com sujeito não expresso e objeto feminino. A escolha conserva essa tensão metafórica sem fixar desnecessariamente um único referente.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eira” é mantido por ser o termo preciso para a imagem agrícola bíblica; a nota esclarece a construção verbal ambígua sem sobrecarregar o texto principal.
