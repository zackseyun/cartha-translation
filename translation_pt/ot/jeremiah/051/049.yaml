  source_fidelity: 'O texto traduz adequadamente o paralelismo hebraico: Babilônia está destinada a cair em relação aos mortos de Israel, e os mortos de toda a terra caíram em relação à Babilônia. “Terá de cair” comunica de modo legítimo a força elíptica/destinada de לִנְפֹּל, e “por causa de” torna explícita, sem extrapolar, a relação retributiva/causal expressa pelas construções com לְ. “Toda a terra” preserva a amplitude retórica de כָּל־הָאָרֶץ.'
