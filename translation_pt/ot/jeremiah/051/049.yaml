id: JER.51.49
reference: Jeremiah 51:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם בָּבֶ֕ל לִ/נְפֹּ֖ל חַֽלְלֵ֣י יִשְׂרָאֵ֑ל גַּם לְ/בָבֶ֥ל נָפְל֖וּ חַֽלְלֵ֥י כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/049.yaml
  text: Babylon also must fall for the slain of Israel[a], just as the slain of all the earth have fallen for Babylon.
translation:
  language: pt
  text: Também a Babilônia terá de cair por causa dos mortos de Israel[a], assim como os mortos de toda a terra caíram por causa da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Também a Babilônia caiu, ó mortos de Israel”. A sintaxe hebraica da primeira oração é condensada e tem sido entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: também / assim como
  rationale: A repetição da partícula liga as duas orações em correspondência; a formulação portuguesa explicita o paralelismo sem apagar a concisão do hebraico.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome geográfico.
- source_word: לִנְפֹּל
  choice: terá de cair
  rationale: O infinitivo com לְ está em construção elíptica. A escolha comunica queda destinada ou necessária no contexto profético, enquanto a nota preserva outra análise possível.
- source_word: חַלְלֵי
  choice: os mortos
  rationale: No contexto de guerra e juízo, designa pessoas mortas violentamente. “Os mortos” é claro e natural em português; “os que foram mortos” seria possível, porém menos conciso.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa estabelecida do nome nacional.
- source_word: לְבָבֶל
  choice: por causa da Babilônia
  rationale: Expressa a Babilônia como agente ou causa associada à morte, evitando o português pouco natural de uma reprodução mecânica da preposição.
- source_word: נָפְלוּ
  choice: caíram
  rationale: O perfeito apresenta a queda como realizada; o pretérito perfeito preserva esse valor de maneira direta.
- source_word: חַלְלֵי כָל הָאָרֶץ
  choice: os mortos de toda a terra
  rationale: Mantém a amplitude retórica de כָל הָאָרֶץ no oráculo contra o poder imperial da Babilônia, sem restringi-la silenciosamente a uma região.
theological_decisions:
- issue: Alcance de אָרֶץ
  choice: toda a terra
  alternative: toda a região / toda a terra (no sentido territorial)
  rationale: O contexto ressalta a extensão da violência imperial da Babilônia. O sentido mais amplo cabe à retórica, embora o substantivo hebraico também possa significar “terra” ou “região”.
- issue: Sintaxe da primeira oração
  choice: A Babilônia terá de cair por causa dos mortos de Israel
  alternative: A Babilônia também caiu, ó mortos de Israel
  rationale: A construção hebraica é comprimida e admite mais de uma análise. O texto principal entende לִנְפֹּל como queda destinada da Babilônia em retribuição pelos israelitas mortos; a nota registra a leitura alternativa sem resolver artificialmente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por causa de” esclarece a relação causal e sustenta o paralelismo; a ambiguidade sintática genuína da primeira oração é preservada em nota.
