base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/024.yaml
  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
translation:
  language: pt
  text: E retribuirei à Babilônia e a todos os habitantes da Caldeia todo o mal que fizeram em Sião diante dos olhos de vocês[a] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pagarei à Babilônia e a todos os habitantes da Caldeia por todo o dano que causaram em Sião”. O termo hebraico pode enfatizar tanto o mal moral quanto o dano produzido por essas ações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: E retribuirei
  rationale: O piel de שׁלם expressa retribuição em resposta ao que foi feito. “Retribuirei” conserva a força judicial e soa digna e natural em português.
- source_word: לְבָבֶל
  choice: à Babilônia
  rationale: Nome geográfico em sua forma portuguesa consagrada; a crase representa a preposição exigida por “retribuir” com o artigo do topônimo.
- source_word: וּלְכֹל יוֹשְׁבֵי כַשְׂדִּים
  choice: e a todos os habitantes da Caldeia
  rationale: יוֹשְׁבֵי designa os que habitam, e כַשְׂדִּים tem aqui sentido territorial. “Habitantes da Caldeia” é claro e idiomático.
- source_word: אֵת כָּל רָעָתָם
  choice: todo o mal
  rationale: רָעָה pode indicar tanto mal moral quanto dano causado. “Todo o mal” preserva essa amplitude sem decidir indevidamente entre culpa e efeito nocivo.
- source_word: אֲשֶׁר עָשׂוּ בְצִיּוֹן
  choice: que fizeram em Sião
  rationale: Mantém o valor normal de ב como “em” e apresenta as ações como praticadas no local, sem convertê-lo silenciosamente em “contra Sião”.
- source_word: לְעֵינֵיכֶם
  choice: diante dos olhos de vocês
  rationale: Reproduz a imagem do idioma hebraico e indica que os destinatários testemunharam os atos. “Vocês” oferece leitura ampla e natural no português moderno.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética נְאֻם é vertida de modo solene e corrente; o nome divino é transliterado em vez de substituído por um título.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome pessoal divino representado pelo Tetragrama.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome divino sem substituí-lo por um título; “Jeová” reflete uma forma híbrida tradicional.
- issue: Amplitude semântica de רָעָה
  choice: todo o mal
  alternative: toda a maldade; todo o dano que causaram
  rationale: A escolha mantém juntas a dimensão moral dos atos e suas consequências nocivas, evitando resolver uma ambiguidade genuína do hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe próxima do hebraico onde ela permanece natural. Emprega “vocês” para a segunda pessoa plural e conserva “Sião”, “Caldeia” e “Yahweh” nas formas reconhecíveis.
