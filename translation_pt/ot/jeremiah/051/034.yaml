  text: אכל/נו הממ/נו נְבוּכַדְרֶאצַּר֮ מֶ֣לֶךְ בָּבֶל֒ הציג/נו כְּלִ֣י רִ֔יק בלע/נו כַּ/תַּנִּ֔ין מִלָּ֥א כְרֵשׂ֖/וֹ מֵֽ/עֲדָנָ֑/י הדיח/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/034.yaml
  text: Nebuchadnezzar king of Babylon has devoured me[a]; he has crushed me. He has set me down like an empty vessel; he has swallowed me like a sea monster; he has filled his belly with my delicacies[c][b]; he has cast me out.
translation:
  language: pt
  text: Nabucodonosor, rei da Babilônia, devorou-me[c]; esmagou-me. Pôs-me como um recipiente vazio; engoliu-me como um monstro marinho[a]; encheu o ventre com as minhas iguarias[b]; lançou-me fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um dragão” ou “como uma grande serpente”. O hebraico tannin pode designar uma grande serpente, uma criatura semelhante a um dragão ou um monstro marinho; aqui, a imagem de engolir favorece “monstro marinho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com as minhas coisas preciosas” ou “com os meus deleites”.
    reason: lexical_alternative
  - marker: c
    text: 'Quem fala é Sião/Jerusalém personificada. Os sufixos verbais são grafados de modo que pode ser entendido como “nos”; no contexto, porém, a fala é comumente traduzida no singular, como a voz da cidade: “me”.'
    reason: cultural_note
lexical_decisions:
- source_word: אכלנו
  choice: devorou-me
  rationale: אכל significa literalmente comer ou devorar. “Devorou-me” mantém a violência da imagem poética e apresenta Sião/Jerusalém como uma pessoa, enquanto a questão do número é preservada em nota.
- source_word: הממנו
  choice: esmagou-me
  rationale: המם pode indicar confusão, devastação ou ruína. No paralelismo com “devorou-me” e com as imagens seguintes, “esmagou-me” comunica de modo natural a força destrutiva.
- source_word: הציגנו כלי ריק
  choice: pôs-me de lado como um recipiente vazio
  rationale: A forma causativa de יצג apresenta a imagem concreta de alguém colocado como um recipiente já vazio. “Pôs-me de lado” conserva a ideia de colocação e descarte, sem transformar explicitamente a personagem em recipiente.
- source_word: בלענו
  choice: engoliu-me
  rationale: בלע significa engolir; a tradução direta conserva a imagem vívida da ingestão.
- source_word: כתנין
  choice: como um monstro marinho
  rationale: תנין pode designar uma grande serpente, criatura semelhante a um dragão ou monstro das águas. O contexto de engolir favorece “monstro marinho”, sem eliminar as demais possibilidades, registradas em nota.
- source_word: מלא כרשו
  choice: encheu o ventre
  rationale: כרש designa o ventre ou estômago. “Ventre” preserva o registro poético e a imagem grotesca do conquistador que se alimenta.
- source_word: מעדני
  choice: com as minhas iguarias
  rationale: מעדנים pode indicar iguarias, coisas preciosas ou prazerosas. “Iguarias” se integra diretamente à metáfora alimentar e sugere os bens valiosos de Jerusalém.
- source_word: הדיחנו
  choice: lançou-me fora
  rationale: A forma causativa pode indicar expulsar ou lançar fora e talvez prolongue a metáfora da ingestão. A formulação conserva a rejeição violenta sem impor a interpretação mais específica de vomitar.
theological_decisions:
- issue: Identidade e número da voz poética
  choice: Uso do singular, entendendo a voz como Sião/Jerusalém personificada
  alternative: 'Uso do plural: “devorou-nos”, “esmagou-nos” etc.'
  rationale: O contexto favorece a cidade personificada falando no singular, mas as formas hebraicas transmitidas podem ser entendidas como objetos plurais; a nota preserva essa tensão textual e poética.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se as imagens concretas e violentas da poesia hebraica; “recipiente” evita restringir כלי a um tipo específico de vaso, e as notas registram ambiguidades lexicais e gramaticais genuínas.
