source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת חֹ֠מוֹת בָּבֶ֤ל הָֽ/רְחָבָה֙ עַרְעֵ֣ר תִּתְעַרְעָ֔ר וּ/שְׁעָרֶ֥י/הָ הַ/גְּבֹהִ֖ים בָּ/אֵ֣שׁ יִצַּ֑תּוּ וְ/יִֽגְע֨וּ עַמִּ֧ים בְּ/דֵי רִ֛יק וּ/לְאֻמִּ֥ים בְּ/דֵי אֵ֖שׁ וְ/יָעֵֽפוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/058.yaml
  text: 'Thus says Yahweh of hosts: Babylon’s broad wall shall be utterly razed[a], and her high gates shall be burned with fire. Peoples labor for emptiness, and nations for the fire[b], and they grow weary.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “A larga muralha da Babilônia[a] será completamente arrasada[b], e seus altos portões serão incendiados. Os povos trabalham para o vazio, e as nações, para o fogo[c], e se cansam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “as muralhas da Babilônia”, provavelmente como expressão coletiva para o sistema de fortificações da cidade.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ser traduzido por “será inteiramente deixada nua” ou “completamente despojada”. No contexto de uma muralha, a ideia é que ela será totalmente demolida.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão é elíptica: o trabalho das nações acaba destinado ao fogo, isto é, torna-se combustível para a destruição.'
    reason: clarification
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo título tradicional e semanticamente amplo “dos Exércitos”, sem restringi-lo apenas a forças humanas ou celestes.
- source_word: חֹמוֹת בָּבֶל הָרְחָבָה
  choice: A larga muralha da Babilônia
  rationale: O substantivo hebraico está no plural, mas o adjetivo e o verbo estão no singular feminino, favorecendo a compreensão coletiva do sistema de fortificações como uma muralha; a nota preserva a forma plural.
- source_word: עַרְעֵר תִּתְעַרְעָר
  choice: será completamente arrasada
  rationale: A construção com infinitivo absoluto intensifica o verbo. A raiz sugere deixar despido ou exposto; no contexto de uma muralha, “completamente arrasada” comunica de modo natural a destruição total sem ocultar a imagem lexical alternativa.
- source_word: שְׁעָרֶיהָ הַגְּבֹהִים בָּאֵשׁ יִצַּתּוּ
  choice: seus altos portões serão incendiados
  rationale: Reproduz com clareza a altura dos portões e o ato de atear-lhes fogo; “incendiados” evita a redundância pouco natural de “queimados com fogo” em português.
- source_word: וְיִגְעוּ עַמִּים בְּדֵי רִיק
  choice: Os povos trabalham para o vazio
  rationale: Preserva a ideia de esforço e o substantivo abstrato “vazio”, mantendo o tom proverbial e a noção de resultado inútil.
- source_word: וּלְאֻמִּים בְּדֵי אֵשׁ
  choice: e as nações, para o fogo
  rationale: Mantém o paralelismo elíptico do hebraico e distingue “nações” de “povos”; a nota esclarece que o trabalho termina destinado ao fogo.
- source_word: וְיָעֵפוּ
  choice: e se cansam
  rationale: 'Tradução direta do resultado final: os envolvidos ficam fatigados pelo esforço inútil.'
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração identifica explicitamente o nome próprio no texto hebraico e evita substituir o nome por um título; não se acrescenta interpretação denominacional.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com boa legibilidade brasileira. Conservam-se o paralelismo poético, a elipse de “trabalham” na segunda oração e a tensão entre a imagem literal de despojamento e sua aplicação contextual à demolição da muralha.
