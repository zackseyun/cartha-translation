  text: וַ/יִּכְתֹּ֣ב יִרְמְיָ֗הוּ אֵ֧ת כָּל הָ/רָעָ֛ה אֲשֶׁר תָּב֥וֹא אֶל בָּבֶ֖ל אֶל סֵ֣פֶר אֶחָ֑ד אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה הַ/כְּתֻבִ֖ים אֶל בָּבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/060.yaml
  text: And Jeremiah wrote in a single scroll all the disaster that would come upon Babylon—all these words written against Babylon[a].
translation:
  language: pt
  text: Jeremias escreveu num só rolo toda a calamidade que viria sobre a Babilônia — todas estas palavras escritas a respeito da Babilônia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra a Babilônia”.'
    reason: A preposição hebraica pode indicar que as palavras eram dirigidas contra Babilônia, especialmente neste contexto de juízo, embora também permita o sentido mais amplo de palavras a respeito dela.
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: O wayyiqtol de כתב apresenta uma ação narrativa simples; “escreveu” é a forma direta e natural em português.
- source_word: אֵת כָּל הָרָעָה
  choice: toda a calamidade
  rationale: Neste contexto de juízo profético, רָעָה designa desgraça ou calamidade, não maldade moral. “Calamidade” preserva esse sentido sem sugerir que Jeremias escreveu todo o mal moral.
- source_word: אֲשֶׁר תָּבוֹא אֶל בָּבֶל
  choice: que viria sobre a Babilônia
  rationale: Embora אֶל indique literalmente direção, com בוא e em contexto de juízo a expressão descreve a calamidade atingindo Babilônia; “viria sobre” é idiomático e mantém essa força adversa.
- source_word: אֶל סֵפֶר אֶחָד
  choice: num só rolo
  rationale: סֵפֶר, no contexto histórico, refere-se mais naturalmente a um rolo ou documento escrito do que a um livro em formato moderno; “um só” expressa אֶחָד com naturalidade.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: דְּבָרִים refere-se aqui às palavras ou declarações proféticas registradas, e não apenas a acontecimentos ou assuntos.
- source_word: הַכְּתֻבִים
  choice: escritas
  rationale: O particípio passivo concorda com “palavras” e pode ser reproduzido de modo conciso e natural em português.
- source_word: אֶל בָּבֶל
  choice: a respeito da Babilônia
  rationale: Com “palavras escritas”, אֶל pode indicar referência ou direção. “A respeito da Babilônia” mantém a formulação ampla, enquanto o contexto permite a leitura mais adversativa “contra a Babilônia”, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Num só rolo” evita a imagem anacrônica de um códice moderno; o travessão conserva a aposição explicativa do segundo segmento.
