base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/028.yaml
  text: Consecrate the nations against her—the kings of Media[a], her governors and all her prefects[c][b], and every land of his dominion.
translation:
  language: pt
  text: Consagrem contra ela as nações[b] — os reis da Média[a], os governadores dela e todos os prefeitos dela, e todas as terras sob o domínio dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os reis dos medos”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “consagrar” tem o sentido de separar ou convocar para a batalha, concebida como guerra santa.
    reason: cultural_note
  - marker: c
    text: O hebraico passa de sufixos femininos em “os governadores dela” e “os prefeitos dela” para um sufixo masculino em “domínio dele”. Este último pode se referir ao governante da Média como cabeça representativa; algumas traduções uniformizam os pronomes.
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Consagrem
  rationale: O imperativo de קדשׁ, neste contexto militar, significa separar ou preparar para uma guerra com caráter sacral. “Consagrem” conserva tanto a força formal como essa nuance religiosa e marcial.
- source_word: עָלֶיהָ
  choice: contra ela
  rationale: Neste contexto militar, עַל indica direção hostil contra Babilônia.
- source_word: גוֹיִם
  choice: as nações
  rationale: “Nações” é uma tradução corrente e adequada para as entidades políticas estrangeiras convocadas para a guerra.
- source_word: מַלְכֵי מָדַי
  choice: os reis da Média
  rationale: A construção designa governantes associados à Média; esta formulação é natural em português e preserva a referência geopolítica.
- source_word: פַּחוֹתֶיהָ
  choice: os governadores dela
  rationale: פֶּחָה designa governadores ou administradores provinciais. “Dela” torna explícito o sufixo feminino e evita que o leitor o tome como referência a Babilônia.
- source_word: סְגָנֶיהָ
  choice: todos os seus prefeitos
  rationale: סְגָן designa funcionários subordinados. “Prefeitos” distingue o cargo dos governadores e conserva a nuance administrativa.
- source_word: כָּל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: todas as terras do domínio dele
  rationale: A formulação preserva o valor territorial e distributivo da expressão e, sobretudo, o sufixo masculino singular de מֶמְשַׁלְתּוֹ.
theological_decisions:
- issue: Mudança do referente nos sufixos pronominais
  choice: Manter o feminino em “os governadores dela” e “seus prefeitos”, mas o masculino em “domínio dele”.
  alternative: Regularizar todos os pronomes para um único referente ou traduzir o último como “domínio dela/deles”.
  rationale: O hebraico usa sufixos femininos para os governadores e prefeitos, provavelmente em referência à Média, mas passa ao masculino singular em “domínio dele”. A tradução não elimina essa tensão; o masculino pode apontar para o rei da Média como cabeça representativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada, colocando as notas culturais e textuais no fim, sem alterar seus referentes. “Os governadores dela” explicita o antecedente feminino e ajuda a evitar uma associação equivocada com Babilônia; “prefeitos” preserva a distinção entre os dois cargos administrativos.
