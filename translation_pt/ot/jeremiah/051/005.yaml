id: JER.51.5
reference: Jeremiah 51:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֠י לֹֽא אַלְמָ֨ן יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ מֵֽ/אֱלֹהָ֔י/ו מֵֽ/יְהוָ֖ה צְבָא֑וֹת כִּ֤י אַרְצָ/ם֙ מָלְאָ֣ה אָשָׁ֔ם מִ/קְּד֖וֹשׁ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/005.yaml
  text: For Israel and Judah are not widowed from their God[a], from Yahweh of Armies[b], though their land is full of guilt against the Holy One of Israel.
translation:
  language: pt
  text: Pois Israel e Judá não ficaram viúvos do seu Deus, de Javé dos Exércitos[a], embora a terra deles esteja cheia de culpa diante do Santo de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradução tradicional: «o SENHOR dos Exércitos».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «contra o Santo de Israel». A preposição hebraica pode ser entendida de mais de uma maneira aqui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָן
  choice: não ficaram viúvos
  rationale: Preserva a metáfora conjugal do hebraico, indicando que Israel e Judá não foram privados nem abandonados por seu Deus.
- source_word: מֵאֱלֹהָיו מֵיְהוָה צְבָאוֹת
  choice: do seu Deus, de Javé dos Exércitos
  rationale: A repetição de מִן expressa separação após אַלְמָן. O sufixo hebraico está no singular, adequado aos nomes coletivos Israel e Judá; em português, «seu Deus» conserva essa forma com naturalidade. «Javé» representa o nome divino, e «dos Exércitos» torna צְבָאוֹת transparente.
- source_word: כִּי (inicial)
  choice: Pois
  rationale: Introduz a explicação que fundamenta a exortação do contexto anterior.
- source_word: כִּי (segunda ocorrência)
  choice: embora
  rationale: Expressa naturalmente o contraste contextual entre a contínua relação de Deus com o povo e a culpa que enche a terra.
- source_word: אַרְצָם
  choice: a terra deles
  rationale: Traduz אֶרֶץ de modo direto e mantém clara a referência territorial a Israel e Judá.
- source_word: מָלְאָה אָשָׁם
  choice: esteja cheia de culpa
  rationale: אָשָׁם designa aqui culpabilidade ou delito, não uma oferta pela culpa. O subjuntivo decorre naturalmente de «embora» em português.
- source_word: מִקְּדֹשׁ יִשְׂרָאֵל
  choice: diante do Santo de Israel
  rationale: A preposição מִן pode indicar relação ou referência neste contexto. «Diante de» comunica responsabilidade perante Deus sem eliminar a possibilidade de que a culpa seja entendida como cometida contra ele; essa alternativa é registrada em nota.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Mantém de forma reconhecível e digna o título profético tradicional de Deus.
theological_decisions:
- issue: Valor concessivo ou causal da segunda ocorrência de כִּי
  choice: 'concessivo: «embora a terra deles esteja cheia de culpa»'
  alternative: 'causal: «pois a terra deles está cheia de culpa»'
  rationale: A leitura concessiva mantém a tensão do texto entre a fidelidade de Deus à sua relação com Israel e Judá e a culpa real do povo. A leitura causal poderia sugerir, de maneira contextualmente difícil, que a culpa é a razão de eles não estarem privados de Deus.
- issue: Relação da culpa com o Santo de Israel em מִקְּדֹשׁ יִשְׂרָאֵל
  choice: «diante do Santo de Israel»
  alternative: «contra o Santo de Israel»
  rationale: O hebraico permite mais de uma compreensão da preposição. A tradução principal salienta a responsabilidade perante Deus, enquanto a nota preserva a possível ideia de ofensa dirigida contra ele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A metáfora de viuvez foi preservada sem a substituir por uma explicação interpretativa; «Javé dos Exércitos» mantém o nome divino e torna o título acessível.
