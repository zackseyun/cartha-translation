lexical_decisions:
- source_word: וְנִפַּצְתִּי בְךָ
  choice: Com você despedaçarei
  rationale: Mantém a repetição enfática do hebraico e o valor instrumental de בְּךָ, dirigido ao agente mencionado no contexto.
- source_word: אִישׁ וְאִשָּׁה
  choice: homem e mulher
  rationale: Correspondência direta e natural para o par hebraico.
- source_word: זָקֵן וָנָעַר
  choice: velho e jovem
  rationale: Preserva o contraste de idade; נַעַר é amplo o bastante para designar um jovem, sem exigir aqui 'menino'.
- source_word: בָּחוּר וּבְתוּלָה
  choice: rapaz e virgem
  rationale: 'Distingue este par do anterior: בָּחוּר indica um homem jovem em idade vigorosa, enquanto בְּתוּלָה designa uma jovem virgem.'
