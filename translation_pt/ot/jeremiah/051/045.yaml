id: JER.51.45
reference: Jeremiah 51:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: צְא֤וּ מִ/תּוֹכָ/הּ֙ עַמִּ֔/י וּ/מַלְּט֖וּ אִ֣ישׁ אֶת נַפְשׁ֑/וֹ מֵ/חֲר֖וֹן אַף יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/045.yaml
  text: Come out from her midst[a], my people, and let each man save his life from the burning anger of Yahweh.
translation:
  language: pt
  text: Saiam do meio dela, meu povo, e cada um salve a sua vida do ardor da ira de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְאוּ
  choice: Saiam
  rationale: O imperativo plural de יצא ordena uma partida urgente. “Saiam” é natural em português e mantém a força direta da convocação.
- source_word: מִתּוֹכָהּ
  choice: do meio dela
  rationale: Preserva a expressão espacial e o sufixo feminino, que no contexto remete à Babilônia personificada.
- source_word: עַמִּי
  choice: meu povo
  rationale: Mantém o tratamento pactual e o possessivo do texto hebraico.
- source_word: וּמַלְּטוּ אִישׁ
  choice: e cada um salve
  rationale: O imperativo de מלט, seguido de אִישׁ distributivo, exorta cada indivíduo a preservar a própria vida. “Cada um” comunica naturalmente essa distribuição sem restringir indevidamente o chamado aos homens.
- source_word: אֶת נַפְשׁוֹ
  choice: a sua vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida ou a própria pessoa, não especificamente uma alma imaterial.
- source_word: מֵחֲרוֹן אַף
  choice: do ardor da ira
  rationale: A formulação conserva tanto a imagem de calor em חָרוֹן quanto o sentido de ira em אַף, sem reduzir o hebraísmo a um único termo abstrato.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva sua função como nome e segue a transliteração adotada no projeto.
- issue: Força distributiva de אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: Embora אִישׁ seja morfologicamente masculino, aqui sua função é distributiva no meio de um povo inteiro. “Cada um” mantém essa força representativa em português corrente sem acrescentar uma limitação sexual ausente do contexto.
- issue: Agência humana diante do juízo divino
  choice: cada um salve a sua vida
  alternative: cada um escape
  rationale: A tradução conserva o imperativo e o objeto direto do hebraico, sem dissolver a tensão entre a ordem de fugir e a ira procedente de Yahweh.
translation_notes:
  register: Português moderno, claro e digno, com imperativos diretos. A ordem “Saiam do meio dela” soa natural no português de ampla circulação e preserva a personificação feminina da Babilônia. “Ardor da ira” mantém a imagem hebraica sem soar excessivamente coloquial.
