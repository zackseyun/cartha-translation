  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יִרְמְיָ֜הוּ לְ/דַבֵּ֣ר אֶל כָּל הָ/עָ֗ם אֶת כָּל דִּבְרֵי֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם אֲשֶׁ֧ר שְׁלָח֛/וֹ יְהוָ֥ה אֱלֹהֵי/הֶ֖ם אֲלֵי/הֶ֑ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/001.yaml
  text: And when Jeremiah had finished speaking to all the people all the words of Yahweh their God[a], with which Yahweh their God had sent him to them—all these words—
translation:
  language: pt
  text: Quando Jeremias terminou de comunicar a todo o povo todas as palavras de Yahweh, o Deus deles, com as quais Yahweh, o Deus deles, o enviara a eles — todas essas palavras —,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Quando ... terminou
  rationale: A construção narrativa com וַיְהִי e o infinitivo temporal כְּכַלּוֹת indica que a ação foi concluída antes do que vem a seguir. Em português moderno, “Quando ... terminou” expressa isso naturalmente, sem reproduzir de modo artificial a fórmula hebraica.
- source_word: לְדַבֵּר אֶל
  choice: de comunicar a
  rationale: דבר אל significa falar ou dirigir palavras a alguém. “Comunicar a” permite ligar naturalmente o verbo ao conteúdo explícito, “todas as palavras”, sem perder a ideia de discurso dirigido ao povo.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: עם designa aqui o conjunto das pessoas reunidas e destinatárias de Jeremias; “todo o povo” é a formulação portuguesa corrente.
- source_word: אֶת כָּל דִּבְרֵי יְהוָה
  choice: todas as palavras de Yahweh
  rationale: A tradução concreta “palavras” preserva a formulação profética e prepara a repetição enfática no fim do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome pessoal; a transliteração “Yahweh” o distingue de um título como “Senhor”.
- source_word: אֱלֹהֵיהֶם
  choice: o Deus deles
  rationale: Embora אֱלֹהִים tenha forma plural, sua relação de aposição com Yahweh e o contexto exigem sentido singular. O artigo torna a aposição natural em português.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם אֲלֵיהֶם
  choice: com as quais Yahweh, o Deus deles, o havia enviado a eles
  rationale: O relativo retoma “palavras”; o sufixo em שְׁלָחוֹ refere-se a Jeremias. “Com as quais” preserva a associação, um pouco incomum mas significativa, entre as palavras e a missão do profeta.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas essas palavras
  rationale: A repetição de דבר mantém a ênfase do hebraico e reforça que Jeremias transmitiu integralmente a mensagem recebida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” preserva esse caráter e evita substituí-lo silenciosamente por um título.
- issue: Relação entre Yahweh e אֱלֹהֵיהֶם
  choice: Yahweh, o Deus deles
  alternative: Yahweh, seu Deus
  rationale: A aposição identifica Yahweh como o Deus do povo. “O Deus deles” também conserva a repetição solene da expressão nas duas ocorrências.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A oração permanece aberta por travessão e vírgula porque o versículo hebraico termina antes da declaração principal, que continua no versículo seguinte. A repetição de “todas ... palavras” foi mantida no corpo do texto, sem nota, por ser clara e retoricamente relevante.
