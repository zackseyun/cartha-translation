  terminology: As formas Nebuzaradã, Gedalias, Aicão, Safã, Jeremias, Baruque e Nerias são adequadas em português bíblico. «Chefe da guarda» transmite funcionalmente o título רַב טַבָּחִים; a nota informa de forma apropriada o sentido literal histórico. As notas para טַף e נֶפֶשׁ preservam alternativas lexicais sem impor sentidos teológicos indevidos.
