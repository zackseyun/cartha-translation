source:
  edition: WLC
  text: אֶֽת הַ֠/גְּבָרִים וְ/אֶת הַ/נָּשִׁ֣ים וְ/אֶת הַ/טַּף֮ וְ/אֶת בְּנ֣וֹת הַ/מֶּלֶךְ֒ וְ/אֵ֣ת כָּל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר הִנִּ֨יחַ֙ נְבוּזַרְאֲדָ֣ן רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֑ן וְ/אֵת֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא וְ/אֶת בָּר֖וּךְ בֶּן נֵרִיָּֽהוּ־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/006.yaml
  text: the men[a], the women, the little children, the king’s daughters, and every person whom Nebuzaradan the captain of the guard had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet[c][b], and Baruch son of Neriah—
translation:
  language: pt
  text: os homens, as mulheres, as crianças pequenas[a], as filhas do rei e todas as pessoas[b] que Nebuzaradã, chefe da guarda[c], havia deixado com Gedalias, filho de Aicão, filho de Safã, e o profeta Jeremias, e Baruque, filho de Nerias—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os filhos”; o termo hebraico טַף pode indicar crianças pequenas ou, de modo mais amplo, filhos dependentes.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “toda alma”. Aqui, “alma” é uma maneira hebraica de se referir a uma pessoa.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, “chefe dos abatedores” ou “dos executores”, título oficial geralmente traduzido como “chefe da guarda”.
    reason: cultural_note
lexical_decisions:
- source_word: הַגְּבָרִים
  choice: os homens
  rationale: גְּבָרִים designa homens ou pessoas do sexo masculino; na enumeração ao lado de mulheres e crianças, “os homens” é a forma mais natural e exata.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: נָשִׁים significa aqui “mulheres”; “esposas” seria específico demais para o contexto.
- source_word: הַטַּף
  choice: as crianças pequenas
  rationale: טַף designa os pequenos ou, de modo mais amplo, filhos dependentes. A tradução conserva a ênfase provável na pouca idade, enquanto a nota registra a extensão possível.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: as filhas do rei
  rationale: Reproduz diretamente a expressão hebraica; “princesas” seria possível, mas acrescentaria uma formulação interpretativa.
- source_word: כָּל הַנֶּפֶשׁ
  choice: todas as pessoas
  rationale: נֶפֶשׁ refere-se aqui a seres humanos, não especificamente à parte imaterial da pessoa. O plural é natural em português depois de כָּל neste contexto coletivo.
- source_word: הִנִּיחַ
  choice: havia deixado
  rationale: O verbo indica que Nebuzaradã deixou essas pessoas ali, no âmbito da autoridade ou companhia de Gedalias; a tradução evita explicitar além do necessário a natureza dessa relação.
- source_word: רַב טַבָּחִים
  choice: chefe da guarda
  rationale: Trata-se de um título oficial babilônico. “Chefe da guarda” comunica a função com clareza, ao passo que uma tradução etimológica como “chefe dos executores” poderia induzir o leitor moderno ao erro.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: com Gedalias, filho de Aicão, filho de Safã
  rationale: Depois de הִנִּיחַ, a construção indica que as pessoas foram deixadas com Gedalias. Os patronímicos são preservados.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: Mantém tanto o nome próprio como o título expresso no hebraico, em ordem natural no português.
- source_word: בָּרוּךְ בֶּן נֵרִיָּהוּ
  choice: Baruque, filho de Nerias
  rationale: Translitera os nomes segundo formas portuguesas correntes e preserva o patronímico hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas onomásticas usuais no meio lusófono. A enumeração e o travessão final foram mantidos porque o versículo continua a construção iniciada no contexto anterior. A coordenação final conserva, tanto quanto possível, a estrutura hebraica sem resolver de modo excessivo a ligação sintática de Jeremias e Baruque.
