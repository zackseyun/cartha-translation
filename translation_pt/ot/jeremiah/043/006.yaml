  source_fidelity: 'A tradução reproduz com precisão a enumeração hebraica: homens, mulheres, crianças pequenas, filhas do rei e todas as pessoas. Mantém os nomes, os patronímicos, o título de Jeremias e o travessão que assinala a continuação sintática do período. A formulação «havia deixado com Gedalias» acompanha adequadamente a leitura contextual de הִנִּיחַ e não resolve além do necessário a ligação sintática final de Jeremias e Baruque.'
