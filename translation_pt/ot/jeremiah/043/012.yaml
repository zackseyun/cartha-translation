  text: וְ/הִצַּ֣תִּי אֵ֗שׁ בְּ/בָתֵּי֙ אֱלֹהֵ֣י מִצְרַ֔יִם וּ/שְׂרָפָ֖/ם וְ/שָׁבָ֑/ם וְ/עָטָה֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם כַּ/אֲשֶׁר יַעְטֶ֤ה הָֽ/רֹעֶה֙ אֶת בִּגְד֔/וֹ וְ/יָצָ֥א מִ/שָּׁ֖ם בְּ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/012.yaml
  text: And he will set fire to the temples of the gods of Egypt[a], and he will burn them and carry them away. He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment[b], and he will go out from there in peace.
translation:
  language: pt
  text: Ele ateará fogo aos templos dos deuses do Egito[a]; ele os queimará e os levará embora[b]. Ele se cobrirá com a terra do Egito, como um pastor se cobre com sua veste, e sairá dali em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E eu atearei fogo aos templos dos deuses do Egito”. O texto principal segue o contexto, no qual o rei da Babilônia é quem pratica as ações.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “os levará cativos”. O hebraico pode se referir aos deuses, às imagens deles ou aos tesouros dos templos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: Ele ateará fogo
  rationale: A forma hebraica preservada é de primeira pessoa, mas o contexto imediato e os verbos seguintes mantêm o rei da Babilônia como sujeito em terceira pessoa. A tradução principal dá continuidade a esse sujeito, enquanto a nota registra a forma literal.
- source_word: בְּבָתֵּי אֱלֹהֵי מִצְרַיִם
  choice: aos templos dos deuses do Egito
  rationale: Embora בָּתֵּי signifique literalmente “casas”, no contexto das divindades designa seus templos ou santuários. “Templos” é claro e natural em português.
- source_word: וּשְׂרָפָם וְשָׁבָם
  choice: ele os queimará e os levará embora
  rationale: Os pronomes mantêm em aberto se o referente são os templos, os deuses representados por suas imagens ou os bens ligados a eles. “Levará embora” preserva a amplitude de שבה sem impor a ideia de pessoas literalmente capturadas.
- source_word: וְעָטָה אֶת אֶרֶץ מִצְרַיִם
  choice: Vestirá a terra do Egito
  rationale: עטה é empregado para vestir ou envolver-se numa roupa. A formulação conserva a metáfora ousada do hebraico, na qual a terra do Egito é tratada como uma vestimenta facilmente tomada.
- source_word: כַּאֲשֶׁר יַעְטֶה הָרֹעֶה אֶת בִּגְדוֹ
  choice: como um pastor veste a sua roupa
  rationale: A repetição de “veste” corresponde à repetição do mesmo verbo hebraico e torna clara a comparação. “Roupa” traduz בגד de modo amplo, atual e compreensível.
- source_word: וְיָצָא מִשָּׁם בְּשָׁלוֹם
  choice: e sairá dali em paz
  rationale: A expressão conserva o sentido direto de שָׁלוֹם e, no contexto, também comunica que ele partirá em segurança, sem ser impedido.
theological_decisions:
- issue: O sujeito de וְהִצַּתִּי em contraste com a sequência de verbos na terceira pessoa
  choice: Usar “Ele ateará fogo” no texto principal, entendendo que o rei da Babilônia continua sendo o agente da ação.
  alternative: “E eu atearei fogo”, conforme a forma hebraica de primeira pessoa do texto massorético.
  rationale: Os verbos subsequentes estão na terceira pessoa masculina singular e o contexto aponta para o rei da Babilônia como instrumento do juízo. A nota preserva a forma textual de primeira pessoa, evitando ocultar a tensão gramatical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora incomum de vestir a terra foi mantida, e a repetição do verbo reproduz a estrutura poética do hebraico. “Ateará fogo” e “sairá dali em paz” preservam um tom bíblico natural sem arcaísmo excessivo.
