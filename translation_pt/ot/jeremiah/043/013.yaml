  text: וְ/שִׁבַּ֗ר אֶֽת מַצְּבוֹת֙ בֵּ֣ית שֶׁ֔מֶשׁ אֲשֶׁ֖ר בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֶת בָּתֵּ֥י אֱלֹהֵֽי מִצְרַ֖יִם יִשְׂרֹ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/013.yaml
  text: He will shatter the pillars of Beth-shemesh that is in the land of Egypt[b][a], and he will burn the temples of the gods of Egypt with fire.
translation:
  language: pt
  text: Ele quebrará as colunas de Bete-Semes, que fica na terra do Egito,[a][b] e queimará no fogo os templos dos deuses do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “colunas sagradas” ou “pedras erguidas”. O termo hebraico se refere a colunas de pedra usadas no culto.
    reason: lexical_alternative
  - marker: b
    text: Bete-Semes significa “Casa do Sol” e provavelmente se refere à cidade egípcia conhecida em grego como Heliópolis.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁבַּר
  choice: Ele quebrará
  rationale: O verbo שׁבר indica quebrar ou despedaçar. “Quebrará” é natural e digno em português e comunica a destruição deliberada sem exagerar a especificidade do modo.
- source_word: מַצְּבוֹת
  choice: as colunas
  rationale: מַצֵּבָה designa pedras erguidas ou colunas de função cultual. “Colunas” oferece leitura clara; a natureza sagrada é explicitada em nota para não sobrecarregar o texto.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: O topônimo é transliterado segundo forma bíblica portuguesa reconhecível. Seu significado e sua provável identificação histórica ficam em nota.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: que fica na terra do Egito
  rationale: A oração relativa é entendida como modificadora de Bete-Semes. “Que fica” soa natural em português moderno e preserva a indicação geográfica.
- source_word: בָּתֵּי אֱלֹהֵי מִצְרַיִם
  choice: os templos dos deuses do Egito
  rationale: Embora בָּתִּים signifique literalmente “casas”, o contexto cultual pede “templos”, equivalente funcional claro em português.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: queimará no fogo
  rationale: A formulação conserva tanto o verbo “queimar” quanto o substantivo “fogo” presentes no hebraico, mantendo a ênfase da expressão sem recorrer a linguagem arcaica.
