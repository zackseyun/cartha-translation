  text: וַ/יִּקַּ֞ח יוֹחָנָ֤ן בֶּן קָרֵ֨חַ֙ וְ/כָל שָׂרֵ֣י הַ/חֲיָלִ֔ים אֵ֖ת כָּל שְׁאֵרִ֣ית יְהוּדָ֑ה אֲשֶׁר שָׁ֗בוּ מִ/כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר נִדְּחוּ שָׁ֔ם לָ/ג֖וּר בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/005.yaml
  text: Then Johanan son of Kareah[a], and all the commanders of the forces, took all the remnant of Judah who had returned from all the nations where they had been driven away[b], to sojourn in the land of Judah—
translation:
  language: pt
  text: Então Joanã, filho de Careá, e todos os comandantes das tropas levaram todo o remanescente de Judá que havia voltado de todas as nações para onde tinha sido expulso[a], a fim de residir[b] na terra de Judá —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para onde tinha sido disperso”. O verbo hebraico pode indicar ser expulso, desterrado ou disperso.
    reason: lexical_alternative
  - marker: b
    text: Ou “viver como forasteiro”. O verbo hebraico muitas vezes traz a ideia de residir temporariamente ou em condição dependente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ... levaram
  rationale: O waw consecutivo faz a narrativa avançar. O verbo לקח significa tomar ou levar; no contexto, “levaram” expressa naturalmente que o grupo foi conduzido a outro lugar. O plural acomoda o sujeito composto em português.
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Joanã, filho de Careá
  rationale: Emprega formas portuguesas tradicionais e reconhecíveis para os nomes, preservando o patronímico hebraico.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: os comandantes das tropas
  rationale: שָׂרִים designa chefes ou comandantes, e o plural de חַיִל, neste contexto, se refere a contingentes militares. A formulação é clara e atual.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: todo o remanescente de Judá
  rationale: “Remanescente” preserva tanto a ideia do grupo restante quanto o peso temático recorrente de שְׁאֵרִית em Jeremias.
- source_word: אֲשֶׁר שָׁבוּ
  choice: que havia voltado
  rationale: O mais-que-perfeito composto indica que o retorno ocorreu antes da ação principal. A concordância gramatical segue o coletivo singular “remanescente”.
- source_word: מִכָּל הַגּוֹיִם
  choice: de todas as nações
  rationale: Tradução direta e idiomática do ponto de origem entre os povos estrangeiros.
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: para onde tinha sido expulso
  rationale: O nifal de נדח comunica deslocamento imposto, abrangendo ser expulso, desterrado ou disperso. “Expulso” conserva a força coercitiva sem especificar além do hebraico.
- source_word: לָגוּר
  choice: a fim de residir
  rationale: O infinitivo expressa finalidade. “Residir” é natural em português; a nota conserva a nuance de permanência provisória ou dependente própria de גור.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Mantém a designação territorial hebraica e a distingue do nome posterior “Judeia”.
theological_decisions: []
