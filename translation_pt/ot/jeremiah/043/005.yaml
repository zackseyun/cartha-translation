  verdict: approve
  source_fidelity: 'A tradução representa adequadamente a progressão narrativa de וַיִּקַּח, o sujeito composto, o coletivo כָּל־שְׁאֵרִית יְהוּדָה e as duas ações temporalmente relacionadas: o remanescente já havia retornado das nações para as quais fora compelido a ir, e é levado com o propósito de residir na terra de Judá. “Expulso” transmite apropriadamente a força passiva/coercitiva de נִדְּחוּ, sem eliminar a alternativa “disperso” na nota. “Residir” é uma solução natural para לָגוּר, e a nota preserva a nuance de residência como forasteiro ou dependente.'
