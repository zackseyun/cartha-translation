  terminology: Os nomes próprios estão em formas portuguesas bíblicas aceitáveis. “Remanescente” preserva um termo importante de Jeremias; “terra de Judá” mantém a designação territorial hebraica; e “comandantes das tropas” traduz com precisão suficiente o vocabulário militar. As notas estão ancoradas nas expressões que explicam e distinguem corretamente as alternativas lexicais.
