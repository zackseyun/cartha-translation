base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/011.yaml
  text: 'He will come and strike the land of Egypt: those for death[a], to death; those for captivity, to captivity; and those for the sword, to the sword.'
translation:
  language: pt
  text: 'Ele[b] virá e ferirá a terra do Egito: os destinados à morte, à morte; os destinados ao cativeiro, ao cativeiro; e os destinados à espada, à espada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem estiver destinado à morte, para a morte; quem estiver destinado ao cativeiro, para o cativeiro; e quem estiver destinado à espada, para a espada”. O hebraico emprega uma fórmula de juízo concisa e repetitiva.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico escrito apresenta uma forma feminina em “virá”, enquanto o verbo seguinte, “ferirá”, está no masculino. Pelo contexto, a tradução entende o agente como o rei da Babilônia.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּבָאָה
  choice: Ele virá
  rationale: O qatal com conjunção, na sequência profética e à luz do contexto anterior, tem sentido futuro. O pronome masculino singular preserva a referência contextual ao rei da Babilônia sem inserir seu nome no versículo.
- source_word: וְהִכָּה
  choice: e ferirá
  rationale: נכה significa de modo amplo 'ferir, golpear'. 'Ferirá' mantém a força do verbo e o registro profético sem especificar além do texto a forma do ataque.
- source_word: אֶת־אֶרֶץ מִצְרַיִם
  choice: a terra do Egito
  rationale: Preserva אֶרֶץ e apresenta o território egípcio como objeto do golpe; o marcador de objeto direto não recebe tradução própria.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: os destinados à morte, à morte
  rationale: A expressão reproduz a repetição judicial e distributiva do hebraico. 'Destinados' torna inteligível em português a construção elíptica com לְ sem eliminar sua severidade.
- source_word: וַאֲשֶׁר לַשְּׁבִי לַשֶּׁבִי
  choice: os destinados ao cativeiro, ao cativeiro
  rationale: שְׁבִי designa cativeiro ou condição de cativo. 'Cativeiro' é mais exato aqui que 'exílio' e mantém o paralelismo.
- source_word: וַאֲשֶׁר לַחֶרֶב לֶחָרֶב
  choice: e os destinados à espada, à espada
  rationale: Mantém literalmente חֶרֶב e sua função metonímica de morte violenta, preservando a estrutura tríplice do original.
theological_decisions:
- issue: Referente do sujeito masculino singular
  choice: “Ele”, em referência contextual ao rei da Babilônia como agente do juízo
  alternative: Explicitar “Nabucodonosor” ou empregar uma construção impessoal
  rationale: As formas verbais hebraicas são masculinas singulares, e o contexto imediato identifica o referente. O pronome preserva a formulação do versículo sem acrescentar o nome próprio.
- issue: Força da fórmula distributiva de juízo
  choice: “os destinados a...”, mantendo a repetição de cada resultado
  alternative: “quem for para...” ou uma paráfrase que elimine a repetição
  rationale: A tradução conserva o caráter judicial e inevitável da fórmula, mas não define se a destinação deve ser entendida filosoficamente como predeterminação; trata-se primeiro da distribuição profética dos destinos anunciados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição incomum foi preservada por ser retoricamente significativa; a nota registra uma forma alternativa mais individualizante da construção hebraica.
