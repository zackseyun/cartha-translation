id: JER.43.3
reference: Jeremiah 43:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֗י בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה מַסִּ֥ית אֹתְ/ךָ֖ בָּ֑/נוּ לְמַעַן֩ תֵּ֨ת אֹתָ֤/נוּ בְ/יַֽד הַ/כַּשְׂדִּים֙ לְ/הָמִ֣ית אֹתָ֔/נוּ וּ/לְ/הַגְל֥וֹת אֹתָ֖/נוּ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
translation:
  language: pt
  text: Pois Baruque, filho de Nerias, está instigando você contra nós[a], a fim de nos entregar nas mãos dos caldeus[b], para que nos matem e nos levem para o exílio na Babilônia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está incitando você contra nós” ou “está colocando você contra nós”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na mão dos caldeus”, expressão que significa ficar entregue ao poder deles.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “e nos deportem para a Babilônia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão apresentada pelos acusadores e mantém a ligação explicativa com a recusa do contexto anterior.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Baruque, filho de Nerias
  rationale: Emprega as formas tradicionais e amplamente reconhecíveis dos nomes em português, com o patronímico expresso naturalmente.
- source_word: מַסִּית
  choice: está instigando
  rationale: Preserva o sentido hostil e manipulador do particípio causativo, sem o enfraquecer para simples persuasão.
- source_word: אֹתְךָ בָּנוּ
  choice: você contra nós
  rationale: Reproduz a direção hostil da construção hebraica em português claro e natural.
- source_word: לְמַעַן
  choice: a fim de
  rationale: Marca de maneira clara a finalidade atribuída a Baruque pelos acusadores.
- source_word: תֵּת אֹתָנוּ בְיַד הַכַּשְׂדִּים
  choice: nos entregar nas mãos dos caldeus
  rationale: Traduz o idioma hebraico como entrega ao poder de alguém, preservando também a imagem das mãos, muito compreensível em português.
- source_word: לְהָמִית אֹתָנוּ
  choice: para que nos matem
  rationale: Expressa naturalmente em português o causativo hebraico no contexto da entrega aos caldeus, que seriam os agentes da morte.
- source_word: וּלְהַגְלוֹת אֹתָנוּ
  choice: e nos levem para o exílio
  rationale: Conserva tanto o deslocamento forçado quanto a condição de exílio contidos no verbo causativo.
- source_word: בָּבֶל
  choice: na Babilônia
  rationale: Após 'levar para o exílio', a formulação indica naturalmente o destino e lugar do exílio em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A acusação permanece apresentada como fala dos personagens, sem validar sua veracidade. A imagem hebraica da mão é mantida na forma idiomática portuguesa plural, “nas mãos”.
