base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/002.yaml
  text: Azariah son of Hoshaiah, Johanan son of Kareah, and all the arrogant men said to Jeremiah, “You are speaking a lie. The LORD our God has not sent you to say, ‘You must not go to Egypt to sojourn there.’”
translation:
  language: pt
  text: 'Então Azarias, filho de Hosaías, Joanã, filho de Careá, e todos os homens arrogantes disseram a Jeremias: “É mentira o que você está dizendo! O SENHOR, nosso Deus, não o enviou para dizer: ‘Não vão ao Egito para viverem ali como estrangeiros.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזֵּדִים
  choice: arrogantes
  rationale: Expressa o sentido de presunção e insolência do termo hebraico no contexto, em português natural.
- source_word: שֶׁקֶר אַתָּה מְדַבֵּר
  choice: É mentira o que você está dizendo!
  rationale: Reproduz diretamente a acusação enfática, sem suavizá-la para apenas 'falar falsamente'.
- source_word: לָגוּר
  choice: morar temporariamente
  rationale: Preserva a ideia de residir como estrangeiro ou por tempo limitado, em vez de estabelecer residência permanente.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o tetragrama, distinguindo-o do título comum 'Senhor'.
theological_decisions:
- issue: Força da proibição introduzida por לֹא
  choice: Não vão ao Egito
  alternative: Vocês não devem ir ao Egito
  rationale: A forma direta preserva a proibição citada e evita acrescentar uma modalidade que não precisa ser explicitada em português.
- issue: Identificação de YHWH como Deus do grupo
  choice: O SENHOR, nosso Deus
  alternative: O SENHOR nosso Deus
  rationale: A vírgula torna natural em português a aposição, sem alterar a reivindicação dos falantes de que YHWH é 'nosso Deus'.
translation_notes:
  register: Português moderno, digno e acessível, com nomes próprios em formas bíblicas correntes no uso brasileiro. O plural 'não vão' comunica naturalmente a fala dirigida ao grupo. A exclamação assinala a força da acusação presente na construção hebraica.
