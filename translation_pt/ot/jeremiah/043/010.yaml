  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י שֹׁלֵ֨חַ֙ וְ֠/לָקַחְתִּי אֶת נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עַבְדִּ֔/י וְ/שַׂמְתִּ֣י כִסְא֔/וֹ מִ/מַּ֛עַל לָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה אֲשֶׁ֣ר טָמָ֑נְתִּי וְ/נָטָ֥ה אֶת שפרור/ו עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/010.yaml
  text: 'And say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am sending and will take Nebuchadnezzar king of Babylon, my servant, and I will set his throne above these stones that I have hidden, and he will spread his canopy over them.’'
translation:
  language: pt
  text: 'E diga a eles: “Assim diz Yahweh dos Exércitos, o Deus de Israel: ‘Eis que vou mandar buscar Nabucodonosor, rei da Babilônia, meu servo. Colocarei o trono dele sobre estas pedras que escondi, e ele estenderá sobre elas o seu pavilhão[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu dossel”, “sua tenda real”; o sentido exato do termo hebraico é incerto, mas provavelmente indica algum tipo de cobertura régia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino como nome próprio e traduz צְבָאוֹת pelo título tradicional, compreensível e solene “dos Exércitos”.
- source_word: הִנְנִי שֹׁלֵחַ וְלָקַחְתִּי
  choice: Eis que vou mandar buscar
  rationale: Reproduz a ênfase de הִנְנִי e expressa em português natural a combinação de enviar e tomar/trazer alguém, conservando o sentido de ação iminente ordenada por Deus.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma portuguesa consagrada do nome do rei babilônico.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Preserva a designação de Nabucodonosor como instrumento subordinado a Deus sem sugerir aprovação moral ou fidelidade à aliança.
- source_word: כִסְאוֹ
  choice: o trono dele
  rationale: O contexto régio exige “trono”; a construção evita qualquer ambiguidade em português quanto ao referente do possessivo.
- source_word: מִמַּעַל לָאֲבָנִים הָאֵלֶּה
  choice: sobre estas pedras
  rationale: Expressa de modo natural a posição do trono acima das pedras escondidas.
- source_word: טָמָנְתִּי
  choice: que escondi
  rationale: Mantém o sentido básico de ocultar, adequado às pedras que Jeremias havia escondido.
- source_word: שפרורו
  choice: o seu pavilhão
  rationale: O termo raro parece designar uma cobertura ou estrutura régia estendida; “pavilhão” preserva a imagem sem impor uma identificação excessivamente específica.
- source_word: וְנָטָה
  choice: estenderá
  rationale: Conserva o sentido de esticar ou abrir uma cobertura sobre determinado lugar.
theological_decisions:
- issue: Nabucodonosor chamado עַבְדִּי
  choice: meu servo
  alternative: meu escravo; meu agente
  rationale: “Meu servo” conserva a tensão de um rei pagão ser usado soberanamente por Deus como instrumento de juízo, sem afirmar fidelidade espiritual nem aprovação de sua conduta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula profética mantém solenidade sem recorrer a sintaxe arcaica. O discurso direto foi pontuado em dois níveis para deixar claro que Jeremias transmite as palavras de Yahweh.
