id: JER.43.7
reference: Jeremiah 43:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ מִצְרַ֔יִם כִּ֛י לֹ֥א שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה וַ/יָּבֹ֖אוּ עַד תַּחְפַּנְחֵֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
translation:
  language: pt
  text: Assim, entraram na terra do Egito, pois não deram ouvidos à voz de Yahweh[a], e chegaram até Tafnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não obedeceram a Yahweh». A expressão hebraica «dar ouvidos à voz de» pode ter o sentido de atender e obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: entraram
  rationale: Com «a terra do Egito» como complemento, o verbo בוא indica movimento para dentro de um território; «entraram» é natural em português e preserva esse sentido.
- source_word: אֶרֶץ מִצְרַיִם
  choice: a terra do Egito
  rationale: Mantém a expressão territorial explícita do hebraico sem prejudicar a naturalidade.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ação anterior e funciona naturalmente na narrativa.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: não deram ouvidos à voz de
  rationale: Preserva a imagem hebraica de escutar a voz, enquanto a locução portuguesa «dar ouvidos» comunica também a recusa em atender ou obedecer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּבֹאוּ עַד
  choice: chegaram até
  rationale: Expressa o alcance do deslocamento até o lugar indicado por עַד.
- source_word: תַּחְפַּנְחֵס
  choice: Tafnes
  rationale: Emprega a forma tradicional e reconhecível do topônimo hebraico em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, e «Yahweh» preserva sua função como nome próprio sem o substituir por um título.
- issue: Sentido de שׁמע בקול
  choice: não deram ouvidos à voz de Yahweh
  alternative: não obedeceram a Yahweh
  rationale: A tradução principal conserva a metáfora auditiva e também sugere desobediência; a nota explicita o sentido idiomático sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos dois movimentos («entraram» e «chegaram») foi mantida por corresponder à estrutura narrativa hebraica.
