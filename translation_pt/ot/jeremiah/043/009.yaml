  text: קַ֣ח בְּ/יָדְ/ךָ֞ אֲבָנִ֣ים גְּדֹל֗וֹת וּ/טְמַנְתָּ֤/ם בַּ/מֶּ֨לֶט֙ בַּ/מַּלְבֵּ֔ן אֲשֶׁ֛ר בְּ/פֶ֥תַח בֵּית פַּרְעֹ֖ה בְּ/תַחְפַּנְחֵ֑ס לְ/עֵינֵ֖י אֲנָשִׁ֥ים יְהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/009.yaml
  text: Take large stones in your hand and hide them in the mortar[a], in the brick pavement that is at the entrance of Pharaoh’s house in Tahpanhes[c][b], before the eyes of the Jewish men.
translation:
  language: pt
  text: Pegue pedras grandes em sua mão e esconda-as na argamassa[a], no pavimento de tijolos[b] que fica à entrada da casa do faraó, em Tafnes, diante dos homens judeus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enterre-as”. O verbo hebraico pode indicar que algo é ocultado ao ser colocado no solo ou dentro de uma estrutura.
    reason: lexical_alternative
  - marker: b
    text: Ou “na estrutura de tijolos”, “no terraço de tijolos” ou, possivelmente, “no forno de tijolos”. O termo hebraico é raro, e seu sentido arquitetônico exato é incerto.
    reason: lexical_alternative
  - marker: c
    text: Ou “dos homens de Judá”. O adjetivo hebraico pode designar tanto judeus em sentido étnico quanto, mais especificamente, pessoas de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בְּיָדְךָ
  choice: Pegue na mão
  rationale: Reproduz a ordem direta e mantém o singular de יָד, apresentando Jeremias como agente da ação.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: pedras grandes
  rationale: Expressão corrente e clara que preserva a ênfase hebraica no tamanho das pedras.
- source_word: וּטְמַנְתָּם
  choice: e esconda-as
  rationale: טמן indica ocultar algo, muitas vezes colocando-o no solo ou dentro de uma estrutura. “Esconder” conserva essa amplitude; “enterrar” seria possível, mas mais específico.
- source_word: בַּמֶּלֶט
  choice: na argamassa
  rationale: No contexto de construção, מֶלֶט designa provavelmente argamassa ou material semelhante usado para assentamento, sem o possível anacronismo de “cimento”.
- source_word: בַּמַּלְבֵּן
  choice: no pavimento de tijolos
  rationale: O termo raro מַלְבֵּן tem sentido arquitetônico incerto. Um pavimento ou área construída de tijolos combina bem com sua localização à entrada da casa do faraó e com o uso de argamassa.
- source_word: אֲשֶׁר בְּפֶתַח בֵּית פַּרְעֹה
  choice: que fica à entrada da casa do faraó
  rationale: Mantém “casa” em vez do interpretativo “palácio” e expressa de modo natural a localização indicada por פֶּתַח.
- source_word: בְּתַחְפַּנְחֵס
  choice: em Tafnes
  rationale: Emprega a forma portuguesa tradicional e reconhecível do topônimo egípcio.
- source_word: לְעֵינֵי
  choice: diante de
  rationale: Equivalente idiomático natural que comunica que a ação deveria ser realizada publicamente, à vista das testemunhas.
- source_word: אֲנָשִׁים יְהוּדִים
  choice: dos homens judeus
  rationale: Preserva o substantivo masculino explícito אֲנָשִׁים e traduz יְהוּדִים de maneira clara, sem eliminar a possível referência histórica específica aos homens de Judá.
