source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַע֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֛ים וְ/כָל הָ/עָ֖ם בְּ/ק֣וֹל יְהוָ֑ה לָ/שֶׁ֖בֶת בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/004.yaml
  text: But Johanan son of Kareah[a], and all the commanders of the forces, and all the people, did not listen to the voice of Yahweh, to remain in the land of Judah.
translation:
  language: pt
  text: Mas Joanã, filho de Careá, e todos os comandantes das tropas e todo o povo não deram ouvidos à voz de Yahweh[a], para permanecerem na terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “dar ouvidos à voz de Yahweh” também pode ter o sentido de “obedecer a Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção com a negação dá continuidade à narrativa em contraste com a ordem anterior; “Mas” expressa naturalmente esse valor adversativo.
- source_word: שָׁמַע ... בְּקוֹל
  choice: deram ouvidos à voz
  rationale: A expressão idiomática portuguesa preserva a imagem auditiva do hebraico e também comunica a ideia contextual de atender ou obedecer, sem reduzi-la apenas a uma dessas nuances.
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Joanã, filho de Careá
  rationale: Emprega formas portuguesas reconhecíveis para os nomes e traduz naturalmente o patronímico hebraico.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: os comandantes das tropas
  rationale: “Comandantes” comunica a função militar dos שׂרים, enquanto “tropas” conserva o plural de חֲיָלִים sem pressupor um único exército formal.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Tradução direta e idiomática do substantivo coletivo com כָל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָשֶׁבֶת
  choice: para permanecerem
  rationale: No contexto, o infinitivo indica a permanência na terra em vez da partida; o plural concorda naturalmente em português com o sujeito composto.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Preserva o sentido territorial de אֶרֶץ e evita a forma historicamente posterior “Judeia”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e não o substitui por um título.
- issue: Relação entre ouvir e obedecer em שָׁמַע בְּקוֹל
  choice: não deram ouvidos à voz
  alternative: não obedeceram a Yahweh
  rationale: A redação escolhida preserva a metáfora concreta da voz e, ao mesmo tempo, permite a nuance de desobediência inerente ao contexto, sem resolver silenciosamente a amplitude da expressão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “deram ouvidos” mantém o idiomatismo bíblico ainda corrente; a pontuação evita separar desnecessariamente o sujeito composto do verbo.
