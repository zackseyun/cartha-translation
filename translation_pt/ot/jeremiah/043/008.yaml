  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ בְּ/תַחְפַּנְחֵ֖ס לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/008.yaml
  text: Then the word of Yahweh came to Jeremiah in Tahpanhes[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh veio a Jeremias em Tafnes[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E aconteceu que a palavra de Yahweh veio a Jeremias em Tafnes, dizendo”.'
    reason: Registra a forma mais literal da abertura narrativa וַיְהִי, cuja construção foi vertida no texto por um português mais natural.
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A forma narrativa introduz um novo acontecimento. “Então ... veio” expressa a progressão com naturalidade, sem recorrer à fórmula hoje pouco usual “e aconteceu que”.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética e a ressonância de fala divina; “mensagem” seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל יִרְמְיָהוּ
  choice: a Jeremias
  rationale: A preposição indica o destinatário da palavra divina; “a” é a formulação portuguesa direta e natural.
- source_word: בְּתַחְפַּנְחֵס
  choice: em Tafnes
  rationale: A preposição בְּ marca localização, e “Tafnes” é uma forma portuguesa reconhecível do topônimo.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo do discurso divino que vem a seguir; “dizendo” preserva de modo conciso essa função.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem convertê-lo em título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do hebraico. Conserva a fórmula profética “a palavra de Yahweh” e usa “dizendo” para conectar o versículo ao discurso seguinte.
