  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חֹ֥רֶב אֶל מֵימֶ֖י/הָ וְ/יָבֵ֑שׁוּ כִּ֣י אֶ֤רֶץ פְּסִלִים֙ הִ֔יא וּ/בָ/אֵימִ֖ים יִתְהֹלָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/038.yaml
  text: A drought is against her waters[a], and they will dry up, for it is a land of carved idols[b], and they are mad over terrifying things.
translation:
  language: pt
  text: A seca atingirá as suas águas[a], e elas secarão, pois é uma terra de ídolos esculpidos, e eles deliram por coisas aterradoras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma espada virá contra as suas águas”. A vocalização hebraica indica “seca”, mas o texto consonantal pode evocar também “espada”, talvez produzindo intencionalmente os dois sentidos.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “deliram por terrores”; possivelmente, “deliram por ídolos aterradores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹרֶב
  choice: uma seca
  rationale: A vocalização massorética aponta para “seca/ressecamento”, sentido especialmente adequado diante das águas que secarão. A possível ressonância com “espada” é preservada em nota.
- source_word: אֶל מֵימֶיהָ
  choice: virá sobre as suas águas
  rationale: A expressão hebraica é nominal e concisa; “virá sobre” fornece em português uma formulação natural de juízo sem alterar o alvo indicado por אֶל.
- source_word: וְיָבֵשׁוּ
  choice: e elas secarão
  rationale: O Qal é intransitivo, e o sujeito retomado é “águas”; o pronome feminino plural torna essa ligação clara em português.
- source_word: אֶרֶץ פְּסִלִים
  choice: uma terra de imagens esculpidas
  rationale: Preserva o sentido concreto de פְּסִלִים como imagens fabricadas por entalhe, sem empregar linguagem arcaica.
- source_word: וּבָאֵימִים
  choice: por coisas aterradoras
  rationale: אֵימִים pode designar terrores ou objetos aterradores e, neste contexto, talvez imagens cultuais temíveis. A tradução mantém o referente aberto.
- source_word: יִתְהֹלָלוּ
  choice: deliram
  rationale: O verbo descreve comportamento irracional ou frenético. “Deliram” é atual, vívido e compatível com a construção portuguesa “delirar por”.
- source_word: יִתְהֹלָלוּ (sujeito implícito)
  choice: seus habitantes
  rationale: O verbo hebraico está no plural, embora o antecedente imediato “terra” seja singular. A explicitação idiomática identifica naturalmente os habitantes da terra sem introduzir um grupo mais específico.
theological_decisions:
- issue: Sentido de חֹרֶב em relação às águas
  choice: “Uma seca” no texto principal
  alternative: “Uma espada”
  rationale: A vocalização do texto massorético favorece “seca”, e a continuação afirma que as águas secarão. Contudo, as consoantes também evocam a palavra hebraica para “espada”, recorrente nas fórmulas de juízo de Jeremias; a nota preserva essa possível sobreposição intencional.
- issue: Referente de אֵימִים
  choice: “coisas aterradoras”
  alternative: “ídolos aterradores” ou “terrores”
  rationale: O contexto de imagens esculpidas sugere ídolos temíveis, mas o substantivo não os identifica explicitamente. A tradução evita resolver uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção profética foi tornada natural por “virá sobre”, e o sujeito plural implícito foi explicitado como “seus habitantes”. As ambiguidades relativas a “seca/espada” e ao referente de “coisas aterradoras” foram preservadas por notas.
