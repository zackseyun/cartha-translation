review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a causalidade da ira de Yahweh, a cidade não habitada, a desolação total e a reação dos transeuntes. Contudo, «por causa de todos os seus ferimentos» torna עַל («sobre/diante de/por ocasião de») uma relação causal excessivamente definida; no hebraico, o assobio é dirigido às feridas ou ocorre diante delas.
  naturalness: O português é moderno, claro e de registro apropriado. «Diante de todas as suas feridas» é mais natural e também mais próximo da relação imagética do hebraico do que «por causa de».
  terminology: «Yahweh», «ira», «desolada», «Babilônia» e «feridas» são escolhas adequadas. «Assobiará» preserva uma alternativa lexical legítima, com nota devidamente ancorada.
  issues:
  - severity: medium
    issue: «por causa de todos os seus ferimentos» para עַל כָּל מַכּוֹתֶיהָ
    rationale: A preposição עַל normalmente indica que o gesto é feito sobre, diante de ou em reação às feridas da cidade. A formulação causal em português restringe a relação mais do que o texto exige. «Diante de todas as suas feridas» conserva a imagem e evita essa especificação.
  revised_text: Por causa da ira de Yahweh, ela não será habitada, mas ficará completamente desolada. Todo aquele que passar pela Babilônia ficará horrorizado e assobiará[a] diante de todas as suas feridas.
  revised_footnotes:
  - marker: a
    text: Ou “sibilará”; o verbo hebraico pode indicar assobiar ou sibilar, aqui como expressão de espanto ou escárnio diante da ruína da Babilônia.
    reason: lexical_alternative
  revision_rationale: A única revisão substitui uma relação causal mais interpretativa por «diante de», que representa com maior precisão a preposição hebraica עַל no gesto de reação às feridas de Babilônia. O restante do texto e a nota lexical são mantidos.
