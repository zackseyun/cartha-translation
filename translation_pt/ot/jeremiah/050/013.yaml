  text: מִ/קֶּ֤צֶף יְהוָה֙ לֹ֣א תֵשֵׁ֔ב וְ/הָיְתָ֥ה שְׁמָמָ֖ה כֻּלָּ֑/הּ כֹּ֚ל עֹבֵ֣ר עַל בָּבֶ֔ל יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/013.yaml
  text: Because of the wrath of Yahweh[a], it will not be inhabited, but will become a complete desolation. Everyone who passes by Babylon will be appalled and will hiss over all her wounds.
translation:
  language: pt
  text: Por causa da ira de Yahweh, ela não será habitada, mas ficará completamente desolada. Todo aquele que passar pela Babilônia ficará horrorizado e assobiará[a] diante de todas as suas feridas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sibilará”; o verbo hebraico pode indicar assobiar ou sibilar, aqui como expressão de espanto ou escárnio diante da ruína da Babilônia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֶּצֶף
  choice: Por causa da ira de
  rationale: A preposição מִן indica aqui a causa da ruína da Babilônia, e קֶצֶף expressa ira intensa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא תֵשֵׁב
  choice: ela não será habitada
  rationale: Neste contexto de juízo contra uma cidade, ישׁב tem o sentido de ser habitada; o pronome feminino retoma Babilônia.
- source_word: וְהָיְתָה שְׁמָמָה כֻּלָּהּ
  choice: mas ficará completamente desolada
  rationale: Expressa em português natural tanto a devastação indicada por שְׁמָמָה quanto sua totalidade, marcada por כֻּלָּהּ.
- source_word: כֹּל עֹבֵר עַל בָּבֶל
  choice: Todo aquele que passar pela Babilônia
  rationale: Reproduz naturalmente a referência a qualquer viajante que passe junto à cidade arruinada.
- source_word: יִשֹּׁם
  choice: ficará horrorizado
  rationale: No qal, שׁמם descreve a reação de espanto e horror diante da devastação.
- source_word: וְיִשְׁרֹק
  choice: e assobiará[a]
  rationale: שרק pode designar assobiar ou sibilar; no contexto, o gesto comunica espanto ou escárnio diante da ruína.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: por causa de todos os seus ferimentos
  rationale: מַכָּה pode ser golpe, ferida ou praga; 'ferimentos' preserva a figura da Babilônia personificada e os efeitos do juízo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em forma transliterada.
- issue: Natureza da reação expressa por שרק
  choice: assobiará, mantendo aberta na nota a possibilidade de sibilar
  alternative: sibilará
  rationale: O verbo pode descrever assobio ou silvo e, neste oráculo de juízo, pode transmitir espanto, escárnio ou ambos; a nota evita resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A personificação feminina da Babilônia foi preservada por “ela” e “seus ferimentos”. O marcador da nota foi colocado junto a “assobiará”, termo ao qual a alternativa lexical se refere.
