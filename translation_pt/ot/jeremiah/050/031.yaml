source:
  edition: WLC
  text: הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ זָד֔וֹן נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת כִּ֛י בָּ֥א יוֹמְ/ךָ֖ עֵ֥ת פְּקַדְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/031.yaml
  text: Behold[a], I am against you, O arrogant one, declares the Lord GOD of hosts, for your day has come[b], the time when I will punish you.
translation:
  language: pt
  text: “Eis que estou contra você, ó arrogante[a]”, declara o Senhor Yahweh dos Exércitos, “pois o seu dia chegou, o tempo de eu pedir contas a você[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ó orgulhoso” ou “ó insolente”. O hebraico usa um substantivo que significa “arrogância” como nome dado à Babilônia.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o tempo em que visitei você”. Neste contexto, “visitar” significa intervir para chamar alguém a prestar contas e julgá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: Eis que estou contra você
  rationale: A construção introduz solenemente a oposição ativa de Deus em um contexto de juízo. “Eis que” conserva a força profética, e “contra você” expressa o sentido hostil do idioma.
- source_word: זָדוֹן
  choice: ó Arrogante
  rationale: O substantivo denota arrogância ou insolência e funciona aqui como designação personificada da Babilônia. A inicial maiúscula sinaliza que se trata de um título dirigido a ela.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente natural e solene da fórmula profética que apresenta uma declaração divina autorizada.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: o Senhor Yahweh dos Exércitos
  rationale: Mantém אֲדֹנָי como “Senhor”, representa explicitamente o nome divino יהוה como “Yahweh” e traduz צְבָאוֹת como “dos Exércitos”.
- source_word: כִּי בָּא יוֹמְךָ
  choice: pois o seu dia chegou
  rationale: כִּי introduz a razão da sentença, e o perfeito בָּא apresenta o dia determinado como já chegado, com certeza e imediatismo proféticos.
- source_word: עֵת פְּקַדְתִּיךָ
  choice: o tempo de eu pedir contas a você
  rationale: פקד, neste contexto judicial, significa tratar com alguém para responsabilizá-lo. “Pedir contas” comunica esse sentido sem reduzir o verbo apenas à aplicação de uma pena.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה צְבָאוֹת
  choice: o Senhor Yahweh dos Exércitos
  alternative: o Senhor DEUS dos Exércitos
  rationale: A tradução distingue o título אֲדֹנָי do nome pessoal יהוה e preserva explicitamente o nome da aliança, evitando a repetição “Senhor SENHOR”.
- issue: Sentido judicial de פקד
  choice: pedir contas a você
  alternative: punir você
  rationale: O contexto exige juízo, mas o verbo pode abranger visitação, responsabilização e punição. “Pedir contas” preserva melhor essa amplitude sem enfraquecer a ameaça.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. O tratamento por “você” torna natural a personificação direta da Babilônia; “Eis que” preserva a cadência profética tradicional sem tornar o restante do verso arcaico.
