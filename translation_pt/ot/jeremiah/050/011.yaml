source:
  edition: WLC
  text: כִּ֤י תשמחי כִּ֣י תעלזי שֹׁסֵ֖י נַחֲלָתִ֑/י כִּ֤י תפושי כְּ/עֶגְלָ֣ה דָשָׁ֔ה ו/תצהלי כָּ/אֲבִּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/011.yaml
  text: Because you rejoice[a], because you exult, plunderers of my inheritance, because you frolic like a threshing heifer and neigh like stallions[b],
translation:
  language: pt
  text: Porque te alegras[a], porque exultas, ó saqueadores da minha herança[b], porque saltitas como novilha que debulha e relinchas como garanhões,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ainda que te alegres, ainda que exultes». A partícula hebraica também pode ser entendida aqui em sentido concessivo.'
    reason: lexical_alternative
  - marker: b
    text: «Minha herança» também pode ser traduzido por «meu patrimônio» e pode se referir ao povo e/ou à terra que pertencem ao SENHOR. No hebraico, os verbos estão no singular, dirigidos à Babilônia personificada, mas «saqueadores» está no plural.
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: כִּי
  choice: porque
  rationale: O valor causal é o sentido mais direto da partícula e apresenta a conduta arrogante da Babilônia como motivo do juízo anunciado no contexto. A leitura concessiva continua possível e é registrada em nota.
- source_word: תשמחי / תעלזי
  choice: te alegras / exultas
  rationale: Os dois verbos foram mantidos distintos, preservando a intensificação poética. A segunda pessoa do singular conserva a personificação feminina de Babilônia indicada pelas formas hebraicas.
- source_word: שֹׁסֵי
  choice: saqueadores
  rationale: O particípio plural designa os que despojam ou saqueiam; «saqueadores» é claro, atual e adequado ao contexto da devastação da herança do SENHOR.
- source_word: נַחֲלָתִי
  choice: minha herança
  rationale: «Herança» conserva a noção de propriedade recebida e a ressonância da relação especial de Deus com seu povo e sua terra, sem restringir o referente a apenas um deles.
- source_word: תפושי
  choice: saltitas
  rationale: O verbo descreve movimento vivo e desenfreado. «Saltitas» mantém a imagem animal e o tom de escárnio sem recorrer a expressão excessivamente coloquial.
- source_word: כְּעֶגְלָה דָשָׁה
  choice: como novilha que debulha
  rationale: A formulação explicita de modo natural a ação agrícola da novilha que pisa o cereal para debulhá-lo, preservando a metáfora do hebraico.
- source_word: ותצהלי
  choice: e relinchas
  rationale: No paralelo com cavalos fortes, o verbo denota o relincho; esta é a equivalência portuguesa direta e vívida.
- source_word: כָּאֲבִּרִים
  choice: como garanhões
  rationale: Embora o substantivo possa significar genericamente «fortes» ou «cavalos vigorosos», o contexto do relincho favorece «garanhões», que torna a imagem clara em português.
theological_decisions:
- issue: Referente e gênero/número da segunda pessoa
  choice: Manter a segunda pessoa singular («te alegras», «exultas», «saltitas», «relinchas») como referência à Babilônia personificada, preservando ao mesmo tempo o vocativo plural «saqueadores».
  alternative: Regularizar toda a frase no plural, dirigindo-a coletivamente aos habitantes ou saqueadores da Babilônia.
  rationale: As formas verbais apresentadas no texto-fonte são femininas singulares, enquanto שֹׁסֵי é plural. A tradução conserva essa tensão gramatical e retórica em vez de uniformizá-la silenciosamente.
- issue: Valor de כִּי nas cláusulas repetidas
  choice: 'Causal: «porque».'
  alternative: 'Concessivo: «ainda que» ou «embora».'
  rationale: O sentido causal é lexicalmente direto e permite que a alegria arrogante dos saqueadores fundamente o anúncio de juízo seguinte. Como o valor concessivo é contextualmente possível, ele é indicado em nota.
translation_notes:
  register: Português atual, digno e poético, com uso de «tu» implícito para conservar inequivocamente a segunda pessoa singular do hebraico. «Novilha que debulha» comunica a antiga imagem agrícola com clareza. A discordância deliberada entre os verbos no singular e o vocativo plural reproduz a tensão formal do texto-fonte.
