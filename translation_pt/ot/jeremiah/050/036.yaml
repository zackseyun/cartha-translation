  text: A sword is against the diviners[a], and they will become fools; a sword is against her warriors[b], and they will be dismayed.
translation:
  language: pt
  text: Uma espada se volta contra os adivinhos[a], e eles se tornarão insensatos; uma espada se volta contra os guerreiros dela[b], e eles ficarão desalentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os mentirosos”. O termo hebraico também pode designar, de modo mais amplo, os que falam falsidades ou enganam; aqui, “adivinhos” se ajusta ao contexto dos prognosticadores enganadores da Babilônia.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficarão aterrorizados” ou “serão despedaçados”. O verbo hebraico pode indicar terror, desalento ou colapso.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב אֶל
  choice: A espada vem contra
  rationale: 'A fórmula profética é elíptica: literalmente, “espada contra”. A inserção de “vem” produz português natural e conserva o anúncio enérgico de juízo hostil.'
- source_word: הַבַּדִּים
  choice: os adivinhos
  rationale: O termo pode designar mentirosos ou enganadores, mas neste contexto babilônico provavelmente se refere a adivinhos que fazem prognósticos falsos; a nota preserva a alternativa lexical.
- source_word: וְנֹאָלוּ
  choice: e eles se tornarão insensatos
  rationale: A forma verbal expressa tornar-se insensato ou mostrar-se tolo. A tradução conserva o sentido resultativo sem acrescentar uma explicação interpretativa.
- source_word: גִּבּוֹרֶיהָ
  choice: os guerreiros dela
  rationale: Em contexto militar, גִּבּוֹר designa guerreiros ou homens valentes. “Guerreiros” é claro e atual; “dela” mantém a referência feminina à Babilônia.
- source_word: וָחָתּוּ
  choice: e eles ficarão aterrorizados
  rationale: חתת pode indicar terror, desalento ou colapso. O contexto de ameaça pela espada favorece uma reação de terror, preservando-se na nota a amplitude entre pavor e desmoronamento.
