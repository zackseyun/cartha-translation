translation_notes:
  register: Português moderno, digno e acessível, com paralelismo profético preservado. Emprega-se “insensatos” em vez de “tolos” para manter solenidade sem arcaísmo. A ambiguidade de הַבַּדִּים é explicitada em nota; não se acrescenta nota ao último verbo porque “aterrorizados” expressa diretamente uma de suas acepções contextualmente fortes.
