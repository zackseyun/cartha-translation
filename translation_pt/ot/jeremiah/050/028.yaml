source:
  edition: WLC
  text: ק֥וֹל נָסִ֛ים וּ/פְלֵטִ֖ים מֵ/אֶ֣רֶץ בָּבֶ֑ל לְ/הַגִּ֣יד בְּ/צִיּ֗וֹן אֶת נִקְמַת֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ נִקְמַ֖ת הֵיכָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/028.yaml
  text: The sound of fugitives and escapees from the land of Babylon[a], to declare in Zion the vengeance of Yahweh our God[c][b], the vengeance for his temple.
translation:
  language: pt
  text: O som[a] dos que fogem e dos que escaparam[b] da terra da Babilônia, para anunciar em Sião a vingança de Yahweh, nosso Deus — a vingança por seu templo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A voz dos que fogem e dos que escaparam.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dos sobreviventes”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a vingança de seu templo”; a expressão provavelmente significa vingança pelo mal feito ao templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  choice: O som
  rationale: קוֹל pode significar som, voz ou ruído. “O som” preserva a imagem auditiva e a construção nominal concisa do hebraico sem pressupor uma única pessoa falando.
- source_word: נָסִים
  choice: dos que fogem
  rationale: O particípio de נוס descreve pessoas em fuga. A formulação verbal é clara e natural em português e evita as possíveis conotações jurídicas modernas de “fugitivos”.
- source_word: וּפְלֵטִים
  choice: e dos que escaparam
  rationale: פְלֵטִים designa aqueles que conseguiram escapar ou foram livrados. A escolha mantém o contraste paralelo com os que ainda estão fugindo e não reduz o sentido à mera sobrevivência.
- source_word: מֵאֶרֶץ בָּבֶל
  choice: da terra da Babilônia
  rationale: Mantém o substantivo אֶרֶץ, explicitamente presente no hebraico, e indica a saída do território babilônico.
- source_word: לְהַגִּיד
  choice: para anunciar
  rationale: O infinitivo com לְ expressa propósito. “Anunciar” comunica uma declaração pública em Sião com naturalidade e dignidade.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: A preposição בְּ indica o lugar onde se faz o anúncio, não apenas sua direção.
- source_word: נִקְמַת
  choice: a vingança
  rationale: נְקָמָה denota vingança ou ato de retribuição. “Vingança” conserva a força judicial e punitiva do contexto, sem suavizá-la como simples “reparação” ou “vindicação”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Preserva o sufixo da primeira pessoa do plural e a confissão relacional do texto.
- source_word: נִקְמַת הֵיכָלוֹ
  choice: a vingança por seu templo
  rationale: A repetição de “vingança” é mantida. “Por seu templo” expressa em português a provável ideia de retribuição pelo mal feito ao templo, enquanto uma nota registra a construção hebraica mais literal e ambígua.
- source_word: הֵיכָלוֹ
  choice: seu templo
  rationale: Neste contexto, הֵיכָל se refere ao templo de Jerusalém. “Templo” é a designação portuguesa clara e tradicional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, sem trocá-lo por um título; “Jeová” representa uma forma tradicional posterior.
- issue: Relação entre a vingança divina e o templo
  choice: a vingança por seu templo
  alternative: a vingança de seu templo; a vingança em favor de seu templo
  rationale: O hebraico usa uma construção de genitivo que pode permanecer formalmente aberta. No contexto, ela provavelmente indica retribuição pelo que foi feito ao templo. A tradução principal comunica essa relação em português natural, e a nota preserva a formulação mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase nominal e a repetição de “vingança” conservam a força retórica do hebraico; o travessão esclarece a aposição sem transformar a estrutura em uma oração verbal inexistente no original.
