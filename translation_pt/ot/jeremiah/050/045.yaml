source:
  edition: WLC
  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל בָּבֶ֔ל וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נָוֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/045.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Babylon[a], and his thoughts that he has devised against the land of the Chaldeans: Surely the little ones of the flock will drag them away[c][b]; surely he will make their pasture desolate.'
translation:
  language: pt
  text: 'Portanto, ouçam o conselho de Yahweh, que ele formulou contra a Babilônia, e os seus desígnios, que concebeu contra a terra dos caldeus: certamente os pequenos do rebanho os arrastarão para longe[a]; certamente ele deixará desolada a morada deles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os menores do rebanho”. A expressão pode referir-se metaforicamente aos mais jovens, fracos ou menos importantes entre os atacantes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a pastagem deles”. A palavra hebraica pode significar “morada”, “habitação” ou “pastagem”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz a conclusão decorrente do oráculo anterior e corresponde naturalmente ao valor inferencial da partícula.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: Imperativo plural que mantém a convocação profética e implica atenção ao que será proclamado.
- source_word: עֲצַת יְהוָה
  choice: o conselho de Yahweh
  rationale: “Conselho” preserva o matiz deliberativo de עֵצָה, enquanto “Yahweh” representa o nome divino יהוה, em vez de substituí-lo por um título.
- source_word: יָעַץ אֶל בָּבֶל
  choice: formulou contra a Babilônia
  rationale: O verbo descreve a elaboração deliberada de um plano; no contexto hostil, אֶל tem o sentido contextual de “contra”.
- source_word: וּמַחְשְׁבוֹתָיו
  choice: e os seus desígnios
  rationale: “Desígnios” comunica pensamentos intencionais ou planos e se encaixa no paralelismo sem repetir “conselho”.
- source_word: חָשַׁב אֶל אֶרֶץ כַּשְׂדִּים
  choice: concebeu contra a terra dos caldeus
  rationale: “Concebeu” expressa a atividade mental deliberada do verbo, e “terra dos caldeus” traduz de modo transparente a expressão hebraica.
- source_word: אִם לֹא
  choice: certamente
  rationale: Nas duas ocorrências, a construção tem força asseverativa, semelhante à fórmula de juramento, e não funciona como condição literal.
- source_word: יִסְחָבוּם
  choice: os arrastarão para longe
  rationale: Mantém o sujeito plural e o objeto plural do hebraico, além da ideia vigorosa de arrastar ou levar à força.
- source_word: צְעִירֵי הַצֹּאן
  choice: os pequenos do rebanho
  rationale: Preserva a imagem hebraica e sua possível referência aos menores, mais jovens ou menos importantes do grupo, sem explicitar uma interpretação no texto.
- source_word: יַשִּׁים עֲלֵיהֶם נָוֶה
  choice: ele deixará desolada a morada deles
  rationale: A formulação portuguesa expressa o resultado causativo de desolação e entende עֲלֵיהֶם idiomaticamente como referência à morada pertencente a eles; “morada” preserva um sentido possível de נָוֶה.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: Mantém no texto o nome pessoal divino atestado pelo tetragrama, sem substituí-lo por um título.
- issue: Identidade dos “pequenos do rebanho”
  choice: Preservar a metáfora sem identificar explicitamente seus referentes
  alternative: os atacantes mais fracos ou menos importantes
  rationale: A imagem pode aludir aos membros menos importantes das forças invasoras, mas o hebraico não identifica diretamente o referente; a tradução conserva essa abertura.
- issue: Sentido de נָוֶה na oração final
  choice: morada
  alternative: pastagem
  rationale: O substantivo admite os sentidos de morada, habitação ou pastagem. “Morada” funciona bem no contexto da devastação territorial, enquanto a alternativa concreta é registrada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas verbais naturais no plural. O paralelismo poético foi preservado, assim como a repetição enfática de “certamente”. “Terra dos caldeus” mantém a designação histórica transparente, e as ambiguidades da metáfora e da oração final são registradas em notas.
