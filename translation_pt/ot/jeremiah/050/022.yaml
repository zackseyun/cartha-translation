  yaml_path: translation/ot/jeremiah/050/022.yaml
  text: The sound of war is in the land[a], and great destruction.
translation:
  language: pt
  text: Som de guerra na terra[a], e grande destruição!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Há som de guerra na terra e um grande estrondo”. O substantivo hebraico שֶׁבֶר pode ter o sentido de “quebra”, “estrondo” ou “ruína”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Som de
  rationale: O substantivo pode significar som, ruído ou voz. Neste contexto bélico, “som” comunica com naturalidade aquilo que se ouve, sem personificação. A construção nominal e exclamativa do hebraico dispensa o artigo em português.
- source_word: מִלְחָמָה
  choice: guerra
  rationale: O termo abrange guerra e batalha; “guerra” preserva o sentido amplo e combina naturalmente com a devastação anunciada.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode designar terra, país ou território. No oráculo contra a Babilônia, “na terra” refere-se naturalmente ao território em questão, não ao planeta inteiro.
- source_word: וְשֶׁבֶר
  choice: e grande destruição
  rationale: שֶׁבֶר deriva da ideia de quebrar e pode indicar fratura, estrondo, ruína ou destruição. Neste contexto profético de juízo, “destruição” expressa com clareza o resultado devastador, enquanto a nota preserva a alternativa sonora e concreta.
- source_word: גָּדוֹל
  choice: grande
  rationale: Tradução direta e idiomática do adjetivo, que intensifica a destruição.
