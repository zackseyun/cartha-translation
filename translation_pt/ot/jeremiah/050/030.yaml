  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתָּ֥/הּ יִדַּ֛מּוּ בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/030.yaml
  text: Therefore her young men will fall in her streets[a], and all her warriors will be silenced on that day, declares Yahweh.
translation:
  language: pt
  text: Por isso, seus jovens cairão em suas ruas, e todos os seus guerreiros serão silenciados[a] naquele dia — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perecerão”. O verbo hebraico pode significar “ficar em silêncio” ou “ficar imóvel” e, neste contexto, pode implicar morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente, em português atual, a consequência do juízo anunciado anteriormente.
- source_word: יִפְּלוּ
  choice: cairão
  rationale: Preserva a imagem literal de נפל e, no contexto militar, permite entender a morte sem explicitá-la além do hebraico.
- source_word: בַחוּרֶיהָ
  choice: os jovens dela
  rationale: בחור designa jovens no vigor da idade, aqui provavelmente aptos para a guerra; a formulação evita acrescentar explicitamente uma função militar.
- source_word: בִּרְחֹבֹתֶיהָ
  choice: em suas ruas
  rationale: רחובות pode indicar ruas largas ou praças; 'ruas' é natural e adequado à cena urbana.
- source_word: אַנְשֵׁי מִלְחַמְתָּהּ
  choice: seus guerreiros
  rationale: Expressa de modo conciso e natural a construção literal 'homens de sua guerra'.
- source_word: יִדַּמּוּ
  choice: serão silenciados
  rationale: Preserva a imagem de ficar em silêncio ou imóvel, ao mesmo tempo que o contexto permite a implicação de morte.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: É a forma idiomática em português para a expressão temporal profética.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética de afirmação solene e conserva o nome divino presente no texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; 'Yahweh' conserva o nome pessoal e evita convertê-lo em título.
- issue: Se o sentido de morte em יִדַּמּוּ deve ser explicitado
  choice: serão silenciados
  alternative: perecerão
  rationale: O verbo admite a imagem de serem calados ou imobilizados, enquanto o contexto de juízo militar sugere morte. O texto principal preserva essa tensão, e a nota registra a leitura explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a imagem concreta de 'cairão' e a ambiguidade de 'serão silenciados'. O travessão distingue naturalmente a fórmula profética final.
