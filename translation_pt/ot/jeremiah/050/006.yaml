source:
  edition: WLC
  text: צֹ֤אן אֹֽבְדוֹת֙ היה עַמִּ֔/י רֹעֵי/הֶ֣ם הִתְע֔וּ/ם הָרִ֖ים שובבים מֵ/הַ֤ר אֶל גִּבְעָה֙ הָלָ֔כוּ שָׁכְח֖וּ רִבְצָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/006.yaml
  text: My people have been lost sheep[a]; their shepherds have led them astray, turning them away on the mountains. They have gone from mountain to hill[b]; they have forgotten their resting place.
translation:
  language: pt
  text: Meu povo tem sido como ovelhas perdidas; seus pastores as desencaminharam, desviando-as pelos montes.[a] Elas foram de monte a colina[b] e se esqueceram do seu lugar de repouso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta expressão é difícil. Mais formalmente, pode ser entendido como: “seus pastores as desencaminharam; os montes as fizeram vaguear”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “de monte a colina” também pode evocar o percurso de Israel pelos lugares altos, frequentemente associados em Jeremias à apostasia.
    reason: cross_reference
lexical_decisions:
- source_word: צֹאן אֹבְדוֹת
  choice: como ovelhas perdidas
  rationale: צֹאן é um coletivo para rebanho ou animais de pequeno porte, enquanto o particípio feminino plural אֹבְדוֹת destaca as ovelhas. A formulação portuguesa preserva a imagem pastoral e o sentido de estarem perdidas, sem sugerir necessariamente destruição definitiva.
- source_word: היה עַמִּי
  choice: o meu povo era
  rationale: A construção predicativa com היה apresenta a condição do povo. O pretérito imperfeito é natural em português neste contexto profético e não acrescenta uma mudança de estado que o hebraico não exprime.
- source_word: רֹעֵיהֶם
  choice: seus pastores
  rationale: Mantém a metáfora pastoral usada para os dirigentes do povo; “líderes” tornaria a imagem menos nítida.
- source_word: הִתְעוּם
  choice: as desencaminharam
  rationale: 'O hifil de תעה é causativo: os pastores fizeram as ovelhas errar ou sair do caminho. “Desencaminharam” preserva tanto a ação quanto a responsabilidade dos pastores.'
- source_word: הָרִים שובבים
  choice: desviando-as pelos montes
  rationale: A sintaxe e a função de שובבים são difíceis. A tradução comunica o movimento errante no cenário dos montes sem apresentar como inequívoca uma análise gramatical disputada.
- source_word: מֵהַר אֶל גִּבְעָה הָלָכוּ
  choice: Elas foram de monte em colina
  rationale: “Foram” traduz הָלָכוּ sem repetir interpretativamente a ideia de vaguear; “de monte em colina” conserva o movimento sucessivo e permite que uma possível alusão aos lugares altos permaneça implícita.
- source_word: שָׁכְחוּ רִבְצָם
  choice: se esqueceram do seu lugar de repouso
  rationale: רִבְצָם designa o lugar onde os animais se deitam ou descansam. “Lugar de repouso” é claro e mantém a imagem, sem especificar indevidamente um aprisco ou pasto.
theological_decisions:
- issue: Possível alusão à idolatria nos montes e colinas
  choice: Manter a linguagem geográfica e pastoral no texto principal.
  alternative: Explicitar no texto que o povo vagueou por lugares altos de culto idólatra.
  rationale: Em Jeremias, montes e colinas podem evocar apostasia, mas a imagem imediata é a de ovelhas desencaminhadas. A tradução conserva a possível alusão sem transformá-la em afirmação explícita.
- issue: Sentido e ligação sintática de שובבים
  choice: 'Expressar contextualmente o desvio das ovelhas: “desviando-as pelos montes”.'
  alternative: Entender a expressão mais formalmente como “os montes as fizeram vaguear” ou como referência a “montes desviantes/rebeldes”.
  rationale: A forma hebraica é difícil e admite análises diferentes. A opção principal preserva a ação errante no contexto pastoral, enquanto a nota registra a dificuldade e evita apresentar uma reconstrução como certa.
translation_notes:
  register: Português atual, digno e de leitura natural, com vocabulário pastoral transparente. “Colina” foi preferido a “outeiro” por ser mais amplamente compreendido, e a ambiguidade da frase hebraica central foi preservada por meio de nota.
