  naturalness: A redação revista é moderna, clara e adequada ao registro profético. «Meu povo» é mais fluente que «O meu povo», e «de monte a colina» é uma formulação natural e precisa.
  terminology: «Ovelhas perdidas», «pastores», «desencaminharam» e «lugar de repouso» mantêm coerentemente a metáfora pastoral. A nota conserva a dificuldade de שובבים, sem apresentar a leitura alternativa como certa.
