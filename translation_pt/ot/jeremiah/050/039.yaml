  text: לָ/כֵ֗ן יֵשְׁב֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/יָ֥שְׁבוּ בָ֖/הּ בְּנ֣וֹת יַֽעֲנָ֑ה וְ/לֹֽא תֵשֵׁ֥ב עוֹד֙ לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכּ֖וֹן עַד דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/039.yaml
  text: Therefore desert creatures will dwell there with hyenas[a], and ostriches will dwell in her; she will never again be inhabited forever[c][b], nor will she be lived in from generation to generation.
translation:
  language: pt
  text: Por isso, criaturas do deserto habitarão ali com hienas[a], e avestruzes[b] habitarão nela; ela[c] jamais voltará a ser habitada e permanecerá desabitada para sempre, nem terá moradores de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chacais” ou “criaturas que uivam”; é incerta a identificação exata dos termos hebraicos para esses animais do deserto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “filhas do avestruz”, isto é, avestruzes. Algumas traduções antigas trazem “corujas”.
    reason: lexical_alternative
  - marker: c
    text: 'A cidade é personificada no feminino em hebraico: “nela” e “ela jamais voltará a ser habitada”.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz de maneira natural a consequência do juízo anunciado contra a Babilônia.
- source_word: צִיִּים
  choice: criaturas do deserto
  rationale: Designação genérica adequada para animais ligados a regiões desertas e ruínas, cuja identificação zoológica exata é incerta.
- source_word: אֶת אִיִּים
  choice: com hienas
  rationale: אֶת tem aqui sentido associativo, e אִיִּים provavelmente designa animais selvagens que uivam e frequentam ruínas; “hienas” é uma proposta plausível, com alternativas registradas em nota.
- source_word: בְּנוֹת יַעֲנָה
  choice: avestruzes
  rationale: O idiomatismo hebraico, literalmente “filhas do avestruz”, refere-se a avestruzes; a tradução direta do referente é mais clara em português.
- source_word: בָהּ
  choice: nela
  rationale: Mantém o pronome feminino singular, que retoma a cidade da Babilônia personificada.
- source_word: לֹא תֵשֵׁב עוֹד לָנֶצַח
  choice: ela nunca mais será habitada, para sempre
  rationale: Preserva tanto a negação “nunca mais” quanto לָנֶצַח, que enfatiza a permanência da desolação, ainda que a formulação tenha repetição enfática.
- source_word: לֹא תִשְׁכּוֹן
  choice: nem terá moradores
  rationale: Expressa em português corrente que ninguém residirá na cidade, evitando uma construção passiva pouco natural.
- source_word: עַד דּוֹר וָדוֹר
  choice: de geração em geração
  rationale: Equivalente idiomático natural para a duração contínua através das gerações sucessivas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça junto ao termo correspondente. A repetição enfática em “nunca mais... para sempre” foi mantida para representar os dois elementos do hebraico.
