source:
  edition: WLC
  text: כָּל מוֹצְאֵי/הֶ֣ם אֲכָל֔וּ/ם וְ/צָרֵי/הֶ֥ם אָמְר֖וּ לֹ֣א נֶאְשָׁ֑ם תַּ֗חַת אֲשֶׁ֨ר חָטְא֤וּ לַֽ/יהוָה֙ נְוֵה צֶ֔דֶק וּ/מִקְוֵ֥ה אֲבֽוֹתֵי/הֶ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/007.yaml
  text: All who found them devoured them[a], and their adversaries said, “We are not guilty, because they sinned against Yahweh, the habitation of righteousness[b], the hope of their fathers—Yahweh.”
translation:
  language: pt
  text: 'Todos os que os encontraram os devoraram, e seus adversários disseram: “Não somos culpados, pois eles pecaram contra Yahweh, a morada da justiça[a], a esperança de seus antepassados[b] — Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pastagem da justiça”. O termo hebraico também pode indicar pastagem, habitação ou morada.
    reason: lexical_alternative
  - marker: b
    text: Ou “a expectativa de seus antepassados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצְאֵיהֶם
  choice: os que os encontravam
  rationale: O particípio substantivado designa todos os que davam com eles; o imperfeito em português expressa naturalmente a ação recorrente no contexto.
- source_word: אֲכָלוּם
  choice: os devoravam
  rationale: Mantém a imagem predatória do verbo hebraico, empregado metaforicamente para destruição e conquista.
- source_word: צָרֵיהֶם
  choice: seus adversários
  rationale: Expressa hostilidade sem restringir o referente exclusivamente a inimigos militares.
- source_word: לֹא נֶאְשָׁם
  choice: Não somos culpados
  rationale: Reproduz de modo claro e direto a alegação de ausência de culpa feita pelos adversários.
- source_word: תַּחַת אֲשֶׁר
  choice: pois
  rationale: 'Comunica a relação causal: o pecado do povo é apresentado pelos adversários como justificativa para sua própria conduta.'
- source_word: חָטְאוּ לַיהוָה
  choice: pecaram contra Yahweh
  rationale: A preposição ל com חטא indica aqui a pessoa contra quem o pecado foi cometido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נְוֵה צֶדֶק
  choice: a morada da justiça
  rationale: נְוֵה pode indicar morada ou pastagem. 'Morada da justiça' funciona naturalmente como título em aposição a Yahweh, enquanto a nota preserva a possível imagem pastoril.
- source_word: מִקְוֵה אֲבוֹתֵיהֶם
  choice: a esperança de seus antepassados
  rationale: מִקְוֵה denota aqui esperança ou expectativa; 'antepassados' é mais abrangente e natural no português atual do que 'pais' neste contexto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o nome divino; a transliteração preserva seu caráter de nome próprio.
- issue: Relação sintática de נְוֵה צֶדֶק וּמִקְוֵה אֲבוֹתֵיהֶם com יהוה
  choice: As duas expressões são títulos em aposição a Yahweh.
  alternative: Entender נְוֵה צֶדֶק como referência à terra, ao redil ou à habitação de Israel.
  rationale: A sequência após 'pecaram contra Yahweh' e a repetição final de יהוה favorecem a leitura das duas expressões como designações do próprio Yahweh, sem eliminar a ressonância pastoril de נְוֵה.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição final de “Yahweh” e a tensão entre a imagem de morada e a de pastagem foram preservadas.
