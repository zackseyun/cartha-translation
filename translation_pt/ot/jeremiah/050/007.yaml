  naturalness: O português é claro, moderno e de registro apropriado. O pretérito perfeito torna a sequência narrativa mais direta e mais próxima do hebraico, sem sacrificar a fluência.
  terminology: «Yahweh», «adversários», «morada da justiça» e «esperança de seus antepassados» são escolhas defensáveis. A nota em a preserva corretamente a alternativa pastoril de נְוֵה; a nota em b registra a alternativa lexical pertinente para מִקְוֵה.
