  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤עָה ארוצ/ם מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יוֹעִדֶ֔/נִּי וּ/מִֽי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/044.yaml
  text: Look[a], like a lion he comes up from the thicket of the Jordan against a secure pasture; for in an instant I will make them run from it, and I will appoint over it whoever is chosen. For who is like me[c][b], and who can summon me? What shepherd can stand before me?
translation:
  language: pt
  text: Eis que,[a] como um leão, ele sobe dos matagais do Jordão contra uma pastagem segura. Pois, num instante, farei que eles fujam dali[b] e porei sobre ela quem for escolhido. Pois quem é semelhante a mim? Quem pode me convocar[c]? E que pastor poderá permanecer diante de mim?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do orgulho do Jordão”; a expressão provavelmente se refere à vegetação densa e exuberante das margens do Jordão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu os expulsarei dali”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Quem pode marcar comigo uma audiência?” O hebraico também pode ter o sentido de fixar um momento de encontro ou intimar alguém a comparecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Marcador discursivo que introduz uma cena profética vívida; o plural inclusivo soa natural em português moderno e preserva a força de chamar a atenção.
- source_word: כְּאַרְיֵה
  choice: Como um leão
  rationale: Mantém diretamente a comparação do hebraico.
- source_word: יַעֲלֶה
  choice: ele sobe
  rationale: Preserva o sentido básico de עלה e o presente vívido da imagem profética.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: dos matagais do Jordão
  rationale: No contexto do Jordão, a expressão designa provavelmente a vegetação densa e exuberante de suas margens, habitat apropriado para o leão da imagem.
- source_word: אֶל נְוֵה אֵיתָן
  choice: contra uma pastagem segura
  rationale: נוה pode indicar pastagem ou morada de rebanhos, e אֵיתָן comunica firmeza ou segurança; 'contra' expressa a aproximação hostil sugerida pelo contexto.
- source_word: כִּי אַרְגִּיעָה
  choice: Pois, num instante
  rationale: Expressa a rapidez ou subitaneidade indicada pela forma verbal ligada a רגע.
- source_word: ארוצם
  choice: farei que eles fujam
  rationale: Conserva o núcleo semântico de רוץ, 'correr', com valor causativo adequado ao contexto.
- source_word: מֵעָלֶיהָ
  choice: dali
  rationale: Retoma naturalmente em português o lugar de onde eles serão expulsos, sem forçar o gênero feminino do sufixo hebraico.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: e porei sobre ela aquele que for escolhido
  rationale: Reflete a sintaxe condensada, preserva a nuance de escolha em בָחוּר e o sentido contextual de designar ou colocar de פקד.
- source_word: כִּי מִי כָמוֹנִי
  choice: Pois quem é semelhante a mim?
  rationale: Mantém formalmente a pergunta retórica sobre a incomparabilidade divina.
- source_word: וּמִי יוֹעִדֶנִּי
  choice: Quem pode me convocar?
  rationale: יעד no hifil pode significar marcar, designar ou convocar; esta formulação preserva a ideia de alguém pretender chamar Deus a comparecer ou prestar contas.
- source_word: וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: E que pastor poderá permanecer diante de mim?
  rationale: Conserva a imagem pastoral e a expressão 'permanecer diante de', que no contexto implica resistir ou enfrentar com êxito.
theological_decisions:
- issue: Referente da imagem do leão e transição para a fala divina em primeira pessoa
  choice: Preservar a passagem de 'ele sobe' para 'farei... porei... mim', sem identificar explicitamente o leão.
  alternative: Identificar o leão diretamente como o governante invasor ou diretamente como o SENHOR.
  rationale: O hebraico mantém uma tensão entre a figura invasora em terceira pessoa e a declaração soberana de Deus em primeira pessoa. A tradução não deve resolver além do que o texto afirma.
- issue: Força da pergunta וּמִי יוֹעִדֶנִּי
  choice: Quem pode me convocar?
  alternative: Quem pode marcar comigo uma audiência? / Quem pode me intimar a comparecer?
  rationale: A escolha mantém a linguagem de desafio judicial ou de comparecimento sem limitar o verbo a uma única reconstrução teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A redação conserva as imagens do leão, da pastagem e do pastor, bem como a mudança deliberada da terceira para a primeira pessoa. Todos os marcadores de nota aparecem no texto principal.
