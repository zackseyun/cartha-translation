revisions:
- from: Vejam![a] Como um leão, ele sobe dos matagais do Jordão contra uma pastagem segura. Pois, num instante, farei que eles fujam dali[b] e porei sobre ela aquele que for escolhido. Pois quem é semelhante a mim? Quem pode me convocar[c]? E que pastor poderá permanecer diante de mim?
  to: Eis que,[a] como um leão, ele sobe dos matagais do Jordão contra uma pastagem segura. Pois, num instante, farei que eles fujam dali[b] e porei sobre ela quem for escolhido. Pois quem é semelhante a mim? Quem pode me convocar[c]? E que pastor poderá permanecer diante de mim?
  rationale: A revisão substitui o imperativo plural “Vejam!” pelo apresentativo “Eis que”, mais fiel à função de הִנֵּה. Também simplifica “aquele que for escolhido” para “quem for escolhido”, preservando a construção indefinida e condensada do hebraico sem alterar o sentido. As notas e respectivos marcadores permanecem completos e corretamente ancorados.
