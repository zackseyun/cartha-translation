  text: הִנֵּ֛ה עַ֥ם בָּ֖א מִ/צָּפ֑וֹן וְ/ג֤וֹי גָּדוֹל֙ וּ/מְלָכִ֣ים רַבִּ֔ים יֵעֹ֖רוּ מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/041.yaml
  text: Behold[a], a people is coming from the north[b], and a great nation and many kings will be stirred up from the farthest parts of the earth.
translation:
  language: pt
  text: Eis que um povo vem do norte; uma grande nação e muitos reis serão mobilizados[a] desde as regiões mais distantes da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «serão despertados» ou «serão postos em ação»; o verbo hebraico indica que serão despertados ou mobilizados para agir.
    reason: lexical_alternative
  - marker: b
    text: Ou «desde os confins da terra» ou «desde as partes remotas da terra».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Marca discursiva que chama a atenção para o anúncio e preserva o tom profético elevado em português atual.
- source_word: עַם
  choice: um povo
  rationale: Mantém o sentido comum de grupo humano e preserva a distinção em relação a גּוֹי גָּדוֹל, traduzido como «uma grande nação».
- source_word: בָּא
  choice: vem
  rationale: O perfeito depois de הִנֵּה tem força vívida e iminente no discurso profético; o presente português comunica essa chegada como já em curso.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Tradução direcional direta e natural.
- source_word: גּוֹי גָּדוֹל
  choice: uma grande nação
  rationale: Expressa uma coletividade de caráter nacional ou político e evita fundi-la com o anterior עַם, «povo».
- source_word: וּמְלָכִים רַבִּים
  choice: e muitos reis
  rationale: Reproduz de modo claro a coordenação e a pluralidade de governantes.
- source_word: יֵעֹרוּ
  choice: serão mobilizados
  rationale: O nifal indica que a grande nação e os muitos reis serão despertados ou postos em ação; «mobilizados» conserva a passividade e comunica naturalmente o provável contexto militar.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: desde as regiões mais distantes da terra
  rationale: A expressão designa partes remotas ou extremidades da terra; esta formulação preserva a ideia espacial sem impor uma imagem excessivamente literal.
