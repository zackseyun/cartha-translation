id: JER.50.27
reference: Jeremiah 50:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חִרְבוּ֙ כָּל פָּרֶ֔י/הָ יֵרְד֖וּ לַ/טָּ֑בַח ה֣וֹי עֲלֵי/הֶ֔ם כִּֽי בָ֥א יוֹמָ֖/ם עֵ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/027.yaml
  text: Slay all her bulls; let them go down to the slaughter. Woe to them[a], for their day has come, the time of their punishment.
translation:
  language: pt
  text: Matem todos os seus novilhos; que desçam para o abate. Ai deles, pois chegou o seu dia, o tempo do seu castigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tempo da sua visitação” ou “da sua prestação de contas”. O termo hebraico pode indicar visitação, supervisão ou acerto de contas; aqui, refere-se a uma visitação para juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְבוּ
  choice: Matem
  rationale: O imperativo causativo, seguido pela imagem do abate, exige uma expressão violenta explícita. “Matem” é direto, atual e natural em português.
- source_word: כָּל פָּרֶיהָ
  choice: todos os seus novilhos
  rationale: פָּרִים designa bovinos jovens. “Novilhos” preserva a metáfora animal aplicada aos poderosos da Babilônia sem substituí-la por uma interpretação.
- source_word: יֵרְדוּ לַטָּבַח
  choice: que desçam para o abate
  rationale: A forma verbal pode ser entendida como jussiva após o imperativo. A tradução conserva tanto o movimento de descida quanto a imagem concreta do abate.
- source_word: הוֹי עֲלֵיהֶם
  choice: Ai deles
  rationale: Expressão profética natural e solene em português, capaz de comunicar lamento e anúncio de juízo.
- source_word: כִּי בָא יוֹמָם
  choice: pois chegou o seu dia
  rationale: O perfeito apresenta o dia designado como já chegado; “o seu dia” preserva o caráter ominoso e conciso do hebraico.
- source_word: עֵת פְּקֻדָּתָם
  choice: o tempo do seu castigo
  rationale: Neste oráculo de juízo, פְּקֻדָּה tem sentido punitivo. “Castigo” comunica esse sentido com clareza, enquanto a amplitude lexical é registrada em nota.
theological_decisions:
- issue: Sentido de פְּקֻדָּה no anúncio do juízo
  choice: castigo
  alternative: visitação; prestação de contas
  rationale: O contexto anuncia o juízo contra a Babilônia, favorecendo o sentido punitivo. A nota preserva a amplitude do termo hebraico sem tornar opaco o texto principal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A metáfora dos novilhos e a construção jussiva foram preservadas; evitou-se linguagem excessivamente arcaica.
