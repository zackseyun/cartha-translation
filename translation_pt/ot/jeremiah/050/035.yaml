  text: חֶ֥רֶב עַל כַּשְׂדִּ֖ים נְאֻם יְהוָ֑ה וְ/אֶל יֹשְׁבֵ֣י בָבֶ֔ל וְ/אֶל שָׂרֶ֖י/הָ וְ/אֶל חֲכָמֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/035.yaml
  text: A sword is against the Chaldeans[a], declares Yahweh, and against the inhabitants of Babylon, and against her officials[b], and against her wise men.
translation:
  language: pt
  text: A espada está contra os caldeus[a] — declara Yahweh — e contra os habitantes da Babilônia, contra os seus oficiais[b] e contra os seus sábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os babilônios”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os seus príncipes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב עַל
  choice: A espada vem contra
  rationale: A oração hebraica é nominal e anuncia profeticamente a guerra ou o juízo. Em português, “vem contra” torna explícita de modo natural a direção hostil de עַל sem identificar uma espada específica.
- source_word: כַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva o etnônimo específico do hebraico e sua nuance histórico-étnica; no contexto, ele designa os babilônios.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com clareza e solenidade a fórmula profética, mantendo o nome divino pessoal.
- source_word: וְאֶל
  choice: contra
  rationale: Embora אֶל costume significar “a” ou “para”, aqui continua a direção hostil introduzida por “espada contra” na lista paralela.
- source_word: יֹשְׁבֵי בָבֶל
  choice: os habitantes da Babilônia
  rationale: Expressão portuguesa corrente para o particípio substantivado “os que habitam na Babilônia”.
- source_word: שָׂרֶיהָ
  choice: os seus oficiais
  rationale: שׂרים pode designar príncipes, governantes ou autoridades. “Oficiais” comunica o grupo político-administrativo sem sugerir necessariamente filhos do rei.
- source_word: חֲכָמֶיהָ
  choice: os seus sábios
  rationale: Tradução direta que preserva a referência à classe instruída e conselheira pela qual a Babilônia era conhecida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, em vez de substituí-lo por um título.
- issue: Valor imagético de חֶרֶב
  choice: espada, como anúncio de guerra e juízo
  alternative: guerra; destruição
  rationale: Mantém a imagem concreta e a tensão profética do original, sem reduzi-la a uma interpretação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “A espada vem contra” conserva a imagem profética e evita a rigidez pouco natural de uma oração nominal. Os travessões destacam a fórmula profética sem alterar a sequência do hebraico.
