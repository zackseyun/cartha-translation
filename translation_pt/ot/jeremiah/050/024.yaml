  text: יָקֹ֨שְׁתִּי לָ֤/ךְ וְ/גַם נִלְכַּדְתְּ֙ בָּבֶ֔ל וְ/אַ֖תְּ לֹ֣א יָדָ֑עַתְּ נִמְצֵאת֙ וְ/גַם נִתְפַּ֔שְׂתְּ כִּ֥י בַֽ/יהוָ֖ה הִתְגָּרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/024.yaml
  text: I set a trap for you[a], and you also were caught, Babylon, and you did not know it; you were found and also seized[c][b], because you contended against Yahweh.
translation:
  language: pt
  text: Armei uma armadilha para você[a], e você também foi apanhada, Babilônia, sem saber disso; você foi descoberta e também capturada[b], porque contendeu contra Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Preparei um laço para você”.'
    reason: Alternativa lexical que preserva a imagem concreta de יקשׁ.
  - marker: b
    text: 'Ou: “você foi encontrada e agarrada”; os dois verbos intensificam a descrição da queda de Babilônia.'
    reason: Alternativas lexicais para נִמְצֵאת e נִתְפַּשְׂתְּ e esclarecimento de sua combinação enfática.
  - marker: c
    text: 'Ou, segundo a representação tradicional do nome divino: “o SENHOR”.'
    reason: Alternativa convencional para representar יהוה.
lexical_decisions:
- source_word: יָקֹשְׁתִּי לָךְ
  choice: Armei uma armadilha para você
  rationale: O verbo יקשׁ descreve a ação concreta de preparar uma armadilha ou laço. A formulação é natural em português e preserva a metáfora, em vez de substituí-la diretamente por “apanhei você”.
- source_word: וְגַם נִלְכַּדְתְּ
  choice: e você também foi apanhada
  rationale: נלכד denota ser apanhado ou capturado; “apanhada” retoma naturalmente a imagem da armadilha. O feminino preserva a personificação de Babilônia indicada pelas formas verbais hebraicas.
- source_word: וְאַתְּ לֹא יָדָעַתְּ
  choice: sem saber disso
  rationale: O hebraico não expressa o objeto de “saber”. “Disso” explicita apenas a referência implícita à armadilha e à captura, enquanto a construção com “sem” torna a frase corrente em português.
- source_word: נִמְצֵאת וְגַם נִתְפַּשְׂתְּ
  choice: você foi descoberta e também capturada
  rationale: 'Os dois passivos formam uma progressão: Babilônia é localizada ou exposta e, em seguida, tomada. “Descoberta” e “capturada” conservam a distinção sem produzir repetição artificial.'
- source_word: הִתְגָּרִית
  choice: contendeu contra
  rationale: O hitpael de גרה comunica entrar em confronto, desafiar ou contender contra alguém. “Contendeu contra” preserva o sentido adversativo e o registro solene sem acrescentar uma nuance emocional não expressa.
- source_word: בַיהוָה
  choice: contra Yahweh
  rationale: A preposição ב, neste uso com התגרה, marca aquele contra quem Babilônia contendeu. O nome divino יהוה é representado por “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva a condição de nome próprio; “o SENHOR” é a representação tradicional baseada na leitura substitutiva.
- issue: Agência e culpa na queda de Babilônia
  choice: Deus arma a cilada, enquanto a captura é explicada pela contenda de Babilônia contra Yahweh
  alternative: Explicitar a captura como simples punição judicial
  rationale: A tradução conserva lado a lado a iniciativa divina e a ação culpável de Babilônia, sem desenvolver além do texto como essas duas afirmações se relacionam.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O tratamento por “você” mantém a interpelação direta; as formas femininas refletem Babilônia como cidade personificada. A sintaxe foi levemente ajustada para fluidez, sem eliminar a progressão da armadilha à descoberta e captura.
