source:
  edition: WLC
  text: שָׁמַ֧ע מֶֽלֶךְ בָּבֶ֛ל אֶת שִׁמְעָ֖/ם וְ/רָפ֣וּ יָדָ֑י/ו צָרָה֙ הֶחֱזִיקַ֔תְ/הוּ חִ֖יל כַּ/יּוֹלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/043.yaml
  text: The king of Babylon has heard the report about them[a], and his hands have gone limp; distress has seized him, anguish like a woman in labor.
translation:
  language: pt
  text: O rei da Babilônia ouviu a notícia a respeito deles[a], e suas mãos perderam as forças. A aflição se apoderou dele, uma angústia como a de uma mulher em trabalho de parto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a notícia sobre eles”. A expressão hebraica pode ser traduzida mais literalmente como “a notícia deles”, mas, no contexto, refere-se à notícia a respeito da força invasora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: ouviu
  rationale: O qal perfeito indica uma ação concluída; em português, o pretérito perfeito comunica naturalmente que o rei recebeu a notícia e agora reage a ela.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: A cadeia construta identifica diretamente o governante da Babilônia; o artigo definido é natural e necessário em português.
- source_word: שִׁמְעָם
  choice: a notícia a respeito deles
  rationale: O substantivo pode significar notícia ou relato, e o sufixo de terceira pessoa masculina plural indica aqui a notícia acerca da força inimiga que se aproxima, não necessariamente uma notícia proveniente dela.
- source_word: וְרָפוּ יָדָיו
  choice: e suas mãos perderam as forças
  rationale: Preserva a imagem corporal do hebraico e expressa de modo corrente o enfraquecimento e a perda de coragem.
- source_word: צָרָה
  choice: a aflição
  rationale: O termo denota aperto, sofrimento ou angústia; 'aflição' se ajusta ao paralelismo sem repetir o vocábulo escolhido para חִיל.
- source_word: הֶחֱזִיקַתְהוּ
  choice: se apoderou dele
  rationale: O hifil de חזק tem aqui o sentido de agarrar ou dominar; a formulação portuguesa transmite que a aflição o subjugou.
- source_word: חִיל
  choice: uma angústia
  rationale: No contexto, designa dor convulsiva ou aflição intensa, esclarecida pela comparação com o parto. 'Angústia' mantém a força sem antecipar excessivamente a imagem seguinte.
- source_word: כַּיּוֹלֵדָה
  choice: como a de uma mulher em trabalho de parto
  rationale: A forma participial feminina com כְּ compara sua angústia à experimentada por uma mulher que está dando à luz; 'em trabalho de parto' é atual, claro e digno.
