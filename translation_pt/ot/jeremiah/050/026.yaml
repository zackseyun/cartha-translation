  text: בֹּֽאוּ לָ֤/הּ מִ/קֵּץ֙ פִּתְח֣וּ מַאֲבֻסֶ֔י/הָ סָלּ֥וּ/הָ כְמוֹ עֲרֵמִ֖ים וְ/הַחֲרִימ֑וּ/הָ אַל תְּהִי לָ֖/הּ שְׁאֵרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/026.yaml
  text: Come against her from the farthest border[a]; open her storehouses; pile her up like heaps, and devote her to destruction[c][b]; let no remnant remain to her.
translation:
  language: pt
  text: Venham contra ela desde os confins[a]; abram os seus depósitos[b]; amontoem-na como montões e consagrem-na à destruição[c]; que não lhe reste remanescente algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde a extremidade” ou “desde o fim”. A expressão hebraica pode indicar as regiões mais distantes da terra.
    reason: lexical_alternative
  - marker: b
    text: Ou “celeiros”, “estábulos” ou “cochos”. O termo hebraico pode designar literalmente lugares de alimentação e, por extensão neste contexto, lugares onde se guardam provisões.
    reason: lexical_alternative
  - marker: c
    text: O hebraico emprega um termo associado a colocar algo sob interdição, destinando-o à destruição total.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ לָהּ
  choice: Venham contra ela
  rationale: O imperativo plural convoca forças invasoras, e a preposição ל recebe sentido adversativo neste contexto militar.
- source_word: מִקֵּץ
  choice: desde os confins
  rationale: קֵץ significa literalmente “fim” ou “extremidade”; o plural idiomático “confins” comunica as regiões mais distantes sem especificar além do hebraico.
- source_word: מַאֲבֻסֶיהָ
  choice: os seus depósitos
  rationale: Embora o substantivo possa designar cochos ou manjedouras, aqui provavelmente se refere, por extensão, a lugares onde provisões ou bens eram armazenados.
- source_word: סָלּוּהָ כְמוֹ עֲרֵמִים
  choice: amontoem-na como montões
  rationale: Mantém a imagem enfática e algo abrupta do hebraico, sem decidir se o objeto visualizado é a própria Babilônia ou o conteúdo saqueado de seus depósitos.
- source_word: וְהַחֲרִימוּהָ
  choice: e consagrem-na à destruição
  rationale: Preserva a força técnica de חרם, que indica colocar algo sob interdição e destiná-lo totalmente à destruição, em vez de reduzi-lo ao simples verbo “destruir”.
- source_word: אַל תְּהִי לָהּ שְׁאֵרִית
  choice: que não lhe reste remanescente algum
  rationale: Conserva o substantivo profético “remanescente” e expressa naturalmente a totalidade do juízo.
theological_decisions:
- issue: Sentido de החרים no oráculo de juízo
  choice: consagrem-na à destruição
  alternative: destruam-na por completo; coloquem-na sob interdição
  rationale: A formulação retém as conotações judiciais e sacrais do termo hebraico sem inserir uma explicação doutrinária no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Confins” e “remanescente” preservam o registro profético; a construção incomum “amontoem-na como montões” conserva deliberadamente a imagem e a ambiguidade do original.
