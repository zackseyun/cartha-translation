  text: הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל בָּבֶ֖ל אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/001.yaml
  text: 'The word that Yahweh spoke concerning Babylon[a], concerning the land of the Chaldeans[b], by the hand of Jeremiah the prophet:'
translation:
  language: pt
  text: 'A palavra que Yahweh falou a respeito da Babilônia[a], a respeito da terra dos caldeus, por meio do profeta Jeremias:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra a Babilônia, contra a terra dos caldeus”. A preposição hebraica pode introduzir um oráculo dirigido contra uma nação, embora aqui seja traduzida de modo mais amplo no cabeçalho.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: Preserva a fórmula profética tradicional e o sentido de דָּבָר como palavra ou mensagem, sem recorrer a uma paráfrase.
- source_word: דִּבֶּר
  choice: falou
  rationale: Equivalente direto e natural do verbo דבר neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a respeito de
  rationale: Em um cabeçalho profético, mantém amplo o valor da preposição, sem antecipar que o oráculo seja exclusivamente contra os povos mencionados.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma consagrada em português para o nome geográfico.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: a terra dos caldeus
  rationale: Reproduz diretamente a construção etnogeográfica hebraica.
- source_word: בְּיַד
  choice: por meio de
  rationale: Expressa em português corrente o idioma hebraico de agência, literalmente 'pela mão de'.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: o profeta Jeremias
  rationale: A ordem é natural em português e conserva tanto o nome quanto o título do mediador profético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz o nome divino; a transliteração preserva sua condição de nome próprio sem substituí-lo por um título.
- issue: Sentido de אֶל no cabeçalho profético
  choice: a respeito da Babilônia, a respeito da terra dos caldeus
  alternative: contra a Babilônia, contra a terra dos caldeus
  rationale: Embora o contexto seja de juízo, a preposição admite uma relação temática mais ampla. A tradução principal preserva essa abertura, e a leitura adversativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém a fórmula profética “A palavra que Yahweh falou” e verte o idioma בְּיַד de maneira natural como “por meio de”. O marcador [a] aparece no texto principal e corresponde à nota.
