source:
  edition: WLC
  text: נֻ֚דוּ מִ/תּ֣וֹךְ בָּבֶ֔ל וּ/מֵ/אֶ֥רֶץ כַּשְׂדִּ֖ים יצאו וִ/הְי֕וּ כְּ/עַתּוּדִ֖ים לִ/פְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/008.yaml
  text: Flee from the midst of Babylon[a], and go out from the land of the Chaldeans; and be like male goats before the flock.
translation:
  language: pt
  text: Fujam do meio da Babilônia e saiam da terra dos caldeus; sejam como bodes à frente do rebanho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como bodes guiando o rebanho”.'
    reason: A expressão לִפְנֵי significa literalmente “diante de/à frente de”; no contexto da imagem, pode sugerir que os bodes seguem adiante e conduzem o rebanho.
lexical_decisions:
- source_word: נֻדוּ
  choice: Fujam
  rationale: Neste contexto de juízo contra a Babilônia, o imperativo convoca a uma partida urgente. “Fujam” comunica essa força melhor que “vagueiem” ou o mais neutro “afastem-se”.
- source_word: מִתּוֹךְ בָּבֶל
  choice: do meio da Babilônia
  rationale: Preserva a ideia hebraica de sair de dentro da cidade, em linguagem clara e corrente.
- source_word: וּמֵאֶרֶץ כַּשְׂדִּים יצאו
  choice: e saiam da terra dos caldeus
  rationale: O contexto coordena יצאו com a sequência de exortações. “Terra dos caldeus” mantém a formulação explícita do hebraico, em vez de substituí-la por “Caldeia”.
- source_word: וִהְיוּ
  choice: sejam
  rationale: 'O imperativo de הָיָה introduz naturalmente a comparação em português: “sejam como”.'
- source_word: כְּעַתּוּדִים
  choice: como bodes
  rationale: עַתּוּדִים designa cabritos machos ou bodes; “bodes” é preciso, conciso e natural, sem confundi-los com carneiros.
- source_word: לִפְנֵי צֹאן
  choice: à frente do rebanho
  rationale: Reproduz a relação espacial básica de לִפְנֵי sem tornar explícita como certeza a possível ideia funcional de liderar.
