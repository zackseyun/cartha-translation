  text: עִרְכ֨וּ עַל בָּבֶ֤ל סָבִיב֙ כָּל דֹּ֣רְכֵי קֶ֔שֶׁת יְד֣וּ אֵלֶ֔י/הָ אַֽל תַּחְמְל֖וּ אֶל חֵ֑ץ כִּ֥י לַֽ/יהוָ֖ה חָטָֽאָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/014.yaml
  text: Draw up against Babylon all around, all you who bend the bow; shoot at her; do not spare an arrow, for she has sinned against Yahweh.
translation:
  language: pt
  text: Tomem posição contra a Babilônia, por todos os lados, todos vocês que armam o arco! Atirem contra ela; não poupem flecha alguma, pois ela pecou contra Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִרְכוּ עַל בָּבֶל
  choice: Tomem posição contra a Babilônia
  rationale: 'O imperativo plural de ערך, no contexto militar, convoca as forças a se disporem para o combate; “tomem posição” é claro e natural, enquanto עַל assume sentido hostil: “contra”.'
- source_word: סָבִיב
  choice: por todos os lados
  rationale: Expressa o cerco em torno da Babilônia e preserva a ideia de ataque vindo de todas as direções.
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: todos vocês que armam o arco
  rationale: A expressão designa arqueiros por meio da imagem concreta de preparar ou vergar o arco. “Armam o arco” conserva essa imagem em português compreensível.
- source_word: יְדוּ אֵלֶיהָ
  choice: Atirem contra ela
  rationale: No contexto de arco e flecha, ידה no Hifil significa atirar; o pronome feminino mantém a personificação da Babilônia.
- source_word: אַל תַּחְמְלוּ אֶל חֵץ
  choice: não poupem flecha alguma
  rationale: A proibição ordena que não se retenha nem sequer uma flecha. A formulação portuguesa comunica naturalmente a força do singular hebraico em construção negativa.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão do ataque ordenado.
- source_word: לַיהוָה
  choice: contra Yahweh
  rationale: Com o verbo חטא, a preposição ל marca aquele contra quem se comete o pecado; o nome divino é transliterado como Yahweh.
- source_word: חָטָאָה
  choice: ela pecou
  rationale: O perfeito na terceira pessoa feminina se refere à Babilônia personificada. O pretérito perfeito é direto e preserva a natureza moral e teológica da ação.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Relação indicada por ל em לַיהוָה com חטא
  choice: pecou contra Yahweh
  alternative: pecou para com Yahweh
  rationale: Nesta construção, ל identifica aquele contra quem se peca. “Contra” transmite com clareza o sentido idiomático sem tornar a expressão artificial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. Mantém-se o tom imperativo militar, a personificação feminina da Babilônia e a imagem concreta dos que armam o arco.
