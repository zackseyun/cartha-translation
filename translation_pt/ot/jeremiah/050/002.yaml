id: JER.50.2
reference: Jeremiah 50:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַגִּ֨ידוּ בַ/גּוֹיִ֤ם וְ/הַשְׁמִ֨יעוּ֙ וּֽ/שְׂאוּ נֵ֔ס הַשְׁמִ֖יעוּ אַל תְּכַחֵ֑דוּ אִמְרוּ֩ נִלְכְּדָ֨ה בָבֶ֜ל הֹבִ֥ישׁ בֵּל֙ חַ֣ת מְרֹדָ֔ךְ הֹבִ֣ישׁוּ עֲצַבֶּ֔י/הָ חַ֖תּוּ גִּלּוּלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/002.yaml
  text: Declare among the nations and proclaim[a]; lift up a banner. Proclaim; do not hide it. Say, “Babylon is captured; Bel is put to shame; Merodach is shattered. Her images are put to shame[b]; her idols are shattered.”
translation:
  language: pt
  text: 'Anunciem entre as nações e proclamem; levantem um estandarte. Proclamem; não o escondam. Digam: “A Babilônia foi capturada; Bel foi envergonhado; Merodaque[a] ficou consternado. Suas imagens foram envergonhadas; seus ídolos[b] ficaram consternados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Merodaque é a forma hebraica do nome da divindade babilônica mais conhecida como Marduque.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico traduzido como “ídolos” é fortemente depreciativo e pode evocar algo imundo ou desprezível.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Anunciem
  rationale: O hifil imperativo de נגד exige tornar a mensagem publicamente conhecida; “anunciem” preserva o tom de proclamação e soa natural em português.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui as nações estrangeiras em geral; a formulação preserva o alcance internacional sem empregar um termo técnico posterior.
- source_word: וְהַשְׁמִיעוּ / הַשְׁמִיעוּ
  choice: proclamem
  rationale: O hifil repetido de שמע enfatiza fazer a notícia ser ouvida publicamente. A repetição foi mantida para preservar a força retórica.
- source_word: וּשְׂאוּ נֵס
  choice: levantem um estandarte
  rationale: נֵס é um sinal elevado, frequentemente um estandarte usado para convocação ou sinalização pública.
- source_word: אַל תְּכַחֵדוּ
  choice: não escondam nada
  rationale: O piel de כחד expressa ocultar ou reter informação. “Nada” explicita de maneira idiomática que o anúncio não deve ser suprimido, sem alterar o referente implícito.
- source_word: נִלְכְּדָה בָבֶל
  choice: A Babilônia foi capturada
  rationale: O nifal perfeito apresenta a cidade como tomada; o pretérito perfeito português comunica naturalmente o resultado consumado no anúncio profético.
- source_word: הֹבִישׁ / הֹבִישׁוּ
  choice: foi envergonhado / foram envergonhadas
  rationale: O hifil de בוש descreve a chegada à vergonha ou desonra; a construção passiva preserva o resultado sofrido pelas divindades e imagens.
- source_word: בֵּל
  choice: Bel
  rationale: O nome divino é transliterado, preservando a especificidade histórica do texto.
- source_word: חַת / חַתּוּ
  choice: ficou consternado / ficaram consternados
  rationale: חתת pode indicar estar aterrorizado, abatido ou consternado. A escolha preserva o estado de colapso e desânimo sem impor a ideia material de que as imagens foram quebradas.
- source_word: מְרֹדָךְ
  choice: Merodaque
  rationale: Forma portuguesa tradicional baseada no nome hebraico; trata-se da divindade babilônica mais conhecida como Marduque/Marduk.
- source_word: עֲצַבֶּיהָ
  choice: suas imagens
  rationale: עֲצַבִּים designa imagens cultuais fabricadas. “Imagens” mantém distinção lexical em relação ao termo pejorativo seguinte.
- source_word: גִּלּוּלֶיהָ
  choice: seus ídolos repugnantes
  rationale: גִּלּוּלִים é uma designação fortemente depreciativa, associada ao que é imundo ou repulsivo. “Ídolos repugnantes” transmite no texto principal essa carga sem recorrer à tradução excessivamente literal “ídolos de esterco”.
theological_decisions:
- issue: Forma dos nomes das divindades babilônicas
  choice: Transliterar como “Bel” e “Merodaque”
  alternative: Substituí-los por identificações históricas ou pela forma acádia “Marduque/Marduk”
  rationale: A transliteração preserva os nomes presentes no texto hebraico e evita inserir no corpo do versículo uma identificação explicativa.
- issue: Sentido de חַת / חַתּוּ aplicado à divindade e aos ídolos
  choice: “ficou consternado / ficaram consternados”
  alternative: “foi despedaçado / foram despedaçados”
  rationale: A raiz admite abatimento, terror ou ruína. Como a mesma forma se aplica a Merodaque e aos ídolos, “consternado” preserva a personificação e a ambiguidade entre terror e colapso, sem pressupor destruição física.
- issue: Tratamento da linguagem depreciativa para ídolos
  choice: Explicitar “repugnantes” no texto principal
  alternative: Usar apenas “ídolos” e relegar a força pejorativa a uma nota
  rationale: A carga ofensiva de גִּלּוּלִים faz parte do sentido lexical e pode ser comunicada com clareza e dignidade em português corrente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se os imperativos no plural, a repetição retórica de “proclamem” e a personificação das divindades e imagens. “Merodaque” segue a forma portuguesa ligada ao hebraico; a identificação histórica com Marduque não foi necessária no corpo do texto.
