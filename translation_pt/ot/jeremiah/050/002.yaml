  terminology: “Estandarte”, “Bel”, “Merodaque”, “imagens” e “ídolos” são escolhas adequadas. “Merodaque” é forma portuguesa estabelecida do nome hebraico; uma nota pode informar a forma histórica mais conhecida, Marduque. A nota sobre os ídolos deve explicar a conotação depreciativa sem duplicar desnecessariamente um adjetivo já posto no texto.
