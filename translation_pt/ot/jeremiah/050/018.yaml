  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֥י פֹקֵ֛ד אֶל מֶ֥לֶךְ בָּבֶ֖ל וְ/אֶל אַרְצ֑/וֹ כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי אֶל מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/018.yaml
  text: 'Therefore thus says Yahweh of hosts[a], the God of Israel: Behold, I am about to punish the king of Babylon and his land, just as I punished the king of Assyria.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh dos Exércitos, o Deus de Israel: “Eis que vou punir o rei da Babilônia e a sua terra, assim como puni o rei da Assíria.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que pedirei contas ao rei da Babilônia e à sua terra, assim como pedi contas ao rei da Assíria”. O verbo hebraico pode significar “visitar”, “tratar de” ou “pedir contas”; neste contexto, refere-se a uma intervenção para julgar e punir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão decorrente do contexto anterior com uma conjunção natural e digna em português.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro e seu tom solene.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um termo corrente que abrange as forças sob o comando de Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Conserva a função de chamar a atenção para a ação divina iminente, enquanto o futuro verbal em português expressa sua projeção.
- source_word: פֹקֵד / פָּקַדְתִּי
  choice: pedirei contas / pedi contas
  rationale: No contexto judicial, פקד indica uma visitação punitiva. 'Pedir contas' comunica o juízo sem apagar por completo a ideia de responsabilização presente no campo semântico do verbo.
- source_word: אֶל
  choice: ao / à
  rationale: Com 'pedir contas', a regência portuguesa pede 'a'; a relação de ação dirigida contra o rei e a terra fica clara pelo contexto judicial.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução natural da cadeia construta hebraica.
- source_word: אַרְצוֹ
  choice: sua terra
  rationale: Preserva a referência ao território sob o domínio do rei da Babilônia.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Exprime com clareza o paralelo entre o futuro juízo da Babilônia e o juízo anterior da Assíria.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução direta e historicamente clara da expressão hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino; a transliteração 'Yahweh' o preserva em vez de substituí-lo por um título.
- issue: Sentido de פקד no oráculo de juízo
  choice: pedir contas
  alternative: punir; visitar; castigar
  rationale: O contexto exige sentido punitivo, mas 'pedir contas' também preserva a nuance de responsabilização e evita reduzir desnecessariamente a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética foi mantida de modo formal, enquanto 'pedir contas' oferece naturalidade e conserva a tensão lexical de פקד. O marcador [a] aparece no texto principal.
