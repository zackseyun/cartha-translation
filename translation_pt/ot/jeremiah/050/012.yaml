id: JER.50.12
reference: Jeremiah 50:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בּ֤וֹשָׁה אִמְּ/כֶם֙ מְאֹ֔ד חָפְרָ֖ה יֽוֹלַדְתְּ/כֶ֑ם הִנֵּה֙ אַחֲרִ֣ית גּוֹיִ֔ם מִדְבָּ֖ר צִיָּ֥ה וַ/עֲרָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/012.yaml
  text: Your mother will be utterly ashamed; she who gave birth to you will be disgraced. Behold[a], she will be the last of the nations, a wilderness, a dry land, and a desert.
translation:
  language: pt
  text: A mãe de vocês ficará completamente envergonhada; aquela que os deu à luz será humilhada. Eis que ela será a última entre as nações[a], uma região deserta, uma terra ressequida e uma estepe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a menor entre as nações”. A expressão hebraica pode indicar a posição final e rebaixada da Babilônia entre as nações.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשָׁה
  choice: ficará completamente envergonhada
  rationale: O perfeito qal feminino singular, no contexto deste oráculo profético, comunica um resultado futuro certo. A formulação preserva a ideia de vergonha sem explicitar um agente externo.
- source_word: אִמְּכֶם
  choice: a mãe de vocês
  rationale: Mantém diretamente a metáfora materna do hebraico e torna explícito o sufixo de segunda pessoa do plural, com linguagem natural no português moderno.
- source_word: מְאֹד
  choice: completamente
  rationale: Expressa com naturalidade a forte intensificação da vergonha.
- source_word: חָפְרָה
  choice: será humilhada
  rationale: O verbo indica humilhação ou desonra. A escolha distingue este termo de בוש e acompanha o valor futuro do paralelismo profético.
- source_word: יֽוֹלַדְתְּכֶם
  choice: aquela que os deu à luz
  rationale: Reproduz a imagem concreta da mulher que deu à luz e preserva o paralelismo poético com “a mãe de vocês”.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Marca enfaticamente o anúncio do resultado e conserva o tom profético em português digno e compreensível.
- source_word: אַחֲרִית גּוֹיִם
  choice: a última entre as nações
  rationale: Preserva o sentido de posição final ou condição reduzida entre as nações, sem eliminar a possibilidade lexical de significar “a menor”, registrada em nota.
- source_word: מִדְבָּר
  choice: uma região deserta
  rationale: No contexto de juízo, denota uma região desolada. “Região deserta” é clara e não se confunde totalmente com os dois termos geográficos seguintes.
- source_word: צִיָּה
  choice: uma terra ressequida
  rationale: Comunica a secura intensa designada pelo substantivo e mantém a progressão poética.
- source_word: וַעֲרָבָה
  choice: e uma estepe
  rationale: Representa uma planície árida ou região de estepe, distinguindo o termo de מִדְבָּר e צִיָּה.
theological_decisions:
- issue: Personificação da Babilônia como mãe e como aquela que dá à luz
  choice: Manter diretamente a metáfora materna no texto principal
  alternative: Explicitar “cidade-mãe” ou “pátria-mãe”
  rationale: O hebraico apresenta a Babilônia poeticamente como mãe de seus habitantes. A tradução conserva essa imagem sem inserir uma interpretação explicativa no texto.
- issue: Valor temporal dos perfeitos proféticos
  choice: Traduzir os verbos iniciais com sentido futuro
  alternative: 'Traduzir com sentido presente ou resultativo: “está envergonhada... está humilhada”'
  rationale: No contexto do anúncio profético de juízo, os perfeitos descrevem resultados futuros como certos. O futuro comunica melhor essa função discursiva em português.
- issue: Sentido de אַחֲרִית גּוֹיִם
  choice: “a última entre as nações”, preservando na nota a leitura “a menor”
  alternative: Traduzir diretamente “a menor entre as nações”
  rationale: A expressão pode indicar tanto posição final quanto condição rebaixada. O texto principal conserva a formulação mais próxima, enquanto a nota mantém a ambiguidade relevante.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção “a mãe de vocês” explicita naturalmente o destinatário plural; “Eis que” preserva o tom profético. A sequência geográfica mantém três imagens distintas de desolação.
