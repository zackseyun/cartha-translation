  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָרִ֨יעוּ עָלֶ֤י/הָ סָבִיב֙ נָתְנָ֣ה יָדָ֔/הּ נָֽפְלוּ֙ אשויתי/ה נֶהֶרְס֖וּ חֽוֹמוֹתֶ֑י/הָ כִּי֩ נִקְמַ֨ת יְהוָ֥ה הִיא֙ הִנָּ֣קְמוּ בָ֔/הּ כַּ/אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/015.yaml
  text: Raise a shout against her all around[a]; she has given her hand; her foundations have fallen, her walls are torn down. For it is the vengeance of Yahweh—take vengeance on her; as she has done[b], do to her.
translation:
  language: pt
  text: Lancem contra ela um grito de guerra, por todos os lados; ela deu a mão[a]; seus alicerces[b] caíram, suas muralhas foram derrubadas. Pois esta é a vingança de Yahweh. Vinguem-se dela; assim como ela fez, façam com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica significa literalmente “deu a mão” e, neste contexto, provavelmente quer dizer “rendeu-se” ou “submeteu-se”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é incerto; também pode designar contrafortes, baluartes ou outras estruturas defensivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ עָלֶיהָ סָבִיב
  choice: Lancem contra ela o grito de guerra por todos os lados
  rationale: O hifil imperativo plural de רוע/ריע, no contexto de cerco, indica levantar um brado hostil ou grito de guerra. A formulação explicita o cenário militar sem perder a força do imperativo, e סָבִיב comunica o cerco por todos os lados.
- source_word: נָתְנָה יָדָהּ
  choice: ela deu a mão
  rationale: Mantém a imagem literal do hebraico, embora a expressão provavelmente indique capitulação ou submissão. A nota apresenta o sentido idiomático para evitar que a tradução resolva silenciosamente a figura.
- source_word: אשויתיה
  choice: seus alicerces
  rationale: O termo é raro e de sentido incerto, mas no paralelismo com as muralhas parece designar estruturas de sustentação ou defesa. “Alicerces” é claro em português, enquanto a nota preserva alternativas plausíveis.
- source_word: נֶהֶרְסוּ חוֹמוֹתֶיהָ
  choice: suas muralhas foram derrubadas
  rationale: O nifal de הרס expressa demolição ou derrubada, e חוֹמָה designa aqui as muralhas da cidade.
- source_word: נִקְמַת יְהוָה הִיא
  choice: esta é a vingança de Yahweh
  rationale: A frase identifica a queda de Babilônia como a vingança pertencente a Yahweh ou realizada por ele. O nome divino é transliterado como “Yahweh”.
- source_word: הִנָּקְמוּ בָהּ
  choice: Vinguem-se dela
  rationale: Preserva a forma imperativa e o sentido retributivo do nifal de נקם, sem acrescentar uma explicação teológica ausente do texto.
- source_word: כַּאֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: assim como ela fez, façam com ela
  rationale: Mantém a concisão, a reciprocidade e a ordem das duas orações hebraicas.
theological_decisions:
- issue: Se נָתְנָה יָדָהּ deve ser traduzido literalmente ou interpretado como rendição
  choice: Manter “ela deu a mão” no texto principal e explicar na nota que a expressão provavelmente significa rendição.
  alternative: ela se rendeu
  rationale: O sentido contextual mais provável é capitulação, mas a imagem hebraica é vívida e não inteiramente transparente; conservar a expressão evita eliminar sua ambiguidade.
- issue: Como traduzir o substantivo incerto אשויתיה
  choice: Usar “alicerces” e registrar na nota outras possibilidades ligadas às fortificações.
  alternative: contrafortes; baluartes; estruturas defensivas
  rationale: O contexto de cerco e o paralelismo com “muralhas” favorecem uma referência arquitetônica ou defensiva, mas a raridade da palavra não permite precisão absoluta.
- issue: Agente e caráter da vingança
  choice: Traduzir a identificação direta do acontecimento como “a vingança de Yahweh” e conservar o imperativo dirigido aos atacantes.
  alternative: o ato de vingança de Yahweh; executem vingança contra ela
  rationale: A tradução mantém a tensão do texto entre a vingança atribuída a Yahweh e a ordem dada a agentes humanos, sem explicar além do que o hebraico declara.
translation_notes:
  register: Português moderno, claro e solene, com imperativos naturais no plural. “Muralhas” e “grito de guerra” tornam explícito o cenário de cerco; as notas preservam as duas principais incertezas lexicais do hebraico.
