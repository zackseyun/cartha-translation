  text: גֹּאֲלָ֣/ם חָזָ֗ק יְהוָ֤ה צְבָאוֹת֙ שְׁמ֔/וֹ רִ֥יב יָרִ֖יב אֶת רִיבָ֑/ם לְמַ֨עַן֙ הִרְגִּ֣יעַ אֶת הָ/אָ֔רֶץ וְ/הִרְגִּ֖יז לְ/יֹשְׁבֵ֥י בָבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/034.yaml
  text: Their Redeemer is strong[a]; Yahweh of Armies is his name. He will surely plead their case[d][c][b], so that he may give rest to the earth and bring unrest to the inhabitants of Babylon.
translation:
  language: pt
  text: O Redentor deles é forte[a]; Yahweh dos Exércitos é seu nome[b]. Ele certamente defenderá a causa deles[c], a fim de dar descanso à terra[d] e causar inquietação aos habitantes da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O parente-resgatador deles é forte”. O termo hebraico pode designar um parente que resgata ou defende os direitos de um familiar, em contexto jurídico.'
    reason: lexical_alternative
  - marker: b
    text: 'Forma tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Ele certamente contenderá pela causa deles”. O hebraico repete termos da mesma raiz, ligada a disputas judiciais, para dar ênfase à ação.'
    reason: lexical_alternative
  - marker: d
    text: “A terra” também pode ser entendida como “o país” ou “a região”.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּאֲלָם
  choice: O Redentor deles
  rationale: גאל designa quem resgata, reivindica ou defende alguém, muitas vezes com implicações jurídico-familiares. “Redentor” é conciso e preserva essa amplitude; a dimensão de parentesco é indicada em nota.
- source_word: חָזָק
  choice: é forte
  rationale: חָזָק expressa força ou poder. “Forte” reproduz diretamente o sentido e soa natural com “Redentor”.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino pessoal e traduz צְבָאוֹת de modo concreto e compreensível, preservando a imagem do comando de exércitos.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Reproduz com naturalidade e dignidade a fórmula hebraica de identificação.
- source_word: רִיב יָרִיב אֶת רִיבָם
  choice: Ele certamente defenderá a causa deles
  rationale: A construção com infinitivo absoluto intensifica o verbo, representada por “certamente”. O verbo e o substantivo da raiz ריב evocam disputa judicial; “defenderá a causa” conserva esse caráter forense em linguagem acessível.
- source_word: לְמַעַן
  choice: a fim de
  rationale: Expressa claramente a relação de propósito introduzida pela preposição/conjunção hebraica.
- source_word: הִרְגִּיעַ אֶת הָאָרֶץ
  choice: dar descanso à terra
  rationale: O hifil de רגע comunica fazer repousar ou aquietar. “Dar descanso” preserva o sentido causativo; “terra” mantém a possível abrangência de הָאָרֶץ.
- source_word: וְהִרְגִּיז
  choice: e causar inquietação
  rationale: O hifil de רגז pode indicar provocar agitação, perturbação ou tremor. “Causar inquietação” mantém a oposição retórica a “dar descanso” sem limitar o sentido a tremor físico.
- source_word: לְיֹשְׁבֵי בָבֶל
  choice: aos habitantes da Babilônia
  rationale: Tradução clara e corrente da expressão que designa coletivamente os que vivem na Babilônia.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: aquela terra; o país
  rationale: הָאָרֶץ pode referir-se à terra em sentido amplo ou a uma região específica. O contexto contrasta o descanso concedido à terra com a inquietação dos habitantes da Babilônia, mas não elimina a ambiguidade; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo entre dar descanso à terra e causar inquietação na Babilônia, além do tom jurídico da defesa promovida pelo Redentor.
