  text: צִיּ֣וֹן יִשְׁאָ֔לוּ דֶּ֖רֶךְ הֵ֣נָּה פְנֵי/הֶ֑ם בֹּ֚אוּ וְ/נִלְו֣וּ אֶל יְהוָ֔ה בְּרִ֥ית עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
translation:
  language: pt
  text: 'Perguntarão pelo caminho de Sião, com os rostos voltados para lá: “Venham, unamo-nos[a] a Yahweh numa aliança eterna, que não será esquecida.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejamos unidos”. O verbo hebraico pode ter sentido reflexivo (“unamo-nos”) ou passivo (“sejamos unidos”).'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “uma aliança eterna que não será esquecida”, ressaltando a permanência da aliança em contraste com a infidelidade anterior.
    reason: cultural_note
lexical_decisions:
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio Zion.
- source_word: יִשְׁאָלוּ
  choice: Perguntarão
  rationale: O imperfeito qal tem sentido futuro no contexto profético e significa perguntar ou informar-se.
- source_word: דֶּרֶךְ
  choice: pelo caminho
  rationale: Mantém a imagem concreta do caminho ou estrada, permitindo também sua possível ressonância figurada.
- source_word: הֵנָּה פְנֵיהֶם
  choice: com o rosto voltado para lá
  rationale: Expressa de modo natural a orientação indicada literalmente por “seus rostos” e pelo advérbio direcional.
- source_word: בֹּאוּ
  choice: Venham
  rationale: Imperativo plural que introduz uma exortação em discurso direto.
- source_word: וְנִלְווּ
  choice: unamo-nos
  rationale: O nifal de לוה comunica unir-se ou ser ligado; no encadeamento exortativo, “unamo-nos” reproduz naturalmente o compromisso coletivo sem eliminar a alternativa passiva.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição indica a pessoa a quem o povo se une; o nome divino é transliterado como Yahweh.
- source_word: בְּרִית עוֹלָם
  choice: numa aliança eterna
  rationale: “Aliança” traduz בְּרִית, e עוֹלָם indica duração permanente; “numa” apresenta a aliança como o vínculo dessa união.
- source_word: לֹא תִשָּׁכֵחַ
  choice: que não será esquecida
  rationale: O nifal imperfeito feminino concorda com “aliança” e conserva o sentido passivo direto do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o caráter pessoal e pactual do nome sem substituí-lo por um título.
- issue: Agência expressa em וְנִלְווּ
  choice: unamo-nos
  alternative: sejamos unidos
  rationale: A forma nifal admite nuance reflexiva ou passiva. A tradução principal apresenta a exortação como adesão coletiva voluntária, enquanto a nota conserva a leitura passiva e evita transformar a diferença gramatical em afirmação doutrinária.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “Sião” na forma tradicional e “Yahweh” como transliteração do nome divino. A ordem foi levemente ajustada para fluência, preservando a imagem do rosto orientado para o destino e a ambiguidade do verbo de união.
