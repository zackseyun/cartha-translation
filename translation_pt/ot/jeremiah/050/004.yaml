review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a fórmula temporal dupla, o nome Yahweh, a distinção entre Israel e Judá, a vinda conjunta e a busca de Yahweh como seu Deus. Contudo, “seguirão adiante” acrescenta a noção de avanço e substitui a repetição deliberada do verbo hebraico הולך/ילכו (“ir ... irão”).
  naturalness: O português é moderno e claro. “Caminhando e chorando, eles irão” é natural o suficiente em registro profético e reproduz melhor a construção enfática do original do que “seguirão adiante”.
  terminology: “Yahweh”, “filhos de Israel”, “filhos de Judá” e “buscarão Yahweh, seu Deus” são escolhas consistentes, compreensíveis e fiéis ao texto. A nota alternativa foi ajustada para manter ambos os grupos como sujeitos plurais de “virão”.
  issues:
  - severity: medium
    issue: “Eles seguirão adiante” para יֵלֵכוּ
    rationale: O hebraico diz literalmente “indo e chorando, irão”, com repetição do campo verbal de “ir”. “Seguirão adiante” introduz uma direção/progressão não expressa no texto e atenua a repetição.
  revised_text: Naqueles dias e naquele tempo, declara Yahweh, os filhos de Israel virão, eles e os filhos de Judá, juntos. Caminhando e chorando, eles irão e buscarão Yahweh, seu Deus.
  revised_footnotes:
  - marker: a
    text: 'Ou: “o povo de Israel e o povo de Judá virão juntos”. O hebraico diz literalmente “os filhos de Israel” e “os filhos de Judá”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete a ideia de ir; literalmente: “indo e chorando, eles irão”, indicando movimento contínuo acompanhado de choro.'
    reason: lexical_alternative
  revision_rationale: A revisão elimina o acréscimo semântico de “adiante” e restabelece no texto principal a repetição hebraica de “ir”, preservando a construção intensiva/durativa. A nota a foi reformulada para apresentar uma alternativa idiomática sem alterar o número plural nem a participação explícita de Israel e Judá.
