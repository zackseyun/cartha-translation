  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
translation:
  language: pt
  text: Naqueles dias e naquele tempo, declara Yahweh, os filhos de Israel virão, eles e os filhos de Judá, juntos. Caminhando e chorando, eles irão e buscarão Yahweh, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  choice: Naqueles dias e naquele tempo
  rationale: Mantém a expressão temporal dupla do hebraico e sua formulação profética, sem fundir os dois elementos.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz de modo natural e solene a fórmula profética, mantendo o nome divino.
- source_word: יָבֹאוּ
  choice: virão
  rationale: Expressa o sentido futuro simples e deixa implícito o destino, como no hebraico.
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  choice: os filhos de Israel ... e os filhos de Judá
  rationale: Preserva a imagem familiar e corporativa do hebraico, sem generalizá-la como “todo o Israel”.
- source_word: הֵמָּה
  choice: eles
  rationale: Conserva o pronome enfático e resumitivo que volta a destacar os filhos de Israel antes de mencionar Judá.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Comunica claramente a reunião dos dois grupos nomeados no texto.
- source_word: הָלוֹךְ וּבָכוֹ יֵלֵכוּ
  choice: Caminhando e chorando, eles seguirão adiante
  rationale: Transmite o movimento contínuo acompanhado de choro em português natural; a nota registra a repetição literal do verbo hebraico.
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  choice: e buscarão Yahweh, seu Deus
  rationale: “Buscar” preserva tanto a ação quanto sua força relacional e religiosa, sem explicitar além do texto o modo dessa busca.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Restauração conjunta de Israel e Judá
  choice: Manter os dois grupos distintos e reunidos
  alternative: Resumir como “todo o Israel” ou interpretar como outro grupo posterior
  rationale: O versículo nomeia Israel e Judá separadamente e afirma que vêm juntos; a tradução conserva essa tensão histórica e teológica sem impor uma identificação posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura profética e a imagem familiar foram preservadas, enquanto a sequência verbal foi levemente naturalizada no texto principal e esclarecida em nota.
