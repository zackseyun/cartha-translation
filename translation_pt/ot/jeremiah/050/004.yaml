- from: “Naqueles dias e naquele tempo”, declara Yahweh, “os filhos de Israel virão, eles e os filhos de Judá, juntos.[a] Caminhando e chorando, eles seguirão adiante[b] e buscarão Yahweh, seu Deus.”
  to: Naqueles dias e naquele tempo, declara Yahweh, os filhos de Israel virão, eles e os filhos de Judá, juntos. Caminhando e chorando, eles irão e buscarão Yahweh, seu Deus.
  rationale: A revisão elimina o acréscimo semântico de “adiante” e restabelece no texto principal a repetição hebraica de “ir”, preservando a construção intensiva/durativa. A nota a foi reformulada para apresentar uma alternativa idiomática sem alterar o número plural nem a participação explícita de Israel e Judá.
