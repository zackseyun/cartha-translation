source:
  edition: WLC
  text: כִּרְת֤וּ זוֹרֵ֨עַ֙ מִ/בָּבֶ֔ל וְ/תֹפֵ֥שׂ מַגָּ֖ל בְּ/עֵ֣ת קָצִ֑יר מִ/פְּנֵי֙ חֶ֣רֶב הַ/יּוֹנָ֔ה אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ לְ/אַרְצ֖/וֹ יָנֻֽסוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/016.yaml
  text: Cut off from Babylon the sower[a], and the one who handles the sickle at the time of harvest. Because of the sword of the oppressor, each man will turn to his own people, and each will flee to his own land.
translation:
  language: pt
  text: Eliminem da Babilônia quem semeia e quem empunha a foice no tempo da colheita. Por causa da espada do opressor,[a] cada um voltará para o seu povo, e cada um fugirá para a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a espada daquele que oprime”. A expressão hebraica também tem sido entendida como “a espada cruel” e, menos provavelmente, em sentido mais literal, “a espada da pomba”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְתוּ
  choice: Eliminem
  rationale: O imperativo plural de כרת, neste contexto de juízo, ordena retirar ou fazer desaparecer de Babilônia os trabalhadores mencionados. “Eliminem” comunica a força do verbo sem sugerir especificamente o ato literal de cortar.
- source_word: זוֹרֵעַ
  choice: quem semeia
  rationale: O particípio substantivado designa a pessoa que semeia; esta formulação é natural e clara em português.
- source_word: מִבָּבֶל
  choice: da Babilônia
  rationale: A preposição מן com כרת indica remoção de dentro de Babilônia.
- source_word: וְתֹפֵשׂ מַגָּל
  choice: e quem empunha a foice
  rationale: תפשׂ expressa agarrar, segurar ou manejar. “Empunha a foice” preserva a imagem concreta e soa natural no contexto da ceifa.
- source_word: בְּעֵת קָצִיר
  choice: no tempo da colheita
  rationale: Tradução temporal direta e inteligível da expressão hebraica.
- source_word: מִפְּנֵי
  choice: Por causa de
  rationale: Aqui a locução introduz a causa da dispersão e da fuga.
- source_word: חֶרֶב הַיּוֹנָה
  choice: a espada do opressor
  rationale: Entende-se הַיּוֹנָה como ligado à raiz verbal de oprimir. A nota conserva as alternativas lexicais reais, inclusive a leitura formalmente possível “pomba”.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: cada um voltará para o seu povo
  rationale: אישׁ tem sentido distributivo, e פנה indica voltar-se ou retornar em direção ao próprio povo. “Cada um” reproduz naturalmente essa distribuição em português sem restringir indevidamente a referência a homens adultos.
- source_word: וְאִישׁ לְאַרְצוֹ יָנֻסוּ
  choice: e cada um fugirá para a sua terra
  rationale: נוס significa fugir; ארץ é adequadamente vertido por “terra” neste contexto territorial.
theological_decisions:
- issue: Sentido distributivo de אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: Embora a forma hebraica seja masculina singular, ela funciona distributivamente e abrange cada indivíduo do grupo. “Cada um” mantém essa função em português natural sem acrescentar uma limitação de sexo que o contexto não exige.
- issue: Identificação de הַיּוֹנָה
  choice: do opressor
  alternative: da pomba; cruel
  rationale: A leitura derivada da raiz “oprimir” se ajusta ao contexto da espada invasora, mas a ambiguidade lexical é genuína e por isso é explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela “quem semeia e quem empunha a foice” mantém a imagem agrícola e o equilíbrio poético do hebraico.
