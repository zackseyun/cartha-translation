    issue: «eles se tornarão como mulheres» acrescenta «como».
    rationale: O hebraico usa לְנָשִׁים, literalmente «em/como mulheres» em construção de tornar-se, e a tradução formal adotada no audit trail é «tornar-se mulheres». A forma comparativa explícita não é necessária e suaviza/reestrutura a imagem do original.
  - severity: medium
    issue: «toda a população estrangeira» resolve em excesso o sentido de כָּל־הָעֶרֶב.
    rationale: O termo pode designar uma população mista, pessoas de origens diversas ou forças auxiliares estrangeiras. «Estrangeira» como texto principal exclui a leitura mais ampla de população mista.
