  source_fidelity: A fórmula elíptica «Espada contra» e os referentes militares e econômicos são bem preservados. Porém, וְהָיוּ לְנָשִׁים diz literalmente «e eles se tornarão mulheres», não «como mulheres». A comparação acrescentada altera a forma da imagem hebraica, embora reflita seu valor idiomático provável.
  naturalness: O texto tem registro profético natural e compreensível. «População estrangeira» restringe indevidamente o termo ambíguo «misto»; «população mista» preserva melhor a indeterminação lexical. «Depósitos de tesouros» é compreensível, mas «tesouros» é mais fluente e permite o sentido de reservas/riquezas armazenadas no contexto.
  terminology: «Carros de guerra» comunica adequadamente o sentido de רִכְבּוֹ. A nota cultural deve esclarecer a expressão antiga sem converter o texto principal em uma paráfrase nem apresentar o estereótipo bélico como avaliação geral das mulheres.
  issues:
