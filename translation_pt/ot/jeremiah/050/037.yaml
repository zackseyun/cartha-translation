  text: חֶ֜רֶב אֶל סוּסָ֣י/ו וְ/אֶל רִכְבּ֗/וֹ וְ/אֶל כָּל הָ/עֶ֛רֶב אֲשֶׁ֥ר בְּ/תוֹכָ֖/הּ וְ/הָי֣וּ לְ/נָשִׁ֑ים חֶ֥רֶב אֶל אוֹצְרֹתֶ֖י/הָ וּ/בֻזָּֽזוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/037.yaml
  text: A sword against his horses and against his chariots[a], and against all the mixed people in her midst, and they will become women. A sword against her treasuries[b], and they will be plundered.
translation:
  language: pt
  text: Espada contra os seus cavalos e contra os seus carros de guerra, contra toda a população mista[a] que está no meio dela; eles se tornarão mulheres[b]. Espada contra os seus tesouros, e eles serão saqueados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todas as tropas auxiliares estrangeiras» ou «toda a população de várias origens». O hebraico pode se referir a uma população mista ou a forças estrangeiras presentes na Babilônia.
    reason: lexical_alternative
  - marker: b
    text: No antigo contexto de guerra, «tornar-se mulheres» era uma expressão para perder a coragem ou ficar amedrontado. A nota explica o uso idiomático antigo, não uma avaliação geral das mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: חֶרֶב
  choice: Espada contra
  rationale: Mantém a fórmula profética elíptica e incisiva de anúncio de ataque, sem acrescentar um verbo ausente no hebraico.
- source_word: סוּסָיו
  choice: os seus cavalos
  rationale: O sufixo masculino singular remete gramaticalmente à Babilônia personificada ou ao seu poder; em português, o possessivo evita impor um gênero ao referente.
- source_word: רִכְבּוֹ
  choice: os seus carros de guerra
  rationale: O singular coletivo designa a força de carros; a explicitação «de guerra» comunica naturalmente o sentido militar em português.
- source_word: כָּל הָעֶרֶב
  choice: toda a população estrangeira
  rationale: עֶרֶב parece designar a população mista ou elementos estrangeiros presentes na Babilônia. A tradução evita especificar que eram mercenários, interpretação possível, mas não certa.
- source_word: בְּתוֹכָהּ
  choice: que está no meio dela
  rationale: Preserva o sufixo feminino que se refere à cidade da Babilônia e mantém sua personificação.
- source_word: וְהָיוּ לְנָשִׁים
  choice: eles se tornarão como mulheres
  rationale: Comunica a comparação idiomática no contexto bélico sem substituir a imagem antiga por uma interpretação abstrata; a nota esclarece sua função cultural.
- source_word: אוֹצְרֹתֶיהָ
  choice: os seus depósitos de tesouros
  rationale: אוֹצָר pode indicar tanto o tesouro armazenado quanto o lugar em que é guardado. A expressão preserva ambos os aspectos e se ajusta ao plural retomado pelo verbo passivo.
- source_word: וּבֻזָּזוּ
  choice: e eles serão saqueados
  rationale: Mantém a voz passiva e toma os depósitos de tesouros como antecedente plural natural.
theological_decisions:
- issue: Expressão de gênero לְנָשִׁים no antigo contexto de guerra
  choice: eles se tornarão como mulheres
  alternative: eles perderão a coragem
  rationale: A tradução preserva a imagem explícita e historicamente situada do hebraico, em vez de neutralizá-la ou endossá-la como afirmação geral sobre as mulheres. A nota explica o sentido idiomático no contexto militar.
- issue: Identidade de כָּל הָעֶרֶב
  choice: toda a população estrangeira
  alternative: todos os mercenários estrangeiros
  rationale: O texto pode aludir a uma população mista ou a tropas auxiliares estrangeiras. A formulação principal não resolve indevidamente essa incerteza, e a nota registra as alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição abrupta de «Espada contra» conserva o ritmo do oráculo. Os marcadores [a] e [b] aparecem no texto junto às expressões que explicam.
