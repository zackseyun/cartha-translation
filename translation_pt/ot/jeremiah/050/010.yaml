reference: Jeremiah 50:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה כַשְׂדִּ֖ים לְ/שָׁלָ֑ל כָּל שֹׁלְלֶ֥י/הָ יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/010.yaml
  text: And Chaldea will become plunder[a]; all who plunder her will have their fill[b], declares Yahweh.
translation:
  language: pt
  text: A Caldeia se tornará despojo[a]; todos os que a saquearem se fartarão[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os caldeus”; a forma hebraica é plural, mas aqui provavelmente representa a terra ou potência da Caldeia, como sugere o pronome feminino seguinte, “a”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficarão satisfeitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: se tornará
  rationale: O perfeito qal com conjunção, no discurso profético, expressa aqui um resultado futuro; “se tornará” comunica a mudança de condição.
- source_word: כַשְׂדִּים
  choice: a Caldeia
  rationale: Embora a forma hebraica seja plural, o contexto aponta para a terra ou potência política, como indica o sufixo feminino singular em “a”.
- source_word: לְשָׁלָל
  choice: despojo
  rationale: Expressa o que é tomado em guerra e permite manter a concisão e o tom profético do hebraico.
- source_word: כָּל שֹׁלְלֶיהָ
  choice: todos os que a saquearem
  rationale: Mantém a abrangência de כָּל e apresenta naturalmente em português o particípio ativo com o sufixo feminino referente à Caldeia.
- source_word: יִשְׂבָּעוּ
  choice: se fartarão
  rationale: Preserva a imagem de ficar cheio ou satisfeito e, no contexto do saque, comunica abundância sem explicação excessiva.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz de modo natural a fórmula profética e translitera o nome divino expresso no texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” conserva o nome próprio e evita substituí-lo por um título.
- issue: Referente de כַשְׂדִּים
  choice: a Caldeia, entendida como terra ou potência política
  alternative: os caldeus
  rationale: A forma é morfologicamente plural, mas o sufixo feminino singular subsequente favorece a referência territorial ou política. A alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Despojo” mantém o campo militar; “saquearem” evita uma repetição pouco natural. O travessão destaca a fórmula profética final.
