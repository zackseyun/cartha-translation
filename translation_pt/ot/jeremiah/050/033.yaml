  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֲשׁוּקִ֛ים בְּנֵי יִשְׂרָאֵ֥ל וּ/בְנֵי יְהוּדָ֖ה יַחְדָּ֑ו וְ/כָל שֹֽׁבֵי/הֶם֙ הֶחֱזִ֣יקוּ בָ֔/ם מֵאֲנ֖וּ שַׁלְּחָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/033.yaml
  text: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
translation:
  language: pt
  text: 'Assim diz Yahweh dos Exércitos: “Os filhos de Israel e os filhos de Judá são igualmente oprimidos[a][b]. Todos os seus captores os mantêm presos; recusam-se a soltá-los.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os israelitas e o povo de Judá são igualmente oprimidos”.'
    reason: Alternativa idiomática para as expressões literais “filhos de Israel” e “filhos de Judá”.
  - marker: b
    text: 'Outra disposição possível: “Os filhos de Israel são oprimidos, e os filhos de Judá juntamente com eles”.'
    reason: Preserva uma possível relação sintática de יַחְדָּו com o segundo grupo.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética tradicional e natural em português, preservando o tom solene da declaração divina.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo amplo e reconhecível, sem restringi-lo apenas a exércitos humanos.
- source_word: עֲשׁוּקִים
  choice: são ... oprimidos
  rationale: O particípio passivo descreve a condição presente dos dois grupos; a formulação portuguesa conserva esse valor.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: Os filhos de Israel e os filhos de Judá
  rationale: Preserva a expressão filial explícita e o paralelismo do hebraico.
- source_word: יַחְדָּו
  choice: igualmente
  rationale: Neste contexto, comunica que Israel e Judá compartilham a mesma condição, com maior naturalidade do que uma tradução espacial de 'juntos'.
- source_word: שֹׁבֵיהֶם
  choice: todos os que os levaram cativos
  rationale: 'Explicita com clareza o sentido do particípio ativo: aqueles que os capturaram e deportaram.'
- source_word: הֶחֱזִיקוּ בָם
  choice: os mantêm presos
  rationale: Expressa a retenção firme indicada pelo idioma hebraico, sem sugerir apenas contato físico.
- source_word: מֵאֲנוּ שַׁלְּחָם
  choice: se recusam a soltá-los
  rationale: Reproduz a recusa persistente em libertar os cativos de maneira idiomática e concisa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; 'Yahweh' o representa diretamente, sem substituí-lo por um título.
- issue: Tradução de בְּנֵי nas designações coletivas
  choice: filhos de Israel ... filhos de Judá
  alternative: israelitas ... povo de Judá
  rationale: A forma escolhida conserva a linguagem de descendência e aliança presente no hebraico, enquanto a nota oferece a equivalência coletiva natural.
- issue: Relação sintática de יַחְדָּו com Israel e Judá
  choice: os dois grupos são igualmente oprimidos
  alternative: os filhos de Israel são oprimidos, e os filhos de Judá juntamente com eles
  rationale: A leitura principal entende o advérbio como qualificando a condição compartilhada dos dois grupos; a alternativa preserva outra distribuição possível da frase sem alterar seu sentido básico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética e as designações coletivas mantêm solenidade moderada; verbos correntes como “mantêm presos” e “soltá-los” evitam arcaísmo.
