  text: שֶׂ֧ה פְזוּרָ֛ה יִשְׂרָאֵ֖ל אֲרָי֣וֹת הִדִּ֑יחוּ הָ/רִאשׁ֤וֹן אֲכָל/וֹ֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/זֶ֤ה הָ/אַחֲרוֹן֙ עִצְּמ֔/וֹ נְבוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/017.yaml
  text: Israel is a scattered sheep[a]; lions have driven him away. First the king of Assyria devoured him[c][b], and this last one—Nebuchadnezzar king of Babylon—has gnawed his bones.
translation:
  language: pt
  text: Israel é uma ovelha dispersa[a]; leões o afugentaram. Primeiro, o rei da Assíria o devorou; depois, este último — Nabucodonosor[c], rei da Babilônia — roeu-lhe os ossos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um cordeiro disperso”. O termo hebraico pode designar uma ovelha ou um cordeiro.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ser entendido como “deixou seus ossos descarnados”, “quebrou seus ossos” ou, em sentido mais geral, “o esmagou”.
    reason: lexical_alternative
  - marker: c
    text: O nome hebraico aqui tem uma forma mais próxima de “Nabucodrezar”; “Nabucodonosor” é a forma tradicional em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: ovelha
  rationale: O substantivo designa um animal do rebanho miúdo e pode ser traduzido por “ovelha” ou “cordeiro”. “Ovelha” preserva de modo natural a imagem coletiva e vulnerável de Israel.
- source_word: פְזוּרָה
  choice: dispersa
  rationale: O particípio passivo descreve Israel como espalhado ou disperso. “Dispersa” concorda com “ovelha” e comunica tanto o afastamento quanto a desagregação do rebanho.
- source_word: אֲרָיוֹת הִדִּיחוּ
  choice: leões o afugentaram
  rationale: O Hifil indica fazer fugir, expulsar ou afastar. “Afugentaram” mantém viva a cena de predadores que põem a presa em fuga.
- source_word: אֲכָלוֹ
  choice: o devorou
  rationale: Embora o verbo signifique literalmente “comeu”, “devorou” expressa melhor a violência da metáfora de conquista.
- source_word: וְזֶה הָאַחֲרוֹן
  choice: depois, este último
  rationale: A expressão contrasta o opressor posterior com o primeiro. “Este último” conserva a referência demonstrativa; “depois” torna clara em português a sequência temporal já implícita no contraste.
- source_word: עִצְּמוֹ
  choice: roeu-lhe os ossos
  rationale: A forma verbal admite a imagem concreta de roer ou deixar os ossos descarnados. A tradução preserva a intensificação da metáfora predatória sem reduzir o sentido a uma expressão genérica como “esmagou”.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida, enquanto a forma mais próxima da grafia hebraica deste versículo é indicada em nota.
theological_decisions:
- issue: Personificação singular de Israel
  choice: 'Israel é apresentado como uma só ovelha, e os pronomes seguintes permanecem no singular masculino: “o afugentaram”, “o devorou” e “lhe” em “roeu-lhe os ossos”.'
  alternative: Entender Israel coletivamente como um rebanho e empregar formas plurais.
  rationale: O hebraico usa “Israel” como coletivo singular, em aposição a “ovelha”, e mantém sufixos pronominais singulares. O português permite conservar essa personificação, apesar da mudança natural de gênero gramatical entre “ovelha” e “Israel”.
- issue: Força da imagem final
  choice: “roeu-lhe os ossos”
  alternative: “quebrou seus ossos”, “descarnou seus ossos” ou, de modo mais geral, “o esmagou”.
  rationale: A formulação mantém a imagem de Israel como presa de leões e não resolve indevidamente a amplitude lexical do verbo; as alternativas são registradas em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A metáfora pastoral e predatória foi mantida. O pronome masculino retoma “Israel”, não o gênero gramatical feminino de “ovelha”. Os travessões destacam a identificação do último opressor sem alterar a progressão do hebraico.
