id: JER.50.9
reference: Jeremiah 50:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה אָנֹכִ֡י מֵעִיר֩ וּ/מַעֲלֶ֨ה עַל בָּבֶ֜ל קְהַל גּוֹיִ֤ם גְּדֹלִים֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וְ/עָ֣רְכוּ לָ֔/הּ מִ/שָּׁ֖ם תִּלָּכֵ֑ד חִצָּי/ו֙ כְּ/גִבּ֣וֹר מַשְׁכִּ֔יל לֹ֥א יָשׁ֖וּב רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/009.yaml
  text: For behold[a], I am stirring up and bringing against Babylon an assembly of great nations from the land of the north. They will array themselves against her; from there she will be captured. Their arrows are like those of a skilled warrior[b]; none returns empty-handed.
translation:
  language: pt
  text: Pois eis que estou despertando e trazendo contra a Babilônia uma assembleia de grandes nações da terra do norte. Elas se colocarão em ordem de batalha contra ela; dali[a] ela será capturada. Suas flechas são como as de um guerreiro habilidoso; nenhuma voltará sem resultado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “de lá”, provavelmente o lugar onde as nações atacantes se colocam em ordem de batalha contra a Babilônia.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “Suas flechas são como um guerreiro habilidoso que não volta de mãos vazias”. A comparação no hebraico é condensada, e a relação exata entre as “flechas” e o “guerreiro habilidoso” é ambígua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִיר
  choice: despertando
  rationale: O particípio hifil de עור indica fazer com que as nações se levantem para agir. “Despertando” mantém a força causativa e é natural em português.
- source_word: וּמַעֲלֶה
  choice: trazendo contra
  rationale: O hifil de עלה, em contexto militar, pode significar fazer subir ou trazer uma força contra um lugar. A formulação preserva tanto a causação divina quanto o movimento hostil.
- source_word: קְהַל גּוֹיִם גְּדֹלִים
  choice: uma assembleia de grandes nações
  rationale: קהל designa um corpo reunido, e גוים גדלים pode indicar nações grandes em dimensão ou poder. A tradução preserva essa amplitude sem explicitar “coalizão” nem restringir “grandes” a “poderosas”.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: da terra do norte
  rationale: Mantém a expressão geográfica profética de modo formalmente próximo e compreensível em português atual.
- source_word: וְעָרְכוּ לָהּ
  choice: Elas se colocarão em ordem de batalha contra ela
  rationale: ערך, neste contexto militar, descreve a disposição de tropas para o combate. A explicitação de “batalha” torna o sentido claro sem alterar a imagem.
- source_word: מִשָּׁם
  choice: dali
  rationale: O advérbio aponta para o lugar em que as nações atacantes se dispõem contra a Babilônia. “Dali” é conciso e natural.
- source_word: תִּלָּכֵד
  choice: ela será capturada
  rationale: O nifal de לכד exprime ser tomada ou capturada. O pronome feminino retoma a Babilônia.
- source_word: חִצָּיו
  choice: Suas flechas
  rationale: O sufixo hebraico é masculino singular e pode retomar coletivamente a força invasora. “Suas” preserva em português a referência sem impor um antecedente pessoal específico.
- source_word: כְּגִבּוֹר מַשְׁכִּיל
  choice: como as de um guerreiro habilidoso
  rationale: משכיל pode comunicar perícia, discernimento ou êxito. No contexto de flechas eficazes, “habilidoso” é adequado; “as de” é uma pequena explicitação necessária para uma comparação natural em português.
- source_word: לֹא יָשׁוּב רֵיקָם
  choice: nenhuma voltará sem resultado
  rationale: A expressão significa literalmente “não voltará vazia”. A forma distributiva “nenhuma” relaciona o verbo singular às flechas e comunica sua eficácia, enquanto a nota preserva a construção alternativa ligada ao guerreiro.
theological_decisions:
- issue: Agência das nações invasoras
  choice: O próprio SENHOR é apresentado como aquele que desperta e traz as nações contra a Babilônia.
  alternative: Entender a passagem apenas como previsão descritiva, sem ênfase na causação divina.
  rationale: O pronome enfático de primeira pessoa, אָנֹכִי, acompanhado de dois particípios causativos, torna explícita a agência divina; a tradução não deve apagá-la.
- issue: Referente da oração “não voltará vazia”
  choice: 'A oração é ligada distributivamente às flechas: “nenhuma voltará sem resultado”.'
  alternative: 'Ligá-la ao guerreiro: “um guerreiro habilidoso que não volta de mãos vazias”.'
  rationale: A sintaxe hebraica é comprimida e admite tensão entre as flechas, no plural, e o guerreiro, no singular. O texto principal adota uma leitura contextual plausível, e a nota registra a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois eis que” conserva a força introdutória de כִּי הִנֵּה sem arcaísmo excessivo. Os pronomes femininos retomam com clareza “nações” e “Babilônia”, e as notas foram posicionadas junto às expressões que efetivamente explicam.
