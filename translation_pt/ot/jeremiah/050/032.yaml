id: JER.50.32
reference: Jeremiah 50:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָשַׁ֤ל זָדוֹן֙ וְ/נָפַ֔ל וְ/אֵ֥ין ל֖/וֹ מֵקִ֑ים וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה כָּל סְבִיבֹתָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/032.yaml
  text: And the arrogant one will stumble and fall[a], with no one to raise him up; and I will kindle a fire in his cities[b], and it will consume all around him.
translation:
  language: pt
  text: O arrogante tropeçará e cairá[a], sem ninguém que o levante. Porei fogo em suas cidades[b], e o fogo consumirá tudo ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o orgulho” ou “a insolência”. O hebraico זָדוֹן muitas vezes é abstrato, mas aqui foi traduzido de modo pessoal por causa dos verbos e pronomes masculinos singulares no contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “suas cidades”. O versículo personifica a Babilônia como uma figura masculina singular.'
    reason: cultural_note
lexical_decisions:
- source_word: זָדוֹן
  choice: o arrogante
  rationale: Embora o substantivo possa significar abstratamente “orgulho”, “arrogância” ou “insolência”, os verbos e pronomes masculinos singulares do contexto favorecem aqui uma designação pessoal e personificada.
- source_word: כָשַׁל
  choice: tropeçará
  rationale: O qatal no discurso profético tem valor futuro/resultativo neste anúncio de juízo; “tropeçará” conserva a imagem e combina naturalmente com “cairá”.
- source_word: נָפַל
  choice: e cairá
  rationale: Mantém a sequência coordenada do hebraico e intensifica a imagem da queda.
- source_word: מֵקִים
  choice: que o levante
  rationale: O particípio causativo de קום descreve alguém que faz o caído se levantar; a tradução preserva a imagem sem interpretá-la como restauração política.
- source_word: הִצַּתִּי אֵשׁ
  choice: Porei fogo
  rationale: Expressão portuguesa natural para o ato de atear ou acender fogo, mantendo o sentido explícito de juízo pelo fogo.
- source_word: בְּעָרָיו
  choice: em suas cidades
  rationale: Conserva a referência às cidades pertencentes à figura singular personificada, sem tornar a frase pesada em português.
- source_word: וְאָכְלָה
  choice: e o fogo consumirá
  rationale: A explicitação de “o fogo” torna clara em português a concordância feminina singular do verbo hebraico com אֵשׁ e mantém a força da imagem.
- source_word: כָּל סְבִיבֹתָיו
  choice: tudo ao redor dele
  rationale: Expressa de modo natural a totalidade do que cerca a figura masculina singular e preserva sua personificação.
theological_decisions:
- issue: Personificação da Babilônia por formas masculinas singulares
  choice: Manter a referência pessoal masculina (“o arrogante”, “o”, “dele”)
  alternative: Traduzir זָדוֹן abstratamente como “orgulho” ou tratar a Babilônia de modo impessoal
  rationale: A gramática hebraica mantém verbos e sufixos masculinos singulares, apresentando a Babilônia ou o arrogante como figura personificada. Preservar isso evita apagar uma tensão real do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide as duas ações de juízo em períodos claros. “Porei fogo” foi preferido a uma formulação mais rebuscada, enquanto “consumirá” preserva o tom solene.
