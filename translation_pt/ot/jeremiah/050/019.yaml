  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שֹׁבַבְתִּ֤י אֶת יִשְׂרָאֵל֙ אֶל נָוֵ֔/הוּ וְ/רָעָ֥ה הַ/כַּרְמֶ֖ל וְ/הַ/בָּשָׁ֑ן וּ/בְ/הַ֥ר אֶפְרַ֛יִם וְ/הַ/גִּלְעָ֖ד תִּשְׂבַּ֥ע נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/019.yaml
  text: And I will bring Israel back to his pasture[a], and he will graze on Carmel and Bashan; and on the hill country of Ephraim and Gilead his appetite will be satisfied.
translation:
  language: pt
  text: Eu trarei Israel de volta à sua pastagem, e ele pastará no Carmelo e em Basã; na região montanhosa de Efraim e em Gileade, seu apetite ficará satisfeito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “sua alma ficará satisfeita”.'
    reason: Alternativa lexical que preserva a forma mais literal de נַפְשׁוֹ e sua possível relevância antropológica.
lexical_decisions:
- source_word: וְשֹׁבַבְתִּי
  choice: Eu trarei ... de volta
  rationale: Expressa o sentido causativo de fazer Israel retornar e mantém o movimento concreto em direção à pastagem, sem perder a ideia de restauração.
- source_word: נָוֵהוּ
  choice: à sua pastagem
  rationale: Embora נָוֶה também possa significar morada ou redil, o contexto imediato de pastar favorece o sentido pastoral.
- source_word: וְרָעָה
  choice: e ele pastará
  rationale: Mantém a imagem de Israel como rebanho que se alimenta em terras férteis.
- source_word: הַכַּרְמֶל
  choice: no Carmelo
  rationale: Emprega a forma tradicional portuguesa do nome geográfico e a preposição natural exigida pelo contexto.
- source_word: הַבָּשָׁן
  choice: em Basã
  rationale: Emprega a forma tradicional portuguesa do nome da região.
- source_word: וּבְהַר אֶפְרַיִם
  choice: na região montanhosa de Efraim
  rationale: הַר pode designar não apenas um monte específico, mas uma região de montes; esta formulação comunica adequadamente a referência geográfica.
- source_word: וְהַגִּלְעָד
  choice: e em Gileade
  rationale: Emprega a forma tradicional portuguesa do nome regional; a preposição é retomada para clareza e fluidez.
- source_word: תִּשְׂבַּע נַפְשׁוֹ
  choice: seu apetite ficará satisfeito
  rationale: No contexto de alimentação e pastagem, נֶפֶשׁ refere-se ao ser vivente em seu desejo ou apetite, não necessariamente a uma alma imaterial. A tradução literal é preservada em nota.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O nome designa o povo como entidade coletiva personificada, tratado no hebraico por formas no singular.
theological_decisions:
- issue: Personificação e número pronominal de Israel
  choice: Manter Israel no singular, com “ele” e “seu”
  alternative: Usar formas plurais para representar os israelitas coletivamente
  rationale: O hebraico apresenta Israel como uma entidade coletiva personificada e usa formas verbais e pronominais no singular; a tradução preserva essa imagem.
- issue: Sentido de נֶפֶשׁ no contexto pastoral
  choice: Traduzir no texto principal como “apetite”
  alternative: Traduzir literalmente como “alma”
  rationale: “Apetite” comunica o sentido contextual ligado a comer e ficar saciado, evitando impor ao termo uma definição antropológica mais estreita. A alternativa literal permanece em nota para transparência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a metáfora pastoral, os nomes geográficos tradicionais e a personificação singular de Israel. O marcador da nota foi colocado após a expressão a que efetivamente se refere.
