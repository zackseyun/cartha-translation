source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵם֩ וּ/בָ/עֵ֨ת הַ/הִ֜יא נְאֻם יְהוָ֗ה יְבֻקַּ֞שׁ אֶת עֲוֺ֤ן יִשְׂרָאֵל֙ וְ/אֵינֶ֔/נּוּ וְ/אֶת חַטֹּ֥את יְהוּדָ֖ה וְ/לֹ֣א תִמָּצֶ֑אינָה כִּ֥י אֶסְלַ֖ח לַ/אֲשֶׁ֥ר אַשְׁאִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/020.yaml
  text: In those days and at that time, declares the LORD, the guilt of Israel will be sought, but there will be none, and the sins of Judah, but they will not be found; for I will forgive those whom I leave as a remnant.
translation:
  language: pt
  text: Naqueles dias e naquele tempo — declara o SENHOR —, será procurada a culpa de Israel, mas ela não existirá; e os pecados de Judá, mas não serão encontrados, pois perdoarei aqueles que eu deixar como remanescente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲוֺן
  choice: culpa
  rationale: O termo pode designar iniquidade, culpa ou a consequência dela. “Culpa” preserva aqui o foco naquilo que será procurado e já não existirá por causa do perdão divino.
- source_word: חַטֹּאת
  choice: pecados
  rationale: O plural hebraico refere-se diretamente aos pecados de Judá; a tradução simples e corrente mantém o paralelismo com a culpa de Israel.
- source_word: אֶסְלַח
  choice: perdoarei
  rationale: Equivalente direto e natural do verbo סלח, que expressa o perdão concedido por Deus.
- source_word: לַאֲשֶׁר אַשְׁאִיר
  choice: aqueles que eu deixar como remanescente
  rationale: A construção indica as pessoas que o SENHOR fará permanecer. A formulação explicita com naturalidade a ideia contextual de um remanescente sem transformar o termo em designação técnica.
theological_decisions:
- issue: Ausência futura da culpa e dos pecados
  choice: “não existirá” e “não serão encontrados”, ligados ao perdão declarado na oração final
  alternative: Entender que o texto afirma ausência de pecado inerente ou apagar a distinção entre culpa e pecados
  rationale: O versículo atribui a impossibilidade de encontrar culpa e pecados ao ato divino de perdoar. A tradução conserva essa relação sem explicar além do que o hebraico diz.
- issue: Identidade dos perdoados
  choice: “aqueles que eu deixar como remanescente”
  alternative: “o remanescente” ou “aqueles a quem eu poupar”
  rationale: O hebraico usa uma oração relativa e deixa Deus como agente de sua permanência. A escolha preserva essa forma e evita impor uma definição teológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “SENHOR” representa o Tetragrama conforme a convenção editorial apresentada. A pontuação destaca a fórmula profética sem alterar a estrutura paralela do hebraico.
