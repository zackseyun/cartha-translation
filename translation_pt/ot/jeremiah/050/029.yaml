source:
  edition: WLC
  text: הַשְׁמִ֣יעוּ אֶל בָּבֶ֣ל רַ֠בִּים כָּל דֹּ֨רְכֵי קֶ֜שֶׁת חֲנ֧וּ עָלֶ֣י/הָ סָבִ֗יב אַל יְהִי פְּלֵטָ֔ה שַׁלְּמוּ לָ֣/הּ כְּ/פָעֳלָ֔/הּ כְּ/כֹ֛ל אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָ֑/הּ כִּ֧י אֶל יְהוָ֛ה זָ֖דָה אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/029.yaml
  text: Summon many against Babylon[a], all who bend the bow; encamp around her on every side; let there be no escape. Repay her according to her work; according to all that she has done, do to her. For she has acted arrogantly against Yahweh, against the Holy One of Israel.
translation:
  language: pt
  text: Convoquem muitos contra a Babilônia, todos os que armam o arco. Acampem ao redor dela, por todos os lados; que não haja quem escape.[a] Retribuam-lhe segundo a sua obra; conforme tudo o que ela fez, façam-lhe o mesmo. Pois ela agiu com arrogância contra Yahweh, contra o Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que não haja sobrevivente” ou “que não reste nenhum fugitivo”. O termo hebraico pode indicar tanto a possibilidade de escapar como aqueles que escapam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: Convoquem
  rationale: O hifil imperativo de שמע introduz aqui uma ordem de mobilização militar. “Convoquem” expressa de modo natural o sentido causativo no contexto.
- source_word: רַבִּים
  choice: muitos
  rationale: Empregado substantivamente, refere-se a numerosos atacantes, sem exigir uma formulação mais enfática como “multidões”.
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: todos os que armam o arco
  rationale: A expressão designa arqueiros. “Armam o arco” preserva a imagem concreta do hebraico e soa natural em português.
- source_word: חֲנוּ עָלֶיהָ סָבִיב
  choice: Acampem ao redor dela, por todos os lados
  rationale: Mantém a força do imperativo e comunica o cerco completo indicado por סָבִיב.
- source_word: אַל יְהִי פְּלֵטָה
  choice: que não haja quem escape
  rationale: פְּלֵטָה pode indicar escape ou aqueles que escapam. A formulação escolhida preserva a ambiguidade entre o evento e as pessoas sem impor explicitamente o sentido de “nenhum sobrevivente”.
- source_word: שַׁלְּמוּ לָהּ
  choice: Retribuam-lhe
  rationale: O piel de שלם exprime retribuição. “Retribuam-lhe” conserva o tom judicial e solene do oráculo.
- source_word: כְּפָעֳלָהּ
  choice: segundo a sua obra
  rationale: Preserva a referência a פֹּעַל, “obra/feito”, e sua distinção lexical em relação à oração seguinte.
- source_word: כְּכֹל אֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: façam com ela tudo o que ela fez
  rationale: Reproduz com clareza a reciprocidade da ordem e mantém a repetição enfática do fazer.
- source_word: זָדָה
  choice: agiu com arrogância
  rationale: O verbo comunica orgulho insolente ou presunçoso manifestado em conduta, não apenas uma disposição interior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Mantém a forma tradicional e reconhecível desse título profético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de פְּלֵטָה no oráculo de juízo
  choice: que não haja quem escape
  alternative: que não haja sobrevivente; que não reste nenhum fugitivo
  rationale: O contexto de cerco favorece a ideia de impedir a fuga, mas o substantivo também pode designar os que escapam. A tradução e a nota preservam essa amplitude sem intensificar automaticamente a linguagem para aniquilação total.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativos no plural. A construção mantém o paralelismo e o tom judicial do hebraico, evitando linguagem excessivamente arcaica. O feminino retoma a cidade da Babilônia.
