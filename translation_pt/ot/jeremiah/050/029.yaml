review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a convocação militar, o cerco, a ausência de fuga, a retribuição e a acusação de arrogância contra Yahweh. Contudo, “façam com ela tudo o que ela fez” não expressa com suficiente precisão a construção distributiva/recíproca כְּכֹל אֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ (“conforme tudo o que ela fez, façam-lhe [o mesmo]”).
  naturalness: O português é moderno, claro e adequado ao registro profético. A revisão proposta torna a cláusula de retribuição mais idiomática e inequívoca.
  terminology: “Yahweh” reproduz corretamente o Tetragrama, e “o Santo de Israel” preserva o título profético. “Quem escape” e a nota mantêm, de modo apropriado, a ambiguidade de פְּלֵטָה entre fuga/escape e pessoas que escapam.
  issues:
  - severity: medium
    issue: Reciprocidade incompleta em “façam com ela tudo o que ela fez”.
    rationale: A formulação pode significar que se façam à Babilônia todas as ações que ela própria praticou, mas não explicita que isso deve ocorrer como retribuição proporcional. O hebraico introduz “conforme tudo o que ela fez” e ordena que se lhe faça correspondentemente. “Façam-lhe o mesmo” preserva a elipse natural do original e esclarece a reciprocidade.
  revised_text: Convoquem muitos contra a Babilônia, todos os que armam o arco. Acampem ao redor dela, por todos os lados; que não haja quem escape.[a] Retribuam-lhe segundo a sua obra; conforme tudo o que ela fez, façam-lhe o mesmo. Pois ela agiu com arrogância contra Yahweh, contra o Santo de Israel.
