  text: פָּתַ֤ח יְהוָה֙ אֶת א֣וֹצָר֔/וֹ וַ/יּוֹצֵ֖א אֶת כְּלֵ֣י זַעְמ֑/וֹ כִּי מְלָאכָ֣ה הִ֗יא לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/אֶ֥רֶץ כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/025.yaml
  text: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
translation:
  language: pt
  text: Javé abriu o seu depósito[a] e tirou as armas[b] da sua ira, pois esta é uma obra do Senhor Javé dos Exércitos[c] na terra dos caldeus.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o seu tesouro» ou «o seu arsenal».
    reason: lexical_alternative
  - marker: b
    text: Ou «os instrumentos da sua ira»; o termo hebraico pode designar objetos, utensílios ou equipamentos em geral, mas aqui provavelmente tem sentido militar.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, «Senhor DEUS dos Exércitos».
    reason: lexical_alternative
  - marker: d
    text: Ou «na terra da Caldeia».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para representar o nome divino, em vez de substituí-lo pelo título «SENHOR».
- source_word: פָּתַח
  choice: abriu
  rationale: O perfeito hebraico apresenta a ação como concluída; o pretérito perfeito é natural e vívido em português.
- source_word: אֹצָרוֹ
  choice: o seu depósito
  rationale: Preserva o sentido amplo de local onde algo é guardado, sem restringir antecipadamente o termo a «arsenal» ou «tesouro».
- source_word: וַיּוֹצֵא
  choice: e tirou de lá
  rationale: Expressa de modo natural o ato de fazer sair os objetos do depósito recém-mencionado.
- source_word: כְּלֵי זַעְמוֹ
  choice: as armas da sua ira
  rationale: Embora כְּלִי possa designar objetos, utensílios ou instrumentos em geral, o contexto de juízo militar favorece «armas»; «ira» mantém a força judicial de זַעַם.
- source_word: כִּי מְלָאכָה הִיא
  choice: pois esta é uma obra
  rationale: כִּי introduz a explicação, e «obra» conserva a amplitude de מְלָאכָה sem especificar indevidamente «missão» ou «tarefa».
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: do Senhor Javé dos Exércitos
  rationale: Mantém visíveis tanto o título אֲדֹנָי quanto o nome יְהוָה; «dos Exércitos» comunica o sentido de צְבָאוֹת em português corrente.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: na terra dos caldeus
  rationale: Segue literalmente a expressão etnográfica hebraica, sem convertê-la silenciosamente no topônimo «Caldeia».
theological_decisions:
- issue: Tradução do título composto אֲדֹנָי יְהוִה
  choice: Senhor Javé
  alternative: Senhor DEUS
  rationale: «Senhor Javé» preserva tanto o título quanto o nome divino e evita ocultar a ocorrência do tetragrama. A alternativa tradicional «Senhor DEUS» é possível, mas substitui o nome por um título.
- issue: Sentido militar de כְּלֵי זַעְמוֹ
  choice: armas da sua ira
  alternative: instrumentos da sua ira
  rationale: O contexto do juízo contra a Babilônia favorece a acepção militar, mas a nota preserva o sentido lexical mais amplo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário acessível internacionalmente e boa legibilidade brasileira. A formulação mantém a imagem concreta do depósito e conserva a expressão hebraica «terra dos caldeus» no texto principal.
