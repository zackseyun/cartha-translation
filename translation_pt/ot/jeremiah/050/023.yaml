  yaml_path: translation/ot/jeremiah/050/023.yaml
  text: How the hammer of the whole earth has been cut down and broken! How Babylon has become a desolation among the nations![a][b]
translation:
  language: pt
  text: Como foi derrubado e quebrado o martelo de toda a terra! Como Babilônia se tornou uma desolação entre as nações![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o martelo de guerra de toda a terra». A metáfora hebraica apresenta Babilônia como o instrumento esmagador usado contra as nações.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «se tornou motivo de horror entre as nações». O termo hebraico pode ressaltar tanto a desolação como o espanto horrorizado diante da ruína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação de espanto e lamento, não uma pergunta; «Como» preserva naturalmente essa força retórica.
- source_word: נִגְדַּע
  choice: foi derrubado
  rationale: O nifal de גדע indica ser cortado ou abatido. No contexto da metáfora do martelo, «derrubado» comunica a queda do poder de Babilônia sem sugerir literalmente que o martelo foi cortado.
- source_word: וַיִּשָּׁבֵר
  choice: e quebrado
  rationale: Mantém o sentido passivo e amplo de שבר e conserva a imagem do instrumento que acabou destruído.
- source_word: פַּטִּישׁ
  choice: o martelo
  rationale: É a correspondência direta e clara do substantivo hebraico e preserva a metáfora de Babilônia como instrumento esmagador.
- source_word: כָּל הָאָרֶץ
  choice: de toda a terra
  rationale: O contexto internacional, reforçado por «entre as nações», favorece «terra» em vez de «país».
- source_word: הָיְתָה לְשַׁמָּה
  choice: se tornou uma desolação
  rationale: Conserva o estado de ruína expresso pelo hebraico e sua dicção profética, sem excluir a nuance de assombro que acompanha a devastação.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Neste contexto geopolítico, גוים designa as nações em geral; a formulação evita a conotação teológica posterior de «gentios».
theological_decisions:
- issue: Identificação metafórica de Babilônia como «o martelo de toda a terra»
  choice: Manter diretamente a metáfora
  alternative: «o destruidor de toda a terra» ou «o martelo de guerra de toda a terra»
  rationale: 'A imagem hebraica é central à ironia do juízo: o instrumento que esmagava outros foi ele próprio derrubado e quebrado. Mantê-la evita substituir a figura por uma interpretação mais estreita.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção exclamativa repetida preserva a retórica hebraica; «desolação» mantém o registro profético sem arcaísmo excessivo.
