source:
  edition: WLC
  text: כִּ֣י עָלָה֩ עָלֶ֨י/הָ גּ֜וֹי מִ/צָּפ֗וֹן הֽוּא יָשִׁ֤ית אֶת אַרְצָ/הּ֙ לְ/שַׁמָּ֔ה וְ/לֹֽא יִהְיֶ֥ה יוֹשֵׁ֖ב בָּ֑/הּ מֵ/אָדָ֥ם וְ/עַד בְּהֵמָ֖ה נָ֥דוּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/003.yaml
  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
translation:
  language: pt
  text: Pois uma nação avançou contra ela, vindo do norte; fará da terra dela uma desolação, e ninguém habitará nela. Desde os seres humanos até os animais,[a] todos fugiram e foram embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Do ser humano ao animal”. A expressão hebraica indica a totalidade dos habitantes, tanto humanos como animais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da convocação anterior para anunciar a queda da Babilônia, preservando a função explicativa.
- source_word: עָלָה עָלֶיהָ
  choice: avançou contra ela
  rationale: A construção descreve o avanço militar hostil contra um lugar; esta formulação é natural e clara em português.
- source_word: גּוֹי
  choice: uma nação
  rationale: No contexto de invasão e juízo, designa uma entidade político-nacional.
- source_word: מִצָּפוֹן
  choice: vindo do norte
  rationale: Expressa a procedência da força invasora de maneira idiomática.
- source_word: הוּא יָשִׁית אֶת אַרְצָהּ לְשַׁמָּה
  choice: fará da sua terra uma desolação
  rationale: Preserva a construção de transformação em estado de devastação e mantém a referência a Babilônia personificada.
- source_word: וְלֹא יִהְיֶה יוֹשֵׁב בָּהּ
  choice: e ninguém habitará nela
  rationale: Comunica com naturalidade a ausência completa de moradores, sem perder a referência feminina à terra.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: Desde os seres humanos até os animais
  rationale: Reproduz a expressão de totalidade de forma clara e atual, abrangendo habitantes humanos e animais.
- source_word: נָדוּ הָלָכוּ
  choice: todos fugiram e foram embora
  rationale: 'Mantém os dois verbos hebraicos e sua progressão: fuga seguida de partida; ''todos'' explicita o sujeito coletivo já definido pela expressão anterior.'
theological_decisions:
- issue: Sentido genérico de אָדָם na expressão de totalidade
  choice: os seres humanos
  alternative: o homem
  rationale: Aqui אָדָם contrasta coletivamente a população humana com os animais, não um indivíduo masculino. A tradução conserva a abrangência do hebraico sem introduzir uma distinção teológica inexistente.
- issue: Personificação feminina da Babilônia
  choice: contra ela; sua terra
  alternative: contra a Babilônia; a terra dela
  rationale: O pronome feminino hebraico retoma Babilônia no contexto. O português mantém essa referência sem sobrecarregar o versículo com repetição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada em “vindo do norte” para evitar ambiguidade, e a expressão hebraica de totalidade foi preservada em formulação corrente.
