base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/046.yaml
  text: At the sound of Babylon being captured, the earth quakes, and a cry is heard among the nations.
translation:
  language: pt
  text: Ao som da captura da Babilônia, a terra estremece, e um clamor é ouvido entre as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  choice: Ao som
  rationale: Reproduz de modo natural a ideia causal/temporal de que a notícia ou o estrondo da captura provoca a reação descrita.
- source_word: נִתְפְּשָׂה בָבֶל
  choice: da captura da Babilônia
  rationale: O nifal de תפש indica que Babilônia é tomada ou capturada; a construção nominal em português mantém a concisão do verso.
- source_word: נִרְעֲשָׁה הָאָרֶץ
  choice: a terra estremece
  rationale: רעש descreve forte tremor ou abalo. 'Estremece' é claro, digno e preserva a possível dimensão tanto física quanto figurada de הָאָרֶץ.
- source_word: וּזְעָקָה
  choice: e um clamor
  rationale: זְעָקָה é um grito de aflição ou pedido de socorro; 'clamor' mantém sua intensidade sem especificar indevidamente a causa ou os emissores.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: é ouvido entre as nações
  rationale: Mantém a voz passiva e verte בַּגּוֹיִם naturalmente como âmbito no qual o clamor é ouvido.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: a região / o país
  rationale: O hebraico pode ter alcance amplo ou regional; 'a terra' preserva essa abertura e corresponde ao efeito internacional indicado por 'entre as nações'.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil; frase solene e concisa, sem arcaísmos nem explicitação interpretativa.
