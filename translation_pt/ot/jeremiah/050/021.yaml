  terminology: “Yahweh” corresponde à política indicada para o tetragrama. Merataim e Pecode são transliterações portuguesas coerentes de nomes próprios; as notas preservam com prudência o possível jogo de palavras. “Consagre-os à destruição”, com a nota sobre o “interdito”, representa de modo adequado o campo semântico técnico de חרם sem o reduzir a mera destruição comum.
