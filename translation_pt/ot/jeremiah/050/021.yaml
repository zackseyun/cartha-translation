id: JER.50.21
reference: Jeremiah 50:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל הָ/אָ֤רֶץ מְרָתַ֨יִם֙ עֲלֵ֣ה עָלֶ֔י/הָ וְ/אֶל יוֹשְׁבֵ֖י פְּק֑וֹד חֲרֹ֨ב וְ/הַחֲרֵ֤ם אַֽחֲרֵי/הֶם֙ נְאֻם יְהוָ֔ה וַ/עֲשֵׂ֕ה כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/021.yaml
  text: Go up against the land of Merathaim[a], against it, and against the inhabitants of Pekod. Put them to the sword and devote them to destruction after them, declares Yahweh[c][b], and do all that I have commanded you.
translation:
  language: pt
  text: Avance contra a terra de Merataim[a], contra ela e contra os habitantes de Pecode[b]. Passe-os à espada e, indo atrás deles, consagre-os à destruição[c] — declara Yahweh —, e faça tudo o que eu lhe ordenei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Merataim é provavelmente um nome simbólico para a Babilônia. Em hebraico, pode sugerir “dupla rebelião” ou, talvez, “dupla amargura”.
    reason: lexical_alternative
  - marker: b
    text: Pecode é o nome de um lugar ou povo; também pode evocar uma raiz hebraica relacionada a “castigo” ou “visitação”.
    reason: lexical_alternative
  - marker: c
    text: Ou “coloque-os sob o interdito”. O termo hebraico se refere a destinar algo à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרָתַיִם
  choice: Merataim
  rationale: O termo funciona como nome próprio de uma região associada à Babilônia. A transliteração preserva o nome e deixa seu provável jogo de palavras para a nota.
- source_word: עֲלֵה
  choice: Avance
  rationale: Em contexto militar, עלה indica subir ou marchar contra um alvo. “Avance” comunica naturalmente a ordem militar em português.
- source_word: יוֹשְׁבֵי
  choice: habitantes de
  rationale: O particípio de ישב designa coletivamente os que vivem em determinado lugar; “habitantes de” é claro e conciso.
- source_word: פְּקוֹד
  choice: Pecode
  rationale: É tratado como nome próprio de lugar ou povo. A forma aportuguesada preserva o nome, enquanto a possível evocação de פקד é registrada em nota.
- source_word: חֲרֹב
  choice: Passe-os à espada
  rationale: A forma imperativa elíptica transmite devastação violenta em contexto bélico. A expressão portuguesa explicita a ação militar sem suavizá-la.
- source_word: וְהַחֲרֵם
  choice: consagre-os à destruição
  rationale: O hifil de חרם expressa colocar sob o interdito, destinando algo à destruição. A formulação mantém o sentido técnico e sua gravidade.
- source_word: אַחֲרֵיהֶם
  choice: indo atrás deles
  rationale: A expressão é sintaticamente difícil e significa literalmente “atrás deles”. Esta formulação conserva a ideia provável de perseguição sem afirmar que a sintaxe seja mais precisa do que o hebraico permite.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e verte o tetragrama como o nome pessoal “Yahweh”, não como um título.
- source_word: וַעֲשֵׂה כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: e faça tudo o que eu lhe ordenei
  rationale: A expressão comunica de modo natural a abrangência de כְכֹל e o chamado à obediência integral.
theological_decisions:
- issue: Se a linguagem de juízo militar deve ser suavizada
  choice: Manter “passe-os à espada” e “consagre-os à destruição”.
  alternative: Empregar termos gerais como “derrote” ou apenas “destrua”.
  rationale: O hebraico contém linguagem forte de guerra e de interdição. Suavizá-la esconderia a severidade do oráculo; a tradução preserva essa tensão sem acrescentar uma justificativa teológica.
- issue: Como representar os nomes simbólicos מְרָתַיִם e פְּקוֹד
  choice: Transliterar como “Merataim” e “Pecode” no texto, explicando os possíveis jogos de palavras em notas.
  alternative: Traduzir os nomes como “Dupla Rebelião”, “Dupla Amargura” e “Castigo”.
  rationale: Os termos funcionam sintaticamente como nomes geográficos ou étnicos, mas provavelmente também carregam sentidos simbólicos. A transliteração evita decidir indevidamente entre referência literal e jogo de palavras.
- issue: Como tratar a expressão ambígua אַחֲרֵיהֶם
  choice: Preservar a imagem espacial com “indo atrás deles”.
  alternative: Interpretar explicitamente como “persiga-os” ou omitir a expressão.
  rationale: O hebraico é difícil e pode indicar perseguição ou continuação do juízo. A tradução mantém a ambiguidade básica em vez de impor uma única explicação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “Avance” para a ordem militar, “lhe” na comissão singular e formas aportuguesadas dos nomes. A construção incomum “indo atrás deles” é intencional, pois conserva uma dificuldade real do hebraico.
