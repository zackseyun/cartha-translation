  source_fidelity: 'O texto reproduz adequadamente a sequência imperativa do hebraico: o avanço contra Merataim e os habitantes de Pecode, a morte pela espada, a entrega à destruição, a fórmula profética e a ordem final de cumprir tudo o que foi ordenado. “Indo atrás deles” é uma solução cautelosa para אַחֲרֵיהֶם: mantém a noção espacial/de seguimento sem fixar indevidamente se a expressão indica perseguição ou consumação posterior do juízo.'
