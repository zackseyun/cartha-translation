  text: קֶ֣שֶׁת וְ/כִידֹ֞ן יַחֲזִ֗יקוּ אַכְזָרִ֥י הֵ֨מָּה֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/042.yaml
  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
translation:
  language: pt
  text: Empunham o arco e o dardo; são cruéis e não terão compaixão. O som deles ruge como o mar, e eles montam a cavalo, dispostos como um homem[a] para a batalha contra você, ó filha da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um só homem”, destacando a formação unificada do exército.
    reason: Alternativa lexical e idiomática para כְּאִישׁ.
lexical_decisions:
- source_word: קֶשֶׁת
  choice: arco
  rationale: O singular hebraico tem valor coletivo ou instrumental; o singular em português preserva naturalmente a imagem das armas empunhadas pelo exército.
- source_word: כִידֹן
  choice: dardo
  rationale: Designa uma arma de haste usada para arremesso ou estocada. “Dardo” mantém a distinção em relação ao arco e evita o sentido excessivamente amplo de “lança”.
- source_word: יַחֲזִיקוּ
  choice: empunham
  rationale: No contexto militar, a forma verbal indica tomar ou segurar armas prontas para uso. “Empunham” é vívido, natural e preciso em português.
- source_word: אַכְזָרִי
  choice: cruéis
  rationale: Descreve diretamente o caráter impiedoso dos invasores, reforçado pela oração seguinte.
- source_word: לֹא יְרַחֵמוּ
  choice: não terão compaixão
  rationale: Expressa de modo natural a ausência de misericórdia e conserva a orientação futura do contexto profético.
- source_word: קוֹלָם
  choice: o som deles
  rationale: קוֹל pode significar voz, som ou ruído. “Som” abrange naturalmente o estrondo coletivo do exército.
- source_word: כַיָּם יֶהֱמֶה
  choice: ruge como o mar
  rationale: O verbo descreve um som tumultuoso ou retumbante; “ruge” transmite com força e concisão a comparação com o mar.
- source_word: עַל סוּסִים יִרְכָּבוּ
  choice: eles cavalgam
  rationale: “Cavalgam” comunica idiomaticamente em português que montam cavalos, sem a redundância pouco natural de “cavalgam em cavalos”.
- source_word: עָרוּךְ
  choice: dispostos
  rationale: O particípio retrata tropas ordenadas e preparadas para o combate. “Dispostos” preserva tanto a ideia de formação quanto a de prontidão.
- source_word: כְּאִישׁ
  choice: como um homem
  rationale: Mantém o singular masculino e a imagem formal do hebraico, sem resolver no texto principal a possível ideia idiomática de unidade militar.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: “Batalha” é natural no cenário militar imediato e corresponde adequadamente ao substantivo hebraico.
- source_word: בַּת בָּבֶל
  choice: ó filha da Babilônia
  rationale: Preserva a personificação poética e explicita em português o vocativo do discurso dirigido à Babilônia.
theological_decisions:
- issue: Singular masculino na comparação militar כְּאִישׁ
  choice: como um homem
  alternative: como um só homem
  rationale: O texto principal conserva a forma singular masculina e sua imagem. Como a expressão também pode enfatizar a atuação unificada do exército, essa leitura é registrada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A linguagem militar é direta; o vocativo poético “ó filha da Babilônia” preserva a personificação hebraica. O marcador da nota foi colocado junto à expressão ambígua “como um homem”, e não junto à comparação com o mar.
