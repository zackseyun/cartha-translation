  text: כְּ/מַהְפֵּכַ֨ת אֱלֹהִ֜ים אֶת סְדֹ֧ם וְ/אֶת עֲמֹרָ֛ה וְ/אֶת שְׁכֵנֶ֖י/הָ נְאֻם יְהוָ֑ה לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/040.yaml
  text: As when God overthrew Sodom and Gomorrah and their neighboring towns[a], declares Yahweh, no man will live there[b], and no son of man will dwell in her.
translation:
  language: pt
  text: Assim como Deus destruiu Sodoma, Gomorra e as cidades vizinhas[a], declara Yahweh, ninguém habitará ali, e nenhum ser humano morará nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os vizinhos dela”; isto é, as cidades ou povoações vizinhas associadas a Sodoma e Gomorra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: Como quando Deus destruiu
  rationale: A preposição כְּ introduz uma comparação, e מַהְפֵּכָה descreve uma destruição ou reviravolta catastrófica. A formulação verbal é natural em português e preserva o sentido do hebraico.
- source_word: סְדֹם וְאֶת עֲמֹרָה וְאֶת שְׁכֵנֶיהָ
  choice: Sodoma e Gomorra e as cidades vizinhas
  rationale: שְׁכֵנֶיהָ significa literalmente “os vizinhos dela”. No contexto, refere-se aos povoados ou cidades próximos associados à destruição de Sodoma e Gomorra; “cidades vizinhas” explicita esse referente sem alterar o quadro regional.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é uma fórmula profética solene, adequadamente vertida por “declara”; o nome divino יהוה é transliterado como “Yahweh”.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: ninguém habitará ali
  rationale: ישׁב, neste contexto de desolação, significa habitar ou viver num lugar. אִישׁ tem aqui valor humano genérico; “ninguém” comunica com naturalidade a negação absoluta em português.
- source_word: וְלֹא יָגוּר בָּהּ בֶּן אָדָם
  choice: e nenhum ser humano morará nela
  rationale: גור pode significar residir ou permanecer como forasteiro. “Morará” preserva a ideia locativa sem impor residência temporária. בֶּן אָדָם é uma expressão humana genérica neste paralelismo e é vertida naturalmente por “ser humano”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome divino pessoal. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de בֶּן אָדָם neste paralelismo
  choice: ser humano
  alternative: filho do homem
  rationale: Aqui a expressão não funciona como título messiânico, mas como designação poética genérica de um humano, em paralelo com אִישׁ. A tradução escolhida evita uma associação titular indevida.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A mudança de “ali” para “nela” acompanha a alternância dêitica e o referente feminino do hebraico, provavelmente a terra ou cidade julgada no contexto.
