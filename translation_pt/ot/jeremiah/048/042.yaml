  text: וְ/נִשְׁמַ֥ד מוֹאָ֖ב מֵ/עָ֑ם כִּ֥י עַל יְהוָ֖ה הִגְדִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/042.yaml
  text: And Moab will be destroyed as a people[a], because he magnified himself against Yahweh.
translation:
  language: pt
  text: Moabe será destruído como povo, porque se engrandeceu[a] contra Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez-se grande”, isto é, exaltou-se com arrogância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַד
  choice: será destruído
  rationale: O nifal perfeito de שׁמד, neste anúncio profético, tem sentido futuro e conserva a voz passiva sem sugerir necessariamente aniquilação absoluta.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֵעָם
  choice: como povo
  rationale: A preposição מִן com עַם indica a perda da condição de povo; a expressão comunica que Moabe deixará de existir como entidade nacional distinta.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a causa do juízo em português contemporâneo.
- source_word: עַל
  choice: contra
  rationale: Neste contexto de exaltação hostil, expressa oposição dirigida a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הִגְדִּיל
  choice: se engrandeceu
  rationale: Preserva de modo natural o idioma hebraico de autoexaltação e sua conotação de arrogância no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da exaltação de Moabe
  choice: se engrandeceu contra Yahweh
  alternative: agiu com arrogância contra Yahweh
  rationale: A formulação mantém a imagem e a tensão do hebraico, enquanto o contexto deixa claro que se trata de autoexaltação arrogante.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe concisa. “Como povo” preserva a ideia de perda da identidade nacional, e “se engrandeceu” mantém a imagem hebraica sem recorrer a linguagem excessivamente técnica.
