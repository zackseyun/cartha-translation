revisions:
- from: Abandonem as cidades e habitem entre os rochedos, ó habitantes de Moabe. Sejam como a pomba que faz o ninho nas encostas junto à entrada do abismo.[a]
  to: Deixem as cidades e habitem no rochedo, habitantes de Moabe; sejam como a pomba que faz ninho nos lados da abertura de uma cova.[a]
  rationale: A revisão restaura o singular de «rochedo», evita a intensificação indevida de «abismo» e traduz mais diretamente os «lados da abertura» da cova. Também ajusta a nota para apresentar alternativas semanticamente defensáveis sem afirmar como certo o sentido de armadilha.
