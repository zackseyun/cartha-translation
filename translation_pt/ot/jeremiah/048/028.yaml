review_pass:
  verdict: revise
  source_fidelity: A tradução preserva o imperativo, o vocativo e a comparação com a pomba, mas altera alguns pormenores espaciais e lexicais relevantes. בַּסֶּלַע é singular, «no rochedo/na rocha», não «entre os rochedos». «Abismo» torna פַּחַת mais específico e intenso do que «cova» ou «fosso». «Encostas junto à entrada» também não reproduz de modo suficientemente direto a ideia de lados da abertura.
  naturalness: O português é fluente e de registro apropriado. A revisão proposta conserva essa fluência, com formulações mais próximas da imagem hebraica.
  terminology: «Moabe» e «pomba» estão adequados. «Deixem» traduz o imperativo sem a intensidade adicional que «abandonem» pode sugerir. «Rochedo» traduz naturalmente o singular סֶלַע; «cova» mantém a amplitude de פַּחַת, enquanto a possível conotação de armadilha fica na nota.
  issues:
  - severity: medium
    issue: «entre os rochedos» pluraliza e altera a relação espacial de בַּסֶּלַע.
    rationale: O hebraico traz «no rochedo/na rocha», no singular. A imagem é de refúgio no rochedo, não genericamente entre várias formações rochosas.
  - severity: medium
    issue: «abismo» é excessivamente específico para פַּחַת.
    rationale: O termo designa uma cova ou fosso e pode ter o sentido de cova-armadilha. «Abismo» introduz a noção de profundidade extrema que o hebraico não exige.
  - severity: medium
    issue: «nas encostas junto à entrada» interpreta livremente בְּעֶבְרֵי פִּי.
    rationale: A expressão aponta para os lados ou margens da abertura (“boca”) da cova. A redação revista preserva essa relação espacial sem acrescentar «junto a».
  revised_text: Deixem as cidades e habitem no rochedo, habitantes de Moabe; sejam como a pomba que faz ninho nos lados da abertura de uma cova.[a]
