base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/028.yaml
  text: Leave the cities and dwell in the rock[a], inhabitants of Moab, and be like a dove that nests on the sides of the mouth of a pit.
translation:
  language: pt
  text: Deixem as cidades e habitem no rochedo, habitantes de Moabe; sejam como a pomba que faz ninho nos lados da abertura de uma cova.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de uma cova-armadilha” ou “de um fosso”. O termo hebraico pode designar uma cova usada como armadilha, o que reforça a imagem de um refúgio precário.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ עָרִים
  choice: Abandonem as cidades
  rationale: O imperativo plural exige a saída dos centros urbanos ameaçados. “Abandonem” comunica com naturalidade a urgência da ordem profética, sem necessariamente acrescentar a ideia de renúncia moral.
- source_word: וְשִׁכְנוּ בַּסֶּלַע
  choice: e habitem entre os rochedos
  rationale: שׁכן indica habitar ou estabelecer-se, enquanto סלע designa rocha, rochedo ou penhasco. O plural idiomático “entre os rochedos” apresenta com clareza o terreno rochoso como refúgio.
- source_word: יֹשְׁבֵי מוֹאָב
  choice: ó habitantes de Moabe
  rationale: Mantém o vocativo dirigido ao povo de Moabe; “ó” torna essa função sintática inequívoca e conserva o registro profético digno.
- source_word: וִהְיוּ כְיוֹנָה
  choice: Sejam como a pomba
  rationale: Reproduz diretamente o imperativo e a comparação, preservando o singular coletivo ou representativo da imagem hebraica.
- source_word: תְּקַנֵּן
  choice: que faz o ninho
  rationale: O piel imperfeito feminino singular concorda com “pomba”. “Faz o ninho” é uma formulação corrente e clara em português.
- source_word: בְּעֶבְרֵי פִי פָחַת
  choice: nas encostas junto à entrada do abismo
  rationale: עֶבְרֵי pode indicar lados, margens ou regiões laterais; פִּי é literalmente “boca”, isto é, a abertura; פחת denota uma cavidade profunda e pode também sugerir uma cova-armadilha. A formulação oferece uma imagem espacial natural sem eliminar a precariedade do refúgio.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Conserva o tom imperativo e poético do oráculo. A divisão em duas frases melhora a clareza oral; o vocativo com “ó” mantém dignidade sem arcaísmo excessivo. O marcador [a] aparece no texto principal.
