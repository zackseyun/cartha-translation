  text: וְ/שַׁבְתִּ֧י שְׁבוּת מוֹאָ֛ב בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים נְאֻם יְהוָ֑ה עַד הֵ֖נָּה מִשְׁפַּ֥ט מוֹאָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/047.yaml
  text: Yet I will restore the fortunes of Moab in the latter days[a], declares Yahweh. Thus far is the judgment of Moab.
translation:
  language: pt
  text: Contudo, restaurarei a sorte de Moabe nos últimos dias[a] — declara Yahweh. Até aqui, o julgamento de Moabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trarei de volta os cativos de Moabe”; a expressão idiomática hebraica pode indicar a restauração após o cativeiro ou, em sentido mais amplo, a reversão da sorte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי שְׁבוּת
  choice: Contudo, restaurarei a sorte
  rationale: A expressão idiomática com שוב e שׁבות indica reversão da calamidade, podendo abranger tanto o retorno do cativeiro quanto uma restauração mais ampla. “Contudo” expressa a virada em relação ao juízo anterior.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome nacional em português.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  rationale: Preserva a ressonância bíblica e a possível dimensão escatológica da expressão, sem determinar quando ou como ela se cumpre.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e naturalidade a fórmula profética, mantendo o nome divino.
- source_word: עַד הֵנָּה
  choice: Até aqui
  rationale: Expressão concisa que assinala o encerramento do oráculo contra Moabe.
- source_word: מִשְׁפַּט
  choice: o julgamento
  rationale: No contexto, designa o pronunciamento judicial contra Moabe, e não a justiça em sentido abstrato.
theological_decisions:
- issue: Alcance da restauração prometida a Moabe
  choice: Apresentar como uma promessa genuína de restauração futura, sem especificar seu mecanismo ou alcance teológico.
  alternative: Entendê-la exclusivamente como reversão política histórica ou, de modo específico, como inclusão escatológica das nações.
  rationale: O hebraico promete restauração e a situa “nos últimos dias”, mas o versículo não define se o cumprimento é histórico, escatológico ou tipológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão do encerramento do oráculo e a ambiguidade da expressão hebraica de restauração.
